# =============================================================================
# PRD Benchmark Seed Tables — Task 2122: Jingle & Commercial Music Production
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2122. Jingle & Commercial Music Production (commercial music house): creative brief & demo development, client selection & revision rounds, session musician booking & AFM signatory obligations, licensing structure (buyout vs term) & renewal, cue sheet & performance royalty registration, stem delivery & alternate lengths, re-use fee on new markets, library vs custom cost comparison

domain_name: jingle-commercial-music
api_prefix: "/"

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - ops_run_checkpoint
    - selector_policy

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit foreign keys.
  # No nesting beyond one action segment; children are discovered through
  # filtered lists or a single sub-resource GET.

  state_machine_shape: cyclic
  # Demo carries a revision loop (SUBMITTED -> REVISION_REQUESTED -> SUBMITTED),
  # LicenseDeal carries BOTH a negotiation loop (PROPOSED -> DRAFT -> PROPOSED)
  # and a renewal loop (ACTIVE -> RENEWAL_DUE -> ACTIVE), Deliverable carries two
  # independent parallel state dimensions on one row, SessionCall branches into
  # three divergent terminal outcomes.

  relationship_patterns:
    - one_to_many        # Project -> Demo / SessionCall / CreativeBrief
    - many_to_many       # MusicianBooking joins SessionCall x Musician
    - cross_aggregate    # CueSheetEntry -> Composer crosses the delivery aggregate

  role_model: segregation_of_duties
  # The RightsAdmin operator who drafted a LicenseDeal may not be the operator
  # who activates it (LicenseDeal.drafted_by_user_id vs X-User-ID on activate).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Advertiser or agency legal name."
      - name: agency_code
        type: string
        source: input
        description: "Short buyer code used on invoices."
        constraints: "1-16 chars; unique across all Clients"
      - name: billing_email
        type: string
        source: input
        description: "Accounts-payable contact address."

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the advertiser this campaign engagement belongs to. A ClientRep may act on this Project only when X-User-ID equals this value."
      - name: title
        type: string
        source: input
        description: "Campaign title, e.g. 'Autumn Refresh 2026'."
      - name: budget_cents
        type: integer
        source: input
        description: "Total approved production budget in cents. Immutable after creation."
        constraints: "integer > 0"
      - name: committed_cents
        type: integer
        source: computed
        description: "Cents reserved for live demo reservations and CONFIRMED SessionCalls but not yet settled."
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "Cents neither committed nor spent. Maintained by calculations.project_budget_ledger."
        default: "equal to budget_cents at creation"
      - name: spent_cents
        type: integer
        source: computed
        description: "Cents irrevocably settled (selected demo fees, completed sessions, inside-window cancellation liabilities)."
        default: 0
      - name: budget_posture
        type: enum
        source: computed
        description: "Derived gate recomputed by calculations.project_budget_posture after every ledger movement and every Project status change."
        default: HEALTHY
        constraints: "HEALTHY | CONSTRAINED | FROZEN"
      - name: status
        type: enum
        source: system
        description: "Lifecycle stage of the engagement."
        default: DRAFT
        constraints: "DRAFT | BRIEFING | IN_DEMO | IN_PRODUCTION | DELIVERED | CLOSED | ON_HOLD"
      - name: status_before_hold
        type: enum
        source: system
        description: "Status snapshot captured when the Project entered ON_HOLD; POST /projects/{id}/resume restores exactly this value. Null whenever status != ON_HOLD."
        default: null
        constraints: "BRIEFING | IN_DEMO | IN_PRODUCTION | null"
      - name: delivery_deadline_utc
        type: datetime
        source: input
        description: "Client air-date deadline, ISO 8601 UTC."

  - name: CreativeBrief
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the engagement this brief scopes."
      - name: tempo_bpm
        type: integer
        source: input
        description: "Target tempo in beats per minute."
        constraints: "40 <= tempo_bpm <= 240"
      - name: mood_tags
        type: array
        source: input
        description: "Free-form mood descriptors used by composers."
        constraints: "array of strings, length >= 1"
      - name: target_markets
        type: array
        source: input
        description: "Market codes the client intends to license. Every element must be a key of calculations.license_fee.constants.MARKET_TIER_MAP."
        constraints: "array of strings, length >= 1, no duplicates"
      - name: required_lengths
        type: array
        source: input
        description: "Alternate cut lengths in seconds that the final Deliverable must carry."
        constraints: "array of integers, length >= 1, each in {60, 30, 15, 6}, no duplicates"
      - name: reference_track_url
        type: string
        source: input
        description: "Optional client reference recording."
        default: null
      - name: status
        type: enum
        source: system
        description: "Brief lifecycle."
        default: DRAFT
        constraints: "DRAFT | APPROVED | SUPERSEDED"
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant at which a ClientRep approved this brief; null while DRAFT or SUPERSEDED."
        default: null

  - name: Composer
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Writer name as it appears on the cue sheet."
      - name: pro_affiliation
        type: enum
        source: input
        description: "Performing-rights organisation the writer is registered with."
        constraints: "ASCAP | BMI | SESAC | NONE"

  - name: Demo
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the engagement this demo competes in."
      - name: composer_id
        type: string
        source: system
        description: "FK -> Composer.id; taken from the X-User-ID header of the Composer who created the demo, never from the request body."
      - name: title
        type: string
        source: input
        description: "Working title of the demo."
      - name: demo_fee_cents
        type: integer
        source: input
        description: "Fee the music house reserves against the Project the moment the demo is created."
        constraints: "integer > 0"
      - name: submitted_length_seconds
        type: integer
        source: input
        description: "Length of the demo cut in seconds."
        constraints: "integer > 0"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of completed revision rounds. Incremented by POST /demos/{id}/request-revision."
        default: 0
      - name: accrued_fee_cents
        type: integer
        source: computed
        description: "demo_fee_cents plus every revision surcharge booked so far; this is the exact amount held in Project.committed_cents for this demo."
        default: "equal to demo_fee_cents at creation"
      - name: last_revision_note
        type: string
        source: system
        description: "Note supplied on the most recent revision request; null before the first."
        default: null
      - name: selected_at
        type: datetime
        source: system
        description: "Logical-clock instant of selection; null unless status == SELECTED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Demo lifecycle, including the revision cycle."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | SHORTLISTED | SELECTED | ARCHIVED"

  - name: Musician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Session player name."
      - name: instrument
        type: string
        source: input
        description: "Primary instrument."
      - name: scale_hourly_cents
        type: integer
        source: input
        description: "AFM hourly scale rate in cents for this player."
        constraints: "integer > 0"
      - name: afm_member_status
        type: enum
        source: system
        description: "AFM signatory standing. Only an AFMSteward may change it, via POST /musicians/{id}/afm-clearance."
        default: NON_UNION
        constraints: "SIGNATORY_CLEARED | NON_UNION | SUSPENDED"

  - name: StudioRoom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Tracking room name."
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Room rental rate per hour in cents."
        constraints: "integer > 0"
      - name: capacity_players
        type: integer
        source: input
        description: "Maximum number of MusicianBookings a single SessionCall in this room may carry."
        constraints: "integer > 0"
      - name: status
        type: enum
        source: input
        description: "Room availability."
        default: ACTIVE
        constraints: "ACTIVE | MAINTENANCE"

  - name: SessionCall
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the engagement that pays for this call."
      - name: studio_room_id
        type: string
        source: input
        description: "FK -> StudioRoom.id; the room occupied for the scheduled window."
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Downbeat, ISO 8601 UTC."
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Scheduled wrap, ISO 8601 UTC; must be strictly after scheduled_start_utc."
      - name: actual_end_utc
        type: datetime
        source: system
        description: "Wrap time supplied on POST /session-calls/{id}/complete; null until completion."
        default: null
      - name: scheduled_hours
        type: number
        source: computed
        description: "(scheduled_end_utc - scheduled_start_utc) in hours, exact to 4 decimal places."
      - name: billed_hours
        type: number
        source: computed
        description: "(actual_end_utc - scheduled_start_utc) in hours after completion; equals scheduled_hours before completion."
      - name: studio_cost_cents
        type: integer
        source: computed
        description: "Room rental component of the call; see calculations.session_committed_estimate."
        default: 0
      - name: wage_estimate_cents
        type: integer
        source: computed
        description: "Sum of the per-booking wage lines evaluated against scheduled_hours."
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: "studio_cost_cents + wage_estimate_cents frozen at the moment of confirmation; this exact amount sits in Project.committed_cents while the call is CONFIRMED."
        default: 0
      - name: wage_total_cents
        type: integer
        source: computed
        description: "Sum of MusicianBooking.line_wage_cents after completion; 0 before."
        default: 0
      - name: settled_total_cents
        type: integer
        source: computed
        description: "Amount moved into Project.spent_cents when the call reached a terminal state."
        default: 0
      - name: wage_liability_cents
        type: integer
        source: computed
        description: "Wages still owed to players on an inside-window cancellation; 0 otherwise."
        default: 0
      - name: cancelled_at
        type: datetime
        source: system
        description: "Logical-clock instant of cancellation; null unless cancelled."
        default: null
      - name: status
        type: enum
        source: system
        description: "Call lifecycle with a budget-suspension side branch and three divergent terminal outcomes."
        default: SCHEDULED
        constraints: "SCHEDULED | SUSPENDED_BUDGET | CONFIRMED | COMPLETED | CANCELLED_INSIDE_WINDOW | CANCELLED_OUTSIDE_WINDOW"

  - name: MusicianBooking
    parent: null
    common_fields: true
    fields:
      - name: session_call_id
        type: string
        source: input
        description: "FK -> SessionCall.id; the call this player is booked on."
      - name: musician_id
        type: string
        source: input
        description: "FK -> Musician.id; the booked player."
      - name: is_leader
        type: boolean
        source: input
        description: "True when this player is the session leader; leader lines are paid at AFM_LEADER_MULTIPLIER."
        default: false
      - name: doubles_count
        type: integer
        source: input
        description: "Number of additional instruments doubled on this call."
        default: 0
        constraints: "0 <= doubles_count <= 4"
      - name: line_wage_cents
        type: integer
        source: computed
        description: "Wage owed for this line; written on completion or on inside-window cancellation."
        default: 0
      - name: pension_health_cents
        type: integer
        source: computed
        description: "AFM pension and health contribution for this line, rounded at line level."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Booking settlement state, driven entirely by the parent SessionCall."
        default: BOOKED
        constraints: "BOOKED | WAGE_ACCRUED | PENALTY_ACCRUED | RELEASED"

  - name: LicenseDeal
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the engagement being licensed."
      - name: demo_id
        type: string
        source: input
        description: "FK -> Demo.id; the SELECTED demo whose music this deal grants."
      - name: license_structure
        type: enum
        source: input
        description: "Commercial shape of the grant."
        constraints: "BUYOUT | TERM"
      - name: term_months
        type: integer
        source: input
        description: "Length of a TERM grant in months. Required when license_structure == TERM, forbidden when BUYOUT."
        default: null
        constraints: "integer in {12, 24, 36} when present"
      - name: market_codes
        type: array
        source: input
        description: "Market codes actually granted by this deal. Every element must be a key of calculations.license_fee.constants.MARKET_TIER_MAP. Extended in place by an accepted ReuseExtension."
        constraints: "array of strings, length >= 1, no duplicates"
      - name: creative_fee_cents
        type: integer
        source: input
        description: "Composer creative fee that both fee variants scale from."
        constraints: "integer > 0"
      - name: license_fee_quoted_cents
        type: integer
        source: computed
        description: "Forward-looking quote produced by the QUOTED_AT_DRAFT variant of calculations.license_fee, recomputed on every DRAFT re-entry."
        default: 0
      - name: license_fee_invoiced_cents
        type: integer
        source: computed
        description: "Chronological invoice produced by the INVOICED_AT_ACTIVATION variant of calculations.license_fee; 0 until activation, then recomputed on every reuse extension and renewal."
        default: 0
      - name: renewal_count
        type: integer
        source: computed
        description: "Number of completed renewals."
        default: 0
      - name: renewal_fee_cents
        type: integer
        source: computed
        description: "Fee charged by the most recent renewal; 0 before the first renewal."
        default: 0
      - name: counter_round_count
        type: integer
        source: computed
        description: "Number of times a ClientRep pushed the deal back from PROPOSED to DRAFT."
        default: 0
      - name: effective_start_utc
        type: datetime
        source: system
        description: "Logical-clock instant at activation, or at the most recent renewal; null before activation."
        default: null
      - name: effective_end_utc
        type: datetime
        source: system
        description: "effective_start_utc + term_months * 30 days for a TERM deal; null for a BUYOUT deal (perpetual)."
        default: null
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RightsAdmin operator who created the deal. Segregation of duties compares this against the activating operator."
      - name: activated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RightsAdmin operator who activated the deal; null before activation."
        default: null
      - name: status
        type: enum
        source: system
        description: "Deal lifecycle carrying a negotiation loop and a renewal loop."
        default: DRAFT
        constraints: "DRAFT | PROPOSED | ACCEPTED | ACTIVE | RENEWAL_DUE | LAPSED | SUPERSEDED"

  - name: ReuseExtension
    parent: null
    common_fields: true
    fields:
      - name: license_deal_id
        type: string
        source: input
        description: "FK -> LicenseDeal.id; the ACTIVE deal being extended into a new market."
      - name: market_code
        type: string
        source: input
        description: "New market code being licensed. Must be a key of calculations.license_fee.constants.MARKET_TIER_MAP and must not already appear in LicenseDeal.market_codes."
      - name: market_tier
        type: enum
        source: computed
        description: "Tier of market_code resolved through MARKET_TIER_MAP."
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: reuse_base_cents
        type: integer
        source: computed
        description: "Pre-admin re-use subtotal; step 1 of calculations.reuse_fee."
      - name: admin_pct
        type: integer
        source: computed
        description: "Administration percentage band selected from reuse_base_cents; step 2 of calculations.reuse_fee."
        constraints: "5 | 7 | 10"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Administration fee; step 3 of calculations.reuse_fee."
      - name: reuse_total_cents
        type: integer
        source: computed
        description: "reuse_base_cents + admin_fee_cents; step 4 of calculations.reuse_fee."
      - name: status
        type: enum
        source: system
        description: "Extension state; an extension is ACTIVE from the moment it is created."
        default: ACTIVE
        constraints: "ACTIVE"

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - name: license_deal_id
        type: string
        source: input
        description: "FK -> LicenseDeal.id; the deal whose music this package delivers. At most one Deliverable per LicenseDeal."
      - name: master_status
        type: enum
        source: system
        description: "Audio-delivery dimension. Evolves independently of cuesheet_status on the same row."
        default: PENDING
        constraints: "PENDING | STEMS_DELIVERED | CLIENT_APPROVED"
      - name: cuesheet_status
        type: enum
        source: system
        description: "Performance-royalty dimension. Evolves independently of master_status on the same row."
        default: NOT_FILED
        constraints: "NOT_FILED | FILED | REGISTERED"
      - name: delivered_lengths
        type: array
        source: system
        description: "Alternate cut lengths in seconds actually delivered; written by POST /deliverables/{id}/stems."
        default: []
      - name: stem_manifest
        type: array
        source: system
        description: "Stem names actually delivered; written by POST /deliverables/{id}/stems."
        default: []
      - name: unallocated_bps
        type: integer
        source: computed
        description: "Performance-royalty basis points not currently attached to any ALLOCATED CueSheetEntry. 10000 when no entry is ALLOCATED, otherwise 0."
        default: 10000
      - name: registered_at
        type: datetime
        source: system
        description: "Logical-clock instant of PRO registration; null unless cuesheet_status == REGISTERED."
        default: null

  - name: CueSheetEntry
    parent: null
    common_fields: true
    fields:
      - name: deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id; the cue sheet this writer line belongs to."
      - name: composer_id
        type: string
        source: input
        description: "FK -> Composer.id; the writer credited on this line."
      - name: role
        type: enum
        source: input
        description: "Credit role on the cue sheet."
        constraints: "COMPOSER | ARRANGER | PUBLISHER"
      - name: declared_weight
        type: integer
        source: input
        description: "Relative weight used by the basis-point waterfall."
        constraints: "integer >= 1"
      - name: share_bps
        type: integer
        source: computed
        description: "Performance-royalty share in basis points; recomputed across all ALLOCATED entries of the Deliverable on every add and every void. 0 while VOIDED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Entry state."
        default: ALLOCATED
        constraints: "ALLOCATED | VOIDED"

  - name: LibraryTrack
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Production-library cue title."
      - name: blanket_fee_cents
        type: integer
        source: input
        description: "Flat licence component of the library quote."
        constraints: "integer >= 0"
      - name: per_market_fee_cents
        type: integer
        source: input
        description: "Additional charge per market code."
        constraints: "integer >= 0"
      - name: max_markets
        type: integer
        source: input
        description: "Largest number of markets this track may be cleared for."
        constraints: "integer >= 1"
      - name: min_length_seconds
        type: integer
        source: input
        description: "Shortest cut the library can supply for this track."
        constraints: "integer >= 1"
      - name: status
        type: enum
        source: input
        description: "Catalogue availability."
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: BRIEFING
        trigger: "POST /projects/{id}/briefs"
        actor: MusicHouseProducer
        preconditions:
          - "Project.status IN {DRAFT, BRIEFING}"
        side_effects:
          - "A CreativeBrief is created with status DRAFT"
          - "Every pre-existing CreativeBrief of this Project with status == DRAFT becomes SUPERSEDED, processed in created_at ASC order"
          - "Project.budget_posture recomputed by calculations.project_budget_posture"
        note: "Brief creation is accepted from both DRAFT and BRIEFING; the Project status edge itself fires only on the first brief, a later brief leaves the Project in BRIEFING and merely supersedes its DRAFT siblings."
      - from: BRIEFING
        to: IN_DEMO
        trigger: "POST /briefs/{id}/approve"
        actor: ClientRep
        preconditions:
          - "Project.status == BRIEFING"
          - "CreativeBrief.status == DRAFT"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "CreativeBrief.status := APPROVED and CreativeBrief.approved_at := logical clock"
          - "Every other CreativeBrief of this Project with status == DRAFT becomes SUPERSEDED, processed in created_at ASC order"
      - from: IN_DEMO
        to: IN_PRODUCTION
        trigger: "POST /demos/{id}/select"
        actor: ClientRep
        preconditions:
          - "Project.status == IN_DEMO"
          - "Demo.status == SHORTLISTED"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "CASCADE HOP 1: Demo.status := SELECTED, Demo.selected_at := logical clock, and Demo.accrued_fee_cents moves out of Project.committed_cents into Project.spent_cents"
          - "CASCADE HOP 2 (caused by hop 1): because a Demo of this Project reached SELECTED, Project.status := IN_PRODUCTION"
          - "CASCADE HOP 3 (caused by hop 2): because the Project left IN_DEMO, every sibling Demo of this Project whose status is in {DRAFT, SUBMITTED, REVISION_REQUESTED, SHORTLISTED} becomes ARCHIVED, processed in created_at ASC order"
          - "CASCADE HOP 4 (caused by hop 3): because those siblings became ARCHIVED, each archived Demo's accrued_fee_cents is released — Project.committed_cents decreases and Project.available_cents increases by the same amount, per sibling"
          - "CASCADE HOP 5 (caused by hop 4): because Project.available_cents changed, Project.budget_posture is recomputed by calculations.project_budget_posture; if the posture becomes HEALTHY every SessionCall of this Project in SUSPENDED_BUDGET returns to SCHEDULED"
      - from: IN_PRODUCTION
        to: DELIVERED
        trigger: "POST /deliverables/{id}/approve-master"
        actor: ClientRep
        preconditions:
          - "Project.status == IN_PRODUCTION"
          - "Deliverable.master_status == STEMS_DELIVERED"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "Deliverable.master_status := CLIENT_APPROVED"
        note: "Only the master dimension gates this transition; Deliverable.cuesheet_status is irrelevant here."
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /deliverables/{id}/register-cue-sheet"
        actor: RightsAdmin
        preconditions:
          - "Project.status == DELIVERED"
          - "Deliverable.cuesheet_status == FILED"
          - "LicenseDeal.status == ACTIVE"
        side_effects:
          - "Deliverable.cuesheet_status := REGISTERED and Deliverable.registered_at := logical clock"
        note: "Registration is permitted while the Project is still IN_PRODUCTION; in that case the cue-sheet dimension advances and the Project simply does not transition."
      - from: BRIEFING
        to: ON_HOLD
        trigger: "POST /projects/{id}/hold"
        actor: MusicHouseProducer
        preconditions:
          - "Project.status IN {BRIEFING, IN_DEMO, IN_PRODUCTION}"
        side_effects:
          - "Project.status_before_hold := BRIEFING"
          - "Project.budget_posture := FROZEN"
          - "Every SessionCall of this Project with status == SCHEDULED becomes SUSPENDED_BUDGET, processed in scheduled_start_utc ASC then created_at ASC order"
      - from: IN_DEMO
        to: ON_HOLD
        trigger: "POST /projects/{id}/hold"
        actor: MusicHouseProducer
        preconditions:
          - "Project.status IN {BRIEFING, IN_DEMO, IN_PRODUCTION}"
        side_effects:
          - "Project.status_before_hold := IN_DEMO"
          - "Project.budget_posture := FROZEN"
          - "Every SessionCall of this Project with status == SCHEDULED becomes SUSPENDED_BUDGET, processed in scheduled_start_utc ASC then created_at ASC order"
      - from: IN_PRODUCTION
        to: ON_HOLD
        trigger: "POST /projects/{id}/hold"
        actor: MusicHouseProducer
        preconditions:
          - "Project.status IN {BRIEFING, IN_DEMO, IN_PRODUCTION}"
        side_effects:
          - "Project.status_before_hold := IN_PRODUCTION"
          - "Project.budget_posture := FROZEN"
          - "Every SessionCall of this Project with status == SCHEDULED becomes SUSPENDED_BUDGET, processed in scheduled_start_utc ASC then created_at ASC order"
      - from: ON_HOLD
        to: IN_PRODUCTION
        trigger: "POST /projects/{id}/resume"
        actor: MusicHouseProducer
        preconditions:
          - "Project.status == ON_HOLD"
          - "Project.status_before_hold == IN_PRODUCTION"
        side_effects:
          - "Project.status := Project.status_before_hold, then Project.status_before_hold := null"
          - "Project.budget_posture recomputed by calculations.project_budget_posture"
          - "If the recomputed posture is HEALTHY, every SessionCall of this Project with status == SUSPENDED_BUDGET returns to SCHEDULED, processed in scheduled_start_utc ASC then created_at ASC order"
      - from: ON_HOLD
        to: IN_DEMO
        trigger: "POST /projects/{id}/resume"
        actor: MusicHouseProducer
        preconditions:
          - "Project.status == ON_HOLD"
          - "Project.status_before_hold == IN_DEMO"
        side_effects:
          - "Project.status := Project.status_before_hold, then Project.status_before_hold := null"
          - "Project.budget_posture recomputed by calculations.project_budget_posture"
      - from: ON_HOLD
        to: BRIEFING
        trigger: "POST /projects/{id}/resume"
        actor: MusicHouseProducer
        preconditions:
          - "Project.status == ON_HOLD"
          - "Project.status_before_hold == BRIEFING"
        side_effects:
          - "Project.status := Project.status_before_hold, then Project.status_before_hold := null"
          - "Project.budget_posture recomputed by calculations.project_budget_posture"

  - entity: CreativeBrief
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /briefs/{id}/approve"
        actor: ClientRep
        preconditions:
          - "CreativeBrief.status == DRAFT"
          - "Project.status == BRIEFING"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "CreativeBrief.approved_at := logical clock"
          - "Parent Project transitions BRIEFING -> IN_DEMO"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /projects/{id}/briefs (a newer brief is created for the same Project)"
        actor: system
        preconditions:
          - "CreativeBrief.status == DRAFT"
        side_effects:
          - "No fiscal effect; the superseded brief stops being the approvable brief"

  - entity: Demo
    initial_state: DRAFT
    terminal_states: [SELECTED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /demos/{id}/submit"
        actor: Composer
        preconditions:
          - "Demo.status IN {DRAFT, REVISION_REQUESTED}"
          - "Project.status == IN_DEMO"
          - "X-User-ID == Demo.composer_id"
        side_effects:
          - "No fiscal effect"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /demos/{id}/submit"
        actor: Composer
        preconditions:
          - "Demo.status IN {DRAFT, REVISION_REQUESTED}"
          - "Project.status == IN_DEMO"
          - "X-User-ID == Demo.composer_id"
        side_effects:
          - "No fiscal effect"
        note: "This edge closes the revision cycle SUBMITTED -> REVISION_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /demos/{id}/shortlist"
        actor: ClientRep
        preconditions:
          - "Demo.status == SUBMITTED"
          - "Project.status == IN_DEMO"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "No fiscal effect"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /demos/{id}/request-revision"
        actor: ClientRep
        preconditions:
          - "Demo.status IN {SUBMITTED, SHORTLISTED}"
          - "Project.status == IN_DEMO"
          - "Demo.revision_count < MAX_REVISION_ROUNDS (3)"
          - "Project.available_cents >= the revision surcharge produced by calculations.demo_reservation"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "Demo.revision_count increases by 1 and Demo.last_revision_note := the supplied note"
          - "Demo.accrued_fee_cents increases by the surcharge; Project.committed_cents increases and Project.available_cents decreases by the same surcharge"
          - "Project.budget_posture recomputed; if it leaves HEALTHY every SessionCall of the Project in SCHEDULED becomes SUSPENDED_BUDGET"
      - from: SHORTLISTED
        to: REVISION_REQUESTED
        trigger: "POST /demos/{id}/request-revision"
        actor: ClientRep
        preconditions:
          - "Demo.status IN {SUBMITTED, SHORTLISTED}"
          - "Project.status == IN_DEMO"
          - "Demo.revision_count < MAX_REVISION_ROUNDS (3)"
          - "Project.available_cents >= the revision surcharge produced by calculations.demo_reservation"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "Demo.revision_count increases by 1 and Demo.last_revision_note := the supplied note"
          - "Demo.accrued_fee_cents increases by the surcharge; Project.committed_cents increases and Project.available_cents decreases by the same surcharge"
      - from: SHORTLISTED
        to: SELECTED
        trigger: "POST /demos/{id}/select"
        actor: ClientRep
        preconditions:
          - "Demo.status == SHORTLISTED"
          - "Project.status == IN_DEMO"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "Demo.selected_at := logical clock"
          - "Demo.accrued_fee_cents leaves Project.committed_cents and enters Project.spent_cents"
          - "Triggers the five-hop cascade documented on Project IN_DEMO -> IN_PRODUCTION"
      - from: SUBMITTED
        to: ARCHIVED
        trigger: "system cascade hop 3 of POST /demos/{id}/select on a sibling Demo"
        actor: system
        preconditions:
          - "Project.status just became IN_PRODUCTION"
          - "Demo.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, SHORTLISTED}"
        side_effects:
          - "Demo.accrued_fee_cents is released from Project.committed_cents back into Project.available_cents"
      - from: SHORTLISTED
        to: ARCHIVED
        trigger: "system cascade hop 3 of POST /demos/{id}/select on a sibling Demo"
        actor: system
        preconditions:
          - "Project.status just became IN_PRODUCTION"
          - "Demo.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, SHORTLISTED}"
        side_effects:
          - "Demo.accrued_fee_cents is released from Project.committed_cents back into Project.available_cents"
      - from: REVISION_REQUESTED
        to: ARCHIVED
        trigger: "system cascade hop 3 of POST /demos/{id}/select on a sibling Demo"
        actor: system
        preconditions:
          - "Project.status just became IN_PRODUCTION"
          - "Demo.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, SHORTLISTED}"
        side_effects:
          - "Demo.accrued_fee_cents is released from Project.committed_cents back into Project.available_cents"
      - from: DRAFT
        to: ARCHIVED
        trigger: "system cascade hop 3 of POST /demos/{id}/select on a sibling Demo"
        actor: system
        preconditions:
          - "Project.status just became IN_PRODUCTION"
          - "Demo.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, SHORTLISTED}"
        side_effects:
          - "Demo.accrued_fee_cents is released from Project.committed_cents back into Project.available_cents"

  - entity: SessionCall
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_INSIDE_WINDOW, CANCELLED_OUTSIDE_WINDOW]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /session-calls/{id}/confirm"
        actor: MusicHouseProducer
        preconditions:
          - "SessionCall.status == SCHEDULED"
          - "Project.status == IN_PRODUCTION"
          - "Project.budget_posture == HEALTHY"
          - "At least one MusicianBooking with status == BOOKED exists on this call"
          - "Project.available_cents >= SessionCall.committed_cents computed by calculations.session_committed_estimate"
        side_effects:
          - "SessionCall.studio_cost_cents, wage_estimate_cents and committed_cents are frozen from calculations.session_committed_estimate"
          - "Project.committed_cents increases and Project.available_cents decreases by SessionCall.committed_cents"
          - "Project.budget_posture recomputed; when it leaves HEALTHY every other SessionCall of this Project in SCHEDULED becomes SUSPENDED_BUDGET"
      - from: SCHEDULED
        to: SUSPENDED_BUDGET
        trigger: "system posture sweep after any Project ledger movement or hold"
        actor: system
        preconditions:
          - "SessionCall.status == SCHEDULED"
          - "Project.budget_posture just became CONSTRAINED or FROZEN"
        side_effects:
          - "No fiscal effect; the call may not be confirmed while suspended"
      - from: SUSPENDED_BUDGET
        to: SCHEDULED
        trigger: "system posture sweep after any Project ledger movement or resume"
        actor: system
        preconditions:
          - "SessionCall.status == SUSPENDED_BUDGET"
          - "Project.budget_posture just became HEALTHY"
        side_effects:
          - "No fiscal effect"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /session-calls/{id}/complete"
        actor: MusicHouseProducer
        preconditions:
          - "SessionCall.status == CONFIRMED"
          - "actual_end_utc is strictly after scheduled_start_utc"
        side_effects:
          - "CASCADE HOP 1: SessionCall.actual_end_utc := supplied value, billed_hours recomputed, and SessionCall.wage_total_cents / studio_cost_cents / settled_total_cents written from calculations.musician_line_wage and calculations.session_committed_estimate at billed_hours"
          - "CASCADE HOP 2 (caused by hop 1): because the call now carries settled wage lines, every MusicianBooking on it with status == BOOKED becomes WAGE_ACCRUED with line_wage_cents and pension_health_cents written, processed in created_at ASC order"
          - "CASCADE HOP 3 (caused by hop 2): because the bookings accrued, Project.committed_cents decreases by SessionCall.committed_cents, Project.spent_cents increases by SessionCall.settled_total_cents, and Project.available_cents absorbs the difference (committed_cents - settled_total_cents)"
          - "CASCADE HOP 4 (caused by hop 3): because Project.available_cents changed, Project.budget_posture is recomputed"
          - "CASCADE HOP 5 (caused by hop 4): because the posture changed, every SessionCall of this Project in SCHEDULED becomes SUSPENDED_BUDGET when the posture left HEALTHY, or every SessionCall in SUSPENDED_BUDGET returns to SCHEDULED when the posture became HEALTHY"
      - from: CONFIRMED
        to: CANCELLED_INSIDE_WINDOW
        trigger: "POST /session-calls/{id}/cancel"
        actor: MusicHouseProducer
        preconditions:
          - "SessionCall.status == CONFIRMED"
          - "(scheduled_start_utc - logical clock) in hours < AFM_CANCEL_WINDOW_HOURS (24)"
        side_effects:
          - "SessionCall.wage_liability_cents := SessionCall.wage_estimate_cents and settled_total_cents := the same value"
          - "Every MusicianBooking with status == BOOKED becomes PENALTY_ACCRUED with line_wage_cents and pension_health_cents written at the scheduled-hours basis"
          - "Project.committed_cents decreases by SessionCall.committed_cents, Project.spent_cents increases by wage_liability_cents, Project.available_cents increases by (committed_cents - wage_liability_cents)"
          - "Project.budget_posture recomputed and the SCHEDULED/SUSPENDED_BUDGET sweep runs"
      - from: CONFIRMED
        to: CANCELLED_OUTSIDE_WINDOW
        trigger: "POST /session-calls/{id}/cancel"
        actor: MusicHouseProducer
        preconditions:
          - "SessionCall.status == CONFIRMED"
          - "(scheduled_start_utc - logical clock) in hours >= AFM_CANCEL_WINDOW_HOURS (24)"
        side_effects:
          - "SessionCall.wage_liability_cents := 0 and settled_total_cents := 0"
          - "Every MusicianBooking with status == BOOKED becomes RELEASED with line_wage_cents = 0 and pension_health_cents = 0"
          - "Project.committed_cents decreases by SessionCall.committed_cents and Project.available_cents increases by exactly the same amount; Project.spent_cents unchanged"
          - "Project.budget_posture recomputed and the SCHEDULED/SUSPENDED_BUDGET sweep runs"
        note: "Compensating counterpart of CONFIRMED -> ... this edge must restore the pre-confirmation ledger exactly."
      - from: SCHEDULED
        to: CANCELLED_OUTSIDE_WINDOW
        trigger: "POST /session-calls/{id}/cancel"
        actor: MusicHouseProducer
        preconditions:
          - "SessionCall.status == SCHEDULED"
        side_effects:
          - "Every MusicianBooking with status == BOOKED becomes RELEASED"
          - "No ledger movement: nothing was ever committed for an unconfirmed call"
      - from: SUSPENDED_BUDGET
        to: CANCELLED_OUTSIDE_WINDOW
        trigger: "POST /session-calls/{id}/cancel"
        actor: MusicHouseProducer
        preconditions:
          - "SessionCall.status == SUSPENDED_BUDGET"
        side_effects:
          - "Every MusicianBooking with status == BOOKED becomes RELEASED"
          - "No ledger movement"

  - entity: MusicianBooking
    initial_state: BOOKED
    terminal_states: [WAGE_ACCRUED, PENALTY_ACCRUED, RELEASED]
    transitions:
      - from: BOOKED
        to: WAGE_ACCRUED
        trigger: "system cascade hop 2 of POST /session-calls/{id}/complete"
        actor: system
        preconditions:
          - "MusicianBooking.status == BOOKED"
          - "Parent SessionCall reached COMPLETED"
        side_effects:
          - "line_wage_cents and pension_health_cents written from calculations.musician_line_wage at the SESSION_BASIS variant using billed_hours"
      - from: BOOKED
        to: PENALTY_ACCRUED
        trigger: "system cascade of POST /session-calls/{id}/cancel inside the 24-hour window"
        actor: system
        preconditions:
          - "MusicianBooking.status == BOOKED"
          - "Parent SessionCall reached CANCELLED_INSIDE_WINDOW"
        side_effects:
          - "line_wage_cents and pension_health_cents written from calculations.musician_line_wage at the SESSION_BASIS variant using scheduled_hours"
      - from: BOOKED
        to: RELEASED
        trigger: "system cascade of POST /session-calls/{id}/cancel at or outside the 24-hour window"
        actor: system
        preconditions:
          - "MusicianBooking.status == BOOKED"
          - "Parent SessionCall reached CANCELLED_OUTSIDE_WINDOW"
        side_effects:
          - "line_wage_cents := 0 and pension_health_cents := 0"

  - entity: LicenseDeal
    initial_state: DRAFT
    terminal_states: [LAPSED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /license-deals/{id}/propose"
        actor: RightsAdmin
        preconditions:
          - "LicenseDeal.status == DRAFT"
        side_effects:
          - "LicenseDeal.license_fee_quoted_cents recomputed by the QUOTED_AT_DRAFT variant of calculations.license_fee"
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /license-deals/{id}/counter"
        actor: ClientRep
        preconditions:
          - "LicenseDeal.status == PROPOSED"
          - "X-User-ID == Project.client_id"
          - "LicenseDeal.counter_round_count < MAX_COUNTER_ROUNDS (2)"
        side_effects:
          - "LicenseDeal.counter_round_count increases by 1"
          - "LicenseDeal.term_months and market_codes are replaced by the counter payload, then license_fee_quoted_cents is recomputed"
        note: "This edge closes the negotiation loop DRAFT -> PROPOSED -> DRAFT."
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /license-deals/{id}/accept"
        actor: ClientRep
        preconditions:
          - "LicenseDeal.status == PROPOSED"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "No fiscal effect; the quote is frozen at its current value"
      - from: ACCEPTED
        to: ACTIVE
        trigger: "POST /license-deals/{id}/activate"
        actor: RightsAdmin
        preconditions:
          - "LicenseDeal.status == ACCEPTED"
          - "X-User-ID != LicenseDeal.drafted_by_user_id (segregation of duties)"
        side_effects:
          - "LicenseDeal.activated_by_user_id := X-User-ID"
          - "LicenseDeal.effective_start_utc := logical clock; effective_end_utc := effective_start_utc + term_months * 30 days for TERM, null for BUYOUT"
          - "LicenseDeal.license_fee_invoiced_cents written by the INVOICED_AT_ACTIVATION variant of calculations.license_fee"
      - from: ACTIVE
        to: RENEWAL_DUE
        trigger: "POST /_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "LicenseDeal.status == ACTIVE"
          - "LicenseDeal.license_structure == TERM"
          - "new logical clock >= effective_end_utc - RENEWAL_NOTICE_DAYS (30) days"
        side_effects:
          - "No fiscal effect; the deal becomes renewable"
      - from: RENEWAL_DUE
        to: ACTIVE
        trigger: "POST /license-deals/{id}/renew"
        actor: RightsAdmin
        preconditions:
          - "LicenseDeal.status == RENEWAL_DUE"
        side_effects:
          - "LicenseDeal.renewal_fee_cents written by calculations.renewal_fee using the pre-increment renewal_count"
          - "LicenseDeal.renewal_count increases by 1"
          - "LicenseDeal.effective_start_utc := logical clock; effective_end_utc := logical clock + term_months * 30 days"
          - "LicenseDeal.license_fee_invoiced_cents recomputed by the INVOICED_AT_ACTIVATION variant"
        note: "This edge closes the renewal loop ACTIVE -> RENEWAL_DUE -> ACTIVE."
      - from: RENEWAL_DUE
        to: LAPSED
        trigger: "POST /_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "LicenseDeal.status == RENEWAL_DUE"
          - "new logical clock >= effective_end_utc"
        side_effects:
          - "No further reuse extensions, renewals or cue-sheet registrations are possible"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /license-deals (a newer deal is created for the same Project)"
        actor: system
        preconditions:
          - "LicenseDeal.status IN {DRAFT, PROPOSED}"
        side_effects:
          - "No fiscal effect"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /license-deals (a newer deal is created for the same Project)"
        actor: system
        preconditions:
          - "LicenseDeal.status IN {DRAFT, PROPOSED}"
        side_effects:
          - "No fiscal effect"

  - entity: Deliverable
    dimension: master_status
    initial_state: PENDING
    terminal_states: [CLIENT_APPROVED]
    transitions:
      - from: PENDING
        to: STEMS_DELIVERED
        trigger: "POST /deliverables/{id}/stems"
        actor: MusicHouseProducer
        preconditions:
          - "Deliverable.master_status == PENDING"
          - "The submitted lengths_seconds set equals CreativeBrief.required_lengths of the Project's APPROVED brief"
          - "The submitted stem_names set contains every member of REQUIRED_STEM_NAMES"
        side_effects:
          - "Deliverable.delivered_lengths and stem_manifest are written"
        note: "Independent of cuesheet_status, which is untouched by this edge."
      - from: STEMS_DELIVERED
        to: PENDING
        trigger: "POST /deliverables/{id}/reject-master"
        actor: ClientRep
        preconditions:
          - "Deliverable.master_status == STEMS_DELIVERED"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "Deliverable.delivered_lengths := [] and stem_manifest := []"
      - from: STEMS_DELIVERED
        to: CLIENT_APPROVED
        trigger: "POST /deliverables/{id}/approve-master"
        actor: ClientRep
        preconditions:
          - "Deliverable.master_status == STEMS_DELIVERED"
          - "X-User-ID == Project.client_id"
        side_effects:
          - "Parent Project transitions IN_PRODUCTION -> DELIVERED when it is in IN_PRODUCTION"

  - entity: Deliverable
    dimension: cuesheet_status
    initial_state: NOT_FILED
    terminal_states: [REGISTERED]
    transitions:
      - from: NOT_FILED
        to: FILED
        trigger: "POST /deliverables/{id}/file-cue-sheet"
        actor: RightsAdmin
        preconditions:
          - "Deliverable.cuesheet_status == NOT_FILED"
          - "At least one CueSheetEntry with status == ALLOCATED exists on this Deliverable"
        side_effects:
          - "No fiscal effect"
        note: "Independent of master_status, which is untouched by this edge."
      - from: FILED
        to: NOT_FILED
        trigger: "system cascade of POST /cue-entries/{id}/void when the last ALLOCATED entry is voided"
        actor: system
        preconditions:
          - "Deliverable.cuesheet_status == FILED"
          - "Zero CueSheetEntry rows with status == ALLOCATED remain after the void"
        side_effects:
          - "Deliverable.unallocated_bps := 10000"
      - from: FILED
        to: REGISTERED
        trigger: "POST /deliverables/{id}/register-cue-sheet"
        actor: RightsAdmin
        preconditions:
          - "Deliverable.cuesheet_status == FILED"
          - "LicenseDeal.status == ACTIVE"
          - "At least one CueSheetEntry with status == ALLOCATED exists"
        side_effects:
          - "Deliverable.registered_at := logical clock"
          - "Parent Project transitions DELIVERED -> CLOSED when it is in DELIVERED"

  - entity: CueSheetEntry
    initial_state: ALLOCATED
    terminal_states: [VOIDED]
    transitions:
      - from: ALLOCATED
        to: VOIDED
        trigger: "POST /cue-entries/{id}/void"
        actor: RightsAdmin
        preconditions:
          - "CueSheetEntry.status == ALLOCATED"
          - "Deliverable.cuesheet_status != REGISTERED"
        side_effects:
          - "CueSheetEntry.share_bps := 0"
          - "calculations.cue_share_allocation re-runs across the Deliverable's remaining ALLOCATED entries"
          - "Deliverable.unallocated_bps := 10000 when no ALLOCATED entry remains, otherwise 0"
          - "Deliverable.cuesheet_status falls back FILED -> NOT_FILED when no ALLOCATED entry remains"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: deal-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /license-deals"
    occ_field: "expected_project_version"
    description: |
      Creating a LicenseDeal against a Project whose version has advanced since
      the client last read it is rejected. A newly created deal legitimately
      supersedes any existing DRAFT or PROPOSED deal on the same Project, so the
      write itself is always semantically valid; the stale-version check is the
      only thing that stops a writer from superseding a deal it never saw.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: reuse-extension-stale-deal
    parent_entity: LicenseDeal
    write_endpoint: "POST /license-deals/{id}/reuse-extensions"
    occ_field: "expected_license_deal_version"
    description: |
      Adding a ReuseExtension to a LicenseDeal whose version has advanced since
      the client last read it is rejected. Extensions for distinct markets are
      independently valid, so the operation would otherwise succeed; the stale
      version indicates the writer priced the re-use against a market set and an
      invoiced fee that no longer describe the deal.
    error_id: ERR_STALE_LICENSE_DEAL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: project_budget_ledger
    trigger: "Every request that creates a Demo, requests a demo revision, selects a Demo, archives sibling Demos, confirms / completes / cancels a SessionCall"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY L1 — must hold after every single request, with no drift:
      #   Project.budget_cents == Project.committed_cents
      #                         + Project.available_cents
      #                         + Project.spent_cents
      #
      # At creation:  committed = 0, spent = 0, available = budget_cents.
      #
      # Movements (each one moves cents between exactly two of the three buckets):
      #   POST /projects/{id}/demos            available -= demo_fee_cents      ; committed += demo_fee_cents
      #   POST /demos/{id}/request-revision    available -= surcharge           ; committed += surcharge
      #   POST /demos/{id}/select  (this demo) committed -= accrued_fee_cents   ; spent     += accrued_fee_cents
      #   cascade archive (each sibling)       committed -= accrued_fee_cents   ; available += accrued_fee_cents
      #   POST /session-calls/{id}/confirm     available -= SessionCall.committed_cents ; committed += same
      #   POST /session-calls/{id}/complete    committed -= SessionCall.committed_cents
      #                                        spent     += SessionCall.settled_total_cents
      #                                        available += (committed_cents - settled_total_cents)
      #   cancel INSIDE window                 committed -= SessionCall.committed_cents
      #                                        spent     += SessionCall.wage_liability_cents
      #                                        available += (committed_cents - wage_liability_cents)
      #   cancel OUTSIDE window (compensation) committed -= SessionCall.committed_cents ; available += same
      #
      # The OUTSIDE-window cancel is the exact compensating action of confirm:
      # the pair (confirm, cancel-outside-window) must leave committed_cents,
      # available_cents and spent_cents at their pre-confirmation values.
    input_set: "Only Demos with status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, SHORTLISTED} and SessionCalls with status == CONFIRMED hold committed cents at any instant."
    constants:
      LEDGER_BUCKET_COUNT: 3
    precision: "integer cents, no fractional cents ever stored"

  - name: project_budget_posture
    trigger: "Immediately after every project_budget_ledger movement, and on every Project status change (hold, resume, select, approve-master, register-cue-sheet)"
    algorithm: threshold
    formula: |
      if Project.status == 'ON_HOLD':
          posture = 'FROZEN'
      elif Project.available_cents * 100 < BUDGET_CONSTRAINED_PCT * Project.budget_cents:
          posture = 'CONSTRAINED'
      else:
          posture = 'HEALTHY'
      # BOUNDARY IS STRICT: available_cents * 100 == BUDGET_CONSTRAINED_PCT * budget_cents
      # yields HEALTHY, not CONSTRAINED. Compare with integers only; never divide.
      #
      # Posture sweep (runs whenever the posture VALUE changes, never otherwise):
      #   HEALTHY -> CONSTRAINED|FROZEN : every SessionCall of this Project with
      #        status == SCHEDULED becomes SUSPENDED_BUDGET
      #   CONSTRAINED|FROZEN -> HEALTHY : every SessionCall of this Project with
      #        status == SUSPENDED_BUDGET returns to SCHEDULED
      #   Sweep order: scheduled_start_utc ASC, tie-break created_at ASC.
    input_set: "Project.available_cents and Project.budget_cents only; SessionCalls in terminal states are never touched by the sweep."
    constants:
      BUDGET_CONSTRAINED_PCT: 25
    precision: "integer comparison, no rounding"

  - name: demo_reservation
    trigger: "POST /projects/{id}/demos and POST /demos/{id}/request-revision"
    algorithm: aggregation
    formula: |
      on create:
          accrued_fee_cents = demo_fee_cents
          reserved = demo_fee_cents
      on request-revision:
          surcharge = round_half_up(demo_fee_cents * REVISION_SURCHARGE_PCT / 100)
          # The surcharge is FLAT: it is always keyed on the original
          # demo_fee_cents, never on the already-accrued accrued_fee_cents,
          # so three revisions cost exactly 3 * surcharge.
          accrued_fee_cents = accrued_fee_cents + surcharge
          revision_count = revision_count + 1
      # Hard cap: request-revision is rejected when revision_count >= MAX_REVISION_ROUNDS.
    input_set: "Only the Demo's own demo_fee_cents; sibling demos never contribute."
    constants:
      REVISION_SURCHARGE_PCT: 15
      MAX_REVISION_ROUNDS: 3
    precision: "integer cents, round_half_up"

  - name: musician_line_wage
    trigger: "POST /session-calls/{id}/confirm (estimate), POST /session-calls/{id}/complete (settlement), POST /session-calls/{id}/cancel inside the window (liability), GET /projects/{id}/afm-report"
    algorithm: threshold
    formula: |
      # SESSION_BASIS — the persisted, per-booking wage line.
      hours_basis     = billed_hours when the SessionCall is COMPLETED, else scheduled_hours
      billable_hours  = max(AFM_MINIMUM_CALL_HOURS, hours_basis)
      base_cents      = round_half_up(Musician.scale_hourly_cents * billable_hours)
      leader_factor   = AFM_LEADER_MULTIPLIER if MusicianBooking.is_leader else 1
      leader_part     = round_half_up(base_cents * leader_factor)
      doubling_part   = round_half_up(base_cents * AFM_DOUBLING_PCT / 100 * MusicianBooking.doubles_count)
      line_wage_cents = leader_part + doubling_part
      pension_health_cents = round_half_up(line_wage_cents * AFM_PENSION_HEALTH_PCT / 100)
    input_set: "MusicianBooking rows with status == BOOKED at confirm/cancel time; rows with status == WAGE_ACCRUED at completion time. RELEASED rows never contribute."
    constants:
      AFM_MINIMUM_CALL_HOURS: 3
      AFM_LEADER_MULTIPLIER: 2
      AFM_DOUBLING_PCT: 20
      AFM_PENSION_HEALTH_PCT: 12
      AFM_DAY_RATE_HOURS_CAP: 8
    precision: "integer cents, round_half_up at each named step"
    variants:
      - name: SESSION_BASIS
        when: "Always for persisted MusicianBooking.line_wage_cents, and for GET /projects/{id}/afm-report?basis=SESSION (the default basis)"
        difference: "Each SessionCall is priced on its own hours with the 3-hour minimum call applied per call, so a player on two calls in one day is paid twice."
      - name: DAY_BASIS
        when: "Only for GET /projects/{id}/afm-report?basis=DAY; never persisted on MusicianBooking"
        difference: |
          The player's calls are consolidated per (musician_id, UTC calendar date of
          SessionCall.scheduled_start_utc) across the Project's COMPLETED SessionCalls:
            day_hours     = sum(billed_hours of that group's calls)
            billable      = max(AFM_MINIMUM_CALL_HOURS, min(AFM_DAY_RATE_HOURS_CAP, day_hours))
            base_cents    = round_half_up(Musician.scale_hourly_cents * billable)
            leader_factor = AFM_LEADER_MULTIPLIER when the player was leader on ANY booking
                            in the group, else 1
            doubles       = max(doubles_count over the group's bookings)
            day_wage      = round_half_up(base_cents * leader_factor)
                            + round_half_up(base_cents * AFM_DOUBLING_PCT / 100 * doubles)
          Group iteration order: Musician.created_at ASC, then calendar date ASC.
          The 8-hour day cap makes the DAY total strictly lower than the SESSION
          total whenever a player's day_hours exceed 8.

  - name: afm_pension_health_rollup
    trigger: "GET /projects/{id}/afm-report"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round EVERY LINE FIRST, THEN SUM.
      # The forbidden alternative — round_half_up(wage_total_cents * pct / 100) —
      # produces a different number of cents and is explicitly NOT the rule.
      basis == 'SESSION' (default):
          rows = MusicianBooking rows whose SessionCall.project_id == this Project
                 and whose status IN {WAGE_ACCRUED, PENALTY_ACCRUED},
                 iterated in created_at ASC order
          wage_total_cents     = sum(row.line_wage_cents for row in rows)
          pension_health_cents = sum(round_half_up(row.line_wage_cents
                                                   * AFM_PENSION_HEALTH_PCT / 100)
                                     for row in rows)
          booking_count = len(rows)
          session_count = number of distinct SessionCall ids among rows
      basis == 'DAY':
          groups = the (musician_id, UTC date) groups of calculations.musician_line_wage
                   variant DAY_BASIS over this Project's COMPLETED SessionCalls,
                   iterated in Musician.created_at ASC then date ASC order
          wage_total_cents     = sum(group.day_wage for group in groups)
          pension_health_cents = sum(round_half_up(group.day_wage
                                                   * AFM_PENSION_HEALTH_PCT / 100)
                                     for group in groups)
          booking_count = number of MusicianBooking rows with status == WAGE_ACCRUED
                          contributing to the groups
          session_count = number of this Project's SessionCalls with status == COMPLETED
    input_set: "SESSION basis includes PENALTY_ACCRUED rows (cancelled-inside-window wages are still owed); DAY basis includes only COMPLETED SessionCalls, so PENALTY_ACCRUED rows are excluded."
    constants:
      AFM_PENSION_HEALTH_PCT: 12
    precision: "integer cents, round_half_up per line, then integer sum"

  - name: license_fee
    trigger: "POST /license-deals, POST /license-deals/{id}/propose, POST /license-deals/{id}/counter (quoted); POST /license-deals/{id}/activate, POST /license-deals/{id}/reuse-extensions, POST /license-deals/{id}/renew (invoiced)"
    algorithm: tiered_pricing
    formula: |
      if LicenseDeal.license_structure == 'BUYOUT':
          structure_component = round_half_up(creative_fee_cents * BUYOUT_MULTIPLIER)
      else:  # TERM
          structure_component = round_half_up(creative_fee_cents
                                              * TERM_ANNUAL_RATE_PCT / 100
                                              * term_months / 12)
      market_component = sum(MARKET_TIER_FEE_CENTS[MARKET_TIER_MAP[code]]
                             for code in <the variant's market set>)
      license_fee = structure_component + market_component
    input_set: "Only market codes present in MARKET_TIER_MAP; an unknown code is rejected with ERR_UNKNOWN_MARKET_CODE before this calculation runs."
    constants:
      BUYOUT_MULTIPLIER: 2.5
      TERM_ANNUAL_RATE_PCT: 40
      MAX_COUNTER_ROUNDS: 2
      MARKET_TIER_FEE_CENTS:
        TIER_1: 325000
        TIER_2: 150000
        TIER_3: 60000
      MARKET_TIER_MAP:
        US_NATIONAL: TIER_1
        DIGITAL_GLOBAL: TIER_1
        US_REGIONAL: TIER_2
        CA_NATIONAL: TIER_2
        EU_NATIONAL: TIER_2
        US_LOCAL: TIER_3
        INTERNAL_NON_AIR: TIER_3
    precision: "integer cents, round_half_up once on structure_component only"
    variants:
      - name: QUOTED_AT_DRAFT
        when: "Whenever LicenseDeal.license_fee_quoted_cents is written — at deal creation, at propose, and at counter"
        difference: |
          Forward-looking inclusion set: the market set is the target_markets array
          of the Project's CreativeBrief with status == APPROVED — i.e. everything
          the client SAID it wanted at brief time — regardless of which markets the
          deal actually grants.
      - name: INVOICED_AT_ACTIVATION
        when: "Whenever LicenseDeal.license_fee_invoiced_cents is written — at activate, after each reuse extension, and at each renewal"
        difference: |
          Chronological inclusion set: the market set is LicenseDeal.market_codes as
          it stands at that instant — i.e. only markets actually granted, plus every
          market added by an ACTIVE ReuseExtension. For identical LicenseDeal data
          this yields a strictly smaller fee than QUOTED_AT_DRAFT whenever the brief
          listed markets the deal did not grant, and a strictly larger one once
          re-use extensions push the granted set past the brief.

  - name: reuse_fee
    trigger: "POST /license-deals/{id}/reuse-extensions"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED — the admin band looks circular because the
      # administration percentage is a function of a subtotal that the admin fee
      # itself feeds into. It is resolved by fixing the order of the four steps:
      #
      # STEP 1  reuse_base_cents = round_half_up(
      #             MARKET_TIER_FEE_CENTS[market_tier] * REUSE_BASE_PCT / 100)
      # STEP 2  admin_pct is banded on reuse_base_cents — the PRE-admin subtotal:
      #             reuse_base_cents <= 100000                      -> 10
      #             100000 <  reuse_base_cents <= 200000            ->  7
      #             reuse_base_cents >  200000                      ->  5
      #         It is NEVER banded on reuse_total_cents.
      # STEP 3  admin_fee_cents   = round_half_up(reuse_base_cents * admin_pct / 100)
      # STEP 4  reuse_total_cents = reuse_base_cents + admin_fee_cents
      #
      # Worked check for TIER_1: base 195000 -> band 7% -> admin 13650 ->
      # total 208650. Banding on the total instead would pick 5% (208650 > 200000)
      # and yield 204750; that number is wrong under this scaffold.
    input_set: "Exactly one market code per ReuseExtension; the tier is resolved through MARKET_TIER_MAP of calculations.license_fee."
    constants:
      REUSE_BASE_PCT: 60
      ADMIN_BAND_LOW_CENTS: 100000
      ADMIN_BAND_HIGH_CENTS: 200000
      ADMIN_PCT_LOW: 10
      ADMIN_PCT_MID: 7
      ADMIN_PCT_HIGH: 5
    precision: "integer cents, round_half_up at steps 1 and 3 only"

  - name: renewal_fee
    trigger: "POST /license-deals/{id}/renew"
    algorithm: decay_function
    formula: |
      uplift_pct = min(RENEWAL_UPLIFT_CAP_PCT,
                       RENEWAL_UPLIFT_BASE_PCT
                       + RENEWAL_UPLIFT_STEP_PCT * LicenseDeal.renewal_count)
      # renewal_count is read BEFORE it is incremented, so the first renewal
      # uses 85%, the second 95%, the third 105%, and so on up to the 120% cap.
      renewal_fee_cents = round_half_up(LicenseDeal.license_fee_invoiced_cents
                                        * uplift_pct / 100)
      # license_fee_invoiced_cents is read BEFORE the renewal recompute; the
      # recompute then runs with the unchanged market set, so the value is stable.
    input_set: "Only TERM deals in status RENEWAL_DUE; BUYOUT deals never renew."
    constants:
      RENEWAL_UPLIFT_BASE_PCT: 85
      RENEWAL_UPLIFT_STEP_PCT: 10
      RENEWAL_UPLIFT_CAP_PCT: 120
      RENEWAL_NOTICE_DAYS: 30
      TERM_MONTH_DAYS: 30
    precision: "integer cents, round_half_up"

  - name: cue_share_allocation
    trigger: "POST /deliverables/{id}/cue-entries and POST /cue-entries/{id}/void"
    algorithm: waterfall_allocation
    formula: |
      entries = CueSheetEntry rows of this Deliverable with status == 'ALLOCATED'
      if len(entries) == 0:
          Deliverable.unallocated_bps = CUE_TOTAL_BPS
          # every VOIDED entry already carries share_bps = 0
      else:
          W = sum(e.declared_weight for e in entries)
          floor_i = int_floor(CUE_TOTAL_BPS * e.declared_weight / W)  for each e
          R = CUE_TOTAL_BPS - sum(floor_i)
          order = entries sorted by declared_weight DESC, then created_at ASC
          the first R entries of `order` each receive +1 bps
          share_bps_i = floor_i + (1 if e is among those first R else 0)
          Deliverable.unallocated_bps = 0
      #
      # CONSERVED QUANTITY L2 — must hold for every Deliverable after every
      # request, with no drift:
      #   sum(CueSheetEntry.share_bps where status == 'ALLOCATED')
      #     + Deliverable.unallocated_bps  ==  CUE_TOTAL_BPS
      #
      # POST /deliverables/{id}/cue-entries and POST /cue-entries/{id}/void are
      # exact compensating actions: adding an entry and then voiding it must
      # restore every surviving entry's share_bps and Deliverable.unallocated_bps
      # to their pre-add values.
    input_set: "Only ALLOCATED entries participate; VOIDED entries are frozen at share_bps = 0 and never re-enter the waterfall."
    constants:
      CUE_TOTAL_BPS: 10000
    precision: "integer basis points; floor per entry, remainder distributed one basis point at a time"

  - name: session_committed_estimate
    trigger: "POST /session-calls/{id}/confirm (at scheduled_hours) and POST /session-calls/{id}/complete (re-evaluated at billed_hours)"
    algorithm: aggregation
    formula: |
      hours_basis         = scheduled_hours at confirm, billed_hours at complete
      studio_cost_cents   = round_half_up(StudioRoom.hourly_rate_cents * hours_basis)
      wage_component      = sum over the call's contributing MusicianBooking rows,
                            iterated in created_at ASC order, of
                            calculations.musician_line_wage SESSION_BASIS evaluated
                            at hours_basis
      at confirm:  wage_estimate_cents = wage_component
                   committed_cents     = studio_cost_cents + wage_estimate_cents
      at complete: wage_total_cents    = wage_component
                   settled_total_cents = studio_cost_cents + wage_total_cents
      # committed_cents is FROZEN at confirmation and never re-derived; the
      # completion pass writes settled_total_cents alongside it so the ledger can
      # move the difference back into available_cents.
    input_set: "At confirm, MusicianBooking rows with status == BOOKED. At complete, the same rows once they have become WAGE_ACCRUED. RELEASED rows are excluded at both points."
    constants:
      HOURS_PRECISION_DP: 4
    precision: "hours to 4 decimal places; cents integer, round_half_up"

  - name: session_cancellation_settlement
    trigger: "POST /session-calls/{id}/cancel"
    algorithm: threshold
    formula: |
      hours_before = (SessionCall.scheduled_start_utc - logical_clock) in hours,
                     as an exact signed real number
      if hours_before < AFM_CANCEL_WINDOW_HOURS:
          outcome              = 'CANCELLED_INSIDE_WINDOW'
          wage_liability_cents = SessionCall.wage_estimate_cents
          settled_total_cents  = wage_liability_cents          # the room is NOT billed
          each BOOKED MusicianBooking -> PENALTY_ACCRUED with its scheduled-hours line
      else:
          outcome              = 'CANCELLED_OUTSIDE_WINDOW'
          wage_liability_cents = 0
          settled_total_cents  = 0
          each BOOKED MusicianBooking -> RELEASED with line_wage_cents = 0
      # BOUNDARY IS STRICT: hours_before == 24 exactly is OUTSIDE the window and
      # carries no liability; only hours_before < 24 triggers the penalty branch.
      #
      # The same 60-minute constant governs player turnaround at booking time:
      # a musician's occupied interval is inflated by AFM_TURNAROUND_BUFFER_MINUTES
      # on BOTH sides, and a gap of exactly 60 minutes is accepted.
    input_set: "Only MusicianBooking rows with status == BOOKED on the cancelled call; already RELEASED rows are untouched."
    constants:
      AFM_CANCEL_WINDOW_HOURS: 24
      AFM_TURNAROUND_BUFFER_MINUTES: 60
    precision: "hours as an exact real comparison; cents integer"

  - name: deliverable_completeness
    trigger: "POST /deliverables/{id}/stems"
    algorithm: aggregation
    formula: |
      brief = the Project's CreativeBrief with status == 'APPROVED'
      if set(lengths_seconds) != set(brief.required_lengths):
          reject with ERR_ALTERNATE_LENGTHS_INCOMPLETE
      if not set(REQUIRED_STEM_NAMES).issubset(set(stem_names)):
          reject with ERR_STEM_MANIFEST_INCOMPLETE
      Deliverable.delivered_lengths = lengths_seconds sorted DESC
      Deliverable.stem_manifest     = stem_names sorted ascending by name
      # Extra stem names beyond REQUIRED_STEM_NAMES are accepted and stored;
      # extra or missing LENGTHS are not — the length set must match exactly.
    input_set: "Only the single APPROVED CreativeBrief of the Deliverable's Project supplies required_lengths."
    constants:
      REQUIRED_STEM_NAMES: [DRUMS, BASS, KEYS, VOX, MIX]
    precision: "set comparison, order-insensitive on input"

  - name: sourcing_comparison
    trigger: "GET /projects/{id}/sourcing-comparison"
    algorithm: weighted_scoring
    formula: |
      brief            = the Project's CreativeBrief with status == 'APPROVED'
      n_markets        = len(brief.target_markets)
      shortest_cut     = min(brief.required_lengths)
      #
      # Custom side — three inputs interacting:
      deal = the Project's LicenseDeal whose status IN
             {DRAFT, PROPOSED, ACCEPTED, ACTIVE, RENEWAL_DUE},
             ranked created_at DESC, tie-break version DESC, first row wins;
             when no such deal exists, deal_quote = 0
      deal_quote          = deal.license_fee_quoted_cents (or 0)
      custom_total_cents  = Project.spent_cents + Project.committed_cents + deal_quote
      #
      # Library side — eligibility filter, ranking, tie-break, empty-pool fallback:
      eligible = LibraryTrack rows where status == 'ACTIVE'
                   AND max_markets       >= n_markets
                   AND min_length_seconds <= shortest_cut
      if len(eligible) == 0:  reject the request with ERR_NO_ELIGIBLE_LIBRARY_TRACK
      quote(t)  = t.blanket_fee_cents + t.per_market_fee_cents * n_markets
      selected  = eligible ranked by quote(t) ASC, tie-break created_at ASC, first row
      library_total_cents = max(LIBRARY_FLOOR_CENTS, quote(selected))
      #
      savings_cents    = custom_total_cents - library_total_cents
      recommended_mode = 'LIBRARY' if library_total_cents * 100
                                      <= custom_total_cents * (100 - LIBRARY_MARGIN_PCT)
                         else 'CUSTOM'
      eligible_track_count = len(eligible)
    input_set: "Only ACTIVE LibraryTracks; RETIRED tracks are excluded from the pool even when cheaper. Only the single APPROVED CreativeBrief drives n_markets and shortest_cut."
    constants:
      LIBRARY_FLOOR_CENTS: 25000
      LIBRARY_MARGIN_PCT: 15
    precision: "integer cents; the recommendation comparison uses integer cross-multiplication, never division"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 15
    category: auth
    check: "The supplied role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 20
    category: existence
    check: "Every id in the request path exists, validated left to right"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_BRIEF_NOT_FOUND | ERR_DEMO_NOT_FOUND | ERR_MUSICIAN_NOT_FOUND | ERR_SESSION_CALL_NOT_FOUND | ERR_LICENSE_DEAL_NOT_FOUND | ERR_DELIVERABLE_NOT_FOUND | ERR_CUE_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 25
    category: existence
    check: "Every foreign key supplied in the request body exists"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_DEMO_NOT_FOUND | ERR_COMPOSER_NOT_FOUND | ERR_MUSICIAN_NOT_FOUND | ERR_STUDIO_ROOM_NOT_FOUND"
    http_status: 404
    applies_to: "POST /projects, POST /session-calls, POST /session-calls/{id}/bookings, POST /license-deals, POST /deliverables/{id}/cue-entries"

  - priority: 30
    category: auth
    check: "For an entity_backed role the acting X-User-ID owns the target: ClientRep's X-User-ID equals the governing Project.client_id; Composer's X-User-ID equals Demo.composer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all ClientRep and Composer write endpoints"

  - priority: 32
    category: auth
    check: "The RightsAdmin activating a LicenseDeal is a different operator from the one who drafted it: X-User-ID != LicenseDeal.drafted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /license-deals/{id}/activate"

  - priority: 35
    category: business_constraint
    check: "Request body carries every required field, enums hold declared members, integers respect their declared ranges, arrays are non-empty and duplicate-free"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 36
    category: business_temporal
    check: "scheduled_end_utc is strictly after scheduled_start_utc; actual_end_utc is strictly after scheduled_start_utc"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 400
    applies_to: "POST /session-calls, POST /session-calls/{id}/complete"

  - priority: 37
    category: business_constraint
    check: "Every market code supplied is a key of calculations.license_fee.constants.MARKET_TIER_MAP"
    error_id: ERR_UNKNOWN_MARKET_CODE
    http_status: 400
    applies_to: "POST /projects/{id}/briefs, POST /license-deals, POST /license-deals/{id}/counter, POST /license-deals/{id}/reuse-extensions"

  - priority: 38
    category: business_constraint
    check: "term_months is present when license_structure == TERM and absent when license_structure == BUYOUT"
    error_id: ERR_TERM_MONTHS_REQUIRED
    http_status: 400
    applies_to: "POST /license-deals, POST /license-deals/{id}/counter"

  - priority: 39
    category: state
    check: "Sub-resource creation targets are in the right status: POST /license-deals/{id}/deliverables requires LicenseDeal.status IN {ACCEPTED, ACTIVE, RENEWAL_DUE}; POST /session-calls/{id}/bookings requires SessionCall.status == SCHEDULED; POST /deliverables/{id}/cue-entries requires Deliverable.cuesheet_status != REGISTERED"
    error_id: "ERR_LICENSE_DEAL_INVALID_STATE | ERR_SESSION_CALL_INVALID_STATE | ERR_DELIVERABLE_INVALID_STATE"
    http_status: 409
    applies_to: "POST /license-deals/{id}/deliverables, POST /session-calls/{id}/bookings, POST /deliverables/{id}/cue-entries"

  - priority: 40
    category: state
    check: "The TARGET resource named in the path is in a status from which this transition leaves §1.2"
    error_id: "ERR_PROJECT_NOT_IN_BRIEFING | ERR_PROJECT_NOT_IN_DEMO | ERR_PROJECT_NOT_HOLDABLE | ERR_PROJECT_NOT_ON_HOLD | ERR_BRIEF_NOT_DRAFT | ERR_DEMO_INVALID_STATE | ERR_SESSION_CALL_INVALID_STATE | ERR_LICENSE_DEAL_INVALID_STATE | ERR_LICENSE_NOT_ACTIVE | ERR_LICENSE_NOT_RENEWABLE | ERR_DELIVERABLE_INVALID_STATE | ERR_CUE_ENTRY_ALREADY_VOIDED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 41
    category: business_referential
    check: "The ANCESTOR or associated entity is in the status this operation requires: Project.status IN {DRAFT, BRIEFING} for brief creation; Project.status == IN_PRODUCTION for session-call creation and confirmation and for license-deal creation; Project.status == IN_DEMO for demo creation, submission, shortlisting, revision and selection; LicenseDeal.status == ACTIVE for cue-sheet registration"
    error_id: "ERR_PROJECT_NOT_IN_BRIEFING | ERR_PROJECT_NOT_IN_PRODUCTION | ERR_PROJECT_NOT_IN_DEMO | ERR_LICENSE_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /projects/{id}/briefs, POST /projects/{id}/demos, POST /demos/{id}/submit, POST /demos/{id}/shortlist, POST /demos/{id}/request-revision, POST /demos/{id}/select, POST /session-calls, POST /session-calls/{id}/confirm, POST /license-deals, POST /deliverables/{id}/register-cue-sheet"

  - priority: 42
    category: state
    check: "Project.budget_posture == HEALTHY when confirming a SessionCall"
    error_id: ERR_PROJECT_BUDGET_CONSTRAINED
    http_status: 409
    applies_to: "POST /session-calls/{id}/confirm"

  - priority: 45
    category: business_constraint
    check: "The supplied expected_<parent>_version equals the parent's current version (OCC per §1.2.1)"
    error_id: "ERR_STALE_PROJECT_VERSION | ERR_STALE_LICENSE_DEAL_VERSION"
    http_status: 412
    applies_to: "POST /license-deals, POST /license-deals/{id}/reuse-extensions"

  - priority: 50
    category: business_safety
    check: "The Musician being booked has afm_member_status == SIGNATORY_CLEARED"
    error_id: ERR_MUSICIAN_NOT_SIGNATORY_CLEARED
    http_status: 422
    applies_to: "POST /session-calls/{id}/bookings"

  - priority: 52
    category: business_safety
    check: "The StudioRoom has status == ACTIVE at the moment the SessionCall is created"
    error_id: ERR_STUDIO_ROOM_UNAVAILABLE
    http_status: 422
    applies_to: "POST /session-calls"

  - priority: 55
    category: business_constraint
    check: "The Musician is not already booked on this SessionCall with a booking whose status != RELEASED"
    error_id: ERR_MUSICIAN_ALREADY_BOOKED
    http_status: 409
    applies_to: "POST /session-calls/{id}/bookings"

  - priority: 60
    category: business_temporal
    check: "HALF-OPEN, ZERO-BUFFER ROOM OCCUPANCY. The new window [start, end) must not intersect any other SessionCall on the same StudioRoom whose status is in {SCHEDULED, SUSPENDED_BUDGET, CONFIRMED, COMPLETED}. Reject when new_start < other_end AND new_end > other_start. Exact adjacency (new_start == other_end, or new_end == other_start) is ALLOWED."
    error_id: ERR_STUDIO_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /session-calls"

  - priority: 65
    category: business_temporal
    check: "CLOSED, BUFFERED PLAYER TURNAROUND. The musician's other bookings whose status is in {BOOKED, WAGE_ACCRUED, PENALTY_ACCRUED} on SessionCalls in {SCHEDULED, SUSPENDED_BUDGET, CONFIRMED, COMPLETED} must be separated from this call by at least AFM_TURNAROUND_BUFFER_MINUTES (60) on BOTH sides. Reject when new_start < other_end + 60min AND new_end + 60min > other_start. A gap of exactly 60 minutes is ALLOWED."
    error_id: ERR_MUSICIAN_TURNAROUND_CONFLICT
    http_status: 409
    applies_to: "POST /session-calls/{id}/bookings"

  - priority: 70
    category: business_constraint
    check: "The number of non-RELEASED bookings on the SessionCall after this one would not exceed StudioRoom.capacity_players"
    error_id: ERR_SESSION_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /session-calls/{id}/bookings"

  - priority: 72
    category: business_constraint
    check: "Demo.revision_count < MAX_REVISION_ROUNDS (3)"
    error_id: ERR_DEMO_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /demos/{id}/request-revision"

  - priority: 73
    category: business_constraint
    check: "LicenseDeal.counter_round_count < MAX_COUNTER_ROUNDS (2)"
    error_id: ERR_COUNTER_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /license-deals/{id}/counter"

  - priority: 74
    category: business_constraint
    check: "The delivered lengths_seconds set equals the APPROVED CreativeBrief.required_lengths set exactly; the stem_names set contains every member of REQUIRED_STEM_NAMES"
    error_id: "ERR_ALTERNATE_LENGTHS_INCOMPLETE | ERR_STEM_MANIFEST_INCOMPLETE"
    http_status: 422
    applies_to: "POST /deliverables/{id}/stems"

  - priority: 75
    category: business_constraint
    check: "The Deliverable carries at least one CueSheetEntry with status == ALLOCATED"
    error_id: ERR_CUE_SHEET_EMPTY
    http_status: 422
    applies_to: "POST /deliverables/{id}/file-cue-sheet, POST /deliverables/{id}/register-cue-sheet"

  - priority: 76
    category: business_constraint
    check: "The LicenseDeal does not already own a Deliverable"
    error_id: ERR_DELIVERABLE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /license-deals/{id}/deliverables"

  - priority: 78
    category: business_referential
    check: "The Demo named by a new LicenseDeal has status == SELECTED and belongs to the same Project"
    error_id: ERR_DEMO_NOT_SELECTED
    http_status: 422
    applies_to: "POST /license-deals"

  - priority: 79
    category: business_referential
    check: "The market_code of a new ReuseExtension is not already present in LicenseDeal.market_codes"
    error_id: ERR_MARKET_ALREADY_LICENSED
    http_status: 409
    applies_to: "POST /license-deals/{id}/reuse-extensions"

  - priority: 80
    category: business_referential
    check: "At least one LibraryTrack satisfies the eligibility filter of calculations.sourcing_comparison"
    error_id: ERR_NO_ELIGIBLE_LIBRARY_TRACK
    http_status: 409
    applies_to: "GET /projects/{id}/sourcing-comparison"

  - priority: 85
    category: business_fiscal
    check: "Project.available_cents is at least the amount this operation would move into committed_cents"
    error_id: ERR_PROJECT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /projects/{id}/demos, POST /demos/{id}/request-revision, POST /session-calls/{id}/confirm"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and it MUST NOT fall back to real wall-clock time before the first call. Setting the clock also runs the LicenseDeal renewal sweep: deals are visited in created_at ASC order, each ACTIVE TERM deal whose effective_end_utc minus 30 days is at or before the new clock becomes RENEWAL_DUE, and each RENEWAL_DUE deal whose effective_end_utc is at or before the new clock then becomes LAPSED in the same sweep."
    roles: [MusicHouseProducer, RightsAdmin, AFMSteward]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string, licenses_moved_to_renewal_due: integer, licenses_lapsed: integer }
    side_effects: ["LicenseDeal ACTIVE -> RENEWAL_DUE sweep", "LicenseDeal RENEWAL_DUE -> LAPSED sweep"]

  - method: POST
    path: "/clients"
    description: "Register an advertiser. The returned id is the value a ClientRep must send as X-User-ID."
    roles: [MusicHouseProducer]
    code: 201
    input: ["name", "agency_code", "billing_email"]
    output: Client
    side_effects: []

  - method: POST
    path: "/projects"
    description: "Open a campaign engagement in DRAFT with the full budget available."
    roles: [MusicHouseProducer]
    code: 201
    input: ["client_id", "title", "budget_cents", "delivery_deadline_utc"]
    output: Project
    side_effects: ["available_cents := budget_cents", "budget_posture := HEALTHY"]

  - method: GET
    path: "/projects/{id}"
    description: "Read a single engagement including its live budget ledger and posture."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/projects"
    description: "Paginated engagement list; client_id is the reverse-reachability filter for Project.client_id."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: ["client_id?", "status?", "budget_posture?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: POST
    path: "/projects/{id}/hold"
    description: "Freeze an engagement. Posture becomes FROZEN and SCHEDULED session calls suspend."
    roles: [MusicHouseProducer]
    code: 200
    input: ["hold_reason"]
    output: Project
    side_effects: ["status_before_hold captured", "budget_posture := FROZEN", "SCHEDULED SessionCalls -> SUSPENDED_BUDGET"]

  - method: POST
    path: "/projects/{id}/resume"
    description: "Restore an engagement to Project.status_before_hold and recompute posture."
    roles: [MusicHouseProducer]
    code: 200
    input: []
    output: Project
    side_effects: ["status restored", "budget_posture recomputed", "SUSPENDED_BUDGET SessionCalls -> SCHEDULED when posture is HEALTHY"]

  - method: GET
    path: "/projects/{id}/sourcing-comparison"
    description: "Computed read comparing the custom-scored cost against the cheapest eligible production-library track, per calculations.sourcing_comparison."
    roles: [MusicHouseProducer, ClientRep, RightsAdmin]
    code: 200
    input: []
    output: { custom_total_cents: integer, library_total_cents: integer, selected_library_track_id: string, eligible_track_count: integer, savings_cents: integer, recommended_mode: string }
    side_effects: []

  - method: GET
    path: "/projects/{id}/afm-report"
    description: "Computed read of AFM wages and pension/health for the engagement. basis defaults to SESSION; basis=DAY applies the consolidated day-rate variant."
    roles: [MusicHouseProducer, RightsAdmin, AFMSteward]
    code: 200
    input: ["basis?"]
    output: { basis: string, wage_total_cents: integer, pension_health_cents: integer, session_count: integer, booking_count: integer }
    side_effects: []

  - method: POST
    path: "/projects/{id}/briefs"
    description: "Attach a creative brief. The first brief moves the Project DRAFT -> BRIEFING; a later brief supersedes any DRAFT sibling."
    roles: [MusicHouseProducer]
    code: 201
    input: ["tempo_bpm", "mood_tags", "target_markets", "required_lengths", "reference_track_url?"]
    output: CreativeBrief
    side_effects: ["Project DRAFT -> BRIEFING", "sibling DRAFT briefs -> SUPERSEDED"]

  - method: GET
    path: "/projects/{id}/briefs"
    description: "Sub-resource list of the engagement's briefs; reverse-reachability for CreativeBrief.project_id."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CreativeBrief[]
    side_effects: []

  - method: POST
    path: "/briefs/{id}/approve"
    description: "Client sign-off on the brief; moves the Project BRIEFING -> IN_DEMO."
    roles: [ClientRep]
    code: 200
    input: []
    output: CreativeBrief
    side_effects: ["CreativeBrief -> APPROVED", "Project BRIEFING -> IN_DEMO"]

  - method: POST
    path: "/composers"
    description: "Register a writer. The returned id is the value a Composer must send as X-User-ID."
    roles: [MusicHouseProducer]
    code: 201
    input: ["display_name", "pro_affiliation"]
    output: Composer
    side_effects: []

  - method: POST
    path: "/projects/{id}/demos"
    description: "A composer pitches a demo. composer_id is taken from X-User-ID. Creating the demo immediately reserves demo_fee_cents against the Project."
    roles: [Composer]
    code: 201
    input: ["title", "demo_fee_cents", "submitted_length_seconds"]
    output: Demo
    side_effects: ["Project.committed_cents += demo_fee_cents", "Project.available_cents -= demo_fee_cents", "Project.budget_posture recomputed"]

  - method: GET
    path: "/demos/{id}"
    description: "Read a single demo."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: []
    output: Demo
    side_effects: []

  - method: GET
    path: "/demos"
    description: "Paginated demo list; project_id and composer_id are the reverse-reachability filters."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: ["project_id?", "composer_id?", "status?", "limit?", "offset?"]
    output: Demo[]
    side_effects: []

  - method: POST
    path: "/demos/{id}/submit"
    description: "Composer submits or re-submits a demo; closes the revision cycle from REVISION_REQUESTED."
    roles: [Composer]
    code: 200
    input: []
    output: Demo
    side_effects: []

  - method: POST
    path: "/demos/{id}/request-revision"
    description: "Client sends a demo back for another round; books a flat revision surcharge against the Project."
    roles: [ClientRep]
    code: 200
    input: ["revision_note"]
    output: Demo
    side_effects: ["Demo.revision_count += 1", "Project.committed_cents += surcharge", "Project.available_cents -= surcharge", "posture recomputed"]

  - method: POST
    path: "/demos/{id}/shortlist"
    description: "Client shortlists a submitted demo."
    roles: [ClientRep]
    code: 200
    input: []
    output: Demo
    side_effects: []

  - method: POST
    path: "/demos/{id}/select"
    description: "Client picks the winning demo. Fires the five-hop selection cascade."
    roles: [ClientRep]
    code: 200
    input: []
    output: Demo
    side_effects: ["Demo -> SELECTED", "Project IN_DEMO -> IN_PRODUCTION", "sibling Demos -> ARCHIVED", "archived reservations released", "posture recomputed and SUSPENDED_BUDGET sweep"]

  - method: POST
    path: "/musicians"
    description: "Register a session player. New players start NON_UNION and cannot be booked until cleared."
    roles: [MusicHouseProducer]
    code: 201
    input: ["full_name", "instrument", "scale_hourly_cents"]
    output: Musician
    side_effects: []

  - method: POST
    path: "/musicians/{id}/afm-clearance"
    description: "AFM steward sets the player's signatory standing."
    roles: [AFMSteward]
    code: 200
    input: ["afm_member_status"]
    output: Musician
    side_effects: []

  - method: POST
    path: "/studio-rooms"
    description: "Register a tracking room."
    roles: [MusicHouseProducer]
    code: 201
    input: ["name", "hourly_rate_cents", "capacity_players", "status?"]
    output: StudioRoom
    side_effects: []

  - method: POST
    path: "/session-calls"
    description: "Schedule a tracking date. Enforces half-open, zero-buffer room occupancy."
    roles: [MusicHouseProducer]
    code: 201
    input: ["project_id", "studio_room_id", "scheduled_start_utc", "scheduled_end_utc"]
    output: SessionCall
    side_effects: ["scheduled_hours computed"]

  - method: GET
    path: "/session-calls/{id}"
    description: "Read a single session call including its frozen commitment and settlement figures."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: []
    output: SessionCall
    side_effects: []

  - method: GET
    path: "/session-calls"
    description: "Paginated session-call list; project_id and studio_room_id are the reverse-reachability filters."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: ["project_id?", "studio_room_id?", "status?", "limit?", "offset?"]
    output: SessionCall[]
    side_effects: []

  - method: POST
    path: "/session-calls/{id}/bookings"
    description: "Book a cleared player onto the call. Enforces the closed 60-minute turnaround buffer."
    roles: [MusicHouseProducer]
    code: 201
    input: ["musician_id", "is_leader?", "doubles_count?"]
    output: MusicianBooking
    side_effects: []

  - method: GET
    path: "/musician-bookings/{id}"
    description: "Read a single booking line."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: []
    output: MusicianBooking
    side_effects: []

  - method: GET
    path: "/musician-bookings"
    description: "Paginated booking list; session_call_id and musician_id are the reverse-reachability filters."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: ["session_call_id?", "musician_id?", "status?", "limit?", "offset?"]
    output: MusicianBooking[]
    side_effects: []

  - method: POST
    path: "/session-calls/{id}/confirm"
    description: "Commit the call's estimated cost against the Project budget."
    roles: [MusicHouseProducer]
    code: 200
    input: []
    output: SessionCall
    side_effects: ["studio_cost_cents / wage_estimate_cents / committed_cents frozen", "Project ledger moves available -> committed", "posture recomputed and SUSPENDED_BUDGET sweep"]

  - method: POST
    path: "/session-calls/{id}/cancel"
    description: "Cancel the call. Inside the 24-hour AFM window the full wage estimate becomes a liability; at or outside it the commitment is released exactly."
    roles: [MusicHouseProducer]
    code: 200
    input: ["reason"]
    output: SessionCall
    side_effects: ["bookings -> PENALTY_ACCRUED or RELEASED", "Project ledger compensation", "posture recomputed and SUSPENDED_BUDGET sweep"]

  - method: POST
    path: "/session-calls/{id}/complete"
    description: "Wrap the call at actual_end_utc and settle wages. Fires the five-hop settlement cascade."
    roles: [MusicHouseProducer]
    code: 200
    input: ["actual_end_utc"]
    output: SessionCall
    side_effects: ["billed_hours / wage_total_cents / settled_total_cents written", "bookings -> WAGE_ACCRUED", "Project ledger moves committed -> spent + available", "posture recomputed and SUSPENDED_BUDGET sweep"]

  - method: POST
    path: "/license-deals"
    description: "Draft the licence for the selected demo. Requires expected_project_version; a new deal supersedes any DRAFT or PROPOSED deal on the same Project."
    roles: [RightsAdmin]
    code: 201
    input: ["project_id", "demo_id", "license_structure", "term_months?", "market_codes", "creative_fee_cents", "expected_project_version"]
    output: LicenseDeal
    side_effects: ["increments Project.version by 1", "prior DRAFT/PROPOSED deals -> SUPERSEDED", "license_fee_quoted_cents computed by the QUOTED_AT_DRAFT variant", "drafted_by_user_id := X-User-ID"]

  - method: GET
    path: "/license-deals/{id}"
    description: "Read a single licence deal including both fee variants and its version for OCC."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: []
    output: LicenseDeal
    side_effects: []

  - method: GET
    path: "/license-deals"
    description: "Paginated deal list; project_id and demo_id are the reverse-reachability filters."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: ["project_id?", "demo_id?", "status?", "limit?", "offset?"]
    output: LicenseDeal[]
    side_effects: []

  - method: POST
    path: "/license-deals/{id}/propose"
    description: "Send the drafted deal to the client and refresh the forward-looking quote."
    roles: [RightsAdmin]
    code: 200
    input: []
    output: LicenseDeal
    side_effects: ["license_fee_quoted_cents recomputed"]

  - method: POST
    path: "/license-deals/{id}/counter"
    description: "Client pushes the deal back to DRAFT with a revised term and market set."
    roles: [ClientRep]
    code: 200
    input: ["counter_note", "market_codes", "term_months?"]
    output: LicenseDeal
    side_effects: ["counter_round_count += 1", "term_months and market_codes replaced", "license_fee_quoted_cents recomputed"]

  - method: POST
    path: "/license-deals/{id}/accept"
    description: "Client accepts the proposed deal."
    roles: [ClientRep]
    code: 200
    input: []
    output: LicenseDeal
    side_effects: []

  - method: POST
    path: "/license-deals/{id}/activate"
    description: "Issue the licence. Segregation of duties forbids the drafting operator from activating."
    roles: [RightsAdmin]
    code: 200
    input: []
    output: LicenseDeal
    side_effects: ["effective_start_utc / effective_end_utc stamped", "license_fee_invoiced_cents computed by the INVOICED_AT_ACTIVATION variant", "activated_by_user_id := X-User-ID"]

  - method: POST
    path: "/license-deals/{id}/renew"
    description: "Renew a TERM licence that the clock sweep moved to RENEWAL_DUE."
    roles: [RightsAdmin]
    code: 200
    input: []
    output: LicenseDeal
    side_effects: ["renewal_fee_cents written", "renewal_count += 1", "effective window rolled forward", "license_fee_invoiced_cents recomputed"]

  - method: POST
    path: "/license-deals/{id}/reuse-extensions"
    description: "Licence the music into an additional market. Requires expected_license_deal_version."
    roles: [RightsAdmin]
    code: 201
    input: ["market_code", "expected_license_deal_version"]
    output: ReuseExtension
    side_effects: ["increments LicenseDeal.version by 1", "LicenseDeal.market_codes gains market_code", "LicenseDeal.license_fee_invoiced_cents recomputed by the INVOICED_AT_ACTIVATION variant"]

  - method: GET
    path: "/license-deals/{id}/reuse-extensions"
    description: "Sub-resource list of the deal's re-use extensions; reverse-reachability for ReuseExtension.license_deal_id."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: ReuseExtension[]
    side_effects: []

  - method: POST
    path: "/license-deals/{id}/deliverables"
    description: "Open the delivery package for an accepted or active deal. At most one per deal."
    roles: [MusicHouseProducer]
    code: 201
    input: []
    output: Deliverable
    side_effects: ["master_status := PENDING", "cuesheet_status := NOT_FILED", "unallocated_bps := 10000"]

  - method: GET
    path: "/license-deals/{id}/deliverables"
    description: "Sub-resource list of the deal's delivery packages; reverse-reachability for Deliverable.license_deal_id."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: Deliverable[]
    side_effects: []

  - method: GET
    path: "/deliverables/{id}"
    description: "Read a single delivery package with both of its independent status dimensions."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: []
    output: Deliverable
    side_effects: []

  - method: POST
    path: "/deliverables/{id}/stems"
    description: "Deliver stems and alternate lengths. Both sets must satisfy the brief exactly."
    roles: [MusicHouseProducer]
    code: 200
    input: ["stem_names", "lengths_seconds"]
    output: Deliverable
    side_effects: ["master_status PENDING -> STEMS_DELIVERED", "delivered_lengths and stem_manifest written"]

  - method: POST
    path: "/deliverables/{id}/approve-master"
    description: "Client signs off the master; moves the Project IN_PRODUCTION -> DELIVERED."
    roles: [ClientRep]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["master_status -> CLIENT_APPROVED", "Project IN_PRODUCTION -> DELIVERED"]

  - method: POST
    path: "/deliverables/{id}/reject-master"
    description: "Client rejects the master; the audio dimension reverts and the manifest is cleared."
    roles: [ClientRep]
    code: 200
    input: ["rejection_note"]
    output: Deliverable
    side_effects: ["master_status -> PENDING", "delivered_lengths and stem_manifest cleared"]

  - method: POST
    path: "/deliverables/{id}/cue-entries"
    description: "Add a writer line to the cue sheet and re-run the basis-point waterfall."
    roles: [RightsAdmin]
    code: 201
    input: ["composer_id", "role", "declared_weight"]
    output: CueSheetEntry
    side_effects: ["cue_share_allocation re-runs across all ALLOCATED entries", "Deliverable.unallocated_bps := 0"]

  - method: GET
    path: "/cue-entries/{id}"
    description: "Read a single cue-sheet line."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: []
    output: CueSheetEntry
    side_effects: []

  - method: GET
    path: "/cue-entries"
    description: "Paginated cue-sheet line list; deliverable_id and composer_id are the reverse-reachability filters."
    roles: [MusicHouseProducer, ClientRep, Composer, RightsAdmin, AFMSteward]
    code: 200
    input: ["deliverable_id?", "composer_id?", "status?", "limit?", "offset?"]
    output: CueSheetEntry[]
    side_effects: []

  - method: POST
    path: "/cue-entries/{id}/void"
    description: "Void a writer line and give its basis points back to the waterfall."
    roles: [RightsAdmin]
    code: 200
    input: []
    output: CueSheetEntry
    side_effects: ["share_bps := 0", "cue_share_allocation re-runs", "Deliverable.unallocated_bps := 10000 when no ALLOCATED entry remains", "cuesheet_status FILED -> NOT_FILED when no ALLOCATED entry remains"]

  - method: POST
    path: "/deliverables/{id}/file-cue-sheet"
    description: "File the cue sheet with the music house's rights desk."
    roles: [RightsAdmin]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["cuesheet_status NOT_FILED -> FILED"]

  - method: POST
    path: "/deliverables/{id}/register-cue-sheet"
    description: "Register the cue sheet with the PRO. Requires an ACTIVE licence deal."
    roles: [RightsAdmin]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["cuesheet_status FILED -> REGISTERED", "registered_at stamped", "Project DELIVERED -> CLOSED"]

  - method: POST
    path: "/library-tracks"
    description: "Add a production-library cue to the comparison catalogue."
    roles: [MusicHouseProducer]
    code: 201
    input: ["title", "blanket_fee_cents", "per_market_fee_cents", "max_markets", "min_length_seconds", "status?"]
    output: LibraryTrack
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed for the endpoint in §1.5"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed actor's X-User-ID does not match the governing Project.client_id or Demo.composer_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The RightsAdmin activating a LicenseDeal is the same operator id that drafted it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, unknown enum member, out-of-range integer, empty or duplicate-bearing array"
  - id: ERR_INVALID_TIME_WINDOW
    http: 400
    condition: "scheduled_end_utc is not strictly after scheduled_start_utc, or actual_end_utc is not strictly after scheduled_start_utc"
  - id: ERR_UNKNOWN_MARKET_CODE
    http: 400
    condition: "A supplied market code is absent from MARKET_TIER_MAP"
  - id: ERR_TERM_MONTHS_REQUIRED
    http: 400
    condition: "term_months missing on a TERM deal, or present on a BUYOUT deal"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id in the body does not resolve"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "Project id in the path or body does not resolve"
  - id: ERR_BRIEF_NOT_FOUND
    http: 404
