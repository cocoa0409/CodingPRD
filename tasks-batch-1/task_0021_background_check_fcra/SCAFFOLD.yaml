scenario: |
  Background Check & Adverse Action (FCRA): consumer consent, criminal/MVR/education
  verification, Pre-Adverse Action notice, Final Adverse Action, Ban-the-Box compliance,
  Salary History ban.
domain_name: background-check-fcra
api_prefix: /api/v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - conditional_feature_flags
  entity_topology: hybrid
  state_machine_shape: parallel       # 3 verification dimensions on BackgroundCheckOrder
  relationship_patterns:
    - one_to_many                     # Application -> BackgroundCheckOrder -> Verifications
    - cross_aggregate                 # AdverseAction references BackgroundCheckOrder + Application
  role_model: segregation_of_duties   # Recruiter cannot finalize Adverse Action
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID; identity only, never participates in business decisions."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code (e.g. CA, NY, TX); unique."
        constraints: "uppercase, length=2"
      - name: ban_the_box_enabled
        type: boolean
        source: input
        description: "If true, criminal history may not be inquired about before a conditional offer."
        default: false
      - name: salary_history_ban_enabled
        type: boolean
        source: input
        description: "If true, salary_history_disclosed on Application must remain null at submission."
        default: false
      - name: pre_adverse_waiting_days
        type: integer
        source: input
        description: "Number of full calendar days that must elapse between Pre-Adverse Action and Final Adverse Action. Federal minimum is 5; some states are higher."
        default: 5
        constraints: ">= 5"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Applicant's legal full name."
      - name: email
        type: string
        source: input
        description: "Unique email; lowercased on store."
      - name: date_of_birth
        type: datetime
        source: input
        description: "ISO 8601 date (midnight UTC). Used for identity matching on reports."

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; pins which ban-the-box / salary-history rules apply."
      - name: position_title
        type: string
        source: input
        description: "Job posting title."
      - name: salary_history_disclosed
        type: number
        source: input
        description: "Last salary in USD; MUST be null at submission when the jurisdiction has salary_history_ban_enabled=true."
        default: null
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state."
        constraints: "enum: DRAFT, SUBMITTED, CONDITIONAL_OFFER, HIRED, REJECTED, WITHDRAWN"
        default: DRAFT
      - name: conditional_offer_at
        type: datetime
        source: system
        description: "Server-stamped when conditional offer is extended; null before."
        default: null

  - name: ConsentDisclosure
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id"
      - name: disclosure_text_version
        type: string
        source: input
        description: "Version tag of the FCRA disclosure shown (e.g. 'v2024-01'). Stored for audit."
      - name: signed_at
        type: datetime
        source: input
        description: "Timestamp the applicant clicked Accept; ISO 8601."
      - name: ip_address
        type: string
        source: input
        description: "Client IP captured at consent."
      - name: consent_status
        type: enum
        source: system
        description: "Lifecycle of the consent record."
        constraints: "enum: PENDING, GRANTED, REVOKED"
        default: PENDING

  - name: BackgroundCheckOrder
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id"
      - name: consent_id
        type: string
        source: input
        description: "FK -> ConsentDisclosure.id; ordering requires GRANTED consent."
      - name: ordered_at
        type: datetime
        source: system
        description: "Server-stamped at POST /orders; ISO 8601."
      - name: status
        type: enum
        source: computed
        description: "Aggregate posture computed from the three Verification children: PENDING until any verification is non-PENDING; IN_REVIEW when at least one verification has reported (PASS or FAIL) and at least one still PENDING; COMPLETE when all three have reported; CANCELLED if explicitly cancelled before any report."
        constraints: "enum: PENDING, IN_REVIEW, COMPLETE, CANCELLED"
        default: PENDING
      - name: overall_result
        type: enum
        source: computed
        description: "Recomputed each time status reaches COMPLETE: CLEAR if all three Verifications are PASS; CONSIDER if any Verification is FAIL (drives Pre-Adverse Action). Null while status != COMPLETE."
        constraints: "enum: CLEAR, CONSIDER"
        default: null

  - name: Verification
    parent: BackgroundCheckOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> BackgroundCheckOrder.id"
      - name: verification_type
        type: enum
        source: input
        description: "Which verification stream this record represents. Exactly one of each type per order."
        constraints: "enum: CRIMINAL, MVR, EDUCATION"
      - name: status
        type: enum
        source: system
        description: "Per-stream lifecycle."
        constraints: "enum: PENDING, REPORTED, DISPUTED, RESOLVED"
        default: PENDING
      - name: result
        type: enum
        source: input
        description: "Verification outcome; required on REPORT. CRIMINAL records hit conviction details; MVR records license issues; EDUCATION records degree mismatch."
        constraints: "enum: PASS, FAIL"
        default: null
      - name: report_payload
        type: object
        source: input
        description: "Free-form JSON object with verification-specific evidence captured at REPORT time."
        default: null
      - name: reported_at
        type: datetime
        source: system
        description: "Server-stamped on REPORT transition."
        default: null
      - name: disputed_at
        type: datetime
        source: system
        description: "Server-stamped on DISPUTE transition."
        default: null

  - name: AdverseAction
    parent: BackgroundCheckOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> BackgroundCheckOrder.id; one AdverseAction per order."
      - name: status
        type: enum
        source: system
        description: "Pre-adverse to final-adverse flow."
        constraints: "enum: PRE_ADVERSE_SENT, DISPUTED, FINALIZED, CANCELLED"
        default: PRE_ADVERSE_SENT
      - name: pre_adverse_sent_at
        type: datetime
        source: system
        description: "Server-stamped when AdverseAction row is created; clock baseline for the FCRA waiting period."
      - name: earliest_final_at
        type: datetime
        source: computed
        description: "pre_adverse_sent_at + jurisdiction.pre_adverse_waiting_days (full days). Final Adverse Action POST is rejected before this timestamp."
      - name: finalized_at
        type: datetime
        source: system
        description: "Server-stamped on FINALIZE transition; null otherwise."
        default: null
      - name: finalized_by_user_id
        type: string
        source: system
        description: "Server-captured X-User-ID of the ComplianceOfficer who finalized; null otherwise. MUST differ from the Recruiter who triggered the Pre-Adverse Action (segregation of duties)."
        default: null
      - name: dispute_reason
        type: string
        source: input
        description: "Applicant-supplied dispute text; only set when status transitions to DISPUTED."
        default: null

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Always the literal string 'singleton' — there is exactly one clock row."
      - name: created_at
        type: datetime
        source: system
        description: "Stamped when the singleton is first materialised."
      - name: current_utc
        type: datetime
        source: input
        description: "Mutable test-controlled wall clock. All server-stamped timestamps and waiting-period comparisons read from this field, never from os time. Defaults to the seed value at boot."

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID."
      - name: created_at
        type: datetime
        source: system
        description: "Server-stamped at insertion; ordered ASC for tamper-evidence."
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role at the time of the action."
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID at the time of the action."
      - name: action
        type: string
        source: system
        description: "Short verb tag, e.g. CONSENT_GRANT, ORDER_CREATE, VERIFICATION_REPORT, PRE_ADVERSE_SEND, FINAL_ADVERSE_ISSUE."
      - name: entity_type
        type: string
        source: system
        description: "Entity name affected."
      - name: entity_id
        type: string
        source: system
        description: "id of the entity affected."
      - name: prior_state
        type: string
        source: system
        description: "Prior status (when applicable); null for create actions."
      - name: new_state
        type: string
        source: system
        description: "New status (when applicable)."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [HIRED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Application has at least one ConsentDisclosure row whose consent_status == GRANTED."
          - "If jurisdiction.salary_history_ban_enabled == true: application.salary_history_disclosed IS NULL (ERR_SALARY_HISTORY_DISCLOSED_BANNED)."
        side_effects:
          - "Application.status -> SUBMITTED; Application.version += 1."
          - "AuditLog row inserted with action=APPLICATION_SUBMIT."
      - from: SUBMITTED
        to: CONDITIONAL_OFFER
        trigger: "POST /applications/{id}/conditional-offer"
        actor: Recruiter
        preconditions:
          - "Application.status == SUBMITTED."
        side_effects:
          - "Application.status -> CONDITIONAL_OFFER; conditional_offer_at = SystemClock.current_utc; Application.version += 1."
          - "AuditLog row inserted with action=CONDITIONAL_OFFER."
        note: |
          Conditional-offer-first gate: in ban_the_box_enabled jurisdictions, no
          BackgroundCheckOrder may be created until this transition has fired.
      - from: CONDITIONAL_OFFER
        to: HIRED
        trigger: "POST /applications/{id}/hire"
        actor: Recruiter
        preconditions:
          - "Application.status == CONDITIONAL_OFFER."
          - "BackgroundCheckOrder for this application has status=COMPLETE AND overall_result=CLEAR."
        side_effects:
          - "Application.status -> HIRED; Application.version += 1."
          - "AuditLog row inserted with action=HIRE."
      - from: CONDITIONAL_OFFER
        to: REJECTED
        trigger: "system: AdverseAction.status -> FINALIZED (see AdverseAction state machine)"
        actor: system
        preconditions:
          - "An AdverseAction row tied to this Application's BackgroundCheckOrder reaches FINALIZED."
        side_effects:
          - "Application.status -> REJECTED; Application.version += 1."
          - "AuditLog row inserted with action=APPLICATION_REJECTED."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status == DRAFT."
        side_effects:
          - "Application.status -> WITHDRAWN; Application.version += 1."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status == SUBMITTED."
        side_effects:
          - "Application.status -> WITHDRAWN; Application.version += 1."

  - entity: ConsentDisclosure
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /consents/{id}/grant"
        actor: Applicant
        preconditions:
          - "ConsentDisclosure.consent_status == PENDING."
          - "signed_at <= SystemClock.current_utc (cannot grant in the future)."
        side_effects:
          - "ConsentDisclosure.consent_status -> GRANTED; version += 1."
          - "AuditLog row inserted with action=CONSENT_GRANT."
      - from: GRANTED
        to: REVOKED
        trigger: "POST /consents/{id}/revoke"
        actor: Applicant
        preconditions:
          - "ConsentDisclosure.consent_status == GRANTED."
          - "No BackgroundCheckOrder tied to this consent has status IN {IN_REVIEW, COMPLETE} (ERR_CONSENT_REVOKE_TOO_LATE)."
        side_effects:
          - "ConsentDisclosure.consent_status -> REVOKED; version += 1."
          - "If a BackgroundCheckOrder exists with status=PENDING for this consent, cascade-cancel: BackgroundCheckOrder.status -> CANCELLED; each child Verification with status=PENDING -> RESOLVED with result=null; order.version and each verification.version += 1."

  - entity: BackgroundCheckOrder
    initial_state: PENDING
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "system: first child Verification transitions to REPORTED while at least one sibling remains PENDING"
        actor: system
        preconditions:
          - "BackgroundCheckOrder.status == PENDING."
        side_effects:
          - "BackgroundCheckOrder.status -> IN_REVIEW; version += 1."
      - from: IN_REVIEW
        to: COMPLETE
        trigger: "system: all three child Verifications are in {REPORTED, RESOLVED} (non-PENDING, non-DISPUTED)"
        actor: system
        preconditions:
          - "All three Verifications have status IN {REPORTED, RESOLVED}."
        side_effects:
          - "BackgroundCheckOrder.status -> COMPLETE; overall_result computed per calc compute_overall_result; version += 1."
          - "If overall_result == CONSIDER: side-effect cascade hop A (see Difficulty Rule 4): a single AdverseAction row is auto-created with status=PRE_ADVERSE_SENT, pre_adverse_sent_at = SystemClock.current_utc, earliest_final_at computed per calc compute_earliest_final."
      - from: PENDING
        to: COMPLETE
        trigger: "system: all three Verifications report (PASS/FAIL) before any IN_REVIEW snapshot was taken (atomic burst)"
        actor: system
        preconditions:
          - "All three Verifications transitioned to REPORTED in the same logical step."
        side_effects:
          - "BackgroundCheckOrder.status -> COMPLETE; overall_result computed; version += 1."
          - "If overall_result == CONSIDER: AdverseAction auto-created (same cascade as above)."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel OR consent revocation cascade"
        actor: Recruiter | system
        preconditions:
          - "BackgroundCheckOrder.status == PENDING."
        side_effects:
          - "BackgroundCheckOrder.status -> CANCELLED; version += 1."
          - "Each child Verification with status=PENDING -> RESOLVED with result=null; version += 1 each."

  - entity: Verification
    initial_state: PENDING
    terminal_states: [RESOLVED]
    transitions:
      - from: PENDING
        to: REPORTED
        trigger: "POST /verifications/{id}/report"
        actor: VerificationProvider
        preconditions:
          - "Verification.status == PENDING."
          - "Parent BackgroundCheckOrder.status IN {PENDING, IN_REVIEW}."
          - "result field present (PASS or FAIL)."
        side_effects:
          - "Verification.status -> REPORTED; result, report_payload, reported_at set; version += 1."
          - "Parent BackgroundCheckOrder posture recomputed: PENDING->IN_REVIEW or ->COMPLETE per BackgroundCheckOrder transitions; order.version += 1 only if status changes."
          - "When parent recompute lands on COMPLETE with overall_result==CONSIDER, the AdverseAction auto-create cascade fires (cascade hop B per Difficulty Rule 4)."
      - from: REPORTED
        to: DISPUTED
        trigger: "POST /verifications/{id}/dispute"
        actor: Applicant
        preconditions:
          - "Verification.status == REPORTED."
          - "Parent BackgroundCheckOrder.status IN {IN_REVIEW, COMPLETE}."
          - "If parent has an AdverseAction row: AdverseAction.status == PRE_ADVERSE_SENT (cannot dispute after FINALIZED)."
        side_effects:
          - "Verification.status -> DISPUTED; disputed_at = SystemClock.current_utc; version += 1."
          - "If a parent AdverseAction row exists in PRE_ADVERSE_SENT: AdverseAction.status -> DISPUTED; version += 1 (cascade hop)."
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /verifications/{id}/resolve"
        actor: VerificationProvider
        preconditions:
          - "Verification.status == DISPUTED."
          - "Body field new_result present (PASS or FAIL)."
        side_effects:
          - "Verification.status -> RESOLVED; result = new_result; version += 1."
          - "Parent BackgroundCheckOrder.overall_result recomputed if status == COMPLETE; version += 1."
          - "If recomputed overall_result == CLEAR and parent AdverseAction exists, AdverseAction.status -> CANCELLED; version += 1 (compensating-action invariant: Application is NOT auto-rejected)."
      - from: REPORTED
        to: RESOLVED
        trigger: "system: parent BackgroundCheckOrder transitions to COMPLETE"
        actor: system
        preconditions:
          - "All sibling Verifications also REPORTED."
        side_effects:
          - "Verification.status -> RESOLVED; version += 1."

  - entity: AdverseAction
    initial_state: PRE_ADVERSE_SENT
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: PRE_ADVERSE_SENT
        to: DISPUTED
        trigger: "system: any child Verification of the parent order transitions REPORTED->DISPUTED"
        actor: system
        preconditions:
          - "AdverseAction.status == PRE_ADVERSE_SENT."
        side_effects:
          - "AdverseAction.status -> DISPUTED; version += 1."
      - from: DISPUTED
        to: PRE_ADVERSE_SENT
        trigger: "system: all disputed Verifications on the parent order reach RESOLVED with result FAIL"
        actor: system
        preconditions:
          - "AdverseAction.status == DISPUTED."
          - "No child Verification remains in DISPUTED."
        side_effects:
          - "AdverseAction.status -> PRE_ADVERSE_SENT; version += 1 (cycle back to allow finalize)."
      - from: PRE_ADVERSE_SENT
        to: FINALIZED
        trigger: "POST /adverse-actions/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "AdverseAction.status == PRE_ADVERSE_SENT."
          - "SystemClock.current_utc >= AdverseAction.earliest_final_at (ERR_WAITING_PERIOD_NOT_ELAPSED)."
          - "Acting X-User-ID != Application.submitted_by recruiter actor on the parent application's CONDITIONAL_OFFER row (segregation of duties; ERR_SEGREGATION_OF_DUTIES)."
          - "Parent BackgroundCheckOrder.status == COMPLETE AND overall_result == CONSIDER."
        side_effects:
          - "AdverseAction.status -> FINALIZED; finalized_at = SystemClock.current_utc; finalized_by_user_id = X-User-ID; version += 1."
          - "Cascade hop: Parent Application.status -> REJECTED; Application.version += 1 (per Application state machine)."
          - "AuditLog row inserted with action=FINAL_ADVERSE_ISSUE."
      - from: PRE_ADVERSE_SENT
        to: CANCELLED
        trigger: "system: parent BackgroundCheckOrder.overall_result recomputes to CLEAR after a dispute resolution"
        actor: system
        preconditions:
          - "AdverseAction.status == PRE_ADVERSE_SENT or DISPUTED."
          - "Recompute yields overall_result == CLEAR."
        side_effects:
          - "AdverseAction.status -> CANCELLED; version += 1."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: order-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /background-check-orders"
    occ_field: "expected_application_version"
    description: |
      Creating a BackgroundCheckOrder against an Application whose version has
      advanced since the client last observed it is rejected. Under §3.4 a
      ban-the-box jurisdiction's Application may have legitimately transitioned
      from SUBMITTED to CONDITIONAL_OFFER (or to WITHDRAWN) between the
      client's read and write; the stale-version check forces the recruiter to
      re-read and re-decide.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: finalize-stale-adverse-action
    parent_entity: AdverseAction
    write_endpoint: "POST /adverse-actions/{id}/finalize"
    occ_field: "expected_adverse_action_version"
    description: |
      Finalizing an AdverseAction whose version has advanced since the
      ComplianceOfficer last observed it is rejected. A sibling write
      legitimately bumped version (DISPUTED cycle, or auto-CANCELLED after
      dispute resolution); finalizing on stale state would skip the segregation
      and waiting-period re-checks. OCC catches it deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: compute_overall_result
    trigger: "On BackgroundCheckOrder.status transition to COMPLETE; re-run on any child Verification status change while parent.status == COMPLETE."
    algorithm: aggregation
    formula: |
      let verifications = Verifications WHERE order_id = order.id
      # Each verification contributes its CURRENT effective result:
      #   - REPORTED   -> result
      #   - DISPUTED   -> result (the disputed result is held during dispute)
      #   - RESOLVED   -> result (post-resolution value; may differ from REPORTED)
      #   - PENDING    -> not allowed at this calc trigger (status==COMPLETE precludes it)
      effective_results = [v.result for v in verifications]   # length must be exactly 3
      if any(r == FAIL for r in effective_results):
          return CONSIDER
      else:
          return CLEAR
    input_set: "Exactly the three Verification rows (CRIMINAL, MVR, EDUCATION) belonging to this order; PENDING rows are excluded because the calc only fires once status==COMPLETE."
    constants: {}
    precision: "n/a (categorical output)"
    variants:
      - name: initial_completion
        when: "First time BackgroundCheckOrder transitions to COMPLETE."
        difference: "Reads each verification's reported result (status==REPORTED). No DISPUTED or RESOLVED rows possible at this point."
      - name: post_dispute_recompute
        when: "After a Verification transitions DISPUTED -> RESOLVED while parent.status==COMPLETE."
        difference: "Reads each verification's result, where the just-RESOLVED row's value may have flipped FAIL -> PASS. The two variants produce different overall_result for identical original inputs when a dispute changes the verdict."

  - name: compute_earliest_final
    trigger: "On AdverseAction row creation (parent order reaches COMPLETE with overall_result=CONSIDER)."
    algorithm: threshold
    formula: |
      base = AdverseAction.pre_adverse_sent_at
      jur  = Jurisdiction WHERE id = Application.jurisdiction_id
      # Add exactly jur.pre_adverse_waiting_days calendar days, preserving the
      # base time-of-day (NOT day-boundary rounding). Per FCRA federal floor
      # the result MUST satisfy `floor_days >= 5`; if jur.pre_adverse_waiting_days < 5
      # the entry is rejected at Jurisdiction creation.
      earliest_final_at = base + timedelta(days=jur.pre_adverse_waiting_days)
    input_set: "AdverseAction.pre_adverse_sent_at and Jurisdiction.pre_adverse_waiting_days; no other rows enter."
    constants:
      FEDERAL_WAITING_DAY_FLOOR: 5
    precision: "Millisecond-precision datetime addition; finalize check is >=, not >."

  - name: applicant_risk_score
    trigger: "Recomputed on any Verification transition (REPORT, DISPUTE, RESOLVE) and on BackgroundCheckOrder.status change."
    algorithm: weighted_scoring
    formula: |
      # Three-input weighted score over the three Verification streams.
      # Each stream contributes a sub-score that is 0 when its result is PASS
      # and the stream's failure_weight (constant) when its result is FAIL.
      # PENDING streams are excluded from the denominator (forward-looking
      # interpretation: only reported streams enter the score).
      # Order of evaluation is FIXED: CRIMINAL first, MVR second, EDUCATION third.
      # The per-stream contribution is rounded HALF_UP to 2 decimals BEFORE
      # summing (round-then-sum order is pinned; sum-then-round produces a
      # different total when two streams round in opposite directions).
      stream_failure_weights = {CRIMINAL: 0.65, MVR: 0.25, EDUCATION: 0.10}
      contributions = []
      for stream in [CRIMINAL, MVR, EDUCATION]:
          v = Verification WHERE order_id=order.id AND verification_type=stream
          if v.status == PENDING: continue
          # effective result is v.result (post-dispute value if RESOLVED)
          weight = stream_failure_weights[stream]
          raw_contrib = (1.0 if v.result == FAIL else 0.0) * weight
          contrib = round_half_up(raw_contrib, 2)
          contributions.append(contrib)
      score = round_half_up(sum(contributions), 2)        # 0.00 .. 1.00
    input_set: "Verifications with status IN {REPORTED, DISPUTED, RESOLVED}; PENDING excluded."
    constants:
      CRIMINAL_WEIGHT: 0.65
      MVR_WEIGHT: 0.25
      EDUCATION_WEIGHT: 0.10
      RISK_THRESHOLD: 0.50
    precision: "round_half_up to 2 decimals at each step (per-contribution AND on the final sum)."
    variants:
      - name: provisional_in_review
        when: "BackgroundCheckOrder.status == IN_REVIEW (at least one stream still PENDING)."
        difference: "Excludes PENDING streams from the sum, producing a partial score that may UNDERSTATE risk relative to the final value."
      - name: final_complete
        when: "BackgroundCheckOrder.status == COMPLETE."
        difference: "All three streams contribute, possibly raising the score above RISK_THRESHOLD and triggering CONSIDER even when the in-review score was below threshold."

# =====================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =====================================================================
validations:
  - priority: 10
    category: auth
    check: "Request carries X-User-Role and X-User-ID headers."
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc when X-User-Role=PlatformAdmin"

  - priority: 20
    category: auth
    check: "X-User-Role value is one of the declared §1.7 roles."
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 30
    category: auth
    check: "Role has permission for this endpoint per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 40
    category: existence
    check: "All referenced resources in path resolve (left-to-right) and body FK fields resolve."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-templated and FK-bearing endpoints"

  - priority: 50
    category: state
    check: "Target entity is in a state from which the requested transition is legal per §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition-triggering endpoints"

  - priority: 55
    category: state
    check: "OCC: expected_<parent>_version equals current parent.version per §1.2.1."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints listed in §1.2.1"

  - priority: 60
    category: business_safety
    check: "Ban-the-Box gate: when jurisdiction.ban_the_box_enabled == true, POST /background-check-orders requires the parent Application.status == CONDITIONAL_OFFER (NOT SUBMITTED)."
    error_id: ERR_BAN_THE_BOX_PREMATURE_INQUIRY
    http_status: 422
    applies_to: "POST /background-check-orders"

  - priority: 65
    category: business_safety
    check: "Salary History Ban: when jurisdiction.salary_history_ban_enabled == true, Application.salary_history_disclosed MUST be null at submission."
    error_id: ERR_SALARY_HISTORY_DISCLOSED_BANNED
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 70
    category: business_safety
    check: "Segregation of duties: actor finalizing AdverseAction (X-User-ID) MUST NOT equal the X-User-ID who triggered the parent Application's CONDITIONAL_OFFER (which is captured in AuditLog)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /adverse-actions/{id}/finalize"

  - priority: 75
    category: business_temporal
    check: "FCRA waiting period: SystemClock.current_utc >= AdverseAction.earliest_final_at."
    error_id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /adverse-actions/{id}/finalize"

  - priority: 80
    category: business_referential
    check: "ConsentDisclosure for an order must reference the same applicant as the application; consent_status == GRANTED at order creation."
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 422
    applies_to: "POST /background-check-orders"

  - priority: 85
    category: business_referential
    check: "Cannot revoke consent once any child BackgroundCheckOrder has status IN {IN_REVIEW, COMPLETE}."
    error_id: ERR_CONSENT_REVOKE_TOO_LATE
    http_status: 422
    applies_to: "POST /consents/{id}/revoke"

  - priority: 88
    category: business_constraint
    check: "At most one ConsentDisclosure per application_id may have consent_status IN {PENDING, GRANTED} at a time. A second POST /consents while one is open is rejected."
    error_id: ERR_CONSENT_ALREADY_OPEN
    http_status: 422
    applies_to: "POST /consents"

  - priority: 90
    category: business_constraint
    check: "Verification.verification_type must be unique within the parent BackgroundCheckOrder (exactly one CRIMINAL, MVR, EDUCATION)."
    error_id: ERR_DUPLICATE_VERIFICATION_TYPE
    http_status: 422
    applies_to: "POST /background-check-orders/{id}/verifications"

  - priority: 95
    category: business_constraint
    check: "Jurisdiction.pre_adverse_waiting_days >= FEDERAL_WAITING_DAY_FLOOR (5)."
    error_id: ERR_BELOW_FEDERAL_FLOOR
    http_status: 422
    applies_to: "POST /jurisdictions, PATCH /jurisdictions/{id}"

  - priority: 100
    category: business_constraint
    check: "Request body schema (types, enum values, required fields) is well-formed."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---------- Jurisdictions ----------
  - method: POST
    path: /api/v1/jurisdictions
    description: "Create a US-state jurisdiction with ban-the-box and salary-history-ban toggles."
    roles: [PlatformAdmin]
    code: 201
    input: ["state_code", "ban_the_box_enabled?", "salary_history_ban_enabled?", "pre_adverse_waiting_days?"]
    output: Jurisdiction
    side_effects: ["Jurisdiction row inserted."]

  - method: GET
    path: /api/v1/jurisdictions/{id}
    description: "Fetch a jurisdiction by id."
    roles: [PlatformAdmin, Recruiter, ComplianceOfficer, VerificationProvider, Applicant]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: /api/v1/jurisdictions
    description: "List jurisdictions; supports filtering by state_code."
    roles: [PlatformAdmin, Recruiter, ComplianceOfficer]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  # ---------- Applicants ----------
  - method: POST
    path: /api/v1/applicants
    description: "Register an applicant."
    roles: [Applicant, Recruiter]
    code: 201
    input: [full_name, email, date_of_birth]
    output: Applicant
    side_effects: ["Applicant row inserted."]

  - method: GET
    path: /api/v1/applicants/{id}
    description: "Fetch applicant by id."
    roles: [Applicant, Recruiter, ComplianceOfficer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ---------- Applications ----------
  - method: POST
    path: /api/v1/applications
    description: "Create an Application in DRAFT for a given Applicant + Jurisdiction."
    roles: [Applicant, Recruiter]
    code: 201
    input: ["applicant_id", "jurisdiction_id", "position_title", "salary_history_disclosed?"]
    output: Application
    side_effects: ["Application inserted with status=DRAFT."]

  - method: GET
    path: /api/v1/applications/{id}
    description: "Fetch application."
    roles: [Applicant, Recruiter, ComplianceOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: /api/v1/applications
    description: "List applications; supports filtering by applicant_id."
    roles: [Recruiter, ComplianceOfficer]
    code: 200
    input: ["applicant_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: /api/v1/applications/{id}/submit
    description: "Submit a draft Application; requires GRANTED consent and (in salary-ban jurisdictions) salary_history_disclosed=null."
    roles: [Applicant]
    code: 200
    input: [expected_application_version]
    output: Application
    side_effects:
      - "Application.status DRAFT -> SUBMITTED; Application.version += 1."
      - "AuditLog row appended."

  - method: POST
    path: /api/v1/applications/{id}/conditional-offer
    description: "Recruiter extends a conditional offer to a SUBMITTED application; required gate in ban-the-box jurisdictions before any criminal inquiry."
    roles: [Recruiter]
    code: 200
    input: [expected_application_version]
    output: Application
    side_effects:
      - "Application.status SUBMITTED -> CONDITIONAL_OFFER; conditional_offer_at = current_utc; Application.version += 1."
      - "AuditLog row appended with the acting Recruiter's X-User-ID (used later for segregation-of-duties check)."

  - method: POST
    path: /api/v1/applications/{id}/hire
    description: "Recruiter hires applicant; requires order COMPLETE+CLEAR."
    roles: [Recruiter]
    code: 200
    input: [expected_application_version]
    output: Application
    side_effects:
      - "Application.status CONDITIONAL_OFFER -> HIRED; Application.version += 1."

  - method: POST
    path: /api/v1/applications/{id}/withdraw
    description: "Applicant withdraws a DRAFT or SUBMITTED application."
    roles: [Applicant]
    code: 200
    input: [expected_application_version]
    output: Application
    side_effects:
      - "Application.status -> WITHDRAWN; Application.version += 1."

  # ---------- Consent ----------
  - method: POST
    path: /api/v1/consents
    description: "Create a ConsentDisclosure record (PENDING) for an Application."
    roles: [Applicant]
    code: 201
    input: [application_id, disclosure_text_version, signed_at, ip_address]
    output: ConsentDisclosure
    side_effects: ["ConsentDisclosure inserted with consent_status=PENDING."]

  - method: POST
    path: /api/v1/consents/{id}/grant
    description: "Applicant grants the pending consent."
    roles: [Applicant]
    code: 200
    input: [expected_consent_disclosure_version]
    output: ConsentDisclosure
    side_effects:
      - "ConsentDisclosure.consent_status PENDING -> GRANTED; version += 1."
      - "AuditLog row appended."

  - method: POST
    path: /api/v1/consents/{id}/revoke
    description: "Applicant revokes a granted consent; cascade-cancels any PENDING order."
    roles: [Applicant]
    code: 200
    input: [expected_consent_disclosure_version]
    output: ConsentDisclosure
    side_effects:
      - "ConsentDisclosure.consent_status GRANTED -> REVOKED; version += 1."
      - "Cascade: any PENDING BackgroundCheckOrder for this consent -> CANCELLED, each PENDING child Verification -> RESOLVED with result=null; each version += 1."

  - method: GET
    path: /api/v1/consents/{id}
    description: "Fetch consent record."
    roles: [Applicant, Recruiter, ComplianceOfficer]
    code: 200
    input: []
    output: ConsentDisclosure
    side_effects: []

  - method: GET
    path: /api/v1/applications/{id}/consents
    description: "List ConsentDisclosure rows for an Application (sub-resource form for FK reverse-reachability)."
    roles: [Applicant, Recruiter, ComplianceOfficer]
    code: 200
    input: []
    output: ConsentDisclosure[]
    side_effects: []

  # ---------- BackgroundCheckOrder ----------
  - method: POST
    path: /api/v1/background-check-orders
    description: "Recruiter creates a BackgroundCheckOrder; ban-the-box jurisdictions require Application.status==CONDITIONAL_OFFER."
    roles: [Recruiter]
    code: 201
    input: [application_id, consent_id, expected_application_version]
    output: BackgroundCheckOrder
    side_effects:
      - "BackgroundCheckOrder inserted with status=PENDING, ordered_at=current_utc; Application.version += 1."

  - method: GET
    path: /api/v1/background-check-orders/{id}
    description: "Fetch order."
    roles: [Recruiter, ComplianceOfficer, Applicant, VerificationProvider]
    code: 200
    input: []
    output: BackgroundCheckOrder
    side_effects: []

  - method: GET
    path: /api/v1/background-check-orders
    description: "List orders; supports filtering by application_id and consent_id (for FK reverse-reachability)."
    roles: [Recruiter, ComplianceOfficer, Applicant]
    code: 200
    input: ["application_id?", "consent_id?", "status?", "limit?", "offset?"]
    output: BackgroundCheckOrder[]
    side_effects: []

  - method: POST
    path: /api/v1/background-check-orders/{id}/verifications
    description: "Create one Verification (CRIMINAL/MVR/EDUCATION) for an order; exactly one of each type per order."
    roles: [Recruiter]
    code: 201
    input: [verification_type]
    output: Verification
    side_effects: ["Verification inserted with status=PENDING."]

  - method: POST
    path: /api/v1/background-check-orders/{id}/cancel
    description: "Recruiter cancels a PENDING order."
    roles: [Recruiter]
    code: 200
    input: [expected_background_check_order_version]
    output: BackgroundCheckOrder
    side_effects:
      - "BackgroundCheckOrder.status PENDING -> CANCELLED; version += 1."
      - "Each PENDING child Verification -> RESOLVED with result=null; version += 1."

  - method: GET
    path: /api/v1/background-check-orders/{id}/risk-score
    description: "Computed read: returns the current applicant_risk_score for this order, the variant in use (provisional or final), and whether the score crosses RISK_THRESHOLD."
    roles: [Recruiter, ComplianceOfficer]
    code: 200
    input: []
    output: "{ score: number, variant: string, exceeds_threshold: boolean, threshold: number }"
    side_effects: []

  # ---------- Verification ----------
  - method: GET
    path: /api/v1/verifications/{id}
    description: "Fetch a verification."
    roles: [Recruiter, ComplianceOfficer, VerificationProvider, Applicant]
    code: 200
    input: []
    output: Verification
    side_effects: []

  - method: GET
    path: /api/v1/background-check-orders/{id}/verifications
    description: "List verifications under an order (sub-resource form for FK reverse-reachability)."
    roles: [Recruiter, ComplianceOfficer, VerificationProvider, Applicant]
    code: 200
    input: []
    output: Verification[]
    side_effects: []

  - method: POST
    path: /api/v1/verifications/{id}/report
    description: "Provider reports a verification outcome (PASS/FAIL)."
    roles: [VerificationProvider]
    code: 200
    input: [result, report_payload, expected_verification_version]
    output: Verification
    side_effects:
      - "Verification.status PENDING -> REPORTED; result/report_payload/reported_at set; version += 1."
      - "Parent BackgroundCheckOrder posture recomputed (PENDING/IN_REVIEW/COMPLETE)."
      - "If parent reaches COMPLETE with overall_result=CONSIDER: AdverseAction row auto-created in PRE_ADVERSE_SENT."

  - method: POST
    path: /api/v1/verifications/{id}/dispute
    description: "Applicant disputes a REPORTED verification."
    roles: [Applicant]
    code: 200
    input: [dispute_reason, expected_verification_version]
    output: Verification
    side_effects:
      - "Verification.status REPORTED -> DISPUTED; disputed_at set; version += 1."
      - "Any parent AdverseAction in PRE_ADVERSE_SENT cascades to DISPUTED."

  - method: POST
    path: /api/v1/verifications/{id}/resolve
    description: "Provider resolves a DISPUTED verification with a final result."
    roles: [VerificationProvider]
    code: 200
    input: [new_result, expected_verification_version]
    output: Verification
    side_effects:
      - "Verification.status DISPUTED -> RESOLVED; result = new_result; version += 1."
      - "Parent BackgroundCheckOrder.overall_result recomputed."
      - "If recompute yields CLEAR and AdverseAction exists, AdverseAction.status -> CANCELLED."
      - "If no Verifications remain DISPUTED and overall_result still CONSIDER, AdverseAction.status DISPUTED -> PRE_ADVERSE_SENT."

  # ---------- AdverseAction ----------
  - method: GET
    path: /api/v1/adverse-actions/{id}
    description: "Fetch an adverse action."
    roles: [Recruiter, ComplianceOfficer, Applicant]
    code: 200
    input: []
    output: AdverseAction
    side_effects: []

  - method: GET
    path: /api/v1/background-check-orders/{id}/adverse-action
    description: "Sub-resource: list (0 or 1) AdverseAction row for the order (FK reverse-reachability)."
    roles: [Recruiter, ComplianceOfficer, Applicant]
    code: 200
    input: []
    output: AdverseAction[]
    side_effects: []

  - method: POST
    path: /api/v1/adverse-actions/{id}/finalize
    description: "ComplianceOfficer finalizes the AdverseAction after the FCRA waiting period; cascades Application -> REJECTED."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_adverse_action_version]
    output: AdverseAction
    side_effects:
      - "AdverseAction.status PRE_ADVERSE_SENT -> FINALIZED; finalized_at = current_utc; finalized_by_user_id = X-User-ID; version += 1."
      - "Parent Application.status CONDITIONAL_OFFER -> REJECTED; Application.version += 1."
      - "AuditLog row appended with action=FINAL_ADVERSE_ISSUE."

  # ---------- AuditLog (read) ----------
  - method: GET
    path: /api/v1/audit-logs
    description: "List audit log rows; supports filtering by entity_type and entity_id."
    roles: [ComplianceOfficer]
    code: 200
    input: ["entity_type?", "entity_id?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  # ---------- Test-driving (under /_) ----------
  - method: POST
    path: /api/v1/_clock/set_current_utc
    description: "Set the SystemClock singleton to an arbitrary ISO timestamp. Used by tests to fast-forward the FCRA waiting period."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: SystemClock
    side_effects: ["SystemClock.current_utc updated."]

  - method: GET
    path: /api/v1/_clock
    description: "Read current SystemClock singleton."
    roles: [PlatformAdmin, Recruiter, ComplianceOfficer]
    code: 200
    input: []
    output: SystemClock
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "X-User-Role or X-User-ID header missing on a non-public endpoint."
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role value is not a declared §1.7 role name."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role authenticated but not permitted for the requested endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated or FK resource id does not resolve."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Body shape, types, enum values, or required fields invalid."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not legal from the entity's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "Provided expected_<parent>_version does not equal current parent.version (OCC mismatch per §1.2.1)."
  - id: ERR_BAN_THE_BOX_PREMATURE_INQUIRY
    http: 422
    condition: "POST /background-check-orders in a ban-the-box jurisdiction while Application.status != CONDITIONAL_OFFER."
  - id: ERR_SALARY_HISTORY_DISCLOSED_BANNED
    http: 422
    condition: "Application.salary_history_disclosed not null at submission in a salary-history-ban jurisdiction."
  - id: ERR_CONSENT_NOT_GRANTED
    http: 422
    condition: "BackgroundCheckOrder creation references a consent whose status != GRANTED, or whose applicant != application's applicant."
  - id: ERR_CONSENT_REVOKE_TOO_LATE
    http: 422
    condition: "Consent revoke attempted while a child order has status IN {IN_REVIEW, COMPLETE}."
  - id: ERR_DUPLICATE_VERIFICATION_TYPE
    http: 422
    condition: "Creating a verification of a type already present on the order."
  - id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http: 422
    condition: "Finalize adverse action attempted while SystemClock.current_utc < AdverseAction.earliest_final_at."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "ComplianceOfficer attempting finalize is the same X-User-ID who issued the conditional offer on the parent application."
  - id: ERR_BELOW_FEDERAL_FLOOR
    http: 422
    condition: "Jurisdiction.pre_adverse_waiting_days < FEDERAL_WAITING_DAY_FLOOR (5)."
  - id: ERR_CONSENT_ALREADY_OPEN
    http: 422
    condition: "POST /consents while another consent for the same application has consent_status IN {PENDING, GRANTED}."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: PlatformAdmin
    description: "Operator account managing jurisdictions and (test only) the SystemClock."
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/jurisdictions"
      - "POST /api/v1/_clock/set_current_utc"
    shared_operations:
      - "GET /api/v1/jurisdictions"
      - "GET /api/v1/jurisdictions/{id}"
      - "GET /api/v1/_clock"

  - name: Applicant
    description: "Job applicant; entity-backed by Applicant. X-User-ID equals the Applicant.id; ownership checks compare to Application.applicant_id chain."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /api/v1/applications/{id}/submit"
      - "POST /api/v1/applications/{id}/withdraw"
      - "POST /api/v1/consents"
      - "POST /api/v1/consents/{id}/grant"
      - "POST /api/v1/consents/{id}/revoke"
      - "POST /api/v1/verifications/{id}/dispute"
    shared_operations:
      - "POST /api/v1/applicants"
      - "POST /api/v1/applications"
      - "GET /api/v1/applications/{id}"
      - "GET /api/v1/applicants/{id}"
      - "GET /api/v1/consents/{id}"
      - "GET /api/v1/applications/{id}/consents"
      - "GET /api/v1/background-check-orders/{id}"
      - "GET /api/v1/background-check-orders"
      - "GET /api/v1/background-check-orders/{id}/verifications"
      - "GET /api/v1/verifications/{id}"
      - "GET /api/v1/background-check-orders/{id}/adverse-action"
      - "GET /api/v1/adverse-actions/{id}"
      - "GET /api/v1/jurisdictions/{id}"

  - name: Recruiter
    description: "Hiring manager; opaque operator id. May create applications/orders but may NOT finalize adverse actions on an application they extended the conditional offer for (segregation of duties enforced by validation rule 70)."
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/applications/{id}/conditional-offer"
      - "POST /api/v1/applications/{id}/hire"
      - "POST /api/v1/background-check-orders"
      - "POST /api/v1/background-check-orders/{id}/verifications"
      - "POST /api/v1/background-check-orders/{id}/cancel"
    shared_operations:
      - "POST /api/v1/applicants"
      - "POST /api/v1/applications"
      - "GET /api/v1/applications"
      - "GET /api/v1/applications/{id}"
      - "GET /api/v1/applicants/{id}"
      - "GET /api/v1/consents/{id}"
      - "GET /api/v1/applications/{id}/consents"
      - "GET /api/v1/background-check-orders/{id}"
      - "GET /api/v1/background-check-orders"
      - "GET /api/v1/background-check-orders/{id}/verifications"
      - "GET /api/v1/background-check-orders/{id}/risk-score"
      - "GET /api/v1/verifications/{id}"
      - "GET /api/v1/background-check-orders/{id}/adverse-action"
      - "GET /api/v1/adverse-actions/{id}"
      - "GET /api/v1/jurisdictions"
      - "GET /api/v1/jurisdictions/{id}"
      - "GET /api/v1/_clock"

  - name: ComplianceOfficer
    description: "Issues final adverse actions and audits the workflow. Opaque. Subject to segregation-of-duties rule (cannot be the recruiter who extended the offer)."
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/adverse-actions/{id}/finalize"
      - "GET /api/v1/audit-logs"
    shared_operations:
      - "GET /api/v1/applications"
      - "GET /api/v1/applications/{id}"
      - "GET /api/v1/applicants/{id}"
      - "GET /api/v1/consents/{id}"
      - "GET /api/v1/applications/{id}/consents"
      - "GET /api/v1/background-check-orders/{id}"
      - "GET /api/v1/background-check-orders"
      - "GET /api/v1/background-check-orders/{id}/verifications"
      - "GET /api/v1/background-check-orders/{id}/risk-score"
      - "GET /api/v1/verifications/{id}"
      - "GET /api/v1/background-check-orders/{id}/adverse-action"
      - "GET /api/v1/adverse-actions/{id}"
      - "GET /api/v1/jurisdictions"
      - "GET /api/v1/jurisdictions/{id}"
