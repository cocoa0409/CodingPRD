              captures: { v_after_customers: $.data.version }
            - *k_ev1
            - *k_scope
            - *k_batch_adv
            - *k_clock_0813
            - *k_disp_adv
            - *k_arm
            - *k_batch_imm
            - *k_clock_0815_17
            - *k_disp_imm
            - *k_clock_0815_19
          trigger:
