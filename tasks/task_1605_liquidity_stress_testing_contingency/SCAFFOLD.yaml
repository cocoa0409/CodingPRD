    description: "Activate an APPROVED playbook (posture gate + single-active-playbook exclusion)"
    roles: [LiquidityCommittee]
    code: 200
    input: []
    output: ContingencyPlaybook
    side_effects: ["APPROVED -> ACTIVATED; activated_at set; every PENDING action becomes READY"]

  - method: POST
    path: "/liquidity/contingency-playbooks/{id}/stand-down"
    description: "Stand down an ACTIVATED/EXECUTING playbook (no EXECUTING actions allowed)"
    roles: [LiquidityCommittee]
    code: 200
    input: []
    output: ContingencyPlaybook
    side_effects: ["-> STOOD_DOWN; PENDING/READY/BLOCKED actions become SKIPPED"]

  - method: POST
    path: "/liquidity/contingency-playbooks/{id}/revise"
    description: "Return a STOOD_DOWN playbook to DRAFT for revision (cycle)"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: ContingencyPlaybook
    side_effects: ["STOOD_DOWN -> DRAFT; tested_at and approved_by_user_id cleared; SKIPPED actions become PENDING"]

  - method: POST
    path: "/liquidity/contingency-playbooks/{id}/complete"
    description: "Complete an EXECUTING playbook when all actions are terminal"
    roles: [LiquidityCommittee]
    code: 200
    input: []
    output: ContingencyPlaybook
    side_effects: ["EXECUTING -> COMPLETED"]

  - method: POST
