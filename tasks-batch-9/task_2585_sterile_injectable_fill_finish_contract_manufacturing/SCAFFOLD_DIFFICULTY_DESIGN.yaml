            - call: "POST /deviations/${dev2_id}/decide-capa"
              payload: { outcome: "REJECTED", decision_note: "Effectiveness check is not defined; resubmit." }
              as: QaReviewer
              as_user_id: "qa-002"
            - call: "POST /deviations/${dev2_id}/submit-capa"
