              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln95_n: $.data.id }
            - call: "POST /nac/order-lines/${ln95_n}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${c94_id}", product_id: "${beef_id}", distribution_center_id: "${dc_id}", quantity_cases: 94 }
