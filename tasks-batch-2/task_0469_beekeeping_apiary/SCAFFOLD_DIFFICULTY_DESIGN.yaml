        distinguishing_aspect: "Category pair state(p6) vs business_safety(p8): a BLOCKED (non-DRAFT, non-terminal) lot whose contributing hive is ALSO under APIVAR withdrawal returns ERR_INVALID_STATE (p6), not ERR_HARVEST_BLOCKED_WITHDRAWAL (p8) — the higher-priority state check wins."
