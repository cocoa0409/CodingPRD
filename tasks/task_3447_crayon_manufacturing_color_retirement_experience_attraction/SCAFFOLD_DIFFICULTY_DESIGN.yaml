            - "after the final epoch, Color.${c_id}.status == ACTIVE"
            - "Color.${c_id}.introduced_on == 2026-10-10T23:59:59Z (the second campaign's closes_on)"
            - "GET /crayon-works/colors/${c_id}/vote-campaigns shows data[0].outcome == FAILED and data[1].outcome == PASSED"

