# =============================================================================
# 1.9 Scaffold Corner Design — task_2628
# Resort Fee & Ancillary Charge Disclosure Compliance
#
# Breadth probe. Walks references/claim-extraction-guide.md row by row against
# this scaffold's SS1.1-SS1.7 surface. Sections and claim_type values are taken
# verbatim from that guide. Corners already asserted by SCAFFOLD_DIFFICULTY_
# DESIGN.yaml appear as excluded_because stubs naming the SS1.8 instance.
#
# Two fixtures recur:
#   MINIMAL PUBLISHED FIXTURE  - clock 2026-08-01, jurisdiction US-NV-CLARK
#     (occupancy 1338 bps, both mandates true), property base rate 29900 ACTIVE,
#     one OTA channel supporting both capabilities, fee program FY26-Q4 over
#     [2026-09-01, 2026-12-01) carrying a single MANDATORY RESORT fee at 750 bps
#     with one inclusion, published by u-comp-1. Derived: per-night 2243,
#     rollup total_mandatory_fee_cents_per_night 2243, inclusion_coverage_ratio
#     1.0000, profile score 100.
#   STAY FIXTURE - the above plus a DEPLOYED full-disclosure profile and a
#     4-night 2-guest booking at 29900 arriving 2026-09-10. Derived: quote
#     119600 room + 8972 fee + 17203 tax = 145775; folio ROOM 119600/16002 and
#     RESORT 8970/1200, charges 128570, tax 17202, total 145772, variance -3.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: jurisdiction_creation_returns_201_with_optional_flags_defaulted
        claim_type: creation
        grounds:
          - entities.Jurisdiction
          - endpoints[POST /jurisdictions]
        distinguishing_aspect: "Creation with only the five required inputs returns 201 and the full row, with mandatory_fee_ban and opt_out_mandate defaulted to false rather than null or absent."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "HTTP 201 with response_type object and a data object carrying every declared Jurisdiction field"
            - "data.code == US-NV-CLARK, data.name == Clark County NV, data.occupancy_tax_rate_bps == 1338, data.first_quote_total_required == true, data.itemization_required_on_folio == true"
            - "data.mandatory_fee_ban == false and data.opt_out_mandate == false — both defaulted, neither null nor missing"
            - "data.id is a bare UUID with no type prefix, data.version == 1, data.created_at == 2026-08-01T00:00:00.000Z and data.updated_at == data.created_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the success envelope"

      - name: property_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Property
          - endpoints[GET /properties/{id}]
        distinguishing_aspect: "A GET by id returns the same field values the create call returned, including the computed posture fields, and does not mutate version."
        test_recipe:
          setup:
            - "One jurisdiction and one property created at clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /properties/${p1}"
              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
          assert:
            - "HTTP 200 with data.id == ${p1}, data.jurisdiction_id == ${j_nv}, data.name == Mirage Sands Resort, data.brand_code == MSR, data.base_room_rate_cents == 29900, data.status == ACTIVE"
            - "data.min_channel_disclosure_score == null, data.disclosure_posture == COMPLIANT, data.open_disclosure_obligation_count == 0, data.published_fee_program_count == 0, data.aggregate_disclosure_gap_cents == 0"
            - "data.version == 1 — a read does not bump version, and data.updated_at is unchanged from the create response"

      - name: fee_program_listing_filters_by_property_and_paginates
        claim_type: listing
        grounds:
          - entities.FeeProgram
          - endpoints[GET /fee-programs]
        distinguishing_aspect: "Two DRAFT programs on one property, fetched with limit 1: the list reports total_count 2 and has_more true while returning exactly one row, and the status filter is applied before pagination."
        test_recipe:
          setup:
            - "One property carrying two DRAFT fee programs, FY26-Q4 and FY27-Q1, created in that order"
            - "The second create re-reads Property.version, because the first create bumped it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp1: $.data.id }
            - call: "GET /properties/${p1}"
              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { p1_v2: $.data.version }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY27-Q1", effective_from: "2026-12-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z", expected_property_version: "${p1_v2}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp2: $.data.id }
          trigger:
            - call: "GET /fee-programs"
              payload: { property_id: "${p1}", status: "DRAFT", limit: 1, offset: 0 }
              as: RevenueManager
              as_user_id: "u-rev-1"
          assert:
            - "HTTP 200 with response_type array; the data array holds exactly 1 item"
            - "the pagination fields report limit == 1, offset == 0, total_count == 2 and has_more == true"
            - "the single returned item is ${fp1} — ordering is by created_at ASC, never by id"
            - "the same call with offset 1 returns ${fp2} with has_more == false"
            - "the same call with status PUBLISHED returns an empty array with total_count == 0 and has_more == false"
            - "omitting limit applies the default limit 10 and returns both rows"

      - name: booking_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Booking
          - validations[priority=6]
          - errors[ERR_BOOKING_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown UUID in the path yields ERR_BOOKING_NOT_FOUND (404), not ERR_INVALID_REQUEST and not an empty 200."
        test_recipe:
          setup:
            - "Empty database apart from the clock; no Booking rows exist at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "u-gsa-1"
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_BOOKING_NOT_FOUND"
            - "the same unknown id on GET /folios/{id} yields ERR_FOLIO_NOT_FOUND and on GET /fee-programs/{id} yields ERR_FEE_PROGRAM_NOT_FOUND — the code names the addressed entity, per validations[priority=6]"
            - "GET /bookings with no filters returns HTTP 200 with an empty data array and total_count 0 — a missing collection is not a 404"

      - name: channel_creation_without_supports_itemization_is_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Channel
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "supports_itemization has source input and no default, so omitting it is a 422 ERR_INVALID_REQUEST rather than a silent false."
        test_recipe:
          setup:
            - "Empty database apart from the clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /channels"
              payload: { name: "BigOTA", channel_type: "OTA", supports_total_price_display: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "no Channel row is created — a subsequent GET /channels returns total_count 0"
            - "an explicit null for supports_itemization is rejected identically; only true or false is accepted"
            - "supplying all four required fields returns HTTP 201, proving the rejection is about the missing field and not the endpoint"

      - name: property_status_defaults_to_active_with_zeroed_derived_counters
        claim_type: defaults
        grounds:
          - entities.Property.status
          - entities.Property.disclosure_posture
        distinguishing_aspect: "status is the only optional input on POST /properties; omitting it yields ACTIVE, while the computed posture fields take their declared defaults COMPLIANT and null rather than 0."
        test_recipe:
          setup:
            - "One jurisdiction, clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "HTTP 201 with data.status == ACTIVE"
            - "data.min_channel_disclosure_score == null (declared default), NOT 0 — an unscored property is distinguishable from a zero-scored one"
            - "data.disclosure_posture == COMPLIANT, data.open_disclosure_obligation_count == 0, data.published_fee_program_count == 0, data.aggregate_disclosure_gap_cents == 0"
            - "passing status SUSPENDED explicitly returns 201 with data.status == SUSPENDED, so the default is not a hard-coded constant"

      - name: fee_program_rollups_track_fee_creation_but_wait_for_publication
        claim_type: computed_fields
        grounds:
          - entities.FeeProgram.fee_count
          - entities.FeeProgram.mandatory_fee_count
          - entities.FeeProgram.total_mandatory_fee_cents_per_night
          - calculations.fee_program_rollup
        distinguishing_aspect: "fee_count and mandatory_fee_count are recomputed on every Fee create, while total_mandatory_fee_cents_per_night and inclusion_coverage_ratio are computed only at publication — so a DRAFT program with one mandatory fee reports 1, 1, 0 and 0.0."
        test_recipe:
          setup:
            - "One DRAFT fee program on an ACTIVE property, no fees yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp1: $.data.id }
          trigger:
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 750, disclosure_text: "Resort fee of 7.5% of the nightly room rate." }
              as: RevenueManager
              as_user_id: "u-rev-1"
          assert:
            - "at program creation the rollups were fee_count 0, mandatory_fee_count 0, total_mandatory_fee_cents_per_night 0 and inclusion_coverage_ratio 0.0"
            - "HTTP 201 for the fee; re-reading GET /fee-programs/${fp1} now shows fee_count == 1 and mandatory_fee_count == 1"
            - "total_mandatory_fee_cents_per_night is STILL 0 and inclusion_coverage_ratio is STILL 0.0 — both are computed at publication, not on fee create"
            - "adding a second Fee with classification OPTIONAL raises fee_count to 2 while mandatory_fee_count stays 1"
            - "the Fee response echoes amount_cents null and avoidable false, since a PERCENT_OF_ROOM fee carries percent_bps 750 instead of an amount"

      - name: property_system_fields_are_server_minted_uuid_and_version_one
        claim_type: system_fields
        grounds:
          - entities.Property
          - complexity_profile.consistency_model
        distinguishing_aspect: "id, created_at, updated_at and version are all server-minted; created_at follows the logical clock rather than wall time, and id carries no type prefix so it can never be parsed for business meaning."
        test_recipe:
          setup:
            - "One jurisdiction; the clock is deliberately moved to 2026-08-15T09:30:00Z before the property is created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:30:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "HTTP 201 with data.created_at == 2026-08-15T09:30:00.000Z and data.updated_at == 2026-08-15T09:30:00.000Z — both follow the logical clock, and the jurisdiction created earlier still reports created_at 2026-08-01T00:00:00.000Z"
            - "data.id matches the bare-UUID form (36 characters, four hyphens, no prefix such as prop_)"
            - "data.version == 1 on create; after any later mutation of this row the version is 2, never reset"
            - "GET /_clock returns current_utc == 2026-08-15T09:30:00.000Z and is the only endpoint reachable without auth headers"

      - name: taxability_rule_with_undeclared_enum_value_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.TaxabilityRule.taxability
          - entities.TaxabilityRule.tax_rate_bps
          - validations[priority=7]
        distinguishing_aspect: "The enum admits exactly TAXABLE, EXEMPT and TAXABLE_IF_MANDATORY, and tax_rate_bps is bounded 0..5000; both violations are ERR_INVALID_REQUEST at priority 7, ahead of any referential check."
        test_recipe:
          setup:
            - "One jurisdiction exists so the FK resolves and cannot mask the type error"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
          trigger:
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_nv}", fee_code: "RESORT", taxability: "SOMETIMES_TAXABLE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "no TaxabilityRule row is created — GET /taxability-rules with jurisdiction_id ${j_nv} returns total_count 0"
            - "the same call with taxability TAXABLE and tax_rate_bps 6000 is also ERR_INVALID_REQUEST, because *_bps inputs are bounded 0..5000 for this field"
            - "the same call with taxability TAXABLE and tax_rate_bps omitted returns HTTP 201 with data.tax_rate_bps == null, meaning the jurisdiction's 1338 bps applies"
            - "a bad enum AND an unknown jurisdiction_id together still return ERR_INVALID_REQUEST, because priority 7 precedes priority 8"

      - name: fee_creation_under_unknown_fee_program_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Fee
          - validations[priority=6]
          - errors[ERR_FEE_PROGRAM_NOT_FOUND]
        distinguishing_aspect: "Fee's parent is FeeProgram and the parent id lives in the path; an unknown parent is 404 ERR_FEE_PROGRAM_NOT_FOUND at priority 6, which outranks the otherwise-valid body."
        test_recipe:
          setup:
            - "Empty database apart from the clock; the body is deliberately well-formed so only the parent is wrong"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /fee-programs/00000000-0000-4000-8000-000000000000/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 750, disclosure_text: "Resort fee of 7.5% of the nightly room rate." }
              as: RevenueManager
              as_user_id: "u-rev-1"
          assert:
            - "HTTP 404 with data.error_id == ERR_FEE_PROGRAM_NOT_FOUND"
            - "no Fee row is created; GET /fees returns total_count 0"
            - "POST /fees/00000000-0000-4000-8000-000000000000/inclusions likewise returns ERR_FEE_NOT_FOUND, so each nested route names its own parent"

      - name: disclosure_profile_junction_is_reachable_from_all_three_parents
        claim_type: parent_relationships
        grounds:
          - entities.ChannelDisclosureProfile
          - endpoints[GET /channel-disclosure-profiles]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The profile is a three-way junction over (Property x Channel x FeeProgram); the graph topology means it is reachable by a filtered list on each of the three foreign keys, and a filter naming a different parent returns an empty array rather than the row."
        test_recipe:
          setup:
            - "MINIMAL PUBLISHED FIXTURE plus a second OTA channel that owns no profile"
            - "One DRAFT profile on (p1, c_ota, fp1) with full disclosure at FIRST_QUOTE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_nv}", fee_code: "RESORT", taxability: "TAXABLE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /channels"
              payload: { name: "BigOTA", channel_type: "OTA", supports_total_price_display: true, supports_itemization: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { c_ota: $.data.id }
            - call: "POST /channels"
              payload: { name: "SmallOTA", channel_type: "OTA", supports_total_price_display: true, supports_itemization: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { c_other: $.data.id }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp1: $.data.id }
            - call: "POST /fee-programs/${fp1}/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 750, disclosure_text: "Resort fee of 7.5% of the nightly room rate." }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fee_resort: $.data.id }
            - call: "POST /fees/${fee_resort}/inclusions"
              payload: { service_code: "POOL_ACCESS", service_label: "Pool and cabana access", retail_value_cents: 1500, units: 1 }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp1}/submit-review"
              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp1}/publish"
              payload: { attestation_note: "Single-fee program attested." }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "GET /fee-programs/${fp1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { fp1_v: $.data.version }
