          Priority 1 fires before priority 2: a request with no X-User-ID header aimed at an
          endpoint the caller could not use anyway must return 401 ERR_UNAUTHENTICATED, never 403
          ERR_UNAUTHORIZED — the server cannot know the role before it knows the caller.
