scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: credit_provisional_vs_annual_true_up
        grounds:
          - calculations.premium_credit_award
          - calculations.uptime_coverage_pct
          - entities.CreditAttestation.fields.credit_cents_awarded
          - entities.CreditAttestation.fields.true_up_cents
          - entities.CreditAttestation.fields.is_policy_year_close
          - entities.InsurancePolicy.fields.credited_cents_total
          - state_machines.CreditAttestation.status.OPEN_to_FINALIZED_AWARDED
        distinguishing_aspect: |
          Both variants of premium_credit_award run on the SAME two attestation periods of the SAME policy and
          disagree by exactly one cent because provisional_period_accrual rounds 149900*0.05/2 = 3747.5 up to 3748
          once per period (7496 booked) while final_annual_true_up rounds 149900*0.10/2 = 7495.0 once for the year,
          so true_up_cents == -1; this instance lives in the premium-credit domain (InsurancePolicy / CreditAttestation),
          not the claim-payout domain used by claim_mitigated_vs_unmitigated_payout.
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property is install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
            - "Device ${d1} is ARMED with valve_state OPEN and monitor_mode NORMAL; the logical clock stands at 2026-08-01T06:05:00Z."
            - "InsurancePolicy ${pol1} on Property ${p1}: annual_premium_cents 149900, policy_year_start_at 2026-08-02T00:00:00Z, credit_state PENDING_ENROLLMENT."
            - "Period 1 = [2026-08-02T00:00Z, 06:40Z) is 400 minutes and holds four accepted readings at 00:00, 02:00, 04:00 and 06:20 -> covered_minutes 380 -> uptime_pct 95.00 -> tier 0.05."
            - "Period 2 = [2026-08-02T06:40Z, 10:50Z) is 250 minutes and holds two accepted readings at 06:40 and 08:40 -> covered_minutes 240 -> uptime_pct 96.00 -> tier 0.05."
            - "Attestation 1 has already been finalized (FINALIZED_AWARDED, credit_cents_awarded 3748); attestation 2 is OPEN and the clock stands at its period_end_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000001", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d1: $.data.id }
            - call: "POST /devices/${d1}/verify-install"
              payload: { installed_static_pressure_psi: 62.0, pressure_drop_psi: 0.8 }
              as: InstallerTech
              as_user_id: "tech-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:00:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:20:00Z", static_pressure_psi: 62.0, flow_gpm: 6.0, duration_minutes: 4, total_gallons: 24.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:40:00Z", static_pressure_psi: 58.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "GET /properties/${p1}"
              payload: {}
              as: InsurerAnalyst
              captures: { p1v: $.data.version }
            - call: "POST /policies"
              payload: { property_id: "${p1}", insurer_code: "AETNA_HOME", policy_number: "POL-2225-A", annual_premium_cents: 149900, policy_year_start_at: "2026-08-02T00:00:00Z", expected_property_version: "${p1v}", deductible_cents: 100000 }
              as: InsurerAnalyst
              captures: { pol1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:20:00Z" }
              as: ProgramAdmin
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-02T00:00:00Z", static_pressure_psi: 61.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-02T02:00:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-02T04:00:00Z", static_pressure_psi: 59.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-02T06:20:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /policies/${pol1}/credit-attestations"
              payload: { period_start_at: "2026-08-02T00:00:00Z", period_end_at: "2026-08-02T06:40:00Z" }
              as: InsurerAnalyst
              captures: { att1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:40:00Z" }
              as: ProgramAdmin
            - call: "POST /credit-attestations/${att1}/finalize"
              payload: {}
              as: InsurerAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:40:00Z" }
              as: ProgramAdmin
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-02T06:40:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-02T08:40:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /policies/${pol1}/credit-attestations"
              payload: { period_start_at: "2026-08-02T06:40:00Z", period_end_at: "2026-08-02T10:50:00Z" }
              as: InsurerAnalyst
              captures: { att2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:50:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /credit-attestations/${att2}/finalize"
              payload: {}
              as: InsurerAnalyst
          assert:
            - "CreditAttestation.${att1}.uptime_pct == 95.00 and CreditAttestation.${att1}.covered_minutes == 380 and CreditAttestation.${att1}.period_minutes == 400"
            - "CreditAttestation.${att1}.tier_pct == 0.05 and CreditAttestation.${att1}.credit_cents_awarded == 3748 and CreditAttestation.${att1}.is_policy_year_close == false and CreditAttestation.${att1}.true_up_cents == 0"
            - "CreditAttestation.${att2}.uptime_pct == 96.00 and CreditAttestation.${att2}.covered_minutes == 240 and CreditAttestation.${att2}.period_minutes == 250"
            - "CreditAttestation.${att2}.tier_pct == 0.05 and CreditAttestation.${att2}.credit_cents_awarded == 3748"
            - "CreditAttestation.${att2}.is_policy_year_close == true and CreditAttestation.${att2}.true_up_cents == -1"
            - "CreditAttestation.${att2}.status == FINALIZED_AWARDED and CreditAttestation.${att2}.device_snapshot_lifecycle_state == ARMED and CreditAttestation.${att2}.offline_gap_count == 0"
            - "InsurancePolicy.${pol1}.credited_cents_total == 7495 (3748 + 3748 provisional, then the -1 annual true-up)"
            - "InsurancePolicy.${pol1}.finalized_period_count == 2 and InsurancePolicy.${pol1}.avg_uptime_pct == 95.50 and InsurancePolicy.${pol1}.credit_state == CREDIT_ACTIVE"
            - "InsurancePolicy.${pol1}.last_attestation_end_at == 2026-08-02T10:50:00Z and InsurancePolicy.${pol1}.clawback_cents_total == 0"
            - "CreditAttestation.${att1}.credit_cents_awarded is still 3748 after the year close: the true-up is booked on the policy, never by rewriting the earlier attestation row"
      - name: claim_mitigated_vs_unmitigated_payout
        grounds:
          - calculations.claim_payout_award
          - calculations.auto_shutoff_decision
          - entities.AnomalyEvent.fields.mitigation_credited
          - entities.ReimbursementClaim.fields.payout_variant
          - entities.ReimbursementClaim.fields.deductible_applied_cents
          - state_machines.ReimbursementClaim.status.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Two claims carrying the identical documented_loss_cents 620000 against the identical device and policy
          settle at 500000 (MITIGATED: valve auto-closed with shutoff_latency_minutes 0.0, deductible waived) versus
          250000 (UNMITIGATED: the SNOOZE-suppressed burst never closed the valve, so the 100000 deductible bites and
          both the net loss and the cap are scaled by UNMITIGATED_FACTOR) — a delta of exactly 250000 cents; this
          instance lives in the claim-payout domain (ReimbursementClaim / AnomalyEvent), not the premium-credit domain
          used by credit_provisional_vs_annual_true_up.
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property is install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
            - "Device ${d1} is ARMED with valve_state OPEN and monitor_mode NORMAL; the logical clock stands at 2026-08-01T06:05:00Z."
            - "InsurancePolicy ${pol1} on Property ${p1}: annual_premium_cents 149900, deductible_cents 100000, policy_year_start_at 2026-08-01T00:00:00Z, credit_state PENDING_ENROLLMENT, paid_payout_cents_total 0."
            - "AnomalyEvent ${ev1}: CATASTROPHIC_BURST minted at 2026-08-01T07:00Z on a NORMAL-mode armed device, auto_shutoff_executed true, shutoff_latency_minutes 0.0, override_reopen_at null, mitigation_credited true, then RESOLVED and the valve manually reopened."
            - "AnomalyEvent ${ev2}: CATASTROPHIC_BURST minted at 2026-08-01T08:00Z while monitor_mode == SNOOZE, event_state SUPPRESSED (suppression_reason SNOOZE_ACTIVE), auto_shutoff_executed false, mitigation_credited false."
            - "ReimbursementClaim ${c1} (on ${ev1}) and ${c2} (on ${ev2}) are both WATER_DAMAGE for documented_loss_cents 620000 and both stand in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000001", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d1: $.data.id }
            - call: "POST /devices/${d1}/verify-install"
              payload: { installed_static_pressure_psi: 62.0, pressure_drop_psi: 0.8 }
              as: InstallerTech
              as_user_id: "tech-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:00:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:20:00Z", static_pressure_psi: 62.0, flow_gpm: 6.0, duration_minutes: 4, total_gallons: 24.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:40:00Z", static_pressure_psi: 58.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "GET /properties/${p1}"
              payload: {}
              as: InsurerAnalyst
              captures: { p1v: $.data.version }
            - call: "POST /policies"
              payload: { property_id: "${p1}", insurer_code: "AETNA_HOME", policy_number: "POL-2225-A", annual_premium_cents: 149900, policy_year_start_at: "2026-08-01T00:00:00Z", expected_property_version: "${p1v}", deductible_cents: 100000 }
              as: InsurerAnalyst
              captures: { pol1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T07:00:00Z" }
              as: ProgramAdmin
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T07:00:00Z", static_pressure_psi: 30.0, flow_gpm: 12.0, duration_minutes: 6, total_gallons: 72.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "GET /anomaly-events"
              payload: { device_id: "${d1}", event_state: "ALERTED" }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { ev1: "$.data[0].id" }
            - call: "POST /claims"
              payload: { policy_id: "${pol1}", device_id: "${d1}", claim_type: "WATER_DAMAGE", documented_loss_cents: 620000, anomaly_event_id: "${ev1}" }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { c1: $.data.id }
            - call: "POST /claims/${c1}/decision"
              payload: { decision: "BEGIN_REVIEW" }
              as: ClaimsAdjuster
              as_user_id: "adj-01"
            - call: "POST /anomaly-events/${ev1}/resolve"
              payload: { resolution_note: "Burst confirmed at the water heater; plumber replaced the supply line." }
              as: Homeowner
              as_user_id: "${h1}"
            - call: "GET /devices/${d1}"
              payload: {}
              as: Homeowner
              as_user_id: "${h1}"
              captures: { dv1: $.data.version }
            - call: "POST /devices/${d1}/valve-commands"
              payload: { command: "OPEN", expected_device_version: "${dv1}", override_reason: "Repair complete, restoring water", acknowledge_water_damage_risk: true }
              as: Homeowner
              as_user_id: "${h1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T07:30:00Z" }
              as: ProgramAdmin
            - call: "POST /devices/${d1}/monitor-mode"
              payload: { mode: "SNOOZE", snooze_minutes: 60 }
              as: Homeowner
              as_user_id: "${h1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T08:00:00Z", static_pressure_psi: 28.0, flow_gpm: 12.0, duration_minutes: 6, total_gallons: 72.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "GET /anomaly-events"
              payload: { device_id: "${d1}", event_state: "SUPPRESSED" }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { ev2: "$.data[0].id" }
            - call: "POST /claims"
              payload: { policy_id: "${pol1}", device_id: "${d1}", claim_type: "WATER_DAMAGE", documented_loss_cents: 620000, anomaly_event_id: "${ev2}" }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { c2: $.data.id }
            - call: "POST /claims/${c2}/decision"
              payload: { decision: "BEGIN_REVIEW" }
              as: ClaimsAdjuster
              as_user_id: "adj-01"
          trigger:
            - call: "POST /claims/${c1}/decision"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adj-01"
            - call: "POST /claims/${c2}/decision"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adj-01"
          assert:
            - "AnomalyEvent.${ev1}.mitigation_credited == true and AnomalyEvent.${ev1}.auto_shutoff_executed == true and AnomalyEvent.${ev1}.shutoff_latency_minutes == 0.0"
            - "AnomalyEvent.${ev2}.mitigation_credited == false and AnomalyEvent.${ev2}.auto_shutoff_executed == false and AnomalyEvent.${ev2}.suppression_reason == SNOOZE_ACTIVE"
            - "ReimbursementClaim.${c1}.payout_variant == MITIGATED and ReimbursementClaim.${c1}.approved_payout_cents == 500000 and ReimbursementClaim.${c1}.deductible_applied_cents == 0"
            - "ReimbursementClaim.${c2}.payout_variant == UNMITIGATED and ReimbursementClaim.${c2}.approved_payout_cents == 250000 and ReimbursementClaim.${c2}.deductible_applied_cents == 100000"
            - "ReimbursementClaim.${c1}.approved_payout_cents - ReimbursementClaim.${c2}.approved_payout_cents == 250000"
            - "ReimbursementClaim.${c1}.status == APPROVED and ReimbursementClaim.${c2}.status == APPROVED and both rows carry decided_by_user_id == adj-01"
            - "InsurancePolicy.${pol1}.paid_payout_cents_total == 0 (approval alone never books a payout; only PAY does)"
  - rule_id: combinatorial_formula
    instances:
      - name: severity_score_weighted_clamp_then_round
        grounds:
          - calculations.severity_score
          - calculations.anomaly_classification
          - calculations.auto_shutoff_decision
          - entities.AnomalyEvent.fields.severity_score
          - entities.AnomalyEvent.fields.observed_gallons
        distinguishing_aspect: |
          MODE (b) rounding-order-pinned: severity_score rounds EXACTLY ONCE at the end, so flow 12.0 against
          flow_ref 18.0 contributes the unrounded 0.6666666... and the score is 0.833; rounding each component to
          3dp before weighting yields 0.5*0.667 + 0.300 + 0.200 = 0.8335 -> 0.834, a different literal. Two of the
          three components are also clamped at 1.0 (duration 6/6 and gallons 72/60 = 1.2), so the test pins
          clamp-before-weight together with round-once-after-sum.
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property is install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
            - "Device ${d1} is ARMED with valve_state OPEN and monitor_mode NORMAL; the logical clock stands at 2026-08-01T06:05:00Z."
            - "No AnomalyEvent exists yet for Device ${d1}; close_count is 0 and the clock has been advanced to 2026-08-01T07:00:00Z."
            - "The gates in force are burst_flow_gate 9.00 (6.00 * 1.50 * 1.00), BURST_MIN_DURATION_MINUTES 3 and burst_gallon_gate 30.00, giving severity references flow_ref 18.0, duration_ref 6.0 and gallon_ref 60.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000001", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d1: $.data.id }
            - call: "POST /devices/${d1}/verify-install"
              payload: { installed_static_pressure_psi: 62.0, pressure_drop_psi: 0.8 }
              as: InstallerTech
              as_user_id: "tech-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:00:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:20:00Z", static_pressure_psi: 62.0, flow_gpm: 6.0, duration_minutes: 4, total_gallons: 24.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:40:00Z", static_pressure_psi: 58.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T07:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T07:00:00Z", static_pressure_psi: 30.0, flow_gpm: 12.0, duration_minutes: 6, total_gallons: 72.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "GET /anomaly-events"
              payload: { device_id: "${d1}", classification: "CATASTROPHIC_BURST" }
              as: ProgramAdmin
              captures: { ev1: "$.data[0].id" }
          assert:
            - "AnomalyEvent.${ev1}.classification == CATASTROPHIC_BURST and AnomalyEvent.${ev1}.event_state == ALERTED"
            - "AnomalyEvent.${ev1}.severity_score == 0.833 (NOT 0.834, which is what per-component rounding produces)"
            - "AnomalyEvent.${ev1}.observed_flow_gpm == 12.0 and AnomalyEvent.${ev1}.observed_duration_minutes == 6 and AnomalyEvent.${ev1}.observed_gallons == 72.0"
            - "AnomalyEvent.${ev1}.baseline_version_used == 3 and AnomalyEvent.${ev1}.detected_at == 2026-08-01T07:00:00Z"
            - "AnomalyEvent.${ev1}.auto_shutoff_executed == true and AnomalyEvent.${ev1}.shutoff_latency_minutes == 0.0 and AnomalyEvent.${ev1}.mitigation_credited == true"
            - "Device.${d1}.valve_state == CLOSED and Device.${d1}.close_count == 1 and Device.${d1}.last_shutoff_at == 2026-08-01T07:00:00Z"
            - "TelemetryReading for 2026-08-01T07:00:00Z has classification_at_ingest == CATASTROPHIC_BURST, baseline_eligible == false and anomaly_event_created == true"
      - name: baseline_classification_evaluation_order
        grounds:
          - calculations.baseline_learning_profile
          - calculations.anomaly_classification
          - entities.TelemetryReading.fields.classification_at_ingest
          - entities.TelemetryReading.fields.baseline_eligible
          - entities.BaselineProfile.fields.baseline_version
          - state_machines.BaselineProfile.learning_state.COLLECTING_to_COMPLETE
        distinguishing_aspect: |
          MODE (c) circular-looking dependency with a pinned evaluation order: classification reads the baseline while
          the baseline is fed only by readings whose classification is NONE. The pinned order (persist -> classify
          against the PRE-EXISTING snapshot -> recompute and publish) makes the learning-completing reading at flow 9.0
          provably unclassified even though it exactly meets the old burst gate of 9.00, and makes the very next reading
          at flow 12.0 provably NONE because it is judged against the NEW peak 9.00 (gate 13.50) that the previous
          reading just published — the same 12.0 gpm reading that severity_score_weighted_clamp_then_round classifies
          as CATASTROPHIC_BURST under the 6.00 peak.
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1}; Device ${d1} is install-verified, lifecycle_state LEARNING with BaselineProfile learning_cycle_no 1, learning_state COLLECTING and sample_count 2 (readings at 2026-08-01T00:00Z static 60.0 flow 0.0 and 00:20Z static 62.0 flow 6.0)."
            - "The published snapshot at that moment is baseline_static_pressure_psi 61.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 2 — so burst_flow_gate is 9.00."
            - "Device ${d1} valve_state OPEN, close_count 0, monitor_mode NORMAL; the clock stands at 2026-08-01T06:05:00Z and no AnomalyEvent exists."
