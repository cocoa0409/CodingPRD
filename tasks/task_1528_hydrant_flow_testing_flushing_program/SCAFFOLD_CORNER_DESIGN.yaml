            - { call: "POST /programs/${prog_id}/close", as: ProgramAdmin }
          trigger:
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_NOT_OPEN with http 409"

