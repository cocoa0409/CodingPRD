  - section: consistency_model
    instances:
      - name: ledger_balance_consistency_after_accrue
        claim_type: derived_field_consistency
        grounds:
          - entities.Member.fields.points_balance
          - entities.PointsLedger.fields.delta
          - state_machines.FlightSegment.FLOWN_to_ACCRUED
        distinguishing_aspect: "After accrual, Member.points_balance equals the sum of non-expired PointsLedger.delta rows (immediate consistency)."
        test_recipe:
          setup:
            - "Member with one flown ECONOMY segment ready to accrue."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-02T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "cm@air.test", full_name: "Cm One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "ECONOMY", distance_miles: 340, base_fare_usd: 500, scheduled_departure: "2026-02-01T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
            - call: "POST /flight-segments/${seg}/fly"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /flight-segments/${seg}/accrue"
              payload: {}
              as: OperationsAgent
              captures: { pa: "$.data.points_awarded" }
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { bal: "$.data.points_balance" }
            - call: "GET /members/${m1}/ledger"
              payload: {}
              as: ProgramAdmin
          assert:
            - "${bal} == ${pa}  # base=500*1.0=500; floor=170; max=500; BASE bonus 0%; balance == single ACCRUAL delta"
            - "sum of PointsLedger.delta == ${bal}"
