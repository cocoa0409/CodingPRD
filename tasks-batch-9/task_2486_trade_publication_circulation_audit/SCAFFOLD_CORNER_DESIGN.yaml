            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_a_id}", source_document_id: "${doc_a_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-01T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_a_ver}" }
              as: QualificationSpecialist
