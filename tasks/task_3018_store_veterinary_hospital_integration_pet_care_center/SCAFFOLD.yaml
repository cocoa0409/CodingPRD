scenario: |
  In-Store Veterinary Hospital Integration & Pet Care Center Scheduling (Petco): shared-space scheduling among grooming, training, veterinary and vaccination clinic services, veterinary appointment booking with medical record separation from retail systems, vaccination clinic walk-in flow with state-specific rabies certificate issuance and reporting, prescription diet and medication authorization tied to an in-house exam, grooming appointment risk screening for aggression, health conditions and breed-specific handling, service package membership with monthly billing and included visits, incident reporting for injuries during service with claim handling, retail cross-sell of prescribed products with pharmacy handoff
domain_name: store-veterinary-pet-care-center
api_prefix: /stores

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_deferred_actions
    - contagion_risk_propagation
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert
  entity_count: 14
  state_machine_count: 11
  calculation_count: 12
  validation_count: 21
  endpoint_count: 54
  error_code_count: 44
  role_count: 7
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: store_code
        type: string
        source: input
        description: "Human-readable store identifier; unique across all stores"
        constraints: "required; unique"
      - name: city
        type: string
        source: input
        description: "Store city"
      - name: state_code
        type: enum
        source: input
        description: "Two-letter US state where the store operates (CA | TX | NY | FL)"
        constraints: "enum {CA, TX, NY, FL}"
      - name: service_bay_count
        type: integer
        source: input
        description: "Number of physical service bays in the pet care center"
        constraints: "required; >= 1"
      - name: hospital_capacity
        type: integer
        source: input
        description: "Maximum concurrent occupancy for the in-store veterinary hospital"
        constraints: "required; >= 1"
      - name: hospital_occupancy
        type: integer
        source: computed
        description: "Current hospital occupancy = count of Encounter rows in {SCHEDULED, CHECKED_IN, IN_EXAM} for this store"
        default: 0
      - name: hospital_posture
        type: enum
        source: computed
        description: "Derived gating posture: OPEN | RESTRICTED | FROZEN"
        default: OPEN
        constraints: "enum {OPEN, RESTRICTED, FROZEN}"
      - name: pharmacy_hold_until
        type: datetime
        source: system
        description: "UTC instant before which no new PharmacyOrder may be authorized; null when pharmacy is not held"
      - name: cross_sell_credit_balance_cents
        type: integer
        source: computed
        description: "Store-level conservation quantity C1: cumulative cross-sell credit granted MINUS cumulative cross-sell credit redeemed"
        default: 0
      - name: incident_risk_index
        type: integer
        source: computed
        description: "Store-level incident risk accumulator; decreases by the same risk_points_lost recorded on each IncidentRecord"
        default: 0
      - name: restricted_training_slots_pending
        type: integer
        source: computed
        description: "Count of TrainingEnrollment rows currently in {PENDING_ACK, RESTRICTED} for this store"
        default: 0
      - name: frozen_vaccination_clinics
        type: integer
        source: computed
        description: "Count of VaccinationClinic rows currently in FROZEN for this store"
        default: 0
      - name: stores_held_total
        type: integer
        source: computed
        description: "Count of PharmacyOrder rows in on_hold=HOLDING for this store"
        default: 0

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Member display name"
        constraints: "required"
      - name: email
        type: string
        source: input
        description: "Member email; unique across all members"
        constraints: "required; unique; contains '@'"
      - name: state_code
        type: enum
        source: input
        description: "Two-letter US state of member residence (CA | TX | NY | FL)"
        constraints: "enum {CA, TX, NY, FL}"
      - name: home_store_id
        type: string
        source: input
        description: "FK -> Store.id; the member's home pet care center"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Conservation quantity C2: sum over service packages of total_price_cents MINUS sum over completed billing cycles of cycle_total_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE | DORMANT | SUSPENDED"
        default: ACTIVE
        constraints: "enum {ACTIVE, DORMANT, SUSPENDED}"

  - name: Pet
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the owning member"
        constraints: "required"
      - name: name
        type: string
        source: input
        description: "Pet name"
        constraints: "required"
      - name: species
        type: enum
        source: input
        description: "CANINE | FELINE"
        constraints: "enum {CANINE, FELINE}"
      - name: breed
        type: string
        source: input
        description: "Breed name, matched case-insensitively against BreedHandlingRule.breed"
      - name: weight_kg
        type: number
        source: input
        description: "Body weight in kilograms; drives sedation risk score"
        constraints: "required; > 0"
      - name: rabies_vaccination_expires_at
        type: datetime
        source: computed
        description: "Latest RabiesCertificate.expires_at across this pet's effective certificates; null when no effective certificate exists"
      - name: risk_score
        type: integer
        source: computed
        description: "Aggression/health risk score; recomputed as the sum of risk_points over IncidentRecord rows whose claim_status is not DENIED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE | ARCHIVED"
        default: ACTIVE
        constraints: "enum {ACTIVE, ARCHIVED}"
      - name: version
        type: integer
        source: system
        description: "OCC version for Pet; starts at 1 and increments on every mutation"
        default: 1

  - name: BreedHandlingRule
    parent: null
    common_fields: false
    fields:
      - name: breed
        type: string
        source: input
        description: "Breed name; unique per species"
        constraints: "required"
      - name: species
        type: enum
        source: input
        description: "CANINE | FELINE"
        constraints: "required; enum {CANINE, FELINE}"
      - name: risk_points
        type: integer
        source: input
        description: "Additional grooming risk points for this breed"
        constraints: "required; >= 0"
      - name: handling_tier
        type: enum
        source: input
        description: "STANDARD | SENSITIVE | HIGH_RISK"
        constraints: "required; enum {STANDARD, SENSITIVE, HIGH_RISK}"
      - name: allowed_for_grooming
        type: boolean
        source: input
        description: "false makes grooming for this breed unschedulable without a documented exception"
        default: true

  - name: ServiceBay
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; owning store"
        constraints: "required"
      - name: bay_code
        type: enum
        source: input
        description: "GROOMING | VETERINARY | TRAINING | VACCINATION"
        constraints: "required; enum {GROOMING, VETERINARY, TRAINING, VACCINATION}"
      - name: is_frozen
        type: boolean
        source: computed
        description: "True when the parent Store.hospital_posture is FROZEN"
        default: false
      - name: status
        type: enum
        source: system
        description: "ACTIVE | FROZEN | DISABLED"
        default: ACTIVE
        constraints: "enum {ACTIVE, FROZEN, DISABLED}"
      - name: version
        type: integer
        source: system
        description: "OCC version for ServiceBay"
        default: 1

  - name: ServiceBooking
    parent: ServiceBay
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; denormalized owning store"
        constraints: "required"
      - name: bay_id
        type: string
        source: input
        description: "FK -> ServiceBay.id; the bay this booking occupies"
        constraints: "required"
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the pet receiving service"
        constraints: "required"
      - name: service_type
        type: enum
        source: input
        description: "GROOMING | TRAINING | VETERINARY | VACCINATION"
        constraints: "required; enum {GROOMING, TRAINING, VETERINARY, VACCINATION}"
      - name: starts_at
        type: datetime
        source: input
        description: "Window start, ISO 8601 UTC"
        constraints: "required"
      - name: ends_at
        type: datetime
        source: input
        description: "Window end, ISO 8601 UTC; must be strictly after starts_at"
        constraints: "required; > starts_at"
      - name: screening_score
        type: integer
        source: computed
        description: "Grooming risk score = Pet.risk_score + BreedHandlingRule.risk_points + weight band points + health-condition points"
        default: 0
      - name: pet_version
        type: integer
        source: computed
        description: "Echo of the Pet.version this booking last observed; refreshed on every screening and echoed on the create and screen responses so a later confirm-bay can pass it back as expected_pet_version"
        default: 1
      - name: handling_level
        type: enum
        source: computed
        description: "STANDARD | SENSITIVE | HIGH_RISK, derived from screening_score and screening thresholds"
        constraints: "enum {STANDARD, SENSITIVE, HIGH_RISK}"
      - name: screening_valid_until
        type: datetime
        source: computed
        description: "screening_score computed at booking time + SCREENING_VALIDITY_DAYS; a booking that is still non-terminal at this instant requires re-screening"
      - name: re_screen_required
        type: boolean
        source: computed
        description: "True when the current logical clock is strictly after screening_valid_until and the booking is not in a terminal state"
        default: false
      - name: status
        type: enum
        source: system
        description: "REQUESTED | SCREENED | BAY_CONFIRMED | IN_SERVICE | COMPLETED | CANCELLED | NO_SHOW"
        default: REQUESTED
        constraints: "enum {REQUESTED, SCREENED, BAY_CONFIRMED, IN_SERVICE, COMPLETED, CANCELLED, NO_SHOW}"
      - name: version
        type: integer
        source: system
        description: "OCC version for ServiceBooking"
        default: 1

  - name: VeterinaryEncounter
    parent: Pet
    common_fields: true
    fields:
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the patient"
        constraints: "required"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the hospital where the encounter occurs"
        constraints: "required"
      - name: booking_id
        type: string
        source: input
        description: "FK -> ServiceBooking.id; the veterinary booking this encounter is attached to"
      - name: clinician_name
        type: string
        source: input
        description: "Licensed veterinarian conducting the encounter"
        constraints: "required"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Appointment instant, ISO 8601 UTC"
        constraints: "required"
      - name: chief_complaint
        type: string
        source: input
        description: "Owner-reported reason for the visit"
      - name: exam_date
        type: datetime
        source: system
        description: "Instant the encounter entered IN_EXAM and clinical notes were recorded; null until then"
      - name: medical_notes
        type: string
        source: input
        description: "Clinical notes; retained inside the hospital partition and never surfaced on any retail endpoint"
      - name: charge_total_cents
        type: integer
        source: computed
        description: "Exam charge + sum of authorized prescription price_at_authorization_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "SCHEDULED | CHECKED_IN | IN_EXAM | COMPLETED | CANCELLED"
        default: SCHEDULED
        constraints: "enum {SCHEDULED, CHECKED_IN, IN_EXAM, COMPLETED, CANCELLED}"
      - name: version
        type: integer
        source: system
        description: "OCC version for VeterinaryEncounter"
        default: 1

  - name: VaccinationClinic
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; hosting store"
        constraints: "required"
      - name: clinic_date
        type: datetime
        source: input
        description: "Date on which the walk-in clinic operates, ISO 8601 UTC"
        constraints: "required"
      - name: open_time
        type: datetime
        source: input
        description: "Walk-in window opens"
        constraints: "required"
      - name: close_time
        type: datetime
        source: input
        description: "Walk-in window closes; must be strictly after open_time"
        constraints: "required; > open_time"
      - name: coverage_required
        type: boolean
        source: input
        description: "True when the parent Store.hospital_posture was RESTRICTED or FROZEN at creation time"
        default: false
      - name: coverage_provider
        type: string
        source: input
        description: "Name of the relief veterinarian when coverage_required is true"
      - name: clinic_status
        type: enum
        source: system
        description: "SCHEDULED | OPEN | FROZEN | CLOSED"
        default: SCHEDULED
        constraints: "enum {SCHEDULED, OPEN, FROZEN, CLOSED}"
      - name: version
        type: integer
        source: system
        description: "OCC version for VaccinationClinic"
        default: 1

  - name: VaccinationVisit
    parent: VaccinationClinic
    common_fields: true
    fields:
      - name: clinic_id
        type: string
        source: input
        description: "FK -> VaccinationClinic.id; the walk-in clinic"
        constraints: "required"
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the walk-in pet"
        constraints: "required"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; denormalized hosting store"
        constraints: "required"
      - name: walk_in_at
        type: datetime
        source: system
        description: "Instant the walk-in was registered, stamped by the logical clock"
      - name: vaccine_type
        type: enum
        source: input
        description: "RABIES | BORDETELLA | DHPP | FVRCP"
        constraints: "required; enum {RABIES, BORDETELLA, DHPP, FVRCP}"
      - name: prior_rabies_vaccination_date
        type: datetime
        source: input
        description: "Date of the pet's previous rabies vaccination; null for a first-ever vaccination"
      - name: prior_effective_days
        type: integer
        source: system
        description: "Days of validity the prior certificate was granted under (365 | 1095); null when prior_rabies_vaccination_date is null"
      - name: prior_is_booster
        type: boolean
        source: system
        description: "True when prior_rabies_vaccination_date is not null and prior_effective_days is 365"
        default: false
      - name: new_effective_days
        type: integer
        source: computed
        description: "365 | 1095; booster rule caps a prior one-year certificate at 365 even when the state default is 1095"
      - name: certificate_serial
        type: string
        source: computed
        description: "State-namespaced rabies certificate serial, e.g. TX-2026-000123; null for non-RABIES vaccine types"
      - name: certificate_issued_at
        type: datetime
        source: computed
        description: "Instant the certificate was issued; null for non-RABIES vaccine types"
      - name: certificate_expires_at
        type: datetime
        source: computed
        description: "certificate_issued_at + new_effective_days; null for non-RABIES vaccine types"
      - name: state_report_status
        type: enum
        source: computed
        description: "PENDING | SUBMITTED | NOT_REQUIRED | OVERDUE; derived from the parent clinic's state report deadline"
        default: PENDING
        constraints: "enum {PENDING, SUBMITTED, NOT_REQUIRED, OVERDUE}"
      - name: state_report_due_at
        type: datetime
        source: computed
        description: "Last day of the calendar month following the certificate issue month, at 23:59:59Z"
      - name: status
        type: enum
        source: system
        description: "REGISTERED | CERTIFICATE_ISSUED | REPORT_REQUIRED | REPORTED | BLOCKED"
        default: REGISTERED
        constraints: "enum {REGISTERED, CERTIFICATE_ISSUED, REPORT_REQUIRED, REPORTED, BLOCKED}"

  - name: RabiesCertificate
    parent: VaccinationVisit
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> VaccinationVisit.id; the issuing visit"
        constraints: "required"
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the vaccinated pet"
        constraints: "required"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; issuing store"
        constraints: "required"
      - name: serial
        type: string
        source: computed
        description: "Certificate serial, unique across all certificates"
        constraints: "unique"
      - name: issued_at
        type: datetime
        source: computed
        description: "Issue instant stamped by the logical clock"
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + effective_days"
      - name: effective_days
        type: integer
        source: computed
        description: "365 | 1095"
      - name: is_booster
        type: boolean
        source: computed
        description: "True when the certificate was issued as a booster"
      - name: is_effective
        type: boolean
        source: computed
        description: "True when the logical clock is at or before expires_at"
        default: true

  - name: GroomingRiskScreening
    parent: ServiceBooking
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> ServiceBooking.id; the screened grooming booking"
        constraints: "required"
      - name: risk_total
        type: integer
        source: computed
        description: "Total screening score = pet_risk_points + breed_risk_points + weight_band_points + health_condition_points"
      - name: health_condition_points
        type: integer
        source: input
        description: "Points supplied with the submitted health-condition list (CARDIAC 30, EPILEPSY 25, ORTHOPEDIC 15, SKIN_INFECTION 10, DIABETES 20)"
        default: 0
      - name: handling_level
        type: computed
        description: "STANDARD | SENSITIVE | HIGH_RISK, selected by the screening thresholds"
      - name: aggression_acknowledged
        type: boolean
        source: input
        description: "Whether the groomer acknowledged the aggression advisory"
        default: false
      - name: recorded_at
        type: datetime
        source: computed
        description: "Instant the screening was recorded"
      - name: valid_until
        type: datetime
        source: computed
        description: "recorded_at + SCREENING_VALIDITY_DAYS"

  - name: PrescriptionAuthorization
    parent: VeterinaryEncounter
    common_fields: true
    fields:
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the patient"
        constraints: "required"
      - name: encounter_id
        type: string
        source: input
        description: "FK -> VeterinaryEncounter.id; the qualifying in-house exam"
        constraints: "required"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; authorizing store"
        constraints: "required"
      - name: item_type
        type: enum
        source: input
        description: "MEDICATION | DIET | TREATMENT"
        constraints: "required; enum {MEDICATION, DIET, TREATMENT}"
      - name: item_name
        type: string
        source: input
        description: "Product name to be dispensed from the retail pharmacy"
        constraints: "required"
      - name: sku
        type: string
        source: input
        description: "Retail SKU being cross-sold alongside the prescription"
        constraints: "required"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Retail unit price of the product"
        constraints: "required; >= 0"
      - name: quantity
        type: integer
        source: input
        description: "Dispensed quantity"
        constraints: "required; >= 1"
      - name: authorized_at
        type: datetime
        source: system
        description: "Authorization instant"
      - name: expires_at
        type: datetime
        source: computed
        description: "authorized_at + item-specific validity window (MEDICATION 30 days, DIET 90 days, TREATMENT 60 days)"
      - name: price_at_authorization_cents
        type: integer
        source: computed
        description: "unit_price_cents * quantity, frozen at authorization time and live until the authorization transitions to DISPENSED"
      - name: retail_facing
        type: boolean
        source: computed
        description: "Always true; marks the row as the only hospital-originated row that retail endpoints may read"
      - name: status
        type: enum
        source: system
        description: "PENDING_EXAM | AUTHORIZED | PARTIALLY_DISPENSED | DISPENSED | EXPIRED | REVOKED"
        default: PENDING_EXAM
        constraints: "enum {PENDING_EXAM, AUTHORIZED, PARTIALLY_DISPENSED, DISPENSED, EXPIRED, REVOKED}"

  - name: PharmacyOrder
    parent: PrescriptionAuthorization
    common_fields: true
    fields:
      - name: authorization_id
        type: string
        source: input
        description: "FK -> PrescriptionAuthorization.id; the authorizing prescription"
        constraints: "required"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; dispensing store"
        constraints: "required"
      - name: requested_quantity
        type: integer
        source: input
        description: "Quantity the counter requested at handoff"
        constraints: "required; >= 1"
      - name: on_hold
        type: enum
        source: computed
        description: "NONE | HOLDING; set to HOLDING when the authorizing encounter's store is FROZEN"
        default: NONE
        constraints: "enum {NONE, HOLDING}"
      - name: status
        type: enum
        source: system
        description: "REQUESTED | AUTHORIZED | DISPENSED | REJECTED"
        default: REQUESTED
        constraints: "enum {REQUESTED, AUTHORIZED, DISPENSED, REJECTED}"
      - name: current_retail_price_cents
        type: integer
        source: computed
        description: "Live retail price; equals the authorization's price_at_authorization_cents until the parent authorization reaches DISPENSED, after which it follows current unit_price_cents * requested_quantity"
        default: 0

  - name: IncidentRecord
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store in which the injury occurred"
        constraints: "required"
      - name: booking_id
        type: string
        source: input
        description: "FK -> ServiceBooking.id; the service during which the injury occurred"
        constraints: "required"
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the pet involved"
        constraints: "required"
      - name: severity
        type: enum
        source: input
        description: "MINOR | MODERATE | SEVERE"
        constraints: "required; enum {MINOR, MODERATE, SEVERE}"
      - name: incident_type
        type: enum
        source: input
        description: "PET_INJURY | HANDLER_INJURY | BITE"
        constraints: "required; enum {PET_INJURY, HANDLER_INJURY, BITE}"
      - name: risk_points
        type: integer
        source: computed
        description: "Risk points applied to Pet.risk_score: MINOR 10, MODERATE 25, SEVERE 40"
        default: 0
      - name: claim_amount_cents
        type: integer
        source: input
        description: "Claim value requested by the injured party"
        constraints: "required; >= 0"
      - name: payout_amount_cents
        type: integer
        source: computed
        description: "Approved claim value; 0 while unreviewed or denied"
        default: 0
      - name: risk_points_lost
        type: integer
        source: computed
        description: "Conservation quantity C3: risk points removed by an APPROVE_CLAIM compensation; equals risk_points"
        default: 0
      - name: available_claimable_cents
        type: integer
        source: computed
        description: "claim_amount_cents - payout_amount_cents; non-zero if and only if claim_status != APPROVED"
        default: 0
      - name: override_reason
        type: string
        source: input
        description: "Required when the claim amount exceeds the store state's claim cap"
      - name: claim_status
        type: enum
        source: system
        description: "UNREVIEWED | UNDER_REVIEW | APPROVED | DENIED"
        default: UNREVIEWED
        constraints: "enum {UNREVIEWED, UNDER_REVIEW, APPROVED, DENIED}"

  - name: ServicePackage
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the subscribing member"
        constraints: "required"
      - name: member_state_code
        type: enum
        source: input
        description: "Denormalized Member.state_code used for tax derivation"
        constraints: "required; enum {CA, TX, NY, FL}"
      - name: tier
        type: enum
        source: input
        description: "ESSENTIAL | PLUS | UNLIMITED"
        constraints: "required; enum {ESSENTIAL, PLUS, UNLIMITED}"
      - name: state_sales_tax_rate
        type: number
        source: input
        description: "Sales-tax rate applied to each billing cycle"
        constraints: "required; >= 0"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Base monthly fee in cents; 0 means the tier's default applies"
        default: 0
      - name: monthly_total_cents
        type: computed
        description: "Per-cycle total = monthly_fee_cents * (1 + state_sales_tax_rate), rounded half-up to whole cents"
        default: 0
      - name: total_price_cents
        type: integer
        source: computed
        description: "Conservation quantity C2, forward side: monthly_total_cents * billing_cycle_count"
        default: 0
      - name: billing_cycle_count
        type: integer
        source: input
        description: "Number of prepaid billing cycles covered by this package"
        options: [1, 3, 6, 12]
        constraints: "required; enum {1, 3, 6, 12}"
      - name: grooming_visits_included
        type: integer
        source: computed
        description: "Included grooming visits per cycle"
        default: 0
      - name: vet_visits_included
        type: integer
        source: computed
        description: "Included veterinary visits per cycle"
        default: 0
      - name: vaccine_visits_included
        type: integer
        source: computed
        description: "Included vaccination visits per cycle"
        default: 0
      - name: included_visits_total
        type: integer
        source: computed
        description: "grooming_visits_included + vet_visits_included + vaccine_visits_included"
        default: 0
      - name: consumed_visits
        type: integer
        source: computed
        description: "Conservation quantity C2, backward side: cumulative visits consumed across all non-VOID cycles"
        default: 0
      - name: cycles_consumed
        type: integer
        source: computed
        description: "Number of billing cycles advanced so far"
        default: 0
      - name: overage_visits
        type: computed
        description: "Included visits beyond the tier's hard ceiling: max(0, included_visits_total - TIER_HARD_CAP[tier])"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE | PAUSED | CANCELLED"
        default: ACTIVE
        constraints: "enum {ACTIVE, PAUSED, CANCELLED}"
      - name: version
        type: integer
        source: system
        description: "OCC version for ServicePackage; starts at 1"
        default: 1

  - name: PackageBillingCycle
    parent: ServicePackage
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> ServicePackage.id; the billed package"
        constraints: "required"
      - name: cycle_index
        type: integer
        source: input
        description: "1-based index of the cycle within the package"
        constraints: "required; >= 1"
      - name: cycle_total_cents
        type: number
        source: computed
        description: "Cycle billing total = ROUND_HALF_UP( (grooming_visits_consumed_in_cycle * GROOMING_VISIT_CREDIT_CENTS + vet_visits_consumed_in_cycle * VET_VISIT_CREDIT_CENTS + vaccine_visits_consumed_in_cycle * VACCINE_VISIT_CREDIT_CENTS) * (1 + state_sales_tax_rate) , 2 )"
        default: 0
      - name: overage_credit_cents
        type: computed
        description: "Credit applied for included visits beyond the tier hard cap = overage_visits * OVERAGE_CREDIT_CENTS, before tax"
        default: 0
      - name: tax_cents
        type: computed
        description: "Tax component = ROUND_HALF_UP(cycle_total_cents * state_sales_tax_rate / (1 + state_sales_tax_rate), 2)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "PENDING | BILLED | FAILED | VOID"
        default: PENDING
        constraints: "enum {PENDING, BILLED, FAILED, VOID}"

  - name: RetailCrossSell
    parent: IncidentRecord
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store at which the cross-sell occurs"
        constraints: "required"
      - name: authorization_id
        type: string
        source: input
        description: "FK -> PrescriptionAuthorization.id; the prescription being cross-sold"
        constraints: "required"
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; pet the prescription belongs to"
        constraints: "required"
      - name: sku
        type: string
        source: input
        description: "Retail SKU of the cross-sold product"
        constraints: "required"
      - name: gross_cents
        type: computed
        description: "Pre-discount line value = authorization.price_at_authorization_cents"
        default: 0
      - name: credit_granted_cents
        type: integer
        source: computed
        description: "Cross-sell credit granted = ROUND_HALF_UP(gross_cents * CROSS_SELL_CREDIT_RATE, 2)"
        default: 0
      - name: credit_redeemed_cents
        type: integer
        source: computed
        description: "Cross-sell credit redeemed by this cross-sell; 0 in the base variant"
        default: 0
      - name: status
        type: enum
        source: system
        description: "PENDING | REDEEMED | EXPIRED"
        default: PENDING
        constraints: "enum {PENDING, REDEEMED, EXPIRED}"

  - name: TrainingEnrollment
    parent: ServicePackage
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> ServicePackage.id; package whose training credit was used"
        constraints: "required"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store hosting the class"
        constraints: "required"
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; enrolled pet"
        constraints: "required"
      - name: class_code
        type: string
        source: input
        description: "Training class identifier"
        constraints: "required"
      - name: courses_required
        type: integer
        source: input
        description: "Number of distinct course units required to complete the program"
        default: 1
        constraints: ">= 1"
      - name: courses_completed
        type: integer
        source: input
        description: "Distinct course units completed; cannot exceed courses_required"
        default: 0
        constraints: "0 <= courses_completed <= courses_required"
      - name: courses_needed
        type: computed
        description: "courses_required - courses_completed"
        default: 0
      - name: status
        type: enum
        source: system
        description: "PENDING_ACK | RESTRICTED | IN_PROGRESS | COMPLETED | CANCELLED"
        default: PENDING_ACK
        constraints: "enum {PENDING_ACK, RESTRICTED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: version
        type: integer
        source: system
        description: "OCC version for TrainingEnrollment"
        default: 1

state_machines:
  # ---------------------------------------------------------------------------
  # M1 Store (precondition gate for cross-entity rules R7-a / R7-b)
  # ---------------------------------------------------------------------------
  - entity: Store
    field: hospital_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /stores/{storeId}/restrict"
        actor: PlatformAdmin
        preconditions:
          - "Store.hospital_occupancy >= Store.hospital_capacity (ERR_HOSPITAL_AT_CAPACITY)"
          - "Expected store version matches current Store.version (ERR_STALE_VERSION)"
        side_effects:
          - "ServiceBay rows whose store_id is this Store: status → FROZEN and is_frozen → true"
          - "Every VaccinationClinic of this store with clinic_status == OPEN: clinic_status → FROZEN, version increments by 1"
          - "Store.frozen_vaccination_clinics recomputed"
          - "Store.restricted_training_slots_pending recomputed; Store.version increments by 1"
        note: "Bay freeze is the depth-2 hop of cascade C-a."
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /stores/{storeId}/lift-posture-restriction"
        actor: PlatformAdmin
        preconditions:
          - "Store.hospital_occupancy < Store.hospital_capacity (ERR_HOSPITAL_AT_CAPACITY)"
          - "Expected store version matches current Store.version (ERR_STALE_VERSION)"
        side_effects:
          - "ServiceBay rows whose store_id is this Store and status == FROZEN: status → ACTIVE, is_frozen → false"
          - "VaccinationClinic rows of this store in FROZEN whose clinic_date >= current logical clock: clinic_status → SCHEDULED"
          - "Store.frozen_vaccination_clinics recomputed; Store.version increments by 1"
      - from: OPEN
        to: FROZEN
        trigger: "POST /stores/{storeId}/freeze-hospital (direct surge escalation), or POST /stores/{storeId}/_bump-occupancy-v1 when the recalculation resolves to FROZEN"
        actor: PlatformAdmin
        preconditions:
          - "Either the store is explicitly escalated, or the occupancy recalculation resolves to FROZEN while the store is OPEN"
          - "Expected store version matches current Store.version (ERR_STALE_VERSION)"
        side_effects:
          - "hospital_posture -> FROZEN"
          - "ServiceBay rows of this Store: status -> FROZEN, is_frozen -> true"
          - "VaccinationClinic rows of this Store in {SCHEDULED, OPEN}: clinic_status -> FROZEN, version increments by 1"
          - "VaccinationVisit rows of those clinics in {REGISTERED, CERTIFICATE_ISSUED, REPORT_REQUIRED}: status -> BLOCKED"
          - "RabiesCertificate rows of those visits: is_effective -> false; Pet.rabies_vaccination_expires_at recomputed"
          - "Store.frozen_vaccination_clinics recomputed"
          - "Every PharmacyOrder of this Store not in {DISPENSED, REJECTED}: on_hold -> HOLDING"
          - "Store.stores_held_total recomputed; Store.pharmacy_hold_until = logical clock + 72 hours; Store.version increments by 1"
        note: "The surge path skips RESTRICTED entirely."

      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /stores/{storeId}/freeze-hospital"
        actor: PlatformAdmin
        preconditions:
          - "Store.hospital_posture == RESTRICTED (ERR_STORE_NOT_RESTRICTED)"
          - "Expected store version matches current Store.version (ERR_STALE_VERSION)"
        side_effects:
          - "ServiceBay rows of this Store: status → FROZEN, is_frozen → true"
          - "VaccinationClinic rows of this Store in {SCHEDULED, OPEN}: clinic_status → FROZEN, version increments by 1"
          - "Store.frozen_vaccination_clinics recomputed"
          - "Every PharmacyOrder of this Store not in {DISPENSED, REJECTED}: on_hold → HOLDING"
          - "Store.stores_held_total recomputed; Store.version increments by 1"
          - "Store.pharmacy_hold_until set to the current logical clock + 72 hours"
        note: "Depth-3 cascade C-b: Store → VaccinationVisit BLOCKED → RabiesCertificate.is_effective false → Pet.rabies_vaccination_expires_at null."
      - from: FROZEN
        to: OPEN
        trigger: "POST /stores/{storeId}/reopen-hospital"
        actor: PlatformAdmin
        preconditions:
          - "At least one Store.hospital_capacity slot is free (ERR_HOSPITAL_AT_CAPACITY)"
          - "Expected store version matches current Store.version (ERR_STALE_VERSION)"
        side_effects:
          - "ServiceBay rows of this Store and status == FROZEN: status → ACTIVE, is_frozen → false"
          - "VaccinationClinic rows of this Store in FROZEN: clinic_status → SCHEDULED"
          - "PharmacyOrder rows of this Store with on_hold == HOLDING: on_hold → NONE, status → REQUESTED"
          - "Store.stores_held_total recomputed; Store.pharmacy_hold_until cleared to null; Store.version increments by 1"

      - from: OPEN
        to: OPEN
        trigger: "POST /stores/{storeId}/_bump-occupancy-v1 (recalculation resolves to OPEN)"
        actor: PlatformAdmin
        preconditions:
          - "The store has at least `magnitude` encounters in SCHEDULED"
          - "Expected store version matches current Store.version (ERR_STALE_VERSION)"
        side_effects:
          - "hospital_occupancy recomputed; hospital_posture recomputed; Store.version increments by 1"
      - from: RESTRICTED
        to: RESTRICTED
        trigger: "POST /stores/{storeId}/_bump-occupancy-v1 (recalculation resolves to RESTRICTED)"
        actor: PlatformAdmin
        preconditions:
          - "The store has at least `magnitude` encounters in SCHEDULED"
          - "Expected store version matches current Store.version (ERR_STALE_VERSION)"
        side_effects:
          - "hospital_occupancy recomputed; hospital_posture recomputed; Store.version increments by 1"
      - from: FROZEN
        to: FROZEN
        trigger: "POST /stores/{storeId}/_bump-occupancy-v1 (recalculation resolves to FROZEN)"
        actor: PlatformAdmin
        preconditions:
          - "The store has at least `magnitude` encounters in SCHEDULED"
          - "Expected store version matches current Store.version (ERR_STALE_VERSION)"
        side_effects:
          - "hospital_occupancy recomputed; hospital_posture recomputed; Store.version increments by 1"

  # ---------------------------------------------------------------------------
  # M2 ServiceBay — FROZEN <-> ACTIVE revert pair is non-linear machine #1
  # ---------------------------------------------------------------------------
  - entity: ServiceBay
    field: status
    initial_state: ACTIVE
    terminal_states: [DISABLED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "system (Store.hospital_posture OPEN|RESTRICTED → FROZEN)"
        actor: system
        preconditions:
          - "Parent Store.hospital_posture == FROZEN"
        side_effects:
          - "is_frozen → true"
          - "ServiceBooking rows of this bay in {REQUESTED, SCREENED, BAY_CONFIRMED}: status → CANCELLED, version increments by 1"
          - "ServiceBooking rows of this bay in IN_SERVICE: status → COMPLETED, version increments by 1"
          - "For each booking moved to COMPLETED: its VeterinaryEncounter in {SCHEDULED, CHECKED_IN} → CANCELLED; its PrescriptionAuthorization rows in {PENDING_EXAM, AUTHORIZED} → REVOKED"
          - "Store.frozen_vaccination_clinics recomputed"
      - from: FROZEN
        to: ACTIVE
        trigger: "system (Store.hospital_posture FROZEN → OPEN)"
        actor: system
        preconditions:
          - "Parent Store.hospital_posture == OPEN"
        side_effects:
          - "is_frozen → false"
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /stores/{storeId}/service-bays/{bayId}/disable"
        actor: StoreManager
        preconditions:
          - "No ServiceBooking row of this bay is in {REQUESTED, SCREENED, BAY_CONFIRMED, IN_SERVICE} (ERR_BAY_HAS_ACTIVE_BOOKINGS)"
          - "Expected bay version matches current ServiceBay.version (ERR_STALE_VERSION)"
        side_effects:
          - "Bay becomes permanently unschedulable; version increments by 1"

  # ---------------------------------------------------------------------------
  # M3 ServiceBooking — cyclic + parallel dimension; non-linear machine #2
  # ---------------------------------------------------------------------------
  - entity: ServiceBooking
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: SCREENED
        trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/screen"
        actor: GroomingStaff
        preconditions:
          - "ServiceBooking.service_type == GROOMING (ERR_BOOKING_NOT_GROOMING)"
          - "ServiceBooking.status == REQUESTED (ERR_BOOKING_NOT_SCREENABLE)"
        side_effects:
          - "screening_score = pet_risk_points + breed_risk_points + weight_band_points + health_condition_points"
          - "handling_level derived from screening_score via the screening thresholds"
          - "A GroomingRiskScreening row is appended for this booking"
          - "screening_valid_until = logical clock + SCREENING_VALIDITY_DAYS"
          - "Pet.version increments by 1"
        note: "Re-screening cycle: SCREENED → REQUESTED (re_screen_required) → SCREENED again."
      - from: SCREENED
        to: REQUESTED
        trigger: "system (logical clock strictly after screening_valid_until)"
        actor: system
        preconditions:
          - "re_screen_required == true"
        side_effects:
          - "re_screen_required → false until the clock advances past the new screening_valid_until"
          - "version increments by 1"
      - from: REQUESTED
        to: BAY_CONFIRMED
        trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay"
        actor: StoreManager
        preconditions:
          - "ServiceBooking.service_type != GROOMING (ERR_BOOKING_NOT_SCREENED); a grooming booking must be screened first"
          - "No time conflict on the bay window (ERR_BAY_SLOT_CONFLICT)"
          - "No cross-bay twin-booking overlap for the same pet (ERR_PET_DOUBLE_BOOKED)"
          - "Parent ServiceBay.status == ACTIVE (ERR_BAY_NOT_ACTIVE)"
          - "Parent Store.hospital_posture != FROZEN (ERR_STORE_HOSPITAL_FROZEN)"
          - "Member.status == ACTIVE (ERR_MEMBER_SUSPENDED)"
          - "Expected booking version matches current ServiceBooking.version (ERR_STALE_VERSION)"
        side_effects:
          - "version increments by 1"
          - "Store.hospital_occupancy recomputed when service_type == VETERINARY"
        note: "Grooming bookings reach BAY_CONFIRMED only from SCREENED; every other service type skips screening."

      - from: SCREENED
        to: BAY_CONFIRMED
        trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay"
        actor: StoreManager
        preconditions:
          - "ServiceBooking.status == SCREENED (ERR_BOOKING_NOT_SCREENED)"
          - "For grooming bookings only: screening_score < HIGH_RISK_THRESHOLD OR aggression_acknowledged == true (ERR_HIGH_RISK_NOT_ACKNOWLEDGED)"
          - "No time conflict on the bay window (ERR_BAY_SLOT_CONFLICT)"
          - "No cross-bay twin-booking overlap for the same pet (ERR_PET_DOUBLE_BOOKED)"
          - "Parent ServiceBay.status == ACTIVE (ERR_BAY_NOT_ACTIVE)"
          - "Parent Store.hospital_posture != FROZEN (ERR_STORE_HOSPITAL_FROZEN)"
          - "Member.status == ACTIVE (ERR_MEMBER_SUSPENDED)"
          - "Expected booking version matches current ServiceBooking.version (ERR_STALE_VERSION)"
        side_effects:
          - "version increments by 1"
          - "Store.hospital_occupancy recomputed when service_type == VETERINARY"
      - from: BAY_CONFIRMED
        to: BAY_CONFIRMED
        trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay (repeat, widening the same window)"
        actor: StoreManager
        preconditions:
          - "The candidate window strictly contains the currently held window and collides with no other booking (ERR_BAY_SLOT_CONFLICT)"
          - "Expected booking version matches current ServiceBooking.version (ERR_STALE_VERSION)"
        side_effects:
          - "starts_at / ends_at replaced; version increments by 1"
        note: "Self-loop: legitimate re-confirmation widening an existing reservation."
      - from: BAY_CONFIRMED
        to: SCREENED
        trigger: "system (re_screen_required becomes true after the screening validity window lapses)"
        actor: system
        preconditions:
          - "Booking.service_type == GROOMING"
          - "re_screen_required == true"
        side_effects:
          - "Booking returns to the screening gate for re-verification"
        note: "Grooming bookings drop back to SCREENED while non-grooming bookings drop all the way to REQUESTED."
      - from: BAY_CONFIRMED
        to: CANCELLED
        trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/cancel"
        actor: GroomingStaff
        preconditions:
          - "ServiceBooking.status == BAY_CONFIRMED (ERR_BOOKING_NOT_CANCELLABLE)"
          - "Expected booking version matches current ServiceBooking.version (ERR_STALE_VERSION)"
        side_effects:
          - "A Pet with this pet_id having at least one ensuing INCIDENT_INJURY booking: → ARCHIVED"
          - "Pet.version increments by 1"
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/complete-service"
        actor: GroomingStaff
        preconditions:
          - "ServiceBooking.status == IN_SERVICE (ERR_BOOKING_NOT_IN_SERVICE)"
          - "Expected booking version matches current ServiceBooking.version (ERR_STALE_VERSION)"
        side_effects:
          - "version increments by 1"
          - "If service_type == VETERINARY: the linked VeterinaryEncounter in {SCHEDULED, CHECKED_IN} → CANCELLED"
      - from: [REQUESTED, SCREENED, BAY_CONFIRMED]
        to: NO_SHOW
        trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/mark-no-show"
        actor: GroomingStaff
        preconditions:
          - "The logical clock is strictly after this booking's starts_at + NO_SHOW_GRACE_MINUTES"
          - "Expected booking version matches current ServiceBooking.version (ERR_STALE_VERSION)"
        side_effects:
          - "status -> NO_SHOW; version increments by 1"
        note: "Terminal: a no-show booking releases its bay window and never returns to the schedule."
      - from: BAY_CONFIRMED
        to: IN_SERVICE
        trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/start-service"
        actor: GroomingStaff
        preconditions:
          - "ServiceBooking.status == BAY_CONFIRMED (ERR_BOOKING_NOT_CONFIRMED)"
          - "Expected booking version matches current ServiceBooking.version (ERR_STALE_VERSION)"
        side_effects:
          - "version increments by 1"

  # ---------------------------------------------------------------------------
  # M4 VaccinationClinic
  # ---------------------------------------------------------------------------
  - entity: VaccinationClinic
    field: clinic_status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /stores/{storeId}/vaccination-clinics/{clinicId}/open-walk-ins"
        actor: VaccinationStaff
        preconditions:
          - "Parent Store.hospital_posture == OPEN (ERR_CLINIC_STORE_NOT_OPEN)"
          - "coverage_required == false OR coverage_provider is a non-empty string (ERR_CLINIC_COVERAGE_REQUIRED)"
          - "Expected clinic version matches current VaccinationClinic.version (ERR_STALE_VERSION)"
        side_effects:
          - "Walk-in registration enabled; version increments by 1"
      - from: OPEN
        to: FROZEN
        trigger: "system (Store.hospital_posture OPEN → RESTRICTED)"
        actor: system
        preconditions: []
        side_effects:
          - "All VaccinationVisit rows of this clinic in {REGISTERED, CERTIFICATE_ISSUED, REPORT_REQUIRED}: status → BLOCKED"
          - "Every RabiesCertificate row of each blocked visit: is_effective → false"
          - "Every Pet of each affected certificate: rabies_vaccination_expires_at recomputed from effective certificates, which is null when none remains effective"
          - "Store.frozen_vaccination_clinics recomputed"
        note: "Depth-3 cascade C-b; hop 3 is the Pet recomputation, which is a mutation of a third entity caused by the Certificates' mutation rather than the Store's."
      - from: FROZEN
        to: OPEN
        trigger: "system (Store.hospital_posture FROZEN → OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "VaccinationVisit rows of this clinic in BLOCKED: status → REGISTERED"
          - "RabiesCertificate rows of those visits: is_effective → true when the logical clock is at or before expires_at"
      - from: OPEN
        to: CLOSED
        trigger: "POST /stores/{storeId}/vaccination-clinics/{clinicId}/close-walk-ins"
        actor: VaccinationStaff
        preconditions:
          - "VaccinationClinic.clinic_status == OPEN (ERR_CLINIC_NOT_OPEN)"
          - "No VaccinationVisit of this clinic is in {REGISTERED, CERTIFICATE_ISSUED, REPORT_REQUIRED} (ERR_CLINIC_HAS_OPEN_VISITS)"
          - "Expected clinic version matches current VaccinationClinic.version (ERR_STALE_VERSION)"
        side_effects:
          - "clinic becomes terminal; version increments by 1"

  # ---------------------------------------------------------------------------
  # M5 VaccinationVisit
  # ---------------------------------------------------------------------------
  - entity: VaccinationVisit
    field: status
    initial_state: REGISTERED
    terminal_states: [REPORTED, BLOCKED]
    transitions:
      - from: REGISTERED
        to: CERTIFICATE_ISSUED
        trigger: "POST /stores/{storeId}/vaccination-visits/{visitId}/issue-certificate"
        actor: VaccinationStaff
        preconditions:
          - "Parent VaccinationClinic.clinic_status == OPEN (ERR_CLINIC_NOT_OPEN)"
          - "walk_in_at >= clinic.open_time AND walk_in_at <= clinic.close_time (ERR_VISIT_OUTSIDE_WINDOW)"
          - "vaccine_type == RABIES (ERR_VISIT_NOT_RABIES)"
          - "prior_rabies_vaccination_date is null OR strictly before the clinic date (ERR_PRIOR_VACCINATION_NOT_PRIOR)"
          - "Expected visit version matches current VaccinationVisit.version (ERR_STALE_VERSION)"
        side_effects:
          - "new_effective_days = 1095 if prior_is_booster == false, else 365"
          - "certificate_serial assigned from the state-namespaced allocation"
          - "A RabiesCertificate row is appended with issued_at = logical clock, expires_at = issued_at + new_effective_days"
          - "Pet.rabies_vaccination_expires_at recomputed from effective certificates"
          - "Pet.version increments by 1"
          - "version increments by 1"
      - from: CERTIFICATE_ISSUED
        to: REPORT_REQUIRED
        trigger: "system (PubSub publication of the rabies certificate issued event)"
        actor: system
        preconditions:
          - "The issuing clinic's Store.state_code is a reporting state and the certificate was issued for a vaccine_type that requires a state report"
        side_effects:
          - "state_report_status → PENDING"
          - "state_report_due_at = last day of the calendar month following the certificate issue month, at 23:59:59Z"
      - from: REPORT_REQUIRED
        to: REPORTED
        trigger: "POST /stores/{storeId}/vaccination-visits/{visitId}/submit-state-report"
        actor: ComplianceOfficer
        preconditions:
          - "VaccinationVisit.status == REPORT_REQUIRED (ERR_VISIT_NOT_REPORTABLE)"
          - "state_report_status != SUBMITTED (ERR_VISIT_ALREADY_REPORTED)"
          - "Expected visit version matches current VaccinationVisit.version (ERR_STALE_VERSION)"
        side_effects:
          - "state_report_status → SUBMITTED"
          - "report submission instant recorded; version increments by 1"
      - from: REPORT_REQUIRED
        to: REPORT_REQUIRED
        trigger: "system (logical clock crosses state_report_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "state_report_status → OVERDUE"
        note: "Self-loop on deadline crossing; the visit stays REPORT_REQUIRED so the overdue report can still be submitted."
      - from: REGISTERED
        to: BLOCKED
        trigger: "system (clinic frozen while the walk-in was registered)"
        actor: system
        preconditions: []
        side_effects:
          - "state_report_status → NOT_REQUIRED"
      - from: CERTIFICATE_ISSUED
        to: BLOCKED
        trigger: "system (clinic frozen after the certificate was issued)"
        actor: system
        preconditions: []
        side_effects:
          - "RabiesCertificate.is_effective → false"
          - "Pet.rabies_vaccination_expires_at recomputed"

  # ---------------------------------------------------------------------------
  # M6 VeterinaryEncounter
  # ---------------------------------------------------------------------------
  - entity: VeterinaryEncounter
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /stores/{storeId}/veterinary-encounters/{encounterId}/check-in"
        actor: VeterinaryStaff
        preconditions:
          - "created_at > Store.pharmacy_hold_until (ERR_ENCOUNTER_BLOCKED_PHARMACY_HOLD)"
          - "Parent Store.hospital_occupancy < Parent Store.hospital_capacity (ERR_HOSPITAL_AT_CAPACITY)"
          - "Expected encounter version matches current VeterinaryEncounter.version (ERR_STALE_VERSION)"
        side_effects:
          - "A Pet with this pet_id having at least one BLOCKED vaccination visit: → SUSPENDED"
          - "Pet.version increments by 1"
          - "Store.hospital_occupancy refers to Encounter.status IN {SCHEDULED, CHECKED_IN, IN_EXAM} and therefore still counts this encounter"
          - "Store.version increments by 1"
      - from: CHECKED_IN
        to: IN_EXAM
        trigger: "POST /stores/{storeId}/veterinary-encounters/{encounterId}/start-exam"
        actor: VeterinaryStaff
        preconditions:
          - "VeterinaryEncounter.status == CHECKED_IN (ERR_ENCOUNTER_NOT_CHECKED_IN)"
          - "Expected encounter version matches current VeterinaryEncounter.version (ERR_STALE_VERSION)"
        side_effects:
          - "exam_date = logical clock"
          - "version increments by 1"
      - from: IN_EXAM
        to: COMPLETED
        trigger: "POST /stores/{storeId}/veterinary-encounters/{encounterId}/complete-exam"
        actor: VeterinaryStaff
        preconditions:
          - "VeterinaryEncounter.status == IN_EXAM (ERR_ENCOUNTER_NOT_IN_EXAM)"
          - "Expected encounter version matches current VeterinaryEncounter.version (ERR_STALE_VERSION)"
        side_effects:
          - "Every PrescriptionAuthorization of this encounter in PENDING_EXAM: → AUTHORIZED, authorized_at = logical clock, expires_at = authorized_at + the item-type window, price_at_authorization_cents = unit_price_cents * quantity"
          - "charge_total_cents = EXAM_CHARGE_CENTS + sum of price_at_authorization_cents over this encounter's AUTHORIZED and PARTIALLY_DISPENSED authorizations"
          - "version increments by 1"
        note: "Depth-3 cascade C-c: Encounter COMPLETED → each Authorization AUTHORIZED → each Authorization's linked PharmacyOrder REQUESTED → AUTHORIZED."
      - from: [SCHEDULED, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /stores/{storeId}/veterinary-encounters/{encounterId}/cancel"
        actor: VeterinaryStaff
        preconditions:
          - "VeterinaryEncounter.status IN {SCHEDULED, CHECKED_IN} (ERR_ENCOUNTER_NOT_CANCELLABLE)"
          - "Expected encounter version matches current VeterinaryEncounter.version (ERR_STALE_VERSION)"
        side_effects:
          - "PrescriptionAuthorization rows of this encounter in {PENDING_EXAM, AUTHORIZED}: → REVOKED"
          - "Store.hospital_occupancy recomputed; Store.version increments by 1"

  # ---------------------------------------------------------------------------
  # M7 PrescriptionAuthorization
  # ---------------------------------------------------------------------------
  - entity: PrescriptionAuthorization
    field: status
    initial_state: PENDING_EXAM
    terminal_states: [DISPENSED, EXPIRED, REVOKED]
    transitions:
      - from: PENDING_EXAM
        to: AUTHORIZED
        trigger: "system (linked VeterinaryEncounter IN_EXAM → COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "authorized_at = logical clock"
          - "expires_at = authorized_at + item-type window (MEDICATION 30 days, DIET 90 days, TREATMENT 60 days)"
          - "price_at_authorization_cents = unit_price_cents * quantity"
      - from: AUTHORIZED
        to: PARTIALLY_DISPENSED
        trigger: "POST /stores/{storeId}/pharmacy-orders"
        actor: PharmacyStaff
        preconditions:
          - "PrescriptionAuthorization.status == AUTHORIZED (ERR_AUTHORIZATION_NOT_ACTIVE)"
          - "Store.pharmacy_hold_until is null OR created_at <= Store.pharmacy_hold_until (ERR_PHARMACY_HOLD_ACTIVE)"
          - "requested_quantity <= quantity (ERR_QUANTITY_EXCEEDS_AUTHORIZATION)"
        side_effects:
          - "A PharmacyOrder row is created with status AUTHORIZED and on_hold derived from the store posture"
      - from: AUTHORIZED
        to: DISPENSED
        trigger: "POST /stores/{storeId}/pharmacy-orders (final full-quantity handoff)"
        actor: PharmacyStaff
        preconditions:
          - "PrescriptionAuthorization.status == AUTHORIZED (ERR_AUTHORIZATION_NOT_ACTIVE)"
          - "requested_quantity == quantity"
          - "Store.pharmacy_hold_until is null (ERR_PHARMACY_HOLD_ACTIVE)"
        side_effects:
          - "PharmacyOrder.current_retail_price_cents follows current authorization unit_price_cents * requested_quantity only after this transition"
          - "The authorization becomes terminal"
          - "charge_total_cents no longer includes this authorization's price_at_authorization_cents"
      - from: [AUTHORIZED, PARTIALLY_DISPENSED]
        to: REVOKED
        trigger: "POST /stores/{storeId}/prescription-authorizations/{authorizationId}/revoke"
        actor: VeterinaryStaff
        preconditions:
          - "PrescriptionAuthorization.status IN {AUTHORIZED, PARTIALLY_DISPENSED} (ERR_AUTHORIZATION_NOT_ACTIVE)"
          - "Expected authorization version matches current PrescriptionAuthorization.version (ERR_STALE_VERSION)"
        side_effects:
          - "PharmacyOrder rows of this authorization in {REQUESTED, AUTHORIZED}: status → REJECTED"
          - "version increments by 1"
      - from: AUTHORIZED
        to: EXPIRED
        trigger: "system (logical clock strictly after expires_at)"
        actor: system
        preconditions:
          - "The logical clock is strictly after expires_at"
        side_effects:
          - "The authorization can no longer fund a pharmacy handoff"

  # ---------------------------------------------------------------------------
  # M8 PharmacyOrder
  # ---------------------------------------------------------------------------
  - entity: PharmacyOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [DISPENSED, REJECTED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "system (authorization-clone on completion of the linked VeterinaryEncounter)"
        actor: system
        preconditions:
          - "The linked PrescriptionAuthorization.status IN {AUTHORIZED, PARTIALLY_DISPENSED}"
          - "Store.pharmacy_hold_until is null OR the current logical clock is strictly after Store.pharmacy_hold_until"
        side_effects:
          - "on_hold → NONE when the store is not held"
      - from: AUTHORIZED
        to: DISPENSED
        trigger: "POST /stores/{storeId}/pharmacy-orders/{orderId}/dispense"
        actor: PharmacyStaff
        preconditions:
          - "PharmacyOrder.status == AUTHORIZED (ERR_PHARMACY_ORDER_NOT_AUTHORIZED)"
          - "The linked authorization's remaining quantity supports requested_quantity (ERR_QUANTITY_EXCEEDS_AUTHORIZATION)"
          - "Store.pharmacy_hold_until is null (ERR_PHARMACY_HOLD_ACTIVE)"
          - "Expected order version matches current PharmacyOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "The linked PrescriptionAuthorization → PARTIALLY_DISPENSED when requested_quantity < quantity, else → DISPENSED"
          - "current_retail_price_cents recomputed"
          - "version increments by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "system (linked PrescriptionAuthorization → REVOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "The release commits normally: Store.stores_held_total decremented if on_hold was HOLDING; on_hold → NONE"
      - from: AUTHORIZED
        to: REJECTED
        trigger: "POST /stores/{storeId}/pharmacy-orders/{orderId}/reject"
        actor: PharmacyStaff
        preconditions:
          - "PharmacyOrder.status == AUTHORIZED (ERR_PHARMACY_ORDER_NOT_AUTHORIZED)"
          - "Expected order version matches current PharmacyOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "The linked PrescriptionAuthorization returns to AUTHORIZED when it had been PARTIALLY_DISPENSED and no other order of the authorization is DISPENSED"
          - "Store.stores_held_total recomputed when on_hold was HOLDING"
          - "version increments by 1"
      - from: AUTHORIZED
        to: REQUESTED
        trigger: "system (Store.hospital_posture FROZEN → OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "on_hold → NONE"

  # ---------------------------------------------------------------------------
  # M9 IncidentRecord
  # ---------------------------------------------------------------------------
  - entity: IncidentRecord
    field: claim_status
    initial_state: UNREVIEWED
    terminal_states: [DENIED]
    transitions:
      - from: UNREVIEWED
        to: UNDER_REVIEW
        trigger: "POST /stores/{storeId}/incident-records/{incidentId}/begin-review"
        actor: StoreManager
        preconditions:
          - "IncidentRecord.claim_status == UNREVIEWED (ERR_INCIDENT_NOT_REVIEWABLE)"
          - "The ServiceBooking named by IncidentRecord.booking_id has service_type == GROOMING (ERR_INCIDENT_BOOKING_TYPE_MISMATCH)"
          - "Expected incident version matches current IncidentRecord.version (ERR_STALE_VERSION)"
        side_effects:
          - "version increments by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /stores/{storeId}/incident-records/{incidentId}/approve-claim"
        actor: StoreManager
        preconditions:
          - "IncidentRecord.claim_status == UNDER_REVIEW (ERR_INCIDENT_NOT_UNDER_REVIEW)"
          - "claim_amount_cents <= IncidentClaimCap[Store.state_code] OR override_reason is a non-empty string (ERR_CLAIM_CAP_EXCEEDED)"
          - "A Pet with this pet_id in ACTIVE status exists (ERR_PET_ARCHIVED)"
          - "Expected incident version matches current IncidentRecord.version (ERR_STALE_VERSION)"
        side_effects:
          - "payout_amount_cents = claim_amount_cents"
          - "risk_points_lost = risk_points"
          - "Pet.risk_score recomputed as the sum of risk_points over IncidentRecord rows whose claim_status is not DENIED"
          - "Pet.version increments by 1"
          - "IncidentRecord.available_claimable_cents = 0"
          - "Store.incident_risk_index recomputed as the sum of claim_amount_cents over this store's incidents whose claim_status IN {UNREVIEWED, UNDER_REVIEW}"
          - "Store.version increments by 1"
          - "version increments by 1"
        note: "Compensating pair for conservation quantity C3."
      - from: [UNREVIEWED, UNDER_REVIEW]
        to: DENIED
        trigger: "POST /stores/{storeId}/incident-records/{incidentId}/deny-claim"
        actor: StoreManager
        preconditions:
          - "IncidentRecord.claim_status IN {UNREVIEWED, UNDER_REVIEW} (ERR_INCIDENT_NOT_DENIABLE)"
          - "Expected incident version matches current IncidentRecord.version (ERR_STALE_VERSION)"
        side_effects:
          - "Pet.risk_score recomputed excluding this incident's risk_points entirely"
          - "Pet.version increments by 1"
          - "Store.incident_risk_index recomputed"
          - "version increments by 1"
      - from: UNDER_REVIEW
        to: UNREVIEWED
        trigger: "POST /stores/{storeId}/incident-records/{incidentId}/return-to-queue"
        actor: StoreManager
        preconditions:
          - "IncidentRecord.claim_status == UNDER_REVIEW (ERR_INCIDENT_NOT_UNDER_REVIEW)"
          - "Expected incident version matches current IncidentRecord.version (ERR_STALE_VERSION)"
        side_effects:
          - "version increments by 1"

  # ---------------------------------------------------------------------------
  # M10 ServicePackage
  # ---------------------------------------------------------------------------
  - entity: ServicePackage
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /stores/{storeId}/members/{memberId}/service-packages/{packageId}/pause"
        actor: StoreManager
        preconditions:
          - "ServicePackage.status == ACTIVE (ERR_PACKAGE_NOT_ACTIVE)"
          - "Expected package version matches current ServicePackage.version (ERR_STALE_VERSION)"
        side_effects:
          - "version increments by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /stores/{storeId}/members/{memberId}/service-packages/{packageId}/resume"
        actor: StoreManager
        preconditions:
          - "ServicePackage.status == PAUSED (ERR_PACKAGE_NOT_PAUSED)"
          - "Expected package version matches current ServicePackage.version (ERR_STALE_VERSION)"
        side_effects:
          - "version increments by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /stores/{storeId}/members/{memberId}/service-packages/{packageId}/cancel"
        actor: StoreManager
        preconditions:
          - "ServicePackage.status == PAUSED (ERR_PACKAGE_NOT_PAUSED)"
          - "Expected package version matches current ServicePackage.version (ERR_STALE_VERSION)"
        side_effects:
          - "All PENDING PackageBillingCycle rows of this package: status → VOID"
          - "Every TrainingEnrollment row of this package in {PENDING_ACK, RESTRICTED, IN_PROGRESS}: status → CANCELLED, version increments by 1"
          - "Every TrainingEnrollment row of this package whose status becomes CANCELLED releases its restricted slot normally: Store.restricted_training_slots_pending recomputed"
          - "Member.outstanding_balance_cents recomputed"
          - "version increments by 1"

  # ---------------------------------------------------------------------------
  # M11 TrainingEnrollment (non-linear machine #3: revert PENDING_ACK <-> RESTRICTED)
  # ---------------------------------------------------------------------------
  - entity: TrainingEnrollment
    field: status
    initial_state: PENDING_ACK
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING_ACK
        to: RESTRICTED
        trigger: "POST /stores/{storeId}/training-enrollments/{enrollmentId}/begin-course"
        actor: TrainingStaff
        preconditions:
          - "Parent ServicePackage.status == ACTIVE (ERR_PACKAGE_NOT_ACTIVE)"
          - "Pet.status == ACTIVE (ERR_PET_ARCHIVED)"
          - "Store.hospital_posture != FROZEN (ERR_STORE_HOSPITAL_FROZEN)"
          - "Expected enrollment version matches current TrainingEnrollment.version (ERR_STALE_VERSION)"
        side_effects:
          - "Store.restricted_training_slots_pending recomputed"
          - "version increments by 1"
      - from: RESTRICTED
        to: PENDING_ACK
        trigger: "POST /stores/{storeId}/training-enrollments/{enrollmentId}/return-to-ack"
        actor: TrainingStaff
        preconditions:
          - "TrainingEnrollment.status == RESTRICTED (ERR_ENROLLMENT_NOT_RESTRICTED)"
          - "Expected enrollment version matches current TrainingEnrollment.version (ERR_STALE_VERSION)"
        side_effects:
          - "Store.restricted_training_slots_pending recomputed"
          - "version increments by 1"
      - from: [PENDING_ACK, RESTRICTED]
        to: IN_PROGRESS
        trigger: "POST /stores/{storeId}/training-enrollments/{enrollmentId}/start-course"
        actor: TrainingStaff
        preconditions:
          - "courses_needed >= 1 (ERR_COURSES_ALREADY_COMPLETE)"
          - "Expected enrollment version matches current TrainingEnrollment.version (ERR_STALE_VERSION)"
        side_effects:
          - "version increments by 1"
      - from: IN_PROGRESS
        to: PENDING_ACK
        trigger: "POST /stores/{storeId}/training-enrollments/{enrollmentId}/revert-course"
        actor: TrainingStaff
        preconditions:
          - "TrainingEnrollment.status == IN_PROGRESS (ERR_ENROLLMENT_NOT_IN_PROGRESS)"
          - "Expected enrollment version matches current TrainingEnrollment.version (ERR_STALE_VERSION)"
        side_effects:
          - "Store.restricted_training_slots_pending recomputed"
          - "version increments by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (courses_completed reaches courses_required)"
        actor: system
        preconditions:
          - "courses_needed == 0"
        side_effects:
          - "Store.restricted_training_slots_pending recomputed"

concurrency_rules:
  - rule_id: complete-exam-stale-encounter
    parent_entity: VeterinaryEncounter
    write_endpoint: "POST /stores/{storeId}/veterinary-encounters/{encounterId}/complete-exam"
    occ_field: "expected_encounter_version"
    description: |
      Completing an exam against a VeterinaryEncounter whose version has
      advanced is rejected, because another writer has already authorised a
      prescription or re-opened the exam lifecycle on that encounter and the
      chair's view of the encounter is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bump-occupancy-stale-store
    parent_entity: Store
    write_endpoint: "POST /stores/{storeId}/_bump-occupancy-v1"
    occ_field: "expected_store_version"
    description: |
      Raising hospital occupancy against a Store whose version has advanced is
      rejected, because the hospital_occupancy and hospital_posture
      recalculations have already advanced the store row and the caller's
      occupancy snapshot is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: enrollment-start-stale-enrollment
    parent_entity: TrainingEnrollment
    write_endpoint: "POST /stores/{storeId}/training-enrollments/{enrollmentId}/begin-course"
    occ_field: "expected_enrollment_version"
    description: |
      Beginning a course against a TrainingEnrollment whose version has
      advanced is rejected, because another writer has already moved the
      enrollment on the acknowledgement axis and the trainer's view of the
      restricted-slot position is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pharmacy-order-stale-authorization
    parent_entity: PrescriptionAuthorization
    write_endpoint: "POST /stores/{storeId}/pharmacy-orders"
    occ_field: "expected_authorization_version"
    description: |
      Raising a pharmacy handoff against a PrescriptionAuthorization whose
      version has advanced is rejected, because another writer has just
      authorised or revoked the prescription, or the exam completion cascade
      has already advanced it, so the counter's view of the prescription's
      remaining quantity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: grooming_screening_score
    trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/screen (ServiceBooking REQUESTED → SCREENED)"
    algorithm: weighted_scoring
    formula: |
      pet_risk_points      = Pet.risk_score
      breed_risk_points    = BreedHandlingRule.risk_points where lower(BreedHandlingRule.breed) == lower(Pet.breed)
                             and BreedHandlingRule.species == Pet.species; 0 when no rule matches
      weight_band_points   = 10 if Pet.weight_kg >= 40.0
                           = 5  if Pet.weight_kg >= 25.0 and Pet.weight_kg < 40.0
                           = 0  otherwise
      health_condition_points = sum over submitted conditions of the lookup below
                             CARDIAC 30, EPILEPSY 25, DIABETES 20, ORTHOPEDIC 15, SKIN_INFECTION 10
      breed_ceiling        = 0 if breed_risk_points <= 25 else 25
      raw_score            = min(pet_risk_points, 100) + min(breed_risk_points, breed_ceiling)
                             + weight_band_points + health_condition_points
      screening_score      = max(0, min(raw_score, 160))
    input_set: "Pet.risk_score is the sum of risk_points over IncidentRecord rows of the pet whose claim_status is not DENIED. Aggression history is therefore included; DENIED claims are excluded."
    constants:
      WEIGHT_BAND_LARGE_KG: 40.0
      WEIGHT_BAND_LARGE_POINTS: 10
      WEIGHT_BAND_MEDIUM_KG: 25.0
      WEIGHT_BAND_MEDIUM_POINTS: 5
      CONDITION_POINTS: {CARDIAC: 30, EPILEPSY: 25, DIABETES: 20, ORTHOPEDIC: 15, SKIN_INFECTION: 10}
      PET_RISK_CAP: 100
      BREED_RISK_SOFT_CEILING: 25
      SCORE_CAP: 160
    precision: "integer; no rounding applied at any step"
    variants:
      - name: withheld_history_variant
        when: "the screening is re-run after a §1.9 clock rewind moves the logical clock back before the incident that produced part of Pet.risk_score"
        difference: "pet_risk_points is substituted by the greater of 20 and (Pet.risk_score - 10); the breed, weight and condition terms are unchanged, so the same pet can screen lower on the re-run than on the first run"
    note: "The nested min/max and the conditional breed ceiling make this formula non-linear in three of its four inputs."

  - name: grooming_handling_level
    trigger: "POST /stores/{storeId}/service-bookings/{bookingId}/screen (ServiceBooking REQUESTED → SCREENED)"
    algorithm: threshold
    formula: |
      threshold   = BreedHandlingRule.handling_tier where the breed is matched case-insensitively
      if threshold is null: threshold = STANDARD
      if threshold == HIGH_RISK or screening_score >= 70:   handling_level = HIGH_RISK
      elif threshold == SENSITIVE or screening_score >= 40: handling_level = SENSITIVE
      else:                                                 handling_level = STANDARD
    constants:
      HIGH_RISK_THRESHOLD: 70
      SENSITIVE_THRESHOLD: 40
    precision: "integer thresholds; comparisons are inclusive (>=) at both boundaries"
    note: "The breed tier is a floor, not a cap: a HIGH_RISK breed is HIGH_RISK even at screening_score 0, and a STANDARD breed reaches HIGH_RISK at exactly 70."

  - name: package_cycle_total_cents
    trigger: "POST /stores/{storeId}/members/{memberId}/service-packages/{packageId}/billing-cycles (PackageBillingCycle PENDING → BILLED)"
    algorithm: tiered_pricing
    formula: |
      pre_tax_cents = grooming_visits_consumed_in_cycle * GROOMING_VISIT_CREDIT_CENTS
                    + vet_visits_consumed_in_cycle      * VET_VISIT_CREDIT_CENTS
                    + vaccine_visits_consumed_in_cycle  * VACCINE_VISIT_CREDIT_CENTS
      consumed_visits_in_cycle = grooming_visits_consumed_in_cycle + vet_visits_consumed_in_cycle
                               + vaccine_visits_consumed_in_cycle
      overage_visits       = max(0, consumed_visits_in_cycle - included_visits_total)
      overage_credit_cents = overage_visits * OVERAGE_CREDIT_CENTS
      cycle_total_cents = round_half_up((pre_tax_cents - overage_credit_cents)
                                        * (1 + state_sales_tax_rate), 2)
      tax_cents         = round_half_up(cycle_total_cents * state_sales_tax_rate
                                        / (1 + state_sales_tax_rate), 2)
    input_set: "Only visits consumed inside the cycle window enter pre_tax_cents; a visit that is COMPLETED outside the cycle window contributes 0 to that cycle and is not deferred. overage_visits is measured per cycle against included_visits_total, not against the package lifetime."
    constants:
      GROOMING_VISIT_CREDIT_CENTS: 2500
      VET_VISIT_CREDIT_CENTS: 4000
      VACCINE_VISIT_CREDIT_CENTS: 1500
      OVERAGE_CREDIT_CENTS: 500
    precision: "2 decimal places, round_half_up; the monthly membership fee is separately rounded to a whole cent before it is multiplied by billing_cycle_count, and the cycle subtotal is rounded exactly once"
    variants:
      - name: credit_tax_exempt_variant
        when: "the store treats the overage credit as a pre-tax store credit rather than a rebate of already-taxed spend"
        difference: "taxes the gross visit spend first and subtracts the credit afterwards — round_half_up(pre_tax_cents * (1 + rate), 2) - overage_credit_cents — so the same 2-grooming-plus-1-vet cycle at rate 0.0925 bills 16433.75 instead of the base variant's 16387.50"
    note: "Nested rounding order is pinned: pre_tax is summed per visit, the overage credit is deducted once, and a single half-up rounding produces cycle_total_cents."

  - name: package_tier_included_credits
    trigger: "POST /stores/{storeId}/members/{memberId}/service-packages (ServicePackage creation)"
    algorithm: threshold
    formula: |
      TIER_INCLUSIONS = {
        ESSENTIAL: {grooming: 1, vet: 0, vaccine: 1},
        PLUS:      {grooming: 2, vet: 1, vaccine: 1},
        UNLIMITED: {grooming: 6, vet: 2, vaccine: 2}}
      grooming_visits_included = TIER_INCLUSIONS[tier].grooming
      vet_visits_included      = TIER_INCLUSIONS[tier].vet
      vaccine_visits_included  = TIER_INCLUSIONS[tier].vaccine
      included_visits_total    = grooming_visits_included + vet_visits_included + vaccine_visits_included
      overage_visits           = max(0, consumed_visits - included_visits_total * cycles_consumed)
    constants:
      TIER_HARD_CAP: {ESSENTIAL: 4, PLUS: 8, UNLIMITED: 12}
      DEFAULT_MONTHLY_FEE_CENTS: {ESSENTIAL: 3999, PLUS: 6999, UNLIMITED: 11999}
    precision: "integer"
    note: "A monthly_fee_cents of 0 means the tier default is used; any non-zero value replaces the default entirely rather than adjusting it."

  - name: rabies_certificate_validity
    trigger: "POST /stores/{storeId}/vaccination-visits/{visitId}/issue-certificate (VaccinationVisit REGISTERED → CERTIFICATE_ISSUED)"
    algorithm: threshold
    formula: |
      state_default_days = STATE_DEFAULT_DAYS[Store.state_code]
      if prior_rabies_vaccination_date is null:
        new_effective_days = state_default_days
        prior_is_booster   = false
      else:
        prior_effective_days = the effective_days of the pet's RabiesCertificate with the latest issued_at
                               whose issued_at <= prior_rabies_vaccination_date
        prior_is_booster     = prior_effective_days == 365
        new_effective_days   = min(state_default_days, BOOSTER_CAP_DAYS) if prior_is_booster
                               else state_default_days
      issued_at  = current logical clock
      expires_at = issued_at + new_effective_days
      serial     = STATE_CODE + "-" + year(issued_at) + "-" + zero_padded_6(
                     count of RabiesCertificate rows for that state_code and that year, including this one)
    constants:
      STATE_DEFAULT_DAYS: {CA: 1095, TX: 365, NY: 365, FL: 1095}
      BOOSTER_CAP_DAYS: 365
    precision: "integer days; expires_at is an exact timestamp equal to issued_at plus the day count"
    note: "The cap follows the PRIOR certificate's duration, not the issuing store's state: a 365-day Texas certificate renews for 365 days even at a California store whose default is 1095."

  - name: rabies_report_due_date
    trigger: "system (VaccinationVisit CERTIFICATE_ISSUED → REPORT_REQUIRED)"
    algorithm: chronological
    formula: |
      if Store.state_code is not in REPORTING_STATES: state_report_due_at = null
      else:
        issue_month = month(certificate_issued_at)
        first_of_next_month = the first instant of the month following issue_month
        state_report_due_at = last instant of the calendar month of first_of_next_month,
                              expressed as T23:59:59Z
    constants:
      REPORTING_STATES: {CA: true, TX: true, NY: true, FL: false}
      DUE_DAY_OFFSET_FROM_MONTH_END: 0
    precision: "second-precision UTC timestamps; no fractional seconds"
    note: "December rolls into the following January; a certificate issued 2026-12-02 is due 2027-01-31T23:59:59Z."

  - name: pet_rabies_expiry_reconciliation
    trigger: "certificate issuance, clinic freeze, clinic reopen, certificate expiry"
    algorithm: projection
    formula: |
      provisional (computed at issuance and stamped on the response):
        provisional_rabies_expires_at = certificate.expires_at
      finalized (computed on read):
        candidates = RabiesCertificate rows whose pet_id == Pet.id
                     and whose is_effective == true
                     and whose expires_at >= current logical clock
        finalized_rabies_expires_at = max(candidates.expires_at) when candidates is non-empty
                                      else null
    input_set: "Only certificates with is_effective == true are candidates; a certificate whose visit was BLOCKED by a clinic freeze is excluded even though its expires_at lies in the future."
    precision: "exact timestamps"
    variants:
      - name: provisional_at_issuance
        when: "response to POST /stores/{storeId}/vaccination-visits/{visitId}/issue-certificate"
        difference: "reads the just-issued certificate alone and never subtracts a previously effective certificate that the new issuance has superseded"
      - name: finalized_on_read
        when: "GET /stores/pets/{petId}, and any recompute triggered by a clinic freeze or reopen"
        difference: "returns null when every candidate certificate has been invalidated by a clinic freeze, so a frozen clinic reports a pet with no effective rabies protection while the issuance response still reports a future expiry"

  - name: encounter_charge_reconciliation
    trigger: "examination completion, pharmacy dispense, authorization revocation"
    algorithm: chronological
    formula: |
      provisional (computed when the encounter COMPLETED):
        provisional_charge_total_cents = EXAM_CHARGE_CENTS
          + sum(price_at_authorization_cents for PrescriptionAuthorization rows of the encounter
                whose status IN {AUTHORIZED, PARTIALLY_DISPENSED})
      finalized (computed on read):
        finalized_charge_total_cents = EXAM_CHARGE_CENTS
          + sum(price_at_authorization_cents for PrescriptionAuthorization rows of the encounter
                whose status IN {AUTHORIZED, PARTIALLY_DISPENSED})
          + sum(ROUND_HALF_UP(PrescriptionAuthorization.unit_price_cents * PharmacyOrder.requested_quantity, 2)
                for PharmacyOrder rows of the encounter whose status == DISPENSED)
    evaluation_order: "Pinned and non-iterative: (1) the frozen authorisation term is summed over authorizations whose status is AUTHORIZED or PARTIALLY_DISPENSED; (2) only afterwards is the dispensed term added, over pharmacy orders whose status is DISPENSED, priced at the linked authorisation's unit_price_cents. The two terms are never reconciled against each other, so a PARTIALLY_DISPENSED authorisation contributes its full frozen price-term while the pharmacy order that partially consumed it also contributes its own dispensed amount."
    input_set: "A fully DISPENSED authorization leaves the frozen term and appears only through its dispensed pharmacy order; a PARTIALLY_DISPENSED authorization stays in the frozen term AND its dispensed order appears in the dispensed term; REVOKED authorizations leave both terms."
    constants:
      EXAM_CHARGE_CENTS: 8500
    precision: "2 decimal places, round_half_up on the dispensed term only"
    variants:
      - name: provisional_at_exam_completion
        when: "the response to POST /stores/{storeId}/veterinary-encounters/{encounterId}/complete-exam"
        difference: "prices the encounter at the frozen authorization prices and ignores every dispensed pharmacy order"
      - name: finalized_on_read
        when: "GET /stores/{storeId}/veterinary-encounters/{encounterId}/charge-summary"
        difference: "adds dispensed orders at the current unit price, so an authorization whose unit_price_cents rose between authorization and dispensing raises the finalized total above the provisional total"

  - name: hospital_occupancy_posture
    trigger: "encounter creation, encounter check-in, encounter completion, encounter cancellation, explicit posture endpoints"
    algorithm: threshold
    formula: |
      hospital_occupancy = count of VeterinaryEncounter rows of the store
                           whose status IN {SCHEDULED, CHECKED_IN, IN_EXAM}
      occupied           = count of VeterinaryEncounter rows of the store
                           whose status IN {CHECKED_IN, IN_EXAM}
      ratio              = occupied / hospital_capacity
      if current posture == FROZEN: next = OPEN if occupied == 0 else FROZEN
      elif ratio >= SURGE_FREEZE_PCT: next = FROZEN
      elif ratio >= RESTRICT_FREEZE_PCT: next = RESTRICTED
      elif ratio <= HYSTERESIS_RELEASE_PCT: next = OPEN
      else: next = current posture
      Apply the transition that matches next, with that transition's declared side effects.
      The escalation path is pinned: OPEN may jump straight to FROZEN on a surge (ratio >= SURGE_FREEZE_PCT) without passing through RESTRICTED, and a FROZEN store returns to OPEN in one step
    input_set: "SCHEDULED encounters count toward hospital_occupancy but not toward occupied; COMPLETED and CANCELLED count toward neither."
    constants:
      SURGE_FREEZE_PCT: 0.90
      RESTRICT_FREEZE_PCT: 0.80
      HYSTERESIS_RELEASE_PCT: 0.70
    precision: "ratio compared as an exact rational; the thresholds are inclusive (>= and <=) at the boundary"
    note: "Anti-thrash: at capability 10 the posture escalates to RESTRICTED at 8 occupied and stays RESTRICTED at 8 occupied until it drops to 7, because 0.7 is the inclusive release boundary. A store whose hospital_capacity is 1 is escalated by a single SCHEDULED encounter, since 1/1 exceeds every threshold."

  - name: bay_window_conflict
    trigger: "POST /stores/{storeId}/service-bookings (creation) and POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay"
    algorithm: interval_merge
    formula: |
      candidate = [starts_at, ends_at)
      for each ServiceBooking row of the same bay whose status IN
            {REQUESTED, SCREENED, BAY_CONFIRMED, IN_SERVICE}:
        held = [row.starts_at, row.ends_at)
        conflict when candidate.starts_at < held.ends_at
                and held.starts_at < candidate.ends_at
      Windows that merely touch (candidate.starts_at == held.ends_at) do NOT conflict.
    input_set: "Only non-terminal bookings of the same bay occupy the calendar; COMPLETED, CANCELLED and NO_SHOW bookings are excluded."
    constants:
      TERMINAL_STATES: [COMPLETED, CANCELLED, NO_SHOW]
    precision: "second-precision timestamps; the interval is half-open, so adjacency is allowed and a one-second overlap is a conflict"
    note: "A booking may be re-confirmed onto an overlapping window only when that window strictly contains its own currently held window."

  - name: pet_temporal_overlap_guard
    trigger: "POST /stores/{storeId}/service-bookings (creation) and POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay"
    algorithm: interval_merge
    formula: |
      candidate = [starts_at - PET_BUFFER_MINUTES, ends_at + PET_BUFFER_MINUTES]
      for each ServiceBooking row whose pet_id == the candidate pet and whose bay_id != the candidate bay
            and whose status IN {REQUESTED, SCREENED, BAY_CONFIRMED, IN_SERVICE}:
        held = [row.starts_at, row.ends_at]
        conflict when candidate.starts_at < held.ends_at
                and held.starts_at < candidate.ends_at
      A pet held in two bays whose buffered windows touch at the exact minute boundary does NOT conflict.
    input_set: "Restricted to a single pet across distinct bays; the same-bay case is handled entirely by the bay window rule."
    constants:
      PET_BUFFER_MINUTES: 15
      NO_SHOW_GRACE_MINUTES: 30
    precision: "minute granularity; the interval is closed, so touching buffered windows pass and a one-minute overlap fails"

  - name: cross_sell_credit_ledger
    trigger: "POST /stores/{storeId}/retail-cross-sells (creation) and POST /stores/{storeId}/retail-cross-sells/{crossSellId}/redeem"
    algorithm: aggregation
    formula: |
      credit_granted_cents = round_half_up(RetailCrossSell.gross_cents * CROSS_SELL_CREDIT_RATE, 2)
      Store.cross_sell_credit_balance_cents =
          sum(credit_granted_cents over RetailCrossSell rows of the store with status IN {PENDING, REDEEMED})
        - sum(credit_redeemed_cents over RetailCrossSell rows of the store with status == REDEEMED)
      Conservation C1: for every store, the balance equals cumulative granted minus cumulative redeemed,
      and a grant immediately followed by its redemption leaves the balance at its pre-grant value.
    input_set: "EXPIRED cross-sells are excluded from the granted term and therefore from the balance."
    constants:
      CROSS_SELL_CREDIT_RATE: 0.10
    precision: "2 decimal places, round_half_up per cross-sell before summing"

  - name: outstanding_balance_ledger
    trigger: "POST /stores/{storeId}/members/{memberId}/service-packages (creation) and POST /stores/{storeId}/members/{memberId}/service-packages/{packageId}/billing-cycles (cycle advance)"
    algorithm: aggregation
    formula: |
      package_total_price_cents = round_half_up(monthly_fee_cents * (1 + state_sales_tax_rate), 2)
                                 * billing_cycle_count
      Member.outstanding_balance_cents =
          sum(package_total_price_cents over ServicePackage rows of the member
              whose status != CANCELLED)
        - sum(cycle_total_cents over PackageBillingCycle rows of those packages
              whose status == BILLED)
      Conservation C2: for any member, outstanding_balance_cents ==
          sum(total_price_cents) - sum(cycle_total_cents over BILLED cycles), and voids never reduce it.
    input_set: "PENDING, FAILED and VOID cycles contribute 0 to the subtracted term."
    precision: "2 decimal places, round_half_up; the monthly total is rounded before the cycle count multiplies it"
    note: "Rounding the monthly total before multiplying by billing_cycle_count is load-bearing: rounding the product afterwards yields a different cent figure for 6- and 12-cycle packages."

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The acting role must be permitted for this operation per §1.7; role membership is checked before every existence check"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Every path identifier must resolve, validated left-to-right (storeId, then memberId, then petId/bookingId/encounterId/packageId)"
    error_id: "ERR_STORE_NOT_FOUND / ERR_MEMBER_NOT_FOUND / ERR_PET_NOT_FOUND / ERR_SERVICE_BAY_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_ENCOUNTER_NOT_FOUND / ERR_CLINIC_NOT_FOUND / ERR_VISIT_NOT_FOUND / ERR_AUTHORIZATION_NOT_FOUND / ERR_PHARMACY_ORDER_NOT_FOUND / ERR_INCIDENT_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_CYCLE_NOT_FOUND / ERR_ENROLLMENT_NOT_FOUND / ERR_CROSS_SELL_NOT_FOUND / ERR_BREED_RULE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying one or more path identifiers"

  - priority: 4
    category: state
    check: "Hospital-partition mutations require the parent Store.hospital_posture != FROZEN; a hospital booking may additionally be created exactly one occupancy slot above capacity and no more"
    error_id: ERR_STORE_HOSPITAL_FROZEN
    http_status: 409
    applies_to: "POST /stores/{storeId}/service-bookings, POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay, POST /stores/{storeId}/service-bookings/{bookingId}/start-service, POST /stores/{storeId}/veterinary-encounters, POST /stores/{storeId}/veterinary-encounters/{encounterId}/check-in, POST /stores/{storeId}/vaccination-clinics/{clinicId}/open-walk-ins, POST /stores/{storeId}/training-enrollments/{enrollmentId}/begin-course"

  - priority: 5
    category: state
    check: "The target resource must be in the state its transition or action requires"
    error_id: "ERR_BOOKING_NOT_SCREENABLE / ERR_BOOKING_NOT_SCREENED / ERR_BOOKING_NOT_CONFIRMED / ERR_BOOKING_NOT_IN_SERVICE / ERR_BOOKING_NOT_CANCELLABLE / ERR_BOOKING_NOT_GROOMING / ERR_ENCOUNTER_NOT_CHECKED_IN / ERR_ENCOUNTER_NOT_IN_EXAM / ERR_ENCOUNTER_NOT_CANCELLABLE / ERR_CLINIC_NOT_OPEN / ERR_CLINIC_STORE_NOT_OPEN / ERR_CLINIC_HAS_OPEN_VISITS / ERR_VISIT_NOT_REPORTABLE / ERR_VISIT_ALREADY_REPORTED / ERR_VISIT_NOT_RABIES / ERR_AUTHORIZATION_NOT_ACTIVE / ERR_PHARMACY_ORDER_NOT_AUTHORIZED / ERR_INCIDENT_NOT_REVIEWABLE / ERR_INCIDENT_NOT_UNDER_REVIEW / ERR_INCIDENT_NOT_DENIABLE / ERR_INCIDENT_BOOKING_TYPE_MISMATCH / ERR_PACKAGE_NOT_ACTIVE / ERR_PACKAGE_NOT_PAUSED / ERR_ENROLLMENT_NOT_RESTRICTED / ERR_ENROLLMENT_NOT_IN_PROGRESS / ERR_COURSES_ALREADY_COMPLETE / ERR_BAY_NOT_ACTIVE / ERR_BAY_HAS_ACTIVE_BOOKINGS / ERR_STORE_NOT_RESTRICTED / ERR_MEMBER_SUSPENDED / ERR_PET_ARCHIVED / ERR_ILLEGAL_STATE_TRANSITION"
    http_status: 409
    applies_to: "every state-transition and action endpoint"

  - priority: 6
    category: temporal
    check: "No mutating endpoint may be driven from a logical clock earlier than the clock value already used to create the target resource; a rewound clock makes the call fail instead of backdating history"
    error_id: ERR_BACKDATED_ACTION
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 7
    category: business_safety
    check: "A walk-in clinic must be staffed: coverage_required true demands a non-empty coverage_provider before the clinic may open, and a clinic may only be opened on its own clinic_date"
    error_id: ERR_CLINIC_COVERAGE_REQUIRED
    http_status: 400
    applies_to: "POST /stores/{storeId}/vaccination-clinics/{clinicId}/open-walk-ins"

  - priority: 8
    category: business_safety
    check: "A grooming booking whose screening_score is at or above 70 may only be bay-confirmed when aggression_acknowledged is true"
    error_id: ERR_HIGH_RISK_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay"

  - priority: 9
    category: business_safety
    check: "Temporal occupancy on two different resource types: no two non-terminal bookings may hold overlapping half-open windows on the same bay, and no two walk-in clinics of one store may hold overlapping open_time..close_time windows on the same clinic_date"
    error_id: "ERR_BAY_SLOT_CONFLICT / ERR_CLINIC_OVERLAP"
    http_status: 409
    applies_to: "POST /stores/{storeId}/service-bookings, POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay, POST /stores/{storeId}/vaccination-clinics"

  - priority: 10
    category: business_safety
    check: "Cross-bay temporal guard: one pet may not hold buffered windows (15 minutes either side) in two different bays at once"
    error_id: ERR_PET_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /stores/{storeId}/service-bookings, POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay"

  - priority: 11
    category: capacity
    check: "The store hospital may not exceed hospital_capacity: a check-in that would push occupied encounters beyond capacity is refused, and a posture escalation requires occupancy at or above capacity"
    error_id: ERR_HOSPITAL_AT_CAPACITY
    http_status: 409
    applies_to: "POST /stores/{storeId}/veterinary-encounters/{encounterId}/check-in, POST /stores/{storeId}/restrict, POST /stores/{storeId}/reopen-hospital"

  - priority: 12
    category: capacity
    check: "While a pharmacy hold is active, a new encounter may not be created and no new pharmacy order may be authorized; orders that already exist move to HOLDING rather than being rejected"
    error_id: "ERR_ENCOUNTER_BLOCKED_PHARMACY_HOLD / ERR_PHARMACY_HOLD_ACTIVE"
    http_status: 409
    applies_to: "POST /stores/{storeId}/veterinary-encounters, POST /stores/{storeId}/veterinary-encounters/{encounterId}/check-in, POST /stores/{storeId}/pharmacy-orders, POST /stores/{storeId}/pharmacy-orders/{orderId}/dispense"

  - priority: 13
    category: business_referential
    check: "A pet referenced by a member-scoped or hospital-scoped resource must belong to the member or pet named by that resource"
    error_id: "ERR_PET_MEMBER_MISMATCH / ERR_AUTHORIZATION_PET_MISMATCH / ERR_BOOKING_PET_MISMATCH / ERR_VISIT_CLINIC_MISMATCH / ERR_MEMBER_HOME_STORE_MISMATCH"
    http_status: 409
    applies_to: "POST /stores/members, POST /stores/pets, POST /stores/{storeId}/service-bookings, POST /stores/{storeId}/vaccination-visits, POST /stores/{storeId}/prescription-authorizations, POST /stores/{storeId}/pharmacy-orders"

  - priority: 14
    category: business_referential
    check: "A prescription may only be raised from an encounter whose pet is the prescribed pet, and the encounter must have reached IN_EXAM or beyond before the prescription can be authorized"
    error_id: ERR_UNDERLYING_EXAM_REQUIRED
    http_status: 409
    applies_to: "POST /stores/{storeId}/prescription-authorizations"

  - priority: 15
    category: business_safety
    check: "Grooming is refused for a breed whose BreedHandlingRule.allowed_for_grooming is false"
    error_id: ERR_BREED_NOT_GROOMABLE
    http_status: 422
    applies_to: "POST /stores/{storeId}/service-bookings, POST /stores/{storeId}/service-bookings/{bookingId}/confirm-bay"

  - priority: 16
    category: business_fiscal
    check: "A pharmacy handoff may not exceed the authorizing prescription's quantity"
    error_id: ERR_QUANTITY_EXCEEDS_AUTHORIZATION
    http_status: 402
    applies_to: "POST /stores/{storeId}/pharmacy-orders, POST /stores/{storeId}/pharmacy-orders/{orderId}/dispense"

  - priority: 17
    category: business_fiscal
    check: "An incident claim above the store state's claim cap requires an explicit override_reason"
    error_id: ERR_CLAIM_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /stores/{storeId}/incident-records/{incidentId}/approve-claim"

  - priority: 18
    category: business_temporal
    check: "A walk-in visit may only have a certificate issued while the logical clock lies inside the clinic's own open_time..close_time window AND the walk-in instant is not on a Saturday or Sunday; both conditions are required, the weekend rule is the tighter one, and its violation is reported with the weekday error rather than the window error"
    error_id: "ERR_VISIT_OUTSIDE_WINDOW / ERR_VISIT_WEEKEND_BLOCKED"
    http_status: 422
    applies_to: "POST /stores/{storeId}/vaccination-visits/{visitId}/issue-certificate"

  - priority: 19
    category: business_temporal
    check: "A prior rabies vaccination date used to justify a booster must be strictly before the issuing clinic's date"
    error_id: ERR_PRIOR_VACCINATION_NOT_PRIOR
    http_status: 422
    applies_to: "POST /stores/{storeId}/vaccination-visits/{visitId}/issue-certificate"

  - priority: 20
    category: business_temporal
    check: "A booking's ends_at must be strictly after its starts_at, and a clinic's close_time must be strictly after its open_time"
    error_id: "ERR_BOOKING_END_NOT_AFTER_START / ERR_CLINIC_WINDOW_INVALID"
    http_status: 400
    applies_to: "POST /stores/{storeId}/service-bookings, POST /stores/{storeId}/vaccination-clinics"

  - priority: 21
    category: business_constraint
    check: "Declared uniqueness: store_code, member email, bay_code within a store, breed within a species, certificate serial globally, and at most one ACTIVE package per member per tier"
    error_id: "ERR_STORE_CODE_DUPLICATE / ERR_MEMBER_EMAIL_DUPLICATE / ERR_BAY_CODE_DUPLICATE / ERR_BREED_RULE_DUPLICATE / ERR_CERTIFICATE_SERIAL_DUPLICATE / ERR_PACKAGE_ALREADY_ACTIVE"
    http_status: 409
    applies_to: "POST /stores, POST /stores/members, POST /stores/{storeId}/service-bays, POST /breed-handling-rules, POST /stores/{storeId}/members/{memberId}/service-packages"

  - priority: 22
    category: business_constraint
    check: "Every mutating call against a parent that carries a version must supply expected_<parent>_version"
    error_id: ERR_MISSING_EXPECTED_VERSION
    http_status: 400
    applies_to: "every endpoint declaring an expected_*_version input"

  - priority: 23
    category: concurrency
    check: "expected_<parent>_version must equal the parent row's current version, or the write is refused as stale"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "every endpoint declaring an expected_*_version input"

  - priority: 24
    category: business_constraint
    check: "A request's declared input types and enum members must be valid; unknown fields and out-of-range integers are refused"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  - method: POST
    path: "/stores"
    description: "Create a pet care center; hospital_posture starts OPEN and every derived counter starts at 0"
    roles: [PlatformAdmin]
    code: 201
    input: [store_code, city, state_code, service_bay_count, hospital_capacity]
    output: Store
    side_effects: ["hospital_posture=OPEN", "hospital_occupancy=0", "frozen_vaccination_clinics=0", "restricted_training_slots_pending=0", "stores_held_total=0", "cross_sell_credit_balance_cents=0", "incident_risk_index=0"]
  - method: GET
    path: "/stores"
    description: "List stores, optionally filtered by state_code"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "state_code?"]
    output: "Store[]"
    side_effects: []
  - method: GET
    path: "/stores/{storeId}"
    description: "Read one store with its derived posture and counters"
    roles: [Any]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: POST
    path: "/stores/{storeId}/restrict"
    description: "Escalate a store from OPEN to RESTRICTED; freezes its bays and its open walk-in clinics"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_store_version]
    output: Store
    side_effects: ["hospital_posture -> RESTRICTED", "ServiceBay rows of this store -> FROZEN", "VaccinationClinic rows in OPEN -> FROZEN", "VaccinationVisit rows of those clinics -> BLOCKED", "RabiesCertificate rows of those visits: is_effective -> false", "Pet.rabies_vaccination_expires_at recomputed for the affected pets", "increments Store.version by 1"]
  - method: POST
    path: "/stores/{storeId}/lift-posture-restriction"
    description: "Return a RESTRICTED store to OPEN once occupancy has fallen back below capacity"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_store_version]
    output: Store
    side_effects: ["hospital_posture -> OPEN", "ServiceBay rows in FROZEN -> ACTIVE", "VaccinationClinic rows in FROZEN whose clinic_date is not in the past -> SCHEDULED", "VaccinationVisit rows in BLOCKED -> REGISTERED", "increments Store.version by 1"]
  - method: POST
    path: "/stores/{storeId}/freeze-hospital"
    description: "Escalate a RESTRICTED store to FROZEN; holds the pharmacy and blocks every hospital mutation"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_store_version]
    output: Store
    side_effects: ["hospital_posture -> FROZEN", "ServiceBay rows -> FROZEN", "VaccinationClinic rows in {SCHEDULED, OPEN} -> FROZEN", "VaccinationVisit rows -> BLOCKED", "RabiesCertificate rows: is_effective -> false", "Pet.rabies_vaccination_expires_at recomputed", "PharmacyOrder rows not terminal: on_hold -> HOLDING", "pharmacy_hold_until = logical clock + 72 hours", "increments Store.version by 1"]
  - method: POST
    path: "/stores/{storeId}/reopen-hospital"
    description: "Return a FROZEN store to OPEN; releases the pharmacy hold and recovers bays and clinics"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_store_version]
    output: Store
    side_effects: ["hospital_posture -> OPEN", "ServiceBay rows in FROZEN -> ACTIVE", "VaccinationClinic rows in FROZEN -> SCHEDULED", "VaccinationVisit rows in BLOCKED -> REGISTERED", "RabiesCertificate rows with a future expires_at: is_effective -> true", "Pet.rabies_vaccination_expires_at recomputed", "PharmacyOrder rows with on_hold HOLDING -> on_hold NONE and status REQUESTED", "pharmacy_hold_until cleared to null", "increments Store.version by 1"]
  - method: POST
