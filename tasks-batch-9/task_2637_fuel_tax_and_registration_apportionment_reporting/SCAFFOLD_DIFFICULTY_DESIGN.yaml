# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2637 — Fuel Tax and Registration Apportionment Reporting
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Nine rule_id blocks,
# two differentiated instances each (18 total). Every numeric assert literal was
# computed by executing the referenced §1.3 formula with Decimal + ROUND_HALF_UP.
# ===========================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: preparer_versus_audit_basis_quarterly_settlement_divergence
        grounds:
          - calculations.quarterly_fuel_tax_settlement
          - calculations.reconstructed_mileage_penalty
          - state_machines.FuelTaxReturn.FILED_to_AUDIT_ADJUSTED
          - state_machines.AuditSelection.SELECTED_to_RETENTION_REVIEWED
          - entities.FuelTaxReturn.fields.audit_assessment_delta
          - entities.FuelTaxReturn.fields.settlement_basis
        distinguishing_aspect: |
          This dual variant lives in the tax-settlement domain on FuelTaxReturn: identical
          trip and fuel data settle to total_amount_due 118.60 under PREPARER_BASIS and
          117.50 under AUDIT_BASIS, because uplifting the reconstructed trip's legs by
          1.100 raises total_fleet_miles 2100.0 -> 2160.0 and therefore fleet_mpg
          7.37 -> 7.58, and the mileage gain and the MPG loss do not cancel.
        test_recipe:
          setup:
            - "Jurisdictions IL (tax 0.6270, no surcharge), IN (0.3300, surcharge 0.5500), KY (0.2460, surcharge 0.0440) declared."
            - "Carrier c1 based in IL with bond_ceiling_amount 5000.00 and one power unit U-101 for registration_year 2026."
            - "Q2-2026 mileage: T1 700.0 mi (IL 300.0 / IN 200.0 / KY 200.0) ACCEPTED telematics; T2 800.0 mi (IL 400.0 / IN 250.0 / KY 150.0) ACCEPTED telematics; T3 500.0 mi with a 100.0 mi odometer gap, reconstructed to IL 250.0 / KY 350.0 and ACCEPTED; T4 700.0 mi left GAP_FLAGGED so the carrier's unsubstantiated_mileage_ratio is 0.2593."
            - "Q2-2026 tax-paid fuel: IL 175.000, IN 80.000, KY 30.000 gallons, all receipted and ACCEPTED (285.000 total)."
            - "The Q2-2026 return is prepared (fleet_mpg 7.37, total_amount_due 118.60) and FILED, then scored for audit selection (risk_score 77 -> SELECTED)."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "KY", name: "Kentucky", fuel_tax_rate_per_gallon: 0.2460, surcharge_rate_per_gallon: 0.0440, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Line Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L100101", weight_group_code: "W80", factory_price_amount: 165000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-10T06:00:00Z", trip_end_utc: "2026-04-10T18:00:00Z", start_odometer: 100000.0, end_odometer: 100700.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }, { jurisdiction_code: "IN", leg_miles: 200.0 }, { jurisdiction_code: "KY", leg_miles: 200.0 }] }
              as: MileageAnalyst
              captures: { t1_id: $.data.id }
            - call: "POST /apportionment/trip-records/${t1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-05-05T06:00:00Z", trip_end_utc: "2026-05-05T20:00:00Z", start_odometer: 100700.0, end_odometer: 101500.0, legs: [{ jurisdiction_code: "IL", leg_miles: 400.0 }, { jurisdiction_code: "IN", leg_miles: 250.0 }, { jurisdiction_code: "KY", leg_miles: 150.0 }] }
              as: MileageAnalyst
              captures: { t2_id: $.data.id }
            - call: "POST /apportionment/trip-records/${t2_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-06-02T06:00:00Z", trip_end_utc: "2026-06-02T16:00:00Z", start_odometer: 101600.0, end_odometer: 102100.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }, { jurisdiction_code: "KY", leg_miles: 200.0 }] }
              as: MileageAnalyst
              captures: { t3_id: $.data.id }
            - call: "POST /apportionment/trip-records/${t3_id}/reconstruct"
              payload: { reconstructed_legs: [{ jurisdiction_code: "IL", leg_miles: 250.0 }, { jurisdiction_code: "KY", leg_miles: 350.0 }], supporting_document_reference: "RECON-2026-06-02-A" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /apportionment/trip-records/${t3_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-06-20T06:00:00Z", trip_end_utc: "2026-06-20T18:00:00Z", start_odometer: 102200.0, end_odometer: 102900.0, legs: [{ jurisdiction_code: "IL", leg_miles: 700.0 }] }
              as: MileageAnalyst
              captures: { t4_id: $.data.id }
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", jurisdiction_code: "IL", purchase_date: "2026-04-11", gallons: 175.000, tax_paid_flag: true, receipt_reference: "RCPT-IL-0411" }
              as: MileageAnalyst
              captures: { p1_id: $.data.id }
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", jurisdiction_code: "IN", purchase_date: "2026-05-06", gallons: 80.000, tax_paid_flag: true, receipt_reference: "RCPT-IN-0506" }
              as: MileageAnalyst
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", jurisdiction_code: "KY", purchase_date: "2026-06-03", gallons: 30.000, tax_paid_flag: true, receipt_reference: "RCPT-KY-0603" }
              as: MileageAnalyst
            - call: "POST /apportionment/fuel-tax-returns"
              payload: { carrier_id: "${c1_id}", filing_year: 2026, filing_quarter: 2 }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { r1_id: $.data.id }
            - call: "GET /apportionment/carriers/${c1_id}"
              payload: {}
              as: TaxPreparer
              captures: { c1_v: $.data.version }
            - call: "POST /apportionment/fuel-tax-returns/${r1_id}/prepare"
              payload: { expected_carrier_version: "${c1_v}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { r1_filed_due: $.data.total_amount_due }
            - call: "POST /apportionment/fuel-tax-returns/${r1_id}/review"
              payload: { decision: "FILE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/audit-selections"
              payload: { carrier_id: "${c1_id}", selection_year: 2026, selection_quarter: 2, late_filing_count: 0, retention_deficiency_count: 4 }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { a1_id: $.data.id, a1_score: $.data.risk_score }
          trigger:
            - call: "POST /apportionment/audit-selections/${a1_id}/retention-review"
              payload: { expected_records_count: 20, records_missing_count: 5 }
              as: ComplianceOfficer
              as_user_id: "officer-2"
          assert:
            - "AuditSelection.${a1_id}.risk_score == 77"
            - "AuditSelection.${a1_id}.retention_deficiency_ratio == 0.2500"
            - "AuditSelection.${a1_id}.post_review_risk_score == 85"
            - "AuditSelection.${a1_id}.selection_status == RETENTION_REVIEWED"
            - "Carrier.${c1_id}.ifta_license_status == ACTIVE (post_review_risk_score 85 < LICENSE_SUSPENSION_THRESHOLD 90)"
            - "FuelTaxReturn.${r1_id}.settlement_basis == AUDIT_BASIS"
            - "FuelTaxReturn.${r1_id}.return_status == AUDIT_ADJUSTED"
            - "FuelTaxReturn.${r1_id}.total_fleet_miles == 2160.0"
            - "FuelTaxReturn.${r1_id}.fleet_mpg == 7.58"
            - "FuelTaxReturn.${r1_id}.total_net_tax_due == 17.50"
            - "FuelTaxReturn.${r1_id}.reconstruction_penalty_amount == 100.00"
            - "FuelTaxReturn.${r1_id}.total_amount_due == 117.50"
            - "FuelTaxReturn.${r1_id}.audit_assessment_delta == -1.10"
            - "GET /apportionment/fuel-tax-returns/${r1_id}/jurisdiction-lines?line_status=ACTIVE returns 3 lines with net_tax_amount IL == -29.08, IN == 25.84, KY == 20.74"
            - "GET /apportionment/fuel-tax-returns/${r1_id}/jurisdiction-lines?line_status=VOIDED returns the 3 PREPARER_BASIS lines with net_tax_amount IL == -28.90, IN == 27.33, KY == 20.17"

      - name: actual_versus_estimated_distance_basis_registration_fee_divergence
        grounds:
          - calculations.apportioned_registration_fee
          - state_machines.RegistrationApplication.SUBMITTED_to_INVOICED
          - entities.RegistrationApplication.fields.distance_basis
          - entities.DistanceScheduleLine.fields.apportion_percent
          - entities.WeightGroupFee.fields.annual_fee_amount
        distinguishing_aspect: |
          This dual variant lives in a different entity domain — apportioned registration
          fees on RegistrationApplication, not tax settlement on FuelTaxReturn: the same
          reported schedule IL 60000.0 / IN 25000.0 / KY 15000.0 yields base_fee_total
          4617.00 on ACTUAL_DISTANCE_BASIS and 4531.42 on ESTIMATED_DISTANCE_BASIS,
          because the 20000.0-mile chart floor lifts only KY and so re-mixes every
          jurisdiction's apportion_percent (KY 0.150000 -> 0.190476).
        test_recipe:
          setup:
            - "Jurisdictions IL, IN, KY declared; the W80 fee chart publishes IL 2790.00, IN 1692.00, KY 1410.00."
            - "Carrier cA (actual basis) and carrier cB (estimated basis), each with two W80 power units for registration_year 2026, so apportioned_vehicle_count is 2 on both applications."
            - "Both applications carry the identical reported schedule IL 60000.0, IN 25000.0, KY 15000.0 and are SUBMITTED."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "KY", name: "Kentucky", fuel_tax_rate_per_gallon: 0.2460, surcharge_rate_per_gallon: 0.0440, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/weight-group-fees"
              payload: { jurisdiction_code: "IL", weight_group_code: "W80", declared_weight_lbs: 80000, annual_fee_amount: 2790.00 }
              as: ComplianceOfficer
            - call: "POST /apportionment/weight-group-fees"
              payload: { jurisdiction_code: "IN", weight_group_code: "W80", declared_weight_lbs: 80000, annual_fee_amount: 1692.00 }
              as: ComplianceOfficer
            - call: "POST /apportionment/weight-group-fees"
              payload: { jurisdiction_code: "KY", weight_group_code: "W80", declared_weight_lbs: 80000, annual_fee_amount: 1410.00 }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Actual Basis Carriage Inc", usdot_number: "USDOT-2637010", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { ca_id: $.data.id }
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Estimated Basis Carriage Inc", usdot_number: "USDOT-2637011", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { cb_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${ca_id}", unit_number: "A-1", vin: "1FUJA6CK21L200001", weight_group_code: "W80", factory_price_amount: 160000.00, registration_year: 2026 }
              as: ComplianceOfficer
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${ca_id}", unit_number: "A-2", vin: "1FUJA6CK21L200002", weight_group_code: "W80", factory_price_amount: 160000.00, registration_year: 2026 }
              as: ComplianceOfficer
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${cb_id}", unit_number: "B-1", vin: "1FUJA6CK21L200011", weight_group_code: "W80", factory_price_amount: 160000.00, registration_year: 2026 }
              as: ComplianceOfficer
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${cb_id}", unit_number: "B-2", vin: "1FUJA6CK21L200012", weight_group_code: "W80", factory_price_amount: 160000.00, registration_year: 2026 }
              as: ComplianceOfficer
            - call: "POST /apportionment/registration-applications"
              payload: { carrier_id: "${ca_id}", registration_year: 2026, weight_group_code: "W80", distance_basis: "ACTUAL_DISTANCE_BASIS" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { appa_id: $.data.id }
            - call: "POST /apportionment/registration-applications"
              payload: { carrier_id: "${cb_id}", registration_year: 2026, weight_group_code: "W80", distance_basis: "ESTIMATED_DISTANCE_BASIS" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { appb_id: $.data.id }
            - call: "POST /apportionment/registration-applications/${appa_id}/distance-schedule"
              payload: { jurisdiction_code: "IL", reported_distance_miles: 60000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appa_id}/distance-schedule"
              payload: { jurisdiction_code: "IN", reported_distance_miles: 25000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appa_id}/distance-schedule"
              payload: { jurisdiction_code: "KY", reported_distance_miles: 15000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appb_id}/distance-schedule"
              payload: { jurisdiction_code: "IL", reported_distance_miles: 60000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appb_id}/distance-schedule"
              payload: { jurisdiction_code: "IN", reported_distance_miles: 25000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appb_id}/distance-schedule"
              payload: { jurisdiction_code: "KY", reported_distance_miles: 15000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appa_id}/submit"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/registration-applications/${appb_id}/submit"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
          trigger:
            - call: "POST /apportionment/registration-applications/${appa_id}/review"
              payload: { decision: "INVOICE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/registration-applications/${appb_id}/review"
              payload: { decision: "INVOICE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "RegistrationApplication.${appa_id}.fleet_total_distance_miles == 100000.0"
            - "RegistrationApplication.${appa_id}.base_fee_total == 4617.00"
            - "RegistrationApplication.${appa_id}.total_apportioned_fee == 4617.00"
            - "RegistrationApplication.${appb_id}.fleet_total_distance_miles == 105000.0"
            - "RegistrationApplication.${appb_id}.base_fee_total == 4531.42"
            - "RegistrationApplication.${appb_id}.total_apportioned_fee == 4531.42"
            - "GET /apportionment/registration-applications/${appa_id}/distance-schedule returns effective_distance_miles IL 60000.0 / IN 25000.0 / KY 15000.0, apportion_percent IL 0.600000 / IN 0.250000 / KY 0.150000, jurisdiction_fee_amount IL 3348.00 / IN 846.00 / KY 423.00"
            - "GET /apportionment/registration-applications/${appb_id}/distance-schedule returns effective_distance_miles IL 60000.0 / IN 25000.0 / KY 20000.0, apportion_percent IL 0.571429 / IN 0.238095 / KY 0.190476, jurisdiction_fee_amount IL 3188.57 / IN 805.71 / KY 537.14"
            - "RegistrationApplication.${appa_id}.base_fee_total - RegistrationApplication.${appb_id}.base_fee_total == 85.58"

  - rule_id: combinatorial_formula
    instances:
      - name: net_tax_total_rounds_each_jurisdiction_line_before_summing
        combination_mode: b
        grounds:
          - calculations.quarterly_fuel_tax_settlement
          - calculations.tax_paid_gallons_by_jurisdiction
          - entities.ReturnJurisdictionLine.fields.net_tax_amount
          - entities.FuelTaxReturn.fields.total_net_tax_due
        distinguishing_aspect: |
          Mode b — order of operations. Three factors combine (taxable_gallons derived from an
          already-2dp fleet_mpg, a netted base tax, and a never-netted surcharge), and the pinned
          order is: round fleet_mpg to 2dp, round each jurisdiction's net_tax_amount to 2dp, then
          sum the already-rounded lines. With IL 175.000 / IN 80.000 / KY 30.000 gallons that
          yields total_net_tax_due 18.60, whereas summing the unrounded per-line amounts and
          rounding once at the end yields 18.59. The one-cent gap is only visible because the
          fixture was chosen so the residues do not cancel.
        test_recipe:
          setup:
            - "Jurisdictions IL (0.6270, no surcharge), IN (0.3300, surcharge 0.5500), KY (0.2460, surcharge 0.0440)."
            - "Carrier c1 based in IL with one power unit; Q2-2026 mileage IL 950.0 / IN 450.0 / KY 700.0 across three ACCEPTED trips (2100.0 total, one of them a reconstruction) plus one GAP_FLAGGED trip that is excluded from the settlement."
            - "Q2-2026 tax-paid gallons IL 175.000 / IN 80.000 / KY 30.000 (285.000 total)."
            - "A DRAFT Q2-2026 return exists and the carrier's current version has been read."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "KY", name: "Kentucky", fuel_tax_rate_per_gallon: 0.2460, surcharge_rate_per_gallon: 0.0440, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Rounding Order Transport LLC", usdot_number: "USDOT-2637020", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { c2_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c2_id}", unit_number: "U-201", vin: "1FUJA6CK21L300201", weight_group_code: "W80", factory_price_amount: 158000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { v2_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c2_id}", vehicle_id: "${v2_id}", trip_start_utc: "2026-04-10T06:00:00Z", trip_end_utc: "2026-04-10T18:00:00Z", start_odometer: 100000.0, end_odometer: 100700.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }, { jurisdiction_code: "IN", leg_miles: 200.0 }, { jurisdiction_code: "KY", leg_miles: 200.0 }] }
              as: MileageAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /apportionment/trip-records/${s1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c2_id}", vehicle_id: "${v2_id}", trip_start_utc: "2026-05-05T06:00:00Z", trip_end_utc: "2026-05-05T20:00:00Z", start_odometer: 100700.0, end_odometer: 101500.0, legs: [{ jurisdiction_code: "IL", leg_miles: 400.0 }, { jurisdiction_code: "IN", leg_miles: 250.0 }, { jurisdiction_code: "KY", leg_miles: 150.0 }] }
              as: MileageAnalyst
              captures: { s2_id: $.data.id }
            - call: "POST /apportionment/trip-records/${s2_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c2_id}", vehicle_id: "${v2_id}", trip_start_utc: "2026-06-02T06:00:00Z", trip_end_utc: "2026-06-02T16:00:00Z", start_odometer: 101600.0, end_odometer: 102100.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }, { jurisdiction_code: "KY", leg_miles: 200.0 }] }
              as: MileageAnalyst
              captures: { s3_id: $.data.id }
            - call: "POST /apportionment/trip-records/${s3_id}/reconstruct"
              payload: { reconstructed_legs: [{ jurisdiction_code: "IL", leg_miles: 250.0 }, { jurisdiction_code: "KY", leg_miles: 350.0 }], supporting_document_reference: "RECON-2026-06-02-B" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
