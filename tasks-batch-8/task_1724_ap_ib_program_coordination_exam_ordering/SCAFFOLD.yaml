# =============================================================================
# PRD Benchmark Seed Tables
# Task: AP/IB Program Coordination & Exam Ordering
# =============================================================================

scenario: |
  AP/IB Program Coordination & Exam Ordering (high school AP coordinator): course
  roster & exam registration deadline, exam order/late fee & unused-exam penalty,
  fee reduction eligibility & subsidy application, testing room/proctor assignment
  & accommodations, exam-day irregularity report, score release & credit posting to
  transcripts, teacher training/authorization requirement, program growth & equity
  access reporting

domain_name: ap-ib-exam-coordination
api_prefix: ""

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_band: Expert
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency        # OCC on ExamOrder.version for draft-order edits
    - cascading_side_effects        # clock-sweep expiry → course → session → proctor chain
    - dual_variant_calculation      # order invoice estimate/final; student balance provisional/projected
    - derived_field_reconciliation  # seats_reserved, balances, rebate, authorized_teacher_count recomputed on every mutation
  entity_topology: flat             # all entities are peers linked by FK; no nested CRUD paths
  state_machine_shape: cyclic       # TeacherAuthorization and FeeReductionApplication loop; ExamRegistration carries parallel dimensions
  relationship_patterns:
    - one_to_many                   # Cycle→Course→Registration, Session→ProctorAssignment/IrregularityReport
    - cross_aggregate               # TeacherAuthorization bridges Teacher×Course; Registration bridges Student×Course×Cycle
  role_model: peer_roles            # Student / Teacher / ApCoordinator / Registrar own distinct resource types
  consistency_model: immediate      # every mutation is atomic and visible in its own response
  entity_count: 11
  endpoint_count: 48
  error_code_count: 27
  calculation_count: 7
  state_machine_count: 9

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ExamCycle
    parent: null
    common_fields: true
    description: "One exam administration year (e.g. 2027 AP/IB). Configuration root: deadlines, fee constants, budget cap, rebate rate."
    fields:
      - { name: name, type: string, source: input, description: "Human label, e.g. '2027 Spring AP/IB'" }
      - { name: status, type: enum, source: system, description: "SETUP | OPEN", constraints: "initial SETUP; SETUP→OPEN via open action; no terminal state" }
      - { name: registration_deadline_at, type: datetime, source: input, description: "Registrations created strictly after this instant are late" }
      - { name: order_deadline_at, type: datetime, source: input, description: "Orders submitted strictly after this instant are billed the per-exam late fee" }
      - { name: score_release_at, type: datetime, source: input, description: "Scores may not be released before this instant" }
      - { name: exam_window_start_at, type: datetime, source: input, description: "Sessions must start at or after this instant" }
      - { name: exam_window_end_at, type: datetime, source: input, description: "Sessions must end at or before this instant" }
      - { name: late_fee_cents, type: integer, source: input, description: "Late fee per exam, applied to student bill (late registration) AND per ordered exam (late order submission)", constraints: ">= 0" }
      - { name: unused_exam_penalty_cents, type: integer, source: input, description: "Penalty per ordered-but-unused exam, assessed at order reconcile", constraints: ">= 0" }
      - { name: fee_reduction_cents, type: integer, source: input, description: "Per-exam subsidy for students with an APPROVED FeeReductionApplication", constraints: ">= 0" }
      - { name: budget_cap_cents, type: integer, source: input, description: "School exam budget; order submit rejects when estimate exceeds it", constraints: ">= 0" }
      - { name: rebate_rate_bp, type: integer, source: input, description: "School rebate rate in basis points (900 = 9%) applied per registration net fee", constraints: "0..10000" }
      - { name: registered_exam_count, type: integer, source: computed, description: "Count of ExamRegistrations in this cycle with registration_status != CANCELLED" }
      - { name: rebate_cents, type: integer, source: computed, description: "School rebate, per-registration rounding then sum (calculations.school_rebate)" }

  - name: Course
    parent: null
    common_fields: true
    description: "An AP or IB course offered in a cycle."
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ExamCycle.id; owning administration" }
      - { name: subject_code, type: string, source: input, description: "e.g. AP_CALC_BC, IB_HIST_HL" }
      - { name: program, type: enum, source: input, description: "AP | IB", constraints: "exactly one of AP, IB" }
      - { name: exam_fee_cents, type: integer, source: input, description: "Per-exam fee for this course", constraints: "> 0" }
      - { name: credit_threshold, type: integer, source: input, description: "Minimum score for transcript credit (AP typically 3 of 1..5; IB typically 4 of 1..7)", constraints: "AP: 1..5; IB: 1..7" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | SUSPENDED; derived: ACTIVE iff authorized_teacher_count >= 1, else SUSPENDED" }
      - { name: authorized_teacher_count, type: integer, source: computed, description: "Count of TeacherAuthorizations for this course with status AUTHORIZED" }
      - { name: registered_count, type: integer, source: computed, description: "Count of ExamRegistrations for this course with registration_status != CANCELLED" }

  - name: Teacher
    parent: null
    common_fields: true
    description: "Staff member; may hold course authorizations and proctor sessions."
    fields:
      - { name: full_name, type: string, source: input, description: "Teacher name" }
      - { name: email, type: string, source: input, description: "Teacher email" }

  - name: TeacherAuthorization
    parent: null
    common_fields: true
    description: "Training/authorization record for one teacher teaching one course. At most one row per (teacher_id, course_id) ever."
    fields:
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id" }
      - { name: status, type: enum, source: system, description: "PENDING_TRAINING | AUTHORIZED | EXPIRED", constraints: "initial PENDING_TRAINING; cyclic EXPIRED→AUTHORIZED via retraining" }
      - { name: training_completed_at, type: datetime, source: system, description: "Logical-clock time of latest complete-training; null until first completion" }
      - { name: authorized_until, type: datetime, source: system, description: "training_completed_at + 730 days; null until first completion; expiry sweep fires when logical clock >= this instant" }

  - name: Student
    parent: null
    common_fields: true
    description: "Enrolled student who registers for exams."
    fields:
      - { name: full_name, type: string, source: input, description: "Student name" }
      - { name: grade_level, type: integer, source: input, description: "Grade 9..12", constraints: "9..12" }
      - { name: subgroup_code, type: enum, source: input, description: "Equity reporting subgroup: GEN | FRL | IEP | ELL", constraints: "exactly one of GEN, FRL, IEP, ELL" }
      - { name: balance_cents, type: integer, source: computed, description: "Provisional balance: sum of net_fee_cents over registrations with registration_status != CANCELLED; subsidy counted only from APPROVED applications (calculations.student_balance)" }
      - { name: projected_balance_cents, type: integer, source: computed, description: "Projected balance: same as balance_cents but treating SUBMITTED fee-reduction applications as if approved (calculations.student_balance, projected variant)" }
      - { name: transcript_posted_count, type: integer, source: computed, description: "Count of this student's registrations with score_status == POSTED" }

  - name: FeeReductionApplication
    parent: null
    common_fields: true
    description: "Subsidy application for reduced exam fees. At most one row per (student_id, cycle_id) ever; denial is re-opened by resubmit on the same row."
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; must equal caller X-User-ID when role is Student" }
      - { name: cycle_id, type: string, source: input, description: "FK -> ExamCycle.id" }
      - { name: eligibility_basis, type: enum, source: input, description: "FREE_LUNCH | REDUCED_LUNCH | INCOME | OTHER" }
      - { name: annual_income_cents, type: integer, source: input, description: "Reported household income", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED", constraints: "initial SUBMITTED; DENIED→SUBMITTED via resubmit" }

  - name: ExamRegistration
    parent: null
    common_fields: true
    description: "One student sitting one course's exam in the course's cycle. Carries two parallel state dimensions: registration_status and score_status. At most one row per (student_id, course_id) with registration_status != CANCELLED."
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; must equal caller X-User-ID when role is Student" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> ExamCycle.id; copied from the course's cycle at creation" }
      - { name: accommodation_type, type: enum, source: input, description: "NONE | EXTENDED_TIME | SEPARATE_ROOM", default: NONE }
      - { name: registration_status, type: enum, source: system, description: "REGISTERED | SAT | NO_SHOW | CANCELLED", constraints: "initial REGISTERED" }
      - { name: score_status, type: enum, source: system, description: "PENDING | HELD | RELEASED | POSTED | NO_SCORE | VOID", constraints: "initial PENDING; independent parallel dimension" }
      - { name: score, type: integer, source: system, description: "Program-reported score; null until released. AP 1..5, IB 1..7 by course program" }
      - { name: is_late, type: boolean, source: computed, description: "true iff creation logical time is strictly after cycle.registration_deadline_at" }
      - { name: fee_cents, type: integer, source: system, description: "Snapshot of course.exam_fee_cents at creation" }
      - { name: late_fee_applied_cents, type: integer, source: system, description: "cycle.late_fee_cents when is_late, else 0" }
      - { name: subsidy_cents, type: integer, source: system, description: "min(cycle.fee_reduction_cents, fee_cents + late_fee_applied_cents) when the student has an APPROVED FeeReductionApplication for the cycle, else 0; recomputed on application approve/deny/resubmit and on cancel" }
      - { name: net_fee_cents, type: integer, source: computed, description: "fee_cents + late_fee_applied_cents - subsidy_cents (always >= 0 by construction)" }

  - name: ExamOrder
    parent: null
    common_fields: true
    description: "The school's exam order to the program for one cycle. At most one per cycle. OCC target: every PATCH requires expected_exam_order_version."
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ExamCycle.id; unique (one order per cycle)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LOCKED | RECONCILED", constraints: "initial DRAFT; RECONCILED terminal" }
      - { name: adjustments, type: array, source: input, description: "Manual per-course count adjustments: [{course_id, delta}]; editable via PATCH only while DRAFT" }
      - { name: lines, type: array, source: computed, description: "Per-course order lines [{course_id, ordered_count, fee_cents, late_fee_total_cents, line_total_cents}]; computed live while DRAFT, frozen at submit" }
      - { name: estimate_total_cents, type: integer, source: computed, description: "Forward-looking invoice estimate (calculations.order_invoice estimate variant); recomputed on registration/adjustment change while DRAFT; frozen at submit" }
      - { name: final_total_cents, type: integer, source: computed, description: "Chronological final invoice with unused-exam penalties (calculations.order_invoice final variant); null until RECONCILED" }
      - { name: submitted_late, type: boolean, source: system, description: "true iff submitted_at is strictly after cycle.order_deadline_at; null until submitted" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical time of submit; null until SUBMITTED" }
      - { name: locked_at, type: datetime, source: system, description: "Logical time of lock; null until LOCKED" }
      - { name: reconciled_at, type: datetime, source: system, description: "Logical time of reconcile; null until RECONCILED" }

  - name: ExamSession
    parent: null
    common_fields: true
    description: "One scheduled sitting of one course's exam in one room. At most one non-CANCELLED session per course."
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id" }
      - { name: room_name, type: string, source: input, description: "Room identifier; room temporal-overlap checks key on this exact string" }
      - { name: room_capacity, type: integer, source: input, description: "Seat capacity of the room for this sitting", constraints: "> 0" }
      - { name: room_supports_accommodations, type: boolean, source: input, description: "Whether the room can host students with accommodations", default: false }
      - { name: start_at, type: datetime, source: input, description: "Session start; must be within cycle exam window" }
      - { name: end_at, type: datetime, source: input, description: "Session end; must be strictly after start_at and within cycle exam window" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ADMINISTERED | UNDER_INVESTIGATION | INVALIDATED | CANCELLED", constraints: "initial SCHEDULED; CANCELLED and INVALIDATED terminal" }
      - { name: seats_reserved, type: integer, source: computed, description: "Count of this course's ExamRegistrations with registration_status == REGISTERED (calculations.session_seating); recomputed on registration create/cancel and on administer" }

  - name: ProctorAssignment
    parent: null
    common_fields: true
    description: "Assignment of one teacher to proctor one session. At most one ASSIGNED row per (session_id, teacher_id)."
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ExamSession.id" }
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED", constraints: "initial ASSIGNED; RELEASED terminal" }

  - name: IrregularityReport
    parent: null
    common_fields: true
    description: "Exam-day irregularity filed by the assigned proctor against a session. Multiple reports per session allowed."
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ExamSession.id" }
      - { name: proctor_teacher_id, type: string, source: system, description: "FK -> Teacher.id; set from caller X-User-ID; caller must hold an ASSIGNED ProctorAssignment on the session" }
      - { name: category, type: enum, source: input, description: "SECURITY_BREACH | TIMING_ERROR | ACCOMMODATION_VIOLATION | MISCONDUCT | MATERIALS" }
      - { name: details, type: string, source: input, description: "Free-text description of the irregularity" }
      - { name: status, type: enum, source: system, description: "FILED | RESOLVED | SCORES_CANCELLED", constraints: "initial FILED; RESOLVED and SCORES_CANCELLED terminal" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ExamCycle
    field: status
    initial_state: SETUP
    terminal_states: []
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /exam-cycles/{id}/open"
        actor: ApCoordinator
        preconditions: []
        side_effects:
          - "Registrations, orders, sessions become creatable for this cycle (they require cycle status OPEN)"

  - entity: Course
    field: status
    initial_state: SUSPENDED
    terminal_states: []
    note: "Status is derived from authorized_teacher_count; no direct setter endpoint."
    transitions:
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (TeacherAuthorization for this course transitions into AUTHORIZED, count 0→1)"
        actor: system
        preconditions: ["authorized_teacher_count transitions 0 → 1"]
        side_effects:
          - "Course becomes eligible for session creation and satisfies the order-lock teacher gate"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (expiry sweep moves the last AUTHORIZED TeacherAuthorization to EXPIRED, count 1→0)"
        actor: system
        preconditions: ["authorized_teacher_count transitions 1 → 0"]
        side_effects:
          - "All ExamSessions of this course with status SCHEDULED → CANCELLED (cascade link 2)"
          - "Each cancelled session's ASSIGNED ProctorAssignments → RELEASED (cascade link 3)"
          - "Registrations are unaffected (students remain registered)"

  - entity: TeacherAuthorization
    field: status
    initial_state: PENDING_TRAINING
    terminal_states: []
    transitions:
      - from: PENDING_TRAINING
        to: AUTHORIZED
        trigger: "POST /teacher-authorizations/{id}/complete-training"
        actor: Teacher
        preconditions:
          - "Caller X-User-ID equals teacher_id of this record (ownership; ERR_FORBIDDEN otherwise)"
        side_effects:
          - "training_completed_at := logical clock; authorized_until := training_completed_at + 730 days"
          - "course.authorized_teacher_count += 1; if 0→1 then Course SUSPENDED → ACTIVE"
      - from: AUTHORIZED
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: logical clock >= authorized_until)"
        actor: system
        preconditions: ["logical clock >= authorized_until (AT the instant exactly counts as expired)"]
        side_effects:
          - "course.authorized_teacher_count -= 1; if 1→0 then Course ACTIVE → SUSPENDED (cascade link 1→2)"
      - from: EXPIRED
        to: AUTHORIZED
        trigger: "POST /teacher-authorizations/{id}/complete-training (retraining)"
        actor: Teacher
        preconditions:
          - "Caller X-User-ID equals teacher_id of this record (ownership; ERR_FORBIDDEN otherwise)"
        side_effects:
          - "training_completed_at := logical clock; authorized_until := training_completed_at + 730 days"
          - "course.authorized_teacher_count += 1; if 0→1 then Course SUSPENDED → ACTIVE"

  - entity: FeeReductionApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fee-reduction-applications/{id}/approve"
        actor: ApCoordinator
        preconditions: []
        side_effects:
          - "Recompute subsidy_cents for the student's ExamRegistrations in this cycle with registration_status != CANCELLED (cascade link 1)"
          - "Each recomputed registration triggers recompute of student.balance_cents, student.projected_balance_cents and cycle.rebate_cents (cascade link 2)"
          - "If a DRAFT ExamOrder exists for the cycle, recompute estimate_total_cents (subsidy component)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /fee-reduction-applications/{id}/deny"
        actor: ApCoordinator
        preconditions: []
        side_effects: ["No financial change (subsidy remains 0)"]
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /fee-reduction-applications/{id}/resubmit"
        actor: Student
        preconditions:
          - "Caller X-User-ID equals student_id of this record (ownership; ERR_FORBIDDEN otherwise)"
        side_effects: ["Projected balance again treats the application as potentially approved"]

  - entity: ExamRegistration
    field: registration_status
    initial_state: REGISTERED
    terminal_states: [CANCELLED, SAT, NO_SHOW]
    note: "Parallel dimension: registration_status and score_status evolve independently; see the score_status machine below."
    transitions:
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /registrations/{id}/cancel"
        actor: "Student (self) or ApCoordinator"
        preconditions:
          - "Student callers: caller X-User-ID equals student_id (ownership; ERR_FORBIDDEN otherwise)"
        side_effects:
          - "score_status → VOID"
          - "student.balance_cents / projected_balance_cents recompute; cycle.rebate_cents recomputes"
          - "cycle.registered_exam_count and course.registered_count -= 1"
          - "If a SCHEDULED ExamSession exists for the course: session.seats_reserved recomputes (-= 1)"
          - "If a DRAFT ExamOrder exists for the cycle: estimate_total_cents recomputes"
      - from: REGISTERED
        to: SAT
        trigger: "system (POST /exam-sessions/{id}/administer lists the registration in present_registration_ids)"
        actor: system
        preconditions: ["Session for this course is being administered"]
        side_effects: ["score_status stays PENDING"]
      - from: REGISTERED
        to: NO_SHOW
        trigger: "system (POST /exam-sessions/{id}/administer omits the registration from present_registration_ids)"
        actor: system
        preconditions: ["Session for this course is being administered"]
        side_effects: ["score_status → NO_SCORE"]

  - entity: ExamRegistration
    field: score_status
    initial_state: PENDING
    terminal_states: [POSTED, NO_SCORE, VOID]
    note: "Parallel dimension on the same entity as registration_status; transitions gate on registration_status where noted."
    transitions:
      - from: PENDING
        to: HELD
        trigger: "system (IrregularityReport created on the session of this registration's course)"
        actor: system
        preconditions: ["registration_status == SAT"]
        side_effects: ["Score release for this record is blocked while HELD"]
      - from: HELD
        to: PENDING
        trigger: "system (last FILED IrregularityReport on the session transitions to RESOLVED)"
        actor: system
        preconditions: []
        side_effects: ["Score release unblocked"]
      - from: [PENDING, HELD]
        to: VOID
        trigger: "system (IrregularityReport on the session transitions to SCORES_CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["Record can never be released or posted"]
      - from: PENDING
        to: VOID
        trigger: "system (registration is CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: RELEASED
        trigger: "POST /exam-cycles/{cycle_id}/release-scores (record listed in scores payload)"
        actor: Registrar
        preconditions:
          - "logical clock >= cycle.score_release_at (ERR_SCORES_NOT_YET_AVAILABLE otherwise)"
          - "registration_status == SAT (implied by score_status == PENDING)"
          - "score within program range: AP 1..5, IB 1..7 (ERR_INVALID_REQUEST otherwise)"
        side_effects: ["score := supplied value"]
      - from: RELEASED
        to: POSTED
        trigger: "POST /registrations/{id}/post-to-transcript"
        actor: Registrar
        preconditions:
          - "score >= course.credit_threshold (ERR_SCORE_BELOW_THRESHOLD otherwise; equality posts)"
        side_effects:
          - "student.transcript_posted_count += 1"

  - entity: ExamOrder
    field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /exam-orders/{id}/submit"
        actor: ApCoordinator
        preconditions:
          - "cycle.status == OPEN"
          - "estimate_total_cents <= cycle.budget_cap_cents (ERR_BUDGET_EXCEEDED otherwise)"
        side_effects:
          - "lines frozen (snapshot of per-course ordered_count = registered_count + adjustment delta at this instant)"
          - "submitted_at := logical clock; submitted_late := submitted_at > cycle.order_deadline_at"
          - "If submitted_late, every ordered exam is billed cycle.late_fee_cents (folded into frozen line late_fee_total_cents)"
          - "estimate_total_cents frozen"
      - from: SUBMITTED
        to: LOCKED
        trigger: "POST /exam-orders/{id}/lock"
        actor: ApCoordinator
        preconditions:
          - "Every course appearing in lines with ordered_count > 0 has authorized_teacher_count >= 1 (ERR_TEACHER_NOT_AUTHORIZED otherwise)"
        side_effects: ["locked_at := logical clock", "No further changes to quantities are possible"]
      - from: LOCKED
        to: RECONCILED
        trigger: "POST /exam-orders/{id}/reconcile"
        actor: ApCoordinator
        preconditions:
          - "Every ExamRegistration in the cycle is resolved: registration_status IN {SAT, NO_SHOW, CANCELLED} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "final_total_cents computed (calculations.order_invoice final variant: frozen lines + unused-exam penalty, chronological replay of SAT counts)"
          - "reconciled_at := logical clock"

  - entity: ExamSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: ADMINISTERED
        trigger: "POST /exam-sessions/{id}/administer"
        actor: ApCoordinator
        preconditions:
          - "logical clock >= end_at (ERR_SESSION_NOT_ENDED otherwise)"
          - "every id in present_registration_ids is an ExamRegistration of this course with registration_status == REGISTERED"
        side_effects:
          - "Listed registrations: registration_status REGISTERED → SAT (score_status stays PENDING)"
          - "This course's REGISTERED registrations not listed: registration_status → NO_SHOW, score_status → NO_SCORE"
          - "seats_reserved recomputes to 0 (no REGISTERED registrations remain for the course)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /exam-sessions/{id}/cancel, or system (course SUSPENDED cascade)"
        actor: "ApCoordinator or system"
        preconditions: []
        side_effects:
          - "ASSIGNED ProctorAssignments on this session → RELEASED"
          - "seats_reserved → 0; registrations are NOT cancelled (students remain registered)"
      - from: ADMINISTERED
        to: UNDER_INVESTIGATION
        trigger: "system (first IrregularityReport created on this session)"
        actor: system
        preconditions: []
        side_effects: ["SAT registrations of this course with score_status PENDING → HELD"]
      - from: UNDER_INVESTIGATION
        to: ADMINISTERED
        trigger: "system (last FILED IrregularityReport on this session transitions to RESOLVED)"
        actor: system
        preconditions: ["No other FILED reports remain on the session"]
        side_effects: ["HELD score records of this course's registrations → PENDING"]
      - from: UNDER_INVESTIGATION
        to: INVALIDATED
        trigger: "system (an IrregularityReport on this session transitions to SCORES_CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "SAT registrations of this course with score_status IN {PENDING, HELD} → VOID"
          - "Other FILED reports on the session remain FILED and may still be resolved individually (no further session effect)"

  - entity: ProctorAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /proctor-assignments/{id}/release, or system (session CANCELLED cascade)"
        actor: "ApCoordinator or system"
        preconditions: []
        side_effects: ["Teacher becomes available for other sessions whose windows were buffered-blocked by this one"]

  - entity: IrregularityReport
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED, SCORES_CANCELLED]
    transitions:
      - from: FILED
        to: RESOLVED
        trigger: "POST /irregularity-reports/{id}/resolve"
        actor: ApCoordinator
        preconditions: []
        side_effects:
          - "If no other FILED reports remain on the session: session UNDER_INVESTIGATION → ADMINISTERED and HELD score records → PENDING"
      - from: FILED
        to: SCORES_CANCELLED
        trigger: "POST /irregularity-reports/{id}/cancel-scores"
        actor: ApCoordinator
        preconditions: []
        side_effects:
          - "Session (ADMINISTERED or UNDER_INVESTIGATION) → INVALIDATED"
          - "SAT registrations of the course with score_status IN {PENDING, HELD} → VOID"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: exam-order-patch-stale-version
    parent_entity: ExamOrder
    write_endpoint: "PATCH /exam-orders/{id}"
    occ_field: expected_exam_order_version
    description: |
      Editing a DRAFT ExamOrder's adjustments requires the client to present the
      ExamOrder.version it last observed. A PATCH whose expected_exam_order_version
      is lower than the current version is rejected as stale, because another edit
      (or a lifecycle action) has advanced the order since the client's view was
      taken. Re-read the order and re-apply the adjustments against the new version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: registration_net_fee
    trigger: "registration create; fee-reduction approve/deny/resubmit sweep; registration cancel"
    algorithm: threshold
    formula: |
      fee_cents = course.exam_fee_cents (snapshot at registration creation)
      is_late = (creation logical time > cycle.registration_deadline_at)   # strictly greater; exactly AT the deadline is on time
      late_fee_applied_cents = is_late ? cycle.late_fee_cents : 0
      subsidy_cents = (student has APPROVED FeeReductionApplication for cycle)
                      ? min(cycle.fee_reduction_cents, fee_cents + late_fee_applied_cents) : 0
      net_fee_cents = fee_cents + late_fee_applied_cents - subsidy_cents   # >= 0 by construction of min()
    input_set: "The single ExamRegistration; subsidy input from the student's FeeReductionApplication in the same cycle with status APPROVED (SUBMITTED and DENIED contribute 0)"
    constants:
      SUBSIDY_FLOOR: "subsidy never exceeds fee + late fee (nested min)"
    precision: "integer cents; no rounding"
    variants:
      - name: with_approved_subsidy
        when: "APPROVED application exists for (student, cycle) at evaluation time"
        difference: "subsidy_cents = min(fee_reduction_cents, fee + late); recomputed on approve so previously full-price registrations gain subsidy retroactively"

  - name: order_invoice
    trigger: "estimate: live while order DRAFT (any registration create/cancel, FRA approve, PATCH adjustments) and frozen at submit; final: at reconcile"
    algorithm: aggregation
    formula: |
      # shared per-course quantities
      ordered_count(c) = count(registrations of c with registration_status != CANCELLED) + adjustment_delta(c)
      # --- estimate variant (forward-looking) ---
      late_component_estimate = (current logical clock > cycle.order_deadline_at) ? SUM_c ordered_count(c) * cycle.late_fee_cents : 0
      estimate_total_cents = SUM_c [ ordered_count(c) * c.exam_fee_cents ] + late_component_estimate - subsidy_component
      # --- final variant (chronological, at reconcile) ---
      sat_count(c) = count(registrations of c with registration_status == SAT)
      unused_count(c) = max(0, frozen ordered_count(c) - sat_count(c))
      late_component_final = submitted_late ? SUM_c frozen_ordered_count(c) * cycle.late_fee_cents : 0
      final_total_cents = SUM_c [ frozen_ordered_count(c) * c.exam_fee_cents ] + late_component_final
                          + SUM_c [ unused_count(c) * cycle.unused_exam_penalty_cents ] - subsidy_component_final
      subsidy_component = SUM of subsidy_cents over registrations in cycle with registration_status != CANCELLED (at evaluation time)
      subsidy_component_final = same set, evaluated at reconcile time (post-submit cancellations have subsidy 0 and drop out)
    input_set: "All ExamRegistrations in the cycle with registration_status != CANCELLED (estimate) / frozen order lines plus SAT replay (final); CANCELLED registrations excluded from every term"
    constants:
      LATE_FEE: "cycle.late_fee_cents, applied per ordered exam when submitted late"
      UNUSED_PENALTY: "cycle.unused_exam_penalty_cents, per unused exam at reconcile"
    precision: "integer cents; no rounding"
    variants:
      - name: estimate
        when: "order in DRAFT or SUBMITTED; computed on live registrations (forward-looking: includes students who have not yet sat)"
        difference: "no unused-exam penalty; late component projected from current clock while DRAFT, frozen at submit; subsidy component from live registrations"
      - name: final
        when: "order reconciled after administration (chronological: replays actual SAT outcomes against frozen lines)"
        difference: "adds unused_count * unused_exam_penalty_cents; ordered counts are the submit-time snapshot, so post-submit cancellations surface as unused exams; identical underlying data therefore yields estimate != final whenever no-shows or post-submit cancellations exist"

  - name: student_balance
    trigger: "registration create/cancel; fee-reduction approve/deny/resubmit; read via GET /students/{id}/statement"
    algorithm: aggregation
    formula: |
      balance_cents           = SUM(net_fee_cents) over registrations with registration_status IN {REGISTERED, SAT, NO_SHOW}
                                where subsidy_cents counts only APPROVED applications (pessimistic)
      projected_balance_cents = same sum, but subsidy computed as if applications in status SUBMITTED were APPROVED (optimistic):
                                subsidy_proj = min(cycle.fee_reduction_cents, fee_cents + late_fee_applied_cents) when
                                an application with status IN {APPROVED, SUBMITTED} exists, else 0
    input_set: "Student's registrations with registration_status IN {REGISTERED, SAT, NO_SHOW}; CANCELLED excluded; application status read at evaluation time"
    precision: "integer cents; no rounding"
    variants:
      - name: provisional
        when: "balance_cents field (what the school can bill now)"
        difference: "SUBMITTED applications contribute no subsidy"
      - name: projected
        when: "projected_balance_cents field (what the student would owe if the pending application is approved)"
        difference: "SUBMITTED applications contribute full subsidy; identical registration data yields balance != projected_balance whenever an undecided application exists"

  - name: school_rebate
    trigger: "registration create/cancel; fee-reduction approve/deny/resubmit (anything that changes a net_fee_cents)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each registration's rebate line FIRST, then sum.
      cycle.rebate_cents = SUM over registrations with registration_status != CANCELLED
                           of round_half_up(net_fee_cents * cycle.rebate_rate_bp / 10000)
      # The alternative (sum net fees, then round once) is REJECTED and yields different cents:
      # e.g. three nets of 1050 at 900bp: per-line 3 * round(94.5) = 285 vs sum-then-round round(283.5) = 284.
    input_set: "Registrations in the cycle with registration_status != CANCELLED"
    constants:
      RATE_UNIT: "rebate_rate_bp is basis points (900 = 9%)"
    precision: "round_half_up to integer cents PER LINE, then sum (order pinned; do not sum-then-round)"

  - name: equity_participation
    trigger: "GET /exam-cycles/{id}/equity-report"
    algorithm: aggregation
    formula: |
      for each subgroup S in {GEN, FRL, IEP, ELL} having >= 1 student:
        students_S     = count of Students with subgroup_code == S
        participants_S = count of DISTINCT students in S having >= 1 registration in this cycle
                         with registration_status != CANCELLED
        participation_rate_S = round_half_up(100.0 * participants_S / students_S, 1 decimal)
      total_exams    = count of registrations in this cycle with registration_status != CANCELLED
      growth_exams   = total_exams - total_exams(compare_to_cycle_id) when compare_to_cycle_id supplied, else null
      access_gap_pct = round_half_up(max(participation_rate_S) - min(participation_rate_S), 1 decimal)
    input_set: "All Students (population); registrations with registration_status != CANCELLED (CANCELLED excluded from both participants and totals)"
    precision: "rates and gap: 1 decimal, round_half_up; counts: integers"

  - name: authorization_expiry
    trigger: "POST /_clock/set_current_utc (sweep after every clock move)"
    algorithm: threshold
    formula: |
      on complete-training: authorized_until = training_completed_at + 730 days
      sweep: every TeacherAuthorization with status == AUTHORIZED and logical_clock >= authorized_until
             transitions to EXPIRED (AT the instant exactly counts as expired: >=, not >)
      each expiry decrements course.authorized_teacher_count; a 1 -> 0 transition flips Course ACTIVE -> SUSPENDED
    input_set: "TeacherAuthorizations with status == AUTHORIZED"
    constants:
      VALIDITY_DAYS: 730
    precision: "datetime comparison to the second; boundary is inclusive (>=)"

  - name: session_seating
    trigger: "session create; registration create/cancel for a course that has a SCHEDULED session; administer"
    algorithm: threshold
    formula: |
      required_seats(course) = count of the course's ExamRegistrations with registration_status == REGISTERED
      session create: room_capacity >= required_seats required (equality is allowed; capacity one short is rejected)
      while a session is SCHEDULED: session.seats_reserved = required_seats(course), recomputed on every
      registration create/cancel for that course
      new registration when a SCHEDULED session exists: rejected when required_seats_after > room_capacity
    input_set: "Registrations of the course with registration_status == REGISTERED (SAT, NO_SHOW, CANCELLED excluded)"
    precision: "integer seat counts; capacity boundary is inclusive (>=, equality fits)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of ApCoordinator, Teacher, Student, Registrar"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is in the endpoint's roles list; entity-backed ownership: Student callers may only act on rows whose student_id == X-User-ID (registration create/cancel, application create/resubmit, own statement, own filtered lists); Teacher callers may only complete-training rows whose teacher_id == X-User-ID and may only file irregularity reports for sessions where they hold an ASSIGNED ProctorAssignment with teacher_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters resolve left-to-right to existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Request shape: required fields present, types correct, enum values in range, end_at strictly after start_at, grade_level in 9..12, score within program range (AP 1..5, IB 1..7); unknown/unexpected fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: existence
    check: "Body foreign keys resolve to existing resources (cycle_id, course_id, student_id, teacher_id, session_id, registration ids inside scores/present_registration_ids)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all endpoints whose body carries FK references"

  - priority: 6
    category: state
    check: "Target entity in a valid from-state for the requested transition (registration only REGISTERED→cancel, order DRAFT-only PATCH/submit, session SCHEDULED-only administer, report FILED-only resolve/cancel-scores, etc.); cycle must be OPEN for registration/order/session creation; course must be ACTIVE (authorized_teacher_count >= 1) for session creation; OCC: expected_exam_order_version must equal current ExamOrder.version on PATCH"
    error_id: ERR_INVALID_STATE | ERR_TEACHER_NOT_AUTHORIZED | ERR_STALE_VERSION
    http_status: 409 | 422 | 412
    applies_to: "transition and OCC-guarded endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance gates: proctor must NOT hold an AUTHORIZED TeacherAuthorization for the session's course (conflict of interest); session room must support accommodations when any REGISTERED registration of the course has accommodation_type != NONE"
    error_id: ERR_PROCTOR_SUBJECT_CONFLICT | ERR_ROOM_NOT_ACCOMMODATION_CAPABLE
    http_status: 422
    applies_to: "POST /proctor-assignments, POST /exam-sessions"

  - priority: 8
    category: business_temporal
    check: "Temporal gates: session window inside cycle exam window; room half-open overlap; proctor 30-minute buffered overlap; administer only at/after session end; score release only at/after score_release_at"
    error_id: ERR_OUTSIDE_EXAM_WINDOW | ERR_ROOM_CONFLICT | ERR_PROCTOR_OVERLAP | ERR_SESSION_NOT_ENDED | ERR_SCORES_NOT_YET_AVAILABLE
    http_status: "422 | 409"
    applies_to: "POST /exam-sessions, POST /proctor-assignments, POST /exam-sessions/{id}/administer, POST /exam-cycles/{id}/release-scores"

  - priority: 9
    category: business_constraint
    check: "Uniqueness and quota: one order per cycle; one TeacherAuthorization per (teacher, course); one FeeReductionApplication per (student, cycle); one non-CANCELLED registration per (student, course); one ASSIGNED proctor row per (session, teacher); one non-CANCELLED session per course; adjustment deltas may not drive ordered_count below 0; registration must fit in the SCHEDULED session's remaining capacity; score must meet credit threshold for posting"
    error_id: ERR_ORDER_ALREADY_EXISTS | ERR_DUPLICATE_AUTHORIZATION | ERR_DUPLICATE_APPLICATION | ERR_DUPLICATE_REGISTRATION | ERR_DUPLICATE_PROCTOR | ERR_DUPLICATE_SESSION | ERR_NEGATIVE_QUANTITY | ERR_SESSION_FULL | ERR_ROOM_CAPACITY_INSUFFICIENT | ERR_SCORE_BELOW_THRESHOLD
    http_status: "409 | 422"
    applies_to: "creation endpoints, PATCH /exam-orders/{id}, POST /registrations, POST /registrations/{id}/post-to-transcript"

  - priority: 10
    category: business_fiscal
    check: "Fiscal gate: order submit requires estimate_total_cents <= cycle.budget_cap_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /exam-orders/{id}/submit"

  - priority: 11
    category: state
    check: "Score-release record gate: any record listed in release-scores with score_status HELD rejects the whole request; any listed record in another non-PENDING state (RELEASED, POSTED, NO_SCORE, VOID) likewise rejects the whole request (transactional, nothing written)"
    error_id: ERR_IRREGULARITY_OPEN | ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /exam-cycles/{id}/release-scores"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z (never wall-clock). Each set runs the authorization-expiry sweep (calculations.authorization_expiry)."
    roles: [ApCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Expiry sweep: AUTHORIZED TeacherAuthorizations with authorized_until <= new time → EXPIRED, cascading course/session/proctor updates"]

  # --- ExamCycle ---
  - method: POST
    path: "/exam-cycles"
    description: "Create an exam administration cycle with its deadlines and fee constants"
    roles: [ApCoordinator]
    code: 201
    input: [name, registration_deadline_at, order_deadline_at, score_release_at, exam_window_start_at, exam_window_end_at, late_fee_cents, unused_exam_penalty_cents, fee_reduction_cents, budget_cap_cents, rebate_rate_bp]
    output: ExamCycle
    side_effects: ["status = SETUP; registered_exam_count = 0; rebate_cents = 0"]

  - method: GET
    path: "/exam-cycles/{id}"
    description: "Get one cycle including computed registered_exam_count and rebate_cents"
    roles: [ApCoordinator, Registrar, Teacher, Student]
    code: 200
    input: []
    output: ExamCycle
    side_effects: []

  - method: POST
    path: "/exam-cycles/{id}/open"
    description: "Open the cycle (SETUP → OPEN); registrations, orders, sessions require OPEN"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: ExamCycle
    side_effects: ["status → OPEN"]

  - method: GET
    path: "/exam-cycles/{id}/equity-report"
    description: "Program growth & equity access report (calculations.equity_participation)"
    roles: [ApCoordinator]
    code: 200
    input: ["compare_to_cycle_id?"]
    output: "{ subgroups: array, total_exams: integer, growth_exams: integer, access_gap_pct: number }"
    side_effects: []

  # --- Course ---
  - method: POST
    path: "/courses"
    description: "Create a course in a cycle; starts SUSPENDED until a teacher is authorized"
    roles: [ApCoordinator]
    code: 201
    input: [cycle_id, subject_code, program, exam_fee_cents, credit_threshold]
    output: Course
    side_effects: ["status = SUSPENDED (authorized_teacher_count = 0)"]

  - method: GET
    path: "/courses"
    description: "List courses; filterable"
    roles: [ApCoordinator, Registrar, Teacher, Student]
    code: 200
    input: ["cycle_id?", "status?"]
    output: "Course[]"
    side_effects: []

  - method: GET
    path: "/courses/{id}"
    description: "Get one course including computed authorized_teacher_count and registered_count"
    roles: [ApCoordinator, Registrar, Teacher, Student]
    code: 200
    input: []
    output: Course
    side_effects: []

  # --- Teacher ---
  - method: POST
    path: "/teachers"
    description: "Register a teacher"
    roles: [ApCoordinator]
    code: 201
    input: [full_name, email]
    output: Teacher
    side_effects: []

  # --- TeacherAuthorization ---
  - method: POST
    path: "/teacher-authorizations"
    description: "Open a training/authorization record for (teacher, course); at most one row per pair ever"
    roles: [ApCoordinator]
    code: 201
    input: [teacher_id, course_id]
    output: TeacherAuthorization
    side_effects: ["status = PENDING_TRAINING"]

  - method: GET
    path: "/teacher-authorizations"
    description: "List authorization records; filterable"
    roles: [ApCoordinator, Teacher]
    code: 200
    input: ["teacher_id?", "course_id?", "status?"]
    output: "TeacherAuthorization[]"
    side_effects: []

  - method: GET
    path: "/teacher-authorizations/{id}"
    description: "Get one authorization record"
    roles: [ApCoordinator, Teacher]
    code: 200
    input: []
    output: TeacherAuthorization
    side_effects: []

  - method: POST
    path: "/teacher-authorizations/{id}/complete-training"
    description: "Teacher attests completed training (PENDING_TRAINING or EXPIRED → AUTHORIZED); only the teacher on the record may attest (segregation: the coordinator who opened the record cannot attest)"
    roles: [Teacher]
    code: 200
    input: []
    output: TeacherAuthorization
    side_effects:
      - "training_completed_at := logical clock; authorized_until := training_completed_at + 730 days"
      - "course.authorized_teacher_count += 1; Course SUSPENDED → ACTIVE on 0→1"

  # --- Student ---
  - method: POST
    path: "/students"
    description: "Register a student"
    roles: [ApCoordinator]
    code: 201
    input: [full_name, grade_level, subgroup_code]
    output: Student
    side_effects: ["balance_cents = 0; projected_balance_cents = 0; transcript_posted_count = 0"]

  - method: GET
    path: "/students/{id}/statement"
    description: "Student account statement: provisional and projected balances (calculations.student_balance)"
    roles: [ApCoordinator, Registrar, Student]
    code: 200
    input: []
    output: "{ student_id: string, balance_cents: integer, projected_balance_cents: integer, transcript_posted_count: integer }"
    side_effects: []

  # --- FeeReductionApplication ---
  - method: POST
    path: "/fee-reduction-applications"
    description: "Student applies for a fee reduction in a cycle; at most one row per (student, cycle) ever"
    roles: [Student]
    code: 201
    input: [student_id, cycle_id, eligibility_basis, annual_income_cents]
    output: FeeReductionApplication
    side_effects: ["status = SUBMITTED; projected_balance_cents recomputes (optimistic variant)"]

  - method: GET
    path: "/fee-reduction-applications"
    description: "List applications; filterable. Student callers see only their own (student_id == X-User-ID)"
    roles: [ApCoordinator, Student]
    code: 200
    input: ["student_id?", "cycle_id?", "status?"]
    output: "FeeReductionApplication[]"
    side_effects: []

  - method: GET
    path: "/fee-reduction-applications/{id}"
    description: "Get one application; Student callers must own it"
    roles: [ApCoordinator, Student]
    code: 200
    input: []
    output: FeeReductionApplication
    side_effects: []

  - method: POST
    path: "/fee-reduction-applications/{id}/approve"
    description: "Approve a SUBMITTED application"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: FeeReductionApplication
    side_effects:
      - "status → APPROVED"
      - "Recompute subsidy_cents on the student's non-CANCELLED registrations in the cycle (cascade link 1)"
      - "Recompute student balances and cycle.rebate_cents (cascade link 2); DRAFT order estimate recomputes"

  - method: POST
    path: "/fee-reduction-applications/{id}/deny"
    description: "Deny a SUBMITTED application"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: FeeReductionApplication
    side_effects: ["status → DENIED"]

  - method: POST
    path: "/fee-reduction-applications/{id}/resubmit"
    description: "Re-open a DENIED application (DENIED → SUBMITTED); only the owning student"
    roles: [Student]
    code: 200
    input: []
    output: FeeReductionApplication
    side_effects: ["status → SUBMITTED"]

  # --- ExamRegistration ---
  - method: POST
    path: "/registrations"
    description: "Student registers for a course exam; creates the parallel score record (score_status PENDING)"
    roles: [Student]
    code: 201
    input: [student_id, course_id, "accommodation_type?"]
    output: ExamRegistration
    side_effects:
      - "registration_status = REGISTERED; score_status = PENDING; cycle_id copied from course"
      - "calculations.registration_net_fee (late flag from logical clock; subsidy from APPROVED application)"
      - "student balances, cycle.rebate_cents, cycle.registered_exam_count, course.registered_count recompute"
      - "If a SCHEDULED session exists for the course: seats_reserved recomputes; rejected when over capacity (ERR_SESSION_FULL)"
      - "If a DRAFT order exists: estimate recomputes"

  - method: GET
    path: "/registrations"
    description: "List registrations; filterable. Student callers see only their own"
    roles: [ApCoordinator, Registrar, Teacher, Student]
    code: 200
    input: ["student_id?", "course_id?", "cycle_id?", "registration_status?", "score_status?"]
    output: "ExamRegistration[]"
    side_effects: []

  - method: GET
    path: "/registrations/{id}"
    description: "Get one registration (both state dimensions + fee fields); Student callers must own it"
    roles: [ApCoordinator, Registrar, Teacher, Student]
    code: 200
    input: []
    output: ExamRegistration
    side_effects: []

  - method: POST
    path: "/registrations/{id}/cancel"
    description: "Cancel a REGISTERED registration"
    roles: [Student, ApCoordinator]
    code: 200
    input: []
    output: ExamRegistration
    side_effects:
      - "registration_status → CANCELLED; score_status → VOID"
      - "Balances, rebate, counts, SCHEDULED session seats_reserved, DRAFT order estimate recompute"

  # --- ExamOrder ---
  - method: POST
    path: "/exam-orders"
    description: "Create the cycle's exam order (DRAFT); at most one per cycle"
    roles: [ApCoordinator]
    code: 201
    input: [cycle_id]
    output: ExamOrder
    side_effects: ["status = DRAFT; lines and estimate_total_cents computed live from current registrations"]

  - method: GET
    path: "/exam-orders"
    description: "List orders; filterable"
    roles: [ApCoordinator, Registrar]
    code: 200
    input: ["cycle_id?", "status?"]
    output: "ExamOrder[]"
    side_effects: []

  - method: GET
    path: "/exam-orders/{id}"
    description: "Get one order including version (OCC), lines, estimate/final totals"
    roles: [ApCoordinator, Registrar]
    code: 200
    input: []
    output: ExamOrder
    side_effects: []

  - method: PATCH
    path: "/exam-orders/{id}"
    description: "Edit DRAFT order adjustments (OCC-guarded)"
    roles: [ApCoordinator]
    code: 200
    input: [expected_exam_order_version, "adjustments?"]
    output: ExamOrder
    side_effects:
      - "Rejects with ERR_STALE_VERSION (412) when expected_exam_order_version != current version"
      - "adjustments replace the prior adjustments array; ordered_count per course = registered_count + delta; any course driven below 0 → ERR_NEGATIVE_QUANTITY"
      - "increments ExamOrder.version by 1; estimate_total_cents recomputes"

  - method: POST
    path: "/exam-orders/{id}/submit"
    description: "Submit a DRAFT order; freezes lines and estimate; late submission bills late fee per ordered exam"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: ExamOrder
    side_effects: ["status → SUBMITTED; lines/estimate frozen; submitted_late from logical clock vs order_deadline_at; budget cap enforced"]

  - method: POST
    path: "/exam-orders/{id}/lock"
    description: "Lock a SUBMITTED order; every ordered course must have an authorized teacher"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: ExamOrder
    side_effects: ["status → LOCKED; locked_at stamped"]

  - method: POST
    path: "/exam-orders/{id}/reconcile"
    description: "Reconcile a LOCKED order after administration; computes final invoice with unused-exam penalties"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: ExamOrder
    side_effects: ["status → RECONCILED; final_total_cents computed (final variant); reconciled_at stamped"]

  # --- ExamSession ---
  - method: POST
    path: "/exam-sessions"
    description: "Schedule a course's exam sitting in a room; enforces window, room overlap (half-open), capacity, accommodation capability, course ACTIVE, one session per course"
    roles: [ApCoordinator]
    code: 201
    input: [course_id, room_name, room_capacity, "room_supports_accommodations?", start_at, end_at]
    output: ExamSession
    side_effects: ["status = SCHEDULED; seats_reserved = count of course's REGISTERED registrations"]

  - method: GET
    path: "/exam-sessions"
    description: "List sessions; filterable"
    roles: [ApCoordinator, Registrar, Teacher, Student]
    code: 200
    input: ["course_id?", "status?"]
    output: "ExamSession[]"
    side_effects: []

  - method: GET
    path: "/exam-sessions/{id}"
    description: "Get one session"
    roles: [ApCoordinator, Registrar, Teacher, Student]
    code: 200
    input: []
    output: ExamSession
    side_effects: []

  - method: POST
    path: "/exam-sessions/{id}/administer"
    description: "Record attendance after the session ends; listed registrations → SAT, unlisted REGISTERED registrations of the course → NO_SHOW"
    roles: [ApCoordinator]
    code: 200
    input: [present_registration_ids]
    output: ExamSession
    side_effects:
      - "status SCHEDULED → ADMINISTERED"
      - "listed: registration_status → SAT (score_status stays PENDING); unlisted REGISTERED of course: → NO_SHOW and score_status → NO_SCORE"
      - "seats_reserved recomputes to 0"

  - method: POST
    path: "/exam-sessions/{id}/cancel"
    description: "Cancel a SCHEDULED session; releases proctors; registrations are not cancelled"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: ExamSession
    side_effects: ["status → CANCELLED; ASSIGNED ProctorAssignments → RELEASED; seats_reserved → 0"]

  # --- ProctorAssignment ---
  - method: POST
    path: "/proctor-assignments"
    description: "Assign a teacher to proctor a SCHEDULED session; enforces subject-conflict ban, 30-minute buffered overlap, duplicate ban"
    roles: [ApCoordinator]
    code: 201
    input: [session_id, teacher_id]
    output: ProctorAssignment
    side_effects: ["status = ASSIGNED"]

  - method: GET
    path: "/proctor-assignments"
    description: "List proctor assignments; filterable"
    roles: [ApCoordinator, Teacher]
    code: 200
    input: ["session_id?", "teacher_id?", "status?"]
    output: "ProctorAssignment[]"
    side_effects: []

  - method: GET
    path: "/proctor-assignments/{id}"
    description: "Get one proctor assignment"
    roles: [ApCoordinator, Teacher]
    code: 200
    input: []
    output: ProctorAssignment
    side_effects: []

  - method: POST
    path: "/proctor-assignments/{id}/release"
    description: "Release an ASSIGNED proctor"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: ProctorAssignment
    side_effects: ["status ASSIGNED → RELEASED"]

  # --- IrregularityReport ---
  - method: POST
    path: "/irregularity-reports"
    description: "Assigned proctor files an exam-day irregularity on an ADMINISTERED (or UNDER_INVESTIGATION) session"
    roles: [Teacher]
    code: 201
    input: [session_id, category, details]
    output: IrregularityReport
    side_effects:
      - "status = FILED; proctor_teacher_id := caller X-User-ID"
      - "session ADMINISTERED → UNDER_INVESTIGATION (no-op if already UNDER_INVESTIGATION)"
      - "SAT registrations of the course with score_status PENDING → HELD"

  - method: GET
    path: "/irregularity-reports"
    description: "List irregularity reports; filterable"
    roles: [ApCoordinator, Teacher, Registrar]
    code: 200
    input: ["session_id?", "status?", "proctor_teacher_id?"]
    output: "IrregularityReport[]"
    side_effects: []

  - method: GET
    path: "/irregularity-reports/{id}"
    description: "Get one irregularity report"
    roles: [ApCoordinator, Teacher, Registrar]
    code: 200
    input: []
    output: IrregularityReport
    side_effects: []

  - method: POST
    path: "/irregularity-reports/{id}/resolve"
    description: "Resolve a FILED report (scores unaffected)"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: IrregularityReport
    side_effects: ["status → RESOLVED; when the session's last FILED report resolves: session → ADMINISTERED, HELD score records → PENDING"]

  - method: POST
    path: "/irregularity-reports/{id}/cancel-scores"
    description: "Cancel scores for a FILED report (session invalidated)"
    roles: [ApCoordinator]
    code: 200
    input: []
    output: IrregularityReport
    side_effects: ["status → SCORES_CANCELLED; session → INVALIDATED; SAT registrations' score_status PENDING/HELD → VOID"]

  # --- Score release & transcript ---
  - method: POST
    path: "/exam-cycles/{id}/release-scores"
    description: "Bulk score import/release for the cycle (transactional: any listed record not PENDING rejects the whole request, nothing written)"
    roles: [Registrar]
    code: 200
    input: [scores]
    output: "{ released_count: integer, released_registration_ids: array }"
    side_effects:
      - "Requires logical clock >= cycle.score_release_at"
      - "Each listed registration: score_status PENDING → RELEASED, score := supplied value (range AP 1..5 / IB 1..7)"
      - "Listed record with score_status HELD → ERR_IRREGULARITY_OPEN; any other non-PENDING → ERR_INVALID_STATE"

  - method: POST
    path: "/registrations/{id}/post-to-transcript"
    description: "Post a RELEASED score to the student's transcript when it meets the course credit threshold (equality posts)"
    roles: [Registrar]
    code: 200
    input: []
    output: ExamRegistration
    side_effects: ["score_status RELEASED → POSTED; student.transcript_posted_count += 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or unrecognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or entity-backed ownership violated (student/teacher acting on another's row; teacher filing for a session they do not proctor)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, enum out of range, end_at <= start_at, grade_level outside 9..12, score outside program range, or unexpected field in payload" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body foreign key (cycle_id, course_id, student_id, teacher_id, session_id, registration ids) does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition (incl. cycle not OPEN, session not SCHEDULED/ADMINISTERED as required, order not DRAFT for PATCH/submit, reconcile with unresolved registrations, release-scores listing a non-PENDING record)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "PATCH /exam-orders/{id} expected_exam_order_version does not match current ExamOrder.version" }
  - { id: ERR_IRREGULARITY_OPEN, http: 409, condition: "release-scores lists a record whose score_status is HELD (open irregularity on the session)" }
  - { id: ERR_PROCTOR_SUBJECT_CONFLICT, http: 422, condition: "Teacher holds an AUTHORIZED TeacherAuthorization for the session's course (conflict of interest)" }
  - { id: ERR_ROOM_NOT_ACCOMMODATION_CAPABLE, http: 422, condition: "Course has a REGISTERED registration with accommodation_type != NONE but room_supports_accommodations is false" }
  - { id: ERR_TEACHER_NOT_AUTHORIZED, http: 422, condition: "Course has no AUTHORIZED teacher (session creation, or order lock with the course on a line)" }
  - { id: ERR_OUTSIDE_EXAM_WINDOW, http: 422, condition: "Session start/end outside the cycle exam window" }
  - { id: ERR_ROOM_CONFLICT, http: 409, condition: "Another non-CANCELLED session with the same room_name overlaps [start_at, end_at) (half-open; adjacency allowed)" }
  - { id: ERR_PROCTOR_OVERLAP, http: 409, condition: "Teacher has another ASSIGNED assignment whose session window is separated by less than 30 minutes (buffered overlap; gap >= 30 minutes is allowed)" }
  - { id: ERR_SESSION_NOT_ENDED, http: 422, condition: "administer called before the session end_at (logical clock)" }
  - { id: ERR_SCORES_NOT_YET_AVAILABLE, http: 422, condition: "release-scores called before cycle.score_release_at (logical clock)" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Student already has a non-CANCELLED registration for the course" }
  - { id: ERR_DUPLICATE_AUTHORIZATION, http: 409, condition: "A TeacherAuthorization row already exists for (teacher_id, course_id)" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "A FeeReductionApplication row already exists for (student_id, cycle_id)" }
  - { id: ERR_DUPLICATE_PROCTOR, http: 409, condition: "Teacher already has an ASSIGNED assignment on this session" }
  - { id: ERR_DUPLICATE_SESSION, http: 409, condition: "Course already has a non-CANCELLED session" }
  - { id: ERR_ORDER_ALREADY_EXISTS, http: 409, condition: "An ExamOrder already exists for the cycle" }
  - { id: ERR_NEGATIVE_QUANTITY, http: 422, condition: "Adjustment delta would drive a course's ordered_count below 0" }
  - { id: ERR_SESSION_FULL, http: 422, condition: "Registration would push the course's SCHEDULED session beyond room_capacity" }
  - { id: ERR_ROOM_CAPACITY_INSUFFICIENT, http: 422, condition: "Session creation with room_capacity below the course's current REGISTERED registration count (capacity must be >= required seats; equality allowed)" }
  - { id: ERR_SCORE_BELOW_THRESHOLD, http: 422, condition: "post-to-transcript with score < course.credit_threshold" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Order submit with estimate_total_cents > cycle.budget_cap_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ApCoordinator
    description: "The school's AP/IB coordinator: owns cycles, courses, teachers, orders, sessions, proctors, fee-reduction decisions, and irregularity resolution."
    identity: opaque
    exclusive_operations:
      - "POST /exam-cycles, POST /exam-cycles/{id}/open, GET /exam-cycles/{id}/equity-report"
      - "POST /courses, POST /teachers, POST /students"
      - "POST /teacher-authorizations"
      - "POST /fee-reduction-applications/{id}/approve, POST /fee-reduction-applications/{id}/deny"
      - "POST /exam-orders, PATCH /exam-orders/{id}, POST /exam-orders/{id}/submit, POST /exam-orders/{id}/lock, POST /exam-orders/{id}/reconcile"
      - "POST /exam-sessions, POST /exam-sessions/{id}/administer, POST /exam-sessions/{id}/cancel"
      - "POST /proctor-assignments, POST /proctor-assignments/{id}/release"
      - "POST /irregularity-reports/{id}/resolve, POST /irregularity-reports/{id}/cancel-scores"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads: cycles, courses, registrations, orders, sessions, proctor-assignments, teacher-authorizations, fee-reduction-applications, irregularity-reports, student statements"
      - "POST /registrations/{id}/cancel (shared with Student)"

  - name: Student
    description: "Exam candidate; acts only on own rows (X-User-ID == student_id)."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /registrations (own), POST /fee-reduction-applications (own), POST /fee-reduction-applications/{id}/resubmit (own)"
    shared_operations:
      - "POST /registrations/{id}/cancel (own; shared with ApCoordinator)"
      - "GET reads: own registrations, own fee-reduction-applications, own statement, cycles, courses, sessions"

  - name: Teacher
    description: "Course teacher / exam proctor; attests own training and files irregularities for sessions they proctor."
    identity: "entity_backed:Teacher"
    exclusive_operations:
      - "POST /teacher-authorizations/{id}/complete-training (own record only)"
      - "POST /irregularity-reports (only for sessions where the teacher holds an ASSIGNED ProctorAssignment)"
    shared_operations:
      - "GET reads: cycles, courses, sessions, registrations, own teacher-authorizations, own proctor-assignments, irregularity-reports"

  - name: Registrar
    description: "Records office: owns score release and transcript credit posting; read access for reconciliation."
    identity: opaque
    exclusive_operations:
      - "POST /exam-cycles/{id}/release-scores"
      - "POST /registrations/{id}/post-to-transcript"
    shared_operations:
      - "GET reads: cycles, courses, registrations, orders, sessions, irregularity-reports, student statements"
