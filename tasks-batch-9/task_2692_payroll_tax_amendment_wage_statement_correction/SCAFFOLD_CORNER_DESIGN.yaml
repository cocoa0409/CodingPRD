            - "2025 Q1 register 5000000 wage / 750000 withheld in jurisdiction US; the filed 941 reports 4750000 / 500000 with original_due_date 2025-04-30; one cleared deposit of 500000 against a 750000 obligation due 2025-02-19."
            - "All three emitted discrepancies were categorised and the WITHHOLDING one was then dismissed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "SEMIWEEKLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
