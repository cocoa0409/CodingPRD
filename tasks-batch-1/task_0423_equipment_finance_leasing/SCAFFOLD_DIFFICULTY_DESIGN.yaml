            - call: "GET /lessors/${lessor_id}/leases/${lease1_id}/schedule-lines?status=SCHEDULED"
              payload: {}
              as: Servicer
              captures: { l1_line_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/leases/${lease1_id}/invoices"
              payload: { schedule_line_id: "${l1_line_id}" }
              as: Servicer
              captures: { l1_inv_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/invoices/${l1_inv_id}/payments"
              payload: { amount_cents: 108250 }
              as: Servicer
            - call: "POST /lessors/${lessor_id}/leases/${lease1_id}/begin-end-of-term"
