      - name: guideline_notice_gap_buffer_semantics
        grounds:
          - state_machines.GuidelineVersion.DRAFT_to_PUBLISHED
          - errors[ERR_NOTICE_GAP_VIOLATION]
          - errors[ERR_GUIDELINE_OVERLAP]
        distinguishing_aspect: |
          Interval semantic: buffer/gap on GuidelineVersion resource — the new
          version's effective_date must be at least guideline_notice_days
          AFTER the prior PUBLISHED version's effective_date. Same-year is
          fine so long as the gap is honored — different from the point
          equality used by rate cards.
        test_recipe:
          setup:
            - "Dept with guideline_notice_days=30"
            - "GV1 effective 2026-09-01 PUBLISHED"
            - "GV2 DRAFT with effective 2026-09-15 (only 14 days later — violates 30-day buffer)"
            - "GV3 DRAFT with effective 2026-10-01 (exactly 30 days later — boundary compliant)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalOpsReviewer
            - call: "POST /legal-departments"
              payload: { name: "GapDept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "GapFirm" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/guideline-versions"
              payload: { version_label: "OCG-V1", effective_date: "2026-09-01T00:00:00Z" }
              as: LegalOpsReviewer
              captures: { gv1: $.data.id }
            - call: "POST /legal-departments/${dept_id}/guideline-versions/${gv1}/publish"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/guideline-versions"
              payload: { version_label: "OCG-V2", effective_date: "2026-09-15T00:00:00Z" }
              as: LegalOpsReviewer
              captures: { gv2: $.data.id }
            - call: "POST /legal-departments/${dept_id}/guideline-versions"
              payload: { version_label: "OCG-V3", effective_date: "2026-10-01T00:00:00Z" }
              as: LegalOpsReviewer
              captures: { gv3: $.data.id }
          trigger:
            - call: "POST /legal-departments/${dept_id}/guideline-versions/${gv2}/publish"
              payload: {}
              as: LegalOpsReviewer
              captures: { err_v2: $.data.error_id }
            - call: "POST /legal-departments/${dept_id}/guideline-versions/${gv3}/publish"
              payload: {}
              as: LegalOpsReviewer
              captures: { gv3_status: $.data.status }
          assert:
            - "err_v2 == ERR_NOTICE_GAP_VIOLATION (14-day gap < 30-day requirement)"
            - "gv3_status == PUBLISHED (30-day gap >= 30-day requirement — inclusive boundary)"
            - "GuidelineVersion.${gv1}.status == SUPERSEDED after GV3 publishes"

  # =====================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: billed_to_date_invariant_under_reject_reinstate
        grounds:
          - calculations.invoice_payable_amount
          - state_machines.InvoiceLineItem.REJECTED_to_REINSTATED
          - entities.Matter.fields.billed_to_date_cents
        distinguishing_aspect: |
          Conserved quantity: cents on Matter.billed_to_date_cents. Forward
          action (line reject) subtracts the line from approved_total; the
          compensating action (appeal grant) restores the identical amount.
          Net drift MUST be zero.
        test_recipe:
          setup:
            - "Matter ENGAGED; invoice INV-I with two lines (1000000 and 500000) — both auto-approved → billed_to_date=1500000"
            - "Reviewer manually rejects line2 via reject endpoint → approved_total drops to 1000000 BUT billed_to_date is already booked at 1500000; the scaffold's rule is: manual reject AFTER invoice approval reduces approved_total_cents AND reduces billed_to_date_cents by the same amount (compensating debit)"
            - "Firm appeals; reviewer grants → compensating credit restores both"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "InvDept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "InvFirm" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "P", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_id}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2026, expected_panel_firm_version: "${firm_v}" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { card_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_id}", hourly_rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/approve"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M Inv", budget_cents: 100000000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { matter_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices"
              payload:
                invoice_number: "INV-I"
                billing_period_start: "2026-08-01T00:00:00Z"
                billing_period_end: "2026-09-01T00:00:00Z"
                expected_matter_version: "${matter_v}"
                line_items:
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L110", narrative: "clean L110", hours: 10.00, rate_cents: 100000 }
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L120", narrative: "clean L120", hours: 5.00, rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { invoice_id: $.data.id }
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items"
              payload: {}
              as: LegalOpsReviewer
              captures: { line2_id: "$.data[1].id" }
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { billed_initial: $.data.billed_to_date_cents }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items/${line2_id}/reject"
              payload: { rejection_reason_code: "OVER_BUDGET" }
              as: LegalOpsReviewer
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { billed_after_reject: $.data.billed_to_date_cents }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items/${line2_id}/appeals"
              payload: { rationale: "not over budget" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items/${line2_id}/appeals/${appeal_id}/claim"
              payload: {}
              as: LegalOpsReviewer
          trigger:
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/line-items/${line2_id}/appeals/${appeal_id}/grant"
              payload: { resolution_note: "restore" }
              as: LegalOpsReviewer
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { billed_final: $.data.billed_to_date_cents }
          assert:
            - "billed_initial == 1500000"
            - "billed_after_reject == 1000000 (compensating debit of 500000)"
            - "billed_final == 1500000 (compensating credit restores exactly)"
            - "billed_final - billed_initial == 0 (zero drift invariant)"

      - name: approved_rate_card_count_invariant_under_supersession
        grounds:
          - state_machines.RateCard.SUBMITTED_to_APPROVED
          - entities.RateCard.fields.status
        distinguishing_aspect: |
          Conserved quantity: cardinality — the count of APPROVED RateCards per
          firm. Forward action (approve new card) increments the count; the
          compensating action (auto-supersede prior APPROVED card) decrements
          it. Net count MUST remain 1.
        test_recipe:
          setup:
            - "Firm with APPROVED 2026 card (count of APPROVED = 1)"
            - "Firm creates, submits, and approves 2027 card"
          setup_api_calls:
