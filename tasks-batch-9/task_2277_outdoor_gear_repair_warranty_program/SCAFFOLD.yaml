# ============================================================================
# PRD Benchmark Scaffold — Outdoor Gear Repair & Warranty Program
# Difficulty band: beyond Expert (§0.4) — 14 entities, 56 endpoints, 8 state
# machines (2 parallel dimensions + 3 cycles), 7 calculations, 45 ordered
# validations, 2 OCC races, 3 conserved quantities.
# ============================================================================

scenario: "2277. Outdoor Gear Repair & Warranty Program (outdoor equipment brand service center): warranty claim intake with proof of purchase, defect assessment and defect-versus-wear determination, repair versus replacement decision rules by product age, category and repair cost thresholds, repair operations with technician skill routing across fabric, zipper, frame and insulation work, non-warranty paid repair pricing with estimates and customer approval, parts inventory for discontinued models with substitution policy, turnaround time commitments with seasonal surge management, trade-in and refurbished resale integration for irreparable items, repairability design feedback to product teams and lifetime warranty liability tracking"

domain_name: outdoor-gear-repair-warranty-program
api_prefix: /gear-service

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - selector_policy
    - derived_field_reconciliation
    - ops_run_checkpoint

  entity_topology: flat
  # flat: every business entity is a peer collection under /gear-service with FK
  # references in the body; no entity is nested inside another entity's URL path.
  # The only sub-resource GETs are reverse-reachability reads (estimates,
  # liability-entries, surge-windows), never creation paths.

  state_machine_shape: parallel
  # RepairOrder carries two independent dimensions (work_status x billing_status)
  # that advance on different endpoints and gate each other by precondition.
  # WarrantyClaim is cyclic (INFO_REQUESTED loop, bounded at 2) AND branching
  # (one decision endpoint forks into 4 outcomes with divergent side effects).
  # PartLot is cyclic (AVAILABLE -> LOW -> DEPLETED -> AVAILABLE on restock).
  # ServiceCenter.liability_posture is a compound/derived posture over children.

  relationship_patterns:
    - one_to_many          # ServiceCenter -> WarrantyClaim/Technician/SurgeWindow/RepairOrder
    - self_referential     # GearModel.successor_model_id -> GearModel (cycle-checked)
    - cross_aggregate      # PartsReservation couples RepairOrder to PartLot inventory
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The technician who authored any ClaimAssessment on a claim MUST NOT be the
  # technician who signs the QC inspection of that claim's RepairOrder.
  # Warranty-replacement authorization under CONSTRAINED posture requires a
  # ProgramAdmin, who is barred from authoring assessments.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  # ---------------------------------------------------------------- config
  - name: ServiceCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: service center display name
        constraints: 1..120 chars, non-blank
      - name: region_code
        type: string
        source: input
        description: ISO-3166-2 style region code of the center
        constraints: 2..8 chars, uppercase
      - name: liability_cap_cents
        type: integer
        source: input
        description: warranty liability ceiling used by the posture rule
        constraints: ">= 1"
      - name: bench_capacity_blocks_per_day
        type: integer
        source: input
        default: 24
        description: max SCHEDULED WorkBlock rows allowed per UTC calendar date at this center
        constraints: "1..200"
      - name: open_liability_cents
        type: integer
        source: computed
        default: 0
        description: "sum of LiabilityEntry.reserved_amount_cents with status == OPEN over claims whose service_center_id == this center (calculations.liability_exposure_rollup)"
      - name: liability_utilization_pct
        type: number
        source: computed
        default: 0
        description: "display-only round_half_up(100 * open_liability_cents / liability_cap_cents, 2); never used as a posture comparator"
      - name: liability_posture
        type: enum
        source: computed
        default: OPEN
        description: derived posture gating warranty decisions
        constraints: OPEN | CONSTRAINED | FROZEN
      - name: active_queue_depth
        type: integer
        source: computed
        default: 0
        description: "count of RepairOrder rows with service_center_id == this center and work_status IN {QUEUED, IN_WORK, BENCH_DONE}; recomputed AFTER each order insert"
      - name: current_surge_multiplier
        type: number
        source: computed
        default: 1.0
        description: "surge multiplier implied by active_queue_depth tier and any ACTIVE SurgeWindow covering the logical clock date (calculations.turnaround_commitment step 3)"
      - name: breached_commitment_count
        type: integer
        source: computed
        default: 0
        description: number of RepairOrder rows flagged commitment_breached by the most recent queue-review
      - name: last_queue_review_at
        type: datetime
        source: computed
        description: logical-clock timestamp of the most recent queue-review, null before the first run

  - name: GearModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: catalog code, unique across all GearModel rows
        constraints: 3..32 chars, uppercase/digits/hyphen
      - name: name
        type: string
        source: input
        description: marketing name of the model
      - name: category
        type: enum
        source: input
        description: product category driving repair caps and base turnaround
        constraints: SHELL_APPAREL | INSULATION | TENT_SHELTER | PACK_HARNESS | HARDGOODS_FRAME
      - name: msrp_cents
        type: integer
        source: input
        description: current list price of this model
        constraints: ">= 1"
      - name: release_year
        type: integer
        source: input
        description: model-year of first sale
        constraints: "2000..2100"
      - name: warranty_years
        type: integer
        source: input
        description: limited-warranty duration in whole years from purchase_date
        constraints: "0..30"
      - name: lifetime_warranty
        type: boolean
        source: input
        default: false
        description: when true the model carries lifetime coverage and adds LIFETIME_BONUS_PCT to the repair cap
      - name: discontinued_at
        type: datetime
        source: input
        description: instant the model left the line; null while in production
      - name: successor_model_id
        type: string
        source: input
        description: "FK -> GearModel.id; successor consulted by calculations.replacement_value variant SUCCESSOR_MSRP and by the parts substitution policy; null when none"
      - name: parts_support_status
        type: enum
        source: computed
        default: NO_SUPPORT
        description: "SUPPORTED when a PartLot with this gear_model_id has status IN {AVAILABLE, LOW}; else SUBSTITUTION_ONLY when a PartLot with gear_model_id == this.successor_model_id has substitution_allowed == true, substitute_for_part_code != null and status IN {AVAILABLE, LOW}; else NO_SUPPORT"
        constraints: SUPPORTED | SUBSTITUTION_ONLY | NO_SUPPORT
      - name: defect_claim_count
        type: integer
        source: computed
        default: 0
        description: count of WarrantyClaim rows on items of this model whose decision IN {WARRANTY_REPAIR, WARRANTY_REPLACE}
      - name: wear_denial_count
        type: integer
        source: computed
        default: 0
        description: count of WarrantyClaim rows on items of this model whose status == WEAR_DENIED
      - name: irreparable_count
        type: integer
        source: computed
        default: 0
        description: count of RepairOrder rows on items of this model whose work_status == IRREPARABLE
      - name: repairability_flag
        type: enum
        source: computed
        default: NONE
        description: "design-feedback signal recomputed on every counter change: REDESIGN_REQUESTED when defect_claim_count >= 5 AND irreparable_count >= 2; else WATCH when defect_claim_count >= 3; else NONE"
        constraints: NONE | WATCH | REDESIGN_REQUESTED

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: login/contact address, unique across all Customer rows
        constraints: contains '@', 5..120 chars
      - name: full_name
        type: string
        source: input
        description: customer display name
      - name: loyalty_tier
        type: enum
        source: input
        default: STANDARD
        description: drives LOYALTY_DISCOUNT_PCT on paid-repair invoices
        constraints: STANDARD | PRO
      - name: lifetime_claim_count
        type: integer
        source: computed
        default: 0
        description: count of WarrantyClaim rows on items owned by this customer whose status != DRAFT
      - name: trade_in_credit_cents
        type: integer
        source: computed
        default: 0
        description: running sum of GearItem.trade_in_credit_cents granted to this customer

  # ---------------------------------------------------------------- resources
  - name: GearItem
    parent: null
    common_fields: true
    fields:
      - name: gear_model_id
        type: string
        source: input
        description: "FK -> GearModel.id; the catalog model this physical unit instantiates"
      - name: owner_customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the registered owner who may file claims and approve estimates"
      - name: serial_number
        type: string
        source: input
        description: manufacturer serial, unique per gear_model_id
        constraints: 3..40 chars
      - name: purchase_date
        type: datetime
        source: input
        description: retail purchase instant, must be <= logical clock now
      - name: purchase_price_cents
        type: integer
        source: input
        description: price actually paid, basis of the DEPRECIATED_PURCHASE valuation
        constraints: ">= 0"
      - name: proof_of_purchase_type
        type: enum
        source: input
        default: NONE
        description: proof channel presented at intake
        constraints: RECEIPT | REGISTRATION | RETAILER_LOOKUP | NONE
      - name: proof_of_purchase_ref
        type: string
        source: input
        description: receipt/registration reference string, null when proof_of_purchase_type == NONE
      - name: condition_grade
        type: enum
        source: input
        description: cosmetic grade used by calculations.trade_in_credit; null until graded
        constraints: A | B | C
      - name: disposition_status
        type: enum
        source: computed
        default: WITH_CUSTOMER
        description: custody/afterlife state machine of the physical unit
        constraints: WITH_CUSTOMER | AT_CENTER | IN_REPAIR | IRREPARABLE_HOLD | RETURNED | TRADED_IN | REFURB_LISTED | RESOLD | RECYCLED
      - name: age_months
        type: integer
        source: computed
        description: "whole months from purchase_date to logical clock now, floor (a month elapses when the day-of-month is reached)"
      - name: warranty_state
        type: enum
        source: computed
        default: IN_WARRANTY
        description: "LIFETIME when model.lifetime_warranty; else IN_WARRANTY when clock_now <= purchase_date + model.warranty_years calendar years; else EXPIRED"
        constraints: IN_WARRANTY | EXPIRED | LIFETIME
      - name: replacement_value_depreciated_cents
        type: integer
        source: computed
        description: "calculations.replacement_value variant DEPRECIATED_PURCHASE (chronological, purchase-price basis)"
      - name: replacement_value_successor_cents
        type: integer
        source: computed
        description: "calculations.replacement_value variant SUCCESSOR_MSRP (forward-looking, current-catalog basis)"
      - name: trade_in_credit_cents
        type: integer
        source: computed
        default: 0
        description: credit granted at trade-in (calculations.trade_in_credit); 0 until disposition_status == TRADED_IN
      - name: refurb_list_price_cents
        type: integer
        source: computed
        description: "round_half_up(replacement_value_successor_cents * REFURB_LIST_PCT); set at trade-in, null before"
      - name: resale_price_cents
        type: integer
        source: computed
        description: price captured when disposition_status becomes RESOLD; null otherwise

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: input
        description: "FK -> ServiceCenter.id; center that owns intake, liability and turnaround for this claim"
      - name: gear_item_id
        type: string
        source: input
        description: "FK -> GearItem.id; the unit whose defect is claimed"
      - name: intake_kind
        type: enum
        source: input
        default: WARRANTY_CLAIM
        description: WARRANTY_CLAIM demands proof of purchase and unexpired coverage at submit; PAID_REPAIR_REQUEST waives both
        constraints: WARRANTY_CLAIM | PAID_REPAIR_REQUEST
      - name: reported_defect_type
        type: enum
        source: input
        description: customer-reported failure mode
        constraints: SEAM_FAILURE | ZIPPER_FAILURE | DELAMINATION | FRAME_FRACTURE | INSULATION_LOSS | ABRASION_WEAR
      - name: customer_narrative
        type: string
        source: input
        description: free-text description supplied at intake
        constraints: 1..2000 chars
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: claim lifecycle state (cyclic through INFO_REQUESTED, branching at decision)
        constraints: DRAFT | SUBMITTED | INFO_REQUESTED | UNDER_ASSESSMENT | WARRANTY_APPROVED | REPLACEMENT_AUTHORIZED | PAID_REPAIR_OFFERED | WEAR_DENIED | CLOSED_FULFILLED | CLOSED_REPLACED | CLOSED_DECLINED
      - name: proof_verified
        type: boolean
        source: computed
        default: false
        description: "true when gear item's proof_of_purchase_type != NONE AND proof_of_purchase_ref != null; recomputed whenever the item's proof fields change"
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent submit/resubmit; null while DRAFT
      - name: info_request_count
        type: integer
        source: computed
        default: 0
        description: number of info-requests issued; the cycle terminates at MAX_INFO_REQUESTS
      - name: assessment_count
        type: integer
        source: computed
        default: 0
        description: number of ClaimAssessment rows created against this claim
      - name: latest_determination
        type: enum
        source: computed
        description: determination of the newest non-superseded ClaimAssessment; null before the first assessment
        constraints: MANUFACTURING_DEFECT | NORMAL_WEAR | USER_DAMAGE | INCONCLUSIVE
      - name: latest_repair_cost_cents
        type: integer
        source: computed
        description: estimated_repair_cost_cents of the newest non-superseded ClaimAssessment; null before the first assessment
      - name: decision
        type: enum
        source: computed
        description: outcome recorded by the decision endpoint; null before decision
        constraints: WARRANTY_REPAIR | WARRANTY_REPLACE | PAID_REPAIR_OFFERED | WEAR_DENIED
      - name: decision_threshold_pct
        type: number
        source: computed
        description: "threshold_pct output of calculations.repair_versus_replace at decision time"
      - name: repair_ratio_pct
        type: number
        source: computed
        description: "repair_ratio_pct output of calculations.repair_versus_replace at decision time"
      - name: decision_by_role
        type: enum
        source: computed
        description: role of the actor that recorded the decision; null before decision
        constraints: ServiceAgent | ProgramAdmin
      - name: decided_at
        type: datetime
        source: computed
        description: logical-clock instant of the decision; null before decision

  - name: ClaimAssessment
    parent: null
    common_fields: false
    fields:
      - name: warranty_claim_id
        type: string
        source: input
        description: "FK -> WarrantyClaim.id; claim this bench assessment belongs to"
      - name: assessor_technician_id
        type: string
        source: system
        description: "FK -> Technician.id; taken from X-User-ID of the acting RepairTechnician, never from the body"
      - name: determination
        type: enum
        source: input
        description: defect-versus-wear finding
        constraints: MANUFACTURING_DEFECT | NORMAL_WEAR | USER_DAMAGE | INCONCLUSIVE
      - name: defect_notes
        type: string
        source: input
        description: bench notes justifying the determination
        constraints: 1..2000 chars
      - name: required_work_types
        type: array
        source: input
        description: distinct work types the repair needs
        constraints: "non-empty array of FABRIC | ZIPPER | FRAME | INSULATION, no duplicates"
      - name: estimated_labor_lines
        type: array
        source: input
        description: "array of { work_type, minutes } bench-standard estimates; one line per work_type, work_type set must equal required_work_types"
        constraints: "minutes 1..600 per line"
      - name: estimated_parts_cents
        type: integer
        source: input
        description: estimated parts spend for the repair
        constraints: ">= 0"
      - name: estimated_repair_cost_cents
        type: integer
        source: computed
        description: "calculations.paid_repair_pricing labor block on estimated_labor_lines + estimated_parts_cents + shop supply fee (no discount, expedite or tax)"
      - name: is_superseded
        type: boolean
        source: computed
        default: false
        description: true once a newer ClaimAssessment exists on the same claim

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: input
        description: "FK -> ServiceCenter.id; the bench this technician staffs"
      - name: full_name
        type: string
        source: input
        description: technician display name
      - name: employee_code
        type: string
        source: input
        description: staff code, unique across all Technician rows
        constraints: 2..24 chars
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: staffing state; only ACTIVE technicians may take assessments or work blocks
        constraints: ACTIVE | ON_LEAVE | INACTIVE
      - name: certifications
        type: array
        source: input
        description: "array of { work_type, level } skill grants; level 1..3, at most one entry per work_type"
        constraints: "non-empty; work_type in FABRIC | ZIPPER | FRAME | INSULATION"
      - name: scheduled_minutes_open
        type: integer
        source: computed
        default: 0
        description: "sum of WorkBlock.duration_minutes for this technician with status == SCHEDULED (conserved quantity of compensating invariant technician_minutes)"
      - name: completed_minutes
        type: integer
        source: computed
        default: 0
        description: sum of WorkBlock.actual_minutes for this technician with status == COMPLETED

  - name: WorkBlock
    parent: null
    common_fields: true
    fields:
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; optional in the request body — when omitted the server routes via calculations.technician_routing_selector and stamps the winner here"
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the order this bench block services"
      - name: work_type
        type: enum
        source: input
        description: skill lane occupied by the block
        constraints: FABRIC | ZIPPER | FRAME | INSULATION
      - name: start_at
        type: datetime
        source: input
        description: inclusive start of the bench occupation
      - name: end_at
        type: datetime
        source: input
        description: exclusive end of the bench occupation (half-open interval)
      - name: duration_minutes
        type: integer
        source: computed
        description: whole minutes between start_at and end_at
      - name: actual_minutes
        type: integer
        source: computed
        description: minutes logged at bench-complete; null while SCHEDULED
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: occupation state
        constraints: SCHEDULED | COMPLETED | CANCELLED
      - name: routed_by_selector
        type: boolean
        source: computed
        default: false
        description: true when technician_id was chosen by the routing selector rather than supplied

  - name: SurgeWindow
    parent: null
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: input
        description: "FK -> ServiceCenter.id; center whose turnaround this seasonal window inflates"
      - name: label
        type: string
        source: input
        description: season label, e.g. 'Fall shoulder surge'
      - name: start_date
        type: datetime
        source: input
        description: first covered instant, INCLUSIVE
      - name: end_date
        type: datetime
        source: input
        description: last covered instant, INCLUSIVE (closed interval on both ends)
      - name: multiplier
        type: number
        source: input
        description: turnaround multiplier asserted for the window
        constraints: "1.0..3.0, at most 2 decimals"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: ACTIVE until a queue-review observes end_date < clock now, then RETIRED
        constraints: ACTIVE | RETIRED

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: system
        description: "FK -> ServiceCenter.id; copied from the claim at creation"
      - name: warranty_claim_id
        type: string
        source: input
        description: "FK -> WarrantyClaim.id; every order originates from a decided claim"
      - name: gear_item_id
        type: string
        source: system
        description: "FK -> GearItem.id; copied from the claim at creation"
      - name: order_kind
        type: enum
        source: computed
        description: "WARRANTY_REPAIR when claim.decision == WARRANTY_REPAIR; PAID_REPAIR when claim.decision == PAID_REPAIR_OFFERED"
        constraints: WARRANTY_REPAIR | PAID_REPAIR
      - name: work_status
        type: enum
        source: computed
        default: QUEUED
        description: bench dimension of the parallel state machine
        constraints: QUEUED | IN_WORK | BENCH_DONE | QC_PASSED | RELEASED | IRREPARABLE | CLOSED_UNREPAIRED
      - name: billing_status
        type: enum
        source: computed
        description: money dimension of the parallel state machine; NOT_BILLABLE for WARRANTY_REPAIR orders, ESTIMATE_PENDING for PAID_REPAIR orders
        constraints: NOT_BILLABLE | ESTIMATE_PENDING | ESTIMATE_SENT | ESTIMATE_APPROVED | ESTIMATE_DECLINED | INVOICED | PAID
      - name: required_work_types
        type: array
        source: computed
        description: copied from the claim's newest non-superseded ClaimAssessment at creation
      - name: expedite_requested
        type: boolean
        source: input
        default: false
        description: when true a FINAL invoice adds EXPEDITE_FEE_CENTS; ignored by PROVISIONAL estimates
      - name: queue_depth_snapshot
        type: integer
        source: computed
        description: "center queue depth measured BEFORE this order was inserted (calculations.turnaround_commitment step 1)"
      - name: surge_multiplier_applied
        type: number
        source: computed
        description: multiplier frozen onto the order at creation
      - name: parts_wait_days
        type: integer
        source: computed
        description: "days added for parts availability, from the model's parts_support_status as observed BEFORE any reservation created by this call"
      - name: promised_days
        type: integer
        source: computed
        description: "ceil(base_days * surge_multiplier_applied) + parts_wait_days"
      - name: promised_return_at
        type: datetime
        source: computed
        description: "creation date + promised_days calendar days at 23:59:59.999Z"
      - name: commitment_breached
        type: boolean
        source: computed
        default: false
        description: set by queue-review when clock now > promised_return_at and work_status is non-terminal
      - name: qc_fail_count
        type: integer
        source: computed
        default: 0
        description: failed QC inspections; the third failure forces IRREPARABLE
      - name: provisional_estimate_total_cents
        type: integer
        source: computed
        description: total_cents of the APPROVED PROVISIONAL RepairEstimate; null for warranty orders
      - name: final_invoice_total_cents
        type: integer
        source: computed
        description: total_cents of the FINAL RepairEstimate minted at invoice; null before invoicing
      - name: paid_amount_cents
        type: integer
        source: computed
        default: 0
        description: cumulative payments recorded against this order
      - name: released_at
        type: datetime
        source: computed
        description: logical-clock instant of release-to-customer; null otherwise

  - name: RepairEstimate
    parent: null
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; the order being priced"
      - name: variant
        type: enum
        source: computed
        description: "PROVISIONAL for customer-facing quotes minted in SENT; FINAL for the invoice row minted directly in INVOICED"
        constraints: PROVISIONAL | FINAL
      - name: status
        type: enum
        source: computed
        default: SENT
        description: quote lifecycle
        constraints: SENT | APPROVED | DECLINED | EXPIRED | SUPERSEDED | INVOICED | PAID
      - name: labor_lines
        type: array
        source: input
        description: "array of { work_type, minutes }; for FINAL rows the server derives it from COMPLETED WorkBlock actual_minutes grouped by work_type"
      - name: parts_lines
        type: array
        source: input
        description: "array of { part_code, units, unit_price_cents }; for FINAL rows the server derives it from CONSUMED PartsReservation rows priced at PartLot.unit_price_cents"
      - name: labor_subtotal_cents
        type: integer
        source: computed
        description: sum of per-line rounded labor charges (rounding order pinned in calculations.paid_repair_pricing)
      - name: parts_subtotal_cents
        type: integer
        source: computed
        description: sum of units * unit_price_cents over parts_lines
      - name: shop_supply_fee_cents
        type: integer
        source: computed
        description: "min(SUPPLY_FEE_CAP_CENTS, round_half_up(SUPPLY_FEE_PCT * labor_subtotal_cents))"
      - name: subtotal_cents
        type: integer
        source: computed
        description: labor_subtotal_cents + parts_subtotal_cents + shop_supply_fee_cents
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * LOYALTY_DISCOUNT_PCT[owner.loyalty_tier])"
      - name: expedite_fee_cents
        type: integer
        source: computed
        default: 0
        description: EXPEDITE_FEE_CENTS on FINAL rows when the order has expedite_requested; always 0 on PROVISIONAL rows
      - name: tax_cents
        type: integer
        source: computed
        description: "round_half_up(TAX_PCT * (subtotal_cents - loyalty_discount_cents + expedite_fee_cents))"
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents - loyalty_discount_cents + expedite_fee_cents + tax_cents
      - name: valid_until
        type: datetime
        source: computed
        description: creation instant + ESTIMATE_VALIDITY_DAYS; only meaningful for PROVISIONAL rows
      - name: decided_at
        type: datetime
        source: computed
        description: instant of approve/decline; null otherwise

  - name: PartLot
    parent: null
    common_fields: true
    fields:
      - name: gear_model_id
        type: string
        source: input
        description: "FK -> GearModel.id; model this lot is stocked for"
      - name: part_code
        type: string
        source: input
        description: service part code, unique per gear_model_id
        constraints: 3..40 chars
      - name: part_kind
        type: enum
        source: input
        description: physical class of the part, matched by the substitution policy
        constraints: FABRIC_PANEL | ZIPPER_SLIDER | FRAME_SEGMENT | INSULATION_FILL | BUCKLE
      - name: on_hand_units
        type: integer
        source: input
        constraints: ">= 0"
        description: "physical units in the bin; supplied once at lot creation and thereafter moved only by lot adjustments and CONSUMED reservations (conserved quantity of compensating invariant parts_units)"
      - name: reserved_units
        type: integer
        source: computed
        default: 0
        description: "sum of PartsReservation.units with status == RESERVED against this lot"
      - name: available_units
        type: integer
        source: computed
        description: on_hand_units - reserved_units
      - name: unit_price_cents
        type: integer
        source: input
        description: price per unit charged on FINAL invoices
        constraints: ">= 0"
      - name: low_watermark_units
        type: integer
        source: input
        default: 2
        description: available_units at or below this value (and above zero) marks the lot LOW
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: AVAILABLE
        description: "DEPLETED when available_units == 0; LOW when 1 <= available_units <= low_watermark_units; else AVAILABLE"
        constraints: AVAILABLE | LOW | DEPLETED
      - name: substitution_allowed
        type: boolean
        source: input
        default: false
        description: when true this lot may serve a discontinued part code named by substitute_for_part_code
      - name: substitute_for_part_code
        type: string
        source: input
        description: the discontinued part code this lot substitutes; null unless substitution_allowed

  - name: PartsReservation
    parent: null
    common_fields: true
    fields:
      - name: repair_order_id
        type: string
        source: input
        description: "FK -> RepairOrder.id; order consuming the parts"
      - name: part_lot_id
        type: string
        source: input
        description: "FK -> PartLot.id; lot the units are drawn from"
      - name: required_part_code
        type: string
        source: input
        description: part code the repair actually needs; equal to the lot's part_code unless this is a substitution
      - name: units
        type: integer
        source: input
        description: units reserved
        constraints: ">= 1"
      - name: is_substitution
        type: boolean
        source: computed
        default: false
        description: true when part_lot.part_code != required_part_code and the substitution policy allowed the draw
      - name: status
        type: enum
        source: computed
        default: RESERVED
        description: reservation lifecycle
        constraints: RESERVED | CONSUMED | RELEASED
      - name: settled_at
        type: datetime
        source: computed
        description: instant of consume or release; null while RESERVED

  - name: LiabilityEntry
    parent: null
    common_fields: true
    fields:
      - name: warranty_claim_id
        type: string
        source: input
        description: "FK -> WarrantyClaim.id; claim whose exposure this entry reserves"
      - name: basis
        type: enum
        source: computed
        description: REPAIR entries reserve bench cost; REPLACEMENT entries reserve catalog replacement exposure
        constraints: REPAIR | REPLACEMENT
      - name: valuation_variant
        type: enum
        source: computed
        description: "which calculations.replacement_value variant produced reserved_amount_cents: DEPRECIATED_PURCHASE caps REPAIR entries, SUCCESSOR_MSRP prices REPLACEMENT entries"
        constraints: DEPRECIATED_PURCHASE | SUCCESSOR_MSRP
      - name: reserved_amount_cents
        type: integer
        source: computed
        description: "REPAIR: min(claim.latest_repair_cost_cents, item.replacement_value_depreciated_cents); REPLACEMENT: item.replacement_value_successor_cents"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: OPEN entries count toward ServiceCenter.open_liability_cents; RELEASED entries do not
        constraints: OPEN | RELEASED
      - name: release_reason
        type: enum
        source: computed
        description: why the entry was released; null while OPEN
        constraints: ORDER_RELEASED | REVALUED_TO_REPLACEMENT | CLAIM_CLOSED
      - name: released_at
        type: datetime
        source: computed
        description: instant of release; null while OPEN

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:

  # -------------------------------------------------------- claim (cyclic + branching)
  - entity: WarrantyClaim
    state_field: status
    initial_state: DRAFT
    terminal_states: [WEAR_DENIED, CLOSED_FULFILLED, CLOSED_REPLACED, CLOSED_DECLINED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /gear-service/warranty-claims/{id}/submit"
        actor: Customer | ServiceAgent
        preconditions:
          - "status == DRAFT"
          - "intake_kind == PAID_REPAIR_REQUEST OR proof_verified == true"
          - "intake_kind == PAID_REPAIR_REQUEST OR gear_item.warranty_state IN {IN_WARRANTY, LIFETIME}"
          - "acting Customer's X-User-ID == gear_item.owner_customer_id (Customer role only)"
        side_effects:
          - "submitted_at = clock now"
          - "GearItem.disposition_status: WITH_CUSTOMER -> AT_CENTER"
          - "Customer.lifetime_claim_count += 1 (owner of the gear item)"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /gear-service/warranty-claims/{id}/info-requests"
        actor: ServiceAgent
        preconditions:
          - "status IN {SUBMITTED, UNDER_ASSESSMENT}"
          - "info_request_count < MAX_INFO_REQUESTS (2)"
        side_effects:
          - "info_request_count += 1"
      - from: UNDER_ASSESSMENT
        to: INFO_REQUESTED
        trigger: "POST /gear-service/warranty-claims/{id}/info-requests"
        actor: ServiceAgent
        preconditions:
          - "status IN {SUBMITTED, UNDER_ASSESSMENT}"
          - "info_request_count < MAX_INFO_REQUESTS (2)"
        side_effects:
          - "info_request_count += 1"
        note: "second leg of the documentation cycle; the newest assessment stays non-superseded"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /gear-service/warranty-claims/{id}/resubmit"
        actor: Customer | ServiceAgent
        preconditions:
          - "status == INFO_REQUESTED"
          - "acting Customer's X-User-ID == gear_item.owner_customer_id (Customer role only)"
        side_effects:
          - "when proof_of_purchase_type/proof_of_purchase_ref supplied: write them onto the GearItem (updated_at + version bump on the item)"
          - "recompute WarrantyClaim.proof_verified from the item's proof fields"
          - "submitted_at = clock now"
        note: "closes the cycle DRAFT->SUBMITTED->INFO_REQUESTED->SUBMITTED; bounded by MAX_INFO_REQUESTS"
      - from: SUBMITTED
        to: UNDER_ASSESSMENT
        trigger: "POST /gear-service/warranty-claims/{id}/assessments"
        actor: RepairTechnician
        preconditions:
          - "status == SUBMITTED"
          - "expected_claim_version == WarrantyClaim.version (concurrency_rules assessment-create-stale-claim)"
          - "acting Technician.status == ACTIVE"
          - "acting Technician.service_center_id == WarrantyClaim.service_center_id"
          - "acting Technician holds a certification for every entry in required_work_types at level >= WORK_TYPE_MIN_LEVEL"
        side_effects:
          - "create ClaimAssessment with estimated_repair_cost_cents (calculations.paid_repair_pricing labor block)"
          - "assessment_count += 1; latest_determination and latest_repair_cost_cents copied from the new row"
          - "WarrantyClaim.version += 1"
      - from: UNDER_ASSESSMENT
        to: UNDER_ASSESSMENT
        trigger: "POST /gear-service/warranty-claims/{id}/assessments"
        actor: RepairTechnician
        preconditions:
          - "status == UNDER_ASSESSMENT"
          - "expected_claim_version == WarrantyClaim.version"
          - "same technician preconditions as SUBMITTED -> UNDER_ASSESSMENT"
        side_effects:
          - "every prior ClaimAssessment on this claim gets is_superseded = true"
          - "create the new ClaimAssessment; assessment_count += 1; latest_determination and latest_repair_cost_cents overwritten"
          - "WarrantyClaim.version += 1"
        note: "self-loop re-assessment: this is the legitimate supersede that makes the OCC rule a true race"
      - from: UNDER_ASSESSMENT
        to: WARRANTY_APPROVED
        trigger: "POST /gear-service/warranty-claims/{id}/decision"
        actor: ServiceAgent | ProgramAdmin
        preconditions:
          - "status == UNDER_ASSESSMENT"
          - "latest_determination != INCONCLUSIVE"
          - "ServiceCenter.liability_posture != FROZEN"
          - "calculations.repair_versus_replace resolves to WARRANTY_REPAIR"
        side_effects:
          - "decision = WARRANTY_REPAIR; decision_threshold_pct, repair_ratio_pct, decided_at, decision_by_role stamped"
          - "CASCADE hop 1: create LiabilityEntry(basis REPAIR, valuation_variant DEPRECIATED_PURCHASE, status OPEN, reserved_amount_cents = min(latest_repair_cost_cents, gear_item.replacement_value_depreciated_cents))"
          - "CASCADE hop 2: that new OPEN entry makes ServiceCenter.open_liability_cents += reserved_amount_cents and liability_utilization_pct recompute"
          - "CASCADE hop 3: the new open_liability_cents re-derives ServiceCenter.liability_posture (OPEN -> CONSTRAINED -> FROZEN per calculations.liability_exposure_rollup)"
          - "GearModel.defect_claim_count += 1, then GearModel.repairability_flag re-derived from the new counters"
      - from: UNDER_ASSESSMENT
        to: REPLACEMENT_AUTHORIZED
        trigger: "POST /gear-service/warranty-claims/{id}/decision"
        actor: ServiceAgent | ProgramAdmin
        preconditions:
          - "status == UNDER_ASSESSMENT"
          - "latest_determination != INCONCLUSIVE"
          - "ServiceCenter.liability_posture != FROZEN"
          - "when ServiceCenter.liability_posture == CONSTRAINED: X-User-Role == ProgramAdmin"
          - "calculations.repair_versus_replace resolves to WARRANTY_REPLACE"
        side_effects:
          - "decision = WARRANTY_REPLACE; decision_threshold_pct, repair_ratio_pct, decided_at, decision_by_role stamped"
          - "create LiabilityEntry(basis REPLACEMENT, valuation_variant SUCCESSOR_MSRP, status OPEN, reserved_amount_cents = gear_item.replacement_value_successor_cents)"
          - "ServiceCenter.open_liability_cents += reserved_amount_cents, then liability_posture re-derived"
          - "GearItem.disposition_status: AT_CENTER -> IRREPARABLE_HOLD (no repair order is ever created on this branch)"
          - "GearModel.defect_claim_count += 1, then repairability_flag re-derived"
        note: "divergent branch of the same trigger: no RepairOrder is permitted afterwards, and the item goes straight to the trade-in lane"
      - from: UNDER_ASSESSMENT
        to: PAID_REPAIR_OFFERED
        trigger: "POST /gear-service/warranty-claims/{id}/decision"
        actor: ServiceAgent | ProgramAdmin
        preconditions:
          - "status == UNDER_ASSESSMENT"
          - "latest_determination != INCONCLUSIVE"
          - "calculations.repair_versus_replace resolves to PAID_REPAIR_OFFERED"
        side_effects:
          - "decision = PAID_REPAIR_OFFERED; decided_at, decision_by_role stamped"
          - "no LiabilityEntry is created and ServiceCenter.open_liability_cents is unchanged (the brand carries no exposure on paid work)"
      - from: UNDER_ASSESSMENT
        to: WEAR_DENIED
        trigger: "POST /gear-service/warranty-claims/{id}/decision"
        actor: ServiceAgent | ProgramAdmin
        preconditions:
          - "status == UNDER_ASSESSMENT"
          - "latest_determination != INCONCLUSIVE"
          - "calculations.repair_versus_replace resolves to WEAR_DENIED"
        side_effects:
          - "decision = WEAR_DENIED; decided_at, decision_by_role stamped"
          - "GearModel.wear_denial_count += 1 (repairability feedback signal; defect_claim_count untouched)"
          - "GearItem.disposition_status stays AT_CENTER; no LiabilityEntry, no RepairOrder"
      - from: WARRANTY_APPROVED
        to: CLOSED_FULFILLED
        trigger: "POST /gear-service/repair-orders/{id}/release-to-customer (cascade from the order)"
        actor: system
        preconditions:
          - "the claim's RepairOrder reached work_status RELEASED"
        side_effects:
          - "LiabilityEntry(basis REPAIR, status OPEN) -> RELEASED with release_reason ORDER_RELEASED"
          - "ServiceCenter.open_liability_cents -= released amount, then liability_posture re-derived"
      - from: PAID_REPAIR_OFFERED
        to: CLOSED_FULFILLED
        trigger: "POST /gear-service/repair-orders/{id}/release-to-customer (cascade from the order)"
        actor: system
        preconditions:
          - "the claim's RepairOrder reached work_status RELEASED"
        side_effects:
          - "no liability movement (paid orders never opened an entry)"
      - from: PAID_REPAIR_OFFERED
        to: CLOSED_DECLINED
        trigger: "POST /gear-service/repair-estimates/{id}/decline (cascade from the estimate)"
        actor: system
        preconditions:
          - "the declined estimate is the order's only SENT PROVISIONAL row"
        side_effects:
          - "RepairOrder.work_status -> CLOSED_UNREPAIRED, billing_status -> ESTIMATE_DECLINED"
          - "GearItem.disposition_status -> RETURNED"
      - from: WARRANTY_APPROVED
        to: CLOSED_REPLACED
        trigger: "POST /gear-service/gear-items/{id}/trade-in (cascade from the item)"
        actor: system
        preconditions:
          - "GearItem.disposition_status == IRREPARABLE_HOLD"
        side_effects:
          - "every OPEN LiabilityEntry on this claim -> RELEASED with release_reason CLAIM_CLOSED"
          - "ServiceCenter.open_liability_cents -= released amounts, then liability_posture re-derived"
      - from: REPLACEMENT_AUTHORIZED
        to: CLOSED_REPLACED
        trigger: "POST /gear-service/gear-items/{id}/trade-in (cascade from the item)"
        actor: system
        preconditions:
          - "GearItem.disposition_status == IRREPARABLE_HOLD"
        side_effects:
          - "every OPEN LiabilityEntry on this claim -> RELEASED with release_reason CLAIM_CLOSED"
          - "ServiceCenter.open_liability_cents -= released amounts, then liability_posture re-derived"

  # -------------------------------------------------------- order: bench dimension
  - entity: RepairOrder
    state_field: work_status
    initial_state: QUEUED
    terminal_states: [RELEASED, IRREPARABLE, CLOSED_UNREPAIRED]
    transitions:
      - from: QUEUED
        to: IN_WORK
        trigger: "POST /gear-service/work-blocks (cascade from the first block on this order)"
        actor: system
        preconditions:
          - "work_status == QUEUED"
          - "billing_status IN {NOT_BILLABLE, ESTIMATE_APPROVED}"
        side_effects:
          - "WorkBlock created SCHEDULED; Technician.scheduled_minutes_open += duration_minutes"
          - "ServiceCenter.active_queue_depth unchanged (QUEUED and IN_WORK both count toward it)"
        note: "the bench dimension refuses to start while the money dimension is still ESTIMATE_PENDING / ESTIMATE_SENT"
      - from: IN_WORK
        to: BENCH_DONE
        trigger: "POST /gear-service/repair-orders/{id}/bench-complete"
        actor: RepairTechnician
        preconditions:
          - "work_status == IN_WORK"
          - "every work_block_id in work_log has repair_order_id == this order"
          - "every work_block_id in work_log has status == SCHEDULED"
          - "after applying work_log, every entry of required_work_types has at least one COMPLETED WorkBlock"
        side_effects:
          - "each listed WorkBlock: status -> COMPLETED, actual_minutes stamped"
          - "Technician.scheduled_minutes_open -= duration_minutes and completed_minutes += actual_minutes per block"
      - from: BENCH_DONE
        to: QC_PASSED
        trigger: "POST /gear-service/repair-orders/{id}/qc-inspections with outcome PASS"
        actor: RepairTechnician
        preconditions:
          - "work_status == BENCH_DONE"
          - "no PartsReservation on this order remains in status RESERVED"
          - "acting Technician authored no ClaimAssessment on this order's claim (segregation of duties)"
        side_effects:
          - "work_status = QC_PASSED"
      - from: BENCH_DONE
        to: IN_WORK
        trigger: "POST /gear-service/repair-orders/{id}/qc-inspections with outcome FAIL"
        actor: RepairTechnician
        preconditions:
          - "work_status == BENCH_DONE"
          - "acting Technician authored no ClaimAssessment on this order's claim"
          - "qc_fail_count < 2 before the increment"
        side_effects:
          - "qc_fail_count += 1; work_status = IN_WORK (rework loop, new WorkBlocks required)"
        note: "cycle IN_WORK -> BENCH_DONE -> IN_WORK, bounded by QC_FAIL_LIMIT"
      - from: BENCH_DONE
        to: IRREPARABLE
        trigger: "POST /gear-service/repair-orders/{id}/qc-inspections with outcome FAIL"
        actor: RepairTechnician
        preconditions:
          - "work_status == BENCH_DONE"
          - "qc_fail_count == 2 before the increment (this is the third failure)"
        side_effects:
          - "qc_fail_count = 3; work_status = IRREPARABLE (auto-transition, no operator choice)"
          - "then the full IRREPARABLE cascade below runs identically to close-irreparable"
      - from: QUEUED
        to: IRREPARABLE
        trigger: "POST /gear-service/repair-orders/{id}/close-irreparable"
        actor: RepairTechnician | ServiceAgent
        preconditions:
          - "work_status IN {QUEUED, IN_WORK, BENCH_DONE}"
        side_effects:
          - "CASCADE hop 1: every PartsReservation on this order with status == RESERVED -> RELEASED (settled_at stamped)"
          - "CASCADE hop 2: each released reservation makes its PartLot.reserved_units -= units and available_units recompute"
          - "CASCADE hop 3: each PartLot whose available_units changed re-derives status (DEPLETED -> LOW/AVAILABLE)"
          - "CASCADE hop 4: each PartLot status change re-derives GearModel.parts_support_status for the lot's model"
          - "every SCHEDULED WorkBlock on this order -> CANCELLED, Technician.scheduled_minutes_open -= duration_minutes"
          - "for WARRANTY_REPAIR orders: the claim's OPEN REPAIR LiabilityEntry -> RELEASED (release_reason REVALUED_TO_REPLACEMENT) and a new OPEN LiabilityEntry(basis REPLACEMENT, valuation_variant SUCCESSOR_MSRP) is created; ServiceCenter.open_liability_cents adjusted by (-repair_amount + replacement_amount), then liability_posture re-derived"
          - "GearItem.disposition_status -> IRREPARABLE_HOLD"
          - "GearModel.irreparable_count += 1, then repairability_flag re-derived"
      - from: IN_WORK
        to: IRREPARABLE
        trigger: "POST /gear-service/repair-orders/{id}/close-irreparable"
        actor: RepairTechnician | ServiceAgent
        preconditions:
          - "work_status IN {QUEUED, IN_WORK, BENCH_DONE}"
        side_effects:
          - "identical cascade to QUEUED -> IRREPARABLE (parts release chain, work block cancellation, liability revaluation, item hold, model counters)"
      - from: BENCH_DONE
        to: IRREPARABLE
        trigger: "POST /gear-service/repair-orders/{id}/close-irreparable"
        actor: RepairTechnician | ServiceAgent
        preconditions:
          - "work_status IN {QUEUED, IN_WORK, BENCH_DONE}"
        side_effects:
          - "identical cascade to QUEUED -> IRREPARABLE"
      - from: QC_PASSED
        to: RELEASED
        trigger: "POST /gear-service/repair-orders/{id}/release-to-customer"
        actor: ServiceAgent
        preconditions:
          - "work_status == QC_PASSED"
          - "billing_status IN {NOT_BILLABLE, PAID}"
        side_effects:
          - "released_at stamped; GearItem.disposition_status -> RETURNED"
          - "WarrantyClaim -> CLOSED_FULFILLED with the liability release cascade described on the claim machine"
          - "ServiceCenter.active_queue_depth recomputed (this order leaves the queue)"
      - from: QUEUED
        to: CLOSED_UNREPAIRED
        trigger: "POST /gear-service/repair-estimates/{id}/decline (cascade)"
        actor: system
        preconditions:
          - "work_status IN {QUEUED, IN_WORK}"
          - "the declined estimate belongs to this order"
        side_effects:
          - "billing_status -> ESTIMATE_DECLINED; every RESERVED PartsReservation -> RELEASED with the same PartLot/GearModel chain as close-irreparable"
          - "every SCHEDULED WorkBlock -> CANCELLED with the technician-minute give-back"
          - "GearItem.disposition_status -> RETURNED; WarrantyClaim -> CLOSED_DECLINED"
      - from: IN_WORK
        to: CLOSED_UNREPAIRED
        trigger: "POST /gear-service/repair-estimates/{id}/decline (cascade)"
        actor: system
        preconditions:
          - "work_status IN {QUEUED, IN_WORK}"
        side_effects:
          - "identical cascade to QUEUED -> CLOSED_UNREPAIRED"

  # -------------------------------------------------------- order: money dimension
  - entity: RepairOrder
    state_field: billing_status
    initial_state: NOT_BILLABLE
    terminal_states: [NOT_BILLABLE, ESTIMATE_DECLINED, PAID]
    transitions:
      - from: NOT_BILLABLE
        to: NOT_BILLABLE
        trigger: "POST /gear-service/repair-orders (WARRANTY_REPAIR orders are minted NOT_BILLABLE)"
        actor: ServiceAgent
        preconditions:
          - "claim.decision == WARRANTY_REPAIR"
        side_effects:
          - "no estimate may ever be created on this order (ERR_INVALID_BILLING_STATE)"
        note: "warranty orders are born in the terminal state of the money dimension; only the bench dimension moves"
      - from: ESTIMATE_PENDING
        to: ESTIMATE_SENT
        trigger: "POST /gear-service/repair-orders/{id}/estimates"
        actor: ServiceAgent
        preconditions:
          - "order_kind == PAID_REPAIR"
          - "billing_status IN {ESTIMATE_PENDING, ESTIMATE_SENT}"
          - "expected_repair_order_version == RepairOrder.version (concurrency_rules estimate-create-stale-order)"
        side_effects:
          - "create RepairEstimate(variant PROVISIONAL, status SENT) priced by calculations.paid_repair_pricing variant PROVISIONAL"
          - "RepairOrder.version += 1"
        note: "PAID_REPAIR orders are minted in ESTIMATE_PENDING by POST /gear-service/repair-orders"
      - from: ESTIMATE_SENT
        to: ESTIMATE_SENT
        trigger: "POST /gear-service/repair-orders/{id}/estimates (re-quote)"
        actor: ServiceAgent
        preconditions:
          - "billing_status == ESTIMATE_SENT"
          - "no RepairEstimate on this order has status APPROVED"
          - "expected_repair_order_version == RepairOrder.version"
        side_effects:
          - "the prior SENT RepairEstimate -> SUPERSEDED"
          - "create the replacement RepairEstimate(variant PROVISIONAL, status SENT); RepairOrder.version += 1"
      - from: ESTIMATE_SENT
        to: ESTIMATE_APPROVED
        trigger: "POST /gear-service/repair-estimates/{id}/approve"
        actor: Customer
        preconditions:
          - "estimate.status == SENT"
          - "clock now <= estimate.valid_until"
          - "X-User-ID == gear_item.owner_customer_id"
        side_effects:
          - "estimate.status = APPROVED, decided_at stamped"
          - "RepairOrder.provisional_estimate_total_cents = estimate.total_cents"
          - "the bench dimension is unlocked: QUEUED -> IN_WORK becomes reachable"
      - from: ESTIMATE_SENT
        to: ESTIMATE_DECLINED
        trigger: "POST /gear-service/repair-estimates/{id}/decline"
        actor: Customer
        preconditions:
          - "estimate.status == SENT"
          - "X-User-ID == gear_item.owner_customer_id"
        side_effects:
          - "estimate.status = DECLINED; the bench dimension is driven to CLOSED_UNREPAIRED with its full release cascade"
      - from: ESTIMATE_SENT
        to: ESTIMATE_PENDING
        trigger: "POST /gear-service/service-centers/{id}/queue-review (system expiry sweep)"
        actor: system
        preconditions:
          - "a PROVISIONAL RepairEstimate on this order has status == SENT and valid_until < clock now"
        side_effects:
          - "that estimate -> EXPIRED; billing_status returns to ESTIMATE_PENDING so a fresh quote can be issued"
        note: "cycle in the money dimension: ESTIMATE_PENDING -> ESTIMATE_SENT -> ESTIMATE_PENDING"
      - from: ESTIMATE_APPROVED
        to: INVOICED
        trigger: "POST /gear-service/repair-orders/{id}/invoice"
        actor: ServiceAgent
        preconditions:
          - "billing_status == ESTIMATE_APPROVED"
          - "work_status == QC_PASSED"
        side_effects:
          - "create RepairEstimate(variant FINAL, status INVOICED) priced by calculations.paid_repair_pricing variant FINAL from COMPLETED WorkBlock actual_minutes and CONSUMED PartsReservation rows"
          - "RepairOrder.final_invoice_total_cents = that row's total_cents"
      - from: INVOICED
        to: PAID
        trigger: "POST /gear-service/repair-orders/{id}/payments"
        actor: ServiceAgent | Customer
        preconditions:
          - "billing_status == INVOICED"
          - "amount_cents == final_invoice_total_cents - paid_amount_cents"
        side_effects:
          - "paid_amount_cents += amount_cents; the FINAL RepairEstimate -> PAID"
          - "release-to-customer becomes reachable in the bench dimension"

  # -------------------------------------------------------- physical unit custody
  - entity: GearItem
    state_field: disposition_status
    initial_state: WITH_CUSTOMER
    terminal_states: [RETURNED, RESOLD, RECYCLED]
    transitions:
      - from: WITH_CUSTOMER
        to: AT_CENTER
        trigger: "POST /gear-service/warranty-claims/{id}/submit (cascade)"
        actor: system
        preconditions: ["disposition_status == WITH_CUSTOMER"]
        side_effects: ["the unit is now in the center's custody; a second concurrent claim on the same item is blocked by ERR_ORDER_ALREADY_OPEN only after a decision"]
      - from: AT_CENTER
        to: IN_REPAIR
        trigger: "POST /gear-service/repair-orders (cascade)"
        actor: system
        preconditions: ["disposition_status == AT_CENTER"]
        side_effects: ["repair order minted QUEUED with its turnaround commitment"]
      - from: AT_CENTER
        to: IRREPARABLE_HOLD
        trigger: "POST /gear-service/warranty-claims/{id}/decision resolving to WARRANTY_REPLACE (cascade)"
        actor: system
        preconditions: ["disposition_status == AT_CENTER"]
        side_effects: ["the unit skips the bench entirely and enters the trade-in lane"]
      - from: IN_REPAIR
        to: IRREPARABLE_HOLD
        trigger: "POST /gear-service/repair-orders/{id}/close-irreparable or the third QC failure (cascade)"
        actor: system
        preconditions: ["disposition_status == IN_REPAIR"]
        side_effects: ["trade-in becomes reachable"]
      - from: IN_REPAIR
        to: RETURNED
        trigger: "POST /gear-service/repair-orders/{id}/release-to-customer (cascade)"
        actor: system
        preconditions: ["disposition_status == IN_REPAIR"]
        side_effects: ["terminal: the unit is back with its owner"]
      - from: IN_REPAIR
        to: RETURNED
        trigger: "POST /gear-service/repair-estimates/{id}/decline (cascade)"
        actor: system
        preconditions: ["disposition_status == IN_REPAIR"]
        side_effects: ["terminal: the unit is shipped back unrepaired"]
      - from: IRREPARABLE_HOLD
        to: TRADED_IN
        trigger: "POST /gear-service/gear-items/{id}/trade-in"
        actor: Customer | ServiceAgent
        preconditions:
          - "disposition_status == IRREPARABLE_HOLD"
          - "condition_grade is set by the request body"
        side_effects:
          - "trade_in_credit_cents = calculations.trade_in_credit; refurb_list_price_cents computed"
          - "Customer.trade_in_credit_cents += trade_in_credit_cents"
          - "the claim closes CLOSED_REPLACED with the liability release cascade"
      - from: TRADED_IN
        to: REFURB_LISTED
        trigger: "POST /gear-service/gear-items/{id}/disposition with to = REFURB_LISTED"
        actor: PartsCoordinator | ProgramAdmin
        preconditions: ["disposition_status == TRADED_IN"]
        side_effects: ["the unit is listed on the refurbished channel at refurb_list_price_cents"]
      - from: REFURB_LISTED
        to: RESOLD
        trigger: "POST /gear-service/gear-items/{id}/disposition with to = RESOLD"
        actor: PartsCoordinator | ProgramAdmin
        preconditions:
          - "disposition_status == REFURB_LISTED"
          - "sale_price_cents present in the body"
        side_effects: ["resale_price_cents stamped; terminal"]
      - from: TRADED_IN
        to: RECYCLED
        trigger: "POST /gear-service/gear-items/{id}/disposition with to = RECYCLED"
        actor: PartsCoordinator | ProgramAdmin
        preconditions: ["disposition_status IN {TRADED_IN, REFURB_LISTED}"]
        side_effects: ["terminal: the unit is stripped for parts and leaves the resale channel"]
      - from: REFURB_LISTED
        to: RECYCLED
        trigger: "POST /gear-service/gear-items/{id}/disposition with to = RECYCLED"
        actor: PartsCoordinator | ProgramAdmin
        preconditions: ["disposition_status IN {TRADED_IN, REFURB_LISTED}"]
        side_effects: ["terminal"]

  # -------------------------------------------------------- estimates
  - entity: RepairEstimate
    state_field: status
    initial_state: SENT
    terminal_states: [DECLINED, EXPIRED, SUPERSEDED, PAID]
    transitions:
      - from: SENT
        to: APPROVED
        trigger: "POST /gear-service/repair-estimates/{id}/approve"
        actor: Customer
        preconditions: ["status == SENT", "clock now <= valid_until", "X-User-ID == gear_item.owner_customer_id"]
        side_effects: ["RepairOrder.billing_status -> ESTIMATE_APPROVED; provisional_estimate_total_cents stamped"]
      - from: SENT
        to: DECLINED
        trigger: "POST /gear-service/repair-estimates/{id}/decline"
        actor: Customer
        preconditions: ["status == SENT", "X-User-ID == gear_item.owner_customer_id"]
        side_effects: ["the order and item release cascade described on the order machine"]
      - from: SENT
        to: EXPIRED
        trigger: "POST /gear-service/service-centers/{id}/queue-review"
        actor: system
        preconditions: ["status == SENT", "valid_until < clock now"]
        side_effects: ["RepairOrder.billing_status -> ESTIMATE_PENDING"]
      - from: SENT
        to: SUPERSEDED
        trigger: "POST /gear-service/repair-orders/{id}/estimates (re-quote)"
        actor: ServiceAgent
        preconditions: ["status == SENT", "no APPROVED estimate exists on the order"]
        side_effects: ["the newer PROVISIONAL row becomes the live quote"]
      - from: SENT
        to: INVOICED
        trigger: "POST /gear-service/repair-orders/{id}/invoice"
        actor: ServiceAgent
        preconditions: ["variant == FINAL (FINAL rows are minted directly in INVOICED by this endpoint; PROVISIONAL rows are minted in SENT by the estimates endpoint)"]
        side_effects: ["RepairOrder.billing_status -> INVOICED; final_invoice_total_cents stamped"]
        note: "the FINAL row never passes through SENT/APPROVED; this entry documents the mint point of INVOICED"
      - from: INVOICED
        to: PAID
        trigger: "POST /gear-service/repair-orders/{id}/payments"
        actor: ServiceAgent | Customer
        preconditions: ["status == INVOICED", "amount_cents settles the balance exactly"]
        side_effects: ["RepairOrder.billing_status -> PAID"]

  # -------------------------------------------------------- reservations
  - entity: PartsReservation
    state_field: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /gear-service/parts-reservations/{id}/consume"
        actor: RepairTechnician
        preconditions:
          - "status == RESERVED"
          - "RepairOrder.work_status IN {QUEUED, IN_WORK, BENCH_DONE}"
        side_effects:
          - "PartLot.on_hand_units -= units AND PartLot.reserved_units -= units (available_units therefore unchanged)"
          - "PartLot.status re-derived; then GearModel.parts_support_status re-derived"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /gear-service/parts-reservations/{id}/release"
        actor: PartsCoordinator
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "PartLot.reserved_units -= units (available_units therefore increases by units, on_hand_units untouched)"
          - "PartLot.status re-derived; then GearModel.parts_support_status re-derived"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /gear-service/repair-orders/{id}/close-irreparable or estimate decline (cascade)"
        actor: system
        preconditions: ["status == RESERVED"]
        side_effects: ["identical inventory give-back to the operator-driven release"]

  # -------------------------------------------------------- inventory (cyclic)
  - entity: PartLot
    state_field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: LOW
        trigger: "any change to reserved_units / on_hand_units (reservation, consume, adjustment)"
        actor: system
        preconditions: ["1 <= available_units <= low_watermark_units after the change"]
        side_effects: ["GearModel.parts_support_status re-derived (LOW still counts as usable stock)"]
      - from: LOW
        to: DEPLETED
        trigger: "any change to reserved_units / on_hand_units"
        actor: system
        preconditions: ["available_units == 0 after the change"]
        side_effects: ["GearModel.parts_support_status re-derived; the model may fall to SUBSTITUTION_ONLY or NO_SUPPORT"]
      - from: AVAILABLE
        to: DEPLETED
        trigger: "a single reservation that takes every available unit"
        actor: system
        preconditions: ["available_units == 0 after the change AND low_watermark_units == 0 was not required"]
        side_effects: ["GearModel.parts_support_status re-derived"]
        note: "skips LOW when one draw crosses the whole band"
      - from: DEPLETED
        to: LOW
        trigger: "POST /gear-service/part-lots/{id}/adjustments or a reservation release"
        actor: PartsCoordinator | system
        preconditions: ["1 <= available_units <= low_watermark_units after the change"]
        side_effects: ["GearModel.parts_support_status re-derived, possibly back to SUPPORTED"]
      - from: DEPLETED
        to: AVAILABLE
        trigger: "POST /gear-service/part-lots/{id}/adjustments or a reservation release"
        actor: PartsCoordinator | system
        preconditions: ["available_units > low_watermark_units after the change"]
        side_effects: ["GearModel.parts_support_status re-derived"]
        note: "closes the cycle AVAILABLE -> LOW -> DEPLETED -> AVAILABLE"
      - from: LOW
        to: AVAILABLE
        trigger: "POST /gear-service/part-lots/{id}/adjustments or a reservation release"
        actor: PartsCoordinator | system
        preconditions: ["available_units > low_watermark_units after the change"]
        side_effects: ["GearModel.parts_support_status re-derived"]

  # -------------------------------------------------------- derived posture
  - entity: ServiceCenter
    state_field: liability_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CONSTRAINED
        trigger: "any LiabilityEntry create/release, or POST /gear-service/service-centers/{id}/queue-review"
        actor: system
        preconditions: ["open_liability_cents * 100 > 60 * liability_cap_cents AND open_liability_cents <= liability_cap_cents"]
        side_effects: ["WARRANTY_REPLACE decisions now require a ProgramAdmin actor (ERR_REPLACEMENT_REQUIRES_OVERRIDE for anyone else)"]
      - from: CONSTRAINED
        to: FROZEN
        trigger: "any LiabilityEntry create/release, or queue-review"
        actor: system
        preconditions: ["open_liability_cents > liability_cap_cents"]
        side_effects: ["every warranty decision branch (WARRANTY_REPAIR and WARRANTY_REPLACE) is refused with ERR_CENTER_LIABILITY_FROZEN; PAID_REPAIR_OFFERED and WEAR_DENIED remain available"]
      - from: FROZEN
        to: CONSTRAINED
        trigger: "LiabilityEntry release (order released, claim closed) or queue-review"
        actor: system
        preconditions: ["open_liability_cents <= liability_cap_cents AND open_liability_cents * 100 > 60 * liability_cap_cents"]
        side_effects: ["warranty repair decisions become available again"]
      - from: CONSTRAINED
        to: OPEN
        trigger: "LiabilityEntry release or queue-review"
        actor: system
        preconditions: ["open_liability_cents * 100 <= 60 * liability_cap_cents"]
        side_effects: ["all decision branches available with no role escalation"]
      - from: FROZEN
        to: OPEN
        trigger: "LiabilityEntry release or queue-review"
        actor: system
        preconditions: ["open_liability_cents * 100 <= 60 * liability_cap_cents"]
        side_effects: ["posture may skip CONSTRAINED when a single large release clears the whole band"]

# ============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ============================================================================

concurrency_rules:
  - rule_id: assessment-create-stale-claim
    parent_entity: WarrantyClaim
    write_endpoint: "POST /gear-service/warranty-claims/{id}/assessments"
    occ_field: "expected_claim_version"
    description: |
      Creating a ClaimAssessment against a WarrantyClaim whose version has
      advanced since the client last read it is rejected. Re-assessment is a
      legitimate operation that supersedes every earlier assessment and rewrites
      latest_determination / latest_repair_cost_cents, so a second create from a
      stale view would silently overwrite a finding the writer never saw.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
  - rule_id: estimate-create-stale-order
    parent_entity: RepairOrder
    write_endpoint: "POST /gear-service/repair-orders/{id}/estimates"
    occ_field: "expected_repair_order_version"
    description: |
      Creating a RepairEstimate against a RepairOrder whose version has advanced
      since the client last read it is rejected. A new quote legitimately
      supersedes the prior SENT quote, so a create carrying a stale order version
      would retire a quote the writer never inspected.
    error_id: ERR_STALE_REPAIR_ORDER_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================

calculations:

  - name: replacement_value
    trigger: "recomputed on every read/write of a GearItem's computed fields, and consumed by repair_versus_replace, liability_exposure_rollup and trade_in_credit"
    algorithm: dual_variant_valuation
    formula: |
      # shared inputs
      age_months        = whole months from GearItem.purchase_date to clock now (floor)
      completed_years   = floor(age_months / 12)
      model             = GearModel of the item
      # ---- variant DEPRECIATED_PURCHASE (chronological, what the owner paid)
      depreciation      = min(DEPRECIATION_CAP, DEPRECIATION_PER_YEAR * completed_years)
      residual_floor    = round_half_up(model.msrp_cents * RESIDUAL_FLOOR_PCT)
      depreciated_value = max(residual_floor,
                              round_half_up(GearItem.purchase_price_cents * (1 - depreciation)))
      # ---- variant SUCCESSOR_MSRP (forward looking, what the brand must ship today)
      if model.discontinued_at != null AND model.successor_model_id != null:
          base_msrp = GearModel(model.successor_model_id).msrp_cents
      else:
          base_msrp = model.msrp_cents
      successor_value   = round_half_up(base_msrp * BRAND_COST_BASIS_PCT)
      GearItem.replacement_value_depreciated_cents = depreciated_value
      GearItem.replacement_value_successor_cents   = successor_value
    input_set: "exactly one GearItem plus its GearModel and, when the model is discontinued with a successor, that successor model row; no claim/order state participates"
    constants:
      DEPRECIATION_PER_YEAR: 0.10
      DEPRECIATION_CAP: 0.60
      RESIDUAL_FLOOR_PCT: 0.25
      BRAND_COST_BASIS_PCT: 0.90
    precision: "integer cents, round_half_up at each named round_half_up call; no intermediate truncation"
    variants:
      - name: DEPRECIATED_PURCHASE
        when: "caps REPAIR LiabilityEntry.reserved_amount_cents and is the basis of trade_in_credit"
        difference: "walks the purchase price down by completed years with a floor at 25% of the model's own MSRP; ignores the successor catalog entirely"
      - name: SUCCESSOR_MSRP
        when: "denominator of repair_versus_replace and the amount of a REPLACEMENT LiabilityEntry"
        difference: "prices the obligation off the successor model's current MSRP at 90%, ignoring what the customer paid and how old the unit is"

  - name: repair_versus_replace
    trigger: "POST /gear-service/warranty-claims/{id}/decision"
    algorithm: threshold
    formula: |
      item   = GearItem of the claim
      model  = GearModel of that item
      # step 1 — age-decayed, category-specific, lifetime-boosted repair cap
      raw_cap      = CATEGORY_REPAIR_CAP_PCT[model.category]
                     + (LIFETIME_BONUS_PCT if model.lifetime_warranty else 0)
                     - AGE_DECAY_PCT_PER_YEAR * floor(item.age_months / 12)
      threshold_pct = max(FLOOR_PCT, min(CEILING_PCT, raw_cap))
      # step 2 — cost ratio against the SUCCESSOR_MSRP variant (never the depreciated one)
      repair_ratio_pct = round_half_up(
                            100 * claim.latest_repair_cost_cents
                            / item.replacement_value_successor_cents, 2)
      # step 3 — branch (evaluated top to bottom, first match wins)
      if claim.latest_determination == INCONCLUSIVE:            -> ERR_ASSESSMENT_INCONCLUSIVE
      if claim.latest_determination == USER_DAMAGE:              -> PAID_REPAIR_OFFERED
      if claim.latest_determination == NORMAL_WEAR:
            if model.parts_support_status == NO_SUPPORT:         -> WEAR_DENIED
            else:                                               -> PAID_REPAIR_OFFERED
      # determination == MANUFACTURING_DEFECT below
      if item.warranty_state == EXPIRED:                         -> PAID_REPAIR_OFFERED
      if model.parts_support_status == NO_SUPPORT:               -> WARRANTY_REPLACE
      if repair_ratio_pct >= threshold_pct:                      -> WARRANTY_REPLACE
      else:                                                     -> WARRANTY_REPAIR
      claim.decision_threshold_pct = threshold_pct
      claim.repair_ratio_pct       = repair_ratio_pct
    input_set: "the claim's newest ClaimAssessment with is_superseded == false (its estimated_repair_cost_cents is mirrored on claim.latest_repair_cost_cents), the GearItem, its GearModel, and that model's parts_support_status as of the decision instant"
    constants:
      CATEGORY_REPAIR_CAP_PCT: { SHELL_APPAREL: 65, INSULATION: 60, TENT_SHELTER: 70, PACK_HARNESS: 75, HARDGOODS_FRAME: 55 }
      AGE_DECAY_PCT_PER_YEAR: 5
      LIFETIME_BONUS_PCT: 10
      FLOOR_PCT: 30
      CEILING_PCT: 90
    precision: "threshold_pct is an integer percentage; repair_ratio_pct is 2 decimals round_half_up; the comparison is >= so a ratio landing exactly on the threshold REPLACES"
    variants:
      - name: BOUNDARY_AT_THRESHOLD
        when: "repair_ratio_pct == threshold_pct after rounding"
        difference: "REPLACE wins; the naive `>` reading yields WARRANTY_REPAIR and a different LiabilityEntry basis, amount and downstream posture"

  - name: paid_repair_pricing
    trigger: "POST /gear-service/repair-orders/{id}/estimates (PROVISIONAL), POST /gear-service/repair-orders/{id}/invoice (FINAL), and the labor block alone for ClaimAssessment.estimated_repair_cost_cents"
    algorithm: tiered_pricing
    formula: |
      # ---- step 1: per-line labor, ROUNDED PER LINE BEFORE SUMMING (pinned order)
      for each labor line (work_type, minutes) sorted by work_type ASC:
          line_labor_cents = round_half_up(LABOR_RATE_CENTS_PER_HOUR[work_type] * minutes / 60)
      labor_subtotal_cents = sum(line_labor_cents)          # NOT round(sum(rate*minutes/60))
      # ---- step 2: parts are exact integers
      parts_subtotal_cents = sum(units * unit_price_cents)
      # ---- step 3: capped shop supply fee on labor only
      shop_supply_fee_cents = min(SUPPLY_FEE_CAP_CENTS,
                                  round_half_up(SUPPLY_FEE_PCT * labor_subtotal_cents))
      # ---- step 4: subtotal
      subtotal_cents = labor_subtotal_cents + parts_subtotal_cents + shop_supply_fee_cents
      # ---- step 5: loyalty discount on the subtotal
      loyalty_discount_cents = round_half_up(
                                  subtotal_cents * LOYALTY_DISCOUNT_PCT[owner.loyalty_tier])
      # ---- step 6: expedite fee (FINAL rows only, and only when order.expedite_requested)
      expedite_fee_cents = EXPEDITE_FEE_CENTS if (variant == FINAL AND order.expedite_requested) else 0
      # ---- step 7: tax on the discounted, expedited base
      tax_cents = round_half_up(TAX_PCT * (subtotal_cents - loyalty_discount_cents + expedite_fee_cents))
      # ---- step 8: total
      total_cents = subtotal_cents - loyalty_discount_cents + expedite_fee_cents + tax_cents
      # ClaimAssessment.estimated_repair_cost_cents stops after step 4 and uses
      # estimated_parts_cents directly as parts_subtotal_cents (no discount, expedite or tax).
    input_set: "PROVISIONAL: the labor_lines and parts_lines supplied in the request body. FINAL: labor lines derived from WorkBlock rows with status == COMPLETED on this order grouped by work_type (minutes = sum of actual_minutes per work_type, work_types ordered ASC), parts lines derived from PartsReservation rows with status == CONSUMED on this order priced at their PartLot.unit_price_cents (RESERVED and RELEASED rows are excluded)"
    constants:
      LABOR_RATE_CENTS_PER_HOUR: { FABRIC: 8500, ZIPPER: 9500, FRAME: 11000, INSULATION: 9000 }
      SUPPLY_FEE_PCT: 0.07
      SUPPLY_FEE_CAP_CENTS: 2500
      LOYALTY_DISCOUNT_PCT: { STANDARD: 0.00, PRO: 0.10 }
      EXPEDITE_FEE_CENTS: 3500
      TAX_PCT: 0.0825
      ESTIMATE_VALIDITY_DAYS: 7
    precision: "integer cents throughout; round_half_up per line in step 1, then no further rounding of the sum; steps 3, 5 and 7 each round exactly once"
    variants:
      - name: PROVISIONAL
        when: "customer-facing quote created before bench work starts"
        difference: "labor minutes are the bench-standard numbers typed by the agent, parts are quoted list prices, expedite_fee_cents is always 0"
      - name: FINAL
        when: "invoice minted after QC passes"
        difference: "labor minutes are the technician's logged actual_minutes, parts are only the CONSUMED reservations at PartLot.unit_price_cents (a substitution therefore reprices the line), and expedite_fee_cents is charged when the order asked for it — identical nominal work yields a different total"

  - name: turnaround_commitment
    trigger: "POST /gear-service/repair-orders"
    algorithm: constraint_propagation
    formula: |
      # The multiplier depends on the queue, and this order joins the queue.
      # Evaluation order is PINNED so the value is well defined:
      # step 1 — snapshot the queue BEFORE inserting this order
      queue_depth_snapshot = count(RepairOrder
                                   WHERE service_center_id == center.id
                                     AND work_status IN {QUEUED, IN_WORK, BENCH_DONE})
      # step 2 — tier lookup on that snapshot
      tier_multiplier = SURGE_TIERS lookup:
            queue_depth_snapshot <= 9   -> 1.00
            queue_depth_snapshot <= 24  -> 1.25
            queue_depth_snapshot <= 49  -> 1.60
            else                        -> 2.00
      # step 3 — seasonal override never lowers the tier
      window_multiplier = max(SurgeWindow.multiplier over rows WHERE
                                 service_center_id == center.id AND status == ACTIVE
                                 AND start_date <= clock now <= end_date)   # inclusive both ends
                          , or 1.00 when no such row exists
      surge_multiplier_applied = max(tier_multiplier, window_multiplier)
      # step 4 — parts wait read from the model BEFORE any reservation of this call
      parts_wait_days = 0  if model.parts_support_status == SUPPORTED
                        7  if model.parts_support_status == SUBSTITUTION_ONLY
                        14 if model.parts_support_status == NO_SUPPORT
      # step 5 — base days
      base_days = CATEGORY_BASE_DAYS[model.category]
                  + max(WORK_TYPE_ADD_DAYS[wt] for wt in order.required_work_types)
      # step 6 — commitment
      promised_days      = ceil(base_days * surge_multiplier_applied) + parts_wait_days
      promised_return_at = (date of clock now + promised_days days) at 23:59:59.999Z
      # step 7 — only now is the order inserted, after which
      # ServiceCenter.active_queue_depth and current_surge_multiplier are recomputed
      # (so center.active_queue_depth == queue_depth_snapshot + 1 immediately after)
    input_set: "RepairOrder rows of this center in work_status {QUEUED, IN_WORK, BENCH_DONE} excluding the row being created; ACTIVE SurgeWindow rows of this center covering the clock instant inclusively; the GearModel's parts_support_status and category; the required_work_types copied from the claim's newest non-superseded assessment"
    constants:
      CATEGORY_BASE_DAYS: { SHELL_APPAREL: 10, INSULATION: 14, TENT_SHELTER: 12, PACK_HARNESS: 9, HARDGOODS_FRAME: 16 }
      WORK_TYPE_ADD_DAYS: { FABRIC: 2, ZIPPER: 3, FRAME: 5, INSULATION: 6 }
      SURGE_TIERS: { "0-9": 1.00, "10-24": 1.25, "25-49": 1.60, "50+": 2.00 }
    precision: "promised_days is an integer (ceil applied to base_days * multiplier BEFORE adding parts_wait_days, never after); promised_return_at is a UTC date at 23:59:59.999Z"

  - name: technician_routing_selector
    trigger: "POST /gear-service/work-blocks when technician_id is omitted from the body"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter — candidate set
      candidates = Technician WHERE
            service_center_id == RepairOrder.service_center_id
        AND status == ACTIVE
        AND exists c in certifications WHERE c.work_type == request.work_type
                                         AND c.level >= WORK_TYPE_MIN_LEVEL[request.work_type]
        AND no WorkBlock W WHERE W.technician_id == candidate.id
                             AND W.status == SCHEDULED
                             AND W.start_at < request.end_at
                             AND request.start_at < W.end_at        # half-open overlap
      # (b) ranking expression, applied in order
      #     1. certification level for request.work_type   DESC
      #     2. scheduled_minutes_open                       ASC
      # (c) tie-break when 1 and 2 both tie
      #     3. Technician.created_at                        ASC   (never id)
      # (d) empty candidate set
      #     -> ERR_NO_ELIGIBLE_TECHNICIAN (422); no WorkBlock row is created
      winner.routed_by_selector = true
    input_set: "Technician rows of the order's center only; SCHEDULED WorkBlock rows only (CANCELLED and COMPLETED blocks never block a window)"
    constants:
      WORK_TYPE_MIN_LEVEL: { FABRIC: 1, ZIPPER: 2, FRAME: 2, INSULATION: 2 }
    precision: "integer comparisons; created_at compared at millisecond resolution"

  - name: liability_exposure_rollup
    trigger: "every LiabilityEntry create or release, and POST /gear-service/service-centers/{id}/queue-review"
    algorithm: aggregation
    formula: |
      open_liability_cents = sum(LiabilityEntry.reserved_amount_cents
                                 WHERE status == OPEN
                                   AND WarrantyClaim(warranty_claim_id).service_center_id == center.id)
      liability_utilization_pct = round_half_up(100 * open_liability_cents / liability_cap_cents, 2)
      # posture compares CENTS, never the rounded percentage
      if open_liability_cents > liability_cap_cents:                       FROZEN
      elif open_liability_cents * 100 > 60 * liability_cap_cents:          CONSTRAINED
      else:                                                               OPEN
    input_set: "LiabilityEntry rows with status == OPEN whose claim belongs to this center; RELEASED rows are excluded but keep their reserved_amount_cents for audit"
    constants:
      CONSTRAINED_THRESHOLD_PCT: 60
      FROZEN_THRESHOLD_PCT: 100
    precision: "integer cents; the CONSTRAINED test is a cross-multiplied integer comparison (open * 100 > 60 * cap) so no floating point can move the boundary; open == cap is CONSTRAINED, not FROZEN"

  - name: trade_in_credit
    trigger: "POST /gear-service/gear-items/{id}/trade-in"
    algorithm: decay_function
    formula: |
      base_credit = round_half_up(GearItem.replacement_value_depreciated_cents
                                  * TRADE_IN_PCT[request.condition_grade])
      goodwill    = GOODWILL_BONUS_CENTS if claim.decision IN {WARRANTY_REPAIR, WARRANTY_REPLACE} else 0
      trade_in_credit_cents   = min(TRADE_IN_CAP_CENTS, base_credit + goodwill)
      refurb_list_price_cents = round_half_up(GearItem.replacement_value_successor_cents
                                              * REFURB_LIST_PCT)
    input_set: "the item's DEPRECIATED_PURCHASE valuation, the condition_grade supplied in the body (which overwrites the stored grade), and the decision of the claim that drove the item into IRREPARABLE_HOLD"
    constants:
      TRADE_IN_PCT: { A: 0.35, B: 0.22, C: 0.12 }
      GOODWILL_BONUS_CENTS: 5000
      TRADE_IN_CAP_CENTS: 40000
      REFURB_LIST_PCT: 0.55
    precision: "integer cents, round_half_up; the cap is applied AFTER the goodwill bonus is added"

  - name: parts_substitution_eligibility
    trigger: "POST /gear-service/repair-orders/{id}/parts-reservations"
    algorithm: constraint_propagation
    formula: |
      lot      = PartLot(request.part_lot_id)
      model    = GearModel of the order's GearItem
      required = request.required_part_code
      # exact-code draw
      if lot.part_code == required:
            if lot.gear_model_id != model.id:                 -> ERR_PART_MODEL_MISMATCH
            is_substitution = false
      # substitution draw (the discontinued-model path)
      else:
            if lot.gear_model_id NOT IN {model.id, model.successor_model_id}
                                                              -> ERR_PART_MODEL_MISMATCH
            if lot.substitution_allowed != true
               OR lot.substitute_for_part_code != required     -> ERR_SUBSTITUTION_NOT_PERMITTED
            if lot.part_kind != PartLot(required on this model or its successor).part_kind
                                                              -> ERR_SUBSTITUTION_NOT_PERMITTED
            is_substitution = true
      if request.units < 1:                                    -> ERR_INVALID_UNITS
      if request.units > lot.available_units:                  -> ERR_INSUFFICIENT_PART_UNITS
      # on success
      lot.reserved_units += units; lot.available_units recomputed; lot.status re-derived;
      GearModel.parts_support_status re-derived for the lot's model
    input_set: "one PartLot, the order's GearModel and that model's successor_model_id; part kind comparison uses the lot registered under the required code on the model or its successor"
    constants:
      SUBSTITUTION_PART_KIND_MUST_MATCH: true
    precision: "integer units; the availability test is `units > available_units` so a draw exactly equal to available_units succeeds and depletes the lot"

# ============================================================================
# §1.4 Validation Rules Table (evaluated strictly in priority order; the FIRST
#      violated row wins and short-circuits every later row)
# ============================================================================

validations:

  # ---- authentication ------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID resolves to an existing row of the backing entity (Customer for Customer, Technician for RepairTechnician)"
    error_id: ERR_UNKNOWN_ACTOR
    http_status: 401
    applies_to: "all endpoints called as Customer or RepairTechnician"

  # ---- authorization -------------------------------------------------------
  - priority: 4
    category: auth
    check: "X-User-Role appears in the endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 5
    category: auth
    check: "when acting as Customer, the target resource belongs to that customer: gear_item.owner_customer_id == X-User-ID (directly, or through claim.gear_item_id / repair_order.gear_item_id / estimate.repair_order_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Customer-callable endpoints that address an existing resource"

  # ---- existence -----------------------------------------------------------
  - priority: 6
    category: existence
    check: "every {id} in the path resolves, validated left to right"
    error_id: "ERR_SERVICE_CENTER_NOT_FOUND | ERR_GEAR_MODEL_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_GEAR_ITEM_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_REPAIR_ORDER_NOT_FOUND | ERR_ESTIMATE_NOT_FOUND | ERR_PART_LOT_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_WORK_BLOCK_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 7
    category: existence
    check: "every FK supplied in the request body resolves (service_center_id, gear_item_id, gear_model_id, owner_customer_id, warranty_claim_id, repair_order_id, successor_model_id)"
    error_id: "ERR_SERVICE_CENTER_NOT_FOUND | ERR_GEAR_MODEL_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_GEAR_ITEM_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_REPAIR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /gear-items, POST /warranty-claims, POST /repair-orders, POST /technicians, POST /part-lots, PATCH /gear-models/{id}"
  - priority: 8
    category: existence
    check: "second-level body references resolve: part_lot_id on a reservation, technician_id on a work block, every work_block_id inside bench-complete work_log"
    error_id: "ERR_PART_LOT_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_WORK_BLOCK_NOT_FOUND"
    http_status: 404
    applies_to: "POST /repair-orders/{id}/parts-reservations, POST /work-blocks, POST /repair-orders/{id}/bench-complete"

  # ---- request shape -------------------------------------------------------
  - priority: 9
    category: business_constraint
    check: "body/query conforms to the endpoint input schema: required fields present, types correct, enums in range, integers >= their declared minimum, ISO-8601 timestamps parseable, certifications/labor_lines/work_log well-formed arrays"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 10
    category: business_constraint
    check: "limit in 1..100 and offset >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

  # ---- state preconditions -------------------------------------------------
  - priority: 11
    category: state
    check: "WarrantyClaim.status is a legal `from:` state for the requested transition (§1.2 WarrantyClaim)"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/submit, /info-requests, /resubmit, /assessments, /decision, POST /repair-orders"
  - priority: 12
    category: state
    check: "RepairOrder.work_status is a legal `from:` state for the requested transition (§1.2 RepairOrder.work_status)"
    error_id: ERR_INVALID_WORK_STATE
    http_status: 409
    applies_to: "POST /work-blocks, /repair-orders/{id}/bench-complete, /qc-inspections, /close-irreparable, /invoice, /release-to-customer, /repair-orders/{id}/parts-reservations"
  - priority: 13
    category: state
    check: "RepairOrder.billing_status is a legal `from:` state: estimates require ESTIMATE_PENDING or ESTIMATE_SENT (never NOT_BILLABLE; the ESTIMATE_APPROVED case is deliberately carved out of this rule and answered by priority 40 ERR_ESTIMATE_ALREADY_APPROVED so a re-quote after approval reports its own cause), work blocks require NOT_BILLABLE or ESTIMATE_APPROVED, payments require INVOICED"
    error_id: ERR_INVALID_BILLING_STATE
    http_status: 409
    applies_to: "POST /repair-orders/{id}/estimates, POST /work-blocks, POST /repair-orders/{id}/payments"
  - priority: 14
    category: state
    check: "RepairEstimate.status == SENT for approve/decline"
    error_id: ERR_INVALID_ESTIMATE_STATE
    http_status: 409
    applies_to: "POST /repair-estimates/{id}/approve, POST /repair-estimates/{id}/decline"
  - priority: 15
    category: state
    check: "PartsReservation.status == RESERVED for release/consume"
    error_id: ERR_RESERVATION_NOT_RESERVED
    http_status: 409
    applies_to: "POST /parts-reservations/{id}/release, POST /parts-reservations/{id}/consume"
  - priority: 16
    category: state
    check: "GearItem.disposition_status permits the requested disposition hop (TRADED_IN -> REFURB_LISTED|RECYCLED, REFURB_LISTED -> RESOLD|RECYCLED)"
    error_id: ERR_INVALID_DISPOSITION_STATE
    http_status: 409
    applies_to: "POST /gear-items/{id}/disposition"
  - priority: 17
    category: state
    check: "the addressed resource is not already in a terminal state of the dimension the call would move (claim in {WEAR_DENIED, CLOSED_FULFILLED, CLOSED_REPLACED, CLOSED_DECLINED}, order work_status in {RELEASED, IRREPARABLE, CLOSED_UNREPAIRED}, item in {RETURNED, RESOLD, RECYCLED})"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint that mutates WarrantyClaim, RepairOrder or GearItem"
  - priority: 18
    category: state
    check: "expected_claim_version == WarrantyClaim.version (concurrency_rules assessment-create-stale-claim)"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /warranty-claims/{id}/assessments"
  - priority: 19
    category: state
    check: "expected_repair_order_version == RepairOrder.version (concurrency_rules estimate-create-stale-order)"
    error_id: ERR_STALE_REPAIR_ORDER_VERSION
    http_status: 412
    applies_to: "POST /repair-orders/{id}/estimates"

  # ---- business: safety / compliance --------------------------------------
  - priority: 20
    category: business_safety
    check: "the acting Technician (or the technician_id named in the body) has status == ACTIVE"
    error_id: ERR_TECHNICIAN_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/assessments, POST /work-blocks, POST /repair-orders/{id}/bench-complete, POST /repair-orders/{id}/qc-inspections"
  - priority: 21
    category: business_safety
    check: "the technician holds a certification for the requested work_type at level >= WORK_TYPE_MIN_LEVEL (assessments: for every entry of required_work_types; work blocks: for the block's work_type when technician_id is explicit)"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /warranty-claims/{id}/assessments, POST /work-blocks"
  - priority: 22
    category: business_safety
    check: "the acting Technician authored no ClaimAssessment on this order's WarrantyClaim (segregation of duties: assessor MUST NOT sign QC)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /repair-orders/{id}/qc-inspections"
  - priority: 23
    category: business_safety
    check: "ServiceCenter.liability_posture != FROZEN when the decision resolves to WARRANTY_REPAIR or WARRANTY_REPLACE (PAID_REPAIR_OFFERED and WEAR_DENIED are always permitted)"
    error_id: ERR_CENTER_LIABILITY_FROZEN
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/decision"
  - priority: 24
    category: business_safety
    check: "when ServiceCenter.liability_posture == CONSTRAINED and the decision resolves to WARRANTY_REPLACE, X-User-Role must be ProgramAdmin"
    error_id: ERR_REPLACEMENT_REQUIRES_OVERRIDE
    http_status: 403
    applies_to: "POST /warranty-claims/{id}/decision"

  # ---- business: referential ----------------------------------------------
  - priority: 25
    category: business_referential
    check: "the technician (acting or named) belongs to the same ServiceCenter as the claim / repair order"
    error_id: ERR_TECHNICIAN_CENTER_MISMATCH
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/assessments, POST /work-blocks"
  - priority: 26
    category: business_referential
    check: "the PartLot belongs to the order's GearModel, or (substitution draw) to that model's successor_model_id (calculations.parts_substitution_eligibility)"
    error_id: ERR_PART_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /repair-orders/{id}/parts-reservations"
  - priority: 27
    category: business_referential
    check: "a substitution draw requires lot.substitution_allowed == true AND lot.substitute_for_part_code == required_part_code AND matching part_kind"
    error_id: ERR_SUBSTITUTION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /repair-orders/{id}/parts-reservations"
  - priority: 28
    category: business_referential
    check: "every work_block_id in bench-complete work_log has repair_order_id == the addressed order and status == SCHEDULED"
    error_id: ERR_WORK_BLOCK_NOT_ON_ORDER
    http_status: 422
    applies_to: "POST /repair-orders/{id}/bench-complete"
  - priority: 29
    category: business_referential
    check: "successor_model_id must not equal the model itself and must not close a cycle through existing successor links"
    error_id: ERR_SUCCESSOR_CYCLE
    http_status: 422
    applies_to: "POST /gear-models, PATCH /gear-models/{id}"

  # ---- business: temporal -------------------------------------------------
  - priority: 30
    category: business_temporal
    check: "purchase_date <= the logical clock date"
    error_id: ERR_PURCHASE_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /gear-items"
  - priority: 31
    category: business_temporal
    check: "for intake_kind == WARRANTY_CLAIM, gear_item.warranty_state != EXPIRED (LIFETIME never expires; limited coverage ends warranty_years after purchase_date)"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/submit"
  - priority: 32
    category: business_temporal
    check: "interval endpoints are ordered: WorkBlock.start_at < end_at and SurgeWindow.start_date <= end_date"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /work-blocks, POST /service-centers/{id}/surge-windows"
  - priority: 33
    category: business_temporal
    check: "a new ACTIVE SurgeWindow must not overlap an existing ACTIVE window of the same center on CLOSED-INCLUSIVE date semantics (sharing a single endpoint date IS an overlap)"
    error_id: ERR_SURGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /service-centers/{id}/surge-windows"
  - priority: 34
    category: business_temporal
    check: "an explicitly named technician must have no SCHEDULED WorkBlock overlapping [start_at, end_at) on HALF-OPEN semantics (end_at == other.start_at is adjacency, not overlap)"
    error_id: ERR_TECHNICIAN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /work-blocks"
  - priority: 35
    category: business_temporal
    check: "clock now <= RepairEstimate.valid_until when approving"
    error_id: ERR_ESTIMATE_EXPIRED
    http_status: 409
    applies_to: "POST /repair-estimates/{id}/approve"

  # ---- business: constraint -----------------------------------------------
  - priority: 36
    category: business_constraint
    check: "for intake_kind == WARRANTY_CLAIM, the gear item carries proof of purchase (proof_of_purchase_type != NONE and proof_of_purchase_ref non-blank)"
    error_id: ERR_PROOF_OF_PURCHASE_MISSING
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/submit"
  - priority: 37
    category: business_constraint
    check: "info_request_count < MAX_INFO_REQUESTS (2)"
    error_id: ERR_INFO_REQUEST_LIMIT
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/info-requests"
  - priority: 38
    category: business_constraint
    check: "the claim's newest non-superseded ClaimAssessment has determination != INCONCLUSIVE"
    error_id: ERR_ASSESSMENT_INCONCLUSIVE
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/decision"
  - priority: 39
    category: business_constraint
    check: "the claim has no RepairOrder in a non-terminal work_status, and claim.decision IN {WARRANTY_REPAIR, PAID_REPAIR_OFFERED} (a WARRANTY_REPLACE claim never gets an order)"
    error_id: ERR_ORDER_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /repair-orders"
  - priority: 40
    category: business_constraint
    check: "no RepairEstimate on this order has status APPROVED (a re-quote after approval is refused)"
    error_id: ERR_ESTIMATE_ALREADY_APPROVED
    http_status: 409
    applies_to: "POST /repair-orders/{id}/estimates"
  - priority: 41
    category: business_constraint
    check: "count of SCHEDULED WorkBlock rows at this center whose start_at falls on the new block's UTC calendar date is < ServiceCenter.bench_capacity_blocks_per_day"
    error_id: ERR_BENCH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /work-blocks"
  - priority: 42
    category: business_constraint
    check: "units >= 1 on a parts reservation and delta_units != 0 on a lot adjustment"
    error_id: ERR_INVALID_UNITS
    http_status: 422
    applies_to: "POST /repair-orders/{id}/parts-reservations, POST /part-lots/{id}/adjustments"
  - priority: 43
    category: business_constraint
    check: "units <= PartLot.available_units (a draw exactly equal to available_units is allowed and depletes the lot)"
    error_id: ERR_INSUFFICIENT_PART_UNITS
    http_status: 409
    applies_to: "POST /repair-orders/{id}/parts-reservations"
  - priority: 44
    category: business_constraint
    check: "a negative adjustment must not push on_hand_units below reserved_units"
    error_id: ERR_INSUFFICIENT_STOCK_ADJUSTMENT
    http_status: 422
    applies_to: "POST /part-lots/{id}/adjustments"
  - priority: 45
    category: business_constraint
    check: "uniqueness: GearModel.model_code globally, Customer.email globally, Technician.employee_code globally, GearItem.serial_number within its gear_model_id, PartLot.part_code within its gear_model_id"
    error_id: "ERR_MODEL_CODE_TAKEN | ERR_EMAIL_TAKEN | ERR_EMPLOYEE_CODE_TAKEN | ERR_SERIAL_ALREADY_REGISTERED | ERR_PART_CODE_TAKEN"
    http_status: 409
    applies_to: "POST /gear-models, POST /customers, POST /technicians, POST /gear-items, POST /part-lots"
  - priority: 46
    category: business_constraint
    check: "after applying work_log, every entry of RepairOrder.required_work_types has at least one COMPLETED WorkBlock on this order"
    error_id: ERR_WORK_TYPES_INCOMPLETE
    http_status: 409
    applies_to: "POST /repair-orders/{id}/bench-complete"
  - priority: 47
    category: business_constraint
    check: "no PartsReservation on this order is still RESERVED when QC is signed"
    error_id: ERR_PARTS_NOT_SETTLED
    http_status: 409
    applies_to: "POST /repair-orders/{id}/qc-inspections"
  - priority: 48
    category: business_constraint
    check: "when technician_id is omitted, calculations.technician_routing_selector yields a non-empty candidate pool"
    error_id: ERR_NO_ELIGIBLE_TECHNICIAN
    http_status: 422
    applies_to: "POST /work-blocks"
  - priority: 49
    category: business_constraint
    check: "GearItem.disposition_status == IRREPARABLE_HOLD for a trade-in"
    error_id: ERR_ITEM_NOT_IRREPARABLE
    http_status: 409
    applies_to: "POST /gear-items/{id}/trade-in"

  # ---- business: fiscal (last) -------------------------------------------
  - priority: 50
    category: business_fiscal
    check: "billing_status == ESTIMATE_APPROVED at invoice time: a PAID_REPAIR order must carry an APPROVED PROVISIONAL estimate, and a NOT_BILLABLE warranty order is never invoiceable (this rule — not priority 13, which does not apply to /invoice — owns the billing gate for invoicing)"
    error_id: ERR_ESTIMATE_NOT_APPROVED
    http_status: 402
    applies_to: "POST /repair-orders/{id}/invoice"
  - priority: 51
    category: business_fiscal
    check: "amount_cents == final_invoice_total_cents - paid_amount_cents exactly (no partial and no overpayment)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /repair-orders/{id}/payments"
  - priority: 52
    category: business_fiscal
    check: "a PAID_REPAIR order must have billing_status == PAID before release"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /repair-orders/{id}/release-to-customer"

# ============================================================================
# §1.5 API Endpoint Table   (all paths are relative to api_prefix /gear-service)
# ============================================================================

endpoints:

  # ---------------------------------------------------------------- clock
  - method: POST
    path: "/gear-service/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. The server's startup default logical clock is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every timestamp derivation reads that default and never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["all subsequent age_months, warranty_state, promised_return_at, valid_until and window comparisons use the new instant"]

  # ---------------------------------------------------------------- service center
  - method: POST
    path: "/gear-service/service-centers"
    description: "register a service center"
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "region_code", "liability_cap_cents", "bench_capacity_blocks_per_day?"]
    output: ServiceCenter
    side_effects: ["open_liability_cents = 0, liability_utilization_pct = 0, liability_posture = OPEN, active_queue_depth = 0, current_surge_multiplier = 1.0"]
  - method: GET
    path: "/gear-service/service-centers/{id}"
    description: "read a service center including derived liability and queue fields"
    roles: [ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: ServiceCenter
    side_effects: []
  - method: POST
    path: "/gear-service/service-centers/{id}/surge-windows"
    description: "declare a seasonal surge window (closed-inclusive date range) for this center"
    roles: [ProgramAdmin]
    code: 201
    input: [label, start_date, end_date, multiplier]
    output: SurgeWindow
    side_effects: ["validations[priority=33] inclusive overlap check", "ServiceCenter.current_surge_multiplier recomputed"]
  - method: GET
    path: "/gear-service/service-centers/{id}/surge-windows"
    description: "list surge windows of a center (reverse-reachability for SurgeWindow.service_center_id)"
    roles: [ServiceAgent, PartsCoordinator, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SurgeWindow[]
    side_effects: []
  - method: POST
    path: "/gear-service/service-centers/{id}/queue-review"
    description: "ops-run checkpoint: expire stale estimates, flag breached commitments, recompute queue depth, surge multiplier and liability posture"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ServiceCenter
    side_effects:
      - "every PROVISIONAL RepairEstimate with status SENT and valid_until < clock now -> EXPIRED, its order's billing_status -> ESTIMATE_PENDING"
      - "every non-terminal RepairOrder with promised_return_at < clock now gets commitment_breached = true"
      - "breached_commitment_count, active_queue_depth, current_surge_multiplier, open_liability_cents, liability_utilization_pct and liability_posture recomputed"
      - "last_queue_review_at = clock now"

