              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/authorization"
              payload: { decision: "GRANT" }
              as: Participant
              as_user_id: "${p_id}"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { site_v1: $.data.version }
            - call: "POST /appointments"
