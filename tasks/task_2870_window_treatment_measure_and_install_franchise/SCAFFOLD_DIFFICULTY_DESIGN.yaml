          setup:
            - "One ACTIVE territory with lead_capacity_per_week 1 covering postal code 30301, and one ACTIVE designer."
            - "Three leads created in order: L1 (routes immediately, open_leads_count 1), then L2 and L3 which both land QUEUED because capacity is exhausted."
            - "L1 gets a consultation and one LT-SHEER / CORDLESS opening measured INSIDE at 24.000 x 48.000: base 4960 + 1800 cordless adder = list 6760, install fee 10000, pre-discount 16760, discount 0, net 6760."
