            - { call: "POST /regatta-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T15:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "POST /regatta-ops/race-results", payload: { race_id: "${r1}", entry_id: "${e_a}", finish_status: "FINISHED", elapsed_seconds: 3900.0 }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { res_a: $.data.id } }
            - { call: "POST /regatta-ops/race-results", payload: { race_id: "${r1}", entry_id: "${e_b}", finish_status: "FINISHED", elapsed_seconds: 4300.0 }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { res_b: $.data.id } }
            - { call: "POST /regatta-ops/races/${r1}/score", payload: {}, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/protests", payload: { race_id: "${r1}", protestor_entry_id: "${e_a}", protestee_entry_id: "${e_b}", rule_cited: "RRS_10", incident_utc: "2026-08-05T14:30:00Z" }, as: Competitor, as_user_id: "${m_h1}", captures: { prt: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/protests/${prt}/schedule-hearing", payload: { jury_panel_id: "${pnl}", hearing_utc: "2026-08-05T14:30:00Z" }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/schedule-hearing", payload: { jury_panel_id: "${pnl}", hearing_utc: "2026-08-05T18:00:00Z" }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/hear", payload: {}, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T18:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "POST /regatta-ops/protests/${prt}/hear", payload: {}, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/evidence", payload: { kind: "GPS_TRACK", summary: "Track overlay of the mark rounding", submitted_by_entry_id: "${e_a}" }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/hear", payload: {}, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/decide", payload: { decision: "PENALTY_DSQ" }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/decide", payload: { decision: "DISMISSED", redress_race_number: 1 }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/decide", payload: { decision: "REDRESS_GRANTED", penalty_target_entry_id: "${e_a}", redress_race_number: 1 }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/decide", payload: { decision: "DISMISSED" }, as: JuryChair, as_user_id: "${m_jc}" }
          assert:
            - "trigger call 1 returns HTTP 422 with error_id ERR_HEARING_TIME_INVALID: 14:30:00Z is behind the clock at 15:00:00Z, and Protest.${prt}.status stays FILED with jury_panel_id null"
            - "trigger call 2 returns HTTP 200 with Protest.${prt}.status == HEARING_SCHEDULED, jury_panel_id == ${pnl} and hearing_utc == 2026-08-05T18:00:00Z"
            - "trigger call 3 returns HTTP 409 with error_id ERR_HEARING_NOT_DUE and NOT ERR_EVIDENCE_REQUIRED, even though evidence_count is 0, because priority 16 runs before priority 40"
            - "trigger call 5 returns HTTP 409 with error_id ERR_EVIDENCE_REQUIRED: the clock now equals hearing_utc exactly, so the due check passes on its inclusive bound"
            - "trigger call 6 returns HTTP 200 with Protest.${prt}.evidence_count == 1, status still HEARING_SCHEDULED, and evidence_log[0].recorded_utc == 2026-08-05T18:00:00Z"
            - "trigger call 7 returns HTTP 200 with Protest.${prt}.status == HEARD and decision still NONE"
            - "trigger call 8 returns HTTP 422 with error_id ERR_DECISION_PAYLOAD_INVALID: PENALTY_DSQ carries no penalty_target_entry_id"
            - "trigger call 9 returns HTTP 422 with error_id ERR_DECISION_PAYLOAD_INVALID: redress_race_number is present for a decision other than REDRESS_GRANTED"
            - "trigger call 10 returns HTTP 422 with error_id ERR_REDRESS_NOT_COMPUTABLE: race 1 is the redress race itself, so avg_source for entry A is empty and step 3 of redress_points_average rejects"
            - "after trigger call 10, Protest.${prt}.status is still HEARD, decision NONE, penalty_target_entry_id null and redress_race_number null - a rejected decide writes nothing"
            - "trigger call 11 returns HTTP 200 with Protest.${prt}.status == DECIDED and decision == DISMISSED, penalty_target_entry_id null and redress_race_number null"
            - "RaceResult.${res_a} still reads place 1 / points 1.0 / corrected_seconds 2872.2 and RaceResult.${res_b} place 2 / points 2.0 / corrected_seconds 2987.2, and Race.${r1}.rescore_count == 0, because a DISMISSED decision rewrites no result and the rescore hop is caused by the rewrite hop"
            - "Regatta.${reg}.status is still RACING after trigger call 11: final_race_count is 1 against planned_race_count 6, so the bubble-up condition is unmet regardless of the closed protest"

  # =========================================================================
  # From Table 7 (RBAC)
  # =========================================================================
  # role_model is `segregation_of_duties`, so the peer-role probes below are joined by
  # a same-person conflict probe. There is no approval_chain, hierarchical_override or
  # delegated_authority row to emit: no role in section 1.7 subsumes another and no
  # endpoint grants or revokes authority on behalf of a second actor.
  - section: rbac
    instances:

      - name: measurer_cannot_read_duty_assignments_staffing_or_series_standing
        claim_type: role_cannot_perform_other_roles_operations
        grounds:
          - roles[Measurer]
          - endpoints[GET /duty-assignments]
          - endpoints[GET /races/{id}/staffing]
          - endpoints[GET /entries/{id}/series-standing]
          - validations[priority 3 ERR_FORBIDDEN_ROLE]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The Measurer's shared_operations say "every GET read endpoint EXCEPT
          /races/{id}/staffing, /duty-assignments and /entries/{id}/series-standing", so those
          three reads are 403 ERR_FORBIDDEN_ROLE for a licensed measurer while the same measurer
          reads certificates and boats freely and a RaceOfficer reads the duty list at 200.
        test_recipe:
          setup:
            - "One licensed measurer, one chair, one PRO and one helm on the roster."
            - "A regatta with the notice of race published, one boat with an ISSUED certificate, one SUBMITTED entry and one race scheduled for 2026-08-05T14:00:00Z."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Dana Reeve", email: "dana.reeve@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_pro: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, fleet_minimum: 2, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
            - { call: "POST /regatta-ops/races", payload: { regatta_id: "${reg}", race_number: 1, course_code: "DISTANCE_COASTAL", course_distance_nm: 6.0, scheduled_start_utc: "2026-08-05T14:00:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { r1: $.data.id } }
          trigger:
            - { call: "GET /regatta-ops/duty-assignments", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "GET /regatta-ops/races/${r1}/staffing", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "GET /regatta-ops/entries/${e_a}/series-standing", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "GET /regatta-ops/rating-certificates/${c_a}", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "GET /regatta-ops/duty-assignments", payload: {}, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "GET /regatta-ops/races/${r1}/staffing", payload: {}, as: RaceOfficer, as_user_id: "${m_pro}" }
          assert:
            - "trigger calls 1, 2 and 3 each return HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "trigger call 4 returns HTTP 200 with id ${c_a}, rating_value 171.3 and status ISSUED: the measurer keeps every other read"
            - "trigger call 5 returns HTTP 200 with data == [] and pagination.total_count == 0"
            - "trigger call 6 returns HTTP 200 with required_position_codes [PRO, SIGNALS, TIMEKEEPER], staffed_position_codes [] and is_ready false"

      - name: jury_chair_and_competitor_cannot_run_the_race_officer_start_sequence
        claim_type: role_cannot_perform_other_roles_operations
        grounds:
          - roles[JuryChair]
          - roles[Competitor]
          - roles[RaceOfficer]
          - endpoints[POST /races/{id}/start-sequence]
          - endpoints[POST /races]
          - validations[priority 3 ERR_FORBIDDEN_ROLE]
          - validations[priority 8 ERR_RACE_NOT_FOUND]
        distinguishing_aspect: |
          POST /races/{id}/start-sequence is exclusive to RaceOfficer, so a JuryChair and a
          Competitor are both 403 ERR_FORBIDDEN_ROLE, and a JuryChair aiming at a race id that
          does not exist is still 403 ERR_FORBIDDEN_ROLE and not 404 ERR_RACE_NOT_FOUND, because
          priority 3 runs before priority 8.
        test_recipe:
          setup:
            - "One chair, one PRO, one certified judge and one helm on the roster."
            - "A regatta with the notice of race published and race 1 scheduled for 2026-08-05T14:00:00Z, start_status PENDING."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Dana Reeve", email: "dana.reeve@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_pro: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Nils Brandt", email: "nils.brandt@yc.test", judge_certification_level: "REGIONAL" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_jc: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, fleet_minimum: 2, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/races", payload: { regatta_id: "${reg}", race_number: 1, course_code: "DISTANCE_COASTAL", course_distance_nm: 6.0, scheduled_start_utc: "2026-08-05T14:00:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/races/${r1}/start-sequence", payload: {}, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/races/${r1}/start-sequence", payload: {}, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/races/00000000-0000-4000-8000-0000000000ff/start-sequence", payload: {}, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/races", payload: { regatta_id: "${reg}", race_number: 2, course_code: "DISTANCE_COASTAL", course_distance_nm: 6.0, scheduled_start_utc: "2026-08-05T16:00:00Z" }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "GET /regatta-ops/races/${r1}", payload: {}, as: JuryChair, as_user_id: "${m_jc}" }
          assert:
            - "trigger calls 1 and 2 each return HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "trigger call 3 returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE and NOT 404 ERR_RACE_NOT_FOUND"
            - "trigger call 4 returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE: POST /races is shared by RegattaChair and RaceOfficer only, and exactly one Race row exists for regatta ${reg} afterwards"
            - "trigger call 5 returns HTTP 200: every GET read endpoint is open to JuryChair, and Race.${r1}.start_status is still PENDING with recall_count 0"

      - name: club_admin_cannot_publish_documents_or_shape_the_regatta
        claim_type: role_cannot_perform_other_roles_operations
        grounds:
          - roles[ClubAdmin]
          - roles[RegattaChair]
          - endpoints[POST /race-documents]
          - endpoints[POST /divisions]
          - endpoints[POST /regattas/{id}/open-racing]
          - endpoints[POST /regattas]
          - validations[priority 3 ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          ClubAdmin shares POST /regattas with RegattaChair but holds no racing authority, so the
          same audit id that just created the regatta is 403 ERR_FORBIDDEN_ROLE on
          POST /race-documents, POST /divisions and POST /regattas/{id}/open-racing - and its
          opaque "ops-desk-1" id never draws ERR_UNKNOWN_ACTOR the way an entity-backed role would.
        test_recipe:
          setup:
            - "One chair on the roster and a DRAFT regatta created by the club office under the audit id ops-desk-1."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, fleet_minimum: 2, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { reg: $.data.id, reg_v1: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 150.0, rating_band_high: 230.0, min_entries: 2 }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "POST /regatta-ops/regattas/${reg}/open-racing", payload: {}, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { doc1: $.data.id } }
          assert:
            - "the setup regatta create returns HTTP 201 even though ops-desk-1 is not a ClubMember: ClubAdmin identity is opaque, so ERR_UNKNOWN_ACTOR is never raised for it"
            - "trigger calls 1, 2 and 3 each return HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "after trigger call 3, Regatta.${reg}.status is still DRAFT with nor_revision 0, si_revision 0, confirmed_division_count 0 and version 1"
            - "trigger call 4 returns HTTP 201 with RaceDocument.${doc1}.revision == 1 and status EFFECTIVE, and Regatta.${reg}.status becomes NOR_PUBLISHED with version 2"

      - name: club_admin_exclusive_credential_patch_unlocks_the_measurer
        claim_type: role_can_perform_its_exclusive_operations
        grounds:
          - roles[ClubAdmin]
          - endpoints[PATCH /club-members/{id}]
          - entities[ClubMember]
          - validations[priority 4 ERR_MEASURER_NOT_LICENSED]
        distinguishing_aspect: |
          PATCH /club-members/{id} is ClubAdmin-exclusive and is the only way a member acquires
          measurer_license_id, so the very same member who was refused with 403
          ERR_MEASURER_NOT_LICENSED files a certificate at 201 immediately after the patch, and
          the patch touches only the keys it names.
        test_recipe:
          setup:
            - "A member with no credentials at all, plus a helm who owns one measured boat."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "PATCH /regatta-ops/club-members/${m_mea}", payload: { measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "PATCH /regatta-ops/club-members/${m_mea}", payload: { safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
          assert:
            - "trigger call 1 returns HTTP 403 with error_id ERR_MEASURER_NOT_LICENSED and creates no RatingCertificate"
            - "trigger call 2 returns HTTP 200 with ClubMember.${m_mea}.measurer_license_id == M-101, judge_certification_level still null, safety_course_expiry_utc still null, assigned_duty_minutes 0 and version 2"
            - "trigger call 3 returns HTTP 201 with RatingCertificate.${c_a}.measured_by_member_id == ${m_mea}, status DRAFT and rating_value 171.3: the failed call at trigger 1 left Boat.${b_a}.version untouched, so the same expected_boat_version is still current"
            - "trigger call 4 returns HTTP 200 with ClubMember.${m_mea}.safety_course_expiry_utc == 2027-06-30T00:00:00Z, measurer_license_id still M-101 and version 3"

      - name: segregation_of_duties_blocks_confirming_a_seated_judge_as_principal_race_officer
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile[role_model segregation_of_duties]
          - validations[priority 21 ERR_JURY_CONFLICT_OF_INTEREST]
          - errors[ERR_JURY_CONFLICT_OF_INTEREST]
          - state_machines[JuryPanel]
          - endpoints[POST /duty-assignments/{id}/confirm]
          - endpoints[POST /jury-panels/{id}/recuse]
        distinguishing_aspect: |
          The conflict is checked at confirmation, not at proposal, and only against position PRO:
          proposing the seated judge as PRO is 201, confirming it is 409
          ERR_JURY_CONFLICT_OF_INTEREST, confirming the same judge as TIMEKEEPER is 200, and once
          the judge is recused off the panel the PRO confirmation that was refused succeeds.
        test_recipe:
          setup:
            - "A regatta with the notice of race and sailing instructions published, jury_quorum_required 2."
            - "Panel P is SEATED with chair Nils Brandt and one seat held by Ida Moss, who is neither a helm nor a crew member of the regatta."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
