  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_requires_roommate_group_locked
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.RoommateGroup.FORMING_to_LOCKED
          - validations[priority=7]
          - entities.RoommateGroup.fields.status
        distinguishing_aspect: |
          Entity pair Application -> RoommateGroup: an Application with
          roommate_group_id set cannot move DRAFT -> SUBMITTED while the group
          is still FORMING; the submit is rejected with ERR_PRECONDITION_NOT_MET
          until the group is LOCKED.
        test_recipe:
          setup:
            - "An Application referencing a roommate group that is still FORMING (not LOCKED)"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Group Owner", class_year: JUNIOR, gender_identity: MALE, lottery_number: 110 }
              as: HousingOfficer
              captures: { go_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "FALL_2026M" }
              as: HousingOfficer
              captures: { ddcyc_id: $.data.id }
            - call: "POST /roommate-groups"
              payload: { cycle_id: "${ddcyc_id}", owner_student_id: "${go_id}", target_size: 2 }
              as: Student
              as_user_id: "${go_id}"
              captures: { dgrp_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${ddcyc_id}", student_id: "${go_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: DOUBLE, roommate_group_id: "${dgrp_id}" }
              as: Student
              as_user_id: "${go_id}"
              captures: { dgapp_id: $.data.id }
          trigger:
            - call: "POST /applications/${dgapp_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${go_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PRECONDITION_NOT_MET"
            - "Application.${dgapp_id}.status == DRAFT"

      - name: break_approve_requires_building_offers_break_housing
        grounds:
          - state_machines.BreakHousingRequest.REQUESTED_to_APPROVED
          - validations[priority=7]
          - entities.Building.fields.offers_break_housing
        distinguishing_aspect: |
          Entity pair BreakHousingRequest -> Building (a DIFFERENT pair than
          Application -> RoommateGroup): approving a break request requires the
          room's Building.offers_break_housing == true; otherwise
