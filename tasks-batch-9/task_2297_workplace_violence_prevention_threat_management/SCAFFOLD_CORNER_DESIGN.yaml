        grounds:
          - validations[priority=8]
          - validations[priority=32]
          - errors[ERR_STALE_PLAN_VERSION]
          - errors[ERR_WORK_AREA_WORKSITE_MISMATCH]
          - concurrency_rules[hazard-assessment-create-stale-plan]
          - endpoints[POST /hazard-assessments]
        distinguishing_aspect: |
          One request breaks the OCC guard at priority 8 and the cross-aggregate rule at priority 32 at
          the same time: the answer is ERR_STALE_PLAN_VERSION with HTTP 412, and only when the caller
          re-reads the plan to get version 2 does the 409 ERR_WORK_AREA_WORKSITE_MISMATCH surface - which
