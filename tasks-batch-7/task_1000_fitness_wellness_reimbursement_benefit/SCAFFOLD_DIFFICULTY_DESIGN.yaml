          - calculations.calc_allowance_ledger
        distinguishing_aspect: |
          Depth-4 cascade from POST /claims/{id}/pay: pay mutates enrollment.used_cents (1);
          used crossing annual_allowance flips enrollment ACTIVE -> EXHAUSTED (2); EXHAUSTED
          auto-rejects the other SUBMITTED claim (3); that rejection releases its reservation (4).
        test_recipe:
          setup:
            - "Plan with tiny INDIVIDUAL tier: annual 4000, quarterly 10000, per-claim 5000; funding 100000"
            - "Claim A1 claimed 3000 APPROVED 3000 and PAID (used 3000); Claim A2 claimed 1000 APPROVED 1000 UNPAID"
            - "Claim B claimed 1000 SUBMITTED (reserved 2000 = A2 1000 + B 1000)"
