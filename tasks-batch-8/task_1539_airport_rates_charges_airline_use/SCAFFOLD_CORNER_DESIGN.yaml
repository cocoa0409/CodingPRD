  # =========================
  # Section: cross-cutting complexity layers
  # =========================
  - section: cross_cutting_complexity_layers
    instances:
      - name: cascading_side_effects_n_level_chain
        claim_type: cascade_chain
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.AnnualSettlement.RESOLVED_to_FINALIZED
        distinguishing_aspect: "3-level cascade: finalize → AnnualSettlement FINALIZED → FiscalYear CLOSED → RatesSetting DRAFT → EXPIRED."
        excluded_because:
          difficulty_instance: transitive_cascade / settlement_finalize_cascade_to_fy_close_and_rates_expire
          rationale: "Asserted as the success path of the named §1.8 instance."

      - name: optimistic_concurrency_via_version_field
        claim_type: occ_layer
        grounds:
          - complexity_profile.complexity_layers
          - concurrency_rules
        distinguishing_aspect: "Stale expected_fiscal_year_version on rates_settings POST → 412."
        excluded_because:
          difficulty_instance: cross_cutting_complexity_layers / occ_stale_version_on_rates_setting_create
          rationale: "Already covered by endpoints/occ_stale_version_on_rates_setting_create corner instance."

      - name: rate_threshold_triggers_at_500kg
        claim_type: threshold_boundary
        grounds:
          - calculations.landing_fee_charge
        distinguishing_aspect: "500-kg remainder boundary at >= vs > covered by §1.8 boundary instance."
        excluded_because:
          difficulty_instance: boundary_precision_check / landing_fee_500kg_remainder_boundary
          rationale: "Asserted as the success path of the named §1.8 instance."

      - name: dual_variant_calculation_residual_vs_compensatory
        claim_type: dual_variant_layer
        grounds:
          - calculations.landing_fee_rate
        distinguishing_aspect: "RESIDUAL vs COMPENSATORY rate divergence covered by §1.8."
        excluded_because:
          difficulty_instance: dual_variant_calc / landing_fee_residual_vs_compensatory_divergence
          rationale: "Asserted as the success path of the named §1.8 instance."

