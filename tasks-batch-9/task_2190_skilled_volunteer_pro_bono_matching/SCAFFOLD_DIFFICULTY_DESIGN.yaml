          setup:
            - "Canonical world exactly as instance 1 (cycle 2026-Q1 with 10 slots, LARGE partner, SENIOR volunteer at 150.00/h vetted on LEGAL_CONTRACTS proficiency 4, HARD window [2026-01-05, 2026-03-01) offering 300.00 hours, clock 2026-01-10T00:00:00Z before the first request)."
            - "One ProjectRequest scoped at estimated_hours 40.00 x complexity_factor 1.00 with a single deliverable at weight_pct 100.00, approved, matched, accepted, agreement executed by both parties, engagement started -> committed_hours 40.00, approved_hours 0.00, work_status IN_PROGRESS, creep_escalation_level NONE."
            - "Availability headroom: hours_offered 300.00 with hours_committed 40.00, so no TimeLog in the ladder can trip priority 55 ERR_AVAILABILITY_HOURS_EXCEEDED (the ladder approves at most 60.00 hours)."
            - "TimeLog.hours is capped at 12.00 per row, so each rung is filled with several rows; every work_date sits inside the window and at or before the due_at of the milestone that will approve it."
            - "Milestones are created one at a time, each due_at 72h after the previous one (CHECKIN_BUFFER_HOURS) so that at most one SCHEDULED milestone is ever open on the volunteer (CHECKIN_SATURATION_LIMIT 2 is never approached), and each hold happens at due_at - 24h exactly (CHECKIN_GRACE_HOURS)."
