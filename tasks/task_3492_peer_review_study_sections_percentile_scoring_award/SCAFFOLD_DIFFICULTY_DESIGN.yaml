            - { call: "POST /grants/study-sections", payload: { name: "Section J", meeting_date: "2027-03-01T00:00:00Z", application_quota: 10 }, as: ScientificReviewOfficer, captures: { sec_id: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI A", email: "pia@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi_a: $.data.id } }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "JIT app", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi_a}", captures: { app_a: $.data.id } }
            - { call: "POST /grants/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: "${pi_a}", captures: { app_a_v: $.data.version } }
            - { call: "POST /grants/applications/${app_a}/referral", payload: { study_section_id: "${sec_id}", institute_id: "${insti_id}", expected_application_version: "${app_a_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 1", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r1: $.data.id } }
            - { call: "POST /grants/reviewers/${r1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 2", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r2: $.data.id } }
            - { call: "POST /grants/reviewers/${r2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r1}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { a_1: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r2}", role: "SECONDARY" }, as: ScientificReviewOfficer, captures: { a_2: $.data.id } }
            - { call: "POST /grants/assignments/${a_1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/assignments/${a_2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/study-sections/${sec_id}/convene", payload: {}, as: ScientificReviewOfficer }
            - { call: "POST /grants/assignments/${a_1}/submit-critique", payload: { significance_score: 3, innovation_score: 3, approach_score: 3, investigator_score: 3, environment_score: 3, overall_impact_score: 3 }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/assignments/${a_2}/submit-critique", payload: { significance_score: 3, innovation_score: 3, approach_score: 3, investigator_score: 3, environment_score: 3, overall_impact_score: 3 }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/study-sections/${sec_id}/release-scores", payload: {}, as: ScientificReviewOfficer }
            - { call: "POST /grants/council-reviews", payload: { application_id: "${app_a}", recommendation: "FUND", priority_alignment_score: 4 }, as: CouncilMember }
            - { call: "POST /grants/institutes/${insti_id}/payline-decisions", payload: { base_payline_percentile: 100.0, expected_institute_version: "${insti_v}" }, as: ProgramOfficer }
            - { call: "GET /grants/applications/${app_a}/jit-requests", payload: {}, as: GrantsOfficer, captures: { jit_a: "$.data[0].id" } }
          trigger:
            - { call: "POST /grants/jit-requests/${jit_a}/submit-items", payload: { items_submitted: ["OTHER_SUPPORT", "BUDGET_JUSTIFICATION"] }, as: Applicant, as_user_id: "${pi_a}", captures: { st1: $.data.status } }
            - { call: "POST /grants/jit-requests/${jit_a}/adjudicate", payload: { decision: "RETURN", return_reason: "other support page incomplete" }, as: GrantsOfficer, captures: { st2: $.data.status } }
            - { call: "POST /grants/jit-requests/${jit_a}/submit-items", payload: { items_submitted: ["OTHER_SUPPORT", "BUDGET_JUSTIFICATION"] }, as: Applicant, as_user_id: "${pi_a}", captures: { st3: $.data.status } }
            - { call: "POST /grants/jit-requests/${jit_a}/adjudicate", payload: { decision: "ACCEPT", budget_cut_pct: 0.10 }, as: GrantsOfficer, captures: { st4: $.data.status, cut: $.data.budget_cut_pct } }
            - { call: "GET /grants/applications/${app_a}", payload: {}, as: ProgramOfficer, captures: { app_st: $.data.status } }
          assert:
            - "JitRequest.${jit_a}.required_items == [OTHER_SUPPORT, BUDGET_JUSTIFICATION]"
            - "JitRequest.${jit_a}.status after first submit-items == SUBMITTED"
            - "JitRequest.${jit_a}.status after adjudicate RETURN == RETURNED"
            - "JitRequest.${jit_a}.status after resubmission == SUBMITTED (cycle closed)"
            - "JitRequest.${jit_a}.status after adjudicate ACCEPT == ACCEPTED"
            - "JitRequest.${jit_a}.budget_cut_pct == 0.10"
            - "Application.${app_a}.status == JIT_COMPLETE"

  - rule_id: transitive_cascade
    instances:
      - name: withdraw_cascade_releases_assignments_and_reviewer_capacity
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_WITHDRAWN
          - state_machines.Assignment.ACCEPTED_to_CANCELLED
          - entities.Reviewer.fields.active_assignment_count
          - entities.StudySection.fields.assigned_application_count
        distinguishing_aspect: |
          Depth-3 chain from the withdraw trigger: L1 Application UNDER_REVIEW -> WITHDRAWN causes
          L2 each live Assignment -> CANCELLED, which itself causes L3 each Reviewer
          .active_assignment_count to decrement and the StudySection assigned_application_count to
          decrement — each link is caused by the previous link's mutation, not by the withdraw call.
        test_recipe:
          setup:
            - "Application UNDER_REVIEW with two ACCEPTED assignments (reviewers r1, r2 at active_assignment_count 1 each); section assigned_application_count == 1"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/institutions", payload: { name: "Other College" }, as: ProgramOfficer, captures: { inst2_id: $.data.id } }
