  - rule_id: transitive_cascade
    instances:
      - name: supplement_approval_cascades_lines_totals_posture_and_stale_consent
        grounds:
          - state_machines.Supplement.SUBMITTED_to_APPROVED
          - calculations.approved_labor_hours_rollup
          - calculations.estimate_totals
          - calculations.authorization_posture_derivation
          - entities.RepairOrder.fields.consent_state
          - entities.RepairOrder.fields.consent_basis_cents
        distinguishing_aspect: |
          Trigger: an adjuster's APPROVE decision. Depth 4, each link caused by the previous one -
          (1) the supplement's PENDING_SUPPLEMENT line becomes APPROVED, (2) because that line entered
          the APPROVED input set the totals move to 51000/2040/53040 and customer_pay_cents to 50000,
          (3) because customer_pay_cents crossed CONSENT_THRESHOLD_CENTS the posture becomes
          CONSENT_REQUIRED, (4) because the posture recompute found consent_basis_cents 28080 below the
          new customer_pay_cents, the already-recorded consent is invalidated to NONE.
        test_recipe:
          setup:
            - "Insurer with supplement_round_limit 2; repair order with deductible 50000 and initial authorisation 400000."
            - "Locked estimate with a single BODY 4.5 h line: labor 27000, supplies 1080, pre-tax 28080, insurer 0, customer_pay 28080, posture OPEN."
            - "The customer consents at that figure, so consent_state is CONSENTED with consent_basis_cents 28080."
            - "A supplement for 24000 is raised with the order's current version, and one BODY 4.0 h line is written under it as PENDING_SUPPLEMENT."
