              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pb_id}", segment: "CORPORATE", account_reference: "CUST-BETA-0001", fraud_risk_baseline: 20 }
              as: ParticipantAdmin
              as_user_id: "${pb_id}"
              captures: { bca_id: $.data.id }
            - call: "POST /request-for-payments"
              payload: { requestor_participant_id: "${pa_id}", debtor_customer_account_id: "${bca_id}", amount_cents: 5000000, expiry_at: "2026-08-04T13:00:00Z", memo: "Invoice INV-7001" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { rfp_id: $.data.id }
          trigger:
            - call: "POST /request-for-payments/${rfp_id}/delivery"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
          assert:
            - "RequestForPayment.${rfp_id}.status == DELIVERED"
            - "RequestForPayment.${rfp_id}.delivered_at == 2026-08-03T13:00:00Z"
            - "RequestForPayment.${rfp_id}.response_deadline_at == 2026-08-03T13:30:00Z (min of expiry_at and delivered_at + 30 minutes)"
            - "RequestForPayment.${rfp_id}.expiry_at == 2026-08-04T13:00:00Z and amendment_round == 0 and last_response == null"
            - "Before delivery the row was status CREATED with delivered_at == null and response_deadline_at == null"

      - name: settling_an_already_settled_transfer_cannot_repeat
        claim_type: Idempotency
        grounds:
