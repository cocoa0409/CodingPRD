# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2982_renewable_energy_land_lease_easement_origination
#
# 9 rule_id blocks, 20 instances. Every numeric literal in every `assert:` was
# computed by executing the §1.3 formulas against the pinned setup inputs.
#
# Shared conventions across every instance below:
#   * The server's logical clock starts at 2026-08-01T00:00:00Z (§1.5
#     /_clock/set_current_utc). No instance relies on wall-clock time.
#   * Operator X-User-IDs are stable literals: la-user-01 (LandAgent),
#     tc-user-01 / tc-user-02 (TitleCounsel, distinct for segregation of
#     duties), pm-user-01 / pm-user-02 (PortfolioManager, distinct because
#     exercise requires an actor other than the one who executed),
#     pa-user-01 (PaymentAdministrator). The Landowner role always acts with
#     as_user_id equal to the captured Landowner id.
#   * Because acreage, screening and curative cascades bump Parcel.version and
#     because post-security / submit-memo / record-memo / invoice-create all
#     bump LeaseAgreement.version, every OCC input is captured from a GET
#     immediately before the guarded write.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: annual_rent_variant_divergence_on_recording
        grounds:
          - calculations.annual_rent_amount
          - entities.RentInvoice.fields.rent_variant
          - entities.RentInvoice.fields.acre_basis
          - entities.RentInvoice.fields.royalty_component_cents
          - state_machines.LeaseAgreement.MEMO_SUBMITTED_to_RECORDED
          - concurrency_rules[invoice-create-stale-lease]
        distinguishing_aspect: |
          This instance lives in the money domain (RentInvoice / LeaseAgreement):
          for byte-identical lease terms and byte-identical production_mwh of
          90000, the PROVISIONAL variant bills 15000000 cents on the 125.00
          gross acres with royalty suppressed to 0, while the FINAL_AS_BUILT
          variant bills 13230000 cents on the 100.00 buildable acres with the
          royalty component winning the greater-of comparison — a divergence of
          -1770000 cents driven solely by recording_status.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC' with w9_on_file true and payment_hold false."
            - "Three SetbackRule rows for jurisdiction_code 48453 with encumbrance_rate_per_acre 0.06, 0.10 and 0.04, published before any parcel exists."
            - "One Parcel of 125.00 gross acres in county 48453, slope 4.0, so slope_excluded_acres 0.00, raw_setback_acres 25.00 (7.50 + 12.50 + 5.00) and buildable_acres 100.00; screening_score 82.15, screening_tier PRIORITY, status QUALIFIED."
            - "One OptionAgreement with rent_structure_type ROYALTY_HYBRID, base_rent_per_acre_cents 120000, royalty_rate_bps 350, escalator_pct_bps 200, escalator_mode COMPOUND, executed and then exercised, producing a LeaseAgreement with acre_basis_at_exercise 100.00 and total_security_required_cents 5225000."
            - "One DRAFT RentInvoice for period_year 1 created while recording_status is UNRECORDED, then voided so the period_year 1 slot is free again."
            - "The lease's security fully posted (5225000) and its memorandum submitted and recorded, so recording_status is RECORDED."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Caprock Ranch Holdings LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "land@caprock.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l1_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.06, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "OCCUPIED_DWELLING", setback_feet: 500, encumbrance_rate_per_acre: 0.10, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PUBLIC_ROAD", setback_feet: 100, encumbrance_rate_per_acre: 0.04, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-1188-004", county_fips: "48453", landowner_id: "${l1_id}", gross_acres: 125.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_at_id: "$.data.id" }
            - call: "GET /land-origination/parcels/${p_at_id}"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_at_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_at_id}", landowner_id: "${l1_id}", expected_parcel_version: "${p_at_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 2, extension_fee_per_acre_cents: 3000, rent_structure_type: "ROYALTY_HYBRID", base_rent_per_acre_cents: 120000, royalty_rate_bps: 350, escalator_pct_bps: 200, escalator_mode: "COMPOUND" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { opt_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${opt_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${opt_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l1_id}"
            - call: "POST /land-origination/option-agreements/${opt_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
            - call: "POST /land-origination/option-agreements/${opt_id}/exercise"
              payload: { exercise_notice_reference: "NOL-2982-0001" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { lease_id: "$.data.id", sec_required: "$.data.total_security_required_cents" }
            - call: "GET /land-origination/leases/${lease_id}"
              payload: {}
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { lease_v1: "$.data.version" }
            - call: "POST /land-origination/leases/${lease_id}/rent-invoices"
              payload: { expected_lease_agreement_version: "${lease_v1}", period_year: 1, production_mwh: 90000 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { inv_prov_id: "$.data.id" }
            - call: "POST /land-origination/rent-invoices/${inv_prov_id}/void"
              payload: { void_reason: "superseded by as-built invoice after recording" }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
            - call: "POST /land-origination/leases/${lease_id}/post-security"
              payload: { amount_cents: 5225000 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
            - call: "POST /land-origination/leases/${lease_id}/submit-memo"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-02"
            - call: "POST /land-origination/leases/${lease_id}/record-memo"
              payload: { recording_instrument_no: "2026-0044821" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
            - call: "GET /land-origination/leases/${lease_id}"
              payload: {}
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { lease_v2: "$.data.version" }
          trigger:
            - call: "POST /land-origination/leases/${lease_id}/rent-invoices"
              payload: { expected_lease_agreement_version: "${lease_v2}", period_year: 1, production_mwh: 90000 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { inv_final_id: "$.data.id" }
          assert:
            - "RentInvoice.${inv_prov_id}.rent_variant == PROVISIONAL"
            - "RentInvoice.${inv_prov_id}.acre_basis == 125.00"
            - "RentInvoice.${inv_prov_id}.per_acre_component_cents == 15000000"
            - "RentInvoice.${inv_prov_id}.royalty_component_cents == 0"
            - "RentInvoice.${inv_prov_id}.gross_rent_cents == 15000000"
            - "RentInvoice.${inv_final_id}.rent_variant == FINAL_AS_BUILT"
            - "RentInvoice.${inv_final_id}.acre_basis == 100.00"
            - "RentInvoice.${inv_final_id}.per_acre_component_cents == 12000000"
            - "RentInvoice.${inv_final_id}.royalty_component_cents == 13230000"
            - "RentInvoice.${inv_final_id}.gross_rent_cents == 13230000"
            - "RentInvoice.${inv_final_id}.gross_rent_cents - RentInvoice.${inv_prov_id}.gross_rent_cents == -1770000"
            - "LeaseAgreement.${lease_id}.total_security_required_cents == 5225000"

      - name: parcel_screening_variant_divergence_on_field_verification
        grounds:
          - calculations.parcel_screening_score
          - entities.Parcel.fields.screen_mode
          - entities.Parcel.fields.screening_score
          - entities.Parcel.fields.screening_tier
          - entities.Parcel.fields.blocking_curative_open_count
          - state_machines.Parcel.QUALIFIED_to_SCREENING
        distinguishing_aspect: |
          This instance lives in the land-screening domain (Parcel), not the
          money domain: with the parcel's own inputs frozen, DESKTOP scores
          82.15 / PRIORITY by trusting the reported title grade B, while
          FIELD_VERIFIED scores 75.90 / STANDARD by stepping the grade down one
          rung to C for the single BLOCKING curative item still open. Only
          title_sub moves; buildable_acres stays 100.00 in both variants.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC' with w9_on_file true and payment_hold false."
            - "Three SetbackRule rows for jurisdiction_code 48453 with encumbrance_rate_per_acre 0.06, 0.10 and 0.04."
            - "One Parcel of 125.00 gross acres in county 48453, slope 4.0, interconnection_distance_km 3.50, resource_capacity_factor 0.38, title_condition_grade B: buildable_acres 100.00, screen_mode DESKTOP, screening_score 82.15, screening_tier PRIORITY, status QUALIFIED."
            - "One BLOCKING TitleCurativeItem on that parcel raised by tc-user-01: blocking_curative_open_count becomes 1, the parcel reverts to SCREENING, and because screen_mode is still DESKTOP the score stays exactly 82.15."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Caprock Ranch Holdings LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "land@caprock.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l1_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.06, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "OCCUPIED_DWELLING", setback_feet: 500, encumbrance_rate_per_acre: 0.10, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PUBLIC_ROAD", setback_feet: 100, encumbrance_rate_per_acre: 0.04, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-1188-004", county_fips: "48453", landowner_id: "${l1_id}", gross_acres: 125.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_at_id: "$.data.id", desktop_score: "$.data.screening_score" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_at_id}", item_type: "MINERAL_SEVERANCE", severity: "BLOCKING", curative_cost_cents: 450000 }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { ti_a_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels/${p_at_id}/rescreen"
              payload: { screen_mode: "FIELD_VERIFIED" }
              as: LandAgent
              as_user_id: "la-user-01"
          assert:
            - "Parcel.${p_at_id}.screen_mode == FIELD_VERIFIED"
            - "Parcel.${p_at_id}.screening_score == 75.90"
            - "Parcel.${p_at_id}.screening_tier == STANDARD"
            - "before the trigger, Parcel.${p_at_id}.screening_score == 82.15 and screening_tier == PRIORITY"
            - "Parcel.${p_at_id}.buildable_acres == 100.00 (unchanged by the variant switch)"
            - "Parcel.${p_at_id}.slope_excluded_acres == 0.00 and Parcel.${p_at_id}.setback_encumbered_acres == 25.00"
            - "Parcel.${p_at_id}.blocking_curative_open_count == 1"
            - "Parcel.${p_at_id}.status == SCREENING"
            - "Parcel.${p_at_id}.curative_cost_cents == 0 (cost is capitalised only by the CLEARED branch)"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: setback_rounding_order_per_rule_then_sum
        mode: b
        grounds:
          - calculations.buildable_acres_derivation
          - calculations.buildable_acres_derivation.precision
          - entities.Parcel.fields.raw_setback_acres
          - entities.Parcel.fields.buildable_acres
          - entities.SetbackRule.fields.encumbrance_rate_per_acre
        distinguishing_aspect: |
          Mode (b): rounding order and precision inside one multi-step formula.
          The parcel is deliberately small (15.00 gross acres) and the two
          county-48027 setback rates (0.0550 and 0.0750) are chosen so that
          per-rule rounding and rate-summing disagree: rounding each rule first
          gives 0.83 + 1.13 = 1.96 raw setback acres, while summing the rates to
          0.1300 and rounding once gives 1.95. The one-cent-of-an-acre gap
          propagates into buildable_acres (13.04 versus 13.05). This is a
          rounding-order claim only; no branch selection and no term ordering is
          involved.
        test_recipe:
          setup:
            - "One Landowner 'Llano Uplands Partnership' with w9_on_file true."
            - "Exactly two SetbackRule rows for jurisdiction_code 48027, published before the parcel exists: PROPERTY_LINE with encumbrance_rate_per_acre 0.0550 and PUBLIC_ROAD with encumbrance_rate_per_acre 0.0750."
            - "No other SetbackRule row shares jurisdiction_code 48027 and no NeighborConsent exists, so consent_released_acres stays 0.00."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Llano Uplands Partnership", entity_type: "PARTNERSHIP", mailing_state: "TX", contact_email: "ops@llanoup.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l2_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48027", rule_type: "PROPERTY_LINE", setback_feet: 125, encumbrance_rate_per_acre: 0.0550, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { sr_a_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48027", rule_type: "PUBLIC_ROAD", setback_feet: 80, encumbrance_rate_per_acre: 0.0750, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { sr_b_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-2027-118", county_fips: "48027", landowner_id: "${l2_id}", gross_acres: 15.00, interconnection_distance_km: 2.00, resource_capacity_factor: 0.36, slope_pct: 3.0, title_condition_grade: "A", zoning_code: "AG1" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_round_id: "$.data.id" }
          assert:
            - "Parcel.${p_round_id}.slope_excluded_acres == 0.00 (slope_pct 3.0 is inside the <= 5.0 tier, slope_rate 0.00)"
            - "Parcel.${p_round_id}.raw_setback_acres == 1.96 (0.83 + 1.13, each rounded before summing)"
            - "Parcel.${p_round_id}.raw_setback_acres != 1.95 (the value produced by summing rates 0.0550 + 0.0750 to 0.1300 and rounding once)"
            - "Parcel.${p_round_id}.consent_released_acres == 0.00"
            - "Parcel.${p_round_id}.setback_encumbered_acres == 1.96"
            - "Parcel.${p_round_id}.buildable_acres == 13.04"
            - "Parcel.${p_round_id}.screening_score == 90.30 and screening_tier == PRIORITY"
            - "Parcel.${p_round_id}.status == SCREENING because buildable_acres 13.04 < MIN_BUILDABLE_ACRES 80.00"
            - "gross_acres 15.00 == slope_excluded_acres 0.00 + setback_encumbered_acres 1.96 + buildable_acres 13.04"

      - name: security_tier_keyed_on_gross_not_total
        mode: c
        grounds:
          - calculations.decommissioning_security_amount
          - entities.LeaseAgreement.fields.gross_security_cents
          - entities.LeaseAgreement.fields.admin_rate_bps
          - entities.LeaseAgreement.fields.admin_loading_cents
          - entities.LeaseAgreement.fields.total_security_required_cents
          - state_machines.OptionAgreement.EXECUTED_to_EXERCISED
        distinguishing_aspect: |
          Mode (c): term ordering — which quantity the tier lookup is keyed on.
          A 99.99-acre parcel yields gross_security_cents 4999500, which sits
          just below SECURITY_TIER_1_CENTS 5000000 and therefore draws the
          highest administrative rate, 600 bps, for a total of 5299470. The trap
          is that the resulting total 5299470 is itself above 5000000, so an
          implementation that looks the tier up on the running total instead of
          on the gross figure would pick 450 bps and land on 5224478. Distinct
          from the mode (b) instance above, which is about rounding order rather
          than which term feeds the lookup.
        test_recipe:
          setup:
            - "One Landowner 'Pecos Bend Cattle Co' with w9_on_file true and payment_hold false."
            - "Exactly one SetbackRule for jurisdiction_code 48491 with encumbrance_rate_per_acre 0.0500."
            - "One Parcel of 105.25 gross acres in county 48491, slope 3.0, grade B: raw_setback_acres 5.26 (105.25 * 0.05 = 5.2625 rounded up), buildable_acres 99.99, screening_score 82.95, screening_tier PRIORITY, status QUALIFIED."
            - "One OptionAgreement on that parcel with option_fee_per_acre_cents 2500, sent, accepted by the landowner and executed by pm-user-01, so it sits in EXECUTED with total_option_paid_cents 263125."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Pecos Bend Cattle Co", entity_type: "LLC", mailing_state: "TX", contact_email: "title@pecosbend.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l3_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48491", rule_type: "PROPERTY_LINE", setback_feet: 130, encumbrance_rate_per_acre: 0.0500, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-2491-770", county_fips: "48491", landowner_id: "${l3_id}", gross_acres: 105.25, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 3.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_below_id: "$.data.id" }
            - call: "GET /land-origination/parcels/${p_below_id}"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_below_v: "$.data.version", p_below_buildable: "$.data.buildable_acres" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_below_id}", landowner_id: "${l3_id}", expected_parcel_version: "${p_below_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 118000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { opt_below_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${opt_below_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${opt_below_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l3_id}"
            - call: "POST /land-origination/option-agreements/${opt_below_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
          trigger:
            - call: "POST /land-origination/option-agreements/${opt_below_id}/exercise"
              payload: { exercise_notice_reference: "NOL-2982-0002" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { lease_below_id: "$.data.id" }
          assert:
            - "Parcel.${p_below_id}.raw_setback_acres == 5.26 and Parcel.${p_below_id}.buildable_acres == 99.99"
            - "LeaseAgreement.${lease_below_id}.acre_basis_at_exercise == 99.99"
            - "LeaseAgreement.${lease_below_id}.gross_security_cents == 4999500 (99.99 * 50000, round_half_up to whole cents)"
            - "LeaseAgreement.${lease_below_id}.admin_rate_bps == 600 because gross_security_cents 4999500 < SECURITY_TIER_1_CENTS 5000000"
            - "LeaseAgreement.${lease_below_id}.admin_loading_cents == 299970"
            - "LeaseAgreement.${lease_below_id}.total_security_required_cents == 5299470"
            - "LeaseAgreement.${lease_below_id}.total_security_required_cents != 5224478 (the figure produced by keying the tier on the running total instead of gross_security_cents)"
            - "OptionAgreement.${opt_below_id}.status == EXERCISED and total_option_paid_cents == 263125"
            - "LeaseAgreement.${lease_below_id}.security_posted_cents == 0 and rent_status == PENDING_FIRST_RENT"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: option_negotiation_loop_three_rounds_then_limit
        shape: cyclic
        grounds:
          - state_machines.OptionAgreement.SENT_to_COUNTERED
          - state_machines.OptionAgreement.COUNTERED_to_REVISED
          - state_machines.OptionAgreement.REVISED_to_SENT
          - entities.OptionAgreement.fields.round_index
          - validations[priority=34]
          - errors.ERR_NEGOTIATION_ROUND_LIMIT
        distinguishing_aspect: |
          Cyclic shape with a hard loop bound. The instrument revisits SENT three
          times through SENT -> COUNTERED -> REVISED -> SENT, each traversal
          overwriting terms so the loop is not idempotent (option_fee_per_acre_cents
          walks 2500 -> 2600 -> 2750 -> 2900 and base_rent_per_acre_cents walks
          120000 -> 121000 -> 122000 -> 123000), and the fourth counter is refused
          because round_index has reached MAX_NEGOTIATION_ROUNDS. This is the
          negotiation cycle on the pre-execution side of the machine.
        test_recipe:
          setup:
