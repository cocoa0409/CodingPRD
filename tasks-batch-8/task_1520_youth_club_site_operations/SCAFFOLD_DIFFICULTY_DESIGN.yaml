            - { call: "POST /members/${m3}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records", payload: { club_day_id: "${day}", member_id: "${m1}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records", payload: { club_day_id: "${day}", member_id: "${m2}" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /attendance-records", payload: { club_day_id: "${day}", member_id: "${m3}" }, as: SiteDirector, as_user_id: "${dir_id}" }
