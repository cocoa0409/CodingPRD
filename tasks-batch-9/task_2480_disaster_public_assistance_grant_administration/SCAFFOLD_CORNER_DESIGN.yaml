            - "PNP-B -> HTTP 200 with Applicant.${pnp_b_id}.eligibility_status == ELIGIBLE"
            - "PNP-C -> HTTP 200 with Applicant.${pnp_c_id}.eligibility_status == ELIGIBLE (the gate does not apply to CRITICAL)"

      - name: project_submit_by_ineligible_applicant_rejected
