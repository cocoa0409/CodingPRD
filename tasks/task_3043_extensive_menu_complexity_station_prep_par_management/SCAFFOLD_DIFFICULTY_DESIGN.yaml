# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task: task_3043_extensive_menu_complexity_station_prep_par_management
# 9 difficulty rules x 2 instances = 18 instances. Every setup_api_calls chain
# drives empty-DB -> precondition using only §1.5 endpoints. All formula-derived
# asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: prep_quantity_optimistic_vs_conservative_variants
        grounds:
          - calculations.forecast_prep_quantity
          - endpoints.POST_/api/prep-lists/{id}/generate
          - endpoints.POST_/api/prep-lists/{id}/regenerate
          - entities.PrepList.fields.lines
        distinguishing_aspect: |
          Same forecast and same recipe components produce a rounded_quantity of
          320 under OPTIMISTIC but 300 under CONSERVATIVE — the shelf-life cap
          (raw 300 floored to batches) binds only in the CONSERVATIVE variant.
          This instance operates on the PrepList/prep-item domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Restaurant R; PrepItem 'Diced Onions' (SAUTE, shelf_life 48h, min_batch 10 OZ)."
            - "Recipe 'Pasta A' with component 3 OZ onions per portion; forecast for 2026-09-02 with Pasta A x 100 (raw = 300 OZ), SUBMITTED then FINALIZED."
            - "PrepList for that forecast, still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["SAUTE"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "Diced Onions", station_type: "SAUTE", shelf_life_hours: 48, min_batch_size: 10, batch_unit: "OZ" }
              as: MenuAdmin
              captures: { pi_onions: $.data.id }
            - call: "POST /api/menu-revisions"
              payload: { restaurant_id: "${rest_id}", label: "2026-Fall", effective_from: "2026-09-15T00:00:00Z" }
              as: MenuAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /api/recipes"
              payload: { menu_revision_id: "${rev_id}", name: "Pasta A", station_type: "SAUTE", components: [{ prep_item_id: "${pi_onions}", quantity_per_portion: 3, unit: "OZ" }] }
              as: MenuAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /api/demand-forecasts"
              payload: { restaurant_id: "${rest_id}", service_date: "2026-09-02T00:00:00Z", expected_covers: 100, item_mix: [{ recipe_id: "${rec_id}", expected_count: 100 }] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { fc_id: $.data.id }
            - call: "POST /api/demand-forecasts/${fc_id}/submit"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/demand-forecasts/${fc_id}/finalize"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/prep-lists"
              payload: { restaurant_id: "${rest_id}", demand_forecast_id: "${fc_id}" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /api/prep-lists/${pl_id}/generate"
              payload: { generation_variant: "OPTIMISTIC" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pl_v: $.data.version }
            - call: "POST /api/prep-lists/${pl_id}/regenerate"
              payload: { generation_variant: "CONSERVATIVE", expected_prep_list_version: "${pl_v}" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
          assert:
            - "After generate OPTIMISTIC: PrepList.${pl_id}.lines has exactly one line for ${pi_onions} with raw_quantity == 300, buffered_quantity == 315, batch_count == 32, rounded_quantity == 320, capped_by_shelf_life == false"
            - "After generate OPTIMISTIC: PrepList.${pl_id}.total_rounded_quantity == 320 and generation_variant == OPTIMISTIC"
            - "After regenerate CONSERVATIVE: the line's buffered_quantity == 345, rounded_quantity == 300, capped_by_shelf_life == true"
            - "After regenerate CONSERVATIVE: PrepList.${pl_id}.total_rounded_quantity == 300"
            - "OPTIMISTIC (320) and CONSERVATIVE (300) diverge for identical forecast inputs"

      - name: slice_yield_provisional_vs_final_variants
        grounds:
          - calculations.slice_yield_reconciliation
          - state_machines.BakeryOrder.CONFIRMED_to_RECEIVED
          - state_machines.BakeryOrder.RECEIVED_to_RECONCILED
          - entities.BakeryOrder.fields.provisional_slices
        distinguishing_aspect: |
          The provisional variant assumes a perfect 14-slice yield (10 cakes ->
          140 slices at receive); the final variant replaces it with the observed
          126 slices at reconcile, producing yield_variance == -14. This instance
          operates on the BakeryOrder domain — a different entity domain from the
          PrepList dual variant.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant with weekly_bakery_budget_cents 100000."
            - "BakeryOrder for 10 ORIGINAL cakes, SUBMITTED then CONFIRMED (budget spent 25000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["BAKERY"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Pat Pastry", certified_station_types: ["BAKERY"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pastry_id: $.data.id }
            - call: "POST /api/bakery-orders"
              payload: { restaurant_id: "${rest_id}", cheesecake_type: "ORIGINAL", whole_cakes_ordered: 10 }
              as: PastryChef
              as_user_id: "${pastry_id}"
              captures: { bo_id: $.data.id }
            - call: "POST /api/bakery-orders/${bo_id}/submit"
              payload: {}
              as: PastryChef
              as_user_id: "${pastry_id}"
            - call: "POST /api/bakery-orders/${bo_id}/confirm"
              payload: {}
              as: InventoryController
              as_user_id: "ic-dana"
          trigger:
            - call: "POST /api/bakery-orders/${bo_id}/receive"
              payload: { whole_cakes_received: 10 }
              as: PastryChef
              as_user_id: "${pastry_id}"
            - call: "POST /api/bakery-orders/${bo_id}/reconcile-yield"
              payload: { final_slice_count: 126 }
              as: PastryChef
              as_user_id: "${pastry_id}"
          assert:
            - "After receive: BakeryOrder.${bo_id}.provisional_slices == 140 (10 x SLICES_PER_CAKE 14) and status == RECEIVED"
            - "After reconcile-yield: BakeryOrder.${bo_id}.final_slice_count == 126"
            - "After reconcile-yield: BakeryOrder.${bo_id}.yield_variance == -14"
            - "After reconcile-yield: BakeryOrder.${bo_id}.status == RECONCILED"
            - "provisional_slices (140) != final_slice_count (126) for the same delivery"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: station_load_score_peak_multiplier_mode_a
        grounds:
          - calculations.station_load_score
          - endpoints.GET_/api/stations/{id}/throughput-summary
          - entities.Restaurant.fields.current_waitlist_minutes
        distinguishing_aspect: |
          Mode (a) combinatorial: load_score combines >= 3 inputs (component
          complexity 4, modification multiplier 1.25, rack capacity 100) with a
          non-linear conditional peak multiplier — at waitlist 60 (>= 45) the
          score is 0.1500, at waitlist 10 it is 0.1000 for identical tickets.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; GRILL station with rack_slot_capacity 100."
            - "Published revision with recipe 'Steak' (GRILL, 4 components, no allergen tags)."
            - "Two FIRED tickets, each one Steak item with one modification (base = 2 x 4 x 1.25 = 10)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Leo Line", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "PI-1", station_type: "GRILL", shelf_life_hours: 48, min_batch_size: 1, batch_unit: "EA" }
              as: MenuAdmin
              captures: { pi_1: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "PI-2", station_type: "GRILL", shelf_life_hours: 48, min_batch_size: 1, batch_unit: "EA" }
              as: MenuAdmin
              captures: { pi_2: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "PI-3", station_type: "GRILL", shelf_life_hours: 48, min_batch_size: 1, batch_unit: "EA" }
              as: MenuAdmin
              captures: { pi_3: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "PI-4", station_type: "GRILL", shelf_life_hours: 48, min_batch_size: 1, batch_unit: "EA" }
              as: MenuAdmin
              captures: { pi_4: $.data.id }
            - call: "POST /api/menu-revisions"
              payload: { restaurant_id: "${rest_id}", label: "2026-Fall", effective_from: "2026-09-15T00:00:00Z" }
              as: MenuAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /api/recipes"
              payload: { menu_revision_id: "${rev_id}", name: "Steak", station_type: "GRILL", components: [{ prep_item_id: "${pi_1}", quantity_per_portion: 1, unit: "EA" }, { prep_item_id: "${pi_2}", quantity_per_portion: 1, unit: "EA" }, { prep_item_id: "${pi_3}", quantity_per_portion: 1, unit: "EA" }, { prep_item_id: "${pi_4}", quantity_per_portion: 1, unit: "EA" }] }
              as: MenuAdmin
              captures: { rec_steak: $.data.id }
            - call: "POST /api/menu-revisions/${rev_id}/submit-review"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/approve"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/publish"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/stations"
              payload: { restaurant_id: "${rest_id}", name: "Grill 1", station_type: "GRILL", rack_slot_capacity: 100 }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/service-tickets"
              payload: { restaurant_id: "${rest_id}", table_ref: "T1", items: [{ recipe_id: "${rec_steak}", modifications: ["no butter"], allergen_flags: [] }] }
              as: LineCook
              as_user_id: "${lc_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /api/service-tickets/${t1_id}/fire"
              payload: {}
              as: LineCook
              as_user_id: "${lc_id}"
            - call: "POST /api/service-tickets"
              payload: { restaurant_id: "${rest_id}", table_ref: "T2", items: [{ recipe_id: "${rec_steak}", modifications: ["extra sauce"], allergen_flags: [] }] }
              as: LineCook
              as_user_id: "${lc_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /api/service-tickets/${t2_id}/fire"
              payload: {}
              as: LineCook
              as_user_id: "${lc_id}"
            - call: "POST /api/restaurants/${rest_id}/update-waitlist"
              payload: { waitlist_minutes: 60 }
              as: KitchenManager
              as_user_id: "${mgr_id}"
          trigger:
            - call: "GET /api/stations/${st_id}/throughput-summary"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/restaurants/${rest_id}/update-waitlist"
              payload: { waitlist_minutes: 10 }
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "GET /api/stations/${st_id}/throughput-summary"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
          assert:
            - "First summary (waitlist 60 >= 45): load_score == 0.1500 (base 10 / capacity 100 = 0.1, peak multiplier 1.5)"
            - "Second summary (waitlist 10 < 45): load_score == 0.1000 (peak multiplier 1.0)"
            - "Both summaries: rack_load == 0 and par_health == OK (no batches, no pars)"

      - name: per_line_round_then_sum_mode_b
        grounds:
          - calculations.prep_batch_rounding_order
          - calculations.forecast_prep_quantity
          - entities.PrepList.fields.total_rounded_quantity
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          Lines of raw 11 and 13 with min_batch 10 each round up to 20 + 20 = 40;
          the forbidden sum-then-round order would produce ceil(25.2/10)*10 = 30
          and cannot even express per-item batch granularity.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; prep items A and B (both SAUTE, shelf 48h, min_batch 10 OZ)."
            - "Recipe RA uses 11 OZ of A per portion; recipe RB uses 13 OZ of B per portion."
            - "FINALIZED forecast: RA x 1 and RB x 1 (raw A = 11, raw B = 13)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["SAUTE"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "Item A", station_type: "SAUTE", shelf_life_hours: 48, min_batch_size: 10, batch_unit: "OZ" }
              as: MenuAdmin
              captures: { pa: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "Item B", station_type: "SAUTE", shelf_life_hours: 48, min_batch_size: 10, batch_unit: "OZ" }
              as: MenuAdmin
              captures: { pb: $.data.id }
            - call: "POST /api/menu-revisions"
              payload: { restaurant_id: "${rest_id}", label: "2026-Fall", effective_from: "2026-09-15T00:00:00Z" }
              as: MenuAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /api/recipes"
              payload: { menu_revision_id: "${rev_id}", name: "RA", station_type: "SAUTE", components: [{ prep_item_id: "${pa}", quantity_per_portion: 11, unit: "OZ" }] }
              as: MenuAdmin
              captures: { ra: $.data.id }
            - call: "POST /api/recipes"
              payload: { menu_revision_id: "${rev_id}", name: "RB", station_type: "SAUTE", components: [{ prep_item_id: "${pb}", quantity_per_portion: 13, unit: "OZ" }] }
              as: MenuAdmin
              captures: { rb: $.data.id }
            - call: "POST /api/demand-forecasts"
              payload: { restaurant_id: "${rest_id}", service_date: "2026-09-02T00:00:00Z", expected_covers: 10, item_mix: [{ recipe_id: "${ra}", expected_count: 1 }, { recipe_id: "${rb}", expected_count: 1 }] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { fc_id: $.data.id }
            - call: "POST /api/demand-forecasts/${fc_id}/submit"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/demand-forecasts/${fc_id}/finalize"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/prep-lists"
              payload: { restaurant_id: "${rest_id}", demand_forecast_id: "${fc_id}" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /api/prep-lists/${pl_id}/generate"
              payload: { generation_variant: "OPTIMISTIC" }
              as: KitchenManager
              as_user_id: "${mgr_id}"
          assert:
            - "Line for ${pa}: raw_quantity == 11, buffered_quantity == 11.55, batch_count == 2, rounded_quantity == 20"
            - "Line for ${pb}: raw_quantity == 13, buffered_quantity == 13.65, batch_count == 2, rounded_quantity == 20"
            - "PrepList.${pl_id}.total_rounded_quantity == 40 (per-line round then sum), NOT 30 (sum-then-round of 25.2 buffered)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: menu_revision_review_cycle_loop
        grounds:
          - state_machines.MenuRevision.IN_REVIEW_to_DRAFT
          - state_machines.MenuRevision.DRAFT_to_IN_REVIEW
          - entities.MenuRevision.fields.review_cycle_count
        distinguishing_aspect: |
          Cyclic machine on MenuRevision: DRAFT -> IN_REVIEW -> DRAFT -> IN_REVIEW
          -> APPROVED -> PUBLISHED, with review_cycle_count == 1 recording exactly
          one request-changes loop.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; MenuRevision in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/menu-revisions"
              payload: { restaurant_id: "${rest_id}", label: "2026-Fall", effective_from: "2026-09-15T00:00:00Z" }
              as: MenuAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /api/menu-revisions/${rev_id}/submit-review"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/request-changes"
              payload: {}
              as: MenuAdmin
              captures: { rev_cycle: $.data.review_cycle_count }
            - call: "POST /api/menu-revisions/${rev_id}/submit-review"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/approve"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/publish"
              payload: {}
              as: MenuAdmin
          assert:
            - "After request-changes: MenuRevision.${rev_id}.status == DRAFT and review_cycle_count == 1"
            - "After the full loop: MenuRevision.${rev_id}.status == PUBLISHED"
            - "MenuRevision.${rev_id}.recipe_card_redistribution_status == COMPLETE"

      - name: service_ticket_parallel_dimensions_and_recall_loop
        grounds:
          - state_machines.ServiceTicket.OPEN_to_FIRED
          - state_machines.ServiceTicket.READY_to_FIRED
          - state_machines.ServiceTicket.OPEN_to_OPEN
          - entities.ServiceTicket.fields.recall_count
        distinguishing_aspect: |
          Two independent state dimensions on one entity: allergen_review_status
          (PENDING -> CLEARED) moves while fire_status stays OPEN, and fire_status
          cycles READY -> FIRED via recall (recall_count == 1) before SERVED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; published revision with recipe 'Butter Steak' (GRILL, allergen_tags [DAIRY], modification_policy ALLOWED, 1 component)."
            - "A line cook and a kitchen manager exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Leo Line", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "Butter", station_type: "GRILL", shelf_life_hours: 48, min_batch_size: 1, batch_unit: "EA" }
              as: MenuAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /api/menu-revisions"
              payload: { restaurant_id: "${rest_id}", label: "2026-Fall", effective_from: "2026-09-15T00:00:00Z" }
              as: MenuAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /api/recipes"
              payload: { menu_revision_id: "${rev_id}", name: "Butter Steak", station_type: "GRILL", allergen_tags: ["DAIRY"], modification_policy: "ALLOWED", components: [{ prep_item_id: "${pi_id}", quantity_per_portion: 1, unit: "EA" }] }
              as: MenuAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /api/menu-revisions/${rev_id}/submit-review"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/approve"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions/${rev_id}/publish"
              payload: {}
              as: MenuAdmin
          trigger:
            - call: "POST /api/service-tickets"
              payload: { restaurant_id: "${rest_id}", table_ref: "T9", items: [{ recipe_id: "${rec_id}", modifications: [], allergen_flags: ["DAIRY"] }] }
              as: LineCook
              as_user_id: "${lc_id}"
              captures: { tk_id: $.data.id }
            - call: "POST /api/service-tickets/${tk_id}/fire"
              payload: {}
              as: LineCook
              as_user_id: "${lc_id}"
              captures: { err_blocked: $.data.error_id }
            - call: "POST /api/service-tickets/${tk_id}/clear-allergen-review"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
            - call: "POST /api/service-tickets/${tk_id}/fire"
              payload: {}
              as: LineCook
              as_user_id: "${lc_id}"
