            - { call: "POST /wholesale/orders/${ord1}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord1}/mark-delivered", as: WarehouseOps }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-08-04T09:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${pr}", units_vended: 0, on_hand_units: 10 }] }, as: TelemetryGateway, captures: { ev: $.data.id } }
            - { call: "POST /wholesale/orders/${ord1}/settle", payload: { tender_type: "CASH", telemetry_event_id: "${ev}" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord1}", lines: [{ product_id: "${pr}", quantity_units: 10, expiration_date: "2026-07-30" }] }, as: OperatorManager, as_user_id: "${op}", captures: { cl: $.data.id } }
