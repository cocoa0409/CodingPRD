      - name: clock_endpoint_moves_logical_time_forward_for_window_gates
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /plant-ops/_clock/set_current_utc]
        distinguishing_aspect: |
          Every temporal gate reads the logical clock, which starts at 2026-08-01T00:00:00Z and only moves
          when this test-support endpoint is called: the same outage start call fails before the window and
          succeeds after a single clock write, with no other state change in between.
        test_recipe:
          setup:
            - "Plant GYP-1, LINE-1 and an APPROVED October outage (seasonality_index 0.90); clock still at its default."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/maintenance-outages"
              payload: { line_id: "${line_id}", outage_type: "PLANNED", window_start: "2026-10-05T06:00:00Z", window_end: "2026-10-07T06:00:00Z", scope_note: "kiln burner rebuild" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { outage_id: $.data.id }
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/approve"
              payload: {}
              as: PlantManager
              as_user_id: "u_mgr"
          trigger:
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/start"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { err_id: $.data.error_id }
            - call: "POST /plant-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T06:00:00Z" }
              as: PlantAdmin
              captures: { now: $.data.current_utc }
            - call: "POST /plant-ops/maintenance-outages/${outage_id}/start"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "u_planner"
          assert:
            - "the first start returned status 409 with ${err_id} == ERR_OUTAGE_WINDOW_NOT_STARTED"
            - "the clock write returned 200 with ${now} == '2026-10-05T06:00:00.000Z'"
            - "the second start returned 200 with MaintenanceOutage.${outage_id}.status == IN_PROGRESS"
            - "BoardLine.${line_id}.status == DOWN and Plant.${plant_id}.production_posture == FROZEN"

      - name: board_line_list_and_detail_reads_agree
        claim_type: standard_crud
        grounds:
          - endpoints[GET /plant-ops/board-lines]
          - endpoints[GET /plant-ops/board-lines/{lineId}]
          - endpoints[GET /plant-ops/plants/{plantId}/board-lines]
        distinguishing_aspect: |
          The same BoardLine is reachable three ways — the flat filtered list, the flat detail read and the
          plant sub-collection — and all three return the same status and designation, with the plant_id
          filter excluding the second plant's line.
        test_recipe:
          setup:
            - "Two plants, each with one board line; both lines AVAILABLE."
          setup_api_calls:
