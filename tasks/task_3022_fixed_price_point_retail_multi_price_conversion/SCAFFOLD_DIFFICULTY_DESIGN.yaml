              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i9501_id}", sequence: 1, requested_units: 40 }
              as: DistributionCenterOperator
              captures: { line_id: $.data.id }
            - call: "POST /merchandise/allocation-lines/${line_id}/release"
              payload: { release_units: 40 }
              as: DistributionCenterOperator
            - call: "GET /merchandise/items/${i9501_id}"
              payload: {}
              as: MerchandiseBuyer
              captures: { on_hand_mid: $.data.on_hand_units }
            - call: "POST /merchandise/items/${i9501_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 128 }
              as: MerchandiseBuyer
          trigger:
            - call: "POST /merchandise/item-deletions/${i9501_id}/decision"
              payload: { decision: "DELETE" }
              as: MerchandiseBuyer
              captures: { item_status: $.data.status }
            - call: "GET /merchandise/items/${i9501_id}"
              payload: {}
              as: MerchandiseBuyer
              captures: { on_hand_after: $.data.on_hand_units }
            - call: "GET /merchandise/containers/${cont_id}/allocation-lines"
              payload: {}
              as: DistributionCenterOperator
          assert:
            - "on_hand_mid == 40 and on_hand_after == 0 — the forward release and the compensating reversal leave on_hand_units exactly where it started"
            - "the 128-cent landed cost write put the item into DELETE_REVIEW and item_status == DELETED after the disposition"
            - "AllocationLine.${line_id}.status == REVERSED and AllocationLine.${line_id}.released_units == 0 and remaining_units == 0"
            - "Container.${cont_id}.status == RECEIVED — the reversal bubbled the container back out of ALLOCATED"
            - "Item.${i9501_id}.on_hand_units + AllocationLine.${line_id}.released_units == 0, the pinned sum, after both actions"
