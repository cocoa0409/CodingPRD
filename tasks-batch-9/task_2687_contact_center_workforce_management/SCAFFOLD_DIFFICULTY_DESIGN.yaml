  - rule_id: non_linear_state_machine
    instances:
      - name: schedule_shift_parallel_publication_and_adherence_axes
        grounds:
          - state_machines.ScheduleShift.publication_status
          - state_machines.ScheduleShift.adherence_status
          - calculations.shift_adherence_score
          - calculations.agent_adherence_score
          - entities.ScheduleShift.fields.flagged_by_user_id
          - entities.Agent.fields.coaching_status
        distinguishing_aspect: |
          ScheduleShift carries two independent state dimensions. An adherence observation moves
          the adherence axis PENDING -> OUT_OF_ADHERENCE while the publication axis stays
          PUBLISHED, and cancelling the publication afterwards leaves adherence_status frozen at
          OUT_OF_ADHERENCE (the axes do not overwrite each other) yet still removes the shift from
          the agent's scored set, so agent.adherence_pct snaps back to 1.0000 and coaching_status
          walks COACHING_ACTIVE -> CLEARED rather than back to NONE. An implementation with a
          single status column, or one that resets the adherence axis on cancellation, or one that
          leaves the agent rollup stale, fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "LA-CORE, cycle W37-AXES driven to REQUIREMENTS_LOCKED, FG-A with the 2026-09-07 grid."
            - "Agent E-001 (skills [VOICE_EN], 2400 cents/hour) with one PUBLISHED 08:00-16:00 shift on 2026-09-07: scheduled_seconds 27000, paid_hours 7.50."
