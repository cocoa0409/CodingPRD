  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: premium_post_then_reverse_conserves_premiums_paid
        grounds:
          - state_machines.PremiumPayment.POSTED_to_REVERSED
          - entities.Policy.fields.total_premiums_paid_cents
          - entities.Policy.fields.paid_through_date
        distinguishing_aspect: |
          Conserved quantity: Policy.total_premiums_paid_cents (premiums-paid ledger). Posting a
          premium then reversing it leaves total_premiums_paid_cents and paid_through_date exactly
          at their pre-post values (0 paid, paid_through_date == issue_date 2026-02-01).
        test_recipe:
          setup:
            - "GRADED plan; policy issued 2026-02-01 (total_premiums_paid_cents 0, paid_through_date 2026-02-01)."
            - "One premium 6000 posted covering [2026-02-01,2026-03-01) then reversed."
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, graded_period_months: 24, contestability_period_months: 24, graded_refund_apr: 0.10, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, max_loan_to_cash_value_pct: 0.90, loan_apr: 0.08, loan_cooldown_days: 30, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}, {tier_name: "MID", min_face_cents: 1000001, max_face_cents: 2500000, tier_load_pct: 0.10}, {tier_name: "LARGE", min_face_cents: 2500001, max_face_cents: 5000000, tier_load_pct: 0.25}], age_bands: [{band_name: "A", min_age: 45, max_age: 60, age_factor: 1.0}, {band_name: "B", min_age: 61, max_age: 75, age_factor: 1.5}, {band_name: "C", min_age: 76, max_age: 85, age_factor: 2.2}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 50000, charge_pct: 0.10}, {min_gross_cents: 50001, max_gross_cents: 200000, charge_pct: 0.05}, {min_gross_cents: 200001, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Wynn Doe", date_of_birth: "1960-06-15", gender: "FEMALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_wynn" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /premium-payments"
              payload: { policy_id: "${policy_id}", amount_cents: 6000, coverage_start: "2026-02-01T00:00:00Z", coverage_end: "2026-03-01T00:00:00Z" }
              as: PolicyAdmin
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /premium-payments/${pay_id}/reverse"
              payload: {}
              as: PolicyAdmin
            - call: "GET /policies/${policy_id}"
              payload: {}
              as: PolicyAdmin
              captures: { tpp: $.data.total_premiums_paid_cents, pt: $.data.paid_through_date }
          assert:
            - "Policy.${policy_id}.total_premiums_paid_cents == 0 (restored to pre-post value)"
            - "Policy.${policy_id}.paid_through_date == 2026-02-01T00:00:00Z (== issue_date)"

      - name: loan_disburse_then_repay_conserves_cash_value
        grounds:
          - state_machines.PolicyLoan.ACTIVE_to_SETTLED
          - entities.Policy.fields.net_cash_value_cents
          - entities.Policy.fields.gross_cash_value_cents
        distinguishing_aspect: |
          Different conserved quantity: gross cash value = net_cash_value + outstanding_loan_balance.
          Disbursing a 20000c loan drops net to 9605 (30000 - 20395 balance at read), and full
          repayment restores net_cash_value_cents to 30000 with outstanding_loan_balance 0 — gross
          conserved across the forward/compensating pair.
        test_recipe:
          setup:
            - "GRADED plan; policy issued 2026-02-01; clock 2031-02-01 (gross 30000); loan 20000c disbursed 2031-02-01."
