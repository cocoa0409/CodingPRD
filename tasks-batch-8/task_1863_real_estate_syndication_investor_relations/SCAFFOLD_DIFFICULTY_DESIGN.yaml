            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_a}/documents/${da_w9}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_a}/documents/${da_suit}/accept"
              payload: {}
