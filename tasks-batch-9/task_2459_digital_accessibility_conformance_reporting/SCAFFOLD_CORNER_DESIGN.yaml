        claim_type: violation_to_error
        grounds:
          - validations[priority=63]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / environment_reconfiguration_buffer_is_half_open
          rationale: "The 12:15 booking there asserts ERR_ENVIRONMENT_WINDOW_CONFLICT with HTTP 409; the 12:30 booking asserts the accepting side."

      - name: corner_error_product_posture_frozen
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
        excluded_because:
          difficulty_instance: transitive_cascade / publish_freezes_customer_disclosures_chain
          rationale: "That chain drives the product into FROZEN and asserts the follow-on gate refusing the next posture-guarded write with ERR_PRODUCT_POSTURE_FROZEN."

  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_tester_cannot_publish_a_report
        claim_type: exclusive_operations
        grounds:
          - validations[priority=5]
          - state_machines.ConformanceReport.APPROVED_to_PUBLISHED
        distinguishing_aspect: "publish is exclusive to AccessibilityLead: an AccessibilityTester call is refused with ERR_UNAUTHORIZED 403 at priority 5, before any publication precondition (design review, category superset) is even evaluated."
        test_recipe:
          setup:
            - "Standard WCAG_2_2 with no criteria; one in-scope component still NOT_REVIEWED so publication would also fail on its merits"
            - "One report in state APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { prod_v: $.data.version }
            - call: "POST /conformance-reports"
              payload: { product_id: "${prod_id}", standard_id: "${std_id}", report_title: "ACR Insight Portal 7.0", expected_product_version: "${prod_v}" }
              as: AccessibilityLead
              captures: { rep_id: $.data.id }
            - call: "POST /conformance-reports/${rep_id}/submit"
              payload: { submission_note: "Ready for reviewer sign-off" }
              as: ProductOwner
              as_user_id: "${prod_id}"
            - call: "POST /conformance-reports/${rep_id}/approve"
              payload: { approval_note: "Approved for publication" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /conformance-reports/${rep_id}/publish"
              payload: { publication_channel: "CUSTOMER_TRUST_PORTAL" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "ConformanceReport.${rep_id}.state == APPROVED"
            - "ConformanceReport.${rep_id}.published_at is null"
            - "ProductComponent.${comp_id}.design_review_state == NOT_REVIEWED (no precondition was reached)"

      - name: corner_product_owner_cannot_submit_another_products_report
        claim_type: peer_roles
        grounds:
          - validations[priority=8]
          - state_machines.ConformanceReport.DRAFT_to_IN_REVIEW
        distinguishing_aspect: "ProductOwner is entity_backed: submitting product A's report with X-User-ID equal to product B's id returns ERR_PRODUCT_OWNERSHIP_MISMATCH 403, distinct from the plain ERR_UNAUTHORIZED a non-owner role would get."
        test_recipe:
          setup:
            - "Two products A and B on the same standard"
            - "One DRAFT report belonging to product A"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_a: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Mobile", version_label: "3.1", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_b: $.data.id }
            - call: "GET /products/${prod_a}"
              payload: {}
              as: AccessibilityLead
              captures: { prod_a_v: $.data.version }
            - call: "POST /conformance-reports"
              payload: { product_id: "${prod_a}", standard_id: "${std_id}", report_title: "ACR Insight Portal 7.0", expected_product_version: "${prod_a_v}" }
              as: AccessibilityLead
              captures: { rep_id: $.data.id, rep_state: $.data.state }
          trigger:
            - call: "POST /conformance-reports/${rep_id}/submit"
              payload: { submission_note: "Submitting a report I do not own" }
              as: ProductOwner
              as_user_id: "${prod_b}"
              captures: { err: $.data.error_id }
          assert:
            - "${rep_state} == DRAFT"
            - "HTTP 403"
            - "${err} == ERR_PRODUCT_OWNERSHIP_MISMATCH"
            - "ConformanceReport.${rep_id}.state == DRAFT"
            - "ConformanceReport.${rep_id}.submitted_by_user_id is null"

      - name: corner_known_issue_intake_shared_by_lead_and_tester
        claim_type: shared_operations
        grounds:
          - validations[priority=5]
          - entities.KnownIssue.fields.severity
        distinguishing_aspect: "POST /known-issues is the one shared write: both AccessibilityTester and AccessibilityLead create successfully (two OPEN rows), while a CustomerLiaison attempt on the same payload is refused with ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["One product with one in-scope component and criterion 1.1.1 at level A, no known issues yet"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", severity: "SERIOUS", summary: "Media library thumbnails expose no accessible name", effort_points: 2, target_remediation_date: "2026-12-01", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { iss_tester: $.data.id, tester_state: $.data.state }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit_id}", severity: "MINOR", summary: "Decorative icons expose redundant alternative text", effort_points: 1, target_remediation_date: "2026-12-01", publish_intent: "EXCLUDED" }
              as: AccessibilityLead
              captures: { iss_lead: $.data.id, lead_state: $.data.state }
          assert:
            - "Both creates return HTTP 201"
            - "${tester_state} == OPEN and ${lead_state} == OPEN"
            - "${iss_tester} != ${iss_lead}"
            - "GET /known-issues?product_id=${prod_id} returns total_count == 2"
            - "The same payload sent as CustomerLiaison returns HTTP 403 with error_id ERR_UNAUTHORIZED"

      - name: corner_segregation_of_duties_on_assessment_attest
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=52]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / attest_segregation_of_duties_precedes_expired_evidence
          rationale: "The self-attest attempt there asserts ERR_SEGREGATION_OF_DUTIES 403 when X-User-ID equals authored_by_user_id."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_product_version_blocks_report_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-create-stale-product]
          - entities.Product.fields.components_in_scope_count
        distinguishing_aspect: "The product version read before a component was added is stale by exactly one: reusing it returns ERR_STALE_PRODUCT_VERSION 412, and re-reading the product then succeeds with 201, proving the guard is version-based rather than payload-based."
        test_recipe:
          setup:
            - "One product created with no components; the client captures its version before mutating it"
            - "One component is then added, which advances the product's version and its components_in_scope_count to 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id, prod_v_stale: $.data.version }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { prod_v_fresh: $.data.version, in_scope: $.data.components_in_scope_count }
          trigger:
            - call: "POST /conformance-reports"
              payload: { product_id: "${prod_id}", standard_id: "${std_id}", report_title: "ACR Insight Portal 7.0", expected_product_version: "${prod_v_stale}" }
              as: AccessibilityLead
              captures: { err: $.data.error_id }
            - call: "POST /conformance-reports"
              payload: { product_id: "${prod_id}", standard_id: "${std_id}", report_title: "ACR Insight Portal 7.0", expected_product_version: "${prod_v_fresh}" }
              as: AccessibilityLead
              captures: { rep_id: $.data.id, rep_state: $.data.state }
          assert:
            - "${prod_v_stale} == 1 and ${prod_v_fresh} == 2"
            - "${in_scope} == 1"
            - "First create returns HTTP 412 and ${err} == ERR_STALE_PRODUCT_VERSION"
            - "Second create returns HTTP 201 and ${rep_state} == DRAFT"
            - "ConformanceReport.${rep_id}.product_id == ${prod_id}"

      - name: corner_occ_stale_component_version_blocks_assessment_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-create-stale-component]
          - entities.ProductComponent.fields.coverage_pct
        distinguishing_aspect: "A run completion writes coverage_pct 45.00 onto the component, so an assessment authored against the pre-completion version returns ERR_STALE_COMPONENT_VERSION 412; retrying with the re-read version creates the DRAFT assessment."
        test_recipe:
          setup:
            - "One in-scope component of applicable_criteria_count 40; the client captures its version at creation"
            - "One MANUAL SCREEN_READER run of 40 criteria is then completed, advancing the component's version and writing coverage_pct 45.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id, comp_v_stale: $.data.version }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_id: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION"] }
              as: AccessibilityTester
              captures: { run_id: $.data.id }
            - call: "POST /assessment-runs/${run_id}/complete"
              payload: { defects_found: 1 }
              as: AccessibilityTester
            - call: "GET /components/${comp_id}"
              payload: {}
              as: AccessibilityTester
              captures: { comp_v_fresh: $.data.version, cov: $.data.coverage_pct }
          trigger:
            - call: "POST /criterion-assessments"
              payload: { component_id: "${comp_id}", criterion_id: "${crit_id}", support_level: "SUPPORTS", expected_component_version: "${comp_v_stale}" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { err: $.data.error_id }
            - call: "POST /criterion-assessments"
              payload: { component_id: "${comp_id}", criterion_id: "${crit_id}", support_level: "SUPPORTS", expected_component_version: "${comp_v_fresh}" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { asm_id: $.data.id, asm_state: $.data.attestation_state }
          assert:
            - "${cov} == 45.00"
            - "${comp_v_fresh} is strictly greater than ${comp_v_stale}"
            - "First create returns HTTP 412 and ${err} == ERR_STALE_COMPONENT_VERSION"
            - "Second create returns HTTP 201 and ${asm_state} == DRAFT"
            - "CriterionAssessment.${asm_id}.authored_by_user_id == tester-1"

      - name: corner_derived_component_counters_ignore_out_of_scope_rows
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Product.fields.components_in_scope_count
          - entities.Product.fields.assessment_readiness
        distinguishing_aspect: "An out-of-scope component never moves the denominator: components_in_scope_count stays 1 after the second create, so completing the single in-scope component alone flips assessment_readiness to READY."
        test_recipe:
          setup:
            - "One product; one in-scope component of applicable_criteria_count 40; one component created with in_scope false and assessment_scope EXCLUDED"
            - "One SCREEN_READER bench and a MANUAL run of 40 criteria on the in-scope component"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_in: $.data.id }
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { count_after_first: $.data.components_in_scope_count }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Legacy Batch Job", component_type: "SERVICE", in_scope: false, assessment_scope: "EXCLUDED", applicable_criteria_count: 5, user_reach_pct: 1 }
              as: AccessibilityLead
              captures: { comp_out: $.data.id }
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { count_after_second: $.data.components_in_scope_count }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_id: $.data.id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_in}", environment_id: "${env_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION"] }
              as: AccessibilityTester
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /assessment-runs/${run_id}/complete"
              payload: { defects_found: 0 }
              as: AccessibilityTester
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { in_scope_final: $.data.components_in_scope_count, complete_final: $.data.components_complete_count, readiness: $.data.assessment_readiness }
          assert:
            - "${count_after_first} == 1"
            - "${count_after_second} == 1 (the EXCLUDED component is not counted)"
            - "${in_scope_final} == 1"
            - "${complete_final} == 1"
            - "${readiness} == READY"
            - "ProductComponent.${comp_out}.assessment_state == PLANNED"
            - "ProductComponent.${comp_in}.assessment_state == COMPLETE"

      - name: corner_layer_cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ProductComponent.IN_TESTING_to_COMPLETE
        excluded_because:
          difficulty_instance: transitive_cascade / run_completion_readiness_chain
          rationale: "The four-hop chain from run completion to product readiness is asserted hop by hop there."

      - name: corner_layer_dual_variant_calculation_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.remediation_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / intake_versus_board_review_remediation_risk_divergence
          rationale: "Both risk variants are computed on identical data there and the 23.00 -> 35.42 delta is asserted."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_accommodation_fulfilment_is_visible_immediately
        claim_type: immediate
        grounds:
          - state_machines.Complaint.TRIAGED_to_ACCOMMODATED
          - entities.Product.fields.accommodations_fulfilled_count
        distinguishing_aspect: "The fulfilment response itself already carries state ACCOMMODATED and accommodation_fulfilled_at 2026-08-01T00:00:00Z, and the product's accommodations_fulfilled_count reads 1 on the very next request with no retry or settle delay."
        test_recipe:
          setup:
            - "One complaint on a product with one component, TRIAGED with route ACCOMMODATION and needed_by_date 2026-09-01"
            - "Product.accommodations_fulfilled_count is 0 before the trigger"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /complaints"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", channel: "PHONE", description: "I need the report exported in large print", disability_category: "VISION" }
              as: CustomerLiaison
              captures: { cmp_id: $.data.id }
            - call: "POST /complaints/${cmp_id}/triage"
              payload: { route: "ACCOMMODATION", requested_accommodation: "Large-print export of the conformance report", needed_by_date: "2026-09-01" }
              as: AccessibilityLead
            - call: "GET /products/${prod_id}"
              payload: {}
              as: CustomerLiaison
              captures: { fulfilled_before: $.data.accommodations_fulfilled_count }
          trigger:
            - call: "POST /complaints/${cmp_id}/fulfill-accommodation"
              payload: {}
              as: CustomerLiaison
              captures: { state: $.data.state, at: $.data.accommodation_fulfilled_at }
            - call: "GET /products/${prod_id}"
              payload: {}
              as: CustomerLiaison
              captures: { fulfilled_after: $.data.accommodations_fulfilled_count }
          assert:
            - "${fulfilled_before} == 0"
            - "HTTP 200"
            - "${state} == ACCOMMODATED"
            - "${at} == 2026-08-01T00:00:00Z"
            - "${fulfilled_after} == 1"
            - "Complaint.${cmp_id}.closed_at is null"
