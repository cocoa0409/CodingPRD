              as_user_id: "${phys_id}"
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_physician_id: "${phys_id}", treating_dentist_id: "${dent_id}", diagnostic_study_id: "${study_id}", cpap_history: "FAILURE", cpap_nights_used: 45, cpap_documented_on: "2026-03-01" }
              as: SleepPhysician
              as_user_id: "${phys_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/respond"
              payload: { decision: "ACCEPTED" }
              as: Dentist
              as_user_id: "${dent_id}"
          trigger:
            - call: "POST /lab-orders"
              payload: { referral_id: "${ref_id}", lab_provider_id: "${lab_id}", appliance_kind: "CUSTOM_FABRICATED", capture_method: "DIGITAL_SCAN" }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION with HTTP 400"
            - "no LabOrder row is created"

  - section: state_machines
    instances:

      - name: respond_twice_on_a_referral_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Referral.ISSUED_to_ACCEPTED
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Without any audit hold in play, the second respond on an already-ACCEPTED referral is a
          plain invalid transition and returns ERR_INVALID_STATE — this is the un-masked counterpart
          of the §1.8 priority-pair instance, where the same call returns ERR_RECORDS_FROZEN.
        test_recipe:
          setup:
            - "An ACCEPTED referral, patient NOT frozen."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL", prior_auth_required: false }
              as: PlatformAdmin
              captures: { payer_med_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000001", full_name: "Dr Sleep", provider_type: "SLEEP_PHYSICIAN" }
