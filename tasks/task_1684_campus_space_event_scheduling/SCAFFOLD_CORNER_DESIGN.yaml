            - { call: "POST /campus/event-reservations/${e3}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T12:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v4: $.data.version } }
