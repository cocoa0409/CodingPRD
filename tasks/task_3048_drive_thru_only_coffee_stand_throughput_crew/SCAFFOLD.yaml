    roles: [CrewMember, ShiftLead, LoyaltyCustomer]
    code: 201
    input: [card_token]
    output: Payment
    side_effects: ["Payment created AUTHORIZED (authorized_cents = order.total_cents)", "order.payment_status -> AUTHORIZED"]

  - method: GET
    path: "/payments/{paymentId}"
    description: "Get a payment"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember, LoyaltyCustomer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List payments, filterable by order"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

