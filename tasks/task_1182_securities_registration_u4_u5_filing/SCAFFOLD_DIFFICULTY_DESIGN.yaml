              payload: { applicant_id: "${app_be_id}", firm_id: "${firm_be_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_be_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_be_id}", exam_code: "SIE" }
              as: RegistrationPrincipal
              captures: { sie_be_id: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
