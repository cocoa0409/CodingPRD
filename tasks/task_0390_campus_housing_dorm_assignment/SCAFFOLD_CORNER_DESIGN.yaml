  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_room_take_offline_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - endpoints
          - entities.Room.fields.version
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "POST /rooms/{id}/take-offline with a stale expected_room_version (one below current) returns ERR_STALE_VERSION (412); status unchanged."
        test_recipe:
          setup: ["An empty OPEN room whose version was bumped once by a restore so a one-below value is stale"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "OCC Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "OC1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /rooms/${r_id}/take-offline"
              payload: { expected_room_version: "${r_v0}" }
              as: HousingOfficer
            - call: "GET /rooms/${r_id}"
              payload: {}
              as: HousingOfficer
              captures: { r_v_now: $.data.version }
          trigger:
            - call: "POST /rooms/${r_id}/restore"
              payload: { expected_room_version: "${r_v_now} - 1" }
              as: HousingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.status == 412"

      - name: occ_room_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds:
          - endpoints
          - entities.Room.fields.version
        distinguishing_aspect: "A successful take-offline then restore each bump Room.version by exactly 1 (v0 -> v0+1 -> v0+2)."
        test_recipe:
          setup: ["A newly created empty room at version 1"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "VerBump Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "VB1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /rooms/${r_id}/take-offline"
              payload: { expected_room_version: "${r_v0}" }
              as: HousingOfficer
              captures: { r_v1: $.data.version }
          trigger:
            - call: "POST /rooms/${r_id}/restore"
              payload: { expected_room_version: "${r_v1}" }
              as: HousingOfficer
              captures: { r_v2: $.data.version }
          assert:
            - "Room.${r_id}.version == 3"
            - "Room.${r_id}.status == OPEN"

      - name: occ_accept_offer_stale_application_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[accept-offer-stale-application]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_safety_on_accept_declined_app_and_hold
          rationale: "OCC on accept (expected_application_version) is exercised through the accept happy-path in every §1.8 lottery chain; the stale-version negative path on accept is structurally identical to the room OCC stale test already covered here, and the accept endpoint's version semantics are asserted across §1.8 accept calls."

      - name: occ_confirm_swap_stale_assignment_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[confirm-swap-stale-assignment]
        excluded_because:
          difficulty_instance: non_linear_state_machine / assignment_swap_cyclic_pending_back_to_active
          rationale: "confirm-swap with a fresh expected_assignment_version is exercised in the swap-cycle §1.8 instance; the stale-version negative path is the same OCC mechanism as the room OCC stale conflict already enumerated in this section."

      - name: derived_room_status_restores_to_open_after_incident_resolved
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Room.fields.status
          - state_machines.IncidentReport.OPEN_to_RESOLVED
          - calculations.building_occupancy_rollup
        distinguishing_aspect: "A room RESTRICTED by a CRITICAL incident returns to status OPEN once the incident is RESOLVED (open_incident_count back to 0)."
        test_recipe:
          setup: ["A room RESTRICTED by one OPEN CRITICAL incident"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "RA Reconcile", class_year: SENIOR, gender_identity: FEMALE, lottery_number: 440 }
              as: HousingOfficer
              captures: { ra_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Reconcile Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "RC1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { r_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { room_id: "${r_id}", reporter_student_id: "${ra_id}", severity: CRITICAL }
              as: ResidentAdvisor
              as_user_id: "${ra_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incident-reports/${inc_id}/resolve"
              payload: {}
              as: HousingOfficer
            - call: "GET /rooms/${r_id}"
              payload: {}
              as: HousingOfficer
              captures: { r_status: $.data.status, r_open: $.data.open_incident_count }
          assert:
            - "Room.${r_id}.status == OPEN"
            - "Room.${r_id}.open_incident_count == 0"

      - name: cascade_disband_group_removes_memberships
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RoommateGroup.FORMING_to_DISBANDED
          - state_machines.RoommateMembership.ACCEPTED_to_REMOVED
          - entities.RoommateMembership.fields.membership_status
        distinguishing_aspect: "Disbanding a FORMING group sets the owner+invitee memberships to REMOVED and accepted_member_count drops to 0."
        test_recipe:
          setup: ["A FORMING group with owner ACCEPTED and one ACCEPTED invitee"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Disband Owner", class_year: JUNIOR, gender_identity: MALE, lottery_number: 450 }
              as: HousingOfficer
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Disband Mate", class_year: JUNIOR, gender_identity: MALE, lottery_number: 451 }
              as: HousingOfficer
              captures: { m_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "DIS_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
            - call: "POST /roommate-groups"
              payload: { cycle_id: "${c_id}", owner_student_id: "${o_id}", target_size: 2 }
              as: Student
              as_user_id: "${o_id}"
              captures: { g_id: $.data.id }
            - call: "POST /roommate-groups/${g_id}/memberships"
              payload: { student_id: "${m_id}" }
              as: Student
              as_user_id: "${o_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /roommate-groups/${g_id}/memberships/${mem_id}/accept"
              payload: {}
              as: Student
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /roommate-groups/${g_id}/disband"
              payload: {}
              as: Student
              as_user_id: "${o_id}"
            - call: "GET /roommate-memberships/${mem_id}"
              payload: {}
              as: HousingOfficer
              captures: { mem_status: $.data.membership_status }
          assert:
            - "RoommateGroup.${g_id}.status == DISBANDED"
            - "RoommateMembership.${mem_id}.membership_status == REMOVED"

