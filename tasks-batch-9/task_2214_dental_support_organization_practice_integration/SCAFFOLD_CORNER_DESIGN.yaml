      - name: five_level_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Affiliation.SIGNED_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / affiliation_close_five_hop_cascade_to_payer_contract
          rationale: "The named §1.8 instance walks all five hops of the close cascade and asserts each intermediate entity, so no additional end-to-end chain claim is needed."

      - name: cascade_ordering_sensitivity_on_departure
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DoctorEmployment.ACTIVE_to_SEPARATED
        excluded_because:
          difficulty_instance: transitive_cascade / doctor_separation_three_hop_freeze_cascade
          rationale: "The named §1.8 instance pins the order of the freeze cascade (posture recompute before enrollment suspension before contract regression) and asserts the state after each hop."

      - name: both_earnout_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.earnout_payout.variants
        excluded_because:
          difficulty_instance: variant_divergence / earnout_provisional_annualization_vs_final_lag_holdback
          rationale: "The named §1.8 instance runs both variants against the same tranche and asserts the divergent tier lookups and the resulting delta."

      - name: both_compensation_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.doctor_compensation.variants
        excluded_because:
          difficulty_instance: variant_divergence / doctor_comp_monthly_guarantee_vs_annual_true_up
          rationale: "The named §1.8 instance feeds one monthly series to both comp models and asserts the divergent totals and deltas."

