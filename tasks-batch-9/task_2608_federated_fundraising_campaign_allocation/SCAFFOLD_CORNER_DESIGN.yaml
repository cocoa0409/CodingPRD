      - name: shrinkage_escrow_threshold_at_exactly_fifteen_hundred_bps_forks_to_escrow_hold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.campaign_pledge_loss_estimate
          - state_machines.Campaign.SOLICITATION_CLOSED_to_RECONCILED
          - state_machines.Campaign.SOLICITATION_CLOSED_to_ESCROW_HOLD
          - entities.Campaign.fields.realized_shrinkage_rate_bps
        distinguishing_aspect: |
          The escrow fork is inclusive at exactly SHRINKAGE_ESCROW_THRESHOLD_BPS 1500 and one
          basis point decides it: campaign A (1701.00 collected + 299.00 written off on a 2000.00
          confirmed base, reserve 0.00) realizes round_half_up(299/2000*10000) = 1495 bps and
          reconciles, while campaign B (1700.00 + 300.00 on the same 2000.00 base) realizes exactly
          1500 bps and is forced into ESCROW_HOLD. An implementation using `>` instead of `>=`
          reconciles campaign B.
