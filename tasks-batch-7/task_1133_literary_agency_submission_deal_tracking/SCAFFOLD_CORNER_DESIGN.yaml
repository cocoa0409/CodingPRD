            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "T" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms1}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr1: $.data.id } }
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${ms1}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { r1: $.data.id, rv1: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${r1}", editor_id: "${edA}" }, as: Agent, as_user_id: "${agent1}" }
          trigger:
            - { call: "POST /submission-rounds/${r1}/open", payload: { expected_submission_round_version: "${rv1}" }, as: Agent, as_user_id: "${agent1}", captures: { st1: $.data.status, vAfter: $.data.version } }
            - { call: "POST /submission-rounds/${r1}/open", payload: { expected_submission_round_version: "${rv1}" }, as: Agent, as_user_id: "${agent1}", captures: { err: $.data.error_id } }
          assert:
            - "${st1} == OPEN and ${vAfter} == 2   # first open succeeded and bumped version"
            - "${err} == ERR_STALE_VERSION   # 412: stale ${rv1} == 1 != current 2; OCC precedes the already-OPEN state check"

      - name: occ_deal_execute_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[deal-execute-stale-version]", "errors[ERR_STALE_VERSION]", "validations[priority=5]"]
        distinguishing_aspect: "Deal read at version 1; a PATCH (advance_cents 600000) bumps it to 2; execute carrying expected_deal_version 1 is rejected ERR_STALE_VERSION (412), and the same execute with the fresh version 2 succeeds."
        test_recipe:
          setup: ["standard pipeline to NEGOTIATING deal; captured version dv1 == 1"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency OC2", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "T" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms1}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr1: $.data.id } }
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${ms1}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { r1: $.data.id, rv1: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${r1}", editor_id: "${edA}" }, as: Agent, as_user_id: "${agent1}", captures: { s1: $.data.id } }
            - { call: "POST /submission-rounds/${r1}/open", payload: { expected_submission_round_version: "${rv1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${s1}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /offers", payload: { submission_id: "${s1}", advance_cents: 500000, royalty_pct_hardcover: 0.10, royalty_pct_trade: 0.08, royalty_pct_ebook: 0.25 }, as: Agent, as_user_id: "${agent1}", captures: { o1: $.data.id } }
            - { call: "POST /offers/${o1}/accept", payload: {}, as: ContractsManager, as_user_id: "cm-1" }
            - { call: "GET /deals", payload: { offer_id: "${o1}" }, as: ContractsManager, as_user_id: "cm-1", captures: { d1: "$.data[0].id", dv1: "$.data[0].version" } }
          trigger:
            - { call: "PATCH /deals/${d1}", payload: { advance_cents: 600000 }, as: ContractsManager, as_user_id: "cm-1", captures: { dv2: $.data.version } }
            - { call: "POST /deals/${d1}/execute", payload: { expected_deal_version: "${dv2} - 1" }, as: ContractsManager, as_user_id: "cm-1", captures: { err: $.data.error_id } }
            - { call: "POST /deals/${d1}/execute", payload: { expected_deal_version: "${dv2}" }, as: ContractsManager, as_user_id: "cm-1", captures: { st2: $.data.status, adv2: $.data.advance_cents } }
          assert:
            - "${dv2} == 2   # PATCH bumped the version"
            - "${err} == ERR_STALE_VERSION   # 412: expected ${dv2}-1 == 1 is stale"
            - "${st2} == EXECUTED and ${adv2} == 600000   # amended terms are what execute persisted"

      - name: agent_open_query_count_reconciles_on_assign_and_reject
        claim_type: derived_field_reconciliation
        grounds: ["entities.Agent.fields.open_query_count", "state_machines.QueryLetter"]
        distinguishing_aspect: "Derived counter: assign two queries to agent1 -> open_query_count 2; reject one -> 1; request-manuscript on the other -> 0 (the query leaves the open set even though it is not terminal)."
        test_recipe:
          setup: ["agency; agent; author; two queries q1, q2 RECEIVED"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency DF", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "YA", word_count: 80000 }, as: Agent, as_user_id: "${agent1}", captures: { q2: $.data.id } }
          trigger:
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q2}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "GET /agents/${agent1}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { c2: $.data.open_query_count } }
            - { call: "POST /query-letters/${q1}/reject", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "GET /agents/${agent1}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { c1: $.data.open_query_count } }
            - { call: "POST /query-letters/${q2}/request-manuscript", payload: { title: "T2" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "GET /agents/${agent1}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { c0: $.data.open_query_count } }
          assert:
            - "${c2} == 2 and ${c1} == 1 and ${c0} == 0"

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutations_visible_in_same_response
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Every mutating endpoint returns the post-mutation entity: evaluate responds with status EVALUATED and the stored eval_score; pass responds with PASSED and response_period_index already set — no re-read needed."
        test_recipe:
          setup: ["signed pipeline; round open; submission sent; manuscript EVALUATED path reused"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency IC", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "T" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms1}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr1: $.data.id } }
          trigger:
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 77 }, as: Agent, as_user_id: "${agent1}", captures: { est: $.data.status, esc: $.data.eval_score } }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${ms1}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { r1: $.data.id, rv1: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${r1}", editor_id: "${edA}" }, as: Agent, as_user_id: "${agent1}", captures: { s1: $.data.id } }
            - { call: "POST /submission-rounds/${r1}/open", payload: { expected_submission_round_version: "${rv1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${s1}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${s1}/pass", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { pst: $.data.status, prp: $.data.response_period_index } }
          assert:
            - "${est} == EVALUATED and ${esc} == 77   # evaluate response already reflects the transition"
            - "${pst} == PASSED and ${prp} == 0   # pass response carries the terminal state and stamp"
