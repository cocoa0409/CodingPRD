              payload: {}
              as: PermitSpecialist
              captures: { a_route: "$.data.routing_decision" }
            - call: "GET /osup/use-areas/${ua_id}/allocation-summary"
              payload: {}
              as: PermitSpecialist
              captures: { avail_mid: "$.data.available_service_days", ratio_mid: "$.data.demand_ratio", posture_mid: "$.data.allocation_posture" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Cedar Creek Outfitters", ein: "420000003", contact_email: "ops@cedar.example", prequalification_insurance_verified: true }
