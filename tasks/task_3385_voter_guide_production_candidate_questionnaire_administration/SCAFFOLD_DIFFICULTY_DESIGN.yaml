            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-16T00:00:00Z" }, as: LeagueAdmin }
            - { call: "GET /contests/${ct_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_ver: "$.data.version" } }
            - { call: "POST /contests/${ct_id}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${ct_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${ct_id}/forums", payload: { scheduled_start: "2026-10-10T10:00:00Z", scheduled_end: "2026-10-10T12:00:00Z", moderator_volunteer_id: "${mod1}" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { f1_id: "$.data.id" } }
          trigger:
            - { call: "POST /contests/${ct_id}/forums", payload: { scheduled_start: "2026-10-11T10:00:00Z", scheduled_end: "2026-10-11T12:00:00Z", moderator_volunteer_id: "${mod1}" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /contests/${ct_id}/forums", payload: { scheduled_start: "2026-10-11T12:00:00Z", scheduled_end: "2026-10-11T13:00:00Z", moderator_volunteer_id: "${mod1}" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { f3_id: "$.data.id" } }
          assert:
            - "22-hour gap (next start 2026-10-11T10:00:00Z vs prior end 2026-10-10T12:00:00Z): error_id == ERR_MODERATOR_BUFFER_VIOLATION, HTTP 422"
            - "Exactly 24-hour gap (start 2026-10-11T12:00:00Z): created 201, status PLANNED — the buffer comparison is >= 24h, not strict-greater"

