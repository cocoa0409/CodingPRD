  - section: rbac
    instances:
      - name: program_admin_catalog_and_lifecycle_writes_are_forbidden_to_every_other_role
        claim_type: exclusive_operations
        grounds:
          - roles.ProgramAdmin.exclusive_operations
          - validations[priority=8]
          - validations[priority=20]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The role gate at priority 8 runs before the existence check at priority
          20, so a denied caller must get 403 even when the path id belongs to
          nothing at all — a bogus order id may never leak a 404.
        test_recipe:
          setup:
            - "Empty database; no rows of any kind are needed because the role gate precedes every lookup."
          setup_api_calls: []
          trigger:
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-R1", product_family: "CRX", market_release_date: "2024-01-01T00:00:00Z", repairability_tier: "TIER_B_GUIDED" }
