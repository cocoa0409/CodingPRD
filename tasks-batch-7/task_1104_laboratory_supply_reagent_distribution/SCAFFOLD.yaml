    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: "RecallNotice[]"
    side_effects: []
  - method: GET
    path: "/lab/recalls/{recallId}"
    description: "Get one recall"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []
  - method: POST
    path: "/lab/recalls/{recallId}/issue"
