scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: seasonal_pricing_variants_diverge_on_lease
        grounds:
          - calculations.seasonal_lease_pricing
          - state_machines.Lease.RESERVED_to_ACTIVE
        distinguishing_aspect: |
          The two seasonal_lease_pricing variants operate on the Lease entity:
          summer_non_liveaboard and summer_liveaboard. With identical Slip and
          identical date window, only Lease.is_liveaboard toggles, producing
          nightly_rate_cents 7500 vs 8250 — same inputs, different outputs.
        test_recipe:
          setup:
            - "Marina HM created with default SUMMER window 05-01..09-30 and liveaboard_cap=5."
            - "Two identical Slips A and B at HM (length 50, beam 15, base_daily_rate_cents 5000, liveaboard_allowed true, pumpout true)."
            - "Tenant T1 with vessel V1 (loa 40, beam 12, valid insurance)."
            - "Tenant T1 liveaboard_status == APPROVED."
            - "Clock pinned at 2026-07-01T00:00:00Z so that the lease falls inside SUMMER."
            - "Lease L_NL on slip A is non-liveaboard, 5 nights starting 2026-07-10."
            - "Lease L_LA on slip B is liveaboard, 5 nights starting 2026-07-10."
            - "Both leases ready to check in; clock 2026-07-10."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HM", harbor_code: "HMA", liveaboard_cap: 5 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "A-1", length_ft: 50, beam_ft: 15, power_amp: "A50", pumpout_available: true, liveaboard_allowed: true, base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_a_id: $.data.id, slip_a_v0: $.data.version }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "A-2", length_ft: 50, beam_ft: 15, power_amp: "A50", pumpout_available: true, liveaboard_allowed: true, base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_b_id: $.data.id, slip_b_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "t1@x.com", full_name: "T One" }
              as: HarborMaster
              captures: { t1_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${t1_id}", name: "V1", loa_ft: 40, beam_ft: 12, insurance_policy_number: "P1", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${t1_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /tenants/${t1_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${t1_id}"
            - call: "POST /tenants/${t1_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_a_id}", tenant_id: "${t1_id}", vessel_id: "${v1_id}", start_date: "2026-07-10", end_date: "2026-07-15", is_liveaboard: false, expected_slip_version: "${slip_a_v0}" }
              as: Tenant
              as_user_id: "${t1_id}"
              captures: { lease_nl_id: $.data.id }
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_b_id}", tenant_id: "${t1_id}", vessel_id: "${v1_id}", start_date: "2026-07-10", end_date: "2026-07-15", is_liveaboard: true, expected_slip_version: "${slip_b_v0}" }
              as: Tenant
              as_user_id: "${t1_id}"
              captures: { lease_la_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
          trigger:
            - call: "POST /leases/${lease_nl_id}/check-in"
              payload: {}
              as: MarinaStaff
            - call: "POST /leases/${lease_la_id}/check-in"
              payload: {}
              as: MarinaStaff
          assert:
            - "Lease.${lease_nl_id}.nightly_rate_cents == 7500"
            - "Lease.${lease_la_id}.nightly_rate_cents == 8250"
            - "Lease.${lease_nl_id}.total_cost_cents == 37500"
            - "Lease.${lease_la_id}.total_cost_cents == 48750"

      - name: tow_assist_outcome_branches_on_vessel
        grounds:
          - calculations.tow_assistance_dispatch
          - entities.TowAssistEvent.fields.outcome
        distinguishing_aspect: |
          Operates on a different entity domain (TowAssistEvent on Vessel),
          NOT a re-shaping of the Lease pricing problem. Two valid evaluation
          paths through tow_assistance_dispatch — insurance-first vs
          radius-first — yield different outcomes for the same incident. The
          scaffold pins insurance-first, producing INSURANCE_INVALID when
          BOTH insurance is expired AND distance exceeds radius. A
          radius-first evaluator on identical inputs would produce
          OUT_OF_RADIUS — divergent results for the same data.
        test_recipe:
          setup:
            - "Marina HMB with tow_assist_radius_nm = 25."
            - "Tenant T2 with Vessel V2 having insurance_expires_on 2020-01-01 (expired) and incident_distance_nm = 50 (out of radius)."
            - "Clock pinned 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMB", harbor_code: "HMB", liveaboard_cap: 3, tow_assist_radius_nm: 25.0 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t2@x.com", full_name: "T Two" }
              as: HarborMaster
              captures: { t2_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${t2_id}", name: "V2", loa_ft: 35, beam_ft: 12, insurance_policy_number: "PEXP", insurance_expires_on: "2020-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${t2_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: HarborMaster
          trigger:
            - call: "POST /tow-assist-events"
              payload: { tenant_id: "${t2_id}", vessel_id: "${v2_id}", marina_id: "${mar_id}", incident_distance_nm: 50.0 }
              as: Tenant
              as_user_id: "${t2_id}"
              captures: { ev_id: $.data.id }
          assert:
            - "TowAssistEvent.${ev_id}.outcome == \"INSURANCE_INVALID\""

  # =====================================================================
  # Rule 2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: seasonal_pricing_per_step_rounding_pins_value
        grounds:
          - calculations.seasonal_lease_pricing
          - state_machines.Lease.RESERVED_to_ACTIVE
        distinguishing_aspect: |
          Combinatorial mode (b): nested rounding where order matters. The
          scaffold pins per-step rounding (step-2 round_half_up before step-3
          surcharge), and a base rate of 333 cents in SUMMER + liveaboard
          produces nightly_rate_cents == 550. Round-once-at-end arithmetic
          (333 * 1.65 = 549.45 -> 549) would produce 549, a one-cent
          divergence proving rounding order is observable.
        test_recipe:
          setup:
            - "Marina HMC, defaults; Slip with base_daily_rate_cents = 333, liveaboard_allowed true."
            - "Tenant T3 APPROVED for liveaboard at HMC; Vessel V3 valid."
            - "Lease 2 nights starting 2026-07-10 (SUMMER), is_liveaboard true."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMC", harbor_code: "HMC", liveaboard_cap: 3 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "C-1", length_ft: 50, beam_ft: 15, power_amp: "A50", pumpout_available: true, liveaboard_allowed: true, base_daily_rate_cents: 333 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "t3@x.com", full_name: "T Three" }
              as: HarborMaster
              captures: { t3_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${t3_id}", name: "V3", loa_ft: 40, beam_ft: 12, insurance_policy_number: "P3", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${t3_id}"
              captures: { v3_id: $.data.id }
            - call: "POST /tenants/${t3_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${t3_id}"
            - call: "POST /tenants/${t3_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${t3_id}", vessel_id: "${v3_id}", start_date: "2026-07-10", end_date: "2026-07-12", is_liveaboard: true, expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${t3_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
          trigger:
            - call: "POST /leases/${lease_id}/check-in"
              payload: {}
              as: MarinaStaff
          assert:
            - "Lease.${lease_id}.nightly_rate_cents == 550"
            - "Lease.${lease_id}.total_cost_cents == 4100"

      - name: tow_assist_evaluation_order_pinned
        grounds:
          - calculations.tow_assistance_dispatch
        distinguishing_aspect: |
          Combinatorial mode (c): circular-looking dependency between two
          gates (insurance, radius); evaluation order is PINNED so the
          outcome is well-defined. A request that fails BOTH gates evaluates
          INSURANCE_INVALID (step 1) — proving the order short-circuits
          before step 2 is consulted. Differs in MODE from the rounding-order
          instance above; distinct axis of combinatorial complexity.
        test_recipe:
          setup:
            - "Marina HMD with tow_assist_radius_nm = 10 (small)."
            - "Tenant T4 with Vessel V4 insurance_expires_on 2026-10-01 (valid) and incident_distance_nm = 50 (out)."
            - "Clock 2026-08-01."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMD", harbor_code: "HMD", liveaboard_cap: 2, tow_assist_radius_nm: 10.0 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t4@x.com", full_name: "T Four" }
              as: HarborMaster
              captures: { t4_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${t4_id}", name: "V4", loa_ft: 30, beam_ft: 10, insurance_policy_number: "P4", insurance_expires_on: "2026-10-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${t4_id}"
              captures: { v4_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: HarborMaster
          trigger:
            - call: "POST /tow-assist-events"
              payload: { tenant_id: "${t4_id}", vessel_id: "${v4_id}", marina_id: "${mar_id}", incident_distance_nm: 50.0 }
              as: Tenant
              as_user_id: "${t4_id}"
              captures: { ev_id: $.data.id }
          assert:
            - "TowAssistEvent.${ev_id}.outcome == \"OUT_OF_RADIUS\""

  # =====================================================================
  # Rule 3 — non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tenant_liveaboard_cycle_revoked_to_pending
        grounds:
          - state_machines.Tenant.REVOKED_to_PENDING
          - state_machines.Tenant.APPROVED_to_REVOKED
        distinguishing_aspect: |
          The Tenant state machine forms a cycle: NONE -> PENDING -> APPROVED
          -> REVOKED -> PENDING -> APPROVED. The REVOKED -> PENDING edge
          (re-apply) closes the loop and proves non-linearity on the Tenant
          entity. A linear A->B->C->D pipeline would not contain this edge.
        test_recipe:
          setup:
            - "Marina HME with liveaboard_cap=3. Tenant T5 has gone through PENDING -> APPROVED -> REVOKED."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HME", harbor_code: "HME", liveaboard_cap: 3 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t5@x.com", full_name: "T Five" }
              as: HarborMaster
              captures: { t5_id: $.data.id }
            - call: "POST /tenants/${t5_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${t5_id}"
            - call: "POST /tenants/${t5_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /tenants/${t5_id}/liveaboard-revoke"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
          trigger:
            - call: "POST /tenants/${t5_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${t5_id}"
          assert:
            - "Tenant.${t5_id}.liveaboard_status == \"PENDING\""

      - name: slip_branches_to_available_or_out_of_service
        grounds:
          - state_machines.Slip.AVAILABLE_to_RESERVED
          - state_machines.Slip.AVAILABLE_to_OUT_OF_SERVICE
          - state_machines.Slip.RESERVED_to_AVAILABLE
        distinguishing_aspect: |
          The Slip state machine BRANCHES from AVAILABLE — two outgoing
          edges (to RESERVED via reservation, to OUT_OF_SERVICE via
          decommission). And RESERVED has divergent side-effect sets per
          target (cancel back to AVAILABLE vs check-in to OCCUPIED).
          Branching shape on a different entity than the Tenant cycle.
        test_recipe:
          setup:
            - "Marina HMF, slip S1, AVAILABLE."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMF", harbor_code: "HMF", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "F-1", length_ft: 40, beam_ft: 12, power_amp: "A30", base_daily_rate_cents: 4000 }
              as: HarborMaster
              captures: { slip_id: $.data.id }
          trigger:
            - call: "POST /slips/${slip_id}/decommission"
              payload: {}
              as: HarborMaster
          assert:
            - "Slip.${slip_id}.status == \"OUT_OF_SERVICE\""

  # =====================================================================
  # Rule 4 — transitive_cascade
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: checkout_triggers_three_hop_cascade_to_waitlist
        grounds:
          - state_machines.Slip.OCCUPIED_to_AVAILABLE
          - state_machines.Lease.ACTIVE_to_ENDED
          - state_machines.TransferWaitlistEntry.QUEUED_to_PROMOTED
          - calculations.waitlist_promotion_pick
        distinguishing_aspect: |
          Depth-3 transitive chain from a single trigger (POST
          /leases/{id}/check-out): check-out -> Lease ACTIVE -> ENDED
          (hop 1) -> Marina.liveaboard_current_count decrement caused by
          hop 1 (hop 2) -> waitlist head QUEUED -> PROMOTED caused by hop 1
          freeing the slip (hop 3). Each hop is caused by the previous, not
          by the original trigger. Originating transition differs from the
          rule-4 second instance.
        setup:
        test_recipe:
          setup:
            - "Marina HMG with liveaboard_cap=2."
            - "Slip A currently OCCUPIED by Lease L1 (T6, V6, liveaboard) checked in 2026-07-10."
            - "Slip B exists; T6's other lease elsewhere; T7 holds an ACTIVE lease at HMG on Slip B and has a QUEUED TransferWaitlistEntry W1 targeting Slip A (oldest)."
            - "T8 has a QUEUED entry W2 targeting Slip A (newer)."
            - "Clock 2026-07-15."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMG", harbor_code: "HMG", liveaboard_cap: 2 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "G-A", length_ft: 50, beam_ft: 15, power_amp: "A50", pumpout_available: true, liveaboard_allowed: true, base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_a_id: $.data.id, slip_a_v0: $.data.version }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "G-B", length_ft: 50, beam_ft: 15, power_amp: "A50", pumpout_available: true, liveaboard_allowed: false, base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_b_id: $.data.id, slip_b_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "t6@x.com", full_name: "T Six" }
              as: HarborMaster
              captures: { t6_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t7@x.com", full_name: "T Seven" }
              as: HarborMaster
              captures: { t7_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${t6_id}", name: "V6", loa_ft: 40, beam_ft: 12, insurance_policy_number: "P6", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${t6_id}"
              captures: { v6_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${t7_id}", name: "V7", loa_ft: 40, beam_ft: 12, insurance_policy_number: "P7", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${t7_id}"
              captures: { v7_id: $.data.id }
            - call: "POST /tenants/${t6_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${t6_id}"
            - call: "POST /tenants/${t6_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_a_id}", tenant_id: "${t6_id}", vessel_id: "${v6_id}", start_date: "2026-07-10", end_date: "2026-07-15", is_liveaboard: true, expected_slip_version: "${slip_a_v0}" }
              as: Tenant
              as_user_id: "${t6_id}"
              captures: { lease_l1_id: $.data.id }
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_b_id}", tenant_id: "${t7_id}", vessel_id: "${v7_id}", start_date: "2026-07-10", end_date: "2026-07-20", is_liveaboard: false, expected_slip_version: "${slip_b_v0}" }
              as: Tenant
              as_user_id: "${t7_id}"
              captures: { lease_l2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases/${lease_l1_id}/check-in"
              payload: {}
              as: MarinaStaff
            - call: "POST /leases/${lease_l2_id}/check-in"
              payload: {}
              as: MarinaStaff
            - call: "POST /transfer-waitlist"
              payload: { marina_id: "${mar_id}", tenant_id: "${t7_id}", from_lease_id: "${lease_l2_id}", target_slip_id: "${slip_a_id}" }
              as: Tenant
              as_user_id: "${t7_id}"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /leases/${lease_l1_id}/check-out"
              payload: {}
              as: MarinaStaff
          assert:
            - "Lease.${lease_l1_id}.status == \"ENDED\""
            - "Marina.${mar_id}.liveaboard_current_count == 0"
            - "TransferWaitlistEntry.${w1_id}.status == \"PROMOTED\""
            - "Slip.${slip_a_id}.status == \"RESERVED\""

      - name: liveaboard_revoke_cancels_reserved_leases
        grounds:
          - state_machines.Tenant.APPROVED_to_REVOKED
          - state_machines.Lease.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 transitive chain from a DIFFERENT triggering transition
          (POST /tenants/{id}/liveaboard-revoke): revoke -> Tenant APPROVED
          -> REVOKED (hop 1) -> the marina-counter decrement caused by hop 1
          AND the cascade scanning Lease.is_liveaboard==true RESERVED rows
          for the tenant, transitioning each to CANCELLED, caused by hop 1
          (hop 2). Originating transition is different from the rule-4 first
          instance.
        test_recipe:
          setup:
            - "Marina HMH; T8 APPROVED for liveaboard at HMH; T8 has a RESERVED liveaboard Lease at HMH that has NOT been checked in."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMH", harbor_code: "HMH", liveaboard_cap: 3 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "H-1", length_ft: 50, beam_ft: 15, power_amp: "A50", liveaboard_allowed: true, base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "t8@x.com", full_name: "T Eight" }
              as: HarborMaster
              captures: { t8_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${t8_id}", name: "V8", loa_ft: 40, beam_ft: 12, insurance_policy_number: "P8", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${t8_id}"
              captures: { v8_id: $.data.id }
            - call: "POST /tenants/${t8_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${t8_id}"
            - call: "POST /tenants/${t8_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${t8_id}", vessel_id: "${v8_id}", start_date: "2026-08-01", end_date: "2026-08-05", is_liveaboard: true, expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${t8_id}"
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /tenants/${t8_id}/liveaboard-revoke"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
          assert:
            - "Tenant.${t8_id}.liveaboard_status == \"REVOKED\""
            - "Marina.${mar_id}.liveaboard_current_count == 0"
            - "Lease.${lease_id}.status == \"CANCELLED\""

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: insurance_invalid_beats_size_mismatch_on_checkin
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Two violations at check-in: vessel has expired insurance (priority
          6, business_safety / ERR_INSURANCE_INVALID) AND vessel exceeds
          slip size (priority 8, business_constraint /
          ERR_SLIP_SIZE_MISMATCH). The priority order dictates safety wins
          — ERR_INSURANCE_INVALID is returned. Error-category pair:
          business_safety vs business_constraint.
        test_recipe:
          setup:
            - "Slip with length_ft=20 (small); Vessel with loa_ft=40 (oversize) AND insurance_expires_on=2020-01-01 (expired); Lease created when insurance was valid via clock manipulation."
          setup_api_calls:
