            - call: "POST /api/delivery-units/${unit_id}/holds"
              payload: { delivery_point_id: "${p_id}", hold_start_date: "2026-09-16", hold_end_date: "2026-09-20", disposition: "CARRIER_PICKUP" }
              as: CustomerServiceRep
              captures: { hold2_id: $.data.id }
          assert:
            - "the hold starting on 2026-09-15 (the incumbent's end date) is rejected 409 with error_id == ERR_HOLD_OVERLAP — the incumbent's window still occupies that day under half-open [start, end+1) arithmetic"
            - "the hold starting 2026-09-16 (end+1) is accepted 201 as HoldMail.${hold2_id} — exact adjacency is legal"
            - "both holds remain SCHEDULED; no state mutation on the rejected attempt"

