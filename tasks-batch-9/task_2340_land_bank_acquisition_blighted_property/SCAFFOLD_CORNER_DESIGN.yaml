          assert:
            - "${pk1_committed} == 96000 and ${fs_status_mid} == CONSTRAINED and ${fs_avail_mid} == 4000"
            - "HTTP 200 and ${pk1_status} == DECLINED and ${pk1_committed_after} == 0"
            - "FundingSource.${fs_id}.committed_cents == 0 and available_cents == 100000 and disbursed_cents == 0 and status == ACTIVE"
            - "AcquisitionPacket.${pk2_id}.status == DUE_DILIGENCE and hold_reason == null"
            - "authorized_cents == available_cents + committed_cents + disbursed_cents holds before and after the decline"

      - name: run_execute_with_every_selection_dropped_moves_to_void
        claim_type: valid_transition
        grounds:
          - state_machines.DemolitionRun.PLANNED_to_VOID
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The execute fork takes the VOID branch, not the EXECUTED branch: the one selected parcel picked up a SCHEDULED DEMOLITION order after the snapshot was frozen, so dropped_property_ids equals selected_property_ids, orders_created_count is 0, nothing is committed (not even the admin fee), and open_run_count still falls to 0."
        test_recipe:
          setup:
            - "An ACQUIRED, CLEAR-title, grade F, lot 3000 parcel with current_blight_score 44.0 (>= the 40 threshold), acquired on a dedicated acquisition source."
            - "An ANY operations source authorized 5000000; a PLANNED run with budget 3000000 selects that single parcel (estimate 1427611, admin fee 107071)."
            - "A direct DEMOLITION order is then scheduled on the same parcel, which invalidates the run's frozen selection."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Void Run Acquisition Line", source_type: "GENERAL_FUND", authorized_cents: 500000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_acq_id: $.data.id }
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Void Run Operations Line", source_type: "GRANT", authorized_cents: 5000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_ops_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-201110", address: "1110 Sumac St", situs_ward: 5, lot_area_sqft: 3000, assessed_value_cents: 150000, structure_present: true, structure_condition_grade: "F", vacancy_months: 0 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_acq_id}", channel: "TAX_FORECLOSURE", offer_price_cents: 0, title_search_fee_cents: 9000, foreclosure_case_no: "TF-2026-0111" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-410" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-4600-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/properties/${p_id}/title-actions"
              payload: { action_type: "TAX_DEED_CONFIRMATION" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta_id: $.data.id }
            - call: "POST /land-bank/title-actions/${ta_id}/adjudicate"
              payload: { outcome: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "GET /land-bank/funding-sources/${fs_ops_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { fs_ops_v: $.data.version }
            - call: "POST /land-bank/demolition-runs"
              payload: { funding_source_id: "${fs_ops_id}", budget_cents: 3000000, situs_ward_filter: 5, expected_funding_source_version: "${fs_ops_v}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { run_id: $.data.id, run_status: $.data.status, sel_count: $.data.properties_selected_count, cap: $.data.provisional_cap_cents, subtotal: $.data.committed_subtotal_cents, admin: $.data.admin_fee_cents, total: $.data.total_committed_cents }
            - call: "POST /land-bank/contractors"
              payload: { name: "Independent Demo Crew", license_expires_on: "2027-12-31T00:00:00Z", max_concurrent_crews: 2, specialties: ["DEMOLITION"] }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { ctr_id: $.data.id }
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { p_v: $.data.version }
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "DEMOLITION", contractor_id: "${ctr_id}", funding_source_id: "${fs_ops_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-12T00:00:00Z", expected_property_version: "${p_v}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { mo_id: $.data.id, mo_est: $.data.estimated_cost_cents }
          trigger:
            - call: "POST /land-bank/demolition-runs/${run_id}/execute"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { final_status: $.data.status, created: $.data.orders_created_count, executed_at: $.data.executed_at }
          assert:
            - "${run_status} == PLANNED and ${sel_count} == 1 and ${cap} == 2790697 and ${subtotal} == 1427611 and ${admin} == 107071 and ${total} == 1534682"
            - "${mo_est} == 1427611  # the same grade F lot 3000 estimate, now committed by the direct order"
            - "HTTP 200 and ${final_status} == VOID and ${created} == 0 and ${executed_at} == 2026-08-01T00:00:00Z"
            - "DemolitionRun.${run_id}.dropped_property_ids == DemolitionRun.${run_id}.selected_property_ids == [${p_id}]"
            - "FundingSource.${fs_ops_id}.committed_cents == 1427611  # only the direct order; no admin fee was committed by the void run"
            - "FundingSource.${fs_ops_id}.open_run_count == 0 and MaintenanceOrder rows with demolition_run_id == ${run_id} number 0"

      - name: property_custody_cycles_back_to_listed_after_reverter
        claim_type: valid_transition
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Property.custody_status.REVERTED_to_LISTED
        excluded_because:
          difficulty_instance: property_custody_reverter_cycle_back_to_listed
          rationale: "The cyclic-shape claim (CONVEYED -> REVERTED -> LISTED re-entry, second listed_at, fresh TitleAction round_no 2) is exactly the non-linear state machine fixture in §1.8; repeating it here would duplicate the same traversal."

      - name: funding_source_status_derived_from_ledger_position
        claim_type: side_effect_execution
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.FundingSource.ACTIVE_to_CONSTRAINED
        excluded_because:
          difficulty_instance: demolition_run_execute_depth_four_funding_cascade
          rationale: "The compound/derived claim - FundingSource status re-derived from its ledger fields and re-derivation rippling into every DUE_DILIGENCE packet - is the four-level cascade already asserted end to end in §1.8."

  # ===========================================================================
  - section: calculations
    instances:
      - name: mow_estimate_rounds_half_up_at_the_overhead_stage
        claim_type: correct_result
        grounds:
          - calculations.maintenance_order_estimate
        distinguishing_aspect: "A 10000 sqft MOW lands exactly on a half cent at the overhead stage: 10 ksqft x 1850 = 18500, overhead 0.065 x 18500 = 1202.5 which round_half_up takes UP to 1203, so the estimate is 19703 and not the round-half-even 19702."
        test_recipe:
          setup:
            - "An ACQUIRED parcel of exactly 10000 sqft on an ANY source authorized 1000000 cents, plus a MOW-capable contractor."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Mow Estimate Line", source_type: "GRANT", authorized_cents: 1000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-202010", address: "2010 Tulip St", situs_ward: 3, lot_area_sqft: 10000, assessed_value_cents: 300000, structure_present: false, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 0, donor_name: "Tulip Street Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-500" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-4700-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/contractors"
              payload: { name: "Half Cent Mowing", license_expires_on: "2027-12-31T00:00:00Z", max_concurrent_crews: 2, specialties: ["MOW"] }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { ctr_id: $.data.id }
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "MOW", contractor_id: "${ctr_id}", funding_source_id: "${fs_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-06T00:00:00Z", expected_property_version: "${p_v}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { est: $.data.estimated_cost_cents, mo_id: $.data.id, mo_status: $.data.status }
          assert:
            - "HTTP 201 and ${est} == 19703 and ${mo_status} == SCHEDULED"
            - "MaintenanceOrder.${mo_id}.actual_cost_cents == null and contractor_id == ${ctr_id} and demolition_run_id == null"
            - "FundingSource.${fs_id}.committed_cents == 19703 and available_cents == 980297 and disbursed_cents == 0"

      - name: hearing_support_ratio_kept_to_four_decimals
        claim_type: precision
        grounds:
          - calculations.hearing_support_ratio
          - endpoints["POST /land-bank/properties/{id}/reuse-hearings"]
        distinguishing_aspect: "5 of 7 comments in support is a non-terminating 0.714285..., which must be stored as exactly 0.7143 (4 places, round_half_up) - not 0.71, not 0.7142, and not a full-precision float."
        test_recipe:
          setup:
            - "One registry parcel to hang the hearing on; no acquisition is needed because hearings are recorded on any parcel."
