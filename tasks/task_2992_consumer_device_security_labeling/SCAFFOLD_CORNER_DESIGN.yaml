  - section: validations
    instances:
      - name: priority_conflict_referential_check_precedes_the_fiscal_check
        claim_type: Priority conflict
        grounds:
          - validations.priority_56
          - validations.priority_70
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_before_fiscal_on_label_grant_request
          rationale: "That §1.8 instance violates priority 56 and priority 70 in one request and asserts ERR_ASSESSMENT_NOT_APPROVED wins, then removes the referential fault and shows ERR_SPONSOR_DELINQUENT surface."

      - name: priority_conflict_safety_check_precedes_the_referential_check
        claim_type: Priority conflict
        grounds:
          - validations.priority_50
          - validations.priority_55
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_before_referential_on_label_grant_request
          rationale: "That §1.8 instance violates priority 50 and priority 55 together and asserts ERR_DEVICE_CLASS_EXCLUDED wins, then isolates ERR_ASSESSMENT_PRODUCT_MISMATCH."

      - name: cross_entity_validation_sponsor_standing_gates_grant_issuance
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_70
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / grant_issuance_requires_manufacturer_standing_good
          rationale: "The DELINQUENT-sponsor rejection and the post-payment success on the identical request are both asserted there."

      - name: cross_entity_validation_publication_state_gates_display_authorization
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_64
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / display_authorization_requires_published_active_grant
          rationale: "ERR_GRANT_NOT_PUBLISHED on a PENDING_REGISTRY grant and the success after publication are asserted there."

      - name: aggregate_validation_lab_bench_capacity_across_overlapping_windows
        claim_type: Aggregate validation
        grounds:
          - validations.priority_60
          - validations.priority_61
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lab_bench_aggregate_capacity_halfopen_overlap
          rationale: "Individually legal engagements whose half-open windows overlap to exceed concurrent_bench_capacity, plus the touching-window acceptance, are asserted there."

      - name: temporal_validation_display_window_conflict_on_a_closed_interval
        claim_type: Temporal validation
        grounds:
          - validations.priority_66
          - validations.priority_67
        excluded_because:
          difficulty_instance: resource_temporal_overlap / retailer_display_closed_interval_with_changeover_buffer
          rationale: "The closed-interval touch that conflicts, the one-second changeover that does not, and ERR_DISPLAY_WINDOW_OUTSIDE_VALIDITY are all asserted there."

      - name: violation_to_error_excluded_device_class_cannot_be_labelled
        claim_type: Violation → Error
        grounds:
          - validations.priority_50
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_before_referential_on_label_grant_request
          rationale: "ERR_DEVICE_CLASS_EXCLUDED is triggered there on POST /labeling/label-grants for a MEDICAL_IMPLANT product."

      - name: violation_to_error_score_below_the_tier_minimum
        claim_type: Violation → Error
        grounds:
          - validations.priority_53
        excluded_because:
          difficulty_instance: boundary_precision_check / score_exactly_at_tier_minimum_approves_and_one_hundredth_above_rejects
          rationale: "ERR_SCORE_BELOW_MINIMUM is triggered there one hundredth below the tier minimum, which is the tightest form of this violation."

      - name: violation_to_error_grant_request_on_an_undecided_assessment
        claim_type: Violation → Error
        grounds:
          - validations.priority_56
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_before_fiscal_on_label_grant_request
          rationale: "ERR_ASSESSMENT_NOT_APPROVED is triggered there on an UNDER_REVIEW assessment."

      - name: violation_to_error_assessment_belongs_to_another_product
        claim_type: Violation → Error
        grounds:
          - validations.priority_55
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_before_referential_on_label_grant_request
          rationale: "ERR_ASSESSMENT_PRODUCT_MISMATCH is isolated there by pairing a product with an assessment of a sibling product owned by the same manufacturer."

      - name: violation_to_error_segregation_of_duties_on_the_reviewer_chain
        claim_type: Violation → Error
        grounds:
          - validations.priority_22
        excluded_because:
          difficulty_instance: non_linear_state_machine / assessment_deficiency_revision_cycle
          rationale: "ERR_SEGREGATION_OF_DUTIES is triggered there when the reviewer who wrote the deficiency tries to approve the resubmission; the publication leg of the same rule is covered by rbac instances in this file."

