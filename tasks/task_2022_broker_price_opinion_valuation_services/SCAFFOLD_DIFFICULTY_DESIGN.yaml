  # =========================================================================
  # Rule 9 — compensating_invariant: two DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: broker_open_order_count_conservation_across_decline
        grounds:
          - state_machines.ValuationOrder.DISPATCHED_to_IN_PROGRESS
          - state_machines.ValuationOrder.DISPATCHED_to_READY_FOR_DISPATCH
          - entities.Broker.fields.max_concurrent_orders
        distinguishing_aspect: |
          Conserved quantity: Broker.open_order_count (count of orders in
          {DISPATCHED, IN_PROGRESS, REPORT_SUBMITTED, QC_REVIEW, REVISION_REQUESTED}).
          Dispatch (+1) paired with decline (-1) restores the invariant;
          dispatch (+1) paired with accept (no change) preserves it; suspend
          that reverts a DISPATCHED order to READY_FOR_DISPATCH (-1) also
          conserves it. Invariant: count(after) == count(before) + (number
          of forward dispatches) - (number of compensating declines/cancels).
        test_recipe:
          setup:
            - "Broker with 0 open orders; dispatch 2 orders, then decline 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bpo/state-regulations"
              payload: { state_code: "IN", bpo_permitted: true, appraisal_required_for_interior: false, min_driveby_radius_miles: 1.0, min_interior_radius_miles: 0.5 }
              as: ComplianceOfficer
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "CLQ", display_name: "Client Q", sla_hours_standard: 72, sla_hours_rush: 24, late_penalty_bps_per_day: 250 }
              as: PlatformAdmin
              captures: { cl_q: $.data.id }
            - call: "POST /bpo/brokers"
              payload: { broker_code: "BRKQ", full_name: "Broker Q", email: "bq@x.com", max_concurrent_orders: 5 }
              as: ComplianceOfficer
              captures: { brk_q: $.data.id }
            - call: "POST /bpo/brokers/${brk_q}/licenses"
              payload: { state_code: "IN", license_kind: "BPO", license_number: "LIC-IN-Q", expires_on: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bpo/brokers/${brk_q}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bpo/properties"
              payload: { street_address: "150 A", city: "IND", state_code: "IN", postal_code: "46201", living_area_sqft: 1200, lot_area_sqft: 4000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { prop_q1: $.data.id }
            - call: "POST /bpo/properties"
              payload: { street_address: "151 A", city: "IND", state_code: "IN", postal_code: "46202", living_area_sqft: 1200, lot_area_sqft: 4000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { prop_q2: $.data.id }
            - call: "POST /bpo/valuation-orders"
              payload: { property_id: "${prop_q1}", order_kind: "BPO", inspection_level: "DRIVE_BY", priority: "STANDARD", agreed_fee_cents: 10000, client_id: "${cl_q}" }
              as: ClientAdmin
              as_user_id: "${cl_q}"
              captures: { ord_q1: $.data.id, ord_q1_v: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_q1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_q}"
              captures: { ord_q1_v2: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_q1}/dispatch"
              payload: { broker_id: "${brk_q}", expected_order_version: "${ord_q1_v2}" }
              as: DispatchCoordinator
            - call: "POST /bpo/valuation-orders"
              payload: { property_id: "${prop_q2}", order_kind: "BPO", inspection_level: "DRIVE_BY", priority: "STANDARD", agreed_fee_cents: 10000, client_id: "${cl_q}" }
              as: ClientAdmin
              as_user_id: "${cl_q}"
              captures: { ord_q2: $.data.id, ord_q2_v: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_q2}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_q}"
              captures: { ord_q2_v2: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_q2}/dispatch"
              payload: { broker_id: "${brk_q}", expected_order_version: "${ord_q2_v2}" }
              as: DispatchCoordinator
          trigger:
            - call: "POST /bpo/valuation-orders/${ord_q1}/decline"
              payload: {}
              as: Broker
              as_user_id: "${brk_q}"
          assert:
            - "After 2 dispatches and 1 decline, count of orders assigned to broker in {DISPATCHED, IN_PROGRESS, REPORT_SUBMITTED, QC_REVIEW, REVISION_REQUESTED} == 1"
            - "ValuationOrder.${ord_q1}.fulfillment_status == READY_FOR_DISPATCH and assigned_broker_id == null"
            - "ValuationOrder.${ord_q2}.fulfillment_status == DISPATCHED"
            - "Dispatching a third order to ${brk_q} now succeeds (capacity freed)"

      - name: fee_reconciliation_conservation_across_cancel
        grounds:
          - calculations.fee_reconciliation
          - state_machines.ValuationOrder.INTAKE_to_CANCELLED
          - state_machines.ValuationOrder.DISPATCHED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: sum(FeeLine.amount_cents WHERE status !=
          CANCELLED) per order. Adding fee lines then cancelling some DRAFT
          lines reduces the sum by exactly the cancelled amount; the
          invariant is that confirmed fee lines are NEVER removed by any
          cascade (order cancel, broker terminate, QC REJECT), preserving
          the CONFIRMED sum invariant even when the order transitions to a
          terminal state.
        test_recipe:
          setup:
            - "Order in DISPATCHED with one CONFIRMED fee line 6000 and one DRAFT fee line 4000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bpo/state-regulations"
              payload: { state_code: "MO", bpo_permitted: true, appraisal_required_for_interior: false, min_driveby_radius_miles: 1.0, min_interior_radius_miles: 0.5 }
              as: ComplianceOfficer
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "CLR", display_name: "Client R", sla_hours_standard: 72, sla_hours_rush: 24, late_penalty_bps_per_day: 250 }
              as: PlatformAdmin
              captures: { cl_r: $.data.id }
            - call: "POST /bpo/brokers"
              payload: { broker_code: "BRKR", full_name: "Broker R", email: "br@x.com", max_concurrent_orders: 5 }
              as: ComplianceOfficer
              captures: { brk_r: $.data.id }
            - call: "POST /bpo/brokers/${brk_r}/licenses"
              payload: { state_code: "MO", license_kind: "BPO", license_number: "LIC-MO-R", expires_on: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bpo/brokers/${brk_r}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bpo/properties"
              payload: { street_address: "160 A", city: "STL", state_code: "MO", postal_code: "63101", living_area_sqft: 1200, lot_area_sqft: 4000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { prop_r: $.data.id }
            - call: "POST /bpo/valuation-orders"
              payload: { property_id: "${prop_r}", order_kind: "BPO", inspection_level: "DRIVE_BY", priority: "STANDARD", agreed_fee_cents: 10000, client_id: "${cl_r}" }
              as: ClientAdmin
              as_user_id: "${cl_r}"
              captures: { ord_r: $.data.id, ord_r_v: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_r}/fee-lines"
              payload: { fee_kind: "BASE", description: "Base", amount_cents: 6000 }
              as: OperationsManager
              captures: { fee_r1: $.data.id }
            - call: "POST /bpo/valuation-orders/${ord_r}/fee-lines"
              payload: { fee_kind: "RUSH_SURCHARGE", description: "Rush", amount_cents: 4000 }
              as: OperationsManager
              captures: { fee_r2: $.data.id }
            - call: "POST /bpo/valuation-orders/${ord_r}/fee-lines/${fee_r1}/confirm"
              payload: {}
              as: BillingClerk
            - call: "POST /bpo/valuation-orders/${ord_r}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_r}"
              captures: { ord_r_v2: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_r}/dispatch"
              payload: { broker_id: "${brk_r}", expected_order_version: "${ord_r_v2}" }
              as: DispatchCoordinator
          trigger:
            - call: "POST /bpo/valuation-orders/${ord_r}/cancel"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_r}"
          assert:
            - "ValuationOrder.${ord_r}.fulfillment_status == CANCELLED"
            - "FeeLine.${fee_r1}.status == CONFIRMED (conserved — confirmed lines survive cascade)"
            - "FeeLine.${fee_r2}.status == CANCELLED (draft cancelled)"
            - "sum of non-cancelled fee amounts == 6000 (invariant: only CONFIRMED contribute)"
