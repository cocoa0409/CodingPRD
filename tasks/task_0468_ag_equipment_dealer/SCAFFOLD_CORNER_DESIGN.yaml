      - name: curtail_payment_below_shortfall_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_CURTAILMENT_SHORT]", calculations.curtailment_schedule]
        distinguishing_aspect: "A curtailment payment below the required stage-1 shortfall (3000000 on 30000000 at 90 days) is rejected with ERR_CURTAILMENT_SHORT."
        test_recipe:
          setup: ["a CURTAILMENT_DUE FloorPlanNote, principal 30000000, at 90 days, required 3000000"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-CS-1", condition: "NEW", model_code: "9620R", serial_number: "SN-CS-1", dealer_cost_cents: 30000000, list_price_cents: 42000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
