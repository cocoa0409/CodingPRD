  - method: POST
    path: "/trustee/objections/{id}/overrule"
    description: "Court overrules objection -> claim ALLOWED as filed"
    roles: [Court]
    code: 200
    input: []
    output: ClaimObjection
    side_effects: ["claim ALLOWED at filed amount", "case.allowed_claims_total_cents += filed_amount_cents", "case.version += 1"]

  - method: POST
    path: "/trustee/objections/{id}/settle"
    description: "Trustee settles objection (ALLOW | DISALLOW | PARTIAL with settled amount/class)"
    roles: [Trustee]
