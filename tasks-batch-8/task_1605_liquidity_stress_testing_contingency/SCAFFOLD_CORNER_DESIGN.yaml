              as: RiskOfficer
              captures: { m: $.data.id }
            - call: "POST /liquidity/board-limits"
              payload: { subject: "EWI_METRIC", direction: "ABOVE_BREACHES", limit_value: 4000, severity: "BOARD", ewi_metric_id: "${m}" }
              as: RiskOfficer
              captures: { lim: $.data.id }
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 6000 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 50000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 30000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { a1: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 2, estimated_proceeds_cents: 20000000, settlement_lag_days: 0, line_id: "${ln}", prerequisite_action_id: "${a1}" }
              as: TreasuryAnalyst
          trigger:
            - call: "GET /liquidity/stress-scenarios/${sc}/projection-runs"
              as: TreasuryAnalyst
            - call: "GET /liquidity/ewi-metrics/${m}/readings"
              as: TreasuryAnalyst
            - call: "GET /liquidity/contingency-playbooks/${pb}/actions"
              as: TreasuryAnalyst
            - call: "GET /liquidity/board-limits/${lim}/breaches"
              as: RiskOfficer
            - call: "GET /liquidity/collateral-pledges"
              payload: { line_id: "${ln}" }
              as: TreasuryOps
            - call: "GET /liquidity/playbook-actions"
              payload: { prerequisite_action_id: "${a1}" }
              as: TreasuryAnalyst
            - call: "GET /liquidity/board-limits"
              payload: { ewi_metric_id: "${m}" }
              as: RiskOfficer
            - call: "GET /liquidity/contingency-playbooks"
              payload: { scenario_id: "${sc}" }
              as: TreasuryAnalyst
          assert:
            - "scenario projection-runs list contains exactly 1 entry (the CONTRACTUAL run)"
            - "metric readings list contains exactly 1 entry"
            - "playbook actions list contains exactly 2 entries"
            - "limit breaches list contains exactly 1 entry (6000 > 4000)"
            - "pledges filtered by line_id contains exactly 1 entry"
            - "playbook-actions filtered by prerequisite_action_id == a1 contains exactly 1 entry (a2)"
            - "board-limits filtered by ewi_metric_id == m contains exactly 1 entry"
            - "contingency-playbooks filtered by scenario_id contains exactly 1 entry"

