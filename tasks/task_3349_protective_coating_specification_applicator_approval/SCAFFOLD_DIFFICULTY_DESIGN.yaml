  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: spec_issue_state_beats_voc_business_safety
        grounds:
          - "validations[priority=4]"
          - "validations[priority=6]"
          - "concurrency_rules[spec-issue-stale-project]"
          - calculations.voc_compliance
        distinguishing_aspect: |
          Error-category pair state (priority 4) vs business_safety
          (priority 6): issuing a spec that simultaneously violates
          ERR_ACTIVE_SPEC_EXISTS (the project already has an ISSUED spec and
          this issue does not supersede it) and ERR_VOC_LIMIT_EXCEEDED (the
          named system's base_voc_gpl 500 > 340 limit) must surface the state
          error ERR_ACTIVE_SPEC_EXISTS with HTTP 409 — a different category
          pair from the sibling's business_fiscal vs business_referential.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z."
            - "VocRegulation US-FED/SPRAY_AIRLESS limit 340 ACTIVE on [2026-01-01, 2027-01-01)."
            - "System SW-OK-100 (base_voc_gpl 300, compliant) and system SW-BAD-900 (base_voc_gpl 500, non-compliant) both ACTIVE."
            - "BRIDGE project with specA on SW-OK-100 already ISSUED; specB on SW-BAD-900 created as DRAFT with NO supersedes_specification_id; fresh Project.version observed."
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-FED", application_method: SPRAY_AIRLESS, voc_limit_gpl: 340, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-OK-100", manufacturer_name: "Sherwin-Williams", surface_prep_standard: SSPC_SP10_NEAR_WHITE, min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 1, total_dft_min_mils: 8.0, total_dft_max_mils: 16.0, base_voc_gpl: 300, thinner_voc_gpl: 250, adhesion_min_psi: 500, max_thinner_pct: 0.10 }
              as: TechnicalServiceEngineer
              captures: { sysok_id: "$.data.id" }
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-BAD-900", manufacturer_name: "Sherwin-Williams", surface_prep_standard: SSPC_SP10_NEAR_WHITE, min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 1, total_dft_min_mils: 8.0, total_dft_max_mils: 16.0, base_voc_gpl: 500, thinner_voc_gpl: 250, adhesion_min_psi: 500, max_thinner_pct: 0.10 }
              as: TechnicalServiceEngineer
              captures: { sysbad_id: "$.data.id" }
            - call: "POST /coating/projects"
              payload: { project_name: "Pier Renewal", owner_name: "Port Authority", jurisdiction_code: "US-FED", asset_type: BRIDGE, warranty_budget_cents: 1000000 }
              as: ProjectEngineer
              captures: { proj_id: "$.data.id", proj_v: "$.data.version" }
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${sysok_id}", application_method: SPRAY_AIRLESS }
              as: ProjectEngineer
              captures: { speca_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/specifications/${speca_id}/issue"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectEngineer
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${sysbad_id}", application_method: SPRAY_AIRLESS }
              as: ProjectEngineer
              captures: { specb_id: "$.data.id" }
            - call: "GET /coating/projects/${proj_id}"
              as: PlatformAdmin
              captures: { proj_v2: "$.data.version" }
          trigger:
            - call: "POST /coating/projects/${proj_id}/specifications/${specb_id}/issue"
              payload: { expected_project_version: "${proj_v2}" }
              as: ProjectEngineer
              captures: { err: "$.data.error_id" }
            - call: "GET /coating/specifications/${specb_id}"
              as: PlatformAdmin
          assert:
            - "trigger issue response error_id == ERR_ACTIVE_SPEC_EXISTS (not ERR_VOC_LIMIT_EXCEEDED): state priority 4 beats business_safety priority 6, with OCC satisfied by the fresh ${proj_v2}"
            - "trigger issue response http_status == 409"
            - "ProjectSpecification.${specb_id}.status == DRAFT (rejected issue mutates nothing)"
      - name: warranty_issue_fiscal_beats_referential
        grounds:
