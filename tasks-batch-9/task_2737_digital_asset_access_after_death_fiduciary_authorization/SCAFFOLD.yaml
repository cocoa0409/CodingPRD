# =============================================================================
# PRD Benchmark Scaffold — Task 2737
# Digital Asset Access After Death & Fiduciary Authorization
# (estate fiduciary digital asset administration)
#
# Difficulty band: Expert-plus (§0.4 Expert, upper edge)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2737. Digital Asset Access After Death & Fiduciary Authorization (estate fiduciary digital asset
  administration): digital asset inventory across financial accounts, email, cloud storage,
  subscriptions, loyalty programs and social profiles, authority determination among online tool
  designations, will and trust provisions and default statutory rules with the precedence order,
  platform request submission with death certificate, letters of authority and platform-specific
  forms, content versus catalog distinction limiting what a fiduciary may access without explicit
  consent, account memorialization, deletion or transfer election by platform with beneficiary
  designation handling, recurring subscription and auto-renewal cancellation with refund pursuit,
  transferable versus non-transferable asset determination including licenses that terminate at
  death, valuation of transferable digital property for estate tax and distribution to beneficiaries

domain_name: digital-estate-fiduciary-access
api_prefix: ""            # flat topology — every entity is its own top-level collection

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is addressed at its own top-level collection (`/digital-assets/{id}`,
  # `/platform-requests/{id}`, ...). Ownership is expressed by FK fields, never by URL nesting;
  # creation endpoints are the only nested paths (`POST /estates/{id}/digital-assets`) because
  # creation needs the parent context. There is no `/estates/{id}/assets/{id}/...` chain.

  state_machine_shape: parallel
  # DigitalAsset carries two independent state dimensions (access_status × disposition_status)
  # that evolve on the same row from different triggers; PlatformRequest is cyclic
  # (UNDER_REVIEW → INFO_REQUESTED → SUBMITTED → UNDER_REVIEW); DispositionElection is a
  # branching fork-join (DELETE detours through PENDING_COUNTERSIGN, both paths join at
  # SUBMITTED with divergent side-effect sets); Estate.administration_phase is compound
  # (derived from child counts) with one sticky terminal (CLOSED).

  relationship_patterns:
    - one_to_many          # Estate → DigitalAsset / Document / PlatformRequest / BeneficiaryDesignation
    - cross_aggregate      # DispositionElection references BeneficiaryDesignation across aggregates
    - polymorphic          # AuthorityDirective binds to a Platform, an asset category, or neither
    - self_referential     # Fiduciary countersigns another Fiduciary's DispositionElection
                           # (elected_by_fiduciary_id vs countersigned_by_fiduciary_id on one row)

  role_model: segregation_of_duties
  # An irreversible DELETE election must be countersigned by a Fiduciary of the same estate whose
  # id differs from the electing Fiduciary; the CourtRegistrar that verifies letters is the only
  # role that can revoke them; PlatformCompliance decides but can never elect.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Estate
    parent: null
    common_fields: true
    fields:
      - name: decedent_name
        type: string
        source: input
        description: Full legal name of the decedent whose digital estate is administered.
        constraints: non-empty, max 200 chars
      - name: date_of_death
        type: string
        source: input
        description: Calendar date of death; anchors the date-of-death valuation basis.
        constraints: "ISO 8601 date YYYY-MM-DD; must not be after the logical clock's date"
      - name: domicile_state
        type: string
        source: input
        description: Two-letter domicile state code; the jurisdiction whose default statutory rules apply.
        constraints: exactly 2 uppercase letters
      - name: court_case_number
        type: string
        source: input
        description: Probate court case identifier printed on the letters of authority.
        constraints: non-empty, max 60 chars
      - name: alternate_valuation_date
        type: string
        source: computed
        description: >-
          date_of_death advanced by exactly 6 calendar months; when the target month has no such
          day-of-month the last day of the target month is used. Gates ALTERNATE-basis valuation runs.
      - name: administration_phase
        type: enum
        source: computed
        default: INTAKE
        description: Compound posture derived from child counts by calculation estate_administration_phase.
        constraints: "INTAKE | AUTHORIZED | DISCLOSURE | WIND_DOWN | CLOSED"
      - name: inventory_total_count
        type: integer
        source: computed
        default: 0
        description: Count of DigitalAsset rows whose estate_id is this estate.
      - name: disclosed_asset_count
        type: integer
        source: computed
        default: 0
        description: Count of this estate's DigitalAsset rows with access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED}.
      - name: assets_pending_disposition_count
        type: integer
        source: computed
        default: 0
        description: Count of this estate's DigitalAsset rows with disposition_status IN {PENDING, ELECTED}.
      - name: assets_disposed_count
        type: integer
        source: computed
        default: 0
        description: Count of this estate's DigitalAsset rows with disposition_status IN {EXECUTED, PURGED}.
      - name: open_cancellation_count
        type: integer
        source: computed
        default: 0
        description: Count of CancellationOrder rows on this estate's assets with status IN {PENDING, REQUESTED}.
      - name: cancelled_subscription_count
        type: integer
        source: computed
        default: 0
        description: Count of SubscriptionTerm rows on this estate's assets with state == CANCELLED.
      - name: valuation_basis
        type: enum
        source: computed
        default: null
        description: basis of the newest ValuationRun with status IN {COMPUTED, FINALIZED}; null when none exists.
        constraints: "DATE_OF_DEATH | ALTERNATE | null"
      - name: gross_digital_estate_cents
        type: integer
        source: computed
        default: 0
        description: Mirror of the newest non-SUPERSEDED ValuationRun.gross_value_cents (derived-field reconciliation).
      - name: admin_deduction_cents
        type: integer
        source: computed
        default: 0
        description: Mirror of the newest non-SUPERSEDED ValuationRun.admin_deduction_cents.
      - name: taxable_digital_estate_cents
        type: integer
        source: computed
        default: 0
        description: Mirror of the newest non-SUPERSEDED ValuationRun.taxable_value_cents.
      - name: undistributed_value_cents
        type: integer
        source: computed
        default: 0
        description: >-
          Value not yet vested in a beneficiary. Set to gross_digital_estate_cents by every
          valuation run, decremented by DispositionElection EXECUTE of a TRANSFER, restored by REVERSE.
      - name: refund_recovered_cents
        type: integer
        source: computed
        default: 0
        description: Running sum of RefundClaim.credited_cents over this estate's claims with status == CREDITED.
      - name: closing_statement
        type: string
        source: input
        default: null
        description: Fiduciary's closing narrative, supplied to POST /estates/{estate_id}/close.
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the estate was closed; non-null pins administration_phase to CLOSED.

  - name: Fiduciary
    parent: Estate
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: FK -> Estate.id; the estate this fiduciary is appointed over.
      - name: full_name
        type: string
        source: input
        description: Appointed fiduciary's legal name.
        constraints: non-empty, max 200 chars
      - name: appointment_type
        type: enum
        source: input
        description: Nature of the appointment; drives which governing instrument may supply authority.
        constraints: "EXECUTOR | ADMINISTRATOR | TRUSTEE"
      - name: court_reference
        type: string
        source: input
        description: Court order or trust article reference naming this fiduciary.
        constraints: non-empty, max 80 chars
      - name: letters_status
        type: enum
        source: computed
        default: PENDING
        description: >-
          PENDING until a LETTERS_OF_AUTHORITY Document naming this fiduciary is VERIFIED (→ ISSUED);
          REVOKED when that document is revoked.
        constraints: "PENDING | ISSUED | REVOKED"

  - name: Document
    parent: Estate
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: FK -> Estate.id; the estate this evidentiary document belongs to.
      - name: fiduciary_id
        type: string
        source: input
        default: null
        description: >-
          FK -> Fiduciary.id; required when doc_type == LETTERS_OF_AUTHORITY (the fiduciary the
          letters appoint), must be null otherwise.
      - name: doc_type
        type: enum
        source: input
        description: Evidentiary class of the document.
        constraints: "DEATH_CERTIFICATE | LETTERS_OF_AUTHORITY | COURT_ORDER"
      - name: reference_number
        type: string
        source: input
        description: Issuing authority's document number.
        constraints: non-empty, max 60 chars
      - name: issued_on
        type: string
        source: input
        description: Issue date of the document.
        constraints: ISO 8601 date YYYY-MM-DD
      - name: jurisdiction
        type: string
        source: input
        description: Two-letter state code of the issuing authority.
        constraints: exactly 2 uppercase letters
      - name: verification_status
        type: enum
        source: computed
        default: PENDING
        description: PENDING on creation; VERIFIED by CourtRegistrar VERIFY; REVOKED by CourtRegistrar REVOKE.
        constraints: "PENDING | VERIFIED | REVOKED"
      - name: verified_by_user_id
        type: string
        source: system
        default: null
        description: >-
          Opaque X-User-ID of the CourtRegistrar operator that verified the document. Audit only —
          not a foreign key and never compared against any entity id.
      - name: verified_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of verification.
      - name: revocation_reason
        type: string
        source: input
        default: null
        description: Reason text supplied with the REVOKE action.

  - name: Platform
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Provider display name (e.g. CloudVault).
        constraints: non-empty, max 120 chars
      - name: platform_type
        type: enum
        source: input
        description: Provider's primary business line.
        constraints: "FINANCIAL | EMAIL | CLOUD_STORAGE | SUBSCRIPTION | LOYALTY | SOCIAL"
      - name: status
        type: enum
        source: input
        default: PARTICIPATING
        description: Operational participation posture; SUSPENDED providers accept no new submissions.
        constraints: "PARTICIPATING | LIMITED | SUSPENDED"
      - name: supports_online_tool
        type: boolean
        source: input
        description: Whether the provider offers an online tool designation that can override a will.
      - name: supports_transfer
        type: boolean
        source: input
        description: Whether the provider will transfer an account to a beneficiary.
      - name: supports_memorialization
        type: boolean
        source: input
        description: Whether the provider will memorialize an account.
      - name: supports_deletion
        type: boolean
        source: input
        description: Whether the provider will delete an account on fiduciary request.
      - name: requires_court_order_for_content
        type: boolean
        source: input
        description: Whether content (as opposed to catalog) disclosure requires a VERIFIED COURT_ORDER document.
      - name: license_terminates_at_death
        type: boolean
        source: input
        description: Whether the provider's licence grant terminates at the account holder's death.
      - name: review_window_days
        type: integer
        source: input
        description: Length in days of the half-open review window a submitted PlatformRequest occupies on this provider.
        constraints: 1..90
      - name: form_code
        type: string
        source: input
        description: Provider-specific decedent-request form code a PlatformRequest must cite verbatim.
        constraints: non-empty, max 40 chars
      - name: refund_policy
        type: enum
        source: input
        description: Refund algorithm variant this provider applies to cancelled subscription terms.
        constraints: "PRORATA_DAILY | UNUSED_PERIOD | NONE"
      - name: transfer_fee_cents
        type: integer
        source: input
        description: Flat fee the provider deducts from a transferred asset's appraised value.
        constraints: ">= 0"
      - name: request_fee_cents
        type: integer
        source: input
        description: Administrative fee charged per approved PlatformRequest; feeds the estate-tax deduction.
        constraints: ">= 0"

  - name: AuthorityDirective
    parent: Estate
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: FK -> Estate.id; the estate whose decedent executed this directive.
      - name: platform_id
        type: string
        source: input
        default: null
        description: >-
          FK -> Platform.id; the provider this directive is bound to. Null means the directive is
          instrument-wide and matches by asset_category (or by nothing, i.e. catch-all).
      - name: directive_type
        type: enum
        source: input
        description: Source instrument of the directive; determines its precedence rank.
        constraints: "ONLINE_TOOL | WILL_PROVISION | TRUST_PROVISION"
      - name: scope
        type: enum
        source: input
        description: Disclosure scope the directive grants.
        constraints: "NONE | CATALOG_ONLY | CATALOG_AND_CONTENT"
      - name: asset_category
        type: enum
        source: input
        default: null
        description: Asset category this directive is limited to; null means every category.
        constraints: "FINANCIAL_ACCOUNT | EMAIL | CLOUD_STORAGE | SUBSCRIPTION | LOYALTY_PROGRAM | SOCIAL_PROFILE | null"
      - name: instrument_reference
        type: string
        source: input
        required: true
        description: "Citation of the instrument that carries this directive (online-tool screen name, will article, trust section)."
        constraints: "non-empty, max 80 chars"
      - name: executed_on
        type: string
        source: input
        description: Date the decedent executed the directive.
        constraints: ISO 8601 date YYYY-MM-DD
      - name: status
        type: enum
        source: computed
        default: RECORDED
        description: >-
          RECORDED on creation; flipped to SUPERSEDED when a newer directive with the same
          (estate_id, directive_type, platform_id, asset_category) tuple is recorded.
        constraints: "RECORDED | SUPERSEDED"
      - name: precedence_rank
        type: integer
        source: computed
        description: "1 for ONLINE_TOOL, 2 for WILL_PROVISION and TRUST_PROVISION; lower wins."
        constraints: 1 or 2

  - name: DigitalAsset
    parent: Estate
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: FK -> Estate.id; the estate that inventoried this account.
      - name: platform_id
        type: string
        source: input
        description: FK -> Platform.id; the provider hosting the account.
      - name: category
        type: enum
        source: input
        description: Inventory category of the account.
        constraints: "FINANCIAL_ACCOUNT | EMAIL | CLOUD_STORAGE | SUBSCRIPTION | LOYALTY_PROGRAM | SOCIAL_PROFILE"
      - name: account_handle
        type: string
        source: input
        description: Login handle or account number, unique per (estate_id, platform_id).
        constraints: non-empty, max 120 chars
      - name: quoted_value_cents
        type: integer
        source: input
        description: Provider's date-of-death value quote for the account, in cents.
        constraints: ">= 0"
      - name: loyalty_points
        type: integer
        source: input
        default: 0
        description: Loyalty point balance recorded for audit; does not enter any formula.
        constraints: ">= 0"
      - name: inventory_note
        type: string
        source: input
        default: null
        description: Free-text inventory annotation.
      - name: transferability
        type: enum
        source: computed
        description: Output of calculation asset_transferability_class; derived from category plus the provider's flags.
        constraints: "TRANSFERABLE | NON_TRANSFERABLE | LICENSE_TERMINATES_AT_DEATH"
      - name: transferability_reason
        type: enum
        source: computed
        description: Which clause of asset_transferability_class matched first.
        constraints: "CATEGORY_PERSONAL | CATEGORY_SUBSCRIPTION_LICENCE | PROVIDER_LICENCE_TERMINATES | PROVIDER_NO_TRANSFER | TRANSFERABLE_PROPERTY"
      - name: access_status
        type: enum
        source: computed
        default: UNVERIFIED
        description: First state dimension — how far disclosure has progressed for this account.
        constraints: "UNVERIFIED | CATALOG_DISCLOSED | CONTENT_DISCLOSED | ACCESS_REVOKED"
      - name: content_clamp_reason
        type: enum
        source: computed
        default: NONE
        description: Why a CATALOG_AND_CONTENT grant was clamped down to catalog for this account.
        constraints: "NONE | COURT_ORDER_REQUIRED | FINANCIAL_REQUIRES_ONLINE_TOOL"
      - name: disposition_status
        type: enum
        source: computed
        default: PENDING
        description: Second state dimension — how far account disposition has progressed. Independent of access_status.
        constraints: "PENDING | ELECTED | EXECUTED | PURGED"
      - name: subscription_billing_state
        type: enum
        source: computed
        default: NOT_APPLICABLE
        description: >-
          Denormalised mirror of the linked SubscriptionTerm.state — ACTIVE while the term is ACTIVE,
          CANCELLED once the term is CANCELLED, NOT_APPLICABLE when no term exists.
        constraints: "NOT_APPLICABLE | ACTIVE | CANCELLED"
      - name: appraised_value_cents
        type: integer
        source: computed
        default: null
        description: Output of calculation asset_appraised_value for the newest non-SUPERSEDED ValuationRun; null when unvalued.
      - name: appraised_basis
        type: enum
        source: computed
        default: null
        description: basis of the valuation run that produced appraised_value_cents.
        constraints: "DATE_OF_DEATH | ALTERNATE | null"
      - name: disclosed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which access_status first left UNVERIFIED.
      - name: disposed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which disposition_status entered EXECUTED or PURGED; cleared on REVERSE.

  - name: SubscriptionTerm
    parent: DigitalAsset
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: FK -> DigitalAsset.id; the SUBSCRIPTION-category account this billing term belongs to (at most one per asset).
      - name: term_start_date
        type: string
        source: input
        description: First day of the paid term, inclusive.
        constraints: ISO 8601 date YYYY-MM-DD
      - name: term_end_date
        type: string
        source: input
        description: Last day of the paid term, inclusive.
        constraints: "ISO 8601 date YYYY-MM-DD; must be >= term_start_date"
      - name: billing_interval
        type: enum
        source: input
        description: Billing cadence of the term.
        constraints: "MONTHLY | ANNUAL"
      - name: period_fee_cents
        type: integer
        source: input
        description: Amount actually paid for the whole term; the refundable pool.
        constraints: ">= 0"
      - name: auto_renew
        type: boolean
        source: input
        description: Whether the provider will auto-renew at term end.
      - name: term_days
        type: integer
        source: computed
        description: "(term_end_date - term_start_date) in days + 1 — the term is a CLOSED interval, both endpoints inclusive."
      - name: state
        type: enum
        source: computed
        default: ACTIVE
        description: >-
          ACTIVE on creation; CANCELLED when the asset's CancellationOrder is CONFIRMED;
          LAPSED when a grant-expiry sweep observes term_end_date strictly before the clock's date.
        constraints: "ACTIVE | CANCELLED | LAPSED"
      - name: cancelled_effective_date
        type: string
        source: computed
        default: null
        description: CancellationOrder.effective_date copied here when the order is CONFIRMED.
      - name: claimed_days_total
        type: integer
        source: computed
        default: 0
        description: Sum of claimed_days over RefundClaim rows on this term with status IN {FILED, PLATFORM_REVIEW, ESCALATED, CREDITED}.

  - name: PlatformRequest
    parent: Estate
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: FK -> Estate.id; the estate making the request.
      - name: platform_id
        type: string
        source: input
        description: FK -> Platform.id; the provider the request is addressed to.
      - name: death_certificate_document_id
        type: string
        source: input
        description: FK -> Document.id; must be a DEATH_CERTIFICATE on the same estate.
      - name: letters_document_id
        type: string
        source: input
        description: FK -> Document.id; must be a LETTERS_OF_AUTHORITY on the same estate.
      - name: request_type
        type: enum
        source: input
        description: What the fiduciary is asking the provider for.
        constraints: "CATALOG_ACCESS | CONTENT_ACCESS | DISPOSITION | CANCELLATION"
      - name: requested_scope
        type: enum
        source: input
        description: Disclosure scope the fiduciary asks for; the resolved scope may be narrower.
        constraints: "CATALOG_ONLY | CATALOG_AND_CONTENT"
      - name: platform_form_code
        type: string
        source: input
        description: Provider form code cited by the fiduciary; must equal Platform.form_code verbatim.
        constraints: non-empty, max 40 chars
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Cyclic request lifecycle state.
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | WITHDRAWN"
      - name: review_window_start
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the current submission; inclusive start of the half-open review window.
      - name: review_window_end
        type: datetime
        source: computed
        default: null
        description: review_window_start + Platform.review_window_days days; EXCLUSIVE end of the review window.
      - name: info_cycle_count
        type: integer
        source: computed
        default: 0
        description: Number of completed INFO_REQUESTED → SUBMITTED resubmission cycles.
      - name: decision
        type: enum
        source: input
        default: null
        description: Provider's terminal decision, supplied with the DECIDE action.
        constraints: "APPROVED | DENIED | null"
      - name: decision_note
        type: string
        source: input
        default: null
        description: Free-text note supplied with the DECIDE action.
      - name: missing_items
        type: string
        source: input
        default: null
        description: Items the provider asked for with the REQUEST_INFO action.
      - name: remediation_note
        type: string
        source: input
        default: null
        description: Fiduciary's note supplied with the RESUBMIT action.
      - name: withdrawal_reason
        type: string
        source: input
        default: null
        description: Reason supplied with the WITHDRAW action.
      - name: resolved_scope
        type: enum
        source: computed
        default: null
        description: Output of calculation platform_authority_precedence, frozen at DECIDE time.
        constraints: "NONE | CATALOG_ONLY | CATALOG_AND_CONTENT | null"
      - name: resolved_basis
        type: enum
        source: computed
        default: null
        description: Which precedence tier supplied resolved_scope.
        constraints: "ONLINE_TOOL | WILL_PROVISION | TRUST_PROVISION | STATUTORY_DEFAULT | null"
      - name: clamp_reason
        type: enum
        source: computed
        default: NONE
        description: Why resolved_scope is narrower than the controlling directive's scope.
        constraints: "NONE | COURT_ORDER_REQUIRED"

  - name: AuthorityGrant
    parent: Estate
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: FK -> Estate.id; the estate the grant empowers.
      - name: platform_id
        type: string
        source: input
        description: FK -> Platform.id; the provider the grant is good against.
      - name: platform_request_id
        type: string
        source: input
        description: FK -> PlatformRequest.id; the approved request that produced this grant.
      - name: granted_scope
        type: enum
        source: computed
        description: Scope copied from the approving PlatformRequest.resolved_scope.
        constraints: "CATALOG_ONLY | CATALOG_AND_CONTENT"
      - name: basis
        type: enum
        source: computed
        description: Precedence tier that supplied granted_scope.
        constraints: "ONLINE_TOOL | WILL_PROVISION | TRUST_PROVISION | STATUTORY_DEFAULT"
      - name: clamp_reason
        type: enum
        source: computed
        default: NONE
        description: Copied from the approving PlatformRequest.clamp_reason.
        constraints: "NONE | COURT_ORDER_REQUIRED"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: ACTIVE at creation; REVOKED by CourtRegistrar or by letters revocation; EXPIRED by a grant-expiry sweep.
        constraints: "ACTIVE | REVOKED | EXPIRED"
      - name: effective_from
        type: datetime
        source: computed
        description: Logical-clock instant of the approving decision.
      - name: expires_at
        type: datetime
        source: computed
        description: effective_from + GRANT_TERM_DAYS (90) days; a sweep at or after this instant expires the grant.
      - name: revocation_reason
        type: enum
        source: computed
        default: null
        description: Why the grant left ACTIVE.
        constraints: "REGISTRAR_ORDER | LETTERS_REVOKED | TERM_EXPIRED | null"

  - name: BeneficiaryDesignation
    parent: Estate
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: FK -> Estate.id; the estate whose value this beneficiary shares in.
      - name: beneficiary_name
        type: string
        source: input
        description: Beneficiary's legal name.
        constraints: non-empty, max 200 chars
      - name: relationship
        type: string
        source: input
        required: false
        description: "Free-text relationship of the beneficiary to the decedent; recorded for the distribution schedule only."
        constraints: "max 60 chars"
      - name: share_bp
        type: integer
        source: input
        description: Fractional share in basis points; all designations on one estate must total exactly 10000.
        constraints: 1..10000
      - name: source
        type: enum
        source: input
        description: Instrument that designates this beneficiary.
        constraints: "WILL | TRUST | PLATFORM_DESIGNATION"
      - name: allocation_rank
        type: integer
        source: computed
        description: >-
          1-based position of this designation among the estate's designations ordered by created_at ASC.
          The remainder cents of beneficiary_allocation_plan are handed out in this order.
      - name: planned_allocation_cents
        type: integer
        source: computed
        default: 0
        description: Output of calculation beneficiary_allocation_plan for the newest non-SUPERSEDED ValuationRun.
      - name: received_value_cents
        type: integer
        source: computed
        default: 0
        description: Sum of appraised values actually vested by EXECUTED TRANSFER elections naming this designation.

  - name: DispositionElection
    parent: DigitalAsset
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: FK -> DigitalAsset.id; the account being memorialized, deleted or transferred.
      - name: beneficiary_designation_id
        type: string
        source: input
        default: null
        description: >-
          FK -> BeneficiaryDesignation.id; required when election == TRANSFER, must be null for
          MEMORIALIZE and DELETE.
      - name: elected_by_fiduciary_id
        type: string
        source: system
        description: FK -> Fiduciary.id; resolved from the X-User-ID header of the electing Fiduciary.
      - name: countersigned_by_fiduciary_id
        type: string
        source: system
        default: null
        description: >-
          FK -> Fiduciary.id; resolved from the X-User-ID header of the countersigning Fiduciary.
          Must differ from elected_by_fiduciary_id (segregation of duties).
      - name: election
        type: enum
        source: input
        description: Disposition the fiduciary elects for the account.
        constraints: "MEMORIALIZE | DELETE | TRANSFER"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: >-
          DRAFT at creation for MEMORIALIZE and TRANSFER; PENDING_COUNTERSIGN at creation for DELETE.
          Both branches join at SUBMITTED.
        constraints: "DRAFT | PENDING_COUNTERSIGN | SUBMITTED | EXECUTED | REJECTED | REVERSED | SUPERSEDED"
      - name: election_note
        type: string
        source: input
        default: null
        description: Fiduciary's rationale recorded at election time.
      - name: attestation
        type: string
        source: input
        default: null
        description: Countersigning fiduciary's attestation text.
      - name: platform_confirmation_reference
        type: string
        source: input
        default: null
        description: Provider's confirmation reference supplied with EXECUTE.
      - name: rejection_reason
        type: string
        source: input
        default: null
        description: Provider's reason supplied with REJECT.
      - name: reversal_reason
        type: string
        source: input
        default: null
        description: Provider's reason supplied with REVERSE.
      - name: distributed_value_cents
        type: integer
        source: computed
        default: 0
        description: >-
          Value moved from Estate.undistributed_value_cents into the named beneficiary on EXECUTE of a
          TRANSFER; returned and reset to 0 on REVERSE.
      - name: executed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of EXECUTE; cleared on REVERSE.

  - name: CancellationOrder
    parent: DigitalAsset
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: FK -> DigitalAsset.id; the SUBSCRIPTION-category account to be cancelled.
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: PENDING when auto-created on disclosure; REQUESTED by the fiduciary; CONFIRMED or FAILED by the provider.
        constraints: "PENDING | REQUESTED | CONFIRMED | FAILED"
      - name: effective_date
        type: string
        source: input
        default: null
        description: Cancellation effective date supplied with REQUEST; must be on or after Estate.date_of_death.
      - name: platform_reference
        type: string
        source: input
        default: null
        description: Provider's cancellation reference supplied with CONFIRM.
      - name: auto_renew_stopped
        type: boolean
        source: input
        default: false
        description: Whether the provider confirmed that auto-renewal is stopped; supplied with CONFIRM.
      - name: failure_reason
        type: string
        source: input
        default: null
        description: Provider's reason supplied with FAIL.
      - name: refund_policy_snapshot
        type: enum
        source: computed
        description: >-
          Platform.refund_policy copied at order-creation time; the refund variant is selected from this
          snapshot, not from the provider's current flag.
        constraints: "PRORATA_DAILY | UNUSED_PERIOD | NONE"
      - name: requested_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of REQUEST.
      - name: confirmed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of CONFIRM.

  - name: RefundClaim
    parent: CancellationOrder
    common_fields: true
    fields:
      - name: cancellation_order_id
        type: string
        source: input
        description: FK -> CancellationOrder.id; the confirmed cancellation this claim pursues a refund for.
      - name: claimed_period_start
        type: string
        source: input
        description: First claimed day, inclusive.
        constraints: ISO 8601 date YYYY-MM-DD
      - name: claimed_period_end
        type: string
        source: input
        description: Last claimed day, inclusive.
        constraints: "ISO 8601 date YYYY-MM-DD; must be >= claimed_period_start"
      - name: pursuit_cost_cents
        type: integer
        source: input
        description: Out-of-pocket cost of pursuing this claim; feeds the estate-tax administrative deduction.
        constraints: ">= 0"
      - name: claimed_days
        type: integer
        source: computed
        description: "(claimed_period_end - claimed_period_start) in days + 1 — CLOSED interval, both endpoints inclusive."
      - name: method
        type: enum
        source: computed
        description: Refund variant selected from CancellationOrder.refund_policy_snapshot.
        constraints: "PRORATA_DAILY | UNUSED_PERIOD"
      - name: claimed_cents
        type: integer
        source: computed
        description: Output of calculation refund_entitlement.
      - name: credited_cents
        type: integer
        source: input
        default: 0
        description: Amount the provider actually credited, supplied with CREDIT; must not exceed claimed_cents.
      - name: status
        type: enum
        source: computed
        default: FILED
        description: Claim lifecycle state; DENIED and CHARGED_BACK release the claimed interval.
        constraints: "FILED | PLATFORM_REVIEW | ESCALATED | CREDITED | DENIED | CHARGED_BACK"
      - name: escalation_reason
        type: string
        source: input
        default: null
        description: Fiduciary's reason supplied with ESCALATE.
      - name: denial_reason
        type: string
        source: input
        default: null
        description: Provider's reason supplied with DENY.
      - name: chargeback_reason
        type: string
        source: input
        default: null
        description: Provider's reason supplied with CHARGE_BACK.

  - name: ValuationRun
    parent: Estate
    common_fields: true
    fields:
      - name: estate_id
        type: string
        source: input
        description: FK -> Estate.id; the estate valued by this run.
      - name: basis
        type: enum
        source: input
        description: Valuation basis; ALTERNATE requires the clock to have reached Estate.alternate_valuation_date.
        constraints: "DATE_OF_DEATH | ALTERNATE"
      - name: status
        type: enum
        source: computed
        default: COMPUTED
        description: COMPUTED at creation; FINALIZED by the FINALIZE action; SUPERSEDED when a newer run is created.
        constraints: "COMPUTED | FINALIZED | SUPERSEDED"
      - name: included_asset_count
        type: integer
        source: computed
        description: Number of DigitalAsset rows that entered the roll-up under this run's inclusion set.
      - name: gross_value_cents
        type: integer
        source: computed
        description: Output of calculation estate_valuation_rollup — sum of per-asset net appraised values.
      - name: deduction_cap_cents
        type: integer
        source: computed
        description: Tier cap selected from gross_value_cents (pre-deduction), never from taxable_value_cents.
      - name: admin_deduction_cents
        type: integer
        source: computed
        description: "min(deduction_cap_cents, actual administrative costs)."
      - name: taxable_value_cents
        type: integer
        source: computed
        description: "max(0, gross_value_cents - admin_deduction_cents)."
      - name: allocation_remainder_cents
        type: integer
        source: computed
        description: Cents left over after per-beneficiary flooring; handed out one cent at a time by allocation_rank.
      - name: finalized_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of FINALIZE.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Document — gates the whole administration; its REVOKE is the head of a
  # depth-4 transitive cascade.
  # ---------------------------------------------------------------------------
  - entity: Document
    shape: branching_with_revert
    state_field: verification_status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /documents/{document_id}/transitions {action: VERIFY}"
        actor: CourtRegistrar
        preconditions:
          - "document.verification_status == PENDING"
          - "estate.administration_phase != CLOSED"
        side_effects:
          - "sets verified_by_user_id = X-User-ID and verified_at = logical clock"
          - "when doc_type == LETTERS_OF_AUTHORITY: sets Fiduciary[document.fiduciary_id].letters_status = ISSUED (hop 1)"
          - "the letters_status change recomputes Estate.administration_phase via calculation estate_administration_phase (hop 2)"
          - "increments Document.version by 1; increments the mutated Fiduciary.version and Estate.version by 1"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /documents/{document_id}/transitions {action: REVOKE}"
        actor: CourtRegistrar
        preconditions:
          - "document.verification_status == VERIFIED"
          - "estate.administration_phase != CLOSED"
        side_effects:
          - "stores revocation_reason"
          - "hop 1 — when doc_type == LETTERS_OF_AUTHORITY: Fiduciary[document.fiduciary_id].letters_status = REVOKED"
          - "hop 2 — caused by hop 1: if the estate now has zero Fiduciary rows with letters_status == ISSUED, every AuthorityGrant of the estate with status == ACTIVE becomes REVOKED with revocation_reason = LETTERS_REVOKED, processed in created_at ASC order"
          - "hop 3 — caused by hop 2: for each grant revoked in hop 2, every DigitalAsset with that grant's estate_id and platform_id whose access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED} becomes ACCESS_REVOKED and content_clamp_reason resets to NONE, processed in created_at ASC order"
          - "hop 4 — caused by hop 3: Estate.disclosed_asset_count is recomputed and Estate.administration_phase is re-derived (INTAKE, because no letters are ISSUED)"
          - "increments the version of every mutated row by 1"
        note: >-
          When another Fiduciary of the estate still holds ISSUED letters, hop 2 does not fire and
          hops 3-4 therefore do not fire either — the cascade is conditional on the hop-1 outcome.
      - from: PENDING
        to: REVOKED
        trigger: "POST /documents/{document_id}/transitions {action: REVOKE}"
        actor: CourtRegistrar
        preconditions:
          - "document.verification_status == PENDING"
          - "estate.administration_phase != CLOSED"
        side_effects:
          - "stores revocation_reason; no cascade fires because the document never conferred anything"
          - "increments Document.version by 1"

  # ---------------------------------------------------------------------------
  # PlatformRequest — CYCLIC (UNDER_REVIEW → INFO_REQUESTED → SUBMITTED →
  # UNDER_REVIEW), capped at MAX_INFO_CYCLES resubmissions.
  # ---------------------------------------------------------------------------
  - entity: PlatformRequest
    shape: cyclic
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /platform-requests/{request_id}/transitions {action: SUBMIT}"
        actor: Fiduciary
        preconditions:
          - "request.status == DRAFT"
          - "Document[request.death_certificate_document_id].verification_status == VERIFIED"
          - "Document[request.letters_document_id].verification_status == VERIFIED"
          - "the Fiduciary named by Document[request.letters_document_id].fiduciary_id has letters_status == ISSUED"
          - "Platform[request.platform_id].status != SUSPENDED"
          - "request.platform_form_code == Platform[request.platform_id].form_code"
          - "when request.request_type == CONTENT_ACCESS: calculation platform_authority_precedence resolves to CATALOG_AND_CONTENT for this (estate, platform, request_type)"
          - "no other PlatformRequest with the same (estate_id, platform_id, request_type) and status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} occupies a half-open review window overlapping [clock, clock + Platform.review_window_days)"
        side_effects:
          - "sets review_window_start = logical clock and review_window_end = review_window_start + Platform.review_window_days days (EXCLUSIVE end)"
          - "increments PlatformRequest.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /platform-requests/{request_id}/transitions {action: START_REVIEW}"
        actor: PlatformCompliance
        preconditions:
          - "request.status == SUBMITTED"
          - "X-User-ID == request.platform_id"
        side_effects:
          - "increments PlatformRequest.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /platform-requests/{request_id}/transitions {action: REQUEST_INFO}"
        actor: PlatformCompliance
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID == request.platform_id"
        side_effects:
          - "stores missing_items; clears review_window_start and review_window_end (the provider stops occupying the window while it waits)"
          - "increments PlatformRequest.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /platform-requests/{request_id}/transitions {action: RESUBMIT}"
        actor: Fiduciary
        preconditions:
          - "request.status == INFO_REQUESTED"
          - "request.info_cycle_count < MAX_INFO_CYCLES (3)"
          - "the review-window non-overlap precondition of DRAFT→SUBMITTED holds again at the new clock position"
        side_effects:
          - "increments info_cycle_count by 1"
          - "stores remediation_note; re-opens the window: review_window_start = logical clock, review_window_end = start + Platform.review_window_days days"
          - "increments PlatformRequest.version by 1"
        note: "This edge closes the cycle UNDER_REVIEW → INFO_REQUESTED → SUBMITTED → UNDER_REVIEW."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /platform-requests/{request_id}/transitions {action: DECIDE, decision: APPROVED}"
        actor: PlatformCompliance
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID == request.platform_id"
          - "Platform[request.platform_id].status != SUSPENDED"
        side_effects:
          - "freezes resolved_scope, resolved_basis and clamp_reason from calculation platform_authority_precedence"
          - "hop 1 — creates an AuthorityGrant (status ACTIVE, granted_scope = resolved_scope, basis = resolved_basis, clamp_reason copied, effective_from = clock, expires_at = clock + GRANT_TERM_DAYS (90) days)"
          - "hop 2 — caused by hop 1: for every DigitalAsset with the grant's estate_id and platform_id whose access_status IN {UNVERIFIED, ACCESS_REVOKED}, processed in created_at ASC order, calculation asset_disclosure_level sets access_status and content_clamp_reason and stamps disclosed_at"
          - "hop 3 — caused by hop 2: for each asset whose access_status left UNVERIFIED in hop 2 with category == SUBSCRIPTION and no existing CancellationOrder, a CancellationOrder is created in PENDING with refund_policy_snapshot = Platform.refund_policy"
          - "hop 4 — caused by hops 2-3: Estate.disclosed_asset_count and Estate.open_cancellation_count are recomputed and Estate.administration_phase is re-derived"
          - "increments the version of every mutated row by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /platform-requests/{request_id}/transitions {action: DECIDE, decision: DENIED}"
        actor: PlatformCompliance
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID == request.platform_id"
        side_effects:
          - "stores decision_note; creates no AuthorityGrant; no asset changes state"
          - "increments PlatformRequest.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /platform-requests/{request_id}/transitions {action: WITHDRAW}"
        actor: Fiduciary
        preconditions: ["request.status IN {DRAFT, SUBMITTED, INFO_REQUESTED}"]
        side_effects:
          - "stores withdrawal_reason; clears the review window so it no longer blocks a new submission"
          - "increments PlatformRequest.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /platform-requests/{request_id}/transitions {action: WITHDRAW}"
        actor: Fiduciary
        preconditions: ["request.status IN {DRAFT, SUBMITTED, INFO_REQUESTED}"]
        side_effects:
          - "stores withdrawal_reason; clears review_window_start and review_window_end"
          - "increments PlatformRequest.version by 1"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /platform-requests/{request_id}/transitions {action: WITHDRAW}"
        actor: Fiduciary
        preconditions: ["request.status IN {DRAFT, SUBMITTED, INFO_REQUESTED}"]
        side_effects:
          - "stores withdrawal_reason"
          - "increments PlatformRequest.version by 1"

  # ---------------------------------------------------------------------------
  # DigitalAsset — PARALLEL state dimensions on one row. access_status is driven
  # by grants; disposition_status is driven by elections. Neither dimension is a
  # precondition of the other except where explicitly stated.
  # ---------------------------------------------------------------------------
  - entity: DigitalAsset
    shape: parallel
    state_fields: [access_status, disposition_status]
    initial_state: "access_status=UNVERIFIED; disposition_status=PENDING"
    terminal_states: ["disposition_status=PURGED"]
    transitions:
      - dimension: access_status
        from: UNVERIFIED
        to: CATALOG_DISCLOSED
        trigger: "system — hop 2 of PlatformRequest UNDER_REVIEW→APPROVED, when calculation asset_disclosure_level yields CATALOG_ONLY for this asset"
        actor: system
        preconditions:
          - "an AuthorityGrant with status == ACTIVE covers (asset.estate_id, asset.platform_id)"
          - "asset.access_status IN {UNVERIFIED, ACCESS_REVOKED}"
        side_effects:
          - "stamps disclosed_at; sets content_clamp_reason per asset_disclosure_level"
          - "bubbles up: Estate.disclosed_asset_count recomputed, Estate.administration_phase re-derived"
      - dimension: access_status
        from: UNVERIFIED
        to: CONTENT_DISCLOSED
        trigger: "system — hop 2 of PlatformRequest UNDER_REVIEW→APPROVED, when calculation asset_disclosure_level yields CATALOG_AND_CONTENT for this asset"
        actor: system
        preconditions:
          - "the covering AuthorityGrant has status == ACTIVE and granted_scope == CATALOG_AND_CONTENT"
          - "NOT (asset.category == FINANCIAL_ACCOUNT and grant.basis != ONLINE_TOOL)"
        side_effects:
          - "stamps disclosed_at; content_clamp_reason stays NONE"
          - "bubbles up: Estate.disclosed_asset_count recomputed, Estate.administration_phase re-derived"
      - dimension: access_status
        from: CATALOG_DISCLOSED
        to: CONTENT_DISCLOSED
        trigger: "system — hop 2 of a later PlatformRequest UNDER_REVIEW→APPROVED that widens the scope"
        actor: system
        preconditions:
          - "a newly created AuthorityGrant has granted_scope == CATALOG_AND_CONTENT and status == ACTIVE"
          - "NOT (asset.category == FINANCIAL_ACCOUNT and grant.basis != ONLINE_TOOL)"
        side_effects: ["content_clamp_reason reset to NONE; disclosed_at left unchanged"]
        note: >-
          Widening is the only forward move out of CATALOG_DISCLOSED; hop 2 of a CATALOG_ONLY approval
          skips assets already at CATALOG_DISCLOSED, so re-approval never narrows an asset.
      - dimension: access_status
        from: CATALOG_DISCLOSED
        to: ACCESS_REVOKED
        trigger: "system — hop 3 of Document VERIFIED→REVOKED, or AuthorityGrant ACTIVE→REVOKED, or ACTIVE→EXPIRED"
        actor: system
        preconditions: ["the covering AuthorityGrant left ACTIVE"]
        side_effects: ["content_clamp_reason reset to NONE; Estate.disclosed_asset_count recomputed; phase re-derived"]
      - dimension: access_status
        from: CONTENT_DISCLOSED
        to: ACCESS_REVOKED
        trigger: "system — hop 3 of Document VERIFIED→REVOKED, or AuthorityGrant ACTIVE→REVOKED, or ACTIVE→EXPIRED"
        actor: system
        preconditions: ["the covering AuthorityGrant left ACTIVE"]
        side_effects: ["content_clamp_reason reset to NONE; Estate.disclosed_asset_count recomputed; phase re-derived"]
      - dimension: disposition_status
        from: PENDING
        to: ELECTED
        trigger: "system — DispositionElection DRAFT→SUBMITTED"
        actor: system
        preconditions: ["asset.disposition_status == PENDING"]
        side_effects:
          - "Estate.assets_pending_disposition_count recomputed (count unchanged: PENDING and ELECTED are both pending)"
      - dimension: disposition_status
        from: ELECTED
        to: EXECUTED
        trigger: "system — DispositionElection SUBMITTED→EXECUTED with election IN {MEMORIALIZE, TRANSFER}"
        actor: system
        preconditions: ["asset.disposition_status == ELECTED"]
        side_effects:
          - "stamps disposed_at; Estate.assets_pending_disposition_count decremented and Estate.assets_disposed_count incremented; phase re-derived"
      - dimension: disposition_status
        from: ELECTED
        to: PURGED
        trigger: "system — DispositionElection SUBMITTED→EXECUTED with election == DELETE"
        actor: system
        preconditions: ["asset.disposition_status == ELECTED", "the election was countersigned by a second Fiduciary"]
        side_effects:
          - "stamps disposed_at; Estate.assets_pending_disposition_count decremented and Estate.assets_disposed_count incremented; phase re-derived"
        note: "PURGED is irreversible — no REVERSE edge exists out of it."
      - dimension: disposition_status
        from: ELECTED
        to: PENDING
        trigger: "system — DispositionElection SUBMITTED→REJECTED, or a superseding election is created"
        actor: system
        preconditions: ["asset.disposition_status == ELECTED"]
        side_effects: ["Estate counters recomputed; phase re-derived"]
      - dimension: disposition_status
        from: EXECUTED
        to: PENDING
        trigger: "system — DispositionElection EXECUTED→REVERSED"
        actor: system
        preconditions: ["asset.disposition_status == EXECUTED"]
        side_effects:
          - "clears disposed_at; Estate.assets_disposed_count decremented and Estate.assets_pending_disposition_count incremented; phase re-derived"
          - "for a TRANSFER: the distributed value is returned to Estate.undistributed_value_cents and removed from BeneficiaryDesignation.received_value_cents"

  # ---------------------------------------------------------------------------
  # AuthorityGrant
  # ---------------------------------------------------------------------------
  - entity: AuthorityGrant
    shape: linear_with_two_exits
    state_field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /authority-grants/{grant_id}/transitions {action: REVOKE}"
        actor: CourtRegistrar
        preconditions:
          - "grant.status == ACTIVE"
          - "estate.administration_phase != CLOSED"
        side_effects:
          - "sets revocation_reason = REGISTRAR_ORDER"
          - "hop 1 — every DigitalAsset with the grant's (estate_id, platform_id) whose access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED} becomes ACCESS_REVOKED, processed in created_at ASC order"
          - "hop 2 — caused by hop 1: Estate.disclosed_asset_count recomputed and Estate.administration_phase re-derived"
          - "increments the version of every mutated row by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /estates/{estate_id}/grant-expiry-sweeps (system epoch advance)"
        actor: EstateAdmin
        preconditions: ["grant.status == ACTIVE", "grant.expires_at <= logical clock"]
        side_effects:
          - "sets revocation_reason = TERM_EXPIRED"
          - "hop 1 — assets covered by the grant with access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED} become ACCESS_REVOKED"
          - "hop 2 — caused by hop 1: Estate.disclosed_asset_count recomputed and phase re-derived"
        note: "The sweep processes grants in created_at ASC order; the boundary is `expires_at <= clock` (inclusive)."

  # ---------------------------------------------------------------------------
  # DispositionElection — BRANCHING fork-join. DELETE detours through
  # PENDING_COUNTERSIGN; MEMORIALIZE and TRANSFER start at DRAFT. Both branches
  # join at SUBMITTED, and the EXECUTE side-effect set differs per election.
  # ---------------------------------------------------------------------------
  - entity: DispositionElection
    shape: branching
    state_field: status
    initial_state: "DRAFT for MEMORIALIZE and TRANSFER; PENDING_COUNTERSIGN for DELETE"
    terminal_states: [REJECTED, REVERSED, SUPERSEDED]
    transitions:
      - from: PENDING_COUNTERSIGN
        to: DRAFT
        trigger: "POST /disposition-elections/{election_id}/transitions {action: COUNTERSIGN}"
        actor: Fiduciary
        preconditions:
          - "election.status == PENDING_COUNTERSIGN"
          - "X-User-ID resolves to a Fiduciary whose estate_id == DigitalAsset[election.asset_id].estate_id and letters_status == ISSUED"
          - "X-User-ID != election.elected_by_fiduciary_id"
        side_effects:
          - "sets countersigned_by_fiduciary_id = X-User-ID; stores attestation"
          - "increments DispositionElection.version by 1"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /disposition-elections/{election_id}/transitions {action: SUBMIT}"
        actor: Fiduciary
        preconditions:
          - "election.status == DRAFT"
          - "when election.election == DELETE: countersigned_by_fiduciary_id is not null"
          - "DigitalAsset[election.asset_id].access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED}"
          - "DigitalAsset[election.asset_id].disposition_status == PENDING"
        side_effects:
          - "sets DigitalAsset.disposition_status = ELECTED (hop 1)"
          - "hop 2 — caused by hop 1: Estate.assets_pending_disposition_count recomputed and phase re-derived"
          - "increments DispositionElection.version, DigitalAsset.version and Estate.version by 1"
      - from: SUBMITTED
        to: EXECUTED
        trigger: "POST /disposition-elections/{election_id}/transitions {action: EXECUTE}"
        actor: PlatformCompliance
        preconditions:
          - "election.status == SUBMITTED"
          - "X-User-ID == DigitalAsset[election.asset_id].platform_id"
          - "Platform.status != SUSPENDED"
          - "the provider supports the elected disposition (supports_memorialization / supports_deletion / supports_transfer)"
          - "for TRANSFER: asset.transferability == TRANSFERABLE, asset.appraised_value_cents is not null, and a ValuationRun with status IN {COMPUTED, FINALIZED} exists on the estate"
          - "for TRANSFER: asset.appraised_value_cents <= Estate.undistributed_value_cents"
          - "for TRANSFER: BeneficiaryDesignation.received_value_cents + asset.appraised_value_cents <= BeneficiaryDesignation.planned_allocation_cents"
        side_effects:
          - "stamps executed_at and stores platform_confirmation_reference"
          - "MEMORIALIZE branch — hop 1: DigitalAsset.disposition_status = EXECUTED; hop 2: Estate.assets_disposed_count and assets_pending_disposition_count recomputed, phase re-derived. No value moves."
          - "DELETE branch — hop 1: DigitalAsset.disposition_status = PURGED and account_handle retained for audit; hop 2: Estate counters recomputed, phase re-derived. No value moves."
          - "TRANSFER branch — hop 1: DigitalAsset.disposition_status = EXECUTED and distributed_value_cents = asset.appraised_value_cents; hop 2 (caused by hop 1): BeneficiaryDesignation.received_value_cents += distributed_value_cents and Estate.undistributed_value_cents -= distributed_value_cents; hop 3 (caused by hop 2): Estate counters recomputed and phase re-derived"
          - "increments the version of every mutated row by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /disposition-elections/{election_id}/transitions {action: REJECT}"
        actor: PlatformCompliance
        preconditions: ["election.status == SUBMITTED", "X-User-ID == DigitalAsset[election.asset_id].platform_id"]
        side_effects:
          - "stores rejection_reason; DigitalAsset.disposition_status returns to PENDING; Estate counters recomputed"
          - "increments the version of every mutated row by 1"
      - from: EXECUTED
        to: REVERSED
        trigger: "POST /disposition-elections/{election_id}/transitions {action: REVERSE}"
        actor: PlatformCompliance
        preconditions:
          - "election.status == EXECUTED"
          - "X-User-ID == DigitalAsset[election.asset_id].platform_id"
          - "DigitalAsset[election.asset_id].disposition_status == EXECUTED (a PURGED asset can never be reversed)"
        side_effects:
          - "stores reversal_reason; clears executed_at"
          - "compensation — TRANSFER: BeneficiaryDesignation.received_value_cents -= distributed_value_cents, Estate.undistributed_value_cents += distributed_value_cents, then distributed_value_cents = 0"
          - "DigitalAsset.disposition_status returns to PENDING; Estate.assets_disposed_count and assets_pending_disposition_count recomputed; phase re-derived"
          - "invariant preserved: Estate.gross_digital_estate_cents == Estate.undistributed_value_cents + SUM(BeneficiaryDesignation.received_value_cents)"
          - "increments the version of every mutated row by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system — POST /digital-assets/{asset_id}/disposition-elections creates a newer election on the same asset"
        actor: system
        preconditions: ["election.status IN {DRAFT, PENDING_COUNTERSIGN, SUBMITTED}"]
        side_effects: ["DigitalAsset.disposition_status returns to PENDING when the superseded election had reached SUBMITTED"]
      - from: PENDING_COUNTERSIGN
        to: SUPERSEDED
        trigger: "system — POST /digital-assets/{asset_id}/disposition-elections creates a newer election on the same asset"
        actor: system
        preconditions: ["election.status IN {DRAFT, PENDING_COUNTERSIGN, SUBMITTED}"]
        side_effects: ["no asset-side change (the asset never left PENDING)"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system — POST /digital-assets/{asset_id}/disposition-elections creates a newer election on the same asset"
        actor: system
        preconditions: ["election.status IN {DRAFT, PENDING_COUNTERSIGN, SUBMITTED}"]
        side_effects: ["DigitalAsset.disposition_status returns to PENDING; Estate counters recomputed"]

  # ---------------------------------------------------------------------------
  # CancellationOrder — auto-created by disclosure, retryable after failure.
  # ---------------------------------------------------------------------------
  - entity: CancellationOrder
    shape: branching_with_retry
    state_field: status
    initial_state: PENDING
    terminal_states: [CONFIRMED]
    transitions:
      - from: PENDING
        to: REQUESTED
        trigger: "POST /cancellation-orders/{order_id}/transitions {action: REQUEST}"
        actor: Fiduciary
        preconditions:
          - "order.status IN {PENDING, FAILED}"
          - "DigitalAsset[order.asset_id].access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED}"
          - "effective_date >= Estate.date_of_death"
        side_effects:
          - "stores effective_date; stamps requested_at"
          - "increments CancellationOrder.version by 1"
      - from: FAILED
        to: REQUESTED
        trigger: "POST /cancellation-orders/{order_id}/transitions {action: REQUEST}"
        actor: Fiduciary
        preconditions:
          - "order.status IN {PENDING, FAILED}"
          - "DigitalAsset[order.asset_id].access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED}"
          - "effective_date >= Estate.date_of_death"
        side_effects:
          - "overwrites effective_date; clears failure_reason; stamps requested_at"
          - "increments CancellationOrder.version by 1"
        note: "Retry edge — FAILED is not terminal."
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /cancellation-orders/{order_id}/transitions {action: CONFIRM}"
        actor: PlatformCompliance
        preconditions:
          - "order.status == REQUESTED"
          - "X-User-ID == DigitalAsset[order.asset_id].platform_id"
        side_effects:
          - "stores platform_reference and auto_renew_stopped; stamps confirmed_at"
          - "hop 1 — the SubscriptionTerm of order.asset_id (if any) becomes state = CANCELLED, auto_renew = false, cancelled_effective_date = order.effective_date"
          - "hop 2 — caused by hop 1: DigitalAsset.subscription_billing_state is reconciled to CANCELLED"
          - "hop 3 — caused by hops 1-2: Estate.open_cancellation_count and Estate.cancelled_subscription_count are recomputed"
          - "increments the version of every mutated row by 1"
      - from: REQUESTED
        to: FAILED
        trigger: "POST /cancellation-orders/{order_id}/transitions {action: FAIL}"
        actor: PlatformCompliance
        preconditions: ["order.status == REQUESTED", "X-User-ID == DigitalAsset[order.asset_id].platform_id"]
        side_effects:
          - "stores failure_reason; the SubscriptionTerm stays ACTIVE and auto_renew is untouched"
          - "increments CancellationOrder.version by 1"

  # ---------------------------------------------------------------------------
  # RefundClaim — branching with an escalation path and a compensating exit.
  # ---------------------------------------------------------------------------
  - entity: RefundClaim
    shape: branching_with_compensation
    state_field: status
    initial_state: FILED
    terminal_states: [DENIED, CHARGED_BACK]
    transitions:
      - from: FILED
        to: PLATFORM_REVIEW
        trigger: "POST /refund-claims/{claim_id}/transitions {action: START_REVIEW}"
        actor: PlatformCompliance
        preconditions: ["claim.status == FILED", "X-User-ID == the platform_id of the claim's asset"]
        side_effects: ["increments RefundClaim.version by 1"]
      - from: PLATFORM_REVIEW
        to: ESCALATED
        trigger: "POST /refund-claims/{claim_id}/transitions {action: ESCALATE}"
        actor: Fiduciary
        preconditions: ["claim.status == PLATFORM_REVIEW"]
        side_effects: ["stores escalation_reason", "increments RefundClaim.version by 1"]
      - from: PLATFORM_REVIEW
        to: CREDITED
        trigger: "POST /refund-claims/{claim_id}/transitions {action: CREDIT, credited_cents: N}"
        actor: PlatformCompliance
        preconditions:
          - "claim.status IN {PLATFORM_REVIEW, ESCALATED}"
          - "X-User-ID == the platform_id of the claim's asset"
          - "credited_cents <= claim.claimed_cents"
        side_effects:
          - "stores credited_cents"
          - "hop 1 — Estate.refund_recovered_cents += credited_cents"
          - "increments RefundClaim.version and Estate.version by 1"
      - from: ESCALATED
        to: CREDITED
        trigger: "POST /refund-claims/{claim_id}/transitions {action: CREDIT, credited_cents: N}"
        actor: PlatformCompliance
        preconditions:
          - "claim.status IN {PLATFORM_REVIEW, ESCALATED}"
          - "X-User-ID == the platform_id of the claim's asset"
          - "credited_cents <= claim.claimed_cents"
        side_effects:
          - "stores credited_cents; Estate.refund_recovered_cents += credited_cents"
          - "increments RefundClaim.version and Estate.version by 1"
      - from: PLATFORM_REVIEW
        to: DENIED
        trigger: "POST /refund-claims/{claim_id}/transitions {action: DENY}"
        actor: PlatformCompliance
        preconditions: ["claim.status IN {PLATFORM_REVIEW, ESCALATED}", "X-User-ID == the platform_id of the claim's asset"]
        side_effects:
          - "stores denial_reason"
          - "releases the claimed interval: SubscriptionTerm.claimed_days_total is recomputed without this claim, so the same days may be claimed again"
          - "increments RefundClaim.version and SubscriptionTerm.version by 1"
      - from: ESCALATED
        to: DENIED
        trigger: "POST /refund-claims/{claim_id}/transitions {action: DENY}"
        actor: PlatformCompliance
        preconditions: ["claim.status IN {PLATFORM_REVIEW, ESCALATED}", "X-User-ID == the platform_id of the claim's asset"]
        side_effects:
          - "stores denial_reason; releases the claimed interval as above"
          - "increments RefundClaim.version and SubscriptionTerm.version by 1"
      - from: CREDITED
        to: CHARGED_BACK
        trigger: "POST /refund-claims/{claim_id}/transitions {action: CHARGE_BACK}"
        actor: PlatformCompliance
        preconditions: ["claim.status == CREDITED", "X-User-ID == the platform_id of the claim's asset"]
        side_effects:
          - "stores chargeback_reason"
          - "compensation — Estate.refund_recovered_cents -= claim.credited_cents"
          - "releases the claimed interval: SubscriptionTerm.claimed_days_total recomputed without this claim"
          - "invariant preserved: Estate.refund_recovered_cents == SUM(RefundClaim.credited_cents WHERE status == CREDITED) over the estate's claims"
          - "increments RefundClaim.version, SubscriptionTerm.version and Estate.version by 1"

  # ---------------------------------------------------------------------------
  # Estate — COMPOUND: administration_phase is derived from child counts; CLOSED
  # is the one sticky terminal that suppresses the derivation.
  # ---------------------------------------------------------------------------
  - entity: Estate
    shape: compound
    state_field: administration_phase
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: AUTHORIZED
        trigger: "system — recomputation of calculation estate_administration_phase after any child mutation"
        actor: system
        preconditions:
          - "a Document with doc_type == DEATH_CERTIFICATE and verification_status == VERIFIED exists on the estate"
          - "at least one Fiduciary of the estate has letters_status == ISSUED"
          - "disclosed_asset_count == 0"
        side_effects: ["increments Estate.version by 1"]
      - from: AUTHORIZED
        to: DISCLOSURE
        trigger: "system — recomputation after hop 4 of PlatformRequest UNDER_REVIEW→APPROVED"
        actor: system
        preconditions: ["disclosed_asset_count >= 1", "assets_disposed_count < inventory_total_count"]
        side_effects: ["increments Estate.version by 1"]
      - from: DISCLOSURE
        to: WIND_DOWN
        trigger: "system — recomputation after a DispositionElection EXECUTE"
        actor: system
        preconditions: ["inventory_total_count >= 1", "assets_disposed_count == inventory_total_count"]
        side_effects: ["increments Estate.version by 1"]
      - from: WIND_DOWN
        to: DISCLOSURE
        trigger: "system — recomputation after a DispositionElection REVERSE or REJECT returns an asset to PENDING"
        actor: system
        preconditions: ["assets_disposed_count < inventory_total_count", "disclosed_asset_count >= 1"]
        side_effects: ["increments Estate.version by 1"]
        note: "Revert edge — the compound phase is not monotone; a reversal walks the estate back."
      - from: AUTHORIZED
        to: INTAKE
        trigger: "system — recomputation after hop 2 of Document VERIFIED→REVOKED"
        actor: system
        preconditions: ["no Fiduciary of the estate has letters_status == ISSUED, or no VERIFIED DEATH_CERTIFICATE exists"]
        side_effects: ["increments Estate.version by 1"]
      - from: DISCLOSURE
        to: INTAKE
        trigger: "system — recomputation after hop 4 of Document VERIFIED→REVOKED"
        actor: system
        preconditions: ["no Fiduciary of the estate has letters_status == ISSUED"]
        side_effects: ["increments Estate.version by 1"]
      - from: WIND_DOWN
        to: CLOSED
        trigger: "POST /estates/{estate_id}/close"
        actor: Fiduciary
        preconditions:
          - "estate.administration_phase == WIND_DOWN"
          - "the newest non-SUPERSEDED ValuationRun has status == FINALIZED"
          - "every DigitalAsset of the estate has disposition_status IN {EXECUTED, PURGED}"
          - "every CancellationOrder of the estate's assets has status IN {CONFIRMED, FAILED}"
          - "every RefundClaim of the estate has status IN {CREDITED, DENIED, CHARGED_BACK}"
        side_effects:
          - "stamps closed_at and stores closing_statement; administration_phase pinned to CLOSED and the derivation is thereafter suppressed"
          - "increments Estate.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: valuation-run-create-stale-estate
    parent_entity: Estate
    write_endpoint: "POST /estates/{estate_id}/valuation-runs"
    occ_field: "expected_estate_version"
    description: |
      Creating a ValuationRun against an Estate whose version has advanced since the client last
      observed it is rejected. A new run legitimately supersedes the prior COMPUTED run and rewrites
      every mirrored valuation field on the estate plus every beneficiary's planned allocation, so a
      client working from a stale estate view would silently overwrite a roll-up computed from an
      inventory it never saw.
    error_id: ERR_STALE_ESTATE_VERSION
    http_status: 412

  - rule_id: disposition-election-create-stale-asset
    parent_entity: DigitalAsset
    write_endpoint: "POST /digital-assets/{asset_id}/disposition-elections"
    occ_field: "expected_asset_version"
    description: |
      Creating a DispositionElection against a DigitalAsset whose version has advanced since the
      client last observed it is rejected. A new election legitimately supersedes the asset's prior
      non-terminal election, so the loser would destroy an election recorded against an asset state
      (transferability, appraised value, access_status) it never observed.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  # 1. Authority precedence — the RUFADAA-style ordering that governs the whole
  #    task. Multi-source resolution with a specificity tie-break and a
  #    court-order clamp.
  # ---------------------------------------------------------------------------
  - name: platform_authority_precedence
    description: |
      Resolves the scope a fiduciary may be granted for one (estate, platform, asset_category)
      triple by ranking every RECORDED AuthorityDirective of the estate and then clamping the
      winner against the platform's own policy. This is the precedence order named in the
      scenario: an online-tool designation outranks will and trust provisions, which outrank the
      statutory default.
    trigger: >-
      GET /estates/{estate_id}/authority-resolution (read-only projection), and again inside
      POST /platform-requests/{request_id}/transitions on SUBMIT (as a precondition for
      CONTENT_ACCESS) and on DECIDE with decision APPROVED (to freeze resolved_scope,
      resolved_basis and clamp_reason onto the request and the created AuthorityGrant).
    inputs:
      - "AuthorityDirective rows of the estate with status == RECORDED"
      - "each directive's directive_type, precedence_rank, platform_id, asset_category, scope, created_at"
      - "Platform.status, Platform.supports_online_tool, Platform.requires_court_order_for_content"
      - "Document rows of the estate with doc_type == COURT_ORDER and verification_status == VERIFIED"
    algorithm: priority_resolution
    formula: |
      # ---- step 0: platform gate -------------------------------------------------
      if Platform.status == SUSPENDED:
          return { resolved_scope: NONE,
                   resolved_basis: STATUTORY_DEFAULT,
                   clamp_reason: NONE,
                   controlling_directive_id: null }

      # ---- step 1: candidate set -------------------------------------------------
      # A directive applies when BOTH of these hold:
      #   * platform match : directive.platform_id is null (all platforms)
      #                      OR directive.platform_id == target platform_id
      #   * category match : directive.asset_category is null (all categories)
      #                      OR directive.asset_category == target asset_category
      # When the caller supplies no asset_category, only directives with a null
      # asset_category are candidates.
      candidates = [ d for d in estate.authority_directives
                     if d.status == RECORDED
                     and (d.platform_id is null or d.platform_id == platform_id)
                     and (d.asset_category is null or d.asset_category == asset_category) ]

      # An ONLINE_TOOL directive is only honoured when the platform actually offers
      # an online tool; otherwise it is dropped from the candidate set entirely and
      # the will/trust layer below it takes over.
      candidates = [ d for d in candidates
                     if not (d.directive_type == ONLINE_TOOL
                             and Platform.supports_online_tool == false) ]

      if candidates is empty:
          winner = null                       # statutory default
      else:
          # ---- step 2: sort ------------------------------------------------------
          # (a) precedence_rank ASC       — 1 = ONLINE_TOOL, 2 = WILL_PROVISION / TRUST_PROVISION
          # (b) specificity_score DESC    — see below
          # (c) created_at ASC            — the earliest recorded directive wins a full tie
          #                                 (never id, never random)
          #
          #   specificity_score = 2 when directive.platform_id is not null
          #                     = 1 when directive.platform_id is null
          #                            and directive.asset_category is not null
          #                     = 0 when both are null (catch-all)
          winner = sort(candidates, key=(precedence_rank ASC,
                                         specificity_score DESC,
                                         created_at ASC))[0]

      # ---- step 3: base scope ----------------------------------------------------
      if winner is null:
          base_scope = CATALOG_ONLY               # STATUTORY_DEFAULT
          basis      = STATUTORY_DEFAULT
      else:
          base_scope = winner.scope               # NONE | CATALOG_ONLY | CATALOG_AND_CONTENT
          basis      = { ONLINE_TOOL:    ONLINE_TOOL,
                         WILL_PROVISION: WILL_PROVISION,
                         TRUST_PROVISION: TRUST_PROVISION }[winner.directive_type]

      # ---- step 4: court-order clamp --------------------------------------------
      clamp_reason = NONE
      if base_scope == CATALOG_AND_CONTENT and Platform.requires_court_order_for_content:
          has_order = exists Document where estate_id == estate.id
                                       and doc_type == COURT_ORDER
                                       and verification_status == VERIFIED
          if not has_order:
              base_scope   = CATALOG_ONLY
              clamp_reason = COURT_ORDER_REQUIRED

      return { resolved_scope: base_scope,
               resolved_basis: basis,
               clamp_reason: clamp_reason,
               controlling_directive_id: winner.id if winner else null }
    constants:
      PRECEDENCE_RANK_ONLINE_TOOL: 1
      PRECEDENCE_RANK_WILL_PROVISION: 2
      PRECEDENCE_RANK_TRUST_PROVISION: 2
      STATUTORY_DEFAULT_SCOPE: CATALOG_ONLY
    precision: "integer ranks; no rounding"
    variants:
      - name: online_tool_controls
        when: "a RECORDED ONLINE_TOOL directive applies and the platform supports_online_tool"
        difference: "its scope wins outright even when a will provision grants a wider scope"
      - name: will_or_trust_controls
        when: "no honourable ONLINE_TOOL directive applies but a WILL_PROVISION or TRUST_PROVISION does"
        difference: "rank 2 layer decides; specificity then created_at ASC breaks a WILL-vs-TRUST tie"
      - name: statutory_default
        when: "the candidate set is empty"
        difference: "CATALOG_ONLY with basis STATUTORY_DEFAULT — never content"

  # ---------------------------------------------------------------------------
  # 2. Content-versus-catalog clamp at the individual asset level.
  # ---------------------------------------------------------------------------
  - name: asset_disclosure_level
    description: |
      Converts a granted scope into the access_status of one DigitalAsset. This is the
      content-versus-catalog distinction from the scenario: a fiduciary gets the catalog
      (who, when, with whom) by default, and the content of communications only with an
      explicit consent basis.
    trigger: "system — hop 2 of PlatformRequest UNDER_REVIEW→APPROVED, once per covered asset in created_at ASC order"
    inputs:
      - "AuthorityGrant.granted_scope, AuthorityGrant.basis"
      - "DigitalAsset.category, DigitalAsset.access_status"
    algorithm: threshold
    formula: |
      if grant.granted_scope == NONE:
          return { access_status: UNVERIFIED, content_clamp_reason: NONE }   # no change

      if grant.granted_scope == CATALOG_ONLY:
          return { access_status: CATALOG_DISCLOSED,
                   content_clamp_reason: (COURT_ORDER_REQUIRED
                                          if grant.clamp_reason == COURT_ORDER_REQUIRED
                                          else NONE) }

      # granted_scope == CATALOG_AND_CONTENT
      # A financial account's content (statements, transaction detail) needs a
      # consent basis specific to that account: only an online-tool designation
      # qualifies. A will or trust provision, or the statutory default, gets the
      # catalog only.
      if asset.category == FINANCIAL_ACCOUNT and grant.basis != ONLINE_TOOL:
          return { access_status: CATALOG_DISCLOSED,
                   content_clamp_reason: FINANCIAL_REQUIRES_ONLINE_TOOL }

      return { access_status: CONTENT_DISCLOSED, content_clamp_reason: NONE }
    constants:
      CONTENT_ELIGIBLE_BASES_FOR_FINANCIAL: [ONLINE_TOOL]
    precision: "enum result; no rounding"

  # ---------------------------------------------------------------------------
  # 3. Transferable vs non-transferable, including licences that die with the
  #    account holder. First-match-wins ordered rule chain.
  # ---------------------------------------------------------------------------
  - name: asset_transferability_class
    description: |
      Classifies an asset as TRANSFERABLE, NON_TRANSFERABLE or LICENSE_TERMINATES_AT_DEATH by
      walking an ordered rule chain top-down and stopping at the first match. Only TRANSFERABLE
      assets carry value into the estate roll-up and only they may be elected for TRANSFER.
    trigger: >-
      POST /estates/{estate_id}/digital-assets (at creation) and
      POST /digital-assets/{asset_id}/transferability-reviews (re-classification after a
      Platform PATCH changed supports_transfer or license_terminates_at_death)
    inputs:
      - "DigitalAsset.category"
      - "Platform.license_terminates_at_death, Platform.supports_transfer, Platform.platform_type"
    algorithm: ordered_rule_chain
    formula: |
      # first match wins; the order is normative
      rule 1: if asset.category IN {EMAIL, SOCIAL_PROFILE}
                 -> (NON_TRANSFERABLE, CATEGORY_PERSONAL)
      rule 2: if asset.category == SUBSCRIPTION
                 -> (LICENSE_TERMINATES_AT_DEATH, CATEGORY_SUBSCRIPTION_LICENCE)
      rule 3: if asset.category == CLOUD_STORAGE and Platform.license_terminates_at_death
                 -> (LICENSE_TERMINATES_AT_DEATH, PROVIDER_LICENCE_TERMINATES)
      rule 4: if asset.category == LOYALTY_PROGRAM and Platform.supports_transfer == false
                 -> (LICENSE_TERMINATES_AT_DEATH, PROVIDER_LICENCE_TERMINATES)
      rule 5: if Platform.supports_transfer == false
                 -> (NON_TRANSFERABLE, PROVIDER_NO_TRANSFER)
      rule 6: otherwise
                 -> (TRANSFERABLE, TRANSFERABLE_PROPERTY)

      # Note the ordering consequence: a SUBSCRIPTION asset on a platform with
      # supports_transfer == false stops at rule 2 with reason
      # CATEGORY_SUBSCRIPTION_LICENCE, never reaching rule 5's PROVIDER_NO_TRANSFER.
      # A CLOUD_STORAGE asset on a platform with license_terminates_at_death == false
      # and supports_transfer == false stops at rule 5, not rule 3.
    constants:
      NON_TRANSFERABLE_CATEGORIES: [EMAIL, SOCIAL_PROFILE]
      LICENCE_CATEGORIES: [SUBSCRIPTION]
    precision: "enum result; no rounding"

  # ---------------------------------------------------------------------------
  # 4. DUAL VARIANT #1 — per-asset appraisal on two statutory valuation dates.
  # ---------------------------------------------------------------------------
  - name: asset_appraised_value
    description: |
      Appraises one TRANSFERABLE, disclosed DigitalAsset in cents. The DATE_OF_DEATH variant
      takes the quoted value as-is; the ALTERNATE variant (six months after death) applies a
      category-specific monthly decay before the transfer fee is netted out. Both variants net
      the platform's transfer fee and floor at zero.
    trigger: "system — once per included asset inside POST /estates/{estate_id}/valuation-runs"
    inputs:
      - "DigitalAsset.quoted_value_cents, DigitalAsset.category, DigitalAsset.transferability, DigitalAsset.access_status"
      - "Platform.transfer_fee_cents"
      - "ValuationRun.basis"
    algorithm: decay_function
    formula: |
      # ---- inclusion set (identical for both variants) ---------------------------
      include asset iff asset.transferability == TRANSFERABLE
                    and asset.access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED}
      # NON_TRANSFERABLE and LICENSE_TERMINATES_AT_DEATH assets contribute 0 and are
      # not counted in included_asset_count. An UNVERIFIED or ACCESS_REVOKED asset is
      # excluded even when TRANSFERABLE.

      # ---- gross ----------------------------------------------------------------
      if basis == DATE_OF_DEATH:
          gross_cents = asset.quoted_value_cents

      if basis == ALTERNATE:
          decay_bp = DECAY_BP_PER_MONTH[asset.category] * ALTERNATE_VALUATION_MONTHS
          gross_cents = round_half_up(asset.quoted_value_cents * (10000 - decay_bp) / 10000)

      # ---- net ------------------------------------------------------------------
      net_cents = max(0, gross_cents - Platform.transfer_fee_cents)

      asset.appraised_value_cents = net_cents
      asset.appraised_basis       = basis
    constants:
      ALTERNATE_VALUATION_MONTHS: 6
      DECAY_BP_PER_MONTH:
        FINANCIAL_ACCOUNT: 0
        EMAIL: 0
        SUBSCRIPTION: 0
        CLOUD_STORAGE: 50
        LOYALTY_PROGRAM: 150
        SOCIAL_PROFILE: 200
    precision: "integer cents; round_half_up on the decay multiplication only; net floored at 0"
    variants:
      - name: date_of_death
        when: "ValuationRun.basis == DATE_OF_DEATH"
        difference: "no decay factor at all — gross equals quoted_value_cents exactly"
      - name: alternate
        when: "ValuationRun.basis == ALTERNATE"
        difference: >-
          gross is multiplied by (10000 - DECAY_BP_PER_MONTH[category] * 6) / 10000 and
          round_half_up'd before the transfer fee is netted; for a CLOUD_STORAGE asset with
          quoted_value_cents == 400033 and transfer_fee_cents == 0 the two variants are
          400033 (DATE_OF_DEATH) and 388032 (ALTERNATE), a delta of 12001 cents.

  # ---------------------------------------------------------------------------
  # 5. Estate roll-up with a TIERED administrative-expense deduction cap.
  # ---------------------------------------------------------------------------
  - name: estate_valuation_rollup
    description: |
      Sums the appraised assets into the gross digital estate, deducts allowable administration
      costs capped by a gross-value tier, and produces the taxable digital estate for estate-tax
      purposes. The tier is selected on the GROSS value, before the deduction is applied — the
      deduction never re-selects the tier.
    trigger: "POST /estates/{estate_id}/valuation-runs, after every included asset has been appraised"
    inputs:
      - "appraised_value_cents of every included DigitalAsset"
      - "request_fee_cents of every PlatformRequest of the estate with status == APPROVED"
      - "pursuit_cost_cents of every RefundClaim of the estate (any status)"
    algorithm: tiered_pricing
    formula: |
      gross_value_cents = SUM(asset.appraised_value_cents for asset in included_assets)
      included_asset_count = COUNT(included_assets)

      # ---- tier selection is keyed on GROSS, not on the post-deduction value -----
      if gross_value_cents < 500000:
          deduction_cap_cents = 25000
      elif gross_value_cents < 5000000:
          deduction_cap_cents = 150000
      else:
          deduction_cap_cents = 400000

      claimed_costs_cents = SUM(pr.request_fee_cents
                                for pr in estate.platform_requests
                                if pr.status == APPROVED)
                          + SUM(rc.pursuit_cost_cents
                                for rc in estate.refund_claims)

      admin_deduction_cents = min(deduction_cap_cents, claimed_costs_cents)
      taxable_value_cents   = max(0, gross_value_cents - admin_deduction_cents)

      # mirrored onto the Estate row
      estate.gross_digital_estate_cents = gross_value_cents
      estate.admin_deduction_cents      = admin_deduction_cents
      estate.taxable_digital_estate_cents = taxable_value_cents
      estate.undistributed_value_cents  = gross_value_cents
                                          - SUM(bd.received_value_cents for bd in estate.beneficiary_designations)
    constants:
      ADMIN_DEDUCTION_CAP_BY_TIER:
        - { gross_lt: 500000, cap_cents: 25000 }
        - { gross_lt: 5000000, cap_cents: 150000 }
        - { gross_gte: 5000000, cap_cents: 400000 }
      TIER_1_UPPER_EXCLUSIVE_CENTS: 500000
      TIER_2_UPPER_EXCLUSIVE_CENTS: 5000000
    precision: "integer cents; no rounding (sums and mins only)"

  # ---------------------------------------------------------------------------
  # 6. Beneficiary allocation — FLOOR THEN LARGEST-RANK-FIRST REMAINDER.
  # ---------------------------------------------------------------------------
  - name: beneficiary_allocation_plan
    description: |
      Splits the taxable digital estate's distributable pool across the estate's
      BeneficiaryDesignation rows by basis-point share. Each beneficiary first receives the FLOOR
      of its exact share; the leftover cents are then handed out one cent at a time in
      allocation_rank order. Rounding each share independently is explicitly wrong.
    trigger: "POST /estates/{estate_id}/valuation-runs, after estate_valuation_rollup has produced the gross value"
    inputs:
      - "ValuationRun.gross_value_cents (the distributable pool)"
      - "BeneficiaryDesignation.share_bp and allocation_rank for every designation of the estate"
    algorithm: waterfall_allocation
    formula: |
      pool_cents = valuation_run.gross_value_cents
      designations = sort(estate.beneficiary_designations, key=(created_at ASC))
      # allocation_rank is 1-based over that same created_at ASC order

      # ---- pass 1: floors --------------------------------------------------------
      for d in designations:
          d.planned_allocation_cents = floor(pool_cents * d.share_bp / 10000)

      allocated = SUM(d.planned_allocation_cents for d in designations)
      remainder_cents = pool_cents - allocated        # 0 <= remainder < count(designations)

      # ---- pass 2: one cent at a time, by allocation_rank ASC --------------------
      for d in designations ordered by allocation_rank ASC:
          if remainder_cents == 0: break
          d.planned_allocation_cents += 1
          remainder_cents -= 1

      valuation_run.allocation_remainder_cents = pool_cents - allocated   # pre-distribution leftover

      # WRONG alternative that must not be implemented:
      #   d.planned_allocation_cents = round_half_up(pool_cents * d.share_bp / 10000)
      # For pool_cents == 400033 and share_bp 3334 / 3333 / 3333 in creation order the
      # two orders diverge:
      #   floor-then-remainder : 133372 / 133331 / 133330   (remainder 2 -> ranks 1 and 2)
      #   round-half-up-each   : 133371 / 133331 / 133331
      # Both total 400033, so only the per-beneficiary values expose the difference.
    constants:
      TOTAL_SHARE_BP: 10000
    precision: "integer cents; FLOOR per share, then +1 cent per rank until the remainder is exhausted"

  # ---------------------------------------------------------------------------
  # 7. DUAL VARIANT #2 — subscription refund entitlement.
  # ---------------------------------------------------------------------------
  - name: refund_entitlement
    description: |
      Computes the cents a RefundClaim may claim for an unused stretch of a cancelled
      subscription term. The method comes from the platform's refund_policy as snapshotted onto
      the CancellationOrder, so a later Platform PATCH cannot retroactively change an open claim.
    trigger: "POST /cancellation-orders/{order_id}/refund-claims"
    inputs:
      - "CancellationOrder.refund_policy_snapshot"
      - "SubscriptionTerm.period_fee_cents, SubscriptionTerm.term_days"
      - "RefundClaim.claimed_period_start, RefundClaim.claimed_period_end"
    algorithm: threshold
    formula: |
      # the claimed interval is CLOSED on both ends
      claimed_days = (claimed_period_end - claimed_period_start).days + 1

      if refund_policy_snapshot == NONE:
          reject with ERR_REFUND_NOT_OFFERED     # no claim may be filed at all

      if refund_policy_snapshot == PRORATA_DAILY:
          claimed_cents = round_half_up(term.period_fee_cents * claimed_days / term.term_days)

      if refund_policy_snapshot == UNUSED_PERIOD:
          whole_months  = floor(claimed_days / DAYS_PER_WHOLE_MONTH)      # 30
          billable_days = whole_months * DAYS_PER_WHOLE_MONTH
          claimed_cents = round_half_up(term.period_fee_cents * billable_days / term.term_days)
          # a claim shorter than 30 days yields 0 under this policy while
          # PRORATA_DAILY would yield a positive amount

      claim.method        = refund_policy_snapshot
      claim.claimed_days  = claimed_days
      claim.claimed_cents = claimed_cents
    constants:
      DAYS_PER_WHOLE_MONTH: 30
      REFUND_MIN_CLAIM_DAYS: 7
    precision: "integer cents; round_half_up on the single division"
    variants:
      - name: prorata_daily
        when: "CancellationOrder.refund_policy_snapshot == PRORATA_DAILY"
        difference: >-
          every claimed day counts. For period_fee_cents 11999, term_days 365 and a 291-day
          claim (2026-03-16..2026-12-31) the result is 9566.
      - name: unused_period
        when: "CancellationOrder.refund_policy_snapshot == UNUSED_PERIOD"
        difference: >-
          only whole 30-day blocks count: 291 days collapses to 9 * 30 = 270 billable days and
          the same inputs yield 8876, a delta of 690 cents against PRORATA_DAILY.

  # ---------------------------------------------------------------------------
  # 8. Compound derivation of the estate's administration phase.
  # ---------------------------------------------------------------------------
  - name: estate_administration_phase
    description: |
      Derives Estate.administration_phase from the estate's children after every mutation that
      could change it. The first matching clause wins, so CLOSED is sticky and an authority
      collapse walks the phase all the way back to INTAKE.
    trigger: >-
      system — after any Document verification change, Fiduciary letters change, AuthorityGrant
      status change, DigitalAsset access_status or disposition_status change, asset creation, or
      CancellationOrder confirmation.
    inputs:
      - "Estate.closed_at"
      - "existence of a VERIFIED DEATH_CERTIFICATE Document on the estate"
      - "existence of a Fiduciary of the estate with letters_status == ISSUED"
      - "Estate.inventory_total_count, Estate.disclosed_asset_count, Estate.assets_disposed_count"
    algorithm: constraint_propagation
    formula: |
      # first match wins
      if estate.closed_at is not null:                       -> CLOSED
      elif not exists(Document, doc_type == DEATH_CERTIFICATE and verification_status == VERIFIED)
           or not exists(Fiduciary, letters_status == ISSUED): -> INTAKE
      elif estate.disclosed_asset_count == 0:                 -> AUTHORIZED
      elif estate.inventory_total_count == 0
           or estate.assets_disposed_count < estate.inventory_total_count: -> DISCLOSURE
      else:                                                    -> WIND_DOWN

      # counters that feed the derivation, all recomputed from the child rows:
      estate.inventory_total_count           = COUNT(assets)
      estate.disclosed_asset_count           = COUNT(assets where access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED})
      estate.assets_disposed_count           = COUNT(assets where disposition_status IN {EXECUTED, PURGED})
      estate.assets_pending_disposition_count = COUNT(assets where disposition_status IN {PENDING, ELECTED})
      estate.open_cancellation_count         = COUNT(orders where status IN {PENDING, REQUESTED})
      estate.cancelled_subscription_count    = COUNT(orders where status == CONFIRMED)
      estate.refund_recovered_cents          = SUM(claims.credited_cents where status == CREDITED)

      # invariant: inventory_total_count == assets_pending_disposition_count + assets_disposed_count
    constants: {}
    precision: "integer counts; enum result"

# =============================================================================
# §1.4 Validation Rules — evaluated STRICTLY in ascending priority order.
# The first rule whose condition is violated produces the response; no later
# rule is evaluated. Priorities are globally unique.
#
# Category bands:
#   1-5    auth / request shape
#   6-19   path-parameter existence (404)
#   20-23  body-reference existence (404)
#   24-25  tenancy / scope
#   26-27  optimistic concurrency (412)
#   28-36  entity state
#   37-39  referential consistency
#   40-54  business safety
#   55-60  business temporal
#   61-72  business fiscal / aggregate
# =============================================================================
validations:

  # ---- auth / request shape -------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
    description: "Checked before anything else, including request-body parsing and path existence."
  - priority: 2
    category: auth
    check: "X-User-Role is one of Fiduciary, CourtRegistrar, PlatformCompliance, EstateAdmin"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
    description: "An unrecognised role string is an authentication failure, not a 403."
  - priority: 3
    category: auth
    check: "the role is listed in the target endpoint's authorized_roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
    description: "Endpoint-level RBAC. Outranks request-body validation and path existence."
  - priority: 4
    category: validation
    check: >-
      the request body parses, contains every required input field, contains no unknown field
      that would change behaviour, and every field has the declared type / enum membership /
      range (share_bp 1..10000, non-negative cents, ISO-8601 dates and datetimes)
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
    description: "Covers missing required fields, wrong types, unknown enum members and out-of-range numbers."
  - priority: 5
    category: auth
    check: "the calling role may perform the specific `action` submitted to a /transitions endpoint"
    error_id: ERR_ACTION_ROLE_MISMATCH
    http_status: 403
    applies_to: "all POST .../transitions endpoints"
    description: >-
      Action-level RBAC. The role passed endpoint-level RBAC at priority 3 but is not the role
      that owns this action, e.g. a Fiduciary submitting DECIDE, or PlatformCompliance
      submitting COUNTERSIGN.

  # ---- path-parameter existence (404) --------------------------------------
  - priority: 6
    category: existence
    check: "{estate_id} in the path identifies an existing Estate"
    error_id: ERR_ESTATE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {estate_id}"
    description: "Path existence is resolved outer-to-inner, left-to-right."
  - priority: 7
    category: existence
    check: "{fiduciary_id} in the path identifies an existing Fiduciary"
    error_id: ERR_FIDUCIARY_NOT_FOUND
    http_status: 404
    applies_to: "GET /fiduciaries/{fiduciary_id}"
    description: ""
  - priority: 8
    category: existence
    check: "{document_id} in the path identifies an existing Document"
    error_id: ERR_DOCUMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /documents/{document_id}, POST /documents/{document_id}/transitions"
    description: ""
  - priority: 9
    category: existence
    check: "{platform_id} in the path identifies an existing Platform"
    error_id: ERR_PLATFORM_NOT_FOUND
    http_status: 404
    applies_to: "GET /platforms/{platform_id}, PATCH /platforms/{platform_id}"
    description: ""
  - priority: 10
    category: existence
    check: "{directive_id} in the path identifies an existing AuthorityDirective"
    error_id: ERR_DIRECTIVE_NOT_FOUND
    http_status: 404
    applies_to: "GET /authority-directives/{directive_id}"
    description: ""
  - priority: 11
    category: existence
    check: "{asset_id} in the path identifies an existing DigitalAsset"
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {asset_id}"
    description: ""
  - priority: 12
    category: existence
    check: "{term_id} in the path identifies an existing SubscriptionTerm"
    error_id: ERR_SUBSCRIPTION_TERM_NOT_FOUND
    http_status: 404
    applies_to: "GET /subscription-terms/{term_id}"
    description: ""
  - priority: 13
    category: existence
    check: "{request_id} in the path identifies an existing PlatformRequest"
    error_id: ERR_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /platform-requests/{request_id}, POST /platform-requests/{request_id}/transitions"
    description: ""
  - priority: 14
    category: existence
    check: "{grant_id} in the path identifies an existing AuthorityGrant"
    error_id: ERR_GRANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /authority-grants/{grant_id}, POST /authority-grants/{grant_id}/transitions"
    description: ""
  - priority: 15
    category: existence
    check: "{designation_id} in the path identifies an existing BeneficiaryDesignation"
    error_id: ERR_DESIGNATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /beneficiary-designations/{designation_id}"
    description: ""
  - priority: 16
    category: existence
    check: "{election_id} in the path identifies an existing DispositionElection"
    error_id: ERR_ELECTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /disposition-elections/{election_id}, POST /disposition-elections/{election_id}/transitions"
    description: ""
  - priority: 17
    category: existence
    check: "{order_id} in the path identifies an existing CancellationOrder"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {order_id}"
    description: ""
  - priority: 18
    category: existence
    check: "{claim_id} in the path identifies an existing RefundClaim"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /refund-claims/{claim_id}, POST /refund-claims/{claim_id}/transitions"
    description: ""
  - priority: 19
    category: existence
    check: "{run_id} in the path identifies an existing ValuationRun"
    error_id: ERR_VALUATION_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET /valuation-runs/{run_id}, POST /valuation-runs/{run_id}/transitions"
    description: ""

  # ---- body-reference existence (404) --------------------------------------
  - priority: 20
    category: existence
    check: "a platform_id supplied in the request body identifies an existing Platform"
    error_id: ERR_PLATFORM_NOT_FOUND
    http_status: 404
    applies_to: >-
      POST /estates/{estate_id}/digital-assets, POST /estates/{estate_id}/platform-requests,
      POST /estates/{estate_id}/authority-directives, GET /estates/{estate_id}/authority-resolution
    description: "Body references are resolved after every path parameter."
  - priority: 21
    category: existence
    check: "a fiduciary_id supplied in the request body identifies an existing Fiduciary"
    error_id: ERR_FIDUCIARY_NOT_FOUND
    http_status: 404
    applies_to: "POST /estates/{estate_id}/documents"
    description: ""
  - priority: 22
    category: existence
    check: "death_certificate_document_id and letters_document_id identify existing Documents, resolved in that order"
    error_id: ERR_DOCUMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /estates/{estate_id}/platform-requests"
    description: "death_certificate_document_id is resolved before letters_document_id."
  - priority: 23
    category: existence
    check: "a beneficiary_designation_id supplied in the request body identifies an existing BeneficiaryDesignation"
    error_id: ERR_DESIGNATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /digital-assets/{asset_id}/disposition-elections"
    description: ""

  # ---- tenancy / scope ------------------------------------------------------
  - priority: 24
    category: scope
    check: >-
      for the Fiduciary role, X-User-ID identifies a Fiduciary whose estate_id equals the estate
      that owns the target resource
    error_id: ERR_FIDUCIARY_ESTATE_MISMATCH
    http_status: 403
    applies_to: "all Fiduciary-authorized write endpoints"
    description: "A fiduciary of estate A can never act on estate B's resources."
  - priority: 25
    category: scope
    check: >-
      for the PlatformCompliance role, X-User-ID equals the platform_id of the target resource
      (PlatformRequest.platform_id, or DigitalAsset.platform_id for elections, cancellation
      orders and refund claims)
    error_id: ERR_PLATFORM_SCOPE_MISMATCH
    http_status: 403
    applies_to: "all PlatformCompliance-authorized write endpoints"
    description: "Provider compliance staff may only act on their own platform's requests."

  # ---- optimistic concurrency (412) ---------------------------------------
  - priority: 26
    category: concurrency
    check: "expected_estate_version equals Estate.version"
    error_id: ERR_STALE_ESTATE_VERSION
    http_status: 412
    applies_to: "POST /estates/{estate_id}/valuation-runs"
    description: "Evaluated after scope but before any state check, so a stale version on a closed estate still returns 412."
  - priority: 27
    category: concurrency
    check: "expected_asset_version equals DigitalAsset.version"
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412
    applies_to: "POST /digital-assets/{asset_id}/disposition-elections"
    description: "Evaluated after scope but before any state check."

  # ---- entity state --------------------------------------------------------
  - priority: 28
    category: state
    check: "the owning Estate.administration_phase != CLOSED"
    error_id: ERR_ESTATE_CLOSED
    http_status: 409
    applies_to: "every write endpoint whose target belongs to an Estate"
    description: "A closed estate is frozen; only reads remain."
  - priority: 29
    category: state
    check: "the Document is in a status from which the submitted action is defined"
    error_id: ERR_INVALID_DOCUMENT_STATE
    http_status: 409
    applies_to: "POST /documents/{document_id}/transitions"
    description: "e.g. VERIFY on an already VERIFIED or REVOKED document."
  - priority: 30
    category: state
    check: "the PlatformRequest is in a status from which the submitted action is defined"
    error_id: ERR_INVALID_REQUEST_STATE
    http_status: 409
    applies_to: "POST /platform-requests/{request_id}/transitions"
    description: "e.g. DECIDE on a SUBMITTED request, or SUBMIT on an APPROVED one."
  - priority: 31
    category: state
    check: "the AuthorityGrant status is ACTIVE"
    error_id: ERR_INVALID_GRANT_STATE
    http_status: 409
    applies_to: "POST /authority-grants/{grant_id}/transitions"
    description: "REVOKED and EXPIRED are terminal."
  - priority: 32
    category: state
    check: >-
      the DispositionElection is in a status from which the submitted action is defined, and for
      REVERSE the asset's disposition_status is EXECUTED (a PURGED asset can never be reversed)
    error_id: ERR_INVALID_ELECTION_STATE
    http_status: 409
    applies_to: "POST /disposition-elections/{election_id}/transitions"
    description: >-
      e.g. EXECUTE on a DRAFT election, REVERSE on a REJECTED or SUPERSEDED one, or REVERSE on an
      EXECUTED DELETE election whose asset is already PURGED.
  - priority: 33
    category: state
    check: >-
      the CancellationOrder is in a status from which the submitted action is defined, and for
      refund-claim creation the order status is CONFIRMED
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /cancellation-orders/{order_id}/transitions, POST /cancellation-orders/{order_id}/refund-claims"
    description: >-
      PRIORITY CONFLICT PAIR A (higher side): outranks ERR_CLAIM_PERIOD_OUT_OF_TERM at priority
      59 — filing an out-of-term claim against a PENDING order returns this error, not the
      temporal one.
  - priority: 34
    category: state
    check: "the RefundClaim is in a status from which the submitted action is defined"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /refund-claims/{claim_id}/transitions"
    description: "e.g. CREDIT on a FILED claim, or CHARGE_BACK on a DENIED one."
  - priority: 35
    category: state
    check: "the ValuationRun status is COMPUTED"
    error_id: ERR_INVALID_RUN_STATE
    http_status: 409
    applies_to: "POST /valuation-runs/{run_id}/transitions"
    description: "SUPERSEDED runs cannot be finalized."
  - priority: 36
    category: state
    check: "no ValuationRun of the estate already has status FINALIZED"
    error_id: ERR_VALUATION_ALREADY_FINALIZED
    http_status: 409
    applies_to: "POST /estates/{estate_id}/valuation-runs, POST /valuation-runs/{run_id}/transitions"
    description: "Finalization is once per estate; a finalized roll-up may not be recomputed or re-finalized."

  # ---- referential consistency --------------------------------------------
  - priority: 37
    category: business_referential
    check: "every Document referenced by a PlatformRequest belongs to the same Estate as the request"
    error_id: ERR_DOCUMENT_ESTATE_MISMATCH
    http_status: 409
    applies_to: "POST /estates/{estate_id}/platform-requests"
    description: "Cross-estate paperwork can never support a request."
  - priority: 38
    category: business_referential
    check: >-
      death_certificate_document_id points at a Document with doc_type == DEATH_CERTIFICATE and
      letters_document_id at one with doc_type == LETTERS_OF_AUTHORITY
    error_id: ERR_DOCUMENT_TYPE_MISMATCH
    http_status: 400
    applies_to: "POST /estates/{estate_id}/platform-requests"
    description: "Swapping the two document ids is a type mismatch, not a verification failure."
  - priority: 39
    category: business_referential
    check: "the submitted platform_form_code equals Platform.form_code"
    error_id: ERR_PLATFORM_FORM_MISMATCH
    http_status: 409
    applies_to: "POST /estates/{estate_id}/platform-requests, POST /platform-requests/{request_id}/transitions (SUBMIT, RESUBMIT)"
    description: >-
      PRIORITY CONFLICT PAIR B (higher side): the platform-specific form must match before the
      content-authority question is even asked, so this outranks
      ERR_CONTENT_DISCLOSURE_NOT_AUTHORIZED at priority 44.

  # ---- business safety ----------------------------------------------------
  - priority: 40
    category: business_safety
    check: "the referenced death certificate has verification_status == VERIFIED"
    error_id: ERR_DEATH_CERTIFICATE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /platform-requests/{request_id}/transitions (SUBMIT, RESUBMIT)"
    description: "A pending or revoked certificate cannot support a submission."
  - priority: 41
    category: business_safety
    check: >-
      the referenced letters document is VERIFIED and the Fiduciary it names has
      letters_status == ISSUED
    error_id: ERR_LETTERS_NOT_ISSUED
    http_status: 409
    applies_to: >-
      POST /platform-requests/{request_id}/transitions (SUBMIT, RESUBMIT),
      POST /disposition-elections/{election_id}/transitions (COUNTERSIGN, SUBMIT)
    description: "Revoking letters immediately disqualifies the fiduciary from acting."
  - priority: 42
    category: business_safety
    check: "Platform.status != SUSPENDED"
    error_id: ERR_PLATFORM_SUSPENDED
    http_status: 409
    applies_to: >-
      POST /platform-requests/{request_id}/transitions (SUBMIT, RESUBMIT, DECIDE),
      POST /disposition-elections/{election_id}/transitions (EXECUTE)
    description: "A suspended provider accepts no traffic; resolved scope collapses to NONE."
  - priority: 43
    category: business_safety
    check: >-
      an AuthorityGrant with status == ACTIVE covers the asset's (estate_id, platform_id), and
      the asset's access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED}
    error_id: ERR_NO_ACTIVE_AUTHORITY
    http_status: 409
    applies_to: >-
      POST /digital-assets/{asset_id}/disposition-elections,
      POST /disposition-elections/{election_id}/transitions (SUBMIT),
      POST /cancellation-orders/{order_id}/transitions (REQUEST)
    description: "Nothing may be done to an asset the fiduciary has no live authority over."
  - priority: 44
    category: business_safety
    check: >-
      for a CONTENT_ACCESS request, calculation platform_authority_precedence resolves to
      CATALOG_AND_CONTENT with clamp_reason NONE
    error_id: ERR_CONTENT_DISCLOSURE_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /platform-requests/{request_id}/transitions (SUBMIT, RESUBMIT)"
    description: >-
      PRIORITY CONFLICT PAIR B (lower side): the content-versus-catalog gate. Suppressed when
      ERR_PLATFORM_FORM_MISMATCH at priority 39 also fires.
  - priority: 45
    category: business_safety
    check: >-
      when the resolving platform has requires_court_order_for_content, a VERIFIED COURT_ORDER
      Document exists on the estate
    error_id: ERR_COURT_ORDER_REQUIRED
    http_status: 409
    applies_to: "POST /platform-requests/{request_id}/transitions (SUBMIT, RESUBMIT) for request_type == CONTENT_ACCESS"
    description: >-
      Distinguishes 'the directives never granted content' (priority 44) from 'they did, but the
      provider needs a court order' (this rule). Only reachable when the resolved scope before
      clamping was CATALOG_AND_CONTENT.
  - priority: 46
    category: business_safety
    check: "when directive_type == ONLINE_TOOL, Platform.supports_online_tool is true and platform_id is not null"
    error_id: ERR_ONLINE_TOOL_UNSUPPORTED
    http_status: 409
    applies_to: "POST /estates/{estate_id}/authority-directives"
    description: "An online-tool designation may only be recorded against a platform that offers one."
  - priority: 47
    category: business_safety
    check: "for election == DELETE, countersigned_by_fiduciary_id is not null before SUBMIT"
    error_id: ERR_COUNTERSIGN_REQUIRED
    http_status: 409
    applies_to: "POST /disposition-elections/{election_id}/transitions (SUBMIT)"
    description: "Irreversible deletion needs a second fiduciary's signature."
  - priority: 48
    category: business_safety
    check: "the countersigning X-User-ID differs from DispositionElection.elected_by_fiduciary_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disposition-elections/{election_id}/transitions (COUNTERSIGN)"
    description: "The electing fiduciary cannot countersign their own deletion election."
  - priority: 49
    category: business_safety
    check: "for election == TRANSFER, DigitalAsset.transferability == TRANSFERABLE"
    error_id: ERR_ASSET_NOT_TRANSFERABLE
    http_status: 409
    applies_to: "POST /digital-assets/{asset_id}/disposition-elections"
    description: >-
      Covers both NON_TRANSFERABLE assets and licences that terminate at death — the licence
      simply ends, so there is nothing to hand to a beneficiary.
  - priority: 50
    category: business_safety
    check: >-
      the platform supports the elected disposition: supports_memorialization for MEMORIALIZE,
      supports_deletion for DELETE, supports_transfer for TRANSFER
    error_id: ERR_DISPOSITION_UNSUPPORTED
    http_status: 409
    applies_to: "POST /digital-assets/{asset_id}/disposition-elections"
    description: "Election-by-platform capability check, evaluated after the transferability check."
  - priority: 51
    category: business_safety
    check: >-
      beneficiary_designation_id is supplied for election == TRANSFER and omitted for
      MEMORIALIZE and DELETE
    error_id: ERR_BENEFICIARY_REQUIRED
    http_status: 400
    applies_to: "POST /digital-assets/{asset_id}/disposition-elections"
    description: "Only a transfer distributes value, so only a transfer names a beneficiary."
  - priority: 52
    category: business_safety
    check: "the asset has a SubscriptionTerm"
    error_id: ERR_SUBSCRIPTION_TERM_MISSING
    http_status: 409
    applies_to: "POST /cancellation-orders/{order_id}/refund-claims"
    description: "A refund is computed from term fields; without a term there is nothing to prorate."
  - priority: 53
    category: business_safety
    check: "the asset has no SubscriptionTerm yet, and asset.category == SUBSCRIPTION"
    error_id: ERR_SUBSCRIPTION_TERM_EXISTS
    http_status: 409
    applies_to: "POST /digital-assets/{asset_id}/subscription-terms"
    description: "At most one term per asset; the same code also rejects a term on a non-subscription asset."
  - priority: 54
    category: business_safety
    check: "CancellationOrder.refund_policy_snapshot != NONE"
    error_id: ERR_REFUND_NOT_OFFERED
    http_status: 409
    applies_to: "POST /cancellation-orders/{order_id}/refund-claims"
    description: "The snapshot is taken when the order is created, so a later Platform PATCH cannot open or close this door."

  # ---- business temporal --------------------------------------------------
  - priority: 55
    category: business_temporal
    check: "date_of_death <= the logical clock's date"
    error_id: ERR_DATE_OF_DEATH_IN_FUTURE
    http_status: 400
    applies_to: "POST /estates"
    description: "Boundary: equal to today is accepted."
  - priority: 56
    category: business_temporal
    check: "effective_date >= Estate.date_of_death"
    error_id: ERR_EFFECTIVE_DATE_BEFORE_DEATH
    http_status: 400
    applies_to: "POST /cancellation-orders/{order_id}/transitions (REQUEST)"
    description: "Boundary: equal to the date of death is accepted."
  - priority: 57
    category: business_temporal
    check: "for basis == ALTERNATE, the logical clock's date >= Estate.alternate_valuation_date"
    error_id: ERR_ALTERNATE_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /estates/{estate_id}/valuation-runs"
    description: "The six-month alternate date must have arrived. Boundary: equal is accepted."
  - priority: 58
    category: business_temporal
    check: >-
      the half-open review window [review_window_start, review_window_end) of the submission does
      not overlap the window of another PlatformRequest with the same
      (estate_id, platform_id, request_type) in status SUBMITTED, UNDER_REVIEW or INFO_REQUESTED
    error_id: ERR_REQUEST_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /platform-requests/{request_id}/transitions (SUBMIT, RESUBMIT)"
    description: >-
      Half-open semantics: a new window starting exactly at an existing window's
      review_window_end is ADJACENT and therefore allowed.
  - priority: 59
    category: business_temporal
    check: >-
      claimed_period_start >= SubscriptionTerm.term_start_date and
      claimed_period_end <= SubscriptionTerm.term_end_date and
      claimed_period_start <= claimed_period_end
    error_id: ERR_CLAIM_PERIOD_OUT_OF_TERM
    http_status: 400
    applies_to: "POST /cancellation-orders/{order_id}/refund-claims"
    description: >-
      PRIORITY CONFLICT PAIR A (lower side) and PAIR C (higher side): suppressed by
      ERR_INVALID_ORDER_STATE at priority 33, but itself outranks
      ERR_REFUND_WINDOW_TOO_SHORT at priority 61.
  - priority: 60
    category: business_temporal
    check: >-
      the CLOSED claimed interval [claimed_period_start, claimed_period_end] does not overlap
      the interval of any other RefundClaim on the same SubscriptionTerm whose status is
      FILED, PLATFORM_REVIEW, ESCALATED or CREDITED
    error_id: ERR_CLAIM_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /cancellation-orders/{order_id}/refund-claims"
    description: >-
      Closed semantics: touching endpoints ARE an overlap (a claim ending 2026-09-30 blocks one
      starting 2026-09-30). DENIED and CHARGED_BACK claims RELEASE their interval and no longer
      block. This is deliberately the opposite convention to the half-open review window at
      priority 58.

  # ---- business fiscal / aggregate ---------------------------------------
  - priority: 61
    category: business_fiscal
    check: "claimed_days >= REFUND_MIN_CLAIM_DAYS (7)"
    error_id: ERR_REFUND_WINDOW_TOO_SHORT
    http_status: 400
    applies_to: "POST /cancellation-orders/{order_id}/refund-claims"
    description: >-
      PRIORITY CONFLICT PAIR C (lower side). Boundary: claimed_days == 7 is accepted, 6 is
      rejected. claimed_days is inclusive of both endpoints.
  - priority: 62
    category: business_fiscal
    check: "credited_cents <= RefundClaim.claimed_cents"
    error_id: ERR_CREDIT_EXCEEDS_CLAIM
    http_status: 400
    applies_to: "POST /refund-claims/{claim_id}/transitions (CREDIT)"
    description: "Boundary: crediting exactly claimed_cents is accepted."
  - priority: 63
    category: business_fiscal
    check: >-
      the sum of share_bp over all BeneficiaryDesignation rows of the estate, including the one
      being created, is <= 10000; and it is exactly 10000 before a ValuationRun may be created
    error_id: ERR_SHARE_TOTAL_INVALID
    http_status: 400
    applies_to: "POST /estates/{estate_id}/beneficiary-designations, POST /estates/{estate_id}/valuation-runs"
    description: >-
      Aggregate validation: each designation is individually valid (1..10000) but the collective
      total must land on exactly 10000.
  - priority: 64
    category: business_fiscal
    check: >-
      for election == TRANSFER at EXECUTE, a ValuationRun with status IN {COMPUTED, FINALIZED}
      exists on the estate and DigitalAsset.appraised_value_cents is not null
    error_id: ERR_VALUATION_REQUIRED
    http_status: 409
    applies_to: "POST /disposition-elections/{election_id}/transitions (EXECUTE)"
    description: "Value cannot be distributed before it has been appraised."
  - priority: 65
    category: business_fiscal
    check: "DigitalAsset.appraised_value_cents <= Estate.undistributed_value_cents"
    error_id: ERR_DISTRIBUTION_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /disposition-elections/{election_id}/transitions (EXECUTE)"
    description: "Boundary: an amount exactly equal to the remaining pool is accepted."
  - priority: 66
    category: business_fiscal
    check: >-
      BeneficiaryDesignation.received_value_cents + DigitalAsset.appraised_value_cents <=
      BeneficiaryDesignation.planned_allocation_cents
    error_id: ERR_BENEFICIARY_ALLOCATION_EXCEEDED
    http_status: 409
    applies_to: "POST /disposition-elections/{election_id}/transitions (EXECUTE)"
    description: "A beneficiary may not receive more than its planned share. Boundary: exact equality is accepted."
  - priority: 67
    category: business_fiscal
    check: "the estate's newest non-SUPERSEDED ValuationRun has status == FINALIZED"
    error_id: ERR_VALUATION_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /estates/{estate_id}/close"
    description: "The estate tax position must be locked before closure."
  - priority: 68
    category: business_fiscal
    check: "every DigitalAsset of the estate has disposition_status IN {EXECUTED, PURGED}"
    error_id: ERR_ASSETS_PENDING_DISPOSITION
    http_status: 409
    applies_to: "POST /estates/{estate_id}/close"
    description: "Equivalently: assets_pending_disposition_count == 0."
  - priority: 69
    category: business_safety
    check: "no other DigitalAsset of the estate has the same (platform_id, account_handle)"
    error_id: ERR_DUPLICATE_ASSET_HANDLE
    http_status: 409
    applies_to: "POST /estates/{estate_id}/digital-assets"
    description: "Inventory uniqueness is scoped to the estate; two estates may list the same handle."
  - priority: 70
    category: business_safety
    check: "PlatformRequest.info_cycle_count < MAX_INFO_CYCLES (3)"
    error_id: ERR_INFO_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /platform-requests/{request_id}/transitions (RESUBMIT)"
    description: "Boundary: the 3rd RESUBMIT succeeds (count 2 -> 3); the 4th is rejected."
  - priority: 71
    category: business_fiscal
    check: "every CancellationOrder of the estate's assets has status IN {CONFIRMED, FAILED}"
    error_id: ERR_OPEN_CANCELLATIONS
    http_status: 409
    applies_to: "POST /estates/{estate_id}/close"
    description: "Equivalently: open_cancellation_count == 0."
  - priority: 72
    category: business_fiscal
    check: "every RefundClaim of the estate has status IN {CREDITED, DENIED, CHARGED_BACK}"
    error_id: ERR_OPEN_REFUND_CLAIMS
    http_status: 409
    applies_to: "POST /estates/{estate_id}/close"
    description: "No refund pursuit may still be running when the estate closes."

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix is "" — every entity is a top-level collection and every child
# relationship is reachable through a filtered list. Creation of a child uses a
# nested path so the parent is unambiguous; every read is flat.
# =============================================================================
endpoints:

  # ---- logical clock (mandatory test-driving endpoint) ----------------------
  - method: POST
    path: /_clock/set_current_utc
    description: >-
      Sets the server's logical clock, which is the single source of "now" for every timestamp,
      review window, expiry sweep and date comparison in this API. The clock starts at
      2026-08-01T00:00:00Z on a fresh server and never advances on its own.
    roles: [EstateAdmin]
    input: [to_iso8601]
    output: { current_utc: datetime }
    success_code: 200
    side_effects:
      - "all subsequent created_at / updated_at stamps use the new value"
      - "does not itself re-evaluate any grant expiry — call POST /estates/{estate_id}/grant-expiry-sweeps for that"
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  # ---- Platform ------------------------------------------------------------
  - method: POST
    path: /platforms
    description: "Registers a service provider and its death-administration policy."
    roles: [EstateAdmin]
    input:
      - name
      - platform_type
      - form_code
      - review_window_days
      - refund_policy
      - supports_online_tool
      - supports_transfer
      - supports_memorialization
      - supports_deletion
      - requires_court_order_for_content
      - license_terminates_at_death
      - transfer_fee_cents
      - request_fee_cents
      - status?
    output: Platform
    success_code: 201
    side_effects: ["status defaults to PARTICIPATING when omitted"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /platforms/{platform_id}
    description: "Reads one platform."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: []
    output: Platform
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_PLATFORM_NOT_FOUND]

  - method: GET
    path: /platforms
    description: "Lists platforms."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: ["platform_type?", "status?", "refund_policy?", "limit?", "offset?"]
    output: Platform[]
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: PATCH
    path: /platforms/{platform_id}
    description: >-
      Updates a platform's mutable policy fields. Does NOT retroactively change any
      CancellationOrder.refund_policy_snapshot, any frozen PlatformRequest.resolved_scope, or any
      already-classified asset — a re-classification requires
      POST /digital-assets/{asset_id}/transferability-reviews.
    roles: [EstateAdmin]
    input:
      - status?
      - refund_policy?
      - supports_online_tool?
      - supports_transfer?
      - supports_memorialization?
      - supports_deletion?
      - requires_court_order_for_content?
      - license_terminates_at_death?
      - review_window_days?
      - transfer_fee_cents?
      - request_fee_cents?
      - form_code?
    output: Platform
    success_code: 200
    side_effects: ["increments Platform.version by 1"]
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PLATFORM_NOT_FOUND]

  # ---- Estate --------------------------------------------------------------
  - method: POST
    path: /estates
    description: >-
      Opens an estate administration file. alternate_valuation_date is computed as date_of_death
      plus six calendar months, clamped to the last day of the target month.
    roles: [EstateAdmin]
    input: [decedent_name, date_of_death, domicile_state, court_case_number]
    output: Estate
    success_code: 201
    side_effects:
      - "administration_phase initialised to INTAKE"
      - "alternate_valuation_date computed from date_of_death"
      - "all counters initialised to 0 and all money mirrors to 0"
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_DATE_OF_DEATH_IN_FUTURE

  - method: GET
    path: /estates/{estate_id}
    description: "Reads one estate including its derived phase, counters and money mirrors."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: []
    output: Estate
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_ESTATE_NOT_FOUND]

  - method: GET
    path: /estates
    description: "Lists estates."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar]
    input: ["administration_phase?", "domicile_state?", "limit?", "offset?"]
    output: Estate[]
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /estates/{estate_id}/close
    description: "Closes the administration. Every gate in §1.4 priorities 67-72 must be satisfied."
    roles: [Fiduciary]
    input: [closing_statement]
    output: Estate
    success_code: 200
    side_effects:
      - "stamps closed_at; pins administration_phase to CLOSED and suppresses further derivation"
      - "increments Estate.version by 1"
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ESTATE_NOT_FOUND
      - ERR_FIDUCIARY_ESTATE_MISMATCH
      - ERR_ESTATE_CLOSED
      - ERR_VALUATION_NOT_FINALIZED
      - ERR_ASSETS_PENDING_DISPOSITION
      - ERR_OPEN_CANCELLATIONS
      - ERR_OPEN_REFUND_CLAIMS

  - method: GET
    path: /estates/{estate_id}/authority-resolution
    description: >-
      Read-only projection of calculation platform_authority_precedence for one
      (estate, platform, asset_category) triple. Changes no state; exposes exactly what a
      submission would resolve to right now.
    roles: [Fiduciary, CourtRegistrar, EstateAdmin]
    input: [platform_id, "asset_category?"]
    output:
      estate_id: string
      platform_id: string
      asset_category: string
      resolved_scope: string
      resolved_basis: string
      clamp_reason: string
      controlling_directive_id: string
    success_code: 200
    side_effects: []
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ESTATE_NOT_FOUND
      - ERR_PLATFORM_NOT_FOUND

  - method: POST
    path: /estates/{estate_id}/grant-expiry-sweeps
    description: >-
      Advances every AuthorityGrant of the estate whose expires_at has been reached by the
      logical clock into EXPIRED, cascading to the assets it covered, and lapses every
      SubscriptionTerm whose term_end_date has passed with auto_renew false.
    roles: [EstateAdmin]
    input: []
    output:
      swept_at: datetime
      expired_grant_count: integer
      revoked_asset_count: integer
      lapsed_term_count: integer
    success_code: 200
    side_effects:
      - "AuthorityGrant ACTIVE -> EXPIRED for every grant with expires_at <= clock, in created_at ASC order"
      - "each covered disclosed DigitalAsset -> ACCESS_REVOKED"
      - "SubscriptionTerm ACTIVE -> LAPSED when term_end_date < clock date and auto_renew is false"
      - "Estate.disclosed_asset_count recomputed and administration_phase re-derived"
      - "idempotent: a second sweep at the same clock position returns all counts as 0"
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_ESTATE_NOT_FOUND
      - ERR_ESTATE_CLOSED

  # ---- Fiduciary -----------------------------------------------------------
  - method: POST
    path: /estates/{estate_id}/fiduciaries
    description: >-
      Appoints a fiduciary. letters_status starts at PENDING and only becomes ISSUED when a
      LETTERS_OF_AUTHORITY Document naming this fiduciary is VERIFIED.
    roles: [CourtRegistrar]
    input: [full_name, appointment_type, court_reference]
    output: Fiduciary
    success_code: 201
    side_effects: ["letters_status initialised to PENDING"]
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ESTATE_NOT_FOUND
      - ERR_ESTATE_CLOSED

  - method: GET
    path: /fiduciaries/{fiduciary_id}
    description: "Reads one fiduciary."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: []
    output: Fiduciary
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_FIDUCIARY_NOT_FOUND]

  - method: GET
    path: /fiduciaries
    description: "Lists fiduciaries, filterable by estate."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: ["estate_id?", "letters_status?", "appointment_type?", "limit?", "offset?"]
    output: Fiduciary[]
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  # ---- Document ------------------------------------------------------------
  - method: POST
    path: /estates/{estate_id}/documents
    description: >-
      Files a death certificate, letters of authority or court order. A LETTERS_OF_AUTHORITY
      document must name the fiduciary it belongs to; the other types must not.
    roles: [CourtRegistrar, Fiduciary]
    input: [doc_type, reference_number, issued_on, jurisdiction, "fiduciary_id?"]
    output: Document
    success_code: 201
    side_effects: ["verification_status initialised to PENDING"]
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ESTATE_NOT_FOUND
      - ERR_FIDUCIARY_NOT_FOUND
      - ERR_FIDUCIARY_ESTATE_MISMATCH
      - ERR_ESTATE_CLOSED

  - method: GET
    path: /documents/{document_id}
    description: "Reads one document."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: []
    output: Document
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_DOCUMENT_NOT_FOUND]

  - method: GET
    path: /documents
    description: "Lists documents, filterable by estate, fiduciary, type and verification status."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: ["estate_id?", "fiduciary_id?", "doc_type?", "verification_status?", "limit?", "offset?"]
    output: Document[]
