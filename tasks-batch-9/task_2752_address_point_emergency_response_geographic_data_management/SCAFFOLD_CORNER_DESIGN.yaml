      - name: bad_range_geometry_on_create_and_patch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors.ERR_RANGE_GEOMETRY_INVALID
        distinguishing_aspect: "All three arms of priority 17 answer 422 ERR_RANGE_GEOMETRY_INVALID: from > to on a side, a bound whose parity contradicts the declared parity, and a PATCH whose MERGED result is invalid even though the patch body alone looks fine."
        test_recipe:
          setup:
            - "One jurisdiction LARCO and one valid DRAFT centerline, LEFT [100,198] EVEN, RIGHT [101,199] ODD (version 1)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id, road_v: $.data.version }
          trigger:
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "S ELM DRIVE", jurisdiction_id: "${j_id}", from_addr_left: 198, to_addr_left: 100, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e_order: $.data.error_id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "W OAK BOULEVARD", jurisdiction_id: "${j_id}", from_addr_left: 101, to_addr_left: 199, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e_parity: $.data.error_id }
            - call: "PATCH /gis/road-centerlines/${road_id}"
              payload: { to_addr_left: 98, expected_road_version: "${road_v}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e_merge: $.data.error_id }
          assert:
            - "all three calls return status_code 422"
            - "${e_order} == \"ERR_RANGE_GEOMETRY_INVALID\"   # from_addr_left 198 > to_addr_left 100"
            - "${e_parity} == \"ERR_RANGE_GEOMETRY_INVALID\"   # 101/199 are ODD but parity_left says EVEN"
            - "${e_merge} == \"ERR_RANGE_GEOMETRY_INVALID\"   # merged result would be [100,98]; 98 alone is a legal EVEN number"
            - "the PATCH is NOT a 412 — the version supplied was current"
            - "RoadCenterline.${road_id}.to_addr_left == 198 and version == 1 and status == \"DRAFT\""
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 50"
            - "GET /gis/road-centerlines with jurisdiction_id ${j_id} returns meta.total_count == 1"

