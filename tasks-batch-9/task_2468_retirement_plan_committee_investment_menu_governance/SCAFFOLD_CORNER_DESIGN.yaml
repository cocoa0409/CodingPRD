            - "AssetClassSlot.${slot_em_id}.status == EMPTY and current_fund_id is null and at_risk_since_quarter_index is null"
            - "AssetClassSlot.${slot_em_id}.ips_id == ${ips_a_id} and status_before_last_review is null"
