          trigger: "POST /night-audit/allowances/${alw_self_id}/approve with approved_amount 500.00 as NightAuditor (X-User-ID u_na_1) - the same user who requested it, and an amount five times the request."
          assert:
            - "The trigger fails with HTTP 403 and error code ERR_SELF_APPROVAL_FORBIDDEN, not 422 ERR_APPROVED_AMOUNT_EXCEEDS_REQUEST."
