      - name: lease_revision_cycle_is_bounded
        claim_type: cyclic
        grounds:
          - state_machines[Lease].transitions[PENDING_FMV_REVIEW -> DRAFT]
          - validations[17]
        excluded_because:
          difficulty_instance: lease_revision_cycle_bounded_at_two_rounds
          rationale: "The cyclic loop and its termination condition (revision_round capped at 2, third RETURN_FOR_REVISION rejected with ERR_REVISION_LIMIT_EXCEEDED) are asserted end-to-end there, including the interleaving of RETURN_FOR_REVISION and material PATCH as loop increments."

      - name: ti_project_fork_join_requires_both_reviews
        claim_type: branching
        grounds:
          - state_machines[TenantImprovementProject].transitions[IN_REVIEW -> IN_REVIEW]
        excluded_because:
          difficulty_instance: ti_project_fork_join_permits_only_after_both_reviews_approved
          rationale: "The fork at SUBMIT_REVIEWS, the disjointness of the two branch side-effect sets, and the join to PERMITTED firing only on the second approval are all asserted there in both branch orders."

      - name: ti_construction_guarded_by_lease_status
        claim_type: guarded_transitions
        grounds:
          - state_machines[TenantImprovementProject].transitions[PERMITTED -> CONSTRUCTION]
          - validations[38]
        excluded_because:
          difficulty_instance: ti_construction_start_requires_lease_executed_or_active
          rationale: "The cross-entity guard (START_CONSTRUCTION refused with ERR_TI_PROJECT_NOT_COMPLETE while the owning lease is still FMV_CERTIFIED, then accepted unchanged once the lease is EXECUTED) is the whole subject of that instance."

      - name: lease_execute_guarded_by_building_posture
        claim_type: guarded_transitions
        grounds:
          - state_machines[Lease].transitions[FMV_CERTIFIED -> EXECUTED]
          - validations[25]
        excluded_because:
          difficulty_instance: lease_execute_blocked_by_building_restricted_posture
          rationale: "That instance drives the building to RESTRICTED and shows the same execute request failing for a HEALTH_SYSTEM_AFFILIATED tenant while succeeding for an INDEPENDENT_PRACTICE tenant."

      - name: terminate_cascade_depth_four
        claim_type: cascade_down
        grounds:
          - state_machines[Lease].transitions[ACTIVE -> TERMINATED].side_effects
        excluded_because:
          difficulty_instance: lease_termination_cascades_through_building_posture_to_peer_lease_and_ti_hold
          rationale: "Hops 1 through 4 (suite vacancy, posture recompute, peer-lease suspension in created_at order, TI hold with on_hold_from_status) are asserted there hop by hop, including the negative case where hop 2 does not reach RESTRICTED and hops 3 and 4 never fire."

      - name: daily_close_delinquency_cascade
        claim_type: conditional_cascade
        grounds:
          - endpoints[POST /_ops/run-daily-close]
          - state_machines[RentInvoice].transitions[ISSUED -> DELINQUENT]
        excluded_because:
          difficulty_instance: daily_close_delinquency_cascades_to_watch_case_concession_lock_and_booking_cancellation
          rationale: "The depth-3 close cascade — invoice weight, tenant score, watch flag with an auto-opened RENT_DELINQUENCY case, then concession lock, after-hours revocation and future-booking cancellation — is asserted there in full, with the ordering guarantees."

  # ===========================================================================
  - section: calculations
    instances:

      - name: building_tenant_mix_counts_only_executed_active_and_holdover_leases
        claim_type: input_set_filtering
        grounds:
          - calculations.building_tenant_mix
          - calculations.building_tenant_mix.constants.COUNTED_LEASE_STATUSES
        distinguishing_aspect: "An FMV_CERTIFIED lease is invisible to the mix even though it already holds its suite for term-conflict purposes: with a 12000 sf anchor EXECUTED and a 5000 sf independent merely certified the building reads anchor_share_pct 1.0000 / RESTRICTED, and the share only falls to 0.7059 when that second lease is executed."
