  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: authorizations_reverse_lookup_by_case_id
        claim_type: computed_read
        grounds:
          - "endpoints./vr/authorizations"
          - "entities.ServiceAuthorization.fields.case_id"
        distinguishing_aspect: "GET /vr/authorizations?case_id=<id> returns the case's authorizations as an array (FK reverse-reachability)."
        test_recipe:
          setup: ["Case PLAN_DEVELOPMENT with a DRAFT IPE and one REQUESTED authorization."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 3 }
              as: VRAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/authorizations"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", provider_id: "${provider_id}", service_category: "TRAINING", authorized_amount_cents: 100000, comparable_benefit_cents: 0, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { auth_id: $.data.id }
          trigger:
            - call: "GET /vr/authorizations"
              payload: { case_id: "${case_id}" }
              as: Counselor
              as_user_id: "${counselor_id}"
          assert:
            - "response_type == array"
            - "data contains an authorization with id == ${auth_id} and case_id == ${case_id}"

      - name: response_envelope_success_shape
        claim_type: computed_read
        grounds:
          - "response_envelope.success"
          - "endpoints./vr/counselors"
        distinguishing_aspect: "A successful create returns meta.api_request_id, meta.api_request_timestamp, response_type object, and data with server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
          assert:
            - "response meta.api_request_id is present AND response_type == object"
            - "Counselor.${counselor_id}.id is a UUID with no type prefix"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: counselor_cannot_create_provider_forbidden
        claim_type: role_denial
        grounds:
          - "roles.Counselor"
          - "roles.VRAdmin"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "A Counselor calling POST /vr/providers (a VRAdmin-exclusive op) is rejected with ERR_FORBIDDEN."
        test_recipe:
          setup: ["A counselor exists to supply an entity_backed X-User-ID."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
          trigger:
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 3 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

      - name: counselor_cannot_act_on_other_counselors_case_forbidden
        claim_type: role_denial
        grounds:
          - "roles.Counselor"
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "A Counselor who is not the case's assigned counselor cannot advance it (application) — ERR_FORBIDDEN (entity_backed ownership)."
        test_recipe:
          setup: ["Case owned by counselor C1; a second counselor C2 exists."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor1_id: $.data.id }
            - call: "POST /vr/counselors"
              payload: { name: "C2", email: "c2@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor2_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000 }
              as: Counselor
              as_user_id: "${counselor1_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "Case.${case_id}.status == REFERRED (unchanged)"

      - name: create_case_without_role_returns_unauthenticated
        claim_type: role_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000 }
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"

