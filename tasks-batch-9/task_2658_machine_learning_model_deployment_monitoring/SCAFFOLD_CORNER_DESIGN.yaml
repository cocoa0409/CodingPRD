          assert:
            - "precondition: the version's revalidation_due_at was '2026-10-30T00:00:00Z' and the sweep created exactly 1 task (created_count == 1) once the clock reached 2026-10-31"
            - "HOP 1: RevalidationTask.${rt_id}.status == 'FAILED' with decided_at '2026-10-31T00:00:00Z' and findings stored verbatim"
            - "HOP 2: ModelVersion.${v1_id}.approval_state == 'BLOCKED' with a non-null blocked_reason"
            - "HOP 3: Deployment.${d1_id}.rollout_state == 'DRAINING' and traffic_pct == 0.00"
            - "HOP 3 audit: exactly one TrafficRampStep with reason 'DRAIN_RELEASE' and delta_pct -15.00 exists for the deployment"
            - "LEDGER: ServingEndpoint.${se1_id}.allocated_traffic_pct == 0.00 — DRAINING is still an included state but now contributes 0.00"
            - "HOP 4 is a no-op by design: no ChallengerEvaluation references this deployment (total_count 0), so the cascade stops after hop 3"
            - "the whole cascade completed inside the single disposition request (consistency_model immediate) — no second call was needed to observe any hop"

      - name: deployment_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Deployment_rollout_state
          - state_machines.Deployment_health_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / deployment_parallel_rollout_and_health_dimensions
          rationale: "Asserted end-to-end by the named §1.8 instance, which drives rollout_state and health_state on the same row through independent transitions and checks the combined state after each."

      - name: challenger_evaluation_bounded_extension_loop
        claim_type: cyclic
        grounds:
          - state_machines.ChallengerEvaluation.COLLECTING_to_INCONCLUSIVE
          - state_machines.ChallengerEvaluation.INCONCLUSIVE_to_COLLECTING
        excluded_because:
          difficulty_instance: non_linear_state_machine / challenger_evaluation_inconclusive_extend_cycle
          rationale: "The named §1.8 instance walks the loop to MAX_EVALUATION_EXTENSIONS and asserts ERR_MAX_EXTENSIONS_REACHED on the attempt past the bound."

      - name: dataset_revocation_cascades_down_four_levels
        claim_type: Cascade down
        grounds:
          - state_machines.TrainingDataset.APPROVED_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / dataset_revoke_cascade_depth_four
          rationale: "The named §1.8 instance asserts every hop of the revocation cascade including the conditional non-terminal-children filter."

      - name: critical_drift_report_cascades_into_hold_and_incident
        claim_type: Cross-entity
        grounds:
          - state_machines.DriftReport.OPEN_to_BREACHED
        excluded_because:
          difficulty_instance: transitive_cascade / drift_report_critical_cascade_depth_five
          rationale: "The named §1.8 instance asserts the five-hop CRITICAL drift cascade end to end, including the SEV2 incident and the retraining trigger it raises."

  # ===========================================================================
  # 3. From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: documentation_score_ignores_array_members_outside_the_required_lists
        claim_type: Constants Applied
        grounds:
          - calculations.documentation_and_reproducibility_score
          - validations.priority_30
          - errors.ERR_DOCUMENTATION_INCOMPLETE
          - endpoints.PATCH_model_versions_documentation
        distinguishing_aspect: |
          The score counts membership in REQUIRED_DOC_SECTIONS / REQUIRED_REPRO_ARTIFACTS, not array
          length: five doc_sections of which only three are required keys scores 60.00, not 100.00, and
          unknown keys never raise the score. Reproducibility has no partial credit (>= 100.00), so
          3 of 4 artifacts plus two junk keys is still a submit-for-review 422.
        test_recipe:
          setup:
            - "one Model and one APPROVED TrainingDataset with feature_hash fs-v1"
            - "one DRAFT ModelVersion whose arrays are padded with keys outside the REQUIRED_* lists"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
          trigger:
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "MODEL_CARD_APPENDIX", "SLIDE_DECK"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "NOTEBOOK_HTML", "CLUSTER_SPEC"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id, doc_pct: $.data.doc_completeness_pct, repro_pct: $.data.reproducibility_score }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { gate_err: $.data.error_id }
            - call: "PATCH /model-versions/${v1_id}/documentation"
              payload: { doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS", "SLIDE_DECK"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "NOTEBOOK_HTML"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { doc_pct2: $.data.doc_completeness_pct, repro_pct2: $.data.reproducibility_score }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { gate_err2: $.data.error_id }
            - call: "PATCH /model-versions/${v1_id}/documentation"
              payload: { doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS", "SLIDE_DECK"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH", "NOTEBOOK_HTML"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { doc_pct3: $.data.doc_completeness_pct, repro_pct3: $.data.reproducibility_score }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ok_state: $.data.approval_state }
          assert:
            - "5 doc_sections of which 3 are required keys -> doc_completeness_pct == 60.00 (round_half_up(100*3/5, 2)); MODEL_CARD_APPENDIX and SLIDE_DECK are ignored entirely"
            - "5 repro_artifacts of which 3 are required keys -> reproducibility_score == 75.00; NOTEBOOK_HTML and CLUSTER_SPEC never raise it"
            - "submit-for-review at 60.00 / 75.00: HTTP 422 with error_id 'ERR_DOCUMENTATION_INCOMPLETE' (priority 30)"
            - "after the first PATCH (4 required sections, 3 required artifacts): doc_completeness_pct == 80.00 and reproducibility_score == 75.00"
            - "the doc leg now passes at exactly its 80.00 minimum but repro is still short: submit-for-review is STILL HTTP 422 'ERR_DOCUMENTATION_INCOMPLETE' — reproducibility has no partial credit, the AND is strict"
            - "after the second PATCH (4 required sections, 4 required artifacts): doc_completeness_pct == 80.00, reproducibility_score == 100.00"
            - "submit-for-review now succeeds: approval_state == 'PENDING_REVIEW' — 80.00 >= 80.00 and 100.00 >= 100.00 are both inclusive boundaries"

      - name: endpoint_traffic_ledger_counts_only_serving_deployments_of_that_endpoint
        claim_type: Input Set Filtering
        grounds:
          - calculations.endpoint_traffic_ledger
          - entities.ServingEndpoint.fields.allocated_traffic_pct
          - state_machines.Deployment_rollout_state
        distinguishing_aspect: |
          Three exclusion axes on one ledger, none of which is a rollback: a PENDING deployment
          contributes 0.00 even though it exists and reserves nothing, a RETIRED one contributes 0.00
          after having existed, and a deployment on a DIFFERENT ServingEndpoint never touches this
          endpoint's total. The included rows are summed fresh on every write, so RAMPING (REALTIME
          15.00) plus RAMPING (SHADOW 10.00) reads exactly 25.00.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one APPROVED ModelVersion with feature_spec_hash fs-v1"
