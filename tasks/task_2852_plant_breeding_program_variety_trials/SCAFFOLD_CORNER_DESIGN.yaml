              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000 }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /nursery-blocks"
              payload: { block_code: "NB-ID1", nursery_type: "WINTER", location_code: "PR_ISABELA", plot_count: 200, fallow_buffer_days: 14 }
              as: BreedingScientist
              captures: { block_id: $.data.id }
            - call: "POST /nursery-plantings"
              payload: { nursery_block_id: "${block_id}", line_id: "${line_id}", sow_date: "2026-10-05", expected_harvest_date: "2027-02-10", plot_count: 50 }
              as: BreedingScientist
              captures: { p_id: $.data.id }
            - call: "POST /nursery-plantings/${p_id}/plant"
              payload: {}
              as: BreedingScientist
          trigger:
            - call: "POST /nursery-plantings/${p_id}/plant"
              payload: {}
              as: BreedingScientist
            - call: "POST /nursery-plantings/${p_id}/harvest"
              payload: { actual_harvest_date: "2027-02-12", harvested_seed_g: 4000 }
              as: BreedingScientist
            - call: "POST /nursery-plantings/${p_id}/harvest"
              payload: { actual_harvest_date: "2027-02-12", harvested_seed_g: 4000 }
              as: BreedingScientist
          assert:
            - "the second plant -> 409 with data.error_id == ERR_PLANTING_INVALID_STATE"
            - "the first harvest -> 200 and NurseryPlanting.${p_id}.status == HARVESTED"
            - "the second harvest -> 409 with data.error_id == ERR_PLANTING_INVALID_STATE"
            - "BreedingLine.${line_id}.seed_inventory_g == 504000 and cumulative_seed_produced_g == 504000 - credited exactly once"
            - "BreedingLine.${line_id}.generation_number == 7 and nursery_cycles_completed == 1, not 2"
            - "BreedingProgram.${prog_id}.committed_plot_count == 0 and plot_budget_remaining == 5000"

      - name: nursery_harvest_below_min_seed_branches_to_failed_without_advancing
        claim_type: Valid Transition
        grounds:
          - state_machines.NurseryPlanting.PLANTED_to_FAILED
          - calculations.nursery_harvest_credit
          - entities.NurseryPlanting.fields.generation_advanced_to
        distinguishing_aspect: "The harvest trigger forks on harvested_seed_g against MIN_ADVANCE_SEED_G 250: at 249 g the planting must land in FAILED with generation_advanced_to null and generation_number still 6, yet the 249 g are still banked into both seed fields - the seed credit is unconditional while the generation advance is not."
        test_recipe:
          setup:
