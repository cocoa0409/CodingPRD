              captures: { p1_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-engagement"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-endorsement-round"
              payload: {}
              as: RegionalAdministrator
          trigger:
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "00000000-0000-0000-0000-000000000000", name: "Late Entry", hazard_type: "HEAT", strategy_type: "ACCOMMODATE", base_cost_cents: 30000000, service_life_years: 25, cobenefit_points: 10, feasibility_score: 0.65 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Late Entry", hazard_type: "HEAT", strategy_type: "ACCOMMODATE", base_cost_cents: 30000000, service_life_years: 25, cobenefit_points: 10, feasibility_score: 0.65 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
          assert:
            - "first call: status 404 with data.error_id == ERR_JURISDICTION_NOT_FOUND"
            - "second call: status 409 with data.error_id == ERR_PLAN_CYCLE_STATE_INVALID"
            - "GET /resilience/projects?plan_cycle_id=${cycle_id} returns meta.total_count == 1"

      - name: allocation_state_before_funds_priority_pair_excluded
        claim_type: Priority Ordering
        grounds:
          - validations.priority_17_ERR_PROJECT_ALREADY_PROGRAMMED
          - validations.priority_50_ERR_PROGRAM_FUNDS_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / allocation_state_error_precedes_funds_exceeded
          rationale: "The named §1.8 instance already constructs a request that breaks both rules and pins the reported code to the already-programmed state error."

      - name: aid_not_shared_before_concurrency_priority_pair_excluded
        claim_type: Priority Ordering
        grounds:
          - validations.priority_28_ERR_ASSET_NOT_SHARED
          - validations.priority_47_ERR_AID_CONCURRENCY_LIMIT
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / aid_commitment_asset_not_shared_precedes_concurrency_limit
          rationale: "The named §1.8 instance pins the ordering of the sharing rule against the concurrency limit on a single request that breaks both."

      - name: session_buffer_conflict_excluded
        claim_type: Violation → Error
        grounds:
          - validations.priority_45_ERR_SESSION_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / session_closed_interval_plus_buffer_blocks_a_host_jurisdiction
          rationale: "The named §1.8 instance covers the exact-24-hour rejection, the 24-hours-and-one-second acceptance and the per-host scoping."

      - name: engagement_session_count_gate_excluded
        claim_type: Violation → Error
        grounds:
          - validations.priority_40_ERR_ENGAGEMENT_INCOMPLETE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / endorsement_round_blocked_until_required_sessions_complete
          rationale: "The named §1.8 instance drives the COMPLETED session count from one to two across the same gate."

      - name: linked_asset_ranking_gate_excluded
        claim_type: Violation → Error
        grounds:
          - validations.priority_37_ERR_ASSET_RANKING_REQUIRED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / analysis_blocked_until_every_linked_asset_is_ranked
          rationale: "The named §1.8 instance covers both the RECOMPUTE_REQUIRED rejection and the pass after re-ranking."

      - name: empty_asset_link_set_gate_excluded
        claim_type: Violation → Error
        grounds:
          - validations.priority_36_ERR_NO_LINKED_ASSETS
        excluded_because:
          difficulty_instance: boundary_precision_check / analysis_requires_at_least_one_asset_link
          rationale: "The named §1.8 instance is exactly the zero-link boundary against the one-link pass."

  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_on_not_found
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.error
          - endpoints.get_jurisdiction_by_id
        distinguishing_aspect: "A created object arrives as response_type object with meta.api_request_id and meta.api_request_timestamp beside data, while an unknown id arrives as response_type error whose data holds only error_id and message — the error path never puts the code at the top level."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "GET /resilience/jurisdictions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdministrator
          assert:
            - "first call: status 201, response_type == object, meta.api_request_id and meta.api_request_timestamp both present, data.id non-empty"
            - "second call: status 404, response_type == error, data.error_id == ERR_JURISDICTION_NOT_FOUND and data.message non-empty"
            - "the error response carries no data.id and no top-level error_id"

      - name: jurisdiction_patch_updates_only_the_named_fields
        claim_type: Standard CRUD
        grounds:
          - endpoints.patch_jurisdiction
          - entities.Jurisdiction.fields.svi_tier
        distinguishing_aspect: "PATCH with svi_score alone leaves name, jurisdiction_code, population and endorsement_weight untouched but recomputes svi_tier and disadvantaged_flag, and bumps version from 1 to 2."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction at svi_score 0.62 (svi_tier HIGH)."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
          trigger:
            - call: "PATCH /resilience/jurisdictions/${j_harbor_id}"
              payload: { svi_score: 0.20 }
              as: RegionalAdministrator
          assert:
            - "status 200 with data.svi_score == 0.20, data.svi_tier == LOW and data.disadvantaged_flag == false"
            - "data.name == Harbor City, data.jurisdiction_code == CITY-HARBOR, data.population == 180000, data.endorsement_weight == 4 and data.status == ACTIVE"
            - "data.version == 2 and data.updated_at is later than data.created_at only if the logical clock moved; the id is unchanged"

      - name: project_list_filters_compose_with_pagination
        claim_type: Standard CRUD
        grounds:
          - endpoints.get_projects
          - response_envelope.pagination_placement
        distinguishing_aspect: "Filtering by hazard_type FLOOD narrows three projects to two and meta.total_count reports 2, the filtered total rather than the unfiltered 3; adding limit 1 keeps meta.total_count at 2 while len(data) drops to 1 and meta.has_more becomes true."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction, one DRAFT PlanCycle and three projects: two FLOOD and one HEAT."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 0 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Levee Raise", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Culvert Upsizing", hazard_type: "FLOOD", strategy_type: "ACCOMMODATE", base_cost_cents: 30000000, service_life_years: 25, cobenefit_points: 10, feasibility_score: 0.65 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Cooling Corridor", hazard_type: "HEAT", strategy_type: "ACCOMMODATE", base_cost_cents: 30000000, service_life_years: 25, cobenefit_points: 10, feasibility_score: 0.65 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /resilience/projects?hazard_type=FLOOD"
              payload: {}
              as: RegionalAdministrator
            - call: "GET /resilience/projects?hazard_type=FLOOD&limit=1&offset=0"
              payload: {}
              as: RegionalAdministrator
            - call: "GET /resilience/projects?hazard_type=FLOOD&limit=1&offset=1"
              payload: {}
              as: RegionalAdministrator
            - call: "GET /resilience/projects?screening_status=SCREENED_IN"
              payload: {}
              as: RegionalAdministrator
          assert:
            - "first call: response_type == array, len(data) == 2, meta.total_count == 2, meta.has_more == false, meta.limit == 10 and meta.offset == 0 from the declared defaults"
            - "second call: len(data) == 1, meta.total_count == 2, meta.has_more == true"
            - "third call: len(data) == 1, meta.total_count == 2, meta.has_more == false"
            - "fourth call: len(data) == 0 and meta.total_count == 0, because all three projects are still PROPOSED"

      - name: endorsement_tally_is_a_side_effect_free_computed_read
        claim_type: Computed read
        grounds:
          - endpoints.get_endorsement_tally
          - calculations.endorsement_quorum_tally
        distinguishing_aspect: "Reading the tally twice returns the identical projected_outcome and never advances the cycle: PlanCycle.status stays ENDORSEMENT_ROUND with revision_count 0 and version unchanged until close-endorsement-round is called."
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions (weights 4 and 3), one PlanCycle at quorum_weight_bps 6600 / required_session_count 0 with one SCREENED_IN project, advanced to ENDORSEMENT_ROUND, both jurisdictions ENDORSED."
