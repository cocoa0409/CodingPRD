  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_pair_job_state_outranks_lapsed_welder_on_weld_completion
        grounds:
          - validations[priority=50]
          - validations[priority=55]
          - validations[priority=64]
          - calculations.welder_continuity_status
          - state_machines.WelderQualification.QUALIFIED_to_LAPSED
          - state_machines.VesselJob.FABRICATION_to_NDE_HOLD
        distinguishing_aspect: |
          A full 2x2 truth table on ONE endpoint for a `state` (priority 55) versus
          `business_safety` (priority 64) pair, where BOTH conditions are induced by side channels
          rather than by the request body: the job state flips because an examination on a
          DIFFERENT joint was rejected, and the welder posture flips because the logical clock
          moved. The pair is therefore only observable through two out-of-band mutations, and the
          masked rule (64) is proved live by firing it alone before the job is put on hold.
        test_recipe:
          setup:
            - "Personnel: two DesignEngineers (SoD), one WeldingEngineer, one QCInspector."
            - "An ACTIVE certificate CA-U-8801 and a PRESSURE_VESSEL job J-2885-09 released to FABRICATION with both design sheets APPROVED at rt_extent_declared FULL."
            - "Heat H-4471 (SA-516-70, PLATE, carbon steel) ACCEPTED with parts SH-01 and HD-01 ISSUED."
            - "WPS-1 QUALIFIED with pwht_required false and thickness range [0.1875, 3.0000]; WelderQualification W12 against WPS-1, qualified_on 2026-06-01, thickness_range_max_in 3.0000, so at the default clock (2026-08-01) days_since_continuity = 61 and status = QUALIFIED."
            - "Two joints: W-001 (category B, BUTT, 1.5000 in -> required_volumetric_pct 100, volumetric_method RT, no surface method) and W-002 (category C, FILLET, 0.7500 in -> required_volumetric_pct 0, required_surface_method MT)."
            - "W-001 is completed (welded_at 2026-07-30) and the examination plan is run, which selects only W-001 because W-002 is not yet WELDED; that leaves exactly one PENDING RT examination and W-002 still at fab_status PLANNED."
