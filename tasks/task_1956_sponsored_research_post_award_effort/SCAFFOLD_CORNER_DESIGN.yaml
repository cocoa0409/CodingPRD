      - name: rebudget_into_equipment_requires_fanda_compensation
        claim_type: correct_result
        grounds: [calculations.budget_load_ceiling_check, calculations.rebudget_significance_test, "errors[ERR_REBUDGET_NOT_ZERO_SUM]"]
        distinguishing_aspect: "Moving 300000 into EQUIPMENT drops MTDC (and hence F&A) — the request only balances with a compensating +100000 boost to an MTDC-bearing line: new F&A line authorized becomes 4025000 while the grand total stays 13625000; omitting the boost fails ERR_REBUDGET_NOT_ZERO_SUM."
        test_recipe:
          setup: ["ACTIVE award RB: SAL 4000000, FRINGE 2400000, TRAVEL 600000, MATERIALS 600000, OTHER 400000, EQUIPMENT 500000, SUBAWARDS 1000000 (eligible 250000) — obligated 13625000"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "RB-001", title: "Equip drift", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 13625000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 4000000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 2400000 }, as: GrantCoordinator, captures: { fr: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 600000 }, as: GrantCoordinator }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "MATERIALS_SUPPLIES", authorized_cents: 600000 }, as: GrantCoordinator }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "OTHER_DIRECT", authorized_cents: 400000 }, as: GrantCoordinator }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "EQUIPMENT", authorized_cents: 500000 }, as: GrantCoordinator, captures: { eq: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "SUBAWARDS", authorized_cents: 1000000, mtdc_eligible_cents: 250000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer, captures: { v: $.data.version } }
          trigger:
            - { call: "POST /api/modification-requests", payload: { award_id: "${aw}", mod_type: "REBUDGET", justification: "unbalanced equipment purchase request", rebudget_lines: [ { budget_line_id: "${eq}", new_authorized_cents: 800000 }, { budget_line_id: "${fr}", new_authorized_cents: 2100000 } ], expected_award_version: "${v}" }, as: GrantCoordinator, captures: { m1: $.data.id } }
            - { call: "POST /api/modification-requests/${m1}/submit", payload: {}, as: GrantCoordinator, captures: { err1: $.data.error_id } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { v_b: $.data.version } }
            - { call: "POST /api/modification-requests", payload: { award_id: "${aw}", mod_type: "REBUDGET", justification: "balanced equipment purchase with boost", rebudget_lines: [ { budget_line_id: "${eq}", new_authorized_cents: 800000 }, { budget_line_id: "${fr}", new_authorized_cents: 2100000 }, { budget_line_id: "${sal}", new_authorized_cents: 4100000 } ], expected_award_version: "${v_b}" }, as: GrantCoordinator, captures: { m2: $.data.id, rs2: $.data.requires_sponsor } }
            - { call: "POST /api/modification-requests/${m2}/submit", payload: {}, as: GrantCoordinator }
            - { call: "POST /api/modification-requests/${m2}/internal-approve", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/modification-requests/${m2}/sponsor-decision", payload: { decision: "APPROVE" }, as: SponsorOfficial, captures: { st: $.data.status } }
            - { call: "GET /api/budget-lines", payload: { award_id: "${aw}", category: "F_AND_A" }, as: GrantsAccountant, captures: { fa_new: "$.data[0].authorized_cents" } }
          assert:
            - "err1 == ERR_REBUDGET_NOT_ZERO_SUM  (direct-neutral swap still fails: MTDC drops 300000 -> F&A drops 150000 -> grand total 13475000 != 13625000)"
            - "rs2 == true  (any net increase into EQUIPMENT forces sponsor review)"
            - "st == APPROVED and fa_new == 4025000  (new MTDC 8050000 x 5000bps; grand total back to 13625000)"

