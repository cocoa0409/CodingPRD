            - call: "POST /transfer-cases/${case_id}/dispatch"
              payload: { mode: "GROUND_ALS", crew_capability: "ALS", distance_miles: 20 }
              as: TransferCoordinator
              captures: { disp_status: $.data.status }
          assert:
            - "dispatch with imaging pending -> error_id == ERR_PACKET_INCOMPLETE (document_status DOCUMENTS_COMPLETE but imaging_status IMAGING_PENDING => overall INCOMPLETE)"
            - "after imaging-exchange: imaging_status == IMAGING_COMPLETE and overall_status == READY"
            - "retry dispatch succeeds: TransportDispatch.status == DISPATCHED, case -> TRANSPORT_ARRANGED"

      - name: accept_gated_by_diversion_event_scope
        grounds:
          - state_machines.TransferCase.AWAITING_ACCEPTANCE_to_ACCEPTED
          - entities.DiversionEvent.fields.effective_status
          - entities.Facility.fields.diversion_status
        distinguishing_aspect: |
          Pair TransferCase x DiversionEvent (different pair than packet gating):
          an ACTIVE SPECIFIC_UNIT diversion on TELEMETRY blocks a TELEMETRY case's
          accept but not an ICU case's accept at the same facility, and lifting
          the diversion immediately unblocks the TELEMETRY case.
        test_recipe:
          setup:
            - "RCV has one AVAILABLE ICU bed and one AVAILABLE TELEMETRY bed"
            - "ACTIVE SPECIFIC_UNIT TELEMETRY diversion on RCV (window covers the clock default)"
            - "case_icu requires ICU; case_tel requires TELEMETRY; both AWAITING_ACCEPTANCE at RCV"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
