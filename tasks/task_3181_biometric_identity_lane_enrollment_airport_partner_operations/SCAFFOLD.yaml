# =============================================================================
# PRD Benchmark Seed Tables — task_3181
# Biometric Identity Lane Enrollment & Airport Partner Operations (CLEAR-style)
# =============================================================================

scenario: |
  Biometric Identity Lane Enrollment & Airport Partner Operations (CLEAR): enrollment with government identity document verification and biometric capture at kiosks and enrollment centers, member verification at airport lanes with ambassador escort to screening, airport partner agreements covering lane placement, revenue share and staffing footprint, integration with federal screening programs where verified identity substitutes for document check, member subscription billing with family plans, partner-provided discounts and cancellation, biometric data protection, retention and deletion commitments with audit, enrollment fraud detection and identity dispute resolution, expansion into stadiums and other venues with separate access rules

domain_name: biometric-identity-lanes
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique login email (case-insensitive unique across members)" }
      - { name: full_name, type: string, source: input, description: "Legal full name as printed on the identity document" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); must be at least 18 years before the logical clock date at enrollment" }
      - { name: status, type: enum, source: system, description: "PENDING_ENROLLMENT | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: verification_level, type: enum, source: computed, default: "NONE", description: "NONE | BIOMETRIC_ID | FEDERAL_TRUSTED; FEDERAL_TRUSTED requires lane verification at an ACTIVE agreement whose federal_integration is true" }
      - { name: subscription_id, type: string, source: computed, description: "FK -> Subscription.id; nullable until first completed enrollment" }
      - { name: family_group_id, type: string, source: computed, description: "FK -> FamilyGroup.id; set when the member occupies a family slot" }
      - { name: document_reject_count_90d, type: integer, source: computed, default: 0, description: "Count of this member's Enrollments whose status flipped to REJECTED within the trailing 90 logical days (recomputed on every rejection)" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Fraud risk score maintained by calc risk_score_update; floor 0, block threshold 20" }
      - { name: deletion_due_at, type: datetime, source: computed, description: "Set when subscription CANCELLED or member TERMINATED: logical clock + BIOMETRIC_RETENTION_DAYS; purged by the daily retention sweep" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the enrolling member" }
      - { name: site_type, type: enum, source: input, description: "KIOSK | ENROLLMENT_CENTER" }
      - { name: site_id, type: string, source: input, description: "Polymorphic FK: Kiosk.id when site_type=KIOSK, EnrollmentCenter.id when site_type=ENROLLMENT_CENTER" }
      - { name: document_type, type: enum, source: input, description: "PASSPORT | DRIVERS_LICENSE | STATE_ID" }
      - { name: document_number, type: string, source: input, description: "Government document number; unique among Enrollments that ever reached DOCUMENT_VERIFIED" }
      - { name: document_expiry, type: string, source: input, description: "ISO date; must be strictly after the logical clock date at submission" }
      - { name: biometric_capture_ok, type: boolean, source: input, description: "Hardware-reported biometric capture success flag" }
      - { name: status, type: enum, source: system, description: "DRAFT | DOCUMENT_VERIFIED | BIOMETRIC_CAPTURED | FRAUD_REVIEW | COMPLETED | REJECTED | SUPERSEDED" }
      - { name: is_re_enrollment, type: boolean, source: computed, description: "True when the member already has a prior COMPLETED enrollment; re-enrollments skip the document_expiry check and mark the prior COMPLETED enrollment SUPERSEDED" }
      - { name: risk_flags, type: array, source: computed, description: "Ordered list of fraud rule codes fired at submission, e.g. [VELOCITY, WATCHLIST, DOC_FORMAT, SELFIE_MISMATCH]" }
      - { name: superseded_by_id, type: string, source: computed, description: "FK -> Enrollment.id; set on the displaced enrollment when a re-enrollment completes; null otherwise" }

  - name: Kiosk
    parent: null
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: input, description: "FK -> Airport.id; hosting airport" }
      - { name: code, type: string, source: input, description: "Unique hardware code (globally unique)" }
      - { name: status, type: enum, source: system, description: "PROVISIONING | ACTIVE | SUSPENDED | RETIRED" }
      - { name: activated_at, type: datetime, source: computed, description: "Set on transition to ACTIVE; anchors the 24h post-activation enrollment window" }
      - { name: consecutive_capture_failures, type: integer, source: computed, default: 0, description: "Reset to 0 on activation; incremented on each submitted enrollment at this kiosk with biometric_capture_ok=false; auto-suspends at 3" }

  - name: EnrollmentCenter
    parent: null
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: input, description: "FK -> Airport.id; hosting airport" }
      - { name: name, type: string, source: input, description: "Center display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: ambassador_capacity, type: integer, source: input, description: "Maximum ambassador seats; must be >= 1" }

  - name: Ambassador
    parent: null
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: input, description: "FK -> Airport.id; home airport (one home airport per ambassador)" }
      - { name: display_name, type: string, source: input, description: "Ambassador public name" }
      - { name: employee_ref, type: string, source: input, description: "Unique employer reference (globally unique)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Airport
    parent: null
    common_fields: true
    fields:
      - { name: iata_code, type: string, source: input, description: "3-letter IATA code (globally unique, uppercase)" }
      - { name: name, type: string, source: input, description: "Airport display name" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "2-letter US state code" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED" }

  - name: PartnerAgreement
    parent: null
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: input, description: "FK -> Airport.id; exactly one agreement in DRAFT or ACTIVE status may exist per airport" }
      - { name: rev_share_rate, type: number, source: input, description: "Revenue-share fraction on lane verification revenue, 0 < rate <= 0.30" }
      - { name: subscription_share_rate, type: number, source: input, description: "Share fraction on subscription MRR attributed to this airport, 0 < rate <= 0.30" }
      - { name: monthly_minimum_cents, type: integer, source: input, description: "Monthly minimum guarantee floor; >= 0" }
      - { name: federal_integration, type: boolean, source: input, description: "When true, verifications at lanes of this agreement can carry federal_program=true and confer FEDERAL_TRUSTED" }
      - { name: staffing_footprint_seats, type: integer, source: input, description: "Contracted ambassador seat footprint for the airport; >= 1" }
      - { name: term_months, type: integer, source: input, description: "Contract term in months; 1..120" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED | EXPIRED" }
      - { name: effective_from, type: datetime, source: input, description: "Contract effective start (ISO datetime); activation requires logical clock >= effective_from" }
      - { name: effective_to, type: datetime, source: input, description: "Contract effective end; = effective_from + term_months at activation" }
      - { name: lane_capacity, type: integer, source: computed, default: 0, description: "Sum of capacity_hours per logical day across this agreement's lanes in OPEN or MAINTENANCE status" }

  - name: Lane
    parent: null
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: input, description: "FK -> Airport.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> PartnerAgreement.id; must belong to the same airport" }
      - { name: terminal, type: string, source: input, description: "Terminal label (e.g. 'T4')" }
      - { name: position_index, type: integer, source: input, description: "Placement index within terminal; must be > 0" }
      - { name: open_time, type: string, source: input, description: "Daily open time HH:MM (airport-local), half-open window start" }
      - { name: close_time, type: string, source: input, description: "Daily close time HH:MM; must be strictly after open_time" }
      - { name: capacity_hours, type: integer, source: input, description: "Verification hours the lane can serve per logical day; 1..24" }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | MAINTENANCE | CLOSED" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: venue_type, type: enum, source: input, description: "STADIUM | ARENA | OTHER" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "2-letter US state code" }
      - { name: access_rule_mode, type: enum, source: input, default: "AGE_18_PLUS", description: "AGE_18_PLUS | AGE_21_PLUS | ALL_MEMBERS — venue access rules are independent of airport lane rules" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: VenueEvent
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: name, type: string, source: input, description: "Event display name" }
      - { name: start_time, type: datetime, source: input, description: "Event window start (ISO datetime); must be in the future at scheduling" }
      - { name: end_time, type: datetime, source: input, description: "Event window end; must be strictly after start_time; overlap with another non-CANCELLED event at the same venue is rejected when buffer_hours > 0" }
      - { name: buffer_hours, type: integer, source: input, default: 0, description: "Setup/teardown buffer in hours around the window; 0..12; interval conflict arithmetic uses [start-buffer, end+buffer]" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; primary account holder; at most one Subscription in ACTIVE or PAST_DUE status per member" }
      - { name: plan, type: enum, source: input, description: "INDIVIDUAL | FAMILY" }
      - { name: price_cents, type: integer, source: computed, description: "Effective monthly price in cents after partner discount; recomputed on plan change and on discount attach/detach" }
      - { name: billing_cycle_day, type: integer, source: input, description: "Day-of-month anchor for invoicing; 1..28" }
      - { name: partner_discount_id, type: string, source: computed, description: "FK -> PartnerDiscount.id; set on successful attach, cleared on detach" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAST_DUE | CANCELLED" }
      - { name: current_period_start, type: datetime, source: computed, description: "Start of the current billing period (first activation time)" }
      - { name: current_period_end, type: datetime, source: computed, description: "End of the current billing period; fixed at +30 days on activation; advanced +30 days by each PAID invoice" }
      - { name: pending_plan, type: enum, source: computed, description: "Set by a deferred INDIVIDUAL -> FAMILY change; applied at next renewal; null otherwise" }
      - { name: past_due_since, type: datetime, source: computed, description: "Set on transition to PAST_DUE; anchors the 7-day cancellation timer" }

  - name: FamilyGroup
    parent: null
    common_fields: true
    fields:
      - { name: primary_subscription_id, type: string, source: input, description: "FK -> Subscription.id; the FAMILY-plan subscription this group belongs to; one group per subscription" }
      - { name: slots_total, type: integer, source: input, default: 3, description: "Total member slots including the primary; 2..3" }
      - { name: slots_used, type: integer, source: computed, default: 0, description: "Count of members currently attached (primary + dependants); invariant slots_used <= slots_total; boundary slots_used == slots_total is FULL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISSOLVED" }

  - name: PartnerDiscount
    parent: null
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: input, description: "FK -> Airport.id; sponsoring airport partner" }
      - { name: code, type: string, source: input, description: "Globally unique discount code" }
      - { name: percent_off, type: integer, source: input, description: "Percent off the plan base price; 1..100" }
      - { name: max_redemptions, type: integer, source: input, description: "Redemption cap; >= 1" }
      - { name: redemptions_used, type: integer, source: computed, default: 0, description: "Incremented on each successful attach; never decremented; boundary redemptions_used == max_redemptions is EXHAUSTED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | SUSPENDED" }
      - { name: expires_at, type: datetime, source: input, description: "Discount expiry (ISO datetime); attach requires logical clock < expires_at" }

  - name: LaneVerification
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id" }
      - { name: ambassador_id, type: string, source: input, description: "FK -> Ambassador.id; escorting ambassador" }
      - { name: verified_at, type: datetime, source: computed, description: "Logical clock time at check-in" }
      - { name: federal_program, type: boolean, source: computed, default: false, description: "True when the lane's agreement has federal_integration=true and the member's document_type is PASSPORT or DRIVERS_LICENSE; verified identity then substitutes for the document check" }
      - { name: escort_status, type: enum, source: system, description: "PENDING | ESCORTED | EXPIRED" }
      - { name: outcome, type: enum, source: computed, description: "VERIFIED | REJECTED — set synchronously in the check-in response" }
      - { name: reject_reason, type: enum, source: computed, description: "BIOMETRIC_MISMATCH | LANE_CLOSED | MEMBER_INELIGIBLE | WRONG_AMBASSADOR; null on success" }
      - { name: version_confirmed, type: integer, source: system, description: "Member.version observed at check-in; escort requires expected_member_version == version_confirmed" }
      - { name: expires_at, type: datetime, source: computed, description: "verified_at + ESCORT_WINDOW_MINUTES; escort after this instant is rejected" }

  - name: VenueAccessEvent
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: accessed_at, type: datetime, source: computed, description: "Logical clock time at access" }
      - { name: outcome, type: enum, source: computed, description: "ADMITTED | REJECTED" }
      - { name: reject_reason, type: enum, source: computed, description: "AGE_RULE | VENUE_SUSPENDED | MEMBER_INELIGIBLE | NO_ACTIVE_EVENT; null on ADMITTED" }

  - name: IdentityDispute
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; disputed member" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrollment under dispute" }
      - { name: reason, type: enum, source: input, description: "IDENTITY_TAKEOVER | BIOMETRIC_FALSE_MATCH | DOCUMENT_FRAUD | DATA_ERROR" }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATING | RESOLVED_CLEAR | RESOLVED_CONFIRMED" }
      - { name: resolved_by, type: string, source: computed, description: "X-User-ID of the resolving ComplianceOfficer; segregation of duties forbids the officer who opened the dispute from resolving it" }
      - { name: resolution_note, type: string, source: input, description: "Required on resolution; 1..1000 chars" }

  - name: BiometricRetentionLog
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; subject of the retention action" }
      - { name: action, type: enum, source: system, description: "DELETION_SCHEDULED | DELETED | AUDIT_EXPORTED" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID that triggered the action (or 'system' for the sweep)" }
      - { name: note, type: string, source: system, description: "Free-text audit note; deletion note is mandatory on manual deletes" }

  - name: AgreementSettlement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: computed, description: "FK -> PartnerAgreement.id; one settlement per (agreement, period)" }
      - { name: venue_id, type: string, source: computed, description: "FK -> Venue.id; non-null only on venue settlements (see variant venue_event_payout)" }
      - { name: period_start, type: string, source: input, description: "Settlement period start date (ISO date, inclusive)" }
      - { name: period_end, type: string, source: input, description: "Settlement period end date (ISO date, exclusive); must be after period_start" }
      - { name: attributable_mrr_cents, type: integer, source: input, description: "Subscription MRR attributable to this partner for the period; >= 0" }
      - { name: verification_revenue_cents, type: integer, source: input, description: "Lane verification revenue for the period; >= 0" }
      - { name: events_count, type: integer, source: input, default: 0, description: "Venue variant: number of non-CANCELLED events hosted in the period; >= 0" }
      - { name: fee_cents, type: integer, source: computed, description: "Computed payout per calc partner_monthly_fee / venue_event_payout" }
      - { name: calculation_variant, type: enum, source: computed, description: "AIRPORT | VENUE — which formula produced fee_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | PAID" }

  - name: SubscriptionInvoice
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: computed, description: "FK -> Subscription.id" }
      - { name: period_start, type: datetime, source: computed, description: "Billing period start covered by this invoice" }
      - { name: period_end, type: datetime, source: computed, description: "Billing period end covered by this invoice" }
      - { name: amount_cents, type: integer, source: computed, description: "Invoice amount per calc invoice_amount (per-family-member rounding pinned)" }
      - { name: status, type: enum, source: system, description: "DUE | PAID | FAILED | VOID" }
      - { name: attempt_count, type: integer, source: computed, default: 0, description: "Number of FAILED payment attempts recorded; first failure moves subscription to PAST_DUE" }
      - { name: due_at, type: datetime, source: computed, description: "period_end; payment recorded after due_at is still accepted but counts as late" }

# =============================================================================
# Table 2: State Machine Table (11 machines)
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING_ENROLLMENT
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_ENROLLMENT
        to: ACTIVE
        trigger: "system (automatic when one of the member's Enrollments transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.status → ACTIVE; Member.version incremented"
          - "If member.subscription_id is set, that Subscription is created (or confirmed) in ACTIVE with current_period_start = now, current_period_end = now + 30 days"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /identity-disputes (system cascade when the dispute is opened)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.status → SUSPENDED; all in-flight DRAFT enrollments of this member → REJECTED with reject cascade to document_reject_count_90d"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /_admin/members/{id}/suspend (operations override)"
        actor: OpsAdmin
        preconditions:
          - "Member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when the member's open IdentityDispute resolves RESOLVED_CLEAR)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.status → ACTIVE"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "system (automatic when the member's open IdentityDispute resolves RESOLVED_CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.status → TERMINATED"
          - "Member's subscription (if any) → CANCELLED via POST /subscriptions/{id}/cancel semantics (retention timer starts)"
          - "Member is detached from any FamilyGroup (slots_used decremented)"
          - "deletion_due_at = now + BIOMETRIC_RETENTION_DAYS; BiometricRetentionLog(DELETION_SCHEDULED) appended"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /_admin/members/{id}/terminate (fraud termination; requires a RESOLVED_CONFIRMED dispute already on file)"
        actor: OpsAdmin
        preconditions:
          - "Member.status == SUSPENDED"
          - "Member has at least one IdentityDispute in RESOLVED_CONFIRMED (ERR_DISPUTE_NOT_CONFIRMED)"
        side_effects:
          - "Same cascade as the RESOLVED_CONFIRMED termination"

  - entity: Enrollment
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: DOCUMENT_VERIFIED
        trigger: "POST /enrollments (successful submission of an existing DRAFT is not used; submission happens at create) — submit step POST /enrollments/{id}/submit-document"
        actor: Member
        preconditions:
          - "Enrollment.status == DRAFT (ERR_INVALID_STATE)"
          - "document_expiry strictly after logical clock date, unless is_re_enrollment (ERR_DOCUMENT_EXPIRED)"
          - "document_number not present on any other Enrollment that ever reached DOCUMENT_VERIFIED (ERR_DOCUMENT_ALREADY_ENROLLED)"
          - "Member.document_reject_count_90d < 3 (ERR_TOO_MANY_REJECTED_ENROLLMENTS)"
        side_effects:
          - "calc risk_score_update evaluated: VELOCITY +8 (3+ rejected enrollments in 90d, incl. this member's history), WATCHLIST +8, DOC_FORMAT +4, SELFIE_MISMATCH +5 (this last one fires at capture, applied pre-emptively when biometric_capture_ok=false is declared on the draft)"
          - "If computed risk score >= RISK_BLOCK_THRESHOLD (20): Enrollment → REJECTED and member.document_reject_count_90d += 1 (skip DOCUMENT_VERIFIED)"
          - "Else if computed risk score >= RISK_REVIEW_THRESHOLD (15): Enrollment → FRAUD_REVIEW instead of DOCUMENT_VERIFIED"

      - from: DOCUMENT_VERIFIED
        to: BIOMETRIC_CAPTURED
        trigger: "POST /enrollments/{id}/capture-biometric"
        actor: Member
        preconditions:
          - "Enrollment.status == DOCUMENT_VERIFIED (ERR_INVALID_STATE)"
          - "biometric_capture_ok == true (ERR_BIOMETRIC_CAPTURE_FAILED); on a failed capture at a KIOSK site the kiosk's consecutive_capture_failures += 1 (3rd consecutive failure auto-suspends the kiosk)"
        side_effects: []

      - from: BIOMETRIC_CAPTURED
        to: COMPLETED
        trigger: "POST /enrollments/{id}/complete"
        actor: Member
        preconditions:
          - "Enrollment.status == BIOMETRIC_CAPTURED (ERR_INVALID_STATE)"
          - "Kiosk site: logical clock <= kiosk.activated_at + 24h (ERR_KIOSK_ACTIVATION_WINDOW_EXPIRED); EnrollmentCenter sites have no window"
        side_effects:
          - "Enrollment → COMPLETED"
          - "Cascade 1: Member (PENDING_ENROLLMENT → ACTIVE) with subscription initialization"
          - "Cascade 2 (re-enrollment): the member's previous COMPLETED enrollment → SUPERSEDED with superseded_by_id = this enrollment"
          - "Cascade 3: if the member had an ACTIVE subscription whose status was PAST_DUE, it stays PAST_DUE (no implicit cure)"

      - from: FRAUD_REVIEW
        to: COMPLETED
        trigger: "POST /enrollments/{id}/review (decision=APPROVE)"
        actor: ComplianceOfficer
        preconditions:
          - "Enrollment.status == FRAUD_REVIEW (ERR_ENROLLMENT_NOT_IN_REVIEW)"
        side_effects:
          - "Same completion cascades as BIOMETRIC_CAPTURED → COMPLETED"

      - from: FRAUD_REVIEW
        to: REJECTED
        trigger: "POST /enrollments/{id}/review (decision=REJECT)"
        actor: ComplianceOfficer
        preconditions:
          - "Enrollment.status == FRAUD_REVIEW (ERR_ENROLLMENT_NOT_IN_REVIEW)"
        side_effects:
          - "member.document_reject_count_90d += 1; the VELOCITY component of risk_score_update is recomputed for this member"

      - from: DRAFT
        to: REJECTED
        trigger: "system (cascade when member is suspended, or when risk score >= 20 at submission)"
        actor: system
        preconditions: []
        side_effects:
          - "member.document_reject_count_90d += 1"

      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system (automatic when the same member completes a re-enrollment)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_id set to the new COMPLETED enrollment"

  - entity: Kiosk
    initial_state: PROVISIONING
    terminal_states: [RETIRED]
    transitions:
      - from: PROVISIONING
        to: ACTIVE
        trigger: "POST /kiosks/{id}/activate"
        actor: OpsAdmin
        preconditions:
          - "Kiosk.status == PROVISIONING (ERR_INVALID_STATE)"
          - "Kiosk's airport has a PartnerAgreement in ACTIVE status (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "activated_at = logical clock; consecutive_capture_failures = 0"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /kiosks/{id}/suspend OR system (automatic on 3rd consecutive capture failure)"
        actor: OpsAdmin
        preconditions:
          - "Kiosk.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /kiosks/{id}/activate (re-activation)"
        actor: OpsAdmin
        preconditions:
          - "Kiosk.status == SUSPENDED (ERR_INVALID_STATE)"
          - "Kiosk's airport has a PartnerAgreement in ACTIVE status (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "activated_at = logical clock (window restarts); consecutive_capture_failures = 0"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /kiosks/{id}/retire"
        actor: OpsAdmin
        preconditions:
          - "Kiosk.status == ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []

      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /kiosks/{id}/retire"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

  - entity: Airport
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "system (automatic when the airport's first PartnerAgreement transitions DRAFT → ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /airports/{id}/suspend"
        actor: OpsAdmin
        preconditions:
          - "Airport.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade: the airport's ACTIVE PartnerAgreement → SUSPENDED"
          - "Cascade: each of that agreement's lanes in OPEN → MAINTENANCE"
          - "Cascade: that suspension recomputes agreement.lane_capacity (lanes in MAINTENANCE still count)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /airports/{id}/activate"
        actor: OpsAdmin
        preconditions:
          - "Airport.status == SUSPENDED (ERR_INVALID_STATE)"
          - "The airport has a PartnerAgreement in ACTIVE or SUSPENDED status (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Cascade: the airport's SUSPENDED PartnerAgreement → ACTIVE (lanes stay in MAINTENANCE and must be re-opened individually)"

  - entity: PartnerAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /partner-agreements/{id}/activate"
        actor: OpsAdmin
        preconditions:
          - "Agreement.status == DRAFT (ERR_INVALID_STATE)"
          - "Logical clock >= effective_from (ERR_AGREEMENT_NOT_YET_EFFECTIVE)"
          - "No other DRAFT-or-ACTIVE agreement exists for the airport (uniqueness enforced at create)"
        side_effects:
          - "effective_to = effective_from + term_months"
          - "Cascade: Airport ONBOARDING → ACTIVE (first agreement only)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /partner-agreements/{id}/suspend OR system (cascade from airport suspension)"
        actor: OpsAdmin
        preconditions:
          - "Agreement.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade: lanes in OPEN → MAINTENANCE"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /partner-agreements/{id}/activate (re-activation) OR system (cascade from airport re-activation)"
        actor: OpsAdmin
        preconditions:
          - "Agreement.status == SUSPENDED (ERR_INVALID_STATE)"
          - "Logical clock < effective_to (ERR_AGREEMENT_EXPIRED)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /partner-agreements/{id}/terminate"
        actor: OpsAdmin
        preconditions:
          - "Agreement.status == ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade: every lane of this agreement in PLANNED, OPEN, or MAINTENANCE → CLOSED"
          - "Cascade: agreement.lane_capacity → 0"
          - "Cascade: each lane closure releases that lane's capacity_hours from the airport-day pool (compensating invariant: airport-day capacity accounting returns to zero)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /partner-agreements/{id}/terminate"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "Same cascade as ACTIVE → TERMINATED"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (daily sweep: logical clock >= effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "Same lane cascade as TERMINATED"

  - entity: Lane
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /lanes/{id}/open"
        actor: OpsAdmin
        preconditions:
          - "Lane.status == PLANNED or MAINTENANCE (ERR_INVALID_STATE)"
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "After adding this lane, sum of capacity_hours over the agreement's lanes in OPEN or MAINTENANCE would not exceed agreement.staffing_footprint_seats * AMBASSADOR_SEAT_HOURS (ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "agreement.lane_capacity recomputed (lane in OPEN counts)"

      - from: MAINTENANCE
        to: OPEN
        trigger: "POST /lanes/{id}/open"
        actor: OpsAdmin
        preconditions:
          - "Same as PLANNED → OPEN"
        side_effects:
          - "agreement.lane_capacity unchanged (MAINTENANCE lanes already counted)"

      - from: OPEN
        to: MAINTENANCE
        trigger: "POST /lanes/{id}/close (mode=MAINTENANCE) OR system (cascade from agreement/airport suspension)"
        actor: OpsAdmin
        preconditions:
          - "Lane.status == OPEN (ERR_INVALID_STATE)"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /lanes/{id}/close (mode=CLOSED) OR system (cascade from agreement termination/expiry)"
        actor: OpsAdmin
        preconditions:
          - "Lane.status == OPEN or MAINTENANCE (ERR_INVALID_STATE)"
        side_effects:
          - "agreement.lane_capacity recomputed (CLOSED lanes do not count)"

      - from: MAINTENANCE
        to: CLOSED
        trigger: "POST /lanes/{id}/close (mode=CLOSED)"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "agreement.lane_capacity recomputed"

  - entity: VenueEvent
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /venue-events/{id}/cancel"
        actor: VenueOps
        preconditions:
          - "VenueEvent.status == SCHEDULED (ERR_INVALID_STATE)"
          - "Logical clock < start_time (ERR_EVENT_ALREADY_STARTED)"
        side_effects:
          - "The event no longer counts toward venue_event_payout events_count and no longer admits members"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (automatic when POST /_billing/record-payment yields outcome=FAILED on a DUE invoice)"
        actor: system
        preconditions: []
        side_effects:
          - "Invoice.attempt_count += 1; invoice stays DUE"
          - "past_due_since = logical clock"
          - "FamilyGroup members retain access during PAST_DUE"

      - from: PAST_DUE
        to: ACTIVE
        trigger: "system (automatic when a later payment succeeds, or POST /_billing/record-payment yields outcome=SUCCEEDED on the outstanding invoice)"
        actor: system
        preconditions: []
        side_effects:
          - "Invoice → PAID; current_period_end advanced +30 days; past_due_since cleared"
          - "pending_plan (if any) is applied now: plan = pending_plan, price_cents recomputed, pending_plan cleared; FamilyGroup created if the new plan is FAMILY"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel (voluntary)"
        actor: Member
        preconditions:
          - "Subscription.status == ACTIVE or PAST_DUE (ERR_INVALID_STATE)"
          - "Member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE) — suspended members cannot self-cancel; their cancellation rides the dispute cascade"
        side_effects:
          - "Cascade: FamilyGroup dissolved — dependant members detached (family_group_id cleared)"
          - "Cascade: partner discount detached (partner_discount_id cleared; redemptions_used NOT decremented)"
          - "Cascade: member.deletion_due_at = now + BIOMETRIC_RETENTION_DAYS; BiometricRetentionLog(DELETION_SCHEDULED) appended"
          - "Service remains until current_period_end; member.status stays ACTIVE until then (no immediate status flip)"

      - from: PAST_DUE
        to: CANCELLED
        trigger: "system (daily sweep: logical clock >= past_due_since + PAST_DUE_CANCEL_DAYS) OR POST /subscriptions/{id}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as ACTIVE → CANCELLED"

  - entity: FamilyGroup
    initial_state: ACTIVE
    terminal_states: [DISSOLVED]
    transitions:
      - from: ACTIVE
        to: DISSOLVED
        trigger: "system (cascade from subscription cancellation or primary termination)"
        actor: system
        preconditions: []
        side_effects:
          - "All attached members detached; slots_used → 0"

  - entity: PartnerDiscount
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, SUSPENDED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when redemptions_used reaches max_redemptions after a successful attach)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /partner-discounts/{id}/suspend"
        actor: PartnerManager
        preconditions:
          - "PartnerDiscount.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []

  - entity: LaneVerification
    initial_state: PENDING
    terminal_states: [ESCORTED, EXPIRED]
    transitions:
      - from: PENDING
        to: ESCORTED
        trigger: "POST /lane-verifications/{id}/escort"
        actor: Ambassador
        preconditions:
          - "LaneVerification.escort_status == PENDING (ERR_INVALID_STATE)"
          - "Logical clock <= expires_at (ERR_ESCORT_WINDOW_EXPIRED)"
          - "expected_member_version == LaneVerification.version_confirmed (ERR_STALE_VERSION; the member's version must not have advanced since check-in)"
        side_effects:
          - "If federal_program == true and member.verification_level != FEDERAL_TRUSTED: member.verification_level → FEDERAL_TRUSTED (member.version incremented — this is why the OCC field pins version_confirmed)"

      - from: PENDING
        to: EXPIRED
        trigger: "system (daily sweep: logical clock > expires_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: IdentityDispute
    initial_state: OPEN
    terminal_states: [RESOLVED_CLEAR, RESOLVED_CONFIRMED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /identity-disputes/{id}/investigate"
        actor: ComplianceOfficer
        preconditions:
          - "IdentityDispute.status == OPEN (ERR_INVALID_STATE)"
        side_effects: []

      - from: OPEN
        to: RESOLVED_CLEAR
        trigger: "POST /identity-disputes/{id}/resolve (outcome=RESOLVED_CLEAR)"
        actor: ComplianceOfficer
        preconditions:
          - "IdentityDispute.status == OPEN or INVESTIGATING (ERR_INVALID_STATE)"
          - "Resolver X-User-ID != the X-User-ID that opened the dispute (ERR_SEGREGATION_OF_DUTIES)"
          - "resolution_note present (ERR_VALIDATION)"
        side_effects:
          - "Cascade: Member SUSPENDED → ACTIVE"

      - from: INVESTIGATING
        to: RESOLVED_CLEAR
        trigger: "POST /identity-disputes/{id}/resolve (outcome=RESOLVED_CLEAR)"
        actor: ComplianceOfficer
        preconditions:
          - "Same as OPEN → RESOLVED_CLEAR"
        side_effects:
          - "Same cascade as OPEN → RESOLVED_CLEAR"

      - from: OPEN
        to: RESOLVED_CONFIRMED
        trigger: "POST /identity-disputes/{id}/resolve (outcome=RESOLVED_CONFIRMED)"
        actor: ComplianceOfficer
        preconditions:
          - "IdentityDispute.status == OPEN or INVESTIGATING (ERR_INVALID_STATE)"
          - "Resolver X-User-ID != the X-User-ID that opened the dispute (ERR_SEGREGATION_OF_DUTIES)"
          - "resolution_note present (ERR_VALIDATION)"
        side_effects:
          - "Cascade: Member SUSPENDED → TERMINATED, which cascades subscription cancellation, family detach, and DELETION_SCHEDULED retention log"

      - from: INVESTIGATING
        to: RESOLVED_CONFIRMED
        trigger: "POST /identity-disputes/{id}/resolve (outcome=RESOLVED_CONFIRMED)"
        actor: ComplianceOfficer
        preconditions:
          - "Same as OPEN → RESOLVED_CONFIRMED"
        side_effects:
          - "Same cascade as OPEN → RESOLVED_CONFIRMED"

  - entity: AgreementSettlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /agreement-settlements/{id}/finalize"
        actor: PartnerManager
        preconditions:
          - "AgreementSettlement.status == DRAFT (ERR_INVALID_STATE)"
          - "period_end <= current logical date (cannot finalize a period that has not ended) (ERR_PERIOD_NOT_ENDED)"
        side_effects:
          - "fee_cents frozen at its computed value; later input corrections require a new settlement"

      - from: FINALIZED
        to: PAID
        trigger: "POST /agreement-settlements/{id}/mark-paid"
        actor: PartnerManager
        preconditions:
          - "AgreementSettlement.status == FINALIZED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: SubscriptionInvoice
    initial_state: DUE
    terminal_states: [PAID, VOID]
    transitions:
      - from: DUE
        to: PAID
        trigger: "system (POST /_billing/record-payment outcome=SUCCEEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "Subscription.current_period_end += 30 days"
          - "If subscription was PAST_DUE: PAST_DUE → ACTIVE cascade (plan change application)"

      - from: DUE
        to: VOID
        trigger: "system (subscription CANCELLED before the invoice is paid)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on parent version only
# =============================================================================
concurrency_rules:
  - rule_id: escort-stale-member-version
    parent_entity: Member
    write_endpoint: "POST /lane-verifications/{id}/escort"
    occ_field: "expected_member_version"
    description: |
      Completing an escort requires the client to present the member version it
      observed at check-in (LaneVerification.version_confirmed). If the member's
      version has advanced since — e.g., a dispute suspension or a family-slot
      change landed in between — the escort is rejected as stale. This is the
      CREATE-with-supersede analogue: two escort attempts against the same
      check-in are both legitimate in principle; only the one whose view of the
      member is current may succeed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-change-stale-subscription-version
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/change-plan"
    occ_field: "expected_subscription_version"
    description: |
      Changing a subscription's plan requires the client to present the
      subscription version it last observed. If the version has advanced since —
      e.g., a renewal invoice applied a deferred pending_plan — the change is
      rejected as stale so the client re-reads price_cents before deciding.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (8 rules)
# =============================================================================
calculations:
  - name: partner_monthly_fee
    trigger: "POST /partner-agreements/{id}/settlements (calculation_variant=AIRPORT)"
    algorithm: tiered_pricing
    formula: |
      Inputs: attributable_mrr_cents (MRR), verification_revenue_cents (REV),
              agreement.monthly_minimum_cents (F), agreement.rev_share_rate (R),
              agreement.subscription_share_rate (S).
      Evaluation order is pinned (circular-looking dependency resolved):
        1. mrr_share    = round(MRR * S, 2)      # subscription share first
        2. rev_share    = round(REV * R, 2)      # revenue share second
        3. variable_fee = mrr_share + rev_share
        4. fee_cents    = max(F, variable_fee)   # minimum guarantee applied LAST
      Rounding: each share rounds independently to 2 decimal places
      (round_half_up) BEFORE the max; rounding after the max is a different
      (forbidden) variant.
    input_set: "One ACTIVE/SUSPENDED PartnerAgreement; caller-supplied period aggregates"
    constants:
      MAX_RATE: 0.30
    precision: "integer cents; intermediate shares at 2 decimal places, round_half_up"
    variants:
      - name: venue_event_payout
        when: "Settlement is for a Venue (venue_id non-null): POST /venues/{id}/payout-settlements"
        difference: |
          fee_cents = max(VENUE_MINIMUM_CENTS,
                          round(venue_capacity_cents * VENUE_REVENUE_SHARE, 2)
                          + events_count * per_event_fee(events_count))
          where venue_capacity_cents = venue_capacity_seats * VENUE_BASE_SEAT_CENTS
          and per_event_fee(events_count) = VENUE_PER_EVENT_CENTS when
          events_count >= VENUE_EVENT_THRESHOLD else 0. The per-event fee is
          earned on ALL events once the threshold is reached (not marginal).
          Venue capacity is supplied on the request (venue_capacity_seats) and
          is NOT derived from airports. The two variants produce different
          fee_cents for identical period revenue inputs.
      - name: provisional_vs_final
        when: "Settlement in DRAFT vs FINALIZED"
        difference: "DRAFT recomputes fee_cents from current inputs on every read; FINALIZED freezes fee_cents at finalize time even if the request would recompute differently."

  - name: risk_score_update
    trigger: "POST /enrollments/{id}/submit-document (initial), POST /enrollments/{id}/review (recompute), POST /identity-disputes (recompute)"
    algorithm: weighted_scoring
    formula: |
      Additive risk points, recomputed from the member's current facts each run:
        VELOCITY:        +8  if member.document_reject_count_90d >= VELOCITY_REJECT_THRESHOLD (3)
        WATCHLIST:       +8  if (document_number, date_of_birth) pair appears on the watchlist (see POST /_fraud/watchlist)
        DOC_FORMAT:      +4  if document_number fails the MOD-7 checksum: sum of digits of the numeric portion must be divisible by 7
        SELFIE_MISMATCH: +5  if biometric_capture_ok == false on the enrollment draft
      member.risk_score = sum of firing rules. Floor 0.
      score >= RISK_BLOCK_THRESHOLD (20) at submission  → enrollment REJECTED
      score >= RISK_REVIEW_THRESHOLD (15) and < 20      → enrollment FRAUD_REVIEW
      score <  15                                       → proceeds DOCUMENT_VERIFIED
      Boundary precision: exactly 15 reviews; exactly 20 blocks (>= semantics).
    input_set: "The enrolling Member plus the Enrollment being submitted"
    constants:
      VELOCITY_REJECT_THRESHOLD: 3
      WATCHLIST_POINTS: 8
      DOC_FORMAT_POINTS: 4
      SELFIE_MISMATCH_POINTS: 5
      RISK_REVIEW_THRESHOLD: 15
      RISK_BLOCK_THRESHOLD: 20
    precision: "integer points"
    variants:
      - name: order_dependent_velocity
        when: "Comparing submission-time vs review-time evaluation"
        difference: "The velocity component reads document_reject_count_90d at evaluation time; a rejection that lands between submission and review changes the score the review decision sees. Submission-time and review-time scores legitimately differ."

  - name: invoice_amount
    trigger: "POST /subscriptions/{id}/invoices/run-cycle (invoice generation at renewal)"
    algorithm: tiered_pricing
    formula: |
      Rounding order is PINNED — per-member lines round first, then sum:
        1. base_cents = plan base price (INDIVIDUAL: 18900, FAMILY: 18900)
        2. discount_factor = (100 - discount.percent_off) / 100 when a
           PartnerDiscount is attached, else 1
        3. discounted_base = round(base_cents * discount_factor, 0)
        4. family_lines: for each dependant member (slots_used - 1 of them):
             line_cents = round(FAMILY_MEMBER_PRICE_CENTS * discount_factor, 0)
        5. amount_cents = discounted_base + sum(line_cents)
      The forbidden variant (sum then round) yields a different cent when
      percent_off produces a .5 fraction on the member lines.
      Pins: INDIVIDUAL price_cents = discounted_base; FAMILY price_cents =
      discounted_base (the member lines appear on the invoice, not on
      Subscription.price_cents).
    input_set: "The subscription, its attached discount (if any), and its FamilyGroup"
    constants:
      INDIVIDUAL_PRICE_CENTS: 18900
      FAMILY_BASE_PRICE_CENTS: 18900
      FAMILY_MEMBER_PRICE_CENTS: 9900
    precision: "integer cents; per-line round_half_up to 0 decimals, then sum"
    variants:
      - name: pro_rata_midcycle_upgrade
        when: "change-plan INDIVIDUAL -> FAMILY is always DEFERRED (pending_plan) — no pro-rata invoice is issued mid-cycle"
        difference: "FAMILY -> INDIVIDUAL applies immediately with no refund of the current period; INDIVIDUAL -> FAMILY never pro-rates: it applies at the next renewal invoice. Two valid accounting treatments (immediate pro-rata vs deferred) deliberately resolve to deferred for the upgrade direction."

  - name: lane_capacity_check
    trigger: "POST /lanes/{id}/open"
    algorithm: threshold
    formula: |
      projected = agreement.lane_capacity + lane.capacity_hours
      Allow open iff projected <= agreement.staffing_footprint_seats * AMBASSADOR_SEAT_HOURS
      Boundary: projected == limit is ALLOWED (<= semantics).
      lane_capacity counts lanes in status OPEN or MAINTENANCE only
      (PLANNED and CLOSED excluded).
    input_set: "All lanes of the agreement in status OPEN or MAINTENANCE"
    constants:
      AMBASSADOR_SEAT_HOURS: 4
    precision: "integer hours"

  - name: escort_window_check
    trigger: "POST /lane-verifications/{id}/escort"
    algorithm: threshold
    formula: |
      Allow iff logical clock <= LaneVerification.expires_at
      where expires_at = verified_at + ESCORT_WINDOW_MINUTES.
      Boundary: exactly at expires_at is ALLOWED (<= semantics);
      one minute later is ERR_ESCORT_WINDOW_EXPIRED.
    input_set: "The single LaneVerification"
    constants:
      ESCORT_WINDOW_MINUTES: 15
    precision: "minute granularity on the logical clock"

  - name: venue_event_conflict_check
    trigger: "POST /venue-events"
    algorithm: interval_merge
    formula: |
      For the same venue, let the candidate window be
      C = [start - buffer_hours, end + buffer_hours] and each existing
      non-CANCELLED event window E = [start - buffer_hours, end + buffer_hours].
      Reject ERR_EVENT_WINDOW_CONFLICT iff C and E overlap with
      strict-overlap semantics on the PADDED windows:
        overlap iff C.start < E.end AND E.start < C.end
      Touching edges (C.start == E.end or E.start == C.end) do NOT conflict
      (half-open). Buffer arithmetic means two events whose raw windows are
      disjoint by less than the sum of buffers still conflict.
    input_set: "All VenueEvents of the venue in status SCHEDULED"
    constants:
      MAX_BUFFER_HOURS: 12
    precision: "datetime comparison, second granularity"

  - name: venue_age_gate
    trigger: "POST /venue-access"
    algorithm: threshold
    formula: |
      mode = venue.access_rule_mode; age = full years between
      member.date_of_birth and logical clock date (birthday reached this year
      counts).
      ALL_MEMBERS:  admit any member with status ACTIVE.
      AGE_18_PLUS:  admit iff age >= 18.
      AGE_21_PLUS:  admit iff age >= 21.
      Boundary: a member whose 18th (resp. 21st) birthday is exactly the
      logical clock date IS admitted (>= semantics).
    input_set: "The member and the venue"
    constants:
      AGE_18: 18
      AGE_21: 21
    precision: "whole years, date granularity"

  - name: retention_due_date
    trigger: "Subscription cancellation, member termination (cascade), POST /members/{id}/biometric-deletion"
    algorithm: chronological
    formula: |
      deletion_due_at = trigger_time + BIOMETRIC_RETENTION_DAYS (30 days).
      The daily sweep purges biometric data when logical clock > deletion_due_at
      (strictly after: exactly AT deletion_due_at is NOT yet due) and appends
      BiometricRetentionLog(DELETED). Manual deletion before due date requires
      a note and is blocked while the member has an IdentityDispute in OPEN or
      INVESTIGATING (ERR_DISPUTE_OPEN).
    input_set: "Members with deletion_due_at set"
    constants:
      BIOMETRIC_RETENTION_DAYS: 30
    precision: "datetime, second granularity"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (airport before agreement before lane; subscription before family-group)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action/transition endpoints

  - priority: 5
    category: business_safety
    check: "Age floor: member must be >= 18 at enrollment submission; venue age gate per access_rule_mode at venue access"
    error_id: "ERR_MEMBER_UNDERAGE (enrollment) | ERR_AGE_RULE_VIOLATION (venue access)"
    http_status: 422
    applies_to: "POST /enrollments/{id}/submit-document, POST /venue-access"

  - priority: 6
    category: business_safety
    check: "Document validity: document_expiry strictly after logical clock date (skipped when is_re_enrollment); document_number MOD-7 checksum (feeds risk score); document_number uniqueness among verified enrollments"
    error_id: "ERR_DOCUMENT_EXPIRED | ERR_DOCUMENT_ALREADY_ENROLLED"
    http_status: 422
    applies_to: "POST /enrollments/{id}/submit-document"

  - priority: 7
    category: business_safety
    check: "Biometric safety: deletion blocked while an OPEN/INVESTIGATING IdentityDispute exists for the member; venue access requires a SCHEDULED event covering the logical clock"
    error_id: "ERR_DISPUTE_OPEN | ERR_NO_ACTIVE_EVENT"
    http_status: 409
    applies_to: "POST /members/{id}/biometric-deletion, POST /venue-access"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: IdentityDispute resolver X-User-ID must differ from the opener's X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /identity-disputes/{id}/resolve"

  - priority: 9
    category: business_constraint
    check: "Structural uniqueness and shape: one DRAFT/ACTIVE PartnerAgreement per airport; unique iata_code, kiosk code, discount code, document_number; lane position_index > 0; close_time > open_time; end_time > start_time; slots 2..3"
    error_id: "ERR_DUPLICATE_AGREEMENT | ERR_DUPLICATE_CODE | ERR_DOCUMENT_ALREADY_ENROLLED | ERR_VALIDATION"
    http_status: 409
    applies_to: "create endpoints"

  - priority: 10
    category: business_temporal
    check: "Temporal windows: agreement activation requires clock >= effective_from; kiosk completion within 24h of activation; escort within 15 minutes of check-in; venue event windows non-conflicting per venue_event_conflict_check; cancellation of event only before start"
    error_id: "ERR_AGREEMENT_NOT_YET_EFFECTIVE | ERR_KIOSK_ACTIVATION_WINDOW_EXPIRED | ERR_ESCORT_WINDOW_EXPIRED | ERR_EVENT_WINDOW_CONFLICT | ERR_EVENT_ALREADY_STARTED"
    http_status: 409
    applies_to: "activation, escort, enrollment completion, venue-event scheduling"

  - priority: 11
    category: business_referential
    check: "Cross-entity state: lane open requires agreement ACTIVE; kiosk activation requires an ACTIVE agreement at the airport; lane check-in requires lane OPEN, member ACTIVE, subscription ACTIVE or PAST_DUE, ambassador ACTIVE at the same airport; venue access requires venue ACTIVE and member ACTIVE"
    error_id: "ERR_AGREEMENT_NOT_ACTIVE | ERR_MEMBER_NOT_ACTIVE | ERR_LANE_NOT_OPEN | ERR_SUBSCRIPTION_NOT_ACTIVE | ERR_WRONG_AMBASSADOR"
    http_status: 409
    applies_to: "lane/kiosk operations, lane-verifications, venue-access"

  - priority: 12
    category: business_fiscal
    check: "Capacity and quota: lane capacity footprint (ERR_CAPACITY_EXCEEDED); family slots (ERR_FAMILY_FULL); discount redemptions and expiry (ERR_DISCOUNT_EXHAUSTED, ERR_DISCOUNT_EXPIRED); rates within (0, 0.30] (ERR_VALIDATION)"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_FAMILY_FULL | ERR_DISCOUNT_EXHAUSTED | ERR_DISCOUNT_EXPIRED | ERR_VALIDATION"
    http_status: 422
    applies_to: "lane open, family add, discount attach, agreement create"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-09-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All deadline, expiry, window, retention and sweep logic reads this clock."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["runs the daily sweep when the date advances: past-due cancellation, escort expiry, retention purge, agreement expiry"]

  # --- fraud watchlist (test-driving) ---
