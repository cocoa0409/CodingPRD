            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${d_id}/fund", payload: {}, as: LoanServicer }
          trigger:
            - { call: "POST /loans/${l_id}/interest-accruals", payload: { period_start_date: "2026-04-01", period_end_date: "2026-05-01" }, as: LoanServicer, captures: { paid: $.data.paid_from_reserve_cents } }
            - { call: "GET /loans/${l_id}/interest-ledger", as: LoanServicer }
          assert:
            - "Accrual paid_from_reserve_cents == 95000"
            - "Ledger entry 1: INITIAL_DEPOSIT amount_cents == 200000; entry 2: INTEREST_PAYMENT amount_cents == -95000"
            - "Loan.${l_id}.interest_reserve_balance_cents == 105000"
            - "Conservation: 200000 == 105000 (balance) + 95000 (paid) + 0 (swept)"
