              captures: { album_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-13T00:00:00Z", venue_distance_miles: 40, requested_setup_lead_min: 90 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${props_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${backdrop_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${album_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 493.13 }
              as: FinanceClerk
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
            - call: "POST /bookings/${bk_id}/cancel"
