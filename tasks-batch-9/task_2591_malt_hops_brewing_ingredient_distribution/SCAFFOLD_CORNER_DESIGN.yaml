          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Certified brewer with credit_limit_cents 9000000; OPEN 2026 program; Citra; a 5000 lb FIXED_CROP_YEAR contract at 250.00 for 2026-09-01 .. 2026-12-31."
