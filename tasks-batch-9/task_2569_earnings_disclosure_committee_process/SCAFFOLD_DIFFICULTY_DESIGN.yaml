  - rule_id: transitive_cascade
    instances:
      - name: tie_out_break_on_approved_document_cascades_five_hops_to_revoked_certifications
        grounds:
          - calculations.tie_out_variance_and_tolerance_escalation
          - state_machines.TieOutItem.MATCHED_to_VARIANCE
          - state_machines.DraftDocument.APPROVED_to_CHANGES_REQUESTED
          - state_machines.ReportingCycle.FILING_READY_to_REVIEW_OPEN
          - state_machines.OfficerCertification.SIGNED_to_REVOKED
          - endpoints["POST /disclosure/documents/{id}/tie-out-items"].side_effects
        distinguishing_aspect: |
          One ordinary child insert propagates through FIVE distinct entities without any further
          request: HOP 1 the new TieOutItem lands VARIANCE (750 bp against an effective tolerance of
          floor(25 * 0.50) = 12), HOP 2 the parent DraftDocument's tie_out_status flips PASSED ->
          FAILED, HOP 3 that document leaves APPROVED for CHANGES_REQUESTED with revision_round 1 and
          the system change_note, HOP 4 the owning ReportingCycle falls FILING_READY -> REVIEW_OPEN,
          HOP 5 both SIGNED OfficerCertification rows become REVOKED with signed_utc and
          attestation_text cleared while coverage_pct_at_signing survives as an audit trace. The
          first sibling item also silently re-tightens from tolerance 25 to effective 12, so a
          single-row implementation cannot reproduce the end state.
        test_recipe:
