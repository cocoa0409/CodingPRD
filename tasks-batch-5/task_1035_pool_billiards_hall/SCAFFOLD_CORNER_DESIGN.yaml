  # =================================================================
  - section: errors
    instances:
      - name: error_invalid_state_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_tournament_entry
          rationale: "ERR_INVALID_STATE is asserted as the winning error of that §1.8 priority-conflict instance."
      - name: error_event_capacity_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_EVENT_CAPACITY_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: event_aggregate_capacity_only_one_free_table
          rationale: "Triggered as the failure path of that §1.8 overlap instance."
      - name: error_table_time_conflict_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_TABLE_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: reservation_turnover_buffer_five_minute_gap_conflicts
          rationale: "Triggered by the buffered-adjacency §1.8 overlap instance."

