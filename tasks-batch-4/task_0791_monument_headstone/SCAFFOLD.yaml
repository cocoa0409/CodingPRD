# =============================================================================
# Monument & Headstone Service (human & pet) — seed tables (Expert)
# =============================================================================

scenario: |
  Monument & Headstone Service (human & pet): order & design/engraving proof,
  material/size & cemetery-spec compliance, foundation/setting & installation
  scheduling, fabrication & turnaround, deposit/balance, cemetery permit &
  placement coordination, restoration/cleaning, warranty

domain_name: monument-headstone
api_prefix: /memorials

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  # flat: peer entities linked by FK; no deep URL nesting except two reverse-reach sub-resources.
  state_machine_shape: parallel
  # MonumentOrder carries two independent axes (production_status × payment_status);
  # DesignProof carries a revision cycle (SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Cemetery
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cemetery name" }
      - { name: allowed_materials, type: array, source: input, description: "Subset of {GRANITE, BRONZE, MARBLE} permitted for markers in this cemetery" }
      - { name: max_height_cm, type: integer, source: input, description: "Maximum permitted marker height in cm (inclusive)" }
      - { name: max_width_cm, type: integer, source: input, description: "Maximum permitted marker width in cm (inclusive)" }
      - { name: max_base_width_cm, type: integer, source: input, description: "Maximum permitted foundation base width in cm (inclusive)" }
      - { name: requires_permit, type: boolean, source: input, default: true, description: "Whether a CemeteryPermit must be ISSUED before installation" }
      - { name: permit_fee_cents, type: integer, source: input, default: 0, description: "Flat permit fee added to the order contract total when requires_permit is true" }
      - { name: requires_foundation, type: boolean, source: input, default: true, description: "Whether a concrete foundation/setting is mandated" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone (optional)" }

  - name: MonumentOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owning customer. X-User-ID of the acting Customer must equal this value." }
      - { name: cemetery_id, type: string, source: input, description: "FK -> Cemetery.id; the destination cemetery whose specs the marker must satisfy." }
      - { name: subject_type, type: enum, source: input, description: "HUMAN | PET; drives engraving rate and warranty length" }
      - { name: material, type: enum, source: input, description: "GRANITE | BRONZE | MARBLE; must be in cemetery.allowed_materials" }
      - { name: height_cm, type: integer, source: input, description: "Marker height in cm; must be <= cemetery.max_height_cm" }
      - { name: width_cm, type: integer, source: input, description: "Marker width in cm; must be <= cemetery.max_width_cm" }
      - { name: base_width_cm, type: integer, source: input, description: "Foundation base width in cm; must be <= cemetery.max_base_width_cm" }
      - { name: estimated_line_char_counts, type: array, source: input, description: "Array of positive integers, one per anticipated engraving line, used to price the provisional variant at order creation" }
      - { name: production_status, type: enum, source: system, description: "DRAFTING | IN_FABRICATION | READY_TO_INSTALL | INSTALLED | CANCELLED", constraints: "initial DRAFTING" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED", constraints: "initial UNPAID; independent axis from production_status" }
      - { name: current_proof_id, type: string, source: system, description: "Id of the DesignProof that is not SUPERSEDED/VOIDED (proofs are discovered via GET /memorials/orders/{id}/design-proofs; this is a convenience pointer, not a reverse-reachability FK)" }
      - { name: provisional_merchandise_cents, type: number, source: computed, description: "Merchandise price computed from ordered dimensions and estimated_line_char_counts at creation (order_pricing provisional variant)" }
      - { name: merchandise_price_cents, type: number, source: computed, description: "Merchandise price; equals provisional until a proof is APPROVED, then recomputed from the approved proof's line_char_counts (order_pricing final variant)" }
      - { name: contract_total_cents, type: number, source: computed, description: "merchandise_price_cents + FOUNDATION_FLAT_CENTS + permit_fee_cents (see contract_and_deposit)" }
      - { name: deposit_amount_cents, type: number, source: computed, description: "round_half_up(DEPOSIT_PCT * contract_total_cents)" }
      - { name: balance_amount_cents, type: number, source: computed, description: "contract_total_cents - deposit_amount_cents" }
      - { name: amount_paid_cents, type: number, source: computed, description: "Sum of signed_amount_cents over CAPTURED Payments for this order (order_amount_paid); DEPOSIT/BALANCE add, REFUND subtracts" }
      - { name: warranty_expires_at, type: datetime, source: system, description: "Set when the Installation completes; completed_at + WARRANTY_MONTHS[subject_type] months. Null until INSTALLED." }

  - name: DesignProof
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MonumentOrder.id; the order this engraving proof belongs to" }
      - { name: engraving_text, type: string, source: input, description: "Full engraving copy shown on the proof" }
      - { name: line_char_counts, type: array, source: input, description: "Array of positive integers, one per engraving line; drives the final engraving charge" }
      - { name: layout_spec, type: string, source: input, description: "Free-text layout notes (optional)" }
      - { name: revision_round, type: integer, source: system, default: 1, description: "Increments by 1 each time the proof is re-submitted after CHANGES_REQUESTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | SUPERSEDED | VOIDED", constraints: "initial DRAFT" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MonumentOrder.id; the order this payment applies to" }
      - { name: payment_type, type: enum, source: input, description: "DEPOSIT | BALANCE (client-supplied) or REFUND (system-generated during cancel)" }
      - { name: amount_cents, type: integer, source: input, description: "Gross amount tendered in cents; must be > 0 for DEPOSIT/BALANCE" }
      - { name: signed_amount_cents, type: integer, source: computed, description: "+amount_cents for DEPOSIT/BALANCE, -amount_cents for REFUND" }
      - { name: status, type: enum, source: system, description: "CAPTURED (payments are captured synchronously at creation)" }

  - name: Workshop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fabrication/restoration workshop name" }
      - { name: booked_minutes, type: integer, source: computed, description: "Sum of duration_minutes over SCHEDULED FabricationJobs and ASSESSED RestorationJobs assigned to this workshop (workshop_booked_minutes)" }

  - name: FabricationJob
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MonumentOrder.id; the order being fabricated" }
      - { name: workshop_id, type: string, source: input, description: "FK -> Workshop.id; the workshop executing the job" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC start of the fabrication slot" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC end of the fabrication slot; must be > scheduled_start" }
      - { name: duration_minutes, type: integer, source: computed, description: "(scheduled_end - scheduled_start) in whole minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", constraints: "initial SCHEDULED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time at which the job was COMPLETED; null otherwise" }

  - name: CemeteryPermit
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MonumentOrder.id; the order the placement permit covers" }
      - { name: cemetery_id, type: string, source: input, description: "FK -> Cemetery.id; the cemetery issuing the permit; must equal the order's cemetery_id" }
      - { name: permit_number, type: string, source: input, description: "Cemetery-assigned permit reference" }
      - { name: placement_date, type: datetime, source: input, description: "ISO8601 UTC date the marker may be placed" }
      - { name: status, type: enum, source: system, description: "PENDING | ISSUED | REVOKED", constraints: "initial PENDING" }

  - name: InstallationCrew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Field installation crew name" }
      - { name: booked_minutes, type: integer, source: computed, description: "Sum of duration_minutes over SCHEDULED Installations assigned to this crew" }

  - name: Installation
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MonumentOrder.id; the order being installed" }
      - { name: crew_id, type: string, source: input, description: "FK -> InstallationCrew.id; the crew performing foundation/setting and placement" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC start of the installation slot" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC end of the installation slot; must be > scheduled_start" }
      - { name: duration_minutes, type: integer, source: computed, description: "(scheduled_end - scheduled_start) in whole minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", constraints: "initial SCHEDULED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time at which the installation was COMPLETED; null otherwise" }

  - name: RestorationJob
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MonumentOrder.id; the installed monument being restored/cleaned" }
      - { name: workshop_id, type: string, source: input, description: "FK -> Workshop.id; set when the job is ASSESSED and scheduled; null while REQUESTED" }
      - { name: service_type, type: enum, source: input, description: "CLEANING | REPAIR | REFINISH" }
      - { name: is_warranty, type: boolean, source: input, default: false, description: "Whether the customer is claiming under warranty; assessed_cost is waived to 0 when the claim falls inside the order's warranty window" }
      - { name: reported_area_cm2, type: integer, source: input, description: "Customer-reported surface area for the provisional quote" }
      - { name: measured_area_cm2, type: integer, source: input, description: "Shop-measured surface area supplied at assessment; null while REQUESTED" }
      - { name: condition, type: enum, source: input, description: "NORMAL | SEVERE; supplied at assessment; SEVERE adds a surcharge; null while REQUESTED" }
      - { name: quoted_cost_cents, type: integer, source: computed, description: "reported_area_cm2 * RESTORE_RATE_CENTS[service_type] (restoration_costing quoted variant)" }
      - { name: assessed_cost_cents, type: integer, source: computed, description: "Final cost from measured area + SEVERE surcharge, or 0 when a valid in-window warranty claim (restoration_costing assessed variant); null while REQUESTED" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC start of the workshop slot; supplied at assessment; null while REQUESTED" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC end of the workshop slot; supplied at assessment; must be > scheduled_start" }
      - { name: duration_minutes, type: integer, source: computed, description: "(scheduled_end - scheduled_start) in whole minutes; null while REQUESTED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ASSESSED | CANCELLED", constraints: "initial REQUESTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- MonumentOrder: PARALLEL DIMENSIONS (production_status × payment_status) ---
  - entity: MonumentOrder
    field: production_status
    initial_state: DRAFTING
    terminal_states: [INSTALLED, CANCELLED]
    transitions:
      - from: DRAFTING
        to: IN_FABRICATION
        trigger: "POST /memorials/fabrication-jobs"
        actor: ShopManager
        preconditions:
          - "order.production_status == DRAFTING (ERR_ORDER_NOT_DRAFTING)"
          - "order.current_proof_id's DesignProof.status == APPROVED (ERR_PROOF_NOT_APPROVED) — cross-entity dependency on DesignProof; note approving a proof does NOT itself advance production_status, so DRAFTING orders can carry a still-SUBMITTED proof"
          - "Workshop slot free: no SCHEDULED FabricationJob / ASSESSED RestorationJob overlaps [scheduled_start, scheduled_end) on the workshop (ERR_WORKSHOP_SLOT_CONFLICT)"
        side_effects:
          - "Create FabricationJob (SCHEDULED)"
          - "Workshop.booked_minutes += duration_minutes (workshop_booked_minutes)"
          - "increments MonumentOrder.version by 1"
      - from: IN_FABRICATION
        to: READY_TO_INSTALL
        trigger: "POST /memorials/fabrication-jobs/{id}/complete"
        actor: ShopManager
        preconditions:
          - "FabricationJob.status == SCHEDULED (ERR_FAB_JOB_NOT_SCHEDULED)"
        side_effects:
          - "FabricationJob.status -> COMPLETED; completed_at = logical clock now"
          - "Workshop.booked_minutes -= duration_minutes (job leaves the SCHEDULED set)"
          - "increments MonumentOrder.version by 1"
      - from: READY_TO_INSTALL
        to: INSTALLED
        trigger: "POST /memorials/installations/{id}/complete"
        actor: FieldOps
        preconditions:
          - "Installation.status == SCHEDULED (ERR_INSTALLATION_NOT_SCHEDULED)"
          - "order.payment_status == PAID_IN_FULL (ERR_BALANCE_NOT_PAID)"
        side_effects:
          - "Installation.status -> COMPLETED; completed_at = logical clock now"
          - "InstallationCrew.booked_minutes -= duration_minutes"
          - "order.warranty_expires_at = completed_at + WARRANTY_MONTHS[subject_type] months (warranty_window)"
          - "increments MonumentOrder.version by 1"
      - from: [DRAFTING, IN_FABRICATION, READY_TO_INSTALL]
        to: CANCELLED
        trigger: "POST /memorials/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "production_status not already terminal INSTALLED/CANCELLED (ERR_ORDER_ALREADY_TERMINAL)"
        side_effects:
          - "CASCADE depth-4 (order_cancel_cascade): order CANCELLED -> any SCHEDULED FabricationJob -> CANCELLED"
          - "that FabricationJob CANCELLED -> Workshop.booked_minutes -= its duration_minutes AND any SCHEDULED Installation for this order -> CANCELLED"
          - "that Installation CANCELLED -> InstallationCrew.booked_minutes -= its duration_minutes AND any PENDING/ISSUED CemeteryPermit for this order -> REVOKED"
          - "Refund branch: if amount_paid_cents > 0, create a system REFUND Payment for -amount_paid_cents so amount_paid_cents returns to 0 (compensating money invariant); payment_status -> REFUNDED"
          - "increments MonumentOrder.version by 1"

  - entity: MonumentOrder
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /memorials/payments (payment_type=DEPOSIT)"
        actor: Customer
        preconditions:
          - "amount_cents > 0 (ERR_ZERO_PAYMENT_AMOUNT)"
          - "Cumulative CAPTURED amount_paid_cents after this payment >= deposit_amount_cents (ERR_DEPOSIT_NOT_PAID)"
        side_effects:
          - "Create Payment (CAPTURED, signed +amount_cents); recompute amount_paid_cents (order_amount_paid)"
          - "increments MonumentOrder.version by 1"
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /memorials/payments (payment_type=BALANCE)"
        actor: Customer
        preconditions:
          - "amount_cents > 0 (ERR_ZERO_PAYMENT_AMOUNT)"
          - "Cumulative CAPTURED amount_paid_cents after this payment >= contract_total_cents (ERR_BALANCE_NOT_PAID)"
        side_effects:
          - "Create Payment (CAPTURED, signed +amount_cents); recompute amount_paid_cents"
          - "increments MonumentOrder.version by 1"
      - from: [DEPOSIT_PAID, PAID_IN_FULL]
        to: REFUNDED
        trigger: "system (order cancel refund branch)"
        actor: system
        preconditions: []
        side_effects:
          - "System REFUND Payment created for -amount_paid_cents; amount_paid_cents -> 0"

  # --- DesignProof: CYCLIC (revision loop) ---
  - entity: DesignProof
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /memorials/design-proofs/{id}/submit"
        actor: Designer
        preconditions:
          - "DesignProof.status == DRAFT (ERR_PROOF_NOT_DRAFT)"
        side_effects:
          - "Proof presented to customer for approval"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /memorials/design-proofs/{id}/request-changes"
        actor: Customer
        preconditions:
          - "DesignProof.status == SUBMITTED (ERR_PROOF_NOT_SUBMITTED)"
        side_effects:
          - "Customer requested edits"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /memorials/design-proofs/{id}/submit"
        actor: Designer
        preconditions:
          - "DesignProof.status == CHANGES_REQUESTED (ERR_PROOF_NOT_DRAFT)"
        side_effects:
          - "revision_round += 1 (CYCLE back to SUBMITTED)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /memorials/design-proofs/{id}/approve"
        actor: Customer
        preconditions:
          - "order.production_status == DRAFTING (ERR_ORDER_NOT_DRAFTING)"
          - "It is the order's current proof (ERR_PROOF_NOT_CURRENT)"
          - "order.payment_status != UNPAID, i.e. deposit already paid (ERR_DEPOSIT_NOT_PAID)"
        side_effects:
          - "Recompute merchandise_price_cents from this proof's line_char_counts (order_pricing final variant), then contract_total_cents, deposit_amount_cents, balance_amount_cents (contract_and_deposit). production_status is unchanged (still DRAFTING); fabrication creation is the transition out of DRAFTING."
          - "increments MonumentOrder.version by 1"
      - from: [DRAFT, SUBMITTED, CHANGES_REQUESTED]
        to: SUPERSEDED
        trigger: "system (a newer DesignProof is created for the same order)"
        actor: system
        preconditions: []
        side_effects:
          - "Prior current proof retired so the newly created proof becomes current_proof_id"
      - from: [DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED]
        to: VOIDED
        trigger: "system (parent order cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  # --- FabricationJob ---
  - entity: FabricationJob
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /memorials/fabrication-jobs/{id}/complete"
        actor: ShopManager
        preconditions:
          - "status == SCHEDULED (ERR_FAB_JOB_NOT_SCHEDULED)"
        side_effects:
          - "completed_at set; Workshop.booked_minutes -= duration_minutes; order IN_FABRICATION -> READY_TO_INSTALL"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Workshop.booked_minutes -= duration_minutes; triggers cancellation of any SCHEDULED Installation for the order"

  # --- CemeteryPermit ---
  - entity: CemeteryPermit
    field: status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /memorials/permits/{id}/issue"
        actor: FieldOps
        preconditions:
          - "status == PENDING (ERR_PERMIT_NOT_PENDING)"
          - "order marker dims still satisfy cemetery specs at issue time (ERR_EXCEEDS_CEMETERY_SPEC)"
        side_effects:
          - "Permit becomes usable as an installation precondition"
      - from: [PENDING, ISSUED]
        to: REVOKED
        trigger: "system (order cancel cascade via installation cancellation)"
        actor: system
        preconditions: []
        side_effects: []

  # --- Installation ---
  - entity: Installation
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /memorials/installations/{id}/complete"
        actor: FieldOps
        preconditions:
          - "status == SCHEDULED (ERR_INSTALLATION_NOT_SCHEDULED)"
          - "order.payment_status == PAID_IN_FULL (ERR_BALANCE_NOT_PAID)"
        side_effects:
          - "completed_at set; InstallationCrew.booked_minutes -= duration_minutes; order READY_TO_INSTALL -> INSTALLED; warranty_expires_at set (warranty_window)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "InstallationCrew.booked_minutes -= duration_minutes; triggers REVOKE of any PENDING/ISSUED CemeteryPermit for the order"

  # --- RestorationJob ---
  - entity: RestorationJob
    field: status
    initial_state: REQUESTED
    terminal_states: [ASSESSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ASSESSED
        trigger: "POST /memorials/restorations/{id}/assess"
        actor: ShopManager
        preconditions:
          - "status == REQUESTED (ERR_RESTORATION_NOT_REQUESTED)"
          - "Workshop slot free: no SCHEDULED FabricationJob / ASSESSED RestorationJob overlaps [scheduled_start, scheduled_end) on the workshop (ERR_WORKSHOP_SLOT_CONFLICT)"
        side_effects:
          - "measured_area_cm2, condition, workshop_id, scheduled_start, scheduled_end recorded"
          - "assessed_cost_cents computed (restoration_costing assessed variant); duration_minutes computed"
          - "Workshop.booked_minutes += duration_minutes"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: proof-create-stale-order
    parent_entity: MonumentOrder
    write_endpoint: "POST /memorials/design-proofs"
    occ_field: "expected_order_version"
    description: |
      Creating a new DesignProof against a MonumentOrder whose version has
      advanced since the client last observed it is rejected. Each proof
      creation legitimately supersedes the order's prior current proof and
      advances the order version; a create still carrying the previously
      observed version is therefore working from a stale view of the order
      and is rejected on the stale-version check.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: engraving_charge
    trigger: "order creation (provisional), design proof approval (final)"
    algorithm: weighted_scoring
    formula: |
      # MODE (b): nested rounding — round PER LINE, then sum.
      rate = ENGRAVE_RATE_CENTS[subject_type]
      engraving_charge_cents = 0
      for n in line_char_counts:           # provisional uses estimated_line_char_counts
        line_cents = round_half_up(n * rate * (100 - VOLUME_DISCOUNT_PCT) / 100)
        engraving_charge_cents += line_cents
      # PINNED ORDER: each line is rounded to whole cents BEFORE summation.
      # "sum the chars then round once" is explicitly NOT used and yields a
      # different total (e.g. lines [21,31], HUMAN: per-line 4463+6588=11051 vs
      # sum-then-round round(52*212.5)=11050).
    input_set: "line_char_counts of the priced source (order.estimated_line_char_counts for provisional, approved DesignProof.line_char_counts for final)"
    constants:
      ENGRAVE_RATE_CENTS: { HUMAN: 250, PET: 180 }
      VOLUME_DISCOUNT_PCT: 15
    precision: "whole cents, round_half_up, applied per line"

  - name: order_pricing
    trigger: "order creation (provisional variant), design proof approval (final variant)"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): >=3 inputs with tiered non-linear selection.
      face_area_cm2 = height_cm * width_cm
      material_component_cents = face_area_cm2 * MATERIAL_RATE_CENTS[material]
      if face_area_cm2 >= 6000:   size_multiplier_pct = 125
      elif face_area_cm2 >= 3000: size_multiplier_pct = 110
      else:                       size_multiplier_pct = 100
      material_priced_cents = round_half_up(material_component_cents * size_multiplier_pct / 100)
      merchandise_price_cents = material_priced_cents + engraving_charge_cents
    input_set: "MonumentOrder dimensions + material; engraving_charge from the matching variant source"
    constants:
      MATERIAL_RATE_CENTS: { GRANITE: 8, BRONZE: 15, MARBLE: 11 }
      SIZE_TIER_MED_CM2: 3000
      SIZE_TIER_LARGE_CM2: 6000
    precision: "whole cents, round_half_up after the tier multiplier"
    variants:
      - name: provisional
        when: "at order creation, before any proof exists"
        difference: "engraving_charge uses order.estimated_line_char_counts; stored in provisional_merchandise_cents"
      - name: final
        when: "at design proof approval (SUBMITTED -> APPROVED)"
        difference: "engraving_charge uses the approved DesignProof.line_char_counts; stored in merchandise_price_cents and re-drives contract_and_deposit"

  - name: contract_and_deposit
    trigger: "order creation and on every merchandise_price_cents recompute"
    algorithm: aggregation
    formula: |
      permit_fee_cents = cemetery.permit_fee_cents if cemetery.requires_permit else 0
      contract_total_cents = merchandise_price_cents + FOUNDATION_FLAT_CENTS + permit_fee_cents
      deposit_amount_cents = round_half_up(DEPOSIT_PCT * contract_total_cents)   # sum then round, once
      balance_amount_cents = contract_total_cents - deposit_amount_cents          # exact remainder, no independent rounding
    input_set: "single order + its cemetery config"
    constants:
      FOUNDATION_FLAT_CENTS: 45000
      DEPOSIT_PCT: 0.40
    precision: "whole cents; deposit rounded once, balance is the exact remainder so deposit + balance == contract_total_cents"

  - name: restoration_costing
    trigger: "restoration request (quoted variant), restoration assessment (assessed variant)"
    algorithm: tiered_pricing
    formula: |
      rate = RESTORE_RATE_CENTS[service_type]
      # quoted (at request):
      quoted_cost_cents = reported_area_cm2 * rate
      # assessed (at assessment):
      if is_warranty and order.production_status == INSTALLED and clock_now <= order.warranty_expires_at:
        assessed_cost_cents = 0                                  # warranty waiver
      else:
        base = measured_area_cm2 * rate
        if condition == SEVERE: base += SEVERE_SURCHARGE_CENTS
        assessed_cost_cents = base
    input_set: "single RestorationJob + owning order warranty window + logical clock"
    constants:
      RESTORE_RATE_CENTS: { CLEANING: 2, REPAIR: 6, REFINISH: 9 }
      SEVERE_SURCHARGE_CENTS: 5000
    precision: "whole cents"
    variants:
      - name: quoted
        when: "at restoration request from customer-reported area"
        difference: "uses reported_area_cm2; no surcharge, no warranty waiver; stored in quoted_cost_cents"
      - name: assessed
        when: "at shop assessment"
        difference: "uses measured_area_cm2, adds SEVERE surcharge, waives to 0 for an in-window warranty claim; stored in assessed_cost_cents"

  - name: workshop_booked_minutes
    trigger: "fabrication/restoration slot booked, completed, or cancelled"
    algorithm: aggregation
    formula: |
      booked_minutes = sum(fj.duration_minutes for fj in FabricationJob
                           where fj.workshop_id == W.id and fj.status == SCHEDULED)
                     + sum(rj.duration_minutes for rj in RestorationJob
                           where rj.workshop_id == W.id and rj.status == ASSESSED)
    input_set: "SCHEDULED FabricationJobs and ASSESSED RestorationJobs on workshop W"
    precision: "whole minutes; capacity invariant — booked_minutes always equals this sum, no drift after a cancel releases a slot"

  - name: order_amount_paid
    trigger: "any Payment created (deposit, balance, or system refund)"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum(p.signed_amount_cents for p in Payment
                              where p.order_id == O.id and p.status == CAPTURED)
      # signed_amount_cents = +amount_cents for DEPOSIT/BALANCE, -amount_cents for REFUND.
    input_set: "CAPTURED Payments for order O"
    precision: "whole cents; money invariant — amount_paid_cents always equals the signed sum of the payment ledger"

  - name: warranty_window
    trigger: "installation completion (READY_TO_INSTALL -> INSTALLED)"
    algorithm: threshold
    formula: |
      months = WARRANTY_MONTHS[subject_type]
      warranty_expires_at = add_months(installation.completed_at, months)
    input_set: "single order + its subject_type + installation.completed_at"
    constants:
      WARRANTY_MONTHS: { HUMAN: 120, PET: 60 }
    precision: "calendar months; a restoration claim with clock_now <= warranty_expires_at is in-window (inclusive boundary)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For Customer-scoped writes, X-User-ID equals the owning order's customer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /orders/{id}/cancel, POST /payments, POST /design-proofs/{id}/approve, POST /design-proofs/{id}/request-changes, POST /restorations"

  - priority: 4
    category: existence
    check: "Path and body resource ids exist, validated left-to-right"
    error_id: "ERR_ORDER_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND / ERR_CEMETERY_NOT_FOUND / ERR_PROOF_NOT_FOUND / ERR_WORKSHOP_NOT_FOUND / ERR_FAB_JOB_NOT_FOUND / ERR_PERMIT_NOT_FOUND / ERR_CREW_NOT_FOUND / ERR_INSTALLATION_NOT_FOUND / ERR_RESTORATION_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints carrying ids

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, schedule end > start (ERR_INVALID_SCHEDULE_WINDOW), permit cemetery_id equals order.cemetery_id"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_SCHEDULE_WINDOW"
    http_status: 400
    applies_to: all writes

  - priority: 6
    category: state
    check: "Target resource in the correct state for the transition (proof current+SUBMITTED/DRAFT, order production/payment axis, fab/installation/permit/restoration status)"
    error_id: "ERR_ORDER_NOT_DRAFTING / ERR_ORDER_ALREADY_TERMINAL / ERR_PROOF_NOT_SUBMITTED / ERR_PROOF_NOT_DRAFT / ERR_PROOF_NOT_CURRENT / ERR_FAB_JOB_NOT_SCHEDULED / ERR_INSTALLATION_NOT_SCHEDULED / ERR_PERMIT_NOT_PENDING / ERR_RESTORATION_NOT_REQUESTED"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_safety
    check: "Cemetery-spec compliance: material in cemetery.allowed_materials; height_cm <= max_height_cm; width_cm <= max_width_cm; base_width_cm <= max_base_width_cm"
    error_id: "ERR_MATERIAL_NOT_ALLOWED / ERR_EXCEEDS_CEMETERY_SPEC"
    http_status: 422
    applies_to: "POST /orders, POST /permits/{id}/issue"

  - priority: 8
    category: business_temporal
    check: "Installation scheduled_start is at or after the order's FabricationJob.completed_at and at or after the ISSUED permit.placement_date"
    error_id: ERR_INSTALL_BEFORE_FAB_READY
    http_status: 409
    applies_to: "POST /installations"

  - priority: 9
    category: business_constraint
    check: "Resource temporal overlap: FabricationJob/RestorationJob half-open [start,end) must not overlap another slot on the same Workshop (adjacency end==start allowed); Installation must be separated from every other SCHEDULED slot on the same InstallationCrew by >= CREW_BUFFER_MINUTES (60 minutes), so a new slot needs new.start >= existing.end + 60min OR new.end + 60min <= existing.start (adjacency NOT allowed)"
    error_id: "ERR_WORKSHOP_SLOT_CONFLICT / ERR_CREW_SLOT_CONFLICT"
    http_status: 409
    applies_to: "POST /fabrication-jobs, POST /restorations/{id}/assess, POST /installations"

  - priority: 10
    category: business_referential
    check: "Cross-entity state gate: fabrication requires order's current DesignProof APPROVED; installation requires the order's CemeteryPermit ISSUED"
    error_id: "ERR_PROOF_NOT_APPROVED / ERR_PERMIT_NOT_ISSUED"
    http_status: 409
    applies_to: "POST /fabrication-jobs, POST /installations"

  - priority: 11
    category: business_fiscal
    check: "Deposit/balance sufficiency: proof approval requires deposit paid; DEPOSIT payment must reach deposit_amount_cents; BALANCE payment must reach contract_total_cents; installation completion requires PAID_IN_FULL; amount_cents > 0"
    error_id: "ERR_DEPOSIT_NOT_PAID / ERR_BALANCE_NOT_PAID / ERR_ZERO_PAYMENT_AMOUNT"
    http_status: 402
    applies_to: "POST /design-proofs/{id}/approve, POST /payments, POST /installations/{id}/complete"

  - priority: 12
    category: business_constraint
    check: "Optimistic concurrency: expected_order_version on design-proof creation must equal the order's current version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /design-proofs"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Config / roots (Admin) ---
  - method: POST
    path: "/memorials/cemeteries"
    description: "Register a cemetery and its marker specs"
    roles: [Admin]
    code: 201
    input: [name, allowed_materials, max_height_cm, max_width_cm, max_base_width_cm, "requires_permit?", "permit_fee_cents?", "requires_foundation?"]
    output: Cemetery
    side_effects: []

  - method: POST
    path: "/memorials/customers"
    description: "Register a customer"
    roles: [Admin]
    code: 201
    input: [full_name, email, "phone?"]
    output: Customer
    side_effects: []

  - method: POST
    path: "/memorials/workshops"
    description: "Register a fabrication/restoration workshop"
    roles: [Admin]
    code: 201
    input: [name]
    output: Workshop
    side_effects: ["booked_minutes initialized to 0"]

  - method: POST
    path: "/memorials/crews"
    description: "Register an installation crew"
    roles: [Admin]
    code: 201
    input: [name]
    output: InstallationCrew
    side_effects: ["booked_minutes initialized to 0"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (test-driving). Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["Logical clock advanced; used for completed_at stamps and warranty-window checks"]

  # --- MonumentOrder ---
  - method: POST
    path: "/memorials/orders"
    description: "Create a monument order; prices the provisional variant and computes deposit"
    roles: [Customer]
    code: 201
    input: [customer_id, cemetery_id, subject_type, material, height_cm, width_cm, base_width_cm, estimated_line_char_counts]
    output: MonumentOrder
    side_effects:
      - "production_status=DRAFTING, payment_status=UNPAID"
      - "Cemetery-spec compliance validated (material + dims)"
      - "provisional_merchandise_cents, merchandise_price_cents, contract_total_cents, deposit_amount_cents, balance_amount_cents computed (order_pricing provisional, contract_and_deposit)"

  - method: GET
    path: "/memorials/orders/{id}"
    description: "Fetch an order"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: []
    output: MonumentOrder
    side_effects: []

  - method: GET
    path: "/memorials/orders"
    description: "List orders, filterable by cemetery_id / customer_id (FK reverse-reachability for cemetery_id and customer_id)"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: ["cemetery_id?", "customer_id?", "limit?", "offset?"]
    output: "MonumentOrder[]"
    side_effects: []

  - method: POST
    path: "/memorials/orders/{id}/cancel"
    description: "Cancel an order; runs the depth-4 cancel cascade and refund branch"
    roles: [Customer]
    code: 200
    input: []
    output: MonumentOrder
    side_effects:
      - "production_status -> CANCELLED"
      - "Cascade: FabricationJob -> CANCELLED -> Workshop.booked_minutes released + Installation -> CANCELLED -> InstallationCrew.booked_minutes released + CemeteryPermit -> REVOKED"
      - "All non-terminal DesignProofs for the order -> VOIDED"
      - "Refund branch: REFUND Payment for -amount_paid_cents; payment_status -> REFUNDED"
      - "increments MonumentOrder.version by 1"

  # --- DesignProof ---
  - method: POST
    path: "/memorials/design-proofs"
    description: "Create an engraving design proof for an order; supersedes the prior current proof (OCC on order version)"
    roles: [Designer]
    code: 201
    input: [order_id, expected_order_version, engraving_text, line_char_counts, "layout_spec?"]
    output: DesignProof
    side_effects:
      - "New proof status=DRAFT, revision_round=1, becomes order.current_proof_id"
      - "Prior current proof (if any, non-terminal) -> SUPERSEDED"
      - "increments MonumentOrder.version by 1"

  - method: GET
    path: "/memorials/orders/{id}/design-proofs"
    description: "List an order's design proofs (FK reverse-reachability for DesignProof.order_id)"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "DesignProof[]"
    side_effects: []

  - method: POST
    path: "/memorials/design-proofs/{id}/submit"
    description: "Submit or re-submit a proof (DRAFT/CHANGES_REQUESTED -> SUBMITTED)"
    roles: [Designer]
    code: 200
    input: []
    output: DesignProof
    side_effects: ["status -> SUBMITTED; from CHANGES_REQUESTED increments revision_round"]

  - method: POST
    path: "/memorials/design-proofs/{id}/approve"
    description: "Approve a submitted proof (Customer); recomputes final price. Requires order still DRAFTING and deposit paid. Does NOT advance production_status."
    roles: [Customer]
    code: 200
    input: []
    output: DesignProof
    side_effects:
      - "status -> APPROVED"
      - "merchandise_price_cents recomputed (order_pricing final) then contract_and_deposit re-run"
      - "increments MonumentOrder.version by 1"

  - method: POST
    path: "/memorials/design-proofs/{id}/request-changes"
    description: "Request changes on a submitted proof (Customer); SUBMITTED -> CHANGES_REQUESTED"
    roles: [Customer]
    code: 200
    input: []
    output: DesignProof
    side_effects: ["status -> CHANGES_REQUESTED"]

  # --- Payment ---
  - method: POST
    path: "/memorials/payments"
    description: "Record a deposit or balance payment for an order"
    roles: [Customer]
    code: 201
    input: [order_id, payment_type, amount_cents]
    output: Payment
    side_effects:
      - "Payment CAPTURED with signed_amount_cents; amount_paid_cents recomputed (order_amount_paid)"
      - "payment_status advances UNPAID->DEPOSIT_PAID or DEPOSIT_PAID->PAID_IN_FULL on threshold"
      - "increments MonumentOrder.version by 1"

  - method: GET
    path: "/memorials/orders/{id}/payments"
    description: "List an order's payments (FK reverse-reachability for Payment.order_id)"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  # --- FabricationJob ---
  - method: POST
    path: "/memorials/fabrication-jobs"
    description: "Schedule fabrication on a workshop; advances order to IN_FABRICATION"
    roles: [ShopManager]
    code: 201
    input: [order_id, workshop_id, scheduled_start, scheduled_end]
    output: FabricationJob
    side_effects:
      - "Requires order DRAFTING with current proof APPROVED (cross-entity)"
      - "Workshop half-open overlap check"
      - "status=SCHEDULED; Workshop.booked_minutes += duration_minutes; order -> IN_FABRICATION"
      - "increments MonumentOrder.version by 1"

  - method: GET
    path: "/memorials/fabrication-jobs/{id}"
    description: "Fetch a fabrication job"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: []
    output: FabricationJob
    side_effects: []

  - method: GET
    path: "/memorials/fabrication-jobs"
    description: "List fabrication jobs, filterable by order_id / workshop_id (FK reverse-reachability)"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: ["order_id?", "workshop_id?", "limit?", "offset?"]
    output: "FabricationJob[]"
    side_effects: []

  - method: POST
    path: "/memorials/fabrication-jobs/{id}/complete"
    description: "Complete a fabrication job; advances order to READY_TO_INSTALL"
    roles: [ShopManager]
    code: 200
    input: []
    output: FabricationJob
    side_effects:
      - "status -> COMPLETED; completed_at set; Workshop.booked_minutes -= duration_minutes; order IN_FABRICATION -> READY_TO_INSTALL"
      - "increments MonumentOrder.version by 1"

  # --- CemeteryPermit ---
  - method: POST
    path: "/memorials/permits"
    description: "Open a placement permit for an order at its cemetery"
    roles: [FieldOps]
    code: 201
    input: [order_id, cemetery_id, permit_number, placement_date]
    output: CemeteryPermit
    side_effects: ["status=PENDING; cemetery_id must equal order.cemetery_id"]

  - method: GET
    path: "/memorials/permits/{id}"
    description: "Fetch a permit"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: []
    output: CemeteryPermit
    side_effects: []

  - method: GET
    path: "/memorials/permits"
    description: "List permits, filterable by order_id / cemetery_id (FK reverse-reachability)"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: ["order_id?", "cemetery_id?", "limit?", "offset?"]
    output: "CemeteryPermit[]"
    side_effects: []

  - method: POST
    path: "/memorials/permits/{id}/issue"
    description: "Issue a pending permit after re-checking cemetery-spec compliance"
    roles: [FieldOps]
    code: 200
    input: []
    output: CemeteryPermit
    side_effects: ["status PENDING -> ISSUED"]

  # --- Installation ---
  - method: POST
    path: "/memorials/installations"
    description: "Schedule foundation/setting + installation on a crew"
    roles: [FieldOps]
    code: 201
    input: [order_id, crew_id, scheduled_start, scheduled_end]
    output: Installation
    side_effects:
      - "Requires order READY_TO_INSTALL, ISSUED permit (cross-entity), scheduled_start after fabrication completed_at and permit placement_date"
      - "InstallationCrew buffered-overlap check (>= CREW_BUFFER_MINUTES = 60 minutes between slots)"
      - "status=SCHEDULED; InstallationCrew.booked_minutes += duration_minutes"

  - method: GET
    path: "/memorials/installations/{id}"
    description: "Fetch an installation"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: []
    output: Installation
    side_effects: []

  - method: GET
    path: "/memorials/installations"
    description: "List installations, filterable by order_id / crew_id (FK reverse-reachability)"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: ["order_id?", "crew_id?", "limit?", "offset?"]
    output: "Installation[]"
    side_effects: []

  - method: POST
    path: "/memorials/installations/{id}/complete"
    description: "Complete an installation; advances order to INSTALLED and opens the warranty window"
    roles: [FieldOps]
    code: 200
    input: []
    output: Installation
    side_effects:
      - "Requires order PAID_IN_FULL (fiscal)"
      - "status -> COMPLETED; completed_at set; InstallationCrew.booked_minutes -= duration_minutes; order READY_TO_INSTALL -> INSTALLED; warranty_expires_at set"
      - "increments MonumentOrder.version by 1"

  # --- RestorationJob ---
  - method: POST
    path: "/memorials/restorations"
    description: "Request restoration/cleaning for an installed monument; prices the provisional quote"
    roles: [Customer]
    code: 201
    input: [order_id, service_type, "is_warranty?", reported_area_cm2]
    output: RestorationJob
    side_effects: ["status=REQUESTED; quoted_cost_cents computed (restoration_costing quoted)"]

  - method: GET
    path: "/memorials/restorations/{id}"
    description: "Fetch a restoration job"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: []
    output: RestorationJob
    side_effects: []

  - method: GET
    path: "/memorials/restorations"
    description: "List restoration jobs, filterable by order_id / workshop_id (FK reverse-reachability)"
    roles: [Admin, Customer, Designer, ShopManager, FieldOps]
    code: 200
    input: ["order_id?", "workshop_id?", "limit?", "offset?"]
    output: "RestorationJob[]"
    side_effects: []

  - method: POST
    path: "/memorials/restorations/{id}/assess"
    description: "Assess a restoration job, schedule it on a workshop, and finalize cost"
    roles: [ShopManager]
    code: 200
    input: [workshop_id, measured_area_cm2, condition, scheduled_start, scheduled_end]
    output: RestorationJob
    side_effects:
      - "status REQUESTED -> ASSESSED; Workshop half-open overlap check"
      - "assessed_cost_cents computed (restoration_costing assessed, warranty waiver when in-window); duration_minutes computed"
      - "Workshop.booked_minutes += duration_minutes"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Customer's X-User-ID does not match the owning order's customer_id" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "MonumentOrder id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_CEMETERY_NOT_FOUND, http: 404, condition: "Cemetery id does not exist" }
  - { id: ERR_PROOF_NOT_FOUND, http: 404, condition: "DesignProof id does not exist" }
  - { id: ERR_WORKSHOP_NOT_FOUND, http: 404, condition: "Workshop id does not exist" }
  - { id: ERR_FAB_JOB_NOT_FOUND, http: 404, condition: "FabricationJob id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "CemeteryPermit id does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "InstallationCrew id does not exist" }
  - { id: ERR_INSTALLATION_NOT_FOUND, http: 404, condition: "Installation id does not exist" }
  - { id: ERR_RESTORATION_NOT_FOUND, http: 404, condition: "RestorationJob id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, or invalid enum member" }
  - { id: ERR_INVALID_SCHEDULE_WINDOW, http: 400, condition: "scheduled_end <= scheduled_start" }
  - { id: ERR_ZERO_PAYMENT_AMOUNT, http: 402, condition: "amount_cents <= 0 on a DEPOSIT/BALANCE payment" }
  - { id: ERR_MATERIAL_NOT_ALLOWED, http: 422, condition: "Order material not in cemetery.allowed_materials" }
  - { id: ERR_EXCEEDS_CEMETERY_SPEC, http: 422, condition: "height/width/base_width exceeds the cemetery maximum" }
  - { id: ERR_ORDER_NOT_DRAFTING, http: 409, condition: "Approve/fabrication attempted while the order is not in DRAFTING" }
  - { id: ERR_ORDER_ALREADY_TERMINAL, http: 409, condition: "Cancel attempted on an INSTALLED or CANCELLED order" }
  - { id: ERR_PROOF_NOT_DRAFT, http: 409, condition: "Submit attempted on a proof not in DRAFT/CHANGES_REQUESTED" }
  - { id: ERR_PROOF_NOT_SUBMITTED, http: 409, condition: "Approve/request-changes attempted on a proof not in SUBMITTED" }
  - { id: ERR_PROOF_NOT_CURRENT, http: 409, condition: "Approve attempted on a SUPERSEDED/non-current proof" }
  - { id: ERR_PROOF_NOT_APPROVED, http: 409, condition: "Fabrication scheduling requires the order's current proof to be APPROVED" }
  - { id: ERR_FAB_JOB_NOT_SCHEDULED, http: 409, condition: "Complete attempted on a fabrication job not in SCHEDULED" }
  - { id: ERR_INSTALLATION_NOT_SCHEDULED, http: 409, condition: "Complete attempted on an installation not in SCHEDULED" }
  - { id: ERR_PERMIT_NOT_PENDING, http: 409, condition: "Issue attempted on a permit not in PENDING" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "Installation scheduling requires an ISSUED permit for the order" }
  - { id: ERR_RESTORATION_NOT_REQUESTED, http: 409, condition: "Assess attempted on a restoration not in REQUESTED" }
  - { id: ERR_INSTALL_BEFORE_FAB_READY, http: 409, condition: "Installation scheduled_start precedes fabrication completed_at or permit placement_date" }
  - { id: ERR_WORKSHOP_SLOT_CONFLICT, http: 409, condition: "Fabrication/restoration slot overlaps another slot on the workshop (half-open)" }
  - { id: ERR_CREW_SLOT_CONFLICT, http: 409, condition: "Installation slot is not separated from another crew slot by CREW_BUFFER_MINUTES" }
  - { id: ERR_DEPOSIT_NOT_PAID, http: 402, condition: "Deposit not yet satisfied (approval requires deposit; DEPOSIT payment below deposit_amount_cents)" }
  - { id: ERR_BALANCE_NOT_PAID, http: 402, condition: "Balance unpaid (BALANCE payment below contract_total_cents; installation completion requires PAID_IN_FULL)" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version on design-proof creation does not match the order's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Operator; provisions cemeteries, customers, workshops, crews, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /memorials/cemeteries"
      - "POST /memorials/customers"
      - "POST /memorials/workshops"
      - "POST /memorials/crews"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (all reads)"

  - name: Customer
    description: "The person or family placing the order; approves proofs, pays, cancels, requests restoration"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /memorials/orders"
      - "POST /memorials/orders/{id}/cancel"
      - "POST /memorials/design-proofs/{id}/approve"
      - "POST /memorials/design-proofs/{id}/request-changes"
      - "POST /memorials/payments"
      - "POST /memorials/restorations"
    shared_operations:
      - "GET endpoints (all reads)"

  - name: Designer
    description: "Design studio; drafts, submits, and revises engraving proofs"
    identity: "opaque"
    exclusive_operations:
      - "POST /memorials/design-proofs"
      - "POST /memorials/design-proofs/{id}/submit"
    shared_operations:
      - "GET endpoints (all reads)"

  - name: ShopManager
    description: "Fabrication/restoration shop; schedules and completes fabrication, assesses restoration"
    identity: "opaque"
    exclusive_operations:
      - "POST /memorials/fabrication-jobs"
      - "POST /memorials/fabrication-jobs/{id}/complete"
      - "POST /memorials/restorations/{id}/assess"
    shared_operations:
      - "GET endpoints (all reads)"

  - name: FieldOps
    description: "Field coordinator; permits, foundation/installation scheduling and completion"
    identity: "opaque"
    exclusive_operations:
      - "POST /memorials/permits"
      - "POST /memorials/permits/{id}/issue"
      - "POST /memorials/installations"
      - "POST /memorials/installations/{id}/complete"
    shared_operations:
      - "GET endpoints (all reads)"
