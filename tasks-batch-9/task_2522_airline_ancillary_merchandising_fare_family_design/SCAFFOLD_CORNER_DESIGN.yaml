              captures: { err_demand: $.data.error_id }
          assert:
            - "all four responses are HTTP 409 with error_id \"ERR_FLIGHT_ALREADY_DEPARTED\""
            - "GET /flights/${fl_id} still reports sales_phase \"DEPARTED\", demand_tier \"LOW\", booked_load_factor_pct 0 and active_waiver_count 0"
            - "GET /seat-segments?flight_id=${fl_id} returns total_count == 0 and GET /bookings?flight_id=${fl_id} returns total_count == 0"
            - "Flight.version is unchanged by the four refused writes (it stands at 4 from the three advances)"

