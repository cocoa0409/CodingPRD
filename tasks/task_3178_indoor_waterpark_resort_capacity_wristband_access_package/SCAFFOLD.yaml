    input: [attraction_id, sampled_at, ph_reading, free_chlorine_ppm, turbidity_ntu]
    output: WaterQualityLog
    side_effects:
      - "log_status=FAIL when pH outside [7.2, 7.8], or free chlorine outside [1.0, 3.0] ppm, or turbidity above 1.0 NTU; PASS otherwise"
      - "On FAIL only: every Wristband with valid_on_service_date == the resort's current service date and wristband_status IN {ISSUED, ACTIVE} → REVOKED, access_status=DENIED, access_denied_reason='WATER_QUALITY_CLOSED', room_charge_enabled=false, arcade_credit_limit_cents=0"
      - "On FAIL only: every SUCCEEDED ArcadeCreditGrant on those bands → DECLINED with decline_reason='WRISTBAND_REVOKED'"
      - "On FAIL only: every linked Attraction.attraction_status recomputed to CLOSED, treating the closed pool as contributing zero staffers"
      - "Resort.pool_posture recomputed from WaterQualityLog rows carrying log_status=FAIL and superseded_at null"
      - "Increments Resort.version by 1"

  - method: GET
    path: "/resorts/{resort_id}/water-quality-logs"
    description: "List water quality readings, optionally filtered by attraction"
