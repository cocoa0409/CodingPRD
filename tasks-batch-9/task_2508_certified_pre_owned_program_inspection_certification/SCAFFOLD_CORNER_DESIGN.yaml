      - name: duplicate_natural_keys_rejected_within_their_scopes
        claim_type: violation_to_error
        grounds:
          - validations.priority_25
          - errors.ERR_DUPLICATE_RESOURCE
        distinguishing_aspect: |
          Each natural key has its own scope, and the negative controls are what matter: item_code is
          unique per template so the same P1 is legal on a second template, and credential_id is
          unique per dealer so the same CR-1 is legal under a second dealer. Global uniqueness applies
          only to Dealer.franchise_code, Vehicle.vin and ChecklistTemplate.code.
        test_recipe:
          setup:
            - "Dealer D1 (franchise FR-1001) with technician CR-1, dealer D2 (franchise FR-2002), templates MPI-172 (item P1) and MPI-OTHER, and vehicle V1."
