            - call: "POST /api/distribution-statements/${stmt_occ}/amend"
              payload: { expected_statement_version: "${stmt_v}" }
              as: GroupFinancialController
              as_user_id: "gfc-lena"
              captures: { error_id: $.data.error_id }
            - call: "POST /api/distribution-statements/${stmt_occ}/amend"
              payload: { expected_statement_version: "${stmt_v2}" }
              as: GroupFinancialController
              as_user_id: "gfc-lena"
          assert:
            - "first amend succeeds and returns version stmt_v + 1 (status AMENDED)"
            - "second amend with the stale version returns 412 and error_id == ERR_STALE_VERSION"
            - "third amend with the current version stmt_v2 succeeds (AMENDED -> AMENDED re-amend is a declared transition) and returns version stmt_v2 + 1"

      - name: contract_termination_cascades_enrollment_terminations
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PayerContract.ACTIVE_to_TERMINATED
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Terminating the payer contract cascades one hop to every non-terminal enrollment on that contract — including enrollments belonging to a DIFFERENT practice — stamping termination_date from the clock; enrollments on other contracts are untouched."
        test_recipe:
          setup: ["Base affiliated setup with EFFECTIVE enrollment on contract A; a second ACTIVE contract B with its own EFFECTIVE enrollment for the same provider; clock 2026-09-01."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
            - *c_wave
            - *c_wave_lock
            - *c_wave_start
            - *c_practice
            - *c_agreement
            - *c_agreement_exec
            - *c_provider
            - *c_contract
            - *c_rate
            - *c_vote
            - *c_vote_cast
            - *c_contract_act
            - *c_enrollment
            - *c_enroll_approve
            - *c_wave_complete
            - call: "POST /api/payer-contracts"
              payload: { medical_group_id: "${mg_id}", payer_name: "Trinity Health", contract_type: "FEE_FOR_SERVICE", effective_date: "2026-09-01" }
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
              captures: { pcb_id: $.data.id }
            - call: "POST /api/fee-schedule-rates"
              payload: { payer_contract_id: "${pcb_id}", cpt_code: "99213", legacy_rate_cents: 10000, group_rate_cents: 10800 }
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
            - call: "POST /api/committee-votes"
              payload: { market_id: "${mkt_id}", motion_type: "PAYER_CONTRACT_RATIFICATION", subject_contract_id: "${pcb_id}" }
              as: MarketCommitteeChair
              as_user_id: "${prov_id}"
              captures: { vote_b: $.data.id }
            - call: "POST /api/committee-votes/${vote_b}/cast"
              payload: { ballot: "FOR" }
              as: PhysicianBoardMember
              as_user_id: "${prov_id}"
            - call: "POST /api/payer-contracts/${pcb_id}/activate"
              payload: {}
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
            - call: "POST /api/credentialing-enrollments"
              payload: { provider_id: "${prov_id}", payer_contract_id: "${pcb_id}", channel: "STANDARD", requested_effective_date: "2026-12-01" }
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
              captures: { enr_b: $.data.id }
            - call: "POST /api/credentialing-enrollments/${enr_b}/approve"
              payload: {}
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
          trigger:
            - call: "POST /api/payer-contracts/${pcb_id}/terminate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
          assert:
            - "PayerContract.${pcb_id}.status == TERMINATED"
            - "Cascade: CredentialingEnrollment.${enr_b}.status == TERMINATED with termination_date == \"2026-09-01\" (clock date)"
            - "Untouched: CredentialingEnrollment.${enr_id} (contract A) remains EFFECTIVE"
            - "Provider.${prov_id} remains ACTIVE — the contract cascade does not deactivate providers"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: finalize_effects_visible_in_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/api/distribution-statements/{id}/finalize
        distinguishing_aspect: "Immediate consistency: the finalize response body itself carries the recomputed final-variant fields (gross, fee, net, payout, carry-out) — no re-read is needed to observe the mutation, and a subsequent GET returns identical values."
        test_recipe:
          setup: ["Base affiliated setup; one batch settled at 30,000,000 clean; statement created."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
            - *c_wave
            - *c_wave_lock
            - *c_wave_start
            - *c_practice
            - *c_agreement
            - *c_agreement_exec
            - *c_provider
            - *c_contract
            - *c_rate
            - *c_vote
            - *c_vote_cast
            - *c_contract_act
            - *c_enrollment
            - *c_enroll_approve
            - *c_wave_complete
            - call: "POST /api/collection-batches"
              payload: { practice_id: "${prac_id}", payer_contract_id: "${pc_id}", period: "2026-09", posted_amount_cents: 30000000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { b_ic: $.data.id }
            - call: "POST /api/collection-batches/${b_ic}/settle"
              payload: { denial_amount_cents: 0 }
              as: DistributionAccountant
              as_user_id: "da-roy"
            - call: "POST /api/distribution-statements"
              payload: { practice_id: "${prac_id}", period: "2026-09" }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { stmt_ic: $.data.id }
          trigger:
            - call: "POST /api/distribution-statements/${stmt_ic}/finalize"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
              captures: { fin_net: $.data.net_distribution_cents }
          assert:
            - "the finalize response itself has status FINAL_ISSUED with gross_collections_cents 30000000, shared_services_fee_cents 2100000, net_distribution_cents 27900000"
            - "a following GET /api/distribution-statements/${stmt_ic} returns identical values (no drift, no recompute lag)"
            - "payout_cents == 27900000 and carried_forward_out_cents == 0"
