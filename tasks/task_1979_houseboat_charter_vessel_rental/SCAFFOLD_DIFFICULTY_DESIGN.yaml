  - rule_id: compensating_invariant
    instances:
      - name: deposit_conservation_through_settlement
        grounds:
          - state_machines.Booking.deposit_status
          - state_machines.Booking.RETURNED_to_CLOSED
          - calculations.settlement_total
          - entities.Booking.fields.deposit_applied_cents
          - entities.Booking.fields.deposit_released_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY: the forward action (apply deposit to the 78000 net settlement)
          paired with the compensating action (release the remainder) conserves the captured deposit:
          deposit_applied_cents + deposit_released_cents == deposit_held_cents == 200000 with zero
          drift. Different conserved quantity than the sibling's vessel-night inventory.
        test_recipe:
          setup:
            - "STANDARD_44 vessel (tank 200) with PEAK rate; qualified renter; booking 2026-08-10 -> 2026-08-15 (quoted 325000, deposit 200000) CHECKED_OUT at gauge 80 with pump-out done"
          setup_api_calls:
            - call: "POST /vessels"
              payload: { name: "Standard Fifteen", size_class: "STANDARD_44", berth_count: 6, home_marina: "Bullfrog", fuel_tank_capacity_gallons: 200 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /season-rates"
              payload: { size_class: "STANDARD_44", season: "PEAK", start_date: "2026-06-01", end_date: "2026-08-31", nightly_rate_cents: 65000, weekly_discount_pct: 10 }
              as: FleetManager
