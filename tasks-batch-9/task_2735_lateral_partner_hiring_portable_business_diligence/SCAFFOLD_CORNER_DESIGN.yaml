      - name: direct_adverse_check_cannot_be_cleared_directly
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_DIRECT_ADVERSE_REQUIRES_WAIVER]
          - state_machines.ConflictCheck.PENDING_to_CLEAR
          - entities.ConflictCheck.fields.severity
        distinguishing_aspect: |
          Priority 11 has two distinct violating shapes and BOTH must map to the same
          error_id: a bare clear of a DIRECT_ADVERSE check, and a waiver request that tries
          to launder the same check through waiver_strategy ETHICAL_WALL. The check stays
          PENDING after both attempts, so no partial write leaks, and the clearance
          dimension stays IN_PROGRESS rather than advancing.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup, one ACTIVE SearchFirmEngagement, one Candidate in DILIGENCE."
            - "The SLIM BOOK: one ACTIVE ClientBookEntry 'Northwind Holdings' with three VERIFIED HISTORICAL CollectionRecord rows, VALIDATED at 1269000.00 by a CURRENT PortabilityAssessment."
