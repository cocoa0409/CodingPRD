scenario: |
  Bulky Item & Special Curbside Collection (municipal solid waste department):
  resident request intake & allowance per household/year, item eligibility &
  preparation instructions, appointment scheduling & route assignment,
  oversize/appliance (refrigerant) handling & fee, illegal dumping vs authorized
  set-out determination, missed/refused pickup notification & reason codes,
  disposal/recycling routing by item type, seasonal amnesty week surge

domain_name: bulky-curbside-collection
api_prefix: /curbside

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: street_address
        type: string
        source: input
        description: "Service address; must be a single-family residential address inside the service territory"
      - name: service_zone
        type: enum
        source: input
        description: "Collection zone determining route eligibility"
        constraints: "enum {ZONE_NORTH, ZONE_SOUTH, ZONE_EAST, ZONE_WEST}"
      - name: status
        type: enum
        source: system
        description: "Household account status"
        default: ACTIVE
        constraints: "enum {ACTIVE, SUSPENDED}; SUSPENDED blocks all new requests"
      - name: annual_allowance_items
        type: integer
        source: input
        description: "Free-item allowance per calendar year for this household"
        default: 4
        constraints: "integer >= 0"
      - name: suspension_reason
        type: string
        source: system
        description: "Set when status transitions to SUSPENDED (e.g., confirmed illegal dumping)"
        default: null

  - name: HouseholdAllowance
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this ledger row tracks"
      - name: calendar_year
        type: integer
        source: input
        description: "Calendar year (from logical clock) this ledger row covers"
      - name: items_consumed
        type: integer
        source: computed
        description: "Items consumed by PickupRequests in {SCHEDULED, COMPLETED, REFUSED} whose scheduled_date falls in calendar_year"
        default: 0
      - name: items_released
        type: integer
        source: computed
        description: "Cumulative items returned to the pool by CANCELLED requests in calendar_year (audit counter; never decrements items_consumed directly — see calculations.allowance_ledger)"
        default: 0
      - name: over_allowance_items
        type: integer
        source: computed
        description: "Cumulative items accepted beyond the free allowance in calendar_year (fee-bearing)"
        default: 0

  - name: AmnestyWindow
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Human-readable window name, e.g. 'Fall Amnesty Week 2026'"
      - name: starts_at
        type: datetime
        source: input
        description: "Window start, inclusive lower bound of half-open interval [starts_at, ends_at)"
      - name: ends_at
        type: datetime
        source: input
        description: "Window end, exclusive upper bound of half-open interval [starts_at, ends_at)"
      - name: status
        type: enum
        source: system
        description: "Window lifecycle"
        default: ACTIVE
        constraints: "enum {ACTIVE, CANCELLED}"

  - name: RouteDay
    parent: null
    common_fields: true
    fields:
      - name: service_zone
        type: enum
        source: input
        description: "Zone this route serves; only requests from households in this zone may be scheduled onto it"
        constraints: "enum {ZONE_NORTH, ZONE_SOUTH, ZONE_EAST, ZONE_WEST}"
      - name: route_date
        type: string
        source: input
        description: "Calendar date of collection, ISO yyyy-mm-dd; interpreted against the logical clock"
      - name: max_load_units
        type: integer
        source: input
        description: "Aggregate capacity in load units; sum of committed request load MUST stay <= max_load_units"
      - name: max_stops
        type: integer
        source: input
        description: "Maximum number of scheduled stops (requests) on this route"
      - name: committed_load_units
        type: integer
        source: computed
        description: "Sum of load_units over PickupRequests on this RouteDay with status in {SCHEDULED, COMPLETED}"
        default: 0
      - name: committed_stops
        type: integer
        source: computed
        description: "Count of PickupRequests on this RouteDay with status in {SCHEDULED, COMPLETED}"
        default: 0
      - name: projected_load_units
        type: integer
        source: computed
        description: "Load units of requests with status == SCHEDULED only (calculations.route_fullness, projected variant); recomputed on read"
        default: 0
      - name: projected_fullness_pct
        type: integer
        source: computed
        description: "round_half_up(100 * projected_load_units / max_load_units); recomputed on read"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Route lifecycle; DISPATCHED locks scheduling changes"
        default: OPEN
        constraints: "enum {OPEN, DISPATCHED, CLOSED}"

  - name: PickupRequest
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; requesting household"
      - name: route_day_id
        type: string
        source: system
        description: "FK -> RouteDay.id; assigned at scheduling; null until SCHEDULED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Request lifecycle state (see state_machines.PickupRequest)"
        default: DRAFT
        constraints: "enum {DRAFT, SUBMITTED, SCHEDULED, COMPLETED, REFUSED, MISSED, CANCELLED}"
      - name: scheduled_date
        type: string
        source: system
        description: "yyyy-mm-dd copied from the assigned RouteDay at scheduling; determines allowance calendar_year"
        default: null
      - name: load_units
        type: integer
        source: computed
        description: "Sum of per-item load units (calculations.request_load_units); recomputed on item changes and at scheduling"
        default: 0
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Provisional fee quote at submission/scheduling (calculations.item_fee_quote)"
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Final invoice at completion (calculations.final_invoice); null until COMPLETED"
        default: null
      - name: amnesty_applied
        type: boolean
        source: computed
        description: "True iff scheduled_date falls inside an ACTIVE AmnestyWindow [starts_at, ends_at); frozen at scheduling"
        default: false
      - name: refusal_reason_code
        type: enum
        source: system
        description: "Driver-supplied reason when pickup is refused"
        default: null
        constraints: "enum {IMPROPER_PREPARATION, PROHIBITED_ITEM, BLOCKED_ACCESS, UNSAFE_SETOUT, EXCEEDS_DECLARED_ITEMS}"
      - name: missed_reason_code
        type: enum
        source: system
        description: "Reason when driver marks the stop missed (no set-out present)"
        default: null
        constraints: "enum {NO_SETOUT, NOT_VISIBLE, GATE_LOCKED}"
      - name: setout_classification
        type: enum
        source: system
        description: "Inspector determination for a set-out not tied to a scheduled pickup"
        default: null
        constraints: "enum {AUTHORIZED_SETOUT, ILLEGAL_DUMPING}"

  - name: PickupItem
    parent: PickupRequest
    common_fields: true
    fields:
      - name: pickup_request_id
        type: string
        source: input
        description: "FK -> PickupRequest.id; owning request"
      - name: sequence_no
        type: integer
        source: input
        description: "Resident-declared item order within the request (1-based); allowance consumption tie-break after created_at"
      - name: category
        type: enum
        source: input
        description: "Item category driving fee, load, routing and prep rules"
        constraints: "enum {STANDARD_FURNITURE, MATTRESS, APPLIANCE_NO_REFRIGERANT, APPLIANCE_WITH_REFRIGERANT, ELECTRONICS, TIRES, PROHIBITED}"
      - name: is_oversize
        type: boolean
        source: input
        description: "True if any dimension > 1.5 m or weight > 32 kg"
        default: false
      - name: preparation_ack
        type: boolean
        source: input
        description: "Resident acknowledgement of the category's preparation instructions at item-add time"
        default: false
      - name: item_fee_cents
        type: integer
        source: computed
        description: "Per-item provisional fee incl. surcharge, rounded half-up (calculations.item_fee_quote)"
        default: 0
      - name: within_allowance
        type: boolean
        source: computed
        description: "True iff this item consumed a free allowance slot at scheduling"
        default: false
      - name: disposition_route
        type: enum
        source: computed
        description: "Disposal/recycling routing assigned at completion by category (calculations.disposition_routing)"
        default: null
        constraints: "enum {LANDFILL, MATTRESS_RECYCLING, REFRIGERANT_RECOVERY, METAL_RECYCLING, E_WASTE, TIRE_RECYCLING}"

  - name: FeeAssessment
    parent: PickupRequest
    common_fields: true
    fields:
      - name: pickup_request_id
        type: string
        source: input
        description: "FK -> PickupRequest.id; request this assessment belongs to; null only for kind == ILLEGAL_DUMPING_FINE with no linked pickup"
        default: null
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; fiscal owner of the assessment (copied from the request's household, or set directly for unlinked dumping fines)"
      - name: kind
        type: enum
        source: input
        description: "Assessment type"
        constraints: "enum {PROVISIONAL_QUOTE, FINAL_INVOICE, CONTAMINATION_PENALTY, ILLEGAL_DUMPING_FINE}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Amount in cents (calculations.final_invoice / calculations.illegal_dumping_fine)"
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle"
        default: PENDING
        constraints: "enum {PENDING, SETTLED, WAIVED}"
      - name: settled_at
        type: datetime
        source: system
        description: "When the assessment was settled or waived; null while PENDING"
        default: null

  - name: DumpingReport
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; household whose address the set-out was found at"
      - name: pickup_request_id
        type: string
        source: input
        description: "FK -> PickupRequest.id; the scheduled pickup this set-out is claimed to belong to; null when none exists"
        default: null
      - name: reported_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of report creation"
      - name: status
        type: enum
        source: system
        description: "Inspector determination lifecycle"
        default: OPEN
        constraints: "enum {OPEN, DETERMINED_AUTHORIZED, DETERMINED_ILLEGAL, DISMISSED}"
      - name: determination_notes
        type: string
        source: system
        description: "Inspector notes recorded at determination"
        default: null

  - name: Notification
    parent: PickupRequest
    common_fields: false
    fields:
      - name: pickup_request_id
        type: string
        source: input
        description: "FK -> PickupRequest.id; request this notice concerns"
      - name: kind
        type: enum
        source: system
        description: "Notification type emitted by a lifecycle transition"
        constraints: "enum {SCHEDULE_CONFIRMATION, REFUSAL_NOTICE, MISSED_NOTICE, CANCELLATION_NOTICE, ILLEGAL_DUMPING_WARNING}"
      - name: reason_code
        type: string
        source: system
        description: "Copied refusal/missed reason code when applicable; null otherwise"
        default: null
      - name: message
        type: string
        source: system
        description: "Rendered notice body including preparation instructions for refused items when kind == REFUSAL_NOTICE"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: PickupRequest
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /curbside/pickup-requests/{id}/submit"
        actor: Resident
        preconditions:
          - "request has >= 1 PickupItem"
          - "every PickupItem has preparation_ack == true"
          - "no PickupItem has category == PROHIBITED"
          - "Household.status == ACTIVE"
        side_effects:
          - "runs calculations.item_fee_quote (provisional variant) and stores item_fee_cents per item and provisional_total_cents on the request"
          - "creates FeeAssessment(kind=PROVISIONAL_QUOTE, amount_cents=provisional_total_cents, status=PENDING)"
          - "increments PickupRequest.version by 1"
        note: "Quote at submission is pre-scheduling: amnesty_applied is still false and allowance is NOT yet consumed; the quote is recomputed authoritatively at scheduling."

      - from: SUBMITTED
        to: SCHEDULED
        trigger: "POST /curbside/pickup-requests/{id}/schedule"
        actor: Resident
        preconditions:
          - "target RouteDay exists with status == OPEN"
          - "RouteDay.service_zone == Household.service_zone"
          - "RouteDay.committed_load_units + request.load_units <= RouteDay.max_load_units"
          - "RouteDay.committed_stops + 1 <= RouteDay.max_stops"
          - "household has no other PickupRequest with status == SCHEDULED on the same route_date"
          - "route_date >= logical clock date (no scheduling into the past)"
        side_effects:
          - "sets route_day_id and scheduled_date from RouteDay.route_date"
          - "computes amnesty_applied := exists ACTIVE AmnestyWindow with starts_at <= scheduled_date 00:00:00Z < ends_at (half-open; comparison on the date's midnight instant)"
          - "runs calculations.allowance_ledger: consumes HouseholdAllowance.items_consumed for items fitting the remaining allowance (in item order created_at ASC, sequence_no ASC), marks each PickupItem.within_allowance, bumps over_allowance_items for the rest"
          - "runs calculations.item_fee_quote (scheduled variant, applying amnesty_applied) and rewrites item_fee_cents and provisional_total_cents"
          - "RouteDay.committed_load_units += request.load_units; RouteDay.committed_stops += 1 (increments RouteDay.version by 1)"
          - "emits Notification(kind=SCHEDULE_CONFIRMATION)"
          - "increments PickupRequest.version by 1"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /curbside/pickup-requests/{id}/cancel"
        actor: Resident
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "voids the PENDING FeeAssessment(kind=PROVISIONAL_QUOTE) (status -> WAIVED, settled_at = clock)"
          - "emits Notification(kind=CANCELLATION_NOTICE)"
          - "increments PickupRequest.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /curbside/pickup-requests/{id}/cancel"
        actor: Resident
        preconditions:
          - "request.status == SCHEDULED"
          - "logical clock < scheduled_date 00:00:00Z (cancellation cutoff is midnight at the start of the pickup day)"
        side_effects:
          - "releases route capacity: RouteDay.committed_load_units -= request.load_units; RouteDay.committed_stops -= 1 (increments RouteDay.version by 1)"
          - "runs calculations.allowance_ledger release: items_consumed -= count(within_allowance items); items_released += count(within_allowance items); over_allowance_items -= count(over-allowance items)"
          - "voids the PENDING FeeAssessment(kind=PROVISIONAL_QUOTE) (status -> WAIVED, settled_at = clock)"
          - "emits Notification(kind=CANCELLATION_NOTICE)"
          - "increments PickupRequest.version by 1"
        note: "Cyclic revert: a household may create a fresh DRAFT request after cancelling; the released allowance is available to the new request."

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /curbside/pickup-requests/{id}/complete"
        actor: Driver
        preconditions:
          - "request.status == SCHEDULED"
          - "RouteDay.status == DISPATCHED"
          - "logical clock date == scheduled_date"
        side_effects:
          - "runs calculations.final_invoice: final_total_cents = provisional_total_cents + sum(contamination penalties for items collected with improper preparation flagged by driver at complete time)"
          - "creates FeeAssessment(kind=FINAL_INVOICE, amount_cents=final_total_cents, status=PENDING)"
          - "waives the PENDING PROVISIONAL_QUOTE assessment (superseded by the final invoice)"
          - "runs calculations.disposition_routing: sets each PickupItem.disposition_route by category"
          - "committed counters stay (COMPLETED remains in the committed set)"
          - "increments PickupRequest.version by 1"

      - from: SCHEDULED
        to: REFUSED
        trigger: "POST /curbside/pickup-requests/{id}/refuse"
        actor: Driver
        preconditions:
          - "request.status == SCHEDULED"
          - "RouteDay.status == DISPATCHED"
          - "logical clock date == scheduled_date"
          - "refusal_reason_code provided"
        side_effects:
          - "sets refusal_reason_code"
          - "releases route capacity: RouteDay.committed_load_units -= request.load_units; RouteDay.committed_stops -= 1 (increments RouteDay.version by 1)"
          - "allowance is NOT released: set-out was made and consumed service capacity to reach the curb (items_consumed unchanged)"
          - "waives the PENDING PROVISIONAL_QUOTE assessment (status -> WAIVED)"
          - "emits Notification(kind=REFUSAL_NOTICE, reason_code=refusal_reason_code) including per-item preparation instructions"
          - "increments PickupRequest.version by 1"
        note: "REFUSED is not terminal: the resident may reschedule (cyclic recovery loop)."

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /curbside/pickup-requests/{id}/miss"
        actor: Driver
        preconditions:
          - "request.status == SCHEDULED"
          - "RouteDay.status == DISPATCHED"
          - "logical clock date == scheduled_date"
          - "missed_reason_code provided"
        side_effects:
          - "sets missed_reason_code"
          - "releases route capacity: RouteDay.committed_load_units -= request.load_units; RouteDay.committed_stops -= 1 (increments RouteDay.version by 1)"
          - "runs calculations.allowance_ledger release (no set-out was made): items_consumed -= count(within_allowance items); items_released += count(within_allowance items); over_allowance_items -= count(over-allowance items)"
          - "waives the PENDING PROVISIONAL_QUOTE assessment (status -> WAIVED)"
          - "emits Notification(kind=MISSED_NOTICE, reason_code=missed_reason_code)"
          - "increments PickupRequest.version by 1"

      - from: REFUSED
        to: SCHEDULED
        trigger: "POST /curbside/pickup-requests/{id}/schedule"
        actor: Resident
        preconditions:
          - "same RouteDay preconditions as SUBMITTED -> SCHEDULED"
          - "refusal was NOT for reason EXCEEDS_DECLARED_ITEMS unless the resident first removes excess items (patch item list while REFUSED via POST item delete is not offered; resident must cancel and redraft)"
        side_effects:
          - "same side-effect set as SUBMITTED -> SCHEDULED (allowance re-consumes any slots freed? No: refusal never released allowance, so re-scheduling consumes allowance only for items not already counted — see calculations.allowance_ledger idempotent re-schedule rule)"
          - "emits Notification(kind=SCHEDULE_CONFIRMATION)"
          - "increments PickupRequest.version by 1"
        note: "Cyclic loop SCHEDULED -> REFUSED -> SCHEDULED. Allowance ledger rule: on scheduling a REFUSED request, only items whose within_allowance flag is false AND that have never consumed a slot are newly consumed; see calculations.allowance_ledger."

      - from: MISSED
        to: CANCELLED
        trigger: "POST /curbside/pickup-requests/{id}/cancel"
        actor: Resident
        preconditions:
          - "request.status == MISSED"
        side_effects:
          - "emits Notification(kind=CANCELLATION_NOTICE)"
          - "increments PickupRequest.version by 1"

      - from: REFUSED
        to: CANCELLED
        trigger: "POST /curbside/pickup-requests/{id}/cancel"
        actor: Resident
        preconditions:
          - "request.status == REFUSED"
        side_effects:
          - "runs calculations.allowance_ledger release on cancel-after-refusal: items_consumed -= count(within_allowance items); items_released += count(within_allowance items); over_allowance_items -= count(over-allowance items)"
          - "emits Notification(kind=CANCELLATION_NOTICE)"
          - "increments PickupRequest.version by 1"

  - entity: RouteDay
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /curbside/route-days/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "route.status == OPEN"
          - "logical clock date == route_date (dispatch happens day-of)"
          - "committed_stops >= 1 (an empty route is not dispatched)"
        side_effects:
          - "locks the route: schedule/cancel mutations against requests on this RouteDay now fail with ERR_ROUTE_LOCKED"
          - "increments RouteDay.version by 1"

      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /curbside/route-days/{id}/close"
        actor: Dispatcher
        preconditions:
          - "route.status == DISPATCHED"
          - "every PickupRequest on this RouteDay is in a terminal or post-service state {COMPLETED, REFUSED, MISSED, CANCELLED}"
        side_effects:
          - "increments RouteDay.version by 1"
        note: "Bubble-up gate: the route cannot close while any stop is still SCHEDULED."

  - entity: AmnestyWindow
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /curbside/amnesty-windows/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "window.status == ACTIVE"
        side_effects:
          - "requests already SCHEDULED with amnesty_applied == true KEEP their frozen quote (no retroactive repricing)"
          - "increments AmnestyWindow.version by 1"

  - entity: DumpingReport
    initial_state: OPEN
    terminal_states: [DETERMINED_AUTHORIZED, DETERMINED_ILLEGAL, DISMISSED]
    transitions:
      - from: OPEN
        to: DETERMINED_AUTHORIZED
        trigger: "POST /curbside/dumping-reports/{id}/determine"
        actor: Inspector
        preconditions:
          - "report.status == OPEN"
          - "determination == AUTHORIZED_SETOUT"
          - "report.pickup_request_id is not null AND that PickupRequest.status == SCHEDULED AND its scheduled_date is within [reported_at date - 1 day, reported_at date + 1 day]"
        side_effects:
          - "sets determination_notes"
          - "increments DumpingReport.version by 1"
        note: "Authorized set-out: material placed within +/-1 day of a genuinely scheduled pickup for that household."

      - from: OPEN
        to: DETERMINED_ILLEGAL
        trigger: "POST /curbside/dumping-reports/{id}/determine"
        actor: Inspector
        preconditions:
          - "report.status == OPEN"
          - "determination == ILLEGAL_DUMPING"
          - "NOT (report.pickup_request_id is not null AND that PickupRequest.status == SCHEDULED AND its scheduled_date is within [reported_at date - 1 day, reported_at date + 1 day])"
        side_effects:
          - "creates FeeAssessment(kind=ILLEGAL_DUMPING_FINE, amount_cents=calculations.illegal_dumping_fine, status=PENDING, household_id=report.household_id); pickup_request_id = report.pickup_request_id when present, else null (unlinked fine anchored to the household)"
          - "transitively: Household.status -> SUSPENDED with suspension_reason='ILLEGAL_DUMPING' (increments Household.version by 1)"
          - "emits Notification(kind=ILLEGAL_DUMPING_WARNING) on the linked request if one exists"
          - "sets determination_notes; increments DumpingReport.version by 1"
        note: "Transitive cascade A (depth 3): determine(ILLEGAL) on DumpingReport -> creates FeeAssessment(ILLEGAL_DUMPING_FINE) -> flips Household.status to SUSPENDED; the suspension itself gates that household's future submit/schedule attempts via ERR_HOUSEHOLD_SUSPENDED (evaluated at the next transition attempt, not eagerly)."

      - from: OPEN
        to: DISMISSED
        trigger: "POST /curbside/dumping-reports/{id}/determine"
        actor: Inspector
        preconditions:
          - "report.status == OPEN"
          - "determination == DISMISSED"
        side_effects:
          - "sets determination_notes; increments DumpingReport.version by 1"

  - entity: Household
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade from DumpingReport DETERMINED_ILLEGAL (see DumpingReport transitions)"
        actor: system
        preconditions:
          - "household.status == ACTIVE"
        side_effects:
          - "sets suspension_reason"
          - "increments Household.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /curbside/households/{id}/reinstate"
        actor: Inspector
        preconditions:
          - "household.status == SUSPENDED"
          - "all FeeAssessments with kind == ILLEGAL_DUMPING_FINE and household_id == this household (request-linked or unlinked) are in {SETTLED, WAIVED}"
        side_effects:
          - "clears suspension_reason"
          - "increments Household.version by 1"
        note: "Cyclic: SUSPENDED -> ACTIVE allowed only after fiscal settlement (segregation of duties: only Inspector reinstates)."

  - entity: FeeAssessment
    initial_state: PENDING
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /curbside/fee-assessments/{id}/settle"
        actor: Resident
        preconditions:
          - "assessment.status == PENDING"
          - "the acting Resident owns the Household of the linked PickupRequest"
        side_effects:
          - "sets settled_at = logical clock"
          - "increments FeeAssessment.version by 1"

      - from: PENDING
        to: WAIVED
        trigger: "system cascade (request cancel/refuse/miss/complete supersession) or POST /curbside/fee-assessments/{id}/waive by Dispatcher"
        actor: system
        preconditions:
          - "assessment.status == PENDING"
        side_effects:
          - "sets settled_at = logical clock"
          - "increments FeeAssessment.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only — see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-stale-routeday
    parent_entity: RouteDay
    write_endpoint: "POST /curbside/pickup-requests/{id}/schedule"
    occ_field: "expected_route_day_version"
    description: |
      Scheduling a pickup against a RouteDay whose version has advanced since the
      client last read it is rejected. This captures the case where another
      request was just scheduled onto (or cancelled off) the same route — which
      legitimately changed committed_load_units/committed_stops — so the current
      writer's capacity view is stale.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

  - rule_id: cancel-stale-request
    parent_entity: PickupRequest
    write_endpoint: "POST /curbside/pickup-requests/{id}/cancel"
    occ_field: "expected_request_version"
    description: |
      Cancelling a PickupRequest whose version has advanced since the client
      last read it is rejected. This captures the case where the request was
      just rescheduled (REFUSED -> SCHEDULED) — which legitimately re-priced the
      quote and re-froze amnesty_applied — so the cancelling client's view of
      the fiscal state it is voiding is stale.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: item_fee_quote
    trigger: "PickupRequest DRAFT->SUBMITTED (provisional variant) and any transition into SCHEDULED (scheduled variant, freezes amnesty_applied)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: per-item first, then sum. Rounding order is
      # pinned: round each item's surcharge-inclusive fee to the cent BEFORE
      # summing (per-item-then-sum), NOT sum-then-round.
      for item in items_sorted(created_at ASC, sequence_no ASC):
          base_over_fee = OVER_ALLOWANCE_FEE_CENTS if not item.within_allowance else 0
          if variant == scheduled and request.amnesty_applied:
              base_over_fee = 0                      # amnesty waives over-allowance fee
          refrigerant_fee = REFRIGERANT_FEE_CENTS if item.category == APPLIANCE_WITH_REFRIGERANT else 0
          # refrigerant recovery is regulatory: NEVER waived, not even by amnesty
          oversize_fee = OVERSIZE_FEE_CENTS if item.is_oversize else 0
          mattress_fee = MATTRESS_FEE_CENTS if item.category == MATTRESS else 0
          item_subtotal_cents = base_over_fee + refrigerant_fee + oversize_fee + mattress_fee
          # municipal processing surcharge applied PER ITEM and rounded per item:
          item_surcharge_cents = round_half_up(item_subtotal_cents * SURCHARGE_RATE)
          item.item_fee_cents = item_subtotal_cents + item_surcharge_cents
      request.provisional_total_cents = sum(item.item_fee_cents)
    input_set: "All PickupItem rows of the request. At submission: within_allowance=false for all items and amnesty_applied=false (pre-scheduling estimate). At scheduling: within_allowance per allowance_ledger outcome, amnesty_applied frozen this transition."
    constants:
      OVER_ALLOWANCE_FEE_CENTS: 2500
      REFRIGERANT_FEE_CENTS: 4500
      OVERSIZE_FEE_CENTS: 1500
      MATTRESS_FEE_CENTS: 1200
      SURCHARGE_RATE: 0.085
    precision: "integer cents; per-item surcharge round_half_up to whole cents BEFORE summing (pinned rounding order)"
    variants:
      - name: provisional
        when: "DRAFT->SUBMITTED; no route/allowance/amnesty context exists yet"
        difference: "All items priced as if over-allowance (within_allowance=false) and amnesty_applied=false; produces the worst-case estimate residents see before scheduling"
      - name: scheduled
        when: "any transition into SCHEDULED"
        difference: "Applies allowance_ledger outcome (within_allowance flags) and frozen amnesty_applied; this quote is the one the FINAL_INVOICE builds on"

  - name: final_invoice
    trigger: "PickupRequest SCHEDULED->COMPLETED"
    algorithm: aggregation
    formula: |
      # Dual variant of item_fee_quote, different entity domain of inputs:
      # driver-observed set-out compliance flags arrive only at completion.
      final_total_cents = request.provisional_total_cents
                        + CONTAMINATION_PENALTY_CENTS * count(items with driver flag improper_preparation_collected == true)
      # contamination penalty is flat per item, no surcharge, no rounding
    input_set: "The request's frozen scheduled quote plus the driver-supplied improper_preparation_collected item ids in the complete call"
    constants:
      CONTAMINATION_PENALTY_CENTS: 3000
    precision: "integer cents; exact"
    variants:
      - name: provisional_basis
        when: "quote at scheduling (item_fee_quote.scheduled)"
        difference: "Forward-looking: assumes compliant set-out; excludes contamination penalties that only exist after driver inspection"
      - name: final_actual
        when: "SCHEDULED->COMPLETED"
        difference: "Chronological/actual: adds observed contamination penalties; final_total_cents >= provisional_total_cents always"

  - name: allowance_ledger
    trigger: "transitions into SCHEDULED (consume), SCHEDULED->CANCELLED / SCHEDULED->MISSED / REFUSED->CANCELLED (release), REFUSED->SCHEDULED (idempotent re-consume)"
    algorithm: threshold
    formula: |
      year := calendar year of scheduled_date
      ledger := HouseholdAllowance for (household_id, year); created lazily with zeros on first touch
      remaining := household.annual_allowance_items - ledger.items_consumed
      # Consume in deterministic item order; NEVER use id for ordering:
      for item in items_sorted(created_at ASC, sequence_no ASC):
          if item.within_allowance == true and item has consumed a slot on THIS request before:
              continue                      # idempotent re-consume (REFUSED->SCHEDULED)
          if remaining > 0:
              item.within_allowance = true; ledger.items_consumed += 1; remaining -= 1
          else:
              item.within_allowance = false; ledger.over_allowance_items += 1
      # Release (cancel/miss paths):
      on release: ledger.items_consumed -= count(items with within_allowance == true);
                  ledger.items_released  += count(items with within_allowance == true);
                  ledger.over_allowance_items -= count(items with within_allowance == false);
                  every item.within_allowance reset to false
      # Boundary: remaining > 0 is a strict-greater test. The item that takes
      # items_consumed from annual_allowance_items-1 to annual_allowance_items is free;
      # the NEXT item is fee-bearing. (>= vs > pinned: free iff remaining >= 1.)
    input_set: "Items of the transitioning request only; ledger rows keyed (household_id, calendar_year of scheduled_date); requests in {DRAFT, SUBMITTED, CANCELLED} never count"
    constants: {}
    precision: "integer items; exact"
    variants: []

  - name: request_load_units
    trigger: "item add/remove on a DRAFT request; re-validated at scheduling"
    algorithm: aggregation
    formula: |
      load_units = sum over items of LOAD_BY_CATEGORY[category] * (OVERSIZE_LOAD_MULTIPLIER if item.is_oversize else 1)
    input_set: "All PickupItem rows of the request, all categories"
    constants:
      LOAD_STANDARD_FURNITURE: 2
      LOAD_MATTRESS: 3
      LOAD_APPLIANCE_NO_REFRIGERANT: 4
      LOAD_APPLIANCE_WITH_REFRIGERANT: 5
      LOAD_ELECTRONICS: 2
      LOAD_TIRES: 1
      OVERSIZE_LOAD_MULTIPLIER: 2
    precision: "integer units; exact"
    variants: []

  - name: route_fullness
    trigger: "GET /curbside/route-days/{id} (computed read)"
    algorithm: forward_looking
    formula: |
      projected_load_units = sum(load_units of requests on route with status == SCHEDULED)
      projected_fullness_pct = round_half_up(100.0 * projected_load_units / max_load_units)
      committed_load_units includes COMPLETED requests as well (stored field);
      # Two valid reads of 'how full is the route' diverge: projected (SCHEDULED only,
      # what a dispatcher can still count on) vs committed (SCHEDULED+COMPLETED, the
      # fiscal/capacity truth). Divergence appears exactly when a stop COMPLETED.
    input_set: "Requests on this RouteDay; projected variant filters status == SCHEDULED only, committed variant filters status IN {SCHEDULED, COMPLETED}"
    constants: {}
    precision: "projected_fullness_pct 0 decimal places round_half_up"
    variants:
      - name: projected
        when: "dispatcher planning view"
        difference: "Counts only SCHEDULED requests; a completed stop drops out of the projection"
      - name: committed
        when: "capacity enforcement & billing view (stored committed_load_units)"
        difference: "Counts SCHEDULED + COMPLETED; a completed stop still occupies capacity for the rest of the day"

  - name: disposition_routing
    trigger: "PickupRequest SCHEDULED->COMPLETED"
    algorithm: constraint_propagation
    formula: |
      for item in items:
          route = ROUTE_BY_CATEGORY[item.category]
          # REFRIGERANT items always route to REFRIGERANT_RECOVERY first,
          # regardless of oversize; metal recovery applies to non-refrigerant appliances
      # ROUTE_BY_CATEGORY: STANDARD_FURNITURE->LANDFILL, MATTRESS->MATTRESS_RECYCLING,
      #   APPLIANCE_NO_REFRIGERANT->METAL_RECYCLING, APPLIANCE_WITH_REFRIGERANT->REFRIGERANT_RECOVERY,
      #   ELECTRONICS->E_WASTE, TIRES->TIRE_RECYCLING
    input_set: "All items of the completing request"
    constants: {}
    precision: "enum assignment; exact"
    variants: []

  - name: illegal_dumping_fine
    trigger: "DumpingReport OPEN->DETERMINED_ILLEGAL when report.pickup_request_id is not null"
    algorithm: threshold
    formula: |
      # Prior confirmed violations escalate the fine. Chronological count:
      priors = count(DumpingReport for household with status == DETERMINED_ILLEGAL and reported_at < this.reported_at)
      amount_cents = BASE_FINE_CENTS * (2 ** min(priors, ESCALATION_CAP))
      # tie-break on equal reported_at: created_at ASC (never id)
    input_set: "All DumpingReports of the household with status == DETERMINED_ILLEGAL strictly before this report's reported_at (ties broken by created_at ASC)"
    constants:
      BASE_FINE_CENTS: 25000
      ESCALATION_CAP: 3
    precision: "integer cents; exact"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted to call this endpoint per RBAC matrix; for Resident calls on household-scoped resources, X-User-ID must equal the Household.id that owns the resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the path and every FK in the body exists (validated left-to-right: request id, then route_day_id, then item ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state that lists this trigger in its state machine (e.g., schedule only from SUBMITTED or REFUSED; complete/refuse/miss only from SCHEDULED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_route_day_version matches RouteDay.version (schedule) / expected_request_version matches PickupRequest.version (cancel)"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /curbside/pickup-requests/{id}/schedule, POST /curbside/pickup-requests/{id}/cancel"
    note: "ERR_STALE_REQUEST_VERSION used on cancel; both are priority-5 OCC checks"

  - priority: 6
    category: business_safety
    check: "No PickupItem with category == PROHIBITED may be submitted; APPLIANCE_WITH_REFRIGERANT items require preparation_ack == true at submit (refrigerant certification prep is regulatory)"
    error_id: ERR_PROHIBITED_ITEM
    http_status: 422
    applies_to: "POST /curbside/pickup-requests/{id}/submit"
    note: "Preparation-ack failures on non-refrigerant categories use ERR_PREPARATION_NOT_ACKED (also 422, same priority, checked after prohibition scan)"

  - priority: 7
    category: business_safety
    check: "Household.status == ACTIVE for submit/schedule (SUSPENDED households cannot consume municipal service)"
    error_id: ERR_HOUSEHOLD_SUSPENDED
    http_status: 409
    applies_to: "POST /curbside/pickup-requests, POST /curbside/pickup-requests/{id}/submit, POST /curbside/pickup-requests/{id}/schedule"

  - priority: 8
    category: business_constraint
    check: "Zone consistency: RouteDay.service_zone == Household.service_zone"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /curbside/pickup-requests/{id}/schedule"

  - priority: 9
    category: business_temporal
    check: "No scheduling into the past (route_date >= clock date); cancel cutoff (clock < scheduled_date 00:00:00Z); dispatch only day-of; complete/refuse/miss only on scheduled_date; amnesty window starts_at < ends_at; new AmnestyWindow half-open interval must not intersect any existing ACTIVE window (touching endpoints allowed)"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 422
    applies_to: "schedule, cancel, dispatch, complete, refuse, miss, POST /curbside/amnesty-windows"

  - priority: 10
    category: business_constraint
    check: "Same household may hold at most one SCHEDULED request per route_date (point-equality date semantics, NOT interval overlap)"
    error_id: ERR_DUPLICATE_PICKUP_DATE
    http_status: 409
    applies_to: "POST /curbside/pickup-requests/{id}/schedule"

  - priority: 11
    category: business_fiscal
    check: "Aggregate route capacity: committed_load_units + load_units <= max_load_units AND committed_stops + 1 <= max_stops (boundary: equality is allowed)"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /curbside/pickup-requests/{id}/schedule"

  - priority: 12
    category: business_referential
    check: "DumpingReport determination consistency: DETERMINED_AUTHORIZED requires a linked SCHEDULED request within +/-1 day; DETERMINED_ILLEGAL requires the absence of such a link; reinstate requires all linked ILLEGAL_DUMPING_FINE assessments settled/waived"
    error_id: ERR_DETERMINATION_INCONSISTENT
    http_status: 422
    applies_to: "POST /curbside/dumping-reports/{id}/determine, POST /curbside/households/{id}/reinstate"

  - priority: 13
    category: business_fiscal
    check: "Fee settlement ownership and state: settle requires status == PENDING and the acting Resident must own the assessment's household (X-User-ID == FeeAssessment.household_id); zero-amount assessments are created PENDING like any other and may be settled or waived normally"
    error_id: ERR_ASSESSMENT_NOT_SETTLABLE
    http_status: 409
    applies_to: "POST /curbside/fee-assessments/{id}/settle"

  - priority: 14
    category: business_constraint
    check: "Request must contain >= 1 item at submit; item category must be a declared enum member; sequence_no unique per request and >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /curbside/pickup-requests/{id}/items, POST /curbside/pickup-requests/{id}/submit"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving logical clock (mandatory default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/curbside/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock MUST NOT fall back to wall-clock time."
    roles: [Dispatcher]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["all date/datetime comparisons in validations and state machines read this clock"]

  # --- Households ---
  - method: POST
    path: "/curbside/households"
    description: "Register a household account"
    roles: [Dispatcher]
    code: 201
    input: [street_address, service_zone, "annual_allowance_items?"]
    output: Household
    side_effects: ["creates Household(status=ACTIVE, version=1)"]

  - method: GET
    path: "/curbside/households/{id}"
    description: "Fetch one household"
    roles: [Dispatcher, Inspector, Resident]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/curbside/households"
    description: "List households (paginated, filterable)"
    roles: [Dispatcher, Inspector]
    code: 200
    input: ["service_zone?", "status?", "limit?", "offset?"]
    output: "Household[]"
    side_effects: []

  - method: POST
    path: "/curbside/households/{id}/reinstate"
    description: "Lift a suspension after fines settle (Inspector only — segregation of duties)"
    roles: [Inspector]
    code: 200
    input: []
    output: Household
    side_effects: ["Household SUSPENDED->ACTIVE", "increments Household.version by 1"]

  - method: GET
    path: "/curbside/households/{id}/allowances"
    description: "Reverse-reachability: allowance ledger rows of a household"
    roles: [Dispatcher, Inspector, Resident]
    code: 200
    input: []
    output: "HouseholdAllowance[]"
    side_effects: []

  - method: GET
    path: "/curbside/households/{id}/pickup-requests"
    description: "Reverse-reachability: requests of a household"
    roles: [Dispatcher, Inspector, Resident]
    code: 200
    input: []
    output: "PickupRequest[]"
    side_effects: []

  - method: GET
    path: "/curbside/households/{id}/dumping-reports"
    description: "Reverse-reachability: dumping reports against a household"
    roles: [Dispatcher, Inspector]
    code: 200
    input: []
    output: "DumpingReport[]"
    side_effects: []

  - method: GET
    path: "/curbside/households/{id}/fee-assessments"
    description: "Reverse-reachability: assessments owned by a household (incl. unlinked dumping fines)"
    roles: [Dispatcher, Inspector, Resident]
    code: 200
    input: []
    output: "FeeAssessment[]"
    side_effects: []

  # --- Amnesty windows ---
  - method: POST
    path: "/curbside/amnesty-windows"
    description: "Declare an amnesty week window (half-open [starts_at, ends_at)); must not intersect an existing ACTIVE window; touching endpoints allowed"
    roles: [Dispatcher]
    code: 201
    input: [label, starts_at, ends_at]
    output: AmnestyWindow
    side_effects: []

  - method: GET
    path: "/curbside/amnesty-windows/{id}"
    description: "Fetch one amnesty window"
    roles: [Dispatcher, Inspector, Resident, Driver]
    code: 200
    input: []
    output: AmnestyWindow
    side_effects: []

  - method: GET
    path: "/curbside/amnesty-windows"
    description: "List amnesty windows"
    roles: [Dispatcher, Inspector, Resident, Driver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AmnestyWindow[]"
    side_effects: []

  - method: POST
    path: "/curbside/amnesty-windows/{id}/cancel"
    description: "Cancel an amnesty window; already-scheduled requests keep frozen amnesty_applied"
    roles: [Dispatcher]
    code: 200
    input: []
    output: AmnestyWindow
    side_effects: ["AmnestyWindow ACTIVE->CANCELLED", "increments AmnestyWindow.version by 1"]

  # --- Route days ---
  - method: POST
    path: "/curbside/route-days"
    description: "Create a route day for a zone/date with capacities"
    roles: [Dispatcher]
    code: 201
    input: [service_zone, route_date, max_load_units, max_stops]
    output: RouteDay
    side_effects: ["creates RouteDay(status=OPEN, committed_load_units=0, committed_stops=0, version=1)"]

  - method: GET
    path: "/curbside/route-days/{id}"
    description: "Fetch route day incl. computed route_fullness fields (projected vs committed)"
    roles: [Dispatcher, Inspector, Resident, Driver]
    code: 200
    input: []
    output: RouteDay
    side_effects: ["computes calculations.route_fullness projected fields on read"]

  - method: GET
    path: "/curbside/route-days"
    description: "List route days"
    roles: [Dispatcher, Inspector, Resident, Driver]
    code: 200
    input: ["service_zone?", "route_date?", "status?", "limit?", "offset?"]
    output: "RouteDay[]"
    side_effects: []

  - method: POST
    path: "/curbside/route-days/{id}/dispatch"
    description: "Dispatch route (day-of only); locks schedule/cancel mutations on its requests"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteDay
    side_effects: ["RouteDay OPEN->DISPATCHED", "increments RouteDay.version by 1"]

  - method: POST
    path: "/curbside/route-days/{id}/close"
    description: "Close route once every stop is terminal/post-service"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteDay
    side_effects: ["RouteDay DISPATCHED->CLOSED", "increments RouteDay.version by 1"]

  - method: GET
    path: "/curbside/route-days/{id}/pickup-requests"
    description: "Reverse-reachability: requests scheduled on this route"
    roles: [Dispatcher, Inspector, Driver]
    code: 200
    input: []
    output: "PickupRequest[]"
    side_effects: []

  # --- Pickup requests ---
  - method: POST
    path: "/curbside/pickup-requests"
    description: "Create a DRAFT pickup request for a household"
    roles: [Resident]
    code: 201
    input: [household_id]
    output: PickupRequest
    side_effects: ["creates PickupRequest(status=DRAFT, load_units=0, provisional_total_cents=0, version=1)"]

  - method: GET
    path: "/curbside/pickup-requests/{id}"
    description: "Fetch one pickup request"
    roles: [Dispatcher, Inspector, Resident, Driver]
    code: 200
    input: []
    output: PickupRequest
    side_effects: []

  - method: GET
    path: "/curbside/pickup-requests"
    description: "List pickup requests (filterable)"
    roles: [Dispatcher, Inspector, Driver]
    code: 200
    input: ["household_id?", "route_day_id?", "status?", "scheduled_date?", "limit?", "offset?"]
    output: "PickupRequest[]"
    side_effects: []

  - method: POST
    path: "/curbside/pickup-requests/{id}/items"
    description: "Add an item to a DRAFT (or REFUSED for removal correction not supported — DRAFT only) request"
    roles: [Resident]
    code: 201
    input: [sequence_no, category, "is_oversize?", preparation_ack]
    output: PickupItem
    side_effects: ["recomputes PickupRequest.load_units", "increments PickupRequest.version by 1"]

  - method: DELETE
    path: "/curbside/pickup-requests/{id}/items/{item_id}"
    description: "Remove an item from a DRAFT request"
    roles: [Resident]
    code: 204
    input: []
    output: null
    side_effects: ["recomputes PickupRequest.load_units", "increments PickupRequest.version by 1"]

  - method: GET
    path: "/curbside/pickup-requests/{id}/items"
    description: "Reverse-reachability: items of a request"
    roles: [Dispatcher, Inspector, Resident, Driver]
    code: 200
    input: []
    output: "PickupItem[]"
    side_effects: []

  - method: POST
    path: "/curbside/pickup-requests/{id}/submit"
    description: "Submit DRAFT request; produces provisional quote and PROVISIONAL_QUOTE assessment"
    roles: [Resident]
    code: 200
    input: []
    output: PickupRequest
    side_effects: ["PickupRequest DRAFT->SUBMITTED", "runs item_fee_quote(provisional)", "creates FeeAssessment(PROVISIONAL_QUOTE)", "increments PickupRequest.version by 1"]

  - method: POST
    path: "/curbside/pickup-requests/{id}/schedule"
    description: "Schedule onto a route day (from SUBMITTED or REFUSED); OCC-guarded on RouteDay.version"
    roles: [Resident]
    code: 200
    input: [route_day_id, expected_route_day_version]
    output: PickupRequest
    side_effects: ["PickupRequest ->SCHEDULED", "freezes amnesty_applied", "runs allowance_ledger consume", "runs item_fee_quote(scheduled)", "RouteDay committed counters += ", "emits SCHEDULE_CONFIRMATION notification", "increments RouteDay.version by 1", "increments PickupRequest.version by 1"]

  - method: POST
    path: "/curbside/pickup-requests/{id}/cancel"
    description: "Cancel from SUBMITTED, SCHEDULED (before cutoff), MISSED, or REFUSED; OCC-guarded on PickupRequest.version"
    roles: [Resident]
    code: 200
    input: [expected_request_version]
    output: PickupRequest
    side_effects: ["PickupRequest ->CANCELLED", "allowance/route release per transition rules", "PROVISIONAL_QUOTE waived", "emits CANCELLATION_NOTICE", "increments PickupRequest.version by 1"]

  - method: POST
    path: "/curbside/pickup-requests/{id}/complete"
    description: "Driver marks pickup collected; builds final invoice and disposition routing"
    roles: [Driver]
    code: 200
    input: ["improper_preparation_item_ids?"]
    output: PickupRequest
    side_effects: ["PickupRequest SCHEDULED->COMPLETED", "runs final_invoice", "creates FeeAssessment(FINAL_INVOICE)", "waives PROVISIONAL_QUOTE", "runs disposition_routing", "increments PickupRequest.version by 1"]

  - method: POST
    path: "/curbside/pickup-requests/{id}/refuse"
    description: "Driver refuses non-compliant set-out; allowance NOT released"
    roles: [Driver]
    code: 200
    input: [refusal_reason_code]
    output: PickupRequest
    side_effects: ["PickupRequest SCHEDULED->REFUSED", "route capacity released", "PROVISIONAL_QUOTE waived", "emits REFUSAL_NOTICE with reason code and prep instructions", "increments PickupRequest.version by 1", "increments RouteDay.version by 1"]

  - method: POST
    path: "/curbside/pickup-requests/{id}/miss"
    description: "Driver marks stop missed (no set-out); allowance released"
    roles: [Driver]
    code: 200
    input: [missed_reason_code]
    output: PickupRequest
    side_effects: ["PickupRequest SCHEDULED->MISSED", "route capacity released", "allowance released", "PROVISIONAL_QUOTE waived", "emits MISSED_NOTICE", "increments PickupRequest.version by 1", "increments RouteDay.version by 1"]

  - method: GET
    path: "/curbside/pickup-requests/{id}/fee-assessments"
    description: "Reverse-reachability: assessments of a request"
    roles: [Dispatcher, Inspector, Resident]
    code: 200
    input: []
    output: "FeeAssessment[]"
    side_effects: []

  - method: GET
    path: "/curbside/pickup-requests/{id}/notifications"
    description: "Reverse-reachability: notifications of a request"
    roles: [Dispatcher, Inspector, Resident, Driver]
    code: 200
    input: []
    output: "Notification[]"
    side_effects: []

  - method: GET
    path: "/curbside/pickup-requests/{id}/dumping-reports"
    description: "Reverse-reachability: dumping reports linked to a request"
    roles: [Dispatcher, Inspector]
    code: 200
    input: []
    output: "DumpingReport[]"
    side_effects: []

  # --- Fee assessments ---
  - method: GET
    path: "/curbside/fee-assessments/{id}"
    description: "Fetch one assessment"
    roles: [Dispatcher, Inspector, Resident]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []

  - method: GET
    path: "/curbside/fee-assessments"
    description: "List assessments (filterable)"
    roles: [Dispatcher, Inspector]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: "FeeAssessment[]"
    side_effects: []

  - method: POST
    path: "/curbside/fee-assessments/{id}/settle"
    description: "Resident settles a PENDING assessment they own"
    roles: [Resident]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["FeeAssessment PENDING->SETTLED", "increments FeeAssessment.version by 1"]

  - method: POST
    path: "/curbside/fee-assessments/{id}/waive"
    description: "Dispatcher waives a PENDING assessment"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["FeeAssessment PENDING->WAIVED", "increments FeeAssessment.version by 1"]

  # --- Dumping reports ---
  - method: POST
    path: "/curbside/dumping-reports"
    description: "File a report of material set out at a household address"
    roles: [Inspector, Driver]
    code: 201
    input: [household_id, "pickup_request_id?"]
    output: DumpingReport
    side_effects: ["creates DumpingReport(status=OPEN, reported_at=clock, version=1)"]

  - method: GET
    path: "/curbside/dumping-reports/{id}"
    description: "Fetch one dumping report"
    roles: [Dispatcher, Inspector]
    code: 200
    input: []
    output: DumpingReport
    side_effects: []

  - method: GET
    path: "/curbside/dumping-reports"
    description: "List dumping reports"
    roles: [Dispatcher, Inspector]
    code: 200
    input: ["household_id?", "status?", "limit?", "offset?"]
    output: "DumpingReport[]"
    side_effects: []

  - method: POST
    path: "/curbside/dumping-reports/{id}/determine"
    description: "Inspector determines AUTHORIZED_SETOUT / ILLEGAL_DUMPING / DISMISSED"
    roles: [Inspector]
    code: 200
    input: [determination, "determination_notes?"]
    output: DumpingReport
    side_effects: ["DumpingReport OPEN->determined", "on ILLEGAL with linked request: creates FeeAssessment(ILLEGAL_DUMPING_FINE, amount from illegal_dumping_fine)", "on ILLEGAL: Household->SUSPENDED", "increments DumpingReport.version by 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted on endpoint, or Resident X-User-ID does not own the household-scoped resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK references a non-existent resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Trigger not listed for the resource's current state (e.g., schedule a DRAFT, complete a SUBMITTED, cancel a COMPLETED, dispatch a CLOSED route)"
  - id: ERR_STALE_ROUTE_VERSION
    http: 412
    condition: "expected_route_day_version does not match RouteDay.version at schedule time"
  - id: ERR_STALE_REQUEST_VERSION
    http: 412
    condition: "expected_request_version does not match PickupRequest.version at cancel time"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Schema/field validation failure: missing required field, unknown enum member, duplicate sequence_no within a request, zero items at submit"
  - id: ERR_PROHIBITED_ITEM
    http: 422
    condition: "Request contains an item with category == PROHIBITED at submit"
  - id: ERR_PREPARATION_NOT_ACKED
    http: 422
    condition: "An item's preparation_ack == false at submit"
  - id: ERR_HOUSEHOLD_SUSPENDED
    http: 409
    condition: "Household.status == SUSPENDED on request create / submit / schedule"
  - id: ERR_ZONE_MISMATCH
    http: 422
    condition: "RouteDay.service_zone differs from Household.service_zone at scheduling"
  - id: ERR_TEMPORAL_CONFLICT
    http: 422
    condition: "Clock/date rule broken: schedule into the past, cancel at/after midnight of pickup day, dispatch not day-of, complete/refuse/miss off-date, amnesty window starts_at >= ends_at, or amnesty half-open interval intersects an existing ACTIVE window"
  - id: ERR_DUPLICATE_PICKUP_DATE
    http: 409
    condition: "Household already holds a SCHEDULED request on the same route_date (point-equality date semantics)"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 409
    condition: "committed_load_units + load_units > max_load_units OR committed_stops + 1 > max_stops"
  - id: ERR_ROUTE_LOCKED
    http: 409
    condition: "Schedule/cancel attempted against a RouteDay with status != OPEN"
  - id: ERR_ROUTE_NOT_EMPTY
    http: 409
    condition: "Close attempted while any request on the route is still SCHEDULED"
  - id: ERR_DETERMINATION_INCONSISTENT
    http: 422
    condition: "AUTHORIZED determination without a linked SCHEDULED request within +/-1 day, ILLEGAL determination while such a link exists, or reinstate while linked ILLEGAL_DUMPING_FINE assessments remain PENDING"
  - id: ERR_ASSESSMENT_NOT_SETTLABLE
    http: 409
    condition: "Settle attempted on a non-PENDING assessment or by a Resident who does not own the linked household"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Resident
    description: "Household account holder requesting pickups and settling fees"
    identity: "entity_backed:Household"
    exclusive_operations:
      - "POST /curbside/pickup-requests"
      - "POST /curbside/pickup-requests/{id}/items"
      - "DELETE /curbside/pickup-requests/{id}/items/{item_id}"
      - "POST /curbside/pickup-requests/{id}/submit"
      - "POST /curbside/pickup-requests/{id}/schedule"
      - "POST /curbside/pickup-requests/{id}/cancel"
      - "POST /curbside/fee-assessments/{id}/settle"
    shared_operations:
      - "GET reads of own household, requests, items, allowances, assessments, notifications, route days, amnesty windows"

  - name: Driver
    description: "Route crew member executing pickups on dispatched routes"
    identity: "opaque"
    exclusive_operations:
      - "POST /curbside/pickup-requests/{id}/complete"
      - "POST /curbside/pickup-requests/{id}/refuse"
      - "POST /curbside/pickup-requests/{id}/miss"
    shared_operations:
      - "POST /curbside/dumping-reports (shared with Inspector)"
      - "GET reads of route days, requests, items, notifications"

  - name: Inspector
    description: "Code-enforcement officer determining dumping reports and reinstating households (segregation of duties: fine determination and reinstatement are Inspector-only; fee waiver is Dispatcher-only)"
    identity: "opaque"
    exclusive_operations:
      - "POST /curbside/dumping-reports/{id}/determine"
      - "POST /curbside/households/{id}/reinstate"
    shared_operations:
      - "POST /curbside/dumping-reports (shared with Driver)"
      - "GET reads of all resources"

  - name: Dispatcher
    description: "Municipal operations administrator: households, routes, amnesty windows, clock, fee waivers"
    identity: "opaque"
    exclusive_operations:
      - "POST /curbside/_clock/set_current_utc"
      - "POST /curbside/households"
      - "POST /curbside/route-days and dispatch/close actions"
      - "POST /curbside/amnesty-windows and cancel"
      - "POST /curbside/fee-assessments/{id}/waive"
    shared_operations:
      - "GET reads of all resources"
