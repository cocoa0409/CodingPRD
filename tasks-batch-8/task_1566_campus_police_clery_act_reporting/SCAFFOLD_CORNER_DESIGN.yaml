scaffold_corner_design:
  # ============================================================
  # Section: entities
  # ============================================================
  - section: entities
    instances:
      - name: create_clery_geography_applies_defaults
        claim_type: defaults
        grounds: [entities.CleryGeography.fields.is_residential_facility, entities.CleryGeography.fields.status]
        distinguishing_aspect: "Omitting the optional is_residential_facility yields false; new geography starts ACTIVE with version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "North Campus", category: "ON_CAMPUS" }, as: SystemAdmin, captures: { g: $.data.id } }
          trigger:
            - { call: "GET /clery-geographies/${g}", payload: {}, as: SystemAdmin }
          assert:
            - "CleryGeography.${g}.is_residential_facility == false (default applied)"
            - "CleryGeography.${g}.status == ACTIVE and version == 1"

      - name: create_geography_with_invalid_enum
        claim_type: type_constraints
        grounds: [entities.CleryGeography.fields.category, "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "category 'DOWNTOWN' is not a declared enum member; rejected with ERR_VALIDATION_FAILED 422."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clery-geographies", payload: { name: "Downtown", category: "DOWNTOWN" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION_FAILED, HTTP 422"

      - name: incident_system_fields_server_minted
        claim_type: system_fields
        grounds: [entities.IncidentReport.fields.report_number]
        distinguishing_aspect: "report_number, id, created_at are server-minted; report_number matches IR-<year>-<seq> derived from reported year."
        test_recipe:
          setup: ["one ON_CAMPUS geography"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Quad", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /incident-reports", payload: { reported_at: "2026-03-01T09:00:00Z", occurred_at: "2026-03-01T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "Test" }, as: PoliceChief, captures: { i: $.data.id, rn: $.data.report_number } }
          assert:
            - "IncidentReport.${i}.report_number matches 'IR-2026-######' (server-minted, zero-padded sequence)"
            - "status == DRAFT, version == 1, created_at == updated_at == 2026-08-01T00:00:00Z (default logical clock)"

      - name: csa_created_pending_training
        claim_type: defaults
        grounds: [entities.CampusSecurityAuthority.fields.status]
        distinguishing_aspect: "A freshly registered CSA is PENDING_TRAINING with null certification_expires_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Coach Kim", email: "kim@example.edu", department: "Athletics", csa_category: "COACH" }, as: SystemAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "GET /campus-security-authorities/${c}", payload: {}, as: SystemAdmin }
          assert:
            - "CampusSecurityAuthority.${c}.status == PENDING_TRAINING"
            - "CampusSecurityAuthority.${c}.certification_expires_at == null"

      - name: training_record_computed_window_and_pass
        claim_type: computed_fields
        grounds: [calculations.csa_certification_window, entities.CSATrainingRecord.fields.valid_to]
        distinguishing_aspect: "completed 2026-03-01 in year 2026 -> valid_to 2027-09-30T23:59:59Z; score 88 >= 80 -> passed true; CSA becomes ACTIVE."
        test_recipe:
          setup: ["CSA registered (PENDING_TRAINING)"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Rita RA", email: "rita@example.edu", department: "Housing", csa_category: "RESIDENT_ADVISOR" }, as: SystemAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /campus-security-authorities/${c}/training-records", payload: { completed_at: "2026-03-01T10:00:00Z", score: 88 }, as: SystemAdmin, captures: { tr: $.data.id } }
            - { call: "GET /campus-security-authorities/${c}", payload: {}, as: SystemAdmin }
          assert:
            - "CSATrainingRecord.${tr}.passed == true and training_year == 2026"
            - "CSATrainingRecord.${tr}.valid_from == 2026-03-01T10:00:00Z and valid_to == 2027-09-30T23:59:59Z"
            - "CampusSecurityAuthority.${c}.status == ACTIVE with certification_expires_at == 2027-09-30T23:59:59Z and active_training_record_id == ${tr}"

      - name: training_score_79_not_passed
        claim_type: constants_applied
        grounds: [calculations.csa_certification_window]
        distinguishing_aspect: "Score 79 is one below the inclusive TRAINING_PASS_SCORE 80: passed false, CSA stays PENDING_TRAINING."
        test_recipe:
          setup: ["CSA registered"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Sam Sec", email: "sam@example.edu", department: "Security", csa_category: "SECURITY_STAFF" }, as: SystemAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /campus-security-authorities/${c}/training-records", payload: { completed_at: "2026-03-01T10:00:00Z", score: 79 }, as: SystemAdmin, captures: { tr: $.data.id } }
            - { call: "GET /campus-security-authorities/${c}", payload: {}, as: SystemAdmin }
          assert:
            - "CSATrainingRecord.${tr}.passed == false"
            - "CampusSecurityAuthority.${c}.status == PENDING_TRAINING (no activation on a failing score)"

      - name: log_entry_auto_created_on_submit
        claim_type: creation
        grounds: [state_machines.IncidentReport.DRAFT_to_SUBMITTED, entities.DailyCrimeLogEntry.fields.entry_number]
        distinguishing_aspect: "Submitting an incident cascades exactly one DailyCrimeLogEntry with disposition OPEN, nature 'Unclassified', is_public true."
        test_recipe:
          setup: ["geography; incident in DRAFT"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Mall", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-07-30T09:00:00Z", occurred_at: "2026-07-30T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "Theft" }, as: PoliceChief, captures: { i: $.data.id } }
          trigger:
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "GET /daily-crime-log", payload: { incident_id: "${i}" }, as: PoliceChief, captures: { le: "$.data[0].id" } }
          assert:
            - "Exactly 1 DailyCrimeLogEntry exists for incident ${i} (total_count == 1)"
            - "DailyCrimeLogEntry.${le}.disposition == OPEN, nature == 'Unclassified', is_public == true"
            - "date_reported == 2026-07-30T09:00:00Z copied from the incident"

      - name: get_nonexistent_incident_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown incident id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /incident-reports/00000000-0000-0000-0000-000000000000", payload: {}, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: patch_geography_increments_version
        claim_type: system_fields
        grounds: ["endpoints.PATCH /clery-geographies/{id}"]
        distinguishing_aspect: "Every mutation bumps version by exactly 1 and refreshes updated_at."
        test_recipe:
          setup: ["one geography"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Old Name", category: "NON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PATCH /clery-geographies/${g}", payload: { name: "New Name" }, as: SystemAdmin, captures: { v2: $.data.version } }
          assert:
            - "version went ${v1} == 1 -> ${v2} == 2"
            - "updated_at advanced beyond created_at"

      - name: list_endpoint_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more with defaults limit=10 offset=0."
        test_recipe:
          setup: ["two geographies created"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "G1", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin }
            - { call: "POST /clery-geographies", payload: { name: "G2", category: "NON_CAMPUS", is_residential_facility: false }, as: SystemAdmin }
          trigger:
            - { call: "GET /clery-geographies", payload: {}, as: SystemAdmin }
          assert:
            - "Response is an array envelope with total_count == 2, has_more == false, limit == 10, offset == 0"
            - "meta.api_request_id present and response_type == 'array'"

      - name: referral_with_unknown_geography_reference_not_found
        claim_type: parent_relationships
        grounds: ["errors[ERR_REFERENCE_NOT_FOUND]", entities.CSAReferralReport.fields.geography_id]
        distinguishing_aspect: "A body FK that does not resolve yields ERR_REFERENCE_NOT_FOUND 404 (existence of body references is checked after path existence)."
        test_recipe:
          setup: ["ACTIVE CSA (trained)"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Dan Dean", email: "dan@example.edu", department: "Students", csa_category: "DEAN" }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /campus-security-authorities/${c}/training-records", payload: { completed_at: "2026-05-01T10:00:00Z", score: 95 }, as: SystemAdmin }
          trigger:
            - { call: "POST /csa-referral-reports", payload: { occurred_at: "2026-06-01T10:00:00Z", geography_id: "00000000-0000-0000-0000-000000000000", offense_suspicion: "BURGLARY", narrative: "Seen at dorm" }, as: CampusSecurityAuthority, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND, HTTP 404"

  # ============================================================
  # Section: state_machines
  # ============================================================
  - section: state_machines
    instances:
      - name: incident_submit_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.IncidentReport.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "DRAFT -> SUBMITTED succeeds and bumps version."
        test_recipe:
          setup: ["geography; incident DRAFT"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Plaza", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-01T09:00:00Z", occurred_at: "2026-04-01T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
          trigger:
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
          assert:
            - "IncidentReport.${i}.status == SUBMITTED and version == 2"

      - name: classify_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.IncidentReport, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "classify is only declared from UNDER_CLASSIFICATION/UNDER_RECLASSIFICATION; from DRAFT it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["geography; incident DRAFT (version 1)"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Yard", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-02T09:00:00Z", occurred_at: "2026-04-02T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id, iv: $.data.version } }
          trigger:
            - { call: "POST /incident-reports/${i}/classify", payload: { geography_id: "${g}", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${iv}" }, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; status remains DRAFT"

      - name: begin_reclassification_from_unfounded_returns_incident_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IncidentReport, "errors[ERR_INCIDENT_TERMINAL]"]
        distinguishing_aspect: "UNFOUNDED is terminal: begin-reclassification from UNFOUNDED fails with ERR_INCIDENT_TERMINAL."
        test_recipe:
          setup: ["incident classified then UNFOUNDED"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Court", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-03T09:00:00Z", occurred_at: "2026-04-03T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/begin-classification", payload: {}, as: CleryCoordinator, captures: { iv: $.data.version } }
            - { call: "POST /incident-reports/${i}/classify", payload: { geography_id: "${g}", offense_counts: [ { offense_type: "ROBBERY", victim_count: 1 } ], expected_incident_version: "${iv}" }, as: CleryCoordinator }
            - { call: "POST /incident-reports/${i}/unfound", payload: { justification: "Fabricated" }, as: PoliceChief }
          trigger:
            - { call: "POST /incident-reports/${i}/begin-reclassification", payload: {}, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INCIDENT_TERMINAL, HTTP 409"

      - name: close_pending_alert_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SafetyAlert, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "close is declared only from DISSEMINATED or DECIDED_NO_ISSUE; from PENDING_REVIEW it fails."
        test_recipe:
          setup: ["submitted incident; alert PENDING_REVIEW"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Ave", category: "PUBLIC_PROPERTY", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-04T09:00:00Z", occurred_at: "2026-04-04T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/safety-alerts", payload: { alert_type: "TIMELY_WARNING" }, as: CleryCoordinator, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /safety-alerts/${a}/close", payload: {}, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; status remains PENDING_REVIEW"

      - name: corrective_action_reject_cycles_to_open
        claim_type: valid_transition
        grounds: [state_machines.CorrectiveAction.SUBMITTED_to_OPEN]
        distinguishing_aspect: "reject returns the action to OPEN (cycle) and increments rejection_count; verification_note stored."
        test_recipe:
          setup: ["review advanced to CORRECTIVE_ACTION with one OPEN action"]
          setup_api_calls:
            - { call: "POST /program-reviews", payload: { scope_year_start: 2024, scope_year_end: 2025 }, as: FederalReviewer, captures: { pr: $.data.id } }
            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: FederalReviewer }
            - { call: "POST /program-reviews/${pr}/corrective-actions", payload: { finding_code: "ASR-100", severity: "MEDIUM", description: "Late ASR", due_date: "2026-09-15" }, as: FederalReviewer, captures: { ca: $.data.id } }
            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: FederalReviewer }
            - { call: "POST /corrective-actions/${ca}/submit", payload: { resolution_summary: "Procedures updated" }, as: CleryCoordinator }
          trigger:
            - { call: "POST /corrective-actions/${ca}/reject", payload: { verification_note: "Insufficient evidence" }, as: FederalReviewer }
          assert:
            - "CorrectiveAction.${ca}.status == OPEN (cycled back)"
            - "CorrectiveAction.${ca}.rejection_count == 1 and verification_note == 'Insufficient evidence'"

      - name: review_verification_loop_and_close
        claim_type: valid_transition
        grounds: [state_machines.ProgramReview.UNDER_VERIFICATION_to_CORRECTIVE_ACTION, state_machines.CorrectiveAction.SUBMITTED_to_VERIFIED]
        distinguishing_aspect: "verify of the last open action auto-advances the review to UNDER_VERIFICATION; return-for-correction loops back; a second pass reaches CLOSED."
        test_recipe:
          setup: ["review in CORRECTIVE_ACTION with one OPEN action"]
          setup_api_calls:
            - { call: "POST /program-reviews", payload: { scope_year_start: 2022, scope_year_end: 2023 }, as: FederalReviewer, captures: { pr: $.data.id } }
            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: FederalReviewer }
            - { call: "POST /program-reviews/${pr}/corrective-actions", payload: { finding_code: "LOG-200", severity: "LOW", description: "Log gap", due_date: "2026-09-01" }, as: FederalReviewer, captures: { ca: $.data.id } }
            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: FederalReviewer }
            - { call: "POST /corrective-actions/${ca}/submit", payload: { resolution_summary: "Fixed" }, as: CleryCoordinator }
          trigger:
            - { call: "POST /corrective-actions/${ca}/verify", payload: {}, as: FederalReviewer }
            - { call: "GET /program-reviews/${pr}", payload: {}, as: FederalReviewer, captures: { st1: $.data.status } }
            - { call: "POST /program-reviews/${pr}/return-for-correction", payload: { note: "Spot-check failed" }, as: FederalReviewer }
            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: FederalReviewer }
            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: FederalReviewer, captures: { st2: $.data.status } }
          assert:
            - "After verify: ProgramReview.${pr}.status == UNDER_VERIFICATION (auto-advance cascade, no manual call)"
            - "After return-for-correction: status == CORRECTIVE_ACTION"
            - "Final advance from UNDER_VERIFICATION (open_action_count == 0): status == CLOSED"

      - name: csa_lapses_when_clock_passes_expiry
        claim_type: valid_transition
        grounds: [state_machines.CampusSecurityAuthority.ACTIVE_to_LAPSED, state_machines.CSATrainingRecord.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "System transition: when the logical clock passes certification_expires_at the CSA reads as LAPSED and the training record EXPIRED."
        test_recipe:
          setup: ["CSA ACTIVE via training completed 2025-06-01 (valid_to 2026-09-30T23:59:59Z); clock advanced to 2026-10-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Ollie Official", email: "ollie@example.edu", department: "Admin", csa_category: "OTHER_OFFICIAL" }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /campus-security-authorities/${c}/training-records", payload: { completed_at: "2025-06-01T10:00:00Z", score: 92 }, as: SystemAdmin, captures: { tr: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /campus-security-authorities/${c}", payload: {}, as: SystemAdmin }
            - { call: "GET /campus-security-authorities/${c}/training-records", payload: {}, as: SystemAdmin }
          assert:
            - "CampusSecurityAuthority.${c}.status == LAPSED"
            - "CSATrainingRecord.${tr}.status == EXPIRED"

      - name: disposition_unfound_via_patch_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DailyCrimeLogEntry, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "UNFOUNDED disposition is cascade-only; a direct PATCH with disposition UNFOUNDED is rejected."
        test_recipe:
          setup: ["submitted incident; log entry OPEN"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Lane", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-07-28T09:00:00Z", occurred_at: "2026-07-28T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "GET /daily-crime-log", payload: { incident_id: "${i}" }, as: PoliceChief, captures: { le: "$.data[0].id" } }
          trigger:
            - { call: "PATCH /daily-crime-log-entries/${le}/disposition", payload: { disposition: "UNFOUNDED" }, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409 (must unfound the incident instead); disposition remains OPEN"

      - name: referral_mark_duplicate_twice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CSAReferralReport, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DUPLICATE is terminal; a second mark-duplicate fails with ERR_INVALID_STATE (idempotency of triggers is NOT allowed)."
        test_recipe:
          setup: ["ACTIVE CSA; referral in RECEIVED"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Ann RA", email: "ann@example.edu", department: "Housing", csa_category: "RESIDENT_ADVISOR" }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /campus-security-authorities/${c}/training-records", payload: { completed_at: "2026-06-01T10:00:00Z", score: 90 }, as: SystemAdmin }
            - { call: "POST /clery-geographies", payload: { name: "Dorm Row", category: "ON_CAMPUS_RESIDENTIAL", is_residential_facility: true }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /csa-referral-reports", payload: { occurred_at: "2026-07-01T22:00:00Z", geography_id: "${g}", offense_suspicion: "LIQUOR_LAW_REFERRAL", narrative: "Noise and alcohol" }, as: CampusSecurityAuthority, as_user_id: "${c}", captures: { r: $.data.id } }
            - { call: "POST /csa-referral-reports/${r}/mark-duplicate", payload: {}, as: CleryCoordinator }
          trigger:
            - { call: "POST /csa-referral-reports/${r}/mark-duplicate", payload: {}, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; status remains DUPLICATE"

      - name: republish_without_recompile_returns_recompile_required
        claim_type: precondition_enforcement
        grounds: [state_machines.AnnualSecurityReport.UNDER_AMENDMENT_to_REPUBLISHED, "errors[ERR_RECOMPILE_REQUIRED]"]
        distinguishing_aspect: "republish requires compiled_at > amendment_started_at; amending without a fresh compile blocks republish."
        test_recipe:
          setup: ["ASR 2026 PUBLISHED then moved to UNDER_AMENDMENT"]
          setup_api_calls:
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr: $.data.id, av: $.data.version } }
            - { call: "POST /annual-security-reports/${asr}/compile", payload: { variant: "FINAL", expected_report_version: "${av}" }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports/${asr}/submit-review", payload: {}, as: CleryCoordinator }
            - { call: "POST /annual-security-reports/${asr}/publish", payload: {}, as: PoliceChief }
            - { call: "POST /annual-security-reports/${asr}/begin-amendment", payload: {}, as: CleryCoordinator }
          trigger:
            - { call: "POST /annual-security-reports/${asr}/republish", payload: {}, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RECOMPILE_REQUIRED, HTTP 422; status remains UNDER_AMENDMENT"

      - name: withdraw_then_submit_returns_incident_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IncidentReport.DRAFT_to_WITHDRAWN, "errors[ERR_INCIDENT_TERMINAL]"]
        distinguishing_aspect: "WITHDRAWN is terminal; submit from WITHDRAWN fails with ERR_INCIDENT_TERMINAL."
        test_recipe:
          setup: ["incident DRAFT withdrawn"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Terrace", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-05T09:00:00Z", occurred_at: "2026-04-05T08:00:00Z", geography_id: "${g}", source: "ANONYMOUS", narrative: "x" }, as: CleryCoordinator, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/withdraw", payload: {}, as: CleryCoordinator }
          trigger:
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INCIDENT_TERMINAL, HTTP 409"

      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.IncidentReport, state_machines.ProgramReview, state_machines.CorrectiveAction]
        distinguishing_aspect: "Newly created entities start in their declared initial states."
        test_recipe:
          setup: ["geography exists"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Green", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-06T09:00:00Z", occurred_at: "2026-04-06T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /program-reviews", payload: { scope_year_start: 2020, scope_year_end: 2021 }, as: FederalReviewer, captures: { pr: $.data.id } }
            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: FederalReviewer }
            - { call: "POST /program-reviews/${pr}/corrective-actions", payload: { finding_code: "FW-300", severity: "LOW", description: "d", due_date: "2026-09-01" }, as: FederalReviewer, captures: { ca: $.data.id } }
          assert:
            - "IncidentReport.${i}.status == DRAFT"
            - "CorrectiveAction.${ca}.status == OPEN and ProgramReview.${pr}.status == FINDINGS_ISSUED"

  # ============================================================
  # Section: calculations
  # ============================================================
  - section: calculations
    instances:
      - name: log_entry_timeliness_business_day_skip_weekend
        claim_type: correct_result
        grounds: [calculations.log_entry_timeliness]
        distinguishing_aspect: "Business-day counting skips weekends: Friday report entered Monday is 1 business day (not overdue); entered Wednesday is 3 (overdue)."
        test_recipe:
          setup:
            - "Incident X reported 2026-07-31T20:00:00Z (Friday), submitted Monday 2026-08-03T10:00:00Z"
            - "Incident Y reported 2026-07-31T20:00:00Z, submitted Wednesday 2026-08-05T10:00:00Z"
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "North", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-07-31T20:00:00Z", occurred_at: "2026-07-31T19:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "X" }, as: PoliceChief, captures: { ix: $.data.id } }
            - { call: "POST /incident-reports/${ix}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-07-31T20:00:00Z", occurred_at: "2026-07-31T19:30:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "Y" }, as: PoliceChief, captures: { iy: $.data.id } }
            - { call: "POST /incident-reports/${iy}/submit", payload: {}, as: PoliceChief }
          trigger:
            - { call: "GET /daily-crime-log", payload: { incident_id: "${ix}" }, as: PoliceChief, captures: { ex: "$.data[0].entry_overdue" } }
            - { call: "GET /daily-crime-log", payload: { incident_id: "${iy}" }, as: PoliceChief, captures: { ey: "$.data[0].entry_overdue" } }
          assert:
            - "Incident X entry: entry_overdue == false (1 business day: Mon 2026-08-03)"
            - "Incident Y entry: entry_overdue == true (3 business days: Mon, Tue, Wed > 2)"

      - name: warning_decision_overdue_one_second_past_deadline
        claim_type: constants_applied
        grounds: [calculations.timely_warning_deadline]
        distinguishing_aspect: "decided_at one second past reported_at + 48h flips decision_overdue to true (strict >)."
        test_recipe:
          setup: ["incident reported 2026-08-01T00:00:00Z, submitted; alert PENDING_REVIEW; clock 2026-08-03T00:00:01Z"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Row", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-08-01T00:00:00Z", occurred_at: "2026-07-31T22:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/safety-alerts", payload: { alert_type: "TIMELY_WARNING" }, as: CleryCoordinator, captures: { a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:01Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /safety-alerts/${a}/decide", payload: { decision: "ISSUE", decision_rationale: "threat" }, as: CleryCoordinator }
          assert:
            - "SafetyAlert.${a}.decision_overdue == true (48h00m01s > 48h)"

      - name: dissemination_overdue_one_second_past_24h
        claim_type: constants_applied
        grounds: [calculations.timely_warning_deadline]
        distinguishing_aspect: "disseminated_at one second past authorized_at + 24h flips dissemination_overdue to true."
        test_recipe:
          setup: ["alert AUTHORIZED at 2026-08-01T00:00:00Z; clock advanced to 2026-08-02T00:00:01Z"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Blvd", category: "PUBLIC_PROPERTY", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-07-30T00:00:00Z", occurred_at: "2026-07-29T22:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/safety-alerts", payload: { alert_type: "EMERGENCY_NOTIFICATION" }, as: CleryCoordinator, captures: { a: $.data.id } }
            - { call: "POST /safety-alerts/${a}/decide", payload: { decision: "ISSUE", decision_rationale: "immediate threat" }, as: CleryCoordinator }
            - { call: "POST /safety-alerts/${a}/authorize", payload: {}, as: PoliceChief }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:01Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /safety-alerts/${a}/disseminate", payload: { distribution_channels: ["SIREN", "SMS"] }, as: PoliceChief }
          assert:
            - "SafetyAlert.${a}.status == DISSEMINATED and dissemination_overdue == true (24h00m01s > 24h)"

      - name: penalty_score_repeat_finding_doubles_and_escalates
        claim_type: correct_result
        grounds: [calculations.program_review_penalty_score]
        distinguishing_aspect: "A HIGH finding repeated from a CLOSED review doubles to 100; adding LOW (10) yields penalty_score 110 >= 100 -> escalated."
        test_recipe:
          setup:
            - "Review R1 [2022,2023] fully CLOSED with action finding_code LOG-001 (HIGH)"
            - "Review R2 [2024,2025] in FINDINGS_ISSUED"
          setup_api_calls:
            - { call: "POST /program-reviews", payload: { scope_year_start: 2022, scope_year_end: 2023 }, as: FederalReviewer, captures: { r1: $.data.id } }
            - { call: "POST /program-reviews/${r1}/advance", payload: {}, as: FederalReviewer }
            - { call: "POST /program-reviews/${r1}/corrective-actions", payload: { finding_code: "LOG-001", severity: "HIGH", description: "Log not maintained", due_date: "2026-09-01" }, as: FederalReviewer, captures: { r1a: $.data.id } }
            - { call: "POST /program-reviews/${r1}/advance", payload: {}, as: FederalReviewer }
            - { call: "POST /corrective-actions/${r1a}/submit", payload: { resolution_summary: "done" }, as: CleryCoordinator }
            - { call: "POST /corrective-actions/${r1a}/verify", payload: {}, as: FederalReviewer }
            - { call: "POST /program-reviews/${r1}/advance", payload: {}, as: FederalReviewer }
            - { call: "POST /program-reviews", payload: { scope_year_start: 2024, scope_year_end: 2025 }, as: FederalReviewer, captures: { r2: $.data.id } }
            - { call: "POST /program-reviews/${r2}/advance", payload: {}, as: FederalReviewer }
          trigger:
            - { call: "POST /program-reviews/${r2}/corrective-actions", payload: { finding_code: "LOG-001", severity: "HIGH", description: "Repeat log finding", due_date: "2026-10-01" }, as: FederalReviewer, captures: { r2a: $.data.id } }
            - { call: "POST /program-reviews/${r2}/corrective-actions", payload: { finding_code: "ASR-002", severity: "LOW", description: "Minor ASR gap", due_date: "2026-10-01" }, as: FederalReviewer }
            - { call: "GET /program-reviews/${r2}", payload: {}, as: FederalReviewer }
          assert:
            - "CorrectiveAction.${r2a}.is_repeat_finding == true and weight == 100 (50 * 2)"
            - "ProgramReview.${r2}.penalty_score == 110 (100 + 10)"
            - "ProgramReview.${r2}.escalated == true (110 >= 100, inclusive threshold)"

      - name: fire_provisional_totals_include_unfinalized_estimates
        claim_type: variant_divergence
        grounds: [calculations.fire_damage_aggregation]
        distinguishing_aspect: "With one REPORTED (unfinalized) fire of estimate 250.75, compile leaves total_damage_dollars == 0 while provisional_total_damage_dollars == 250.75."
        test_recipe:
          setup: ["residential geography; FSR 2026; one REPORTED fire incident, estimate 250.75"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Hall D", category: "ON_CAMPUS_RESIDENTIAL", is_residential_facility: true }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /fire-safety-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { fsr: $.data.id } }
            - { call: "POST /fire-incidents", payload: { geography_id: "${g}", occurred_at: "2026-03-03T01:00:00Z", cause_category: "OPEN_FLAME", injuries: 2, deaths: 0, estimated_damage_dollars: 250.75 }, as: PoliceChief, captures: { f: $.data.id } }
          trigger:
            - { call: "POST /fire-safety-reports/${fsr}/compile", payload: {}, as: CleryCoordinator }
          assert:
            - "FireSafetyReport.${fsr}.total_fires == 0 and total_damage_dollars == 0 and total_injuries == 0 (REPORTED excluded from final totals)"
            - "FireSafetyReport.${fsr}.provisional_total_damage_dollars == 250.75 (unrounded estimate, REPORTED only)"
            - "FireSafetyReport.${fsr}.status == COMPILED"

      - name: referral_forward_overdue_flag
        claim_type: correct_result
        grounds: [entities.CSAReferralReport.fields.forward_overdue]
        distinguishing_aspect: "forwarded_at strictly greater than received_at + 24h -> forward_overdue true; immediate forward -> false."
        test_recipe:
          setup: ["ACTIVE CSA; geography; referral R1 created at 2026-08-01T00:00:00Z (default clock); clock then moved to 2026-08-02T00:00:01Z; referral R2 created at that time"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Cory Coach", email: "cory@example.edu", department: "Athletics", csa_category: "COACH" }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /campus-security-authorities/${c}/training-records", payload: { completed_at: "2026-07-01T10:00:00Z", score: 91 }, as: SystemAdmin }
            - { call: "POST /clery-geographies", payload: { name: "Field", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /csa-referral-reports", payload: { occurred_at: "2026-07-31T22:00:00Z", geography_id: "${g}", offense_suspicion: "DRUG_LAW_REFERRAL", narrative: "R1" }, as: CampusSecurityAuthority, as_user_id: "${c}", captures: { r1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:01Z" }, as: SystemAdmin }
            - { call: "POST /csa-referral-reports", payload: { occurred_at: "2026-08-01T22:00:00Z", geography_id: "${g}", offense_suspicion: "LIQUOR_LAW_REFERRAL", narrative: "R2" }, as: CampusSecurityAuthority, as_user_id: "${c}", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /csa-referral-reports/${r1}/forward", payload: {}, as: CampusSecurityAuthority, as_user_id: "${c}" }
            - { call: "POST /csa-referral-reports/${r2}/forward", payload: {}, as: CampusSecurityAuthority, as_user_id: "${c}" }
          assert:
            - "CSAReferralReport.${r1}.forward_overdue == true (24h00m01s > 24h) and status == FORWARDED"
            - "CSAReferralReport.${r2}.forward_overdue == false (forwarded at creation instant) and forwarded_at == 2026-08-02T00:00:01Z"

      - name: vawa_and_referral_exemption_counted
        claim_type: variant_divergence
        grounds: [calculations.offense_hierarchy_resolution]
        excluded_because:
          difficulty_instance: offense_hierarchy_with_exemptions_and_double_count
          rationale: "VAWA/referral exemption and referred-persons counting are asserted verbatim in the named §1.8 instance."

      - name: residential_double_count_column
        claim_type: correct_result
        grounds: [calculations.geography_column_mapping]
        excluded_because:
          difficulty_instance: offense_hierarchy_with_exemptions_and_double_count
          rationale: "ON_CAMPUS_RESIDENTIAL double-count into both columns is asserted in the named §1.8 instance."

      - name: provisional_includes_under_reclassification
        claim_type: input_set_filtering
        grounds: [calculations.asr_statistics_compilation]
        excluded_because:
          difficulty_instance: asr_compilation_provisional_vs_final
          rationale: "PROVISIONAL vs FINAL input-set filtering is the named §1.8 instance's subject."

  # ============================================================
  # Section: validations
  # ============================================================
  - section: validations
    instances:
      - name: unknown_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "An unrecognized X-User-Role value is rejected with ERR_UNAUTHENTICATED 401 before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clery-geographies", payload: { name: "X", category: "ON_CAMPUS" }, as: SuperUser, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401"

      - name: incident_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required reported_at yields ERR_INVALID_REQUEST 400 before existence/state checks run."
        test_recipe:
          setup: ["one geography"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Q", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /incident-reports", payload: { occurred_at: "2026-04-01T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: classify_with_unknown_geography_returns_reference_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "classify referencing a nonexistent geography_id yields ERR_REFERENCE_NOT_FOUND 404 (body-FK existence precedes state/business rules after path checks)."
        test_recipe:
          setup: ["incident UNDER_CLASSIFICATION"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Z", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-07T09:00:00Z", occurred_at: "2026-04-07T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/begin-classification", payload: {}, as: CleryCoordinator, captures: { iv: $.data.version } }
          trigger:
            - { call: "POST /incident-reports/${i}/classify", payload: { geography_id: "00000000-0000-0000-0000-000000000000", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${iv}" }, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND, HTTP 404"

      - name: inspection_date_range_inverted_returns_validation
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "from_date > to_date violates date ordering -> ERR_VALIDATION_FAILED 422."
        test_recipe:
          setup: ["empty database (no entries needed)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /daily-crime-log/inspection-requests", payload: { requester_name: "P", requester_contact: "p@example.com", from_date: "2026-06-10", to_date: "2026-06-01" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION_FAILED, HTTP 422"

      - name: duplicate_active_alert_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ACTIVE_ALERT]"]
        distinguishing_aspect: "A second alert on an incident with a non-CLOSED alert yields ERR_DUPLICATE_ACTIVE_ALERT 409."
        test_recipe:
          setup: ["submitted incident; one alert PENDING_REVIEW"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "W", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-08T09:00:00Z", occurred_at: "2026-04-08T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/safety-alerts", payload: { alert_type: "TIMELY_WARNING" }, as: CleryCoordinator }
          trigger:
            - { call: "POST /incident-reports/${i}/safety-alerts", payload: { alert_type: "EMERGENCY_NOTIFICATION" }, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE_ALERT, HTTP 409"

      - name: retire_geography_in_use_blocked
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_GEOGRAPHY_IN_USE]"]
        distinguishing_aspect: "Retiring a geography referenced by a non-terminal incident yields ERR_GEOGRAPHY_IN_USE 409."
        test_recipe:
          setup: ["geography referenced by a SUBMITTED incident"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Busy", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-09T09:00:00Z", occurred_at: "2026-04-09T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
          trigger:
            - { call: "PATCH /clery-geographies/${g}", payload: { status: "RETIRED" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_GEOGRAPHY_IN_USE, HTTP 409; geography remains ACTIVE"

      - name: retired_geography_rejected_on_incident_create
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_GEOGRAPHY_RETIRED]"]
        distinguishing_aspect: "Creating an incident against an unreferenced RETIRED geography yields ERR_GEOGRAPHY_RETIRED 422."
        test_recipe:
          setup: ["geography retired while unreferenced"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Retired Lot", category: "NON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "PATCH /clery-geographies/${g}", payload: { status: "RETIRED" }, as: SystemAdmin }
          trigger:
            - { call: "POST /incident-reports", payload: { reported_at: "2026-04-10T09:00:00Z", occurred_at: "2026-04-10T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_GEOGRAPHY_RETIRED, HTTP 422"

      - name: fire_incident_requires_residential_facility
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_RESIDENTIAL_FACILITY_REQUIRED]"]
        distinguishing_aspect: "A fire incident against an ACTIVE but non-residential geography yields ERR_RESIDENTIAL_FACILITY_REQUIRED 422."
        test_recipe:
          setup: ["ON_CAMPUS geography with is_residential_facility false"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Academic Hall", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /fire-incidents", payload: { geography_id: "${g}", occurred_at: "2026-05-01T01:00:00Z", cause_category: "ELECTRICAL", estimated_damage_dollars: 100 }, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RESIDENTIAL_FACILITY_REQUIRED, HTTP 422"

      - name: duplicate_asr_year_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_REPORT_YEAR]"]
