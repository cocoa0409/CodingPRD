              payload: { boater_id: "${boater_id}", name: "Sv", length_ft: 30, registration_number: "REG-ST", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit_id: $.data.id, inv_id: $.data.invoice_id }
            - call: "POST /marina/invoices/${inv_id}/pay"
              payload: { amount_cents: 120000 }
              as: Harbormaster
            - call: "GET /marina/permits/${permit_id}"
              payload: {}
              as: Harbormaster
              captures: { pv0: $.data.version }
            - call: "POST /marina/permits/${permit_id}/reassign-berth"
              payload: { new_berth_id: "${slip2}", expected_permit_version: "${pv0}" }
              as: Harbormaster
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /marina/permits/${permit_id}/reassign-berth"
              payload: { new_berth_id: "${slip3}", expected_permit_version: "${pv0}" }
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_STALE_VERSION"
            - "Permit.${permit_id}.berth_id == ${slip2}"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: permit_apply_returns_offered_state_immediately
        claim_type: immediate
        grounds:
          - 'state_machines.Permit.none_to_OFFERED'
          - 'entities.Permit.fields.invoice_id'
        distinguishing_aspect: "A permit application against an AVAILABLE berth returns 201 with status OFFERED and a non-null invoice_id in the same response (immediate consistency)."
        test_recipe:
          setup: ["A marina with an AVAILABLE matching berth and a registered vessel."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Imm I", email: "imm@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Iv", length_ft: 30, registration_number: "REG-IM", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit_id: $.data.id }
          assert:
            - "Permit.${permit_id}.status == OFFERED"
            - "Permit.${permit_id}.berth_id == ${berth_id}"
            - "Permit.${permit_id}.provisional_fee_cents == 120000"
