scenario: "2013. Robotics Integration & Cell Commissioning (FANUC/ABB system integrator): application study & cycle-time simulation, safety risk assessment & fencing/light-curtain design, robot/end-effector selection & payload check, program development & offline simulation, factory vs site acceptance test, spare-part & preventive-maintenance package, operator/technician training, throughput guarantee & retention"
domain_name: robotics-integration-cell-commissioning
api_prefix: /robotics

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version-pinning on approval
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: IntegratorOrg
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the integrator organization" }
      - { name: brand_specialization, type: enum, source: input, description: "Robot brands this org is certified to integrate", constraints: "enum: {FANUC, ABB, DUAL}" }
      - { name: retention_rate_bps, type: integer, source: input, description: "Default contractual retention withheld from milestone invoices, in basis points (100 bps = 1.00%)", constraints: "0 <= retention_rate_bps <= 2000" }
      - { name: default_pl_category_target, type: enum, source: input, description: "Default target Performance Level for safety functions per ISO 13849-1", constraints: "enum: {PLc, PLd, PLe}" }

  - name: CustomerSite
    parent: IntegratorOrg
    common_fields: true
    fields:
      - { name: integrator_org_id, type: string, source: input, description: "FK -> IntegratorOrg.id; owning integrator" }
      - { name: site_name, type: string, source: input, description: "Human-readable customer site name" }
      - { name: plant_tz, type: string, source: input, description: "IANA timezone of the plant floor; drives shift-window boundary computations" }
      - { name: shift_windows_per_day, type: integer, source: input, description: "Number of production shifts per calendar day used by throughput math", constraints: "1 <= shift_windows_per_day <= 3" }

  - name: CellProject
    parent: CustomerSite
    common_fields: true
    fields:
      - { name: customer_site_id, type: string, source: input, description: "FK -> CustomerSite.id; commissioning site" }
      - { name: project_code, type: string, source: input, description: "Customer-facing project code", constraints: "unique per customer_site_id" }
      - { name: contracted_cycle_time_s, type: number, source: input, description: "Contractually guaranteed cycle time in seconds per part", constraints: "> 0" }
      - { name: contract_value_cents, type: integer, source: input, description: "Total contract value in cents; basis for retention computation", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle status of the project", default: DRAFT, constraints: "enum: {DRAFT, STUDY, DESIGN, BUILD, FAT, SHIP, SAT, TRAINING, GUARANTEE, CLOSED, ON_HOLD, TERMINATED}" }
      - { name: hold_reason, type: string, source: system, description: "Populated when status == ON_HOLD; null otherwise", default: null }
      - { name: rework_count, type: integer, source: system, description: "Number of times the project has re-entered DESIGN from FAT or SAT rejection", default: 0 }
      - { name: retention_balance_cents, type: integer, source: computed, description: "Outstanding retention withheld, derived from RetentionLedger entries; starts at contract_value_cents * retention_rate_bps / 10000 rounded half-up to cents" }
      - { name: guaranteed_oee_pct, type: number, source: input, description: "Contracted Overall-Equipment-Effectiveness percentage used by the throughput guarantee", constraints: "50.0 <= guaranteed_oee_pct <= 99.9" }
      - { name: guarantee_window_days, type: integer, source: input, description: "Throughput-guarantee measurement window in calendar days, copied onto the ThroughputGuarantee at SAT->TRAINING initialization", default: 90, constraints: "30 <= guarantee_window_days <= 365" }

  - name: ApplicationStudy
    parent: CellProject
    common_fields: true
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id; project under study" }
      - { name: revision, type: integer, source: system, description: "1-based revision counter; bumped on every superseding study", default: 1 }
      - { name: sim_cycle_time_s, type: number, source: input, description: "Simulated best-case cycle time in seconds from offline simulation" }
      - { name: sim_confidence_pct, type: number, source: input, description: "Engineer's confidence in the simulation, percent", constraints: "0 < sim_confidence_pct <= 100" }
      - { name: feasibility, type: enum, source: system, description: "Derived verdict: FEASIBLE if adjusted cycle time <= contracted_cycle_time_s, else MARGINAL or INFEASIBLE", constraints: "enum: {FEASIBLE, MARGINAL, INFEASIBLE}" }
      - { name: adjusted_cycle_time_s, type: number, source: computed, description: "sim_cycle_time_s derated by confidence: sim_cycle_time_s / (sim_confidence_pct/100), 3-decimal round-half-up" }
      - { name: supersedes_study_id, type: string, source: input, description: "FK -> ApplicationStudy.id; prior study this one supersedes, null for first", default: null }
      - { name: status, type: enum, source: system, description: "Study lifecycle", default: DRAFT, constraints: "enum: {DRAFT, SUBMITTED, APPROVED, SUPERSEDED, REJECTED}" }

  - name: SafetyRiskAssessment
    parent: CellProject
    common_fields: true
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id; assessed project" }
      - { name: assessment_revision, type: integer, source: system, description: "Monotonically increasing revision", default: 1 }
      - { name: risk_score_pre_mitigation, type: integer, source: input, description: "Risk score from severity x probability x exposure, range 1..1000", constraints: "1 <= risk_score_pre_mitigation <= 1000" }
      - { name: pl_target, type: enum, source: input, description: "Target performance level", constraints: "enum: {PLc, PLd, PLe}" }
      - { name: pl_achieved, type: enum, source: input, description: "Performance level computed from the fencing/light-curtain design", constraints: "enum: {PLc, PLd, PLe}" }
      - { name: fencing_length_m, type: number, source: input, description: "Total hard fencing length in meters", constraints: ">= 0" }
      - { name: light_curtain_zones, type: integer, source: input, description: "Number of light-curtain guarded zones", constraints: ">= 0" }
      - { name: muting_required, type: boolean, source: input, description: "Whether any light-curtain zone requires muting for material pass-through" }
      - { name: safety_function_budget_pct, type: number, source: computed, description: "Percentage of PL budget consumed; see calculation safety_function_budget" }
      - { name: status, type: enum, source: system, description: "Assessment lifecycle", default: DRAFT, constraints: "enum: {DRAFT, IN_REVIEW, APPROVED, REJECTED, SUPERSEDED}" }
      - { name: approved_by_safety_lead_id, type: string, source: system, description: "FK -> IntegratorUser.id of the SafetyLead who approved; null until approved", default: null }

  - name: RobotSelection
    parent: CellProject
    common_fields: true
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id" }
      - { name: robot_model, type: string, source: input, description: "Robot model designation, e.g. FANUC M-710iC/50 or ABB IRB 6700-200/2.60" }
      - { name: brand, type: enum, source: input, description: "Robot brand", constraints: "enum: {FANUC, ABB}" }
      - { name: rated_payload_kg, type: number, source: input, description: "Nameplate payload capacity at wrist, kg", constraints: "> 0" }
      - { name: end_effector_weight_kg, type: number, source: input, description: "End-effector (gripper/tool) weight, kg", constraints: ">= 0" }
      - { name: part_weight_kg, type: number, source: input, description: "Heaviest handled part weight, kg", constraints: ">= 0" }
      - { name: wrist_inertia_kgm2, type: number, source: input, description: "Worst-case wrist inertia of tool+part, kg*m^2", constraints: ">= 0" }
      - { name: wrist_inertia_limit_kgm2, type: number, source: input, description: "Manufacturer wrist-inertia limit, kg*m^2", constraints: "> 0" }
      - { name: payload_margin_pct, type: number, source: computed, description: "Payload utilization margin; see payload_margin_check calculation" }
      - { name: selection_status, type: enum, source: system, description: "Selection lifecycle", default: PROPOSED, constraints: "enum: {PROPOSED, VALIDATED, REJECTED, LOCKED}" }

  - name: RobotProgram
    parent: CellProject
    common_fields: true
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id" }
      - { name: program_name, type: string, source: input, description: "Program identifier, unique per project" }
      - { name: dev_status, type: enum, source: system, description: "Development axis of the program", default: OUTLINE, constraints: "enum: {OUTLINE, CODED, PEER_REVIEWED, RELEASED, REWORK}" }
      - { name: sim_status, type: enum, source: system, description: "Offline-simulation axis of the same program (parallel dimension)", default: UNSIMULATED, constraints: "enum: {UNSIMULATED, SIM_RUNNING, SIM_PASSED, SIM_FAILED}" }
      - { name: last_sim_cycle_time_s, type: number, source: system, description: "Most recent simulated cycle time recorded by offline simulation; null until first SIM_PASSED", default: null }
      - { name: sim_iteration_count, type: integer, source: system, description: "Number of simulation runs recorded", default: 0 }
      - { name: release_revision, type: integer, source: system, description: "1-based release counter; a program may be released, sent to REWORK, and re-released", default: 0 }

  - name: AcceptanceTest
    parent: CellProject
    common_fields: true
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id" }
      - { name: phase, type: enum, source: input, description: "FAT (factory acceptance at integrator floor) or SAT (site acceptance at customer site)", constraints: "enum: {FAT, SAT}" }
      - { name: attempt, type: integer, source: system, description: "1-based attempt counter within the phase", default: 1 }
      - { name: measured_cycle_time_s, type: number, source: input, description: "Measured average cycle time across the acceptance run" }
      - { name: measured_oee_pct, type: number, source: input, description: "Measured OEE during the acceptance run, percent" }
      - { name: defects_observed, type: integer, source: input, description: "Count of non-conformances observed during the run", constraints: ">= 0" }
      - { name: verdict, type: enum, source: system, description: "Derived from measurements against contract", constraints: "enum: {PENDING, PASS, CONDITIONAL_PASS, FAIL}" }
      - { name: retention_released_cents, type: integer, source: computed, description: "Retention released upon this test's verdict per retention_release_schedule" }
      - { name: recorded_by_user_id, type: string, source: system, description: "FK -> IntegratorUser.id who recorded the test" }

  - name: SparePartsPackage
    parent: CellProject
    common_fields: true
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id" }
      - { name: package_code, type: string, source: input, description: "Catalog code of the spare-parts bundle" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog list price in cents", constraints: ">= 0" }
      - { name: recommended_coverage_months, type: integer, source: input, description: "Coverage horizon the package was sized for", constraints: "1 <= recommended_coverage_months <= 60" }
      - { name: forecast_consumption_months, type: number, source: computed, description: "Projected months until parts exhausted under the site's usage decay profile; see spare_parts_consumption_forecast" }
      - { name: package_status, type: enum, source: system, description: "Package lifecycle", default: QUOTED, constraints: "enum: {QUOTED, ORDERED, DELIVERED, SUPERSEDED}" }

  - name: MaintenancePlan
    parent: CellProject
    common_fields: true
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id" }
      - { name: interval_operating_hours, type: integer, source: input, description: "Preventive-maintenance interval in robot operating hours", constraints: "500 <= interval_operating_hours <= 10000" }
      - { name: first_due_at_hours, type: integer, source: input, description: "Operating-hour reading at which the first service falls due", constraints: ">= 0" }
      - { name: plan_status, type: enum, source: system, description: "Plan lifecycle", default: DRAFT, constraints: "enum: {DRAFT, ACTIVE, SUSPENDED, CLOSED}" }
      - { name: current_operating_hours, type: integer, source: system, description: "Last reported operating-hour meter reading", default: 0 }
      - { name: hours_until_due, type: integer, source: computed, description: "first_due_at_hours + k*interval_operating_hours - current_operating_hours for the smallest k with result >= 0" }

  - name: TrainingSession
    parent: CellProject
    common_fields: true
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id" }
      - { name: audience, type: enum, source: input, description: "Operator vs technician curriculum", constraints: "enum: {OPERATOR, TECHNICIAN}" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Planned session start, UTC" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "Planned session end, UTC; must be after start" }
      - { name: trainer_user_id, type: string, source: input, description: "FK -> IntegratorUser.id of the assigned trainer" }
      - { name: attendee_count, type: integer, source: input, description: "Enrolled attendees", constraints: "1 <= attendee_count <= 12" }
      - { name: completion_score_pct, type: number, source: computed, description: "Weighted score across practical and written assessments; see training_completion_score" }
      - { name: practical_score_pct, type: number, source: input, description: "Practical assessment average, percent", constraints: "0 <= practical_score_pct <= 100", default: null }
      - { name: written_score_pct, type: number, source: input, description: "Written assessment average, percent", constraints: "0 <= written_score_pct <= 100", default: null }
      - { name: session_status, type: enum, source: system, description: "Session lifecycle", default: SCHEDULED, constraints: "enum: {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW}" }

  - name: ThroughputGuarantee
    parent: CellProject
    common_fields: true
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id" }
      - { name: guarantee_window_days, type: integer, source: system, description: "Copied from CellProject.guarantee_window_days at guarantee initialization", constraints: "30 <= guarantee_window_days <= 365" }
      - { name: window_start_utc, type: datetime, source: system, description: "Set when guarantee measurement opens", default: null }
      - { name: window_end_utc, type: datetime, source: system, description: "window_start_utc + guarantee_window_days", default: null }
      - { name: guarantee_status, type: enum, source: system, description: "Guarantee lifecycle", default: NOT_STARTED, constraints: "enum: {NOT_STARTED, MEASURING, MET, MISSED, WAIVED}" }
      - { name: observed_uptime_pct, type: number, source: input, description: "Customer-reported uptime across the window, percent", default: null, constraints: "0 <= observed_uptime_pct <= 100" }
      - { name: observed_cycle_time_s, type: number, source: input, description: "Customer-reported sustained cycle time across the window", default: null }
      - { name: shortfall_pct, type: number, source: computed, description: "Percentage shortfall vs contract; see throughput_shortfall calculation" }

  - name: RetentionLedgerEntry
    parent: CellProject
    common_fields: false
    fields:
      - { name: cell_project_id, type: string, source: input, description: "FK -> CellProject.id" }
      - { name: entry_type, type: enum, source: input, description: "WITHHOLD (initial), RELEASE (on milestone), PENALTY (deducted on guarantee miss), ADJUST (manual correction)", constraints: "enum: {WITHHOLD, RELEASE, PENALTY, ADJUST}" }
      - { name: amount_cents, type: integer, source: input, description: "Signed cents: RELEASE/PENALTY negative against balance, WITHHOLD/ADJUST per sign convention of the entry" }
      - { name: milestone_ref, type: string, source: input, description: "Reference to the milestone that authorized the movement (AcceptanceTest id or ThroughputGuarantee id), or 'MANUAL'" }
      - { name: recorded_at_utc, type: datetime, source: system, description: "Server timestamp of ledger posting" }

  - name: IntegratorUser
    parent: IntegratorOrg
    common_fields: true
    fields:
      - { name: integrator_org_id, type: string, source: input, description: "FK -> IntegratorOrg.id; employing org" }
      - { name: display_name, type: string, source: input, description: "Full name" }
      - { name: user_role, type: enum, source: input, description: "Functional role inside the integrator org", constraints: "enum: {PROJECT_ENGINEER, SAFETY_LEAD, CONTROLS_PROGRAMMER, SITE_SUPERVISOR, TRAINER, SERVICE_MANAGER, FINANCE_ADMIN}" }
      - { name: active, type: boolean, source: input, description: "Whether the user may act", default: true }

state_machines:
  - entity: CellProject
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: STUDY
        trigger: "POST /robotics/cell-projects/{id}/advance"
        actor: ProjectEngineer
        preconditions:
          - "CellProject.status == DRAFT"
          - "No ApplicationStudy with status IN {DRAFT, SUBMITTED} exists for this project"
        side_effects:
          - "Creates first ApplicationStudy shell? No — study created separately via POST /robotics/cell-projects/{id}/application-studies"
          - "bumps CellProject.version"
        note: "Advancing to STUDY merely unlocks study creation."
      - from: STUDY
        to: DESIGN
        trigger: "POST /robotics/cell-projects/{id}/advance"
        actor: ProjectEngineer
        preconditions:
          - "An ApplicationStudy with status == APPROVED exists"
          - "A SafetyRiskAssessment with status == APPROVED exists"
        side_effects: ["bumps CellProject.version"]
      - from: DESIGN
        to: BUILD
        trigger: "POST /robotics/cell-projects/{id}/advance"
        actor: ProjectEngineer
        preconditions:
          - "A RobotSelection with selection_status == LOCKED exists"
          - "At least one RobotProgram with dev_status == RELEASED exists"
        side_effects: ["bumps CellProject.version"]
      - from: BUILD
        to: FAT
        trigger: "POST /robotics/cell-projects/{id}/advance"
        actor: SiteSupervisor
        preconditions:
          - "All RobotPrograms for the project have dev_status == RELEASED AND sim_status == SIM_PASSED"
          - "SafetyRiskAssessment APPROVED has pl_achieved >= pl_target per PL ordering PLc < PLd < PLe"
        side_effects: ["bumps CellProject.version"]
      - from: FAT
        to: SHIP
        trigger: "POST /robotics/cell-projects/{id}/advance"
        actor: SiteSupervisor
        preconditions:
          - "Latest AcceptanceTest with phase == FAT has verdict IN {PASS, CONDITIONAL_PASS}"
        side_effects:
          - "Posts RetentionLedgerEntry entry_type=RELEASE for the FAT milestone amount per retention_release_schedule"
          - "Recomputes CellProject.retention_balance_cents"
          - "bumps CellProject.version"
      - from: FAT
        to: DESIGN
        trigger: "POST /robotics/acceptance-tests/{id}/fail (when phase == FAT)"
        actor: SiteSupervisor
        preconditions:
          - "AcceptanceTest.phase == FAT AND verdict == FAIL"
        side_effects:
          - "CellProject.rework_count += 1"
          - "Every RobotProgram with dev_status == RELEASED moves to REWORK (parallel-axis dev change; sim_status unchanged)"
          - "RobotSelection.selection_status LOCKED -> VALIDATED (un-locks for re-check)"
          - "bumps CellProject.version"
        note: "Cycle: DESIGN -> BUILD -> FAT -> DESIGN."
      - from: SHIP
        to: SAT
        trigger: "POST /robotics/cell-projects/{id}/advance"
        actor: SiteSupervisor
        preconditions:
          - "CellProject.status == SHIP"
          - "SparePartsPackage with package_status IN {ORDERED, DELIVERED} exists"
        side_effects: ["bumps CellProject.version"]
      - from: SAT
        to: TRAINING
        trigger: "POST /robotics/cell-projects/{id}/advance"
        actor: SiteSupervisor
        preconditions:
          - "Latest AcceptanceTest with phase == SAT has verdict IN {PASS, CONDITIONAL_PASS}"
        side_effects:
          - "Posts RetentionLedgerEntry entry_type=RELEASE for the SAT milestone amount"
          - "Initializes ThroughputGuarantee: guarantee_status NOT_STARTED -> MEASURING, sets window_start_utc = now, window_end_utc = now + guarantee_window_days"
          - "Recomputes CellProject.retention_balance_cents"
          - "bumps CellProject.version"
      - from: SAT
        to: DESIGN
        trigger: "POST /robotics/acceptance-tests/{id}/fail (when phase == SAT)"
        actor: SiteSupervisor
        preconditions:
          - "AcceptanceTest.phase == SAT AND verdict == FAIL"
        side_effects:
          - "CellProject.rework_count += 1"
          - "All RobotPrograms RELEASED -> REWORK"
          - "RobotSelection LOCKED -> VALIDATED"
          - "SafetyRiskAssessment APPROVED -> SUPERSEDED and a new DRAFT revision shell is created with assessment_revision incremented (bubble-up forces re-approval)"
          - "bumps CellProject.version"
      - from: TRAINING
        to: GUARANTEE
        trigger: "POST /robotics/cell-projects/{id}/advance"
        actor: ProjectEngineer
        preconditions:
          - "Every TrainingSession with audience == OPERATOR for the project has session_status == COMPLETED with completion_score_pct >= 80"
          - "Every TrainingSession with audience == TECHNICIAN for the project has session_status == COMPLETED with completion_score_pct >= 85"
          - "MaintenancePlan with plan_status == ACTIVE exists"
          - "ThroughputGuarantee.guarantee_status == MEASURING"
        side_effects: ["bumps CellProject.version"]
      - from: GUARANTEE
        to: CLOSED
        trigger: "POST /robotics/throughput-guarantees/{id}/close (MET or WAIVED)"
        actor: ServiceManager
        preconditions:
          - "ThroughputGuarantee.guarantee_status IN {MET, WAIVED}"
          - "CellProject.retention_balance_cents == 0"
        side_effects: ["bumps CellProject.version"]
      - from: GUARANTEE
        to: CLOSED
        trigger: "POST /robotics/throughput-guarantees/{id}/close (MISSED with penalty)"
        actor: ServiceManager
        preconditions:
          - "ThroughputGuarantee.guarantee_status == MISSED"
          - "Penalty RetentionLedgerEntry has been posted bringing retention_balance_cents to 0"
        side_effects: ["bumps CellProject.version"]
      - from: "any non-terminal"
        to: ON_HOLD
        trigger: "POST /robotics/cell-projects/{id}/hold"
        actor: ProjectEngineer
        preconditions: ["CellProject.status NOT IN {CLOSED, TERMINATED}"]
        side_effects: ["sets hold_reason from request", "bumps CellProject.version"]
      - from: ON_HOLD
        to: "<prior status>"
        trigger: "POST /robotics/cell-projects/{id}/resume"
        actor: ProjectEngineer
        preconditions: ["CellProject.status == ON_HOLD"]
        side_effects: ["clears hold_reason", "restores status captured at hold time", "bumps CellProject.version"]
        note: "Cycle: any state -> ON_HOLD -> same state; resume is the only exit."
      - from: "any non-terminal"
        to: TERMINATED
        trigger: "POST /robotics/cell-projects/{id}/terminate"
        actor: FinanceAdmin
        preconditions:
          - "CellProject.status NOT IN {CLOSED, TERMINATED, GUARANTEE}"
          - "CellProject.retention_balance_cents == 0 OR a compensating PENALTY entry is posted atomically with termination to zero the balance"
        side_effects:
          - "All non-terminal child entities move to their terminal/cancelled states: ApplicationStudy DRAFT/SUBMITTED -> REJECTED, RobotProgram with dev_status != RELEASED stays (dev axis frozen) while any SIM_RUNNING -> SIM_FAILED, TrainingSession SCHEDULED/IN_PROGRESS -> CANCELLED, SparePartsPackage QUOTED/ORDERED -> SUPERSEDED"
          - "MaintenancePlan ACTIVE -> CLOSED"
          - "bumps CellProject.version"

  - entity: ApplicationStudy
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /robotics/application-studies/{id}/submit"
        actor: ProjectEngineer
        preconditions:
          - "CellProject.status == STUDY"
          - "sim_cycle_time_s and sim_confidence_pct populated"
        side_effects: ["computes adjusted_cycle_time_s and feasibility"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /robotics/application-studies/{id}/approve"
        actor: SafetyLead
        preconditions:
          - "ApplicationStudy.status == SUBMITTED"
          - "approver's X-User-ID != the study's creating user id (segregation of duties: creator cannot approve own study)"
        side_effects: ["bumps ApplicationStudy.version"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /robotics/application-studies/{id}/reject"
        actor: SafetyLead
        preconditions: ["ApplicationStudy.status == SUBMITTED"]
        side_effects: ["bumps ApplicationStudy.version"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /robotics/cell-projects/{id}/application-studies (creating a new study with supersedes_study_id set)"
        actor: ProjectEngineer
        preconditions: ["CellProject.status IN {STUDY, DESIGN}"]
        side_effects: ["old study moves APPROVED -> SUPERSEDED; new study starts DRAFT with revision = old.revision + 1"]
        note: "Self-referential supersedure cycle on the same entity table."

  - entity: SafetyRiskAssessment
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /robotics/safety-risk-assessments/{id}/submit"
        actor: ProjectEngineer
        preconditions:
          - "CellProject.status == STUDY"
          - "pl_achieved computable: fencing_length_m > 0 OR light_curtain_zones > 0"
        side_effects: ["computes safety_function_budget_pct"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /robotics/safety-risk-assessments/{id}/approve"
        actor: SafetyLead
        preconditions:
          - "risk_score_pre_mitigation >= 400 implies pl_achieved == PLe"
          - "muting_required == true implies light_curtain_zones >= 1 AND pl_achieved IN {PLd, PLe}"
          - "approver X-User-ID != creator user id (segregation of duties)"
        side_effects: ["sets approved_by_safety_lead_id", "bumps version"]
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /robotics/safety-risk-assessments/{id}/reject"
        actor: SafetyLead
        preconditions: ["status == IN_REVIEW"]
        side_effects: ["reopens as DRAFT on next submit — implemented as REJECTED -> DRAFT transition"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /robotics/safety-risk-assessments/{id}/revise"
        actor: ProjectEngineer
        preconditions: ["status == REJECTED"]
        side_effects: ["assessment_revision += 1"]
        note: "REJECTED is not terminal; revise loops back to DRAFT. Terminal SUPERSEDED happens via SAT-fail cascade."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade from CellProject SAT -> DESIGN"
        actor: system
        preconditions: ["CellProject rework on SAT failure"]
        side_effects: ["creates successor DRAFT with assessment_revision + 1"]

  - entity: RobotSelection
    initial_state: PROPOSED
    terminal_states: [LOCKED, REJECTED]
    transitions:
      - from: PROPOSED
        to: VALIDATED
        trigger: "POST /robotics/robot-selections/{id}/validate"
        actor: ProjectEngineer
        preconditions:
          - "payload_margin_pct >= 20.0 (computed)"
          - "wrist_inertia_kgm2 <= wrist_inertia_limit_kgm2"
          - "brand IN IntegratorOrg.brand_specialization (or specialization == DUAL)"
        side_effects: ["computes payload_margin_pct"]
      - from: VALIDATED
        to: LOCKED
        trigger: "POST /robotics/robot-selections/{id}/lock"
        actor: SiteSupervisor
        preconditions:
          - "CellProject.status == DESIGN"
          - "selection_status == VALIDATED"
        side_effects: ["locks payload fields from further update"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /robotics/robot-selections/{id}/reject"
        actor: ProjectEngineer
        preconditions: ["selection_status == PROPOSED"]
        side_effects: []
      - from: LOCKED
        to: VALIDATED
        trigger: "system cascade from CellProject FAT -> DESIGN or SAT -> DESIGN"
        actor: system
        preconditions: ["rework cascade"]
        side_effects: ["unlocks for payload re-check"]

  - entity: RobotProgram
    initial_state: "(dev_status=OUTLINE, sim_status=UNSIMULATED)"
    terminal_states: ["(dev_status=RELEASED, sim_status=SIM_PASSED)"]
    transitions:
      - from: "dev OUTLINE"
        to: "dev CODED"
        trigger: "POST /robotics/robot-programs/{id}/code-complete"
        actor: ControlsProgrammer
        preconditions: ["dev_status == OUTLINE", "CellProject.status IN {DESIGN, BUILD}"]
        side_effects: []
      - from: "dev CODED"
        to: "dev PEER_REVIEWED"
        trigger: "POST /robotics/robot-programs/{id}/peer-review"
        actor: ControlsProgrammer
        preconditions:
          - "dev_status == CODED"
          - "reviewer X-User-ID != program author's user id (segregation of duties)"
        side_effects: []
      - from: "dev PEER_REVIEWED"
        to: "dev RELEASED"
        trigger: "POST /robotics/robot-programs/{id}/release"
        actor: ControlsProgrammer
        preconditions:
          - "dev_status == PEER_REVIEWED"
          - "sim_status == SIM_PASSED"
        side_effects: ["release_revision += 1"]
      - from: "dev RELEASED"
        to: "dev REWORK"
        trigger: "system cascade from CellProject FAT/SAT -> DESIGN"
        actor: system
        preconditions: ["rework cascade"]
        side_effects: []
      - from: "dev REWORK"
        to: "dev CODED"
        trigger: "POST /robotics/robot-programs/{id}/code-complete"
        actor: ControlsProgrammer
        preconditions: ["dev_status == REWORK"]
        side_effects: []
        note: "Cycle CODED->PEER_REVIEWED->RELEASED->REWORK->CODED on the dev axis."
      - from: "sim UNSIMULATED"
        to: "sim SIM_RUNNING"
        trigger: "POST /robotics/robot-programs/{id}/simulate"
        actor: ControlsProgrammer
        preconditions: ["dev_status IN {CODED, PEER_REVIEWED, REWORK}"]
        side_effects: []
      - from: "sim SIM_RUNNING"
        to: "sim SIM_PASSED"
        trigger: "POST /robotics/robot-programs/{id}/simulate/record"
        actor: ControlsProgrammer
        preconditions: ["sim_status == SIM_RUNNING", "measured sim cycle time <= contracted_cycle_time_s"]
        side_effects: ["sets last_sim_cycle_time_s", "sim_iteration_count += 1"]
      - from: "sim SIM_RUNNING"
        to: "sim SIM_FAILED"
        trigger: "POST /robotics/robot-programs/{id}/simulate/record"
        actor: ControlsProgrammer
        preconditions: ["sim_status == SIM_RUNNING", "measured sim cycle time > contracted_cycle_time_s"]
        side_effects: ["sim_iteration_count += 1"]
      - from: "sim SIM_FAILED"
        to: "sim SIM_RUNNING"
        trigger: "POST /robotics/robot-programs/{id}/simulate"
        actor: ControlsProgrammer
        preconditions: ["sim_status == SIM_FAILED"]
        side_effects: []
        note: "sim axis cycles SIM_RUNNING->SIM_FAILED->SIM_RUNNING independent of dev axis — parallel dimensions."

  - entity: AcceptanceTest
    initial_state: PENDING
    terminal_states: [PASS, CONDITIONAL_PASS, FAIL]
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /robotics/acceptance-tests/{id}/record"
        actor: SiteSupervisor
        preconditions:
          - "measured_cycle_time_s <= contracted_cycle_time_s"
          - "measured_oee_pct >= guaranteed_oee_pct"
          - "defects_observed == 0"
        side_effects: ["sets verdict PASS", "computes retention_released_cents per retention_release_schedule (does not post ledger entry — ledger posted on project advance)"]
      - from: PENDING
        to: CONDITIONAL_PASS
        trigger: "POST /robotics/acceptance-tests/{id}/record"
        actor: SiteSupervisor
        preconditions:
          - "measured_cycle_time_s <= contracted_cycle_time_s * 1.02"
          - "measured_oee_pct >= guaranteed_oee_pct - 2.0"
          - "defects_observed <= 3"
          - "NOT all PASS preconditions hold"
        side_effects: ["sets verdict CONDITIONAL_PASS", "computes retention_released_cents at 50% of the milestone amount, rounded half-up"]
      - from: PENDING
        to: FAIL
        trigger: "POST /robotics/acceptance-tests/{id}/fail"
        actor: SiteSupervisor
        preconditions: ["measurement criteria for PASS/CONDITIONAL_PASS not met OR explicit fail call"]
        side_effects: ["triggers CellProject FAT/SAT -> DESIGN cascade with retry_of AcceptanceTest attempt+1 created PENDING on next record"]

  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /robotics/training-sessions/{id}/start"
        actor: Trainer
        preconditions:
          - "CellProject.status == TRAINING"
          - "logical clock >= scheduled_start_utc AND <= scheduled_end_utc"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /robotics/training-sessions/{id}/complete"
        actor: Trainer
        preconditions:
          - "practical_score_pct AND written_score_pct provided"
          - "trainer_user_id of the session == acting X-User-ID (the trainer scores own session)"
        side_effects: ["computes completion_score_pct via training_completion_score"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /robotics/training-sessions/{id}/cancel"
        actor: Trainer
        preconditions: ["session_status == SCHEDULED"]
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system: logical clock advances past scheduled_end_utc without start"
        actor: system
        preconditions: ["session_status == SCHEDULED", "now > scheduled_end_utc"]
        side_effects: []

  - entity: ThroughputGuarantee
    initial_state: NOT_STARTED
    terminal_states: [MET, MISSED, WAIVED]
    transitions:
      - from: NOT_STARTED
        to: MEASURING
        trigger: "system cascade from CellProject SAT -> TRAINING"
        actor: system
        preconditions: ["SAT advance with verdict IN {PASS, CONDITIONAL_PASS}"]
        side_effects: ["sets window_start_utc, window_end_utc"]
      - from: MEASURING
        to: MET
        trigger: "POST /robotics/throughput-guarantees/{id}/close with outcome=MET"
        actor: ServiceManager
        preconditions:
          - "logical clock >= window_end_utc"
          - "observed_cycle_time_s <= contracted_cycle_time_s"
          - "observed_uptime_pct >= guaranteed_oee_pct"
        side_effects: ["posts final RELEASE RetentionLedgerEntry for remaining retention_balance_cents", "recomputes CellProject.retention_balance_cents -> 0"]
      - from: MEASURING
        to: MISSED
        trigger: "POST /robotics/throughput-guarantees/{id}/close with outcome=MISSED"
        actor: ServiceManager
        preconditions:
          - "logical clock >= window_end_utc"
          - "observed_cycle_time_s > contracted_cycle_time_s OR observed_uptime_pct < guaranteed_oee_pct"
        side_effects: ["computes shortfall_pct", "posts PENALTY RetentionLedgerEntry equal to remaining retention_balance_cents (balance -> 0)"]
      - from: MEASURING
        to: WAIVED
        trigger: "POST /robotics/throughput-guarantees/{id}/waive"
        actor: FinanceAdmin
        preconditions:
          - "logical clock < window_end_utc"
          - "waiver requested by customer in writing (request field waiver_reference required)"
        side_effects: ["posts RELEASE RetentionLedgerEntry at 50% of remaining balance, half-up; remainder stays as ADJUST zeroing entry so retention_balance_cents -> 0"]

  - entity: MaintenancePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /robotics/maintenance-plans/{id}/activate"
        actor: ServiceManager
        preconditions:
          - "CellProject.status IN {SAT, TRAINING, GUARANTEE}"
          - "first_due_at_hours >= current_operating_hours"
        side_effects: ["computes hours_until_due"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /robotics/maintenance-plans/{id}/suspend"
        actor: ServiceManager
        preconditions: ["plan_status == ACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /robotics/maintenance-plans/{id}/activate"
        actor: ServiceManager
        preconditions: ["plan_status == SUSPENDED"]
        side_effects: ["recomputes hours_until_due"]
      - from: ACTIVE
        to: CLOSED
        trigger: "system cascade on CellProject -> CLOSED/TERMINATED"
        actor: system
        preconditions: []
        side_effects: []

concurrency_rules:
  - rule_id: study-create-stale-project
    parent_entity: CellProject
    write_endpoint: "POST /robotics/cell-projects/{id}/application-studies"
    occ_field: "expected_project_version"
    description: |
      Creating an ApplicationStudy (including a superseding revision) against a
      CellProject whose version has advanced since the client last observed it is
      rejected, because a prior supersede may already have replaced the study the
      client intended to supersede.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: advance-stale-project
    parent_entity: CellProject
    write_endpoint: "POST /robotics/cell-projects/{id}/advance"
    occ_field: "expected_project_version"
    description: |
      Advancing a CellProject whose version has advanced since the client last
      observed it is rejected, because an intervening mutation (e.g. a cascade
      from a recorded acceptance test) may have changed the gate preconditions
      the client relied on.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: ledger-post-stale-project
    parent_entity: CellProject
    write_endpoint: "POST /robotics/cell-projects/{id}/retention-ledger-entries"
    occ_field: "expected_project_version"
    description: |
      Posting a manual ADJUST RetentionLedgerEntry against a CellProject whose
      version has advanced since the client last observed the balance is
      rejected, so the adjustment is computed against a current balance.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

calculations:
  - name: adjusted_cycle_time
    trigger: "on ApplicationStudy submit"
    algorithm: forward_looking
    formula: |
      adjusted_cycle_time_s = round_half_up(sim_cycle_time_s / (sim_confidence_pct / 100), 3)
      feasibility =
        FEASIBLE  if adjusted_cycle_time_s <= contracted_cycle_time_s
        MARGINAL  if contracted_cycle_time_s < adjusted_cycle_time_s <= contracted_cycle_time_s * 1.10
        INFEASIBLE otherwise
    input_set: "The ApplicationStudy being submitted and its parent CellProject.contracted_cycle_time_s"
    precision: "3 decimal places, round_half_up"
    variants:
      - name: simulated_estimate
        when: "at SUBMITTED time (provisional)"
        difference: "uses sim_cycle_time_s derated by confidence; optimistic bound"
      - name: measured_final
        when: "at AcceptanceTest record time (final)"
        difference: "uses measured_cycle_time_s directly with no confidence derating; the two variants produce different cycle-time numbers for the same cell"

  - name: payload_margin_check
    trigger: "on RobotSelection validate"
    algorithm: constraint_propagation
    formula: |
      total_load_kg = end_effector_weight_kg + part_weight_kg
      payload_margin_pct = round_half_up(100 * (rated_payload_kg - total_load_kg) / rated_payload_kg, 2)
      inertia_ok = wrist_inertia_kgm2 <= wrist_inertia_limit_kgm2
      margin_ok = payload_margin_pct >= 20.0
      valid iff margin_ok AND inertia_ok
    input_set: "RobotSelection fields"
    constants:
      MIN_PAYLOAD_MARGIN_PCT: 20.0
    precision: "2 decimal places, round_half_up"

  - name: retention_release_schedule
    trigger: "on AcceptanceTest verdict and on ThroughputGuarantee close"
    algorithm: waterfall_allocation
    formula: |
      total_retention_cents = round_half_up(contract_value_cents * retention_rate_bps / 10000, 0)
      FAT_release_pct = 30; SAT_release_pct = 40; GUARANTEE_release_pct = 30
      fat_amount = round_half_up(total_retention_cents * 30 / 100, 0)
      sat_amount = round_half_up(total_retention_cents * 40 / 100, 0)
      guarantee_amount = total_retention_cents - fat_amount - sat_amount   # remainder bucket absorbs rounding
      On CONDITIONAL_PASS the milestone release is halved: round_half_up(milestone_amount * 0.5, 0);
      the unreleased half remains in the balance and is carried into the guarantee bucket.
      Evaluation order is pinned: total -> fat -> sat -> guarantee (guarantee = residual).
    input_set: "CellProject.contract_value_cents, IntegratorOrg.retention_rate_bps, verdict of the triggering AcceptanceTest"
    precision: "integer cents, round_half_up at each pinned step in the stated order"

  - name: training_completion_score
    trigger: "on TrainingSession complete"
    algorithm: weighted_scoring
    formula: |
      If audience == OPERATOR:    completion = 0.6*practical + 0.4*written
      If audience == TECHNICIAN:  completion = 0.5*practical + 0.5*written
      completion_score_pct = round_half_up(completion, 1)
      Pass thresholds: OPERATOR >= 80.0, TECHNICIAN >= 85.0
    input_set: "TrainingSession practical_score_pct, written_score_pct, audience"
    precision: "1 decimal place, round_half_up; weights are exact decimals"

  - name: spare_parts_consumption_forecast
    trigger: "on SparePartsPackage create and whenever CustomerSite.shift_windows_per_day changes"
    algorithm: decay_function
    formula: |
      base_daily_burn = package_unit_count / (recommended_coverage_months * 30)  # reference consumption
      shift_factor = shift_windows_per_day / 2.0   # 2-shift baseline
      effective_daily_burn = base_daily_burn * shift_factor
      forecast_consumption_months = round_half_up(package_unit_count / (effective_daily_burn * 30), 1)
      Step decay: every recorded maintenance service resets the burn clock (consumption baseline restarts).
    input_set: "SparePartsPackage (unit count derived from package_code catalog), CustomerSite.shift_windows_per_day"
    precision: "1 decimal place, round_half_up"
    variants:
      - name: quoted_forecast
        when: "at QUOTED time"
        difference: "uses current shift_windows_per_day snapshot"
      - name: delivered_forecast
        when: "at DELIVERED time"
        difference: "re-derives using the then-current shift_windows_per_day; identical inputs to the two variants can therefore yield different forecasts"

  - name: safety_function_budget
    trigger: "on SafetyRiskAssessment submit"
    algorithm: threshold
    formula: |
      # PL ordering: PLc=1, PLd=2, PLe=3
      fencing_points = min(fencing_length_m / 10.0, 5.0)      # hard fencing contribution, capped
      curtain_points = light_curtain_zones * 1.5
      muting_penalty = 2.0 if muting_required else 0.0
      raw_score = fencing_points + curtain_points - muting_penalty
      safety_function_budget_pct = round_half_up(100 * raw_score / 10.0, 1)   # 10.0 pts == 100% budget
      pl_achieved derivation: PLe if raw_score >= 9.0; PLd if raw_score >= 6.0; PLc otherwise
      Boundary rule: comparisons use >= at the stated thresholds (9.0 counts as PLe).
    input_set: "SafetyRiskAssessment fencing_length_m, light_curtain_zones, muting_required"
    constants:
      PLE_THRESHOLD: 9.0
      PLD_THRESHOLD: 6.0
      BUDGET_FULL_POINTS: 10.0
    precision: "1 decimal place, round_half_up"

  - name: throughput_shortfall
    trigger: "on ThroughputGuarantee close with outcome=MISSED"
    algorithm: aggregation
    formula: |
      cycle_shortfall_pct = max(0, 100 * (observed_cycle_time_s - contracted_cycle_time_s) / contracted_cycle_time_s)
      uptime_shortfall_pct = max(0, guaranteed_oee_pct - observed_uptime_pct)
      shortfall_pct = round_half_up(max(cycle_shortfall_pct, uptime_shortfall_pct), 2)
      Penalty posted = min(retention_balance_cents, round_half_up(contract_value_cents * shortfall_pct / 100, 0))
    input_set: "ThroughputGuarantee observed_* fields, CellProject contracted_cycle_time_s, guaranteed_oee_pct, contract_value_cents, retention_balance_cents"
    precision: "2 decimal places, round_half_up"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present (non-empty) for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for the target endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (org, then site, then project, then child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target entity is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 5
    category: state
    check: "OCC: expected_project_version matches current CellProject.version on OCC-guarded writes"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /robotics/cell-projects/{id}/application-studies, POST /robotics/cell-projects/{id}/advance, POST /robotics/cell-projects/{id}/retention-ledger-entries"
  - priority: 6
    category: business_safety
    check: "Safety: risk_score_pre_mitigation >= 400 requires pl_achieved == PLe; muting_required requires light_curtain_zones >= 1 and pl_achieved IN {PLd, PLe}"
    error_id: ERR_SAFETY_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /robotics/safety-risk-assessments/{id}/approve"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: approver/reviewer X-User-ID must differ from the creating/authoring user id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /robotics/application-studies/{id}/approve, POST /robotics/safety-risk-assessments/{id}/approve, POST /robotics/robot-programs/{id}/peer-review"
  - priority: 8
    category: business_constraint
    check: "Payload/inertia: payload_margin_pct >= 20.0 and wrist_inertia_kgm2 <= wrist_inertia_limit_kgm2"
    error_id: ERR_PAYLOAD_CHECK_FAILED
    http_status: 422
    applies_to: "POST /robotics/robot-selections/{id}/validate"
  - priority: 9
    category: business_constraint
    check: "Brand scope: RobotSelection.brand must be within IntegratorOrg.brand_specialization (DUAL covers both)"
    error_id: ERR_BRAND_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /robotics/robot-selections/{id}/validate"
  - priority: 10
    category: business_temporal
    check: "TrainingSession start within [scheduled_start_utc, scheduled_end_utc] using the logical clock"
    error_id: ERR_OUTSIDE_SESSION_WINDOW
    http_status: 422
    applies_to: "POST /robotics/training-sessions/{id}/start"
  - priority: 11
    category: business_temporal
    check: "ThroughputGuarantee close requires logical clock >= window_end_utc; waive requires clock < window_end_utc"
    error_id: ERR_GUARANTEE_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /robotics/throughput-guarantees/{id}/close, POST /robotics/throughput-guarantees/{id}/waive"
  - priority: 12
    category: business_temporal
    check: "TrainingSession create: scheduled_end_utc strictly after scheduled_start_utc; no overlap on the same trainer_user_id across sessions whose status IN {SCHEDULED, IN_PROGRESS} (half-open interval [start, end) adjacency allowed)"
    error_id: ERR_TRAINER_SCHEDULE_CONFLICT
    http_status: 422
    applies_to: "POST /robotics/cell-projects/{id}/training-sessions"
  - priority: 13
    category: business_referential
    check: "ApplicationStudy supersedes_study_id must reference an ApplicationStudy of the same CellProject in status APPROVED"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /robotics/cell-projects/{id}/application-studies"
  - priority: 14
    category: business_constraint
    check: "Uniqueness: project_code unique per customer_site_id; program_name unique per cell_project_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /robotics/customer-sites/{id}/cell-projects, POST /robotics/cell-projects/{id}/robot-programs"
  - priority: 15
    category: business_fiscal
    check: "Retention ledger conservation: posting must not drive retention_balance_cents below 0"
    error_id: ERR_RETENTION_OVERRELEASE
    http_status: 422
    applies_to: "POST /robotics/cell-projects/{id}/retention-ledger-entries, POST /robotics/throughput-guarantees/{id}/close"
  - priority: 16
    category: business_fiscal
    check: "Advance gates that release retention require the computed release amount <= current retention_balance_cents"
    error_id: ERR_RETENTION_BALANCE_MISMATCH
    http_status: 422
    applies_to: "POST /robotics/cell-projects/{id}/advance"
  - priority: 17
    category: business_constraint
    check: "MaintenancePlan activation requires first_due_at_hours >= current_operating_hours and interval within [500, 10000]"
    error_id: ERR_MAINTENANCE_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /robotics/maintenance-plans/{id}/activate"
  - priority: 18
    category: business_constraint
    check: "Required-field / type checks: missing required input fields or out-of-range numerics"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 19
    category: state
    check: "CellProject advance gate: child-state preconditions per transition (approved study, locked selection, released programs, passing tests, completed training, active maintenance plan)"
    error_id: ERR_GATE_PRECONDITION_UNMET
    http_status: 422
    applies_to: "POST /robotics/cell-projects/{id}/advance"

