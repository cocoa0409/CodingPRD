  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: leave_interval_overlap_half_open_with_adjacency_allowed
        grounds:
          - validations[priority=11]
          - entities.LeaveInterval.fields.start_datetime
          - entities.LeaveInterval.fields.end_datetime
          - errors[ERR_INTERVAL_OVERLAP]
        distinguishing_aspect: |
          Resource: LeaveCase (the parent of LeaveIntervals). Interval
          semantics: HALF-OPEN with point adjacency allowed — start strictly
          before other.end AND end strictly after other.start is rejected;
          start == other.end is permitted (adjacent). Tested by attempting to
          insert an interval that touches but does not overlap (allowed) and
          another that overlaps by 1 minute (rejected).
        test_recipe:
          setup:
            - "Case ACTIVE with one existing RECORDED interval [2026-06-01T00:00, 2026-06-08T00:00) of 40 hours."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "OL1 Co", state_code: "FED", employer_premium_share_pct: 0.50, monthly_premium_total_cents: 100000 }
              as: PlatformAdmin
              captures: { empOL1_id: $.data.id }
            - call: "POST /leave/providers"
              payload: { license_id: "L-OL1-1", full_name: "Dr OL1", specialty: "internal" }
              as: PlatformAdmin
              captures: { provOL1_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empOL1_id}", email: "ol1@x.com", full_name: "OL1", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { workerOL1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${workerOL1_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-08-15T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseOL1_id: $.data.id }
            - call: "POST /leave/cases/${caseOL1_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { caseOL1_v_post_elig: $.data.version }
            - call: "POST /leave/certifications"
              payload: { leave_case_id: "${caseOL1_id}", provider_id: "${provOL1_id}", expected_duration_weeks: 10, provider_attestation_signed_at: "2026-05-15T00:00:00.000Z" }
              as: HealthcareProvider
              captures: { certOL1_id: $.data.id }
            - call: "POST /leave/certifications/${certOL1_id}/receive"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/certifications/${certOL1_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${caseOL1_id}/approve"
              payload: { expected_leave_case_version: "${caseOL1_v_post_elig}" }
              as: HRAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseOL1_id}", start_datetime: "2026-06-01T00:00:00.000Z", end_datetime: "2026-06-08T00:00:00.000Z", hours_taken: 40 }
              as: HRAdmin
              captures: { firstInt_id: $.data.id }
          trigger:
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseOL1_id}", start_datetime: "2026-06-08T00:00:00.000Z", end_datetime: "2026-06-15T00:00:00.000Z", hours_taken: 40 }
              as: HRAdmin
              captures: { adj_interval: $.data }
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseOL1_id}", start_datetime: "2026-06-07T23:59:00.000Z", end_datetime: "2026-06-09T00:00:00.000Z", hours_taken: 8 }
              as: HRAdmin
              captures: { ol_err: $.data.error_id }
          assert:
            - "adj_interval.id is set; the adjacent interval [2026-06-08, 2026-06-15) is accepted because start_datetime == other.end_datetime (adjacency allowed under half-open semantics)."
            - "ol_err == ERR_INTERVAL_OVERLAP (the [2026-06-07T23:59, 2026-06-09) interval overlaps the first interval by 1 minute — start < other.end AND end > other.start)."

      - name: intermittent_monthly_frequency_cap_aggregate_overlap
        grounds:
          - validations[priority=12]
          - entities.CertificationRecord.fields.intermittent_frequency_per_month
          - errors[ERR_INTERMITTENT_FREQUENCY_EXCEEDED]
        distinguishing_aspect: |
          DIFFERENT interval semantics: AGGREGATE-CAPACITY over a fixed
          calendar-month bucket (no pairwise overlap, no adjacency). The
          rule rejects a new interval not because it touches another but
          because the COUNT of RECORDED intervals in the same calendar month
          would exceed CertificationRecord.intermittent_frequency_per_month.
          DIFFERENT resource (CertificationRecord's quota, not LeaveCase's
          interval list) and DIFFERENT semantics (count over bucket, not
          pairwise overlap).
