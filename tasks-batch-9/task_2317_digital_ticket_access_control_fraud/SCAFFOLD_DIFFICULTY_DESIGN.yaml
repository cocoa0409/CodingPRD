            - "${err_below_floor} == ERR_BARCODE_EPOCH_INVALID with HTTP 422 — epoch 20 at now_epoch 22 is one epoch below the floor"
            - "${res_at_ceiling} == ADMITTED — epoch 22 at now_epoch 22 sits exactly on the inclusive ceiling"
