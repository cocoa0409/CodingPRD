          - state_machines.Inspection.status.initial_state
          - state_machines.Inspection.hazard_state.initial_state
          - endpoints.POST_/cosmetology/inspections
        distinguishing_aspect: "A freshly created Inspection occupies the initial state of BOTH declared dimensions at once — status SCHEDULED and hazard_state NONE — with every score, outcome and timestamp field still null."
        test_recipe:
          setup:
            - "One establishment 'Origin Salon'."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Origin Salon", establishment_type: "SALON", county_code: "ABA", station_capacity: 4 }
