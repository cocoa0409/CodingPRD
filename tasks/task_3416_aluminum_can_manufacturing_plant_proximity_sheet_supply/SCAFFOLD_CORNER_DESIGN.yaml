  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: agreement_amend_with_stale_version_rejected_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-amend-stale-version]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/supply-agreements/{id}/amend
        distinguishing_aspect: "OCC on the parent: after open-renegotiation the agreement is at version 3; an amend carrying expected_agreement_version 2 (one behind) is rejected 412 ERR_STALE_VERSION, and replaying with the current version 3 succeeds — deterministic under strictly sequential requests."
        test_recipe:
          setup:
            - "Logical clock default. Agreement RENEGOTIATING at version 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
            - call: "POST /supply-agreements/${agr_id}/open-renegotiation"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /supply-agreements/${agr_id}/amend"
              payload: { expected_agreement_version: "${v3} - 1", conversion_cost_cents_per_1000: 1600 }
              as: PlantManager
              captures: { err: $.data.error_id }
            - call: "POST /supply-agreements/${agr_id}/amend"
              payload: { expected_agreement_version: "${v3}", conversion_cost_cents_per_1000: 1600 }
              as: PlantManager
              captures: { st: $.data.status, v4: $.data.version }
          assert:
            - "the stale amend returns 412 and err == ERR_STALE_VERSION"
            - "the agreement stays RENEGOTIATING with conversion 1500 after the 412"
            - "the current-version amend returns 200: st == ACTIVE, v4 == 4, conversion_cost_cents_per_1000 == 1600"

      - name: run_create_with_stale_agreement_version_rejected_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[run-create-stale-agreement]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/supply-agreements/{id}/production-runs
        distinguishing_aspect: "The second OCC entry guards run creation: a create carrying the pre-existing agreement version 2 succeeds (bumping the agreement to 3), and a second create still carrying 2 is rejected 412 ERR_STALE_VERSION — the new run must be priced under the terms the client actually observed."
        test_recipe:
          setup:
            - "Logical clock default. ACTIVE agreement at version 2; line; QUALIFIED format."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { v2: $.data.version }
            - call: "POST /plants/${plant_id}/lines"
              payload: { name: "L", nominal_speed_cans_per_hour: 120000, base_spoilage_pct: 0.04 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /plants/${plant_id}/formats"
              payload: { customer_id: "${cust_id}", size_code: "12OZ", shape: "STANDARD", is_specialty: false, metal_lbs_per_1000_units: 30.0, tooling_investment_cents: 0, min_volume_commitment_units: 0 }
              as: PlantManager
              captures: { fmt_id: $.data.id }
            - call: "POST /formats/${fmt_id}/tool"
              payload: {}
              as: PlantManager
            - call: "POST /formats/${fmt_id}/qualify"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 50000, graphics_code: "G1", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", expected_agreement_version: "${v2}" }
              as: LineScheduler
              captures: { r1_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 60000, graphics_code: "G1", window_start: "2026-09-11T08:00:00Z", window_end: "2026-09-11T16:00:00Z", expected_agreement_version: "${v2}" }
              as: LineScheduler
              captures: { err: $.data.error_id }
          assert:
            - "the first create returns 201 (version 2 matched) and bumps the agreement to version 3"
            - "the second create with the same version returns 412 and err == ERR_STALE_VERSION"
            - "GET /production-runs?agreement_id=${agr_id} returns exactly 1 row"

      - name: run_ops_expires_past_end_agreements_and_stale_pickups
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints.POST_/plants/{id}/run-ops
          - state_machines.SupplyAgreement.ACTIVE_to_EXPIRED
          - state_machines.ScrapReturn.SCHEDULED_to_EXPIRED
        distinguishing_aspect: "The ops checkpoint is the only producer of EXPIRED: with the clock at 2026-09-02, run-ops flips the ACTIVE agreement with end_date 2026-08-31 to EXPIRED and the SCHEDULED pickup whose window ended 2026-08-20T10:00:00Z to EXPIRED, and increments ops_run_index to exactly 1."
        test_recipe:
          setup:
            - "Logical clock set to 2026-08-01. Plant; customer; agreement end_date 2026-08-31 signed ACTIVE; one pickup window 2026-08-20T09:00..10:00 SCHEDULED. Then the clock advances to 2026-09-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-08-31" }
              as: PlantManager
              captures: { agr_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
            - call: "POST /customers/${cust_id}/scrap-returns"
              payload: { plant_id: "${plant_id}", pickup_window_start: "2026-08-20T09:00:00Z", pickup_window_end: "2026-08-20T10:00:00Z", declared_weight_lbs: 5000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plants/${plant_id}/run-ops"
              payload: {}
              as: PlantManager
              captures: { ops_idx: $.data.ops_run_index }
            - call: "GET /supply-agreements/${agr_id}"
              payload: {}
              as: PlantManager
              captures: { agr_st: $.data.status }
            - call: "GET /scrap-returns/${sr_id}"
              payload: {}
              as: PlantManager
              captures: { sr_st: $.data.status }
          assert:
            - "ops_idx == 1"
            - "agr_st == EXPIRED (end_date 2026-08-31 before the clock date 2026-09-02)"
            - "sr_st == EXPIRED (pickup window ended and still SCHEDULED)"
            - "a second run-ops leaves both EXPIRED and advances ops_run_index to 2 (sweep is idempotent on already-terminal rows)"

      - name: settle_cascade_updates_format_amortization
        claim_type: cascading_side_effects
