# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2497 — Carbon Sequestration Project Permitting
# 9 rule_id blocks / 22 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: seal_integrity_index_variant_flips_pass_to_fail
        grounds:
          - calculations.seal_integrity_index
          - entities.GeologicModel.fields.assessment_variant
          - entities.GeologicModel.fields.seal_integrity_index
          - entities.GeologicModel.fields.seal_integrity_index_p10
          - entities.GeologicModel.fields.seal_classification
          - state_machines.GeologicModel.plume_status=NOT_RUN_to_plume_status=SIMULATED
        distinguishing_aspect: |
          This instance's dual variant lives in the GeologicModel site-characterization domain: two
          models with byte-identical geologic inputs but assessment_variant DETERMINISTIC vs
          PROBABILISTIC_P10 store the same two indices (1.600 and 0.498) yet land on
          seal_classification PASS vs FAIL, so the variant selects which index drives classification.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "one StorageProject 'Alpha Storage Hub' in status DRAFT, operational_posture OPEN"
            - "two GeologicModel rows of that project, identical in every geologic input, differing only in assessment_variant"
            - "both models still plume_status NOT_RUN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { det_id: $.data.id }
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { proj_v1: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v1}", model_label: "M1-P10", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "PROBABILISTIC_P10" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { prob_id: $.data.id }
          trigger:
            - call: "POST /ccs/geologic-models/${det_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${prob_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "GeologicModel.${det_id}.seal_integrity_index == 1.600"
            - "GeologicModel.${det_id}.seal_integrity_index_p10 == 0.498"
            - "GeologicModel.${det_id}.seal_classification == PASS"
            - "GeologicModel.${prob_id}.seal_integrity_index == 1.600"
            - "GeologicModel.${prob_id}.seal_integrity_index_p10 == 0.498"
            - "GeologicModel.${prob_id}.seal_classification == FAIL"
            - "GeologicModel.${det_id}.max_injection_rate_tpy == 1200000 and GeologicModel.${prob_id}.max_injection_rate_tpy == 1200000"
            - "GeologicModel.${det_id}.aor_radius_km == 3.0 and GeologicModel.${prob_id}.aor_radius_km == 3.0"
            - "GeologicModel.${det_id}.plume_status == SIMULATED and GeologicModel.${prob_id}.plume_status == SIMULATED"

      - name: tax_credit_reported_vs_verified_basis_divergence
        grounds:
          - calculations.tax_credit_amount
          - entities.TaxCreditClaim.fields.claim_variant
          - entities.TaxCreditClaim.fields.reported_tonnes
          - entities.TaxCreditClaim.fields.verified_tonnes
          - entities.TaxCreditClaim.fields.credit_amount_usd
          - state_machines.TaxCreditClaim.SUBMITTED_to_ALLOWED
        distinguishing_aspect: |
          This instance's dual variant lives in the TaxCreditClaim fiscal domain (not the GeologicModel
          domain of seal_integrity_index_variant_flips_pass_to_fail): the REPORTED variant credits
          550000.000 tonnes for 38500000.00 USD while the VERIFIED variant credits the
          lifecycle-adjusted 522000.000 tonnes for 36540000.00 USD, a pinned delta of 1960000.00 USD.
          Both variants read the same ledger and the same tier rate 70.00.
        test_recipe:
          setup:
            - "logical clock advanced to 2028-02-01T00:00:00Z"
            - "project 'Alpha Storage Hub' in status INJECTION_ACTIVE with operational_posture OPEN and assurance_coverage_status FUNDED"
            - "one ACTIVE InjectionWellPermit with two ACCEPTED InjectionPeriodRecord rows in tax year 2027 totalling 550000 tonnes injected and 500 tonnes measured leakage"
            - "one MonitoringPlan in status APPROVED with coverage_score 85.00"
            - "one DRAFT TaxCreditClaim for tax_year 2027 with lca_upstream_emissions_factor 0.05"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/geologic-models/${model_id}/finalize-aor"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/pore-space-tracts"
              payload: { project_id: "${proj_id}", tract_label: "T1", acreage: 1000, landowner_user_id: "landowner-1", ownership_pct: 33.3333 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { t1_id: $.data.id, t1_v0: $.data.version }
            - call: "POST /ccs/pore-space-tracts/${t1_id}/offers"
              payload: { expected_tract_version: "${t1_v0}", bonus_per_acre_usd: 15.00, royalty_rate_pct: 12.5 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/pore-space-tracts/${t1_id}/respond"
              payload: { response: "ACCEPT", lease_term_start: "2026-09-01T00:00:00Z", lease_term_end: "2046-09-01T00:00:00Z" }
              as: Landowner
              as_user_id: "landowner-1"
            - call: "POST /ccs/pore-space-tracts"
              payload: { project_id: "${proj_id}", tract_label: "T2", acreage: 1000, landowner_user_id: "landowner-2", ownership_pct: 66.6667 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { t2_id: $.data.id, t2_v0: $.data.version }
            - call: "POST /ccs/pore-space-tracts/${t2_id}/offers"
              payload: { expected_tract_version: "${t2_v0}", bonus_per_acre_usd: 15.00, royalty_rate_pct: 12.5 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/pore-space-tracts/${t2_id}/respond"
              payload: { response: "ACCEPT", lease_term_start: "2026-09-01T00:00:00Z", lease_term_end: "2046-09-01T00:00:00Z" }
              as: Landowner
              as_user_id: "landowner-2"
            - call: "POST /ccs/pore-space-tracts"
              payload: { project_id: "${proj_id}", tract_label: "T3", acreage: 1400, landowner_user_id: "landowner-3", ownership_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { t3_id: $.data.id, t3_v0: $.data.version }
            - call: "POST /ccs/pore-space-tracts/${t3_id}/offers"
              payload: { expected_tract_version: "${t3_v0}", bonus_per_acre_usd: 15.00, royalty_rate_pct: 12.5 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/pore-space-tracts/${t3_id}/respond"
              payload: { response: "ACCEPT", lease_term_start: "2026-09-01T00:00:00Z", lease_term_end: "2046-09-01T00:00:00Z" }
              as: Landowner
              as_user_id: "landowner-3"
            - call: "POST /ccs/monitoring-plans"
              payload: { project_id: "${proj_id}", plan_label: "MRV-1" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SUBSURFACE", technique: "TIME_LAPSE_SEISMIC", detection_threshold_tpy: 500, frequency_per_year: 2, spatial_coverage_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SURFACE", technique: "SOIL_GAS_FLUX", detection_threshold_tpy: 100, frequency_per_year: 4, spatial_coverage_pct: 80 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "ATMOSPHERIC", technique: "EDDY_COVARIANCE", detection_threshold_tpy: 25, frequency_per_year: 12, spatial_coverage_pct: 55 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/submit"
              payload: { submission_note: "MRV plan for review" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/review"
              payload: { decision: "COMPLETE_TECHNICAL_REVIEW", review_note: "technical track closed" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/review"
              payload: { decision: "COMPLETE_PUBLIC_COMMENT", review_note: "comment period closed" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/review"
              payload: { decision: "APPROVE", condition_count: 0, review_note: "coverage sufficient" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/injection-well-permits"
              payload: { project_id: "${proj_id}", geologic_model_id: "${model_id}", well_name: "ALPHA-1", casing_program: "LONG_STRING_CEMENTED_TO_SURFACE", corrosion_resistant_material: true, tubing_packer_installed: true, requested_injection_pressure_psi: 4000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { permit_id: $.data.id }
            - call: "POST /ccs/injection-well-permits/${permit_id}/submit"
              payload: { submission_note: "Class VI application" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/review"
              payload: { decision: "BEGIN_TECHNICAL_REVIEW", review_note: "assigned" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-2"
            - call: "POST /ccs/injection-well-permits/${permit_id}/review"
              payload: { decision: "APPROVE", review_note: "construction standards met" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-2"
            - call: "POST /ccs/financial-instruments"
              payload: { project_id: "${proj_id}", instrument_type: "TRUST_FUND", face_amount_usd: 26000000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { inst_id: $.data.id, inst_v0: $.data.version }
            - call: "POST /ccs/financial-instruments/${inst_id}/allocate"
              payload: { expected_instrument_version: "${inst_v0}" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/storage-projects/${proj_id}/authorize-injection"
              payload: { authorization_note: "all Class VI preconditions satisfied" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/advance-construction"
              payload: { to_construction_status: "DRILLING" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/advance-construction"
              payload: { to_construction_status: "CASING_SET" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/advance-construction"
              payload: { to_construction_status: "CEMENT_LOGGED" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/advance-construction"
              payload: { to_construction_status: "MIT_PENDING" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/record-mit"
              payload: { test_type: "ANNULUS_PRESSURE", annulus_pressure_loss_psi: 2.50 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/advance-construction"
              payload: { to_construction_status: "COMPLETED" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/activate"
              payload: { activation_note: "well cleared for injection" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/injection-well-permits/${permit_id}/injection-periods"
              payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2027-07-01T00:00:00Z", mass_injected_tonnes: 300000, measured_leakage_tonnes: 500 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/injection-periods"
              payload: { period_start: "2027-07-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", mass_injected_tonnes: 250000, measured_leakage_tonnes: 0 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/tax-credit-claims"
              payload: { project_id: "${proj_id}", monitoring_plan_id: "${plan_id}", tax_year: 2027, claim_variant: "REPORTED", lca_upstream_emissions_factor: 0.05 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /ccs/tax-credit-claims/${claim_id}/submit"
              payload: { submission_note: "secure geologic storage report for 2027" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { credit_reported: $.data.credit_amount_usd, rate_reported: $.data.credit_rate_usd_per_tonne }
            - call: "POST /ccs/tax-credit-claims/${claim_id}/verify"
              payload: { decision: "ALLOW", verification_note: "lifecycle analysis accepted" }
              as: IndependentVerifier
              as_user_id: "verifier-1"
          assert:
            - "${credit_reported} == 38500000.00"
            - "${rate_reported} == 70.00"
            - "TaxCreditClaim.${claim_id}.reported_tonnes == 550000.000"
            - "TaxCreditClaim.${claim_id}.verified_tonnes == 522000.000"
            - "TaxCreditClaim.${claim_id}.credit_rate_usd_per_tonne == 70.00"
            - "TaxCreditClaim.${claim_id}.credit_amount_usd == 36540000.00"
            - "TaxCreditClaim.${claim_id}.claim_variant == VERIFIED"
            - "TaxCreditClaim.${claim_id}.status == ALLOWED"
            - "${credit_reported} - TaxCreditClaim.${claim_id}.credit_amount_usd == 1960000.00"
            - "StorageProject.${proj_id}.cumulative_stored_tonnes == 549500.000"
            - "StorageProject.${proj_id}.pending_credit_usd == 36540000.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: wellbore_risk_score_nested_min_max_and_state_branches
        grounds:
          - calculations.legacy_wellbore_risk_score
          - entities.LegacyWellbore.fields.risk_score
          - entities.LegacyWellbore.fields.ca_cost_estimate_usd
          - entities.LegacyWellbore.fields.corrective_action_status
          - state_machines.LegacyWellbore.IDENTIFIED_to_CA_REQUIRED
        distinguishing_aspect: |
          Mode (a): risk_score combines five inputs (penetrates_seal, plug_condition,
          plug_record_available, distance_from_injector_km, project.aor_radius_km) non-linearly through a
          nested max(0.20, min(1.00, ...)) proximity clamp and a conditional aor<=0 branch, and the same
          score then feeds a second conditional branch selecting OUT_OF_AOR / IDENTIFIED / CA_REQUIRED —
          four wellbores at the same aor_radius_km 3.0 land on 90.00, 47.60, 7.65 and 44.20.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status PERMITTING with total_project_acreage 4000 and ca_rig_slots 2"
            - "one ACCEPTED GeologicModel with plume_status AOR_FINALIZED, so project.aor_radius_km == 3.0"
            - "no LegacyWellbore rows registered yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/geologic-models/${model_id}/finalize-aor"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
          trigger:
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00001", distance_from_injector_km: 0.5, total_depth_m: 2000, penetrates_seal: true, plug_condition: "OPEN_HOLE", plug_record_available: false }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w1_id: $.data.id }
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00002", distance_from_injector_km: 1.0, total_depth_m: 1200, penetrates_seal: false, plug_condition: "PARTIALLY_PLUGGED", plug_record_available: false }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w2_id: $.data.id }
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00003", distance_from_injector_km: 2.0, total_depth_m: 800, penetrates_seal: false, plug_condition: "CEMENTED", plug_record_available: true }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w3_id: $.data.id }
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00004", distance_from_injector_km: 5.0, total_depth_m: 1000, penetrates_seal: false, plug_condition: "OPEN_HOLE", plug_record_available: false }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w4_id: $.data.id }
          assert:
            - "LegacyWellbore.${w1_id}.risk_score == 90.00"
            - "LegacyWellbore.${w1_id}.ca_cost_estimate_usd == 570000.00"
            - "LegacyWellbore.${w1_id}.corrective_action_status == CA_REQUIRED"
            - "LegacyWellbore.${w2_id}.risk_score == 47.60"
            - "LegacyWellbore.${w2_id}.ca_cost_estimate_usd == 389200.00"
            - "LegacyWellbore.${w2_id}.corrective_action_status == CA_REQUIRED"
            - "LegacyWellbore.${w3_id}.risk_score == 7.65"
            - "LegacyWellbore.${w3_id}.ca_cost_estimate_usd == 261300.00"
            - "LegacyWellbore.${w3_id}.corrective_action_status == IDENTIFIED"
            - "LegacyWellbore.${w4_id}.risk_score == 44.20"
            - "LegacyWellbore.${w4_id}.ca_cost_estimate_usd == 358400.00"
            - "LegacyWellbore.${w4_id}.corrective_action_status == OUT_OF_AOR"
