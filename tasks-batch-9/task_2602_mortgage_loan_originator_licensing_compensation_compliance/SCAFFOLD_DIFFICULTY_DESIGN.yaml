          assert:
            - "${st_closed} == CLOSED and ${cs_closed} == PENDING and ${flag_closed} == SUSPENDED
               (BRANCH B withheld the compensation because authority_flag was not VERIFIED)"
            - "${inv_status0} == OPEN and ${inv_ids} contains ${inv_id}"
