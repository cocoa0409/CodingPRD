            - call: "POST /service-providers/${prov_id}/shifts"
              payload: { shift_start: "2026-06-01T15:00:00Z", shift_end: "2026-06-01T20:00:00Z" }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SHIFT_OVERLAP"

