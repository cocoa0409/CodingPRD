# =============================================================================
# PRD Benchmark Scaffold — In Vitro Diagnostic Reagent Manufacturing
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: "2966. In Vitro Diagnostic Reagent Manufacturing (diagnostic reagent manufacturer): raw material qualification including antibodies, enzymes and calibrator materials with lot acceptance testing, formulation and filling under controlled conditions with bioburden and environmental monitoring, lot release testing against specifications with reference material comparison and stability data, design control, verification and validation documentation supporting the regulatory clearance, lot-to-lot consistency management with bridging studies when a critical raw material changes, stability program with real-time and accelerated studies establishing shelf life and storage conditions, complaint handling with malfunction reporting and field correction decisions, distribution with cold chain validation and expiration-based allocation"

domain_name: "ivd-reagent-manufacturing"

# All endpoint paths in §1.5 are root-relative; there is no shared collection
# prefix because the surface spans fourteen peer aggregates.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  difficulty_level: expert_plus
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: LotComponent is a ReagentLot x MaterialLot junction; DesignControlRecord
  # is self-referential (traces_to_record_id); BridgingStudy carries two edges into
  # ReagentLot (predicate/candidate) plus one into MaterialLot; TestResult is
  # polymorphic over three subject aggregates.

  state_machine_shape: parallel
  # ReagentLot carries two independent state dimensions (disposition_status x
  # distribution_status). MaterialLot is cyclic (UNDER_TEST -> OOS_INVESTIGATION ->
  # UNDER_TEST on retest). Complaint is a fork-join diamond (TRIAGED -> {malfunction
  # report branch, field-action branch} -> CLOSED). BridgingStudy branches
  # DRAFT -> {APPROVED, FAILED} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # Six operator roles. Two segregation rules compare X-User-ID across steps:
  # (1) the QAReleaser dispositioning a ReagentLot must not be the user who
  # performed any of its release TestResults; (2) the QAReleaser deciding a
  # Complaint field action must not be the user who released the implicated lot.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table (14 entities)
# -----------------------------------------------------------------------------
entities:

  - name: MaterialSpecification
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - { name: material_code, type: string, source: input, description: "Unique catalogue code of the raw material, e.g. AB-CD19", constraints: "unique across MaterialSpecification; 3-32 chars" }
      - { name: material_type, type: enum, source: input, description: "Class of raw material governed by this specification", constraints: "one of ANTIBODY, ENZYME, CALIBRATOR_MATERIAL, BUFFER" }
      - { name: is_critical, type: boolean, source: input, default: false, description: "True when a change of vendor lot for this material forces a bridging study on the next finished lot" }
      - { name: potency_min_pct, type: number, source: input, description: "Lower acceptance bound for the POTENCY test, percent of label", constraints: "0 < potency_min_pct < potency_max_pct" }
      - { name: potency_max_pct, type: number, source: input, description: "Upper acceptance bound for the POTENCY test, percent of label" }
      - { name: endotoxin_max_eu_per_ml, type: number, source: input, description: "Maximum acceptable endotoxin concentration in EU/mL", constraints: "> 0" }
      - { name: purity_min_pct, type: number, source: input, description: "Lower acceptance bound for the PURITY test, percent" }
      - { name: required_test_codes, type: array, source: input, description: "Acceptance tests that must all be recorded before a disposition decision", constraints: "non-empty; each element one of POTENCY, PURITY, ENDOTOXIN, IDENTITY" }
      - { name: acceptance_mode, type: enum, source: input, default: ALL_PASS, description: "Selects which acceptance algorithm variant decides QUALIFY vs REJECT", constraints: "one of ALL_PASS, WEIGHTED_SCORE" }
      - { name: max_retests, type: integer, source: input, default: 1, description: "How many retest cycles a lot may run after an out-of-specification result", constraints: ">= 0" }
      - { name: retest_window_days, type: integer, source: input, default: 30, description: "Retest must be recorded within this many days after first_oos_at" }

  - name: MaterialLot
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: material_specification_id, type: string, source: input, description: "FK -> MaterialSpecification.id; the specification this incoming lot is qualified against" }
      - { name: vendor_lot_code, type: string, source: input, description: "Supplier lot identifier printed on the certificate of analysis", constraints: "unique together with material_specification_id" }
      - { name: received_quantity_units, type: number, source: input, description: "Quantity received at goods-in, in specification units", constraints: "> 0" }
      - { name: available_quantity_units, type: number, source: computed, description: "Quantity not yet consumed by any CONSUMED LotComponent; see calculations.material_quantity_conservation" }
      - { name: consumed_quantity_units, type: number, source: computed, default: 0, description: "Sum of quantity_used over this lot's LotComponent rows whose status is CONSUMED" }
      - { name: expiry_date, type: datetime, source: input, description: "Vendor expiry instant of the raw material lot, ISO 8601 UTC" }
      - { name: qualification_status, type: enum, source: system, default: RECEIVED, description: "Lot acceptance lifecycle state", constraints: "one of RECEIVED, UNDER_TEST, OOS_INVESTIGATION, QUALIFIED, REJECTED, QUARANTINED" }
      - { name: retest_count, type: integer, source: computed, default: 0, description: "Count of TestResult rows on this lot with is_retest true" }
      - { name: first_oos_at, type: datetime, source: computed, description: "performed_at of the earliest FAIL TestResult on this lot; null while no failure exists" }
      - { name: acceptance_score, type: number, source: computed, description: "Weighted acceptance score 0.00-100.00 from calculations.material_lot_acceptance_score; null while acceptance_mode is ALL_PASS" }
      - { name: dispositioned_by_user_id, type: string, source: system, description: "X-User-ID of the QAReleaser who set QUALIFIED or REJECTED; null before disposition" }
      - { name: dispositioned_at, type: datetime, source: system, description: "Logical-clock instant of the disposition decision; null before disposition" }
      - { name: quarantine_reason, type: string, source: system, description: "Free-text cause recorded when a cascade moved this lot to QUARANTINED; null otherwise" }

  - name: ProductSpecification
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - { name: product_code, type: string, source: input, description: "Unique catalogue code of the finished IVD reagent", constraints: "unique across ProductSpecification" }
      - { name: reference_material_code, type: string, source: input, description: "Code of the reference material every release test is compared against" }
      - { name: required_material_codes, type: array, source: input, description: "Bill of materials as MaterialSpecification.material_code values; every code must be represented by a CONSUMED LotComponent before release", constraints: "non-empty" }
      - { name: release_test_codes, type: array, source: input, description: "Release tests that must all be recorded with outcome PASS before release", constraints: "non-empty; each element one of ACTIVITY, CALIBRATION_SLOPE, PRECISION, LINEARITY" }
      - { name: max_reference_bias_pct, type: number, source: input, default: 5.0, description: "Largest per-test bias against the reference material tolerated at release" }
      - { name: shelf_life_months_claim, type: integer, source: input, description: "Shelf life claimed in the regulatory submission; caps every stability-derived shelf life", constraints: "> 0" }
      - { name: storage_condition, type: enum, source: input, description: "Labelled storage condition; fixes the reference temperature of the accelerated model", constraints: "one of TWO_TO_EIGHT_C, MINUS_TWENTY_C" }
      - { name: min_shelf_life_days_at_ship, type: integer, source: input, default: 90, description: "Floor on remaining shelf life for a lot to be allocatable, independent of the customer request" }
      - { name: clearance_status, type: enum, source: system, default: DESIGN, description: "Regulatory clearance state of the product", constraints: "one of DESIGN, CLEARED, WITHDRAWN" }
      - { name: submission_ref, type: string, source: system, description: "Submission reference recorded when clearance was granted; null while DESIGN" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical-clock instant clearance was granted; null while DESIGN" }
      - { name: design_trace_complete, type: boolean, source: computed, default: false, description: "True when calculations.design_trace_completeness finds an APPROVED VERIFICATION and an APPROVED VALIDATION record at trace_depth 3" }

  - name: DesignControlRecord
    parent: ProductSpecification
    common_fields: true
    kind: resource
    fields:
      - { name: product_specification_id, type: string, source: input, description: "FK -> ProductSpecification.id; the design history file this record belongs to" }
      - { name: record_type, type: enum, source: input, description: "Design-control artifact class", constraints: "one of DESIGN_INPUT, DESIGN_OUTPUT, VERIFICATION, VALIDATION" }
      - { name: document_ref, type: string, source: input, description: "Controlled document number of the artifact" }
      - { name: traces_to_record_id, type: string, source: input, description: "FK -> DesignControlRecord.id; the immediate predecessor artifact this record traces to; must be null exactly when record_type is DESIGN_INPUT" }
      - { name: trace_depth, type: integer, source: computed, description: "1 for DESIGN_INPUT, otherwise predecessor.trace_depth + 1; see calculations.design_trace_completeness" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Approval state of the record", constraints: "one of DRAFT, APPROVED, SUPERSEDED" }
      - { name: authored_by_user_id, type: string, source: system, description: "X-User-ID of the RegulatoryAffairs user who created the record" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the QAReleaser who approved the record; null while DRAFT" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock instant of approval; null while DRAFT" }

  - name: ReagentLot
    parent: ProductSpecification
    common_fields: true
    kind: resource
    fields:
      - { name: product_specification_id, type: string, source: input, description: "FK -> ProductSpecification.id; the product this finished lot realises" }
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot code", constraints: "unique together with product_specification_id" }
      - { name: planned_units, type: integer, source: input, description: "Units the lot is planned to yield", constraints: "> 0" }
      - { name: filled_units, type: integer, source: computed, default: 0, description: "Sum of filled_units over this lot's COMPLETED FillRun rows" }
      - { name: available_units, type: integer, source: computed, default: 0, description: "Units free for allocation; see calculations.reagent_lot_unit_conservation" }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "Sum of allocated_units over this lot's RESERVED Allocation rows" }
      - { name: shipped_units, type: integer, source: computed, default: 0, description: "Sum of allocated_units over this lot's SHIPPED and DELIVERED Allocation rows" }
      - { name: quarantined_units, type: integer, source: computed, default: 0, description: "Sum of allocated_units over this lot's QUARANTINED Allocation rows" }
      - { name: disposition_status, type: enum, source: system, default: PLANNED, description: "Quality dimension of the lot lifecycle; evolves independently of distribution_status", constraints: "one of PLANNED, IN_PROCESS, FILLED, UNDER_RELEASE_TEST, RELEASED, REJECTED, RECALLED" }
      - { name: distribution_status, type: enum, source: system, default: WITHHELD, description: "Commercial-availability dimension of the lot lifecycle; evolves independently of disposition_status", constraints: "one of WITHHELD, AVAILABLE, BLOCKED" }
      - { name: fill_completed_at, type: datetime, source: system, description: "Logical-clock instant the first COMPLETED FillRun of this lot finished; the anchor of expiry_date" }
      - { name: assigned_shelf_life_months, type: integer, source: computed, description: "Shelf life pinned onto the lot at release; null before release" }
      - { name: shelf_life_basis, type: enum, source: system, description: "Which evidence the released shelf life came from", constraints: "one of REAL_TIME, ACCELERATED, CLAIM; null before release" }
      - { name: shelf_life_basis_study_id, type: string, source: system, description: "FK -> StabilityStudy.id; the COMPLETE study whose established_shelf_life_months was pinned; null when shelf_life_basis is CLAIM or before release" }
      - { name: expiry_date, type: datetime, source: computed, description: "fill_completed_at plus assigned_shelf_life_months calendar months; null before release" }
      - { name: release_bias_max_pct, type: number, source: computed, description: "Largest per-test rounded bias against the reference material; see calculations.lot_release_reference_bias" }
      - { name: release_bias_sum_pct, type: number, source: computed, description: "Sum of the per-test rounded biases, rounding applied per test before summing" }
      - { name: em_excursion_count, type: integer, source: computed, default: 0, description: "Count of MonitoringSample rows with excursion true across this lot's FillRun rows" }
      - { name: bioburden_cfu_per_ml, type: number, source: computed, description: "Maximum BIOBURDEN_BULK result_value across this lot's FillRun rows; null when never sampled" }
      - { name: bridging_required, type: boolean, source: computed, default: false, description: "True when a critical raw material vendor lot changed versus the predicate lot; see calculations.bridging_requirement" }
      - { name: released_by_user_id, type: string, source: system, description: "X-User-ID of the QAReleaser who released the lot; null before release" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock instant of release; null before release" }

  - name: LotComponent
    parent: ReagentLot
    common_fields: true
    kind: resource
    fields:
      - { name: reagent_lot_id, type: string, source: input, description: "FK -> ReagentLot.id; the finished lot this component was dispensed into" }
      - { name: material_lot_id, type: string, source: input, description: "FK -> MaterialLot.id; the raw material lot consumed" }
      - { name: component_role, type: enum, source: input, description: "Bill-of-materials slot this component fills", constraints: "one of ANTIBODY, ENZYME, CALIBRATOR_MATERIAL, BUFFER" }
      - { name: quantity_used, type: number, source: input, description: "Quantity drawn from the raw material lot, in specification units", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: CONSUMED, description: "CONSUMED while the material counts against the raw lot; RETURNED after a fill-run abort gave it back", constraints: "one of CONSUMED, RETURNED" }
      - { name: material_code_snapshot, type: string, source: system, description: "material_code of the consumed lot's specification, copied at creation so bill-of-materials completeness never depends on later specification edits" }
      - { name: vendor_lot_code_snapshot, type: string, source: system, description: "vendor_lot_code of the consumed lot, copied at creation and compared by calculations.bridging_requirement" }

  - name: FillRun
    parent: ReagentLot
    common_fields: true
    kind: resource
    fields:
      - { name: reagent_lot_id, type: string, source: input, description: "FK -> ReagentLot.id; the finished lot this run fills" }
      - { name: line_code, type: string, source: input, description: "Filling line occupied for the scheduled interval; the resource guarded by the changeover-buffer overlap rule" }
      - { name: formulation_batch_code, type: string, source: input, description: "Bulk formulation batch dispensed by this run" }
      - { name: scheduled_start, type: datetime, source: input, description: "Start of the closed line-occupation interval, ISO 8601 UTC" }
      - { name: scheduled_end, type: datetime, source: input, description: "End of the closed line-occupation interval", constraints: "> scheduled_start" }
      - { name: planned_fill_units, type: integer, source: input, description: "Units this run is planned to fill", constraints: "> 0" }
      - { name: filled_units, type: integer, source: system, description: "Units actually filled, recorded at completion; null before COMPLETED" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Run lifecycle state", constraints: "one of SCHEDULED, RUNNING, COMPLETED, ABORTED" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock instant the run entered RUNNING; null while SCHEDULED" }
      - { name: ended_at, type: datetime, source: system, description: "Logical-clock instant the run entered COMPLETED or ABORTED; null before" }
      - { name: minor_excursion_count, type: integer, source: computed, default: 0, description: "Count of this run's MonitoringSample rows with excursion_grade MINOR" }
      - { name: major_excursion_count, type: integer, source: computed, default: 0, description: "Count of this run's MonitoringSample rows with excursion_grade MAJOR" }
      - { name: bioburden_cfu_per_ml, type: number, source: computed, description: "Maximum result_value across this run's BIOBURDEN_BULK samples; null when never sampled" }
      - { name: environmental_state, type: enum, source: computed, default: CONFORMING, description: "Derived environmental posture of the run; see calculations.environmental_state", constraints: "one of CONFORMING, EXCURSION, DISQUALIFIED" }
      - { name: abort_reason, type: string, source: system, description: "Reason captured when the run was aborted; null otherwise" }

  - name: MonitoringSample
    parent: FillRun
    common_fields: false
    kind: event
    fields:
      - { name: fill_run_id, type: string, source: input, description: "FK -> FillRun.id; the run this environmental or bioburden sample belongs to" }
      - { name: sample_type, type: enum, source: input, description: "Monitoring channel", constraints: "one of VIABLE_AIR, SURFACE, NONVIABLE_PARTICLE, BIOBURDEN_BULK" }
      - { name: location_code, type: string, source: input, description: "Sampling point identifier inside the filling suite" }
      - { name: result_value, type: number, source: input, description: "Measured count in the channel's own unit (cfu/m3, cfu, particles/m3, cfu/mL)", constraints: ">= 0" }
      - { name: sampled_at, type: datetime, source: input, description: "Instant the sample was taken, ISO 8601 UTC" }
      - { name: limit_value, type: number, source: computed, description: "Action limit for sample_type taken from calculations.environmental_state constants" }
      - { name: excursion, type: boolean, source: computed, description: "True exactly when result_value > limit_value; equality is conforming" }
      - { name: excursion_grade, type: enum, source: computed, description: "NONE when not an excursion, MAJOR when result_value >= 2 x limit_value, else MINOR", constraints: "one of NONE, MINOR, MAJOR" }

  - name: TestResult
    parent: null
    common_fields: false
    kind: event
    fields:
      - { name: subject_type, type: enum, source: input, description: "Which aggregate this measurement belongs to; selects the conditional validation set", constraints: "one of MATERIAL_LOT, REAGENT_LOT, STABILITY_TIMEPOINT" }
      - { name: material_lot_id, type: string, source: input, description: "FK -> MaterialLot.id; required when subject_type is MATERIAL_LOT and null otherwise" }
      - { name: reagent_lot_id, type: string, source: input, description: "FK -> ReagentLot.id; required when subject_type is REAGENT_LOT and null otherwise" }
      - { name: stability_study_id, type: string, source: input, description: "FK -> StabilityStudy.id; required when subject_type is STABILITY_TIMEPOINT and null otherwise" }
      - { name: month_index, type: integer, source: input, description: "Stability timepoint in months; required when subject_type is STABILITY_TIMEPOINT and null otherwise" }
      - { name: test_code, type: string, source: input, description: "Analytical method code, e.g. POTENCY or ACTIVITY" }
      - { name: measured_value, type: number, source: input, description: "Result of the measurement in the method's unit" }
      - { name: reference_measured_value, type: number, source: input, description: "Paired reference-material result; required when subject_type is REAGENT_LOT and null otherwise", constraints: "> 0 when present" }
      - { name: is_retest, type: boolean, source: input, default: false, description: "True when the record closes an out-of-specification investigation on a MATERIAL_LOT" }
      - { name: outcome, type: enum, source: computed, description: "PASS or FAIL against the governing specification bound for the subject", constraints: "one of PASS, FAIL" }
      - { name: bias_pct, type: number, source: computed, description: "round(abs(measured_value - reference_measured_value) / reference_measured_value * 100, 2); null unless subject_type is REAGENT_LOT" }
      - { name: recovery_pct, type: number, source: computed, description: "round(measured_value / study.baseline_value * 100, 2); null unless subject_type is STABILITY_TIMEPOINT" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the QCAnalyst who recorded the measurement; consumed by the segregation-of-duties rule at reagent-lot disposition" }
      - { name: performed_at, type: datetime, source: system, description: "Logical-clock instant the measurement was recorded" }

  - name: StabilityStudy
    parent: ProductSpecification
    common_fields: true
    kind: resource
    fields:
      - { name: product_specification_id, type: string, source: input, description: "FK -> ProductSpecification.id; the product whose shelf life this study establishes" }
      - { name: reagent_lot_id, type: string, source: input, description: "FK -> ReagentLot.id; the lot placed on stability" }
      - { name: study_type, type: enum, source: input, description: "REAL_TIME studies read shelf life directly, ACCELERATED studies extrapolate", constraints: "one of REAL_TIME, ACCELERATED" }
      - { name: chamber_code, type: string, source: input, description: "Stability chamber occupied for the half-open protocol interval; the resource guarded by the aggregate-capacity overlap rule" }
      - { name: storage_temp_c, type: number, source: input, description: "Chamber setpoint in Celsius; drives the accelerated acceleration factor" }
      - { name: protocol_start, type: datetime, source: input, description: "Inclusive start of the half-open chamber-occupation interval" }
      - { name: protocol_end, type: datetime, source: input, description: "Exclusive end of the half-open chamber-occupation interval", constraints: "> protocol_start" }
      - { name: planned_timepoints_months, type: array, source: input, description: "Ordered month indices the protocol will pull, e.g. [0, 3, 6, 9, 12]", constraints: "non-empty; strictly increasing integers; first element 0" }
      - { name: baseline_value, type: number, source: input, description: "T0 assay value every timepoint recovery is computed against", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: PROTOCOL_DRAFT, description: "Study lifecycle state", constraints: "one of PROTOCOL_DRAFT, APPROVED, IN_PROGRESS, COMPLETE, ABORTED" }
      - { name: timepoint_count, type: integer, source: computed, default: 0, description: "Count of TestResult rows with stability_study_id equal to this study" }
      - { name: last_conforming_month, type: integer, source: computed, description: "Largest planned month index m such that every planned index <= m has a recorded timepoint with recovery_pct >= 90.00; null before any timepoint" }
      - { name: established_shelf_life_months, type: integer, source: computed, description: "Shelf life this study establishes; filled at conclusion; see calculations.stability_shelf_life" }
      - { name: shelf_life_method, type: enum, source: computed, description: "Which variant produced established_shelf_life_months", constraints: "one of REAL_TIME_LAST_CONFORMING, ACCELERATED_Q10; null before conclusion" }
      - { name: protocol_approved_by_user_id, type: string, source: system, description: "X-User-ID of the QAReleaser who approved the protocol; null while PROTOCOL_DRAFT" }

  - name: BridgingStudy
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: predicate_lot_id, type: string, source: input, description: "FK -> ReagentLot.id; the previously released lot the candidate is compared against" }
      - { name: candidate_lot_id, type: string, source: input, description: "FK -> ReagentLot.id; the lot built with the changed critical material" }
      - { name: changed_material_lot_id, type: string, source: input, description: "FK -> MaterialLot.id; the new critical raw material lot that triggered the bridge" }
      - { name: paired_test_codes, type: array, source: input, description: "Release test codes compared pairwise between predicate and candidate", constraints: "non-empty; each element must appear in both lots' release test records" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Bridging lifecycle state", constraints: "one of DRAFT, APPROVED, FAILED" }
      - { name: mean_bias_pct, type: number, source: computed, description: "Mean of the per-code rounded candidate-vs-predicate biases; see calculations.bridging_equivalence" }
      - { name: max_bias_pct, type: number, source: computed, description: "Largest per-code rounded candidate-vs-predicate bias" }
      - { name: equivalence_verdict, type: enum, source: computed, default: PENDING, description: "EQUIVALENT when mean_bias_pct <= 3.00 and max_bias_pct <= 5.00, NOT_EQUIVALENT otherwise, PENDING while data are missing", constraints: "one of PENDING, EQUIVALENT, NOT_EQUIVALENT" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the QAReleaser who decided the study; null while DRAFT" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the decision; null while DRAFT" }

  - name: Complaint
    parent: ReagentLot
    common_fields: true
    kind: resource
    fields:
      - { name: reagent_lot_id, type: string, source: input, description: "FK -> ReagentLot.id; the implicated finished lot" }
      - { name: complaint_code, type: string, source: input, description: "Intake reference of the complaint" }
      - { name: narrative, type: string, source: input, description: "Reported failure description" }
      - { name: device_related_death_or_injury, type: boolean, source: input, default: false, description: "True when the reporter alleges death or serious injury; shortens the reporting deadline to 5 days" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock instant of intake; anchors report_due_at" }
      - { name: severity, type: enum, source: system, description: "Triage severity", constraints: "one of LOW, MEDIUM, HIGH; null before triage" }
      - { name: malfunction_suspected, type: boolean, source: system, description: "Triage conclusion on whether the device malfunctioned; null before triage" }
      - { name: reportable, type: boolean, source: computed, description: "See calculations.complaint_reportability; null before triage" }
      - { name: report_due_at, type: datetime, source: computed, description: "received_at plus 5 days when device_related_death_or_injury else plus 30 days; null when not reportable" }
      - { name: report_ref, type: string, source: system, description: "Regulator submission reference; null before the malfunction report" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock instant the malfunction report was filed; null before" }
      - { name: report_late, type: boolean, source: computed, description: "True exactly when reported_at > report_due_at; equality is on time; null before the report" }
      - { name: field_action, type: enum, source: system, description: "Field-action decision", constraints: "one of NONE, ADVISORY, CORRECTION, REMOVAL; null before the decision" }
      - { name: field_action_decided_by_user_id, type: string, source: system, description: "X-User-ID of the QAReleaser who decided the field action; null before the decision" }
      - { name: field_action_decided_at, type: datetime, source: system, description: "Logical-clock instant the field action was decided; null before the decision" }
      - { name: triaged_by_user_id, type: string, source: system, description: "X-User-ID of the RegulatoryAffairs user who triaged; null before triage" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "Fork-join complaint lifecycle state", constraints: "one of RECEIVED, TRIAGED, MALFUNCTION_REPORTED, FIELD_ACTION_DECIDED, CLOSED" }

  - name: DistributionOrder
    parent: ProductSpecification
    common_fields: true
    kind: resource
    fields:
      - { name: product_specification_id, type: string, source: input, description: "FK -> ProductSpecification.id; the product ordered" }
      - { name: customer_code, type: string, source: input, description: "Customer account identifier" }
      - { name: requested_units, type: integer, source: input, description: "Units requested", constraints: "> 0" }
      - { name: required_min_shelf_life_days, type: integer, source: input, description: "Customer floor on remaining shelf life at allocation", constraints: ">= 0" }
      - { name: ship_by, type: datetime, source: input, description: "Latest acceptable ship instant" }
      - { name: allocation_policy, type: enum, source: input, default: FEFO_STRICT, description: "FEFO_STRICT rejects the whole allocation on shortfall, FEFO_WITH_SHORTFALL persists a partial allocation", constraints: "one of FEFO_STRICT, FEFO_WITH_SHORTFALL" }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "Sum of allocated_units over this order's Allocation rows whose status is in {RESERVED, SHIPPED, DELIVERED}" }
      - { name: shortfall_units, type: integer, source: computed, default: 0, description: "requested_units minus allocated_units, floored at 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Order lifecycle state", constraints: "one of DRAFT, ALLOCATED, PARTIALLY_ALLOCATED, SHIPPED, CLOSED, CANCELLED" }
      - { name: planner_user_id, type: string, source: system, description: "X-User-ID of the DistributionPlanner who created the order" }

  - name: Allocation
    parent: DistributionOrder
    common_fields: true
    kind: resource
    fields:
      - { name: distribution_order_id, type: string, source: input, description: "FK -> DistributionOrder.id; the order this reservation serves" }
      - { name: reagent_lot_id, type: string, source: input, description: "FK -> ReagentLot.id; the lot units were drawn from" }
      - { name: allocated_units, type: integer, source: computed, description: "Units reserved from the lot by the waterfall step that created this row" }
      - { name: sequence_index, type: integer, source: computed, description: "1-based position of this row in the FEFO waterfall that created it" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "Reservation lifecycle state", constraints: "one of RESERVED, SHIPPED, DELIVERED, CANCELLED, QUARANTINED" }
      - { name: shipped_at, type: datetime, source: system, description: "Instant the units left the warehouse; null before shipping" }
      - { name: cumulative_excursion_minutes, type: number, source: computed, default: 0, description: "Sum of excursion_minutes over the cold-chain events recorded against this allocation" }
      - { name: max_excursion_temp_c, type: number, source: computed, description: "Largest max_temp_c reported across this allocation's cold-chain events; null when none" }
      - { name: cold_chain_status, type: enum, source: computed, default: INTACT, description: "Cold-chain verdict from calculations.cold_chain_verdict", constraints: "one of INTACT, EXCURSION_ACCEPTABLE, EXCURSION_REJECTED" }
      - { name: quarantine_reason, type: string, source: system, description: "Cause recorded when the row moved to QUARANTINED; null otherwise" }

# -----------------------------------------------------------------------------
# §1.2 State Machine Table (10 machines; MaterialLot cyclic, ReagentLot parallel,
# Complaint fork-join, BridgingStudy branching)
# -----------------------------------------------------------------------------
state_machines:

  - entity: MaterialLot
    initial_state: RECEIVED
    terminal_states: [REJECTED, QUARANTINED]
    shape: cyclic
    transitions:
      - from: RECEIVED
        to: UNDER_TEST
        trigger: "POST /test-results with subject_type MATERIAL_LOT (first acceptance test on the lot)"
        actor: QCAnalyst
        preconditions:
          - "qualification_status == RECEIVED"
          - "test_code is a member of the lot's MaterialSpecification.required_test_codes"
        side_effects:
          - "TestResult row created with outcome computed against the specification bounds"
          - "recompute MaterialLot.acceptance_score when MaterialSpecification.acceptance_mode == WEIGHTED_SCORE"
          - "set MaterialLot.first_oos_at to performed_at when the new record outcome is FAIL and first_oos_at is null"
          - "increments MaterialLot.version by 1"
      - from: UNDER_TEST
        to: UNDER_TEST
        trigger: "POST /test-results with subject_type MATERIAL_LOT (subsequent acceptance test, is_retest false)"
        actor: QCAnalyst
        preconditions:
          - "qualification_status == UNDER_TEST"
          - "test_code is a member of required_test_codes"
        side_effects:
          - "TestResult row created; acceptance_score recomputed; first_oos_at set on the first FAIL"
          - "increments MaterialLot.version by 1"
        note: "Self-loop; the acceptance decision itself is taken by the QAReleaser at disposition."
      - from: UNDER_TEST
        to: OOS_INVESTIGATION
        trigger: "POST /material-lots/{id}/disposition with decision INVESTIGATE"
        actor: QAReleaser
        preconditions:
          - "qualification_status == UNDER_TEST"
          - "at least one TestResult on the lot has outcome FAIL"
        side_effects:
          - "MaterialLot.qualification_status becomes OOS_INVESTIGATION"
          - "increments MaterialLot.version by 1"
      - from: OOS_INVESTIGATION
        to: UNDER_TEST
        trigger: "POST /test-results with subject_type MATERIAL_LOT and is_retest true"
        actor: QCAnalyst
        preconditions:
          - "qualification_status == OOS_INVESTIGATION"
          - "retest_count < MaterialSpecification.max_retests"
          - "clock_now <= first_oos_at + MaterialSpecification.retest_window_days days"
        side_effects:
          - "TestResult row created with is_retest true; MaterialLot.retest_count increases by 1"
          - "MaterialLot.qualification_status returns to UNDER_TEST"
          - "acceptance_score recomputed over the latest record per test_code"
          - "increments MaterialLot.version by 1"
        note: "The cycle: OOS_INVESTIGATION -> UNDER_TEST -> OOS_INVESTIGATION may repeat until retest_count reaches max_retests."
      - from: UNDER_TEST
        to: QUALIFIED
        trigger: "POST /material-lots/{id}/disposition with decision QUALIFY"
        actor: QAReleaser
        preconditions:
          - "qualification_status == UNDER_TEST"
          - "every code in required_test_codes has at least one TestResult on this lot"
          - "the acceptance decision of calculations.material_lot_acceptance_decision is ACCEPT"
        side_effects:
          - "MaterialLot.qualification_status becomes QUALIFIED; dispositioned_by_user_id and dispositioned_at recorded"
          - "MaterialLot.available_quantity_units stays received_quantity_units minus consumed_quantity_units"
          - "increments MaterialLot.version by 1"
      - from: UNDER_TEST
        to: REJECTED
        trigger: "POST /material-lots/{id}/disposition with decision REJECT"
        actor: QAReleaser
        preconditions:
          - "qualification_status == UNDER_TEST"
        side_effects:
          - "MaterialLot.qualification_status becomes REJECTED; available_quantity_units set to 0"
          - "increments MaterialLot.version by 1"
      - from: OOS_INVESTIGATION
        to: REJECTED
        trigger: "POST /material-lots/{id}/disposition with decision REJECT"
        actor: QAReleaser
        preconditions:
          - "qualification_status == OOS_INVESTIGATION"
        side_effects:
          - "MaterialLot.qualification_status becomes REJECTED; available_quantity_units set to 0"
          - "increments MaterialLot.version by 1"
      - from: QUALIFIED
        to: QUARANTINED
        trigger: "system cascade — a Complaint field action REMOVAL on a finished lot that consumed this raw lot, or a BridgingStudy FAILED naming this raw lot as changed_material_lot_id"
        actor: system
        preconditions:
          - "qualification_status == QUALIFIED"
        side_effects:
          - "MaterialLot.qualification_status becomes QUARANTINED; quarantine_reason recorded; available_quantity_units set to 0"
          - "increments MaterialLot.version by 1"

  - entity: ReagentLot
    initial_state: PLANNED
    terminal_states: [REJECTED, RECALLED]
    shape: parallel
    note: "Two independent dimensions on one row. Dimension A is disposition_status (quality), dimension B is distribution_status (commercial availability). A single request may advance A, B, or both; the two axes have different actors and different terminal semantics."
    transitions:
      - from: PLANNED
        to: IN_PROCESS
        dimension: disposition_status
        trigger: "POST /fill-runs/{id}/start"
        actor: ProductionOperator
        preconditions:
          - "disposition_status == PLANNED"
          - "the FillRun belongs to this lot and its status == SCHEDULED"
          - "the lot has at least one LotComponent with status CONSUMED"
        side_effects:
          - "FillRun.status becomes RUNNING and started_at is stamped"
          - "ReagentLot.disposition_status becomes IN_PROCESS"
          - "increments ReagentLot.version by 1"
      - from: IN_PROCESS
        to: PLANNED
        dimension: disposition_status
        trigger: "POST /fill-runs/{id}/abort"
        actor: ProductionOperator
        preconditions:
          - "disposition_status == IN_PROCESS"
          - "the FillRun status is SCHEDULED or RUNNING"
          - "the lot has no other FillRun in status RUNNING"
        side_effects:
          - "cascade hop 1 — FillRun.status becomes ABORTED, ended_at stamped, abort_reason stored"
          - "cascade hop 2 — because the run aborted, ReagentLot.disposition_status reverts to PLANNED"
          - "cascade hop 3 — because the lot reverted to PLANNED, every LotComponent of the lot with status CONSUMED becomes RETURNED"
          - "cascade hop 4 — because those components became RETURNED, each referenced MaterialLot has consumed_quantity_units reduced by quantity_used and available_quantity_units increased by the same amount, restoring calculations.material_quantity_conservation exactly"
          - "increments ReagentLot.version by 1 and each touched MaterialLot.version by 1"
      - from: IN_PROCESS
        to: FILLED
        dimension: disposition_status
        trigger: "POST /fill-runs/{id}/complete"
        actor: ProductionOperator
        preconditions:
          - "disposition_status == IN_PROCESS"
          - "the FillRun status == RUNNING"
          - "filled_units <= FillRun.planned_fill_units"
        side_effects:
          - "cascade hop 1 — FillRun.status becomes COMPLETED, filled_units and ended_at stored, environmental_state recomputed"
          - "cascade hop 2 — because the run completed, ReagentLot.filled_units increases by FillRun.filled_units, available_units increases by the same amount, fill_completed_at is stamped when null, and disposition_status becomes FILLED"
          - "cascade hop 3 — because the lot reached FILLED, when the completed run's environmental_state == DISQUALIFIED the lot is auto-rejected: disposition_status becomes REJECTED, available_units set to 0, distribution_status stays WITHHELD"
          - "recompute ReagentLot.em_excursion_count and bioburden_cfu_per_ml"
          - "recompute ReagentLot.bridging_required per calculations.bridging_requirement"
          - "increments ReagentLot.version by 1"
      - from: FILLED
        to: UNDER_RELEASE_TEST
        dimension: disposition_status
        trigger: "POST /test-results with subject_type REAGENT_LOT (first release test)"
        actor: QCAnalyst
        preconditions:
          - "disposition_status == FILLED"
          - "test_code is a member of ProductSpecification.release_test_codes"
        side_effects:
          - "TestResult row created with bias_pct computed against reference_measured_value"
          - "ReagentLot.disposition_status becomes UNDER_RELEASE_TEST"
          - "recompute ReagentLot.release_bias_max_pct and release_bias_sum_pct"
          - "increments ReagentLot.version by 1"
      - from: UNDER_RELEASE_TEST
        to: UNDER_RELEASE_TEST
        dimension: disposition_status
        trigger: "POST /test-results with subject_type REAGENT_LOT (subsequent release test)"
        actor: QCAnalyst
        preconditions:
          - "disposition_status == UNDER_RELEASE_TEST"
          - "test_code is a member of ProductSpecification.release_test_codes"
        side_effects:
          - "TestResult row created; release_bias_max_pct and release_bias_sum_pct recomputed"
          - "increments ReagentLot.version by 1"
      - from: UNDER_RELEASE_TEST
        to: RELEASED
        dimension: disposition_status
        trigger: "POST /reagent-lots/{id}/disposition with decision RELEASE"
        actor: QAReleaser
        preconditions:
          - "disposition_status == UNDER_RELEASE_TEST"
          - "X-User-ID differs from performed_by_user_id of every REAGENT_LOT TestResult on this lot"
          - "ProductSpecification.clearance_status == CLEARED"
          - "every code in ProductSpecification.release_test_codes has a TestResult on this lot whose outcome is PASS"
          - "release_bias_max_pct <= ProductSpecification.max_reference_bias_pct"
          - "every code in ProductSpecification.required_material_codes is covered by a LotComponent with status CONSUMED"
          - "no FillRun of this lot has environmental_state == DISQUALIFIED"
          - "when bridging_required is true, a BridgingStudy with candidate_lot_id == this lot exists in status APPROVED"
          - "when shelf_life_basis is REAL_TIME or ACCELERATED, a StabilityStudy on this product in status COMPLETE with a non-null established_shelf_life_months exists"
        side_effects:
          - "cascade hop 1 — ReagentLot.disposition_status becomes RELEASED; released_by_user_id and released_at recorded; assigned_shelf_life_months, shelf_life_basis, shelf_life_basis_study_id pinned per calculations.stability_shelf_life; expiry_date computed"
          - "cascade hop 2 — because the lot became RELEASED, distribution_status moves WITHHELD -> AVAILABLE automatically"
          - "increments ReagentLot.version by 1"
      - from: UNDER_RELEASE_TEST
        to: REJECTED
        dimension: disposition_status
        trigger: "POST /reagent-lots/{id}/disposition with decision REJECT"
        actor: QAReleaser
        preconditions:
          - "disposition_status == UNDER_RELEASE_TEST"
          - "X-User-ID differs from performed_by_user_id of every REAGENT_LOT TestResult on this lot"
        side_effects:
          - "ReagentLot.disposition_status becomes REJECTED; available_units set to 0; distribution_status stays WITHHELD"
          - "increments ReagentLot.version by 1"
      - from: RELEASED
        to: RECALLED
        dimension: disposition_status
        trigger: "system cascade from POST /complaints/{id}/field-action with field_action CORRECTION or REMOVAL"
        actor: system
        preconditions:
          - "disposition_status == RELEASED"
        side_effects:
          - "cascade hop 2 — ReagentLot.disposition_status becomes RECALLED and distribution_status becomes BLOCKED"
          - "cascade hop 3 — because the lot became RECALLED, every Allocation of the lot in status RESERVED or SHIPPED becomes QUARANTINED with quarantine_reason set, and the lot's allocated_units / shipped_units / quarantined_units are recomputed"
          - "cascade hop 4 — because those Allocation rows left RESERVED/SHIPPED, each parent DistributionOrder recomputes allocated_units and shortfall_units and, when allocated_units < requested_units and status was ALLOCATED, drops to PARTIALLY_ALLOCATED"
          - "cascade hop 3b (REMOVAL only) — because the lot became RECALLED under a REMOVAL action, every MaterialLot referenced by a CONSUMED LotComponent of the lot whose specification has is_critical true and whose qualification_status is QUALIFIED becomes QUARANTINED"
          - "increments ReagentLot.version by 1"
      - from: WITHHELD
        to: AVAILABLE
        dimension: distribution_status
        trigger: "automatic side effect of the RELEASE disposition, or POST /reagent-lots/{id}/distribution-status with distribution_status AVAILABLE"
        actor: QAReleaser
        preconditions:
          - "disposition_status == RELEASED"
        side_effects:
          - "ReagentLot.distribution_status becomes AVAILABLE, making the lot eligible for the FEFO candidate set"
          - "increments ReagentLot.version by 1"
      - from: AVAILABLE
        to: BLOCKED
        dimension: distribution_status
        trigger: "POST /reagent-lots/{id}/distribution-status with distribution_status BLOCKED, or system cascade from a Complaint field action"
        actor: QAReleaser
        preconditions:
          - "distribution_status == AVAILABLE"
        side_effects:
          - "ReagentLot.distribution_status becomes BLOCKED; existing Allocation rows are left untouched by this axis alone"
          - "increments ReagentLot.version by 1"
      - from: BLOCKED
        to: AVAILABLE
        dimension: distribution_status
        trigger: "POST /reagent-lots/{id}/distribution-status with distribution_status AVAILABLE"
        actor: QAReleaser
        preconditions:
          - "distribution_status == BLOCKED"
          - "disposition_status == RELEASED"
        side_effects:
          - "ReagentLot.distribution_status returns to AVAILABLE"
          - "increments ReagentLot.version by 1"
        note: "A RECALLED lot can never come back because its disposition_status is no longer RELEASED."

  - entity: FillRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    shape: linear_with_abort
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /fill-runs/{id}/start"
        actor: ProductionOperator
        preconditions:
          - "status == SCHEDULED"
          - "the parent ReagentLot.disposition_status == PLANNED"
          - "the parent lot has at least one LotComponent with status CONSUMED"
        side_effects:
          - "FillRun.status becomes RUNNING, started_at stamped from the logical clock"
          - "parent ReagentLot.disposition_status becomes IN_PROCESS"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /fill-runs/{id}/complete"
        actor: ProductionOperator
        preconditions:
          - "status == RUNNING"
          - "filled_units <= planned_fill_units"
          - "at least one MonitoringSample with sample_type BIOBURDEN_BULK exists on this run"
        side_effects:
          - "FillRun.status becomes COMPLETED; filled_units and ended_at stored; environmental_state recomputed"
          - "parent lot cascade per state_machines.ReagentLot.IN_PROCESS_to_FILLED"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /fill-runs/{id}/abort"
        actor: ProductionOperator
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "FillRun.status becomes ABORTED, ended_at stamped, abort_reason stored"
          - "the parent lot stays PLANNED; LotComponent rows are returned per state_machines.ReagentLot.IN_PROCESS_to_PLANNED hops 3 and 4"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /fill-runs/{id}/abort"
        actor: ProductionOperator
        preconditions:
          - "status == RUNNING"
        side_effects:
          - "FillRun.status becomes ABORTED, ended_at stamped, abort_reason stored"
          - "full compensation cascade per state_machines.ReagentLot.IN_PROCESS_to_PLANNED"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /fill-runs/{id}/samples"
        actor: QCAnalyst
        preconditions:
          - "status is SCHEDULED or RUNNING"
        side_effects:
          - "MonitoringSample row created with limit_value, excursion and excursion_grade computed"
          - "FillRun.minor_excursion_count, major_excursion_count, bioburden_cfu_per_ml and environmental_state recomputed"
          - "parent ReagentLot.em_excursion_count recomputed"

  - entity: DesignControlRecord
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /design-control-records/{id}/approve"
        actor: QAReleaser
        preconditions:
          - "status == DRAFT"
          - "when record_type is not DESIGN_INPUT, the record referenced by traces_to_record_id is in status APPROVED"
        side_effects:
          - "DesignControlRecord.status becomes APPROVED; approved_by_user_id and approved_at recorded"
          - "parent ProductSpecification.design_trace_complete recomputed per calculations.design_trace_completeness"
          - "increments ProductSpecification.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade — POST /design-control-records creating a new record with the same product_specification_id, record_type and document_ref"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "the older record's status becomes SUPERSEDED"
          - "parent ProductSpecification.design_trace_complete recomputed"

  - entity: ProductSpecification
    initial_state: DESIGN
    terminal_states: [WITHDRAWN]
    shape: linear
    transitions:
      - from: DESIGN
        to: CLEARED
        trigger: "POST /product-specifications/{id}/clearance"
        actor: RegulatoryAffairs
        preconditions:
          - "clearance_status == DESIGN"
          - "design_trace_complete == true"
        side_effects:
          - "ProductSpecification.clearance_status becomes CLEARED; submission_ref and cleared_at recorded"
          - "increments ProductSpecification.version by 1"
      - from: CLEARED
        to: WITHDRAWN
        trigger: "system cascade — POST /complaints/{id}/field-action with field_action REMOVAL when the implicated lot is the only RELEASED lot of the product"
        actor: system
        preconditions:
          - "clearance_status == CLEARED"
        side_effects:
          - "ProductSpecification.clearance_status becomes WITHDRAWN, blocking further release and allocation on the product"
          - "increments ProductSpecification.version by 1"

  - entity: StabilityStudy
    initial_state: PROTOCOL_DRAFT
    terminal_states: [COMPLETE, ABORTED]
    shape: linear
    transitions:
      - from: PROTOCOL_DRAFT
        to: APPROVED
        trigger: "POST /stability-studies/{id}/approve-protocol"
        actor: QAReleaser
        preconditions:
          - "status == PROTOCOL_DRAFT"
        side_effects:
          - "StabilityStudy.status becomes APPROVED; protocol_approved_by_user_id recorded"
          - "increments StabilityStudy.version by 1"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /test-results with subject_type STABILITY_TIMEPOINT (first timepoint)"
        actor: QCAnalyst
        preconditions:
          - "status == APPROVED"
          - "month_index is a member of planned_timepoints_months"
        side_effects:
          - "TestResult row created with recovery_pct computed against baseline_value"
          - "StabilityStudy.status becomes IN_PROGRESS; timepoint_count and last_conforming_month recomputed"
          - "increments StabilityStudy.version by 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /test-results with subject_type STABILITY_TIMEPOINT (subsequent timepoint)"
        actor: QCAnalyst
        preconditions:
          - "status == IN_PROGRESS"
          - "month_index is a member of planned_timepoints_months"
          - "no TestResult with the same stability_study_id, month_index and test_code already exists"
        side_effects:
          - "TestResult row created; timepoint_count and last_conforming_month recomputed"
          - "increments StabilityStudy.version by 1"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /stability-studies/{id}/conclude"
        actor: RegulatoryAffairs
        preconditions:
          - "status == IN_PROGRESS"
          - "last_conforming_month is not null"
        side_effects:
          - "StabilityStudy.status becomes COMPLETE; established_shelf_life_months and shelf_life_method filled per calculations.stability_shelf_life"
          - "increments StabilityStudy.version by 1"
      - from: APPROVED
        to: ABORTED
        trigger: "POST /stability-studies/{id}/conclude with the study still empty is rejected; abort happens as a system cascade when the study's ReagentLot becomes RECALLED"
        actor: system
        preconditions:
          - "status is APPROVED or IN_PROGRESS"
          - "the study's ReagentLot.disposition_status == RECALLED"
        side_effects:
          - "StabilityStudy.status becomes ABORTED, freeing its chamber interval for the aggregate-capacity rule"
          - "increments StabilityStudy.version by 1"

  - entity: BridgingStudy
    initial_state: DRAFT
    terminal_states: [APPROVED, FAILED]
    shape: branching
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /bridging-studies/{id}/decision with decision APPROVE"
        actor: QAReleaser
        preconditions:
          - "status == DRAFT"
          - "every code in paired_test_codes has a REAGENT_LOT TestResult on both the predicate and the candidate lot"
          - "equivalence_verdict == EQUIVALENT"
        side_effects:
          - "BridgingStudy.status becomes APPROVED; decided_by_user_id and decided_at recorded"
          - "the candidate ReagentLot's bridging precondition at release is now satisfied; no field on the candidate changes"
          - "increments BridgingStudy.version by 1"
      - from: DRAFT
        to: FAILED
        trigger: "POST /bridging-studies/{id}/decision with decision REJECT"
        actor: QAReleaser
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "cascade hop 1 — BridgingStudy.status becomes FAILED; decided_by_user_id and decided_at recorded"
          - "cascade hop 2 — because the bridge failed, the changed MaterialLot moves QUALIFIED -> QUARANTINED with quarantine_reason set and available_quantity_units set to 0"
          - "cascade hop 2b — because the bridge failed, the candidate ReagentLot's distribution_status becomes BLOCKED when it is currently AVAILABLE"
          - "increments BridgingStudy.version by 1"
        note: "Divergent side-effect sets per branch: APPROVED touches nothing outside the study, FAILED quarantines a raw lot and blocks the candidate."

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    shape: fork_join
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /complaints/{id}/triage"
        actor: RegulatoryAffairs
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "severity, malfunction_suspected and triaged_by_user_id stored"
          - "reportable and report_due_at computed per calculations.complaint_reportability"
          - "increments Complaint.version by 1"
      - from: TRIAGED
        to: MALFUNCTION_REPORTED
        trigger: "POST /complaints/{id}/malfunction-report"
        actor: RegulatoryAffairs
        preconditions:
          - "status is TRIAGED or FIELD_ACTION_DECIDED"
          - "reportable == true"
        side_effects:
          - "report_ref and reported_at stored; report_late computed as reported_at > report_due_at"
          - "status becomes MALFUNCTION_REPORTED when it was TRIAGED, and stays FIELD_ACTION_DECIDED when the other branch already ran"
          - "increments Complaint.version by 1"
      - from: TRIAGED
        to: FIELD_ACTION_DECIDED
        trigger: "POST /complaints/{id}/field-action"
        actor: QAReleaser
        preconditions:
          - "status is TRIAGED or MALFUNCTION_REPORTED"
          - "X-User-ID differs from the implicated ReagentLot.released_by_user_id"
          - "field_action REMOVAL requires severity == HIGH"
        side_effects:
          - "field_action, field_action_decided_by_user_id and field_action_decided_at stored; status becomes FIELD_ACTION_DECIDED"
          - "when field_action is CORRECTION or REMOVAL, the full recall cascade of state_machines.ReagentLot.RELEASED_to_RECALLED fires (hops 2, 3, 3b, 4)"
          - "increments Complaint.version by 1"
      - from: MALFUNCTION_REPORTED
        to: FIELD_ACTION_DECIDED
        trigger: "POST /complaints/{id}/field-action"
        actor: QAReleaser
        preconditions:
          - "status == MALFUNCTION_REPORTED"
          - "X-User-ID differs from the implicated ReagentLot.released_by_user_id"
        side_effects:
          - "same as the TRIAGED -> FIELD_ACTION_DECIDED transition; the report branch result is preserved"
          - "increments Complaint.version by 1"
      - from: FIELD_ACTION_DECIDED
        to: CLOSED
        trigger: "POST /complaints/{id}/close"
        actor: RegulatoryAffairs
        preconditions:
          - "status is TRIAGED, MALFUNCTION_REPORTED or FIELD_ACTION_DECIDED"
          - "field_action is not null"
          - "when reportable is true, reported_at is not null"
        side_effects:
          - "Complaint.status becomes CLOSED"
          - "increments Complaint.version by 1"
        note: "The join: a reportable complaint can only close once BOTH branches have run, in either order."

  - entity: DistributionOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    shape: branching
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /distribution-orders/{id}/allocate"
        actor: DistributionPlanner
        preconditions:
          - "status == DRAFT"
          - "ProductSpecification.clearance_status == CLEARED"
          - "ship_by >= clock_now"
          - "the FEFO waterfall of calculations.fefo_allocation covers requested_units in full"
        side_effects:
          - "one Allocation row per drawn lot, sequence_index 1..n in FEFO order, each RESERVED"
          - "each drawn ReagentLot has available_units reduced and allocated_units increased by the row's allocated_units"
          - "DistributionOrder.allocated_units, shortfall_units and status updated"
          - "increments DistributionOrder.version by 1"
      - from: DRAFT
        to: PARTIALLY_ALLOCATED
        trigger: "POST /distribution-orders/{id}/allocate with allocation_policy FEFO_WITH_SHORTFALL and an under-covering candidate pool"
        actor: DistributionPlanner
        preconditions:
          - "status == DRAFT"
          - "allocation_policy == FEFO_WITH_SHORTFALL"
          - "ProductSpecification.clearance_status == CLEARED"
        side_effects:
          - "Allocation rows are persisted for whatever the waterfall could draw, possibly zero rows"
          - "DistributionOrder.shortfall_units set to requested_units minus allocated_units"
          - "increments DistributionOrder.version by 1"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /allocations/{id}/ship on the last RESERVED row of the order"
        actor: DistributionPlanner
        preconditions:
          - "status is ALLOCATED or PARTIALLY_ALLOCATED"
          - "no Allocation row of the order is left in status RESERVED after this call"
        side_effects:
          - "DistributionOrder.status becomes SHIPPED"
          - "increments DistributionOrder.version by 1"
      - from: SHIPPED
        to: CLOSED
        trigger: "POST /allocations/{id}/deliver is not exposed; closure is the system cascade fired when every Allocation of the order is DELIVERED"
        actor: system
        preconditions:
          - "status == SHIPPED"
          - "every Allocation of the order has status DELIVERED"
        side_effects:
          - "DistributionOrder.status becomes CLOSED"
      - from: ALLOCATED
        to: PARTIALLY_ALLOCATED
        trigger: "system cascade from a lot recall or from POST /allocations/{id}/cancel"
        actor: system
        preconditions:
          - "status == ALLOCATED"
          - "allocated_units < requested_units after the cascade recompute"
        side_effects:
          - "DistributionOrder.status becomes PARTIALLY_ALLOCATED; allocated_units and shortfall_units recomputed"
          - "increments DistributionOrder.version by 1"

  - entity: Allocation
    initial_state: RESERVED
    terminal_states: [DELIVERED, CANCELLED, QUARANTINED]
    shape: branching
    transitions:
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /allocations/{id}/ship"
        actor: DistributionPlanner
        preconditions:
          - "status == RESERVED"
          - "the drawn ReagentLot.distribution_status == AVAILABLE"
          - "the drawn ReagentLot.expiry_date minus clock_now is at least ProductSpecification.min_shelf_life_days_at_ship days"
        side_effects:
          - "Allocation.status becomes SHIPPED and shipped_at stored"
          - "the lot's allocated_units decreases and shipped_units increases by allocated_units, preserving calculations.reagent_lot_unit_conservation"
          - "the parent order may advance per state_machines.DistributionOrder.ALLOCATED_to_SHIPPED"
          - "increments Allocation.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "system cascade — a cold-chain event whose cumulative verdict is INTACT or EXCURSION_ACCEPTABLE recorded with the delivery flag"
        actor: system
        preconditions:
          - "status == SHIPPED"
          - "cold_chain_status is INTACT or EXCURSION_ACCEPTABLE"
        side_effects:
          - "Allocation.status becomes DELIVERED"
          - "the parent order may advance to CLOSED"
      - from: SHIPPED
        to: QUARANTINED
        trigger: "POST /allocations/{id}/cold-chain-event pushing the cumulative verdict to EXCURSION_REJECTED"
        actor: DistributionPlanner
        preconditions:
          - "status == SHIPPED"
          - "calculations.cold_chain_verdict yields EXCURSION_REJECTED"
        side_effects:
          - "Allocation.status becomes QUARANTINED with quarantine_reason COLD_CHAIN_EXCURSION"
          - "the lot's shipped_units decreases and quarantined_units increases by allocated_units"
          - "the parent DistributionOrder recomputes allocated_units and shortfall_units"
          - "increments Allocation.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /allocations/{id}/cancel"
        actor: DistributionPlanner
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "Allocation.status becomes CANCELLED"
          - "the lot's allocated_units decreases and available_units increases by allocated_units, restoring calculations.reagent_lot_unit_conservation to its pre-allocation values exactly"
          - "the parent DistributionOrder recomputes allocated_units and shortfall_units and may drop to PARTIALLY_ALLOCATED"
          - "increments Allocation.version by 1"
      - from: RESERVED
        to: QUARANTINED
        trigger: "system cascade from state_machines.ReagentLot.RELEASED_to_RECALLED hop 3"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "the drawn ReagentLot.disposition_status == RECALLED"
        side_effects:
          - "Allocation.status becomes QUARANTINED with quarantine_reason RECALL"
          - "the lot's allocated_units decreases and quarantined_units increases by allocated_units"
          - "the parent DistributionOrder recomputes allocated_units and shortfall_units"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version; both entries pass the
# serial-observability filter because a second identical request would itself
# legitimately succeed — several components and several design records per parent
# are normal product behaviour.)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: component-add-stale-reagent-lot
    parent_entity: ReagentLot
    write_endpoint: "POST /reagent-lots/{id}/components"
    occ_field: "expected_reagent_lot_version"
    description: |
      Dispensing a component into a ReagentLot whose version has advanced since
      the client last read the lot is rejected. A lot legitimately accepts many
      components, so the second write is not blocked by any state precondition;
      the stale version is the only signal that the writer's picture of the
      bill of materials (and of the material quantities already drawn) is out
      of date.
    error_id: ERR_STALE_REAGENT_LOT_VERSION
    http_status: 412

  - rule_id: design-record-add-stale-product-spec
    parent_entity: ProductSpecification
    write_endpoint: "POST /design-control-records"
    occ_field: "expected_product_specification_version"
    description: |
      Filing a DesignControlRecord against a ProductSpecification whose version
      has advanced since the client last read it is rejected. A design history
      file legitimately accumulates many records, so nothing in the state
      machine stops the write; the stale version captures the case where another
      record has just been filed or approved and therefore the writer's view of
      the traceability graph, and of design_trace_complete, is out of date.
    error_id: ERR_STALE_PRODUCT_SPEC_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table (15 rules)
# -----------------------------------------------------------------------------
calculations:

  - name: material_lot_acceptance_score
    trigger: "on every POST /test-results with subject_type MATERIAL_LOT (transitions MaterialLot.RECEIVED_to_UNDER_TEST, MaterialLot.UNDER_TEST_to_UNDER_TEST, MaterialLot.OOS_INVESTIGATION_to_UNDER_TEST), writing MaterialLot.acceptance_score"
    algorithm: weighted_scoring
    formula: |
      # input_set: for each code in MaterialSpecification.required_test_codes, the
      # LATEST TestResult on this lot with that test_code, ranked performed_at DESC
      # then created_at DESC; codes with no record are absent from the sum.
      spec = lot.MaterialSpecification
      target_mid = (spec.potency_min_pct + spec.potency_max_pct) / 2
      half_window = spec.potency_max_pct - target_mid          # > 0 by construction

      sub(POTENCY, v)   = 1.0 if spec.potency_min_pct <= v <= spec.potency_max_pct
                          else max(0.0, 1.0 - (outside_by(v) / POTENCY_TOLERANCE_PCT))
                          where outside_by(v) = spec.potency_min_pct - v if v < spec.potency_min_pct
                                                else v - spec.potency_max_pct
      sub(PURITY, v)    = min(1.0, v / 100.0)
      sub(ENDOTOXIN, v) = max(0.0, 1.0 - (v / spec.endotoxin_max_eu_per_ml))
      sub(IDENTITY, v)  = 1.0 if v >= 1.0 else 0.0

      present  = [code in spec.required_test_codes that has a latest TestResult]
      numer    = sum over present of (WEIGHT[code] * sub(code, latest.measured_value))
      denom    = sum over present of WEIGHT[code]          # non-linear: denominator
                                                           # depends on which codes exist
      acceptance_score = round_half_up(100.0 * numer / denom, 2)  # null when present is empty
      any_zero_subscore = TRUE when some code in present has sub(code, v) == 0.0
    input_set: "Latest TestResult per test_code on the MaterialLot, regardless of that record's own outcome; retests replace earlier records because they are later by performed_at."
    constants:
      WEIGHT_POTENCY: 0.45
      WEIGHT_PURITY: 0.30
      WEIGHT_ENDOTOXIN: 0.15
      WEIGHT_IDENTITY: 0.10
      POTENCY_TOLERANCE_PCT: 5.0
      ACCEPTANCE_SCORE_MIN: 85.0
    precision: "2 decimal places, round_half_up; sub-scores are kept unrounded and only the final percentage is rounded"

  - name: test_result_outcome
    trigger: "on every POST /test-results, writing TestResult.outcome for all three subject types"
    algorithm: threshold
    formula: |
      MATERIAL_LOT (bounds from the lot's MaterialSpecification):
        POTENCY   -> PASS iff potency_min_pct <= measured_value <= potency_max_pct
        PURITY    -> PASS iff measured_value >= purity_min_pct
        ENDOTOXIN -> PASS iff measured_value <= endotoxin_max_eu_per_ml
        IDENTITY  -> PASS iff measured_value >= IDENTITY_PASS_MIN
      REAGENT_LOT (bound from the lot's ProductSpecification):
        PASS iff bias_pct <= max_reference_bias_pct
      STABILITY_TIMEPOINT:
        PASS iff recovery_pct >= RECOVERY_FLOOR_PCT
      # Every bound is inclusive; the boundary value passes.
    input_set: "The single record being written, read against the governing specification of its subject; no other TestResult participates."
    constants:
      IDENTITY_PASS_MIN: 1.0
      RECOVERY_FLOOR_PCT: 90.0
    precision: "comparisons at the declared field precision; all bounds inclusive"

  - name: material_lot_acceptance_decision
    trigger: "on POST /material-lots/{id}/disposition with decision QUALIFY (transition MaterialLot.UNDER_TEST_to_QUALIFIED); the decision gates the transition and is not persisted as a field"
    algorithm: threshold
    formula: |
      # Two variants over the SAME TestResult set produce different verdicts.
      ALL_PASS:        ACCEPT iff every code in required_test_codes has a latest
                       TestResult whose outcome == PASS
      WEIGHTED_SCORE:  ACCEPT iff acceptance_score >= ACCEPTANCE_SCORE_MIN
                       AND any_zero_subscore == FALSE
                       (individual FAIL outcomes do NOT block by themselves)
      verdict = ACCEPT | REJECT_CRITERIA_NOT_MET
    input_set: "Latest TestResult per required test_code on the lot; the variant is selected by MaterialSpecification.acceptance_mode, never by the request."
    constants:
      ACCEPTANCE_SCORE_MIN: 85.0
    precision: "score comparison at 2 decimal places; the boundary is inclusive (>=)"
    variants:
      - name: all_pass
        when: "MaterialSpecification.acceptance_mode == ALL_PASS"
        difference: "Any single out-of-bound measurement rejects the lot regardless of how well the other tests scored; acceptance_score stays null."
      - name: weighted_score
        when: "MaterialSpecification.acceptance_mode == WEIGHTED_SCORE"
        difference: "A measurement slightly outside its bound is tolerated when the weighted score still reaches 85.00, so identical measurements that ALL_PASS rejects are QUALIFIED here."

  - name: lot_release_reference_bias
    trigger: "on every POST /test-results with subject_type REAGENT_LOT (transitions ReagentLot.FILLED_to_UNDER_RELEASE_TEST and ReagentLot.UNDER_RELEASE_TEST_to_UNDER_RELEASE_TEST), writing TestResult.bias_pct, ReagentLot.release_bias_max_pct and ReagentLot.release_bias_sum_pct"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each test's bias to 2dp FIRST, then aggregate.
      per_test_bias(t) = round_half_up(abs(t.measured_value - t.reference_measured_value)
                                       / t.reference_measured_value * 100.0, 2)
      input_set = for each code in ProductSpecification.release_test_codes, the LATEST
                  TestResult on this lot with that test_code (performed_at DESC, then
                  created_at DESC); codes without a record are skipped
      release_bias_max_pct = max over input_set of per_test_bias(t)      # null when empty
      release_bias_sum_pct = sum over input_set of per_test_bias(t)      # 0.00 when empty
      # FORBIDDEN alternative that the scaffold explicitly rejects:
      #   round(sum of UNROUNDED per-test biases, 2) — for three tests each with an
      #   unrounded bias of 1.004 this yields 3.01 whereas the pinned order yields 3.00.
    input_set: "Latest REAGENT_LOT TestResult per release test code on the lot; superseded retests are excluded by the ranking, and codes outside release_test_codes never enter."
    constants:
      BIAS_ROUNDING_ORDER: "per_test_then_aggregate"
    precision: "2 decimal places, round_half_up, applied once per test before any aggregation"

  - name: stability_shelf_life
    trigger: "on POST /stability-studies/{id}/conclude (transition StabilityStudy.IN_PROGRESS_to_COMPLETE), writing established_shelf_life_months and shelf_life_method"
    algorithm: threshold
    formula: |
      # last_conforming_month is recomputed on every timepoint record:
      #   the largest m in planned_timepoints_months such that EVERY planned index
      #   p <= m has at least one TestResult with recovery_pct >= RECOVERY_FLOOR_PCT;
      #   null when month 0 itself is missing or non-conforming.
      T_ref = 5.0  if ProductSpecification.storage_condition == TWO_TO_EIGHT_C
              -20.0 if ProductSpecification.storage_condition == MINUS_TWENTY_C

      REAL_TIME variant:
        established_shelf_life_months = min(last_conforming_month,
                                            ProductSpecification.shelf_life_months_claim)
        shelf_life_method = REAL_TIME_LAST_CONFORMING

      ACCELERATED variant:
        acceleration_factor = Q10 ** ((StabilityStudy.storage_temp_c - T_ref) / 10.0)
        established_shelf_life_months = min(floor(last_conforming_month * acceleration_factor),
                                            ProductSpecification.shelf_life_months_claim)
        shelf_life_method = ACCELERATED_Q10
      # Worked divergence, same product and same recovery curve shape:
      #   REAL_TIME  at 5 C, last_conforming_month 9  -> 9 months
      #   ACCELERATED at 37 C, last_conforming_month 2 -> floor(2 * 2**3.2)
      #                                                = floor(18.379173...) = 18 months
    input_set: "TestResult rows with this stability_study_id whose month_index is in planned_timepoints_months; a planned index with no record breaks the conforming prefix."
    constants:
      RECOVERY_FLOOR_PCT: 90.0
      Q10: 2.0
      T_REF_TWO_TO_EIGHT_C: 5.0
      T_REF_MINUS_TWENTY_C: -20.0
    precision: "recovery_pct at 2 decimal places round_half_up; shelf life is an integer number of months, floor after the extrapolation, then capped by the claim"
    variants:
      - name: real_time_last_conforming
        when: "StabilityStudy.study_type == REAL_TIME"
        difference: "Shelf life is read straight off the last conforming timepoint with no extrapolation, so it can never exceed the elapsed protocol."
      - name: accelerated_q10
        when: "StabilityStudy.study_type == ACCELERATED"
        difference: "Shelf life is the last conforming accelerated month multiplied by the Arrhenius-style Q10 factor and floored, which for the same product yields a materially longer life than the real-time study."

  - name: reagent_lot_expiry
    trigger: "on POST /reagent-lots/{id}/disposition with decision RELEASE (transition ReagentLot.UNDER_RELEASE_TEST_to_RELEASED), writing ReagentLot.expiry_date"
    algorithm: projection
    formula: |
      # shelf_life_basis is taken from the request:
      #   CLAIM       -> assigned_shelf_life_months = ProductSpecification.shelf_life_months_claim,
      #                  shelf_life_basis_study_id = null
      #   REAL_TIME   -> the selected study is the StabilityStudy on this
      #                  product_specification_id with study_type REAL_TIME and status
      #                  COMPLETE, ranked established_shelf_life_months DESC, tie-break
      #                  created_at ASC; assigned_shelf_life_months = its
      #                  established_shelf_life_months
      #   ACCELERATED -> same selector with study_type ACCELERATED
      # Empty candidate set for REAL_TIME/ACCELERATED -> ERR_STABILITY_DATA_MISSING.
      expiry_date = fill_completed_at + assigned_shelf_life_months calendar months,
                    keeping the day-of-month and clamping to the last day of the target
                    month when the source day does not exist there, keeping the
                    time-of-day and the .000 millisecond precision
    input_set: "COMPLETE StabilityStudy rows on the same product_specification_id with the requested study_type; ReagentLot.fill_completed_at as the anchor."
    constants:
      MONTH_ARITHMETIC: "calendar_months_with_end_of_month_clamp"
    precision: "ISO 8601 UTC with three fractional digits"

  - name: fefo_allocation
    trigger: "on POST /distribution-orders/{id}/allocate (transitions DistributionOrder.DRAFT_to_ALLOCATED and DistributionOrder.DRAFT_to_PARTIALLY_ALLOCATED), writing Allocation rows plus allocated_units / shortfall_units on both the order and each drawn lot"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER — the persist/reject decision depends on an aggregate
      # of the very allocation being computed, so the order is fixed in four phases:
      #   phase 1 (candidate set), phase 2 (rank), phase 3 (dry-run waterfall over an
      #   in-memory copy of available_units), phase 4 (policy gate, then persist).
      floor_days = max(order.required_min_shelf_life_days,
                       ProductSpecification.min_shelf_life_days_at_ship)
      remaining_days(lot) = floor((lot.expiry_date - clock_now) / 86400 seconds)

      phase 1 eligibility (candidate set):
        lot.product_specification_id == order.product_specification_id
        AND lot.disposition_status == RELEASED
        AND lot.distribution_status == AVAILABLE
        AND lot.available_units > 0
        AND remaining_days(lot) >= floor_days          # inclusive boundary
      phase 2 ranking: expiry_date ASC; tie-break created_at ASC (never id)
      phase 3 waterfall: need = order.requested_units
        for each candidate in ranked order while need > 0:
          take = min(need, candidate.available_units)
          record (candidate, take) with sequence_index 1,2,3,... in draw order
          need = need - take
        drawn_total = requested_units - need
      phase 4 policy gate:
        if need > 0 and order.allocation_policy == FEFO_STRICT:
            reject with ERR_ALLOCATION_SHORTFALL; NOTHING is persisted and the order
            stays DRAFT with allocated_units 0
        else:
            persist one RESERVED Allocation per recorded pair (zero rows allowed),
            order.allocated_units = drawn_total,
            order.shortfall_units = max(0, requested_units - drawn_total),
            order.status = ALLOCATED when need == 0 else PARTIALLY_ALLOCATED
    input_set: "ReagentLot rows of the same product with disposition_status RELEASED and distribution_status AVAILABLE; WITHHELD, BLOCKED, REJECTED and RECALLED lots never enter the pool, and neither do lots whose remaining shelf life is below floor_days."
    constants:
      SECONDS_PER_DAY: 86400
      REMAINING_DAYS_ROUNDING: "floor"
    precision: "integer units; remaining shelf life floored to whole days"

  - name: environmental_state
    trigger: "on every POST /fill-runs/{id}/samples (transition FillRun.SCHEDULED_to_SCHEDULED), writing MonitoringSample.limit_value / excursion / excursion_grade and FillRun.minor_excursion_count / major_excursion_count / bioburden_cfu_per_ml / environmental_state plus ReagentLot.em_excursion_count"
    algorithm: threshold
    formula: |
      limit_value  = LIMIT[sample_type]
      excursion    = result_value > limit_value                # equality is CONFORMING
      grade        = MAJOR if result_value >= 2.0 * limit_value
                     else MINOR if excursion
                     else NONE
      minor_excursion_count = count of this run's samples with grade MINOR
      major_excursion_count = count of this run's samples with grade MAJOR
      bioburden_cfu_per_ml  = max result_value over this run's BIOBURDEN_BULK samples
      environmental_state   = DISQUALIFIED if major_excursion_count >= 1
                                            or minor_excursion_count >= MINOR_DISQUALIFY_COUNT
                              else EXCURSION if minor_excursion_count >= 1
                              else CONFORMING
      ReagentLot.em_excursion_count = count of samples with excursion true across all
                                     FillRun rows of the lot
    input_set: "All MonitoringSample rows of the FillRun, including samples recorded while the run was still SCHEDULED; aborted runs keep their samples but no longer contribute to a lot disposition."
    constants:
      LIMIT_VIABLE_AIR_CFU_PER_M3: 10.0
      LIMIT_SURFACE_CFU: 5.0
      LIMIT_NONVIABLE_PARTICLES_PER_M3: 3520.0
      LIMIT_BIOBURDEN_CFU_PER_ML: 10.0
      MINOR_DISQUALIFY_COUNT: 3
    precision: "result_value compared as declared, no rounding; counts are integers"

  - name: complaint_reportability
    trigger: "on POST /complaints/{id}/triage (transition Complaint.RECEIVED_to_TRIAGED), writing reportable and report_due_at; report_late is written on POST /complaints/{id}/malfunction-report"
    algorithm: threshold
    formula: |
      reportable = malfunction_suspected AND (device_related_death_or_injury
                                              OR severity == HIGH)
      report_due_days = DEATH_OR_INJURY_DUE_DAYS if device_related_death_or_injury
                        else MALFUNCTION_DUE_DAYS
      report_due_at = received_at + report_due_days days   # null when reportable is false
      report_late   = reported_at > report_due_at          # strict >, equality is on time
    input_set: "The complaint's own triage fields plus received_at stamped from the logical clock at intake."
    constants:
      DEATH_OR_INJURY_DUE_DAYS: 5
      MALFUNCTION_DUE_DAYS: 30
    precision: "instant arithmetic in whole days, ISO 8601 UTC with three fractional digits"

  - name: design_trace_completeness
    trigger: "on POST /design-control-records and on POST /design-control-records/{id}/approve (transition DesignControlRecord.DRAFT_to_APPROVED), writing DesignControlRecord.trace_depth and ProductSpecification.design_trace_complete"
    algorithm: topological
    formula: |
      trace_depth(r) = 1 if r.record_type == DESIGN_INPUT
                       else trace_depth(record r.traces_to_record_id) + 1
      # The predecessor type is fixed, which makes cycles unreachable:
      #   DESIGN_OUTPUT             must trace to a DESIGN_INPUT   (depth 2)
      #   VERIFICATION, VALIDATION  must trace to a DESIGN_OUTPUT  (depth 3)
      design_trace_complete =
          (count of records on this spec with status APPROVED, record_type VERIFICATION
           and trace_depth == 3) >= 1
        AND
          (count of records on this spec with status APPROVED, record_type VALIDATION
           and trace_depth == 3) >= 1
      # every ancestor of a depth-3 record must itself be APPROVED, which the
      # DRAFT_to_APPROVED precondition enforces one hop at a time
    input_set: "DesignControlRecord rows with this product_specification_id in status APPROVED; DRAFT and SUPERSEDED rows are excluded."
    constants:
      REQUIRED_TRACE_DEPTH: 3
    precision: "integer depths; the flag is boolean"

  - name: bridging_requirement
    trigger: "recomputed on POST /reagent-lots/{id}/components and on POST /fill-runs/{id}/complete (transition ReagentLot.IN_PROCESS_to_FILLED), writing ReagentLot.bridging_required"
    algorithm: constraint_propagation
    formula: |
      # predicate lot selector: among ReagentLot rows with the same
      # product_specification_id, id != this lot, and disposition_status == RELEASED,
      # rank released_at DESC, tie-break created_at DESC; take the first.
      predicate = that lot, or NONE
      if predicate is NONE:
          bridging_required = FALSE        # first commercial lot needs no bridge
      else:
          critical_components = LotComponent rows of THIS lot with status CONSUMED whose
                                MaterialLot's MaterialSpecification.is_critical == TRUE
          bridging_required = TRUE iff there exists c in critical_components such that
              (a) the predicate lot has no CONSUMED LotComponent with the same
                  component_role, OR
              (b) that predicate component's vendor_lot_code_snapshot !=
                  c.vendor_lot_code_snapshot
    input_set: "CONSUMED LotComponent rows of this lot and of the predicate lot, compared by component_role on the snapshot fields so later specification or vendor edits cannot change the verdict."
    constants:
      COMPARISON_KEY: "component_role"
    precision: "boolean"

  - name: bridging_equivalence
    trigger: "recomputed on POST /test-results with subject_type REAGENT_LOT for either linked lot and on POST /bridging-studies; read by POST /bridging-studies/{id}/decision (transitions BridgingStudy.DRAFT_to_APPROVED and BridgingStudy.DRAFT_to_FAILED), writing mean_bias_pct, max_bias_pct and equivalence_verdict"
    algorithm: aggregation
    formula: |
      for each code in paired_test_codes:
          pred = latest REAGENT_LOT TestResult on predicate_lot_id with that test_code
                 (performed_at DESC, tie created_at DESC)
          cand = latest REAGENT_LOT TestResult on candidate_lot_id with that test_code
          if pred or cand is missing: equivalence_verdict = PENDING and stop
          paired_bias(code) = round_half_up(abs(cand.measured_value - pred.measured_value)
                                            / pred.measured_value * 100.0, 2)
      max_bias_pct  = max over codes of paired_bias(code)
      mean_bias_pct = round_half_up(sum of the ROUNDED paired_bias values / count, 2)
      equivalence_verdict = EQUIVALENT if mean_bias_pct <= MEAN_BIAS_MAX_PCT
                                          and max_bias_pct <= MAX_BIAS_MAX_PCT
                            else NOT_EQUIVALENT
    input_set: "Latest REAGENT_LOT TestResult per paired code on each of the two lots; the reference_measured_value column is ignored here because the comparison is lot against lot."
    constants:
      MEAN_BIAS_MAX_PCT: 3.0
      MAX_BIAS_MAX_PCT: 5.0
    precision: "2 decimal places, round_half_up per code before the mean, then once more on the mean"

  - name: material_quantity_conservation
    trigger: "asserted after POST /reagent-lots/{id}/components (forward) and after POST /fill-runs/{id}/abort (compensating, transition ReagentLot.IN_PROCESS_to_PLANNED hop 4)"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1 — raw material units.
      MaterialLot.consumed_quantity_units  = sum of quantity_used over LotComponent rows
                                             with this material_lot_id and status CONSUMED
      MaterialLot.available_quantity_units = received_quantity_units
                                             - consumed_quantity_units
      INVARIANT (must hold after every request, cascades included):
        received_quantity_units == available_quantity_units + consumed_quantity_units
      # A component add moves X units from available to consumed; the abort cascade
      # flips the row to RETURNED and moves exactly X back, so the invariant returns
      # to its pre-add values with zero drift.
    input_set: "LotComponent rows of the material lot with status CONSUMED; RETURNED rows are excluded from consumed_quantity_units but are never deleted."
    constants:
      REJECTED_LOT_AVAILABLE_UNITS: 0
    precision: "quantities carry 2 decimal places, round_half_up, and are never rounded again once stored"

  - name: reagent_lot_unit_conservation
    trigger: "asserted after POST /fill-runs/{id}/complete, POST /distribution-orders/{id}/allocate (forward), POST /allocations/{id}/ship, POST /allocations/{id}/cancel (compensating) and the recall cascade of state_machines.ReagentLot.RELEASED_to_RECALLED"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2 — finished-goods units.
      allocated_units   = sum of Allocation.allocated_units where status == RESERVED
      shipped_units     = sum of Allocation.allocated_units where status in {SHIPPED, DELIVERED}
      quarantined_units = sum of Allocation.allocated_units where status == QUARANTINED
      available_units   = filled_units - allocated_units - shipped_units - quarantined_units
      INVARIANT (must hold after every request, cascades included):
        filled_units == available_units + allocated_units + shipped_units + quarantined_units
      # CANCELLED rows contribute to no bucket, which is what makes cancel an exact
      # compensation of allocate: the units land back in available_units.
    input_set: "Allocation rows of the lot in every status; CANCELLED rows are excluded from all four buckets."
    constants:
      REJECTED_LOT_AVAILABLE_UNITS: 0
    precision: "integer units"

  - name: cold_chain_verdict
    trigger: "on POST /allocations/{id}/cold-chain-event, writing cumulative_excursion_minutes, max_excursion_temp_c and cold_chain_status (transition Allocation.SHIPPED_to_QUARANTINED when the verdict is EXCURSION_REJECTED)"
    algorithm: aggregation
    formula: |
      cumulative_excursion_minutes = sum of excursion_minutes over all cold-chain events
                                     recorded against this allocation
      max_excursion_temp_c         = max of max_temp_c over those events
      cold_chain_status =
          EXCURSION_REJECTED  if max_excursion_temp_c > HARD_TEMP_LIMIT_C
                                 or cumulative_excursion_minutes > CUMULATIVE_MINUTES_LIMIT
          else EXCURSION_ACCEPTABLE if cumulative_excursion_minutes > 0
          else INTACT
    input_set: "Every cold-chain event recorded on the allocation, cumulative across calls; the limits come from the constants below and not from the product specification."
    constants:
      HARD_TEMP_LIMIT_C: 15.0
      CUMULATIVE_MINUTES_LIMIT: 240
    precision: "minutes as declared with 2 decimal places, temperatures with 1 decimal place; both comparisons are strict >"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# single request violates several rules)
# -----------------------------------------------------------------------------
validations:

  # --- 10-30 protocol layer -----------------------------------------------
  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "X-User-Role is one of the six declared roles AND is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 30
    category: business_constraint
    check: "Request body parses; every required input field is present; enums are declared members; numeric bounds hold (received_quantity_units > 0, quantity_used > 0, requested_units > 0, potency_min_pct < potency_max_pct, scheduled_end > scheduled_start, protocol_end > protocol_start, required_min_shelf_life_days >= 0, result_value >= 0, reference_measured_value > 0); pagination limit is 1..100 and offset >= 0; planned_timepoints_months is strictly increasing and starts at 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 35
    category: business_constraint
    check: "POST /test-results carries exactly the subject fields its subject_type demands: MATERIAL_LOT requires material_lot_id and forbids reagent_lot_id, stability_study_id, month_index and reference_measured_value; REAGENT_LOT requires reagent_lot_id and reference_measured_value and forbids the other subject ids; STABILITY_TIMEPOINT requires stability_study_id and month_index and forbids the other subject ids"
    error_id: ERR_SUBJECT_FIELD_MISMATCH
    http_status: 400
    applies_to: "POST /test-results"

  # --- 40-45 existence, validated left-to-right ---------------------------
  - priority: 40
    category: existence
    check: "Every id in the path exists, validated left to right"
    error_id: "ERR_MATERIAL_SPECIFICATION_NOT_FOUND | ERR_MATERIAL_LOT_NOT_FOUND | ERR_PRODUCT_SPECIFICATION_NOT_FOUND | ERR_DESIGN_CONTROL_RECORD_NOT_FOUND | ERR_REAGENT_LOT_NOT_FOUND | ERR_FILL_RUN_NOT_FOUND | ERR_STABILITY_STUDY_NOT_FOUND | ERR_BRIDGING_STUDY_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_DISTRIBUTION_ORDER_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_TEST_RESULT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 45
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, validated in the field order declared in §1.1"
    error_id: "ERR_MATERIAL_SPECIFICATION_NOT_FOUND | ERR_MATERIAL_LOT_NOT_FOUND | ERR_PRODUCT_SPECIFICATION_NOT_FOUND | ERR_DESIGN_CONTROL_RECORD_NOT_FOUND | ERR_REAGENT_LOT_NOT_FOUND | ERR_STABILITY_STUDY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /material-lots, POST /product-specifications is FK-free, POST /design-control-records, POST /reagent-lots, POST /reagent-lots/{id}/components, POST /fill-runs, POST /test-results, POST /stability-studies, POST /bridging-studies, POST /complaints, POST /distribution-orders"

  # --- 50 segregation of duties -------------------------------------------
  - priority: 50
    category: business_safety
    check: "The acting X-User-ID has not already taken the incompatible step: on POST /reagent-lots/{id}/disposition it must differ from performed_by_user_id of every REAGENT_LOT TestResult on the lot; on POST /complaints/{id}/field-action it must differ from the implicated ReagentLot.released_by_user_id; on POST /design-control-records/{id}/approve it must differ from that record's authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reagent-lots/{id}/disposition, POST /complaints/{id}/field-action, POST /design-control-records/{id}/approve"

  # --- 60 state preconditions ---------------------------------------------
  - priority: 60
    category: state
    check: "The target resource is in a state from which the requested transition exists, per §1.2; for ReagentLot the relevant dimension is checked (disposition_status for quality operations, distribution_status for availability operations)"
    error_id: "ERR_MATERIAL_LOT_STATE_INVALID | ERR_PRODUCT_STATE_INVALID | ERR_DESIGN_RECORD_STATE_INVALID | ERR_REAGENT_LOT_STATE_INVALID | ERR_FILL_RUN_STATE_INVALID | ERR_STABILITY_STUDY_STATE_INVALID | ERR_BRIDGING_STUDY_STATE_INVALID | ERR_COMPLAINT_STATE_INVALID | ERR_ORDER_STATE_INVALID | ERR_ALLOCATION_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint"

  # --- 65 optimistic concurrency ------------------------------------------
  - priority: 65
    category: state
    check: "expected_reagent_lot_version equals ReagentLot.version on POST /reagent-lots/{id}/components; expected_product_specification_version equals ProductSpecification.version on POST /design-control-records"
    error_id: "ERR_STALE_REAGENT_LOT_VERSION | ERR_STALE_PRODUCT_SPEC_VERSION"
    http_status: 412
    applies_to: "POST /reagent-lots/{id}/components, POST /design-control-records"

  # --- 70 uniqueness -------------------------------------------------------
  - priority: 70
    category: business_constraint
    check: "Scoped uniqueness holds: material_code across MaterialSpecification; product_code across ProductSpecification; (material_specification_id, vendor_lot_code) across MaterialLot; (product_specification_id, lot_code) across ReagentLot; (stability_study_id, month_index, test_code) across TestResult"
    error_id: "ERR_DUPLICATE_MATERIAL_CODE | ERR_DUPLICATE_PRODUCT_CODE | ERR_DUPLICATE_VENDOR_LOT | ERR_DUPLICATE_LOT_CODE | ERR_DUPLICATE_TIMEPOINT"
    http_status: 409
    applies_to: "POST /material-specifications, POST /product-specifications, POST /material-lots, POST /reagent-lots, POST /test-results"

  # --- 75-96 safety / compliance layer (before temporal, constraint and
  #     fiscal layers: a regulated product never trades quality for capacity)
  - priority: 75
    category: business_safety
    check: "The MaterialLot named by material_lot_id has qualification_status QUALIFIED"
    error_id: ERR_MATERIAL_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/components"

  - priority: 76
    category: business_temporal
    check: "The MaterialLot's expiry_date is strictly after the logical clock at the moment of dispensing"
    error_id: ERR_MATERIAL_EXPIRED
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/components"

  - priority: 78
    category: business_fiscal
    check: "quantity_used <= MaterialLot.available_quantity_units"
    error_id: ERR_INSUFFICIENT_MATERIAL
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/components"

  - priority: 80
    category: business_safety
    check: "No FillRun of the lot has environmental_state DISQUALIFIED"
    error_id: ERR_ENVIRONMENTAL_NONCONFORMANCE
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/disposition with decision RELEASE"

  - priority: 82
    category: business_safety
    check: "Every code in ProductSpecification.release_test_codes has a TestResult on the lot whose outcome is PASS"
    error_id: ERR_RELEASE_TESTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/disposition with decision RELEASE"

  - priority: 84
    category: business_safety
    check: "ReagentLot.release_bias_max_pct <= ProductSpecification.max_reference_bias_pct"
    error_id: ERR_REFERENCE_BIAS_EXCEEDED
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/disposition with decision RELEASE"

  - priority: 86
    category: business_referential
    check: "Every code in ProductSpecification.required_material_codes appears as the material_code_snapshot of a LotComponent of this lot with status CONSUMED"
    error_id: ERR_BOM_INCOMPLETE
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/disposition with decision RELEASE"

  - priority: 88
    category: business_safety
    check: "When ReagentLot.bridging_required is true, a BridgingStudy with candidate_lot_id equal to this lot exists in status APPROVED"
    error_id: ERR_BRIDGING_REQUIRED
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/disposition with decision RELEASE"

  - priority: 90
    category: business_referential
    check: "When shelf_life_basis is REAL_TIME or ACCELERATED, a StabilityStudy on this product_specification_id with that study_type, status COMPLETE and a non-null established_shelf_life_months exists"
    error_id: ERR_STABILITY_DATA_MISSING
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/disposition with decision RELEASE"

  - priority: 92
    category: business_safety
    check: "calculations.material_lot_acceptance_decision returns ACCEPT under the specification's acceptance_mode, and every required test code has a recorded TestResult"
    error_id: ERR_ACCEPTANCE_CRITERIA_NOT_MET
    http_status: 409
    applies_to: "POST /material-lots/{id}/disposition with decision QUALIFY"

  - priority: 94
    category: business_referential
    check: "ProductSpecification.design_trace_complete is true"
    error_id: ERR_DESIGN_TRACE_INCOMPLETE
    http_status: 409
    applies_to: "POST /product-specifications/{id}/clearance"

  - priority: 95
    category: business_safety
    check: "A reportable complaint has reported_at set before it may close"
    error_id: ERR_MALFUNCTION_REPORT_PENDING
    http_status: 409
    applies_to: "POST /complaints/{id}/close"

  - priority: 96
    category: business_safety
    check: "field_action REMOVAL requires severity HIGH; a field action requires the complaint to have been triaged"
    error_id: ERR_FIELD_ACTION_NOT_JUSTIFIED
    http_status: 409
    applies_to: "POST /complaints/{id}/field-action"

  # --- 100-110 temporal / resource-overlap layer --------------------------
  - priority: 100
    category: business_temporal
    check: "No other FillRun on the same line_code in status SCHEDULED or RUNNING overlaps the requested CLOSED interval once inflated by the 120-minute changeover buffer: conflict iff new_start < existing_end + 120min AND existing_start < new_end + 120min"
    error_id: ERR_FILL_LINE_CONFLICT
    http_status: 409
    applies_to: "POST /fill-runs"

  - priority: 102
    category: business_temporal
    check: "At most 2 StabilityStudy rows in status PROTOCOL_DRAFT, APPROVED or IN_PROGRESS may occupy the same chamber_code over any instant of the requested HALF-OPEN [protocol_start, protocol_end) interval; a study starting exactly when another ends does not overlap"
    error_id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /stability-studies"

  - priority: 104
    category: business_temporal
    check: "A retest is recorded no later than first_oos_at plus MaterialSpecification.retest_window_days days; the boundary instant is still inside the window"
    error_id: ERR_RETEST_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /test-results with is_retest true"

  - priority: 106
    category: business_constraint
    check: "MaterialLot.retest_count < MaterialSpecification.max_retests before the retest is accepted"
    error_id: ERR_MAX_RETESTS_EXCEEDED
    http_status: 409
    applies_to: "POST /test-results with is_retest true"

  - priority: 108
    category: business_temporal
    check: "DistributionOrder.ship_by is not earlier than the logical clock"
    error_id: ERR_SHIP_BY_PASSED
    http_status: 409
    applies_to: "POST /distribution-orders/{id}/allocate"

  - priority: 110
    category: business_temporal
    check: "At shipping, the drawn lot's remaining shelf life in whole days is at least ProductSpecification.min_shelf_life_days_at_ship"
    error_id: ERR_SHELF_LIFE_TOO_SHORT
    http_status: 409
    applies_to: "POST /allocations/{id}/ship"

  # --- 115-127 structural-constraint layer --------------------------------
  - priority: 115
    category: business_referential
    check: "traces_to_record_id is null exactly when record_type is DESIGN_INPUT; a DESIGN_OUTPUT traces to a DESIGN_INPUT; a VERIFICATION or VALIDATION traces to a DESIGN_OUTPUT; the predecessor belongs to the same product_specification_id"
    error_id: ERR_INVALID_TRACE_LINK
    http_status: 422
    applies_to: "POST /design-control-records"

  - priority: 117
    category: business_referential
    check: "test_code is a member of MaterialSpecification.required_test_codes for MATERIAL_LOT subjects and of ProductSpecification.release_test_codes for REAGENT_LOT subjects"
    error_id: ERR_TEST_CODE_NOT_IN_SPEC
    http_status: 422
    applies_to: "POST /test-results"

  - priority: 121
    category: business_referential
    check: "month_index is a member of StabilityStudy.planned_timepoints_months"
    error_id: ERR_TIMEPOINT_NOT_PLANNED
    http_status: 422
    applies_to: "POST /test-results with subject_type STABILITY_TIMEPOINT"

  - priority: 123
    category: business_referential
    check: "component_role equals the material_type of the dispensed lot's MaterialSpecification AND that specification's material_code is a member of ProductSpecification.required_material_codes"
    error_id: ERR_COMPONENT_ROLE_NOT_IN_BOM
    http_status: 422
    applies_to: "POST /reagent-lots/{id}/components"

  - priority: 125
    category: business_referential
    check: "Every code in paired_test_codes has a latest REAGENT_LOT TestResult on both the predicate and the candidate lot, so equivalence_verdict is not PENDING"
    error_id: ERR_PAIRED_DATA_MISSING
    http_status: 422
    applies_to: "POST /bridging-studies/{id}/decision with decision APPROVE"

  - priority: 127
    category: business_safety
    check: "equivalence_verdict is EQUIVALENT before a bridging study may be approved"
    error_id: ERR_NOT_EQUIVALENT
    http_status: 409
    applies_to: "POST /bridging-studies/{id}/decision with decision APPROVE"

  # --- 130 referential gate on the product --------------------------------
  - priority: 130
    category: business_referential
    check: "ProductSpecification.clearance_status is CLEARED"
    error_id: ERR_PRODUCT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /reagent-lots/{id}/disposition with decision RELEASE, POST /distribution-orders/{id}/allocate"

  # --- 140 fiscal / capacity gate, evaluated last -------------------------
  - priority: 140
    category: business_fiscal
    check: "Under FEFO_STRICT the ranked candidate pool covers requested_units in full; a shortfall rejects the whole allocation and persists nothing"
    error_id: ERR_ALLOCATION_SHORTFALL
    http_status: 409
    applies_to: "POST /distribution-orders/{id}/allocate"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table (60 endpoints; every path root-relative)
# ALL_ROLES below is shorthand for the six §1.7 roles and is written out in full
# on every endpoint that grants it.
# -----------------------------------------------------------------------------
endpoints:

  # --- test-driving clock (§1.5 priority ladder rung 3) --------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to any instant, so deadline, expiry, retest-window and shelf-life rules are deterministic. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [QCAnalyst, ProductionOperator, QAReleaser, RegulatoryAffairs, DistributionPlanner, PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["every subsequent system-stamped instant and every clock_now comparison uses this value"]

  # --- MaterialSpecification ----------------------------------------------
  - method: POST
    path: "/material-specifications"
    description: "Registers the acceptance specification for one raw material"
    roles: [RegulatoryAffairs, PlatformAdmin]
    code: 201
    input: [material_code, material_type, potency_min_pct, potency_max_pct, endotoxin_max_eu_per_ml, purity_min_pct, required_test_codes, "is_critical?", "acceptance_mode?", "max_retests?", "retest_window_days?"]
    output: MaterialSpecification
    side_effects: ["no cross-entity effect; acceptance_mode fixes which variant of calculations.material_lot_acceptance_decision governs every lot of this material"]

  - method: GET
    path: "/material-specifications/{id}"
    description: "Reads one raw material specification"
    roles: [QCAnalyst, ProductionOperator, QAReleaser, RegulatoryAffairs, DistributionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: MaterialSpecification
    side_effects: []

  - method: GET
    path: "/material-specifications"
    description: "Lists raw material specifications"
    roles: [QCAnalyst, ProductionOperator, QAReleaser, RegulatoryAffairs, DistributionPlanner, PlatformAdmin]
    code: 200
    input: ["material_type?", "is_critical?", "limit?", "offset?"]
    output: MaterialSpecification[]
    side_effects: []

  # --- MaterialLot --------------------------------------------------------
  - method: POST
    path: "/material-lots"
    description: "Books an incoming vendor lot in at goods-in, in state RECEIVED"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [material_specification_id, vendor_lot_code, received_quantity_units, expiry_date]
    output: MaterialLot
    side_effects: ["available_quantity_units initialised to received_quantity_units and consumed_quantity_units to 0, satisfying calculations.material_quantity_conservation"]

  - method: GET
    path: "/material-lots/{id}"
    description: "Reads one raw material lot with its quantities, acceptance_score and qualification_status"
    roles: [QCAnalyst, ProductionOperator, QAReleaser, RegulatoryAffairs, DistributionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: MaterialLot
