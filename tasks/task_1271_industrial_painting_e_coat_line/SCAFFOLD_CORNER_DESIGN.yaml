      - name: voc_metered_rounding_three_decimals
        claim_type: precision
        grounds: [calculations.voc_emission_metered, entities.EmissionEntry.fields.voc_kg]
        distinguishing_aspect: "0.47 L × 320 g/L = 0.1504 kg rounds to 0.150 (3 decimals, round_half_up) — sub-thousandth precision pinned."
        test_recipe:
          setup: ["full pipeline: lot RUNNING, permit cap 500.0"]
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
