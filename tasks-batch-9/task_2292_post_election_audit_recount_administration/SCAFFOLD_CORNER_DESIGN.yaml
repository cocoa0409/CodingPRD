              payload: { audit_batch_id: "${ab4_id}", tally_team_id: "${t1_id}", session_start_at: "2026-11-05T11:00:00Z", session_end_at: "2026-11-05T13:00:00Z", counted_votes: { ALVAREZ: 522, BRENNAN: 478 }, ambiguous_ballot_count: 0, no_vote_count: 0 }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
              captures: { mt2_id: "$.data.id" }
            - call: "POST /manual-tallies/${mt2_id}/submit"
              payload: { }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
              captures: { net2: "$.data.net_error_votes" }
            - call: "GET /audit-rounds/${r1_id}"
              payload: { }
              as: AuditManager
              captures: { m2: "$.data.round_measure", cb2: "$.data.counted_ballots", st2: "$.data.status", cn2: "$.data.cumulative_net_error_votes" }
          assert:
            - "${net1} == 4 and ${m1} == 0.0040 with ${cb1} == 1000 and ${st1} == TALLYING"
            - "after the first submit Audit.${a1_id}.status == TALLYING and Election.${e1_id}.certification_risk_flag == false"
            - "${net2} == 6 and ${cn2} == 10 with ${cb2} == 2000"
            - "${m2} == 0.0050 and ${st2} == REVIEW_REQUIRED (the comparison is inclusive)"
            - "Audit.${a1_id}.status == DISCREPANCY_REVIEW with discrepancy_measure == 0.0050"
            - "Election.${e1_id}.certification_risk_flag == true"
            - "GET /discrepancies?status=OPEN returns total_count == 2 with magnitude_votes 4 and 6"
      - name: derived_counters_reconcile_after_create_change_and_removal
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Election.fields.open_recount_count
          - entities.Election.fields.open_audit_count
          - entities.Contest.fields.open_recount_count
          - endpoints.POST_/recounts/{id}/deny
        distinguishing_aspect: |
          The three roll-up counters are re-derived from their source rows at every write rather than
          incremented blindly: filing two recounts and two audits raises them to 2, a withdrawal and a denial
          bring the recount counters back to 0 through different terminal states, and terminating both audits
          returns open_audit_count to 0 with no drift in either direction.
        test_recipe:
          setup:
            - "Election ST-01 with contest C1 (6000 ballots, six batches) canvassed 3150 / 2850 and contest C2"
            - "(2000 ballots, no batches) canvassed 1050 / 950, so both are eligible for a candidate request"
            - "and the election is CANVASSED with every counter at 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C2", office_name: "State Treasurer", contest_type: "CANDIDATE", candidate_names: ["CHEN", "DAVIS"], ballots_cast: 2000 }
              as: ElectionsDirector
              captures: { c2_id: "$.data.id" }
            - call: "POST /contests/${c2_id}/canvass-results"
              payload: { reported_votes: { CHEN: 1050, DAVIS: 950 } }
              as: ElectionsDirector
              captures: { c2_v: "$.data.version" }
            - call: "GET /elections/${e1_id}"
              payload: { }
              as: ElectionsDirector
              captures: { n0: "$.data.open_recount_count", a0: "$.data.open_audit_count" }
          trigger:
            - call: "POST /recounts"
              payload: { contest_id: "${c1_id}", expected_contest_version: "${c1_v}", trigger_type: "CANDIDATE_REQUESTED", scope: "FULL_CONTEST", requested_by_candidate_name: "BRENNAN" }
              as: CandidateRepresentative
              as_user_id: "u-cand-1"
              captures: { rc1_id: "$.data.id" }
            - call: "POST /recounts"
              payload: { contest_id: "${c2_id}", expected_contest_version: "${c2_v}", trigger_type: "CANDIDATE_REQUESTED", scope: "FULL_CONTEST", requested_by_candidate_name: "DAVIS" }
              as: CandidateRepresentative
              as_user_id: "u-cand-2"
              captures: { rc2_id: "$.data.id" }
            - call: "GET /elections/${e1_id}"
              payload: { }
              as: ElectionsDirector
              captures: { n1: "$.data.open_recount_count" }
            - call: "POST /recounts/${rc1_id}/withdraw"
              payload: { reason: "Margin accepted" }
              as: CandidateRepresentative
              as_user_id: "u-cand-1"
            - call: "POST /recounts/${rc2_id}/deny"
              payload: { denial_reason: "Filed by an unauthorised representative" }
              as: ElectionsDirector
              captures: { rc2_st: "$.data.status" }
            - call: "GET /elections/${e1_id}"
              payload: { }
              as: ElectionsDirector
              captures: { n2: "$.data.open_recount_count" }
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "RISK_LIMITING", risk_limit_alpha: 0.05 }
              as: AuditManager
              captures: { aa_id: "$.data.id" }
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "FIXED_PERCENTAGE", fixed_percentage_pct: 5 }
              as: AuditManager
              captures: { ab_id: "$.data.id" }
            - call: "GET /elections/${e1_id}"
              payload: { }
              as: ElectionsDirector
              captures: { a1c: "$.data.open_audit_count" }
            - call: "POST /audits/${aa_id}/terminate"
              payload: { terminated_reason: "Superseded" }
              as: ElectionsDirector
            - call: "GET /elections/${e1_id}"
              payload: { }
              as: ElectionsDirector
              captures: { a2c: "$.data.open_audit_count" }
            - call: "POST /audits/${ab_id}/terminate"
              payload: { terminated_reason: "Superseded" }
              as: ElectionsDirector
            - call: "GET /elections/${e1_id}"
              payload: { }
              as: ElectionsDirector
              captures: { a3c: "$.data.open_audit_count" }
          assert:
            - "${n0} == 0 and ${a0} == 0"
            - "${n1} == 2 with Contest.${c1_id}.open_recount_count == 1 and Contest.${c2_id}.open_recount_count == 1"
            - "${rc2_st} == DENIED and Recount.${rc1_id}.status == WITHDRAWN"
            - "${n2} == 0 with Contest.${c1_id}.open_recount_count == 0 and Contest.${c2_id}.open_recount_count == 0"
            - "${a1c} == 2, ${a2c} == 1 and ${a3c} == 0"
            - "Election.${e1_id}.status == CANVASSED and certification_risk_flag == false"
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_value_is_visible_in_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ManualTally.DRAFT_to_SUBMITTED
          - calculations.tally_discrepancy_measure
        distinguishing_aspect: |
          Consistency is immediate, so the submit response itself already carries the recomputed measures
          rather than leaving them for a later read: the same values are then returned by the round, audit,
          election and discrepancy reads that follow with no clock advance and no retry.
        test_recipe:
          setup:
            - "E1 with READY team T-1, audit A1 (RISK_LIMITING, alpha 0.05) seeded 0459231087 drawing B-003,"
            - "B-004, B-005, B-003 checked out and a DRAFT count of 522 / 478 open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
