          trigger:
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Calltaker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"

      - name: dispatcher_cannot_close_incident_forbidden
        claim_type: role_denied
        grounds:
          - roles.Dispatcher
          - roles.Supervisor
          - "endpoints.POST_/incidents/{id}/dispositions"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "A Dispatcher calling POST /incidents/{id}/dispositions (Supervisor-exclusive close) is rejected with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A PENDING incident (close is Supervisor-only)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T10:00:00Z" }
              as: SystemClock
            - call: "POST /incidents"
              payload: { ani: "5125559029", ali_grid_x: 10, ali_grid_y: 10, incident_type: "WELFARE_CHECK" }
              as: Calltaker
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/dispositions"
              payload: { disposition_code: "UNFOUNDED", narrative: "x" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"

      - name: missing_role_header_unauthenticated
        claim_type: unauthenticated
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /agencies"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

  # =========================================================================
  # Cross-cutting — OCC, cascade, derived-field reconciliation
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_incident_version_on_second_assignment
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[assignment-create-stale-incident]"
          - "errors[ERR_STALE_INCIDENT_VERSION]"
        distinguishing_aspect: "After one successful assignment bumps Incident.version, a second assignment carrying the pre-bump expected_incident_version is rejected with ERR_STALE_INCIDENT_VERSION (412)."
        test_recipe:
          setup: ["EMS incident PENDING; two AVAILABLE MEDIC units."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T11:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "EMS Occ", discipline: "EMS", response_sla_seconds: 600 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "EOcc", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${stn_id}", call_sign: "MOc1", capability: "MEDIC_ALS", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${stn_id}", call_sign: "MOc2", capability: "MEDIC_BLS", grid_x: 11, grid_y: 10 }
              as: Supervisor
              captures: { u2: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125559030", ali_grid_x: 10, ali_grid_y: 10, incident_type: "MEDICAL_EMERGENCY" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v0: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v0}", unit_id: "${u1}" }
              as: Dispatcher
              captures: { asg1: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v0}", unit_id: "${u2}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_INCIDENT_VERSION"
            - "HTTP status == 412"

      - name: occ_correct_version_second_assignment_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[assignment-create-stale-incident]"
          - "endpoints.POST_/incidents/{id}/assignments"
        distinguishing_aspect: "Re-reading Incident.version after the first assignment and passing it as expected_incident_version lets the second assignment succeed (201) and bumps version again."
        test_recipe:
          setup: ["STRUCTURE_FIRE incident PENDING (required [FIRE,EMS]); one ENGINE unit and one MEDIC_ALS unit available."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T12:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "Fire Ok", discipline: "FIRE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { fire_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "EMS Ok", discipline: "EMS", response_sla_seconds: 600 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${fire_id}", name: "FOk", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { fstn_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "EOk", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { estn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${fire_id}", station_id: "${fstn_id}", call_sign: "EOk1", capability: "ENGINE", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { eng_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${estn_id}", call_sign: "MOk1", capability: "MEDIC_ALS", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { med_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125559031", ali_grid_x: 10, ali_grid_y: 10, incident_type: "STRUCTURE_FIRE" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v0: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v0}", unit_id: "${eng_id}" }
              as: Dispatcher
              captures: { asg1: $.data.id }
            - call: "GET /incidents/${inc_id}"
              payload: {}
              as: Dispatcher
              captures: { inc_v1: $.data.version }
          trigger:
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v1}", unit_id: "${med_id}" }
              as: Dispatcher
              captures: { asg2: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Assignment.${asg2}.unit_id == ${med_id}"
            - "Incident.${inc_id}.version == ${inc_v1} + 1"

      - name: occ_version_literal_stale_negative
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[assignment-create-stale-incident]"
          - "errors[ERR_STALE_INCIDENT_VERSION]"
        distinguishing_aspect: "Passing expected_incident_version one less than the current version (${inc_v0} - 1) after a prior bump is rejected with ERR_STALE_INCIDENT_VERSION (412)."
        test_recipe:
          setup: ["EMS incident PENDING; one MEDIC unit; one escalate already applied so version advanced past inc_v0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T13:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "EMS Neg", discipline: "EMS", response_sla_seconds: 600 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "ENeg", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${stn_id}", call_sign: "MNg1", capability: "MEDIC_ALS", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125559032", ali_grid_x: 10, ali_grid_y: 10, incident_type: "MEDICAL_EMERGENCY" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v0: $.data.version }
            - call: "POST /incidents/${inc_id}/escalate"
              payload: { reason: "timer" }
              as: Supervisor
          trigger:
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v0} - 1", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_INCIDENT_VERSION"
            - "HTTP status == 412"

      - name: cascade_close_dispatched_incident_clears_pre_onscene_unit
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Incident.lifecycle_status.DISPATCHED_to_CLOSED
          - entities.Unit.fields.status
        distinguishing_aspect: "Closing a DISPATCHED incident whose only assignment is still DISPATCHED forces that assignment CLEARED and frees the unit to AVAILABLE in one cascade."
        test_recipe:
          setup: ["POLICE agency + PATROL unit; ASSAULT incident DISPATCHED (one DISPATCHED assignment, never enroute)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T14:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "PD Cas", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pd_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pd_id}", name: "PCas", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pd_id}", station_id: "${stn_id}", call_sign: "PCa1", capability: "PATROL", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125559033", ali_grid_x: 10, ali_grid_y: 10, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "CLEAR" }
              as: Dispatcher
          trigger:
            - call: "POST /incidents/${inc_id}/dispositions"
              payload: { disposition_code: "GONE_ON_ARRIVAL", narrative: "GOA" }
              as: Supervisor
          assert:
            - "Incident.${inc_id}.lifecycle_status == CLOSED"
            - "Assignment.${asg_id}.status == CLEARED"
            - "Unit.${unit_id}.status == AVAILABLE"
            - "Unit.${unit_id}.active_incident_id == null"

  # =========================================================================
  # Consistency model — immediate visibility
  # =========================================================================
  - section: consistency_model
    instances:
      - name: dispatch_immediately_visible_in_unit_and_incident
        claim_type: immediate
        grounds:
          - "endpoints.POST_/incidents/{id}/assignments"
          - entities.Unit.fields.status
          - entities.Incident.fields.lifecycle_status
        distinguishing_aspect: "Immediately after POST assignment, a GET on the unit shows DISPATCHED and a GET on the incident shows DISPATCHED + first_dispatch_at set — no lag."
        test_recipe:
          setup: ["POLICE agency + PATROL unit; PENDING ASSAULT incident."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T15:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "PD Im", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pd_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pd_id}", name: "PIm", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pd_id}", station_id: "${stn_id}", call_sign: "PIm1", capability: "PATROL", grid_x: 10, grid_y: 10 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125559034", ali_grid_x: 10, ali_grid_y: 10, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
          trigger:
            - call: "GET /units/${unit_id}"
              payload: {}
              as: Dispatcher
              captures: { ustatus: $.data.status }
            - call: "GET /incidents/${inc_id}"
              payload: {}
              as: Dispatcher
              captures: { istatus: $.data.lifecycle_status }
          assert:
            - "ustatus == DISPATCHED"
            - "istatus == DISPATCHED"
            - "Unit.${unit_id}.active_incident_id == ${inc_id}"
            - "Incident.${inc_id}.first_dispatch_at is not null"
