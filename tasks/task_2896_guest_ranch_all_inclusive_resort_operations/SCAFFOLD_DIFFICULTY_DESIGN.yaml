  - rule_id: resource_temporal_overlap
    instances:
      - name: cabin_stay_intervals_are_half_open_so_adjacency_is_legal
        resource_entity: Cabin
        interval_semantics: "half-open [arrival_date, departure_date) at whole-date granularity, no buffer"
        grounds:
          - validations[priority=44]
          - calculations.cabin_bed_night_occupancy
          - errors[ERR_CABIN_DOUBLE_BOOKED]
          - entities.Booking.fields.arrival_date
        distinguishing_aspect: |
          Cabin occupancy uses date-granular half-open intervals: a departure and an arrival on the
          same 2026-10-11 date share a boundary but do not overlap, so the back-to-back weekly
          package is accepted. Re-booking the identical 2026-10-11 -> 2026-10-18 interval in the
          same cabin does overlap and is rejected. An implementation using closed intervals rejects
          the legal adjacency; one that compares only arrival dates accepts the illegal duplicate.
