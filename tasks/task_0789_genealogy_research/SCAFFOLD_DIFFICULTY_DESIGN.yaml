          assert:
            - "response.data.error_id == ERR_RESEARCHER_UNAVAILABLE"

      - name: repository_aggregate_capacity_overlap
        grounds:
          - validations[priority=8]
          - entities.Repository.fields.concurrent_capacity
          - entities.RepositoryAppointment.fields.repository_id
          - errors[ERR_REPOSITORY_AT_CAPACITY]
        distinguishing_aspect: |
          Aggregate-capacity interval on the Repository resource (different resource entity and
