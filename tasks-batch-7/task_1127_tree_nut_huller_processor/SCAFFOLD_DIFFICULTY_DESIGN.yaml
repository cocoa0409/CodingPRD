  - rule_id: priority_pair_validation_conflict
    instances:
      - name: route_state_vs_aflatoxin_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_AFLATOXIN_UNRESOLVED]
        distinguishing_aspect: |
          Pair state-vs-business_safety: routing a SAMPLED lot (no AFLATOXIN
          test yet) violates both priority 6 (not GRADED) and priority 7
          (aflatoxin unresolved). The lower priority number wins:
          ERR_INVALID_STATE, never ERR_AFLATOXIN_UNRESOLVED.
        test_recipe:
          setup:
            - "Grower G1; lot gross 3000 with only the MOISTURE_KERNEL test recorded (status SAMPLED)"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 3000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
          trigger:
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 6 beats priority 7 business_safety)"
            - "HTTP status == 409"
            - "FieldLot.${lot1}.status == SAMPLED (unchanged)"

      - name: shipment_spec_vs_contract_remaining
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_SPEC_MISMATCH]
          - errors[ERR_CONTRACT_REMAINING_EXCEEDED]
        distinguishing_aspect: |
          Pair business_constraint-vs-business_fiscal: the shipment's FIFO
          allocation hits a size-spec mismatch (SPEC_23_25 stock vs SPEC_25_27
          contract) AND the quantity (5000) exceeds the contract remainder
          (2000). Priority 9 wins: ERR_SPEC_MISMATCH, never
          ERR_CONTRACT_REMAINING_EXCEEDED. A different category pair from
          route_state_vs_aflatoxin_safety.
        test_recipe:
          setup:
            - "Processed lot sized SPEC_23_25 with 3000 KERNEL placed STORED in bin B1"
