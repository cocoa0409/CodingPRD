      - name: advertising_team_name_tracks_its_team_lead_licensee_state_in_both_directions
        grounds:
          - validations[priority=21]
          - errors.ERR_TEAM_LEAD_NOT_AFFILIATED
          - state_machines.AdvertisingName.APPROVED_to_REVOKED
          - state_machines.Licensee.ACTIVE_to_INACTIVE
        distinguishing_aspect: |
          A different entity pair - AdvertisingName against its team-lead Licensee - and the dependency
          runs both ways: approval is only legal while the lead is ACTIVE and affiliated with the SAME
          brokerage, and an already-APPROVED team name is revoked the moment the lead parks their
          licence. A later submission naming the now-INACTIVE lead is rejected at intake, so the
          dependency is enforced on the way in and enforced retroactively on the way out.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with designated broker Dana Broker and salesperson Rae Field (ACTIVE) affiliated"
            - "team advertising name 'Rae Field Partners' with team_lead_licensee_id Rae Field is SUBMITTED"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
