  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: shoot_day_quota_book_cancel_conserves
        grounds:
          - calculations.shoot_day_quota
          - state_machines.ProductionSlot.BOOKED_to_WRAPPED
          - state_machines.ProductionSlot.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: Season.booked_shoot_days (integer day-quota).
          Forward action (book, +10) paired with its compensating action
          (cancel, -10) returns the invariant to its pre-book value; a second
          book (+10) followed by wrap (-10) likewise conserves.
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season (required 1, max_shoot_days 100), one approved title, one location."
            - "Baseline Season.booked_shoot_days == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage A", blackout_windows: [] }
              as: ProductionManager
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t1}", location_id: "${loc}", shoot_start: "2027-03-01T00:00:00Z", shoot_end: "2027-03-11T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { s1: $.data.id }
            - call: "POST /slate/production-slots/${s1}/cancel"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t1}", location_id: "${loc}", shoot_start: "2027-04-01T00:00:00Z", shoot_end: "2027-04-11T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { s2: $.data.id }
            - call: "POST /slate/production-slots/${s2}/wrap"
              payload: {}
              as: ProductionManager
          assert:
            - "after book(10)+cancel: Season.${season_id}.booked_shoot_days == 0 (invariant restored)"
            - "after book(10)+wrap: Season.${season_id}.booked_shoot_days == 0 (wrap also releases; conserved quantity invariant across both compensation paths)"
            - "ProductionSlot.${s1}.status == CANCELLED and ProductionSlot.${s2}.status == WRAPPED"

      - name: ad_budget_reconcile_conservation
        grounds:
          - calculations.sponsorship_reconciliation
          - state_machines.Sponsorship.BOOKED_to_RECONCILED
          - errors.ERR_AD_BUDGET_EXCEEDED
        distinguishing_aspect: |
          A different conserved quantity: Studio.ad_budget_cents (fiscal cents,
          not day-quota). Invariant: ad_budget_after == ad_budget_before -
          sum(actual_cost of RECONCILED sponsorships) — a FAILED reconciliation
          (ERR_AD_BUDGET_EXCEEDED) leaves both the budget and the sponsorship
          state unchanged, and a later successful reconciliation of a smaller
          sponsorship debits exactly its actual_cost_cents.
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio with ad_budget_cents 30000. Spiked season, LOCKED, required 1."
            - "One title delivered; block published; ONE premiere AIRED (premiered_title_count == 1); season ARCHIVED."
            - "Sponsorship S_big: cpm 2000, viewership 20 -> actual = 2000*21 = 42000 > 30000 budget."
            - "Sponsorship S_small: cpm 1000, viewership 10 -> actual = 1000*11 = 11000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
