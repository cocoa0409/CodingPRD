      - name: corner_discarded_lab_pool_rejects_all_further_actions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.LabPool.INVALID_to_DISCARDED
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "DISCARDED is terminal: START_TEST, RESULT and a second DISCARD are all refused with ERR_INVALID_TRANSITION, and the discard has already decremented the parent collection's pooled_mosquito_count."
        test_recipe:
