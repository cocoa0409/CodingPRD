          - validations[priority=45]
          - errors[ERR_READINESS_BELOW_THRESHOLD]
          - endpoints[POST /submissions/{submission_id}/conformance-decision]
        distinguishing_aspect: |
          METRIC 1 - final_readiness_score against FINAL_APPROVAL_THRESHOLD - asserted through the
          write endpoint POST /submissions/{submission_id}/conformance-decision. The score is driven to
          EXACTLY "65.00" (50.00 mandatory + 0.00 optional + 15.00 interop + 0.00 timeliness) and the
