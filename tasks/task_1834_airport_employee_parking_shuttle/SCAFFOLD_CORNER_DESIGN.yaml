      - name: billing_hold_blocks_accept_pure
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_BILLING_HOLD]"
          - "calculations.employee_balance_due"
        distinguishing_aspect: "With all higher priorities satisfied (permit OFFERED, offer in window, employee ACTIVE), a BILLING_HOLD standing alone rejects ACCEPT with 402 ERR_BILLING_HOLD."
        test_recipe:
          setup: ["Program pool 0; CORE lot capacity 2; August cycle; E1 OFFERED, then a 5000 ADJUSTMENT_DEBIT closed, exported, and settled DEDUCTION_FAILED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
