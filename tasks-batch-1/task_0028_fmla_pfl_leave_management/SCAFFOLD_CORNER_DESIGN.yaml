      - name: recert_too_soon
        claim_type: Violation → Error
        grounds: ["validations[priority=14]", "errors[ERR_RECERT_TOO_SOON]"]
        distinguishing_aspect: |
          POST /leave/cases/{id}/request-recertification within 30 days of
