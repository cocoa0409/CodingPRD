      Six failures spanning 401, 403, 400, 404, 409 and 422 must all come back in the SAME shape: response_type "error", a data object holding exactly error_id and message, and no partial entity payload. Implementations commonly leak a framework body for 401/403 (or return 500 for the state conflict), so the value here is the uniformity rather than any single id.
