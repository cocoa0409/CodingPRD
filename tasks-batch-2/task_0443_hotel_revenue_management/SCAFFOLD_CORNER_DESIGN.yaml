              as: Analyst
              captures: { err: $.data.error_id }
          assert:
            - "Response code 403; error_id == ERR_FORBIDDEN"

      - name: channel_manager_cannot_commit_group_block
        claim_type: peer_role_isolation
        grounds:
          - roles
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "ChannelManager calling the GroupSalesManager-exclusive commit endpoint -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Property/RoomType; InventoryDay; one evaluated-ACCEPT block"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "RbacCommit", total_rooms: 30 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 30 }
              as: RevenueManager
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-05T00:00:00Z", physical_capacity: 30, transient_sold_rooms: 2 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt}", group_name: "Quebec", arrival_date: "2026-06-05T00:00:00Z", nights: 1, rooms_per_night: 2, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb: $.data.id }
            - call: "POST /group-blocks/${gb}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
          trigger:
            - call: "POST /group-blocks/${gb}/commit"
              payload: { expected_room_type_version: "${rtv}" }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 403; error_id == ERR_FORBIDDEN"

      - name: missing_role_header_returns_401
        claim_type: unauthenticated
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request whose X-User-Role is unknown/absent returns ERR_UNAUTHENTICATED (401) before any role check."
