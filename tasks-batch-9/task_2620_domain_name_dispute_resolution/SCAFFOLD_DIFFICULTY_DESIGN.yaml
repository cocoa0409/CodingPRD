  - rule_id: boundary_precision_check
    instances:

      - name: conflict_score_of_exactly_sixty_disqualifies_while_fifty_six_point_six_seven_is_waivable
        grounds:
          - calculations.panelist_conflict_score
          - validations[priority=54].ERR_CONFLICT_NOT_WAIVABLE
          - state_machines.PanelistAppointment.NOMINATED_to_CONFLICTED
          - state_machines.PanelistAppointment.WAIVER_PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Two screenings differ by one month of elapsed contact and land on either side of the
          disqualifying threshold: (45 + 35) * (1 - 6/24) = 60.00, which is AT
          CONFLICT_DISQUALIFY_THRESHOLD and therefore disqualifying because the comparison is
          inclusive, while (45 + 35) * (1 - 7/24) = 56.666... rounds half-up to 56.67, which is below
          60 and above the 30 waiver threshold, so it is merely waivable. An implementation using a
          strict greater-than, or truncating 56.666... to 56.66, or rounding to 57, fails one of the
          two halves.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z throughout."
            - "Registrar IANA-1707 ACTIVE; domain sixty.example under it."
            - "Complainant Sixty SA (country_code FR) files a single-member case; 150000 paid; cleared by cm-002; verification answered lock_applied true; EMAIL notification delivered; respondent responds without electing three members."
            - "Two panelists on the roster: Anna Bauer (DE) and Bram de Vries (NL), each with max_overlapping_engagements 5."
            - "Anna Bauer is nominated to the SOLE seat."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis Seventeen", iana_id: "IANA-1707", contact_email: "abuse@regisseventeen.example", verification_response_hours: 48 }
