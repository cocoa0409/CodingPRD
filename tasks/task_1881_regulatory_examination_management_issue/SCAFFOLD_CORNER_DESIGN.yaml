      - name: occ_stale_version_on_closure_approve
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[closure-approve-stale-issue]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Closure approve with stale expected_issue_version returns 412."
        test_recipe:
          setup: ["issue in VALIDATION_SUBMITTED with PENDING closure request; issue version captured, then bumped via an unrelated event, then approve attempted with stale version"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
