            - "Donor.${gg_id}.certified_base_points == 0.00 and Donor.${gg_id}.certified_points == 10.00"
            - "The CERTIFIED NET_TRANSFER PointLedgerEntry written for donor ${ff_id} by this run has points == -10.00"
            - "The CERTIFIED CUMULATIVE_GIVING PointLedgerEntry written for donor ${ff_id} by this run has points == 0.00"

      - name: endowment_gifts_are_excluded_from_the_scoring_input_set_in_both_variants
