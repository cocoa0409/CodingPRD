        payload: {}
        as: PayerLiaison
        captures:
          auth_status: $.data.status
      assert:
      - PriorAuthorization.${auth_id}.status == APPROVED
      - TreatmentPlan.${plan_id}.coverage_status == COVERED
  - name: treatment_plan_suspend_resume_cycle
    grounds:
