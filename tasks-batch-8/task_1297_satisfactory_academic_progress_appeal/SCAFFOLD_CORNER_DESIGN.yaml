            - "Program required_credits=120; T1, T2"
            - "T1: only student C enrolled (attempted 12 earned 3 QP 12.0 gh 12) -> WARNING at T1"
            - "T2: A attempted 12 earned 12 QP 36.0 gh 12 (first term for A -> GOOD); B attempted 12 earned 6 QP 24.0 gh 12 (first fail -> WARNING); C attempted 12 earned 3 QP 12.0 gh 12 (second fail -> SUSPENSION); grading closed"
