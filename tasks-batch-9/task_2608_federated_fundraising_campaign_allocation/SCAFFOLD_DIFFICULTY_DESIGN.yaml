      - name: designation_offset_tier_floor_and_money_half_cent_rounding
        grounds:
          - calculations.community_impact_fund_allocation
          - calculations.community_impact_fund_allocation.constants.OFFSET_TIER_1_FLOOR
          - calculations.community_impact_fund_allocation.constants.SUPPLEMENT_TIER_1_CEILING
          - entities.AllocationRequest.fields.designation_offset
          - entities.AllocationRequest.fields.total_award
          - endpoints.POST_fundraising_allocation_cycles_id_awards
        distinguishing_aspect: |
          A different metric on a different endpoint: money (base_award, in dollars) against the
          inclusive lower bound OFFSET_TIER_1_FLOOR == 50000.00, exercised on POST
          /fundraising/allocation-cycles/{id}/awards. The just-below leg is one cent under the
          floor - the finest possible money step - and the tier flip inverts the ranking (the
          smaller ask wins the larger award, 52999.99 vs 45050.00), so an off-by-one-cent tier
          bug is loud rather than silent. A third leg drives step 2 onto an exact half cent
          (200.20 * 0.7250 == 145.1450): round_half_up gives 145.15 while doubles give
