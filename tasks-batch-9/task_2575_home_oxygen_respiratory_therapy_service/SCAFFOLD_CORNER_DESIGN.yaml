              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "GET /home-oxygen/qualifying-tests/${qt_id}"
              payload: {}
              as: Physician
          assert:
            - "QualifyingTest.${qt_id} exposes NO version field and NO updated_at field: common_fields is declared false for this entity"
            - "qualifying_group == GROUP_I, validity_days == 30 and test_validity_expires_at == 2026-08-24T14:00:00Z, all computed once at creation"
            - "§1.5 declares no PATCH and no DELETE whose path contains {qualifying_test_id}, so the row has no mutation surface at all"
            - "desat_minutes defaulted to 0 and cor_pulmonale_or_edema defaulted to false; pao2_mmhg is null because only spo2_percent was recorded"

      - name: replaces_unit_id_self_reference_must_target_quarantined_or_retired_unit
        claim_type: parent_relationships
        grounds:
          - entities.EquipmentUnit.fields.replaces_unit_id
          - validations[priority=66]
          - errors[ERR_REPLACED_UNIT_NOT_REPLACEABLE]
        distinguishing_aspect: |
          The only self-referential edge in the graph topology: a replacement unit may point at a
          predecessor only when that predecessor is out of service (IN_QUARANTINE or RETIRED) AND
          lives at the same branch, so an IN_STOCK predecessor and a same-status predecessor at
          another branch are both refused.
        test_recipe:
          setup:
            - "Two branches (Tampa Bay and Sarasota, both FL)."
