            - "${r_refund} == 0"
            - "${r_fee} == 0"
            - "${r_total} == 1353"
            - "GET /fit-program/return-cases/${case_1}/cost-postings returns exactly 2 rows"
            - "cost-posting with component == \"FREIGHT_INBOUND\" has amount_cents == 795"
            - "cost-posting with component == \"PROCESSING_LABOR\" has amount_cents == 558"
            - "OrderLine.${line_1}.status == \"KEPT\""
            - "CatalogItem.${item_id}.fit_return_count == 1"
            - "CatalogItem.${item_id}.chronic_return_score_bp == 1875"
            - "CatalogItem.${item_id}.fit_watch_state == \"WATCH\""
            - "CatalogItem.${item_id}.return_cost_accrued_cents == 1353"
            - "CustomerProfile.${customer_id}.refunded_total_cents == 0"
            - "ReturnCase.${case_1}.resolved_by_user_id == \"auditor-2\""
            - "ReturnCase.${case_1}.classified_by_user_id == \"auditor-1\""
  - rule_id: resource_temporal_overlap
    instances:
      - name: deployment_half_open_window_adjacency_admitted
        grounds:
          - validations[priority=24]
          - errors[ERR_DEPLOYMENT_WINDOW_OVERLAP]
          - entities.InterventionDeployment.fields.window_start
          - entities.InterventionDeployment.fields.window_end
          - entities.Intervention.fields.lever
        distinguishing_aspect: |
          Half-open interval semantics on the resource key (item_id, Intervention.lever): a window
          starting exactly where an existing one ends is admitted, an interior overlap is refused
          with ERR_DEPLOYMENT_WINDOW_OVERLAP, and the same overlapping window on a second
          intervention with a different lever is admitted because the resource key differs.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor OVLP with one LISTED TOPS item."
            - "Two interventions on different levers: I1 with lever DETAIL_IMAGERY and I2 with lever PDP_MODEL_MEASUREMENTS."
            - "One SCHEDULED deployment D1 of I1 on the item over the half-open window [2026-07-01, 2026-08-01), spending 1200 cents; no ops-run has been executed, so D1 is still SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Overlap Outfitters", brand_code: "OVLP", correction_budget_cents: 10000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "OVLP-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/interventions"
              payload: { name: "Detail imagery refresh", lever: "DETAIL_IMAGERY", unit_cost_cents: 1200 }
              as: MerchOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /fit-program/interventions"
              payload: { name: "Model measurements on PDP", lever: "PDP_MODEL_MEASUREMENTS", unit_cost_cents: 1500 }
              as: MerchOpsAdmin
              captures: { i2_id: $.data.id }
            - call: "POST /fit-program/intervention-deployments"
              payload: { intervention_id: "${i1_id}", item_id: "${item_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z", spend_cents: 1200 }
              as: MerchOpsAdmin
              captures: { d1_id: $.data.id, d1_status: $.data.status }
          trigger:
            - call: "POST /fit-program/intervention-deployments"
              payload: { intervention_id: "${i1_id}", item_id: "${item_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", spend_cents: 1200 }
              as: MerchOpsAdmin
              captures: { d2_id: $.data.id, d2_status: $.data.status }
            - call: "POST /fit-program/intervention-deployments"
              payload: { intervention_id: "${i1_id}", item_id: "${item_id}", window_start: "2026-07-15T00:00:00Z", window_end: "2026-08-15T00:00:00Z", spend_cents: 1200 }
              as: MerchOpsAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /fit-program/intervention-deployments"
              payload: { intervention_id: "${i2_id}", item_id: "${item_id}", window_start: "2026-07-15T00:00:00Z", window_end: "2026-08-15T00:00:00Z", spend_cents: 1500 }
              as: MerchOpsAdmin
              captures: { d4_id: $.data.id, d4_status: $.data.status }
          assert:
            - "${d1_status} == \"SCHEDULED\""
            - "HTTP status of the first trigger call == 201"
            - "${d2_status} == \"SCHEDULED\""
            - "InterventionDeployment.${d2_id}.window_start == \"2026-08-01T00:00:00Z\""
            - "HTTP status of the second trigger call == 409"
            - "${err_id} == \"ERR_DEPLOYMENT_WINDOW_OVERLAP\""
            - "HTTP status of the third trigger call == 201"
            - "${d4_status} == \"SCHEDULED\""
            - "Intervention.${i1_id}.deployment_count == 2"
            - "Intervention.${i2_id}.deployment_count == 1"
            - "Intervention.${i1_id}.spend_cents == 0"
            - "Intervention.${i1_id}.net_savings_cents == 0"
            - "Intervention.${i1_id}.funding_posture == \"FUNDED\""
            - "GET /fit-program/intervention-deployments?intervention_id=${i1_id} returns exactly 2 rows"
            - "GET /fit-program/intervention-deployments?intervention_id=${i2_id} returns exactly 1 row"

      - name: policy_override_closed_interval_adjacency_rejected
        grounds:
          - validations[priority=23]
          - errors[ERR_POLICY_WINDOW_OVERLAP]
          - concurrency_rules[override-create-stale-customer-profile]
          - entities.ReturnPolicy.fields.effective_from
          - entities.ReturnPolicy.fields.effective_to
        distinguishing_aspect: |
          The opposite interval semantics on a different resource entity: ReturnPolicy overrides are
          keyed on (customer_profile_id, category_code) over CLOSED [effective_from, effective_to]
          intervals, so a window starting exactly on an existing window's last day IS rejected, and
          a null effective_to behaves as +infinity, colliding with every later window.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One shopper profile."
            - "One CUSTOMER_OVERRIDE policy on TOPS over the closed interval [2026-01-01, 2026-06-30] with window_days 45, created with the profile's observed version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-r8b@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "GET /fit-program/customer-profiles/${customer_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { ver_1: $.data.version }
            - call: "POST /fit-program/customer-profiles/${customer_id}/return-policy-overrides"
              payload: { category_code: "TOPS", window_days: 45, restocking_applies: false, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z", expected_customer_profile_version: "${ver_1}" }
              as: MerchOpsAdmin
              captures: { o1_id: $.data.id, o1_scope: $.data.scope }
          trigger:
            - call: "GET /fit-program/customer-profiles/${customer_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { ver_2: $.data.version }
            - call: "POST /fit-program/customer-profiles/${customer_id}/return-policy-overrides"
              payload: { category_code: "TOPS", window_days: 20, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_customer_profile_version: "${ver_2}" }
              as: MerchOpsAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /fit-program/customer-profiles/${customer_id}/return-policy-overrides"
              payload: { category_code: "TOPS", window_days: 20, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-07-01T00:00:00Z", expected_customer_profile_version: "${ver_2}" }
              as: MerchOpsAdmin
              captures: { o3_id: $.data.id, o3_to: $.data.effective_to, o3_scope: $.data.scope, o3_customer: $.data.customer_profile_id }
            - call: "GET /fit-program/customer-profiles/${customer_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { ver_3: $.data.version }
            - call: "POST /fit-program/customer-profiles/${customer_id}/return-policy-overrides"
              payload: { category_code: "TOPS", window_days: 10, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-09-01T00:00:00Z", expected_customer_profile_version: "${ver_3}" }
              as: MerchOpsAdmin
              captures: { err_id_2: $.data.error_id }
          assert:
            - "${o1_scope} == \"CUSTOMER_OVERRIDE\""
            - "${ver_2} == ${ver_1} + 1"
            - "HTTP status of the first override call in the trigger == 409"
            - "${err_id} == \"ERR_POLICY_WINDOW_OVERLAP\""
            - "HTTP status of the second override call in the trigger == 201"
            - "${o3_to} == null"
            - "${o3_scope} == \"CUSTOMER_OVERRIDE\""
            - "${o3_customer} == ${customer_id}"
            - "${ver_3} == ${ver_2} + 1"
            - "HTTP status of the third override call in the trigger == 409"
            - "${err_id_2} == \"ERR_POLICY_WINDOW_OVERLAP\""
            - "GET /fit-program/return-policies?customer_profile_id=${customer_id} returns exactly 2 rows"
            - "ReturnPolicy.${o1_id}.effective_to == \"2026-06-30T00:00:00Z\""

  - rule_id: compensating_invariant
    instances:
      - name: void_returns_return_cost_ledger_and_refund_total_to_zero
        grounds:
          - state_machines.ReturnCase.RESOLVED_REFUNDED_to_VOIDED
          - calculations.return_case_cost_postings
          - calculations.vendor_reliability_score
          - entities.ReturnCostPosting.fields.posting_kind
          - entities.CatalogItem.fields.return_cost_accrued_cents
          - entities.CustomerProfile.fields.refunded_total_cents
        distinguishing_aspect: |
          The conserved quantity is money: voiding a resolved QUALITY case writes one REVERSAL
          posting per ORIGINAL posting so the item's return_cost_accrued_cents returns from 375 to
          exactly 0, the purchaser's refunded_total_cents returns from 6185 to 0, and the vendor's
          quality_chargeback_count walks back from 1 to 0 with reliability_score_bp back at 10000.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor QLTY at reliability 10000 with one LISTED TOPS item priced 2295 cents."
            - "A TOPS category-default policy with window_days 30, restocking_applies true and non_refundable_shipping true."
            - "One shopper with a delivered line of 3 units plus 700 cents shipping (gross_line_cents 6885), delivered 2026-05-20."
            - "A QUALITY_DEFECT case on that line, classified into QUALITY_REVIEW by auditor-1 and resolved RESELLABLE_B by auditor-2, producing 6 ORIGINAL postings that net to 375 cents and a 6185-cent refund."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Quality Looms", brand_code: "QLTY", correction_budget_cents: 10000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "QLTY-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: true, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-r9a@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 3, unit_price_cents: 2295, shipping_allocated_cents: 700, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "QUALITY_DEFECT" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /fit-program/return-cases/${case_id}/classify"
              payload: { reason_code: "QUALITY_DEFECT" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
              captures: { cls_status: $.data.status }
            - call: "POST /fit-program/return-cases/${case_id}/resolve"
              payload: { item_condition: "RESELLABLE_B" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
              captures: { res_status: $.data.status, res_refund: $.data.refund_amount_cents, res_total: $.data.total_cost_cents }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { pre_accrued: $.data.return_cost_accrued_cents, pre_returns: $.data.total_return_count }
            - call: "GET /fit-program/vendors/${vendor_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { pre_chargebacks: $.data.quality_chargeback_count, pre_reliability: $.data.reliability_score_bp }
          trigger:
            - call: "POST /fit-program/return-cases/${case_id}/void"
              payload: { void_reason: "AUDIT_REVERSAL" }
              as: ReturnsAuditor
              as_user_id: "auditor-3"
              captures: { void_status: $.data.status, void_total: $.data.total_cost_cents, void_reason_out: $.data.void_reason }
          assert:
            - "${cls_status} == \"QUALITY_REVIEW\""
            - "${res_status} == \"RESOLVED_REFUNDED\""
            - "${res_refund} == 6185"
            - "${res_total} == 375"
            - "${pre_accrued} == 375"
            - "${pre_returns} == 1"
            - "${pre_chargebacks} == 1"
            - "${pre_reliability} == 9500"
            - "${void_status} == \"VOIDED\""
            - "${void_reason_out} == \"AUDIT_REVERSAL\""
            - "${void_total} == 0"
            - "GET /fit-program/return-cases/${case_id}/cost-postings returns exactly 12 rows: 6 with posting_kind ORIGINAL and 6 with posting_kind REVERSAL"
            - "the REVERSAL rows carry amount_cents -795, -1054, -275, -826, -179 and +2754 with reversed_component FREIGHT_INBOUND, PROCESSING_LABOR, REFURB_REPACK, MARKDOWN_LOSS, PAYMENT_FEE_UNRECOVERED and VENDOR_CHARGEBACK_CREDIT respectively"
            - "sum of amount_cents over all 12 cost-posting rows == 0"
            - "CatalogItem.${item_id}.return_cost_accrued_cents == 0"
            - "CatalogItem.${item_id}.total_return_count == 0"
            - "CatalogItem.${item_id}.fit_watch_state == \"NORMAL\""
            - "OrderLine.${line_id}.status == \"DELIVERED\""
            - "CustomerProfile.${customer_id}.refunded_total_cents == 0"
            - "CustomerProfile.${customer_id}.return_case_count == 0"
            - "Vendor.${vendor_id}.quality_chargeback_count == 0"
            - "Vendor.${vendor_id}.reliability_score_bp == 10000"
            - "Vendor.${vendor_id}.status == \"ACTIVE\""

      - name: feedback_retraction_restores_item_fit_signal_pool
        grounds:
          - state_machines.FitFeedback.ACTIVE_to_RETRACTED
          - entities.FitFeedback.fields.signal_weight
          - entities.CatalogItem.fields.fit_signal_weight_total
          - entities.CatalogItem.fields.active_fit_feedback_count
        distinguishing_aspect: |
          The conserved quantity is a non-monetary signal pool rather than cents: retracting the two
          ACTIVE fit-feedback rows drains CatalogItem.fit_signal_weight_total from 300 through 100
          back to exactly 0 and active_fit_feedback_count from 2 through 1 to 0, with each
          retraction removing precisely its own row's signal_weight (200 for the purchaser, 100 for
          the non-purchaser).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor SGNL with one LISTED TOPS item."
            - "Shopper C1 has a delivered line of 1 unit on that item; shopper C2 has no line on it."
            - "C1 has posted ACTIVE fit feedback TRUE_TO_SIZE (signal_weight 200 because C1 purchased the item) and C2 has posted ACTIVE fit feedback TOO_LARGE (signal_weight 100)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Signal Sewing", brand_code: "SGNL", correction_budget_cents: 10000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "SGNL-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "buyer-c1@example.com" }
              as: MerchOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "browser-c2@example.com" }
              as: MerchOpsAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${c1_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { c1_line_id: $.data.id }
            - call: "POST /fit-program/fit-feedback"
              payload: { item_id: "${item_id}", customer_profile_id: "${c1_id}", purchased_size_label: "M", fit_verdict: "TRUE_TO_SIZE" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { fb_1: $.data.id, fb_1_weight: $.data.signal_weight, fb_1_offset: $.data.verdict_offset_centi }
            - call: "POST /fit-program/fit-feedback"
              payload: { item_id: "${item_id}", customer_profile_id: "${c2_id}", purchased_size_label: "M", fit_verdict: "TOO_LARGE" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { fb_2: $.data.id, fb_2_weight: $.data.signal_weight, fb_2_offset: $.data.verdict_offset_centi }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { pre_weight: $.data.fit_signal_weight_total, pre_count: $.data.active_fit_feedback_count }
          trigger:
            - call: "POST /fit-program/fit-feedback/${fb_1}/retract"
              payload: { retract_reason: "AUTHOR_WITHDRAWN" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { fb_1_status: $.data.status, fb_1_reason: $.data.retract_reason }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { mid_weight: $.data.fit_signal_weight_total, mid_count: $.data.active_fit_feedback_count }
            - call: "POST /fit-program/fit-feedback/${fb_2}/retract"
              payload: { retract_reason: "AUTHOR_WITHDRAWN" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { fb_2_status: $.data.status }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { post_weight: $.data.fit_signal_weight_total, post_count: $.data.active_fit_feedback_count }
          assert:
            - "${fb_1_weight} == 200"
            - "${fb_1_offset} == 0"
            - "${fb_2_weight} == 100"
            - "${fb_2_offset} == -100"
            - "${pre_weight} == 300"
            - "${pre_count} == 2"
            - "${fb_1_status} == \"RETRACTED\""
            - "${fb_1_reason} == \"AUTHOR_WITHDRAWN\""
            - "${mid_weight} == 100"
            - "${mid_count} == 1"
            - "${fb_2_status} == \"RETRACTED\""
            - "${post_weight} == 0"
            - "${post_count} == 0"
            - "GET /fit-program/fit-feedback?item_id=${item_id}&status=ACTIVE returns exactly 0 rows"

