            - "HOP 1: HedgeInstrument.${inst_id}.trade_status == TERMINATED, margin_requirement_usd == 0, and HedgeProgram.${prog_id}.hedged_gallons == 0, delta_adjusted_gallons == 0.00, coverage_pct_notional == 0.00, coverage_pct_delta == 0.00, open_instrument_count == 0"
            - "HOP 2: CollateralPosting.${p1_id}.status == RETURNED with posted_amount_usd still 180000.00 and returned_at set"
