              payload: { ingredient_name: "Ascorbic Acid", ingredient_class: "VITAMIN", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 500, rdi_mg: 90 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "C-500", net_quantity_g: 120, servings_per_container: 60 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", amount_per_serving_mg: 500, panel_position: 1 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "GET /supplement-compliance/products/${prod_id}"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_v1: $.data.version }
            - call: "POST /supplement-compliance/label-panels"
              payload: { product_id: "${prod_id}", expected_product_version: "${prod_v1}", panel_format: "STANDARD", serving_size_text: "1 capsule", serving_weight_g: 2, servings_per_container_declared: 60, effective_from: "2026-09-01", effective_until: "2026-12-31", declared_warning_codes: ["PEDIATRIC_KEEP_OUT_OF_REACH"] }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { p1_id: $.data.id }
            - call: "GET /supplement-compliance/products/${prod_id}"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_v2: $.data.version }
          trigger:
            - call: "POST /supplement-compliance/label-panels"
              payload: { product_id: "${prod_id}", expected_product_version: "${prod_v2}", panel_format: "STANDARD", serving_size_text: "1 capsule", serving_weight_g: 2, servings_per_container_declared: 60, effective_from: "2027-01-07", effective_until: "2027-06-30", declared_warning_codes: ["PEDIATRIC_KEEP_OUT_OF_REACH"] }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { err: $.data.error_id }
            - call: "POST /supplement-compliance/label-panels"
              payload: { product_id: "${prod_id}", expected_product_version: "${prod_v2}", panel_format: "STANDARD", serving_size_text: "1 capsule", serving_weight_g: 2, servings_per_container_declared: 60, effective_from: "2027-01-08", effective_until: "2027-06-30", declared_warning_codes: ["PEDIATRIC_KEEP_OUT_OF_REACH"] }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { p3_id: $.data.id }
          assert:
            - "the 2027-01-07 candidate returns HTTP 409 with error_id == ERR_PANEL_WINDOW_OVERLAP (buffered start 2026-12-31 touches P1's inclusive end)"
            - "the rejected attempt leaves Product.${prod_id}.version unchanged, so the accepted candidate reuses the same expected_product_version successfully"
            - "the 2027-01-08 candidate returns HTTP 201 with panel_status == DRAFT and effective_from == 2027-01-08"
            - "LabelPanel.${p1_id}.panel_status is still DRAFT and its window is unchanged"
            - "exactly two LabelPanel rows exist for Product.${prod_id}"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_review_gated_by_ingredient_ndi_pending_state
        grounds:
          - validations[priority=18]
          - state_machines.Ingredient.NDI_PENDING_to_NDI_ACKNOWLEDGED
          - state_machines.NDINotification.SUBMITTED_to_ACKNOWLEDGED
          - calculations.ndi_waiting_period_end
