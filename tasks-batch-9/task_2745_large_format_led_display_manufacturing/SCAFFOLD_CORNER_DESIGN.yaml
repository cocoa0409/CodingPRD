            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T19:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /service-cases"
              payload: { service_contract_id: "${sc}", cabinet_id: "${cab}", case_type: "MODULE_FAULT", severity: "MAJOR", symptom: "Second fault: slot 2 flickers", faulty_module_id: "${m2}" }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { case2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T04:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /service-cases/${case2}/respond"
              payload: {}
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "POST /service-cases"
              payload: { service_contract_id: "${sc}", cabinet_id: "${cab}", case_type: "MODULE_FAULT", severity: "MAJOR", symptom: "Third fault while suspended", faulty_module_id: "${m1}" }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { err_not_active: $.data.error_id }
            - call: "GET /service-contracts/${sc}"
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { scv2: $.data.version }
            - call: "POST /service-contracts/${sc}/spare-reservations"
              payload: { module_id: "${sp2}", expected_service_contract_version: "${scv2}" }
              as: ServiceManager
              as_user_id: "svc-1"
          assert:
            - "ServiceCase.${case1}.response_deadline_at == '2026-08-05T18:00:00.000Z' (reported_at 10:00 + GOLD 8h x MAJOR 1.0)"
            - "trigger call 1 -> 200 with response_breached == true (18:00:00.001 > 18:00:00.000 by one millisecond): ServiceContract.${sc}.sla_breach_count == 1 but contract_state is STILL ACTIVE, because 1 < MAX_SLA_BREACHES and spare_reserved_count 1 >= spare_required_count 1"
            - "after trigger call 1: DisplayProject.${pj}.service_posture is still NORMAL"
            - "trigger call 3 -> 201: an ACTIVE contract still accepts new cases; ${case2}.response_deadline_at == '2026-08-06T03:00:00.000Z'"
            - "trigger call 5 -> 200 with response_breached == true: sla_breach_count == 2 crosses MAX_SLA_BREACHES, so ServiceContract.${sc}.contract_state == SUSPENDED and DisplayProject.${pj}.service_posture == AT_RISK"
            - "trigger call 6 -> 409 with ${err_not_active} == 'ERR_CONTRACT_NOT_ACTIVE': the suspension immediately closes the intake"
            - "trigger call 8 -> 200 for the reservation itself (spare_reserved_count == 2) but ServiceContract.${sc}.contract_state REMAINS SUSPENDED: the SUSPENDED -> ACTIVE edge also demands sla_breach_count < 2, and the counter only ever grows"
            - "both cases stay in RESPONDED with response_breached true; sla_breach_count is never decremented by anything in the recipe"

  - section: consistency_model
    instances:

      - name: one_install_call_publishes_its_whole_cascade_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /cabinets/{cabinet_id}/modules]
          - entities.Cabinet
          - entities.DisplayProject
        distinguishing_aspect: |
          The declared model is `immediate`, which forbids the usual escape hatch of
          recomputing derived fields on a schedule or lazily on the next read of the
          owning row. A single install call touches four rows' worth of state — the
          module, the cabinet's counters and state, the project's production_state —
          and every one of them must be true in the very next request, with no
          retry, no second write and no reconciliation pass. The response body of the
          install itself must already show the module's POST-write state rather than
          the row as it was read at the start of the handler.
        test_recipe:
          setup:
            - "An FP16-STD project ${pj} with an APPROVED revision, cabinet ${cab} at PLANNED, and one CALIBRATED module ${m1} (1 dead pixel)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Immediate Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 160.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
            - call: "POST /drawing-revisions/${rev}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
            - call: "POST /modules/${m1}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m1}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3292 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m1}", slot_index: 1, expected_cabinet_version: "${v0}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "GET /projects/${pj}"
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "GET /modules?cabinet_id=${cab}"
              as: QAEngineer
              as_user_id: "qa-1"
          assert:
            - "trigger call 1 -> 201 and the RESPONSE BODY already reads module_state == INSTALLED, cabinet_id == ${cab}, slot_index == 1, version == 3 (create, pixel-test/calibrate writes, install): no follow-up read is needed to see the write"
            - "trigger call 2 (the immediately following request, by a DIFFERENT role) -> cabinet_state == IN_ASSEMBLY, installed_module_count == 1, occupied_slot_indexes == [1], total_dead_pixel_count == 1, dead_pixel_ppm == 244.14, version == ${v0} + 1"
            - "trigger call 3 -> DisplayProject.${pj}.production_state == IN_ASSEMBLY on the first install of the project, with engineering_state still APPROVED and version incremented"
            - "trigger call 4 -> total_count == 1 returning ${m1}: the FK index is updated in the same transaction, not by a later sweep"
            - "no assertion in this recipe requires a retry, a delay, or a second read: under consistency_model immediate every one of the four rows is correct on its first observation"
