          The well is already ORPHAN_CONFIRMED so the priority-41 gate is satisfied and cannot mask
          this rule (the reverse ordering is what the 1.8 priority-pair instance proves). The contract
          is disabled indirectly, through the contractor's licence, so the job endpoint has to read a
          state two entities away, and reinstating the licence must make the identical payload work.
