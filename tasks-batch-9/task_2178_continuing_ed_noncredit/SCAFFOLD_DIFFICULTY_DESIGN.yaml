      - name: learner_closed_interval_aggregate_ceu_load_cap
        grounds:
          - validations[priority=18]
          - errors[ERR_LEARNER_LOAD_EXCEEDED]
          - entities.Course.fields.ceu_units
          - endpoints.POST /offerings/{id}/registrations
        distinguishing_aspect: |
          Resource entity Learner with CLOSED, endpoint-inclusive interval semantics
          and AGGREGATE capacity rather than pairwise rejection: the FALL offering
          ending exactly 2026-11-15 and the LATE offering starting exactly 2026-11-15
          DO intersect, so the learner's load is 1.2 + 1.5 + 1.5 = 4.2 against
          MAX_CONCURRENT_CEU 4.0 and the third registration is refused. Under the
          half-open semantics used for instructors the FALL offering would drop out
          and the load would be an acceptable 3.0.
        test_recipe:
          setup:
            - "Three OPEN offerings: FALL on EXT-101 (ceu_units 1.2) 2026-09-15 to 2026-11-15, LAB on EXT-150 (ceu_units 1.5) 2026-10-01 to 2026-12-01, LATE on EXT-150 2026-11-15 to 2026-12-15."
            - "FALL and LATE are staffed by instructor Dana (adjacent windows); LAB is staffed by instructor Bo."
            - "Learner Ada already holds PENDING registrations on FALL and LAB, a standing load of 2.7 CEU."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "EXT-150", title: "Applied Delivery Lab", ceu_units: 1.5, contact_hours: 15, list_price_cents: 45000, delivery_mode: "IN_PERSON", cpl_credit_units: 2.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
