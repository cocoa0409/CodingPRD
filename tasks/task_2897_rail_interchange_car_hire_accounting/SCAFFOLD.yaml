# =============================================================================
# Table 1.7: RBAC Matrix
# role_model: segregation_of_duties — every money decision needs a different
# railroad from the one that raised it, and X-User-ID identifies that railroad.
# =============================================================================
roles:

  - role: ClearinghouseAdmin
    identity: opaque
    identity_note: "Not backed by any entity. X-User-ID is ignored; the clearinghouse is a party to every resource and is never subject to the ownership checks at priorities 50-52."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /car-hire/railroads"
      - "POST /car-hire/car-types"
      - "POST /car-hire/junctions"
      - "POST /car-hire/repair-bills/{repair_bill_id}/settle"
      - "POST /car-hire/settlement-cycles/{settlement_cycle_id}/reopen"
      - "POST /car-hire/settlement-cycles/{settlement_cycle_id}/archive"
      - "POST /car-hire/correction-requests/expire-due"
    shared_operations:
      - "POST /car-hire/correction-requests/{correction_request_id}/apply (shared with InterchangeClerk)"
      - "GET /car-hire/railroads and GET /car-hire/railroads/{railroad_id}/exposure (shared with CarHireAccountant; exposure also with FleetOwner)"
      - "GET /car-hire/ledger-entries, GET /car-hire/ledger-entries/{hire_ledger_entry_id} and GET /car-hire/settlement-cycles/{settlement_cycle_id}/statement (shared with CarHireAccountant)"
      - "every other GET"
    forbidden_operations:
      - "every road-scoped write: interchange capture, bad-order reporting, releases, routing obligations, reclaim filing and decisions, embargoes, repair drafting/submitting/accepting/countering, cycle compute/exchange/settle, dispute filing and moves, correction filing/confirming/rejecting"

  - role: InterchangeClerk
    identity: "entity_backed:Railroad"
    identity_note: "X-User-ID must be the Railroad.id of the acting road."
    exclusive_operations:
      - "POST /car-hire/interchange-events — acting road must be delivering_road_id or receiving_road_id"
      - "POST /car-hire/cars/{car_id}/bad-order-report — acting road must be Car.current_handling_road_id"
      - "POST /car-hire/cars/{car_id}/release-to-service — acting road must be Car.current_handling_road_id"
      - "POST /car-hire/embargo-orders — acting road must be issuing_road_id"
      - "POST /car-hire/embargo-orders/{embargo_order_id}/lift — acting road must be issuing_road_id"
      - "POST /car-hire/correction-requests — acting road becomes filed_by_road_id"
      - "POST /car-hire/correction-requests/{correction_request_id}/confirm — acting road must be counterparty_road_id, never the filer"
      - "POST /car-hire/correction-requests/{correction_request_id}/reject — acting road must be counterparty_road_id"
    shared_operations:
      - "POST /car-hire/correction-requests/{correction_request_id}/apply — acting road must be filed_by_road_id (shared with ClearinghouseAdmin, which is unrestricted)"
      - "every GET except the railroad list, the exposure read, the statement read and the ledger reads"
    forbidden_operations:
      - "all reclaim, repair-bill, settlement-cycle and dispute writes"
      - "POST /car-hire/cars and POST /car-hire/cars/{car_id}/empty-routing-obligation"
      - "GET /car-hire/railroads, GET /car-hire/railroads/{railroad_id}/exposure, GET /car-hire/settlement-cycles/{settlement_cycle_id}/statement, GET /car-hire/ledger-entries*"

  - role: CarHireAccountant
    identity: "entity_backed:Railroad"
    identity_note: "X-User-ID must be the Railroad.id of the acting road."
    exclusive_operations:
      - "POST /car-hire/reclaim-claims — acting road must be movement.handling_road_id"
      - "POST /car-hire/reclaim-claims/{reclaim_claim_id}/allow — acting road must be against_road_id"
      - "POST /car-hire/reclaim-claims/{reclaim_claim_id}/disallow — acting road must be against_road_id"
      - "POST /car-hire/reclaim-claims/{reclaim_claim_id}/withdraw — acting road must be filed_by_road_id"
      - "POST /car-hire/settlement-cycles — acting road must be payer_road_id or payee_road_id"
      - "POST /car-hire/settlement-cycles/{settlement_cycle_id}/compute — acting road must be payee_road_id"
      - "POST /car-hire/settlement-cycles/{settlement_cycle_id}/exchange — acting road must be payee_road_id"
      - "POST /car-hire/settlement-cycles/{settlement_cycle_id}/settle — acting road must be payer_road_id"
      - "POST /car-hire/disputes — acting road must be cycle.payer_road_id"
      - "POST /car-hire/disputes/{dispute_id}/counter, .../accept, .../withdraw — the acting road is fixed by whose turn the dispute's state names"
      - "GET /car-hire/settlement-cycles/{settlement_cycle_id}/statement and GET /car-hire/ledger-entries* (shared only with ClearinghouseAdmin)"
    shared_operations:
      - "GET /car-hire/railroads and GET /car-hire/railroads/{railroad_id}/exposure"
      - "every other GET"
    forbidden_operations:
      - "every interchange, bad-order, release, routing-obligation, embargo, repair-bill and correction write"

  - role: RepairBillingAgent
    identity: "entity_backed:Railroad"
    identity_note: "X-User-ID must be the Railroad.id of the acting road."
    exclusive_operations:
      - "POST /car-hire/repair-bills — acting road must be billing_road_id"
      - "POST /car-hire/repair-bills/{repair_bill_id}/submit — acting road must be billing_road_id"
      - "POST /car-hire/repair-bills/{repair_bill_id}/accept — acting road must be responsible_road_id, never the biller"
      - "POST /car-hire/repair-bills/{repair_bill_id}/counter-bill — acting road must be responsible_road_id"
    shared_operations:
      - "every GET except the railroad list, the exposure read, the statement read and the ledger reads"
    forbidden_operations:
      - "POST /car-hire/repair-bills/{repair_bill_id}/settle (clearinghouse only)"
      - "every interchange, reclaim, embargo, cycle, dispute and correction write"

  - role: FleetOwner
    identity: "entity_backed:Railroad"
    identity_note: "X-User-ID must be the Railroad.id of the acting road."
    exclusive_operations:
      - "POST /car-hire/cars — acting road must be owner_road_id"
      - "POST /car-hire/cars/{car_id}/empty-routing-obligation — acting road must be Car.owner_road_id, never the handling road"
    shared_operations:
      - "GET /car-hire/railroads/{railroad_id}/exposure (shared with CarHireAccountant and ClearinghouseAdmin)"
      - "every other GET except the railroad list, the statement read and the ledger reads"
    forbidden_operations:
      - "every interchange, bad-order, release, reclaim, embargo, repair-bill, cycle, dispute and correction write"

  - separation_of_duties_matrix:
      reclaim: "filed_by_road_id files and withdraws; against_road_id allows and disallows. No road can both file and decide the same claim."
      repair: "billing_road_id drafts and submits; responsible_road_id accepts and counter-bills; ClearinghouseAdmin settles. Three distinct actors on one bill."
      settlement: "payee_road_id computes and exchanges; payer_road_id settles; ClearinghouseAdmin reopens and archives."
      dispute: "payer_road_id files; the turn then alternates — respondent moves from OPEN, filer moves from COUNTERED."
      correction: "filed_by_road_id files and applies; counterparty_road_id confirms or rejects. Filing and confirming can never be the same road."
      car_lifecycle: "owner_road_id registers the car and issues routing obligations; current_handling_road_id reports and clears bad order."
