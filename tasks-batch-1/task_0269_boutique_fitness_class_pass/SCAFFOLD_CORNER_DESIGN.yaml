            - call: "POST /memberships/${sub1_id}/freeze"
              payload: { expected_membership_version: "${mv}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { new_v: $.data.version }
          assert:
            - "response code 200; Membership.${sub1_id}.status == FROZEN; version == ${mv} + 1"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_book_debit_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Reservation.WAITLISTED_to_BOOKED, entities.Reservation.fields.credits_charged]
        distinguishing_aspect: "On a successful booking the RESERVE_DEBIT and the new booked_count/credits_charged are visible in the same request's response — immediate consistency."
        test_recipe:
          setup: ["OPEN multi-seat session s; m1 ACTIVE balance 20. Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow", duration_min: 60, credit_cost: 5, late_cancel_window_hours: 12 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /package-plans"
              payload: { name: "20 Pack", kind: "CREDIT_PACK", price_cents: 8000, grant_credits: 20, validity_days: 60 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-20T10:00:00Z", seat_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v: $.data.version }
          trigger:
            - call: "POST /sessions/${s_id}/reservations"
              payload: { membership_id: "${sub1_id}", expected_session_version: "${s_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r1_id: $.data.id }
          assert:
            - "reservation response: booking_status == BOOKED and credits_charged == 5 immediately"
            - "GET /memberships/${sub1_id} immediately shows credit_balance == 15"

