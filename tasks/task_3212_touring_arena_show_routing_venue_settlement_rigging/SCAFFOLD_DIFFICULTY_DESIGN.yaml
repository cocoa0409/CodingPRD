              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/rigging-plans"
              payload: {}
              as: ProductionEngineer
              captures: { plan_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/rigging-plans/${plan_id}/allocations"
              payload: { rigging_point_id: "${point_id}", static_load_kg: 1000, dynamic_load_kg: 100, purpose: "rig" }
              as: ProductionEngineer
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/labor-calls"
              payload: { department: "RIGGERS", headcount: 2, call_start_at: "2026-09-10T08:00:00Z", call_end_at: "2026-09-10T16:00:00Z", hourly_rate_cents: 5000 }
