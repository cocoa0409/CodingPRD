# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x 2 instances. All chains replay against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6.
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: entry_score_trimmed_vs_weighted
        grounds: [calculations.entry_final_score, entities.Category.fields.tabulation_method, entities.Entry.fields.final_score]
        distinguishing_aspect: |
          Entry-domain calculation: identical LOCKED sheet sets (sheet_totals 8.10/8.70/6.30)
          yield final_score 7.70 under WEIGHTED_MEAN but 8.10 under TRIMMED_MEAN
          (one max + one min dropped), purely from Category.tabulation_method.
        test_recipe:
          setup:
            - "One contest in JUDGING with two categories: cat_w (WEIGHTED_MEAN) holding performed entry e1, cat_t (TRIMMED_MEAN) holding performed entry e2"
            - "Both entries have identical LOCKED sheets from 3 judges: (8,9,7), (9,8,9), (6,7,6) -> sheet_totals 8.10, 8.70, 6.30"
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 100000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "ArmorW", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 100000 }, as: ContestLead, captures: { cat_w: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "ArmorT", skill_division: "MASTERS", max_entries: 5, tabulation_method: "TRIMMED_MEAN", prize_purse_cents: 100000 }, as: ContestLead, captures: { cat_t: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Two", email: "c2@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat_w}", title: "E1", prop_declarations: ["FOAM_WEAPON"], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c2}", category_id: "${cat_t}", title: "E2", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c2}", captures: { e2: $.data.id } }
            - { call: "POST /entries/${e1}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /entries/${e2}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contestants/${c2}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c2}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J1", category_ids: ["${cat_w}", "${cat_t}"] }, as: ContestLead, captures: { j1: $.data.id } }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J2", category_ids: ["${cat_w}", "${cat_t}"] }, as: ContestLead, captures: { j2: $.data.id } }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J3", category_ids: ["${cat_w}", "${cat_t}"] }, as: ContestLead, captures: { j3: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e1}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps1: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e2}", sequence_number: 2, duration_seconds: 120 }, as: StageManager, captures: { ps2: $.data.id } }
            - { call: "POST /performance-slots/${ps1}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps1}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /performance-slots/${ps2}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps2}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /scoresheets", payload: { entry_id: "${e1}", phase: "STAGE", craftsmanship: 8, accuracy: 9, presentation: 7 }, as: Judge, as_user_id: "${j1}", captures: { s1w: $.data.id } }
            - { call: "POST /scoresheets/${s1w}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /scoresheets", payload: { entry_id: "${e1}", phase: "STAGE", craftsmanship: 9, accuracy: 8, presentation: 9 }, as: Judge, as_user_id: "${j2}", captures: { s2w: $.data.id } }
            - { call: "POST /scoresheets/${s2w}/submit", payload: {}, as: Judge, as_user_id: "${j2}" }
            - { call: "POST /scoresheets", payload: { entry_id: "${e1}", phase: "STAGE", craftsmanship: 6, accuracy: 7, presentation: 6 }, as: Judge, as_user_id: "${j3}", captures: { s3w: $.data.id } }
            - { call: "POST /scoresheets/${s3w}/submit", payload: {}, as: Judge, as_user_id: "${j3}" }
            - { call: "POST /scoresheets", payload: { entry_id: "${e2}", phase: "STAGE", craftsmanship: 8, accuracy: 9, presentation: 7 }, as: Judge, as_user_id: "${j1}", captures: { s1t: $.data.id } }
            - { call: "POST /scoresheets/${s1t}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /scoresheets", payload: { entry_id: "${e2}", phase: "STAGE", craftsmanship: 9, accuracy: 8, presentation: 9 }, as: Judge, as_user_id: "${j2}", captures: { s2t: $.data.id } }
            - { call: "POST /scoresheets/${s2t}/submit", payload: {}, as: Judge, as_user_id: "${j2}" }
            - { call: "POST /scoresheets", payload: { entry_id: "${e2}", phase: "STAGE", craftsmanship: 6, accuracy: 7, presentation: 6 }, as: Judge, as_user_id: "${j3}", captures: { s3t: $.data.id } }
            - { call: "POST /scoresheets/${s3t}/submit", payload: {}, as: Judge, as_user_id: "${j3}" }
            - { call: "POST /categories/${cat_w}/lock-scoresheets", payload: {}, as: ContestLead }
            - { call: "POST /categories/${cat_t}/lock-scoresheets", payload: {}, as: ContestLead }
          trigger:
            - { call: "POST /categories/${cat_w}/tabulate", payload: {}, as: ContestLead }
            - { call: "POST /categories/${cat_t}/tabulate", payload: {}, as: ContestLead }
            - { call: "GET /entries/${e1}", payload: {}, as: ContestLead, captures: { e1_score: $.data.final_score, e1_rank: $.data.placement_rank } }
            - { call: "GET /entries/${e2}", payload: {}, as: ContestLead, captures: { e2_score: $.data.final_score, e2_rank: $.data.placement_rank } }
          assert:
            - "Entry.${e1}.final_score == 7.7 (WEIGHTED_MEAN of 8.10, 8.70, 6.30)"
            - "Entry.${e2}.final_score == 8.1 (TRIMMED_MEAN drops 8.70 and 6.30)"
            - "Entry.${e1}.placement_rank == 1 and Entry.${e2}.placement_rank == 1"
            - "Category.${cat_w}.status == TABULATED and Category.${cat_t}.status == TABULATED"

      - name: prize_payout_with_w9_vs_backup_withholding
        grounds: [calculations.prize_payout_net, entities.PrizeAward.fields.withheld_cents, entities.PrizeAward.fields.net_payout_cents]
        distinguishing_aspect: |
          PrizeAward-domain calculation (distinct entity domain from entry scoring):
          the WITH_W9 variant pays net == gross while BACKUP_WITHHOLDING pays
          net == gross - round_half_up(gross*0.24); the variant is selected by the
          disburse request's tax_form_received flag.
        test_recipe:
          setup:
            - "Contest budget 100000; one MASTERS category with purse 100000 TABULATED: e1 rank 1 (score 9.9), e2 rank 2 (score 8.8)"
            - "Category purse split: rank1 50000, rank2 30000"
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 100000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 100000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Two", email: "c2@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c2}", category_id: "${cat}", title: "E2", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c2}", captures: { e2: $.data.id } }
            - { call: "POST /entries/${e1}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /entries/${e2}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contestants/${c2}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c2}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J1", category_ids: ["${cat}"] }, as: ContestLead, captures: { j1: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e1}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps1: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e2}", sequence_number: 2, duration_seconds: 120 }, as: StageManager, captures: { ps2: $.data.id } }
            - { call: "POST /performance-slots/${ps1}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps1}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /performance-slots/${ps2}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps2}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /scoresheets", payload: { entry_id: "${e1}", phase: "STAGE", craftsmanship: 9, accuracy: 9, presentation: 9 }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
            - { call: "POST /scoresheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /scoresheets", payload: { entry_id: "${e2}", phase: "STAGE", craftsmanship: 8, accuracy: 8, presentation: 8 }, as: Judge, as_user_id: "${j1}", captures: { s2: $.data.id } }
            - { call: "POST /scoresheets/${s2}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /categories/${cat}/lock-scoresheets", payload: {}, as: ContestLead }
            - { call: "POST /categories/${cat}/tabulate", payload: {}, as: ContestLead }
          trigger:
            - { call: "POST /prize-awards", payload: { category_id: "${cat}", rank: 1 }, as: Treasurer, as_user_id: "tr_1", captures: { aw1: $.data.id, aw1_val: $.data.value_cents } }
            - { call: "POST /prize-awards/${aw1}/approve", payload: {}, as: Treasurer, as_user_id: "tr_2" }
            - { call: "POST /prize-awards/${aw1}/disburse", payload: { tax_form_received: true }, as: Treasurer, as_user_id: "tr_2", captures: { aw1_w: $.data.withheld_cents, aw1_net: $.data.net_payout_cents } }
            - { call: "POST /prize-awards", payload: { category_id: "${cat}", rank: 2 }, as: Treasurer, as_user_id: "tr_1", captures: { aw2: $.data.id, aw2_val: $.data.value_cents } }
            - { call: "POST /prize-awards/${aw2}/approve", payload: {}, as: Treasurer, as_user_id: "tr_2" }
            - { call: "POST /prize-awards/${aw2}/disburse", payload: { tax_form_received: false }, as: Treasurer, as_user_id: "tr_2", captures: { aw2_w: $.data.withheld_cents, aw2_net: $.data.net_payout_cents } }
          assert:
            - "PrizeAward.${aw1}.value_cents == 50000 and tax_reportable == false"
            - "PrizeAward.${aw1}.withheld_cents == 0 and net_payout_cents == 50000 (WITH_W9)"
            - "PrizeAward.${aw2}.value_cents == 30000"
            - "PrizeAward.${aw2}.withheld_cents == 7200 and net_payout_cents == 22800 (BACKUP_WITHHOLDING)"
            - "Both PrizeAwards reach status DISBURSED"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: weighted_score_panel_size_branch
        grounds: [calculations.entry_final_score]
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with a conditional branch on panel size: a TRIMMED_MEAN
          category whose entry has only 2 LOCKED sheets (below TRIM_MIN_PANEL=3) must
          fall back to the plain mean; trimming would require dropping both sheets.
        test_recipe:
          setup:
            - "Contest in JUDGING; TRIMMED_MEAN category with one PERFORMED entry holding exactly 2 LOCKED sheets: (10,10,10) -> 10.00 and (4,4,4) -> 4.00"
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Trim", skill_division: "NOVICE", max_entries: 5, tabulation_method: "TRIMMED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e1: $.data.id } }
            - { call: "POST /entries/${e1}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J1", category_ids: ["${cat}"] }, as: ContestLead, captures: { j1: $.data.id } }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J2", category_ids: ["${cat}"] }, as: ContestLead, captures: { j2: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e1}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps1: $.data.id } }
            - { call: "POST /performance-slots/${ps1}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps1}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /scoresheets", payload: { entry_id: "${e1}", phase: "STAGE", craftsmanship: 10, accuracy: 10, presentation: 10 }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
            - { call: "POST /scoresheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /scoresheets", payload: { entry_id: "${e1}", phase: "STAGE", craftsmanship: 4, accuracy: 4, presentation: 4 }, as: Judge, as_user_id: "${j2}", captures: { s2: $.data.id } }
            - { call: "POST /scoresheets/${s2}/submit", payload: {}, as: Judge, as_user_id: "${j2}" }
            - { call: "POST /categories/${cat}/lock-scoresheets", payload: {}, as: ContestLead }
          trigger:
            - { call: "POST /categories/${cat}/tabulate", payload: {}, as: ContestLead }
            - { call: "GET /entries/${e1}", payload: {}, as: ContestLead, captures: { e1_score: $.data.final_score, e1_craft: $.data.craftsmanship_mean } }
          assert:
            - "Entry.${e1}.final_score == 7.0 — panel-size branch: |S| == 2 < 3 so TRIMMED_MEAN falls back to the plain mean of 10.00 and 4.00 (no extremes dropped)"
            - "Entry.${e1}.craftsmanship_mean == 7.0"
            - "Entry.${e1}.status == PLACED and placement_rank == 1"

      - name: purse_split_remainder_absorbs_rounding
        grounds: [calculations.category_purse_split, entities.Category.fields.prize_rank3_cents]
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: purse 9999 splits as
          round_half_up(4999.50)=5000 then round_half_up(2999.70)=3000 then
          rank3 = 9999-5000-3000 = 1999; independently rounding rank 3 would give
          2000 and the three ranks would sum to 10000 > purse.
        test_recipe:
          setup: ["Contest exists; no categories yet"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
          trigger:
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "OddPurse", skill_division: "JOURNEYMAN", max_entries: 9, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 9999 }, as: ContestLead, captures: { r1: $.data.prize_rank1_cents, r2: $.data.prize_rank2_cents, r3: $.data.prize_rank3_cents } }
          assert:
            - "Category.prize_rank1_cents == 5000"
            - "Category.prize_rank2_cents == 3000"
            - "Category.prize_rank3_cents == 1999 (remainder absorbs rounding; naive independent rounding would give 2000)"
            - "prize_rank1_cents + prize_rank2_cents + prize_rank3_cents == 9999 exactly"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: entry_safety_reject_resubmit_cycle
        grounds: [state_machines.Entry.SUBMITTED_to_SAFETY_REJECTED, state_machines.Entry.SAFETY_REJECTED_to_SUBMITTED, state_machines.Entry.SUBMITTED_to_SAFETY_APPROVED]
        distinguishing_aspect: |
          Entry machine is cyclic: SUBMITTED -> SAFETY_REJECTED -> (PATCH with changed
          prop_declarations) -> SUBMITTED -> SAFETY_APPROVED; the loop is reachable
          repeatedly and each pass resets safety_status to PENDING.
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN with one OPEN MASTERS category; entry e with prop_declarations [FOAM_WEAPON] in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: ["FOAM_WEAPON"] }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
          trigger:
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "REJECTED", rejected_props: ["FOAM_WEAPON"] }, as: SafetyOfficer, captures: { st1: $.data.status, e_v1: $.data.version } }
            - { call: "PATCH /entries/${e}", payload: { prop_declarations: ["ARMOR"], expected_entry_version: "${e_v1}" }, as: Contestant, as_user_id: "${c1}", captures: { st2: $.data.status, safe2: $.data.safety_status } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer, captures: { st3: $.data.status, safe3: $.data.safety_status } }
          assert:
            - "First check: status == SAFETY_REJECTED, safety_status == REJECTED, rejected_props == [FOAM_WEAPON]"
            - "PATCH resubmit: status == SUBMITTED and safety_status == PENDING (cycle back)"
            - "Re-check: status == SAFETY_APPROVED, safety_status == APPROVED"
            - "Entry.version incremented on every hop (1 -> 2 -> 3 -> 4)"

      - name: scoresheet_lock_reopen_cycle
        grounds: [state_machines.ScoreSheet.SUBMITTED_to_LOCKED, state_machines.ScoreSheet.LOCKED_to_SUBMITTED, endpoints]
        distinguishing_aspect: |
          ScoreSheet machine (different entity than Entry) is cyclic:
          DRAFT -> SUBMITTED -> LOCKED -> (ContestLead reopen) -> SUBMITTED -> LOCKED
          again, and the second lock still feeds tabulation correctly.
        test_recipe:
          setup:
            - "Contest JUDGING; one PERFORMED entry e; judge j1 with one SUBMITTED STAGE sheet (9,9,9) for e; category SCORING"
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J1", category_ids: ["${cat}"] }, as: ContestLead, captures: { j1: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps: $.data.id } }
            - { call: "POST /performance-slots/${ps}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /scoresheets", payload: { entry_id: "${e}", phase: "STAGE", craftsmanship: 9, accuracy: 9, presentation: 9 }, as: Judge, as_user_id: "${j1}", captures: { s: $.data.id } }
            - { call: "POST /scoresheets/${s}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
          trigger:
            - { call: "POST /categories/${cat}/lock-scoresheets", payload: {}, as: ContestLead, captures: { lc: $.data.locked_count } }
            - { call: "GET /scoresheets/${s}", payload: {}, as: ContestLead, captures: { s_st1: $.data.status } }
            - { call: "POST /scoresheets/${s}/reopen", payload: {}, as: ContestLead, captures: { s_st2: $.data.status } }
            - { call: "POST /categories/${cat}/lock-scoresheets", payload: {}, as: ContestLead }
            - { call: "GET /scoresheets/${s}", payload: {}, as: ContestLead, captures: { s_st3: $.data.status } }
            - { call: "POST /categories/${cat}/tabulate", payload: {}, as: ContestLead }
            - { call: "GET /entries/${e}", payload: {}, as: ContestLead, captures: { e_st: $.data.status, e_score: $.data.final_score } }
          assert:
            - "locked_count == 1 on first bulk lock; sheet status == LOCKED"
            - "After reopen: sheet status == SUBMITTED (cycle LOCKED -> SUBMITTED)"
            - "After second lock: sheet status == LOCKED again"
            - "Tabulate then succeeds: entry PLACED with final_score == 9.9"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: disqualify_cascade_sheets_category_contest
        grounds: [state_machines.Entry.PLACED_to_DISQUALIFIED, state_machines.ScoreSheet.LOCKED_to_VOID, state_machines.Category.TABULATED_to_SCORING, state_machines.ContestEvent.TABULATION_to_JUDGING]
        distinguishing_aspect: |
          Depth-3 transitive chain triggered by disqualify: Entry PLACED->DISQUALIFIED
          causes its LOCKED ScoreSheets -> VOID (link 1), which breaks the category's
          locked-sheet completeness so Category TABULATED->SCORING with sibling
          placements cleared (link 2), which breaks the all-categories-tabulated
          invariant so ContestEvent TABULATION->JUDGING (link 3).
        test_recipe:
          setup:
            - "Contest in TABULATION; single category TABULATED with e1 rank 1 (sheet 9,9,9) and e2 rank 2 (sheet 8,8,8); both sheets LOCKED"
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 100000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 100000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Two", email: "c2@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c2}", category_id: "${cat}", title: "E2", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c2}", captures: { e2: $.data.id } }
            - { call: "POST /entries/${e1}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /entries/${e2}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contestants/${c2}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c2}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J1", category_ids: ["${cat}"] }, as: ContestLead, captures: { j1: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e1}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps1: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e2}", sequence_number: 2, duration_seconds: 120 }, as: StageManager, captures: { ps2: $.data.id } }
            - { call: "POST /performance-slots/${ps1}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps1}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /performance-slots/${ps2}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps2}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /scoresheets", payload: { entry_id: "${e1}", phase: "STAGE", craftsmanship: 9, accuracy: 9, presentation: 9 }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
            - { call: "POST /scoresheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /scoresheets", payload: { entry_id: "${e2}", phase: "STAGE", craftsmanship: 8, accuracy: 8, presentation: 8 }, as: Judge, as_user_id: "${j1}", captures: { s2: $.data.id } }
            - { call: "POST /scoresheets/${s2}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /categories/${cat}/lock-scoresheets", payload: {}, as: ContestLead }
            - { call: "POST /categories/${cat}/tabulate", payload: {}, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "TABULATION" }, as: ContestLead }
          trigger:
            - { call: "POST /entries/${e1}/disqualify", payload: {}, as: ContestLead, captures: { e1_st: $.data.status } }
            - { call: "GET /scoresheets/${s1}", payload: {}, as: ContestLead, captures: { s1_st: $.data.status } }
            - { call: "GET /scoresheets/${s2}", payload: {}, as: ContestLead, captures: { s2_st: $.data.status } }
            - { call: "GET /categories/${cat}", payload: {}, as: ContestLead, captures: { cat_st: $.data.status } }
            - { call: "GET /contest-events/${cont}", payload: {}, as: ContestLead, captures: { cont_st: $.data.status } }
            - { call: "GET /entries/${e2}", payload: {}, as: ContestLead, captures: { e2_st: $.data.status, e2_rank: $.data.placement_rank } }
          assert:
            - "Entry.${e1}.status == DISQUALIFIED and placement_rank == null"
            - "ScoreSheet.${s1}.status == VOID (link 1: caused by the disqualify)"
            - "ScoreSheet.${s2}.status == LOCKED (other entries' sheets untouched)"
            - "Category.${cat}.status == SCORING (link 2: caused by the sheet voiding)"
            - "ContestEvent.${cont}.status == JUDGING (link 3: caused by the category leaving TABULATED)"
            - "Entry.${e2}.status == PERFORMED with placement_rank == null (sibling placements cleared by the category revert)"

      - name: withdraw_cascade_slot_skip_resequence
        grounds: [state_machines.Entry.STAGE_QUEUED_to_WITHDRAWN, state_machines.PerformanceSlot.QUEUED_to_SKIPPED, calculations.stage_sequence_compaction]
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (withdraw, not disqualify):
          Entry STAGE_QUEUED->WITHDRAWN causes its QUEUED PerformanceSlot -> SKIPPED
          (link 1), and that removal itself triggers stage_sequence_compaction which
          renumbers the surviving QUEUED slots gap-free from 1 (link 2).
        test_recipe:
          setup:
            - "Contest JUDGING; three SAFETY_APPROVED entries (requires_prejudging=false, consent granted) queued on stage: e1 seq 1, e2 seq 2, e3 seq 3"
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 9, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Two", email: "c2@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Three", email: "c3@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c3: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c2}", category_id: "${cat}", title: "E2", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c2}", captures: { e2: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c3}", category_id: "${cat}", title: "E3", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c3}", captures: { e3: $.data.id } }
            - { call: "POST /entries/${e1}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /entries/${e2}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /entries/${e3}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contestants/${c2}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c2}" }
            - { call: "POST /contestants/${c3}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c3}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /performance-slots", payload: { entry_id: "${e1}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps1: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e2}", sequence_number: 2, duration_seconds: 120 }, as: StageManager, captures: { ps2: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e3}", sequence_number: 3, duration_seconds: 120 }, as: StageManager, captures: { ps3: $.data.id } }
          trigger:
            - { call: "POST /entries/${e2}/withdraw", payload: {}, as: Contestant, as_user_id: "${c2}", captures: { e2_st: $.data.status } }
            - { call: "GET /performance-slots/${ps2}", payload: {}, as: StageManager, captures: { ps2_st: $.data.status } }
            - { call: "GET /performance-slots/${ps1}", payload: {}, as: StageManager, captures: { ps1_seq: $.data.sequence_number } }
            - { call: "GET /performance-slots/${ps3}", payload: {}, as: StageManager, captures: { ps3_seq: $.data.sequence_number } }
          assert:
            - "Entry.${e2}.status == WITHDRAWN"
            - "PerformanceSlot.${ps2}.status == SKIPPED (link 1: caused by the withdraw)"
            - "PerformanceSlot.${ps1}.sequence_number == 1 (unchanged)"
            - "PerformanceSlot.${ps3}.sequence_number == 2 (link 2: compaction renumbered 3 -> 2, gap-free)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_beats_state_on_entry_create
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_NOT_FOUND]", "errors[ERR_REGISTRATION_NOT_OPEN]"]
        distinguishing_aspect: |
          Error-category pair (existence vs state): creating an entry with a
          non-existent category_id while the contest is still SETUP (registration
          not open) must return ERR_NOT_FOUND (priority 4), not
          ERR_REGISTRATION_NOT_OPEN (priority 6).
        test_recipe:
          setup: ["Contest in SETUP (registration not open); contestant c exists; category id is a well-formed UUID that does not exist"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /entries", payload: { contestant_id: "${c}", category_id: "00000000-0000-0000-0000-000000000000", title: "X", prop_declarations: [] }, as: Contestant, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "Response is 404 with error_id == ERR_NOT_FOUND, NOT ERR_REGISTRATION_NOT_OPEN"

      - name: safety_beats_sequence_conflict_on_stage_queue
        grounds: ["validations[priority=7]", "validations[priority=9]", "errors[ERR_SAFETY_NOT_APPROVED]", "errors[ERR_SEQUENCE_CONFLICT]"]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_constraint) — different
          pair than existence-vs-state: queueing an entry whose safety_status is
          PENDING with an already-taken sequence_number must return
          ERR_SAFETY_NOT_APPROVED (priority 7), not ERR_SEQUENCE_CONFLICT (priority 9).
        test_recipe:
          setup:
            - "Contest JUDGING; e1 SAFETY_APPROVED + consent, queued at sequence_number 1; e2 (requires_prejudging=false) still SUBMITTED with safety_status PENDING, consent granted"
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Two", email: "c2@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c2}", category_id: "${cat}", title: "E2", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c2}", captures: { e2: $.data.id } }
            - { call: "POST /entries/${e1}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contestants/${c2}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c2}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /performance-slots", payload: { entry_id: "${e1}", sequence_number: 1, duration_seconds: 120 }, as: StageManager }
          trigger:
            - { call: "POST /performance-slots", payload: { entry_id: "${e2}", sequence_number: 1, duration_seconds: 60 }, as: StageManager, captures: { err: $.data.error_id } }
          assert:
            - "Response is 409 with error_id == ERR_SAFETY_NOT_APPROVED, NOT ERR_SEQUENCE_CONFLICT"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: junior_age_exactly_16_on_contest_date
        grounds: [calculations.junior_age_eligibility, "validations[priority=9]", "errors[ERR_DIVISION_AGE_INELIGIBLE]"]
        distinguishing_aspect: |
          Metric: contestant age in whole years at the contest date, via POST /entries.
          A contestant whose 16th birthday IS the contest date has age 16 and is
          rejected (age < 16 required); born one day later (age 15) is accepted.
        test_recipe:
          setup: ["Contest starting 2026-08-15T09:00:00Z, REGISTRATION_OPEN, with a JUNIOR category; contestant c_old born 2010-08-15, contestant c_young born 2010-08-16"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Youth", skill_division: "JUNIOR", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "Exact Sixteen", email: "old@x.com", birth_date: "2010-08-15" }, as: Anonymous, captures: { c_old: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "Still Fifteen", email: "young@x.com", birth_date: "2010-08-16" }, as: Anonymous, captures: { c_young: $.data.id } }
          trigger:
            - { call: "POST /entries", payload: { contestant_id: "${c_old}", category_id: "${cat}", title: "Old", prop_declarations: [] }, as: Contestant, as_user_id: "${c_old}", captures: { err: $.data.error_id } }
            - { call: "POST /entries", payload: { contestant_id: "${c_young}", category_id: "${cat}", title: "Young", prop_declarations: [] }, as: Contestant, as_user_id: "${c_young}", captures: { ok_st: $.data.status } }
          assert:
            - "c_old (exactly 16 on contest date): 422 ERR_DIVISION_AGE_INELIGIBLE"
            - "c_young (15 on contest date): 201, Entry.status == SUBMITTED"

      - name: prize_exactly_600_dollars_taxable
        grounds: [calculations.prize_payout_net, entities.PrizeAward.fields.tax_reportable, "errors[ERR_PRIZE_BUDGET_EXCEEDED]"]
        distinguishing_aspect: |
          Metric: prize value in cents, via POST /prize-awards (different metric and
          endpoint than the age boundary). value_cents exactly == 60000 IS
          tax_reportable (inclusive >=); 36000 is not.
        test_recipe:
          setup:
            - "Category purse 120000 (rank1 split = exactly 60000, rank2 = 36000) TABULATED with e1 rank 1, e2 rank 2; contest budget 200000"
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 200000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 120000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Two", email: "c2@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c2}", category_id: "${cat}", title: "E2", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c2}", captures: { e2: $.data.id } }
            - { call: "POST /entries/${e1}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /entries/${e2}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contestants/${c2}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c2}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
