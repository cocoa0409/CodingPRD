scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: severity_score_provisional_vs_final_on_lab_result
        grounds:
          - calculations.severity_score_provisional
          - calculations.severity_score_final
          - state_machines.LabResult.DRAFT_to_RELEASED
          - entities.LabResult.fields.severity_score
        distinguishing_aspect: |
          Provisional severity (DRAFT) uses sum-then-round and ONLY this result; final severity
          (RELEASED/AMENDED) uses round-per-piece-then-sum AND blends in latest 2 prior RELEASED
          results — same inputs of the new result therefore produce a different number on the same
          LabResult entity, satisfying the dual-variant clause on the LabResult domain.
        test_recipe:
          setup:
            - "POST /clinicians create LAB_TECH t1 (active=true) and LAB_DIRECTOR d1, d2 (active=true)"
            - "POST /patients create patient p1 (notification_consent=SMS_AND_VOICE)"
            - "POST /test-panels create panel pn1 with clia_complexity=MODERATE, stability_minutes=120, analytes=[{A1,'mg/dL',null,300}, {A2,'mg/dL',null,300}]"
            - "POST /lab-orders create o1 (priority=ROUTINE, ordering_provider=op1) and walk it through COLLECTED, IN_TRANSIT (1 leg LAB_MAIN), arrive within stability => RECEIVED"
          trigger:
            - "POST /lab-orders/{o1}/results with resulted_by=t1, measurements=[{A1,400,'mg/dL'},{A2,400,'mg/dL'}]"
            - "GET /results/{r1} -> observe provisional severity_score"
            - "POST /results/{r1}/release with released_by=d1"
            - "GET /results/{r1} -> observe final severity_score"
          assert:
            - "Before release: LabResult.severity_score == 1.33"
            - "After release: LabResult.severity_score == 1.34"
            - "1.33 != 1.34 demonstrates dual-variant divergence on the same inputs"

      - name: ack_latency_minutes_recorded_vs_attempt_escalation_count_on_notification
        grounds:
          - calculations.ack_deadline
          - calculations.attempt_escalation
          - entities.CriticalNotification.fields.attempt_count
          - entities.AcknowledgementReceipt.fields.ack_latency_minutes
          - state_machines.CriticalNotification.PENDING_to_ESCALATED
          - state_machines.CriticalNotification.PENDING_to_ACKNOWLEDGED
        distinguishing_aspect: |
          For the SAME CriticalNotification + AcknowledgementReceipt domain, two calculations
          on the same physical event (the ack landing late) yield different observable numbers:
          ack_latency_minutes is computed against first_sent_at (so it grows with elapsed real
          time), whereas attempt_count grows only when the sweep ran in between. Same inputs,
          two algorithms (latency arithmetic vs sweep-driven counter), divergent results.
          This is on the CriticalNotification entity domain, which is distinct from LabResult
          above.
        test_recipe:
          setup:
            - "Same as previous: o1 reaches RELEASED with critical_flags non-empty, creating notification n1 at clock=T0 (priority=ROUTINE => ack_deadline_at = T0+30 minutes)"
          trigger:
            - "POST /_clock/advance to T0 + 45 minutes"
            - "POST /_sweep/run (this escalates n1 to ESCALATED, channel=VOICE, attempt_count=1, ack_deadline_at = T0+55 min)"
            - "POST /_clock/advance to T0 + 50 minutes"
            - "POST /notifications/{n1}/acknowledge with acknowledged_by=op1, read_back_text containing 'A1 A2'"
          assert:
            - "AcknowledgementReceipt.ack_latency_minutes == 50.00"
            - "CriticalNotification.attempt_count == 1"
            - "50.00 != 1 demonstrates dual-variant divergence on the notification domain (different from the LabResult instance)"

  # =========================================================================
  # Rule 2: Combinatorial formulas across different modes (a)/(b)/(c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: severity_score_final_nested_rounding_order_matters    # mode (b)
        grounds:
          - calculations.severity_score_final
          - calculations.severity_score_provisional
        distinguishing_aspect: |
          MODE (b) — nested rounding where order matters. Provisional does
          sum-then-round; final does round-per-piece-then-sum. With two HIGH analytes
          at distance 1/3 each (value=400, critical_high=300), the two orders give 1.33
          vs 1.34. The scaffold pins final as round-per-piece-then-sum.
        test_recipe:
          setup:
            - "Panel pn1 with 2 analytes both critical_high=300; patient p1; clinicians t1 (LAB_TECH), d1 (LAB_DIRECTOR); order o1 walked to RECEIVED"
          trigger:
            - "POST /lab-orders/{o1}/results with measurements [{A1,400},{A2,400}]"
            - "GET /results/{r1} -> read provisional"
            - "POST /results/{r1}/release with d1"
            - "GET /results/{r1} -> read final"
          assert:
            - "provisional severity_score == 1.33 (sum 1.3333... rounded once)"
            - "final severity_score == 1.34 (each 0.6666... rounded to 0.67 then summed)"

      - name: ack_window_tiered_by_priority_and_escalation_extension    # mode (a)
        grounds:
          - calculations.ack_deadline
          - calculations.attempt_escalation
          - entities.LabOrder.fields.priority
          - entities.CriticalNotification.fields.channel
          - entities.CriticalNotification.fields.status
        distinguishing_aspect: |
          MODE (a) — formula with 3 inputs (priority, channel, status) and non-linear
          interaction via conditional branches: window=30 if ROUTINE else 10; then
          escalation adds a flat +10 only on the PENDING+SMS -> ESCALATED+VOICE branch
          and again on ESCALATED+VOICE -> FAILED. Falls in a different mode than the
          rounding instance above.
        test_recipe:
          setup:
            - "Two orders: o_routine (priority=ROUTINE) and o_stat (priority=STAT), both walked to RELEASED at clock T0 with critical_flags non-empty, producing n_routine and n_stat"
          trigger:
            - "GET /notifications/{n_routine} and /notifications/{n_stat}"
          assert:
            - "n_routine.ack_deadline_at == T0 + 30 minutes"
            - "n_stat.ack_deadline_at == T0 + 10 minutes"
            - "After sweep at T0+12 min: n_stat.status == ESCALATED, n_stat.ack_deadline_at == T0+10+10 = T0+20 min; n_routine still PENDING with deadline T0+30"

      - name: attempt_escalation_chronological_order_dependency    # mode (c)
        grounds:
          - calculations.attempt_escalation
          - state_machines.CriticalNotification.PENDING_to_ESCALATED
          - state_machines.CriticalNotification.ESCALATED_to_FAILED
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency where evaluation order must be explicit:
          attempt_escalation sorts (ack_deadline_at ASC, created_at ASC). Two notifications
          with identical ack_deadline_at but different created_at MUST escalate in
          created_at order — a single sweep run produces deterministic audit-event ordering.
          Falls in a different mode than (a) and (b) above.
        test_recipe:
          setup:
            - "Create two orders o_A and o_B (priority=ROUTINE) released at exactly T0 so both notifications have ack_deadline_at=T0+30. Force o_A's notification to be created at T0 and o_B's at T0 + 0.5 seconds (via two distinct release calls)."
          trigger:
            - "POST /_clock/advance to T0 + 31 minutes"
            - "POST /_sweep/run"
            - "GET /audit-events?event_type=CRITICAL_ESCALATED ordered by created_at ASC"
          assert:
            - "First CRITICAL_ESCALATED audit event has lab_order_id == o_A"
            - "Second CRITICAL_ESCALATED audit event has lab_order_id == o_B"

  # =========================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lab_result_branching_with_amend_then_retract
        grounds:
          - state_machines.LabResult.DRAFT_to_RELEASED
          - state_machines.LabResult.RELEASED_to_AMENDED
          - state_machines.LabResult.AMENDED_to_RETRACTED
        distinguishing_aspect: |
          LabResult is NON-LINEAR via branching fork: DRAFT -> RELEASED, then RELEASED branches
          into either staying released OR -> AMENDED -> RETRACTED, with divergent side-effect
          sets per branch (amendment may auto-issue retest + open new notification; retract
          writes audit only). This is branching fork-join shape, not a linear pipeline.
        test_recipe:
          setup:
            - "Order o1 reaches RELEASED with critical_flags=[A1 HIGH]"
          trigger:
            - "POST /results/{r1}/amend changing measurements so A1 becomes normal but A2 becomes critical -> different critical_flags set"
            - "POST /results/{r1}/retract"
          assert:
            - "After amend: LabResult.status == AMENDED; a new CriticalNotification was opened for A2; a RetestRequest with reason=RESULT_AMENDED exists"
            - "After retract: LabResult.status == RETRACTED; a ComplianceAuditEvent(AMENDMENT_RECORDED) with payload indicating retract is present"

      - name: critical_notification_cyclic_via_amendment_reopening
        grounds:
          - state_machines.CriticalNotification.PENDING_to_ESCALATED
          - state_machines.CriticalNotification.PENDING_to_ACKNOWLEDGED
          - state_machines.LabResult.RELEASED_to_AMENDED
        distinguishing_aspect: |
          CriticalNotification participates in a cycle at the LabResult level: a notification
          on the same result can be ACKNOWLEDGED, then an AMENDMENT reopens a NEW notification
          on the same LabResult — effectively producing a PENDING -> ACKNOWLEDGED -> (new PENDING)
          revisit loop on the same result. This is a different entity than LabResult, satisfying
          the "different entities" clause.
        test_recipe:
          setup:
            - "Order o1 released with A1 critical; notification n1 ACKNOWLEDGED by op1"
          trigger:
            - "POST /results/{r1}/amend with measurements making A2 newly critical"
            - "GET /notifications?recipient_clinician_id=op1"
          assert:
            - "n1.status == ACKNOWLEDGED (unchanged)"
            - "A NEW CriticalNotification n2 exists with status=PENDING and references LabResult r1"

  # =========================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: report_break_cascade_chain_depth_3   # depth >= 3
        grounds:
          - state_machines.Specimen.IN_TRANSIT_to_REJECTED
          - state_machines.LabOrder.IN_TRANSIT_to_RECEIVED
          - entities.RetestRequest.fields.new_lab_order_id
          - entities.LabOrder.fields.retest_count
        distinguishing_aspect: |
          Triggered by POST /transport-legs/{id}/report-break. Chain has DEPTH 3 with each
          link CAUSED BY the previous (not parallel fan-out): (1) leg.status -> BROKEN
          mutates the leg; (2) BECAUSE leg is BROKEN, Specimen.status -> REJECTED with
          rejected_reason=CHAIN_BROKEN; (3) BECAUSE Specimen is REJECTED, LabOrder.status
          -> REJECTED AND a fresh LabOrder is minted via RetestRequest with
          parent_order_id=original, retest_count incremented.
        test_recipe:
          setup:
            - "Order o1 walked to IN_TRANSIT with leg L1 DEPARTED"
          trigger:
            - "POST /transport-legs/{L1}/report-break"
          assert:
            - "TransportLeg L1.status == BROKEN"
            - "Specimen.status == REJECTED AND rejected_reason == CHAIN_BROKEN"
            - "LabOrder o1.status == REJECTED"
            - "A RetestRequest with reason=SPECIMEN_REJECTED exists pointing to a NEW LabOrder o2 where o2.parent_order_id == o1.id AND o2.retest_count == o1.retest_count + 1"

      - name: notification_failed_cascade_chain_depth_2   # depth >= 2, different trigger
        grounds:
          - state_machines.CriticalNotification.ESCALATED_to_FAILED
          - entities.RetestRequest.fields.new_lab_order_id
          - entities.LabOrder.fields.retest_count
          - calculations.attempt_escalation
        distinguishing_aspect: |
          Triggered by POST /_sweep/run (system sweep, NOT report-break). Chain has DEPTH 2:
          (1) sweep flips CriticalNotification.status ESCALATED -> FAILED;
          (2) BECAUSE notification FAILED, a RetestRequest with reason=CRITICAL_UNACKNOWLEDGED
          is auto-issued cloning the LabOrder. Different trigger than instance 1.
        test_recipe:
          setup:
            - "Order o1 released with critical_flags non-empty at clock T0 (priority=STAT, ack window 10 min)"
            - "POST /_clock/advance to T0+11 min; POST /_sweep/run (escalates to VOICE)"
          trigger:
            - "POST /_clock/advance to T0+22 min"
            - "POST /_sweep/run"
          assert:
            - "CriticalNotification.status == FAILED"
            - "A RetestRequest with reason=CRITICAL_UNACKNOWLEDGED exists pointing to a NEW LabOrder o2 with parent_order_id == o1.id AND o2.retest_count == 1"

  # =========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_conflict_on_release
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Error-category pair: state (priority 5: ERR_INVALID_STATE) vs business_safety
          (priority 6: ERR_CLIA_SOD_VIOLATION). A request to release a result that is
          already RELEASED AND has released_by == resulted_by triggers BOTH conditions;
          since priority 5 wins, the response MUST be ERR_INVALID_STATE not
          ERR_CLIA_SOD_VIOLATION.
        test_recipe:
          setup:
            - "LabResult r1 created by t1 then released by d1 (so status=RELEASED already)"
          trigger:
            - "POST /results/{r1}/release with released_by_id == t1.id (would also violate SoD if SoD were checked, since t1 also resulted r1)"
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "NOT ERR_CLIA_SOD_VIOLATION (different category pair, state wins)"

      - name: business_safety_vs_business_referential_conflict_on_ack
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          Different error-category pair than instance 1: business_safety (priority 8:
          ERR_PATIENT_CONSENT_BLOCKED — checked at release) cannot collide with the ack
          path. Instead the ack path itself pits business_referential (priority 9:
          ERR_ACK_BY_WRONG_RECIPIENT) against business_referential (priority 10:
          ERR_READBACK_INCOMPLETE). When BOTH apply (wrong recipient AND empty read-back),
          priority 9 must win.
        test_recipe:
          setup:
            - "Notification n1 with recipient=op1 (HIGH complexity panel so read-back required)"
          trigger:
            - "POST /notifications/{n1}/acknowledge with acknowledged_by_id == op2 (wrong recipient) AND read_back_text='' (also incomplete)"
          assert:
            - "HTTP 422 with error_id == ERR_ACK_BY_WRONG_RECIPIENT"
            - "NOT ERR_READBACK_INCOMPLETE (priority 9 wins over 10)"

  # =========================================================================
  # Rule 6: Boundary-precision checks on different metrics / endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: specimen_stability_strict_greater_than
        grounds:
          - calculations.specimen_stability_check
          - state_machines.Specimen.IN_TRANSIT_to_RECEIVED
          - entities.TestPanel.fields.stability_minutes
        distinguishing_aspect: |
          Numeric threshold boundary: transit_minutes > stability_minutes is REJECT;
          transit_minutes == stability_minutes is ACCEPT (strict > vs >=).
          Reached via POST /transport-legs/{id}/arrive (one endpoint).
        test_recipe:
          setup:
            - "Panel pn1 with stability_minutes=120; specimen collected at T0; leg arriving at to_location=LAB_MAIN"
          trigger:
            - "Case A: POST /transport-legs/{L}/arrive with arrived_at = T0 + 120 minutes exactly"
            - "Case B: separate run — POST /transport-legs/{L2}/arrive with arrived_at = T0 + 120 minutes + 1 second"
          assert:
            - "Case A: Specimen.status == RECEIVED (boundary == accepted)"
            - "Case B: Specimen.status == REJECTED with rejected_reason == STABILITY_EXCEEDED"

      - name: empty_critical_flags_skips_notification_creation
        grounds:
          - calculations.compute_critical_flags
          - state_machines.LabOrder.RESULTED_to_RELEASED
          - entities.CriticalNotification
        distinguishing_aspect: |
          Empty-collection edge (distinct metric from numeric threshold): when
          critical_flags is the empty array, the release endpoint MUST NOT create
          any CriticalNotification AND MUST NOT write a CRITICAL_NOTIFIED audit event.
          Reached via POST /results/{id}/release (different endpoint than instance 1).
        test_recipe:
          setup:
            - "Panel pn1 (analytes critical_high=300); order o1 walked to RECEIVED; measurements [{A1,250},{A2,250}] (both BELOW critical_high) -> no criticals"
          trigger:
            - "POST /lab-orders/{o1}/results, then POST /results/{r1}/release"
          assert:
            - "GET /notifications?recipient_clinician_id=op1 returns 0 items linked to r1"
            - "GET /audit-events?lab_order_id=o1&event_type=CRITICAL_NOTIFIED returns total_count == 0"
            - "GET /audit-events?lab_order_id=o1&event_type=RESULT_RELEASED returns total_count == 1"

  # =========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lab_order_resulted_depends_on_specimen_received
        grounds:
          - state_machines.LabOrder.RECEIVED_to_RESULTED
          - state_machines.Specimen.IN_TRANSIT_to_RECEIVED
          - entities.Specimen.fields.status
        distinguishing_aspect: |
          Entity pair: LabOrder ↔ Specimen. LabOrder.RECEIVED -> RESULTED MUST verify
          Specimen.status == RECEIVED (not REJECTED, not IN_TRANSIT). Attempting to
          POST /lab-orders/{id}/results while specimen is REJECTED fails.
        test_recipe:
          setup:
            - "Order o1 with specimen rejected via report-break (Specimen.status=REJECTED, LabOrder.status=REJECTED)"
          trigger:
            - "POST /lab-orders/{o1}/results with valid measurements"
          assert:
            - "HTTP 409 ERR_INVALID_STATE (LabOrder no longer in a valid prior state for resulting)"

      - name: acknowledge_depends_on_clinician_active_and_identity
        grounds:
          - state_machines.CriticalNotification.PENDING_to_ACKNOWLEDGED
          - entities.Clinician.fields.active
          - validations[priority=9]
          - validations[priority=14]
        distinguishing_aspect: |
          DIFFERENT entity pair from instance 1: CriticalNotification ↔ Clinician
          (specifically the recipient_clinician). Ack requires (a) acknowledged_by_id ==
          recipient_clinician_id AND (b) that clinician.active == true. So
          CriticalNotification's valid transitions depend on the Clinician entity's
          active flag and identity — a different pair than LabOrder ↔ Specimen.
        test_recipe:
          setup:
            - "Notification n1 recipient=op1 (active=true). PATCH /clinicians/{op1} set active=false"
          trigger:
            - "POST /notifications/{n1}/acknowledge with acknowledged_by_id=op1, read_back_text='A1'"
          assert:
            - "HTTP 422 ERR_CLINICIAN_INACTIVE (CriticalNotification cannot transition because dependent Clinician entity is inactive)"

  # =========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: transport_leg_chain_contiguity_no_gap   # closed-end contiguity semantics
        grounds:
          - validations[priority=12]
          - entities.TransportLeg.fields.leg_index
          - entities.TransportLeg.fields.from_location
          - entities.TransportLeg.fields.to_location
          - state_machines.Specimen.IN_TRANSIT_to_RECEIVED
        distinguishing_aspect: |
          Interval semantics: CLOSED-CONTIGUOUS — a new leg MUST chain location-wise to the
          previous (new.from_location == previous.to_location) AND the previous leg MUST
          already be in status ARRIVED. The resource is the Specimen's transport chain
          and adjacency is by location-identity, not by time gap.
        test_recipe:
          setup:
            - "Specimen s1 with leg L1 (from=CLINIC_A, to=HUB_B) already ARRIVED"
          trigger:
            - "POST /specimens/{s1}/transport-legs with from_location=HUB_C (≠ HUB_B), to_location=LAB_MAIN"
          assert:
            - "HTTP 422 ERR_TRANSPORT_CHAIN_BROKEN (location-contiguity violated)"

      - name: notification_ack_window_half_open_interval   # half-open time interval semantics
        grounds:
          - calculations.ack_deadline
          - calculations.attempt_escalation
          - state_machines.CriticalNotification.PENDING_to_ESCALATED
          - validations[priority=15]
        distinguishing_aspect: |
          DIFFERENT interval semantics than instance 1 (location-contiguity): here we have
          a HALF-OPEN time interval [first_sent_at, ack_deadline_at). The sweep escalates
          ONLY when now() >= ack_deadline_at (strict inclusive at the right). On a different
          resource entity (CriticalNotification, not TransportLeg/Specimen). Adjacency
          is by time, not by location.
        test_recipe:
          setup:
            - "Notification n1 with first_sent_at=T0, priority=ROUTINE => ack_deadline_at=T0+30 min"
          trigger:
            - "POST /_clock/advance to T0 + 29 minutes 59 seconds; POST /_sweep/run"
            - "Then POST /_clock/advance to T0 + 30 minutes; POST /_sweep/run"
          assert:
            - "After first sweep (T0+29:59): n1.status == PENDING (still inside the half-open interval)"
            - "After second sweep (T0+30:00): n1.status == ESCALATED (boundary reached, half-open right edge)"

  # =========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_retest_invariant_total_active_orders_per_patient
        grounds:
          - state_machines.RetestRequest.ISSUED_to_CANCELED
          - state_machines.LabOrder.ORDERED_to_CANCELED
          - entities.LabOrder.fields.status
          - entities.RetestRequest.fields.status
          - entities.RetestRequest.fields.new_lab_order_id
        distinguishing_aspect: |
          Conserved quantity: ACTIVE_ORDER_COUNT(patient_id) defined as
          count(LabOrder where patient_id=p AND status NOT IN {CANCELED, RELEASED, REJECTED}).
          When a SPECIMEN_REJECTED RetestRequest is issued (depth-3 cascade above), the count
          stays the same because the original moves to REJECTED while the new one becomes
          ORDERED. The compensating action POST /retest-requests/{id}/cancel that cancels
          a RetestRequest whose new LabOrder is still ORDERED MUST decrement the count
          back to the pre-cascade value (the +1 from the new ORDERED order is undone).
          Pinned formula:
            ACTIVE_ORDER_COUNT_AFTER_CASCADE_THEN_CANCEL == ACTIVE_ORDER_COUNT_BEFORE_CASCADE - 1
          (because the original is now REJECTED and the new one CANCELED).
        test_recipe:
          setup:
            - "Patient p1; create 3 LabOrders for p1: o1, o2, o3 all in ORDERED. ACTIVE_ORDER_COUNT=3"
            - "Walk o1 to IN_TRANSIT; POST /transport-legs/{L1}/report-break -> auto-creates RetestRequest rr1 with new_lab_order_id=o1b in ORDERED"
          trigger:
            - "POST /retest-requests/{rr1}/cancel"
          assert:
            - "After cascade BEFORE cancel: ACTIVE_ORDER_COUNT == 3 (o1=REJECTED removed, o1b=ORDERED added, o2/o3 unchanged)"
            - "After cancel: ACTIVE_ORDER_COUNT == 2 (o1=REJECTED, o1b=CANCELED, o2/o3 ORDERED) — conservation holds: 3 - 1 == 2"
            - "rr1.status == CANCELED; o1b.status == CANCELED"

      - name: amend_then_retract_invariant_total_critical_notifications_per_result
        grounds:
          - state_machines.LabResult.RELEASED_to_AMENDED
          - state_machines.LabResult.AMENDED_to_RETRACTED
          - entities.CriticalNotification
          - entities.AcknowledgementReceipt
        distinguishing_aspect: |
          DIFFERENT conserved quantity from instance 1 (which counted orders).
          Here the quantity is ACKED_NOTIFICATION_COUNT(lab_result_id) defined as
          count(CriticalNotification where lab_result_id=r AND status==ACKNOWLEDGED).
          Acknowledging notification n1, then amending to introduce a new critical
          analyte (creates n2 PENDING), then retracting the result MUST leave the
          ACKED count unchanged. Pinned formula:
            ACKED_NOTIFICATION_COUNT_AFTER_RETRACT == ACKED_NOTIFICATION_COUNT_AFTER_ACK
          (retract does not retroactively un-acknowledge ack receipts).
        test_recipe:
          setup:
            - "Result r1 released, n1 created PENDING; op1 acks n1 => n1.status=ACKNOWLEDGED. ACKED count = 1."
          trigger:
            - "POST /results/{r1}/amend with measurements making A2 newly critical (creates n2 PENDING for A2)"
            - "POST /results/{r1}/retract"
          assert:
            - "After amend: count(CriticalNotification for r1 with status=ACKNOWLEDGED) == 1; count with status=PENDING == 1 (n2)"
            - "After retract: count(CriticalNotification for r1 with status=ACKNOWLEDGED) == 1 (n1 unchanged); n2 stays PENDING (retract does not cancel pending notifications, only the audit event records retract)"
            - "Conservation: ACKED count before retract == ACKED count after retract == 1"
