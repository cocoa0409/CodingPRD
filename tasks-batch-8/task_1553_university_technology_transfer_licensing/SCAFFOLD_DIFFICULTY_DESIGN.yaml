            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv1}", share_bp: 3333 }, as: TechTransferOfficer, captures: { e1: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv2}", share_bp: 3333 }, as: TechTransferOfficer, captures: { e2: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv3}", share_bp: 3333 }, as: TechTransferOfficer, captures: { e3: "$.data.id" } }
            - { call: "POST /tlo/disclosure-entries/${e1}/confirm", payload: {}, as: Inventor, as_user_id: "${inv1}" }
            - { call: "POST /tlo/disclosure-entries/${e2}/confirm", payload: {}, as: Inventor, as_user_id: "${inv2}" }
            - { call: "POST /tlo/disclosure-entries/${e3}/confirm", payload: {}, as: Inventor, as_user_id: "${inv3}" }
            - { call: "GET /tlo/disclosures/${disc_id}", payload: {}, as: Any, captures: { disc_v: "$.data.version" } }
          trigger:
            - { call: "POST /tlo/disclosures/${disc_id}/inventorship/finalize", payload: { expected_disclosure_version: "${disc_v}" }, as: TechTransferOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SHARE_SUM_INVALID (9999 < 10000; one basis point short fails)"
            - "InventionDisclosure.${disc_id}.status remains INVENTORSHIP_REVIEW"
      - name: compliance_due_date_equality_boundary
        grounds:
          - calculations.compliance_due_date
        distinguishing_aspect: |
          Metric: submitted_at vs due_date (temporal), via the certify
          endpoint. submitted_at == due_date exactly is ON TIME
          (late_flag false); one second later flips late_flag true.
        test_recipe:
          setup:
            - "FEDERAL disclosure created at clock 2026-08-01T00:00:00Z -> created_at 2026-08-01T00:00:00Z"
            - "R1 INITIAL_DISCLOSURE (due = created + 180d = 2027-01-28T00:00:00Z) submitted for certification"
            - "R2 UTILIZATION_REPORT with client due_date 2027-01-28T00:00:00Z also submitted for certification"
          setup_api_calls:
            - { call: "POST /tlo/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Ada Lovelace", email: "ada@uni.edu", department_id: "${dept_id}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv_id: "$.data.id" } }
