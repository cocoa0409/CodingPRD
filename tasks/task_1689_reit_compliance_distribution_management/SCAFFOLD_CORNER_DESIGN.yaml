  # ===========================================================================
  # Section: validations — violation->error for rules not exercised by §1.8
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_ticker_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second POST /reits with an already-used ticker returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Reit with ticker DUPT exists"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "First", ticker: "DUPT", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
          trigger:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "Second", ticker: "DUPT", charter_ownership_limit_pct: 9.5, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE (http 409)"

      - name: second_asset_test_report_same_quarter_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "One AssetTestReport per quarter: a second create for the same (reit, quarter) returns ERR_DUPLICATE."
        test_recipe:
          setup: ["Reit R1 ACTIVE; quarter 2026-Q1; one DRAFT AssetTestReport exists"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "DUP2", ticker: "DUP2", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/asset-test-reports"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/asset-test-reports"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE (http 409)"

      - name: dividend_record_date_before_declaration_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "record_date earlier than declaration_date returns ERR_INVALID_DATE_RANGE (422) at creation time."
        test_recipe:
          setup: ["Reit R1 ACTIVE"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "DT REIT", ticker: "DTRE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
          trigger:
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 1000, declaration_date: "2026-03-10", record_date: "2026-03-05", payable_date: "2026-03-20", expected_reit_version: "${reit_v}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_DATE_RANGE (http 422)"

      - name: suspended_reit_blocks_dividend_create
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_REIT_SUSPENDED]"]
        distinguishing_aspect: "After an income-test breach suspends the REIT, POST /dividend-declarations is rejected with ERR_REIT_SUSPENDED."
        test_recipe:
          setup: ["Reit R1 SUSPENDED via an income test breach (quarter with only NON_QUALIFYING income 100000)"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "SUS REIT", ticker: "SUSR", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
