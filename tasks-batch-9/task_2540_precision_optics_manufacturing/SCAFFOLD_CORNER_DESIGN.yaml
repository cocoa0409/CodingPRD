      - name: the_thickness_threshold_scraps_an_order_on_its_first_rework_while_a_thinner_cut_survives
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.figuring_removal_convergence
          - calculations.metrology_acceptance_verdict
          - state_machines.WorkOrder.FIGURING_to_SCRAPPED
          - state_machines.WorkOrder.FIGURING_to_POLISHING
          - calculations.blank_conservation_ledger
        distinguishing_aspect: |
          Two thresholds guard the figuring loop and the thickness one is evaluated first: on the very
          first rework — iteration 1 of an allowed 2 — a cumulative removal of 1200 nm leaves 6198.8 um
          against a 6199.0 um minimum and the order is scrapped with MIN_THICKNESS_BREACH, not with
          FIGURE_CONVERGENCE_FAILURE. The twin order, identical but for a 100 nm figuring cut, leaves
          6199.1 um and takes the FIGURING -> POLISHING rework loop instead.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-THIN identical to the standard one except min_center_thickness_um 6199.0, so the thickness margin is 1.0 um on a 6200.0 um blank."
            - "A RELEASED lot GL-2540-1 with 20 blanks of blank_center_thickness_um 6200.0, certified H3/B."
            - "Interferometer IF-2540-1 calibrated at the clock's start value with base_uncertainty_waves 0.0010, so capability_ratio_at_scheduling is 0.0500."
            - "Two work orders WO-2540-A and WO-2540-B (element_count 2, reserved 3 each) each ran a POLISHING run removing 800.0 nm whose report (0.0200 waves, 0.8000 nm) was ACCEPTED against the POLISHING budget 0.025 * 3 == 0.0750, so both stand in FIGURING with cumulative_removal_nm 800.0 and remaining_center_thickness_um 6199.2."
            - "Both FIGURING reports measure 0.0400 waves, which exceeds the FIGURING budget 0.025 * 1 == 0.0250, so both verdicts are REWORK_REQUIRED; the transmitted-wavefront gate (0.0500 <= 0.1050) and the roughness gate (0.8000 <= 1.2) are satisfied."
            - "The two orders differ in one number only: the figuring run of WO-2540-A removes 400.0 nm and that of WO-2540-B removes 100.0 nm. Their windows are on different days, so the instrument's purge buffer is never involved."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-THIN", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050, min_center_thickness_um: 6199.0 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
              captures: { i1: $.data.id }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-A", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v2: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-B", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v2}" }
              as: ProcessTechnician
