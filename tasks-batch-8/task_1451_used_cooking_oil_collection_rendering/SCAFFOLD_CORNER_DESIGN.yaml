        excluded_because:
          difficulty_instance: theft_confirm_lock_skip_suspend_cascade
          rationale: "The full depth-4 cascade (confirm -> LOCKED -> SKIPPED -> count -> SUSPENDED) is asserted there."

  - section: consistency
    instances:
      - name: c_immediate_consistency_complete_response
        claim_type: immediate
        grounds: [state_machines.PickupVisit.EN_ROUTE_to_COMPLETED, calculations.pickup_net_gallons]
        distinguishing_aspect: "Immediate consistency: the complete response itself carries status COMPLETED and the computed net_gallons_provisional == 184.00 — no re-read needed."
        test_recipe:
          setup: ["customer ACTIVE with contract/container/truck; manifest 2026-08-05 dispatched; visit EN_ROUTE at clock 2026-08-05"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Imm House", site_address: "49 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 300, est_fill_rate_gal_per_week: 200, lock_code: "LKIM" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-C21", tank_capacity_gallons: 500 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/route-manifests/${man}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${v1}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
          trigger:
            - call: "POST /api/pickup-visits/${v1}/complete"
              payload: { pump_gallons: 200.00, field_moisture_pct: 8.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { st: $.data.status, net: $.data.net_gallons_provisional }
          assert:
            - "complete response has status == COMPLETED and net_gallons_provisional == 184.00 (200 x 0.92, 2dp half-up)"
            - "completed_at equals the logical clock timestamp 2026-08-05T08:00:00Z"
