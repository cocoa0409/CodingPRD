              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-STD5", name: "Std Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
