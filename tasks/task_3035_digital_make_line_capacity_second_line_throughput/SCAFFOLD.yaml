# =============================================================================
# SCAFFOLD — task_3035_digital_make_line_capacity_second_line_throughput
#
# Digital Make-Line Capacity & Second-Line Throughput Management (Chipotle):
# dual make-line design separating in-store queue from digital order assembly,
# digital order pacing where promised times throttle order acceptance during
# peaks, ingredient par cooking and batch timing with hold-time discard rules,
# portioning standards and yield tracking against theoretical food cost,
# order accuracy verification for customized digital bowls with lid labeling,
# staffing deployment by predicted transaction mix between the two lines,
# third-party marketplace order injection with separate pricing,
# ingredient shortage cascading into menu item suppression across channels.
# =============================================================================

scenario: |
  Digital Make-Line Capacity & Second-Line Throughput Management (Chipotle):
  dual make-line design separating in-store queue from digital order assembly,
  digital order pacing where promised times throttle order acceptance during
  peaks, ingredient par cooking and batch timing with hold-time discard rules,
  portioning standards and yield tracking against theoretical food cost,
  order accuracy verification for customized digital bowls with lid labeling,
  staffing deployment by predicted transaction mix between the two lines,
  third-party marketplace order injection with separate pricing,
  ingredient shortage cascading into menu item suppression across channels.

domain_name: digital-makeline-capacity
api_prefix: /api/v1

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Human-readable store code, unique per tenant" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: digital_line_capacity_per_interval, type: integer, source: input, description: "Maximum entrees the digital make-line can assemble per pacing interval" }
      - { name: instore_line_capacity_per_interval, type: integer, source: input, description: "Maximum entrees the in-store make-line can assemble per pacing interval" }
      - { name: pacing_interval_minutes, type: integer, source: input, description: "Length of one pacing window in minutes (e.g. 15)" }
      - { name: instore_promise_minutes, type: integer, source: input, default: 15, description: "Quoted minutes from placed_at to promised_at for IN_STORE orders" }
      - { name: overage_threshold_pct, type: number, source: input, description: "Fraction (0..1] of interval capacity above which promised-time throttling engages" }
      - { name: marketplace_commission_pct, type: number, source: input, description: "Marketplace commission as a fraction of marketplace gross (e.g. 0.22)" }
      - { name: digital_interval_load, type: integer, source: computed, default: 0, description: "Committed (not yet picked-up) entrees on the digital line in the current ProductionWindow" }
      - { name: instore_interval_load, type: integer, source: computed, default: 0, description: "Committed (not yet picked-up) entrees on the in-store line in the current ProductionWindow" }
      - { name: throttle_state, type: enum, source: computed, default: "OPEN", description: "OPEN | THROTTLED | CLOSED — derived from the current window's digital_committed vs capacity and overage_threshold_pct; governs only the current window, slotting overflows to later OPEN windows" }
      - { name: forecast_day_cents, type: integer, source: input, default: 0, description: "Forecast net revenue for the current business day in cents" }
      - { name: theoretical_food_cost_cents, type: integer, source: computed, default: 0, description: "Sum over completed orders of theoretical cost (recipe standard grams x unit cost)" }
      - { name: actual_food_cost_cents, type: integer, source: computed, default: 0, description: "Sum over discarded batch grams + consumed grams valued at unit cost" }
      - { name: food_cost_variance_bps, type: integer, source: computed, default: 0, description: "10000 * (actual - theoretical) / max(theoretical,1)" }
      - { name: current_business_day, type: string, source: system, description: "ISO date of the open business day, advanced by day_close" }

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: ingredient_code, type: string, source: input, description: "Stable code, e.g. CHICKEN, RICE_WHITE" }
      - { name: display_name, type: string, source: input, description: "Menu display name" }
      - { name: unit_cost_cents_per_gram, type: number, source: input, description: "Theoretical unit cost in cents per gram (e.g. 0.021)" }
      - { name: par_level_grams, type: integer, source: input, description: "Target on-hand grams at start of day" }
      - { name: hold_time_minutes, type: integer, source: input, description: "Minutes a cooked batch may be served before mandatory discard" }
      - { name: batch_size_grams, type: integer, source: input, description: "Standard cook batch size in grams" }
      - { name: on_hand_grams, type: integer, source: computed, default: 0, description: "Usable grams across all ACTIVE batches plus unbatched stock" }
      - { name: shortage_state, type: enum, source: computed, default: "STOCKED", description: "STOCKED | LOW | DEPLETED — derived from on_hand_grams vs par_level_grams" }

  - name: IngredientBatch
    parent: Ingredient
    common_fields: true
    fields:
      - { name: ingredient_id, type: string, source: system, description: "FK -> Ingredient.id; owning ingredient" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store cooking the batch" }
      - { name: cooked_at, type: datetime, source: input, description: "Timestamp the batch finished cooking" }
      - { name: grams_cooked, type: integer, source: input, description: "Grams cooked in this batch" }
      - { name: grams_remaining, type: integer, source: computed, description: "Grams not yet served or discarded; initialized to grams_cooked" }
      - { name: discard_at, type: datetime, source: computed, description: "cooked_at + Ingredient.hold_time_minutes" }
      - { name: discarded_grams, type: integer, source: computed, default: 0, description: "Grams discarded due to hold-time expiry or manual waste" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> DEPLETED | EXPIRED | WASTED" }

  - name: MenuItem
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; owning store" }
      - { name: item_code, type: string, source: input, description: "Menu item code, e.g. BOWL_CHICKEN" }
      - { name: display_name, type: string, source: input, description: "Customer-facing name" }
      - { name: base_price_cents, type: integer, source: input, description: "In-store / first-party digital base price in cents" }
      - { name: is_digital_eligible, type: boolean, source: input, default: true, description: "Whether the item may be sold on the digital make-line" }
      - { name: theoretical_cost_cents, type: integer, source: computed, default: 0, description: "Sum over RecipeComponent of standard_grams * unit_cost_cents_per_gram, rounded half-up" }
      - { name: suppression_state, type: enum, source: computed, default: "SELLABLE", description: "SELLABLE | SUPPRESSED_DIGITAL | SUPPRESSED_MARKETPLACE | SUPPRESSED_ALL — cascaded from ingredient shortage" }

  - name: RecipeComponent
    parent: MenuItem
    common_fields: true
    fields:
      - { name: menu_item_id, type: string, source: system, description: "FK -> MenuItem.id; owning menu item" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; component ingredient" }
      - { name: standard_grams, type: integer, source: input, description: "Standard portion grams per entree" }

  - name: MarketplaceChannel
    parent: null
    common_fields: true
    fields:
      - { name: channel_code, type: string, source: input, description: "e.g. DASH, EATS" }
      - { name: markup_pct, type: number, source: input, description: "Price markup fraction over base_price_cents applied to marketplace menu prices (e.g. 0.18)" }
      - { name: commission_pct, type: number, source: input, description: "Commission fraction taken by the marketplace on gross marketplace sales" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the channel currently injects orders" }

  - name: ProductionWindow
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; owning store" }
      - { name: interval_start, type: datetime, source: input, description: "Start of the pacing interval (inclusive)" }
      - { name: interval_end, type: datetime, source: input, description: "End of the pacing interval (exclusive); must equal interval_start + store.pacing_interval_minutes" }
      - { name: digital_capacity, type: integer, source: computed, description: "Snapshot of store.digital_line_capacity_per_interval at creation" }
      - { name: digital_committed, type: integer, source: computed, default: 0, description: "Entrees committed to the digital line in this window" }
      - { name: digital_completed, type: integer, source: computed, default: 0, description: "Entrees completed on the digital line in this window" }
      - { name: instore_committed, type: integer, source: computed, default: 0, description: "Entrees committed to the in-store line in this window" }
      - { name: status, type: enum, source: system, description: "OPEN -> CUTOFF -> SETTLED" }

  - name: Order
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; owning store" }
      - { name: channel, type: enum, source: input, description: "FIRST_PARTY_DIGITAL | IN_STORE | MARKETPLACE" }
      - { name: marketplace_channel_id, type: string, source: input, description: "FK -> MarketplaceChannel.id; required iff channel == MARKETPLACE" }
      - { name: external_order_ref, type: string, source: input, description: "Marketplace-provided reference; required iff channel == MARKETPLACE" }
      - { name: promised_at, type: datetime, source: computed, description: "Server-assigned promise time = selected window's interval_end (FIRST_PARTY_DIGITAL / MARKETPLACE) or placed_at + store.instore_promise_minutes (IN_STORE)" }
      - { name: placed_at, type: datetime, source: computed, description: "Server-stamped placement time from the logical clock" }
      - { name: line, type: enum, source: computed, description: "DIGITAL | IN_STORE — assigned at acceptance; MARKETPLACE maps to DIGITAL" }
      - { name: production_window_id, type: string, source: computed, description: "FK -> ProductionWindow.id; the window the order was committed into" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line gross prices before commission" }
      - { name: commission_cents, type: integer, source: computed, default: 0, description: "Marketplace commission withheld; 0 for non-marketplace" }
      - { name: net_revenue_cents, type: integer, source: computed, description: "subtotal_cents - commission_cents" }
      - { name: theoretical_cost_cents, type: integer, source: computed, description: "Sum of MenuItem.theoretical_cost_cents across lines" }
      - { name: entree_count, type: integer, source: computed, description: "Sum of OrderLine.quantity" }
      - { name: payment_status, type: enum, source: system, description: "AUTHORIZED -> CAPTURED | REFUNDED | VOIDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "PLACED -> ACCEPTED -> IN_PRODUCTION -> READY -> PICKED_UP | CANCELLED | EXPIRED" }
      - { name: accuracy_status, type: enum, source: system, default: "UNVERIFIED", description: "UNVERIFIED -> VERIFIED | MISMATCHED" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; owning order" }
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id; item ordered" }
      - { name: quantity, type: integer, source: input, description: "Number of entrees (>= 1)" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Gross unit price for the order's channel at placement (marketplace markup applied when MARKETPLACE)" }
      - { name: customizations, type: array, source: input, default: [], description: "List of {ingredient_id, action: EXTRA|LIGHT|NONE|SUB, sub_ingredient_id?}" }
      - { name: lid_label_code, type: string, source: computed, description: "Server-minted short code printed on the lid for accuracy verification" }
      - { name: accuracy_check, type: enum, source: system, default: "PENDING", description: "PENDING -> MATCHED | MISMATCHED" }

  - name: AccuracyVerification
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; order being verified" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of the LineWorker performing the check" }
      - { name: checked_components, type: integer, source: computed, description: "Number of OrderLines verified in this pass" }
      - { name: mismatched_lines, type: integer, source: computed, default: 0, description: "Number of OrderLines flagged MISMATCHED" }
      - { name: result, type: enum, source: system, description: "PASS -> FAIL" }
      - { name: created_at_note, type: string, source: system, description: "Reserved; verification pass ordinal" }

  - name: StaffingDeployment
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; owning store" }
      - { name: shift_date, type: string, source: input, description: "ISO date the deployment covers" }
      - { name: predicted_digital_mix_pct, type: number, source: input, description: "Predicted fraction of transactions on the digital line (0..1)" }
      - { name: predicted_instore_mix_pct, type: number, source: input, description: "Predicted fraction on the in-store line (0..1); must equal 1 - digital mix" }
      - { name: headcount, type: integer, source: input, description: "Total line workers scheduled" }
      - { name: digital_headcount, type: integer, source: computed, description: "round_half_up(headcount * predicted_digital_mix_pct)" }
      - { name: instore_headcount, type: integer, source: computed, description: "headcount - digital_headcount" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> LOCKED | SUPERSEDED" }

  - name: SuppressionEvent
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; owning store" }
      - { name: menu_item_id, type: string, source: system, description: "FK -> MenuItem.id; suppressed item" }
      - { name: ingredient_id, type: string, source: system, description: "FK -> Ingredient.id; depleted ingredient that caused the cascade" }
      - { name: scope, type: enum, source: system, description: "DIGITAL | MARKETPLACE | ALL — channels suppressed" }
      - { name: cause, type: enum, source: system, description: "SHORTAGE | MANUAL | RESTORED" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RESOLVED" }

  - name: WasteEvent
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; owning store" }
      - { name: ingredient_batch_id, type: string, source: input, description: "FK -> IngredientBatch.id; batch being wasted" }
      - { name: grams, type: integer, source: input, description: "Grams wasted" }
      - { name: reason, type: enum, source: input, description: "HOLD_TIME_EXPIRED | CONTAMINATION | OVERPRODUCTION" }
      - { name: cost_cents, type: integer, source: computed, description: "grams * ingredient.unit_cost_cents_per_gram, rounded half-up" }

  - name: DayClose
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; owning store" }
      - { name: business_day, type: string, source: computed, description: "The business day being closed (store.current_business_day)" }
      - { name: orders_accepted, type: integer, source: computed, description: "Count of orders reaching ACCEPTED on the day" }
      - { name: orders_completed, type: integer, source: computed, description: "Count of orders reaching PICKED_UP" }
      - { name: digital_net_revenue_cents, type: integer, source: computed, description: "Net revenue across digital + marketplace orders" }
      - { name: instore_net_revenue_cents, type: integer, source: computed, description: "Net revenue across in-store orders" }
      - { name: food_cost_variance_bps, type: integer, source: computed, description: "Snapshot of store.food_cost_variance_bps at close" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Store
    initial_state: OPEN
    terminal_states: []
    note: "throttle_state is a DERIVED projection over the earliest OPEN ProductionWindow (the 'current window'): it reflects that window's committed load vs capacity, not a global store lock. CLOSED means the current window is full — slotting then overflows to later OPEN windows; an order is rejected only when NO open window has room."
    transitions:
      - from: OPEN
        to: THROTTLED
        trigger: "system (automatic when the current window's digital_committed >= ceil(overage_threshold_pct * digital_line_capacity_per_interval) and < digital_line_capacity_per_interval)"
        actor: system
        preconditions: []
        side_effects:
          - "New digital orders are slotted to the NEXT open window (promised_at pushed +1 interval), not the current one"
      - from: THROTTLED
        to: CLOSED
        trigger: "system (automatic when the current window's digital_committed >= digital_line_capacity_per_interval)"
        actor: system
        preconditions: []
        side_effects:
          - "The current window accepts no further digital commitments; orders overflow to later OPEN windows. Only when every OPEN window is full is the order rejected with ERR_LINE_CAPACITY_EXCEEDED"
      - from: THROTTLED
        to: OPEN
        trigger: "system (automatic when the current window's load drops below ceil(threshold*capacity), e.g. after pickup/expiry/cancel releases committed entrees)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: OPEN
        trigger: "system (automatic when the current window's load drops below ceil(threshold*capacity), or the window cuts off and the next OPEN window becomes current)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: THROTTLED
        trigger: "system (automatic when the current window's load returns to [ceil(threshold*capacity), capacity))"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (automatic when a single order jumps the current window's load across both bands to >= capacity)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Order
    initial_state: PLACED
    terminal_states: [PICKED_UP, CANCELLED, EXPIRED]
    note: "Parallel dimensions: payment_status and fulfillment_status evolve independently; accuracy_status is a third axis."
    transitions:
      - from: PLACED
        to: ACCEPTED
        trigger: "system (automatic at creation when capacity, menu, and inventory checks pass)"
        actor: system
        preconditions:
          - "line capacity available in the selected ProductionWindow (ERR_LINE_CAPACITY_EXCEEDED)"
          - "every OrderLine.menu_item suppression_state permits the order's channel (ERR_ITEM_SUPPRESSED)"
          - "every component ingredient has on_hand_grams >= standard_grams * quantity (ERR_INSUFFICIENT_INGREDIENT)"
        side_effects:
          - "ProductionWindow.digital_committed or instore_committed += entree_count"
          - "Store.digital_interval_load or instore_interval_load += entree_count"
          - "Decrement IngredientBatch.grams_remaining FIFO by cooked_at; Ingredient.on_hand_grams -= consumed"
          - "payment_status stays AUTHORIZED"
      - from: ACCEPTED
        to: IN_PRODUCTION
        trigger: "POST /stores/{storeId}/orders/{orderId}/start-production"
        actor: LineWorker
        preconditions:
          - "Order.fulfillment_status == ACCEPTED"
          - "A StaffingDeployment for the order's line is PUBLISHED or LOCKED for shift_date == store.current_business_day (ERR_DEPLOYMENT_MISSING)"
        side_effects:
          - "payment_status AUTHORIZED -> CAPTURED"
      - from: IN_PRODUCTION
        to: READY
        trigger: "POST /stores/{storeId}/orders/{orderId}/mark-ready"
        actor: LineWorker
        preconditions:
          - "Order.fulfillment_status == IN_PRODUCTION"
          - "Every OrderLine.accuracy_check in {MATCHED} after at least one PASS AccuracyVerification (ERR_ACCURACY_UNVERIFIED)"
        side_effects:
          - "lid labels printed (lid_label_code surfaced)"
      - from: READY
        to: PICKED_UP
        trigger: "POST /stores/{storeId}/orders/{orderId}/pickup"
        actor: LineWorker
        preconditions:
          - "Order.fulfillment_status == READY"
        side_effects:
          - "Store.digital_interval_load or instore_interval_load -= entree_count"
          - "Store.theoretical_food_cost_cents += Order.theoretical_cost_cents"
      - from: READY
        to: EXPIRED
        trigger: "system (automatic when logical clock passes promised_at + 45 minutes without pickup)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status CAPTURED -> REFUNDED"
          - "Store interval load released"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /stores/{storeId}/orders/{orderId}/cancel"
        actor: StoreManager
        preconditions:
          - "fulfillment_status in {PLACED, ACCEPTED}"
        side_effects:
          - "Release committed capacity back to ProductionWindow and Store interval load"
          - "Restore consumed ingredient grams to the newest ACTIVE batch (created_at DESC tie-break: latest cooked_at)"
          - "payment_status -> VOIDED"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /stores/{storeId}/orders/{orderId}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "Same compensation as PLACED -> CANCELLED"

  - entity: IngredientBatch
    initial_state: ACTIVE
    terminal_states: [DEPLETED, EXPIRED, WASTED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (automatic when grams_remaining reaches 0 through order consumption)"
        actor: system
        preconditions: []
        side_effects:
          - "If ingredient on_hand_grams < par_level_grams * 0.25: shortage_state DEPLETED -> cascade SuppressionEvent ALL for dependent menu items"
          - "Else if < par_level_grams * 0.5: shortage_state LOW -> cascade SuppressionEvent MARKETPLACE"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock reaches discard_at with grams_remaining > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "WasteEvent created with reason HOLD_TIME_EXPIRED, grams = grams_remaining"
          - "Ingredient.on_hand_grams -= grams_remaining"
          - "Store.actual_food_cost_cents += expired grams * unit_cost"
          - "grams_remaining set to 0; discarded_grams += former grams_remaining"
      - from: ACTIVE
        to: WASTED
        trigger: "POST /stores/{storeId}/waste-events with reason CONTAMINATION or OVERPRODUCTION covering the batch"
        actor: LineWorker
        preconditions:
          - "Batch must be ACTIVE"
          - "waste grams == grams_remaining (full-batch waste) or partial waste keeps ACTIVE"
        side_effects:
          - "Ingredient.on_hand_grams -= grams"
          - "Store.actual_food_cost_cents += cost_cents"
          - "discarded_grams += grams"

  - entity: ProductionWindow
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CUTOFF
        trigger: "system (automatic when logical clock reaches interval_start)"
        actor: system
        preconditions: []
        side_effects:
          - "No new commitments into this window; late digital orders re-slot into the next OPEN window"
      - from: CUTOFF
        to: SETTLED
        trigger: "system (automatic at day_close, or when logical clock passes interval_end and all orders resolved)"
        actor: system
        preconditions: []
        side_effects:
          - "digital_completed reconciled against digital_committed; shortfall recorded on DayClose"

  - entity: StaffingDeployment
    initial_state: DRAFT
    terminal_states: [LOCKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /stores/{storeId}/staffing-deployments/{deploymentId}/publish"
        actor: StoreManager
        preconditions:
          - "predicted_digital_mix_pct + predicted_instore_mix_pct == 1 (within 1e-9)"
          - "headcount >= 2"
        side_effects: []
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /stores/{storeId}/staffing-deployments/{deploymentId}/lock"
        actor: GeneralManager
        preconditions:
          - "A different user than the publisher must lock (segregation of duties: X-User-ID of locker != X-User-ID of publisher) (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when a new deployment for the same shift_date is PUBLISHED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /stores/{storeId}/staffing-deployments (create with same shift_date supersedes existing DRAFT after OCC check)"
        actor: StoreManager
        preconditions:
          - "expected_store_version OCC check passes (ERR_STALE_VERSION)"
        side_effects:
          - "increments Store.version by 1"

  - entity: SuppressionEvent
    initial_state: ACTIVE
    terminal_states: [RESOLVED]
    transitions:
      - from: ACTIVE
        to: RESOLVED
        trigger: "system (automatic when the depleted ingredient's on_hand_grams recovers >= par_level_grams * 0.5 via a new batch cook) or POST /stores/{storeId}/suppression-events/{eventId}/resolve for MANUAL scope"
        actor: system
        preconditions: []
        side_effects:
          - "MenuItem.suppression_state recomputed: if no other ACTIVE SuppressionEvent covers the item -> SELLABLE"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: deployment-create-stale-store
    parent_entity: Store
    write_endpoint: "POST /stores/{storeId}/staffing-deployments"
    occ_field: "expected_store_version"
    description: |
      Creating a StaffingDeployment against a Store whose version has advanced
      since the client last observed it is rejected, because a competing
      deployment publish for the same shift_date may have legitimately
      superseded the client's plan. The loser observes a stale-version 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: day-close-stale-store
    parent_entity: Store
    write_endpoint: "POST /stores/{storeId}/day-close"
    occ_field: "expected_store_version"
    description: |
      Closing the business day against a Store whose version has advanced
      since the client last read it is rejected; order completions and waste
      events recorded after the client's read would be silently omitted from
      the close snapshot, so the stale writer is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: throttle_band
    trigger: "any mutation of the current ProductionWindow's digital_committed (order accept, pickup, expiry, cancel)"
    algorithm: threshold
    formula: |
      # The 'current window' is the earliest OPEN ProductionWindow whose
      # interval_end > now. L is that window's digital_committed (== the store's
      # digital_interval_load for that window).
      T = ceil(Store.overage_threshold_pct * Store.digital_line_capacity_per_interval)
      C = Store.digital_line_capacity_per_interval
      L = current_window.digital_committed
      if L >= C: throttle_state = CLOSED
      else if L >= T: throttle_state = THROTTLED
      else: throttle_state = OPEN
      # Boundary: L == T is THROTTLED (>=), L == C is CLOSED (>=).
      # T == C is legal (e.g. overage_threshold_pct = 1.0): the THROTTLED band
      # collapses and CLOSED wins because the CLOSED check is evaluated first.
      # CLOSED/THROTTLED describe the CURRENT window only; slotting overflows
      # to later OPEN windows and rejects only when no OPEN window has room.
    precision: "integer load; ceil on threshold"
    variants:
      - name: quote_extension
        when: "throttle_state == THROTTLED at order acceptance"
        difference: "promised_at is pushed to the NEXT open window's interval_end instead of the current window's"

  - name: marketplace_net_revenue
    trigger: "order acceptance on channel MARKETPLACE; recalc at cancel"
    algorithm: tiered_pricing
    formula: |
      # Per-line gross then sum vs sum then commission differ by rounding —
      # the scaffold pins per-line commission, rounded half-up per line.
      for each OrderLine:
        gross_line = round_half_up(MenuItem.base_price_cents * (1 + MarketplaceChannel.markup_pct)) * quantity
        commission_line = round_half_up(gross_line * MarketplaceChannel.commission_pct)
      subtotal_cents = sum(gross_line)
      commission_cents = sum(commission_line)
      net_revenue_cents = subtotal_cents - commission_cents
      # Non-marketplace channels: unit_price = base_price_cents, commission = 0.
    precision: "integer cents, round_half_up per line BEFORE summing (pinned order)"
    variants:
      - name: first_party_variant
        when: "channel in {FIRST_PARTY_DIGITAL, IN_STORE}"
        difference: "no markup and no commission; net_revenue_cents == subtotal_cents; the same OrderLines yield a different net under the two variants"

  - name: theoretical_vs_actual_food_cost
    trigger: "order pickup (theoretical) and WasteEvent / batch expiry (actual)"
    algorithm: aggregation
    formula: |
      theoretical_food_cost_cents = sum over PICKED_UP orders of
        sum over OrderLines of MenuItem.theoretical_cost_cents * quantity
      actual_food_cost_cents = sum over PICKED_UP orders of consumed grams * unit_cost
        + sum over WasteEvents of cost_cents
        + sum over EXPIRED batches of expired grams * unit_cost
      food_cost_variance_bps = round_half_up(10000 * (actual - theoretical) / max(theoretical, 1))
    precision: "integer cents and basis points, round_half_up"
    variants:
      - name: provisional_day
        when: "read before day_close"
        difference: "variance computed against live counters including unsettled waste; after day_close the DayClose snapshot freezes variance_bps and later waste posts to the next day"

  - name: fifo_consumption
    trigger: "order acceptance — decrementing ingredient grams"
    algorithm: chronological
    formula: |
      Consume from ACTIVE IngredientBatches ordered by cooked_at ASC,
      tie-break by created_at ASC (never by id). Take min(needed, grams_remaining)
      from each batch until the line's required grams are satisfied.
      If total grams_remaining across ACTIVE batches < required:
        reject ERR_INSUFFICIENT_INGREDIENT.
    precision: "integer grams"

  - name: suppression_cascade
    trigger: "Ingredient.on_hand_grams crossing LOW (0.5x par) or DEPLETED (0.25x par) thresholds, and recovery"
    algorithm: constraint_propagation
    formula: |
      on_hand_grams >= 0.5 * par_level_grams: STOCKED
      0.25 * par <= on_hand < 0.5 * par: LOW
        -> for every MenuItem with a RecipeComponent on this ingredient:
             if is_digital_eligible: create SuppressionEvent(scope=MARKETPLACE, cause=SHORTAGE)
             MenuItem.suppression_state = SUPPRESSED_MARKETPLACE
      on_hand < 0.25 * par: DEPLETED
        -> escalate every ACTIVE SHORTAGE SuppressionEvent for this ingredient to scope=ALL
        -> MenuItem.suppression_state = SUPPRESSED_ALL
      Recovery (new batch pushes on_hand >= 0.5 * par): resolve ACTIVE SHORTAGE
        events for the ingredient; recompute suppression_state per item.
      # Evaluation order: on_hand_grams first, then per-item cascade in
      # MenuItem.item_code ASC order (deterministic; never by id).
    constants:
      LOW_THRESHOLD: 0.5
      DEPLETED_THRESHOLD: 0.25

  - name: staffing_split
    trigger: "StaffingDeployment publish"
    algorithm: weighted_scoring
    formula: |
      digital_headcount = round_half_up(headcount * predicted_digital_mix_pct)
      instore_headcount = headcount - digital_headcount
      # round-half-up then complement keeps the sum exact; the alternative
      # (round both) can drift by 1 — the scaffold pins round-then-complement.
    precision: "integer headcount"

  - name: promise_slotting
    trigger: "FIRST_PARTY_DIGITAL / MARKETPLACE order acceptance"
    algorithm: waterfall_allocation
    formula: |
      # Walk ProductionWindows in interval_start ASC order (never by id).
      # Eligible window: status == OPEN AND interval_end > placed_at AND
      #   digital_committed + entree_count <= digital_capacity.
      # Skip the current window when throttle_state is THROTTLED or CLOSED
      #   (quote extension); continue to the next eligible OPEN window.
      # Take the FIRST eligible window in interval_start order.
      # If NO open window is eligible: ERR_LINE_CAPACITY_EXCEEDED.
      promised_at = selected_window.interval_end
    precision: "datetime, whole intervals"

  - name: verification_scoring
    trigger: "POST AccuracyVerification"
    algorithm: aggregation
    formula: |
      checked_components = count of OrderLines on the order
      mismatched_lines = count of lines whose checked ingredients differ from
        customizations + standard recipe (client submits per-line results)
      if mismatched_lines == 0: result = PASS, every OrderLine.accuracy_check = MATCHED,
        Order.accuracy_status = VERIFIED
      else: result = FAIL, mismatched lines' accuracy_check = MISMATCHED,
        Order.accuracy_status = MISMATCHED
      # FAIL leaves the order in IN_PRODUCTION; a reworked order can be
      # re-verified (cyclic accuracy_status: MISMATCHED -> VERIFIED allowed).
    precision: "integer counts"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (store, then child)"
    error_id: "ERR_STORE_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_MENU_ITEM_NOT_FOUND / ERR_BATCH_NOT_FOUND / ERR_DEPLOYMENT_NOT_FOUND / ERR_SUPPRESSION_EVENT_NOT_FOUND / ERR_CHANNEL_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "OCC expected_store_version matches current Store.version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /stores/{id}/staffing-deployments, POST /stores/{id}/day-close"
  - priority: 5
    category: state
    check: "Target entity in the required state for the transition (order lifecycle, batch ACTIVE, deployment DRAFT/PUBLISHED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6
    category: business_safety
    check: "Accuracy gate: mark-ready requires every OrderLine accuracy_check == MATCHED and at least one PASS verification"
    error_id: ERR_ACCURACY_UNVERIFIED
    http_status: 409
    applies_to: "POST /stores/{id}/orders/{id}/mark-ready"
  - priority: 7
    category: business_referential
    check: "Menu item suppression: every OrderLine item's suppression_state permits the order's channel (SELLABLE for all; SUPPRESSED_MARKETPLACE blocks MARKETPLACE only; SUPPRESSED_ALL blocks everything)"
    error_id: ERR_ITEM_SUPPRESSED
    http_status: 409
    applies_to: "POST /stores/{id}/orders"
  - priority: 8
    category: business_constraint
    check: "Ingredient sufficiency: FIFO-available grams >= required per line (customization EXTRA doubles the standard grams for that component)"
    error_id: ERR_INSUFFICIENT_INGREDIENT
    http_status: 409
    applies_to: "POST /stores/{id}/orders"
  - priority: 9
    category: business_temporal
    check: "Window capacity: an OPEN ProductionWindow must have digital_committed + entree_count <= digital_capacity for digital orders (in-store line: instore_committed + entree_count <= instore_line_capacity_per_interval)"
    error_id: ERR_LINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /stores/{id}/orders"
  - priority: 10
    category: business_constraint
    check: "Staffing deployment consistency: digital+instore mix == 1, headcount >= 2, shift_date not in the past"
    error_id: ERR_INVALID_DEPLOYMENT
    http_status: 422
    applies_to: "POST /stores/{id}/staffing-deployments, publish"
  - priority: 11
    category: business_constraint
    check: "Segregation of duties: deployment lock must be performed by a different X-User-ID than the publisher"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /stores/{id}/staffing-deployments/{id}/lock"
  - priority: 12
    category: business_fiscal
    check: "Day close requires all ProductionWindows for the day SETTLED and no order in {PLACED, ACCEPTED, IN_PRODUCTION}"
    error_id: ERR_DAY_NOT_CLOSABLE
    http_status: 409
    applies_to: "POST /stores/{id}/day-close"
  - priority: 13
    category: business_constraint
    check: "Marketplace order requires channel == MARKETPLACE to carry an ACTIVE MarketplaceChannel and a unique external_order_ref per channel"
    error_id: ERR_MARKETPLACE_REFERENCE_INVALID
    http_status: 422
    applies_to: "POST /stores/{id}/orders"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Drives hold-time expiry, promise expiry, and window cutoff."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Fire IngredientBatch ACTIVE -> EXPIRED for discard_at <= now"
      - "Fire Order READY -> EXPIRED for promised_at + 45min <= now"
      - "Fire ProductionWindow OPEN -> CUTOFF for interval_start <= now"

  # --- Store ---
  - method: POST
    path: "/api/v1/stores"
    description: "Create a store with dual make-line capacities and pacing config"
    roles: [PlatformAdmin]
    code: 201
    input: [store_code, name, digital_line_capacity_per_interval, instore_line_capacity_per_interval, pacing_interval_minutes, overage_threshold_pct, marketplace_commission_pct, "forecast_day_cents?"]
    output: Store
    side_effects: ["throttle_state=OPEN, loads=0, current_business_day = logical clock date"]

  - method: GET
    path: "/api/v1/stores"
    description: "List stores"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?"]
    output: "Store[]"
    side_effects: []

  - method: GET
    path: "/api/v1/stores/{storeId}"
    description: "Get one store"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: []
    output: Store
    side_effects: []

  # --- Ingredient ---
  - method: POST
    path: "/api/v1/ingredients"
    description: "Register an ingredient with par level, hold time, unit cost, batch size"
    roles: [PlatformAdmin]
    code: 201
    input: [ingredient_code, display_name, unit_cost_cents_per_gram, par_level_grams, hold_time_minutes, batch_size_grams]
    output: Ingredient
    side_effects: ["shortage_state=STOCKED, on_hand_grams=0"]

  - method: GET
    path: "/api/v1/ingredients"
    description: "List ingredients"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?"]
    output: "Ingredient[]"
    side_effects: []

  - method: GET
    path: "/api/v1/ingredients/{ingredientId}"
    description: "Get one ingredient"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: []
    output: Ingredient
    side_effects: []

  # --- IngredientBatch ---
  - method: POST
    path: "/api/v1/ingredients/{ingredientId}/batches"
    description: "Cook a batch; starts the hold-time clock"
    roles: [LineWorker, StoreManager]
    code: 201
    input: [store_id, cooked_at, grams_cooked]
    output: IngredientBatch
    side_effects:
      - "grams_remaining = grams_cooked; discard_at = cooked_at + hold_time_minutes"
      - "Ingredient.on_hand_grams += grams_cooked"
      - "Recovery: if on_hand crosses >= 0.5*par, resolve ACTIVE SHORTAGE SuppressionEvents (cause != MANUAL) and recompute MenuItem.suppression_state"

  - method: GET
    path: "/api/v1/ingredients/{ingredientId}/batches"
    description: "List batches for an ingredient"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "IngredientBatch[]"
    side_effects: []

  - method: GET
    path: "/api/v1/batches/{batchId}"
    description: "Get one batch"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: []
    output: IngredientBatch
    side_effects: []

  - method: GET
    path: "/api/v1/batches"
    description: "List batches filtered by ingredient or store (FK reverse reachability)"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?", "ingredient_id?", "store_id?", "status?"]
    output: "IngredientBatch[]"
