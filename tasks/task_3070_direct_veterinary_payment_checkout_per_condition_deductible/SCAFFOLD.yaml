  - method: POST
    path: "/vetpay/claims"
    description: "Submit a claim at checkout with invoice lines. Hospital must be ACTIVE; policy lifecycle ACTIVE."
    roles: [HospitalStaff]
    code: 201
    input: [policy_id, hospital_id, visit_date, claim_type, "lines"]
    output: Claim
    side_effects: ["ClaimLines created with seq 1..N in submission order; status=SUBMITTED; totals zeroed until adjudication"]
  - method: GET
    path: "/vetpay/claims"
    description: "List claims"
    roles: [PlatformAdmin, ClaimsAdjuster, HospitalStaff, PetOwner]
    code: 200
    input: ["policy_id?", "hospital_id?", "status?", "claim_type?", "payment_id?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []
  - method: GET
    path: "/vetpay/claims/{claimId}"
    description: "Get one claim (read triggers lazy PAID->SETTLED evaluation)"
    roles: [PlatformAdmin, ClaimsAdjuster, HospitalStaff, PetOwner]
    code: 200
    input: []
    output: Claim
    side_effects: ["lazy PAID->SETTLED evaluation against logical clock"]
  - method: GET
    path: "/vetpay/claims/{claimId}/lines"
    description: "List claim lines"
    roles: [PlatformAdmin, ClaimsAdjuster, HospitalStaff, PetOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClaimLine[]"
    side_effects: []
  - method: POST
    path: "/vetpay/claims/{claimId}/flag-preexisting-review"
    description: "Move a SUBMITTED claim into PREEXISTING_REVIEW"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> PREEXISTING_REVIEW, increments Claim.version by 1"]
  - method: POST
    path: "/vetpay/claims/{claimId}/clear-preexisting-review"
    description: "Return a PREEXISTING_REVIEW claim to SUBMITTED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> SUBMITTED, increments Claim.version by 1"]
  - method: POST
    path: "/vetpay/claims/{claimId}/adjudicate"
    description: "Run checkout adjudication (OCC on Claim.version)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["line categorization, per-condition deductible waterfall, per-line round_half_up reimbursement, totals written; status -> ADJUDICATED; increments Claim.version by 1; PolicyCondition rows created/updated"]
  - method: POST
    path: "/vetpay/claims/{claimId}/deny"
    description: "Deny a SUBMITTED/PREEXISTING_REVIEW claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: [denial_reason]
    output: Claim
    side_effects: ["status -> DENIED, increments Claim.version by 1"]
  - method: POST
    path: "/vetpay/claims/{claimId}/checkout-pay"
    description: "Pay the hospital directly at checkout. Idempotent by idempotency_key. simulate_outcome=FAILED injects a rail failure."
    roles: [HospitalStaff]
    code: 200
    input: [idempotency_key, "simulate_outcome?"]
    output: Payment
    side_effects: ["Payment created (SETTLED/POSTED or FAILED/PENDING_POST); Claim -> PAID or PAYMENT_FAILED; PolicyCondition.lifetime_reimbursed_cents updated on success; Hospital.running_ledger_balance_cents updated on success; increments Claim.version by 1; increments Hospital.version by 1 on success"]

  # --- ClaimAppeal ---
  - method: POST
    path: "/vetpay/claims/{claimId}/appeals"
    description: "Open an appeal on a DENIED or SETTLED claim"
    roles: [PetOwner]
    code: 201
    input: [reason_code]
    output: ClaimAppeal
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/vetpay/claims/{claimId}/appeals"
    description: "List appeals for a claim"
    roles: [PlatformAdmin, ClaimsAdjuster, PetOwner, HospitalStaff]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ClaimAppeal[]"
    side_effects: []
  - method: GET
    path: "/vetpay/appeals"
    description: "List appeals (filtered list form for FK reverse-reachability)"
    roles: [PlatformAdmin, ClaimsAdjuster, PetOwner, HospitalStaff]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: "ClaimAppeal[]"
    side_effects: []
  - method: GET
    path: "/vetpay/reconciliation-reports"
    description: "List reconciliation reports (filtered list form for FK reverse-reachability)"
    roles: [PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["hospital_id?", "status?", "limit?", "offset?"]
    output: "ReconciliationReport[]"
    side_effects: []
  - method: GET
    path: "/vetpay/appeals/{appealId}"
    description: "Get one appeal"
    roles: [PlatformAdmin, ClaimsAdjuster, PetOwner, HospitalStaff]
    code: 200
    input: []
    output: ClaimAppeal
    side_effects: []
  - method: POST
    path: "/vetpay/appeals/{appealId}/request-records"
    description: "Request medical records; sets records_due_at"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimAppeal
    side_effects: ["status -> RECORDS_REQUESTED, records_due_at set, increments ClaimAppeal.version by 1"]
  - method: POST
    path: "/vetpay/appeals/{appealId}/submit-records"
    description: "Hospital submits records for the appeal"
    roles: [HospitalStaff]
    code: 200
    input: [medical_record_ids]
    output: ClaimAppeal
    side_effects: ["MedicalRecord.appeal_id set on each; status -> UNDER_REVIEW, increments ClaimAppeal.version by 1"]
  - method: POST
    path: "/vetpay/appeals/{appealId}/resolve"
    description: "Resolve an appeal UPHELD or OVERTURNED (segregation of duties enforced)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [outcome, resolution_note]
    output: ClaimAppeal
    side_effects: ["status -> UPHELD | OVERTURNED; on OVERTURNED the underlying claim REOPENS and the payment reversal + clawback cascade fires; increments ClaimAppeal.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity-backed identity check fails (wrong hospital/owner)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, non-positive amount, enum violation, or TREATMENT line missing condition_code" }
  - { id: ERR_HOSPITAL_NOT_FOUND, http: 404, condition: "hospitalId does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "policyId (path or body) does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claimId does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appealId does not exist" }
  - { id: ERR_FILING_NOT_FOUND, http: 404, condition: "filingId does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "reportId does not exist" }
  - { id: ERR_RECORD_NOT_FOUND, http: 404, condition: "a medical_record_id does not exist or does not belong to the claim's policy" }
  - { id: ERR_HOSPITAL_NOT_APPROVABLE, http: 409, condition: "approve requires status APPLIED" }
  - { id: ERR_HOSPITAL_NOT_ACTIVE, http: 409, condition: "claim submission/adjudication requires Hospital.status == ACTIVE" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "claim submission/adjudication requires Policy.lifecycle_status == ACTIVE" }
  - { id: ERR_RATE_NOT_FILED, http: 422, condition: "no EFFECTIVE TerritoryRateFiling for (territory_code, species) with filing_effective_date <= coverage_start at policy creation" }
  - { id: ERR_FILING_RETROACTIVE, http: 422, condition: "filing_effective_date is before the current logical date at file time" }
  - { id: ERR_FILING_NOT_FILABLE, http: 409, condition: "file requires filing status DRAFT" }
  - { id: ERR_WAITING_PERIOD_ACTIVE, http: 409, condition: "claim_type waiting window has not elapsed at adjudication time" }
  - { id: ERR_PREEXISTING_CONDITION, http: 422, condition: "a TREATMENT line maps to a condition determined pre-existing by medical-record review" }
  - { id: ERR_CLAIM_NOT_ADJUDICATABLE, http: 409, condition: "adjudicate requires Claim.status in {SUBMITTED, PREEXISTING_REVIEW}" }
  - { id: ERR_CLAIM_NOT_PAYABLE, http: 409, condition: "checkout-pay requires Claim.status == ADJUDICATED (or PAYMENT_FAILED retry)" }
  - { id: ERR_APPEAL_NOT_OPENABLE, http: 409, condition: "appeals may be opened only on DENIED or SETTLED claims" }
  - { id: ERR_APPEAL_NOT_RESOLVABLE, http: 409, condition: "resolve requires appeal status in {OPEN, UNDER_REVIEW}" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 409, condition: "records submitted after records_due_at" }
  - { id: ERR_RECORD_ALREADY_ATTACHED, http: 409, condition: "a medical record is already attached to another appeal" }
  - { id: ERR_SELF_RESOLUTION_FORBIDDEN, http: 403, condition: "appeal resolver is the same adjuster who adjudicated or denied the claim" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version does not match the claim's current version (OCC)" }
  - { id: ERR_STALE_HOSPITAL_VERSION, http: 412, condition: "expected_hospital_version does not match the hospital's current version (OCC)" }
  - { id: ERR_CONDITION_CODE_REQUIRED, http: 400, condition: "TREATMENT line submitted without condition_code" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Insurer platform operator; onboards hospitals, manages lapse, runs reconciliation, controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /vetpay/hospitals"
      - "POST /vetpay/hospitals/{id}/approve"
      - "POST /vetpay/hospitals/{id}/suspend"
      - "POST /vetpay/hospitals/{id}/reinstate"
      - "POST /vetpay/hospitals/{id}/reconciliation-reports"
      - "POST /vetpay/reconciliation-reports/{id}/acknowledge"
      - "POST /vetpay/policies/{id}/mark-lapsed"
      - "POST /vetpay/policies/{id}/recalculate-premium"
      - "POST /vetpay/_clock/set_current_utc"
    shared_operations:
      - "POST /vetpay/policies (with PetOwner)"
      - "GET endpoints (shared broadly)"
  - name: RateFilingAdmin
    description: "Regulatory rate-filing specialist; manages TerritoryRateFiling lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /vetpay/rate-filings"
      - "POST /vetpay/rate-filings/{id}/file"
    shared_operations:
      - "GET /vetpay/rate-filings, GET /vetpay/rate-filings/{id}"
  - name: HospitalStaff
    description: "Staff of a veterinary hospital; submit claims, receive direct payment, upload records, dispute reconciliation"
    identity: "entity_backed:Hospital"
    exclusive_operations:
      - "POST /vetpay/hospitals/{id}/training-complete"
      - "POST /vetpay/claims"
      - "POST /vetpay/claims/{id}/checkout-pay"
      - "POST /vetpay/policies/{id}/medical-records"
      - "POST /vetpay/appeals/{id}/submit-records"
      - "POST /vetpay/reconciliation-reports/{id}/dispute"
    shared_operations:
      - "GET endpoints for own hospital, claims, policies"
  - name: ClaimsAdjuster
    description: "Adjudicates and denies claims, manages appeals (subject to segregation of duties on resolve)"
    identity: opaque
    exclusive_operations:
      - "POST /vetpay/claims/{id}/flag-preexisting-review"
      - "POST /vetpay/claims/{id}/clear-preexisting-review"
      - "POST /vetpay/claims/{id}/adjudicate"
      - "POST /vetpay/claims/{id}/deny"
      - "POST /vetpay/appeals/{id}/request-records"
      - "POST /vetpay/appeals/{id}/resolve"
    shared_operations:
      - "GET endpoints"
  - name: PetOwner
    description: "Policy owner; enrolls, cancels, and appeals"
    identity: "entity_backed:Policy"
    exclusive_operations:
      - "POST /vetpay/policies/{id}/cancel"
      - "POST /vetpay/claims/{id}/appeals"
    shared_operations:
      - "POST /vetpay/policies (with PlatformAdmin)"
      - "GET endpoints for own policy/claims/appeals/conditions/claim-lines/payments"
