  - rule_id: resource_temporal_overlap
    instances:
      - name: lease_half_open_zero_buffer_overlap_on_unit
        grounds:
          - calculations.occupancy_interval_overlap
          - validations[priority=8.5]
          - entities.Lease.fields.rent_start_date
          - entities.Lease.fields.rent_end_date
        distinguishing_aspect: |
          Lease overlap on a Unit uses half-open, zero-buffer interval arithmetic: a new lease
          [2026-05-01, 2026-12-01) intersecting an existing ACTIVE lease [2026-01-01, 2026-06-01) is
          rejected ERR_LEASE_OVERLAP, but an adjacent lease starting exactly at the prior rent_end_date
          [2026-06-01, ...) is accepted (half-open).
        test_recipe:
          setup:
            - "Unit U_mkt (MARKET, br1) in Building B; Household H1; an ACTIVE lease on U_mkt for [2026-01-01, 2026-06-01)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
