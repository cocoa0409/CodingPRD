              as_user_id: "u_ba_1"
              captures: { res_days: $.data.days_reserved, rem: $.data.days_remaining }
          assert:
            - "${a_hrs} == 8.00 and ${a_days} == 1, from ceil(8.00 / 8)"
            - "${a_copay} == 3200, from round_half_up(8.00 * 400)"
            - "${b_hrs} == 8.25 — raw 8.0167 h is stepped up by HOUR_ROUNDING_INCREMENT 0.25, not rounded down"
            - "${b_days} == 2, from ceil(8.25 / 8) — one extra minute of care doubles the day charge"
            - "${b_copay} == 3300, from round_half_up(round_half_up(8.25 * 2 / 2, 2) * 400)"
