              as: TransferAgentOperator
              captures: { plan_first: $.data.id }
          trigger:
            - call: "POST /systematic-plans"
              payload: { account_id: "${acc_oc}", plan_type: "SYSTEMATIC_INVESTMENT", source_share_class_id: "${sc_a}", amount: 900.00, frequency: "MONTHLY", next_run_date: "2026-09-01", expected_account_version: "${acc_oc_v}" }
