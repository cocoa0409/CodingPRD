            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-SUP", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "ssup@x.com", full_name: "S SUP", postal_code: "30040" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "SUP", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id, ro_v1: $.data.version } }
            - { call: "POST /v1/return-orders/${ro_id}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro_v1}" }, as: Shopper, as_user_id: "${sh_id}", captures: { lb_a: $.data.id } }
          trigger:
            - { call: "GET /v1/return-orders/${ro_id}", payload: {}, as: Shopper, as_user_id: "${sh_id}", captures: { ro_v_now: $.data.version } }
            - { call: "POST /v1/return-orders/${ro_id}/labels", payload: { label_type: QR_CODE, expected_return_order_version: "${ro_v_now}" }, as: Shopper, as_user_id: "${sh_id}", captures: { lb_b: $.data.id, lb_b_sup: $.data.supersedes_label_id } }
            - { call: "GET /v1/labels/${lb_a}", payload: {}, as: Shopper, as_user_id: "${sh_id}", captures: { lb_a_st: $.data.status } }
            - { call: "GET /v1/labels?supersedes_label_id=${lb_a}", payload: {}, as: Shopper, as_user_id: "${sh_id}", captures: { succ0: "$.data[0].id" } }
          assert:
            - "lb_a_st == SUPERSEDED"
            - "lb_b_sup == \"${lb_a}\" (chain link recorded)"
            - "succ0 == \"${lb_b}\" when filtered by supersedes_label_id=${lb_a}"

      - name: location_return_orders_subresource_lists_dropped_off
        claim_type: standard_crud
        grounds: [entities.ReturnOrder.fields.dropoff_location_id]
