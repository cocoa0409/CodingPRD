      - name: interpretation_blocked_until_the_red_flag_referral_is_acknowledged
        grounds:
          - validations[priority=18]
          - state_machines.Referral.SENT_to_ACKNOWLEDGED
          - state_machines.LabOrder.CRITICAL_ESCALATED_to_INTERPRETED
          - errors[ERR_RED_FLAG_UNACKNOWLEDGED]
        distinguishing_aspect: |
          Entity pair LabOrder -> Referral, a different pair from Dispense -> Protocol: the
          lab order's INTERPRETED transition is governed by the state of the auto-raised
          Referral, so the same interpret call fails while the referral is SENT and succeeds
          the moment it is ACKNOWLEDGED.
        test_recipe:
          setup:
            - "An ND and an OR patient with a collected SERUM_METABOLIC cash lab order"
            - "A critical potassium result has escalated the order and raised a RED_FLAG_AUTO referral in SENT"
          setup_api_calls:
