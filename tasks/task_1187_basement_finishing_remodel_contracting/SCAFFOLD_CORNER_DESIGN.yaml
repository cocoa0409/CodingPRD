        grounds: [calculations.warranty_coverage, entities.WarrantyClaim.fields.awarded_cents, "errors[ERR_INVALID_CLAIM_AMOUNT]"]
        distinguishing_aspect: "At elapsed day 370 coverage drops to 50%: claim A 180000 -> 90000; claim B 250000 hits MAX_AWARD_CENTS first (min 200000) -> 100000; claim C with claimed_cents 0 inside the window still fails ERR_INVALID_CLAIM_AMOUNT (fiscal, temporal passes)."
