    path: "/programs/{program_id}/sweep"
    description: "Expiry sweep: (1) expire ISSUED estimates with valid_until < now (applications -> WITHDRAWN/ESTIMATE_EXPIRED, application created_at ASC); (2) expire reservations with reservation_expires_at < now (applications -> WITHDRAWN/RESERVATION_EXPIRED, application created_at ASC); (3) queue promotion scan; (4) posture recompute"
