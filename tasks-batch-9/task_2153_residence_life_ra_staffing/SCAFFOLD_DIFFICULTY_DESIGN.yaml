  - rule_id: compensating_invariant
    instances:

      - name: floor_budget_three_bucket_partition_restored_by_program_cancel
        grounds:
          - state_machines.ProgramEvent.PROPOSED_to_APPROVED
          - state_machines.ProgramEvent.APPROVED_to_CANCELLED
          - entities.Floor.fields.programming_budget_cents
          - entities.Floor.fields.programming_encumbered_cents
          - entities.Floor.fields.programming_spent_cents
          - entities.Floor.fields.programming_available_cents
        distinguishing_aspect: |
          The conserved quantity is MONETARY: Floor.programming_budget_cents must always equal
          available + encumbered + spent. Approving encumbers 40000 (100000 = 60000 + 40000 + 0)
          and the compensating CANCEL must return exactly 40000 to available
          (100000 = 100000 + 0 + 0) with zero drift and zero movement into the spent bucket.
        test_recipe:
          setup:
            - "Kerr Hall floor 2 with a CERTIFIED, ACTIVE RA assigned to it."
            - "Floor 2 has programming_budget_cents 100000, programming_available_cents 100000, encumbered 0, spent 0."
            - "ProgramEvent 'Wellness Walk' (WELLNESS, requested_amount_cents 40000) has been APPROVED."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Ada Ray", email: "ada@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_ada_id: $.data.id }
            - call: "POST /residence-life/ra-applications"
              payload: { applicant_student_id: "${s_ada_id}", term_code: "2026FA", essay_ref: "E-ADA" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { app_id: $.data.id }
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_ada_id}"
            - call: "POST /residence-life/ra-applications/${app_id}/review"
              payload: { interview_score: 88 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/decision"
              payload: { decision: "OFFER" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/response"
              payload: { response: "ACCEPT" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { ra_id: $.data.created_ra_id }
            - call: "POST /residence-life/ras/${ra_id}/floor-assignment"
              payload: { floor_id: "${f_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/employment"
              payload: { action: "ACTIVATE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/certification"
              payload: { action: "START_TRAINING" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "CRISIS" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "TITLE_IX" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "FIRE_SAFETY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "DIVERSITY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/certification"
              payload: { action: "CERTIFY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/floors/${f_id}/budget-allocations"
              payload: { amount_cents: 100000, term_code: "2026FA" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/program-events"
              payload: { floor_id: "${f_id}", title: "Wellness Walk", category: "WELLNESS", scheduled_for: "2026-08-04T17:00:00Z", requested_amount_cents: 40000 }
              as: ResidentAssistant
              as_user_id: "${ra_id}"
              captures: { pe_id: $.data.id }
            - call: "POST /residence-life/program-events/${pe_id}/decision"
              payload: { decision: "APPROVE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "POST /residence-life/program-events/${pe_id}/outcome"
              payload: { action: "CANCEL" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          assert:
            - "Before the trigger: Floor.${f_id}.programming_available_cents == 60000, programming_encumbered_cents == 40000, programming_spent_cents == 0"
            - "After the trigger: Floor.${f_id}.programming_available_cents == 100000"
            - "After the trigger: Floor.${f_id}.programming_encumbered_cents == 0"
            - "After the trigger: Floor.${f_id}.programming_spent_cents == 0"
            - "After the trigger: Floor.${f_id}.programming_budget_cents == 100000 and budget == available + encumbered + spent"
            - "ProgramEvent.${pe_id}.status == CANCELLED and ProgramEvent.${pe_id}.encumbered_amount_cents == 0"
            - "Floor.${f_id}.held_program_count == 0 and Floor.${f_id}.programming_compliance_status == PENDING"

      - name: building_assigned_bed_count_conserved_across_move_and_revert
        grounds:
          - state_machines.RoomChangeCase.APPROVED_to_COMPLETED
          - state_machines.RoomChangeCase.COMPLETED_to_REVERTED
          - entities.Building.fields.assigned_bed_count
          - entities.Room.fields.occupied_beds
          - entities.Student.fields.current_room_id
          - entities.RoomChangeCase.fields.reverted_from_room_id
        distinguishing_aspect: |
          The conserved quantity is a HEADCOUNT, not money: Building.assigned_bed_count must
          read 3 before the move, after the move and after the revert, and every Room must
          return to the exact occupied_beds it held before completion (201 back to 2, 202 back
          to 1) rather than merely to a consistent total.
        test_recipe:
          setup:
            - "Kerr Hall floor 2 with rooms 201 and 202, each bed_capacity 2."
            - "Dee Sun and Eli Cross occupy room 201 (occupied_beds 2); Fay Ito occupies room 202 (occupied_beds 1)."
            - "Building.assigned_bed_count is 3."
            - "A SELF_REQUEST RoomChangeCase for Dee Sun from room 201 to room 202 has been APPROVED and then COMPLETED."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
