            - "link 2 — Enrollment.${e1_id}.roster_status == DROPPED with drop_effective_date == 2026-08-20 (the withdrawal date is not after the clock date, so the row reaches DROPPED rather than PENDING_DROP)"
            - "link 2 — Section.${sec1_id}.active_enrollment_count == 0"
            - "link 3 — AppAccount.${a1_id}.seat_status == RELEASED, identity_status == DEPROVISIONED, password_state == EXPIRED and refunded_charge_cents == 1000 (release inside the add/drop window refunds the whole 1000)"
            - "link 4 — BuildingAllocation.${alloc_id}.consumed_seats == 0 and borrowed_seats == 0, while allocated_seats is unchanged at 4"
            - "link 4 — VendorApp.${va_id}.consumed_seats == 0, committed_charge_cents == 0, renewal_score == 0.00 and renewal_recommendation == DROP"
            - "link 4 — School.${sch_ne_id}.enrolled_student_count == 0"
            - "GET /rostering/app-accounts?student_id=${s1_id} still returns the released row — this is a state cascade, not a delete"

