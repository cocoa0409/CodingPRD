      - consumer_id
      - score_model_id
      - score_result_id?
    output: ReferenceSet
    side_effects:
      - "status=COMPILED, reason_code_id=null"
      - "when score_result_id is supplied, that posting's consumer_id must equal consumer_id (ERR_REFERENCE_SET_CONSUMER_MISMATCH) and its score_model_id must equal score_model_id (ERR_INVALID_REQUEST); the posting's reference_set_id is rebound to the new set and effective_score and odds_at_posted_score are re-derived against its effective variant"

  - method: GET
    path: "/reference-sets/{referenceSetId}"
    description: "Get a reference set"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ScoreConsumer]
    code: 200
    input: []
    output: ReferenceSet
    side_effects: []

  - method: GET
    path: "/reference-sets"
    description: "List reference sets, filterable by consumer, model and bound reason code"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ScoreConsumer]
    code: 200
    input:
      - "consumer_id?"
      - "score_model_id?"
      - "reason_code_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: ReferenceSet[]
    side_effects: []

  - method: POST
    path: "/reference-sets/{referenceSetId}/attach-reason-code"
    description: "Bind a reason code to a reference set; cascades C10 hop 1"
    roles: [FairLendingOfficer]
    code: 200
    input: [reason_code_id, expected_reference_set_version]
    output: ReferenceSet
    side_effects:
      - "status COMPILED → BOUND, reason_code_id recorded, ReasonCode.bind_count += 1"
      - "hop 1 of C10: every ScoreResult on this reference set re-derives effective_score and odds_at_posted_score"
      - "increments ReferenceSet.version by 1"

  - method: POST
    path: "/reference-sets/{referenceSetId}/detach-reason-code"
    description: "Unbind a reason code and reset the set to COMPILED"
    roles: [FairLendingOfficer]
    code: 200
    input: [expected_reference_set_version]
    output: ReferenceSet
    side_effects:
      - "status BOUND → COMPILED, reason_code_id cleared"
      - "hop 2 of C10: decision reset to UNDECIDED on every ScoreResult of this set"
      - "increments ReferenceSet.version by 1"

  - method: POST
    path: "/reference-sets/{referenceSetId}/reconcile"
    description: "Reconcile a bound reference set against an archived reason code"
    roles: [FairLendingOfficer]
    code: 200
    input: [expected_reference_set_version]
    output: ReferenceSet
    side_effects:
      - "status BOUND → RECONCILED, reason_code_id cleared"
      - "hop 2 of C10: decision reset to UNDECIDED on every ScoreResult of this set"
      - "increments ReferenceSet.version by 1"

  # --- ScoreResult ----------------------------------------------------------
  - method: POST
    path: "/score-results"
    description: "Post a score under a license; settles pricing, evaluates the cutoff snapshot and consumes a discovery slot"
    roles: [ScoreConsumer]
    code: 201
    input:
      - consumer_id
      - score_variant_id
      - bureau_id
      - license_id
      - raw_posted_score
      - expected_license_version
      - discovery_tag?
      - migration_event_id?
    output: ScoreResult
    side_effects:
      - "effective_score and odds_at_posted_score computed from §1.3 score_effective_and_odds"
      - "cutoff_score is the licence's snapshot cut-off: the consumed RECALIBRATED anchor's new_cutoff_score_preserving when one applies, otherwise the effective variant's cutoff_baseline"
      - "decision evaluated against cutoff_score: APPROVE when effective_score > cutoff_score, DECLINE when it is less, UNDECIDED when equal"
      - "a DECLINE binds decision_reason_code_id to the ACTIVE PRIMARY ReasonCode on the effective variant carrying the lexicographically lowest composite_code"
      - "reference_set_id is bound to the most recently created ReferenceSet, ordered by created_at descending and ties by ascending creator identifier, belonging to the same consumer whose score_model_id equals the posting variant's model; when no such set exists the field is null"
      - "a MARGINAL_PRICING FeeLedgerEntry is appended and License.cumulative_fee_cents / cumulative_score_count advance"
      - "a registry discovery request carrying discovery_tag moves REGISTERED → CONSUMED and consumed_score_result_id is bound to this posting; a second posting carrying the same tag is refused with ERR_DISCOVERY_TAG_UNKNOWN"
      - "a supplied migration_event_id must match the consumer, the licence, the model family and the from/to variant pair of the earliest unconsumed eligible event for this lender_code (ERR_INVALID_REQUEST); consumption adds its credited_delta_bps to the consuming licence's window_credited_delta_bps and refreshes window_outcome_mixture_ratio_ppm"
      - "Consumer.model_undecided_count and latest_uploaded_at are recomputed"
      - "increments License.version by 1"

  - method: GET
    path: "/score-results/{scoreResultId}"
    description: "Get a score posting"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ScoreConsumer]
    code: 200
    input: []
    output: ScoreResult
    side_effects: []

  - method: GET
    path: "/score-results"
    description: "List score postings, filterable by consumer, variant, bureau, reference set, license and reason code"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ScoreConsumer]
    code: 200
    input:
      - "consumer_id?"
      - "score_variant_id?"
      - "bureau_id?"
      - "reference_set_id?"
      - "license_id?"
      - "decision_reason_code_id?"
      - "migration_event_id?"
      - "decision?"
      - "limit?"
      - "offset?"
    output: ScoreResult[]
    side_effects: []

  - method: GET
    path: "/score-results/{scoreResultId}/bureau-discrepancies"
    description: "Computed read: cross-bureau spread and flagged peer postings for a score"
    roles: [BureauAdministrator, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ScoreConsumer]
    code: 200
    input: []
    output: "{ poster_effective_score: integer, peer_spread: integer, flagged_peer_count: integer, peer_bureau_codes: array }"
    side_effects: ["reads §1.3 bureau_discrepancy_scan; no mutation"]

  - method: POST
    path: "/score-results/{scoreResultId}/void"
    description: "Void a posting and reverse its marginal fee exactly"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_license_version]
    output: ScoreResult
    side_effects:
      - "a VOID_REVERSAL FeeLedgerEntry is appended with fee_cents equal to the negation of the posting's marginal charge"
      - "License.cumulative_score_count decrements; cumulative_fee_cents is recomputed from the ledger"
      - "Consumer.model_undecided_count and latest_uploaded_at are recomputed"
      - "increments License.version by 1"

