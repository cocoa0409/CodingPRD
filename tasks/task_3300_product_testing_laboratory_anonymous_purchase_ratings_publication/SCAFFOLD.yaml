    roles: [LabManager, EditorialDirector, MethodologyOfficer, SurveyDirector, SafetyOfficer, ContentEditor, ComplianceOfficer, PurchasingAgent, LabTechnician]
    code: 200
    input: ["category_id?", "status?"]
    output: "TestProgram[]"
    side_effects: []
  - method: GET
    path: "/test-programs/{id}"
    description: "read program"
    roles: [LabManager, EditorialDirector, MethodologyOfficer, SurveyDirector, SafetyOfficer, ContentEditor, ComplianceOfficer, PurchasingAgent, LabTechnician]
    code: 200
    input: []
    output: TestProgram
    side_effects: []
  - method: POST
    path: "/test-programs/{id}/transitions"
    description: "action approve | start_sourcing | start_testing | start_scoring | ready | cancel per TestProgram machine"
    roles: [LabManager, EditorialDirector]
    code: 200
    input: [action]
    output: TestProgram
    side_effects: ["per-transition cascades", "version +1"]
  - method: POST
    path: "/lab-protocols"
    description: "create DRAFT protocol; convenience weight computed"
    roles: [LabManager]
    code: 201
    input: [category_id, protocol_code, measurement_repeat_min, perf_weight_pct, reliability_weight_pct]
    output: LabProtocol
    side_effects: ["convenience_weight_pct computed"]
  - method: GET
    path: "/lab-protocols"
    description: "list protocols; optional filters category_id, status, limit, offset"
    roles: [LabManager, EditorialDirector, MethodologyOfficer, LabTechnician, ContentEditor]
    code: 200
    input: ["category_id?", "status?"]
    output: "LabProtocol[]"
    side_effects: []
  - method: GET
    path: "/lab-protocols/{id}"
    description: "read protocol"
    roles: [LabManager, EditorialDirector, MethodologyOfficer, LabTechnician, ContentEditor]
    code: 200
    input: []
    output: LabProtocol
    side_effects: []
  - method: POST
    path: "/lab-protocols/{id}/transitions"
    description: "action submit_review | return_draft | activate | retire per LabProtocol machine; activate requires expected_category_version (OCC, optional field, mandatory for activate)"
    roles: [LabManager, MethodologyOfficer]
    code: 200
    input: [action, "expected_category_version?"]
    output: LabProtocol
    side_effects: ["activate supersedes prior ACTIVE and bumps category version", "version +1"]
  - method: POST
    path: "/test-samples"
    description: "plan sample for program; program status must be IN {PROPOSED, APPROVED}"
    roles: [LabManager]
    code: 201
