  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: confirm_with_correct_field_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-booking-stale-field]", entities.Field.fields.version]
        distinguishing_aspect: "Confirming a booking with expected_field_version equal to the live Field.version succeeds and increments Field.version by 1."
        test_recipe:
          setup: ["Arena clock set; field at version v0; WALK_IN booking HELD"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CX1", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fx1", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
          assert:
            - "Booking.${booking_id}.status == CONFIRMED"
            - "Field.${field_id}.version == ${field_v0} + 1"

      - name: confirm_with_stale_field_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-booking-stale-field]", "errors[ERR_STALE_FIELD_VERSION]"]
        distinguishing_aspect: "After one booking confirm bumps Field.version, a second booking confirm still carrying the pre-bump expected_field_version is rejected with ERR_STALE_FIELD_VERSION 412."
        test_recipe:
          setup: ["Arena clock set; field at v0; two HELD bookings on the field with non-overlapping windows; first booking confirmed (Field.version -> v0+1)"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CX2", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fx2", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking1: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "RESERVATION", party_size: 4, window_start: "2026-06-15T11:00:00Z", window_end: "2026-06-15T12:00:00Z" }
              as: FrontDesk
              captures: { booking2: $.data.id }
            - call: "POST /bookings/${booking1}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
          trigger:
            - call: "POST /bookings/${booking2}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_FIELD_VERSION"

      - name: advance_round_stale_league_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[advance-round-stale-league]", "errors[ERR_STALE_LEAGUE_VERSION]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / league_cyclic_open_lock_advance
          rationale: "The advance-round happy path and version bump are exercised by the cyclic §1.8 instance; the stale-league negative is its OCC twin and is asserted as the failure path there. Listed here for breadth traceability."

      - name: derived_marker_available_count_reconciles_on_reserve
        claim_type: derived_field_reconciliation
        grounds: [entities.Arena.fields.marker_available_count, state_machines.EquipmentUnit.AVAILABLE_to_RESERVED]
        distinguishing_aspect: "Provisioning two markers sets marker_available_count 2; reserving one for a booking reconciles it to 1."
