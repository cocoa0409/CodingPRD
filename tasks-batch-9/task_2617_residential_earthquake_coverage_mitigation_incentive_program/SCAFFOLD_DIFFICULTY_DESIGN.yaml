            - "after the PASS disburses A: ${s3_res} == 300000, ${s3_dis} == 250000, ${s3_unc} == 450000 - uncommitted_cents does NOT move on disbursement, only reserved -> disbursed (sum 1000000)"
            - "${pol_a_mit} == \"DISCOUNT_APPLIED\", ${pol_a_base} == 83200, ${pol_a_disc} == 16640 (25% scope less the 5% grant offset), ${pol_a_annual} == 66560, ${pol_a_credit} == 13631 (16640 * 299 / 365, 299 whole days left of the term at 2026-10-05T09:00:00Z)"
