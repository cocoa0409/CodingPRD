# §1.8 Test Targeting Index for task_2187 (bakery-ingredient-distribution).
# Every `call:` path is absolute and includes the api_prefix "/bakery-distribution".
# Every money/score literal in `assert:` was computed by executing the named
# §1.3 formula with its declared `constants:` (see each instance's worked
# arithmetic in `distinguishing_aspect` / `setup:`).
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_flour_price_provisional_order_date_vs_final_delivery_date_index
        grounds:
          - calculations.contract_line_settlement_price
          - calculations.order_line_extended_price
          - calculations.order_total_settlement
          - entities.ForwardPricingContract.fields.pricing_mode
          - entities.OrderLine.fields.unit_price_cents
          - state_machines.Order.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          Entity domain 1 = commercial pricing on Order/OrderLine: with contract.pricing_mode
          DELIVERY_DATE_INDEX the provisional_order_date variant settles the flour line at the
          2026-07-01 quote (38 + basis 6 = 44 c/lb, total 866404) while the final_delivery_date
          variant settles the identical line at the 2026-09-10 quote (47 + 6 = 53 c/lb, total
          1043623) - two different numbers from identical order inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Sunrise Bakehouse ACTIVE with credit_limit_cents 5000000 and min_drop_cents 25000."
            - "Two HRW_WHEAT quotes published: effective_on 2026-07-01 at 38 c/lb and effective_on 2026-09-10 at 47 c/lb."
            - "ForwardPricingContract ACTIVE, pricing_mode DELIVERY_DATE_INDEX, term 2026-08-01..2026-12-31, one ContractLine on the flour SKU with volume_committed_lb 100000 and basis_cents_per_lb 6."
            - "One BAGGED order of 20000 lb flour submitted (pricing_status PROVISIONAL, total_cents 866404), allocated from a 50000 lb flour lot, routed, sealed, dispatched and delivered on 2026-09-15 (delivered_on 2026-09-15)."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Sunrise Bakehouse", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am-1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-HRW-50", category: "FLOUR", allergen_class: "GLUTEN", bulk_capable: true, shelf_life_days: 180, index_code: "HRW_WHEAT", list_price_cents_per_lb: 42, min_rotation_days: 30 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { flour_id: $.data.id }
            - call: "POST /bakery-distribution/index-quotes"
              payload: { index_code: "HRW_WHEAT", effective_on: "2026-07-01T00:00:00Z", price_cents_per_lb: 38 }
              as: PricingController
              as_user_id: "pc-1"
            - call: "POST /bakery-distribution/index-quotes"
              payload: { index_code: "HRW_WHEAT", effective_on: "2026-09-10T00:00:00Z", price_cents_per_lb: 47 }
              as: PricingController
              as_user_id: "pc-1"
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-GLU-01", allergen_class: "GLUTEN" }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { zone_glu_id: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-FLR-9001", product_id: "${flour_id}", zone_id: "${zone_glu_id}", manufactured_on: "2026-07-15T00:00:00Z", quantity_received_lb: 50000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { lot_flour_id: $.data.id }
            - call: "POST /bakery-distribution/forward-contracts"
              payload: { customer_id: "${cust_id}", term_start_on: "2026-08-01T00:00:00Z", term_end_on: "2026-12-31T00:00:00Z", pricing_mode: "DELIVERY_DATE_INDEX" }
              as: AccountManager
              as_user_id: "am-1"
              captures: { contract_id: $.data.id }
            - call: "POST /bakery-distribution/forward-contracts/${contract_id}/lines"
              payload: { product_id: "${flour_id}", volume_committed_lb: 100000, basis_cents_per_lb: 6 }
              as: AccountManager
              as_user_id: "am-1"
              captures: { cl_flour_id: $.data.id }
            - call: "POST /bakery-distribution/forward-contracts/${contract_id}/offer"
              payload: {}
              as: AccountManager
              as_user_id: "am-1"
            - call: "POST /bakery-distribution/forward-contracts/${contract_id}/activate"
              payload: {}
              as: PricingController
              as_user_id: "pc-1"
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-15T00:00:00Z", contract_id: "${contract_id}" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/lines"
              payload: { product_id: "${flour_id}", quantity_lb: 20000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { prov_total: $.data.total_cents, prov_subtotal: $.data.subtotal_cents }
            - call: "POST /bakery-distribution/orders/${order_id}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
            - call: "POST /bakery-distribution/routes"
              payload: { route_code: "R-DDI-01", service_on: "2026-09-15T00:00:00Z", vehicle_capacity_lb: 24000, service_buffer_minutes: 30 }
              as: LogisticsPlanner
              as_user_id: "lp-1"
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /bakery-distribution/routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_start_at: "2026-09-15T08:00:00Z", window_end_at: "2026-09-15T10:00:00Z", expected_route_version: "${route_v}" }
              as: LogisticsPlanner
              as_user_id: "lp-1"
              captures: { stop_id: $.data.id }
            - call: "POST /bakery-distribution/routes/${route_id}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "lp-1"
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/routes/${route_id}/dispatch"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "lp-1"
            - call: "POST /bakery-distribution/route-stops/${stop_id}/deliver"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
          trigger:
            - call: "POST /bakery-distribution/orders/${order_id}/finalize-pricing"
              payload: {}
              as: PricingController
              as_user_id: "pc-1"
              captures: { final_total: $.data.total_cents }
          assert:
            - "${prov_total} == 866404"
            - "${prov_subtotal} == 853600"
            - "Order.${order_id}.pricing_status == FINAL"
            - "OrderLine.${line_id}.unit_price_cents == 53"
            - "OrderLine.${line_id}.extended_cents == 1028200"
            - "Order.${order_id}.subtotal_cents == 1028200"
            - "Order.${order_id}.fuel_surcharge_cents == 25705"
            - "Order.${order_id}.volume_rebate_cents == 10282"
            - "Order.${order_id}.total_cents == 1043623"
            - "${final_total} != ${prov_total}"

      - name: dual_variant_allergen_risk_exposure_provisional_vs_exposure_audited
        grounds:
          - calculations.customer_allergen_risk_score
          - entities.Customer.fields.allergen_risk_score
          - entities.Customer.fields.risk_tier
          - state_machines.Order.NEW_to_ALLOCATED
          - state_machines.Order.LOADED_to_DELIVERED
        distinguishing_aspect: |
          Entity domain 2 = food-safety risk scoring on Customer (not Order pricing): the same
          customer holding the same two orders carries allergen_risk_score 22.50 / risk_tier GREEN
          under variant exposure_provisional (input set = lines of orders in {NEW, ALLOCATED,
          ROUTED, LOADED}: (0.90*1000 + 0.00*3000)/4000*100) and 90.00 / RED under variant
          exposure_audited (input set = lines of DELIVERED orders only: 0.90*1000/1000*100).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Harvest Loaf ACTIVE, allergen_program STANDARD, credit_limit_cents 5000000, min_drop_cents 25000, allergen_risk_score 0.00, risk_tier GREEN."
            - "Two list-priced SKUs: almond flour (TREE_NUT, weight 0.90, 890 c/lb) and rice flour (NONE, weight 0.00, 88 c/lb), each with an AVAILABLE lot in its own allergen-matched zone."
            - "Order A = 1000 lb almond flour, submitted (total_cents 903350) and ALLOCATED; Order B = 3000 lb rice flour, submitted (total_cents 266541) and ALLOCATED - so the last provisional recompute saw 4000 lb across both orders."
            - "Order A is routed on route R-RSK-01 (service_on 2026-09-15), sealed and dispatched at clock 2026-09-15; Order B is never routed."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Harvest Loaf", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am-1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "ALM-FLR-25", category: "INCLUSION", allergen_class: "TREE_NUT", bulk_capable: false, shelf_life_days: 120, index_code: "NONE", list_price_cents_per_lb: 890, min_rotation_days: 15 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { alm_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "RCE-FLR-50", category: "FLOUR", allergen_class: "NONE", bulk_capable: true, shelf_life_days: 200, index_code: "NONE", list_price_cents_per_lb: 88, min_rotation_days: 20 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { rice_id: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-NUT-01", allergen_class: "TREE_NUT" }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { zone_nut_id: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-NON-01", allergen_class: "NONE" }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { zone_non_id: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-ALM-3001", product_id: "${alm_id}", zone_id: "${zone_nut_id}", manufactured_on: "2026-07-20T00:00:00Z", quantity_received_lb: 10000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { lot_alm_id: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-RCE-5001", product_id: "${rice_id}", zone_id: "${zone_non_id}", manufactured_on: "2026-07-01T00:00:00Z", quantity_received_lb: 20000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { lot_rice_id: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-15T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_a_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_a_id}/lines"
              payload: { product_id: "${alm_id}", quantity_lb: 1000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_a_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_a_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
            - call: "POST /bakery-distribution/orders/${order_a_id}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-20T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_b_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_b_id}/lines"
              payload: { product_id: "${rice_id}", quantity_lb: 3000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_b_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_b_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
            - call: "POST /bakery-distribution/orders/${order_b_id}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
            - call: "POST /bakery-distribution/routes"
              payload: { route_code: "R-RSK-01", service_on: "2026-09-15T00:00:00Z", vehicle_capacity_lb: 24000, service_buffer_minutes: 30 }
              as: LogisticsPlanner
              as_user_id: "lp-1"
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /bakery-distribution/routes/${route_id}/stops"
              payload: { order_id: "${order_a_id}", window_start_at: "2026-09-15T08:00:00Z", window_end_at: "2026-09-15T10:00:00Z", expected_route_version: "${route_v}" }
              as: LogisticsPlanner
              as_user_id: "lp-1"
              captures: { stop_a_id: $.data.id }
            - call: "POST /bakery-distribution/routes/${route_id}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "lp-1"
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/routes/${route_id}/dispatch"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "lp-1"
          trigger:
            - call: "GET /bakery-distribution/customers/${cust_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { score_prov: $.data.allergen_risk_score, tier_prov: $.data.risk_tier }
            - call: "POST /bakery-distribution/route-stops/${stop_a_id}/deliver"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
            - call: "GET /bakery-distribution/customers/${cust_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { score_aud: $.data.allergen_risk_score, tier_aud: $.data.risk_tier }
          assert:
            - "${score_prov} == 22.50"
            - "${tier_prov} == GREEN"
            - "${score_aud} == 90.00"
            - "${tier_aud} == RED"
            - "Order.${order_a_id}.fulfillment_status == DELIVERED"
            - "Order.${order_b_id}.fulfillment_status == ALLOCATED"
            - "OrderLine.${line_a_id}.allocation_status == SHIPPED"
            - "OrderLine.${line_b_id}.allocation_status == RESERVED"

      - name: dual_variant_order_date_index_mode_final_price_ignores_later_quote
