        distinguishing_aspect: "Boundary on the discount_pct metric via POST /promotions/{id}/approve: at NORMAL posture the cap is 25.00 — a 25.00% promotion approves while a 25.01% promotion is rejected, proving the comparison is less-than-or-equal, not strict."
