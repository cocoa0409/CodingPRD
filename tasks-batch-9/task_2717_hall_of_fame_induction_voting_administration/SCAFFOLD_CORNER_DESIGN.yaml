        claim_type: exclusive_operation_permitted
        grounds:
          - rbac.IndependentAuditor.exclusive_operations
          - endpoints[POST /ballots/{id}/audit-decision]
          - state_machines.Ballot.PENDING_AUDIT_to_AUDIT_CERTIFIED
          - calculations.election_threshold_votes.variants.ROSTER_BASED
