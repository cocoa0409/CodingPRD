              payload: { break_scheduled_date: "2026-05-09" }
              as: LabAnalyst
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_BREAK_DATE_MISMATCH and sample remains CAST"

      - name: assignment_create_without_approved_ssi_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=8]", "errors[ERR_SSI_NOT_APPROVED]", entities.InspectionAssignment.fields.ssi_revision_id]
        distinguishing_aspect: "Assignments pin the project's current APPROVED revision: when the project has only a DRAFT revision, creation fails ERR_SSI_NOT_APPROVED."
        test_recipe:
          setup: ["project with a DRAFT SSI revision (never submitted); technician t1 with soil cert"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "NoSSI", permit_number: "P-VAL-5", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
