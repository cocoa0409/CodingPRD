          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /submittals/{id}/state is shared, but a ConsultantRep may only drive REVISE_AND_RESUBMIT -> RECEIVED; attempting the UNDER_REVIEW -> APPROVED review decision returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
