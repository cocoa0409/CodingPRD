scaffold_corner_design:
- section: entities
  instances:
  - name: matter_creation_applies_defaults_and_system_fields
    claim_type: creation_defaults
    grounds:
    - entities.Matter
    distinguishing_aspect: Creating a matter without exposure fields yields status INTAKE, accrued_to_date_cents 0, close_checklist_ack false, a server-minted matter_number, id/version/created_at/updated_at
      populated, and version 1.
    test_recipe:
      setup:
      - empty DB; a staff user to act as owner
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      trigger:
      - call: POST /litigation/matters
        payload:
          title: New matter
          matter_type: COMMERCIAL
          adverse_party: Acme
          jurisdiction: N.D. Cal.
          filing_date: '2026-07-15'
          owning_counsel_id: ${counsel_id}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          m: $.data
      assert:
      - Matter.${m.id}.status == INTAKE
      - Matter.${m.id}.accrued_to_date_cents == 0
      - Matter.${m.id}.close_checklist_ack == false
      - Matter.${m.id}.version == 1
      - Matter.${m.id}.matter_number is non-null and matches pattern MTR-2026-******
      - Matter.${m.id}.posture == RESTRICTED (INTAKE maps to RESTRICTED in the posture ladder)
  - name: matter_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - entities.Matter
    - errors[ERR_NOT_FOUND
    distinguishing_aspect: GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND 404.
    test_recipe:
      setup:
      - empty DB; one staff user
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      trigger:
      - call: GET /litigation/matters/00000000-0000-0000-0000-000000000000
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND
  - name: matter_list_pagination_envelope
    claim_type: listing_pagination
    grounds:
    - entities.Matter
    - response_envelope
    distinguishing_aspect: List endpoint returns data as an array with pagination fields total_count and has_more; limit=2 with 3 matters yields has_more true and total_count 3.
    test_recipe:
      setup:
      - three matters created by the same owner
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      - call: POST /litigation/matters
        payload:
          title: M1
          matter_type: COMMERCIAL
          adverse_party: A
          jurisdiction: J1
          filing_date: '2026-07-01'
          owning_counsel_id: ${counsel_id}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/matters
        payload:
          title: M2
          matter_type: EMPLOYMENT
          adverse_party: B
          jurisdiction: J2
          filing_date: '2026-07-02'
          owning_counsel_id: ${counsel_id}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/matters
        payload:
          title: M3
          matter_type: IP
          adverse_party: C
          jurisdiction: J3
          filing_date: '2026-07-03'
          owning_counsel_id: ${counsel_id}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      trigger:
      - call: GET /litigation/matters?limit=2&offset=0
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      assert:
      - response meta contains api_request_id and api_request_timestamp
      - response_type == 'array' and len(data) == 2
      - pagination total_count == 3 and has_more == true
  - name: accrual_entry_common_fields_false_immutability
    claim_type: immutability
    grounds:
    - entities.AccrualEntry
    distinguishing_aspect: 'AccrualEntry has common_fields: false — it carries id and created_at but no version/updated_at, and no PATCH endpoint exists for it (append-only ledger semantics).'
    test_recipe:
      setup:
      - an ACTIVE matter with budget and engagement (see canonical chain)
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      - call: POST /litigation/staff-users
        payload:
          full_name: Dana Deputy
          email: dana@corp.example
          job_family: EXECUTIVE
        as: LegalOperationsAnalyst
        captures:
          dgc_id: $.data.id
      - call: POST /litigation/staff-users
        payload:
          full_name: Fin Finance
          email: fin@corp.example
          job_family: FINANCE
        as: LegalOperationsAnalyst
        captures:
          fin_id: $.data.id
      - call: POST /litigation/staff-users
        payload:
          full_name: Gena Counsel
          email: gena@corp.example
          job_family: EXECUTIVE
        as: LegalOperationsAnalyst
        captures:
          gc_id: $.data.id
      - call: POST /litigation/matters
        payload:
          title: M
          matter_type: COMMERCIAL
          adverse_party: A
          jurisdiction: J
          filing_date: '2026-07-01'
          owning_counsel_id: ${counsel_id}
          exposure_low_cents: 1000000
          exposure_high_cents: 4000000
          probability_of_loss_pct: 60
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          matter_id: $.data.id
      - call: POST /litigation/matters/${matter_id}/submit-assessment
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/matters/${matter_id}/deadlines
        payload:
          deadline_type: INTERNAL_REVIEW
          title: R
          due_at: '2026-09-01T00:00:00Z'
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/matters/${matter_id}/advance-to-staffing
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: GET /litigation/matters/${matter_id}
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          matter_v: $.data.version
      - call: POST /litigation/matters/${matter_id}/budgets
        payload:
          fiscal_year: 2026
          lifecycle_budget_cents: 1000000000
          fy_budget_cents: 500000000
          expected_matter_version: ${matter_v}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          budget_id: $.data.id
      - call: POST /litigation/budgets/${budget_id}/submit
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/budgets/${budget_id}/approve
        payload: {}
        as: FinanceBusinessPartner
        as_user_id: ${fin_id}
      - call: POST /litigation/counsel-firms
        payload:
          firm_name: Firm
          blended_rate_cap_cents: 90000
        as: LegalOperationsAnalyst
        captures:
          firm_id: $.data.id
      - call: POST /litigation/counsel-firms/${firm_id}/conflict-check
        payload:
          result: CLEARED
        as: LegalOperationsAnalyst
      - call: POST /litigation/counsel-firms/${firm_id}/approve-panel
        payload: {}
        as: GeneralCounsel
        as_user_id: ${gc_id}
      - call: POST /litigation/matters/${matter_id}/engagements
        payload:
          firm_id: ${firm_id}
          role_type: LEAD_COUNSEL
          fee_arrangement: HOURLY
          proposed_rate_cents: 80000
          engagement_letter_executed: true
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          eng_id: $.data.id
      - call: POST /litigation/engagements/${eng_id}/approve
        payload: {}
        as: DeputyGeneralCounsel
        as_user_id: ${dgc_id}
      - call: POST /litigation/engagements/${eng_id}/activate
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      - call: POST /litigation/matters/${matter_id}/activate
        payload: {}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
      trigger:
      - call: POST /litigation/matters/${matter_id}/accrual-entries
        payload:
          engagement_id: ${eng_id}
          period: 2026-08
          entry_kind: ACCRUAL
          amount_cents: 100000
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          acc: $.data
      assert:
      - AccrualEntry.${acc.id}.status == DRAFT
      - AccrualEntry.${acc.id} response body has no 'version' key and no 'updated_at' key
      - AccrualEntry.${acc.id}.created_at is non-null
  - name: staff_user_email_uniqueness_enforced
    claim_type: type_constraint
    grounds:
    - entities.StaffUser
    - errors[ERR_DUPLICATE
    distinguishing_aspect: Creating a second StaffUser with an identical email is rejected with ERR_DUPLICATE.
    test_recipe:
      setup:
      - one staff user exists with email casey@corp.example
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
      trigger:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Clone
          email: casey@corp.example
          job_family: FINANCE
        as: LegalOperationsAnalyst
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_DUPLICATE
  - name: exposure_high_below_low_rejected
    claim_type: type_constraint
    grounds:
    - entities.Matter
    - validations[priority=11]
    - errors[ERR_FIELD_CONSTRAINT]
    distinguishing_aspect: exposure_high_cents < exposure_low_cents violates the range constraint and returns ERR_FIELD_CONSTRAINT.
    test_recipe:
      setup:
      - one staff user
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      trigger:
      - call: POST /litigation/matters
        payload:
          title: Bad range
          matter_type: COMMERCIAL
          adverse_party: A
          jurisdiction: J
          filing_date: '2026-07-01'
          owning_counsel_id: ${counsel_id}
          exposure_low_cents: 5000000
          exposure_high_cents: 1000000
          probability_of_loss_pct: 50
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_FIELD_CONSTRAINT
  - name: invalid_enum_matter_type_rejected
    claim_type: type_constraint
    grounds:
    - entities.Matter
    - errors[ERR_FIELD_CONSTRAINT
    distinguishing_aspect: matter_type outside the declared enum set returns ERR_FIELD_CONSTRAINT.
    test_recipe:
      setup:
      - one staff user
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      trigger:
      - call: POST /litigation/matters
        payload:
          title: Bad enum
          matter_type: ANTITRUST
          adverse_party: A
          jurisdiction: J
          filing_date: '2026-07-01'
          owning_counsel_id: ${counsel_id}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_FIELD_CONSTRAINT
  - name: matter_create_with_computed_fields_returns_invalid_request
    claim_type: computed_fields
    grounds:
    - entities.Matter
    distinguishing_aspect: Client-supplied exposure_tier/reserve_amount_cents/posture/accrued_to_date_cents in the create body are ignored; server computes them (POST body only accepts declared inputs —
      undeclared fields rejected or ignored per ERR_INVALID_REQUEST policy).
    test_recipe:
      setup:
      - one staff user
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      trigger:
      - call: POST /litigation/matters
        payload:
          title: M
          matter_type: COMMERCIAL
          adverse_party: A
          jurisdiction: J
          filing_date: '2026-07-01'
          owning_counsel_id: ${counsel_id}
          exposure_low_cents: 1000000
          exposure_high_cents: 4000000
          probability_of_loss_pct: 60
          posture: FROZEN
          accrued_to_date_cents: 999
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST (computed fields are not accepted as input)
- section: state_machines
  instances:
  - name: matter_terminal_close_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Matter
    distinguishing_aspect: A CLOSED matter rejects every further transition (e.g., resolve) with ERR_INVALID_STATE.
    test_recipe:
      setup:
      - a matter closed directly from INTAKE (no children)
      setup_api_calls:
      - call: POST /litigation/staff-users
        payload:
          full_name: Casey Counsel
          email: casey@corp.example
          job_family: LEGAL
        as: LegalOperationsAnalyst
        captures:
          counsel_id: $.data.id
      - call: POST /litigation/matters
        payload:
          title: Mistaken intake
          matter_type: COMMERCIAL
          adverse_party: A
          jurisdiction: J
          filing_date: '2026-07-01'
          owning_counsel_id: ${counsel_id}
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          matter_id: $.data.id
      - call: POST /litigation/matters/${matter_id}/close
        payload:
          close_checklist_ack: true
        as: LegalOperationsAnalyst
      trigger:
      - call: POST /litigation/matters/${matter_id}/resolve
        payload:
          resolution_type: DISMISSAL
        as: LitigationCounsel
        as_user_id: ${counsel_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_STATE
      - Matter.${matter_id}.status == CLOSED
