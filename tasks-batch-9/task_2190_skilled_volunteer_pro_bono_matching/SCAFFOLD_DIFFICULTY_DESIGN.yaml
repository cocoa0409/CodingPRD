      - name: unexecuted_agreement_blocks_time_log_via_work_state
        grounds:
          - state_machines.EngagementAgreement
          - validations.priority_23.ERR_INVALID_WORK_STATE
          - validations.priority_36.ERR_AGREEMENT_NOT_EXECUTED
        distinguishing_aspect: |
          Same remote gate as instance 1 but one hop further out, and it is the
          ladder-ordering instance. The row being written is a brand-new TimeLog whose
          own payload is impeccable: hours 7.25 > 0 so priority 19 passes, work_date
          2026-01-12 sits inside the pinned HARD window [2026-01-05, 2026-03-01) so
          priority 41 passes, and 7.25 is far under the window's 300.00 hours_remaining
          so priority 55 passes. What refuses the write is the parent Engagement, which
          is still NOT_STARTED, and it is NOT_STARTED only because the EngagementAgreement
          is SENT rather than EXECUTED. Both rungs point at remote state, so the answer
          turns on priority: priority 23 ERR_INVALID_WORK_STATE is checked before
          priority 36 ERR_AGREEMENT_NOT_EXECUTED, so 409 ERR_INVALID_WORK_STATE is the
          only correct body here. An implementer who reaches for the agreement gate first
          (the "obvious" root cause) emits ERR_AGREEMENT_NOT_EXECUTED and fails. The
          second trigger phase then executes the agreement, starts the engagement and
