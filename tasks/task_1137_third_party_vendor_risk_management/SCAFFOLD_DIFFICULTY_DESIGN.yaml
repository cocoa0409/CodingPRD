            - call: "POST /tprm/engagements/${e_inv}/incidents"
              payload: { incident_type: "OUTAGE", severity: "SEV_3", detected_at: "2026-05-02T00:00:00Z" }
              as: BusinessUnitOwner
              captures: { i_inv: $.data.id }
            - call: "POST /tprm/incidents/${i_inv}/triage"
              payload: {}
