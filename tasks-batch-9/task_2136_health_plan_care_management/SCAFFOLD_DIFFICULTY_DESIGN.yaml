            - "One SCHEDULED touch occupies 2026-08-05T09:00:00Z to 2026-08-05T09:30:00Z."
            - "Clock advanced to 2026-08-06T00:00:00Z, so that touch's window is in the past yet the touch is still SCHEDULED."
