            - "S2 lead 335h59m59s -> ${t2} == T2_DEPOSIT_HALF and ${r2} == 468563 (82688 + 385875)"

      - name: empty_weather_lookback_no_go_and_60min_inclusion
        grounds:
          - calculations.go_no_go_verdict
          - entities.GoNoGoEvaluation.fields.reason_codes
        distinguishing_aspect: |
          Empty-collection boundary (different metric kind than numeric
          thresholds): zero readings in the 60-minute lookback yields NO_GO with
          NO_WEATHER_DATA; a reading timestamped exactly 60 minutes before
          evaluation is INCLUSIVE and flips the verdict to GO.
