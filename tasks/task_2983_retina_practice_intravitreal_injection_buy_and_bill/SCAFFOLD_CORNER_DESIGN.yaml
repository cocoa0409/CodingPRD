            - "${k_uk_plan} == \"ERR_DUPLICATE_ACTIVE_PLAN\" with HTTP 409 for the same (patient, OD)"
            - "${k_uk_fellow_status} == DRAFT — the OS plan is a different key and is accepted"
            - "${k_uk_bio_null} == \"ERR_INVALID_REFERENCE_DRUG\" and ${k_uk_bio_chain} == \"ERR_INVALID_REFERENCE_DRUG\", both HTTP 422"

      - name: corner_step_therapy_blocks_submission_when_no_prerequisite_failure_is_documented
        claim_type: aggregate_validation
        grounds:
          - validations.priority_31
          - calculations.step_therapy_failure_count
          - errors[ERR_STEP_THERAPY_NOT_SATISFIED]
        distinguishing_aspect: "Step therapy is checked at PA submission, not at plan creation: a patient with zero documented failures of the prerequisite drug can be planned and activated on the step-therapy drug, and only the submit call is refused with ERR_STEP_THERAPY_NOT_SATISFIED, leaving the authorization in DRAFT and re-submittable once a failure exists."
        test_recipe:
          setup:
            - "payer PAY-ST whose policy for Drug T requires 1 documented failure of Drug REF"
            - "a treatment-naive patient with an ACTIVE study and an activated plan on Drug T"
          setup_api_calls:
            - *k_clk
            - *k_pay_st
            - *k_drug_ref
            - *k_drug_t
            - *k_pol_st_ref
            - *k_pol_st_t
            - *k_cl1
            - call: "POST /patients"
              payload: { mrn: "MRN-2041", full_name: "Hana Iversen", payer_id: "${k_pay_st_id}", member_id: "SUM-41", contact_point: "hana.iversen@example.test", notification_channel: "EMAIL" }
              as: PracticeAdmin
              captures: { k_pt_naive_id: $.data.id }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_naive_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 480, intraretinal_fluid: true, subretinal_fluid: true, new_hemorrhage: false, va_letter_score: 48 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_img_naive_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${k_pt_naive_id}", drug_id: "${k_drug_t_id}", eye: "OD", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_plan_naive_id: $.data.id }
            - call: "POST /treatment-plans/${k_plan_naive_id}/activate"
              payload: { baseline_imaging_study_id: "${k_img_naive_id}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_plan_naive_v: $.data.version, k_plan_naive_status: $.data.status }
            - call: "POST /prior-authorizations"
              payload: { treatment_plan_id: "${k_plan_naive_id}", expected_treatment_plan_version: "${k_plan_naive_v}" }
              as: BillingSpecialist
              captures: { k_pa_naive_id: $.data.id, k_pa_naive_status0: $.data.status }
          trigger:
            - call: "POST /prior-authorizations/${k_pa_naive_id}/submit"
              payload: { clinical_justification: "First-line request for the step-therapy drug" }
              as: BillingSpecialist
              captures: { k_st_err: $.data.error_id }
            - call: "GET /prior-authorizations/${k_pa_naive_id}"
              as: BillingSpecialist
              captures: { k_st_status_after: "$.data.status", k_st_count_after: "$.data.submission_count" }
          assert:
            - "${k_plan_naive_status} == LOADING and ${k_pa_naive_status0} == DRAFT — planning a step-therapy drug is never blocked"
            - "${k_st_err} == \"ERR_STEP_THERAPY_NOT_SATISFIED\" with HTTP 422"
            - "${k_st_status_after} == DRAFT and ${k_st_count_after} == 0 — the failed submission consumed no attempt"
            - "documented_prior_failures counted for this patient is 0 against required_prior_failures 1"

      - name: corner_assistance_enrollment_gates_cover_federal_eligibility_and_one_active_program
        claim_type: conditional_validation
        grounds:
          - validations.priority_13
          - validations.priority_38
          - validations.priority_39
          - errors[ERR_COPAY_CARD_FEDERAL_INELIGIBLE]
          - errors[ERR_ENROLLMENT_STATE_INVALID]
          - errors[ERR_DUPLICATE_ACTIVE_ENROLLMENT]
        distinguishing_aspect: "Manufacturer copay cards are refused for federal-program patients but independent foundations are not, the one-active-program rule is enforced at APPROVE rather than at CREATE (so a second enrollment may be filed and then refused), and terminate is legal from PENDING while a second terminate is a state error."
        test_recipe:
          setup:
            - "P-MCR on the MEDICARE_PART_B payer (federal_program computed true) and P-NP on a commercial payer"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_pt_mcr
          trigger:
            - call: "POST /assistance-enrollments"
              payload: { patient_id: "${k_pt_mcr_id}", program_type: "MANUFACTURER_COPAY_CARD", annual_benefit_cents: 1000000, per_encounter_cap_cents: 200000, effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-07-31T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_en_fed: $.data.error_id }
            - call: "POST /assistance-enrollments"
              payload: { patient_id: "${k_pt_mcr_id}", program_type: "INDEPENDENT_FOUNDATION", annual_benefit_cents: 1000000, per_encounter_cap_cents: 200000, effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-07-31T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_en_a_id: $.data.id, k_en_a_status0: $.data.status, k_en_a_used: $.data.benefit_used_cents }
            - call: "POST /assistance-enrollments/${k_en_a_id}/approve"
              as: BillingSpecialist
              captures: { k_en_a_status1: $.data.status }
            - call: "POST /assistance-enrollments/${k_en_a_id}/approve"
              as: BillingSpecialist
              captures: { k_en_reapprove: $.data.error_id }
            - call: "POST /assistance-enrollments"
              payload: { patient_id: "${k_pt_mcr_id}", program_type: "FREE_DRUG_PAP", annual_benefit_cents: 500000, per_encounter_cap_cents: 100000, effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-07-31T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_en_b_id: $.data.id, k_en_b_status0: $.data.status }
            - call: "POST /assistance-enrollments/${k_en_b_id}/approve"
              as: BillingSpecialist
              captures: { k_en_dup: $.data.error_id }
            - call: "POST /assistance-enrollments/${k_en_b_id}/terminate"
              payload: { termination_reason: "Filed in error while the foundation grant is active" }
              as: BillingSpecialist
              captures: { k_en_b_status1: $.data.status }
            - call: "POST /assistance-enrollments/${k_en_b_id}/terminate"
              payload: { termination_reason: "Second attempt" }
              as: BillingSpecialist
              captures: { k_en_reterminate: $.data.error_id }
            - call: "POST /assistance-enrollments"
              payload: { patient_id: "${k_pt_np_id}", program_type: "MANUFACTURER_COPAY_CARD", annual_benefit_cents: 1000000, per_encounter_cap_cents: 200000, effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-07-31T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_en_comm_id: $.data.id, k_en_comm_status: $.data.status }
          assert:
            - "${k_en_fed} == \"ERR_COPAY_CARD_FEDERAL_INELIGIBLE\" with HTTP 422"
            - "${k_en_a_status0} == PENDING with ${k_en_a_used} == 0, and ${k_en_a_status1} == ACTIVE"
            - "${k_en_reapprove} == \"ERR_ENROLLMENT_STATE_INVALID\" with HTTP 409"
            - "${k_en_b_status0} == PENDING — the duplicate is accepted at create time"
            - "${k_en_dup} == \"ERR_DUPLICATE_ACTIVE_ENROLLMENT\" with HTTP 409, and enrollment B is still PENDING"
            - "${k_en_b_status1} == TERMINATED (terminate is legal from PENDING) and ${k_en_reterminate} == \"ERR_ENROLLMENT_STATE_INVALID\""
            - "${k_en_comm_status} == PENDING — the same copay card is legal for the commercial patient"

      - name: corner_adverse_event_gates_block_out_of_order_review_self_adjudication_and_resumption
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_10
          - validations.priority_13
          - validations.priority_44
          - errors[ERR_ADVERSE_EVENT_STATE_INVALID]
          - errors[ERR_ADJUDICATOR_IS_INJECTOR]
          - errors[ERR_OPEN_ADVERSE_EVENT]
        distinguishing_aspect: "Three independent guards fire around one endophthalmitis report: adjudication before investigation (and a second start-investigation) is a 409 state error, the clinician who performed the injection cannot adjudicate their own event (403, priority 10 before the state check would even matter), and the plan cannot be resumed while the event is REPORTED or UNDER_INVESTIGATION — resumption only unlocks once the event reaches a terminal status."
        test_recipe:
          setup:
            - "the corner prologue through ENC-NP ATTESTED, an ENDOPHTHALMITIS event reported by the injecting clinician CL1, and the plan suspended"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
            - *k_enc_np_att
            - call: "POST /adverse-events"
              payload: { injection_encounter_id: "${k_enc_np_id}", event_type: "ENDOPHTHALMITIS", onset_datetime: "2026-08-06T09:00:00Z", severity: "SEVERE", culture_result: "POSITIVE" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ae_id: $.data.id, k_ae_status0: $.data.status, k_ae_reporter: $.data.reported_by_clinician_id }
            - call: "POST /treatment-plans/${k_plan_np_id}/suspend"
              payload: { suspension_reason: "Suspected endophthalmitis under review" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ae_plan_status: $.data.status }
          trigger:
            - call: "POST /adverse-events/${k_ae_id}/adjudicate"
              payload: { outcome: "UNRELATED", adjudication_note: "Premature adjudication attempt" }
              as: RetinaSpecialist
              as_user_id: "${k_cl2_id}"
              captures: { k_ae_early: $.data.error_id }
            - call: "POST /treatment-plans/${k_plan_np_id}/resume"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ae_resume_reported: $.data.error_id }
            - call: "POST /adverse-events/${k_ae_id}/start-investigation"
              as: ComplianceOfficer
              as_user_id: "U-CO-1"
              captures: { k_ae_status1: $.data.status }
            - call: "POST /adverse-events/${k_ae_id}/start-investigation"
              as: ComplianceOfficer
              as_user_id: "U-CO-1"
              captures: { k_ae_double_start: $.data.error_id }
            - call: "POST /treatment-plans/${k_plan_np_id}/resume"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ae_resume_investigating: $.data.error_id }
            - call: "POST /adverse-events/${k_ae_id}/adjudicate"
              payload: { outcome: "UNRELATED", adjudication_note: "Self-adjudication attempt by the injector" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ae_self: $.data.error_id }
            - call: "POST /adverse-events/${k_ae_id}/adjudicate"
              payload: { outcome: "UNRELATED", adjudication_note: "Culture consistent with pre-existing blepharitis, unrelated to the injection" }
              as: RetinaSpecialist
              as_user_id: "${k_cl2_id}"
              captures: { k_ae_status2: $.data.status, k_ae_adjudicator: $.data.adjudicated_by_clinician_id }
            - call: "POST /treatment-plans/${k_plan_np_id}/resume"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ae_resume_ok: $.data.status }
          assert:
            - "${k_ae_status0} == REPORTED with ${k_ae_reporter} == ${k_cl1_id} and days_post_injection == 5"
            - "${k_ae_plan_status} == SUSPENDED"
            - "${k_ae_early} == \"ERR_ADVERSE_EVENT_STATE_INVALID\" and ${k_ae_double_start} == \"ERR_ADVERSE_EVENT_STATE_INVALID\", both HTTP 409"
            - "${k_ae_resume_reported} == \"ERR_OPEN_ADVERSE_EVENT\" and ${k_ae_resume_investigating} == \"ERR_OPEN_ADVERSE_EVENT\", both HTTP 409"
            - "${k_ae_self} == \"ERR_ADJUDICATOR_IS_INJECTOR\" with HTTP 403 even though the payload is otherwise valid"
            - "${k_ae_status2} == ADJUDICATED_UNRELATED with ${k_ae_adjudicator} == ${k_cl2_id}, and the plan is still SUSPENDED (the UNRELATED edge fires no cascade)"
            - "${k_ae_resume_ok} == MAINTENANCE — the terminal event no longer blocks resumption"

      - name: corner_recall_closure_walk_enforces_step_order_credit_ceiling_ownership_and_segregation
        claim_type: cascading_validation
        grounds:
          - validations.priority_8
          - validations.priority_11
          - validations.priority_13
          - validations.priority_42
          - validations.priority_43
          - errors[ERR_RECALL_STATE_INVALID]
          - errors[ERR_CREDIT_EXCEEDS_EXPECTED]
          - errors[ERR_NOT_NOTIFICATION_OWNER]
          - errors[ERR_NOTIFICATION_STATE_INVALID]
