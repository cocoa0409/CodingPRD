  - section: errors
    instances:
      - name: corner_every_path_id_lookup_returns_its_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_OPERATOR_NOT_FOUND]
          - errors[ERR_ENDORSEMENT_NOT_FOUND]
          - errors[ERR_PLACEMENT_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_TRANSACTION_NOT_FOUND]
          - errors[ERR_DECLARATION_NOT_FOUND]
        distinguishing_aspect: "The catalogue declares a DISTINCT 404 code per entity, so a shared `get_or_404` helper that emits one generic code (or reuses ERR_POLICY_NOT_FOUND for every path) fails: six reads of six different collections with well-formed but unknown UUIDs must return six different error_id values, while the one row that does exist proves the lookups are id-scoped and not just empty-table behaviour."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z; exactly one Operator exists, so every collection except operators is empty and the operator collection is non-empty — the unknown ids below therefore exercise a genuine id miss."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
