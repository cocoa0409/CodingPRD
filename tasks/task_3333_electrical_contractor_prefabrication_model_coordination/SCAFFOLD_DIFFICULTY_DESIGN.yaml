  - rule_id: compensating_invariant
    instances:
      - name: released_craft_hours_balance_survives_ressue_revert
        grounds:
          - calculations.craft_hours_balance
          - calculations.craft_hours_credit
          - state_machines.PrefabOrder.FABRICATED_to_PLANNED
          - entities.Project.fields.total_quantity
        distinguishing_aspect: |
          The conserved quantity is a money balance over committed craft and material: project.craft_hours_balance is
          base_labor_cents + base_material_cents, and the FABRICATED to PLANNED revert moves released_labor_cents out
          of the released bucket while reinstated_labor_cents moves the identical expression back in, so the balance
          after the revert equals the balance before the release exactly.
