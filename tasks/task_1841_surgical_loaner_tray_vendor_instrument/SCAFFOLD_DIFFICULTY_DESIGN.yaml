            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "STANDARD" }, as: ORScheduler, captures: { rq1_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq1_id}/trays", payload: { tray_code: "TK-1", declared_instrument_count: 50, replacement_value_cents: 300000 }, as: ORScheduler, captures: { t1_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq1_id}/submit", as: ORScheduler }
            - { call: "POST /vendor-office/requests/${rq1_id}/decide", payload: { decision: "APPROVE" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "STANDARD" }, as: ORScheduler, captures: { rq2_id: $.data.id } }
