      - name: corner_calc_constants_applied_default_and_reinstatement_limits_come_from_the_constants
        claim_type: constants_applied
        grounds:
          - state_machines.PaymentArrangement
          - calculations.account_credit_status
          - validations[ERR_REINSTATEMENT_LIMIT]
        distinguishing_aspect: |
          Two named constants govern the arrangement lifecycle and both are exercised at their exact
          values: MISSED_PAYMENTS_TO_DEFAULT is 2, so one late instalment leaves the plan ACTIVE and
          the second defaults it, and MAX_ARRANGEMENT_REINSTATEMENTS is 1, so the first reinstate
          succeeds and the second is refused with ERR_REINSTATEMENT_LIMIT. The plan is written with
          six instalments precisely so that four recorded payments cannot trip the COMPLETED
          condition and confuse the default path.
        test_recipe:
          setup:
            - "RS-STD-2026 and BillingPeriod 2025-06 (SUMMER) exist; the clock is 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-3003 has a master meter with reads 100000 / 104000, and its 4000-gallon bill is ISSUED for 5210 cents, so the account is PAST_DUE."
            - "A PROPOSED arrangement for the full 5210 with 1042 down over 6 instalments has been activated, giving installment_cents 694, final_installment_cents 698 and balance 4168."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
