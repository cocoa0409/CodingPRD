  # =========================================================================
  # RULE 6 - boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: similarity_band_boundary_45_00_versus_44_99_after_the_quote_allowance
        grounds:
          - calculations.evidence_strength_score
          - entities.EvidenceItem.fields.similarity_pct
          - entities.IntegrityReport.fields.evidence_strength_score
          - endpoints[POST /integrity/reports/{id}/submit]
        distinguishing_aspect: |
          The band multiplier is chosen from the ALLOWANCE-ADJUSTED similarity, not the raw figure, and the
          two differ across exactly one hundredth of a percent. similarity_pct 45.00 adjusts to 40.00, which
          is >= the 40.00 high band and takes the 1.20 multiplier; 44.99 adjusts to 39.99, which falls to the
          1.00 mid band. The scores are 60.00 and 51.99 - an 8.01 gap opened by a 0.01 input difference.
          The seductive wrong answer is 59.99, obtained by picking the band from the raw 44.99 (>= 40.00,
          so 1.20) and then multiplying the adjusted 39.99 by it. 59.99 is close enough to 60.00 that only
          an exact-literal assertion catches it.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "two PLAGIARISM reports on the same ENGL-201 offering against two different students"
            - "each report carries exactly ONE EvidenceItem of kind SIMILARITY_REPORT with page_count 4, so page_points are 2.00 and kind_diversity_points are 10.00 in both, and the corroboration bonus is 0.00 in both"
            - "the only difference between the two reports is similarity_pct: 45.00 versus 44.99"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_high_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Lee Learner", email: "lee@u.edu", program_code: "BA-ENG", class_year: 2 }
              as: IntegrityOfficer
              captures: { student_low_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_high_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_high_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_high_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { evidence_high_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_low_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-21T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_low_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_low_id}", kind: "SIMILARITY_REPORT", sha256: "3333333333333333333333333333333333333333333333333333333333333333", page_count: 4, similarity_pct: 44.99 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { evidence_low_id: $.data.id }
          trigger:
            - call: "POST /integrity/reports/${report_high_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { score_high: $.data.evidence_strength_score }
            - call: "POST /integrity/reports/${report_low_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { score_low: $.data.evidence_strength_score }
          assert:
            - "IntegrityReport.${report_high_id}.evidence_strength_score == 60.00 (adjusted 40.00 * 1.20 = 48.00, plus 2.00 pages, plus 10.00 kind diversity, plus 0.00 corroboration)"
            - "IntegrityReport.${report_low_id}.evidence_strength_score == 51.99 (adjusted 39.99 * 1.00 = 39.99, plus 2.00, plus 10.00)"
            - "IntegrityReport.${report_low_id}.evidence_strength_score != 59.99, the value produced by choosing the 1.20 band from the raw 44.99 and applying it to the adjusted 39.99"
            - "IntegrityReport.${report_low_id}.evidence_strength_score != 65.99, the value produced by skipping the 5.00 quote allowance entirely: 44.99 * 1.20 = 53.99 similarity points plus 2.00 plus 10.00"
            - "the difference score_high - score_low == 8.01 for a 0.01 difference in similarity_pct"
            - "both reports reach status SUBMITTED and both scores are >= the 20.00 triage acceptance floor, so nothing else differs between them"
            - "both values carry exactly two decimal places"

      - name: monitoring_flag_strict_inequalities_at_the_peer_threshold_and_the_training_floor
        grounds:
          - calculations.department_monitoring_flag
          - calculations.department_reporting_rate
          - calculations.department_training_completion_pct
          - endpoints[GET /integrity/departments/{id}/reporting-metrics]
          - entities.Department.fields.monitoring_flag
        distinguishing_aspect: |
          Three separate boundaries are made to land exactly on their own edges at the same time, and every
          one of them is a STRICT inequality that must therefore NOT fire. ENGL's rate is 1.50 and the
          elevated threshold is exactly 1.50, so `rate > threshold` is false; ENGL's training completion is
          exactly 80.00 and the deficit rule is `< 80.00`, so that is false too - ENGL must come back
          NORMAL. Meanwhile a faculty member whose training completed_at is EXACTLY 730 days before the
          clock (2024-08-01) is still CURRENT, which is what makes the count 4 and the percentage exactly
          80.00 rather than 60.00; members at 731 days (2024-07-31) are LAPSED. HIST simultaneously
          satisfies branch 1 (rate 0.00) and branch 3 (training 50.00 < 80.00) and must return
          UNDER_REPORTING, proving the pinned branch precedence. The even-count median is also on show:
          ROUND((0.00 + 1.50) / 2, 2) == 0.75, not 1.50 and not 0.00.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z for the whole scenario"
            - "exactly TWO departments exist, so the peer median is an even-count median"
            - "ENGL: enrolled_student_count 2000, faculty_headcount 5, four FacultyMember rows of which THREE have recent completions and the FOURTH completed exactly 730 days before the clock (2024-08-01T00:00:00Z) - all four are CURRENT, giving 4 * 100 / 5 == 80.00"
            - "ENGL has exactly THREE SUBMITTED reports, giving 3 * 1000 / 2000 == 1.50"
            - "HIST: enrolled_student_count 1000, faculty_headcount 4, four FacultyMember rows of which two have recent completions and two completed 731 days before the clock (2024-07-31T00:00:00Z) and are LAPSED, giving 2 * 100 / 4 == 50.00"
