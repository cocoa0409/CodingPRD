  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: circuit_energization_full_cycle_returns_to_energized
        grounds:
          - state_machines.Circuit.ENERGIZED_to_DE_ENERGIZATION_PENDING
          - state_machines.Circuit.DE_ENERGIZATION_PENDING_to_DE_ENERGIZED
          - state_machines.Circuit.DE_ENERGIZED_to_PATROL_IN_PROGRESS
          - state_machines.Circuit.PATROL_IN_PROGRESS_to_CLEARED_FOR_RESTORE
          - state_machines.Circuit.CLEARED_FOR_RESTORE_to_ENERGIZED
          - entities.Circuit.fields.energization_state
        distinguishing_aspect: |
          Circuit.energization_state is a true CYCLE with no terminal state: one circuit traverses
          ENERGIZED -> DE_ENERGIZATION_PENDING -> DE_ENERGIZED -> PATROL_IN_PROGRESS ->
          CLEARED_FOR_RESTORE -> ENERGIZED and is then immediately eligible to be scoped into a second
          event and traverse the same loop again, which a linear or terminal-state machine cannot express.
        test_recipe:
          setup:
            - "Circuit HOTEL is TIER_2, overhead_miles 8.0, equipment_condition_index 80, inspected 2026-05-01 on a 36-month cycle, fast_trip_enabled false, with one ONLINE station of weight 1.00."
            - "Two observations give HOTEL a FORECAST index of 60.00 / R4 for 2026-08-20 and another for 2026-08-24."
            - "Two customers sit on HOTEL: one CRITICAL_FACILITY and one medical-baseline residential, so the 12-hour event windows both clear the 0.25 net-benefit floor."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "HOTEL", district_code: "D-SOUTH", hftd_tier: "TIER_2", overhead_miles: 8.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
