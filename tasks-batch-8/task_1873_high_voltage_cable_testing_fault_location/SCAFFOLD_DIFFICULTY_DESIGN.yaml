  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: assignment_create_cancel_conserves_committed_hours
        grounds:
          - calculations.unit_committed_hours
          - state_machines.EquipmentAssignment.CONFIRMED_to_CANCELLED
          - entities.MobileUnit.fields.committed_hours
        distinguishing_aspect: |
          Conserved quantity MobileUnit.committed_hours: create(+4.0) then cancel(-4.0)
          of the same assignment leaves the unit at exactly 0.0 committed hours and flips
          status ASSIGNED -> AVAILABLE — no drift from the forward/compensating pair.
        test_recipe:
          setup:
            - "Circuit, APPROVED window, PLANNED job; unit VAN-1 AVAILABLE, committed_hours 0.0."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-CI1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
          trigger:
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-10T11:00:00Z" }, as: DispatchCoordinator, captures: { a1: "$.data.id", dur: "$.data.duration_hours" } }
            - { call: "GET /cable-diagnostics/mobile-units/${u}", as: DispatchCoordinator, captures: { h_mid: "$.data.committed_hours", st_mid: "$.data.status" } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a1}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a1}/cancel", as: DispatchCoordinator, captures: { ast: "$.data.status" } }
            - { call: "GET /cable-diagnostics/mobile-units/${u}", as: DispatchCoordinator, captures: { h_end: "$.data.committed_hours", st_end: "$.data.status" } }
          assert:
            - "EquipmentAssignment.${a1}.duration_hours == 4.0; after create committed_hours == 4.0 and unit ASSIGNED"
            - "after confirm+cancel: EquipmentAssignment.${a1}.status == CANCELLED"
            - "MobileUnit.${u}.committed_hours == 0.0 (invariant: create+cancel conserves the pre-create value) and status == AVAILABLE"

      - name: fault_close_reopen_conserves_unresolved_count
        grounds:
          - state_machines.FaultRecord.RETESTING_to_CLOSED_VERIFIED
          - state_machines.FaultRecord.CLOSED_VERIFIED_to_REOPENED
          - entities.CableCircuit.fields.unresolved_fault_count
        distinguishing_aspect: |
          Conserved quantity CableCircuit.unresolved_fault_count (a count, not hours):
          the splice-accept close (1 -> 0) paired with a warranty reopen (0 -> 1) leaves
          the counter at its pre-close value 1, with resolved_fault_count_24m moving
          0 -> 1 -> 0 and closed_at set then cleared.
        test_recipe:
          setup:
            - "Full repair cycle on circuit C (length 1000, budget 800000): fault F CLOSED_VERIFIED via accepted splice + passing retest; original FAIL series left EVALUATED so the job remains IN_PROGRESS (no EVALUATION auto-transition)."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-CI2", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: "$.data.id" } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/test-series/${s}/faults", as: TestSupervisor, captures: { f: "$.data[0].id" } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: TestSupervisor, captures: { unres_pre: "$.data.unresolved_fault_count" } }
            - { call: "POST /cable-diagnostics/faults/${f}/pinpoint", payload: { trace_time_us: 20.0, pinpoint_method: "PULSE_ECHO" }, as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/excavation-orders", payload: { fault_record_id: "${f}", target_location_m: 1560.0, dig_start: "2026-08-10T09:30:00Z", dig_end: "2026-08-10T11:00:00Z", permit_ref: "MX-100", cost_cents: 100040 }, as: FaultCrewLead, captures: { e: "$.data.id" } }
            - { call: "POST /cable-diagnostics/excavation-orders/${e}/permit", as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:45:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/excavation-orders/${e}/start", as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/repair-splices", payload: { fault_record_id: "${f}", excavation_order_id: "${e}", splice_type: "HEAT_SHRINK", cost_cents: 200040 }, as: FaultCrewLead, captures: { sp: "$.data.id" } }
            - { call: "POST /cable-diagnostics/repair-splices/${sp}/start", as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/repair-splices/${sp}/cure", as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/repair-splices/${sp}/finish-curing", as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T10:05:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05, is_retest: true, retest_of_fault_id: "${f}" }, as: TestSupervisor, captures: { s2: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s2}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s2}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 2.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s2}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 2.1, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s2}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 2.2, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s2}/evaluate", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s2}/accept", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/repair-splices/${sp}/accept", as: NetworkPlanner }
          trigger:
            - { call: "GET /cable-diagnostics/circuits/${c}", as: TestSupervisor, captures: { unres_closed: "$.data.unresolved_fault_count", res_closed: "$.data.resolved_fault_count_24m" } }
            - { call: "POST /cable-diagnostics/faults/${f}/reopen", as: TestSupervisor, captures: { fst: "$.data.status", fclosed: "$.data.closed_at" } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: TestSupervisor, captures: { unres_post: "$.data.unresolved_fault_count", res_post: "$.data.resolved_fault_count_24m" } }
          assert:
            - "before close: unresolved_fault_count == 1 (captured unres_pre)"
            - "after splice-accept close: unresolved == 0, resolved_fault_count_24m == 1"
            - "after reopen: unresolved == 1 (pair conserves the pre-close count), resolved == 0, FaultRecord.${f}.closed_at == null, status == REOPENED"
