      - name: conference_lead_time_outranks_the_transition_sequence
        claim_type: priority_conflict
        grounds:
          - validations[priority=24]
          - validations[priority=32]
        distinguishing_aspect: |
          Kindergarten transition has both a 90-day lead-time rule (priority 24,
          422) and an ordering rule (priority 32, 409). Out of order alone gives
          409; too late alone gives 422; and a request that is BOTH out of order
          and too late gives the 422, which pins the temporal rule above the
          sequence rule. The lead time itself is exact: for a kindergarten
          eligibility date of 2028-09-01, 2028-06-03 is exactly 90 days out and
