            - call: "POST /sleep-studies"
              payload: { patient_id: "${p1}", order_id: "${ob}", study_type: "PSG_DIAGNOSTIC", scheduled_date: "2026-08-05", bed_id: "${bed1}" }
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_BED_NIGHT_CONFLICT"
            - "GET /sleep-studies?bed_id=${bed1}&scheduled_date=2026-08-05 total_count == 1 (only ${sta})"

      - name: staffing_aggregate_capacity_ceiling
        grounds:
          - calculations.night_staffing_capacity
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.StaffingAssignment.fields.patient_capacity
        distinguishing_aspect: |
          Interval semantics: aggregate quota over the technologist pool, NOT pairwise slot
          exclusion — three in-lab studies on distinct beds the same night are individually
          non-overlapping yet the third exceeds the CONFIRMED capacity of 2. Resource:
          StaffingAssignment pool (different resource than Bed).
        test_recipe:
          setup:
            - "One CONFIRMED technologist (capacity 2) on 2026-08-04; beds B1,B2,B3"
            - "Order A (2 nights) holds studies D and E on B1 and B2 for 2026-08-04; order B (1 night) authorized"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D8B-01", full_name: "Pat Sixteen", date_of_birth: "1985-04-16" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B1" }, as: LabDirector, captures: { b1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B2" }, as: LabDirector, captures: { b2: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B3" }, as: LabDirector, captures: { b3: $.data.id } }
            - { call: "POST /staffing-assignments", payload: { technologist_id: "${t1}", shift_date: "2026-08-04", patient_capacity: 2 }, as: LabDirector, captures: { sa1: $.data.id } }
            - { call: "POST /staffing-assignments/${sa1}/confirm", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "PSG_DIAGNOSTIC", icd10_primary: "G47.33" }, as: Scheduler, captures: { oa: $.data.id, oa_v: $.data.version } }
            - { call: "POST /referral-orders/${oa}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-A", approved_nights: 2, window_start: "2026-08-01", window_end: "2026-08-31", expected_referral_order_version: "${oa_v}" }, as: Scheduler, captures: { aa: $.data.id } }
            - { call: "POST /authorizations/${aa}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${oa}", study_type: "PSG_DIAGNOSTIC", scheduled_date: "2026-08-04", bed_id: "${b1}" }, as: Scheduler, captures: { std: $.data.id } }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${oa}", study_type: "PSG_DIAGNOSTIC", scheduled_date: "2026-08-04", bed_id: "${b2}" }, as: Scheduler, captures: { ste: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "PSG_DIAGNOSTIC", icd10_primary: "G47.33" }, as: Scheduler, captures: { ob: $.data.id, ob_v: $.data.version } }
            - { call: "POST /referral-orders/${ob}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-B", approved_nights: 1, window_start: "2026-08-01", window_end: "2026-08-31", expected_referral_order_version: "${ob_v}" }, as: Scheduler, captures: { ab: $.data.id } }
            - { call: "POST /authorizations/${ab}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
          trigger:
            - call: "POST /sleep-studies"
              payload: { patient_id: "${p1}", order_id: "${ob}", study_type: "PSG_DIAGNOSTIC", scheduled_date: "2026-08-04", bed_id: "${b3}" }
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "Studies D and E succeeded (capacity exactly 2 is allowed — boundary inclusive)"
            - "HTTP 422 with error_id ERR_CAPACITY_EXCEEDED for the third study (3 > 2)"
            - "GET /sleep-studies?scheduled_date=2026-08-04 total_count == 2"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bed_night_occupancy_conserved_across_cancel
        grounds:
          - state_machines.SleepStudy.SCHEDULED_to_CANCELLED
          - calculations.night_staffing_capacity
          - errors[ERR_BED_NIGHT_CONFLICT]
        distinguishing_aspect: |
          Conserved quantity: occupancy(bed, date) = count of studies in {SCHEDULED,
          IN_PROGRESS} on that bed+night. Schedule (+1) paired with cancel (-1) restores the
          quantity to its prior value, provable by a third schedule succeeding on the same
          slot. Quantity type: per-resource night-slot occupancy.
        test_recipe:
          setup:
            - "Bed B1, confirmed staffing capacity 2 on 2026-08-06; two AUTHORIZED PSG orders"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D9A-01", full_name: "Pat Seventeen", date_of_birth: "1986-05-17" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B1" }, as: LabDirector, captures: { bed1: $.data.id } }
            - { call: "POST /staffing-assignments", payload: { technologist_id: "${t1}", shift_date: "2026-08-06", patient_capacity: 2 }, as: LabDirector, captures: { sa1: $.data.id } }
            - { call: "POST /staffing-assignments/${sa1}/confirm", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "PSG_DIAGNOSTIC", icd10_primary: "G47.33" }, as: Scheduler, captures: { oa: $.data.id, oa_v: $.data.version } }
            - { call: "POST /referral-orders/${oa}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-A", approved_nights: 1, window_start: "2026-08-01", window_end: "2026-08-31", expected_referral_order_version: "${oa_v}" }, as: Scheduler, captures: { aa: $.data.id } }
            - { call: "POST /authorizations/${aa}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${oa}", study_type: "PSG_DIAGNOSTIC", scheduled_date: "2026-08-06", bed_id: "${bed1}" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "PSG_DIAGNOSTIC", icd10_primary: "G47.33" }, as: Scheduler, captures: { ob: $.data.id, ob_v: $.data.version } }
            - { call: "POST /referral-orders/${ob}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-B", approved_nights: 1, window_start: "2026-08-01", window_end: "2026-08-31", expected_referral_order_version: "${ob_v}" }, as: Scheduler, captures: { ab: $.data.id } }
            - { call: "POST /authorizations/${ab}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
          trigger:
            - { call: "POST /sleep-studies/${st1}/cancel", payload: {}, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${ob}", study_type: "PSG_DIAGNOSTIC", scheduled_date: "2026-08-06", bed_id: "${bed1}" }, as: Scheduler, captures: { st2: $.data.id } }
          assert:
            - "After cancel: SleepStudy.${st1}.status == CANCELLED and GET /sleep-studies?bed_id=${bed1}&scheduled_date=2026-08-06&status=SCHEDULED total_count == 0"
            - "Replacement SleepStudy.${st2} created 201 (occupancy invariant restored to 1, not 2)"
            - "ReferralOrder.${oa}.status == AUTHORIZED (freed for rescheduling)"

      - name: scorer_open_task_ledger_conserved_across_recall
        grounds:
          - state_machines.ScoringTask.IN_PROGRESS_to_RECALLED
          - state_machines.InterRaterCase.OPEN_to_ADJUDICATED
          - calculations.inter_rater_agreement
        distinguishing_aspect: |
          Conserved quantity: open_task_count(scorer) = count of that scorer's tasks in
          {ASSIGNED, IN_PROGRESS, RETURNED_FOR_REVISION}. The assignment (+1) paired with the
          adjudication-driven recall (-1) restores 0 — a workload-ledger invariant, a
          different quantity type than bed-night occupancy.
        test_recipe:
          setup:
            - "S2 (reliability pool) already has one non-concordant adjudication (consecutive_nonconcordant == 1)"
            - "S2 holds open PRIMARY task T3 on ST2 (open_task_count == 1)"
            - "ST4 has ACCEPTED primary (S1) and rescore (S2) tasks and an OPEN case C2"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D9B-01", full_name: "Pat Eighteen", date_of_birth: "1987-06-18" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer Ref", credential: "RPSGT", npi: "NPI-S1" }, as: LabDirector, captures: { s1: $.data.id } }
            - { call: "POST /scorers", payload: { full_name: "Scorer Subj", credential: "RST", npi: "NPI-S2", reliability_pool: true }, as: LabDirector, captures: { s2: $.data.id } }
            - { call: "POST /physicians", payload: { full_name: "Doc One", npi: "NPI-P1" }, as: LabDirector, captures: { dr1: $.data.id } }
            # --- ST1: first non-concordant adjudication for S2 ---
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st1}/complete-acquisition", payload: { total_recording_time_minutes: 360 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk1: $.data.id } }
            - { call: "POST /scoring-tasks/${tk1}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/submit", payload: { obstructive_apneas: 30, central_apneas: 0, mixed_apneas: 0, hypopneas: 30, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s2}", assignment_kind: "RELIABILITY_RESCORE" }, as: LabDirector, captures: { rt1: $.data.id } }
            - { call: "POST /scoring-tasks/${rt1}/start", payload: {}, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rt1}/submit", payload: { obstructive_apneas: 10, central_apneas: 0, mixed_apneas: 0, hypopneas: 10, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rt1}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /inter-rater-cases", payload: { study_id: "${st1}", primary_task_id: "${tk1}", rescore_task_id: "${rt1}" }, as: LabDirector, captures: { c1: $.data.id } }
            - { call: "POST /inter-rater-cases/${c1}/adjudicate", payload: { epochs_concordant: 800 }, as: LabDirector }
            # --- ST2: open PRIMARY task under S2 (the ledger entry) ---
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o2: $.data.id, o2_v: $.data.version } }
            - { call: "POST /referral-orders/${o2}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-2", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o2_v}" }, as: Scheduler, captures: { a2: $.data.id } }
            - { call: "POST /authorizations/${a2}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o2}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st2: $.data.id } }
            - { call: "POST /sleep-studies/${st2}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st2}/complete-acquisition", payload: { total_recording_time_minutes: 360 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st2}", scorer_id: "${s2}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk3: $.data.id } }
            - { call: "POST /scoring-tasks/${tk3}/start", payload: {}, as: Scorer, as_user_id: "${s2}" }
            # --- ST4: second non-concordant case ---
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o4: $.data.id, o4_v: $.data.version } }
            - { call: "POST /referral-orders/${o4}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-4", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o4_v}" }, as: Scheduler, captures: { a4: $.data.id } }
            - { call: "POST /authorizations/${a4}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o4}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st4: $.data.id } }
            - { call: "POST /sleep-studies/${st4}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /sleep-studies/${st4}/complete-acquisition", payload: { total_recording_time_minutes: 360 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st4}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk4: $.data.id } }
            - { call: "POST /scoring-tasks/${tk4}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk4}/submit", payload: { obstructive_apneas: 30, central_apneas: 0, mixed_apneas: 0, hypopneas: 30, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk4}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st4}", scorer_id: "${s2}", assignment_kind: "RELIABILITY_RESCORE" }, as: LabDirector, captures: { rt4: $.data.id } }
            - { call: "POST /scoring-tasks/${rt4}/start", payload: {}, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rt4}/submit", payload: { obstructive_apneas: 10, central_apneas: 0, mixed_apneas: 0, hypopneas: 10, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rt4}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /inter-rater-cases", payload: { study_id: "${st4}", primary_task_id: "${tk4}", rescore_task_id: "${rt4}" }, as: LabDirector, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /inter-rater-cases/${c2}/adjudicate", payload: { epochs_concordant: 800 }, as: LabDirector }
            - { call: "GET /scoring-tasks", payload: {}, as: LabDirector }
          assert:
            - "Before adjudication: GET /scoring-tasks?scorer_id=${s2} shows open_task_count 1 (task ${tk3} IN_PROGRESS; rescore tasks are ACCEPTED and not open)"
            - "After adjudication: ScoringTask.${tk3}.status == RECALLED"
            - "GET /scoring-tasks?scorer_id=${s2}&status=IN_PROGRESS total_count == 0 and status=ASSIGNED total_count == 0 — the assign/recall pair leaves open_task_count unchanged at 0"
