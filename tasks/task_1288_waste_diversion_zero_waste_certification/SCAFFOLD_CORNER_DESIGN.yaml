              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: DataSteward
              captures: { cert_rate: $.data.diversion_rate_certified_pct }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "LANDFILL", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "LV-T2" }
              as: VendorUser
              as_user_id: "${vendor_id}"
            - call: "GET /scorecard_periods/${period_id}"
