      - name: cross_entity_validation_of_patient_program_against_the_dose_order
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=5]
          - errors[ERR_PATIENT_NOT_FOUND]
          - endpoints.POST_/otp/dose-orders
        distinguishing_aspect: "A dose order body foreign key is validated against a different entity than the path: posting a dose order whose patient_id belongs to another program still succeeds because dose orders carry no program constraint of their own, while an unknown patient_id fails at 404 before any clinical check."
        test_recipe:
          setup:
