scaffold_corner_design:
  - section: entities
    instances:
      - name: municipality_create_missing_legal_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Municipality.fields.legal_name
          - validations[priority=28]
        distinguishing_aspect: "legal_name has source: input and no default; omitting it must fail with ERR_INVALID_REQUEST while system fields (id, created_at, version) are minted server-side."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wte/municipalities"
              payload: { population_served: 50000 }
              as: ContractsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: municipality_host_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Municipality.fields.is_host_community
          - entities.Municipality.fields.priority_group
        distinguishing_aspect: "Omitting both optional fields yields is_host_community == false and priority_group == STANDARD."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
          trigger:
            - call: "GET /wte/municipalities/${m1_id}"
              as: Regulator
          assert:
            - "Municipality.${m1_id}.is_host_community == false"
            - "Municipality.${m1_id}.priority_group == STANDARD"

      - name: municipality_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404), distinct from a malformed-id 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wte/municipalities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (404)"

      - name: municipality_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Municipality
        distinguishing_aspect: "List responses carry the fixed envelope: pagination fields limit/offset/total_count/has_more with defaults limit=10, offset=0."
        test_recipe:
          setup: ["two municipalities exist"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
            - call: "POST /wte/municipalities"
              payload: { legal_name: "Town of Bailey", population_served: 8000 }
              as: ContractsManager
          trigger:
            - call: "GET /wte/municipalities"
              as: Regulator
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response envelope data is an array of length 2 with total_count == 2 and has_more == false"
            - "each element carries id, created_at, updated_at, version == 1"

      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Municipality
        distinguishing_aspect: "Client-supplied id/created_at/version in a create payload are ignored; the server mints its own."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000, id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 99 }
              as: ContractsManager
              captures: { m_id: $.data.id, m_v: $.data.version }
          assert:
            - "m_id != 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
            - "m_v == 1"

      - name: enum_field_outside_declared_set_rejected
        claim_type: type_constraints
        grounds:
          - entities.PowerPurchaseAgreement.fields.kind
          - validations[priority=27]
        distinguishing_aspect: "kind outside {PPA, MERCHANT} is rejected ERR_INVALID_REQUEST; likewise a negative contracted_mw."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wte/power-purchase-agreements"
              payload: { counterparty_name: "GridCo", kind: "WHOLESALE", energy_rate_cents_per_mwh: 7500, capacity_payment_cents_per_mw_month: 200000, contracted_mw: 60, term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: EnergyTrader
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"
  - section: state_machines
    instances:
      - name: wsa_initial_state_is_draft_and_deliveries_rejected_until_active
        claim_type: initial_state
        grounds:
          - state_machines.WasteSupplyAgreement
          - validations[priority=6]
        distinguishing_aspect: "A freshly created agreement (no amendment_of_agreement_id) starts DRAFT; delivery creation against it fails ERR_INVALID_STATE until activate fires."
        test_recipe:
          setup: ["Municipality M1; WSA A1 created, never activated"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id, a1_state: $.data.state }
          trigger:
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-1", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "a1_state == DRAFT"
            - "err == ERR_INVALID_STATE (409)"

      - name: delivery_terminal_states_reject_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.WasteDelivery
        distinguishing_aspect: "From terminal ACCEPTED, every action trigger (receive/accept/reject/divert) is rejected ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["WSA ACTIVE, boiler ONLINE, D1 fully ACCEPTED"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
              captures: { a1_v: $.data.version }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-1", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
              captures: { d1_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${d1_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-deliveries/${d1_id}/accept"
              payload: { expected_agreement_version: "${a1_v}" }
              as: PlantOperator
          trigger:
            - call: "POST /wte/waste-deliveries/${d1_id}/receive"
              payload: {}
              as: PlantOperator
              captures: { e1: $.data.error_id }
            - call: "POST /wte/waste-deliveries/${d1_id}/reject"
              payload: { reject_reason: "x" }
              as: PlantOperator
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_INVALID_STATE and e2 == ERR_INVALID_STATE (409)"
            - "WasteDelivery.${d1_id}.status == ACCEPTED and version == 3 (create + receive + accept)"

      - name: outage_start_requires_approved_plan
        claim_type: precondition_enforcement
        grounds:
          - state_machines.OutageWindow.SCHEDULED_to_ACTIVE
          - errors[ERR_DIVERSION_PLAN_REQUIRED]
        distinguishing_aspect: "An outage whose diversion plan exists but is NOT approved (or absent) cannot start — ERR_DIVERSION_PLAN_REQUIRED until approve fires."
        test_recipe:
          setup: ["Boiler B1; outage O1 SCHEDULED with a plan that has one leg but is not yet approved"]
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /wte/outage-windows"
              payload: { boiler_id: "${b1_id}", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", reason: "S1", kind: PLANNED }
              as: PlantOperator
              captures: { o1_id: $.data.id }
            - call: "POST /wte/diversion-plans"
              payload: { outage_id: "${o1_id}", max_diversion_tpd: 200 }
              as: PlantOperator
              captures: { dp_id: $.data.id }
            - call: "POST /wte/diversion-plans/${dp_id}/legs"
              payload: { receiving_facility_name: "County Landfill 9", planned_tonnes: 400 }
              as: PlantOperator
          trigger:
            - call: "POST /wte/outage-windows/${o1_id}/start"
              payload: { expected_boiler_version: "${b1_v}" }
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DIVERSION_PLAN_REQUIRED (422)"
            - "OutageWindow.${o1_id}.status == SCHEDULED and Boiler.${b1_id}.status == ONLINE"

      - name: report_finalized_is_immutable
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DailyThroughputReport
        distinguishing_aspect: "PUT on a FINALIZED report is rejected ERR_INVALID_STATE; computed fields stay frozen at their finalized values."
        test_recipe:
          setup: ["Boiler 150 MW; report R1 FINALIZED at thermal 150.000"]
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 150, max_steam_tph: 500 }
              as: PlantOperator
            - call: "POST /wte/daily-throughput-reports"
              payload: { report_date: "2026-09-11", waste_processed_tonnes: 500, avg_heating_value_mj_per_kg: 9.0, operating_hours: 30 }
              as: PlantOperator
              captures: { r1_id: $.data.id }
            - call: "POST /wte/daily-throughput-reports/${r1_id}/finalize"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "PUT /wte/daily-throughput-reports/${r1_id}"
              payload: { waste_processed_tonnes: 100 }
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409)"
            - "DailyThroughputReport.${r1_id}.thermal_input_mw == 150.000 (frozen)"

      - name: wsa_clock_expiry_auto_transition
        claim_type: valid_transition
        grounds:
          - state_machines.WasteSupplyAgreement.ACTIVE_to_EXPIRED
        distinguishing_aspect: "Advancing the logical clock past term_end flips an ACTIVE agreement to EXPIRED with no direct API action; afterwards activate/terminate are rejected."
        test_recipe:
          setup: ["WSA A1 ACTIVE with term 2026-01-01..2026-09-10"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-09-10T00:00:00Z", guaranteed_annual_tonnage: 100, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
          trigger:
            - call: "POST /wte/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: Regulator
            - call: "GET /wte/waste-supply-agreements/${a1_id}"
              as: ContractsManager
              captures: { a1_state: $.data.state }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/terminate"
              payload: {}
              as: ContractsManager
              captures: { term_err: $.data.error_id }
          assert:
            - "a1_state == EXPIRED (system transition at term_end, exclusive end)"
            - "term_err == ERR_INVALID_STATE (409)"
  - section: calculations
    instances:
      - name: tip_floor_cap_inclusive_boundary_and_host_override
        claim_type: correct_result
        grounds:
          - calculations.compute_tip_floor_allocation
          - errors[ERR_PRIORITY_NOT_AVAILABLE]
        distinguishing_aspect: "Same-day SCHEDULED+RECEIVED tonnes at exactly 1000 - x admits a delivery of x tonnes (inclusive cap); x+epsilon is rejected for a STANDARD municipality but admitted for the HOST municipality under an in-window priority agreement."
        test_recipe:
          setup:
            - "STANDARD municipality M1 with ACTIVE WSA A1; HOST municipality H1 with ACTIVE WSA A2 and an in-window HostCommunityAgreement (priority enabled)"
            - "990 t of M1 deliveries already SCHEDULED on 2026-09-03 (99 x 10 t)"
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/municipalities"
              payload: { legal_name: "Host Town of Bracebridge", population_served: 20000, is_host_community: true, priority_group: HOST }
              as: ContractsManager
              captures: { h1_id: $.data.id }
            - call: "POST /wte/host-community-agreements"
              payload: { municipality_id: "${h1_id}", annual_payment_cents: 50000000, payment_due_month: 3, local_waste_priority_enabled: true, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: ContractsManager
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 5000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${h1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 5000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a2_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a2_id}/activate"
              payload: {}
              as: ContractsManager
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-990", tonnes: 990, heating_value_mj_per_kg: 10, delivered_at: "2026-09-03T08:00:00Z" }
              as: PlantOperator
              captures: { d990_id: $.data.id }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-10", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-03T09:00:00Z" }
              as: PlantOperator
              captures: { d10_id: $.data.id }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-11", tonnes: 11, heating_value_mj_per_kg: 10, delivered_at: "2026-09-03T10:00:00Z" }
              as: PlantOperator
              captures: { d11_id: $.data.id }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a2_id}", manifest_ref: "MAN-H20", tonnes: 20, heating_value_mj_per_kg: 10, delivered_at: "2026-09-03T11:00:00Z" }
              as: PlantOperator
              captures: { dh_id: $.data.id }
          trigger:
            - call: "POST /wte/waste-deliveries/${d10_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-deliveries/${d11_id}/receive"
              payload: {}
              as: PlantOperator
              captures: { over_err: $.data.error_id }
            - call: "POST /wte/waste-deliveries/${dh_id}/receive"
              payload: {}
              as: PlantOperator
          assert:
            - "10-tonne receive succeeded: 990 + 10 == 1000 <= 1000 (inclusive boundary)"
            - "over_err == ERR_PRIORITY_NOT_AVAILABLE (422): 1000 + 11 > 1000 for STANDARD municipality"
            - "WasteDelivery.${dh_id}.status == RECEIVED: host priority overrode the exhausted cap"

      - name: emissions_rolling_daily_average_breach
        claim_type: correct_result
        grounds:
          - calculations.compute_emissions_average
        distinguishing_aspect: "A reading under the hourly limit still breaches via the rolling daily average: readings 140, 140, 140 in a 24h window give avg 140 > daily_limit 130 -> exceedance true, while the first two readings (avg below limit at their time) were clean."
        test_recipe:
          setup: ["ACTIVE permit NOx: hourly 200, daily 130, window 24h"]
          setup_api_calls:
            - call: "POST /wte/emissions-permits"
              payload: { pollutant: "NOx", hourly_limit: 200, daily_limit: 130, rolling_avg_window_hours: 24 }
              as: EnvironmentalOfficer
              captures: { ep_id: $.data.id }
            - call: "POST /wte/emissions-readings"
              payload: { permit_id: "${ep_id}", value: 120, measured_at: "2026-09-02T06:00:00Z" }
              as: EnvironmentalOfficer
              captures: { r1_exc: $.data.exceedance }
          trigger:
            - call: "POST /wte/emissions-readings"
              payload: { permit_id: "${ep_id}", value: 140, measured_at: "2026-09-02T12:00:00Z" }
              as: EnvironmentalOfficer
              captures: { r2_exc: $.data.exceedance }
            - call: "POST /wte/emissions-readings"
              payload: { permit_id: "${ep_id}", value: 140, measured_at: "2026-09-02T18:00:00Z" }
              as: EnvironmentalOfficer
              captures: { r3_exc: $.data.exceedance }
          assert:
            - "r1_exc == false (120 <= 200, avg 120 <= 130)"
            - "r2_exc == false (avg 130 not > 130 — strict comparison)"
            - "r3_exc == true (avg (120+140+140)/3 = 133.333333 > 130)"

      - name: put_or_pay_monthly_rollover_deduction
        claim_type: correct_result
        grounds:
          - calculations.compute_put_or_pay_settlement
        distinguishing_aspect: "MONTHLY cadence: October's billed shortfall (60 t / 540000 c) converts to a tonnage-equivalent deduction in November, so November bills only 10 t / 90000 c despite a further 30 t delivery — prior-period billing is never double-charged."
        test_recipe:
          setup: ["WSA A1 ACTIVE MONTHLY, guarantee 1200 t/yr (100 t/month), rate 9000; boiler ONLINE; 40 t accepted in Oct"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1200, tipping_fee_per_tonne_cents: 9000, put_or_pay_settlement_cadence: MONTHLY }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
              captures: { a1_v: $.data.version }
            - call: "POST /wte/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: Regulator
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-OCT", tonnes: 40, heating_value_mj_per_kg: 10, delivered_at: "2026-10-10T08:00:00Z" }
              as: PlantOperator
              captures: { doct_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${doct_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-deliveries/${doct_id}/accept"
              payload: { expected_agreement_version: "${a1_v}" }
              as: PlantOperator
            - call: "POST /wte/settlements/put-or-pay/run"
              payload: { agreement_id: "${a1_id}" }
              as: ContractsManager
              captures: { oct_short_t: $.data.shortfall_tonnes, oct_short_c: $.data.shortfall_cents }
            - call: "POST /wte/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: Regulator
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-NOV", tonnes: 30, heating_value_mj_per_kg: 10, delivered_at: "2026-11-10T08:00:00Z" }
              as: PlantOperator
              captures: { dnov_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${dnov_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-deliveries/${dnov_id}/accept"
              payload: { expected_agreement_version: "${a1_v} + 1" }
              as: PlantOperator
          trigger:
            - call: "POST /wte/settlements/put-or-pay/run"
              payload: { agreement_id: "${a1_id}" }
              as: ContractsManager
              captures: { nov_short_t: $.data.shortfall_tonnes, nov_short_c: $.data.shortfall_cents, nov_billed: $.data.already_billed_cents }
          assert:
            - "oct_short_t == 60 and oct_short_c == 540000"
            - "nov_billed == 540000"
            - "nov_short_t == 10 and nov_short_c == 90000 (100 - 30 - 540000/9000)"
  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with a missing or undeclared X-User-Role is rejected 401 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wte/municipalities"
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (401)"

      - name: not_found_beats_body_shape
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=28]
        distinguishing_aspect: "A POST to a non-existent parent path with a malformed body reports ERR_NOT_FOUND (existence priority 3), not ERR_INVALID_REQUEST (priority 28)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wte/waste-deliveries/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/receive"
              payload: {}
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (404)"

      - name: duplicate_manifest_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors[ERR_DUPLICATE_MANIFEST]
        distinguishing_aspect: "manifest_ref is globally unique; a second delivery reusing it fails ERR_DUPLICATE_MANIFEST even against a different agreement."
        test_recipe:
          setup: ["WSA A1 ACTIVE; delivery D1 with manifest_ref MAN-DUP exists"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-DUP", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
          trigger:
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-DUP", tonnes: 5, heating_value_mj_per_kg: 9, delivered_at: "2026-09-03T08:00:00Z" }
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_MANIFEST (422)"

      - name: duplicate_report_date_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors[ERR_DUPLICATE_REPORT_DATE]
        distinguishing_aspect: "A second report for the same report_date fails ERR_DUPLICATE_REPORT_DATE regardless of differing contents."
        test_recipe:
          setup: ["Report for 2026-09-11 exists"]
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 150, max_steam_tph: 500 }
              as: PlantOperator
            - call: "POST /wte/daily-throughput-reports"
              payload: { report_date: "2026-09-11", waste_processed_tonnes: 500, avg_heating_value_mj_per_kg: 9.0, operating_hours: 30 }
              as: PlantOperator
          trigger:
            - call: "POST /wte/daily-throughput-reports"
              payload: { report_date: "2026-09-11", waste_processed_tonnes: 100, avg_heating_value_mj_per_kg: 5.0, operating_hours: 10 }
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_REPORT_DATE (422)"

      - name: duplicate_active_permit_per_pollutant_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE_PERMIT]
        distinguishing_aspect: "A second ACTIVE permit for the same pollutant fails; after suspending the first, a replacement succeeds."
        test_recipe:
          setup: ["ACTIVE permit for NOx exists"]
          setup_api_calls:
            - call: "POST /wte/emissions-permits"
              payload: { pollutant: "NOx", hourly_limit: 200, daily_limit: 150, rolling_avg_window_hours: 24 }
              as: EnvironmentalOfficer
              captures: { ep1_id: $.data.id }
          trigger:
            - call: "POST /wte/emissions-permits"
              payload: { pollutant: "NOx", hourly_limit: 180, daily_limit: 140 }
              as: EnvironmentalOfficer
              captures: { dup_err: $.data.error_id }
            - call: "POST /wte/emissions-permits/${ep1_id}/suspend"
              payload: {}
              as: Regulator
            - call: "POST /wte/emissions-permits"
              payload: { pollutant: "NOx", hourly_limit: 180, daily_limit: 140 }
              as: EnvironmentalOfficer
              captures: { ep2_id: $.data.id }
          assert:
            - "dup_err == ERR_DUPLICATE_PERMIT (422)"
            - "after suspend, second permit created with status ACTIVE"

      - name: host_agreement_requires_host_municipality
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=16]
          - errors[ERR_NOT_HOST_COMMUNITY]
        distinguishing_aspect: "HostCommunityAgreement against a municipality with is_host_community == false fails ERR_NOT_HOST_COMMUNITY."
        test_recipe:
          setup: ["STANDARD municipality M1"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /wte/host-community-agreements"
              payload: { municipality_id: "${m1_id}", annual_payment_cents: 50000000, payment_due_month: 3, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: ContractsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_HOST_COMMUNITY (422)"

      - name: legs_frozen_after_plan_approval
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_PLAN_ALREADY_APPROVED]
          - errors[ERR_NO_DIVERSION_LEGS]
        distinguishing_aspect: "Approve requires at least one leg (ERR_NO_DIVERSION_LEGS when empty); once approved, adding a leg fails ERR_PLAN_ALREADY_APPROVED."
        test_recipe:
          setup: ["Boiler B1; outage O1; plan P1 with no legs, then with one leg and approved"]
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /wte/outage-windows"
              payload: { boiler_id: "${b1_id}", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", reason: "S1", kind: PLANNED }
              as: PlantOperator
              captures: { o1_id: $.data.id }
            - call: "POST /wte/diversion-plans"
              payload: { outage_id: "${o1_id}", max_diversion_tpd: 200 }
              as: PlantOperator
              captures: { dp_id: $.data.id }
            - call: "POST /wte/diversion-plans/${dp_id}/approve"
              payload: {}
              as: ContractsManager
              captures: { empty_err: $.data.error_id }
            - call: "POST /wte/diversion-plans/${dp_id}/legs"
              payload: { receiving_facility_name: "County Landfill 9", planned_tonnes: 400 }
              as: PlantOperator
            - call: "POST /wte/diversion-plans/${dp_id}/approve"
              payload: {}
              as: ContractsManager
          trigger:
            - call: "POST /wte/diversion-plans/${dp_id}/legs"
              payload: { receiving_facility_name: "Transfer Station 4", planned_tonnes: 100 }
              as: PlantOperator
              captures: { frozen_err: $.data.error_id }
          assert:
            - "empty_err == ERR_NO_DIVERSION_LEGS (422)"
            - "DiversionPlan.${dp_id}.approved == true after second approve"
            - "frozen_err == ERR_PLAN_ALREADY_APPROVED (422)"

      - name: merchant_delivery_requires_price_snapshot
        claim_type: conditional_validation
        grounds:
          - validations[priority=21]
          - errors[ERR_MERCHANT_PRICE_REQUIRED]
        distinguishing_aspect: "The merchant_price field requirement is conditional on agreement kind: MERCHANT without the price fails; PPA without it succeeds."
        test_recipe:
          setup: ["ACTIVE MERCHANT PPA P2"]
          setup_api_calls:
            - call: "POST /wte/power-purchase-agreements"
              payload: { counterparty_name: "SpotMart", kind: MERCHANT, energy_rate_cents_per_mwh: 7000, capacity_payment_cents_per_mw_month: 0, contracted_mw: 10, term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: EnergyTrader
              captures: { p2_id: $.data.id }
            - call: "POST /wte/power-purchase-agreements/${p2_id}/activate"
              payload: {}
              as: EnergyTrader
          trigger:
            - call: "POST /wte/energy-deliveries"
              payload: { ppa_id: "${p2_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-11T00:00:00Z", delivered_mwh: 500 }
              as: EnergyTrader
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MERCHANT_PRICE_REQUIRED (422)"

      - name: energy_delivery_period_outside_term_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=20]
          - errors[ERR_PERIOD_OUTSIDE_TERM]
        distinguishing_aspect: "A delivery whose billing period straddles term_end fails ERR_PERIOD_OUTSIDE_TERM; a period ending exactly at term_end (exclusive) is valid."
        test_recipe:
          setup: ["ACTIVE PPA P1 term 2026-01-01..2026-12-01"]
          setup_api_calls:
            - call: "POST /wte/power-purchase-agreements"
              payload: { counterparty_name: "GridCo", kind: PPA, energy_rate_cents_per_mwh: 7500, capacity_payment_cents_per_mw_month: 200000, contracted_mw: 60, term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-01T00:00:00Z" }
              as: EnergyTrader
              captures: { p1_id: $.data.id }
            - call: "POST /wte/power-purchase-agreements/${p1_id}/activate"
              payload: {}
              as: EnergyTrader
          trigger:
            - call: "POST /wte/energy-deliveries"
              payload: { ppa_id: "${p1_id}", period_start: "2026-11-20T00:00:00Z", period_end: "2026-12-05T00:00:00Z", delivered_mwh: 100 }
              as: EnergyTrader
              captures: { err: $.data.error_id }
            - call: "POST /wte/energy-deliveries"
              payload: { ppa_id: "${p1_id}", period_start: "2026-11-20T00:00:00Z", period_end: "2026-12-01T00:00:00Z", delivered_mwh: 100 }
              as: EnergyTrader
              captures: { ed_id: $.data.id }
          assert:
            - "err == ERR_PERIOD_OUTSIDE_TERM (422) for the straddling period"
            - "period ending exactly at term_end succeeds: EnergyDelivery.${ed_id}.billed_amount_cents == 750000"
  - section: endpoints
    instances:
      - name: fk_reverse_reachability_lists_children
        claim_type: filtered_list
        grounds:
          - entities.WasteDelivery.fields.agreement_id
          - entities.EnergyDelivery.fields.ppa_id
        distinguishing_aspect: "Every FK is reverse-reachable: deliveries filterable by agreement_id, energy deliveries by ppa_id, tests nested under their shipment; a filtered list returns only matching children."
        test_recipe:
          setup: ["Two WSAs ACTIVE under M1; one delivery under A1, none under A2"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 500, tipping_fee_per_tonne_cents: 7000 }
              as: ContractsManager
              captures: { a2_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a2_id}/activate"
              payload: {}
              as: ContractsManager
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-1", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
          trigger:
            - call: "GET /wte/waste-deliveries"
              payload: { agreement_id: "${a2_id}" }
              as: ContractsManager
          assert:
            - "GET /wte/waste-deliveries?agreement_id=A2 returns an empty array with total_count == 0"
            - "GET /wte/waste-deliveries?agreement_id=A1 returns exactly the one delivery"

      - name: put_edit_of_scheduled_delivery_recomputes_projection
        claim_type: side_effect_execution
        grounds:
          - entities.WasteDelivery.fields.projected_fee_cents
        distinguishing_aspect: "PUT on a SCHEDULED delivery updates tonnes and the projected_fee_cents read model reflects the new tonnes at the current agreement rate."
        test_recipe:
          setup: ["WSA ACTIVE rate 8000; D1 SCHEDULED 10 t"]
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-1", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
              captures: { d1_id: $.data.id }
          trigger:
            - call: "PUT /wte/waste-deliveries/${d1_id}"
              payload: { tonnes: 25 }
              as: PlantOperator
            - call: "GET /wte/waste-deliveries/${d1_id}"
              as: ContractsManager
              captures: { proj: $.data.projected_fee_cents, d1_v: $.data.version }
          assert:
            - "proj == 200000 (25 * 8000)"
            - "d1_v == 2"

      - name: derate_range_validation
        claim_type: conditional_action
        grounds:
          - state_machines.Boiler.ONLINE_to_DERATED
          - validations[priority=27]
        distinguishing_aspect: "derated_capacity_mw must be strictly between 0 and max_thermal_capacity_mw: 0 and 50 (== max) are ERR_INVALID_REQUEST; 30 succeeds."
        test_recipe:
          setup: ["Boiler B1 ONLINE 50 MW"]
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /wte/boilers/${b1_id}/derate"
              payload: { derated_capacity_mw: 0 }
              as: PlantOperator
              captures: { e0: $.data.error_id }
            - call: "POST /wte/boilers/${b1_id}/derate"
              payload: { derated_capacity_mw: 50 }
              as: PlantOperator
              captures: { e50: $.data.error_id }
            - call: "POST /wte/boilers/${b1_id}/derate"
              payload: { derated_capacity_mw: 30 }
              as: PlantOperator
          assert:
            - "e0 == ERR_INVALID_REQUEST and e50 == ERR_INVALID_REQUEST"
            - "Boiler.${b1_id}.status == DERATED and derated_capacity_mw == 30"

      - name: decommission_blocked_by_scheduled_outage
        claim_type: conditional_action
        grounds:
          - state_machines.Boiler.ONLINE_to_OFFLINE
          - errors[ERR_OUTAGE_IN_PROGRESS]
        distinguishing_aspect: "A boiler with a merely SCHEDULED (not yet ACTIVE) outage cannot be decommissioned; after cancelling the outage, decommission succeeds."
        test_recipe:
          setup: ["Boiler B1 ONLINE with SCHEDULED outage O1"]
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /wte/outage-windows"
              payload: { boiler_id: "${b1_id}", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", reason: "S1", kind: PLANNED }
              as: PlantOperator
              captures: { o1_id: $.data.id }
          trigger:
            - call: "POST /wte/boilers/${b1_id}/decommission"
              payload: {}
              as: PlantOperator
              captures: { blk: $.data.error_id }
            - call: "POST /wte/outage-windows/${o1_id}/cancel"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/boilers/${b1_id}/decommission"
              payload: {}
              as: PlantOperator
          assert:
            - "blk == ERR_OUTAGE_IN_PROGRESS (422)"
            - "after cancel: Boiler.${b1_id}.status == OFFLINE"
