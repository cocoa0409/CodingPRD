              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Corner Allowed Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2024", contact_email: "ops@allowed.example", callback_phone: "+1-202-555-0124", credit_limit_cents: 500000 }
              as: POLICY_ADMIN
