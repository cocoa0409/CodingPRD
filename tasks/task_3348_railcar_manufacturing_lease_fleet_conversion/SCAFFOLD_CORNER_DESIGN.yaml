      substitute_component_id all return the same endorsement id, which the by-id read confirms with all
      three foreign keys.'
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-L4 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-L4) with
        one WHEELSET WS-L4 bill-of-material row at qty_per_car 2; the substitute WHEELSET WS-L5 exists
        as a second catalogue part.
      - A SOLD order of 1 car stands DRAFT at version 1, and one endorsement links it to the pair (original
        WS-L4, substitute WS-L5).
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
