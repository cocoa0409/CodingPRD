# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: care_fund_new_sale_vs_resale_contribution
        grounds:
          - calculations.care_fund_contribution
          - entities.Deed.fields.care_fund_contribution_cents
        distinguishing_aspect: |
          For an identical purchase_price_cents=1000000, NEW_SALE contribution is
          max(15%,25000)=150000 while RESALE is 10% with no floor=100000 — divergent
          results on the Deed (care-fund) domain.
        test_recipe:
          setup:
            - "One cemetery; two AVAILABLE GRAVE plots; one holder; clock at default 2026-05-01."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot1_id: "$.data.id", plot1_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "2", gis_lat: 1.0, gis_lng: 2.1, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot2_id: "$.data.id", plot2_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot1_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot1_v}" }, as: Registrar, captures: { deedA_id: "$.data.id", deedA_contrib: "$.data.care_fund_contribution_cents" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot2_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "RESALE", expected_plot_version: "${plot2_v}" }, as: Registrar, captures: { deedB_id: "$.data.id", deedB_contrib: "$.data.care_fund_contribution_cents" } }
          assert:
            - "Deed.${deedA_id}.care_fund_contribution_cents == 150000"
            - "Deed.${deedB_id}.care_fund_contribution_cents == 100000"

      - name: disinterment_relocation_vs_removal_settlement
        grounds:
          - calculations.disinterment_settlement
          - entities.DisintermentAuthorization.fields.settlement_cents
          - state_machines.DisintermentAuthorization.APPROVED_to_EXECUTED
        distinguishing_aspect: |
          Against the same 150000 deed contribution, RELOCATION disburses 50%=75000 and
          REMOVAL disburses 25%=37500 — divergent settlement on the disinterment domain,
          a different entity domain than the Deed care-fund contribution above.
        test_recipe:
          setup:
            - "Two completed interments (plots A and B), each backed by an ISSUED NEW_SALE deed (contribution 150000); disinterment invoices paid; clock advanced past each scheduled_date."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            # --- pipeline A (RELOCATION) ---
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plotA_id: "$.data.id", plotA_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "Kin A", email: "a@x.com", phone: "1" }, as: Registrar, captures: { holderA_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plotA_id}", holder_id: "${holderA_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plotA_v}" }, as: Registrar, captures: { deedA_id: "$.data.id", saleInvA_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInvA_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { decA_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plotA_id}", decedent_id: "${decA_id}", deed_id: "${deedA_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: Registrar, captures: { intA_id: "$.data.id", svcInvA_id: "$.data.service_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${svcInvA_id}", amount_cents: 96525, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/interments/${intA_id}/open", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/interments/${intA_id}/complete", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations", payload: { interment_id: "${intA_id}", reason: "family relocation", disinterment_type: "RELOCATION", target_plot_id: "${plotA_id}" }, as: Registrar, captures: { authA_id: "$.data.id", disInvA_id: "$.data.disinterment_invoice_id" } }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${authA_id}/record-clearance", payload: {}, as: HealthOfficer }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${authA_id}/record-consent", payload: {}, as: RightHolder, as_user_id: "${holderA_id}" }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${authA_id}/approve", payload: {}, as: CemeteryDirector, as_user_id: "dir-1" }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${disInvA_id}", amount_cents: 214500, method: "CARD" }, as: FinanceOfficer }
            # --- pipeline B (REMOVAL) ---
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "2", gis_lat: 1.0, gis_lng: 2.2, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plotB_id: "$.data.id", plotB_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "Kin B", email: "b@x.com", phone: "2" }, as: Registrar, captures: { holderB_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plotB_id}", holder_id: "${holderB_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plotB_v}" }, as: Registrar, captures: { deedB_id: "$.data.id", saleInvB_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInvB_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec B", date_of_death: "2026-04-02" }, as: Registrar, captures: { decB_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plotB_id}", decedent_id: "${decB_id}", deed_id: "${deedB_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-07-01", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }, as: Registrar, captures: { intB_id: "$.data.id", svcInvB_id: "$.data.service_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${svcInvB_id}", amount_cents: 96525, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/interments/${intB_id}/open", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/interments/${intB_id}/complete", payload: {}, as: GroundsForeman }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations", payload: { interment_id: "${intB_id}", reason: "out of area removal", disinterment_type: "REMOVAL" }, as: Registrar, captures: { authB_id: "$.data.id", disInvB_id: "$.data.disinterment_invoice_id" } }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${authB_id}/record-clearance", payload: {}, as: HealthOfficer }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${authB_id}/record-consent", payload: {}, as: RightHolder, as_user_id: "${holderB_id}" }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${authB_id}/approve", payload: {}, as: CemeteryDirector, as_user_id: "dir-1" }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${disInvB_id}", amount_cents: 214500, method: "CARD" }, as: FinanceOfficer }
          trigger:
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${authA_id}/execute", payload: {}, as: Registrar, as_user_id: "reg-9" }
            - { call: "POST /cemetery-mgmt/disinterment-authorizations/${authB_id}/execute", payload: {}, as: Registrar, as_user_id: "reg-9" }
          assert:
            - "DisintermentAuthorization.${authA_id}.settlement_cents == 75000"
            - "DisintermentAuthorization.${authB_id}.settlement_cents == 37500"
            - "Interment.${intA_id}.operational_status == DISINTERRED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: interment_service_fee_tiered_composition
        grounds:
          - calculations.interment_service_fee
          - entities.Interment.fields.service_fee_cents
        distinguishing_aspect: |
          Mode (a): non-linear composition of >=3 inputs — base GRAVE 90000 + depth-tier-2
          15000 + WEEKEND 20000 + SHORT_NOTICE 25000 = 150000, with HOLIDAY-dominates-WEEKEND
          and depth-tier branching.
        test_recipe:
          setup:
            - "ISSUED GRAVE deed; clock at 2026-05-01 (Fri); interment scheduled 2026-05-02 (Sat, 1 day out => weekend + short-notice) at depth 2."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec_id: "$.data.id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 2, scheduled_date: "2026-05-02", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T11:00:00Z" }, as: Registrar, captures: { int_id: "$.data.id" } }
          assert:
            - "Interment.${int_id}.service_fee_cents == 150000"
            - "Interment.${int_id}.day_type == WEEKEND"

      - name: invoice_tax_round_per_line_then_sum
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.tax_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b): the INTERMENT_SERVICE invoice has taxable lines [90000,15000,20000,25000];
          rounding each line's 7.25% tax half-up then summing gives 10876, whereas summing then
          rounding gives 10875 — the scaffold pins round-per-line-then-sum, so total==160876.
        test_recipe:
          setup:
            - "Same weekend+short-notice depth-2 GRAVE interment as above; observe its auto-generated INTERMENT_SERVICE invoice."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 2, scheduled_date: "2026-05-02", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T11:00:00Z" }, as: Registrar, captures: { int_id: "$.data.id", svcInv_id: "$.data.service_invoice_id" } }
          trigger:
            - { call: "GET /cemetery-mgmt/invoices/${svcInv_id}", payload: {}, as: FinanceOfficer, captures: { obs_tax: "$.data.tax_cents", obs_total: "$.data.total_cents" } }
          assert:
            - "Invoice.${svcInv_id}.subtotal_cents == 150000"
            - "Invoice.${svcInv_id}.tax_cents == 10876"
            - "Invoice.${svcInv_id}.total_cents == 160876"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deed_transfer_cycle_returns_to_issued
        grounds:
          - state_machines.Deed.ISSUED_to_TRANSFER_PENDING
          - state_machines.Deed.TRANSFER_PENDING_to_ISSUED
          - entities.Deed.fields.holder_id
        distinguishing_aspect: |
          Cyclic machine on Deed: ISSUED -> TRANSFER_PENDING -> ISSUED with holder_id rewritten,
          so the same deed re-enters ISSUED and can be transferred again (a true A->B->A loop).
        test_recipe:
          setup:
            - "ISSUED deed held by holder1; a second holder2 exists to receive the transfer."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "Holder One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder1_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "Holder Two", email: "h2@x.com", phone: "2" }, as: Registrar, captures: { holder2_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder1_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/deeds/${deed_id}/transfer", payload: { new_holder_id: "${holder2_id}" }, as: Registrar }
          trigger:
            - { call: "POST /cemetery-mgmt/deeds/${deed_id}/accept-transfer", payload: {}, as: RightHolder, as_user_id: "${holder2_id}", captures: { new_status: "$.data.status", new_holder: "$.data.holder_id" } }
          assert:
            - "Deed.${deed_id}.status == ISSUED"
            - "Deed.${deed_id}.holder_id == ${holder2_id}"

      - name: interment_parallel_billing_vs_operational_axes
        grounds:
          - state_machines.Interment.INVOICED_to_PAID
          - entities.Interment.fields.billing_status
          - entities.Interment.fields.operational_status
        distinguishing_aspect: |
          Parallel dimensions on one Interment: paying the service invoice advances
          billing_status INVOICED->PAID while operational_status stays SCHEDULED — the two axes
          evolve independently on the same row.
        test_recipe:
          setup:
            - "Scheduled interment (operational SCHEDULED, billing INVOICED) with an unpaid service invoice."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Dec A", date_of_death: "2026-04-01" }, as: Registrar, captures: { dec_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/interments", payload: { plot_id: "${plot_id}", decedent_id: "${dec_id}", deed_id: "${deed_id}", interment_type: "BURIAL", depth_position: 1, scheduled_date: "2026-06-01", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: Registrar, captures: { int_id: "$.data.id", svcInv_id: "$.data.service_invoice_id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${svcInv_id}", amount_cents: 96525, method: "CARD" }, as: FinanceOfficer }
          assert:
            - "Interment.${int_id}.billing_status == PAID"
            - "Interment.${int_id}.operational_status == SCHEDULED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deed_surrender_reclaims_plot_and_cancels_marker
        grounds:
          - state_machines.Deed.ISSUED_to_SURRENDERED
          - state_machines.Plot.SOLD_to_AVAILABLE
          - state_machines.MarkerPermit.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from a surrender trigger: Deed->SURRENDERED (L1) causes Plot->AVAILABLE
          (L2) which causes the plot's APPROVED MarkerPermit->CANCELLED (L3); each link is caused
          by the prior link, not the original action.
        test_recipe:
          setup:
            - "ISSUED deed on a SOLD plot with no active interments, plus an APPROVED MarkerPermit on that plot."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer }
            - { call: "POST /cemetery-mgmt/marker-permits", payload: { plot_id: "${plot_id}", deed_id: "${deed_id}", marker_type: "FLAT", foundation_length_in: 24, foundation_width_in: 12 }, as: Registrar, captures: { permit_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/marker-permits/${permit_id}/approve", payload: {}, as: CemeteryDirector }
          trigger:
            - { call: "POST /cemetery-mgmt/deeds/${deed_id}/surrender", payload: {}, as: Registrar, captures: { deed_status: "$.data.status" } }
          assert:
            - "Deed.${deed_id}.status == SURRENDERED"
            - "Plot.${plot_id}.status == AVAILABLE"
            - "MarkerPermit.${permit_id}.status == CANCELLED"

      - name: payment_activates_deed_and_posts_contribution
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Deed.PENDING_PAYMENT_to_ISSUED
          - state_machines.Plot.RESERVED_to_SOLD
          - entities.Cemetery.fields.perpetual_care_fund_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from a distinct payment trigger: Payment -> DEED_SALE Invoice PAID (L1)
          causes Deed->ISSUED + Plot->SOLD (L2), which causes a CareFundEntry CONTRIBUTION posting
          that lifts Cemetery balance to 150000 (L3).
        test_recipe:
          setup:
            - "A PENDING_PAYMENT deed on a RESERVED plot with an unpaid DEED_SALE invoice; cemetery fund balance 0."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
            - { call: "POST /cemetery-mgmt/holders", payload: { full_name: "H One", email: "h1@x.com", phone: "1" }, as: Registrar, captures: { holder_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
          trigger:
            - { call: "POST /cemetery-mgmt/payments", payload: { invoice_id: "${saleInv_id}", amount_cents: 1222500, method: "CARD" }, as: FinanceOfficer, captures: { pay_id: "$.data.id" } }
          assert:
            - "Invoice.${saleInv_id}.status == PAID"
            - "Deed.${deed_id}.status == ISSUED"
            - "Plot.${plot_id}.status == SOLD"
            - "Cemetery.${cem_id}.perpetual_care_fund_balance_cents == 150000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: interment_referential_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_DEED_NOT_ISSUED]
        distinguishing_aspect: |
          business_referential (deed not ISSUED, priority 7) is reported over business_temporal
          (scheduled_date in the past, priority 9) when both fail on the same POST /interments —
          a referential-vs-temporal pairing.
        test_recipe:
          setup:
            - "A PENDING_PAYMENT (not ISSUED) deed on a plot; clock at 2026-05-01; interment attempted for a past date 2026-04-01."
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood", timezone: "UTC", crew_team_count: 1 }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Registrar }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar, captures: { plot_id: "$.data.id", plot_v: "$.data.version" } }
