          setup_api_calls:
            - call: "POST /clinic/households"
              payload: { account_name: "Sig" }
              as: Receptionist
              captures: { hh: $.data.id }
            - call: "POST /clinic/patients"
              payload: { household_id: "${hh}", name: "OnePet", species: "CAT", weight_kg: 4 }
