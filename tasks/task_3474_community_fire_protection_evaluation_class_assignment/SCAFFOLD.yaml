# =============================================================================
# PRD Benchmark Scaffold — Community Fire Protection Evaluation & Class Assignment
# (ISO-style Public Protection Classification grading service)
# =============================================================================

scenario: |
  Community Fire Protection Evaluation & Class Assignment (Insurance Services Office Public Protection Classification): community evaluation on a schedule assessing fire department staffing, apparatus, training and response, water supply evaluation including hydrant distribution, flow testing and alternate supply for rural areas, emergency communications evaluation covering dispatch staffing and alarm handling, community risk reduction credit for prevention programs, code enforcement and public education, classification assignment on a numeric scale with split classifications for areas beyond hydrant distance, insurer usage of the class in rating with premium consequences for property owners, community request for reevaluation after improvements with documentation, appeals and data verification with the fire department

domain_name: fire-protection-classification
api_prefix: /ppc

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, scheduled_actions]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Community (fire protection area) name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: population, type: integer, source: input, description: "Resident population", constraints: "> 0" }
      - { name: area_sq_miles, type: number, source: input, description: "Protected area in square miles", constraints: "> 0" }
      - { name: rural_area_pct, type: number, source: input, description: "Percent of area without municipal hydrant coverage", constraints: "0..100 inclusive" }
      - { name: comms_operators_on_duty_min, type: integer, source: input, description: "Minimum dispatch operators on duty at any time (set via attest-comms)", default: 0, constraints: ">= 0" }
      - { name: comms_avg_alarm_to_dispatch_seconds, type: integer, source: input, description: "Average alarm receipt to dispatch seconds (set via attest-comms)", default: 999, constraints: ">= 0" }
      - { name: comms_redundant_circuits, type: boolean, source: input, description: "Dispatch circuits are redundant (set via attest-comms)", default: false }
      - { name: comms_backup_power, type: boolean, source: input, description: "Dispatch center has backup power (set via attest-comms)", default: false }
      - { name: comms_attested, type: boolean, source: system, description: "True once CommsSupervisor attests comms data for the current data window", default: false }
      - { name: comms_attested_by, type: string, source: system, description: "X-User-ID of attesting CommsSupervisor", default: null }
      - { name: comms_attested_at, type: datetime, source: system, description: "Logical-clock time of latest attestation", default: null }
      - { name: status, type: enum, source: system, description: "REGISTERED | UNDER_EVALUATION | CLASSIFIED | REEVALUATION_REQUESTED | UNDER_REEVALUATION", default: REGISTERED }
      - { name: current_class_number, type: integer, source: computed, description: "Base class of the EFFECTIVE classification (1..10), null until first activation", default: null }
      - { name: current_split_class, type: integer, source: computed, description: "Split class for areas beyond hydrant distance, null until first activation", default: null }
      - { name: current_premium_modifier, type: number, source: computed, description: "Premium modifier keyed to current_class_number", default: null }
      - { name: bound_exposure_cents, type: integer, source: computed, description: "Sum of coverage_amount_cents over this community's BOUND premium quotes (maintained on bind/void)", default: 0 }
      - { name: next_evaluation_due_date, type: string, source: computed, description: "effective_from of current EFFECTIVE classification + 60 calendar months (YYYY-MM-DD)", default: null }

  - name: EvaluationCycle
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; evaluated community" }
      - { name: cycle_number, type: integer, source: computed, description: "Per-community sequence starting at 1, assigned at creation" }
      - { name: field_analyst_id, type: string, source: input, description: "Opaque operator id of the assigned FieldAnalyst (window-conflict resource; SoD reference for publish)" }
      - { name: scheduled_open_date, type: string, source: input, description: "YYYY-MM-DD when intake may open" }
      - { name: data_freeze_date, type: string, source: input, description: "YYYY-MM-DD reference date for flow-test staleness; must be after scheduled_open_date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | INTAKE | DATA_COLLECTION | FIELD_VERIFICATION | SCORING | CLASSIFICATION_REVIEW | PUBLISHED | DISPUTED | EFFECTIVE | WITHDRAWN", default: SCHEDULED }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock time the cycle entered INTAKE", default: null }

  - name: FireDepartment
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; exactly one per community (auto-created shell)", constraints: "unique per community" }
      - { name: dept_type, type: enum, source: input, description: "CAREER | VOLUNTEER | COMBINATION; selects staffing variant" }
      - { name: stations_active_count, type: integer, source: input, description: "Number of active fire stations", default: 1, constraints: ">= 0" }
      - { name: career_on_duty_per_shift, type: integer, source: input, description: "Career firefighters on duty per shift", default: 0, constraints: ">= 0" }
      - { name: volunteers_on_duty_avg, type: number, source: input, description: "Average volunteer firefighters responding", default: 0, constraints: ">= 0" }
      - { name: training_hours_per_firefighter_annual, type: number, source: input, description: "Annual training hours per firefighter", default: 0, constraints: ">= 0" }
      - { name: training_facility_level, type: enum, source: input, description: "A | B | C training facility level", default: "C" }
      - { name: live_fire_training, type: boolean, source: input, description: "Live-fire training conducted", default: false }
      - { name: coverage_pct_within_5mi, type: number, source: input, description: "Percent of community area within 5 road miles of an active station", default: 0, constraints: "0..100 inclusive" }
      - { name: data_submitted, type: boolean, source: system, description: "Set true by any FireChief PATCH; gate for SCORING", default: false }

  - name: Apparatus
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> FireDepartment.id; owning department" }
      - { name: kind, type: enum, source: input, description: "ENGINE | LADDER | QUINT | TANKER | RESCUE" }
      - { name: pump_capacity_gpm, type: integer, source: input, description: "Pump capacity gpm; required when kind is ENGINE or QUINT", default: null, constraints: ">= 0" }
      - { name: tank_capacity_gal, type: integer, source: input, description: "Water tank gallons; required when kind is TANKER", default: null, constraints: ">= 0" }
      - { name: ladder_height_ft, type: integer, source: input, description: "Ladder height feet; required when kind is LADDER or QUINT", default: null, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "FRONTLINE | RESERVE | OUT_OF_SERVICE", default: FRONTLINE }

  - name: WaterSupplySystem
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; exactly one per community (auto-created shell)", constraints: "unique per community" }
      - { name: needed_fire_flow_gpm, type: integer, source: input, description: "Needed fire flow gpm for the community", constraints: "500..50000 inclusive" }
      - { name: storage_capacity_gal, type: integer, source: input, description: "Usable water storage gallons", constraints: ">= 0" }
      - { name: supply_works_capacity_gpm, type: integer, source: input, description: "Supply works sustainable capacity gpm", constraints: "> 0" }
      - { name: daily_consumption_gpm, type: integer, source: input, description: "Average daily consumption gpm", constraints: ">= 0" }
      - { name: alternate_shuttle_capacity_gpm, type: integer, source: input, description: "Certified tanker-shuttle delivery capacity gpm (rural alternate supply)", default: 0, constraints: ">= 0" }
      - { name: alternate_sites_count, type: integer, source: input, description: "Number of established alternate water supply sites (draft/fill sites)", default: 0, constraints: ">= 0" }
      - { name: alternate_verified, type: boolean, source: system, description: "Set true by FieldAnalyst verify-alternate-supply; selects RURAL_SHUTTLE variant when rural_area_pct > 50", default: false }
      - { name: active_certified_flow_gpm, type: number, source: computed, description: "Sum of max_flow_gpm over ACTIVE hydrants with a certified flow test", default: 0 }
      - { name: creditworthy_hydrant_count, type: integer, source: computed, description: "Count of ACTIVE hydrants whose max_flow_gpm >= 1000", default: 0 }

  - name: Hydrant
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> WaterSupplySystem.id; owning water system" }
      - { name: location_descriptor, type: string, source: input, description: "Free-text hydrant location" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE", default: ACTIVE }
      - { name: max_flow_gpm, type: integer, source: computed, description: "flow_at_20psi_gpm of the hydrant's latest CERTIFIED non-SUPERSEDED flow test; null when none", default: null }
      - { name: last_certified_test_date, type: string, source: computed, description: "test_date of the hydrant's latest CERTIFIED non-SUPERSEDED flow test; null when none", default: null }

  - name: FlowTest
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> WaterSupplySystem.id; tested system" }
      - { name: hydrant_id, type: string, source: input, description: "FK -> Hydrant.id; test hydrant" }
      - { name: supersedes_test_id, type: string, source: system, description: "FK -> FlowTest.id; set on the replacement row produced by a correction", default: null }
      - { name: test_date, type: string, source: input, description: "YYYY-MM-DD date the flow test was performed; must not be after the logical clock date" }
      - { name: static_psi, type: number, source: input, description: "Static pressure psi", constraints: "> 20 and <= 300" }
      - { name: residual_psi, type: number, source: input, description: "Residual pressure psi under flow", constraints: ">= 10 and < static_psi" }
      - { name: measured_flow_gpm, type: number, source: input, description: "Measured flow gpm at residual pressure", constraints: "> 0" }
      - { name: flow_at_20psi_gpm, type: integer, source: computed, description: "Normalized flow at 20 psi residual, computed at certification", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | WITNESSED | CERTIFIED | REJECTED | SUPERSEDED", default: SUBMITTED }
      - { name: witnessed_by, type: string, source: system, description: "X-User-ID of witnessing FieldAnalyst", default: null }
      - { name: certified_by, type: string, source: system, description: "X-User-ID of certifying FieldAnalyst", default: null }
      - { name: correction_reason, type: string, source: system, description: "Reason recorded on a correction replacement row", default: null }

  - name: RiskReductionCredit
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> EvaluationCycle.id; cycle the credit applies to" }
      - { name: program_type, type: enum, source: input, description: "PREVENTION_INSPECTION | CODE_ENFORCEMENT | PUBLIC_EDUCATION | FIRE_INVESTIGATION" }
      - { name: activity_points, type: number, source: input, description: "Claimed activity points", constraints: "> 0" }
      - { name: evidence_note, type: string, source: input, description: "Documentation reference for the claimed activity" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED", default: PENDING }
      - { name: credited_points, type: number, source: computed, description: "min(activity_points, 2.0) once VERIFIED; 0 while PENDING or after REJECTED", default: 0 }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifying FieldAnalyst", default: null }

  - name: ScoreSheet
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> EvaluationCycle.id; cycle scored (path-bound)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINAL | SUPERSEDED", default: DRAFT }
      - { name: equipment_points, type: number, source: computed, description: "Apparatus equipment subscore, max 20" }
      - { name: staffing_points, type: number, source: computed, description: "Staffing subscore, max 15" }
      - { name: staffing_variant_used, type: enum, source: computed, description: "CAREER_EQUIVALENT | RAW_HEADCOUNT variant applied" }
      - { name: training_points, type: number, source: computed, description: "Training subscore, max 9" }
      - { name: response_points, type: number, source: computed, description: "Response/distribution subscore, max 6" }
      - { name: fd_total_points, type: number, source: computed, description: "Fire department total, max 50" }
      - { name: supply_points, type: number, source: computed, description: "Water supply-works subscore, max 10" }
      - { name: flow_points, type: number, source: computed, description: "Water flow-capacity subscore, max 18" }
      - { name: distribution_points, type: number, source: computed, description: "Hydrant distribution subscore, max 7" }
      - { name: storage_points, type: number, source: computed, description: "Storage subscore, max 5" }
      - { name: water_total_points, type: number, source: computed, description: "Water supply total, max 40" }
      - { name: water_variant_used, type: enum, source: computed, description: "MUNICIPAL | RURAL_SHUTTLE variant applied" }
      - { name: comms_points, type: number, source: computed, description: "Emergency communications total, max 10" }
      - { name: crr_raw_points, type: number, source: computed, description: "Sum of credited_points over VERIFIED RiskReductionCredits of the cycle" }
      - { name: crr_effective_points, type: number, source: computed, description: "min(crr_raw_points, 5.5, 10% of subtotal) with pinned evaluation order" }
      - { name: subtotal_points, type: number, source: computed, description: "fd_total_points + water_total_points + comms_points (excludes CRR)" }
      - { name: divergence_penalty_points, type: number, source: computed, description: "2 * (0.5*fd_total_points - water_total_points) when water lags, else 0" }
      - { name: adjusted_total_points, type: number, source: computed, description: "subtotal_points + crr_effective_points - divergence_penalty_points" }
      - { name: base_class, type: integer, source: computed, description: "Class 1..10 from adjusted_total_points thresholds" }
      - { name: split_class_beyond_hydrant, type: integer, source: computed, description: "Class applied beyond 1000 ft of a hydrant, from adjusted total minus hydrant component plus alternate component" }

  - name: Classification
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; classified community (via cycle)" }
      - { name: cycle_id, type: string, source: system, description: "FK -> EvaluationCycle.id; producing cycle (path-bound)" }
      - { name: score_sheet_id, type: string, source: input, description: "FK -> ScoreSheet.id; FINAL sheet the classification is derived from" }
      - { name: base_class, type: integer, source: computed, description: "Class within 1000 ft of a hydrant (and within 5 road miles of a station)" }
      - { name: split_class_beyond_hydrant, type: integer, source: computed, description: "Class beyond 1000 ft of a hydrant" }
      - { name: premium_modifier, type: number, source: computed, description: "Modifier table lookup keyed on base_class" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | EFFECTIVE | SUPERSEDED | VACATED", default: PUBLISHED }
      - { name: published_by, type: string, source: system, description: "X-User-ID of publishing ClassRegistrar (SoD reference for appeal adjudication)" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock time of publication" }
      - { name: effective_from, type: string, source: system, description: "YYYY-MM-DD set at activation", default: null }
      - { name: effective_until, type: string, source: system, description: "YYYY-MM-DD set when superseded by a newer activation", default: null }

  - name: PropertyRiskProfile
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; community containing the property" }
      - { name: address, type: string, source: input, description: "Property street address" }
      - { name: distance_to_nearest_hydrant_ft, type: integer, source: input, description: "Feet to nearest ACTIVE hydrant", constraints: ">= 0" }
      - { name: distance_to_nearest_station_road_miles, type: number, source: input, description: "Road miles to nearest active station", constraints: ">= 0" }
      - { name: construction_type, type: enum, source: input, description: "FRAME | MASONRY | NON_COMBUSTIBLE | FIRE_RESISTIVE" }
      - { name: insured_value_cents, type: integer, source: input, description: "Declared insured value", constraints: "> 0" }
      - { name: applicable_class, type: integer, source: computed, description: "Split-aware class for this property from the EFFECTIVE classification; null until one exists", default: null }
      - { name: applicable_premium_modifier, type: number, source: computed, description: "Modifier keyed to applicable_class; null until a classification is EFFECTIVE", default: null }

  - name: PremiumQuote
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> PropertyRiskProfile.id; rated property" }
      - { name: classification_id, type: string, source: system, description: "FK -> Classification.id; EFFECTIVE classification pinned at quote creation" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Requested coverage", constraints: "> 0 and <= 150% of insured_value_cents" }
      - { name: base_rate_bp, type: integer, source: input, description: "Base annual rate in basis points of coverage", constraints: "> 0" }
      - { name: term_months, type: integer, source: input, description: "Coverage term in months", constraints: "1..120 inclusive" }
      - { name: coverage_start_date, type: string, source: input, description: "YYYY-MM-DD coverage start; must be >= logical clock date" }
      - { name: coverage_end_date, type: string, source: input, description: "YYYY-MM-DD coverage end (closed interval); must be >= coverage_start_date" }
      - { name: provisional_premium_cents, type: integer, source: computed, description: "Provisional variant: round half-up of (annual_exact * term_months / 12) computed in one shot" }
      - { name: final_premium_cents, type: integer, source: computed, description: "Final variant at bind: round-half-up per month, then multiply by term_months", default: null }
      - { name: status, type: enum, source: system, description: "QUOTED | BOUND | VOIDED | EXPIRED", default: QUOTED }
      - { name: bound_by, type: string, source: system, description: "X-User-ID of binding Insurer", default: null }
      - { name: bound_at, type: datetime, source: system, description: "Logical-clock bind time", default: null }

  - name: ReevaluationRequest
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; requesting community" }
      - { name: justification, type: string, source: input, description: "Narrative of completed improvements" }
      - { name: evidence_items, type: array, source: input, description: "Documentation items [{doc_type, uri}]; at least 1 required", constraints: "min 1 item" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | DOCUMENTATION_REVIEW | FIELD_REVERIFICATION | APPROVED | DENIED | WITHDRAWN", default: SUBMITTED }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of filing CommunityOfficial" }
      - { name: decision_note, type: string, source: system, description: "Note recorded on APPROVED or DENIED", default: null }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: classification_id, type: string, source: input, description: "FK -> Classification.id; appealed classification" }
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; appealing community (must match classification's community)" }
      - { name: grounds, type: enum, source: input, description: "DATA_ERROR | PROCEDURAL_ERROR | NEW_EVIDENCE" }
      - { name: evidence_items, type: array, source: input, description: "Documentation items [{doc_type, uri}]; at least 1 required", constraints: "min 1 item" }
      - { name: status, type: enum, source: system, description: "FILED | DATA_VERIFICATION | ADJUDICATED_UPHELD | ADJUDICATED_REVISED | WITHDRAWN", default: FILED }
      - { name: filed_by, type: string, source: system, description: "X-User-ID of filing CommunityOfficial" }
      - { name: adjudicated_by, type: string, source: system, description: "X-User-ID of adjudicating ClassRegistrar", default: null }
      - { name: new_score_sheet_id, type: string, source: system, description: "FK -> ScoreSheet.id; replacement FINAL sheet recorded on ADJUDICATED_REVISED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Community
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: UNDER_EVALUATION
        trigger: "POST /ppc/evaluation-cycles (cycle creation)"
        actor: EvaluationCoordinator
        preconditions: ["community.status == REGISTERED (else ERR_COMMUNITY_INVALID_STATE)"]
        side_effects: ["community.version increments"]
      - from: CLASSIFIED
        to: UNDER_EVALUATION
        trigger: "POST /ppc/evaluation-cycles (scheduled re-grading cycle)"
        actor: EvaluationCoordinator
        preconditions: ["community.status == CLASSIFIED"]
        side_effects: ["community.version increments"]
      - from: UNDER_EVALUATION
        to: CLASSIFIED
        trigger: "POST /ppc/classifications/{classificationId}/activate (cascade)"
        actor: ClassRegistrar
        preconditions: ["activated classification belongs to the community's active cycle"]
        side_effects: ["current_class_number/current_split_class/current_premium_modifier/next_evaluation_due_date recomputed", "version increments"]
      - from: UNDER_REEVALUATION
        to: CLASSIFIED
        trigger: "POST /ppc/classifications/{classificationId}/activate (cascade)"
        actor: ClassRegistrar
        preconditions: ["activated classification belongs to the community's active reevaluation cycle"]
        side_effects: ["denormalized class fields recomputed", "version increments"]
      - from: CLASSIFIED
        to: REEVALUATION_REQUESTED
        trigger: "POST /ppc/reevaluation-requests (request accepted)"
        actor: CommunityOfficial
        preconditions: ["community.status == CLASSIFIED (else ERR_COMMUNITY_INVALID_STATE)"]
        side_effects: ["community.version increments"]
      - from: REEVALUATION_REQUESTED
        to: UNDER_REEVALUATION
        trigger: "POST /ppc/reevaluation-requests/{requestId}/approve (cascade)"
        actor: ClassRegistrar
        preconditions: ["request reaches APPROVED"]
        side_effects: ["new EvaluationCycle created in SCHEDULED", "community.version increments"]
      - from: REEVALUATION_REQUESTED
        to: CLASSIFIED
        trigger: "request DENIED or WITHDRAWN (cascade)"
        actor: ClassRegistrar
        preconditions: ["request reaches DENIED or WITHDRAWN"]
        side_effects: ["community.version increments"]
      - from: UNDER_EVALUATION
        to: REGISTERED
        trigger: "cycle WITHDRAWN (cascade) when community has no EFFECTIVE classification"
        actor: EvaluationCoordinator
        preconditions: ["withdrawn cycle was the community's active cycle", "current_class_number is null"]
        side_effects: ["community.version increments"]
      - from: UNDER_EVALUATION
        to: CLASSIFIED
        trigger: "cycle WITHDRAWN (cascade) when an EFFECTIVE classification exists"
        actor: EvaluationCoordinator
        preconditions: ["withdrawn cycle was the community's active cycle", "current_class_number is not null"]
        side_effects: ["community.version increments"]
      - from: UNDER_REEVALUATION
        to: CLASSIFIED
        trigger: "cycle WITHDRAWN (cascade); the prior EFFECTIVE classification remains in force"
        actor: EvaluationCoordinator
        preconditions: ["withdrawn cycle was the community's active cycle"]
        side_effects: ["community.version increments"]

  - entity: EvaluationCycle
    initial_state: SCHEDULED
    terminal_states: [EFFECTIVE, WITHDRAWN]
    transitions:
      - from: SCHEDULED
        to: INTAKE
        trigger: "POST /ppc/evaluation-cycles/{cycleId}/transition {target_state: INTAKE}"
        actor: EvaluationCoordinator
        preconditions: ["logical clock date >= scheduled_open_date (else ERR_CYCLE_NOT_OPEN_YET)"]
        side_effects: ["opened_at = clock"]
      - from: INTAKE
        to: DATA_COLLECTION
        trigger: "POST /ppc/evaluation-cycles/{cycleId}/transition {target_state: DATA_COLLECTION}"
        actor: EvaluationCoordinator
        preconditions: []
        side_effects: []
      - from: DATA_COLLECTION
        to: FIELD_VERIFICATION
        trigger: "POST /ppc/evaluation-cycles/{cycleId}/transition {target_state: FIELD_VERIFICATION}"
        actor: EvaluationCoordinator
        preconditions: []
        side_effects: []
      - from: FIELD_VERIFICATION
        to: SCORING
        trigger: "POST /ppc/evaluation-cycles/{cycleId}/transition {target_state: SCORING}"
        actor: EvaluationCoordinator
        preconditions:
          - "no FlowTest of the community's WaterSupplySystem in {SUBMITTED, WITNESSED} (else ERR_CYCLE_DATA_INCOMPLETE)"
          - "community.comms_attested == true (else ERR_CYCLE_DATA_INCOMPLETE)"
          - "FireDepartment.data_submitted == true (else ERR_CYCLE_DATA_INCOMPLETE)"
        side_effects: []
      - from: SCORING
        to: CLASSIFICATION_REVIEW
        trigger: "POST /ppc/evaluation-cycles/{cycleId}/transition {target_state: CLASSIFICATION_REVIEW}"
        actor: EvaluationCoordinator
        preconditions: ["a FINAL ScoreSheet exists for the cycle (else ERR_NO_FINAL_SCORE_SHEET)"]
        side_effects: []
      - from: CLASSIFICATION_REVIEW
        to: PUBLISHED
        trigger: "POST /ppc/evaluation-cycles/{cycleId}/publish-classification"
        actor: ClassRegistrar
        preconditions: ["score_sheet FINAL and belongs to cycle", "registrar X-User-ID != field_analyst_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["Classification created in PUBLISHED"]
      - from: PUBLISHED
        to: EFFECTIVE
        trigger: "POST /ppc/classifications/{classificationId}/activate"
        actor: ClassRegistrar
        preconditions: ["no non-terminal Appeal on the classification (else ERR_APPEAL_PENDING)"]
        side_effects: ["activation cascade (see Classification.activate)"]
      - from: PUBLISHED
        to: DISPUTED
        trigger: "POST /ppc/appeals (appeal filed against the cycle's PUBLISHED classification)"
        actor: CommunityOfficial
        preconditions: ["appeal passes its own validations"]
        side_effects: ["cycle.version increments"]
      - from: DISPUTED
        to: FIELD_VERIFICATION
        trigger: "POST /ppc/evaluation-cycles/{cycleId}/transition {target_state: FIELD_VERIFICATION}"
        actor: EvaluationCoordinator
        preconditions: ["an Appeal on the cycle's classification is in DATA_VERIFICATION (else ERR_NO_APPEAL_IN_VERIFICATION)"]
        side_effects: []
      - from: DISPUTED
        to: PUBLISHED
        trigger: "appeal ADJUDICATED_UPHELD or WITHDRAWN (cascade)"
        actor: ClassRegistrar
        preconditions: ["appeal adjudicated UPHELD or withdrawn"]
        side_effects: []
      - from: EFFECTIVE
        to: EFFECTIVE
        trigger: "none (terminal)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /ppc/evaluation-cycles/{cycleId}/transition {target_state: WITHDRAWN}"
        actor: EvaluationCoordinator
        preconditions: ["current state is any non-terminal state except EFFECTIVE"]
        side_effects: ["community status reverts (CLASSIFIED if current_class_number non-null else REGISTERED)"]
        note: "WITHDRAWN is reachable from SCHEDULED, INTAKE, DATA_COLLECTION, FIELD_VERIFICATION, SCORING, CLASSIFICATION_REVIEW, PUBLISHED, DISPUTED via the same transition endpoint"

  - entity: ScoreSheet
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /ppc/score-sheets/{sheetId}/finalize"
        actor: FieldAnalyst
        preconditions: ["sheet.status == DRAFT (else ERR_SHEET_INVALID_STATE)", "sheet's cycle in {SCORING, CLASSIFICATION_REVIEW}"]
        side_effects: ["every other non-SUPERSEDED ScoreSheet of the same cycle -> SUPERSEDED"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /ppc/evaluation-cycles/{cycleId}/score-sheets (a newer sheet is created)"
        actor: FieldAnalyst
        preconditions: ["new sheet creation succeeds"]
        side_effects: ["older DRAFT sheet becomes SUPERSEDED"]
      - from: FINAL
        to: SUPERSEDED
        trigger: "another sheet of the same cycle reaches FINAL, or appeal ADJUDICATED_REVISED (cascade)"
        actor: FieldAnalyst
        preconditions: []
        side_effects: []

  - entity: Classification
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED, VACATED]
    transitions:
      - from: PUBLISHED
        to: EFFECTIVE
        trigger: "POST /ppc/classifications/{classificationId}/activate"
        actor: ClassRegistrar
        preconditions: ["status == PUBLISHED (else ERR_CLASSIFICATION_INVALID_STATE)", "no non-terminal Appeal on this classification (else ERR_APPEAL_PENDING)", "effective_from >= logical clock date (else ERR_INVALID_REQUEST)"]
        side_effects:
          - "prior EFFECTIVE Classification of the same community -> SUPERSEDED with effective_until = new effective_from"
          - "community: status -> CLASSIFIED, current_class_number = base_class, current_split_class = split_class_beyond_hydrant, current_premium_modifier = premium_modifier, next_evaluation_due_date = effective_from + 60 months, version increments"
          - "every PropertyRiskProfile of the community: applicable_class/applicable_premium_modifier recomputed (split logic)"
          - "every QUOTED PremiumQuote on those properties -> EXPIRED (pinned classification superseded); BOUND quotes unchanged"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "a newer Classification of the same community is activated (cascade)"
        actor: ClassRegistrar
        preconditions: []
        side_effects: ["effective_until set"]
      - from: PUBLISHED
        to: VACATED
        trigger: "appeal ADJUDICATED_REVISED (cascade)"
        actor: ClassRegistrar
        preconditions: []
        side_effects: ["replacement Classification created in PUBLISHED from the appeal's new_score_sheet_id"]
      - from: EFFECTIVE
        to: VACATED
        trigger: "appeal ADJUDICATED_REVISED against the EFFECTIVE classification (cascade)"
        actor: ClassRegistrar
        preconditions: []
        side_effects: ["replacement Classification created in PUBLISHED; community denormalized fields unchanged until the replacement is activated"]

  - entity: FlowTest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: WITNESSED
        trigger: "POST /ppc/flow-tests/{testId}/transition {target_state: WITNESSED}"
        actor: FieldAnalyst
        preconditions: ["active cycle of the community in FIELD_VERIFICATION (else ERR_DATA_WINDOW_CLOSED)"]
        side_effects: ["witnessed_by = analyst X-User-ID"]
      - from: WITNESSED
        to: CERTIFIED
        trigger: "POST /ppc/flow-tests/{testId}/transition {target_state: CERTIFIED}"
        actor: FieldAnalyst
        preconditions: ["active cycle in FIELD_VERIFICATION (else ERR_DATA_WINDOW_CLOSED)"]
        side_effects:
          - "flow_at_20psi_gpm computed (calculation flow_normalization)"
          - "hydrant.max_flow_gpm and last_certified_test_date updated"
          - "system active_certified_flow_gpm and creditworthy_hydrant_count recomputed"
          - "certified_by = analyst X-User-ID"
      - from: WITNESSED
        to: REJECTED
        trigger: "POST /ppc/flow-tests/{testId}/transition {target_state: REJECTED}"
        actor: FieldAnalyst
        preconditions: ["active cycle in FIELD_VERIFICATION"]
        side_effects: []
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /ppc/flow-tests/{testId}/transition {target_state: CORRECTED} (correction)"
        actor: FieldAnalyst
        preconditions: ["active cycle in {FIELD_VERIFICATION, SCORING} (else ERR_DATA_WINDOW_CLOSED)", "corrected_measured_flow_gpm and correction_reason supplied (else ERR_INVALID_REQUEST)"]
        side_effects:
          - "replacement FlowTest row created directly in CERTIFIED with corrected values and supersedes_test_id = this test"
          - "cascade: hydrant.max_flow_gpm recomputed from the replacement (link 1)"
          - "cascade: system active_certified_flow_gpm and creditworthy_hydrant_count recomputed from hydrants (link 2)"
          - "cascade: if a DRAFT ScoreSheet exists for the cycle, water subscores/totals recomputed (link 3)"

  - entity: Apparatus
    initial_state: FRONTLINE
    terminal_states: []
    transitions:
      - from: FRONTLINE
        to: RESERVE
        trigger: "PATCH /ppc/apparatus/{apparatusId} {status: RESERVE}"
        actor: FireChief
        preconditions: ["data window open (active cycle in {DATA_COLLECTION, FIELD_VERIFICATION, SCORING}) else ERR_DATA_WINDOW_CLOSED"]
        side_effects: ["DRAFT sheet recompute when cycle in SCORING"]
      - from: FRONTLINE
        to: OUT_OF_SERVICE
        trigger: "PATCH /ppc/apparatus/{apparatusId} {status: OUT_OF_SERVICE}"
        actor: FireChief
        preconditions: ["data window open"]
        side_effects: ["DRAFT sheet recompute when cycle in SCORING"]
      - from: RESERVE
        to: FRONTLINE
        trigger: "PATCH /ppc/apparatus/{apparatusId} {status: FRONTLINE}"
        actor: FireChief
        preconditions: ["data window open"]
        side_effects: ["DRAFT sheet recompute when cycle in SCORING"]
      - from: RESERVE
        to: OUT_OF_SERVICE
        trigger: "PATCH /ppc/apparatus/{apparatusId} {status: OUT_OF_SERVICE}"
        actor: FireChief
        preconditions: ["data window open"]
        side_effects: []
      - from: OUT_OF_SERVICE
        to: RESERVE
        trigger: "PATCH /ppc/apparatus/{apparatusId} {status: RESERVE}"
        actor: FireChief
        preconditions: ["data window open"]
        side_effects: []
        note: "OUT_OF_SERVICE -> FRONTLINE is deliberately NOT allowed (must pass through RESERVE inspection state); violation returns ERR_APPARATUS_INVALID_STATE"

  - entity: Hydrant
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "PATCH /ppc/hydrants/{hydrantId} {status: OUT_OF_SERVICE}"
        actor: WaterUtilityManager
        preconditions: ["data window open (else ERR_DATA_WINDOW_CLOSED)"]
        side_effects: ["system active_certified_flow_gpm and creditworthy_hydrant_count recomputed", "DRAFT sheet recompute when cycle in SCORING"]
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "PATCH /ppc/hydrants/{hydrantId} {status: ACTIVE}"
        actor: WaterUtilityManager
        preconditions: ["data window open"]
        side_effects: ["system aggregates recomputed", "DRAFT sheet recompute when cycle in SCORING"]

  - entity: RiskReductionCredit
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /ppc/risk-reduction-credits/{creditId}/transition {target_state: VERIFIED}"
        actor: FieldAnalyst
        preconditions: ["active cycle in {FIELD_VERIFICATION, SCORING} (else ERR_DATA_WINDOW_CLOSED)"]
        side_effects: ["credited_points = min(activity_points, 2.0)", "verified_by set", "DRAFT sheet recompute when cycle in SCORING"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /ppc/risk-reduction-credits/{creditId}/transition {target_state: REJECTED}"
        actor: FieldAnalyst
        preconditions: ["active cycle in {FIELD_VERIFICATION, SCORING}"]
        side_effects: ["credited_points = 0"]
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /ppc/risk-reduction-credits/{creditId}/transition {target_state: REJECTED} (revoke)"
        actor: FieldAnalyst
        preconditions: ["active cycle in {FIELD_VERIFICATION, SCORING}"]
        side_effects: ["credited_points = 0", "DRAFT sheet recompute when cycle in SCORING"]

  - entity: PremiumQuote
    initial_state: QUOTED
    terminal_states: [VOIDED, EXPIRED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /ppc/premium-quotes/{quoteId}/bind"
        actor: Insurer
        preconditions:
          - "status == QUOTED (else ERR_QUOTE_INVALID_STATE)"
          - "expected_community_version matches community.version (else ERR_STALE_VERSION)"
          - "no closed-interval coverage overlap with another BOUND quote on the same property (else ERR_QUOTE_COVERAGE_OVERLAP)"
          - "community.bound_exposure_cents + coverage_amount_cents <= EXPOSURE_CAP_CENTS (else ERR_EXPOSURE_CAP_EXCEEDED)"
        side_effects: ["final_premium_cents computed (monthly rounding variant)", "community.bound_exposure_cents += coverage_amount_cents", "community.version increments", "bound_by/bound_at set"]
      - from: BOUND
        to: VOIDED
        trigger: "POST /ppc/premium-quotes/{quoteId}/void"
        actor: Insurer
        preconditions: ["status == BOUND (else ERR_QUOTE_INVALID_STATE)"]
        side_effects: ["community.bound_exposure_cents -= coverage_amount_cents (compensating action)", "community.version increments"]
      - from: QUOTED
        to: EXPIRED
        trigger: "classification activation cascade (pinned classification superseded)"
        actor: system
        preconditions: ["quote.status == QUOTED at activation time"]
        side_effects: []

  - entity: ReevaluationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: DOCUMENTATION_REVIEW
        trigger: "POST /ppc/reevaluation-requests/{requestId}/transition {target_state: DOCUMENTATION_REVIEW}"
        actor: EvaluationCoordinator
        preconditions: []
        side_effects: []
      - from: DOCUMENTATION_REVIEW
        to: SUBMITTED
        trigger: "POST /ppc/reevaluation-requests/{requestId}/transition {target_state: SUBMITTED} (returned for more documentation)"
        actor: EvaluationCoordinator
        preconditions: []
        side_effects: []
        note: "revision loop — CommunityOfficial then PATCHes evidence_items"
      - from: DOCUMENTATION_REVIEW
        to: FIELD_REVERIFICATION
        trigger: "POST /ppc/reevaluation-requests/{requestId}/transition {target_state: FIELD_REVERIFICATION}"
        actor: FieldAnalyst
        preconditions: []
        side_effects: []
      - from: FIELD_REVERIFICATION
        to: APPROVED
        trigger: "POST /ppc/reevaluation-requests/{requestId}/approve"
        actor: ClassRegistrar
        preconditions: ["expected_community_version matches (else ERR_STALE_VERSION)"]
        side_effects: ["new EvaluationCycle created (cycle_number next, open = clock date, freeze = clock date + 90 days, field_analyst_id from input)", "community -> UNDER_REEVALUATION, version increments", "decision_note set"]
      - from: FIELD_REVERIFICATION
        to: DENIED
        trigger: "POST /ppc/reevaluation-requests/{requestId}/transition {target_state: DENIED}"
        actor: ClassRegistrar
        preconditions: []
        side_effects: ["community -> CLASSIFIED", "decision_note set"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /ppc/reevaluation-requests/{requestId}/transition {target_state: WITHDRAWN}"
        actor: CommunityOfficial
        preconditions: ["X-User-ID == request.community_id (ownership)"]
        side_effects: ["community -> CLASSIFIED"]
      - from: DOCUMENTATION_REVIEW
        to: WITHDRAWN
        trigger: "POST /ppc/reevaluation-requests/{requestId}/transition {target_state: WITHDRAWN}"
        actor: CommunityOfficial
        preconditions: ["ownership"]
        side_effects: ["community -> CLASSIFIED"]

  - entity: Appeal
    initial_state: FILED
    terminal_states: [ADJUDICATED_UPHELD, ADJUDICATED_REVISED, WITHDRAWN]
    transitions:
      - from: FILED
        to: DATA_VERIFICATION
        trigger: "POST /ppc/appeals/{appealId}/transition {target_state: DATA_VERIFICATION}"
        actor: FieldAnalyst
        preconditions: []
        side_effects: []
      - from: DATA_VERIFICATION
        to: FILED
        trigger: "POST /ppc/appeals/{appealId}/transition {target_state: FILED} (returned for more evidence)"
        actor: FieldAnalyst
        preconditions: []
        side_effects: []
      - from: DATA_VERIFICATION
        to: ADJUDICATED_UPHELD
        trigger: "POST /ppc/appeals/{appealId}/transition {target_state: ADJUDICATED_UPHELD}"
        actor: ClassRegistrar
        preconditions: ["adjudicating registrar X-User-ID != classification.published_by (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["adjudicated_by set", "if the classification's cycle is DISPUTED it returns to PUBLISHED"]
      - from: DATA_VERIFICATION
        to: ADJUDICATED_REVISED
        trigger: "POST /ppc/appeals/{appealId}/transition {target_state: ADJUDICATED_REVISED, new_score_sheet_id: <id>}"
        actor: ClassRegistrar
        preconditions:
          - "adjudicating registrar X-User-ID != classification.published_by (else ERR_SEGREGATION_OF_DUTIES)"
          - "new_score_sheet_id supplied, is FINAL, belongs to the classification's cycle, and != classification.score_sheet_id (else ERR_INVALID_REQUEST)"
          - "classification's cycle is in CLASSIFICATION_REVIEW (else ERR_CYCLE_INVALID_STATE)"
        side_effects:
          - "appealed classification -> VACATED"
          - "new Classification created in PUBLISHED from new_score_sheet_id (published_by = adjudicating registrar, published_at = clock)"
          - "classification's cycle -> PUBLISHED"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /ppc/appeals/{appealId}/transition {target_state: WITHDRAWN}"
        actor: CommunityOfficial
        preconditions: ["ownership"]
        side_effects: ["if the classification's cycle is DISPUTED it returns to PUBLISHED"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: score-sheet-create-stale-cycle
    parent_entity: EvaluationCycle
    write_endpoint: "POST /ppc/evaluation-cycles/{cycleId}/score-sheets"
    occ_field: expected_cycle_version
    description: |
      Creating a ScoreSheet against an EvaluationCycle whose version has advanced
      since the client last observed it is rejected. Creating a sheet legitimately
      supersedes any existing DRAFT sheet of the cycle, so a writer holding a
      stale cycle version would otherwise supersede a sheet it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: quote-bind-stale-community
    parent_entity: Community
    write_endpoint: "POST /ppc/premium-quotes/{quoteId}/bind"
    occ_field: expected_community_version
    description: |
      Binding a PremiumQuote against a Community whose version has advanced since
      the client last observed it is rejected. A bind debits the community
      exposure ledger, and any intervening bind/void/classification activation
      legitimately changes that ledger and the rating context.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: flow_normalization
    trigger: "FlowTest reaches CERTIFIED (including correction replacement rows)"
    algorithm: decay_function
    formula: |
      flow_at_20psi_gpm = round_half_up_to_integer(
        measured_flow_gpm * ((static_psi - 20) / (static_psi - residual_psi)) ^ 0.54 )
    input_set: "the single FlowTest being certified"
    constants:
      REFERENCE_RESIDUAL_PSI: 20
      PRESSURE_EXPONENT: 0.54
    precision: "integer gpm, round_half_up"

  - name: equipment_credit
    trigger: "ScoreSheet creation and DRAFT recompute"
    algorithm: weighted_scoring
    formula: |
      pump_sum = sum(pump_capacity_gpm over Apparatus of the community's department
                     with status == FRONTLINE and kind == ENGINE)
      pump_pts = 8 * min(1, pump_sum / NEEDED_PUMP_GPM)
      ladder_pts = 6 if exists Apparatus with status == FRONTLINE and kind in {LADDER, QUINT}
                   and ladder_height_ft >= LADDER_MIN_FT else 0
      reserve_pts = 3 if exists Apparatus with status == RESERVE and kind == ENGINE else 0
      tanker_pts = 3 if exists Apparatus with status == FRONTLINE and kind == TANKER
                   and tank_capacity_gal >= TANKER_MIN_GAL else 0
      equipment_points = pump_pts + ladder_pts + reserve_pts + tanker_pts   # max 20 by construction
    input_set: "Apparatus rows of the community's FireDepartment, filtered by status as noted"
    constants:
      NEEDED_PUMP_GPM: 1750
      LADDER_MIN_FT: 75
      TANKER_MIN_GAL: 1000
      EQUIPMENT_MAX: 20
    precision: "2 decimal places, round_half_up"

  - name: staffing_credit
    trigger: "ScoreSheet creation and DRAFT recompute"
    algorithm: weighted_scoring
    formula: |
      ratio = min(1, (career_on_duty_per_shift + FACTOR * volunteers_on_duty_avg) / NEEDED_ON_SHIFT)
      staffing_points = 15 * ratio
    input_set: "the community's FireDepartment"
    constants:
      NEEDED_ON_SHIFT: 6
      STAFFING_MAX: 15
      VOLUNTEER_FACTOR: 0.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: CAREER_EQUIVALENT
        when: "dept_type is VOLUNTEER or COMBINATION (official scoring variant)"
        difference: "FACTOR = VOLUNTEER_FACTOR (0.5) discounts volunteer headcount"
      - name: RAW_HEADCOUNT
        when: "dept_type is CAREER"
        difference: "FACTOR = 1.0; every head counts fully — for the same roster this yields >= the CAREER_EQUIVALENT result"

  - name: training_credit
    trigger: "ScoreSheet creation and DRAFT recompute"
    algorithm: weighted_scoring
    formula: |
      hours_pts = 6 * min(1, training_hours_per_firefighter_annual / TRAINING_HOURS_BENCHMARK)
      facility_pts = 3 if training_facility_level == A else (2 if B else 1)
      training_points = hours_pts + facility_pts
      if live_fire_training == false: training_points = min(training_points, LIVE_FIRE_CAP)
    input_set: "the community's FireDepartment"
    constants:
      TRAINING_HOURS_BENCHMARK: 240
      LIVE_FIRE_CAP: 6
      TRAINING_MAX: 9
    precision: "2 decimal places, round_half_up"

  - name: response_credit
    trigger: "ScoreSheet creation and DRAFT recompute"
    algorithm: weighted_scoring
    formula: |
      response_points = 6 * coverage_pct_within_5mi / 100
    input_set: "the community's FireDepartment.coverage_pct_within_5mi"
    constants:
      RESPONSE_MAX: 6
    precision: "2 decimal places, round_half_up"

  - name: water_supply_points
    trigger: "ScoreSheet creation and DRAFT recompute"
    algorithm: weighted_scoring
    formula: |
      NFF = needed_fire_flow_gpm of the community's WaterSupplySystem
      supply_points = 10 * min(1, supply_works_capacity_gpm / NFF)
      storage_points = 5 * min(1, storage_capacity_gal / (NFF * STORAGE_DURATION_MIN))
      fresh(t) := t.last_certified_test_date >= add_calendar_months(cycle.data_freeze_date, -STALE_MONTHS)
      eff_flow(h) := h.max_flow_gpm * (1.0 if fresh(h) else STALE_FACTOR)   # per ACTIVE hydrant with a certified test
      # --- variant MUNICIPAL ---
      flow_points = 18 * min(1, sum(eff_flow) / (FLOW_TARGET_MULT * NFF))
      needed_hydrants = ceil(NFF / 1000)
      creditworthy = count(ACTIVE hydrants with eff_flow >= HYDRANT_CREDIT_MIN_GPM)
      distribution_points = 7 * min(1, creditworthy / needed_hydrants)
      # --- variant RURAL_SHUTTLE (replaces flow_points + distribution_points) ---
      flow_points = 18 * min(1, alternate_shuttle_capacity_gpm / NFF)
      distribution_points = 7 * min(1, alternate_sites_count / ALT_SITE_TARGET)
      water_total_points = supply_points + flow_points + distribution_points + storage_points  # max 40
    input_set: "the community's WaterSupplySystem, its ACTIVE hydrants and their latest CERTIFIED non-SUPERSEDED FlowTests; staleness judged against the cycle's data_freeze_date"
    constants:
      FLOW_TARGET_MULT: 1.5
      HYDRANT_CREDIT_MIN_GPM: 1000
      STORAGE_DURATION_MIN: 120
      STALE_FACTOR: 0.5
      STALE_MONTHS: 60
      ALT_SITE_TARGET: 2
      WATER_MAX: 40
    precision: "2 decimal places, round_half_up; per-hydrant staleness halving applied before summation"
    variants:
      - name: MUNICIPAL
        when: "community.rural_area_pct <= 50 OR WaterSupplySystem.alternate_verified == false"
        difference: "flow and distribution credit derive from hydrants and certified flow tests"
      - name: RURAL_SHUTTLE
        when: "community.rural_area_pct > 50 AND WaterSupplySystem.alternate_verified == true"
        difference: "flow credit derives from alternate_shuttle_capacity_gpm and distribution from alternate_sites_count; hydrant data is ignored — for identical inputs the totals differ"

  - name: comms_points
    trigger: "ScoreSheet creation and DRAFT recompute"
    algorithm: threshold
    formula: |
      ops_pts = 4 if comms_operators_on_duty_min >= 2 else (2 if == 1 else 0)
      alarm_pts = 4 if comms_avg_alarm_to_dispatch_seconds <= 60
                  else (2 if <= 90 else 0)
      redundancy_pts = 2 if (comms_redundant_circuits and comms_backup_power)
                       else (1 if either else 0)
      comms_points = ops_pts + alarm_pts + redundancy_pts   # max 10
    input_set: "the community's comms_* attested fields"
    constants:
      ALARM_FAST_SECONDS: 60
      ALARM_SLOW_SECONDS: 90
      COMMS_MAX: 10
    precision: "integer points"

  - name: crr_credit
    trigger: "ScoreSheet creation and DRAFT recompute"
    algorithm: waterfall_allocation
    formula: |
      # evaluation order pinned: subtotal FIRST, then caps — this resolves the
      # circular-looking dependency of a credit capped by a total that includes it
      subtotal_points = fd_total_points + water_total_points + comms_points
      crr_raw_points = sum(credited_points over VERIFIED RiskReductionCredits of the cycle)
      pct_cap = round_half_up_2dp(CRR_PCT_OF_SUBTOTAL * subtotal_points)
      crr_effective_points = min(crr_raw_points, CRR_TOTAL_CAP, pct_cap)
    input_set: "VERIFIED RiskReductionCredits of the cycle; each item already capped at 2.0 on verification"
    constants:
      CRR_ITEM_CAP: 2.0
      CRR_TOTAL_CAP: 5.5
      CRR_PCT_OF_SUBTOTAL: 0.10
    precision: "2 decimal places, round_half_up; pct_cap rounded before the min()"

  - name: total_points_divergence_and_class
    trigger: "ScoreSheet creation and DRAFT recompute"
    algorithm: weighted_scoring
    formula: |
      divergence_penalty_points = 2 * (DIVERGENCE_RATIO * fd_total_points - water_total_points)
                                  if water_total_points < DIVERGENCE_RATIO * fd_total_points else 0
      adjusted_total_points = subtotal_points + crr_effective_points - divergence_penalty_points
      base_class = 1 if adjusted >= 90 else 2 if >= 80 else 3 if >= 70 else 4 if >= 60
                   else 5 if >= 50 else 6 if >= 40 else 7 if >= 30 else 8 if >= 20 else 9 if >= 10 else 10
      hydrant_component = flow_points + distribution_points        # of the applied water variant
      alternate_component = (18 * min(1, alternate_shuttle_capacity_gpm / NFF)
                             + 7 * min(1, alternate_sites_count / ALT_SITE_TARGET))
                            if alternate_verified else 0
      split_total = max(0, adjusted_total_points - hydrant_component + alternate_component)
      split_class_beyond_hydrant = class_of(split_total)           # same thresholds
    input_set: "all ScoreSheet subscores plus the WaterSupplySystem alternate-supply fields"
    constants:
      DIVERGENCE_RATIO: 0.5
      DIVERGENCE_PENALTY_MULT: 2
    precision: "2 decimal places, round_half_up at each named subscore before summation"

  - name: applicable_class_for_property
    trigger: "PropertyRiskProfile creation and classification activation cascade"
    algorithm: threshold
    formula: |
      if distance_to_nearest_station_road_miles > STATION_RADIUS_MI: applicable_class = 10
      elif distance_to_nearest_hydrant_ft > HYDRANT_RADIUS_FT: applicable_class = classification.split_class_beyond_hydrant
      else: applicable_class = classification.base_class
      applicable_premium_modifier = MODIFIER[applicable_class]
      # boundaries: exactly 1000 ft is WITHIN (base class); exactly 5.0 miles is WITHIN
    input_set: "the property and its community's EFFECTIVE classification"
    constants:
      HYDRANT_RADIUS_FT: 1000
      STATION_RADIUS_MI: 5.0
    precision: "integer class"

  - name: premium_amounts
    trigger: "PremiumQuote creation (provisional) and bind (final)"
    algorithm: tiered_pricing
    formula: |
      modifier = property.applicable_premium_modifier at quote creation (pinned via classification_id)
      annual_exact_cents = coverage_amount_cents * base_rate_bp * modifier / 10000
      # PROVISIONAL variant — round once at the end:
      provisional_premium_cents = round_half_up_integer(annual_exact_cents * term_months / 12)
      # FINAL variant — round per month, then multiply (nested rounding; order pinned):
      monthly_cents = round_half_up_integer(annual_exact_cents / 12)
      final_premium_cents = monthly_cents * term_months
    input_set: "the quote's inputs and the property's applicable modifier"
    constants:
      MODIFIER_TABLE: "{1: 0.65, 2: 0.70, 3: 0.75, 4: 0.80, 5: 0.85, 6: 0.90, 7: 0.95, 8: 1.00, 9: 1.10, 10: 1.25}"
    precision: "integer cents, round_half_up; the two rounding orders are pinned per variant and MUST NOT be interchanged"
    variants:
      - name: PROVISIONAL
        when: "quote creation (status QUOTED)"
        difference: "single rounding at the end of the computation"
      - name: FINAL
        when: "bind (status BOUND)"
        difference: "rounds each monthly installment before multiplying — for the same inputs the two variants can differ by cents"

  - name: exposure_ledger
    trigger: "PremiumQuote bind and void"
    algorithm: aggregation
    formula: |
      invariant: Community.bound_exposure_cents == sum(coverage_amount_cents over BOUND PremiumQuotes
                 of properties belonging to the community)
      bind: bound_exposure_cents += coverage_amount_cents (rejected if it would exceed EXPOSURE_CAP_CENTS)
      void: bound_exposure_cents -= coverage_amount_cents
    input_set: "BOUND PremiumQuotes of the community"
    constants:
      EXPOSURE_CAP_CENTS: 500000000
      COVERAGE_VALUE_CAP_RATIO: 1.5
    precision: "integer cents"

  - name: schedule_windows
    trigger: "classification activation; reevaluation request creation; appeal creation; cycle INTAKE"
    algorithm: threshold
    formula: |
      next_evaluation_due_date = add_calendar_months(effective_from, EVAL_INTERVAL_MONTHS)
      reevaluation allowed iff clock_date >= add_calendar_months(effective_from, REEVAL_MIN_MONTHS)
      appeal allowed iff clock datetime <= published_at + APPEAL_WINDOW_DAYS
      cycle INTAKE allowed iff clock_date >= scheduled_open_date
      analyst window conflict iff [scheduled_open_date, data_freeze_date) half-open intervals
      of two non-terminal (not EFFECTIVE, not WITHDRAWN) cycles with the same field_analyst_id overlap
      (a.open < b.freeze AND a.freeze > b.open; touching endpoints do NOT overlap)
    input_set: "Classification effective dates, logical clock, cycle windows"
    constants:
      EVAL_INTERVAL_MONTHS: 60
      REEVAL_MIN_MONTHS: 12
      APPEAL_WINDOW_DAYS: 90
    precision: "calendar-month arithmetic; dates compared at day granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role known", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles; for parameterized transition endpoints the role must also own the requested target_state", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: FireChief X-User-ID == FireDepartment.id of the target; WaterUtilityManager X-User-ID == WaterSupplySystem.id; CommunityOfficial X-User-ID == Community.id", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "endpoints on owned resources" }
  - { priority: 4, category: existence, check: "Community in path or body exists", error_id: ERR_COMMUNITY_NOT_FOUND, http_status: 404, applies_to: "community-scoped endpoints" }
  - { priority: 5, category: existence, check: "EvaluationCycle exists", error_id: ERR_CYCLE_NOT_FOUND, http_status: 404, applies_to: "cycle endpoints" }
  - { priority: 6, category: existence, check: "ScoreSheet exists", error_id: ERR_SCORE_SHEET_NOT_FOUND, http_status: 404, applies_to: "score-sheet endpoints" }
  - { priority: 7, category: existence, check: "Classification exists", error_id: ERR_CLASSIFICATION_NOT_FOUND, http_status: 404, applies_to: "classification endpoints" }
  - { priority: 8, category: existence, check: "FireDepartment exists", error_id: ERR_DEPARTMENT_NOT_FOUND, http_status: 404, applies_to: "department/apparatus endpoints" }
  - { priority: 9, category: existence, check: "Apparatus exists", error_id: ERR_APPARATUS_NOT_FOUND, http_status: 404, applies_to: "apparatus endpoints" }
  - { priority: 10, category: existence, check: "WaterSupplySystem exists", error_id: ERR_SYSTEM_NOT_FOUND, http_status: 404, applies_to: "water-system/hydrant/flow-test endpoints" }
  - { priority: 11, category: existence, check: "Hydrant exists", error_id: ERR_HYDRANT_NOT_FOUND, http_status: 404, applies_to: "hydrant/flow-test endpoints" }
  - { priority: 12, category: existence, check: "FlowTest exists", error_id: ERR_FLOW_TEST_NOT_FOUND, http_status: 404, applies_to: "flow-test endpoints" }
  - { priority: 13, category: existence, check: "RiskReductionCredit exists", error_id: ERR_CREDIT_NOT_FOUND, http_status: 404, applies_to: "credit endpoints" }
  - { priority: 14, category: existence, check: "PropertyRiskProfile exists", error_id: ERR_PROPERTY_NOT_FOUND, http_status: 404, applies_to: "property/quote endpoints" }
  - { priority: 15, category: existence, check: "PremiumQuote exists", error_id: ERR_QUOTE_NOT_FOUND, http_status: 404, applies_to: "quote endpoints" }
  - { priority: 16, category: existence, check: "ReevaluationRequest exists", error_id: ERR_REQUEST_NOT_FOUND, http_status: 404, applies_to: "reevaluation-request endpoints" }
  - { priority: 17, category: existence, check: "Appeal exists", error_id: ERR_APPEAL_NOT_FOUND, http_status: 404, applies_to: "appeal endpoints" }
  - { priority: 18, category: state, check: "Community in required status for the operation (REGISTERED/CLASSIFIED for cycle create; CLASSIFIED for request create)", error_id: ERR_COMMUNITY_INVALID_STATE, http_status: 409, applies_to: "cycle create, request create" }
  - { priority: 19, category: state, check: "EvaluationCycle transition valid from current state; publish requires CLASSIFICATION_REVIEW", error_id: ERR_CYCLE_INVALID_STATE, http_status: 409, applies_to: "cycle transition, publish-classification, score-sheet create" }
  - { priority: 20, category: state, check: "ScoreSheet in DRAFT for finalize", error_id: ERR_SHEET_INVALID_STATE, http_status: 409, applies_to: "score-sheet finalize" }
  - { priority: 21, category: state, check: "Classification in PUBLISHED for activate; in PUBLISHED/EFFECTIVE for appeal create", error_id: ERR_CLASSIFICATION_INVALID_STATE, http_status: 409, applies_to: "classification activate, appeal create" }
  - { priority: 22, category: state, check: "FlowTest transition valid from current state (SUBMITTED->WITNESSED->CERTIFIED/REJECTED; CERTIFIED->CORRECTED)", error_id: ERR_FLOW_TEST_INVALID_STATE, http_status: 409, applies_to: "flow-test transition" }
  - { priority: 23, category: state, check: "Apparatus status change valid (OUT_OF_SERVICE -> FRONTLINE forbidden)", error_id: ERR_APPARATUS_INVALID_STATE, http_status: 409, applies_to: "apparatus PATCH" }
  - { priority: 24, category: state, check: "PremiumQuote in QUOTED for bind, BOUND for void", error_id: ERR_QUOTE_INVALID_STATE, http_status: 409, applies_to: "quote bind/void" }
  - { priority: 25, category: state, check: "ReevaluationRequest transition valid from current state; PATCH evidence only while SUBMITTED", error_id: ERR_REQUEST_INVALID_STATE, http_status: 409, applies_to: "request transition/approve/PATCH" }
  - { priority: 26, category: state, check: "Appeal transition valid from current state", error_id: ERR_APPEAL_INVALID_STATE, http_status: 409, applies_to: "appeal transition" }
  - { priority: 27, category: state, check: "RiskReductionCredit transition valid from current state (REJECTED is terminal)", error_id: ERR_CREDIT_INVALID_STATE, http_status: 409, applies_to: "credit transition" }
  - { priority: 28, category: state, check: "Data window open: the community's non-terminal cycle is in the state set required by the endpoint (see endpoint descriptions)", error_id: ERR_DATA_WINDOW_CLOSED, http_status: 409, applies_to: "data submission and verification endpoints" }
  - { priority: 29, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "score-sheet create, request approve, quote bind" }
  - { priority: 30, category: business_safety, check: "Segregation of duties: publishing registrar X-User-ID != cycle.field_analyst_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "publish-classification" }
  - { priority: 31, category: business_safety, check: "Segregation of duties: adjudicating registrar X-User-ID != classification.published_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "appeal adjudication" }
  - { priority: 32, category: business_referential, check: "SCORING gate: no pending flow tests, comms attested, department data submitted (re-checked at score-sheet create)", error_id: ERR_CYCLE_DATA_INCOMPLETE, http_status: 422, applies_to: "cycle transition to SCORING, score-sheet create" }
  - { priority: 33, category: business_referential, check: "FINAL ScoreSheet exists before CLASSIFICATION_REVIEW", error_id: ERR_NO_FINAL_SCORE_SHEET, http_status: 422, applies_to: "cycle transition to CLASSIFICATION_REVIEW" }
  - { priority: 34, category: business_referential, check: "Community has an EFFECTIVE classification (property's applicable modifier non-null) before quote creation", error_id: ERR_NO_EFFECTIVE_CLASSIFICATION, http_status: 422, applies_to: "quote create" }
  - { priority: 35, category: business_referential, check: "No non-terminal Appeal on the classification before activation", error_id: ERR_APPEAL_PENDING, http_status: 409, applies_to: "classification activate" }
  - { priority: 36, category: business_referential, check: "DISPUTED->FIELD_VERIFICATION requires an Appeal on the cycle's classification in DATA_VERIFICATION", error_id: ERR_NO_APPEAL_IN_VERIFICATION, http_status: 409, applies_to: "cycle transition" }
  - { priority: 37, category: business_temporal, check: "Logical clock date >= scheduled_open_date before INTAKE", error_id: ERR_CYCLE_NOT_OPEN_YET, http_status: 422, applies_to: "cycle transition to INTAKE" }
  - { priority: 38, category: business_temporal, check: "Analyst window conflict: half-open [scheduled_open_date, data_freeze_date) overlap with another non-terminal cycle of the same field_analyst_id", error_id: ERR_CYCLE_WINDOW_CONFLICT, http_status: 409, applies_to: "cycle create, request approve (spawned cycle)" }
  - { priority: 39, category: business_temporal, check: "Reevaluation request only when clock date >= effective_from + 12 months of the current EFFECTIVE classification", error_id: ERR_REEVALUATION_TOO_EARLY, http_status: 422, applies_to: "request create" }
  - { priority: 40, category: business_temporal, check: "Appeal filed within 90 days of classification.published_at", error_id: ERR_APPEAL_WINDOW_EXPIRED, http_status: 422, applies_to: "appeal create" }
  - { priority: 41, category: business_temporal, check: "coverage_start_date <= coverage_end_date and coverage_start_date >= logical clock date", error_id: ERR_COVERAGE_PERIOD_INVALID, http_status: 422, applies_to: "quote create" }
  - { priority: 42, category: business_temporal, check: "Bound-quote coverage overlap: closed intervals [start, end] on the same property must not touch or overlap (start <= other.end AND end >= other.start rejects, including shared single days)", error_id: ERR_QUOTE_COVERAGE_OVERLAP, http_status: 409, applies_to: "quote bind" }
  - { priority: 43, category: business_temporal, check: "FlowTest test_date <= logical clock date", error_id: ERR_TEST_DATE_IN_FUTURE, http_status: 422, applies_to: "flow-test create" }
  - { priority: 44, category: business_constraint, check: "Required fields present; enum membership; numeric ranges; static_psi > residual_psi; evidence_items min 1; kind-driven apparatus field requirements; freeze after open; appeal.community_id matches classification's community; new_score_sheet FINAL/belongs/differs on revise", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 45, category: business_constraint, check: "No second non-terminal ReevaluationRequest per community", error_id: ERR_DUPLICATE_ACTIVE_REQUEST, http_status: 409, applies_to: "request create" }
  - { priority: 46, category: business_constraint, check: "No second non-terminal Appeal per classification", error_id: ERR_DUPLICATE_ACTIVE_APPEAL, http_status: 409, applies_to: "appeal create" }
  - { priority: 47, category: business_constraint, check: "verify-alternate-supply requires alternate_shuttle_capacity_gpm > 0 and alternate_sites_count >= 1", error_id: ERR_ALTERNATE_SUPPLY_INSUFFICIENT, http_status: 422, applies_to: "verify-alternate-supply" }
  - { priority: 48, category: business_fiscal, check: "coverage_amount_cents <= 150% of property.insured_value_cents (exactly 150% allowed)", error_id: ERR_COVERAGE_EXCEEDS_VALUE, http_status: 422, applies_to: "quote create" }
  - { priority: 49, category: business_fiscal, check: "bind must not push community.bound_exposure_cents over EXPOSURE_CAP_CENTS", error_id: ERR_EXPOSURE_CAP_EXCEEDED, http_status: 422, applies_to: "quote bind" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Community & comms attestation ---
  - method: POST
    path: "/ppc/communities"
    description: "Register a community; auto-creates its FireDepartment and WaterSupplySystem shells"
    roles: [EvaluationCoordinator]
    code: 201
    input: [name, state_code, population, area_sq_miles, rural_area_pct, dept_type, needed_fire_flow_gpm, storage_capacity_gal, supply_works_capacity_gpm, daily_consumption_gpm]
    output: Community
    side_effects: ["FireDepartment shell created (dept_type from input)", "WaterSupplySystem shell created (hydrologic inputs)", "status = REGISTERED"]

  - method: GET
    path: "/ppc/communities"
    description: "List communities with filters and pagination"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: "Community[]"
    side_effects: []

  - method: GET
    path: "/ppc/communities/{communityId}"
    description: "Get one community including computed denormalized fields"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: PATCH
    path: "/ppc/communities/{communityId}/attest-comms"
    description: "CommsSupervisor attests dispatch staffing/alarm data; data window must be open (DATA_COLLECTION, FIELD_VERIFICATION or SCORING)"
    roles: [CommsSupervisor]
    code: 200
    input: [operators_on_duty_min, avg_alarm_to_dispatch_seconds, redundant_circuits, backup_power]
    output: Community
    side_effects: ["comms_* fields updated", "comms_attested = true, attested_by/at set", "DRAFT sheet recompute when cycle in SCORING"]

  # --- EvaluationCycle ---
  - method: POST
    path: "/ppc/evaluation-cycles"
    description: "Create an evaluation cycle; community must be REGISTERED or CLASSIFIED (its state blocks a second active cycle); analyst window overlap uses half-open semantics"
    roles: [EvaluationCoordinator]
    code: 201
    input: [community_id, field_analyst_id, scheduled_open_date, data_freeze_date]
    output: EvaluationCycle
    side_effects: ["community REGISTERED/CLASSIFIED -> UNDER_EVALUATION", "community.version increments"]

  - method: GET
    path: "/ppc/evaluation-cycles"
    description: "List cycles"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["community_id?", "status?", "field_analyst_id?", "limit?", "offset?"]
    output: "EvaluationCycle[]"
    side_effects: []

  - method: GET
    path: "/ppc/evaluation-cycles/{cycleId}"
    description: "Get one cycle"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: EvaluationCycle
    side_effects: []

  - method: POST
    path: "/ppc/evaluation-cycles/{cycleId}/transition"
    description: "Advance/withdraw the cycle. Allowed targets: INTAKE, DATA_COLLECTION, FIELD_VERIFICATION (from DATA_COLLECTION or DISPUTED), SCORING, CLASSIFICATION_REVIEW, WITHDRAWN"
    roles: [EvaluationCoordinator]
    code: 200
    input: [target_state]
    output: EvaluationCycle
    side_effects: ["state gates per §1.2/§1.4", "WITHDRAWN reverts community status"]

  - method: POST
    path: "/ppc/evaluation-cycles/{cycleId}/score-sheets"
    description: "Create a DRAFT ScoreSheet computing all points; OCC on cycle version; supersedes any existing DRAFT"
    roles: [FieldAnalyst]
    code: 201
    input: [expected_cycle_version]
    output: ScoreSheet
    side_effects: ["all §1.3 scoring calculations run", "existing DRAFT sheet -> SUPERSEDED", "increments EvaluationCycle.version by 1"]

  - method: GET
    path: "/ppc/score-sheets"
    description: "List score sheets"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["cycle_id?", "status?", "limit?", "offset?"]
    output: "ScoreSheet[]"
    side_effects: []

  - method: GET
    path: "/ppc/score-sheets/{sheetId}"
    description: "Get one score sheet"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: ScoreSheet
    side_effects: []

  - method: POST
    path: "/ppc/score-sheets/{sheetId}/finalize"
    description: "DRAFT -> FINAL; locks values and supersedes other non-SUPERSEDED sheets of the cycle"
    roles: [FieldAnalyst]
    code: 200
    input: []
    output: ScoreSheet
    side_effects: ["other non-SUPERSEDED sheets of the cycle -> SUPERSEDED"]

  - method: POST
    path: "/ppc/evaluation-cycles/{cycleId}/publish-classification"
    description: "ClassRegistrar publishes a classification from a FINAL sheet; SoD vs the cycle's field analyst"
    roles: [ClassRegistrar]
    code: 201
    input: [score_sheet_id]
    output: Classification
    side_effects: ["cycle CLASSIFICATION_REVIEW -> PUBLISHED", "Classification created PUBLISHED with base/split class and premium_modifier"]

  # --- Classification ---
  - method: GET
    path: "/ppc/classifications"
    description: "List classifications"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["community_id?", "cycle_id?", "score_sheet_id?", "status?", "limit?", "offset?"]
    output: "Classification[]"
    side_effects: []

  - method: GET
    path: "/ppc/classifications/{classificationId}"
    description: "Get one classification"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: Classification
    side_effects: []

  - method: POST
    path: "/ppc/classifications/{classificationId}/activate"
    description: "PUBLISHED -> EFFECTIVE; runs the activation cascade (prior superseded, community denorms, property classes, QUOTED quotes expire)"
    roles: [ClassRegistrar]
    code: 200
    input: [effective_from]
    output: Classification
    side_effects: ["full activation cascade per §1.2 Classification", "community.version increments"]

  # --- FireDepartment / Apparatus ---
  - method: GET
    path: "/ppc/fire-departments"
    description: "List fire departments"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["community_id?", "limit?", "offset?"]
    output: "FireDepartment[]"
    side_effects: []

  - method: GET
    path: "/ppc/fire-departments/{departmentId}"
    description: "Get one fire department"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: FireDepartment
    side_effects: []

  - method: PATCH
    path: "/ppc/fire-departments/{departmentId}"
    description: "FireChief submits staffing/training/coverage data; sets data_submitted; data window must be open"
    roles: [FireChief]
    code: 200
    input: ["stations_active_count?", "career_on_duty_per_shift?", "volunteers_on_duty_avg?", "training_hours_per_firefighter_annual?", "training_facility_level?", "live_fire_training?", "coverage_pct_within_5mi?"]
    output: FireDepartment
    side_effects: ["data_submitted = true", "DRAFT sheet recompute when cycle in SCORING"]

  - method: POST
    path: "/ppc/apparatus"
    description: "Register apparatus (created FRONTLINE); data window must be open"
    roles: [FireChief]
    code: 201
    input: [department_id, kind, "pump_capacity_gpm?", "tank_capacity_gal?", "ladder_height_ft?"]
    output: Apparatus
    side_effects: ["DRAFT sheet recompute when cycle in SCORING"]

  - method: GET
    path: "/ppc/apparatus"
    description: "List apparatus"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["department_id?", "status?", "kind?", "limit?", "offset?"]
    output: "Apparatus[]"
    side_effects: []

  - method: GET
    path: "/ppc/apparatus/{apparatusId}"
    description: "Get one apparatus"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: Apparatus
    side_effects: []

  - method: PATCH
    path: "/ppc/apparatus/{apparatusId}"
    description: "Change apparatus status (OUT_OF_SERVICE -> FRONTLINE forbidden)"
    roles: [FireChief]
    code: 200
    input: [status]
    output: Apparatus
    side_effects: ["DRAFT sheet recompute when cycle in SCORING"]

  # --- WaterSupplySystem / Hydrant / FlowTest ---
  - method: GET
    path: "/ppc/water-supply-systems"
    description: "List water supply systems"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["community_id?", "limit?", "offset?"]
    output: "WaterSupplySystem[]"
    side_effects: []

  - method: GET
    path: "/ppc/water-supply-systems/{systemId}"
    description: "Get one water supply system"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: WaterSupplySystem
    side_effects: []

  - method: PATCH
    path: "/ppc/water-supply-systems/{systemId}"
    description: "WaterUtilityManager updates hydrologic and alternate-supply data; data window must be open"
    roles: [WaterUtilityManager]
    code: 200
    input: ["needed_fire_flow_gpm?", "storage_capacity_gal?", "supply_works_capacity_gpm?", "daily_consumption_gpm?", "alternate_shuttle_capacity_gpm?", "alternate_sites_count?"]
    output: WaterSupplySystem
    side_effects: ["DRAFT sheet recompute when cycle in SCORING"]

  - method: POST
    path: "/ppc/water-supply-systems/{systemId}/verify-alternate-supply"
    description: "FieldAnalyst certifies the rural alternate supply; requires shuttle capacity > 0 and >= 1 site; allowed in FIELD_VERIFICATION or SCORING"
    roles: [FieldAnalyst]
    code: 200
    input: []
    output: WaterSupplySystem
    side_effects: ["alternate_verified = true", "DRAFT sheet recompute when cycle in SCORING (may switch water variant)"]

  - method: POST
    path: "/ppc/hydrants"
    description: "Register a hydrant (created ACTIVE, max_flow_gpm null); data window must be open"
    roles: [WaterUtilityManager]
    code: 201
    input: [system_id, location_descriptor]
    output: Hydrant
    side_effects: []

  - method: GET
    path: "/ppc/hydrants"
    description: "List hydrants"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["system_id?", "status?", "limit?", "offset?"]
    output: "Hydrant[]"
    side_effects: []

  - method: GET
    path: "/ppc/hydrants/{hydrantId}"
    description: "Get one hydrant"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: Hydrant
    side_effects: []

  - method: PATCH
    path: "/ppc/hydrants/{hydrantId}"
    description: "Toggle hydrant status ACTIVE <-> OUT_OF_SERVICE; recomputes system aggregates"
    roles: [WaterUtilityManager]
    code: 200
    input: [status]
    output: Hydrant
    side_effects: ["system active_certified_flow_gpm and creditworthy_hydrant_count recomputed", "DRAFT sheet recompute when cycle in SCORING"]

  - method: POST
    path: "/ppc/flow-tests"
    description: "Submit a measured flow test (created SUBMITTED); window DATA_COLLECTION or FIELD_VERIFICATION"
    roles: [WaterUtilityManager]
    code: 201
    input: [system_id, hydrant_id, test_date, static_psi, residual_psi, measured_flow_gpm]
    output: FlowTest
    side_effects: []

  - method: GET
    path: "/ppc/flow-tests"
    description: "List flow tests"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["system_id?", "hydrant_id?", "status?", "supersedes_test_id?", "limit?", "offset?"]
    output: "FlowTest[]"
    side_effects: []

  - method: GET
    path: "/ppc/flow-tests/{testId}"
    description: "Get one flow test"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: FlowTest
    side_effects: []

  - method: POST
    path: "/ppc/flow-tests/{testId}/transition"
    description: "Analyst transitions: WITNESSED, CERTIFIED, REJECTED (window FIELD_VERIFICATION); CORRECTED on a CERTIFIED test (window FIELD_VERIFICATION or SCORING) supersedes it with a corrected CERTIFIED replacement and triggers the correction cascade"
    roles: [FieldAnalyst]
    code: 200
    input: [target_state, "corrected_static_psi?", "corrected_residual_psi?", "corrected_measured_flow_gpm?", "correction_reason?"]
    output: FlowTest
    side_effects: ["per §1.2 FlowTest; CORRECTED returns the replacement row and runs the 3-link recompute cascade"]

  # --- RiskReductionCredit ---
  - method: POST
    path: "/ppc/risk-reduction-credits"
    description: "CommunityOfficial claims a risk-reduction program credit; window DATA_COLLECTION or FIELD_VERIFICATION"
    roles: [CommunityOfficial]
    code: 201
    input: [cycle_id, program_type, activity_points, evidence_note]
    output: RiskReductionCredit
    side_effects: []

  - method: GET
    path: "/ppc/risk-reduction-credits"
    description: "List risk-reduction credits"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["cycle_id?", "status?", "program_type?", "limit?", "offset?"]
    output: "RiskReductionCredit[]"
    side_effects: []

  - method: GET
    path: "/ppc/risk-reduction-credits/{creditId}"
    description: "Get one credit"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: RiskReductionCredit
    side_effects: []

  - method: POST
    path: "/ppc/risk-reduction-credits/{creditId}/transition"
    description: "Analyst verifies or rejects (incl. revoke of VERIFIED); window FIELD_VERIFICATION or SCORING"
    roles: [FieldAnalyst]
    code: 200
    input: [target_state]
    output: RiskReductionCredit
    side_effects: ["credited_points recomputed per §1.3 crr_credit", "DRAFT sheet recompute when cycle in SCORING"]

  # --- PropertyRiskProfile / PremiumQuote ---
  - method: POST
    path: "/ppc/property-risk-profiles"
    description: "Register an insured property; applicable class computed immediately when an EFFECTIVE classification exists"
    roles: [EvaluationCoordinator]
    code: 201
    input: [community_id, address, distance_to_nearest_hydrant_ft, distance_to_nearest_station_road_miles, construction_type, insured_value_cents]
    output: PropertyRiskProfile
    side_effects: ["applicable_class/applicable_premium_modifier computed if classification EFFECTIVE"]

  - method: GET
    path: "/ppc/property-risk-profiles"
    description: "List properties"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["community_id?", "limit?", "offset?"]
    output: "PropertyRiskProfile[]"
    side_effects: []

  - method: GET
    path: "/ppc/property-risk-profiles/{propertyId}"
    description: "Get one property"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: PropertyRiskProfile
    side_effects: []

  - method: POST
    path: "/ppc/premium-quotes"
    description: "Insurer quotes a premium; pins the EFFECTIVE classification and the property's applicable modifier; provisional premium computed (round-at-end variant)"
    roles: [Insurer]
    code: 201
    input: [property_id, coverage_amount_cents, base_rate_bp, term_months, coverage_start_date, coverage_end_date]
    output: PremiumQuote
    side_effects: ["provisional_premium_cents computed"]

  - method: GET
    path: "/ppc/premium-quotes"
    description: "List premium quotes"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["property_id?", "classification_id?", "status?", "limit?", "offset?"]
    output: "PremiumQuote[]"
    side_effects: []

  - method: GET
    path: "/ppc/premium-quotes/{quoteId}"
    description: "Get one quote"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: PremiumQuote
    side_effects: []

  - method: POST
    path: "/ppc/premium-quotes/{quoteId}/bind"
    description: "Bind a QUOTED quote; OCC on community version; closed-interval overlap check; exposure-cap check; final premium computed (round-per-month variant)"
    roles: [Insurer]
    code: 200
    input: [expected_community_version]
    output: PremiumQuote
    side_effects: ["final_premium_cents computed", "community.bound_exposure_cents += coverage_amount_cents", "increments Community.version by 1"]

  - method: POST
    path: "/ppc/premium-quotes/{quoteId}/void"
    description: "Void a BOUND quote (compensating action)"
    roles: [Insurer]
    code: 200
    input: []
    output: PremiumQuote
    side_effects: ["community.bound_exposure_cents -= coverage_amount_cents", "increments Community.version by 1"]

  # --- ReevaluationRequest ---
  - method: POST
    path: "/ppc/reevaluation-requests"
    description: "CommunityOfficial requests reevaluation after documented improvements; 12-month rule and one-active-request rule apply"
    roles: [CommunityOfficial]
    code: 201
    input: [community_id, justification, evidence_items]
    output: ReevaluationRequest
    side_effects: ["community CLASSIFIED -> REEVALUATION_REQUESTED", "community.version increments"]

  - method: GET
    path: "/ppc/reevaluation-requests"
    description: "List reevaluation requests"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["community_id?", "status?", "limit?", "offset?"]
    output: "ReevaluationRequest[]"
    side_effects: []

  - method: GET
    path: "/ppc/reevaluation-requests/{requestId}"
    description: "Get one request"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: ReevaluationRequest
    side_effects: []

  - method: PATCH
    path: "/ppc/reevaluation-requests/{requestId}"
    description: "CommunityOfficial replaces evidence_items while SUBMITTED (after return-for-docs)"
    roles: [CommunityOfficial]
    code: 200
    input: [evidence_items]
    output: ReevaluationRequest
    side_effects: []

  - method: POST
    path: "/ppc/reevaluation-requests/{requestId}/transition"
    description: "Lifecycle transitions; role per target: DOCUMENTATION_REVIEW/SUBMITTED (EvaluationCoordinator), FIELD_REVERIFICATION (FieldAnalyst), DENIED (ClassRegistrar), WITHDRAWN (CommunityOfficial owner)"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, CommunityOfficial]
    code: 200
    input: [target_state, "note?"]
    output: ReevaluationRequest
    side_effects: ["DENIED/WITHDRAWN return community to CLASSIFIED"]

  - method: POST
    path: "/ppc/reevaluation-requests/{requestId}/approve"
    description: "ClassRegistrar approves (FIELD_REVERIFICATION -> APPROVED); OCC on community version; spawns the reevaluation cycle"
    roles: [ClassRegistrar]
    code: 200
    input: [expected_community_version, field_analyst_id, "note?"]
    output: ReevaluationRequest
    side_effects: ["new EvaluationCycle created (open = clock date, freeze = clock date + 90 days)", "community -> UNDER_REEVALUATION", "increments Community.version by 1"]

  # --- Appeal ---
  - method: POST
    path: "/ppc/appeals"
    description: "CommunityOfficial appeals a PUBLISHED or EFFECTIVE classification within 90 days of publication"
    roles: [CommunityOfficial]
    code: 201
    input: [classification_id, community_id, grounds, evidence_items]
    output: Appeal
    side_effects: ["classification's cycle PUBLISHED -> DISPUTED when applicable"]

  - method: GET
    path: "/ppc/appeals"
    description: "List appeals"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: ["classification_id?", "community_id?", "status?", "new_score_sheet_id?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/ppc/appeals/{appealId}"
    description: "Get one appeal"
    roles: [EvaluationCoordinator, FieldAnalyst, ClassRegistrar, FireChief, WaterUtilityManager, CommsSupervisor, CommunityOfficial, Insurer]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/ppc/appeals/{appealId}/transition"
    description: "Lifecycle transitions; role per target: DATA_VERIFICATION/FILED (FieldAnalyst), ADJUDICATED_UPHELD/ADJUDICATED_REVISED (ClassRegistrar, SoD vs publisher), WITHDRAWN (CommunityOfficial owner)"
    roles: [FieldAnalyst, ClassRegistrar, CommunityOfficial]
    code: 200
    input: [target_state, "adjudication_note?", "new_score_sheet_id?"]
    output: Appeal
    side_effects: ["UPHELD/WITHDRAWN: DISPUTED cycle returns to PUBLISHED", "REVISED: classification VACATED, replacement PUBLISHED from new sheet, cycle -> PUBLISHED"]

  # --- Platform clock (outside api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Default before any set call is exactly 2026-09-01T00:00:00Z; the server never falls back to wall-clock time"
    roles: [EvaluationCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint or for the requested transition target" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Entity-backed role acting on a resource it does not own" }
  - { id: ERR_COMMUNITY_NOT_FOUND, http: 404, condition: "Community id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "EvaluationCycle id does not exist" }
  - { id: ERR_SCORE_SHEET_NOT_FOUND, http: 404, condition: "ScoreSheet id does not exist" }
  - { id: ERR_CLASSIFICATION_NOT_FOUND, http: 404, condition: "Classification id does not exist" }
  - { id: ERR_DEPARTMENT_NOT_FOUND, http: 404, condition: "FireDepartment id does not exist" }
  - { id: ERR_APPARATUS_NOT_FOUND, http: 404, condition: "Apparatus id does not exist" }
  - { id: ERR_SYSTEM_NOT_FOUND, http: 404, condition: "WaterSupplySystem id does not exist" }
  - { id: ERR_HYDRANT_NOT_FOUND, http: 404, condition: "Hydrant id does not exist" }
  - { id: ERR_FLOW_TEST_NOT_FOUND, http: 404, condition: "FlowTest id does not exist" }
  - { id: ERR_CREDIT_NOT_FOUND, http: 404, condition: "RiskReductionCredit id does not exist" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "PropertyRiskProfile id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "PremiumQuote id does not exist" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "ReevaluationRequest id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "Appeal id does not exist" }
  - { id: ERR_COMMUNITY_INVALID_STATE, http: 409, condition: "Community status does not allow the operation" }
  - { id: ERR_CYCLE_INVALID_STATE, http: 409, condition: "Cycle transition invalid from current state, or publish attempted outside CLASSIFICATION_REVIEW" }
  - { id: ERR_SHEET_INVALID_STATE, http: 409, condition: "ScoreSheet not in DRAFT for finalize (or cycle not in a scoring state)" }
  - { id: ERR_CLASSIFICATION_INVALID_STATE, http: 409, condition: "Classification not in a state that allows activation or appeal" }
  - { id: ERR_FLOW_TEST_INVALID_STATE, http: 409, condition: "FlowTest transition invalid from current state" }
  - { id: ERR_APPARATUS_INVALID_STATE, http: 409, condition: "Apparatus status change invalid (OUT_OF_SERVICE -> FRONTLINE)" }
  - { id: ERR_QUOTE_INVALID_STATE, http: 409, condition: "Quote not QUOTED for bind or not BOUND for void" }
  - { id: ERR_REQUEST_INVALID_STATE, http: 409, condition: "ReevaluationRequest transition invalid from current state" }
  - { id: ERR_APPEAL_INVALID_STATE, http: 409, condition: "Appeal transition invalid from current state" }
  - { id: ERR_CREDIT_INVALID_STATE, http: 409, condition: "RiskReductionCredit transition invalid from current state" }
  - { id: ERR_DATA_WINDOW_CLOSED, http: 409, condition: "Community's active cycle is not in a state that accepts data changes/verifications" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same operator attempts data certification and publication/adjudication of the same object" }
  - { id: ERR_CYCLE_DATA_INCOMPLETE, http: 422, condition: "SCORING gate: pending flow tests, comms unattested, or department data not submitted" }
  - { id: ERR_NO_FINAL_SCORE_SHEET, http: 422, condition: "No FINAL ScoreSheet exists for the cycle" }
  - { id: ERR_NO_EFFECTIVE_CLASSIFICATION, http: 422, condition: "Community has no EFFECTIVE classification to rate against" }
  - { id: ERR_APPEAL_PENDING, http: 409, condition: "A non-terminal appeal exists on the classification" }
  - { id: ERR_NO_APPEAL_IN_VERIFICATION, http: 409, condition: "DISPUTED exit requires an appeal in DATA_VERIFICATION" }
  - { id: ERR_CYCLE_NOT_OPEN_YET, http: 422, condition: "Logical clock date precedes scheduled_open_date" }
  - { id: ERR_CYCLE_WINDOW_CONFLICT, http: 409, condition: "Analyst already assigned a non-WITHDRAWN cycle whose half-open window overlaps" }
  - { id: ERR_REEVALUATION_TOO_EARLY, http: 422, condition: "Fewer than 12 months since the current classification's effective_from" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "More than 90 days since the classification was published" }
  - { id: ERR_COVERAGE_PERIOD_INVALID, http: 422, condition: "Coverage start after end, or start before the logical clock date" }
  - { id: ERR_QUOTE_COVERAGE_OVERLAP, http: 409, condition: "Closed-interval coverage collision with another BOUND quote on the same property" }
  - { id: ERR_TEST_DATE_IN_FUTURE, http: 422, condition: "Flow test date is after the logical clock date" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, enum/range violation, psi-ordering violation, or malformed payload" }
  - { id: ERR_DUPLICATE_ACTIVE_REQUEST, http: 409, condition: "Community already has a non-terminal ReevaluationRequest" }
  - { id: ERR_DUPLICATE_ACTIVE_APPEAL, http: 409, condition: "Classification already has a non-terminal Appeal" }
  - { id: ERR_ALTERNATE_SUPPLY_INSUFFICIENT, http: 422, condition: "Alternate supply verification requires shuttle capacity > 0 and at least one site" }
  - { id: ERR_COVERAGE_EXCEEDS_VALUE, http: 422, condition: "Coverage exceeds 150% of insured value" }
  - { id: ERR_EXPOSURE_CAP_EXCEEDED, http: 422, condition: "Bind would push community bound exposure over the cap" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EvaluationCoordinator
    description: "Grading-authority coordinator; registers communities/properties, schedules and drives evaluation cycles, manages documentation intake, operates the logical clock"
    identity: opaque
    exclusive_operations: ["POST /ppc/communities", "POST /ppc/property-risk-profiles", "POST /ppc/evaluation-cycles", "POST /ppc/evaluation-cycles/{id}/transition", "POST /_clock/set_current_utc", "reevaluation open-review/return-for-docs"]
    shared_operations: ["all GET endpoints"]

  - name: FieldAnalyst
    description: "Grading-authority field analyst; witnesses and certifies flow tests, verifies credits and alternate supply, computes score sheets; cannot publish what it certified"
    identity: opaque
    exclusive_operations: ["POST /ppc/evaluation-cycles/{id}/score-sheets", "POST /ppc/score-sheets/{id}/finalize", "POST /ppc/flow-tests/{id}/transition", "POST /ppc/risk-reduction-credits/{id}/transition", "POST /ppc/water-supply-systems/{id}/verify-alternate-supply", "appeal DATA_VERIFICATION moves", "reevaluation begin-FIELD_REVERIFICATION"]
    shared_operations: ["all GET endpoints"]

  - name: ClassRegistrar
    description: "Grading-authority registrar; publishes and activates classifications, adjudicates appeals, approves reevaluation requests; segregated from the certifying analyst and from the original publisher"
    identity: opaque
    exclusive_operations: ["POST /ppc/evaluation-cycles/{id}/publish-classification", "POST /ppc/classifications/{id}/activate", "POST /ppc/reevaluation-requests/{id}/approve", "reevaluation DENIED", "appeal adjudication"]
    shared_operations: ["all GET endpoints"]

  - name: FireChief
    description: "Fire department data owner; submits staffing, training and apparatus data for its own department"
    identity: entity_backed:FireDepartment
    exclusive_operations: ["PATCH /ppc/fire-departments/{id}", "POST /ppc/apparatus", "PATCH /ppc/apparatus/{id}"]
    shared_operations: ["all GET endpoints"]

  - name: WaterUtilityManager
    description: "Water utility data owner; submits hydrologic data, hydrants and flow tests for its own system"
    identity: entity_backed:WaterSupplySystem
    exclusive_operations: ["PATCH /ppc/water-supply-systems/{id}", "POST /ppc/hydrants", "PATCH /ppc/hydrants/{id}", "POST /ppc/flow-tests"]
    shared_operations: ["all GET endpoints"]

  - name: CommsSupervisor
    description: "Emergency communications center supervisor; attests dispatch staffing and alarm-handling data"
    identity: opaque
    exclusive_operations: ["PATCH /ppc/communities/{id}/attest-comms"]
    shared_operations: ["all GET endpoints"]

  - name: CommunityOfficial
    description: "Municipal official of a community; files risk-reduction credits, reevaluation requests with documentation, and appeals on behalf of their own community"
    identity: entity_backed:Community
    exclusive_operations: ["POST /ppc/risk-reduction-credits", "POST /ppc/reevaluation-requests", "PATCH /ppc/reevaluation-requests/{id}", "POST /ppc/appeals", "request/appeal WITHDRAWN"]
    shared_operations: ["all GET endpoints"]

  - name: Insurer
    description: "Insurance carrier rater; reads classifications and creates/binds/voids premium quotes"
    identity: opaque
    exclusive_operations: ["POST /ppc/premium-quotes", "POST /ppc/premium-quotes/{id}/bind", "POST /ppc/premium-quotes/{id}/void"]
    shared_operations: ["all GET endpoints"]
