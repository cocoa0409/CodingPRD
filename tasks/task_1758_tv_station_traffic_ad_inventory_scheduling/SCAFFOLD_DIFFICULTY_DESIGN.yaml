      - name: state_vs_business_temporal_on_place
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DATE_WINDOW]
        distinguishing_aspect: |
          Pair (state, business_temporal): one placement call whose spot is
