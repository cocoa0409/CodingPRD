  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: item_discontinue_cascades_pallet_allocation_club_posture
        grounds:
          - state_machines.Item.DELETION_REVIEW_to_DISCONTINUED
          - state_machines.Pallet.transitions
          - state_machines.Allocation.PROPOSED_to_VOIDED
          - calculations.club_posture_recompute
        distinguishing_aspect: |
          Depth-3 cascade: item APPROVE-discontinue strands its ALLOCATED
          pallets; each stranding voids the pallet's PROPOSED allocation; each
          void decrements the club's allocated_slot_count and recomputes
          posture — each link caused by the previous link, not by the original
          discontinue call.
        test_recipe:
          setup:
            - "Clock 2026-09-02T09:05:00Z; capacity-2 club with 2 PROPOSED allocations filling both slots (posture FROZEN)"
            - "Item in DELETION_REVIEW with complaint_weighted_score 28.0 (SAFETY x household3 = 12.0 plus SAFETY x household4 = 16.0) >= 25.0 threshold"
            - "The 2 allocated pallets belong to this item"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
