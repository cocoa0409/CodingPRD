            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "VOTING" }
              as: BudgetAdmin
            - call: "POST /budget-cycles/${cyc}/phase-transitions"
              payload: { target_phase: "SELECTION" }
              as: BudgetAdmin
            - call: "GET /budget-cycles/${cyc}"
              payload: {}
              as: BudgetAdmin
              captures: { ver: $.data.version }
            - call: "POST /budget-cycles/${cyc}/selection-runs"
              payload: { expected_budgetcycle_version: "${ver}" }
              as: BudgetAdmin
          trigger:
            - call: "POST /budget-cycles/${cyc}/selection-runs"
              payload: { expected_budgetcycle_version: "${ver}" }
              as: BudgetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_CYCLE_VERSION"

  - section: consistency_model
    instances:
      - name: corner_immediate_category_ledger_initialized
        claim_type: immediate
        grounds: [entities.Category.fields.committed_cents, entities.Category.fields.remaining_cap_cents]
        distinguishing_aspect: "Immediate consistency: a freshly created Category returns committed_cents==0 and remaining_cap_cents==category_budget_cap_cents in the same response."
        test_recipe:
          setup: ["A DRAFT cycle."]
          setup_api_calls:
            - call: "POST /budget-cycles"
              payload: { name: "PBim", fiscal_year: 2027, total_budget_cents: 100000, voting_method: "ALLOCATION", per_project_cap_cents: 100000, per_voter_allocation_cap_cents: 100000, submission_start: "2026-03-01T00:00:00Z", submission_end: "2026-04-01T00:00:00Z", voting_start: "2026-04-01T00:00:00Z", voting_end: "2026-05-01T00:00:00Z" }
              as: BudgetAdmin
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /budget-cycles/${cyc}/categories"
              payload: { name: "Gen", category_budget_cap_cents: 50000 }
              as: BudgetAdmin
              captures: { cat: $.data.id }
          assert:
            - "Category.${cat}.committed_cents == 0"
            - "Category.${cat}.remaining_cap_cents == 50000"

  - section: calculations
    instances:
      - name: corner_stub_funding_waterfall
        claim_type: correct_result
        grounds: [calculations.funding_selection]
        excluded_because:
          difficulty_instance: funding_selection_waterfall_min_caps
          rationale: "Waterfall selection with per-project cap, category cap and inclusive boundary is fully asserted by the named §1.8 instance."
      - name: corner_stub_vote_tally_methods
        claim_type: variant_divergence
        grounds: [calculations.vote_tally]
        excluded_because:
          difficulty_instance: vote_tally_ranked_vs_allocation_winner_flips
          rationale: "RANKED vs ALLOCATION tally divergence is asserted by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: corner_stub_selection_award_cascade
        claim_type: ledger_sync
        grounds: [state_machines.Proposal.ON_BALLOT_to_SELECTED]
        excluded_because:
          difficulty_instance: selection_award_cascades_to_category_and_cycle_ledger
          rationale: "The award->category->cycle ledger cascade is asserted by the named §1.8 instance."
      - name: corner_stub_budget_conservation
        claim_type: compensation
        grounds: [state_machines.Proposal.SELECTED_to_CANCELLED]
        excluded_because:
          difficulty_instance: budget_conservation_award_then_cancel
          rationale: "Award-then-cancel budget conservation is asserted by the named §1.8 instance."
      - name: corner_stub_phase_window_overlap
        claim_type: temporal_validation
        grounds: ['validations[priority=14]']
        excluded_because:
          difficulty_instance: cycle_phase_windows_overlap_rejected_halfopen
          rationale: "Half-open phase-window overlap rejection is asserted by the named §1.8 instance."
      - name: corner_stub_milestone_overlap
        claim_type: temporal_validation
        grounds: ['validations[priority=15]']
        excluded_because:
          difficulty_instance: milestone_schedules_overlap_rejected_closed_buffer
          rationale: "Closed-interval milestone overlap rejection is asserted by the named §1.8 instance."
