            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${iy}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: ContractManager
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "00000000-0000-4000-8000-0000000000ee", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: ContractManager
              captures: { e2: $.data.error_id }
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${ix}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: ContractManager
              captures: { a1: $.data.id, st: $.data.status, cp: $.data.computed_price_cents }
          assert:
            - "${e1} == ERR_ITEM_CONTRACT_MISMATCH with HTTP 409 — V-Y is real and even cross-referenced for this member, but it belongs to C-Y while the commitment belongs to C-X"
            - "${e1} != ERR_CONTRACT_ITEM_NOT_FOUND — the item resolves, so this is a referential mismatch and not an existence failure"
            - "${e2} == ERR_CONTRACT_ITEM_NOT_FOUND with HTTP 404 — the body-FK band still runs first for an id that resolves to nothing"
            - "the same call against C-X's own item returns 201 with ${st} == DRAFT and ${cp} == 10000"

      - name: distributor_file_intake_on_a_suspended_member_returns_its_code
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: distributor_file_intake_depends_on_member_not_suspended
          rationale: "ERR_MEMBER_NOT_ACTIVE is triggered in §1.8 by suspending the member between two file receipts on the same contract, which also pins the guard as a member-state read rather than a commitment-state read."

      - name: activation_without_an_approved_cross_reference_returns_its_code
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: clinical_safety_beats_xref_referential
          rationale: "ERR_XREF_NOT_APPROVED is triggered in §1.8 once the clinical gate is satisfied, on the PROPOSED cross-reference that the same instance sets up."

      - name: evidence_endorsement_below_the_score_threshold_returns_its_code
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: evidence_endorse_at_exact_score_threshold
          rationale: "ERR_EVIDENCE_SCORE_BELOW_THRESHOLD is triggered in §1.8 at 6.99 against the inclusive 7.00 threshold, alongside the 7.00 pass — the boundary pair belongs together."

      - name: revision_request_past_the_second_round_returns_its_code
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: evidence_review_revision_cycle_capped_at_two_rounds
          rationale: "ERR_REVISION_LIMIT_REACHED is triggered in §1.8 by walking the revision cycle to revision_round 2 and asking for a third round."

      - name: local_exception_hop_during_requalification_returns_its_code
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: local_exception_endorse_and_approve_depend_on_commitment_not_requalifying
          rationale: "ERR_REQUALIFICATION_IN_PROGRESS is triggered in §1.8 on both the endorse and the approve hop of a LOCAL_EXCEPTION while its commitment sits in REQUAL_REVIEW."

      - name: overlapping_distributor_file_period_returns_its_code
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: distributor_file_half_open_periods_abut_without_colliding
          rationale: "ERR_FILE_PERIOD_OVERLAP is triggered in §1.8 by the one-day-earlier variant of the abutting pair, which is exactly the boundary that instance exists to pin."

      - name: overlapping_price_activation_window_returns_its_code
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: price_activation_closed_windows_collide_on_a_shared_endpoint_date
          rationale: "ERR_ACTIVATION_PERIOD_OVERLAP is triggered in §1.8 by two closed windows sharing a single endpoint date, contrasted against the file machine's half-open rule."

  - section: rbac
    instances:
      - name: roles_cannot_perform_other_roles_exclusive_operations
        claim_type: peer_roles
        grounds:
          - roles.ContractManager.exclusive_operations
          - roles.ComplianceAnalyst.exclusive_operations
          - roles.FinanceAdministrator.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations[priority=2]
        distinguishing_aspect: "The six roles are peers, not a ladder: no role subsumes another, so each exclusive operation is refused to all five other roles with ERR_ROLE_NOT_PERMITTED (403). Two cases are subtler than a plain endpoint check — POST /gpo/price-activations is shared but partitioned by activation_type, so a MemberMaterialsManager asking for TIER_PRICE is refused on the body's discriminator rather than the route; and GET /gpo/commitments/{id}/leakage-report is a read that DistributorAgent and ClinicalReviewer and FinanceAdministrator are excluded from, proving 'every GET endpoint' is not universal."
        test_recipe:
          setup: ["ACTIVE contract C-RB with one item; member M-1 with a countersigned ACTIVE commitment."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-RB", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { i1: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "Dana Whitfield" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
              payload: {}
              as: ContractManager
          trigger:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-NO", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ComplianceAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/members/${m1}/suspend"
              payload: { reason: "audit hold" }
              as: ContractManager
              captures: { e2: $.data.error_id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-09-01" }
              as: ContractManager
              captures: { e3: $.data.error_id }
            - call: "POST /gpo/distributor-files"
              payload: { contract_id: "${c1}", member_id: "${m1}", distributor_code: "DIST-MW", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", purchase_date: "2026-08-05", quantity_units: 10, unit_price_paid_cents: 10000 } ] }
              as: FinanceAdministrator
              captures: { e4: $.data.error_id }
            - call: "POST /gpo/admin-fee-distributions"
              payload: { contract_id: "${c1}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { e5: $.data.error_id }
            - call: "POST /gpo/clinical-evidence-reviews"
              payload: { contract_id: "${c1}", clinical_efficacy_score: 8.00, safety_score: 7.00, supply_resilience_score: 6.00 }
              as: ContractManager
              captures: { e6: $.data.error_id }
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { e7: $.data.error_id }
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "LOCAL_EXCEPTION", requested_price_cents: 9000, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: ContractManager
              captures: { e8: $.data.error_id }
            - call: "GET /gpo/commitments/${k1}/leakage-report"
              payload: { from_date: "2026-08-01", to_date: "2026-09-01" }
              as: DistributorAgent
              captures: { e9: $.data.error_id }
            - call: "GET /gpo/commitments/${k1}"
              payload: {}
              as: DistributorAgent
              captures: { es: $.data.election_status }
          assert:
            - "${e1} through ${e6} are all ERR_ROLE_NOT_PERMITTED with HTTP 403 — one exclusive operation per role refused to a peer"
            - "${e7} == ERR_ROLE_NOT_PERMITTED — the route is shared but activation_type TIER_PRICE belongs to ContractManager only"
            - "${e8} == ERR_ROLE_NOT_PERMITTED — the mirror case: LOCAL_EXCEPTION belongs to MemberMaterialsManager only, so a ContractManager cannot request one even though it owns the endorse and approve hops"
            - "${e9} == ERR_ROLE_NOT_PERMITTED — the leakage report is the one GET that DistributorAgent, ClinicalReviewer and FinanceAdministrator cannot read"
            - "the plain commitment read returns 200 with ${es} == ACTIVE for that same DistributorAgent — ordinary GETs remain shared"
            - "no side effect landed from any refused call: the member is still ACTIVE, the contract count is unchanged, and no PriceActivation, DistributorFile, AdminFeeDistribution or ClinicalEvidenceReview exists"

      - name: member_materials_manager_cannot_read_another_members_leakage_report
        claim_type: peer_roles
        grounds:
          - roles.MemberMaterialsManager.identity
          - errors.ERR_MEMBER_SCOPE_VIOLATION
          - validations[priority=3]
          - endpoints[GET /gpo/commitments/{commitment_id}/leakage-report]
        distinguishing_aspect: "The entity_backed role's scope rule reaches through the path resource, not just the body: the leakage report takes no member_id at all, so the check has to walk commitment_id to Commitment.member_id and compare it with X-User-ID. Member A reading its own report is 200 and reading member B's is ERR_MEMBER_SCOPE_VIOLATION (403), while the opaque ComplianceAnalyst reads both — so the restriction is a property of the caller's identity model and not of the endpoint."
        test_recipe:
          setup: ["ACTIVE contract C-SC; members M-A and M-B each with a countersigned ACTIVE commitment and no purchase data."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SC", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/members"
              payload: { member_code: "M-A", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { ma: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-B", name: "Lakeside Surgical Center", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { mb: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${ma}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${ma}"
              captures: { ka: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${mb}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${mb}"
              captures: { kb: $.data.id }
          trigger:
            - call: "GET /gpo/commitments/${ka}/leakage-report"
              payload: { from_date: "2026-08-01", to_date: "2026-09-01" }
              as: MemberMaterialsManager
              as_user_id: "${ma}"
              captures: { own: $.data.commitment_id, dz: $.data.denominator_cents }
            - call: "GET /gpo/commitments/${kb}/leakage-report"
              payload: { from_date: "2026-08-01", to_date: "2026-09-01" }
              as: MemberMaterialsManager
              as_user_id: "${ma}"
              captures: { e1: $.data.error_id }
            - call: "GET /gpo/commitments/${kb}/leakage-report"
              payload: { from_date: "2026-08-01", to_date: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { peer: $.data.commitment_id }
            - call: "PATCH /gpo/members/${mb}/item-master"
              payload: { item_master: [ { member_item_number: "MI-9", description: "Injected by the wrong member", units_per_uom: 1 } ] }
              as: MemberMaterialsManager
              as_user_id: "${ma}"
              captures: { e2: $.data.error_id }
            - call: "POST /gpo/commitments/${kb}/lop/sign"
              payload: { signer_name: "Impersonator" }
              as: MemberMaterialsManager
              as_user_id: "${ma}"
              captures: { e3: $.data.error_id }
          assert:
            - "${own} == ${ka} with ${dz} == 0 — a member reads its own report even when the window is empty"
            - "${e1} == ERR_MEMBER_SCOPE_VIOLATION with HTTP 403 — the scope is derived from Commitment.member_id, which never appears in the request"
            - "${peer} == ${kb} — the same URL is 200 for the opaque ComplianceAnalyst, so the report itself is not restricted"
            - "${e2} == ERR_MEMBER_SCOPE_VIOLATION and M-B's item master still holds exactly MI-1"
            - "${e3} == ERR_MEMBER_SCOPE_VIOLATION and M-B's lop_status is still NOT_ISSUED — the guard reaches through a nested action path too"

      - name: local_exception_approver_cannot_be_the_endorser
        claim_type: segregation_of_duties
        grounds:
          - state_machines.PriceActivation.ENDORSED_to_APPROVED
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority=11]
          - entities.PriceActivation.fields.approved_by_user_id
        distinguishing_aspect: "Both hops of the LOCAL_EXCEPTION ladder belong to the same role, so the only thing separating them is the X-User-ID recorded at endorse time. The same ContractManager user cannot approve what it endorsed; a second ContractManager can, and the row keeps both ids. The refusal is also silent on state — the activation stays ENDORSED and remains approvable, which distinguishes a segregation failure from a state failure."
        test_recipe:
          setup: ["ACTIVE contract C-SD with item V-1 (base 10000, floor 8200); member M-1 with a countersigned ACTIVE commitment and an APPROVED cross-reference MI-1 to V-1; a DRAFT LOCAL_EXCEPTION activation requesting 9000."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SD", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              as_user_id: "CM-1"
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
              as_user_id: "CM-1"
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              as_user_id: "CM-1"
              captures: { i1: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              as_user_id: "CM-1"
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
              as_user_id: "CM-1"
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "Dana Whitfield" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
              payload: {}
              as: ContractManager
              as_user_id: "CM-1"
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${i1}", member_item_number: "MI-1", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { x1: $.data.id }
            - call: "POST /gpo/item-cross-references/${x1}/approve"
              payload: {}
              as: ContractManager
              as_user_id: "CM-1"
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "LOCAL_EXCEPTION", requested_price_cents: 9000, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { a1: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /gpo/price-activations/${a1}/endorse"
              payload: {}
              as: ContractManager
              as_user_id: "CM-1"
              captures: { st1: $.data.status, eb: $.data.endorsed_by_user_id }
            - call: "POST /gpo/price-activations/${a1}/approve"
              payload: {}
              as: ContractManager
              as_user_id: "CM-1"
              captures: { e1: $.data.error_id }
            - call: "GET /gpo/price-activations/${a1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { st2: $.data.status, ab0: $.data.approved_by_user_id }
            - call: "POST /gpo/price-activations/${a1}/approve"
              payload: {}
              as: ContractManager
              as_user_id: "CM-2"
              captures: { st3: $.data.status, ab: $.data.approved_by_user_id }
            - call: "POST /gpo/price-activations/${a1}/activate"
              payload: {}
              as: ContractManager
              as_user_id: "CM-1"
              captures: { st4: $.data.status, cp: $.data.computed_price_cents }
          assert:
            - "${st0} == DRAFT, then ${st1} == ENDORSED with ${eb} == CM-1"
            - "${e1} == ERR_SEGREGATION_OF_DUTIES with HTTP 409 — the endorser cannot also approve"
            - "${st2} == ENDORSED and ${ab0} is null — the refused approve left no trace and did not push the row to a dead end"
            - "${st3} == APPROVED with ${ab} == CM-2 while ${eb} is still CM-1 — the two audit ids are both retained and differ"
            - "${st4} == ACTIVE with ${cp} == 9000 — CM-1 may activate what it endorsed; the separation rule binds the endorse and approve pair only"

      - name: evidence_endorsement_cannot_be_done_by_the_submitting_reviewer
        claim_type: segregation_of_duties
        grounds:
          - state_machines.ClinicalEvidenceReview.UNDER_REVIEW_to_ENDORSED
          - state_machines.ClinicalEvidenceReview.REVISION_REQUESTED_to_UNDER_REVIEW
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.ClinicalEvidenceReview.fields.submitted_by_user_id
        distinguishing_aspect: "This separation is against a moving target: submitted_by_user_id is re-stamped on every resubmit, so whoever last resubmitted becomes the blocked endorser and the previously blocked reviewer is freed. Both terminal hops carry the rule (reject as well as endorse), while request-revision does not — the same user may send its own dossier back for revision."
        test_recipe:
          setup: ["A DRAFT contract C-EV; reviewer CR-1 submits a dossier scoring (8.00, 7.00, 6.00) => weighted_score 7.15 => CONVERT."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-EV", supplier_name: "Acme Surgical", category_code: "CAT-MSH", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: true, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              as_user_id: "CM-1"
              captures: { c1: $.data.id }
            - call: "POST /gpo/clinical-evidence-reviews"
              payload: { contract_id: "${c1}", clinical_efficacy_score: 8.00, safety_score: 7.00, supply_resilience_score: 6.00, summary: "Meta-analysis of 14 trials." }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { r1: $.data.id, sb1: $.data.submitted_by_user_id, ws: $.data.weighted_score, rec: $.data.conversion_recommendation }
          trigger:
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/endorse"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/reject"
              payload: { reason: "self-rejection attempt" }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { e2: $.data.error_id }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/request-revision"
              payload: { reason: "need resilience detail" }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { st1: $.data.status, rr: $.data.revision_round }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/resubmit"
              payload: { clinical_efficacy_score: 8.00, safety_score: 7.00, supply_resilience_score: 6.00, summary: "Resilience appendix added." }
              as: ClinicalReviewer
              as_user_id: "CR-2"
              captures: { st2: $.data.status, sb2: $.data.submitted_by_user_id }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/endorse"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "CR-2"
              captures: { e3: $.data.error_id }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/endorse"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { st3: $.data.status, ed: $.data.endorsed_by_user_id }
            - call: "GET /gpo/contracts/${c1}"
              payload: {}
              as: ContractManager
              as_user_id: "CM-1"
              captures: { ee: $.data.evidence_endorsed }
          assert:
            - "${sb1} == CR-1, ${ws} == 7.15 and ${rec} == CONVERT"
            - "${e1} == ERR_SEGREGATION_OF_DUTIES with HTTP 409 — the score clears 7.00, so only the identity clash refuses"
            - "${e2} == ERR_SEGREGATION_OF_DUTIES — rejecting carries the same rule as endorsing, and the review is still UNDER_REVIEW afterwards"
            - "${st1} == REVISION_REQUESTED with ${rr} == 1 — request-revision has no separation rule, so the submitter may run it"
            - "${st2} == UNDER_REVIEW with ${sb2} == CR-2 — the resubmitting reviewer takes over the submitter slot"
