  - rule_id: priority_pair_validation_conflict
    instances:

      - name: property_state_priority_8_beats_credit_limit_priority_30_on_activate
        grounds:
          - validations.priority_8
          - validations.priority_30
          - errors.ERR_PROPERTY_NOT_ACTIVE
          - errors.ERR_PROPERTY_CREDIT_LIMIT_EXCEEDED
          - endpoints.POST_subscriptions_id_activate
        distinguishing_aspect: |
          Pair (8, 30) — a business_state rule against a business_fiscal rule, 22 priority
          steps apart, on POST /subscriptions/{id}/activate. Both are genuinely violated in
          the same request: the property is SUSPENDED and the activation charge (2500 + 3088)
          would blow a credit_limit_cents of 100. The expected answer is priority 8's
          ERR_PROPERTY_NOT_ACTIVE with HTTP 409, never the 402.
        test_recipe:
          setup:
            - "Property 'Thin Margin' is PM_BILLED with benefit_tier PLUS, damage_waiver_enabled true, aqg_enabled true and credit_limit_cents 100."
            - "Unit A-101 is TWO_STAGE with filter_slot_count 2 and nominal_size_code 16x25x1; the MERV 8 SKU costs 680 cents."
            - "The subscription was created while the property was still ACTIVE, so it sits in PENDING_SETUP with billing_party PROPERTY_MANAGER and monthly_fee_cents 3546."
            - "The property has since been SUSPENDED, so priority 8 is violated as well."
            - "Activating on 2026-08-05 would post ENROLLMENT_FEE 2500 plus first_month_fee 3088 = 5588 against a limit of 100, so priority 30 is violated too."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Thin Margin", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 100 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/suspend"
              payload: { suspend_reason: "PM_PAYMENT_DELINQUENT" }
              as: ProgramOperator
          trigger:
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
              captures: { conflict_err: "$.data.error_id" }
            - call: "POST /properties/${prop_id}/reactivate"
              payload: {}
              as: ProgramOperator
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
              captures: { fiscal_err: "$.data.error_id" }
          assert:
            - "the first activate returns ERR_PROPERTY_NOT_ACTIVE with HTTP 409 (priority 8 wins)"
            - "the first activate does NOT return ERR_PROPERTY_CREDIT_LIMIT_EXCEEDED and does NOT return HTTP 402"
            - "after the first activate: Subscription.${sub_a_id}.status is still PENDING_SETUP and version is still 1"
            - "after the first activate: no LedgerEntry exists and Property.${prop_id}.outstanding_balance_cents == 0"
            - "the second activate (property now ACTIVE, so only priority 30 is violated) returns ERR_PROPERTY_CREDIT_LIMIT_EXCEEDED with HTTP 402, proving the fiscal rule was genuinely violated in the first call too"
            - "Subscription.${sub_a_id}.status is still PENDING_SETUP after both refusals"

      - name: entitlement_priority_17_beats_coverage_window_priority_18_on_claim_submit
        grounds:
          - validations.priority_17
          - validations.priority_18
          - errors.ERR_BENEFIT_NOT_ENTITLED
          - errors.ERR_OUTSIDE_COVERAGE_WINDOW
