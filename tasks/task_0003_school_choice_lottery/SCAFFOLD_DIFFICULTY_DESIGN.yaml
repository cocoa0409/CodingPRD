  # =============================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_run_lottery_before_lottery_runs_at
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WINDOW_TIMING]
        distinguishing_aspect: |
          Run-lottery against a window in status=OPEN (not CLOSED) at a clock time before lottery_runs_at. BOTH validations would fire: state (4) says window must be CLOSED; business_temporal (5) says clock must be >= lottery_runs_at. Priority 4 wins -> ERR_INVALID_STATE, NOT ERR_WINDOW_TIMING. Error categories: state vs business_temporal.
        test_recipe:
          setup:
            - "Window OPEN. Clock is before lottery_runs_at AND before closes_at. Caller tries POST run-lottery."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/districts"
              payload: { code: "D10", name: "Prio1", poverty_index_pct: 0.00 }
              as: DistrictAdmin
              captures: { d10_id: $.data.id }
            - call: "POST /lottery/windows"
              payload: { district_id: "${d10_id}", cycle_label: "2026-27", opens_at: "2026-01-02T00:00:00Z", closes_at: "2026-02-01T00:00:00Z", lottery_runs_at: "2026-02-02T00:00:00Z" }
              as: DistrictAdmin
              captures: { w9_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /lottery/windows/${w9_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "GET /lottery/windows/${w9_id}"
              payload: {}
              as: DistrictAdmin
              captures: { w9_v: $.data.version }
          trigger:
            - call: "POST /lottery/windows/${w9_id}/run-lottery"
              payload: { expected_window_version: "${w9_v}" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (priority 4 wins over priority 5)"
