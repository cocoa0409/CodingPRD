            - &k_img_comm
              call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_comm_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 425, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 57 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_img_comm_id: $.data.id }
            - &k_plan_comm
              call: "POST /treatment-plans"
              payload: { patient_id: "${k_pt_comm_id}", drug_id: "${k_drug_ref_id}", eye: "OD", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_plan_comm_id: $.data.id }
            - &k_plan_comm_act
              call: "POST /treatment-plans/${k_plan_comm_id}/activate"
              payload: { baseline_imaging_study_id: "${k_img_comm_id}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_plan_comm_v: $.data.version }
          trigger:
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_comm_id}", imaging_study_id: "${k_img_comm_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${k_plan_comm_v}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_pa_missing: $.data.error_id }
            - call: "POST /prior-authorizations"
              payload: { treatment_plan_id: "${k_plan_comm_id}", expected_treatment_plan_version: "${k_plan_comm_v}" }
              as: BillingSpecialist
              captures: { k_pa_c_id: $.data.id }
            - call: "POST /prior-authorizations/${k_pa_c_id}/submit"
              payload: { clinical_justification: "Subfoveal fluid with vision loss" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${k_pa_c_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-1001", approved_injections: 1, effective_date: "2026-08-01T00:00:00Z" }
              as: BillingSpecialist
