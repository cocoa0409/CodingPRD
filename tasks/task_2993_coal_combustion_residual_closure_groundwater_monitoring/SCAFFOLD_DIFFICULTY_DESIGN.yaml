              as: UtilityAdmin
              captures: { agr_over_id: $.data.id }
          trigger:
            - call: "POST /ccr/reuse-agreements/${agr_at_id}/qualify"
              payload: { qualified_on: "2026-08-01" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/reuse-agreements/${agr_over_id}/qualify"
