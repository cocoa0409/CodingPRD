  - { method: GET, path: "/noise-program/operator-notifications", description: "List notifications with filters", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?", "operator_id?", "complaint_id?", "noise_event_id?", "status?"], output: "OperatorNotification[]", side_effects: [] }
  - { method: GET, path: "/noise-program/operator-notifications/{notificationId}", description: "Get a notification (OperatorRep: own operator only)", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember, OperatorRep], code: 200, input: [], output: OperatorNotification, side_effects: [] }
