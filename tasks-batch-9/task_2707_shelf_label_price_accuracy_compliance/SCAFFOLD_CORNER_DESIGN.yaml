      - name: corner_terminal_states_refuse_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.InspectionFinding.terminal_states
          - state_machines.AccountabilityAction.terminal_states
          - state_machines.RefundClaim.terminal_states
          - errors.ERR_FINDING_INVALID_STATE
          - errors.ERR_ACTION_INVALID_STATE
          - errors.ERR_REFUND_CLAIM_INVALID_STATE
        distinguishing_aspect: "WAIVED, VOIDED and DENIED are terminal: a waived finding cannot be pulled back into REMEDIATION_PLANNED, a voided action cannot transition again, and a denied claim cannot be approved — each refusal carries the owning entity's own INVALID_STATE code, and none of the three resources changes."
        test_recipe:
          setup:
            - "A CLOSED FAIL audit with one OVERCHARGE scan line; an inspection with two issued findings, one of which is WAIVED; a COACHING action on la1 that is then VOIDED; a refund claim that is then DENIED."
