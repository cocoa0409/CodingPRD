          - "§1.6 ERR_OUTAGE_NOT_IN_REPAIR (409) and ERR_OUTAGE_NOT_RESTORED (409)"
        distinguishing_aspect: "Each of the three outage actions has its own precondition set and its own error: from RESTORED, start-repair is ERR_OUTAGE_NOT_REPAIRABLE, restore is ERR_OUTAGE_NOT_IN_REPAIR, and from OPEN close is ERR_OUTAGE_NOT_RESTORED — so the errors distinguish which precondition failed rather than collapsing into one generic conflict."
