              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower1_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_a: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower2_id}", spectrum_license_id: "${license_id}", azimuth_deg: 100.0, beamwidth_deg: 65.0, channel_center_mhz: 3620.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_b: $.data.id }
          trigger:
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower1_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /outage-events"
              payload: { tower_id: "${tower1_id}", cause: "POWER", started_at: "2026-08-05T00:00:00Z" }
              as: NetworkEngineer
              captures: { outage_id: $.data.id }
            - call: "POST /interference-coordinations"
              payload: { requesting_sector_id: "${sector_a}", neighbor_sector_id: "${sector_b}", proposed_channel_center_mhz: 3565.0, proposed_channel_width_mhz: 10.0, proposed_eirp_dbm: 44.0, guard_band_mhz: 2.0, effective_from: "2026-08-05T00:00:00Z" }
              as: NetworkEngineer
              captures: { coord_id: $.data.id }
          assert:
            - "All three triggers return 201"
            - "BackhaulCircuit.state == \"ORDERED\", measured_mbps is null, accepted_at is null, degraded_since is null"
            - "OutageEvent.status == \"OPEN\", ended_at is null, duration_minutes is null, sla_excluded is null, planned_notice_days is null, total_credited_cents == 0"
            - "InterferenceCoordination.status == \"REQUESTED\" and round_number == 1"

      - name: cancelled_circuit_is_terminal_and_further_state_changes_are_refused_with_409
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BackhaulCircuit.terminal_states
          - state_machines.BackhaulCircuit.ORDERED_to_CANCELLED
          - errors[ERR_INVALID_CIRCUIT_STATE]
        distinguishing_aspect: |
          CANCELLED is the circuit machine's only terminal state, so neither INSTALLED nor a repeat
          CANCELLED is accepted afterwards: both return 409 ERR_INVALID_CIRCUIT_STATE and the row
          stays at the version it reached when it was cancelled.
        test_recipe:
          setup:
            - "One Tower RB-TWR-001 and one BackhaulCircuit taken ORDERED -> CANCELLED."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "CANCELLED", note: "carrier could not deliver" }
              as: NetworkEngineer
              captures: { circuit_v2: $.data.version }
          trigger:
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
              captures: { err_term_1: $.data.error_id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "CANCELLED" }
              as: NetworkEngineer
              captures: { err_term_2: $.data.error_id }
            - call: "GET /backhaul-circuits/${circuit_id}"
              payload: {}
              as: NetworkEngineer
          assert:
            - "Both trigger state changes return HTTP 409 with ${err_term_1} == \"ERR_INVALID_CIRCUIT_STATE\" and ${err_term_2} == \"ERR_INVALID_CIRCUIT_STATE\""
            - "GET: BackhaulCircuit.state == \"CANCELLED\" and version == ${circuit_v2} == 2"

