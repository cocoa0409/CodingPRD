      - name: calc_warranty_freight_is_waived_at_a_parts_subtotal_of_exactly_fifty_thousand
        claim_type: Constants Applied
        grounds:
          - calculations.warranty_reimbursement.constants.FREIGHT_WAIVER_CENTS
          - calculations.warranty_reimbursement.constants.PARTS_MARKUP_PCT
