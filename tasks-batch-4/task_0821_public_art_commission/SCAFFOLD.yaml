scenario: "Public Art & Percent-for-Art Commission: capital-project percent budget, artist call (RFQ/RFP), selection panel & scoring, contract & fabrication milestone, installation & site, conservation/maintenance registry, deaccession, loan/donation"
domain_name: "public-art-commission"
api_prefix: ""

complexity_profile:
  primary_archetype: "Multi-party negotiation"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  # Tree spine CapitalProject -> Commission -> ArtistCall -> Submission, plus
  # flat cross-cutting entities (Site, Artist, Panelist, Contract, Milestone,
  # Artwork, Loan, ConservationRecord) linked by explicit foreign keys.

  state_machine_shape: compound
  # Contract/Commission/Artwork auto-transition off child/sibling state; the
  # Submission machine is cyclic (revision loop) and the Artwork machine carries
  # two parallel state dimensions (location_status x condition_status).

  relationship_patterns:
    - one_to_many        # Project has many Commissions; Contract has many Milestones
    - many_to_many       # Panelist x Submission via Score
    - cross_aggregate    # Artwork references Contract AND Site across aggregates

  role_model: peer_roles
  # ProgramAdmin owns the commissioning/fiscal surface; Registrar owns the
  # physical registry/site surface; Artist and Panelist are entity-backed actors
  # whose ownership is checked against X-User-ID. Segregation appears as the
  # conflict-of-interest recusal rule on scoring.

  consistency_model: immediate

# ===========================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ===========================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: CapitalProject
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable capital project name"
      - name: construction_budget_cents
        type: integer
        source: input
        description: "Estimated construction budget in integer cents; basis for the PROVISIONAL art budget"
        constraints: "> 0"
      - name: certified_construction_budget_cents
        type: integer
        source: input
        description: "Certified (final) construction budget in integer cents; supplied at certify; basis for the FINAL art budget"
        default: null
        constraints: "> 0 when present"
      - name: percent_rate
        type: number
        source: input
        description: "Percent-for-art rate applied to the construction budget"
        default: 0.01
        constraints: "MIN_PERCENT_RATE <= rate <= MAX_PERCENT_RATE"
      - name: art_budget_cents
        type: integer
        source: computed
        description: "Spendable art budget: PROVISIONAL variant (construction_budget_cents * percent_rate) while DRAFT, FINAL variant (certified_construction_budget_cents * percent_rate) once BUDGET_CERTIFIED; see calc art_budget_computation"
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of allocation_cents over child Commissions whose status != CANCELLED; see calc budget_ledger"
      - name: uncommitted_cents
        type: integer
        source: computed
        description: "art_budget_cents - committed_cents; conserved-quantity anchor for the budget invariant"
      - name: status
        type: enum
        source: system
        description: "Project lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, BUDGET_CERTIFIED}"

  - name: Commission
    parent: CapitalProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> CapitalProject.id; the funding project"
      - name: title
        type: string
        source: input
        description: "Commission title"
      - name: allocation_cents
        type: integer
        source: input
        description: "Portion of the project art budget reserved for this commission, integer cents"
        constraints: "> 0"
      - name: awarded_submission_id
        type: string
        source: computed
        description: "Denormalized pointer holding the awarded Submission's id (Submission.id); set on award, null before award"
        default: null
      - name: status
        type: enum
        source: system
        description: "Commission lifecycle"
        default: OPEN
        constraints: "one of {OPEN, AWARDED, CONTRACTED, FULFILLED, CANCELLED}"

  - name: ArtistCall
    parent: Commission
    common_fields: true
    fields:
      - name: commission_id
        type: string
        source: input
        description: "FK -> Commission.id; the commission this call solicits for"
      - name: call_type
        type: enum
        source: input
        description: "Procurement instrument"
        constraints: "one of {RFQ, RFP}"
      - name: submission_deadline
        type: datetime
        source: input
        description: "ISO8601 UTC instant; submissions accepted strictly BEFORE this instant (exclusive)"
      - name: quorum_min
        type: integer
        source: input
        description: "Minimum number of non-recused panelists that must have scored every submission before tabulation"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Call lifecycle"
        default: OPEN
        constraints: "one of {OPEN, CLOSED, TABULATED, CANCELLED}"

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Artist display name"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: region
        type: string
        source: input
        description: "Artist home region code"
        default: null

  - name: Submission
    parent: ArtistCall
    common_fields: true
    fields:
      - name: call_id
        type: string
        source: input
        description: "FK -> ArtistCall.id; the call this submission answers"
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the submitting artist (must equal X-User-ID for Artist role)"
      - name: proposed_budget_cents
        type: integer
        source: input
        description: "Artist-proposed fabrication budget in integer cents"
        constraints: "> 0"
      - name: composite_score
        type: number
        source: computed
        description: "Panel composite score set at tabulation; 0 when disqualified; see calc submission_composite_score"
        default: null
      - name: status
        type: enum
        source: system
        description: "Submission lifecycle (cyclic revision loop)"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, REVISION_REQUESTED, SCORED, DISQUALIFIED, AWARDED, REJECTED, WITHDRAWN}"

  - name: Panelist
    parent: ArtistCall
    common_fields: true
    fields:
      - name: call_id
        type: string
        source: input
        description: "FK -> ArtistCall.id; the call this panelist evaluates"
      - name: evaluator_name
        type: string
        source: input
        description: "Panelist name"
      - name: has_conflict
        type: boolean
        source: input
        description: "Declared conflict of interest; conflicted panelists are recused and their scores are excluded"
        default: false
      - name: recused
        type: boolean
        source: computed
        description: "True iff has_conflict is true at creation; recused panelists cannot score and do not count toward quorum"
        default: false

  - name: Score
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the scored submission"
      - name: panelist_id
        type: string
        source: input
        description: "FK -> Panelist.id; the scoring panelist (must equal X-User-ID for Panelist role)"
      - name: artistic_merit
        type: integer
        source: input
        description: "Criterion score 0-100"
        constraints: "0 <= v <= 100"
      - name: feasibility
        type: integer
        source: input
        description: "Criterion score 0-100"
        constraints: "0 <= v <= 100"
      - name: community_impact
        type: integer
        source: input
        description: "Criterion score 0-100"
        constraints: "0 <= v <= 100"
      - name: durability
        type: integer
        source: input
        description: "Criterion score 0-100; feeds the durability floor gate"
        constraints: "0 <= v <= 100"
      - name: weighted_value
        type: number
        source: computed
        description: "W_ART*artistic_merit + W_FEAS*feasibility + W_COMM*community_impact + W_DUR*durability; see calc submission_composite_score"

  - name: Contract
    parent: Commission
    common_fields: true
    fields:
      - name: commission_id
        type: string
        source: input
        description: "FK -> Commission.id; the awarded commission"
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the awarded submission (must equal commission.awarded_submission_id)"
      - name: contract_amount_cents
        type: integer
        source: input
        description: "Fabrication contract value in integer cents; must not exceed the commission allocation"
        constraints: "> 0"
      - name: paid_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over child Milestones whose status == PAID; see calc contract_payment_ledger"
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: "contract_amount_cents - paid_cents; conserved-quantity anchor for the payment ledger"
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, COMPLETED}"

  - name: Milestone
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the parent fabrication contract"
      - name: sequence
        type: integer
        source: input
        description: "1-based ordinal; milestones are allocated in ascending sequence and the highest sequence absorbs the rounding remainder"
        constraints: ">= 1, unique within contract"
      - name: title
        type: string
        source: input
        description: "Milestone label"
      - name: pct
        type: number
        source: input
        description: "Fraction of contract_amount_cents for this milestone; the pct values across a contract must sum to 1.0"
        constraints: "0 < pct <= 1"
      - name: amount_cents
        type: integer
        source: computed
        description: "Milestone payment in integer cents; round_half_up(contract_amount_cents*pct) for non-final, remainder for the highest-sequence milestone; see calc milestone_allocation"
      - name: status
        type: enum
        source: system
        description: "Milestone lifecycle"
        default: PENDING
        constraints: "one of {PENDING, SUBMITTED, PAID}"

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Site name"
      - name: address
        type: string
        source: input
        description: "Civic address / location descriptor"
      - name: capacity
        type: integer
        source: input
        description: "Number of artworks the site can host at once"
        default: 1
        constraints: "== 1 (single-occupancy sites in this system)"
      - name: current_artwork_id
        type: string
        source: computed
        description: "Denormalized pointer holding the currently installed Artwork's id (Artwork.id), or null when AVAILABLE"
        default: null
      - name: status
        type: enum
        source: system
        description: "Site occupancy"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, OCCUPIED}"

  - name: Artwork
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Artwork title"
      - name: acquisition_type
        type: enum
        source: input
        description: "How the artwork entered the collection"
        constraints: "one of {COMMISSION, DONATION, LOAN}"
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the fabrication contract for COMMISSION artworks; null for DONATION/LOAN"
        default: null
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the installation site, set on install; null while not installed"
        default: null
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Appraised value in integer cents"
        default: null
      - name: install_date
        type: datetime
        source: input
        description: "ISO8601 UTC install instant; occupancy interval start on the site"
        default: null
      - name: location_status
        type: enum
        source: system
        description: "Location dimension (parallel to condition_status)"
        default: FABRICATION
        constraints: "one of {FABRICATION, FABRICATED, INSTALLED, DEACCESSIONED}"
      - name: condition_status
        type: enum
        source: system
        description: "Condition dimension (parallel to location_status); driven by conservation records"
        default: GOOD
        constraints: "one of {GOOD, FAIR, POOR, NEEDS_TREATMENT}"
      - name: deaccession_method
        type: enum
        source: system
        description: "Set at deaccession"
        default: null
        constraints: "one of {SALE, DONATION, DESTRUCTION, TRANSFER} when present"
      - name: deaccession_proceeds_cents
        type: integer
        source: system
        description: "Proceeds recorded at deaccession, integer cents"
        default: null

  - name: ConservationRecord
    parent: Artwork
    common_fields: false
    fields:
      - name: artwork_id
        type: string
        source: input
        description: "FK -> Artwork.id; the artwork inspected/treated"
      - name: record_type
        type: enum
        source: input
        description: "Conservation event kind"
        constraints: "one of {INSPECTION, TREATMENT, DAMAGE}"
      - name: condition_after
        type: enum
        source: input
        description: "Condition assigned to the artwork after this event; writes Artwork.condition_status"
        constraints: "one of {GOOD, FAIR, POOR, NEEDS_TREATMENT}"
      - name: notes
        type: string
        source: input
        description: "Free-text notes"
        default: null
      - name: performed_at
        type: datetime
        source: input
        description: "ISO8601 UTC instant the event occurred; defaults to the logical clock"
        default: null

  - name: Loan
    parent: Artwork
    common_fields: true
    fields:
      - name: artwork_id
        type: string
        source: input
        description: "FK -> Artwork.id; the loaned artwork"
      - name: borrower_name
        type: string
        source: input
        description: "Borrowing institution name"
      - name: loan_start
        type: datetime
        source: input
        description: "ISO8601 UTC loan interval start (inclusive)"
      - name: loan_end
        type: datetime
        source: input
        description: "ISO8601 UTC loan interval end (inclusive); must be after loan_start"
      - name: status
        type: enum
        source: system
        description: "Loan lifecycle"
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, RETURNED}"

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: CapitalProject
    initial_state: DRAFT
    terminal_states: [BUDGET_CERTIFIED]
    transitions:
      - from: DRAFT
        to: BUDGET_CERTIFIED
        trigger: "POST /projects/{id}/certify"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT"
          - "certified_construction_budget_cents present and > 0"
        side_effects:
          - "set certified_construction_budget_cents from input"
          - "recompute art_budget_cents using the FINAL variant (certified_construction_budget_cents * percent_rate); see calc art_budget_computation"
          - "recompute uncommitted_cents = art_budget_cents - committed_cents"
        note: "Provisional art budget (from construction_budget_cents) is replaced by the final art budget here."

  - entity: Commission
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: AWARDED
        trigger: "POST /commissions/{id}/award"
        actor: ProgramAdmin
        preconditions:
          - "commission.status == OPEN"
          - "the linked ArtistCall (ArtistCall.commission_id == commission.id) is in status TABULATED (cross-entity dependency)"
          - "the referenced submission.call_id equals that call's id"
          - "submission.status == SCORED"
          - "submission.composite_score > 0"
        side_effects:
          - "referenced Submission SCORED -> AWARDED"
          - "every sibling Submission on the same call in status SCORED -> REJECTED (fan-out, not part of a cascade chain)"
          - "set commission.awarded_submission_id = submission.id"
      - from: AWARDED
        to: CONTRACTED
        trigger: "POST /commissions/{id}/contracts"
        actor: ProgramAdmin
        preconditions:
          - "commission.status == AWARDED"
          - "submission_id == commission.awarded_submission_id"
          - "contract_amount_cents <= commission.allocation_cents (fiscal)"
        side_effects:
          - "create Contract in status DRAFT with paid_cents=0, remaining_cents=contract_amount_cents"
      - from: CONTRACTED
        to: FULFILLED
        trigger: "system: cascade from linked Artwork reaching FABRICATED (see Milestone approve cascade)"
        actor: system
        preconditions:
          - "the Artwork whose contract_id == this commission's Contract.id has location_status == FABRICATED"
        side_effects:
          - "no further mutation; terminal"
        note: "Cascade1 tail: Milestone PAID -> Contract COMPLETED -> Artwork FABRICATED -> Commission FULFILLED."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /commissions/{id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "commission.status in {OPEN, AWARDED}"
        side_effects:
          - "release budget: commission excluded from committed_cents so project.committed_cents decreases by allocation_cents and project.uncommitted_cents increases by the same (budget invariant compensation)"
          - "cascade2 link 1: the linked ArtistCall (commission_id == commission.id), if in status {OPEN, CLOSED}, transitions to CANCELLED"
      - from: AWARDED
        to: CANCELLED
        trigger: "POST /commissions/{id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "commission.status in {OPEN, AWARDED}"
        side_effects:
          - "release budget: project.committed_cents -= allocation_cents; project.uncommitted_cents += allocation_cents"
          - "cascade2 link 1: the linked ArtistCall, if in status {OPEN, CLOSED}, transitions to CANCELLED"

  - entity: ArtistCall
    initial_state: OPEN
    terminal_states: [TABULATED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /calls/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "status == OPEN"
        side_effects:
          - "no further submissions accepted (submission create now rejected by state)"
      - from: CLOSED
        to: TABULATED
        trigger: "POST /calls/{id}/tabulate"
        actor: ProgramAdmin
        preconditions:
          - "status == CLOSED"
          - "count of non-recused Panelists on this call who have scored EVERY non-withdrawn Submission on the call >= quorum_min (boundary: >=)"
        side_effects:
          - "for each non-withdrawn Submission: compute composite_score (calc submission_composite_score) and transition SUBMITTED -> SCORED, or SUBMITTED -> DISQUALIFIED when the durability gate fails (composite_score set to 0)"
      - from: OPEN
        to: CANCELLED
        trigger: "system: cascade from Commission cancel"
        actor: system
        preconditions:
          - "parent commission transitioned to CANCELLED"
        side_effects:
          - "cascade2 link 2: every non-terminal Submission on this call (status in {SUBMITTED, REVISION_REQUESTED, SCORED}) transitions to WITHDRAWN"
      - from: CLOSED
        to: CANCELLED
        trigger: "system: cascade from Commission cancel"
        actor: system
        preconditions:
          - "parent commission transitioned to CANCELLED"
        side_effects:
          - "cascade2 link 2: every non-terminal Submission on this call transitions to WITHDRAWN"

  - entity: Submission
    initial_state: SUBMITTED
    terminal_states: [AWARDED, REJECTED, WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /submissions/{id}/request-revision"
        actor: ProgramAdmin
        preconditions:
          - "submission.status == SUBMITTED"
          - "the linked ArtistCall.status == OPEN"
        side_effects:
          - "any existing Score rows for this submission are discarded (revision invalidates prior scoring)"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /submissions/{id}/resubmit"
        actor: Artist
        preconditions:
          - "submission.status == REVISION_REQUESTED"
          - "the linked ArtistCall.status == OPEN"
          - "logical clock < ArtistCall.submission_deadline (exclusive)"
          - "X-User-ID == submission.artist_id (ownership)"
        side_effects:
          - "submission re-enters the scoring pool"
        note: "Cycle: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED (revision loop)."
      - from: SUBMITTED
        to: SCORED
        trigger: "system: call tabulation"
        actor: system
        preconditions:
          - "parent call tabulated AND durability gate passed"
        side_effects:
          - "set composite_score (calc submission_composite_score)"
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "system: call tabulation, durability gate failed"
        actor: system
        preconditions:
          - "mean durability across counted scores < DURABILITY_FLOOR"
        side_effects:
          - "set composite_score = 0"
      - from: SCORED
        to: AWARDED
        trigger: "system: commission award"
        actor: system
        preconditions:
          - "referenced by a commission award"
        side_effects: []
      - from: SCORED
        to: REJECTED
        trigger: "system: sibling awarded"
        actor: system
        preconditions:
          - "a sibling submission on the same call was awarded"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system: cascade2 from call cancel"
        actor: system
        preconditions:
          - "parent call transitioned to CANCELLED"
        side_effects: []
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "system: cascade2 from call cancel"
        actor: system
        preconditions:
          - "parent call transitioned to CANCELLED"
        side_effects: []
      - from: SCORED
        to: WITHDRAWN
        trigger: "system: cascade2 from call cancel"
        actor: system
        preconditions:
          - "parent call transitioned to CANCELLED"
        side_effects: []

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "contract.status == DRAFT"
          - "the funding CapitalProject.status == BUDGET_CERTIFIED (cross-entity dependency)"
          - "the sum of child Milestone.pct == 1.0 (milestones already scheduled)"
        side_effects:
          - "create Artwork with acquisition_type=COMMISSION, contract_id=contract.id, location_status=FABRICATION, condition_status=GOOD"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: cascade1 when paid_cents reaches contract_amount_cents"
        actor: system
        preconditions:
          - "paid_cents == contract_amount_cents after a milestone is PAID"
        side_effects:
          - "cascade1 link 2: the linked Artwork (contract_id == contract.id) transitions location_status FABRICATION -> FABRICATED"

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /milestones/{id}/submit"
        actor: Artist
        preconditions:
          - "milestone.status == PENDING"
          - "parent Contract.status == ACTIVE"
          - "X-User-ID == the awarded Artist (Contract.submission_id -> Submission.artist_id) (ownership)"
        side_effects:
          - "deliverable marked submitted"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /milestones/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "milestone.status == SUBMITTED"
          - "parent Contract.status == ACTIVE"
        side_effects:
          - "cascade1 link 1: Contract.paid_cents += milestone.amount_cents; Contract.remaining_cents -= milestone.amount_cents (calc contract_payment_ledger)"
          - "cascade1 link 2 (conditional): if Contract.paid_cents == Contract.contract_amount_cents, Contract ACTIVE -> COMPLETED, which transitions the linked Artwork FABRICATION -> FABRICATED, which transitions the parent Commission CONTRACTED -> FULFILLED"

  - entity: Site
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system: artwork install"
        actor: system
        preconditions:
          - "an Artwork install targets this site"
        side_effects:
          - "set current_artwork_id = artwork.id"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system: artwork deaccession"
        actor: system
        preconditions:
          - "the installed Artwork is deaccessioned"
        side_effects:
          - "set current_artwork_id = null (site-occupancy invariant compensation)"
        note: "Cyclic AVAILABLE <-> OCCUPIED."

  - entity: Artwork
    initial_state: FABRICATION
    terminal_states: [DEACCESSIONED]
    transitions:
      - from: FABRICATION
        to: FABRICATED
        trigger: "system: cascade1 from Contract COMPLETED"
        actor: system
        preconditions:
          - "parent Contract transitioned to COMPLETED"
        side_effects:
          - "cascade1 link 3: the parent Commission (via Contract.commission_id) transitions CONTRACTED -> FULFILLED"
      - from: FABRICATED
        to: INSTALLED
        trigger: "POST /artworks/{id}/install"
        actor: Registrar
        preconditions:
          - "artwork.location_status == FABRICATED"
          - "target Site.status == AVAILABLE (cross-entity dependency)"
          - "no installed artwork occupies the target site over an interval containing install_date (site interval semantics: half-open [install_date, +inf), adjacency allowed)"
        side_effects:
          - "set artwork.site_id and artwork.install_date; target Site AVAILABLE -> OCCUPIED with current_artwork_id = artwork.id"
      - from: INSTALLED
        to: DEACCESSIONED
        trigger: "POST /artworks/{id}/deaccession"
        actor: Registrar
        preconditions:
          - "artwork.location_status in {FABRICATED, INSTALLED}"
          - "no Loan on this artwork is in status APPROVED"
        side_effects:
          - "set deaccession_method, deaccession_proceeds_cents"
          - "free the site: Site OCCUPIED -> AVAILABLE, current_artwork_id = null (site-occupancy invariant compensation)"
      - from: FABRICATED
        to: DEACCESSIONED
        trigger: "POST /artworks/{id}/deaccession"
        actor: Registrar
        preconditions:
          - "artwork.location_status in {FABRICATED, INSTALLED}"
          - "no Loan on this artwork is in status APPROVED"
        side_effects:
          - "set deaccession_method, deaccession_proceeds_cents (no site to free)"
      - from: GOOD
        to: NEEDS_TREATMENT
        trigger: "POST /artworks/{id}/conservation-records (condition dimension, parallel to location)"
        actor: Registrar
        preconditions:
          - "artwork.location_status != DEACCESSIONED"
        side_effects:
          - "set condition_status = condition_after; append ConservationRecord"
        note: "condition_status evolves independently of location_status across {GOOD, FAIR, POOR, NEEDS_TREATMENT} via conservation records; this row is representative of that parallel dimension."

  - entity: Loan
    initial_state: REQUESTED
    terminal_states: [RETURNED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /loans/{id}/approve"
        actor: Registrar
        preconditions:
          - "loan.status == REQUESTED"
          - "the Artwork.location_status != DEACCESSIONED"
        side_effects:
          - "loan becomes active for interval-conflict checks"
      - from: APPROVED
        to: RETURNED
        trigger: "POST /loans/{id}/return"
        actor: Registrar
        preconditions:
          - "loan.status == APPROVED"
        side_effects:
          - "loan interval closes; artwork becomes loanable again"

# ===========================================================================
# 1.2.1 Concurrency Rules (OCC on parent version)
# ===========================================================================
concurrency_rules:
  - rule_id: commission-create-stale-project
    parent_entity: CapitalProject
    write_endpoint: "POST /projects/{id}/commissions"
    occ_field: "expected_project_version"
    description: |
      Creating a Commission against a CapitalProject whose version has advanced
      since the client last observed it is rejected. Another writer has already
      created a Commission that consumed part of the art budget (advancing
      project.version and committed_cents); the current writer's view of the
      remaining budget is therefore stale, so the create is refused on a
      stale-version basis rather than silently over-committing the budget.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: milestone-schedule-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/milestone-schedule"
    occ_field: "expected_contract_version"
    description: |
      Scheduling the milestone set on a Contract whose version has advanced
      since the client last observed it is rejected. Another writer has already
      scheduled a milestone set (advancing contract.version); the current
      writer's view of the contract is stale, so the schedule is refused on a
      stale-version basis.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: art_budget_computation
    trigger: "on CapitalProject create (provisional) and on POST /projects/{id}/certify (final)"
    algorithm: threshold
    formula: |
      # Dual-variant on CapitalProject:
      PROVISIONAL (status == DRAFT):
        art_budget_cents = round_half_up(construction_budget_cents * percent_rate)
      FINAL (status == BUDGET_CERTIFIED):
        art_budget_cents = round_half_up(certified_construction_budget_cents * percent_rate)
      # rounding is on the single cents product; round_half_up to an integer.
    input_set: "the single CapitalProject; percent_rate from the project"
    constants:
      DEFAULT_PERCENT_RATE: 0.01
      MIN_PERCENT_RATE: 0.005
      MAX_PERCENT_RATE: 0.05
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "project.status == DRAFT (before budget certification)"
        difference: "uses the estimated construction_budget_cents"
      - name: final
        when: "project.status == BUDGET_CERTIFIED (after certification)"
        difference: "uses the certified_construction_budget_cents; typically diverges from provisional"

  - name: budget_ledger
    trigger: "on Commission create, on Commission cancel, and read on GET /projects/{id}"
    algorithm: aggregation
    formula: |
      committed_cents = sum(c.allocation_cents for c in Commissions
                            where c.project_id == project.id
                              and c.status != CANCELLED)
      uncommitted_cents = art_budget_cents - committed_cents
      # Budget invariant (conserved quantity = art_budget_cents):
      #   art_budget_cents == uncommitted_cents + committed_cents  (always)
    input_set: "child Commissions of the project, excluding status == CANCELLED"
    constants: {}
    precision: "integer cents, exact"

  - name: submission_composite_score
    trigger: "on POST /calls/{id}/tabulate (per non-withdrawn Submission)"
    algorithm: weighted_scoring
    formula: |
      # Per-score weighted value (>= 3 inputs, non-linear via the durability gate):
      weighted_value(s) = W_ART*s.artistic_merit + W_FEAS*s.feasibility
                        + W_COMM*s.community_impact + W_DUR*s.durability
      counted = [Score by non-recused Panelists for this submission]   # order by created_at ASC for trim ties
      dur_mean = mean(s.durability for s in counted)
      IF dur_mean < DURABILITY_FLOOR:
          composite_score = 0            # -> submission DISQUALIFIED (gate branch)
      ELIF len(counted) >= TRIM_MIN:
          # TRIMMED variant: drop exactly one highest and one lowest weighted_value
          # (on a weighted_value tie, drop the earliest created_at)
          trimmed = counted minus one max weighted_value minus one min weighted_value
          composite_score = round_half_up(mean(weighted_value(s) for s in trimmed), 2)
      ELSE:
          # MEAN variant
          composite_score = round_half_up(mean(weighted_value(s) for s in counted), 2)
    input_set: "Score rows for the submission authored by non-recused Panelists; recused panelists excluded"
    constants:
      W_ART: 0.40
      W_FEAS: 0.25
      W_COMM: 0.20
      W_DUR: 0.15
      DURABILITY_FLOOR: 40
      TRIM_MIN: 3
    precision: "2 decimal places, round_half_up"
    variants:
      - name: mean
        when: "fewer than TRIM_MIN counted scores"
        difference: "simple mean of all counted weighted_values"
      - name: trimmed
        when: "at least TRIM_MIN counted scores"
        difference: "drops one highest and one lowest weighted_value before averaging; diverges from mean whenever the extremes are asymmetric"

  - name: milestone_allocation
    trigger: "on POST /contracts/{id}/milestone-schedule"
    algorithm: waterfall_allocation
    formula: |
      # Rounding order is pinned: process milestones in ascending `sequence`.
      # All but the highest-sequence milestone are rounded independently;
      # the highest-sequence milestone absorbs the remainder so the set sums
      # EXACTLY to contract_amount_cents ("round-per-line then remainder",
      # NOT "sum then round").
      ordered = milestones sorted by sequence ASC
      running = 0
      for m in ordered[:-1]:
          m.amount_cents = round_half_up(contract_amount_cents * m.pct)
          running += m.amount_cents
      ordered[-1].amount_cents = contract_amount_cents - running
    input_set: "the milestone set supplied in one schedule call; contract_amount_cents from the parent contract"
    constants: {}
    precision: "integer cents, round_half_up per non-final line; final line is exact remainder"

  - name: contract_payment_ledger
    trigger: "on POST /milestones/{id}/approve (milestone -> PAID)"
    algorithm: aggregation
    formula: |
      paid_cents = sum(m.amount_cents for m in Milestones
                       where m.contract_id == contract.id and m.status == PAID)
      remaining_cents = contract_amount_cents - paid_cents
      # Payment invariant (conserved quantity = contract_amount_cents):
      #   paid_cents + remaining_cents == contract_amount_cents  (always)
    input_set: "child Milestones of the contract in status PAID"
    constants: {}
    precision: "integer cents, exact"

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "the acting role is permitted for this operation per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 25
    category: auth
    check: "for entity-backed roles acting on an owned resource, X-User-ID equals the resource's owning FK (Submission.artist_id, Score.panelist_id, awarded artist for milestone submit)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /submissions/{id}/resubmit, POST /submissions/{id}/scores, POST /milestones/{id}/submit"
  - priority: 30
    category: existence
    check: "every resource referenced in the path or body exists (validated left-to-right in path)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body ids"
  - priority: 40
    category: state
    check: "the target resource is in a state that permits this transition (state-machine from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 50
    category: business_safety
    check: "a Panelist scoring a submission is not recused (has_conflict == false)"
    error_id: ERR_PANELIST_CONFLICT
    http_status: 422
    applies_to: "POST /submissions/{id}/scores"
  - priority: 52
    category: business_safety
    check: "an artwork with an APPROVED loan cannot be deaccessioned"
    error_id: ERR_DEACCESSION_BLOCKED_BY_LOAN
    http_status: 409
    applies_to: "POST /artworks/{id}/deaccession"
  - priority: 55
    category: business_constraint
    check: "at tabulation, the count of non-recused panelists who scored every submission is >= quorum_min"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /calls/{id}/tabulate"
  - priority: 60
    category: business_referential
    check: "an artist has at most one non-withdrawn submission per call (uniqueness on (call_id, artist_id))"
    error_id: ERR_DUPLICATE_SUBMISSION
    http_status: 409
    applies_to: "POST /calls/{id}/submissions"
  - priority: 62
    category: business_referential
    check: "a Panelist has at most one Score per Submission"
    error_id: ERR_DUPLICATE_SCORE
    http_status: 409
    applies_to: "POST /submissions/{id}/scores"
  - priority: 64
    category: business_referential
    check: "at award, submission.call_id belongs to a call whose commission_id == commission.id"
    error_id: ERR_SUBMISSION_CALL_MISMATCH
    http_status: 422
    applies_to: "POST /commissions/{id}/award"
  - priority: 70
    category: business_temporal
    check: "submission create/resubmit occurs strictly before ArtistCall.submission_deadline (logical clock < deadline)"
    error_id: ERR_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /calls/{id}/submissions, POST /submissions/{id}/resubmit"
  - priority: 72
    category: business_temporal
    check: "install_date does not fall within the occupancy interval of an artwork already installed on the target site (half-open, adjacency allowed)"
    error_id: ERR_SITE_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /artworks/{id}/install"
  - priority: 74
    category: business_temporal
    check: "a new loan interval [loan_start, loan_end] (closed) neither overlaps nor sits within LOAN_BUFFER_DAYS (= 30) calendar days of any non-returned (status in {REQUESTED, APPROVED}) loan on the same artwork"
    error_id: ERR_LOAN_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /artworks/{id}/loans"
  - priority: 80
    category: business_constraint
    check: "milestone pct values across a contract sum to exactly 1.0"
    error_id: ERR_MILESTONE_PCT_SUM
    http_status: 422
    applies_to: "POST /contracts/{id}/milestone-schedule"
  - priority: 82
    category: business_constraint
    check: "POST /artworks intake accepts only acquisition_type in {DONATION, LOAN} (COMMISSION artworks are created by contract activation)"
    error_id: ERR_DONATION_TYPE_REQUIRED
    http_status: 422
    applies_to: "POST /artworks"
  - priority: 90
    category: business_fiscal
    check: "commission allocation does not push committed_cents above art_budget_cents: committed_cents + allocation_cents <= art_budget_cents (boundary: <=)"
    error_id: ERR_ALLOCATION_EXCEEDS_BUDGET
    http_status: 422
    applies_to: "POST /projects/{id}/commissions"
  - priority: 92
    category: business_fiscal
    check: "contract_amount_cents <= commission.allocation_cents"
    error_id: ERR_CONTRACT_EXCEEDS_ALLOCATION
    http_status: 422
    applies_to: "POST /commissions/{id}/contracts"
  - priority: 95
    category: business_constraint
    check: "required body fields present and well-typed; enum values in range; expected_*_version present where required"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST endpoints with a body"
  - priority: 98
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /projects/{id}/commissions, POST /contracts/{id}/milestone-schedule"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- CapitalProject ----
  - method: POST
    path: "/projects"
    description: "Create a capital project (art budget computed provisionally)"
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "construction_budget_cents", "percent_rate?"]
    output: CapitalProject
    side_effects: ["compute art_budget_cents via PROVISIONAL variant", "committed_cents=0", "uncommitted_cents=art_budget_cents"]
  - method: GET
    path: "/projects/{id}"
    description: "Fetch a capital project"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: CapitalProject
  - method: POST
    path: "/projects/{id}/certify"
    description: "Certify the construction budget; recompute the FINAL art budget"
    roles: [ProgramAdmin]
    code: 200
    input: ["certified_construction_budget_cents"]
    output: CapitalProject
    side_effects: ["set certified_construction_budget_cents", "recompute art_budget_cents via FINAL variant", "status DRAFT -> BUDGET_CERTIFIED", "recompute uncommitted_cents"]

  # ---- Commission ----
  - method: POST
    path: "/projects/{id}/commissions"
    description: "Create a commission funded by the project art budget (OCC on project.version)"
    roles: [ProgramAdmin]
    code: 201
    input: ["title", "allocation_cents", "expected_project_version"]
    output: Commission
    side_effects: ["project.committed_cents += allocation_cents", "project.uncommitted_cents -= allocation_cents", "increments CapitalProject.version by 1"]
  - method: GET
    path: "/commissions/{id}"
    description: "Fetch a commission"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: Commission
  - method: GET
    path: "/commissions"
    description: "List commissions (filter by project_id, status)"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: Commission[]
  - method: POST
    path: "/commissions/{id}/award"
    description: "Award a scored submission; reject siblings"
    roles: [ProgramAdmin]
    code: 200
    input: ["submission_id"]
    output: Commission
    side_effects: ["submission SCORED -> AWARDED", "sibling SCORED submissions -> REJECTED", "set awarded_submission_id", "commission OPEN -> AWARDED"]
  - method: POST
    path: "/commissions/{id}/cancel"
    description: "Cancel a commission; release budget and cascade"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Commission
    side_effects: ["commission -> CANCELLED", "project.committed_cents -= allocation_cents; project.uncommitted_cents += allocation_cents", "cascade: linked ArtistCall {OPEN,CLOSED} -> CANCELLED", "cascade: that call's non-terminal Submissions -> WITHDRAWN"]
  - method: POST
    path: "/commissions/{id}/contracts"
    description: "Create the fabrication contract for the awarded submission"
    roles: [ProgramAdmin]
    code: 201
    input: ["submission_id", "contract_amount_cents"]
    output: Contract
    side_effects: ["create Contract DRAFT (paid_cents=0, remaining_cents=contract_amount_cents)", "commission AWARDED -> CONTRACTED"]

  # ---- Contract ----
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: Contract
  - method: GET
    path: "/contracts"
    description: "List contracts (filter by commission_id, submission_id, status)"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: ["commission_id?", "submission_id?", "status?", "limit?", "offset?"]
    output: Contract[]
  - method: POST
    path: "/contracts/{id}/activate"
    description: "Activate a contract; synthesize the COMMISSION artwork (requires project BUDGET_CERTIFIED and pct sum == 1.0)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["contract DRAFT -> ACTIVE", "create Artwork (acquisition_type=COMMISSION, contract_id, location_status=FABRICATION, condition_status=GOOD)"]
  - method: POST
    path: "/contracts/{id}/milestone-schedule"
    description: "Schedule the milestone set in one call (OCC on contract.version); amounts computed with pinned rounding"
    roles: [ProgramAdmin]
    code: 201
    input: ["milestones", "expected_contract_version"]
    output: Milestone[]
    side_effects: ["create Milestones with amount_cents via calc milestone_allocation", "increments Contract.version by 1"]
  - method: GET
    path: "/contracts/{id}/milestones"
    description: "List a contract's milestones"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: Milestone[]

  # ---- Milestone ----
  - method: POST
    path: "/milestones/{id}/submit"
    description: "Awarded artist submits a milestone deliverable"
    roles: [Artist]
    code: 200
    input: []
    output: Milestone
    side_effects: ["milestone PENDING -> SUBMITTED"]
  - method: POST
    path: "/milestones/{id}/approve"
    description: "Approve and pay a milestone; drives the fabrication cascade"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Milestone
    side_effects: ["milestone SUBMITTED -> PAID", "contract.paid_cents += amount_cents; contract.remaining_cents -= amount_cents", "if paid_cents == contract_amount_cents: contract -> COMPLETED -> artwork FABRICATED -> commission FULFILLED"]

  # ---- ArtistCall ----
  - method: POST
    path: "/commissions/{id}/calls"
    description: "Open an artist call (RFQ/RFP) for a commission"
    roles: [ProgramAdmin]
    code: 201
    input: ["call_type", "submission_deadline", "quorum_min"]
    output: ArtistCall
    side_effects: ["call created OPEN"]
  - method: GET
    path: "/calls/{id}"
    description: "Fetch an artist call"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: ArtistCall
  - method: GET
    path: "/calls"
    description: "List calls (filter by commission_id, status)"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: ["commission_id?", "status?", "limit?", "offset?"]
    output: ArtistCall[]
  - method: POST
    path: "/calls/{id}/close"
    description: "Close a call to new submissions"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ArtistCall
    side_effects: ["call OPEN -> CLOSED"]
  - method: POST
    path: "/calls/{id}/tabulate"
    description: "Tabulate panel scores; set composite scores and SCORED/DISQUALIFIED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ArtistCall
    side_effects: ["call CLOSED -> TABULATED", "per submission: composite_score via calc submission_composite_score; SUBMITTED -> SCORED or DISQUALIFIED"]
  - method: POST
    path: "/calls/{id}/panelists"
    description: "Add a selection-panel member to a call"
    roles: [ProgramAdmin]
    code: 201
    input: ["evaluator_name", "has_conflict?"]
    output: Panelist
    side_effects: ["set recused = has_conflict"]
  - method: GET
    path: "/calls/{id}/panelists"
    description: "List a call's panelists"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: Panelist[]

  # ---- Artist ----
  - method: POST
    path: "/artists"
    description: "Onboard an artist"
    roles: [ProgramAdmin]
    code: 201
    input: ["display_name", "email", "region?"]
    output: Artist
    side_effects: []

  # ---- Submission ----
  - method: POST
    path: "/calls/{id}/submissions"
    description: "Artist submits to an open call before the deadline"
    roles: [Artist]
    code: 201
    input: ["artist_id", "proposed_budget_cents"]
    output: Submission
    side_effects: ["submission created SUBMITTED"]
  - method: GET
    path: "/submissions/{id}"
    description: "Fetch a submission"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: Submission
  - method: GET
    path: "/submissions"
    description: "List submissions (filter by call_id, artist_id, status)"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: ["call_id?", "artist_id?", "status?", "limit?", "offset?"]
    output: Submission[]
  - method: POST
    path: "/submissions/{id}/request-revision"
    description: "Panel requests a revision (invalidates prior scores)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Submission
    side_effects: ["submission SUBMITTED -> REVISION_REQUESTED", "discard existing Score rows"]
  - method: POST
    path: "/submissions/{id}/resubmit"
    description: "Artist resubmits a revised proposal before the deadline"
    roles: [Artist]
    code: 200
    input: []
    output: Submission
    side_effects: ["submission REVISION_REQUESTED -> SUBMITTED"]

  # ---- Score ----
  - method: POST
    path: "/submissions/{id}/scores"
    description: "Panelist scores a submission across four criteria"
    roles: [Panelist]
    code: 201
    input: ["panelist_id", "artistic_merit", "feasibility", "community_impact", "durability"]
    output: Score
    side_effects: ["compute weighted_value"]
  - method: GET
    path: "/scores/{id}"
    description: "Fetch a score"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: Score
  - method: GET
    path: "/scores"
    description: "List scores (filter by submission_id, panelist_id)"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: ["submission_id?", "panelist_id?", "limit?", "offset?"]
    output: Score[]

  # ---- Site ----
  - method: POST
    path: "/sites"
    description: "Register an installation site"
    roles: [Registrar]
    code: 201
    input: ["name", "address", "capacity?"]
    output: Site
    side_effects: ["site created AVAILABLE"]
  - method: GET
    path: "/sites/{id}"
    description: "Fetch an installation site"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: Site

  # ---- Artwork ----
  - method: POST
    path: "/artworks"
    description: "Intake a DONATION or LOAN artwork (COMMISSION artworks come from contract activation)"
    roles: [Registrar]
    code: 201
    input: ["title", "acquisition_type", "appraised_value_cents?", "site_id?"]
    output: Artwork
    side_effects: ["artwork created location_status=FABRICATED, condition_status=GOOD"]
  - method: GET
    path: "/artworks/{id}"
    description: "Fetch an artwork"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: Artwork
  - method: GET
    path: "/artworks"
    description: "List artworks (filter by contract_id, site_id, acquisition_type, location_status)"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: ["contract_id?", "site_id?", "acquisition_type?", "location_status?", "limit?", "offset?"]
    output: Artwork[]
  - method: POST
    path: "/artworks/{id}/install"
    description: "Install a fabricated artwork on an available site"
    roles: [Registrar]
    code: 200
    input: ["site_id", "install_date"]
    output: Artwork
    side_effects: ["artwork FABRICATED -> INSTALLED; set site_id, install_date", "Site AVAILABLE -> OCCUPIED; set current_artwork_id"]
  - method: POST
    path: "/artworks/{id}/deaccession"
    description: "Deaccession an artwork; free its site"
    roles: [ProgramAdmin, Registrar]
    code: 200
    input: ["deaccession_method", "deaccession_proceeds_cents?"]
    output: Artwork
    side_effects: ["artwork -> DEACCESSIONED; set deaccession_method, deaccession_proceeds_cents", "if installed: Site OCCUPIED -> AVAILABLE; current_artwork_id = null"]
  - method: POST
    path: "/artworks/{id}/conservation-records"
    description: "Append a conservation/maintenance record; update condition"
    roles: [Registrar]
    code: 201
    input: ["record_type", "condition_after", "notes?", "performed_at?"]
    output: ConservationRecord
    side_effects: ["set artwork.condition_status = condition_after"]
  - method: GET
    path: "/artworks/{id}/conservation-records"
    description: "List an artwork's conservation records"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: ConservationRecord[]

  # ---- Loan ----
  - method: POST
    path: "/artworks/{id}/loans"
    description: "Request a loan of an artwork for a date interval"
    roles: [Registrar]
    code: 201
    input: ["borrower_name", "loan_start", "loan_end"]
    output: Loan
    side_effects: ["loan created REQUESTED"]
  - method: GET
    path: "/artworks/{id}/loans"
    description: "List an artwork's loans"
    roles: [ProgramAdmin, Registrar, Artist, Panelist]
    code: 200
    input: []
    output: Loan[]
  - method: POST
    path: "/loans/{id}/approve"
    description: "Approve a requested loan"
    roles: [Registrar]
    code: 200
    input: []
    output: Loan
    side_effects: ["loan REQUESTED -> APPROVED"]
  - method: POST
    path: "/loans/{id}/return"
    description: "Return a loaned artwork; close the loan interval"
    roles: [Registrar]
    code: 200
    input: []
    output: Loan
    side_effects: ["loan APPROVED -> RETURNED"]

  # ---- Test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default (never wall-clock)."
    roles: [ProgramAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role is not permitted for this operation"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Entity-backed actor's X-User-ID does not match the owned resource's FK (artist_id / panelist_id / awarded artist)"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "Referenced CapitalProject id does not exist"
  - id: ERR_COMMISSION_NOT_FOUND
    http: 404
    condition: "Referenced Commission id does not exist"
  - id: ERR_CALL_NOT_FOUND
    http: 404
    condition: "Referenced ArtistCall id does not exist"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "Referenced Submission id does not exist"
  - id: ERR_ARTIST_NOT_FOUND
    http: 404
    condition: "Referenced Artist id does not exist"
  - id: ERR_PANELIST_NOT_FOUND
    http: 404
    condition: "Referenced Panelist id does not exist"
  - id: ERR_SCORE_NOT_FOUND
    http: 404
    condition: "Referenced Score id does not exist"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "Referenced Contract id does not exist"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "Referenced Milestone id does not exist"
  - id: ERR_ARTWORK_NOT_FOUND
    http: 404
    condition: "Referenced Artwork id does not exist"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "Referenced Site id does not exist"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "Referenced Loan id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_<parent>_version does not equal current parent.version"
  - id: ERR_PANELIST_CONFLICT
    http: 422
    condition: "A recused (conflicted) panelist attempted to score a submission"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "Tabulation attempted with fewer than quorum_min non-recused panelists having scored every submission"
  - id: ERR_DUPLICATE_SCORE
    http: 409
    condition: "A panelist submitted a second score for the same submission"
  - id: ERR_DUPLICATE_SUBMISSION
    http: 409
    condition: "An artist submitted a second (non-withdrawn) proposal to the same call"
  - id: ERR_SUBMISSION_CALL_MISMATCH
    http: 422
    condition: "Awarded submission does not belong to a call under this commission"
  - id: ERR_DEADLINE_PASSED
    http: 422
    condition: "Submission or resubmission attempted at/after the call submission_deadline"
  - id: ERR_SITE_INTERVAL_CONFLICT
    http: 409
    condition: "Install collides with an artwork already occupying the target site over the interval"
  - id: ERR_LOAN_INTERVAL_CONFLICT
    http: 409
    condition: "Loan interval overlaps or violates the buffer gap against another non-returned loan of the artwork"
  - id: ERR_MILESTONE_PCT_SUM
    http: 422
    condition: "Scheduled milestone pct values do not sum to exactly 1.0"
  - id: ERR_DONATION_TYPE_REQUIRED
    http: 422
    condition: "POST /artworks intake given acquisition_type == COMMISSION"
  - id: ERR_ALLOCATION_EXCEEDS_BUDGET
    http: 422
    condition: "Commission allocation would push committed_cents above art_budget_cents"
  - id: ERR_CONTRACT_EXCEEDS_ALLOCATION
    http: 422
    condition: "contract_amount_cents exceeds the commission allocation_cents"
  - id: ERR_DEACCESSION_BLOCKED_BY_LOAN
    http: 409
    condition: "Deaccession attempted while an APPROVED loan exists on the artwork"
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing/malformed body field, out-of-range enum, or missing required expected_*_version"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: ProgramAdmin
    description: "Public-art program administrator: owns projects, budgets, commissions, calls, tabulation, awards, contracts, milestone approvals."
    identity: "opaque"
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{id}/certify"
      - "POST /projects/{id}/commissions"
      - "POST /commissions/{id}/award"
      - "POST /commissions/{id}/cancel"
      - "POST /commissions/{id}/contracts"
      - "POST /commissions/{id}/calls"
      - "POST /calls/{id}/close"
      - "POST /calls/{id}/tabulate"
      - "POST /calls/{id}/panelists"
      - "POST /artists"
      - "POST /submissions/{id}/request-revision"
      - "POST /contracts/{id}/activate"
      - "POST /contracts/{id}/milestone-schedule"
      - "POST /milestones/{id}/approve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /artworks/{id}/deaccession"
      - "all GET endpoints"
  - name: Registrar
    description: "Collection registrar: owns sites, artwork intake/registry, installation, conservation, loans, deaccession."
    identity: "opaque"
    exclusive_operations:
      - "POST /sites"
      - "POST /artworks"
      - "POST /artworks/{id}/install"
      - "POST /artworks/{id}/conservation-records"
      - "POST /artworks/{id}/loans"
      - "POST /loans/{id}/approve"
      - "POST /loans/{id}/return"
    shared_operations:
      - "POST /artworks/{id}/deaccession"
      - "all GET endpoints"
  - name: Artist
    description: "Artist actor: submits/resubmits proposals and submits fabrication milestone deliverables. X-User-ID is the Artist.id."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /calls/{id}/submissions"
      - "POST /submissions/{id}/resubmit"
      - "POST /milestones/{id}/submit"
    shared_operations:
      - "all GET endpoints"
  - name: Panelist
    description: "Selection-panel member: scores submissions. X-User-ID is the Panelist.id."
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /submissions/{id}/scores"
    shared_operations:
      - "all GET endpoints"
