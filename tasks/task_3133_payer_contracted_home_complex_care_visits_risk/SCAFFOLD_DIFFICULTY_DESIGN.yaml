              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 10, urgent_response_qualified: true }
              as: PlatformAdmin
