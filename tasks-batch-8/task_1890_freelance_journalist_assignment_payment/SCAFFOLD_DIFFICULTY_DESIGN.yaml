scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: kill_fee_tier_divergence_on_assignment
        grounds:
          - calculations.assignment_fee_due
          - state_machines.Assignment.IN_PROGRESS_to_KILLED
          - state_machines.Assignment.UNDER_VERIFICATION_to_KILLED
          - entities.Assignment.fields.kill_fee_tier
        distinguishing_aspect: |
          Entity domain = Assignment fee. For identical assignment data
          (agreed_fee_cents = 90000, on-time), the PRE_DELIVERY kill tier yields
          final_fee_cents == 22500 while the POST_DELIVERY kill tier yields
          final_fee_cents == 45000 — two valid policy interpretations diverging
          purely by which editorial state the kill fired from.
        test_recipe:
          setup:
            - "DeskConfig bootstrapped with defaults (kill_fee_post_delivery_pct_num = 50)"
            - "Two contributors A and B, each with an ACTIVE PER_WORD RateAgreement at 75 cents/word"
            - "Assignment X for A: commissioned 1200 words (agreed 90000), driven to IN_PROGRESS"
            - "Assignment Y for B: commissioned 1200 words (agreed 90000), driven to UNDER_VERIFICATION with both verification reports CLEARED, on-time (clock before deadline)"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Alice Pre", email: "alice@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { contrib_a: $.data.id, contrib_a_v: $.data.version }
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Bob Post", email: "bob@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { contrib_b: $.data.id, contrib_b_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${contrib_a}/rate-agreements"
              payload: { pricing_mode: "PER_WORD", per_word_rate_cents: 75, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${contrib_a_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors/${contrib_b}/rate-agreements"
              payload: { pricing_mode: "PER_WORD", per_word_rate_cents: 75, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${contrib_b_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${contrib_a}", title: "Story X", brief: "b", commissioned_word_count: 1200, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_x: $.data.id }
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${contrib_b}", title: "Story Y", brief: "b", commissioned_word_count: 1200, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_y: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_x}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_x}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_a}"
            - call: "POST /freelance-desk/assignments/${asg_x}/start"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_a}"
            - call: "POST /freelance-desk/assignments/${asg_y}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_y}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_b}"
            - call: "POST /freelance-desk/assignments/${asg_y}/start"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_b}"
            - call: "POST /freelance-desk/assignments/${asg_y}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_b}"
            - call: "GET /freelance-desk/assignments/${asg_y}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_y_plag: "$.data[0].id", rep_y_ai: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_y_plag}/record-result"
              payload: { similarity_score_bps: 500, ai_probability_bps: 0 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/verification-reports/${rep_y_ai}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 1000 }
              as: VerificationEditor
              as_user_id: "ve-1"
          trigger:
            - call: "POST /freelance-desk/assignments/${asg_x}/kill"
              payload: {}
              as: Editor
              captures: { killed_x_fee: $.data.final_fee_cents, killed_x_tier: $.data.kill_fee_tier }
            - call: "POST /freelance-desk/assignments/${asg_y}/kill"
              payload: {}
              as: Editor
              captures: { killed_y_fee: $.data.final_fee_cents, killed_y_tier: $.data.kill_fee_tier }
          assert:
            - "Assignment.${asg_x}.kill_fee_tier == PRE_DELIVERY and Assignment.${asg_x}.final_fee_cents == 22500"
            - "Assignment.${asg_y}.kill_fee_tier == POST_DELIVERY and Assignment.${asg_y}.final_fee_cents == 45000"
            - "killed_x_fee != killed_y_fee despite identical agreed_fee_cents == 90000"

      - name: withholding_branch_divergence_on_invoice
        grounds:
          - calculations.withholding_computation
          - entities.Contributor.fields.tax_residency
          - entities.TaxDocument.fields.doc_kind
          - state_machines.Invoice.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Entity domain = Invoice withholding (fiscal), distinct from the
          Assignment-fee domain of the sibling instance. Two invoices with the
          identical fee_claim_cents == 105000 diverge: domestic contributor with
          backup_withholding_flag == true withholds 25200 (24%), while a foreign
          contributor with VERIFIED W8BEN for treaty country JP withholds 10500
          (10%) — variant selected by tax branch, not by any invoice field.
        test_recipe:
          setup:
            - "DeskConfig bootstrapped with defaults"
            - "Contributor D: DOMESTIC_US with backup_withholding_flag true, FLAT agreement 105000, assignment accepted-for-publication with final fee 105000"
            - "Contributor F: FOREIGN with VERIFIED W8BEN treaty_country JP, FLAT agreement 105000, assignment accepted-for-publication with final fee 105000"
            - "Each has an invoice at SUBMITTED claiming fee 105000, expenses 0"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Dom Backup", email: "dom@x.com", tax_residency: "DOMESTIC_US", backup_withholding_flag: true }
              as: DeskAdmin
              captures: { contrib_d: $.data.id, contrib_d_v: $.data.version }
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Foreign JP", email: "jp@x.com", tax_residency: "FOREIGN" }
              as: DeskAdmin
              captures: { contrib_f: $.data.id, contrib_f_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${contrib_d}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 105000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${contrib_d_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors/${contrib_f}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 105000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${contrib_f_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors/${contrib_f}/tax-documents"
              payload: { doc_kind: "W8BEN", treaty_country: "JP", tin_last4: "1234" }
              as: Contributor
              as_user_id: "${contrib_f}"
              captures: { doc_f: $.data.id }
            - call: "POST /freelance-desk/tax-documents/${doc_f}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceUser
              as_user_id: "fin-1"
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${contrib_d}", title: "SD", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_d: $.data.id }
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${contrib_f}", title: "SF", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_f: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_d}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_d}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_d}"
            - call: "POST /freelance-desk/assignments/${asg_d}/start"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_d}"
            - call: "POST /freelance-desk/assignments/${asg_d}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_d}"
            - call: "GET /freelance-desk/assignments/${asg_d}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_d1: "$.data[0].id", rep_d2: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_d1}/record-result"
              payload: { similarity_score_bps: 100, ai_probability_bps: 0 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/verification-reports/${rep_d2}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 100 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/assignments/${asg_d}/accept-for-publication"
              payload: { final_word_count: 100 }
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_f}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_f}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_f}"
            - call: "POST /freelance-desk/assignments/${asg_f}/start"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_f}"
            - call: "POST /freelance-desk/assignments/${asg_f}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_f}"
            - call: "GET /freelance-desk/assignments/${asg_f}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_f1: "$.data[0].id", rep_f2: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_f1}/record-result"
              payload: { similarity_score_bps: 100, ai_probability_bps: 0 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/verification-reports/${rep_f2}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 100 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/assignments/${asg_f}/accept-for-publication"
              payload: { final_word_count: 100 }
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_d}/invoices"
              payload: { fee_claim_cents: 105000, expense_claim_cents: 0 }
              as: Contributor
              as_user_id: "${contrib_d}"
              captures: { inv_d: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_f}/invoices"
              payload: { fee_claim_cents: 105000, expense_claim_cents: 0 }
              as: Contributor
              as_user_id: "${contrib_f}"
              captures: { inv_f: $.data.id }
          trigger:
            - call: "POST /freelance-desk/invoices/${inv_d}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceUser
              as_user_id: "fin-1"
              captures: { inv_d_wh: $.data.withholding_cents, inv_d_net: $.data.net_payable_cents }
            - call: "POST /freelance-desk/invoices/${inv_f}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceUser
              as_user_id: "fin-1"
              captures: { inv_f_wh: $.data.withholding_cents, inv_f_net: $.data.net_payable_cents }
          assert:
            - "Invoice.${inv_d}.withholding_cents == 25200 and Invoice.${inv_d}.net_payable_cents == 79800"
            - "Invoice.${inv_f}.withholding_cents == 10500 and Invoice.${inv_f}.net_payable_cents == 94500"
            - "inv_d_wh != inv_f_wh despite identical fee_claim_cents == 105000"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) vs (b/c))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: kill_fee_late_halving_mode_a
        grounds:
          - calculations.assignment_fee_due
          - entities.Assignment.fields.late_flag
          - state_machines.Assignment.UNDER_VERIFICATION_to_KILLED
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — base fee x
          tier-percent x conditional late-halving branch on entity state. A
          POST_DELIVERY kill with late_flag == true yields
          floor(floor(140000 * 50 / 100) / 2) == 35000, strictly less than the
          on-time POST_DELIVERY 70000 and distinct from the PRE_DELIVERY 35000
          path only by tier arithmetic (140000*25/100 == 35000 collides — so
          this instance pins late POST_DELIVERY on a 1400-word assignment and
          asserts the exact double-floor result 35000 vs the on-time 70000 on
          the same fixture).
        test_recipe:
          setup:
            - "DeskConfig defaults; contributor L with PER_WORD 100 cents/word"
            - "Assignment LP: 1400 words (agreed 140000), deadline 2026-08-05T00:00:00Z; clock advanced to 2026-08-06T00:00:00Z before submit so late_flag == true; submitted, both reports CLEARED"
            - "Assignment OT: identical but submitted before deadline (clock at 2026-08-04) so late_flag == false"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Late Larry", email: "larry@x.com", tax_residency: "DOMESTIC_US" }
              as: DeskAdmin
              captures: { contrib_l: $.data.id, contrib_l_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${contrib_l}/rate-agreements"
              payload: { pricing_mode: "PER_WORD", per_word_rate_cents: 100, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${contrib_l_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${contrib_l}", title: "Late piece", brief: "b", commissioned_word_count: 1400, deadline_utc: "2026-08-05T00:00:00Z" }
              as: Editor
              captures: { asg_lp: $.data.id }
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${contrib_l}", title: "On-time piece", brief: "b", commissioned_word_count: 1400, deadline_utc: "2026-08-05T00:00:00Z" }
              as: Editor
              captures: { asg_ot: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_lp}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_ot}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_lp}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_l}"
            - call: "POST /freelance-desk/assignments/${asg_ot}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_l}"
            - call: "POST /freelance-desk/assignments/${asg_lp}/start"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_l}"
            - call: "POST /freelance-desk/assignments/${asg_ot}/start"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_l}"
            - call: "POST /freelance-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: DeskAdmin
            - call: "POST /freelance-desk/assignments/${asg_ot}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_l}"
            - call: "GET /freelance-desk/assignments/${asg_ot}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_ot1: "$.data[0].id", rep_ot2: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_ot1}/record-result"
              payload: { similarity_score_bps: 100, ai_probability_bps: 0 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/verification-reports/${rep_ot2}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 100 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: DeskAdmin
            - call: "POST /freelance-desk/assignments/${asg_lp}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_l}"
            - call: "GET /freelance-desk/assignments/${asg_lp}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_lp1: "$.data[0].id", rep_lp2: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_lp1}/record-result"
              payload: { similarity_score_bps: 100, ai_probability_bps: 0 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/verification-reports/${rep_lp2}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 100 }
              as: VerificationEditor
              as_user_id: "ve-1"
          trigger:
            - call: "POST /freelance-desk/assignments/${asg_lp}/kill"
              payload: {}
              as: Editor
              captures: { lp_fee: $.data.final_fee_cents, lp_late: $.data.late_flag }
            - call: "POST /freelance-desk/assignments/${asg_ot}/kill"
              payload: {}
              as: Editor
              captures: { ot_fee: $.data.final_fee_cents, ot_late: $.data.late_flag }
          assert:
            - "Assignment.${asg_lp}.late_flag == true and Assignment.${asg_lp}.final_fee_cents == 35000"
            - "Assignment.${asg_ot}.late_flag == false and Assignment.${asg_ot}.final_fee_cents == 70000"
            - "Assignment.${asg_lp}.kill_fee_tier == POST_DELIVERY and Assignment.${asg_ot}.kill_fee_tier == POST_DELIVERY"

      - name: waterfall_fee_only_withholding_mode_c
        grounds:
          - calculations.net_payable_allocation
          - calculations.withholding_computation
          - state_machines.Invoice.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          gross = fee + expenses, but withholding is computed from the FEE ONLY
          (never from gross), then net = gross - withholding. With fee 105000,
          expenses 3200, JP treaty 10%: correct withholding == 10500 and net ==
          97700; the wrong order (withholding on gross) yields 10820 and net
          97380 — the scaffold's pinned order is what the test asserts.
        test_recipe:
          setup:
            - "DeskConfig defaults (treaty JP = 1000 bps)"
            - "FOREIGN contributor J with VERIFIED W8BEN (JP), FLAT agreement 105000"
            - "Assignment accepted-for-publication, final fee 105000"
            - "One TRAVEL expense pre-approved 3200, claimed 3200 with receipt, REIMBURSABLE 3200"
            - "Invoice claims fee 105000 + expenses 3200"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "JP Writer", email: "jpw@x.com", tax_residency: "FOREIGN" }
              as: DeskAdmin
              captures: { contrib_j: $.data.id, contrib_j_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${contrib_j}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 105000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${contrib_j_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors/${contrib_j}/tax-documents"
              payload: { doc_kind: "W8BEN", treaty_country: "JP", tin_last4: "9999" }
              as: Contributor
              as_user_id: "${contrib_j}"
              captures: { doc_j: $.data.id }
            - call: "POST /freelance-desk/tax-documents/${doc_j}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceUser
              as_user_id: "fin-1"
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${contrib_j}", title: "JP story", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_j: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_j}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_j}/accept"
              payload: {}
