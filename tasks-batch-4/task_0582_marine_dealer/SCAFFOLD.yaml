# =============================================================================
# Marine / Boat Dealer & Service — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  582. Marine / Boat Dealer & Service: unit inventory (HIN) & floor plan, sales &
  financing/trade-in, rigging/PDI & delivery, service RO & flat-rate
  (winterize/repower), parts & accessories, warranty & recall, storage/slip &
  haul-out, consignment

domain_name: marine-dealer
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency          # OCC on Unit.version for floor-plan supersede
    - dual_variant_calculation        # floor-plan payoff (fwd vs chrono); RO estimate vs final
    - cascading_side_effects          # deal fund -> unit sold -> floor-plan payoff -> consignment
    - derived_field_reconciliation    # unit.floor_plan_balance_cents, part.available_qty

  entity_topology: flat               # peer collections joined by FK fields in body
  state_machine_shape: branching      # deal fork-to-cancel + RO reopen cycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles              # sales / service / parts / manager own disjoint surfaces
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Unit
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: hin, type: string, source: input, description: "12-char Hull Identification Number", constraints: "unique across Units" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: model_year, type: integer, source: input, description: "Model year" }
      - { name: unit_type, type: enum, source: input, description: "BOAT | MOTOR | TRAILER" }
      - { name: length_ft, type: number, source: input, description: "Overall length in feet (used for berth fit check)" }
      - { name: cost_cents, type: integer, source: input, description: "Dealer cost in cents" }
      - { name: list_price_cents, type: integer, source: input, description: "Advertised list price in cents" }
      - { name: acquisition_type, type: enum, source: input, description: "FLOOR_PLAN | CASH | CONSIGNMENT | TRADE_IN" }
      - { name: open_recall, type: boolean, source: input, default: false, description: "True if an unresolved recall applies to this unit" }
      - { name: status, type: enum, source: system, description: "INTAKE | AVAILABLE | RESERVED | SOLD | DELIVERED | RETURNED", default: INTAKE }
      - { name: warranty_registered, type: boolean, source: computed, description: "True once the unit is DELIVERED via a funded deal" }
      - { name: aging_days, type: integer, source: computed, description: "floor(clock_now - created_at) in whole days" }
      - { name: floor_plan_balance_cents, type: integer, source: computed, description: "outstanding_principal_cents of this unit's ACTIVE/CURTAILED FloorPlan, else 0" }

  - name: FloorPlan
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the financed unit" }
      - { name: lender_name, type: string, source: input, description: "Floor-plan lender" }
      - { name: principal_cents, type: integer, source: input, description: "Original advance amount in cents (immutable)" }
      - { name: outstanding_principal_cents, type: integer, source: system, description: "Remaining principal; starts equal to principal_cents, reduced by curtailments" }
      - { name: apr_bps, type: integer, source: input, description: "Annual interest rate in basis points" }
      - { name: advanced_at, type: datetime, source: input, description: "Date the advance was made (ISO 8601 UTC)" }
      - { name: curtailment_pct_bps, type: integer, source: input, description: "Percent of principal due at each curtailment window, in bps" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CURTAILED | PAID_OFF | SUPERSEDED", default: ACTIVE }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Chronological interest to clock_now (see floor_plan_accrual)" }
      - { name: payoff_cents, type: integer, source: computed, description: "Forward-looking payoff quote to clock_now + PAYOFF_NOTICE_DAYS" }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit being sold" }
      - { name: customer_name, type: string, source: input, description: "Buyer name" }
      - { name: sale_price_cents, type: integer, source: input, description: "Negotiated sale price in cents" }
      - { name: financing_type, type: enum, source: input, description: "CASH | RETAIL_FINANCE" }
      - { name: tax_rate_bps, type: integer, source: input, description: "Sales tax rate in basis points" }
      - { name: doc_fee_cents, type: integer, source: input, description: "Documentation fee in cents" }
      - { name: down_payment_cents, type: integer, source: input, description: "Cash down in cents" }
      - { name: trade_allowance_cents, type: integer, source: input, default: 0, description: "Gross trade-in allowance in cents" }
      - { name: trade_lien_payoff_cents, type: integer, source: input, default: 0, description: "Lien owed on the trade-in in cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | FUNDED | DELIVERED | CANCELLED", default: DRAFT }
      - { name: trade_equity_cents, type: integer, source: computed, description: "trade_allowance_cents - trade_lien_payoff_cents (may be negative)" }
      - { name: tax_cents, type: integer, source: computed, description: "Sales tax on the tax base (see deal_financials)" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Net cash due from buyer at funding (see deal_financials)" }

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; consigned unit" }
      - { name: consignor_name, type: string, source: input, description: "Owner consigning the unit" }
      - { name: agreed_floor_cents, type: integer, source: input, description: "Minimum net the consignor must receive, in cents" }
      - { name: commission_bps, type: integer, source: input, description: "Dealer commission on sale price, in bps" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SOLD | RETURNED", default: ACTIVE }
      - { name: payout_cents, type: integer, source: computed, description: "Consignor payout, computed when the consigned unit is sold" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit being serviced" }
      - { name: service_bay_id, type: string, source: input, description: "FK -> ServiceBay.id; scheduled bay" }
      - { name: customer_name, type: string, source: input, description: "Service customer name" }
      - { name: ro_type, type: enum, source: input, description: "DIAGNOSTIC | FLAT_RATE | CUSTOM" }
      - { name: flat_rate_code, type: enum, source: input, required: false, description: "WINTERIZE | REPOWER (required when ro_type=FLAT_RATE)" }
      - { name: flat_rate_hours, type: number, source: input, required: false, description: "Book hours for the flat-rate op" }
      - { name: flat_rate_parts_cents, type: integer, source: input, required: false, description: "Fixed parts cost for the flat-rate op in cents" }
      - { name: estimated_hours, type: number, source: input, required: false, description: "Estimated labor hours for DIAGNOSTIC/CUSTOM" }
      - { name: labor_rate_cents_per_hour, type: integer, source: input, description: "Shop labor rate in cents per hour" }
      - { name: tax_rate_bps, type: integer, source: input, description: "Service tax rate in basis points" }
      - { name: scheduled_start, type: datetime, source: input, description: "Bay window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Bay window end (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | COMPLETED | INVOICED", default: OPEN }
      - { name: estimate_total_cents, type: integer, source: computed, description: "Provisional total from book/estimated hours (see repair_order_totals)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final total from actual ServiceLines, set on complete (see repair_order_totals)" }

  - name: ServiceLine
    parent: null
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; parent RO" }
      - { name: line_type, type: enum, source: input, description: "LABOR | PART" }
      - { name: part_id, type: string, source: input, required: false, description: "FK -> Part.id; required when line_type=PART" }
      - { name: hours, type: number, source: input, required: false, description: "Actual labor hours (LABOR lines)" }
      - { name: quantity, type: integer, source: input, required: false, description: "Part quantity (PART lines); must be >= 1" }
      - { name: unit_price_cents, type: integer, source: input, required: false, description: "Override price per unit/hour in cents; defaults from Part.list_price_cents or RO labor rate" }
      - { name: warranty_covered, type: boolean, source: input, default: false, description: "True if this line is warranty-covered (excluded from customer total)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOID | CONSUMED", default: ACTIVE }
      - { name: extended_cents, type: integer, source: computed, description: "Rounded line extension (see repair_order_totals)" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit", constraints: "unique across Parts" }
      - { name: name, type: string, source: input, description: "Part name" }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical quantity on hand" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Dealer unit cost in cents" }
      - { name: list_price_cents, type: integer, source: input, description: "List price per unit in cents" }
      - { name: reorder_point, type: integer, source: input, description: "Available quantity at/below which the part is low" }
      - { name: reserved_qty, type: integer, source: computed, description: "Sum of quantity over ACTIVE PART ServiceLines referencing this part" }
      - { name: available_qty, type: integer, source: computed, description: "on_hand_qty - reserved_qty" }
      - { name: is_low, type: boolean, source: computed, description: "True when available_qty <= reorder_point" }

  - name: Berth
    parent: null
    common_fields: true
    fields:
      - { name: berth_code, type: string, source: input, description: "Human-readable slip/rack code", constraints: "unique across Berths" }
      - { name: berth_type, type: enum, source: input, description: "WET_SLIP | DRY_RACK" }
      - { name: max_length_ft, type: number, source: input, description: "Maximum unit length in feet this berth accepts" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN }

  - name: ServiceBay
    parent: null
    common_fields: true
    fields:
      - { name: bay_code, type: string, source: input, description: "Bay code", constraints: "unique across ServiceBays" }
      - { name: bay_type, type: enum, source: input, description: "RIGGING | MECHANICAL | HAUL_OUT" }

  - name: SlipReservation
    parent: null
    common_fields: true
    fields:
      - { name: berth_id, type: string, source: input, description: "FK -> Berth.id; reserved berth" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; stored unit" }
      - { name: start_date, type: datetime, source: input, description: "Reservation start date (inclusive), ISO 8601 UTC" }
      - { name: end_date, type: datetime, source: input, description: "Reservation end date (exclusive), ISO 8601 UTC" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Storage rate per day in cents" }
      - { name: status, type: enum, source: system, description: "RESERVED | ENDED | CANCELLED", default: RESERVED }
      - { name: nights, type: integer, source: computed, description: "Whole days between start_date and end_date" }
      - { name: total_cents, type: integer, source: computed, description: "nights * daily_rate_cents" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Unit
    initial_state: INTAKE
    terminal_states: [DELIVERED, RETURNED]
    transitions:
      - from: INTAKE
        to: AVAILABLE
        trigger: "POST /units/{id}/list"
        actor: Manager
        preconditions: []
        side_effects: ["Unit becomes eligible for deals and reservations"]
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (Deal DRAFT->SIGNED)"
        actor: system
        preconditions: []
        side_effects: ["Reserved against the signing deal"]
      - from: RESERVED
        to: SOLD
        trigger: "system (Deal SIGNED->FUNDED)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE L2: this SOLD transition triggers the unit's ACTIVE/CURTAILED FloorPlan -> PAID_OFF (see FloorPlan.ACTIVE_to_PAID_OFF)"
          - "CASCADE L2: if acquisition_type=CONSIGNMENT, the unit's ACTIVE Consignment -> SOLD (see Consignment.ACTIVE_to_SOLD)"
      - from: SOLD
        to: DELIVERED
        trigger: "system (Deal FUNDED->DELIVERED)"
        actor: system
        preconditions: ["open_recall == false (ERR_OPEN_RECALL_BLOCKS_DELIVERY)"]
        side_effects: ["warranty_registered becomes true"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (Deal SIGNED->CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["Reservation released"]
      - from: SOLD
        to: AVAILABLE
        trigger: "system (Deal FUNDED->CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "COMPENSATION: the unit's FloorPlan PAID_OFF -> ACTIVE with outstanding_principal_cents restored (see FloorPlan.PAID_OFF_to_ACTIVE)"
          - "COMPENSATION: the unit's Consignment SOLD -> ACTIVE, payout_cents reset to 0"
      - from: AVAILABLE
        to: RETURNED
        trigger: "system (Consignment ACTIVE->RETURNED)"
        actor: system
        preconditions: []
        side_effects: ["Unit removed from saleable inventory"]

  - entity: FloorPlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: CURTAILED
        trigger: "POST /floor-plans/{id}/curtail"
        actor: Manager
        preconditions:
          - "aging_days of the plan (clock_now - advanced_at) >= CURTAILMENT_DUE_DAYS (ERR_CURTAILMENT_NOT_DUE)"
          - "payment_cents <= outstanding_principal_cents (ERR_CURTAILMENT_EXCEEDS_PRINCIPAL)"
        side_effects: ["outstanding_principal_cents -= payment_cents", "Unit.floor_plan_balance_cents recomputed"]
      - from: CURTAILED
        to: CURTAILED
        trigger: "POST /floor-plans/{id}/curtail"
        actor: Manager
        preconditions:
          - "days since advanced_at >= CURTAILMENT_DUE_DAYS (ERR_CURTAILMENT_NOT_DUE)"
          - "payment_cents <= outstanding_principal_cents (ERR_CURTAILMENT_EXCEEDS_PRINCIPAL)"
        side_effects: ["outstanding_principal_cents -= payment_cents", "Unit.floor_plan_balance_cents recomputed"]
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (Unit RESERVED->SOLD)"
        actor: system
        preconditions: []
        side_effects: ["payoff_cents snapshot recorded", "outstanding_principal_cents set to 0", "Unit.floor_plan_balance_cents recomputed to 0"]
      - from: CURTAILED
        to: PAID_OFF
        trigger: "system (Unit RESERVED->SOLD)"
        actor: system
        preconditions: []
        side_effects: ["payoff_cents snapshot recorded", "outstanding_principal_cents set to 0", "Unit.floor_plan_balance_cents recomputed to 0"]
      - from: PAID_OFF
        to: ACTIVE
        trigger: "system (Unit SOLD->AVAILABLE via Deal cancel)"
        actor: system
        preconditions: []
        side_effects: ["outstanding_principal_cents restored to its pre-payoff value", "Unit.floor_plan_balance_cents recomputed"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer FloorPlan created for the same Unit)"
        actor: system
        preconditions: []
        side_effects: ["Plan closed out; no further curtailments accepted"]
      - from: CURTAILED
        to: SUPERSEDED
        trigger: "system (a newer FloorPlan created for the same Unit)"
        actor: system
        preconditions: []
        side_effects: ["Plan closed out; no further curtailments accepted"]

  - entity: Deal
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /deals/{id}/sign"
        actor: SalesRep
        preconditions: ["CROSS-ENTITY: Unit.status == AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"]
        side_effects: ["CASCADE: Unit AVAILABLE -> RESERVED"]
      - from: SIGNED
        to: FUNDED
        trigger: "POST /deals/{id}/fund"
        actor: Manager
        preconditions:
          - "down_payment_cents >= ceil(sale_price_cents * MIN_DOWN_BPS / 10000) (ERR_DOWN_PAYMENT_TOO_LOW)"
        side_effects:
          - "CASCADE L1: Unit RESERVED -> SOLD (which itself pays off the FloorPlan and marks any Consignment SOLD)"
          - "If Unit.acquisition_type=CONSIGNMENT, Consignment.payout_cents computed (see consignment_payout)"
      - from: FUNDED
        to: DELIVERED
        trigger: "POST /deals/{id}/deliver"
        actor: SalesRep
        preconditions: ["Unit.open_recall == false (ERR_OPEN_RECALL_BLOCKS_DELIVERY)"]
        side_effects: ["CASCADE: Unit SOLD -> DELIVERED, warranty_registered=true"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /deals/{id}/cancel"
        actor: Manager
        preconditions: []
        side_effects: []
      - from: SIGNED
        to: CANCELLED
        trigger: "POST /deals/{id}/cancel"
        actor: Manager
        preconditions: []
        side_effects: ["CASCADE: Unit RESERVED -> AVAILABLE"]
      - from: FUNDED
        to: CANCELLED
        trigger: "POST /deals/{id}/cancel"
        actor: Manager
        preconditions: []
        side_effects:
          - "COMPENSATION: Unit SOLD -> AVAILABLE (which reactivates the FloorPlan and reverts the Consignment)"

  - entity: RepairOrder
    initial_state: OPEN
    terminal_states: [INVOICED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /repair-orders/{id}/start"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /repair-orders/{id}/complete"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: ["final_total_cents computed from ACTIVE ServiceLines (see repair_order_totals)"]
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "POST /repair-orders/{id}/reopen"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: ["final_total_cents cleared until re-completed"]
      - from: COMPLETED
        to: INVOICED
        trigger: "POST /repair-orders/{id}/invoice"
        actor: ServiceAdvisor
        preconditions: ["every non-warranty PART line has quantity <= Part.on_hand_qty (ERR_INSUFFICIENT_STOCK)"]
        side_effects:
          - "CASCADE L2: RO becomes INVOICED, which drives each ACTIVE non-warranty PART line -> CONSUMED"
          - "CASCADE L2: each CONSUMED line decrements its Part.on_hand_qty by quantity, which itself recomputes Part.available_qty"

  - entity: ServiceLine
    initial_state: ACTIVE
    terminal_states: [VOID, CONSUMED]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "POST /service-lines/{id}/void"
        actor: ServiceAdvisor
        preconditions: ["parent RepairOrder.status in {OPEN, IN_PROGRESS, COMPLETED} (ERR_INVALID_STATE)"]
        side_effects: ["PART line: Part.reserved_qty decreases by quantity, Part.available_qty recomputed"]
      - from: ACTIVE
        to: CONSUMED
        trigger: "system (parent RepairOrder COMPLETED->INVOICED)"
        actor: system
        preconditions: []
        side_effects: ["PART line: Part.on_hand_qty and Part.reserved_qty both decrease by quantity"]

  - entity: SlipReservation
    initial_state: RESERVED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ENDED
        trigger: "POST /slip-reservations/{id}/end"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: ["Berth interval freed for future reservations"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /slip-reservations/{id}/cancel"
        actor: ServiceAdvisor
        preconditions: []
        side_effects: ["Berth interval freed for future reservations"]

  - entity: Berth
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /berths/{id}/close"
        actor: Manager
        preconditions: []
        side_effects: ["No new SlipReservations may target this berth while CLOSED"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: floorplan-supersede-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /floor-plans"
    occ_field: "expected_unit_version"
    description: |
      Creating a FloorPlan against a Unit whose version has advanced since the
      client last observed it is rejected. A new plan legitimately supersedes the
      prior ACTIVE/CURTAILED plan (a refinance), so a create carrying a stale
      expected_unit_version is rejected on the stale-version check.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: deal_financials
    trigger: "Deal create; recomputed on the computed fields at read time"
    algorithm: combinatorial_formula
    formula: |
      # ≥3 inputs, nested max, conditional on trade allowance sign — Rule 2 mode (a)
      trade_equity_cents = trade_allowance_cents - trade_lien_payoff_cents        # may be negative
      tax_base_cents     = max(0, sale_price_cents - max(0, trade_allowance_cents))
      tax_cents          = round_half_up(tax_base_cents * tax_rate_bps / 10000)
      amount_due_cents   = sale_price_cents + tax_cents + doc_fee_cents
                           - down_payment_cents - trade_equity_cents
    input_set: "single Deal row plus its own input fields"
    constants: { MIN_DOWN_BPS: 1000 }
    precision: "cents, round_half_up"

  - name: floor_plan_accrual
    trigger: "read of a FloorPlan; payoff snapshot recorded on Unit RESERVED->SOLD"
    algorithm: forward_looking
    formula: |
      days_out = floor(clock_now - advanced_at)  in whole days
      # DUAL VARIANT — Rule 1 (FloorPlan domain)
      accrued_interest_cents (chronological):
        round_half_up(outstanding_principal_cents * apr_bps / 10000 * days_out / DAYS_PER_YEAR)
      payoff_cents (forward_looking):
        proj_days = days_out + PAYOFF_NOTICE_DAYS
        outstanding_principal_cents
          + round_half_up(outstanding_principal_cents * apr_bps / 10000 * proj_days / DAYS_PER_YEAR)
    input_set: "single FloorPlan row; clock_now from logical clock"
    constants: { DAYS_PER_YEAR: 365, PAYOFF_NOTICE_DAYS: 10, CURTAILMENT_DUE_DAYS: 90 }
    precision: "cents, round_half_up"
    variants:
      - { name: chronological_accrual, when: "current-balance read", difference: "day-count runs advanced_at -> clock_now only" }
      - { name: forward_payoff_quote, when: "payoff quote / sale settlement", difference: "day-count projects PAYOFF_NOTICE_DAYS beyond clock_now" }

  - name: repair_order_totals
    trigger: "RO read (estimate); RO COMPLETED (final)"
    algorithm: aggregation
    formula: |
      # DUAL VARIANT — Rule 1 (RepairOrder domain): estimate vs final
      estimate_total_cents (provisional, at/after create):
        if ro_type == FLAT_RATE:
          labor = round_half_up(flat_rate_hours * labor_rate_cents_per_hour)
          base  = labor + flat_rate_parts_cents
        else:  # DIAGNOSTIC | CUSTOM
          base  = round_half_up(estimated_hours * labor_rate_cents_per_hour)
        estimate_total_cents = base + round_half_up(base * tax_rate_bps / 10000)

      # Rule 2 mode (b): round PER LINE, then sum, then tax ONCE on the subtotal.
      final_total_cents (on COMPLETED, over ACTIVE, non-warranty ServiceLines):
        per line: extended_cents =
          LABOR -> round_half_up(hours * effective_unit_price)
          PART  -> round_half_up(quantity * effective_unit_price)
        subtotal_cents = sum(extended_cents over ACTIVE non-warranty lines)   # NO re-rounding
        final_total_cents = subtotal_cents + round_half_up(subtotal_cents * tax_rate_bps / 10000)
    input_set: "ServiceLines with status=ACTIVE and warranty_covered=false"
    constants: {}
    precision: "cents, round_half_up; per-line rounding fixed BEFORE summation"
    variants:
      - { name: estimate, when: "before completion", difference: "book/estimated hours, no parts detail" }
      - { name: final, when: "on COMPLETED", difference: "actual logged ServiceLines, per-line rounded then summed" }

  - name: part_availability
    trigger: "PART ServiceLine create/void; RO invoice; Part receive"
    algorithm: aggregation
    formula: |
      reserved_qty  = sum(quantity of ServiceLine where line_type=PART and status=ACTIVE and part_id=this.id)
      available_qty = on_hand_qty - reserved_qty
      is_low        = available_qty <= reorder_point
    input_set: "ACTIVE PART ServiceLines referencing this Part"
    constants: {}
    precision: "integer counts"

  - name: consignment_payout
    trigger: "Deal SIGNED->FUNDED for a CONSIGNMENT unit (Unit RESERVED->SOLD cascade)"
    algorithm: aggregation
    formula: |
      dealer_commission_cents = round_half_up(deal.sale_price_cents * commission_bps / 10000)
      payout_cents            = deal.sale_price_cents - dealer_commission_cents
    input_set: "the funded Deal on this Consignment's unit"
    constants: {}
    precision: "cents, round_half_up"

  - name: unit_aging
    trigger: "Unit read"
    algorithm: aggregation
    formula: |
      aging_days = floor(clock_now - created_at) in whole days
      floor_plan_balance_cents =
        outstanding_principal_cents of this unit's FloorPlan whose status in {ACTIVE, CURTAILED}
        (there is at most one such plan), else 0
    input_set: "the Unit and its non-terminal FloorPlan"
    constants: {}
    precision: "integer days / cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "Path id and body FK ids resolve to existing resources (left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 4, category: business_constraint, check: "Required body fields present, types valid, enums in range (incl. quantity>=1 for PART lines is priority 9)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all POST }
  - { priority: 5, category: business_referential, check: "PART ServiceLine must carry part_id", error_id: ERR_PART_REQUIRED_FOR_LINE, http_status: 422, applies_to: "POST /service-lines" }
  - { priority: 6, category: business_referential, check: "LABOR ServiceLine must carry hours", error_id: ERR_HOURS_REQUIRED_FOR_LABOR, http_status: 422, applies_to: "POST /service-lines" }
  - { priority: 7, category: concurrency, check: "expected_unit_version matches current Unit.version", error_id: ERR_STALE_UNIT_VERSION, http_status: 412, applies_to: "POST /floor-plans" }
  - { priority: 8, category: state, check: "Target resource in a valid state for the transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: all transition endpoints }
  - { priority: 9, category: state, check: "Deal.sign requires Unit.status==AVAILABLE (cross-entity guard)", error_id: ERR_UNIT_NOT_AVAILABLE, http_status: 409, applies_to: "POST /deals/{id}/sign" }
  - { priority: 10, category: business_constraint, check: "Deal create rejected when the unit already has a non-terminal Deal (DRAFT/SIGNED/FUNDED)", error_id: ERR_UNIT_HAS_ACTIVE_DEAL, http_status: 409, applies_to: "POST /deals" }
  - { priority: 11, category: business_temporal, check: "SlipReservation end_date > start_date", error_id: ERR_RESERVATION_DATES_INVALID, http_status: 422, applies_to: "POST /slip-reservations" }
  - { priority: 12, category: business_temporal, check: "RepairOrder scheduled_end > scheduled_start", error_id: ERR_SCHEDULE_WINDOW_INVALID, http_status: 422, applies_to: "POST /repair-orders" }
  - { priority: 13, category: state, check: "SlipReservation requires target Berth.status==OPEN (cross-entity guard)", error_id: ERR_BERTH_CLOSED, http_status: 409, applies_to: "POST /slip-reservations" }
  - { priority: 14, category: business_constraint, check: "Unit.length_ft <= Berth.max_length_ft", error_id: ERR_UNIT_EXCEEDS_BERTH, http_status: 422, applies_to: "POST /slip-reservations" }
  - { priority: 15, category: business_temporal, check: "SlipReservation half-open [start,end) must not overlap another RESERVED reservation on the same berth", error_id: ERR_BERTH_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /slip-reservations" }
  - { priority: 16, category: business_temporal, check: "RepairOrder closed window [start,end] extended by BAY_BUFFER_MINUTES=30 at each end must not overlap another non-INVOICED RO in the same bay; conflict iff new.start <= other.end + 30min AND other.start <= new.end + 30min", error_id: ERR_BAY_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /repair-orders" }
  - { priority: 17, category: business_fiscal, check: "Deal.fund requires down_payment_cents >= ceil(sale_price_cents*MIN_DOWN_BPS/10000)", error_id: ERR_DOWN_PAYMENT_TOO_LOW, http_status: 402, applies_to: "POST /deals/{id}/fund" }
  - { priority: 18, category: business_temporal, check: "FloorPlan curtailment requires days since advanced_at >= CURTAILMENT_DUE_DAYS", error_id: ERR_CURTAILMENT_NOT_DUE, http_status: 409, applies_to: "POST /floor-plans/{id}/curtail" }
  - { priority: 19, category: business_fiscal, check: "Curtailment payment_cents <= outstanding_principal_cents", error_id: ERR_CURTAILMENT_EXCEEDS_PRINCIPAL, http_status: 422, applies_to: "POST /floor-plans/{id}/curtail" }
  - { priority: 20, category: business_fiscal, check: "PART ServiceLine quantity >= 1", error_id: ERR_INVALID_QUANTITY, http_status: 422, applies_to: "POST /service-lines" }
  - { priority: 21, category: business_fiscal, check: "RO invoice requires each non-warranty PART line quantity <= Part.on_hand_qty", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "POST /repair-orders/{id}/invoice" }
  - { priority: 22, category: state, check: "Deal.deliver / Unit SOLD->DELIVERED requires Unit.open_recall==false", error_id: ERR_OPEN_RECALL_BLOCKS_DELIVERY, http_status: 409, applies_to: "POST /deals/{id}/deliver" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances; affects aging_days, floor_plan_accrual"]

  # --- Unit ---
  - { method: POST, path: "/units", description: "Create a unit (INTAKE)", roles: [Manager], code: 201, input: [hin, make, model, model_year, unit_type, length_ft, cost_cents, list_price_cents, acquisition_type, "open_recall?"], output: Unit, side_effects: ["status=INTAKE"] }
  - { method: GET, path: "/units/{id}", description: "Get a unit", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: Unit, side_effects: [] }
  - { method: GET, path: "/units", description: "List units", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: ["status?", "acquisition_type?"], output: "Unit[]", side_effects: [] }
  - { method: POST, path: "/units/{id}/list", description: "List a unit for sale (INTAKE->AVAILABLE)", roles: [Manager], code: 200, input: [], output: Unit, side_effects: ["status->AVAILABLE"] }

  # --- FloorPlan ---
  - method: POST
    path: "/floor-plans"
    description: "Open a floor-plan advance on a unit; supersedes any prior ACTIVE/CURTAILED plan. OCC on Unit.version."
    roles: [Manager]
    code: 201
    input: [unit_id, lender_name, principal_cents, apr_bps, advanced_at, curtailment_pct_bps, expected_unit_version]
    output: FloorPlan
    side_effects:
      - "status=ACTIVE, outstanding_principal_cents=principal_cents"
      - "prior ACTIVE/CURTAILED FloorPlan for the unit -> SUPERSEDED"
      - "increments Unit.version by 1"
      - "Unit.floor_plan_balance_cents recomputed"
  - { method: GET, path: "/floor-plans/{id}", description: "Get a floor plan", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: FloorPlan, side_effects: [] }
  - { method: GET, path: "/floor-plans", description: "List floor plans (filter)", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: ["unit_id?", "status?"], output: "FloorPlan[]", side_effects: [] }
  - { method: POST, path: "/floor-plans/{id}/curtail", description: "Record a curtailment paydown", roles: [Manager], code: 200, input: [payment_cents], output: FloorPlan, side_effects: ["outstanding_principal_cents decreases", "status->CURTAILED", "Unit.floor_plan_balance_cents recomputed"] }

  # --- Deal ---
  - { method: POST, path: "/deals", description: "Create a sales deal (DRAFT)", roles: [SalesRep], code: 201, input: [unit_id, customer_name, sale_price_cents, financing_type, tax_rate_bps, doc_fee_cents, down_payment_cents, "trade_allowance_cents?", "trade_lien_payoff_cents?"], output: Deal, side_effects: ["status=DRAFT", "deal_financials computed"] }
  - { method: GET, path: "/deals/{id}", description: "Get a deal", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: Deal, side_effects: [] }
  - { method: GET, path: "/deals", description: "List deals (filter)", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: ["unit_id?", "status?"], output: "Deal[]", side_effects: [] }
  - { method: POST, path: "/deals/{id}/sign", description: "Sign a deal (DRAFT->SIGNED)", roles: [SalesRep], code: 200, input: [], output: Deal, side_effects: ["Unit AVAILABLE->RESERVED"] }
  - { method: POST, path: "/deals/{id}/fund", description: "Fund a deal (SIGNED->FUNDED)", roles: [Manager], code: 200, input: [], output: Deal, side_effects: ["Unit RESERVED->SOLD (cascade: FloorPlan payoff, Consignment sold)"] }
  - { method: POST, path: "/deals/{id}/deliver", description: "Deliver a deal (FUNDED->DELIVERED)", roles: [SalesRep], code: 200, input: [], output: Deal, side_effects: ["Unit SOLD->DELIVERED, warranty_registered=true"] }
  - { method: POST, path: "/deals/{id}/cancel", description: "Cancel a deal (from DRAFT/SIGNED/FUNDED)", roles: [Manager], code: 200, input: [], output: Deal, side_effects: ["compensating reversals per current state"] }

  # --- Consignment ---
  - { method: POST, path: "/consignments", description: "Create a consignment for a unit (ACTIVE)", roles: [Manager], code: 201, input: [unit_id, consignor_name, agreed_floor_cents, commission_bps], output: Consignment, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/consignments/{id}", description: "Get a consignment", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: Consignment, side_effects: [] }
  - { method: GET, path: "/consignments", description: "List consignments (filter)", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: ["unit_id?", "status?"], output: "Consignment[]", side_effects: [] }
  - { method: POST, path: "/consignments/{id}/return", description: "Return a consigned unit to its owner (ACTIVE->RETURNED)", roles: [Manager], code: 200, input: [], output: Consignment, side_effects: ["Unit AVAILABLE->RETURNED"] }

  # --- RepairOrder ---
  - { method: POST, path: "/repair-orders", description: "Open a repair order (OPEN)", roles: [ServiceAdvisor], code: 201, input: [unit_id, service_bay_id, customer_name, ro_type, labor_rate_cents_per_hour, tax_rate_bps, scheduled_start, scheduled_end, "flat_rate_code?", "flat_rate_hours?", "flat_rate_parts_cents?", "estimated_hours?"], output: RepairOrder, side_effects: ["status=OPEN", "estimate_total_cents computed"] }
  - { method: GET, path: "/repair-orders/{id}", description: "Get a repair order", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: RepairOrder, side_effects: [] }
  - { method: GET, path: "/repair-orders", description: "List repair orders (filter)", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: ["unit_id?", "service_bay_id?", "status?"], output: "RepairOrder[]", side_effects: [] }
  - { method: POST, path: "/repair-orders/{id}/start", description: "Start work (OPEN->IN_PROGRESS)", roles: [ServiceAdvisor], code: 200, input: [], output: RepairOrder, side_effects: ["status->IN_PROGRESS"] }
  - { method: POST, path: "/repair-orders/{id}/complete", description: "Complete work (IN_PROGRESS->COMPLETED)", roles: [ServiceAdvisor], code: 200, input: [], output: RepairOrder, side_effects: ["final_total_cents computed"] }
  - { method: POST, path: "/repair-orders/{id}/reopen", description: "Reopen a completed RO (COMPLETED->IN_PROGRESS)", roles: [ServiceAdvisor], code: 200, input: [], output: RepairOrder, side_effects: ["final_total_cents cleared"] }
  - { method: POST, path: "/repair-orders/{id}/invoice", description: "Invoice a completed RO (COMPLETED->INVOICED)", roles: [ServiceAdvisor], code: 200, input: [], output: RepairOrder, side_effects: ["ACTIVE non-warranty PART lines CONSUMED; Part.on_hand_qty decremented"] }

  # --- ServiceLine ---
  - { method: POST, path: "/service-lines", description: "Add a labor/part line to an RO", roles: [ServiceAdvisor], code: 201, input: [repair_order_id, line_type, "part_id?", "hours?", "quantity?", "unit_price_cents?", "warranty_covered?"], output: ServiceLine, side_effects: ["PART line reserves Part inventory", "extended_cents computed"] }
  - { method: GET, path: "/service-lines/{id}", description: "Get a service line", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: ServiceLine, side_effects: [] }
  - { method: GET, path: "/service-lines", description: "List service lines (filter)", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: ["repair_order_id?", "part_id?"], output: "ServiceLine[]", side_effects: [] }
  - { method: POST, path: "/service-lines/{id}/void", description: "Void a service line (ACTIVE->VOID)", roles: [ServiceAdvisor], code: 200, input: [], output: ServiceLine, side_effects: ["PART line releases reserved Part inventory"] }

  # --- Part ---
  - { method: POST, path: "/parts", description: "Create a part (inventory)", roles: [PartsClerk], code: 201, input: [sku, name, on_hand_qty, unit_cost_cents, list_price_cents, reorder_point], output: Part, side_effects: [] }
  - { method: GET, path: "/parts/{id}", description: "Get a part", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: Part, side_effects: [] }
  - { method: GET, path: "/parts", description: "List parts", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: ["sku?"], output: "Part[]", side_effects: [] }
  - { method: POST, path: "/parts/{id}/receive", description: "Receive stock (increment on_hand_qty)", roles: [PartsClerk], code: 200, input: [quantity], output: Part, side_effects: ["on_hand_qty += quantity", "available_qty recomputed"] }

  # --- Berth ---
  - { method: POST, path: "/berths", description: "Create a berth (OPEN)", roles: [Manager], code: 201, input: [berth_code, berth_type, max_length_ft], output: Berth, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/berths/{id}", description: "Get a berth", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: Berth, side_effects: [] }
  - { method: POST, path: "/berths/{id}/close", description: "Close a berth for maintenance (OPEN->CLOSED)", roles: [Manager], code: 200, input: [], output: Berth, side_effects: ["status->CLOSED"] }

  # --- ServiceBay ---
  - { method: POST, path: "/service-bays", description: "Create a service bay", roles: [Manager], code: 201, input: [bay_code, bay_type], output: ServiceBay, side_effects: [] }
  - { method: GET, path: "/service-bays/{id}", description: "Get a service bay", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: ServiceBay, side_effects: [] }

  # --- SlipReservation ---
  - { method: POST, path: "/slip-reservations", description: "Reserve a berth for a unit (RESERVED)", roles: [ServiceAdvisor], code: 201, input: [berth_id, unit_id, start_date, end_date, daily_rate_cents], output: SlipReservation, side_effects: ["status=RESERVED", "nights/total_cents computed"] }
  - { method: GET, path: "/slip-reservations/{id}", description: "Get a reservation", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: [], output: SlipReservation, side_effects: [] }
  - { method: GET, path: "/slip-reservations", description: "List reservations (filter)", roles: [Manager, SalesRep, ServiceAdvisor, PartsClerk], code: 200, input: ["berth_id?", "unit_id?", "status?"], output: "SlipReservation[]", side_effects: [] }
  - { method: POST, path: "/slip-reservations/{id}/end", description: "End a reservation (RESERVED->ENDED)", roles: [ServiceAdvisor], code: 200, input: [], output: SlipReservation, side_effects: ["berth freed"] }
  - { method: POST, path: "/slip-reservations/{id}/cancel", description: "Cancel a reservation (RESERVED->CANCELLED)", roles: [ServiceAdvisor], code: 200, input: [], output: SlipReservation, side_effects: ["berth freed"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or enum out of range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_UNIT_VERSION, http: 412, condition: "expected_unit_version does not match the current Unit.version" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Deal.sign requires the unit to be AVAILABLE" }
  - { id: ERR_UNIT_HAS_ACTIVE_DEAL, http: 409, condition: "Unit already has a non-terminal deal (DRAFT/SIGNED/FUNDED)" }
  - { id: ERR_PART_REQUIRED_FOR_LINE, http: 422, condition: "PART service line is missing part_id" }
  - { id: ERR_HOURS_REQUIRED_FOR_LABOR, http: 422, condition: "LABOR service line is missing hours" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "PART service line quantity is less than 1" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "RO invoice would consume more of a part than is available" }
  - { id: ERR_RESERVATION_DATES_INVALID, http: 422, condition: "SlipReservation end_date is not after start_date" }
  - { id: ERR_SCHEDULE_WINDOW_INVALID, http: 422, condition: "RepairOrder scheduled_end is not after scheduled_start" }
  - { id: ERR_BERTH_CLOSED, http: 409, condition: "Target berth is CLOSED for maintenance" }
  - { id: ERR_UNIT_EXCEEDS_BERTH, http: 422, condition: "Unit length_ft exceeds berth max_length_ft" }
  - { id: ERR_BERTH_DOUBLE_BOOKED, http: 409, condition: "Reservation window overlaps an existing RESERVED reservation on the berth" }
  - { id: ERR_BAY_SCHEDULE_CONFLICT, http: 409, condition: "RO closed window (plus the 30-minute bay-turnaround buffer at each end) overlaps an existing non-INVOICED RO in the bay" }
  - { id: ERR_DOWN_PAYMENT_TOO_LOW, http: 402, condition: "Down payment below the minimum for funding" }
  - { id: ERR_CURTAILMENT_NOT_DUE, http: 409, condition: "Curtailment attempted before the plan reaches CURTAILMENT_DUE_DAYS" }
  - { id: ERR_CURTAILMENT_EXCEEDS_PRINCIPAL, http: 422, condition: "Curtailment payment exceeds outstanding principal" }
  - { id: ERR_OPEN_RECALL_BLOCKS_DELIVERY, http: 409, condition: "Delivery blocked while the unit has an open recall" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Manager
    description: "Owns inventory intake, floor-plan finance, consignment, yard/berth config, and deal funding/cancellation authority"
    identity: opaque
    exclusive_operations:
      - "POST /units — create unit"
      - "POST /units/{id}/list — list unit for sale"
      - "POST /floor-plans — open floor plan"
      - "POST /floor-plans/{id}/curtail — curtailment paydown"
      - "POST /consignments — create consignment"
      - "POST /consignments/{id}/return — return consigned unit"
      - "POST /deals/{id}/fund — fund deal"
      - "POST /deals/{id}/cancel — cancel deal"
      - "POST /berths — create berth"
      - "POST /berths/{id}/close — close berth"
      - "POST /service-bays — create service bay"
    shared_operations:
      - "GET on all collections and resources"
      - "POST /_clock/set_current_utc"

  - name: SalesRep
    description: "Owns the sales desk: creating, signing, and delivering deals"
    identity: opaque
    exclusive_operations:
      - "POST /deals — create deal"
      - "POST /deals/{id}/sign — sign deal"
      - "POST /deals/{id}/deliver — deliver deal"
    shared_operations:
      - "GET on all collections and resources"
      - "POST /_clock/set_current_utc"

  - name: ServiceAdvisor
    description: "Owns the service lane: repair orders, service lines, and storage/slip reservations"
    identity: opaque
    exclusive_operations:
      - "POST /repair-orders and its start/complete/reopen/invoice transitions"
      - "POST /service-lines and /service-lines/{id}/void"
      - "POST /slip-reservations and its end/cancel transitions"
    shared_operations:
      - "GET on all collections and resources"
      - "POST /_clock/set_current_utc"

  - name: PartsClerk
    description: "Owns the parts counter: part records and stock receiving"
    identity: opaque
    exclusive_operations:
      - "POST /parts — create part"
      - "POST /parts/{id}/receive — receive stock"
    shared_operations:
      - "GET on all collections and resources"
      - "POST /_clock/set_current_utc"
