        grounds:
          - state_machines.Referral.SCREENING_to_INFO_REQUESTED
          - state_machines.Referral.INFO_REQUESTED_to_SCREENING
          - state_machines.Referral.SCREENING_to_PLACEMENT_OFFERED
          - calculations.referral_priority_score
          - entities.Referral.fields.missing_items
        distinguishing_aspect: |
          The referral revisits SCREENING twice through INFO_REQUESTED — a genuine cycle, not a
          forward-only path — and each pass re-runs referral_priority_score against the revised
          intake counters (0.3800 -> 0.5300), after which the twice-cycled referral is still
          offerable.
        test_recipe:
          setup:
            - "one home school, one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12 (intake_posture OPEN, version 1)"
            - "one student referred on the CREDIT_DEFICIENCY pathway with deficiency_credits 4.00, behavior_incident_count 1, days_disengaged 6 (priority_score 0.3800)"
            - "the referral has been screened, returned for missing documentation, and resubmitted once with deficiency_credits corrected to 6.00 (priority_score 0.5300)"
            - "the logical clock is at its startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
