      - name: run_start_sets_train_running_and_stamps_the_charge
        claim_type: side_effect_execution
        grounds:
          - state_machines.ProductionRun.APPROVED_to_RUNNING
          - state_machines.ReformerTrain.IDLE_to_RUNNING
          - entities.ProductionRun.fields.catalyst_charge_id
          - calculations.run_ammonia_unit_cost
        distinguishing_aspect: |
          One start call writes three things: the run becomes RUNNING, the train moves IDLE -> RUNNING,
          and catalyst_charge_id is pinned to the train's ACTIVE charge. The provisional cost stamped at
          approve is 181.10 (an empty hedge book, so every MMBtu is bought at the 4.20 spot index) and
          start does not recompute it.
        test_recipe:
          setup:
            - "One plant with spot_gas_index_usd_per_mmbtu 4.20 and no hedge lots."
            - "One train, one ACTIVE zero-hour charge, one APPROVED run with target_ammonia_tons 1000."
            - "The logical clock is advanced to 2026-09-01 so the run's window is current."
          setup_api_calls:
