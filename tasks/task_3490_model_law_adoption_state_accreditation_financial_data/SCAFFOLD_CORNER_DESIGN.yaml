scaffold_corner_design:
  - section: entities
    instances:
      - name: model_act_creation_defaults
        claim_type: creation
        grounds:
          - entities.ModelAct
        distinguishing_aspect: "Create succeeds with 201; system defaults applied: status DRAFTING, votes_cast 0, favorable_votes 0, version 1, published_at null, is_core false when omitted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-800", version_label: "v1", title: "Model Annuity Act", act_type: "MODEL_LAW", committee_name: "A Committee" }, as: AssociationStaff, captures: { a_id: $.data.id, a_st: $.data.status, a_vc: $.data.votes_cast, a_v: $.data.version, a_core: $.data.is_core, a_pub: $.data.published_at } }
          assert:
            - "ModelAct.status == DRAFTING, votes_cast == 0, favorable_votes == 0, version == 1"
            - "ModelAct.is_core == false (default) and published_at == null"
            - "ModelAct.id is a server-minted UUID"
      - name: state_creation_defaults
        claim_type: defaults
        grounds:
          - entities.State
          - calculations.core_act_coverage
        distinguishing_aspect: "New state starts ACCREDITED with consecutive_fail_count 0 and core_act_coverage_pct == 100.0 under the pinned empty-denominator rule."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_id: $.data.id, s_st: $.data.accreditation_status, s_fc: $.data.consecutive_fail_count, s_cov: $.data.core_act_coverage_pct } }
          assert:
            - "State.accreditation_status == ACCREDITED and consecutive_fail_count == 0"
            - "State.core_act_coverage_pct == 100.0 (denominator 0 -> 100.0)"
      - name: state_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.State
        distinguishing_aspect: "Client-supplied id and version in the create payload are ignored; server mints its own id and sets version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California", id: "00000000-0000-4000-8000-000000000000", version: 99 }, as: AssociationStaff, captures: { s_id: $.data.id, s_v: $.data.version } }
          assert:
            - "State.id != 00000000-0000-4000-8000-000000000000 (client input ignored)"
            - "State.version == 1 (client input ignored)"
      - name: insurer_create_missing_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=5]"
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field name on insurer create yields 400 ERR_INVALID_REQUEST while all references resolve."
        test_recipe:
          setup: ["State CA exists"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff }
          trigger:
            - { call: "POST /naic/insurers", payload: { naic_code: "90080", domicile_state_code: "CA" }, as: AssociationStaff, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"
      - name: license_window_inverted_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "validations[priority=5]"
          - entities.ProducerLicense.fields.valid_until
        distinguishing_aspect: "valid_until <= effective_from is a shape violation (400), not a temporal-overlap conflict."
        test_recipe:
          setup: ["State CA exists; producer P-10 exists"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff }
            - { call: "POST /naic/producers", payload: { npn: "P-10", full_name: "Producer Ten", home_state_code: "CA" }, as: AssociationStaff, captures: { pr_id: $.data.id } }
          trigger:
            - { call: "POST /naic/licenses", payload: { producer_id: "${pr_id}", state_code: "CA", license_class: "LIFE", effective_from: "2028-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }, as: ProducerUser, as_user_id: "${pr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"
      - name: duplicate_key_sweep
        claim_type: violation_to_error
        grounds:
          - "validations[priority=20]"
          - errors[ERR_DUPLICATE_MODEL_ACT]
          - errors[ERR_DUPLICATE_NAIC_CODE]
          - errors[ERR_DUPLICATE_NPN]
          - errors[ERR_DUPLICATE_STANDARD_VERSION]
          - errors[ERR_DUPLICATE_CALL_CODE]
        distinguishing_aspect: "Each uniqueness key rejects its second create with its own 409 error id: (model_code, version_label), naic_code, npn, (code, version_label), call_code."
        test_recipe:
          setup: ["State CA exists; one act, insurer, producer, standard and call already created"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-900", version_label: "v1", title: "t", act_type: "MODEL_LAW", committee_name: "c" }, as: AssociationStaff }
            - { call: "POST /naic/insurers", payload: { naic_code: "90090", name: "A", domicile_state_code: "CA" }, as: AssociationStaff }
            - { call: "POST /naic/producers", payload: { npn: "P-90", full_name: "P", home_state_code: "CA" }, as: AssociationStaff }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-90", version_label: "v1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1" }
            - { call: "POST /naic/market-conduct-calls", payload: { call_code: "MC-900", topic: "t", total_cost_cents: 100000 }, as: StateRegulator, as_user_id: "${s_ca_id}" }
          trigger:
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-900", version_label: "v1", title: "t2", act_type: "MODEL_LAW", committee_name: "c" }, as: AssociationStaff, captures: { e1: $.data.error_id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90090", name: "B", domicile_state_code: "CA" }, as: AssociationStaff, captures: { e2: $.data.error_id } }
            - { call: "POST /naic/producers", payload: { npn: "P-90", full_name: "Q", home_state_code: "CA" }, as: AssociationStaff, captures: { e3: $.data.error_id } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-90", version_label: "v1", guidance_text: "g2" }, as: Actuary, as_user_id: "actuary-1", captures: { e4: $.data.error_id } }
            - { call: "POST /naic/market-conduct-calls", payload: { call_code: "MC-900", topic: "t2", total_cost_cents: 100000 }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { e5: $.data.error_id } }
          assert:
            - "error ids in order: ERR_DUPLICATE_MODEL_ACT, ERR_DUPLICATE_NAIC_CODE, ERR_DUPLICATE_NPN, ERR_DUPLICATE_STANDARD_VERSION, ERR_DUPLICATE_CALL_CODE (all http 409)"
  - section: state_machines
    instances:
      - name: act_happy_path_full_lifecycle
        claim_type: valid_transition
        grounds:
          - state_machines.ModelAct
          - state_machines.ExposureDraft
        distinguishing_aspect: "The full forward path DRAFTING -> EXPOSURE_OPEN -> BALLOTING -> ADOPTED -> PUBLISHED works end to end, and published_at is stamped from the logical clock."
        test_recipe:
          setup: ["State CA exists"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-810", version_label: "v1", title: "t", act_type: "MODEL_LAW", committee_name: "c" }, as: AssociationStaff, captures: { act_id: $.data.id } }
          trigger:
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id, d_num: $.data.exposure_number } }
            - { call: "GET /naic/model-acts/${act_id}", payload: {}, as: AssociationStaff, captures: { st1: $.data.status } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/model-acts/${act_id}", payload: {}, as: AssociationStaff, captures: { st2: $.data.status } }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${act_id}/close-ballot", payload: {}, as: AssociationStaff, captures: { st3: $.data.status } }
            - { call: "POST /naic/model-acts/${act_id}/publish", payload: {}, as: AssociationStaff, captures: { st4: $.data.status, pub: $.data.published_at } }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff, captures: { err: $.data.error_id } }
          assert:
            - "status sequence: EXPOSURE_OPEN after first draft, BALLOTING after close, ADOPTED after close-ballot, PUBLISHED after publish"
            - "ExposureDraft.exposure_number == 1"
            - "ModelAct.published_at == 2026-10-01T00:00:00Z (logical clock at publish time)"
            - "closing the already-CLOSED draft fails with ERR_EXPOSURE_DRAFT_NOT_OPEN"
      - name: act_action_state_guards
        claim_type: invalid_transition
        grounds:
          - state_machines.ModelAct.BALLOTING_to_ADOPTED
          - errors[ERR_ACT_NOT_BALLOTING]
          - errors[ERR_ACT_NOT_ADOPTED]
        distinguishing_aspect: "close-ballot and publish from DRAFTING are rejected with their distinct state errors; no transitions fire."
        test_recipe:
          setup: ["Act MDL-811 v1 exists in DRAFTING"]
          setup_api_calls:
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-811", version_label: "v1", title: "t", act_type: "MODEL_REGULATION", committee_name: "c" }, as: AssociationStaff, captures: { act_id: $.data.id } }
          trigger:
            - { call: "POST /naic/model-acts/${act_id}/close-ballot", payload: {}, as: AssociationStaff, captures: { e1: $.data.error_id } }
            - { call: "POST /naic/model-acts/${act_id}/publish", payload: {}, as: AssociationStaff, captures: { e2: $.data.error_id } }
          assert:
            - "close-ballot from DRAFTING -> ERR_ACT_NOT_BALLOTING (409)"
            - "publish from DRAFTING -> ERR_ACT_NOT_ADOPTED (409)"
            - "ModelAct.${act_id}.status remains DRAFTING"
      - name: draft_close_before_window_end_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ExposureDraft.OPEN_to_CLOSED
          - errors[ERR_COMMENT_WINDOW_OPEN]
        distinguishing_aspect: "Closing while the logical clock (default 2026-09-01T00:00:00Z) is before comment_window_end is rejected; the draft stays OPEN and the act stays EXPOSURE_OPEN."
        test_recipe:
          setup: ["Act MDL-812 v1 EXPOSURE_OPEN with draft window [2026-09-01, 2026-10-01); clock never set (default 2026-09-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-812", version_label: "v1", title: "t", act_type: "MODEL_LAW", committee_name: "c" }, as: AssociationStaff, captures: { act_id: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_COMMENT_WINDOW_OPEN (409)"
            - "ModelAct.${act_id}.status remains EXPOSURE_OPEN"
      - name: filing_state_errors
        claim_type: invalid_transition
        grounds:
          - state_machines.FinancialFiling
          - errors[ERR_FILING_NOT_SUBMITTED]
          - errors[ERR_FILING_NOT_DRAFT]
        distinguishing_aspect: "validate from DRAFT fails with ERR_FILING_NOT_SUBMITTED; a second submit after a successful one fails with ERR_FILING_NOT_DRAFT (repeat trigger on new state)."
        test_recipe:
          setup: ["State CA; insurer 90081; standard VM-81 v1 ACTIVE; one filing created (DRAFT)"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff }
            - { call: "POST /naic/insurers", payload: { naic_code: "90081", name: "A", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_id: $.data.id, ins_v: $.data.version } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-81", version_label: "v1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "Q1", valuation_standard_code: "VM-81", reported_surplus_cents: 1000, asset_risk_cents: 100, underwriting_risk_cents: 50, other_risk_cents: 25, expected_insurer_version: "${ins_v}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /naic/filings/${f_id}/validate", payload: {}, as: AssociationStaff, captures: { e1: $.data.error_id } }
            - { call: "POST /naic/filings/${f_id}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_id}", captures: { st: $.data.status } }
            - { call: "POST /naic/filings/${f_id}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_id}", captures: { e2: $.data.error_id } }
          assert:
            - "validate from DRAFT -> ERR_FILING_NOT_SUBMITTED"
            - "first submit succeeds: status == SUBMITTED"
            - "second submit -> ERR_FILING_NOT_DRAFT"
      - name: license_state_errors
        claim_type: invalid_transition
        grounds:
          - state_machines.ProducerLicense
          - errors[ERR_LICENSE_NOT_ISSUED]
          - errors[ERR_LICENSE_NOT_APPLIED]
        distinguishing_aspect: "revoke from APPLIED, re-issue of an ISSUED license, and re-revoke of a REVOKED license each fail with their state error; terminal REVOKED accepts no further transitions."
        test_recipe:
          setup: ["State CA; producer P-11; one APPLIED license"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/producers", payload: { npn: "P-11", full_name: "P", home_state_code: "CA" }, as: AssociationStaff, captures: { pr_id: $.data.id } }
            - { call: "POST /naic/licenses", payload: { producer_id: "${pr_id}", state_code: "CA", license_class: "LIFE", effective_from: "2027-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: ProducerUser, as_user_id: "${pr_id}", captures: { lic_id: $.data.id } }
          trigger:
            - { call: "POST /naic/licenses/${lic_id}/revoke", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { e1: $.data.error_id } }
            - { call: "POST /naic/licenses/${lic_id}/issue", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { st1: $.data.status } }
            - { call: "POST /naic/licenses/${lic_id}/issue", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { e2: $.data.error_id } }
            - { call: "POST /naic/licenses/${lic_id}/revoke", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { st2: $.data.status } }
            - { call: "POST /naic/licenses/${lic_id}/revoke", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { e3: $.data.error_id } }
          assert:
            - "revoke from APPLIED -> ERR_LICENSE_NOT_ISSUED"
            - "issue succeeds (ISSUED); re-issue -> ERR_LICENSE_NOT_APPLIED"
            - "revoke succeeds (REVOKED); re-revoke -> ERR_LICENSE_NOT_ISSUED (terminal lockdown)"
      - name: review_state_errors
        claim_type: invalid_transition
        grounds:
          - state_machines.AccreditationReview
          - errors[ERR_REVIEW_NOT_FINDINGS_ISSUED]
          - errors[ERR_REVIEW_NOT_SCHEDULED]
        distinguishing_aspect: "finalize from SCHEDULED fails with ERR_REVIEW_NOT_FINDINGS_ISSUED; a second issue-findings from FINDINGS_ISSUED fails with ERR_REVIEW_NOT_SCHEDULED."
        test_recipe:
          setup: ["State CA; one SCHEDULED review led by lead-1"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", team_lead_id: "lead-1", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv1: $.data.id } }
          trigger:
            - { call: "POST /naic/reviews/${rv1}/finalize", payload: {}, as: AssociationStaff, captures: { e1: $.data.error_id } }
            - { call: "POST /naic/reviews/${rv1}/issue-findings", payload: { findings_compliant: 18, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-1", captures: { st: $.data.status } }
            - { call: "POST /naic/reviews/${rv1}/issue-findings", payload: { findings_compliant: 18, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-1", captures: { e2: $.data.error_id } }
          assert:
            - "finalize from SCHEDULED -> ERR_REVIEW_NOT_FINDINGS_ISSUED"
            - "issue-findings succeeds (FINDINGS_ISSUED); repeat -> ERR_REVIEW_NOT_SCHEDULED"
      - name: certify_twice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.StateAdoption
          - errors[ERR_ADOPTION_NOT_PENDING]
        distinguishing_aspect: "Certifying an already CERTIFIED_SIMILAR adoption fails with ERR_ADOPTION_NOT_PENDING (branch lockdown after certification)."
        test_recipe:
          setup: ["State CA; act MDL-813 v1 PUBLISHED; CA holds a PENDING_CERTIFICATION adoption"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id, s_ca_v: $.data.version } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-813", version_label: "v1", title: "t", act_type: "MODEL_LAW", committee_name: "c" }, as: AssociationStaff, captures: { act_id: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${act_id}/close-ballot", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${act_id}/publish", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/adoptions", payload: { model_act_id: "${act_id}", state_code: "CA", adopted_citation: "CIC 813", enacted_on: "2026-11-01T00:00:00Z", expected_state_version: "${s_ca_v}" }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { ad_id: $.data.id } }
          trigger:
            - { call: "POST /naic/adoptions/${ad_id}/certify", payload: { variation_class: "SUBSTANTIALLY_SIMILAR" }, as: AssociationStaff, captures: { st1: $.data.status } }
            - { call: "POST /naic/adoptions/${ad_id}/certify", payload: { variation_class: "SUBSTANTIVE_VARIATIONS" }, as: AssociationStaff, captures: { err: $.data.error_id } }
          assert:
            - "first certify succeeds: status == CERTIFIED_SIMILAR"
            - "second certify -> ERR_ADOPTION_NOT_PENDING (status unchanged)"
      - name: call_close_and_respond_state_errors
        claim_type: invalid_transition
        grounds:
          - state_machines.MarketConductCall
          - errors[ERR_CALL_NO_RESPONSES]
          - errors[ERR_CALL_NOT_OPEN]
        distinguishing_aspect: "close with zero responses fails with ERR_CALL_NO_RESPONSES; responding after a successful close fails with ERR_CALL_NOT_OPEN."
        test_recipe:
          setup: ["State CA; call MC-813 OPEN (total 100000); insurer 90082"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90082", name: "A", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_id: $.data.id } }
            - { call: "POST /naic/market-conduct-calls", payload: { call_code: "MC-813", topic: "t", total_cost_cents: 100000 }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { call_id: $.data.id } }
          trigger:
            - { call: "POST /naic/market-conduct-calls/${call_id}/close", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { e1: $.data.error_id } }
            - { call: "POST /naic/market-conduct-calls/${call_id}/responses", payload: { direct_premium_cents: 5000000, complaint_count: 1 }, as: InsurerUser, as_user_id: "${ins_id}" }
            - { call: "POST /naic/market-conduct-calls/${call_id}/close", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { st: $.data.status } }
            - { call: "POST /naic/market-conduct-calls/${call_id}/responses", payload: { direct_premium_cents: 5000000, complaint_count: 1 }, as: InsurerUser, as_user_id: "${ins_id}", captures: { e2: $.data.error_id } }
          assert:
            - "first close -> ERR_CALL_NO_RESPONSES (422)"
            - "after one response, close succeeds: status == CLOSED"
            - "respond after close -> ERR_CALL_NOT_OPEN (409)"
      - name: license_auto_expires_on_clock_advance
        claim_type: side_effect_execution
        grounds:
          - state_machines.ProducerLicense.ISSUED_to_EXPIRED
        distinguishing_aspect: "Advancing the logical clock past valid_until expires the ISSUED license (system transition) and decrements producer.active_license_count."
        test_recipe:
          setup: ["State CA; producer P-12 with one ISSUED license valid [2027-01-01, 2027-06-30]; active_license_count == 1"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
