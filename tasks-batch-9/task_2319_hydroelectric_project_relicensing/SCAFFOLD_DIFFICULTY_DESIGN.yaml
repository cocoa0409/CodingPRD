              as: Regulator
              captures: { party_n: $.data.id }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: AgencyReviewer
              as_user_id: "u_agency"
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv: $.data.version }
            - call: "POST /relicensing/settlements"
              payload: { project_id: "${proj}", title: "Negotiated package", expected_project_version: "${pv}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { stl: $.data.id }
            - call: "POST /relicensing/pme-measures"
              payload: { project_id: "${proj}", settlement_id: "${stl}", measure_name: "Recreation flow release", resource_category: "RECREATION", source: "SETTLEMENT", capital_cost_usd: 300000.00, annual_om_cost_usd: 10000.00, construction_start_year: 2026, implementation_months: 12, flow_release_cfs: 30, gross_head_ft: 40, release_days: 90 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { m_stl: $.data.id }
            - call: "POST /relicensing/settlements/${stl}/circulate"
              payload: { circulation_note: "round 1" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "${party_n}", position: "SUPPORT" }
              as: Stakeholder
              as_user_id: "u_ngo"
              captures: { sig_r1: $.data.id }
          trigger:
            - call: "POST /relicensing/settlements/${stl}/tally"
              payload: { intended_outcome: "CLOSE_ROUND" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { st_r1: $.data.status, round_after_1: $.data.round_number, pct_r1: $.data.support_pct }
