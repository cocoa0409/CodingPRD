  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: age_rating_floor_elif_chain_snap_up
        grounds:
          - calculations.derived_age_rating
          - entities.Submission.fields.age_rating_answers
          - entities.Submission.fields.derived_age_rating
          - entities.Submission.fields.age_rating_driving_dimension
          - validations[priority=60]
        distinguishing_aspect: |
          MODE (a) branch interaction: the content base is 9 (VIOLENCE level 1) but the if/elif floor
          chain stops at the unmoderated-UGC branch and yields floor_age 17, so derived_age_rating is
          17 and age_rating_driving_dimension is FLOOR_RULE — an implementation that evaluates the
          floors as independent ifs (letting the later `contests` branch overwrite with 12) or that
          reports VIOLENCE as the driving dimension gets a different answer.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE with an ACTIVE IOS DISTRIBUTION_CERT; AppRecord IOS with one PASSED PRIVACY mapping (index 100.00, posture OPEN)"
            - "Submission build 10 with a complete en-US primary MetadataLocale and empty declared_privacy_items"
            - "age_rating_answers: VIOLENCE 1, SEXUAL_CONTENT 0, DRUGS_ALCOHOL 0, GAMBLING_SIMULATED 1, HORROR 0, PROFANITY 0, real_money_gambling false, unrestricted_web_access false, user_generated_content true, ugc_moderation_enabled false, contests true"
            - "attested_age_rating 12 — deliberately below the derived value"
            - "Clock at its 2026-08-01T00:00:00Z default"
