          Cyclic machine on DonationOffer (OPEN -> MATCHED -> OPEN -> MATCHED
          -> SCHEDULED): a DECLINE reverts the offer to OPEN with
          failed_attempts unchanged, and the same driver window and cooler are
          released and re-booked by the second dispatch — proving the cycle
          rather than a one-way pipeline.
