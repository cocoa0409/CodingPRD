            - call: "GET /authorizations"
              payload: { review_id: "${rev}" }
              as: BrokerAccountManager
              captures: { auth: "$.data[0].id", av0: "$.data[0].version" }
          trigger:
            - call: "GET /authorizations/${auth}/voids-report"
