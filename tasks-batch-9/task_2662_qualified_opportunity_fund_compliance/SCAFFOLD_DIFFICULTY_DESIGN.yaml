              as_user_id: "co-measurer-1"
              captures: { bt2_id: $.data.id }
            - call: "POST /qof/business-tests/${bt1_id}/measure"
              payload: { safe_harbor_used: "GROSS_INCOME_ACTUAL", gross_income_zone_amount: 600000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 50000.00, intangibles_total_amount: 100000.00, total_asset_value_measured: 1000000.00 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/business-tests/${bt2_id}/measure"
              payload: { safe_harbor_used: "GROSS_INCOME_ACTUAL", gross_income_zone_amount: 600000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 50000.00, intangibles_total_amount: 100000.00, total_asset_value_measured: 1000000.00 }
