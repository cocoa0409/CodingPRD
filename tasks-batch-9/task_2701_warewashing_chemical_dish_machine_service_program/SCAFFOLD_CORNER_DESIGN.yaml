  - section: errors
    instances:
      - name: each_review_and_case_state_gate_returns_its_own_error_code
        claim_type: Error triggerability
        grounds:
          - errors[ERR_REVIEW_NOT_DRAFT]
          - errors[ERR_REVIEW_NOT_PUBLISHED]
          - errors[ERR_CASE_NOT_IN_REVIEW]
        distinguishing_aspect: |
          Three same-status-code gates on the same workflow must stay distinguishable: publishing a
          PUBLISHED review is ERR_REVIEW_NOT_DRAFT, opening a case against a DRAFT review is
          ERR_REVIEW_NOT_PUBLISHED, and adjudicating a case that is still EVIDENCE_GATHERING is
          ERR_CASE_NOT_IN_REVIEW - all HTTP 409, all reachable from one fixture, and none of them
          collapsing into the generic ERR_INVALID_STATE_TRANSITION.
        test_recipe:
          setup:
            - "One INSTALLED DT-88 placement with a DET-100 dispenser at 8.00 ml/rack, one 20000 ml delivery on 2026-08-02 and 100 racks of DEVICE telemetry inside [2026-08-01, 2026-08-08)."
