            - call: "GET /seasons/${se_id}"
              payload: {}
              as: LeagueAdmin
            - call: "GET /teams/${tm_a_id}"
              payload: {}
              as: LeagueAdmin
            - call: "GET /roster-slots/${rs_id}"
              payload: {}
              as: LeagueAdmin
            - call: "GET /matches/${m_id}"
              payload: {}
              as: LeagueAdmin
            - call: "GET /fair-play-cases/${fp_id}"
              payload: {}
              as: LeagueAdmin
          assert:
            - "TitleApproval.${ta_id}.status == PENDING with decided_by_user_id null, decided_at null"
            - "Season.${se_id}.status == DRAFT and seeding_state == UNSEEDED"
            - "Team.${tm_a_id}.status == DRAFT with registered_at null and roster_locked_at null"
            - "RosterSlot.${rs_id}.verification_status == UNVERIFIED, academic_status == PENDING, participation_status == PROSPECTIVE"
            - "Match.${m_id}.play_status == SCHEDULED, result_status == AWAITING_REPORTS, dispute_status == NONE, broadcast_status == NONE, spectator_strikes == 0"
            - "FairPlayCase.${fp_id}.status == REPORTED with severity null, repeat_index null, applied_penalty == 0 and sanction_type == NONE"
            - "Team.${tm_a_id}.integrity_score == 100.00 — a REPORTED case carries no penalty until it is sustained"

      - name: transitions_from_an_illegal_from_state_are_refused
        claim_type: invalid_transitions
        grounds:
          - state_machines.Season.transitions
          - state_machines.Match.transitions
          - state_machines.TitleApproval.APPROVED_to_REVOKED
          - validations[priority=12]
          - validations[priority=17]
          - validations[priority=18]
          - validations[priority=21]
        distinguishing_aspect: |
          Four machines, four different from-state rejections, four different error
          ids: a Season in DRAFT refuses to_status REGULAR_SEASON (the stage ladder may
          not be skipped), a SCHEDULED Match refuses finalize, a Match with
          dispute_status NONE refuses ACCEPT_REVIEW, and a PENDING TitleApproval
          refuses REVOKE (only APPROVED may be revoked).
        test_recipe:
          setup:
            - "One district, school, two coaches, title, season in DRAFT, one PENDING title approval, two DRAFT teams and one SCHEDULED match"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Alpha", email: "alpha@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Bravo", email: "bravo@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_b_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Rocket Arena", publisher: "Nova Interactive" }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /title-approvals"
              payload: { district_id: "${d_id}", title_id: "${t_id}", requested_by_school_id: "${s_id}" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_a_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_a_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_b_id}", name: "North Bravo" }
              as: Coach
              as_user_id: "${c_b_id}"
              captures: { tm_b_id: $.data.id }
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_a_id}", away_team_id: "${tm_b_id}", scheduled_start_at: "2026-10-01T18:00:00.000Z" }
              as: LeagueAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /seasons/${se_id}/advance"
              payload: { to_status: "REGULAR_SEASON" }
              as: LeagueAdmin
              captures: { e_season: $.data.error_id }
            - call: "POST /matches/${m_id}/finalize"
              payload: {}
              as: LeagueAdmin
              captures: { e_match: $.data.error_id }
            - call: "POST /matches/${m_id}/dispute-actions"
              payload: { action: "ACCEPT_REVIEW" }
              as: LeagueAdmin
              captures: { e_dispute: $.data.error_id }
