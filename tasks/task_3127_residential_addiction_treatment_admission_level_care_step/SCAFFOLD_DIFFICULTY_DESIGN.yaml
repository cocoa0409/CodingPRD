  - name: housing_placement_window_shares_one_open_ended_interval_per_house
    grounds:
    - validations[priority=38]
    - entities.RecoveryHousing.fields.grab_barrier_hours
    - entities.ContinuingCarePlan.fields.housing_window_start
    - errors[ERR_HOUSING_WINDOW_OVERLAP]
    distinguishing_aspect: 'Recovery housing uses a different geometric treatment from the bed rule: when
      grab_barrier_hours is 0 the two placements on one house are treated as sharing a single right-open
      interval [start, +infinity), so ANY later start on the same house is an overlap even if the first
      window''s stated end is long past — while a house with a positive grab_barrier_hours uses the ordinary
      finite interval and accepts a later start beyond the barrier.'
    test_recipe:
      setup:
      - 'Logical clock at 2026-09-05T00:00:00Z on a licensed MN facility with two recovery-housing rows:
        House A (grab_barrier_hours 0) and House B (grab_barrier_hours 0).'
      - A first ACTIVE continuing-care plan on House A with window [2026-09-07T00:00:00Z, 2026-10-07T00:00:00Z).
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /treatment-network/facilities
