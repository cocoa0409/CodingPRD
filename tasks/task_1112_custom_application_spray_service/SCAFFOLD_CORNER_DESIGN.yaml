      - name: close_gate_progression
        claim_type: violation_to_error
        grounds: [state_machines.WorkOrder.COMPLETED_to_CLOSED, "errors[ERR_RECORD_NOT_CERTIFIED]", "errors[ERR_RINSATE_BALANCE_OPEN]", "errors[ERR_INVOICE_UNSETTLED]"]
        distinguishing_aspect: "Close enforces three gates in order: record not certified -> rinsate open -> invoice unsettled; each is peeled away until close succeeds and the order lands CLOSED."
        test_recipe:
          setup: ["base fixture; WO1 COMPLETED 2026-05-10T10:30:00Z (rinsate 24.0, invoice DRAFT 1065000)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 2000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
