# =============================================================================
# SCAFFOLD — Interior Design Project Management (Expert)
# §1.0 – §1.7
# =============================================================================

scenario: "Interior Design Project Management: client brief & budget, room/scope & mood board, FF&E selection & spec, procurement order & tracking, vendor/trade coordination, design fee (flat/hourly/markup), revision/approval, install & punch list."

domain_name: interior-design-pm
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency        # OCC on Project.version for order creation
    - cascading_side_effects        # selection -> order -> budget ledger -> project posture
    - dual_variant_calculation      # provisional vs final design fee; estimated vs landed cost
    - derived_field_reconciliation  # budget ledger fields on Project re-derived from children

  entity_topology: hybrid
  # Project is the aggregate root (hierarchy: Project -> Room -> MoodBoard;
  # Project -> DesignSelection -> ProcurementOrder -> OrderLine), with flat
  # cross-cutting references: DesignSelection -> FFEItem, ProcurementOrder -> Vendor,
  # RevisionRequest -> Room, PunchListItem -> ProcurementOrder, TimeEntry -> Project.

  state_machine_shape: cyclic
  # RevisionRequest carries a revise/resubmit cycle (DRAFT->SUBMITTED->CHANGES_REQUESTED->SUBMITTED).
  # ProcurementOrder is a branching pipeline with a divergent cancel/return branch.
  # Project posture is compound (derived from order + punch-list + approval state).

  relationship_patterns:
    - one_to_many        # Project->Room, Project->DesignSelection, Order->OrderLine
    - cross_aggregate    # DesignSelection->FFEItem, Order->Vendor, PunchListItem->Order
    - polymorphic        # RevisionRequest.target_kind references Room OR DesignSelection

  role_model: peer_roles
  # Designer owns design artifacts; ProcurementCoordinator owns orders/vendors;
  # Client approves/requests revisions and funds the budget; StudioAdmin is operational.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: client_name, type: string, source: input, description: "Client display name from the brief" }
      - { name: client_user_id, type: string, source: input, description: "FK -> Client.id; the Client who owns and funds this project" }
      - { name: brief_summary, type: string, source: input, description: "Short narrative of the client brief" }
      - { name: budget_cents, type: integer, source: input, description: "Total approved client budget in integer cents; must be > 0", constraints: "> 0" }
      - { name: fee_model, type: enum, source: input, description: "FLAT | HOURLY | MARKUP — the design-fee billing model fixed at creation", constraints: "one of FLAT, HOURLY, MARKUP" }
      - { name: flat_fee_cents, type: integer, source: input, default: 0, description: "Fixed design fee in cents; required and > 0 when fee_model=FLAT, else must be 0" }
      - { name: hourly_rate_cents, type: integer, source: input, default: 0, description: "Billing rate per hour in cents; required and > 0 when fee_model=HOURLY, else must be 0" }
      - { name: markup_pct, type: number, source: input, default: 0, description: "Markup fraction on procurement net (e.g. 0.30); required and in (0,1) when fee_model=MARKUP, else must be 0" }
      - { name: status, type: enum, source: system, description: "BRIEFING -> IN_DESIGN -> PROCUREMENT -> INSTALLATION -> CLOSED / ON_HOLD", constraints: "one of BRIEFING, IN_DESIGN, PROCUREMENT, INSTALLATION, CLOSED, ON_HOLD" }
      - { name: posture, type: enum, source: computed, description: "OPEN | BUDGET_REVIEW | FROZEN — derived gate over budget utilization, open revisions, and unresolved punch items" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of order_subtotal_cents for ProcurementOrders whose status IN {ORDERED, IN_TRANSIT, DELIVERED}" }
      - { name: design_fee_cents, type: integer, source: computed, description: "Finalized design fee per fee_model (see §1.3 design_fee_final)" }
      - { name: budget_remaining_cents, type: integer, source: computed, description: "budget_cents - committed_cents - design_fee_cents" }
      - { name: budget_status, type: enum, source: computed, description: "GREEN | AMBER | RED tier from budget utilization (see §1.3 budget_health)" }
      - { name: client_credit_cents, type: integer, source: computed, default: 0, description: "Unallocated remainder of client deposits after waterfall allocation (see §1.3 deposit_waterfall)" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Client account display name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across Clients" }

  - name: Room
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: name, type: string, source: input, description: "Room label, e.g. 'Primary Bedroom'; unique within a project (case-sensitive)" }
      - { name: scope_note, type: string, source: input, description: "Scope description for the room" }
      - { name: room_budget_cents, type: integer, source: input, description: "Allocated budget slice for this room in cents; must be >= 0", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCOPING -> MOODBOARD_READY -> APPROVED / REWORK", constraints: "one of SCOPING, MOODBOARD_READY, APPROVED, REWORK" }
      - { name: approved_moodboard_id, type: string, source: system, default: null, description: "FK -> MoodBoard.id; the MoodBoard pinned when the room was approved (null until APPROVED)" }

  - name: MoodBoard
    parent: Room
    common_fields: true
    fields:
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; owning room" }
      - { name: title, type: string, source: input, description: "Mood board title" }
      - { name: palette, type: array, source: input, description: "List of color/material tokens" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PRESENTED -> ACCEPTED / SUPERSEDED", constraints: "one of DRAFT, PRESENTED, ACCEPTED, SUPERSEDED" }

  - name: FFEItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU; unique across FFEItems" }
      - { name: name, type: string, source: input, description: "Item display name (e.g. 'Eames Lounge Chair')" }
      - { name: category, type: enum, source: input, description: "FURNITURE | LIGHTING | TEXTILE | DECOR | FIXTURE", constraints: "one of FURNITURE, LIGHTING, TEXTILE, DECOR, FIXTURE" }
      - { name: list_unit_cost_cents, type: integer, source: input, description: "Catalog list unit cost in cents; must be > 0", constraints: "> 0" }
      - { name: lead_time_days, type: integer, source: input, description: "Default lead time in days; must be >= 0", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the SKU is selectable; inactive SKUs cannot be added to new selections" }

  - name: DesignSelection
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; the room this selection furnishes (must belong to project_id)" }
      - { name: ffe_item_id, type: string, source: input, description: "FK -> FFEItem.id; the selected catalog item" }
      - { name: quantity, type: integer, source: input, description: "Units selected; must be >= 1", constraints: ">= 1" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Snapshot of FFEItem.list_unit_cost_cents at selection time (spec pin)" }
      - { name: trade_discount_pct, type: number, source: input, default: 0, description: "Per-line trade discount fraction in [0, 0.5]", constraints: "0 <= x <= 0.5" }
      - { name: spec_note, type: string, source: input, default: "", description: "Specification note (finish, fabric, etc.)" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> SPECIFIED -> ORDERED / WITHDRAWN", constraints: "one of PROPOSED, SPECIFIED, ORDERED, WITHDRAWN" }
      - { name: line_net_cents, type: integer, source: computed, description: "round(unit_cost_cents * quantity * (1 - trade_discount_pct)); round_half_up (see §1.3 selection_line_net)" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor/trade company name" }
      - { name: trade, type: enum, source: input, description: "SUPPLIER | UPHOLSTERY | MILLWORK | ELECTRICAL | GENERAL", constraints: "one of SUPPLIER, UPHOLSTERY, MILLWORK, ELECTRICAL, GENERAL" }
      - { name: standing, type: enum, source: input, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED vendors cannot receive new orders", constraints: "one of ACTIVE, SUSPENDED" }
      - { name: lead_time_buffer_days, type: integer, source: input, default: 0, description: "Extra days the vendor adds on top of item lead time; must be >= 0", constraints: ">= 0" }

  - name: ProcurementOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; vendor fulfilling the order" }
      - { name: window_start, type: datetime, source: input, description: "Requested install-delivery window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Requested install-delivery window end (ISO 8601 UTC); must be > window_start" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ORDERED -> IN_TRANSIT -> DELIVERED -> CLOSED; with ORDERED/IN_TRANSIT -> CANCELLED and DELIVERED -> RETURNED branches", constraints: "one of DRAFT, ORDERED, IN_TRANSIT, DELIVERED, CLOSED, CANCELLED, RETURNED" }
      - { name: order_subtotal_cents, type: integer, source: computed, description: "Sum of line_net_cents over the DesignSelections attached to this order (see §1.3 order_subtotal)" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative client deposit allocated to this order by the waterfall (see §1.3 deposit_waterfall)" }
      - { name: balance_due_cents, type: integer, source: computed, description: "order_subtotal_cents - amount_paid_cents" }
      - { name: expected_delivery_at, type: datetime, source: computed, description: "Latest (FFEItem.lead_time_days + Vendor.lead_time_buffer_days) over attached selections, added to order's ORDERED timestamp" }

  - name: OrderLine
    parent: ProcurementOrder
    common_fields: false   # carries only id, created_at; immutable join row
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ProcurementOrder.id; owning order" }
      - { name: selection_id, type: string, source: input, description: "FK -> DesignSelection.id; the selection placed onto the order" }
      - { name: line_net_cents_snapshot, type: integer, source: system, description: "Snapshot of DesignSelection.line_net_cents at the moment it was attached to the order" }

  - name: RevisionRequest
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: target_kind, type: enum, source: input, description: "ROOM | SELECTION — which artifact type this revision targets", constraints: "one of ROOM, SELECTION" }
      - { name: target_id, type: string, source: input, description: "FK -> Room.id when target_kind=ROOM, else FK -> DesignSelection.id; the artifact under revision" }
      - { name: note, type: string, source: input, description: "Client's revision request narrative" }
      - { name: round_no, type: integer, source: system, default: 1, description: "Revision round counter; increments each time the request is re-submitted after CHANGES_REQUESTED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED (cycle) -> RESOLVED / DISMISSED", constraints: "one of DRAFT, SUBMITTED, CHANGES_REQUESTED, RESOLVED, DISMISSED" }

  - name: PunchListItem
    parent: ProcurementOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ProcurementOrder.id; the delivered order this defect was found against" }
      - { name: description, type: string, source: input, description: "Defect / install issue description" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | BLOCKING; BLOCKING items freeze project close", constraints: "one of MINOR, MAJOR, BLOCKING" }
      - { name: status, type: enum, source: system, description: "OPEN -> RESOLVED / WAIVED", constraints: "one of OPEN, RESOLVED, WAIVED" }

  - name: TimeEntry
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project the work was billed against" }
      - { name: designer_user_id, type: string, source: input, description: "Opaque Designer operator id who logged the time" }
      - { name: minutes, type: integer, source: input, description: "Worked minutes; must be >= 1", constraints: ">= 1" }
      - { name: billable, type: boolean, source: input, default: true, description: "Whether this entry counts toward an HOURLY design fee" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED / REJECTED", constraints: "one of SUBMITTED, APPROVED, REJECTED" }

  - name: PaymentReceipt
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project credited" }
      - { name: amount_cents, type: integer, source: input, description: "Client deposit amount in cents; must be > 0", constraints: "> 0" }
      - { name: received_at, type: datetime, source: input, description: "When the deposit was received (ISO 8601 UTC)" }
      - { name: memo, type: string, source: input, default: "", description: "Free-text memo" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Project status (lifecycle) ----
  - entity: Project
    initial_state: BRIEFING
    terminal_states: [CLOSED]
    transitions:
      - from: BRIEFING
        to: IN_DESIGN
        trigger: "POST /projects/{project_id}/advance (to=IN_DESIGN)"
        actor: Designer
        preconditions:
          - "At least one Room exists for the project"
        side_effects:
          - "status -> IN_DESIGN"
          - "increments Project.version by 1"

      - from: IN_DESIGN
        to: PROCUREMENT
        trigger: "POST /projects/{project_id}/advance (to=PROCUREMENT)"
        actor: Designer
        preconditions:
          - "Every Room is APPROVED (no Room in SCOPING, MOODBOARD_READY, or REWORK) — cross-entity (ERR_ROOMS_NOT_APPROVED)"
          - "No RevisionRequest in SUBMITTED or CHANGES_REQUESTED (ERR_OPEN_REVISION)"
        side_effects:
          - "status -> PROCUREMENT"
          - "increments Project.version by 1"

      - from: PROCUREMENT
        to: INSTALLATION
        trigger: "POST /projects/{project_id}/advance (to=INSTALLATION)"
        actor: ProcurementCoordinator
        preconditions:
          - "At least one ProcurementOrder exists with status IN {IN_TRANSIT, DELIVERED} (ERR_NO_ORDERS_IN_FLIGHT)"
        side_effects:
          - "status -> INSTALLATION"
          - "increments Project.version by 1"

      - from: INSTALLATION
        to: CLOSED
        trigger: "POST /projects/{project_id}/close"
        actor: StudioAdmin
        preconditions:
          - "posture must not be FROZEN — i.e. no PunchListItem with status=OPEN AND severity=BLOCKING (ERR_PROJECT_FROZEN)"
          - "Every ProcurementOrder is in a terminal-for-close state IN {CLOSED, CANCELLED, RETURNED, DELIVERED} (ERR_ORDERS_OPEN)"
        side_effects:
          - "status -> CLOSED"
          - "design_fee_cents finalized via §1.3 design_fee_final"
          - "increments Project.version by 1"

      - from: BRIEFING
        to: ON_HOLD
        trigger: "POST /projects/{project_id}/hold"
        actor: StudioAdmin
        preconditions: []
        side_effects: ["status -> ON_HOLD", "increments Project.version by 1"]
      - from: IN_DESIGN
        to: ON_HOLD
        trigger: "POST /projects/{project_id}/hold"
        actor: StudioAdmin
        preconditions: []
        side_effects: ["status -> ON_HOLD", "increments Project.version by 1"]
      - from: PROCUREMENT
        to: ON_HOLD
        trigger: "POST /projects/{project_id}/hold"
        actor: StudioAdmin
        preconditions: []
        side_effects: ["status -> ON_HOLD", "increments Project.version by 1"]
      - from: ON_HOLD
        to: IN_DESIGN
        trigger: "POST /projects/{project_id}/resume"
        actor: StudioAdmin
        preconditions: []
        note: "resume always returns the project to IN_DESIGN regardless of pre-hold status"
        side_effects: ["status -> IN_DESIGN", "increments Project.version by 1"]

  # ---- Project posture (compound, derived gate) ----
  - entity: Project
    field: posture
    derivation: |
      Recomputed after every mutation touching orders, revisions, punch items, the
      budget ledger, or time/fee state. Priority order (first match wins):
        1) FROZEN if any PunchListItem with status=OPEN AND severity=BLOCKING exists
           on any ProcurementOrder of the project.
        2) FROZEN if budget_status (see §1.3 budget_health) is RED.
        3) BUDGET_REVIEW if budget_status is AMBER.
        4) BUDGET_REVIEW if any RevisionRequest is in SUBMITTED or CHANGES_REQUESTED.
        5) Otherwise OPEN.
      posture=FROZEN blocks: creating new ProcurementOrders, advancing to INSTALLATION,
      and closing the project. posture=BUDGET_REVIEW blocks creating new ProcurementOrders
      only. (See §1.4 priorities 6–7.)

  # ---- Room ----
  - entity: Room
    initial_state: SCOPING
    terminal_states: []
    transitions:
      - from: SCOPING
        to: MOODBOARD_READY
        trigger: "POST /rooms/{room_id}/present-moodboard"
        actor: Designer
        preconditions:
          - "At least one MoodBoard for the room is in status=PRESENTED — cross-entity (ERR_NO_PRESENTED_MOODBOARD)"
        side_effects: ["status -> MOODBOARD_READY", "increments Room.version by 1"]
      - from: MOODBOARD_READY
        to: APPROVED
        trigger: "POST /rooms/{room_id}/approve"
        actor: Client
        preconditions:
          - "Exactly one MoodBoard for the room is in status=PRESENTED (ERR_NO_PRESENTED_MOODBOARD)"
        side_effects:
          - "status -> APPROVED"
          - "the PRESENTED MoodBoard -> ACCEPTED; all other DRAFT/PRESENTED MoodBoards for the room -> SUPERSEDED (cascade)"
          - "approved_moodboard_id set to the ACCEPTED MoodBoard id"
          - "increments Room.version by 1"
      - from: MOODBOARD_READY
        to: REWORK
        trigger: "POST /rooms/{room_id}/request-rework"
        actor: Client
        preconditions: []
        side_effects:
          - "status -> REWORK"
          - "the PRESENTED MoodBoard -> SUPERSEDED (cascade)"
          - "increments Room.version by 1"
      - from: REWORK
        to: SCOPING
        trigger: "POST /rooms/{room_id}/reopen-scope"
        actor: Designer
        preconditions: []
        side_effects: ["status -> SCOPING", "increments Room.version by 1"]
      - from: APPROVED
        to: REWORK
        trigger: "system: a RESOLVED RevisionRequest with target_kind=ROOM targeting this room"
        actor: system
        preconditions: []
        note: "compensation hop — re-opening an approved room when a revision lands"
        side_effects:
          - "status -> REWORK"
          - "approved_moodboard_id cleared to null"
          - "the ACCEPTED MoodBoard -> SUPERSEDED (cascade)"
          - "increments Room.version by 1"

  # ---- MoodBoard ----
  - entity: MoodBoard
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /moodboards/{moodboard_id}/present"
        actor: Designer
        preconditions:
          - "No other MoodBoard for the same room is already in status=PRESENTED (ERR_MOODBOARD_ALREADY_PRESENTED)"
        side_effects: ["status -> PRESENTED", "increments MoodBoard.version by 1"]
      - from: PRESENTED
        to: ACCEPTED
        trigger: "system: room approval (bubble-up from Room.approve)"
        actor: system
        preconditions: []
        side_effects: ["status -> ACCEPTED", "increments MoodBoard.version by 1"]
      - from: PRESENTED
        to: SUPERSEDED
        trigger: "system: room rework or a sibling board accepted"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED", "increments MoodBoard.version by 1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a sibling board accepted on room approval"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED", "increments MoodBoard.version by 1"]

  # ---- DesignSelection ----
  - entity: DesignSelection
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: SPECIFIED
        trigger: "POST /selections/{selection_id}/specify"
        actor: Designer
        preconditions:
          - "The selection's Room is APPROVED — cross-entity (ERR_ROOM_NOT_APPROVED)"
          - "spec_note is non-empty (ERR_SPEC_NOTE_REQUIRED)"
        side_effects: ["status -> SPECIFIED", "increments DesignSelection.version by 1"]
      - from: SPECIFIED
        to: ORDERED
        trigger: "system: selection attached to an order that transitions DRAFT -> ORDERED"
        actor: system
        preconditions: []
        side_effects:
          - "status -> ORDERED"
          - "increments DesignSelection.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /selections/{selection_id}/withdraw"
        actor: Designer
        preconditions: []
        side_effects: ["status -> WITHDRAWN", "increments DesignSelection.version by 1"]
      - from: SPECIFIED
        to: WITHDRAWN
        trigger: "POST /selections/{selection_id}/withdraw"
        actor: Designer
        preconditions:
          - "The selection is not attached to any non-CANCELLED ProcurementOrder (ERR_SELECTION_ON_ORDER)"
        side_effects: ["status -> WITHDRAWN", "increments DesignSelection.version by 1"]

  # ---- ProcurementOrder (branching pipeline + cancel/return branches) ----
  - entity: ProcurementOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED, RETURNED]
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: "POST /orders/{order_id}/place"
        actor: ProcurementCoordinator
        preconditions:
          - "Order has at least one OrderLine (ERR_ORDER_EMPTY)"
          - "Vendor.standing is ACTIVE (ERR_VENDOR_SUSPENDED)"
          - "Project posture is not FROZEN and not BUDGET_REVIEW (ERR_PROJECT_FROZEN / ERR_BUDGET_GATE)"
          - "The requested [window_start, window_end) does not overlap another non-terminal order on the SAME vendor; windows are half-open so touching endpoints do not conflict (ERR_VENDOR_WINDOW_CONFLICT)"
        side_effects:
          - "status -> ORDERED"
          - "every attached DesignSelection: SPECIFIED -> ORDERED (cascade)"
          - "expected_delivery_at computed from lead times (see §1.3)"
          - "Project.committed_cents recomputed; Project.budget_status & posture recomputed (cascade)"
          - "increments Project.version by 1"
      - from: ORDERED
        to: IN_TRANSIT
        trigger: "POST /orders/{order_id}/ship"
        actor: ProcurementCoordinator
        preconditions: []
        side_effects: ["status -> IN_TRANSIT", "increments ProcurementOrder.version by 1"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /orders/{order_id}/deliver"
        actor: ProcurementCoordinator
        preconditions: []
        side_effects: ["status -> DELIVERED", "increments ProcurementOrder.version by 1"]
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /orders/{order_id}/close-order"
        actor: ProcurementCoordinator
        preconditions:
          - "No PunchListItem on this order is in status=OPEN (ERR_PUNCH_ITEMS_OPEN)"
        side_effects: ["status -> CLOSED", "increments ProcurementOrder.version by 1"]
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /orders/{order_id}/cancel"
        actor: ProcurementCoordinator
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "every attached DesignSelection reverts ORDERED -> SPECIFIED (compensation cascade)"
          - "Project.committed_cents recomputed (order leaves committed set); budget_status & posture recomputed (cascade)"
          - "any client deposit previously allocated to this order is released back to Project.client_credit_cents via re-running §1.3 deposit_waterfall (cascade)"
          - "increments Project.version by 1"
      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /orders/{order_id}/cancel"
        actor: ProcurementCoordinator
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "every attached DesignSelection reverts ORDERED -> SPECIFIED (compensation cascade)"
          - "Project.committed_cents recomputed; budget_status & posture recomputed (cascade)"
          - "deposit re-allocated via §1.3 deposit_waterfall (cascade)"
          - "increments Project.version by 1"
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /orders/{order_id}/return-order"
        actor: ProcurementCoordinator
        preconditions:
          - "Order has at least one PunchListItem with severity=BLOCKING (ERR_RETURN_NOT_JUSTIFIED)"
        side_effects:
          - "status -> RETURNED"
          - "every attached DesignSelection reverts ORDERED -> SPECIFIED (compensation cascade)"
          - "all OPEN PunchListItems on this order -> WAIVED (cascade)"
          - "Project.committed_cents recomputed; budget_status & posture recomputed (cascade)"
          - "deposit re-allocated via §1.3 deposit_waterfall (cascade)"
          - "increments Project.version by 1"

  # ---- RevisionRequest (cyclic: revise/resubmit loop) ----
  - entity: RevisionRequest
    initial_state: DRAFT
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /revisions/{revision_id}/submit"
        actor: Client
        preconditions:
          - "Project.status is IN {IN_DESIGN, PROCUREMENT} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> SUBMITTED"
          - "Project posture recomputed (an open revision pushes posture toward BUDGET_REVIEW per §1.2 derivation) (cascade)"
          - "increments RevisionRequest.version by 1"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /revisions/{revision_id}/request-changes"
        actor: Designer
        preconditions: []
        side_effects: ["status -> CHANGES_REQUESTED", "increments RevisionRequest.version by 1"]
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /revisions/{revision_id}/submit"
        actor: Client
        preconditions:
          - "Project.status is IN {IN_DESIGN, PROCUREMENT} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> SUBMITTED"
          - "round_no increments by 1 (cycle counter)"
          - "increments RevisionRequest.version by 1"
      - from: SUBMITTED
        to: RESOLVED
        trigger: "POST /revisions/{revision_id}/resolve"
        actor: Designer
        preconditions: []
        side_effects:
          - "status -> RESOLVED"
          - "if target_kind=ROOM and the target Room is APPROVED, that Room reverts APPROVED -> REWORK (compensation cascade — itself cascades the ACCEPTED MoodBoard -> SUPERSEDED)"
          - "Project posture recomputed (cascade)"
          - "increments RevisionRequest.version by 1"
      - from: SUBMITTED
        to: DISMISSED
        trigger: "POST /revisions/{revision_id}/dismiss"
        actor: Designer
        preconditions: []
        side_effects:
          - "status -> DISMISSED"
          - "Project posture recomputed (cascade)"
          - "increments RevisionRequest.version by 1"

  # ---- PunchListItem ----
  - entity: PunchListItem
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /punch-items/{punch_item_id}/resolve"
        actor: ProcurementCoordinator
        preconditions: []
        side_effects:
          - "status -> RESOLVED"
          - "Project posture recomputed (clearing the last OPEN+BLOCKING item may lift FROZEN) (cascade)"
          - "increments PunchListItem.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /punch-items/{punch_item_id}/waive"
        actor: Client
        preconditions: []
        side_effects:
          - "status -> WAIVED"
          - "Project posture recomputed (cascade)"
          - "increments PunchListItem.version by 1"

  # ---- TimeEntry ----
  - entity: TimeEntry
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /time-entries/{time_entry_id}/approve"
        actor: StudioAdmin
        preconditions:
          - "Project.fee_model is HOURLY (ERR_FEE_MODEL_MISMATCH)"
        side_effects:
          - "status -> APPROVED"
          - "Project.design_fee_cents recomputed (provisional & final) (cascade)"
          - "Project.budget_status & posture recomputed (cascade)"
          - "increments TimeEntry.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /time-entries/{time_entry_id}/reject"
        actor: StudioAdmin
        preconditions: []
        side_effects: ["status -> REJECTED", "increments TimeEntry.version by 1"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC — true races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: order-place-stale-project
    parent_entity: Project
    write_endpoint: "POST /orders/{order_id}/place"
    occ_field: "expected_project_version"
    description: |
      Placing a ProcurementOrder commits its subtotal against the project's
      shared budget ledger and re-derives budget_status and posture. A client
      that last observed the project before another order was placed holds a
      stale view of committed_cents and budget headroom; placing on that stale
      version is rejected so the budget gate is evaluated against current
      committed spend rather than an outdated snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: deposit-record-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{project_id}/payments"
    occ_field: "expected_project_version"
    description: |
      Recording a client deposit triggers the deposit waterfall, which re-allocates
      amount_paid across all outstanding orders by created_at. A deposit recorded
      against a stale project version may have been computed against an order set
      that has since changed (an order cancelled or a prior deposit recorded),
      so the waterfall result would be wrong; the stale-version deposit is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: selection_line_net
    trigger: "DesignSelection create; recomputed if trade_discount_pct edited before SPECIFIED"
    algorithm: tiered_pricing
    formula: |
      line_net_cents = round_half_up( unit_cost_cents * quantity * (1 - trade_discount_pct) )
      unit_cost_cents is the value snapshotted from FFEItem.list_unit_cost_cents at create time.
      Rounding is applied ONCE, at the line level (this is the per-line rounding the
      order subtotal then sums — see order_subtotal, which PINS round-then-sum).
    input_set: "single DesignSelection row"
    constants: {}
    precision: "integer cents, round_half_up at the line"

  - name: order_subtotal
    trigger: "OrderLine attach/detach; ProcurementOrder place"
    algorithm: aggregation
    formula: |
      order_subtotal_cents = SUM over OrderLine of OrderLine.line_net_cents_snapshot
      ROUNDING ORDER IS PINNED: each line is rounded to whole cents FIRST (in
      selection_line_net), THEN the rounded line nets are summed. The order is
      "round per line, then sum" — NOT "sum the exact products then round once".
      The two orders can differ by a cent when trade discounts produce fractional
      sub-cents (e.g. 12999*3*(1-0.125)=34122.375 -> 34122 per line).
    input_set: "all OrderLine rows whose order_id == this order (snapshots are frozen at attach time)"
    constants: {}
    precision: "integer cents; per-line round_half_up first, then exact integer sum"
    variants:
      - name: round_then_sum
        when: "always — this is the pinned order"
        difference: "rounds each line before summing; contrast sum-then-round which is forbidden"

  - name: design_fee_final
    trigger: "Project close; TimeEntry approve; order status changes (for MARKUP)"
    algorithm: weighted_scoring
    formula: |
      Selected by Project.fee_model:
        FLAT:   design_fee_cents = flat_fee_cents
        HOURLY: billable_hours = SUM over TimeEntry where status=APPROVED and billable=true of
                  ceil_to_quarter_hours(minutes)
                  where ceil_to_quarter_hours(m) = ceil(m / 15) * 0.25   (hours)
                design_fee_cents = round_half_up( billable_hours * hourly_rate_cents )
        MARKUP: design_fee_cents = round_half_up( markup_pct * committed_base )
                  where committed_base = SUM of order_subtotal_cents over ProcurementOrders
                  whose status IN {ORDERED, IN_TRANSIT, DELIVERED}  (DELIVERED-or-in-flight base)
    input_set: "fee_model selects the branch; HOURLY filters APPROVED+billable time; MARKUP filters committed orders"
    constants:
      QUARTER_HOUR_FRACTION: 0.25
      MINUTES_PER_QUARTER: 15
    precision: "integer cents, round_half_up applied once at the end"
    variants:
      - name: provisional_fee
        when: "shown while project is open (status != CLOSED)"
        difference: |
          HOURLY provisional counts TimeEntry where status IN {SUBMITTED, APPROVED} and billable=true
          (includes not-yet-approved time); MARKUP provisional uses committed_base PLUS any DRAFT order
          subtotals (status IN {DRAFT, ORDERED, IN_TRANSIT, DELIVERED}). FLAT provisional == final.
      - name: final_fee
        when: "pinned at Project close into design_fee_cents"
        difference: "HOURLY counts only status=APPROVED billable time; MARKUP uses only committed_base {ORDERED,IN_TRANSIT,DELIVERED}; this is the value written to design_fee_cents."

  - name: budget_health
    trigger: "any change to committed_cents, design_fee_cents, or budget_cents"
    algorithm: threshold
    formula: |
      utilization = (committed_cents + design_fee_cents) / budget_cents
        where design_fee_cents uses the provisional variant while open, final at close.
      budget_remaining_cents = budget_cents - committed_cents - design_fee_cents
      budget_status:
        GREEN  if utilization <= 0.80
        AMBER  if 0.80 < utilization <= 1.00
        RED    if utilization > 1.00
      Boundaries are inclusive on the LOWER tier (<=): utilization exactly 0.80 -> GREEN,
      exactly 1.00 -> AMBER. Comparison uses exact rational arithmetic (no pre-rounding of utilization).
    input_set: "Project committed_cents, design_fee_cents (provisional while open), budget_cents"
    constants:
      GREEN_CEIL: 0.80
      AMBER_CEIL: 1.00
    precision: "utilization compared as exact ratio; remaining in integer cents"

  - name: deposit_waterfall
    trigger: "PaymentReceipt create; order cancel/return (re-allocation)"
    algorithm: waterfall_allocation
    formula: |
      pool = SUM of PaymentReceipt.amount_cents over all receipts for the project.
      outstanding_orders = ProcurementOrders with status IN {ORDERED, IN_TRANSIT, DELIVERED},
        sorted by created_at ASC; tie-break by created_at then there is no id tie-break needed
        (created_at is unique per insert; if two share a timestamp, the earlier-inserted, i.e.
        smaller created_at, still wins — never use id).
      Walk the sorted orders, filling each order's balance fully before moving to the next:
        for order in outstanding_orders (created_at ASC):
          pay = min(pool_remaining, order.order_subtotal_cents)
          order.amount_paid_cents = pay
          order.balance_due_cents = order.order_subtotal_cents - pay
          pool_remaining -= pay
      Project.client_credit_cents = pool_remaining   (unallocated remainder)
      Orders not in the outstanding set have amount_paid_cents = 0.
    input_set: "all PaymentReceipts (sum) allocated across outstanding orders in created_at ASC order"
    constants: {}
    precision: "integer cents; no fractional split — each order filled fully before the next"

  - name: expected_delivery
    trigger: "ProcurementOrder place (DRAFT -> ORDERED)"
    algorithm: aggregation
    formula: |
      For each OrderLine, look up its DesignSelection -> FFEItem.lead_time_days plus the
      order's Vendor.lead_time_buffer_days. order_lead_days = MAX over lines of
      (FFEItem.lead_time_days + Vendor.lead_time_buffer_days).
      expected_delivery_at = (timestamp at which the order entered ORDERED) + order_lead_days days.
    input_set: "all OrderLines of the order; their FFEItems; the order's Vendor"
    constants: {}
    precision: "datetime (whole-day addition)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7; entity_backed roles acting on a resource must own it (Client must own the Project)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists, validated left-to-right; child must belong to the parent named in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Required body fields present, well-typed, and within declared constraints (enums, numeric ranges, window_end > window_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH"

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "posture=FROZEN blocks order placement, advance-to-INSTALLATION, and project close (BLOCKING punch item open or budget RED)"
    error_id: ERR_PROJECT_FROZEN
    http_status: 409
    applies_to: "POST /orders/{order_id}/place, advance, close"

  - priority: 7
    category: business_fiscal
    check: "posture=BUDGET_REVIEW (budget_status AMBER) blocks NEW order placement"
    error_id: ERR_BUDGET_GATE
    http_status: 409
    applies_to: "POST /orders/{order_id}/place"

  - priority: 8
    category: business_referential
    check: "Vendor.standing must be ACTIVE to place an order on it"
    error_id: ERR_VENDOR_SUSPENDED
    http_status: 409
    applies_to: "POST /orders/{order_id}/place"

  - priority: 9
    category: business_temporal
    check: "Order [window_start, window_end) must not overlap another non-terminal order on the SAME vendor (half-open intervals: shared endpoints do not conflict)"
    error_id: ERR_VENDOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /orders/{order_id}/place"

  - priority: 10
    category: business_constraint
    check: "Order must have at least one OrderLine before it can be placed"
    error_id: ERR_ORDER_EMPTY
    http_status: 409
    applies_to: "POST /orders/{order_id}/place"

  - priority: 11
    category: business_referential
    check: "A DesignSelection may be attached to at most one non-CANCELLED order; selection's room must belong to the order's project"
    error_id: ERR_SELECTION_ALREADY_ORDERED
    http_status: 409
    applies_to: "POST /orders/{order_id}/lines"

  - priority: 12
    category: business_constraint
    check: "FFEItem.active must be true to create a DesignSelection referencing it"
    error_id: ERR_FFE_ITEM_INACTIVE
    http_status: 409
    applies_to: "POST /projects/{project_id}/selections"

  - priority: 13
    category: business_constraint
    check: "Room.name unique within its project; FFEItem.sku unique; Client.email unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /projects/{project_id}/rooms, POST /ffe-items, POST /clients"

  - priority: 14
    category: business_constraint
    check: "fee_model field consistency: FLAT requires flat_fee_cents>0 & others 0; HOURLY requires hourly_rate_cents>0 & others 0; MARKUP requires 0<markup_pct<1 & others 0"
    error_id: ERR_FEE_MODEL_FIELDS
    http_status: 422
    applies_to: "POST /projects"

  - priority: 15
    category: concurrency
    check: "expected_project_version must equal current Project.version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{order_id}/place, POST /projects/{project_id}/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Client -----
  - { method: POST, path: "/clients", description: "Register a Client account", roles: [StudioAdmin], code: 201, input: [display_name, email], output: Client, side_effects: ["unique email enforced"] }
  - { method: GET, path: "/clients/{id}", description: "Get a Client", roles: [StudioAdmin, Client], code: 200, input: [], output: Client, side_effects: [] }

  # ----- Project -----
  - method: POST
    path: "/projects"
    description: "Create a Project from the client brief"
    roles: [StudioAdmin]
    code: 201
    input: [client_name, client_user_id, brief_summary, budget_cents, fee_model, "flat_fee_cents?", "hourly_rate_cents?", "markup_pct?"]
    output: Project
    side_effects: ["status=BRIEFING; posture=OPEN; ledger fields initialized to 0; budget_status computed"]
  - { method: GET, path: "/projects/{id}", description: "Get a Project incl. derived ledger fields & posture", roles: [StudioAdmin, Designer, ProcurementCoordinator, Client], code: 200, input: [], output: Project, side_effects: [] }
  - { method: GET, path: "/projects", description: "List projects (filter by client_user_id => FK reverse-reachability for Project.client_user_id)", roles: [StudioAdmin, Designer, ProcurementCoordinator, Client], code: 200, input: ["client_user_id?", "limit?", "offset?"], output: "Project[]", side_effects: [] }
  - { method: POST, path: "/projects/{project_id}/advance", description: "Advance project status forward", roles: [Designer, ProcurementCoordinator], code: 200, input: [to], output: Project, side_effects: ["status transition per §1.2; increments Project.version"] }
  - { method: POST, path: "/projects/{project_id}/hold", description: "Put project ON_HOLD", roles: [StudioAdmin], code: 200, input: [], output: Project, side_effects: ["status -> ON_HOLD; increments Project.version"] }
  - { method: POST, path: "/projects/{project_id}/resume", description: "Resume an ON_HOLD project to IN_DESIGN", roles: [StudioAdmin], code: 200, input: [], output: Project, side_effects: ["status -> IN_DESIGN; increments Project.version"] }
  - method: POST
    path: "/projects/{project_id}/close"
    description: "Close the project (finalize design fee)"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["status -> CLOSED; design_fee_cents finalized (design_fee_final); budget_status recomputed; increments Project.version"]
  - { method: GET, path: "/projects/{project_id}/fee-quote", description: "Computed read: provisional & final design fee + budget snapshot", roles: [StudioAdmin, Designer, Client], code: 200, input: [], output: Project, side_effects: [] }

  # ----- Payments -----
  - method: POST
    path: "/projects/{project_id}/payments"
    description: "Record a client deposit (OCC on Project.version)"
    roles: [StudioAdmin]
    code: 201
    input: [amount_cents, received_at, "memo?", expected_project_version]
    output: PaymentReceipt
    side_effects: ["deposit_waterfall re-allocates amount_paid across outstanding orders; client_credit_cents updated; increments Project.version"]
  - { method: GET, path: "/payments/{id}", description: "Get a payment receipt", roles: [StudioAdmin, Client], code: 200, input: [], output: PaymentReceipt, side_effects: [] }
  - { method: GET, path: "/payments", description: "List payment receipts (filter by project_id => FK reverse-reachability for PaymentReceipt.project_id)", roles: [StudioAdmin, Client], code: 200, input: ["project_id?", "limit?", "offset?"], output: "PaymentReceipt[]", side_effects: [] }

  # ----- Room -----
  - { method: POST, path: "/projects/{project_id}/rooms", description: "Add a room/scope", roles: [Designer], code: 201, input: [name, scope_note, room_budget_cents], output: Room, side_effects: ["status=SCOPING"] }
  - { method: GET, path: "/rooms/{id}", description: "Get a room", roles: [StudioAdmin, Designer, ProcurementCoordinator, Client], code: 200, input: [], output: Room, side_effects: [] }
  - { method: GET, path: "/rooms", description: "List rooms (filter by project_id and/or approved_moodboard_id => FK reverse-reachability for Room.project_id, Room.approved_moodboard_id)", roles: [StudioAdmin, Designer, ProcurementCoordinator, Client], code: 200, input: ["project_id?", "approved_moodboard_id?", "limit?", "offset?"], output: "Room[]", side_effects: [] }
  - { method: POST, path: "/rooms/{room_id}/present-moodboard", description: "Mark room MOODBOARD_READY", roles: [Designer], code: 200, input: [], output: Room, side_effects: ["status -> MOODBOARD_READY; increments Room.version"] }
  - method: POST
    path: "/rooms/{room_id}/approve"
    description: "Client approves room; pins moodboard"
    roles: [Client]
    code: 200
    input: []
    output: Room
    side_effects: ["status -> APPROVED; PRESENTED moodboard -> ACCEPTED; other boards -> SUPERSEDED; approved_moodboard_id set; increments Room.version"]
  - { method: POST, path: "/rooms/{room_id}/request-rework", description: "Client sends room back to REWORK", roles: [Client], code: 200, input: [], output: Room, side_effects: ["status -> REWORK; PRESENTED moodboard -> SUPERSEDED; increments Room.version"] }
  - { method: POST, path: "/rooms/{room_id}/reopen-scope", description: "Designer reopens a REWORK room to SCOPING", roles: [Designer], code: 200, input: [], output: Room, side_effects: ["status -> SCOPING; increments Room.version"] }

  # ----- MoodBoard -----
  - { method: POST, path: "/rooms/{room_id}/moodboards", description: "Create a mood board for a room", roles: [Designer], code: 201, input: [title, palette], output: MoodBoard, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/moodboards/{id}", description: "Get a mood board", roles: [StudioAdmin, Designer, Client], code: 200, input: [], output: MoodBoard, side_effects: [] }
  - { method: GET, path: "/moodboards", description: "List mood boards (filter by room_id => FK reverse-reachability for MoodBoard.room_id)", roles: [StudioAdmin, Designer, Client], code: 200, input: ["room_id?", "limit?", "offset?"], output: "MoodBoard[]", side_effects: [] }
  - { method: POST, path: "/moodboards/{moodboard_id}/present", description: "Present a DRAFT mood board", roles: [Designer], code: 200, input: [], output: MoodBoard, side_effects: ["status -> PRESENTED; increments MoodBoard.version"] }

  # ----- FFEItem (catalog) -----
  - { method: POST, path: "/ffe-items", description: "Add a catalog FF&E item", roles: [StudioAdmin, Designer], code: 201, input: [sku, name, category, list_unit_cost_cents, lead_time_days, "active?"], output: FFEItem, side_effects: ["unique sku enforced"] }
  - { method: GET, path: "/ffe-items/{id}", description: "Get a catalog item", roles: [StudioAdmin, Designer, ProcurementCoordinator], code: 200, input: [], output: FFEItem, side_effects: [] }

  # ----- DesignSelection -----
  - method: POST
    path: "/projects/{project_id}/selections"
    description: "Select an FF&E item for a room (snapshots unit cost; computes line_net_cents)"
    roles: [Designer]
    code: 201
    input: [room_id, ffe_item_id, quantity, "trade_discount_pct?", "spec_note?"]
    output: DesignSelection
    side_effects: ["status=PROPOSED; unit_cost_cents snapshotted; line_net_cents computed (selection_line_net)"]
  - { method: GET, path: "/selections/{id}", description: "Get a selection", roles: [StudioAdmin, Designer, ProcurementCoordinator, Client], code: 200, input: [], output: DesignSelection, side_effects: [] }
  - { method: GET, path: "/selections", description: "List selections (filter by project_id/room_id/ffe_item_id => FK reverse-reachability for DesignSelection.project_id, room_id, ffe_item_id)", roles: [StudioAdmin, Designer, ProcurementCoordinator, Client], code: 200, input: ["project_id?", "room_id?", "ffe_item_id?", "limit?", "offset?"], output: "DesignSelection[]", side_effects: [] }
  - { method: POST, path: "/selections/{selection_id}/specify", description: "Lock spec on a selection (PROPOSED -> SPECIFIED)", roles: [Designer], code: 200, input: [], output: DesignSelection, side_effects: ["status -> SPECIFIED; increments DesignSelection.version"] }
  - { method: POST, path: "/selections/{selection_id}/withdraw", description: "Withdraw a selection", roles: [Designer], code: 200, input: [], output: DesignSelection, side_effects: ["status -> WITHDRAWN; increments DesignSelection.version"] }

  # ----- Vendor -----
  - { method: POST, path: "/vendors", description: "Register a vendor/trade", roles: [ProcurementCoordinator, StudioAdmin], code: 201, input: [name, trade, "standing?", "lead_time_buffer_days?"], output: Vendor, side_effects: [] }
  - { method: GET, path: "/vendors/{id}", description: "Get a vendor", roles: [StudioAdmin, ProcurementCoordinator], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST, path: "/vendors/{vendor_id}/suspend", description: "Suspend a vendor (standing -> SUSPENDED)", roles: [StudioAdmin], code: 200, input: [], output: Vendor, side_effects: ["standing -> SUSPENDED; increments Vendor.version"] }

  # ----- ProcurementOrder -----
  - method: POST
    path: "/projects/{project_id}/orders"
    description: "Open a DRAFT procurement order for a vendor"
    roles: [ProcurementCoordinator]
    code: 201
    input: [vendor_id, window_start, window_end]
    output: ProcurementOrder
    side_effects: ["status=DRAFT; order_subtotal_cents=0"]
  - { method: GET, path: "/orders/{id}", description: "Get an order incl. computed totals", roles: [StudioAdmin, ProcurementCoordinator, Designer, Client], code: 200, input: [], output: ProcurementOrder, side_effects: [] }
  - { method: GET, path: "/orders", description: "List orders (filter by project_id/vendor_id => FK reverse-reachability for ProcurementOrder.project_id, vendor_id)", roles: [StudioAdmin, ProcurementCoordinator, Designer, Client], code: 200, input: ["project_id?", "vendor_id?", "limit?", "offset?"], output: "ProcurementOrder[]", side_effects: [] }
  - method: POST
    path: "/orders/{order_id}/lines"
    description: "Attach a SPECIFIED selection to a DRAFT order"
    roles: [ProcurementCoordinator]
    code: 201
    input: [selection_id]
    output: OrderLine
    side_effects: ["snapshots selection.line_net_cents; order_subtotal_cents recomputed (order_subtotal)"]
  - { method: GET, path: "/order-lines/{id}", description: "Get an order line", roles: [StudioAdmin, ProcurementCoordinator, Designer], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: GET, path: "/order-lines", description: "List order lines (filter by order_id/selection_id => FK reverse-reachability for OrderLine.order_id, selection_id)", roles: [StudioAdmin, ProcurementCoordinator, Designer], code: 200, input: ["order_id?", "selection_id?", "limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - method: POST
    path: "/orders/{order_id}/place"
    description: "Place a DRAFT order (OCC on Project.version; budget/vendor/window gates)"
    roles: [ProcurementCoordinator]
    code: 200
    input: [expected_project_version]
    output: ProcurementOrder
    side_effects: ["status -> ORDERED; attached selections SPECIFIED -> ORDERED; expected_delivery_at computed; committed_cents/budget_status/posture recomputed; increments Project.version"]
  - { method: POST, path: "/orders/{order_id}/ship", description: "ORDERED -> IN_TRANSIT", roles: [ProcurementCoordinator], code: 200, input: [], output: ProcurementOrder, side_effects: ["status -> IN_TRANSIT; increments ProcurementOrder.version"] }
  - { method: POST, path: "/orders/{order_id}/deliver", description: "IN_TRANSIT -> DELIVERED", roles: [ProcurementCoordinator], code: 200, input: [], output: ProcurementOrder, side_effects: ["status -> DELIVERED; increments ProcurementOrder.version"] }
  - { method: POST, path: "/orders/{order_id}/close-order", description: "DELIVERED -> CLOSED (no open punch items)", roles: [ProcurementCoordinator], code: 200, input: [], output: ProcurementOrder, side_effects: ["status -> CLOSED; increments ProcurementOrder.version"] }
  - method: POST
    path: "/orders/{order_id}/cancel"
    description: "Cancel an ORDERED/IN_TRANSIT order (compensation)"
    roles: [ProcurementCoordinator]
    code: 200
    input: []
    output: ProcurementOrder
    side_effects: ["status -> CANCELLED; selections revert ORDERED -> SPECIFIED; committed_cents/budget_status/posture recomputed; deposit re-allocated; increments Project.version"]
  - method: POST
    path: "/orders/{order_id}/return-order"
    description: "Return a DELIVERED order that has a BLOCKING punch item"
    roles: [ProcurementCoordinator]
    code: 200
    input: []
    output: ProcurementOrder
    side_effects: ["status -> RETURNED; selections revert ORDERED -> SPECIFIED; OPEN punch items -> WAIVED; committed_cents/budget_status/posture recomputed; deposit re-allocated; increments Project.version"]

  # ----- RevisionRequest -----
  - { method: POST, path: "/projects/{project_id}/revisions", description: "Open a revision/approval request", roles: [Client], code: 201, input: [target_kind, target_id, note], output: RevisionRequest, side_effects: ["status=DRAFT; round_no=1"] }
  - { method: GET, path: "/revisions/{id}", description: "Get a revision", roles: [StudioAdmin, Designer, Client], code: 200, input: [], output: RevisionRequest, side_effects: [] }
  - { method: GET, path: "/revisions", description: "List revisions (filter by project_id/target_id => FK reverse-reachability for RevisionRequest.project_id, target_id)", roles: [StudioAdmin, Designer, Client], code: 200, input: ["project_id?", "target_id?", "limit?", "offset?"], output: "RevisionRequest[]", side_effects: [] }
  - { method: POST, path: "/revisions/{revision_id}/submit", description: "Submit (or resubmit) a revision", roles: [Client], code: 200, input: [], output: RevisionRequest, side_effects: ["status -> SUBMITTED; round_no increments on resubmit; posture recomputed; increments RevisionRequest.version"] }
  - { method: POST, path: "/revisions/{revision_id}/request-changes", description: "Designer requests changes (cycle)", roles: [Designer], code: 200, input: [], output: RevisionRequest, side_effects: ["status -> CHANGES_REQUESTED; increments RevisionRequest.version"] }
  - method: POST
    path: "/revisions/{revision_id}/resolve"
    description: "Designer resolves a revision"
    roles: [Designer]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: ["status -> RESOLVED; if ROOM target APPROVED, room reverts to REWORK (-> moodboard SUPERSEDED); posture recomputed; increments RevisionRequest.version"]
  - { method: POST, path: "/revisions/{revision_id}/dismiss", description: "Designer dismisses a revision", roles: [Designer], code: 200, input: [], output: RevisionRequest, side_effects: ["status -> DISMISSED; posture recomputed; increments RevisionRequest.version"] }

  # ----- PunchListItem -----
  - { method: POST, path: "/orders/{order_id}/punch-items", description: "Log an install defect on a DELIVERED order", roles: [ProcurementCoordinator, Designer], code: 201, input: [description, severity], output: PunchListItem, side_effects: ["status=OPEN; posture recomputed (BLOCKING -> FROZEN)"] }
  - { method: GET, path: "/punch-items/{id}", description: "Get a punch item", roles: [StudioAdmin, ProcurementCoordinator, Designer, Client], code: 200, input: [], output: PunchListItem, side_effects: [] }
  - { method: GET, path: "/punch-items", description: "List punch items (filter by order_id => FK reverse-reachability for PunchListItem.order_id)", roles: [StudioAdmin, ProcurementCoordinator, Designer, Client], code: 200, input: ["order_id?", "limit?", "offset?"], output: "PunchListItem[]", side_effects: [] }
  - { method: POST, path: "/punch-items/{punch_item_id}/resolve", description: "Resolve a punch item", roles: [ProcurementCoordinator], code: 200, input: [], output: PunchListItem, side_effects: ["status -> RESOLVED; posture recomputed; increments PunchListItem.version"] }
  - { method: POST, path: "/punch-items/{punch_item_id}/waive", description: "Client waives a punch item", roles: [Client], code: 200, input: [], output: PunchListItem, side_effects: ["status -> WAIVED; posture recomputed; increments PunchListItem.version"] }

  # ----- TimeEntry -----
  - { method: POST, path: "/projects/{project_id}/time-entries", description: "Log designer time against a project", roles: [Designer], code: 201, input: [designer_user_id, minutes, "billable?"], output: TimeEntry, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/time-entries/{id}", description: "Get a time entry", roles: [StudioAdmin, Designer], code: 200, input: [], output: TimeEntry, side_effects: [] }
  - { method: GET, path: "/time-entries", description: "List time entries (filter by project_id => FK reverse-reachability for TimeEntry.project_id)", roles: [StudioAdmin, Designer], code: 200, input: ["project_id?", "limit?", "offset?"], output: "TimeEntry[]", side_effects: [] }
  - { method: POST, path: "/time-entries/{time_entry_id}/approve", description: "Approve a time entry (HOURLY fee feeds)", roles: [StudioAdmin], code: 200, input: [], output: TimeEntry, side_effects: ["status -> APPROVED; design_fee_cents & budget_status recomputed; increments TimeEntry.version"] }
  - { method: POST, path: "/time-entries/{time_entry_id}/reject", description: "Reject a time entry", roles: [StudioAdmin], code: 200, input: [], output: TimeEntry, side_effects: ["status -> REJECTED; increments TimeEntry.version"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or entity_backed owner mismatch (Client not the project's client)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource does not exist or child does not belong to the named parent" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed/out-of-range body field, invalid enum, or window_end <= window_start" }
  - { id: ERR_FEE_MODEL_FIELDS, http: 422, condition: "fee_model field set is inconsistent (wrong fee field present/absent or out of range)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not legal from the resource's current state" }
  - { id: ERR_PROJECT_FROZEN, http: 409, condition: "posture=FROZEN blocks order placement, advance-to-INSTALLATION, or close" }
  - { id: ERR_BUDGET_GATE, http: 409, condition: "posture=BUDGET_REVIEW (budget AMBER) blocks new order placement" }
  - { id: ERR_VENDOR_SUSPENDED, http: 409, condition: "Vendor.standing is SUSPENDED; cannot place an order on it" }
  - { id: ERR_VENDOR_WINDOW_CONFLICT, http: 409, condition: "Order window overlaps another non-terminal order on the same vendor (half-open intervals)" }
  - { id: ERR_ORDER_EMPTY, http: 409, condition: "Order has no OrderLine and cannot be placed" }
  - { id: ERR_SELECTION_ALREADY_ORDERED, http: 409, condition: "Selection already attached to a non-CANCELLED order, or selection not SPECIFIED, or room/project mismatch on attach" }
  - { id: ERR_SELECTION_ON_ORDER, http: 409, condition: "Cannot withdraw a SPECIFIED selection that is attached to a non-CANCELLED order" }
  - { id: ERR_FFE_ITEM_INACTIVE, http: 409, condition: "Referenced FFEItem.active is false; cannot create a selection for it" }
  - { id: ERR_ROOM_NOT_APPROVED, http: 409, condition: "Selection cannot be SPECIFIED because its Room is not APPROVED" }
  - { id: ERR_ROOMS_NOT_APPROVED, http: 409, condition: "advance to PROCUREMENT requires every room APPROVED" }
  - { id: ERR_OPEN_REVISION, http: 409, condition: "advance to PROCUREMENT blocked by a SUBMITTED/CHANGES_REQUESTED revision" }
  - { id: ERR_NO_ORDERS_IN_FLIGHT, http: 409, condition: "advance to INSTALLATION requires an order in IN_TRANSIT or DELIVERED" }
  - { id: ERR_ORDERS_OPEN, http: 409, condition: "close blocked because an order is not in {CLOSED, CANCELLED, RETURNED, DELIVERED}" }
  - { id: ERR_NO_PRESENTED_MOODBOARD, http: 409, condition: "Room transition requires a PRESENTED mood board" }
  - { id: ERR_MOODBOARD_ALREADY_PRESENTED, http: 409, condition: "Another mood board for the room is already PRESENTED" }
  - { id: ERR_SPEC_NOTE_REQUIRED, http: 409, condition: "spec_note must be non-empty to SPECIFY a selection" }
  - { id: ERR_PUNCH_ITEMS_OPEN, http: 409, condition: "Cannot close an order with OPEN punch items" }
  - { id: ERR_RETURN_NOT_JUSTIFIED, http: 409, condition: "Cannot return a delivered order without a BLOCKING punch item" }
  - { id: ERR_FEE_MODEL_MISMATCH, http: 409, condition: "Approving a time entry requires Project.fee_model=HOURLY" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Unique constraint violated (Room.name in project, FFEItem.sku, Client.email)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not match current Project.version on an OCC-guarded write" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed JSON body or pagination params out of range" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudioAdmin
    description: "Studio operations: client onboarding, project creation, payments, hold/resume/close, time-entry approval, vendor suspension"
    identity: opaque
    exclusive_operations:
      - "POST /clients — register client"
      - "POST /projects — create project"
      - "POST /projects/{project_id}/payments — record deposit"
      - "POST /projects/{project_id}/hold — hold"
      - "POST /projects/{project_id}/resume — resume"
      - "POST /projects/{project_id}/close — close & finalize fee"
      - "POST /vendors/{vendor_id}/suspend — suspend vendor"
      - "POST /time-entries/{time_entry_id}/approve — approve time"
      - "POST /time-entries/{time_entry_id}/reject — reject time"
    shared_operations:
      - "POST /ffe-items (with Designer)"
      - "POST /vendors (with ProcurementCoordinator)"
      - "GET reads across resources"

  - name: Designer
    description: "Owns design artifacts: rooms, mood boards, selections, spec, revision resolution, time logging"
    identity: opaque
    exclusive_operations:
      - "POST /projects/{project_id}/rooms — add room"
      - "POST /rooms/{room_id}/present-moodboard"
      - "POST /rooms/{room_id}/reopen-scope"
      - "POST /rooms/{room_id}/moodboards — create board"
      - "POST /moodboards/{moodboard_id}/present"
      - "POST /projects/{project_id}/selections — select FF&E"
      - "POST /selections/{selection_id}/specify"
      - "POST /selections/{selection_id}/withdraw"
      - "POST /projects/{project_id}/time-entries — log time"
      - "POST /revisions/{revision_id}/request-changes"
      - "POST /revisions/{revision_id}/resolve"
      - "POST /revisions/{revision_id}/dismiss"
    shared_operations:
      - "POST /projects/{project_id}/advance (with ProcurementCoordinator)"
      - "POST /ffe-items (with StudioAdmin)"
      - "POST /orders/{order_id}/punch-items (with ProcurementCoordinator)"
      - "GET reads across resources"

  - name: ProcurementCoordinator
    description: "Owns orders & vendor coordination: order lifecycle, lines, ship/deliver/close/cancel/return, punch resolution"
    identity: opaque
    exclusive_operations:
      - "POST /projects/{project_id}/orders — open order"
      - "POST /orders/{order_id}/lines — attach selection"
      - "POST /orders/{order_id}/place"
      - "POST /orders/{order_id}/ship"
      - "POST /orders/{order_id}/deliver"
      - "POST /orders/{order_id}/close-order"
      - "POST /orders/{order_id}/cancel"
      - "POST /orders/{order_id}/return-order"
      - "POST /punch-items/{punch_item_id}/resolve"
    shared_operations:
      - "POST /projects/{project_id}/advance (with Designer)"
      - "POST /vendors (with StudioAdmin)"
      - "POST /orders/{order_id}/punch-items (with Designer)"
      - "GET reads across resources"

  - name: Client
    description: "The project owner who funds the budget, approves rooms, opens/submits revisions, waives punch items"
    identity: entity_backed:Client
    exclusive_operations:
      - "POST /rooms/{room_id}/approve"
      - "POST /rooms/{room_id}/request-rework"
      - "POST /projects/{project_id}/revisions — open revision"
      - "POST /revisions/{revision_id}/submit"
      - "POST /punch-items/{punch_item_id}/waive"
    shared_operations:
      - "GET reads scoped to own projects"
