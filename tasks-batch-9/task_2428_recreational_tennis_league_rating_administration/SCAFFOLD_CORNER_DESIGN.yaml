              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 422"
            - "$.data.error_id == 'ERR_FORMAT_GENDER_MISMATCH'"
            - "${rsf1_status} == 'PENDING' — the add itself was accepted, because the rule guards activation and scorecard lines only"
            - "$.data.error_id != 'ERR_RATING_LEVEL_EXCEEDS_LEAGUE' because 3.5 sits inside the 2.5..3.5 band, and != 'ERR_AGE_GROUP_NOT_MET' because birth_year 1975 clears AGE_18_OVER"
            - "a follow-up GET /tennis/roster-spots/${rsf1_id} returns $.data.status == 'PENDING' with level_at_add still null"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.active_roster_size == 0 and $.data.roster_compliant == false"
            - "adding the male player ${pa1_id} to the same team returns HTTP 201 and activating that spot returns HTTP 200, so the refusal is specific to the mismatched player rather than to the team or the endpoint"

