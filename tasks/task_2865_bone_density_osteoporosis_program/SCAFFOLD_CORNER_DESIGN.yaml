              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: PatientPortalUser
              as_user_id: "${pat_id}"
          assert:
            - "the first eight trigger responses all have status 403 with data.error_id ERR_FORBIDDEN_ROLE"
            - "each of those eight responses is a 403 and never a 404 or 422, because the role gate at priority 2 precedes both the schema check and every lookup - the deliberately bogus body identifiers in the FRAX, report and treatment-plan attempts are never even parsed"
            - "the ninth trigger response status is 201 with result PASS, so QC runs are genuinely shared with ProgramAdmin"
            - "the tenth trigger response status is 201, so order entry is genuinely shared with InterpretingPhysician"
            - "the eleventh trigger response status is 200, so every role including the portal user may move the logical clock"
            - "GET /bone-density/payer-policies returns total_count 1 and GET /bone-density/densitometers returns total_count 1, so no forbidden write landed"
      - name: patient_portal_reads_of_another_patient_are_forbidden
        claim_type: scope_enforcement
        grounds:
          - roles.PatientPortalUser[identity]
          - validations[priority 17]
          - errors[ERR_PATIENT_SCOPE_VIOLATION]
        distinguishing_aspect: "The portal role is entity-backed, so authorisation is per-row rather than per-endpoint: patient A holding X-User-ID equal to her own Patient.id reads her own record and profile list happily, and the identical calls against patient B return 403 ERR_PATIENT_SCOPE_VIOLATION rather than ERR_FORBIDDEN_ROLE or a 404, including the filtered collection read scoped to B."
