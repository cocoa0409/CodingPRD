  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coverage_window_overlap_our_plan_uniqueness
        grounds:
          - validations[priority=6]
          - errors[ERR_DUPLICATE_OUR_PLAN]
          - entities.Coverage.fields.effective_from
          - entities.Coverage.fields.effective_to
        distinguishing_aspect: |
          Interval semantics: VERIFIED OUR_PLAN coverage with [effective_from,
          effective_to) half-open interval must be unique per member; a second
          OUR_PLAN coverage whose window overlaps by even one day is rejected.
          Resource = Member (one OUR_PLAN coverage at a time). Adjacent windows
          ([a,b) and [b,c)) do NOT conflict. Distinct interval semantics from
          instance 2 (which uses closed windows for determination overlap).
        test_recipe:
          setup:
            - "Member; OUR_PLAN coverage C1 verified with [2026-01-01, 2026-12-31)"
            - "New OUR_PLAN coverage C2 with [2026-06-01, null) — overlaps with C1"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "MO", full_name: "O", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own A", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", effective_to: "2026-12-31", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { c1: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${c1}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own B", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-06-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/coverages/${c2}/verify"
              payload: {}
              as: COBAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_OUR_PLAN"
            - "http_status == 409"

      - name: primacy_determination_same_service_date_supersede
        grounds:
          - state_machines.PrimacyDetermination.FINALIZED_to_SUPERSEDED
          - entities.PrimacyDetermination.fields.as_of_service_date
        distinguishing_aspect: |
          Interval semantics: closed-point overlap on as_of_service_date —
          two FINALIZED determinations for the same member with the same
          as_of_service_date collide (point-equality). The newer one
          supersedes the older. Distinct semantics from instance 1 (half-open
          window overlap on Coverage windows): here a single point in time is
          the contention resource, not an interval.
        test_recipe:
          setup:
            - "Member with two coverages verified; PD1 finalized as_of 2026-03-01"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "MP", full_name: "P", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "G", plan_name: "G", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", policy_holder_gender: "MALE", effective_from: "2025-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cg: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cg}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-03-01", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pd1: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pd1}/finalize"
              payload: {}
              as: COBAnalyst
          trigger:
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv2: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-03-01", expected_member_version: "${mv2}" }
              as: COBAnalyst
              captures: { pd2: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pd2}/finalize"
              payload: {}
              as: COBAnalyst
          assert:
            - "PrimacyDetermination.${pd1}.status == SUPERSEDED"
            - "PrimacyDetermination.${pd2}.status == FINALIZED"
            - "PrimacyDetermination.${pd1}.superseded_by_id == ${pd2}"

  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_total_paid_conserved_through_rework_cycle
        grounds:
          - calculations.primary_payment_calculation
          - calculations.secondary_payment_calculation
          - calculations.overpayment_derivation
          - entities.Claim.fields.total_paid_cents
        distinguishing_aspect: |
          Conserved quantity: claim's financial invariant — total_paid +
          total_primary_paid == total_allowed (when fully processed as
          secondary). Forward action (adjudicate) followed by compensating
          rework (reopen→readjudicate→repay with new determination) must
          leave this invariant intact. Distinct quantity from instance 2
          (which conserves recovery balances).
        test_recipe:
          setup:
            - "Member with OUR_PLAN + OTHER; PD makes OTHER primary"
            - "Claim with lines adjudicated as secondary"
            - "Cycle through reopen/readjudicate/repay; invariant checked at every stage"
