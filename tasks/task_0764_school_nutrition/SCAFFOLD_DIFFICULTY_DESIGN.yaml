        grounds:
          - calculations.prepay_balance
          - entities.Student.fields.account_status
          - entities.Student.fields.low_balance_threshold_cents
        distinguishing_aspect: "Money threshold uses <= (inclusive): depositing exactly to the threshold (balance_cents == low_balance_threshold_cents == 500) yields account_status LOW_BALANCE, not ACTIVE; reached via POST /students/{id}/deposit."
