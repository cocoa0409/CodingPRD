scaffold_corner_design:
  - section: entities
    instances:
      - name: student_registration_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Student.fields.application_state
          - entities.Student.fields.lifetime_contract_points
          - entities.Student.fields.roster_status
        distinguishing_aspect: "a registration that omits every optional field must come back with the declared defaults rather than nulls."
        test_recipe:
          setup:
            - "no student exists with the email cora.pike@example.com"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramStaff
          trigger:
            - call: "POST /students"
              payload: { full_name: "Cora Pike", email: "cora.pike@example.com", date_of_birth: "2003-03-03", education_status: "ASSOCIATE", household_income_cents: 2400000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
          assert:
            - "Student.${s_id}.application_state == APPLIED"
            - "Student.${s_id}.current_phase is null"
            - "Student.${s_id}.lifetime_contract_points == 0"
            - "Student.${s_id}.total_stipend_paid_cents == 0"
            - "Student.${s_id}.roster_status == ON_TRACK"

      - name: cohort_creation_derives_graduation_date_and_status
        claim_type: computed_fields
        grounds:
          - entities.Cohort.fields.graduation_date
          - entities.Cohort.fields.enrolled_count
          - entities.Cohort.fields.status
        distinguishing_aspect: "graduation_date is derived from start_date at creation (start plus 180 days) and is never accepted as input."
        test_recipe:
          setup:
            - "no cohort exists at site BOS-02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramStaff
          trigger:
            - call: "POST /cohorts"
              payload: { program_code: "CYBER", location_code: "BOS-02", start_date: "2026-09-01", capacity: 12 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
          assert:
            - "Cohort.${c_id}.graduation_date == 2027-02-28T00:00:00Z"
            - "Cohort.${c_id}.enrolled_count == 0"
            - "Cohort.${c_id}.status == PLANNED"
            - "Cohort.${c_id}.awarded_points == 0"

      - name: partner_creation_zeroes_every_billing_field
        claim_type: computed_fields
        grounds:
          - entities.Partner.fields.outstanding_balance_cents
          - entities.Partner.fields.credit_hold
          - entities.Partner.fields.collection_ratio
        distinguishing_aspect: "a freshly registered partner exposes zeroed billing aggregates and a null oldest open due date."
        test_recipe:
          setup:
            - "no partner exists with the billing email ap@contoso.example"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramStaff
          trigger:
            - call: "POST /partners"
              payload: { legal_name: "Contoso Retail", industry: "RETAIL", billing_email: "ap@contoso.example", fee_tier: "TIER_C" }
              as: ProgramStaff
              captures: { p_id: "$.data.id" }
          assert:
            - "Partner.${p_id}.outstanding_balance_cents == 0"
            - "Partner.${p_id}.billed_cents == 0"
            - "Partner.${p_id}.collected_cents == 0"
            - "Partner.${p_id}.collection_ratio == 0.0000"
            - "Partner.${p_id}.credit_hold == false"
            - "Partner.${p_id}.oldest_open_due_date is null"
            - "Partner.${p_id}.status == ACTIVE"

      - name: duplicate_student_email_returns_conflict
        claim_type: type_constraints
        grounds:
          - errors[ERR_DUPLICATE_EMAIL]
          - entities.Student.fields.email
        distinguishing_aspect: "the email uniqueness constraint is global across students, not scoped to a cohort or site."
        test_recipe:
          setup:
            - "student ava.reyes@example.com already exists"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /students"
              payload: { full_name: "Ava R Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_DUPLICATE_EMAIL"
            - "the response http status == 409"
            - "exactly one student row exists with the email ava.reyes@example.com"

      - name: placement_with_unknown_agreement_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "a body foreign key that does not resolve is rejected before any state or capacity rule is consulted."
        test_recipe:
          setup:
            - "student Ava Reyes is ENROLLED at phase INTERNSHIP"
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { program_code: "DATA", location_code: "BOS-01", start_date: "2026-09-01", capacity: 24 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "ELIGIBLE" }
              as: ProgramStaff
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-07", period_end: "2026-09-20", hours_attended: 98, hours_expected: 140, behavior_incidents: 4 }
              as: ProgramStaff
              captures: { st1_id: "$.data.id" }
            - call: "POST /stipend-statements/${st1_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-21", period_end: "2026-10-04", hours_attended: 133, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st2_id: "$.data.id" }
            - call: "POST /stipend-statements/${st2_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-10-05", period_end: "2026-10-18", hours_attended: 140, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st3_id: "$.data.id" }
            - call: "POST /stipend-statements/${st3_id}/payments"
              payload: {}
              as: ProgramStaff
          trigger:
            - call: "POST /placements"
              payload: { agreement_id: "0f2c8b41-6d1e-4a77-9f3d-5c2a7e9b1044", student_id: "${s_id}", max_interview_rounds: 3 }
              as: ProgramStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_NOT_FOUND"
            - "the response http status == 404"
            - "no placement row is created for Student.${s_id}"

      - name: stipend_listing_honors_limit_and_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /students/{id}/stipend-statements]
          - entities.StipendStatement.fields.status
        distinguishing_aspect: "the paginated envelope reports total_count over the whole filtered set while returning only limit rows, with has_more true."
        test_recipe:
          setup:
            - "student Ava Reyes holds two L&D stipend statements"
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { program_code: "DATA", location_code: "BOS-01", start_date: "2026-09-01", capacity: 24 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "ELIGIBLE" }
              as: ProgramStaff
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-07", period_end: "2026-09-20", hours_attended: 126, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st1_id: "$.data.id" }
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-21", period_end: "2026-10-04", hours_attended: 126, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st2_id: "$.data.id" }
          trigger:
            - call: "GET /students/${s_id}/stipend-statements?limit=1&offset=0"
              payload: {}
              as: ProgramStaff
              captures: { first_id: "$.data[0].id" }
          assert:
            - "the response meta.total_count == 2"
            - "the response meta.has_more == true"
            - "the response meta.limit == 1"
            - "the response data array has length 1"
            - "the returned statement id is either ${st1_id} or ${st2_id}"

  - section: state_machines
    instances:
      - name: eligibility_decision_after_terminal_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Student.APPLIED_to_INELIGIBLE
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "once a student reaches the terminal INELIGIBLE state no further decision may move it, and the second decision is answered with the terminal error rather than the generic state error."
        test_recipe:
          setup:
            - "student Cora Pike was decided INELIGIBLE and sits in the terminal INELIGIBLE state"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Cora Pike", email: "cora.pike@example.com", date_of_birth: "2001-10-10", education_status: "ASSOCIATE", household_income_cents: 2400000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "INELIGIBLE", reason: "Applicant withdrew before the interview panel" }
              as: ProgramStaff
          trigger:
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "ELIGIBLE" }
              as: ProgramStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "the first decision moved Student.${s_id}.application_state to INELIGIBLE"
            - "the response error_id == ERR_ALREADY_TERMINAL"
            - "the response http status == 409"
            - "Student.${s_id}.application_state == INELIGIBLE"

      - name: enrollment_from_applied_state_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Student.APPLIED_to_ELIGIBLE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "enrollment is only reachable from ELIGIBLE, so an APPLIED applicant is rejected on state rather than on cohort rules."
        test_recipe:
          setup:
            - "student Ben Ortiz is APPLIED and has never been decided"
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { program_code: "DATA", location_code: "BOS-01", start_date: "2026-09-01", capacity: 24 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
            - call: "POST /students"
              payload: { full_name: "Ben Ortiz", email: "ben.ortiz@example.com", date_of_birth: "2004-02-02", education_status: "SOME_COLLEGE", household_income_cents: 1800000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_INVALID_STATE"
            - "Cohort.${c_id}.enrolled_count == 0"
            - "Student.${s_id}.application_state == APPLIED"

      - name: second_stipend_payment_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.StipendStatement.PENDING_to_PAID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "payment is not idempotent at the row level: replaying the same payment after the statement is PAID is rejected and the student totals are not credited twice."
        test_recipe:
          setup:
            - "student Ava Reyes holds one PAID L&D statement worth 28950 cents"
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { program_code: "DATA", location_code: "BOS-01", start_date: "2026-09-01", capacity: 24 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "ELIGIBLE" }
              as: ProgramStaff
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-07", period_end: "2026-09-20", hours_attended: 98, hours_expected: 140, behavior_incidents: 4 }
              as: ProgramStaff
              captures: { st1_id: "$.data.id" }
            - call: "POST /stipend-statements/${st1_id}/payments"
              payload: {}
              as: ProgramStaff
          trigger:
            - call: "POST /stipend-statements/${st1_id}/payments"
              payload: {}
              as: ProgramStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_INVALID_STATE"
            - "Student.${s_id}.total_stipend_paid_cents == 28950"
            - "Student.${s_id}.lifetime_contract_points == 3"
            - "StipendStatement.${st1_id}.status == PAID"

      - name: placement_starts_matched_with_copied_scope
        claim_type: initial_state
        grounds:
          - state_machines.InternshipPlacement.MATCHED_to_INTERVIEW_SCHEDULED
          - entities.InternshipPlacement.fields.project_scope
          - entities.InternshipPlacement.fields.supervisor_name
        distinguishing_aspect: "a new placement lands in MATCHED with the agreement's project scope and the partner's supervisor copied onto it and the interview attempt counter at zero."
        test_recipe:
          setup:
            - "the Northwind agreement is ACTIVE with one slot and student Ava Reyes is at phase INTERNSHIP"
          setup_api_calls:
            - call: "POST /partners"
              payload: { legal_name: "Northwind Logistics", industry: "LOGISTICS", billing_email: "ap@northwind.example", fee_tier: "TIER_B" }
              as: ProgramStaff
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
            - call: "POST /cohorts"
              payload: { program_code: "DATA", location_code: "BOS-01", start_date: "2026-09-01", capacity: 24 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "ELIGIBLE" }
              as: ProgramStaff
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
            - call: "POST /agreements"
              payload: { partner_id: "${p_id}", project_scope: "Logistics analytics data pipeline support", supervision_hours_per_week: 12, slot_count: 1, fee_tier: "TIER_B", start_date: "2026-09-01", end_date: "2027-03-31" }
              as: ProgramStaff
              captures: { a_id: "$.data.id" }
            - call: "POST /agreements/${a_id}/activations"
              payload: { expected_partner_version: "${p_v1}" }
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-07", period_end: "2026-09-20", hours_attended: 98, hours_expected: 140, behavior_incidents: 4 }
              as: ProgramStaff
              captures: { st1_id: "$.data.id" }
            - call: "POST /stipend-statements/${st1_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-21", period_end: "2026-10-04", hours_attended: 133, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st2_id: "$.data.id" }
            - call: "POST /stipend-statements/${st2_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-10-05", period_end: "2026-10-18", hours_attended: 140, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st3_id: "$.data.id" }
            - call: "POST /stipend-statements/${st3_id}/payments"
              payload: {}
              as: ProgramStaff
          trigger:
            - call: "POST /placements"
              payload: { agreement_id: "${a_id}", student_id: "${s_id}", max_interview_rounds: 3 }
              as: ProgramStaff
              captures: { pl_id: "$.data.id" }
          assert:
            - "InternshipPlacement.${pl_id}.state == MATCHED"
            - "InternshipPlacement.${pl_id}.interview_attempt == 0"
            - "InternshipPlacement.${pl_id}.project_scope == \"Logistics analytics data pipeline support\""
            - "InternshipPlacement.${pl_id}.supervisor_name == \"Northwind Logistics\""
            - "InternshipPlacement.${pl_id}.placement_fee_cents is null"

  - section: calculations
    instances:
      - name: internship_hours_cap_clamps_expected_hours
        claim_type: constants_applied
        grounds:
          - calculations.internship_stipend_net
        distinguishing_aspect: "expected hours above the weekly cap are clamped before pricing, so 60 expected hours over a fortnight bill 50 hours."
        test_recipe:
          setup:
            - "student Ava Reyes holds an ACTIVE placement and no internship statement yet"
          setup_api_calls:
            - call: "POST /partners"
              payload: { legal_name: "Northwind Logistics", industry: "LOGISTICS", billing_email: "ap@northwind.example", fee_tier: "TIER_B" }
              as: ProgramStaff
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
            - call: "POST /cohorts"
              payload: { program_code: "DATA", location_code: "BOS-01", start_date: "2026-09-01", capacity: 24 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "ELIGIBLE" }
              as: ProgramStaff
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
            - call: "POST /agreements"
              payload: { partner_id: "${p_id}", project_scope: "Logistics analytics data pipeline support", supervision_hours_per_week: 12, slot_count: 1, fee_tier: "TIER_B", start_date: "2026-09-01", end_date: "2027-03-31" }
              as: ProgramStaff
              captures: { a_id: "$.data.id" }
            - call: "POST /agreements/${a_id}/activations"
              payload: { expected_partner_version: "${p_v1}" }
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-07", period_end: "2026-09-20", hours_attended: 98, hours_expected: 140, behavior_incidents: 4 }
              as: ProgramStaff
              captures: { st1_id: "$.data.id" }
            - call: "POST /stipend-statements/${st1_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-21", period_end: "2026-10-04", hours_attended: 133, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st2_id: "$.data.id" }
            - call: "POST /stipend-statements/${st2_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-10-05", period_end: "2026-10-18", hours_attended: 140, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st3_id: "$.data.id" }
            - call: "POST /stipend-statements/${st3_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /placements"
              payload: { agreement_id: "${a_id}", student_id: "${s_id}", max_interview_rounds: 3 }
              as: ProgramStaff
              captures: { pl_id: "$.data.id" }
            - call: "POST /placements/${pl_id}/interviews"
              payload: { scheduled_for: "2026-09-20T15:00:00Z", duration_minutes: 45, supervisor_name: "Dana Whitfield" }
              as: ProgramStaff
              captures: { iv1_id: "$.data.id" }
            - call: "POST /interviews/${iv1_id}/outcomes"
              payload: { outcome: "PASSED" }
              as: Partner
              as_user_id: "${p_id}"
            - call: "POST /placements/${pl_id}/offers"
              payload: {}
              as: ProgramStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: ProgramStaff
            - call: "POST /placements/${pl_id}/acceptance"
              payload: { start_date: "2026-10-05", end_date: "2027-01-10", hours_per_week: 20 }
              as: Student
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "INTERNSHIP", period_start: "2026-11-02", period_end: "2026-11-15", hours_attended: 60, hours_expected: 60, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { ist_id: "$.data.id" }
          assert:
            - "StipendStatement.${ist_id}.gross_amount_cents == 82500"
            - "the uncapped reading would have priced 60 hours at 99000 cents"
            - "StipendStatement.${ist_id}.attendance_ratio == 1.0000"
            - "StipendStatement.${ist_id}.net_amount_cents == 82500"
            - "StipendStatement.${ist_id}.contract_points_earned == 9"

      - name: tuition_credit_cap_applied_per_grant
