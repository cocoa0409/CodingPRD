# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2547 — Continuing Legal Education Accreditation & Credit Reporting
#
# Nine rule_id blocks from §0.5, every instance grounded in SCAFFOLD.yaml's
# §1.1–§1.7. Deleting this file leaves the declared behaviour identical.
# Logical clock default: 2026-08-01T00:00:00Z (§1.5 POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: provisional_versus_final_cycle_credit_application_on_compliance_cycle
        grounds:
          - calculations.cycle_credit_application
          - calculations.cycle_requirement_derivation
          - calculations.late_fee_assessment
          - entities.ComplianceCycle.fields.earned_countable_minutes
          - entities.ComplianceCycle.fields.earned_ethics_minutes
          - entities.CreditRecord.fields.countable_minutes
          - state_machines.CreditRecord.PENDING_VERIFICATION_to_VERIFIED
          - state_machines.ComplianceCycle.credit_status_OPEN_to_DEFICIENT
        distinguishing_aspect: |
          The variant divergence lives on the ComplianceCycle credit domain and is created by the
          input-set filter alone: PROVISIONAL admits PENDING_VERIFICATION records, so an early
          pending ETHICS record consumes the 360-minute self-study allowance that a later VERIFIED
          GENERAL record would otherwise have taken. Identical stored rows therefore yield
          earned_ethics_minutes 120 under PROVISIONAL and 0 under FINAL while the total stays 360,
          and record r3's countable_minutes flips 0 -> 120. Falsifiable: if the two variants only
          differed by a scalar (e.g. FINAL were PROVISIONAL minus the pending minutes), the totals
          would differ and the per-category split would not invert.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default (no clock call needed)."
            - "One ACCREDITED, self-certifying provider, so its courses are APPROVED on creation."
            - "Three SELF_STUDY courses, each verified by AFFIRMATION_ONLY: C1 240 minutes all GENERAL, C2 180 minutes all ETHICS, C3 180 minutes all GENERAL."
            - "One ACTIVE attorney admitted 2010-05-01, compliance group GROUP_1, so the 2026-01-01 -> 2028-01-01 cycle is NOT prorated: required 1800 / 180 / 60 / 120 minutes, filing_deadline 2028-02-01."
            - "Three credit records in that cycle: r1 (C1, completion 2026-02-10) VERIFIED, r2 (C2, completion 2026-03-10) left PENDING_VERIFICATION, r3 (C3, completion 2026-04-10) VERIFIED."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Statewide Bar CLE Institute", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Trust Accounting Basics", delivery_format: "SELF_STUDY", total_minutes: 240, presented_at: "2026-01-05T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 240 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Candor Toward the Tribunal", delivery_format: "SELF_STUDY", total_minutes: 180, presented_at: "2026-01-06T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "ETHICS", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Deposition Practice Review", delivery_format: "SELF_STUDY", total_minutes: 180, presented_at: "2026-01-07T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1001", full_name: "Dana Reyes", admission_date: "2010-05-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${c1_id}", verification_method: "AFFIRMATION", attended_minutes: 240, completion_date: "2026-02-10T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /cle/credit-records/${r1_id}/adjudication"
              payload: { action: "VERIFY" }
              as: BoardAdmin
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${c2_id}", verification_method: "AFFIRMATION", attended_minutes: 180, completion_date: "2026-03-10T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${c3_id}", verification_method: "AFFIRMATION", attended_minutes: 180, completion_date: "2026-04-10T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { r3_id: $.data.id }
            - call: "POST /cle/credit-records/${r3_id}/adjudication"
              payload: { action: "VERIFY" }
              as: BoardAdmin
          trigger:
            - call: "GET /cle/compliance-cycles/${cyc_id}/summary"
              as: BoardAdmin
            - call: "POST /cle/compliance-cycles/${cyc_id}/affirmations"
              payload: { affirmation_type: "FINAL_COMPLIANCE_AFFIRMATION", statement: "I affirm the credits reported for this compliance period." }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/compliance-cycles/${cyc_id}/certification"
              payload: { carryover_election: "CARRY_FORWARD" }
              as: Attorney
              as_user_id: "${att_id}"
          assert:
            - "GET summary -> data.provisional_total_minutes == 360 (r1 240 + r2 truncated to 120 + r3 truncated to 0)"
            - "GET summary -> data.provisional_ethics_minutes == 120"
            - "GET summary -> data.projected_final_total_minutes == 360 (r1 240 + r3 truncated to 120)"
            - "GET summary -> data.projected_final_ethics_minutes == 0"
            - "GET summary -> data.self_study_used_minutes == 360 (the PROVISIONAL run exhausts SELF_STUDY_CAP_MINUTES exactly)"
            - "GET summary -> data.records_counted == 3 and data.records_excluded == 0"
            - "GET summary -> data.projected_final_deficiency_total_minutes == 1440 and data.projected_final_deficiency_ethics_minutes == 180"
            - "GET summary -> data.projected_late_fee_cents == 100000 (deficiency 1440+180+60+120 = 1800 minutes -> 30 hours -> base 60000 + surcharge 2500*20 = 110000, capped at 100000)"
            - "ComplianceCycle.${cyc_id}.credit_status == DEFICIENT after certification"
            - "ComplianceCycle.${cyc_id}.earned_countable_minutes == 360 and earned_ethics_minutes == 0 (frozen to the FINAL result)"
            - "ComplianceCycle.${cyc_id}.carryover_out_general_minutes == 0 and carryover_out_ethics_minutes == 0"
            - "CreditRecord.${r1_id}.countable_minutes == 240"
            - "CreditRecord.${r2_id}.countable_minutes == 0 (was 120 under PROVISIONAL; excluded from the FINAL input set)"
            - "CreditRecord.${r3_id}.countable_minutes == 120 (was 0 under PROVISIONAL; the freed cap room is now its own)"
            - "Attorney.${att_id}.open_deficiency_count == 1"

      - name: self_certified_versus_reviewed_provider_risk_weighting
        grounds:
          - calculations.provider_risk_score
          - calculations.audit_sample_selection
          - entities.Provider.fields.risk_score
          - entities.Provider.fields.risk_score_variant
          - entities.Provider.fields.courses_self_certified_count
          - entities.Provider.fields.courses_total_count
          - state_machines.ProviderAudit.SAMPLED_to_FINDINGS_ISSUED
          - state_machines.ProviderAudit.FINDINGS_ISSUED_to_SANCTIONED
          - state_machines.Provider.ACCREDITED_to_PROBATIONARY
        distinguishing_aspect: |
          This dual variant sits on a different entity domain (Provider risk scoring, not cycle
          credit accounting) and diverges on the DENOMINATOR of a weighted score rather than on an
          input-set filter: SELF_CERTIFIED_WEIGHTING divides audit_findings_count by
          courses_self_certified_count (2) while REVIEWED_WEIGHTING divides it by
          courses_total_count (4). The same two findings therefore score 0.25 while the provider is
          ACCREDITED and 0.13 the instant the sanction cascade drops it to PROBATIONARY — and the
          0.125 -> 0.13 step also pins ROUND_HALF_UP. Falsifiable: a single-variant implementation
          returns the same score before and after the sanction.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default, so every months_between term in the staleness factor is 0."
            - "One provider with two courses filed while it was still APPLIED (INDIVIDUAL_APPROVAL, PENDING_APPROVAL) and two more filed after GRANT_FULL (PROVIDER_ACCREDITED, APPROVED): courses_total_count 4, courses_self_certified_count 2."
            - "No rosters and no substantiated complaints, so delinquency_rate and complaint_rate are both 0."
            - "One audit over the closed window 2026-06-01 -> 2026-06-30, whose pool is exactly the two APPROVED self-certified courses, sampled and then charged with 2 findings."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Meridian CLE Partners", provider_type: "GOVERNMENT" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Pretrial Motions Intensive", delivery_format: "SELF_STUDY", total_minutes: 120, presented_at: "2026-06-05T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_pending_a: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Discovery Sanctions Update", delivery_format: "SELF_STUDY", total_minutes: 120, presented_at: "2026-06-06T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_pending_b: $.data.id }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Client Trust Compliance", delivery_format: "SELF_STUDY", total_minutes: 180, presented_at: "2026-06-10T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_appr_a: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Legal Technology Survey", delivery_format: "SELF_STUDY", total_minutes: 180, presented_at: "2026-06-20T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "TECHNOLOGY", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_appr_b: $.data.id }
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-06-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", trigger_type: "RANDOM" }
              as: BoardAdmin
              captures: { aud_id: $.data.id, aud_v1: $.data.version, aud_risk_open: $.data.risk_score_at_open }
            - call: "POST /cle/provider-audits/${aud_id}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${aud_v1}" }
              as: BoardAdmin
              captures: { aud_v2: $.data.version, aud_sample_size: $.data.sample_size }
            - call: "POST /cle/provider-audits/${aud_id}/audit-actions"
              payload: { action: "ISSUE_FINDINGS", expected_audit_version: "${aud_v2}", findings_count: 2 }
              as: BoardAdmin
              captures: { aud_v3: $.data.version }
            - call: "GET /cle/providers/${prov_id}"
              as: BoardAdmin
          trigger:
            - call: "POST /cle/provider-audits/${aud_id}/audit-actions"
              payload: { action: "CLOSE_SANCTIONED", expected_audit_version: "${aud_v3}", sanction_type: "PROBATION" }
              as: BoardAdmin
            - call: "GET /cle/providers/${prov_id}"
              as: BoardAdmin
          assert:
            - "ProviderAudit.${aud_id}.risk_score_at_open == 0.0 (all four factors zero at creation) so the LOW tier target of 2 applied"
            - "ProviderAudit.${aud_id}.sample_size == 2 and sampled_course_ids == [\"${c_appr_a}\", \"${c_appr_b}\"] in presented_at ASC order"
            - "Before the trigger: Provider.${prov_id}.risk_score_variant == SELF_CERTIFIED_WEIGHTING and risk_score == 0.25 (finding_rate = min(1.0, 2/2) = 1.0, weighted 0.25)"
            - "After the trigger: Provider.${prov_id}.accreditation_status == PROBATIONARY"
            - "After the trigger: Provider.${prov_id}.risk_score_variant == REVIEWED_WEIGHTING and risk_score == 0.13 (finding_rate = 2/4 = 0.5, weighted 0.125, ROUND_HALF_UP to 0.13)"
            - "Provider.${prov_id}.audit_findings_count == 2 and courses_sampled_lifetime == 2"
            - "Provider.${prov_id}.last_audit_closed_at == 2026-08-01T00:00:00.000Z"
            - "A FeeAssessment with fee_type == AUDIT_SANCTION, provider_id == ${prov_id}, amount_cents == 250000 and status == ASSESSED is discoverable via GET /cle/fee-assessments?provider_id=${prov_id}"

  - rule_id: combinatorial_formula
    instances:

      - name: nested_min_format_cap_room_across_three_simultaneous_ceilings
        grounds:
          - calculations.cycle_credit_application
          - domain_constants.SELF_STUDY_CAP_MINUTES
          - domain_constants.ON_DEMAND_CAP_MINUTES
          - domain_constants.NONLIVE_CAP_MINUTES
          - entities.CreditRecord.fields.effective_format
          - entities.CreditRecord.fields.countable_minutes
          - entities.ComplianceCycle.fields.earned_countable_minutes
        distinguishing_aspect: |
          Mode (a): countable = max(0, min(credited, format_cap - format_used, NONLIVE_CAP - nonlive_used))
          is a four-input nested min whose binding ceiling is different for every record in the chain
          — the per-format cap binds for the second on-demand record, the shared non-live cap binds
          for the self-study record even though only 0 of its own 360-minute allowance was spent, and
          no ceiling binds for the webcast record because its effective_format is LIVE (a conditional
          branch on the record's verification_method, not on the course's delivery_format).
          Falsifiable: an implementation that checks only the per-format cap credits the self-study
          record 240 instead of 180 and reports 1560 instead of 1500.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider; four APPROVED courses, all verified by ATTENDANCE_CODE so every credit record is VERIFIED on creation and the PROVISIONAL and FINAL variants agree."
            - "Courses: OD1 ON_DEMAND 720 min GENERAL; OD2 ON_DEMAND 180 min GENERAL; SS1 SELF_STUDY 240 min GENERAL; WEB1 LIVE_WEBCAST 600 min GENERAL."
            - "One ACTIVE attorney with a non-prorated 2026-01-01 -> 2028-01-01 cycle (required 1800 / 180 / 60 / 120)."
            - "Four credit records consumed in completion_date order: OD1 2026-02-01, OD2 2026-02-15, SS1 2026-03-01, WEB1 2026-03-15."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Northgate CLE Group", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Recorded Civil Procedure Marathon", delivery_format: "ON_DEMAND", total_minutes: 720, presented_at: "2026-01-02T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 720 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { od1_id: $.data.id, od1_code: $.data.attendance_code }
            - call: "POST /cle/courses"
              payload: { title: "Recorded Evidence Refresher", delivery_format: "ON_DEMAND", total_minutes: 180, presented_at: "2026-01-03T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { od2_id: $.data.id, od2_code: $.data.attendance_code }
            - call: "POST /cle/courses"
              payload: { title: "Self-Paced Appellate Briefing", delivery_format: "SELF_STUDY", total_minutes: 240, presented_at: "2026-01-04T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 240 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { ss1_id: $.data.id, ss1_code: $.data.attendance_code }
            - call: "POST /cle/courses"
              payload: { title: "Live Webcast: Contract Drafting", delivery_format: "LIVE_WEBCAST", total_minutes: 600, presented_at: "2026-03-15T08:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 600 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { web1_id: $.data.id, web1_code: $.data.attendance_code }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2002", full_name: "Marcus Idowu", admission_date: "2012-09-15T00:00:00Z", compliance_group: "GROUP_2", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${od1_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 720, completion_date: "2026-02-01T00:00:00Z", attendance_code: "${od1_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { r_od1: $.data.id, r_od1_countable: $.data.countable_minutes }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${od2_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 180, completion_date: "2026-02-15T00:00:00Z", attendance_code: "${od2_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { r_od2: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${ss1_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 240, completion_date: "2026-03-01T00:00:00Z", attendance_code: "${ss1_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { r_ss1: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${web1_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 600, completion_date: "2026-03-15T18:00:00Z", attendance_code: "${web1_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { r_web1: $.data.id }
            - call: "GET /cle/compliance-cycles/${cyc_id}/summary"
              as: Attorney
              as_user_id: "${att_id}"
          assert:
            - "CreditRecord.${r_od1}.effective_format == ON_DEMAND and countable_minutes == 720 (no ceiling binds: min(720, 720-0, 900-0))"
            - "CreditRecord.${r_od2}.effective_format == ON_DEMAND and countable_minutes == 0 (the ON_DEMAND_CAP_MINUTES ceiling binds: min(180, 720-720, 900-720) = 0)"
            - "CreditRecord.${r_ss1}.effective_format == SELF_STUDY and countable_minutes == 180 (the shared NONLIVE_CAP_MINUTES ceiling binds: min(240, 360-0, 900-720) = 180)"
            - "CreditRecord.${r_web1}.effective_format == LIVE and countable_minutes == 600 (ATTENDANCE_CODE verification makes a LIVE_WEBCAST count as LIVE, so no ceiling applies)"
            - "ComplianceCycle.${cyc_id}.earned_countable_minutes == 1500 and earned_live_minutes == 600"
            - "GET summary -> data.on_demand_used_minutes == 720, data.self_study_used_minutes == 180, data.nonlive_used_minutes == 900"
            - "GET summary -> data.projected_final_deficiency_total_minutes == 300 and data.projected_final_deficiency_ethics_minutes == 180"

      - name: per_category_rounding_before_summation_on_partial_attendance
        grounds:
          - calculations.credit_record_category_proration
          - domain_constants.ROUNDING_INCREMENT_MINUTES
          - domain_constants.MIN_CREDITABLE_MINUTES
          - entities.CreditAllocation.fields.minutes
          - entities.CreditRecord.fields.credited_minutes
          - entities.CreditRecord.fields.credited_ethics_minutes
        distinguishing_aspect: |
          Mode (b): the scaffold pins ROUND-PER-CATEGORY-THEN-SUM. A 300-minute course allocated
          ETHICS 90 / TECHNOLOGY 60 / GENERAL 150, attended for 200 minutes, yields
          floor(60/15)*15 + floor(40/15)*15 + floor(100/15)*15 = 60 + 30 + 90 = 180, whereas
          SUM-THEN-ROUND yields floor(200/15)*15 = 195. The 15-minute divergence exists only because
          the rounding happens per category, and TECHNOLOGY loses 10 minutes while GENERAL loses 10.
          Falsifiable: any implementation that rounds once reports credited_minutes 195.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider with one APPROVED LIVE_IN_PERSON course of 300 minutes, verified by ATTENDANCE_CODE, allocated ETHICS 90 / TECHNOLOGY 60 / GENERAL 150."
            - "One ACTIVE attorney with a non-prorated 2026-01-01 -> 2028-01-01 cycle."
            - "The attorney attended only 200 of the 300 minutes."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Harborview Bar Academy", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Ethics, Tech and Practice Day", delivery_format: "LIVE_IN_PERSON", total_minutes: 300, presented_at: "2026-03-02T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "ETHICS", minutes: 90 }, { category: "TECHNOLOGY", minutes: 60 }, { category: "GENERAL", minutes: 150 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { crs_id: $.data.id, crs_code: $.data.attendance_code }
            - call: "POST /cle/attorneys"
