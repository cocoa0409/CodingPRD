            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-07T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "PATCH /zones/${z1}"
              payload: { collection_date: "2027-01-12T00:00:00Z", expected_zone_version: "${z1_v}" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-07T00:00:01Z" }
              as: ProgramAdmin
            - call: "PATCH /zones/${z2}"
              payload: { collection_date: "2027-01-12T00:00:00Z", expected_zone_version: "${z2_v}" }
              as: ProgramAdmin
              captures: { e: $.data.error_id }
          assert:
