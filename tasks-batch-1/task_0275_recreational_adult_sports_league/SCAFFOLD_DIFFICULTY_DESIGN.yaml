# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Recreational Adult Sports League — 9 rules x 2 instances = 18 instances
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; OCC version
# inputs are ${var} bound from a prior captures: $.data.version.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_full_vs_partial_vs_none_diverges
        grounds:
          - calculations.team_withdraw_refund
          - entities.Payment.fields.amount_cents
          - entities.Team.fields.refund_issued_cents
          - state_machines.Team.CONFIRMED_to_WITHDRAWN_LOCKED
        distinguishing_aspect: >
          Same captured fee of 8000 cents yields 8000 (full, clock <= refund_full_cutoff_at)
          vs 4000 (partial, floor(8000*50/100), clock after cutoff) — a divergent refund on
          the Team/Payment cash domain, distinct from the standings_seed ordering domain.
        test_recipe:
          setup:
            - "Season OPEN with refund_full_cutoff_at=2026-09-10T00:00:00Z, refund_partial_pct=50."
            - "Two divisions each with one CONFIRMED team that paid an 8000-cent fee."
            - "Team T1 withdrawn while clock<=cutoff; Team T2 withdrawn while clock>cutoff and before any game."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Fall 2026", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z", refund_partial_pct: 50 }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "Coed B", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 8000 }
              as: LeagueAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "Coed C", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 8000 }
              as: LeagueAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Cap One", email: "c1@x.com" }
              as: LeagueAdmin
              captures: { cap1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Cap Two", email: "c2@x.com" }
              as: LeagueAdmin
              captures: { cap2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
              captures: { s_v1: $.data.version }
            - call: "GET /divisions/${d1_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d1_v: $.data.version }
            - call: "POST /divisions/${d1_id}/teams"
              payload: { name: "Alphas", captain_player_id: "${cap1_id}", expected_division_version: "${d1_v}" }
              as: TeamCaptain
              as_user_id: "${cap1_id}"
              captures: { t1_id: $.data.id }
            - call: "GET /divisions/${d2_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d2_v: $.data.version }
            - call: "POST /divisions/${d2_id}/teams"
              payload: { name: "Betas", captain_player_id: "${cap2_id}", expected_division_version: "${d2_v}" }
              as: TeamCaptain
              as_user_id: "${cap2_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /teams/${t1_id}/pay-fee"
              payload: { amount_cents: 8000 }
              as: TeamCaptain
              as_user_id: "${cap1_id}"
            - call: "POST /teams/${t2_id}/pay-fee"
              payload: { amount_cents: 8000 }
              as: TeamCaptain
              as_user_id: "${cap2_id}"
            - call: "POST /teams/${t1_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /teams/${t2_id}/confirm"
              payload: {}
              as: LeagueAdmin
          trigger:
            - call: "POST /teams/${t1_id}/withdraw"
              payload: {}
              as: LeagueAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /teams/${t2_id}/withdraw"
              payload: {}
              as: LeagueAdmin
          assert:
            - "Team.${t1_id}.refund_issued_cents == 8000"
            - "Team.${t2_id}.refund_issued_cents == 4000"
            - "GET /teams/${t1_id}/payments returns a REFUND row with amount_cents == 8000 and reason == FULL_WITHDRAWAL"
            - "GET /teams/${t2_id}/payments returns a REFUND row with amount_cents == 4000 and reason == PARTIAL_WITHDRAWAL"

      - name: standings_seed_h2h_vs_pointdiff_diverges
        grounds:
          - calculations.standings_seed
          - calculations.standings_points
          - entities.Division.fields.standings_tiebreaker
        distinguishing_aspect: >
          Two divisions with identical 3-3 tied teams produce a DIFFERENT seed-1 team
          under HEAD_TO_HEAD vs POINT_DIFFERENTIAL — divergent ordering on the
          Division/Team standings domain, distinct from the refund cash domain.
        test_recipe:
          setup:
            - "Two divisions, one with standings_tiebreaker=HEAD_TO_HEAD, one POINT_DIFFERENTIAL."
            - "Each has teams P and Q tied on points=3 but P won the head-to-head while Q has the better goal difference."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Tie Season", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "H2H Div", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 0, standings_tiebreaker: "HEAD_TO_HEAD" }
              as: LeagueAdmin
              captures: { dh_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "PH", email: "ph@x.com" }
              as: LeagueAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "QH", email: "qh@x.com" }
              as: LeagueAdmin
              captures: { qh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
              captures: { s_v1: $.data.version }
            - call: "GET /divisions/${dh_id}"
              payload: {}
              as: LeagueAdmin
              captures: { dh_v0: $.data.version }
            - call: "POST /divisions/${dh_id}/teams"
              payload: { name: "P", captain_player_id: "${ph_id}", expected_division_version: "${dh_v0}" }
              as: TeamCaptain
              as_user_id: "${ph_id}"
              captures: { tp_id: $.data.id }
            - call: "GET /divisions/${dh_id}"
              payload: {}
              as: LeagueAdmin
              captures: { dh_v1: $.data.version }
            - call: "POST /divisions/${dh_id}/teams"
              payload: { name: "Q", captain_player_id: "${qh_id}", expected_division_version: "${dh_v1}" }
              as: TeamCaptain
              as_user_id: "${qh_id}"
              captures: { tq_id: $.data.id }
            - call: "POST /teams/${tp_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /teams/${tq_id}/confirm"
              payload: {}
              as: LeagueAdmin
          trigger:
            - call: "GET /divisions/${dh_id}/standings"
              payload: {}
              as: LeagueAdmin
          assert:
            - "GET /divisions/${dh_id}/standings orders the head-to-head winner first when points are tied (HEAD_TO_HEAD chain applies head_to_head_points before goal_difference)"
            - "Under a sibling POINT_DIFFERENTIAL division with the same fixtures, the goal-difference leader is seeded first instead, proving the two tiebreak chains diverge on identical inputs"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: standings_seed_multifactor_tiebreak_mode_a
        grounds:
          - calculations.standings_seed
          - calculations.standings_points
          - entities.Division.fields.standings_tiebreaker
        distinguishing_aspect: >
          Mode (a): the seed ranking is a >=4-input non-linear comparator
          (points, head_to_head_points, goal_difference, points_for, created_at) whose
          branch order is selected by the standings_tiebreaker enum — nested conditional
          tie-break selection, not a single tiered rate.
        test_recipe:
          setup:
            - "A POINT_DIFFERENTIAL division with three teams tied on points but separable only by goal_difference then points_for."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Multi Season", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "PD Div", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 6, registration_fee_cents: 0, standings_tiebreaker: "POINT_DIFFERENTIAL" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "A", email: "a@x.com" }
              as: LeagueAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "TA", captain_player_id: "${pa_id}", expected_division_version: "${d_v}" }
              as: TeamCaptain
              as_user_id: "${pa_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /teams/${ta_id}/confirm"
              payload: {}
              as: LeagueAdmin
          trigger:
            - call: "GET /divisions/${d_id}/standings"
              payload: {}
              as: LeagueAdmin
          assert:
            - "Standings order is fully determined by the POINT_DIFFERENTIAL chain: points DESC, then goal_difference DESC, then points_for DESC, then head_to_head_points DESC, then created_at ASC"
            - "No ranking decision uses Team.id; created_at ASC is the only terminal tie-break"

      - name: partial_refund_floor_multiply_before_divide_mode_b
        grounds:
          - calculations.team_withdraw_refund
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: >
          Mode (b): the partial refund pins the rounding ORDER —
          floor(refundable_base * refund_partial_pct / 100) (multiply before divide, then
          truncate). 7500*40 then /100 then floor = 3000, which differs from
          floor(7500 * (40/100)) float paths; the scaffold fixes the integer order.
        test_recipe:
          setup:
            - "Season with refund_partial_pct=40; a CONFIRMED team that paid 7500 cents; clock advanced past refund_full_cutoff_at before any game."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Floor Season", sport: "BASKETBALL", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-05T00:00:00Z", refund_partial_pct: 40 }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "Floor Div", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 7500 }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Cap F", email: "capf@x.com" }
              as: LeagueAdmin
              captures: { capf_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "Floorers", captain_player_id: "${capf_id}", expected_division_version: "${d_v}" }
              as: TeamCaptain
              as_user_id: "${capf_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /teams/${tf_id}/pay-fee"
              payload: { amount_cents: 7500 }
              as: TeamCaptain
              as_user_id: "${capf_id}"
            - call: "POST /teams/${tf_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: LeagueAdmin
          trigger:
            - call: "POST /teams/${tf_id}/withdraw"
              payload: {}
              as: TeamCaptain
              as_user_id: "${capf_id}"
          assert:
            - "Team.${tf_id}.refund_issued_cents == 3000"
            - "GET /teams/${tf_id}/payments returns a REFUND row with amount_cents == 3000 and reason == PARTIAL_WITHDRAWAL"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: game_parallel_schedule_x_score_dimensions
        grounds:
          - state_machines.Game.SCHEDULED_to_FORFEITED
          - state_machines.Game.PENDING_to_SUBMITTED
          - state_machines.Game.SUBMITTED_to_CONFIRMED
          - entities.Game.fields.schedule_status
          - entities.Game.fields.score_status
        distinguishing_aspect: >
          Game carries two independent axes: schedule_status and score_status evolve on the
          same row (a forfeit drives schedule_status->FORFEITED AND score_status->CONFIRMED
          together; a normal confirm drives score_status->CONFIRMED then schedule_status->PLAYED)
          — parallel dimensions, an entity distinct from the ConductReport cycle below.
        test_recipe:
          setup:
            - "A SCHEDULED game between two CONFIRMED teams whose score_status is still PENDING."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "PX Season", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "PX Div", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 0 }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Field A", field_count: 2, turnover_buffer_minutes: 30 }
              as: LeagueAdmin
              captures: { v_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Cap H", email: "caph@x.com" }
              as: LeagueAdmin
              captures: { caph_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Cap V", email: "capv@x.com" }
              as: LeagueAdmin
              captures: { capv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
              captures: { s_v1: $.data.version }
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v0: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "Home", captain_player_id: "${caph_id}", expected_division_version: "${d_v0}" }
              as: TeamCaptain
              as_user_id: "${caph_id}"
              captures: { th_id: $.data.id }
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v1: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "Away", captain_player_id: "${capv_id}", expected_division_version: "${d_v1}" }
              as: TeamCaptain
              as_user_id: "${capv_id}"
              captures: { tv_id: $.data.id }
            - call: "POST /teams/${th_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /teams/${tv_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /divisions/${d_id}/games"
              payload: { home_team_id: "${th_id}", away_team_id: "${tv_id}", venue_id: "${v_id}", field_index: 1, round_index: 1, starts_at: "2026-09-15T18:00:00Z", ends_at: "2026-09-15T19:30:00Z" }
              as: LeagueAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /games/${g_id}/forfeit"
              payload: { forfeiting_team_id: "${tv_id}" }
              as: LeagueAdmin
          assert:
            - "Game.${g_id}.schedule_status == FORFEITED"
            - "Game.${g_id}.score_status == CONFIRMED"
            - "Team.${th_id}.points == 3 and Team.${th_id}.wins == 1 (forfeit win 3-0 for the non-forfeiting team)"
            - "Team.${tv_id}.losses == 1"

      - name: conduct_report_uphold_appeal_cycle
        grounds:
          - state_machines.ConductReport.UPHELD_to_APPEALED
          - state_machines.ConductReport.APPEALED_to_UPHELD
          - entities.ConductReport.fields.status
        distinguishing_aspect: >
          ConductReport cycles UPHELD->APPEALED->UPHELD (appeal denied) — a true loop on the
          status axis of a different entity than Game, satisfying the non-linear requirement
          via a cycle rather than parallel dimensions.
        test_recipe:
          setup:
            - "A ConductReport that has been UPHELD against a rostered player of a captain's team."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Cyc Season", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "Cyc Div", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 0 }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Cyc Venue", field_count: 1, turnover_buffer_minutes: 0 }
              as: LeagueAdmin
              captures: { v_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Cap C", email: "capc@x.com" }
              as: LeagueAdmin
              captures: { capc_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Cap D", email: "capd@x.com" }
              as: LeagueAdmin
              captures: { capd_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v0: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "CHome", captain_player_id: "${capc_id}", expected_division_version: "${d_v0}" }
              as: TeamCaptain
              as_user_id: "${capc_id}"
              captures: { tc_id: $.data.id }
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v1: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "DAway", captain_player_id: "${capd_id}", expected_division_version: "${d_v1}" }
              as: TeamCaptain
              as_user_id: "${capd_id}"
              captures: { td_id: $.data.id }
            - call: "POST /teams/${tc_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /teams/${td_id}/confirm"
              payload: {}
              as: LeagueAdmin
            - call: "POST /divisions/${d_id}/games"
              payload: { home_team_id: "${tc_id}", away_team_id: "${td_id}", venue_id: "${v_id}", field_index: 1, round_index: 1, starts_at: "2026-09-15T18:00:00Z", ends_at: "2026-09-15T19:30:00Z" }
              as: LeagueAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conduct-reports"
              payload: { game_id: "${g_id}", player_id: "${capc_id}", severity: "YELLOW" }
              as: ConductOfficer
              captures: { r_id: $.data.id }
            - call: "POST /conduct-reports/${r_id}/transition"
              payload: { target: "UNDER_REVIEW" }
              as: ConductOfficer
            - call: "POST /conduct-reports/${r_id}/transition"
              payload: { target: "UPHELD" }
              as: ConductOfficer
          trigger:
            - call: "POST /conduct-reports/${r_id}/transition"
              payload: { target: "APPEALED" }
              as: TeamCaptain
              as_user_id: "${capc_id}"
              captures: { st_appealed: $.data.status }
            - call: "POST /conduct-reports/${r_id}/transition"
              payload: { target: "UPHELD" }
              as: ConductOfficer
              captures: { st_reupheld: $.data.status }
          assert:
            - "After the appeal: ConductReport.${r_id}.status == APPEALED"
            - "After the appeal denial: ConductReport.${r_id}.status == UPHELD (loop returned to UPHELD)"
            - "Player.${capc_id}.conduct_points == 2 throughout (APPEALED reports keep counting; the cycle does not drop points)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirmed_withdraw_cancels_games_releases_refs_depth3
        grounds:
          - state_machines.Team.CONFIRMED_to_WITHDRAWN_LOCKED
          - state_machines.Game.SCHEDULED_to_CANCELLED
          - entities.RefereeAssignment.fields.state
          - entities.Game.fields.schedule_status
        distinguishing_aspect: >
          Depth-3 chain: withdraw(Team) -> Game(s) involving the team CANCELLED ->
          each CANCELLED Game's RefereeAssignments RELEASED. The third hop is caused by the
          second hop (game cancellation), not by the original withdraw, distinguishing it
          from the conduct cascade's trigger.
        test_recipe:
          setup:
            - "Season SCHEDULED with a CONFIRMED team that has a SCHEDULED game with an ASSIGNED HEAD referee."
          setup_api_calls:
