# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7.
# All chains start from an empty DB; the logical clock starts at
# 2026-08-01T00:00:00Z and only moves via POST /_clock/set_current_utc.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: payer_creation_applies_declared_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Payer.fields.snf_auth_required
          - entities.Payer.fields.hh_auth_required
          - entities.Payer.fields.auth_expiry_days
        distinguishing_aspect: "Omitting snf_auth_required, hh_auth_required and auth_expiry_days yields true, true and 30; the response also carries a server-minted UUID id with no type prefix and version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /payers"
              payload: { name: "Bare Minimum Plan", coinsurance_pct: 0.100 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Payer.${payer_id}.snf_auth_required == true"
            - "Payer.${payer_id}.hh_auth_required == true"
            - "Payer.${payer_id}.auth_expiry_days == 30"
            - "Payer.${payer_id}.coinsurance_pct == 0.100"
            - "Payer.${payer_id}.version == 1"
            - "Payer.${payer_id}.id matches the bare UUID form (36 chars, no 'pay_' prefix)"

      - name: patient_creation_and_single_read_roundtrip
        claim_type: retrieval
        grounds:
          - entities.Patient.fields.mrn
          - entities.Patient.fields.primary_payer_id
        distinguishing_aspect: "GET /patients/{id} returns exactly the seven input fields as stored plus the four common fields; created_at and updated_at are equal on a never-mutated row."
        test_recipe:
          setup: ["One payer exists"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C001", full_name: "Ana Bello", date_of_birth: "1952-02-02", primary_payer_id: "${payer_id}", prior_admissions_180d: 1, lives_alone: true, has_pcp: false }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
          assert:
            - "HTTP status == 200"
            - "Patient.${pat_id}.mrn == MRN-C001"
            - "Patient.${pat_id}.primary_payer_id == ${payer_id}"
            - "Patient.${pat_id}.prior_admissions_180d == 1 and lives_alone == true and has_pcp == false"
            - "Patient.${pat_id}.created_at == Patient.${pat_id}.updated_at"
            - "Patient.${pat_id}.version == 1"

      - name: episode_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_EPISODE_NOT_FOUND]
          - "validations[priority=4]"
        distinguishing_aspect: "A syntactically valid but unused UUID in the episode path yields ERR_EPISODE_NOT_FOUND with HTTP 404, never a 500 or an empty 200."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /episodes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_EPISODE_NOT_FOUND"
            - "response_type == error"

      - name: patient_create_missing_required_mrn_returns_validation
        claim_type: required_fields
        grounds:
          - "validations[priority=5]"
          - errors[ERR_VALIDATION]
          - entities.Patient.fields.mrn
        distinguishing_aspect: "Omitting the input-sourced field mrn, which has no default, fails with ERR_VALIDATION 400 and creates no Patient row."
        test_recipe:
          setup: ["One payer exists"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { full_name: "No Mrn", date_of_birth: "1952-02-02", primary_payer_id: "${payer_id}", prior_admissions_180d: 1, lives_alone: true, has_pcp: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_VALIDATION"
            - "GET /patients returns total_count == 0"

      - name: provider_create_with_out_of_range_star_rating_returns_validation
        claim_type: type_constraints
        grounds:
          - "validations[priority=5]"
          - entities.PostAcuteProvider.fields.quality_star_rating
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "quality_star_rating 6 sits one above the declared 1..5 range and is rejected with ERR_VALIDATION 400; a rating of 5 on the same body would succeed."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /providers"
              payload: { name: "Over Rated SNF", provider_type: "SNF", quality_star_rating: 6, distance_miles_from_hospital: 4, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_VALIDATION"
            - "GET /providers returns total_count == 0"

      - name: episode_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Episode.fields.case_status
          - entities.Episode.fields.barrier_posture
          - entities.Episode.fields.logistics_committed_cents
        distinguishing_aspect: "Client-supplied case_status, barrier_posture and logistics_committed_cents are ignored: the episode is created ADMITTED / CLEAR / 0 regardless of what the body claims."
        test_recipe:
          setup: ["One payer and one patient exist"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C002", full_name: "Bea Cruz", date_of_birth: "1950-05-05", primary_payer_id: "${payer_id}", prior_admissions_180d: 0, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "ELECTIVE", drg_code: "DRG-470", drg_gmlos_days: 3.5, attending_unit: "7E", admitted_at: "2026-08-01T00:00:00Z", case_status: "DISCHARGED", barrier_posture: "ESCALATED", logistics_committed_cents: 999999 }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Episode.${ep_id}.case_status == ADMITTED"
            - "Episode.${ep_id}.barrier_posture == CLEAR"
            - "Episode.${ep_id}.logistics_committed_cents == 0"
            - "Episode.${ep_id}.assigned_case_manager_id == cm-alpha"
            - "Episode.${ep_id}.current_risk_score == 0 and current_risk_band == LOW"
            - "Episode.${ep_id}.version == 1"

      - name: patients_listing_paginates_and_filters_by_payer
        claim_type: listing
        grounds:
          - entities.Patient.fields.primary_payer_id
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three patients on payer A and one on payer B, GET /patients?primary_payer_id=A&limit=2&offset=0 returns 2 rows in created_at ASC order, total_count 3 and has_more true."
        test_recipe:
          setup: ["Two payers; three patients on payer A created in a known order and one patient on payer B"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Payer A", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_a: $.data.id }
            - call: "POST /payers"
              payload: { name: "Payer B", coinsurance_pct: 0.150 }
              as: PlatformAdmin
              captures: { payer_b: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C101", full_name: "P One", date_of_birth: "1950-01-01", primary_payer_id: "${payer_a}", prior_admissions_180d: 0, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C102", full_name: "P Two", date_of_birth: "1951-01-01", primary_payer_id: "${payer_a}", prior_admissions_180d: 0, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C103", full_name: "P Three", date_of_birth: "1952-01-01", primary_payer_id: "${payer_a}", prior_admissions_180d: 0, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { p3: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C104", full_name: "P Four", date_of_birth: "1953-01-01", primary_payer_id: "${payer_b}", prior_admissions_180d: 0, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { p4: $.data.id }
          trigger:
            - call: "GET /patients?primary_payer_id=${payer_a}&limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP status == 200 and response_type == array"
            - "meta pagination reports total_count == 3, limit == 2, offset == 0, has_more == true"
            - "exactly 2 rows are returned and the first row id == ${p1} (created_at ASC)"
            - "the row for ${p4} is absent"

      - name: network_contract_many_to_many_reverse_lookup_from_both_sides
        claim_type: parent_relationships
        grounds:
          - entities.NetworkContract.fields.payer_id
          - entities.NetworkContract.fields.provider_id
        distinguishing_aspect: "The junction row is discoverable from either side of the many-to-many edge: GET /network-contracts?payer_id=P returns both contracts of that payer, and GET /network-contracts?provider_id=X returns only the one for that provider."
        test_recipe:
          setup: ["One payer, two providers, and one NetworkContract per provider"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Cedar SNF", provider_type: "SNF", quality_star_rating: 4, distance_miles_from_hospital: 6, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_a: $.data.id }
            - call: "POST /providers"
              payload: { name: "Birch SNF", provider_type: "SNF", quality_star_rating: 5, distance_miles_from_hospital: 22, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_b: $.data.id }
            - call: "POST /network-contracts"
              payload: { payer_id: "${payer_id}", provider_id: "${prov_a}", in_network: true, negotiated_daily_rate_cents: 30000 }
              as: PlatformAdmin
              captures: { nc_a: $.data.id }
            - call: "POST /network-contracts"
              payload: { payer_id: "${payer_id}", provider_id: "${prov_b}", in_network: false, negotiated_daily_rate_cents: 41000 }
              as: PlatformAdmin
              captures: { nc_b: $.data.id }
          trigger:
            - call: "GET /network-contracts?payer_id=${payer_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /network-contracts?provider_id=${prov_b}"
              payload: {}
              as: PlatformAdmin
              captures: { only_b: "$.data[0].id" }
          assert:
            - "the payer-filtered list returns total_count == 2 containing ${nc_a} and ${nc_b}"
            - "the provider-filtered list returns total_count == 1 whose row id == ${nc_b}"
            - "NetworkContract.${nc_b}.in_network == false and negotiated_daily_rate_cents == 41000"
            - "GET /network-contracts/${nc_a} returns in_network == true"

  - section: state_machines
    instances:

      - name: barrier_status_change_from_waived_returns_invalid_barrier_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Barrier.OPEN_to_WAIVED
          - errors[ERR_INVALID_BARRIER_STATE]
        distinguishing_aspect: "WAIVED is the Barrier machine's only terminal state; a subsequent to_status RESOLVED is refused with ERR_INVALID_BARRIER_STATE 409 and clock_stop_at is not moved."
        test_recipe:
          setup:
            - "An Episode with one manually opened TRANSPORT barrier that a UtilizationReviewNurse (a different user than the opener) has WAIVED at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C201", full_name: "Cal Ito", date_of_birth: "1949-03-03", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "EMERGENT", drg_code: "DRG-291", drg_gmlos_days: 4.5, attending_unit: "5W", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
            - call: "POST /episodes/${ep_id}/barriers"
              payload: { barrier_code: "TRANSPORT", severity: "MEDIUM", delay_reason_code: "AWAITING_TRANSPORT" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { bar_id: $.data.id }
            - call: "POST /barriers/${bar_id}/status"
              payload: { to_status: "WAIVED" }
              as: UtilizationReviewNurse
              as_user_id: "ur-beta"
          trigger:
            - call: "POST /barriers/${bar_id}/status"
              payload: { to_status: "RESOLVED" }
              as: UtilizationReviewNurse
              as_user_id: "ur-beta"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_INVALID_BARRIER_STATE"
            - "Barrier.${bar_id}.status == WAIVED"
            - "Barrier.${bar_id}.clock_stop_at == 2026-08-01T00:00:00.000Z"
            - "Episode.${ep_id}.barrier_posture == CLEAR"

      - name: episode_initial_state_is_admitted_with_clear_posture
        claim_type: initial_state
        grounds:
          - state_machines.Episode.case_status
          - entities.Episode.fields.case_status
        distinguishing_aspect: "A freshly created Episode reads case_status ADMITTED and barrier_posture CLEAR, and every planning action that requires PLANNING is refused from there."
        test_recipe:
          setup: ["One payer, one patient, and a brand-new Episode with nothing else done"]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C202", full_name: "Dot Emeka", date_of_birth: "1947-04-04", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "EMERGENT", drg_code: "DRG-291", drg_gmlos_days: 4.5, attending_unit: "5W", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
          trigger:
            - call: "POST /episodes/${ep_id}/mark-ready"
              payload: { discharge_disposition: "HOME_SELF_CARE" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_INVALID_EPISODE_STATE"
            - "Episode.${ep_id}.case_status == ADMITTED"
            - "Episode.${ep_id}.barrier_posture == CLEAR"
            - "Episode.${ep_id}.marked_ready_by_user_id == null"

      - name: screening_submitted_twice_returns_invalid_screening_state
        claim_type: idempotency
        grounds:
          - state_machines.RiskScreening.DRAFT_to_SUBMITTED
          - errors[ERR_INVALID_SCREENING_STATE]
        distinguishing_aspect: "Re-submitting an already SUBMITTED screening is refused with ERR_INVALID_SCREENING_STATE 409; the score is not recomputed and no second auto-barrier appears."
        test_recipe:
          setup:
            - "An Episode whose ADMISSION screening (functional 4, cognitive 8, social 4, meds 10, patient lives_alone true) has been submitted once, producing one HOUSING auto-barrier"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C203", full_name: "Eli Farr", date_of_birth: "1945-05-05", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: true, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "EMERGENT", drg_code: "DRG-291", drg_gmlos_days: 4.5, attending_unit: "5W", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
            - call: "POST /episodes/${ep_id}/screenings"
              payload: { screening_type: "ADMISSION", functional_score: 4, cognitive_score: 8, social_support_score: 4, medication_count: 10 }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { scr_id: $.data.id }
            - call: "POST /screenings/${scr_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { first_score: $.data.composite_risk_score }
          trigger:
            - call: "POST /screenings/${scr_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_INVALID_SCREENING_STATE"
            - "RiskScreening.${scr_id}.composite_risk_score == 63 and risk_band == HIGH"
            - "GET /episodes/${ep_id}/barriers returns exactly 1 row: barrier_code == HOUSING, severity == HIGH, delay_reason_code == AWAITING_FAMILY, origin == SCREENING_AUTO (rule S1 is skipped because has_pcp is true, and the refused second submit adds nothing)"
            - "Episode.${ep_id}.case_status == SCREENED"

      - name: barrier_reopen_cycle_increments_reopen_count_without_delay_drift
        claim_type: cyclic
        grounds:
          - state_machines.Barrier.RESOLVED_to_OPEN
          - entities.Barrier.fields.reopen_count
          - calculations.avoidable_delay_hours
        distinguishing_aspect: "Resolving at 2026-08-03T00:00:00Z (48h accrued), reopening at the same logical instant and resolving again leaves avoidable_delay_hours at 48.0 while reopen_count becomes 1 - the zero-length reopened interval [T, T) contributes nothing."
        test_recipe:
          setup:
            - "An Episode with one AWAITING_BED barrier opened at 2026-08-01T00:00:00Z and no auto-barriers"
            - "The logical clock has been advanced to 2026-08-03T00:00:00Z and the barrier RESOLVED there"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C204", full_name: "Fin Gopal", date_of_birth: "1948-06-06", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "EMERGENT", drg_code: "DRG-291", drg_gmlos_days: 4.5, attending_unit: "5W", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
            - call: "POST /episodes/${ep_id}/barriers"
              payload: { barrier_code: "BED_AVAILABILITY", severity: "MEDIUM", delay_reason_code: "AWAITING_BED" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { bar_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barriers/${bar_id}/status"
              payload: { to_status: "RESOLVED" }
              as: CaseManager
              as_user_id: "cm-alpha"
          trigger:
            - call: "POST /barriers/${bar_id}/status"
              payload: { to_status: "OPEN" }
              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "POST /barriers/${bar_id}/status"
              payload: { to_status: "RESOLVED" }
              as: CaseManager
              as_user_id: "cm-alpha"
          assert:
            - "Barrier.${bar_id}.reopen_count == 1"
            - "Barrier.${bar_id}.status == RESOLVED"
            - "Barrier.${bar_id}.clock_start_at == 2026-08-03T00:00:00.000Z (reset by the reopen)"
            - "Barrier.${bar_id}.clock_stop_at == 2026-08-03T00:00:00.000Z"
            - "Episode.${ep_id}.avoidable_delay_hours == 0.0 (only the current interval counts, and it is zero-length)"
            - "Episode.${ep_id}.barrier_posture == CLEAR"

      - name: authorization_third_appeal_returns_appeal_limit_reached
        claim_type: cyclic
        grounds:
          - state_machines.AuthorizationRequest.DENIED_to_SUBMITTED
          - "validations[priority=64]"
          - errors[ERR_APPEAL_LIMIT_REACHED]
        distinguishing_aspect: "The DENIED -> SUBMITTED loop terminates at MAX_APPEAL_ROUNDS == 2: appeals 1 and 2 succeed, and the third is refused with ERR_APPEAL_LIMIT_REACHED 422 while appeal_round stays 2."
        test_recipe:
          setup:
            - "An Episode with an AuthorizationRequest that has been denied, appealed, denied, appealed and denied again, so appeal_round == 2 and status == DENIED"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Health", coinsurance_pct: 0.200, snf_auth_required: true }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
