scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_site_success_and_defaults
        claim_type: creation
        grounds:
          - "entities.CustomerSite"
          - "endpoints[POST /vmi/sites]"
        distinguishing_aspect: "POST /vmi/sites with all required fields returns 201; status defaults to ACTIVE and outstanding_balance_cents defaults to 0 without being accepted as input."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vmi/sites"
              payload: { name: "Acme Plant", ship_to_code: "ACME-1", credit_limit_cents: 500000, delivery_mode: "LINE_SIDE" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
          assert:
            - "HTTP 201; CustomerSite.${site_id}.status == ACTIVE"
            - "CustomerSite.${site_id}.outstanding_balance_cents == 0"
            - "CustomerSite.${site_id}.version == 1 and id is a prefix-free UUID"

      - name: get_site_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.CustomerSite"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /vmi/sites/{random-uuid} returns ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vmi/sites/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: create_part_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Part"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /vmi/parts omitting unit_price_cents returns ERR_INVALID_REQUEST (400); the same omission pattern applies to sku/description/total_stock_qty."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-NF", description: "incomplete", is_critical: false, total_stock_qty: 10 }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: create_part_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.CustomerSite.fields.delivery_mode"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /vmi/sites with delivery_mode 'AIR_DROP' (outside {DOCK_TO_STOCK, LINE_SIDE}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vmi/sites"
              payload: { name: "Bad Enum", ship_to_code: "BE-1", credit_limit_cents: 100, delivery_mode: "AIR_DROP" }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: bin_agreement_flat_price_required_only_for_cost_per_bin
        claim_type: conditional_validation
        grounds:
          - "entities.BinAgreement.fields.flat_bin_price_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "pricing_mode COST_PER_BIN without flat_bin_price_cents is rejected with ERR_INVALID_REQUEST; the same body with pricing_mode UNIT_PRICE succeeds (conditional required-field rule)."
        test_recipe:
          setup:
            - "Site S and part P exist"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "CV-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "CV-P", description: "bolt", is_critical: false, unit_price_cents: 100, total_stock_qty: 1000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
          trigger:
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "L1", pricing_mode: "COST_PER_BIN", min_qty: 1, max_qty: 10 }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400) — flat_bin_price_cents required when pricing_mode == COST_PER_BIN"

      - name: part_computed_available_qty_initialized_from_stock
        claim_type: computed_fields
        grounds: [entities.Part.fields.available_qty]
        distinguishing_aspect: "On part creation, available_qty is computed as total_stock_qty (reserved 0); a client-supplied available_qty is ignored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vmi/parts"
              payload: { sku: "CP-1", description: "computed", is_critical: false, unit_price_cents: 100, total_stock_qty: 250 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
          assert:
            - "Part.${part_id}.available_qty == 250 and reserved_qty == 0"

      - name: list_endpoints_paginate_with_defaults
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /vmi/parts]"
        distinguishing_aspect: "GET /vmi/parts with no params returns at most 10 items plus pagination fields total_count and has_more per the fixed envelope."
        test_recipe:
          setup:
            - "12 parts created"
          setup_api_calls:
            - call: "POST /vmi/parts"
              payload: { sku: "PG-01", description: "p1", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-02", description: "p2", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-03", description: "p3", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-04", description: "p4", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-05", description: "p5", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-06", description: "p6", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-07", description: "p7", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-08", description: "p8", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-09", description: "p9", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-10", description: "p10", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-11", description: "p11", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
            - call: "POST /vmi/parts"
              payload: { sku: "PG-12", description: "p12", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
          trigger:
            - call: "GET /vmi/parts"
              payload: {}
              as: DistributorAdmin
          assert:
            - "response data array length == 10 (default limit)"
            - "total_count == 12 and has_more == true"

      - name: list_parts_filter_by_status
        claim_type: listing
        grounds:
          - "endpoints[GET /vmi/parts]"
        distinguishing_aspect: "GET /vmi/parts?status=OBSOLETE returns only obsoleted parts; default list includes all statuses."
        test_recipe:
          setup:
            - "Two parts: PA active, PB obsoleted"
          setup_api_calls:
            - call: "POST /vmi/parts"
              payload: { sku: "FLT-A", description: "a", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "FLT-B", description: "b", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /vmi/parts/${pb_id}/obsolete"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "GET /vmi/parts?status=OBSOLETE"
              payload: {}
              as: DistributorAdmin
          assert:
            - "Every returned part has status == OBSOLETE and total_count == 1"

      - name: part_cross_reference_common_fields_false_immutable
        claim_type: immutability
        grounds: [entities.PartCrossReference]
        distinguishing_aspect: "PartCrossReference has common_fields false: it carries id and created_at only (no version, no updated_at) and exposes no update endpoint — it can only be created and listed."
        test_recipe:
          setup:
            - "Parts PA and PB exist"
          setup_api_calls:
            - call: "POST /vmi/parts"
              payload: { sku: "XR-A", description: "a", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "XR-B", description: "b", is_critical: false, unit_price_cents: 10, total_stock_qty: 1 }
              as: DistributorAdmin
              captures: { pb_id: $.data.id }
          trigger:
            - call: "POST /vmi/part-cross-references"
              payload: { from_part_id: "${pa_id}", to_part_id: "${pb_id}", priority_rank: 1 }
              as: DistributorAdmin
              captures: { xr_id: $.data.id }
          assert:
            - "PartCrossReference.${xr_id}.is_active == true (default applied)"
            - "Response contains id and created_at but no version field"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: retire_site_with_live_agreement_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.CustomerSite.ACTIVE_to_RETIRED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A site with an ACTIVE bin agreement cannot retire — the precondition 'no live agreements' is enforced with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Site S with one ACTIVE bin agreement"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "RT-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "RT-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "R1", pricing_mode: "UNIT_PRICE", min_qty: 1, max_qty: 10 }
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/sites/${site_id}/retire"
              payload: {}
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "CustomerSite.${site_id}.status == ACTIVE (unchanged)"

      - name: obsolete_part_with_open_confirmed_order_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Part.ACTIVE_to_OBSOLETE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A part with a CONFIRMED replenishment order cannot be obsoleted — ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Site S (credit high), part P, agreement min 10 max 100, order confirmed after scan at 5"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "OB-1", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "OB-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "O1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { order_id: $.data.generated_order_id }
            - call: "POST /vmi/replenishment-orders/${order_id}/confirm"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/parts/${part_id}/obsolete"
              payload: {}
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "Part.${part_id}.status == ACTIVE (unchanged)"

      - name: cancel_route_deletes_pending_stops
        claim_type: side_effect_execution
        grounds: [state_machines.ReplenishmentRoute.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SCHEDULED route deletes its PENDING stops — GET of the deleted stop afterwards returns ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Site S, part P, agreement, route created (not started), one stop created"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "CX-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "CX-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "X1", pricing_mode: "UNIT_PRICE", min_qty: 1, max_qty: 10 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /vmi/routes/${route_id}/cancel"
              payload: {}
              as: RouteDriver
            - call: "GET /vmi/route-stops/${stop_id}"
              payload: {}
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
            - "ReplenishmentRoute.${route_id}.status == CANCELLED"
            - "GET stop returns error_id == ERR_NOT_FOUND (PENDING stop deleted by cascade)"

      - name: route_start_before_window_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ReplenishmentRoute.SCHEDULED_to_IN_PROGRESS"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /vmi/routes/{id}/start while the logical clock is before window_start is rejected with ERR_INVALID_STATE — the temporal precondition is part of the transition guard."
        test_recipe:
          setup:
            - "Site S, route with window 2026-08-10T08:00-12:00; logical clock at 2026-08-09T09:00 (before window)"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "WS-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T09:00:00Z" }
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "ReplenishmentRoute.${route_id}.status == SCHEDULED"

      - name: terminal_state_lockdown_on_cancelled_order
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ReplenishmentOrder]
        distinguishing_aspect: "From terminal CANCELLED, every action (ship, deliver, dispute) returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Site S, part P, agreement min 10 max 100; order created via scan at 5 then cancelled from DRAFT"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "TL-1", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "TL-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "T1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { order_id: $.data.generated_order_id }
            - call: "POST /vmi/replenishment-orders/${order_id}/cancel"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/replenishment-orders/${order_id}/ship"
              payload: {}
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409) — CANCELLED is terminal"

      - name: double_submit_stop_is_idempotency_rejection
        claim_type: idempotency
        grounds:
          - "state_machines.RouteStop.PENDING_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Submitting the same stop twice: the second submit observes status SUBMITTED and fails with ERR_INVALID_STATE; no second order is created."
        test_recipe:
          setup:
            - "Site S, part P, agreement min 10 max 100; route started; stop submitted at 5 (order created)"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "ID-1", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "ID-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "U1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
          trigger:
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
