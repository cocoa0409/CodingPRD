              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { det_initial: $.data.determination_status, score_initial: $.data.design_score }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Direct notice r1", delivery_channel: "IN_APP_MODAL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], disclosed_integration_vendors: ["PlaySafe Contextual"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /third-party-integrations"
              payload: { service_id: "${svc_id}", vendor_name: "PlaySafe Contextual", integration_type: "CONTEXTUAL_AD_NETWORK", collects_persistent_identifier: false, placement_area: "CHILD_DIRECTED_AREA" }
              as: ComplianceOfficer
              captures: { intg_id: $.data.id }
            - call: "POST /third-party-integrations/${intg_id}/status"
              payload: { to_status: "AUDIT_PENDING", audit_note: "contextual network queued" }
              as: ComplianceOfficer
            - call: "POST /third-party-integrations/${intg_id}/status"
              payload: { to_status: "APPROVED", audit_note: "contextual only, no behavioural profiling" }
              as: ComplianceOfficer
              captures: { intg_points: $.data.exposure_points }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_before: $.data.third_party_exposure_points, posture_before: $.data.compliance_posture, decisions_before: $.data.audit_decision_count }
          trigger:
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "VISUAL_CONTENT", rating: "STRONG", evidence_note: "cartoon-first redesign shipped" }
              as: ComplianceOfficer
              captures: { seq_2: $.data.evidence_sequence }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { score_after_evidence: $.data.design_score, det_after_evidence: $.data.determination_status, intg_status_after_evidence: $.data.open_audit_count }
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { det_final: $.data.determination_status, exposure_after: $.data.third_party_exposure_points, open_audits_after: $.data.open_audit_count, posture_after: $.data.compliance_posture }
            - call: "POST /online-services/${svc_id}/posture"
              payload: { posture_override: "OPEN" }
              as: ComplianceOfficer
              captures: { err_open_audits: $.data.error_id }
          assert:
            - "${det_initial} == MIXED_AUDIENCE and ${score_initial} == 0.60"
            - "${intg_points} == 5 (CONTEXTUAL_AD_NETWORK 5 x 1) and ${exposure_before} == 5 and ${posture_before} == OPEN and ${decisions_before} == 1"
            - "${seq_2} == 2"
            - "${score_after_evidence} == 0.76 (SUBJECT_MATTER 30/50 x 0.60 = 0.36 plus VISUAL_CONTENT 20/50 x 1.00 = 0.40)"
            - "${det_after_evidence} == MIXED_AUDIENCE and ${intg_status_after_evidence} == 0 (appending evidence starts no cascade)"
            - "LINK 1: ${det_final} == CHILD_DIRECTED_PRIMARY (0.76 >= DESIGN_PRIMARY_THRESHOLD 0.75)"
            - "LINK 2: ThirdPartyIntegration.${intg_id}.status == AUDIT_PENDING with audit_note == 're-audit forced by child-directed determination'"
            - "LINK 3: ${exposure_after} == 0 and ${open_audits_after} == 1 and ${posture_after} == RESTRICTED"
            - "OnlineService.${svc_id}.audit_decision_count == 1 (unchanged: the forced re-audit is not a decision)"
            - "${err_open_audits} == ERR_OPEN_AUDITS_PRESENT with HTTP 409"
            - "OnlineService.${svc_id}.posture_override == null and OnlineService.${svc_id}.compliance_posture == RESTRICTED after the refused override"
            - "OnlineService.${svc_id}.determination_variant_applied == DESIGN_FIRST"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: consent_state_gate_p70_beats_minimization_p110
        grounds:
          - validations[priority=70]
          - validations[priority=110]
          - validations[priority=120]
          - errors[ERR_CONSENT_NOT_GRANTED]
          - errors[ERR_ELEMENT_NOT_REASONABLY_NECESSARY]
          - entities.ActivityDefinition.fields.participation_required_elements
        distinguishing_aspect: |
          One collection call violates BOTH the state gate at priority 70 (the consent is still
          PENDING_VERIFICATION) and the data-minimization constraint at priority 110 (FULL_NAME is
          not in the activity's participation_required_elements); the response must be
          ERR_CONSENT_NOT_GRANTED / 409 (category state) and never ERR_ELEMENT_NOT_REASONABLY_NECESSARY
          / 422 (category business_constraint). Granting the consent then isolates the lower-priority
          rule, which fires on the identical payload.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (design_score 0.60) with an ACTIVE neutral age screen."
            - "Activity NICKNAME_SETUP whitelists SCREEN_NAME ONLY."
            - "Retention schedules exist for BOTH (SCREEN_NAME, PARTICIPATION_CORE) and (FULL_NAME, PARTICIPATION_CORE), so priority 120 never fires."
            - "Notice published with all 7 content keys; consent advanced only to PENDING_VERIFICATION (notice_delivered_at is set, so priority 90 never fires)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Nickname Nook", operator_organization: "Nook Play Ltd", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "AGE_RANGE_SELECT", retry_allowed_on_fail: false, outcome_session_persisted: true }
              as: PrivacyEngineer
              captures: { screen_id: $.data.id }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /activities"
              payload: { service_id: "${svc_id}", activity_code: "NICKNAME_SETUP", participation_required_elements: ["SCREEN_NAME"] }
              as: ComplianceOfficer
              captures: { act_id: $.data.id }
            - call: "POST /retention-schedules"
