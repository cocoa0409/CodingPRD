            - "trigger response HTTP status == 409"

      - name: add_stop_route_volume_exceeded
        claim_type: Aggregate validation
        grounds: ["validations[priority=12]", "errors[ERR_ROUTE_VOLUME_EXCEEDED]"]
        distinguishing_aspect: "With max_daily_volume_cuft==50, adding a stop for an order of volume 60 (0+60 > 50) returns ERR_ROUTE_VOLUME_EXCEEDED (409)."
        test_recipe:
          setup: ["Team max_daily_volume_cuft 50; an empty route; a SCHEDULED order volume 60."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 5000, max_daily_volume_cuft: 50 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Big", weight_lbs: 100, volume_cuft: 60, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_ROUTE_VOLUME_EXCEEDED'"
            - "trigger response HTTP status == 409"

      - name: reserve_window_team_not_found
        claim_type: Violation to Error
        grounds: ["validations[priority=4]", "errors[ERR_TEAM_NOT_FOUND]"]
        distinguishing_aspect: "Reserving a window with an unknown team_id returns ERR_TEAM_NOT_FOUND (404)."
        test_recipe:
          setup: ["A CA customer with a CREATED order; no such team id."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "00000000-0000-4000-8000-000000000000", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_TEAM_NOT_FOUND'"
            - "trigger response HTTP status == 404"

