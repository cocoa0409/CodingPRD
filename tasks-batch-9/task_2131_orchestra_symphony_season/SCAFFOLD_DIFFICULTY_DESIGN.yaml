              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/guest-contracts"
              payload: { concert_id: "${c1}", artist_name: "Mira Halvorsen", role_type: "SOLOIST", offered_fee_cents: 800000 }
              as: ArtisticAdmin
              captures: { gc1: "$.data.id" }
          trigger:
