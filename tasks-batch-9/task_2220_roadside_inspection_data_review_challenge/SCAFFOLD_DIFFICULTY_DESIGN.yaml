  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_filing_window_on_withdrawn_challenge_submit
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - state_machines.DataChallenge.DRAFT_to_WITHDRAWN
        distinguishing_aspect: |
          Both the invalid-state rule (priority 8) and the filing-window rule (priority 12) are
          violated by the same submit - the challenge is WITHDRAWN and the report is 762 days old -
          and the response is exactly ERR_INVALID_CHALLENGE_STATE with HTTP 409, never
          ERR_CHALLENGE_FILING_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Carrier c1 (MEDIUM), UNSAFE_DRIVING code weight 5, UNSAFE_DRIVING/MEDIUM threshold 0.5 / 1.0 / 2.0."
            - "One SCORED report dated 2026-07-01 with one violation, created while the clock was at 2026-08-01T00:00:00Z."
            - "A VIOLATION_NOT_SUPPORTED challenge with one evidence row that was withdrawn straight from DRAFT (status WITHDRAWN, challenge_quota_used 0)."
            - "The clock is then advanced to 2028-08-01T00:00:00Z, i.e. 762 whole days after inspection_start, closing the 730-day filing window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
