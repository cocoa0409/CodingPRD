              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p}", model: "LEASE", term_years: 20, lease_monthly_cents: 8500 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { fp: $.data.id }
            - call: "POST /solar/financing-plans/${fp}/activate"
              payload: { expected_project_version: "${p_v}" }
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/projects/${p}/submit-permit"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/approve-permit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /solar/projects/${p}/complete-install"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/interconnection-applications"
              payload: { project_id: "${p}", utility_id: "${u}", requested_export_kw: 7.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { ia: $.data.id }
            - call: "POST /solar/interconnection-applications/${ia}/begin-review"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/interconnection-applications/${ia}/approve"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/projects/${p}/inspect"
              payload: { result: "PASS" }
              as: PlatformAdmin
            - call: "POST /solar/interconnection-applications/${ia}/grant-pto"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/net-meter-periods"
              payload: { project_id: "${p}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-02-01T00:00:00.000Z", kwh_produced: 900, kwh_consumed: 600 }
              as: Utility
              as_user_id: "${u}"
              captures: { nmA: $.data.id }
            - call: "POST /solar/net-meter-periods/${nmA}/settle"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/net-meter-periods"
              payload: { project_id: "${p}", period_start: "2026-02-01T00:00:00.000Z", period_end: "2026-03-01T00:00:00.000Z", kwh_produced: 400, kwh_consumed: 1000 }
              as: Utility
              as_user_id: "${u}"
              captures: { nmB: $.data.id }
          trigger:
            - call: "POST /solar/net-meter-periods/${nmB}/settle"
              payload: {}
              as: Utility
              as_user_id: "${u}"
          assert:
            - "NetMeterPeriod.${nmA}.bank_kwh_after == 300"
            - "NetMeterPeriod.${nmB}.net_kwh == -600"
            - "NetMeterPeriod.${nmB}.bank_kwh_after == 0"
            - "NetMeterPeriod.${nmB}.bill_credit_cents == -4500"
