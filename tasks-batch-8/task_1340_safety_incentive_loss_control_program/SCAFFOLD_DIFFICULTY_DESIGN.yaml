              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Hazard one", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h1: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L2", description: "Hazard two", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h2: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L3", description: "Hazard three", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h3: $.data.id } }
            - { call: "POST /safety/hazards/${h1}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h2}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h3}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h1}/controls", payload: { description: "Fix one", implementer_id: "${a_id}", due_date: "2026-06-10T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h2}/controls", payload: { description: "Fix two", implementer_id: "${a_id}", due_date: "2026-06-10T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h3}/controls", payload: { description: "Fix three", implementer_id: "${a_id}", due_date: "2026-06-10T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/contractor-orgs", payload: { name: "Acme Erectors", contact_email: "safety@acme.example", emr: 0.50, trir: 0.0, safety_audit_pct: 80, insurance_cert_expires_on: "2026-12-15" }, as: EHSAdmin, captures: { co_id: $.data.id } }
            - { call: "POST /safety/contractor-orgs/${co_id}/submit", payload: {}, as: ContractorRep, as_user_id: "${co_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "POST /safety/programs/${p_id}/sweep", payload: {}, as: EHSAdmin, captures: { sw_overdue: $.data.overdue_controls, sw_posture: $.data.posture } }
            - { call: "GET /safety/programs/${p_id}", payload: {}, as: EHSAdmin, captures: { p_overdue: $.data.overdue_control_count, p_posture: $.data.posture } }
