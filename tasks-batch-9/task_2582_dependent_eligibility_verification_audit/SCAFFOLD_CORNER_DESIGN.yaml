  - section: rbac
    instances:
      - name: corner_missing_or_unknown_role_header_is_unauthenticated_before_anything_else
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "Priority 1 runs before every other rule: a call with no X-User-Role, a call whose role is not one of the five declared roles and a call with no X-User-ID all return 401 ERR_UNAUTHENTICATED even though the target endpoint and body are otherwise valid."
        test_recipe:
          setup:
            - "The database is empty; no request state is required to reach the authentication gate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /audit-programs"
              payload: { limit: 10, offset: 0 }
              as: NONE
              captures: { err_no_role: "$.data.error_id" }
            - call: "GET /audit-programs"
              payload: { limit: 10, offset: 0 }
              as: BenefitsIntern
              captures: { err_unknown_role: "$.data.error_id" }
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              as_user_id: "(omitted)"
              captures: { err_no_user_id: "$.data.error_id" }
          assert:
            - "First call (X-User-Role header omitted): HTTP status == 401 and response data.error_id == ERR_UNAUTHENTICATED"
            - "Second call (X-User-Role: BenefitsIntern, not a declared role): HTTP status == 401 and response data.error_id == ERR_UNAUTHENTICATED"
            - "Third call (X-User-ID header omitted): HTTP status == 401 and response data.error_id == ERR_UNAUTHENTICATED and no Employee row is created"

