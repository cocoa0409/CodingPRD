            - "HTTP status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"
            - "Institution.${inst_id}.total_application_count == 0"

      - name: system_admin_cannot_create_edit_runs
        claim_type: Role Denial
        grounds:
          - roles.SystemAdmin
          - roles.ComplianceAnalyst
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "SystemAdmin is an operational role with no register authority, so it gets 403 ERR_FORBIDDEN_ROLE on POST /hmda/edit-runs even though it may create Institutions and drive the clock."
        test_recipe:
          setup: ["One Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"
            - "GET /hmda/institutions/${inst_id}/edit-runs returns 0 rows"

      - name: institution_admin_patches_its_own_institution_successfully
        claim_type: Role Permission
        grounds:
          - roles.InstitutionAdmin
          - endpoints[PATCH /hmda/institutions/{id}]
          - calculations.filing_profile_resolution
        distinguishing_aspect: "With X-User-ID equal to the Institution id, the PATCH succeeds, stores the new name, re-derives the filing profile and increments version to 2."
        test_recipe:
          setup: ["One Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "PATCH /hmda/institutions/${inst_id}"
              payload: { name: "First Meridian Bank NA", asset_size_usd_cents: 260000000000 }
              as: InstitutionAdmin
              as_user_id: "${inst_id}"
              captures: { new_v: $.data.version }
          assert:
            - "HTTP status == 200"
            - "Institution.${inst_id}.name == First Meridian Bank NA"
            - "Institution.${inst_id}.asset_size_usd_cents == 260000000000"
            - "Institution.${inst_id}.partial_exemption_eligible == false"
            - "Institution.${inst_id}.required_field_count == 48"
            - "Institution.${inst_id}.version == 2"

      - name: examiner_review_is_exclusive
        claim_type: Role Permission
        grounds: ["roles.Examiner"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / submission_filed_rejected_resubmitted_and_refiled_cycle
          rationale: "The Examiner's exclusive REJECT review is executed inside that §1.8 chain."

  - section: cross_cutting_layers
    instances:
      - name: stale_expected_institution_version_on_submission_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[submission-create-stale-institution]
          - errors[ERR_STALE_INSTITUTION_VERSION]
          - validations[priority=70]
        distinguishing_aspect: "The officer reads the Institution, an Application is then created (which bumps Institution.version), and the create carrying the older observed version returns 412 ERR_STALE_INSTITUTION_VERSION with no FilingSubmission written; re-reading and retrying succeeds."
        test_recipe:
          setup:
            - "One Institution; its version is observed once, then advanced by creating an Application."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "GET /hmda/institutions/${inst_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { inst_v_old: $.data.version }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000771", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /hmda/submissions"
              payload: { institution_id: "${inst_id}", expected_institution_version: "${inst_v_old}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { err: $.data.error_id }
            - call: "GET /hmda/institutions/${inst_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { inst_v_new: $.data.version }
            - call: "POST /hmda/submissions"
              payload: { institution_id: "${inst_id}", expected_institution_version: "${inst_v_new}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { sub_id: $.data.id }
          assert:
            - "first trigger call: HTTP status == 412 and response.data.error_id == ERR_STALE_INSTITUTION_VERSION"
            - "third trigger call: HTTP status == 201"
            - "FilingSubmission.${sub_id}.status == DRAFT"
            - "FilingSubmission.${sub_id}.provisional_record_count == 0"
            - "GET /hmda/institutions/${inst_id}/submissions returns exactly 1 row"

      - name: stale_expected_application_version_on_geocode_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[geocode-create-stale-application]
          - errors[ERR_STALE_APPLICATION_VERSION]
        distinguishing_aspect: "After the first GeocodeAssignment bumps Application.version, a second create still carrying the pre-create version is rejected with 412 ERR_STALE_APPLICATION_VERSION and the first assignment keeps is_current true."
        test_recipe:
          setup: ["One Institution, one CensusTract, one Application whose version is captured at creation."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000781", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { app_id: $.data.id, app_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
              captures: { geo1_id: $.data.id }
          trigger:
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", street_address: "2 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_APPLICATION_VERSION"
            - "GeocodeAssignment.${geo1_id}.is_current == true"
            - "GET /hmda/applications/${app_id}/geocode-assignments returns exactly 1 row"

      - name: fresh_expected_application_version_supersedes_previous_assignment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[geocode-create-stale-application]
          - entities.GeocodeAssignment.fields.is_current
        distinguishing_aspect: "Re-reading the Application and re-geocoding with the current version succeeds, flips the first assignment's is_current to false and leaves exactly one current assignment on the record."
        test_recipe:
          setup: ["One Institution, one CensusTract, one Application already carrying one MATCHED GeocodeAssignment."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000791", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { app_id: $.data.id, app_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
              captures: { geo1_id: $.data.id }
            - call: "GET /hmda/applications/${app_id}"
              payload: {}
              as: LoanOfficer
              captures: { app_v2: $.data.version }
          trigger:
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v2}", street_address: "2 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
              captures: { geo2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "GeocodeAssignment.${geo1_id}.is_current == false"
            - "GeocodeAssignment.${geo2_id}.is_current == true"
            - "GeocodeAssignment.${geo2_id}.status == MATCHED"
            - "GET /hmda/applications/${app_id}/geocode-assignments returns exactly 2 rows"
            - "Application.${app_id}.version == 3"

      - name: institution_counters_reconcile_after_patch_makes_record_excluded
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Institution.fields.excluded_record_count
          - calculations.application_completeness
          - endpoints[PATCH /hmda/applications/{id}]
        distinguishing_aspect: "PATCHing loan_purpose to OTHER_PURPOSE on a business-purpose record moves it from PENDING_FIELDS to EXCLUDED and reconciles the Institution counters in the same request: pending 1 -> 0, excluded 0 -> 1, total unchanged at 1."
        test_recipe:
          setup: ["One Institution and one business-purpose Application created with loan_purpose HOME_PURCHASE, so it starts PENDING_FIELDS rather than EXCLUDED."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000801", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "INVESTMENT", lien_status: "FIRST_LIEN", loan_amount_cents: 90000000, business_or_commercial_purpose: true }
              as: LoanOfficer
              captures: { app_id: $.data.id }
          trigger:
            - call: "PATCH /hmda/applications/${app_id}"
              payload: { loan_purpose: "OTHER_PURPOSE" }
              as: LoanOfficer
              captures: { new_status: $.data.lar_status }
          assert:
            - "HTTP status == 200"
            - "Application.${app_id}.lar_status == EXCLUDED"
            - "Application.${app_id}.exclusion_reason == BUSINESS_PURPOSE"
            - "Institution.${inst_id}.pending_record_count == 0"
            - "Institution.${inst_id}.excluded_record_count == 1"
            - "Institution.${inst_id}.reportable_record_count == 0"
            - "Institution.${inst_id}.total_application_count == 1"

  - section: consistency_model
    instances:
      - name: filing_cascade_is_visible_inside_the_same_response
        claim_type: immediate
        grounds:
          - state_machines.FilingSubmission.CERTIFIED_to_FILED
          - entities.Institution.fields.filing_posture
        excluded_because:
          difficulty_instance: transitive_cascade / filing_drives_three_hop_archive_and_year_close
          rationale: "That §1.8 instance asserts filed_at, is_late, the archived record, the recomputed open_register_count and both DisclosureStatement rows immediately after the single file call, which is exactly the immediate-consistency claim."

      - name: verify_bubble_up_is_visible_immediately_on_the_edit_run
        claim_type: immediate
        grounds:
          - state_machines.EditRun.COMPLETED_to_CLEARED_ALL
        excluded_because:
          difficulty_instance: combinatorial_formula / verification_quota_pinned_to_pre_verification_snapshot
          rationale: "That §1.8 instance asserts the run's cleared_record_count and CLEARED_ALL status straight after the single verify call."
