              payload: { expected_referral_version: "${r1_v}", scheduled_start: "2026-08-01T10:00:00Z", scheduled_end: "2026-08-01T11:00:00Z" }
              as: ReferralCoordinator
              captures: { a1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I11", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r2: $.data.id }
            - call: "POST /referrals/${r2}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${r2}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { r2_v: $.data.version }
            - call: "POST /referrals/${r2}/appointments"
              payload: { expected_referral_version: "${r2_v}", scheduled_start: "2026-08-01T12:00:00Z", scheduled_end: "2026-08-01T13:00:00Z" }
              as: ReferralCoordinator
              captures: { a2: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I20", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r3: $.data.id }
            - call: "POST /referrals/${r3}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${r3}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { r3_v: $.data.version }
            - call: "POST /referrals/${r3}/appointments"
              payload: { expected_referral_version: "${r3_v}", scheduled_start: "2026-08-01T14:00:00Z", scheduled_end: "2026-08-01T15:00:00Z" }
              as: ReferralCoordinator
              captures: { a3: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I25", urgency: "ROUTINE" }
