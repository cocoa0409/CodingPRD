# §1.9 Scaffold Corner Design — breadth coverage of §1.1–§1.7 claims not covered by §1.8
scaffold_corner_design:
  - section: entities
    instances:
      - name: e_aircraft_duplicate_n_number_rejected
        claim_type: type_constraints
        grounds: [entities.Aircraft.fields.n_number, "validations[priority=12]"]
        distinguishing_aspect: "Second aircraft with the same n_number is rejected ERR_DUPLICATE_N_NUMBER (409); first aircraft unaffected."
        test_recipe:
          setup: ["one aircraft N111AA exists"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N111AA", serial_number: "S-1", make_model: "Cessna 172", year: 2001 }, as: EscrowOfficer, captures: { ac: $.data.id } }
          trigger:
            - { call: "POST /api/aircraft", payload: { n_number: "N111AA", serial_number: "S-2", make_model: "Piper PA-28", year: 2002 }, as: EscrowOfficer, captures: { err: $.data.error_id } }
          assert:
            - "second create rejected with ERR_DUPLICATE_N_NUMBER"
            - "Aircraft.${ac} still readable via GET /api/aircraft/${ac}"
      - name: e_file_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.EscrowFile.fields.purchase_price_cents, "validations[priority=4]"]
        distinguishing_aspect: "Omitting required purchase_price_cents yields ERR_INVALID_REQUEST (400) before any state or business check."
        test_recipe:
          setup: ["aircraft, buyer, seller"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N112BB", serial_number: "S-3", make_model: "Cirrus SR22", year: 2010 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_INVALID_REQUEST (missing purchase_price_cents); no EscrowFile persisted"
      - name: e_create_defaults_applied
        claim_type: defaults
        grounds: [entities.Aircraft.fields.is_international_registry, entities.Party.fields.is_citizenship_verified, entities.EscrowFile.fields.requires_trust]
        distinguishing_aspect: "Omitting defaulted inputs yields server defaults: is_international_registry=false, is_citizenship_verified=false, requires_trust=false."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N113CC", serial_number: "S-4", make_model: "Piper M350", year: 2018 }, as: EscrowOfficer, captures: { ac: $.data.id, ac_ir: $.data.is_international_registry } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id, b_cv: $.data.is_citizenship_verified } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id, f_rt: $.data.requires_trust } }
          trigger: []
          assert:
            - "Aircraft.is_international_registry == false (default applied)"
            - "Party.is_citizenship_verified == false (default applied)"
            - "EscrowFile.requires_trust == false (default applied) and posture == READY"
      - name: e_create_with_computed_field_returns_invalid_request
        claim_type: computed_fields
        grounds: [entities.EscrowFile.fields.escrow_fee_cents, "validations[priority=4]"]
        distinguishing_aspect: "Client-supplied escrow_fee_cents (a computed field, not in endpoint input) is an unknown field and rejected ERR_INVALID_REQUEST; the server never accepts client overrides of computed money."
        test_recipe:
          setup: ["aircraft, buyer, seller"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N114DD", serial_number: "S-5", make_model: "TBM 850", year: 2009 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30", escrow_fee_cents: 1 }, as: EscrowOfficer, captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_INVALID_REQUEST (unknown field escrow_fee_cents)"
      - name: e_get_aircraft_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Aircraft, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404), not a 500 or null payload."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/aircraft/00000000-0000-4000-8000-0000000000ff", payload: {}, as: EscrowOfficer, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_NOT_FOUND with http 404"
      - name: e_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.EscrowFile]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more correctly across pages under mutation-free reads."
        test_recipe:
          setup: ["three escrow files on three distinct aircraft sharing one buyer/seller pair"]
          setup_api_calls:
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/aircraft", payload: { n_number: "N115E1", serial_number: "S-6", make_model: "Piper PA-46", year: 2007 }, as: EscrowOfficer, captures: { a1: $.data.id } }
            - { call: "POST /api/aircraft", payload: { n_number: "N115E2", serial_number: "S-7", make_model: "Piper PA-46", year: 2008 }, as: EscrowOfficer, captures: { a2: $.data.id } }
            - { call: "POST /api/aircraft", payload: { n_number: "N115E3", serial_number: "S-8", make_model: "Piper PA-46", year: 2009 }, as: EscrowOfficer, captures: { a3: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${a1}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${a2}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${a3}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer }
          trigger:
            - { call: "GET /api/escrow-files", payload: { limit: 2, offset: 0 }, as: Auditor, captures: { p1_first: "$.data[0].id" } }
            - { call: "GET /api/escrow-files", payload: { limit: 2, offset: 2 }, as: Auditor, captures: { p2_first: "$.data[0].id" } }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false; the two pages have disjoint ids"

  - section: state_machines
    instances:
      - name: s_initial_state_opened_ready
        claim_type: initial_state
        grounds: [state_machines.EscrowFile, entities.EscrowFile.fields.posture]
        distinguishing_aspect: "A freshly created EscrowFile starts in OPENED with posture READY (no liens, no trust requirement) and hold_return_state null."
        test_recipe:
          setup: ["aircraft, buyer, seller"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N120SM", serial_number: "S-9", make_model: "Cessna 208", year: 2012 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id, st: $.data.status, po: $.data.posture } }
          trigger: []
          assert:
            - "EscrowFile.${f}.status == OPENED, posture == READY, version == 1"
      - name: s_resume_without_hold_returns_invalid_transition
        claim_type: invalid_transition
        grounds: [state_machines.EscrowFile, "validations[priority=8]"]
        distinguishing_aspect: "Resume is only defined from ON_HOLD; calling it on an OPENED file fails ERR_INVALID_TRANSITION with no state change."
        test_recipe:
          setup: ["one OPENED file"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N121RH", serial_number: "S-10", make_model: "Cirrus SF50", year: 2019 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
          trigger:
            - { call: "POST /api/escrow-files/${f}/resume", payload: {}, as: EscrowOfficer, captures: { err: $.data.error_id } }
          assert:
            - "rejected ERR_INVALID_TRANSITION; file remains OPENED"
      - name: s_cancel_twice_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EscrowFile, "validations[priority=7]", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel returns ERR_ALREADY_TERMINAL (409) — terminal lockdown, distinct from generic invalid-transition."
        test_recipe:
          setup: ["one OPENED file, then cancelled once"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N122TL", serial_number: "S-11", make_model: "Cessna 182", year: 2003 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/cancel", payload: {}, as: EscrowOfficer }
          trigger:
            - { call: "POST /api/escrow-files/${f}/cancel", payload: {}, as: EscrowOfficer, captures: { err: $.data.error_id } }
          assert:
            - "second cancel rejected ERR_ALREADY_TERMINAL; file remains CANCELLED"
      - name: s_hold_resume_roundtrip
        claim_type: side_effect_execution
        grounds: [state_machines.EscrowFile, entities.EscrowFile.fields.hold_return_state]
        distinguishing_aspect: "hold stores hold_return_state; resume restores exactly that state and clears the stored value (roundtrip from OPENED)."
        test_recipe:
          setup: ["one OPENED file"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N123HR", serial_number: "S-12", make_model: "King Air 250", year: 2014 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
          trigger:
            - { call: "POST /api/escrow-files/${f}/hold", payload: {}, as: EscrowOfficer, captures: { st_h: $.data.status, hrs: $.data.hold_return_state } }
            - { call: "POST /api/escrow-files/${f}/resume", payload: {}, as: EscrowOfficer, captures: { st_r: $.data.status } }
          assert:
            - "after hold: status == ON_HOLD and hold_return_state == OPENED"
            - "after resume: status == OPENED and hold_return_state == null"
      - name: s_lien_dispute_cycle
        claim_type: valid_transition
        grounds: [state_machines.Lien.DISCOVERED_to_DISPUTED, state_machines.Lien.DISPUTED_to_DISCOVERED]
        distinguishing_aspect: "Lien supports the DISCOVERED -> DISPUTED -> DISCOVERED revert loop without touching amounts; posture recomputes but stays LIEN_BLOCKED in both states."
        test_recipe:
          setup: ["file with one DISCOVERED lien"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N124DC", serial_number: "S-13", make_model: "Cessna 210", year: 1981 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "LENDER", legal_name: "Lender Co" }, as: EscrowOfficer, captures: { ln: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 5000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [ { lienor_party_id: "${ln}", lienor_name: "Lender Co", amount_cents: 300000, lien_type: "JUDGMENT", filed_at: "2024-11-01" } ] }, as: EscrowOfficer }
            - { call: "GET /api/liens", payload: { escrow_file_id: "${f}" }, as: EscrowOfficer, captures: { l1: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/liens/${l1}/dispute", payload: { reason: "amount contested" }, as: EscrowOfficer, captures: { st1: $.data.status } }
            - { call: "POST /api/liens/${l1}/resolve-dispute", payload: {}, as: EscrowOfficer, captures: { st2: $.data.status } }
          assert:
            - "after dispute: status == DISPUTED; after resolve-dispute: status == DISCOVERED (cycle)"
            - "original_amount_cents unchanged 300000 throughout"
      - name: s_search_refresh_cycle
        claim_type: valid_transition
        grounds: [state_machines.TitleSearch.COMPLETED_to_STALE, state_machines.TitleSearch.STALE_to_ACTIVE]
        distinguishing_aspect: "Clock sweep flips COMPLETED -> STALE past 30 days; refresh returns the SAME search row to ACTIVE with effective_at reset to the current logical clock (no new row created)."
        test_recipe:
          setup: ["file with one search completed at clock 2026-06-01T00:00:00Z; clock advanced to 2026-07-02"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N125SR", serial_number: "S-14", make_model: "Piper Seneca", year: 2000 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 5000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-02T00:00:00Z" }, as: EscrowManager }
          trigger:
            - { call: "GET /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { st_stale: "$.data[0].status" } }
            - { call: "POST /api/title-searches/${ts}/refresh", payload: {}, as: EscrowOfficer, captures: { st_ref: $.data.status, eff: $.data.effective_at } }
          assert:
            - "after clock sweep: search status == STALE"
            - "after refresh: status == ACTIVE, effective_at == 2026-07-02T00:00:00Z, same search id (STALE -> ACTIVE cycle)"
      - name: s_funded_revert_on_return
        claim_type: side_effect_execution
        grounds: [state_machines.EscrowFile.FUNDED_to_CLEARED, state_machines.Deposit.RECEIVED_to_RETURNED]
        distinguishing_aspect: "Returning a deposit that drops total_funded below due reverts the file FUNDED -> CLEARED (branching-with-revert on EscrowFile), driven by the deposit mutation, not a direct file call."
        test_recipe:
          setup: ["CLEARED file with due 10150000"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N126FR", serial_number: "S-15", make_model: "Cessna 340", year: 1979 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 10000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /api/escrow-files/${f}/deposits", payload: { payer_party_id: "${b}", amount_cents: 10150000, purpose: "BUYER_FUNDS", expected_escrow_file_version: "${v1}" }, as: EscrowOfficer, captures: { dep: $.data.id } }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { st_funded: $.data.status } }
            - { call: "POST /api/deposits/${dep}/return", payload: {}, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { st_back: $.data.status, fund_back: $.data.total_funded_cents } }
          assert:
            - "after full deposit: status == FUNDED"
            - "after return: status == CLEARED (revert) and total_funded_cents == 0"
      - name: s_record_twice_returns_invalid_transition
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LienRelease, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "RECORDED is terminal for LienRelease: a second record call fails ERR_INVALID_TRANSITION; the frozen payoff does not change."
        test_recipe:
          setup: ["lien with release fully recorded at clock 2026-06-05 (FLAT 500000)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N127RT", serial_number: "S-16", make_model: "Baron 58", year: 2006 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "LENDER", legal_name: "Lender Co" }, as: EscrowOfficer, captures: { ln: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 5000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "POST /api/escrow-files/${f}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
