      - name: corner_entity_parent_relationships_submeter_must_hang_off_a_master_on_the_same_account
        claim_type: parent_relationships
        grounds:
          - validations[ERR_SUBMETER_PARENT_INVALID]
          - entities.Meter.fields.parent_meter_id
          - endpoints[POST /meters]
        distinguishing_aspect: |
          The parent rule is bidirectional and account-scoped: an IRRIGATION_SUBMETER with a null
          parent is refused, a submeter pointing at a master on a DIFFERENT account is refused, a
          POTABLE_MASTER that supplies a parent is refused, and only a submeter pointing at a
          master on its OWN account is created. All four land as 422
          ERR_SUBMETER_PARENT_INVALID or 201, never as a generic 400.
        test_recipe:
          setup:
            - "RS-STD-2026 exists with two accounts: ACC-2009 holding master MTR-I-1 and ACC-2010 holding master MTR-J-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
