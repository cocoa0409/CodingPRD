          Metric = scheduled minutes, endpoint = POST /v1/visits: the effective
          cap is min(facility 60, agreement 90, program 120) = 60; a 60-minute
          visit (duration == cap) must succeed while a 61-minute visit must
          fail — falsifying any off-by-one (< vs <=) reading.
