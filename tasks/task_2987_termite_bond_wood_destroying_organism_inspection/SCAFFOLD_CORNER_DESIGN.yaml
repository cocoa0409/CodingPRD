  - section: validations
    instances:
      - name: shape_check_outranks_body_reference_resolution
        claim_type: priority_ordering
        grounds:
          - validations[priority=50]
          - validations[priority=60]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: >-
          One request violates both rules at once: an unknown method enum AND a property_id that
          resolves to nothing. Priority 50 must win with 400 ERR_INVALID_REQUEST — the server never
          reaches the database — and only once the enum is corrected does the same request surface
          404 ERR_PROPERTY_NOT_FOUND.
        test_recipe:
          setup:
            - "A registered inspector pair and one FL property; no plan yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insa: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
          trigger:
            - call: "POST /treatment-plans"
              payload: { property_id: "no-such-property-0001", inspection_id: "${ins1}", applicator_id: "${insa}", method: "TENTING", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { e1: $.data.error_id }
            - call: "POST /treatment-plans"
              payload: { property_id: "no-such-property-0001", inspection_id: "${ins1}", applicator_id: "${insa}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { e2: $.data.error_id }
            - call: "GET /treatment-plans"
              payload: { property_id: "${p1}", limit: 10, offset: 0 }
              as: BranchManager
          assert:
            - "the first call returns 400 ERR_INVALID_REQUEST — the invalid enum member is reported even though the property lookup would also have failed"
            - "the second call, identical but for a declared method, returns 404 ERR_PROPERTY_NOT_FOUND"
            - "neither call persists a TreatmentPlan: the list for P1 returns total_count 0"
            - "the 400 response body carries error_id, message and error_id-specific fields only, with no data payload leaking a partially built plan"
            - "an unknown extra field in the same body would be IGNORED rather than reported, so ERR_INVALID_REQUEST is not a catch-all for unrecognised keys"

      - name: body_reference_resolution_outranks_the_occ_version_guard
        claim_type: priority_ordering
