  # =========================================================================
  # RULE 8 — resource temporal-overlap conflicts, different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: edition_aggregate_capacity_overflow
        grounds:
          - calculations.insertion_schedule
          - entities.Newspaper.fields.edition_line_capacity
          - validations[priority=8]
          - errors[ERR_EDITION_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics = AGGREGATE LINE CAPACITY on the NEWSPAPER edition resource: a second
          notice's insertion on the SAME (newspaper, 2026-03-01) edition overflows because
          occupied(3) + line_count(3) = 6 > edition_line_capacity(5). Rejection is by summed
          occupancy, not by point/gap geometry.
        test_recipe:
          setup:
            - "Qualified newspaper with edition_line_capacity=5"
            - "BID requirement min_insertions=1, min_days_before_deadline=10"
            - "Notice X (BID, line_count 3) SCHEDULED on 2026-03-01, occupying 3 of 5 lines"
            - "Notice Y (BID, line_count 3, deadline 2026-04-01 so temporal passes) PROOF_APPROVED"
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 5, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "BID", county: "SPRINGFIELD", min_insertions: 1, min_days_before_deadline: 10 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "BID", county: "SPRINGFIELD", title: "Bid X", body_text: "NOTICE OF FORECLOSURE SALE. The property secured by the deed of trust will be sold at auction today.", deadline_date: "2026-04-01" }
