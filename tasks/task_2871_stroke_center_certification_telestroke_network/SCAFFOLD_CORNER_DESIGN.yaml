      - ${ci_lkw} == 78 — floor(4725 / 60); rounding would print 79
      - '${ci_lat} == 140 with ${ci_req} == 2026-09-01T08:25:00Z and ${ci_acc} == 2026-09-01T08:27:20Z: seconds, NOT floored to 2 minutes'
