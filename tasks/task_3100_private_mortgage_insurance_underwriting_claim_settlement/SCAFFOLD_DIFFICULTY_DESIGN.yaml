            - call: "POST /mortgage-insurance/reinsurance-treaties"
              payload: { treaty_number: "TR-INVAR", inception_utc: "2026-01-01T00:00:00Z", expiration_utc: "2028-01-01T00:00:00Z", retention_per_claim_cents: 1000000, exhaustion_per_claim_cents: 6000000, aggregate_ceded_cap_cents: 5000000 }
              as: MasterPolicyAdmin
              captures: { treaty_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
