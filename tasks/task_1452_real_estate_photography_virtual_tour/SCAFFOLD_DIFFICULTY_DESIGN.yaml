  # ===========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers; depths >=3 and >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: weather_reschedule_cascade_depth4_authorization_expiry
        grounds:
          - state_machines.ShootBooking.CONFIRMED_to_ASSIGNED (reschedule)
          - state_machines.AirspaceAuthorization.APPROVED_to_EXPIRED
          - state_machines.AddOn.ACTIVE_to_REFUSED
          - calculations.weather_reschedule_credit
          - entities.ReadinessChecklistItem.fields.checked
        distinguishing_aspect: |
          Depth-4 chain originating from POST /reschedule (kind=WEATHER): (1) booking
          window moves -> (2) APPROVED AirspaceAuthorization whose window no longer
          matches is itself EXPIRED -> (3) the authorization's expiry triggers creation
          of a replacement PENDING authorization with attempt_number=3 (cap) -> (4)
          when the replacement is later REJECTED at the cap, the drone AddOn is
          REFUSED and the booking drops back out of AUTHORIZATION_PENDING into
          CONFIRMED. Each hop is caused by the previous mutation, not by the original
          request directly.
        test_recipe:
          setup:
            - "Market ATX multiplier 12500, turnaround 48h, weather bps 1000"
            - "Drone-certified photographer P; agent A; booking with DRONE_STILLS, scheduled 2026-08-05T14:00:00Z"
