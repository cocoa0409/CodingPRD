          - state_machines.Payment.APPLIED_to_REVERSED
          - calculations.judgment_payoff_replay
          - calculations.settlement_net_recovery
          - entities.Judgment.fields.gross_exposure_cents
          - endpoints[POST /payments/{payment_id}/reverse]
        distinguishing_aspect: |
          Conserved quantity 1 of 2 — MONEY OWED PLUS MONEY COLLECTED, pinned as
          Judgment.principal_balance_cents + accrued_interest_cents + costs_balance_cents +
          collected_to_date_cents. With the clock frozen at 2026-08-01, the pair (POST /payments,
          POST /payments/{id}/reverse) returns it to exactly 5335411, and accrued_interest_cents must return
          to 290411 (the full-replay value), not 254064 (what a naive inverse-delta undo would leave).
        test_recipe:
          setup:
            - "A CA judgment entered 2026-01-01 with 5000000 cents principal, 1000 bps interest and 45000 cents filing costs, no payments, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0901", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { pre_gross: $.data.gross_exposure_cents, pre_p: $.data.principal_balance_cents, pre_i: $.data.accrued_interest_cents, pre_c: $.data.costs_balance_cents }
          trigger:
            - call: "POST /payments"
              payload: { judgment_id: "${jud_id}", amount_cents: 1000000, received_on: "2026-03-02", source: "DEBTOR_DIRECT" }
              as: CaseManager
              captures: { pay_id: $.data.id }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { mid_gross: $.data.gross_exposure_cents, mid_fee: $.data.contingency_fee_cents }
            - call: "POST /payments/${pay_id}/reverse"
              payload: { reason: "NSF returned item" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pay_status: $.data.status }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { post_gross: $.data.gross_exposure_cents, post_p: $.data.principal_balance_cents, post_i: $.data.accrued_interest_cents, post_c: $.data.costs_balance_cents, post_fee: $.data.contingency_fee_cents, post_collected: $.data.collected_to_date_cents }
          assert:
            - "${pre_gross} == 5335411"
            - "${pre_p} == 5000000"
            - "${pre_i} == 290411"
            - "${pre_c} == 45000"
            - "${mid_gross} == 5299064"
            - "${mid_fee} == 330000"
            - "${pay_status} == REVERSED"
            - "${post_gross} == 5335411"
            - "${post_p} == 5000000"
            - "${post_i} == 290411"
            - "${post_i} != 254064"
            - "${post_c} == 45000"
            - "${post_collected} == 0"
            - "${post_fee} == 0"
            - "${pre_gross} == ${post_gross}"

      - name: levy_release_conserves_asset_custody_total
        grounds:
          - state_machines.EnforcementAction.WRIT_REQUESTED_to_SERVED
          - state_machines.EnforcementAction.SERVED_to_RELEASED
          - calculations.bank_levy_hold
          - entities.AssetFinding.fields.swept_cents
          - endpoints[POST /enforcement-actions/{enforcement_action_id}/release]
        distinguishing_aspect: |
          Conserved quantity 2 of 2 and a different KIND of quantity — ASSET CUSTODY UNITS rather than money
          owed, pinned as AssetFinding.available_cents + frozen_cents + swept_cents. The pair (serve, release)
          returns available_cents to exactly 900000 with frozen_cents and swept_cents at 0, while the 12500-cent
          sheriff fee added to Judgment.costs_balance_cents is deliberately NOT reversed, proving the two
          invariants are independent.
        test_recipe:
          setup:
            - "A CA judgment with a RECORDED zero-fee CA county filing (posture LIEN_PERFECTED) and 45000 cents of filing costs."
            - "A VERIFIED BANK_ACCOUNT finding worth 900000 cents, available 900000, frozen 0, swept 0."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0902", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /county-filings"
              payload: { judgment_id: "${jud_id}", county_code: "CA-LOS-ANGELES", state_code: "CA", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 0 }
              as: CaseManager
              captures: { cf_id: $.data.id }
            - call: "POST /county-filings/${cf_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /county-filings/${cf_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "BANK_ACCOUNT", institution_name: "First Pacific Bank", identifier_last4: "8811", estimated_value_cents: 900000, source: "PUBLIC_RECORD" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af_id: $.data.id, av0: $.data.available_cents, fz0: $.data.frozen_cents, sw0: $.data.swept_cents }
            - call: "POST /asset-findings/${af_id}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { jv1: $.data.version }
            - call: "POST /enforcement-actions"
              payload: { judgment_id: "${jud_id}", asset_finding_id: "${af_id}", action_type: "BANK_LEVY", expected_judgment_version: "${jv1}" }
              as: CaseManager
              captures: { ea_id: $.data.id }
            - call: "POST /enforcement-actions/${ea_id}/request-writ"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-1"
          trigger:
            - call: "POST /enforcement-actions/${ea_id}/serve"
              payload: { served_on: "2026-08-01" }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { hold: $.data.levy_hold_cents, fee: $.data.sheriff_fee_cents }
            - call: "GET /asset-findings/${af_id}"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { av1: $.data.available_cents, fz1: $.data.frozen_cents, sw1: $.data.swept_cents }
            - call: "POST /enforcement-actions/${ea_id}/release"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { ea_status: $.data.status, hold_after: $.data.levy_hold_cents }
            - call: "GET /asset-findings/${af_id}"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { av2: $.data.available_cents, fz2: $.data.frozen_cents, sw2: $.data.swept_cents }
          assert:
            - "${av0} == 900000"
            - "${fz0} == 0"
            - "${sw0} == 0"
            - "${hold} == 725000"
            - "${fee} == 12500"
            - "${av1} == 175000"
            - "${fz1} == 725000"
            - "${sw1} == 0"
            - "${ea_status} == RELEASED"
            - "${hold_after} == 0"
            - "${av2} == 900000"
            - "${fz2} == 0"
            - "${sw2} == 0"
            - "Judgment.${jud_id}.costs_balance_cents == 57500"
            - "Judgment.${jud_id}.active_enforcement_count == 0"
            - "Judgment.${jud_id}.enforcement_posture == LIEN_PERFECTED"
