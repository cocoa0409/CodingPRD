            - "Deferral B (TRAVEL, TEMPORARY, effective_from 2026-07-15, deferral_days 1, lookback_days 0, recall_scope NONE) is recorded through the TEMPORARILY_DEFERRED self-loop, which resets active_deferral_until_date to 2026-07-16."
