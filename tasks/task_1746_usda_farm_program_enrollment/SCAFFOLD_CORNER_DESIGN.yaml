scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation / retrieval / required-fields / defaults /
  # computed / not-found / immutability / parent integrity
  # ===========================================================================
  - section: entities
    instances:
      - name: create_farm_success_201_and_fields
        claim_type: creation
        grounds: [entities.Farm, "endpoints[\"POST /fsa/farms\"]"]
        distinguishing_aspect: "POST with all required fields returns 201 and the response carries system-set farm_status=ACTIVE, version=1."
        test_recipe:
          setup: ["empty DB; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
          trigger:
            - { call: "POST /fsa/farms", payload: { farm_number: "F1", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_status: "$.data.farm_status", farm_version: "$.data.version" } }
          assert:
            - "farm_status == ACTIVE"
            - "farm_version == 1"

      - name: get_farm_returns_stored_entity
        claim_type: retrieval
        grounds: [entities.Farm, "endpoints[\"GET /fsa/farms/{farm_id}\"]"]
        distinguishing_aspect: "GET /fsa/farms/{id} returns the entity created earlier with matching farm_number."
        test_recipe:
          setup: ["a farm exists"]
          setup_api_calls:
            - { call: "POST /fsa/farms", payload: { farm_number: "F2", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
          trigger:
            - { call: "GET /fsa/farms/${farm_id}", payload: {}, as: CountySpecialist, captures: { farm_number: "$.data.farm_number" } }
          assert:
            - "farm_number == F2"

      - name: list_farms_paginated
        claim_type: listing
        grounds: ["endpoints[\"GET /fsa/farms\"]"]
        distinguishing_aspect: "GET /fsa/farms returns paginated list honoring limit/offset with total_count and has_more."
        test_recipe:
          setup: ["two farms exist"]
          setup_api_calls:
            - { call: "POST /fsa/farms", payload: { farm_number: "F3", county_code: "019", program_year: 2026 }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F4", county_code: "019", program_year: 2026 }, as: CountySpecialist }
          trigger:
            - { call: "GET /fsa/farms?limit=1&offset=0", payload: {}, as: CountySpecialist }
          assert:
            - "response meta has limit==1, total_count>=2, has_more==true"

      - name: get_nonexistent_farm_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[\"GET /fsa/farms/{farm_id}\"]"]
        distinguishing_aspect: "GET with a random UUID that does not resolve returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fsa/farms/00000000-0000-0000-0000-000000000000", payload: {}, as: CountySpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: create_producer_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Producer]
        distinguishing_aspect: "Omitting required producer_name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fsa/producers", payload: { tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: producer_default_agi_status_not_filed
        claim_type: defaults
        grounds: [entities.Producer.fields.agi_attestation_status]
        distinguishing_aspect: "A newly created Producer defaults agi_attestation_status to NOT_FILED and conservation_status to PENDING."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fsa/producers", payload: { producer_name: "P", tax_id_last4: "1234", entity_type: "LLC" }, as: CountySpecialist, captures: { agi: "$.data.agi_attestation_status", cons: "$.data.conservation_status" } }
          assert:
            - "agi == NOT_FILED"
            - "cons == PENDING"

      - name: farm_total_base_acres_computed_from_tracts
        claim_type: computed_fields
        grounds: [entities.Farm.fields.total_base_acres]
        distinguishing_aspect: "Farm.total_base_acres is computed as the sum of tract base_acres, not client-settable."
        test_recipe:
          setup: ["farm with two tracts 60.00 and 40.00"]
          setup_api_calls:
            - { call: "POST /fsa/farms", payload: { farm_number: "F5", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 60.00, cropland_acres: 60.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T2", base_acres: 40.00, cropland_acres: 40.00 }, as: CountySpecialist }
          trigger:
            - { call: "GET /fsa/farms/${farm_id}", payload: {}, as: CountySpecialist, captures: { total: "$.data.total_base_acres" } }
          assert:
            - "total == 100.00"

      - name: yield_observation_immutable_entity
        claim_type: immutability
        grounds: [entities.YieldObservation]
        distinguishing_aspect: "YieldObservation has common_fields:false (append-only); no PUT/PATCH endpoint exists for it and it carries no version field."
        test_recipe:
          setup: ["a yield record with one observation"]
          setup_api_calls:
            - { call: "POST /fsa/farms", payload: { farm_number: "F6", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
          trigger:
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist, captures: { obs: "$.data" } }
          assert:
            - "YieldObservation response carries id and created_at but no version/updated_at (common_fields:false)"

      - name: child_creation_requires_existing_parent
        claim_type: parent_relationships
        grounds: ["errors[ERR_NOT_FOUND]", entities.Tract.fields.farm_id]
        distinguishing_aspect: "Creating a Tract under a non-existent farm id returns ERR_NOT_FOUND (parent FK integrity)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fsa/farms/00000000-0000-0000-0000-000000000000/tracts", payload: { tract_number: "T1", base_acres: 10.00, cropland_acres: 10.00 }, as: CountySpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial
  # ===========================================================================
  - section: state_machines
    instances:
      - name: certify_draft_acreage_report_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.AcreageReport, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Certify from DRAFT (never filed) is not a defined transition -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["AcreageReport in DRAFT"]
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F7", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "P", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_id}", captures: { ar_id: "$.data.id" } }
          trigger:
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: terminal_enrollment_void_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Enrollment]
        distinguishing_aspect: "A VOID enrollment accepts no further transitions; submit from VOID -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Enrollment VOID"]
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F8", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "P", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/enrollments", payload: { program_year: 2026, commodity: "CORN" }, as: Producer, as_user_id: "${prod_id}", captures: { enr_id: "$.data.id" } }
            - { call: "POST /fsa/enrollments/${enr_id}/void", payload: {}, as: Producer, as_user_id: "${prod_id}" }
          trigger:
            - { call: "POST /fsa/enrollments/${enr_id}/submit", payload: {}, as: Producer, as_user_id: "${prod_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: new_enrollment_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Enrollment]
        distinguishing_aspect: "A freshly created Enrollment starts in DRAFT."
        test_recipe:
          setup: ["farm + producer + membership"]
          setup_api_calls:
            - { call: "POST /fsa/farms", payload: { farm_number: "F9", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "P", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
          trigger:
            - { call: "POST /fsa/farms/${farm_id}/enrollments", payload: { program_year: 2026, commodity: "CORN" }, as: Producer, as_user_id: "${prod_id}", captures: { st: "$.data.enrollment_status" } }
          assert:
            - "st == DRAFT"

      - name: enrollment_certify_pins_election_and_yield
        claim_type: side_effect_execution
        grounds: [state_machines.Enrollment.CED_APPROVED_to_CERTIFIED]
        distinguishing_aspect: "Certification pins pinned_election_id and pinned_yield_record_id and locks both referenced objects (version-pinning on approval)."
        test_recipe:
          setup: ["CED_APPROVED enrollment with an ACTIVE election and CERTIFIED yield record"]
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F10", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "P", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_p: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Q", tax_id_last4: "2222", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_q: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_p}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 100.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/updates", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/yield-records/${yr_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_p}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 100.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_p}", captures: { elec_id: "$.data.id" } }
            - { call: "POST /fsa/producers/${prod_p}/agi-attestations", payload: { adjusted_gross_income: 50000000 }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/producers/${prod_p}/agi-attestations/verify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/producers/${prod_p}/conservation-certifications", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/farms/${farm_id}/enrollments", payload: { program_year: 2026, commodity: "CORN" }, as: Producer, as_user_id: "${prod_p}", captures: { enr_id: "$.data.id" } }
            - { call: "POST /fsa/enrollments/${enr_id}/submit", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/enrollments/${enr_id}/ced-approve", payload: {}, as: CountyExecutiveDirector }
          trigger:
            - { call: "POST /fsa/enrollments/${enr_id}/certify", payload: {}, as: CountyCommittee, as_user_id: "${prod_q}", captures: { pinned_e: "$.data.pinned_election_id", pinned_y: "$.data.pinned_yield_record_id" } }
            - { call: "GET /fsa/program-elections/${elec_id}", payload: {}, as: CountySpecialist, captures: { elec_status: "$.data.election_status" } }
          assert:
            - "pinned_e == ${elec_id}"
            - "pinned_y == ${yr_id}"
            - "elec_status == LOCKED (pinned at certification)"

      - name: disaster_approve_requires_35_percent_threshold
        claim_type: precondition_enforcement
        grounds: ["validations[priority=16]", "errors[ERR_LOSS_THRESHOLD_NOT_MET]"]
        distinguishing_aspect: "Approving with loss below 35% of reported acres is rejected; §1.8 covered the equality-passes case, this covers the failure path."
        test_recipe:
          setup: ["CERTIFIED report 100.00 acres; disaster app UNDER_REVIEW with loss 30.00 (< 35%)"]
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F11", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "P", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_p: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Q", tax_id_last4: "2222", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_q: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_p}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 100.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_p}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 100.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/disaster-applications", payload: { program_year: 2026, disaster_type: "HAIL", loss_acres: 30.00, qualifying_commodity: "CORN", documentation_complete: true }, as: Producer, as_user_id: "${prod_p}", captures: { da_id: "$.data.id" } }
            - { call: "POST /fsa/disaster-applications/${da_id}/file", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/disaster-applications/${da_id}/assign-reviewer", payload: {}, as: CountyExecutiveDirector }
          trigger:
            - { call: "POST /fsa/disaster-applications/${da_id}/approve", payload: {}, as: CountyCommittee, as_user_id: "${prod_q}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_LOSS_THRESHOLD_NOT_MET"

      - name: appeal_filed_transitions_enrollment_on_appeal
        claim_type: valid_transition
        grounds: [state_machines.Enrollment.CERTIFIED_to_ON_APPEAL]
        distinguishing_aspect: "Filing an appeal against a CERTIFIED enrollment moves the enrollment to ON_APPEAL (cross-entity side effect of Appeal creation)."
        test_recipe:
          setup: ["CERTIFIED enrollment"]
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F12", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "P", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_p: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Q", tax_id_last4: "2222", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_q: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_p}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 100.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/updates", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/yield-records/${yr_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_p}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 100.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/producers/${prod_p}/agi-attestations", payload: { adjusted_gross_income: 50000000 }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/producers/${prod_p}/agi-attestations/verify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/producers/${prod_p}/conservation-certifications", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/farms/${farm_id}/enrollments", payload: { program_year: 2026, commodity: "CORN" }, as: Producer, as_user_id: "${prod_p}", captures: { enr_id: "$.data.id" } }
            - { call: "POST /fsa/enrollments/${enr_id}/submit", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/enrollments/${enr_id}/ced-approve", payload: {}, as: CountyExecutiveDirector }
            - { call: "POST /fsa/enrollments/${enr_id}/certify", payload: {}, as: CountyCommittee, as_user_id: "${prod_q}" }
          trigger:
            - { call: "POST /fsa/appeals", payload: { farm_id: "${farm_id}", enrollment_id: "${enr_id}", ground_code: "NEW_EVIDENCE", filed_by_producer_id: "${prod_p}" }, as: Producer, as_user_id: "${prod_p}" }
