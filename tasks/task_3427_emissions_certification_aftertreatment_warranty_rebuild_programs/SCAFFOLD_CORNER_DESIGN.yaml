            - *k_ftp
            - call: "POST /emissions/test-runs/${run_ftp_id}/record-results"
              payload: { measured_nox_g_per_bhp_hr: 0.40, measured_pm_g_per_bhp_hr: 0.008, deterioration_factor: 1.0 }
              as: CertificationEngineer
          trigger:
            - call: "POST /emissions/test-runs/${run_ftp_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegulatoryOfficer
              captures: { acc_err: $.data.error_id }
            - call: "POST /emissions/test-runs/${run_ftp_id}/review"
              payload: { decision: "REJECT" }
              as: RegulatoryOfficer
              captures: { rej_status: $.data.status }
          assert:
            - "review ACCEPT on the FAIL run returns 409 with error_id ERR_TEST_RESULT_NOT_PASS via ${acc_err}"
            - "review REJECT on the same run succeeds: status == REJECTED via ${rej_status}"

