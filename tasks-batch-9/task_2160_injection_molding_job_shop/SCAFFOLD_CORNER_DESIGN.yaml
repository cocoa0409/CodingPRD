      - name: transfer_lifecycle_blocks_job_creation_before_and_after_completion
        claim_type: Violation to Error
        grounds: ["errors[ERR_MOLD_TRANSFER_IN_PROGRESS]", "errors[ERR_MOLD_TRANSFERRED]", "validations[priority=11]", "validations[priority=14]", "entities.Mold.fields.active_transfer_id"]
        distinguishing_aspect: "A REQUESTED transfer sets Mold.active_transfer_id and job creation returns 409 ERR_MOLD_TRANSFER_IN_PROGRESS; once the transfer COMPLETES the mold is TRANSFERRED and the same call returns 409 ERR_MOLD_TRANSFERRED instead."
        test_recipe:
          setup:
            - "Standard approval chain; customer BETA also exists; no ProductionJob is RUNNING."
            - "A ToolTransfer of M-1 to BETA has been requested and is still REQUESTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
