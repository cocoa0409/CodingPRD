            - "after verify: PunchListItem.${item_id}.status == VERIFIED"
            - "second achieve-final: http 200 and CaProject.${p_id}.status == FINAL_COMPLETION_ACHIEVED"

      - name: rfi_clarification_pending_until_drawing_issued
        grounds:
          - state_machines.Rfi.CLARIFICATION_PENDING_to_ANSWERED
          - state_machines.Rfi.OPEN_to_CLARIFICATION_PENDING
          - concurrency_rules[clarification-revision-stale-rfi]
        distinguishing_aspect: |
          Pair (Rfi -> ClarificationDrawing), a third distinct pair: an RFI answered
          with requires_clarification_drawing=true sits in CLARIFICATION_PENDING (no
          answered_at, no late credit) until the first ClarificationDrawing flips it
          to ANSWERED and stamps answered_at from the drawing's clock.
        test_recipe:
          setup:
            - "ACTIVE project (7-day RFI window)."
            - "RFI created at the 2026-08-01 default clock (due 2026-08-08), then answered with requires_clarification_drawing=true at clock 2026-08-05."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj X3", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Confirm beam pocket depth", cost_impact_flag: true }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rfi_id: $.data.id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/rfis/${rfi_id}/answer"
              payload: { answer_text: "See forthcoming sketch", requires_clarification_drawing: true }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "GET /ca/rfis/${rfi_id}"
              as: ArchitectCA
              captures: { rfi_v: $.data.version }
          trigger:
            - call: "POST /ca/clarification-drawings"
              payload: { rfi_id: "${rfi_id}", drawing_ref: "SK-12", expected_rfi_version: "${rfi_v}" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { cd_id: $.data.id }
          assert:
            - "before the drawing: Rfi.${rfi_id}.status == CLARIFICATION_PENDING and Rfi.${rfi_id}.answered_at == null and Rfi.${rfi_id}.credited_delay_days == 0"
            - "ClarificationDrawing.${cd_id}.revision_number == 1 and status == ISSUED"
            - "after the drawing: Rfi.${rfi_id}.status == ANSWERED"
            - "Rfi.${rfi_id}.answered_at == 2026-08-05T09:00:00Z (drawing clock) and credited_delay_days == 0 (on time vs due 2026-08-08)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics + resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: site_visit_same_calendar_day_conflict
        grounds:
          - validations[priority=12]
          - entities.SiteVisit.fields.visit_date
          - state_machines.SiteVisit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Interval semantics = closed calendar-day equality on the SiteVisit
          resource: a second visit on the same visit_date conflicts (409), an
          adjacent date does not, and CANCELLING the occupant releases the date for
          re-use — point-occupation semantics, not range overlap.
        test_recipe:
          setup:
            - "ACTIVE project; visit V1 SCHEDULED for 2026-08-15."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj O1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-15", purpose: "PROGRESS_OBSERVATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-15", purpose: "PROGRESS_OBSERVATION", performed_by_user_id: "user-arch-lead" }
              as: ArchitectCA
              captures: { err_id: $.data.error_id }
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-16", purpose: "PROGRESS_OBSERVATION", performed_by_user_id: "user-arch-lead" }
              as: ArchitectCA
              captures: { v2_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/cancel"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-15", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v3_id: $.data.id }
          assert:
            - "same-day attempt: http 409 and ${err_id} == ERR_VISIT_DATE_CONFLICT"
            - "adjacent-day visit: http 201 (SiteVisit.${v2_id} created)"
            - "after cancelling V1, the 2026-08-15 re-booking succeeds: http 201 (SiteVisit.${v3_id} created)"
            - "SiteVisit.${v1_id}.status == CANCELLED"

      - name: invoice_period_half_open_overlap
        grounds:
          - validations[priority=13]
          - entities.AdditionalServiceInvoice.fields.period_end
        distinguishing_aspect: |
          Interval semantics = half-open range overlap on the AdditionalServiceInvoice
          resource (different resource and different geometry than the visit
          calendar-day point rule): [2026-10-01, 2026-10-31] vs [2026-10-31,
          2026-11-30] share only the endpoint date and are allowed (adjacency), while
          [2026-10-15, 2026-11-15] truly overlaps and is rejected with 409.
        test_recipe:
          setup:
            - "ACTIVE project past its billing horizon (clock 2026-11-05; horizon_start 2026-10-05)."
            - "Invoice I1 exists for period 2026-10-01..2026-10-31 (DRAFT)."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj O2", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-01", period_end: "2026-10-31" }
              as: FirmAdmin
              captures: { inv1_id: $.data.id }
          trigger:
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-31", period_end: "2026-11-30" }
              as: FirmAdmin
              captures: { inv2_id: $.data.id }
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-15", period_end: "2026-11-15" }
              as: FirmAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "adjacent period: http 201 (AdditionalServiceInvoice.${inv2_id} created, DRAFT)"
            - "overlapping period: http 409 and ${err_id} == ERR_INVOICE_PERIOD_OVERLAP"
            - "AdditionalServiceInvoice.${inv1_id}.billable_days == 26  # dates 2026-10-06..2026-10-31 fall in (2026-10-05, 2026-11-05]"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: certify_then_void_conserves_certified_to_date
        grounds:
          - state_machines.PaymentApplication.SUBMITTED_to_CERTIFIED
          - state_machines.PaymentApplication.CERTIFIED_to_VOIDED
          - calculations.contract_position
        distinguishing_aspect: |
          Conserved quantity = money (CaProject.certified_to_date_cents and
          retainage_held_cents): the forward action (certify, +1800000 due / +200000
          retainage) paired with its compensating action (void by FirmAdmin) returns
          both project aggregates exactly to their pre-certify baseline of 0 — no
          drift, because VOIDED applications leave the certified input set.
        test_recipe:
          setup:
            - "ACTIVE TIERED_MARGINAL project (SOV A=6000000/B=4000000), verification visit V1 REPORT_ISSUED; certified_to_date_cents == 0 baseline."
            - "Application (line A work 2000000) submitted."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj I1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-08-31", verification_visit_id: "${v1_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 2000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /ca/payment-applications/${app_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/payment-applications/${app_id}/void"
              payload: {}
              as: FirmAdmin
          assert:
            - "after certify: CaProject.${p_id}.certified_to_date_cents == 1800000 and retainage_held_cents == 200000"
            - "after void: PaymentApplication.${app_id}.status == VOIDED"
            - "after void: CaProject.${p_id}.certified_to_date_cents == 0  # == pre-certify baseline"
            - "after void: CaProject.${p_id}.retainage_held_cents == 0"

      - name: vacate_review_conserves_excusable_delay_days
        grounds:
          - state_machines.Submittal.APPROVED_AS_NOTED_to_UNDER_REVIEW
          - calculations.excusable_delay_credit
        distinguishing_aspect: |
          Conserved quantity = calendar days (CaProject.excusable_delay_days) — a
          different quantity type than money: a late review credits +3 days and the
          compensating vacate-review subtracts exactly the same 3, returning the
          project aggregate to its pre-review baseline (0) with the submittal's own
          credited_delay_days reset to 0.
        test_recipe:
          setup:
            - "ACTIVE project (10-day submittal window); excusable_delay_days == 0 baseline."
            - "Submittal received at the 2026-08-01 default clock (due 2026-08-11)."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj I2", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s_id: $.data.id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /ca/submittals/${s_id}/review"
              payload: { outcome: "APPROVED_AS_NOTED" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/submittals/${s_id}/vacate-review"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "after review: Submittal.${s_id}.credited_delay_days == 3 and CaProject.${p_id}.excusable_delay_days == 3"
            - "after vacate: Submittal.${s_id}.status == UNDER_REVIEW"
            - "after vacate: Submittal.${s_id}.credited_delay_days == 0"
            - "after vacate: CaProject.${p_id}.excusable_delay_days == 0  # == pre-review baseline"
