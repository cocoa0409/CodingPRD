# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Two-plus instances per Difficulty Rule (§0.5); every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and is replayable from empty-DB via §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: recovery_projection_gross_vs_net
        grounds:
          - calculations.expected_recovery_value
          - entities.DenialCase.fields.open_balance_cents
        distinguishing_aspect: |
          DenialCase-domain dual variant: for identical denial data the gross variant
          (no cost offset) and net variant (APPEAL_COST_CENTS * remaining_levels offset)
          return different cents — distinct entity domain from the scorecard instance.
        test_recipe:
          setup:
            - "Payer A (COMMERCIAL, default filing 60d) with one level-1 policy; zero resolved appeals exist, so rate falls back to DEFAULT_OVERTURN_RATE 0.50"
            - "DenialCase CLM-101 with denied_amount_cents 200000, open_balance_cents 200000, current_appeal_level 0 (status RECEIVED)"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-101", patient_account_number: "PA-101", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 220000, denied_amount_cents: 200000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
          trigger:
            - call: "GET /rcm/denial-cases/${d1}/recovery-projection"
              payload: { variant: "gross" }
              as: DenialsManager
              captures: { gross_cents: $.data.expected_recovery_cents, gross_rate: $.data.rate_applied, gross_levels: $.data.remaining_levels }
            - call: "GET /rcm/denial-cases/${d1}/recovery-projection"
              payload: { variant: "net" }
              as: DenialsManager
              captures: { net_cents: $.data.expected_recovery_cents }
          assert:
            - "gross variant: expected_recovery_cents == 100000 (200000 * 0.50)"
            - "net variant: expected_recovery_cents == 85000 (100000 - 5000 * 3 remaining levels)"
            - "rate_applied == 0.5 and remaining_levels == 3 on the gross response"
            - "gross response value != net response value for identical denial state"

      - name: prevention_score_incidence_vs_financial
        grounds:
          - calculations.prevention_scorecard_score
          - entities.DepartmentScorecard.fields.prevention_score_incidence
          - entities.DepartmentScorecard.fields.prevention_score_financial
        distinguishing_aspect: |
          DepartmentScorecard-domain dual variant: count-weighted (incidence) vs
          dollar-weighted (financial) scoring of the same frozen period produce
          different scores (85.00 vs 92.50) — distinct entity domain and metric
          from the recovery-projection instance.
        test_recipe:
          setup:
            - "Logical clock at default 2026-08-01T00:00:00Z"
            - "OPEN DepartmentScorecard for CODING [2026-08-01, 2026-09-01)"
            - "Denial CLM-201 (denied 25000, triaged preventable) and denial CLM-202 (denied 75000, triaged not preventable), both category CODING -> department CODING"
            - "Scorecard counters after triages: denial_count 2, preventable_denial_count 1, denied_cents 100000, preventable_denied_cents 25000; one auto RootCauseTask OPEN (due 2026-08-15, not overdue at 2026-08-01); zero verified/recurrence events"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/department-scorecards"
              payload: { department: "CODING", period_start_date: "2026-08-01", period_end_date: "2026-09-01" }
              as: RevenueCycleDirector
              captures: { sc: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-201", patient_account_number: "PA-201", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 50000, denied_amount_cents: 25000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: true }
              as: DenialsSpecialist
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-202", patient_account_number: "PA-202", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 90000, denied_amount_cents: 75000, service_date: "2026-07-11", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d2: $.data.id }
            - call: "POST /rcm/denial-cases/${d2}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/department-scorecards/${sc}/finalize"
              payload: {}
              as: RevenueCycleDirector
          assert:
            - "prevention_score_incidence == 85.00 (100 - (50*0 + 30*0.5 + 20*0))"
            - "prevention_score_financial == 92.50 (100 - (50*0 + 30*0.25 + 20*0))"
            - "score_tier == GOOD (85.00 >= 75.00 and < 90.00; tier always derives from the incidence score)"
            - "the two stored variants differ for identical frozen counters"

  # ---------------------------------------------------------------- Rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: queue_priority_multifactor_scoring
        grounds:
          - calculations.queue_priority_score
          - entities.DenialCase.fields.priority_score
          - entities.DenialCase.fields.queue_bucket
        distinguishing_aspect: |
          Mode (a) formula with >= 3 inputs and non-linear interaction: min-capped
          dollar component, branch-on-horizon deadline component (0 beyond 30 days),
          and level boost; bucket edges are >= comparisons. Distinct mode from the
          rounding-order and evaluation-order instances.
        test_recipe:
          setup:
            - "Payer A with level-1 policy (60 days); code CO-16 (CODING)"
            - "Denial CLM-301 denied 250000, remittance_received_date 2026-08-01 -> next_appeal_deadline 2026-09-30; triaged, assigned (QUEUED)"
            - "Logical clock set to 2026-09-16 (days_remaining = 14, inside the 30-day horizon; not past deadline, so no expiry)"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-301", patient_account_number: "PA-301", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: RevenueCycleDirector
          trigger:
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsManager
              captures: { score_before: $.data.priority_score, bucket_before: $.data.queue_bucket }
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id, ap1_level: $.data.level_number }
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsManager
              captures: { score_after: $.data.priority_score, bucket_after: $.data.queue_bucket }
          assert:
            - "before appeal: priority_score == 49.00 (min(250000/10000,50)=25 + max(0,45-1.5*14)=24 + level_boost 0) and queue_bucket == MEDIUM (>= 25.00, < 50.00)"
            - "after appeal create: priority_score == 54.00 (level_boost 5 * min(1,2)) and queue_bucket == HIGH (>= 50.00)"
            - "Appeal.level_number == 1 and denial.current_appeal_level == 1"

      - name: overturn_report_pooled_rounding_order
        grounds:
          - calculations.overturn_rate_report
        distinguishing_aspect: |
          Mode (b) nested rounding order: per-category cells are rounded individually,
          while the totals row is pinned to a single rounding over pooled raw counts —
          totals 66.67 != 75.00 average-of-rounded-cells. Distinct mode from (a) and (c).
        test_recipe:
          setup:
            - "Payer A with level-1 policy (60d, requires CLINICAL_NOTES) and level-2 policy (45d, requires CLINICAL_NOTES + PHYSICIAN_LETTER); codes CO-16 (CODING) and CO-45 (REGISTRATION)"
            - "Denial CLM-302 (CODING, denied 100000): level-1 appeal UPHELD, then level-2 appeal OVERTURNED in full -> category CODING resolved 2, overturned 1"
            - "Denial CLM-303 (REGISTRATION, denied 50000): level-1 appeal OVERTURNED in full -> category REGISTRATION resolved 1, overturned 1"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 2, timely_filing_days: 45, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES", "PHYSICIAN_LETTER"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-45", category: "REGISTRATION", default_department: "REGISTRATION", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_reg: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-302", patient_account_number: "PA-302", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d_a: $.data.id }
            - call: "POST /rcm/denial-cases/${d_a}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_a_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d_a}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_a_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d_a}" }
              as: DenialsSpecialist
              captures: { ap_a1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap_a1}", document_type: "CLINICAL_NOTES", file_reference: "doc-a1-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap_a1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap_a1}/submit"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap_a1}/record-outcome"
              payload: { outcome: "UPHELD", recovered_amount_cents: 0 }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d_a}" }
              as: DenialsSpecialist
              captures: { ap_a2: $.data.id, ap_a2_level: $.data.level_number }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap_a2}", document_type: "CLINICAL_NOTES", file_reference: "doc-a2-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap_a2}", document_type: "PHYSICIAN_LETTER", file_reference: "doc-a2-letter" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap_a2}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap_a2}/submit"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap_a2}/record-outcome"
              payload: { outcome: "OVERTURNED", recovered_amount_cents: 100000 }
              as: DenialsSpecialist
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-303", patient_account_number: "PA-303", payer_id: "${p_a}", remittance_code_id: "${rc_reg}", billed_amount_cents: 60000, denied_amount_cents: 50000, service_date: "2026-07-12", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d_b: $.data.id }
            - call: "POST /rcm/denial-cases/${d_b}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_b_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d_b}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_b_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d_b}" }
              as: DenialsSpecialist
              captures: { ap_b1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap_b1}", document_type: "CLINICAL_NOTES", file_reference: "doc-b1-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap_b1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap_b1}/submit"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap_b1}/record-outcome"
              payload: { outcome: "OVERTURNED", recovered_amount_cents: 50000 }
              as: DenialsSpecialist
          trigger:
            - call: "GET /rcm/analytics/overturn-rates"
              payload: { group_by: "category" }
              as: DenialsManager
              captures: { rows: $.data.rows, totals: $.data.totals }
          assert:
            - "row CODING: resolved_count == 2, overturned_count == 1, overturn_rate_pct == 50.00"
            - "row REGISTRATION: resolved_count == 1, overturned_count == 1, overturn_rate_pct == 100.00"
            - "totals.resolved_count == 3 and totals.overturn_rate_pct == 66.67 (pooled raw 2/3 rounded once)"
            - "totals.overturn_rate_pct != 75.00 (the forbidden average of rounded cells)"

      - name: writeoff_tier_exposure_evaluation_order
        grounds:
          - calculations.writeoff_net_exposure
          - entities.WriteOffRequest.fields.approval_tier
          - entities.WriteOffRequest.fields.projected_recovery_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: tier is
          keyed on the gross requested amount (step 2), the recovery projection then
          depends on the tier multiplier (step 4), and the recommended write-off is
          last (step 5) — never the reverse. Distinct mode from (a) and (b).
        test_recipe:
          setup:
            - "Payer A (fresh: zero resolved appeals -> rate 0.50) with level-1 policy; code CO-16"
            - "Denial CLM-401 (denied 1500000) and denial CLM-402 (denied 4000000), both triaged and assigned (QUEUED, open balance equals denied amount)"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-401", patient_account_number: "PA-401", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 1600000, denied_amount_cents: 1500000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d1_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d1_v}" }
              as: DenialsManager
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-402", patient_account_number: "PA-402", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 4100000, denied_amount_cents: 4000000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d2: $.data.id }
            - call: "POST /rcm/denial-cases/${d2}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d2_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d2}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d2_v}" }
              as: DenialsManager
          trigger:
            - call: "POST /rcm/write-off-requests"
              payload: { denial_case_id: "${d1}", requested_amount_cents: 1500000, reason_code: "SMALL_BALANCE" }
              as: DenialsSpecialist
              as_user_id: "spec-7"
              captures: { w1: $.data.id, w1_tier: $.data.approval_tier, w1_status: $.data.status, w1_proj: $.data.projected_recovery_cents, w1_rec: $.data.recommended_writeoff_cents }
            - call: "POST /rcm/write-off-requests"
              payload: { denial_case_id: "${d2}", requested_amount_cents: 4000000, reason_code: "APPEALS_EXHAUSTED" }
              as: DenialsSpecialist
              as_user_id: "spec-7"
              captures: { w2: $.data.id, w2_tier: $.data.approval_tier, w2_status: $.data.status, w2_proj: $.data.projected_recovery_cents, w2_rec: $.data.recommended_writeoff_cents }
          assert:
            - "w1: approval_tier == STANDARD, status == PENDING_MANAGER (1500000 <= 2500000 manager limit)"
            - "w1: projected_recovery_cents == 750000 (1500000 * 0.50 * 1.0) and recommended_writeoff_cents == 750000"
            - "w2: approval_tier == ESCALATED, status == ESCALATED_DIRECTOR (4000000 > 2500000)"
            - "w2: projected_recovery_cents == 1500000 (4000000 * 0.50 * 0.75 escalated multiplier) and recommended_writeoff_cents == 2500000"

  # ---------------------------------------------------------------- Rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: appeal_letter_revise_cycle
        grounds:
          - state_machines.Appeal.DRAFT_to_LETTER_GENERATED
          - state_machines.Appeal.LETTER_GENERATED_to_DRAFT
          - state_machines.Appeal.LETTER_GENERATED_to_SUBMITTED
        distinguishing_aspect: |
          Appeal machine is cyclic (LETTER_GENERATED -> DRAFT rework loop before
          submission), a non-linear shape on a different entity than the
          RootCauseTask reopen cycle.
        test_recipe:
          setup:
            - "Payer A with level-1 policy (60d, requires CLINICAL_NOTES, response window 30); code CO-16"
            - "Denial CLM-501 (denied 250000, remit 2026-08-01 -> deadline 2026-09-30), triaged and assigned"
            - "Appeal created (level 1, DRAFT) with one ACTIVE CLINICAL_NOTES attachment; logical clock 2026-08-05"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-501", patient_account_number: "PA-501", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-501-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: RevenueCycleDirector
          trigger:
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
              captures: { st1: $.data.status, body1: $.data.letter_body }
            - call: "POST /rcm/appeals/${ap1}/revise"
              payload: {}
              as: DenialsSpecialist
              captures: { st2: $.data.status, body2: $.data.letter_body }
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
              captures: { st3: $.data.status, body3: $.data.letter_body }
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
              captures: { st4: $.data.status, sub_at: $.data.submitted_at, due: $.data.response_due_date }
          assert:
            - "after first generate-letter: status == LETTER_GENERATED and letter_body is non-null (contains claim CLM-501)"
            - "after revise: status == DRAFT and letter_body == null (loop back)"
            - "after second generate-letter: status == LETTER_GENERATED again and letter_body non-null"
            - "after submit: status == SUBMITTED, submitted_at == 2026-08-05T00:00:00Z, response_due_date == 2026-09-04"

      - name: root_cause_task_reopen_cycle
        grounds:
          - state_machines.RootCauseTask.FIX_IMPLEMENTED_to_VERIFIED
          - state_machines.RootCauseTask.VERIFIED_to_REOPENED
          - state_machines.RootCauseTask.REOPENED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          RootCauseTask machine is cyclic (VERIFIED -> REOPENED -> ACKNOWLEDGED loop
          driven by recurrence of a same-department/same-category denial), a
          non-linear shape on a different entity than the Appeal letter cycle.
        test_recipe:
          setup:
            - "OPEN DepartmentScorecard CODING [2026-08-01, 2027-01-01); payer A with level-1 policy; code CO-16 (CODING)"
            - "Denial CLM-502 (CODING, denied 100000) triaged preventable at 2026-08-01 -> auto task T1 OPEN (due 2026-08-15)"
            - "T1 acknowledged + fix implemented by uo-1, verified by mgr-1 at clock 2026-08-10 -> VERIFIED, monitoring_until_date 2026-11-08"
            - "Denial CLM-503 (same category CODING, denied 60000) intake at clock 2026-08-12"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/department-scorecards"
              payload: { department: "CODING", period_start_date: "2026-08-01", period_end_date: "2027-01-01" }
              as: RevenueCycleDirector
              captures: { sc: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-502", patient_account_number: "PA-502", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: true }
              as: DenialsSpecialist
            - call: "GET /rcm/root-cause-tasks"
              payload: { denial_case_id: "${d1}" }
              as: DenialsManager
              captures: { t1: "$.data[0].id" }
            - call: "POST /rcm/root-cause-tasks/${t1}/acknowledge"
              payload: {}
              as: UpstreamOwner
              as_user_id: "uo-1"
            - call: "POST /rcm/root-cause-tasks/${t1}/implement-fix"
              payload: { fix_summary: "Corrected modifier mapping in encoder" }
              as: UpstreamOwner
              as_user_id: "uo-1"
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RevenueCycleDirector
            - call: "POST /rcm/root-cause-tasks/${t1}/verify"
              payload: {}
              as: DenialsManager
              as_user_id: "mgr-1"
              captures: { t1_status_v: $.data.status, t1_mon: $.data.monitoring_until_date }
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: RevenueCycleDirector
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-503", patient_account_number: "PA-503", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 70000, denied_amount_cents: 60000, service_date: "2026-07-15", remittance_received_date: "2026-08-12" }
              as: DenialsSpecialist
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /rcm/denial-cases/${d2}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
            - call: "GET /rcm/root-cause-tasks/${t1}"
              payload: {}
              as: DenialsManager
              captures: { t1_status: $.data.status, t1_reopened: $.data.reopened_count }
            - call: "POST /rcm/root-cause-tasks/${t1}/acknowledge"
              payload: {}
              as: UpstreamOwner
              as_user_id: "uo-2"
              captures: { t1_status2: $.data.status }
            - call: "GET /rcm/department-scorecards/${sc}"
              payload: {}
              as: DenialsManager
              captures: { sc_verified: $.data.verified_fix_count, sc_recur: $.data.recurrence_count, sc_open: $.data.open_task_count }
          assert:
            - "verify step: T1 status == VERIFIED and monitoring_until_date == 2026-11-08 (verified 2026-08-10 + 90 days)"
            - "after CLM-503 triage: T1 status == REOPENED, reopened_count == 1, verified_at == null (cycle VERIFIED -> REOPENED fired by recurrence sweep)"
            - "re-acknowledge from REOPENED succeeds: status == ACKNOWLEDGED"
            - "scorecard: verified_fix_count == 0, recurrence_count == 1, open_task_count == 1"

  # ---------------------------------------------------------------- Rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: clock_sweep_expiry_cascade
        grounds:
          - state_machines.DenialCase.QUEUED_to_CLOSED_EXPIRED
          - calculations.writeoff_net_exposure
          - entities.DepartmentScorecard.fields.auto_writeoff_request_count
        distinguishing_aspect: |
          Depth-3 cascade originating from the clock-set trigger: denial expiry
          (hop 1) auto-creates a WriteOffRequest (hop 2), whose creation bumps
          scorecard expired/auto-writeoff counters (hop 3). Different trigger
          (system clock sweep) than the outcome-recording cascade.
        test_recipe:
          setup:
            - "OPEN DepartmentScorecard CODING [2026-08-01, 2026-12-31); payer A with level-1 policy (60d); code CO-16"
            - "Denial CLM-601 (denied 250000, remit 2026-08-01 -> deadline 2026-09-30), triaged non-preventable, assigned -> QUEUED, never appealed"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/department-scorecards"
              payload: { department: "CODING", period_start_date: "2026-08-01", period_end_date: "2026-12-31" }
              as: RevenueCycleDirector
              captures: { sc: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-601", patient_account_number: "PA-601", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
          trigger:
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RevenueCycleDirector
              captures: { expired: $.data.expired_denial_ids }
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsManager
              captures: { d_status: $.data.status, d_deadline: $.data.next_appeal_deadline }
            - call: "GET /rcm/write-off-requests"
              payload: { denial_case_id: "${d1}" }
              as: DenialsManager
              captures: { wo_amt: "$.data[0].requested_amount_cents", wo_reason: "$.data[0].reason_code", wo_by: "$.data[0].requested_by_user_id", wo_tier: "$.data[0].approval_tier", wo_status: "$.data[0].status" }
            - call: "GET /rcm/department-scorecards/${sc}"
              payload: {}
              as: DenialsManager
              captures: { sc_exp: $.data.expired_denial_count, sc_auto: $.data.auto_writeoff_request_count }
          assert:
            - "hop 1: denial CLM-601 status == CLOSED_EXPIRED and next_appeal_deadline == null; clock response expired_denial_ids contains the denial id"
            - "hop 2: exactly one WriteOffRequest exists for the denial with requested_amount_cents == 250000, reason_code == TIMELY_FILING_EXPIRED, requested_by_user_id == system, approval_tier == STANDARD, status == PENDING_MANAGER"
            - "hop 3: scorecard expired_denial_count == 1 and auto_writeoff_request_count == 1"
            - "work queue no longer lists the denial (status not in {QUEUED, IN_APPEAL})"

      - name: overturn_outcome_recovery_cascade
        grounds:
          - state_machines.Appeal.SUBMITTED_to_OVERTURNED
          - state_machines.DenialCase.IN_APPEAL_to_RESOLVED_PAID
          - entities.DepartmentScorecard.fields.recovered_cents
        distinguishing_aspect: |
          Depth-2 cascade originating from the record-outcome trigger: appeal
          outcome mutates the denial (hop 1: recovered dollars + RESOLVED_PAID),
          whose mutation increments the department scorecard (hop 2). Different
          trigger and propagation pattern than the clock sweep.
        test_recipe:
          setup:
            - "OPEN DepartmentScorecard CODING [2026-08-01, 2026-12-31); payer A with level-1 policy; code CO-16"
            - "Denial CLM-701 (denied 100000), triaged, assigned, level-1 appeal submitted at clock 2026-08-05 with CLINICAL_NOTES attached"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/department-scorecards"
              payload: { department: "CODING", period_start_date: "2026-08-01", period_end_date: "2026-12-31" }
              as: RevenueCycleDirector
              captures: { sc: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-701", patient_account_number: "PA-701", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-701-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: RevenueCycleDirector
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "OVERTURNED", recovered_amount_cents: 100000 }
              as: DenialsSpecialist
              captures: { ap_status: $.data.status, ap_amt: $.data.outcome_amount_cents }
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsManager
              captures: { d_status: $.data.status, d_rec: $.data.recovered_amount_cents, d_open: $.data.open_balance_cents, d_dl: $.data.next_appeal_deadline }
            - call: "GET /rcm/department-scorecards/${sc}"
              payload: {}
              as: DenialsManager
              captures: { sc_rec: $.data.recovered_cents }
          assert:
            - "appeal: status == OVERTURNED, outcome_amount_cents == 100000"
            - "hop 1: denial status == RESOLVED_PAID, recovered_amount_cents == 100000, open_balance_cents == 0, next_appeal_deadline == null"
            - "hop 2: scorecard recovered_cents == 100000"
            - "dollar invariant holds: 0 open + 100000 recovered + 0 written_off == 100000 denied"

  # ---------------------------------------------------------------- Rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: writeoff_approve_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
        distinguishing_aspect: |
          Category pair state x business_fiscal: approving a REJECTED request whose
          amount also exceeds manager-tier authority returns the state error
          ERR_WRITE_OFF_NOT_PENDING (priority 6), never ERR_APPROVAL_LIMIT_EXCEEDED
          (priority 11).
        test_recipe:
          setup:
            - "Payer A with level-1 policy; code CO-16; denial CLM-801 (denied 4000000) triaged and assigned"
            - "WriteOffRequest W for 4000000 created by spec-7 -> ESCALATED_DIRECTOR; rejected by the director -> REJECTED"
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-801", patient_account_number: "PA-801", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 4100000, denied_amount_cents: 4000000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/write-off-requests"
              payload: { denial_case_id: "${d1}", requested_amount_cents: 4000000, reason_code: "APPEALS_EXHAUSTED" }
              as: DenialsSpecialist
              as_user_id: "spec-7"
              captures: { w1: $.data.id }
            - call: "POST /rcm/write-off-requests/${w1}/reject"
              payload: { reason: "Insufficient documentation of exhaustion" }
              as: RevenueCycleDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /rcm/write-off-requests/${w1}/approve"
              payload: {}
              as: DenialsManager
              as_user_id: "mgr-2"
              captures: { err: $.data.error_id }
          assert:
