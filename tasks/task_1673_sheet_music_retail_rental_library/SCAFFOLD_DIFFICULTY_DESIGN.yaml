          setup:
            - "Institutional account requires_purchase_order; PO created but NOT approved; order reserved would fail — instead order created with PO while PO SUBMITTED: reserve must fail; approve PO; reserve+dispatch succeed; flip account to HOLD (PO → SUSPENDED); second order's dispatch fails"
