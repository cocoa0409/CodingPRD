  - rule_id: resource_temporal_overlap
    instances:
      - name: live_onsite_window_conflict_includes_teardown_buffer_closed_interval
        grounds:
          - validations.priority_32_ERR_AUCTION_WINDOW_CONFLICT
          - entities.Yard.fields.teardown_buffer_minutes
          - entities.Auction.fields.kind
        distinguishing_aspect: |
          With a 120 minute teardown buffer on an existing 14:00-22:00 event, a
          second LIVE_ONSITE auction starting exactly at 2026-08-11T00:00:00Z is
          refused because the buffered interval is closed, the same auction one
          second later is accepted, and a TIMED_ONLINE auction fully inside the
          original window is accepted because online events are exempt.
        test_recipe:
          setup:
            - "one yard with teardown_buffer_minutes 120 and loadout_deadline_days 10"
            - "one SCHEDULED LIVE_ONSITE auction occupying 2026-08-10T14:00:00Z to 2026-08-10T22:00:00Z, so the blocked interval runs through 2026-08-11T00:00:00Z inclusive"
            - "no lots or bidders are needed: the conflict is decided from the auction rows alone"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yards"
              payload: { code: "YRD-DAL", country_code: "US", teardown_buffer_minutes: 120, loadout_deadline_days: 10, currency_code: "USD" }
              as: PlatformAdmin
