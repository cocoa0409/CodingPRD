# =============================================================================
# SCAFFOLD — Employment Background Screening Vendor Management (HR screening program)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Employment Background Screening Vendor Management (HR screening program): screening package by role & risk tier, consent/disclosure compliance & standalone form requirements, turnaround-time SLA & escalation, adjudication matrix & individualized assessment, dispute handling & re-investigation, adverse action pre/final notice timing, ban-the-box & local ordinance compliance, vendor accuracy audit & re-screen policy"

domain_name: employment-background-screening
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat           # peer entities joined by FK references; no URL nesting except reverse-reachability sub-resource GETs
  state_machine_shape: parallel   # ScreeningOrder carries fulfillment_status x adjudication_status; several cyclic machines elsewhere
  relationship_patterns:
    - one_to_many
    - self_referential            # ScreeningOrder.rescreen_of_order_id -> ScreeningOrder.id
    - cross_aggregate             # Position -> Package/JurisdictionRule; Order -> Candidate/Position/Vendor; Case -> Order
  role_model: segregation_of_duties   # the Adjudicator who initiates adverse action may not issue the final notice
  consistency_model: immediate        # every mutation is atomically visible in the same response

# =============================================================================
# §1.1 Entity-Relationship Table
# Business time convention (global): the logical clock is set only via
# POST /_clock/set_current_utc and defaults to 2026-08-01T00:00:00Z at startup.
# A "business day" is Monday–Friday UTC (no holidays); a "business window" is
# 09:00:00Z–17:00:00Z on a business day (8 business hours per business day).
# =============================================================================
entities:
  - name: ScreeningVendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor legal name" }
      - { name: base_tat_business_hours, type: integer, source: input, description: "Contracted base turnaround, business hours; informational" }
      - { name: max_concurrent_orders, type: integer, source: input, description: "Capacity cap: max orders with fulfillment_status == DISPATCHED", constraints: ">= 1" }
      - { name: surcharge_cents, type: integer, source: input, default: 0, description: "Per-order vendor surcharge added to package fee" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | PROBATION | DECERTIFIED" }
      - { name: active_order_count, type: integer, source: computed, default: 0, description: "Count of ScreeningOrders with fulfillment_status == DISPATCHED for this vendor; maintained by dispatch (+1), report delivery (-1), cancel/revoke/decertify cascade (-1)" }
      - { name: consecutive_sla_breaches, type: integer, source: computed, default: 0, description: "+1 on late report delivery, reset to 0 on on-time delivery; >= 3 auto-transitions ACTIVE vendor to PROBATION" }
      - { name: accuracy_bps_finalized, type: integer, source: computed, default: 10000, description: "Pooled accuracy over FINALIZED audits in basis points: round_half_up(10000 * (1 - sum(mismatches_found)/sum(sample_size))); 10000 when no finalized audits" }
      - { name: accuracy_bps_including_draft, type: integer, source: computed, default: 10000, description: "Provisional variant: same pooled formula over FINALIZED + DRAFT audits; diverges from finalized variant whenever a DRAFT audit exists" }

  - name: VendorAccuracyAudit
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> ScreeningVendor.id; audit subject" }
      - { name: period_start, type: datetime, source: input, description: "Audit window start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Audit window end (EXCLUSIVE for overlap checks against other audits; the re-screen sweep uses the CLOSED interval [period_start, period_end])", constraints: "period_end > period_start" }
      - { name: sample_size, type: integer, source: input, description: "Reports sampled", constraints: ">= 1" }
      - { name: mismatches_found, type: integer, source: input, description: "Inaccurate reports found in sample", constraints: "0 <= mismatches_found <= sample_size" }
      - { name: mismatch_rate_bps, type: integer, source: computed, description: "round_half_up(mismatches_found / sample_size * 10000); computed at creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED" }
      - { name: rescreen_order_ids, type: array, source: computed, default: [], description: "ScreeningOrder ids (order_type RESCREEN) created by the finalize sweep, in creation order" }

  - name: ScreeningPackage
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Package name" }
      - { name: risk_tier, type: enum, source: input, description: "TIER_1_STANDARD | TIER_2_ELEVATED | TIER_3_HIGH_RISK" }
      - { name: check_types, type: array, source: input, description: "Non-empty array of CRIMINAL_COUNTY | CRIMINAL_STATE | CRIMINAL_FEDERAL | SSN_TRACE | EMPLOYMENT_VERIFY | EDUCATION_VERIFY | MVR | CREDIT_CHECK | GLOBAL_SANCTIONS", constraints: "min length 1" }
      - { name: tat_business_hours, type: integer, source: input, description: "Package SLA baseline in business hours", constraints: ">= 1" }
      - { name: fee_cents, type: integer, source: input, description: "Vendor charge per order in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: JurisdictionRule
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction code, e.g. US-CA or US-NY-NYC" }
      - { name: screening_gate_stage, type: enum, source: input, description: "POST_CONDITIONAL_OFFER (ban-the-box) | ANYTIME" }
      - { name: lookback_years_limit, type: integer, source: input, description: "Convictions older than this many years before report delivery are excluded from consideration", constraints: ">= 0" }
      - { name: arrest_records_considerable, type: boolean, source: input, description: "If false, findings with disposition ARREST_ONLY are excluded from consideration" }
      - { name: lookback_exemption_salary_cents, type: integer, source: input, default: 0, description: "If > 0 and position salary >= this, the lookback limit does not apply" }
      - { name: pre_adverse_wait_business_days, type: integer, source: input, description: "Jurisdictional minimum business days between pre-adverse and final notice" , constraints: ">= 0" }
      - { name: individualized_assessment_required, type: boolean, source: input, description: "If true, INITIATE_ADVERSE always requires a decided PROCEED_ADVERSE IndividualizedAssessment even when the matrix outcome is ADVERSE_ELIGIBLE" }
      - { name: credit_check_allowed, type: boolean, source: input, description: "If false, positions in this jurisdiction may not reference packages containing CREDIT_CHECK" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE; at most one ACTIVE rule per jurisdiction_code" }

  - name: AdjudicationMatrix
    parent: null
    common_fields: true
    fields:
      - { name: risk_tier, type: enum, source: input, description: "TIER_1_STANDARD | TIER_2_ELEVATED | TIER_3_HIGH_RISK; at most one ACTIVE matrix per risk tier" }
      - { name: rules, type: array, source: input, description: "Ordered array of { offense_category, min_severity (LOW|MEDIUM|HIGH), max_recency_years (integer), action (CLEAR|IA_REQUIRED|ADVERSE_ELIGIBLE) }; evaluated first-match-wins per finding in declared array order", constraints: "min length 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Job title" }
      - { name: department, type: string, source: input, description: "Department" }
      - { name: risk_tier, type: enum, source: input, description: "TIER_1_STANDARD | TIER_2_ELEVATED | TIER_3_HIGH_RISK; selects the ACTIVE AdjudicationMatrix at report delivery" }
      - { name: package_id, type: string, source: input, description: "FK -> ScreeningPackage.id; package must be ACTIVE at position creation" }
      - { name: jurisdiction_code, type: string, source: input, description: "Work location jurisdiction; an ACTIVE JurisdictionRule with this code must exist at position creation" }
      - { name: annual_salary_cents, type: integer, source: input, description: "Annualized salary; compared to lookback_exemption_salary_cents", constraints: ">= 0" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Candidate full name" }
      - { name: email, type: string, source: input, description: "Candidate email", constraints: "unique across candidates" }
      - { name: home_jurisdiction_code, type: string, source: input, description: "Candidate residence jurisdiction (informational; screening law follows Position.jurisdiction_code)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN" }

  - name: ScreeningOrder
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; candidate must be ACTIVE" }
      - { name: position_id, type: string, source: input, description: "FK -> Position.id" }
      - { name: order_type, type: enum, source: system, default: INITIAL, description: "INITIAL | RESCREEN; RESCREEN rows are created only by the audit finalize sweep" }
      - { name: rescreen_of_order_id, type: string, source: system, description: "FK -> ScreeningOrder.id; null for INITIAL; set to the original order for RESCREEN", constraints: "nullable" }
      - { name: vendor_id, type: string, source: system, description: "FK -> ScreeningVendor.id; null until dispatch" , constraints: "nullable" }
      - { name: conditional_offer_extended_at, type: datetime, source: input, description: "When the conditional offer was extended; REQUIRED and <= now when the position's jurisdiction rule has screening_gate_stage == POST_CONDITIONAL_OFFER", constraints: "nullable" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | CONSENT_CAPTURED | DISPATCHED | REPORT_RECEIVED | CLOSED | CANCELLED — parallel dimension A" }
      - { name: adjudication_status, type: enum, source: system, description: "NOT_STARTED | PENDING_REVIEW | CLEARED | PRE_ADVERSE_PENDING | FINAL_ADVERSE | DISPUTE_HOLD | VOIDED — parallel dimension B" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock timestamp of dispatch; null until dispatched", constraints: "nullable" }
      - { name: sla_due_at, type: datetime, source: computed, description: "dispatched_at + package.tat_business_hours of business-window time (Mon-Fri 09:00-17:00Z); null until dispatched", constraints: "nullable" }
      - { name: escalation_level, type: integer, source: computed, default: 0, description: "+1 per successful POST .../escalate" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "package.fee_cents + vendor.surcharge_cents, frozen at dispatch; null until dispatch; voided to null on cancel-while-DISPATCHED", constraints: "nullable" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Set at report delivery: 0 for RESCREEN orders; otherwise provisional_fee_cents minus SLA credit (10% when sla_breached, floor 0); null until delivery", constraints: "nullable" }
      - { name: pinned_package_id, type: string, source: system, description: "FK -> ScreeningPackage.id; snapshot of position.package_id frozen at dispatch", constraints: "nullable" }
      - { name: pinned_package_version, type: integer, source: system, description: "ScreeningPackage.version at dispatch", constraints: "nullable" }
      - { name: pinned_matrix_id, type: string, source: system, description: "FK -> AdjudicationMatrix.id; ACTIVE matrix for position.risk_tier pinned at report delivery", constraints: "nullable" }
      - { name: pinned_matrix_version, type: integer, source: system, description: "AdjudicationMatrix.version at report delivery; re-evaluation after amendment reuses this pinned matrix even if later RETIRED", constraints: "nullable" }
      - { name: recommended_outcome, type: enum, source: computed, description: "CLEAR | IA_REQUIRED | ADVERSE_ELIGIBLE; from adjudication_outcome calc at report delivery (and re-computed on report AMENDED); null until delivery", constraints: "nullable" }
      - { name: adverse_initiated_by_user_id, type: string, source: system, description: "X-User-ID of the Adjudicator who recorded INITIATE_ADVERSE; segregation-of-duties reference for the final notice", constraints: "nullable" }

  - name: ConsentRecord
    parent: ScreeningOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ScreeningOrder.id" }
      - { name: disclosure_form_id, type: string, source: input, description: "Identifier of the standalone disclosure document presented" }
      - { name: contains_extraneous_terms, type: boolean, source: input, description: "True if the disclosure bundled liability waivers/other terms; FCRA standalone requirement rejects such consent" }
      - { name: authorization_signed_at, type: datetime, source: input, description: "When the candidate signed authorization; must be <= now at capture; consent is fresh for 90 days after this instant" }
      - { name: captured_by_user_id, type: string, source: system, description: "X-User-ID of capturing Candidate; must equal order.candidate_id" }
      - { name: status, type: enum, source: system, description: "CAPTURED | REVOKED | EXPIRED" }

  - name: ScreeningReport
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ScreeningOrder.id; order must be DISPATCHED to this vendor" }
      - { name: vendor_id, type: string, source: system, description: "FK -> ScreeningVendor.id; copied from order.vendor_id; must equal the submitting VendorAgent's X-User-ID" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of report submission" }
      - { name: turnaround_business_hours, type: number, source: computed, description: "business_hours_between(order.dispatched_at, delivered_at), 2 decimals round_half_up" }
      - { name: sla_breached, type: boolean, source: computed, description: "true iff turnaround_business_hours > package.tat_business_hours (strictly greater; equality is on time)" }
      - { name: status, type: enum, source: system, description: "DELIVERED | DISPUTED | UPHELD | AMENDED" }

  - name: ReportFinding
    parent: ScreeningReport
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> ScreeningReport.id" }
      - { name: check_type, type: enum, source: input, description: "One of the package check_type enum members; must be an element of the order package's check_types" }
      - { name: offense_category, type: enum, source: input, description: "VIOLENT_FELONY | NONVIOLENT_FELONY | MISDEMEANOR | INFRACTION | ARREST_NO_CONVICTION | EMPLOYMENT_DISCREPANCY | EDUCATION_DISCREPANCY | SANCTIONS_HIT" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: offense_date, type: datetime, source: input, description: "Date of offense/discrepancy (time component ignored; treated as 00:00:00Z)" }
      - { name: disposition, type: enum, source: input, description: "CONVICTION | DISMISSED | PENDING | ARREST_ONLY" }
      - { name: considerable, type: boolean, source: computed, description: "false if disposition == ARREST_ONLY and jurisdiction.arrest_records_considerable == false; false if disposition == CONVICTION and offense_date < lookback cutoff and no salary exemption; otherwise true" }
      - { name: matched_action, type: enum, source: computed, description: "CLEAR | IA_REQUIRED | ADVERSE_ELIGIBLE from first matching matrix rule; null when not considerable or no rule matches (no-match defaults to CLEAR)", constraints: "nullable" }

  - name: IndividualizedAssessment
    parent: ScreeningOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ScreeningOrder.id" }
      - { name: adjudicator_user_id, type: string, source: system, description: "X-User-ID of the creating Adjudicator" }
      - { name: green_factor_nature_gravity, type: enum, source: input, description: "LOW | MODERATE | HIGH — nature and gravity of the offense" }
      - { name: green_factor_time_elapsed, type: enum, source: input, description: "LOW | MODERATE | HIGH — time elapsed since offense/completion of sentence" }
      - { name: green_factor_job_relatedness, type: enum, source: input, description: "LOW | MODERATE | HIGH — relatedness to the job sought" }
      - { name: evidence_considered, type: boolean, source: input, description: "Whether candidate-submitted evidence was considered" }
      - { name: decision, type: enum, source: input, description: "PROCEED_ADVERSE | CLEAR_CANDIDATE" }
      - { name: status, type: enum, source: system, description: "DECIDED | VOID (VOID when the order is cancelled or consent revoked after decision)" }

  - name: AdverseActionCase
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ScreeningOrder.id; 1:1 — created atomically by adjudication-decision INITIATE_ADVERSE" }
      - { name: initiated_by_user_id, type: string, source: system, description: "X-User-ID of the Adjudicator who initiated adverse action; final notice issuer must differ" }
      - { name: pre_notice_sent_at, type: datetime, source: system, description: "Logical-clock timestamp at case creation (pre-adverse notice is sent atomically)" }
      - { name: wait_business_days_required, type: integer, source: computed, description: "max(5, jurisdiction.pre_adverse_wait_business_days) — FCRA baseline vs jurisdictional override" }
      - { name: total_hold_business_days, type: integer, source: computed, default: 0, description: "Accumulated business days spent in DISPUTE_HOLD (hold start date exclusive, hold end date inclusive per business-day count)" }
      - { name: earliest_final_notice_at, type: datetime, source: computed, description: "business_day_add(pre_notice_sent_at, wait_business_days_required + total_hold_business_days) at 00:00:00Z; recomputed when a hold closes" }
      - { name: hold_started_at, type: datetime, source: system, description: "When the current DISPUTE_HOLD began; null when not on hold", constraints: "nullable" }
      - { name: final_notice_sent_at, type: datetime, source: system, description: "Null until final notice", constraints: "nullable" }
      - { name: final_notice_issuer_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who issued the final notice; must differ from initiated_by_user_id", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "WAITING_PERIOD | ELIGIBLE_FOR_FINAL | DISPUTE_HOLD | FINAL_NOTICE_SENT | ABORTED" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ScreeningOrder.id" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; copied from order.candidate_id; must equal the filing Candidate's X-User-ID" }
      - { name: reason, type: string, source: input, description: "Free-text dispute reason", constraints: "min length 10" }
      - { name: finding_ids, type: array, source: input, description: "Optional subset of ReportFinding ids being contested; empty/absent means whole report", constraints: "nullable" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at filing; must be <= report.delivered_at + 30 calendar days" }
      - { name: resolved_at, type: datetime, source: system, description: "Null until resolved", constraints: "nullable" }
      - { name: overdue, type: boolean, source: computed, default: false, description: "true when resolved_at > filed_at + 30 calendar days (late re-investigation is permitted but flagged)" }
      - { name: outcome, type: enum, source: system, description: "UPHELD | AMENDED | null until resolved", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "UNDER_REINVESTIGATION | RESOLVED_UPHELD | RESOLVED_AMENDED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ScreeningOrder
    initial_state: "fulfillment_status=DRAFT, adjudication_status=NOT_STARTED"
    terminal_states: ["fulfillment=CLOSED", "fulfillment=CANCELLED", "adjudication=CLEARED", "adjudication=FINAL_ADVERSE", "adjudication=VOIDED"]
    note: "Parallel dimensions: fulfillment_status and adjudication_status evolve independently; a dispute moves ONLY adjudication_status while fulfillment stays REPORT_RECEIVED."
    transitions:
      - from: "fulfillment=DRAFT"
        to: "fulfillment=CONSENT_CAPTURED"
        trigger: "POST /screening-orders/{id}/consents"
        actor: Candidate
        preconditions:
          - "fulfillment_status == DRAFT, or (CONSENT_CAPTURED with latest consent EXPIRED) (ERR_ORDER_NOT_OPEN)"
          - "Candidate X-User-ID == order.candidate_id (ERR_FORBIDDEN)"
          - "contains_extraneous_terms == false (ERR_DISCLOSURE_NOT_STANDALONE)"
          - "authorization_signed_at <= now (ERR_CONSENT_IN_FUTURE)"
        side_effects:
          - "ConsentRecord created status=CAPTURED"
          - "fulfillment_status -> CONSENT_CAPTURED"

      - from: "fulfillment=CONSENT_CAPTURED"
        to: "fulfillment=DISPATCHED"
        trigger: "POST /screening-orders/{id}/dispatch"
        actor: HiringManager
        preconditions:
          - "fulfillment_status == CONSENT_CAPTURED (ERR_ORDER_NOT_CONSENT_CAPTURED)"
          - "consent freshness: for INITIAL orders the order's latest ConsentRecord must be CAPTURED with now <= authorization_signed_at + 90 days (ERR_CONSENT_EXPIRED; stale consent flips to EXPIRED as side effect); for RESCREEN orders the check runs against the ORIGINAL order's latest consent via rescreen_of_order_id (consent is inherited — no new ConsentRecord is created for a RESCREEN order)"
          - "if order_type == RESCREEN: vendor_id != the original order's vendor_id (ERR_RESCREEN_SAME_VENDOR)"
          - "vendor_id body field references existing ScreeningVendor (ERR_NOT_FOUND)"
          - "vendor.status == ACTIVE (ERR_VENDOR_NOT_ACTIVE)"
          - "vendor.active_order_count < vendor.max_concurrent_orders (ERR_VENDOR_CAPACITY_EXCEEDED)"
          - "position.package.status == ACTIVE (ERR_PACKAGE_NOT_ACTIVE)"
        side_effects:
          - "vendor_id set; dispatched_at = now; sla_due_at computed (business window arithmetic)"
          - "pinned_package_id/version snapshot from position.package"
          - "provisional_fee_cents = package.fee_cents + vendor.surcharge_cents"
          - "vendor.active_order_count += 1"

      - from: "fulfillment=DISPATCHED"
        to: "fulfillment=REPORT_RECEIVED; adjudication=NOT_STARTED -> PENDING_REVIEW"
        trigger: "POST /screening-reports"
        actor: VendorAgent
        preconditions:
          - "order.fulfillment_status == DISPATCHED (ERR_ORDER_NOT_DISPATCHED)"
          - "VendorAgent X-User-ID == order.vendor_id (ERR_FORBIDDEN)"
          - "every finding.check_type in pinned package.check_types (ERR_FINDING_CHECK_TYPE_NOT_IN_PACKAGE)"
        side_effects:
          - "ScreeningReport created DELIVERED; delivered_at = now; turnaround_business_hours + sla_breached computed"
          - "vendor.active_order_count -= 1"
          - "if sla_breached: vendor.consecutive_sla_breaches += 1 else reset to 0; if breaches >= 3 and vendor ACTIVE: vendor -> PROBATION"
          - "final_fee_cents computed (0 for RESCREEN; provisional minus 10% SLA credit when breached, floor 0)"
          - "ReportFinding rows created; considerable + matched_action computed per finding against pinned jurisdiction rule + ACTIVE matrix for position.risk_tier"
          - "order.recommended_outcome = worst matched_action over considerable findings (precedence ADVERSE_ELIGIBLE > IA_REQUIRED > CLEAR); empty considerable set -> CLEAR"
          - "pinned_matrix_id/version frozen; order.fulfillment -> REPORT_RECEIVED; adjudication NOT_STARTED -> PENDING_REVIEW"

      - from: "adjudication=PENDING_REVIEW"
        to: "adjudication=CLEARED; fulfillment=REPORT_RECEIVED -> CLOSED"
        trigger: "POST /screening-orders/{id}/adjudication-decision decision=CLEAR_CANDIDATE"
        actor: Adjudicator
        preconditions:
          - "adjudication_status == PENDING_REVIEW (ERR_ORDER_ADJUDICATION_NOT_REVIEWABLE)"
        side_effects: ["fulfillment -> CLOSED"]

      - from: "adjudication=PENDING_REVIEW"
        to: "adjudication=PRE_ADVERSE_PENDING"
        trigger: "POST /screening-orders/{id}/adjudication-decision decision=INITIATE_ADVERSE"
        actor: Adjudicator
        preconditions:
          - "adjudication_status == PENDING_REVIEW (ERR_ORDER_ADJUDICATION_NOT_REVIEWABLE)"
          - "recommended_outcome != CLEAR (ERR_ADVERSE_NOT_RECOMMENDED)"
          - "if recommended_outcome == IA_REQUIRED OR jurisdiction.individualized_assessment_required: an IndividualizedAssessment on this order with status DECIDED and decision PROCEED_ADVERSE exists (ERR_IA_REQUIRED)"
        side_effects:
          - "adverse_initiated_by_user_id = X-User-ID"
          - "AdverseActionCase created 1:1: status WAITING_PERIOD, pre_notice_sent_at = now, wait_business_days_required = max(5, jurisdiction.pre_adverse_wait_business_days), earliest_final_notice_at computed"

      - from: "adjudication=PRE_ADVERSE_PENDING"
        to: "adjudication=FINAL_ADVERSE; fulfillment=REPORT_RECEIVED -> CLOSED"
        trigger: "POST /adverse-action-cases/{id}/send-final-notice"
        actor: ComplianceOfficer
        preconditions:
          - "case.status in {WAITING_PERIOD, ELIGIBLE_FOR_FINAL} (ERR_CASE_NOT_AWAITING_FINAL)"
          - "X-User-ID != case.initiated_by_user_id (ERR_SOD_ADVERSE_NOTICE_MISMATCH — business_safety, checked BEFORE the temporal gate)"
          - "now >= case.earliest_final_notice_at (ERR_ADVERSE_WAIT_NOT_ELAPSED)"
        side_effects:
          - "case -> FINAL_NOTICE_SENT; final_notice_sent_at = now; final_notice_issuer_user_id = X-User-ID"
          - "order adjudication -> FINAL_ADVERSE; fulfillment -> CLOSED"

      - from: "adjudication=PENDING_REVIEW | PRE_ADVERSE_PENDING"
        to: "adjudication=DISPUTE_HOLD"
        trigger: "POST /disputes"
        actor: Candidate
        preconditions:
          - "report exists for order with status in {DELIVERED, AMENDED} (ERR_REPORT_NOT_ACTIONABLE)"
          - "adjudication_status in {PENDING_REVIEW, PRE_ADVERSE_PENDING} (ERR_ORDER_ADJUDICATION_TERMINAL)"
          - "no other Dispute with status UNDER_REINVESTIGATION for this order (ERR_DISPUTE_ALREADY_OPEN)"
          - "now <= report.delivered_at + 30 days (ERR_DISPUTE_WINDOW_CLOSED)"
          - "Candidate X-User-ID == order.candidate_id (ERR_FORBIDDEN)"
        side_effects:
          - "Dispute created UNDER_REINVESTIGATION; filed_at = now"
          - "report -> DISPUTED"
          - "order adjudication -> DISPUTE_HOLD (fulfillment_status unchanged)"
          - "if AdverseActionCase exists with status in {WAITING_PERIOD, ELIGIBLE_FOR_FINAL}: case -> DISPUTE_HOLD, hold_started_at = now"

      - from: "adjudication=DISPUTE_HOLD"
        to: "adjudication=PENDING_REVIEW"
        trigger: "POST /disputes/{id}/resolve (system cascade from Dispute transition)"
        actor: system
        preconditions: []
        side_effects:
          - "UPHELD: report DISPUTED -> UPHELD; case (if DISPUTE_HOLD) -> WAITING_PERIOD with total_hold_business_days += business days in (hold_started_at date exclusive, resolved date inclusive]; earliest_final_notice_at recomputed"
          - "AMENDED: report DISPUTED -> AMENDED with findings replaced by corrected_findings; considerable/matched_action/recommended_outcome re-computed against PINNED matrix; case (if DISPUTE_HOLD) -> ABORTED (pre-adverse must restart on the amended report)"
          - "dispute.resolved_at = now; overdue = (resolved_at > filed_at + 30 days); status -> RESOLVED_UPHELD | RESOLVED_AMENDED"

      - from: "adjudication=DISPUTE_HOLD"
        to: "adjudication=PENDING_REVIEW"
        trigger: "POST /disputes/{id}/withdraw"
        actor: Candidate
        preconditions:
          - "dispute.status == UNDER_REINVESTIGATION (ERR_DISPUTE_NOT_OPEN)"
          - "Candidate X-User-ID == dispute.candidate_id (ERR_FORBIDDEN)"
        side_effects:
          - "dispute -> WITHDRAWN; report DISPUTED -> DELIVERED"
          - "case (if DISPUTE_HOLD) -> WAITING_PERIOD with hold extension as in resolve-UPHELD"

      - from: "fulfillment in {DRAFT, CONSENT_CAPTURED, DISPATCHED}"
        to: "fulfillment=CANCELLED; adjudication -> VOIDED"
        trigger: "POST /screening-orders/{id}/cancel"
        actor: HiringManager
        preconditions:
          - "fulfillment_status in {DRAFT, CONSENT_CAPTURED, DISPATCHED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "if DISPATCHED: vendor.active_order_count -= 1; provisional_fee_cents -> null (fee voided)"
          - "cascade: non-terminal AdverseActionCase -> ABORTED; DECIDED IndividualizedAssessment -> VOID; adjudication_status -> VOIDED"

      - from: "fulfillment NOT IN {CLOSED, CANCELLED} (any non-terminal fulfillment, including REPORT_RECEIVED)"
        to: "fulfillment=CANCELLED; adjudication -> VOIDED"
        trigger: "POST /consents/{id}/revoke (system cascade from ConsentRecord transition) or POST /candidates/{id}/withdraw (per-order cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "identical compensation + cascade as order cancel: if DISPATCHED, vendor.active_order_count -= 1 and provisional_fee_cents -> null; non-terminal AdverseActionCase -> ABORTED; DECIDED IndividualizedAssessment -> VOID; adjudication_status -> VOIDED"

  - entity: ConsentRecord
    initial_state: CAPTURED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: CAPTURED
        to: REVOKED
        trigger: "POST /consents/{id}/revoke"
        actor: Candidate
        preconditions:
          - "status == CAPTURED (ERR_CONSENT_NOT_ACTIVE)"
          - "Candidate X-User-ID == order.candidate_id (ERR_FORBIDDEN)"
        side_effects:
          - "cascade: order -> CANCELLED with full compensation chain (capacity, fee, case ABORTED, IA VOID)"
      - from: CAPTURED
        to: EXPIRED
        trigger: "system (lazy: evaluated when POST .../dispatch finds now > authorization_signed_at + 90 days)"
        actor: system
        preconditions: ["now > authorization_signed_at + 90 days"]
        side_effects: ["dispatch rejected ERR_CONSENT_EXPIRED; order stays CONSENT_CAPTURED and may capture a fresh consent"]

  - entity: ScreeningReport
    initial_state: DELIVERED
    terminal_states: [UPHELD, AMENDED]
    note: "Cyclic: AMENDED -> DISPUTED is allowed (a candidate may dispute an amended report once more); DELIVERED is re-entered on dispute withdraw."
    transitions:
      - from: DELIVERED
        to: DISPUTED
        trigger: "POST /disputes"
        actor: Candidate
        preconditions: ["see ScreeningOrder dispute transition"]
        side_effects: []
      - from: AMENDED
        to: DISPUTED
        trigger: "POST /disputes"
        actor: Candidate
        preconditions: ["see ScreeningOrder dispute transition"]
        side_effects: []
      - from: DISPUTED
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve outcome=UPHELD"
        actor: VendorAgent
        preconditions:
          - "dispute.status == UNDER_REINVESTIGATION (ERR_DISPUTE_NOT_OPEN)"
          - "VendorAgent X-User-ID == report.vendor_id (ERR_FORBIDDEN)"
        side_effects: ["order adjudication DISPUTE_HOLD -> PENDING_REVIEW; case hold extension"]
      - from: DISPUTED
        to: AMENDED
        trigger: "POST /disputes/{id}/resolve outcome=AMENDED"
        actor: VendorAgent
        preconditions:
          - "dispute.status == UNDER_REINVESTIGATION (ERR_DISPUTE_NOT_OPEN)"
          - "VendorAgent X-User-ID == report.vendor_id (ERR_FORBIDDEN)"
          - "corrected_findings present and non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["findings replaced; re-eval against pinned matrix; case -> ABORTED"]
      - from: DISPUTED
        to: DELIVERED
        trigger: "POST /disputes/{id}/withdraw"
        actor: Candidate
        preconditions: ["dispute UNDER_REINVESTIGATION; owner"]
        side_effects: []

  - entity: AdverseActionCase
    initial_state: WAITING_PERIOD
    terminal_states: [FINAL_NOTICE_SENT, ABORTED]
    note: "Cyclic: WAITING_PERIOD -> DISPUTE_HOLD -> WAITING_PERIOD, with deadline extension per hold."
    transitions:
      - from: WAITING_PERIOD
        to: ELIGIBLE_FOR_FINAL
        trigger: "system (lazy: evaluated on read/transition when now >= earliest_final_notice_at)"
        actor: system
        preconditions: ["now >= earliest_final_notice_at"]
        side_effects: []
      - from: "WAITING_PERIOD | ELIGIBLE_FOR_FINAL"
        to: FINAL_NOTICE_SENT
        trigger: "POST /adverse-action-cases/{id}/send-final-notice"
        actor: ComplianceOfficer
        preconditions: ["SoD: X-User-ID != initiated_by_user_id", "now >= earliest_final_notice_at"]
        side_effects: ["order adjudication -> FINAL_ADVERSE; fulfillment -> CLOSED"]
      - from: "WAITING_PERIOD | ELIGIBLE_FOR_FINAL"
        to: DISPUTE_HOLD
        trigger: "system cascade (dispute filed on the order)"
        actor: system
        preconditions: []
        side_effects: ["hold_started_at = now"]
      - from: DISPUTE_HOLD
        to: WAITING_PERIOD
        trigger: "system cascade (dispute RESOLVED_UPHELD or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: ["total_hold_business_days += hold business days; earliest_final_notice_at recomputed; hold_started_at -> null"]
      - from: "WAITING_PERIOD | ELIGIBLE_FOR_FINAL | DISPUTE_HOLD"
        to: ABORTED
        trigger: "POST /adverse-action-cases/{id}/abort OR system cascade (order cancel / consent revoke / report AMENDED)"
        actor: ComplianceOfficer | system
        preconditions: ["manual abort: status in {WAITING_PERIOD, ELIGIBLE_FOR_FINAL} (ERR_CASE_NOT_AWAITING_FINAL)"]
        side_effects: ["manual abort: order adjudication PRE_ADVERSE_PENDING -> PENDING_REVIEW"]

  - entity: Dispute
    initial_state: UNDER_REINVESTIGATION
    terminal_states: [RESOLVED_UPHELD, RESOLVED_AMENDED, WITHDRAWN]
    transitions:
      - from: UNDER_REINVESTIGATION
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve outcome=UPHELD"
        actor: VendorAgent
        preconditions: ["status == UNDER_REINVESTIGATION (ERR_DISPUTE_NOT_OPEN)", "vendor ownership (ERR_FORBIDDEN)"]
        side_effects: ["see ScreeningOrder DISPUTE_HOLD -> PENDING_REVIEW cascade"]
      - from: UNDER_REINVESTIGATION
        to: RESOLVED_AMENDED
        trigger: "POST /disputes/{id}/resolve outcome=AMENDED"
        actor: VendorAgent
        preconditions: ["status == UNDER_REINVESTIGATION (ERR_DISPUTE_NOT_OPEN)", "vendor ownership (ERR_FORBIDDEN)", "corrected_findings non-empty"]
        side_effects: ["see ScreeningOrder DISPUTE_HOLD -> PENDING_REVIEW cascade (amended path)"]
      - from: UNDER_REINVESTIGATION
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Candidate
        preconditions: ["status == UNDER_REINVESTIGATION (ERR_DISPUTE_NOT_OPEN)", "candidate ownership (ERR_FORBIDDEN)"]
        side_effects: ["report -> DELIVERED; adjudication -> PENDING_REVIEW; case hold extension"]

  - entity: ScreeningVendor
    initial_state: ACTIVE
    terminal_states: [DECERTIFIED]
    note: "Cyclic ACTIVE -> SUSPENDED -> ACTIVE and ACTIVE -> PROBATION -> ACTIVE."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendors/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: ["status == ACTIVE (ERR_VENDOR_NOT_ACTIVE)"]
        side_effects: ["in-flight DISPATCHED orders are NOT cancelled; new dispatch blocked"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vendors/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: ["status in {SUSPENDED, PROBATION} (ERR_VENDOR_NOT_SUSPENDED_OR_PROBATION)"]
        side_effects: []
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /vendors/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: ["status in {SUSPENDED, PROBATION} (ERR_VENDOR_NOT_SUSPENDED_OR_PROBATION)"]
        side_effects: []
      - from: ACTIVE
        to: PROBATION
        trigger: "system (audit finalize with mismatch_rate_bps > 200, or consecutive_sla_breaches reaches 3)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: DECERTIFIED
        trigger: "system (a second audit finalized with mismatch_rate_bps > 200 while already PROBATION)"
        actor: system
        preconditions: []
        side_effects: ["cascade: all orders with fulfillment_status == DISPATCHED for this vendor -> CANCELLED (capacity -1 each, provisional fees voided, cases ABORTED, IAs VOID)"]

  - entity: ScreeningPackage
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /screening-packages/{id}/activate"
        actor: HRAdmin
        preconditions: ["status == DRAFT (ERR_PACKAGE_NOT_DRAFT)"]
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /screening-packages/{id}/retire"
        actor: HRAdmin
        preconditions:
          - "status == ACTIVE (ERR_PACKAGE_NOT_ACTIVE)"
          - "no ScreeningOrder with fulfillment_status NOT IN {CLOSED, CANCELLED} whose pinned_package_id or position.package_id == this package (ERR_PACKAGE_IN_USE)"
        side_effects: []

  - entity: JurisdictionRule
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /jurisdiction-rules/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT (ERR_RULE_NOT_DRAFT)"
          - "no other ACTIVE rule with same jurisdiction_code (ERR_JURISDICTION_RULE_ALREADY_ACTIVE)"
        side_effects: []

  - entity: AdjudicationMatrix
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /adjudication-matrices/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT (ERR_MATRIX_NOT_DRAFT)"
          - "no other ACTIVE matrix with same risk_tier (ERR_MATRIX_ALREADY_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /adjudication-matrices/{id}/retire"
        actor: ComplianceOfficer
        preconditions: ["status == ACTIVE (ERR_MATRIX_NOT_ACTIVE)"]
        side_effects: ["orders that already pinned this matrix keep their pinned evaluation; future deliveries require a new ACTIVE matrix for the tier (ERR_MATRIX_NOT_ACTIVE)"]

  - entity: IndividualizedAssessment
    initial_state: DECIDED
    terminal_states: [VOID]
    transitions:
      - from: DECIDED
        to: VOID
        trigger: "system cascade (order cancelled or consent revoked after decision)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: VendorAccuracyAudit
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /vendor-accuracy-audits/{id}/finalize"
        actor: Auditor
        preconditions: ["status == DRAFT (ERR_AUDIT_NOT_DRAFT)"]
        side_effects:
          - "vendor.accuracy_bps_finalized recomputed (pooled over FINALIZED audits)"
          - "if mismatch_rate_bps > 200: vendor ACTIVE -> PROBATION, or PROBATION -> DECERTIFIED (+ in-flight cancel cascade); SUSPENDED unchanged"
          - "if mismatch_rate_bps > 200: re-screen sweep — for every ScreeningReport with vendor_id == audit.vendor_id, delivered_at inside CLOSED [period_start, period_end], status == DELIVERED, order.fulfillment_status == REPORT_RECEIVED, order.recommended_outcome IN {IA_REQUIRED, ADVERSE_ELIGIBLE}: create a ScreeningOrder (order_type RESCREEN, rescreen_of_order_id = order.id, same candidate_id/position_id, fulfillment CONSENT_CAPTURED) ordered by report.delivered_at ASC, tie-break report.created_at ASC; rescreen_order_ids collects them in creation order"

  - entity: Candidate
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /candidates/{id}/withdraw"
        actor: Candidate
        preconditions: ["status == ACTIVE (ERR_CANDIDATE_NOT_ACTIVE)", "Candidate X-User-ID == candidate id (ERR_FORBIDDEN)"]
        side_effects: ["cascade: every non-terminal ScreeningOrder (fulfillment NOT IN {CLOSED, CANCELLED}) -> CANCELLED with the standard compensation chain"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: package-update-stale-version
    parent_entity: ScreeningPackage
    write_endpoint: "PUT /screening-packages/{id}"
    occ_field: expected_package_version
    description: |
      Updating a DRAFT ScreeningPackage whose version has advanced since the
      client last observed it is rejected. The client's edits were computed
      against a stale package definition (fee/tat/check list), so the server
      refuses to silently overwrite the newer state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: jurisdiction-rule-patch-stale-version
    parent_entity: JurisdictionRule
    write_endpoint: "PATCH /jurisdiction-rules/{id}"
    occ_field: expected_jurisdiction_rule_version
    description: |
      Patching a DRAFT JurisdictionRule whose version has advanced since the
      client last observed it is rejected. Lookback/wait-day edits against a
      stale rule would silently drop the intervening compliance change.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: business_hours_between
    trigger: "report delivery (turnaround), escalation eligibility, any SLA read"
    algorithm: interval_merge
    formula: |
      Sum overlap of [start, end] with business windows: for each UTC calendar
      day d from date(start) to date(end) inclusive, if weekday(d) in {Mon..Fri}
      add overlap_seconds([start,end], [d 09:00:00Z, d 17:00:00Z]) / 3600.
      Result in hours, 2 decimal places, round_half_up.
      Weekend/holiday-free: Sat+Sun contribute 0.
    input_set: "the two instants; nothing state-dependent"
    precision: "2 decimal places, round_half_up"

  - name: sla_due_at
    trigger: "order dispatch"
    algorithm: chronological
    formula: |
      remaining = package.tat_business_hours (hours); cursor = dispatched_at.
      Walk forward day by day: within each business day, the window is
      [09:00:00Z, 17:00:00Z]; time outside windows is skipped (dispatch on Sat
      -> counting begins Mon 09:00Z). sla_due_at = the instant at which
      `remaining` business hours have elapsed. Exact boundary: delivery at
      exactly sla_due_at is ON TIME (breach requires turnaround > tat).
    input_set: "dispatched_at, package.tat_business_hours"
    precision: "second precision on the resulting instant"

  - name: sla_evaluation
    trigger: "report delivery"
    algorithm: threshold
    formula: |
      turnaround = business_hours_between(dispatched_at, delivered_at)
      sla_breached = turnaround > tat_business_hours        # strict >; equality is on time
      if sla_breached: vendor.consecutive_sla_breaches += 1
      else: vendor.consecutive_sla_breaches = 0
      if vendor.consecutive_sla_breaches >= 3 and vendor.status == ACTIVE:
          vendor.status = PROBATION                          # boundary: 3rd consecutive breach
    input_set: "the delivering order + its vendor"
    constants:
      BREACH_PROBATION_THRESHOLD: 3
    precision: "2 decimal places on turnaround, round_half_up"

  - name: business_day_add
    trigger: "adverse case creation, hold-close recompute"
    algorithm: chronological
    formula: |
      business_day_add(dt, n): d = date(dt); count = 0
      while count < n: d += 1 day; if weekday(d) in {Mon..Fri}: count += 1
      return d at 00:00:00Z
      Send day is EXCLUDED from the count; the Nth following business day at
      00:00:00Z is the earliest legal final-notice instant.
    input_set: "pre_notice_sent_at, wait_business_days_required + total_hold_business_days"
    precision: "date granularity; result pinned to 00:00:00Z"

  - name: adverse_wait_requirement
    trigger: "adverse case creation; recomputed when a DISPUTE_HOLD closes (UPHELD or WITHDRAWN)"
    algorithm: constraint_propagation
    formula: |
      wait_business_days_required = max(5, jurisdiction.pre_adverse_wait_business_days)
      hold_business_days = business days in (date(hold_started_at) exclusive,
                             date(hold closed at) inclusive], counted as in business_day_add
      total_hold_business_days = sum over all closed holds
      earliest_final_notice_at = business_day_add(pre_notice_sent_at,
                                  wait_business_days_required + total_hold_business_days)
      Evaluation order is pinned: (1) compute hold_business_days from stored
      timestamps; (2) add to the base wait; (3) recompute the deadline from
      pre_notice_sent_at. business_day_add is compositional, so step (3) equals
      shifting the prior deadline by hold_business_days.
    constants:
      FCRA_BASE_WAIT_BUSINESS_DAYS: 5
    precision: "date granularity"

  - name: finding_considerability
    trigger: "report delivery; re-evaluated on report AMENDED (pinned matrix, CURRENT active jurisdiction rule of position.jurisdiction_code)"
    algorithm: constraint_propagation
    formula: |
      cutoff_date = date(delivered_at) minus jurisdiction.lookback_years_limit years
      salary_exempt = (jurisdiction.lookback_exemption_salary_cents > 0
                       and position.annual_salary_cents >= jurisdiction.lookback_exemption_salary_cents)
      considerable = false if disposition == ARREST_ONLY and jurisdiction.arrest_records_considerable == false
      considerable = false if disposition == CONVICTION and not salary_exempt
                     and offense_date < cutoff_date          # strict <: offense exactly ON cutoff stays considerable
      otherwise considerable = true
    input_set: "findings of the report x ACTIVE JurisdictionRule of the position x position salary"
    precision: "date granularity; year subtraction by calendar anniversary"

  - name: adjudication_outcome
    trigger: "report delivery; re-evaluated on report AMENDED against the PINNED matrix (pinned_matrix_id/version), never against a newer ACTIVE matrix"
    algorithm: weighted_scoring
    formula: |
      recency_years(f) = full calendar years between date(f.offense_date) and date(delivered_at) (anniversary method)
      for each finding f where considerable == true:
          matched_action(f) = action of the FIRST rule r in pinned_matrix.rules (declared array order)
                              such that r.offense_category == f.offense_category
                              and severity_rank(f.severity) >= severity_rank(r.min_severity)   # LOW<MEDIUM<HIGH
                              and recency_years(f) <= r.max_recency_years
          if no rule matches: matched_action(f) = CLEAR
      recommended_outcome = worst matched_action by precedence ADVERSE_ELIGIBLE > IA_REQUIRED > CLEAR;
                            CLEAR when the considerable set is empty.
    input_set: "considerable findings only; non-considerable findings never influence the outcome"
    precision: "deterministic; array order is significant"

  - name: order_fee_cents
    trigger: "provisional variant at dispatch; final variant at report delivery"
    algorithm: tiered_pricing
    formula: |
      provisional_fee_cents = pinned_package.fee_cents + vendor.surcharge_cents      # at dispatch
      final_fee_cents       = 0                                          if order_type == RESCREEN
                            = provisional_fee_cents - floor(provisional_fee_cents * 10 / 100)
                                                                             if sla_breached
                            = provisional_fee_cents                        otherwise
      floor at 0. Cancel while DISPATCHED voids provisional_fee_cents to null.
    input_set: "the order, its pinned package, its vendor"
    constants:
      SLA_CREDIT_PCT: 10
    precision: "integer cents; SLA credit uses floor before subtraction"
    variants:
      - name: provisional_at_dispatch
        when: "between dispatch and delivery (and on any read before delivery)"
        difference: "no SLA credit can be known yet; full provisional amount is exposed"
      - name: final_at_delivery
        when: "at report delivery"
        difference: "applies the 10% SLA credit when sla_breached and zeroes the fee for RESCREEN orders; identical inputs (breach=true) therefore yield final < provisional"

  - name: vendor_accuracy_bps
    trigger: "audit creation (draft variant), audit finalize (finalized variant), vendor read"
    algorithm: aggregation
    formula: |
      POOLED-THEN-ROUNDED (pinned order — per-audit rounding then averaging is FORBIDDEN
      because it yields different bps):
        finalized variant:   over audits with status == FINALIZED for the vendor
        provisional variant: over audits with status IN {DRAFT, FINALIZED}
        accuracy_bps = round_half_up(10000 * (1 - sum(mismatches_found) / sum(sample_size)))
        When the variant's audit set is empty: 10000.
    input_set: "VendorAccuracyAudit rows for the vendor, filtered by status per variant"
    precision: "integer basis points, single round_half_up after pooling"
    variants:
      - name: finalized_only
        when: "default vendor view; probation/decertification decisions use only this variant"
        difference: "DRAFT audits excluded; ignores un-finalized evidence"
      - name: including_draft
        when: "provisional exposure on vendor reads"
        difference: "DRAFT audits pooled in; identical underlying rows yield a different bps whenever a DRAFT audit exists"

  - name: audit_fail_evaluation
    trigger: "audit finalize"
    algorithm: threshold
    formula: |
      fail = mismatch_rate_bps > 200          # strict >; exactly 200 bps passes
      if fail and vendor.status == ACTIVE:    vendor -> PROBATION
      if fail and vendor.status == PROBATION: vendor -> DECERTIFIED (+ in-flight cancel cascade)
      if fail: run the re-screen sweep (see state machine side effects)
    constants:
      FAIL_THRESHOLD_BPS: 200
    precision: "integer bps"

  - name: rescreen_sweep
    trigger: "audit finalize when fail == true"
    algorithm: aggregation
    formula: |
      candidates = ScreeningReport r where
          r.vendor_id == audit.vendor_id
          and r.status == DELIVERED
          and r.delivered_at >= audit.period_start AND r.delivered_at <= audit.period_end   # CLOSED interval
          and r.order.fulfillment_status == REPORT_RECEIVED
          and r.order.recommended_outcome IN {IA_REQUIRED, ADVERSE_ELIGIBLE}
      order of creation: sort by r.delivered_at ASC, tie-break r.created_at ASC (never id)
      for each: create ScreeningOrder(order_type=RESCREEN, rescreen_of_order_id=r.order_id,
                candidate_id, position_id copied, fulfillment_status=CONSENT_CAPTURED)
    input_set: "all reports of the vendor in the closed audit window, status-filtered as above"
    precision: "deterministic ordering"

  - name: active_order_count
    trigger: "dispatch (+1), report delivery (-1), cancel/consent-revoke/decertify cascade (-1 when DISPATCHED)"
    algorithm: aggregation
    formula: |
      vendor.active_order_count == count of ScreeningOrders with
      fulfillment_status == DISPATCHED and vendor_id == vendor.id, at all times.
    input_set: "ScreeningOrder rows for the vendor with fulfillment_status == DISPATCHED"
    precision: "integer; invariant must hold after every mutation"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role recognized", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 2.5, category: auth, check: "Entity-backed ownership: Candidate X-User-ID == order.candidate_id (consent capture/revoke, dispute file/withdraw, candidate withdraw); VendorAgent X-User-ID == order.vendor_id (report submit) or == report.vendor_id (dispute resolve)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "ownership-scoped endpoints" }
  - { priority: 3, category: existence, check: "Path and body resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 3.5, category: business_constraint, check: "OCC: expected_<parent>_version equals current parent version (when the endpoint declares it)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /screening-packages/{id}, PATCH /jurisdiction-rules/{id}" }
  - { priority: 3.8, category: business_constraint, check: "Request shape: required fields present, enum members valid, mismatches_found <= sample_size, period_end > period_start, corrected_findings non-empty when outcome == AMENDED, check_types non-empty", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutation endpoints" }
  - { priority: 4, category: state, check: "Target entity in required state for the operation (order/package/rule/matrix/audit/case/dispute/consent/report/candidate state preconditions per §1.2)", error_id: "ERR_*_NOT_* family (ERR_ORDER_NOT_OPEN, ERR_ORDER_NOT_CONSENT_CAPTURED, ERR_ORDER_NOT_DISPATCHED, ERR_ORDER_NOT_CANCELLABLE, ERR_ORDER_ADJUDICATION_NOT_REVIEWABLE, ERR_ORDER_ADJUDICATION_TERMINAL, ERR_PACKAGE_NOT_DRAFT, ERR_PACKAGE_NOT_ACTIVE, ERR_RULE_NOT_DRAFT, ERR_MATRIX_NOT_DRAFT, ERR_MATRIX_NOT_ACTIVE, ERR_AUDIT_NOT_DRAFT, ERR_CASE_NOT_AWAITING_FINAL, ERR_DISPUTE_NOT_OPEN, ERR_CONSENT_NOT_ACTIVE, ERR_CANDIDATE_NOT_ACTIVE)", http_status: 409, applies_to: "state-gated endpoints" }
  - { priority: 5, category: business_safety, check: "Ban-the-box gate: at order creation, when the position's ACTIVE jurisdiction rule has screening_gate_stage == POST_CONDITIONAL_OFFER, conditional_offer_extended_at is required and must be <= now", error_id: ERR_BAN_THE_BOX_GATE, http_status: 403, applies_to: "POST /screening-orders" }
  - { priority: 5.1, category: business_safety, check: "Standalone disclosure: contains_extraneous_terms must be false (FCRA standalone document)", error_id: ERR_DISCLOSURE_NOT_STANDALONE, http_status: 422, applies_to: "POST /screening-orders/{id}/consents" }
  - { priority: 5.2, category: business_safety, check: "Consent not signed in the future: authorization_signed_at <= now", error_id: ERR_CONSENT_IN_FUTURE, http_status: 422, applies_to: "POST /screening-orders/{id}/consents" }
  - { priority: 5.3, category: business_safety, check: "Credit-check prohibition: jurisdiction rule credit_check_allowed == false forbids packages containing CREDIT_CHECK", error_id: ERR_CREDIT_CHECK_PROHIBITED, http_status: 422, applies_to: "POST /positions" }
  - { priority: 5.4, category: business_safety, check: "Segregation of duties: final adverse notice issuer X-User-ID != case.initiated_by_user_id", error_id: ERR_SOD_ADVERSE_NOTICE_MISMATCH, http_status: 403, applies_to: "POST /adverse-action-cases/{id}/send-final-notice" }
  - { priority: 5.5, category: business_safety, check: "Adverse path gating: INITIATE_ADVERSE requires recommended_outcome != CLEAR", error_id: ERR_ADVERSE_NOT_RECOMMENDED, http_status: 409, applies_to: "POST /screening-orders/{id}/adjudication-decision" }
  - { priority: 5.6, category: business_safety, check: "Individualized assessment required: INITIATE_ADVERSE when recommended_outcome == IA_REQUIRED or jurisdiction.individualized_assessment_required requires a DECIDED IA with decision == PROCEED_ADVERSE", error_id: ERR_IA_REQUIRED, http_status: 409, applies_to: "POST /screening-orders/{id}/adjudication-decision" }
  - { priority: 6, category: business_constraint, check: "Uniqueness: one ACTIVE JurisdictionRule per jurisdiction_code; one ACTIVE AdjudicationMatrix per risk_tier; one non-terminal INITIAL ScreeningOrder per (candidate_id, position_id); one UNDER_REINVESTIGATION Dispute per order; candidate email unique", error_id: "ERR_JURISDICTION_RULE_ALREADY_ACTIVE | ERR_MATRIX_ALREADY_ACTIVE | ERR_DUPLICATE_ACTIVE_ORDER | ERR_DISPUTE_ALREADY_OPEN | ERR_INVALID_REQUEST", http_status: 409, applies_to: "creation/activation endpoints" }
  - { priority: 6.5, category: business_constraint, check: "Audit periods for the same vendor must not overlap: new [period_start, period_end) intersects any existing audit iff new.start < existing.end AND new.end > existing.start (adjacency end == start is ALLOWED)", error_id: ERR_AUDIT_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /vendor-accuracy-audits" }
  - { priority: 6.6, category: business_constraint, check: "RESCREEN orders must be dispatched to a different vendor than the original order's vendor", error_id: ERR_RESCREEN_SAME_VENDOR, http_status: 422, applies_to: "POST /screening-orders/{id}/dispatch" }
  - { priority: 7, category: business_temporal, check: "Consent freshness at dispatch: now <= authorization_signed_at + 90 days", error_id: ERR_CONSENT_EXPIRED, http_status: 409, applies_to: "POST /screening-orders/{id}/dispatch" }
  - { priority: 7.1, category: business_temporal, check: "Dispute window: now <= report.delivered_at + 30 calendar days", error_id: ERR_DISPUTE_WINDOW_CLOSED, http_status: 409, applies_to: "POST /disputes" }
  - { priority: 7.2, category: business_temporal, check: "Adverse waiting period: now >= case.earliest_final_notice_at (checked AFTER the SoD gate at priority 5.4)", error_id: ERR_ADVERSE_WAIT_NOT_ELAPSED, http_status: 409, applies_to: "POST /adverse-action-cases/{id}/send-final-notice" }
  - { priority: 7.3, category: business_temporal, check: "Escalation requires now > order.sla_due_at", error_id: ERR_SLA_NOT_BREACHED, http_status: 409, applies_to: "POST /screening-orders/{id}/escalate" }
  - { priority: 8, category: business_referential, check: "Package retire blocked while referenced by non-terminal orders", error_id: ERR_PACKAGE_IN_USE, http_status: 409, applies_to: "POST /screening-packages/{id}/retire" }
  - { priority: 8.1, category: business_referential, check: "Position creation requires package exists + ACTIVE and ACTIVE jurisdiction rule for jurisdiction_code", error_id: "ERR_NOT_FOUND | ERR_PACKAGE_NOT_ACTIVE | ERR_JURISDICTION_RULE_NOT_ACTIVE", http_status: 422, applies_to: "POST /positions" }
  - { priority: 8.2, category: business_referential, check: "Order creation requires candidate ACTIVE and position exists", error_id: "ERR_CANDIDATE_NOT_ACTIVE | ERR_NOT_FOUND", http_status: 409, applies_to: "POST /screening-orders" }
  - { priority: 8.3, category: business_referential, check: "Finding check_type must be an element of the pinned package's check_types", error_id: ERR_FINDING_CHECK_TYPE_NOT_IN_PACKAGE, http_status: 422, applies_to: "POST /screening-reports" }
  - { priority: 8.4, category: business_referential, check: "Dispatch requires the position's package still ACTIVE (snapshot happens at dispatch)", error_id: ERR_PACKAGE_NOT_ACTIVE, http_status: 409, applies_to: "POST /screening-orders/{id}/dispatch" }
  - { priority: 9, category: business_fiscal, check: "Vendor capacity: vendor.active_order_count < vendor.max_concurrent_orders at dispatch", error_id: ERR_VENDOR_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /screening-orders/{id}/dispatch" }
  - { priority: 9.1, category: business_fiscal, check: "Vendor must be ACTIVE to accept dispatch", error_id: ERR_VENDOR_NOT_ACTIVE, http_status: 409, applies_to: "POST /screening-orders/{id}/dispatch" }

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [HRAdmin, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["all time-derived rules (SLA, consent freshness, dispute window, adverse wait) read this clock"]

  # --- ScreeningVendor ---
  - { method: POST, path: "/vendors", description: "Register a screening vendor", roles: [HRAdmin], code: 201, input: [name, base_tat_business_hours, max_concurrent_orders, "surcharge_cents?"], output: ScreeningVendor, side_effects: ["status = ACTIVE; counters 0; accuracy variants 10000"] }
  - { method: GET, path: "/vendors/{id}", description: "Get a vendor (includes computed counters + both accuracy variants)", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: ScreeningVendor, side_effects: [] }
  - { method: POST, path: "/vendors/{id}/suspend", description: "Suspend a vendor (blocks new dispatch; in-flight orders continue)", roles: [ComplianceOfficer], code: 200, input: [], output: ScreeningVendor, side_effects: ["status ACTIVE -> SUSPENDED"] }
  - { method: POST, path: "/vendors/{id}/reinstate", description: "Reinstate a SUSPENDED or PROBATION vendor to ACTIVE", roles: [ComplianceOfficer], code: 200, input: [], output: ScreeningVendor, side_effects: ["status -> ACTIVE"] }

  # --- VendorAccuracyAudit ---
  - { method: POST, path: "/vendor-accuracy-audits", description: "Open an accuracy audit (DRAFT) for a vendor over a half-open period", roles: [Auditor], code: 201, input: [vendor_id, period_start, period_end, sample_size, mismatches_found], output: VendorAccuracyAudit, side_effects: ["mismatch_rate_bps computed; overlap with existing audits of the same vendor rejected; vendor.accuracy_bps_including_draft recomputed"] }
  - { method: GET, path: "/vendor-accuracy-audits", description: "List audits (filterable by vendor)", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: ["vendor_id?", "limit?", "offset?"], output: "VendorAccuracyAudit[]", side_effects: [] }
  - { method: GET, path: "/vendor-accuracy-audits/{id}", description: "Get one audit", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: VendorAccuracyAudit, side_effects: [] }
  - { method: POST, path: "/vendor-accuracy-audits/{id}/finalize", description: "Finalize an audit: recompute finalized accuracy, apply probation/decertification, run the re-screen sweep when failed", roles: [Auditor], code: 200, input: [], output: VendorAccuracyAudit, side_effects: ["status -> FINALIZED; per audit_fail_evaluation + rescreen_sweep"] }

  # --- ScreeningPackage ---
  - { method: POST, path: "/screening-packages", description: "Create a screening package (DRAFT)", roles: [HRAdmin], code: 201, input: [name, risk_tier, check_types, tat_business_hours, fee_cents], output: ScreeningPackage, side_effects: [] }
  - { method: GET, path: "/screening-packages/{id}", description: "Get a package", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: ScreeningPackage, side_effects: [] }
  - { method: PUT, path: "/screening-packages/{id}", description: "Update a DRAFT package (OCC-guarded)", roles: [HRAdmin], code: 200, input: ["name?", "check_types?", "tat_business_hours?", "fee_cents?", expected_package_version], output: ScreeningPackage, side_effects: ["increments ScreeningPackage.version by 1"] }
  - { method: POST, path: "/screening-packages/{id}/activate", description: "Activate a DRAFT package", roles: [HRAdmin], code: 200, input: [], output: ScreeningPackage, side_effects: ["status DRAFT -> ACTIVE"] }
  - { method: POST, path: "/screening-packages/{id}/retire", description: "Retire an ACTIVE package when no non-terminal orders reference it", roles: [HRAdmin], code: 200, input: [], output: ScreeningPackage, side_effects: ["status ACTIVE -> RETIRED"] }

  # --- JurisdictionRule ---
  - { method: POST, path: "/jurisdiction-rules", description: "Create a jurisdiction rule (DRAFT)", roles: [ComplianceOfficer], code: 201, input: [jurisdiction_code, screening_gate_stage, lookback_years_limit, arrest_records_considerable, lookback_exemption_salary_cents, pre_adverse_wait_business_days, individualized_assessment_required, credit_check_allowed], output: JurisdictionRule, side_effects: [] }
  - { method: GET, path: "/jurisdiction-rules/{id}", description: "Get a jurisdiction rule", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: JurisdictionRule, side_effects: [] }
  - { method: PATCH, path: "/jurisdiction-rules/{id}", description: "Patch a DRAFT jurisdiction rule (OCC-guarded)", roles: [ComplianceOfficer], code: 200, input: ["screening_gate_stage?", "lookback_years_limit?", "arrest_records_considerable?", "lookback_exemption_salary_cents?", "pre_adverse_wait_business_days?", "individualized_assessment_required?", "credit_check_allowed?", expected_jurisdiction_rule_version], output: JurisdictionRule, side_effects: ["increments JurisdictionRule.version by 1"] }
  - { method: POST, path: "/jurisdiction-rules/{id}/activate", description: "Activate a DRAFT rule; enforces one ACTIVE rule per jurisdiction_code", roles: [ComplianceOfficer], code: 200, input: [], output: JurisdictionRule, side_effects: ["status DRAFT -> ACTIVE"] }

  # --- AdjudicationMatrix ---
  - { method: POST, path: "/adjudication-matrices", description: "Create an adjudication matrix (DRAFT) for a risk tier", roles: [ComplianceOfficer], code: 201, input: [risk_tier, rules], output: AdjudicationMatrix, side_effects: [] }
  - { method: GET, path: "/adjudication-matrices/{id}", description: "Get a matrix", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: AdjudicationMatrix, side_effects: [] }
  - { method: POST, path: "/adjudication-matrices/{id}/activate", description: "Activate a DRAFT matrix; one ACTIVE matrix per risk_tier", roles: [ComplianceOfficer], code: 200, input: [], output: AdjudicationMatrix, side_effects: ["status DRAFT -> ACTIVE"] }
  - { method: POST, path: "/adjudication-matrices/{id}/retire", description: "Retire an ACTIVE matrix; pinned evaluations are unaffected", roles: [ComplianceOfficer], code: 200, input: [], output: AdjudicationMatrix, side_effects: ["status ACTIVE -> RETIRED"] }

  # --- Position ---
  - { method: POST, path: "/positions", description: "Create a position bound to an ACTIVE package + ACTIVE jurisdiction rule", roles: [HRAdmin], code: 201, input: [title, department, risk_tier, package_id, jurisdiction_code, annual_salary_cents], output: Position, side_effects: ["credit-check prohibition enforced"] }
  - { method: GET, path: "/positions", description: "List positions (filterable by package)", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: ["package_id?", "limit?", "offset?"], output: "Position[]", side_effects: [] }
  - { method: GET, path: "/positions/{id}", description: "Get a position", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: Position, side_effects: [] }

  # --- Candidate ---
  - { method: POST, path: "/candidates", description: "Register a candidate", roles: [HRAdmin], code: 201, input: [full_name, email, home_jurisdiction_code], output: Candidate, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/candidates/{id}", description: "Get a candidate", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: Candidate, side_effects: [] }
  - { method: POST, path: "/candidates/{id}/withdraw", description: "Candidate withdraws from the process; cascades cancellation of all non-terminal orders", roles: [Candidate], code: 200, input: [], output: Candidate, side_effects: ["status -> WITHDRAWN; per-order cancel cascade"] }

  # --- ScreeningOrder ---
  - { method: POST, path: "/screening-orders", description: "Create an INITIAL screening order (DRAFT); ban-the-box gate enforced", roles: [HiringManager], code: 201, input: [candidate_id, position_id, "conditional_offer_extended_at?"], output: ScreeningOrder, side_effects: ["fulfillment DRAFT; adjudication NOT_STARTED"] }
  - { method: GET, path: "/screening-orders", description: "List orders with filters", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: ["candidate_id?", "position_id?", "vendor_id?", "fulfillment_status?", "adjudication_status?", "rescreen_of_order_id?", "pinned_package_id?", "pinned_matrix_id?", "limit?", "offset?"], output: "ScreeningOrder[]", side_effects: [] }
  - { method: GET, path: "/screening-orders/{id}", description: "Get an order", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: ScreeningOrder, side_effects: [] }
  - { method: POST, path: "/screening-orders/{id}/consents", description: "Capture candidate consent + standalone disclosure for the order", roles: [Candidate], code: 201, input: [disclosure_form_id, contains_extraneous_terms, authorization_signed_at], output: ConsentRecord, side_effects: ["order fulfillment DRAFT -> CONSENT_CAPTURED"] }
  - { method: GET, path: "/screening-orders/{id}/consents", description: "List consent records of an order", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?"], output: "ConsentRecord[]", side_effects: [] }
  - { method: POST, path: "/screening-orders/{id}/dispatch", description: "Dispatch the order to a vendor; starts the SLA clock and pins the package", roles: [HiringManager], code: 200, input: [vendor_id], output: ScreeningOrder, side_effects: ["see §1.2 dispatch transition"] }
  - { method: POST, path: "/screening-orders/{id}/cancel", description: "Cancel a non-terminal order with full compensation", roles: [HiringManager], code: 200, input: [], output: ScreeningOrder, side_effects: ["see §1.2 cancel transition"] }
  - { method: POST, path: "/screening-orders/{id}/escalate", description: "Escalate a dispatched order past its SLA due instant", roles: [HiringManager, HRAdmin], code: 200, input: [], output: ScreeningOrder, side_effects: ["escalation_level += 1"] }
  - { method: POST, path: "/screening-orders/{id}/individualized-assessments", description: "Record an individualized assessment (EEOC Green factors) for the order", roles: [Adjudicator], code: 201, input: [green_factor_nature_gravity, green_factor_time_elapsed, green_factor_job_relatedness, evidence_considered, decision], output: IndividualizedAssessment, side_effects: ["if decision == CLEAR_CANDIDATE: order adjudication -> CLEARED, fulfillment -> CLOSED; PROCEED_ADVERSE leaves adjudication in PENDING_REVIEW"] }
  - { method: GET, path: "/screening-orders/{id}/individualized-assessments", description: "List individualized assessments of an order", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?"], output: "IndividualizedAssessment[]", side_effects: [] }
  - { method: POST, path: "/screening-orders/{id}/adjudication-decision", description: "Record the adjudication decision: CLEAR_CANDIDATE closes the order; INITIATE_ADVERSE creates the AdverseActionCase and sends the pre-adverse notice", roles: [Adjudicator], code: 200, input: [decision], output: ScreeningOrder, side_effects: ["see §1.2 adjudication transitions"] }

  # --- ConsentRecord (flat action) ---
  - { method: POST, path: "/consents/{id}/revoke", description: "Candidate revokes consent; cascades full order cancellation", roles: [Candidate], code: 200, input: [], output: ConsentRecord, side_effects: ["status -> REVOKED; order cancel cascade"] }

  # --- ScreeningReport ---
  - { method: POST, path: "/screening-reports", description: "Vendor delivers a report with findings for a dispatched order; computes SLA, fees, considerable flags, and recommended outcome", roles: [VendorAgent], code: 201, input: [order_id, findings], output: ScreeningReport, side_effects: ["see §1.2 delivery transition"] }
  - { method: GET, path: "/screening-reports", description: "List reports (filterable by order or vendor)", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: ["order_id?", "vendor_id?", "limit?", "offset?"], output: "ScreeningReport[]", side_effects: [] }
  - { method: GET, path: "/screening-reports/{id}", description: "Get a report", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: ScreeningReport, side_effects: [] }
  - { method: GET, path: "/screening-reports/{id}/findings", description: "List findings of a report (considerable + matched_action are computed)", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: ["limit?", "offset?"], output: "ReportFinding[]", side_effects: [] }

  # --- AdverseActionCase ---
  - { method: GET, path: "/adverse-action-cases", description: "List adverse action cases (filterable by order)", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: ["order_id?", "limit?", "offset?"], output: "AdverseActionCase[]", side_effects: [] }
  - { method: GET, path: "/adverse-action-cases/{id}", description: "Get a case", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: AdverseActionCase, side_effects: [] }
  - { method: POST, path: "/adverse-action-cases/{id}/send-final-notice", description: "Issue the final adverse action notice after the waiting period; segregation-of-duties enforced", roles: [ComplianceOfficer], code: 200, input: [], output: AdverseActionCase, side_effects: ["case -> FINAL_NOTICE_SENT; order adjudication -> FINAL_ADVERSE; fulfillment -> CLOSED"] }
  - { method: POST, path: "/adverse-action-cases/{id}/abort", description: "Abort a waiting case (returns the order to PENDING_REVIEW)", roles: [ComplianceOfficer], code: 200, input: [], output: AdverseActionCase, side_effects: ["case -> ABORTED; order adjudication PRE_ADVERSE_PENDING -> PENDING_REVIEW"] }

  # --- Dispute ---
  - { method: POST, path: "/disputes", description: "Candidate disputes report accuracy; freezes adjudication and any adverse waiting period", roles: [Candidate], code: 201, input: [order_id, reason, "finding_ids?"], output: Dispute, side_effects: ["see §1.2 dispute transition"] }
  - { method: GET, path: "/disputes", description: "List disputes (filterable)", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: ["order_id?", "candidate_id?", "status?", "limit?", "offset?"], output: "Dispute[]", side_effects: [] }
  - { method: GET, path: "/disputes/{id}", description: "Get a dispute", roles: [HRAdmin, HiringManager, Candidate, VendorAgent, Adjudicator, ComplianceOfficer, Auditor], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: POST, path: "/disputes/{id}/resolve", description: "Vendor completes the re-investigation: UPHELD resumes the process with a deadline extension; AMENDED replaces findings, re-evaluates, and aborts any adverse case", roles: [VendorAgent], code: 200, input: [outcome, "corrected_findings?"], output: Dispute, side_effects: ["see §1.2 resolve cascade"] }
  - { method: POST, path: "/disputes/{id}/withdraw", description: "Candidate withdraws the dispute; report returns to DELIVERED and any case resumes with extension", roles: [Candidate], code: 200, input: [], output: Dispute, side_effects: ["see §1.2 withdraw transition"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or entity-backed ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (path or body), checked left-to-right" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum member, mismatches_found > sample_size, period_end <= period_start, empty corrected_findings on AMENDED, duplicate candidate email" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_ORDER_NOT_OPEN, http: 409, condition: "Consent capture requires fulfillment DRAFT (or CONSENT_CAPTURED with latest consent EXPIRED)" }
  - { id: ERR_ORDER_NOT_CONSENT_CAPTURED, http: 409, condition: "Dispatch requires fulfillment_status == CONSENT_CAPTURED" }
  - { id: ERR_ORDER_NOT_DISPATCHED, http: 409, condition: "Report delivery requires fulfillment_status == DISPATCHED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires fulfillment in {DRAFT, CONSENT_CAPTURED, DISPATCHED}" }
  - { id: ERR_ORDER_ADJUDICATION_NOT_REVIEWABLE, http: 409, condition: "Adjudication decision / IA creation requires adjudication_status == PENDING_REVIEW" }
  - { id: ERR_ORDER_ADJUDICATION_TERMINAL, http: 409, condition: "Dispute filing requires adjudication_status in {PENDING_REVIEW, PRE_ADVERSE_PENDING}" }
  - { id: ERR_PACKAGE_NOT_DRAFT, http: 409, condition: "PUT/activate requires package DRAFT" }
  - { id: ERR_PACKAGE_NOT_ACTIVE, http: 409, condition: "Package must be ACTIVE (position creation, dispatch, retire precondition)" }
  - { id: ERR_PACKAGE_IN_USE, http: 409, condition: "Retire blocked: non-terminal orders reference this package" }
  - { id: ERR_RULE_NOT_DRAFT, http: 409, condition: "PATCH/activate requires jurisdiction rule DRAFT" }
  - { id: ERR_JURISDICTION_RULE_ALREADY_ACTIVE, http: 409, condition: "Another ACTIVE rule exists for this jurisdiction_code" }
  - { id: ERR_JURISDICTION_RULE_NOT_ACTIVE, http: 409, condition: "No ACTIVE jurisdiction rule exists for the position's jurisdiction_code" }
  - { id: ERR_MATRIX_NOT_DRAFT, http: 409, condition: "Activate requires matrix DRAFT" }
  - { id: ERR_MATRIX_NOT_ACTIVE, http: 409, condition: "Retire requires matrix ACTIVE; report delivery requires an ACTIVE matrix for the position's risk tier" }
  - { id: ERR_AUDIT_NOT_DRAFT, http: 409, condition: "Finalize requires audit DRAFT" }
  - { id: ERR_AUDIT_PERIOD_OVERLAP, http: 409, condition: "Audit period overlaps an existing audit for the same vendor (half-open semantics)" }
  - { id: ERR_CASE_NOT_AWAITING_FINAL, http: 409, condition: "Final notice / manual abort requires case in {WAITING_PERIOD, ELIGIBLE_FOR_FINAL}" }
  - { id: ERR_DISPUTE_NOT_OPEN, http: 409, condition: "Resolve/withdraw requires dispute UNDER_REINVESTIGATION" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "An UNDER_REINVESTIGATION dispute already exists for this order" }
  - { id: ERR_CONSENT_NOT_ACTIVE, http: 409, condition: "Revoke requires consent CAPTURED" }
  - { id: ERR_CANDIDATE_NOT_ACTIVE, http: 409, condition: "Candidate must be ACTIVE (order creation, withdraw precondition)" }
  - { id: ERR_VENDOR_NOT_ACTIVE, http: 409, condition: "Dispatch requires vendor ACTIVE; suspend requires ACTIVE" }
  - { id: ERR_VENDOR_NOT_SUSPENDED_OR_PROBATION, http: 409, condition: "Reinstate requires vendor SUSPENDED or PROBATION" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 409, condition: "vendor.active_order_count >= vendor.max_concurrent_orders at dispatch" }
  - { id: ERR_BAN_THE_BOX_GATE, http: 403, condition: "POST_CONDITIONAL_OFFER jurisdiction: conditional_offer_extended_at missing or in the future at order creation" }
  - { id: ERR_DISCLOSURE_NOT_STANDALONE, http: 422, condition: "contains_extraneous_terms == true violates the standalone disclosure requirement" }
  - { id: ERR_CONSENT_IN_FUTURE, http: 422, condition: "authorization_signed_at is after the current logical time" }
  - { id: ERR_CREDIT_CHECK_PROHIBITED, http: 422, condition: "Package contains CREDIT_CHECK but jurisdiction rule has credit_check_allowed == false" }
  - { id: ERR_SOD_ADVERSE_NOTICE_MISMATCH, http: 403, condition: "Final notice issuer equals the Adjudicator who initiated adverse action (segregation of duties)" }
  - { id: ERR_ADVERSE_NOT_RECOMMENDED, http: 409, condition: "INITIATE_ADVERSE while recommended_outcome == CLEAR" }
  - { id: ERR_IA_REQUIRED, http: 409, condition: "INITIATE_ADVERSE requires a DECIDED PROCEED_ADVERSE individualized assessment" }
  - { id: ERR_CONSENT_EXPIRED, http: 409, condition: "Dispatch after authorization_signed_at + 90 days" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "Dispute filed after report.delivered_at + 30 calendar days" }
  - { id: ERR_ADVERSE_WAIT_NOT_ELAPSED, http: 409, condition: "Final notice before earliest_final_notice_at" }
  - { id: ERR_SLA_NOT_BREACHED, http: 409, condition: "Escalation attempted while now <= sla_due_at" }
  - { id: ERR_RESCREEN_SAME_VENDOR, http: 422, condition: "RESCREEN order dispatched to the original (audited) vendor" }
  - { id: ERR_DUPLICATE_ACTIVE_ORDER, http: 409, condition: "A non-terminal INITIAL order already exists for (candidate_id, position_id)" }
  - { id: ERR_FINDING_CHECK_TYPE_NOT_IN_PACKAGE, http: 422, condition: "Finding check_type not in the pinned package's check_types" }
  - { id: ERR_REPORT_NOT_ACTIONABLE, http: 409, condition: "Dispute requires an existing report in {DELIVERED, AMENDED} for the order" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HRAdmin
    description: "HR program administrator: configures vendors, packages, positions, and the candidate registry; may escalate overdue orders"
    identity: opaque
    exclusive_operations:
      - "POST /vendors"
      - "POST /screening-packages, PUT /screening-packages/{id}, POST .../activate, POST .../retire"
      - "POST /positions"
      - "POST /candidates"
    shared_operations:
      - "POST /_clock/set_current_utc (with ComplianceOfficer)"
      - "POST /screening-orders/{id}/escalate (with HiringManager)"
      - "All GET endpoints (with all roles)"
  - name: HiringManager
    description: "Hiring manager: owns requisition-side screening workflow — creates, dispatches, cancels, and escalates orders; cannot adjudicate"
    identity: opaque
    exclusive_operations:
      - "POST /screening-orders"
      - "POST /screening-orders/{id}/dispatch"
      - "POST /screening-orders/{id}/cancel"
    shared_operations:
      - "POST /screening-orders/{id}/escalate (with HRAdmin)"
      - "All GET endpoints"
  - name: Candidate
    description: "The screened individual; acts only on own orders (X-User-ID == Candidate.id)"
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /screening-orders/{id}/consents (own order)"
      - "POST /consents/{id}/revoke (own consent)"
      - "POST /disputes (own order)"
      - "POST /disputes/{id}/withdraw (own dispute)"
      - "POST /candidates/{id}/withdraw (self)"
    shared_operations:
      - "All GET endpoints"
  - name: VendorAgent
    description: "Screening vendor's operations agent; acts only for own vendor (X-User-ID == ScreeningVendor.id)"
    identity: "entity_backed:ScreeningVendor"
    exclusive_operations:
      - "POST /screening-reports (order.vendor_id == self)"
      - "POST /disputes/{id}/resolve (report.vendor_id == self)"
    shared_operations:
      - "All GET endpoints"
  - name: Adjudicator
    description: "Adjudication reviewer: evaluates reports, records individualized assessments and adverse-action initiation; may NOT issue final notices"
    identity: opaque
    exclusive_operations:
      - "POST /screening-orders/{id}/individualized-assessments"
      - "POST /screening-orders/{id}/adjudication-decision"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Compliance owner: jurisdiction rules, adjudication matrices, vendor suspension/reinstatement, and final adverse notices; final notice issuer must differ from the initiating Adjudicator"
    identity: opaque
    exclusive_operations:
      - "POST /jurisdiction-rules, PATCH /jurisdiction-rules/{id}, POST .../activate"
      - "POST /adjudication-matrices, POST .../activate, POST .../retire"
      - "POST /vendors/{id}/suspend, POST /vendors/{id}/reinstate"
      - "POST /adverse-action-cases/{id}/send-final-notice (SoD: issuer != case.initiated_by_user_id)"
      - "POST /adverse-action-cases/{id}/abort"
    shared_operations:
      - "POST /_clock/set_current_utc (with HRAdmin)"
      - "All GET endpoints"
  - name: Auditor
    description: "Independent accuracy auditor: opens and finalizes vendor accuracy audits; no other write power"
    identity: opaque
    exclusive_operations:
      - "POST /vendor-accuracy-audits"
      - "POST /vendor-accuracy-audits/{id}/finalize"
    shared_operations:
      - "All GET endpoints"

