            - call: "GET /salt/payments/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: Auditor
              captures: {e5: $.data.error_id}
            - call: "GET /salt/credit-claims/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: Auditor
              captures: {e6: $.data.error_id}
            - call: "GET /salt/activity-records/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: Auditor
              captures: {e7: $.data.error_id}
          assert:
            - "every trigger call returns HTTP 404 with response_type error"
            - "the seven data.error_id values are ERR_REGISTRATION_NOT_FOUND, ERR_ELECTION_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_VDA_NOT_FOUND, ERR_PAYMENT_NOT_FOUND, ERR_CREDIT_CLAIM_NOT_FOUND and ERR_ACTIVITY_RECORD_NOT_FOUND in that order"

