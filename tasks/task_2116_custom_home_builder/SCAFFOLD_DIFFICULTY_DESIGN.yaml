          - state_machines.LienWaiver.RECEIVED_to_VERIFIED
          - state_machines.DrawRequest.PENDING_to_COMPLETE
          - state_machines.DrawRequest.CONDITIONALLY_APPROVED_to_FUNDED
          - state_machines.CostEntry.INCLUDED_IN_DRAW_to_PAID
          - entities.Project.fields.funded_to_date
          - entities.Project.fields.retainage_held
