            - { call: "POST /api/families/${fam_id}/consents", payload: { contact_id: "${ct_id}", scope: "FULL_PLAN", expires_at: "2027-01-01T00:00:00Z", expected_family_version: "${fam_v}" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { cg_id: "$.data.id", cg_status: "$.data.status" } }
          trigger:
            - { call: "POST /api/notes/${nt_id}/share", payload: { contact_id: "${ct_id}" }, as: Coach, as_user_id: "${co_id}", captures: { err_pending: "$.data.error_id" } }
            - { call: "POST /api/consents/${cg_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/notes/${nt_id}/share", payload: { contact_id: "${ct_id}" }, as: Coach, as_user_id: "${co_id}", captures: { nt_status: "$.data.status", nt_shared_with: "$.data.shared_with_contact_id" } }
            - { call: "GET /api/contacts/${ct_id}/shared-notes", as: ExternalContact, as_user_id: "${ct_id}", captures: { visible_id: "$.data[0].id" } }
          assert:
            - "cg_status == PENDING_SIGNATURE"
            - "err_pending == ERR_CONSENT_NOT_ACTIVE (PENDING_SIGNATURE is not ACTIVE)"
            - "nt_status == SHARED"
            - "nt_shared_with == ct_id"
            - "visible_id == nt_id (contact sees exactly the shared note)"

