        grounds: [roles.GiftOfficer, roles.GiftAdministrator]
        distinguishing_aspect: "GiftOfficer (who may draft) cannot execute: POST execute as GiftOfficer -> 403 ERR_UNAUTHORIZED even though the agreement is perfectly executable."
