  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_constraint_error_on_cancelled_subscription_patch
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
          - errors[ERR_INVALID_CADENCE]
        distinguishing_aspect: |
          Error-category pair (state, business_constraint): the PATCH carries an
          out-of-range cadence (9) AND targets a CANCELLED subscription; the
          priority-6 state check must win, returning ERR_SUBSCRIPTION_NOT_ACTIVE
          rather than ERR_INVALID_CADENCE.
