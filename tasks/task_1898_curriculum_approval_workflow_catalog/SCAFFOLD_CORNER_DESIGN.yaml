  - section: cross_cutting_complexity_layers
    instances:
      - name: proposal_update_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[proposal-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two strictly sequential PUTs carrying the same observed version: the first succeeds (version 1 -> 2), the second is rejected 412 ERR_STALE_VERSION because its expected version no longer matches."
        test_recipe:
          setup: ["Department CS; term T1; DRAFT proposal owned by fac-001, version 1 captured at creation"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id, p_v: $.data.version } }
          trigger:
            - { call: "PUT /curriculum/proposals/${prop}", payload: { expected_proposal_version: "${p_v}", proposed_title: "A revised" }, as: FacultyProposer, as_user_id: "fac-001", captures: { v2: $.data.version } }
            - { call: "PUT /curriculum/proposals/${prop}", payload: { expected_proposal_version: "${p_v}", proposed_title: "A hijacked" }, as: FacultyProposer, as_user_id: "fac-001", captures: { err: $.data.error_id } }
          assert:
            - "captured v2 == 2 (first writer advances the version)"
            - "captured err == ERR_STALE_VERSION (HTTP 412; second writer's observed version 1 is stale)"
            - "Proposal.${prop}.proposed_title == 'A revised'"
      - name: term_update_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[term-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Same OCC pattern on the Term parent via PATCH: correct version edits dates (version 1 -> 2), replayed stale version is rejected 412."
        test_recipe:
          setup: ["T1 exists, version 1 captured at creation"]
          setup_api_calls:
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id, t_v: $.data.version } }
          trigger:
            - { call: "PATCH /curriculum/terms/${t1}", payload: { expected_term_version: "${t_v}", proposal_freeze_at: "2026-10-05T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { v2: $.data.version } }
            - { call: "PATCH /curriculum/terms/${t1}", payload: { expected_term_version: "${t_v}", catalog_freeze_at: "2027-01-12T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { err: $.data.error_id } }
          assert:
            - "captured v2 == 2"
            - "captured err == ERR_STALE_VERSION (HTTP 412)"
            - "Term.${t1}.catalog_freeze_at remains '2027-01-10T00:00:00Z'"
      - name: cascading_layers_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Proposal.APPROVED_to_EFFECTIVE
          - state_machines.CatalogEdition.FROZEN_to_PUBLISHED
        excluded_because:
          difficulty_instance: transitive_cascade / deactivation_activation_cascade_depth3
          rationale: "Depth-3 and depth-2 cascade chains asserted end-to-end in the named §1.8 instances (plus edition_publish_cascade_depth2)."
      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds:
          - calculations.substantive_change_score
          - calculations.teach_out_completion_terms
        excluded_because:
          difficulty_instance: dual_variant_calc / teach_out_completion_enrollment_vs_catalog_variants
          rationale: "Both variant pairs asserted in the named §1.8 instances."
      - name: rate_threshold_layer_covered
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.substantive_change_score
        excluded_because:
          difficulty_instance: boundary_precision_check / accreditor_threshold_exactly_50_triggers
          rationale: "Threshold behavior at exactly 50 asserted in the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: immediate_visibility_after_decision
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Proposal.DEPT_REVIEW_to_COMMITTEE_REVIEW
        distinguishing_aspect: "Immediate consistency: the approve response body itself carries the new status COMMITTEE_REVIEW and incremented version — no refetch needed to observe the mutation."
        test_recipe:
          setup: ["Department CS; term T1; proposal in DEPT_REVIEW"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id, v_create: $.data.version } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { st: $.data.status, v_after: $.data.version } }
          assert:
            - "captured st == COMMITTEE_REVIEW in the mutating response itself"
            - "captured v_after == ${v_create} + 2 (one increment at submit, one at approve)"
