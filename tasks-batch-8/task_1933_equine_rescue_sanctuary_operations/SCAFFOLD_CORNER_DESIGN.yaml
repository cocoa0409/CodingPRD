        claim_type: error_triggerable
        grounds: ["errors[ERR_APPOINTMENT_OVERLAP]"]
        excluded_because:
          difficulty_instance: practitioner_half_open_buffer_overlap
          rationale: "Asserted at the 14-minute gap in the named §1.8 instance."

      - name: err_stall_overlap_and_gap_already_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_STALL_OVERLAP]", "errors[ERR_DISINFECTION_GAP_REQUIRED]"]
        excluded_because:
          difficulty_instance: stall_closed_interval_disinfection_gap
          rationale: "Both errors asserted (overlap-first ordering, then gap rule) in the named §1.8 instance."

      - name: err_fee_unpaid_already_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_ADOPTION_FEE_UNPAID]"]
        excluded_because:
          difficulty_instance: adoption_fee_quoted_vs_final_divergence
          rationale: "Asserted when the FINAL recompute exceeds the paid amount in the named §1.8 instance."

      - name: err_quarantine_active_already_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_QUARANTINE_ACTIVE]"]
        excluded_because:
          difficulty_instance: release_gated_by_protocol_cleared
          rationale: "Asserted on release while the protocol is ACTIVE in the named §1.8 instance."

  - section: rbac
    instances:
      - name: adopter_cannot_intake_horse
        claim_type: role_exclusive_denied
        grounds: [roles.Adopter, roles.IntakeCoordinator]
        distinguishing_aspect: "Adopter role calling POST /horses (IntakeCoordinator-exclusive) is denied ERR_FORBIDDEN 403 even with a valid entity-backed identity."
        test_recipe:
          setup: ["Adopter AD registered"]
          setup_api_calls:
            - { call: "POST /rescue-ops/adopters", payload: { full_name: "Ad R", contact_email: "ar@x.com", experience_level: NOVICE, has_stall_facility: false }, as: Adopter, captures: { ad: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/horses", payload: { name: "Sneak", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: Adopter, as_user_id: "${ad}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http status 403; no horse created"

