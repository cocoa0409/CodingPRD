            - "${case_status_1} == PENDING_REVIEW and ${evidence_1} == 1"
            - "${case_status_2} == EVIDENCE_GATHERING and ${returns_2} == 1 - the cycle closed once"
            - "${case_status_3} == PENDING_REVIEW and ${evidence_3} == 3 - evidence accumulates across iterations instead of being replaced by 2"
            - "${case_status_4} == SUBSTANTIATED and InvestigationCase.${case_id}.return_count == 1 and reviewed_by_user_id == auditor-3"
            - "${chargeback} == 9600 - ceil(6100 / 20000) == 1 container at the 9600 list price, with no volume discount"
            - "UsageVarianceReview.${rev_id}.status == CLOSED (CASCADE gamma link 2) while Dispenser.${disp_id}.dispenser_status == ACTIVE, because remediation CHARGEBACK does not fire links 3 and 4"

  - rule_id: transitive_cascade
    instances:
      - name: cascade_alpha_clock_expiry_reaches_alert_suppression_four_links_deep
        grounds:
          - state_machines.ServiceAgreement.status.RENEWAL_PENDING_to_EXPIRED
          - state_machines.MachinePlacement.placement_status.INSTALLED_to_RETRIEVAL_SCHEDULED
          - state_machines.Dispenser.dispenser_status.ACTIVE_to_LOCKED_OUT
          - state_machines.TelemetryAlert.status.OPEN_to_SUPPRESSED
          - endpoints.POST_clock_set_current_utc
        distinguishing_aspect: |
          Trigger is a CLOCK ADVANCE and the chain is four links deep, each link caused strictly by the
          previous one: (1) the agreement reaches EXPIRED because current_utc passed term_end_date,
          (2) BECAUSE the agreement expired its INSTALLED placement moves to RETRIEVAL_SCHEDULED,
          (3) BECAUSE that placement is now scheduled for retrieval its ACTIVE dispenser is LOCKED_OUT
          with lockout_reason AGREEMENT_ENDED, (4) BECAUSE of that AGREEMENT_ENDED lockout the
          placement's OPEN telemetry alert becomes SUPPRESSED. Nothing in the request body names the
