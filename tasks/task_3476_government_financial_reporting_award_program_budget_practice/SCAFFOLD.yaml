# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed body, missing required field, invalid enum value, numeric range violation, or closes_at/window ordering violation" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "ownership check failed (own government / own profile / own assignment / committee membership / chair-only publish)" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "publication chair attempts to publish a publication they created (segregation of duties)" }
  - { id: ERR_GOVERNMENT_NOT_FOUND, http: 404, condition: "referenced government id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "referenced member id does not exist" }
  - { id: ERR_REVIEWER_NOT_FOUND, http: 404, condition: "referenced reviewer profile id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "referenced award cycle id does not exist" }
  - { id: ERR_CHECKLIST_NOT_FOUND, http: 404, condition: "referenced checklist version id does not exist" }
  - { id: ERR_STANDARD_NOT_FOUND, http: 404, condition: "referenced standards reference id does not exist" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "referenced report submission id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "referenced review assignment id does not exist" }
  - { id: ERR_PUBLICATION_NOT_FOUND, http: 404, condition: "referenced publication id does not exist" }
  - { id: ERR_COMMENT_NOT_FOUND, http: 404, condition: "referenced member comment id does not exist" }
  - { id: ERR_FUND_NOT_FOUND, http: 404, condition: "referenced scholarship fund id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "referenced scholarship application id does not exist" }
  - { id: ERR_SUBMISSION_STATE_INVALID, http: 409, condition: "submission not in the required state (submit needs DRAFT; decide needs DECISION_READY or later; appeal needs DECIDED_DENIED; assignment needs SUBMITTED|APPEALED|UNDER_REVIEW)" }
  - { id: ERR_REVIEWER_STATE_INVALID, http: 409, condition: "reviewer status transition not allowed from current status (training, suspend, reinstate, retire)" }
  - { id: ERR_REVIEWER_NOT_TRAINED, http: 409, condition: "independence attestation submitted while reviewer still APPLICANT (must be TRAINED first)" }
  - { id: ERR_REVIEWER_NOT_ELIGIBLE, http: 409, condition: "accept or finding attempted while reviewer profile is not ELIGIBLE" }
  - { id: ERR_ASSIGNMENT_STATE_INVALID, http: 409, condition: "assignment not in the required state (accept/decline need OFFERED; finding needs ACCEPTED)" }
  - { id: ERR_PUBLICATION_STATE_INVALID, http: 409, condition: "publication not in the required state (open-comment needs DRAFTING; close needs MEMBER_COMMENT; revise/publish need RESOLUTION; resolve needs RESOLUTION)" }
  - { id: ERR_UNRESOLVED_COMMENTS, http: 409, condition: "publish attempted while pending_comment_count > 0" }
  - { id: ERR_COMMENT_ALREADY_RESOLVED, http: 409, condition: "resolve attempted on a comment not in PENDING" }
  - { id: ERR_APPLICATION_STATE_INVALID, http: 409, condition: "allocate needs PENDING; rescind needs GRANTED" }
  - { id: ERR_FINDINGS_INCOMPLETE, http: 409, condition: "decide attempted from UNDER_REVIEW with fewer than 3 current-round findings" }
  - { id: ERR_NO_ELIGIBLE_REVIEWER, http: 409, condition: "blind reviewer selector returned an empty candidate pool (all eligible reviewers excluded by independence, capacity, or prior-round exclusion)" }
  - { id: ERR_CHECKLIST_PIN_STALE, http: 409, condition: "submit attempted with pinned_checklist_stale == true (pinned checklist was SUPERSEDED)" }
  - { id: ERR_PINNED_STANDARD_SUPERSEDED, http: 409, condition: "publish attempted while the pinned standards reference is SUPERSEDED" }
  - { id: ERR_CYCLE_CHECKLIST_MISMATCH, http: 422, condition: "cycle references a checklist that is not ACTIVE or whose program_type differs from the cycle's" }
  - { id: ERR_CHECKLIST_ALREADY_ACTIVE, http: 409, condition: "create checklist while another ACTIVE checklist exists for the same program_type" }
  - { id: ERR_DOCUMENT_TYPE_DUPLICATE, http: 409, condition: "duplicate doc_type inside a submission's budget_documents list" }
  - { id: ERR_DUPLICATE_SUBMISSION, http: 409, condition: "create rejected when a submission already exists for (government_id, cycle_id) with status IN {DRAFT, SUBMITTED, UNDER_REVIEW, DECISION_READY, APPEALED}; DECIDED_AWARDED/DECIDED_DENIED do not block a fresh DRAFT" }
  - { id: ERR_AVAILABILITY_WINDOW_OVERLAP, http: 409, condition: "reviewer unavailability windows intersect under CLOSED-interval semantics (touching endpoints count as overlap)" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 409, condition: "award cycle submission window overlaps another cycle of the same program under HALF-OPEN semantics (back-to-back allowed)" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 409, condition: "submit attempted while cycle posture is not OPEN" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "appeal attempted more than 30 days after decided_at" }
  - { id: ERR_STANDARD_NOT_YET_EFFECTIVE, http: 409, condition: "standard activation attempted before effective_date" }
  - { id: ERR_COMMENT_WINDOW_CLOSED, http: 409, condition: "comment attempted while publication in MEMBER_COMMENT but logical clock >= comment_window_closes_at" }
  - { id: ERR_COMMENT_WINDOW_STILL_OPEN, http: 409, condition: "close-comment-period attempted before comment_window_closes_at" }
  - { id: ERR_BUDGET_DOCUMENTS_INCOMPLETE, http: 422, condition: "BUDGET_PRESENTATION submission lacks one of POLICY / FINANCIAL_PLAN / COMMUNICATION in budget_documents at submit" }
  - { id: ERR_PROGRAM_NOT_BUDGET, http: 422, condition: "budget_documents supplied for a submission in a FINANCIAL_REPORTING cycle" }
  - { id: ERR_UNKNOWN_CRITERION, http: 422, condition: "finding scores a criterion_code absent from the pinned checklist" }
  - { id: ERR_CRITERION_SET_INCOMPLETE, http: 422, condition: "finding omits a criterion declared on the pinned checklist" }
  - { id: ERR_WEIGHT_SUM_INVALID, http: 422, condition: "checklist criteria weights do not sum to exactly 1.000" }
  - { id: ERR_GOVERNMENT_NOT_SMALL, http: 422, condition: "scholarship application for a government whose population_band is not SMALL" }
  - { id: ERR_PURPOSE_PROGRAM_MISMATCH, http: 422, condition: "application purpose does not match the fund's program_label" }
  - { id: ERR_CHAIR_NOT_ON_COMMITTEE, http: 422, condition: "chair_member_id is not an element of member_ids, or creator not in member_ids" }
  - { id: ERR_REVIEW_QUORUM_FULL, http: 409, condition: "a 4th active (OFFERED/ACCEPTED/SUBMITTED) assignment in the same appeal round" }
  - { id: ERR_POOL_EXHAUSTED, http: 409, condition: "allocate attempted while fund.remaining_cents == 0" }
  - { id: ERR_STALE_FUND_VERSION, http: 412, condition: "expected_fund_version does not match the fund's current version (OCC)" }
  - { id: ERR_STALE_PUBLICATION_VERSION, http: 412, condition: "expected_publication_version does not match the publication's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Association operations staff: configures programs, checklists, standards, cycles, funds, governments, members; administers reviewer training and status"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /gfoa/governments"
      - "POST /gfoa/members"
      - "POST /gfoa/checklist-versions"
      - "POST /gfoa/award-cycles"
      - "POST /gfoa/standards-references"
      - "POST /gfoa/standards-references/{id}/activate"
      - "POST /gfoa/scholarship-funds"
    shared_operations:
      - "PUT /gfoa/reviewer-profiles/{id} (status administration only)"
      - "all GET endpoints"

  - name: GovernmentContact
    description: "Authorized contact of a submitting government; acts strictly on resources of government_id == X-User-ID"
    identity: "entity_backed:Government"
    exclusive_operations:
      - "POST /gfoa/report-submissions"
      - "POST /gfoa/report-submissions/{id}/submit"
      - "POST /gfoa/report-submissions/{id}/appeal"
      - "POST /gfoa/scholarship-applications"
    shared_operations:
      - "GET /gfoa/report-submissions(/<id>) (own rows)"
      - "GET /gfoa/award-cycles(/<id>)"
      - "GET /gfoa/checklist-versions"
      - "GET /gfoa/review-assignments(/<id>) (blinded: reviewer_id masked)"
      - "GET /gfoa/review-findings(/<id>)"
      - "GET /gfoa/scholarship-applications(/<id>) (own rows)"

  - name: Reviewer
    description: "Trained peer reviewer; acts on own profile and own assignments only"
    identity: "entity_backed:ReviewerProfile"
    exclusive_operations:
      - "POST /gfoa/review-assignments/{id}/accept"
      - "POST /gfoa/review-assignments/{id}/decline"
      - "POST /gfoa/review-assignments/{id}/finding"
    shared_operations:
      - "PUT /gfoa/reviewer-profiles/{id} (own attestations/windows; never status)"
      - "GET /gfoa/reviewer-profiles/{id}"
      - "GET /gfoa/review-assignments(/<id>)"
      - "GET /gfoa/review-findings(/<id>)"

  - name: CommitteeMember
    description: "Member serving on a publication's committee (X-User-ID must be in publication.member_ids; publish additionally requires chair)"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /gfoa/publications"
      - "POST /gfoa/publications/{id}/open-comment-period"
      - "POST /gfoa/publications/{id}/close-comment-period"
      - "POST /gfoa/publications/{id}/revise"
      - "POST /gfoa/publications/{id}/publish (chair only)"
      - "POST /gfoa/member-comments/{id}/resolve"
    shared_operations:
      - "GET /gfoa/member-comments(/<id>)"

  - name: Member
    description: "Finance officer member of the association"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /gfoa/reviewer-profiles (self-application; member_id == X-User-ID)"
      - "POST /gfoa/member-comments"
    shared_operations:
      - "GET /gfoa/member-comments(/<id>)"

  - name: AwardsDirector
    description: "Program decision-maker: runs blind assignment, award decisions, and scholarship allocation. Segregated from Reviewer and GovernmentContact duties"
    identity: opaque
    exclusive_operations:
      - "POST /gfoa/review-assignments"
      - "POST /gfoa/report-submissions/{id}/decide"
      - "POST /gfoa/scholarship-applications/{id}/allocate"
      - "POST /gfoa/scholarship-applications/{id}/rescind"
    shared_operations:
      - "GET /gfoa/report-submissions(/<id>)"
      - "GET /gfoa/reviewer-profiles(/<id>)"
      - "GET /gfoa/award-cycles(/<id>)"
      - "GET /gfoa/checklist-versions"
      - "GET /gfoa/review-assignments(/<id>)"
      - "GET /gfoa/review-findings(/<id>)"
      - "GET /gfoa/scholarship-applications(/<id>)"
      - "GET /gfoa/scholarship-funds/{id}"
