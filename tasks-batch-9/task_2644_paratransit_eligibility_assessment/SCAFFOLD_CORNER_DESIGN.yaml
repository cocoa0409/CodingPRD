              captures: { asmt_a: $.data.id }
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: IntakeClerk
              captures: { delay_before: $.data.applicant_delay_days }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:05:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /assessments/${asmt_a}/attendance"
              payload: { attendance_status: "NO_SHOW" }
              as: Evaluator
              as_user_id: "eval-1"
              captures: { a_attendance: $.data.attendance_status }
          trigger:
            - call: "POST /applications/${appn_id}/assessments"
