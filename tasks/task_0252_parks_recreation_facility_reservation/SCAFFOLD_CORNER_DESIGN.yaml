# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Parks & Recreation Facility Reservation — Expert band
# Breadth probe across the 9 claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: facility_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds: [entities.Facility, endpoints./facilities.POST]
        distinguishing_aspect: "POST /facilities with required fields -> 201; status defaults OPEN, granted_permit_count=0, version=1, id/created_at minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Main Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.40, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "Response 201; Facility.${fac_id}.status == OPEN"
            - "Facility.${fac_id}.granted_permit_count == 0"
            - "Facility.${fac_id}.version == 1"
            - "Facility.${fac_id}.buffer_minutes == 0 and deposit_cents == 0 and requires_coi == false"

      - name: facility_get_returns_stored_data
        claim_type: Retrieval
        grounds: ["entities.Facility", "endpoints.GET /facilities/{facility_id}"]
        distinguishing_aspect: "GET /facilities/{id} returns the same field values that were stored on create."
        test_recipe:
          setup: ["One facility created."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Get Court", facility_type: "COURT", hourly_rate_cents: 8000, resident_discount_pct: 0.25, prime_multiplier: 2.0, prime_start_hour: 17, prime_end_hour: 21 }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Patron
              as_user_id: "any-patron"
              captures: { nm: $.data.name }
          assert:
            - "Facility.${fac_id}.name == 'Get Court'"
            - "Facility.${fac_id}.hourly_rate_cents == 8000 and prime_multiplier == 2.0"

      - name: facility_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Facility, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /facilities/{random-uuid} on empty DB -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response 404; data.error_id == ERR_NOT_FOUND"

      - name: facility_create_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Facility.fields.facility_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /facilities omitting facility_type (required, no default) -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Bad Fac", hourly_rate_cents: 10000, resident_discount_pct: 0.40, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response 422; data.error_id == ERR_VALIDATION"

      - name: facility_create_invalid_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Facility.fields.facility_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "facility_type='STADIUM' (not in FIELD|COURT|POOL|PAVILION) -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Stadium", facility_type: "STADIUM", hourly_rate_cents: 10000, resident_discount_pct: 0.40, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response 422; data.error_id == ERR_VALIDATION"

      - name: patron_create_defaults_standing_good
        claim_type: Defaults
        grounds: [entities.Patron.fields.standing, entities.Patron.fields.residency_verified]
        distinguishing_aspect: "POST /patrons -> standing defaults GOOD, residency_verified=false, no_show_strikes=0, wallet_credit_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { full_name: "New P", email: "newp@x.com", residency: "RESIDENT" }
              as: Patron
              captures: { p_id: $.data.id, st: $.data.standing }
          assert:
            - "Patron.${p_id}.standing == GOOD"
            - "Patron.${p_id}.residency_verified == false"
            - "Patron.${p_id}.no_show_strikes == 0 and wallet_credit_cents == 0"

      - name: permit_quoted_fee_input_ignored_computed
        claim_type: Computed Fields
        grounds: [entities.Permit.fields.quoted_fee_cents, calculations.provisional_quote_fee]
        distinguishing_aspect: "quoted_fee_cents is computed; a client cannot set it (not in apply input) and is derived from window/rate."
        test_recipe:
          setup: ["Facility hourly 10000, disc 0; NON_RESIDENT patron; window 10:00-12:00 (non-prime, 2h)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "QF Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /patrons"
              payload: { full_name: "NR", email: "nrqf@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-20T10:00:00Z", end_at: "2026-08-20T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id, q: $.data.quoted_fee_cents }
          assert:
            - "Permit.${perm_id}.quoted_fee_cents == 20000"
            - "Permit.${perm_id}.is_prime_requested == false"
            - "Permit.${perm_id}.pricing_residency == NON_RESIDENT"

      - name: patrons_permits_listing_pagination
        claim_type: Listing
        grounds: ["endpoints.GET /patrons/{patron_id}/permits", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /patrons/{id}/permits returns a paginated array with total_count and has_more in the envelope."
        test_recipe:
          setup: ["Patron with 2 applied permits on a facility."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "List Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /patrons"
              payload: { full_name: "LP", email: "lp@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-21T10:00:00Z", end_at: "2026-08-21T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-22T10:00:00Z", end_at: "2026-08-22T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "GET /patrons/${p_id}/permits"
              payload: { limit: 1, offset: 0 }
              as: Patron
              as_user_id: "${p_id}"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "Envelope total_count == 2 and has_more == true (limit 1 of 2)"
            - "data is an array of length 1"

      - name: pagination_limit_over_max_returns_validation
        claim_type: Type Constraints
        grounds: [response_envelope.pagination_defaults, "errors[ERR_PAGINATION_INVALID]"]
        distinguishing_aspect: "GET list with limit=500 (> max 100) -> ERR_PAGINATION_INVALID (422)."
        test_recipe:
          setup: ["At least one patron exists."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "PG", email: "pg@x.com", residency: "RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /patrons/${p_id}/permits"
              payload: { limit: 500, offset: 0 }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 422; data.error_id == ERR_PAGINATION_INVALID"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: permit_initial_state_is_applied
        claim_type: Initial State
        grounds: [state_machines.Permit, entities.Permit.fields.status]
        distinguishing_aspect: "A newly applied permit starts in status APPLIED."
        test_recipe:
          setup: ["Facility + patron; one apply."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Init Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /patrons"
              payload: { full_name: "IP", email: "ip@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-23T10:00:00Z", end_at: "2026-08-23T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id, st: $.data.status }
          assert:
            - "Permit.${perm_id}.status == APPLIED"

      - name: complete_before_end_at_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Permit.GRANTED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a GRANTED permit while clock < end_at -> ERR_INVALID_STATE (precondition current clock >= end_at)."
        test_recipe:
          setup: ["Granted permit on 2026-08-24T10:00-12:00; clock still 2026-07-01 (before end)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Pre Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 1000 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "PC", email: "pc@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-24T10:00:00Z", end_at: "2026-08-24T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 1000 }
              as: FinanceClerk
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: RecCoordinator
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/complete"
              payload: {}
              as: RecCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response 409; data.error_id == ERR_INVALID_STATE"
            - "Permit.${perm_id}.status == GRANTED (unchanged)"

      - name: cancel_terminal_completed_permit_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Permit.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) permit -> ERR_INVALID_STATE; no transition defined from COMPLETED."
        test_recipe:
          setup: ["Permit granted then completed after end_at; then attempt cancel."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Term Pool", facility_type: "POOL", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 2000 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "TC", email: "tc@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-07-03T10:00:00Z", end_at: "2026-07-03T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 2000 }
              as: FinanceClerk
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: RecCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T13:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/complete"
              payload: {}
              as: RecCoordinator
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/cancel"
              payload: { refund_destination: "ORIGINAL" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 409; data.error_id == ERR_INVALID_STATE"
            - "Permit.${perm_id}.status == COMPLETED (unchanged)"

      - name: grant_idempotency_second_grant_rejected
        claim_type: Idempotency
        grounds: [state_machines.Permit.APPLIED_to_GRANTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Granting an already-GRANTED permit a second time -> ERR_INVALID_STATE (no APPLIED/WAITLISTED source state)."
        test_recipe:
          setup: ["Permit granted once; re-grant attempted with fresh facility version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Idem Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "ID", email: "id@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-25T10:00:00Z", end_at: "2026-08-25T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 0 }
              as: FinanceClerk
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v0}" }
              as: RecCoordinator
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: RecCoordinator
              captures: { fac_v1: $.data.version }
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v1}" }
              as: RecCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response 409; data.error_id == ERR_INVALID_STATE"
            - "Permit.${perm_id}.status == GRANTED (unchanged)"

      - name: league_bubble_up_to_granted_when_all_children_granted
        claim_type: Side Effect Execution
        grounds: [state_machines.LeagueSeries.transitions, entities.LeagueSeries.fields.status]
        distinguishing_aspect: "Bubble-up: when every child permit is GRANTED, LeagueSeries.status auto-rolls to GRANTED."
        test_recipe:
          setup: ["League with 1 occurrence; its single child permit granted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Bub Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 0 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "Bub", email: "bub@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /leagues"
              payload: { facility_id: "${fac_id}", patron_id: "${p_id}", weekday: 1, start_hour: 10, duration_minutes: 120, first_date: "2026-08-04T00:00:00Z", occurrences: 1 }
              as: Patron
              as_user_id: "${p_id}"
              captures: { league_id: $.data.id }
            - call: "GET /leagues/${league_id}/permits"
              payload: {}
              as: RecCoordinator
              captures: { child0_id: "$.data[0].id" }
            - call: "POST /permits/${child0_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 0 }
              as: FinanceClerk
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${child0_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: RecCoordinator
              captures: { st: $.data.status }
          assert:
            - "Permit.${child0_id}.status == GRANTED"
            - "LeagueSeries.${league_id}.status == GRANTED"
            - "LeagueSeries.${league_id}.granted_occurrence_count == 1"

      - name: coi_expiry_via_ops_sweep
        claim_type: Side Effect Execution
        grounds: [state_machines.InsuranceCertificate.ACTIVE_to_EXPIRED, endpoints./_ops/sweep.POST]
        distinguishing_aspect: "Ops sweep at clock >= expiry_date flips an ACTIVE COI to EXPIRED and reports expired_coi_count."
        test_recipe:
          setup: ["COI effective 2026-07-01 expiry 2026-07-20; sweep at 2026-07-21."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /patrons"
              payload: { full_name: "CX", email: "cx@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /insurance-certificates"
              payload: { patron_id: "${p_id}", coverage_amount_cents: 100000, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2026-07-20T00:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { coi_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:00Z" }
              as: RecCoordinator
          trigger:
            - call: "POST /_ops/sweep"
              payload: {}
              as: RecCoordinator
              captures: { n: $.data.expired_coi_count }
          assert:
            - "InsuranceCertificate.${coi_id}.status == EXPIRED"
            - "sweep response expired_coi_count >= 1"

  # ===========================================================================
  - section: calculations
    instances:
      - name: residency_flip_between_apply_and_grant
        claim_type: Variant Selection
        grounds: [calculations.provisional_quote_fee, calculations.final_grant_fee, entities.Permit.fields.pricing_residency]
        distinguishing_aspect: "Applied as NON_RESIDENT (quoted 40000), residency verified before grant; final re-resolves RESIDENT -> final_fee_cents 24000."
        test_recipe:
          setup: ["F_flip hourly 10000 disc 0.40 mult 1.5 prime[18,22); window 17:00-20:00 (np 1h, prime 2h)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "RF Pool", facility_type: "POOL", hourly_rate_cents: 10000, resident_discount_pct: 0.40, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 0 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "RFP", email: "rfp@x.com", residency: "RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-26T17:00:00Z", end_at: "2026-08-26T20:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id, q: $.data.quoted_fee_cents }
            - call: "POST /patrons/${p_id}/verify-residency"
              payload: {}
              as: RecCoordinator
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 24000, deposit_component_cents: 0 }
              as: FinanceClerk
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: RecCoordinator
              captures: { f: $.data.final_fee_cents }
          assert:
            - "Permit.${perm_id}.quoted_fee_cents == 40000 (priced NON_RESIDENT at apply, residency_verified false)"
            - "Permit.${perm_id}.final_fee_cents == 24000 (priced RESIDENT at grant)"
            - "Permit.${perm_id}.pricing_residency == RESIDENT"

      - name: refund_preview_estimate_does_not_persist
