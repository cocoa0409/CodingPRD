# =============================================================================
# Task 1874: Flatbed & Specialized Heavy Haul - Section 1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >=2 instances = 19 instances.
# All arithmetic in assert: lines was computed from the pinned formulas and
# constants in SCAFFOLD.yaml section 1.3 (TRAILER_CATALOG, STATE_BASE_CENTS, tiers).
# Shared fixture values used across instances:
#   trailer EXTENDABLE_DOUBLE_DROP = {max_payload 150000, deck 22in, 700 c/mi}
#   permit grant travel window = 2026-08-10T00:00:00Z .. 2026-08-20T00:00:00Z
#   escort window 2026-08-12T08:00:00Z..12:00:00Z (240 min) @ 12000 c/hr -> 48000
#   cranes: ORIGIN CRANE-A 2026-08-12T06:00..08:00Z; DESTINATION CRANE-B 2026-08-13T06:00..08:00Z
#   clock for depart: 2026-08-12T10:00:00Z (UTC hour 10 inside curfew [5,21) )
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_diverge
        grounds:
          - calculations.cost_estimate
          - calculations.invoice_total
          - calculations.fuel_surcharge
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Dual-variant on the Invoice/Load billing domain: identical load data yields
          provisional total 475740 (permits counted while FILED+GRANTED, escorts while
          CONFIRMED, standby/fines excluded) but final invoice total 532440 after a
          300-minute customer delay adds standby 52500 - delta 56700 cents caused
          purely by the variant input-set rules, not by any data correction.
        test_recipe:
          setup:
            - "Customer credit 100000000; load 96000 lbs, 150x100x400 in, states [CA], trailer EXTENDABLE_DOUBLE_DROP, 500 route miles"
            - "CA OVERSIZE permit GRANTED (fee 11500) and CA OVERWEIGHT GRANTED (fee 31000); REAR escort CONFIRMED 240 min @ 12000 c/hr; both cranes SCHEDULED; securement APPROVED; load CLEARED"
            - "Provisional estimate captured at CLEARED; then clock set, depart, one 300-min CUSTOMER_DELAY, arrive, invoice created"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Acme Machines", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Press brake", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "Los Angeles CA", destination: "Phoenix AZ" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "A. Reyes", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 500, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_os: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_os}/file", payload: {}, as: PermitClerk }
            - { call: "POST /heavy-haul/permits/${p_os}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERWEIGHT", expected_load_version: "${lv4}" }, as: PermitClerk, captures: { p_ow: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_ow}/file", payload: {}, as: PermitClerk }
            - { call: "POST /heavy-haul/permits/${p_ow}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv5: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Pacific Pilot", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv5}" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS", tiedown_count: 4, wll_per_tiedown_lbs: 15000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "GET /heavy-haul/loads/${load_id}/cost-estimate", as: BillingClerk, captures: { est_total: "$.data.total_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /heavy-haul/loads/${load_id}/depart", payload: {}, as: Driver }
            - { call: "POST /heavy-haul/loads/${load_id}/delay-events", payload: { kind: "CUSTOMER_DELAY", started_at: "2026-08-12T11:00:00Z", ended_at: "2026-08-12T16:00:00Z" }, as: Driver }
            - { call: "POST /heavy-haul/loads/${load_id}/arrive", payload: {}, as: Driver }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/invoices", payload: {}, as: BillingClerk, captures: { inv_total: "$.data.total_cents", inv_standby: "$.data.standby_cents", inv_escorts: "$.data.escorts_cents" } }
          assert:
            - "est_total == 475740 (linehaul 350000 + permits 42500 + escorts 48000 = subtotal 440500; fuel 8% = 35240)"
            - "inv_total == 532440 (subtotal 440500 + standby 52500 = 493000; fuel 8% = 39440)"
            - "inv_standby == 52500 (300 min delay - 120 free = 180 billable min x 17500/60)"
            - "inv_escorts == 48000 (240 min x 12000/60, COMPLETED booking)"
            - "inv_total - est_total == 56700 (standby 52500 + its fuel 4200: variants diverge on identical load configuration)"

      - name: permit_fee_declared_vs_measured_basis
        grounds:
          - calculations.permit_fee
          - entities.Permit.fields.weight_basis_lbs
          - state_machines.Permit.REVOKED_to_FILED
        distinguishing_aspect: |
          Dual-variant on the Permit domain (different subject than the Invoice
          variant): the same NV OVERWEIGHT permit on the same load costs 28000 on
          declared basis (96000 lbs) at first filing, then 32000 on measured basis
          (100000 lbs from a scale ticket) at refile after revocation.
        test_recipe:
          setup:
            - "Load 96000 lbs, 150x100x400 in, states [NV], CLEARED with escort/cranes/securement; NV OVERWEIGHT permit filed and granted on declared basis"
            - "Scale ticket measured 100000 lbs (violation: 100000*100 > 96000*103) revokes the permit and holds the load"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Basin Steel", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Boiler", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "Reno NV", destination: "Elko NV" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "B. Okafor", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 300, states_crossed: ["NV"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "NV", permit_type: "OVERWEIGHT", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_ow: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_ow}/file", payload: {}, as: PermitClerk, captures: { fee1: "$.data.fee_cents", basis1: "$.data.weight_basis_lbs" } }
            - { call: "POST /heavy-haul/permits/${p_ow}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "High Desert Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv4}" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS", tiedown_count: 4, wll_per_tiedown_lbs: 15000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/scale-tickets", payload: { measured_gross_lbs: 100000, weighed_at: "2026-08-12T07:30:00Z" }, as: Driver }
            - { call: "POST /heavy-haul/permits/${p_ow}/file", payload: {}, as: PermitClerk, captures: { fee2: "$.data.fee_cents", basis2: "$.data.weight_basis_lbs", st2: "$.data.status" } }
          assert:
            - "fee1 == 28000 (NV base 12000 + excess 16000 lbs x 1 cent; declared variant)"
            - "basis1 == 96000"
            - "st2 == FILED and basis2 == 100000 (measured variant: latest scale ticket)"
            - "fee2 == 32000 (NV base 12000 + excess 20000 lbs x 1 cent)"
            - "fee2 != fee1 although load dimensions never changed - only the weight-basis variant switched"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_tiered_multi_input
        grounds:
          - calculations.permit_fee
          - entities.Permit.fields.fee_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction - TX SUPERLOAD fee combines
          a per-state base, a 3-bracket MARGINAL weight surcharge over 80000 lbs
          (excess 68000 -> 20000x1 + 30000x2 + 18000x4), and a flat width bracket
          (>192 -> 10000); the pinned bracket boundaries yield exactly 217000.
        test_recipe:
          setup:
            - "Load 148000 lbs, width 200 in (superload via width > 192), height 100, length 400; EXTENDABLE_DOUBLE_DROP capacity 150000 >= 148000; 8 axles >= required max(2, ceil(148000/20000)) = 8; states [TX]"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Gulf Petrochem", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Reactor vessel", gross_weight_lbs: 148000, width_in: 200, height_in: 100, length_in: 400, origin: "Houston TX", destination: "Midland TX" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 8, driver_name: "C. Nguyen", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["TX"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 160000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "TX", permit_type: "SUPERLOAD", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_sl: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/permits/${p_sl}/file", payload: {}, as: PermitClerk, captures: { fee: "$.data.fee_cents", basis: "$.data.weight_basis_lbs" } }
          assert:
            - "basis == 148000 (no scale ticket exists; declared basis)"
            - "fee == 217000 = 55000 (TX SUPERLOAD base) + 152000 (weight: 20000x1 + 30000x2 + 18000x4 cents) + 10000 (width 200 > 192 bracket)"
            - "weight surcharge is marginal: a flat 4-cent rate would give 272000, a flat 1-cent rate 68000 - only the bracketed 152000 is accepted"

      - name: invoice_per_line_rounding_beats_sum_rounding
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.escorts_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned - each COMPLETED escort booking is
          rounded half-up to cents BEFORE summing. Two 1-minute bookings at 10001
          c/hr give 167 + 167 = 334 per-line; sum-then-round would give
          round(2 x 10001/60) = 333. The scaffold forbids sum-then-round.
        test_recipe:
          setup:
            - "Load 40000 lbs, width 170 (requires FRONT+REAR escorts), height 50, length 400; FLATBED (deck 60 -> overall 110); states [NV], 10 route miles"
            - "NV OVERSIZE permit GRANTED (fee 12000 = 7000 base + 5000 width>168 bracket); FRONT booking 1 min @ 10001 c/hr (provider PF); REAR booking 1 min @ 10001 c/hr (provider PR); cranes and securement satisfied; load CLEARED"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Precision Fab", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Wide beam", gross_weight_lbs: 40000, width_in: 170, height_in: 50, length_in: 400, origin: "Sparks NV", destination: "Elko NV" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "D. Park", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 10, states_crossed: ["NV"], min_bridge_clearance_in: 120, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "NV", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_os: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_os}/file", payload: {}, as: PermitClerk }
            - { call: "POST /heavy-haul/permits/${p_os}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "PF", position: "FRONT", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T10:01:00Z", rate_per_hour_cents: 10001, expected_load_version: "${lv4}" }, as: Dispatcher }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv5: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "PR", position: "REAR", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T10:01:00Z", rate_per_hour_cents: 10001, expected_load_version: "${lv5}" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /heavy-haul/loads/${load_id}/depart", payload: {}, as: Driver }
            - { call: "POST /heavy-haul/loads/${load_id}/arrive", payload: {}, as: Driver }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/invoices", payload: {}, as: BillingClerk, captures: { inv_escorts: "$.data.escorts_cents", inv_sub: "$.data.subtotal_cents", inv_fuel: "$.data.fuel_surcharge_cents", inv_total: "$.data.total_cents" } }
          assert:
            - "inv_escorts == 334 (167 + 167; per-line rounding - sum-then-round would give 333 and is rejected)"
            - "inv_sub == 15834 (linehaul 3500 + permits 12000 + escorts 334)"
            - "inv_fuel == 1267 (round_half_up(15834 x 0.08) = round_half_up(1266.72))"
            - "inv_total == 17101"

      - name: fuel_surcharge_tier_keys_on_subtotal_not_total
        grounds:
          - calculations.fuel_surcharge
          - entities.Invoice.fields.fuel_surcharge_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order - the
          fuel surcharge tier keys on the PRE-SURCHARGE subtotal. Subtotal 4800000
          (< 5000000 threshold) keeps the 8% tier even though the resulting total
          5184000 crosses the threshold; keying on total would charge 12%.
        test_recipe:
          setup:
            - "STANDARD load 40000 lbs, 100x50x400 in (no permits, no escorts required); RGN_LOWBOY @ 550 c/mi; 8000 route miles in [OR] -> linehaul 4400000"
            - "DAMAGE fine 400000 reported then resolved CUSTOMER_LIABLE -> fines_cents 400000; subtotal exactly 4800000"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Cascade Timber", credit_limit_cents: 20000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Glulam bundles", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "Eugene OR", destination: "Bend OR" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "RGN_LOWBOY", trailer_axle_count: 2, driver_name: "E. Silva", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 8000, states_crossed: ["OR"], min_bridge_clearance_in: 100, max_bridge_weight_lbs: 80000 }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "STRAPS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /heavy-haul/loads/${load_id}/fines", payload: { kind: "DAMAGE", amount_cents: 400000, description: "Fork tine puncture" }, as: SafetyManager, captures: { fine_id: "$.data.id" } }
            - { call: "POST /heavy-haul/fines/${fine_id}/resolve", payload: { resolution: "CUSTOMER_LIABLE" }, as: SafetyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /heavy-haul/loads/${load_id}/depart", payload: {}, as: Driver }
            - { call: "POST /heavy-haul/loads/${load_id}/arrive", payload: {}, as: Driver }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/invoices", payload: {}, as: BillingClerk, captures: { inv_sub: "$.data.subtotal_cents", inv_fuel: "$.data.fuel_surcharge_cents", inv_total: "$.data.total_cents", inv_fines: "$.data.fines_cents" } }
          assert:
            - "inv_fines == 400000 (RESOLVED_CUSTOMER_LIABLE swept in)"
            - "inv_sub == 4800000 (4400000 linehaul + 400000 fines)"
            - "inv_fuel == 384000 (8% tier: subtotal 4800000 < 5000000; NOT 576000 = 12%)"
            - "inv_total == 5184000 which itself exceeds 5000000 - proving the tier read the subtotal, not the total"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_deny_refile_cycle
        grounds:
          - state_machines.Permit.FILED_to_DENIED
          - state_machines.Permit.DENIED_to_FILED
          - state_machines.Permit.FILED_to_GRANTED
        distinguishing_aspect: |
          Cyclic machine on Permit: FILED -> DENIED -> FILED -> GRANTED. The refile
          loop recomputes fee_cents on the current weight basis; with no scale ticket
          the fee is stable at 29000 across cycles, proving DENIED is non-terminal.
        test_recipe:
          setup:
            - "Load 96000 lbs, 150x100x400 in, states [AZ], SURVEYED; AZ OVERWEIGHT permit created"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Desert Aggregates", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
