              as: ConsortiumAdmin
              captures: { titlel_id: $.data.id }
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${titlel_id}", model: "OCOU", copies: 1, expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { orderl_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${orderl_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${orderl_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${orderl_id}/fulfill"
              payload: { invoiced_cost_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          trigger:
            - call: "POST /lending/loans"
              payload: { patron_id: "${patb_id}", title_id: "${titlel_id}" }
              as: Patron
              as_user_id: "${patb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the cross-library checkout of a LOCAL_ONLY title fails 409 with error_id == ERR_NO_LICENSE_AVAILABLE"
            - "no loan row was created for patron ${patb_id}"

