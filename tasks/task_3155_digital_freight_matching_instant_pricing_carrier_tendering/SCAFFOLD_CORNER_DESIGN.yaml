- section: errors
  instances:
  - name: duplicate_mc_number_returns_duplicate_mc_number
    claim_type: Violation → Error
    grounds:
    - errors.ERR_DUPLICATE_MC_NUMBER
    - validations[priority=13]
    - endpoints.POST_/v1/carriers
    distinguishing_aspect: 'Two carriers cannot share an MC number: onboarding a second carrier with mc_number 100001 already
      on file answers 400 ERR_DUPLICATE_MC_NUMBER and no second carrier row is created, while a distinct MC number in the
      same request shape succeeds.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One carrier onboarded with mc_number 100001.
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/carriers
        payload:
          legal_name: Okafor Freight Systems Inc
          mc_number: '100001'
          dot_number: DOT-100001
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          safety_score: 72.0
          equipment_types:
          - DRY_VAN
        as: ComplianceReviewer
        captures:
          carrier_id: $.data.id
      - call: POST /v1/carrier-equipment
        payload:
          carrier_id: ${carrier_id}
          equipment_type: DRY_VAN
          unit_number: TR-9001
          driver_name: D. Okafor
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          equipment_id: $.data.id
      - call: POST /v1/carriers/${carrier_id}/verify-authority
        payload: {}
        as: ComplianceReviewer
      - call: POST /v1/carriers/${carrier_id}/attest-insurance
        payload:
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          certificate_reference: COI-2026-100001
        as: ComplianceReviewer
      - call: POST /v1/carriers/${carrier_id}/verify-safety
        payload:
          safety_score: 72.0
        as: ComplianceReviewer
        captures:
          carrier_id_v: $.data.version
      trigger:
      - call: POST /v1/carriers
        payload:
          legal_name: Twin Docket Freight Inc
          mc_number: '100001'
          dot_number: DOT-100001B
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          safety_score: 68.0
          equipment_types:
          - DRY_VAN
        as: ComplianceReviewer
        captures:
          error_id: $.data.error_id
      - call: POST /v1/carriers
        payload:
          legal_name: Twin Docket Freight Inc
          mc_number: '100002'
          dot_number: DOT-100002B
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          safety_score: 68.0
          equipment_types:
          - DRY_VAN
        as: ComplianceReviewer
        captures:
          second_carrier: $.data.id
      assert:
      - the first request returns 400 with error_id == ERR_DUPLICATE_MC_NUMBER
      - the retry with mc_number 100002 returns 201
      - GET /v1/carriers?status=PENDING returns exactly 1 row, so the duplicate was never created
      - Carrier.${second_carrier}.mc_number == "100002"
  - name: cargo_coverage_below_minimum_returns_cargo_coverage_below_minimum
    claim_type: Violation → Error
    grounds:
    - errors.ERR_CARGO_COVERAGE_BELOW_MINIMUM
    - errors.ERR_INSURANCE_LIMIT_BELOW_MINIMUM
    - validations[priority=6]
    distinguishing_aspect: 'The two insurance minima are separate checks: coverage of 90,000,000 cents fails the cargo gate
      while the 100,000,000-cent liability limit passes the liability gate, so the answer is ERR_CARGO_COVERAGE_BELOW_MINIMUM
      and not ERR_INSURANCE_LIMIT_BELOW_MINIMUM.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One carrier onboarded with an under-minimum cargo coverage and verified authority.
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/carriers
        payload:
          legal_name: Okafor Freight Systems Inc
          mc_number: '100001'
          dot_number: DOT-100001
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 90000000
          safety_score: 72.0
          equipment_types:
          - DRY_VAN
        as: ComplianceReviewer
        captures:
          carrier_id: $.data.id
      - call: POST /v1/carriers/${carrier_id}/verify-authority
        payload: {}
        as: ComplianceReviewer
      trigger:
      - call: POST /v1/carriers/${carrier_id}/attest-insurance
        payload:
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 90000000
        as: ComplianceReviewer
        captures:
          error_id: $.data.error_id
      assert:
      - the response status is 409 and error_id == ERR_CARGO_COVERAGE_BELOW_MINIMUM
      - error_id != ERR_INSURANCE_LIMIT_BELOW_MINIMUM because the liability limit is at the floor
      - Carrier.${carrier_id}.status == AUTHORITY_VERIFIED and status != INSURANCE_ON_FILE
  - name: insurance_just_expired_returns_insurance_expired_at_the_instant
    claim_type: Violation → Error
    grounds:
    - errors.ERR_INSURANCE_EXPIRED
    - calculations.insurance_expiry_sweep
    - state_machines.Carrier.AUTHORITY_VERIFIED_to_INSURANCE_ON_FILE
    distinguishing_aspect: 'The certificate check is exclusive at the boundary: a certificate expiring at exactly 2026-10-01T00:00:00Z
      passes attestation while the clock reads 2026-09-30T23:59:59Z and fails with ERR_INSURANCE_EXPIRED one second later,
      when the comparison becomes <=.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One carrier with verified authority.
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/carriers
        payload:
          legal_name: Okafor Freight Systems Inc
          mc_number: '100001'
          dot_number: DOT-100001
          insurance_expires_at: '2026-10-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          safety_score: 72.0
          equipment_types:
          - DRY_VAN
        as: ComplianceReviewer
        captures:
          carrier_id: $.data.id
      - call: POST /v1/carriers/${carrier_id}/verify-authority
        payload: {}
        as: ComplianceReviewer
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-30T23:59:59Z'
        as: PlatformAdmin
      trigger:
      - call: POST /v1/carriers/${carrier_id}/attest-insurance
        payload:
          insurance_expires_at: '2026-10-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
        as: ComplianceReviewer
        captures:
          early_error: $.data.error_id
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-10-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/carriers/${carrier_id}/reinstate
        payload: {}
        as: PlatformAdmin
        captures:
          late_error: $.data.error_id
      assert:
      - the attestation at 23:59:59 returns 200 and Carrier.${carrier_id}.status == INSURANCE_ON_FILE
      - error_id 'early_error' is not ERR_INSURANCE_EXPIRED
      - the reinstate at exactly 2026-10-01T00:00:00Z returns 409 with error_id == ERR_INSURANCE_EXPIRED
      - the comparison is <= so the clock reaching the expiry instant is enough to fail
  - name: safety_score_above_eighty_returns_safety_score_too_low
