  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Three pairs drawn from three different endpoints, each pair chosen so that
  # BOTH rules are genuinely violated by the SAME request and the loser is then
  # shown in isolation by relaxing only the winner's condition.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_account_outranks_out_of_window_slot_on_visit_booking
        grounds:
          - validations.priority_20_ERR_ACCOUNT_NOT_ACTIVE
          - validations.priority_32_ERR_OUTSIDE_ACCESS_WINDOW
          - state_machines.ServiceAccount.ACTIVE_to_SUSPENDED
          - state_machines.ServiceAccount.SUSPENDED_to_ACTIVE
          - endpoints.POST_service_visits
        distinguishing_aspect: |
          P20 (409, account state) vs P32 (422, slot geometry) on
          POST /service-visits. The identical 300-400 payload is sent twice
          against the identical account; the only thing that changes between
          the two attempts is the account's status, and the error flips from
          ERR_ACCOUNT_NOT_ACTIVE to ERR_OUTSIDE_ACCESS_WINDOW - proving P20
          masked P32 rather than the request simply being malformed. A third
          in-window attempt then succeeds, proving nothing else was wrong.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "ServiceAccount 'Beacon Alehouse' access window 480-1080, contracted_line_count 4, ACTIVE contract, lines_out_of_service_count 0, and NO visits at all (so a manual suspension is permitted by P53)."
            - "Technician 'Nils Okonkwo' CERTIFIED, ACTIVE."
            - "The account is then manually suspended, which also drags the contract to SUSPENDED."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Beacon Alehouse", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Nils Okonkwo", certification_level: "CERTIFIED", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/accounts/${acct}/status"
              payload: { to_status: "SUSPENDED" }
              as: QualityAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 300, scheduled_end_minute: 400 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err_state: $.data.error_id }
            - call: "POST /draft-service/accounts/${acct}/status"
              payload: { to_status: "ACTIVE" }
              as: QualityAuditor
              as_user_id: "auditor-1"
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 300, scheduled_end_minute: 400 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err_window: $.data.error_id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 480, scheduled_end_minute: 1080 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit_ok: $.data.id }
          assert:
            - "first POST /draft-service/service-visits returns HTTP 409 with error_id ERR_ACCOUNT_NOT_ACTIVE"
            - "${err_state} == ERR_ACCOUNT_NOT_ACTIVE"
            - "ServiceContract.${ctr}.status == ACTIVE after the reactivation"
            - "ServiceAccount.${acct}.status == ACTIVE after the reactivation"
            - "ServiceAccount.${acct}.suspended_reason == NONE"
            - "second POST /draft-service/service-visits returns HTTP 422 with error_id ERR_OUTSIDE_ACCESS_WINDOW"
            - "${err_window} == ERR_OUTSIDE_ACCESS_WINDOW"
            - "third POST /draft-service/service-visits returns HTTP 201"
            - "ServiceVisit.${visit_ok}.work_status == SCHEDULED"
            - "ServiceVisit.${visit_ok}.scheduled_end_minute == 1080"

