  - rule_id: boundary_precision_check
    instances:

      - name: polypharmacy_threshold_at_exactly_ten_medications
        grounds:
          - calculations.composite_readmission_risk_score
          - calculations.screening_barrier_derivation
          - entities.RiskScreening.fields.medication_count
          - state_machines.RiskScreening.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Metric 1 of 2 — a numeric threshold crossing on medication_count reached through
          POST /screenings/{id}/submit: 9 medications score 43 (MODERATE, zero auto-barriers)
          and 10 medications score 50 (HIGH, one PHYSICIAN_ORDER auto-barrier), so the
          POLYPHARMACY_THRESHOLD comparison must be >= 10 and not > 10.
        test_recipe:
          setup:
            - "One payer and two patients that are identical except for their MRN: prior_admissions_180d 2, lives_alone false, has_pcp false"
            - "Episode A already has a submitted ADMISSION screening with medication_count 9"
            - "Episode B has a DRAFT ADMISSION screening with medication_count 10, identical in every other score"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200, snf_auth_required: false, hh_auth_required: false, auth_expiry_days: 30 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-6001", full_name: "Lea Marchetti", date_of_birth: "1950-10-10", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: false }
              as: PlatformAdmin
              captures: { pat9_id: $.data.id }
            - call: "POST /patients"
