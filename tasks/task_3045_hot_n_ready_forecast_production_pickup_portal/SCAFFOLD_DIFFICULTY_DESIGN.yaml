  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_shift_half_open_overlap_back_to_back_allowed
        grounds:
          - calculations.crew_shift_conflict
          - validations[priority=8]
          - errors[ERR_SHIFT_CONFLICT]
        distinguishing_aspect: |
          Half-open [start,end) semantics on the CrewShift resource: a
          candidate shift for the same crew member with
          start_minute == existing.end_minute (back-to-back) does NOT conflict
          and is accepted, while start_minute == existing.end_minute - 1 is
          rejected — the boundary treatment is strict-exclusion adjacency.
        test_recipe:
          setup:
            - "StoreDay 2026-09-24 created; existing shift crew-9 OVEN [600, 780)"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-24" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/crew-shifts"
              payload: { crew_member_id: "crew-9", station: "OVEN", start_minute: 600, end_minute: 780 }
              as: ShiftLead
              captures: { sh1_id: $.data.id }
          trigger:
            - call: "POST /store-days/${sd_id}/crew-shifts"
              payload: { crew_member_id: "crew-9", station: "CUT_TABLE", start_minute: 780, end_minute: 900 }
              as: ShiftLead
              captures: { sh2_id: $.data.id }
            - call: "POST /store-days/${sd_id}/crew-shifts"
              payload: { crew_member_id: "crew-9", station: "CUT_TABLE", start_minute: 899, end_minute: 960 }
              as: ShiftLead
              captures: { sh3_err: $.data.error_id }
          assert:
            - "Back-to-back shift [780,900) accepted (half-open adjacency is not overlap)"
            - "Shift [899,960) rejected with ERR_SHIFT_CONFLICT (1 minute of real overlap with [780,900))"
      - name: demand_event_closed_interval_adjacency_is_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_EVENT_WINDOW_OVERLAP]
          - entities.DemandEvent.fields.window_start_at
        distinguishing_aspect: |
          Different resource (DemandEvent) with DIFFERENT interval semantics —
          closed [start, end]: a candidate event whose window_start_at equals an
          existing event's window_end_at shares the boundary instant, which IS
          an intersection under closed semantics, so it MUST be rejected — the
          opposite treatment from the crew-shift half-open rule.
        test_recipe:
          setup:
            - "StoreDay 2026-09-25 created; existing event 12:00Z-14:00Z multiplier 1.5"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-25" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/demand-events"
              payload: { name: "Lunch Rush", window_start_at: "2026-09-25T12:00:00Z", window_end_at: "2026-09-25T14:00:00Z", demand_multiplier: 1.5 }
              as: StoreManager
              captures: { ev1_id: $.data.id }
          trigger:
            - call: "POST /store-days/${sd_id}/demand-events"
              payload: { name: "Adjacent Rally", window_start_at: "2026-09-25T14:00:00Z", window_end_at: "2026-09-25T16:00:00Z", demand_multiplier: 2.0 }
              as: StoreManager
              captures: { ev2_err: $.data.error_id }
          assert:
            - "Adjacent event create returns ERR_EVENT_WINDOW_OVERLAP (closed interval: shared endpoint 14:00Z is an intersection)"
            - "DemandEvent.${ev1_id}.status == SCHEDULED (unchanged)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pay_cancel_round_trip_restores_preorder_reservation
        grounds:
          - state_machines.Order.payment_UNPAID_to_payment_PAID
          - state_machines.Order.fulfillment_PLACED_or_IN_PREPARATION_to_fulfillment_CANCELLED
          - entities.Daypart.fields.preorder_reserved_units
        distinguishing_aspect: |
          Conserved quantity: Daypart.preorder_reserved_units. Forward action
          pay (+3) paired with its compensating action cancel (-3) MUST leave
          preorder_reserved_units and the derived made_ahead_target bit-identical
          to their pre-pay values — no drift.
        test_recipe:
          setup:
            - "StoreDay 2026-09-26; DINNER daypart PLANNED, base 20, rack 20 (forecast 20, target 12, reserved 0)"
            - "PORTAL_PREORDER of 3 units placed"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-26" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "DINNER", window_start_minute: 960, window_end_minute: 1080, rack_capacity: 20, base_demand_units: 20 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_pep: $.data.id }
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-10"
                kind: "PORTAL_PREORDER"
                lines:
                  - { product_id: "${p_pep}", quantity: 3, customized: false }
              as: Customer
              as_user_id: "cust-10"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-10"
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "cust-10"
            - call: "GET /dayparts/${dp_id}"
              payload: {}
              as: StoreManager
              captures: { dp_reserved: $.data.preorder_reserved_units, dp_target: $.data.made_ahead_target }
          assert:
            - "Order.${ord_id}.fulfillment_status == CANCELLED"
            - "Order.${ord_id}.payment_status == REFUNDED"
            - "Daypart.${dp_id}.preorder_reserved_units == 0 (invariant restored)"
            - "Daypart.${dp_id}.made_ahead_target == 12 (derived target restored)"
      - name: discard_compensation_preserves_rack_accounting
        grounds:
          - state_machines.HoldUnit.HOLDING_to_DISCARDED
          - state_machines.ProductionRun.HOLDING_to_CLOSED
          - entities.StoreDay.fields.produced_units
          - entities.ProductionRun.fields.units_available
        distinguishing_aspect: |
          Different conserved quantity (produced-unit accounting, vs preorder
          reservation): rack(+3 units_available, +3 produced_units) followed by
          manual discard of all 3 units MUST satisfy
          units_available + discarded + allocated + sold == quantity (0 + 3 + 0
          + 0 == 3) and leave StoreDay.produced_units == 3 — production is
          conserved, only hold availability is compensated.
        test_recipe:
          setup:
            - "StoreDay 2026-09-27 opened; LUNCH daypart ACTIVE at 10:35Z; batches ready; run of 3 racked"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-27T08:00:00Z" }
              as: StoreManager
            - call: "POST /store-days"
              payload: { business_date: "2026-09-27" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /store-days/${sd_id}/dough-batches"
              payload: { size_units: 10 }
              as: CrewMember
              captures: { db_id: $.data.id }
            - call: "POST /store-days/${sd_id}/cheese-batches"
              payload: { size_units: 10 }
              as: CrewMember
              captures: { cb_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_pep: $.data.id }
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-27T10:05:00Z" }
              as: StoreManager
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-27T10:35:00Z" }
              as: StoreManager
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /dayparts/${dp_id}/production-runs"
              payload: { product_id: "${p_pep}", dough_batch_id: "${db_id}", cheese_batch_id: "${cb_id}", quantity: 3 }
              as: ShiftLead
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/start-baking"
              payload: {}
              as: CrewMember
            - call: "POST /production-runs/${run_id}/rack"
              payload: {}
              as: CrewMember
            - call: "GET /hold-units"
              payload: { production_run_id: "${run_id}", status: "HOLDING" }
              as: CrewMember
              captures: { hu1: "$.data[0].id", hu2: "$.data[1].id", hu3: "$.data[2].id" }
          trigger:
            - call: "POST /hold-units/${hu1}/discard"
              payload: { reason: "DAMAGED" }
              as: ShiftLead
            - call: "POST /hold-units/${hu2}/discard"
              payload: { reason: "QUALITY" }
              as: ShiftLead
            - call: "POST /hold-units/${hu3}/discard"
              payload: { reason: "DAMAGED" }
              as: ShiftLead
            - call: "GET /production-runs/${run_id}"
              payload: {}
              as: CrewMember
              captures: { run_avail: $.data.units_available, run_status: $.data.status }
            - call: "GET /store-days/${sd_id}"
              payload: {}
              as: StoreManager
              captures: { sd_produced: $.data.produced_units, sd_discarded: $.data.discarded_units }
          assert:
            - "ProductionRun.${run_id}.units_available == 0 and status == CLOSED (auto-close at zero)"
            - "StoreDay.${sd_id}.produced_units == 3 (production conserved — discard does not un-produce)"
            - "StoreDay.${sd_id}.discarded_units == 3"
            - "units_available(0) + discarded(3) + allocated(0) + sold(0) == quantity(3)"
