          - entities.RecallCampaign.fields.completion_pct_notice_based
          - entities.RecallCampaign.fields.completion_pct_population_based
          - endpoints[GET /mfg/recall-campaigns/{id}/completion]
        distinguishing_aspect: >
          The two variants divide the SAME single remedied notice by two different denominators produced by
          the SAME announce fan-out: notice_based divides by notice_count 2 (only the two SHIPPED units got a
          notice) while population_based divides by affected_unit_count 3 (the LABELED unit was held instead of
          noticed), giving 50.00 and 33.33 - and only the population_based value gates IN_REMEDY_to_CLOSED.
        test_recipe:
          setup:
            - "Model GX50-T is CERTIFIED and RELEASED; three units are labelled with serials GX50-T-202608-00001..00003."
            - "Units u1 and u2 are SHIPPED; unit u3 is still LABELED inside the plant."
            - "Campaign RC-001 is SCOPED over the full serial range with affected_unit_count 3, then ANNOUNCED."
            - "The announce created PENDING notices for u1 and u2 only, and put u3 on HELD."
            - "The notice for u1 has been notified and remedied; the notice for u2 is still PENDING."
