            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
          trigger:
            - call: "GET /quotes?contractor_account_id=${acct_id}&limit=1&offset=0"
              payload: {}
              as: Estimator
