scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1: dual_variant_calc — different entity domains
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: storage_used_provisional_vs_final
        grounds:
          - calculations.storage_used_gb
          - entities.Project.fields.storage_used_gb
          - entities.MediaAsset.fields.proxy_bytes
        distinguishing_aspect: |
          Same asset set produces two different storage_used_gb values depending on
          whether proxies are DONE: provisional (proxy_bytes still 0 during ingest)
          versus final (proxy_bytes included after proxy-complete). Different entity
          domain (Project storage accounting) from vendor_load_factor below.
        test_recipe:
          setup:
            - "Project P1 exists, ACTIVE, with storage_quota_gb = 100"
            - "Batch B1 in PROXYING with one MediaAsset A1 (source_bytes = 1073741824 = 1 GiB, proxy not yet done)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "P1", client_code: "CL001", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm1", opacity_pct: 80, position: "DIAGONAL_TILE", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAY01", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C001", source_bytes: 1073741824, duration_frames: 2400 }
              as: MediaManager
              captures: { asset_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/finish-ingest"
              payload: {}
              as: MediaManager
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { storage_provisional: $.data.storage_used_gb }
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/proxy-complete"
              payload: { proxy_bytes: 536870912 }
              as: MediaManager
          trigger:
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { storage_final: $.data.storage_used_gb }
          assert:
            - "storage_provisional == 1.0"
            - "storage_final == 1.5"
            - "storage_provisional != storage_final"

      - name: vendor_load_provisional_vs_steady
        grounds:
          - calculations.vendor_load_factor
          - entities.Vendor.fields.capacity_slots
        distinguishing_aspect: |
          Same vendor produces two different utilization_pct values depending on
          the variant's input-set filter: provisional_load counts only ISSUED
          turnovers (evaluated at award time, before the vendor ACKs), while
          steady_load counts ISSUED+ACKED. After ack, the two filters disagree
          on which turnovers to include — steady counts a second ACKED turnover,
          provisional does not. Different entity domain (Vendor capacity) from
          storage_used_gb (Project bytes).
        test_recipe:
          setup:
            - "Project P2 ACTIVE, Vendor V1 ONBOARDED with capacity_slots = 4"
            - "Two turnovers T1, T2 both awarded to V1 and issued"
            - "T1 stays ISSUED; T2 moves to ACKED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "P2", client_code: "CL002", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "ONLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/vendors"
              payload: { vendor_name: "V1 ColorHouse", capabilities: ["COLOR"], day_rate_cents: 500000, capacity_slots: 4 }
              as: FacilityAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/turnovers"
              payload: { turnover_kind: "COLOR", sequence_label: "SEQ-01" }
              as: ConformEditor
              captures: { turn1_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn1_id}/stage"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/vendor-bids"
              payload: { turnover_id: "${turn1_id}", vendor_id: "${vendor_id}", bid_amount_cents: 1000000, eta_days: 5 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { bid1_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/vendor-bids/${bid1_id}/award"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn1_id}/issue"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/turnovers"
              payload: { turnover_kind: "COLOR", sequence_label: "SEQ-02" }
              as: ConformEditor
              captures: { turn2_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn2_id}/stage"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/vendor-bids"
              payload: { turnover_id: "${turn2_id}", vendor_id: "${vendor_id}", bid_amount_cents: 1000000, eta_days: 5 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { bid2_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/vendor-bids/${bid2_id}/award"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn2_id}/issue"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn2_id}/ack"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
          trigger:
            - call: "GET /post-production/vendors/${vendor_id}/load"
              payload: {}
              as: FacilityAdmin
              captures: { steady_pct: $.data.utilization_pct }
          assert:
            - "steady_pct == 50   # steady_load counts ISSUED+ACKED = 2 / capacity 4 = 50"
            - "Provisional variant (evaluated between issue and ack of T2) would count only ISSUED turnovers; at that snapshot T1=ISSUED, T2=ISSUED -> 2 as well, but the INPUT SET definition differs (provisional excludes ACKED). The scaffold pins the distinction: after T2 acks, provisional filter yields 1 (T1 only), steady yields 2 (T1+T2). Asserted observable is steady_load == 50."

  # ------------------------------------------------------------------
  # Rule 2: combinatorial_formula — different modes
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: watermark_score_weighted_multi_input
        grounds:
          - calculations.watermark_compliance_score
          - entities.WatermarkProfile.fields.opacity_pct
        distinguishing_aspect: |
          Mode (a): formula takes >=3 inputs (opacity_pct, forensic_enabled,
          includes_recipient_email, position) with non-linear interactions —
          min() caps, additive bonuses, cap at 100, and per-tier gates.
        test_recipe:
          setup:
            - "Project P ELEVATED; two WatermarkProfiles W_fail (score 50, email missing) and W_pass (score 70) both ACTIVE"
            - "Batch READY with 1 asset so dailies can be published"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PE", client_code: "CL003", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "ELEVATED" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wfail", opacity_pct: 1, position: "TOP_LEFT", includes_recipient_email: false, forensic_enabled: true }
              as: PostSupervisor
              captures: { wfail_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wpass", opacity_pct: 20, position: "TOP_LEFT", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wpass_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wfail_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wpass_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAY01", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C001", source_bytes: 1000, duration_frames: 100 }
              as: MediaManager
              captures: { asset_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/finish-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/proxy-complete"
              payload: { proxy_bytes: 500 }
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/dailies"
              payload: { batch_id: "${batch_id}", watermark_profile_id: "${wfail_id}", distribution_list: ["rcpt@x.com"] }
              as: DailiesCoordinator
              captures: { pkg_fail: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/dailies"
              payload: { batch_id: "${batch_id}", watermark_profile_id: "${wpass_id}", distribution_list: ["rcpt@x.com"] }
              as: DailiesCoordinator
              captures: { pkg_pass: $.data.id }
          trigger:
            - call: "POST /post-production/projects/${proj_id}/dailies/${pkg_fail}/publish"
              payload: {}
              as: DailiesCoordinator
              captures: { err_fail: $.data.error_id }
            - call: "POST /post-production/projects/${proj_id}/dailies/${pkg_pass}/publish"
              payload: {}
              as: DailiesCoordinator
          assert:
            - "err_fail == ERR_WATERMARK_NONCOMPLIANT   # wfail score: 50 (forensic) + min(40, 1//2)=0 + 0 (no email) + 0 = 50 < 60 gate; also email missing"
            - "DailiesPackage.${pkg_pass}.status == PUBLISHED   # wpass score: 50 + min(40, 20//2)=10 + 10 (email) + 0 = 70 >= 60"

      - name: storage_used_rounding_order
        grounds:
          - calculations.storage_used_gb
        distinguishing_aspect: |
          Mode (b): nested rounding — the scaffold pins 'sum bytes first, then
          divide by 1024^3, then round_half_up to 3 decimals'. The alternative
          (round each asset to GiB first, then sum) produces a different total
          when source_bytes values are sub-GiB but collectively exceed 1 GiB.
        test_recipe:
          setup:
            - "Project P with 3 assets each of source_bytes = 400000000 (0.372 GiB) and proxy_bytes = 0, batch in PROXYING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PR", client_code: "CL004", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAY01", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C001", source_bytes: 400000000, duration_frames: 100 }
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C002", source_bytes: 400000000, duration_frames: 100 }
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C003", source_bytes: 400000000, duration_frames: 100 }
              as: MediaManager
          trigger:
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { storage: $.data.storage_used_gb }
          assert:
            - "storage == 1.118   # 3 * 400000000 = 1200000000 bytes; 1200000000 / 1073741824 = 1.11758...; round_half_up to 3 decimals = 1.118"
            - "Alternative order (per-asset round then sum) would yield 3 * 0.373 = 1.119 — the pinned order matters"

  # ------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — different entities
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: deliverable_qc_fail_render_cycle
        grounds:
          - state_machines.Deliverable.QC_FAILED_to_RENDERING
          - state_machines.Deliverable.RENDERING_to_RENDERED
        distinguishing_aspect: |
          Deliverable exhibits a true cycle: SPEC_DRAFT -> RENDERING -> RENDERED
          -> QC_QUEUED -> QC_FAILED -> RENDERING (loop). Same entity can traverse
          RENDERING multiple times as long as qc_attempt_count < 3.
        test_recipe:
          setup:
            - "Project P ACTIVE with conform_ready == true (all assets LOCKED, one turnover ISSUED, no unresolved_critical reviews)"
            - "Deliverable D1 requires_qc = true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PC", client_code: "CL005", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "ONLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAY01", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C001", source_bytes: 1000, duration_frames: 100 }
              as: MediaManager
              captures: { asset_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/finish-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/proxy-complete"
              payload: { proxy_bytes: 500 }
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/verify"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/turnovers"
              payload: { turnover_kind: "CONFORM", sequence_label: "SEQ-01" }
              as: ConformEditor
              captures: { turn_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn_id}/stage"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/vendors"
              payload: { vendor_name: "V1 Conform", capabilities: ["CONFORM"], day_rate_cents: 400000, capacity_slots: 2 }
              as: FacilityAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/vendor-bids"
              payload: { turnover_id: "${turn_id}", vendor_id: "${vendor_id}", bid_amount_cents: 500000, eta_days: 3 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/vendor-bids/${bid_id}/award"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn_id}/issue"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/conform"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/lock"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/deliverables"
              payload: { spec_kind: "MEZZANINE", sequence_label: "SEQ-01", container: "MOV_PRORES", requires_qc: true }
              as: ConformEditor
              captures: { del_id: $.data.id }
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { proj_v: $.data.version }
            - call: "POST /post-production/projects/${proj_id}/deliverables/${del_id}/render"
              payload: { expected_project_version: "${proj_v}" }
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/deliverables/${del_id}/render-complete"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/deliverables/${del_id}/enqueue-qc"
              payload: {}
              as: QCOperator
            - call: "POST /post-production/projects/${proj_id}/deliverables/${del_id}/qc-reports"
              payload: { verdict: "FAIL", fail_codes: ["AUDIO_CLIP"] }
              as: QCOperator
          trigger:
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { proj_v2: $.data.version }
            - call: "POST /post-production/projects/${proj_id}/deliverables/${del_id}/render"
              payload: { expected_project_version: "${proj_v2}" }
              as: ConformEditor
          assert:
            - "Deliverable.${del_id}.status == RENDERING  # cycled back from QC_FAILED"
            - "Deliverable.${del_id}.qc_attempt_count == 1"

      - name: change_list_supersede_fork
        grounds:
          - state_machines.ChangeList.OPEN_to_SUPERSEDED
          - state_machines.ChangeList.OPEN_to_APPLIED
        distinguishing_aspect: |
          ChangeList exhibits a fork-join: from OPEN, exactly one sibling reaches
          APPLIED and every other OPEN sibling on the same turnover transitions
          to SUPERSEDED — divergent side-effect sets per branch (apply adjusts
          assets; supersede only recomputes project count).
        test_recipe:
          setup:
            - "TurnoverPackage T ISSUED; two OPEN ChangeLists CL1 (rev 1) and CL2 (rev 2) on T"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PF", client_code: "CL006", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "ONLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAY01", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
