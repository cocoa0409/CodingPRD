            - "Member m1 in G1 block BX already holds an ACTIVE captain assignment on BX."
            - "Trigger: create a captain assignment for m1 on G2's block BY — m1.block's group (G1) != BY's group (G2) violates referential integrity, and m1 already holds an ACTIVE assignment violating the one-active-captain constraint."
