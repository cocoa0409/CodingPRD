  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (Study cycle vs SampleUnit cycle)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: study_analysis_reopen_cycle
        grounds:
          - state_machines.Study.ANALYSIS_to_IN_PROGRESS
          - state_machines.Study.IN_PROGRESS_to_ANALYSIS
        distinguishing_aspect: |
          Study cycles IN_PROGRESS -> ANALYSIS -> IN_PROGRESS -> ANALYSIS
          (reopen loop, not a one-way pipeline), and the re-entry is observable:
          a new time point at day 30 can only be added after reopening. Entity:
          Study — distinct from the SampleUnit cycle instance.
        test_recipe:
          setup:
            - "REAL_TIME study (target 60, threshold 6.0, delta 3.0), 1 control arm, tp0, activated at clock 2026-08-01; tp0 SKIPPED; fieldwork closed once (study in ANALYSIS)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Cycle Co", contact_email: "cycle@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Chips", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/close-fieldwork", payload: {}, as: SensoryScientist, captures: { study_after_close: $.data.status } }
          trigger:
            - { call: "POST /sensory-lab/studies/${study_id}/reopen-fieldwork", payload: {}, as: SensoryScientist, captures: { status_reopened: $.data.status } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 30 }, as: SensoryScientist, captures: { tp30: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points/${tp30}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/close-fieldwork", payload: {}, as: SensoryScientist, captures: { status_closed2: $.data.status } }
          assert:
            - "after first close-fieldwork: Study.${study_id}.status == ANALYSIS"
            - "after reopen-fieldwork: Study.${study_id}.status == IN_PROGRESS (cyclic re-entry succeeded)"
            - "SamplingTimePoint.${tp30} was creatable post-reopen (day_index 30 > current study day 0) with status == PENDING"
            - "after skipping tp30 and closing again: Study.${study_id}.status == ANALYSIS (loop completed twice)"

      - name: sample_unit_checkout_return_cycle
        grounds:
          - state_machines.SampleUnit.STORED_to_CHECKED_OUT
          - state_machines.SampleUnit.CHECKED_OUT_to_STORED
          - calculations.chamber_occupancy
        distinguishing_aspect: |
          SampleUnit loops STORED -> CHECKED_OUT -> STORED -> CHECKED_OUT ->
          CONSUMED; reserved_units counts {STORED, CHECKED_OUT} so it stays 1
          through the loop and drops to 0 only at CONSUMED. Entity: SampleUnit —
          distinct from the Study cycle instance.
        test_recipe:
          setup:
            - "REAL_TIME study IN_PROGRESS; chamber CH-CYC (20C, capacity 10); 1 RETAIN unit pulled at tp0 (reserved_units == 1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Unit Co", contact_email: "unit@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Nuts", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "VACUUM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp_id: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-CYC", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "RETAIN" }, as: SensoryScientist }
            - { call: "GET /sensory-lab/sample-units", payload: { time_point_id: "${tp_id}" }, as: LabDirector, captures: { unit_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /sensory-lab/sample-units/${unit_id}/checkout", payload: {}, as: PanelCoordinator, captures: { st1: $.data.status } }
            - { call: "GET /sensory-lab/chambers/${chamber_id}", payload: {}, as: LabDirector, captures: { res_after_checkout: $.data.reserved_units } }
            - { call: "POST /sensory-lab/sample-units/${unit_id}/return", payload: {}, as: PanelCoordinator, captures: { st2: $.data.status } }
            - { call: "POST /sensory-lab/sample-units/${unit_id}/checkout", payload: {}, as: PanelCoordinator, captures: { st3: $.data.status } }
            - { call: "POST /sensory-lab/sample-units/${unit_id}/consume", payload: {}, as: PanelCoordinator, captures: { st4: $.data.status } }
            - { call: "GET /sensory-lab/chambers/${chamber_id}", payload: {}, as: LabDirector, captures: { res_after_consume: $.data.reserved_units } }
            - { call: "POST /sensory-lab/sample-units/${unit_id}/consume", payload: {}, as: PanelCoordinator, captures: { err_second_consume: $.data.error_id } }
          assert:
            - "checkout #1: SampleUnit.${unit_id}.status == CHECKED_OUT and reserved_units still == 1 (CHECKED_OUT counts as occupying)"
            - "return: status == STORED and reserved_units still == 1 (cycle is occupancy-neutral)"
            - "checkout #2: status == CHECKED_OUT (loop re-entered)"
            - "consume: status == CONSUMED and StorageChamber.${chamber_id}.reserved_units == 0"
            - "second consume on terminal CONSUMED unit rejected with ERR_INVALID_SAMPLE_STATE"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (lab-result trigger depth 4; no-show trigger depth 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lab_result_trip_supersedes_recommendation_reverts_report
        grounds:
          - state_machines.DateCodeRecommendation.ACCEPTED_to_SUPERSEDED
          - state_machines.StudyReport.transitions
          - calculations.shelf_life_equivalent_days
        distinguishing_aspect: |
          Depth-4 chain from POST /sensory-lab/lab-test-results: result trips the
          APC limit -> StudyArm.computed_failure_day_equiv recomputed (10.0) ->
          the arm's ACCEPTED DateCodeRecommendation becomes SUPERSEDED -> the
          pinned StudyReport in CLIENT_REVIEW auto-reverts to DRAFT with
          requires_revision == true and revision_count == 1. Each link is caused
          by the previous one; trigger differs from the no-show cascade.
        test_recipe:
          setup:
            - "REAL_TIME study (target 60, threshold 6.0, delta 3.0), 1 control arm, tp day 10 SKIPPED, in ANALYSIS -> REPORTING"
            - "Recommendation for the arm PROPOSED (TARGET_FALLBACK, computed_days 42) then ACCEPTED (study auto-advances to REPORTING)"
            - "Report authored by sci-author, recommendation attached, submitted, qa-approved by qa-1 -> CLIENT_REVIEW"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Cascade Co", contact_email: "cascade@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Jerky", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 10 }, as: SensoryScientist, captures: { tp_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/close-fieldwork", payload: {}, as: SensoryScientist }
            - { call: "GET /sensory-lab/studies/${study_id}", payload: {}, as: SensoryScientist, captures: { study_v: $.data.version } }
            - { call: "POST /sensory-lab/date-code-recommendations", payload: { study_id: "${study_id}", arm_id: "${arm_id}", expected_study_version: "${study_v}" }, as: SensoryScientist, captures: { rec_id: $.data.id } }
            - { call: "POST /sensory-lab/date-code-recommendations/${rec_id}/accept", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/study-reports", payload: { study_id: "${study_id}", title: "Jerky report" }, as: SensoryScientist, as_user_id: "sci-author", captures: { report_id: $.data.id } }
            - { call: "POST /sensory-lab/study-reports/${report_id}/attach-recommendation", payload: { recommendation_id: "${rec_id}" }, as: SensoryScientist, as_user_id: "sci-author" }
            - { call: "POST /sensory-lab/study-reports/${report_id}/submit", payload: {}, as: SensoryScientist, as_user_id: "sci-author" }
            - { call: "POST /sensory-lab/study-reports/${report_id}/qa-approve", payload: {}, as: QAOfficer, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /sensory-lab/lab-test-results", payload: { study_id: "${study_id}", arm_id: "${arm_id}", time_point_id: "${tp_id}", test_type: "APC", measured_value: 9.0 }, as: LabAnalyst, captures: { lr_id: $.data.id } }
          assert:
            - "LabTestResult.${lr_id}.tripped == true (9.0 >= APC limit 6.0)"
            - "StudyArm.${arm_id}.computed_failure_day_equiv == 10.0 (REAL_TIME: day_index as-is)"
            - "Study.${study_id}.earliest_failure_day_equiv == 10.0"
            - "DateCodeRecommendation.${rec_id}.status == SUPERSEDED (ACCEPTED rec superseded when the arm failure day changed)"
            - "StudyReport.${report_id}.status == DRAFT (auto-reverted from CLIENT_REVIEW)"
            - "StudyReport.${report_id}.requires_revision == true and revision_count == 1"

      - name: no_show_suspension_excuses_future_assignments
        grounds:
          - state_machines.PanelAssignment.ASSIGNED_to_NO_SHOW
          - state_machines.Panelist.QUALIFIED_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain from POST .../mark-no-show (different trigger than the
          lab-result cascade): 3rd no-show -> Panelist QUALIFIED -> SUSPENDED ->
          the panelist's remaining ASSIGNED assignment on a PLANNED session ->
          EXCUSED automatically. Asserts pin every hop plus the counter.
        test_recipe:
          setup:
            - "REAL_TIME study IN_PROGRESS; tps day 0 and day 1; arms STANDARD_FILM (control) and HIGH_BARRIER; chamber cap 10"
            - "Sessions S1 (tp0, ctrl, 2026-08-02 09:00-10:00), S2 (tp0, var, 10:00-11:00), S3 (tp1, ctrl, 11:00-12:00), S4 (tp1, var, 12:00-13:00); one pulled unit per (tp, arm)"
