# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3411_proprietary_variety_licensing_independent_growers_quality_grading
# Breadth probe over §1.1–§1.7. Corners already exercised by §1.8 appear as
# excluded_because stubs. Corner pool scenario: H1 only (net 1150 PREMIUM,
# wkg 1322.5) plus HY excluded at week_end. Close @500: gross 575000, fee 34500,
# net 540500, rate 408.6957, lot gross 540500. Settle @520: gross 598000,
# fee 35880, net 562120, rate 425.0435, lot gross 562120.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: variety_create_returns_declared_fields_and_development
        claim_type: Creation
        grounds:
          - entities.Variety
          - response_envelope
        distinguishing_aspect: "A variety created with code/type/name comes back 201 with status DEVELOPMENT (never client-supplied), version 1, server id, and created_at/updated_at stamped from the LOGICAL clock (2026-06-01T00:00:00Z), wrapped in the standard envelope."
        test_recipe:
          setup: ["Logical clock pinned at 2026-06-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_v1
              call: "POST /licensing/varieties"
              payload: { variety_code: "BRB-STR-01", berry_type: "STRAWBERRY", name: "Cielo Rojo" }
              as: BreedingManager
              captures: { v1_id: $.data.id }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id / meta.api_request_timestamp are present"
            - "Variety.${v1_id}.variety_code == \"BRB-STR-01\", berry_type == STRAWBERRY, name == \"Cielo Rojo\""
            - "Variety.${v1_id}.status == DEVELOPMENT and released_at / recalled_at are null"
            - "Variety.${v1_id}.version == 1 and created_at == 2026-06-01T00:00:00Z (logical clock, not wall clock)"
            - "id is a server-minted UUID with no type prefix"

      - name: variety_create_missing_berry_type_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Variety.fields.berry_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "berry_type is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST, not a 422."
        test_recipe:
          setup: ["Logical clock pinned; empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /licensing/varieties"
              payload: { variety_code: "BRB-BLK-02", name: "No Type Berry" }
              as: BreedingManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 with error_id == ERR_INVALID_REQUEST and response_type error"
            - "data carries both error_id and message"

      - name: agreement_create_bad_practice_enum_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.GrowerAgreement.fields.cultural_practice_codes
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "cultural_practice_codes is a closed enum array; HYDROPONICS is not a member and is rejected 400 before any business rule runs."
        test_recipe:
          setup: ["V1 RELEASED; grower G1 ACTIVE."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - &c_v1_rel
              call: "POST /licensing/varieties/${v1_id}/release"
              payload: {}
              as: BreedingManager
            - &c_g1
              call: "POST /licensing/growers"
              payload: { legal_name: "Mesa Verde Farms", region_code: "CA-SALINAS" }
              as: PlatformAdmin
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g1_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 5000, cultural_practice_codes: ["HYDROPONICS"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /licensing/agreements?grower_id=${g1_id} returns 0 rows"

      - name: plant_lot_provisional_royalty_and_counters_computed
        claim_type: Computed Fields
        grounds:
          - entities.PlantLot.fields.royalty_provisional_cents
          - entities.PlantLot.fields.plants_available
          - entities.PlantLot.fields.season_year
          - calculations.royalty_charge
        distinguishing_aspect: "At creation the lot fixes royalty_provisional_cents == quantity x 45 (90000 for 2000 plants), plants_available == quantity_plants, season_year from the logical clock, status SHIPPED; royalty_final_cents stays null until depletion."
        test_recipe:
          setup: ["V1 RELEASED; G1 ACTIVE with ACTIVE agreement A1."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - &c_a1
              call: "POST /licensing/agreements"
              payload: { grower_id: "${g1_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 100000, cultural_practice_codes: ["ORGANIC", "DRIP_IRRIGATION"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { a1_id: $.data.id }
            - &c_a1_dec
              call: "POST /licensing/agreements/${a1_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              captures: { a1_v: $.data.version }
          trigger:
            - &c_l1
              call: "POST /licensing/plant-lots"
              payload: { nursery_code: "NUR-CA-01", agreement_id: "${a1_id}", variety_id: "${v1_id}", quantity_plants: 2000 }
              as: NurseryManager
              captures: { l1_id: $.data.id }
          assert:
            - "the response status is 201; PlantLot.${l1_id}.status == SHIPPED and shipped_at == 2026-06-01T00:00:00Z (logical clock)"
            - "royalty_provisional_cents == 90000 (2000 x 45); royalty_final_cents and royalty_adjustment_cents are null"
            - "plants_reserved == 0, plants_planted == 0, plants_destroyed == 0, plants_available == 2000"
            - "season_year == 2026 and depleted_at is null"

      - name: planting_confirm_computes_yield_harvest_date_and_window
        claim_type: Computed Fields
        grounds:
          - entities.Planting.fields.expected_first_harvest
          - entities.Planting.fields.expected_yield_kg
          - entities.Planting.fields.harvest_window_id
          - calculations.expected_yield_and_booking
        distinguishing_aspect: "Confirming 1500 strawberry plants on 2026-08-01 computes expected_first_harvest 2026-09-30T00:00:00Z (+60 days), expected_yield_kg 3750.0 (x2.5), books the unique covering window W1 (booked_volume_kg 3750.0), and stamps harvest_window_id."
        test_recipe:
          setup: ["V1 RELEASED; G1 with ACTIVE A1; lot L1 2000 plants; window W1 [2026-09-28, 2026-10-05) target 10000; planting P1 planned 1500; logical clock 2026-08-02."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - &c_w1
              call: "POST /licensing/harvest-windows"
              payload: { region_code: "CA-SALINAS", variety_id: "${v1_id}", week_start: "2026-09-28T00:00:00Z", week_end: "2026-10-05T00:00:00Z", target_volume_kg: 10000 }
              as: PlatformAdmin
              captures: { w1_id: $.data.id }
            - &c_p1
              call: "POST /licensing/plantings"
              payload: { agreement_id: "${a1_id}", plant_lot_id: "${l1_id}", planned_plants: 1500, expected_agreement_version: "${a1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { p1_id: $.data.id }
            - &c_clock_aug
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_p1_conf
              call: "POST /licensing/plantings/${p1_id}/confirm"
              payload: { plants_planted_actual: 1500, planted_on: "2026-08-01T00:00:00Z" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { p1_v: $.data.version }
            - call: "GET /licensing/harvest-windows/${w1_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Planting.${p1_id}.status == PLANTED, expected_first_harvest == 2026-09-30T00:00:00Z, expected_yield_kg == 3750.0"
            - "Planting.${p1_id}.harvest_window_id == ${w1_id} (the only window covering 2026-09-30 for CA-SALINAS x V1)"
            - "HarvestWindow.${w1_id}.booked_volume_kg == 3750.0"
            - "PlantLot.${l1_id}: plants_reserved == 0, plants_planted == 1500, plants_available == 500, status PLANTED"

      - name: harvest_lot_tare_defaults_to_zero_and_net_computed
        claim_type: Defaults
        grounds:
          - entities.HarvestLot.fields.tare_weight_kg
          - entities.HarvestLot.fields.net_kg
        distinguishing_aspect: "Omitting tare_weight_kg stores 0 (default) and net_kg == gross_weight_kg; the lot starts IN_TRANSIT / UNGRADED with grade_version 0."
        test_recipe:
          setup: ["Canonical chain through P1 confirmed; logical clock 2026-10-06T06:30:00Z."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - &c_clock_h1a
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-06T06:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /licensing/harvest-lots"
              payload: { planting_id: "${p1_id}", harvested_at: "2026-10-06T06:00:00Z", gross_weight_kg: 1200, expected_planting_version: "${p1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { h0_id: $.data.id }
          assert:
            - "HarvestLot.${h0_id}.tare_weight_kg == 0 and net_kg == 1200"
            - "lot_status == IN_TRANSIT, grade_status == UNGRADED, grade_version == 0, grade and pack_designation are null"
            - "Planting.${p1_id} auto-transitioned PLANTED -> HARVESTING on this first lot"

      - name: agreements_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/licensing/agreements
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three PENDING_REVIEW agreements for one grower: limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; after one approval the status=ACTIVE filter returns exactly 1."
        test_recipe:
          setup: ["V1 RELEASED; G1 ACTIVE; three agreements with disjoint closed windows."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g1_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 1000, cultural_practice_codes: ["ORGANIC"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-03-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g1_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 1000, cultural_practice_codes: ["ORGANIC"], effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
            - call: "POST /licensing/agreements"
              payload: { grower_id: "${g1_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 1000, cultural_practice_codes: ["ORGANIC"], effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { a_pg3: $.data.id }
            - call: "POST /licensing/agreements/${a_pg3}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /licensing/agreements"
              payload: { grower_id: "${g1_id}", limit: 2, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /licensing/agreements"
              payload: { grower_id: "${g1_id}", limit: 2, offset: 2 }
              as: ComplianceOfficer
            - call: "GET /licensing/agreements"
              payload: { grower_id: "${g1_id}", status: "ACTIVE" }
              as: ComplianceOfficer
          assert:
            - "first page: 2 rows, total_count == 3, has_more == true"
            - "second page (offset 2): 1 row, total_count == 3, has_more == false"
            - "status=ACTIVE filter: exactly 1 row (${a_pg3}); status=PENDING_REVIEW would return 2"
            - "default pagination (no params) applies limit 10 / offset 0 per response_envelope.pagination_defaults"

      - name: harvest_windows_list_filters_by_region_and_variety
        claim_type: Listing
        grounds:
          - endpoints.GET_/licensing/harvest-windows
        distinguishing_aspect: "Two CA-SALINAS windows plus one WA-SKAGIT window for the same variety: variety_id filter returns 3, variety_id+region_code returns 2, an unused region returns 0 rows with total_count 0."
        test_recipe:
          setup: ["V1 RELEASED; three windows created."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - call: "POST /licensing/harvest-windows"
              payload: { region_code: "CA-SALINAS", variety_id: "${v1_id}", week_start: "2026-09-28T00:00:00Z", week_end: "2026-10-05T00:00:00Z", target_volume_kg: 10000 }
              as: PlatformAdmin
            - call: "POST /licensing/harvest-windows"
              payload: { region_code: "CA-SALINAS", variety_id: "${v1_id}", week_start: "2026-10-05T00:00:00Z", week_end: "2026-10-12T00:00:00Z", target_volume_kg: 10000 }
              as: PlatformAdmin
            - call: "POST /licensing/harvest-windows"
              payload: { region_code: "WA-SKAGIT", variety_id: "${v1_id}", week_start: "2026-09-28T00:00:00Z", week_end: "2026-10-05T00:00:00Z", target_volume_kg: 4000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /licensing/harvest-windows"
              payload: { variety_id: "${v1_id}" }
              as: PlatformAdmin
            - call: "GET /licensing/harvest-windows"
              payload: { variety_id: "${v1_id}", region_code: "CA-SALINAS" }
              as: PlatformAdmin
            - call: "GET /licensing/harvest-windows"
              payload: { region_code: "OR-WILLAMETTE" }
              as: PlatformAdmin
          assert:
            - "variety filter: 3 rows, total_count == 3"
            - "variety + region filter: 2 rows (both CA-SALINAS)"
            - "unused region: 0 rows, total_count == 0, has_more == false"

      - name: recall_orders_subresource_lists_with_default_compensation
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/licensing/varieties/{id}/recall-orders
          - entities.RecallOrder.fields.compensation_per_plant_cents
        distinguishing_aspect: "The recall created without compensation_per_plant_cents shows the default 22 on the sub-resource list, status ISSUED, variety_id pointing back at the path variety."
        test_recipe:
          setup: ["V1 RELEASED then recalled with reason and destroy_before only."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - call: "POST /licensing/varieties/${v1_id}/recall"
              payload: { reason: "field resistance failure", destroy_before: "2026-11-15T00:00:00Z" }
              as: BreedingManager
              captures: { ro_c1: $.data.id }
          trigger:
            - call: "GET /licensing/varieties/${v1_id}/recall-orders"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "exactly 1 row; RecallOrder.${ro_c1}.status == ISSUED"
            - "compensation_per_plant_cents == 22 (default applied when omitted)"
            - "row variety_id == ${v1_id}; enforced_at is null; plantings_recalled_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: variety_release_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.Variety.DEVELOPMENT_to_RELEASED]
        distinguishing_aspect: "Release moves DEVELOPMENT -> RELEASED, stamps released_at from the logical clock, and bumps version 1 -> 2."
        test_recipe:
          setup: ["V1 in DEVELOPMENT."]
          setup_api_calls:
            - *c_clock
            - *c_v1
          trigger:
            - *c_v1_rel
          assert:
            - "Variety.${v1_id}.status == RELEASED, released_at == 2026-06-01T00:00:00Z, version == 2"
            - "recalled_at remains null"

      - name: variety_recalled_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Variety
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "From terminal RECALLED every transition is closed: a second recall AND a release both fail 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["V1 RELEASED then RECALLED."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - call: "POST /licensing/varieties/${v1_id}/recall"
              payload: { reason: "field resistance failure", destroy_before: "2026-11-15T00:00:00Z" }
              as: BreedingManager
          trigger:
            - call: "POST /licensing/varieties/${v1_id}/recall"
              payload: { reason: "second recall attempt", destroy_before: "2026-12-01T00:00:00Z" }
              as: BreedingManager
              captures: { error_id: $.data.error_id }
            - call: "POST /licensing/varieties/${v1_id}/release"
              payload: {}
              as: BreedingManager
              captures: { error_id2: $.data.error_id }
          assert:
            - "second recall: 409 ERR_INVALID_STATE (RECALLED is terminal)"
            - "release from RECALLED: 409 ERR_INVALID_STATE"
            - "GET /licensing/varieties/${v1_id} still shows status RECALLED with the first recall's timestamps"
            - "GET /licensing/varieties/${v1_id}/recall-orders still returns exactly 1 row (no duplicate order created)"

      - name: grower_exited_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Grower
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "From terminal EXITED neither suspend nor a second exit is possible; both fail 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["G1 ACTIVE with no agreements, then exited."]
          setup_api_calls:
            - *c_clock
            - *c_g1
            - call: "POST /licensing/growers/${g1_id}/exit"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /licensing/growers/${g1_id}/suspend"
              payload: { reason: "too late" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
            - call: "POST /licensing/growers/${g1_id}/exit"
              payload: {}
              as: ComplianceOfficer
              captures: { error_id2: $.data.error_id }
          assert:
            - "both calls return 409 ERR_INVALID_STATE"
            - "Grower.${g1_id}.status stays EXITED with the original exited_at"

      - name: agreement_decide_reject_branch_and_idempotency
        claim_type: Invalid Transitions
        grounds:
          - state_machines.GrowerAgreement.PENDING_REVIEW_to_REJECTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The REJECT branch lands in REJECTED with reject_reason persisted; any second decide (even APPROVE) on the terminal agreement fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["V1 RELEASED; G1 ACTIVE; agreement A1 PENDING_REVIEW."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
          trigger:
            - call: "POST /licensing/agreements/${a1_id}/decide"
              payload: { decision: "REJECT", reason: "insufficient acreage history" }
              as: ComplianceOfficer
            - call: "POST /licensing/agreements/${a1_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "first decide: status REJECTED, reject_reason == \"insufficient acreage history\", decided_at set"
            - "second decide: 409 ERR_INVALID_STATE — terminal agreements cannot be re-decided"

      - name: planting_harvesting_auto_and_complete_gate
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Planting.PLANTED_to_HARVESTING
          - state_machines.Planting.HARVESTING_to_COMPLETED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Creating the first harvest lot auto-flips the planting PLANTED -> HARVESTING; complete is gated on every lot being GRADED/SETTLED/REJECTED — with the lot still IN_TRANSIT it fails 409, and only succeeds after the full grade pipeline."
        test_recipe:
          setup: ["Canonical chain through P1 confirmed; H1 created (IN_TRANSIT) at clock 2026-10-06T06:30."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - &c_h1
              call: "POST /licensing/harvest-lots"
              payload: { planting_id: "${p1_id}", harvested_at: "2026-10-06T06:00:00Z", gross_weight_kg: 1200, tare_weight_kg: 50, expected_planting_version: "${p1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { h1_id: $.data.id }
            - call: "GET /licensing/plantings/${p1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p1_status_mid: $.data.status }
          trigger:
            - call: "POST /licensing/plantings/${p1_id}/complete"
              payload: {}
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { error_id: $.data.error_id }
            - &c_clock_h1b
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-06T12:30:00Z" }
              as: PlatformAdmin
            - &c_h1_recv
              call: "POST /licensing/harvest-lots/${h1_id}/receive"
              payload: { received_at: "2026-10-06T12:00:00Z", pulp_temp_c_at_receipt: 3.5 }
              as: CoolingOperator
              as_user_id: "co-1"
            - &c_h1_grade
              call: "POST /licensing/harvest-lots/${h1_id}/grade"
              payload: { flavor_brix: 12.0, firmness_g: 400, appearance_score: 90, defect_pct: 1.0 }
              as: QualityGrader
              as_user_id: "qg-1"
            - &c_h1_cert
              call: "POST /licensing/harvest-lots/${h1_id}/certify-grade"
              payload: {}
              as: QualityGrader
