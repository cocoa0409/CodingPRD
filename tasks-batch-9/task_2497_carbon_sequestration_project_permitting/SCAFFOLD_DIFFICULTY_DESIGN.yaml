            - "StorageProject.${proj_id}.corrective_action_completion_pct == 0.00"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: instrument_dollar_conservation_across_allocate_deallocate
        grounds:
          - calculations.assurance_waterfall_allocation
          - calculations.required_financial_assurance
          - state_machines.FinancialInstrument.POSTED_to_ALLOCATED
          - state_machines.FinancialInstrument.ALLOCATED_to_POSTED
          - entities.FinancialInstrument.fields.unallocated_usd
          - entities.StorageProject.fields.allocated_assurance_usd
          - concurrency_rules[instrument-allocate-stale-instrument]
        distinguishing_aspect: |
          Conserved quantity: dollars on one FinancialInstrument. The identity
          allocated_ca_usd + allocated_plugging_usd + allocated_pisc_usd + allocated_emergency_usd +
          unallocated_usd + drawn_usd == face_amount_usd (26000000.00) must hold after the allocate, after
          the compensating deallocate that returns every bucket to unallocated_usd, and after the identical
          re-allocation, and the project's allocated_assurance_usd must swing 12500000.00 -> 0 -> 12500000.00
          with assurance_coverage_status tracking FUNDED -> UNFUNDED -> FUNDED.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status PERMITTING with aor_radius_km 0, pisc_duration_years 50, effective_annual_monitoring_cost_usd 200000 and no InjectionWellPermit rows"
            - "required_financial_assurance_usd 12500000.00 (pisc 10000000.00 + emergency floor 2000000.00 + admin fee 500000.00) and assurance_coverage_status UNFUNDED"
            - "one FinancialInstrument of instrument_type TRUST_FUND, face_amount_usd 26000000, status POSTED, all buckets 0 and unallocated_usd 26000000.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/financial-instruments"
              payload: { project_id: "${proj_id}", instrument_type: "TRUST_FUND", face_amount_usd: 26000000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { inst_id: $.data.id, inst_v0: $.data.version, unalloc_at_create: $.data.unallocated_usd }
          trigger:
            - call: "POST /ccs/financial-instruments/${inst_id}/allocate"
              payload: { expected_instrument_version: "${inst_v0}" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { inst_v1: $.data.version, ca_1: $.data.allocated_ca_usd, plug_1: $.data.allocated_plugging_usd, pisc_1: $.data.allocated_pisc_usd, emer_1: $.data.allocated_emergency_usd, unalloc_1: $.data.unallocated_usd, drawn_1: $.data.drawn_usd, status_1: $.data.status }
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { alloc_total_1: $.data.allocated_assurance_usd, coverage_1: $.data.assurance_coverage_status }
            - call: "POST /ccs/financial-instruments/${inst_id}/deallocate"
              payload: { deallocation_reason: "trust fund restructured before injection authorization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { inst_v2: $.data.version, ca_2: $.data.allocated_ca_usd, plug_2: $.data.allocated_plugging_usd, pisc_2: $.data.allocated_pisc_usd, emer_2: $.data.allocated_emergency_usd, unalloc_2: $.data.unallocated_usd, status_2: $.data.status }
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { alloc_total_2: $.data.allocated_assurance_usd, coverage_2: $.data.assurance_coverage_status }
            - call: "POST /ccs/financial-instruments/${inst_id}/allocate"
              payload: { expected_instrument_version: "${inst_v2}" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { pisc_3: $.data.allocated_pisc_usd, emer_3: $.data.allocated_emergency_usd, unalloc_3: $.data.unallocated_usd }
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { alloc_total_3: $.data.allocated_assurance_usd, coverage_3: $.data.assurance_coverage_status }
          assert:
            - "${unalloc_at_create} == 26000000.00"
            - "${ca_1} == 0.00 and ${plug_1} == 0.00"
            - "${pisc_1} == 10000000.00"
            - "${emer_1} == 2500000.00"
            - "${unalloc_1} == 13500000.00"
            - "${drawn_1} == 0.00"
            - "${status_1} == ALLOCATED"
            - "${alloc_total_1} == 12500000.00"
            - "${coverage_1} == FUNDED"
            - "${ca_2} == 0.00 and ${plug_2} == 0.00 and ${pisc_2} == 0.00 and ${emer_2} == 0.00"
            - "${unalloc_2} == 26000000.00"
            - "${status_2} == POSTED"
            - "${alloc_total_2} == 0.00"
            - "${coverage_2} == UNFUNDED"
            - "${pisc_3} == 10000000.00"
            - "${emer_3} == 2500000.00"
            - "${unalloc_3} == 13500000.00"
            - "${alloc_total_3} == 12500000.00"
            - "${coverage_3} == FUNDED"
            - "FinancialInstrument.${inst_id}.face_amount_usd == 26000000"
            - "FinancialInstrument.${inst_id}.drawn_usd == 0.00"
            - "FinancialInstrument.${inst_id}.status == ALLOCATED"
            - "StorageProject.${proj_id}.required_financial_assurance_usd == 12500000.00"

      - name: storage_ledger_tonne_conservation_across_period_create_and_void
        grounds:
          - calculations.secure_storage_ledger
          - calculations.tax_credit_amount
          - entities.InjectionPeriodRecord.fields.net_stored_tonnes
          - entities.StorageProject.fields.cumulative_stored_tonnes
          - entities.StorageProject.fields.pending_credit_usd
          - endpoints[POST /ccs/injection-periods/{id}/void]
        distinguishing_aspect: |
          A different conserved quantity, tonnes on the secure-storage ledger: cumulative_stored_tonnes
          must always equal the summed net_stored_tonnes of the ACCEPTED records only, so voiding the
          250000.000-tonne period reverses the ledger to 299500.000 exactly and drags the dependent
          SUBMITTED claim's tonnage basis and credit down with it (rate crossing back to the 85.00 tier),
          and re-reporting the identical window restores the ledger to exactly 549500.000 with no residue.
        test_recipe:
          setup:
            - "logical clock advanced to 2028-02-01T00:00:00Z"
