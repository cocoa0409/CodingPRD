              payload: { room_id: "${room_id}", technologist_id: "${tech_id}", scheduled_start_utc: "2026-06-01T09:00:00Z", scheduled_end_utc: "2026-06-01T09:30:00Z", expected_imaging_order_version: "${ov}" }
              as: SchedulingClerk
              captures: { exam_id: $.data.id }
            - call: "POST /imaging-exams/${exam_id}/check-in"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            # author records: 23 ACCEPTED + 1 REPEATED via 24 (capture+finalize) pairs, leaving 1 CAPTURING for the trigger
            - call: "POST /imaging-exams/${exam_id}/image-series"
              payload: { series_label: "accept-pool x23 then 1 REPEATED" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ser_seed_id: $.data.id }
            - call: "POST /image-series/${ser_seed_id}/finalize"
              payload: { outcome: "ACCEPTED" }
              as: Technologist
              as_user_id: "${tech_id}"
            # ... 22 more ACCEPTED finalizes, then one REPEATED finalize -> 24 finalized, 1 rr (rate 4.17) ...
            - call: "POST /imaging-exams/${exam_id}/image-series"
              payload: { series_label: "S-25th" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ser_25_id: $.data.id }
          trigger:
            - call: "POST /image-series/${ser_25_id}/finalize"
              payload: { outcome: "REJECTED", reject_reason: "EXPOSURE" }
              as: Technologist
              as_user_id: "${tech_id}"
          assert:
            - "After the 25th finalize (2 rr of 25): ImagingCenter.${c_id}.repeat_reject_rate_pct == 8.0"
            - "ImagingCenter.${c_id}.posture == QUALITY_HOLD (rate == threshold, >= boundary)"

