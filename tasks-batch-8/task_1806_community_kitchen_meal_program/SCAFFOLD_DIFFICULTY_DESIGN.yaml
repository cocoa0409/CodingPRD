  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_batch_inspection
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SAFETY_VIOLATION]
        distinguishing_aspect: |
          Category pair state vs business_safety: begin-inspection on a batch
          that is both in a non-inspectable state (REJECTED) AND expired (now >=
          use_by) must surface ERR_INVALID_STATE because priority 4 (state)
          precedes priority 5 (business_safety).
        test_recipe:
          setup:
            - "Site S; batch B (use_by 2026-08-15T00:00:00Z) rejected via receive -> begin-inspection -> record FAILED -> reject; clock then advanced to 2026-08-20T00:00:00Z (past use_by)."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
