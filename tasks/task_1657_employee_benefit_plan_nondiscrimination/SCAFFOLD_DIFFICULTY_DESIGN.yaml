scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: adp_provisional_vs_final_after_distribution
    grounds:
    - calculations.adp_test_401k
    - entities.TestRun.fields.run_mode
    - state_machines.Correction.APPROVED_to_EXECUTED
    distinguishing_aspect: 'Same census and same contribution rows, evaluated in PROVISIONAL mode

      (includes PENDING_DISTRIBUTION and DISTRIBUTED deferrals) vs FINAL mode

      (excludes DISTRIBUTED amounts) produce different ADP_HCE_PCT values;

      this instance lives in the TestRun/Contribution domain, unlike the

      top-heavy instance below which lives in the Contribution-balance domain.

      '
    test_recipe:
      setup:
      - Employer E1, 401K Plan P1, PlanVersion V1 (comp_definition W2, ADOPTED), PlanYear 2026 locked
      - 'NHCE-A: comp 10000000 CURRENT_YEAR W2; deferral 400000 POSTED'
      - 'NHCE-B: comp 10000000; deferral 600000 POSTED'
      - 'HCE-C: ownership 6% direct (so HCE via >5% owner test); comp 30000000; deferral 3000000 POSTED'
      - RegulatoryLimit 2026 published (hce threshold 15500000, key officer 22000000, 402g 2350000, 415 6900000, dc 500000)
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Acme Corp
          ein: '123456789'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /ndt/regulatory-limits
        payload:
          year_label: 2026
          hce_comp_threshold_cents: 15500000
          key_officer_comp_threshold_cents: 22000000
          sec402g_limit_cents: 2350000
          sec415_annual_additions_limit_cents: 6900000
          dependent_care_limit_cents: 500000
        as: PlatformAdmin
      - call: POST /ndt/employers/${emp_id}/plans
        payload:
          plan_name: Acme 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          plan_id: $.data.id
      - call: POST /ndt/plans/${plan_id}/plan-versions
        payload:
          effective_start: '2026-01-01'
          effective_end: '2026-12-31'
          comp_definition: W2
          safe_harbor_design: NONE
        as: PlanAdministrator
        captures:
          pv_id: $.data.id
      - call: POST /ndt/plan-versions/${pv_id}/adopt
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plans/${plan_id}/plan-years
        payload:
          year_label: 2026
          year_start: '2026-01-01'
          year_end: '2026-12-31'
        as: PlanAdministrator
        captures:
          py_id: $.data.id
          py_v0: $.data.version
      - call: POST /ndt/plan-years/${py_id}/open-census
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plan-years/${py_id}/census-employees
        payload:
          ssn: '111110001'
          full_name: Nancy A
          date_of_birth: '1980-01-01'
          date_of_hire: '2020-01-01'
          employment_status: ACTIVE
        as: PlanAdministrator
        captures:
          nhce_a: $.data.id
      - call: POST /ndt/plan-years/${py_id}/census-employees
        payload:
          ssn: '111110002'
          full_name: Ned B
          date_of_birth: '1982-01-01'
          date_of_hire: '2020-01-01'
          employment_status: ACTIVE
        as: PlanAdministrator
        captures:
          nhce_b: $.data.id
      - call: POST /ndt/plan-years/${py_id}/census-employees
        payload:
          ssn: '111110003'
          full_name: Hugh C
          date_of_birth: '1975-01-01'
          date_of_hire: '2015-01-01'
          employment_status: ACTIVE
          ownership_pct_direct: 6
        as: PlanAdministrator
        captures:
          hce_c: $.data.id
      - call: POST /ndt/census-employees/${nhce_a}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 10000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${nhce_b}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 10000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${hce_c}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 30000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${nhce_a}/contributions
        payload:
          contribution_type: ELECTIVE_DEFERRAL
          amount_cents: 400000
          contribution_date: '2026-06-30'
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${nhce_b}/contributions
        payload:
          contribution_type: ELECTIVE_DEFERRAL
          amount_cents: 600000
          contribution_date: '2026-06-30'
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${hce_c}/contributions
        payload:
          contribution_type: ELECTIVE_DEFERRAL
          amount_cents: 3000000
          contribution_date: '2026-06-30'
        as: PlanAdministrator
      - call: GET /ndt/plan-years/${py_id}
        payload: {}
        as: PlanAdministrator
        captures:
          occ_v_0: $.data.version
      - call: POST /ndt/plan-years/${py_id}/lock-census
        payload:
          expected_plan_year_version: ${occ_v_0}
        as: PlanAdministrator
      trigger:
      - call: POST /ndt/plan-years/${py_id}/test-runs
        payload:
          test_scope: ADP_401K
          run_mode: PROVISIONAL
        as: ComplianceAnalyst
        captures:
          tr_prov: $.data.id
      - call: POST /ndt/test-runs/${tr_prov}/execute-synchronously
        payload: {}
        as: ComplianceAnalyst
      - call: POST /ndt/plan-years/${py_id}/test-runs
        payload:
          test_scope: ADP_401K
          run_mode: FINAL
        as: ComplianceAnalyst
        captures:
          tr_final: $.data.id
      - call: POST /ndt/test-runs/${tr_final}/execute-synchronously
        payload: {}
        as: ComplianceAnalyst
      assert:
      - PROVISIONAL run ${tr_prov} has TestResultLine[metric=ADP_HCE_PCT].value_pct == 10.0000
      - FINAL run ${tr_final} has TestResultLine[metric=ADP_HCE_PCT].value_pct == 10.0000 (no distributions yet, so variants
        agree here)
      - Both runs agree pre-correction; the variant divergence is exercised in adp_final_recounts_after_correction (corner)
        where the FINAL value drops to 2.5000 after a DISTRIBUTED correction while a fresh PROVISIONAL run still reads 10.0000
  - name: top_heavy_first_year_forward_looking_vs_lookback
    grounds:
    - calculations.top_heavy_determination
    - entities.PlanYear.fields.prior_year_py_id
    distinguishing_aspect: 'Top-heavy determination on a first-year plan (prior_year_py_id null)

      measures balances as of the CURRENT year-end and includes current-year

      accruals; a second-year plan measures as of the PRIOR year-end using

      prior-year balances — identical contribution ledgers produce different

      TOP_HEAVY_RATIO_PCT across the two variants, in the Contribution

      balance domain (distinct from the ADP ratio domain above).

      '
    test_recipe:
      setup:
      - 'Employer E1, 401K plan with two plan years: 2025 (first, no prior) and 2026 (prior_year_py_id -> 2025)'
      - 'KEY owner K: ownership 60% direct, comp 40000000, contributions 2025: 5000000 POSTED; 2026: 1000000 POSTED'
      - 'NON_KEY N: comp 10000000, contributions 2025: 500000 POSTED; 2026: 900000 POSTED'
      - 2025 all-employee balance = 5500000, key balance = 5000000 -> 90.9091% (top-heavy, FAIL)
      - '2026 measured on lookback basis would use prior-year balances (5000000/5500000 = 90.9091%); measured forward-looking
        on 2026 data: key 1000000 / 1900000 = 52.6316% (PASS) — the variant choice flips the verdict'
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Beta LLC
          ein: '223456789'
          entity_type: LLC
        as: PlatformAdmin
        captures:
          emp2_id: $.data.id
      - call: POST /ndt/regulatory-limits
        payload:
          year_label: 2025
          hce_comp_threshold_cents: 15000000
          key_officer_comp_threshold_cents: 21500000
          sec402g_limit_cents: 2300000
          sec415_annual_additions_limit_cents: 6800000
          dependent_care_limit_cents: 500000
        as: PlatformAdmin
      - call: POST /ndt/regulatory-limits
        payload:
          year_label: 2026
          hce_comp_threshold_cents: 15500000
          key_officer_comp_threshold_cents: 22000000
          sec402g_limit_cents: 2350000
          sec415_annual_additions_limit_cents: 6900000
          dependent_care_limit_cents: 500000
        as: PlatformAdmin
      - call: POST /ndt/employers/${emp2_id}/plans
        payload:
          plan_name: Beta 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          plan2_id: $.data.id
      - call: POST /ndt/plans/${plan2_id}/plan-versions
        payload:
          effective_start: '2025-01-01'
          effective_end: '2026-12-31'
          comp_definition: W2
          safe_harbor_design: NONE
        as: PlanAdministrator
        captures:
          pv2_id: $.data.id
      - call: POST /ndt/plan-versions/${pv2_id}/adopt
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plans/${plan2_id}/plan-years
        payload:
          year_label: 2025
          year_start: '2025-01-01'
          year_end: '2025-12-31'
        as: PlanAdministrator
        captures:
          py25_id: $.data.id
          py25_v0: $.data.version
      - call: POST /ndt/plan-years/${py25_id}/open-census
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plan-years/${py25_id}/census-employees
        payload:
          ssn: '222220001'
          full_name: Kay Owner
          date_of_birth: '1970-01-01'
          date_of_hire: '2010-01-01'
          employment_status: ACTIVE
          ownership_pct_direct: 60
        as: PlanAdministrator
        captures:
          key_k25: $.data.id
      - call: POST /ndt/plan-years/${py25_id}/census-employees
        payload:
          ssn: '222220002'
          full_name: Nora Staff
          date_of_birth: '1990-01-01'
          date_of_hire: '2020-01-01'
          employment_status: ACTIVE
        as: PlanAdministrator
        captures:
          nk_n25: $.data.id
      - call: POST /ndt/census-employees/${key_k25}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 40000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${nk_n25}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 10000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${key_k25}/contributions
        payload:
          contribution_type: PROFIT_SHARING
          amount_cents: 5000000
          contribution_date: '2025-12-15'
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${nk_n25}/contributions
        payload:
          contribution_type: PROFIT_SHARING
          amount_cents: 500000
          contribution_date: '2025-12-15'
        as: PlanAdministrator
      - call: GET /ndt/plan-years/${py25_id}
        payload: {}
        as: PlanAdministrator
        captures:
          occ_v_1: $.data.version
      - call: POST /ndt/plan-years/${py25_id}/lock-census
        payload:
          expected_plan_year_version: ${occ_v_1}
        as: PlanAdministrator
      trigger:
      - call: POST /ndt/plan-years/${py25_id}/test-runs
        payload:
          test_scope: TOP_HEAVY_416
          run_mode: FINAL
        as: ComplianceAnalyst
        captures:
          tr_th: $.data.id
      - call: POST /ndt/test-runs/${tr_th}/execute-synchronously
        payload: {}
        as: ComplianceAnalyst
      assert:
      - TestResultLine[metric=TOP_HEAVY_RATIO_PCT].value_pct == 90.9091 (5000000/5500000 * 100, first-year forward-looking
        basis)
      - TestResultLine[metric=TOP_HEAVY_RATIO_PCT].outcome == FAIL (90.9091 > 60.0000 strictly)
      - Had the lookback variant been (incorrectly) applied to a first year, the denominator basis would differ; the variant
        pin is what makes 90.9091 the only correct literal
- rule_id: combinatorial_formula
  instances:
  - name: adp_ceiling_three_prong_min_max
    grounds:
    - calculations.adp_test_401k
    - entities.TestResultLine.fields.threshold_pct
    distinguishing_aspect: 'Mode (a): the ADP ceiling is max(1.25x NHCE, min(NHCE + 2pp, 2x NHCE)) —

      a nested min/max over three prongs whose binding prong flips with the

      NHCE level; at NHCE ADP 5.0000 the +2pp prong (7.0000) binds over the

      1.25x prong (6.2500), and the test pins which prong won.

      '
    test_recipe:
      setup:
      - 'Same Acme census as adp_provisional_vs_final_after_distribution: NHCE ADRs 4.0000 and 6.0000 (avg 5.0000), HCE ADR
        10.0000'
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Gamma Inc
          ein: '323456789'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          emp3_id: $.data.id
      - call: POST /ndt/regulatory-limits
        payload:
          year_label: 2026
          hce_comp_threshold_cents: 15500000
          key_officer_comp_threshold_cents: 22000000
          sec402g_limit_cents: 2350000
          sec415_annual_additions_limit_cents: 6900000
          dependent_care_limit_cents: 500000
        as: PlatformAdmin
      - call: POST /ndt/employers/${emp3_id}/plans
        payload:
          plan_name: Gamma 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          plan3_id: $.data.id
      - call: POST /ndt/plans/${plan3_id}/plan-versions
        payload:
          effective_start: '2026-01-01'
          effective_end: '2026-12-31'
          comp_definition: W2
          safe_harbor_design: NONE
        as: PlanAdministrator
        captures:
          pv3_id: $.data.id
      - call: POST /ndt/plan-versions/${pv3_id}/adopt
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plans/${plan3_id}/plan-years
        payload:
          year_label: 2026
          year_start: '2026-01-01'
          year_end: '2026-12-31'
        as: PlanAdministrator
        captures:
          py3_id: $.data.id
          py3_v0: $.data.version
      - call: POST /ndt/plan-years/${py3_id}/open-census
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plan-years/${py3_id}/census-employees
        payload:
          ssn: '333330001'
          full_name: Nia One
