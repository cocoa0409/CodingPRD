  - rule_id: non_linear_state_machine
    instances:
      - name: list_version_review_cycle_revision_round_ceiling
        grounds:
          - state_machines.ListVersion.DRAFT_to_IN_REVIEW
          - state_machines.ListVersion.IN_REVIEW_to_DRAFT
          - state_machines.ListVersion.IN_REVIEW_to_PUBLISHED
          - entities.ListVersion.fields.revision_round
          - validations[priority=37]
          - validations[priority=25]
        distinguishing_aspect: |
          The DRAFT <-> IN_REVIEW loop is genuinely cyclic and bounded by a counter, not by state: three
          request-changes bounces leave revision_round at exactly 3 while the state is a legal IN_REVIEW,
          and the fourth bounce is refused with ERR_REVISION_LIMIT_REACHED (409) even though
          IN_REVIEW_to_DRAFT is a declared transition — the guard is the accumulated loop count.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with a WineList and a DRAFT ListVersion (version_no 1) carrying one ListEntry, so submit is legal."
            - "The version has already been bounced back to DRAFT three times and re-submitted, so revision_round is 3 and the state is IN_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_red_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/wine-lists"
              payload: { name: "Dinner List" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_id: $.data.id, lv_v1: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_red_id}", sort_rank: 1, expected_list_version_version: "${lv_v1}", by_the_glass: false, par_bottles: 6, education_verified: false }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /beverage-program/list-versions/${lv_id}/submit"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/list-versions/${lv_id}/request-changes"
              payload: { note: "Round 1: reorder the Burgundies." }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/list-versions/${lv_id}/submit"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/list-versions/${lv_id}/request-changes"
              payload: { note: "Round 2: fix the vintage column." }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/list-versions/${lv_id}/submit"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/list-versions/${lv_id}/request-changes"
              payload: { note: "Round 3: tighten the tasting notes." }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/list-versions/${lv_id}/submit"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
          trigger:
            - call: "POST /beverage-program/list-versions/${lv_id}/request-changes"
              payload: { note: "Round 4: one more pass." }
              as: BeverageDirector
              as_user_id: "bd-001"
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_REVISION_LIMIT_REACHED"
            - "ListVersion.${lv_id}.revision_round == 3 (unchanged by the refused bounce)"
            - "ListVersion.${lv_id}.state == IN_REVIEW"
            - "ListVersion.${lv_id}.submitted_by_user_id == ${v1_id}"
            - "a following POST /beverage-program/list-versions/${lv_id}/publish as BeverageDirector bd-001 succeeds with state PUBLISHED and WineList.${wl_id}.published_version_no == 1"
            - "a following POST /beverage-program/list-versions/${lv_id}/request-changes after publication returns HTTP 409 ERR_LIST_VERSION_NOT_IN_REVIEW, not ERR_REVISION_LIMIT_REACHED"
