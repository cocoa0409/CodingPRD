          setup: ["Period soft-closed; dashboard DRAFT"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
