  # ----------------------------------------------------------------- errors ---
  - section: errors
    instances:
      - name: duplicate_category_and_room_uniqueness
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_BUDGET_CATEGORY]", "errors[ERR_DUPLICATE_ROOM]"]
        distinguishing_aspect: "Tenant-scoped uniqueness: a second FURNITURE budget line on the same project and a second room_number on the same project are each rejected, while the same room_number on a DIFFERENT project is allowed."
        test_recipe:
          setup: ["Projects P1 and P2; P1 already has a FURNITURE budget line and room R-1"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-R1a", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p1_id: $.data.id } }
            - { call: "POST /api/projects", payload: { name: "P-R1b", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p2_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p1_id}", category: "FURNITURE", budgeted_cents: 1000000 }, as: PurchasingAgent }
            - { call: "POST /api/rooms", payload: { project_id: "${p1_id}", floor_number: 1, room_number: "R-1", room_type: "SUITE" }, as: InstallationManager }
          trigger:
            - { call: "POST /api/budget-lines", payload: { project_id: "${p1_id}", category: "FURNITURE", budgeted_cents: 500000 }, as: PurchasingAgent, captures: { err1: $.data.error_id } }
            - { call: "POST /api/rooms", payload: { project_id: "${p1_id}", floor_number: 2, room_number: "R-1", room_type: "SUITE" }, as: InstallationManager, captures: { err2: $.data.error_id } }
            - { call: "POST /api/rooms", payload: { project_id: "${p2_id}", floor_number: 2, room_number: "R-1", room_type: "SUITE" }, as: InstallationManager, captures: { r2_id: $.data.id } }
          assert:
            - "Duplicate budget category: 409 ERR_DUPLICATE_BUDGET_CATEGORY"
            - "Duplicate room_number in same project: 409 ERR_DUPLICATE_ROOM"
            - "Same room_number in another project: 201 created (uniqueness is project-scoped)"

