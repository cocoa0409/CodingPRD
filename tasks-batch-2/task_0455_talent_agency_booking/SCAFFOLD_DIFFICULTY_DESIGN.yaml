              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { call_id: $.data.id }
            - call: "POST /submissions"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", comp_card_id: "${cc_id}" }
              as: Agent
              captures: { sub1_id: $.data.id }
            - call: "POST /submissions"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", comp_card_id: "${cc_id}" }
              as: Agent
              captures: { sub2_id: $.data.id }
            - call: "POST /audition-slots"
              payload: { submission_id: "${sub1_id}", casting_director_id: "${cd_id}", slot_kind: "AUDITION", start_at: "2026-04-10T10:00:00Z", end_at: "2026-04-10T10:30:00Z" }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { slot1_id: $.data.id }
          trigger:
            - call: "POST /audition-slots"
              payload: { submission_id: "${sub2_id}", casting_director_id: "${cd_id}", slot_kind: "AUDITION", start_at: "2026-04-10T10:40:00Z", end_at: "2026-04-10T11:00:00Z" }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SLOT_OVERLAP"

      - name: availability_hold_same_kind_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.AvailabilityHold.fields.start_date
          - entities.AvailabilityHold.fields.end_date
          - entities.AvailabilityHold.fields.hold_kind
        distinguishing_aspect: |
          AvailabilityHold overlap uses HALF-OPEN day-interval semantics on a
          talent where back-to-back is allowed: a second FIRST_REFUSAL hold
          starting the day after the first ends is accepted, but one sharing a day
          is rejected with ERR_HOLD_OVERLAP — different resource and adjacency rule.
        test_recipe:
          setup:
            - "ROSTERED talent with a FIRST_REFUSAL hold 2026-03-10..2026-03-12."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /talents"
