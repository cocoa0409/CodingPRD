      - name: case_four_dimensions_advance_independently_before_the_join
        claim_type: parallel state machine shape
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.CorrectionCase.status
        excluded_because:
          difficulty_instance: case_parallel_dimensions_join_before_remediation
          rationale: "That §1.8 instance already drives detection_status, filing_status and statement_status on one case and asserts that status stays OPEN until both the filing and statement dimensions are satisfied, then flips to REMEDIATION_PENDING exactly once — the full parallel-dimension and join claim."

      - name: amended_return_cycles_back_through_draft_after_rejection
        claim_type: cyclic state machine shape
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.AmendedReturn.AGENCY_REJECTED_to_DRAFT
        excluded_because:
          difficulty_instance: amended_return_rejected_returns_to_draft_and_reprepares
          rationale: "That §1.8 instance walks AGENCY_REJECTED -> DRAFT -> PREPARED -> SIGNED -> SUBMITTED and asserts the cleared signature, cleared submitted_at and recomputed money fields, which is exactly the loop-and-termination claim for this shape."

      - name: statement_supersede_chain_loops_through_voided_and_reissued
        claim_type: cyclic state machine shape
        grounds:
          - state_machines.CorrectedWageStatement.RETURNED_UNDELIVERABLE_to_VOIDED
          - entities.CorrectedWageStatement.fields.supersedes_statement_id
        excluded_because:
          difficulty_instance: statement_reissue_cycle_supersedes_prior_statement
          rationale: "That §1.8 instance already runs ISSUED -> RETURNED_UNDELIVERABLE -> VOIDED -> successor DRAFT -> ISSUED and asserts sequence_no and supersedes_statement_id along the chain."

      - name: acceptance_cascades_down_five_levels_and_bubbles_up_to_the_employer
        claim_type: Cascade down / Bubble up side effects
        grounds:
          - state_machines.AmendedReturn.SUBMITTED_to_ACCEPTED.side_effects
        excluded_because:
          difficulty_instance: amended_return_acceptance_cascade_depth_five
          rationale: "That §1.8 instance asserts all five links of the acceptance cascade end to end, including the FiledReturn flip, the Discrepancy resolutions, both CorrectionCase dimension moves and the Employer.open_remediation_count bubble-up."

      - name: void_reverses_every_prepare_side_effect_without_drift
        claim_type: Compensation side effects
        grounds:
          - state_machines.AmendedReturn.PREPARED_to_VOID.side_effects
        excluded_because:
          difficulty_instance: void_restores_employer_open_exposure_to_its_pre_prepare_value
          rationale: "That §1.8 instance captures Employer.open_exposure_cents before prepare, after prepare and after void and asserts the pre-prepare value is restored exactly, which is the no-drift compensation claim."

      - name: statement_reissue_keeps_the_case_wage_base_in_sync
        claim_type: Ledger sync side effects
        grounds:
          - calculations.corrected_wage_base_rollup
          - state_machines.CorrectedWageStatement.ISSUED_to_VOIDED.side_effects
        excluded_because:
          difficulty_instance: reissue_conserves_case_corrected_wage_base
          rationale: "That §1.8 instance asserts CorrectionCase.corrected_wage_base_cents before the void and after the successor is issued, proving the derived ledger field is re-derived rather than double-counted."

      - name: prepare_is_guarded_by_the_registration_state_of_another_entity
        claim_type: guarded transitions
        grounds:
          - state_machines.AmendedReturn.DRAFT_to_PREPARED.preconditions
          - entities.AgencyAccount.fields.registration_status
        excluded_because:
          difficulty_instance: amended_return_prepare_depends_on_agency_account_coverage
          rationale: "That §1.8 instance blocks DRAFT -> PREPARED while the AgencyAccount is PENDING and lets it through once the same account reaches ACTIVE, which is the cross-entity guard claim in full."

      - name: statement_boxes_move_only_when_the_repayment_reaches_collected
        claim_type: Conditional cascade side effects
        grounds:
          - calculations.statement_box_deltas.input_set
          - state_machines.WageRepayment.AGREED_to_COLLECTED.side_effects
        excluded_because:
          difficulty_instance: statement_box_deltas_depend_on_repayment_reaching_collected
          rationale: "That §1.8 instance asserts the box deltas with the repayment in AGREED (no contribution) and again after COLLECTED (full contribution), so the state-conditional half of the cascade is already pinned."

  - section: calculations
    instances:

      - name: first_time_abatement_grants_the_full_waiver_below_the_exposure_ceiling
        claim_type: Correct Result
        grounds:
          - calculations.abatement_penalty_waiver
          - entities.AgencyNotice.fields.waiver_pct_bps
          - entities.Employer.fields.granted_abatement_count
        distinguishing_aspect: "With granted_abatement_count 0 and a gross exposure of 1250000 (below FIRST_TIME_EXPOSURE_CEILING_CENTS 5000000) the FIRST_TIME branch returns 10000 bps rather than the 5000 bps repeat rate, so the whole 200000-cent penalty is waived while the 50000 cents of interest survive."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme with granted_abatement_count 0 and a federal agency."
            - "A standalone notice (correction_case_id omitted) assessing 1000000 tax / 200000 penalty / 50000 interest, due 2026-06-30."
            - "A FIRST_TIME abatement has been requested for the full 200000 and the response has been sent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /agency-notices"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, notice_number: "CP-501-77", assessed_tax_cents: 1000000, assessed_penalty_cents: 200000, assessed_interest_cents: 50000, response_due_date: "2026-06-30" }
              as: TaxOfficer
              captures: { notice_id: "$.data.id" }
            - call: "POST /agency-notices/${notice_id}/draft-response"
              payload: { response_narrative: "First compliance failure in the lookback period.", abatement_grounds: "FIRST_TIME", requested_penalty_waiver_cents: 200000 }
              as: TaxOfficer
            - call: "POST /agency-notices/${notice_id}/respond"
              payload: {}
              as: TaxOfficer
          trigger:
            - call: "POST /agency-notices/${notice_id}/record-outcome"
              payload: { outcome: "ABATED_FULL", agency_decision_reference: "LTR-4021" }
              as: TaxOfficer
          assert:
