  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: corridor_station_buffer_and_window_double_overlap
        resource: Corridor
        overlap_semantics: |
          Two-dimensional conflict. A conflict requires BOTH a buffer-expanded
          station overlap and a half-open time overlap:
            new.station_start_m < existing.station_end_m + buffer_m
            AND new.station_end_m + buffer_m > existing.station_start_m
            AND new.occupancy_window_start < existing.occupancy_window_end
            AND new.occupancy_window_end   > existing.occupancy_window_start
          Either dimension alone is not enough. Touching at exactly the buffer
          edge (station_start_m == existing.station_end_m + buffer_m) does not
          conflict, and windows that merely abut (new start == existing end) do
          not conflict.
        grounds:
          - validations[priority=38]
          - errors.ERR_CORRIDOR_STATION_CONFLICT
          - entities.Corridor.fields.buffer_m
          - entities.CrossingAgreement.fields.station_start_m
          - entities.CrossingAgreement.fields.occupancy_window_start
          - calculations.crossing_compensation
        distinguishing_aspect: |
          The contended resource is a linear Corridor and the exclusion test is
          two-dimensional (station space AND time), so three separate probes are
          needed: X2 clears on the station dimension by sitting exactly one metre
          past the buffer edge (1550 == 1500 + 50), X3 fails by starting one metre
          inside it (1549), and X4 overlaps in station space but clears on the time
          dimension because its window begins exactly where X1's ends. This is a
          pairwise exclusion test, unlike the aggregate-capacity instance below.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC', three 48453 SetbackRule rows and the 125.00-acre Parcel with blocking_curative_open_count 0."
            - "One Corridor 'Bluestem 345kV Collector' with total_length_m 5000 and buffer_m 50, left in PLANNED."
            - "One CrossingAgreement X1 of kind COLLECTION_LINE at stations 1000-1500 over the window 2026-09-01T00:00:00Z to 2026-10-01T00:00:00Z, in PROPOSED, so it counts toward the exclusion test."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Caprock Ranch Holdings LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "land@caprock.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l1_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.06, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "OCCUPIED_DWELLING", setback_feet: 500, encumbrance_rate_per_acre: 0.10, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PUBLIC_ROAD", setback_feet: 100, encumbrance_rate_per_acre: 0.04, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-1188-004", county_fips: "48453", landowner_id: "${l1_id}", gross_acres: 125.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_at_id: "$.data.id" }
            - call: "POST /land-origination/corridors"
              payload: { route_name: "Bluestem 345kV Collector", total_length_m: 5000, voltage_class: "GENTIE_345KV", buffer_m: 50 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { cor_id: "$.data.id" }
            - call: "POST /land-origination/crossing-agreements"
              payload: { corridor_id: "${cor_id}", parcel_id: "${p_at_id}", crossing_kind: "COLLECTION_LINE", station_start_m: 1000, station_end_m: 1500, occupancy_window_start: "2026-09-01T00:00:00Z", occupancy_window_end: "2026-10-01T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { x1_id: "$.data.id", x1_comp: "$.data.compensation_cents" }
          trigger:
            - call: "POST /land-origination/crossing-agreements"
              payload: { corridor_id: "${cor_id}", parcel_id: "${p_at_id}", crossing_kind: "INTERCONNECTION_ROUTE", station_start_m: 1550, station_end_m: 1700, occupancy_window_start: "2026-09-15T00:00:00Z", occupancy_window_end: "2026-09-20T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { x2_id: "$.data.id", x2_occupied: "$.data.occupied_m", x2_days: "$.data.duration_days", x2_comp: "$.data.compensation_cents" }
            - call: "POST /land-origination/crossing-agreements"
              payload: { corridor_id: "${cor_id}", parcel_id: "${p_at_id}", crossing_kind: "INTERCONNECTION_ROUTE", station_start_m: 1549, station_end_m: 1700, occupancy_window_start: "2026-09-05T00:00:00Z", occupancy_window_end: "2026-09-10T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { x3_error: "$.data.error_id" }
            - call: "POST /land-origination/crossing-agreements"
              payload: { corridor_id: "${cor_id}", parcel_id: "${p_at_id}", crossing_kind: "COLLECTION_LINE", station_start_m: 1200, station_end_m: 1400, occupancy_window_start: "2026-10-01T00:00:00Z", occupancy_window_end: "2026-10-15T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { x4_id: "$.data.id", x4_occupied: "$.data.occupied_m", x4_days: "$.data.duration_days", x4_comp: "$.data.compensation_cents" }
          assert:
            - "${x1_comp} == 900000 (500 metres of COLLECTION_LINE at 1800 cents per metre, 30 occupancy days, surcharge 0 bps)"
            - "X2 is admitted: ${x2_occupied} == 150, ${x2_days} == 5, ${x2_comp} == 510000 (INTERCONNECTION_ROUTE at 3400 cents per metre) — station_start_m 1550 equals X1's station_end_m 1500 plus buffer_m 50, and touching the buffer edge is not a conflict"
            - "X3 is refused with HTTP 409 and ${x3_error} == ERR_CORRIDOR_STATION_CONFLICT — station_start_m 1549 is one metre inside X1's buffer edge and the window 2026-09-05..2026-09-10 lies strictly inside X1's window, so both dimensions overlap"
            - "X3's window does NOT overlap X2's 2026-09-15..2026-09-20 window, so the refusal is attributable to X1 alone"
            - "X4 is admitted: ${x4_occupied} == 200, ${x4_days} == 14, ${x4_comp} == 360000 — its stations 1200-1400 sit inside X1's buffer-expanded span, but its window starts exactly where X1's window ends and half-open intervals that abut do not overlap"
            - "X4 does not conflict with X2 either: 1400 + 50 == 1450 is not greater than X2's station_start_m 1550"
            - "Corridor ${cor_id} ends with exactly three CrossingAgreement rows (${x1_id}, ${x2_id}, ${x4_id}), all in PROPOSED, and granted_crossing_count == 0"

      - name: parcel_crew_capacity_aggregate_half_open_windows
        resource: Parcel
        overlap_semantics: |
          One-dimensional half-open time intervals with an aggregate capacity.
          Over every SiteAccessBooking in status {BOOKED, COMPLETED} on the same
          parcel whose [window_start, window_end) intersects the requested window,
          SUM(crew_count) + requested crew_count must be <=
          PARCEL_MAX_CONCURRENT_CREWS (3). Intervals intersect when
          new.window_start < existing.window_end AND
          new.window_end > existing.window_start, so back-to-back windows
          (previous end == next start) never intersect. CANCELLED bookings drop out
          of the sum entirely.
        grounds:
          - validations[priority=39]
          - errors.ERR_CREW_CAPACITY_EXCEEDED
          - entities.SiteAccessBooking.fields.crew_count
          - entities.SiteAccessBooking.fields.window_start
          - state_machines.SiteAccessBooking.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          The contended resource is a Parcel and the test is an aggregate capacity
          rather than a pairwise exclusion: B1 (1 crew) and B2 (2 crews) are each
          individually admissible and together sit exactly at the cap of 3, so the
          third booking fails only because of the collective sum. The instance also
          exercises the release path, which the corridor instance has no analogue
          for: cancelling B2 removes its crews from the aggregate and the very same
          request that was refused now succeeds.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC', three 48453 SetbackRule rows and the 125.00-acre Parcel."
            - "The logical clock left at its default 2026-08-01T00:00:00Z, so every booking window on 2026-08-10 is in the future and rule 40 never fires."
            - "SiteAccessBooking B1: purpose TITLE_SURVEY, crew_count 1, window 2026-08-10T08:00:00Z to 2026-08-10T16:00:00Z, in BOOKED."
            - "SiteAccessBooking B2: purpose GEOTECH, crew_count 2, window 2026-08-10T12:00:00Z to 2026-08-10T20:00:00Z, in BOOKED. It overlaps B1, so the sum over the overlap is exactly 1 + 2 == 3 == PARCEL_MAX_CONCURRENT_CREWS."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Caprock Ranch Holdings LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "land@caprock.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l1_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.06, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "OCCUPIED_DWELLING", setback_feet: 500, encumbrance_rate_per_acre: 0.10, consent_waivable: true }
              as: TitleCounsel
