          assert:
            - "a new InventoryLot exists for ${slot_id} with remaining_units == 20 (hop 1)"
            - "PlanogramSlot.${slot_id}.on_hand == 20 (hop 2)"
            - "Machine.${mach_id}.stock_status == STOCKED (hop 3)"

      - name: tc_finalize_statement_lifetime_balance_depth2
        grounds:
          - state_machines.CommissionStatement.OPEN_to_FINALIZED
