              as: CapitalAnalyst
              captures: { period_xd2: $.data.id }
            - call: "POST /banks/${bank_xd2}/reporting-periods/${period_xd2}/risk-exposures"
              payload: { reporting_period_id: "${period_xd2}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_xd2}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_xd2}/reporting-periods/${period_xd2}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_xd2: $.data.id }
            - call: "POST /banks/${bank_xd2}/reporting-periods/${period_xd2}/call-reports/${report_xd2}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_xd2}/reporting-periods/${period_xd2}/call-reports/${report_xd2}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_xd2}/reporting-periods/${period_xd2}/call-reports/${report_xd2}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_xd2}/stress-scenarios"
              payload: { scenario_code: "BASE-XD2", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { scen_xd2: $.data.id }
            - call: "POST /banks/${bank_xd2}/stress-scenarios/${scen_xd2}/activate"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_xd2}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${period_xd2}", stress_scenario_id: "${scen_xd2}" }
              as: CapitalAnalyst
              captures: { plan_xd2: $.data.id }
            - call: "POST /banks/${bank_xd2}/capital-plans/${plan_xd2}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
            - call: "POST /banks/${bank_xd2}/capital-plans/${plan_xd2}/board_approve"
              as: BoardApprover
