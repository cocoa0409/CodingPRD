            - "CONTROL — the same repeat is not ERR_PARK_DAY_CAPACITY_FULL, because day-level reserved_count 2 < reservation_slot_capacity 4"

      - name: gate_entry_antipassback_safety_precedes_blockout_temporal
        grounds:
          - validations[priority=62]
          - validations[priority=74]
          - errors[ERR_ANTIPASSBACK_VIOLATION]
          - errors[ERR_BLOCKOUT_DATE]
          - endpoints[POST /visits]
        distinguishing_aspect: |
          A different error-category pair from the other instance: `business_safety` (priority 62)
          against `business_temporal` (priority 74) on POST /visits. Both conditions hold — the pass
          re-enters exactly 90 minutes after its previous entry AND an ACTIVE blockout now covers
          (tier, day) — and the safety rule must win. Shifting the entry one minute later disarms only
          the safety rule and exposes the temporal one.
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE tier; ParkDay 2026-08-05 STANDARD (100/1000)."
            - "Processed ACTIVE BRONZE pass bought PAY_IN_FULL."
            - "One gate entry already recorded at 2026-08-05T09:00:00Z through NORTH."
            - "A MANUAL BlockoutAssignment is then created for (BRONZE, 2026-08-05) using the park day's current version, so the day is blocked for that tier."
