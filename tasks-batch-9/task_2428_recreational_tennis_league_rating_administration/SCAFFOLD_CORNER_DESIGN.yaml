      - name: recording_a_home_default_credits_every_line_to_away_and_strikes_the_home_captain
        claim_type: Action endpoint
        grounds:
          - endpoints.POST /tennis/matches/{id}/default
          - calculations.match_default_resolution
        distinguishing_aspect: "A single non-CRUD action collapses four things into one request that no CRUD write can express: it moves the schedule dimension to DEFAULTED, jumps the result dimension straight to VERIFIED (skipping REPORTED entirely, with no scorecard ever existing), synthesises all three lines at the pinned 6-0 6-0 DEFAULT_LINE_SCORE with credit_source TEAM_DEFAULT, and issues a NO_SHOW_DEFAULT strike to the defaulting side's captain. defaulting_side HOME with 3 lines means defaulted_home 3 >= TEAM_DEFAULT_THRESHOLD 2, so away takes every line: 36 games, not the 12 an implementation that credits only one line would report."
        test_recipe:
          setup:
            - "Two two-player teams are IN_PLAY in the district league and their fixture is SCHEDULED at the six-court facility for 2026-08-15T18:00:00Z; no scorecard exists and the clock has been advanced to 2026-08-15T21:00:00Z, past the scheduled start, so the default is admissible."
