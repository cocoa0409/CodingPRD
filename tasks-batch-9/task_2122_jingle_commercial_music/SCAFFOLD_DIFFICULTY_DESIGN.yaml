# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x 2 instances = 18 instances. Every ground resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every numeric assert below was executed against the
# named calculations[].formula and its constants before being written down.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: license_fee_quoted_brief_markets_vs_invoiced_granted_markets
        grounds:
          - calculations.license_fee
          - entities.LicenseDeal.fields.license_fee_quoted_cents
          - entities.LicenseDeal.fields.license_fee_invoiced_cents
          - entities.CreativeBrief.fields.target_markets
          - state_machines.LicenseDeal.ACCEPTED_to_ACTIVE
        distinguishing_aspect: |
          This instance lives in the licensing-money domain on LicenseDeal: the
          QUOTED_AT_DRAFT variant prices the brief's two target markets while the
          INVOICED_AT_ACTIVATION variant prices only the one market the deal
          actually grants, so the identical LicenseDeal row carries
          license_fee_quoted_cents = 795000 and license_fee_invoiced_cents = 645000
          at the same instant.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "Client 'Northwind Beverages' and Project 'Autumn Refresh 2026' with budget_cents 4000000"
            - "APPROVED CreativeBrief whose target_markets are ['US_NATIONAL','US_REGIONAL'] (TIER_1 + TIER_2)"
            - "Demo 'Sunrise Pop' in SELECTED, Project in IN_PRODUCTION"
            - "LicenseDeal in ACCEPTED: TERM, term_months 12, market_codes ['US_NATIONAL'] only, creative_fee_cents 800000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MusicHouseProducer
            - call: "POST /clients"
              payload: { name: "Northwind Beverages", agency_code: "NWB-001", billing_email: "ap@northwind.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Autumn Refresh 2026", budget_cents: 4000000, delivery_deadline_utc: "2026-10-15T00:00:00Z" }
              as: MusicHouseProducer
              captures: { pj: $.data.id }
            - call: "POST /projects/${pj}/briefs"
              payload: { tempo_bpm: 120, mood_tags: ["upbeat", "warm"], target_markets: ["US_NATIONAL", "US_REGIONAL"], required_lengths: [60, 30, 15] }
              as: MusicHouseProducer
              captures: { br: $.data.id }
            - call: "POST /briefs/${br}/approve"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /composers"
              payload: { display_name: "Ada Rivers", pro_affiliation: "ASCAP" }
              as: MusicHouseProducer
              captures: { cpa: $.data.id }
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Sunrise Pop", demo_fee_cents: 150000, submitted_length_seconds: 60 }
              as: Composer
              as_user_id: "${cpa}"
              captures: { dma: $.data.id }
            - call: "POST /demos/${dma}/submit"
              payload: {}
              as: Composer
              as_user_id: "${cpa}"
            - call: "POST /demos/${dma}/shortlist"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /demos/${dma}/select"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "GET /projects/${pj}"
              payload: {}
              as: RightsAdmin
              as_user_id: "rights-admin-alpha"
              captures: { pv: $.data.version }
            - call: "POST /license-deals"
              payload: { project_id: "${pj}", demo_id: "${dma}", license_structure: "TERM", term_months: 12, market_codes: ["US_NATIONAL"], creative_fee_cents: 800000, expected_project_version: "${pv}" }
              as: RightsAdmin
              as_user_id: "rights-admin-alpha"
              captures: { ld: $.data.id }
            - call: "POST /license-deals/${ld}/propose"
              payload: {}
              as: RightsAdmin
              as_user_id: "rights-admin-alpha"
            - call: "POST /license-deals/${ld}/accept"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
          trigger:
            - call: "POST /license-deals/${ld}/activate"
              payload: {}
              as: RightsAdmin
              as_user_id: "rights-admin-beta"
          assert:
            - "LicenseDeal.${ld}.status == ACTIVE"
            - "LicenseDeal.${ld}.license_fee_quoted_cents == 795000"
            - "LicenseDeal.${ld}.license_fee_invoiced_cents == 645000"
            - "LicenseDeal.${ld}.license_fee_quoted_cents - LicenseDeal.${ld}.license_fee_invoiced_cents == 150000"
            - "LicenseDeal.${ld}.effective_start_utc == 2026-09-01T00:00:00.000Z"
            - "LicenseDeal.${ld}.effective_end_utc == 2027-08-27T00:00:00.000Z"

      - name: afm_wage_session_basis_vs_consolidated_day_basis
        grounds:
          - calculations.musician_line_wage
          - calculations.afm_pension_health_rollup
          - entities.MusicianBooking.fields.line_wage_cents
          - state_machines.SessionCall.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          This instance lives in the musician-labour domain on MusicianBooking, not
          the licensing-money domain: for three players on two COMPLETED calls of
          the same UTC date the SESSION_BASIS report returns wage_total_cents 168777
          while the DAY_BASIS report returns 150024, because the 8-hour day cap
          truncates the 9 hours each player actually worked.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; Project budget_cents 4000000 in IN_PRODUCTION"
            - "StudioRoom 'Room A' at hourly_rate_cents 40000, capacity_players 6"
            - "Three SIGNATORY_CLEARED musicians, each scale_hourly_cents 6251, none a leader, zero doubles"
            - "SessionCall S1 2026-09-10T09:00Z-13:00Z and SessionCall S2 2026-09-10T14:00Z-19:00Z, same room, both COMPLETED at their scheduled ends, all three players booked on both"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MusicHouseProducer
            - call: "POST /clients"
              payload: { name: "Northwind Beverages", agency_code: "NWB-002", billing_email: "ap@northwind.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Autumn Refresh 2026", budget_cents: 4000000, delivery_deadline_utc: "2026-10-15T00:00:00Z" }
              as: MusicHouseProducer
              captures: { pj: $.data.id }
            - call: "POST /projects/${pj}/briefs"
              payload: { tempo_bpm: 120, mood_tags: ["upbeat"], target_markets: ["US_NATIONAL"], required_lengths: [60, 30, 15] }
              as: MusicHouseProducer
              captures: { br: $.data.id }
            - call: "POST /briefs/${br}/approve"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /composers"
              payload: { display_name: "Ada Rivers", pro_affiliation: "ASCAP" }
              as: MusicHouseProducer
              captures: { cpa: $.data.id }
            - call: "POST /projects/${pj}/demos"
              payload: { title: "Sunrise Pop", demo_fee_cents: 150000, submitted_length_seconds: 60 }
              as: Composer
              as_user_id: "${cpa}"
              captures: { dma: $.data.id }
            - call: "POST /demos/${dma}/submit"
              payload: {}
              as: Composer
              as_user_id: "${cpa}"
            - call: "POST /demos/${dma}/shortlist"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /demos/${dma}/select"
              payload: {}
              as: ClientRep
              as_user_id: "${cl}"
            - call: "POST /studio-rooms"
              payload: { name: "Room A", hourly_rate_cents: 40000, capacity_players: 6, status: "ACTIVE" }
              as: MusicHouseProducer
              captures: { r1: $.data.id }
            - call: "POST /musicians"
              payload: { full_name: "Mia Vance", instrument: "DRUMS", scale_hourly_cents: 6251 }
              as: MusicHouseProducer
              captures: { m1: $.data.id }
            - call: "POST /musicians/${m1}/afm-clearance"
              payload: { afm_member_status: "SIGNATORY_CLEARED" }
              as: AFMSteward
            - call: "POST /musicians"
              payload: { full_name: "Noel Park", instrument: "BASS", scale_hourly_cents: 6251 }
              as: MusicHouseProducer
              captures: { m2: $.data.id }
            - call: "POST /musicians/${m2}/afm-clearance"
              payload: { afm_member_status: "SIGNATORY_CLEARED" }
              as: AFMSteward
            - call: "POST /musicians"
              payload: { full_name: "Ola Reed", instrument: "KEYS", scale_hourly_cents: 6251 }
              as: MusicHouseProducer
              captures: { m3: $.data.id }
            - call: "POST /musicians/${m3}/afm-clearance"
              payload: { afm_member_status: "SIGNATORY_CLEARED" }
              as: AFMSteward
            - call: "POST /session-calls"
              payload: { project_id: "${pj}", studio_room_id: "${r1}", scheduled_start_utc: "2026-09-10T09:00:00Z", scheduled_end_utc: "2026-09-10T13:00:00Z" }
              as: MusicHouseProducer
              captures: { s1: $.data.id }
            - call: "POST /session-calls/${s1}/bookings"
              payload: { musician_id: "${m1}", is_leader: false, doubles_count: 0 }
              as: MusicHouseProducer
            - call: "POST /session-calls/${s1}/bookings"
              payload: { musician_id: "${m2}", is_leader: false, doubles_count: 0 }
              as: MusicHouseProducer
            - call: "POST /session-calls/${s1}/bookings"
              payload: { musician_id: "${m3}", is_leader: false, doubles_count: 0 }
              as: MusicHouseProducer
            - call: "POST /session-calls"
              payload: { project_id: "${pj}", studio_room_id: "${r1}", scheduled_start_utc: "2026-09-10T14:00:00Z", scheduled_end_utc: "2026-09-10T19:00:00Z" }
              as: MusicHouseProducer
              captures: { s2: $.data.id }
            - call: "POST /session-calls/${s2}/bookings"
              payload: { musician_id: "${m1}", is_leader: false, doubles_count: 0 }
              as: MusicHouseProducer
            - call: "POST /session-calls/${s2}/bookings"
              payload: { musician_id: "${m2}", is_leader: false, doubles_count: 0 }
              as: MusicHouseProducer
            - call: "POST /session-calls/${s2}/bookings"
              payload: { musician_id: "${m3}", is_leader: false, doubles_count: 0 }
              as: MusicHouseProducer
            - call: "POST /session-calls/${s1}/confirm"
              payload: {}
              as: MusicHouseProducer
            - call: "POST /session-calls/${s2}/confirm"
              payload: {}
              as: MusicHouseProducer
            - call: "POST /session-calls/${s1}/complete"
              payload: { actual_end_utc: "2026-09-10T13:00:00Z" }
              as: MusicHouseProducer
            - call: "POST /session-calls/${s2}/complete"
              payload: { actual_end_utc: "2026-09-10T19:00:00Z" }
              as: MusicHouseProducer
          trigger:
            - call: "GET /projects/${pj}/afm-report"
              payload: { basis: "SESSION" }
              as: AFMSteward
            - call: "GET /projects/${pj}/afm-report"
              payload: { basis: "DAY" }
              as: AFMSteward
          assert:
            - "afm-report?basis=SESSION -> wage_total_cents == 168777"
            - "afm-report?basis=SESSION -> pension_health_cents == 20253"
            - "afm-report?basis=SESSION -> session_count == 2 and booking_count == 6"
            - "afm-report?basis=DAY -> wage_total_cents == 150024"
            - "afm-report?basis=DAY -> pension_health_cents == 18003"
            - "afm-report?basis=DAY -> session_count == 2 and booking_count == 6"
            - "SESSION wage_total_cents - DAY wage_total_cents == 18753"

  - rule_id: combinatorial_formula
    instances:

      - name: pension_health_rounded_per_line_then_summed_not_summed_then_rounded
        grounds:
          - calculations.afm_pension_health_rollup
          - calculations.musician_line_wage
          - entities.MusicianBooking.fields.pension_health_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: three booking lines of 25004 cents each round to
          3000 cents of pension and health per line for a total of exactly 9000,
          whereas rounding the 75012-cent wage total once would give 9001; the
          scaffold pins round-per-line-then-sum, so 9000 is the only correct answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; Project budget_cents 4000000 in IN_PRODUCTION"
            - "StudioRoom at hourly_rate_cents 40000; three SIGNATORY_CLEARED players at scale_hourly_cents 6251"
            - "Exactly one COMPLETED SessionCall 2026-09-10T09:00Z-13:00Z (4 billed hours) with all three players booked"
          setup_api_calls:
