scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (PartyReservation deposit vs BuildShipOrder commissioning).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: party_deposit_quote_floor_vs_cancel_honored_refund
        grounds:
          - calculations.party_deposit_required
          - state_machines.PartyReservation.QUOTED_to_DEPOSIT_PAID
          - state_machines.PartyReservation.DEPOSIT_PAID_to_CANCELLED
        distinguishing_aspect: |
          The same calculation has two variants on the PartyReservation domain:
          guest_count mode at quote time uses tier-sensitive floor logic (ULTIMATE
          12 guests -> max(12000, 20000) = 20000), while cancel-refund mode on the
          SAME booking facts uses tier-insensitive honored-headcount logic
          (min(12, 9 attended) * 1000 = 9000 refunded). Two valid readings of
          "deposit" produce 20000 vs 9000 for the same reservation inputs.
        test_recipe:
          setup:
            - "Store S1 with 2 party rooms; Customer C1; clock advanced to 2026-10-01T00:00:00Z"
            - "ULTIMATE party P1 for 12 guests, STAFF_HOSTED, starting 2026-10-10T18:00:00Z (>= 72h lead)"
            - "9 PartyGuests confirmed; deposit paid"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Flagship", party_room_count: 2 }
              as: StoreManager
              captures: { store1: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store1}", display_name: "Host Hana", role_title: "PARTY_HOST" }
              as: StoreManager
              captures: { host1: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Customer
              captures: { cust1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /parties"
              payload: { store_id: "${store1}", customer_id: "${cust1}", party_start: "2026-10-10T18:00:00Z", duration_minutes: 120, guest_count: 12, package_tier: "ULTIMATE", staffing_mode: "STAFF_HOSTED" }
              as: Customer
              as_user_id: "${cust1}"
              captures: { party1: $.data.id, deposit_quote: $.data.deposit_amount_cents }
            - call: "POST /parties/${party1}/pay-deposit"
              payload: { payment_amount_cents: 20000 }
              as: Customer
              as_user_id: "${cust1}"
            - call: "POST /party-guests"
              payload: { party_reservation_id: "${party1}", guest_name: "G1" }
              as: Customer
              as_user_id: "${cust1}"
              captures: { g1: $.data.id }
            - call: "POST /party-guests"
