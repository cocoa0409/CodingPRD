            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "plan", uri: "s3://s5/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "wood", uri: "s3://s5/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
          trigger:
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_a}", captures: { err: $.data.error_id } }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}", captures: { ok_ballot: $.data.ballot } }
          assert:
            - "applicant's own vote: error_id == ERR_SEGREGATION_OF_DUTIES (HTTP 403)"
            - "different owner's identical ballot: succeeds (ballot == APPROVE)"

