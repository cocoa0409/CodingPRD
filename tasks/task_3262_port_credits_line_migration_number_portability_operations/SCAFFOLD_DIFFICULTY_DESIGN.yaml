scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: promo_projection_forward_vs_vested_chronological
        grounds:
          - calculations.port_in_promo_credit_projection
          - entities.PromoCreditSchedule.fields.provisional_total_cents
          - entities.PromoCreditSchedule.fields.vested_total_cents
        distinguishing_aspect: |
          For the identical schedule row (installment_months 12, retention_requirement_cycles 12,
          monthly_credit_cents 1000) evaluated at window_start, the forward-looking provisional
          variant reports 32000 while the chronological vested variant reports 0, because the
          vested variant credits only the billing cycles the line has actually completed inside
          the window; a single-valued implementation cannot satisfy both numbers.
        test_recipe:
          setup:
            - "One FAMILY account on payment_history_score 720 with existing_deposit_cents 50000"
            - "One activated PREPAID subscriber line on that account, numbered 4155550101"
            - "The line is ported in: service_status ACTIVE and number_status PORTED_IN"
            - "Logical clock exactly 2026-09-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1234", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/rejection-code-catalog"
              payload: { rejection_code: "PIN_INVALID", description: "Transfer PIN rejected", guidance_text: "Reconfirm the transfer PIN with the losing carrier", resubmission_allowed: true, retry_after_hours: 24, requires_action_by: "CUSTOMER" }
              as: PlatformAdmin
            - call: "POST /portability/rejection-code-catalog"
              payload: { rejection_code: "ACCT_LOCKED", description: "Losing carrier account locked", guidance_text: "Ask the losing carrier to lift the lock", resubmission_allowed: false, retry_after_hours: 0, requires_action_by: "LOSING_CARRIER" }
              as: PlatformAdmin
            - call: "POST /portability/rejection-code-catalog"
              payload: { rejection_code: "PORT_BLOCK", description: "Port-out block in place", guidance_text: "Remove the port-out block before ordering", resubmission_allowed: true, retry_after_hours: 48, requires_action_by: "CUSTOMER" }
              as: PlatformAdmin
            - call: "POST /portability/rejection-code-catalog"
              payload: { rejection_code: "ZIP_MISMATCH", description: "Billing ZIP mismatch", guidance_text: "Confirm the billing ZIP on the losing account", resubmission_allowed: true, retry_after_hours: 0, requires_action_by: "GAINING_CARRIER" }
              as: PlatformAdmin
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550101", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { line_v1: $.data.version }
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACC1", transfer_pin: "1234", requested_cutover_at: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${line_v1}" }
              as: CustomerService
              captures: { pr: $.data.id }
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "1234", account_number_at_losing_carrier: "ACC1" }
              as: CustomerService
            - call: "POST /portability/port-requests/${pr}/accept"
              payload: {}
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { line_v2: $.data.version }
          trigger:
            - call: "POST /portability/promo-credit-schedules"
              payload: { subscriber_line_id: "${line}", promo_code: "SWITCH20", monthly_credit_cents: 1000, installment_months: 12, retention_requirement_cycles: 12, window_start: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${line_v2}" }
              as: CustomerService
              captures: { pcs: $.data.id }
          assert:
            - "PromoCreditSchedule.${pcs}.provisional_total_cents == 32000"
            - "PromoCreditSchedule.${pcs}.vested_total_cents == 0"
            - "PromoCreditSchedule.${pcs}.cycles_elapsed == 0"
            - "PromoCreditSchedule.${pcs}.provisional_total_cents != PromoCreditSchedule.${pcs}.vested_total_cents"
            - "Account.${acct}.promo_credited_cents == 32000"
            - "Account.${acct}.net_promo_credit_cents == 32000"
      - name: trade_in_estimated_vs_final_condition_keyed
        grounds:
          - calculations.trade_in_credit_assessment
          - entities.TradeInAssessment.fields.grade_delta_cents
          - entities.DeviceInstallmentPlan.fields.trade_in_credit_cents
        distinguishing_aspect: |
          The same assessment carries two condition-keyed credits on different entity domains of the
          same trade-in: estimated_credit_cents is keyed on the customer's declared_condition GOOD
          (42000) while final_credit_cents is keyed on the inspector's graded_condition FAIR (24000),
          so the two variants diverge by exactly -18000 and the settled credit on the attached
          installment plan is 24000, not 42000.
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE subscriber line billed PREPAID"
            - "An ACTIVE installment plan on that line with device_price_cents 60000 and down_payment_cents 10000, so the financed balance is 50000"
            - "A trade-in assessment submitted for that plan declaring condition GOOD"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1234", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550102", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { line_v1: $.data.version }
            - call: "POST /portability/device-installment-plans"
              payload: { subscriber_line_id: "${line}", device_model: "Galaxy X1", device_price_cents: 60000, down_payment_cents: 10000, installment_months: 24, activation_at: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${line_v1}" }
              as: CustomerService
              captures: { dip: $.data.id }
            - call: "POST /portability/trade-in-assessments"
              payload: { installment_plan_id: "${dip}", device_model: "Galaxy X1", declared_condition: "GOOD" }
              as: CustomerService
              captures: { tia: $.data.id }
          trigger:
            - call: "POST /portability/trade-in-assessments/${tia}/grade"
              payload: { graded_condition: "FAIR" }
              as: TradeInInspector
          assert:
            - "TradeInAssessment.${tia}.estimated_credit_cents == 42000"
            - "TradeInAssessment.${tia}.final_credit_cents == 24000"
            - "TradeInAssessment.${tia}.grade_delta_cents == -18000"
            - "DeviceInstallmentPlan.${dip}.trade_in_credit_cents == 24000"
            - "DeviceInstallmentPlan.${dip}.remaining_balance_cents == 26000"

  - rule_id: combinatorial_formula
    instances:
      - name: credit_class_nested_score_and_family_tier
        grounds:
          - calculations.credit_class_determination
          - calculations.credit_class_determination.variants.review_variant
          - state_machines.LineAdditionRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The class formula drives two inputs through a nested branch: a payment_history_score of
          720 alone yields CLASS_B with a 10000 deposit, but adding four lines to an account that
          already holds one active line moves lines_after to 5, which crosses FAMILY_TIER_LINE_THRESHOLD
          and demotes the same score to CLASS_C with a 25000 deposit.
        test_recipe:
          setup:
            - "Two FAMILY accounts: one with an active line, one without, both on payment_history_score 720"
            - "A line addition request for 4 lines on each account"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1111", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct_busy: $.data.id }
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "2222", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct_idle: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct_busy}", mdn: "4155550201", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { busy_line: $.data.id }
            - call: "POST /portability/subscriber-lines/${busy_line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/line-addition-requests"
              payload: { account_id: "${acct_busy}", line_count: 4 }
              as: CustomerService
              captures: { lar_busy: $.data.id }
            - call: "POST /portability/line-addition-requests"
              payload: { account_id: "${acct_idle}", line_count: 4 }
              as: CustomerService
              captures: { lar_idle: $.data.id }
          trigger:
            - call: "POST /portability/line-addition-requests/${lar_busy}/review"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
            - call: "POST /portability/line-addition-requests/${lar_idle}/review"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
          assert:
            - "LineAdditionRequest.${lar_busy}.determined_credit_class == CLASS_C"
            - "LineAdditionRequest.${lar_busy}.required_deposit_cents == 25000"
            - "LineAdditionRequest.${lar_idle}.determined_credit_class == CLASS_B"
            - "LineAdditionRequest.${lar_idle}.required_deposit_cents == 10000"
            - "LineAdditionRequest.${lar_busy}.request_state == APPROVED"
            - "LineAdditionRequest.${lar_idle}.request_state == APPROVED"
      - name: device_installment_rounding_order_pinned
        grounds:
          - calculations.device_installment_balance
          - entities.DeviceInstallmentPlan.fields.monthly_installment_cents
        distinguishing_aspect: |
          The scaffold pins the rounding order as floor-per-installment then give the whole remainder
          to the first installment, so a 50000 balance over 24 months yields a 2083 recurring
          installment and a 2091 first installment; the alternative reading
          round(50000/24)=2083 also lands on 2083, so the distinguishing number is the first
          installment, which is 2091 under the pinned order and 2083 under a uniform-installment
          implementation.
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE subscriber line"
            - "Logical clock exactly 2026-09-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "3333", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550301", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { line_v: $.data.version }
          trigger:
            - call: "POST /portability/device-installment-plans"
              payload: { subscriber_line_id: "${line}", device_model: "Galaxy X1", device_price_cents: 60000, down_payment_cents: 10000, installment_months: 24, activation_at: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${line_v}" }
              as: CustomerService
              captures: { dip: $.data.id }
          assert:
            - "DeviceInstallmentPlan.${dip}.monthly_installment_cents == 2083"
            - "DeviceInstallmentPlan.${dip}.remaining_balance_cents == 50000"
            - "DeviceInstallmentPlan.${dip}.plan_state == ACTIVE"
            - "2083 * 23 + 2091 == 50000"
      - name: migration_proration_evaluation_order_carry
        grounds:
          - calculations.migration_proration_credit
          - entities.MigrationRequest.fields.proration_credit_cents
        distinguishing_aspect: |
          The proration credit is order-sensitive because the carry term reads
          device_balance_cents, which the same transition writes in an earlier hop: a MigrationRequest
          with prepaid_balance_cents 10000 and no installment plan must land on tier 2
          (Account.active_line_count 1 plus the migrating line, so lines_after 2, rate 4000) and
          report 8867, not the 3867 that a proration-only implementation would produce.
        test_recipe:
          setup:
            - "One FAMILY account holding exactly one ACTIVE line"
            - "A second subscriber line on that account, PREPAID, activated"
            - "A migration request on the second line with prepaid_balance_cents 10000"
            - "Logical clock exactly 2026-09-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "4444", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550401", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { anchor_line: $.data.id }
            - call: "POST /portability/subscriber-lines/${anchor_line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550402", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { mig_line: $.data.id }
            - call: "POST /portability/migration-requests"
              payload: { subscriber_line_id: "${mig_line}", source_billing_mode: "PREPAID", target_billing_mode: "POSTPAID", prepaid_balance_cents: 10000, requested_cutover_at: "2026-10-01T00:00:00Z" }
              as: CustomerService
              captures: { mr: $.data.id }
            - call: "POST /portability/migration-requests/${mr}/check-eligibility"
              payload: {}
              as: CustomerService
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /portability/migration-requests/${mr}"
              as: CustomerService
          assert:
            - "MigrationRequest.${mr}.migration_state == CUTOVER_COMPLETE"
            - "MigrationRequest.${mr}.carried_mdn == \"4155550402\""
            - "MigrationRequest.${mr}.device_balance_cents == 0"
            - "MigrationRequest.${mr}.proration_credit_cents == 8867"

  - rule_id: non_linear_state_machine
    instances:
      - name: port_request_branching_fork_reject_or_cancel
        grounds:
          - state_machines.PortRequest.PENDING_to_REJECTED
          - state_machines.PortRequest.REJECTED_to_RESUBMITTED
          - state_machines.PortRequest.PENDING_to_CANCELLED
        distinguishing_aspect: |
          From the single PENDING state the machine forks to REJECTED or to CANCELLED with divergent
          side-effect sets — only the REJECTED branch can reach RESUBMITTED and reopen the workflow,
          while CANCELLED is terminal and releases the reserved number without recording a rejection —
          so the shape is fork-join, not a linear pipeline.
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE subscriber line billed PREPAID"
            - "Two submitted port requests, one on each of two lines, each in request_state PENDING"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "5555", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550501", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line_a: $.data.id }
            - call: "POST /portability/subscriber-lines/${line_a}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550502", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line_b: $.data.id }
            - call: "POST /portability/subscriber-lines/${line_b}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line_a}"
              as: PlatformAdmin
              captures: { line_a_v: $.data.version }
            - call: "GET /portability/subscriber-lines/${line_b}"
              as: PlatformAdmin
              captures: { line_b_v: $.data.version }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line_a}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACCA", transfer_pin: "1111", requested_cutover_at: "2026-09-10T00:00:00Z", expected_subscriber_line_version: "${line_a_v}" }
              as: CustomerService
              captures: { pr_a: $.data.id }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line_b}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACCB", transfer_pin: "2222", requested_cutover_at: "2026-09-10T00:00:00Z", expected_subscriber_line_version: "${line_b_v}" }
              as: CustomerService
              captures: { pr_b: $.data.id }
            - call: "POST /portability/port-requests/${pr_a}/submit"
              payload: { transfer_pin: "1111", account_number_at_losing_carrier: "ACCA" }
              as: CustomerService
            - call: "POST /portability/port-requests/${pr_b}/submit"
              payload: { transfer_pin: "2222", account_number_at_losing_carrier: "ACCB" }
              as: CustomerService
          trigger:
            - call: "POST /portability/port-requests/${pr_a}/rejections"
              payload: { rejection_code: "PIN_INVALID" }
              as: PlatformAdmin
            - call: "POST /portability/port-requests/${pr_b}/cancel"
              payload: {}
              as: CustomerService
          assert:
            - "PortRequest.${pr_a}.request_state == REJECTED"
            - "PortRequest.${pr_a}.rejection_count == 1"
            - "PortRequest.${pr_b}.request_state == CANCELLED"
            - "PortRequest.${pr_b}.rejection_count == 0"
            - "PortRequest.${pr_a}.last_rejection_code == \"PIN_INVALID\""
      - name: migration_request_eligibility_cycle_and_fork
        grounds:
          - state_machines.MigrationRequest.ELIGIBILITY_CHECK_to_APPROVED
          - state_machines.MigrationRequest.APPROVED_to_ELIGIBILITY_CHECK
          - state_machines.MigrationRequest.ELIGIBILITY_CHECK_to_BLOCKED
        distinguishing_aspect: |
          Eligibility is a fork that can be re-entered: ELIGIBILITY_CHECK forks to APPROVED or BLOCKED,
          and the APPROVED state loops back to ELIGIBILITY_CHECK when a fresh protection case lands,
          which is a cycle rather than a one-way pipeline, and BLOCKED is terminal so the only route
          back to APPROVED is through the cycle before the fork closes.
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID subscriber line"
            - "A migration request on that line in migration_state DRAFT"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "6666", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550601", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/migration-requests"
              payload: { subscriber_line_id: "${line}", source_billing_mode: "PREPAID", target_billing_mode: "POSTPAID", prepaid_balance_cents: 0, requested_cutover_at: "2026-10-01T00:00:00Z" }
              as: CustomerService
              captures: { mr: $.data.id }
          trigger:
            - call: "POST /portability/migration-requests/${mr}/check-eligibility"
              payload: {}
              as: CustomerService
          assert:
            - "MigrationRequest.${mr}.migration_state != BLOCKED"
            - "MigrationRequest.${mr}.migration_state == CUTOVER_SCHEDULED"
            - "SubscriberLine.${line}.number_status == RESERVED"
  - rule_id: transitive_cascade
    instances:
      - name: port_cutover_clock_cascade_reaches_promo_vesting
        grounds:
          - state_machines.PortRequest.ACCEPTED_PENDING_CUTOVER_to_PORTED
          - state_machines.PromoCreditSchedule.ACTIVE_to_VESTED
          - entities.SubscriberLine.fields.retention_cycle_count
        distinguishing_aspect: |
          A single clock advance at the port cutover instant propagates through four links on four
          entities — PortRequest becomes PORTED, that sets SubscriberLine.service_status ACTIVE and
          stamps line_opened_at, that recompute of retention_cycle_count lets a later clock advance
          carry the PromoCreditSchedule PROVISIONAL step through ACTIVE, and eventually to VESTED
          with vested_total_cents 12000 — each hop caused by the previous hop, not by the clock call
          itself.
        test_recipe:
          setup:
            - "One FAMILY account on score 720 with existing_deposit_cents 50000"
            - "One activated PREPAID subscriber line numbered 4155550701"
            - "A submitted and accepted port request whose cutover is due 2026-09-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "7777", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550701", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { line_v1: $.data.version }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACC7", transfer_pin: "7777", requested_cutover_at: "2026-09-10T00:00:00Z", expected_subscriber_line_version: "${line_v1}" }
              as: CustomerService
              captures: { pr: $.data.id }
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "7777", account_number_at_losing_carrier: "ACC7" }
              as: CustomerService
            - call: "POST /portability/port-requests/${pr}/accept"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "PortRequest.${pr}.request_state == PORTED"
            - "SubscriberLine.${line}.service_status == ACTIVE"
            - "SubscriberLine.${line}.number_status == PORTED_IN"
      - name: promo_clawback_cascade_lands_on_the_plans_own_balance
        grounds:
          - state_machines.PromoCreditSchedule.ACTIVE_to_CLAWED_BACK
          - entities.DeviceInstallmentPlan.fields.remaining_balance_cents
          - entities.Account.fields.promo_clawed_back_cents
        distinguishing_aspect: |
          Each claw-back cascade runs three hops on one line's own objects — the schedule becomes
          CLAWED_BACK, that flips the line's promo_eligibility_state, that increments the line's own
          DeviceInstallmentPlan.remaining_balance_cents by that schedule's provisional_total_cents,
          and that recomputes the plan's installment — so with two lines each carrying a 32000
          schedule the account ledger reaches 64000 while each plan moves by exactly 32000.
        test_recipe:
          setup:
