        claim_type: input_set_filtering
        grounds:
          - calculations.vendor_invoice_settlement
        distinguishing_aspect: "FINAL includes only DONE assignments of the requested (vendor, week): a DONE assignment from another week and a CANCELLED assignment from the same week are both excluded, leaving a single 40000-cent line."
