      - name: error_response_envelope_shape
        claim_type: violation_to_error
        grounds: [response_envelope.error]
        distinguishing_aspect: "Every error response uses the fixed envelope: response_type == 'error', data.error_id and data.message present, meta.api_request_id and meta.api_request_timestamp present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /talent/employees/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response_type == 'error'; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string; meta.api_request_id present"

      - name: deemed_consent_via_deadline_batch
        claim_type: action_endpoint
        grounds: [state_machines.PostingApplication.PENDING_MANAGER_CONSENT_to_CONSENT_GRANTED, calculations.consent_deadline_arithmetic]
        distinguishing_aspect: "The ops-run batch converts silence into consent: a PENDING_MANAGER_CONSENT application whose consent_deadline has passed advances to CONSENT_GRANTED with advanced_consent_count == 1; an application still inside its window is untouched."
        test_recipe:
          setup: ["two applications on the posting: APP_A submitted at the default clock (deadline 2026-05-15T00:00:00Z); APP_B created after moving the clock to 2026-05-10 (deadline 2026-05-24); batch runs at 2026-05-20"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC111", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC111", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR111", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E111A", full_name: "Erin Aye", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e_a: $.data.id } }
