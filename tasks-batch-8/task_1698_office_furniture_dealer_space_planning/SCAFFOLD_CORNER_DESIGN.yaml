        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/dealerships"
              payload: {}
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == 'ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER' (test harness omits both headers on this call)"

