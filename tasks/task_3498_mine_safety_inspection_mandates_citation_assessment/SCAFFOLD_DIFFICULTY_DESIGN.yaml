  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: regular_completion_requires_all_plan_types_approved
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_COMPLETED
          - state_machines.MinePlan
          - errors.ERR_REQUIRED_PLAN_NOT_APPROVED
        distinguishing_aspect: |
          Entity pair Inspection x MinePlan: a REGULAR inspection's completion
          transition is gated on a DIFFERENT entity's state — the set of
          APPROVED plans at the mine. With VENTILATION and ROOF_CONTROL approved
          but EMERGENCY_RESPONSE missing, completion fails; approving the third
          plan (with fresh OCC version) unblocks the very same transition.
        test_recipe:
          setup:
            - "UNDERGROUND mine, cycle 1 [2026-01-01, 2026-03-31], REGULAR inspection IN_PROGRESS at 2026-02-15; VENTILATION and ROOF_CONTROL plans APPROVED, EMERGENCY_RESPONSE absent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/operators"
              payload: { legal_name: "Canyon Coal Co", annual_tonnage_tons: 1000, home_district: "D-11" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
            - call: "POST /msha/mines"
