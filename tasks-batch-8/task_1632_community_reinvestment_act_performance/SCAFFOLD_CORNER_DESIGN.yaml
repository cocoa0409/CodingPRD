      - name: confirm_loan_tract_not_in_area
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_TRACT_NOT_IN_AREA]"]
        distinguishing_aspect: "Confirming a loan whose census_tract is outside the area's delineated tracts fails ERR_TRACT_NOT_IN_AREA 422."
        test_recipe:
          setup: ["AssessmentArea ACTIVE with tracts [T1]; loan recorded with census_tract T9"]
          setup_api_calls:
