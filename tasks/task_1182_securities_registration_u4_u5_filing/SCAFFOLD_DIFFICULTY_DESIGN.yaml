scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: amendment_deadline_calendar_vs_regulatory_basis
        grounds:
          - calculations.amendment_deadline
          - entities.DisclosureEvent.fields.amendment_due_at
          - endpoints."PATCH /registration-desk/firms/{id}"
        distinguishing_aspect: |
          Dual variant on the DisclosureEvent domain: identical reported_at
          (2026-06-10T09:00:00Z) produces amendment_due_at 2026-07-10 under the
          default CALENDAR basis but 2026-07-22 under REGULATORY basis — a
          12-day divergence on the same inputs, resolved purely by the
          firm-level deadline_basis configuration.
        test_recipe:
          setup:
            - "Firm CAL keeps default CALENDAR basis; firm REG is patched to REGULATORY"
            - "One applicant per firm; clock pinned at 2026-06-10T09:00:00Z"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1001", legal_name: "Cal Firm" }
              as: SystemOperator
              captures: { firm_cal_id: $.data.id }
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1002", legal_name: "Reg Firm" }
              as: SystemOperator
              captures: { firm_reg_id: $.data.id }
            - call: "PATCH /registration-desk/firms/${firm_reg_id}"
              payload: { deadline_basis: "REGULATORY" }
              as: SystemOperator
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2001", full_name: "Alice Cal", date_of_birth: "1980-01-01" }
              as: RegistrationPrincipal
              captures: { app_cal_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2002", full_name: "Bob Reg", date_of_birth: "1980-01-01" }
              as: RegistrationPrincipal
              captures: { app_reg_id: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /registration-desk/disclosure-events"
              payload: { applicant_id: "${app_cal_id}", event_type: "BANKRUPTCY", event_date: "2026-06-01" }
              as: RegistrationPrincipal
              captures: { ev_cal_id: $.data.id }
            - call: "POST /registration-desk/disclosure-events"
              payload: { applicant_id: "${app_reg_id}", event_type: "BANKRUPTCY", event_date: "2026-06-01" }
              as: RegistrationPrincipal
              captures: { ev_reg_id: $.data.id }
          assert:
            - "DisclosureEvent.${ev_cal_id}.amendment_due_at date component == 2026-07-10 (2026-06-10 + 30 calendar days)"
            - "DisclosureEvent.${ev_reg_id}.amendment_due_at date component == 2026-07-22 (2026-06-10 + 30 business days: Jun 11,12,15-19,22-26,29-30, Jul 1-3,6-10,13-17,20-22)"
            - "the two due dates differ by exactly 12 days on identical inputs"

      - name: renewal_fee_first_vs_additional_registration_variant
        grounds:
          - calculations.renewal_fee
          - entities.RenewalInvoice.fields.base_fee_cents
          - endpoints."POST /registration-desk/renewal-invoices"
        distinguishing_aspect: |
          Dual variant on the RenewalInvoice domain (different entity domain
          from DisclosureEvent): the firm's FIRST-activated registration's
          invoice carries base_fee_cents 10000 while the SECOND-activated
          registration's invoice — same firm, same cycle, same single CA
          selection — carries base_fee_cents 5000; the provisional-vs-final
          axis is exercised because a renewal-estimate taken for the second
          request BEFORE the first request activated would have reported 10000
          (projected rank 0), while the final invoice pins rank by approved_at
          order at creation time.
        test_recipe:
          setup:
            - "One firm; RA approved 2026-06-02 (activates 2026-06-03); RB approved 2026-06-04 (activates 2026-06-05)"
            - "Each request has exactly one APPROVED CA STATE selection (5000 cents)"
            - "Clock at 2026-12-01T00:00:00Z (before 2027-01-01, days_late 0)"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1101", legal_name: "Fee Firm" }
              as: SystemOperator
              captures: { firm_f_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2101", full_name: "First Rep", date_of_birth: "1979-03-03" }
              as: RegistrationPrincipal
              captures: { app_a_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2102", full_name: "Second Rep", date_of_birth: "1979-04-04" }
              as: RegistrationPrincipal
              captures: { app_b_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_a_id}", firm_id: "${firm_f_id}", registration_category: "IA" }
              as: RegistrationPrincipal
              captures: { req_a_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_a_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/fingerprint-submissions"
              payload: { registration_request_id: "${req_a_id}", submission_channel: "ELECTRONIC" }
              as: RegistrationPrincipal
              captures: { fp_a_id: $.data.id }
            - call: "POST /registration-desk/fingerprint-submissions/${fp_a_id}/process"
              payload: { outcome: "CLEARED" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_a_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-fee-a"
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_a_id}", exam_code: "SIE" }
              as: RegistrationPrincipal
              captures: { sie_a_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_a_id}", exam_code: "S66" }
              as: RegistrationPrincipal
              captures: { s66_a_id: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_a_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_sie_a: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_sie_a}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${s66_a_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_s66_a: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_s66_a}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_a_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-fee-a"
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_b_id}", firm_id: "${firm_f_id}", registration_category: "IA" }
              as: RegistrationPrincipal
              captures: { req_b_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_b_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/fingerprint-submissions"
              payload: { registration_request_id: "${req_b_id}", submission_channel: "ELECTRONIC" }
              as: RegistrationPrincipal
              captures: { fp_b_id: $.data.id }
            - call: "POST /registration-desk/fingerprint-submissions/${fp_b_id}/process"
              payload: { outcome: "CLEARED" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_b_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-fee-b"
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_b_id}", exam_code: "SIE" }
              as: RegistrationPrincipal
              captures: { sie_b_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_b_id}", exam_code: "S66" }
              as: RegistrationPrincipal
              captures: { s66_b_id: $.data.id }
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_b_id}", window_start: "2026-06-03T00:00:00Z", window_end: "2026-06-05T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_sie_b: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_sie_b}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${s66_b_id}", window_start: "2026-06-03T00:00:00Z", window_end: "2026-06-05T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_s66_b: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_s66_b}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_b_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-fee-b"
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /registration-desk/renewal-invoices"
              payload: { registration_request_id: "${req_a_id}", cycle_year: 2027 }
              as: FinanceClerk
              captures: { inv_a_id: $.data.id }
            - call: "POST /registration-desk/renewal-invoices"
              payload: { registration_request_id: "${req_b_id}", cycle_year: 2027 }
              as: FinanceClerk
              captures: { inv_b_id: $.data.id }
          assert:
            - "RenewalInvoice.${inv_a_id}.base_fee_cents == 10000 (firm_rank 0: approved_at 2026-06-02 earliest)"
            - "RenewalInvoice.${inv_b_id}.base_fee_cents == 5000 (firm_rank 1: approved_at 2026-06-04 later)"
            - "RenewalInvoice.${inv_a_id}.total_cents == 15000 (jurisdictions 5000 + base 10000 + surcharge 0)"
            - "RenewalInvoice.${inv_b_id}.total_cents == 10000 (jurisdictions 5000 + base 5000 + surcharge 0)"
            - "the two invoices diverge by exactly 5000 cents on the same firm and cycle purely from firm_rank"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: renewal_fee_late_block_tiering_mode_a
        grounds:
          - calculations.renewal_fee
          - entities.RenewalInvoice.fields.late_surcharge_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: jurisdiction sum
          (state-filtered over APPROVED selections), firm_rank tiering
          (10000 vs 5000), and floor-division late blocks capped at 100%.
          Rank-0 registration with three APPROVED STATE selections at clock
          2027-01-15 (14 days late => one block => 25%): jurisdictions 15000 +
          base 10000 + round_half_up(10000*25/100)=2500 => total 27500.
          At 13 days late the same registration totals 25000 (blocks floor to 0).
        test_recipe:
          setup:
            - "Firm; request RC is the firm's only ACTIVE registration (rank 0); APPROVED selections CA, NY, TX (5000 each)"
            - "Clock advanced to 2027-01-15T00:00:00Z after activation (14 days into cycle year 2027)"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1201", legal_name: "Tier Firm" }
              as: SystemOperator
              captures: { firm_t_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2201", full_name: "Tier Rep", date_of_birth: "1983-03-03" }
              as: RegistrationPrincipal
              captures: { app_t_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_t_id}", firm_id: "${firm_t_id}", registration_category: "IA" }
              as: RegistrationPrincipal
              captures: { req_t_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_t_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_t_id}", jurisdiction_code: "NY", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_t_id}", jurisdiction_code: "TX", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/fingerprint-submissions"
              payload: { registration_request_id: "${req_t_id}", submission_channel: "ELECTRONIC" }
              as: RegistrationPrincipal
              captures: { fp_t_id: $.data.id }
            - call: "POST /registration-desk/fingerprint-submissions/${fp_t_id}/process"
              payload: { outcome: "CLEARED" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_t_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-tier"
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_t_id}", exam_code: "SIE" }
              as: RegistrationPrincipal
              captures: { sie_t_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_t_id}", exam_code: "S66" }
              as: RegistrationPrincipal
              captures: { s66_t_id: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_t_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-03T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_sie_t: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_sie_t}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${s66_t_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-03T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_s66_t: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_s66_t}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_t_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-tier"
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /registration-desk/renewal-invoices"
              payload: { registration_request_id: "${req_t_id}", cycle_year: 2027 }
              as: FinanceClerk
              captures: { inv_t_id: $.data.id }
          assert:
            - "RenewalInvoice.${inv_t_id}.jurisdiction_fee_cents == 15000"
            - "RenewalInvoice.${inv_t_id}.base_fee_cents == 10000 (firm_rank 0)"
            - "RenewalInvoice.${inv_t_id}.late_surcharge_cents == 2500 (floor(14/14)=1 block => 25% of 10000)"
            - "RenewalInvoice.${inv_t_id}.total_cents == 27500"

      - name: amendment_then_u5_deadline_anchor_mode_c
        grounds:
          - calculations.amendment_deadline
          - entities.TerminationFiling.fields.filing_deadline_at
        distinguishing_aspect: |
          Mode (c) — pinned evaluation order on an anchor that looks circular:
          filing_deadline_at is anchored on the INPUT termination_date (not on
          server-stamped filed_at), while is_late compares filed_at against
          that anchor; a U5 filed the same day it takes effect (termination_date
          2026-07-31, REGULATORY basis) yields deadline 2026-09-11 (30 business
          days) and is_late=false, but the SAME filing payload evaluated under
          CALENDAR basis yields 2026-08-30 — the two evaluation orders
          (anchor-then-extend vs stamp-then-compare) must not be interchanged.
        test_recipe:
          setup:
            - "Firm patched to REGULATORY basis; applicant with ACTIVE registration at that firm"
            - "Clock at 2026-07-31T12:00:00Z; U5 filed with termination_date 2026-07-31 (same day)"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1202", legal_name: "Anchor Firm" }
              as: SystemOperator
              captures: { firm_an_id: $.data.id }
            - call: "PATCH /registration-desk/firms/${firm_an_id}"
              payload: { deadline_basis: "REGULATORY" }
              as: SystemOperator
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2202", full_name: "Anchor Rep", date_of_birth: "1984-04-04" }
              as: RegistrationPrincipal
              captures: { app_an_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_an_id}", firm_id: "${firm_an_id}", registration_category: "IA" }
              as: RegistrationPrincipal
              captures: { req_an_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_an_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/fingerprint-submissions"
              payload: { registration_request_id: "${req_an_id}", submission_channel: "ELECTRONIC" }
              as: RegistrationPrincipal
              captures: { fp_an_id: $.data.id }
            - call: "POST /registration-desk/fingerprint-submissions/${fp_an_id}/process"
              payload: { outcome: "CLEARED" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_an_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-anchor"
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_an_id}", exam_code: "SIE" }
              as: RegistrationPrincipal
              captures: { sie_an_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_an_id}", exam_code: "S66" }
              as: RegistrationPrincipal
              captures: { s66_an_id: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_an_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-03T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_sie_an: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_sie_an}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${s66_an_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-03T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_s66_an: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_s66_an}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_an_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anchor"
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T12:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /registration-desk/termination-filings"
              payload: { registration_request_id: "${req_an_id}", termination_reason: "DISCHARGED", termination_date: "2026-07-31" }
              as: RegistrationPrincipal
              captures: { u5_an_id: $.data.id }
          assert:
            - "TerminationFiling.${u5_an_id}.filing_deadline_at date component == 2026-09-11 (2026-07-31 + 30 business days: Aug 3-7,10-14,17-21,24-28,31, Sep 1-4,7-11)"
            - "TerminationFiling.${u5_an_id}.is_late == false (filed_at 2026-07-31T12:00:00Z is not strictly after the deadline)"
            - "RegistrationRequest.${req_an_id}.status == TERMINATED (filing cascade)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: registration_request_deficiency_cycle_with_auto_withdraw
        grounds:
          - state_machines.RegistrationRequest.SUBMITTED_to_DEFICIENT
          - state_machines.RegistrationRequest.DEFICIENT_to_SUBMITTED
          - calculations.deficiency_auto_withdraw
        distinguishing_aspect: |
          RegistrationRequest runs the SUBMITTED -> DEFICIENT -> SUBMITTED loop
          twice and the THIRD return flips to WITHDRAWN instead of DEFICIENT
          (deficiency_count >= 3): the cycle terminates by count, not by actor
          choice, and the withdraw cascade fires on the auto-transition.
        test_recipe:
          setup:
            - "Firm, applicant, request with one CA STATE selection; submitter rp-cycle; reviewer co-cycle (different user, SoD satisfied)"
            - "Two full DEFICIENT cycles completed; third return is the trigger"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1301", legal_name: "Cycle Firm" }
              as: SystemOperator
              captures: { firm_c_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2301", full_name: "Cycle Rep", date_of_birth: "1985-05-05" }
              as: RegistrationPrincipal
              captures: { app_c_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_c_id}", firm_id: "${firm_c_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_c_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_c_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
