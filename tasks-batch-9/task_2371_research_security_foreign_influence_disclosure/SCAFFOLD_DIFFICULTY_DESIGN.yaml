          Project carries two state dimensions that never gate each other's transitions but both
          feed activation: clearing security moves security_status PENDING_CLEARANCE -> CLEARED
          while award_status stays ACTIVATION_PENDING, and the activation guard changes its
          verdict from SECURITY_NOT_CLEARED to DISCLOSURE_NOT_CERTIFIED without any award-status
