        distinguishing_aspect: "The start request's own response body already carries the recomputed program_cost_cents 1865000 alongside status IN_PROGRESS — the derived field is not left stale at its pre-write 0 for a later read — and the enrolled car's retrofit_required is true on the very next read with no clock movement."
