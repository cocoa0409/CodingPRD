    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_ZONE_NOT_FOUND, ERR_ZONE_SEQUENCE_VIOLATION, ERR_EMBED_SURVEY_NOT_ACCEPTED, ERR_ENGINEERING_POSTURE_FROZEN]
  - method: POST
    path: /installation-zones/{id}/hang-panels
    roles: [FieldSuperintendent]
    input: [hoist_reservation_id]
    output: InstallationZone
    description: "install_status ANCHORS_SET -> PANELS_HUNG; consumes the hoist reservation and writes provisional_labor_cost_cents (variant PROVISIONAL_FORWARD). Never touches weather_status."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ZONE_NOT_FOUND, ERR_HOIST_NOT_FOUND, ERR_ZONE_SEQUENCE_VIOLATION, ERR_ENGINEERING_POSTURE_FROZEN, ERR_PANEL_LOTS_NOT_SHIPPED, ERR_HOIST_WINDOW_INVALID]
  - method: POST
    path: /installation-zones/{id}/certify-weather-tight
    roles: [CWProjectManager]
    input: ["certification_note?"]
    output: InstallationZone
    description: "weather_status NOT_TIGHT or REMEDIATION -> WEATHER_TIGHT; writes final_labor_cost_cents (variant FINAL_CHRONOLOGICAL) and certified_line_cents, and rolls the package's earned value forward. Never touches install_status."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_ZONE_NOT_FOUND, ERR_ZONE_SEQUENCE_VIOLATION, ERR_ENGINEERING_POSTURE_FROZEN, ERR_NO_FIELD_TEST_EVIDENCE, ERR_OPEN_CRITICAL_DEFECT, ERR_THERMAL_MOVEMENT_EXCEEDED, ERR_BILLING_EXCEEDS_CONTRACT]
  - method: POST
    path: /installation-zones/{id}/retune-joint
    roles: [CWDetailer]
    input: [designed_joint_mm]
    output: InstallationZone
    description: "Re-details the movement joint and recomputes thermal_movement_allowance_mm against the current system and anchor configuration."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_VALUE_OUT_OF_RANGE, ERR_ZONE_NOT_FOUND]
  - method: GET
    path: /installation-zones/{id}/crew-day-logs
    roles: *all_roles
    input: ["status?"]
    output: CrewDayLog[]
    description: "Crew-day ledger of the zone in chronological order."
    errors: [ERR_MISSING_ROLE, ERR_ZONE_NOT_FOUND]
  - method: GET
    path: /installation-zones/{id}/field-tests
    roles: *all_roles
    input: ["test_kind?", "state?"]
    output: FieldTest[]
    description: "Field tests of the zone."
    errors: [ERR_MISSING_ROLE, ERR_ZONE_NOT_FOUND]

  # --- CrewDayLog ----------------------------------------------------------
  - method: POST
    path: /installation-zones/{id}/crew-days
    roles: [FieldSuperintendent]
    input: [work_date, crew_size, shift_hours, panels_installed]
    output: CrewDayLog
    description: "Posts a crew day; assigns day_index chronologically, splits straight and overtime person-hours, prices day_cost_cents and rolls the zone crew-hour ledger."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_MISSING_USER, ERR_INVALID_REQUEST, ERR_VALUE_OUT_OF_RANGE, ERR_ZONE_NOT_FOUND, ERR_CREW_DAY_DUPLICATE]
  - method: GET
    path: /crew-day-logs
    roles: *all_roles
    input: ["zone_id?", "status?", "work_date?", "limit?", "offset?"]
    output: CrewDayLog[]
    description: "Filtered crew-day list."
    errors: [ERR_MISSING_ROLE, ERR_INVALID_ENUM]
  - method: GET
    path: /crew-day-logs/{id}
    roles: *all_roles
    input: []
    output: CrewDayLog
    description: "Reads one crew day."
    errors: [ERR_MISSING_ROLE, ERR_RESOURCE_NOT_FOUND]
  - method: POST
    path: /installation-zones/{id}/crew-days/{crew_day_id}/void
    roles: [FieldSuperintendent]
    input: [void_reason]
    output: CrewDayLog
    description: "Compensating action: voids a posted crew day, re-packs day_index over the survivors and restores budget_crew_hours == consumed_crew_hours + remaining_crew_hours."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ZONE_NOT_FOUND, ERR_RESOURCE_NOT_FOUND, ERR_TERMINAL_STATE]

  # --- HoistRig / HoistReservation -----------------------------------------
  - method: POST
    path: /hoist-rigs
    roles: [FieldSuperintendent]
    input: [package_id, rig_code, rig_kind, capacity_panels_per_shift, "changeover_buffer_minutes?"]
    output: HoistRig
    description: "Registers a hoist or crane with its changeover buffer (default 45 minutes)."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_VALUE_OUT_OF_RANGE, ERR_PACKAGE_NOT_FOUND]
  - method: GET
    path: /hoist-rigs
    roles: *all_roles
    input: ["package_id?", "status?", "limit?", "offset?"]
    output: HoistRig[]
    description: "Filtered rig list."
    errors: [ERR_MISSING_ROLE, ERR_INVALID_ENUM]
  - method: GET
    path: /hoist-rigs/{id}
    roles: *all_roles
    input: []
    output: HoistRig
    description: "Reads one rig."
    errors: [ERR_MISSING_ROLE, ERR_HOIST_NOT_FOUND]
  - method: GET
    path: /hoist-rigs/{id}/reservations
    roles: *all_roles
    input: ["status?"]
    output: HoistReservation[]
    description: "Reservations on this rig with their buffer-expanded blocked intervals."
    errors: [ERR_MISSING_ROLE, ERR_HOIST_NOT_FOUND]
  - method: POST
    path: /hoist-reservations
    roles: [FieldSuperintendent]
    input: [rig_id, zone_id, window_start, window_end, planned_panel_count]
    output: HoistReservation
    description: "Reserves exclusive rig occupancy. Stores blocked_from = window_start - changeover_buffer_minutes and blocked_until = window_end + changeover_buffer_minutes; the requested raw [window_start, window_end) must not intersect any RESERVED or CONSUMED reservation's [blocked_from, blocked_until) on that rig."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_WINDOW, ERR_VALUE_OUT_OF_RANGE, ERR_HOIST_NOT_FOUND, ERR_ZONE_NOT_FOUND, ERR_HOIST_WINDOW_CONFLICT]
  - method: GET
    path: /hoist-reservations
    roles: *all_roles
    input: ["rig_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: HoistReservation[]
    description: "Filtered reservation list."
    errors: [ERR_MISSING_ROLE, ERR_INVALID_ENUM]
  - method: GET
    path: /hoist-reservations/{id}
    roles: *all_roles
    input: []
    output: HoistReservation
    description: "Reads one reservation."
    errors: [ERR_MISSING_ROLE, ERR_HOIST_NOT_FOUND]
  - method: POST
    path: /hoist-reservations/{id}/cancel
    roles: [FieldSuperintendent]
    input: [cancelled_reason]
    output: HoistReservation
    description: "Releases the rig window and its buffer so a previously conflicting reservation becomes bookable."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_HOIST_NOT_FOUND, ERR_TERMINAL_STATE]

  # --- FieldTest -----------------------------------------------------------
  - method: POST
    path: /installation-zones/{id}/field-tests
    roles: [QCInspector]
    input: [test_kind, scheduled_for, "attempt_no?"]
    output: FieldTest
    description: "Schedules an AAMA 501.2 water, air-infiltration or structural-deflection field test on the zone."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_ZONE_NOT_FOUND, ERR_DEFLECTION_LIMIT_UNSET]
  - method: GET
    path: /field-tests
    roles: *all_roles
    input: ["zone_id?", "test_kind?", "state?", "limit?", "offset?"]
    output: FieldTest[]
    description: "Filtered field-test list."
    errors: [ERR_MISSING_ROLE, ERR_INVALID_ENUM]
  - method: GET
    path: /field-tests/{id}
    roles: *all_roles
    input: []
    output: FieldTest
    description: "Reads one field test, including outcome_reason."
    errors: [ERR_MISSING_ROLE, ERR_TEST_NOT_FOUND]
  - method: POST
    path: /field-tests/{id}/record-result
    roles: [QCInspector]
    input: ["water_penetration_observed?", "measured_air_leakage_cfm?", "measured_deflection_mm?"]
    output: FieldTest
    description: "SCHEDULED -> PASSED or FAILED against the kind's tolerance. A failure runs the four-hop defect / posture / weather-status / earned-value cascade."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_TEST_NOT_FOUND, ERR_INVALID_STATE, ERR_TERMINAL_STATE, ERR_ZONE_SEQUENCE_VIOLATION]

  # --- DefectItem ----------------------------------------------------------
  - method: POST
    path: /defect-items
    roles: [QCInspector, ArchitectOfRecord]
    input: [package_id, "zone_id?", "field_test_id?", "mockup_test_id?", origin, severity, description]
    output: DefectItem
    description: "Raises a punch-list or nonconformance item in OPEN and recomputes the package's posture."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_MISSING_USER, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_PACKAGE_NOT_FOUND, ERR_ZONE_NOT_FOUND, ERR_TEST_NOT_FOUND]
  - method: GET
    path: /defect-items
    roles: *all_roles
    input: ["package_id?", "zone_id?", "field_test_id?", "mockup_test_id?", "status?", "severity?", "origin?", "limit?", "offset?"]
    output: DefectItem[]
    description: "Filtered defect list; this is the punch list."
    errors: [ERR_MISSING_ROLE, ERR_INVALID_ENUM]
  - method: GET
    path: /defect-items/{id}
    roles: *all_roles
    input: []
    output: DefectItem
    description: "Reads one defect item, including reinspect_fail_count."
    errors: [ERR_MISSING_ROLE, ERR_DEFECT_NOT_FOUND]
  - method: POST
    path: /defect-items/{id}/submit-remediation
    roles: [CWDetailer]
    input: [remediation_note]
    output: DefectItem
    description: "OPEN -> REMEDIATION_SUBMITTED."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DEFECT_NOT_FOUND, ERR_INVALID_STATE, ERR_TERMINAL_STATE]
  - method: POST
    path: /defect-items/{id}/reinspect
    roles: [QCInspector]
    input: [outcome]
    output: DefectItem
    description: "REMEDIATION_SUBMITTED -> CLOSED on PASS, or back to OPEN on FAIL. The raiser may not re-inspect their own item."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_MISSING_USER, ERR_INVALID_ENUM, ERR_DEFECT_NOT_FOUND, ERR_INVALID_STATE, ERR_TERMINAL_STATE, ERR_INSPECTOR_CONFLICT]
  - method: POST
    path: /defect-items/{id}/waive
    roles: [ArchitectOfRecord]
    input: [waiver_ref]
    output: DefectItem
    description: "OPEN -> WAIVED for non-critical items only."
    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DEFECT_NOT_FOUND, ERR_INVALID_STATE, ERR_TERMINAL_STATE, ERR_WAIVER_NOT_PERMITTED]

# ---------------------------------------------------------------------------
# §1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  - error_id: ERR_MISSING_ROLE
    http_status: 401
    message: "X-Role header is required"
    triggered_by: "any endpoint call without an X-Role header"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "role is not permitted to perform this operation"
    triggered_by: "POST /shop-drawing-submittals/{id}/review as CWDetailer, POST /installation-zones/{id}/certify-weather-tight as QCInspector, POST /breakage-draws as FieldSuperintendent"
  - error_id: ERR_MISSING_USER
    http_status: 401
    message: "X-User-ID header is required for this operation"
    triggered_by: "POST /shop-drawing-submittals/{id}/seal or POST /defect-items/{id}/reinspect without X-User-ID"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "required field missing or wrongly typed"
    triggered_by: "POST /installation-zones without span_mm"
  - error_id: ERR_INVALID_ENUM
    http_status: 400
    message: "field value is outside the permitted set"
    triggered_by: "POST /panel-lots/{id}/advance-fabrication with to_status DELIVERED"
  - error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 400
    message: "numeric field is outside its permitted range"
    triggered_by: "POST /installation-zones with area_sqm 0"
  - error_id: ERR_INVALID_WINDOW
    http_status: 400
    message: "window_end must be after window_start"
    triggered_by: "POST /hoist-reservations with window_end == window_start"
  - error_id: ERR_PACKAGE_NOT_FOUND
    http_status: 404
    message: "facade package does not exist"
    triggered_by: "GET /facade-packages/{id} with an unknown id"
  - error_id: ERR_SUBMITTAL_NOT_FOUND
    http_status: 404
    message: "shop drawing submittal does not exist"
    triggered_by: "GET /shop-drawing-submittals/{id} with an unknown id"
  - error_id: ERR_GLASS_ORDER_NOT_FOUND
    http_status: 404
    message: "glass order does not exist"
    triggered_by: "GET /glass-orders/{id} with an unknown id"
  - error_id: ERR_ZONE_NOT_FOUND
    http_status: 404
    message: "installation zone does not exist"
    triggered_by: "GET /installation-zones/{id} with an unknown id"
  - error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    message: "panel lot or fabrication release does not exist"
    triggered_by: "GET /panel-lots/{id} with an unknown id"
  - error_id: ERR_SURVEY_NOT_FOUND
    http_status: 404
    message: "anchor embed survey does not exist"
    triggered_by: "GET /embed-surveys/{id} with an unknown id"
  - error_id: ERR_TEST_NOT_FOUND
    http_status: 404
    message: "mockup test or field test does not exist"
    triggered_by: "GET /field-tests/{id} with an unknown id"
  - error_id: ERR_DEFECT_NOT_FOUND
    http_status: 404
    message: "defect item does not exist"
    triggered_by: "GET /defect-items/{id} with an unknown id"
  - error_id: ERR_HOIST_NOT_FOUND
    http_status: 404
    message: "hoist rig or reservation does not exist"
    triggered_by: "GET /hoist-reservations/{id} with an unknown id"
  - error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    message: "referenced test lab, crew day log or breakage draw does not exist"
    triggered_by: "GET /crew-day-logs/{id} with an unknown id"
  - error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412
    message: "expected_package_version does not match the current facade package version"
    triggered_by: "POST /fabrication-releases with a package version captured before a system-decision or defect write"
  - error_id: ERR_STALE_GLASS_ORDER_VERSION
    http_status: 412
    message: "expected_glass_order_version does not match the current glass order version"
    triggered_by: "POST /breakage-draws with a glass order version captured before an earlier draw"
  - error_id: ERR_INVALID_STATE
    http_status: 409
    message: "the entity's current state has no transition for this trigger"
    triggered_by: "POST /shop-drawing-submittals/{id}/review while the submittal is still SUBMITTED"
  - error_id: ERR_TERMINAL_STATE
    http_status: 409
    message: "the entity is in a terminal state and accepts no further transitions"
    triggered_by: "POST /shop-drawing-submittals/{id}/resubmit on an APPROVED submittal"
  - error_id: ERR_ZONE_SEQUENCE_VIOLATION
    http_status: 409
    message: "the zone is not at the install_status this operation requires"
    triggered_by: "POST /installation-zones/{id}/hang-panels while the zone is still PLANNED"
  - error_id: ERR_DISPUTE_REF_REQUIRED
    http_status: 409
    message: "an escalated submittal can only be resubmitted with a dispute_resolution_ref"
    triggered_by: "POST /shop-drawing-submittals/{id}/resubmit on an ESCALATED submittal with no dispute_resolution_ref"
  - error_id: ERR_COATING_REVISION_AFTER_RECEIPT
    http_status: 409
    message: "the coating specification cannot be revised once the glass has been received"
    triggered_by: "POST /glass-orders/{id}/coating-revision on a RECEIVED order"
  - error_id: ERR_CREW_DAY_DUPLICATE
    http_status: 409
    message: "a posted crew day already exists for this zone and work_date"
    triggered_by: "POST /installation-zones/{id}/crew-days twice for 2026-08-10"
  - error_id: ERR_HOIST_WINDOW_CONFLICT
    http_status: 409
    message: "the requested rig window conflicts with an existing reservation once the changeover buffer is applied"
    triggered_by: "POST /hoist-reservations 30 minutes after an existing window ends on a rig with changeover_buffer_minutes 45"
  - error_id: ERR_LAB_CAPACITY_EXCEEDED
    http_status: 409
    message: "the lab has no free chamber for the requested window"
    triggered_by: "POST /mockup-tests requesting a second chamber on a lab with chamber_capacity 1 over an intersecting window"
  - error_id: ERR_SEAL_REQUIRED
    http_status: 422
    message: "a delegated-design or structural-calculation submittal must be sealed before review"
    triggered_by: "POST /shop-drawing-submittals/{id}/start-review on an unsealed STRUCTURAL_CALCULATION submittal"
  - error_id: ERR_SEAL_INVALID
    http_status: 422
    message: "the seal is missing a license number or the revision is already sealed"
    triggered_by: "POST /shop-drawing-submittals/{id}/seal twice for the same revision_cycle"
  - error_id: ERR_SEALER_CANNOT_REVIEW
    http_status: 422
    message: "the engineer who sealed the set cannot review it"
    triggered_by: "POST /shop-drawing-submittals/{id}/start-review with X-User-ID equal to sealed_by_user_id"
  - error_id: ERR_INSPECTOR_CONFLICT
    http_status: 422
    message: "the inspector who raised the item cannot re-inspect it"
    triggered_by: "POST /defect-items/{id}/reinspect with X-User-ID equal to raised_by_user_id"
  - error_id: ERR_SUBMITTAL_NOT_APPROVED
    http_status: 422
    message: "fabrication requires an approved or approved-as-noted submittal"
    triggered_by: "POST /fabrication-releases against a submittal in REVISION_REQUIRED"
  - error_id: ERR_ENGINEERING_POSTURE_FROZEN
    http_status: 422
    message: "the package's engineering posture is FROZEN"
    triggered_by: "POST /fabrication-releases while a submittal of the package is ESCALATED"
  - error_id: ERR_MOCKUP_NOT_QUALIFIED
    http_status: 422
    message: "no performance mockup has passed for this package"
    triggered_by: "POST /fabrication-releases before any MockupTest reaches PASSED"
  - error_id: ERR_EMBED_SURVEY_NOT_ACCEPTED
    http_status: 422
    message: "the zone has no poured, accepted embed survey"
    triggered_by: "POST /installation-zones/{id}/set-anchors while the survey is REJECTED"
  - error_id: ERR_POUR_BEFORE_ACCEPTANCE
    http_status: 422
    message: "the pour cannot be confirmed before the embeds are accepted"
    triggered_by: "POST /embed-surveys/{id}/confirm-pour on a PENDING_SURVEY survey"
  - error_id: ERR_PANEL_LOTS_NOT_SHIPPED
    http_status: 422
    message: "every panel lot of the zone must be shipped before panels are hung"
    triggered_by: "POST /installation-zones/{id}/hang-panels with a lot still GLAZED or ON_HOLD"
  - error_id: ERR_HOIST_WINDOW_INVALID
    http_status: 422
    message: "the referenced hoist reservation is not usable now"
    triggered_by: "POST /installation-zones/{id}/hang-panels with the logical clock past window_end"
  - error_id: ERR_NO_FIELD_TEST_EVIDENCE
    http_status: 422
    message: "weather-tightness certification requires a passed water test and a passed air test"
    triggered_by: "POST /installation-zones/{id}/certify-weather-tight with an empty passed-test set"
  - error_id: ERR_OPEN_CRITICAL_DEFECT
    http_status: 422
    message: "a critical defect is still open in scope"
    triggered_by: "POST /installation-zones/{id}/certify-weather-tight while a CRITICAL DefectItem of the zone is OPEN"
  - error_id: ERR_THERMAL_MOVEMENT_EXCEEDED
    http_status: 422
    message: "computed thermal movement exceeds the detailed joint width"
    triggered_by: "POST /installation-zones/{id}/certify-weather-tight on a zone whose designed_joint_mm was retuned below the computed allowance"
  - error_id: ERR_DEFLECTION_LIMIT_UNSET
    http_status: 422
    message: "the deflection limit is unknown until the system type is decided"
    triggered_by: "POST /installation-zones/{id}/field-tests with test_kind STRUCTURAL_DEFLECTION while the package system_type is still UNDECIDED"
  - error_id: ERR_WAIVER_NOT_PERMITTED
    http_status: 422
    message: "critical defects cannot be waived"
    triggered_by: "POST /defect-items/{id}/waive on a CRITICAL item"
  - error_id: ERR_GLASS_BALANCE_INSUFFICIENT
    http_status: 422
    message: "the glass order has too few unallocated lites for this release"
    triggered_by: "POST /fabrication-releases requesting more lites than unallocated_lites"
  - error_id: ERR_BREAKAGE_STOCK_EXHAUSTED
    http_status: 422
    message: "the requested draw exceeds available breakage stock"
    triggered_by: "POST /breakage-draws for 8 lites against available_stock_lites 7"
  - error_id: ERR_DRAW_QUANTITY_INVALID
    http_status: 422
    message: "the requested draw exceeds the glass content of the lot being repaired"
    triggered_by: "POST /breakage-draws for 30 lites against a PanelLot whose lite_count is 20, while available_stock_lites is 72"
  - error_id: ERR_GLASS_RISK_THRESHOLD_EXCEEDED
    http_status: 422
    message: "the glass order's procurement risk score is at or above the release threshold"
    triggered_by: "POST /fabrication-releases against an order whose risk_score is exactly 70.00"
  - error_id: ERR_BILLING_EXCEEDS_CONTRACT
    http_status: 422
    message: "certifying this zone would bill past the contract value"
    triggered_by: "POST /installation-zones/{id}/certify-weather-tight on a package whose contract_value_cents is below the resulting subtotal"
  - error_id: ERR_ZONES_NOT_WEATHER_TIGHT
    http_status: 422
    message: "every zone must be weather-tight before close-out"
    triggered_by: "POST /facade-packages/{id}/close-out after a new InstallationZone has been added to a package already in WEATHER_TIGHT_ACHIEVED (the package state is unaffected by the new zone, so the roster check is what catches it)"
  - error_id: ERR_PUNCH_LIST_OPEN
    http_status: 422
    message: "open punch items or open submittal notes block close-out"
    triggered_by: "POST /facade-packages/{id}/close-out with open_notes_count 2 on an APPROVED_AS_NOTED submittal"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - role: CWProjectManager
    identity: opaque
    description: "Curtain wall subcontractor's project manager: owns the package, the unitized-versus-stick-built decision, fabrication release and weather-tightness certification."
    exclusive_operations:
      - "POST /facade-packages"
      - "POST /facade-packages/{id}/system-decision"
      - "POST /facade-packages/{id}/close-out"
      - "POST /fabrication-releases"
      - "POST /installation-zones"
      - "POST /installation-zones/{id}/certify-weather-tight"
      - "POST /test-labs"
    shared_operations:
      - "POST /mockup-tests (with QCInspector)"
      - "POST /glass-orders/{id}/recompute-risk (with GlazingProcurement)"
      - "every GET"
  - role: CWDetailer
    identity: opaque
    description: "Shop-drawing detailer: prepares and resubmits submittals, re-details movement joints, answers punch items."
    exclusive_operations:
      - "POST /shop-drawing-submittals"
      - "POST /shop-drawing-submittals/{id}/resubmit"
      - "POST /installation-zones/{id}/retune-joint"
      - "POST /defect-items/{id}/submit-remediation"
    shared_operations:
      - "every GET"
  - role: DelegatedEngineer
    identity: opaque
    description: "Delegated design engineer of record for the curtain wall: seals structural calculations and delegated-design drawing sets. Never reviews what it sealed."
    exclusive_operations:
      - "POST /shop-drawing-submittals/{id}/seal"
    shared_operations:
      - "every GET"
  - role: ArchitectOfRecord
    identity: opaque
    description: "Architect / owner's reviewer: runs the submittal review cycle, closes review notes and waives non-critical punch items."
    exclusive_operations:
      - "POST /shop-drawing-submittals/{id}/start-review"
      - "POST /shop-drawing-submittals/{id}/review"
      - "POST /shop-drawing-submittals/{id}/close-notes"
      - "POST /defect-items/{id}/waive"
    shared_operations:
      - "POST /defect-items (with QCInspector)"
      - "every GET"
  - role: GlazingProcurement
    identity: opaque
    description: "Glass procurement: places orders, manages coating revisions, expedites, receipt and breakage stock."
    exclusive_operations:
      - "POST /glass-orders"
      - "POST /glass-orders/{id}/start-production"
      - "POST /glass-orders/{id}/coating-revision"
      - "POST /glass-orders/{id}/request-expedite"
      - "POST /glass-orders/{id}/receive"
      - "POST /breakage-draws"
      - "POST /breakage-draws/{id}/cancel"
    shared_operations:
      - "POST /glass-orders/{id}/recompute-risk (with CWProjectManager)"
      - "every GET"
  - role: StructuralContractor
    identity: opaque
    description: "The structural contractor pouring the slab edges: owns embed layout survey and pour confirmation."
    exclusive_operations:
      - "POST /installation-zones/{id}/embed-surveys"
      - "POST /embed-surveys/{id}/survey"
      - "POST /embed-surveys/{id}/confirm-pour"
    shared_operations:
      - "every GET"
  - role: FieldSuperintendent
    identity: opaque
    description: "Field superintendent: hoisting, staging, installation sequence, crew-day logs and shop-to-site lot movement."
    exclusive_operations:
      - "POST /panel-lots/{id}/advance-fabrication"
      - "POST /hoist-rigs"
      - "POST /hoist-reservations"
      - "POST /hoist-reservations/{id}/cancel"
      - "POST /installation-zones/{id}/set-anchors"
      - "POST /installation-zones/{id}/hang-panels"
      - "POST /installation-zones/{id}/crew-days"
      - "POST /installation-zones/{id}/crew-days/{crew_day_id}/void"
    shared_operations:
      - "every GET"
  - role: QCInspector
    identity: opaque
    description: "Quality control / testing agency: records mockup and field test results and raises defects. Cannot re-inspect an item it raised."
    exclusive_operations:
      - "POST /mockup-tests/{id}/record-result"
      - "POST /installation-zones/{id}/field-tests"
      - "POST /field-tests/{id}/record-result"
      - "POST /defect-items/{id}/reinspect"
    shared_operations:
      - "POST /mockup-tests (with CWProjectManager)"
      - "POST /defect-items (with ArchitectOfRecord)"
      - "every GET"
