              payload: { parcel_id: "${parcel_id}", justification: "Canal Street yard is surplus after depot consolidation." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/adopt"
              payload: { resolution_number: "RES-2026-245" }
              as: BoardClerk
              as_user_id: "clerk-adopt-1"
          trigger:
            - call: "POST /declarations/${decl_id}/issue-notices"
              payload:
                recipient_agency_ids: ["${pref_agency_id}", "${nbr_agency_id}"]
                response_window_days: 60
              as: RealPropertyOfficer
          assert:
            - "the response status is HTTP 422 and data.error_id == ERR_NOTICE_REGISTRY_LAPSED"
            - "GET /notices filtered by declaration_id ${decl_id} returns total_count == 0 - the REGISTERED recipient was not served either"
            - "SurplusDeclaration.${decl_id}.status is still ADOPTED with notice_issued_at, notice_response_window_days and notice_response_deadline_at all null"
            - "GET /agencies filtered by notice_registry_status LAPSED returns total_count == 1"

