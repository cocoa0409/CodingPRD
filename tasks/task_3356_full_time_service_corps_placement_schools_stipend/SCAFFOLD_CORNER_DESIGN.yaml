              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { team_mid: $.data.status, team_vmid: $.data.version }
            - call: "POST /corps/teams/${team_id}/assignments"
              payload: { corps_member_id: "${member2_id}", start_date: "2026-09-02", expected_team_version: "${team_vmid}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg2_bf: $.data.is_backfill }
            - call: "GET /corps/teams/${team_id}"
              payload: {}
              as: ProgramManager
