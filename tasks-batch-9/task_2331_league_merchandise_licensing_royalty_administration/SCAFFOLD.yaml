  # ------------------------------------------------------- LicenseAgreement
  - method: POST
    path: /licensing/agreements
    description: Draft a license agreement for a licensee and product category.
    roles: [LeagueLicensingManager]
    code: 201
    input: ["licensee_id", "category_id", "exclusivity_mode", "minimum_guarantee_cents", "required_advance_cents", "term_start_date", "term_end_date", "central_licensing_flag?"]
    output: LicenseAgreement
    side_effects:
      - "contract_status starts at DRAFT and compliance_posture at CLEAR (independent dimensions)"
      - "sets contract_year_start_quarter = QUARTER_OF(term_start_date)"
      - "unrecouped_advance_cents and recouped_advance_cents both start at 0 alongside advance_paid_cents == 0"

  - method: GET
    path: /licensing/agreements
    description: List license agreements.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee]
    code: 200
    input: ["licensee_id?", "category_id?", "contract_status?", "compliance_posture?", "central_licensing_flag?", "limit?", "offset?"]
    output: LicenseAgreement[]
    side_effects: []

  - method: GET
    path: /licensing/agreements/{agreementId}
    description: Retrieve one license agreement including its ledger fields.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []

  - method: PATCH
    path: /licensing/agreements/{agreementId}
    description: Amend a DRAFT agreement's commercial terms.
    roles: [LeagueLicensingManager]
    code: 200
    input: ["exclusivity_mode?", "minimum_guarantee_cents?", "required_advance_cents?", "term_end_date?", "central_licensing_flag?"]
    output: LicenseAgreement
    side_effects:
      - "permitted only while contract_status == DRAFT (§1.4 priority 12)"
      - "increments LicenseAgreement.version by 1"

  - method: POST
    path: /licensing/agreements/{agreementId}/contract-status
    description: Move the agreement along its contract dimension.
    roles: [LeagueLicensingManager, MarkComplianceOfficer]
    code: 200
    input: ["action", "reason?", "countersigned_by?"]
    output: LicenseAgreement
    side_effects:
      - "drives SM2 only; compliance_posture is never changed by this endpoint"

  - method: POST
    path: /licensing/agreements/{agreementId}/advance-payments
    description: Record an advance payment against the contracted advance.
    roles: [FinanceController, Licensee]
    code: 200
    input: ["amount_cents"]
    output: LicenseAgreement
    side_effects:
      - "advance_paid_cents += amount_cents and unrecouped_advance_cents += amount_cents, preserving advance_paid_cents == unrecouped_advance_cents + recouped_advance_cents"
      - "increments LicenseAgreement.version by 1"

  - method: POST
    path: /licensing/agreements/{agreementId}/annual-true-up
    description: Compute the FINAL_ANNUAL_TRUE_UP royalty variant for one contract year.
    roles: [FinanceController, RoyaltyAuditor]
    code: 200
    input: ["contract_year"]
    output: { agreement_id: string, contract_year: integer, included_report_count: integer, cumulative_net_regular_cents: integer, true_up_royalty_cents: integer, provisional_total_cents: integer, delta_cents: integer }
    side_effects:
      - "read-only projection; never writes to any RoyaltyReport or to the agreement ledger"
      - "delta_cents may be negative when the marginal computation lands below the sum of the provisional quarters"

  - method: POST
    path: /licensing/agreements/{agreementId}/territory-grants
    description: Grant a territory / channel right under an agreement.
    roles: [LeagueLicensingManager]
    code: 201
    input: ["territory_code", "channel_class", "effective_from", "effective_to"]
    output: TerritoryGrant
    side_effects:
