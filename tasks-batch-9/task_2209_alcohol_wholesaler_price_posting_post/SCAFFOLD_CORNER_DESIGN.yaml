            - call: "GET /wholesalers/${whA}"
              as: ComplianceOfficer
            - call: "GET /wholesalers/${whA}/penalty-exposure"
              as: ComplianceOfficer
            - call: "GET /audit-findings?audit_id=${audit1}"
