      - name: corner_glycol_penalties_are_each_rounded_before_they_are_subtracted
        claim_type: Precision
        grounds:
          - calculations.glycol_health_score
          - entities.GlycolLoop.fields.window_avg_cooler_temp_f
          - entities.GlycolLoop.fields.health_score
          - endpoints.POST_cooler_readings
          - endpoints.GET_glycol_loops
        distinguishing_aspect: |
          Readings 38.00, 39.00 and 39.50 average to 38.8333..., which is stored
          rounded to 38.83, and the temperature penalty is taken from that stored
          value: (38.83 - 38.00) * 8.0 = 6.64, giving health_score exactly 93.36
          — not the 93.33 that carrying the unrounded 38.8333... average into the
          penalty would produce.
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z so days_since_service is 0 and service_penalty is 0."
            - "ServiceAccount 'Chiller House' created with glycol_system_present true, so one GlycolLoop exists at glycol_pct 35.0 (no glycol penalty) and pump_psi 12.0 (no pump penalty)."
            - "Exactly three CoolerReading rows on that loop: cooler_temp_f 38.00, 39.00 and 39.50 — exactly READING_WINDOW rows, so all three are in the window."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Chiller House", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: true }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id }
            - call: "GET /draft-service/glycol-loops?account_id=${acct}&limit=10&offset=0"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { loop: "$.data[0].id", score0: "$.data[0].health_score" }
          trigger:
            - call: "POST /draft-service/cooler-readings"
              payload: { glycol_loop_id: "${loop}", cooler_temp_f: 38.00, glycol_supply_temp_f: 30.00 }
              as: VenueManager
              as_user_id: "${acct}"
              captures: { r1: $.data.id, r1_source: $.data.source }
            - call: "POST /draft-service/cooler-readings"
              payload: { glycol_loop_id: "${loop}", cooler_temp_f: 39.00, glycol_supply_temp_f: 30.00 }
              as: VenueManager
              as_user_id: "${acct}"
              captures: { r2: $.data.id }
            - call: "POST /draft-service/cooler-readings"
              payload: { glycol_loop_id: "${loop}", cooler_temp_f: 39.50, glycol_supply_temp_f: 30.00 }
              as: VenueManager
              as_user_id: "${acct}"
              captures: { r3: $.data.id }
            - call: "GET /draft-service/glycol-loops/${loop}"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { avg: $.data.window_avg_cooler_temp_f, score: $.data.health_score, band: $.data.status }
          assert:
            - "${score0} == 100.00 — the loop scores exactly 100.00 before any reading exists"
            - "${r1_source} == VENUE_MANUAL — source is derived from X-User-Role, not supplied"
            - "${avg} == 38.83"
            - "${score} == 93.36 (100.00 - 6.64), NOT 93.33"
            - "${band} == NORMAL"
            - "GlycolLoop.${loop}.glycol_pct == 35.0 and .pump_psi == 12.0 — no glycol or pump penalty contributed"
            - "GlycolLoop.${loop}.last_serviced_at == 2026-08-01T00:00:00Z so service_penalty is 0.00"

