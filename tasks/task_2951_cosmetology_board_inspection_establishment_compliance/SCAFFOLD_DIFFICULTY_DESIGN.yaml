            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "COMPLAINT_DRIVEN", window_start_at: "2026-08-06T09:00:00Z", window_end_at: "2026-08-06T13:00:00Z", inspector_user_id: "insp-003", complaint_reference: "CMPL-2026-0441" }
              as: Inspector
              as_user_id: "insp-003"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
