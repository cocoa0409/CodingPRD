  - section: consistency_model
    instances:
      - name: signing_response_already_reflects_every_cascade_hop
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Negotiation.AGREED_to_SIGNED
          - entities.Member.fields.annual_committed_cents
          - endpoints.POST_/erm/negotiations/{id}/sign
        distinguishing_aspect: |
          The consistency model is immediate, so the cascade the signature triggers must be fully visible
          without any second write or delay: the 201 body itself carries the new Subscription, and a read
          issued immediately afterwards must already show the commitment CONFIRMED at 4500000 and the
          member ledger at 4500000 - no lag, no re-read loop.
        test_recipe:
          setup:
            - "Vendor Atlas Scholarly with vpat_on_file true, one product and Member Alpha College with an ENDORSED trial and a PLEDGED commitment projected at 4500000 cents."
            - "The negotiation is AGREED at 9000000 cents, submitted by neg-1, and the signature is executed by admin-1."
            - "Before the signature, Member.annual_committed_cents is 0 and Commitment.tier_price_cents is null."
