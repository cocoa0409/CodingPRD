# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Jury Duty Management
# Grounds resolve into SCAFFOLD.yaml §1.1–§1.7. 9 rules × ≥2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pay_estimated_vs_final_on_summons
        grounds:
          - calculations.pay_computation
          - state_machines.Panel.FORMING_to_SEATED
          - state_machines.Summons.SERVING_to_RELEASED
          - entities.PayVoucher.fields.total_cents
        distinguishing_aspect: |
          The ESTIMATED voucher (issued at panel seating) counts only the 2 check-ins
          recorded before seating (total 6126), while the FINAL voucher (issued at
          release) re-counts and re-caps over all 4 check-ins (total 10189) — same
          juror, two algorithms, different cents; the dual variant lives on the Summons/PayVoucher domain.
        test_recipe:
          setup:
            - "Term OPEN: daily_pay 4000, half_day_pay 2000, full_day_hours 6.0, mileage_rate 25 c/mi, pay_day_cap 3."
            - "Juror (round_trip_miles 2.50) admin-qualified; one summons drawn and QUALIFIED_PENDING after questionnaire is skipped via admin qualify path."
            - "Trial READY with a 1-seat panel; summons has 2 FULL/HALF check-ins, is seated (ESTIMATED voucher), gets 2 more check-ins, then released (FINAL voucher)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: JuryAdministrator
            - call: "POST /service-terms"
              payload: { name: "T1", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Ada J", birth_year: 1980, round_trip_miles: 2.50 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/check-in"
              payload: { service_date: "2026-07-01T00:00:00Z", on_floor_hours: 8.0 }
              as: CourtClerk
            - call: "POST /summonses/${summons_id}/check-in"
              payload: { service_date: "2026-07-02T00:00:00Z", on_floor_hours: 5.0 }
              as: CourtClerk
            - call: "POST /service-terms/${term_id}/trials"
              payload: { caption: "State v. X", required_jurors: 1 }
              as: Judge
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/ready"
              payload: {}
              as: Judge
            - call: "POST /trials/${trial_id}/panels"
              payload: { target_size: 1 }
              as: Judge
              captures: { panel_id: $.data.id, panel_v0: $.data.version }
            - call: "POST /panels/${panel_id}/seat"
              payload: { summons_id: "${summons_id}", expected_panel_version: "${panel_v0}" }
              as: Judge
            - call: "POST /summonses/${summons_id}/check-in"
              payload: { service_date: "2026-07-03T00:00:00Z", on_floor_hours: 7.0 }
              as: CourtClerk
            - call: "POST /summonses/${summons_id}/check-in"
              payload: { service_date: "2026-07-04T00:00:00Z", on_floor_hours: 9.0 }
              as: CourtClerk
          trigger:
            - call: "POST /summonses/${summons_id}/release"
              payload: {}
              as: CourtClerk
            - call: "GET /summonses/${summons_id}/pay-vouchers"
              payload: {}
              as: CourtClerk
          assert:
            - "Exactly one PayVoucher with variant==ESTIMATED has total_cents == 6126 (attendance 6000 + mileage 126)."
            - "Exactly one PayVoucher with variant==FINAL has total_cents == 10189 (attendance 10000 + mileage 189)."
            - "FINAL.total_cents (10189) > ESTIMATED.total_cents (6126); delta == 4063."

      - name: pool_size_provisional_vs_disqualified_pool
        grounds:
          - calculations.fta_disqualification
          - entities.ServiceTerm.fields.pool_size
          - entities.Juror.fields.disqualified
          - state_machines.Juror.QUALIFIED_to_INELIGIBLE
        distinguishing_aspect: |
          The ServiceTerm.pool_size head-count is computed two ways on the same term but a
          DIFFERENT entity domain than pay: before FTA disqualification it counts a juror as
          IN the pool (pool_size 1), after the strike-threshold cascade flips disqualified the
          same recompute drops that juror (pool_size 0) — the pre/post values diverge for
          identical raw juror rows.
        test_recipe:
          setup:
            - "Term OPEN with fta_disqualify_threshold 1; one qualified juror, one QUALIFIED_PENDING summons; clock past report_date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T08:00:00Z" }
              as: JuryAdministrator
            - call: "POST /service-terms"
              payload: { name: "T2", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3, fta_disqualify_threshold: 1 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Boe J", birth_year: 1985, round_trip_miles: 1.0 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "GET /service-terms/${term_id}"
              payload: {}
              as: JuryAdministrator
              captures: { pool_before: $.data.pool_size }
          trigger:
            - call: "POST /summonses/${summons_id}/mark-fta"
              payload: {}
              as: CourtClerk
            - call: "GET /service-terms/${term_id}"
              payload: {}
              as: JuryAdministrator
              captures: { pool_after: $.data.pool_size }
          assert:
            - "Before FTA: ServiceTerm.pool_size == 1 and Juror.disqualified == false."
            - "After FTA: Juror.fta_strike_count == 1, Juror.disqualified == true, Juror.qualification_status == INELIGIBLE."
            - "ServiceTerm.pool_size == 0 after the disqualification cascade."

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pay_mileage_round_per_day_then_sum
        grounds:
          - calculations.pay_computation
          - entities.PayVoucher.fields.mileage_cents
          - entities.ServiceTerm.fields.mileage_rate_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding: pay_computation pins round-PER-DAY-then-sum.
          round_half_up(2.50*25)=63 per day * 3 paid days = 189; the wrong sum-then-round
          (round_half_up(2.50*3*25)=188) differs by 1 cent — the pinned order is observable.
        test_recipe:
          setup:
            - "Same term/juror as pay_estimated_vs_final; 3 paid full days with round_trip_miles 2.50, mileage_rate 25, pay_day_cap 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: JuryAdministrator
            - call: "POST /service-terms"
              payload: { name: "T3", report_date: "2026-08-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Cyd J", birth_year: 1979, round_trip_miles: 2.50 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/check-in"
              payload: { service_date: "2026-08-01T00:00:00Z", on_floor_hours: 8.0 }
              as: CourtClerk
            - call: "POST /summonses/${summons_id}/check-in"
              payload: { service_date: "2026-08-02T00:00:00Z", on_floor_hours: 8.0 }
              as: CourtClerk
            - call: "POST /summonses/${summons_id}/check-in"
              payload: { service_date: "2026-08-03T00:00:00Z", on_floor_hours: 8.0 }
              as: CourtClerk
          trigger:
            - call: "POST /summonses/${summons_id}/release"
              payload: {}
              as: CourtClerk
            - call: "GET /summonses/${summons_id}/pay-vouchers"
              payload: {}
              as: CourtClerk
          assert:
            - "FINAL PayVoucher.mileage_cents == 189 (round_half_up(2.50*25)=63 per day, summed over 3 days)."
            - "FINAL PayVoucher.attendance_cents == 12000 (3 full days * 4000)."
            - "FINAL PayVoucher.total_cents == 12189."

      - name: pool_projection_sum_then_round
        grounds:
          - calculations.mileage_per_diem_reimbursement
          - entities.Juror.fields.round_trip_miles
          - entities.ServiceTerm.fields.pay_day_cap
        distinguishing_aspect: |
          Mode (b) DIFFERENT axis from pay: pool-projection pins sum-then-round (opposite order).
          (2.50+2.50+1.50)=6.50 raw miles * cap 3 = 19.50, round_half_up(19.50*25)=488; the
          per-juror-then-sum order would yield 492 — the projection's single terminal rounding is observable.
        test_recipe:
          setup:
            - "Term DRAFT/OPEN, pay_day_cap 3, mileage_rate 25; three QUALIFIED non-disqualified jurors with round_trip_miles 2.50, 2.50, 1.50."
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "T4", report_date: "2026-09-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "D1", birth_year: 1980, round_trip_miles: 2.50 }
              as: JuryAdministrator
              captures: { j1: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "D2", birth_year: 1981, round_trip_miles: 2.50 }
              as: JuryAdministrator
              captures: { j2: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "D3", birth_year: 1982, round_trip_miles: 1.50 }
              as: JuryAdministrator
              captures: { j3: $.data.id }
            - call: "POST /jurors/${j1}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /jurors/${j2}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /jurors/${j3}/qualify"
              payload: {}
              as: JuryAdministrator
          trigger:
            - call: "GET /service-terms/${term_id}/pool-projection"
              payload: {}
              as: JuryAdministrator
              captures: { proj: $.data.projected_mileage_cents }
          assert:
            - "projected_mileage_cents == 488 (round_half_up((2.50+2.50+1.50)*3*25))."
            - "pool_size in the projection response == 3."

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: summons_branch_qualify_defer_excuse_exempt
        grounds:
          - state_machines.Summons.QUALIFIED_PENDING_to_DEFERRED
          - state_machines.Summons.QUALIFIED_PENDING_to_EXCUSED
          - state_machines.Summons.QUALIFIED_PENDING_to_EXEMPT
          - state_machines.Summons.SUMMONED_to_QUALIFIED_PENDING
        distinguishing_aspect: |
          The Summons machine branches (fork) at QUALIFIED_PENDING into four divergent
          terminal/cyclic targets (REPORTING vs DEFERRED vs EXCUSED vs EXEMPT) with different
          side-effect sets — DEFER re-issues a new summons, EXCUSE/EXEMPT terminate — proving
          non-linear branching on the Summons entity.
        test_recipe:
          setup:
            - "Term OPEN; one qualified juror with a QUALIFIED_PENDING summons; a later DRAFT term exists as the deferral target."
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "TA", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms"
              payload: { name: "TA-next", report_date: "2026-10-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { next_term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Eli J", birth_year: 1990, round_trip_miles: 5.0 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/dispositions"
              payload: { kind: "DEFER", reason_code: "HARDSHIP", requested_term_id: "${next_term_id}" }
              as: Juror
              as_user_id: "${juror_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /dispositions/${disp_id}/decide"
              payload: { decision: "GRANTED" }
              as: JuryAdministrator
            - call: "GET /summonses/${summons_id}"
              payload: {}
              as: JuryAdministrator
            - call: "GET /jurors/${juror_id}/summonses"
              payload: { status: "SUMMONED" }
              as: JuryAdministrator
          assert:
            - "Original Summons.status == DEFERRED and deferred_to_term_id == ${next_term_id}."
            - "A NEW Summons (status SUMMONED) exists on ${next_term_id} for ${juror_id} with deferral_count == 1."

      - name: panel_compound_forming_seated_dismiss_revert
        grounds:
          - state_machines.Panel.FORMING_to_SEATED
          - state_machines.Panel.FORMING_to_DISMISSED
          - state_machines.Summons.SERVING_to_REPORTING
        distinguishing_aspect: |
          The Panel machine is compound and branches on dismiss: FORMING→SEATED auto-derives
          from seated_count==target_size, while FORMING→DISMISSED runs a distinct cascade that
          reverts every SERVING summons back to REPORTING — two outgoing edges from FORMING with
          different side-effect sets, on a DIFFERENT entity than the Summons branch instance.
        test_recipe:
          setup:
            - "Term OPEN, Trial READY, a 2-seat panel with one summons SEATED (panel still FORMING, seated_count 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T08:00:00Z" }
              as: JuryAdministrator
            - call: "POST /service-terms"
              payload: { name: "TB", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Fay J", birth_year: 1988, round_trip_miles: 3.0 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/check-in"
              payload: { service_date: "2026-07-10T00:00:00Z", on_floor_hours: 8.0 }
              as: CourtClerk
            - call: "POST /service-terms/${term_id}/trials"
              payload: { caption: "State v. Y", required_jurors: 2 }
              as: Judge
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/ready"
              payload: {}
              as: Judge
            - call: "POST /trials/${trial_id}/panels"
              payload: { target_size: 2 }
              as: Judge
              captures: { panel_id: $.data.id, panel_v0: $.data.version }
            - call: "POST /panels/${panel_id}/seat"
              payload: { summons_id: "${summons_id}", expected_panel_version: "${panel_v0}" }
              as: Judge
          trigger:
            - call: "POST /panels/${panel_id}/dismiss"
              payload: {}
              as: Judge
            - call: "GET /panels/${panel_id}"
              payload: {}
              as: Judge
            - call: "GET /summonses/${summons_id}"
              payload: {}
              as: CourtClerk
          assert:
            - "Panel.status == DISMISSED and Panel.seated_count == 0."
            - "Summons.status == REPORTING (reverted from SERVING by the FORMING→DISMISSED cascade)."
            - "The PanelAssignment for ${summons_id} has status == EXCUSED_FROM_PANEL."

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: fta_strike_threshold_pool_cascade_depth3
        grounds:
          - state_machines.Summons.QUALIFIED_PENDING_to_FAILED_TO_APPEAR
          - calculations.fta_disqualification
          - state_machines.Juror.QUALIFIED_to_INELIGIBLE
          - entities.ServiceTerm.fields.pool_size
        distinguishing_aspect: |
          Depth-3 chain originating at mark-fta: (1) Summons→FAILED_TO_APPEAR creates a Strike;
          (2) that Strike's existence recomputes Juror.fta_strike_count to the threshold, flipping
          Juror.disqualified and transitioning Juror QUALIFIED→INELIGIBLE; (3) that juror demotion
          recomputes ServiceTerm.pool_size downward. Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "Term OPEN, fta_disqualify_threshold 1, one qualified juror with a QUALIFIED_PENDING summons; clock past report_date; pool_size 1 before."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T08:00:00Z" }
              as: JuryAdministrator
            - call: "POST /service-terms"
              payload: { name: "TC", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3, fta_disqualify_threshold: 1 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Gus J", birth_year: 1975, round_trip_miles: 4.0 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
          trigger:
            - call: "POST /summonses/${summons_id}/mark-fta"
              payload: {}
              as: CourtClerk
            - call: "GET /jurors/${juror_id}"
              payload: {}
              as: JuryAdministrator
            - call: "GET /jurors/${juror_id}/strikes"
              payload: {}
              as: JuryAdministrator
            - call: "GET /service-terms/${term_id}"
              payload: {}
              as: JuryAdministrator
          assert:
            - "Hop 1: a Strike row (source FTA) exists for ${juror_id}; Summons.status == FAILED_TO_APPEAR."
            - "Hop 2: Juror.fta_strike_count == 1, Juror.disqualified == true, Juror.qualification_status == INELIGIBLE."
            - "Hop 3: ServiceTerm.pool_size == 0."

      - name: panel_dismiss_revert_summons_depth2
        grounds:
          - state_machines.Panel.FORMING_to_DISMISSED
          - state_machines.Summons.SERVING_to_REPORTING
          - entities.PanelAssignment.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (panel dismiss): (1) Panel FORMING→DISMISSED
          flips its SEATED PanelAssignments to EXCUSED_FROM_PANEL; (2) that assignment flip
          reverts each occupying Summons SERVING→REPORTING. The second hop is caused by the
          assignment mutation, not directly by the dismiss call.
        test_recipe:
          setup:
            - "Term OPEN, Trial READY, a 2-seat FORMING panel with one summons SEATED (seated_count 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T08:00:00Z" }
