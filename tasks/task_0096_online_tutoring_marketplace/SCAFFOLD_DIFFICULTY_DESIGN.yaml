  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- Instance 1 (depth >=3): confirm -> Settlement -> Booking SETTLED -> ledgers + tutor lifetime ---
      - name: confirm_session_three_hop_settlement_cascade
        grounds:
          - state_machines.Session.REPORTED_to_CONFIRMED
          - state_machines.Booking.DELIVERED_to_SETTLED
          - entities.Settlement.fields.tutor_net_cents
          - entities.Tutor.fields.lifetime_net_earnings_cents
