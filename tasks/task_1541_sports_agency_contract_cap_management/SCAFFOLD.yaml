# =============================================================================
# Task 1541 — Sports Agency Contract & Cap Management
# SCAFFOLD.yaml — §1.0–§1.7 (seed tables)
# =============================================================================

scenario: |
  Sports Agency Contract & Cap Management (certified player agency): client
  roster & contract expiration calendar, salary cap/luxury threshold modeling
  for proposals, contract structure (guarantees/bonuses/incentives) &
  escalator projection, negotiation timeline & tender/option deadlines, agent
  certification & fee cap compliance, marketing income separate from playing
  contract, grievance & arbitration support, client transition & fee splits.

domain_name: sports-agency-cap
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — do not edit)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency legal name" }
      - { name: fee_cap_pct, type: number, source: input, description: "Maximum agent fee as a fraction of contract AAV (e.g. 0.03 for 3%); configured per agency within league limits" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED blocks all new proposals and endorsements" }

  - name: Agent
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: full_name, type: string, source: input, description: "Agent legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per agency" }
      - { name: cert_number, type: string, source: input, description: "League-issued certification number" }
      - { name: cert_status, type: enum, source: system, default: PENDING, description: "PENDING | CERTIFIED | SUSPENDED | REVOKED — gates proposal submission and fee accrual" }
      - { name: certified_at, type: datetime, source: system, description: "Set on transition PENDING -> CERTIFIED" }
      - { name: is_manager, type: boolean, source: input, default: false, description: "Agency managers can certify agents and resolve grievances" }

  - name: Client
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: primary_agent_id, type: string, source: input, description: "FK -> Agent.id; currently-assigned certified agent" }
      - { name: full_name, type: string, source: input, description: "Player legal name" }
      - { name: position, type: string, source: input, description: "e.g. PG, WR, ST" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TRANSITIONING | RELEASED — roster lifecycle" }
      - { name: transition_to_agent_id, type: string, source: system, description: "FK -> Agent.id; non-null only while status == TRANSITIONING" }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Team name" }
      - { name: league_code, type: string, source: input, description: "e.g. NBA, NFL" }

  - name: CapSeason
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; owning team" }
      - { name: season_year, type: integer, source: input, description: "e.g. 2026" }
      - { name: cap_limit_cents, type: integer, source: input, description: "Hard/soft cap limit for the season" }
      - { name: luxury_threshold_cents, type: integer, source: input, description: "Luxury-tax threshold; > cap_limit_cents" }
      - { name: committed_cents, type: integer, source: system, default: 0, description: "Sum of AAV for SIGNED contracts in this season; maintained by cascading postings" }
      - { name: reserved_cents, type: integer, source: system, default: 0, description: "Sum of AAV for proposals in SUBMITTED/COUNTERED state; released on reject/withdraw" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | LOCKED | CLOSED — LOCKED blocks new proposals; CLOSED is terminal" }

  - name: Contract
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; player under contract" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; employing team" }
      - { name: cap_season_id, type: string, source: input, description: "FK -> CapSeason.id; season the AAV posts against" }
      - { name: start_season_year, type: integer, source: input, description: "First playing season year" }
      - { name: years, type: integer, source: input, description: "Contract length in seasons (1..5)" }
      - { name: base_salary_cents, type: integer, source: input, description: "Year-1 base salary" }
      - { name: guaranteed_cents, type: integer, source: input, description: "Fully-guaranteed portion of total base; <= base_salary_cents * years" }
      - { name: signing_bonus_cents, type: integer, source: input, default: 0, description: "Up-front bonus, prorated across years for cap purposes" }
      - { name: incentive_cents, type: integer, source: input, default: 0, description: "Likely-to-be-earned incentive pool (counts toward AAV)" }
      - { name: escalator_pct, type: number, source: input, default: 0, description: "Year-over-year base escalator (e.g. 0.08 for 8% raise)" }
      - { name: aav_cents, type: integer, source: computed, description: "Average annual value posted to cap; computed from base/escalator/bonus/incentive formula" }
      - { name: total_value_cents, type: integer, source: computed, description: "Sum of per-year base (with escalator) + signing_bonus + incentive" }
      - { name: signing_status, type: enum, source: system, default: NEGOTIATING, description: "NEGOTIATING | SIGNED | VOIDED — signature dimension" }
      - { name: cap_posting_status, type: enum, source: system, default: UNPOSTED, description: "UNPOSTED | POSTED | REVERSED — ledger dimension, parallel to signing_status" }

  - name: Proposal
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; the contract this proposal modifies" }
      - { name: proposed_by_agent_id, type: string, source: input, description: "FK -> Agent.id; must be CERTIFIED" }
      - { name: round_index, type: integer, source: system, description: "Monotonic counter within contract: 1, 2, 3, ..." }
      - { name: proposed_aav_cents, type: integer, source: input, description: "AAV the agent is asking for" }
      - { name: proposed_guaranteed_cents, type: integer, source: input, description: "Proposed guaranteed portion" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN — cyclic via counter-offers" }

  - name: EndorsementDeal
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; endorsing player" }
      - { name: brand_name, type: string, source: input, description: "Brand paying the deal" }
      - { name: deal_value_cents, type: integer, source: input, description: "Total marketing value (kept separate from playing contract)" }
      - { name: start_date, type: datetime, source: input, description: "Deal effective date" }
      - { name: end_date, type: datetime, source: input, description: "Deal expiry date; must be > start_date" }
      - { name: agent_fee_cents, type: integer, source: computed, description: "Agent fee on marketing income; capped at agency.marketing_fee_cap_pct * deal_value_cents" }
      - { name: status, type: enum, source: system, default: PENDING_APPROVAL, description: "PENDING_APPROVAL | ACTIVE | COMPLETED | TERMINATED" }

  - name: TenderOption
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; the contract this tender/option applies to" }
      - { name: kind, type: enum, source: input, description: "QUALIFYING_OFFER | TEAM_OPTION | PLAYER_OPTION" }
      - { name: window_open_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: window_close_at, type: datetime, source: input, description: "Window end (exclusive); must be > window_open_at" }
      - { name: exercised_at, type: datetime, source: system, description: "Set when exercise succeeds" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | EXERCISED | EXPIRED" }

  - name: Grievance
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; disputed contract" }
      - { name: filed_by_agent_id, type: string, source: input, description: "FK -> Agent.id; filing agent" }
      - { name: category, type: enum, source: input, description: "NON_PAYMENT | ROSTER_MOVE | BONUS_DISPUTE | MEDICAL" }
      - { name: description, type: string, source: input, description: "Free-text narrative" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount sought" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | ARBITRATION | RESOLVED | WITHDRAWN — branching with revert UNDER_REVIEW -> FILED" }

  - name: FeeLedgerEntry
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; null for endorsement-only entries" }
      - { name: endorsement_deal_id, type: string, source: system, description: "FK -> EndorsementDeal.id; null for playing-contract entries" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; agent receiving this split" }
      - { name: split_pct, type: number, source: system, description: "Fraction of the gross fee credited to this agent; entries for one event must sum to 1.0" }
      - { name: amount_cents, type: integer, source: computed, description: "Fee portion credited; derived from contract/deal fee * split_pct, rounded half-up" }
      - { name: kind, type: enum, source: system, description: "PLAYING_CONTRACT | ENDORSEMENT | TRANSITION_ADJUSTMENT" }
      - { name: status, type: enum, source: system, default: ACCRUED, description: "ACCRUED | PAID | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Agent
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /agencies/{agencyId}/agents/{agentId}/certify"
        actor: AgencyManager
        preconditions:
          - "cert_status == PENDING"
          - "Agency.status == ACTIVE"
        side_effects:
          - "certified_at = current UTC timestamp"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /agencies/{agencyId}/agents/{agentId}/suspend"
        actor: AgencyManager
        preconditions:
          - "cert_status == CERTIFIED"
        side_effects:
          - "Any Proposal in SUBMITTED or COUNTERED state authored by this agent -> WITHDRAWN, releasing its reserved_cents on the linked CapSeason"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /agencies/{agencyId}/agents/{agentId}/reinstate"
        actor: AgencyManager
        preconditions:
          - "cert_status == SUSPENDED"
        side_effects: []
      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /agencies/{agencyId}/agents/{agentId}/revoke"
        actor: AgencyManager
        preconditions:
          - "cert_status == CERTIFIED"
        side_effects:
          - "Any Client with primary_agent_id == this agent transitions to TRANSITIONING with transition_to_agent_id = null"
          - "Any Proposal in SUBMITTED or COUNTERED authored by this agent -> WITHDRAWN (cap release)"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /agencies/{agencyId}/agents/{agentId}/revoke"
        actor: AgencyManager
        preconditions:
          - "cert_status == SUSPENDED"
        side_effects:
          - "Clients under this agent transition to TRANSITIONING"

  - entity: Client
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: TRANSITIONING
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/initiate_transition"
        actor: AgencyManager
        preconditions:
          - "status == ACTIVE"
          - "target_agent_id must reference a CERTIFIED Agent in the same Agency"
        side_effects:
          - "transition_to_agent_id = target_agent_id"
      - from: TRANSITIONING
        to: ACTIVE
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/complete_transition"
        actor: AgencyManager
        preconditions:
          - "status == TRANSITIONING"
          - "transition_to_agent_id must be a CERTIFIED Agent"
        side_effects:
          - "primary_agent_id = transition_to_agent_id"
          - "transition_to_agent_id = null"
          - "Emit FeeLedgerEntry kind=TRANSITION_ADJUSTMENT for each SIGNED Contract on this Client, splitting the remaining fee between old and new agent per the transition_split rule (old agent 25%, new agent 75%, computed on remaining years only)"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/release"
        actor: AgencyManager
        preconditions:
          - "status == ACTIVE"
          - "No Contract in NEGOTIATING or SIGNED state for this client"
          - "No EndorsementDeal in ACTIVE state for this client"
        side_effects: []
      - from: TRANSITIONING
        to: RELEASED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/release"
        actor: AgencyManager
        preconditions:
          - "status == TRANSITIONING"
          - "No SIGNED Contract and no ACTIVE EndorsementDeal"
        side_effects: []

  - entity: Contract
    initial_state: NEGOTIATING (signing) × UNPOSTED (cap_posting)
    terminal_states: [VOIDED (signing) × REVERSED (cap_posting)]
    transitions:
      - from: "signing=NEGOTIATING"
        to: "signing=SIGNED"
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/sign"
        actor: Agent
        preconditions:
          - "signing_status == NEGOTIATING"
          - "There exists at least one Proposal with status == ACCEPTED for this contract"
          - "acting Agent must be CERTIFIED and equal to Client.primary_agent_id"
          - "Client.status == ACTIVE"
        side_effects:
          - "cap_posting_status: UNPOSTED -> POSTED"
          - "CapSeason.committed_cents += aav_cents (for the linked CapSeason)"
          - "Emit FeeLedgerEntry kind=PLAYING_CONTRACT with amount = aav_cents * Agency.fee_cap_pct, split 100% to Client.primary_agent_id"
          - "All other Proposals on this Contract with status in {DRAFT, SUBMITTED, COUNTERED} -> WITHDRAWN, releasing their reserved_cents"
      - from: "signing=NEGOTIATING"
        to: "signing=VOIDED"
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/void"
        actor: AgencyManager
        preconditions:
          - "signing_status == NEGOTIATING"
        side_effects:
          - "cap_posting_status: UNPOSTED -> REVERSED"
          - "All open Proposals -> WITHDRAWN (cap release)"
      - from: "signing=SIGNED"
        to: "signing=VOIDED"
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/void"
        actor: AgencyManager
        preconditions:
          - "signing_status == SIGNED"
          - "No Grievance in FILED, UNDER_REVIEW, or ARBITRATION state on this Contract"
        side_effects:
          - "cap_posting_status: POSTED -> REVERSED"
          - "CapSeason.committed_cents -= aav_cents"
          - "All FeeLedgerEntry rows for this Contract in ACCRUED status -> VOIDED"

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/submit"
        actor: Agent
        preconditions:
          - "status == DRAFT"
          - "Contract.signing_status == NEGOTIATING"
          - "Acting agent must be CERTIFIED and equal to proposed_by_agent_id"
          - "CapSeason.status == OPEN"
          - "Reserved AAV check: CapSeason.committed_cents + CapSeason.reserved_cents + proposed_aav_cents <= CapSeason.luxury_threshold_cents (else ERR_CAP_WOULD_EXCEED)"
        side_effects:
          - "CapSeason.reserved_cents += proposed_aav_cents"
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/counter"
        actor: Team
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "CapSeason.reserved_cents -= previous proposed_aav_cents; CapSeason.reserved_cents += new counter_aav_cents from request body"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/resubmit"
        actor: Agent
        preconditions:
          - "status == COUNTERED"
          - "Acting agent must be CERTIFIED and equal to proposed_by_agent_id"
          - "CapSeason.status == OPEN"
          - "Reserved AAV check (same formula as initial submit)"
        side_effects:
          - "CapSeason.reserved_cents -= prior proposed_aav_cents; CapSeason.reserved_cents += new proposed_aav_cents from request body"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/accept"
        actor: Team
        preconditions:
          - "status == SUBMITTED"
          - "CapSeason.status == OPEN"
          - "Hard cap check: CapSeason.committed_cents + proposed_aav_cents <= CapSeason.cap_limit_cents (else ERR_CAP_HARD_LIMIT)"
        side_effects:
          - "CapSeason.reserved_cents -= proposed_aav_cents"
          - "All other proposals on this Contract in {DRAFT, SUBMITTED, COUNTERED} -> WITHDRAWN (release reserved)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/reject"
        actor: Team
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "CapSeason.reserved_cents -= proposed_aav_cents"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/withdraw"
        actor: Agent
        preconditions:
          - "status == DRAFT"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/withdraw"
        actor: Agent
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "CapSeason.reserved_cents -= proposed_aav_cents"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/withdraw"
        actor: Agent
        preconditions:
          - "status == COUNTERED"
        side_effects:
          - "CapSeason.reserved_cents -= proposed_aav_cents"

  - entity: EndorsementDeal
    initial_state: PENDING_APPROVAL
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/endorsements/{dealId}/approve"
        actor: AgencyManager
        preconditions:
          - "status == PENDING_APPROVAL"
          - "Client.status == ACTIVE"
          - "Agency.status == ACTIVE"
        side_effects:
          - "agent_fee_cents is computed via endorsement_agent_fee rule"
          - "Emit FeeLedgerEntry kind=ENDORSEMENT, 100% split to Client.primary_agent_id"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when current UTC >= end_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/endorsements/{dealId}/terminate"
        actor: AgencyManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "FeeLedgerEntry for this deal in ACCRUED status -> VOIDED"

  - entity: TenderOption
    initial_state: PENDING
    terminal_states: [EXERCISED, EXPIRED]
    transitions:
      - from: PENDING
        to: EXERCISED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/tender_options/{tenderId}/exercise"
        actor: Agent
        preconditions:
          - "status == PENDING"
          - "current UTC >= window_open_at AND current UTC < window_close_at"
          - "Contract.signing_status == SIGNED"
          - "Acting agent must be CERTIFIED and equal to Client.primary_agent_id"
        side_effects:
          - "exercised_at = current UTC"
          - "Contract.base_salary_cents for the option year is locked at the tender amount"
      - from: PENDING
        to: EXPIRED
        trigger: "system (automatic when current UTC >= window_close_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Grievance
    initial_state: FILED
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/start_review"
        actor: LeagueOfficer
        preconditions:
          - "status == FILED"
        side_effects: []
      - from: UNDER_REVIEW
        to: FILED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/return_for_cure"
        actor: LeagueOfficer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects: []
        note: "Branching revert — grievance can be sent back for additional evidence"
      - from: UNDER_REVIEW
        to: ARBITRATION
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/escalate"
        actor: LeagueOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "Contract.signing_status == SIGNED"
        side_effects: []
      - from: ARBITRATION
        to: RESOLVED
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/resolve"
        actor: LeagueOfficer
        preconditions:
          - "status == ARBITRATION"
        side_effects:
          - "If resolution_outcome == UPHELD: emit FeeLedgerEntry kind=TRANSITION_ADJUSTMENT with amount = claimed_amount_cents * Agency.fee_cap_pct (split 100% to filing agent) — represents additional fee on recovered amounts"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/withdraw"
        actor: Agent
        preconditions:
          - "status == FILED"
          - "Acting agent must equal filed_by_agent_id"
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/withdraw"
        actor: Agent
        preconditions:
          - "status == UNDER_REVIEW"
          - "Acting agent must equal filed_by_agent_id"
        side_effects: []

  - entity: CapSeason
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /agencies/{agencyId}/teams/{teamId}/cap_seasons/{capSeasonId}/lock"
        actor: LeagueOfficer
        preconditions:
          - "status == OPEN"
        side_effects:
          - "All Proposals against contracts linked to this CapSeason in {SUBMITTED, COUNTERED} -> WITHDRAWN (release reserved)"
      - from: LOCKED
        to: OPEN
        trigger: "POST /agencies/{agencyId}/teams/{teamId}/cap_seasons/{capSeasonId}/unlock"
        actor: LeagueOfficer
        preconditions:
          - "status == LOCKED"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /agencies/{agencyId}/teams/{teamId}/cap_seasons/{capSeasonId}/close"
        actor: LeagueOfficer
        preconditions:
          - "status == OPEN"
          - "reserved_cents == 0"
        side_effects: []
      - from: LOCKED
        to: CLOSED
        trigger: "POST /agencies/{agencyId}/teams/{teamId}/cap_seasons/{capSeasonId}/close"
        actor: LeagueOfficer
        preconditions:
          - "status == LOCKED"
          - "reserved_cents == 0"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: proposal-submit-stale-capseason
    parent_entity: CapSeason
    write_endpoint: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/submit"
    occ_field: expected_cap_season_version
    description: |
      Submitting a Proposal against a CapSeason whose version has advanced
      since the client last observed it is rejected with 412. This captures
      the case where another proposal's submission, counter, accept, reject,
      or withdraw has already moved reserved_cents, so the requester's
      capacity arithmetic is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-sign-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/sign"
    occ_field: expected_contract_version
    description: |
      Signing a Contract whose version has advanced since the client last
      observed it is rejected with 412. This captures the case where a
      proposal acceptance has already updated the contract's proposal set
      since the signer read state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contract_aav
    trigger: "Contract creation; recompute on any input change while signing_status == NEGOTIATING"
    algorithm: aggregation
    formula: |
      # Per-year base with compound escalator (year 1 = base_salary_cents)
      per_year_base = [round_half_up(base_salary_cents * (1 + escalator_pct)^(y-1)) for y in 1..years]
      base_sum = sum(per_year_base)
      # Signing bonus is prorated equally across years for cap purposes
      bonus_prorated_per_year = round_half_up(signing_bonus_cents / years)
      # Incentive assumed fully earned (LTBE) and spread evenly
      incentive_per_year = round_half_up(incentive_cents / years)
      # Per-year cap hit (rounded per year, then summed — pin rounding order)
      per_year_cap_hit = [per_year_base[y] + bonus_prorated_per_year + incentive_per_year for y in 1..years]
      total_cap_value = sum(per_year_cap_hit)
      aav_cents = round_half_up(total_cap_value / years)
      total_value_cents = base_sum + signing_bonus_cents + incentive_cents
    input_set: "The Contract being computed; no other contracts"
    constants:
      ROUNDING: round_half_up
      MAX_YEARS: 5
    precision: "integer cents; round_half_up at each per-year step THEN at the final aav division"
    variants:
      - name: ltbe_inclusive
        when: "Default; incentive_cents counts toward AAV because incentives are likely-to-be-earned"
        difference: "Includes incentive_per_year in per_year_cap_hit"
      - name: ultbe_excluded
        when: "When Contract carries a ULTBE flag (out of scope for this scaffold — see endorsement_agent_fee for the second dual-variant rule)"
        difference: "Excludes incentive_per_year; mentioned here only to flag that the LTBE inclusion is a deliberate choice"

  - name: endorsement_agent_fee
    trigger: "EndorsementDeal approval (PENDING_APPROVAL -> ACTIVE)"
    algorithm: threshold
    formula: |
      # Base rate depends on deal size (tiered)
      if deal_value_cents < TIER1_MAX:
        base_rate = TIER1_RATE      # 0.10
      elif deal_value_cents < TIER2_MAX:
        base_rate = TIER2_RATE      # 0.15
      else:
        base_rate = TIER3_RATE      # 0.20
      # Apply agency marketing cap (hard ceiling)
      raw_fee = deal_value_cents * base_rate
      capped_fee = deal_value_cents * Agency.fee_cap_pct   # agency's marketing fee cap
      agent_fee_cents = round_half_up(min(raw_fee, capped_fee))
    input_set: "The EndorsementDeal being approved and its Agency.fee_cap_pct"
    constants:
      TIER1_MAX: 100000000      # $1M in cents
      TIER1_RATE: 0.10
      TIER2_MAX: 500000000      # $5M in cents
      TIER2_RATE: 0.15
      TIER3_RATE: 0.20
    precision: "integer cents; round_half_up at final step"
    variants:
      - name: tiered_standard
        when: "Default; tiered base rate then cap"
        difference: "raw_fee from tier table, then min with cap"
      - name: flat_rate_legacy
        when: "Used only when Agency is flagged legacy_flat_rate (configuration toggle; out-of-band for this scaffold — illustrative variant to demonstrate dual-variant on a different entity domain than contract_aav)"
        difference: "raw_fee = deal_value_cents * 0.12 (flat), then min with cap"

  - name: contract_fee_accrual
    trigger: "Contract signing (NEGOTIATING -> SIGNED)"
    algorithm: aggregation
    formula: |
      gross_fee = round_half_up(aav_cents * Agency.fee_cap_pct)
      # Split: 100% to primary_agent_id at signing time
      # (transition_split applies only after a Client TRANSITIONING -> ACTIVE completes)
      agent_share = gross_fee
    input_set: "The Contract being signed, its Client.primary_agent_id, and Agency.fee_cap_pct"
    precision: "integer cents; round_half_up"

  - name: transition_split_fee
    trigger: "Client TRANSITIONING -> ACTIVE (complete_transition)"
    algorithm: waterfall_allocation
    formula: |
      # For each SIGNED Contract on this Client:
      #   remaining_years = years - (current_season_year - start_season_year)
      #   remaining_aav_cents = aav_cents * remaining_years
      #   remaining_fee = round_half_up(remaining_aav_cents * Agency.fee_cap_pct)
      #   Emit TWO FeeLedgerEntry rows with kind=TRANSITION_ADJUSTMENT:
      #     old agent: split_pct=0.25, amount = round_half_up(remaining_fee * 0.25)
      #     new agent: split_pct=0.75, amount = round_half_up(remaining_fee * 0.75)
      # Invariant: old_amount + new_amount == remaining_fee after per-entry rounding
      # Tie-break / remainder rule: any cent residue from rounding is assigned to the NEW agent
      # (i.e. new_amount = remaining_fee - old_amount).
    input_set: "SIGNED Contracts for the transitioning Client; Agency.fee_cap_pct; current season year"
    constants:
      OLD_AGENT_SPLIT: 0.25
      NEW_AGENT_SPLIT: 0.75
    precision: "integer cents; round_half_up; rounding residue assigned to NEW agent"

  - name: cap_space_projection
    trigger: "Read of CapSeason summary (GET /agencies/{aid}/teams/{tid}/cap_seasons/{csid})"
    algorithm: forward_looking
    formula: |
      # Two views are computed and both returned:
      available_hard_cents = cap_limit_cents - committed_cents - reserved_cents
      available_luxury_cents = luxury_threshold_cents - committed_cents - reserved_cents
    input_set: "The CapSeason row"
    precision: "integer cents"

  - name: escalator_projection
    trigger: "On demand via GET contract projection (used during proposal modeling)"
    algorithm: forward_looking
    formula: |
      # Project per-year base salary over contract.years
      # Return array: for y in 1..years -> round_half_up(base_salary_cents * (1 + escalator_pct)^(y-1))
    input_set: "Contract fields"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's declared roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id (agency, client, contract, proposal, etc.) resolves; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target entity is in the exact state demanded by the transition (e.g. Proposal.status == DRAFT for submit)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Agent certification gate: acting agent must have cert_status == CERTIFIED for submit/resubmit/sign/exercise actions"
    error_id: ERR_AGENT_NOT_CERTIFIED
    http_status: 422
    applies_to: "proposal submit/resubmit, contract sign, tender option exercise"
  - priority: 6
    category: business_referential
    check: "Acting agent must own the resource (Proposal.proposed_by_agent_id == acting agent, Client.primary_agent_id == acting agent for sign/exercise)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 422
    applies_to: "proposal submit/resubmit/withdraw, contract sign, tender option exercise"
  - priority: 7
    category: business_temporal
    check: "TenderOption exercise must lie within [window_open_at, window_close_at); endorsement end_date > start_date"
    error_id: ERR_WINDOW_CLOSED
    http_status: 422
    applies_to: "tender option exercise, endorsement creation"
  - priority: 8
    category: business_fiscal
    check: "Cap-season soft cap: committed + reserved + proposed_aav <= luxury_threshold (submission); committed + proposed_aav <= cap_limit (acceptance)"
    error_id: ERR_CAP_WOULD_EXCEED
    http_status: 422
    applies_to: "proposal submit/resubmit"
  - priority: 9
    category: business_fiscal
    check: "Hard cap on acceptance: committed + proposed_aav <= cap_limit"
    error_id: ERR_CAP_HARD_LIMIT
    http_status: 422
    applies_to: "proposal accept"
  - priority: 10
    category: business_constraint
    check: "CapSeason.status must be OPEN for new submissions and acceptances; Agency.status must be ACTIVE for certify/endorsement approval"
    error_id: ERR_RESOURCE_LOCKED
    http_status: 409
    applies_to: "proposal submit/resubmit/accept, agent certify, endorsement approve"
  - priority: 11
    category: business_constraint
    check: "Contract uniqueness: at most one Contract in NEGOTIATING or SIGNED per (client_id, team_id) pair"
    error_id: ERR_DUPLICATE_ACTIVE_CONTRACT
    http_status: 409
    applies_to: "contract creation"
  - priority: 12
    category: business_constraint
    check: "Field constraints: 1 <= years <= 5; guaranteed_cents <= base_salary_cents * years; escalator_pct in [0, 0.15]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "contract creation/update"
  - priority: 13
    category: business_constraint
    check: "Release gates: no NEGOTIATING or SIGNED contract, no ACTIVE endorsement when releasing a client"
    error_id: ERR_CLIENT_HAS_ACTIVE_OBLIGATIONS
    http_status: 409
    applies_to: "client release"
  - priority: 14
    category: business_constraint
    check: "Contract void gate: no FILED/UNDER_REVIEW/ARBITRATION Grievance on a SIGNED contract being voided"
    error_id: ERR_OPEN_GRIEVANCE
    http_status: 409
    applies_to: "contract void (signed)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; deterministic time) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to the given ISO8601 UTC instant. Server boots with logical clock = 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [LeagueOfficer, AgencyManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Agency ---
  - method: POST
    path: "/agencies"
    description: "Create a new Agency"
    roles: [LeagueOfficer]
    code: 201
    input: [name, fee_cap_pct]
    output: Agency
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/agencies/{agencyId}"
    description: "Get an Agency"
    roles: [LeagueOfficer, AgencyManager, Agent, Player]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # --- Agent ---
  - method: POST
    path: "/agencies/{agencyId}/agents"
    description: "Register a new Agent under an Agency (starts PENDING)"
    roles: [AgencyManager]
    code: 201
    input: [full_name, email, cert_number, "is_manager?"]
    output: Agent
    side_effects: ["cert_status=PENDING"]

  - method: GET
    path: "/agencies/{agencyId}/agents"
    description: "List Agents (filterable)"
    roles: [LeagueOfficer, AgencyManager, Agent]
    code: 200
    input: ["cert_status?", "limit?", "offset?"]
    output: "Agent[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/agents/{agentId}"
    description: "Get an Agent"
    roles: [LeagueOfficer, AgencyManager, Agent]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/agents/{agentId}/certify"
    description: "Certify a PENDING agent"
    roles: [AgencyManager]
    code: 200
    input: []
    output: Agent
    side_effects: ["cert_status: PENDING -> CERTIFIED; certified_at = now"]

  - method: POST
    path: "/agencies/{agencyId}/agents/{agentId}/suspend"
    description: "Suspend a CERTIFIED agent (cascades: their in-flight proposals -> WITHDRAWN)"
    roles: [AgencyManager]
    code: 200
    input: []
    output: Agent
    side_effects: ["cert_status: CERTIFIED -> SUSPENDED; cascade proposal withdrawal + reserved release"]

  - method: POST
    path: "/agencies/{agencyId}/agents/{agentId}/reinstate"
    description: "Reinstate a SUSPENDED agent to CERTIFIED"
    roles: [AgencyManager]
    code: 200
    input: []
    output: Agent
    side_effects: ["cert_status: SUSPENDED -> CERTIFIED"]

  - method: POST
    path: "/agencies/{agencyId}/agents/{agentId}/revoke"
    description: "Revoke certification (terminal); cascades clients -> TRANSITIONING"
    roles: [AgencyManager]
    code: 200
    input: []
    output: Agent
    side_effects: ["cert_status -> REVOKED; clients -> TRANSITIONING"]

  # --- Client ---
  - method: POST
    path: "/agencies/{agencyId}/clients"
    description: "Register a new Client under a primary agent"
    roles: [Agent, AgencyManager]
    code: 201
    input: [primary_agent_id, full_name, position]
    output: Client
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/agencies/{agencyId}/clients"
    description: "List Clients (filterable by status, primary_agent_id)"
    roles: [LeagueOfficer, AgencyManager, Agent, Player]
    code: 200
    input: ["status?", "primary_agent_id?", "limit?", "offset?"]
    output: "Client[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}"
    description: "Get a Client"
    roles: [LeagueOfficer, AgencyManager, Agent, Player]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/initiate_transition"
    description: "Begin a client transfer to a new agent"
    roles: [AgencyManager]
    code: 200
    input: [target_agent_id]
    output: Client
    side_effects: ["status: ACTIVE -> TRANSITIONING; transition_to_agent_id = target"]

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/complete_transition"
    description: "Complete a client transfer; emits TRANSITION_ADJUSTMENT fee splits"
    roles: [AgencyManager]
    code: 200
    input: []
    output: Client
    side_effects: ["status: TRANSITIONING -> ACTIVE; primary_agent_id updated; fee split ledger entries created"]

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/release"
    description: "Release a client (terminal); requires no active obligations"
    roles: [AgencyManager]
    code: 200
    input: []
    output: Client
    side_effects: ["status -> RELEASED"]

  # --- Team ---
  - method: POST
    path: "/teams"
    description: "Create a Team"
    roles: [LeagueOfficer]
    code: 201
    input: [name, league_code]
    output: Team
    side_effects: []

  - method: GET
    path: "/teams/{teamId}"
    description: "Get a Team"
    roles: [LeagueOfficer, AgencyManager, Agent, Player, Team]
    code: 200
    input: []
    output: Team
    side_effects: []

  # --- CapSeason ---
  - method: POST
    path: "/teams/{teamId}/cap_seasons"
    description: "Create a CapSeason"
    roles: [LeagueOfficer]
    code: 201
    input: [season_year, cap_limit_cents, luxury_threshold_cents]
    output: CapSeason
    side_effects: ["status=OPEN; committed=0; reserved=0"]

  - method: GET
    path: "/teams/{teamId}/cap_seasons"
    description: "List CapSeasons for a Team"
    roles: [LeagueOfficer, AgencyManager, Agent, Team]
    code: 200
    input: ["status?", "season_year?", "limit?", "offset?"]
    output: "CapSeason[]"
    side_effects: []

  - method: GET
    path: "/teams/{teamId}/cap_seasons/{capSeasonId}"
    description: "Get a CapSeason (includes computed available_hard_cents / available_luxury_cents in response)"
    roles: [LeagueOfficer, AgencyManager, Agent, Team]
    code: 200
    input: []
    output: CapSeason
    side_effects: []

  - method: POST
    path: "/teams/{teamId}/cap_seasons/{capSeasonId}/lock"
    description: "Lock a CapSeason (cascades: open proposals -> WITHDRAWN)"
    roles: [LeagueOfficer]
    code: 200
    input: []
    output: CapSeason
    side_effects: ["status: OPEN -> LOCKED; cascade proposal withdrawal"]

  - method: POST
    path: "/teams/{teamId}/cap_seasons/{capSeasonId}/unlock"
    description: "Unlock a LOCKED CapSeason"
    roles: [LeagueOfficer]
    code: 200
    input: []
    output: CapSeason
    side_effects: ["status: LOCKED -> OPEN"]

  - method: POST
    path: "/teams/{teamId}/cap_seasons/{capSeasonId}/close"
    description: "Close a CapSeason (terminal); requires reserved_cents == 0"
    roles: [LeagueOfficer]
    code: 200
    input: []
    output: CapSeason
    side_effects: ["status -> CLOSED"]

  # --- Contract ---
  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts"
    description: "Create a Contract (NEGOTIATING × UNPOSTED); aav_cents computed at creation"
    roles: [Agent]
    code: 201
    input: [team_id, cap_season_id, start_season_year, years, base_salary_cents, guaranteed_cents, "signing_bonus_cents?", "incentive_cents?", "escalator_pct?"]
    output: Contract
    side_effects: ["aav_cents, total_value_cents computed via contract_aav"]

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/contracts"
    description: "List Contracts for a Client"
    roles: [LeagueOfficer, AgencyManager, Agent, Player]
    code: 200
    input: ["signing_status?", "team_id?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}"
    description: "Get a Contract"
    roles: [LeagueOfficer, AgencyManager, Agent, Player, Team]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/sign"
    description: "Sign a NEGOTIATING contract; posts to cap, accrues fee, withdraws other proposals"
    roles: [Agent]
    code: 200
    input: [expected_contract_version]
    output: Contract
    side_effects:
      - "signing_status: NEGOTIATING -> SIGNED"
      - "cap_posting_status: UNPOSTED -> POSTED"
      - "CapSeason.committed_cents += aav_cents"
      - "FeeLedgerEntry kind=PLAYING_CONTRACT emitted"
      - "increments Contract.version by 1"
      - "all other open proposals on this contract -> WITHDRAWN"

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/void"
    description: "Void a Contract; reverses cap posting and voids accrued fees"
    roles: [AgencyManager]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "signing_status -> VOIDED"
      - "cap_posting_status -> REVERSED"
      - "if previously POSTED: CapSeason.committed_cents -= aav_cents; ACCRUED fees -> VOIDED"

  # --- Proposal ---
  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals"
    description: "Create a Proposal in DRAFT"
    roles: [Agent]
    code: 201
    input: [proposed_by_agent_id, proposed_aav_cents, proposed_guaranteed_cents]
    output: Proposal
    side_effects: ["round_index assigned (max existing + 1 within contract)"]

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals"
    description: "List Proposals for a Contract"
    roles: [LeagueOfficer, AgencyManager, Agent, Team]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Proposal[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}"
    description: "Get a Proposal"
    roles: [LeagueOfficer, AgencyManager, Agent, Team]
    code: 200
    input: []
    output: Proposal
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/submit"
    description: "Submit a DRAFT proposal; reserves cap space"
    roles: [Agent]
    code: 200
    input: [expected_cap_season_version]
    output: Proposal
    side_effects:
      - "status: DRAFT -> SUBMITTED"
      - "CapSeason.reserved_cents += proposed_aav_cents"
      - "increments CapSeason.version by 1"

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/counter"
    description: "Team counters a SUBMITTED proposal; reserved adjusts"
    roles: [Team]
    code: 200
    input: [counter_aav_cents]
    output: Proposal
    side_effects:
      - "status: SUBMITTED -> COUNTERED"
      - "CapSeason.reserved_cents -= old proposed_aav_cents; += counter_aav_cents"
      - "proposed_aav_cents = counter_aav_cents"

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/resubmit"
    description: "Agent re-submits a COUNTERED proposal with a revised number"
    roles: [Agent]
    code: 200
    input: [proposed_aav_cents]
    output: Proposal
    side_effects:
      - "status: COUNTERED -> SUBMITTED"
      - "CapSeason.reserved_cents adjusts to the new proposed_aav_cents"

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/accept"
    description: "Team accepts a SUBMITTED proposal"
    roles: [Team]
    code: 200
    input: []
    output: Proposal
    side_effects:
      - "status: SUBMITTED -> ACCEPTED"
      - "CapSeason.reserved_cents -= proposed_aav_cents"
      - "sibling open proposals on the same contract -> WITHDRAWN"

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/reject"
    description: "Team rejects a SUBMITTED proposal"
    roles: [Team]
    code: 200
    input: []
    output: Proposal
    side_effects:
      - "status: SUBMITTED -> REJECTED"
      - "CapSeason.reserved_cents -= proposed_aav_cents"

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/proposals/{proposalId}/withdraw"
    description: "Agent withdraws a DRAFT/SUBMITTED/COUNTERED proposal"
    roles: [Agent]
    code: 200
    input: []
    output: Proposal
    side_effects:
      - "status -> WITHDRAWN"
      - "if was SUBMITTED or COUNTERED: CapSeason.reserved_cents -= proposed_aav_cents"

  # --- EndorsementDeal ---
  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/endorsements"
    description: "Create an EndorsementDeal (PENDING_APPROVAL); end_date must be > start_date"
    roles: [Agent]
    code: 201
    input: [brand_name, deal_value_cents, start_date, end_date]
    output: EndorsementDeal
    side_effects: ["status=PENDING_APPROVAL"]

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/endorsements"
    description: "List EndorsementDeals for a Client"
    roles: [LeagueOfficer, AgencyManager, Agent, Player]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EndorsementDeal[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/endorsements/{dealId}"
    description: "Get an EndorsementDeal"
    roles: [LeagueOfficer, AgencyManager, Agent, Player]
    code: 200
    input: []
    output: EndorsementDeal
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/endorsements/{dealId}/approve"
    description: "Approve a PENDING_APPROVAL deal; computes agent_fee_cents and emits fee ledger"
    roles: [AgencyManager]
    code: 200
    input: []
    output: EndorsementDeal
    side_effects:
      - "status: PENDING_APPROVAL -> ACTIVE"
      - "agent_fee_cents computed via endorsement_agent_fee"
      - "FeeLedgerEntry kind=ENDORSEMENT emitted (100% to primary agent)"

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/endorsements/{dealId}/terminate"
    description: "Terminate an ACTIVE deal; voids accrued fees"
    roles: [AgencyManager]
    code: 200
    input: []
    output: EndorsementDeal
    side_effects:
      - "status: ACTIVE -> TERMINATED"
      - "ACCRUED FeeLedgerEntry for this deal -> VOIDED"

  # --- TenderOption ---
  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/tender_options"
    description: "Create a TenderOption on a contract"
    roles: [Agent, Team]
    code: 201
    input: [kind, window_open_at, window_close_at]
    output: TenderOption
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/tender_options"
    description: "List TenderOptions for a Contract"
    roles: [LeagueOfficer, AgencyManager, Agent, Team, Player]
    code: 200
    input: ["status?", "kind?", "limit?", "offset?"]
    output: "TenderOption[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/tender_options/{tenderId}"
    description: "Get a TenderOption"
