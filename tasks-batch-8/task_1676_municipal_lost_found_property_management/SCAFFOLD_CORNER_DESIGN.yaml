  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: claimant_cannot_create_item
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /items is exclusive to IntakeOfficer; Claimant is denied."
        test_recipe:
          setup: ["one registered claimant"]
          setup_api_calls:
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com" }
              as: PublicUser
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /items"
              payload: { program_id: "00000000-0000-0000-0000-000000000000", storage_location_id: "00000000-0000-0000-0000-000000000000", category: "ELECTRONICS", declared_value_cents: 100, description: "x", found_at: "2026-08-01T09:00:00Z", found_location: "y" }
              as: Claimant
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_FORBIDDEN\" and HTTP status 403 (role check precedes FK existence)"
      - name: intake_officer_cannot_approve_claim
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Claim approval is exclusive to ClaimsExaminer; IntakeOfficer is denied (403 precedes claim existence)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /claims/00000000-0000-0000-0000-000000000000/approve"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_FORBIDDEN\" and HTTP status 403"
      - name: public_user_cannot_list_staff_items
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The staff item list GET /items is not open to PublicUser (only /public/items is)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /items"
              as: PublicUser
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_FORBIDDEN\" and HTTP status 403"
      - name: auction_coordinator_cannot_create_program
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Program administration is exclusive to ProgramAdmin; AuctionCoordinator is denied."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "Rogue", program_type: "TRANSIT", contact_email: "r@x.com" }
