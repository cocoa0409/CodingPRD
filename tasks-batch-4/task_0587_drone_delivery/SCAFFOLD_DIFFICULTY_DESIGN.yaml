              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 1, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
            - call: "POST /flights/${flight_id}/file-authorization"
              payload: { grid_cells: ["37N122W-01"], requested_alt_ft: 350, window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { auth_id: $.data.id }
            - call: "POST /_laanc/decision"
              payload: { authorization_id: "${auth_id}", outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /flights/${flight_id}/release"
              payload: {}
              as: FlightDirector
              as_user_id: "fd-1"
            - call: "POST /flights/${flight_id}/launch"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /flights/${flight_id}/abort"
              payload: { actual_route_km: 5.550 }
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_v2: $.data.version }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v2}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight2_id: $.data.id }
          assert:
            - "before the abort: GET /nests?service_area_id=${sa_id} shows Nest.${nest_id}.reserved_pads == 1"
            - "after the abort: GET /nests?service_area_id=${sa_id} shows Nest.${nest_id}.reserved_pads == 0"
            - "Flight.${flight_id}.ops_state == ABORTED, actual_route_km == 5.550, actual_energy_pct == 13.3"
            - "Battery.${bat_id}.cycle_count == 1 and Battery.${bat_id}.charge_pct == 86.7 immediately after the abort"
            - "Order.${order_id}.status == QUOTED and Customer.${cust_id}.held_total == 0.00"
            - "the re-dispatch onto the freed slot succeeds with 201; GET /nests?service_area_id=${sa_id} shows Nest.${nest_id}.reserved_pads == 1 again"
            - "Flight.${flight2_id}.ops_state == PLANNED"
