      - "Inspections SCHEDULED with due_at < now -> OVERDUE; affected Equipment.integrity_status and Facility posture recomputed"
      - "Contractors QUALIFIED with qualified_until < now -> EXPIRED"
      - "HotWorkPermits ISSUED with valid_until <= now -> EXPIRED"
      - "LeakEvents with notification_status == PENDING and notification_deadline_at < now -> OVERDUE"
      - "Every Facility's overdue_inspection_count / expired_training_count / posture_score / compliance_posture recomputed"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, unknown field, invalid enum member, or out-of-range scalar (e.g. safety_score outside 0..100)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID missing or role not recognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership check failed (Operator/ContractorRep X-User-ID mismatch)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_facility_version != Facility.version (charge adjust) or expected_system_version != RefrigerationSystem.version (psid create)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid source state for the requested transition" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "valid_from >= valid_until (permit), scheduled_start_at >= scheduled_end_at (drill), or qualified_until not in the future (contractor qualify/reinstate)" }
  - { id: ERR_PERMIT_WINDOW_CONFLICT, http: 409, condition: "Permit window [valid_from, valid_until) overlaps another permit on the same system with status IN {REQUESTED, ISSUED, IN_PROGRESS}; touching endpoints allowed" }
  - { id: ERR_DRILL_GAP_VIOLATION, http: 409, condition: "Drill violates the 24h quiet gap vs another PLANNED/CONDUCTED drill of the same facility; exactly 24h separation allowed" }
  - { id: ERR_CONTRACTOR_NOT_QUALIFIED, http: 422, condition: "Contractor.qualification_status != QUALIFIED at permit issue or start" }
  - { id: ERR_EQUIPMENT_INTEGRITY_FAILED, http: 422, condition: "An equipment on the permit's system has integrity_status == FAILED at issue or start" }
  - { id: ERR_FACILITY_NONCOMPLIANT, http: 409, condition: "Facility.compliance_posture == NONCOMPLIANT gates hot work permit issuance" }
  - { id: ERR_SYSTEM_OUT_OF_SERVICE, http: 409, condition: "RefrigerationSystem.status != IN_SERVICE at permit issue" }
  - { id: ERR_INVESTIGATOR_IS_REPORTER, http: 422, condition: "investigator_employee_id == reported_by_employee_id (segregation of duties)" }
  - { id: ERR_VERIFIER_IS_COMPLETER, http: 422, condition: "Incident investigator equals corrective-action assignee at verify (segregation of duties)" }
  - { id: ERR_DRILL_TRAINING_SHORTFALL, http: 422, condition: "Fewer than 2 attendees hold non-expired AMMONIA_OPERATOR training at conduct" }
  - { id: ERR_ACTIONS_OPEN, http: 409, condition: "Incident close attempted while pending_action_count > 0" }
  - { id: ERR_CHARGE_NEGATIVE, http: 422, condition: "REMOVE adjustment would drive Facility.total_charge_lbs below 0" }
  - { id: ERR_QUANTITY_NOT_POSITIVE, http: 422, condition: "quantity_lbs or final_release_lbs <= 0" }
  - { id: ERR_CROSS_FACILITY_REFERENCE, http: 422, condition: "Referenced system/equipment/employee belongs to a different facility than the acted resource" }
  - { id: ERR_NOTIFICATION_NOT_REQUIRED, http: 409, condition: "notify-regulator attempted when notification_status NOT IN {PENDING, OVERDUE}" }
  - { id: ERR_PERMIT_OUTSIDE_WINDOW, http: 409, condition: "Permit start attempted outside [valid_from, valid_until)" }
  - { id: ERR_SYSTEM_NOT_EMPTY, http: 409, condition: "Decommission attempted while system net book charge != 0" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties role model)
# =============================================================================
roles:
  - name: FacilityAdmin
    description: "Facility administrator; owns facility/system/employee master data and system status changes"
    identity: opaque
    exclusive_operations:
      - "POST /psm/facilities"
      - "POST /psm/refrigeration-systems"
      - "POST /psm/refrigeration-systems/{id}/status"
      - "POST /psm/employees"
    shared_operations:
      - "POST /psm/_clock/set_current_utc (with ComplianceOfficer)"
      - "All GET endpoints (with all roles)"

  - name: PsCoordinator
    description: "PSM coordinator; owns process safety information (P&ID) lifecycle, training records, and drills"
    identity: opaque
    exclusive_operations:
      - "POST /psm/psid-documents (+ start-review, reaffirm)"
      - "POST /psm/training-records"
      - "POST /psm/drill-events (+ conduct)"
    shared_operations:
      - "All GET endpoints (with all roles)"

  - name: MaintenanceLead
    description: "Mechanical integrity lead; owns equipment registry, inspections, contractor qualification, and hot work permit issuance/voiding (issuer side of the permit segregation)"
    identity: opaque
    exclusive_operations:
      - "POST /psm/equipment"
      - "POST /psm/inspections (+ complete)"
      - "POST /psm/contractors (+ qualify, suspend, reinstate)"
      - "POST /psm/hot-work-permits/{id}/issue and /void"
    shared_operations:
      - "POST /psm/refrigeration-systems/{id}/head-pressure-target (with Operator)"
      - "All GET endpoints (with all roles)"

  - name: ComplianceOfficer
    description: "Compliance officer; owns incident investigation assignment/closure, audits, leak confirmation and regulatory notification, and the checkpoint run"
    identity: opaque
    exclusive_operations:
      - "POST /psm/incidents/{id}/assign-investigator, /close, /reopen"
      - "POST /psm/corrective-actions"
      - "POST /psm/compliance-audits (+ start, close)"
      - "POST /psm/leak-events/{id}/confirm, /false-alarm, /notify-regulator"
      - "POST /psm/checkpoints/run"
    shared_operations:
      - "POST /psm/incidents (with Operator)"
      - "POST /psm/_clock/set_current_utc (with FacilityAdmin)"
      - "All GET endpoints (with all roles)"

  - name: Operator
    description: "Certified refrigeration operator (an Employee); posts charge adjustments, gauge readings, leak reports; completes/verifies corrective actions as assignee or investigator"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /psm/charge-adjustments"
      - "POST /psm/refrigeration-systems/{id}/gauge-readings"
      - "POST /psm/leak-events"
      - "POST /psm/corrective-actions/{id}/complete, /verify, /reject (identity pinned to assignee / investigator)"
    shared_operations:
      - "POST /psm/incidents (with ComplianceOfficer; reported_by_employee_id must equal X-User-ID)"
      - "POST /psm/refrigeration-systems/{id}/head-pressure-target (with MaintenanceLead)"
      - "All GET endpoints (with all roles)"

  - name: ContractorRep
    description: "Contractor representative (a Contractor); requests hot work permits and starts/closes permitted work (performer side of the permit segregation — never the issuer)"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /psm/hot-work-permits (contractor_id must equal X-User-ID)"
      - "POST /psm/hot-work-permits/{id}/start and /close (X-User-ID must equal permit.contractor_id)"
    shared_operations:
      - "All GET endpoints (with all roles)"
