            - "seek-consent and record-consent leave both corpus figures untouched at 62000000 and 20000000 - a fund that has not moved still counts against its holder, whatever its transfer_status"
            - "RestrictedFund.${f1}.transferable_amount_cents == 62000000 after the granted consent - a TEMP_RESTRICTED fund releases principal plus all appreciation on the DONOR_CONSENT variant"
