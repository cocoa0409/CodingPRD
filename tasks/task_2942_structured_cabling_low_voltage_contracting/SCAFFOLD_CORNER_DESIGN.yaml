          rationale: "The at-limit, below-limit and above-limit readings are asserted by the named §1.8 instance."

  - section: endpoints
    instances:
      - name: cable_type_crud_reads_back_exactly_what_was_created
        claim_type: standard_crud
        grounds:
          - endpoints[POST /cabling/cable-types]
          - endpoints[GET /cabling/cable-types/{cable_type_id}]
          - endpoints[GET /cabling/cable-types]
        distinguishing_aspect: "The immutable CableType catalogue is exercised through its whole surface: create, single read, and a filtered paginated list — the list must honour a category filter and report total_count and has_more without inventing a version field."
        test_recipe:
          setup: ["Three cable types: two CAT6A and one OM4 fibre"]
          setup_api_calls:
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct1: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMR", outer_diameter_mm: 8.5, max_channel_length_m: 100.0, shielded: true, cost_per_meter_cents: 210, applications: ["DATA_HORIZONTAL", "WAP"] }
              as: DesignEngineer
              captures: { ct2: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "OM4_MMF", jacket_rating: "CMP", outer_diameter_mm: 2.0, max_channel_length_m: 550.0, shielded: false, cost_per_meter_cents: 320, applications: ["BACKBONE"] }
              as: DesignEngineer
              captures: { ct3: $.data.id }
          trigger:
            - call: "GET /cabling/cable-types/${ct2}"
              payload: {}
              as: DesignEngineer
            - call: "GET /cabling/cable-types?category=CAT6A&limit=1&offset=0"
              payload: {}
              as: DesignEngineer
            - call: "GET /cabling/cable-types?category=CAT6A&limit=1&offset=1"
              payload: {}
              as: DesignEngineer
          assert:
            - "the single read returns 200 with category == \"CAT6A\", jacket_rating == \"CMR\", outer_diameter_mm == 8.5, shielded == true, cost_per_meter_cents == 210 and applications == [\"DATA_HORIZONTAL\", \"WAP\"]"
            - "the single read carries id and created_at but no version and no updated_at, because CableType has common_fields false"
            - "the first page returns total_count == 2, has_more == true and exactly one item"
            - "the second page returns total_count == 2, has_more == false and the other CAT6A row"
            - "neither page contains the OM4_MMF row"

      - name: the_route_link_endpoint_needs_both_ends_to_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /cabling/link-routes]
          - validations[priority=40]
          - errors[ERR_LINK_NOT_FOUND]
          - errors[ERR_PATHWAY_SEGMENT_NOT_FOUND]
        distinguishing_aspect: "The junction endpoint is probed with each end broken in turn — an unknown link_id and an unknown pathway_segment_id — and the two distinct 404s prove the body foreign keys are validated separately before the association is written."
        test_recipe:
          setup: ["Project RVT1 with tray PS-A and link TR01-A01, both valid"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true }
              as: DesignEngineer
              captures: { seg_a: $.data.id, seg_a_v1: $.data.version }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link: $.data.id }
          trigger:
            - call: "POST /cabling/link-routes"
              payload: { link_id: "00000000-0000-4000-8000-00000000dead", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
              captures: { err1: $.data.error_id }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link}", pathway_segment_id: "00000000-0000-4000-8000-00000000beef", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
              captures: { err2: $.data.error_id }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
              captures: { route: $.data.id }
          assert:
            - "the unknown link returns 404 with data.error_id == \"ERR_LINK_NOT_FOUND\""
            - "the unknown segment returns 404 with data.error_id == \"ERR_PATHWAY_SEGMENT_NOT_FOUND\""
            - "the valid pair returns 201 with link_id == ${link}, pathway_segment_id == ${seg_a}, sequence_index == 1 and route_state == \"OCCUPYING\""
            - "GET /cabling/pathway-segments/${seg_a} returns occupying_route_count == 1 and version == 2, so neither 404 mutated the segment"

      - name: energizing_a_room_enforces_its_electrical_milestone
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /cabling/telecom-rooms/{room_id}/energize]
          - state_machines.TelecomRoom.GROUNDED_to_ENERGIZED
          - validations[priority=120]
          - errors[ERR_TRADE_NOT_COORDINATED]
        distinguishing_aspect: "The energize action is refused while the ELECTRICAL / POWER_ENERGIZE coordination is only CONFIRMED — this transition demands RELEASED, unlike the pull guard which accepts CONFIRMED — and succeeds the moment the milestone is released."
        test_recipe:
          setup: ["Project RVT1 with room TR01 GROUNDED and an ELECTRICAL / POWER_ENERGIZE coordination in REQUESTED"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
