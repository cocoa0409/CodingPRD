# =============================================================================
# Dog Training & Obedience Classes — Scaffold (§1.0–§1.7)
# Difficulty band: EXPERT
# =============================================================================

scenario: |
  250. Dog Training & Obedience Classes: class level/series enrollment,
  trainer-dog assignment, vaccination prerequisite, private vs group,
  package/punch-card, makeup class, graduation/certificate, behavioral intake

domain_name: dog-training-obedience-classes
api_prefix: /        # flat topology: peer collections at root (/owners, /dogs, /class-series, ...) linked by FK

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: graph_constraint        # level prerequisites + vaccination/intake gates form an enrollment DAG
  secondary_archetype: quota_allocation      # session capacity + punch-card credit pool competed for, reserved, released
  complexity_layers:
    - dual_variant_calculation               # package refund (per-credit vs blended) ; enrollment proration (forward vs chronological)
    - cascading_side_effects                 # session cancel / enrollment withdraw / vaccination expiry chains
    - derived_field_reconciliation           # credits_remaining, seats_available, sessions_remaining stay consistent
    - rate_threshold_triggers                # capacity full, credit floor, vaccination expiry boundary
    - optimistic_concurrency                 # OCC on ClassSeries.version for seat-claiming enrollment

  entity_topology: flat                       # peer entities linked by FK; URL paths are flat collections, not deeply nested
  state_machine_shape: cyclic                 # Enrollment ACTIVE<->WAITLISTED loop; MakeupBooking branching; Package cyclic deplete/refill
  relationship_patterns:
    - one_to_many                             # Owner->Dog, ClassSeries->ClassSession, Package->PackageRedemption
    - many_to_many                            # Dog<->ClassSeries via Enrollment ; Enrollment<->ClassSession via AttendanceRecord
    - cross_aggregate                         # Enrollment debits Package ; AttendanceRecord drives Enrollment progress
  role_model: peer_roles                      # Owner owns dogs/packages ; Trainer owns session delivery ; FrontDesk/Admin operate
  consistency_model: immediate                # all cascades atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation" }
      - { name: full_name, type: string, source: input, description: "Owner's full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across Owners (ERR_DUPLICATE_OWNER_EMAIL)" }
      - { name: phone, type: string, source: input, description: "Contact phone" }

  - name: Trainer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation" }
      - { name: full_name, type: string, source: input, description: "Trainer's full name" }
      - { name: certified_levels, type: array, source: input, description: "Array of levels the trainer may deliver; subset of {PUPPY, BASIC, INTERMEDIATE, ADVANCED}" }
      - { name: handles_private, type: boolean, source: input, default: true, description: "Whether trainer accepts PRIVATE modality sessions" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE" }

  - name: Dog
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation" }
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the dog's owner" }
      - { name: name, type: string, source: input, description: "Dog's name" }
      - { name: breed, type: string, source: input, description: "Breed label" }
      - { name: birth_date, type: datetime, source: input, description: "ISO 8601 date of birth (used to derive age in months at intake)" }
      - { name: vaccination_posture, type: enum, source: computed, default: "UNKNOWN", description: "UNKNOWN | COMPLIANT | NONCOMPLIANT; derived from VaccinationRecord set vs current clock (see calc vaccination_posture)" }
      - { name: highest_completed_level, type: enum, source: computed, default: "NONE", description: "NONE | PUPPY | BASIC | INTERMEDIATE | ADVANCED; highest series level with a GRADUATED enrollment" }
      - { name: intake_status, type: enum, source: computed, default: "PENDING", description: "PENDING | CLEARED | FLAGGED; mirrors latest BehavioralIntake outcome (PENDING when none)" }

  - name: VaccinationRecord
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: dog_id, type: string, source: input, description: "FK -> Dog.id; the vaccinated dog" }
      - { name: vaccine_type, type: enum, source: input, description: "RABIES | DHPP | BORDETELLA" }
      - { name: administered_on, type: datetime, source: input, description: "ISO 8601 date the dose was given" }
      - { name: expires_on, type: datetime, source: input, description: "ISO 8601 date the dose lapses; coverage is valid on [administered_on, expires_on) (half-open: a record with expires_on == class date does NOT cover that date)" }
      - { name: voided, type: boolean, source: system, default: false, description: "True after a correction supersedes this record; voided records are ignored by vaccination_posture" }

  - name: BehavioralIntake
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation" }
      - { name: dog_id, type: string, source: input, description: "FK -> Dog.id; assessed dog" }
      - { name: reactivity_score, type: integer, source: input, description: "0..10 leash/handler reactivity; higher is more reactive" }
      - { name: bite_history, type: boolean, source: input, default: false, description: "Prior recorded bite incident" }
      - { name: recommended_level, type: enum, source: input, description: "PUPPY | BASIC | INTERMEDIATE | ADVANCED suggested entry level" }
      - { name: outcome, type: enum, source: computed, default: "PENDING", description: "PENDING | CLEARED | FLAGGED; FLAGGED iff bite_history true OR reactivity_score >= INTAKE_FLAG_THRESHOLD (see calc intake_outcome)" }
      - { name: requires_private_first, type: boolean, source: computed, description: "True when outcome FLAGGED; such a dog must complete a PRIVATE series before any GROUP enrollment" }

  - name: ClassSeries
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation; OCC field for seat-claiming enrollment" }
      - { name: title, type: string, source: input, description: "Series title" }
      - { name: level, type: enum, source: input, description: "PUPPY | BASIC | INTERMEDIATE | ADVANCED" }
      - { name: prerequisite_level, type: enum, source: input, default: "NONE", description: "NONE | PUPPY | BASIC | INTERMEDIATE; the dog's highest_completed_level must be >= this to enroll" }
      - { name: modality, type: enum, source: input, description: "PRIVATE | GROUP" }
      - { name: capacity, type: integer, source: input, description: "Max concurrent ACTIVE+WAITLISTED-promoted enrollments; PRIVATE series must have capacity == 1 (ERR_INVALID_PRIVATE_CAPACITY)" }
      - { name: session_count, type: integer, source: input, description: "Number of ClassSession occurrences required to graduate" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog price in cents for one full series enrollment when paid without a package" }
      - { name: credit_cost, type: integer, source: input, description: "Punch-card credits one enrollment consumes (PRIVATE typically costs more credits than GROUP)" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of Enrollment where status IN {ACTIVE, GRADUATED} for this series" }
      - { name: seats_available, type: integer, source: computed, description: "capacity - count of Enrollment where status IN {ACTIVE} (see calc seat_accounting); GRADUATED frees no seat, WAITLISTED holds none)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OPEN | CLOSED | ARCHIVED" }

  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation" }
      - { name: series_id, type: string, source: input, description: "FK -> ClassSeries.id; owning series" }
      - { name: trainer_id, type: string, source: input, description: "FK -> Trainer.id; assigned trainer for this occurrence" }
      - { name: sequence_index, type: integer, source: input, description: "1-based position of this session within its series (1..session_count)" }
      - { name: starts_at, type: datetime, source: input, description: "ISO 8601 UTC occurrence start" }
      - { name: ends_at, type: datetime, source: input, description: "ISO 8601 UTC occurrence end; must be > starts_at" }
      - { name: is_makeup_slot, type: boolean, source: input, default: false, description: "True when this session is reserved as a makeup slot (no series progression credit toward graduation count uniqueness)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation" }
      - { name: dog_id, type: string, source: input, description: "FK -> Dog.id; the enrolled dog" }
      - { name: series_id, type: string, source: input, description: "FK -> ClassSeries.id; the series enrolled into" }
      - { name: payment_method, type: enum, source: input, description: "CASH | PACKAGE; PACKAGE debits a punch-card credit pool" }
      - { name: package_id, type: string, source: input, default: null, description: "FK -> Package.id; required when payment_method == PACKAGE, else must be null (ERR_PACKAGE_REQUIRED_FOR_CREDIT)" }
      - { name: price_charged_cents, type: integer, source: computed, default: 0, description: "Cents charged at enrollment; series.list_price_cents for CASH, 0 for PACKAGE (credits instead)" }
      - { name: credits_debited, type: integer, source: computed, default: 0, description: "Punch-card credits debited at enrollment; series.credit_cost for PACKAGE, 0 for CASH" }
      - { name: sessions_attended, type: integer, source: computed, default: 0, description: "Count of AttendanceRecord with state == PRESENT for this enrollment on non-makeup sessions plus completed makeups" }
      - { name: sessions_remaining, type: integer, source: computed, description: "series.session_count - sessions_attended (floored at 0)" }
      - { name: graduation_eligible, type: boolean, source: computed, default: false, description: "True iff sessions_attended >= series.session_count" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Cents refunded on withdrawal (CASH path); 0 until withdrawal" }
      - { name: credits_refunded, type: integer, source: computed, default: 0, description: "Credits returned to package on withdrawal (PACKAGE path); 0 until withdrawal" }
      - { name: status, type: enum, source: system, default: "PENDING_PREREQS", description: "PENDING_PREREQS | ACTIVE | WAITLISTED | SUSPENDED | GRADUATED | WITHDRAWN" }

  - name: Package
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation" }
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the owner who holds this punch-card" }
      - { name: tier, type: enum, source: input, description: "STARTER | VALUE | PRO; selects credits_total and price via tiered_package_pricing" }
      - { name: credits_total, type: integer, source: computed, description: "Total credits granted by the tier (see calc tiered_package_pricing)" }
      - { name: price_paid_cents, type: integer, source: computed, description: "Amount paid for the package in cents (see calc tiered_package_pricing)" }
      - { name: credits_consumed, type: integer, source: computed, default: 0, description: "Sum of net credits debited by PackageRedemption (DEBIT minus REVERSAL) for this package" }
      - { name: credits_remaining, type: integer, source: computed, description: "credits_total - credits_consumed; invariant: credits_remaining + credits_consumed == credits_total" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DEPLETED | EXPIRED; DEPLETED when credits_remaining == 0, returns to ACTIVE on reversal" }

  - name: PackageRedemption
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits (chronological order key for ledger replay)" }
      - { name: package_id, type: string, source: input, description: "FK -> Package.id; the debited package" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the enrollment that caused this ledger row" }
      - { name: kind, type: enum, source: system, description: "DEBIT | REVERSAL" }
      - { name: credits, type: integer, source: system, description: "Positive credit amount moved by this row (DEBIT removes, REVERSAL restores)" }

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; whose attendance this records" }
      - { name: session_id, type: string, source: input, description: "FK -> ClassSession.id; the session attended/missed" }
      - { name: state, type: enum, source: system, default: "EXPECTED", description: "EXPECTED | PRESENT | ABSENT | MISSED_PROVIDER | MAKEUP_PENDING | MAKEUP_DONE" }
      - { name: makeup_eligible, type: boolean, source: computed, default: false, description: "True when state IN {MISSED_PROVIDER} OR (state == ABSENT AND series.modality == PRIVATE); MISSED_PROVIDER is always eligible" }

  - name: MakeupBooking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, increments by 1 on every mutation" }
      - { name: attendance_id, type: string, source: input, description: "FK -> AttendanceRecord.id; the missed attendance being made up (must be makeup_eligible)" }
      - { name: makeup_session_id, type: string, source: input, description: "FK -> ClassSession.id; the slot booked for the makeup (is_makeup_slot == true)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | CONFIRMED | COMPLETED | REJECTED | CANCELLED" }

  - name: Certificate
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits (issuance timestamp)" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the graduated enrollment" }
      - { name: dog_id, type: string, source: system, description: "FK -> Dog.id; denormalized from enrollment for lookup" }
      - { name: level, type: enum, source: system, description: "Series level certified: PUPPY | BASIC | INTERMEDIATE | ADVANCED" }
      - { name: serial, type: string, source: system, description: "Human-readable issuance serial of the form CERT-<level>-<created_at epoch>; immutable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ClassSeries
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /class-series/{seriesId}/open"
        actor: AdminManager
        preconditions:
          - "At least session_count ClassSession rows exist for this series (ERR_SESSIONS_INCOMPLETE)"
          - "Every ClassSession of this series has a trainer_id whose certified_levels includes series.level (ERR_TRAINER_LEVEL_MISMATCH)"
          - "If modality == PRIVATE, capacity == 1 (ERR_INVALID_PRIVATE_CAPACITY)"
        side_effects:
          - "seats_available initialized to capacity"
      - from: OPEN
        to: CLOSED
        trigger: "POST /class-series/{seriesId}/close"
        actor: AdminManager
        preconditions: []
        side_effects:
          - "No further enrollment seat-claims accepted; existing ACTIVE enrollments continue toward graduation"
      - from: [DRAFT, CLOSED]
        to: ARCHIVED
        trigger: "POST /class-series/{seriesId}/archive"
        actor: AdminManager
        preconditions:
          - "No Enrollment of this series in status ACTIVE or WAITLISTED or SUSPENDED (ERR_SERIES_HAS_LIVE_ENROLLMENTS)"
        side_effects:
          - "All SCHEDULED ClassSession of this series → CANCELLED (no makeup generation since no live enrollments)"

  - entity: ClassSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /class-sessions/{sessionId}/start"
        actor: Trainer
        preconditions:
          - "Owning series.status == OPEN (ERR_SERIES_NOT_OPEN)"
          - "Acting trainer is session.trainer_id (ERR_NOT_SESSION_TRAINER)"
        side_effects:
          - "AttendanceRecord rows with state EXPECTED remain pending marking"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /class-sessions/{sessionId}/complete"
        actor: Trainer
        preconditions:
          - "Every AttendanceRecord for this session is in a marked state (not EXPECTED) (ERR_ATTENDANCE_UNMARKED)"
        side_effects:
          - "For each PRESENT AttendanceRecord on a non-makeup session: owning Enrollment.sessions_attended recomputed (calc enrollment_progress)"
          - "Each affected Enrollment with sessions_attended >= series.session_count → graduation_eligible = true"
      - from: [SCHEDULED, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /class-sessions/{sessionId}/cancel"
        actor: AdminManager
        preconditions: []
        side_effects:
          - "CASCADE L1: every AttendanceRecord for this session in {EXPECTED, MAKEUP_PENDING} → MISSED_PROVIDER"
          - "CASCADE L2: each such AttendanceRecord becomes makeup_eligible = true (provider-caused miss)"
          - "CASCADE L3: any MakeupBooking whose makeup_session_id == this session in {REQUESTED, CONFIRMED} → CANCELLED, and its source AttendanceRecord reverts to MISSED_PROVIDER (re-opens makeup eligibility)"

  - entity: Enrollment
    field: status
    initial_state: PENDING_PREREQS
    terminal_states: [GRADUATED, WITHDRAWN]
    transitions:
      - from: PENDING_PREREQS
        to: ACTIVE
        trigger: "POST /enrollments (seat claim succeeds at creation)"
        actor: system
        preconditions:
          - "series.status == OPEN (ERR_SERIES_NOT_OPEN)"
          - "Dog.vaccination_posture == COMPLIANT against the first session date (ERR_VACCINATION_PREREQUISITE)"
          - "Dog.highest_completed_level >= series.prerequisite_level (ERR_PREREQUISITE_LEVEL_NOT_MET)"
          - "If series.modality == GROUP and Dog.intake_status == FLAGGED, Dog must have a GRADUATED PRIVATE enrollment (ERR_PRIVATE_FIRST_REQUIRED)"
          - "series.seats_available >= 1 (else WAITLISTED instead of ACTIVE)"
          - "expected_series_version matches series.version (ERR_STALE_SERIES_VERSION)"
        side_effects:
          - "EXPECTED AttendanceRecord created for each non-makeup ClassSession of the series"
          - "If payment_method == PACKAGE: PackageRedemption DEBIT of series.credit_cost; package.credits_consumed += credit_cost; if credits_remaining == 0 → package.status DEPLETED"
          - "If payment_method == CASH: price_charged_cents = series.list_price_cents"
          - "series.enrolled_count and series.seats_available recomputed (calc seat_accounting)"
      - from: PENDING_PREREQS
        to: WAITLISTED
        trigger: "POST /enrollments (prereqs pass but no seat free)"
        actor: system
        preconditions:
          - "series.status == OPEN"
          - "All prerequisite checks pass EXCEPT seats_available == 0"
        side_effects:
          - "No AttendanceRecord, no charge, no credit debit until promotion"
      - from: WAITLISTED
        to: ACTIVE
        trigger: "POST /enrollments/{enrollmentId}/promote OR system on seat release"
        actor: FrontDesk
        preconditions:
          - "series.seats_available >= 1 (ERR_NO_SEAT_AVAILABLE)"
          - "Dog.vaccination_posture == COMPLIANT (re-checked) (ERR_VACCINATION_PREREQUISITE)"
        side_effects:
          - "Same charge/debit and AttendanceRecord creation as PENDING_PREREQS→ACTIVE"
          - "series.seats_available recomputed"
      - from: ACTIVE
        to: WAITLISTED
        trigger: "system (seat reclaimed when over-capacity after a promotion conflict resolution)"
        actor: system
        preconditions:
          - "series.seats_available < 0 after recomputation"
        side_effects:
          - "Most-recently-activated enrollment (max created_at, then max id lexicographically is FORBIDDEN; use created_at only) demoted; its PackageRedemption DEBIT reversed and AttendanceRecord rows deleted"
        note: "Demotion picks the enrollment with the latest created_at among ACTIVE; created_at is the sole tie-discriminator, never id"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (Dog.vaccination_posture flips to NONCOMPLIANT)"
        actor: system
        preconditions:
          - "Owning Dog.vaccination_posture == NONCOMPLIANT"
        side_effects:
          - "No seat released (seat held); attendance marking blocked until reinstated"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /enrollments/{enrollmentId}/reinstate"
        actor: FrontDesk
        preconditions:
          - "Owning Dog.vaccination_posture == COMPLIANT (ERR_VACCINATION_PREREQUISITE)"
        side_effects: []
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /enrollments/{enrollmentId}/graduate"
        actor: AdminManager
        preconditions:
          - "graduation_eligible == true i.e. sessions_attended >= series.session_count (ERR_NOT_GRADUATION_ELIGIBLE)"
        side_effects:
          - "Certificate created (level = series.level)"
          - "Dog.highest_completed_level recomputed to max(level, prior)"
          - "series.seats_available recomputed (GRADUATED frees the seat)"
      - from: [PENDING_PREREQS, ACTIVE, WAITLISTED, SUSPENDED]
        to: WITHDRAWN
        trigger: "POST /enrollments/{enrollmentId}/withdraw"
        actor: Owner
        preconditions:
          - "Acting Owner owns the enrolled Dog (ERR_NOT_DOG_OWNER)"
        side_effects:
          - "CASCADE L1: refund computed (calc enrollment_refund) — CASH sets refund_cents, PACKAGE creates PackageRedemption REVERSAL of credits_refunded"
          - "CASCADE L2 (PACKAGE only): package.credits_consumed decremented; package.credits_remaining recomputed"
          - "CASCADE L3 (PACKAGE only): if package.status was DEPLETED and credits_remaining > 0 → package.status ACTIVE"
          - "Outstanding EXPECTED/MAKEUP_PENDING AttendanceRecord rows deleted; series.seats_available recomputed (seat released for ACTIVE)"

  - entity: Package
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (credits_remaining reaches 0 via enrollment DEBIT)"
        actor: system
        preconditions:
          - "credits_remaining == 0 after the DEBIT"
        side_effects: []
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (REVERSAL restores at least one credit)"
        actor: system
        preconditions:
          - "credits_remaining > 0 after the REVERSAL"
        side_effects: []
      - from: [ACTIVE, DEPLETED]
        to: EXPIRED
        trigger: "POST /packages/{packageId}/expire"
        actor: AdminManager
        preconditions:
          - "No Enrollment in status ACTIVE or WAITLISTED or SUSPENDED references this package (ERR_PACKAGE_IN_USE)"
        side_effects:
          - "Remaining credits forfeited (credits_remaining frozen, no further DEBIT/REVERSAL accepted)"

  - entity: MakeupBooking
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /makeup-bookings/{makeupId}/confirm"
        actor: FrontDesk
        preconditions:
          - "Source AttendanceRecord.makeup_eligible == true (ERR_MAKEUP_NOT_ELIGIBLE)"
          - "makeup_session.is_makeup_slot == true AND status == SCHEDULED (ERR_INVALID_MAKEUP_SLOT)"
          - "makeup_session.series_id refers to a series whose level == the source enrollment's series.level (ERR_MAKEUP_LEVEL_MISMATCH)"
        side_effects:
          - "Source AttendanceRecord.state → MAKEUP_PENDING"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /makeup-bookings/{makeupId}/reject"
        actor: FrontDesk
        preconditions: []
        side_effects:
          - "Source AttendanceRecord state unchanged (remains MISSED_PROVIDER or ABSENT)"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /makeup-bookings/{makeupId}/complete"
        actor: Trainer
        preconditions:
          - "makeup_session.status == COMPLETED (ERR_MAKEUP_SESSION_NOT_COMPLETED)"
        side_effects:
          - "Source AttendanceRecord.state → MAKEUP_DONE"
          - "Owning Enrollment.sessions_attended recomputed (the makeup now counts) (calc enrollment_progress)"
          - "If sessions_attended >= series.session_count → Enrollment.graduation_eligible = true"
      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /makeup-bookings/{makeupId}/cancel OR system (makeup session cancelled)"
        actor: FrontDesk
        preconditions: []
        side_effects:
          - "Source AttendanceRecord reverts to MISSED_PROVIDER (re-opens makeup eligibility)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — only sanctioned race)
# =============================================================================
concurrency_rules:
  - rule_id: enroll-seat-claim-stale-series
    parent_entity: ClassSeries
    write_endpoint: "POST /enrollments"
    occ_field: "expected_series_version"
    description: |
      Creating an Enrollment that claims a seat against a ClassSeries whose
      version has advanced since the client last observed it is rejected. A
      prior enrollment, withdrawal, or graduation legitimately recomputes
      seats_available and bumps series.version; the current writer's seat
      count is therefore stale and the seat it believes is free may already
      be taken. The stale-version check resolves this deterministically.
    error_id: ERR_STALE_SERIES_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tiered_package_pricing
    trigger: "POST /packages (package creation)"
    algorithm: tiered_pricing
    formula: |
      # combinatorial: tier selects (base_credits, base_price), then a private-eligibility
      # surcharge and a bulk discount interact non-linearly. Evaluation order is PINNED:
      #   step 1: base_credits, base_price from tier
      #   step 2: gross = base_price
      #   step 3: bulk_discount_pct = (base_credits >= BULK_THRESHOLD) ? BULK_DISCOUNT : 0
      #   step 4: price_paid_cents = round_half_up(gross * (1 - bulk_discount_pct))
      #   step 5: credits_total = base_credits + ((base_credits >= BULK_THRESHOLD) ? BONUS_CREDITS : 0)
      tier == STARTER -> base_credits=4,  base_price=20000
      tier == VALUE   -> base_credits=8,  base_price=36000
      tier == PRO     -> base_credits=16, base_price=64000
    input_set: "single Package row at creation"
    constants:
      BULK_THRESHOLD: 8
      BULK_DISCOUNT: 0.10
      BONUS_CREDITS: 1
    precision: "price_paid_cents integer cents, round_half_up at step 4 only"
    note: "VALUE: gross 36000, 10% off -> 32400, credits 8+1=9. PRO: 64000 -> 57600, credits 16+1=17. STARTER: 20000, no discount, credits 4."

  - name: enrollment_refund
    trigger: "Enrollment ACTIVE/WAITLISTED/SUSPENDED -> WITHDRAWN"
    algorithm: forward_looking
    formula: |
      # DUAL-VARIANT on the Enrollment domain. The two variants diverge on identical data.
      sessions_done = sessions_attended (PRESENT on non-makeup + completed makeups)
      remaining = max(0, series.session_count - sessions_done)
      per_session_value = series.list_price_cents / series.session_count   # exact rational
      VARIANT forward_unused (CASH path, applied):
        refund_cents = round_half_up(per_session_value * remaining)
      VARIANT chronological_consumed (informational comparison):
        consumed_cents = round_half_up(per_session_value * sessions_done)
        # forward refund and (list_price - chronological consumed) differ by a rounding cent
        # whenever per_session_value is non-integer (e.g. 30000/7).
      PACKAGE path:
        credits_refunded = (remaining > 0) ? series.credit_cost : 0   # all-or-nothing credit return
    input_set: "the withdrawing Enrollment and its series; sessions_attended at withdrawal time"
    constants: {}
    precision: "refund_cents/consumed_cents integer cents, round_half_up"
    variants:
      - name: forward_unused
        when: "CASH enrollment withdrawal — the applied refund"
        difference: "Refund = per_session_value * remaining_sessions (forward-looking on unused sessions)"
      - name: chronological_consumed
        when: "Reconciliation comparison shown in withdrawal response as consumed_value_cents"
        difference: "Charges per_session_value * sessions_done; list_price - consumed differs from forward refund by a rounding cent for non-integer per_session_value"

  - name: package_credit_valuation
    trigger: "GET /packages/{packageId}/valuation (credit cash-value report)"
    algorithm: weighted_scoring
    formula: |
      # DUAL-VARIANT on the Package domain (different entity than enrollment_refund).
      # Same remaining credits, two valuation algorithms produce different cents.
      VARIANT per_credit_list (sum-then-... no): nested rounding, ROUND-PER-CREDIT-THEN-SUM:
        per_credit_value = price_paid_cents / credits_total        # exact rational
        per_credit_valuation_cents = sum over credits_remaining of round_half_up(per_credit_value)
          == round_half_up(per_credit_value) * credits_remaining
      VARIANT blended_pool (SUM-THEN-ROUND):
        blended_valuation_cents = round_half_up(price_paid_cents * credits_remaining / credits_total)
      # The two diverge by up to (credits_remaining) cents because rounding-order matters.
    input_set: "single Package row at report time"
    constants: {}
    precision: "integer cents, round_half_up; per_credit variant rounds EACH credit before summing, blended variant rounds ONCE after multiplying"
    variants:
      - name: per_credit_list
        when: "punch-card style valuation — each credit valued independently"
        difference: "Rounds per-credit value first, then multiplies by credits_remaining (round-then-sum)"
      - name: blended_pool
        when: "pooled cash-out valuation"
        difference: "Multiplies remaining/total by price first, rounds once (sum-then-round); differs from per_credit by rounding drift"

  - name: vaccination_posture
    trigger: "POST /dogs/{dogId}/vaccinations, void, clock advance, and read of Dog"
    algorithm: threshold
    formula: |
      Required vaccines = {RABIES, DHPP, BORDETELLA}.
      For each required type, consider non-voided VaccinationRecord for the dog.
      A type is covered at reference_date iff there exists a record with
        administered_on <= reference_date < expires_on   # half-open: expires_on excluded
      posture == COMPLIANT iff all three types covered at reference_date, else NONCOMPLIANT;
      UNKNOWN only when the dog has zero non-voided records of any type.
      reference_date for enrollment = first non-makeup ClassSession.starts_at (date) of the series;
      reference_date for posture display = current clock date.
    input_set: "non-voided VaccinationRecord rows for the dog"
    constants:
      REQUIRED_TYPES: ["RABIES", "DHPP", "BORDETELLA"]
    precision: "date comparison; boundary expires_on == reference_date is NONCOMPLIANT (half-open)"

  - name: intake_outcome
    trigger: "POST /dogs/{dogId}/behavioral-intakes (intake creation)"
    algorithm: threshold
    formula: |
      outcome = (bite_history == true OR reactivity_score >= INTAKE_FLAG_THRESHOLD) ? FLAGGED : CLEARED
      requires_private_first = (outcome == FLAGGED)
      Dog.intake_status mirrors the latest (max created_at) BehavioralIntake.outcome.
    input_set: "the new BehavioralIntake row"
    constants:
      INTAKE_FLAG_THRESHOLD: 7
    precision: "integer comparison; reactivity_score == 7 is FLAGGED (>=)"

  - name: seat_accounting
    trigger: "enrollment create/promote/withdraw/graduate; series open"
    algorithm: aggregation
    formula: |
      enrolled_count = count(Enrollment where series_id == S AND status IN {ACTIVE, GRADUATED})
      active_holding  = count(Enrollment where series_id == S AND status == ACTIVE)
      seats_available = series.capacity - active_holding
      # invariant: active_holding + seats_available == capacity (SUSPENDED holds its seat too:
      # SUSPENDED counts as active_holding for seat purposes)
      active_holding includes SUSPENDED: active_holding = count(status IN {ACTIVE, SUSPENDED})
    input_set: "Enrollment rows of the series, filtered by status as above"
    constants: {}
    precision: "integer counts; seats_available never displayed below 0 (floored at 0 for display, internal may go negative transiently before demotion)"

  - name: enrollment_progress
    trigger: "ClassSession complete; MakeupBooking complete; attendance mark"
    algorithm: aggregation
    formula: |
      sessions_attended =
        count(AttendanceRecord where enrollment_id == E AND state == PRESENT AND session.is_makeup_slot == false)
        + count(AttendanceRecord where enrollment_id == E AND state == MAKEUP_DONE)
      sessions_remaining = max(0, series.session_count - sessions_attended)
      graduation_eligible = (sessions_attended >= series.session_count)
    input_set: "AttendanceRecord rows for the enrollment"
    constants: {}
    precision: "integer counts; boundary sessions_attended == session_count makes graduation_eligible true (>=)"

  - name: trainer_overlap_check
    trigger: "POST /class-sessions; PATCH /class-sessions/{id}"
    algorithm: interval_merge
    formula: |
      For the candidate session C (trainer T, [C.starts_at, C.ends_at)), scan every
      existing ClassSession X with X.trainer_id == T AND X.status != CANCELLED:
        # buffered, half-open: two sessions conflict unless separated by >= TRAINER_BUFFER_MIN minutes
        gap_before = C.starts_at - X.ends_at   (minutes, if C after X)
        gap_after  = X.starts_at - C.ends_at   (minutes, if C before X)
        conflict iff NOT (gap_before >= TRAINER_BUFFER_MIN OR gap_after >= TRAINER_BUFFER_MIN)
      Any conflict → reject with ERR_TRAINER_DOUBLE_BOOKED.
    input_set: "non-CANCELLED ClassSession rows sharing the candidate's trainer_id"
    constants:
      TRAINER_BUFFER_MIN: 15
    precision: "minute granularity; exactly TRAINER_BUFFER_MIN minutes of gap is permitted (>=), less is rejected; zero gap (back-to-back) is rejected"

  - name: dog_overlap_check
    trigger: "POST /makeup-bookings/{id}/confirm; POST /enrollments"
    algorithm: interval_merge
    formula: |
      For the dog D of the enrollment, collect the [starts_at, ends_at) intervals of every
      session D is committed to (EXPECTED/PRESENT/MAKEUP_PENDING non-CANCELLED sessions, plus
      the candidate makeup slot or new-series sessions). Two intervals [a,b) and [c,d) conflict iff
        a < d AND c < b      # STRICT overlap, NO buffer
      Exact adjacency (b == c) does NOT conflict. Any strict overlap → ERR_DOG_SESSION_OVERLAP.
    input_set: "committed session intervals for the dog across all its non-WITHDRAWN enrollments"
    constants: {}
    precision: "half-open intervals, strict overlap only; touching endpoints (b == c) are allowed (no buffer)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource IDs exist, validated left-to-right (series, session, enrollment, package, dog, owner, trainer, attendance, makeup)"
    error_id: "ERR_SERIES_NOT_FOUND / ERR_SESSION_NOT_FOUND / ERR_ENROLLMENT_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_DOG_NOT_FOUND / ERR_OWNER_NOT_FOUND / ERR_TRAINER_NOT_FOUND / ERR_ATTENDANCE_NOT_FOUND / ERR_MAKEUP_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource references

  - priority: 4
    category: business_referential
    check: "Acting Owner owns the referenced Dog/Enrollment/Package (X-User-ID == Owner.id == resource.owner_id chain)"
    error_id: ERR_NOT_DOG_OWNER
    http_status: 403
    applies_to: "POST /enrollments, POST /enrollments/{id}/withdraw, POST /packages, POST /dogs/{id}/vaccinations, POST /dogs/{id}/behavioral-intakes"

  - priority: 5
    category: state
    check: "Target resource in correct state for the transition (series OPEN to enroll, session SCHEDULED to start, enrollment ACTIVE to graduate, makeup REQUESTED to confirm, etc.)"
    error_id: "ERR_SERIES_NOT_OPEN / ERR_INVALID_STATE / ERR_NOT_GRADUATION_ELIGIBLE / ERR_ATTENDANCE_UNMARKED / ERR_MAKEUP_SESSION_NOT_COMPLETED"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_constraint
    check: "PRIVATE series capacity must equal 1; trainer certified for series level; makeup slot must be is_makeup_slot SCHEDULED; makeup level matches"
    error_id: "ERR_INVALID_PRIVATE_CAPACITY / ERR_TRAINER_LEVEL_MISMATCH / ERR_INVALID_MAKEUP_SLOT / ERR_MAKEUP_LEVEL_MISMATCH / ERR_SESSIONS_INCOMPLETE"
    http_status: 422
    applies_to: "POST /class-series/{id}/open, POST /makeup-bookings/{id}/confirm"

  - priority: 7
    category: business_safety
    check: "Vaccination prerequisite: Dog.vaccination_posture COMPLIANT at the series first-session date (half-open expiry boundary)"
    error_id: ERR_VACCINATION_PREREQUISITE
    http_status: 422
    applies_to: "POST /enrollments, POST /enrollments/{id}/promote, POST /enrollments/{id}/reinstate"

  - priority: 8
    category: business_safety
    check: "Behavioral gate: FLAGGED dog must hold a GRADUATED PRIVATE enrollment before any GROUP enrollment"
    error_id: ERR_PRIVATE_FIRST_REQUIRED
    http_status: 422
    applies_to: "POST /enrollments (GROUP modality)"

  - priority: 9
    category: business_constraint
    check: "Level prerequisite: Dog.highest_completed_level >= series.prerequisite_level"
    error_id: ERR_PREREQUISITE_LEVEL_NOT_MET
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 10
    category: business_temporal
    check: "Trainer temporal overlap: no two non-CANCELLED ClassSessions assigned to the same trainer may overlap on the half-open interval [starts_at, ends_at); a buffer of TRAINER_BUFFER_MIN minutes is required between consecutive sessions (adjacency within buffer is rejected)"
    error_id: ERR_TRAINER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /class-sessions, PATCH /class-sessions/{id}"

  - priority: 11
    category: business_temporal
    check: "Dog temporal overlap: a dog's ACTIVE enrollments must not have two attended sessions whose [starts_at, ends_at) intervals strictly overlap; exact adjacency (ends_at == next starts_at) is ALLOWED (no buffer, closed-open touching permitted)"
    error_id: ERR_DOG_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /makeup-bookings/{id}/confirm, POST /enrollments"

  - priority: 12
    category: business_fiscal
    check: "Package credit sufficiency: package.credits_remaining >= series.credit_cost; package belongs to acting owner; package status ACTIVE"
    error_id: "ERR_INSUFFICIENT_CREDITS / ERR_PACKAGE_NOT_OWNED / ERR_PACKAGE_NOT_ACTIVE"
    http_status: 402
    applies_to: "POST /enrollments (payment_method PACKAGE)"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: at most one non-terminal (status NOT IN {WITHDRAWN, GRADUATED}) Enrollment per (dog_id, series_id) pair; Owner email unique"
    error_id: "ERR_DUPLICATE_ENROLLMENT / ERR_DUPLICATE_OWNER_EMAIL"
    http_status: 409
    applies_to: "POST /enrollments, POST /owners"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Owner ----
  - method: POST
    path: "/owners"
    description: "Create an Owner"
    roles: [FrontDesk, AdminManager]
    code: 201
    input: [full_name, email, phone]
    output: Owner
    side_effects: ["version=1"]
  - method: GET
    path: "/owners"
    description: "List Owners"
    roles: [FrontDesk, AdminManager]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: "Owner[]"
    side_effects: []
  - method: GET
    path: "/owners/{ownerId}"
    description: "Get an Owner"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # ---- Dog (FK owner_id -> Owner) ----
  - method: POST
    path: "/dogs"
    description: "Register a Dog"
    roles: [Owner, FrontDesk, AdminManager]
    code: 201
    input: [owner_id, name, breed, birth_date]
    output: Dog
    side_effects: ["vaccination_posture=UNKNOWN, highest_completed_level=NONE, intake_status=PENDING, version=1"]
  - method: GET
    path: "/dogs"
    description: "List Dogs; filter by owner_id"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: ["owner_id?", "limit?", "offset?"]
    output: "Dog[]"
    side_effects: []
  - method: GET
    path: "/dogs/{dogId}"
    description: "Get a Dog (computed vaccination_posture, highest_completed_level, intake_status)"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: []
    output: Dog
    side_effects: ["vaccination_posture recomputed against current clock"]

  # ---- VaccinationRecord (FK dog_id -> Dog) ----
  - method: POST
    path: "/dogs/{dogId}/vaccinations"
    description: "Add a vaccination record for a dog"
    roles: [Owner, FrontDesk, AdminManager]
    code: 201
    input: [vaccine_type, administered_on, expires_on]
    output: VaccinationRecord
    side_effects: ["Dog.vaccination_posture recomputed; if flips to COMPLIANT, no auto-transition; if NONCOMPLIANT and dog has ACTIVE enrollments they → SUSPENDED"]
  - method: GET
    path: "/vaccinations"
    description: "List vaccination records; filter by dog_id"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: ["dog_id?", "limit?", "offset?"]
    output: "VaccinationRecord[]"
    side_effects: []
  - method: GET
    path: "/vaccinations/{vaccinationId}"
    description: "Get a vaccination record"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: []
    output: VaccinationRecord
    side_effects: []
  - method: POST
    path: "/vaccinations/{vaccinationId}/void"
    description: "Void a vaccination record (correction)"
    roles: [FrontDesk, AdminManager]
    code: 200
    input: []
    output: VaccinationRecord
    side_effects: ["voided=true; Dog.vaccination_posture recomputed; CASCADE: if posture flips to NONCOMPLIANT, dog's ACTIVE enrollments → SUSPENDED"]

  # ---- BehavioralIntake (FK dog_id -> Dog) ----
  - method: POST
    path: "/dogs/{dogId}/behavioral-intakes"
    description: "Record a behavioral intake assessment"
    roles: [Trainer, FrontDesk, AdminManager]
    code: 201
    input: [reactivity_score, bite_history, recommended_level]
    output: BehavioralIntake
    side_effects: ["outcome computed (calc intake_outcome); Dog.intake_status mirrors latest outcome; requires_private_first set"]
  - method: GET
    path: "/behavioral-intakes"
    description: "List behavioral intakes; filter by dog_id"
    roles: [Trainer, FrontDesk, AdminManager]
    code: 200
    input: ["dog_id?", "limit?", "offset?"]
    output: "BehavioralIntake[]"
    side_effects: []
  - method: GET
    path: "/behavioral-intakes/{intakeId}"
    description: "Get a behavioral intake"
    roles: [Trainer, FrontDesk, AdminManager]
    code: 200
    input: []
    output: BehavioralIntake
    side_effects: []

  # ---- Trainer ----
  - method: POST
    path: "/trainers"
    description: "Create a Trainer"
    roles: [AdminManager]
    code: 201
    input: [full_name, certified_levels, "handles_private?"]
    output: Trainer
    side_effects: ["status=ACTIVE, version=1"]
  - method: GET
    path: "/trainers"
    description: "List Trainers"
    roles: [Trainer, FrontDesk, AdminManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Trainer[]"
    side_effects: []
  - method: GET
    path: "/trainers/{trainerId}"
    description: "Get a Trainer"
    roles: [Trainer, FrontDesk, AdminManager]
    code: 200
    input: []
    output: Trainer
    side_effects: []

  # ---- ClassSeries ----
  - method: POST
    path: "/class-series"
    description: "Create a ClassSeries (DRAFT)"
    roles: [AdminManager]
    code: 201
    input: [title, level, "prerequisite_level?", modality, capacity, session_count, list_price_cents, credit_cost]
    output: ClassSeries
    side_effects: ["status=DRAFT, enrolled_count=0, version=1"]
  - method: GET
    path: "/class-series"
    description: "List ClassSeries"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: ["level?", "status?", "limit?", "offset?"]
    output: "ClassSeries[]"
    side_effects: []
  - method: GET
    path: "/class-series/{seriesId}"
    description: "Get a ClassSeries (computed seats_available, enrolled_count)"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: []
    output: ClassSeries
    side_effects: ["seats_available, enrolled_count recomputed (calc seat_accounting)"]
  - method: POST
    path: "/class-series/{seriesId}/open"
    description: "Open a series for enrollment"
    roles: [AdminManager]
    code: 200
    input: []
    output: ClassSeries
    side_effects: ["status → OPEN; seats_available initialized to capacity; version bumps"]
  - method: POST
    path: "/class-series/{seriesId}/close"
    description: "Close a series to new enrollment"
    roles: [AdminManager]
    code: 200
    input: []
    output: ClassSeries
    side_effects: ["status → CLOSED; version bumps"]
  - method: POST
    path: "/class-series/{seriesId}/archive"
    description: "Archive a series"
    roles: [AdminManager]
    code: 200
    input: []
    output: ClassSeries
    side_effects: ["status → ARCHIVED; all SCHEDULED sessions → CANCELLED; version bumps"]

  # ---- ClassSession (FK series_id -> ClassSeries, trainer_id -> Trainer) ----
  - method: POST
    path: "/class-sessions"
    description: "Create a ClassSession occurrence (trainer-dog/series assignment)"
    roles: [AdminManager]
    code: 201
    input: [series_id, trainer_id, sequence_index, starts_at, ends_at, "is_makeup_slot?"]
    output: ClassSession
    side_effects: ["status=SCHEDULED; trainer overlap check (calc/validation ERR_TRAINER_DOUBLE_BOOKED)"]
  - method: GET
    path: "/class-sessions"
    description: "List ClassSessions; filter by series_id or trainer_id"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: ["series_id?", "trainer_id?", "limit?", "offset?"]
    output: "ClassSession[]"
    side_effects: []
  - method: GET
    path: "/class-sessions/{sessionId}"
    description: "Get a ClassSession"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: []
    output: ClassSession
    side_effects: []
  - method: PATCH
    path: "/class-sessions/{sessionId}"
    description: "Reschedule a SCHEDULED session (times/trainer)"
    roles: [AdminManager]
    code: 200
    input: ["trainer_id?", "starts_at?", "ends_at?"]
    output: ClassSession
    side_effects: ["re-runs trainer overlap check (ERR_TRAINER_DOUBLE_BOOKED)"]
  - method: POST
    path: "/class-sessions/{sessionId}/start"
    description: "Trainer starts a session"
    roles: [Trainer]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["status → IN_PROGRESS"]
  - method: POST
    path: "/class-sessions/{sessionId}/complete"
    description: "Trainer completes a session; finalizes attendance and progress"
    roles: [Trainer]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["status → COMPLETED; enrollment_progress recomputed for PRESENT records; graduation_eligible flips when threshold met"]
  - method: POST
    path: "/class-sessions/{sessionId}/cancel"
    description: "Cancel a session (provider-caused)"
    roles: [AdminManager]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["status → CANCELLED; CASCADE attendance → MISSED_PROVIDER → makeup_eligible; dependent MakeupBookings → CANCELLED"]

  # ---- AttendanceRecord (FK enrollment_id -> Enrollment, session_id -> ClassSession) ----
  - method: POST
    path: "/class-sessions/{sessionId}/attendance"
    description: "Mark a single attendance record for a session (PRESENT/ABSENT)"
    roles: [Trainer]
    code: 200
    input: [attendance_id, state]
    output: AttendanceRecord
    side_effects: ["state set to PRESENT or ABSENT; makeup_eligible recomputed"]
  - method: GET
    path: "/attendance-records"
    description: "List attendance records; filter by enrollment_id or session_id"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: ["enrollment_id?", "session_id?", "limit?", "offset?"]
    output: "AttendanceRecord[]"
    side_effects: []
  - method: GET
    path: "/attendance-records/{attendanceId}"
    description: "Get an attendance record"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []

  # ---- Enrollment (FK dog_id -> Dog, series_id -> ClassSeries) ----
  - method: POST
    path: "/enrollments"
    description: "Enroll a dog into a series (claims seat or waitlists); OCC on series.version"
    roles: [Owner, FrontDesk, AdminManager]
    code: 201
    input: [dog_id, series_id, payment_method, "package_id?", expected_series_version]
    output: Enrollment
    side_effects: ["prereq cascade; ACTIVE or WAITLISTED; AttendanceRecord rows; PackageRedemption DEBIT or CASH charge; seat_accounting recompute; increments ClassSeries.version by 1"]
  - method: GET
    path: "/enrollments"
    description: "List enrollments; filter by dog_id, series_id, or package_id"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: ["dog_id?", "series_id?", "package_id?", "status?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []
  - method: GET
    path: "/enrollments/{enrollmentId}"
    description: "Get an enrollment (computed progress/refund fields)"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["sessions_attended, sessions_remaining, graduation_eligible recomputed (calc enrollment_progress)"]
  - method: POST
    path: "/enrollments/{enrollmentId}/promote"
    description: "Promote a WAITLISTED enrollment to ACTIVE"
    roles: [FrontDesk, AdminManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["WAITLISTED → ACTIVE; charge/debit + AttendanceRecord creation; seat_accounting recompute"]
  - method: POST
    path: "/enrollments/{enrollmentId}/reinstate"
    description: "Reinstate a SUSPENDED enrollment after vaccination cleared"
    roles: [FrontDesk, AdminManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["SUSPENDED → ACTIVE"]
  - method: POST
    path: "/enrollments/{enrollmentId}/graduate"
    description: "Graduate an eligible enrollment and issue a certificate"
    roles: [AdminManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["ACTIVE → GRADUATED; Certificate created; Dog.highest_completed_level recomputed; seat freed; seat_accounting recompute"]
  - method: POST
    path: "/enrollments/{enrollmentId}/withdraw"
    description: "Withdraw an enrollment (owner-initiated); refunds money or credits"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["→ WITHDRAWN; enrollment_refund cascade; PackageRedemption REVERSAL or refund_cents; package un-deplete; seat released; AttendanceRecord cleanup"]

  # ---- Package (FK owner_id -> Owner) ----
  - method: POST
    path: "/packages"
    description: "Purchase a punch-card package (tiered pricing)"
    roles: [Owner, FrontDesk, AdminManager]
    code: 201
    input: [owner_id, tier]
    output: Package
    side_effects: ["credits_total, price_paid_cents computed (calc tiered_package_pricing); credits_consumed=0; status=ACTIVE; version=1"]
  - method: GET
    path: "/packages"
    description: "List packages; filter by owner_id"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: ["owner_id?", "limit?", "offset?"]
    output: "Package[]"
    side_effects: []
  - method: GET
    path: "/packages/{packageId}"
    description: "Get a package (computed credits_remaining)"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: []
    output: Package
    side_effects: ["credits_consumed, credits_remaining recomputed from PackageRedemption ledger"]
  - method: GET
    path: "/packages/{packageId}/valuation"
    description: "Dual-variant cash valuation of remaining credits"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: []
    output: "{ package_id: string, credits_remaining: integer, per_credit_valuation_cents: integer, blended_valuation_cents: integer }"
    side_effects: ["computes per_credit_list and blended_pool variants (calc package_credit_valuation)"]
  - method: GET
    path: "/packages/{packageId}/redemptions"
    description: "List PackageRedemption ledger rows for a package"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "PackageRedemption[]"
    side_effects: []
  - method: POST
    path: "/packages/{packageId}/expire"
    description: "Expire a package (forfeit remaining credits)"
    roles: [AdminManager]
    code: 200
    input: []
    output: Package
    side_effects: ["status → EXPIRED if no live enrollment references it"]

  # ---- PackageRedemption reverse lookup by enrollment ----
  - method: GET
    path: "/package-redemptions"
    description: "List redemptions; filter by enrollment_id or package_id"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: ["enrollment_id?", "package_id?", "limit?", "offset?"]
    output: "PackageRedemption[]"
    side_effects: []
  - method: GET
    path: "/package-redemptions/{redemptionId}"
    description: "Get a redemption ledger row"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: []
    output: PackageRedemption
    side_effects: []

  # ---- MakeupBooking (FK attendance_id -> AttendanceRecord, makeup_session_id -> ClassSession) ----
  - method: POST
    path: "/makeup-bookings"
    description: "Request a makeup for a missed session"
    roles: [Owner, FrontDesk, AdminManager]
    code: 201
    input: [attendance_id, makeup_session_id]
    output: MakeupBooking
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/makeup-bookings"
    description: "List makeup bookings; filter by attendance_id or makeup_session_id"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: ["attendance_id?", "makeup_session_id?", "limit?", "offset?"]
    output: "MakeupBooking[]"
    side_effects: []
  - method: GET
    path: "/makeup-bookings/{makeupId}"
    description: "Get a makeup booking"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: []
    output: MakeupBooking
    side_effects: []
  - method: POST
    path: "/makeup-bookings/{makeupId}/confirm"
    description: "Confirm a requested makeup booking"
    roles: [FrontDesk, AdminManager]
    code: 200
    input: []
    output: MakeupBooking
    side_effects: ["REQUESTED → CONFIRMED; source AttendanceRecord → MAKEUP_PENDING; dog overlap check"]
  - method: POST
    path: "/makeup-bookings/{makeupId}/reject"
    description: "Reject a requested makeup booking"
    roles: [FrontDesk, AdminManager]
    code: 200
    input: []
    output: MakeupBooking
    side_effects: ["REQUESTED → REJECTED"]
  - method: POST
    path: "/makeup-bookings/{makeupId}/complete"
    description: "Complete a confirmed makeup (after the makeup session completed)"
    roles: [Trainer]
    code: 200
    input: []
    output: MakeupBooking
    side_effects: ["CONFIRMED → COMPLETED; source AttendanceRecord → MAKEUP_DONE; enrollment_progress recomputed"]
  - method: POST
    path: "/makeup-bookings/{makeupId}/cancel"
    description: "Cancel a makeup booking"
    roles: [Owner, FrontDesk, AdminManager]
    code: 200
    input: []
    output: MakeupBooking
    side_effects: ["→ CANCELLED; source AttendanceRecord reverts to MISSED_PROVIDER"]

  # ---- Certificate (FK enrollment_id -> Enrollment, dog_id -> Dog) ----
  - method: GET
    path: "/certificates"
    description: "List certificates; filter by enrollment_id or dog_id"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: ["enrollment_id?", "dog_id?", "limit?", "offset?"]
    output: "Certificate[]"
    side_effects: []
  - method: GET
    path: "/certificates/{certificateId}"
    description: "Get a certificate"
    roles: [Owner, Trainer, FrontDesk, AdminManager]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  # ---- Test-driving clock endpoint ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving)"
    roles: [AdminManager]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["current clock set; Dog.vaccination_posture recomputes against new date on next read"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, type mismatch, or invalid enum value" }
  - { id: ERR_INVALID_SESSION_TIMES, http: 400, condition: "ClassSession ends_at <= starts_at" }
  # --- Not found ---
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "Owner id does not exist" }
  - { id: ERR_DOG_NOT_FOUND, http: 404, condition: "Dog id does not exist" }
  - { id: ERR_TRAINER_NOT_FOUND, http: 404, condition: "Trainer id does not exist" }
  - { id: ERR_SERIES_NOT_FOUND, http: 404, condition: "ClassSeries id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "ClassSession id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "Package id does not exist" }
  - { id: ERR_ATTENDANCE_NOT_FOUND, http: 404, condition: "AttendanceRecord id does not exist" }
  - { id: ERR_MAKEUP_NOT_FOUND, http: 404, condition: "MakeupBooking id does not exist" }
  # --- Ownership / referential ---
  - { id: ERR_NOT_DOG_OWNER, http: 403, condition: "Acting Owner does not own the referenced dog/enrollment/package" }
  - { id: ERR_NOT_SESSION_TRAINER, http: 403, condition: "Acting Trainer is not the session's assigned trainer" }
  - { id: ERR_PACKAGE_NOT_OWNED, http: 403, condition: "Package owner_id does not match the enrolling dog's owner" }
  - { id: ERR_PACKAGE_REQUIRED_FOR_CREDIT, http: 422, condition: "payment_method PACKAGE without package_id, or package_id supplied with CASH" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not permitted from the resource's current state" }
  - { id: ERR_SERIES_NOT_OPEN, http: 409, condition: "Operation requires series.status == OPEN" }
  - { id: ERR_SESSIONS_INCOMPLETE, http: 422, condition: "Opening a series before session_count sessions exist" }
  - { id: ERR_SERIES_HAS_LIVE_ENROLLMENTS, http: 409, condition: "Archiving a series that still has ACTIVE/WAITLISTED/SUSPENDED enrollments" }
  - { id: ERR_ATTENDANCE_UNMARKED, http: 409, condition: "Completing a session with EXPECTED (unmarked) attendance rows" }
  - { id: ERR_NOT_GRADUATION_ELIGIBLE, http: 409, condition: "Graduating an enrollment with sessions_attended < session_count" }
  - { id: ERR_MAKEUP_SESSION_NOT_COMPLETED, http: 409, condition: "Completing a makeup booking before its makeup session is COMPLETED" }
  - { id: ERR_PACKAGE_IN_USE, http: 409, condition: "Expiring a package still referenced by a live enrollment" }
  - { id: ERR_PACKAGE_NOT_ACTIVE, http: 409, condition: "Debiting credits from a non-ACTIVE (DEPLETED/EXPIRED) package" }
  # --- Business constraint ---
  - { id: ERR_INVALID_PRIVATE_CAPACITY, http: 422, condition: "PRIVATE series capacity != 1" }
  - { id: ERR_TRAINER_LEVEL_MISMATCH, http: 422, condition: "A session trainer's certified_levels lacks the series level at open" }
  - { id: ERR_PREREQUISITE_LEVEL_NOT_MET, http: 422, condition: "Dog.highest_completed_level < series.prerequisite_level" }
  - { id: ERR_PRIVATE_FIRST_REQUIRED, http: 422, condition: "FLAGGED dog enrolling GROUP without a GRADUATED PRIVATE enrollment" }
  - { id: ERR_INVALID_MAKEUP_SLOT, http: 422, condition: "Makeup session is not is_makeup_slot or not SCHEDULED" }
  - { id: ERR_MAKEUP_LEVEL_MISMATCH, http: 422, condition: "Makeup session's series level differs from source enrollment series level" }
  - { id: ERR_MAKEUP_NOT_ELIGIBLE, http: 422, condition: "Source attendance record is not makeup_eligible" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "A non-terminal enrollment for the (dog, series) pair already exists" }
  - { id: ERR_DUPLICATE_OWNER_EMAIL, http: 409, condition: "Owner email already in use" }
  # --- Safety ---
  - { id: ERR_VACCINATION_PREREQUISITE, http: 422, condition: "Dog vaccination_posture not COMPLIANT at the relevant reference date" }
  # --- Temporal ---
  - { id: ERR_TRAINER_DOUBLE_BOOKED, http: 409, condition: "Session overlaps (within buffer) another non-CANCELLED session for the same trainer" }
  - { id: ERR_DOG_SESSION_OVERLAP, http: 409, condition: "A dog would have two strictly-overlapping attended sessions" }
  - { id: ERR_NO_SEAT_AVAILABLE, http: 409, condition: "Promotion attempted with seats_available == 0" }
  # --- Fiscal ---
  - { id: ERR_INSUFFICIENT_CREDITS, http: 402, condition: "package.credits_remaining < series.credit_cost" }
  # --- Concurrency ---
  - { id: ERR_STALE_SERIES_VERSION, http: 412, condition: "expected_series_version does not match current ClassSeries.version on seat-claiming enrollment" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Owner
    description: "Dog owner; registers dogs, buys packages, enrolls/withdraws own dogs, requests makeups"
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /enrollments/{id}/withdraw — withdraw own enrollment (shared with desk/admin but owner-scoped)"
    shared_operations:
      - "POST /dogs — register a dog (owner_id must equal X-User-ID)"
      - "POST /dogs/{id}/vaccinations — add vaccination for own dog"
      - "POST /enrollments — enroll own dog"
      - "POST /packages — buy package for self"
      - "POST /makeup-bookings — request makeup for own dog"
      - "POST /makeup-bookings/{id}/cancel"
      - "GET reads of own owners/dogs/packages/enrollments/certificates/series/sessions"

  - name: Trainer
    description: "Delivers sessions; records behavioral intake, marks attendance, starts/completes sessions and makeups"
    identity: "entity_backed:Trainer"
    exclusive_operations:
      - "POST /class-sessions/{id}/start — only the assigned trainer"
      - "POST /class-sessions/{id}/complete"
      - "POST /class-sessions/{id}/attendance — mark attendance"
      - "POST /makeup-bookings/{id}/complete"
    shared_operations:
      - "POST /dogs/{id}/behavioral-intakes — record intake (shared with desk/admin)"
      - "GET reads of trainers/sessions/series/enrollments/attendance/makeups/certificates"

  - name: FrontDesk
    description: "Operational staff; manages owners, promotions, reinstatements, makeup confirmations"
    identity: "opaque"
    exclusive_operations:
      - "POST /enrollments/{id}/promote"
      - "POST /enrollments/{id}/reinstate"
      - "POST /makeup-bookings/{id}/confirm"
      - "POST /makeup-bookings/{id}/reject"
      - "POST /vaccinations/{id}/void"
    shared_operations:
      - "POST /owners, POST /dogs, POST /enrollments, POST /packages, POST /makeup-bookings"
      - "POST /enrollments/{id}/withdraw"
      - "POST /dogs/{id}/vaccinations, POST /dogs/{id}/behavioral-intakes"
      - "GET reads across all collections"

  - name: AdminManager
    description: "Manager; full catalog/lifecycle control (series, sessions, trainers, graduation, package expiry)"
    identity: "opaque"
    exclusive_operations:
      - "POST /trainers"
      - "POST /class-series and /class-series/{id}/{open,close,archive}"
      - "POST /class-sessions, PATCH /class-sessions/{id}, POST /class-sessions/{id}/cancel"
      - "POST /enrollments/{id}/graduate"
      - "POST /packages/{id}/expire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /owners, POST /dogs, POST /enrollments, POST /packages, POST /makeup-bookings"
      - "POST /enrollments/{id}/{withdraw,promote,reinstate}"
      - "POST /dogs/{id}/vaccinations, POST /dogs/{id}/behavioral-intakes, POST /vaccinations/{id}/void"
      - "POST /makeup-bookings/{id}/{confirm,reject}"
      - "GET reads across all collections"
