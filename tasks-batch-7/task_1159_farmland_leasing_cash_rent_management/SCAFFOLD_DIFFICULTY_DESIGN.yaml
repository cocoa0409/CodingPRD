              as: FarmManager
            - call: "GET /installments?lease_id=${lse}"
              as: FarmManager
              captures:
                i1: "$.data[0].id"
            - call: "POST /installments/${i1}/record_payment"
              payload: { amount_cents: 1250000 }
              as: FarmManager
              as_user_id: "mgr-1"
              captures:
                i1_paid: "$.data.status"
          trigger:
            - call: "POST /installments/${i1}/reverse_payment"
              as: FarmManager
              as_user_id: "mgr-2"
              captures:
                i1_after: "$.data.status"
                i1_paidc: "$.data.paid_cents"
            - call: "GET /landlords/${ld}"
              as: FarmManager
              captures:
                l_recv: "$.data.total_received_cents"
                l_pend: "$.data.pending_receivable_cents"
          assert:
            - "installment ${i1}.status == OPEN after reversal (clock 2027-03-01 is within grace, so not LATE)"
            - "installment ${i1}.paid_cents == 0 after reversal"
            - "landlord ${ld}.total_received_cents == 0 (recomputed from the installment mutation, not the API call)"
            - "landlord ${ld}.pending_receivable_cents == 1250000 (I1 OPEN again; I2 SCHEDULED excluded)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waived_installment_payment_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: recording a 1250000 payment
          on a WAIVED installment violates the state rule (not OPEN/LATE) AND
          the fiscal rule (amount > outstanding 0); the state-category error
          ERR_INVALID_STATE (priority 6) must win over ERR_PAYMENT_EXCEEDS_BALANCE
          (priority 11).
        test_recipe:
          setup:
            - "CASH lease ACTIVE; I1 1250000 OPEN at clock 2027-03-01; I1 WAIVED with landlord_consent (outstanding 1250000 > 100000 cap)"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Prio", contact_email: "lp@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
