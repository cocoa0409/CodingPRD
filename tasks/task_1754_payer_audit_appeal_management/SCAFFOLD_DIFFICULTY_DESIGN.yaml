            - "d2_st == \"ON_HOLD\" (LEVEL_1 in hold_levels)"
            - "err_hold == \"ERR_DEMAND_ON_HOLD\" (offsets blocked while held)"
            - "d2_st2 == \"DEMANDED\" (withdraw releases the hold)"
