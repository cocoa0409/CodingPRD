        distinguishing_aspect: "GET /lab/genes?limit=2&offset=0 over 3 genes returns 2 items with total_count==3 and has_more==true in the pagination envelope."
        test_recipe:
          setup:
            - "Three genes created."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
