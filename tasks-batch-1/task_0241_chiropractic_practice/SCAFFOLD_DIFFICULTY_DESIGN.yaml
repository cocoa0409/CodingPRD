  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_discontinued_plan_series
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_VISIT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair STATE (priority 7, ERR_INVALID_STATE) vs BUSINESS_FISCAL (priority 16, ERR_VISIT_CAP_EXCEEDED):
          generating a series for a phase under a DISCONTINUED plan (phase CANCELLED, not generatable — state violation)
          whose INSURANCE policy is ALSO cap-exhausted (annual_visit_cap=1 already committed — fiscal violation) must return
          ERR_INVALID_STATE, because the state check (priority 7) precedes the fiscal cap check (priority 16). The single
          request genuinely violates BOTH rules.
        test_recipe:
          setup:
            - "INSURANCE patient, ACTIVE policy annual_visit_cap=1; its single cap slot is COMMITTED by one ATTENDED+adjudicated visit so the policy is exhausted."
            - "A plan with an ACUTE phase (planned 2) that was ACTIVE then DISCONTINUED, so the phase is CANCELLED (series generation no longer valid)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
