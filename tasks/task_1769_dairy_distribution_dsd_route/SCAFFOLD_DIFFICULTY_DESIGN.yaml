  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_fulfillment_payment_axes
        grounds:
          - state_machines.RouteOrder
          - entities.RouteOrder.fields.fulfillment_status
          - entities.RouteOrder.fields.payment_status
        distinguishing_aspect: |
          RouteOrder carries two independent state axes: after delivery the
          fulfillment axis is terminally DELIVERED while the payment axis keeps
          moving INVOICED -> PARTIALLY_PAID -> PAID via invoice payments; the
          companion instance exercises a cyclic machine on a different entity
          (Return).
        test_recipe:
          setup:
            - "Distributor, ACTIVE route, store (credit_limit 100000000), driver; non-regulated product PL 250c; order of 10 units DELIVERED on 2026-08-10; invoice total 2500 OPEN"
          setup_api_calls:
