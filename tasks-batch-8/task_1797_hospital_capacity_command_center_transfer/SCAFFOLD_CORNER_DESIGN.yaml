      - name: huddle_rolling_window_executive_escalation
        claim_type: correct_result
        grounds: [calculations.boarding_escalation_check]
        distinguishing_aspect: "Rolling-window aggregation: three huddles within 24h set executive_escalation true exactly at the third resolve; after two it stays false."
        test_recipe:
          setup:
            - "Clock at 00:00; facility; ED admission with boarding record BR"
            - "Cycle: heartbeat 130 -> auto huddle H1; resolve H1; heartbeat 140 -> H2; resolve H2; heartbeat 150 -> H3; resolve H3"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Roll Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ED-1", label: "E1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { eb: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${eb}", patient_ref: "PRR", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm: $.data.id }
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm}" }
              as: TransferCenterCoordinator
              captures: { br: $.data.id }
          trigger:
            - call: "POST /cc/boarding-records/${br}/heartbeat"
              payload: { observed_minutes: 130 }
              as: TransferCenterCoordinator
            - call: "GET /cc/boarding-records/${br}/huddles"
              as: Any
              captures: { hud1: "$.data[0].id" }
            - call: "POST /cc/huddles/${hud1}/resolve"
              payload: { resolution: "r1" }
              as: HouseSupervisor
              as_user_id: "hs_1"
            - call: "POST /cc/boarding-records/${br}/heartbeat"
              payload: { observed_minutes: 140 }
              as: TransferCenterCoordinator
            - call: "GET /cc/boarding-records/${br}/huddles?status=CALLED"
              as: Any
              captures: { hud2: "$.data[0].id" }
            - call: "POST /cc/huddles/${hud2}/resolve"
              payload: { resolution: "r2" }
              as: HouseSupervisor
              as_user_id: "hs_1"
            - call: "POST /cc/boarding-records/${br}/heartbeat"
              payload: { observed_minutes: 150 }
              as: TransferCenterCoordinator
            - call: "GET /cc/boarding-records/${br}/huddles?status=CALLED"
              as: Any
              captures: { hud3: "$.data[0].id" }
            - call: "POST /cc/huddles/${hud3}/resolve"
              payload: { resolution: "r3" }
              as: HouseSupervisor
              as_user_id: "hs_1"
          assert:
            - "after resolving H2: BoardingRecord.${br}.huddle_count_24h == 2 and executive_escalation == false"
            - "after resolving H3: huddle_count_24h == 3 and executive_escalation == true (>= 3 within 24h)"

      - name: dual_variant_load_score
        claim_type: variant_divergence
        grounds: [calculations.transfer_load_score]
        excluded_because:
          difficulty_instance: load_score_raw_vs_weighted_variants
          rationale: "Both variants asserted with literal values in the named §1.8 instance."

      - name: dual_variant_forecast_census
        claim_type: variant_divergence
        grounds: [calculations.projected_census]
        excluded_because:
          difficulty_instance: forecast_committed_vs_provisional_census
          rationale: "Both variants asserted with literal arrays in the named §1.8 instance."

      - name: rounding_order_pinned
        claim_type: precision
        grounds: [calculations.facility_service_occupancy]
        excluded_because:
          difficulty_instance: service_weighted_occupancy_rounding_order
          rationale: "Pinned round-per-service-first order asserted (36.7 vs 42.9) in the named §1.8 instance."

