              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 2, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
