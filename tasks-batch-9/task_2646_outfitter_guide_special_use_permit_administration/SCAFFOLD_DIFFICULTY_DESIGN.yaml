            - "on Alpine's permit ${pa_id} the points run 2, 4, 6 then 11 as the three MINOR (2 each) and one MODERATE (5) actions are issued"
            - "BELOW the threshold: after the fourth action Alpine's permit reads open_noncompliance_points 11 and compliance_status PROBATION, and administrative_status is still ISSUED"
