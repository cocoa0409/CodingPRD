# =============================================================================
# Task 1018 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_line_provisional_vs_final
        grounds:
          - calculations.line_pricing
          - entities.OrderLine.fields.provisional_line_cents
          - entities.OrderLine.fields.final_line_cents
          - state_machines.CustomerOrder.CONFIRMED_to_PACKED
        distinguishing_aspect: |
          On an OrderLine, the provisional variant prices requested_grams (100 -> 250c)
          while the final variant prices measured net_grams (111 -> 278c); same line, two
          approaches, different cents. Entity domain: OrderLine (pricing).
        test_recipe:
          setup:
            - "Clock 2026-06-15; Chamomile (2.5 c/g) with a 500g fresh lot; account with ample credit."
            - "Order priced and confirmed with one line requested_grams=100; then packed with gross=121, tare=10 (net=111)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${cham_id}", lot_code: "CH-1", grams_received: 500, received_at: "2026-06-01T00:00:00Z", best_by: "2026-12-01T00:00:00Z" }
              as: CatalogManager
              captures: { lot_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}", allergen_ack: false }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
              captures: { line_id: $.data.id }
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ord_id}/pack"
              payload: { line_measurements: [ { line_id: "${line_id}", gross_grams: 121, tare_grams: 10 } ] }
              as: ProductionOperator
          assert:
            - "OrderLine.${line_id}.provisional_line_cents == 250"
            - "OrderLine.${line_id}.final_line_cents == 278"
            - "OrderLine.${line_id}.provisional_line_cents != OrderLine.${line_id}.final_line_cents"

      - name: account_committed_vs_projected_exposure
        grounds:
          - calculations.account_exposure
          - entities.WholesaleAccount.fields.committed_exposure_cents
          - entities.WholesaleAccount.fields.projected_exposure_cents
          - entities.WholesaleAccount.fields.available_credit_cents
        distinguishing_aspect: |
          On a WholesaleAccount, the committed variant counts only CONFIRMED holds (250c)
          while the projected variant adds PRICED orders at provisional (250+700=950c); same
          account, two approaches, different cents. Entity domain: WholesaleAccount (credit),
          distinct from the OrderLine pricing dual-variant.
        test_recipe:
          setup:
            - "Account with two orders: order A confirmed (provisional 250c), order B only priced (provisional 700c)."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Ceylon Cinnamon", category: "SPICE", kind: "SIMPLE", unit_price_cents_per_gram: 3.5, tare_default_grams: 10, allergen_tags: [] }
              as: CatalogManager
              captures: { ceylon_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { orda_id: $.data.id }
            - call: "POST /orders/${orda_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
            - call: "POST /orders/${orda_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${orda_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ordb_id: $.data.id }
            - call: "POST /orders/${ordb_id}/lines"
              payload: { product_id: "${ceylon_id}", requested_grams: 200 }
              as: SalesAgent
            - call: "POST /orders/${ordb_id}/price"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "GET /wholesale-accounts/${acc_id}"
              payload: {}
              as: SalesAgent
          assert:
            - "WholesaleAccount.${acc_id}.committed_exposure_cents == 250"
            - "WholesaleAccount.${acc_id}.projected_exposure_cents == 950"
            - "WholesaleAccount.${acc_id}.available_credit_cents == 99750"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: order_subtotal_rounding_order
        grounds:
          - calculations.order_subtotal_rounding
          - calculations.line_pricing
          - state_machines.CustomerOrder.DRAFT_to_PRICED
        distinguishing_aspect: |
          Mode (b) nested rounding: two lines each with a .5-cent product (Ceylon 111g->388.5,
          Chamomile 45g->112.5). Round-each-then-sum = 389+113 = 502; the sum-then-round
          alternative = round(501.0) = 501. Scaffold pins per-line-first -> 502.
        test_recipe:
          setup:
            - "Order with two lines: Ceylon (3.5 c/g) requested 111, Chamomile (2.5 c/g) requested 45; account with ample credit."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Ceylon Cinnamon", category: "SPICE", kind: "SIMPLE", unit_price_cents_per_gram: 3.5, tare_default_grams: 10, allergen_tags: [] }
              as: CatalogManager
              captures: { ceylon_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${ceylon_id}", requested_grams: 111 }
              as: SalesAgent
              captures: { line_c: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 45 }
              as: SalesAgent
              captures: { line_ch: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
          assert:
            - "OrderLine.${line_c}.provisional_line_cents == 389"
            - "OrderLine.${line_ch}.provisional_line_cents == 113"
            - "CustomerOrder.${ord_id}.total_net_grams == 156"
            - "CustomerOrder.${ord_id}.provisional_total_cents == 502"

      - name: order_discount_tier_selection
        grounds:
          - calculations.order_discount_tier
          - calculations.order_total
          - entities.CustomerOrder.fields.total_net_grams
        distinguishing_aspect: |
          Mode (a) tiered-rate selection with 3 inputs (grams, tier table, subtotal): 600g net
          falls in [500,2000) -> 0.05; discount = round(1500*0.05)=75; total = 1500-75 = 1425.
          A <500g read would select 0%. Different mode from the rounding-order instance.
        test_recipe:
          setup:
            - "Order with one line Chamomile (2.5 c/g) requested 600g; account with ample credit."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 600 }
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
          assert:
            - "CustomerOrder.${ord_id}.total_net_grams == 600"
            - "CustomerOrder.${ord_id}.provisional_total_cents == 1425"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: inventory_lot_available_depleted_cycle
        grounds:
          - state_machines.InventoryLot.AVAILABLE_to_DEPLETED
          - state_machines.InventoryLot.DEPLETED_to_AVAILABLE
          - entities.InventoryLot.fields.status
        distinguishing_aspect: |
          InventoryLot cycles AVAILABLE -> DEPLETED (pack draws all 111g) -> AVAILABLE (cancel
          restores 111g), a genuine A->B->A cycle no linear pipeline permits. Entity: InventoryLot.
        test_recipe:
          setup:
            - "Chamomile with a single 111g lot; order confirmed then packed to draw exactly 111g, then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${cham_id}", lot_code: "CH-1", grams_received: 111, received_at: "2026-06-01T00:00:00Z", best_by: "2026-12-01T00:00:00Z" }
              as: CatalogManager
              captures: { lot_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}", allergen_ack: false }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
              captures: { line_id: $.data.id }
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
            - call: "POST /orders/${ord_id}/pack"
              payload: { line_measurements: [ { line_id: "${line_id}", gross_grams: 121, tare_grams: 10 } ] }
              as: ProductionOperator
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: SalesAgent
          assert:
            - "InventoryLot.${lot_id}.grams_on_hand == 111"
            - "InventoryLot.${lot_id}.status == AVAILABLE"

      - name: wholesale_account_active_suspended_cycle
        grounds:
          - state_machines.WholesaleAccount.ACTIVE_to_SUSPENDED
          - state_machines.WholesaleAccount.SUSPENDED_to_ACTIVE
          - entities.WholesaleAccount.fields.status
        distinguishing_aspect: |
          WholesaleAccount cycles ACTIVE -> SUSPENDED (suspend) -> ACTIVE (reinstate), a cyclic
          machine on a different entity than InventoryLot.
        test_recipe:
          setup:
            - "A fresh account is suspended then reinstated."
          setup_api_calls:
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /wholesale-accounts/${acc_id}/suspend"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /wholesale-accounts/${acc_id}/reinstate"
              payload: {}
              as: SalesAgent
          assert:
            - "WholesaleAccount.${acc_id}.status == ACTIVE"

  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: batch_produce_depletes_lot_then_stock_state
        grounds:
          - state_machines.Batch.PLANNED_to_PRODUCED
          - calculations.batch_component_draw
          - state_machines.InventoryLot.AVAILABLE_to_DEPLETED
          - entities.Product.fields.stock_state
        distinguishing_aspect: |
          Depth-3 chain from produce: (1) draw 30g from Sweet Almond lot -> grams_on_hand 0;
          (2) lot AVAILABLE->DEPLETED caused by the draw; (3) last positive lot gone ->
          Product.stock_state OUT_OF_STOCK caused by the depletion. Each hop caused by the prior.
        test_recipe:
          setup:
            - "Almond Chai blend = Black Tea 70% + Sweet Almond 30%; Black Tea lot 200g, Sweet Almond lot exactly 30g; a scheduled batch targeting 100g."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Black Tea Base", category: "TEA", kind: "SIMPLE", unit_price_cents_per_gram: 4.0, tare_default_grams: 5, allergen_tags: [] }
              as: CatalogManager
              captures: { bt_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Sweet Almond Bits", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 5.0, tare_default_grams: 5, allergen_tags: ["TREE_NUTS"] }
              as: CatalogManager
              captures: { sa_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Almond Chai Blend", category: "TEA", kind: "BLEND", unit_price_cents_per_gram: 7.2, tare_default_grams: 5, allergen_tags: [] }
              as: CatalogManager
              captures: { chai_id: $.data.id }
            - call: "POST /blend-components"
              payload: { blend_product_id: "${chai_id}", component_product_id: "${bt_id}", weight_ratio_bps: 7000 }
              as: CatalogManager
            - call: "POST /blend-components"
              payload: { blend_product_id: "${chai_id}", component_product_id: "${sa_id}", weight_ratio_bps: 3000 }
              as: CatalogManager
            - call: "POST /inventory-lots"
              payload: { product_id: "${bt_id}", lot_code: "BT-1", grams_received: 200, received_at: "2026-06-01T00:00:00Z", best_by: "2026-12-01T00:00:00Z" }
              as: CatalogManager
              captures: { bt_lot: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${sa_id}", lot_code: "SA-1", grams_received: 30, received_at: "2026-06-01T00:00:00Z", best_by: "2026-12-01T00:00:00Z" }
              as: CatalogManager
              captures: { sa_lot: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "Line 1" }
              as: ProductionOperator
              captures: { line_id: $.data.id }
            - call: "POST /batches"
              payload: { blend_product_id: "${chai_id}", production_line_id: "${line_id}", target_output_grams: 100, scheduled_start: "2026-07-10T08:00:00Z", scheduled_end: "2026-07-10T10:00:00Z" }
              as: ProductionOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /batches/${batch_id}/produce"
              payload: {}
              as: ProductionOperator
          assert:
            - "InventoryLot.${sa_lot}.grams_on_hand == 0"
            - "InventoryLot.${sa_lot}.status == DEPLETED"
            - "Product.${sa_id}.stock_state == OUT_OF_STOCK"
            - "InventoryLot.${bt_lot}.grams_on_hand == 130"
            - "Product.${bt_id}.stock_state == IN_STOCK"

      - name: order_cancel_restores_lot_then_stock_state
        grounds:
          - state_machines.CustomerOrder.PACKED_to_CANCELLED
          - state_machines.InventoryLot.DEPLETED_to_AVAILABLE
          - entities.Product.fields.stock_state
        distinguishing_aspect: |
          Depth-2 chain from order cancel: (1) release restores 111g to the lot; (2) lot
          DEPLETED->AVAILABLE and Product OUT_OF_STOCK->IN_STOCK caused by the restore. Different
          trigger (order cancel) than the batch-produce cascade.
        test_recipe:
          setup:
            - "Chamomile with a single 111g lot; order packed drawing all 111g (lot DEPLETED, product OUT_OF_STOCK); then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${cham_id}", lot_code: "CH-1", grams_received: 111, received_at: "2026-06-01T00:00:00Z", best_by: "2026-12-01T00:00:00Z" }
              as: CatalogManager
              captures: { lot_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}", allergen_ack: false }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
              captures: { line_id: $.data.id }
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
            - call: "POST /orders/${ord_id}/pack"
              payload: { line_measurements: [ { line_id: "${line_id}", gross_grams: 121, tare_grams: 10 } ] }
              as: ProductionOperator
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: SalesAgent
          assert:
            - "InventoryLot.${lot_id}.grams_on_hand == 111"
            - "InventoryLot.${lot_id}.status == AVAILABLE"
            - "Product.${cham_id}.stock_state == IN_STOCK"

  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_confirm
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          A DRAFT order (not PRICED) whose provisional (250c) would also exceed a 100c credit
          limit is confirmed: the state check (prio 4) wins over the fiscal check (prio 10) ->
          ERR_INVALID_STATE. Pair: state vs business_fiscal.
        test_recipe:
          setup:
            - "Tiny-limit account (100c); DRAFT order with a line whose provisional (250c) would exceed it; order never priced."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: safety_beats_temporal_on_pack
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_ALLERGEN_LABEL_REQUIRED]
          - errors[ERR_LOT_EXPIRED]
        distinguishing_aspect: |
          Packing an order with an allergen line (allergen_ack=false) whose only lot is also
          EXPIRED: the safety check (prio 6) wins over the temporal check (prio 7) ->
          ERR_ALLERGEN_LABEL_REQUIRED. Pair: business_safety vs business_temporal (different pair).
        test_recipe:
          setup:
            - "Sweet Almond (allergen) with a lot best_by 2026-08-01; order confirmed with allergen_ack=false; clock advanced to 2026-08-01 (lot EXPIRED) before pack."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Sweet Almond Bits", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 5.0, tare_default_grams: 5, allergen_tags: ["TREE_NUTS"] }
              as: CatalogManager
              captures: { sa_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${sa_id}", lot_code: "SA-1", grams_received: 100, received_at: "2026-06-01T00:00:00Z", best_by: "2026-08-01T00:00:00Z" }
              as: CatalogManager
              captures: { sa_lot: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}", allergen_ack: false }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${sa_id}", requested_grams: 30 }
              as: SalesAgent
              captures: { line_id: $.data.id }
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${ord_id}/pack"
              payload: { line_measurements: [ { line_id: "${line_id}", gross_grams: 40, tare_grams: 5 } ] }
              as: ProductionOperator
          assert:
            - "response error_id == ERR_ALLERGEN_LABEL_REQUIRED"

  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: freshness_expiry_inclusive_at_pack
        grounds:
          - calculations.freshness_status
          - validations[priority=7]
          - errors[ERR_LOT_EXPIRED]
          - entities.InventoryLot.fields.best_by
        distinguishing_aspect: |
          With clock set to exactly best_by (2026-08-01T00:00:00Z) the lot is EXPIRED because
          the freshness boundary is inclusive (clock >= best_by); pack rejects ERR_LOT_EXPIRED.
          Metric: freshness date at the pack endpoint.
        test_recipe:
          setup:
            - "Chamomile (no allergen) with a lot best_by 2026-08-01; order confirmed; clock set to exactly 2026-08-01 before pack."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${cham_id}", lot_code: "CH-1", grams_received: 100, received_at: "2026-06-01T00:00:00Z", best_by: "2026-08-01T00:00:00Z" }
              as: CatalogManager
              captures: { lot_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}", allergen_ack: true }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 50 }
              as: SalesAgent
              captures: { line_id: $.data.id }
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${ord_id}/pack"
              payload: { line_measurements: [ { line_id: "${line_id}", gross_grams: 58, tare_grams: 8 } ] }
              as: ProductionOperator
          assert:
            - "response error_id == ERR_LOT_EXPIRED"

      - name: credit_limit_exact_boundary_on_confirm
        grounds:
          - calculations.account_exposure
          - validations[priority=10]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
          - entities.WholesaleAccount.fields.available_credit_cents
        distinguishing_aspect: |
          Order A provisional exactly 1000 against a 1000c limit confirms (1000 <= 1000, inclusive
          at equality); order B provisional 250 against available 0 is rejected (250 > 0, strict
          above). Metric: money at the confirm endpoint, distinct from the freshness date metric.
        test_recipe:
          setup:
            - "Account limit 1000c. Order A priced to exactly 1000c and confirmed (available -> 0). Order B priced to 250c."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 1000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { orda_id: $.data.id }
            - call: "POST /orders/${orda_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 400 }
              as: SalesAgent
            - call: "POST /orders/${orda_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${orda_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ordb_id: $.data.id }
            - call: "POST /orders/${ordb_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
            - call: "POST /orders/${ordb_id}/price"
              payload: {}
              as: SalesAgent
            - call: "GET /wholesale-accounts/${acc_id}"
              payload: {}
              as: SalesAgent
              captures: { acc_v2: $.data.version }
          trigger:
            - call: "POST /orders/${ordb_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v2}" }
              as: SalesAgent
          assert:
            - "CustomerOrder.${orda_id}.fulfillment_status == CONFIRMED"
            - "WholesaleAccount.${acc_id}.available_credit_cents == 0"
            - "response error_id == ERR_CREDIT_LIMIT_EXCEEDED"

  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: price_requires_product_active
        grounds:
          - state_machines.CustomerOrder.DRAFT_to_PRICED
          - state_machines.Product.ACTIVE_to_DISCONTINUED
          - errors[ERR_PRODUCT_DISCONTINUED]
        distinguishing_aspect: |
          CustomerOrder DRAFT->PRICED is gated on the referenced Product.status==ACTIVE;
          discontinuing the product blocks pricing (ERR_PRODUCT_DISCONTINUED). Pair:
          CustomerOrder <-> Product.
        test_recipe:
          setup:
            - "Order with a Chamomile line; the product is then discontinued before pricing."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
            - call: "POST /products/${cham_id}/discontinue"
              payload: {}
              as: CatalogManager
          trigger:
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
          assert:
            - "response error_id == ERR_PRODUCT_DISCONTINUED"

      - name: confirm_requires_account_active
        grounds:
          - state_machines.CustomerOrder.PRICED_to_CONFIRMED
          - state_machines.WholesaleAccount.ACTIVE_to_SUSPENDED
          - errors[ERR_ACCOUNT_SUSPENDED]
        distinguishing_aspect: |
          CustomerOrder PRICED->CONFIRMED is gated on WholesaleAccount.status==ACTIVE; suspending
          the account (which bumps its version, so the current version is re-read) blocks confirm
          with ERR_ACCOUNT_SUSPENDED. Pair: CustomerOrder <-> WholesaleAccount (different pair).
        test_recipe:
          setup:
            - "Priced order; account suspended (version advances to 2); confirm carries the re-read version so OCC passes and the suspended-state check fires."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /wholesale-accounts/${acc_id}/suspend"
              payload: {}
              as: SalesAgent
            - call: "GET /wholesale-accounts/${acc_id}"
              payload: {}
              as: SalesAgent
              captures: { acc_v2: $.data.version }
          trigger:
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v2}" }
              as: SalesAgent
          assert:
            - "response error_id == ERR_ACCOUNT_SUSPENDED"

  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: production_line_window_overlap_half_open
        grounds:
          - entities.Batch.fields.scheduled_start
          - entities.Batch.fields.scheduled_end
          - errors[ERR_LINE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Batch windows are half-open [start,end): batch3 starting exactly at batch1's end
          (10:00) is accepted, but batch2 overlapping [09:00,11:00) is rejected
          (ERR_LINE_WINDOW_CONFLICT). Adjacency-allowed overlap semantics on ProductionLine.
        test_recipe:
          setup:
            - "One line with batch1 [08:00,10:00) and adjacent batch3 [10:00,12:00) both accepted; batch2 [09:00,11:00) overlaps batch1."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Almond Chai Blend", category: "TEA", kind: "BLEND", unit_price_cents_per_gram: 7.2, tare_default_grams: 5, allergen_tags: [] }
              as: CatalogManager
              captures: { chai_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "Line 1" }
              as: ProductionOperator
              captures: { line_id: $.data.id }
            - call: "POST /batches"
              payload: { blend_product_id: "${chai_id}", production_line_id: "${line_id}", target_output_grams: 100, scheduled_start: "2026-07-10T08:00:00Z", scheduled_end: "2026-07-10T10:00:00Z" }
              as: ProductionOperator
              captures: { batch1_id: $.data.id }
            - call: "POST /batches"
              payload: { blend_product_id: "${chai_id}", production_line_id: "${line_id}", target_output_grams: 100, scheduled_start: "2026-07-10T10:00:00Z", scheduled_end: "2026-07-10T12:00:00Z" }
              as: ProductionOperator
              captures: { batch3_id: $.data.id }
          trigger:
            - call: "POST /batches"
              payload: { blend_product_id: "${chai_id}", production_line_id: "${line_id}", target_output_grams: 100, scheduled_start: "2026-07-10T09:00:00Z", scheduled_end: "2026-07-10T11:00:00Z" }
              as: ProductionOperator
          assert:
            - "Batch.${batch3_id}.status == PLANNED"
            - "response error_id == ERR_LINE_WINDOW_CONFLICT"

      - name: labeling_station_cleaning_buffer
        grounds:
          - entities.TinRun.fields.scheduled_start
          - entities.TinRun.fields.scheduled_end
          - errors[ERR_STATION_BUFFER_CONFLICT]
        distinguishing_aspect: |
          Station runs require a 30-minute cleaning buffer between windows: run3 with a 30-min
          gap (run1 ends 09:00, run3 starts 09:30) is accepted, while run2 with a 15-min gap
          (starts 09:15) is rejected (ERR_STATION_BUFFER_CONFLICT). Buffer-gap semantics on a
          different resource (LabelingStation) than the adjacency-allowed line.
        test_recipe:
          setup:
            - "One station with run1 [08:00,09:00) and run3 [09:30,10:00) (30-min gap) both accepted; run2 [09:15,10:00) is within the 30-min buffer."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /labeling-stations"
              payload: { name: "Station A" }
              as: ProductionOperator
              captures: { station_id: $.data.id }
            - call: "POST /tin-runs"
              payload: { labeling_station_id: "${station_id}", product_ids: ["${cham_id}"], scheduled_start: "2026-07-10T08:00:00Z", scheduled_end: "2026-07-10T09:00:00Z" }
              as: ProductionOperator
              captures: { run1_id: $.data.id }
            - call: "POST /tin-runs"
              payload: { labeling_station_id: "${station_id}", product_ids: ["${cham_id}"], scheduled_start: "2026-07-10T09:30:00Z", scheduled_end: "2026-07-10T10:00:00Z" }
              as: ProductionOperator
              captures: { run3_id: $.data.id }
          trigger:
            - call: "POST /tin-runs"
              payload: { labeling_station_id: "${station_id}", product_ids: ["${cham_id}"], scheduled_start: "2026-07-10T09:15:00Z", scheduled_end: "2026-07-10T10:00:00Z" }
              as: ProductionOperator
          assert:
            - "TinRun.${run3_id}.labeling_station_id == ${station_id}"
            - "response error_id == ERR_STATION_BUFFER_CONFLICT"

  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: grams_conservation_pack_cancel
        grounds:
          - state_machines.CustomerOrder.CONFIRMED_to_PACKED
          - state_machines.CustomerOrder.PACKED_to_CANCELLED
          - entities.InventoryLot.fields.grams_on_hand
        distinguishing_aspect: |
          Named quantity (lot grams_on_hand + open-allocation grams) stays 500: pack draws 111
          (on_hand 389), cancel restores 111 (on_hand 500). Conserved quantity: physical grams.
        test_recipe:
          setup:
            - "Chamomile 500g lot; order confirmed, packed (net 111 drawn), then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${cham_id}", lot_code: "CH-1", grams_received: 500, received_at: "2026-06-01T00:00:00Z", best_by: "2026-12-01T00:00:00Z" }
              as: CatalogManager
              captures: { lot_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}", allergen_ack: false }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
              captures: { line_id: $.data.id }
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
            - call: "POST /orders/${ord_id}/pack"
              payload: { line_measurements: [ { line_id: "${line_id}", gross_grams: 121, tare_grams: 10 } ] }
              as: ProductionOperator
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: SalesAgent
          assert:
            - "InventoryLot.${lot_id}.grams_on_hand == 500"

      - name: credit_conservation_confirm_cancel
        grounds:
          - state_machines.CustomerOrder.PRICED_to_CONFIRMED
          - state_machines.CustomerOrder.CONFIRMED_to_CANCELLED
          - entities.WholesaleAccount.fields.committed_exposure_cents
          - entities.WholesaleAccount.fields.available_credit_cents
        distinguishing_aspect: |
          Named quantity (available_credit_cents + committed_exposure_cents) stays == credit_limit
          100000: confirm holds 250 (available 99750), cancel releases it (available 100000).
          Conserved quantity: money (credit), distinct from physical grams.
        test_recipe:
          setup:
            - "Account limit 100000; order confirmed (hold 250), then cancelled."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000, tier: "BRONZE" }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: SalesAgent
          assert:
            - "WholesaleAccount.${acc_id}.committed_exposure_cents == 0"
            - "WholesaleAccount.${acc_id}.available_credit_cents == 100000"
