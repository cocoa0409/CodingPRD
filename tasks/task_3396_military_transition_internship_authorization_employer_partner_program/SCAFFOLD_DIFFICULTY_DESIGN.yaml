            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "00000000-0000-0000-0000-000000000000", start_date: "2026-10-01", end_date: "2026-10-31", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}" }
          assert:
            - "rejected 404 ERR_OPENING_NOT_FOUND — body FK existence (priority 4) precedes the application-state check (priority 10), even though app is DENIED and would independently fail with ERR_APPLICATION_NOT_APPROVED"

  - rule_id: boundary_precision_check
    instances:
      - name: eligibility_window_inclusive_bounds
        grounds:
          - calculations.eligibility_window
          - validations[priority=13]
        distinguishing_aspect: |
          Metric: days-until-separation at application submission (endpoint
          POST /skillbridge/internship-applications). Both bounds inclusive:
          exactly 180 and exactly 30 days succeed; 181 and 29 fail.
        test_recipe:
          setup:
            - "Logical clock never touched: it reads the default 2026-09-01T00:00:00Z"
            - "Installation inst; four members whose separation dates land exactly on/outside the window bounds"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Max Bound", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-02-28", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m180: $.data.id, d180: $.data.days_until_separation } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Over Bound", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-03-01", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m181: $.data.id, d181: $.data.days_until_separation } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Min Bound", service_branch: "NAVY", pay_grade: "E6", separation_date: "2026-10-01", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m30: $.data.id, d30: $.data.days_until_separation } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Under Bound", service_branch: "NAVY", pay_grade: "E6", separation_date: "2026-09-30", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m29: $.data.id, d29: $.data.days_until_separation } }
          trigger:
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m180}" }, as: ServiceMember, as_user_id: "${m180}", captures: { app180: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m181}" }, as: ServiceMember, as_user_id: "${m181}" }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m30}" }, as: ServiceMember, as_user_id: "${m30}", captures: { app30: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m29}" }, as: ServiceMember, as_user_id: "${m29}" }
          assert:
            - "member m180: days_until_separation == 180 at the default clock — application ${app180} created (upper bound inclusive)"
            - "member m181: days_until_separation == 181 — rejected ERR_OUTSIDE_ELIGIBILITY_WINDOW (409)"
            - "member m30: days_until_separation == 30 — application ${app30} created (lower bound inclusive)"
            - "member m29: days_until_separation == 29 — rejected ERR_OUTSIDE_ELIGIBILITY_WINDOW (409)"

      - name: opening_capacity_exact_overlap_count
        grounds:
          - validations[priority=20]
          - entities.EmployerOpening.fields.filled_count
        distinguishing_aspect: |
          Different metric and endpoint from the eligibility-window instance:
          the opening's concurrency-occupancy counter on POST
          /skillbridge/internship-matches. With capacity 2 the second
          overlapping proposal succeeds (count 1 < 2), the third fails
          (count 2 == capacity is NOT below it), and a fourth proposal that
          shares only an endpoint boundary (start == prior end) succeeds.
        test_recipe:
          setup:
            - "Employer emp AUTHORIZED; opening op capacity 2 (REMOTE, [LOGISTICS])"
            - "Members mA, mB, mC, mD (all separation 2027-01-15) with APPROVED applications appA..appD"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { mA: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Ben Cole", service_branch: "NAVY", pay_grade: "E6", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { mB: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Cara Diaz", service_branch: "USMC", pay_grade: "E4", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { mC: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Dan Ely", service_branch: "AIR_FORCE", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { mD: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${mA}" }, as: ServiceMember, as_user_id: "${mA}", captures: { appA: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${mB}" }, as: ServiceMember, as_user_id: "${mB}", captures: { appB: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${mC}" }, as: ServiceMember, as_user_id: "${mC}", captures: { appC: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${mD}" }, as: ServiceMember, as_user_id: "${mD}", captures: { appD: $.data.id } }
            - { call: "POST /skillbridge/internship-applications/${appA}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/internship-applications/${appB}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/internship-applications/${appC}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/internship-applications/${appD}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 2 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
          trigger:
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appA}", employer_opening_id: "${op}", start_date: "2026-11-01", end_date: "2026-12-01", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mtA: $.data.id } }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { op_v2: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appB}", employer_opening_id: "${op}", start_date: "2026-11-01", end_date: "2026-12-01", expected_employer_opening_version: "${op_v2}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mtB: $.data.id } }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { op_v3: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appC}", employer_opening_id: "${op}", start_date: "2026-11-15", end_date: "2026-12-15", expected_employer_opening_version: "${op_v3}" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appD}", employer_opening_id: "${op}", start_date: "2026-12-01", end_date: "2026-12-31", expected_employer_opening_version: "${op_v3}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mtD: $.data.id } }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { filled_end: $.data.filled_count } }
          assert:
            - "matchA and matchB (both [2026-11-01, 2026-12-01)) succeed: overlap counts 0 then 1 are < capacity 2"
            - "matchC [2026-11-15, 2026-12-15) rejected ERR_OPENING_AT_CAPACITY (409): 2 overlapping non-terminal matches == capacity 2, and 2 < 2 is false"
            - "matchD [2026-12-01, 2026-12-31) succeeds: half-open intervals mean start 2026-12-01 touches A/B's end 2026-12-01 without overlapping (concurrent occupancy 0 < 2)"
            - "after the dust settles: EmployerOpening.${op}.filled_count == 3 (ledger counts all non-terminal matches A, B, D — deliberately distinct from the overlap-scoped capacity gate)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: match_creation_requires_approved_application
        grounds:
          - validations[priority=10]
          - state_machines.InternshipApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Entity pair InternshipMatch x InternshipApplication: the same match
          request fails while the application is SUBMITTED
          (ERR_APPLICATION_NOT_APPROVED) and succeeds unchanged after the
          commander approves — the match's creatable states are gated by the
          application's state.
        test_recipe:
          setup:
            - "Member m (separation 2027-01-15) with application app in SUBMITTED; employer emp AUTHORIZED with opening op (capacity 1, version 1)"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m}" }, as: ServiceMember, as_user_id: "${m}", captures: { app: $.data.id } }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 1 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
          trigger:
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2026-10-31", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-applications/${app}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2026-10-31", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt: $.data.id, mt_status: $.data.match_status } }
          assert:
            - "first attempt (app SUBMITTED): ERR_APPLICATION_NOT_APPROVED (409); opening version stays 1"
            - "after commander APPROVE, the byte-identical request succeeds: match ${mt} created with match_status == PROPOSED and plan_status == PLAN_DRAFT"

      - name: match_approval_requires_authorized_employer
        grounds:
          - state_machines.InternshipMatch.PROPOSED_to_INSTALLATION_APPROVED
          - validations[priority=9]
        distinguishing_aspect: |
          Different entity pair — InternshipMatch x Employer (the other
          instance uses Match x Application): an installation decision on a
          fully prepared proposal fails while the employer is SUSPENDED and
          succeeds after remediation re-authorizes it.
        test_recipe:
          setup:
            - "Match mt PROPOSED on opening op of employer emp (AUTHORIZED at proposal time); plan submitted and PLAN_APPROVED"
            - "Employer then suspended by a FAIL periodic review"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m}" }, as: ServiceMember, as_user_id: "${m}", captures: { app: $.data.id } }
            - { call: "POST /skillbridge/internship-applications/${app}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 1 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2026-10-31", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt: $.data.id } }
            - { call: "POST /skillbridge/internship-matches/${mt}/submit-plan", payload: { learning_objectives: [{ objective_code: "O1", description: "Safety basics", weight_hours: 10 }], supervisor_name: "S. Supervisor", weekly_hours: 40 }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches/${mt}/review-plan", payload: { outcome: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/employers/${emp}/periodic-review", payload: { outcome: "FAIL", notes: "documentation lapse" }, as: ProgramOffice }
          trigger:
            - { call: "POST /skillbridge/internship-matches/${mt}/installation-decision", payload: { decision: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/employers/${emp}/periodic-review", payload: { outcome: "PASS", notes: "remediated" }, as: ProgramOffice }
            - { call: "POST /skillbridge/internship-matches/${mt}/installation-decision", payload: { decision: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1", captures: { mt_status: $.data.match_status } }
          assert:
            - "decision while employer SUSPENDED: ERR_EMPLOYER_NOT_AUTHORIZED (409); match stays PROPOSED"
            - "after PASS review (SUSPENDED -> AUTHORIZED), the identical decision succeeds: match_status == INSTALLATION_APPROVED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: member_schedule_half_open_adjacency
        grounds:
          - validations[priority=19]
        distinguishing_aspect: |
          Interval semantics: half-open pairwise exclusion on the ServiceMember
          resource — a proposal starting exactly when the existing match ends
          (start == prior end) is legal adjacency, while a proposal intersecting
          the interior is rejected ERR_MEMBER_SCHEDULE_OVERLAP.
        test_recipe:
          setup:
            - "Member m (separation 2027-01-15) with APPROVED application app; employer emp AUTHORIZED with opening op capacity 3 (version 2 after match1)"
            - "match1 [2026-11-01, 2026-12-01) PROPOSED for member m"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m}" }, as: ServiceMember, as_user_id: "${m}", captures: { app: $.data.id } }
            - { call: "POST /skillbridge/internship-applications/${app}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 3 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "${op}", start_date: "2026-11-01", end_date: "2026-12-01", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt1: $.data.id } }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { op_v2: $.data.version } }
          trigger:
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "${op}", start_date: "2026-11-15", end_date: "2026-12-15", expected_employer_opening_version: "${op_v2}" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "${op}", start_date: "2026-12-01", end_date: "2026-12-31", expected_employer_opening_version: "${op_v2}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt2: $.data.id } }
            - { call: "GET /skillbridge/service-members/${m}", as: ProgramOffice, captures: { amc: $.data.active_match_count } }
          assert:
            - "interior overlap [2026-11-15, 2026-12-15) vs [2026-11-01, 2026-12-01): ERR_MEMBER_SCHEDULE_OVERLAP (409)"
            - "adjacent [2026-12-01, 2026-12-31) (start == match1 end): accepted — half-open [start, end) intervals share no instant; match ${mt2} created PROPOSED"
            - "ServiceMember.${m}.active_match_count == 2 (only the two non-terminal matches)"

      - name: opening_concurrency_threshold_allows_back_to_back
        grounds:
          - validations[priority=20]
        distinguishing_aspect: |
          Different interval semantics on a different resource: the
          EmployerOpening uses an aggregate concurrency threshold (capacity 1
          allows any number of sequential, non-overlapping occupants), so
          back-to-back [2026-11-01, 2026-12-01) then [2026-12-01, 2027-01-01)
          both fit while a mid-window overlap is rejected — pairwise-exclusion
          would have rejected the third proposal regardless of capacity.
        test_recipe:
