# =============================================================================
# Task 1666 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 24 instances, all non-stub. Every chain replays against SCAFFOLD.yaml §1.5.
# Logical clock default 2026-08-01T00:00:00Z (a Saturday). 2026-08-03 = Monday.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: acuity_intake_static_vs_rolling_outcome_blend
        grounds:
          - calculations.participant_acuity_score
          - state_machines.Participant.APPLICANT_to_UNDER_REVIEW
          - entities.Participant.fields.rolling_acuity_score
        distinguishing_aspect: |
          Participant-domain dual variant: the intake variant is a static weighted sum of intake
          answers (55, MODERATE), while the rolling variant blends 70% intake with 30% trailing-30-day
          outcome signals and yields 68.5 (HIGH) for the SAME participant — different value AND
          different tier, and the rolling variant lives on a different signal set than the
          volunteer-domain variant in reliability_windowed_vs_streak_adjusted_diverge.
        test_recipe:
          setup:
            - "Program cap 20; participant enrolled with intake acuity 55 MODERATE"
            - "7 logged calls producing signals: 3 REACHED_CONCERN, 4 NO_ANSWER (escalation auto-opens at streak 3)"
            - "daily-closeout run at 2026-08-10 recomputes rolling acuity"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 20, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Mod A", date_of_birth: "1946-03-12", phone: "555-0101", address: "1 Oak St", referral_source: "SELF", age_band: "AGE_75_84", lives_alone: true, mobility: "LIMITED", cognitive_concern: false, chronic_conditions_count: 2, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "Kin A", phone: "555-0199", relationship: "daughter", contact_rank: "PRIMARY", accepts_24h: true }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "TUE", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "WED", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "THU", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol A", phone: "555-0200" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/begin-training", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "SAFETY_PROTOCOL", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "LISTENING_SKILLS", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "MANDATED_REPORTING", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-08-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/volunteers/${v_id}/certify", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "TUE", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
