            - call: "POST /matters/${m_id}/suspension"
              payload: { suspended: false }
              as: EngagementManager
              captures: { m_status_after: $.data.status }
          assert:
            - "after the first trigger call: Matter.${m_id}.status == SUSPENDED and Matter.${m_id}.suspension_reason == \"client instruction to pause review\""
            - "after the first trigger call: SecureEnvironmentSession.${sesa_id}.status == REVOKED with closed_at stamped"
            - "after the first trigger call: Assignment.${a1_id}.status == ASSIGNED — suspension voids nothing"
            - "after the second trigger call: Matter.${m_id}.status == IN_REVIEW and Matter.${m_id}.suspension_reason == null"
            - "after the second trigger call: SecureEnvironmentSession.${sesa_id}.status is still REVOKED — resumption does not restore it"
            - "Matter.${m_id}.staffed_reviewer_count == 1 throughout; committed_spend_cents == 85200 throughout"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: qc_failure_to_strike_to_removal_to_void_sweep
        grounds:
          - state_machines.QCSample.PENDING_to_FAILED
          - state_machines.Batch.QC_SAMPLING_to_QC_FAILED
          - state_machines.Reviewer.ENGAGED_to_REMOVED
          - calculations.reviewer_scorecard_strikes
          - state_machines.Assignment.ASSIGNED_to_VOIDED
        distinguishing_aspect: "Depth-4 chain rooted in QUALITY: sample FAILED -> batch QC_FAILED -> strike total reaches the removal threshold -> the removed reviewer's unrelated assignment is swept and its commitment reversed. Link 3 is caused by link 2's strike append, not by the validate request."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW matter; Reviewer A already carries 1 PACE_SHORTFALL strike because Batch 1's 400 documents took 600 minutes (pace 40.00 < 55)"
            - "Batch 1 is QC_SAMPLING with Assignment a1 SUBMITTED and billed 85200"
            - "Batch 2 (200 documents) is ASSIGNED to Reviewer A with Assignment a2 in ASSIGNED and a COMMITMENT of 42600"
            - "a PENDING QCSample of 40 documents exists on Batch 1, validated by Reviewer C who holds no assignment there"
            - "Matter.committed_spend_cents == 127800 (85200 actual + 42600 commitment)"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_sess_a
            - *k_sess_a_active
            - *k_batch1
            - *k_assign_a1
            - *k_start_a1
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 400, minutes_logged: 600, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - *k_submit_a1
            - *k_rev_c
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 200, priority_rank: 5 }
              as: EngagementManager
              captures: { b2_id: $.data.id, b2_v: $.data.version }
            - call: "POST /batches/${b2_id}/assignments"
              payload: { expected_batch_version: "${b2_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { a2_id: $.data.id }
            - call: "POST /batches/${b1_id}/qc-samples"
              payload: { validated_by_reviewer_id: "${rc_id}" }
              as: QCLead
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /qc-samples/${s1_id}/validate"
              payload: { coding_error_count: 2, privilege_error_count: 1 }
              as: QCLead
          assert:
            - "LINK 1 — QCSample.${s1_id}.outcome == FAILED and discrepancy_rate == 0.0750 (3 errors / 40 sampled, threshold 0.05 inclusive)"
            - "LINK 2 — Batch.${b1_id}.status == QC_FAILED"
            - "LINK 2 — GET /reviewers/${ra_id}/scorecard-events returns 4 rows in created_at ASC order: PACE_SHORTFALL(+1), QC_FAILURE(+1), PRIVILEGE_MISS(+1), REMOVAL(0)"
            - "LINK 3 — Reviewer.${ra_id}.scorecard_strikes == 3 and engagement_status == REMOVED with removed_at stamped"
            - "LINK 4 — Assignment.${a1_id}.status == VOIDED with void_reason REVIEWER_REMOVED and billable_amount_cents still 85200 (a billed assignment is not reversed)"
            - "LINK 4 — Assignment.${a2_id}.status == VOIDED with void_reason REVIEWER_REMOVED, voided after a1 in created_at ASC order"
            - "LINK 4 — GET /matters/${m_id}/budget-ledger ends with a REVERSAL of -42600 for a2 and no reversal row for a1"
            - "LINK 4 — Matter.${m_id}.committed_spend_cents == 85200"
            - "LINK 4 — Batch.${b2_id}.status == CREATED while Batch.${b1_id} stays QC_FAILED"
            - "LINK 4 — Matter.${m_id}.staffed_reviewer_count == 0 and status == STAFFING"
            - "Reviewer.${ra_id}.accuracy_score == 0.9250 — above the 0.9000 floor, so removal was driven by strikes alone"

      - name: blocked_rescreening_to_agreement_to_session_to_void
        grounds:
          - state_machines.ConflictsScreening.CLEARED_to_BLOCKED
          - state_machines.ConfidentialityAgreement.EXECUTED_to_REVOKED
          - state_machines.SecureEnvironmentSession.ACTIVE_to_REVOKED
          - state_machines.Reviewer.ENGAGED_to_SOURCED
        distinguishing_aspect: "Depth-4 chain rooted in CONFLICTS rather than quality, and it terminates in a reviewer DEMOTION to SOURCED rather than removal: screening BLOCKED -> agreement REVOKED -> session REVOKED and staffing recomputed -> assignment VOIDED with its commitment reversed."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW matter with Reviewer A CLEARED, EXECUTED, holding an ACTIVE ONSITE_SECURE session"
            - "Batch 1 (400 documents) is ASSIGNED to Reviewer A with an outstanding COMMITMENT of 85200 and Assignment a1 in ASSIGNED"
            - "no assignment has been submitted, so nothing is billed yet"
