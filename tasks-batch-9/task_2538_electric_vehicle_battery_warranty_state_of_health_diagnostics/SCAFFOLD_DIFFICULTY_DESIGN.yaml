      - name: reman_pack_refurb_soh_exactly_at_minimum_is_selectable_on_adjudicate
        metric: "refurb_soh_pct, a stock-pack health percentage carried to 2 decimals"
        endpoint: "POST /battery-warranty/warranty-claims/{claim_id}/adjudicate"
        grounds:
          - calculations.reman_pack_selection
          - validations[priority=68]
          - entities.BatteryPack.fields.refurb_soh_pct
          - entities.WarrantyProgram.fields.reman_min_soh_pct
          - entities.WarrantyProgram.fields.reman_available_count
        distinguishing_aspect: |
          A different metric on a different endpoint: the selector's eligibility floor is
          reman_min_soh_pct 85.00 with an INCLUSIVE >= comparison, so a lone stock pack at 84.99 leaves
          the pool empty and the adjudication fails with ERR_NO_REMAN_PACK_AVAILABLE, while adding a
          pack at exactly 85.00 makes the very same adjudication succeed and reserve it.
        test_recipe:
          setup:
            - "Program on the reference price book with reman_min_soh_pct 85.00 and allow_new_pack_substitution false."
            - "An L3 center with a pack lift; a vehicle in service 2020-03-10 whose assessment gives retention 70.00 % with FIVE faulted modules (1, 2, 3, 4, 5), so F = 5 exceeds MIN(allowance 3, module_cap 4) and remedy_decision returns PACK_REPLACEMENT / MODULE_ALLOWANCE."
            - "Exactly one candidate stock pack initially exists: REMANUFACTURED, US-WEST, 16 modules, 80.000 kWh, refurb_soh_pct 84.99 - one hundredth of a point below the floor."
