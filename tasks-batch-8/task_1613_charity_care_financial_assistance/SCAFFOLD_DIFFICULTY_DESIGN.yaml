            - call: "POST /charity-care/accounts/${acc}/evaluate-posture"
              payload: {}
              as: CollectionsAgent
            - call: "POST /charity-care/accounts/${acc}/collection-actions"
              payload: { action_type: "CREDIT_REPORT" }
              as: CollectionsAgent
              captures: { ca: $.data.id }
          assert:
            - "before evaluate-posture: error_id == ERR_ACCOUNT_NOT_ECA_ELIGIBLE (posture NOTICE_PERIOD)"
            - "after evaluate-posture: PatientAccount.${acc}.collection_posture == ECA_ELIGIBLE and creation succeeds"
            - "CollectionAction.${ca}.status == INITIATED and PatientAccount.${acc}.collection_posture == ECA_ACTIVE (bubble from action creation)"

  # =================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bank_statement_closed_interval_overlap_rejected
        grounds:
          - validations[priority=11]
          - entities.VerificationDocument.fields.period_start
          - entities.VerificationDocument.fields.period_end
          - errors[ERR_DOC_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource = (household_member_id, doc_type=BANK_STATEMENT); semantics = CLOSED intervals — touching
          endpoints count as overlap. VERIFIED statement 2026-01-01..2026-01-31 blocks a new statement starting
          2026-01-31 (shared single day) as well as a fully nested one; a statement starting 2026-02-01 passes.
        test_recipe:
          setup:
            - "ACTIVE policy FAP-2026; STANDARD application UNDER_REVIEW; member M; VERIFIED BANK_STATEMENT D1 2026-01-01..2026-01-31; two SUBMITTED statements: D2 2026-01-31..2026-02-28 (touching) and D3 2026-02-01..2026-02-28 (adjacent, disjoint under closed semantics)"
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2026", fpl_base_cents: 1500000, fpl_increment_cents: 500000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /charity-care/policies/${pol_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/patients"
              payload: { full_name: "Overlap Olive", date_of_birth: "1984-06-06", ssn_last4: "1616", mrn: "MRN-OVL-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 2000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "Overlap Olive", relationship: "SELF", age: 41 }
              as: FinancialCounselor
              captures: { mem: $.data.id }
            - call: "POST /charity-care/applications/${app}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/begin-review"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "BANK_STATEMENT", period_start: "2026-01-01", period_end: "2026-01-31", amount_cents: 100000, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d1: $.data.id }
            - call: "POST /charity-care/documents/${d1}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "BANK_STATEMENT", period_start: "2026-01-31", period_end: "2026-02-28", amount_cents: 110000, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d2: $.data.id }
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "BANK_STATEMENT", period_start: "2026-02-01", period_end: "2026-02-28", amount_cents: 120000, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d3: $.data.id }
          trigger:
            - call: "POST /charity-care/documents/${d2}/verify"
              payload: {}
              as: FinancialCounselor
              captures: { err_touch: $.data.error_id }
            - call: "POST /charity-care/documents/${d3}/verify"
              payload: {}
              as: FinancialCounselor
          assert:
            - "D2 (touching at 2026-01-31): error_id == ERR_DOC_PERIOD_OVERLAP — closed-interval semantics count a shared single day as overlap"
            - "D3 (first day after D1 ends): verify succeeds, status VERIFIED"
            - "AssistanceApplication.${app}.verified_liquid_assets_cents == 220000 (D1 100000 + D3 120000; D2 excluded)"

      - name: policy_window_half_open_overlap_adjacency_allowed
        grounds:
          - validations[priority=10]
          - entities.FinancialAssistancePolicy.fields.effective_from
          - entities.FinancialAssistancePolicy.fields.effective_to
          - errors[ERR_POLICY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = policy effective window; semantics = HALF-OPEN [from, to) — a successor policy whose
          effective_from equals the incumbent's effective_to is ADJACENT and allowed, while one day earlier
          (intersecting interior) is rejected. Different resource entity and different adjacency treatment
