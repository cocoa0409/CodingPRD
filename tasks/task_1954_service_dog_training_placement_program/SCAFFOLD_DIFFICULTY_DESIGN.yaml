            - { call: "POST /api/public-access-tests/${pat_id}/score", payload: { exercise_scores: [ { exercise_code: C1, raw_score: 3 }, { exercise_code: C2, raw_score: 3 }, { exercise_code: C3, raw_score: 3 }, { exercise_code: C4, raw_score: 3 }, { exercise_code: C5, raw_score: 3 }, { exercise_code: C6, raw_score: 3 }, { exercise_code: P1, raw_score: 3 }, { exercise_code: P2, raw_score: 3 }, { exercise_code: P3, raw_score: 3 }, { exercise_code: P4, raw_score: 3 }, { exercise_code: S1, raw_score: 3 }, { exercise_code: S2, raw_score: 3 } ] }, as: Evaluator, as_user_id: "${e_id}" }
