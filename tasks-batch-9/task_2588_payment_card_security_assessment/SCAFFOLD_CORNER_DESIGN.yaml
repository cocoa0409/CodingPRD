        excluded_because:
          difficulty_instance: segmentation_failure_five_link_scope_cascade
          rationale: "The five-link cascade instance verifies the whole chain end-to-end (segment FAILED, descendant reclassification, component scope_class moves, plan STALE, posture RESTRICTED) with literal counters at each link."

      - name: state_machine_conclusion_guarded_by_the_sampling_plan_of_another_entity
