scenario: "805. Head Start & Pre-K Enrollment (federal program): eligibility (income/categorical/homeless) & priority points, waitlist & selection ranking, slot allocation & age cohort, attendance/ADA tracking, health & immunization compliance, family-engagement home visits, kindergarten transition, PIR reporting"
domain_name: head-start-prek-enrollment
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  # Application/Offer/Enrollment are flat peers linked by FKs; Enrollment owns a
  # sub-resource tree of attendance/health/home-visit/transition children.
  state_machine_shape: branching
  # Application has a WAITLISTED<->OFFERED cycle; Enrollment carries two parallel
  # state dimensions (status x health_compliance_status); AgeCohort is compound
  # (selection_status derived from filled/reserved slot accounting).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Grantee program / center name"
      - name: program_type
        type: enum
        source: input
        description: "Funding stream"
        constraints: "one of HEAD_START, PRE_K, EARLY_HEAD_START"
      - name: funded_enrollment
        type: integer
        source: input
        description: "Total federally funded enrollment slots across the program"
        constraints: ">= 0"
      - name: age_cutoff_date
        type: string
        source: input
        description: "Program-year age determination date (YYYY-MM-DD); child age in months is computed as of this date"
      - name: total_instructional_days
        type: integer
        source: input
        description: "Number of funded instructional days in the program year; denominator for the annualized ADA variant"
        constraints: "> 0"
      - name: ada_chronic_threshold_pct
        type: number
        source: input
        default: 0.10
        description: "Unexcused-absence fraction at or above which an enrollment is flagged chronically absent (inclusive >=)"

  - name: AgeCohort
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: age_band
        type: enum
        source: input
        description: "Cohort age band"
        constraints: "one of INFANT, TODDLER, PRESCHOOL_3, PRESCHOOL_4"
      - name: funded_slots
        type: integer
        source: input
        description: "Funded slot capacity for this cohort"
        constraints: ">= 0"
      - name: min_age_months
        type: integer
        source: input
        description: "Inclusive lower bound of child age in months admitted to this cohort"
      - name: max_age_months
        type: integer
        source: input
        description: "Inclusive upper bound of child age in months admitted to this cohort"
      - name: session_start
        type: string
        source: input
        description: "Daily instructional session start time of day (HH:MM, 24h)"
      - name: session_end
        type: string
        source: input
        description: "Daily instructional session end time of day (HH:MM, 24h); session interval is [session_start, session_end)"
      - name: filled_slots
        type: integer
        source: computed
        description: "COUNT(Enrollment WHERE cohort_id==this.id AND status==ACTIVE)"
      - name: reserved_slots
        type: integer
        source: computed
        description: "COUNT(Offer WHERE cohort_id==this.id AND status==PENDING)"
      - name: available_slots
        type: integer
        source: computed
        description: "funded_slots - filled_slots - reserved_slots (never negative by construction)"
      - name: selection_status
        type: enum
        source: computed
        description: "OPEN when available_slots > 0 else FULL"
        constraints: "one of OPEN, FULL"

  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: guardian_name
        type: string
        source: input
        description: "Primary guardian name"
      - name: household_size
        type: integer
        source: input
        description: "Number of persons in the household; drives the FPL threshold"
        constraints: ">= 1"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Self-declared gross annual household income in cents"
        constraints: ">= 0"
      - name: categorical_eligibility
        type: enum
        source: input
        description: "Categorical program enrollment that confers eligibility independent of income"
        constraints: "one of NONE, TANF, SSI, SNAP, FOSTER"
      - name: homeless_status
        type: boolean
        source: input
        default: false
        description: "McKinney-Vento homeless determination; confers categorical eligibility and top priority weight"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: cohort_id
        type: string
        source: input
        description: "FK -> AgeCohort.id; the age cohort the child is applying to"
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; household economic data used for eligibility"
      - name: child_first_name
        type: string
        source: input
        description: "Applicant child first name"
      - name: child_last_name
        type: string
        source: input
        description: "Applicant child last name"
      - name: child_dob
        type: string
        source: input
        description: "Child date of birth (YYYY-MM-DD)"
      - name: child_has_iep
        type: boolean
        source: input
        default: false
        description: "Child has an active IEP/IFSP (disability); contributes disability priority points"
      - name: verified_income_cents
        type: integer
        source: system
        description: "Income confirmed at eligibility verification; null until verify-eligibility is called"
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state"
        constraints: "one of DRAFT, SUBMITTED, ELIGIBLE, INELIGIBLE, WAITLISTED, OFFERED, ENROLLED, WITHDRAWN"
      - name: eligibility_category
        type: enum
        source: computed
        description: "Basis of eligibility; precedence HOMELESS > CATEGORICAL > INCOME > OVER_INCOME"
        constraints: "one of HOMELESS, CATEGORICAL, INCOME, OVER_INCOME"
      - name: income_ratio
        type: number
        source: computed
        description: "annual_income_cents (or verified_income_cents once verified) / FPL_for_household, rounded to 4 decimals"
      - name: age_months_at_cutoff
        type: integer
        source: computed
        description: "Child age in whole months as of the program age_cutoff_date"
      - name: priority_points
        type: integer
        source: computed
        description: "Selection priority score (see calculations.priority_points); provisional at submit, recomputed verified at verify-eligibility"
      - name: submitted_at
        type: datetime
        source: system
        description: "Clock timestamp when the application was submitted; primary waitlist tie-break key"
      - name: waitlisted_at
        type: datetime
        source: system
        description: "Clock timestamp when the application entered the waitlist"

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> Application.id"
      - name: cohort_id
        type: string
        source: system
        description: "FK -> AgeCohort.id; the cohort whose slot is reserved for this offer"
      - name: status
        type: enum
        source: system
        description: "Offer lifecycle state"
        constraints: "one of PENDING, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN"
      - name: offered_at
        type: datetime
        source: system
        description: "Clock timestamp when the offer was generated by a selection run"
      - name: offer_expires_at
        type: datetime
        source: system
        description: "offered_at + OFFER_WINDOW_DAYS; an unaccepted offer is expirable at or after this instant"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> Application.id"
      - name: cohort_id
        type: string
        source: system
        description: "FK -> AgeCohort.id; the cohort whose slot this enrollment occupies"
      - name: status
        type: enum
        source: system
        description: "Enrollment lifecycle dimension (independent of health_compliance_status)"
        constraints: "one of ACTIVE, COMPLETED_TRANSITION, WITHDRAWN, DISENROLLED"
      - name: health_compliance_status
        type: enum
        source: system
        description: "Health/immunization compliance dimension, evolving independently of status"
        constraints: "one of PENDING, COMPLIANT, NON_COMPLIANT, EXEMPT"
      - name: enrolled_at
        type: datetime
        source: system
        description: "Clock timestamp when the offer was accepted and the enrollment created"
      - name: ada_rate
        type: number
        source: computed
        description: "Period-to-date ADA variant: present_days / instructional_days_elapsed, rounded to 4 decimals"
      - name: annualized_ada_rate
        type: number
        source: computed
        description: "Annualized ADA variant: present_days / program.total_instructional_days, rounded to 4 decimals"
      - name: unexcused_absence_rate
        type: number
        source: computed
        description: "COUNT(ABSENT_UNEXCUSED) / instructional_days_elapsed, rounded to 4 decimals"
      - name: chronic_absence
        type: boolean
        source: computed
        description: "True when unexcused_absence_rate >= program.ada_chronic_threshold_pct"

  - name: AttendanceRecord
    parent: null
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: attendance_date
        type: string
        source: input
        description: "Calendar date the attendance is recorded for (YYYY-MM-DD)"
      - name: status
        type: enum
        source: input
        description: "Attendance disposition"
        constraints: "one of PRESENT, ABSENT_EXCUSED, ABSENT_UNEXCUSED"
      - name: instructional_day
        type: boolean
        source: input
        default: true
        description: "Whether attendance_date is an instructional day; only instructional days enter ADA denominators"

  - name: HealthScreening
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: screening_type
        type: enum
        source: input
        description: "Type of required health screening"
        constraints: "one of IMMUNIZATION, PHYSICAL, DENTAL"
      - name: status
        type: enum
        source: system
        description: "Screening compliance state"
        constraints: "one of DUE, UP_TO_DATE, OVERDUE, EXEMPT"
      - name: due_date
        type: string
        source: input
        description: "Date the screening is due (YYYY-MM-DD)"
      - name: completed_date
        type: string
        source: system
        description: "Date the screening was completed; null until marked UP_TO_DATE"

  - name: HomeVisit
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: scheduled_date
        type: string
        source: input
        description: "Date of the home visit (YYYY-MM-DD)"
      - name: window_start
        type: string
        source: input
        description: "Visit window start time of day (HH:MM, 24h)"
      - name: window_end
        type: string
        source: input
        description: "Visit window end time of day (HH:MM, 24h); visit interval on scheduled_date is [window_start, window_end)"
      - name: visit_number
        type: integer
        source: computed
        description: "1-based ordinal among this enrollment's home visits ordered by scheduled_date then window_start then created_at"
      - name: status
        type: enum
        source: system
        description: "Home visit lifecycle state"
        constraints: "one of SCHEDULED, COMPLETED, MISSED, CANCELLED"

  - name: TransitionPlan
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: target_school
        type: string
        source: input
        description: "Receiving kindergarten / elementary school name"
      - name: transition_date
        type: string
        source: input
        description: "Planned kindergarten transition date (YYYY-MM-DD)"
      - name: status
        type: enum
        source: system
        description: "Transition plan lifecycle state"
        constraints: "one of DRAFT, COMPLETED, CANCELLED"

  - name: PIRReport
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id"
      - name: reporting_period
        type: string
        source: input
        description: "PIR reporting period label (e.g. 2025-2026)"
      - name: total_enrolled
        type: integer
        source: computed
        description: "COUNT(Enrollment WHERE cohort in program AND status in {ACTIVE, COMPLETED_TRANSITION}) at report creation"
      - name: income_eligible_count
        type: integer
        source: computed
        description: "Enrolled children whose Application.eligibility_category == INCOME"
      - name: categorical_count
        type: integer
        source: computed
        description: "Enrolled children whose Application.eligibility_category == CATEGORICAL"
      - name: homeless_count
        type: integer
        source: computed
        description: "Enrolled children whose Application.eligibility_category == HOMELESS"
      - name: immunization_compliant_count
        type: integer
        source: computed
        description: "Enrolled children whose Enrollment.health_compliance_status == COMPLIANT"
      - name: avg_ada_rate
        type: number
        source: computed
        description: "Mean of per-enrollment ada_rate (each already rounded to 4dp) over enrolled children, rounded to 4dp"
      - name: status
        type: enum
        source: system
        description: "Report state"
        constraints: "one of DRAFT, SUBMITTED"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [INELIGIBLE, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: EnrollmentSpecialist
        preconditions:
          - "status == DRAFT"
          - "no other non-terminal Application exists for same family_id + child_dob in same program_id (else ERR_DUPLICATE_APPLICATION)"
          - "age_months_at_cutoff within [cohort.min_age_months, cohort.max_age_months] (else ERR_AGE_OUT_OF_BAND)"
        side_effects:
          - "compute age_months_at_cutoff from child_dob and program.age_cutoff_date"
          - "compute income_ratio and eligibility_category (calculations.income_eligibility)"
          - "compute priority_points using the provisional variant (calculations.priority_points)"
          - "set submitted_at = current clock"
      - from: SUBMITTED
        to: ELIGIBLE
        trigger: "POST /applications/{id}/verify-eligibility"
        actor: EnrollmentSpecialist
        preconditions:
          - "status == SUBMITTED"
          - "resulting eligibility_category != OVER_INCOME"
        side_effects:
          - "set verified_income_cents from request"
          - "recompute income_ratio and eligibility_category from verified_income_cents"
          - "recompute priority_points using the verified variant (calculations.priority_points)"
      - from: SUBMITTED
        to: INELIGIBLE
        trigger: "POST /applications/{id}/verify-eligibility"
        actor: EnrollmentSpecialist
        preconditions:
          - "status == SUBMITTED"
          - "recomputed eligibility_category == OVER_INCOME (income over 100% FPL and no categorical/homeless basis)"
        side_effects:
          - "set verified_income_cents from request"
          - "recompute income_ratio and eligibility_category"
        note: "terminal"
      - from: ELIGIBLE
        to: WAITLISTED
        trigger: "POST /applications/{id}/waitlist"
        actor: EnrollmentSpecialist
        preconditions:
          - "status == ELIGIBLE"
        side_effects:
          - "set waitlisted_at = current clock"
      - from: WAITLISTED
        to: OFFERED
        trigger: "POST /cohorts/{id}/run-selection (system-selected)"
        actor: system
        preconditions:
          - "status == WAITLISTED"
          - "cohort.selection_status == OPEN (cross-entity: AgeCohort.available_slots > 0)"
          - "application ranks within the top available_slots of the eligible waitlist pool"
        side_effects:
          - "create an Offer (status PENDING) for this application; set offered_at = clock, offer_expires_at = clock + OFFER_WINDOW_DAYS"
          - "cohort reserved_slots recomputed (+1); AgeCohort.version increments by 1"
      - from: OFFERED
        to: ENROLLED
        trigger: "POST /offers/{id}/accept"
        actor: Family
        preconditions:
          - "status == OFFERED and the offer is PENDING and not expired"
        side_effects:
          - "Offer -> ACCEPTED"
          - "create Enrollment (status ACTIVE, health_compliance_status PENDING); set enrolled_at = clock"
          - "cohort filled_slots recomputed (+1), reserved_slots recomputed (-1); AgeCohort.version increments by 1"
      - from: OFFERED
        to: WAITLISTED
        trigger: "POST /offers/{id}/decline"
        actor: Family
        preconditions:
          - "status == OFFERED and offer is PENDING"
        side_effects:
          - "Offer -> DECLINED"
          - "cohort reserved_slots recomputed (-1); AgeCohort.version increments by 1"
        note: "cycle: application returns to the waitlist pool"
      - from: OFFERED
        to: WAITLISTED
        trigger: "POST /offers/{id}/expire"
        actor: ProgramAdmin
        preconditions:
          - "status == OFFERED and offer is PENDING and current clock >= offer.offer_expires_at"
        side_effects:
          - "Offer -> EXPIRED"
          - "cohort reserved_slots recomputed (-1); AgeCohort.version increments by 1"
        note: "cycle: expiry returns the application to the waitlist"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Family
        preconditions: ["status not in terminal set"]
        side_effects: ["any PENDING offer for this application -> WITHDRAWN; cohort reserved_slots recomputed if changed"]
      - from: ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Family
        preconditions: ["status not in terminal set"]
        side_effects: []
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Family
        preconditions: ["status not in terminal set"]
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Family
        preconditions: ["status not in terminal set"]
        side_effects: ["PENDING offer -> WITHDRAWN; cohort reserved_slots recomputed (-1); AgeCohort.version increments by 1"]

  - entity: Offer
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /offers/{id}/accept"
        actor: Family
        preconditions:
          - "status == PENDING"
          - "current clock < offer_expires_at (else ERR_OFFER_EXPIRED)"
          - "expected_cohort_version matches AgeCohort.version (OCC, else ERR_STALE_VERSION)"
        side_effects: ["creates Enrollment; drives Application OFFERED -> ENROLLED"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /offers/{id}/decline"
        actor: Family
        preconditions: ["status == PENDING"]
        side_effects: ["drives Application OFFERED -> WAITLISTED"]
      - from: PENDING
        to: EXPIRED
        trigger: "POST /offers/{id}/expire"
        actor: ProgramAdmin
        preconditions: ["status == PENDING", "current clock >= offer_expires_at"]
        side_effects: ["drives Application OFFERED -> WAITLISTED"]

  - entity: AgeCohort
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: recompute on Enrollment create or Offer PENDING creation"
        actor: system
        preconditions: ["available_slots (funded_slots - filled_slots - reserved_slots) reaches 0"]
        side_effects: ["selection_status derived to FULL; blocks further WAITLISTED -> OFFERED selection"]
        note: "compound/derived: selection_status is a pure function of slot accounting"
      - from: FULL
        to: OPEN
        trigger: "system: recompute on Enrollment withdraw/disenroll or Offer decline/expire/withdraw"
        actor: system
        preconditions: ["available_slots rises above 0"]
        side_effects: ["selection_status derived to OPEN"]

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [COMPLETED_TRANSITION, WITHDRAWN, DISENROLLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED_TRANSITION
        trigger: "POST /transition-plans/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "status == ACTIVE"
          - "health_compliance_status == COMPLIANT (cross-entity: TransitionPlan completion depends on Enrollment health dimension)"
          - "enrollment has >= 2 HomeVisit records with status COMPLETED"
        side_effects:
          - "TransitionPlan -> COMPLETED"
          - "Enrollment status -> COMPLETED_TRANSITION"
          - "cohort filled_slots recomputed (-1); AgeCohort.version increments by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Family
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "Application (via application_id) -> WITHDRAWN"
          - "cohort filled_slots recomputed (-1); AgeCohort.version increments by 1"
      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /enrollments/{id}/disenroll"
        actor: ProgramAdmin
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "cohort filled_slots recomputed (-1); AgeCohort.version increments by 1"

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: COMPLIANT
        trigger: "PATCH /health-screenings/{id} (all required screenings UP_TO_DATE)"
        actor: FamilyServicesWorker
        preconditions: ["every HealthScreening for the enrollment has status in {UP_TO_DATE, EXEMPT} and at least one IMMUNIZATION exists"]
        side_effects: ["Enrollment.health_compliance_status -> COMPLIANT"]
        note: "health_compliance_status is the parallel dimension; independent of the status machine above"
      - from: PENDING
        to: NON_COMPLIANT
        trigger: "PATCH /health-screenings/{id} (immunization marked OVERDUE)"
        actor: FamilyServicesWorker
        preconditions: ["an IMMUNIZATION screening for the enrollment has status OVERDUE"]
        side_effects: ["Enrollment.health_compliance_status -> NON_COMPLIANT"]
      - from: COMPLIANT
        to: NON_COMPLIANT
        trigger: "PATCH /health-screenings/{id} (immunization lapses to OVERDUE)"
        actor: FamilyServicesWorker
        preconditions: ["an IMMUNIZATION screening flips to OVERDUE"]
        side_effects: ["Enrollment.health_compliance_status -> NON_COMPLIANT"]
      - from: NON_COMPLIANT
        to: COMPLIANT
        trigger: "PATCH /health-screenings/{id} (overdue screening resolved)"
        actor: FamilyServicesWorker
        preconditions: ["no IMMUNIZATION screening remains OVERDUE and all screenings UP_TO_DATE or EXEMPT"]
        side_effects: ["Enrollment.health_compliance_status -> COMPLIANT"]
      - from: PENDING
        to: EXEMPT
        trigger: "PATCH /health-screenings/{id} (screening marked EXEMPT)"
        actor: FamilyServicesWorker
        preconditions: ["the enrollment's IMMUNIZATION screening is marked EXEMPT (medical/religious)"]
        side_effects: ["Enrollment.health_compliance_status -> EXEMPT"]

  - entity: HomeVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /home-visits/{id}/complete"
        actor: FamilyServicesWorker
        preconditions: ["status == SCHEDULED"]
        side_effects: ["home visit counts toward the >=2 completed-visit transition prerequisite"]

  - entity: TransitionPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /transition-plans/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT"
          - "linked Enrollment.status == ACTIVE and Enrollment.health_compliance_status == COMPLIANT"
          - "linked Enrollment has >= 2 COMPLETED HomeVisit records (else ERR_TRANSITION_PREREQ_NOT_MET)"
        side_effects: ["drives Enrollment ACTIVE -> COMPLETED_TRANSITION"]

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: offer-accept-stale-cohort
    parent_entity: AgeCohort
    write_endpoint: "POST /offers/{id}/accept"
    occ_field: "expected_cohort_version"
    description: |
      Accepting an offer commits a slot in the AgeCohort and mutates its
      slot accounting. If the cohort's version has advanced since the client
      last observed it (another accept committed a slot, or a decline/expire/
      withdraw freed one), the client's view of remaining capacity is stale
      and the accept is rejected on the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: income_eligibility
    trigger: "on POST /applications/{id}/submit (declared income) and POST /applications/{id}/verify-eligibility (verified income)"
    algorithm: threshold
    formula: |
      fpl_for_household = FPL_BASE_CENTS + FPL_INCREMENT_CENTS * (household_size - 1)
      income_source = verified_income_cents if verified else annual_income_cents
      income_ratio = round(income_source / fpl_for_household, 4)   # round_half_up
      eligibility_category:
        if homeless_status == true:              HOMELESS
        elif categorical_eligibility != NONE:    CATEGORICAL
        elif income_ratio <= 1.00:               INCOME
        else:                                    OVER_INCOME
    input_set: "single Family linked to the Application"
    constants:
      FPL_BASE_CENTS: 1508000
      FPL_INCREMENT_CENTS: 536000
    precision: "income_ratio 4 decimals, round_half_up"
    variants:
      - name: declared
        when: "at submit"
        difference: "uses Family.annual_income_cents"
      - name: verified
        when: "at verify-eligibility"
        difference: "uses Application.verified_income_cents, which may reclassify the category and cross the 100% FPL boundary"

  - name: priority_points
    trigger: "on POST /applications/{id}/submit (provisional) and POST /applications/{id}/verify-eligibility (verified)"
    algorithm: weighted_scoring
    formula: |
      categorical_points = max(
        40 if homeless_status else 0,
        {FOSTER:35, TANF:30, SSI:30, SNAP:20, NONE:0}[categorical_eligibility]
      )
      income_points =
        25 if income_ratio <= 0.50
        else 18 if income_ratio <= 0.75
        else 10 if income_ratio <= 1.00
        else 0
      disability_points = 15 if child_has_iep else 0
      age_priority_points = 10 if (program.program_type == HEAD_START and cohort.age_band == PRESCHOOL_4) else 0
      sibling_points = 5 if COUNT(Enrollment WHERE application.family_id == this.family_id AND status == ACTIVE) >= 1 else 0
      raw = categorical_points + income_points + disability_points + age_priority_points + sibling_points
      priority_points = min(MAX_PRIORITY_POINTS, raw)
    input_set: "the Application, its Family, its target AgeCohort, and sibling Enrollments in the same family"
    constants:
      MAX_PRIORITY_POINTS: 90
    precision: "integer"
    variants:
      - name: provisional
        when: "at submit"
        difference: "income_ratio derived from declared income; a self-reported categorical basis"
      - name: verified
        when: "at verify-eligibility"
        difference: "income_ratio derived from verified income; the tiered income_points band can shift, producing a different total than the provisional score"

  - name: ada_rate
    trigger: "on POST /attendance-records create and on GET /enrollments/{id} read"
    algorithm: aggregation
    formula: |
      present_days              = COUNT(AttendanceRecord WHERE enrollment_id==E AND instructional_day==true AND status==PRESENT)
      instructional_days_elapsed= COUNT(AttendanceRecord WHERE enrollment_id==E AND instructional_day==true)
      unexcused_days            = COUNT(AttendanceRecord WHERE enrollment_id==E AND instructional_day==true AND status==ABSENT_UNEXCUSED)
      ada_rate            = round(present_days / instructional_days_elapsed, 4)  if instructional_days_elapsed>0 else 0
      annualized_ada_rate = round(present_days / program.total_instructional_days, 4)
      unexcused_absence_rate = round(unexcused_days / instructional_days_elapsed, 4) if instructional_days_elapsed>0 else 0
      chronic_absence = (unexcused_absence_rate >= program.ada_chronic_threshold_pct)
    input_set: "AttendanceRecords for the enrollment on instructional days only"
    precision: "rates 4 decimals, round_half_up"
    variants:
      - name: period_to_date
        when: "stored as Enrollment.ada_rate"
        difference: "denominator is instructional_days_elapsed (days recorded so far)"
      - name: annualized
        when: "stored as Enrollment.annualized_ada_rate"
        difference: "denominator is program.total_instructional_days (full funded year), yielding a different value for identical attendance"

  - name: pir_aggregates
    trigger: "on POST /pir-reports create"
    algorithm: aggregation
    formula: |
      pool = { Enrollment E : E.cohort in program AND E.status in {ACTIVE, COMPLETED_TRANSITION} }
      total_enrolled = COUNT(pool)
      income_eligible_count = COUNT(E in pool WHERE application(E).eligibility_category == INCOME)
      categorical_count     = COUNT(E in pool WHERE application(E).eligibility_category == CATEGORICAL)
      homeless_count        = COUNT(E in pool WHERE application(E).eligibility_category == HOMELESS)
      immunization_compliant_count = COUNT(E in pool WHERE E.health_compliance_status == COMPLIANT)
      # ROUNDING ORDER IS PINNED: round each enrollment's ada_rate to 4dp FIRST, then average, then round to 4dp.
      # This differs from (sum present_days / sum instructional_days) which is explicitly NOT used.
      avg_ada_rate = round( mean( [ round(E.ada_rate,4) for E in pool ] ), 4 )  if total_enrolled>0 else 0
    input_set: "enrolled Enrollments in the program at report-creation time"
    precision: "avg_ada_rate 4 decimals, round_half_up; per-enrollment-round-then-average order is mandatory"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for Family-owned operations, X-User-ID equals the Family.id owning the target Application/Enrollment (application.family_id)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /applications/{id}/submit, /withdraw; POST /offers/{id}/accept, /decline; POST /enrollments/{id}/withdraw when acting as Family"
  - priority: 4
    category: existence
    check: "every path id and every body FK (program_id, cohort_id, family_id, enrollment_id, application_id) resolves to an existing resource"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields (resource-specific NOT_FOUND error returned)"
  - priority: 5
    category: state
    check: "verify-eligibility requires Application.status == SUBMITTED"
    error_id: ERR_APPLICATION_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /applications/{id}/verify-eligibility"
  - priority: 6
    category: state
    check: "waitlist requires Application.status == ELIGIBLE"
    error_id: ERR_APPLICATION_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /applications/{id}/waitlist"
  - priority: 7
    category: state
    check: "accept/decline require the Offer to be PENDING"
    error_id: ERR_OFFER_NOT_PENDING
    http_status: 409
    applies_to: "POST /offers/{id}/accept, POST /offers/{id}/decline"
  - priority: 8
    category: state
    check: "attendance/health/home-visit creation and transition-plan creation require the Enrollment to be ACTIVE"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /attendance-records, POST /health-screenings, POST /home-visits, POST /transition-plans"
  - priority: 9
    category: state
    check: "transition-plan complete requires plan DRAFT; offer expire requires offer PENDING; home-visit complete requires visit SCHEDULED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /transition-plans/{id}/complete, POST /offers/{id}/expire, POST /home-visits/{id}/complete"
  - priority: 10
    category: business_constraint
    check: "on submit, no other non-terminal Application exists for the same family_id + child_dob in the same program_id"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /applications/{id}/submit"
  - priority: 11
    category: business_referential
    check: "on submit, child age_months_at_cutoff within [cohort.min_age_months, cohort.max_age_months] inclusive"
    error_id: ERR_AGE_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /applications/{id}/submit"
  - priority: 12
    category: business_temporal
    check: "accept rejected when current clock >= offer.offer_expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /offers/{id}/accept"
  - priority: 13
    category: business_temporal
    check: "home visit window overlaps an existing non-cancelled HomeVisit for the same enrollment on the same scheduled_date (half-open [start,end); touching boundaries do NOT overlap)"
    error_id: ERR_HOME_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /home-visits"
  - priority: 14
    category: business_temporal
    check: "home visit window intersects the child's cohort daily session window [session_start, session_end) as a time-of-day comparison, regardless of date"
    error_id: ERR_VISIT_DURING_SESSION
    http_status: 409
    applies_to: "POST /home-visits"
  - priority: 15
    category: business_constraint
    check: "transition-plan complete requires enrollment COMPLIANT and >= 2 COMPLETED home visits"
    error_id: ERR_TRANSITION_PREREQ_NOT_MET
    http_status: 409
    applies_to: "POST /transition-plans/{id}/complete"
  - priority: 16
    category: business_fiscal
    check: "run-selection requires at least one eligible WAITLISTED application in the cohort's waitlist pool"
    error_id: ERR_NO_ELIGIBLE_APPLICANTS
    http_status: 422
    applies_to: "POST /cohorts/{id}/run-selection"
  - priority: 17
    category: business_constraint
    check: "accept: expected_cohort_version must equal AgeCohort.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /offers/{id}/accept"
  - priority: 18
    category: business_constraint
    check: "required body fields present and well-typed; enum values within declared domains; numeric fields within declared bounds"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/programs"
    description: "Create a program"
    roles: [ProgramAdmin]
    code: 201
    input: [name, program_type, funded_enrollment, age_cutoff_date, total_instructional_days, "ada_chronic_threshold_pct?"]
    output: Program
    side_effects: []
  - method: GET
    path: "/programs/{id}"
    description: "Fetch a program"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/programs"
    description: "List programs"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: ["limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: POST
    path: "/cohorts"
    description: "Create an age cohort under a program"
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, age_band, funded_slots, min_age_months, max_age_months, session_start, session_end]
    output: AgeCohort
    side_effects: ["selection_status derived OPEN if funded_slots>0"]
  - method: GET
    path: "/cohorts/{id}"
    description: "Fetch a cohort with live slot accounting"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: []
    output: AgeCohort
    side_effects: ["recompute filled_slots, reserved_slots, available_slots, selection_status"]
  - method: GET
    path: "/cohorts"
    description: "List cohorts, optionally filtered by program"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: AgeCohort[]
    side_effects: []
  - method: POST
    path: "/cohorts/{id}/run-selection"
    description: "Run a waitlist selection cycle for the cohort: rank the eligible WAITLISTED pool and generate offers for the top available_slots"
    roles: [ProgramAdmin]
    code: 201
    input: []
    output: Offer[]
    side_effects:
      - "select eligible WAITLISTED applications ranked by priority_points DESC, tie-break submitted_at ASC then created_at ASC"
      - "create up to available_slots PENDING Offers; drive selected Applications WAITLISTED -> OFFERED"
      - "reserved_slots recomputed; AgeCohort.version increments by 1"
      - "ERR_NO_ELIGIBLE_APPLICANTS when the eligible waitlist pool is empty"
  - method: POST
    path: "/families"
    description: "Create a family household record"
    roles: [EnrollmentSpecialist, Family]
    code: 201
    input: [guardian_name, household_size, annual_income_cents, categorical_eligibility, "homeless_status?"]
    output: Family
    side_effects: []
  - method: GET
    path: "/families/{id}"
    description: "Fetch a family"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: []
    output: Family
    side_effects: []
  - method: POST
    path: "/applications"
    description: "Create a DRAFT application"
    roles: [EnrollmentSpecialist, Family]
    code: 201
    input: [program_id, cohort_id, family_id, child_first_name, child_last_name, child_dob, "child_has_iep?"]
    output: Application
    side_effects: ["status set to DRAFT"]
  - method: GET
    path: "/applications/{id}"
    description: "Fetch an application"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "List applications with filters"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: ["program_id?", "cohort_id?", "family_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit an application; computes eligibility and provisional priority points"
    roles: [EnrollmentSpecialist, Family]
    code: 200
    input: []
    output: Application
    side_effects: ["compute income_ratio, eligibility_category, age_months_at_cutoff, provisional priority_points; set submitted_at"]
  - method: POST
    path: "/applications/{id}/verify-eligibility"
    description: "Verify income and recompute eligibility + verified priority points"
    roles: [EnrollmentSpecialist]
    code: 200
    input: [verified_income_cents]
    output: Application
    side_effects: ["set verified_income_cents; recompute income_ratio, eligibility_category, verified priority_points; -> ELIGIBLE or INELIGIBLE"]
  - method: POST
    path: "/applications/{id}/waitlist"
    description: "Place an ELIGIBLE application on the waitlist"
    roles: [EnrollmentSpecialist]
    code: 200
    input: []
    output: Application
    side_effects: ["set waitlisted_at; -> WAITLISTED"]
  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw an application from consideration"
    roles: [EnrollmentSpecialist, Family]
    code: 200
    input: []
    output: Application
    side_effects: ["cancel any PENDING offer; recompute cohort reserved_slots; -> WITHDRAWN"]
  - method: GET
    path: "/offers/{id}"
    description: "Fetch an offer"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: GET
    path: "/offers"
    description: "List offers with filters"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: ["cohort_id?", "application_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []
  - method: POST
    path: "/offers/{id}/accept"
    description: "Accept an offer; creates the enrollment (OCC-guarded on the cohort version)"
    roles: [Family]
    code: 200
    input: [expected_cohort_version]
    output: Offer
    side_effects:
      - "Offer -> ACCEPTED; Application -> ENROLLED; create Enrollment (ACTIVE, health PENDING)"
      - "cohort filled_slots +1, reserved_slots -1; increments AgeCohort.version by 1"
  - method: POST
    path: "/offers/{id}/decline"
    description: "Decline an offer; the application returns to the waitlist"
    roles: [Family]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "Offer -> DECLINED; Application OFFERED -> WAITLISTED"
      - "cohort reserved_slots -1; increments AgeCohort.version by 1"
  - method: POST
    path: "/offers/{id}/expire"
    description: "Expire a PENDING offer whose window has passed; the application returns to the waitlist"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "Offer -> EXPIRED; Application OFFERED -> WAITLISTED"
      - "cohort reserved_slots -1; increments AgeCohort.version by 1"
  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch an enrollment with live ADA computed fields"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["recompute ada_rate, annualized_ada_rate, unexcused_absence_rate, chronic_absence"]
  - method: GET
    path: "/enrollments"
    description: "List enrollments with filters"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: ["cohort_id?", "application_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Withdraw an active enrollment"
    roles: [EnrollmentSpecialist, ProgramAdmin, Family]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["Enrollment -> WITHDRAWN; Application -> WITHDRAWN; cohort filled_slots -1; increments AgeCohort.version by 1"]
  - method: POST
    path: "/enrollments/{id}/disenroll"
    description: "Administratively disenroll an active enrollment"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Enrollment
    side_effects: ["Enrollment -> DISENROLLED; cohort filled_slots -1; increments AgeCohort.version by 1"]
  - method: POST
    path: "/attendance-records"
    description: "Record a day's attendance for an enrollment"
    roles: [FamilyServicesWorker]
    code: 201
    input: [enrollment_id, attendance_date, status, "instructional_day?"]
    output: AttendanceRecord
    side_effects: ["recompute Enrollment ada_rate, annualized_ada_rate, unexcused_absence_rate, chronic_absence"]
  - method: GET
    path: "/enrollments/{id}/attendance-records"
    description: "List attendance records for an enrollment"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: ["limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []
  - method: POST
    path: "/health-screenings"
    description: "Create a required health screening for an enrollment"
    roles: [FamilyServicesWorker]
    code: 201
    input: [enrollment_id, screening_type, due_date]
    output: HealthScreening
    side_effects: ["status set to DUE"]
  - method: PATCH
    path: "/health-screenings/{id}"
    description: "Update a screening's status; may flip the enrollment's health_compliance_status"
    roles: [FamilyServicesWorker]
    code: 200
    input: [status, "completed_date?"]
    output: HealthScreening
    side_effects: ["recompute Enrollment.health_compliance_status from all screenings"]
  - method: GET
    path: "/enrollments/{id}/health-screenings"
    description: "List health screenings for an enrollment"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: ["limit?", "offset?"]
    output: HealthScreening[]
    side_effects: []
  - method: POST
    path: "/home-visits"
    description: "Schedule a family-engagement home visit"
    roles: [FamilyServicesWorker]
    code: 201
    input: [enrollment_id, scheduled_date, window_start, window_end]
    output: HomeVisit
    side_effects: ["status set to SCHEDULED; compute visit_number"]
  - method: POST
    path: "/home-visits/{id}/complete"
    description: "Mark a home visit completed"
    roles: [FamilyServicesWorker]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["status -> COMPLETED"]
  - method: GET
    path: "/enrollments/{id}/home-visits"
    description: "List home visits for an enrollment"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: ["limit?", "offset?"]
    output: HomeVisit[]
    side_effects: []
  - method: POST
    path: "/transition-plans"
    description: "Create a kindergarten transition plan for an enrollment"
    roles: [FamilyServicesWorker, ProgramAdmin]
    code: 201
    input: [enrollment_id, target_school, transition_date]
    output: TransitionPlan
    side_effects: ["status set to DRAFT"]
  - method: POST
    path: "/transition-plans/{id}/complete"
    description: "Complete a transition plan; drives the enrollment to COMPLETED_TRANSITION"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: TransitionPlan
    side_effects: ["-> COMPLETED; Enrollment ACTIVE -> COMPLETED_TRANSITION; cohort filled_slots -1; increments AgeCohort.version by 1"]
  - method: GET
    path: "/enrollments/{id}/transition-plans"
    description: "List transition plans for an enrollment"
    roles: [ProgramAdmin, EnrollmentSpecialist, FamilyServicesWorker, Family]
    code: 200
    input: ["limit?", "offset?"]
    output: TransitionPlan[]
    side_effects: []
  - method: POST
    path: "/pir-reports"
    description: "Generate a PIR report snapshot for a program"
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, reporting_period]
    output: PIRReport
    side_effects: ["compute all aggregate counts and avg_ada_rate (calculations.pir_aggregates)"]
  - method: GET
    path: "/pir-reports/{id}"
    description: "Fetch a PIR report"
    roles: [ProgramAdmin, EnrollmentSpecialist]
    code: 200
    input: []
    output: PIRReport
    side_effects: []
  - method: GET
    path: "/pir-reports"
    description: "List PIR reports, optionally by program"
    roles: [ProgramAdmin, EnrollmentSpecialist]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: PIRReport[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to the given instant for all deadline/expiry/age computations"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid auth headers or unknown role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Family acts on an application/enrollment it does not own"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id path/body does not resolve"
  - id: ERR_COHORT_NOT_FOUND
    http: 404
    condition: "cohort_id path/body does not resolve"
  - id: ERR_FAMILY_NOT_FOUND
    http: 404
    condition: "family_id does not resolve"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application_id path/body does not resolve"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "offer id does not resolve"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment_id path/body does not resolve"
  - id: ERR_HEALTH_SCREENING_NOT_FOUND
    http: 404
    condition: "health screening id does not resolve"
  - id: ERR_HOME_VISIT_NOT_FOUND
    http: 404
    condition: "home visit id does not resolve"
  - id: ERR_TRANSITION_PLAN_NOT_FOUND
    http: 404
    condition: "transition plan id does not resolve"
  - id: ERR_APPLICATION_NOT_SUBMITTED
    http: 409
    condition: "verify-eligibility on an application not in SUBMITTED"
  - id: ERR_APPLICATION_NOT_ELIGIBLE
    http: 409
    condition: "waitlist on an application not in ELIGIBLE"
  - id: ERR_OFFER_NOT_PENDING
    http: 409
    condition: "accept/decline on an offer not in PENDING"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "attendance/health/home-visit/transition-plan creation on a non-ACTIVE enrollment"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition-plan complete on non-DRAFT plan, offer expire on non-PENDING offer, or home-visit complete on non-SCHEDULED visit"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "another non-terminal application exists for same family + child_dob in same program"
  - id: ERR_AGE_OUT_OF_BAND
    http: 422
    condition: "child age at cutoff falls outside the cohort age band"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "accept attempted at/after the offer expiry instant"
  - id: ERR_HOME_VISIT_OVERLAP
    http: 409
    condition: "home visit window overlaps an existing non-cancelled visit for the same enrollment on the same date"
  - id: ERR_VISIT_DURING_SESSION
    http: 409
    condition: "home visit window intersects the child's cohort daily session window"
  - id: ERR_TRANSITION_PREREQ_NOT_MET
    http: 409
    condition: "transition complete without COMPLIANT health status and >=2 completed home visits"
  - id: ERR_NO_ELIGIBLE_APPLICANTS
    http: 422
    condition: "run-selection with an empty eligible waitlist pool"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_cohort_version does not match current AgeCohort.version on accept"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, bad enum, or out-of-range numeric on a write endpoint"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ProgramAdmin
    description: "Grantee administrator: programs, cohorts, selection runs, offer expiry, disenrollment, transition completion, PIR, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /cohorts"
      - "POST /cohorts/{id}/run-selection"
      - "POST /offers/{id}/expire"
      - "POST /enrollments/{id}/disenroll"
      - "POST /transition-plans/{id}/complete"
      - "POST /pir-reports"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /transition-plans"
      - "POST /enrollments/{id}/withdraw"
      - "GET reads"
  - name: EnrollmentSpecialist
    description: "Intake/eligibility staff: families, applications, verification, waitlisting"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/verify-eligibility"
      - "POST /applications/{id}/waitlist"
    shared_operations:
      - "POST /families"
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
      - "POST /enrollments/{id}/withdraw"
      - "GET reads"
  - name: FamilyServicesWorker
    description: "Family services staff: attendance, health screenings, home visits, transition-plan drafting"
    identity: "opaque"
    exclusive_operations:
      - "POST /attendance-records"
      - "POST /health-screenings"
      - "PATCH /health-screenings/{id}"
      - "POST /home-visits"
      - "POST /home-visits/{id}/complete"
    shared_operations:
      - "POST /transition-plans"
      - "GET reads"
  - name: Family
    description: "Guardian acting on their own household's applications, offers, and enrollment"
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /offers/{id}/accept"
      - "POST /offers/{id}/decline"
    shared_operations:
      - "POST /families"
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
      - "POST /enrollments/{id}/withdraw"
      - "GET reads"
