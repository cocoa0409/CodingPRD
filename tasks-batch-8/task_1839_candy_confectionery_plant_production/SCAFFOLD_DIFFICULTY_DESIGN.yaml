scaffold_difficulty_design:
  # ==================================================================
  # Rule 1 — dual_variant_calc
  # ==================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: seasonal_build_projection_forward_vs_confirmed
        grounds:
          - calculations.seasonal_build_projection
          - entities.SeasonalWindow.fields.confirmed_build_units
          - entities.SeasonalWindow.fields.projected_build_units
        distinguishing_aspect: |
          On the SeasonalWindow domain, the confirmed variant counts only ACTIVE lots
          (4000) while the forward-looking projected variant adds pipeline runs' planned
          units (3000), yielding 7000 for identical data — a different entity domain from
          the rework_yield instance.
        test_recipe:
          setup:
            - "HOLIDAY window (target 10000) PUBLISHED; LINE-1 has SHELL-HEART mold installed and is cleared for MILK/SOY"
            - "Run A (planned 5000) completed with output 4000; Run B (planned 3000) still PLANNED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "TRUFFLE-24", name: "Truffle 24pc", product_type: "SEASONAL", brand: "OWN", base_price_cents: 1000, unit_weight_grams: 240, shelf_life_days: 180, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Truffle mass", shape_code: "SHELL-HEART", cook_temp_min_c: 85, cook_temp_max_c: 92, temper_exit_min_c: 30, temper_exit_max_c: 32, allergens: ["MILK", "SOY"], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /molds"
              payload: { shape_code: "SHELL-HEART", cavity_count: 48 }
              as: ProductionPlanner
              captures: { mold_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /seasonal-windows"
              payload: { season_code: "HOLIDAY", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 10000, markdown_tiers: [{ day_offset_min: 0, discount_pct: 0.30 }, { day_offset_min: 7, discount_pct: 0.50 }, { day_offset_min: 14, discount_pct: 0.70 }] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "ALLERGEN_WASH", to_mold_id: "${mold_id}", target_allergens: ["MILK", "SOY"], expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_id: $.data.id }
            - call: "POST /changeovers/${ch_id}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_id}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 5000, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_a: $.data.id }
            - call: "POST /production-runs/${run_a}/start"
              payload: {}
              as: LineOperator
            - call: "POST /production-runs/${run_a}/complete"
              payload: { actual_cook_temp_c: 88, actual_temper_exit_c: 31, output_units: 4000 }
              as: LineOperator
            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
              captures: { win_v2: $.data.version }
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 3000, scheduled_start: "2026-09-06T08:00:00Z", scheduled_end: "2026-09-06T16:00:00Z", expected_window_version: "${win_v2}" }
              as: ProductionPlanner
              captures: { run_b: $.data.id }
          trigger:
            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "SeasonalWindow.${win_id}.confirmed_build_units == 4000"
            - "SeasonalWindow.${win_id}.projected_build_units == 7000"
            - "SeasonalWindow.${win_id}.coverage_pct == 40.0"
            - "SeasonalWindow.${win_id}.shortfall == true"
            - "projected_build_units (7000) != confirmed_build_units (4000) for identical window data"

      - name: rework_standard_vs_actual_yield
        grounds:
          - calculations.rework_yield
          - entities.ProductionRun.fields.expected_output_units
          - entities.ProductionRun.fields.output_units
        distinguishing_aspect: |
          On the ProductionRun/Lot domain, the standard variant (floor(1000 * 0.90) = 900,
          fixed at creation) diverges from the actual variant (operator-recorded 850) for
          identical rework input — a different entity domain from the SeasonalWindow
          build-projection instance.
        test_recipe:
          setup:
            - "HOLIDAY window PUBLISHED; LINE-1 has STAR mold installed, allergen-free clearance"
            - "Source lot of 1000 units (ACTIVE) produced by a completed standard run"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-10", name: "10pc bag", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "CANDY-CANE", name: "Candy Cane", product_type: "SEASONAL", brand: "OWN", base_price_cents: 500, unit_weight_grams: 40, shelf_life_days: 120, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Cane mass", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.90 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /molds"
              payload: { shape_code: "STAR", cavity_count: 60 }
              as: ProductionPlanner
              captures: { mold_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /seasonal-windows"
              payload: { season_code: "HOLIDAY", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 10000, markdown_tiers: [{ day_offset_min: 0, discount_pct: 0.30 }] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "SHAPE_ONLY", to_mold_id: "${mold_id}", expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_id: $.data.id }
            - call: "POST /changeovers/${ch_id}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_id}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 1000, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_s: $.data.id }
            - call: "POST /production-runs/${run_s}/start"
              payload: {}
              as: LineOperator
            - call: "POST /production-runs/${run_s}/complete"
              payload: { actual_cook_temp_c: 85, actual_temper_exit_c: 29, output_units: 1000 }
              as: LineOperator
              captures: { lot_src: $.data.created_lot_id }
            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
              captures: { win_v2: $.data.version }
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "REWORK", planned_units: 900, scheduled_start: "2026-09-07T08:00:00Z", scheduled_end: "2026-09-07T16:00:00Z", source_lot_id: "${lot_src}", rework_qty: 1000, expected_window_version: "${win_v2}" }
              as: ProductionPlanner
              captures: { rw_id: $.data.id }
          trigger:
            - call: "POST /production-runs/${rw_id}/start"
              payload: {}
              as: LineOperator
            - call: "POST /production-runs/${rw_id}/complete"
              payload: { actual_cook_temp_c: 85, actual_temper_exit_c: 29, output_units: 850 }
              as: LineOperator
              captures: { lot_new: $.data.created_lot_id }
            - call: "GET /production-runs/${rw_id}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /lots/${lot_new}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /lots/${lot_src}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "ProductionRun.${rw_id}.expected_output_units == 900"
            - "ProductionRun.${rw_id}.output_units == 850"
            - "Lot.${lot_new}.qty_on_hand == 850"
            - "Lot.${lot_src}.status == DEPLETED"
            - "SeasonalWindow.${win_id}.confirmed_build_units == 850"
            - "expected_output_units (900, standard variant) != output_units (850, actual variant)"

  # ==================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ==================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: markdown_tiered_price_with_floor
        grounds:
          - calculations.markdown_price
          - entities.Lot.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (base_price_cents, days_after_season_end, tier table,
          MIN_PRICE_FLOOR_CENTS) with non-linear interaction — tier branch selection at
          d == 8 plus a max() floor that lifts lot B from 45 to 50 cents.
        test_recipe:
          setup:
            - "HOLIDAY window (ship_end 2026-12-26) with tiers 0->30%, 7->50%, 14->70%; two ACTIVE lots: A (base 1000 cents) and B (base 90 cents)"
            - "Clock at 2027-01-03 (8 days after season end) and window CLOSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "MD-A", name: "Markdown A", product_type: "SEASONAL", brand: "OWN", base_price_cents: 1000, unit_weight_grams: 240, shelf_life_days: 180, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { pa: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "MD-B", name: "Markdown B", product_type: "SEASONAL", brand: "OWN", base_price_cents: 90, unit_weight_grams: 240, shelf_life_days: 180, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { pb: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${pa}", name: "Mass A", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { ra: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${pb}", name: "Mass B", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rb: $.data.id }
            - call: "POST /molds"
              payload: { shape_code: "STAR", cavity_count: 60 }
              as: ProductionPlanner
              captures: { mold_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /seasonal-windows"
              payload: { season_code: "HOLIDAY", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 5000, markdown_tiers: [{ day_offset_min: 0, discount_pct: 0.30 }, { day_offset_min: 7, discount_pct: 0.50 }, { day_offset_min: 14, discount_pct: 0.70 }] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "SHAPE_ONLY", to_mold_id: "${mold_id}", expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_id: $.data.id }
            - call: "POST /changeovers/${ch_id}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_id}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${pa}", recipe_id: "${ra}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 200, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_a: $.data.id }
            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
              captures: { win_v2: $.data.version }
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${pb}", recipe_id: "${rb}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 100, scheduled_start: "2026-09-06T08:00:00Z", scheduled_end: "2026-09-06T16:00:00Z", expected_window_version: "${win_v2}" }
              as: ProductionPlanner
              captures: { run_b: $.data.id }
            - call: "POST /production-runs/${run_a}/start"
              payload: {}
              as: LineOperator
            - call: "POST /production-runs/${run_a}/complete"
              payload: { actual_cook_temp_c: 85, actual_temper_exit_c: 29, output_units: 200 }
              as: LineOperator
            - call: "POST /production-runs/${run_b}/start"
              payload: {}
              as: LineOperator
            - call: "POST /production-runs/${run_b}/complete"
              payload: { actual_cook_temp_c: 85, actual_temper_exit_c: 29, output_units: 100 }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-03T00:00:00Z" }
              as: PlantManager
            - call: "POST /seasonal-windows/${win_id}/close"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /seasonal-windows/${win_id}/apply-markdown"
              payload: {}
              as: PlantManager
              captures: { md_count: $.data.updated_lot_count, md_disc: $.data.discount_pct, md_days: $.data.days_after_season_end }
            - call: "GET /lots"
              payload: { run_id: "${run_a}" }
              as: ProductionPlanner
              captures: { lot_a_price: "$.data[0].unit_price_cents" }
            - call: "GET /lots"
              payload: { run_id: "${run_b}" }
              as: ProductionPlanner
              captures: { lot_b_price: "$.data[0].unit_price_cents" }
          assert:
            - "apply-markdown response updated_lot_count == 2"
            - "apply-markdown response discount_pct == 0.5"
            - "apply-markdown response days_after_season_end == 8"
            - "lot A unit_price_cents == 500 (round_half_up(1000 * 0.5))"
            - "lot B unit_price_cents == 50 (max(round_half_up(90 * 0.5) = 45, floor 50))"

      - name: gift_kit_per_line_rounding
        grounds:
          - calculations.gift_set_price
          - entities.Lot.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each component line is rounded
          half-up to cents first (905 + 455), then summed (1360); the sum-then-round
          order would yield 1361, so the orders observably differ.
        test_recipe:
          setup:
            - "Gift set GIFT-01 = 1 x PRC-A (base 1006 cents) + 1 x PRC-B (base 506 cents), kit discount 10%"
            - "ACTIVE lots: 10 units of PRC-A and 10 units of PRC-B in the BASE window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "PRC-A", name: "Price A", product_type: "STANDARD", brand: "OWN", base_price_cents: 1006, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { pa: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "PRC-B", name: "Price B", product_type: "STANDARD", brand: "OWN", base_price_cents: 506, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { pb: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "GIFT-01", name: "Gift Set 01", product_type: "GIFT_SET", brand: "OWN", base_price_cents: 2000, unit_weight_grams: 300, shelf_life_days: 120, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { pg: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${pa}", name: "Mass A", shape_code: "BAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { ra: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${pb}", name: "Mass B", shape_code: "BAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rb: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${pg}", name: "Assembly spec", shape_code: "BAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 1.0 }
              as: ProductionPlanner
              captures: { rg: $.data.id }
            - call: "POST /gift-components"
              payload: { gift_product_id: "${pg}", component_product_id: "${pa}", qty_per_set: 1 }
              as: ProductionPlanner
            - call: "POST /gift-components"
              payload: { gift_product_id: "${pg}", component_product_id: "${pb}", qty_per_set: 1 }
              as: ProductionPlanner
            - call: "POST /molds"
              payload: { shape_code: "BAR", cavity_count: 36 }
              as: ProductionPlanner
              captures: { mold_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /seasonal-windows"
              payload: { season_code: "BASE", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 1000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "SHAPE_ONLY", to_mold_id: "${mold_id}", expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_id: $.data.id }
            - call: "POST /changeovers/${ch_id}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_id}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${pa}", recipe_id: "${ra}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 10, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_a: $.data.id }
            - call: "POST /production-runs/${run_a}/start"
              payload: {}
              as: LineOperator
            - call: "POST /production-runs/${run_a}/complete"
              payload: { actual_cook_temp_c: 85, actual_temper_exit_c: 29, output_units: 10 }
              as: LineOperator
            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
              captures: { win_v2: $.data.version }
