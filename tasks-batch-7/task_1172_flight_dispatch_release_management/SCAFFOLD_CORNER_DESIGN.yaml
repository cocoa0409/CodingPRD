        grounds: ["errors[ERR_WEATHER_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / weather_window_half_open_adjacency
          rationale: "Asserted on the straddling-window trigger."

      - name: err_rest_violation_covered
