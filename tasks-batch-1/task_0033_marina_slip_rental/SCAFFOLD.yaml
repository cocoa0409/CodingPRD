scenario: |
  Yacht/Marina Slip Rental: slip size matching, liveaboard utilities, Pump-out,
  seasonal pricing, Liveaboard policy, insurance and tow assistance, Slip
  Transfer waitlist.

domain_name: marina-slip-rental
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - tiered_pricing
    - selector_policy
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Marina
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Marina display name."
      - name: harbor_code
        type: string
        source: input
        description: "Three-letter harbor code, unique across Marinas (e.g. SFO, NYC)."
        constraints: "unique; 3 uppercase letters"
      - name: liveaboard_cap
        type: integer
        source: input
        description: "Maximum number of Tenants permitted to hold liveaboard status concurrently within this Marina."
        constraints: ">= 0"
      - name: liveaboard_current_count
        type: integer
        source: computed
        description: "Count of Tenants whose liveaboard_status == APPROVED and whose active Lease.marina_id == this Marina; recomputed on every Tenant liveaboard transition and on Lease ACTIVE/ENDED transitions."
        default: 0
      - name: season_summer_start
        type: string
        source: input
        description: "Inclusive ISO date (MM-DD) on which SUMMER seasonal pricing begins each year. Pricing tier resolved by the calendar window the Lease.start_date falls into; see calculations.seasonal_lease_pricing."
        constraints: "format MM-DD"
        default: "05-01"
      - name: season_summer_end
        type: string
        source: input
        description: "Inclusive ISO date (MM-DD) on which SUMMER seasonal pricing ends each year."
        constraints: "format MM-DD; must be after season_summer_start"
        default: "09-30"
      - name: tow_assist_radius_nm
        type: number
        source: input
        description: "Nautical-mile radius covered by this marina's tow assistance program."
        default: 25.0

  - name: Slip
    parent: Marina
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: input
        description: "FK -> Marina.id; the marina owning this slip."
      - name: slip_number
        type: string
        source: input
        description: "Marina-scoped human label (e.g. A-12)."
        constraints: "unique within (marina_id)"
      - name: length_ft
        type: number
        source: input
        description: "Slip usable length in feet."
        constraints: "> 0"
      - name: beam_ft
        type: number
        source: input
        description: "Slip usable beam (width) in feet."
        constraints: "> 0"
      - name: power_amp
        type: enum
        source: input
        description: "Shore-power rating available at the slip pedestal."
        constraints: "one of {NONE, A30, A50, A100}"
      - name: pumpout_available
        type: boolean
        source: input
        description: "True when slip pedestal has integrated pump-out connection."
        default: false
      - name: liveaboard_allowed
        type: boolean
        source: input
        description: "True when this slip is permitted to host Liveaboard-status tenants."
        default: false
      - name: base_daily_rate_cents
        type: integer
        source: input
        description: "Slip's base nightly rate in cents before seasonal multipliers."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Slip lifecycle. Computed from §1.2 Slip state machine. Values: AVAILABLE, RESERVED, OCCUPIED, OUT_OF_SERVICE."
        default: "AVAILABLE"

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; owning tenant."
      - name: name
        type: string
        source: input
        description: "Vessel display name."
      - name: loa_ft
        type: number
        source: input
        description: "Length overall, in feet."
        constraints: "> 0"
      - name: beam_ft
        type: number
        source: input
        description: "Vessel beam (width) in feet."
        constraints: "> 0"
      - name: insurance_policy_number
        type: string
        source: input
        description: "Hull insurance policy identifier."
      - name: insurance_expires_on
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) on which hull insurance expires. Insurance is considered VALID for any clock instant strictly less than YYYY-MM-DDT00:00:00Z of this date (inclusive of the prior day, exclusive of this date)."
      - name: insurance_coverage_cents
        type: integer
        source: input
        description: "Hull insurance limit (cents). Must meet minimum thresholds; see validations."
        constraints: ">= 0"

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login email, globally unique."
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: "Tenant display name."
      - name: liveaboard_status
        type: enum
        source: computed
        description: "Liveaboard policy posture for this Tenant. Computed from §1.2 Tenant state machine. Values: NONE, PENDING, APPROVED, REVOKED."
        default: "NONE"
      - name: liveaboard_approved_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC when liveaboard_status most recently became APPROVED; null otherwise."
        default: null

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: input
        description: "FK -> Marina.id; the lease's marina (denormalized from Slip for query)."
      - name: slip_id
        type: string
        source: input
        description: "FK -> Slip.id; the rented slip."
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; the lessee."
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the vessel occupying the slip."
      - name: start_date
        type: string
        source: input
        description: "Inclusive ISO date (YYYY-MM-DD) lease begins."
      - name: end_date
        type: string
        source: input
        description: "Exclusive ISO date (YYYY-MM-DD) lease ends. Two leases on the same slip overlap when their [start_date, end_date) half-open intervals intersect."
      - name: is_liveaboard
        type: boolean
        source: input
        description: "True iff Tenant intends to liveaboard during the lease."
        default: false
      - name: nightly_rate_cents
        type: integer
        source: computed
        description: "Per-night rate after seasonal multiplier; see calculations.seasonal_lease_pricing. Pinned on TRANSITION RESERVED->ACTIVE and never updated thereafter."
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: "Final cost in cents (= nights * nightly_rate_cents + liveaboard utility surcharge if applicable). Pinned at ACTIVE. See calculations.lease_total_cost."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lease lifecycle. Computed from §1.2 Lease state machine. Values: RESERVED, ACTIVE, ENDED, CANCELLED."
        default: "RESERVED"
      - name: expected_slip_version
        type: integer
        source: input
        description: "OCC field; ignored on lease body persistence — present only as the body field name for the create-lease endpoint per §1.2.1.rule_id slip-reserve-stale. Stored is not required; the server validates and discards."
        constraints: ">= 1"

  - name: PumpOutRequest
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the active lease this request is bound to."
      - name: requested_at
        type: datetime
        source: system
        description: "Server-stamped ISO 8601 UTC timestamp the request was created."
      - name: completed_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC timestamp set on COMPLETION transition; null otherwise."
        default: null
      - name: status
        type: enum
        source: computed
        description: "PumpOutRequest lifecycle. Computed from §1.2 PumpOutRequest state machine. Values: PENDING, COMPLETED, CANCELLED."
        default: "PENDING"
      - name: charge_cents
        type: integer
        source: computed
        description: "Fee assessed to the lease at COMPLETION. Free when Slip.pumpout_available is true; PUMPOUT_PORTABLE_FEE_CENTS otherwise. See calculations.pumpout_charge."
        default: 0

  - name: TowAssistEvent
    parent: null
    common_fields: false
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; tenant requesting tow."
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; vessel needing tow."
      - name: marina_id
        type: string
        source: input
        description: "FK -> Marina.id; marina dispatching the tow."
      - name: incident_distance_nm
        type: number
        source: input
        description: "Distance, in nautical miles, from the marina to the incident location."
        constraints: ">= 0"
      - name: outcome
        type: enum
        source: computed
        description: "Outcome of the dispatch attempt. Values: COVERED, OUT_OF_RADIUS, INSURANCE_INVALID."
      - name: dispatched_at
        type: datetime
        source: system
        description: "Server-stamped ISO 8601 UTC dispatch timestamp."

  - name: TransferWaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: input
        description: "FK -> Marina.id; marina the tenant wishes to transfer within."
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; requesting tenant."
      - name: from_lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the tenant's current ACTIVE lease being transferred OUT OF."
      - name: target_slip_id
        type: string
        source: input
        description: "FK -> Slip.id; the slip the tenant wishes to transfer INTO."
      - name: requested_at
        type: datetime
        source: system
        description: "Server-stamped ISO 8601 UTC timestamp the entry was created. Used as the strict-ascending ordering key for waitlist promotion (see calculations.waitlist_promotion_pick)."
      - name: position
        type: integer
        source: computed
        description: "1-based position within the (marina_id, target_slip_id) waitlist queue, ordered by requested_at ASC, then created_at ASC. Recomputed after every PROMOTED/CANCELLED transition."
      - name: status
        type: enum
        source: computed
        description: "TransferWaitlistEntry lifecycle. Values: QUEUED, PROMOTED, CANCELLED, EXPIRED. Computed from §1.2 state machine."
        default: "QUEUED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Slip
    initial_state: AVAILABLE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /leases (creates a Lease in RESERVED for a future date range)"
        actor: Tenant
        preconditions:
          - "Slip.status == AVAILABLE"
          - "no other Lease on this slip whose [start_date, end_date) overlaps the requested window"
        side_effects:
          - "Slip.status = RESERVED"
          - "Slip.version += 1"
        note: "Triggers parallel Lease state machine; see Lease entity."

      - from: RESERVED
        to: OCCUPIED
        trigger: "POST /leases/{id}/check-in"
        actor: MarinaStaff
        preconditions:
          - "Slip.status == RESERVED"
          - "Lease.status == RESERVED"
          - "current clock date is on or after Lease.start_date"
        side_effects:
          - "Lease transitions RESERVED -> ACTIVE (see Lease state machine — cascade depth 1)"
          - "Slip.status = OCCUPIED"
          - "Slip.version += 1"

      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /leases/{id}/check-out"
        actor: MarinaStaff
        preconditions:
          - "Slip.status == OCCUPIED"
          - "Lease.status == ACTIVE"
        side_effects:
          - "Lease transitions ACTIVE -> ENDED (cascade depth 1)"
          - "Tenant.liveaboard_status: if Tenant had APPROVED & this was the only ACTIVE liveaboard lease on this marina, Marina.liveaboard_current_count is decremented (cascade depth 2)"
          - "calculations.waitlist_promotion_pick selects head TransferWaitlistEntry (queue keyed on (Slip.marina_id, Slip.id), order requested_at ASC, tie-break created_at ASC); if non-empty, head transitions QUEUED -> PROMOTED (cascade depth 3) and Slip.status = RESERVED"
          - "Slip.version += 1"
        note: "Three-hop transitive cascade: check-out → lease ENDED → marina counter decrement → waitlist head promotion."

      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /slips/{id}/decommission"
        actor: HarborMaster
        preconditions:
          - "Slip.status == AVAILABLE"
          - "no Lease on this slip whose status is RESERVED or ACTIVE"
        side_effects:
          - "Slip.status = OUT_OF_SERVICE"
          - "Slip.version += 1"

      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /leases/{id}/cancel"
        actor: Tenant
        preconditions:
          - "Slip.status == RESERVED"
          - "Lease.status == RESERVED"
        side_effects:
          - "Lease transitions RESERVED -> CANCELLED (cascade depth 1)"
          - "Slip.status = AVAILABLE"
          - "Slip.version += 1"

  - entity: Lease
    initial_state: RESERVED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /leases/{id}/check-in (cascaded from Slip RESERVED -> OCCUPIED)"
        actor: MarinaStaff
        preconditions:
          - "Lease.status == RESERVED"
          - "Vessel.insurance_expires_on is strictly after the current clock UTC date (insurance VALID at check-in)"
          - "Vessel.loa_ft <= Slip.length_ft AND Vessel.beam_ft <= Slip.beam_ft (size match)"
          - "if Lease.is_liveaboard == true, Slip.liveaboard_allowed == true AND Tenant.liveaboard_status == APPROVED"
        side_effects:
          - "Lease.nightly_rate_cents pinned via calculations.seasonal_lease_pricing"
          - "Lease.total_cost_cents pinned via calculations.lease_total_cost"
          - "Lease.version += 1"

      - from: ACTIVE
        to: ENDED
        trigger: "POST /leases/{id}/check-out (cascaded from Slip OCCUPIED -> AVAILABLE)"
        actor: MarinaStaff
        preconditions:
          - "Lease.status == ACTIVE"
        side_effects:
          - "Lease.version += 1"
          - "if Lease.is_liveaboard == true, Marina.liveaboard_current_count -= 1"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /leases/{id}/cancel"
        actor: Tenant
        preconditions:
          - "Lease.status == RESERVED"
        side_effects:
          - "Lease.version += 1"

  - entity: Tenant
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PENDING
        trigger: "POST /tenants/{id}/liveaboard-applications"
        actor: Tenant
        preconditions:
          - "Tenant.liveaboard_status IN {NONE, REVOKED}"
        side_effects:
          - "Tenant.liveaboard_status = PENDING"
          - "Tenant.version += 1"

      - from: PENDING
        to: APPROVED
        trigger: "POST /tenants/{id}/liveaboard-approve"
        actor: HarborMaster
        preconditions:
          - "Tenant.liveaboard_status == PENDING"
          - "Marina.liveaboard_current_count < Marina.liveaboard_cap for the marina supplied in request"
        side_effects:
          - "Tenant.liveaboard_status = APPROVED"
          - "Tenant.liveaboard_approved_at = current UTC timestamp"
          - "Marina.liveaboard_current_count += 1"
          - "Marina.version += 1"
          - "Tenant.version += 1"

      - from: PENDING
        to: NONE
        trigger: "POST /tenants/{id}/liveaboard-deny"
        actor: HarborMaster
        preconditions:
          - "Tenant.liveaboard_status == PENDING"
        side_effects:
          - "Tenant.liveaboard_status = NONE"
          - "Tenant.version += 1"

      - from: APPROVED
        to: REVOKED
        trigger: "POST /tenants/{id}/liveaboard-revoke"
        actor: HarborMaster
        preconditions:
          - "Tenant.liveaboard_status == APPROVED"
        side_effects:
          - "Tenant.liveaboard_status = REVOKED"
          - "Marina.liveaboard_current_count -= 1 (for the marina that previously counted this tenant)"
          - "every Lease.is_liveaboard == true currently in RESERVED for this tenant transitions RESERVED -> CANCELLED (cascade depth 2)"
          - "Tenant.version += 1; Marina.version += 1"

      - from: REVOKED
        to: PENDING
        trigger: "POST /tenants/{id}/liveaboard-applications (re-apply)"
        actor: Tenant
        preconditions:
          - "Tenant.liveaboard_status == REVOKED"
        side_effects:
          - "Tenant.liveaboard_status = PENDING"
          - "Tenant.version += 1"
        note: "Cycle back into the review loop; this makes the Tenant machine cyclic (REVOKED -> PENDING) — see §0.5 rule_id non_linear_state_machine."

  - entity: PumpOutRequest
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /pump-out-requests/{id}/complete"
        actor: MarinaStaff
        preconditions:
          - "PumpOutRequest.status == PENDING"
          - "Lease.status == ACTIVE"
        side_effects:
          - "PumpOutRequest.charge_cents pinned via calculations.pumpout_charge"
          - "PumpOutRequest.completed_at = current UTC"
          - "PumpOutRequest.version += 1"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /pump-out-requests/{id}/cancel"
        actor: Tenant
        preconditions:
          - "PumpOutRequest.status == PENDING"
        side_effects:
          - "PumpOutRequest.version += 1"

  - entity: TransferWaitlistEntry
    initial_state: QUEUED
    terminal_states: [PROMOTED, CANCELLED, EXPIRED]
    transitions:
      - from: QUEUED
        to: PROMOTED
        trigger: "system: cascaded from Slip OCCUPIED -> AVAILABLE via calculations.waitlist_promotion_pick"
        actor: system
        preconditions:
          - "TransferWaitlistEntry.status == QUEUED"
          - "entry is head of its (marina_id, target_slip_id) queue by requested_at ASC, tie-break created_at ASC"
          - "target_slip.status == AVAILABLE at the moment of promotion"
        side_effects:
          - "TransferWaitlistEntry.status = PROMOTED"
          - "target Slip.status set to RESERVED on the same request (re-uses the Slip AVAILABLE -> RESERVED transition)"
          - "TransferWaitlistEntry.version += 1"

      - from: QUEUED
        to: CANCELLED
        trigger: "POST /transfer-waitlist/{id}/cancel"
        actor: Tenant
        preconditions:
          - "TransferWaitlistEntry.status == QUEUED"
        side_effects:
          - "TransferWaitlistEntry.version += 1"
          - "subsequent entries in the same (marina_id, target_slip_id) queue have their .position recomputed"

      - from: QUEUED
        to: EXPIRED
        trigger: "POST /transfer-waitlist/expire-stale"
        actor: HarborMaster
        preconditions:
          - "TransferWaitlistEntry.status == QUEUED"
          - "(current UTC) - TransferWaitlistEntry.requested_at >= WAITLIST_TTL_DAYS days"
        side_effects:
          - "TransferWaitlistEntry.status = EXPIRED"
          - "TransferWaitlistEntry.version += 1"
          - "queue positions recomputed for remaining QUEUED entries"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: slip-reserve-stale
    parent_entity: Slip
    write_endpoint: "POST /leases"
    occ_field: "expected_slip_version"
    description: |
      Creating a Lease against a Slip whose version has advanced since the
      client last observed it is rejected. This captures the case where the
      slip was already reserved by another tenant (whose successful create
      legitimately superseded the prior view), so the current writer's view
      of the slip is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: seasonal_lease_pricing
    trigger: "Lease RESERVED -> ACTIVE (POST /leases/{id}/check-in)"
    algorithm: tiered_pricing
    formula: |
      # nightly_rate_cents resolves a SEASON tier from the Marina's calendar:
      #   SUMMER iff (Lease.start_date is on or between (Marina.season_summer_start, Marina.season_summer_end))
      #   WINTER otherwise
      # tier multiplier (decimal, applied via integer arithmetic):
      #   SUMMER -> 150 / 100  (i.e. 1.50)
      #   WINTER -> 80 / 100   (i.e. 0.80)
      # liveaboard surcharge multiplier on TOP of the seasonal tier:
      #   if Lease.is_liveaboard == true -> additionally multiply by 110 / 100 (1.10)
      #   else -> 100 / 100 (1.00)
      # Evaluation order is FIXED:
      #   step 1: pick seasonal multiplier from start_date
      #   step 2: nightly_rate_cents = floor( Slip.base_daily_rate_cents * seasonal_mul )  (round_half_up at this step)
      #   step 3: nightly_rate_cents = round_half_up( nightly_rate_cents * liveaboard_mul ) (round per step)
      # NOTE on combinatorial nesting: the nesting is NOT a single multiplication —
      # rounding occurs at step 2 BEFORE step 3 is applied, so per-step rounding
      # differs from "sum-then-round" arithmetic. The scaffold PINS step-by-step
      # rounding; doing both multiplications first and rounding once at the end
      # produces a different cents value at certain inputs.
    input_set: "Lease in RESERVED transitioning to ACTIVE; uses Slip.base_daily_rate_cents and Marina.season_summer_start/season_summer_end of the Lease's marina."
    constants:
      SEASONAL_MULTIPLIER_SUMMER_NUM: 150
      SEASONAL_MULTIPLIER_SUMMER_DEN: 100
      SEASONAL_MULTIPLIER_WINTER_NUM: 80
      SEASONAL_MULTIPLIER_WINTER_DEN: 100
      LIVEABOARD_SURCHARGE_NUM: 110
      LIVEABOARD_SURCHARGE_DEN: 100
    precision: "integer cents, round_half_up applied at each of step-2 and step-3 independently"
    variants:
      - name: seasonal_summer_non_liveaboard
        when: "Lease.start_date inside SUMMER window, is_liveaboard == false"
        difference: "Step 3 surcharge mul is 1.00 (no-op); only seasonal multiplier applies."
      - name: seasonal_summer_liveaboard
        when: "Lease.start_date inside SUMMER window, is_liveaboard == true"
        difference: "Both seasonal SUMMER and liveaboard surcharge apply with per-step rounding."

  - name: lease_total_cost
    trigger: "Lease RESERVED -> ACTIVE (POST /leases/{id}/check-in), evaluated AFTER seasonal_lease_pricing pins nightly_rate_cents"
    algorithm: aggregation
    formula: |
      nights = (Lease.end_date - Lease.start_date).days     # half-open [start, end)
      base = nights * Lease.nightly_rate_cents               # integer cents
      utility_surcharge = 0
      if Lease.is_liveaboard == true:
          utility_surcharge = LIVEABOARD_UTILITY_FEE_PER_NIGHT_CENTS * nights
      total_cost_cents = base + utility_surcharge
    input_set: "Lease in RESERVED transitioning to ACTIVE; uses Lease.nightly_rate_cents (already pinned by seasonal_lease_pricing) and Lease.is_liveaboard."
    constants:
      LIVEABOARD_UTILITY_FEE_PER_NIGHT_CENTS: 1500
    precision: "integer cents"

  - name: pumpout_charge
    trigger: "PumpOutRequest PENDING -> COMPLETED (POST /pump-out-requests/{id}/complete)"
    algorithm: threshold
    formula: |
      # The slip's pumpout_available bit gates the charge:
      if Slip.pumpout_available == true:
          charge_cents = 0
      else:
          charge_cents = PUMPOUT_PORTABLE_FEE_CENTS
    input_set: "PumpOutRequest joined to its Lease.slip_id at completion time."
    constants:
      PUMPOUT_PORTABLE_FEE_CENTS: 2500
    precision: "integer cents"

  - name: tow_assistance_dispatch
    trigger: "POST /tow-assist-events (synchronous evaluation at dispatch)"
    algorithm: threshold
    formula: |
      # Evaluation order is FIXED (combinatorial mode (c) — circular-looking
      # dependency pinned to a deterministic order):
      #   step 1: validate insurance — Vessel.insurance_expires_on is strictly
      #           after the clock UTC date AND
      #           Vessel.insurance_coverage_cents >= MIN_INSURANCE_COVERAGE_CENTS
      #   step 2: validate radius — incident_distance_nm <= Marina.tow_assist_radius_nm
      # outcome enum is set by which step first fails (or COVERED if all pass):
      #   - if step 1 fails -> outcome = INSURANCE_INVALID
      #   - else if step 2 fails -> outcome = OUT_OF_RADIUS
      #   - else -> outcome = COVERED
      # Order matters: an event with expired insurance AND distance outside radius
      # records INSURANCE_INVALID, NOT OUT_OF_RADIUS, because the insurance step
      # runs first and short-circuits.
    input_set: "TowAssistEvent's Vessel + Marina + incident_distance_nm at the moment of POST."
    constants:
      MIN_INSURANCE_COVERAGE_CENTS: 5000000
    precision: "exact enum"

  - name: waitlist_promotion_pick
    trigger: "Slip OCCUPIED -> AVAILABLE (POST /leases/{id}/check-out)"
    algorithm: chronological
    formula: |
      candidates = TransferWaitlistEntry where
          marina_id == Slip.marina_id AND
          target_slip_id == Slip.id AND
          status == QUEUED
      # Strict ordering (no random fields):
      candidates.sort(key = (requested_at ASC, created_at ASC))
      if candidates is empty:
          no-op — Slip transitions OCCUPIED -> AVAILABLE only.
      else:
          head = candidates[0]
          head.status = PROMOTED          # side effect
          slip.status = RESERVED           # head's promotion holds the slip
          recompute positions for remaining QUEUED entries
    input_set: "Active queue for (marina_id, target_slip_id) at the moment Slip transitions to AVAILABLE."
    precision: "exact selection; no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except response_envelope-level errors"

  - priority: 2
    category: auth
    check: "Role permitted for endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource id referenced in URL path or body (marina_id, slip_id, lease_id, tenant_id, vessel_id, etc.) exists, validated left-to-right in the path."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target entity is in a state from which the requested transition is permitted (see §1.2 preconditions)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (check-in, check-out, cancel, complete, decommission, approve, deny, revoke, waitlist-cancel)"

  - priority: 5
    category: state
    check: "OCC parent-version check: expected_<parent>_version equals current parent.version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /leases (expected_slip_version)"

  - priority: 6
    category: business_safety
    check: "On Lease RESERVED -> ACTIVE: vessel insurance must be VALID — Vessel.insurance_expires_on strictly after current UTC date AND Vessel.insurance_coverage_cents >= MIN_INSURANCE_COVERAGE_CENTS."
    error_id: ERR_INSURANCE_INVALID
    http_status: 422
    applies_to: "POST /leases/{id}/check-in"

  - priority: 7
    category: business_safety
    check: "Liveaboard policy: a Lease with is_liveaboard == true may be created or checked in only when Slip.liveaboard_allowed == true AND Tenant.liveaboard_status == APPROVED."
    error_id: ERR_LIVEABOARD_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /leases, POST /leases/{id}/check-in"

  - priority: 8
    category: business_constraint
    check: "Slip size matching: Vessel.loa_ft <= Slip.length_ft AND Vessel.beam_ft <= Slip.beam_ft."
    error_id: ERR_SLIP_SIZE_MISMATCH
    http_status: 422
    applies_to: "POST /leases, POST /leases/{id}/check-in"

  - priority: 9
    category: business_temporal
    check: "Half-open interval overlap: no other Lease on the same slip whose [start_date, end_date) intersects the requested window. Day-exact adjacency (next lease starts == previous lease ends) does NOT collide because end_date is exclusive."
    error_id: ERR_SLIP_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /leases"

  - priority: 10
    category: business_constraint
    check: "Lease.start_date < Lease.end_date."
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /leases"

  - priority: 11
    category: business_fiscal
    check: "Liveaboard quota: liveaboard approval is rejected when Marina.liveaboard_current_count >= Marina.liveaboard_cap."
    error_id: ERR_LIVEABOARD_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /tenants/{id}/liveaboard-approve"

  - priority: 12
    category: business_referential
    check: "Vessel referenced by Lease must belong to the same Tenant referenced by Lease."
    error_id: ERR_VESSEL_TENANT_MISMATCH
    http_status: 422
    applies_to: "POST /leases"

  - priority: 13
    category: business_referential
    check: "TransferWaitlistEntry: tenant must currently hold an ACTIVE Lease at marina_id, and from_lease_id must be that lease; target_slip_id must be a Slip in same marina."
    error_id: ERR_WAITLIST_INELIGIBLE
    http_status: 422
    applies_to: "POST /transfer-waitlist"

  - priority: 14
    category: business_constraint
    check: "Request body conforms to the endpoint input schema (required fields present, types correct, enums valid)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Marinas ----------------------------------------------------------
  - method: POST
    path: "/marinas"
    description: "Create a marina."
    roles: [HarborMaster]
    code: 201
    input:
      - name
      - harbor_code
      - liveaboard_cap
      - season_summer_start?
      - season_summer_end?
      - tow_assist_radius_nm?
    output: Marina
    side_effects:
      - "Marina created with liveaboard_current_count = 0."

  - method: GET
    path: "/marinas"
    description: "List marinas."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input:
      - limit?
      - offset?
    output: "Marina[]"
    side_effects: []

  - method: GET
    path: "/marinas/{id}"
    description: "Retrieve one marina."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input: []
    output: Marina
    side_effects: []

  # ---- Slips ------------------------------------------------------------
  - method: POST
    path: "/marinas/{id}/slips"
    description: "Create a slip under a marina."
    roles: [HarborMaster]
    code: 201
    input:
      - slip_number
      - length_ft
      - beam_ft
      - power_amp
      - pumpout_available?
      - liveaboard_allowed?
      - base_daily_rate_cents
    output: Slip
    side_effects:
      - "Slip.status = AVAILABLE; marina_id inherited from path."

  - method: GET
    path: "/slips"
    description: "List slips, optionally filtered by marina."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input:
      - marina_id?
      - status?
      - limit?
      - offset?
    output: "Slip[]"
    side_effects: []

  - method: GET
    path: "/slips/{id}"
    description: "Retrieve one slip."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input: []
    output: Slip
    side_effects: []

  - method: POST
    path: "/slips/{id}/decommission"
    description: "Take a slip out of service."
    roles: [HarborMaster]
    code: 200
    input: []
    output: Slip
    side_effects:
      - "Slip AVAILABLE -> OUT_OF_SERVICE."

  # ---- Tenants ----------------------------------------------------------
  - method: POST
    path: "/tenants"
    description: "Register a tenant."
    roles: [HarborMaster]
    code: 201
    input:
      - email
      - full_name
    output: Tenant
    side_effects: []

  - method: GET
    path: "/tenants"
    description: "List tenants."
    roles: [HarborMaster, MarinaStaff]
    code: 200
    input:
      - limit?
      - offset?
    output: "Tenant[]"
    side_effects: []

  - method: GET
    path: "/tenants/{id}"
    description: "Retrieve one tenant."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  - method: POST
    path: "/tenants/{id}/liveaboard-applications"
    description: "Tenant applies for (or re-applies for) liveaboard status."
    roles: [Tenant]
    code: 200
    input:
      - marina_id
    output: Tenant
    side_effects:
      - "Tenant NONE -> PENDING, or REVOKED -> PENDING."

  - method: POST
    path: "/tenants/{id}/liveaboard-approve"
    description: "HarborMaster approves a pending liveaboard application."
    roles: [HarborMaster]
    code: 200
    input:
      - marina_id
    output: Tenant
    side_effects:
      - "Tenant PENDING -> APPROVED."
      - "Marina.liveaboard_current_count += 1."

  - method: POST
    path: "/tenants/{id}/liveaboard-deny"
    description: "HarborMaster denies a pending liveaboard application."
    roles: [HarborMaster]
    code: 200
    input: []
    output: Tenant
    side_effects:
      - "Tenant PENDING -> NONE."

  - method: POST
    path: "/tenants/{id}/liveaboard-revoke"
    description: "HarborMaster revokes a previously APPROVED liveaboard tenant."
    roles: [HarborMaster]
    code: 200
    input:
      - marina_id
    output: Tenant
    side_effects:
      - "Tenant APPROVED -> REVOKED."
      - "Marina.liveaboard_current_count -= 1."
      - "Every Lease.is_liveaboard==true for this tenant in RESERVED is CANCELLED (cascade depth 2)."

  # ---- Vessels ----------------------------------------------------------
  - method: POST
    path: "/vessels"
    description: "Create a vessel."
    roles: [Tenant, MarinaStaff, HarborMaster]
    code: 201
    input:
      - tenant_id
      - name
      - loa_ft
      - beam_ft
      - insurance_policy_number
      - insurance_expires_on
      - insurance_coverage_cents
    output: Vessel
    side_effects: []

  - method: GET
    path: "/vessels"
    description: "List vessels, optionally filtered by tenant."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input:
      - tenant_id?
      - limit?
      - offset?
    output: "Vessel[]"
    side_effects: []

  - method: GET
    path: "/vessels/{id}"
    description: "Retrieve one vessel."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  # ---- Leases -----------------------------------------------------------
  - method: POST
    path: "/leases"
    description: "Tenant reserves a slip — create lease in RESERVED."
    roles: [Tenant]
    code: 201
    input:
      - marina_id
      - slip_id
      - tenant_id
      - vessel_id
      - start_date
      - end_date
      - is_liveaboard?
      - expected_slip_version
    output: Lease
    side_effects:
      - "Slip AVAILABLE -> RESERVED."
      - "Slip.version += 1 (OCC parent advance per §1.2.1.slip-reserve-stale)."

  - method: GET
    path: "/leases"
    description: "List leases, optional filters."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input:
      - tenant_id?
      - slip_id?
      - marina_id?
      - vessel_id?
      - status?
      - limit?
      - offset?
    output: "Lease[]"
    side_effects: []

  - method: GET
    path: "/leases/{id}"
    description: "Retrieve one lease."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: POST
    path: "/leases/{id}/check-in"
    description: "Check vessel into reserved slip — Lease RESERVED -> ACTIVE."
    roles: [MarinaStaff, HarborMaster]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "Slip RESERVED -> OCCUPIED."
      - "Lease nightly_rate_cents and total_cost_cents pinned (calculations §1.3)."

  - method: POST
    path: "/leases/{id}/check-out"
    description: "Check vessel out — Lease ACTIVE -> ENDED."
    roles: [MarinaStaff, HarborMaster]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "Slip OCCUPIED -> AVAILABLE (or RESERVED if waitlist head promotes; cascade depth 3 — see §1.2 Slip)."
      - "Marina.liveaboard_current_count decremented if applicable."

  - method: POST
    path: "/leases/{id}/cancel"
    description: "Tenant cancels a reserved lease — Lease RESERVED -> CANCELLED."
    roles: [Tenant]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "Slip RESERVED -> AVAILABLE."

  # ---- PumpOut ----------------------------------------------------------
  - method: POST
    path: "/pump-out-requests"
    description: "Tenant requests pump-out service against an ACTIVE lease."
    roles: [Tenant]
    code: 201
    input:
      - lease_id
    output: PumpOutRequest
    side_effects:
      - "PumpOutRequest created in PENDING."

  - method: GET
    path: "/pump-out-requests"
    description: "List pump-out requests, optionally filtered by lease."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input:
      - lease_id?
      - status?
      - limit?
      - offset?
    output: "PumpOutRequest[]"
    side_effects: []

  - method: GET
    path: "/pump-out-requests/{id}"
    description: "Retrieve one pump-out request."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input: []
    output: PumpOutRequest
    side_effects: []

  - method: POST
    path: "/pump-out-requests/{id}/complete"
    description: "MarinaStaff marks a pump-out request COMPLETED."
    roles: [MarinaStaff, HarborMaster]
    code: 200
    input: []
    output: PumpOutRequest
    side_effects:
      - "PumpOutRequest PENDING -> COMPLETED."
      - "PumpOutRequest.charge_cents pinned per calculations.pumpout_charge."

  - method: POST
    path: "/pump-out-requests/{id}/cancel"
    description: "Tenant cancels a pending pump-out request."
    roles: [Tenant]
    code: 200
    input: []
    output: PumpOutRequest
    side_effects:
      - "PumpOutRequest PENDING -> CANCELLED."

  # ---- Tow assist -------------------------------------------------------
  - method: POST
    path: "/tow-assist-events"
    description: "Dispatch tow assistance for a tenant's vessel — synchronous evaluation."
    roles: [Tenant, MarinaStaff, HarborMaster]
    code: 201
    input:
      - tenant_id
      - vessel_id
      - marina_id
      - incident_distance_nm
    output: TowAssistEvent
    side_effects:
      - "TowAssistEvent created with outcome computed per calculations.tow_assistance_dispatch (COVERED | OUT_OF_RADIUS | INSURANCE_INVALID)."

  - method: GET
    path: "/tow-assist-events"
    description: "List tow assistance events, optionally filtered by tenant/vessel/marina."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input:
      - tenant_id?
      - vessel_id?
      - marina_id?
      - limit?
      - offset?
    output: "TowAssistEvent[]"
    side_effects: []

  - method: GET
    path: "/tow-assist-events/{id}"
    description: "Retrieve one tow-assist event."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input: []
    output: TowAssistEvent
    side_effects: []

  # ---- Transfer Waitlist ------------------------------------------------
  - method: POST
    path: "/transfer-waitlist"
    description: "Tenant requests transfer to a different slip in the same marina."
    roles: [Tenant]
    code: 201
    input:
      - marina_id
      - tenant_id
      - from_lease_id
      - target_slip_id
    output: TransferWaitlistEntry
    side_effects:
      - "TransferWaitlistEntry created in QUEUED; position computed."

  - method: GET
    path: "/transfer-waitlist"
    description: "List transfer-waitlist entries, optionally filtered."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input:
      - marina_id?
      - tenant_id?
      - target_slip_id?
      - from_lease_id?
      - status?
      - limit?
      - offset?
    output: "TransferWaitlistEntry[]"
    side_effects: []

  - method: GET
    path: "/transfer-waitlist/{id}"
    description: "Retrieve one transfer-waitlist entry."
    roles: [HarborMaster, MarinaStaff, Tenant]
    code: 200
    input: []
    output: TransferWaitlistEntry
    side_effects: []

  - method: POST
    path: "/transfer-waitlist/{id}/cancel"
    description: "Tenant cancels their own queued transfer waitlist entry."
    roles: [Tenant]
    code: 200
    input: []
    output: TransferWaitlistEntry
    side_effects:
      - "TransferWaitlistEntry QUEUED -> CANCELLED."
      - "queue positions recomputed."

  - method: POST
    path: "/transfer-waitlist/expire-stale"
    description: "HarborMaster sweeps QUEUED waitlist entries older than WAITLIST_TTL_DAYS."
    roles: [HarborMaster]
    code: 200
    input: []
    output: "TransferWaitlistEntry[]"
    side_effects:
      - "Each QUEUED entry whose age >= WAITLIST_TTL_DAYS transitions to EXPIRED; positions recomputed."

  # ---- Test-driving (clock control) -------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: pin the server's current UTC clock to a fixed instant. Outside the public business surface; declared per §1.5 priority ladder rung 3 because no real-world endpoint resets the system clock."
    roles: [HarborMaster]
    code: 200
    input:
      - to_iso8601
    output: "{ now_utc: datetime }"
    side_effects:
      - "Server clock pinned for subsequent insurance-validity / waitlist TTL checks."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID header on a protected endpoint."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role is not authorized for this endpoint per §1.7 RBAC."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist (validated left-to-right in path, then body refs)."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state from which the requested transition is permitted (see §1.2)."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch: expected_<parent>_version does not equal current parent.version (see §1.2.1.slip-reserve-stale)."

  - id: ERR_INSURANCE_INVALID
    http: 422
    condition: "Vessel insurance failed VALID gate on Lease check-in OR tow-assist dispatch step 1."

  - id: ERR_LIVEABOARD_NOT_ALLOWED
    http: 422
    condition: "Liveaboard lease blocked: either Slip.liveaboard_allowed == false or Tenant.liveaboard_status != APPROVED."

  - id: ERR_SLIP_SIZE_MISMATCH
    http: 422
    condition: "Vessel.loa_ft > Slip.length_ft or Vessel.beam_ft > Slip.beam_ft."

  - id: ERR_SLIP_DATE_CONFLICT
    http: 409
    condition: "Requested Lease window overlaps an existing RESERVED or ACTIVE Lease on the same slip (half-open intersect)."

  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "Lease.start_date >= Lease.end_date."

  - id: ERR_LIVEABOARD_QUOTA_EXCEEDED
    http: 409
    condition: "Marina.liveaboard_current_count >= Marina.liveaboard_cap at the moment of liveaboard approval."

  - id: ERR_VESSEL_TENANT_MISMATCH
    http: 422
    condition: "Vessel.tenant_id != Lease.tenant_id."

  - id: ERR_WAITLIST_INELIGIBLE
    http: 422
    condition: "Tenant lacks ACTIVE lease at the marina, or from_lease_id does not match, or target_slip_id wrong marina."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request body fails endpoint input schema (missing required fields, wrong types, invalid enums)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HarborMaster
    description: "Senior operator with full authority — marina/slip CRUD, liveaboard approval/revocation, decommission, waitlist sweep, clock control. Superset of MarinaStaff's powers."
    identity: "opaque"
    exclusive_operations:
      - "POST /marinas"
      - "POST /marinas/{id}/slips"
      - "POST /slips/{id}/decommission"
      - "POST /tenants"
      - "POST /tenants/{id}/liveaboard-approve"
      - "POST /tenants/{id}/liveaboard-deny"
      - "POST /tenants/{id}/liveaboard-revoke"
      - "POST /transfer-waitlist/expire-stale"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /leases/{id}/check-in"
      - "POST /leases/{id}/check-out"
      - "POST /pump-out-requests/{id}/complete"
      - "POST /tow-assist-events"
      - "POST /vessels"
      - "GET endpoints"

  - name: MarinaStaff
    description: "Day-to-day operator handling check-in / check-out / pump-out completion."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /leases/{id}/check-in"
      - "POST /leases/{id}/check-out"
      - "POST /pump-out-requests/{id}/complete"
      - "POST /tow-assist-events"
      - "POST /vessels"
      - "GET endpoints"

  - name: Tenant
    description: "End user — boat owner. Acts on own resources only. X-User-ID equals Tenant.id."
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /tenants/{id}/liveaboard-applications"
      - "POST /leases"
      - "POST /leases/{id}/cancel"
      - "POST /pump-out-requests"
      - "POST /pump-out-requests/{id}/cancel"
      - "POST /transfer-waitlist"
      - "POST /transfer-waitlist/{id}/cancel"
    shared_operations:
      - "POST /vessels"
      - "POST /tow-assist-events"
      - "GET endpoints (scoped to self)"
