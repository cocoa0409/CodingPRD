      - name: lead_state_selection_ranks_only_resourced_states_and_refuses_an_unresourced_panel
        claim_type: input_set_filtering
        grounds:
          - calculations.lead_state_selection
          - validations[priority 63 ERR_NO_ELIGIBLE_LEAD_STATE]
          - entities.MultistateCollaboration.fields.lead_state_code
        distinguishing_aspect: |
          Lead selection filters before it ranks, so a state with more than twice the policy count loses
          to a smaller state purely because it has no examiner resources. When the filter empties the
          candidate set the request is refused outright and - critically - no MultistateCollaboration
          row is created, so the examination can be retried with a corrected panel. A resourced tie on
          policy count then falls through to the state_code ascending tiebreaker.
