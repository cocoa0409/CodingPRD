            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "102", floor: 1, stack_index: 2, bedrooms: 1 }, as: ProgramAdmin, captures: { u102: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "201", floor: 2, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { u201: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "104", floor: 1, stack_index: 4, bedrooms: 1 }, as: ProgramAdmin, captures: { u104: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${u101}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "BED_BUGS", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { i101: "$.data.id" } }
            - { call: "POST /pest/inspections/${i101}/complete", payload: { live_sightings: 10, evidence_count: 0, bed_bug_positive: true }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /pest/units/${u102}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "BED_BUGS", scheduled_for: "2026-08-05T10:00:00Z" }, as: PropertyManager, captures: { i102: "$.data.id" } }
            - { call: "POST /pest/inspections/${i102}/complete", payload: { live_sightings: 10, evidence_count: 0, bed_bug_positive: true }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /pest/units/${u201}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "BED_BUGS", scheduled_for: "2026-08-05T11:00:00Z" }, as: PropertyManager, captures: { i201: "$.data.id" } }
