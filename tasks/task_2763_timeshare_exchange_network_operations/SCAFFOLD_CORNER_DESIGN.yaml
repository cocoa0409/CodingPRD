            - "obligation_units == 3, counted_by_stay_year == 2 and shortfall_by_stay_year == 1 — the WITHDRAWN TWO_BR week is excluded even though its check-in date is inside the year"
            - "counted_by_deposit_date == 2 and shortfall_by_deposit_date == 1; the status filter applies to both variants, so the divergence here is zero"
            - "deposits_committed_count == 2 and committed_nights == 16, both decremented by the withdrawal"
            - "GET /exchange-network/deposits/${dep2} — deposit_status \"WITHDRAWN\" and the row is still retrievable; it is filtered out of the aggregate, not deleted"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 138 (82 + 56, the withdrawn 107 reversed)"

      - name: settlement_reconciliation_writes_no_ledger_row_when_delta_is_zero
        claim_type: reconciliation
        grounds: ["calculations.deposit_settlement_reconciliation", "invariants.INV_POWER", "entities.LedgerEntry.entry_type"]
        distinguishing_aspect: >-
          The reconciliation posting is conditional on a non-zero delta. When the matching run happens
          at the same clock instant the deposit was banked, settlement_power equals awarded_power and
          the SETTLEMENT_ADJUSTMENT row must be absent — not present with power_delta 0. That absence
          is what keeps the ledger a faithful audit trail rather than a stream of no-ops, and the
          EXCHANGE_DEBIT that does fire must be posted against the requester, not the depositor.
        test_recipe:
          setup: >-
            The canonical chain at a single clock instant: tier PLUS, Resort A affiliated, M1 banks a
            ONE_BR week checking in 2027-06-15 worth 82, M2 banks a TWO_BR week worth 107 and files a
            DEPOSIT_FIRST ONE_BR request over 2027-06-01..2027-06-30 charged 23060, and one matching
            run — still at 2026-08-01T00:00:00Z — reserves M1's week for it.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_m1: "$.data.id" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Ravi Bergqvist", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_m2: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30", deposit_id: "${dep_m2}" }
              captures: { req: "$.data.id" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "same-instant pairing" }
              captures: { run1: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/confirmations"
              as: Member
              as_user_id: "${m2}"
              payload: { exchange_request_id: "${req}" }
              captures: { conf: "$.data.id" }
          assert:
            - "GET /exchange-network/deposits/${dep_m1} — awarded_power == 82 and settlement_power == 82, so the reconciliation delta is exactly 0"
            - "HTTP 201; data.power_debited == 82, data.status == \"CONFIRMED\" and data.awarded_deposit_id == \"${dep_m1}\""
            - "GET /exchange-network/ledger-entries?entry_type=SETTLEMENT_ADJUSTMENT — total_count == 0; a zero delta writes nothing at all"
            - "GET /exchange-network/ledger-entries?member_id=${m2}&entry_type=EXCHANGE_DEBIT — total_count == 1 with power_delta -82, posted against the requester"
            - "GET /exchange-network/members/${m2} — trading_power_balance == 25 (107 - 82); GET /exchange-network/members/${m1} — trading_power_balance still 82"
            - "GET /exchange-network/deposits/${dep_m1} — deposit_status \"USED\" and remaining_power still 82; the depositor's credit is untouched by the exchange"

      - name: deposit_trading_power_applies_two_separate_roundings
        claim_type: correct_result
        excluded_because:
          difficulty_instance: deposit_power_nested_rounding_order
          rationale: >-
            The pinned three-step order and the divergence between double rounding and a single
            terminal rounding are the entire subject of the §1.8 combinatorial_formula instance, which
            contrasts 62 against the naive 61 on the same inputs. Repeating it at corner level would
            add no discrimination.

      - name: cancellation_selects_full_or_prorated_restore_by_days_out
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: full_restore_at_exactly_thirty_days_before_check_in
          rationale: >-
            Variant selection for cancellation_settlement is exercised at its exact boundary by the
            §1.8 boundary_precision_check instance, which runs the 30-day and 29-day cases side by side
            and checks the haircut, the surcharge and the getaway listing. A corner probe would only
            re-assert the FULL_RESTORE half.

  # ===========================================================================
  - section: validations
    instances:

      - name: dues_payment_below_the_tier_annual_amount_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority 31]", "errors[ERR_INSUFFICIENT_DUES_PAYMENT]"]
        distinguishing_aspect: >-
          The dues gate is an inequality against the member's own tier, not a fixed amount, and one
          cent short must still fail with 422 rather than partially crediting the wallet. The member
          must remain PENDING_PAYMENT afterwards, which proves the check runs before the enrollment
          transition rather than as a compensating rollback.
        test_recipe:
          setup: >-
            Tier PLUS with annual_dues_cents 19900. Member M1 enrolled on PLUS, still
            PENDING_PAYMENT with wallet_credit_cents 0 and dues_paid_through null.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
          trigger:
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 19899, paid_through_date: "2027-08-31", expected_member_version: "${m1_v}" }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with error_id ERR_INSUFFICIENT_DUES_PAYMENT — one cent below annual_dues_cents"
            - "GET /exchange-network/members/${m1} — enrollment_status still \"PENDING_PAYMENT\", wallet_credit_cents 0, dues_paid_through null and version still 1"
            - "GET /exchange-network/ledger-entries?member_id=${m1} — total_count == 0; no partial DUES_PAYMENT row was written"
            - "a repeat of the same call with amount_cents 19900 succeeds with wallet_credit_cents 0 and enrollment_status \"ACTIVE\", confirming the boundary is inclusive"

      - name: third_active_request_beyond_the_tier_cap_is_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority 25]", "errors[ERR_ACTIVE_REQUEST_LIMIT]", "entities.MembershipTier.max_active_requests"]
        distinguishing_aspect: >-
          The cap is an aggregate over the member's own non-terminal requests measured against a
          per-tier limit, so the failing call is only distinguishable by counting rows in
          {SUBMITTED, WAITLISTED, MATCHED}. Because the wallet is charged at creation, the rejection
          must leave wallet_credit_cents untouched — the cheapest wrong implementation debits first
          and checks afterwards.
        test_recipe:
          setup: >-
            Tier BASIC with max_active_requests 1, annual_dues_cents 9900, base_exchange_fee_cents
            21900, priority_surcharge_cents 0 and deposit_first_bonus_pct 0. Resort A affiliated with a
            GOLD band. Member M1 on BASIC pays 100000 in dues, leaving wallet 90100, and banks two
            ONE_BR weeks at Resort A checking in 2027-06-15 and 2027-06-25, each worth 82. M1 files one
            DEPOSIT_FIRST request pinned to 2027-06-15: with a zero deposit-first bonus the budget is
            floor(82 * 100 / 100) = 82, exactly the estimate, so power_gap is 0, the subtotal is 21900,
            the credit is floor(21900 * 10 / 100) = 2190 and the processing fee is 2000 — a charge of
            21710 leaving wallet 68390 and active_request_count 1.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "BASIC", annual_dues_cents: 9900, base_exchange_fee_cents: 21900, priority_surcharge_cents: 0, priority_window_days: 180, deposit_first_bonus_pct: 0, max_active_requests: 1, cancellation_fee_cents: 9900, reinstatement_fee_cents: 12900, extension_fee_cents_per_month: 3900 }
              captures: { basic_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
