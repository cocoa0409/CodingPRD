# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x >= 2 instances each. Every setup chain replays from
# empty-DB using only SCAFFOLD.yaml §1.5 endpoints. All formula-derived
# literals were computed by executing the pinned §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: ranking_provisional_vs_verified_divergence
        grounds:
          - calculations.ranking_score
          - entities.Application.fields.provisional_score
          - entities.Application.fields.ranking_score
        distinguishing_aspect: |
          Entity domain = Application ranking. Two valid readings of "the
          ranking score" produce different numbers for the SAME application:
          provisional (self_reported_answers {40,30,10} -> base 75 -> +10 -> 85)
          vs verified (planner-adjusted {20,10,10} -> base 35 -> +0 -> 35).
        test_recipe:
          setup:
            - "Program OPEN with pool GENERAL 1000000, COVER_CROP rate 15000/18000, criteria SOIL_HEALTH(1.0,40) WATER_QUALITY(1.0,40) WILDLIFE(0.5,20)"
            - "Applicant a1 (hu NONE, parcel P-100); application DRAFT with self_reported_answers {SOIL_HEALTH:40, WATER_QUALITY:30, WILDLIFE:10}"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "COVER_CROP", unit: "ACRE", standard_rate_cents: 15000, hu_rate_cents: 18000, lifespan_years: 5 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "WATER_QUALITY", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "WILDLIFE", weight: 0.5, max_points: 20 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A One", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "COVER_CROP", quantity: 10 } ], self_reported_answers: { SOIL_HEALTH: 40, WATER_QUALITY: 30, WILDLIFE: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}", captures: { prov: $.data.provisional_score } }
          trigger:
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 20, WATER_QUALITY: 10, WILDLIFE: 10 } }, as: ConservationPlanner, captures: { verif: $.data.ranking_score, est: $.data.estimated_obligation_cents } }
          assert:
            - "Application.${app}.provisional_score == 85 (captured prov == 85)"
            - "Application.${app}.ranking_score == 35 (captured verif == 35)"
            - "provisional_score != ranking_score (85 != 35): same application, two variants, different results"
            - "estimated_obligation_cents == 150000 (10 ac x 15000 standard rate)"

      - name: scheduled_vs_certified_payment_divergence
        grounds:
          - calculations.certified_payment
          - calculations.scheduled_amount
          - entities.ContractPracticeItem.fields.scheduled_amount_cents
          - entities.PaymentRequest.fields.computed_amount_cents
        distinguishing_aspect: |
          Entity domain = ContractPracticeItem/PaymentRequest money (distinct
          from Application ranking in the sibling instance). scheduled_estimate
          (planned 1000 ft x HU 360 = 360000) vs certified_final
          (min(round(900 x 360), documented 400000) = 324000) for the same item.
        test_recipe:
          setup:
            - "HU applicant (LIMITED_RESOURCE) funded from HU pool; contract OBLIGATED with FENCE item planned_quantity 1000 (scheduled 360000)"
            - "item INSTALLED then CERTIFIED with certified_quantity 900"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "HU_LIMITED_RESOURCE", allocated_cents: 500000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "H U", hu_category: "LIMITED_RESOURCE", parcel_ids: ["P-200"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-200", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { item: $.data.id, sched: $.data.scheduled_amount_cents, rate: $.data.applicable_rate_cents } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/practice-items/${item}/report-installed", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/practice-items/${item}/certify", payload: { certified_quantity: 900 }, as: ConservationPlanner, as_user_id: "planner-1" }
          trigger:
            - { call: "POST /eqip/payment-requests", payload: { contract_id: "${con}", practice_item_id: "${item}", documented_cost_cents: 400000, documentation_refs: ["receipt-1"] }, as: Applicant, as_user_id: "${a1}", captures: { req: $.data.id, computed: $.data.computed_amount_cents } }
          assert:
            - "ContractPracticeItem.${item}.scheduled_amount_cents == 360000 (captured sched; planned 1000 x HU 360)"
            - "ContractPracticeItem.${item}.applicable_rate_cents == 360 (HU snapshot, captured rate)"
            - "PaymentRequest.${req}.computed_amount_cents == 324000 (min(round_half_up(900*360)=324000, 400000))"
            - "scheduled 360000 != computed 324000: scheduled_estimate and certified_final diverge on identical item"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: obligated_amount_per_item_rounding_order
        grounds:
          - calculations.obligated_amount
          - calculations.scheduled_amount
        distinguishing_aspect: |
          Mode (b) nested rounding: rounding order is pinned per-item then sum.
          Two items of 2.5 ac x 15001 cents: per-item round_half_up(37502.5)=37503
          each -> obligated 75006; the alternative round-of-sum gives 75005.
          Also estimated_obligation (single 5.0-ac line) == 75005 != 75006.
        test_recipe:
          setup:
            - "Program with COVER_CROP rate 15001/15001 (odd cents), one criterion; standard applicant; application planned COVER_CROP 5.0 ac, SELECTED; contract DRAFT with TWO items of 2.5 ac each"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin, captures: { pool: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "COVER_CROP", unit: "ACRE", standard_rate_cents: 15001, hu_rate_cents: 15001, lifespan_years: 5 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A One", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "COVER_CROP", quantity: 5.0 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner, captures: { est: $.data.estimated_obligation_cents } }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "COVER_CROP", planned_quantity: 2.5, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { it1: $.data.id, s1: $.data.scheduled_amount_cents } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "COVER_CROP", planned_quantity: 2.5, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { it2: $.data.id, s2: $.data.scheduled_amount_cents } }
          trigger:
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin, captures: { obamt: $.data.obligated_amount_cents } }
          assert:
            - "item scheduled amounts: s1 == 37503 and s2 == 37503 (round_half_up(2.5*15001)=round_half_up(37502.5)=37503)"
            - "Contract.${con}.obligated_amount_cents == 75006 (sum of per-item rounded)"
            - "obligated_amount_cents != 75005 (round-of-sum alternative rejected)"
            - "application estimated_obligation_cents == 75005 (single-line rounding of 5.0*15001) — estimate and obligation legitimately differ by 1 cent"
            - "FundingPool.${pool}.obligated_cents == 75006 after obligate"

      - name: certified_payment_documented_cap_min_interaction
        grounds:
          - calculations.certified_payment
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: computed = min(round(certified_qty
          x HU-conditional rate), documented_cost). With qty 900 x std 300 = 270000
          but documented_cost 200000, the documented cap binds: computed == 200000.
        test_recipe:
          setup:
            - "Standard applicant; FENCE item planned 1000 (scheduled 300000); CERTIFIED at quantity 900"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A One", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { item: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/practice-items/${item}/report-installed", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/practice-items/${item}/certify", payload: { certified_quantity: 900 }, as: ConservationPlanner, as_user_id: "planner-1" }
          trigger:
            - { call: "POST /eqip/payment-requests", payload: { contract_id: "${con}", practice_item_id: "${item}", documented_cost_cents: 200000, documentation_refs: ["receipt-1"] }, as: Applicant, as_user_id: "${a1}", captures: { req: $.data.id, computed: $.data.computed_amount_cents } }
          assert:
            - "PaymentRequest.${req}.computed_amount_cents == 200000 (documented-cost cap binds over round(900*300)=270000)"
            - "computed_amount_cents != 270000 — min() branch selection is observable"

      - name: ranking_tier_bonus_keyed_on_base_not_final
        grounds:
          - calculations.ranking_score
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the tier bonus depends on the
          score, which then includes the bonus. Pinned order: base -> tier -> add
          -> cap. base 60 -> +10 -> 70; base 55 -> +5 -> 60 (NOT re-tiered to 70).
        test_recipe:
          setup:
            - "Program OPEN with three criteria; two submitted applications by two applicants"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "COVER_CROP", unit: "ACRE", standard_rate_cents: 15000, hu_rate_cents: 18000, lifespan_years: 5 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "WATER_QUALITY", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "WILDLIFE", weight: 0.5, max_points: 20 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "B Two", hu_category: "NONE", parcel_ids: ["P-101"] }, as: ProgramAdmin, captures: { ab: $.data.id } }
            - { call: "POST /eqip/applicants", payload: { legal_name: "C Three", hu_category: "NONE", parcel_ids: ["P-102"] }, as: ProgramAdmin, captures: { ac: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${ab}", parcel_id: "P-101", planned_practices: [ { practice_code: "COVER_CROP", quantity: 1 } ], self_reported_answers: { SOIL_HEALTH: 40, WATER_QUALITY: 20, WILDLIFE: 0 } }, as: Applicant, as_user_id: "${ab}", captures: { appb: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${ac}", parcel_id: "P-102", planned_practices: [ { practice_code: "COVER_CROP", quantity: 1 } ], self_reported_answers: { SOIL_HEALTH: 40, WATER_QUALITY: 10, WILDLIFE: 10 } }, as: Applicant, as_user_id: "${ac}", captures: { appc: $.data.id } }
            - { call: "POST /eqip/applications/${appb}/submit", payload: {}, as: Applicant, as_user_id: "${ab}" }
            - { call: "POST /eqip/applications/${appc}/submit", payload: {}, as: Applicant, as_user_id: "${ac}" }
          trigger:
            - { call: "POST /eqip/applications/${appb}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 40, WATER_QUALITY: 20, WILDLIFE: 0 } }, as: ConservationPlanner, captures: { score_b: $.data.ranking_score } }
            - { call: "POST /eqip/applications/${appc}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 40, WATER_QUALITY: 10, WILDLIFE: 10 } }, as: ConservationPlanner, captures: { score_c: $.data.ranking_score } }
          assert:
            - "Application.${appb}.ranking_score == 70 (base 60 -> tier HIGH +10 -> 70)"
            - "Application.${appc}.ranking_score == 60 (base 55 -> tier MID +5 -> 60; NOT 70 — tier keyed on base, not on the bonused total)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_modification_cycle_obligated_roundtrip
        grounds:
          - state_machines.Contract.OBLIGATED_to_MODIFICATION_PENDING
          - state_machines.Contract.MODIFICATION_PENDING_to_OBLIGATED
          - concurrency_rules[modification-reject-stale-contract]
        distinguishing_aspect: |
          Contract has a CYCLE: OBLIGATED -> MODIFICATION_PENDING -> OBLIGATED,
          traversable repeatedly (reject once, then request again and approve).
          Distinct entity from the sibling instance (ContractPracticeItem).
        test_recipe:
          setup:
            - "Contract OBLIGATED with one FENCE item (1000 ft, scheduled 300000); version after obligate == 3 (create 1, item add 2, obligate 3)"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A One", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { item: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "GET /eqip/contracts/${con}", payload: {}, as: ProgramAdmin, captures: { v_obl: $.data.version } }
            - { call: "POST /eqip/contracts/${con}/modifications", payload: { kind: "EXTEND_DEADLINE", practice_item_id: "${item}", new_deadline: "2027-06-01T00:00:00Z" }, as: Applicant, as_user_id: "${a1}", captures: { mod1: $.data.id } }
            - { call: "GET /eqip/contracts/${con}", payload: {}, as: ProgramAdmin, captures: { v_modp: $.data.version, st_modp: $.data.status } }
            - { call: "POST /eqip/modifications/${mod1}/reject", payload: { expected_contract_version: "${v_modp}" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /eqip/contracts/${con}/modifications", payload: { kind: "EXTEND_DEADLINE", practice_item_id: "${item}", new_deadline: "2027-06-01T00:00:00Z" }, as: Applicant, as_user_id: "${a1}", captures: { mod2: $.data.id } }
            - { call: "GET /eqip/contracts/${con}", payload: {}, as: ProgramAdmin, captures: { v_modp2: $.data.version } }
            - { call: "POST /eqip/modifications/${mod2}/approve", payload: { expected_contract_version: "${v_modp2}" }, as: ProgramAdmin, captures: { mod2_status: $.data.status } }
            - { call: "GET /eqip/practice-items/${item}", payload: {}, as: ProgramAdmin, captures: { item_deadline: $.data.implementation_deadline } }
            - { call: "GET /eqip/contracts/${con}", payload: {}, as: ProgramAdmin, captures: { st_final: $.data.status, v_final: $.data.version } }
          assert:
            - "cycle hop 1: contract reached MODIFICATION_PENDING (captured st_modp == MODIFICATION_PENDING)"
            - "cycle hop 2: reject returned contract to OBLIGATED and modification ${mod1} is REJECTED"
            - "cycle hop 3: second request + approve succeeded; mod2_status == APPROVED; st_final == OBLIGATED"
            - "item deadline extended: item_deadline == 2027-06-01T00:00:00Z"
            - "version ratchet: v_obl == 3, v_modp == 4, v_modp2 == 6, v_final == 7 (each mutation +1; reject and second request each bumped)"

      - name: practice_item_parallel_dimensions_evolve_independently
