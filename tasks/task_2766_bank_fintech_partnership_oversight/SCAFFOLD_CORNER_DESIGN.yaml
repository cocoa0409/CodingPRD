          - calculations.required_reserve_cents.input_set
          - calculations.required_reserve_cents.constants
        distinguishing_aspect: "Three batches of identical 100000000 gross are present but only ONE qualifies: the trailing window is (clock - 90 days, clock] on window_end, so the batch ending exactly at the clock is IN and the batch ending after the clock is OUT, and the UNRECONCILED batch is filtered out by status. With the FBO balance at 0 the balance arm contributes 0 and the absolute floor is 250000, so the surviving batch's 150 bps volume arm at 1500000 is what wins the three-way max."
