  # ===========================================================================
  # SECTION 2 — State Machines (Table 2 rows; shape = cyclic)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: recording_an_agreement_advances_it_and_cascades_the_project
        claim_type: valid_transition
        grounds:
          - state_machines.RegulatoryAgreement.DRAFT_to_RECORDED
          - state_machines.Project.PATH_ELECTED_to_AGREEMENT_RECORDED
        distinguishing_aspect: |
          The declared happy-path transition is a two-entity move: the agreement goes
          DRAFT -> RECORDED with doc_number and recorded_at persisted, and the same request
          drags its project PATH_ELECTED -> AGREEMENT_RECORDED. Both versions increment in
          the one call, so the project's version advances even though no project route was
          touched, and the project cannot be moved to AGREEMENT_RECORDED by any other means.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units, approval 2026-01-15) screened SUBJECT and ONSITE elected; a DRAFT agreement exists."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Valid Transition", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "GET /iz-compliance/projects/${p_id}", payload: {}, as: ProgramAdministrator, captures: { p_v_before: $.data.version } }
          trigger:
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-VT-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_v: $.data.version } }
          assert:
            - "HTTP 200 and RegulatoryAgreement.${a_id}.state == RECORDED with doc_number DOC-VT-0001 and recorded_at 2026-08-01"
            - "Project.${p_id}.state == AGREEMENT_RECORDED — cascaded by the agreement route, not by any project route"
            - "Project.${p_id}.version == ${p_v_before} + 1"
            - "RegulatoryAgreement.${a_id}.version == ${a_v} and ${a_v} == 2"
            - "Project.${p_id}.compliance_path is still ONSITE and required_affordable_units is still 1 — recording changes state only"

      - name: newly_created_rows_sit_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.MarketingPlan.initial_state
          - state_machines.RegulatoryAgreement.initial_state
          - state_machines.Household.initial_state
        distinguishing_aspect: |
          Three machines are entered by a plain POST and each lands on its declared initial
          state with its loop and review bookkeeping still empty: MarketingPlan SUBMITTED
          with revision_round 0 and reviewed_by_user_id null, RegulatoryAgreement DRAFT with
          doc_number and recorded_at null, Household REGISTERED with lottery_event_id null.
          None of the three is reachable in a different starting state.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
