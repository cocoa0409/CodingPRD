              as: NetworkAffiliateRelations
              captures: { ag1_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st1_id}/agreements/${ag1_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st1_id}/agreements/${ag1_id}/activate"
