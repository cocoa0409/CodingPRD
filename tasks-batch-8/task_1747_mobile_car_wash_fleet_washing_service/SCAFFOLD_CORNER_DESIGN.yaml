            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_b}", plate: "C1B", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { vb: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_a}", vehicle_ids: ["${va}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { oa_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${oa_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_b}", vehicle_ids: ["${vb}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin, captures: { ob_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${ob_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-C1A", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_a: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_a}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-C1B", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_b: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_b}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech C1A" }, as: PlatformAdmin, captures: { ta: $.data.id } }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech C1B" }, as: PlatformAdmin, captures: { tb: $.data.id } }
