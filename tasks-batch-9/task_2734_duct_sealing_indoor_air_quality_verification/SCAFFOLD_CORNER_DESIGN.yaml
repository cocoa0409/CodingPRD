              payload: { sample_seq: 1, elapsed_seconds: 0, instantaneous_leakage_cfm: 300.0, injection_pressure_pa: 700.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${rejob_id}/leakage-samples"
              payload: { sample_seq: 2, elapsed_seconds: 240, instantaneous_leakage_cfm: 250.0, injection_pressure_pa: 710.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${rejob_id}/leakage-samples"
              payload: { sample_seq: 3, elapsed_seconds: 480, instantaneous_leakage_cfm: 200.0, injection_pressure_pa: 720.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${rejob_id}/leakage-samples"
              payload: { sample_seq: 4, elapsed_seconds: 720, instantaneous_leakage_cfm: 45.0, injection_pressure_pa: 730.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/seal-jobs/${rejob_id}/complete-seal"
              payload: { sealant_lbs_used: 2.1 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "POST", method: "DUCT_BLASTER", window_start_at: "2026-08-03T13:00:00Z", window_end_at: "2026-08-03T14:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { post2_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${post2_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_1", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${post2_id}/record"
              payload: { measured_leakage_cfm: 45.0, ambient_temp_f: 78.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${post2_id}/review"
              payload: { decision: "ACCEPT", review_note: "re-test verified" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "GET /duct-sealing/seal-jobs/${rejob_id}"
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { rejob_v: $.data.version }
            - call: "POST /duct-sealing/verification-reports"
              payload: { seal_job_id: "${rejob_id}", post_test_id: "${post2_id}", expected_seal_job_version: "${rejob_v}" }
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { report2_id: $.data.id }
          trigger:
            - call: "POST /duct-sealing/verification-reports/${report2_id}/issue"
              payload: { signature_note: "re-test guarantee met at 85.00 percent" }
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { report2_status: $.data.status, red2: $.data.reduction_pct_system_basis }
          assert:
            - "Setup: ${insp_outcome} == FAIL and SealJob.${job_id}.status == RETEST_REQUIRED before the re-test job was created"
            - "Setup: creating the re-test job reopened the system — DuctSystem.${ds1_id}.seal_status was driven VERIFIED -> SEAL_PENDING and active_seal_job_id == ${rejob_id}"
            - "Trigger: HTTP 200, ${report2_status} == ISSUED and ${red2} == 85.00 ((300.00 - 45.00) / 300.00 * 100)"
            - "Child: SealJob.${rejob_id}.status == VERIFIED and retest_of_job_id == ${job_id}"
            - "Bubble-up: SealJob.${job_id}.status == RETEST_CLOSED (terminal)"
            - "DuctSystem.${ds1_id}.seal_status == VERIFIED and working_leakage_cfm25 == 45.00 and sealed_leakage_reduction_cfm == 255.00"
            - "VerificationReport.${report_id}.status == CORRECTION_REQUIRED (the first report is untouched by the re-test round)"
            - "Technician.${tech1_id}.open_seal_job_count == 0"

      - name: pause_and_resume_cycle_on_an_injecting_job
        claim_type: cyclic
        grounds:
          - state_machines.SealJob.INJECTING_to_PAUSED
          - state_machines.SealJob.PAUSED_to_INJECTING
        excluded_because:
          difficulty_instance: non_linear_state_machine / seal_job_injecting_pause_resume_cycle
          rationale: "The INJECTING <-> PAUSED loop, pause_count accumulation and stall_flag clearing on resume are all asserted by that §1.8 instance."

      - name: asbestos_confirmation_cascades_down_to_claim_withdrawal
        claim_type: cascade_down
        grounds:
          - state_machines.DuctSystem.PENDING_SCREENING_to_EXCLUDED
        excluded_because:
          difficulty_instance: transitive_cascade / asbestos_confirmation_cascade_depth_four
          rationale: "The four-hop DuctSystem -> SealJob -> VerificationReport -> RebateClaim cascade is asserted hop-by-hop by that §1.8 instance."

      - name: manual_abort_compensates_the_duct_system_ledger
        claim_type: compensation
        grounds:
          - state_machines.SealJob.INJECTING_to_ABORTED_MANUAL
        excluded_because:
          difficulty_instance: compensating_invariant / abort_restores_duct_leakage_ledger_identity
          rationale: "The abort compensation and the restored working/reduction/baseline identity are asserted by that §1.8 instance."

      - name: returned_claim_resubmit_cycle
        claim_type: cyclic
        grounds:
          - state_machines.RebateClaim.RETURNED_FOR_CORRECTION_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / rebate_claim_returned_for_correction_resubmit_cycle
          rationale: "The SUBMITTED <-> RETURNED_FOR_CORRECTION loop, resubmission_count and the frozen payable_cents are asserted by that §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: combustion_verdict_is_marginal_at_the_exact_spillage_and_co_boundaries
        claim_type: threshold
        grounds:
          - calculations.combustion_safety_verdict
          - entities.CombustionTest.fields.verdict
          - endpoints[POST /duct-sealing/projects/{id}/combustion-tests]
        distinguishing_aspect: "Both threshold boundaries are inclusive-on-the-MARGINAL-side: spillage_seconds == SPILLAGE_MAX_SECONDS (60) is MARGINAL not FAIL, co_ppm_air_free == CO_MAX_PPM (100 for a water heater) is MARGINAL not FAIL, and only 101 ppm crosses into FAIL."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Project with one gas appliance"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-A", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 60, co_ppm_air_free: 30.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { v_spill60: $.data.verdict }
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-B", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 10, co_ppm_air_free: 100.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { v_co100: $.data.verdict }
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-C", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 10, co_ppm_air_free: 101.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { v_co101: $.data.verdict }
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-D", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 59, co_ppm_air_free: 49.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { v_clean: $.data.verdict }
          assert:
            - "All four calls: HTTP 201"
            - "${v_spill60} == MARGINAL (spillage_seconds == 60 hits the boundary exactly)"
            - "${v_co100} == MARGINAL (co_ppm_air_free == CO_MAX_PPM for ATMOSPHERIC_WATER_HEATER)"
            - "${v_co101} == FAIL (one ppm past the ceiling)"
            - "${v_clean} == PASS (59 s spillage and 49 ppm are both below the warn thresholds)"
            - "Project.${proj_id}.status == ACTIVE and safety_hold == false throughout (PRE-phase verdicts never raise the hold)"

      - name: worst_case_depressurization_only_fails_when_the_draft_is_simultaneously_weak
        claim_type: threshold
        grounds:
          - calculations.combustion_safety_verdict
          - calculations.combustion_safety_verdict.constants.WCD_LIMIT_PA
          - calculations.combustion_safety_verdict.constants.DRAFT_MIN_PA
        distinguishing_aspect: "The non-linear clause: 6.0 Pa of worst-case depressurization exceeds the 5.0 Pa water-heater limit yet yields PASS while the draft holds at 2.5 Pa; the identical depressurization with a 0.5 Pa draft (below DRAFT_MIN_PA 1.0) becomes FAIL. Neither input alone decides the verdict."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Project"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-STRONG-DRAFT", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 5, co_ppm_air_free: 20.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 6.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { v_strong: $.data.verdict }
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-WEAK-DRAFT", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 5, co_ppm_air_free: 20.0, draft_pressure_pa: 0.5, worst_case_depressurization_pa: 6.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { v_weak: $.data.verdict }
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-WEAK-DRAFT-LOW-WCD", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 5, co_ppm_air_free: 20.0, draft_pressure_pa: 0.5, worst_case_depressurization_pa: 5.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { v_weak_low: $.data.verdict }
          assert:
            - "${v_strong} == PASS (wcd 6.0 > 5.0 but draft 2.5 >= DRAFT_MIN_PA 1.0, so the clause does not fire)"
            - "${v_weak} == FAIL (wcd 6.0 > 5.0 AND draft 0.5 < 1.0)"
            - "${v_weak_low} == PASS (wcd == 5.0 is not strictly greater than the limit, so a weak draft alone is harmless)"
            - "All three rows persist with verdict as computed and performed_by_user_id == 'tech-x'"

      - name: range_appliance_uses_its_own_carbon_monoxide_ceiling
        claim_type: constants_applied
        grounds:
