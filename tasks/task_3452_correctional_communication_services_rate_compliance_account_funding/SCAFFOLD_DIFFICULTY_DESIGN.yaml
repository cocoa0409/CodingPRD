# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3452_correctional_communication_services_rate_compliance_account_funding
# 9 rules x 2 instances = 18 instances. Every fixture literal was computed by
# executing the §1.3 formulas against the pinned inputs.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_gross_vs_net_basis_diverge_on_identical_ledger
        grounds:
          - calculations.site_commission_accrual
          - calculations.regulatory_summary_aggregation
          - entities.FacilityContract.fields.commission_basis
        distinguishing_aspect: |
          Dual-variant divergence on the FacilityContract domain (vs the Account-ledger
          domain of the sibling instance): the SAME three calls (306 cents gross) and the
          SAME deposit fee (25 cents) accrue commission 153 under a GROSS contract but
          141 under a NET contract, because NET subtracts deposit fees before applying
          commission_pct.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Facility F with an ACTIVE GROSS contract (commission_pct 0.5, deposit fee 25) and ACTIVE schedule (connection 100, all per-minute rates 1, message 15, video 500)."
            - "One PREPAID account funded with a 1000-cent deposit (fee 25 -> balance 975); three ended LOCAL calls of 60s/120s/180s -> charges 101/102/103 (total 306)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "ST", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
              captures: { cap_id: $.data.id }
            - call: "POST /comm-services/facilities"
              payload: { name: "GrossNet Facility", state_code: "ST", video_booth_count: 2, video_turnover_minutes: 10, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200, daily_session_limit_per_inmate: 2 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_id}", commission_pct: 0.5, commission_basis: "GROSS", deposit_fee_cents: 25, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /comm-services/contracts/${c1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c1_id}/rate-schedules"
              payload: { local_per_minute_cents: 1, intrastate_per_minute_cents: 1, interstate_per_minute_cents: 1, international_per_minute_cents: 1, connection_fee_cents: 100, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /comm-services/rate-schedules/${s1_id}/activate"
              payload: { expected_contract_version: "${c1_v}" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities/${fac_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-1001", full_name: "Inmate One" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam One", owner_contact: "fam1@x.com" }
              as: FacilityStaff
              captures: { acct_id: $.data.id }
            - call: "POST /comm-services/recipient-numbers"
              payload: { account_id: "${acct_id}", e164_number: "+15550001111", label: "Mom", relationship_type: "FAMILY" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { recip_id: $.data.id, recip_code: $.data.verification_code }
            - call: "POST /comm-services/recipient-numbers/${recip_id}/verify"
              payload: { verification_code: "${recip_code}", consent_to_recording: true }
              as: RecipientParty
              as_user_id: "${recip_id}"
            - call: "POST /comm-services/accounts/${acct_id}/deposits"
              payload: { amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /comm-services/calls"
              payload: { account_id: "${acct_id}", inmate_id: "${inm_id}", recipient_number_id: "${recip_id}", call_type: "LOCAL" }
              as: FacilityStaff
              captures: { call1_id: $.data.id }
            - call: "POST /comm-services/calls/${call1_id}/end"
              payload: { duration_seconds: 60 }
              as: FacilityStaff
            - call: "POST /comm-services/calls"
              payload: { account_id: "${acct_id}", inmate_id: "${inm_id}", recipient_number_id: "${recip_id}", call_type: "LOCAL" }
              as: FacilityStaff
              captures: { call2_id: $.data.id }
            - call: "POST /comm-services/calls/${call2_id}/end"
              payload: { duration_seconds: 120 }
              as: FacilityStaff
            - call: "POST /comm-services/calls"
              payload: { account_id: "${acct_id}", inmate_id: "${inm_id}", recipient_number_id: "${recip_id}", call_type: "LOCAL" }
              as: FacilityStaff
              captures: { call3_id: $.data.id }
            - call: "POST /comm-services/calls/${call3_id}/end"
              payload: { duration_seconds: 180 }
              as: FacilityStaff
          trigger:
            - call: "GET /comm-services/facilities/${fac_id}/regulatory-summary"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { comm_gross: $.data.commission_accrued_cents }
            - call: "POST /comm-services/contracts/${c1_id}/terminate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_id}", commission_pct: 0.5, commission_basis: "NET", deposit_fee_cents: 25, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /comm-services/contracts/${c2_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /comm-services/facilities/${fac_id}/regulatory-summary"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { comm_net: $.data.commission_accrued_cents }
          assert:
            - "first summary: commission_basis == GROSS and comm_gross == 153"
            - "first summary: total_call_revenue_cents == 306, total_billable_minutes == 6, total_deposit_fees_cents == 25"
            - "second summary: commission_basis == NET and comm_net == 141"
            - "comm_gross != comm_net although no call, deposit, or ledger row changed between the two reads"

      - name: refund_payout_simple_balance_vs_lifo_net_identical_ledgers
        grounds:
          - calculations.refund_payout
          - entities.RegulatoryCap.fields.refund_method
          - state_machines.Account.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Dual-variant divergence on the Account-ledger domain (vs the FacilityContract
          domain of the sibling instance): two accounts in two jurisdictions carry
          byte-identical ledgers (deposits 1000+500 with fees 300+300, one 400-cent call,
          balance 500), yet SIMPLE_BALANCE refunds 400 while LIFO_NET refunds 700 because
          the LIFO charge-attribution leaves the oldest deposit intact and returns its 300
          fee.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two jurisdictions: SA (refund_method SIMPLE_BALANCE) and LB (refund_method LIFO_NET), otherwise identical caps (per-minute 25, connection 300, ancillary 500, deposit 500)."
            - "Each jurisdiction has one facility with an ACTIVE contract (deposit fee 300, closure fee 100, commission 0.5 GROSS) and ACTIVE schedule (interstate 25, connection 200)."
            - "Each facility has one inmate and one PREPAID account with the identical ledger: DEPOSIT 1000 (fee 300), DEPOSIT 500 (fee 300), one INTERSTATE call of 480s charged 400 -> balance 500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "SA", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "LB", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "LIFO_NET", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
            - call: "POST /comm-services/facilities"
              payload: { name: "Simple Facility", state_code: "SA", video_booth_count: 2, video_turnover_minutes: 10, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200, daily_session_limit_per_inmate: 2 }
              as: PlatformAdmin
              captures: { fac_sa: $.data.id }
            - call: "POST /comm-services/facilities"
              payload: { name: "Lifo Facility", state_code: "LB", video_booth_count: 2, video_turnover_minutes: 10, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200, daily_session_limit_per_inmate: 2 }
              as: PlatformAdmin
              captures: { fac_lb: $.data.id }
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_sa}", commission_pct: 0.5, commission_basis: "GROSS", deposit_fee_cents: 300, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_sa: $.data.id, c_sa_v: $.data.version }
            - call: "POST /comm-services/contracts/${c_sa}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c_sa}/rate-schedules"
              payload: { local_per_minute_cents: 18, intrastate_per_minute_cents: 21, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 200, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s_sa: $.data.id }
            - call: "POST /comm-services/rate-schedules/${s_sa}/activate"
              payload: { expected_contract_version: "${c_sa_v}" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities/${fac_sa}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_sa}", booking_number: "B-2001", full_name: "Inmate Simple" }
              as: FacilityStaff
              captures: { inm_sa: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_sa}", inmate_id: "${inm_sa}", funding_model: "PREPAID", owner_name: "Fam Simple", owner_contact: "fs@x.com" }
              as: FacilityStaff
              captures: { acct_sa: $.data.id }
            - call: "POST /comm-services/recipient-numbers"
              payload: { account_id: "${acct_sa}", e164_number: "+15550002222", label: "Mom", relationship_type: "FAMILY" }
              as: AccountHolder
              as_user_id: "${acct_sa}"
              captures: { recip_sa: $.data.id, code_sa: $.data.verification_code }
            - call: "POST /comm-services/recipient-numbers/${recip_sa}/verify"
              payload: { verification_code: "${code_sa}", consent_to_recording: true }
              as: RecipientParty
              as_user_id: "${recip_sa}"
            - call: "POST /comm-services/accounts/${acct_sa}/deposits"
              payload: { amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${acct_sa}"
            - call: "POST /comm-services/accounts/${acct_sa}/deposits"
              payload: { amount_cents: 500 }
              as: AccountHolder
              as_user_id: "${acct_sa}"
            - call: "POST /comm-services/calls"
