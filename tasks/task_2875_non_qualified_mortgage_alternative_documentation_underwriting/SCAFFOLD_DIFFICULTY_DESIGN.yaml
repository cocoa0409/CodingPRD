# Scaffold Difficulty Design (Test Targeting Index) for
# task_2875_non_qualified_mortgage_alternative_documentation_underwriting
#
# Nine §0.5 rule_ids, two instances each (18 instances). Every instance grounds
# only in elements declared in SCAFFOLD.yaml §1.1-§1.7. Every numeric literal in
# every `assert:` was produced by executing the relevant §1.3 formula in Python
# with Decimal/ROUND_HALF_UP against the pinned setup inputs.
#
# Fixture conventions shared by the instances below:
#   * The logical clock is left at its declared default 2026-08-01T00:00:00Z
#     unless an instance sets it explicitly.
#   * Underwriter calls always carry the X-User-ID that performed
#     doc-type-selection on that file (SCAFFOLD.yaml validations[priority=23]
#     clause (a)); exception decisions always use a different X-User-ID from the
#     requester (clause (b)).
#   * A loan file's `version` is never guessed: every `expected_loan_file_version`
#     and `expected_pool_version` is a ${var} captured from an earlier response.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bank_statement_expense_factor_variant_divergence
        grounds:
          - calculations.bank_statement_income
          - entities.IncomeWorksheet.fields.expense_factor_pct_applied
          - entities.IncomeWorksheet.fields.variant_applied
          - entities.IncomeWorksheet.fields.monthly_qualifying_income_cents
        distinguishing_aspect: |
          Subject domain is IncomeWorksheet income derived from a borrower's bank deposits:
          the identical three StatementMonth rows produce monthly_qualifying_income_cents
          1527778 under the PROGRAM_DEFAULT_FACTOR variant and 2062500 under the
          CPA_LETTER_FACTOR variant, a 534722-cent divergence on byte-identical deposit data.
        test_recipe:
          setup:
            - "One BANK_STATEMENT_12MO program with default_expense_factor_pct 50.00 and min_expense_factor_pct 25.00."
            - "One self-employed borrower with 100.00 percent entity ownership."
            - "One 60000000-cent loan file with doc_type BANK_STATEMENT, in UNDERWRITING."
            - "Two income worksheets on that file with the same three statement months (eligible deposits 12222221, 12222221 and 12222220 cents): worksheet A uses PROGRAM_DEFAULT, worksheet B uses CPA_LETTER at 32.50 percent."
          setup_api_calls:
            - call: "POST /documentation-programs"
              payload: { program_code: "BANK_STATEMENT_12MO", name: "12-Month Bank Statement", statement_period_months: 12, default_expense_factor_pct: 50.00, min_expense_factor_pct: 25.00, max_ltv_pct: 80.00, min_fico: 660, min_reserves_months: 6, max_dti_pct: 50.00, min_residual_income_cents: 250000, second_valuation_ltv_threshold_pct: 85.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: false, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_bs_id: $.data.id }
            - call: "POST /borrowers"
              payload: { legal_name: "Ana Ruiz", fico_score: 720, self_employed_flag: true, entity_ownership_pct: 100.0, monthly_debt_obligations_cents: 120000, verified_liquid_assets_cents: 4000000, age_years: 47 }
              as: LoanOfficer
              captures: { bor1_id: $.data.id }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor1_id}", program_id: "${prog_bs_id}", investor_code: "INV-ATLAS", loan_amount_cents: 60000000, property_value_cents: 75000000, occupancy: "PRIMARY", purpose: "RATE_TERM_REFI", lien_position: "FIRST", note_rate_pct: 8.750, apor_pct: 6.100, term_months: 360, amortization_type: "FULLY_AMORTIZING", monthly_taxes_cents: 78000, monthly_insurance_cents: 22000, monthly_hoa_cents: 0 }
              as: LoanOfficer
              captures: { lf1_id: $.data.id }
            - call: "POST /loan-files/${lf1_id}/doc-type-selection"
              payload: { doc_type: "BANK_STATEMENT" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /loan-files/${lf1_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
              captures: { lf1_v_a: $.data.version }
            - call: "POST /income-worksheets"
              payload: { loan_file_id: "${lf1_id}", method: "BANK_STATEMENT", expected_loan_file_version: "${lf1_v_a}", expense_factor_source: "PROGRAM_DEFAULT" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ws_a_id: $.data.id }
            - call: "POST /income-worksheets/${ws_a_id}/statement-months"
              payload: { period_start_date: "2026-04-01T00:00:00Z", period_end_date: "2026-05-01T00:00:00Z", deposits_total_cents: 12222221, ineligible_transfer_cents: 0 }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /income-worksheets/${ws_a_id}/statement-months"
              payload: { period_start_date: "2026-05-01T00:00:00Z", period_end_date: "2026-06-01T00:00:00Z", deposits_total_cents: 12222221, ineligible_transfer_cents: 0 }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /income-worksheets/${ws_a_id}/statement-months"
              payload: { period_start_date: "2026-06-01T00:00:00Z", period_end_date: "2026-07-01T00:00:00Z", deposits_total_cents: 12500000, ineligible_transfer_cents: 277780 }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "GET /loan-files/${lf1_id}"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
              captures: { lf1_v_b: $.data.version }
            - call: "POST /income-worksheets"
              payload: { loan_file_id: "${lf1_id}", method: "BANK_STATEMENT", expected_loan_file_version: "${lf1_v_b}", expense_factor_source: "CPA_LETTER", cpa_expense_factor_pct: 32.50 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ws_b_id: $.data.id }
            - call: "POST /income-worksheets/${ws_b_id}/statement-months"
              payload: { period_start_date: "2026-04-01T00:00:00Z", period_end_date: "2026-05-01T00:00:00Z", deposits_total_cents: 12222221, ineligible_transfer_cents: 0 }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /income-worksheets/${ws_b_id}/statement-months"
              payload: { period_start_date: "2026-05-01T00:00:00Z", period_end_date: "2026-06-01T00:00:00Z", deposits_total_cents: 12222221, ineligible_transfer_cents: 0 }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /income-worksheets/${ws_b_id}/statement-months"
              payload: { period_start_date: "2026-06-01T00:00:00Z", period_end_date: "2026-07-01T00:00:00Z", deposits_total_cents: 12500000, ineligible_transfer_cents: 277780 }
              as: Underwriter
              as_user_id: "uw-1"
          trigger:
            - call: "POST /income-worksheets/${ws_a_id}/calculate"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /income-worksheets/${ws_b_id}/calculate"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
          assert:
            - "IncomeWorksheet.${ws_a_id}.eligible_deposit_total_cents == 36666662"
            - "IncomeWorksheet.${ws_b_id}.eligible_deposit_total_cents == 36666662"
            - "IncomeWorksheet.${ws_a_id}.expense_factor_pct_applied == 50.00"
            - "IncomeWorksheet.${ws_b_id}.expense_factor_pct_applied == 32.50"
            - "IncomeWorksheet.${ws_a_id}.variant_applied == PROGRAM_DEFAULT_FACTOR"
            - "IncomeWorksheet.${ws_b_id}.variant_applied == CPA_LETTER_FACTOR"
            - "IncomeWorksheet.${ws_a_id}.net_deposit_total_cents == 18333332"
            - "IncomeWorksheet.${ws_b_id}.net_deposit_total_cents == 24749997"
            - "IncomeWorksheet.${ws_a_id}.monthly_qualifying_income_cents == 1527778"
            - "IncomeWorksheet.${ws_b_id}.monthly_qualifying_income_cents == 2062500"
            - "IncomeWorksheet.${ws_b_id}.monthly_qualifying_income_cents - IncomeWorksheet.${ws_a_id}.monthly_qualifying_income_cents == 534722"
            - "LoanFile.${lf1_id}.qualifying_income_monthly_cents == 0 (calculate never publishes income; only accept does)"

      - name: dscr_lease_in_place_versus_market_rent_variant_divergence
        grounds:
          - calculations.dscr_ratio
          - entities.LoanFile.fields.dscr_ratio
          - state_machines.LoanFile.DRAFT_to_DOC_TYPE_SELECTED
        distinguishing_aspect: |
          Subject domain is LoanFile property cash flow (not borrower income): two files with
          identical loan_amount_cents, note_rate_pct and PITIA of 401333 cents produce
          dscr_ratio 1.1960 via LEASE_IN_PLACE and 0.7849 via MARKET_RENT_1007, so the same
          property either clears or fails the program's min_dscr of 1.10.
        test_recipe:
          setup:
            - "One DSCR program with min_dscr 1.10 and atr_exempt_flag true."
            - "One investor-property borrower."
            - "Two identical 40000000-cent interest-only investment loan files with gross_market_rent_cents 420000; file L has lease_rent_cents 480000, file M omits lease_rent_cents entirely."
          setup_api_calls:
            - call: "POST /documentation-programs"
              payload: { program_code: "DSCR", name: "Investor DSCR", min_dscr: 1.1000, max_ltv_pct: 85.00, min_fico: 660, min_reserves_months: 6, min_residual_income_cents: 0, second_valuation_ltv_threshold_pct: 90.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: true, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_dscr_id: $.data.id }
            - call: "POST /borrowers"
              payload: { legal_name: "Beltran Holdings LLC", fico_score: 740, self_employed_flag: false, entity_ownership_pct: 100.0, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 3000000, age_years: 51 }
              as: LoanOfficer
              captures: { bor2_id: $.data.id }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor2_id}", program_id: "${prog_dscr_id}", investor_code: "INV-ATLAS", loan_amount_cents: 40000000, purchase_price_cents: 60000000, property_value_cents: 60000000, occupancy: "INVESTMENT", purpose: "PURCHASE", lien_position: "FIRST", note_rate_pct: 9.250, apor_pct: 6.100, term_months: 360, amortization_type: "INTEREST_ONLY", monthly_taxes_cents: 60000, monthly_insurance_cents: 18000, monthly_hoa_cents: 15000, gross_market_rent_cents: 420000, lease_rent_cents: 480000 }
              as: LoanOfficer
              captures: { lf_lease_id: $.data.id }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor2_id}", program_id: "${prog_dscr_id}", investor_code: "INV-ATLAS", loan_amount_cents: 40000000, purchase_price_cents: 60000000, property_value_cents: 60000000, occupancy: "INVESTMENT", purpose: "PURCHASE", lien_position: "FIRST", note_rate_pct: 9.250, apor_pct: 6.100, term_months: 360, amortization_type: "INTEREST_ONLY", monthly_taxes_cents: 60000, monthly_insurance_cents: 18000, monthly_hoa_cents: 15000, gross_market_rent_cents: 420000 }
              as: LoanOfficer
              captures: { lf_mkt_id: $.data.id }
          trigger:
            - call: "POST /loan-files/${lf_lease_id}/doc-type-selection"
              payload: { doc_type: "DSCR" }
              as: Underwriter
              as_user_id: "uw-2"
            - call: "POST /loan-files/${lf_mkt_id}/doc-type-selection"
              payload: { doc_type: "DSCR" }
              as: Underwriter
              as_user_id: "uw-2"
          assert:
            - "LoanFile.${lf_lease_id}.pitia_monthly_cents == 401333"
            - "LoanFile.${lf_mkt_id}.pitia_monthly_cents == 401333"
            - "LoanFile.${lf_lease_id}.dscr_ratio == 1.1960"
            - "LoanFile.${lf_mkt_id}.dscr_ratio == 0.7849"
            - "LoanFile.${lf_lease_id}.dscr_ratio >= 1.10 (clears DocumentationProgram.min_dscr) while LoanFile.${lf_mkt_id}.dscr_ratio < 1.10"
            - "LoanFile.${lf_lease_id}.qualifying_income_monthly_cents == 0"
            - "LoanFile.${lf_lease_id}.dti_pct == null"

  - rule_id: combinatorial_formula
    instances:
      - name: points_and_fees_cap_tier_circular_evaluation_order
        grounds:
          - calculations.points_and_fees_test
          - entities.LoanFile.fields.total_loan_amount_cents
          - entities.LoanFile.fields.points_and_fees_cap_cents
          - entities.PointsAndFeesItem.fields.inclusion_in_test
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the cap tier is selected from
          total_loan_amount_cents, which is itself loan_amount_cents minus the INCLUDED
          prepaid finance charges, so the five-step order is the only thing that makes the
          answer well defined - the pinned order yields points_and_fees_cap_cents 124330
          (5.00 percent of 2486600) while keying the cap off loan_amount_cents would yield
          129330 and flip a FAIL-adjacent file into a comfortable pass.
        test_recipe:
          setup:
            - "One BANK_STATEMENT_12MO program."
            - "One self-employed borrower."
            - "One small 2586600-cent bank-statement loan file in UNDERWRITING."
            - "Two ACTIVE fee items: 100000 cents of origination points flagged as a prepaid finance charge, and 24330 cents of affiliate title work that is not prepaid."
          setup_api_calls:
            - call: "POST /documentation-programs"
              payload: { program_code: "BANK_STATEMENT_12MO", name: "12-Month Bank Statement", statement_period_months: 12, default_expense_factor_pct: 50.00, min_expense_factor_pct: 25.00, max_ltv_pct: 80.00, min_fico: 660, min_reserves_months: 6, max_dti_pct: 50.00, min_residual_income_cents: 250000, second_valuation_ltv_threshold_pct: 85.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: false, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_bs_id: $.data.id }
            - call: "POST /borrowers"
              payload: { legal_name: "Cyril Odom", fico_score: 700, self_employed_flag: true, entity_ownership_pct: 100.0, monthly_debt_obligations_cents: 40000, verified_liquid_assets_cents: 300000, age_years: 44 }
              as: LoanOfficer
              captures: { bor_sm_id: $.data.id }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_sm_id}", program_id: "${prog_bs_id}", investor_code: "INV-ATLAS", loan_amount_cents: 2586600, property_value_cents: 3600000, occupancy: "PRIMARY", purpose: "RATE_TERM_REFI", lien_position: "FIRST", note_rate_pct: 8.750, apor_pct: 6.100, term_months: 360, amortization_type: "FULLY_AMORTIZING", monthly_taxes_cents: 3000, monthly_insurance_cents: 1000, monthly_hoa_cents: 0 }
              as: LoanOfficer
              captures: { lf_sm_id: $.data.id }
            - call: "POST /loan-files/${lf_sm_id}/doc-type-selection"
              payload: { doc_type: "BANK_STATEMENT" }
              as: Underwriter
              as_user_id: "uw-3"
            - call: "POST /loan-files/${lf_sm_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
            - call: "POST /points-and-fees-items"
              payload: { loan_file_id: "${lf_sm_id}", fee_code: "ORIG-1", fee_category: "ORIGINATION_POINTS", amount_cents: 100000, paid_to_affiliate_flag: false, prepaid_finance_charge_flag: true, bona_fide_discount_flag: false }
              as: LoanOfficer
              captures: { fee_orig_id: $.data.id }
            - call: "POST /points-and-fees-items"
              payload: { loan_file_id: "${lf_sm_id}", fee_code: "TITLE-1", fee_category: "AFFILIATE_TITLE", amount_cents: 24330, paid_to_affiliate_flag: true, prepaid_finance_charge_flag: false, bona_fide_discount_flag: false }
              as: LoanOfficer
              captures: { fee_title_id: $.data.id }
          trigger:
            - call: "POST /loan-files/${lf_sm_id}/points-and-fees-test"
              payload: {}
              as: Underwriter
              as_user_id: "uw-3"
          assert:
            - "PointsAndFeesItem.${fee_orig_id}.inclusion_in_test == INCLUDED"
            - "PointsAndFeesItem.${fee_title_id}.inclusion_in_test == INCLUDED"
            - "LoanFile.${lf_sm_id}.points_and_fees_total_cents == 124330"
            - "LoanFile.${lf_sm_id}.total_loan_amount_cents == 2486600"
            - "LoanFile.${lf_sm_id}.points_and_fees_cap_cents == 124330"
            - "LoanFile.${lf_sm_id}.points_and_fees_cap_cents != 129330 (the value a cap keyed off loan_amount_cents would produce)"
            - "LoanFile.${lf_sm_id}.points_and_fees_test_result == PASS"

      - name: bank_statement_per_month_rounding_before_summation
        grounds:
          - calculations.bank_statement_income
          - entities.IncomeWorksheet.fields.net_deposit_total_cents
          - entities.StatementMonth.fields.eligible_deposit_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where the order is observable: applying the 50.00 percent
          expense factor per month and then summing yields net_deposit_total_cents 18333332,
          while summing eligible deposits first and applying the factor once yields 18333331 -
          a one-cent divergence the scaffold pins to the per-month order.
        test_recipe:
          setup:
            - "One BANK_STATEMENT_12MO program with default_expense_factor_pct 50.00."
            - "One self-employed borrower with 100.00 percent ownership."
            - "One bank-statement loan file in UNDERWRITING with one DRAFT worksheet."
            - "Three statement months whose eligible deposits are 12222221, 12222221 and 12222220 cents; the third arrives as 12500000 cents of deposits less a 277780-cent ineligible transfer."
          setup_api_calls:
            - call: "POST /documentation-programs"
              payload: { program_code: "BANK_STATEMENT_12MO", name: "12-Month Bank Statement", statement_period_months: 12, default_expense_factor_pct: 50.00, min_expense_factor_pct: 25.00, max_ltv_pct: 80.00, min_fico: 660, min_reserves_months: 6, max_dti_pct: 50.00, min_residual_income_cents: 250000, second_valuation_ltv_threshold_pct: 85.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: false, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_bs2_id: $.data.id }
            - call: "POST /borrowers"
              payload: { legal_name: "Dara Whitfield", fico_score: 720, self_employed_flag: true, entity_ownership_pct: 100.0, monthly_debt_obligations_cents: 120000, verified_liquid_assets_cents: 4000000, age_years: 47 }
              as: LoanOfficer
              captures: { bor_r_id: $.data.id }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_r_id}", program_id: "${prog_bs2_id}", investor_code: "INV-ATLAS", loan_amount_cents: 60000000, property_value_cents: 75000000, occupancy: "PRIMARY", purpose: "RATE_TERM_REFI", lien_position: "FIRST", note_rate_pct: 8.750, apor_pct: 6.100, term_months: 360, amortization_type: "FULLY_AMORTIZING", monthly_taxes_cents: 78000, monthly_insurance_cents: 22000, monthly_hoa_cents: 0 }
              as: LoanOfficer
              captures: { lf_r_id: $.data.id }
            - call: "POST /loan-files/${lf_r_id}/doc-type-selection"
              payload: { doc_type: "BANK_STATEMENT" }
              as: Underwriter
              as_user_id: "uw-4"
            - call: "POST /loan-files/${lf_r_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
              captures: { lf_r_v: $.data.version }
            - call: "POST /income-worksheets"
              payload: { loan_file_id: "${lf_r_id}", method: "BANK_STATEMENT", expected_loan_file_version: "${lf_r_v}", expense_factor_source: "PROGRAM_DEFAULT" }
              as: Underwriter
              as_user_id: "uw-4"
              captures: { ws_r_id: $.data.id }
            - call: "POST /income-worksheets/${ws_r_id}/statement-months"
              payload: { period_start_date: "2026-04-01T00:00:00Z", period_end_date: "2026-05-01T00:00:00Z", deposits_total_cents: 12222221, ineligible_transfer_cents: 0 }
              as: Underwriter
              as_user_id: "uw-4"
              captures: { sm_r1_id: $.data.id }
            - call: "POST /income-worksheets/${ws_r_id}/statement-months"
              payload: { period_start_date: "2026-05-01T00:00:00Z", period_end_date: "2026-06-01T00:00:00Z", deposits_total_cents: 12222221, ineligible_transfer_cents: 0 }
              as: Underwriter
              as_user_id: "uw-4"
              captures: { sm_r2_id: $.data.id }
            - call: "POST /income-worksheets/${ws_r_id}/statement-months"
              payload: { period_start_date: "2026-06-01T00:00:00Z", period_end_date: "2026-07-01T00:00:00Z", deposits_total_cents: 12500000, ineligible_transfer_cents: 277780 }
              as: Underwriter
              as_user_id: "uw-4"
              captures: { sm_r3_id: $.data.id }
          trigger:
            - call: "POST /income-worksheets/${ws_r_id}/calculate"
              payload: {}
              as: Underwriter
              as_user_id: "uw-4"
          assert:
            - "StatementMonth.${sm_r3_id}.eligible_deposit_cents == 12222220"
            - "IncomeWorksheet.${ws_r_id}.eligible_deposit_total_cents == 36666662"
            - "IncomeWorksheet.${ws_r_id}.included_month_count == 3"
            - "IncomeWorksheet.${ws_r_id}.net_deposit_total_cents == 18333332"
            - "IncomeWorksheet.${ws_r_id}.net_deposit_total_cents != 18333331 (the sum-then-round value)"
            - "IncomeWorksheet.${ws_r_id}.gross_monthly_income_cents == 3055555 (36666662 over the program's fixed divisor of 12, not over the 3 included months)"
            - "IncomeWorksheet.${ws_r_id}.monthly_qualifying_income_cents == 1527778"
            - "IncomeWorksheet.${ws_r_id}.calculation_count == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: exception_request_tier_two_fork_join_dual_signature
        grounds:
          - state_machines.ExceptionRequest.PENDING_REVIEW_to_AWAITING_SECOND_SIGNATURE
          - state_machines.ExceptionRequest.AWAITING_SECOND_SIGNATURE_to_APPROVED
          - entities.ExceptionRequest.fields.required_authority_tier
          - entities.LoanFile.fields.investor_notification_required
        distinguishing_aspect: |
          Entity ExceptionRequest exhibits a fork-join: PENDING_REVIEW forks on
          required_authority_tier, and only the tier-2 branch parks in
          AWAITING_SECOND_SIGNATURE and joins on a second, different signer - the join
          carries a side effect the tier-1 branch never fires
          (LoanFile.investor_notification_required becomes true).
        test_recipe:
          setup:
            - "One BANK_STATEMENT_12MO program and one MATERIAL-severity overlay OVL-FICO requiring fico >= 700 with required_authority_tier 1 (escalated to 2 by its MATERIAL severity)."
            - "One self-employed borrower with fico_score 680, so the overlay is breached."
            - "One bank-statement loan file in UNDERWRITING carrying overlay_breach_codes [OVL-FICO]."
            - "One PENDING_REVIEW exception request on that overlay, raised by X-User-ID uw-5."
          setup_api_calls:
            - call: "POST /documentation-programs"
