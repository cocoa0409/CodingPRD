  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cascade_expiry_to_escheat_to_program_disclosure_latch
        grounds:
          - state_machines.PointLot.OUTSTANDING_to_EXPIRED
          - state_machines.PointLot.EXPIRED_to_ESCHEATED
          - state_machines.Member.ACTIVE_to_DORMANT
          - entities.LoyaltyProgram.fields.total_escheat_accrual_cents
          - entities.LoyaltyProgram.fields.escheat_disclosure_required
          - calculations.expiry_escheatment_sweep
        distinguishing_aspect: |
          One sweep call drives a FOUR-LINK chain in which each link exists only
          because the previous one fired: LINK 1 expires the lot and releases its
          remaining deferral into the SWEPT period (not the issuing period);
          LINK 2 fires only because the governing StateExpiryRule demands
          escheatment, accruing 3600 on the lot, the swept period and the
          program; LINK 3 fires only because that program-level accrual reached
          the disclosure threshold, latching escheat_disclosure_required; and the
          member's ACTIVE -> DORMANT fan-out fires only because the expiry pass
          drove its balance to zero. Nothing in the request body mentions
          escheatment, disclosure or dormancy.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Escheat Core' ACTIVE: ssp_millicents_per_point 1200, point_expiry_days 730, per_issuance_point_cap 5000, historical_redemption_rate_bp 7500 (so current_breakage_rate_bp is 2500), escheat_disclosure_threshold_cents 3600."
            - "StateExpiryRule for DE: expiry_permitted true, min_dormancy_days 730, escheatment_required true, escheat_rate_bp 6000."
            - "Cohort C1; Member M1 BASE/DE in C1."
            - "AccountingPeriod per1 OPEN over [2026-08-01, 2026-09-01)."
            - "At clock 2026-08-05 a BASE lot of base_points 5000 is issued to M1: points_issued 5000, gross_ssp_cents 6000, breakage_reserve 1500, deferred 4500, expires_at 2028-08-04T00:00:00Z. M1.last_activity_at is 2026-08-05T00:00:00Z."
            - "AccountingPeriod per2 OPEN over [2028-08-01, 2028-09-01), created after the clock is advanced; per1 is left OPEN and untouched."
            - "Clock advanced to 2028-08-05T00:00:00Z: the lot is 1 day past expiry and M1's dormancy_days is 731."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Escheat Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 3600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "DE", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: true, escheat_rate_bp: 6000 }
              as: ProgramAdmin
              captures: { rule_de_id: $.data.id }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "DE", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LoyaltyAccountant
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 5000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-08-05T00:00:00Z" }
              as: Controller
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2028-08", start_at: "2028-08-01T00:00:00Z", end_at: "2028-09-01T00:00:00Z" }
              as: Controller
              captures: { per2_id: $.data.id }
          trigger:
            - call: "POST /accounting-periods/${per2_id}/expiry-sweep"
              payload: {}
              as: LoyaltyAccountant
          assert:
            - "LINK 1: PointLot.${lot1_id}.lifecycle_state == ESCHEATED (it passed through EXPIRED in the same sweep), points_remaining == 0, expired_gross_ssp_cents == 6000"
            - "LINK 1: AccountingPeriod.${per2_id}.expiry_released_cents == 4500 - the SWEPT period absorbs the release"
            - "AccountingPeriod.${per1_id}.expiry_released_cents == 0 and AccountingPeriod.${per1_id}.state == OPEN - the ISSUING period is untouched"
            - "LINK 2: PointLot.${lot1_id}.escheated_cents == 3600 (round_half_up(6000 * 6000 / 10000))"
            - "LINK 2: AccountingPeriod.${per2_id}.escheat_accrual_cents == 3600"
            - "LINK 2: LoyaltyProgram.${prog_id}.total_escheat_accrual_cents == 3600"
            - "LINK 3: LoyaltyProgram.${prog_id}.escheat_disclosure_required == true - latched because 3600 >= the threshold 3600 (inclusive)"
            - "FAN-OUT: Member.${m1_id}.status == DORMANT (point_balance fell to 0 and dormancy_days 731 >= min_dormancy_days 730) and Member.${m1_id}.point_balance == 0"
            - "The sweep response body is the swept AccountingPeriod with expiry_released_cents == 4500 and escheat_accrual_cents == 3600"
            - "Re-issuing the same sweep call returns 200 and AccountingPeriod.${per2_id}.expiry_released_cents is still 4500, escheat_accrual_cents is still 3600, LoyaltyProgram.${prog_id}.total_escheat_accrual_cents is still 3600 and PointLot.${lot1_id}.escheated_cents is still 3600 - the chain is not re-applied to an ESCHEATED lot"

      - name: cascade_estimate_supersede_forces_soft_closed_period_reopen
        grounds:
          - state_machines.BreakageEstimate.SUBMITTED_to_APPROVED
          - state_machines.BreakageEstimate.APPROVED_to_SUPERSEDED
          - state_machines.AccountingPeriod.SOFT_CLOSED_to_OPEN
          - entities.LoyaltyProgram.fields.current_breakage_rate_bp
          - entities.LoyaltyProgram.fields.recognized_breakage_ytd_cents
          - entities.AccountingPeriod.fields.reopen_count
        distinguishing_aspect: |
          Approving a September estimate reaches backwards and REOPENS an
          already soft-closed August period through three chained links:
          LINK 1 installs the new program rate, LINK 2 exists only because
          LINK 1 displaced the reigning estimate, LINK 3 exists only because
          LINK 2 retired the estimate that August's close rested on - and the
          program's recognized_breakage_ytd_cents falls out as a fourth-order
          consequence, because that figure sums only SOFT_CLOSED and HARD_CLOSED
          periods and August is no longer one. The forced reopen also bypasses
          the manual reopen_count < 2 gate while still consuming that budget.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Rewards Core' ACTIVE: ssp 1200 millicents/point, expiry 730 days, per_issuance_point_cap 5000, tier_multiplier_bp {BASE 10000, SILVER 10300, GOLD 12500, PLATINUM 15000}, promo cap 30000, COHORT_WEIGHTED, historical_redemption_rate_bp 7500."
            - "StateExpiryRule TX. Cohort C1 (observed 8200, adjustment 0) and Cohort C2 (observed 400, adjustment -300, so its effective rate clamps up to the 200 bp floor)."
            - "Member M1 GOLD/TX in C1 and Member M2 SILVER/TX in C2."
            - "AccountingPeriod per1 OPEN over [2026-08-01, 2026-09-01)."
            - "lot1 for M1: base 4000, promo 10000 -> 5000 points, gross 6000, deferred 4500. lot2 for M2: base 250, promo 10300 -> 266 points, gross 319, deferred 239."
            - "BreakageEstimate E1 on per1, prepared by u_acct_1, band 7296/8296: rate 7796, breakage 2204, outstanding 5266 points / 6319 cents, required_liability 4926. Submitted and APPROVED by u_ctrl_1, so program.current_breakage_rate_bp is 2204."
            - "RedemptionEvent rev1: M1, per1, 3000 CATALOG points, ALLOCATED then FULFILLED (provisional release 2700, final release 2807, remeasurement delta 107). lot1 is left PARTIALLY_REDEEMED with 2000 points and 2400 cents of gross."
            - "Clock advanced to 2026-09-01T00:00:00Z and per1 SOFT-CLOSED: issuance_deferred 4739, redemption_recognized 2700, remeasurement_delta 107, pre_catchup 1932, required 2120, catch_up 188, closing 2120, breakage_recognized -188, approved_estimate_rate_bp 7796, reopen_count 0. LoyaltyProgram.recognized_breakage_ytd_cents is -188."
            - "AccountingPeriod per2 OPEN over [2026-09-01, 2026-10-01)."
            - "BreakageEstimate E2 on per2, prepared by u_acct_1, band 6761/7761: weights are now C1 2000 points and C2 266 points, so rate 7261, breakage 2739, outstanding 2266 points / 2719 cents, required_liability 1974. E2 is SUBMITTED, not yet approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Rewards Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C2", enrollment_start_date: "2025-01-01T00:00:00Z", enrollment_end_date: "2025-12-31T00:00:00Z", observed_redemption_rate_bp: 400, sample_size: 9000, program_change_adjustment_bp: -300 }
              as: ProgramAdmin
              captures: { coh2_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "GOLD" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh2_id}", external_member_ref: "M2", state_code: "TX", tier: "SILVER" }
              as: LoyaltyAccountant
              captures: { m2_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 4000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m2_id}", period_id: "${per1_id}", base_points: 250, promo_multiplier_bp: 10300 }
              as: LoyaltyAccountant
              captures: { lot2_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Aug-2026 cohort-weighted estimate", sensitivity_low_bp: 7296, sensitivity_high_bp: 8296 }
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
              captures: { e1_id: $.data.id }
            - call: "POST /breakage-estimates/${e1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v1: $.data.version }
            - call: "POST /breakage-estimates/${e1_id}/approve"
              payload: { expected_program_version: "${prog_v1}" }
              as: Controller
              as_user_id: "u_ctrl_1"
            - call: "POST /redemption-events"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", points_requested: 3000, redemption_type: "CATALOG" }
              as: LoyaltyAccountant
              captures: { rev1_id: $.data.id }
            - call: "POST /redemption-events/${rev1_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /redemption-events/${rev1_id}/fulfill"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Controller
            - call: "POST /accounting-periods/${per1_id}/soft-close"
              payload: {}
              as: Controller
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-09", start_at: "2026-09-01T00:00:00Z", end_at: "2026-10-01T00:00:00Z" }
              as: Controller
              captures: { per2_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per2_id}", memo_narrative: "Sep-2026 re-estimate after August redemptions", sensitivity_low_bp: 6761, sensitivity_high_bp: 7761 }
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
              captures: { e2_id: $.data.id }
            - call: "POST /breakage-estimates/${e2_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v2: $.data.version }
            - call: "POST /breakage-estimates/${e2_id}/approve"
              payload: { expected_program_version: "${prog_v2}" }
              as: Controller
              as_user_id: "u_ctrl_1"
          assert:
            - "The approve call returns 200 and BreakageEstimate.${e2_id}.state == APPROVED"
            - "LINK 1: LoyaltyProgram.${prog_id}.current_breakage_rate_bp == 2739 (was 2204)"
            - "LINK 2: BreakageEstimate.${e1_id}.state == SUPERSEDED and BreakageEstimate.${e2_id}.supersedes_estimate_id == the id of ${e1_id}"
            - "LINK 3: AccountingPeriod.${per1_id}.state == OPEN (forced back out of SOFT_CLOSED) and soft_closed_at == null"
            - "LINK 3: AccountingPeriod.${per1_id}.reopen_count == 1 - the forced reopen consumes the manual budget even though it is not gated by it"
            - "LINK 3: AccountingPeriod.${per1_id}.opening_liability_cents == 0, pre_catchup_liability_cents == 0, required_liability_cents == 0, catch_up_adjustment_cents == 0, closing_liability_cents == 0, breakage_recognized_cents == 0 and approved_estimate_rate_bp == 0 (all seven were 0 / 1932 / 2120 / 188 / 2120 / -188 / 7796 before the trigger)"
            - "FOURTH-ORDER: LoyaltyProgram.${prog_id}.recognized_breakage_ytd_cents == 0, down from -188, because per1 is no longer in {SOFT_CLOSED, HARD_CLOSED}"
            - "AccountingPeriod.${per2_id}.state == OPEN, reopen_count == 0 and closing_liability_cents == 0 - the estimate's OWN period is not swept up in the cascade"
            - "AccountingPeriod.${per1_id}.issuance_deferred_cents == 4739, redemption_recognized_cents == 2700, remeasurement_delta_cents == 107 and expiry_released_cents == 0 remain untouched - the reopen resets only the six close-derived liability figures plus the pinned rate, never the activity accumulators"
            - "PointLot.${lot1_id}.points_remaining == 2000 and RedemptionEvent.${rev1_id}.state == FULFILLED - no member-facing data is disturbed"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_period_not_open_outranks_issuance_cap_exceeded
        grounds:
          - validations[priority=60]
          - validations[priority=90]
          - errors[ERR_PERIOD_NOT_OPEN]
          - errors[ERR_ISSUANCE_CAP_EXCEEDED]
          - endpoints[POST /point-lots]
        distinguishing_aspect: |
          One request violates BOTH the period-state gate (priority 60) and the
          per-issuance point cap (priority 90). The cheap arithmetic check is the
          tempting one to run first, but the ladder demands the container-state
          check win: the response must be ERR_PERIOD_NOT_OPEN, never
          ERR_ISSUANCE_CAP_EXCEEDED. The identical body against an OPEN period
          proves rule 90 really was violated and merely masked.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Priority Core' ACTIVE: ssp 1200, per_issuance_point_cap 5000, tier_multiplier_bp {BASE 10000, SILVER 10300, GOLD 12500, PLATINUM 15000}, COHORT_WEIGHTED, historical_redemption_rate_bp 7500."
            - "StateExpiryRule TX; Cohort C1 (observed 8200, adjustment 0); Member M1 GOLD/TX in C1."
            - "AccountingPeriod per1 OPEN over [2026-08-01, 2026-09-01) with one lot (base 4000, GOLD -> exactly 5000 points, gross 6000, deferred 4500)."
            - "BreakageEstimate est1 on per1 (single cohort -> rate 8200, breakage 1800, outstanding 5000 points / 6000 cents, required_liability 4920), band 7700/8700, prepared by u_acct_1, APPROVED by u_ctrl_1."
            - "Clock advanced to 2026-09-01T00:00:00Z; per1 SOFT-CLOSED (pre_catchup 4500, required 4920, catch_up 420, closing 4920, breakage_recognized -420)."
            - "AccountingPeriod per2 OPEN over [2026-09-01, 2026-10-01) exists as the control container."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Priority Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
