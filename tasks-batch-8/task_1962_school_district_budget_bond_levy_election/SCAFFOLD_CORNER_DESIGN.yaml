        test_recipe:
          setup: ["FY2028 OPEN; three projections 1200/800/1000; budget version HEARING_HELD with lines totalling 24,000,000 (12M + 6M + 2M + 4M) against total_revenue 23,404,000; clock at 2027-03-27"]
