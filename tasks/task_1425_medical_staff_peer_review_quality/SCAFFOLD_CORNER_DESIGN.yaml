            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "so case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
