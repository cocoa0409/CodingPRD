              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 403"
            - "response error_id == ERR_FORBIDDEN_ROLE"
            - "QualityClaim.${claim_id}.status == OPEN"

      - name: customer_cannot_act_on_other_customers_order
        claim_type: peer_roles
        grounds: [roles, "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Customer quoting another Customer's order (X-User-ID != order.customer_id) returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["customer A owns the order; customer B attempts to quote it"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-08T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZB2", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CB2", display_name: "CB2", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "owna@x.com", full_name: "Owner A" }
