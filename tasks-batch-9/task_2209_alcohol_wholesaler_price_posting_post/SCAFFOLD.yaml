        required: false
        default: 0
        description: "Total exposure attributable to this line; see calculation off_posted_detection."
      - name: is_off_posted
        type: boolean
        source: computed
        required: false
        default: false
        description: "Whether this line deviates from the posted price or the allowance caps."

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - name: wholesaler_id
        type: string
        source: input
        required: true
        description: "FK -> Wholesaler.id — the wholesaler under audit."
      - name: state_program_id
        type: string
        source: input
        required: true
        description: "FK -> StateProgram.id — the program whose penalty rate governs the assessment."
      - name: audit_period_month
        type: string
        source: input
        required: true
        description: "Audited month in YYYY-MM form."
        constraints: "matches YYYY-MM"
      - name: status
        type: enum
        source: computed
        required: false
        default: "OPEN"
        description: "Lifecycle state of the compliance audit."
        constraints: "OPEN | COLLECTED | ASSESSED | CLOSED | VOID"
      - name: finding_count
        type: integer
        source: computed
        required: false
        default: 0
        description: "Number of audit findings recorded during collection."
      - name: total_variance_cents
        type: integer
        source: computed
        required: false
        default: 0
        description: "Sum of finding variances in cents across all findings of this audit."
      - name: base_penalty_cents
        type: integer
        source: computed
        required: false
        default: 0
        description: "Sum of per-finding penalty components in cents; see calculation audit_penalty_assessment."
      - name: tier_multiplier
        type: number
        source: computed
        required: false
        default: 1.0
        description: "Escalation multiplier derived from prior violation history; see calculation audit_penalty_assessment."
      - name: penalty_assessed_cents
        type: integer
        source: computed
        required: false
        default: 0
        description: "Final penalty in cents charged to the wholesaler at assessment."
      - name: prior_violation_count
        type: integer
        source: computed
        required: false
        default: 0
        description: "Wholesaler's off-posted violation count captured before this audit's findings were counted."
      - name: void_reason
        type: string
        source: computed
        required: false
        default: null
        description: "Reason recorded by the regulator when an assessed audit was voided."

  - name: AuditFinding
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        required: false
        description: "Server-minted immutable identifier for this finding."
      - name: created_at
        type: datetime
        source: system
        required: false
        description: "Instant the finding was recorded."
      - name: audit_id
        type: string
        source: system
        required: false
        description: "FK -> ComplianceAudit.id — the audit that produced this finding."
      - name: invoice_line_id
        type: string
        source: system
        required: false
        description: "FK -> InvoiceLine.id — the off-posted line that produced this finding."
      - name: finding_type
        type: enum
        source: system
        required: false
        description: "Classification of the off-posted condition detected."
        constraints: "OFF_POSTED_UNDERCHARGE | OFF_POSTED_OVERCHARGE | EXCESS_PROMOTIONAL_ALLOWANCE | EXCESS_DEPLETION_ALLOWANCE | UNPOSTED_BRAND"
      - name: variance_cents
        type: integer
        source: system
        required: false
        description: "Exposure in cents attributed to this finding."
      - name: penalty_component_cents
        type: integer
        source: system
        required: false
        description: "Penalty in cents contributed by this finding; see calculation audit_penalty_assessment."

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: PriceSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /price-schedules/{id}/submit"
        actor: FilingAgent
        preconditions:
          - "schedule has at least one PriceScheduleItem, otherwise ERR_SCHEDULE_HAS_NO_ITEMS"
          - "the wholesaler's license_status is ACTIVE, otherwise ERR_LICENSE_NOT_ACTIVE"
          - "every item's Brand has registration_status APPROVED, otherwise ERR_BRAND_NOT_REGISTERED"
          - "every item's Brand registration interval contains the schedule's effective_date, otherwise ERR_BRAND_NOT_REGISTERED"
        side_effects:
          - "sets filed_at to the current server time"
          - "sets filed_by_user_id to the acting LicenseeUser"
          - "sets is_late per calculation late_filing_determination"
          - "when is_late is true, increments Wholesaler.late_filing_count by 1 and adds StateProgram.late_filing_penalty_cents to Wholesaler.late_filing_penalty_accrued_cents"
          - "recomputes Wholesaler.penalty_exposure_cents and increments Wholesaler.version by 1 when a late filing penalty was accrued"
          - "increments PriceSchedule.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /price-schedules/{id}/return-for-correction"
        actor: ComplianceOfficer
        preconditions:
          - "schedule status is SUBMITTED, otherwise ERR_INVALID_STATE"
        side_effects:
          - "sets return_reason to the supplied reason"
          - "increments return_count by 1"
          - "increments PriceSchedule.version by 1"
      - from: SUBMITTED
        to: POSTED
        trigger: "POST /price-schedules/{id}/certify"
        actor: CertifyingOfficer
        preconditions:
          - "the acting LicenseeUser belongs to the schedule's wholesaler, otherwise ERR_FORBIDDEN_WHOLESALER_SCOPE"
          - "the acting LicenseeUser is not the user recorded in filed_by_user_id, otherwise ERR_SEGREGATION_OF_DUTIES"
          - "the computed hold_window_ends_at is strictly before effective_date, otherwise ERR_HOLD_WINDOW_OVERRUNS_EFFECTIVE"
        side_effects:
          - "sets certified_at to the current server time"
          - "sets certified_by_user_id to the acting LicenseeUser"
          - "sets hold_window_ends_at per calculation hold_window_containment"
          - "moves every DRAFT PriceScheduleItem on the schedule to POSTED"
          - "copies each item's case_price_cents into certified_case_price_cents and unit_price_cents into certified_unit_price_cents"
          - "increments PriceSchedule.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /price-schedules/{id}/withdraw"
        actor: FilingAgent
        preconditions:
          - "schedule status is SUBMITTED, otherwise ERR_INVALID_STATE"
        side_effects:
          - "moves every PriceScheduleItem on the schedule to WITHDRAWN"
          - "when is_late is true, decrements Wholesaler.late_filing_count by 1 and subtracts StateProgram.late_filing_penalty_cents from Wholesaler.late_filing_penalty_accrued_cents"
          - "recomputes Wholesaler.penalty_exposure_cents and increments Wholesaler.version by 1 when a late filing penalty was reversed"
          - "increments PriceSchedule.version by 1"
      - from: POSTED
        to: EFFECTIVE
        trigger: "POST /posting-runs"
        actor: ComplianceOfficer
        preconditions:
          - "the schedule's effective_date is at or before the current server time"
          - "the schedule's hold_window_ends_at is at or before the current server time"
        side_effects:
          - "moves every POSTED PriceScheduleItem on the schedule to EFFECTIVE"
          - "for each newly effective item, locates the prior EFFECTIVE item with the same posting key and moves it to SUPERSEDED, recording supersedes_item_id"
          - "moves every ACTIVE QuantityDiscountTier of each superseded item to INACTIVE"
          - "when every item of an earlier schedule has become SUPERSEDED, moves that schedule to SUPERSEDED and sets its superseded_by_schedule_id"
          - "increments PriceSchedule.version by 1 for every schedule it touches"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "POST /posting-runs"
        actor: ComplianceOfficer
        preconditions:
          - "every PriceScheduleItem of the schedule has been superseded by a later effective item"
        side_effects:
          - "sets superseded_by_schedule_id to the superseding schedule"
          - "increments PriceSchedule.version by 1"

  - entity: HoldAmendment
    initial_state: PENDING
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /hold-amendments/{id}/accept"
        actor: ComplianceOfficer
        preconditions:
          - "amendment status is PENDING, otherwise ERR_INVALID_STATE"
          - "the amending item's schedule is still inside its post-and-hold window, otherwise ERR_HOLD_WINDOW_CLOSED"
        side_effects:
          - "captures the amending item's current prices into prior_case_price_cents and prior_unit_price_cents"
          - "sets the amending item's case_price_cents to new_case_price_cents and unit_price_cents to new_unit_price_cents"
          - "increments the amending item's amendment_count by 1"
          - "recomputes discounted_case_price_cents on every ACTIVE QuantityDiscountTier of the amending item"
          - "recomputes floor_price_cents and min_allowed_price_cents on every ACTIVE CombinationSale containing the amending item, moving any whose combined_case_price_cents now falls below min_allowed_price_cents to VOID"
          - "increments PriceScheduleItem.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /hold-amendments/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "amendment status is PENDING, otherwise ERR_INVALID_STATE"
        side_effects:
          - "sets rejection_reason to the supplied reason"
          - "leaves the amending item's prices unchanged"
          - "increments the amending wholesaler's frivolous_amendment_count by 1"
          - "when the resulting frivolous_amendment_count reaches 3 or more, adds StateProgram.frivolous_amendment_penalty_cents to Wholesaler.amendment_penalty_accrued_cents"
          - "recomputes Wholesaler.penalty_exposure_cents and increments Wholesaler.version by 1"
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /hold-amendments/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "amendment status is ACCEPTED, otherwise ERR_INVALID_STATE"
        side_effects:
          - "restores the amending item's case_price_cents and unit_price_cents from prior_case_price_cents and prior_unit_price_cents"
          - "decrements the amending item's amendment_count by 1"
          - "recomputes discounted_case_price_cents on every ACTIVE QuantityDiscountTier of the amending item"
          - "recomputes floor_price_cents and min_allowed_price_cents on every CombinationSale containing the amending item, returning a VOID combination to ACTIVE when its combined_case_price_cents is at or above the recomputed min_allowed_price_cents"
          - "increments PriceScheduleItem.version by 1"

  - entity: ErrorCorrection
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /error-corrections/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "correction status is SUBMITTED, otherwise ERR_INVALID_STATE"
          - "the item's schedule has fewer approved corrections than StateProgram.max_corrections_per_schedule, otherwise ERR_CORRECTION_LIMIT_EXCEEDED"
        side_effects:
          - "sets the item's case_price_cents to corrected_case_price_cents and unit_price_cents to corrected_unit_price_cents"
          - "increments the item's correction_count by 1 and the schedule's correction_count by 1"
          - "recomputes discounted_case_price_cents on every ACTIVE QuantityDiscountTier of the item"
          - "when the schedule's resulting correction_count reaches 2, adds StateProgram.repeat_correction_penalty_cents to Wholesaler.correction_penalty_accrued_cents, recomputes Wholesaler.penalty_exposure_cents and increments Wholesaler.version by 1"
          - "increments PriceScheduleItem.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /error-corrections/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "correction status is SUBMITTED, otherwise ERR_INVALID_STATE"
        side_effects:
          - "sets denial_reason to the supplied reason"
          - "leaves the item's prices unchanged"

  - entity: RetailerInvoice
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /retailer-invoices/{id}/validate"
        actor: FilingAgent
        preconditions:
          - "invoice has at least one InvoiceLine, otherwise ERR_INVALID_STATE"
          - "no line was detected as off posted price"
        side_effects:
          - "recomputes every InvoiceLine per calculations invoice_line_net_price and off_posted_detection"
          - "recomputes subtotal_cents, surcharge_cents, total_cents, total_allowance_cents, off_posted_line_count and total_variance_cents per calculation invoice_settlement_total"
          - "increments RetailerInvoice.version by 1"
      - from: DRAFT
        to: FLAGGED
        trigger: "POST /retailer-invoices/{id}/validate"
        actor: FilingAgent
        preconditions:
          - "invoice has at least one InvoiceLine, otherwise ERR_INVALID_STATE"
          - "at least one line was detected as off posted price"
        side_effects:
          - "recomputes every InvoiceLine per calculations invoice_line_net_price and off_posted_detection"
          - "recomputes subtotal_cents, surcharge_cents, total_cents, total_allowance_cents, off_posted_line_count and total_variance_cents per calculation invoice_settlement_total"
          - "increments RetailerInvoice.version by 1"
      - from: VALIDATED
        to: VALIDATED
        trigger: "POST /retailer-invoices/{id}/validate"
        actor: FilingAgent
        preconditions:
          - "the invoice's audit_status is NOT_AUDITED, otherwise ERR_INVALID_STATE"
          - "no line is detected as off posted price on this revalidation"
        side_effects:
          - "revalidates every line against the currently resolved posted prices and recomputes every rollup"
          - "increments RetailerInvoice.version by 1"
      - from: VALIDATED
        to: FLAGGED
        trigger: "POST /retailer-invoices/{id}/validate"
        actor: FilingAgent
        preconditions:
          - "the invoice's audit_status is NOT_AUDITED, otherwise ERR_INVALID_STATE"
          - "at least one line is detected as off posted price on this revalidation"
        side_effects:
          - "revalidates every line against the currently resolved posted prices and recomputes every rollup"
          - "increments RetailerInvoice.version by 1"
      - from: FLAGGED
        to: VALIDATED
        trigger: "POST /retailer-invoices/{id}/validate"
        actor: FilingAgent
        preconditions:
          - "the invoice's audit_status is NOT_AUDITED, otherwise ERR_INVALID_STATE"
          - "no line is detected as off posted price on this revalidation"
        side_effects:
          - "revalidates every line against the currently resolved posted prices and recomputes every rollup"
          - "clears off_posted_line_count and total_variance_cents to 0"
          - "increments RetailerInvoice.version by 1"
      - from: FLAGGED
        to: FLAGGED
        trigger: "POST /retailer-invoices/{id}/validate"
        actor: FilingAgent
        preconditions:
          - "the invoice's audit_status is NOT_AUDITED, otherwise ERR_INVALID_STATE"
          - "at least one line is detected as off posted price on this revalidation"
        side_effects:
          - "revalidates every line against the currently resolved posted prices and recomputes every rollup"
          - "increments RetailerInvoice.version by 1"

  - entity: ComplianceAudit
    initial_state: OPEN
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: OPEN
        to: COLLECTED
        trigger: "POST /compliance-audits/{id}/collect"
        actor: ComplianceOfficer
        preconditions:
          - "audit status is OPEN, otherwise ERR_INVALID_STATE"
          - "at least one FLAGGED invoice of the audited wholesaler falls in audit_period_month, otherwise ERR_NO_FLAGGED_INVOICES"
        side_effects:
          - "creates one AuditFinding per off-posted InvoiceLine of every collected invoice"
          - "sets each collected invoice's audit_status to UNDER_AUDIT and audit_id to this audit"
          - "sets finding_count, total_variance_cents and base_penalty_cents per calculation audit_penalty_assessment"
          - "increments ComplianceAudit.version by 1"
      - from: COLLECTED
        to: ASSESSED
        trigger: "POST /compliance-audits/{id}/assess"
        actor: ComplianceOfficer
        preconditions:
          - "audit status is COLLECTED, otherwise ERR_INVALID_STATE"
        side_effects:
          - "captures prior_violation_count from the wholesaler's off_posted_violation_count before this audit's findings are counted"
          - "sets tier_multiplier and penalty_assessed_cents per calculation audit_penalty_assessment"
          - "adds penalty_assessed_cents to Wholesaler.assessed_penalty_cents"
          - "adds finding_count to Wholesaler.off_posted_violation_count"
          - "recomputes Wholesaler.penalty_exposure_cents and increments Wholesaler.version by 1"
          - "sets each collected invoice's audit_status to ASSESSED"
          - "increments ComplianceAudit.version by 1"
      - from: ASSESSED
        to: CLOSED
        trigger: "POST /compliance-audits/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "audit status is ASSESSED, otherwise ERR_INVALID_STATE"
        side_effects:
          - "increments ComplianceAudit.version by 1"
      - from: ASSESSED
        to: VOID
        trigger: "POST /compliance-audits/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "audit status is ASSESSED, otherwise ERR_INVALID_STATE"
        side_effects:
          - "sets void_reason to the supplied reason"
          - "subtracts penalty_assessed_cents from Wholesaler.assessed_penalty_cents"
          - "subtracts finding_count from Wholesaler.off_posted_violation_count"
          - "recomputes Wholesaler.penalty_exposure_cents and increments Wholesaler.version by 1"
          - "returns each collected invoice's audit_status to NOT_AUDITED and clears its audit_id"
          - "increments ComplianceAudit.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# =============================================================================
concurrency_rules:
  - rule_id: hold-amendment-stale-schedule
    parent_entity: PriceSchedule
    write_endpoint: "POST /hold-amendments"
    occ_field: expected_schedule_version
    error_id: ERR_STALE_SCHEDULE_VERSION
    http_status: 412
    justification: |
      A competitor filing a hold amendment must have read the amending item's schedule as it stood
      when the amendment was drafted. A second amendment legitimately supersedes the first, so an
      amendment written against an outdated view of the schedule is rejected rather than layered on.
    guarantee: |
      The client submits expected_schedule_version equal to the amending item's PriceSchedule.version.
      If that value does not equal the schedule's stored version the write is rejected with
      ERR_STALE_SCHEDULE_VERSION (412) and no HoldAmendment is created. A successful write increments
      the schedule's version by 1, which invalidates every other client's previously read version.

  - rule_id: audit-create-stale-wholesaler
    parent_entity: Wholesaler
    write_endpoint: "POST /compliance-audits"
    occ_field: expected_wholesaler_version
    error_id: ERR_STALE_WHOLESALER_VERSION
    http_status: 412
    justification: |
      An audit's escalation tier depends on the wholesaler's violation history, so opening an audit
      against a stale view of the wholesaler would fix the wrong tier. The write is rejected unless
      the caller's read of the wholesaler is current.
    guarantee: |
      The client submits expected_wholesaler_version equal to Wholesaler.version. If that value does
      not equal the stored version the write is rejected with ERR_STALE_WHOLESALER_VERSION (412) and
      no ComplianceAudit is created. A successful write increments Wholesaler.version by 1 because
      open_audit_count is incremented.

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: schedule_effective_date
    description: "Derives the instant at which a posted price schedule takes effect from its posting month."
    trigger: "on PriceSchedule creation, and whenever posting_month is read back"
    inputs: [posting_month]
    algorithm: chronological
    formula: |
      year, month = parse posting_month as YYYY-MM
      if month == 12: effective_year, effective_month = year + 1, 1
      else:           effective_year, effective_month = year, month + 1
      effective_date = "{effective_year:04d}-{effective_month:02d}-01T00:00:00.000Z"
      # posting_month "2026-09" -> effective_date "2026-10-01T00:00:00.000Z"
      # posting_month "2026-12" -> effective_date "2027-01-01T00:00:00.000Z"
    constants: {}
    precision: "millisecond-precision ISO-8601 UTC instant, always at 00:00:00.000Z"

  - name: late_filing_determination
    description: "Decides whether a submission is late by comparing the filing instant with the program's posting deadline instant."
    trigger: "on POST /price-schedules/{id}/submit"
    inputs: [posting_month, "StateProgram.posting_deadline_day", filed_at]
    algorithm: threshold
    formula: |
      deadline_instant = last millisecond of the posting_deadline_day within posting_month
                       = "{posting_month}-{posting_deadline_day:02d}T23:59:59.999Z"
      is_late = filed_at > deadline_instant
      # filed_at exactly equal to deadline_instant is ON TIME (is_late = false)
      # posting_month "2026-09", posting_deadline_day 10 -> deadline_instant "2026-09-10T23:59:59.999Z"
    constants: {}
    precision: "millisecond comparison; the deadline instant itself is inclusive"

  - name: hold_window_containment
    description: "Defines the post-and-hold window during which competitors may file amendments against a posted item."
    trigger: "on certify (to set hold_window_ends_at) and on POST /hold-amendments (to test containment)"
    inputs: [certified_at, "StateProgram.hold_window_days", "current server time"]
    algorithm: threshold
    formula: |
      hold_window_ends_at = certified_at + (hold_window_days * 86400) seconds
      window_is_open = (certified_at <= now) and (now < hold_window_ends_at)
      # the start instant is inclusive; the end instant is EXCLUSIVE
      # now exactly equal to hold_window_ends_at -> window_is_open = false
    constants:
      SECONDS_PER_DAY: 86400
    precision: "millisecond comparison; half-open interval [certified_at, hold_window_ends_at)"

  - name: correction_window_containment
    description: "Defines the window during which an error correction may be filed against a certified item."
    trigger: "on POST /error-corrections"
    inputs: [certified_at, "StateProgram.correction_window_days", "current server time"]
    algorithm: threshold
    formula: |
      correction_window_ends_at = certified_at + (correction_window_days * 86400) seconds
      window_is_open = now < correction_window_ends_at
      # now exactly equal to correction_window_ends_at -> window_is_open = false
    constants:
      SECONDS_PER_DAY: 86400
    precision: "millisecond comparison; end instant exclusive"

  - name: correction_variance_pct
    description: "Measures how far an error correction moves the posted case price, used to reject non-clerical rewrites."
    trigger: "on POST /error-corrections"
    inputs: [prior_case_price_cents, corrected_case_price_cents]
    algorithm: threshold
    formula: |
      variance_pct = abs(corrected_case_price_cents - prior_case_price_cents) / prior_case_price_cents
      # a correction with variance_pct > CLERICAL_LIMIT_PCT is not a clerical error and is rejected
      # variance_pct exactly equal to CLERICAL_LIMIT_PCT is accepted
    constants:
      CLERICAL_LIMIT_PCT: 0.10
    precision: "unrounded decimal fraction; comparison against CLERICAL_LIMIT_PCT is inclusive"

  - name: tier_discounted_case_price
    description: "Derives a quantity discount tier's case price from the item's posted case price."
    trigger: "on QuantityDiscountTier creation, and whenever the parent item's case_price_cents changes"
    inputs: ["PriceScheduleItem.case_price_cents", discount_pct]
    algorithm: aggregation
    formula: |
      discounted_case_price_cents = round_half_up(case_price_cents * (1 - discount_pct))
      # case_price_cents 120000, discount_pct 0.125 -> round_half_up(105000.0) = 105000
    constants: {}
    precision: "whole cents, round_half_up"

  - name: posted_case_price_resolution
    description: "Resolves the price posted for a product key as of a given instant. Two variants read the same candidate set but return different price fields."
    trigger: "on GET /price-schedule-items/{id}/posted-price and during invoice validation"
    inputs: ["PriceScheduleItem records", "PriceSchedule.effective_date", "PriceSchedule.certified_at", as_of, variant]
    algorithm: chronological
    formula: |
      posting_key = (wholesaler_id, state_program_id, Brand.brand_name, Brand.beverage_class,
                     size_ml, bottles_per_case)
      candidates = every PriceScheduleItem whose posting_key matches the subject item's posting_key,
                   whose status is EFFECTIVE or SUPERSEDED,
                   and whose schedule.effective_date <= as_of
      if candidates is empty: no posted price exists for the key as of as_of
      resolved = candidate with the greatest schedule.effective_date;
                 ties broken by the greatest schedule.certified_at;
                 remaining ties broken by the earliest created_at (ascending)
      variant as_amended (default):
        posted_case_price_cents = resolved.case_price_cents
        posted_unit_price_cents = resolved.unit_price_cents
      variant as_certified:
        posted_case_price_cents = resolved.certified_case_price_cents
        posted_unit_price_cents = resolved.certified_unit_price_cents
    constants: {}
    precision: "whole cents; no rounding is performed"
    variants:
      - name: as_amended
        when: "variant query parameter is omitted or set to as_amended"
        difference: "Returns the item's live case_price_cents and unit_price_cents, which reflect every accepted hold amendment and approved error correction."
      - name: as_certified
        when: "variant query parameter is set to as_certified"
        difference: "Returns the certified_case_price_cents and certified_unit_price_cents snapshot taken at certification, ignoring every later amendment and correction."

  - name: wholesaler_penalty_exposure
    description: "Totals a wholesaler's penalty exposure. Two variants differ in whether unassessed audits are projected into the figure."
    trigger: "on GET /wholesalers/{id}/penalty-exposure and after every penalty accrual"
    inputs: [late_filing_penalty_accrued_cents, correction_penalty_accrued_cents, amendment_penalty_accrued_cents, assessed_penalty_cents, "ComplianceAudit records", "StateProgram.off_posted_penalty_rate_pct", variant]
    algorithm: aggregation
    formula: |
      accrued = late_filing_penalty_accrued_cents
              + correction_penalty_accrued_cents
              + amendment_penalty_accrued_cents
              + assessed_penalty_cents
      variant assessed_exposure (default):
        exposure_cents = accrued
      variant provisional_exposure:
        provisional = 0
        for each ComplianceAudit of the wholesaler whose status is OPEN or COLLECTED:
          for each AuditFinding of that audit:
            provisional += round_half_up(finding.variance_cents * off_posted_penalty_rate_pct)
        exposure_cents = accrued + provisional
        # no tier escalation is applied to the provisional part; the multiplier is treated as 1.00
    constants: {}
    precision: "whole cents; each provisional component is rounded half-up before summation"
    variants:
      - name: assessed_exposure
        when: "variant query parameter is omitted or set to assessed_exposure"
        difference: "Counts only penalties already accrued or assessed; the stored Wholesaler.penalty_exposure_cents always equals this variant."
      - name: provisional_exposure
        when: "variant query parameter is set to provisional_exposure"
        difference: "Adds a projection of the findings sitting in OPEN and COLLECTED audits at a multiplier of 1.00, so it is greater than or equal to assessed_exposure."

  - name: invoice_line_net_price
    description: "Prices one invoice line: gross charge, quantity discount selection, capped allowances, and the resulting net amount."
    trigger: "on POST /retailer-invoices/{id}/validate, for every line of the invoice"
    inputs: [cases_quantity, bottles_quantity, case_price_charged_cents, unit_price_charged_cents, promotional_allowance_cents, depletion_allowance_cents, "QuantityDiscountTier records", "StateProgram configuration"]
    algorithm: waterfall_allocation
    formula: |
      gross_cents = cases_quantity * case_price_charged_cents
                  + bottles_quantity * unit_price_charged_cents

      # quantity discount
      if StateProgram.quantity_discount_allowed is false:
        quantity_discount_cents = 0
      else:
        eligible = every ACTIVE QuantityDiscountTier of the line's item whose min_cases <= cases_quantity
        if eligible is empty:
          quantity_discount_cents = 0
        else:
          selected = tier with the greatest min_cases;
                     ties broken by the greatest discount_pct;
                     remaining ties broken by the earliest created_at (ascending)
          quantity_discount_cents = cases_quantity
                                  * (item.case_price_cents - selected.discounted_case_price_cents)

      # allowances, each capped independently
      promotional_cap_cents   = floor(gross_cents * StateProgram.max_promotional_allowance_pct)
      allowed_promotional_cents = min(promotional_allowance_cents, promotional_cap_cents)
      excess_promotional_cents  = promotional_allowance_cents - allowed_promotional_cents

      depletion_cap_cents     = cases_quantity * StateProgram.depletion_allowance_per_case_cents
      allowed_depletion_cents = min(depletion_allowance_cents, depletion_cap_cents)
      excess_depletion_cents  = depletion_allowance_cents - allowed_depletion_cents

      net_price_cents = gross_cents
                      - quantity_discount_cents
                      - allowed_promotional_cents
                      - allowed_depletion_cents
    constants: {}
    precision: "whole cents throughout; the promotional cap uses floor, never round_half_up"

  - name: off_posted_detection
    description: "Compares a line's charged amount and allowances with the posted price to classify off-posted exposure."
    trigger: "on POST /retailer-invoices/{id}/validate, for every line of the invoice"
    inputs: [gross_cents, cases_quantity, bottles_quantity, excess_promotional_cents, excess_depletion_cents, "resolved posted price"]
    algorithm: threshold
    formula: |
      resolve the posted price for the line's item as of RetailerInvoice.invoice_date
      using calculation posted_case_price_resolution, variant as_amended

      if no posted price exists for the key:
        posted_gross_cents = 0
        variance_cents = 0
        finding_variance_cents = gross_cents
        is_off_posted = true          # finding_type UNPOSTED_BRAND
      else:
        posted_gross_cents = cases_quantity * posted_case_price_cents
                           + bottles_quantity * posted_unit_price_cents
        variance_cents = posted_gross_cents - gross_cents
        # variance_cents > 0 means the retailer was undercharged relative to the posted price
        finding_variance_cents = abs(variance_cents)
                               + excess_promotional_cents
                               + excess_depletion_cents
        is_off_posted = finding_variance_cents != 0
    constants: {}
    precision: "whole cents; variance_cents is signed, finding_variance_cents is non-negative"

  - name: invoice_settlement_total
    description: "Rolls line net prices into the invoice total and applies the state handling surcharge band."
    trigger: "on POST /retailer-invoices/{id}/validate, after every line has been priced"
    inputs: ["InvoiceLine.net_price_cents", "InvoiceLine.allowed_promotional_cents", "InvoiceLine.allowed_depletion_cents", "InvoiceLine.finding_variance_cents", "InvoiceLine.is_off_posted"]
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = sum of net_price_cents over every line of the invoice
      # each line is rounded to whole cents before this summation

      # the surcharge band is keyed on subtotal_cents BEFORE any surcharge is added
      if subtotal_cents < 500000:                            surcharge_pct = 0.000
      else if subtotal_cents < 2000000:                      surcharge_pct = 0.005
      else:                                                  surcharge_pct = 0.010

      surcharge_cents = round_half_up(subtotal_cents * surcharge_pct)
      total_cents     = subtotal_cents + surcharge_cents

      total_allowance_cents = sum of (allowed_promotional_cents + allowed_depletion_cents) over every line
      off_posted_line_count = count of lines whose is_off_posted is true
      total_variance_cents  = sum of finding_variance_cents over lines whose is_off_posted is true

      validation_status = FLAGGED if off_posted_line_count > 0 else VALIDATED
    constants:
      BAND_1_UPPER_CENTS: 500000
      BAND_2_UPPER_CENTS: 2000000
      BAND_1_PCT: 0.000
      BAND_2_PCT: 0.005
      BAND_3_PCT: 0.010
    precision: "whole cents; band selection uses the pre-surcharge subtotal, then round_half_up once"

  - name: combination_sale_min_price
    description: "Derives the lowest lawful price for a combination sale from the sum of its members' posted case prices."
    trigger: "on CombinationSale creation, and whenever a member item's case_price_cents changes"
    inputs: ["member items' case_price_cents"]
    algorithm: tiered_pricing
    formula: |
      floor_price_cents = sum of case_price_cents over every member item

      # the band is keyed on floor_price_cents BEFORE any discount is applied
      if floor_price_cents < 50000:                          band_pct = 0.00
      else if floor_price_cents < 150000:                    band_pct = 0.05
      else:                                                  band_pct = 0.10

      min_allowed_price_cents = round_half_up(floor_price_cents * (1 - band_pct))
      # floor_price_cents 150000 -> band_pct 0.10 -> min_allowed_price_cents 135000
      # keying the band on the post-discount value would have selected 0.05 and produced 142500
    constants:
      COMBO_BAND_1_UPPER_CENTS: 50000
      COMBO_BAND_2_UPPER_CENTS: 150000
      COMBO_BAND_1_PCT: 0.00
      COMBO_BAND_2_PCT: 0.05
      COMBO_BAND_3_PCT: 0.10
    precision: "whole cents; band selection uses the pre-discount floor, then round_half_up once"

  - name: combination_window_cooldown
    description: "Decides whether a requested combination sale promotional window is far enough from an existing one to satisfy the state's cooldown buffer."
    trigger: "on POST /combination-sales"
    inputs: [promo_starts_at, promo_ends_at, "existing ACTIVE CombinationSale windows of the same wholesaler", "StateProgram.combo_cooldown_days"]
    algorithm: interval_merge
    formula: |
      buffer_seconds = combo_cooldown_days * 86400
      for each existing ACTIVE CombinationSale of the same wholesaler:
        conflicts = (new_promo_starts_at < existing_promo_ends_at + buffer_seconds)
                and (existing_promo_starts_at < new_promo_ends_at + buffer_seconds)
        # each window is half-open [promo_starts_at, promo_ends_at) and is then expanded
        # forward by buffer_seconds on both sides; the comparison is strictly less-than,
        # so a new window starting exactly at existing_promo_ends_at + buffer_seconds
        # does NOT conflict
      # existing window [2026-10-01T00:00:00Z, 2026-10-10T00:00:00Z), combo_cooldown_days 7:
      #   new window starting 2026-10-16T00:00:00Z conflicts (before 2026-10-17T00:00:00Z)
      #   new window starting 2026-10-17T00:00:00Z does not conflict
    constants:
      SECONDS_PER_DAY: 86400
    precision: "millisecond comparison; both comparisons are strict less-than"

  - name: audit_penalty_assessment
    description: "Turns audit findings into an assessed penalty, escalating by the wholesaler's prior violation history."
    trigger: "on POST /compliance-audits/{id}/collect (base) and POST /compliance-audits/{id}/assess (final)"
    inputs: ["AuditFinding.variance_cents", "StateProgram.off_posted_penalty_rate_pct", "Wholesaler.off_posted_violation_count"]
    algorithm: weighted_scoring
    formula: |
      for each AuditFinding of the audit:
        penalty_component_cents = round_half_up(finding.variance_cents * off_posted_penalty_rate_pct)

      base_penalty_cents = sum of penalty_component_cents over every finding
      # each finding is rounded to whole cents BEFORE the summation; summing the raw products and
      # rounding once at the end is a different figure and is not the rule

      prior_violation_count = Wholesaler.off_posted_violation_count read before this audit's
                              finding_count is added to it

      if prior_violation_count <= 2:        tier_multiplier = 1.00
      else if prior_violation_count <= 9:   tier_multiplier = 1.50
      else:                                 tier_multiplier = 2.00

      penalty_assessed_cents = round_half_up(base_penalty_cents * tier_multiplier)
    constants:
      TIER_1_MAX_PRIOR: 2
      TIER_2_MAX_PRIOR: 9
      TIER_1_MULTIPLIER: 1.00
      TIER_2_MULTIPLIER: 1.50
      TIER_3_MULTIPLIER: 2.00
    precision: "whole cents; round per finding then sum, then round once more after applying the multiplier"

  - name: amendment_price_admissibility
    description: "Constrains a hold amendment so it may only lower the amending item's price and never undercut the competitor it matches."
    trigger: "on POST /hold-amendments"
    inputs: ["amending item's case_price_cents", "reference item's case_price_cents", new_case_price_cents]
    algorithm: threshold
    formula: |
      the amendment must be a reduction:
        new_case_price_cents < amending_item.case_price_cents
        # equal or higher is not a reduction and is rejected
      the amendment must not undercut the matched price:
        new_case_price_cents >= reference_item.case_price_cents
        # matching exactly is permitted; going below the reference is rejected
    constants: {}
    precision: "whole cents; the reduction test is strict, the reference test is inclusive"

# =============================================================================
# Table 4: Validation Rules Table (evaluated in ascending priority order;
# the first violated rule determines the response and no later rule is reached)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-Role header is present and names a known role; when the role is entity-backed, X-User-ID is also present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Requests missing authentication headers are rejected before anything else is examined."

  - priority: 2
    category: auth
    check: "the named role is authorized for the endpoint, and for an entity-backed role X-User-ID resolves to an active LicenseeUser whose user_role matches the named role"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "A user_role of DUAL_ROLE satisfies both FilingAgent and CertifyingOfficer. An inactive LicenseeUser is never authorized."

  - priority: 3
    category: existence
    check: "every identifier appearing in the URL path exists, checked left to right"
    error_id: "ERR_<Entity>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Path existence is resolved before the request body is examined."

  - priority: 4
    category: validation
    check: "required body fields are present; every field has the declared type; enum fields carry a declared member; numeric fields fall in their declared range; datetime fields are ISO-8601 instants; interval fields are correctly ordered"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
    description: "Body shape is validated before any referenced entity is looked up."

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body references an existing record"
    error_id: "ERR_<Entity>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints whose body carries a foreign key"
    description: "Body foreign keys are resolved after body shape validation and before ownership."

  - priority: 6
    category: authorization
    check: "for an entity-backed role, the target resource belongs to the acting LicenseeUser's wholesaler"
    error_id: ERR_FORBIDDEN_WHOLESALER_SCOPE
    http_status: 403
    applies_to: "all write endpoints operating on wholesaler-owned resources"
    description: "A filing agent may only act on resources of their own wholesaler."

  - priority: 7
    category: concurrency
    check: "the supplied expected parent version equals the parent's stored version"
    error_id: "ERR_STALE_SCHEDULE_VERSION | ERR_STALE_WHOLESALER_VERSION"
    http_status: 412
    applies_to: ["POST /hold-amendments", "POST /compliance-audits"]
    description: "Optimistic concurrency is checked after ownership and before state."

  - priority: 8
    category: state
    check: "the target entity is in a state from which the requested transition is defined; for POST /hold-amendments the amending item's status must be POSTED; for POST /error-corrections the item's status must be POSTED or EFFECTIVE; for POST /invoice-lines the invoice's audit_status must be NOT_AUDITED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints, plus POST /hold-amendments, POST /error-corrections and POST /invoice-lines"
    description: "State admissibility outranks every business rule below it. An amendment against an item that has already gone EFFECTIVE is reported as ERR_INVALID_STATE even though the item's post-and-hold window has also closed, because priority 8 is reached before priority 12."

  - priority: 9
    category: business_safety
    check: "the governing wholesaler's license_status is ACTIVE"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /price-schedules/{id}/submit", "POST /retailer-invoices/{id}/validate"]
    description: "A suspended licensee may neither file nor invoice."

  - priority: 10
    category: business_prerequisite
    check: "every brand referenced by the schedule's items has registration_status APPROVED and a registration interval containing the schedule's effective_date"
    error_id: ERR_BRAND_NOT_REGISTERED
    http_status: 409
    applies_to: ["POST /price-schedules/{id}/submit"]
    description: "Brand registration is a prerequisite for posting a price for that brand."

  - priority: 11
    category: business_referential
    check: "the reference item of a hold amendment belongs to a wholesaler other than the amending item's wholesaler"
    error_id: ERR_SELF_REFERENCE_NOT_ALLOWED
    http_status: 409
    applies_to: ["POST /hold-amendments"]
    description: "Post-and-hold amendments exist to match a competitor, so a wholesaler cannot reference itself."

  - priority: 12
    category: business_temporal
    check: "the amending item's schedule is inside its post-and-hold window per calculation hold_window_containment"
    error_id: ERR_HOLD_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /hold-amendments", "POST /hold-amendments/{id}/accept"]
    description: "Amendments are only admissible while the hold window is open; the end instant is exclusive."

  - priority: 13
    category: business_temporal
    check: "no interval conflict exists: brand registration intervals for the same wholesaler, brand name and beverage class must not overlap; combination sale promotional windows for the same wholesaler must be separated by at least the program's combo_cooldown_days"
    error_id: "ERR_BRAND_REGISTRATION_OVERLAP | ERR_COMBINATION_COOLDOWN_VIOLATION"
    http_status: 409
    applies_to: ["POST /brands", "POST /combination-sales"]
    description: "Brand registration intervals are compared as closed intervals; combination windows are compared as half-open intervals expanded by the cooldown buffer."

  - priority: 14
    category: business_uniqueness
    check: "no duplicate exists: a schedule may not carry two items with the same brand, size and package; a wholesaler may not file two schedules for the same posting month; a wholesaler may not have two audits for the same period month"
    error_id: "ERR_DUPLICATE_SCHEDULE_ITEM | ERR_DUPLICATE_POSTING_MONTH | ERR_DUPLICATE_AUDIT_PERIOD"
    http_status: 409
    applies_to: ["POST /price-schedule-items", "POST /price-schedules", "POST /compliance-audits"]
    description: "Uniqueness is enforced after interval conflicts."

  - priority: 15
    category: business_restriction
    check: "the governing state program permits the requested instrument: quantity discount tiers require quantity_discount_allowed, combination sales require combination_sale_allowed"
    error_id: "ERR_QUANTITY_DISCOUNT_PROHIBITED | ERR_COMBINATION_SALE_PROHIBITED"
    http_status: 422
    applies_to: ["POST /quantity-discount-tiers", "POST /combination-sales"]
    description: "State configuration can forbid an instrument outright."

  - priority: 16
    category: business_safety
    check: "the certifying user is not the user who filed the schedule"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: ["POST /price-schedules/{id}/certify"]
    description: "Filing and certifying must be performed by different licensee users."

  - priority: 17
    category: business_fiscal
    check: "declared prices satisfy their fiscal relations: an amendment must be a reduction and must not fall below its reference; a schedule item's unit price times bottles per case must be at least the case price; a combination price must be at or above the minimum allowed price; a discount percentage must not exceed the state cap; a correction's variance must not exceed the clerical limit"
    error_id: "ERR_AMENDMENT_NOT_A_REDUCTION | ERR_AMENDMENT_BELOW_REFERENCE | ERR_CASE_PRICE_EXCEEDS_UNIT_AGGREGATE | ERR_COMBINATION_BELOW_FLOOR | ERR_DISCOUNT_EXCEEDS_STATE_CAP | ERR_CORRECTION_EXCEEDS_CLERICAL_LIMIT"
    http_status: 422
    applies_to: ["POST /hold-amendments", "POST /price-schedule-items", "POST /combination-sales", "POST /quantity-discount-tiers", "POST /error-corrections"]
    description: "Fiscal relations are checked after every structural and state rule above."

  - priority: 18
    category: business_quota
    check: "the schedule has not already reached the program's max_corrections_per_schedule approved corrections"
    error_id: ERR_CORRECTION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: ["POST /error-corrections/{id}/approve"]
    description: "A schedule may only absorb a bounded number of approved corrections."

  - priority: 19
    category: business_cardinality
    check: "collections are not empty or degenerate: a submitted schedule has at least one item; an invoice line has a non-zero total quantity; a combination sale has at least two distinct member items and every member belongs to the declared schedule"
    error_id: "ERR_SCHEDULE_HAS_NO_ITEMS | ERR_ZERO_QUANTITY_LINE | ERR_COMBINATION_TOO_FEW_MEMBERS | ERR_ITEM_NOT_ON_SAME_SCHEDULE"
    http_status: 422
    applies_to: ["POST /price-schedules/{id}/submit", "POST /invoice-lines", "POST /combination-sales"]
    description: "Degenerate collections are rejected at the boundary of zero and one."

  - priority: 20
    category: business_temporal
    check: "the item's correction window is still open per calculation correction_window_containment"
    error_id: ERR_CORRECTION_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /error-corrections"]
    description: "Corrections may only be filed inside the program's correction window."

  - priority: 21
    category: business_temporal
    check: "the post-and-hold window computed at certification ends strictly before the schedule's effective_date"
    error_id: ERR_HOLD_WINDOW_OVERRUNS_EFFECTIVE
    http_status: 409
    applies_to: ["POST /price-schedules/{id}/certify"]
    description: "Certifying so late that the hold window would still be open when prices take effect is not permitted."

  - priority: 22
    category: business_cardinality
    check: "at least one FLAGGED invoice of the audited wholesaler falls inside the audit period month"
    error_id: ERR_NO_FLAGGED_INVOICES
    http_status: 409
    applies_to: ["POST /compliance-audits/{id}/collect"]
    description: "An audit cannot be collected when there is nothing to find."

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # ---------------------------------------------------------------- logical clock
  - method: POST
    path: /_clock/set_current_utc
    description: "Sets the server's logical current UTC instant. The server starts with its logical clock at 2026-08-01T00:00:00Z and never reads the real wall clock; every timestamp the server stamps and every temporal comparison it performs uses the logical clock."
    roles: [ComplianceOfficer]
    success_code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "moves the logical clock to the supplied instant; no entity is mutated"

  # ---------------------------------------------------------------- state programs
  - method: POST
    path: /state-programs
    description: "Registers a state price posting program and its configuration thresholds."
    roles: [ComplianceOfficer]
    success_code: 201
    input: [state_code, program_name, "posting_deadline_day?", "hold_window_days?", "correction_window_days?", "combo_cooldown_days?", "quantity_discount_allowed?", "combination_sale_allowed?", "max_quantity_discount_pct?", "max_promotional_allowance_pct?", "depletion_allowance_per_case_cents?", "late_filing_penalty_cents?", "repeat_correction_penalty_cents?", "frivolous_amendment_penalty_cents?", "off_posted_penalty_rate_pct?", "max_corrections_per_schedule?"]
    output: StateProgram
    side_effects: []

  - method: GET
    path: /state-programs/{id}
    description: "Retrieves one state price posting program."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: []
    output: StateProgram
    side_effects: []

  - method: GET
    path: /state-programs
    description: "Lists state price posting programs."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: StateProgram[]
    side_effects: []

  # ---------------------------------------------------------------- wholesalers
  - method: POST
    path: /wholesalers
    description: "Registers a licensed wholesaler under a state price posting program."
    roles: [ComplianceOfficer]
    success_code: 201
    input: [license_number, legal_name, state_program_id, "license_status?"]
    output: Wholesaler
    side_effects: []

  - method: POST
    path: /wholesalers/{id}/license-status
    description: "Sets a wholesaler's license standing."
    roles: [ComplianceOfficer]
    success_code: 200
    input: [license_status]
    output: Wholesaler
    side_effects:
      - "increments Wholesaler.version by 1"

  - method: GET
    path: /wholesalers/{id}
    description: "Retrieves one wholesaler including its penalty accrual fields."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: []
    output: Wholesaler
    side_effects: []

  - method: GET
    path: /wholesalers
    description: "Lists wholesalers."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: ["state_program_id?", "license_status?", "limit?", "offset?"]
    output: Wholesaler[]
    side_effects: []

  - method: GET
    path: /wholesalers/{id}/penalty-exposure
    description: "Computes a wholesaler's penalty exposure under the requested variant."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: ["variant?"]
    output: "{ wholesaler_id: string, variant: string, accrued_cents: integer, provisional_cents: integer, exposure_cents: integer }"
    side_effects: []

  # ---------------------------------------------------------------- licensee users
  - method: POST
    path: /licensee-users
    description: "Registers a user authorized to act for a wholesaler in a filing or certifying capacity."
    roles: [ComplianceOfficer]
    success_code: 201
    input: [wholesaler_id, full_name, user_role, "is_active?"]
    output: LicenseeUser
    side_effects: []

  - method: GET
    path: /licensee-users/{id}
    description: "Retrieves one licensee user."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: []
    output: LicenseeUser
    side_effects: []

  - method: GET
    path: /licensee-users
    description: "Lists licensee users."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: ["wholesaler_id?", "user_role?", "limit?", "offset?"]
    output: LicenseeUser[]
    side_effects: []

  # ---------------------------------------------------------------- brands
  - method: POST
    path: /brands
    description: "Files a brand registration for a wholesaler covering a closed effective interval."
    roles: [FilingAgent]
    success_code: 201
