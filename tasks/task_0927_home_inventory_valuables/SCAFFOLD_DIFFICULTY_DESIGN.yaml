              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_2: $.data.id }
            - call: "POST /vault/items/${it_2}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 11000, checksum: "sha-q2", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_2}/declare-value"
              payload: { declared_value_cents: 300000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "GET /vault/policies/${pol_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_v0: $.data.version }
            - call: "POST /vault/items/${it_1}/schedule"
              payload: { policy_id: "${pol_id}", scheduled_value_cents: 600000, expected_policy_version: "${pol_v0}" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "GET /vault/policies/${pol_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_v1: $.data.version }
            - call: "POST /vault/items/${it_2}/schedule"
              payload: { policy_id: "${pol_id}", scheduled_value_cents: 300000, expected_policy_version: "${pol_v1}" }
              as: Homeowner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /vault/items/${it_1}/unschedule"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "GET /vault/policies/${pol_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_v2: $.data.version }
            - call: "POST /vault/items/${it_1}/schedule"
              payload: { policy_id: "${pol_id}", scheduled_value_cents: 600000, expected_policy_version: "${pol_v2}" }
              as: Homeowner
              as_user_id: "${owner_id}"
          assert:
            - "AFTER SETUP, before the trigger: Policy.${pol_id}.scheduled_consumed_cents == 900000 and scheduled_remaining_cents == 100000"
            - "AFTER the unschedule call: Policy.${pol_id}.scheduled_consumed_cents == 300000"
            - "AFTER the unschedule call: Policy.${pol_id}.scheduled_remaining_cents == 700000"
            - "AFTER the unschedule call: Item.${it_1}.coverage_mode == BLANKET"
            - "AFTER the unschedule call: Item.${it_1}.scheduled_policy_id == null"
            - "AFTER the unschedule call: Item.${it_1}.scheduled_value_cents == 0"
            - "AFTER the re-schedule call: Policy.${pol_id}.scheduled_consumed_cents == 900000"
            - "AFTER the re-schedule call: Policy.${pol_id}.scheduled_remaining_cents == 100000"
            - "AFTER the re-schedule call: Item.${it_1}.scheduled_value_cents == 600000 and Item.${it_2}.scheduled_value_cents == 300000"
            - "Policy.${pol_id}.scheduled_allowance_cents == Policy.${pol_id}.scheduled_consumed_cents + Policy.${pol_id}.scheduled_remaining_cents"

      - name: claim_open_withdraw_roundtrip_conserves_frozen_item_count
        grounds:
          - calculations.claim_freeze_ledger
          - state_machines.LossClaim.status.OPEN_to_WITHDRAWN
          - state_machines.Item.lifecycle_state.CATALOGED_to_FROZEN
          - entities.Household.fields.frozen_item_count
          - entities.Household.fields.records_freeze_active
        distinguishing_aspect: |
          Conserved quantity: the COUNT of frozen item records, a different kind of
          quantity from the allowance cents above. Opening a claim over room A freezes
          exactly the two CATALOGED items in room A and leaves the room-B item alone;
          withdrawing releases exactly those two, restoring frozen_item_count to 0 and
          records_freeze_active to false with no residue on any item row.
        test_recipe:
          setup:
            - "A GENERAL CategorySchedule and a PLUS household with rooms A and B."
            - "Two CATALOGED items in room A and one CATALOGED item in room B; Household.frozen_item_count is 0 and records_freeze_active is false."
            - "A GENERATED documentation package on a bound policy."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "owner.r@example.com", full_name: "Owner R" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Rowan House", address_label: "29 Rowan Walk" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vault/subscriptions/${sub_id}/billing-event"
              payload: { outcome: "PAYMENT_SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Room A", floor_label: "1" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_a: $.data.id }
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Room B", floor_label: "2" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_b: $.data.id }
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_a}", name: "A One", category: "GENERAL", acquired_at: "2025-04-01T00:00:00Z", quantity: 1 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_a1: $.data.id }
            - call: "POST /vault/items/${it_a1}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 10000, checksum: "sha-r1", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_a1}/declare-value"
              payload: { declared_value_cents: 100000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_a}", name: "A Two", category: "GENERAL", acquired_at: "2025-04-02T00:00:00Z", quantity: 1 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_a2: $.data.id }
            - call: "POST /vault/items/${it_a2}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 10000, checksum: "sha-r2", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_a2}/declare-value"
              payload: { declared_value_cents: 120000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_b}", name: "B One", category: "GENERAL", acquired_at: "2025-04-03T00:00:00Z", quantity: 1 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_b1: $.data.id }
            - call: "POST /vault/items/${it_b1}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 10000, checksum: "sha-r3", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_b1}/declare-value"
              payload: { declared_value_cents: 130000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/policies"
              payload: { household_id: "${hh_id}", carrier_name: "Northwind Mutual", policy_number: "NW-1414", deductible_cents: 50000, scheduled_allowance_cents: 0, effective_from: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /vault/packages"
              payload: { household_id: "${hh_id}", policy_id: "${pol_id}" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pkg_id: $.data.id }
            - call: "GET /vault/households/${hh_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_v: $.data.version }
            - call: "POST /vault/packages/${pkg_id}/generate"
              payload: { expected_household_version: "${hh_v}" }
              as: Homeowner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /vault/claims"
              payload: { household_id: "${hh_id}", package_id: "${pkg_id}", policy_id: "${pol_id}", loss_date: "2026-05-01T00:00:00Z", peril: "WATER", settlement_basis: "ACV", affected_room_ids: ["${room_a}"], deductible_mode: "PRO_RATA" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { clm_id: $.data.id }
            - call: "POST /vault/claims/${clm_id}/withdraw"
              payload: { withdraw_reason: "settled privately" }
              as: Homeowner
              as_user_id: "${owner_id}"
          assert:
            - "AFTER SETUP, before the trigger: Household.${hh_id}.frozen_item_count == 0 and records_freeze_active == false"
            - "AFTER the claim creation: Household.${hh_id}.frozen_item_count == 2"
            - "AFTER the claim creation: Household.${hh_id}.records_freeze_active == true"
            - "AFTER the claim creation: LossClaim.${clm_id}.frozen_item_count == 2"
            - "AFTER the claim creation: Item.${it_a1}.lifecycle_state == FROZEN and Item.${it_a2}.lifecycle_state == FROZEN"
            - "AFTER the claim creation: Item.${it_b1}.lifecycle_state == CATALOGED"
            - "AFTER the withdraw: LossClaim.${clm_id}.status == WITHDRAWN"
            - "AFTER the withdraw: Household.${hh_id}.frozen_item_count == 0"
            - "AFTER the withdraw: Household.${hh_id}.records_freeze_active == false"
            - "AFTER the withdraw: Item.${it_a1}.lifecycle_state == CATALOGED and Item.${it_a1}.frozen_by_claim_id == null"
            - "AFTER the withdraw: Item.${it_a2}.lifecycle_state == CATALOGED and Item.${it_a2}.frozen_by_claim_id == null"
