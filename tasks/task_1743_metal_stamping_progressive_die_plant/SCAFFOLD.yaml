    path: "/api/presses"
    description: "List presses"
    roles: [PlantAdmin, ProductionPlanner, SetupLead, PressOperator, QualityEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Press[]
    side_effects: []
  - method: GET
    path: "/api/presses/{id}"
    description: "Get press"
    roles: [PlantAdmin, ProductionPlanner, SetupLead, PressOperator, QualityEngineer]
    code: 200
    input: []
    output: Press
    side_effects: []
  - method: GET
    path: "/api/presses/{id}/die-change-events"
    description: "List changeovers for a press"
    roles: [PlantAdmin, ProductionPlanner, SetupLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DieChangeEvent[]
    side_effects: []
  - method: GET
    path: "/api/presses/{id}/production-runs"
    description: "List runs for a press"
    roles: [PlantAdmin, ProductionPlanner, PressOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: GET
    path: "/api/presses/{id}/layered-audits"
    description: "List audits for a press"
    roles: [PlantAdmin, QualityEngineer]
    code: 200
    input: ["result?", "audit_tier?", "limit?", "offset?"]
    output: LayeredAudit[]
    side_effects: []
  - method: GET
    path: "/api/presses/{id}/smed-performance"
    description: "Computed read: rolling average SMED variance over last N COMPLETED changeovers"
    roles: [PlantAdmin, SetupLead, ProductionPlanner]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/api/part-die-assignments"
    description: "Pair a part with a die"
    roles: [ProcessEngineer]
    code: 201
    input: [part_id, die_id]
    output: PartDieAssignment
    side_effects: []
  - method: GET
    path: "/api/part-die-assignments"
    description: "List assignments"
    roles: [PlantAdmin, ProcessEngineer, ProductionPlanner]
    code: 200
    input: ["part_id?", "die_id?", "limit?", "offset?"]
    output: PartDieAssignment[]
    side_effects: []
  - method: GET
    path: "/api/part-die-assignments/{id}"
    description: "Get a single assignment"
    roles: [PlantAdmin, ProcessEngineer, ProductionPlanner]
    code: 200
    input: []
    output: PartDieAssignment
    side_effects: []

  - method: GET
    path: "/api/die-change-events"
    description: "List changeovers (filtered list form for FK reverse reachability)"
    roles: [PlantAdmin, SetupLead, ProductionPlanner]
    code: 200
    input: ["press_id?", "from_die_id?", "to_die_id?", "status?", "limit?", "offset?"]
    output: DieChangeEvent[]
    side_effects: []
  - method: GET
    path: "/api/production-runs"
    description: "List production runs (filtered list form for FK reverse reachability)"
    roles: [PlantAdmin, ProductionPlanner, PressOperator, QualityEngineer]
    code: 200
    input: ["production_order_id?", "press_id?", "die_id?", "coil_id?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: GET
    path: "/api/layered-audits"
    description: "List layered audits (filtered list form for FK reverse reachability)"
    roles: [PlantAdmin, QualityEngineer]
    code: 200
    input: ["press_id?", "escalated_from_id?", "result?", "audit_tier?", "limit?", "offset?"]
    output: LayeredAudit[]
    side_effects: []

  - method: POST
    path: "/api/steel-coils"
    description: "Receive a steel coil"
    roles: [ShippingClerk]
    code: 201
    input: [coil_number, heat_lot_number, material_spec, thickness_mm, received_weight_kg]
    output: SteelCoil
    side_effects: ["remaining_weight_kg := received_weight_kg"]
  - method: GET
    path: "/api/steel-coils"
    description: "List coils"
    roles: [PlantAdmin, ShippingClerk, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["status?", "heat_lot_number?", "limit?", "offset?"]
    output: SteelCoil[]
    side_effects: []
  - method: GET
    path: "/api/steel-coils/{id}"
    description: "Get coil"
    roles: [PlantAdmin, ShippingClerk, QualityEngineer, ProductionPlanner, PressOperator]
    code: 200
    input: []
    output: SteelCoil
    side_effects: []
  - method: POST
    path: "/api/steel-coils/{id}/approve"
    description: "Approve received coil for production"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: SteelCoil
    side_effects: []
  - method: POST
    path: "/api/steel-coils/{id}/reject"
    description: "Reject received coil"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: SteelCoil
    side_effects: []
  - method: POST
    path: "/api/steel-coils/{id}/hold"
    description: "Place approved coil on hold"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: SteelCoil
    side_effects: []
  - method: POST
    path: "/api/steel-coils/{id}/release-hold"
    description: "Release coil hold"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: SteelCoil
    side_effects: []

  - method: GET
    path: "/api/heat-lots/{heat_lot_number}/exposure"
    description: "Computed read: exposure_kg and affected orders for a heat lot"
    roles: [PlantAdmin, QualityEngineer, CostAnalyst]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/api/strip-layouts"
    description: "Create strip layout for a part"
    roles: [ProcessEngineer]
    code: 201
    input: [part_id, revision, strip_width_mm, pitch_mm, parts_per_strip_segment, gross_weight_per_part_kg]
    output: StripLayout
    side_effects: []
  - method: GET
    path: "/api/strip-layouts/{id}"
    description: "Get strip layout"
    roles: [PlantAdmin, ProcessEngineer, QualityEngineer]
    code: 200
    input: []
    output: StripLayout
    side_effects: []
  - method: POST
    path: "/api/strip-layouts/{id}/approve"
    description: "Approve layout; supersedes any prior APPROVED layout for the part; syncs Part.steel_content_kg. OCC: expected_part_version required."
    roles: [ProcessEngineer]
    code: 200
    input: [expected_part_version]
    output: StripLayout
    side_effects:
      - "Part.steel_content_kg := gross_weight_per_part_kg"
      - "prior APPROVED layout for the part becomes SUPERSEDED"
      - "increments Part.version by 1"

  - method: POST
    path: "/api/production-orders"
    description: "Create production order"
    roles: [ProductionPlanner]
    code: 201
    input: [part_id, quantity_ordered, due_date, "pricing_variant?"]
    output: ProductionOrder
    side_effects: []
  - method: GET
    path: "/api/production-orders"
    description: "List production orders"
    roles: [PlantAdmin, ProductionPlanner, CostAnalyst, PressOperator]
    code: 200
    input: ["part_id?", "status?", "limit?", "offset?"]
    output: ProductionOrder[]
    side_effects: []
  - method: GET
    path: "/api/production-orders/{id}"
    description: "Get production order"
    roles: [PlantAdmin, ProductionPlanner, CostAnalyst, PressOperator]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []
  - method: POST
    path: "/api/production-orders/{id}/release"
    description: "Release order; captures steel_index_at_release. OCC: expected_order_version required."
    roles: [ProductionPlanner]
    code: 200
    input: [expected_order_version]
    output: ProductionOrder
    side_effects:
      - "steel_index_at_release := latest applicable IndexPublication value"
      - "increments ProductionOrder.version by 1"
  - method: POST
    path: "/api/production-orders/{id}/complete"
    description: "Complete order when good quantity reached"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []
  - method: POST
    path: "/api/production-orders/{id}/close"
    description: "Close order; writes the PriceAdjustment record per pricing_variant"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["PriceAdjustment record created"]
  - method: POST
    path: "/api/production-orders/{id}/cancel"
    description: "Cancel order; aborts SCHEDULED runs"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["SCHEDULED ProductionRuns for the order become ABORTED"]
  - method: GET
    path: "/api/production-orders/{id}/production-runs"
    description: "List runs for an order"
    roles: [PlantAdmin, ProductionPlanner, PressOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: GET
    path: "/api/production-orders/{id}/price-adjustments"
    description: "List price adjustments written for an order"
    roles: [PlantAdmin, ProductionPlanner, CostAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: PriceAdjustment[]
    side_effects: []
  - method: GET
    path: "/api/production-orders/{id}/outside-processing-orders"
    description: "List outside processing orders for an order"
    roles: [PlantAdmin, ProductionPlanner, ShippingClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OutsideProcessingOrder[]
    side_effects: []

  - method: POST
    path: "/api/die-change-events"
    description: "Plan a die changeover on a press"
    roles: [SetupLead]
    code: 201
    input: [press_id, "from_die_id?", to_die_id, planned_start, planned_end, smed_target_minutes]
    output: DieChangeEvent
    side_effects: []
  - method: GET
    path: "/api/die-change-events/{id}"
    description: "Get changeover"
    roles: [PlantAdmin, SetupLead, ProductionPlanner]
    code: 200
    input: []
    output: DieChangeEvent
    side_effects: []
  - method: POST
    path: "/api/die-change-events/{id}/start"
    description: "Begin changeover; assigns to_die, press to IN_SETUP"
    roles: [SetupLead]
    code: 200
    input: []
    output: DieChangeEvent
    side_effects: ["press.status := IN_SETUP", "to_die.status := ASSIGNED", "actual_start := now"]
  - method: POST
    path: "/api/die-change-events/{id}/complete"
    description: "Complete changeover; computes variance_minutes; press IDLE; from_die AVAILABLE"
    roles: [SetupLead]
    code: 200
    input: []
    output: DieChangeEvent
    side_effects: ["press.status := IDLE", "from_die.status := AVAILABLE when from_die_id not null", "variance_minutes computed"]
  - method: POST
    path: "/api/die-change-events/{id}/cancel"
    description: "Cancel a planned changeover"
    roles: [SetupLead]
    code: 200
    input: []
    output: DieChangeEvent
    side_effects: []

  - method: POST
    path: "/api/production-runs"
    description: "Schedule a production run"
    roles: [ProductionPlanner]
    code: 201
    input: [production_order_id, press_id, die_id, coil_id, scheduled_start, scheduled_end]
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/api/production-runs/{id}"
    description: "Get run"
    roles: [PlantAdmin, ProductionPlanner, PressOperator, QualityEngineer]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: POST
    path: "/api/production-runs/{id}/start"
    description: "Start run; press RUNNING; order IN_PROGRESS"
    roles: [PressOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["press.status := RUNNING", "production_order.status := IN_PROGRESS if RELEASED"]
  - method: POST
    path: "/api/production-runs/{id}/complete"
    description: "Complete run with final shot count; consumes coil, credits order, ages die. OCC: expected_coil_version required (guards the coil ledger)."
    roles: [PressOperator]
    code: 200
    input: [shots_recorded, expected_coil_version]
    output: ProductionRun
    side_effects:
      - "press.status := IDLE"
      - "good_count := shots_recorded - reject_count"
      - "coil.remaining_weight_kg decremented; coil may become DEPLETED; increments SteelCoil.version by 1"
      - "order.quantity_produced_good and quantity_scrapped updated"
      - "die.total_shots_lifetime and shots_since_repair incremented"
  - method: POST
    path: "/api/production-runs/{id}/abort"
    description: "Abort a scheduled or running run"
    roles: [PressOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["press.status := IDLE if it was RUNNING", "order may revert IN_PROGRESS -> RELEASED"]
  - method: GET
    path: "/api/production-runs/{id}/reject-events"
    description: "List reject events for a run"
    roles: [PlantAdmin, PressOperator, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: RejectEvent[]
    side_effects: []

  - method: POST
    path: "/api/production-runs/{id}/reject-events"
    description: "Record an in-die sensing reject event on a running run"
    roles: [PressOperator]
    code: 201
    input: [station_number, sensor_code, quantity, sensed_at]
    output: RejectEvent
    side_effects: ["run.reject_count += quantity"]

  - method: POST
    path: "/api/outside-processing-orders"
    description: "Send stamped parts to an outside processor"
    roles: [ShippingClerk]
    code: 201
    input: [production_order_id, operation_type, quantity_sent]
    output: OutsideProcessingOrder
    side_effects: []
  - method: GET
    path: "/api/outside-processing-orders/{id}"
    description: "Get outside processing order"
    roles: [PlantAdmin, ShippingClerk, ProductionPlanner]
    code: 200
    input: []
    output: OutsideProcessingOrder
    side_effects: []
  - method: POST
    path: "/api/outside-processing-orders/{id}/receive-return"
    description: "Record a return shipment from the processor"
    roles: [ShippingClerk]
    code: 200
    input: [quantity_returned_good, quantity_returned_scrap]
    output: OutsideProcessingOrder
    side_effects: ["cumulative returns accumulate; status may advance to PARTIAL_RETURN or CLOSED"]
  - method: POST
    path: "/api/outside-processing-orders/{id}/close-short"
    description: "Close the outside order short of full return; shortage scrapped on parent order"
    roles: [ShippingClerk]
    code: 200
    input: [shortage_acknowledgment]
    output: OutsideProcessingOrder
    side_effects: ["parent ProductionOrder.quantity_scrapped += shortage"]

  - method: POST
    path: "/api/ppap-submissions"
    description: "Submit PPAP for a part"
    roles: [ProcessEngineer]
    code: 201
    input: [part_id, level, control_plan_attached]
    output: PPAPSubmission
    side_effects: []
  - method: GET
    path: "/api/ppap-submissions/{id}"
    description: "Get PPAP submission"
    roles: [PlantAdmin, ProcessEngineer, QualityEngineer]
    code: 200
    input: []
    output: PPAPSubmission
    side_effects: []
  - method: POST
    path: "/api/ppap-submissions/{id}/begin-review"
    description: "Move submission to UNDER_REVIEW"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: PPAPSubmission
    side_effects: []
  - method: POST
    path: "/api/ppap-submissions/{id}/approve"
    description: "Approve PPAP; qualifies all part-die assignments; segregation of duties enforced"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: PPAPSubmission
    side_effects: ["PartDieAssignment.qualified := true for all assignments of the part"]
  - method: POST
    path: "/api/ppap-submissions/{id}/reject"
    description: "Reject PPAP with reason"
    roles: [QualityEngineer]
    code: 200
    input: [rejection_reason]
    output: PPAPSubmission
    side_effects: []

  - method: POST
    path: "/api/layered-audits"
    description: "Schedule a layered audit on a press"
    roles: [QualityEngineer]
    code: 201
    input: [press_id, audit_tier, scheduled_date]
    output: LayeredAudit
    side_effects: []
  - method: GET
    path: "/api/layered-audits/{id}"
    description: "Get audit"
    roles: [PlantAdmin, QualityEngineer]
    code: 200
    input: []
    output: LayeredAudit
    side_effects: []
  - method: POST
    path: "/api/layered-audits/{id}/record"
    description: "Record audit result; FAIL escalates to next tier; tier-3 FAIL quarantines implicated heat lots"
    roles: [QualityEngineer]
    code: 200
    input: [result, findings_count]
    output: LayeredAudit
    side_effects:
      - "on FAIL with audit_tier < 3: a new LayeredAudit at tier+1 is auto-created with escalated_from_id set"
      - "on FAIL with audit_tier == 3: heat-lot quarantine cascade fires (coils QUARANTINED, runs ABORTED, orders revert)"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine precondition violated for the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match the current entity version"
  - id: ERR_QUALITY_HOLD
    http: 422
    condition: "Coil QUARANTINED/ON_HOLD/REJECTED, or die at/over repair threshold, blocks production"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Acting user created the record they are trying to disposition"
  - id: ERR_PRESS_CAPACITY_INSUFFICIENT
    http: 422
    condition: "Press tonnage or bed width below die requirement"
  - id: ERR_MATERIAL_MISMATCH
    http: 422
    condition: "Coil material spec or thickness does not match the part"
  - id: ERR_PRESS_SCHEDULE_CONFLICT
    http: 409
    condition: "Run window overlaps another SCHEDULED/RUNNING run on the same press (half-open intervals)"
  - id: ERR_CHANGEOVER_CONFLICT
    http: 409
    condition: "Changeover window plus 30-minute teardown buffer overlaps another changeover or run on the same press"
  - id: ERR_PPAP_LEVEL_MISMATCH
    http: 422
    condition: "Submission level differs from part.ppap_required_level, or control plan missing for level >= 2"
  - id: ERR_RELEASE_GATE_UNMET
    http: 422
    condition: "Order release gate failed: no qualified die assignment, no APPROVED strip layout, no APPROVED PPAP, or inactive customer"
  - id: ERR_COIL_WEIGHT_EXCEEDED
    http: 422
    condition: "Planned or actual consumption exceeds coil.remaining_weight_kg"
  - id: ERR_PRICE_FLOOR_BREACH
    http: 422
    condition: "Index-adjusted piece price would fall below 1 cent at order close"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Unique constraint violated (customer_code, die_code, press_code, coil_number, part_number per customer)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request: missing required field, bad enum, bad datetime, non-positive number, end <= start"
  - id: ERR_NO_SHOTS_RECORDED
    http: 422
    condition: "Run completion with shots_recorded == 0 (scrap rate undefined)"
  - id: ERR_REJECT_COUNT_EXCEEDS_SHOTS
    http: 422
    condition: "Recorded rejects exceed shots_recorded at completion (good_count would be negative)"
  - id: ERR_RETURN_QUANTITY_EXCEEDED
    http: 422
    condition: "Cumulative outside-processing returns would exceed quantity_sent"
  - id: ERR_ORDER_NOT_COMPLETED
    http: 409
    condition: "close-short attempted while parent order is not COMPLETED"
  - id: ERR_AUDIT_FINDINGS_REQUIRED
    http: 422
    condition: "Recording audit result FAIL with findings_count < 1"

roles:
  - name: PlantAdmin
    description: "Plant administrator; manages customers, presses, index publications, and the logical clock"
    identity: "opaque"
    exclusive_operations: ["create customers", "create presses", "publish index values", "set logical clock"]
    shared_operations: ["read all resources"]
  - name: ProcessEngineer
    description: "Owns parts, strip layouts, die assignments, and PPAP submissions"
    identity: "opaque"
    exclusive_operations: ["create parts", "create/approve strip layouts", "create part-die assignments", "submit PPAP"]
    shared_operations: ["read parts, layouts, submissions"]
  - name: ToolroomManager
    description: "Owns dies and their repair lifecycle"
    identity: "opaque"
    exclusive_operations: ["create dies", "send to repair", "complete repair", "retire dies"]
    shared_operations: ["read dies"]
  - name: SetupLead
    description: "Plans and executes die changeovers"
    identity: "opaque"
    exclusive_operations: ["plan/start/complete/cancel die changeovers"]
    shared_operations: ["read presses, dies, changeovers"]
  - name: ProductionPlanner
    description: "Owns production orders and run scheduling"
    identity: "opaque"
    exclusive_operations: ["create/release/complete/close/cancel production orders", "schedule production runs"]
    shared_operations: ["read orders, runs, coils, presses"]
  - name: PressOperator
    description: "Operates presses: starts/completes/aborts runs and records reject events"
    identity: "opaque"
    exclusive_operations: ["start/complete/abort runs", "record reject events"]
    shared_operations: ["read runs, presses, orders"]
  - name: QualityEngineer
    description: "Quality gate keeper: coil disposition, PPAP review, layered audits"
    identity: "opaque"
    exclusive_operations: ["approve/reject/hold coils", "review/approve/reject PPAP", "schedule and record layered audits"]
    shared_operations: ["read coils, submissions, audits, presses"]
  - name: ShippingClerk
    description: "Receiving and outside processing logistics"
    identity: "opaque"
    exclusive_operations: ["receive coils", "create outside processing orders", "record returns", "close-short"]
    shared_operations: ["read coils, outside orders"]
  - name: CostAnalyst
    description: "Read-only financial view over pricing and heat-lot exposure"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["read customers, orders, price adjustments, index publications, heat-lot exposure"]
