# =============================================================================
# Task 1893: Loan Participation & Syndication Administration (agent bank)
# PRD Benchmark Seed Tables — SCAFFOLD.yaml (§1.0–§1.7)
# =============================================================================

scenario: |
  1893. Loan Participation & Syndication Administration (agent bank loan administration): participation agreement terms & pro-rata share, funding & settlement with participants, payment distribution waterfall & servicing fee retention, borrower modification requiring participant consent, participant reporting package & financial statement delivery, default handling & voting thresholds, buyback obligation on breach, transfer/assignment of participations

domain_name: loan-participation-syndication
api_prefix: /api

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Borrower legal name" }
      - { name: sector, type: enum, source: input, description: "Sector classification", constraints: "INDUSTRIAL | ENERGY | REAL_ESTATE | HEALTHCARE | TECHNOLOGY | FINANCIAL | OTHER" }
      - { name: risk_rating, type: enum, source: input, description: "Internal risk rating", constraints: "INVESTMENT_GRADE | CROSSOVER | SPECULATIVE | DISTRESSED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DELINQUENT | INSOLVENT; DELINQUENT while a non-insolvency DefaultCase is DECLARED on any of its facilities, INSOLVENT for INSOLVENCY defaults, restored to ACTIVE on cure/waive" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; obligor under the facility" }
      - { name: facility_name, type: string, source: input, description: "Facility name" }
      - { name: total_commitment_cents, type: integer, source: input, description: "Facility size ceiling; aggregate participant commitments may not exceed this" }
      - { name: currency, type: string, source: input, description: "ISO 4217 currency code" }
      - { name: interest_rate_bps, type: integer, source: input, description: "Annual interest rate in basis points" }
      - { name: day_count_basis, type: enum, source: input, description: "Day count convention for interest accrual", constraints: "ACT_360 | ACT_365 | BASIS_30_360" }
      - { name: servicing_fee_bps, type: integer, source: input, description: "Annual servicing fee in basis points on outstanding principal, retained by agent off the top of every distribution" }
      - { name: default_interest_addon_bps, type: integer, source: input, description: "Additional annual basis points accrued while a DefaultCase is active" }
      - { name: maturity_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); facility maturity" }
      - { name: majority_threshold_bps, type: integer, source: input, default: 5001, description: "Approving share (basis points of adjusted voting base) required for MAJORITY consents and default waivers; comparison is >=" }
      - { name: supermajority_threshold_bps, type: integer, source: input, default: 6667, description: "Approving share (bps) required for SUPERMAJORITY consents and acceleration; comparison is >=" }
      - { name: quorum_bps, type: integer, source: input, default: 5000, description: "Minimum cast share (bps, including ABSTAIN) for a valid modification tally; below quorum the solicitation EXPIRES" }
      - { name: voting_window_days, type: integer, source: input, default: 15, description: "Days between voting_open_at and voting_close_at on a solicitation" }
      - { name: min_transfer_cents, type: integer, source: input, default: 1000000, description: "Minimum participation transfer amount; also the minimum residual stub a partial transfer may leave behind" }
      - { name: status, type: enum, source: system, default: "STRUCTURING", description: "STRUCTURING | SYNDICATING | COMMITTED | FUNDING | ACTIVE | IN_DEFAULT | ACCELERATED | CLOSED | TERMINATED" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of commitment_cents over participants with status IN {COMMITTED, FUNDED}" }
      - { name: funded_principal_cents, type: integer, source: computed, default: 0, description: "Sum of due_cents over settlements in {CONFIRMED, LATE_CONFIRMED}" }
      - { name: outstanding_principal_cents, type: integer, source: computed, default: 0, description: "funded_principal_cents minus principal distributed, written down, or settled via buyback... equals sum over draws of outstanding_cents" }
      - { name: accrued_interest_cents, type: integer, source: computed, default: 0, description: "Unpaid accrued interest: sum over draws of accrued_unpaid_interest_cents; materialized at distribution-run creation, default declare/cure/waive/accelerate, and buyback settle" }
      - { name: undistributed_cash_cents, type: integer, source: computed, default: 0, description: "Borrower cash received but not yet run through a distribution waterfall" }
      - { name: last_distribution_value_date, type: string, source: system, default: null, description: "value_date of the most recently created distribution run; null until the first run" }

  - name: Participant
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: participant_name, type: string, source: input, description: "Participant institution name" }
      - { name: commitment_cents, type: integer, source: input, description: "Committed participation amount (> 0)" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | COMMITTED | FUNDED | EXITED | WITHDRAWN" }
      - { name: share_bps, type: integer, source: computed, default: 0, description: "Pro-rata share in basis points of facility committed_cents; floor allocation with remainder distribution (see participant_share_bps calc)" }
      - { name: funded_cents, type: integer, source: computed, default: 0, description: "Sum of due_cents over this participant's settlements in {CONFIRMED, LATE_CONFIRMED}" }
      - { name: cumulative_interest_cents, type: integer, source: computed, default: 0, description: "Lifetime interest distributed to this participant (increases on line REMITTED, decreases on CLAWED_BACK)" }
      - { name: cumulative_principal_cents, type: integer, source: computed, default: 0, description: "Lifetime principal distributed to this participant" }

  - name: Draw
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: draw_amount_cents, type: integer, source: input, description: "Amount borrowed under this draw (> 0)" }
      - { name: accrual_start_date, type: string, source: input, description: "ISO 8601 date; interest accrual window start (inclusive)" }
      - { name: accrual_end_date, type: string, source: input, description: "ISO 8601 date; interest accrual window end (exclusive); must be > accrual_start_date; half-open overlap rule vs sibling draws" }
      - { name: status, type: enum, source: system, default: "FUNDING", description: "FUNDING | SETTLED | CANCELLED" }
      - { name: outstanding_cents, type: integer, source: computed, default: 0, description: "Funded principal not yet distributed or written down; set to draw_amount_cents when the draw SETTLES" }
      - { name: accrued_unpaid_interest_cents, type: integer, source: computed, default: 0, description: "Accrued unpaid interest on this draw as of accrual_as_of_date" }
      - { name: accrual_as_of_date, type: string, source: system, description: "Date through which interest has been materialized; initialized to accrual_start_date" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "When the draw reached SETTLED" }

  - name: FundingSettlement
    parent: Draw
    common_fields: true
    fields:
      - { name: draw_id, type: string, source: system, description: "FK -> Draw.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; denormalized for filtered listing" }
      - { name: due_cents, type: integer, source: computed, description: "Pro-rata share of draw_amount_cents by participant share_bps with remainder allocation" }
      - { name: received_cents, type: integer, source: system, default: 0, description: "Amount reported wired by the participant" }
      - { name: funding_due_date, type: string, source: system, description: "ISO date = draw creation date + FUNDING_WINDOW_DAYS (5)" }
      - { name: wired_at, type: datetime, source: system, default: null, description: "When the participant reported the wire" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | WIRED | CONFIRMED | LATE_CONFIRMED | DEFAULTED | VOID" }
      - { name: penalty_interest_cents, type: integer, source: computed, default: 0, description: "Late-funding penalty computed at confirm when wired date > funding_due_date" }

  - name: BorrowerPayment
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; copied from facility.borrower_id at creation" }
      - { name: payment_type, type: enum, source: input, description: "REGULAR | PREPAYMENT; PREPAYMENT is blocked while the facility is IN_DEFAULT or ACCELERATED" }
      - { name: amount_cents, type: integer, source: input, description: "Cash received (> 0)" }
      - { name: value_date, type: string, source: input, description: "ISO 8601 date the payment is valued for accrual/fee purposes" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | ALLOCATED | REMITTED | REVERSED" }
      - { name: received_at, type: datetime, source: system, description: "Server timestamp of receipt" }
      - { name: reversed_at, type: datetime, source: system, default: null, description: "When the payment was reversed" }

  - name: DistributionRun
    parent: BorrowerPayment
    common_fields: true
    fields:
      - { name: payment_id, type: string, source: system, description: "FK -> BorrowerPayment.id" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; denormalized" }
      - { name: run_number, type: integer, source: system, description: "1-based sequence per payment; increments on each superseding run" }
      - { name: servicing_fee_cents, type: integer, source: computed, description: "Agent servicing fee retained off the top" }
      - { name: interest_pool_cents, type: integer, source: computed, description: "Amount allocated to participant interest" }
      - { name: principal_pool_cents, type: integer, source: computed, description: "Amount allocated to participant principal" }
      - { name: agent_retained_cents, type: integer, source: computed, description: "Portion of interest+principal pools attributable to exited/absent participants, retained by the agent" }
      - { name: status, type: enum, source: system, default: "COMPUTED", description: "COMPUTED | SUPERSEDED | REMITTED | VOIDED" }
      - { name: superseded_by_run_id, type: string, source: system, default: null, description: "FK -> DistributionRun.id; set when a newer run supersedes this one" }
      - { name: remitted_at, type: datetime, source: system, default: null, description: "When the run was remitted" }

  - name: DistributionLine
    parent: DistributionRun
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> DistributionRun.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: interest_cents, type: integer, source: computed, description: "Interest allocated to this participant" }
      - { name: principal_cents, type: integer, source: computed, description: "Principal allocated to this participant" }
      - { name: total_cents, type: integer, source: computed, description: "interest_cents + principal_cents" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | REMITTED | CLAWED_BACK | VOID" }

  - name: ModificationRequest
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: requested_by_borrower_id, type: string, source: system, description: "FK -> Borrower.id; taken from X-User-ID at creation" }
      - { name: modification_type, type: enum, source: input, description: "RATE_CHANGE | MATURITY_EXTENSION | COMMITMENT_INCREASE | COVENANT_WAIVER | PRINCIPAL_WRITE_DOWN | BORROWER_SUBSTITUTION" }
      - { name: terms, type: object, source: input, description: "Type-keyed terms: new_interest_rate_bps | new_maturity_date | commitment_increase_cents | waiver_text | write_down_cents | new_borrower_id; exactly the term matching modification_type is required" }
      - { name: required_consent_class, type: enum, source: computed, description: "MAJORITY | SUPERMAJORITY | UNANIMOUS; derived from modification_type: COMMITMENT_INCREASE/COVENANT_WAIVER -> MAJORITY, RATE_CHANGE/MATURITY_EXTENSION -> SUPERMAJORITY, PRINCIPAL_WRITE_DOWN/BORROWER_SUBSTITUTION -> UNANIMOUS" }
      - { name: required_threshold_bps, type: integer, source: computed, description: "MAJORITY -> facility.majority_threshold_bps; SUPERMAJORITY -> facility.supermajority_threshold_bps; UNANIMOUS -> 10000" }
      - { name: voting_open_at, type: datetime, source: system, default: null, description: "Set at solicitation" }
      - { name: voting_close_at, type: datetime, source: system, default: null, description: "voting_open_at + facility.voting_window_days" }
      - { name: voting_base_cents, type: integer, source: system, default: null, description: "Snapshot of facility.committed_cents at solicitation" }
      - { name: approving_commitment_cents, type: integer, source: computed, default: 0, description: "Sum of commitments of participants with a non-VOIDED APPROVE vote" }
      - { name: cast_commitment_cents, type: integer, source: computed, default: 0, description: "Sum of commitments of participants with any non-VOIDED vote (incl. ABSTAIN)" }
      - { name: approving_share_bps, type: integer, source: computed, default: 0, description: "floor(10000 * approving / adjusted base); see consent_tally" }
      - { name: cast_share_bps, type: integer, source: computed, default: 0, description: "floor(10000 * cast / adjusted base)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SOLICITING | PASSED | FAILED | EXPIRED | IMPLEMENTED | WITHDRAWN" }

  - name: ConsentVote
    parent: ModificationRequest
    common_fields: true
    fields:
      - { name: modification_id, type: string, source: system, description: "FK -> ModificationRequest.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; taken from X-User-ID" }
      - { name: vote, type: enum, source: input, description: "APPROVE | REJECT | ABSTAIN" }
      - { name: voted_share_bps, type: integer, source: system, description: "Snapshot of participant.share_bps at cast time (informational; tally uses commitment sums)" }
      - { name: cast_at, type: datetime, source: system, description: "When the vote was last cast/recast" }
      - { name: recast_count, type: integer, source: system, default: 0, description: "Number of recasts" }
      - { name: status, type: enum, source: system, default: "CAST", description: "CAST | RECAST | VOIDED" }

  - name: DefaultCase
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: default_type, type: enum, source: input, description: "PAYMENT_DEFAULT | COVENANT_DEFAULT | INSOLVENCY | REPRESENTATION_BREACH" }
      - { name: declared_at, type: datetime, source: system, description: "When the default was declared" }
      - { name: voting_base_cents, type: integer, source: system, description: "Snapshot of facility.committed_cents at declaration" }
      - { name: accelerate_commitment_cents, type: integer, source: computed, default: 0, description: "Commitments behind non-VOIDED ACCELERATE votes" }
      - { name: waive_commitment_cents, type: integer, source: computed, default: 0, description: "Commitments behind non-VOIDED WAIVE votes" }
      - { name: accelerate_share_bps, type: integer, source: computed, default: 0, description: "floor(10000 * accelerate_commitment / adjusted base)" }
      - { name: waive_share_bps, type: integer, source: computed, default: 0, description: "floor(10000 * waive_commitment / adjusted base)" }
      - { name: status, type: enum, source: system, default: "DECLARED", description: "DECLARED | CURED | WAIVED | ACCELERATED" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "When the case left DECLARED" }

  - name: DefaultVote
    parent: DefaultCase
    common_fields: true
    fields:
      - { name: default_case_id, type: string, source: system, description: "FK -> DefaultCase.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; taken from X-User-ID" }
      - { name: vote, type: enum, source: input, description: "ACCELERATE | WAIVE | REJECT" }
      - { name: voted_share_bps, type: integer, source: system, description: "Snapshot of participant.share_bps at cast" }
      - { name: cast_at, type: datetime, source: system, description: "When the vote was last cast/recast" }
      - { name: recast_count, type: integer, source: system, default: 0, description: "Number of recasts" }
      - { name: status, type: enum, source: system, default: "CAST", description: "CAST | RECAST | VOIDED" }

  - name: FinancialStatement
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; copied from facility.borrower_id" }
      - { name: statement_type, type: enum, source: input, description: "QUARTERLY | ANNUAL_AUDITED" }
      - { name: period_end_date, type: string, source: input, description: "ISO 8601 date; end of the reporting period covered" }
      - { name: document_ref, type: string, source: input, description: "Document reference URI" }
      - { name: due_date, type: string, source: computed, description: "period_end_date + 45 days (QUARTERLY) or + 90 days (ANNUAL_AUDITED)" }
      - { name: received_at, type: datetime, source: system, default: null, description: "When the agent received the statement" }
      - { name: status, type: enum, source: system, default: "EXPECTED", description: "EXPECTED | RECEIVED | LATE_RECEIVED | WAIVED" }

  - name: ReportingPackage
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: period_label, type: string, source: input, description: "Human label, e.g. 2026-Q2" }
      - { name: period_start_date, type: string, source: input, description: "ISO 8601 date; CLOSED interval start" }
      - { name: period_end_date, type: string, source: input, description: "ISO 8601 date; CLOSED interval end (must be >= period_start_date)" }
      - { name: due_date, type: string, source: input, description: "ISO 8601 date by which delivery to participants is due" }
      - { name: financial_statement_id, type: string, source: input, default: null, description: "FK -> FinancialStatement.id; optional attached borrower financials" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | ASSEMBLED | DELIVERED | LATE_DELIVERED" }
      - { name: delivered_recipient_count, type: integer, source: system, default: null, description: "Number of participants in {COMMITTED, FUNDED} at delivery time" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "When delivery occurred" }

  - name: ParticipationTransfer
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: from_participant_id, type: string, source: system, description: "FK -> Participant.id; transferor, taken from X-User-ID" }
      - { name: transferee_participant_id, type: string, source: input, default: null, description: "FK -> Participant.id; existing participant absorbing the share (exactly one of this / transferee_name required)" }
      - { name: transferee_name, type: string, source: input, default: null, description: "Name for a new-entrant transferee participant" }
      - { name: transferee_resolved_participant_id, type: string, source: system, default: null, description: "FK -> Participant.id; the participant credited at settle" }
      - { name: transfer_amount_cents, type: integer, source: input, description: "Amount of commitment transferred (> 0, >= facility.min_transfer_cents)" }
      - { name: settlement_date, type: string, source: input, description: "ISO 8601 date the transfer settles; must avoid distribution blackout windows" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | AGENT_APPROVED | SETTLED | REJECTED | CANCELLED" }
      - { name: proposed_at, type: datetime, source: system, description: "When proposed" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "When settled" }

  - name: BuybackDemand
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; demanding participant, taken from X-User-ID" }
      - { name: breach_type, type: enum, source: input, description: "MISREPRESENTATION | SERVICING_BREACH | DOCUMENTATION_DEFECT; SERVICING_BREACH selects the penalty price variant" }
      - { name: breach_description, type: string, source: input, default: null, description: "Free-text breach description" }
      - { name: demanded_at, type: datetime, source: system, description: "When the demand was lodged" }
      - { name: status, type: enum, source: system, default: "DEMANDED", description: "DEMANDED | ACKNOWLEDGED | DISPUTED | SETTLED | RESCINDED" }
      - { name: outstanding_share_cents, type: integer, source: computed, default: null, description: "participant.funded_cents - participant.cumulative_principal_cents, computed at settle" }
      - { name: accrued_share_cents, type: integer, source: computed, default: null, description: "floor(participant.share_bps * facility.accrued_interest_cents / 10000) at settle (accrual first materialized to settle date)" }
      - { name: penalty_cents, type: integer, source: computed, default: null, description: "floor(outstanding_share_cents * BUYBACK_PENALTY_BPS / 10000) when breach_type == SERVICING_BREACH, else 0" }
      - { name: repurchase_price_cents, type: integer, source: computed, default: null, description: "outstanding_share_cents + accrued_share_cents + penalty_cents" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "When the buyback settled" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: Borrower
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system (cascade of DefaultCase creation with default_type != INSOLVENCY on any facility of this borrower)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: INSOLVENT
        trigger: "system (cascade of DefaultCase creation with default_type == INSOLVENCY)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system (cascade when the last DECLARED DefaultCase on any facility of this borrower is CURED or WAIVED)"
        actor: system
        preconditions: ["No other DECLARED DefaultCase exists on any facility of this borrower"]
        side_effects: []
      - from: INSOLVENT
        to: ACTIVE
        trigger: "system (cascade when the INSOLVENCY DefaultCase is CURED or WAIVED)"
        actor: system
        preconditions: ["No other DECLARED DefaultCase exists on any facility of this borrower"]
        side_effects: []

  - entity: Facility
    initial_state: STRUCTURING
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: STRUCTURING
        to: SYNDICATING
        trigger: "system (bubble-up when the first participant reaches COMMITTED)"
        actor: system
        preconditions: []
        side_effects: ["Recompute committed_cents via committed_recompute"]
      - from: SYNDICATING
        to: COMMITTED
        trigger: "system (bubble-up when committed_cents == total_commitment_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: SYNDICATING
        trigger: "system (bubble-down when a COMMITTED participant is withdrawn and committed_cents < total_commitment_cents)"
        actor: system
        preconditions: ["No Draw with status != CANCELLED exists"]
        side_effects: []
      - from: COMMITTED
        to: FUNDING
        trigger: "POST /api/draws (first draw creation)"
        actor: AgentBank
        preconditions: ["facility.status == COMMITTED (ERR_FACILITY_NOT_COMMITTED)"]
        side_effects:
          - "Generate one FundingSettlement per participant with status COMMITTED, due_cents by share_bps"
          - "Increments Facility.version by 1"
      - from: FUNDING
        to: ACTIVE
        trigger: "system (bubble-up when the first Draw reaches SETTLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: IN_DEFAULT
        trigger: "POST /api/default_cases (DefaultCase created)"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "Hop 2 of the default cascade: every ModificationRequest in SOLICITING on this facility transitions to WITHDRAWN"
          - "Hop 2 of the default cascade: every Draw's accrual is re-rated via default_interest_re_rate (base rate + default_interest_addon_bps from declared date)"
          - "Hop 3 of the default cascade: each re-rated Draw's accrued_unpaid_interest_cents change bubbles into facility.accrued_interest_cents = sum over draws"
          - "Borrower transitions ACTIVE -> DELINQUENT (or INSOLVENT for INSOLVENCY type)"
      - from: IN_DEFAULT
        to: ACTIVE
        trigger: "POST /api/default_cases/{caseId}/cure or /waive (DefaultCase resolved CURED or WAIVED)"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "Draw accrual re-rated via default_interest_re_rate (cure: addon stops at cure date; waive: addon removed retroactively)"
          - "facility.accrued_interest_cents reconciled as sum over draws"
          - "Borrower restored to ACTIVE when no other DECLARED case exists"
          - "If outstanding_principal_cents == 0 and accrued_interest_cents == 0 and at least one payment is REMITTED: transition directly to CLOSED instead"
      - from: IN_DEFAULT
        to: ACCELERATED
        trigger: "POST /api/default_cases/{caseId}/accelerate (DefaultCase reaches ACCELERATED)"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "Default interest addon continues to accrue; accrued_interest_cents reconciled"
          - "POST /api/draws becomes unavailable (ERR_INVALID_STATE_TRANSITION)"
      - from: ACTIVE
        to: CLOSED
        trigger: "system (bubble-up at distribution remit when outstanding_principal_cents == 0 and accrued_interest_cents == 0 and at least one payment REMITTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCELERATED
        to: CLOSED
        trigger: "system (same bubble-up condition as ACTIVE -> CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STRUCTURING
        to: TERMINATED
        trigger: "POST /api/facilities/{facilityId}/terminate"
        actor: AgentBank
        preconditions: ["No Draw with status != CANCELLED exists (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["All participants in PROPOSED or COMMITTED transition to WITHDRAWN"]
      - from: SYNDICATING
        to: TERMINATED
        trigger: "POST /api/facilities/{facilityId}/terminate"
        actor: AgentBank
        preconditions: ["No Draw with status != CANCELLED exists"]
        side_effects: ["All participants in PROPOSED or COMMITTED transition to WITHDRAWN"]
      - from: COMMITTED
        to: TERMINATED
        trigger: "POST /api/facilities/{facilityId}/terminate"
        actor: AgentBank
        preconditions: ["No Draw with status != CANCELLED exists"]
        side_effects: ["All participants in PROPOSED or COMMITTED transition to WITHDRAWN"]

  - entity: Participant
    initial_state: PROPOSED
    terminal_states: [EXITED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: COMMITTED
        trigger: "POST /api/participants/{participantId}/commit"
        actor: AgentBank
        preconditions:
          - "facility.status IN {STRUCTURING, SYNDICATING, COMMITTED} (else ERR_INVALID_STATE_TRANSITION)"
          - "facility.committed_cents + commitment_cents <= facility.total_commitment_cents (else ERR_COMMITMENT_EXCEEDS_TOTAL)"
        side_effects:
          - "facility.committed_cents recomputed via committed_recompute (mutation increments Facility.version)"
          - "participant_share_bps recomputed for ALL participants of the facility"
          - "Facility bubble: STRUCTURING -> SYNDICATING, or SYNDICATING -> COMMITTED at exact equality"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /api/participants/{participantId}/withdraw"
        actor: AgentBank
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: WITHDRAWN
        trigger: "POST /api/participants/{participantId}/withdraw"
        actor: AgentBank
        preconditions:
          - "facility.status IN {STRUCTURING, SYNDICATING, COMMITTED} (pre-funding only; else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "committed_cents recomputed; if facility was COMMITTED and now below total: Facility COMMITTED -> SYNDICATING"
          - "participant_share_bps recomputed for remaining participants"
      - from: COMMITTED
        to: FUNDED
        trigger: "system (bubble-up when this participant's first FundingSettlement reaches CONFIRMED or LATE_CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: ["participant.funded_cents += settlement.due_cents"]
      - from: COMMITTED
        to: EXITED
        trigger: "POST /api/transfers/{transferId}/settle with transfer_amount_cents == commitment_cents (full transfer)"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "This participant's CAST/RECAST ConsentVotes on SOLICITING solicitations and DefaultVotes on DECLARED cases transition to VOIDED"
          - "participant_share_bps recomputed for remaining participants"
      - from: FUNDED
        to: EXITED
        trigger: "POST /api/transfers/{transferId}/settle (full transfer) or POST /api/buyback_demands/{demandId}/settle"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "On buyback: facility.committed_cents -= commitment_cents (position retained on the agent's own book; outstanding_principal_cents unchanged)"
          - "On full transfer: facility.committed_cents unchanged (transferee absorbs the commitment)"
          - "This participant's CAST/RECAST votes on SOLICITING solicitations and DECLARED default cases transition to VOIDED; tallies recomputed"
          - "participant_share_bps recomputed for remaining participants"

  - entity: Draw
    initial_state: FUNDING
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: FUNDING
        to: SETTLED
        trigger: "system (bubble-up when every FundingSettlement of this draw is in {CONFIRMED, LATE_CONFIRMED})"
        actor: system
        preconditions: []
        side_effects:
          - "draw.outstanding_cents = draw_amount_cents; settled_at set"
          - "facility.funded_principal_cents and outstanding_principal_cents recomputed"
          - "Facility bubble: FUNDING -> ACTIVE on the first settled draw"
      - from: FUNDING
        to: CANCELLED
        trigger: "POST /api/draws/{drawId}/cancel"
        actor: AgentBank
        preconditions:
          - "No settlement of this draw in {CONFIRMED, LATE_CONFIRMED} (else ERR_DRAW_HAS_CONFIRMED_FUNDS)"
        side_effects:
          - "All settlements of this draw in {PENDING, WIRED, DEFAULTED} transition to VOID"
          - "If no non-cancelled draw remains and facility.status == FUNDING: facility reverts FUNDING -> COMMITTED"

  - entity: FundingSettlement
    initial_state: PENDING
    terminal_states: [CONFIRMED, LATE_CONFIRMED, VOID]
    transitions:
      - from: PENDING
        to: WIRED
        trigger: "POST /api/funding_settlements/{settlementId}/report_wire"
        actor: ParticipantLender
        preconditions:
          - "X-User-ID == settlement.participant_id (else ERR_NOT_RESOURCE_OWNER)"
          - "amount_cents > 0 (else ERR_INVALID_REQUEST)"
        side_effects: ["received_cents = amount_cents; wired_at = current clock"]
      - from: DEFAULTED
        to: WIRED
        trigger: "POST /api/funding_settlements/{settlementId}/report_wire (late wire)"
        actor: ParticipantLender
        preconditions: ["X-User-ID == settlement.participant_id"]
        side_effects: ["received_cents = amount_cents; wired_at = current clock"]
      - from: PENDING
        to: DEFAULTED
        trigger: "POST /api/funding_settlements/{settlementId}/mark_defaulted"
        actor: AgentBank
        preconditions:
          - "current clock date > funding_due_date (else ERR_FUNDING_NOT_YET_DUE)"
        side_effects: []
      - from: WIRED
        to: CONFIRMED
        trigger: "POST /api/funding_settlements/{settlementId}/confirm when date(wired_at) <= funding_due_date"
        actor: AgentBank
        preconditions:
          - "received_cents == due_cents (else ERR_FUNDING_AMOUNT_MISMATCH)"
        side_effects:
          - "participant.funded_cents += due_cents; Participant bubble COMMITTED -> FUNDED"
          - "Draw bubble to SETTLED when all sibling settlements are in {CONFIRMED, LATE_CONFIRMED}"
      - from: WIRED
        to: LATE_CONFIRMED
        trigger: "POST /api/funding_settlements/{settlementId}/confirm when date(wired_at) > funding_due_date"
        actor: AgentBank
        preconditions:
          - "received_cents == due_cents (else ERR_FUNDING_AMOUNT_MISMATCH; checked first)"
          - "penalty_received_cents == late_funding_penalty(due_cents, days_late) (else ERR_PENALTY_AMOUNT_MISMATCH)"
        side_effects:
          - "penalty_interest_cents recorded on the settlement"
          - "participant.funded_cents += due_cents; Participant bubble COMMITTED -> FUNDED"
          - "Draw bubble to SETTLED when all sibling settlements are in {CONFIRMED, LATE_CONFIRMED}"
      - from: PENDING
        to: VOID
        trigger: "system (cascade of Draw cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WIRED
        to: VOID
        trigger: "system (cascade of Draw cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEFAULTED
        to: VOID
        trigger: "system (cascade of Draw cancellation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BorrowerPayment
    initial_state: RECEIVED
    terminal_states: [REMITTED, REVERSED]
    transitions:
      - from: RECEIVED
        to: ALLOCATED
        trigger: "POST /api/payments/{paymentId}/distribution_runs (first run for the payment)"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "Waterfall computed via waterfall_distribution; DistributionLines created PENDING"
          - "facility.undistributed_cash_cents -= amount_cents"
          - "Increments BorrowerPayment.version by 1"
      - from: ALLOCATED
        to: REMITTED
        trigger: "system (bubble-up when the latest non-superseded run reaches REMITTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: REVERSED
        trigger: "POST /api/payments/{paymentId}/reverse"
        actor: AgentBank
        preconditions: []
        side_effects: ["facility.undistributed_cash_cents -= amount_cents"]
      - from: ALLOCATED
        to: REVERSED
        trigger: "POST /api/payments/{paymentId}/reverse"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "COMPUTED runs -> VOIDED; their PENDING lines -> VOID"
          - "facility.undistributed_cash_cents unchanged (already deducted at allocation)"
      - from: REMITTED
        to: REVERSED
        trigger: "POST /api/payments/{paymentId}/reverse (clawback)"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "Hop 1: the REMITTED run's lines transition REMITTED -> CLAWED_BACK"
          - "Hop 2: each CLAWED_BACK line debits participant.cumulative_interest_cents/cumulative_principal_cents and restores draw.outstanding_cents via principal_reduction_allocation reversed"
          - "Hop 3: facility.outstanding_principal_cents and accrued_interest_cents restored; if facility was CLOSED it reopens CLOSED -> ACTIVE"
        note: "Compensation transition: after reversal, facility ledgers equal their pre-payment values"

  - entity: DistributionRun
    initial_state: COMPUTED
    terminal_states: [SUPERSEDED, REMITTED, VOIDED]
    transitions:
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "system (a newer DistributionRun is created for the same payment)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_run_id set to the new run"
          - "This run's PENDING lines transition to VOID"
      - from: COMPUTED
        to: REMITTED
        trigger: "POST /api/distribution_runs/{runId}/remit"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "Hop 1: this run's PENDING lines transition to REMITTED"
          - "Hop 2: each REMITTED line credits participant.cumulative_interest_cents/cumulative_principal_cents, and its principal_cents reduces draw.outstanding_cents via principal_reduction_allocation (oldest draw first)"
          - "Hop 3: facility.outstanding_principal_cents -= principal_pool_cents; facility.accrued_interest_cents -= interest_pool_cents; each draw.accrued_unpaid_interest_cents reduced oldest-first; accrual_as_of_date advanced to payment.value_date; last_distribution_value_date set"
          - "Hop 4: Facility bubble to CLOSED when outstanding and accrued both reach 0"
          - "Payment bubble: ALLOCATED -> REMITTED"
      - from: COMPUTED
        to: VOIDED
        trigger: "system (cascade of payment reversal from ALLOCATED)"
        actor: system
        preconditions: []
        side_effects: ["PENDING lines -> VOID"]

  - entity: DistributionLine
    initial_state: PENDING
    terminal_states: [REMITTED, CLAWED_BACK, VOID]
    transitions:
      - from: PENDING
        to: REMITTED
        trigger: "system (cascade of run remit)"
        actor: system
        preconditions: []
        side_effects: ["Credits participant cumulative fields (ledger sync hop)"]
      - from: PENDING
        to: VOID
        trigger: "system (cascade of run supersede or void)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REMITTED
        to: CLAWED_BACK
        trigger: "system (cascade of payment reversal)"
        actor: system
        preconditions: []
        side_effects: ["Debits participant cumulative fields (compensation hop)"]

  - entity: ModificationRequest
    initial_state: DRAFT
    terminal_states: [IMPLEMENTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SOLICITING
        trigger: "POST /api/modification_requests/{modificationId}/solicit"
        actor: AgentBank
        preconditions:
          - "facility.status NOT IN {IN_DEFAULT, ACCELERATED, CLOSED, TERMINATED} (ERR_FACILITY_IN_DEFAULT / ERR_INVALID_STATE_TRANSITION)"
          - "Solicitation buffer rule: no other solicitation window on this facility within SOLICITATION_BUFFER_HOURS (24h) of the proposed window (ERR_SOLICITATION_WINDOW_OVERLAP)"
        side_effects:
          - "voting_open_at = current clock; voting_close_at = open + facility.voting_window_days"
          - "voting_base_cents = facility.committed_cents snapshot"
      - from: FAILED
        to: SOLICITING
        trigger: "POST /api/modification_requests/{modificationId}/solicit (re-solicitation cycle)"
        actor: AgentBank
        preconditions: ["Same as DRAFT -> SOLICITING; prior votes remain but are not counted in the new round (vote records are per-round: prior-round votes transition to VOIDED at re-solicit)"]
        side_effects: ["Prior-round ConsentVotes -> VOIDED; new window and base snapshot"]
      - from: EXPIRED
        to: SOLICITING
        trigger: "POST /api/modification_requests/{modificationId}/solicit (re-solicitation cycle)"
        actor: AgentBank
        preconditions: ["Same as DRAFT -> SOLICITING"]
        side_effects: ["Prior-round ConsentVotes -> VOIDED; new window and base snapshot"]
      - from: SOLICITING
        to: PASSED
        trigger: "POST /api/modification_requests/{modificationId}/tally_close when cast_share_bps >= quorum_bps AND approving_share_bps >= required_threshold_bps"
        actor: AgentBank
        preconditions: ["current clock > voting_close_at (else ERR_VOTING_STILL_OPEN)"]
        side_effects: []
      - from: SOLICITING
        to: FAILED
        trigger: "POST /api/modification_requests/{modificationId}/tally_close when quorum met but threshold not met"
        actor: AgentBank
        preconditions: ["current clock > voting_close_at"]
        side_effects: []
      - from: SOLICITING
        to: EXPIRED
        trigger: "POST /api/modification_requests/{modificationId}/tally_close when cast_share_bps < quorum_bps (including zero votes)"
        actor: AgentBank
        preconditions: ["current clock > voting_close_at"]
        side_effects: []
      - from: PASSED
        to: IMPLEMENTED
        trigger: "POST /api/modification_requests/{modificationId}/implement"
        actor: AgentBank
        preconditions: ["status == PASSED (else ERR_MODIFICATION_NOT_PASSED)"]
        side_effects:
          - "RATE_CHANGE: facility.interest_rate_bps = terms.new_interest_rate_bps (prospective accrual only)"
          - "MATURITY_EXTENSION: facility.maturity_date = terms.new_maturity_date"
          - "COMMITMENT_INCREASE: facility.total_commitment_cents += terms.commitment_increase_cents; shares recomputed; if facility COMMITTED it demotes to SYNDICATING"
          - "COVENANT_WAIVER: no facility field change; waiver_text recorded"
          - "PRINCIPAL_WRITE_DOWN: terms.write_down_cents <= facility.outstanding_principal_cents (else ERR_WRITEDOWN_EXCEEDS_OUTSTANDING); reduces draw.outstanding_cents oldest-first via principal_reduction_allocation; facility.outstanding_principal_cents recomputed"
          - "BORROWER_SUBSTITUTION: terms.new_borrower_id must reference an existing Borrower (else ERR_NOT_FOUND); facility.borrower_id updated"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/modification_requests/{modificationId}/withdraw"
        actor: AgentBank | Borrower
        preconditions: ["Borrower caller must be the requesting borrower (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: []
      - from: SOLICITING
        to: WITHDRAWN
        trigger: "POST /api/modification_requests/{modificationId}/withdraw OR system cascade when the facility enters IN_DEFAULT"
        actor: AgentBank | Borrower | system
        preconditions: []
        side_effects: ["CAST/RECAST votes on this solicitation transition to VOIDED"]

  - entity: ConsentVote
    initial_state: CAST
    terminal_states: [VOIDED]
    transitions:
      - from: CAST
        to: RECAST
        trigger: "POST /api/consent_votes/{voteId}/recast"
        actor: ParticipantLender
        preconditions:
          - "X-User-ID == vote.participant_id (ERR_NOT_RESOURCE_OWNER)"
          - "parent solicitation still SOLICITING and current clock <= voting_close_at (ERR_VOTING_CLOSED otherwise)"
        side_effects: ["vote field replaced; recast_count += 1; cast_at refreshed; modification tallies recomputed"]
      - from: RECAST
        to: RECAST
        trigger: "POST /api/consent_votes/{voteId}/recast (self-loop cycle)"
        actor: ParticipantLender
        preconditions: ["Same as CAST -> RECAST"]
        side_effects: ["Same as CAST -> RECAST"]
      - from: CAST
        to: VOIDED
        trigger: "system (participant exits via transfer/buyback; solicitation withdrawn or re-solicited)"
        actor: system
        preconditions: []
        side_effects: ["Modification tallies recomputed with the exited commitment removed from the adjusted base"]
      - from: RECAST
        to: VOIDED
        trigger: "system (same cascades as CAST -> VOIDED)"
        actor: system
        preconditions: []
        side_effects: ["Same as CAST -> VOIDED"]

  - entity: DefaultCase
    initial_state: DECLARED
    terminal_states: [CURED, WAIVED, ACCELERATED]
    transitions:
      - from: DECLARED
        to: CURED
        trigger: "POST /api/default_cases/{caseId}/cure"
        actor: AgentBank
        preconditions: []
        side_effects:
          - "Facility IN_DEFAULT -> ACTIVE (or CLOSED if fully repaid); default addon stops accruing from cure date (two/three-segment accrual)"
          - "Borrower restored to ACTIVE when no other DECLARED case exists"
      - from: DECLARED
        to: WAIVED
        trigger: "POST /api/default_cases/{caseId}/waive"
        actor: AgentBank
        preconditions: ["waive_share_bps >= facility.majority_threshold_bps (else ERR_WAIVER_THRESHOLD_NOT_MET)"]
        side_effects:
          - "Default interest addon removed RETROACTIVELY: all draw accrual recomputed at base rate; facility.accrued_interest_cents reconciled (derived-field reconciliation)"
          - "Facility IN_DEFAULT -> ACTIVE; Borrower restored"
      - from: DECLARED
        to: ACCELERATED
        trigger: "POST /api/default_cases/{caseId}/accelerate"
        actor: AgentBank
        preconditions: ["accelerate_share_bps >= facility.supermajority_threshold_bps (else ERR_ACCELERATION_THRESHOLD_NOT_MET)"]
        side_effects:
          - "Facility IN_DEFAULT -> ACCELERATED; all accrued interest becomes due; default addon continues"
          - "New draws rejected thereafter (ERR_INVALID_STATE_TRANSITION)"

  - entity: DefaultVote
    initial_state: CAST
    terminal_states: [VOIDED]
    transitions:
      - from: CAST
        to: RECAST
        trigger: "POST /api/default_votes/{voteId}/recast"
        actor: ParticipantLender
        preconditions:
          - "X-User-ID == vote.participant_id (ERR_NOT_RESOURCE_OWNER)"
          - "parent DefaultCase still DECLARED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["vote replaced; recast_count += 1; case tallies recomputed"]
      - from: RECAST
        to: RECAST
        trigger: "POST /api/default_votes/{voteId}/recast (self-loop cycle)"
        actor: ParticipantLender
        preconditions: ["Same as CAST -> RECAST"]
        side_effects: ["Same as CAST -> RECAST"]
      - from: CAST
        to: VOIDED
        trigger: "system (participant exits via transfer/buyback)"
        actor: system
        preconditions: []
        side_effects: ["Case tallies recomputed against the adjusted base"]
      - from: RECAST
        to: VOIDED
        trigger: "system (participant exits)"
        actor: system
        preconditions: []
        side_effects: ["Same as CAST -> VOIDED"]

  - entity: FinancialStatement
    initial_state: EXPECTED
    terminal_states: [RECEIVED, LATE_RECEIVED, WAIVED]
    transitions:
      - from: EXPECTED
        to: RECEIVED
        trigger: "POST /api/financial_statements/{statementId}/receive when current clock date <= due_date"
        actor: AgentBank
        preconditions: []
        side_effects: ["received_at set"]
      - from: EXPECTED
        to: LATE_RECEIVED
        trigger: "POST /api/financial_statements/{statementId}/receive when current clock date > due_date"
        actor: AgentBank
        preconditions: []
        side_effects: ["received_at set; lateness is recorded (grounds for a COVENANT_DEFAULT declaration, which remains a manual agent action)"]
      - from: EXPECTED
        to: WAIVED
        trigger: "POST /api/financial_statements/{statementId}/waive"
        actor: AgentBank
        preconditions: []
        side_effects: []

  - entity: ReportingPackage
    initial_state: OPEN
    terminal_states: [DELIVERED, LATE_DELIVERED]
    transitions:
      - from: OPEN
        to: ASSEMBLED
        trigger: "POST /api/reporting_packages/{packageId}/assemble"
        actor: AgentBank
        preconditions:
          - "If financial_statement_id is set: that statement's status must be RECEIVED or LATE_RECEIVED (else ERR_STATEMENT_NOT_RECEIVED)"
        side_effects: []
      - from: ASSEMBLED
        to: DELIVERED
        trigger: "POST /api/reporting_packages/{packageId}/deliver when current clock date <= due_date"
        actor: AgentBank
        preconditions: []
        side_effects: ["delivered_recipient_count = count of participants with status IN {COMMITTED, FUNDED}; delivered_at set"]
      - from: ASSEMBLED
        to: LATE_DELIVERED
        trigger: "POST /api/reporting_packages/{packageId}/deliver when current clock date > due_date"
        actor: AgentBank
        preconditions: []
        side_effects: ["Same as DELIVERED"]

  - entity: ParticipationTransfer
    initial_state: PROPOSED
    terminal_states: [SETTLED, REJECTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: AGENT_APPROVED
        trigger: "POST /api/transfers/{transferId}/approve"
        actor: AgentBank
        preconditions: ["facility.status NOT IN {IN_DEFAULT, ACCELERATED, CLOSED, TERMINATED} (ERR_FACILITY_IN_DEFAULT / ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/transfers/{transferId}/reject"
        actor: AgentBank
        preconditions: []
        side_effects: []
      - from: AGENT_APPROVED
        to: SETTLED
        trigger: "POST /api/transfers/{transferId}/settle"
        actor: AgentBank
        preconditions:
          - "facility.status NOT IN {IN_DEFAULT, ACCELERATED, CLOSED, TERMINATED}"
          - "transferor still in {COMMITTED, FUNDED} and transfer_amount_cents <= transferor.commitment_cents (re-validated at settle; else ERR_TRANSFER_EXCEEDS_COMMITMENT)"
        side_effects:
          - "transferor.commitment_cents -= transfer_amount_cents; if it reaches 0 the transferor transitions to EXITED (votes voided per Participant machine)"
          - "Transferee: existing participant's commitment_cents += amount, or a new Participant is created with status == transferor's current status and commitment_cents == amount; transferee_resolved_participant_id set"
          - "facility.committed_cents UNCHANGED (transfer conservation invariant); participant_share_bps recomputed for all participants"
          - "Increments the transferor Participant.version by 1 (OCC anchor)"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /api/transfers/{transferId}/cancel"
        actor: ParticipantLender
        preconditions: ["X-User-ID == from_participant_id (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: []
      - from: AGENT_APPROVED
        to: CANCELLED
        trigger: "POST /api/transfers/{transferId}/cancel"
        actor: ParticipantLender
        preconditions: ["X-User-ID == from_participant_id"]
        side_effects: []

  - entity: BuybackDemand
    initial_state: DEMANDED
    terminal_states: [SETTLED, RESCINDED]
    transitions:
      - from: DEMANDED
        to: ACKNOWLEDGED
        trigger: "POST /api/buyback_demands/{demandId}/acknowledge"
        actor: AgentBank
        preconditions: []
        side_effects: []
      - from: DEMANDED
        to: DISPUTED
        trigger: "POST /api/buyback_demands/{demandId}/dispute"
        actor: AgentBank
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: ACKNOWLEDGED
        trigger: "POST /api/buyback_demands/{demandId}/acknowledge (cycle: dispute resolved in participant's favor)"
        actor: AgentBank
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: SETTLED
        trigger: "POST /api/buyback_demands/{demandId}/settle"
        actor: AgentBank
        preconditions: ["participant still FUNDED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "Hop 1: facility accrual materialized to settle date; repurchase price computed via buyback_price (variant by breach_type)"
          - "Hop 2: participant transitions FUNDED -> EXITED; facility.committed_cents -= participant.commitment_cents (outstanding_principal_cents unchanged — agent takes the position onto its own book)"
          - "Hop 3: participant_share_bps recomputed for remaining participants; participant's CAST/RECAST votes on SOLICITING solicitations and DECLARED default cases transition to VOIDED with tallies recomputed"
      - from: DEMANDED
        to: RESCINDED
        trigger: "POST /api/buyback_demands/{demandId}/rescind"
        actor: ParticipantLender
        preconditions: ["X-User-ID == demand.participant_id (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: []
      - from: DISPUTED
        to: RESCINDED
        trigger: "POST /api/buyback_demands/{demandId}/rescind"
        actor: ParticipantLender
        preconditions: ["X-User-ID == demand.participant_id"]
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — true races only, OCC-resolved
# =============================================================================
concurrency_rules:
  - rule_id: draw-create-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /api/draws"
    occ_field: "expected_facility_version"
    description: |
      Creating a Draw against a Facility whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. The facility
      version advances on every participant commit and on every draw creation
      (aggregates and status bubbles mutate the facility), so a stale view
      means the client's subscription/headroom picture is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: distribution-rerun-stale-payment
    parent_entity: BorrowerPayment
    write_endpoint: "POST /api/payments/{paymentId}/distribution_runs"
    occ_field: "expected_payment_version"
    description: |
      Creating a DistributionRun for a payment legitimately supersedes the
      prior COMPUTED run (re-run of the waterfall after a correction). A
      create carrying a payment version older than the payment's current
      version is rejected with ERR_STALE_VERSION, because the client has not
      observed the current run lineage.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-settle-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /api/transfers/{transferId}/settle"
    occ_field: "expected_from_participant_version"
    description: |
      Settling a transfer debits the transferor's commitment. A settle
      carrying a transferor version older than the participant's current
      version is rejected with ERR_STALE_VERSION: another settle or a funded
      settlement confirmation has mutated the transferor since the client
      last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: participant_share_bps
    trigger: "participant commit; participant withdraw of a COMMITTED participant; transfer settle; buyback settle; COMMITMENT_INCREASE implement"
    algorithm: rounding_allocation
    formula: |
      eligible = participants of the facility with status IN {COMMITTED, FUNDED}
      base = facility.committed_cents  (== sum of eligible commitment_cents)
      if base == 0: every eligible share_bps = 0; done.
      for each participant p: raw_p = 10000 * p.commitment_cents / base
        share_p = floor(raw_p)
      remainder = 10000 - sum(share_p)   # 0 <= remainder < count(eligible)
      allocation order: commitment_cents DESC, then created_at ASC, then participant_name ASC
      distribute remainder one bp at a time in that order (at most one pass is ever needed)
    input_set: "Participants of the facility with status IN {COMMITTED, FUNDED}; PROPOSED/WITHDRAWN/EXITED excluded (share 0)"
    constants:
      SHARE_SCALE: 10000
    precision: "integer basis points; floor with explicit remainder allocation; ties never fall back to id"

  - name: interest_accrual
    trigger: "distribution run creation; default declare/cure/waive/accelerate; buyback settle (accrual materialized as-of the relevant date)"
    algorithm: chronological
    formula: |
      For each draw (status SETTLED) independently, accrue from draw.accrual_as_of_date to as_of_date:
      The window is split into segments at any default declared/resolved boundaries inside it:
        segment at base rate (facility.interest_rate_bps) for days outside [default declared_date, default resolved_date)
        segment at (interest_rate_bps + default_interest_addon_bps) for days inside an active default window
      days per segment by facility.day_count_basis:
        ACT_360 | ACT_365: calendar days = (end - start) in days; denominator 360 or 365
        BASIS_30_360: days = 360*(Y2-Y1) + 30*(M2-M1) + (min(D2,30) - min(D1,30)); denominator 360
      segment interest = floor(draw.outstanding_cents * rate_bps * days / (denominator * 10000))
      draw.accrued_unpaid_interest_cents = sum over segments (floor applied PER SEGMENT, then summed — order pinned)
      draw.accrual_as_of_date advanced to as_of_date
      facility.accrued_interest_cents = sum of accrued_unpaid_interest_cents over all SETTLED draws
    input_set: "Draws of the facility with status SETTLED only; FUNDING/CANCELLED draws accrue nothing"
    constants:
      DENOM_ACT360: 360
      DENOM_ACT365: 365
    precision: "integer cents; floor per draw-segment, then summed"
    variants:
      - name: act_360
        when: "facility.day_count_basis == ACT_360"
        difference: "calendar days / 360"
      - name: act_365
        when: "facility.day_count_basis == ACT_365"
        difference: "calendar days / 365 — same inputs yield a smaller charge than ACT_360"
      - name: basis_30_360
        when: "facility.day_count_basis == BASIS_30_360"
        difference: "clamped 30/360 day count — diverges from both ACT bases (e.g. 2026-08-01 -> 2026-08-31 counts 29 days)"

  - name: servicing_fee_accrual
    trigger: "distribution run creation"
    algorithm: threshold
    formula: |
      Evaluation order is PINNED and MUST be followed:
        (1) fee_first: servicing_fee_cents is computed BEFORE the current run's principal pool
            is applied, using outstanding_principal_cents as of run creation.
        (2) fee_days = (payment.value_date - baseline), where baseline =
            facility.last_distribution_value_date if set, else the settled_at date of the
            facility's first SETTLED draw.
        (3) raw_fee = floor(outstanding_principal_cents * servicing_fee_bps * fee_days / (360 * 10000))
        (4) servicing_fee_cents = min(raw_fee, payment.amount_cents)
      The circular-looking dependency (fee depends on outstanding; outstanding depends on the
      principal pool of this run) is resolved by computing the fee strictly on pre-run outstanding.
    input_set: "The payment being allocated; facility aggregates as of run creation"
    constants:
      FEE_DENOM: 360
    precision: "integer cents; floor then min"

  - name: waterfall_distribution
    trigger: "distribution run creation (after servicing_fee_accrual and interest_accrual have run)"
    algorithm: waterfall_allocation
    formula: |
      amount = payment.amount_cents
      (1) fee_cents = servicing_fee_cents; fee_cents = min(fee_cents, amount); remaining = amount - fee_cents
      (2) interest_pool_cents = min(remaining, facility.accrued_interest_cents recomputed to payment.value_date)
          remaining -= interest_pool_cents
      (3) principal_pool_cents = remaining; if principal_pool_cents > facility.outstanding_principal_cents:
          reject the run creation with ERR_PAYMENT_EXCEEDS_OUTSTANDING
      Participant split per pool, over participants with status == FUNDED at run creation:
        alloc_p = floor(pool * p.share_bps / 10000)
        remainder = pool - sum(alloc_p)
        remainder order: share_bps DESC, then commitment_cents DESC, then created_at ASC, then participant_name ASC
        distribute one cent at a time in that order (cycling if remainder >= count)
      line.total_cents = interest_cents + principal_cents
      agent_retained_cents = (interest_pool + principal_pool) - sum(line.total_cents over created lines)
        # non-zero when interest/principal exists but NO participant is FUNDED (positions on agent's book)
      CONSERVATION INVARIANT: servicing_fee_cents + interest_pool + principal_pool == payment.amount_cents
        and sum(line totals) + agent_retained_cents == interest_pool + principal_pool
    input_set: "Participants with status == FUNDED at run creation; facility aggregates recomputed to payment.value_date"
    precision: "integer cents; floor per participant per pool, remainder cents distributed in the pinned order"

  - name: late_funding_penalty
    trigger: "funding settlement confirm when date(wired_at) > funding_due_date"
    algorithm: threshold
    formula: |
      days_late = date(wired_at) - funding_due_date   # in calendar days, > 0
      penalty_interest_cents = floor(due_cents * LATE_FUNDING_DAILY_BPS * days_late / 10000)
      confirm payload penalty_received_cents MUST equal penalty_interest_cents exactly
      (else ERR_PENALTY_AMOUNT_MISMATCH); amount check (ERR_FUNDING_AMOUNT_MISMATCH) runs first
    input_set: "The settlement being confirmed"
    constants:
      LATE_FUNDING_DAILY_BPS: 15
      FUNDING_WINDOW_DAYS: 5
    precision: "integer cents; floor"

  - name: consent_tally
    trigger: "consent vote cast/recast; vote voided by participant exit; tally_close; default declare/cure/waive/accelerate recompute (adjusted base)"
    algorithm: aggregation
    formula: |
      adjusted_base_cents = modification.voting_base_cents
                            - sum(commitment_cents of participants who have EXITED since solicitation)
      votes = ConsentVotes of this solicitation with status IN {CAST, RECAST} and participant status FUNDED
        (VOIDED votes and votes from non-FUNDED participants are excluded; a participant whose status
        left FUNDED has its votes VOIDED by cascade, so this is consistent)
      approving_commitment_cents = sum(commitment_cents of participants whose current vote == APPROVE)
      cast_commitment_cents       = sum(commitment_cents of participants with any current vote, incl. ABSTAIN)
      approving_share_bps = floor(10000 * approving_commitment_cents / adjusted_base_cents)
      cast_share_bps       = floor(10000 * cast_commitment_cents / adjusted_base_cents)
      tally_close outcome: cast_share_bps < facility.quorum_bps  -> EXPIRED
        else approving_share_bps >= required_threshold_bps -> PASSED   (boundary: >= is inclusive)
        else -> FAILED
    input_set: "Non-VOIDED votes on the solicitation; participant commitments current as of tally"
    constants:
      UNANIMOUS_THRESHOLD_BPS: 10000
    precision: "integer bps; floor"

  - name: default_vote_tally
    trigger: "default vote cast/recast; vote voided by participant exit; accelerate/waive attempt"
    algorithm: aggregation
    formula: |
      adjusted_base_cents = default_case.voting_base_cents
                            - sum(commitment_cents of participants who have EXITED since declaration)
      votes = DefaultVotes on the case with status IN {CAST, RECAST}
      accelerate_share_bps = floor(10000 * sum(commitments of ACCELERATE voters) / adjusted_base_cents)
      waive_share_bps      = floor(10000 * sum(commitments of WAIVE voters) / adjusted_base_cents)
      accelerate action requires accelerate_share_bps >= facility.supermajority_threshold_bps
      waive action requires waive_share_bps >= facility.majority_threshold_bps
      No quorum applies to default votes; REJECT votes count toward neither threshold.
    input_set: "Non-VOIDED DefaultVotes on the DECLARED case"
    precision: "integer bps; floor"

  - name: default_interest_re_rate
    trigger: "default declare; cure; waive; accelerate"
    algorithm: chronological
    formula: |
      Recompute every SETTLED draw's accrued_unpaid_interest_cents per interest_accrual with
      segmentation at default boundaries:
        declare:  [accrual_as_of, declared) at base; [declared, as_of) at base + addon
        cure:     addon applies on [declared, cured) only; from cured onward at base
        waive:    addon removed RETROACTIVELY — the entire history recomputes at base rate,
                  so accrued_interest_cents after a waive equals the never-defaulted value
        accelerate: addon continues to accrue; no new segmentation end
    input_set: "SETTLED draws of the facility"
    precision: "integer cents; per-segment floor then sum (same as interest_accrual)"

  - name: buyback_price
    trigger: "buyback demand settle"
    algorithm: aggregation
    formula: |
      Step 0: interest_accrual materialized to the settle date first.
      outstanding_share_cents = participant.funded_cents - participant.cumulative_principal_cents
      accrued_share_cents     = floor(participant.share_bps * facility.accrued_interest_cents / 10000)
      STANDARD:  repurchase_price_cents = outstanding_share_cents + accrued_share_cents
      PENALTY:   repurchase_price_cents = outstanding_share_cents + accrued_share_cents
                                          + floor(outstanding_share_cents * BUYBACK_PENALTY_BPS / 10000)
    input_set: "The demanding participant (must be FUNDED) and facility aggregates"
    constants:
      BUYBACK_PENALTY_BPS: 500
    precision: "integer cents; floor per component"
    variants:
      - name: standard
        when: "breach_type IN {MISREPRESENTATION, DOCUMENTATION_DEFECT}"
        difference: "no penalty component"
      - name: penalty
        when: "breach_type == SERVICING_BREACH"
        difference: "adds 500 bps of outstanding share — same position, strictly higher price"

  - name: principal_reduction_allocation
    trigger: "distribution run remit (principal pool); PRINCIPAL_WRITE_DOWN implement; payment reversal (inverse)"
    algorithm: chronological
    formula: |
      Draw order: accrual_start_date ASC, then created_at ASC (never id).
      Apply the principal pool to the earliest draw with outstanding_cents > 0 first:
        reduction_d = min(remaining_pool, draw.outstanding_cents)
        draw.outstanding_cents -= reduction_d; remaining_pool -= reduction_d
      Repeat until remaining_pool == 0. facility.outstanding_principal_cents = sum over draws.
      Reversal walks the same order and adds each line's principal_cents back.
    input_set: "Draws of the facility with status SETTLED and outstanding_cents > 0"
    precision: "integer cents"

  - name: committed_recompute
    trigger: "participant commit; participant withdraw (COMMITTED); transfer settle; buyback settle"
    algorithm: aggregation
    formula: |
      facility.committed_cents = sum(commitment_cents of participants with status IN {COMMITTED, FUNDED})
      Status bubbles (pre-funding only, i.e. no non-CANCELLED draw exists):
        STRUCTURING -> SYNDICATING when committed_cents > 0
        SYNDICATING -> COMMITTED  when committed_cents == total_commitment_cents
        COMMITTED   -> SYNDICATING when committed_cents < total_commitment_cents
      After recompute, participant_share_bps MUST be recomputed for all participants.
    input_set: "Participants of the facility with status IN {COMMITTED, FUNDED}"
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Ownership: X-User-ID equals the acting entity id where the endpoint is ownership-scoped (Borrower paying own facility, Participant wiring own settlement, casting/recasting own vote, proposing/cancelling own transfer or buyback demand)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 4
    category: existence
    check: "Every id in the path and every *_id reference in the body resolves to an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present; enums in domain; amounts > 0; accrual_end_date > accrual_start_date; period_end_date >= period_start_date; terms contains exactly the key required by modification_type; exactly one of transferee_participant_id / transferee_name provided"
    error_id: "ERR_INVALID_REQUEST / ERR_TRANSFER_TARGET_AMBIGUOUS"
    http_status: 400
    applies_to: all write endpoints
  - priority: 6
    category: state
    check: "Target resource's own state permits the transition (terminal states reject everything; e.g. vote on PASSED solicitation, settle an already SETTLED transfer, commit an EXITED participant)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: all action endpoints
  - priority: 7
    category: state
    check: "Cross-entity posture: facility must not be IN_DEFAULT/ACCELERATED/CLOSED/TERMINATED for solicitation, transfer propose/settle, PREPAYMENT payments; facility must be COMMITTED for draw creation; buyback demands require facility in {FUNDING, ACTIVE, IN_DEFAULT, ACCELERATED}"
    error_id: "ERR_FACILITY_IN_DEFAULT / ERR_FACILITY_NOT_COMMITTED"
    http_status: 409
    applies_to: "solicit, transfers, payments, draws, buyback_demands"
  - priority: 8
    category: state
    check: "OCC: expected_*_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/draws; POST /api/payments/{id}/distribution_runs; POST /api/transfers/{id}/settle"
  - priority: 9
    category: business_safety
    check: "At most one DECLARED DefaultCase per facility"
    error_id: ERR_DEFAULT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /api/default_cases"
  - priority: 10
    category: business_constraint
    check: "Uniqueness/overlap: committed total <= facility total; draw accrual windows half-open non-overlapping; reporting package period windows closed non-overlapping; solicitation buffer 24h; one vote per participant per solicitation/case; one statement per (facility, type, period_end); one open buyback demand per participant per facility; no self-transfer"
    error_id: "ERR_COMMITMENT_EXCEEDS_TOTAL / ERR_DRAW_WINDOW_OVERLAP / ERR_PACKAGE_WINDOW_OVERLAP / ERR_SOLICITATION_WINDOW_OVERLAP / ERR_DUPLICATE_VOTE / ERR_DUPLICATE_STATEMENT / ERR_BUYBACK_ALREADY_PENDING / ERR_SELF_TRANSFER"
    http_status: 409
    applies_to: "respective create endpoints"
  - priority: 11
    category: business_referential
    check: "Referenced-party eligibility: voter must be a FUNDED participant of the facility; transferor must be COMMITTED/FUNDED; wire reporter must be the settlement's participant; buyback demander must be FUNDED; attached statement must belong to the facility and be RECEIVED/LATE_RECEIVED for assemble; implement requires PASSED"
    error_id: "ERR_PARTICIPANT_NOT_ELIGIBLE / ERR_STATEMENT_NOT_RECEIVED / ERR_MODIFICATION_NOT_PASSED / ERR_BUYBACK_NOT_FUNDED"
    http_status: 409
    applies_to: "votes, wires, transfers, buybacks, packages, implement"
  - priority: 12
    category: business_temporal
    check: "Temporal gates: vote only while solicitation SOLICITING and clock <= voting_close_at; tally only after voting_close_at; mark_defaulted only after funding_due_date; transfer settlement_date must not fall inside any [value_date - 2d, value_date + 2d] blackout of a non-REVERSED payment"
    error_id: "ERR_VOTING_CLOSED / ERR_VOTING_STILL_OPEN / ERR_FUNDING_NOT_YET_DUE / ERR_SETTLEMENT_IN_BLACKOUT"
    http_status: 409
    applies_to: "votes, tally_close, mark_defaulted, transfers"
  - priority: 13
    category: business_fiscal
    check: "Amounts/caps/thresholds: draw headroom; settlement received == due (then penalty equality); payment principal pool <= outstanding; transfer amount >= min and leaves stub >= min or zero; acceleration/waiver thresholds; write-down <= outstanding"
    error_id: "ERR_DRAW_EXCEEDS_COMMITMENT / ERR_FUNDING_AMOUNT_MISMATCH / ERR_PENALTY_AMOUNT_MISMATCH / ERR_PAYMENT_EXCEEDS_OUTSTANDING / ERR_TRANSFER_BELOW_MINIMUM / ERR_TRANSFER_EXCEEDS_COMMITMENT / ERR_TRANSFER_STUB_BELOW_MINIMUM / ERR_ACCELERATION_THRESHOLD_NOT_MET / ERR_WAIVER_THRESHOLD_NOT_MET / ERR_WRITEDOWN_EXCEEDS_OUTSTANDING"
    http_status: 409
    applies_to: "respective endpoints"

# =============================================================================
# Response Envelope (§1.0 — FIXED, verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; never falls back to wall-clock)."
    roles: [AgentBank]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced; no entity mutation"]

  # --- Borrowers ---
  - method: POST
    path: "/api/borrowers"
    description: "Create a Borrower"
    roles: [AgentBank]
    code: 201
    input: [legal_name, sector, risk_rating]
    output: Borrower
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/api/borrowers/{borrowerId}"
    description: "Get a Borrower"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: Borrower
    side_effects: []
  - method: GET
    path: "/api/borrowers/{borrowerId}/facilities"
    description: "List facilities of a borrower (reverse reachability for Facility.borrower_id)"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['limit?', 'offset?']
    output: "Facility[]"
    side_effects: []

  # --- Facilities ---
  - method: POST
    path: "/api/facilities"
    description: "Create a Facility in STRUCTURING"
    roles: [AgentBank]
    code: 201
    input: [borrower_id, facility_name, total_commitment_cents, currency, interest_rate_bps, day_count_basis, servicing_fee_bps, default_interest_addon_bps, maturity_date, 'majority_threshold_bps?', 'supermajority_threshold_bps?', 'quorum_bps?', 'voting_window_days?', 'min_transfer_cents?']
    output: Facility
    side_effects: ["status = STRUCTURING; aggregates zeroed"]
  - method: GET
    path: "/api/facilities/{facilityId}"
    description: "Get a Facility"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/api/facilities"
    description: "List facilities with filters and pagination"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['borrower_id?', 'status?', 'limit?', 'offset?']
    output: "Facility[]"
    side_effects: []
  - method: POST
    path: "/api/facilities/{facilityId}/terminate"
    description: "Terminate a facility before any funding (participants WITHDRAWN)"
    roles: [AgentBank]
    code: 200
    input: []
    output: Facility
    side_effects: ["status -> TERMINATED; PROPOSED/COMMITTED participants -> WITHDRAWN"]
  - method: GET
    path: "/api/facilities/{facilityId}/participants"
    description: "List participants of a facility"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['limit?', 'offset?']
    output: "Participant[]"
    side_effects: []
  - method: GET
    path: "/api/facilities/{facilityId}/draws"
    description: "List draws of a facility"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['limit?', 'offset?']
    output: "Draw[]"
    side_effects: []
  - method: GET
    path: "/api/facilities/{facilityId}/payments"
    description: "List payments of a facility"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['limit?', 'offset?']
    output: "BorrowerPayment[]"
    side_effects: []
  - method: GET
    path: "/api/facilities/{facilityId}/modification_requests"
    description: "List modification requests of a facility"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['limit?', 'offset?']
    output: "ModificationRequest[]"
    side_effects: []
  - method: GET
    path: "/api/facilities/{facilityId}/default_cases"
    description: "List default cases of a facility"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['limit?', 'offset?']
    output: "DefaultCase[]"
    side_effects: []

  # --- Participants ---
  - method: POST
    path: "/api/participants"
    description: "Add a participant to a facility (PROPOSED)"
    roles: [AgentBank]
    code: 201
    input: [facility_id, participant_name, commitment_cents]
    output: Participant
    side_effects: ["status = PROPOSED"]
  - method: GET
    path: "/api/participants/{participantId}"
    description: "Get a Participant"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: GET
    path: "/api/participants"
    description: "List participants with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['facility_id?', 'status?', 'limit?', 'offset?']
    output: "Participant[]"
    side_effects: []
  - method: POST
    path: "/api/participants/{participantId}/commit"
    description: "Commit a PROPOSED participant (subscription closes when total reached)"
    roles: [AgentBank]
    code: 200
    input: []
    output: Participant
    side_effects: ["status -> COMMITTED; committed_recompute + share recompute + facility bubbles; increments Facility.version"]
  - method: POST
    path: "/api/participants/{participantId}/withdraw"
    description: "Withdraw a PROPOSED or COMMITTED participant (pre-funding only)"
    roles: [AgentBank]
    code: 200
    input: []
    output: Participant
    side_effects: ["status -> WITHDRAWN; committed_recompute may demote COMMITTED -> SYNDICATING"]

  # --- Draws ---
  - method: POST
    path: "/api/draws"
    description: "Create a draw on a COMMITTED facility (OCC on facility version); generates funding settlements"
    roles: [AgentBank]
    code: 201
    input: [facility_id, draw_amount_cents, accrual_start_date, accrual_end_date, expected_facility_version]
    output: Draw
    side_effects:
      - "Draw created FUNDING; one FundingSettlement per COMMITTED participant (due_cents by share_bps with remainder allocation)"
      - "Facility COMMITTED -> FUNDING (first draw); headroom check ERR_DRAW_EXCEEDS_COMMITMENT; window overlap ERR_DRAW_WINDOW_OVERLAP"
      - "Increments Facility.version by 1"
  - method: GET
    path: "/api/draws"
    description: "List draws with filters (reverse reachability for Draw.facility_id)"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['facility_id?', 'status?', 'limit?', 'offset?']
    output: "Draw[]"
    side_effects: []
  - method: GET
    path: "/api/draws/{drawId}"
    description: "Get a Draw"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: Draw
    side_effects: []
  - method: POST
    path: "/api/draws/{drawId}/cancel"
    description: "Cancel a draw with no confirmed funds (settlements VOID)"
    roles: [AgentBank]
    code: 200
    input: []
    output: Draw
    side_effects: ["status -> CANCELLED; settlements in {PENDING, WIRED, DEFAULTED} -> VOID; facility FUNDING -> COMMITTED if no non-cancelled draw remains"]

  # --- Funding settlements ---
  - method: GET
    path: "/api/funding_settlements/{settlementId}"
    description: "Get a FundingSettlement"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: FundingSettlement
    side_effects: []
  - method: GET
    path: "/api/funding_settlements"
    description: "List funding settlements with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['draw_id?', 'participant_id?', 'facility_id?', 'status?', 'limit?', 'offset?']
    output: "FundingSettlement[]"
    side_effects: []
  - method: POST
    path: "/api/funding_settlements/{settlementId}/report_wire"
    description: "Participant reports its funding wire"
    roles: [ParticipantLender]
    code: 200
    input: [amount_cents]
    output: FundingSettlement
    side_effects: ["status -> WIRED; received_cents and wired_at set"]
  - method: POST
    path: "/api/funding_settlements/{settlementId}/confirm"
    description: "Agent confirms a wire; late wires require exact penalty payment"
    roles: [AgentBank]
    code: 200
    input: ['penalty_received_cents?']
    output: FundingSettlement
    side_effects: ["status -> CONFIRMED or LATE_CONFIRMED; participant funded_cents += due_cents; Participant bubble COMMITTED -> FUNDED; Draw bubble to SETTLED when all confirmed"]
  - method: POST
    path: "/api/funding_settlements/{settlementId}/mark_defaulted"
    description: "Mark a PENDING settlement defaulted after the funding due date"
    roles: [AgentBank]
    code: 200
    input: []
    output: FundingSettlement
    side_effects: ["status -> DEFAULTED"]

  # --- Borrower payments ---
  - method: POST
    path: "/api/payments"
    description: "Record a borrower payment (RECEIVED); facility must be ACTIVE, IN_DEFAULT, or ACCELERATED; PREPAYMENT blocked in default"
    roles: [Borrower]
    code: 201
    input: [facility_id, payment_type, amount_cents, value_date]
    output: BorrowerPayment
    side_effects: ["borrower_id copied from facility; facility.undistributed_cash_cents += amount_cents"]
  - method: GET
    path: "/api/payments/{paymentId}"
    description: "Get a BorrowerPayment"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: BorrowerPayment
    side_effects: []
  - method: GET
    path: "/api/payments"
    description: "List payments with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['facility_id?', 'borrower_id?', 'status?', 'limit?', 'offset?']
    output: "BorrowerPayment[]"
    side_effects: []
  - method: POST
    path: "/api/payments/{paymentId}/reverse"
    description: "Reverse a payment; REMITTED reversals claw back distributed lines and restore ledgers"
    roles: [AgentBank]
    code: 200
    input: []
    output: BorrowerPayment
    side_effects: ["status -> REVERSED; run/line voiding or clawback cascade per BorrowerPayment machine"]
  - method: POST
    path: "/api/payments/{paymentId}/distribution_runs"
    description: "Compute a distribution run for a payment (OCC on payment version); supersedes any COMPUTED run"
    roles: [AgentBank]
    code: 201
    input: [expected_payment_version]
    output: DistributionRun
    side_effects:
      - "servicing_fee_accrual -> interest_accrual -> waterfall_distribution executed in pinned order"
      - "Prior COMPUTED run -> SUPERSEDED (lines -> VOID); payment RECEIVED -> ALLOCATED; Increments BorrowerPayment.version by 1"

  # --- Distribution runs & lines ---
  - method: GET
    path: "/api/distribution_runs/{runId}"
    description: "Get a DistributionRun"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: DistributionRun
    side_effects: []
  - method: GET
    path: "/api/distribution_runs"
    description: "List distribution runs with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['payment_id?', 'facility_id?', 'status?', 'superseded_by_run_id?', 'limit?', 'offset?']
    output: "DistributionRun[]"
    side_effects: []
  - method: POST
    path: "/api/distribution_runs/{runId}/remit"
    description: "Remit a COMPUTED run: lines REMITTED, participant ledgers credited, facility aggregates reduced, closure bubble"
    roles: [AgentBank]
    code: 200
    input: []
    output: DistributionRun
    side_effects: ["Cascade per DistributionRun machine (4 hops); payment ALLOCATED -> REMITTED"]
  - method: GET
    path: "/api/distribution_lines/{lineId}"
    description: "Get a DistributionLine"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: DistributionLine
    side_effects: []
  - method: GET
    path: "/api/distribution_lines"
    description: "List distribution lines with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['run_id?', 'participant_id?', 'status?', 'limit?', 'offset?']
    output: "DistributionLine[]"
    side_effects: []

  # --- Modification requests & consent votes ---
  - method: POST
    path: "/api/modification_requests"
    description: "Borrower requests a facility modification (DRAFT)"
    roles: [Borrower]
    code: 201
    input: [facility_id, modification_type, terms]
    output: ModificationRequest
    side_effects: ["required_consent_class and required_threshold_bps derived from type"]
  - method: GET
    path: "/api/modification_requests/{modificationId}"
    description: "Get a ModificationRequest"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: ModificationRequest
    side_effects: []
  - method: GET
    path: "/api/modification_requests"
    description: "List modification requests with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['facility_id?', 'borrower_id?', 'requested_by_borrower_id?', 'status?', 'limit?', 'offset?']
    output: "ModificationRequest[]"
    side_effects: []
  - method: POST
    path: "/api/modification_requests/{modificationId}/solicit"
    description: "Open the voting window (from DRAFT, or re-solicit from FAILED/EXPIRED)"
    roles: [AgentBank]
    code: 200
    input: []
    output: ModificationRequest
    side_effects: ["status -> SOLICITING; window and voting_base snapshot set; prior-round votes -> VOIDED on re-solicit"]
  - method: POST
    path: "/api/modification_requests/{modificationId}/votes"
    description: "Cast a consent vote (participant identity from X-User-ID)"
    roles: [ParticipantLender]
    code: 201
    input: [vote]
    output: ConsentVote
    side_effects: ["Vote CAST; consent_tally recomputed incrementally"]
  - method: POST
    path: "/api/modification_requests/{modificationId}/tally_close"
    description: "Close voting after the window; outcome PASSED / FAILED / EXPIRED per consent_tally"
    roles: [AgentBank]
    code: 200
    input: []
    output: ModificationRequest
    side_effects: ["status -> PASSED | FAILED | EXPIRED"]
  - method: POST
    path: "/api/modification_requests/{modificationId}/implement"
    description: "Apply a PASSED modification to the facility"
    roles: [AgentBank]
    code: 200
    input: []
    output: ModificationRequest
    side_effects: ["status -> IMPLEMENTED; type-specific facility mutation per ModificationRequest machine"]
  - method: POST
    path: "/api/modification_requests/{modificationId}/withdraw"
    description: "Withdraw a DRAFT or SOLICITING request"
    roles: [AgentBank, Borrower]
    code: 200
    input: []
    output: ModificationRequest
    side_effects: ["status -> WITHDRAWN; CAST/RECAST votes -> VOIDED"]
  - method: POST
    path: "/api/consent_votes/{voteId}/recast"
    description: "Change a cast vote while the window is open (CAST -> RECAST self-loop)"
    roles: [ParticipantLender]
    code: 200
    input: [vote]
    output: ConsentVote
    side_effects: ["vote replaced; recast_count += 1; tallies recomputed"]
  - method: GET
    path: "/api/consent_votes/{voteId}"
    description: "Get a ConsentVote"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: ConsentVote
    side_effects: []
  - method: GET
    path: "/api/consent_votes"
    description: "List consent votes with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['modification_id?', 'participant_id?', 'status?', 'limit?', 'offset?']
    output: "ConsentVote[]"
    side_effects: []

  # --- Default cases & votes ---
  - method: POST
    path: "/api/default_cases"
    description: "Declare an event of default (facility ACTIVE -> IN_DEFAULT)"
    roles: [AgentBank]
    code: 201
    input: [facility_id, default_type]
    output: DefaultCase
    side_effects: ["Default cascade per Facility machine: solicitation withdrawal, draw re-rate, borrower status"]
  - method: GET
    path: "/api/default_cases/{caseId}"
    description: "Get a DefaultCase"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: DefaultCase
    side_effects: []
  - method: GET
    path: "/api/default_cases"
    description: "List default cases with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['facility_id?', 'status?', 'limit?', 'offset?']
    output: "DefaultCase[]"
    side_effects: []
  - method: POST
    path: "/api/default_cases/{caseId}/votes"
    description: "Cast a default vote (ACCELERATE | WAIVE | REJECT)"
    roles: [ParticipantLender]
    code: 201
    input: [vote]
    output: DefaultVote
    side_effects: ["Vote CAST; default_vote_tally recomputed"]
  - method: POST
    path: "/api/default_cases/{caseId}/cure"
    description: "Cure the default; addon stops from cure date"
    roles: [AgentBank]
    code: 200
    input: []
    output: DefaultCase
    side_effects: ["status -> CURED; facility -> ACTIVE (or CLOSED); borrower restored"]
  - method: POST
    path: "/api/default_cases/{caseId}/accelerate"
    description: "Accelerate the facility (requires supermajority ACCELERATE share)"
    roles: [AgentBank]
    code: 200
    input: []
    output: DefaultCase
    side_effects: ["status -> ACCELERATED; facility -> ACCELERATED"]
  - method: POST
    path: "/api/default_cases/{caseId}/waive"
    description: "Waive the default (requires majority WAIVE share); retroactive addon removal"
    roles: [AgentBank]
    code: 200
    input: []
    output: DefaultCase
    side_effects: ["status -> WAIVED; accrual recomputed at base rate; facility -> ACTIVE; borrower restored"]
  - method: POST
    path: "/api/default_votes/{voteId}/recast"
    description: "Change a default vote while the case is DECLARED"
    roles: [ParticipantLender]
    code: 200
    input: [vote]
    output: DefaultVote
    side_effects: ["vote replaced; recast_count += 1; tallies recomputed"]
  - method: GET
    path: "/api/default_votes/{voteId}"
    description: "Get a DefaultVote"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: DefaultVote
    side_effects: []
  - method: GET
    path: "/api/default_votes"
    description: "List default votes with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['default_case_id?', 'participant_id?', 'status?', 'limit?', 'offset?']
    output: "DefaultVote[]"
    side_effects: []

  # --- Financial statements ---
  - method: POST
    path: "/api/financial_statements"
    description: "Register an expected borrower financial statement (due date derived from type)"
    roles: [Borrower]
    code: 201
    input: [facility_id, statement_type, period_end_date, document_ref]
    output: FinancialStatement
    side_effects: ["status = EXPECTED; due_date = period_end_date + 45d (QUARTERLY) or +90d (ANNUAL_AUDITED)"]
  - method: GET
    path: "/api/financial_statements/{statementId}"
    description: "Get a FinancialStatement"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: FinancialStatement
    side_effects: []
  - method: GET
    path: "/api/financial_statements"
    description: "List financial statements with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['facility_id?', 'borrower_id?', 'status?', 'limit?', 'offset?']
    output: "FinancialStatement[]"
    side_effects: []
  - method: POST
    path: "/api/financial_statements/{statementId}/receive"
    description: "Agent marks receipt; late receipt recorded as LATE_RECEIVED"
    roles: [AgentBank]
    code: 200
    input: []
    output: FinancialStatement
    side_effects: ["status -> RECEIVED or LATE_RECEIVED by due_date comparison"]
  - method: POST
    path: "/api/financial_statements/{statementId}/waive"
    description: "Waive delivery of a statement"
    roles: [AgentBank]
    code: 200
    input: []
    output: FinancialStatement
    side_effects: ["status -> WAIVED"]

  # --- Reporting packages ---
  - method: POST
    path: "/api/reporting_packages"
    description: "Open a participant reporting package; CLOSED-interval period windows must not overlap"
    roles: [AgentBank]
    code: 201
    input: [facility_id, period_label, period_start_date, period_end_date, due_date, 'financial_statement_id?']
    output: ReportingPackage
    side_effects: ["status = OPEN; ERR_PACKAGE_WINDOW_OVERLAP on closed-interval collision"]
  - method: GET
    path: "/api/reporting_packages/{packageId}"
    description: "Get a ReportingPackage"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: ReportingPackage
    side_effects: []
  - method: GET
    path: "/api/reporting_packages"
    description: "List reporting packages with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['facility_id?', 'financial_statement_id?', 'status?', 'limit?', 'offset?']
    output: "ReportingPackage[]"
    side_effects: []
  - method: POST
    path: "/api/reporting_packages/{packageId}/assemble"
    description: "Assemble the package; attached statement must be RECEIVED or LATE_RECEIVED"
    roles: [AgentBank]
    code: 200
    input: []
    output: ReportingPackage
    side_effects: ["status -> ASSEMBLED"]
  - method: POST
    path: "/api/reporting_packages/{packageId}/deliver"
    description: "Deliver to all participants in {COMMITTED, FUNDED}; late delivery flagged"
    roles: [AgentBank]
    code: 200
    input: []
    output: ReportingPackage
    side_effects: ["status -> DELIVERED or LATE_DELIVERED by due_date comparison; delivered_recipient_count set"]

  # --- Participation transfers ---
  - method: POST
    path: "/api/transfers"
    description: "Propose a participation transfer/assignment (transferor identity from X-User-ID)"
    roles: [ParticipantLender]
    code: 201
    input: [facility_id, transfer_amount_cents, settlement_date, 'transferee_participant_id?', 'transferee_name?']
    output: ParticipationTransfer
    side_effects: ["status = PROPOSED; validations per §1.4 (blackout, minimums, stub rule, ambiguous target)"]
  - method: GET
    path: "/api/transfers/{transferId}"
    description: "Get a ParticipationTransfer"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: ParticipationTransfer
    side_effects: []
  - method: GET
    path: "/api/transfers"
    description: "List transfers with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['facility_id?', 'from_participant_id?', 'transferee_participant_id?', 'transferee_resolved_participant_id?', 'status?', 'limit?', 'offset?']
    output: "ParticipationTransfer[]"
    side_effects: []
  - method: POST
    path: "/api/transfers/{transferId}/approve"
    description: "Agent approves a proposed transfer"
    roles: [AgentBank]
    code: 200
    input: []
    output: ParticipationTransfer
    side_effects: ["status -> AGENT_APPROVED"]
  - method: POST
    path: "/api/transfers/{transferId}/reject"
    description: "Agent rejects a proposed transfer"
    roles: [AgentBank]
    code: 200
    input: []
    output: ParticipationTransfer
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/api/transfers/{transferId}/settle"
    description: "Settle an approved transfer (OCC on transferor participant version); commitments shift, facility total conserved"
    roles: [AgentBank]
    code: 200
    input: [expected_from_participant_version]
    output: ParticipationTransfer
    side_effects: ["status -> SETTLED; transfer rebalancing per ParticipationTransfer machine; Increments transferor Participant.version by 1"]
  - method: POST
    path: "/api/transfers/{transferId}/cancel"
    description: "Transferor cancels a PROPOSED or AGENT_APPROVED transfer"
    roles: [ParticipantLender]
    code: 200
    input: []
    output: ParticipationTransfer
    side_effects: ["status -> CANCELLED"]

  # --- Buyback demands ---
  - method: POST
    path: "/api/buyback_demands"
    description: "Participant demands agent repurchase of its position on breach (one open demand per participant per facility)"
    roles: [ParticipantLender]
    code: 201
    input: [facility_id, breach_type, 'breach_description?']
    output: BuybackDemand
    side_effects: ["status = DEMANDED; ERR_BUYBACK_NOT_FUNDED unless demander is FUNDED"]
  - method: GET
    path: "/api/buyback_demands/{demandId}"
    description: "Get a BuybackDemand"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: []
    output: BuybackDemand
    side_effects: []
  - method: GET
    path: "/api/buyback_demands"
    description: "List buyback demands with filters"
    roles: [AgentBank, Borrower, ParticipantLender]
    code: 200
    input: ['facility_id?', 'participant_id?', 'status?', 'limit?', 'offset?']
    output: "BuybackDemand[]"
    side_effects: []
  - method: POST
    path: "/api/buyback_demands/{demandId}/acknowledge"
    description: "Agent acknowledges a demand (from DEMANDED or DISPUTED)"
    roles: [AgentBank]
    code: 200
    input: []
    output: BuybackDemand
    side_effects: ["status -> ACKNOWLEDGED"]
  - method: POST
    path: "/api/buyback_demands/{demandId}/dispute"
    description: "Agent disputes a demand"
    roles: [AgentBank]
    code: 200
    input: []
    output: BuybackDemand
    side_effects: ["status -> DISPUTED"]
  - method: POST
    path: "/api/buyback_demands/{demandId}/settle"
    description: "Agent settles an acknowledged demand: price computed, participant EXITED, commitment removed"
    roles: [AgentBank]
    code: 200
    input: []
    output: BuybackDemand
    side_effects: ["status -> SETTLED; price fields computed via buyback_price; participant exit cascade per machine"]
  - method: POST
    path: "/api/buyback_demands/{demandId}/rescind"
    description: "Demanding participant rescinds a DEMANDED or DISPUTED demand"
    roles: [ParticipantLender]
    code: 200
    input: []
    output: BuybackDemand
    side_effects: ["status -> RESCINDED"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role valid but not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Ownership-scoped endpoint called with an X-User-ID that does not match the acting entity (wrong borrower/participant)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body *_id reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, enum outside domain, non-positive amount, inverted date range, or terms missing the key required by modification_type" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource state does not permit the transition (including terminal-state calls and draws on a non-COMMITTED/ACCELERATED facility where applicable)" }
  - { id: ERR_FACILITY_NOT_COMMITTED, http: 409, condition: "Draw creation requires facility status COMMITTED" }
  - { id: ERR_FACILITY_IN_DEFAULT, http: 409, condition: "Facility IN_DEFAULT/ACCELERATED blocks solicitation, transfer propose/settle, and PREPAYMENT payments" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_DEFAULT_ALREADY_ACTIVE, http: 409, condition: "A DECLARED DefaultCase already exists on this facility" }
  - { id: ERR_COMMITMENT_EXCEEDS_TOTAL, http: 409, condition: "Commit would push committed_cents above facility.total_commitment_cents" }
  - { id: ERR_DRAW_WINDOW_OVERLAP, http: 409, condition: "Draw accrual window overlaps another non-cancelled draw of the facility (half-open: start == prior end is allowed)" }
  - { id: ERR_DRAW_EXCEEDS_COMMITMENT, http: 409, condition: "Cumulative non-cancelled draw amounts would exceed total_commitment_cents" }
  - { id: ERR_DRAW_HAS_CONFIRMED_FUNDS, http: 409, condition: "Draw cancel blocked because a settlement is CONFIRMED or LATE_CONFIRMED" }
  - { id: ERR_FUNDING_AMOUNT_MISMATCH, http: 409, condition: "received_cents != due_cents at settlement confirm" }
  - { id: ERR_PENALTY_AMOUNT_MISMATCH, http: 409, condition: "Late wire confirmed without penalty_received_cents exactly equal to the computed late_funding_penalty" }
  - { id: ERR_FUNDING_NOT_YET_DUE, http: 409, condition: "mark_defaulted before the funding due date has passed" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 409, condition: "Distribution run principal pool would exceed outstanding_principal_cents" }
  - { id: ERR_VOTING_CLOSED, http: 409, condition: "Vote cast or recast after voting_close_at or on a non-SOLICITING solicitation" }
  - { id: ERR_VOTING_STILL_OPEN, http: 409, condition: "tally_close attempted at or before voting_close_at" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Participant already has a CAST/RECAST vote on this solicitation/case (use recast)" }
  - { id: ERR_PARTICIPANT_NOT_ELIGIBLE, http: 409, condition: "Actor participant is not FUNDED (votes), not COMMITTED/FUNDED (transferor), or not the settlement's participant" }
  - { id: ERR_MODIFICATION_NOT_PASSED, http: 409, condition: "implement attempted on a solicitation not in PASSED" }
  - { id: ERR_ACCELERATION_THRESHOLD_NOT_MET, http: 409, condition: "accelerate_share_bps < supermajority_threshold_bps" }
  - { id: ERR_WAIVER_THRESHOLD_NOT_MET, http: 409, condition: "waive_share_bps < majority_threshold_bps" }
  - { id: ERR_SOLICITATION_WINDOW_OVERLAP, http: 409, condition: "Another solicitation window on the facility falls within the 24h buffer of the proposed window" }
  - { id: ERR_DUPLICATE_STATEMENT, http: 409, condition: "A non-WAIVED statement with same (facility_id, statement_type, period_end_date) exists" }
  - { id: ERR_STATEMENT_NOT_RECEIVED, http: 409, condition: "Package assemble with an attached statement not in {RECEIVED, LATE_RECEIVED}" }
  - { id: ERR_PACKAGE_WINDOW_OVERLAP, http: 409, condition: "Reporting package CLOSED period window intersects another package of the facility (adjacent start == prior end collides)" }
  - { id: ERR_TRANSFER_BELOW_MINIMUM, http: 409, condition: "transfer_amount_cents < facility.min_transfer_cents" }
  - { id: ERR_TRANSFER_EXCEEDS_COMMITMENT, http: 409, condition: "transfer_amount_cents > transferor's remaining commitment_cents (checked at propose and re-validated at settle)" }
  - { id: ERR_TRANSFER_STUB_BELOW_MINIMUM, http: 409, condition: "Partial transfer would leave a residual commitment below min_transfer_cents" }
  - { id: ERR_TRANSFER_TARGET_AMBIGUOUS, http: 400, condition: "Both or neither of transferee_participant_id / transferee_name provided" }
  - { id: ERR_SELF_TRANSFER, http: 409, condition: "transferee_participant_id equals the transferor's own id" }
  - { id: ERR_SETTLEMENT_IN_BLACKOUT, http: 409, condition: "settlement_date inside [value_date - 2d, value_date + 2d] of a non-REVERSED payment (closed interval)" }
  - { id: ERR_BUYBACK_ALREADY_PENDING, http: 409, condition: "Participant already has a DEMANDED/ACKNOWLEDGED/DISPUTED demand on this facility" }
  - { id: ERR_BUYBACK_NOT_FUNDED, http: 409, condition: "Demanding participant is not FUNDED on this facility" }
  - { id: ERR_WRITEDOWN_EXCEEDS_OUTSTANDING, http: 409, condition: "PRINCIPAL_WRITE_DOWN terms.write_down_cents exceeds outstanding_principal_cents at implement" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: AgentBank
    description: "Syndication agent / loan administrator: structures facilities, runs funding, computes and remits distributions, tallies consents, declares and resolves defaults, approves transfers, settles buybacks, assembles reporting packages. Read access to everything."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/borrowers; POST /api/facilities; POST /api/facilities/{id}/terminate"
      - "POST /api/participants; POST /api/participants/{id}/commit; POST /api/participants/{id}/withdraw"
      - "POST /api/draws; POST /api/draws/{id}/cancel"
      - "POST /api/funding_settlements/{id}/confirm; POST /api/funding_settlements/{id}/mark_defaulted"
      - "POST /api/payments/{id}/reverse; POST /api/payments/{id}/distribution_runs; POST /api/distribution_runs/{id}/remit"
      - "POST /api/modification_requests/{id}/solicit, /tally_close, /implement"
      - "POST /api/default_cases; POST /api/default_cases/{id}/cure, /accelerate, /waive"
      - "POST /api/financial_statements/{id}/receive, /waive"
      - "POST /api/reporting_packages; /assemble; /deliver"
      - "POST /api/transfers/{id}/approve, /reject, /settle"
      - "POST /api/buyback_demands/{id}/acknowledge, /dispute, /settle"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints (shared with Borrower and ParticipantLender)"
      - "POST /api/modification_requests/{id}/withdraw (shared with Borrower)"

  - name: Borrower
    description: "The obligor: records payments, requests modifications, submits financial statements. X-User-ID must equal the Borrower.id that owns the referenced facility."
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /api/payments"
      - "POST /api/modification_requests"
      - "POST /api/financial_statements"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/modification_requests/{id}/withdraw (own requests only)"

  - name: ParticipantLender
    description: "A loan participant: wires funding, votes on modifications and defaults, transfers its participation, demands buyback on breach. X-User-ID must equal the Participant.id."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /api/funding_settlements/{id}/report_wire (own settlement only)"
      - "POST /api/modification_requests/{id}/votes; POST /api/consent_votes/{id}/recast (own votes)"
      - "POST /api/default_cases/{id}/votes; POST /api/default_votes/{id}/recast (own votes)"
      - "POST /api/transfers; POST /api/transfers/{id}/cancel (as transferor)"
      - "POST /api/buyback_demands; POST /api/buyback_demands/{id}/rescind (as demander)"
    shared_operations:
      - "All GET endpoints"

  - name: System
    description: "Automation identity for bubble-up and cascade transitions (no API endpoints; actor on system-triggered transitions only)."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []



