            - "the S2-capped template is accepted at exact equality: handling_status \"IN_RESOLUTION\", responded_at 2026-08-01T00:00:00Z, responded_template_id == ${t2}"
            - "usage_count is 0 on the refused template and 1 on the accepted one — the counter tracks successful sends only"

      - name: corner_all_fiscal_preconditions_satisfied_lets_approval_through
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority 45]", "validations[priority 31]", "validations[priority 18]", "endpoints[POST /remedies/{id}/decide]"]
        distinguishing_aspect: "The positive face of the strictest rule in the ladder: a TIER_2 remedy is approved because the tier rank suffices, the decider differs from the author, the payout is under the cap and no kit is in flight — every clause of priority 45 plus priorities 31 and 18 satisfied at once."
        test_recipe:
          setup: ["A triaged QUALITY complaint with a REFUND remedy at payout 5390 (TIER_2), authored by the agent and submitted."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: EMAIL, received_at: "2026-08-01T00:00:00Z", raw_message: "Two stale packs." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710", units_claimed: 2 }, captures: { cp1: "$.data.id" } }
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Refund." }, captures: { cv: "$.data.version" } }
            - { call: "POST /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", remedy_type: REFUND, requested_value_cents: 4900, expected_complaint_version: "${cv}" }, captures: { rm: "$.data.id", pay: "$.data.payout_cents", tier: "$.data.authority_tier_required" } }
            - { call: "POST /remedies/${rm}/submit", as: CareAgent, as_user_id: "${ag1}", payload: { submit_note: "Please approve." }, captures: { s1: "$.data.status", pay2: "$.data.payout_cents" } }
          trigger:
            - { call: "POST /remedies/${rm}/decide", as: CareSupervisor, as_user_id: "${sup1}", payload: { decision: APPROVE, decision_note: "Approved." }, captures: { s2: "$.data.status", db: "$.data.decided_by_ref" } }
            - { call: "GET /consumers/${c1}", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { ga: "$.data.goodwill_authorized_cents", go: "$.data.goodwill_outstanding_cents", gp: "$.data.goodwill_paid_cents" } }
          assert:
            - "the remedy computes payout_cents 5390 with authority_tier_required \"TIER_2\" and submit recomputes the same 5390 (no LAB_ACCEPTED kit exists, so no credit appears)"
            - "priority 45 is satisfied on all three clauses: SUP1 is TIER_3 (rank at least TIER_2), SUP1 is not the author AG1, and 5390 <= GOODWILL_MAX_PAYOUT_CENTS 25000"
            - "priority 31 is satisfied because the complaint has no SampleKit at all, and priority 18 because the remedy is SUBMITTED"
            - "the decision succeeds with HTTP 200: status \"APPROVED\" and decided_by_ref == ${sup1}"
            - "ledger side effects land: goodwill_authorized_cents == 5390, goodwill_outstanding_cents == 5390, goodwill_paid_cents == 0"

