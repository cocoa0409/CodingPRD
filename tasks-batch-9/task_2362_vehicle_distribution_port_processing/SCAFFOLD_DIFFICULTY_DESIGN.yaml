          assert:
            - "${on_hand_0} == 10, ${consumed_0} == 0, ${avail_0} == 10 — INVARIANT K: 10 + 0 == 10"
            - "${on_hand_1} == 10, ${consumed_1} == 0, ${reserved_1} == 4 — reservation does not move stock; INVARIANT K still 10 + 0 == 10"
            - "${billed} == 69932 and ${on_hand_2} == 6, ${consumed_2} == 4 — INVARIANT K: 6 + 4 == 10"
            - "${void_status} == VOIDED and ${billed_after_void} == 0"
            - "${on_hand_3} == 10, ${consumed_3} == 0, ${avail_3} == 10 — the compensating action restores INVARIANT K: 10 + 0 == 10"
            - "Vehicle.${veh_id}.accessory_billed_cents == 0 after the void"

      - name: carrier_slots_conserved_across_allocate_cancel_and_supersede
        grounds:
          - calculations.carrier_slot_reconciliation
          - entities.TruckCarrier.fields.committed_slots
          - entities.TruckCarrier.fields.available_slots
          - endpoints.POST_/vpc/release-orders/{releaseOrderId}/cancel.side_effects
          - state_machines.ReleaseOrder.ALLOCATED_to_CANCELLED
        distinguishing_aspect: |
          A different conserved quantity: carrier slots (INVARIANT S, committed_slots +
          available_slots == slot_capacity) together with Dealer.open_allocation_count. Allocation
          debits a slot, cancellation credits it back, and the supersede path must both release the
          prior order's slot and take one for the replacement in the same request, leaving the sum
          untouched — double-counting the supersede breaks 3.
        test_recipe:
          setup:
            - "Two units A and B prepped to SHIPPING_READY."
            - "Dealer D-BIG with allocation_quota 5 and carrier TC-ROAD with slot_capacity 3 serving zone B."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000032", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { veh_a: $.data.id }
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000033", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { veh_b: $.data.id }
            - call: "POST /vpc/vessels/${vessel_id}/complete-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vehicles/${veh_a}/damage-surveys"
              payload: { line_items: [{ damage_zone: "INTERIOR", severity_points: 20, repair_estimate_cents: 0 }] }
              as: DamageSurveyor
              captures: { survey_a: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_a}/submit"
              payload: {}
              as: DamageSurveyor
            - call: "POST /vpc/vehicles/${veh_a}/quality-inspections"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
              captures: { insp_a: $.data.id }
            - call: "POST /vpc/quality-inspections/${insp_a}/complete"
              payload: { outcome: "PASS", defect_count: 0 }
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/vehicles/${veh_a}/prep-complete"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/vehicles/${veh_b}/damage-surveys"
              payload: { line_items: [{ damage_zone: "INTERIOR", severity_points: 20, repair_estimate_cents: 0 }] }
              as: DamageSurveyor
              captures: { survey_b: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_b}/submit"
              payload: {}
              as: DamageSurveyor
            - call: "POST /vpc/vehicles/${veh_b}/quality-inspections"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
              captures: { insp_b: $.data.id }
            - call: "POST /vpc/quality-inspections/${insp_b}/complete"
              payload: { outcome: "PASS", defect_count: 0 }
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/vehicles/${veh_b}/prep-complete"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/dealers"
              payload: { dealer_code: "D-BIG", name: "Bigtown Auto", route_zone: "B", distance_miles: 285, allocation_quota: 5 }
              as: DistributionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /vpc/truck-carriers"
              payload: { carrier_code: "TC-ROAD", name: "Roadway Auto Transport", served_route_zones: ["B"], linehaul_rate_cents_per_mile: 412, slot_capacity: 3, concurrent_load_capacity: 2 }
              as: DistributionManager
              captures: { carrier_id: $.data.id }
            - call: "GET /vpc/truck-carriers/${carrier_id}"
              payload: {}
              as: DistributionManager
              captures: { committed_0: $.data.committed_slots, available_0: $.data.available_slots }
          trigger:
            - call: "GET /vpc/vehicles/${veh_a}"
              payload: {}
              as: DistributionManager
              captures: { veh_a_v1: $.data.version }
            - call: "POST /vpc/vehicles/${veh_a}/allocations"
              payload: { dealer_id: "${dealer_id}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", expected_vehicle_version: "${veh_a_v1}" }
              as: DistributionManager
              captures: { rel_a1: $.data.id }
            - call: "GET /vpc/vehicles/${veh_b}"
              payload: {}
              as: DistributionManager
              captures: { veh_b_v1: $.data.version }
            - call: "POST /vpc/vehicles/${veh_b}/allocations"
              payload: { dealer_id: "${dealer_id}", pickup_window_start: "2026-08-05T12:00:00Z", pickup_window_end: "2026-08-05T16:00:00Z", expected_vehicle_version: "${veh_b_v1}" }
              as: DistributionManager
              captures: { rel_b1: $.data.id }
            - call: "GET /vpc/truck-carriers/${carrier_id}"
              payload: {}
              as: DistributionManager
              captures: { committed_1: $.data.committed_slots, available_1: $.data.available_slots }
            - call: "POST /vpc/release-orders/${rel_a1}/cancel"
              payload: {}
              as: DistributionManager
              captures: { cancel_status: $.data.status }
            - call: "GET /vpc/truck-carriers/${carrier_id}"
              payload: {}
              as: DistributionManager
              captures: { committed_2: $.data.committed_slots, available_2: $.data.available_slots }
            - call: "GET /vpc/vehicles/${veh_b}"
              payload: {}
              as: DistributionManager
              captures: { veh_b_v2: $.data.version }
            - call: "POST /vpc/vehicles/${veh_b}/allocations"
              payload: { dealer_id: "${dealer_id}", pickup_window_start: "2026-08-06T08:00:00Z", pickup_window_end: "2026-08-06T12:00:00Z", expected_vehicle_version: "${veh_b_v2}" }
              as: DistributionManager
              captures: { rel_b2: $.data.id, superseded: $.data.superseded_release_order_id }
            - call: "GET /vpc/truck-carriers/${carrier_id}"
              payload: {}
              as: DistributionManager
              captures: { committed_3: $.data.committed_slots, available_3: $.data.available_slots }
            - call: "GET /vpc/dealers/${dealer_id}"
              payload: {}
              as: DistributionManager
              captures: { open_alloc_3: $.data.open_allocation_count }
          assert:
            - "${committed_0} == 0 and ${available_0} == 3 — INVARIANT S: 0 + 3 == 3"
            - "${committed_1} == 2 and ${available_1} == 1 — INVARIANT S: 2 + 1 == 3"
            - "${cancel_status} == CANCELLED, ${committed_2} == 1 and ${available_2} == 2 — the compensating action returns exactly one slot; INVARIANT S: 1 + 2 == 3"
            - "${superseded} == ${rel_b1} and ReleaseOrder.${rel_b1}.status == CANCELLED"
            - "${committed_3} == 1 and ${available_3} == 2 — the supersede released and re-took one slot in one request; INVARIANT S: 1 + 2 == 3"
            - "${open_alloc_3} == 1 — Dealer.open_allocation_count is conserved alongside the slots"
            - "Vehicle.${veh_a}.processing_status == SHIPPING_READY and Vehicle.${veh_b}.processing_status == ALLOCATED"
