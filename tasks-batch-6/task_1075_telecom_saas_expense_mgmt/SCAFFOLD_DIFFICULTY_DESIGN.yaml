          - errors[ERR_LINE_NOT_DISPUTABLE]
        distinguishing_aspect: |
          Opening a dispute is rejected with ERR_LINE_NOT_DISPUTABLE while the parent Invoice is still RECEIVED (claimed <= billed,
          so only the cross-entity state gate fails). Entity pair = Dispute depends on Invoice (distinct from Invoice->Contract).
        test_recipe:
          setup:
