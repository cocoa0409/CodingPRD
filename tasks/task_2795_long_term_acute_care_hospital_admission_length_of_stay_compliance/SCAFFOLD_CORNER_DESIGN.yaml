      - name: side_effect_execution_of_the_discharge_cascade
        claim_type: side_effect_execution
        grounds:
          - endpoints.POST_ltch_stays_id_discharge.side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / discharge_cascades_four_levels_to_an_auto_issued_documentation_query
          rationale: "That §1.8 instance asserts all five declared side effects of the discharge transition end to end, including the level-4 auto-issued query."

      - name: cascade_down_side_effects_of_recombination
        claim_type: cascade_down
        grounds:
          - endpoints.POST_ltch_stays_id_recombine.side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / recombination_unwinds_ledger_review_and_referral_share_together
          rationale: "The parent-to-children fan-out of recombination (determination, review, queries, period counters, hospital counters) is the subject of that §1.8 instance."

      - name: cross_entity_side_effect_of_the_idt_freshness_gate
        claim_type: cross_entity
        grounds:
          - validations.priority_32_ERR_IDT_DOCUMENTATION_STALE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / tolerated_sbt_blocked_until_the_idt_notes_are_refreshed
          rationale: "Entity A (IdtNote) governing entity B (WeaningPlan) is exactly what that §1.8 instance verifies, in both the blocked and the unblocked direction."

      - name: ledger_sync_side_effect_on_finalize_and_void
        claim_type: ledger_sync
        grounds:
          - calculations.period_payment_rollup
        excluded_because:
          difficulty_instance: compensating_invariant / void_reprice_refinalize_leaves_the_period_ledger_undrifted
          rationale: "Ancestor-ledger reconciliation before and after each money transition is that instance's whole subject, closed out by the period close."

      - name: compensation_side_effect_of_recombination_counters
        claim_type: compensation
        grounds:
          - entities.CostReportingPeriod.fields.total_admissions
        excluded_because:
          difficulty_instance: compensating_invariant / recombination_restores_the_admission_count_and_referral_share_invariant
          rationale: "The undo path returning both counters and the monitoring_state to their pre-readmission values is asserted there, including the full-recompute cross-check."

