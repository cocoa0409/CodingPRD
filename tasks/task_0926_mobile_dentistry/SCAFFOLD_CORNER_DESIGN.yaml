              captures: { patient_v1: $.data.version }
          trigger:
            - call: "POST /mobile-dentistry/consents/${old_consent_id}/amend-tier"
              payload: { new_scope_tier: "SCREENING_ONLY", expected_patient_version: "${patient_v1}", amend_reason: "GUARDIAN_NARROWED_SCOPE" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { new_consent_id: $.data.id, new_status: $.data.status, new_expires: $.data.expires_at }
            - call: "GET /mobile-dentistry/consents/${old_consent_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "The amend-tier response returns HTTP 201 with data.status == ACTIVE"
            - "The amend-tier response's data.scope_tier == SCREENING_ONLY"
            - "The amend-tier response's data.expires_at == 2026-06-30T23:59:59Z"
            - "The immediately following GET shows Consent.${old_consent_id}.status == SUPERSEDED"
            - "Consent.${old_consent_id}.superseded_by_consent_id == ${new_consent_id}"
            - "Patient.${patient_id}.version == ${patient_v1} + 1"

  # ---------------------------------------------------------------------------
  # §1.6 error-catalog triggerability audit. Every error id in SCAFFOLD.yaml is
  # exercised somewhere. The eight below are the failure path of a named §1.8
  # instance, so they are emitted as stubs rather than duplicated here.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: error_period_frozen_on_a_gated_write
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERIOD_FROZEN]"]
        excluded_because:
          difficulty_instance: period_freeze_gate_beats_chair_capacity_on_a_gated_procedure_create
          rationale: "Asserted as the winning error of that priority-conflict instance, which plans a procedure inside a SUBMITTED period."

      - name: error_unit_quarantined_on_visit_start
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNIT_QUARANTINED]"]
        excluded_because:
          difficulty_instance: site_visit_start_blocked_by_quarantined_portable_unit
          rationale: "Asserted as the failure path of that cross-entity-dependency instance, including the no-write branch of the already-quarantined case."

      - name: error_credential_lapsed_on_procedure_perform
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDENTIAL_LAPSED]"]
        excluded_because:
          difficulty_instance: procedure_perform_blocked_by_lapsed_staff_credential
          rationale: "Asserted as the failure path of that cross-entity-dependency instance."

      - name: error_supervision_not_permitted_on_sealant_perform
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUPERVISION_NOT_PERMITTED]"]
        excluded_because:
          difficulty_instance: supervision_matrix_same_authorisation_different_role_diverges_on_presence
          rationale: "Asserted as the rejected half of that combinatorial-formula instance."

      - name: error_varnish_interval_below_ninety_days
        claim_type: violation_to_error
        grounds: ["errors[ERR_VARNISH_INTERVAL]"]
        excluded_because:
          difficulty_instance: varnish_interval_eighty_nine_days_fails_and_exactly_ninety_days_passes
          rationale: "Asserted as the 89-day half of that boundary instance."

      - name: error_unit_double_booked_inside_the_transport_buffer
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNIT_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: portable_unit_transport_buffer_exactly_ninety_minutes_clears_eighty_nine_collides
          rationale: "Asserted as the rejected half of that temporal-overlap instance."

      - name: error_staff_double_booked_on_touching_endpoints
        claim_type: violation_to_error
        grounds: ["errors[ERR_STAFF_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: staff_closed_interval_touching_endpoints_collide_one_minute_later_does_not
          rationale: "Asserted as the rejected half of that temporal-overlap instance."

      - name: error_referral_not_due_and_cap_reached
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFERRAL_NOT_DUE]", "errors[ERR_REFERRAL_CAP_REACHED]"]
        excluded_because:
          difficulty_instance: referral_not_due_beats_attempt_cap_and_suppresses_the_abandon_write
          rationale: "Both codes are asserted in that priority-conflict instance, together with the mutate-then-reject abandon write and its suppression."
