            - call: "POST /equipment"
              payload: { site_id: "${site_id}", equipment_type: "GREASE_TRAP", capacity_gallons: 100, nominal_frequency_days: 30 }
              as: Admin
              captures: { eq3_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B", certification_level: "BASIC" }
              as: Admin
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq1_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T10:00:00Z", planned_end: "2026-05-10T12:00:00Z" }
              as: Dispatcher
              captures: { wo1_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq2_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T11:00:00Z", planned_end: "2026-05-10T13:00:00Z" }
              as: Dispatcher
              captures: { wo2_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq3_id}", service_type: "SCHEDULED", planned_start: "2026-05-10T12:00:00Z", planned_end: "2026-05-10T14:00:00Z" }
              as: Dispatcher
              captures: { wo3_id: $.data.id }
            - call: "POST /work-orders/${wo1_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo2_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /work-orders/${wo3_id}/transition"
              payload: { to_status: "DISPATCHED", technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { st_adjacent: $.data.status }
          assert:
            - "dispatch of WO2 (11:00-13:00) response error_id == ERR_TECHNICIAN_SCHEDULE_CONFLICT"
            - "dispatch of WO3 (12:00-14:00, abutting) WorkOrder.${wo3_id}.status == DISPATCHED"

      - name: equipment_service_buffer_24h
        grounds:
          - validations[priority=8]
          - entities.WorkOrder.fields.planned_start
        distinguishing_aspect: |
          On the Equipment resource the interval semantics are buffered (adjacency forbidden): a second
          window only 10h after the first is rejected (ERR_EQUIPMENT_SERVICE_TOO_SOON) while a window
          >= 24h away is accepted — unlike the Technician resource which allows gap==0.
        test_recipe:
          setup:
            - "One grease-trap Equipment with WO1 window 2026-05-10T08:00-10:00 created"
          setup_api_calls:
