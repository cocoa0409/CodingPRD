    side_effects: []

  - method: GET
    path: "/accreditation/medication-records/{recordId}"
    description: "fetch one medication administration record with its compliance flag"
    roles: [HealthCareStaff, CampDirector, AccreditationOfficer, StateLicensingAgent]
    code: 200
    input: []
    output: MedicationAdministrationRecord
    side_effects: []

  - method: GET
    path: "/accreditation/medication-records"
    description: "list medication administration records; camp_id is the reverse-reachability channel from Camp"
    roles: [HealthCareStaff, CampDirector, AccreditationOfficer, StateLicensingAgent]
    code: 200
    input: ["camp_id?", "camper_reference?", "medication_class?", "record_status?", "compliance_flag?", "limit?", "offset?"]
    output: MedicationAdministrationRecord[]
    side_effects: []

  - method: GET
    path: "/accreditation/annual-reports/{reportId}"
    description: "fetch one annual report with its due_date, lifecycle status, reopen_count and disclosed_incident_count"
    roles: [CampDirector, AccreditationOfficer, StateLicensingAgent]
    code: 200
    input: []
    output: AnnualReport
    side_effects: []

  - method: GET
    path: "/accreditation/annual-reports"
    description: "list annual reports; camp_id is the reverse-reachability channel from Camp"
    roles: [CampDirector, AccreditationOfficer, StateLicensingAgent]
    code: 200
    input: ["camp_id?", "report_year?", "status?", "limit?", "offset?"]
    output: AnnualReport[]
    side_effects: []

  - method: GET
    path: "/accreditation/incident-disclosures/{disclosureId}"
    description: "fetch one incident disclosure with its severity weight, state notification flag and reported-versus-late status"
    roles: [CampDirector, AccreditationOfficer, StateLicensingAgent]
    code: 200
    input: []
    output: IncidentDisclosure
    side_effects: []

  - method: GET
    path: "/accreditation/incident-disclosures"
    description: "list incident disclosures; annual_report_id is the reverse-reachability channel from AnnualReport"
    roles: [CampDirector, AccreditationOfficer, StateLicensingAgent]
    code: 200
    input: ["annual_report_id?", "incident_type?", "status?", "state_notification_required?", "limit?", "offset?"]
    output: IncidentDisclosure[]
    side_effects: []

  - method: GET
    path: "/accreditation/cycles/{cycleId}/compliance-summary"
    description: "computed read - both variants of calculations.mandatory_compliance_score side by side for the same stored evaluation rows, plus the weighted percentage and the applicability breakdown"
    roles: [CampDirector, AccreditationOfficer, Visitor]
    code: 200
    input: []
    output:
      cycle_id: string
      applicable_standard_count: integer
      applicable_mandatory_count: integer
      provisional_denominator: integer
      provisional_numerator: integer
      provisional_mandatory_pct: number
      final_denominator: integer
      final_numerator: integer
      final_mandatory_pct: number
      weighted_total: integer
      weighted_met: integer
      final_weighted_pct: number
      open_deficiency_count: integer
      projected_decision_level: string
    side_effects: []

  - method: GET
    path: "/accreditation/camps/{campId}/risk-index"
    description: "computed read - calculations.camp_risk_index broken out by component with the variant that produced it"
    roles: [CampDirector, AccreditationOfficer, StateLicensingAgent]
    code: 200
    input: []
    output:
      camp_id: string
      risk_index_variant: string
      incident_component: number
      program_component: number
      staffing_gap_penalty: number
      license_penalty: number
      compliance_component: number
      population_multiplier: number
      risk_index: number
    side_effects: []

  # ------------------------------------------------------------- registry ---
  - method: POST
    path: "/accreditation/camps"
    description: "register a camp; prior_accredited_cycle_count may be seeded for camps migrating from paper records"
    roles: [AccreditationOfficer]
    code: 201
    input: ["name", "camp_type", "state_code", "population_served", "program_elements?", "resident_census?", "distance_to_hospital_km?", "max_daily_census?", "health_staffing_level?", "prior_accredited_cycle_count?"]
    output: Camp
    side_effects:
      - "compute calculations.required_health_staffing_level"
      - "compute calculations.camp_compliance_posture"
      - "compute calculations.camp_risk_index under variant pre_visit"

  - method: PATCH
    path: "/accreditation/camps/{campId}/state-license"
    description: "state health department licensing interaction - move the camp's state_license_status axis and optionally record the license number"
    roles: [StateLicensingAgent]
    code: 200
    input: ["state_license_status", "state_license_number?"]
    output: Camp
    side_effects:
      - "Camp state_license_status axis transition per section 1.2"
      - "recompute calculations.camp_compliance_posture"
      - "a recomputed posture of FROZEN suspends health intake, flips VERIFIED WrittenPlans to REVALIDATION_REQUIRED and knocks their VERIFIED StandardEvaluations to REJECTED"
      - "recompute calculations.camp_risk_index"
      - "increments Camp.version by 1"

  - method: PATCH
    path: "/accreditation/camps/{campId}/health-center"
    description: "update health center configuration and receive controlled-substance stock; controlled_intake_units_added is added to camp.controlled_intake_units and to camp.controlled_on_hand_units"
    roles: [HealthCareStaff, CampDirector]
    code: 200
    input: ["health_staffing_level?", "resident_census?", "max_daily_census?", "distance_to_hospital_km?", "controlled_intake_units_added?"]
    output: Camp
    side_effects:
      - "recompute calculations.required_health_staffing_level"
      - "recompute calculations.controlled_substance_ledger"
      - "recompute calculations.camp_compliance_posture"
      - "recompute calculations.camp_risk_index"
      - "increments Camp.version by 1"

  - method: POST
    path: "/accreditation/standards-sets"
    description: "create a DRAFT standards edition"
    roles: [AccreditationOfficer]
    code: 201
    input: [edition_code, effective_year]
    output: StandardsSet
    side_effects: []

  - method: POST
    path: "/accreditation/standards"
    description: "add a standard to a DRAFT edition with its applicability gates, mandatory flag and scoring weight"
    roles: [AccreditationOfficer]
    code: 201
    input: ["standards_set_id", "code", "title", "domain", "mandatory?", "scoring_weight?", "written_plan_type_required?", "applies_to_camp_types?", "requires_program_elements_any?", "applies_to_populations?", "requires_state_licensed?"]
    output: Standard
    side_effects: ["recompute StandardsSet.standard_count and StandardsSet.mandatory_count"]

  - method: POST
    path: "/accreditation/standards-sets/{setId}/publish"
    description: "publish a DRAFT edition so cycles may pin it; a published edition accepts no further standards"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: StandardsSet
    side_effects: ["status DRAFT -> PUBLISHED", "published_at = current logical clock"]

  # ------------------------------------------------- cycle and self-assessment
  - method: POST
    path: "/accreditation/cycles"
    description: "open an accreditation cycle; version-pins the edition, runs applicability determination for every standard in it, and supersedes any prior SELF_ASSESSMENT cycle of the same camp"
    roles: [AccreditationOfficer]
    code: 201
    input: [camp_id, standards_set_id, cycle_year, expected_camp_version]
    output: AccreditationCycle
    side_effects:
      - "compute calculations.standard_applicability_determination, materializing one StandardEvaluation per Standard in the pinned edition"
      - "stamp cycle.applicable_standard_count and cycle.applicable_mandatory_count"
      - "any prior AccreditationCycle of this camp with status SELF_ASSESSMENT -> TERMINATED with its DRAFT or SCHEDULED visit -> RESCINDED and that visit's ASSIGNED seats -> WITHDRAWN"
      - "recompute calculations.camp_risk_index under variant pre_visit"
      - "increments Camp.version by 1"

  - method: PATCH
    path: "/accreditation/standard-evaluations/{evaluationId}/self-assessment"
    description: "record the camp's own verdict on one applicable standard and optionally cite a written plan as evidence"
    roles: [CampDirector]
    code: 200
    input: ["self_score", "written_plan_id?", "note?"]
    output: StandardEvaluation
    side_effects:
      - "StandardEvaluation self_status dimension transition to SUBMITTED"
      - "recompute calculations.camp_risk_index under variant pre_visit"

  - method: POST
    path: "/accreditation/cycles/{cycleId}/submit-self-assessment"
    description: "submit the completed self-assessment; every applicable evaluation must carry a self_score and the camp's actual staffing must meet its required level"
    roles: [CampDirector]
    code: 200
    input: []
    output: AccreditationCycle
    side_effects:
      - "every applicable evaluation with self_status SUBMITTED -> VERIFIED"
      - "cycle.self_assessment_submitted_at = current logical clock"
      - "recompute calculations.camp_risk_index under variant pre_visit"

  # ---------------------------------------------------------- written plans --
  - method: POST
    path: "/accreditation/written-plans"
    description: "file a written plan for supervision, health care, emergency response, aquatics, transportation or adventure operations; supersedes the camp's prior plan of the same plan_type"
    roles: [CampDirector, HealthCareStaff]
    code: 201
    input: ["camp_id", "plan_type", "body_ref", "effective_date", "expires_at", "physician_reviewed?", "expected_camp_version"]
    output: WrittenPlan
    side_effects:
      - "any prior WrittenPlan of this camp with the same plan_type -> SUPERSEDED with the new plan's supersedes_plan_id set to it"
      - "when the superseded plan was VERIFIED, every StandardEvaluation citing it with self_status VERIFIED -> REJECTED"
      - "increments Camp.version by 1"

  - method: POST
    path: "/accreditation/written-plans/{planId}/review"
    description: "verify or reject a filed written plan; a HEALTH_CARE plan may only be verified when physician_reviewed is true and the reviewer may not be the filer"
    roles: [AccreditationOfficer]
    code: 200
    input: ["decision", "verification_note?"]
    output: WrittenPlan
    side_effects:
      - "decision VERIFY moves SUBMITTED or REVALIDATION_REQUIRED -> VERIFIED and stamps verified_at and reviewer_user_id"
      - "decision REJECT moves SUBMITTED -> REJECTED and knocks every citing StandardEvaluation with self_status SUBMITTED to REJECTED"

  # -------------------------------------------------------- visitor roster ---
  - method: POST
    path: "/accreditation/visitors"
    description: "add a trained visitor to the roster; employer_camp_id records the conflict-of-interest relationship"
    roles: [AccreditationOfficer]
    code: 201
    input: ["full_name", "home_state_code", "trained_through_year", "certifications?", "employer_camp_id?"]
    output: Visitor
    side_effects: []

  - method: POST
    path: "/accreditation/visitors/{visitorId}/deactivate"
    description: "remove a visitor from the roster; cascades through every ASSIGNED seat to the visits and cycles that depended on them"
    roles: [AccreditationOfficer]
    code: 200
    input: ["deactivated_reason?"]
    output: Visitor
    side_effects:
      - "every VisitAssignment of this visitor with status ASSIGNED -> WITHDRAWN"
      - "recompute calculations.visitor_travel_commitment to 0 for the withdrawn seats"
      - "each affected SCHEDULED visit whose team completeness broke -> DRAFT with scheduled_by_user_id cleared"
      - "each such visit revert drives its AccreditationCycle VISIT_SCHEDULED -> SELF_ASSESSMENT"

  # ------------------------------------------------------- visit scheduling --
  - method: POST
    path: "/accreditation/visits"
    description: "open a DRAFT visit for a cycle with an agreed window of at most VISIT_WINDOW_MAX_DAYS 14 days; supersedes any standing DRAFT or SCHEDULED visit of the same cycle"
    roles: [AccreditationOfficer]
    code: 201
    input: ["cycle_id", "window_start_date", "window_end_date", "expected_cycle_version", "scheduled_note?"]
    output: AccreditationVisit
    side_effects:
      - "compute visit.required_specialist_domains from the camp's program elements and required staffing level"
      - "any standing DRAFT or SCHEDULED visit of this cycle -> RESCINDED with its ASSIGNED seats -> WITHDRAWN"
      - "recompute calculations.visitor_travel_commitment for every visitor whose seat was withdrawn"
      - "a superseded SCHEDULED visit drives cycle VISIT_SCHEDULED -> SELF_ASSESSMENT"
      - "increments AccreditationCycle.version by 1"

  - method: POST
    path: "/accreditation/visit-assignments"
    description: "seat a trained visitor on a DRAFT visit for a travel block inside the visit window"
    roles: [AccreditationOfficer]
    code: 201
    input: [visit_id, visitor_id, team_role, travel_block_start_date, travel_block_end_date]
    output: VisitAssignment
    side_effects:
      - "compute assignment.travel_days and recompute calculations.visitor_travel_commitment"
      - "recompute visit.team_size"
      - "team_role LEAD sets visit.lead_visitor_id"

  - method: POST
    path: "/accreditation/visit-assignments/{assignmentId}/withdraw"
    description: "release a seated visitor from a DRAFT or SCHEDULED visit"
    roles: [AccreditationOfficer]
    code: 200
    input: ["withdrawal_reason?"]
    output: VisitAssignment
    side_effects:
      - "status ASSIGNED -> WITHDRAWN"
      - "recompute calculations.visitor_travel_commitment"
      - "recompute visit.team_size and clear visit.lead_visitor_id when the LEAD seat was released"
      - "a SCHEDULED visit whose completeness broke -> DRAFT, driving cycle VISIT_SCHEDULED -> SELF_ASSESSMENT"

  - method: POST
    path: "/accreditation/visits/{visitId}/schedule"
    description: "confirm the visit once the trained visitor team is complete and the camp's state licence does not block the visit"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: AccreditationVisit
    side_effects:
      - "visit status DRAFT -> SCHEDULED and scheduled_by_user_id = X-User-ID"
      - "cycle status SELF_ASSESSMENT -> VISIT_SCHEDULED"

  - method: POST
    path: "/accreditation/visits/{visitId}/start"
    description: "the lead visitor opens scoring on site, only inside the agreed window"
    roles: [Visitor]
    code: 200
    input: []
    output: AccreditationVisit
    side_effects: ["visit status SCHEDULED -> IN_PROGRESS"]

  - method: PATCH
    path: "/accreditation/standard-evaluations/{evaluationId}/visitor-score"
    description: "score one applicable standard with the evidence channel behind the verdict; activity-domain standards require the matching specialist certification"
    roles: [Visitor]
    code: 200
    input: ["visitor_score", "score_source", "note?"]
    output: StandardEvaluation
    side_effects:
      - "visit_status UNSCORED -> SCORED, or SCORED -> SCORED on a re-score"
      - "evaluation.visit_id and evaluation.scored_by_visitor_id stamped"
      - "recompute visit.mandatory_scored_count and visit.mandatory_met_count"

  - method: POST
    path: "/accreditation/visits/{visitId}/finalize-scoring"
    description: "the lead visitor closes scoring; stamps the provisional mandatory percentage, locks every evaluation, raises deficiencies and may freeze the camp"
    roles: [Visitor]
    code: 200
    input: []
    output: AccreditationVisit
    side_effects:
      - "visit status IN_PROGRESS -> SCORED with scored_at stamped and cycle VISIT_SCHEDULED -> VISIT_COMPLETED"
      - "compute calculations.mandatory_compliance_score variant visit_provisional"
      - "every applicable StandardEvaluation visit_status -> LOCKED"
      - "every ASSIGNED VisitAssignment -> COMPLETED with calculations.visitor_travel_commitment deliberately unchanged"
      - "compute calculations.deficiency_penalty_and_deadline, creating one OPEN Deficiency per NOT_MET applicable evaluation"
      - "recompute camp.penalty_point_balance then calculations.camp_compliance_posture"
      - "a recomputed posture of FROZEN suspends health intake, flips VERIFIED WrittenPlans to REVALIDATION_REQUIRED and knocks their VERIFIED StandardEvaluations to REJECTED"
      - "recompute calculations.camp_risk_index under variant post_visit"

  # -------------------------------------------------------------- decision ---
  - method: POST
    path: "/accreditation/cycles/{cycleId}/decision"
    description: "issue the accreditation decision; the acting officer may not be the officer that scheduled the visit"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: AccreditationCycle
    side_effects:
      - "compute calculations.mandatory_compliance_score variant office_final into cycle.final_mandatory_pct"
      - "compute calculations.accreditation_decision_level into cycle.final_weighted_pct and cycle.decision_level"
      - "compute calculations.accreditation_fee_assessment into cycle.assessed_fee_cents"
      - "cycle status VISIT_COMPLETED -> CLOSED, IN_CORRECTION or TERMINATED per the decision branch"
      - "camp.accreditation_status axis transition per the decision mapping"
      - "decision DENIED escalates every non-terminal Deficiency and recomputes camp.penalty_point_balance then calculations.camp_compliance_posture"
      - "a CLOSED branch archives every ACCEPTED AnnualReport of the camp with report_year below cycle.cycle_year"
      - "cycle.decision_issued_at and cycle.decision_issued_by_user_id stamped"

  - method: POST
    path: "/accreditation/deficiencies/{deficiencyId}/correction-plan"
    description: "file or refile a correction plan against an open deficiency, bounded by PLAN_REVISION_LIMIT of 3 revisions and by the correction_due_date"
    roles: [CampDirector]
    code: 200
    input: [correction_plan_text]
    output: Deficiency
    side_effects:
      - "status OPEN -> PLAN_SUBMITTED, or PLAN_SUBMITTED -> PLAN_SUBMITTED when an unreviewed plan is replaced"
      - "plan_revision_count += 1 and last_plan_submitted_at stamped"
      - "camp.penalty_point_balance deliberately unchanged because PLAN_SUBMITTED stays inside the counted set"

  - method: POST
    path: "/accreditation/deficiencies/{deficiencyId}/review"
    description: "adjudicate a correction plan - ACCEPT_PLAN, REJECT_PLAN back into the revision loop, VERIFY_CORRECTION, or WAIVE a non-mandatory finding"
    roles: [AccreditationOfficer]
    code: 200
    input: ["decision", "reviewer_note?"]
    output: Deficiency
    side_effects:
      - "Deficiency status transition per the decision, including the PLAN_SUBMITTED -> OPEN revision loop edge"
      - "recompute camp.penalty_point_balance then calculations.camp_compliance_posture"
      - "recompute cycle.open_deficiency_count; reaching 0 moves the cycle IN_CORRECTION -> CLOSED and may upgrade camp.accreditation_status"
      - "a REJECT_PLAN on the third revision escalates the deficiency and terminates the cycle"

  # ------------------------------------------------- health center records ---
  - method: POST
    path: "/accreditation/medication-records"
    description: "record a medication administration; class-specific licensure, staffing level, witness signature, stock and per-camper 24 hour dosing rules all apply"
    roles: [HealthCareStaff]
    code: 201
    input: ["camp_id", "camper_reference", "medication_class", "dose_units", "administered_at", "administered_by_role", "second_signature_present?"]
    output: MedicationAdministrationRecord
    side_effects:
      - "stamp compliance_flag DOCUMENTATION_INCOMPLETE when medication_class is PRESCRIPTION and second_signature_present is false, otherwise COMPLIANT"
      - "recompute calculations.controlled_substance_ledger for a CONTROLLED record"

  - method: POST
    path: "/accreditation/medication-records/{recordId}/void"
    description: "void a recorded administration; the compensating write restores the controlled-substance ledger exactly"
    roles: [HealthCareStaff]
    code: 200
    input: ["void_reason?"]
    output: MedicationAdministrationRecord
    side_effects:
      - "record_status RECORDED -> VOIDED"
      - "recompute calculations.controlled_substance_ledger, returning camp.controlled_on_hand_units to its pre-record value"

  # ----------------------------------------------------- annual reporting ----
  - method: POST
    path: "/accreditation/annual-reports"
    description: "open the between-cycles annual report for a season year; due_date is fixed at March 1 of the following year"
    roles: [CampDirector]
    code: 201
    input: [camp_id, report_year]
    output: AnnualReport
    side_effects: ["compute due_date as report_year plus one, March 1"]

  - method: POST
    path: "/accreditation/annual-reports/{reportId}/submit"
    description: "attest and file the annual report; filing after due_date lands in LATE rather than SUBMITTED"
    roles: [CampDirector]
    code: 200
    input: [declared_incident_count]
    output: AnnualReport
    side_effects:
      - "status -> SUBMITTED when the logical clock date is on or before due_date, otherwise LATE"
      - "submitted_at and attested_by_user_id stamped"

  - method: POST
    path: "/accreditation/annual-reports/{reportId}/review"
    description: "accept or reject a filed annual report"
    roles: [AccreditationOfficer]
    code: 200
    input: ["decision", "reviewer_note?"]
    output: AnnualReport
    side_effects: ["status SUBMITTED or LATE -> ACCEPTED or REJECTED"]

  - method: POST
    path: "/accreditation/incident-disclosures"
    description: "disclose an incident under an annual report; a disclosure filed against an already ACCEPTED report reopens it and is stamped LATE_DISCLOSED"
    roles: [CampDirector]
    code: 201
    input: [annual_report_id, incident_type, occurred_at]
    output: IncidentDisclosure
    side_effects:
      - "stamp severity_weight, state_notification_required and status REPORTED or LATE_DISCLOSED"
      - "recompute report.disclosed_incident_count"
      - "an ACCEPTED report -> REOPENED with reopen_count incremented"
      - "recompute calculations.camp_risk_index"

  # ------------------------------------------------------- test-driving -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the logical clock used by every deadline, window and timestamp rule in this domain. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [AccreditationOfficer, CampDirector, HealthCareStaff, Visitor, StateLicensingAgent]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
      escalated_deficiency_count: integer
      terminated_cycle_count: integer
    side_effects:
      - "advancing the clock date past a Deficiency.correction_due_date on an IN_CORRECTION cycle escalates that deficiency, terminates the cycle, revokes camp.accreditation_status and recomputes calculations.camp_compliance_posture to FROZEN"
      - "advancing the clock past an AnnualReport.due_date does not by itself change report status; lateness is decided at submission"

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================
errors:

  # --- auth -----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of CampDirector, HealthCareStaff, Visitor, AccreditationOfficer, StateLicensingAgent"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_FORBIDDEN_SCOPE
    http: 403
    condition: "the acting entity-backed identity does not own the target resource - a CampDirector or HealthCareStaff acting on another camp's resource, a Visitor starting or finalizing a visit they do not lead, or a Visitor scoring an evaluation on a visit where they hold no ASSIGNED seat"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the AccreditationOfficer issuing a cycle decision is the same X-User-ID that scheduled that cycle's visit"

  # --- schema ---------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required input field, enum value outside its declared domain, negative integer where non-negative is declared, or a date or timestamp that is not ISO-8601"

  # --- existence ------------------------------------------------------------
  - id: ERR_CAMP_NOT_FOUND
    http: 404
    condition: "campId or camp_id does not resolve to a Camp"
  - id: ERR_STANDARDS_SET_NOT_FOUND
    http: 404
    condition: "setId or standards_set_id does not resolve to a StandardsSet"
  - id: ERR_STANDARD_NOT_FOUND
    http: 404
    condition: "standardId does not resolve to a Standard"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "cycleId or cycle_id does not resolve to an AccreditationCycle"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "evaluationId does not resolve to a StandardEvaluation"
  - id: ERR_WRITTEN_PLAN_NOT_FOUND
    http: 404
    condition: "planId or written_plan_id does not resolve to a WrittenPlan"
  - id: ERR_VISITOR_NOT_FOUND
    http: 404
    condition: "visitorId or visitor_id does not resolve to a Visitor"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "visitId or visit_id does not resolve to an AccreditationVisit"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignmentId does not resolve to a VisitAssignment"
  - id: ERR_DEFICIENCY_NOT_FOUND
    http: 404
    condition: "deficiencyId does not resolve to a Deficiency"
  - id: ERR_MED_RECORD_NOT_FOUND
    http: 404
    condition: "recordId does not resolve to a MedicationAdministrationRecord"
  - id: ERR_ANNUAL_REPORT_NOT_FOUND
    http: 404
    condition: "reportId or annual_report_id does not resolve to an AnnualReport"
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "disclosureId does not resolve to an IncidentDisclosure"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_CAMP_VERSION
    http: 412
    condition: "expected_camp_version does not equal the Camp's stored version on POST /accreditation/cycles or POST /accreditation/written-plans"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal the AccreditationCycle's stored version on POST /accreditation/visits"

  # --- state ----------------------------------------------------------------
  - id: ERR_STANDARDS_SET_ALREADY_PUBLISHED
    http: 409
    condition: "a standard is added to a PUBLISHED or RETIRED edition, or a non-DRAFT edition is published again"
  - id: ERR_STANDARDS_SET_NOT_PUBLISHED
    http: 409
    condition: "a cycle attempts to pin a StandardsSet whose status is not PUBLISHED"
  - id: ERR_CYCLE_NOT_IN_SELF_ASSESSMENT
    http: 409
    condition: "the AccreditationCycle is not in the status the operation requires - self-assessment writes, submit and visit creation need SELF_ASSESSMENT, and the decision needs VISIT_COMPLETED"
  - id: ERR_VISIT_INVALID_STATE
    http: 409
    condition: "the AccreditationVisit is not in the status the operation requires - schedule and seat changes need DRAFT, start needs SCHEDULED, scoring and finalize need IN_PROGRESS"
  - id: ERR_DEFICIENCY_INVALID_STATE
    http: 409
    condition: "the Deficiency status does not admit the requested action - correction-plan needs OPEN or PLAN_SUBMITTED, ACCEPT_PLAN and REJECT_PLAN need PLAN_SUBMITTED, VERIFY_CORRECTION needs PLAN_ACCEPTED, WAIVE needs OPEN with severity SCORED"
  - id: ERR_ANNUAL_REPORT_INVALID_STATE
    http: 409
    condition: "the AnnualReport status does not admit the requested action - submit needs DRAFT, REJECTED or REOPENED, review needs SUBMITTED or LATE, and an ARCHIVED report accepts nothing"
  - id: ERR_EVALUATION_LOCKED
    http: 409
    condition: "a visitor score is written to an evaluation whose visit_status is LOCKED, or a self score is written to an evaluation whose self_status is VERIFIED"
  - id: ERR_VISITOR_INACTIVE
    http: 409
    condition: "an INACTIVE Visitor is seated on a visit, or an already INACTIVE Visitor is deactivated again"
  - id: ERR_CAMP_POSTURE_FROZEN
    http: 409
    condition: "the Camp's compliance_posture is FROZEN when a cycle is opened, a visit is scheduled or started, or a CONTROLLED or PRESCRIPTION medication record is created"

  # --- business_safety ------------------------------------------------------
  - id: ERR_STATE_LICENSE_BLOCKS_VISIT
    http: 422
    condition: "the camp's state_license_status is PENDING or SUSPENDED when the visit is scheduled"
  - id: ERR_WRITTEN_PLAN_NOT_VERIFIED
    http: 422
    condition: "self_score MET is recorded on a standard demanding a written plan type without a VERIFIED WrittenPlan of that type cited in written_plan_id"
  - id: ERR_HEALTH_STAFFING_INSUFFICIENT
    http: 422
    condition: "the camp's health_staffing_level rank is below the medication class minimum, or below required_health_staffing_level when the self-assessment is submitted"
  - id: ERR_PHYSICIAN_REVIEW_REQUIRED
    http: 422
    condition: "a HEALTH_CARE WrittenPlan is verified while physician_reviewed is false"
  - id: ERR_VISITOR_CONFLICT_OF_INTEREST
    http: 422
    condition: "the seated visitor's employer_camp_id equals the camp under review, or a LEAD seat is given to a visitor whose home_state_code equals the camp's state_code"
  - id: ERR_SPECIALIST_CERTIFICATION_REQUIRED
    http: 422
    condition: "a visitor scores an AQUATICS, ADVENTURE or HEALTH_WELLNESS standard without the matching specialist certification"
  - id: ERR_MED_ROLE_NOT_PERMITTED
    http: 422
    condition: "administered_by_role is not licensed for the medication_class administered"
  - id: ERR_CONTROLLED_SECOND_SIGNATURE_REQUIRED
    http: 422
    condition: "a CONTROLLED medication record is created with second_signature_present false"
  - id: ERR_CONTROLLED_STOCK_INSUFFICIENT
    http: 422
    condition: "dose_units on a CONTROLLED record exceeds the camp's controlled_on_hand_units"

  # --- business_constraint -------------------------------------------------
  - id: ERR_VISITOR_TRAVEL_CONFLICT
    http: 422
    condition: "the requested travel block, widened by TRAVEL_BUFFER_DAYS of 2 days on both sides, overlaps another ASSIGNED or COMPLETED assignment of the same visitor"
  - id: ERR_CONTROLLED_DOSE_WINDOW_EXCEEDED
    http: 422
    condition: "MAX_CONTROLLED_PER_24H of 2 RECORDED CONTROLLED records already exist for this camper_reference in the half-open 24 hour window ending at administered_at"
  - id: ERR_TEAM_COMPOSITION_INCOMPLETE
    http: 422
    condition: "the visit is scheduled without a LEAD seat, with fewer than 2 ASSIGNED seats, or missing a certified specialist seat for a required specialist domain"
  - id: ERR_VISITOR_TRAINING_EXPIRED
    http: 422
    condition: "the seated visitor's trained_through_year is below the calendar year of the visit's window_start_date"
  - id: ERR_DUPLICATE_CYCLE_YEAR
    http: 409
    condition: "a second AccreditationCycle is opened for the same camp_id and cycle_year, or a second AnnualReport for the same camp_id and report_year"
  - id: ERR_PLAN_REVISION_LIMIT
    http: 422
    condition: "a fourth correction plan is filed against a deficiency whose plan_revision_count already equals PLAN_REVISION_LIMIT of 3"
  - id: ERR_SELF_ASSESSMENT_INCOMPLETE
    http: 422
    condition: "the self-assessment is submitted while some applicable evaluation still has a null self_score"
  - id: ERR_MANDATORY_SCORING_INCOMPLETE
    http: 422
    condition: "scoring is finalized while some applicable mandatory evaluation still has a null visitor_score"
  - id: ERR_DECLARED_COUNT_BELOW_DISCLOSED
    http: 422
    condition: "declared_incident_count at submission is below the report's disclosed_incident_count"

  # --- business_referential ------------------------------------------------
  - id: ERR_STANDARD_NOT_APPLICABLE
    http: 422
    condition: "a self score or visitor score is written to an evaluation whose applicable flag is false"
  - id: ERR_PLAN_CAMP_MISMATCH
    http: 422
    condition: "the WrittenPlan cited in written_plan_id belongs to a different camp than the evaluation's cycle"
  - id: ERR_VISIT_CYCLE_MISMATCH
    http: 422
    condition: "the evaluation being scored belongs to a different cycle than the visit on which the acting visitor holds a seat"

  # --- business_temporal ---------------------------------------------------
  - id: ERR_VISIT_WINDOW_INVALID
    http: 422
    condition: "window_end_date precedes window_start_date, the window exceeds VISIT_WINDOW_MAX_DAYS of 14 inclusive days, or window_start_date precedes the logical clock calendar date"
  - id: ERR_TRAVEL_BLOCK_OUTSIDE_WINDOW
    http: 422
    condition: "the requested travel block extends outside the visit's window on either side"
  - id: ERR_OUTSIDE_VISIT_WINDOW
    http: 422
    condition: "the visit is started while the logical clock calendar date lies outside the agreed window"
  - id: ERR_CORRECTION_WINDOW_EXPIRED
    http: 422
    condition: "a correction plan is filed or a correction verified after the deficiency's correction_due_date"
  - id: ERR_INCIDENT_OUTSIDE_REPORT_YEAR
    http: 422
    condition: "the disclosure's occurred_at calendar year differs from the report's report_year, or a WrittenPlan's expires_at is not strictly after its effective_date"

# ============================================================================
# 1.7 RBAC Matrix
# ============================================================================
roles:

  - name: CampDirector
    description: "the camp's accountable operator; authors the self-assessment, files written plans and correction plans, and files the between-cycles annual report with its incident disclosures"
    identity: "entity_backed:Camp"
    exclusive_operations:
      - "PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment"
      - "POST /accreditation/cycles/{cycleId}/submit-self-assessment"
      - "POST /accreditation/deficiencies/{deficiencyId}/correction-plan"
      - "POST /accreditation/annual-reports"
      - "POST /accreditation/annual-reports/{reportId}/submit"
      - "POST /accreditation/incident-disclosures"
    shared_operations:
      - "POST /accreditation/written-plans (shared with HealthCareStaff)"
      - "PATCH /accreditation/camps/{campId}/health-center (shared with HealthCareStaff)"
      - "GET /accreditation/camps/{campId}, GET /accreditation/camps/{campId}/risk-index"
      - "GET /accreditation/standards-sets/{setId}, GET /accreditation/standards-sets, GET /accreditation/standards/{standardId}, GET /accreditation/standards"
      - "GET /accreditation/cycles/{cycleId}, GET /accreditation/cycles, GET /accreditation/cycles/{cycleId}/compliance-summary"
      - "GET /accreditation/standard-evaluations/{evaluationId}, GET /accreditation/standard-evaluations"
      - "GET /accreditation/written-plans/{planId}, GET /accreditation/written-plans"
      - "GET /accreditation/visits/{visitId}, GET /accreditation/visits"
      - "GET /accreditation/deficiencies/{deficiencyId}, GET /accreditation/deficiencies"
      - "GET /accreditation/medication-records/{recordId}, GET /accreditation/medication-records"
      - "GET /accreditation/annual-reports/{reportId}, GET /accreditation/annual-reports"
      - "GET /accreditation/incident-disclosures/{disclosureId}, GET /accreditation/incident-disclosures"
      - "POST /_clock/set_current_utc"

  - name: HealthCareStaff
    description: "the camp health center's licensed staff; records medication administration and voids erroneous records, receives controlled-substance stock, and files health-care written plans - but never scores standards and never files the annual report"
    identity: "entity_backed:Camp"
    exclusive_operations:
      - "POST /accreditation/medication-records"
      - "POST /accreditation/medication-records/{recordId}/void"
    shared_operations:
      - "POST /accreditation/written-plans (shared with CampDirector)"
      - "PATCH /accreditation/camps/{campId}/health-center (shared with CampDirector)"
      - "GET /accreditation/camps/{campId}"
      - "GET /accreditation/written-plans/{planId}, GET /accreditation/written-plans"
      - "GET /accreditation/medication-records/{recordId}, GET /accreditation/medication-records"
      - "POST /_clock/set_current_utc"

  - name: Visitor
    description: "a trained ACA visitor seated on a visiting team; the lead visitor opens and closes scoring and every seated visitor scores standards within their certification, but no visitor ever adjudicates a written plan, a correction plan or an accreditation decision"
    identity: "entity_backed:Visitor"
    exclusive_operations:
      - "POST /accreditation/visits/{visitId}/start"
      - "PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score"
      - "POST /accreditation/visits/{visitId}/finalize-scoring"
    shared_operations:
      - "GET /accreditation/standards/{standardId}, GET /accreditation/standards"
      - "GET /accreditation/cycles/{cycleId}, GET /accreditation/cycles, GET /accreditation/cycles/{cycleId}/compliance-summary"
      - "GET /accreditation/standard-evaluations/{evaluationId}, GET /accreditation/standard-evaluations"
      - "GET /accreditation/visitors/{visitorId}, GET /accreditation/visitors"
      - "GET /accreditation/visits/{visitId}, GET /accreditation/visits"
      - "GET /accreditation/visit-assignments/{assignmentId}, GET /accreditation/visit-assignments"
      - "POST /_clock/set_current_utc"

  - name: AccreditationOfficer
    description: "the national office; owns the standards catalogue, the visitor roster, cycle and visit administration, written-plan verification, deficiency adjudication and the accreditation decision. The officer that scheduled a visit is barred from issuing that cycle's decision"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/camps"
      - "POST /accreditation/standards-sets"
      - "POST /accreditation/standards"
      - "POST /accreditation/standards-sets/{setId}/publish"
      - "POST /accreditation/cycles"
      - "POST /accreditation/written-plans/{planId}/review"
      - "POST /accreditation/visitors"
      - "POST /accreditation/visitors/{visitorId}/deactivate"
      - "POST /accreditation/visits"
      - "POST /accreditation/visit-assignments"
      - "POST /accreditation/visit-assignments/{assignmentId}/withdraw"
      - "POST /accreditation/visits/{visitId}/schedule"
      - "POST /accreditation/cycles/{cycleId}/decision"
      - "POST /accreditation/deficiencies/{deficiencyId}/review"
      - "POST /accreditation/annual-reports/{reportId}/review"
    shared_operations:
      - "every GET endpoint in section 1.5"
      - "POST /_clock/set_current_utc"

  - name: StateLicensingAgent
    description: "the state health department; owns the state_license_status axis and reads camps, medication records and annual reports for licensing oversight, but has no standing in the accreditation decision at all"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /accreditation/camps/{campId}/state-license"
    shared_operations:
      - "GET /accreditation/camps/{campId}, GET /accreditation/camps, GET /accreditation/camps/{campId}/risk-index"
      - "GET /accreditation/medication-records/{recordId}, GET /accreditation/medication-records"
      - "GET /accreditation/annual-reports/{reportId}, GET /accreditation/annual-reports"
      - "GET /accreditation/incident-disclosures/{disclosureId}, GET /accreditation/incident-disclosures"
      - "POST /_clock/set_current_utc"
