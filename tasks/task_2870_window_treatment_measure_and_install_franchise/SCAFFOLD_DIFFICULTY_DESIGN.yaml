# =====================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2870 - Window Treatment Measure-and-Install Franchise
#
# Every instance grounds only in elements declared by SCAFFOLD.yaml
# §1.1-§1.7. Every numeric assert below was computed by executing the
# named calculations[].formula against its constants (integer cents,
# round_half_up) - no estimates.
#
# Fixture conventions used throughout:
#   * the logical clock starts at 2026-08-01T00:00:00Z (§1.5
#     POST /_clock/set_current_utc) and is only ever moved forward;
#   * Franchisor calls carry the opaque audit id "hq-ops";
#   * Franchisee calls carry their Territory id, Designer calls their
#     Designer id and VendorRep calls their Vendor id, as §1.7 demands;
#   * expected_*_version values are always captured from a server
#     response on the parent row, never written as literals (§1.8 3c).
# =====================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------
  # Rule 1 - dual_variant_calc
  # -------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_versus_final_diverges_when_one_of_two_orders_installs
        grounds:
          - calculations.royalty_accrual
          - calculations.quote_totals
          - entities.Quote.fields.recognized_net_sales_cents
          - entities.Territory.fields.royalty_accrued_cents
          - entities.LedgerEntry.fields.entry_type
          - state_machines.Quote.PRESENTED_to_ACCEPTED
          - state_machines.InstallJob.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          This instance exercises the two variants of royalty_accrual on the MONEY domain
          (Quote/Territory net sales in cents): the `provisional` variant accrues royalty
          546 on the full two-opening basis 9920 at acceptance, and the `final` variant
          re-derives royalty 273 from the single installed opening 4960 and posts the
          signed difference -273 as a ROYALTY_REVERSAL row, so the two variants disagree
          on the same quote by exactly 273 cents.
        test_recipe:
          setup:
            - "One ACTIVE territory with royalty_rate_pct 0.055 and one ACTIVE designer."
            - "One ROUTED lead and one SCHEDULED consultation carrying two identical LT-SHEER CORDED openings, each priced at list_price_cents 4960 (INSIDE mount, ordered 23.5 x 47.75 in, billable_sqft 8.0)."
            - "The quote is PRESENTED and ACCEPTED: subtotal_cents 9920, install_fee_cents 12500, pre_discount_total_cents 22420, discount_pct 0, net_sales_cents 9920; the provisional royalty row of 546 cents is already on the ledger."
            - "Each opening sits on its OWN vendor order at the same vendor (concurrent_capacity 2, so both windows 2026-08-03..2026-08-13 fit), and only the FIRST order has been shipped and received."
            - "An install job for that first order exists with motorized_channel_count 0, so commissioning_status is NOT_REQUIRED and completion is unblocked."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301", "30302"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301", certifications: ["MOTORIZATION"] }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/vendors"
              payload: { name: "Ridgeline Shade Works", base_lead_time_days: 10, motorization_extra_days: 3, cutoff_hour_utc: 15, remake_policy: "SHARED_50_50", concurrent_capacity: 2, supported_lift_systems: ["CORDED", "CORDLESS", "MOTORIZED"], supported_hub_platforms: ["MATTER"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { v1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-03T00:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Living room west", room_type: "LIVING_ROOM", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Office south", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o2: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED", motorization_option: "NONE" }
              as: Designer
              as_user_id: "${d1}"
            - call: "PATCH /blinds/openings/${o2}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED", motorization_option: "NONE" }
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv1: $.data.version }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv1}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q1: $.data.id }
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/quotes/${q1}/accept"
              as: Designer
              as_user_id: "${d1}"
              captures: { qv1: $.data.version }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}"], expected_quote_version: "${qv1}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord1: $.data.id }
            - call: "GET /blinds/quotes/${q1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { qv2: $.data.version }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o2}"], expected_quote_version: "${qv2}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord2: $.data.id }
            - call: "POST /blinds/vendor-orders/${ord1}/ship"
              as: VendorRep
              as_user_id: "${v1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/vendor-orders/${ord1}/receive"
              as: Franchisee
              as_user_id: "${t1}"
            - call: "POST /blinds/install-jobs"
              payload: { vendor_order_id: "${ord1}", designer_id: "${d1}", scheduled_start_at: "2026-08-18T09:00:00.000Z", scheduled_end_at: "2026-08-18T11:00:00.000Z", service_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { j1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-18T09:30:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
          trigger:
            - call: "POST /blinds/install-jobs/${j1}/complete"
              as: Designer
              as_user_id: "${d1}"
          assert:
            - "InstallJob.${j1}.install_status == COMPLETED"
            - "Opening.${o1}.install_outcome == INSTALLED"
            - "Opening.${o2}.install_outcome == PENDING"
            - "Quote.${q1}.net_sales_cents == 9920 (the provisional basis is NOT restated)"
            - "Quote.${q1}.recognized_net_sales_cents == 4960"
            - "Territory.${t1}.net_sales_cents == 4960"
            - "Territory.${t1}.royalty_accrued_cents == 273"
            - "GET /blinds/territories/${t1}/ledger-entries?entry_type=NET_SALES_ROYALTY returns exactly one row with amount_cents == 546 and basis_cents == 9920"
            - "GET /blinds/territories/${t1}/ledger-entries?entry_type=ROYALTY_REVERSAL returns exactly one row with amount_cents == -273 and memo == 'install_trueup'"
            - "546 + (-273) == 273 == Territory.${t1}.royalty_accrued_cents (the ledger is the sum, never an independent figure)"

      - name: liability_window_variant_diverges_on_two_designers_with_identical_incident_history
        grounds:
          - calculations.designer_liability_score
          - calculations.sample_late_fee
          - entities.Territory.fields.liability_window
          - entities.Designer.fields.remeasure_liability_score
          - entities.Designer.fields.late_sample_return_count
          - state_machines.SampleCheckout.OPEN_to_RETURNED
          - state_machines.Designer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          This instance exercises the two variants of designer_liability_score on the
          PERSON-RISK domain (a Designer's integer conduct score, not money): two
          designers with byte-identical incident histories - three late sample returns,
          two of them stamped more than 180 days before the recompute - score 91 and stay
          ACTIVE under ROLLING_180D but score 73 and are auto-SUSPENDED under LIFETIME.
        test_recipe:
          setup:
            - "Two ACTIVE territories: T1 with liability_window ROLLING_180D over postal code 30301, T2 with liability_window LIFETIME over postal code 30401."
            - "One ACTIVE designer in each territory, each with one ROUTED lead and one SCHEDULED consultation and one sample kit whose replacement_value_cents is 50000 (far above any accrued fee, so the cap never engages)."
            - "Each designer books, returns late, and re-books the SAME kit three times on non-overlapping closed hold intervals: returns 5 days late on 2026-08-10, 5 days late on 2026-08-20, and 3 days late on 2027-03-06."
            - "The 180-day rolling window at the final recompute opens on 2026-09-07, so the two August 2026 returns are outside it and only the March 2027 return is inside."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/territories"
              payload: { legal_name: "Southgate Blinds LLC", postal_codes: ["30401"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "LIFETIME" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t2: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t2}", full_name: "Milo Vance", home_postal_code: "30401" }
              as: Franchisee
              as_user_id: "${t2}"
              captures: { d2: $.data.id }
            - call: "POST /blinds/sample-kits"
              payload: { territory_id: "${t1}", kit_code: "SHEERS-A", replacement_value_cents: 50000 }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { k1: $.data.id }
            - call: "POST /blinds/sample-kits"
              payload: { territory_id: "${t2}", kit_code: "SHEERS-B", replacement_value_cents: 50000 }
              as: Franchisee
              as_user_id: "${t2}"
              captures: { k2: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-03T00:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Bo Chen", postal_code: "30401", source: "REFERRAL", requested_at: "2026-08-03T00:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t2}"
              captures: { l2: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l2}", designer_id: "${d2}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30401" }
              as: Designer
              as_user_id: "${d2}"
              captures: { c2: $.data.id }
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k1}", consultation_id: "${c1}", hold_start_at: "2026-08-01T09:00:00.000Z", hold_end_at: "2026-08-05T17:00:00.000Z" }
              as: Designer
              as_user_id: "${d1}"
              captures: { co1a: $.data.id }
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k2}", consultation_id: "${c2}", hold_start_at: "2026-08-01T09:00:00.000Z", hold_end_at: "2026-08-05T17:00:00.000Z" }
              as: Designer
              as_user_id: "${d2}"
              captures: { co2a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T10:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/sample-checkouts/${co1a}/return"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/sample-checkouts/${co2a}/return"
              as: Designer
              as_user_id: "${d2}"
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k1}", consultation_id: "${c1}", hold_start_at: "2026-08-11T09:00:00.000Z", hold_end_at: "2026-08-15T17:00:00.000Z" }
              as: Designer
              as_user_id: "${d1}"
              captures: { co1b: $.data.id }
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k2}", consultation_id: "${c2}", hold_start_at: "2026-08-11T09:00:00.000Z", hold_end_at: "2026-08-15T17:00:00.000Z" }
              as: Designer
              as_user_id: "${d2}"
              captures: { co2b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T10:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/sample-checkouts/${co1b}/return"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/sample-checkouts/${co2b}/return"
              as: Designer
              as_user_id: "${d2}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k1}", consultation_id: "${c1}", hold_start_at: "2027-03-01T10:00:00.000Z", hold_end_at: "2027-03-03T17:00:00.000Z" }
              as: Designer
              as_user_id: "${d1}"
              captures: { co1c: $.data.id }
            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${k2}", consultation_id: "${c2}", hold_start_at: "2027-03-01T10:00:00.000Z", hold_end_at: "2027-03-03T17:00:00.000Z" }
              as: Designer
              as_user_id: "${d2}"
              captures: { co2c: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-06T12:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
          trigger:
            - call: "POST /blinds/sample-checkouts/${co1c}/return"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/sample-checkouts/${co2c}/return"
              as: Designer
              as_user_id: "${d2}"
          assert:
            - "SampleCheckout.${co1c}.days_late == 3 and SampleCheckout.${co1c}.late_fee_cents == 2250"
            - "SampleCheckout.${co2c}.days_late == 3 and SampleCheckout.${co2c}.late_fee_cents == 2250"
            - "Designer.${d1}.late_sample_return_count == 1 (the two August 2026 returns aged out of the 180-day window that opens 2026-09-07)"
            - "Designer.${d1}.remeasure_liability_score == 91"
            - "Designer.${d1}.status == ACTIVE"
            - "Designer.${d2}.late_sample_return_count == 3"
            - "Designer.${d2}.remeasure_liability_score == 73"
            - "Designer.${d2}.status == SUSPENDED"
            - "Consultation.${c2}.status == SCHEDULED (the suspension cascade only cancels appointments whose scheduled_start_at is at or after the clock, and 2026-08-03 is in the past)"
            - "Designer.${d1}.remeasure_liability_score - Designer.${d2}.remeasure_liability_score == 18 on identical histories"

  # -------------------------------------------------------------------
  # Rule 2 - combinatorial_formula
  # -------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: billable_sqft_ceils_per_opening_so_trio_costs_more_than_pooled_area
        grounds:
          - calculations.opening_list_price
          - calculations.quote_totals
          - entities.Opening.fields.billable_sqft
          - entities.Opening.fields.list_price_cents
          - entities.Quote.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b) - the per-row rounding boundary. Three identical CL-LINEN openings each
          bill 6.017795 raw square feet ceiled to 6.25 for a list price of 5875, so the
          quote subtotal is 17625; pooling the raw area first (18.053385 -> 18.25 sqft ->
          17155) is 470 cents cheaper. This instance pins WHERE the ceiling is applied.
        test_recipe:
          setup:
            - "One ACTIVE territory, one ACTIVE designer, one ROUTED lead with child_occupied_dwelling false, one SCHEDULED consultation."
            - "Three openings measured with byte-identical readings: INSIDE mount, all three widths 24.000, all three heights 37.125, depth 3.000, room types that do not trigger the cordless requirement."
            - "All three configured CL-LINEN / CORDED / NONE, so each carries exactly the same list price."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-03T00:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Front left", room_type: "LIVING_ROOM", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 37.125, height_center_in: 37.125, height_right_in: 37.125, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Front centre", room_type: "LIVING_ROOM", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 37.125, height_center_in: 37.125, height_right_in: 37.125, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o2: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Front right", room_type: "LIVING_ROOM", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 37.125, height_center_in: 37.125, height_right_in: 37.125, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o3: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "CL-LINEN", lift_system: "CORDED", motorization_option: "NONE" }
              as: Designer
              as_user_id: "${d1}"
            - call: "PATCH /blinds/openings/${o2}/configuration"
              payload: { fabric_code: "CL-LINEN", lift_system: "CORDED", motorization_option: "NONE" }
              as: Designer
              as_user_id: "${d1}"
            - call: "PATCH /blinds/openings/${o3}/configuration"
              payload: { fabric_code: "CL-LINEN", lift_system: "CORDED", motorization_option: "NONE" }
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv1: $.data.version }
          trigger:
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv1}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q1: $.data.id }
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
          assert:
            - "Opening.${o1}.ordered_width_in == 23.5 and Opening.${o1}.ordered_height_in == 36.875"
            - "Opening.${o1}.billable_sqft == 6.25 (raw 6.017795 square feet ceiled to the quarter)"
