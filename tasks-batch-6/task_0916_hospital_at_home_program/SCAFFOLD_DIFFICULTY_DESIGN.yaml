            - "Logical clock advanced through 2026-06-01 then into 2026-06-02."
            - "One ACTIVE CMS_WAIVER STANDARD-acuity episode with a deployed one-component DeviceKit, an ACTIVE MealPlan and one AUTHORIZED non-controlled DeliveryOrder."
