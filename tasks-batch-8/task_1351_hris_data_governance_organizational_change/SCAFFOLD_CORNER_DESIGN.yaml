      # --- Corners already exercised by §1.8 difficulty instances (stubs) ---
      - name: warning_dq_failure_opens_exception_record
        claim_type: side_effect_execution
        grounds:
          - state_machines.ChangeRequest.APPROVED_to_APPLIED
          - entities.ExceptionRecord.fields.status
        excluded_because:
          difficulty_instance: combinatorial_formula / exception_priority_score_tiered_inputs
          rationale: "Its setup applies a WARNING-failing change and its asserts pin the opened ExceptionRecord (status OPEN, priority_score 250)."

      - name: batch_reopen_resets_all_lines_to_pending
        claim_type: side_effect_execution
        grounds:
          - state_machines.MassChangeBatch.VALIDATION_FAILED_to_DRAFT
          - state_machines.BatchLine.FAILED_to_PENDING
        excluded_because:
          difficulty_instance: non_linear_state_machine / batch_validation_failure_reopen_cycle
          rationale: "Asserts the DRAFT -> VALIDATION_FAILED -> DRAFT -> VALIDATED cycle including the line reset to PENDING."

      - name: event_third_failure_dead_letters
        claim_type: threshold
        grounds:
          - state_machines.IntegrationEvent.DISPATCHED_to_FAILED
          - entities.IntegrationEvent.fields.retry_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / integration_event_retry_loop_until_dead_letter
          rationale: "Drives retry_count 1 -> 2 -> 3 and asserts the DEAD_LETTERED flip plus retry rejection with ERR_EVENT_INVALID_STATE."

      - name: batch_execute_applies_lines_emits_events
        claim_type: side_effect_execution
        grounds:
          - state_machines.MassChangeBatch.SCHEDULED_to_COMPLETED
          - state_machines.BatchLine.VALIDATED_to_APPLIED
        excluded_because:
          difficulty_instance: transitive_cascade / batch_execute_cascade_depth3
          rationale: "Asserts COMPLETED with applied_lines == 1, the truncate/insert row pair, and the two QUEUED channel events."

      - name: dead_letter_opens_dead_letter_exception
        claim_type: side_effect_execution
        grounds:
          - entities.ExceptionRecord.fields.integration_event_id
          - state_machines.IntegrationEvent.DISPATCHED_to_FAILED
        excluded_because:
          difficulty_instance: transitive_cascade / dispatch_third_failure_deadletters_and_opens_exception
          rationale: "Asserts the ExceptionRecord opened on dead-letter (integration_event_id set, score 300)."

      - name: apply_rejected_request_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ChangeRequest.APPROVED_to_APPLIED
          - errors[ERR_REQUEST_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / apply_rejected_request_state_beats_temporal
          rationale: "Applies to a REJECTED request and asserts ERR_REQUEST_INVALID_STATE wins over the temporal violation."

  # ===========================================================================
  # Section 3 — Calculations (correct_result, input-set filtering, constants,
  # precision; variant divergence corners are §1.8-covered stubs)
  # ===========================================================================
  - section: calculations
    instances:
      - name: exception_priority_score_age_tier2_bonus
        claim_type: constants_applied
        grounds:
          - calculations.exception_priority_score
          - entities.ExceptionRecord.fields.priority_score
        distinguishing_aspect: |
          The age tiers apply the declared constants exactly: at age_days == 30
          the bonus is the AGE_TIER2_BONUS 150 (>= 30 branch), so a WARNING
          (base 100) on a CONFIDENTIAL field (mult 2) scores
          min(1000, 100*2 + 150) == 350.
        test_recipe:
          setup:
            - "Worker W; CONFIDENTIAL salary field with WARNING RANGE rule [5000,20000]; applied change to 99999 opened an ExceptionRecord created at 2026-08-01"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Tier", worker_number: "W800", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "CONFIDENTIAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/data-quality-rules"
              payload: { target_field_id: "${df_id}", rule_type: "RANGE", severity: "WARNING", param_min: 5000, param_max: 20000 }
              as: DataSteward
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "appr-1", role_code: "CHANGE_APPROVER", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g1_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "99999", effective_date: "2026-09-01", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr_id: $.data.id }
            - call: "POST /hris/change-requests/${cr_id}/approve"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-1"
            - call: "POST /hris/change-requests/${cr_id}/apply"
              payload: {}
              as: HrisAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: SecurityAdmin
            - call: "GET /hris/exception-records"
              payload: { worker_id: "${w_id}" }
              as: DataSteward
              captures: { score: "$.data[0].priority_score" }
          assert:
            - "priority_score == 350   # 100 (WARNING base) * 2 (CONFIDENTIAL mult) + 150 (age_days == 30 tier-2 bonus), recomputed on the clock advance"

      - name: field_history_returns_null_when_no_row_covers
        claim_type: correct_result
        grounds:
          - calculations.field_value_as_of
        distinguishing_aspect: |
          field_value_as_of returns null when no non-VOIDED row covers
          as_of_date: 2025-06-01 (before the 2026-01-05 hire) yields null
          while 2026-06-01 (covered) yields \"10000\".
        test_recipe:
          setup:
            - "Worker W hired 2026-01-05 salary 10000; ACTIVE salary field df"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Nul", worker_number: "W801", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "GET /hris/workers/${w_id}/field-history"
              payload: { field_id: "${df_id}", as_of_date: "2025-06-01", mode: "AS_IS" }
              as: DataSteward
              captures: { v_before: $.data.value }
            - call: "GET /hris/workers/${w_id}/field-history"
              payload: { field_id: "${df_id}", as_of_date: "2026-06-01", mode: "AS_IS" }
              as: DataSteward
              captures: { v_covered: $.data.value }
          assert:
            - "as_of 2025-06-01 (before hire, no covering row): value == null"
            - "as_of 2026-06-01 (covered by [2026-01-05, null)): value == \"10000\""

      - name: subtree_budgeted_capacity_excludes_closed_positions
        claim_type: input_set_filtering
        grounds:
          - calculations.subtree_headcount
          - entities.Position.fields.status
        distinguishing_aspect: |
          BUDGETED_CAPACITY sums headcount_budget only over ACTIVE positions:
          after the child (budget 4) is closed, the root rollup reads 10, not
          14.
        test_recipe:
          setup:
            - "Root position budget 10 with child budget 4; child CLOSED (empty subtree)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Root", department: "HQ", headcount_budget: 10 }
              as: HrisAnalyst
              captures: { p_root: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "Child", department: "ENG", parent_position_id: "${p_root}", headcount_budget: 4 }
              as: HrisAnalyst
              captures: { p_child: $.data.id }
            - call: "POST /hris/positions/${p_child}/close"
              payload: {}
              as: HrisAnalyst
          trigger:
            - call: "GET /hris/positions/${p_root}/subtree-metrics"
              payload: { mode: "BUDGETED_CAPACITY" }
              as: HrisAnalyst
              captures: { cap: $.data.headcount }
          assert:
            - "BUDGETED_CAPACITY headcount == 10   # CLOSED child contributes 0, not its budget 4"

      - name: subtree_filled_only_excludes_future_rows
        claim_type: input_set_filtering
        grounds:
          - calculations.subtree_headcount
          - entities.PositionAssignment.fields.row_status
        distinguishing_aspect: |
          FILLED_ONLY counts only rows whose interval covers the logical clock
          date (row_status ACTIVE): a worker whose assignment starts
          2026-09-01 (FUTURE at the default clock) is not counted, so the
          subtree reads 0 despite the worker existing.
        test_recipe:
          setup:
            - "Root + child positions; worker hired 2026-09-01 into the child (row FUTURE)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Root", department: "HQ", headcount_budget: 10 }
              as: HrisAnalyst
              captures: { p_root: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "Child", department: "ENG", parent_position_id: "${p_root}", headcount_budget: 4 }
              as: HrisAnalyst
              captures: { p_child: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Fut", worker_number: "W802", hire_date: "2026-09-01", initial_position_id: "${p_child}", initial_salary_cents: 10000 }
              as: HrisAnalyst
          trigger:
            - call: "GET /hris/positions/${p_root}/subtree-metrics"
              payload: { mode: "FILLED_ONLY" }
              as: HrisAnalyst
              captures: { filled: $.data.headcount }
          assert:
            - "FILLED_ONLY headcount == 0   # FUTURE row excluded: clock 2026-08-01 < effective_start_date 2026-09-01"

      - name: batch_absolute_salary_delta_and_null_non_salary_delta
        claim_type: correct_result
        grounds:
          - calculations.batch_total_delta_cents
          - entities.BatchLine.fields.resolved_delta_cents
        distinguishing_aspect: |
          The absolute-value branch of the delta rule resolves an integer
          parse: a salary line \"12000\" against prior 10000 yields
          resolved_delta_cents 2000; the non-salary (location) line keeps
          resolved_delta_cents null; batch total_delta_cents sums only salary
          lines == 2000.
        test_recipe:
          setup:
            - "Worker W salary 10000 location NY; INTERNAL salary and location fields ACTIVE; batch with line1 (salary \"12000\" @2026-09-01) and line2 (location \"SF\" @2026-10-01), VALIDATED and SCHEDULED"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Abs", worker_number: "W803", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000, initial_location_code: "NY" }
              as: HrisAnalyst
              captures: { w_id: $.data.id }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "comp" }
              as: DataSteward
              captures: { df_sal: $.data.id }
            - call: "POST /hris/data-fields/${df_sal}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.location_code", display_name: "Location", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "people" }
              as: DataSteward
              captures: { df_loc: $.data.id }
            - call: "POST /hris/data-fields/${df_loc}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/mass-change-batches"
              payload: { name: "abs-delta" }
              as: HrisAnalyst
              captures: { b_id: $.data.id }
            - call: "POST /hris/mass-change-batches/${b_id}/lines"
              payload: { line_index: 1, target_worker_id: "${w_id}", target_field_id: "${df_sal}", new_value: "12000", effective_date: "2026-09-01" }
              as: HrisAnalyst
            - call: "POST /hris/mass-change-batches/${b_id}/lines"
              payload: { line_index: 2, target_worker_id: "${w_id}", target_field_id: "${df_loc}", new_value: "SF", effective_date: "2026-10-01" }
              as: HrisAnalyst
            - call: "GET /hris/mass-change-batches/${b_id}"
              payload: {}
              as: HrisAnalyst
              captures: { b_v: $.data.version }
            - call: "POST /hris/mass-change-batches/${b_id}/submit"
              payload: { expected_batch_version: "${b_v}" }
              as: HrisAnalyst
            - call: "POST /hris/mass-change-batches/${b_id}/schedule"
              payload: { scheduled_effective_date: "2026-08-15" }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/mass-change-batches/${b_id}/execute"
              payload: {}
              as: HrisAnalyst
              captures: { b_status: $.data.status, b_delta: $.data.total_delta_cents }
            - call: "GET /hris/batch-lines"
              payload: { batch_id: "${b_id}" }
              as: HrisAnalyst
              captures: { ln1_delta: "$.data[0].resolved_delta_cents", ln2_delta: "$.data[1].resolved_delta_cents" }
          assert:
            - "batch status == \"COMPLETED\""
            - "line1 (salary absolute) resolved_delta_cents == 2000   # 12000 - 10000"
            - "line2 (location, non-salary) resolved_delta_cents == null"
            - "batch total_delta_cents == 2000   # sum over APPLIED salary lines only"

      # --- §1.8-covered calculation corners (stubs) ---
      - name: field_history_as_is_as_was_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.field_value_as_of
        excluded_because:
          difficulty_instance: dual_variant_calc / corrected_salary_as_is_vs_as_was
          rationale: "Asserts AS_IS == \"9500\" vs AS_WAS == \"10000\" on the same (worker, field, date)."

      - name: subtree_headcount_two_modes_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.subtree_headcount
        excluded_because:
          difficulty_instance: dual_variant_calc / subtree_headcount_filled_vs_budgeted
          rationale: "Asserts FILLED_ONLY == 1 vs BUDGETED_CAPACITY == 14 on the same subtree."

      - name: batch_salary_percent_lines_round_per_line
        claim_type: precision
        grounds:
          - calculations.batch_total_delta_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / batch_comp_adjust_per_line_rounding
          rationale: "Pins the round-per-line-then-sum order: two 10010-cent salaries at +2.5% give total_delta_cents == 500, not 501."

  # ===========================================================================
  # Section 4 — Validations (violation->error, priority ordering, cross-entity)
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_user_id_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: |
          Priority 1: an empty X-User-ID header fails every endpoint,
          including read-only GETs, with
          ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role or
          existence checks run.
        test_recipe:
          setup:
            - "DB non-empty (one position exists)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
          trigger:
            - call: "GET /hris/workers"
              payload: {}
              as: HrisAnalyst
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"

      - name: auth_denial_beats_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          Authorization (priority 2) precedes existence (priority 3): a
          HrisAnalyst activating a non-existent DataField id receives
          ERR_INSUFFICIENT_PERMISSIONS (403), not ERR_DATA_FIELD_NOT_FOUND.
        test_recipe:
          setup:
            - "One DataField exists (created by DataSteward)"
          setup_api_calls:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.pay_grade", display_name: "Grade", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", owner_team: "people" }
              as: DataSteward
          trigger:
            - call: "POST /hris/data-fields/00000000-0000-0000-0000-000000000000/activate"
              payload: {}
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403), not a 404 — role check outranks path existence"

      - name: stale_batch_version_beats_not_draft_state
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - concurrency_rules[batch-submit-stale-batch]
        distinguishing_aspect: |
          OCC (priority 5) precedes the state precondition (priority 6):
          re-submitting a VALIDATED batch with the pre-submit version fails
          ERR_STALE_BATCH_VERSION (412), not ERR_BATCH_NOT_DRAFT (409).
        test_recipe:
          setup:
            - "Worker W; location field ACTIVE; batch with one line submitted to VALIDATED (version advanced past the captured one)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Occ", worker_number: "W810", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.location_code", display_name: "Location", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "people" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/mass-change-batches"
              payload: { name: "prio" }
              as: HrisAnalyst
              captures: { b_id: $.data.id }
            - call: "POST /hris/mass-change-batches/${b_id}/lines"
              payload: { line_index: 1, target_worker_id: "${w_id}", target_field_id: "${df_id}", new_value: "SF", effective_date: "2026-09-01" }
              as: HrisAnalyst
            - call: "GET /hris/mass-change-batches/${b_id}"
              payload: {}
              as: HrisAnalyst
              captures: { b_v: $.data.version }
            - call: "POST /hris/mass-change-batches/${b_id}/submit"
              payload: { expected_batch_version: "${b_v}" }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/mass-change-batches/${b_id}/submit"
              payload: { expected_batch_version: "${b_v}" }
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_BATCH_VERSION (412) — the OCC check fires before the DRAFT-state check"

      - name: create_position_under_closed_parent_rejected
        claim_type: cross_entity_validation
        grounds:
          - entities.Position.fields.parent_position_id
          - errors[ERR_POSITION_NOT_ACTIVE]
        distinguishing_aspect: |
          Position creation validates the referenced parent's state: a new
          position whose parent_position_id points at a CLOSED position is
          rejected with ERR_POSITION_NOT_ACTIVE (409).
        test_recipe:
          setup:
            - "Position P created then CLOSED (empty subtree)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Parent", department: "ENG", headcount_budget: 3 }
              as: HrisAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /hris/positions/${p_id}/close"
              payload: {}
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/positions"
              payload: { title: "Child", department: "ENG", parent_position_id: "${p_id}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POSITION_NOT_ACTIVE (409)"

      - name: hierarchy_cycle_rejected_on_apply
        claim_type: violation_to_error
        grounds:
          - state_machines.ChangeRequest.APPROVED_to_APPLIED
          - validations[priority=9]
          - errors[ERR_HIERARCHY_CYCLE]
        distinguishing_aspect: |
          A POSITION_HIERARCHY change moving root A under its own descendant B
          passes creation but fails apply with ERR_HIERARCHY_CYCLE (409) — the
          new parent is inside the moved subtree.
        test_recipe:
          setup:
            - "Positions A (root) and B (child of A); ACTIVE field position.parent_position_id; appr-1 provisioned; CR moving A under B APPROVED"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "A", department: "HQ", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pa_id: $.data.id, pa_v: $.data.version }
            - call: "POST /hris/positions"
              payload: { title: "B", department: "ENG", parent_position_id: "${pa_id}", headcount_budget: 3 }
              as: HrisAnalyst
              captures: { pb_id: $.data.id }
            - call: "POST /hris/data-fields"
              payload: { field_key: "position.parent_position_id", display_name: "Reports To", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "people" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "appr-1", role_code: "CHANGE_APPROVER", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g1_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
            - call: "POST /hris/positions/${pa_id}/change-requests"
              payload: { target_type: "POSITION_HIERARCHY", target_field_id: "${df_id}", new_value: "${pb_id}", effective_date: "2026-09-01", expected_position_version: "${pa_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr_id: $.data.id }
            - call: "POST /hris/change-requests/${cr_id}/approve"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-1"
          trigger:
            - call: "POST /hris/change-requests/${cr_id}/apply"
              payload: {}
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HIERARCHY_CYCLE (409)"

      - name: hierarchy_depth_limit_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_HIERARCHY_DEPTH_EXCEEDED]
        distinguishing_aspect: |
          The reporting tree caps at depth 10: positions P1..P10 chain
          legally, but creating P11 under P10 would produce depth 11 and fails
          ERR_HIERARCHY_DEPTH_EXCEEDED (422).
        test_recipe:
          setup:
            - "A linear chain of 10 positions P1 (root) .. P10"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "P1", department: "HQ", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p1: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "P2", department: "HQ", parent_position_id: "${p1}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p2: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "P3", department: "HQ", parent_position_id: "${p2}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p3: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "P4", department: "HQ", parent_position_id: "${p3}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p4: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "P5", department: "HQ", parent_position_id: "${p4}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p5: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "P6", department: "HQ", parent_position_id: "${p5}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p6: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "P7", department: "HQ", parent_position_id: "${p6}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p7: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "P8", department: "HQ", parent_position_id: "${p7}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p8: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "P9", department: "HQ", parent_position_id: "${p8}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p9: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "P10", department: "HQ", parent_position_id: "${p9}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { p10: $.data.id }
          trigger:
            - call: "POST /hris/positions"
              payload: { title: "P11", department: "HQ", parent_position_id: "${p10}", headcount_budget: 1 }
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HIERARCHY_DEPTH_EXCEEDED (422)"

  # ===========================================================================
  # Section 5 — Endpoints (list pagination, response envelope shape)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_workers_pagination_envelope
        claim_type: listing
        grounds:
          - entities.Worker
        distinguishing_aspect: |
          List endpoints honor the fixed envelope pagination contract: with 3
          workers, limit=2&offset=0 returns exactly 2 rows with total_count 3
          and has_more true; offset=2 returns the last row with has_more
          false; response_type is "array".
        test_recipe:
          setup:
            - "Position P; workers W901, W902, W903 hired into P"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 9 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "P1", worker_number: "W901", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
            - call: "POST /hris/workers"
              payload: { legal_name: "P2", worker_number: "W902", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
            - call: "POST /hris/workers"
              payload: { legal_name: "P3", worker_number: "W903", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
          trigger:
            - call: "GET /hris/workers"
              payload: { limit: 2, offset: 0 }
              as: HrisAnalyst
              captures: { page1: $.data }
            - call: "GET /hris/workers"
              payload: { limit: 2, offset: 2 }
              as: HrisAnalyst
              captures: { page2: $.data }
          assert:
            - "page 1 (limit=2, offset=0): exactly 2 rows, total_count == 3, has_more == true, response_type == \"array\""
            - "page 2 (limit=2, offset=2): exactly 1 row, total_count == 3, has_more == false"

      - name: get_position_returns_envelope_wrapped_object
        claim_type: retrieval
        grounds:
          - entities.Position
        distinguishing_aspect: |
          Every success response uses the fixed envelope: GET
          /hris/positions/{id} returns meta.api_request_id and
          meta.api_request_timestamp, response_type == "object", and data.id
          equal to the requested id.
        test_recipe:
          setup:
            - "Position P exists"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Root", department: "HQ", headcount_budget: 3 }
              as: HrisAnalyst
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /hris/positions/${p_id}"
              payload: {}
              as: HrisAnalyst
              captures: { got_id: $.data.id, got_status: $.data.status }
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == \"object\""
            - "data.id == ${p_id} and data.status == \"ACTIVE\""

  # ===========================================================================
  # Section 6 — Errors (every §1.6 error triggerable; error envelope shape)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_catalog_not_found_and_error_envelope
        claim_type: violation_to_error
        grounds:
          - errors[ERR_POSITION_NOT_FOUND]
          - errors[ERR_WORKER_NOT_FOUND]
          - errors[ERR_DATA_FIELD_NOT_FOUND]
          - errors[ERR_CHANGE_REQUEST_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - errors[ERR_BATCH_LINE_NOT_FOUND]
          - errors[ERR_INTEGRATION_EVENT_NOT_FOUND]
          - errors[ERR_DQ_RULE_NOT_FOUND]
          - errors[ERR_EXCEPTION_NOT_FOUND]
          - errors[ERR_GRANT_NOT_FOUND]
          - errors[ERR_AUDIT_ENTRY_NOT_FOUND]
        distinguishing_aspect: |
          Every resource-addressed endpoint maps an unknown id (path or
          action target) to its domain-specific 404 error_id, and each error
          response carries the fixed error envelope (response_type "error",
          data.error_id, data.message).
        test_recipe:
          setup:
            - "DB non-empty (one position exists) so 404s are not empty-DB artifacts"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
          trigger:
            - call: "GET /hris/positions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HrisAnalyst
              captures: { e1: $.data.error_id }
            - call: "GET /hris/workers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HrisAnalyst
              captures: { e2: $.data.error_id }
            - call: "GET /hris/data-fields/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DataSteward
              captures: { e3: $.data.error_id }
            - call: "GET /hris/change-requests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HrisAnalyst
              captures: { e4: $.data.error_id }
            - call: "GET /hris/mass-change-batches/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HrisAnalyst
              captures: { e5: $.data.error_id }
            - call: "GET /hris/batch-lines/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HrisAnalyst
              captures: { e6: $.data.error_id }
            - call: "GET /hris/integration-events/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IntegrationOperator
              captures: { e7: $.data.error_id }
            - call: "PATCH /hris/data-quality-rules/00000000-0000-0000-0000-000000000000"
              payload: { status: "DISABLED" }
              as: DataSteward
              captures: { e8: $.data.error_id }
            - call: "POST /hris/exception-records/00000000-0000-0000-0000-000000000000/resolve"
              payload: { resolution_note: "x" }
              as: DataSteward
              captures: { e9: $.data.error_id }
            - call: "POST /hris/security-role-assignments/00000000-0000-0000-0000-000000000000/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
              captures: { e10: $.data.error_id }
            - call: "GET /hris/audit-entries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DataSteward
              captures: { e11: $.data.error_id }
            - call: "POST /hris/workers/00000000-0000-0000-0000-000000000000/terminate"
              payload: { termination_date: "2026-08-01" }
              as: HrisAnalyst
              captures: { e12: $.data.error_id }
          assert:
            - "e1 == ERR_POSITION_NOT_FOUND (404)"
            - "e2 == ERR_WORKER_NOT_FOUND (404)"
            - "e3 == ERR_DATA_FIELD_NOT_FOUND (404)"
            - "e4 == ERR_CHANGE_REQUEST_NOT_FOUND (404)"
            - "e5 == ERR_BATCH_NOT_FOUND (404)"
            - "e6 == ERR_BATCH_LINE_NOT_FOUND (404)"
            - "e7 == ERR_INTEGRATION_EVENT_NOT_FOUND (404)"
            - "e8 == ERR_DQ_RULE_NOT_FOUND (404)"
            - "e9 == ERR_EXCEPTION_NOT_FOUND (404)"
            - "e10 == ERR_GRANT_NOT_FOUND (404)"
            - "e11 == ERR_AUDIT_ENTRY_NOT_FOUND (404)"
            - "e12 == ERR_WORKER_NOT_FOUND (404, path-id form)"
            - "every one of these responses has response_type == \"error\" and a non-empty data.message"

  # ===========================================================================
  # Section 7 — RBAC (exclusive-operation denials, segregation of duties)
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_analyst_cannot_create_data_field
        claim_type: rbac_denied
        grounds:
          - roles[DataSteward]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          POST /hris/data-fields is DataSteward-exclusive: the same
          well-formed payload under X-User-Role HrisAnalyst is rejected with
          ERR_INSUFFICIENT_PERMISSIONS (403).
        test_recipe:
          setup:
            - "DB non-empty (one position exists)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.pay_grade", display_name: "Grade", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", owner_team: "people" }
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: rbac_steward_cannot_create_worker
        claim_type: rbac_denied
        grounds:
          - roles[HrisAnalyst]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          POST /hris/workers is HrisAnalyst-exclusive: DataSteward is rejected
          with ERR_INSUFFICIENT_PERMISSIONS even with a valid
          initial_position_id.
        test_recipe:
          setup:
            - "Position P ACTIVE"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
          trigger:
            - call: "POST /hris/workers"
              payload: { legal_name: "Deny", worker_number: "W910", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: rbac_approver_cannot_apply_change
        claim_type: rbac_denied
        grounds:
          - roles[ChangeApprover]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          Apply is HrisAnalyst-exclusive and the role check (priority 2) fires
          before existence (priority 3): ChangeApprover calling apply — even
          on a non-existent request id — gets ERR_INSUFFICIENT_PERMISSIONS,
          never the 404.
        test_recipe:
          setup:
            - "DB non-empty (one position exists)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/change-requests/00000000-0000-0000-0000-000000000000/apply"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: rbac_operator_cannot_resolve_exception
        claim_type: rbac_denied
        grounds:
          - roles[IntegrationOperator]
          - roles[DataSteward]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          Exception resolve is DataSteward-exclusive: IntegrationOperator is
          rejected with ERR_INSUFFICIENT_PERMISSIONS (403) before any
          existence check.
        test_recipe:
          setup:
            - "DB non-empty (one position exists)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/exception-records/00000000-0000-0000-0000-000000000000/resolve"
              payload: { resolution_note: "x" }
              as: IntegrationOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: rbac_security_admin_cannot_create_batch
        claim_type: rbac_denied
        grounds:
          - roles[SecurityAdmin]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          Mass-change batch writes are HrisAnalyst-exclusive: SecurityAdmin
          (despite operating the clock and grants) is rejected with
          ERR_INSUFFICIENT_PERMISSIONS on POST /hris/mass-change-batches.
        test_recipe:
          setup:
            - "DB non-empty (one position exists)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/mass-change-batches"
              payload: { name: "denied" }
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: rbac_analyst_cannot_set_clock
        claim_type: rbac_denied
        grounds:
          - roles[SecurityAdmin]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          The logical-clock test-driving endpoint is SecurityAdmin-exclusive:
          HrisAnalyst calling POST /_clock/set_current_utc is rejected with
          ERR_INSUFFICIENT_PERMISSIONS and the clock stays at its default.
        test_recipe:
          setup:
            - "DB non-empty (one position exists)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: sod_conflicting_grant_pair_rejected
        claim_type: segregation_of_duties
        grounds:
          - state_machines.SecurityRoleAssignment.REQUESTED_to_APPROVED
          - validations[priority=7]
          - errors[ERR_SOD_CONFLICT]
        distinguishing_aspect: |
          The SoD matrix forbids one user holding both roles of
          {(HRIS_ANALYST,CHANGE_APPROVER),(DATA_STEWARD,CHANGE_APPROVER)}:
          op-20 already PROVISIONED as HRIS_ANALYST cannot be approved for
          CHANGE_APPROVER — ERR_SOD_CONFLICT (409).
        test_recipe:
          setup:
            - "op-20 holds PROVISIONED HRIS_ANALYST grant G1; G2 (op-20, CHANGE_APPROVER) REQUESTED"
          setup_api_calls:
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "op-20", role_code: "HRIS_ANALYST", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g1_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-2"
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "op-20", role_code: "CHANGE_APPROVER", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g2_id: $.data.id }
          trigger:
            - call: "POST /hris/security-role-assignments/${g2_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SOD_CONFLICT (409)"

      - name: grant_self_approval_rejected
        claim_type: segregation_of_duties
        grounds:
          - state_machines.SecurityRoleAssignment.REQUESTED_to_APPROVED
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / grant_approve_self_approval_beats_window_overlap
          rationale: "Asserts ERR_SELF_APPROVAL_FORBIDDEN when the approving SecurityAdmin is the grant's user_id (and that it outranks the window-overlap error)."

  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers (optimistic concurrency)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_worker_version_rejected_on_change_create
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[change-create-stale-worker]
          - errors[ERR_STALE_WORKER_VERSION]
        distinguishing_aspect: |
          OCC on Worker.version: the first create with the observed version
          succeeds and bumps the version to 2; a second create still carrying
          the original expected_worker_version is rejected with
          ERR_STALE_WORKER_VERSION (412).
        test_recipe:
          setup:
            - "Worker W (version 1 at creation); salary field ACTIVE; CR1 created with the observed version (version now 2)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Occ", worker_number: "W920", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "12000", effective_date: "2026-09-01", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr1_id: $.data.id }
            - call: "GET /hris/workers/${w_id}"
              payload: {}
              as: HrisAnalyst
              captures: { w_v_after: $.data.version }
          trigger:
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "13000", effective_date: "2026-10-01", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_WORKER_VERSION (412)"
            - "Worker.version == 2 after the first create (version increments on every write; w_v had been 1)"

      - name: stale_position_version_rejected_on_position_change_create
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[position-change-stale-position]
          - errors[ERR_STALE_POSITION_VERSION]
        distinguishing_aspect: |
          OCC on Position.version: after a first position change request
          advances the version, a second create with the stale
          expected_position_version is rejected with
          ERR_STALE_POSITION_VERSION (412).
        test_recipe:
          setup:
            - "Position P (version 1); ACTIVE field position.title; CR1 created with the observed version (version now 2)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Engineer", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "position.title", display_name: "Position Title", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "people" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/positions/${p_id}/change-requests"
              payload: { target_type: "POSITION_FIELD", target_field_id: "${df_id}", new_value: "Senior Engineer", effective_date: "2026-09-01", expected_position_version: "${p_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr1_id: $.data.id }
          trigger:
            - call: "POST /hris/positions/${p_id}/change-requests"
              payload: { target_type: "POSITION_FIELD", target_field_id: "${df_id}", new_value: "Staff Engineer", effective_date: "2026-10-01", expected_position_version: "${p_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_POSITION_VERSION (412)"

      - name: stale_batch_version_rejected_on_submit
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[batch-submit-stale-batch]
          - errors[ERR_STALE_BATCH_VERSION]
        distinguishing_aspect: |
          OCC on MassChangeBatch.version: adding a line after the batch was
          read advances the version, so submit carrying the creation-time
          expected_batch_version is rejected with ERR_STALE_BATCH_VERSION
          (412) even though the batch is still DRAFT.
        test_recipe:
          setup:
            - "Worker W; location field ACTIVE; batch created (version captured at creation) then one line added (version advanced)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Occ", worker_number: "W921", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.location_code", display_name: "Location", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "people" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/mass-change-batches"
              payload: { name: "occ" }
              as: HrisAnalyst
              captures: { b_id: $.data.id, b_v0: $.data.version }
            - call: "POST /hris/mass-change-batches/${b_id}/lines"
              payload: { line_index: 1, target_worker_id: "${w_id}", target_field_id: "${df_id}", new_value: "SF", effective_date: "2026-09-01" }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/mass-change-batches/${b_id}/submit"
              payload: { expected_batch_version: "${b_v0}" }
              as: HrisAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_BATCH_VERSION (412)   # current version is 2 after the line add; submitted version is the stale creation-time 1"

  # ===========================================================================
  # Section 9 — Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: writes_visible_immediately_in_response
        claim_type: immediate_consistency
        grounds:
          - entities.Position.fields.status
        distinguishing_aspect: |
          consistency_model is immediate: the create response itself carries
          the post-write state (status ACTIVE, version 1) and an immediate
          re-read returns identical values — no lag, no reconciliation window.
        test_recipe:
          setup:
            - "Empty DB (position list is empty)"
          setup_api_calls:
            - call: "GET /hris/positions"
              payload: {}
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/positions"
              payload: { title: "Root", department: "HQ", headcount_budget: 3 }
              as: HrisAnalyst
              captures: { p_id: $.data.id, p_status: $.data.status, p_ver: $.data.version }
            - call: "GET /hris/positions/${p_id}"
              payload: {}
              as: HrisAnalyst
              captures: { g_status: $.data.status, g_ver: $.data.version }
          assert:
            - "create (201) response data.status == \"ACTIVE\" and data.version == 1 in the same request"
            - "immediate GET returns status == \"ACTIVE\" and version == 1 (identical to the write response)"
