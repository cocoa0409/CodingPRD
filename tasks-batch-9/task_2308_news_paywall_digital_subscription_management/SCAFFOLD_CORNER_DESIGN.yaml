            - "Invoice.${inv_as}.base_line_cents == 499"
            - "Invoice.${inv_as}.price_source == INTRO"
            - "Subscription.${sub_as}.lifecycle_status == ACTIVE"
            - "Subscription.${sub_as}.paid_through_on == 2026-10-01"
            - "Subscription.${sub_as}.print_fulfillment_status == NOT_APPLICABLE"
            - "Subscription.${sub_as}.next_cycle_price_cents == 1499"
