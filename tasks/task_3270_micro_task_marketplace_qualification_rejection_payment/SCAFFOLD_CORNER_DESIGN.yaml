# ===========================================================================
  - section: calculations
    instances:

      - name: hit_funds_required_boundary_at_gross_pool_exactly_10000
        claim_type: Constants Applied
        grounds:
          - calculations.hit_funds_required
          - entities.HIT.fields.funds_required_cents
        distinguishing_aspect: "A 1000c x 10 HIT has gross_pool_cents exactly 10000 and pays commission 1500 at rate 0.15 (the tier lower bound is inclusive), giving funds_required_cents 11550 rather than the 0.20-rate 11550-plus-500 shape."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One requester registered."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
