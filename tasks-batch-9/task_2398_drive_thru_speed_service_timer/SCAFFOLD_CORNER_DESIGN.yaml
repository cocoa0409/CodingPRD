      - name: sm_daypart_profile_draft_to_active_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.DaypartProfile.DRAFT_to_ACTIVE
          - endpoints.POST_drive-thru_daypart-profiles_profileId_activate
        distinguishing_aspect: "Activating the store's only DRAFT profile returns 200 and moves profile_state to ACTIVE without touching the four segment targets or total_target_seconds."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store; one DRAFT LUNCH profile (25/95/40/75)."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
