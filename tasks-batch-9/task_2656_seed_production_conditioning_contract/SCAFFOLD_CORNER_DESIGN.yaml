        distinguishing_aspect: "An X-User-Role outside the six declared roles is an authentication failure, not an authorisation one: the call returns 401 ERR_UNAUTHENTICATED, and priority 1 pre-empts the 403 ERR_ROLE_NOT_PERMITTED that a recognised-but-wrong role would draw."
        test_recipe:
          setup:
            - "One grower exists so the target collection is real"
          setup_api_calls:
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
