        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      - call: POST /short-sale/cases/${case_id}/listings
        payload:
          list_price_cents: 25900000
          commission_pct: 0.06
          listed_at: '2026-08-05T00:00:00Z'
        as: ListingAgent
        as_user_id: la-200
        captures:
          listing_id: $.data.id
      - call: POST /short-sale/listings/${listing_id}/withdraw
        payload:
          ended_at: '2026-08-20T00:00:00Z'
        as: ListingAgent
        as_user_id: la-200
      trigger:
      - call: POST /short-sale/cases/${case_id}/listings
        payload:
          list_price_cents: 24900000
          commission_pct: 0.055
          listed_at: '2026-08-20T00:00:00Z'
