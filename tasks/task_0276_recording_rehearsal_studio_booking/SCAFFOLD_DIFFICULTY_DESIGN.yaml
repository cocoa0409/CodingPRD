              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T09:05:00Z" }
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/check-in"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /studio/bookings/${booking_id}/check-out"
              payload: { actual_end_at: "2026-07-10T12:40:00Z" }
              as: StudioManager
              captures: { ot: $.data.overtime_cents }
          assert:
            - "Booking.${booking_id}.overtime_cents == 0 (10 min == grace, overage_minutes == 0)"
            - "OvertimeRecord(booking ${booking_id}).overage_minutes == 0"
      - name: cancellation_tier_exact_boundary_is_full_refund
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Studio.fields.cancellation_tier_hours
        distinguishing_aspect: |
          Boundary on the hours-before-start metric reached through POST cancel:
          cancelling EXACTLY cancellation_tier_hours (48h) before start_at falls in the
          FULL-refund tier (>= is inclusive), refunding the full 14400 deposit; the
          inclusive comparison is a different metric and endpoint from instance 1's
          overtime-minutes boundary.
        test_recipe:
          setup:
            - "studio (deposit_pct 0.60, cancellation_tier_hours 48), room, client; CONFIRMED booking deposit 14400 paid; clock set to exactly start - 48h"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, cancellation_tier_hours: 48, late_cancel_fee_pct: 0.25 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-08T09:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studio/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "a REFUND Payment of amount_cents == 14400 exists for ${booking_id} (exactly 48h before start is the inclusive full-refund tier)"
            - "Booking.${booking_id}.settlement_status == REFUNDED"

  # =================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_depends_on_room_occupancy_state
        grounds:
          - state_machines.Booking.HELD_to_CONFIRMED
          - validations[priority=9]
          - errors[ERR_ROOM_UNAVAILABLE]
        distinguishing_aspect: |
          Entity pair Booking->Room: a Booking's HELD->CONFIRMED transition is rejected
          when another CONFIRMED/IN_SESSION booking occupies the room's overlapping
          window (incl. turnaround). Booking validity depends on the Room's occupancy
          state.
        test_recipe:
          setup:
            - "studio, room, client; booking_a CONFIRMED 09:00->12:30; booking_b HELD 12:45->13:45 (inside the 30-min turnaround after booking_a), deposit paid"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000, turnaround_minutes: 30 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_a: $.data.id }
            - call: "POST /studio/bookings/${booking_a}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_a}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T12:45:00Z", end_at: "2026-07-10T13:45:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_b: $.data.id }
            - call: "POST /studio/bookings/${booking_b}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 3600 }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/bookings/${booking_b}/confirm"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROOM_UNAVAILABLE (12:45 start is inside booking_a's end 12:30 + 30-min turnaround = 13:00)"
            - "HTTP status == 409"
            - "Booking.${booking_b}.schedule_status == HELD (unchanged)"
      - name: deliver_depends_on_booking_settlement_state
        grounds:
          - state_machines.SessionDelivery.DRAFT_to_DELIVERED
          - entities.Booking.fields.settlement_status
          - errors[ERR_SESSION_NOT_DELIVERABLE]
        distinguishing_aspect: |
          Entity pair SessionDelivery->Booking (different from Booking->Room): an
          engineer's first deliver is rejected with ERR_SESSION_NOT_DELIVERABLE while
          the booking is COMPLETED but settlement_status != SETTLED (balance still due).
          Delivery validity depends on the Booking's settlement state.
        test_recipe:
          setup:
            - "studio, room, engineer, client; booking COMPLETED via check-out but balance NOT yet paid (settlement_status == BALANCE_DUE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, overtime_grace_minutes: 10 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/engineers"
              payload: { studio_id: "${studio_id}", full_name: "Sam", tier: "STAFF", hourly_rate_cents: 8000 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/engineer-assignments"
              payload: { engineer_id: "${eng_id}" }
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T09:05:00Z" }
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/check-in"
              payload: {}
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/check-out"
              payload: { actual_end_at: "2026-07-10T12:30:00Z" }
              as: StudioManager
              captures: { settle: $.data.settlement_status }
          trigger:
            - call: "POST /studio/bookings/${booking_id}/delivery/deliver"
              payload: { file_manifest: [{ name: "mix.wav", size: 1000 }] }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_DELIVERABLE (booking COMPLETED but settlement_status == BALANCE_DUE, not SETTLED)"
            - "HTTP status == 409"

  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_with_turnaround_buffer
        grounds:
          - validations[priority=9]
          - entities.Room.fields.turnaround_minutes
          - errors[ERR_ROOM_UNAVAILABLE]
        distinguishing_aspect: |
          Room interval semantics: occupation is [start_at, end_at + turnaround_minutes),
          so a new booking starting within the turnaround buffer of an existing
          CONFIRMED booking collides even though the raw [start,end) windows are
          disjoint. Half-open interval WITH a trailing buffer; resource = Room.
        test_recipe:
          setup:
            - "studio, room (turnaround 30), client; booking_a CONFIRMED 09:00->12:30; booking_b HELD 12:45->13:45 with deposit paid"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000, turnaround_minutes: 30 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_a: $.data.id }
            - call: "POST /studio/bookings/${booking_a}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_a}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T12:45:00Z", end_at: "2026-07-10T13:45:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_b: $.data.id }
            - call: "POST /studio/bookings/${booking_b}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 3600 }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/bookings/${booking_b}/confirm"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROOM_UNAVAILABLE (12:45 < 12:30+30min buffer = 13:00)"
            - "a booking_b starting at 13:00 exactly would NOT collide (buffer end is exclusive)"
      - name: gear_capacity_aggregate_overlap_no_buffer
        grounds:
          - validations[priority=11]
          - calculations.gear_rental_charge
          - entities.GearItem.fields.total_units
          - errors[ERR_GEAR_UNAVAILABLE]
        distinguishing_aspect: |
          GearItem interval semantics: aggregate-capacity counting (sum of RESERVED
          units across overlapping booking windows must not exceed total_units), with
          NO turnaround buffer — purely the raw [start,end) overlap. A 2-unit item with
          2 units reserved on an overlapping booking rejects a 1-unit add. Different
          interval arithmetic (aggregate capacity, no buffer) and a different resource
          (GearItem) from the room-buffer instance.
        test_recipe:
          setup:
            - "studio, room, client, gear item (total_units 2, daily 1500); booking_a 09:00->12:30 with 2 units of the gear reserved; booking_b 10:00->11:00 (overlaps) created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/gear-items"
              payload: { studio_id: "${studio_id}", name: "Vintage Pre", total_units: 2, daily_rate_cents: 1500 }
              as: StudioManager
              captures: { gear_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_a: $.data.id, bka_v: $.data.version }
            - call: "POST /studio/bookings/${booking_a}/gear-rentals"
              payload: { gear_item_id: "${gear_id}", units: 2, expected_booking_version: "${bka_v}" }
              as: StudioManager
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T11:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_b: $.data.id, bkb_v: $.data.version }
          trigger:
            - call: "POST /studio/bookings/${booking_b}/gear-rentals"
              payload: { gear_item_id: "${gear_id}", units: 1, expected_booking_version: "${bkb_v}" }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GEAR_UNAVAILABLE (2 reserved + 1 requested > total_units 2 on overlapping window)"
            - "HTTP status == 409"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_conserves_money_paid
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.cancellation_refund
          - entities.Booking.fields.amount_paid_cents
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = money (cents). For a CONFIRMED cancel inside the partial
          tier, the invariant amount_paid_at_cancel == refund_amount + retained_fee
          holds exactly: 14400 (paid) == 8400 (refund) + 6000 (retained fee = round_half_up(24000*0.25)).
          No cent drifts.
        test_recipe:
          setup:
            - "studio (deposit_pct 0.60, late_cancel_fee_pct 0.25, cancellation_tier_hours 48), room, client; CONFIRMED booking deposit 14400 paid; clock at start - 1h (partial tier)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, cancellation_tier_hours: 48, late_cancel_fee_pct: 0.25 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T08:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studio/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "the REFUND Payment.amount_cents == 8400"
            - "invariant holds: amount_paid_at_cancel (14400) == refund (8400) + retained_fee (6000)"
            - "Booking.${booking_id}.settlement_status == REFUNDED"
      - name: gear_release_conserves_available_units
        grounds:
          - state_machines.GearRental.RESERVED_to_RELEASED
          - entities.GearItem.fields.total_units
          - validations[priority=11]
        distinguishing_aspect: |
          Conserved quantity = gear units (a different conserved quantity from money).
          Reserving 2 units then releasing the rental restores the GearItem's available
          units for the window to total_units (2): after release a fresh 2-unit reserve
          on an overlapping booking succeeds, proving available_units == total_units -
          sum(RESERVED units) returned to its pre-reservation value.
        test_recipe:
          setup:
            - "studio, room, client, gear (total_units 2); booking_a reserves 2 units, then releases them; booking_b (overlapping) tries to reserve 2 units"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/gear-items"
              payload: { studio_id: "${studio_id}", name: "Vintage Pre", total_units: 2, daily_rate_cents: 1500 }
              as: StudioManager
              captures: { gear_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_a: $.data.id, bka_v: $.data.version }
            - call: "POST /studio/bookings/${booking_a}/gear-rentals"
              payload: { gear_item_id: "${gear_id}", units: 2, expected_booking_version: "${bka_v}" }
              as: StudioManager
              captures: { rental_id: $.data.id }
            - call: "DELETE /studio/bookings/${booking_a}/gear-rentals/${rental_id}"
              payload: {}
              as: StudioManager
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T11:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_b: $.data.id, bkb_v: $.data.version }
          trigger:
            - call: "POST /studio/bookings/${booking_b}/gear-rentals"
              payload: { gear_item_id: "${gear_id}", units: 2, expected_booking_version: "${bkb_v}" }
              as: StudioManager
              captures: { rental2_id: $.data.id, st: $.data.status }
          assert:
            - "GearRental.${rental2_id}.status == RESERVED (the 2 released units were fully restored)"
            - "GearRental.${rental_id}.status == RELEASED"
            - "invariant holds: available_units for the window == total_units (2) - sum(RESERVED units) == 0 after the second reserve"
