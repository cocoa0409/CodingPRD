        grounds:
          - state_machines.RecallCampaign.campaign_status.FILED_to_INTERIM_NOTIFIED
          - state_machines.RecallCampaign.remedy_status.INTERIM_ONLY_to_REMEDY_RELEASED
          - entities.RecallCampaign.fields.campaign_status
          - entities.RecallCampaign.fields.remedy_status
