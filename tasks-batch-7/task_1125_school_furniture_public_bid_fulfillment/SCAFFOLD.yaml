# =============================================================================
# Task 1125: School Furniture & Public Bid Fulfillment — seed tables
# =============================================================================

scenario: |
  1125. School Furniture & Public Bid Fulfillment (school furniture contractor):
  bid specification & no-substitution rule, award notice & purchase-order intake,
  summer-window delivery & installation crews, uncrating/debris removal & classroom
  placement, damage & replacement within window, cooperative contract pricing,
  warranty & parts for years, back-order communication to district

domain_name: school-furniture-public-bid-fulfillment
api_prefix: /v1

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # public procurement: no-substitution, spec version pinning, audit trail
  secondary_archetype: temporal_windowing    # summer delivery window, replacement deadlines, warranty terms
  complexity_layers:
    - optimistic_concurrency                 # OCC on Award.version and POLine.version for supersede-creates
    - cascading_side_effects                 # damage→replacement→shipment→install-task→crew ledger chains
    - version_pinning_on_approval            # Award pins BidSpec.spec_version; PO lines validated against the pin
    - rate_threshold_triggers                # coop tier breakpoints, backorder-risk posture threshold, site capacity

  entity_topology: flat                      # peer entities with FK references; no nesting in URL paths (except OCC action on po-lines)
  state_machine_shape: cyclic                # BidSpec addendum loop, WarrantyClaim appeal loop, BackorderNotice ETA loop,
                                             # PurchaseOrder posture dimension ON_TRACK<->AT_RISK; DamageReport branching
  relationship_patterns:
    - one_to_many                            # District->SchoolSite, BidSpec->SpecLine, Award->PurchaseOrder->POLine
    - cross_aggregate                        # POLine->SpecLine & CoopPriceAgreement, WarrantyClaim->POLine, DamageReport->Shipment/InstallTask
  role_model: peer_roles                     # district-side vs contractor-side roles with entity-backed ownership
  consistency_model: immediate               # all side effects visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District display name" }
      - { name: annual_cap_cents, type: integer, source: input, description: "Fiscal-year commitment cap across all accepted POs (in cents)" }
      - { name: extended_warranty_enrolled, type: boolean, source: input, default: false, description: "Selects EXTENDED_PRORATED warranty coverage variant when true" }

  - name: SchoolSite
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; owning district" }
      - { name: name, type: string, source: input, description: "School/site name" }
      - { name: daily_crew_capacity, type: integer, source: input, description: "Max total crew_count of InstallTasks occupying any single date at this site (>= 1)" }
      - { name: address, type: string, source: input, description: "Street address", default: null }

  - name: BidSpec
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; issuing district" }
      - { name: title, type: string, source: input, description: "Bid specification title" }
      - { name: bid_due_date, type: string, source: input, description: "ISO date bids are due" }
      - { name: delivery_window_start, type: string, source: input, description: "ISO date; summer delivery window opens (inclusive)" }
      - { name: delivery_window_end, type: string, source: input, description: "ISO date; summer delivery window closes (inclusive)" }
      - { name: spec_version, type: integer, source: system, default: 1, description: "Content version; +1 on every publish from ADDENDUM_ISSUED" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ADDENDUM_ISSUED | CLOSED | AWARDED" }

  - name: SpecLine
    parent: null
    common_fields: true
    fields:
      - { name: bid_spec_id, type: string, source: input, description: "FK -> BidSpec.id; parent spec" }
      - { name: manufacturer, type: string, source: input, description: "Exact required manufacturer (no-substitution)" }
      - { name: model, type: string, source: input, description: "Exact required model (no-substitution)" }
      - { name: qty, type: integer, source: input, description: "Total quantity the district may order against this line (>= 1)" }
      - { name: max_unit_price_cents, type: integer, source: input, description: "Not-to-exceed unit price ceiling" }
      - { name: description, type: string, source: input, default: null, description: "Free-text line description" }
      - { name: remaining_qty, type: integer, source: computed, description: "qty minus summed ordered_qty of non-CANCELLED POLines referencing this line" }

  - name: CoopPriceAgreement
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cooperative contract name (e.g., state purchasing co-op)" }
      - { name: contract_year, type: integer, source: input, description: "Contract year the tier schedule applies to" }
      - { name: tier_table, type: array, source: input, description: "Array of { min_qty, unit_price_cents } sorted by min_qty ascending; tier applies to cumulative unit u when u >= min_qty" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE on creation" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: bid_spec_id, type: string, source: input, description: "FK -> BidSpec.id; awarded spec" }
      - { name: district_id, type: string, source: input, description: "FK -> District.id; awarding district (must equal spec's district)" }
      - { name: pricing_mode, type: enum, source: input, description: "COOP_TIERED | AWARD_FLAT" }
      - { name: coop_agreement_id, type: string, source: input, default: null, description: "FK -> CoopPriceAgreement.id; required iff pricing_mode == COOP_TIERED" }
      - { name: flat_unit_price_cents, type: integer, source: input, default: null, description: "Pinned flat unit price; required iff pricing_mode == AWARD_FLAT" }
      - { name: install_rate_cents, type: integer, source: input, description: "Per-unit installation labor rate used at PO closeout" }
      - { name: order_by_date, type: string, source: input, description: "ISO date; PO lines must be created on or before this date" }
      - { name: warranty_years, type: integer, source: input, description: "Base warranty term in years from POLine.installed_at" }
      - { name: extended_years, type: integer, source: input, default: 0, description: "Extended prorated term in years beyond base term" }
      - { name: awarded_spec_version, type: integer, source: system, description: "Pinned BidSpec.spec_version at award creation; re-pinned by issue-amendment" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACCEPTED" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; award this PO draws down" }
      - { name: po_number, type: string, source: input, description: "District-assigned PO number; unique per (award.district_id, fiscal_year) among non-CANCELLED POs" }
      - { name: fiscal_year, type: integer, source: input, description: "District fiscal year for cap accounting" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACCEPTED | IN_FULFILLMENT | FULFILLED | CLOSED | CANCELLED" }
      - { name: posture, type: enum, source: computed, default: "ON_TRACK", description: "ON_TRACK | AT_RISK; derived from open_backorder_count threshold" }
      - { name: open_backorder_count, type: integer, source: computed, default: 0, description: "Count of linked POLines in BACKORDERED status" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents over non-CANCELLED POLines" }
      - { name: closeout_total_cents, type: integer, source: computed, default: null, description: "Install closeout total computed at close; null until CLOSED" }

  - name: POLine
    parent: null
    common_fields: true
    fields:
      - { name: purchase_order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; owning PO" }
      - { name: spec_line_id, type: string, source: input, description: "FK -> SpecLine.id; pinned spec line being ordered" }
      - { name: coop_agreement_id, type: string, source: system, default: null, description: "FK -> CoopPriceAgreement.id; copied from award at creation (null for AWARD_FLAT)" }
      - { name: ordered_qty, type: integer, source: input, description: "Quantity ordered (>= 1)" }
      - { name: computed_unit_price_cents, type: integer, source: computed, description: "Unit price from pricing variant (client input ignored)" }
      - { name: line_total_cents, type: integer, source: computed, description: "Extended price from pricing variant" }
      - { name: delivered_qty, type: integer, source: system, default: 0, description: "Cumulative delivered units" }
      - { name: installed_at, type: datetime, source: system, default: null, description: "Clock timestamp when line reached VERIFIED; warranty anchor" }
      - { name: status, type: enum, source: system, description: "PENDING | ORDERED | PARTIALLY_DELIVERED | DELIVERED | BACKORDERED | VERIFIED | CANCELLED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: purchase_order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; PO being fulfilled" }
      - { name: school_site_id, type: string, source: input, description: "FK -> SchoolSite.id; delivery destination" }
      - { name: kind, type: enum, source: input, default: "STANDARD", description: "STANDARD | REPLACEMENT" }
      - { name: damage_report_id, type: string, source: system, default: null, description: "FK -> DamageReport.id; set when cascade-created by approve-replacement" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date of planned delivery" }
      - { name: lines, type: array, source: input, description: "Array of { po_line_id, qty } to ship; on delivery each entry gains delivered_qty/manufacturer/model" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DELIVERED | COMPLETED" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew name" }
      - { name: booked_days, type: integer, source: computed, default: 0, description: "Sum of crew_days over InstallTasks in SCHEDULED or IN_PROGRESS assigned to this crew" }

  - name: InstallTask
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; shipment whose goods are installed" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; assigned crew" }
      - { name: school_site_id, type: string, source: input, description: "FK -> SchoolSite.id; must equal shipment's site" }
      - { name: room_label, type: string, source: input, description: "Classroom placement label" }
      - { name: start_date, type: string, source: input, description: "ISO date; occupation begins (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO date; occupation ends (EXCLUSIVE — half-open interval [start_date, end_date))" }
      - { name: crew_count, type: integer, source: input, description: "Number of crew members on site each occupied date (>= 1)" }
      - { name: crew_days, type: integer, source: computed, description: "crew_count * number of dates in [start_date, end_date)" }
      - { name: completed_checklist, type: array, source: system, default: [], description: "Subset of [UNCRATED, DEBRIS_REMOVED, PLACED] recorded at completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: DamageReport
    parent: null
    common_fields: true
    fields:
      - { name: po_line_id, type: string, source: input, description: "FK -> POLine.id; line whose units are damaged" }
      - { name: shipment_id, type: string, source: input, default: null, description: "FK -> Shipment.id; required when discovered_during == DELIVERY" }
      - { name: install_task_id, type: string, source: input, default: null, description: "FK -> InstallTask.id; required when discovered_during == INSTALL" }
      - { name: damaged_qty, type: integer, source: input, description: "Units damaged (>= 1, <= po_line.delivered_qty)" }
      - { name: discovered_during, type: enum, source: input, description: "DELIVERY | INSTALL" }
      - { name: fault_type, type: enum, source: input, description: "TRANSIT | HANDLING | DEFECT" }
      - { name: reported_date, type: string, source: system, description: "ISO date from logical clock at filing" }
      - { name: replacement_deadline, type: string, source: computed, description: "min(window_end + 14d, reported_date + 21d)" }
      - { name: status, type: enum, source: system, description: "OPEN | REPLACEMENT_ORDERED | RESOLVED | CLOSED_NO_FAULT" }

  - name: BackorderNotice
    parent: null
    common_fields: true
    fields:
      - { name: po_line_id, type: string, source: system, description: "FK -> POLine.id; backordered line" }
      - { name: status, type: enum, source: system, description: "OPEN | ETA_UPDATED | SUPERSEDED | RESOLVED" }
      - { name: current_eta_date, type: string, source: system, description: "Latest ETA communicated to the district" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of ETA updates applied" }
      - { name: communicated_at, type: datetime, source: system, description: "Clock timestamp of last district communication" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: po_line_id, type: string, source: input, description: "FK -> POLine.id; installed line under claim" }
      - { name: parts_cost_cents, type: integer, source: input, description: "Claimed parts cost (>= 1)" }
      - { name: description, type: string, source: input, description: "Failure description" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | APPEALED | CLOSED" }
      - { name: filed_date, type: string, source: system, description: "ISO date from logical clock at filing; warranty term anchor" }
      - { name: coverage_cents, type: integer, source: computed, default: null, description: "Covered amount computed at approve per coverage variant" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed (max 1)" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Reason recorded at deny" }
      - { name: parts_order_ref, type: string, source: system, default: null, description: "System reference set when parts ordered" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BidSpec
    initial_state: DRAFT
    terminal_states: [AWARDED]
    note: "Cyclic addendum loop: PUBLISHED -> ADDENDUM_ISSUED -> PUBLISHED may repeat; each re-publish increments spec_version. Post-award amendments enter via AWARDED -> ADDENDUM_ISSUED."
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /v1/bid-specs/{id}/publish"
        actor: DistrictBuyer
        preconditions:
          - "Spec has at least one SpecLine (else ERR_INVALID_REQUEST)"
        side_effects:
          - "spec_version unchanged (remains 1 on first publish)"
      - from: PUBLISHED
        to: ADDENDUM_ISSUED
        trigger: "POST /v1/bid-specs/{id}/issue-addendum"
        actor: DistrictBuyer
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: ADDENDUM_ISSUED
        trigger: "POST /v1/bid-specs/{id}/issue-addendum"
        actor: DistrictBuyer
        preconditions: []
        side_effects: []
      - from: AWARDED
        to: ADDENDUM_ISSUED
        trigger: "POST /v1/bid-specs/{id}/issue-addendum"
        actor: DistrictBuyer
        preconditions: []
        side_effects: []
      - from: ADDENDUM_ISSUED
        to: PUBLISHED
        trigger: "POST /v1/bid-specs/{id}/publish"
        actor: DistrictBuyer
        preconditions: []
        side_effects:
          - "spec_version += 1 (content version bump; invalidates award pins until award amendment)"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /v1/bid-specs/{id}/close"
        actor: DistrictBuyer
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: AWARDED
        trigger: "system (side effect of POST /v1/awards creation)"
        actor: system
        preconditions: []
        side_effects:
          - "Award.awarded_spec_version pinned to this spec_version"

  - entity: Award
    initial_state: ISSUED
    terminal_states: []
    note: "No terminal state: awards persist for warranty servicing. Version pinning: PO line creation validates BidSpec.spec_version == Award.awarded_spec_version."
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /v1/awards/{id}/accept"
        actor: ContractManager
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: ACCEPTED
        trigger: "POST /v1/awards/{id}/issue-amendment (self-loop amendment)"
        actor: DistrictBuyer
        preconditions:
          - "expected_award_version == Award.version (OCC; else ERR_STALE_VERSION 412)"
        side_effects:
          - "awarded_spec_version := BidSpec.spec_version (re-pin to current content)"
          - "increments Award.version by 1"

  - entity: PurchaseOrder
    initial_state: RECEIVED
    terminal_states: [CLOSED, CANCELLED]
    note: "Parallel derived dimension: posture (ON_TRACK | AT_RISK) cycles independently of fulfillment status, recomputed by po_fulfillment_posture on every open_backorder_count change."
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /v1/purchase-orders/{id}/accept"
        actor: FulfillmentCoordinator
        preconditions:
          - "District fiscal cap: sum of total_cents over this district's ACCEPTED/IN_FULFILLMENT/FULFILLED/CLOSED POs in the same fiscal_year + this PO total_cents <= District.annual_cap_cents (else ERR_DISTRICT_FISCAL_CAP_EXCEEDED)"
        side_effects:
          - "All POLines on this PO: PENDING -> ORDERED"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /v1/purchase-orders/{id}/cancel"
        actor: DistrictBuyer
        preconditions: []
        side_effects:
          - "All POLines PENDING -> CANCELLED"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /v1/purchase-orders/{id}/cancel"
        actor: DistrictBuyer
        preconditions:
          - "No Shipment linked to this PO (else ERR_INVALID_STATE)"
        side_effects:
          - "POLines ORDERED|BACKORDERED -> CANCELLED (compensates spec-line drawdown)"
          - "Each cancelled BACKORDERED line resolves its open BackorderNotice (OPEN|ETA_UPDATED -> RESOLVED)"
          - "open_backorder_count recomputed; posture recomputed"
      - from: ACCEPTED
        to: IN_FULFILLMENT
        trigger: "system (first Shipment created for this PO)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_FULFILLMENT
        to: FULFILLED
        trigger: "system (all non-CANCELLED POLines reach VERIFIED; bubble-up on last line verification)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULFILLED
        to: CLOSED
        trigger: "POST /v1/purchase-orders/{id}/close"
        actor: FulfillmentCoordinator
        preconditions:
          - "PO must be FULFILLED (all non-CANCELLED POLines VERIFIED; enforced by the state guard)"
        side_effects:
          - "closeout_total_cents := install_closeout_total_cents calculation result"

  - entity: POLine
    initial_state: PENDING
    terminal_states: [VERIFIED, CANCELLED]
    note: "BACKORDERED is reachable from ORDERED and PARTIALLY_DELIVERED; delivery from BACKORDERED resumes straight to PARTIALLY_DELIVERED/DELIVERED."
    transitions:
      - from: PENDING
        to: ORDERED
        trigger: "system (PO accept)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ORDERED
        to: PARTIALLY_DELIVERED
        trigger: "system (POST /v1/shipments/{id}/mark-delivered with cumulative 0 < delivered_qty < ordered_qty)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ORDERED
        to: DELIVERED
        trigger: "system (mark-delivered completing ordered_qty)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_DELIVERED
        to: DELIVERED
        trigger: "system (mark-delivered completing ordered_qty)"
        actor: system
        preconditions: []
        side_effects:
          - "If line was previously BACKORDERED and an open notice exists: notice -> RESOLVED, open_backorder_count -= 1, posture recomputed"
      - from: ORDERED
        to: BACKORDERED
        trigger: "POST /v1/po-lines/{id}/declare-backorder"
        actor: FulfillmentCoordinator
        preconditions:
          - "ordered_qty - delivered_qty > 0 (undelivered remainder exists, else ERR_INVALID_STATE)"
          - "initial_eta_date > current clock date (else ERR_ETA_NOT_FORWARD)"
        side_effects:
          - "Creates BackorderNotice(status=OPEN, revision_count=0, current_eta_date=initial_eta_date) — link 1 of backorder cascade"
          - "BackorderNotice creation increments PurchaseOrder.open_backorder_count += 1 — link 2"
          - "open_backorder_count >= 2 recomputes PurchaseOrder.posture ON_TRACK -> AT_RISK — link 3"
      - from: PARTIALLY_DELIVERED
        to: BACKORDERED
        trigger: "POST /v1/po-lines/{id}/declare-backorder"
        actor: FulfillmentCoordinator
        preconditions:
          - "ordered_qty - delivered_qty > 0"
          - "initial_eta_date > current clock date"
        side_effects:
          - "Creates BackorderNotice(OPEN); open_backorder_count += 1; posture recomputed"
      - from: BACKORDERED
        to: PARTIALLY_DELIVERED
        trigger: "system (mark-delivered with cumulative delivered < ordered)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BACKORDERED
        to: DELIVERED
        trigger: "system (mark-delivered completing ordered_qty)"
        actor: system
        preconditions: []
        side_effects:
          - "Open BackorderNotice -> RESOLVED; open_backorder_count -= 1; posture recomputed (< 2 -> ON_TRACK)"
      - from: DELIVERED
        to: VERIFIED
        trigger: "system (InstallTask covering this line's shipment completes with PLACED recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "installed_at := logical clock timestamp (warranty anchor)"
          - "If all non-CANCELLED sibling lines VERIFIED: PurchaseOrder IN_FULFILLMENT -> FULFILLED (bubble-up)"
      - from: PENDING
        to: CANCELLED
        trigger: "system (PO cancel) OR POST /v1/po-lines/{id}/cancel"
        actor: system | DistrictBuyer
        preconditions: []
        side_effects:
          - "SpecLine.remaining_qty += ordered_qty (compensation)"
          - "PurchaseOrder.total_cents recomputed"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /v1/po-lines/{id}/cancel"
        actor: DistrictBuyer
        preconditions:
          - "delivered_qty == 0 (nothing delivered yet, else ERR_INVALID_STATE)"
        side_effects:
          - "SpecLine.remaining_qty += ordered_qty (compensating release of drawdown)"
          - "PurchaseOrder.total_cents recomputed"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /v1/po-lines/{id}/cancel"
        actor: DistrictBuyer
        preconditions:
          - "delivered_qty == 0"
        side_effects:
          - "SpecLine.remaining_qty += ordered_qty"
          - "Open BackorderNotice -> RESOLVED; open_backorder_count -= 1; posture recomputed"
          - "PurchaseOrder.total_cents recomputed"

  - entity: Shipment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /v1/shipments/{id}/mark-delivered"
        actor: FulfillmentCoordinator
        preconditions:
          - "Every delivery entry manufacturer/model exactly equals the pinned SpecLine manufacturer/model (no-substitution; else ERR_SUBSTITUTION_NOT_ALLOWED)"
          - "Per-line delivered_qty <= ordered_qty - POLine.delivered_qty (else ERR_DELIVERY_EXCEEDS_ORDERED)"
        side_effects:
          - "POLine.delivered_qty += delivered_qty per entry; POLine status transitions per its machine"
          - "Lines fully delivered from BACKORDERED: notice RESOLVED, count decremented, posture recomputed"
      - from: DELIVERED
        to: COMPLETED
        trigger: "system (all InstallTasks for this shipment COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InstallTask
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /v1/install-tasks/{id}/start"
        actor: CrewLead
        preconditions:
          - "Acting CrewLead's crew == task.crew_id (else ERR_SCOPE_VIOLATION)"
          - "Shipment.status == DELIVERED (goods on site; else ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /v1/install-tasks/{id}/complete"
        actor: CrewLead
        preconditions:
          - "Acting CrewLead's crew == task.crew_id (else ERR_SCOPE_VIOLATION)"
          - "uncrated && debris_removed && placed all true (else ERR_INSTALL_CHECKLIST_INCOMPLETE)"
        side_effects:
          - "completed_checklist := [UNCRATED, DEBRIS_REMOVED, PLACED]"
          - "Crew.booked_days -= crew_days (release; booked counts only SCHEDULED/IN_PROGRESS)"
          - "All POLines on the shipment with delivered_qty > 0: DELIVERED -> VERIFIED, installed_at := clock"
          - "If all InstallTasks for shipment COMPLETED: Shipment DELIVERED -> COMPLETED (bubble-up)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/install-tasks/{id}/unassign"
        actor: FulfillmentCoordinator
        preconditions: []
        side_effects:
          - "Crew.booked_days -= crew_days (compensating release of the assignment booking)"

  - entity: DamageReport
    initial_state: OPEN
    terminal_states: [RESOLVED, CLOSED_NO_FAULT]
    note: "Branching fork: OPEN -> REPLACEMENT_ORDERED (replacement path) or OPEN -> CLOSED_NO_FAULT (denial path)."
    transitions:
      - from: OPEN
        to: REPLACEMENT_ORDERED
        trigger: "POST /v1/damage-reports/{id}/approve-replacement"
        actor: ContractManager
        preconditions:
          - "scheduled_date <= replacement_deadline (else ERR_REPLACEMENT_WINDOW_MISSED)"
        side_effects:
          - "Link 1: creates Shipment(kind=REPLACEMENT, damage_report_id=this, status=SCHEDULED, scheduled_date, school_site_id from the damage report's shipment or install-task shipment, lines=[{po_line_id, qty=damaged_qty}])"
          - "Link 2: that Shipment creation itself creates InstallTask(status=SCHEDULED, crew_id, start_date, end_date, crew_count, room_label from request)"
          - "Link 3: that InstallTask creation debits Crew.booked_days += crew_days (ledger sync)"
      - from: REPLACEMENT_ORDERED
        to: RESOLVED
        trigger: "system (replacement shipment mark-delivered completes damaged_qty units)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED_NO_FAULT
        trigger: "POST /v1/damage-reports/{id}/close-no-fault"
        actor: ContractManager
        preconditions: []
        side_effects: []

  - entity: BackorderNotice
    initial_state: OPEN
    terminal_states: [RESOLVED, SUPERSEDED]
    note: "Cyclic ETA loop: OPEN -> ETA_UPDATED -> ETA_UPDATED ... each update increments revision_count and re-stamps communicated_at (back-order communication to district)."
    transitions:
      - from: OPEN
        to: ETA_UPDATED
        trigger: "POST /v1/backorder-notices/{id}/update-eta"
        actor: FulfillmentCoordinator
        preconditions:
          - "new_eta_date > current_eta_date AND new_eta_date > current clock date (else ERR_ETA_NOT_FORWARD)"
        side_effects:
          - "current_eta_date := new_eta_date; revision_count += 1; communicated_at := clock"
      - from: ETA_UPDATED
        to: ETA_UPDATED
        trigger: "POST /v1/backorder-notices/{id}/update-eta"
        actor: FulfillmentCoordinator
        preconditions:
          - "new_eta_date > current_eta_date AND new_eta_date > current clock date (else ERR_ETA_NOT_FORWARD)"
        side_effects:
          - "current_eta_date := new_eta_date; revision_count += 1; communicated_at := clock"
      - from: OPEN
        to: SUPERSEDED
        trigger: "system (POST /v1/po-lines/{id}/backorder-notices supersedes the line's current notice)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ETA_UPDATED
        to: SUPERSEDED
        trigger: "system (supersede-create on same line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RESOLVED
        trigger: "system (linked POLine fully delivered or cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ETA_UPDATED
        to: RESOLVED
        trigger: "system (linked POLine fully delivered or cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [CLOSED, DENIED]
    note: "Cyclic appeal loop: DENIED -> APPEALED -> UNDER_REVIEW permits exactly one appeal (appeal_count < 1). DENIED is terminal once appeal_count == 1."
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /v1/warranty-claims/{id}/review"
        actor: ServiceAgent
        preconditions: []
        side_effects: []
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /v1/warranty-claims/{id}/review"
        actor: ServiceAgent
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /v1/warranty-claims/{id}/approve"
        actor: ServiceAgent
        preconditions: []
        side_effects:
          - "coverage_cents := warranty_coverage_cents calculation result (variant selected by District.extended_warranty_enrolled)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /v1/warranty-claims/{id}/deny"
        actor: ServiceAgent
        preconditions: []
        side_effects:
          - "denial_reason := request value"
      - from: DENIED
        to: APPEALED
        trigger: "POST /v1/warranty-claims/{id}/appeal"
        actor: DistrictBuyer
        preconditions:
          - "appeal_count == 0 (at most one appeal; else ERR_INVALID_STATE)"
        side_effects:
          - "appeal_count := 1"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /v1/warranty-claims/{id}/order-parts"
        actor: ServiceAgent
        preconditions: []
        side_effects:
          - "parts_order_ref := system-generated reference; supports parts fulfillment for years after install"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: award-amendment-stale-award
    parent_entity: Award
    write_endpoint: "POST /v1/awards/{id}/issue-amendment"
    occ_field: "expected_award_version"
    description: |
      Creating an award amendment against an Award whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just amended the award (legitimately re-pinning the spec
      version under the amendment flow) and the current writer's view of the
      award is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: backorder-notice-supersede-stale-poline
    parent_entity: POLine
    write_endpoint: "POST /v1/po-lines/{id}/backorder-notices"
    occ_field: "expected_po_line_version"
    description: |
      Creating a revised BackorderNotice against a POLine whose version has
      advanced since the client last observed it is rejected. A successful create
      legitimately supersedes the line's current OPEN/ETA_UPDATED notice (which
      becomes SUPERSEDED), so a stale expected version means the client is
      superseding a notice it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: coop_tiered_unit_price
    trigger: "POST /v1/po-lines (POLine creation)"
    algorithm: tiered_pricing
    formula: |
      Variant COOP_TIERED (award.pricing_mode == COOP_TIERED):
        c = district_ytd_coop_volume(award.coop_agreement_id, award.district_id, po.fiscal_year, excluding this line)
        q = ordered_qty
        For unit index u in (c+1)..(c+q):
          price(u) = unit_price_cents of the tier row with the greatest min_qty such that u >= min_qty
        line_total_cents = sum(price(u))          # exact integer cents, no rounding
        computed_unit_price_cents = round_half_up(line_total_cents / q, 0)
      Variant AWARD_FLAT (award.pricing_mode == AWARD_FLAT):
        computed_unit_price_cents = award.flat_unit_price_cents
        line_total_cents = q * award.flat_unit_price_cents
      Both variants: if computed_unit_price_cents > spec_line.max_unit_price_cents -> ERR_AWARD_QTY_EXCEEDED is NOT used;
      price ceiling breach is rejected with ERR_INVALID_REQUEST at creation.
    input_set: "Non-CANCELLED POLines referencing awards of the same district and same coop agreement with po.fiscal_year == agreement.contract_year, ordered by POLine.created_at ASC"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; unit price round_half_up to whole cents"
    variants:
      - name: COOP_TIERED
        when: "award.pricing_mode == COOP_TIERED"
        difference: "Marginal per-unit pricing across the coop tier table keyed on cumulative district volume; identical qty yields a different (higher) total than AWARD_FLAT whenever the flat price sits below tier-1 or a tier boundary is crossed"
      - name: AWARD_FLAT
        when: "award.pricing_mode == AWARD_FLAT"
        difference: "Single pinned unit price for every unit regardless of cumulative volume"

  - name: district_ytd_coop_volume
    trigger: "consulted by coop_tiered_unit_price on every POLine creation"
    algorithm: chronological
    formula: |
      volume = sum(ordered_qty) over POLines where
        POLine.status != CANCELLED
        AND POLine.coop_agreement_id == agreement
        AND POLine.purchase_order's award.district_id == district
        AND POLine.purchase_order.fiscal_year == agreement.contract_year
      processed in POLine.created_at ASC order (creation order fixes each line's cumulative base c;
      out-of-order reads never change a previously computed line price).
    input_set: "Non-CANCELLED POLines of the district for the agreement in the matching fiscal year"
    precision: "integer units"

  - name: install_closeout_total_cents
    trigger: "POST /v1/purchase-orders/{id}/close"
    algorithm: aggregation
    formula: |
      PINNED ORDER (rounding order matters; do not reorder):
      1. For each non-CANCELLED POLine on the PO:
           line_charge_cents = round_half_up(ordered_qty * award.install_rate_cents / 100) * 100
         (each line's install charge rounded HALF-UP to whole dollars BEFORE summing)
      2. subtotal_cents = sum(line_charge_cents)
      3. mid_date = delivery_window_start + floor((delivery_window_end - delivery_window_start) / 2) days
         (window from the PO's award's bid spec)
      4. If max(POLine.installed_at date) over non-CANCELLED lines <= mid_date:
           credit_cents = round_half_up(subtotal_cents * EARLY_COMPLETION_CREDIT_PCT / 100) * 100
         Else: credit_cents = 0
      5. closeout_total_cents = subtotal_cents - credit_cents
    input_set: "Non-CANCELLED POLines of the PO being closed"
    constants:
      EARLY_COMPLETION_CREDIT_PCT: 0.03
    precision: "whole-dollar granularity (100 cents); round_half_up at each pinned step"

  - name: warranty_coverage_cents
    trigger: "POST /v1/warranty-claims/{id}/approve"
    algorithm: threshold
    formula: |
      base_end = POLine.installed_at date + award.warranty_years years
      Variant STANDARD_TERM (district.extended_warranty_enrolled == false):
        eligible iff claim filing date <= base_end  (inclusive; filing beyond base_end already
        rejected with ERR_WARRANTY_EXPIRED at creation)
        coverage_cents = parts_cost_cents
      Variant EXTENDED_PRORATED (district.extended_warranty_enrolled == true):
        filing window extends to base_end + award.extended_years years
        days_past = max(0, claim_date - base_end) in days
        years_started = ceil(days_past / 365)
        coverage_pct = max(0, 1 - years_started / award.extended_years)
        coverage_cents = round_half_up(parts_cost_cents * coverage_pct, 0)
      Same parts_cost_cents and claim_date produce different coverage under the two variants
      (e.g., past base_end: STANDARD rejects at filing; EXTENDED pays a prorated amount).
    input_set: "The single WarrantyClaim being approved, its POLine, and its Award"
    precision: "integer cents; round_half_up"
    variants:
      - name: STANDARD_TERM
        when: "District.extended_warranty_enrolled == false"
        difference: "Full parts coverage inside base term; zero beyond (filing rejected)"
      - name: EXTENDED_PRORATED
        when: "District.extended_warranty_enrolled == true"
        difference: "Coverage declines by 1/extended_years per started year past base_end"

  - name: replacement_window_deadline
    trigger: "POST /v1/damage-reports (filing)"
    algorithm: threshold
    formula: |
      window_end = delivery_window_end of the bid spec behind the damage report's PO line
      replacement_deadline = min(window_end + REPLACEMENT_BUFFER_DAYS days,
                                 reported_date + MAX_REPLACEMENT_DAYS days)
      approve-replacement requires scheduled_date <= replacement_deadline (inclusive).
    input_set: "The DamageReport and the BidSpec behind its POLine"
    constants:
      REPLACEMENT_BUFFER_DAYS: 14
      MAX_REPLACEMENT_DAYS: 21
    precision: "whole days; min of two candidate dates"

  - name: specline_remaining_qty
    trigger: "POLine creation, POLine cancel, PO cancel (drawdown and compensation)"
    algorithm: aggregation
    formula: |
      SpecLine.remaining_qty = SpecLine.qty - sum(POLine.ordered_qty)
        over POLines with spec_line_id == SpecLine.id AND status != CANCELLED
      INVARIANT (drawdown conservation):
        SpecLine.qty == SpecLine.remaining_qty + sum(ordered_qty of non-CANCELLED POLines referencing it)
      Creating a POLine debits remaining_qty by ordered_qty; cancelling that POLine credits it back;
      the invariant sum is unchanged by the forward+compensating pair.
    input_set: "Non-CANCELLED POLines referencing the SpecLine"
    precision: "integer units"

  - name: crew_booked_days
    trigger: "InstallTask creation, unassign, complete (and the damage-approval cascade)"
    algorithm: aggregation
    formula: |
      Crew.booked_days = sum(InstallTask.crew_days) over InstallTasks with
        crew_id == Crew.id AND status IN {SCHEDULED, IN_PROGRESS}
      where InstallTask.crew_days = crew_count * |dates in [start_date, end_date)| (half-open)
      INVARIANT (booking conservation):
        Crew.booked_days == sum of crew_days over that crew's SCHEDULED/IN_PROGRESS tasks
      Assign debits; unassign (SCHEDULED -> CANCELLED) credits the same amount back; net zero drift.
    input_set: "InstallTasks in SCHEDULED or IN_PROGRESS for the crew"
    precision: "integer crew-days"

  - name: site_daily_load
    trigger: "InstallTask creation"
    algorithm: aggregation
    formula: |
      An InstallTask occupies every date d with start_date <= d < end_date (half-open).
      load(site, d) = sum(crew_count) over non-CANCELLED InstallTasks at that site occupying d
      Creation rejected with ERR_SITE_CAPACITY_EXCEEDED if for ANY occupied date d:
        load(site, d) + new_task.crew_count > site.daily_crew_capacity
      (load exactly == capacity is allowed; > capacity is rejected)
    input_set: "Non-CANCELLED InstallTasks of the site overlapping the new task's occupied dates"
    precision: "integer crew seats per date"

  - name: po_fulfillment_posture
    trigger: "any change to PurchaseOrder.open_backorder_count (declare-backorder, notice resolution, line cancel, PO cancel)"
    algorithm: threshold
    formula: |
      if open_backorder_count >= BACKORDER_RISK_THRESHOLD: posture = AT_RISK
      else: posture = ON_TRACK
      While posture == AT_RISK, POST /v1/shipments is rejected with ERR_PO_AT_RISK_BLOCKS_SCHEDULING
      unless the shipment is kind == REPLACEMENT or at least one of its lines is currently BACKORDERED
      (remediation shipments are exempt — they are how the PO recovers).
    input_set: "POLines of the PO in BACKORDERED status"
    constants:
      BACKORDER_RISK_THRESHOLD: 2
    precision: "integer count; >= threshold"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Entity-backed ownership scope: DistrictBuyer (X-User-ID == District.id) may only mutate resources whose district chain resolves to that district (site, spec, award, PO, PO line, warranty claim, appeal); CrewLead (X-User-ID == Crew.id) may only start/complete tasks of their own crew and file INSTALL damage reports for their own crew's tasks"
    error_id: ERR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all DistrictBuyer and CrewLead mutation endpoints"

  - priority: 4
    category: existence
    check: "Path ids exist (left-to-right), then body FK references exist (district_id, bid_spec_id, award_id, coop_agreement_id, purchase_order_id, spec_line_id, school_site_id, crew_id, shipment_id, install_task_id, po_line_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present; types valid; enum membership; qty/count/capacity/costs >= 1 where applicable; end_date > start_date; date fields well-formed ISO dates; computed/system fields in body ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 6
    category: state
    check: "Target resource state permits the transition/action (incl. BidSpec publish/close/addendum states, Award ISSUED for accept, PO RECEIVED for accept, line states for backorder/cancel, shipment SCHEDULED for mark-delivered, notice OPEN/ETA_UPDATED for update-eta, claim states for review/approve/deny/appeal/order-parts, terminal lockdown on CANCELLED/CLOSED/RESOLVED; also: SpecLine creation requires its BidSpec in DRAFT or ADDENDUM_ISSUED, POLine creation requires its PO in RECEIVED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints; POST /v1/spec-lines; POST /v1/po-lines"

  - priority: 7
    category: state
    check: "Cross-entity state gates: award creation requires BidSpec CLOSED; PO creation requires Award ACCEPTED; InstallTask start requires Shipment DELIVERED; warranty filing requires POLine VERIFIED"
    error_id: "ERR_BID_SPEC_NOT_CLOSED | ERR_AWARD_NOT_ACTIVE | ERR_INVALID_STATE | ERR_LINE_NOT_VERIFIED"
    http_status: 409
    applies_to: "POST /v1/awards; POST /v1/purchase-orders; POST /v1/install-tasks/{id}/start; POST /v1/warranty-claims"

  - priority: 8
    category: business_temporal
    check: "Temporal windows: PO line creation date <= award.order_by_date (ERR_ORDER_WINDOW_CLOSED); shipment scheduled_date within [delivery_window_start, delivery_window_end] inclusive (ERR_OUTSIDE_DELIVERY_WINDOW); approve-replacement scheduled_date <= replacement_deadline (ERR_REPLACEMENT_WINDOW_MISSED); warranty filing within term (ERR_WARRANTY_EXPIRED); ETA updates move forward (ERR_ETA_NOT_FORWARD)"
    error_id: "ERR_ORDER_WINDOW_CLOSED | ERR_OUTSIDE_DELIVERY_WINDOW | ERR_REPLACEMENT_WINDOW_MISSED | ERR_WARRANTY_EXPIRED | ERR_ETA_NOT_FORWARD"
    http_status: 409
    applies_to: "POST /v1/po-lines; POST /v1/shipments; POST /v1/damage-reports/{id}/approve-replacement; POST /v1/warranty-claims; POST /v1/backorder-notices/{id}/update-eta"

  - priority: 9
    category: business_referential
    check: "Spec version pin: at POLine creation, BidSpec.spec_version must equal Award.awarded_spec_version (addendum without award amendment invalidates ordering)"
    error_id: ERR_SPEC_VERSION_STALE
    http_status: 409
    applies_to: "POST /v1/po-lines"

  - priority: 10
    category: business_safety
    check: "No-substitution compliance: delivered manufacturer/model must exactly equal the pinned SpecLine manufacturer/model"
    error_id: ERR_SUBSTITUTION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /v1/shipments/{id}/mark-delivered"

  - priority: 11
    category: business_constraint
    check: "Crew double-booking: no two non-CANCELLED InstallTasks for the same crew with overlapping half-open intervals [start_date, end_date); adjacency (end == next start) is allowed"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /v1/install-tasks; POST /v1/damage-reports/{id}/approve-replacement"

  - priority: 12
    category: business_constraint
    check: "Site daily capacity: per occupied date, summed crew_count + new crew_count <= site.daily_crew_capacity (== allowed)"
    error_id: ERR_SITE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /v1/install-tasks; POST /v1/damage-reports/{id}/approve-replacement"

  - priority: 13
    category: business_constraint
    check: "Spec-line drawdown: ordered_qty <= SpecLine.remaining_qty at POLine creation"
    error_id: ERR_AWARD_QTY_EXCEEDED
    http_status: 409
    applies_to: "POST /v1/po-lines"

  - priority: 14
    category: business_constraint
    check: "Uniqueness/duplicates: po_number unique per (district, fiscal_year) among non-CANCELLED POs (ERR_DUPLICATE_PO_NUMBER); no second warranty claim on a line while one is FILED/UNDER_REVIEW/APPEALED/APPROVED (ERR_DUPLICATE_CLAIM); claimed parts_cost_cents <= installed_qty * computed_unit_price_cents (ERR_CLAIM_EXCEEDS_COVERAGE); damaged_qty <= delivered_qty (ERR_DAMAGE_EXCEEDS_DELIVERED); delivered_qty <= remaining undelivered (ERR_DELIVERY_EXCEEDS_ORDERED); exactly one of shipment_id/install_task_id consistent with discovered_during on damage reports (ERR_INVALID_REQUEST)"
    error_id: "ERR_DUPLICATE_PO_NUMBER | ERR_DUPLICATE_CLAIM | ERR_CLAIM_EXCEEDS_COVERAGE | ERR_DAMAGE_EXCEEDS_DELIVERED | ERR_DELIVERY_EXCEEDS_ORDERED | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /v1/purchase-orders; POST /v1/warranty-claims; POST /v1/damage-reports; POST /v1/shipments/{id}/mark-delivered"

  - priority: 15
    category: business_fiscal
    check: "District fiscal-year commitment cap at PO accept: sum of total_cents over the district's non-CANCELLED accepted-or-later POs in this fiscal_year + this PO's total_cents <= District.annual_cap_cents"
    error_id: ERR_DISTRICT_FISCAL_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /v1/purchase-orders/{id}/accept"

  - priority: 16
    category: business_constraint
    check: "Posture gate: PO posture AT_RISK blocks shipment scheduling unless kind == REPLACEMENT or the shipment contains a BACKORDERED line"
    error_id: ERR_PO_AT_RISK_BLOCKS_SCHEDULING
    http_status: 409
    applies_to: "POST /v1/shipments"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_award_version == Award.version on issue-amendment; expected_po_line_version == POLine.version on backorder-notice supersede-create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/awards/{id}/issue-amendment; POST /v1/po-lines/{id}/backorder-notices"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [ContractorAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All date-sensitive validations and calculations read this clock"]

  # --- District ---
  - method: POST
    path: "/v1/districts"
    description: "Register a school district"
    roles: [ContractorAdmin]
    code: 201
    input: [name, annual_cap_cents, "extended_warranty_enrolled?"]
    output: District
    side_effects: []

  - method: GET
    path: "/v1/districts/{id}"
    description: "Get a District"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: District
    side_effects: []

  # --- SchoolSite ---
  - method: POST
    path: "/v1/school-sites"
    description: "Create a school site (delivery/installation destination)"
    roles: [DistrictBuyer]
    code: 201
    input: [district_id, name, daily_crew_capacity, "address?"]
    output: SchoolSite
    side_effects: []

  - method: GET
    path: "/v1/school-sites/{id}"
    description: "Get a SchoolSite"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: SchoolSite
    side_effects: []

  - method: GET
    path: "/v1/school-sites"
    description: "List SchoolSites"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["district_id?", "limit?", "offset?"]
    output: "SchoolSite[]"
    side_effects: []

  # --- BidSpec ---
  - method: POST
    path: "/v1/bid-specs"
    description: "Create a bid specification (DRAFT)"
    roles: [DistrictBuyer]
    code: 201
    input: [district_id, title, bid_due_date, delivery_window_start, delivery_window_end]
    output: BidSpec
    side_effects: ["status=DRAFT, spec_version=1"]

  - method: GET
    path: "/v1/bid-specs/{id}"
    description: "Get a BidSpec"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: BidSpec
    side_effects: []

  - method: GET
    path: "/v1/bid-specs"
    description: "List BidSpecs"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["district_id?", "status?", "limit?", "offset?"]
    output: "BidSpec[]"
    side_effects: []

  - method: POST
    path: "/v1/bid-specs/{id}/publish"
    description: "Publish a spec (from DRAFT, or re-publish from ADDENDUM_ISSUED with spec_version += 1)"
    roles: [DistrictBuyer]
    code: 200
    input: []
    output: BidSpec
    side_effects: ["DRAFT->PUBLISHED, or ADDENDUM_ISSUED->PUBLISHED with spec_version += 1"]

  - method: POST
    path: "/v1/bid-specs/{id}/issue-addendum"
    description: "Issue an addendum (PUBLISHED/CLOSED/AWARDED -> ADDENDUM_ISSUED)"
    roles: [DistrictBuyer]
    code: 200
    input: [addendum_note]
    output: BidSpec
    side_effects: ["status -> ADDENDUM_ISSUED; increments BidSpec.version by 1"]

  - method: POST
    path: "/v1/bid-specs/{id}/close"
    description: "Close a published spec to bidding"
    roles: [DistrictBuyer]
    code: 200
    input: []
    output: BidSpec
    side_effects: ["status PUBLISHED -> CLOSED"]

  # --- SpecLine ---
  - method: POST
    path: "/v1/spec-lines"
    description: "Add a line to a bid spec (only while spec is DRAFT or ADDENDUM_ISSUED)"
    roles: [DistrictBuyer]
    code: 201
    input: [bid_spec_id, manufacturer, model, qty, max_unit_price_cents, "description?"]
    output: SpecLine
    side_effects: ["remaining_qty initialized to qty"]

  - method: GET
    path: "/v1/spec-lines/{id}"
    description: "Get a SpecLine"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: SpecLine
    side_effects: []

  - method: GET
    path: "/v1/spec-lines"
    description: "List SpecLines"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["bid_spec_id?", "limit?", "offset?"]
    output: "SpecLine[]"
    side_effects: []

  # --- CoopPriceAgreement ---
  - method: POST
    path: "/v1/coop-agreements"
    description: "Create a cooperative contract pricing agreement (ACTIVE on creation)"
    roles: [ContractManager]
    code: 201
    input: [name, contract_year, tier_table]
    output: CoopPriceAgreement
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/v1/coop-agreements/{id}"
    description: "Get a CoopPriceAgreement"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: CoopPriceAgreement
    side_effects: []

  # --- Award ---
  - method: POST
    path: "/v1/awards"
    description: "Issue an award notice against a CLOSED bid spec; pins awarded_spec_version"
    roles: [DistrictBuyer]
    code: 201
    input: [bid_spec_id, district_id, pricing_mode, "coop_agreement_id?", "flat_unit_price_cents?", install_rate_cents, order_by_date, warranty_years, "extended_years?"]
    output: Award
    side_effects:
      - "status=ISSUED; awarded_spec_version := BidSpec.spec_version"
      - "BidSpec CLOSED -> AWARDED"
      - "pricing_mode COOP_TIERED requires coop_agreement_id; AWARD_FLAT requires flat_unit_price_cents (ERR_INVALID_REQUEST)"
      - "district_id must equal spec's district (ERR_INVALID_REQUEST)"

  - method: GET
    path: "/v1/awards/{id}"
    description: "Get an Award"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: Award
    side_effects: []

  - method: GET
    path: "/v1/awards"
    description: "List Awards"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["bid_spec_id?", "district_id?", "coop_agreement_id?", "status?", "limit?", "offset?"]
    output: "Award[]"
    side_effects: []

  - method: POST
    path: "/v1/awards/{id}/accept"
    description: "Contractor accepts the award notice"
    roles: [ContractManager]
    code: 200
    input: []
    output: Award
    side_effects: ["status ISSUED -> ACCEPTED; increments Award.version by 1"]

  - method: POST
    path: "/v1/awards/{id}/issue-amendment"
    description: "Amend an ACCEPTED award; re-pins awarded_spec_version to the spec's current spec_version (OCC-guarded)"
    roles: [DistrictBuyer]
    code: 200
    input: [expected_award_version, amendment_note]
    output: Award
    side_effects:
      - "awarded_spec_version := BidSpec.spec_version"
      - "increments Award.version by 1"

  # --- PurchaseOrder ---
  - method: POST
    path: "/v1/purchase-orders"
    description: "District PO intake against an ACCEPTED award"
    roles: [DistrictBuyer]
    code: 201
    input: [award_id, po_number, fiscal_year]
    output: PurchaseOrder
    side_effects: ["status=RECEIVED; posture=ON_TRACK; open_backorder_count=0; total_cents=0"]

  - method: GET
    path: "/v1/purchase-orders/{id}"
    description: "Get a PurchaseOrder"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: GET
    path: "/v1/purchase-orders"
    description: "List PurchaseOrders"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: "PurchaseOrder[]"
    side_effects: []

  - method: POST
    path: "/v1/purchase-orders/{id}/accept"
    description: "Contractor accepts a PO (fiscal cap check); lines PENDING -> ORDERED"
    roles: [FulfillmentCoordinator]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status RECEIVED -> ACCEPTED; all POLines PENDING -> ORDERED"]

  - method: POST
    path: "/v1/purchase-orders/{id}/cancel"
    description: "District cancels a PO (RECEIVED, or ACCEPTED with no shipments)"
    roles: [DistrictBuyer]
    code: 200
    input: ["cancel_reason?"]
    output: PurchaseOrder
    side_effects: ["Lines PENDING/ORDERED/BACKORDERED -> CANCELLED; backorder notices RESOLVED; drawdown compensated; posture recomputed"]

  - method: POST
    path: "/v1/purchase-orders/{id}/close"
    description: "Close a FULFILLED PO; computes install closeout total"
    roles: [FulfillmentCoordinator]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status FULFILLED -> CLOSED; closeout_total_cents computed per install_closeout_total_cents"]

  # --- POLine ---
  - method: POST
    path: "/v1/po-lines"
    description: "Add a line to a RECEIVED PurchaseOrder; computes coop-tiered or flat pricing"
    roles: [DistrictBuyer]
    code: 201
    input: [purchase_order_id, spec_line_id, ordered_qty]
    output: POLine
    side_effects:
      - "status=PENDING; delivered_qty=0"
      - "computed_unit_price_cents and line_total_cents computed per coop_tiered_unit_price variant"
      - "SpecLine.remaining_qty -= ordered_qty (drawdown)"
      - "PurchaseOrder.total_cents recomputed"

  - method: GET
    path: "/v1/po-lines/{id}"
    description: "Get a POLine"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: POLine
    side_effects: []

  - method: GET
    path: "/v1/po-lines"
    description: "List POLines"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["purchase_order_id?", "spec_line_id?", "coop_agreement_id?", "status?", "limit?", "offset?"]
    output: "POLine[]"
    side_effects: []

  - method: POST
    path: "/v1/po-lines/{id}/declare-backorder"
    description: "Declare the undelivered remainder backordered; creates district backorder notice (cascade)"
    roles: [FulfillmentCoordinator]
    code: 200
    input: [initial_eta_date]
    output: POLine
    side_effects:
      - "status ORDERED|PARTIALLY_DELIVERED -> BACKORDERED; increments POLine.version by 1"
      - "Creates BackorderNotice(OPEN, revision_count=0) with current_eta_date=initial_eta_date"
      - "PurchaseOrder.open_backorder_count += 1; posture recomputed"

  - method: POST
    path: "/v1/po-lines/{id}/cancel"
    description: "Cancel an undelivered line (compensates drawdown)"
    roles: [DistrictBuyer]
    code: 200
    input: []
    output: POLine
    side_effects: ["status -> CANCELLED; SpecLine.remaining_qty += ordered_qty; open notice RESOLVED if BACKORDERED; PO.total_cents recomputed"]

  - method: POST
    path: "/v1/po-lines/{id}/backorder-notices"
    description: "Create a revised backorder notice superseding the line's current notice (OCC-guarded)"
    roles: [FulfillmentCoordinator]
    code: 201
    input: [initial_eta_date, expected_po_line_version, "note?"]
    output: BackorderNotice
    side_effects:
      - "Prior OPEN|ETA_UPDATED notice -> SUPERSEDED; new notice OPEN with revision_count=0"
      - "increments POLine.version by 1"

  # --- Shipment ---
  - method: POST
    path: "/v1/shipments"
    description: "Schedule a summer-window shipment of PO lines to a school site"
    roles: [FulfillmentCoordinator]
    code: 201
    input: [purchase_order_id, school_site_id, scheduled_date, lines, "kind?"]
    output: Shipment
    side_effects:
      - "status=SCHEDULED"
      - "First shipment on an ACCEPTED PO: PO ACCEPTED -> IN_FULFILLMENT"
      - "Line eligibility: each referenced POLine in ORDERED, PARTIALLY_DELIVERED, or BACKORDERED (ERR_INVALID_STATE)"

  - method: GET
    path: "/v1/shipments/{id}"
    description: "Get a Shipment"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/v1/shipments"
    description: "List Shipments"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["purchase_order_id?", "school_site_id?", "damage_report_id?", "kind?", "status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: POST
    path: "/v1/shipments/{id}/mark-delivered"
    description: "Record delivery with per-line quantities and actual manufacturer/model (no-substitution check)"
    roles: [FulfillmentCoordinator]
    code: 200
    input: [lines]
    output: Shipment
    side_effects:
      - "status SCHEDULED -> DELIVERED"
      - "POLine.delivered_qty accumulation and status transitions; backorder notices RESOLVED on completion"
      - "DamageReport REPLACEMENT_ORDERED -> RESOLVED when a replacement shipment completes its damaged_qty"

  # --- Crew ---
  - method: POST
    path: "/v1/crews"
    description: "Register an installation crew"
    roles: [ContractorAdmin]
    code: 201
    input: [name]
    output: Crew
    side_effects: ["booked_days=0"]

  - method: GET
    path: "/v1/crews/{id}"
    description: "Get a Crew"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # --- InstallTask ---
  - method: POST
    path: "/v1/install-tasks"
    description: "Assign a crew to uncrate/install/place a shipment at a site (half-open [start_date, end_date))"
    roles: [FulfillmentCoordinator]
    code: 201
    input: [shipment_id, crew_id, school_site_id, room_label, start_date, end_date, crew_count]
    output: InstallTask
    side_effects:
      - "status=SCHEDULED; crew_days computed = crew_count * occupied days"
      - "Crew.booked_days += crew_days"
      - "Crew overlap (ERR_CREW_DOUBLE_BOOKED) and site daily capacity (ERR_SITE_CAPACITY_EXCEEDED) enforced"
      - "school_site_id must equal shipment's site (ERR_INVALID_REQUEST); shipment must be SCHEDULED or DELIVERED (ERR_INVALID_STATE)"

  - method: GET
    path: "/v1/install-tasks/{id}"
    description: "Get an InstallTask"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: InstallTask
    side_effects: []

  - method: GET
    path: "/v1/install-tasks"
    description: "List InstallTasks"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["shipment_id?", "crew_id?", "school_site_id?", "status?", "limit?", "offset?"]
    output: "InstallTask[]"
    side_effects: []

  - method: POST
    path: "/v1/install-tasks/{id}/start"
    description: "Crew lead starts the task (requires shipment DELIVERED)"
    roles: [CrewLead]
    code: 200
    input: []
    output: InstallTask
    side_effects: ["status SCHEDULED -> IN_PROGRESS"]

  - method: POST
    path: "/v1/install-tasks/{id}/complete"
    description: "Complete with uncrate/debris-removal/placement checklist; verifies shipment lines"
    roles: [CrewLead]
    code: 200
    input: [uncrated, debris_removed, placed]
    output: InstallTask
    side_effects:
      - "status IN_PROGRESS -> COMPLETED; completed_checklist recorded"
      - "Crew.booked_days -= crew_days"
      - "Shipment lines DELIVERED -> VERIFIED with installed_at := clock; Shipment -> COMPLETED when all its tasks complete; PO -> FULFILLED when all lines VERIFIED"

  - method: POST
    path: "/v1/install-tasks/{id}/unassign"
    description: "Unassign a SCHEDULED task (compensates crew booking)"
    roles: [FulfillmentCoordinator]
    code: 200
    input: []
    output: InstallTask
    side_effects: ["status SCHEDULED -> CANCELLED; Crew.booked_days -= crew_days"]

  # --- DamageReport ---
  - method: POST
    path: "/v1/damage-reports"
    description: "File a damage report for delivered units (delivery-phase or install-phase)"
    roles: [CrewLead]
    code: 201
    input: [po_line_id, damaged_qty, discovered_during, fault_type, "shipment_id?", "install_task_id?"]
    output: DamageReport
    side_effects: ["status=OPEN; reported_date := clock date; replacement_deadline computed"]

  - method: GET
    path: "/v1/damage-reports/{id}"
    description: "Get a DamageReport"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: DamageReport
    side_effects: []

  - method: GET
    path: "/v1/damage-reports"
    description: "List DamageReports"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["shipment_id?", "install_task_id?", "po_line_id?", "status?", "limit?", "offset?"]
    output: "DamageReport[]"
    side_effects: []

  - method: POST
    path: "/v1/damage-reports/{id}/approve-replacement"
    description: "Approve replacement within window; cascades Shipment(REPLACEMENT) -> InstallTask -> Crew booking"
    roles: [ContractManager]
    code: 200
    input: [scheduled_date, crew_id, start_date, end_date, crew_count, room_label]
    output: DamageReport
    side_effects:
      - "status OPEN -> REPLACEMENT_ORDERED"
      - "Creates Shipment(kind=REPLACEMENT, SCHEDULED) for damaged_qty of the report's line"
      - "Creates InstallTask(SCHEDULED) for the replacement shipment; Crew.booked_days += crew_days"

  - method: POST
    path: "/v1/damage-reports/{id}/close-no-fault"
    description: "Close a damage report without replacement (no contractor fault)"
    roles: [ContractManager]
    code: 200
    input: []
    output: DamageReport
    side_effects: ["status OPEN -> CLOSED_NO_FAULT"]

  # --- BackorderNotice ---
  - method: GET
    path: "/v1/backorder-notices/{id}"
    description: "Get a BackorderNotice"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: BackorderNotice
    side_effects: []

  - method: GET
    path: "/v1/backorder-notices"
    description: "List BackorderNotices"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["po_line_id?", "status?", "limit?", "offset?"]
    output: "BackorderNotice[]"
    side_effects: []

  - method: POST
    path: "/v1/backorder-notices/{id}/update-eta"
    description: "Communicate a revised (later) ETA to the district"
    roles: [FulfillmentCoordinator]
    code: 200
    input: [new_eta_date]
    output: BackorderNotice
    side_effects: ["status OPEN|ETA_UPDATED -> ETA_UPDATED; current_eta_date, revision_count, communicated_at updated"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/v1/warranty-claims"
    description: "District files a warranty claim against a VERIFIED installed line"
    roles: [DistrictBuyer]
    code: 201
    input: [po_line_id, parts_cost_cents, description]
    output: WarrantyClaim
    side_effects: ["status=FILED; appeal_count=0; coverage_cents=null"]

  - method: GET
    path: "/v1/warranty-claims/{id}"
    description: "Get a WarrantyClaim"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/v1/warranty-claims"
    description: "List WarrantyClaims"
    roles: [ContractorAdmin, ContractManager, FulfillmentCoordinator, ServiceAgent, CrewLead, DistrictBuyer]
    code: 200
    input: ["po_line_id?", "status?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: POST
    path: "/v1/warranty-claims/{id}/review"
    description: "Move claim to UNDER_REVIEW (from FILED or APPEALED)"
    roles: [ServiceAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/v1/warranty-claims/{id}/approve"
    description: "Approve claim; computes coverage_cents per coverage variant"
    roles: [ServiceAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status UNDER_REVIEW -> APPROVED; coverage_cents computed per warranty_coverage_cents"]

  - method: POST
    path: "/v1/warranty-claims/{id}/deny"
    description: "Deny claim with reason"
    roles: [ServiceAgent]
    code: 200
    input: [denial_reason]
    output: WarrantyClaim
    side_effects: ["status UNDER_REVIEW -> DENIED; denial_reason recorded"]

  - method: POST
    path: "/v1/warranty-claims/{id}/appeal"
    description: "District appeals a denial (at most one appeal)"
    roles: [DistrictBuyer]
    code: 200
    input: [appeal_note]
    output: WarrantyClaim
    side_effects: ["status DENIED -> APPEALED; appeal_count := 1"]

  - method: POST
    path: "/v1/warranty-claims/{id}/order-parts"
    description: "Order replacement parts under an approved claim (parts support for years)"
    roles: [ServiceAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status APPROVED -> CLOSED; parts_order_ref generated"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role valid but not in endpoint roles" }
  - { id: ERR_SCOPE_VIOLATION, http: 403, condition: "Entity-backed caller acting on a resource outside its ownership scope (DistrictBuyer other district; CrewLead other crew)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, qty/capacity < 1, end_date <= start_date, price above max_unit_price_cents ceiling, missing conditional requirement (coop id / flat price / shipment-or-task reference), publish of spec with zero lines" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not permit the transition/action (terminal lockdown, wrong from-state, PO cancel with shipments, install start before delivery, second appeal, backorder on fully delivered line)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_BID_SPEC_NOT_CLOSED, http: 409, condition: "Award creation requires BidSpec status CLOSED" }
  - { id: ERR_AWARD_NOT_ACTIVE, http: 409, condition: "PO creation requires Award status ACCEPTED" }
  - { id: ERR_DUPLICATE_PO_NUMBER, http: 409, condition: "po_number already used by a non-CANCELLED PO of this district in this fiscal_year" }
  - { id: ERR_ORDER_WINDOW_CLOSED, http: 409, condition: "POLine creation after award.order_by_date" }
  - { id: ERR_SPEC_VERSION_STALE, http: 409, condition: "BidSpec.spec_version != Award.awarded_spec_version at POLine creation (unamended addendum)" }
  - { id: ERR_AWARD_QTY_EXCEEDED, http: 409, condition: "ordered_qty exceeds SpecLine.remaining_qty drawdown" }
  - { id: ERR_DISTRICT_FISCAL_CAP_EXCEEDED, http: 409, condition: "PO accept would push district fiscal-year committed total above annual_cap_cents" }
  - { id: ERR_OUTSIDE_DELIVERY_WINDOW, http: 409, condition: "Shipment scheduled_date outside [delivery_window_start, delivery_window_end] inclusive" }
  - { id: ERR_PO_AT_RISK_BLOCKS_SCHEDULING, http: 409, condition: "PO posture AT_RISK and shipment is STANDARD with no BACKORDERED line" }
  - { id: ERR_SUBSTITUTION_NOT_ALLOWED, http: 409, condition: "Delivered manufacturer/model differs from pinned SpecLine manufacturer/model" }
  - { id: ERR_DELIVERY_EXCEEDS_ORDERED, http: 409, condition: "Delivery entry exceeds the line's remaining undelivered quantity" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Crew already has a non-CANCELLED task overlapping [start_date, end_date) half-open" }
  - { id: ERR_SITE_CAPACITY_EXCEEDED, http: 409, condition: "Summed crew_count on an occupied date would exceed site.daily_crew_capacity" }
  - { id: ERR_DAMAGE_EXCEEDS_DELIVERED, http: 409, condition: "damaged_qty exceeds the line's delivered_qty" }
  - { id: ERR_REPLACEMENT_WINDOW_MISSED, http: 409, condition: "Replacement scheduled_date after replacement_deadline" }
  - { id: ERR_LINE_NOT_VERIFIED, http: 409, condition: "Warranty claim requires POLine status VERIFIED" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "Claim filing date beyond applicable warranty term (base, or base+extended for enrolled districts)" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "Line already has a claim in FILED/UNDER_REVIEW/APPEALED/APPROVED" }
  - { id: ERR_CLAIM_EXCEEDS_COVERAGE, http: 409, condition: "parts_cost_cents exceeds installed_qty * computed_unit_price_cents for the line" }
  - { id: ERR_BACKORDER_NOT_OPEN, http: 409, condition: "update-eta on a notice in SUPERSEDED or RESOLVED" }
  - { id: ERR_ETA_NOT_FORWARD, http: 409, condition: "ETA not strictly later than current_eta_date / current clock date (update-eta, declare-backorder, supersede-create)" }
  - { id: ERR_INSTALL_CHECKLIST_INCOMPLETE, http: 409, condition: "complete called without uncrated && debris_removed && placed all true" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractorAdmin
    description: "Contractor platform administrator: registers districts and crews, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/districts"
      - "POST /v1/crews"
      - "POST /v1/_clock/set_current_utc"
    shared_operations: ["GET read endpoints"]

  - name: ContractManager
    description: "Contractor contract manager: coop pricing agreements, award acceptance, damage replacement decisions"
    identity: opaque
    exclusive_operations:
      - "POST /v1/coop-agreements"
      - "POST /v1/awards/{id}/accept"
      - "POST /v1/damage-reports/{id}/approve-replacement"
      - "POST /v1/damage-reports/{id}/close-no-fault"
    shared_operations: ["GET read endpoints"]

  - name: FulfillmentCoordinator
    description: "Contractor fulfillment desk: PO acceptance/close, shipments, install scheduling, backorder communication"
    identity: opaque
    exclusive_operations:
      - "POST /v1/purchase-orders/{id}/accept"
      - "POST /v1/purchase-orders/{id}/close"
      - "POST /v1/po-lines/{id}/declare-backorder"
      - "POST /v1/po-lines/{id}/backorder-notices"
      - "POST /v1/backorder-notices/{id}/update-eta"
      - "POST /v1/shipments"
      - "POST /v1/shipments/{id}/mark-delivered"
      - "POST /v1/install-tasks"
      - "POST /v1/install-tasks/{id}/unassign"
    shared_operations: ["GET read endpoints"]

  - name: CrewLead
    description: "Installation crew lead: starts/completes own crew's tasks, files damage reports"
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /v1/install-tasks/{id}/start"
      - "POST /v1/install-tasks/{id}/complete"
      - "POST /v1/damage-reports"
    shared_operations: ["GET read endpoints"]

  - name: DistrictBuyer
    description: "District purchasing official: bid specs, sites, awards, POs, warranty claims and appeals for their own district"
    identity: "entity_backed:District"
    exclusive_operations:
      - "POST /v1/school-sites"
      - "POST /v1/bid-specs (+ publish, issue-addendum, close)"
      - "POST /v1/spec-lines"
      - "POST /v1/awards (+ issue-amendment)"
      - "POST /v1/purchase-orders (+ cancel)"
      - "POST /v1/po-lines (+ cancel)"
      - "POST /v1/warranty-claims (+ appeal)"
    shared_operations: ["GET read endpoints"]

  - name: ServiceAgent
    description: "Contractor warranty service agent: reviews, approves, denies claims and orders parts"
    identity: opaque
    exclusive_operations:
      - "POST /v1/warranty-claims/{id}/review"
      - "POST /v1/warranty-claims/{id}/approve"
      - "POST /v1/warranty-claims/{id}/deny"
      - "POST /v1/warranty-claims/{id}/order-parts"
    shared_operations: ["GET read endpoints"]
