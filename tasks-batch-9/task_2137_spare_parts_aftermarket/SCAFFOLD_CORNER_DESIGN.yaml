      - name: patch_part_recomputes_catalogue_price_and_bumps_version
        claim_type: Standard CRUD
        grounds:
          - endpoints["PATCH /aftermarket/parts/{id}"]
          - calculations.aftermarket_price_uplift
        distinguishing_aspect: "PATCH with unit_cost_cents 2000 rewrites current_list_unit_price_cents to round_half_up(2000*1.35) == 2700 and advances version from 1 to 2 in the same response."
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "part PCH-1 with unit_cost_cents 1333, so current_list_unit_price_cents starts at 1800 and version is 1"
          setup_api_calls:
            - call: "POST /aftermarket/price-rules"
              payload: { criticality_class: "DESIRABLE", base_uplift_pct: 0.35, max_uplift_pct: 0.60, min_margin_pct: 0.20 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
