        grounds:
          - validations.priority_13_ERR_CYCLE_NOT_EXCHANGED
          - validations.priority_25_ERR_DISPUTE_SUBJECT_AMBIGUOUS
          - validations.priority_37_ERR_DISPUTE_WINDOW_EXPIRED
          - validations.priority_55_ERR_COUNTER_AMOUNT_OUT_OF_RANGE
          - global_constants.DISPUTE_WINDOW_DAYS
        distinguishing_aspect: "The subject test at priority 25 is an EXACTLY-ONE test, not a required-field test: both movement_id and repair_bill_id are optional in the input contract, so omitting both is shape-legal and must be caught here — and the dispute window is measured from the cycle's exchanged_at stamp, not from the period end or from created_at, so the deadline moves with the exchange."
