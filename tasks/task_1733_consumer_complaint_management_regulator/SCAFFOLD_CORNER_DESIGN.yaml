              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints/${cid}/resolve"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2031-08-02T00:00:00Z" }
              as: ComplaintManager
          trigger:
            - call: "POST /complaint-office/complaints/${cid}/reopen"
              payload: {}
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_RETENTION_EXPIRED"
            - "Complaint.${cid}.status == RESOLVED (unchanged)"

      - name: error_restitution_over_authority_without_manager_flag
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_RESTITUTION_OVER_AUTHORITY]
        distinguishing_aspect: "Approval of a decision whose restitution_amount_cents == 2500001 (> cap 2500000) without X-Manager-Authority: true fails with ERR_RESTITUTION_OVER_AUTHORITY; exactly 2500000 would pass the fiscal gate (boundary >= vs > pinned by >)."
        test_recipe:
          setup: ["PENDING_APPROVAL decision with restitution 2500001 drafted by user_handler_v4"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-V4", display_name: "V4" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.V4" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-V4", channel_code: "WEB", product_code: "P-V4", category_code: "C.V4", narrative: "over authority" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /complaint-office/complaints/${cid}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "GET /complaint-office/complaints/${cid}"
              payload: {}
              as: CaseHandler
              captures: { cv: $.data.version }
            - call: "POST /complaint-office/complaints/${cid}/remediation_decisions"
              payload: { decision_type: "RESTITUTION", line_items: [ { label: "big", amount_cents: 2500001 } ], expected_complaint_version: "${cv}" }
              as: CaseHandler
              as_user_id: "user_handler_v4"
              captures: { did: $.data.id }
            - call: "POST /complaint-office/remediation-decisions/${did}/submit"
              payload: {}
              as: CaseHandler
              as_user_id: "user_handler_v4"
          trigger:
            - call: "POST /complaint-office/remediation-decisions/${did}/approve"
              payload: {}
              as: RemediationApprover
              as_user_id: "user_approver_v4"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_RESTITUTION_OVER_AUTHORITY"
            - "RemediationDecision.${did}.status == PENDING_APPROVAL (unchanged)"

      - name: error_sod_self_approval_blocks_drafter
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SOD_SELF_APPROVAL]
        distinguishing_aspect: "The CaseHandler who drafted the decision cannot approve it even when they also hold the RemediationApprover role: acting user == drafted_by_user_id yields ERR_SOD_SELF_APPROVAL."
        test_recipe:
          setup: ["PENDING_APPROVAL decision drafted by user_dualrole (a user who acts as CaseHandler at draft and attempts approval as RemediationApprover with the same X-User-ID)"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-V5", display_name: "V5" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.V5" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-V5", channel_code: "WEB", product_code: "P-V5", category_code: "C.V5", narrative: "sod approval" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /complaint-office/complaints/${cid}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "GET /complaint-office/complaints/${cid}"
              payload: {}
              as: CaseHandler
              captures: { cv: $.data.version }
            - call: "POST /complaint-office/complaints/${cid}/remediation_decisions"
              payload: { decision_type: "RESTITUTION", line_items: [ { label: "fee", amount_cents: 7000 } ], expected_complaint_version: "${cv}" }
              as: CaseHandler
              as_user_id: "user_dualrole"
              captures: { did: $.data.id }
            - call: "POST /complaint-office/remediation-decisions/${did}/submit"
              payload: {}
              as: CaseHandler
              as_user_id: "user_dualrole"
          trigger:
            - call: "POST /complaint-office/remediation-decisions/${did}/approve"
              payload: {}
              as: RemediationApprover
              as_user_id: "user_dualrole"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_SOD_SELF_APPROVAL"
            - "RemediationDecision.${did}.status == PENDING_APPROVAL (unchanged)"

      - name: error_review_not_owned_on_complete
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors[ERR_REVIEW_NOT_OWNED]
        distinguishing_aspect: "A QAReviewer completing a review claimed by ANOTHER reviewer is rejected with ERR_REVIEW_NOT_OWNED; the review stays OPEN."
        test_recipe:
          setup: ["Complaint RESPONSE_QA; OPEN review held by user_qa_v6a"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-V6", display_name: "V6" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.V6" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-V6", channel_code: "WEB", product_code: "P-V6", category_code: "C.V6", narrative: "ownership" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /complaint-office/complaints/${cid}/quality-reviews"
              payload: { window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-05T00:00:00Z" }
              as: QAReviewer
              as_user_id: "user_qa_v6a"
              captures: { qid: $.data.id }
          trigger:
            - call: "POST /complaint-office/quality-reviews/${qid}/complete"
              payload: { outcome: "PASS" }
              as: QAReviewer
              as_user_id: "user_qa_v6b"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_REVIEW_NOT_OWNED"
            - "QualityReview.${qid}.status == OPEN (unchanged)"

      - name: withdraw_fails_while_referral_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_REFERRAL_OPEN]
        distinguishing_aspect: "Withdraw on a complaint whose referral is still OPEN fails with ERR_REFERRAL_OPEN and leaves the complaint in its prior status."
        test_recipe:
          setup: ["Portal complaint INTAKE with referral OPEN"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-V7", display_name: "V7" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "CFPB_PORTAL", display_name: "Portal", is_regulator_portal: true }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.V7" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-V7", channel_code: "CFPB_PORTAL", product_code: "P-V7", category_code: "C.V7", narrative: "withdraw blocked", portal_ref: "R-V7" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /complaint-office/complaints/${cid}/withdraw"
              payload: {}
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERRAL_OPEN"
            - "Complaint.${cid}.status == INTAKE (unchanged)"

      - name: error_template_in_use_blocks_retire
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_TEMPLATE_IN_USE]
        distinguishing_aspect: "Retiring an ACTIVE template referenced by a complaint in RESPONSE_DRAFTED fails with ERR_TEMPLATE_IN_USE."
        test_recipe:
          setup: ["ACTIVE template TPL-BUSY for (WEB, C.V8); complaint drafted its response using TPL-BUSY and sits in RESPONSE_DRAFTED"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-V8", display_name: "V8" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.V8" }
              as: ComplaintManager
            - call: "POST /complaint-office/response-templates"
              payload: { template_key: "TPL-BUSY", channel_code: "WEB", category_code: "C.V8", body: "busy body" }
