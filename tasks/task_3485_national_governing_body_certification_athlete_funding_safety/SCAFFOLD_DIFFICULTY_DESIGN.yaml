          assert:
            - "deal B starting exactly on A's exclusivity_end 2027-03-31: error_id == ERR_DEAL_EXCLUSIVITY_OVERLAP (closed interval: endpoints touch)"
            - "deal C starting 2027-04-01, exactly DEAL_EXCLUSIVITY_MIN_GAP_DAYS (1) after A's end: created (201)"
