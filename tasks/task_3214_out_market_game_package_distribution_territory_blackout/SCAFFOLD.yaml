      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; owning subscription" }
      - { name: kind, type: enum, source: input, description: "constraints: CHARGE | REFUND", constraints: "enum: CHARGE | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Positive amount; CHARGE adds, REFUND subtracts" }
      - { name: reason, type: string, source: input, description: "Free-text reason; required for REFUND rows" }

  - name: TerritoryCheck
    parent: Account
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; append-only evidence row" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; checked account" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; subscription context of the check" }
      - { name: game_id, type: string, source: input, description: "FK -> Game.id; game whose availability was checked" }
      - { name: device_zip, type: string, source: input, description: "5-digit ZIP reported by the device at check time" }
      - { name: device_market_code, type: string, source: computed, description: "Market.code resolved from device_zip prefix; null if unmapped" }
      - { name: effective_market_code, type: string, source: computed, description: "Market actually used for the blackout verdict per effective_market rule" }
      - { name: verdict, type: enum, source: computed, description: "constraints: AVAILABLE | BLACKED_OUT | NOT_IN_PACKAGE | NO_ENTITLEMENT", constraints: "enum: AVAILABLE | BLACKED_OUT | NOT_IN_PACKAGE | NO_ENTITLEMENT" }
      - { name: checked_at, type: datetime, source: system, description: "Server timestamp of the check" }

  - name: GameEntitlement
    parent: Subscription
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; owning subscription" }
      - { name: game_id, type: string, source: system, description: "FK -> Game.id; entitled game" }
      - { name: week_index, type: integer, source: system, description: "Denormalized from game for weekly sweeps" }
      - { name: status, type: enum, source: system, description: "constraints: GRANTED | WITHDRAWN | BLACKED_OUT", constraints: "enum: GRANTED | WITHDRAWN | BLACKED_OUT" }
      - { name: withdrawn_reason, type: enum, source: system, description: "Set when WITHDRAWN; constraints: NATIONAL_SELECTION | ENTITLEMENT_REVOKED | SUBSCRIPTION_CANCELLED", constraints: "enum: NATIONAL_SELECTION | ENTITLEMENT_REVOKED | SUBSCRIPTION_CANCELLED" }

  - name: ComplaintCase
    parent: Account
    common_fields: true
    fields:
