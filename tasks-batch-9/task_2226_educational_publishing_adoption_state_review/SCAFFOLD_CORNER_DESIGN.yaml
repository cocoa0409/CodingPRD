          POST /submissions/{id}/file is PublisherEditor-exclusive, so a SalesRep gets 403
          ERR_ROLE_NOT_PERMITTED and the submission stays DRAFT until the PublisherEditor repeats the
          same call, which then succeeds.
        test_recipe:
          setup:
            - "State VT is OPEN_TERRITORY with min_verified_coverage_pct 50.00 and one ELA standard VT.E.6.1"
