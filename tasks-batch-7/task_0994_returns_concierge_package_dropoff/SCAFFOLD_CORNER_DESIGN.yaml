  # ===================================================== 4. Validations
  - section: validations
    instances:
      - name: caller_missing_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role check."
        test_recipe:
          setup: ["empty DB; the test harness OMITS the auth headers on the trigger call"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/return-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Shopper, captures: { err: $.data.error_id } }
          assert: ["err == ERR_UNAUTHENTICATED"]

      - name: create_order_invalid_enum_method_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_ENUM_INVALID]"]
        distinguishing_aspect: "method=PIGEON is not a declared enum member -> ERR_ENUM_INVALID (400)."
        test_recipe:
          setup: ["Plan; merchant; cycle; shopper"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-EN", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sen@x.com", full_name: "S EN", postal_code: "30038" }, as: Shopper, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: PIGEON, items: [ { sku: "EN", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_ENUM_INVALID"]

      - name: nested_path_existence_left_to_right_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET slots of a non-existent location yields ERR_NOT_FOUND for the parent segment."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/dropoff-locations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/locker-slots", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND"]

      - name: second_open_exception_on_same_order_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_EXCEPTION_OPEN_EXISTS]"]
        distinguishing_aspect: "Opening a second exception while one is non-terminal fails with ERR_EXCEPTION_OPEN_EXISTS."
        test_recipe:
          setup: ["Order IN_TRANSIT (pickup collect done); one OPEN exception"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
