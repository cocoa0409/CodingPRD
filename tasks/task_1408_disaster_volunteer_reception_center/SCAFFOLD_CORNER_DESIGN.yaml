  - section: endpoints
    instances:
      - name: response_envelope_object_and_array_shapes
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every response carries meta.api_request_id + meta.api_request_timestamp; single-resource reads return response_type 'object' with data as a map; list reads return response_type 'array' with data as a list plus limit/offset/total_count/has_more."
        test_recipe:
          setup: ["incident created and ACTIVE with one volunteer"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood F3", ppe_stock: { GLOVES: 1, MASK: 1, HARD_HAT: 1, VEST: 1, GOGGLES: 1 } }, as: VRCManager, captures: { inc: $.data.id } }
