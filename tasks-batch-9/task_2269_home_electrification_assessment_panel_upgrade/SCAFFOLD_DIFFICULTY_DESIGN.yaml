              as_user_id: "reviewer-1"
              captures: { hh_v1: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_a}", assessed_panel_amps: 200, expected_household_version: "${hh_v1}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_a}"
              captures: { asm_id: $.data.id }
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm_id}", contractor_id: "${ctr_a}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1000000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_a}"
              captures: { proj_id: $.data.id }
