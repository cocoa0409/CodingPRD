  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_statement_close
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_STATEMENT_PERIOD_OPEN]
        distinguishing_aspect: |
          Pair state vs business_temporal: a statement-close request that
          violates both (a) the state precondition (statement already CLOSED)
          and (b) the temporal precondition (clock still inside the statement
          month) MUST return ERR_INVALID_STATE_TRANSITION (priority 4) and
          MUST NOT return ERR_STATEMENT_PERIOD_OPEN (priority 7).
