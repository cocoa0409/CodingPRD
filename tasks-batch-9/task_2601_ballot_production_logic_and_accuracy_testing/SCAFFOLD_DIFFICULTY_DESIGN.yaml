  - rule_id: compensating_invariant
    instances:
      - name: ci_lot_receipt_conservation_across_issue_and_recall
        grounds:
          - state_machines.BallotLot.ISSUED_to_RECEIVED
          - entities.BallotLot.fields.unused_quantity
          - entities.Election.fields.total_ballots_issued
          - entities.CustodyEvent
        distinguishing_aspect: |
          POST /ballot-lots/{id}/recall is the exact compensation of POST /ballot-lots/{id}/issue, so
          the identity quantity_received == issued_quantity + unused_quantity must hold after EVERY
          call, including the extreme where the whole pallet is issued (unused 0) and after two
          issue/recall round trips. The derived ledgers must also return to their pre-issue values -
          precinct.ballots_received back to 0, election.total_ballots_issued back to 0 - while the
          CustodyEvent chain does NOT compensate: it grows by one append-only row per call. An
          implementation that decrements a stored counter instead of re-deriving it, or that rewrites
          the custody ledger on recall, drifts here.
        test_recipe:
          setup:
            - "An election in STYLES_LOCKED with locked style S-100, precinct P-001 (registered_voter_count 100, required_ballot_quantity 110) assigned to S-100."
            - "A delivered print job whose single lot L-001 has been RECEIVED with quantity_received 12500, so issued_quantity 0 and unused_quantity 12500."
