      - name: experiment_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - "state_machines Experiment initial_state DRAFT"
          - "entities.Experiment fields status (default DRAFT), redesign_count (default 0), treatment_population and control_population (default 0), power_index, computed_power"
          - "endpoints POST /mmm/experiments side_effects - designed_by_user_id := X-User-ID"
        distinguishing_aspect: |
          A freshly created experiment sits in DRAFT with both realised populations at 0 and both power
          fields still null, even though planned_treatment_population and planned_control_population were
          supplied: the power computation is deferred to lock-design, so an implementation that computes
          power_index at create time fails here.
          
        test_recipe:
          setup:
            - "Market US_CORE and channel A_SEARCH exist. No other experiment exists."
            - "The create is issued by ExperimentDesigner ed-1, whose id must be recorded as designed_by_user_id."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
          trigger:
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp1: "$.data.id" }
          assert:
            - "HTTP 201 with data.status == DRAFT."
            - "data.treatment_population == 0 and data.control_population == 0 - the PLANNED figures 245000 are stored separately and are not copied into the realised fields at create time."
            - "data.power_index == null and data.computed_power == null."
            - "data.redesign_count == 0, data.rejection_reason == null and data.decided_by_user_id == null."
            - "data.designed_by_user_id == ed-1 and data.version == 1."
            - "All four lift fields (measured_lift_pct, lift_ci_half_width_pct, lift_ci_low_pct, lift_ci_high_pct) and synthetic_control_weight are null."
      - name: data_window_reopen_from_open_rejected
        claim_type: invalid_transitions
        grounds:
          - "state_machines DataWindow - the only transition into REOPENED starts from SEALED"
          - "validations priority 40 (state) - ERR_DATA_WINDOW_INVALID_STATE (409) on every action endpoint whose source state has no such transition"
          - "endpoints POST /mmm/data-windows/{id}/reopen input [reason]"
        distinguishing_aspect: |
          reopen is legal only from SEALED: called on an OPEN window it returns 409
          ERR_DATA_WINDOW_INVALID_STATE and leaves reopen_count at 0, while the very same call on the same
          window after a successful seal returns 200 - so the refusal is attributable to the source state
          and not to the request body.
          
