            - { call: "POST /recycle-routes/routes/${r_id}/manifest", payload: { manifest_tracking_number: "MAN-001", disposal_facility_id: "${fac_id}" }, as: RoutePlanner, captures: { man_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${s_id}/pickup-tickets", payload: { client_request_id: "PT-LOOP", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/manifests/${man_id}/submit", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/routes/${r_id}/complete", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/manifests/${man_id}/depart", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/manifests/${man_id}/deliver", payload: {}, as: Driver, as_user_id: "${drv_id}" }
          trigger:
