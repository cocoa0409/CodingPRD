            - "third response: total_count == 2, has_more == true and data holds exactly one task"
            - "fourth response: total_count == 2, has_more == false and data holds exactly one task — the two pages together cover ${task_face_id} and ${task_plate_id} with no repeat"
            - "fifth response: total_count == 1 and data holds only ${task_audio_id} with status == DRAFT and qa_reviewer_id == null"
            - "sixth response: HTTP 400 and ${e_limit} == ERR_VALIDATION — limit must be in [1,100]"
            - "StaffMember.${reviewer_id}.open_qa_assignment_count == 2 and RedactionTask.${task_audio_id}.logged_labor_minutes == 0"
      - name: clock_writes_nothing_and_frozen_instants_survive_a_rewind
        claim_type: Standard CRUD
        grounds:
          - endpoints."POST /_clock/set_current_utc"
          - entities.PublicRecordsRequest.fields.deposit_due_at
          - calculations.statutory_deadline
        distinguishing_aspect: |
          deposit_due_at and statutory_deadline_at are frozen at write time, so rewinding
          the clock from 2026-09-10 back to 2026-08-01 changes neither of them and does
          not bump the request's version.
        test_recipe:
          setup:
            - "The clock is moved forward to 2026-09-10T12:00:00Z; the rewind in the trigger is issued by a QualityReviewer, who holds no other write authority, because every declared role may set the clock."
            - "A GENERAL_PUBLIC request received at that instant over one 120-minute ROUTINE recording is clarified, ruled RESPONSIVE and quoted on a PRESUMPTIVE DVD basis."
            - "That estimate gives billable 90, labor 6300, media 500, subtotal 6800, waiver 0.10 -> credit 680, total 6120 and deposit 3060, so fee_status is DEPOSIT_DUE with deposit_due_at 30 days out."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-10T12:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/staff", payload: { full_name: "Reviewer Probe", role_type: "REVIEWER", redaction_certification_level: 2 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { reviewer_id: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0655", device_serial: "AXON-0655", officer_badge: "B-1152", recorded_start_at: "2026-09-01T09:00:00Z", duration_ms: 7200000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-09-01T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-09-10T12:00:00Z", subject_incident_number: "INC-2026-0655", requested_date_from: "2026-09-01T00:00:00Z", requested_date_to: "2026-09-02T00:00:00Z", scope_narrative: "Two hours of BWC video" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "The two-hour continuous recording", requested_date_from: "2026-09-01T00:00:00Z", requested_date_to: "2026-09-01T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { req_version: $.data.version } }
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "PRESUMPTIVE", media_type: "DVD", expected_request_version: "${req_version}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { est_id: $.data.id } }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { v_before: $.data.version } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: QualityReviewer, as_user_id: "${reviewer_id}" }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1" }
          assert:
            - "first response: HTTP 200 with body current_utc == 2026-08-01T00:00:00Z; the clock accepts a rewind and any role may set it"
            - "second response: PublicRecordsRequest.${req_id}.deposit_due_at == 2026-10-10T12:00:00Z — frozen at estimate time, not re-derived from the rewound clock"
            - "PublicRecordsRequest.${req_id}.statutory_deadline_at == 2026-09-30T12:00:00Z (received_at + 20 days) and tolled_days == 0"
            - "PublicRecordsRequest.${req_id}.version == ${v_before} — setting the clock mutates no entity"
            - "PublicRecordsRequest.${req_id}.fee_status == DEPOSIT_DUE, estimated_total_cents == 6120 and deposit_required_cents == 3060"
            - "FeeEstimate.${est_id}: subtotal_cents == 6800, effective_waiver_pct == 0.10, waiver_credit_cents == 680, status == ACTIVE"

  # ===========================================================================
  # Section 6 — Errors (§1.6). Every code in the catalog must be triggerable;
  # these instances close out the codes no earlier section reaches, and the
  # auth pair is placed first because priority 1 and 2 outrank every other check.
  # ===========================================================================
  - section: errors
    instances:
      - name: missing_x_user_headers_or_unresolvable_identity_returns_unauthenticated
        claim_type: Violation -> Error
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
          - roles.LegalCounsel.identity
        distinguishing_aspect: |
          Priority 1 outranks the not-found check, so a request with an undeclared role
          against a non-existent path id answers 401, never 404, and an entity_backed role
          whose X-User-ID names no StaffMember row is also 401 rather than 403.
        test_recipe:
          setup:
            - "An empty database with the logical clock left at its 2026-08-01T00:00:00Z default; no entity is needed because authentication is decided before anything is looked up."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
          trigger:
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0656", device_serial: "AXON-0656", officer_badge: "B-1153", recorded_start_at: "2026-07-07T09:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-07T00:00:00Z" }, as_user_id: "clerk-1", captures: { e_no_role: $.data.error_id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0657", device_serial: "AXON-0657", officer_badge: "B-1154", recorded_start_at: "2026-07-07T09:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-07T00:00:00Z" }, as: RecordsClerk, as_user_id: "", captures: { e_no_id: $.data.error_id } }
            - { call: "GET /records/requests/00000000-0000-0000-0000-000000000404", as: PressOfficer, as_user_id: "press-1", captures: { e_bad_role: $.data.error_id } }
            - { call: "GET /records/redaction-tasks", as: QualityReviewer, as_user_id: "00000000-0000-0000-0000-000000000404", captures: { e_ghost: $.data.error_id } }
          assert:
            - "first response: HTTP 401 and ${e_no_role} == ERR_UNAUTHENTICATED — X-User-Role is absent"
            - "second response: HTTP 401 and ${e_no_id} == ERR_UNAUTHENTICATED — X-User-ID is present but empty"
            - "third response: HTTP 401 and ${e_bad_role} == ERR_UNAUTHENTICATED, not ERR_REQUEST_NOT_FOUND — PressOfficer is not a declared role and priority 1 precedes priority 4"
            - "fourth response: HTTP 401 and ${e_ghost} == ERR_UNAUTHENTICATED — QualityReviewer is entity_backed:StaffMember and that id resolves to no row"
            - "GET /records/video-assets as RecordsSupervisor returns total_count == 0 — no refused call created anything"
      - name: role_outside_the_endpoints_role_list_returns_unauthorized
        claim_type: Violation -> Error
        grounds:
          - validations.priority_2
          - errors.ERR_UNAUTHORIZED
          - roles.RecordsSupervisor.exclusive_operations
          - roles.LegalCounsel.exclusive_operations
        distinguishing_aspect: |
          Priority 2 is decided from the endpoint's roles list alone, so a well-formed
          supervisor call to an adjudication endpoint is 403 even though the claim exists
          and is perfectly adjudicable by a counsel.
        test_recipe:
          setup:
            - "One request with a RESPONSIVE record carrying one ASSERTED PERSONAL_PRIVACY claim, asserted by counsel A."
            - "The clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
