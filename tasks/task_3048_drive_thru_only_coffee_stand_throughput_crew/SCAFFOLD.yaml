  - method: POST
    path: "/throughput-windows/{windowId}/close"
    description: "Close a window after ends_at; computes final served_count, PASS (served >= target) or BREACH; BREACH increments stand.consecutive_breach_windows (auto-THROTTLE at >= 2)"
    roles: [RegionalManager]
    code: 200
    input: []
    output: ThroughputWindow
    side_effects: ["status -> CLOSED_PASS | CLOSED_BREACH", "stand breach counter update", "possible stand auto-THROTTLE"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint, or entity-backed ownership check failed (operator != agreement.crew_member_id, customer != order.loyalty_account_id, crew != assignment.crew_member_id)" }
  # --- existence / shape ---
  - { id: ERR_INVALID_PAYLOAD, http: 400, condition: "Missing required field, wrong type, invalid enum member, malformed lane_configs, bad revenue_share_pct, SEASONAL recipe without valid season window, retire on non-ACTIVE recipe" }
  - { id: ERR_REGION_NOT_FOUND, http: 404, condition: "Region id does not exist" }
  - { id: ERR_STAND_NOT_FOUND, http: 404, condition: "Stand id does not exist" }
  - { id: ERR_CREW_MEMBER_NOT_FOUND, http: 404, condition: "Crew member id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Operator agreement id does not exist" }
  - { id: ERR_RECIPE_NOT_FOUND, http: 404, condition: "Recipe id does not exist" }
  - { id: ERR_DISTRIBUTION_NOT_FOUND, http: 404, condition: "Recipe distribution id does not exist" }
  - { id: ERR_LOYALTY_ACCOUNT_NOT_FOUND, http: 404, condition: "Loyalty account id does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "Shift id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Shift assignment id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_ORDER_ITEM_NOT_FOUND, http: 404, condition: "Order item id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Payment id does not exist" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "Throughput window id does not exist" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_stand_version / expected_shift_version does not match the parent's current version" }
  # --- state ---
  - { id: ERR_STAND_INVALID_TRANSITION, http: 409, condition: "Stand transition not allowed from current status, or close attempted with a non-drained queue" }
  - { id: ERR_STAND_NOT_ACCEPTING_ORDERS, http: 409, condition: "Order create/merge attempted while stand posture forbids it (app orders require OPEN; window requires OPEN|THROTTLED; merge requires OPEN|THROTTLED)" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement transition not allowed from current status (including activating/reinstating while another agreement is ACTIVE for the stand)" }
  - { id: ERR_SHIFT_INVALID_STATE, http: 409, condition: "Shift transition not allowed from current status, or shift-clock preconditions unmet, or assignment action attempted on wrong shift status" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Assignment not ASSIGNED for check-in/cancel" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "Order queue/build/payment-dimension guard violated (wrong queue_status for merge/call-to-window/abandon/build, wrong build_status for item actions)" }
  - { id: ERR_PAYMENT_INVALID_STATE, http: 409, condition: "Payment transition not allowed from current status (e.g. capture of non-AUTHORIZED, refund of non-CAPTURED, decision on non-pending, handoff without CAPTURED)" }
  - { id: ERR_DISTRIBUTION_INVALID_STATE, http: 409, condition: "Distribution transition not allowed from current status, or activation of a RETIRED recipe" }
  - { id: ERR_WINDOW_INVALID_STATE, http: 409, condition: "Window close attempted on a non-OPEN window" }
  # --- business: safety ---
  - { id: ERR_CERTIFICATION_EXPIRED, http: 422, condition: "Crew member's food-handler certification expires on or before the current logical clock date (assignment creation or operator nomination)" }
  # --- business: temporal ---
  - { id: ERR_SHIFT_IN_PAST, http: 422, condition: "Shift starts_at is not after the current logical clock at creation" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "Crew member already has a non-cancelled assignment whose half-open [starts_at, ends_at) interval intersects the requested one (adjacency allowed)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Throughput window overlaps an existing window on the stand or leaves a gap < 15 minutes to an adjacent one" }
  - { id: ERR_RECIPE_OUT_OF_SEASON, http: 422, condition: "SEASONAL recipe ordered outside [season_start, season_end) at the current logical clock" }
  - { id: ERR_WINDOW_NOT_CLOSABLE, http: 409, condition: "Window close attempted before the logical clock reaches ends_at" }
  # --- business: constraint ---
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "Order created with an empty items array" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "Order item quantity < 1" }
  - { id: ERR_MODIFIER_UNKNOWN, http: 422, condition: "modifier_names contains a name not declared on the recipe" }
  - { id: ERR_ROTATION_STRETCH_EXCEEDED, http: 422, condition: "Single assignment exceeds 120 minutes (rapid role rotation)" }
  - { id: ERR_ASSIGNMENT_OUTSIDE_SHIFT, http: 422, condition: "Assignment interval not contained in its shift's [starts_at, ends_at]" }
  - { id: ERR_PEAK_STAFFING_INSUFFICIENT, http: 422, condition: "Peak shift publish attempted with fewer than 4 non-cancelled assignments" }
  - { id: ERR_LANE_STACKING_FULL, http: 409, condition: "No lane has a free stacking slot (window create or app merge)" }
  - { id: ERR_CAPTURE_OUT_OF_SEQUENCE, http: 409, condition: "An earlier-lane_seq order in the same lane is still awaiting authorization/capture (payment capture sequencing)" }
  - { id: ERR_SITE_STACKING_INSUFFICIENT, http: 422, condition: "Site approval with total lane stacking capacity < 10 cars" }
  - { id: ERR_INGRESS_GAP_INSUFFICIENT, http: 422, condition: "Site approval with min_ingress_gap_seconds < 30" }
  - { id: ERR_TENURE_INSUFFICIENT, http: 422, condition: "Operator nominee has < 365 days tenure at nomination" }
  - { id: ERR_RECIPE_HAS_ACTIVE_DISTRIBUTIONS, http: 409, condition: "Recipe retire attempted while distributions are STAGED, ACTIVATED, or SUSPENDED" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "ends_at not after starts_at on shift, assignment, or throughput window" }
  # --- business: referential ---
  - { id: ERR_DISTRIBUTION_NOT_ACTIVE, http: 409, condition: "Order item references a recipe with no ACTIVATED distribution at the stand" }
  - { id: ERR_SECRET_MENU_TIER_REQUIRED, http: 403, condition: "SECRET recipe ordered without GOLD loyalty tier on the order's account" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Shift publish attempted without an ACTIVE operator agreement for the stand" }
  - { id: ERR_NO_ACTIVE_AGREEMENT_FOR_STAND, http: 409, condition: "Stand open/reopen attempted without an ACTIVE operator agreement" }
  # --- business: fiscal ---
  - { id: ERR_PAYMENT_DECLINED, http: 402, condition: "Authorization with card_token DECLINE" }
  - { id: ERR_REFUND_EXCEEDS_CAPTURED, http: 422, condition: "refunded_cents + amount_cents would exceed captured_cents" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Agreement approver equals nominator, or refund decider equals refund initiator" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Corporate platform administrator; owns regions, site approval, crew records, recipe catalog, distribution staging, loyalty enrollment, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /regions"
      - "POST /stands, POST /stands/{standId}/approve"
      - "POST /crew-members, PATCH /crew-members/{crewMemberId}"
      - "POST /operator-agreements/{agreementId}/approve"
      - "POST /recipes, POST /recipes/{recipeId}/retire"
      - "POST /recipe-distributions"
      - "POST /loyalty-accounts"
    shared_operations:
      - "GET reads across all resources"
      - "POST /loyalty-accounts/{accountId}/points-adjustments (shared with StandOperator)"

  - name: RegionalManager
    description: "Regional franchise overseer; nominates shop operators, suspends/reinstates/terminates agreements, runs throughput windows"
    identity: opaque
    exclusive_operations:
      - "POST /operator-agreements"
      - "POST /operator-agreements/{agreementId}/suspend, /reinstate, /terminate"
      - "POST /throughput-windows, POST /throughput-windows/{windowId}/close"
    shared_operations:
      - "GET reads across all resources"

  - name: StandOperator
    description: "Shop operator selected from internal crew under a regional agreement; X-User-ID is the CrewMember id of the selected operator"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /stands/{standId}/open, /close"
      - "POST /operator-agreements/{agreementId}/activate (self only: X-User-ID == agreement.crew_member_id)"
      - "POST /recipe-distributions/{distributionId}/activate, /suspend, /withdraw"
      - "POST /shifts, /publish, /start, /reconcile, /lock"
      - "POST /shifts/{shiftId}/assignments, POST /shift-assignments/{assignmentId}/cancel"
      - "POST /payments/{paymentId}/refund-decisions"
    shared_operations:
      - "POST /loyalty-accounts/{accountId}/points-adjustments (shared with PlatformAdmin)"
      - "GET reads across all resources"

  - name: ShiftLead
    description: "Working lead on shift; controls the window: throttles, queue advancement, payment capture, refunds, abandonment"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /stands/{standId}/throttle, /resume"
      - "POST /orders/{orderId}/call-to-window, /handoff, /abandon"
      - "POST /payments/{paymentId}/capture, /refunds"
    shared_operations:
      - "POST /orders (WINDOW source tablet ordering, shared with CrewMember)"
      - "POST /orders/{orderId}/payments/authorize (window orders)"
      - "GET reads across all resources"

  - name: CrewMember
    description: "Order-taker / runner / bar crew on tablets; takes window orders, builds drinks, checks into own assignments"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /order-items/{itemId}/start-build, /complete-build"
      - "POST /shift-assignments/{assignmentId}/check-in (self only)"
    shared_operations:
      - "POST /orders (WINDOW source, shared with ShiftLead)"
      - "POST /orders/{orderId}/payments/authorize (window orders)"
      - "GET reads across all resources"

  - name: LoyaltyCustomer
    description: "Loyalty app user; X-User-ID is the LoyaltyAccount id; places app-ahead orders and merges them into a lane on arrival"
    identity: "entity_backed:LoyaltyAccount"
    exclusive_operations:
      - "POST /orders (source LOYALTY_APP, own account only)"
      - "POST /orders/{orderId}/merge (own orders only)"
    shared_operations:
      - "POST /orders/{orderId}/payments/authorize (own orders only)"
      - "GET /orders/{orderId}, GET /loyalty-accounts/{accountId}, GET /stands/{standId}, GET /regions/{regionId}, GET /recipes/{recipeId}, GET /order-items/{itemId}"
