              as: PricingAdmin
              captures: { part_obs_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP-PREM", oem_code: "WHIRLPOOL", description: "Premium replacement pump", category: "MECHANICAL", list_price_cents: 20000, weight_grams: 5400 }
              as: PricingAdmin
              captures: { part_sub_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-4004" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_obs_id}", quantity: 1, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_id: $.data.id }
            - call: "GET /substitute-requests?order_line_id=${line_id}"
              payload: {}
              as: WarrantyAdmin
              captures: { sr_id: "$.data[0].id" }
          trigger:
            - call: "POST /substitute-requests/${sr_id}/decision"
              payload: { decision: "APPROVE", substitute_part_id: "${part_sub_id}", decision_note: "only stock available" }
              as: WarrantyAdmin
              captures: { err_var: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_SUBSTITUTE_PRICE_VARIANCE"
            - "SubstituteRequest.${sr_id}.request_status == PENDING"
            - "SubstituteRequest.${sr_id}.proposed_substitute_part_id == null"
            - "SubstituteRequest.${sr_id}.price_variance_pct == null"
            - "OrderLine.${line_id}.line_status == SUBSTITUTE_PENDING"
            - "OrderLine.${line_id}.resolved_part_id == ${part_obs_id}"
            - "PartOrder.${order_id}.subtotal_cents == 0"

      - name: line_requesting_a_no_longer_available_part_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority_27]
          - errors[ERR_PART_NO_LONGER_AVAILABLE]
          - calculations.supersession_chain_resolution
          - entities.Part.fields.lifecycle_status
        distinguishing_aspect: "An NLA terminal is fatal rather than substitutable: a line requesting an NLA part returns 422 ERR_PART_NO_LONGER_AVAILABLE, creates no OrderLine and — unlike the OBSOLETE terminal — creates no SubstituteRequest."
        test_recipe:
