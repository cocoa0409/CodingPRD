        distinguishing_aspect: "V_G (book 100,000, wholesale with recon 20,000) computes a raw reserve of 95,000 which is floored to MIN_RESERVE_CENTS 100,000 — the floor constant, not the formula, decides the reserve."
        test_recipe:
          setup: ["Clock default. V_G at PHX appraised (provisional floored 50,000), inspection with one approved 20,000 line -> threshold 10,000 exceeded -> WHOLESALE."]
          setup_api_calls:
            - *clock0
