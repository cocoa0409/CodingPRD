  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: consultant_in_home_travel_buffer_overlap
        grounds:
          - validations[priority=10]
          - entities.Consultant.fields.travel_buffer_minutes
          - errors[ERR_CONSULTANT_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource Consultant with BUFFER-PADDED interval semantics: an existing IN_HOME consult
          10:00-11:00 with 60-min buffer occupies 09:00-12:00, so a second IN_HOME consult at
          11:30-12:30 (occupying 10:30-13:30) overlaps and is rejected ERR_CONSULTANT_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Consultant with travel_buffer 60; an existing SCHEDULED IN_HOME consult 10:00-11:00 for client A."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000, travel_buffer_minutes: 60 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent B", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_b_id: $.data.id }
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "IN_HOME", scheduled_start_utc: "2026-06-10T10:00:00Z", scheduled_end_utc: "2026-06-10T11:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
          trigger:
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_b_id}", consultant_id: "${cons_id}", consult_type: "IN_HOME", scheduled_start_utc: "2026-06-10T11:30:00Z", scheduled_end_utc: "2026-06-10T12:30:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CONSULTANT_DOUBLE_BOOKED"

      - name: client_bare_interval_adjacency_allowed
        grounds:
          - validations[priority=10.5]
          - errors[ERR_CLIENT_DOUBLE_BOOKED]
        distinguishing_aspect: |
          DIFFERENT resource (Client) with BARE half-open interval semantics (no buffer): two
          TELEHEALTH consults for the same client at 15:00-16:00 and 16:00-17:00 are ADJACENT and
          must both succeed — sharing the instant 16:00 does not overlap under [start,end). Each
          consult is on a distinct consultant so the consultant axis never conflicts.
        test_recipe:
          setup:
            - "Client A with an existing SCHEDULED TELEHEALTH consult 15:00-16:00 on consultant 1."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons1_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Bea IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons2_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons1_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
          trigger:
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons2_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T16:00:00Z", scheduled_end_utc: "2026-06-10T17:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { adj_id: $.data.id }
          assert:
            - "response status == 201"
            - "Consult.${adj_id}.status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: package_credit_conserved_on_cancel
        grounds:
          - state_machines.Consult.SCHEDULED_to_CANCELLED
          - entities.Client.fields.package_credits_total
          - entities.Client.fields.package_credits_consumed
          - entities.Client.fields.package_credits_remaining
        distinguishing_aspect: |
          Conserved quantity = package credit COUNT: invariant package_credits_total ==
          package_credits_consumed + package_credits_remaining holds before and after. Completing a
          PACKAGE consult consumes 1 (remaining 2), cancelling another committed one returns it, so
          after both, consumed == 1 and remaining == 2 with total == 3 throughout.
        test_recipe:
          setup:
            - "Client with a 3-visit package; two PACKAGE consults — one completed, one scheduled then cancelled."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /service-packages"
              payload: { practice_id: "${prac_id}", name: "THREE_VISIT", included_visits: 3, price_cents: 30000 }
              as: PracticeAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000, package_id: "${pkg_id}" }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "PACKAGE" }
              as: FrontDesk
              captures: { done_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${done_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${done_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${done_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-11T15:00:00Z", scheduled_end_utc: "2026-06-11T16:00:00Z", pay_method: "PACKAGE" }
              as: FrontDesk
              captures: { cancel_id: $.data.id }
          trigger:
            - call: "POST /consults/${cancel_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Client.${client_a_id}.package_credits_total == 3"
            - "Client.${client_a_id}.package_credits_consumed == 1"
            - "Client.${client_a_id}.package_credits_remaining == 2"

      - name: reimbursement_ledger_conserved_on_void
        grounds:
          - state_machines.Superbill.PAID_to_VOID
          - calculations.reimbursement_amount
          - entities.Client.fields.reimbursement_ledger_cents
          - concurrency_rules[void-superbill-stale-client]
        distinguishing_aspect: |
          DIFFERENT conserved quantity = ledger CENTS: voiding a PAID superbill reverses exactly
          reimbursed_amount_cents (15000), returning Client.reimbursement_ledger_cents to its
          pre-payment value 0 — no drift.
        test_recipe:
          setup:
            - "A PAID ACA-preventive superbill (allowed 15000) whose Client ledger is 15000; caller holds the current Client.version."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_a_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /superbills"
              payload: { consult_id: "${consult_a_id}", billed_amount_cents: 25000, allowed_amount_cents: 15000, is_aca_preventive: true }
              as: BillingSpecialist
              captures: { sb_id: $.data.id }
            - call: "POST /superbills/${sb_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /superbills/${sb_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: BillingSpecialist
            - call: "GET /clients/${client_a_id}"
              payload: {}
              as: BillingSpecialist
              captures: { client_ver: $.data.version }
          trigger:
            - call: "POST /superbills/${sb_id}/void"
              payload: { expected_client_version: "${client_ver}" }
              as: BillingSpecialist
          assert:
            - "Superbill.${sb_id}.status == VOID"
            - "Client.${client_a_id}.reimbursement_ledger_cents == 0"
