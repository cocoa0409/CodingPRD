          setup:
            - "One NONE-tier account, one property, three wells and one MASTER technician."
            - "Ticket A stays at INTAKE; tickets B and C are triaged, dispatched, ON_SITE and DIAGNOSED, B with a 20000-cent estimate and C with a 200000-cent estimate."
            - "The clock moves 2026-06-01T09:00:00Z -> 09:37:00Z -> 10:15:00Z so the two dispatched tickets have different response_minutes."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
