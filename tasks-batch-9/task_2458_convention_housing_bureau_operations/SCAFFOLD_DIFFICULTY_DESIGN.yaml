  # =====================================================================================
  # RULE 4 — transitive cascades from DIFFERENT triggers (depth 4 and depth 3)
  # =====================================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reduction_exercise_cascade_depth_four_waitlists_last_reservation
        grounds:
          - state_machines.AttritionReduction.APPROVED_to_EXERCISED
          - calculations.sub_block_reduction_waterfall
          - state_machines.Reservation.reservation_status.CONFIRMED_to_WAITLISTED
          - calculations.attrition_penalty_exposure
          - entities.AttritionReduction.fields.penalty_avoided_cents
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /housing/attrition-reductions/{id}/exercise, where each hop
          is caused by the previous one: the contract shrink (3 -> 2 rooms) forces the waterfall to
          take 1 room from the sub-block, which makes committed_rooms (3) exceed allotted_rooms (2),
          which waitlists the highest intake_seq reservation, which in turn flips that row's
          transmission_status to CHANGE_PENDING and re-derives Event.total_confirmed_room_nights.
        test_recipe:
          setup:
            - "Block of 3 contracted rooms per night, reduction_rights_pct 0.50 -> reduction cap floor(3 * 0.50) == 1 room."
            - "One APPROVED GENERAL sub-block holding all 3 rooms (unassigned_rooms_per_night == 0) on an OPEN block."
            - "Three CONFIRMED reservations, all 2026-09-14..2026-09-18, one per attendee, so committed_rooms == 3 == allotted_rooms; all three already TRANSMITTED in batch 1."
            - "One AttritionReduction for 1 room filed by coord-1 at the default clock 2026-08-01 (before the 2026-08-15 attrition deadline) and APPROVED by ctrl-1."
