      - name: malformed_bodies_are_rejected_before_any_state_or_reference_is_touched
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_PAGINATION]
          - errors[ERR_FIELD_COMBINATION_INVALID]
          - validations[priority=50]
          - validations[priority=52]
          - validations[priority=55]
        distinguishing_aspect: >-
          Three distinct shape codes with three distinct statuses (400 / 400 / 422). The cross-field
          code is 422 and fires for BOTH polarities of each pair — field present when forbidden and
          absent when required — while a bad grid_ref or a bad limit stays a 400.
        test_recipe:
          setup:
            - "P1 and one ACTIVE inspector I1 in FL, with one DRAFT inspection INS1 owned by I1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
