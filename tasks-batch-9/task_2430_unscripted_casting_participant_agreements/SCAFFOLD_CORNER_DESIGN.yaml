          422 but accepts a STUDIO block over the identical interval, and a second
          venue that carries a permit accepts the exterior block. The permit therefore
          gates two of the three kinds and nothing else — a build that required the
          permit unconditionally would reject the STUDIO block.
        test_recipe:
          setup:
            - "One production; one venue with no filming permit; one venue with a filming permit."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
