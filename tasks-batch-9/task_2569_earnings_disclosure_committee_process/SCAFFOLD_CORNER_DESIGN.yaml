      - name: mitigating_the_last_open_deficiency_bubbles_up_to_close_the_correction_and_remediate_the_cycle
        claim_type: bubble_up
        grounds:
          - state_machines.ControlDeficiency.OPEN_to_MITIGATED
          - state_machines.PostFilingCorrection.ASSESSED_to_CLOSED
          - state_machines.ReportingCycle.RESTATEMENT_DECLARED_to_REMEDIATED
          - calculations.correction_materiality_classification
          - calculations.control_deficiency_severity
          - calculations.cycle_unresolved_deficiency_weight
