      - name: format_kit_price_rounds_each_line_then_adds_engineering_fee
        claim_type: Constants Applied
        grounds:
          - calculations.format_kit_price
          - calculations.format_kit_lead_time
          - entities.FormatKit.fields.price_cents
          - entities.FormatKit.fields.component_count
          - endpoints[POST /packaging-oem/format-kits/{formatKitId}/quote]
        distinguishing_aspect: |
          Both kit constants must be applied exactly once and in the declared order: KIT_MARKUP_PCT 17.50
          per component line (250000 x 2 x 1.175 = 587500 and 175000 x 3 x 1.175 = 616875) and
          KIT_ENGINEERING_FEE_CENTS 120000 added LAST, for 1324375 cents. Adding the fee before the markup
          (1324375 vs 1345375) or marking up the summed subtotal are the two natural wrong answers. The
          same quote also fixes quoted_lead_time_days at max(40 + 3, ceil(5/4) + 0 + 5) = 43 days, using
          SAME_FAMILY_DAYS because the kit's PET_ROUND family equals the machine's current_format_family.
