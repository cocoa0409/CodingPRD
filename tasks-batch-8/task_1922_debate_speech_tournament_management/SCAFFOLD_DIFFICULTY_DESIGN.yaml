            - "School.${s_a}.invoice_balance_cents == 16093 (7 x 2299; sum-then-round would give 16092 and is forbidden)"
            - "School.${s_a}.confirmed_entry_count == 7"

      - name: invoice_discount_tier_keyed_on_pre_discount
        grounds:
          - calculations.school_invoice_total
          - entities.School.fields.invoice_balance_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the volume
          discount tier is keyed on the PRE-discount subtotal (51000 -> 5%), then applied;
          the post-discount total 48450 falls below the 50000 threshold yet the 5% tier
