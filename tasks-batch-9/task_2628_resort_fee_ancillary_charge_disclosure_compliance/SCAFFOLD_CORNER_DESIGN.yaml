              as_user_id: "u-rev-1"
          assert:
            - "HTTP 200 with data.id == ${tr_resort}, data.jurisdiction_id == ${j_nv}, data.fee_code == RESORT, data.taxability == TAXABLE"
            - "data.tax_rate_bps == null — the omitted override is stored as null, and the jurisdiction's 1338 is applied at folio time instead of being copied here"
            - "the create returned HTTP 201 with data.version == 1 and a server-minted uuid id and created_at == 2026-08-01T00:00:00Z"
            - "GET /taxability-rules with jurisdiction_id ${j_nv} returns response_type array with data of length 2, total_count 2 and has_more false"
            - "GET /taxability-rules with jurisdiction_id ${j_nv} and fee_code PARKING returns exactly ${tr_park} with tax_rate_bps 400, total_count 1"
            - "GET /taxability-rules with limit 1 and offset 1 returns 1 row with total_count 2 and has_more false; limit 1 and offset 0 returns has_more true"
            - "GET /taxability-rules with taxability EXEMPT returns an empty data array with total_count 0 and has_more false, not a 404"
            - "two ComplianceOfficer-created and PlatformAdmin-created rows are indistinguishable in the payload — TaxabilityRule records no author field"

      - name: profile_action_endpoints_drive_the_declared_transitions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /channel-disclosure-profiles/{id}/deploy]
          - endpoints[POST /channel-disclosure-profiles/{id}/remediate]
          - endpoints[POST /channel-disclosure-profiles/{id}/confirm-remediation]
        excluded_because:
          difficulty_instance: disclosure_profile_deployed_flagged_remediated_redeployed_cycle
          rationale: "That §1.8 cyclic_state_machine instance exercises all four profile action endpoints in one run — deploy, audit, remediate and confirm-remediation — asserting the state after each call, the rescore each one triggers and the absence of a second remediate edge, which is the whole action-endpoint surface for this state machine."

      - name: post_enforces_its_cross_entity_precondition
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /folios/{id}/post]
          - validations[priority=12]
        excluded_because:
          difficulty_instance: folio_post_requires_booking_checked_out_while_itemize_accepts_in_house
          rationale: "The §1.8 cross_entity_state_dependency instance already contrasts the two action endpoints on the same folio: itemize succeeds while the booking is IN_HOUSE and post is rejected with ERR_INVALID_STATE until check-out, then succeeds unchanged — the precondition claim in full."

      - name: require_remediation_fans_out_across_every_in_scope_resource
        claim_type: bulk_action
        grounds:
          - endpoints[POST /regulator-inquiries/{id}/require-remediation]
        excluded_because:
          difficulty_instance: require_remediation_cascades_inquiry_to_profile_to_property_to_bookings
          rationale: "This is the scaffold's only fan-out endpoint, and that §1.8 five_level_cascade instance walks its whole blast radius in one call — every DEPLOYED in-scope profile flagged and appended to flagged_profile_ids, the property posture and counters recomputed, every QUOTED PENDING_AUDIT booking disputed and exposure_cents re-derived — so no separate bulk-semantics corner remains."

  - section: errors
    instances:
      - name: unknown_path_ids_return_the_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_JURISDICTION_NOT_FOUND]
          - errors[ERR_TAXABILITY_RULE_NOT_FOUND]
          - errors[ERR_PROPERTY_NOT_FOUND]
          - errors[ERR_CHANNEL_NOT_FOUND]
          - errors[ERR_PROFILE_NOT_FOUND]
          - errors[ERR_OPT_OUT_REQUEST_NOT_FOUND]
          - errors[ERR_COMPLAINT_NOT_FOUND]
          - errors[ERR_INQUIRY_NOT_FOUND]
          - errors[ERR_REVENUE_MODEL_NOT_FOUND]
        distinguishing_aspect: "Fourteen distinct 404 codes share one priority, so the code must be selected from the ENTITY the missing path segment addresses — never a generic ERR_NOT_FOUND — and on a multi-segment path the LEFTMOST missing segment decides, before the body is looked at."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01; the uuid 00000000-0000-0000-0000-0000000000ff names no row of any table"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "GET /jurisdictions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_JURISDICTION_NOT_FOUND, plus a non-empty data.message and a meta.api_request_id"
            - "the same uuid probed at GET /taxability-rules/{id} returns ERR_TAXABILITY_RULE_NOT_FOUND, at GET /properties/{id} ERR_PROPERTY_NOT_FOUND, at GET /channels/{id} ERR_CHANNEL_NOT_FOUND, at GET /channel-disclosure-profiles/{id} ERR_PROFILE_NOT_FOUND"
            - "and at GET /opt-out-requests/{id} ERR_OPT_OUT_REQUEST_NOT_FOUND, at GET /guest-complaints/{id} ERR_COMPLAINT_NOT_FOUND, at GET /regulator-inquiries/{id} ERR_INQUIRY_NOT_FOUND, at GET /revenue-impact-models/{id} ERR_REVENUE_MODEL_NOT_FOUND — nine different codes, one HTTP status"
            - "and at GET /fee-programs/{id} ERR_FEE_PROGRAM_NOT_FOUND, at GET /fees/{id} ERR_FEE_NOT_FOUND, at GET /bookings/{id} ERR_BOOKING_NOT_FOUND, at GET /folios/{id} ERR_FOLIO_NOT_FOUND, at GET /folio-lines/{id} ERR_FOLIO_LINE_NOT_FOUND"
            - "POST /fee-programs/00000000-0000-0000-0000-0000000000ff/fees with a body that ALSO violates priority 7 (classification \"COMPULSORY\") returns ERR_FEE_PROGRAM_NOT_FOUND, not ERR_INVALID_REQUEST — the path is resolved left to right before the body is parsed"
            - "POST /fees/00000000-0000-0000-0000-0000000000ff/inclusions returns ERR_FEE_NOT_FOUND, and GET /fees/00000000-0000-0000-0000-0000000000ff/inclusions returns the same code rather than an empty list"
            - "every one of these probes leaves the database untouched: GET /jurisdictions still returns total_count 0"

      - name: unknown_body_references_return_not_found_before_state_checks
        claim_type: parent_relationships
        grounds:
          - validations[priority=8]
          - validations[priority=4]
          - errors[ERR_PROPERTY_NOT_FOUND]
        distinguishing_aspect: "Body-borne foreign keys resolve at priority 8, which sits BELOW the two ownership rules at priorities 4 and 5 — so a ChannelOperator naming a channel that does not exist gets a 403 ownership error, while the very same request naming an unknown fee program gets a 404."
        test_recipe:
          setup:
            - "One jurisdiction and one ACTIVE property; no channels, programs or profiles yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "POST /fee-programs"
              payload: { property_id: "00000000-0000-0000-0000-0000000000ff", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
          assert:
            - "HTTP 404 with data.error_id == ERR_PROPERTY_NOT_FOUND"
            - "data.error_id != ERR_STALE_PROPERTY_VERSION even though expected_property_version cannot possibly match a non-existent property — priority 8 precedes priority 10"
            - "data.error_id != ERR_INVALID_REQUEST: a well-formed uuid that resolves to nothing is a 404, not a shape violation, so priority 7 passes it through"
            - "POST /taxability-rules with jurisdiction_id 00000000-0000-0000-0000-0000000000ff returns ERR_JURISDICTION_NOT_FOUND, and POST /properties with the same bogus jurisdiction_id returns the same code"
            - "POST /channel-disclosure-profiles from a REGISTERED channel operator naming fee_program_id 00000000-0000-0000-0000-0000000000ff returns ERR_FEE_PROGRAM_NOT_FOUND"
            - "the same POST /channel-disclosure-profiles naming channel_id 00000000-0000-0000-0000-0000000000ff returns HTTP 403 ERR_CHANNEL_OWNERSHIP_REQUIRED instead, because priority 4 requires the body's channel_id to equal X-User-ID and fires long before the body's FK sweep"
            - "GET /fee-programs still returns total_count 0 — no partially built row is left behind by any rejected reference"

      - name: requests_missing_the_auth_headers_are_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "Authentication is evaluated at priorities 1 and 2, ahead of every other rule including path existence — so a header-less request to a non-existent id returns 401 rather than 404, and GET /_clock is the single documented exemption."
        test_recipe:
          setup:
            - "One jurisdiction and one ACTIVE property, so that a 404 is NOT the reason any of these calls fail"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "GET /properties/${p1}"
              payload: {}
              as: Anonymous
          assert:
            - "with both X-User-Role and X-User-ID absent: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "X-User-Role present as PlatformAdmin but X-User-ID absent or empty: still HTTP 401 ERR_UNAUTHENTICATED — both headers are required, not either"
            - "X-User-ID present but X-User-Role absent: HTTP 401 ERR_UNAUTHENTICATED"
            - "X-User-Role \"Concierge\" with a non-empty X-User-ID: HTTP 401 with data.error_id == ERR_UNKNOWN_ROLE, since Concierge is not one of the seven roles in §1.7"
            - "the same header-less request against GET /properties/00000000-0000-0000-0000-0000000000ff returns ERR_UNAUTHENTICATED, not ERR_PROPERTY_NOT_FOUND — priority 1 outranks priority 6"
            - "a header-less POST /jurisdictions with a valid body returns ERR_UNAUTHENTICATED and creates nothing: GET /jurisdictions with credentials still returns total_count 1"
            - "GET /_clock succeeds with no headers at all and returns the current logical clock 2026-08-01T00:00:00Z — it is the only exempted endpoint"

      - name: a_channel_operator_reaching_into_another_channel_is_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_CHANNEL_OWNERSHIP_REQUIRED]
        distinguishing_aspect: "Two different 403s guard the same call: ERR_FORBIDDEN_ROLE when the acting ROLE is absent from the endpoint's roles list, and ERR_CHANNEL_OWNERSHIP_REQUIRED when the role is allowed but the addressed resource belongs to a different channel — and the ownership check runs before any state check."
        test_recipe:
          setup:
            - "3-FEE PUBLISHED PROGRAM with a DEPLOYED OTA profile owned by channel ${c_ota}"
