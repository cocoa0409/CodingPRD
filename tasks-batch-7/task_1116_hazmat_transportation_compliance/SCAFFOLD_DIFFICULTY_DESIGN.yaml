  # ---------------------------------------------------------------- rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_load_half_open_adjacency_allowed
        grounds:
          - validations[priority=17]
          - entities.VehicleLoad.fields.planned_departure_at
        distinguishing_aspect: |
          Resource Vehicle with half-open interval semantics: a load starting
          exactly when another ends ([08:00,12:00) vs [12:00,16:00)) is allowed;
          a truly overlapping window ([11:00,13:00)) is rejected.
        test_recipe:
          setup:
            - "Carrier APPROVED_ACTIVE; vehicle with one STAGING load occupying [2026-05-10T08:00:00Z, 2026-05-10T12:00:00Z)"
          setup_api_calls:
