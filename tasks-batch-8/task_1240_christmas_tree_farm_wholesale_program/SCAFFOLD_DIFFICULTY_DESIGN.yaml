            - "BuyerAccount.${buy}.exposure_cents == 4000 after successful submit (10 * 400, no tier)"

      - name: ticket_gated_by_block_rotation_state
        grounds:
          - validations[priority=11]
          - entities.Block.fields.rotation_state
        distinguishing_aspect: |
          Entity pair HarvestTicket -> Block (different pair than Order->Buyer):
          a ticket is legal only while the referenced block's rotation_state is
          HARVESTABLE; on a GROWING block the same well-formed ticket is rejected.
        test_recipe:
          setup:
            - "Season in HARVEST; block only advanced to GROWING; crew ACTIVE; allocation of 10 exists against the block's lot"
          setup_api_calls:
