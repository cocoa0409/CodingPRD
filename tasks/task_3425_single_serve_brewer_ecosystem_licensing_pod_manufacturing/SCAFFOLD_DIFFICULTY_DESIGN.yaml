              as: OperationsDirector
              captures: { tc1_line: $.data.id }
            - call: "POST /production-runs"
              payload: { line_id: "${tc1_line}", variety_id: "${tc1_vl}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 50000 }
              as: ProductionPlanner
              captures: { tc1_run: $.data.id }
          trigger:
            - call: "POST /license-agreements/${tc1_ag}/quality-audits"
              payload: { audited_at: "2026-09-01T00:00:00Z", cup_score: 70, defect_rate_ppm: 50 }
              as: QualityAuditor
              captures: { tc1_audit: $.data.result }
          assert:
            - "QualityAudit.result == FAIL (cup 70 < min 80)"
            - "hop 1: LicenseAgreement.${tc1_ag}.status == SUSPENDED"
            - "hop 2: PodVariety.${tc1_vl}.status == SUPPLY_BLOCKED while unrelated PodVariety.${tc1_vp}.status == ACTIVE"
            - "hop 3: ProductionRun.${tc1_run}.status == CANCELLED (was RESERVED)"
            - "hop 4: the freed window accepts a new run for the unaffected variety — POST /production-runs {line ${tc1_line}, variety ${tc1_vp}, window 2026-09-10T00:00:00Z..2026-09-11T00:00:00Z, planned 50000} returns 201"

      - name: license_terminate_depth3_cascade
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_TERMINATED
          - state_machines.PodVariety.ACTIVE_to_DELISTED
          - state_machines.ProductionRun.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (manual TERMINATE, not audit FAIL):
          agreement TERMINATED -> variety ACTIVE -> DELISTED (a different target state than
          SUPPLY_BLOCKED) -> RESERVED runs CANCELLED — and DELISTED is terminal so the
          variety can never be produced or brewed again.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Licensed brand with ACTIVE agreement, ACTIVE variety, RESERVED run 2026-09-10..2026-09-11 planned 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
