      - name: parallel_dimensions_change_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.MaterialOrder.settlement_status
        excluded_because:
          difficulty_instance: material_order_parallel_dimensions_move_independently
          rationale: "The §1.8 non_linear_state_machine instance already drives the two MaterialOrder dimensions apart and asserts the combined (FULFILLED, CREDIT_MEMO_ISSUED) state plus the untouched fulfillment axis, which is exactly the `parallel` shape claim."

      - name: cyclic_shape_loop_count_respected
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ClaimCase
        excluded_because:
          difficulty_instance: claim_case_cycles_through_info_requested_twice
          rationale: "The §1.8 instance loops UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW twice and asserts review_round == 3, covering both the loop and its counter."

      - name: compensation_side_effects_fully_reversed
        claim_type: compensation
        grounds:
          - state_machines.MaterialOrder.fulfillment_status
        excluded_because:
          difficulty_instance: order_cancel_restores_reservation_prebuy_credit_and_purchase_order
          rationale: "The §1.8 compensating_invariant instance asserts that reservation, pre-buy draw, credit usage and PO commitment all return to their exact pre-confirm values with no drift, which is the Compensation pattern claim."

      - name: cross_entity_side_effect_chain_verified
        claim_type: cross_entity
        grounds:
          - state_machines.DeliveryLoad
          - state_machines.ContractorAccount
        excluded_because:
          difficulty_instance: delivery_repricing_cascades_to_credit_hold_and_cancels_queued_ticket
          rationale: "The §1.8 transitive_cascade instance follows the delivery's five-hop cross-entity chain into the account's CREDIT_HOLD and the sibling ticket's cancellation, asserting each intermediate entity's state and fields."

      - name: ledger_sync_reconciles_ancestor_derived_field
        claim_type: ledger_sync
        grounds:
          - state_machines.ClaimCase
          - calculations.account_credit_position
        excluded_because:
          difficulty_instance: claim_settlement_cascades_to_credit_memo_and_releases_hold
          rationale: "The §1.8 transitive_cascade instance reconciles MaterialOrder.credit_memo_cents and the account's credit_used_cents before and after the claim settlement, which is the Ledger sync claim."

      - name: guarded_transition_requires_other_entity_state
        claim_type: guarded transitions
        grounds:
          - state_machines.DeliveryLoad
          - state_machines.InventoryLot
        excluded_because:
          difficulty_instance: dispatch_blocked_while_pinned_lot_is_quarantined_then_allowed_after_release
          rationale: "The §1.8 cross_entity_state_dependency instance tests the dispatch guard in both directions (blocked while the pinned lot is QUARANTINED, allowed once it returns to AVAILABLE), covering the guarded-transition claim."

  - section: calculations
    instances:
      - name: queue_ranking_puts_prebuy_priority_ahead_of_the_earlier_request
        claim_type: correct_result
        grounds:
          - calculations.will_call_queue_ranking
          - endpoints[POST /will-call-tickets/stage-next]
        distinguishing_aspect: "priority_class DESC is the first sort key, so a ticket whose order draws on a pre-buy contract (class 2, requested 08:00) outranks a plain ticket requested two hours earlier (class 1, 06:00); queue_position reflects the same ordering."
        test_recipe:
          setup:
            - "One prebuy-eligible material at 2000 cents/cy with an ACTIVE pre-buy contract locking 1800 cents/cy for 50 cubic yards over the 2026-06-01..2026-12-31 season."
            - "Two CONFIRMED WILL_CALL orders on one ACTIVE account, each with a single 4.0 cubic-yard BULK line; only the second draws on the pre-buy contract."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "SALT-C1", name: "Queue Salt", offered_forms: [BULK], seasonal_category: "SALT", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: true }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 200.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
            - call: "POST /contractor-accounts"
              payload: { business_name: "Queue Priority Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /prebuy-contracts"
              payload: { contractor_account_id: "${acct_id}", material_id: "${mat_id}", locked_price_per_cubic_yard_cents: 1800, contracted_cubic_yards: 50.0, season_start_date: "2026-06-01", season_end_date: "2026-12-31" }
              as: YardAdmin
              captures: { pb_id: $.data.id }
