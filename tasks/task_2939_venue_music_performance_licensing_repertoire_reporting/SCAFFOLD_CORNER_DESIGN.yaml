            - call: "POST /licensing/license-applications/${app_p1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app_p1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app_p1_id}" }
              as: LicensingAdmin
              captures: { lic_p1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic_p1_id}/activate"
              payload: {}
