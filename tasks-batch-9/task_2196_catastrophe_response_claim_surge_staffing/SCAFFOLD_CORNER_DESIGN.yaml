              payload: {}
              as: CatastropheManager
              as_user_id: "mgr-01"
              captures: { ev_v: $.data.version }
          trigger:
            - call: "POST /loss-estimates"
              payload: { event_id: "${ev}", method: "EXPOSURE_BASED", expected_event_version: "${ev_v}" }
              as: CatastropheManager
              as_user_id: "mgr-01"
          assert:
            - "HTTP 201 with data.gross_estimate == 35000000.00, data.ibnr_component == 35000000.00 and data.reported_component == 0.00"
            - "HTTP 201 with data.input_reserve_sequence_high_water == 0 and data.stale == false"
            - "GET /catastrophe-events/${ev} as CatastropheManager returns version == 3 and gross_loss_estimate == 35000000.00"

      - name: corner_ccl_occ_loss_estimate_stale_event_version_rejected
