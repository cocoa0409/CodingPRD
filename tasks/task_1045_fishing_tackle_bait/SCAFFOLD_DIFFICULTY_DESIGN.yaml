      - name: tournament_finalize_zero_qualified_entries_empty_set
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_NO_QUALIFIED_ENTRIES]"
          - "calculations.tournament_ranking"
        distinguishing_aspect: "Empty-set boundary via POST /api/tournaments/{id}/status FINALIZED: the only weigh-in (999 g) is below min_qualifying (1000 g), so the qualifying set is empty (count 0) and finalize is rejected; a different metric (collection cardinality) reached through a different endpoint than the seat boundary."
        test_recipe:
          setup:
            - "Clock 2026-07-20T08:00Z. Tournament T (species BASS, window 06:00-18:00 same day, min_qualifying 1000). Customer C is REGISTERED, tournament IN_PROGRESS, C CHECKED_IN, one weigh-in of 999 g recorded (non-qualifying)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T08:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "C Fish", email: "c.bp2@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
            - call: "POST /api/tournaments"
              payload: { name: "Bass Open", species: "BASS", start_at: "2026-07-20T06:00:00Z", end_at: "2026-07-20T18:00:00Z", min_qualifying_weight_grams: 1000 }
              as: ShopManager
              captures: { t_id: "$.data.id" }
            - call: "POST /api/tournaments/${t_id}/status"
              payload: { status: "OPEN" }
              as: ShopManager
            - call: "POST /api/tournament-entries"
              payload: { tournament_id: "${t_id}", customer_id: "${c_id}" }
              as: ShopClerk
              captures: { e_id: "$.data.id" }
            - call: "POST /api/tournaments/${t_id}/status"
              payload: { status: "IN_PROGRESS" }
              as: ShopManager
            - call: "POST /api/tournament-entries/${e_id}/status"
              payload: { status: "CHECKED_IN" }
              as: ShopClerk
            - call: "POST /api/tournament-entries/${e_id}/weigh-in"
              payload: { species: "BASS", weight_grams: 999 }
              as: ShopClerk
          trigger:
            - call: "POST /api/tournaments/${t_id}/status"
              payload: { status: "FINALIZED" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NO_QUALIFIED_ENTRIES"
            - "Tournament.${t_id}.status == IN_PROGRESS"

  # =================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: charter_booking_requires_active_license
