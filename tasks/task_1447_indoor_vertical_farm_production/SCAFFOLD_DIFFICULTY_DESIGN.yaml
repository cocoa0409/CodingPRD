          Mode (c) — circular-looking dependency pinned by an explicit evaluation order: the score
          reads projected supply EXCLUDING FAILED/PLANNED batches at creation time and is frozen
          on the row; a later approval that creates a replacement batch never recomputes the
          still-QUEUED sibling's score (150000.00 stays 150000.00 even after supply changes).
        test_recipe:
          setup:
            - "Crop KALE-01 margin 300; ACTIVE recipe (21d, 12.5 lb/tower); racks R-01 (WL-A) and R-02 (WL-B), 8 towers each"
