        distinguishing_aspect: "A PARSONAGE with alternative_use_score 4 has score_rate 0.70 exactly equal to its type cap 0.70, and its 92-day-old appraisal is inside APPRAISAL_SEASONING_DAYS, so the value is the plain 70000000 with no seasoning haircut."
