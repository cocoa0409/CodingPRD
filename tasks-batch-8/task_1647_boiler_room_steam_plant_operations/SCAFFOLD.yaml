scenario: |
  Boiler Room & Steam Plant Operations (campus/industrial steam plant): boiler log & operator licensing by state, water chemistry treatment & blowdown control, fuel consumption & efficiency tracking, annual inspection & certificate posting, safety valve testing & relief setpoint, steam trap survey & loss quantification, load scheduling & lead/lag boiler, emergency shutdown & incident

domain_name: boiler-room-steam-plant
api_prefix: /plants

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant display name" }
      - { name: state_code, type: enum, source: input, description: "US state code (MA | NY | CA | TX) governing licensing & inspection rules" }
      - { name: header_pressure_psi, type: number, source: input, description: "Steam header operating pressure setpoint" }
      - { name: header_pressure_actual_psi, type: number, source: computed, description: "Most recent header pressure reading; derived from latest BoilerLogEntry.header_pressure_reading_psi across ONLINE boilers, else 0" }
      - { name: fuel_inventory_gal, type: number, source: computed, default: 0, description: "Current fuel oil on hand; = total_fuel_received_gal - total_fuel_consumed_gal (never negative)" }
      - { name: total_fuel_received_gal, type: number, source: computed, default: 0, description: "Cumulative fuel delivered via POST fuel-deliveries" }
      - { name: total_fuel_consumed_gal, type: number, source: computed, default: 0, description: "Cumulative fuel consumed; sum of BoilerLogEntry.fuel_burned_gal on non-VOIDED entries" }
      - { name: posture, type: enum, source: computed, default: "NORMAL", description: "NORMAL | DEGRADED | EMERGENCY — derived from boiler statuses and active Incident severity" }
      - { name: lead_boiler_id, type: string, source: computed, description: "Currently designated lead boiler id (computed by lead_lag_dispatch_selection selector; null if no boiler is ONLINE-able)" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run_ops" }

  - name: Boiler
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; parent plant" }
      - { name: tag, type: string, source: input, description: "Boiler tag (e.g. 'B-101'); unique within plant" }
      - { name: rated_capacity_lb_hr, type: integer, source: input, description: "Nameplate steam capacity in lb/hr" }
      - { name: relief_valve_setpoint_psi, type: number, source: input, description: "Safety valve relief setpoint; must be > header_pressure_psi of parent plant" }
      - { name: relief_valve_tolerance_pct, type: number, source: input, default: 3.0, description: "Allowed accumulation tolerance; relief must lift within setpoint * (1 + tolerance_pct/100)" }
      - { name: ops_status, type: enum, source: system, default: "STANDBY", description: "STANDBY | WARMING | ONLINE | BANKING | TRIPPED | DECOMMISSIONED — parallel dimension 1" }
      - { name: cert_status, type: enum, source: system, default: "VALID", description: "VALID | EXPIRING | LAPSED | SUSPENDED — parallel dimension 2, driven by Inspection records" }
      - { name: water_status, type: enum, source: system, default: "IN_SPEC", description: "IN_SPEC | OUT_OF_SPEC | CRITICAL — parallel dimension 3, driven by ChemistryLog" }
      - { name: cycles_of_concentration, type: number, source: computed, default: 1.0, description: "= conductivity_boiler_umho / conductivity_feedwater_umho from latest non-VOIDED ChemistryLog" }
      - { name: total_steam_lb, type: number, source: computed, default: 0, description: "Cumulative steam generated; sum of BoilerLogEntry.steam_generated_lb on non-VOIDED entries" }
      - { name: total_fuel_burned_gal, type: number, source: computed, default: 0, description: "Cumulative fuel burned; sum of BoilerLogEntry.fuel_burned_gal on non-VOIDED entries" }
      - { name: total_blowdown_gal, type: number, source: computed, default: 0, description: "Cumulative blowdown volume" }
      - { name: total_feedwater_gal, type: number, source: computed, default: 0, description: "Cumulative feedwater intake" }
      - { name: efficiency_pct, type: number, source: computed, description: "Cached combustion efficiency from most recent efficiency calculation variant (see calculations)" }

  - name: Operator
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; parent plant" }
      - { name: full_name, type: string, source: input, description: "Operator full legal name" }
      - { name: license_class, type: enum, source: input, description: "CLASS_1 | CLASS_2 | CLASS_3 — higher class can supervise lower" }
      - { name: license_state, type: enum, source: input, description: "US state that issued the license" }
      - { name: license_expires_on, type: datetime, source: input, description: "License expiry date (ISO 8601 UTC date)" }
      - { name: license_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXPIRING | EXPIRED | REVOKED — recomputed daily by run_ops vs plant clock" }
      - { name: is_lead_qualified, type: boolean, source: input, default: false, description: "Whether operator may serve as shift lead" }

  - name: BoilerLogEntry
    parent: Boiler
    common_fields: false
    fields:
      - { name: boiler_id, type: string, source: system, description: "FK -> Boiler.id; parent boiler" }
      - { name: recorded_by_operator_id, type: string, source: input, description: "FK -> Operator.id; operator who took the reading" }
      - { name: recorded_at, type: datetime, source: input, description: "Timestamp of the reading" }
      - { name: header_pressure_reading_psi, type: number, source: input, description: "Observed header pressure at reading time" }
      - { name: steam_generated_lb, type: number, source: input, description: "Steam produced during this log interval" }
      - { name: fuel_burned_gal, type: number, source: input, description: "Fuel consumed during this log interval" }
      - { name: feedwater_intake_gal, type: number, source: input, description: "Feedwater added during this interval" }
      - { name: blowdown_gal, type: number, source: input, description: "Blowdown discharged during this interval" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | VERIFIED | VOIDED — verification by a second operator required for compliance" }

  - name: ChemistryLog
    parent: Boiler
    common_fields: false
    fields:
      - { name: boiler_id, type: string, source: system, description: "FK -> Boiler.id; parent boiler" }
      - { name: recorded_by_operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: recorded_at, type: datetime, source: input, description: "Reading timestamp" }
      - { name: conductivity_boiler_umho, type: number, source: input, description: "Boiler water conductivity (µmho/cm)" }
      - { name: conductivity_feedwater_umho, type: number, source: input, description: "Feedwater conductivity (µmho/cm); must be > 0" }
      - { name: sulfite_residual_ppm, type: number, source: input, description: "Sulfite residual (oxygen scavenger)" }
      - { name: phosphate_residual_ppm, type: number, source: input, description: "Phosphate residual" }
      - { name: status, type: enum, source: system, default: "RECORDED", description: "RECORDED | VOIDED" }

  - name: Inspection
    parent: Boiler
    common_fields: true
    fields:
      - { name: boiler_id, type: string, source: system, description: "FK -> Boiler.id; inspected boiler" }
      - { name: inspection_kind, type: enum, source: input, description: "ANNUAL_INTERNAL | ANNUAL_EXTERNAL | RELIEF_VALVE_POP | POST_INCIDENT" }
      - { name: scheduled_on, type: datetime, source: input, description: "Date inspection is scheduled" }
      - { name: inspector_name, type: string, source: input, description: "Licensed inspector's name" }
      - { name: inspector_license_no, type: string, source: input, description: "Inspector's jurisdictional license number" }
      - { name: relief_valve_lift_pressure_psi, type: number, source: input, description: "Measured lift pressure of the relief valve during pop test (only for RELIEF_VALVE_POP); null otherwise" }
      - { name: outcome, type: enum, source: system, default: "PENDING", description: "PENDING | PASSED | FAILED | CONDITIONAL" }
      - { name: certificate_number, type: string, source: input, description: "State certificate number issued on PASSED outcome; null otherwise" }
      - { name: certificate_expires_on, type: datetime, source: input, description: "Certificate expiry (1 year from PASSED for annual; null otherwise)" }
      - { name: posted_at, type: datetime, source: system, description: "Timestamp certificate was posted; null until POST .../post" }

  - name: SteamTrap
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; parent plant" }
      - { name: tag, type: string, source: input, description: "Trap tag (e.g. 'ST-207'); unique within plant" }
      - { name: location, type: string, source: input, description: "Physical location description" }
      - { name: orifice_diameter_in, type: number, source: input, description: "Orifice diameter in inches (drives leak rate)" }
      - { name: design_pressure_psi, type: number, source: input, description: "Trap's design operating pressure" }
      - { name: last_surveyed_at, type: datetime, source: system, description: "Timestamp of latest survey result; null if never surveyed" }
      - { name: condition, type: enum, source: system, default: "UNKNOWN", description: "UNKNOWN | OK | LEAKING | FAILED_OPEN | FAILED_CLOSED | COLD" }
      - { name: leak_rate_lb_hr, type: number, source: computed, default: 0, description: "Estimated leak rate; 0 unless condition in {LEAKING, FAILED_OPEN}" }
      - { name: status, type: enum, source: system, default: "IN_SERVICE", description: "IN_SERVICE | ISOLATED | REPLACED" }

  - name: LoadDispatch
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; parent plant" }
      - { name: window_start_at, type: datetime, source: input, description: "Dispatch window start (UTC, inclusive)" }
      - { name: window_end_at, type: datetime, source: input, description: "Dispatch window end (UTC, exclusive) — half-open interval [start, end)" }
      - { name: target_steam_lb_hr, type: integer, source: input, description: "Total steam demand for the window" }
      - { name: assigned_boiler_ids, type: array, source: input, description: "Ordered list of boiler ids; first element is lead, remaining are lag (in dispatch order)" }
      - { name: expected_lead_boiler_id, type: string, source: computed, description: "Computed lead boiler id per selector policy at creation time" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED" }

  - name: Incident
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; parent plant" }
      - { name: raised_by_operator_id, type: string, source: input, description: "FK -> Operator.id; operator who raised the incident" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: kind, type: enum, source: input, description: "OVERPRESSURE | LOW_WATER | FLAME_FAILURE | RELIEF_VALVE_LIFT | CHEMISTRY_EXCURSION | OTHER" }
      - { name: triggered_boiler_id, type: string, source: input, description: "FK -> Boiler.id; boiler at fault (nullable for plant-wide events)" }
      - { name: raised_at, type: datetime, source: input, description: "Time incident was observed" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | ACKNOWLEDGED | MITIGATED | CLOSED" }
      - { name: resolution_notes, type: string, source: input, description: "Free-text notes on resolution; required to CLOSE" }

  - name: FuelDelivery
    parent: Plant
    common_fields: false
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; receiving plant" }
      - { name: delivered_at, type: datetime, source: input, description: "Timestamp of delivery" }
      - { name: quantity_gal, type: number, source: input, description: "Gallons delivered; must be > 0" }
      - { name: supplier, type: string, source: input, description: "Fuel supplier name" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Boiler
    initial_state: STANDBY  # ops_status dimension
    terminal_states: [DECOMMISSIONED]
    transitions:
      # --- ops_status transitions (parallel dimension 1) ---
      - from: STANDBY
        to: WARMING
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/warm"
        actor: Operator
        preconditions:
          - "Boiler.cert_status == VALID (ERR_CERT_NOT_VALID)"
          - "Boiler.water_status != CRITICAL (ERR_WATER_CRITICAL)"
          - "Plant.posture != EMERGENCY (ERR_PLANT_EMERGENCY)"
          - "Calling operator.license_status == ACTIVE (ERR_OPERATOR_LICENSE_INVALID)"
          - "Calling operator.license_state == Plant.state_code (ERR_LICENSE_WRONG_STATE)"
        side_effects:
          - "Boiler.updated_at refreshed; Boiler.version += 1"

      - from: WARMING
        to: ONLINE
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/bring-online"
        actor: Operator
        preconditions:
          - "Boiler.cert_status == VALID"
          - "Boiler.water_status == IN_SPEC (ERR_WATER_OUT_OF_SPEC)"
          - "At least one non-VOIDED ChemistryLog exists with cycles_of_concentration <= MAX_CYCLES (ERR_NO_VALID_CHEMISTRY)"
          - "Calling operator.license_status == ACTIVE AND license_class in {CLASS_1, CLASS_2}"
        side_effects:
          - "If Plant.lead_boiler_id is null OR calling boiler has higher rated_capacity_lb_hr than current lead, Plant.lead_boiler_id := this boiler.id (selector: ONLINE boilers, sort rated_capacity_lb_hr DESC, tie-break created_at ASC, fallback: keep current lead)"
          - "Plant.header_pressure_actual_psi recomputed from latest log entries across ONLINE boilers"

      - from: ONLINE
        to: BANKING
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/bank"
        actor: Operator
        preconditions:
          - "Boiler is not the current lead boiler when at least one other boiler is ONLINE (ERR_LEAD_CANNOT_BANK)"
        side_effects:
          - "If this was the lead boiler, Plant.lead_boiler_id recomputed across remaining ONLINE boilers (same selector)"

      - from: BANKING
        to: ONLINE
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/bring-online"
        actor: Operator
        preconditions:
          - "Boiler.cert_status == VALID"
          - "Boiler.water_status == IN_SPEC"
        side_effects:
          - "Lead-boiler selector re-evaluated"

      - from: ONLINE
        to: STANDBY
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/shutdown"
        actor: Operator
        preconditions: []
        side_effects:
          - "Lead-boiler selector re-evaluated across remaining ONLINE boilers; may set lead to null"

      - from: BANKING
        to: STANDBY
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/shutdown"
        actor: Operator
        preconditions: []
        side_effects: []

      - from: WARMING
        to: STANDBY
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/shutdown"
        actor: Operator
        preconditions: []
        side_effects: []

      - from: STANDBY
        to: TRIPPED
        trigger: "system (automatic on Incident with severity in {HIGH, CRITICAL} and kind in {OVERPRESSURE, LOW_WATER, FLAME_FAILURE, RELIEF_VALVE_LIFT} where triggered_boiler_id == this boiler)"
        actor: system
        preconditions: []
        side_effects:
          - "If this was lead boiler: Plant.lead_boiler_id recomputed (may go null)"
          - "Plant.posture := DEGRADED if any ONLINE boiler remains, else EMERGENCY"
          - "All SCHEDULED LoadDispatch windows containing this boiler and whose window_start_at > now are CANCELLED (cascade depth 2)"
          - "Each cancelled LoadDispatch triggers a lag-dispatch re-evaluation (cascade depth 3): if any window becomes ACTIVE-eligible within 15 minutes, system auto-creates a new LoadDispatch with remaining ONLINE boilers per selector"

      - from: ONLINE
        to: TRIPPED
        trigger: "system (automatic on Incident as above; or on relief valve pop test FAILED outcome on this boiler)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as STANDBY→TRIPPED"
          - "If triggered by RELIEF_VALVE_LIFT incident OR pop test FAILED: Boiler.cert_status := SUSPENDED (separate dimension)"

      - from: WARMING
        to: TRIPPED
        trigger: "system (automatic on Incident as above)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as STANDBY→TRIPPED"

      - from: BANKING
        to: TRIPPED
        trigger: "system (automatic on Incident as above)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as STANDBY→TRIPPED"

      - from: TRIPPED
        to: STANDBY
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/reset"
        actor: Operator
        preconditions:
          - "All Incidents with triggered_boiler_id == this boiler AND severity in {HIGH, CRITICAL} have status in {MITIGATED, CLOSED} (ERR_INCIDENT_UNRESOLVED)"
          - "If cert_status == SUSPENDED: a POST_INCIDENT Inspection with outcome == PASSED exists on this boiler after the most recent TRIPPED transition (ERR_REINSPECTION_REQUIRED)"
        side_effects:
          - "Boiler.cert_status recomputed from latest Inspection (may return SUSPENDED→VALID)"
          - "Plant.posture recomputed"

      - from: STANDBY
        to: DECOMMISSIONED
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/decommission"
        actor: PlantManager
        preconditions:
          - "Boiler.ops_status == STANDBY"
          - "No SCHEDULED or ACTIVE LoadDispatch references this boiler (ERR_BOILER_IN_DISPATCH)"
        side_effects:
          - "Terminal; no further transitions"

      # --- cert_status transitions (parallel dimension 2) ---
      - from: VALID
        to: EXPIRING
        trigger: "system (automatic in run_ops when latest PASSED Inspection's certificate_expires_on is within CERT_EXPIRING_WINDOW_DAYS of plant clock)"
        actor: system
        preconditions: []
        side_effects: []
        note: "cert_status dimension — independent of ops_status"

      - from: EXPIRING
        to: LAPSED
        trigger: "system (automatic in run_ops when certificate_expires_on < plant clock)"
        actor: system
        preconditions: []
        side_effects:
          - "If Boiler.ops_status in {WARMING, ONLINE, BANKING}: ops_status forced to STANDBY (emergency auto-shutdown)"
          - "Plant.posture recomputed"

      - from: VALID
        to: LAPSED
        trigger: "system (automatic in run_ops when no PASSED Inspection exists OR certificate_expires_on < plant clock)"
        actor: system
        preconditions: []
        side_effects:
          - "Same forced-standby cascade as EXPIRING→LAPSED"

      - from: VALID
        to: SUSPENDED
        trigger: "system (automatic when a RELIEF_VALVE_POP Inspection records outcome == FAILED on this boiler)"
        actor: system
        preconditions: []
        side_effects:
          - "Boiler.ops_status forced to TRIPPED"

      - from: SUSPENDED
        to: VALID
        trigger: "system (automatic when a POST_INCIDENT Inspection records outcome == PASSED on this boiler after the most recent SUSPENDED entry)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXPIRING
        to: VALID
        trigger: "system (automatic when a new ANNUAL_EXTERNAL or ANNUAL_INTERNAL Inspection records outcome == PASSED on this boiler with certificate_expires_on > plant clock)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LAPSED
        to: VALID
        trigger: "system (automatic when a new ANNUAL_EXTERNAL Inspection records outcome == PASSED with certificate_expires_on > plant clock)"
        actor: system
        preconditions: []
        side_effects: []

      # --- water_status transitions (parallel dimension 3) ---
      - from: IN_SPEC
        to: OUT_OF_SPEC
        trigger: "system (automatic on ChemistryLog RECORDED with cycles_of_concentration > MAX_CYCLES OR sulfite_residual_ppm < SULFITE_MIN_PPM OR phosphate_residual_ppm outside [PHOSPHATE_MIN_PPM, PHOSPHATE_MAX_PPM])"
        actor: system
        preconditions: []
        side_effects:
          - "If Boiler.ops_status == ONLINE: ops_status forced to BANKING (load shed)"

      - from: OUT_OF_SPEC
        to: CRITICAL
        trigger: "system (automatic on consecutive ChemistryLog count in OUT_OF_SPEC state >= CHEMISTRY_CRITICAL_COUNT, OR on a single reading with cycles_of_concentration > MAX_CYCLES * CRITICAL_CYCLES_FACTOR)"
        actor: system
        preconditions: []
        side_effects:
          - "If ops_status in {ONLINE, BANKING, WARMING}: ops_status forced to STANDBY"
          - "An Incident is auto-created with severity HIGH, kind CHEMISTRY_EXCURSION, triggered_boiler_id == this boiler (cascade)"

      - from: OUT_OF_SPEC
        to: IN_SPEC
        trigger: "system (automatic on a new ChemistryLog RECORDED with all parameters in spec)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CRITICAL
        to: IN_SPEC
        trigger: "system (automatic on CHEMISTRY_RECOVERY_COUNT consecutive in-spec ChemistryLog entries after CRITICAL entry)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BoilerLogEntry
    initial_state: DRAFT
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/verify"
        actor: Operator
        preconditions:
          - "Verifying operator.id != BoilerLogEntry.recorded_by_operator_id (segregation of duties; ERR_SOD_VERIFICATION)"
          - "Verifying operator.license_status == ACTIVE"
          - "Boiler.ops_status in {ONLINE, BANKING, STANDBY, WARMING} (cannot verify on TRIPPED or DECOMMISSIONED)"
        side_effects:
          - "Plant.total_fuel_consumed_gal += entry.fuel_burned_gal; Plant.fuel_inventory_gal recomputed"
          - "Boiler.total_steam_lb, total_fuel_burned_gal, total_blowdown_gal, total_feedwater_gal incremented"
          - "Plant.header_pressure_actual_psi := entry.header_pressure_reading_psi if entry.recorded_at is latest among non-VOIDED entries"
          - "Boiler.efficiency_pct recomputed using calculations.combustion_efficiency"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/void"
        actor: Operator
        preconditions:
          - "Calling operator.license_status == ACTIVE"
        side_effects:
          - "Entry excluded from all aggregates; no ledger effect because DRAFT entries were never applied"

      - from: VERIFIED
        to: VOIDED
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/void"
        actor: PlantManager
        preconditions:
          - "Void must not drive Plant.fuel_inventory_gal negative (ERR_FUEL_INVENTORY_UNDERFLOW)"
        side_effects:
          - "Plant.total_fuel_consumed_gal -= entry.fuel_burned_gal (compensating)"
          - "Boiler totals decremented (compensating)"
          - "Plant.header_pressure_actual_psi recomputed from remaining non-VOIDED entries"
          - "Boiler.efficiency_pct recomputed"

  - entity: ChemistryLog
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/chemistry-logs/{logId}/void"
        actor: PlantManager
        preconditions:
          - "Boiler.water_status must be recomputed from remaining logs; if voiding leaves zero non-VOIDED ChemistryLogs, water_status resets to IN_SPEC"
        side_effects:
          - "Boiler.water_status recomputed"
          - "Boiler.cycles_of_concentration recomputed from latest non-VOIDED log"

  - entity: Inspection
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, CONDITIONAL]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}/record-outcome"
        actor: PlantManager
        preconditions:
          - "For RELIEF_VALVE_POP: relief_valve_lift_pressure_psi must be within Boiler.relief_valve_setpoint_psi * (1 + Boiler.relief_valve_tolerance_pct/100) — strictly less-than-or-equal (ERR_RELIEF_SETPOINT_EXCEEDED)"
          - "For RELIEF_VALVE_POP: relief_valve_lift_pressure_psi must be >= Boiler.relief_valve_setpoint_psi (lift must occur at or above setpoint; ERR_RELIEF_NO_LIFT)"
          - "certificate_number required when outcome=PASSED for ANNUAL_* kinds"
        side_effects:
          - "posted_at := null until explicit POST .../post"
          - "Boiler.cert_status recomputed per rules above"
          - "If kind == RELIEF_VALVE_POP and lift_pressure within tolerance: no further effect; if lift_pressure < setpoint OR > setpoint * (1 + tolerance/100): outcome forced to FAILED, cert_status := SUSPENDED, ops_status forced to TRIPPED"

      - from: PENDING
        to: FAILED
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}/record-outcome"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "If kind == RELIEF_VALVE_POP: Boiler.cert_status := SUSPENDED; Boiler.ops_status forced to TRIPPED (cascade)"
          - "If kind == ANNUAL_EXTERNAL or ANNUAL_INTERNAL and previous cert VALID/EXPIRING: cert_status := LAPSED on run_ops"

      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /plants/{plantId}/boilers/{boilerId}/record-outcome"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "Certificate NOT issued; cert_status unchanged"
          - "System auto-creates a follow-up Inspection of same kind with scheduled_on = now + CONDITIONAL_FOLLOWUP_DAYS"

  - entity: Operator
    initial_state: ACTIVE  # license_status
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRING
        trigger: "system (run_ops when license_expires_on within LICENSE_EXPIRING_WINDOW_DAYS)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXPIRING
        to: EXPIRED
        trigger: "system (run_ops when license_expires_on < plant clock)"
        actor: system
        preconditions: []
        side_effects:
          - "Operator cannot perform state-changing actions (license checks fail)"
          - "Any BoilerLogEntry in DRAFT recorded by this operator remains DRAFT until verified; cannot be self-verified"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run_ops when license_expires_on < plant clock; covers operators who skip EXPIRING because run_ops was delayed)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as EXPIRING→EXPIRED"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /plants/{plantId}/operators/{operatorId}/renew-license"
        actor: PlantManager
        preconditions:
          - "new_license_expires_on > plant clock"
        side_effects:
          - "license_expires_on := new value; license_status := ACTIVE"

      - from: EXPIRING
        to: ACTIVE
        trigger: "POST /plants/{plantId}/operators/{operatorId}/renew-license"
        actor: PlantManager
        preconditions:
          - "new_license_expires_on > plant clock"
        side_effects: []

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /plants/{plantId}/operators/{operatorId}/revoke-license"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "Terminal; operator may no longer act"

      - from: EXPIRED
        to: REVOKED
        trigger: "POST /plants/{plantId}/operators/{operatorId}/revoke-license"
        actor: PlantManager
        preconditions: []
        side_effects: []

  - entity: LoadDispatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (automatic in run_ops when plant clock enters [window_start_at, window_end_at))"
        actor: system
        preconditions:
          - "All boilers in assigned_boiler_ids must currently have ops_status in {ONLINE, BANKING, WARMING}; otherwise the dispatch CANCELS instead of activating"
        side_effects:
          - "If any assigned boiler fails precondition: status := CANCELLED (not ACTIVE) and Plant.lead_boiler_id re-evaluated"
          - "On successful activation: lead_boiler selector re-evaluated with assigned_boiler_ids[0] preferred if ONLINE"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic in run_ops when plant clock >= window_end_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /plants/{plantId}/load-dispatches/{dispatchId}/cancel"
        actor: Operator
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /plants/{plantId}/load-dispatches/{dispatchId}/cancel"
        actor: Operator
        preconditions: []
        side_effects:
          - "Boilers in assigned_boiler_ids receive no further dispatch order; current ops_status preserved"

  - entity: Incident
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /plants/{plantId}/incidents/{incidentId}/acknowledge"
        actor: Operator
        preconditions:
          - "Calling operator.license_status == ACTIVE"
        side_effects: []

      - from: ACKNOWLEDGED
        to: MITIGATED
        trigger: "POST /plants/{plantId}/incidents/{incidentId}/mitigate"
        actor: Operator
        preconditions:
          - "Calling operator.license_status == ACTIVE"
        side_effects:
          - "If triggered_boiler_id set AND no other OPEN or ACKNOWLEDGED HIGH/CRITICAL incidents on that boiler: boiler becomes eligible for reset (TRIPPED→STANDBY gate)"
          - "If Plant has no OPEN or ACKNOWLEDGED HIGH/CRITICAL incidents: Plant.posture recomputed (may leave EMERGENCY)"

      - from: MITIGATED
        to: CLOSED
        trigger: "POST /plants/{plantId}/incidents/{incidentId}/close"
        actor: PlantManager
        preconditions:
          - "resolution_notes must be non-empty (ERR_RESOLUTION_NOTES_REQUIRED)"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /plants/{plantId}/incidents/{incidentId}/close"
        actor: PlantManager
        preconditions:
          - "severity must be LOW (ERR_INCIDENT_NOT_CLOSABLE — HIGH/CRITICAL must traverse ACKNOWLEDGED→MITIGATED)"
          - "resolution_notes must be non-empty"
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: log-verify-stale-boiler
    parent_entity: Boiler
    write_endpoint: "POST /plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/verify"
    occ_field: "expected_boiler_version"
    description: |
      Verifying a BoilerLogEntry against a Boiler whose version has advanced
      since the verifier last observed it is rejected with ERR_STALE_VERSION.
      This captures the case where another writer has just verified a different
      log entry on the same boiler (which legitimately advances boiler totals and
      therefore header_pressure_actual_psi / efficiency_pct) and the current
      verifier's cached view of the boiler is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: outcome-record-stale-inspection
    parent_entity: Inspection
    write_endpoint: "POST /plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}/record-outcome"
    occ_field: "expected_inspection_version"
    description: |
      Recording an Inspection outcome with an expected_inspection_version that
      does not match the Inspection's current version is rejected with
      ERR_STALE_VERSION. This captures the case where a prior outcome recording
      attempt legitimately advanced the Inspection's version (e.g. a
      CONDITIONAL outcome was recorded, which also auto-created a follow-up
      Inspection), and the current writer's view of the Inspection is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: combustion_efficiency
    trigger: "BoilerLogEntry transitions DRAFT→VERIFIED; BoilerLogEntry transitions VERIFIED→VOIDED"
    algorithm: aggregation
    formula: |
      # Variant A (input-output method) — default
      # efficiency_pct = (steam_enthalpy_btu / fuel_input_btu) * 100
      # steam_enthalpy_btu = total_steam_lb * (ENTHALPY_STEAM_BTU_PER_LB - ENTHALPY_FEEDWATER_BTU_PER_LB)
      # fuel_input_btu = total_fuel_burned_gal * FUEL_HHV_BTU_PER_GAL
      #
      # Variant B (heat-loss method, per ASME PTC 4.1) — used when
      # Plant.state_code == "MA" (Massachusetts mandate)
      # efficiency_pct = 100 - (L_dry_gas + L_moisture + L_blowdown + L_radiation)
      # L_dry_gas  = DRY_GAS_LOSS_PCT (constant)
      # L_moisture = MOISTURE_LOSS_PCT (constant)
      # L_blowdown = (total_blowdown_gal / max(total_feedwater_gal, EPSILON)) * BLOWDOWN_ENTHALPY_PCT
      # L_radiation= RADIATION_LOSS_PCT (constant)
      #
      # Aggregates over non-VOIDED, VERIFIED BoilerLogEntry records for this boiler.
      # Precision: round to 2 decimals, half-up.
    input_set: "BoilerLogEntry records for this boiler with status == VERIFIED (excludes DRAFT and VOIDED)"
    constants:
      ENTHALPY_STEAM_BTU_PER_LB: 1190.0
      ENTHALPY_FEEDWATER_BTU_PER_LB: 180.0
      FUEL_HHV_BTU_PER_GAL: 140000.0
      DRY_GAS_LOSS_PCT: 6.5
      MOISTURE_LOSS_PCT: 4.0
      BLOWDOWN_ENTHALPY_PCT: 100.0
      RADIATION_LOSS_PCT: 1.5
      EPSILON: 0.000001
    precision: "2 decimal places, round_half_up"
    variants:
      - name: input_output_method
        when: "Plant.state_code != 'MA' (default)"
        difference: "Uses fuel input vs steam output ratio"
      - name: heat_loss_method
        when: "Plant.state_code == 'MA'"
        difference: "Uses ASME PTC 4.1 heat-loss summation; produces different result for identical inputs because it incorporates blowdown loss independently of steam metering"

  - name: steam_trap_loss_cost
    trigger: "GET /plants/{plantId}/steam-traps/{trapId}/loss-projection; also recomputed on survey result entry"
    algorithm: projection
    formula: |
      # Variant A (theoretical enthalpy method) — default
      # leak_rate_lb_hr = NAPIER_COEFF * orifice_diameter_in^2 * design_pressure_psi
      # annual_steam_loss_lb = leak_rate_lb_hr * HOURS_PER_YEAR
      # annual_cost = annual_steam_loss_lb * (fuel_cost_per_gal / FUEL_HHV_BTU_PER_GAL) * (ENTHALPY_STEAM_BTU_PER_LB - ENTHALPY_FEEDWATER_BTU_PER_LB)
      #
      # Variant B (empirical Grashof correlation) — used when Plant.state_code == "NY"
      # leak_rate_lb_hr = GRASHOF_COEFF * orifice_diameter_in^2 * sqrt(design_pressure_psi)
      # annual_steam_loss_lb = leak_rate_lb_hr * HOURS_PER_YEAR
      # annual_cost = annual_steam_loss_lb * (fuel_cost_per_gal / FUEL_HHV_BTU_PER_GAL) * (ENTHALPY_STEAM_BTU_PER_LB - ENTHALPY_FEEDWATER_BTU_PER_LB)
      #
      # The two methods produce different leak_rate_lb_hr and therefore different annual_cost
      # for identical orifice_diameter_in and design_pressure_psi.
    input_set: "Single SteamTrap; uses plant's most recent FuelDelivery.price_per_gal (defaults to DEFAULT_FUEL_COST_PER_GAL if no deliveries)"
    constants:
      NAPIER_COEFF: 51.45
      GRASHOF_COEFF: 24.24
      HOURS_PER_YEAR: 8760
      DEFAULT_FUEL_COST_PER_GAL: 3.50
    precision: "2 decimal places, round_half_up"
    variants:
      - name: napier_theoretical
        when: "Plant.state_code != 'NY'"
        difference: "Linear in design_pressure_psi"
      - name: grashof_empirical
        when: "Plant.state_code == 'NY'"
        difference: "Square-root in design_pressure_psi; lower leak rate for high-pressure traps, higher for low-pressure"

  - name: blowdown_volume_recommendation
    trigger: "ChemistryLog RECORDED"
    algorithm: constraint_propagation
    formula: |
      # Multi-step chain (mode (c) circular-looking, pinned evaluation order):
      # Step 1: cycles_actual = conductivity_boiler_umho / conductivity_feedwater_umho
      # Step 2: bd_pct_required = max(0, (cycles_actual - TARGET_CYCLES) / (cycles_actual - 1)) * 100
      # Step 3: steam_rate_lb_hr = (latest 24h of non-VOIDED BoilerLogEntry.steam_generated_lb sum) / 24 (uses 0 if no entries)
      # Step 4: bd_flow_gal_hr = (bd_pct_required / 100) * steam_rate_lb_hr * LB_PER_GAL_WATER / (1 - bd_pct_required/100)
      # Step 5: bd_flow_gal_hr = round(bd_flow_gal_hr, 2, HALF_UP)
      # Step 6: bd_volume_gal_per_day = bd_flow_gal_hr * 24 (uses ROUNDED value from step 5, NOT raw)
      # Step 7: clamp bd_volume_gal_per_day to [BLOWDOWN_MIN_GAL_DAY, BLOWDOWN_MAX_GAL_DAY]
      #
      # Note: step 6 MUST use the ROUNDED bd_flow from step 5; using the unrounded value
      # produces a different cents-level result. This is the rounding-order trap.
    input_set: "Latest non-VOIDED ChemistryLog for the boiler; latest 24h of non-VOIDED VERIFIED BoilerLogEntry"
    constants:
      TARGET_CYCLES: 10.0
      LB_PER_GAL_WATER: 8.345
      BLOWDOWN_MIN_GAL_DAY: 5.0
      BLOWDOWN_MAX_GAL_DAY: 5000.0
    precision: "2 decimals on step 5, then reuse rounded value downstream"

  - name: lead_lag_dispatch_selection
    trigger: "Boiler transitions into ONLINE; Plant.lead_boiler_id re-evaluation"
    algorithm: constraint_propagation
    formula: |
      # Combinatorial formula (mode (a)): ≥3 inputs with non-linear interaction
      # eligibility filter: ops_status == ONLINE AND cert_status == VALID AND water_status != CRITICAL
      # For each candidate boiler b:
      #   score(b) = b.rated_capacity_lb_hr
      #              * (1.0 if b.efficiency_pct is null else b.efficiency_pct / 100.0)
      #              * (1.0 - min(b.cycles_of_concentration / MAX_CYCLES, 1.0) * CYCLES_PENALTY_WEIGHT)
      #              + (LEAD_BONUS if b.id == current Plant.lead_boiler_id else 0)
      # ranking: score DESC; tie-break: rated_capacity_lb_hr DESC, then created_at ASC
      # fallback: if no eligible candidates, Plant.lead_boiler_id := null
      #
      # Non-linear: multiplication of three terms + additive bonus; efficiency_pct can be null
      # (drives behavior for freshly-ONLINE boilers); min() saturates the cycles penalty.
    input_set: "All Boiler rows for the plant meeting eligibility filter"
    constants:
      MAX_CYCLES: 10.0
      CYCLES_PENALTY_WEIGHT: 0.15
      LEAD_BONUS: 5000.0
    precision: "4 decimal places during scoring; final selection on integer comparison"

  - name: certificate_expiry_check
    trigger: "run_ops"
    algorithm: threshold
    formula: |
      # Boundary precision (>= vs >):
      # If certificate_expires_on is NULL → cert_status := LAPSED
      # Else if certificate_expires_on < plant_clock_now → LAPSED (strict less-than)
      # Else if certificate_expires_on - plant_clock_now <= CERT_EXPIRING_WINDOW_DAYS * 86400 seconds → EXPIRING
      # Else → VALID
      #
      # Boundary: certificate_expires_on EXACTLY equal to plant_clock_now is still VALID
      # (strict-less-than for LAPSED). certificate_expires_on - now EXACTLY equal to
      # CERT_EXPIRING_WINDOW_DAYS * 86400 is EXPIRING (inclusive <=).
    input_set: "Latest PASSED Inspection for the boiler (any kind); uses plant clock"
    constants:
      CERT_EXPIRING_WINDOW_DAYS: 30
    precision: "Second-precision comparison"

  - name: license_expiry_check
    trigger: "run_ops"
    algorithm: threshold
    formula: |
      # Same shape as certificate_expiry_check but for Operator.license_status.
      # Boundary: license_expires_on == plant_clock_now is still ACTIVE.
      # license_expires_on - now == LICENSE_EXPIRING_WINDOW_DAYS * 86400 → EXPIRING (inclusive).
    input_set: "All Operator rows in the plant"
    constants:
      LICENSE_EXPIRING_WINDOW_DAYS: 60
    precision: "Second-precision"

  - name: fuel_inventory_balance
    trigger: "POST fuel-deliveries; BoilerLogEntry DRAFT→VERIFIED; BoilerLogEntry VERIFIED→VOIDED"
    algorithm: aggregation
    formula: |
      # Compensating invariant:
      #   Plant.total_fuel_received_gal - Plant.total_fuel_consumed_gal == Plant.fuel_inventory_gal
      # Verified entry add: total_fuel_consumed_gal += entry.fuel_burned_gal
      # Verified entry void: total_fuel_consumed_gal -= entry.fuel_burned_gal (compensating)
      # Delivery add: total_fuel_received_gal += quantity_gal
      # Result must always satisfy: fuel_inventory_gal = total_fuel_received_gal - total_fuel_consumed_gal
      # AND fuel_inventory_gal >= 0 (enforced at validation layer as ERR_FUEL_INVENTORY_UNDERFLOW)
    input_set: "All FuelDelivery rows for plant (no status filter — FuelDelivery is append-only); all VERIFIED BoilerLogEntry rows"
    precision: "2 decimal places, round_half_up"

  - name: feedwater_mass_balance
    trigger: "BoilerLogEntry DRAFT→VERIFIED; VERIFIED→VOIDED"
    algorithm: aggregation
    formula: |
      # Compensating invariant on water:
      #   Boiler.total_feedwater_gal == Boiler.total_blowdown_gal + (Boiler.total_steam_lb / LB_PER_GAL_WATER)
      # Pin to 2-decimal round-half-up; drift beyond DRIFT_TOLERANCE_GAL on a verified entry
      # auto-creates an Incident with kind=CHEMISTRY_EXCURSION, severity=MEDIUM.
    input_set: "All VERIFIED non-VOIDED BoilerLogEntry for the boiler"
    constants:
      LB_PER_GAL_WATER: 8.345
      DRIFT_TOLERANCE_GAL: 25.0
    precision: "2 decimal places"

  - name: dispatch_window_overlap_check
    trigger: "POST /plants/{plantId}/load-dispatches"
    algorithm: interval_merge
    formula: |
      # Half-open intervals [window_start_at, window_end_at).
      # Two windows W1, W2 conflict iff W1.start < W2.end AND W2.start < W1.end.
      # Adjacent windows (W1.end == W2.start) do NOT conflict.
      # A boiler may not be assigned to two overlapping windows.
      # Distinct from inspection scheduling which uses CLOSED intervals with a buffer.
    input_set: "All LoadDispatch rows in {SCHEDULED, ACTIVE} sharing any boiler_id with the new dispatch"
    precision: "Second-precision on timestamps"

  - name: inspection_scheduling_conflict_check
    trigger: "POST /plants/{plantId}/boilers/{boilerId}/inspections"
    algorithm: interval_merge
    formula: |
      # CLOSED interval [scheduled_on, scheduled_on + INSPECTION_DURATION_HOURS] with buffer.
      # Each inspection occupies [t, t + duration]; PLUS a cleanup buffer of INSPECTION_BUFFER_HOURS
      # on either side, so effective occupancy is [t - buffer, t + duration + buffer].
      # Two inspections on the same boiler conflict iff effective intervals intersect (closed —
      # touching endpoints DO conflict, unlike dispatch windows).
    input_set: "All PENDING Inspection rows for the same boiler"
    constants:
      INSPECTION_DURATION_HOURS: 4
      INSPECTION_BUFFER_HOURS: 2
    precision: "Second-precision; closed-interval comparison"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of declared roles; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-template IDs (plantId, boilerId, entryId, etc.) resolve to existing entities in correct scope"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: state
    check: "Target resource in valid state for this operation (state machine from-state matches)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Water chemistry must not be CRITICAL for boiler warm; must be IN_SPEC for bring-online"
    error_id: ERR_WATER_CRITICAL
    http_status: 422
    applies_to: "POST .../warm, POST .../bring-online"

  - priority: 6
    category: business_safety
    check: "Boiler certificate must be VALID for warm/bring-online"
    error_id: ERR_CERT_NOT_VALID
    http_status: 422
    applies_to: "POST .../warm, POST .../bring-online"

  - priority: 7
    category: business_safety
    check: "Plant must not be in EMERGENCY posture for boiler warm"
    error_id: ERR_PLANT_EMERGENCY
    http_status: 422
    applies_to: "POST .../warm"

  - priority: 8
    category: business_safety
    check: "Calling operator must have license_status == ACTIVE and license_class adequate"
    error_id: ERR_OPERATOR_LICENSE_INVALID
    http_status: 422
    applies_to: "all operator-initiated state transitions"

  - priority: 9
    category: business_safety
    check: "Calling operator's license_state must match plant's state_code"
    error_id: ERR_LICENSE_WRONG_STATE
    http_status: 422
    applies_to: "POST .../warm, POST .../bring-online, POST .../log-entries, POST .../chemistry-logs"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: log verifier must not equal log recorder"
    error_id: ERR_SOD_VERIFICATION
    http_status: 422
    applies_to: "POST .../log-entries/{entryId}/verify"

  - priority: 11
    category: business_referential
    check: "referenced FK targets exist (recorded_by_operator_id, triggered_boiler_id, assigned_boiler_ids)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 422
    applies_to: "POST endpoints with FK body fields"

  - priority: 12
    category: business_temporal
    check: "Dispatch windows: half-open [start, end) — no two windows share a boiler when overlapping"
    error_id: ERR_DISPATCH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /plants/{plantId}/load-dispatches"

  - priority: 13
    category: business_temporal
    check: "Inspection scheduling: closed intervals with buffer — no two PENDING inspections on same boiler when buffered intervals touch"
    error_id: ERR_INSPECTION_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /plants/{plantId}/boilers/{boilerId}/inspections"

  - priority: 14
    category: business_temporal
    check: "window_end_at must be strictly > window_start_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /plants/{plantId}/load-dispatches"

  - priority: 15
    category: business_constraint
    check: "Relief valve pop test: setpoint <= lift_pressure <= setpoint * (1 + tolerance/100)"
    error_id: ERR_RELIEF_SETPOINT_EXCEEDED
    http_status: 422
    applies_to: "POST .../inspections/{inspectionId}/record-outcome with outcome=PASSED on RELIEF_VALVE_POP"

  - priority: 16
    category: business_constraint
    check: "Boiler tag unique within plant; SteamTrap tag unique within plant"
    error_id: ERR_DUPLICATE_TAG
    http_status: 409
    applies_to: "POST /plants/{plantId}/boilers, POST /plants/{plantId}/steam-traps"

  - priority: 17
    category: business_constraint
    check: "Segregation: only PlantManager may void VERIFIED BoilerLogEntry; only Operator may verify (and only entries they did not record)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST .../log-entries/{entryId}/void, POST .../log-entries/{entryId}/verify"

  - priority: 18
    category: business_fiscal
    check: "Void on VERIFIED log entry must not drive Plant.fuel_inventory_gal negative"
    error_id: ERR_FUEL_INVENTORY_UNDERFLOW
    http_status: 422
    applies_to: "POST .../log-entries/{entryId}/void"

  - priority: 19
    category: business_fiscal
    check: "Lead boiler may not bank while other boilers are ONLINE (must hand off first)"
    error_id: ERR_LEAD_CANNOT_BANK
    http_status: 422
    applies_to: "POST .../bank"

  - priority: 20
    category: business_constraint
    check: "resolution_notes required to CLOSE an Incident"
    error_id: ERR_RESOLUTION_NOTES_REQUIRED
    http_status: 422
    applies_to: "POST .../incidents/{incidentId}/close"

  - priority: 21
    category: business_constraint
    check: "Incident severity LOW may close directly from OPEN; HIGH/CRITICAL must traverse ACKNOWLEDGED→MITIGATED"
    error_id: ERR_INCIDENT_NOT_CLOSABLE
    http_status: 409
    applies_to: "POST .../incidents/{incidentId}/close"

  - priority: 22
    category: state
    check: "OCC: expected_<parent>_version must match parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../log-entries/{entryId}/verify, POST .../inspections/{inspectionId}/record-outcome"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Plant ---
  - method: POST
    path: "/plants"
    description: "Create a Plant"
    roles: [PlantManager]
    code: 201
    input: [name, state_code, header_pressure_psi]
    output: Plant
    side_effects:
      - "posture=NORMAL, fuel_inventory_gal=0, total_fuel_received_gal=0, total_fuel_consumed_gal=0, ops_run_index=0, lead_boiler_id=null"

  - method: GET
    path: "/plants/{plantId}"
    description: "Get a Plant"
    roles: [PlantManager, Operator, Inspector]
    code: 200
    input: []
    output: Plant
    side_effects: []

  - method: POST
    path: "/plants/{plantId}/run-ops"
    description: "Run operations checkpoint: advance ops_run_index, recompute license/cert expiry, activate/complete dispatches"
    roles: [PlantManager]
    code: 200
    input: []
    output: Plant
    side_effects:
      - "ops_run_index += 1"
      - "Recompute all Operator.license_status"
      - "Recompute all Boiler.cert_status"
      - "Advance LoadDispatch SCHEDULED→ACTIVE / ACTIVE→COMPLETED per clock"
      - "Recompute Plant.posture"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical plant clock (default 2026-08-01T00:00:00Z at server start before any set)"
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Logical clock advanced; subsequent run_ops uses this time"

  # --- Boiler ---
  - method: POST
    path: "/plants/{plantId}/boilers"
    description: "Create a Boiler"
    roles: [PlantManager]
    code: 201
    input: [tag, rated_capacity_lb_hr, relief_valve_setpoint_psi, "relief_valve_tolerance_pct?"]
    output: Boiler
    side_effects:
      - "ops_status=STANDBY, cert_status=VALID (initial), water_status=IN_SPEC, totals=0"

  - method: GET
    path: "/plants/{plantId}/boilers/{boilerId}"
    description: "Get a Boiler"
    roles: [PlantManager, Operator, Inspector]
    code: 200
    input: []
    output: Boiler
    side_effects: []

  - method: GET
    path: "/plants/{plantId}/boilers"
    description: "List boilers in a plant"
    roles: [PlantManager, Operator, Inspector]
    code: 200
    input: ["limit?", "offset?", "ops_status?", "cert_status?"]
    output: "Boiler[]"
    side_effects: []

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/warm"
    description: "STANDBY→WARMING"
    roles: [Operator]
    code: 200
    input: []
    output: Boiler
    side_effects: ["ops_status → WARMING; version += 1"]

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/bring-online"
    description: "WARMING→ONLINE or BANKING→ONLINE"
    roles: [Operator]
    code: 200
    input: []
    output: Boiler
    side_effects: ["ops_status → ONLINE", "lead_boiler selector re-evaluated", "version += 1"]

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/bank"
    description: "ONLINE→BANKING"
    roles: [Operator]
    code: 200
    input: []
    output: Boiler
    side_effects: ["ops_status → BANKING", "lead_boiler re-evaluated", "version += 1"]

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/shutdown"
    description: "ONLINE/BANKING/WARMING→STANDBY"
    roles: [Operator]
    code: 200
    input: []
    output: Boiler
    side_effects: ["ops_status → STANDBY", "lead_boiler re-evaluated", "version += 1"]

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/reset"
    description: "TRIPPED→STANDBY"
    roles: [Operator]
    code: 200
    input: []
    output: Boiler
    side_effects: ["ops_status → STANDBY", "cert_status recomputed", "version += 1"]

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/decommission"
    description: "STANDBY→DECOMMISSIONED"
    roles: [PlantManager]
    code: 200
    input: []
    output: Boiler
    side_effects: ["ops_status → DECOMMISSIONED", "version += 1"]

  # --- Operator ---
  - method: POST
    path: "/plants/{plantId}/operators"
    description: "Create an Operator"
    roles: [PlantManager]
    code: 201
    input: [full_name, license_class, license_state, license_expires_on, "is_lead_qualified?"]
    output: Operator
    side_effects: ["license_status=ACTIVE"]

  - method: GET
    path: "/plants/{plantId}/operators/{operatorId}"
    description: "Get an Operator"
    roles: [PlantManager, Operator]
    code: 200
    input: []
    output: Operator
    side_effects: []

  - method: GET
    path: "/plants/{plantId}/operators"
    description: "List operators"
    roles: [PlantManager, Operator]
    code: 200
    input: ["limit?", "offset?", "license_status?"]
    output: "Operator[]"
    side_effects: []

  - method: POST
    path: "/plants/{plantId}/operators/{operatorId}/renew-license"
    description: "Renew license (EXPIRING/EXPIRED → ACTIVE)"
    roles: [PlantManager]
    code: 200
    input: [new_license_expires_on]
    output: Operator
    side_effects: ["license_status=ACTIVE", "license_expires_on := new value"]

  - method: POST
    path: "/plants/{plantId}/operators/{operatorId}/revoke-license"
    description: "Revoke license (terminal)"
    roles: [PlantManager]
    code: 200
    input: []
    output: Operator
    side_effects: ["license_status=REVOKED"]

  # --- BoilerLogEntry ---
  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/log-entries"
    description: "Record a BoilerLogEntry (status=DRAFT)"
    roles: [Operator]
    code: 201
    input: [recorded_by_operator_id, recorded_at, header_pressure_reading_psi, steam_generated_lb, fuel_burned_gal, feedwater_intake_gal, blowdown_gal]
    output: BoilerLogEntry
    side_effects: ["status=DRAFT; no ledger effect until verified"]

  - method: GET
    path: "/plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}"
    description: "Get a log entry"
    roles: [PlantManager, Operator]
    code: 200
    input: []
    output: BoilerLogEntry
    side_effects: []

  - method: GET
    path: "/plants/{plantId}/boilers/{boilerId}/log-entries"
    description: "List log entries for a boiler"
    roles: [PlantManager, Operator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "BoilerLogEntry[]"
    side_effects: []

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/verify"
    description: "DRAFT→VERIFIED; applies ledger effects; OCC on boiler version"
    roles: [Operator]
    code: 200
    input: [expected_boiler_version]
    output: BoilerLogEntry
    side_effects:
      - "status → VERIFIED"
      - "Apply totals to Plant and Boiler; recompute efficiency_pct; recompute header_pressure_actual_psi"
      - "increments Boiler.version by 1"

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/void"
    description: "DRAFT→VOIDED or VERIFIED→VOIDED (compensating)"
    roles: [Operator, PlantManager]
    code: 200
    input: []
    output: BoilerLogEntry
    side_effects:
      - "If was VERIFIED: subtract entry from Plant and Boiler totals; recompute efficiency; may fail with ERR_FUEL_INVENTORY_UNDERFLOW"

  # --- ChemistryLog ---
  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/chemistry-logs"
    description: "Record a ChemistryLog"
    roles: [Operator]
    code: 201
    input: [recorded_by_operator_id, recorded_at, conductivity_boiler_umho, conductivity_feedwater_umho, sulfite_residual_ppm, phosphate_residual_ppm]
    output: ChemistryLog
    side_effects:
      - "Recompute Boiler.cycles_of_concentration"
      - "Recompute Boiler.water_status (may cascade to ops_status / Incident creation)"
      - "Run blowdown_volume_recommendation calculation"

  - method: GET
    path: "/plants/{plantId}/boilers/{boilerId}/chemistry-logs/{logId}"
    description: "Get a ChemistryLog"
    roles: [PlantManager, Operator]
    code: 200
    input: []
    output: ChemistryLog
    side_effects: []

  - method: GET
    path: "/plants/{plantId}/boilers/{boilerId}/chemistry-logs"
    description: "List ChemistryLogs"
    roles: [PlantManager, Operator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ChemistryLog[]"
    side_effects: []

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/chemistry-logs/{logId}/void"
    description: "RECORDED→VOIDED"
    roles: [PlantManager]
    code: 200
    input: []
    output: ChemistryLog
    side_effects: ["Recompute water_status and cycles_of_concentration"]

  # --- Inspection ---
  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/inspections"
    description: "Schedule an Inspection"
    roles: [PlantManager, Inspector]
    code: 201
    input: [inspection_kind, scheduled_on, inspector_name, inspector_license_no, "relief_valve_lift_pressure_psi?"]
    output: Inspection
    side_effects: ["outcome=PENDING; posted_at=null"]

  - method: GET
    path: "/plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}"
    description: "Get an Inspection"
    roles: [PlantManager, Operator, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/plants/{plantId}/boilers/{boilerId}/inspections"
    description: "List Inspections for a boiler"
    roles: [PlantManager, Operator, Inspector]
    code: 200
    input: ["limit?", "offset?", "outcome?"]
    output: "Inspection[]"
    side_effects: []

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}/record-outcome"
    description: "Record outcome (PENDING → PASSED/FAILED/CONDITIONAL); OCC on Inspection version"
    roles: [PlantManager, Inspector]
    code: 200
    input: [outcome, "certificate_number?", "certificate_expires_on?", "relief_valve_lift_pressure_psi?", expected_inspection_version]
    output: Inspection
    side_effects:
      - "outcome transition"
      - "If PASSED RELIEF_VALVE_POP within tolerance: no cert change"
      - "If FAILED RELIEF_VALVE_POP or out-of-tolerance lift: Boiler.cert_status=SUSPENDED, ops_status forced TRIPPED"
      - "If PASSED ANNUAL_*: Boiler.cert_status=VALID"
      - "increments Inspection.version by 1; may also increment Boiler.version (cascade)"

  - method: POST
    path: "/plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}/post"
    description: "Post certificate (set posted_at=now)"
    roles: [PlantManager]
    code: 200
    input: []
    output: Inspection
    side_effects: ["posted_at := current plant clock"]

  # --- SteamTrap ---
  - method: POST
    path: "/plants/{plantId}/steam-traps"
    description: "Create a SteamTrap"
    roles: [PlantManager, Operator]
    code: 201
    input: [tag, location, orifice_diameter_in, design_pressure_psi]
    output: SteamTrap
    side_effects: ["condition=UNKNOWN, status=IN_SERVICE, leak_rate_lb_hr=0"]

  - method: GET
    path: "/plants/{plantId}/steam-traps/{trapId}"
    description: "Get a SteamTrap"
    roles: [PlantManager, Operator]
    code: 200
    input: []
    output: SteamTrap
    side_effects: []

  - method: GET
    path: "/plants/{plantId}/steam-traps"
    description: "List SteamTraps"
    roles: [PlantManager, Operator]
    code: 200
    input: ["limit?", "offset?", "condition?", "status?"]
    output: "SteamTrap[]"
    side_effects: []

  - method: POST
    path: "/plants/{plantId}/steam-traps/{trapId}/survey"
    description: "Record survey result (updates condition, last_surveyed_at, leak_rate_lb_hr)"
    roles: [Operator]
    code: 200
    input: [condition]
    output: SteamTrap
    side_effects:
      - "condition := input"
      - "last_surveyed_at := now"
      - "If condition in {LEAKING, FAILED_OPEN}: leak_rate_lb_hr computed per steam_trap_loss_cost variant; else := 0"

  - method: GET
    path: "/plants/{plantId}/steam-traps/{trapId}/loss-projection"
    description: "Computed read: annual loss projection using steam_trap_loss_cost"
    roles: [PlantManager, Operator]
    code: 200
    input: []
    output: "{ leak_rate_lb_hr: number, annual_steam_loss_lb: number, annual_cost_usd: number, method: string }"
    side_effects: []

  # --- LoadDispatch ---
  - method: POST
    path: "/plants/{plantId}/load-dispatches"
    description: "Create a LoadDispatch window"
    roles: [PlantManager, Operator]
    code: 201
    input: [window_start_at, window_end_at, target_steam_lb_hr, assigned_boiler_ids]
    output: LoadDispatch
    side_effects: ["status=SCHEDULED", "expected_lead_boiler_id computed via lead_lag_dispatch_selection"]

  - method: GET
    path: "/plants/{plantId}/load-dispatches/{dispatchId}"
    description: "Get a LoadDispatch"
    roles: [PlantManager, Operator]
    code: 200
    input: []
    output: LoadDispatch
    side_effects: []

  - method: GET
    path: "/plants/{plantId}/load-dispatches"
    description: "List LoadDispatches"
    roles: [PlantManager, Operator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "LoadDispatch[]"
    side_effects: []

  - method: POST
    path: "/plants/{plantId}/load-dispatches/{dispatchId}/cancel"
    description: "SCHEDULED/ACTIVE → CANCELLED"
    roles: [PlantManager, Operator]
    code: 200
    input: []
    output: LoadDispatch
    side_effects: ["status → CANCELLED"]

  # --- Incident ---
  - method: POST
    path: "/plants/{plantId}/incidents"
    description: "Raise an Incident"
    roles: [Operator]
    code: 201
    input: [raised_by_operator_id, severity, kind, "triggered_boiler_id?", raised_at]
    output: Incident
    side_effects:
      - "status=OPEN"
      - "If severity in {HIGH, CRITICAL} AND kind in {OVERPRESSURE, LOW_WATER, FLAME_FAILURE, RELIEF_VALVE_LIFT} AND triggered_boiler_id set: boiler TRIPPED (cascade depth 1)"
      - "Cascade depth 2: cancel future SCHEDULED LoadDispatch containing tripped boiler"
      - "Cascade depth 3: lag-dispatch re-evaluation may auto-create new LoadDispatch"
      - "Plant.posture := DEGRADED or EMERGENCY"

  - method: GET
    path: "/plants/{plantId}/incidents/{incidentId}"
    description: "Get an Incident"
    roles: [PlantManager, Operator]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/plants/{plantId}/incidents"
    description: "List Incidents"
    roles: [PlantManager, Operator]
    code: 200
    input: ["limit?", "offset?", "status?", "severity?"]
    output: "Incident[]"
    side_effects: []

  - method: POST
