  - rule_id: cross_entity_state_dependency
    instances:
      - name: subscription_cannot_be_created_on_draft_plan_rejected
        grounds:
          - validations[priority=21]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - endpoints[POST /paywall/subscriptions]
        distinguishing_aspect: |
          Entity pair (Subscription, OfferPlan): the create is well formed and the OCC
          version is current, yet it must fail purely because the referenced plan is
          still DRAFT - the same call succeeds the moment the plan is ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One DIGITAL_ONLY plan left in status DRAFT (never activated), version 1."
            - "One registered reader."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
