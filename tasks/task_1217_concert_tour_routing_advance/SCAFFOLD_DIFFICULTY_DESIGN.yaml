              payload: { expected_packet_revision: "${pr3}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T00:00:01Z" }
