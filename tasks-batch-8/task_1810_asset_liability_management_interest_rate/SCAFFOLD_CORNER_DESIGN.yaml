        distinguishing_aspect: "TreasuryAnalyst calling the ALCOChair-exclusive approve endpoint gets 403 ERR_FORBIDDEN_FOR_ROLE; the set stays SUBMITTED."
        test_recipe:
          setup: ["book; PREPAYMENT set SUBMITTED by an-1"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
