            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T13:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/v1/enrollments/${enr_id}/attend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 16350000, buyer_contribution_cents: 0 }
              as: CaseManager
              captures: { app_id: $.data.id }
