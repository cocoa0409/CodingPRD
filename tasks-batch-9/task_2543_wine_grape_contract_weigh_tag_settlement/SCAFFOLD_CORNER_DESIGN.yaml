      - name: enum_range_and_decimal_place_type_constraints_returns_422
        claim_type: Type Constraints
        grounds:
          - validations.priority_7
          - entities.VineyardBlock.fields.acres
          - entities.GrapeContract.fields.contract_basis
          - entities.QualityGrade.fields.brix
          - entities.SamplingVisit.fields.window_end
        distinguishing_aspect: |
          Four different shapes of the same priority-7 rule: an out-of-set enum, a
          decimal-place overflow (acres carries 3 places, so 4 is a violation rather
          than a value to round), a numeric range violation (brix <= 40), and the
          window_end-strictly-after-window_start ordering rule. All four are 422
          ERR_VALIDATION, and none of them is silently coerced.
