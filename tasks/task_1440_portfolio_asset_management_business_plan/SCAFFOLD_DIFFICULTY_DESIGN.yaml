            - "Valuation.${v_int}.noi_used_cents == 30000000 (TRAILING_ACTUALS snapshot)"
            - "Valuation.${v_int}.implied_value_cents == 500000000 (round_half_up(30000000 * 10000 / 600))"
            - "v_ext_implied != v_int_implied — same asset state, two methods, different implied values"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: lease_rate_tiered_clamp_with_boundaries
        grounds:
          - calculations.recommended_lease_rate
          - entities.LeaseStrategy.fields.recommended_rate_psf_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs with tiered adjustment (occupancy breakpoints
          70/85/95) feeding a nested min/max clamp (floor 95% of proposed, ceiling 110% of
          market). Occupancy 82 lands in tier [70,85) -> -500bps; occupancy 85 lands in
          [85,95) -> 0bps; the boundary moves the recommendation by exactly 150 cents.
        test_recipe:
          setup:
            - "Portfolio P1, PM1, asset A1 OWNED (no plan needed for lease strategy)"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id } }
            - { call: "POST /api/lease-strategies", payload: { asset_id: "${a1}", space_type: "OFFICE_SUITE", current_occupancy_pct: 82, proposed_asking_rate_psf_cents: 2800, market_comp_rate_psf_cents: 3000 }, as: AssetManager, as_user_id: "am-1", captures: { s82: $.data.id } }
            - { call: "POST /api/lease-strategies", payload: { asset_id: "${a1}", space_type: "RETAIL_BAY", current_occupancy_pct: 85, proposed_asking_rate_psf_cents: 2800, market_comp_rate_psf_cents: 3000 }, as: AssetManager, as_user_id: "am-1", captures: { s85: $.data.id } }
            - { call: "POST /api/lease-strategies", payload: { asset_id: "${a1}", space_type: "INDUSTRIAL_BAY", current_occupancy_pct: 96, proposed_asking_rate_psf_cents: 2800, market_comp_rate_psf_cents: 3000 }, as: AssetManager, as_user_id: "am-1", captures: { s96: $.data.id } }
          trigger:
            - { call: "POST /api/lease-strategies/${s82}/recommend", payload: {}, as: Analyst, captures: { r82: $.data.recommended_rate_psf_cents } }
            - { call: "POST /api/lease-strategies/${s85}/recommend", payload: {}, as: Analyst, captures: { r85: $.data.recommended_rate_psf_cents } }
            - { call: "POST /api/lease-strategies/${s96}/recommend", payload: {}, as: Analyst, captures: { r96: $.data.recommended_rate_psf_cents } }
          assert:
            - "r82 == 2850 — tier [70,85): adjusted 3000*9500/10000=2850; floor 2660; ceiling 3300; min(max(2850,2660),3300)=2850"
            - "r85 == 3000 — tier [85,95): adjusted 3000; clamp no-op; the 82->85 boundary crosses tiers"
            - "r96 == 3150 — tier [95,100]: adjusted 3000*10500/10000=3150; clamp no-op"
            - "LeaseStrategy.${s82}.status == RECOMMENDED"

      - name: reforecast_spread_remainder_to_final_month
        grounds:
          - calculations.reforecast_spread
          - state_machines.ReForecast.SUBMITTED_to_APPLIED
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from sibling's mode (a)): 100,000,000 remaining
          cents over 9 months is floored per month (11,111,111) and the single remainder is
          absorbed by month 12 (11,111,112) — per-month rounding then summing would drift
          by one cent; the pinned order is observable on lines m4 and m12.
        test_recipe:
          setup:
            - "Portfolio P1 (start month 1), PM1, asset A1"
            - "FY2027 plan APPROVED: RENT 11,000,000/mo x12 + 9 single month-1 lines (PARKING 500,000 / OTHER_REV 100,000 / CAM 200,000 / TAX 300,000 / INS 50,000 / UTIL 80,000 / MGMT 120,000 / OPEX 90,000 / CAPITAL 36,000,000)"
            - "Clock at 2027-04-05 (fiscal month 4 — cadence-open)"
            - "Actuals months 1-3 accepted with RENT actual 11,000,000 each (ytd RENT actual = 33,000,000)"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 2, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 3, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 4, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 5, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 6, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 7, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 8, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 9, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 10, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 11, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 12, budget_amount_cents: 11000000 }
                  - { category: PARKING_REVENUE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: OTHER_REVENUE, month_index: 1, budget_amount_cents: 100000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 200000 }
                  - { category: TAX_EXPENSE, month_index: 1, budget_amount_cents: 300000 }
                  - { category: INSURANCE_EXPENSE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: UTILITIES_EXPENSE, month_index: 1, budget_amount_cents: 80000 }
                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
              captures: { rent_m1: "$.data[0].id", rent_m2: "$.data[1].id", rent_m3: "$.data[2].id" }
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
