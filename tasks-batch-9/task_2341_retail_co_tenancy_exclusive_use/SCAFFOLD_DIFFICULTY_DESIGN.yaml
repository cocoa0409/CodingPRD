- rule_id: non_linear_state_machine
  instances:
  - name: notice_dispute_denied_returns_to_issued_and_restarts_cure
    grounds:
    - state_machines.UseViolationNotice.status.ISSUED_to_DISPUTED
    - state_machines.UseViolationNotice.status.DISPUTED_to_ISSUED
    - state_machines.UseViolationDispute.status.PENDING_to_DENIED
    - entities.UseViolationNotice.fields.cure_restart_count
    - entities.UseViolationNotice.fields.cure_deadline_at
    distinguishing_aspect: 'Cyclic re-entry: the notice returns to the ISSUED state it already occupied, and the loop is observable only through cure_restart_count incrementing to 1 and cure_deadline_at
      being re-based on the adjudication instant 2026-08-10 plus cure_period_days 30 plus the granted cure_extension_days 15, giving 2026-09-24T00:00:00Z instead of the original 2026-08-31T00:00:00Z.'
    test_recipe:
      setup:
      - Center with five OPEN leases
      - ACTIVE center-wide ExclusiveUseClause on lease I1 protecting COFFEE
      - UseViolationNotice ISSUED on 2026-08-01 against lease I3 citing that clause, cure_period_days 30, so cure_deadline_at is 2026-08-31T00:00:00Z
      - UseViolationDispute filed by the I3 TenantRep with grounds_code CARVE_OUT_APPLIES and cure_extension_days 15, moving the notice to DISPUTED
      - Logical clock advanced to 2026-08-10T00:00:00Z
      setup_api_calls:
