              payload: { movement_id: "${mv_id}", expected_student_version: "${a2_v}" }
              as: TeamLead
            - call: "POST /districts/${d_id}/intervention-catalog"
              payload: { title: "Intensive", subject: "READING", tier_target: "TIER_3", grade_min: 3, grade_max: 5, session_minutes: 60, sessions_per_week: 5, probe_frequency: "WEEKLY" }
              as: DistrictCoordinator
              captures: { ce_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/interventionists"
              payload: { full_name: "I", weekly_minute_capacity: 1200, subjects: ["READING"] }
              as: SchoolRegistrar
              captures: { i_id: $.data.id }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${a2_id}"
              payload: {}
              as: TeamLead
