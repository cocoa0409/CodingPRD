      - FacadePackage.${pkg}.mockup_qualified == true and state == MOCKUP_QUALIFIED after mockup 1 passes
- rule_id: compensating_invariant
  instances:
  - name: breakage_draw_cancellation_restores_lite_conservation
    grounds:
    - calculations.glass_lite_ledger
    - state_machines.BreakageDraw.DRAWN_to_CANCELLED
    - validations[priority=102]
    - concurrency_rules[breakage-draw-stale-glass-order]
    distinguishing_aspect: 'Cancelling a draw is a true compensation, not a decrement: drawn_lites and available_stock_lites
      are recomputed from the surviving DRAWN rows so breakage_stock_lites == available_stock_lites + drawn_lites holds
      at every step, and the freed capacity becomes drawable again with no drift after four writes.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z
      - 'glass order of 240 lites received in full: breakage_stock_lites floor(7.2) == 7, available_stock_lites 7'
      - one release of 36 panels for the zone -> lot 1 with lite_count 72
      - draw A of 3 lites and draw B of 4 lites, both DRAWN, exhausting the stock
      setup_api_calls:
      - *id040
      - *id041
      - *id042
      - *id043
      - *id044
      - *id045
      - *id046
      - *id047
      - *id048
      - *id049
      - *id050
      - *id051
      - *id052
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z1: $.data.id
      - call: GET /facade-packages/${pkg}
        payload: {}
        as: CWProjectManager
        captures:
          pkg_v: $.data.version
      - call: POST /fabrication-releases
        payload:
          package_id: ${pkg}
          submittal_id: ${sub}
          glass_order_id: ${go}
          zone_ids:
          - ${z1}
          panels_per_zone: 36
          lites_per_panel: 2
          expected_package_version: ${pkg_v}
        as: CWProjectManager
        captures:
          rel: $.data.id
      - call: GET /panel-lots
        payload:
          zone_id: ${z1}
        as: FieldSuperintendent
        captures:
          lot1: $.data[0].id
      - call: GET /glass-orders/${go}
        payload: {}
        as: GlazingProcurement
        captures:
          go_v1: $.data.version
      - call: POST /breakage-draws
        payload:
          glass_order_id: ${go}
          panel_lot_id: ${lot1}
          quantity_lites: 3
          reason: FIELD_BREAKAGE
          expected_glass_order_version: ${go_v1}
        as: GlazingProcurement
        captures:
          bd_a: $.data.id
      - call: GET /glass-orders/${go}
        payload: {}
        as: GlazingProcurement
        captures:
          go_v2: $.data.version
      - call: POST /breakage-draws
        payload:
          glass_order_id: ${go}
          panel_lot_id: ${lot1}
          quantity_lites: 4
          reason: HANDLING_DAMAGE
          expected_glass_order_version: ${go_v2}
        as: GlazingProcurement
        captures:
          bd_b: $.data.id
      - call: GET /glass-orders/${go}
        payload: {}
        as: GlazingProcurement
        captures:
          go_v3: $.data.version
      - call: POST /breakage-draws
        payload:
          glass_order_id: ${go}
          panel_lot_id: ${lot1}
          quantity_lites: 1
          reason: FIELD_BREAKAGE
          expected_glass_order_version: ${go_v3}
        as: GlazingProcurement
        captures:
          e_exhausted: $.data.error_id
      trigger:
      - call: POST /breakage-draws/${bd_a}/cancel
        payload:
          cancelled_reason: lite was re-usable after re-inspection, draw reversed
        as: GlazingProcurement
      - call: GET /glass-orders/${go}
        payload: {}
        as: GlazingProcurement
        captures:
          go_v4: $.data.version
      - call: POST /breakage-draws
        payload:
          glass_order_id: ${go}
          panel_lot_id: ${lot1}
          quantity_lites: 3
          reason: FIELD_BREAKAGE
          expected_glass_order_version: ${go_v4}
        as: GlazingProcurement
        captures:
          bd_c: $.data.id
      assert:
      - after both draws GlassOrder.${go}.drawn_lites == 7 and available_stock_lites == 0 and the 1-lite attempt returned
        ERR_BREAKAGE_STOCK_EXHAUSTED
      - after the cancel BreakageDraw.${bd_a}.status == CANCELLED with the cancelled_reason stored
      - after the cancel GlassOrder.${go}.drawn_lites == 4 and available_stock_lites == 3
      - 'the re-draw of exactly 3 lites succeeds: BreakageDraw.${bd_c}.status == DRAWN, drawn_lites back to 7, available_stock_lites
        back to 0'
      - breakage_stock_lites == available_stock_lites + drawn_lites holds after every one of the five writes, and breakage_stock_lites
        is still 7 throughout
      - GlassOrder.${go}.allocated_lites == 72 and unallocated_lites == 161 are untouched by every draw and by the cancellation
      - GlassOrder.${go}.version increments on the cancel as well as on each accepted draw, so a subsequent draw needs a
        freshly read expected_glass_order_version
      - 'GET /breakage-draws filtered by glass_order_id returns 3 rows: 2 DRAWN and 1 CANCELLED (a cancelled draw is never
        removed)'
  - name: crew_day_void_restores_hour_ledger_reindexes_and_recomputes_final_cost
    grounds:
    - state_machines.CrewDayLog.POSTED_to_VOIDED
    - calculations.zone_crew_hour_ledger
    - calculations.zone_field_labor_cost
    - entities.CrewDayLog.fields.day_index
    - calculations.earned_value_certified_cents
    distinguishing_aspect: Voiding the first of three crew days must undo three derived structures at once - the hour ledger
      (100.0 -> 64.0 consumed, 220.0 -> 256.0 remaining), the day_index packing (the survivors become 1 and 2, not 2 and
      3) and the chronological final cost (1149540 -> 721280) - while leaving the certified billing line alone, so no partial
      compensation survives.
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z advanced to 2026-08-10T09:00:00Z and then 2026-08-13T09:00:00Z
      - one 412.37 sqm zone, height_m 24.0, budget_crew_hours 320.0, hung and certified WEATHER_TIGHT
      - 'three POSTED crew days: 2026-08-10 with 4 x 9.0 (day_cost 428260), 2026-08-11 with 4 x 8.0 (360640), 2026-08-12
        with 4 x 8.0 (360640)'
      setup_api_calls:
      - *id040
      - *id041
      - *id042
      - *id043
      - *id044
      - *id045
      - *id046
      - *id047
      - *id048
      - *id049
      - *id050
      - *id051
      - *id052
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z1: $.data.id
      - call: GET /facade-packages/${pkg}
        payload: {}
        as: CWProjectManager
        captures:
          pkg_v: $.data.version
      - call: POST /fabrication-releases
        payload:
          package_id: ${pkg}
          submittal_id: ${sub}
          glass_order_id: ${go}
          zone_ids:
          - ${z1}
          panels_per_zone: 36
          lites_per_panel: 2
          expected_package_version: ${pkg_v}
        as: CWProjectManager
        captures:
          rel: $.data.id
      - call: GET /panel-lots
        payload:
          zone_id: ${z1}
        as: FieldSuperintendent
        captures:
          lot1: $.data[0].id
      - call: POST /panel-lots/${lot1}/advance-fabrication
        payload:
          to_status: GLAZED
        as: FieldSuperintendent
      - call: POST /panel-lots/${lot1}/advance-fabrication
        payload:
          to_status: SHIPPED
        as: FieldSuperintendent
      - call: POST /installation-zones/${z1}/embed-surveys
        payload:
          embed_layout_ref: EL-05-N
          planned_anchor_count: 72
        as: StructuralContractor
        captures:
          sv1: $.data.id
      - call: POST /embed-surveys/${sv1}/survey
        payload:
          surveyed_anchor_count: 72
          max_deviation_mm: 12.0
        as: StructuralContractor
      - call: POST /embed-surveys/${sv1}/confirm-pour
        payload:
          poured_at: '2026-08-06T12:00:00Z'
        as: StructuralContractor
      - call: POST /installation-zones/${z1}/set-anchors
        payload: {}
        as: FieldSuperintendent
      - call: POST /hoist-rigs
        payload:
          package_id: ${pkg}
          rig_code: HR-1
          rig_kind: MAST_CLIMBER
          capacity_panels_per_shift: 20
          changeover_buffer_minutes: 45
        as: FieldSuperintendent
        captures:
          rig: $.data.id
      - call: POST /hoist-reservations
        payload:
          rig_id: ${rig}
          zone_id: ${z1}
          window_start: '2026-08-10T06:00:00Z'
          window_end: '2026-08-10T18:00:00Z'
          planned_panel_count: 36
        as: FieldSuperintendent
        captures:
