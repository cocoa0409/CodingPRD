      - name: travel_tier_selected_from_direct_minutes_before_overhead_is_added
        grounds:
          - calculations.provider_assigned_weekly_minutes
          - calculations.provider_service_capacity_posture
          - entities.Provider.fields.travel_overhead_minutes
          - entities.ServiceLine.fields.delivery_site_id
          - state_machines.ServiceLine.PROPOSED_to_STAFFED
        distinguishing_aspect: |
          With 290 direct minutes at a single site the travel tier is chosen from
          the 290 direct total alone (0.05), giving overhead 15 and an assigned
