              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Ivo", last_name: "Marchetti", dob: "2011-07-07", grade_level: 9, has_iep: false, guardian_user_id: "guardian-ivo" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "GET /records-office/students/${student_id}/cumulative-files"
              payload: {}
              as: RecordsOfficer
              captures: { file_id: "$.data[0].id" }
            - call: "POST /records-office/students/${student_id}/withdrawals"
              payload: { effective_date: "2026-08-14", destination_district_code: "RECV01", withdrawal_reason: "MOVED" }
              as: RecordsClerk
              captures: { withdrawal_id: "$.data.id" }
            - call: "POST /records-office/withdrawals/${withdrawal_id}/complete"
              payload: {}
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "GET /records-office/cumulative-files/${file_id}/retention-schedules"
              payload: {}
              as: ComplianceOfficer
              captures: { schedule_id: "$.data[0].id" }
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T08:30:00Z" }
              as: SystemAdmin
            - call: "POST /records-office/students/${student_id}/legal-demands"
              payload: { demand_type: "EX_PARTE_ORDER", issuing_authority: "Superior Court of CA, County of Alta", case_reference: "EX-2026-4417", production_scope: "Complete cumulative file, academic and discipline components", notification_waived: true, waiver_basis: "EX_PARTE_COURT_ORDER" }
              as: LegalAffairsOfficer
              as_user_id: "legal-1"
              captures: { demand_id: "$.data.id" }
          trigger:
            - call: "POST /records-office/legal-demands/${demand_id}/production"
              payload: { produced_page_count: 40 }
