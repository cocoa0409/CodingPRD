        test_recipe:
          setup: ["season DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President }
