  - rule_id: resource_temporal_overlap
    instances:
      - name: conservator_engagement_half_open_window_with_48h_buffer
        grounds:
          - validations[priority=28]
          - errors[ERR_CONSERVATOR_WINDOW_CONFLICT]
          - entities.Conservator.fields.active_engagement_count
          - state_machines.TreatmentProposal.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Resource Conservator, HALF-OPEN interval semantics [engagement_start, engagement_end) padded by
          CONSERVATOR_BUFFER_HOURS 48 on both sides. The second engagement starts 2026-09-06, one day
          after the first ends (2026-09-05) and therefore inside the 48-hour buffer, so it collides even
          though the raw intervals are disjoint; a start of exactly 2026-09-07T00:00:00Z is the first
          non-colliding instant. Priority 28 fires ahead of the funding check, so no allocation exists
          for the second proposal.
