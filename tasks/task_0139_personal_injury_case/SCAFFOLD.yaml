scenario: "Personal Injury Law Firm Case Management: client intake, medical records request, Damages model, medical Liens, Demand Letter, settlement negotiation, contingency fee settlement, court calendar, Statute of Limitations."
domain_name: "personal-injury-case"
api_prefix: "/pi-cases"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - waterfall_allocation
    - scheduled_deferred_actions

  entity_topology: hybrid
  # Case is the central hub; Client, CourtEvent, DemandLetter, SettlementOffer, Lien, MedicalRecordRequest
  # are peers attached to Case via case_id. Damages is a singleton child of Case. SettlementOffer is
  # cross-referenced by predecessor_offer_id for negotiation rounds (self-referential).

  state_machine_shape: cyclic
  # SettlementOffer chain produces cyclic counter-offer rounds; Case has a branching pipeline with
  # diamond convergence (DEMAND_SENT → {NEGOTIATING, LITIGATION} → SETTLED|TRIAL).

  relationship_patterns:
    - one_to_many               # Case has many Liens, CourtEvents, MedicalRecordRequests
    - self_referential          # SettlementOffer.predecessor_offer_id references prior offer
    - cross_aggregate           # Damages and Lien aggregates feed into Case settlement totals

  role_model: segregation_of_duties
  # Paralegal does intake + records; Attorney drafts/sends demand + negotiates settlement;
  # ManagingPartner approves final settlement disbursement. Same user cannot both negotiate
  # and approve disbursement on the same case.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 — Entity-Relationship Table
# ============================================================================

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Client legal name."
        constraints: "Non-empty, max 200 chars."
      - name: date_of_birth
        type: string
        source: input
        description: "Client date of birth (YYYY-MM-DD)."
        constraints: "ISO 8601 date; must be in the past."
      - name: is_minor_at_incident
        type: boolean
        source: computed
        description: "True if (incident_date - date_of_birth) < 18 years on the matching Case.incident_date. Set when first Case is created for this client; null until then."
        default: null
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email."
        constraints: "Must match email regex."
      - name: state_of_residence
        type: string
        source: input
        description: "Two-letter US state code; drives jurisdictional SoL lookup."
        constraints: "Length == 2, uppercase."

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK → Client.id (uuid, no prefix)."
      - name: incident_date
        type: string
        source: input
        description: "Date of injury (YYYY-MM-DD)."
        constraints: "Must be in the past; must be on or after Client.date_of_birth."
      - name: incident_type
        type: enum
        source: input
        description: "Category of the underlying claim."
        constraints: "One of {AUTO, SLIP_FALL, MEDICAL_MALPRACTICE, PRODUCT_LIABILITY, PREMISES, DOG_BITE}."
      - name: jurisdiction_state
        type: string
        source: input
        description: "Two-letter state code where claim is filed; drives SoL table."
        constraints: "Length == 2, uppercase."
      - name: status
        type: enum
        source: computed
        description: "Case lifecycle state."
        default: "INTAKE"
        constraints: "One of {INTAKE, RECORDS_PENDING, READY_FOR_DEMAND, DEMAND_SENT, NEGOTIATING, LITIGATION, SETTLED, TRIAL_AWARDED, DISMISSED, CLOSED}."
      - name: sol_deadline
        type: string
        source: computed
        description: "ISO 8601 date — statute-of-limitations expiry computed via calc_sol_deadline on case creation and on any tolling event."
      - name: sol_tolled_days
        type: integer
        source: computed
        description: "Cumulative tolling days applied (e.g., incapacity, fraudulent concealment, minor tolling)."
        default: 0
      - name: assigned_attorney_id
        type: string
        source: input
        description: "FK → User (Attorney role). Required by READY_FOR_DEMAND transition."
        default: null
      - name: assigned_paralegal_id
        type: string
        source: input
        description: "FK → User (Paralegal role)."
        default: null
      - name: gross_settlement_cents
        type: integer
        source: computed
        description: "Set when SettlementOffer with status==ACCEPTED is recorded; equals that offer's amount_cents. 0 until acceptance."
        default: 0
      - name: case_costs_cents
        type: integer
        source: input
        description: "Accumulated firm-advanced costs (filing fees, expert witnesses). Updated via PATCH /pi-cases/{id}/costs."
        default: 0
      - name: filed_in_court
        type: boolean
        source: computed
        description: "True after the first CourtEvent with event_type==COMPLAINT_FILED is created; flips contingency fee tier from PRE_SUIT to POST_SUIT."
        default: false
      - name: disbursement_approved_by
        type: string
        source: computed
        description: "User id (ManagingPartner role) who approved final disbursement; null until POST /disbursement/approve."
        default: null

  - name: MedicalRecordRequest
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK → Case.id."
      - name: provider_name
        type: string
        source: input
        description: "Healthcare provider holding the records."
        constraints: "Non-empty."
      - name: date_of_service_start
        type: string
        source: input
        description: "Earliest date of treatment requested (YYYY-MM-DD)."
      - name: date_of_service_end
        type: string
        source: input
        description: "Latest date of treatment requested (YYYY-MM-DD)."
        constraints: "Must be on or after date_of_service_start; must be on or after Case.incident_date."
      - name: status
        type: enum
        source: computed
        description: "Request lifecycle."
        default: "DRAFT"
        constraints: "One of {DRAFT, SENT, RECEIVED, REJECTED, CANCELED}."
      - name: sent_at
        type: datetime
        source: computed
        description: "Timestamp when request was sent to provider."
        default: null
      - name: received_at
        type: datetime
        source: computed
        description: "Timestamp when records were marked received."
        default: null
      - name: billed_amount_cents
        type: integer
        source: input
        description: "Total billed by the provider for the requested service window; entered when status flips RECEIVED."
        default: 0

  - name: Damages
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK → Case.id. Unique per Case (1:1)."
        constraints: "Exactly one Damages row per Case."
      - name: medical_bills_cents
        type: integer
        source: computed
        description: "Sum of MedicalRecordRequest.billed_amount_cents where status==RECEIVED for this case. Recomputed on every RECEIVED transition."
        default: 0
      - name: lost_wages_cents
        type: integer
        source: input
        description: "Client-attested lost wages, validated against pay-stub upload (out of scope here)."
        default: 0
      - name: property_damage_cents
        type: integer
        source: input
        description: "Repair/replacement cost."
        default: 0
      - name: pain_suffering_method
        type: enum
        source: input
        description: "Method used to value non-economic damages."
        default: "MULTIPLIER"
        constraints: "One of {MULTIPLIER, PER_DIEM}."
      - name: multiplier_value
        type: number
        source: input
        description: "Used only when pain_suffering_method==MULTIPLIER. Range 1.0–5.0; 0.1 precision."
        default: 1.5
      - name: per_diem_rate_cents
        type: integer
        source: input
        description: "Used only when pain_suffering_method==PER_DIEM. Daily rate in cents."
        default: 0
      - name: per_diem_days
        type: integer
        source: input
        description: "Used only when pain_suffering_method==PER_DIEM. Recovery days, must be > 0."
        default: 0
      - name: pain_suffering_cents
        type: integer
        source: computed
        description: "Non-economic damages computed by calc_damages_total per the active method."
        default: 0
      - name: total_damages_cents
        type: integer
        source: computed
        description: "Sum of economic + non-economic damages."
        default: 0

  - name: Lien
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK → Case.id."
      - name: lienholder_name
        type: string
        source: input
        description: "Party asserting the lien."
        constraints: "Non-empty."
      - name: lien_type
        type: enum
        source: input
        description: "Drives reduction-formula selection and priority order."
        constraints: "One of {MEDICARE, MEDICAID, ERISA, HOSPITAL_STATUTORY, PROVIDER_NEGOTIATED, CHILD_SUPPORT, ATTORNEY_PRIOR_COUNSEL}."
      - name: face_amount_cents
        type: integer
        source: input
        description: "Original asserted amount in cents."
        constraints: "> 0."
      - name: negotiated_amount_cents
        type: integer
        source: input
        description: "Amount agreed by the lienholder after negotiation; null until negotiation closes."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lien lifecycle."
        default: "ASSERTED"
        constraints: "One of {ASSERTED, NEGOTIATING, REDUCED, RESOLVED, DISPUTED}."
      - name: final_paid_amount_cents
        type: integer
        source: computed
        description: "Set when settlement disburses (state RESOLVED). Computed by calc_net_disbursement per case strategy."
        default: null
      - name: priority_rank
        type: integer
        source: computed
        description: "Position in chronological repayment order, derived from lien_type table at disbursement time."
        default: null

  - name: DemandLetter
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK → Case.id. At most one ACTIVE DemandLetter per case."
      - name: demanded_amount_cents
        type: integer
        source: input
        description: "Total amount demanded in the letter."
        constraints: ">= total_damages_cents on the linked Damages row."
      - name: snapshot_total_damages_cents
        type: integer
        source: computed
        description: "Damages.total_damages_cents at the moment the letter was sent — pinned for later staleness checks."
        default: 0
      - name: snapshot_damages_version
        type: integer
        source: computed
        description: "Damages.version at the moment the letter was sent."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Demand letter lifecycle."
        default: "DRAFT"
        constraints: "One of {DRAFT, SENT, RESPONDED, SUPERSEDED, WITHDRAWN}."
      - name: sent_at
        type: datetime
        source: computed
        description: "Timestamp when sent to the defendant/insurer."
        default: null
      - name: response_due_at
        type: datetime
        source: computed
        description: "sent_at + 30 calendar days; deadline after which auto-escalation triggers."
        default: null

  - name: SettlementOffer
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK → Case.id."
      - name: predecessor_offer_id
        type: string
        source: input
        description: "FK → SettlementOffer.id of the offer this responds to (self-referential). Null for first offer."
        default: null
      - name: offer_party
        type: enum
        source: input
        description: "Who is making this offer."
        constraints: "One of {DEFENDANT, PLAINTIFF}."
      - name: amount_cents
        type: integer
        source: input
        description: "Offered settlement amount in cents."
        constraints: "> 0."
      - name: status
        type: enum
        source: computed
        description: "Offer lifecycle."
        default: "PENDING"
        constraints: "One of {PENDING, ACCEPTED, REJECTED, COUNTERED, EXPIRED, WITHDRAWN}."
      - name: expires_at
        type: datetime
        source: input
        description: "Wall-clock expiry; if exceeded with status==PENDING, sweep flips to EXPIRED."
      - name: round_number
        type: integer
        source: computed
        description: "Length of the predecessor chain + 1. First offer is round 1."
        default: 1

  - name: ContingencyFeeAgreement
    parent: Case
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK → Case.id. Exactly one per case, immutable after creation."
        constraints: "Unique per case_id."
      - name: pre_suit_rate_bps
        type: integer
        source: input
        description: "Pre-suit fee in basis points (e.g., 3333 = 33.33%)."
        default: 3333
        constraints: "0 < value <= 5000."
      - name: post_suit_rate_bps
        type: integer
        source: input
        description: "Post-suit fee in basis points (e.g., 4000 = 40.00%)."
        default: 4000
        constraints: "0 < value <= 5000."
      - name: trial_rate_bps
        type: integer
        source: input
        description: "Trial-awarded rate in basis points."
        default: 4500
        constraints: "0 < value <= 5000."
      - name: signed_at
        type: datetime
        source: system
        description: "Timestamp when agreement was executed; pinned at creation."

  - name: CourtEvent
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK → Case.id."
      - name: event_type
        type: enum
        source: input
        description: "Type of court calendar entry."
        constraints: "One of {COMPLAINT_FILED, ANSWER_DUE, DISCOVERY_DEADLINE, MEDIATION, MOTION_HEARING, TRIAL, JUDGMENT}."
      - name: scheduled_at
        type: datetime
        source: input
        description: "Wall-clock time the event is scheduled."
      - name: duration_minutes
        type: integer
        source: input
        description: "Expected duration; used for attorney calendar conflict detection."
        constraints: ">= 15, <= 480."
      - name: courtroom
        type: string
        source: input
        description: "Free-text courtroom identifier."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Court event state."
        default: "SCHEDULED"
        constraints: "One of {SCHEDULED, COMPLETED, CONTINUED, CANCELED}."

  - name: SettlementDisbursement
    parent: Case
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK → Case.id. Exactly one per case; created by POST /pi-cases/{id}/disbursement/approve."
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Copied from Case.gross_settlement_cents at creation."
      - name: attorney_fee_cents
        type: integer
        source: computed
        description: "Computed via calc_attorney_fee using the active contingency tier."
      - name: case_costs_cents
        type: integer
        source: computed
        description: "Snapshot of Case.case_costs_cents at approval time."
      - name: total_lien_payment_cents
        type: integer
        source: computed
        description: "Sum of Lien.final_paid_amount_cents across this case after disbursement strategy executes."
      - name: client_net_cents
        type: integer
        source: computed
        description: "gross - attorney_fee - case_costs - total_lien_payment."
      - name: strategy
        type: enum
        source: input
        description: "Which disbursement algorithm was used."
        constraints: "One of {CHRONOLOGICAL_PRIORITY, FORWARD_LOOKING_PRORATA}."
      - name: approved_by
        type: string
        source: system
        description: "ManagingPartner X-User-ID at approval; copied into Case.disbursement_approved_by."

# ============================================================================
# §1.2 — State Machine Table
# ============================================================================

state_machines:
  - entity: Case
    initial_state: INTAKE
    terminal_states: [SETTLED, TRIAL_AWARDED, DISMISSED, CLOSED]
    transitions:
      - from: INTAKE
        to: RECORDS_PENDING
        trigger: "POST /pi-cases/{id}/medical-record-requests (first request created)"
        actor: Paralegal
        preconditions:
          - "ContingencyFeeAgreement exists for case."
          - "Case.sol_deadline > now() + 30 days (cannot start records work too close to SoL)."
        side_effects:
          - "Case.status flips to RECORDS_PENDING."

      - from: RECORDS_PENDING
        to: READY_FOR_DEMAND
        trigger: "PATCH /pi-cases/{id}/medical-record-requests/{rid} status→RECEIVED on the last outstanding request"
        actor: Paralegal
        preconditions:
          - "All MedicalRecordRequest rows for this case have status IN {RECEIVED, CANCELED, REJECTED} (not DRAFT or SENT)."
          - "At least one request reached RECEIVED."
          - "Damages row exists and total_damages_cents > 0 after recomputation."
          - "Case.assigned_attorney_id is set."
        side_effects:
          - "Damages.medical_bills_cents recomputed from RECEIVED requests; Damages.total_damages_cents recomputed; Damages.version increments. (Cascade hop 1.)"
          - "Case.status flips to READY_FOR_DEMAND. (Cascade hop 2.)"

      - from: READY_FOR_DEMAND
        to: DEMAND_SENT
        trigger: "POST /pi-cases/{id}/demand-letters/{lid}/send"
        actor: Attorney
        preconditions:
          - "DemandLetter.status == DRAFT."
          - "DemandLetter.demanded_amount_cents >= Damages.total_damages_cents."
          - "now() < Case.sol_deadline."
        side_effects:
          - "DemandLetter.status flips to SENT; sent_at = now(); response_due_at = now() + 30 days; snapshot_total_damages_cents and snapshot_damages_version pinned. (Cascade hop 1.)"
          - "Case.status flips to DEMAND_SENT. (Cascade hop 2.)"

      - from: DEMAND_SENT
        to: NEGOTIATING
        trigger: "POST /pi-cases/{id}/settlement-offers (first DEFENDANT-party offer)"
        actor: Attorney
        preconditions:
          - "DemandLetter.status == SENT."
          - "offer_party == DEFENDANT."
        side_effects:
          - "DemandLetter.status flips to RESPONDED."
          - "Case.status flips to NEGOTIATING."

      - from: DEMAND_SENT
        to: LITIGATION
        trigger: "POST /pi-cases/{id}/court-events (event_type==COMPLAINT_FILED) when no defendant offer received and response_due_at < now()"
        actor: Attorney
        preconditions:
          - "Now() >= DemandLetter.response_due_at."
          - "No SettlementOffer with offer_party==DEFENDANT exists for this case."
        side_effects:
          - "DemandLetter.status flips to SUPERSEDED. (Cascade hop 1.)"
          - "Case.filed_in_court flips to true. (Cascade hop 2.)"
          - "Case.status flips to LITIGATION. (Cascade hop 3.)"

      - from: NEGOTIATING
        to: NEGOTIATING
        trigger: "POST /pi-cases/{id}/settlement-offers (counter-offer); predecessor_offer_id required"
        actor: Attorney
        preconditions:
          - "Predecessor SettlementOffer.status == PENDING and not expired."
          - "Predecessor's offer_party is the opposite party."
        side_effects:
          - "Predecessor SettlementOffer.status flips to COUNTERED."
          - "New offer round_number = predecessor.round_number + 1; cyclic loop."

      - from: NEGOTIATING
        to: LITIGATION
        trigger: "POST /pi-cases/{id}/court-events (event_type==COMPLAINT_FILED) while negotiating"
        actor: Attorney
        preconditions:
          - "At least one offer was made (round_number >= 1)."
          - "now() < Case.sol_deadline."
        side_effects:
          - "All SettlementOffer rows with status==PENDING flip to WITHDRAWN. (Cascade hop 1.)"
          - "Case.filed_in_court flips to true. (Cascade hop 2.)"
          - "Case.status flips to LITIGATION. (Cascade hop 3.)"

      - from: NEGOTIATING
        to: SETTLED
        trigger: "PATCH /pi-cases/{id}/settlement-offers/{oid} status→ACCEPTED"
        actor: Attorney
        preconditions:
          - "SettlementOffer.status == PENDING."
          - "now() <= SettlementOffer.expires_at."
        side_effects:
          - "SettlementOffer.status flips to ACCEPTED. (Cascade hop 1.)"
          - "Case.gross_settlement_cents = accepted offer.amount_cents. (Cascade hop 2.)"
          - "All other SettlementOffer rows on this case with status==PENDING flip to WITHDRAWN. (Cascade hop 2.)"
          - "Case.status flips to SETTLED. (Cascade hop 3.)"

      - from: LITIGATION
        to: SETTLED
        trigger: "PATCH /pi-cases/{id}/settlement-offers/{oid} status→ACCEPTED (post-filing)"
        actor: Attorney
        preconditions:
          - "Case.filed_in_court == true."
          - "SettlementOffer.status == PENDING."
        side_effects:
          - "Same chain as NEGOTIATING→SETTLED but contingency tier becomes POST_SUIT for calc_attorney_fee."

      - from: LITIGATION
        to: TRIAL_AWARDED
        trigger: "PATCH /pi-cases/{id}/court-events/{eid} status→COMPLETED on event_type==JUDGMENT with positive award"
        actor: Attorney
        preconditions:
          - "CourtEvent.event_type == JUDGMENT."
          - "CourtEvent.status == SCHEDULED."
          - "award_amount_cents > 0 in payload."
        side_effects:
          - "Case.gross_settlement_cents = award_amount_cents."
          - "Case.status flips to TRIAL_AWARDED; contingency tier becomes TRIAL."

      - from: SETTLED
        to: CLOSED
        trigger: "POST /pi-cases/{id}/disbursement/approve"
        actor: ManagingPartner
        preconditions:
          - "Case.disbursement_approved_by is null (idempotency: not yet approved)."
          - "Acting user (X-User-ID) is NOT the same id as Case.assigned_attorney_id (segregation of duties)."
          - "Every Lien row on the case has status NOT IN {NEGOTIATING}. Statutory ASSERTED liens (MEDICARE, MEDICAID, ERISA, CHILD_SUPPORT) without negotiated_amount_cents are accepted because calc_net_disbursement auto-reduces them via the statutory formula on the cascade. Non-statutory liens (HOSPITAL_STATUTORY, ATTORNEY_PRIOR_COUNSEL, PROVIDER_NEGOTIATED) must be in REDUCED, RESOLVED, or DISPUTED."
        side_effects:
          - "calc_net_disbursement runs with strategy from request body. Statutory ASSERTED liens are auto-reduced (Lien.status ASSERTED→REDUCED) before payment is computed. (Cascade hop 1.)"
          - "Each Lien.final_paid_amount_cents set and Lien.status flips to RESOLVED (DISPUTED liens skipped: final_paid_amount_cents=0, status unchanged). (Cascade hop 2.)"
          - "SettlementDisbursement row created. (Cascade hop 3.)"
          - "Case.disbursement_approved_by set; Case.status flips to CLOSED. (Cascade hop 4.)"

      - from: TRIAL_AWARDED
        to: CLOSED
        trigger: "POST /pi-cases/{id}/disbursement/approve"
        actor: ManagingPartner
        preconditions:
          - "Same as SETTLED→CLOSED but contingency tier is TRIAL."
        side_effects:
          - "Same cascade as SETTLED→CLOSED."

      - from: INTAKE
        to: DISMISSED
        trigger: "POST /pi-cases/{id}/dismiss"
        actor: ManagingPartner
        preconditions:
          - "Case.status IN {INTAKE, RECORDS_PENDING, READY_FOR_DEMAND}."
        side_effects:
          - "All open MedicalRecordRequest rows (status IN {DRAFT, SENT}) flip to CANCELED."

      - from: RECORDS_PENDING
        to: DISMISSED
        trigger: "POST /pi-cases/{id}/dismiss"
        actor: ManagingPartner
        preconditions:
          - "Case.status IN {INTAKE, RECORDS_PENDING, READY_FOR_DEMAND}."
        side_effects:
          - "All open MedicalRecordRequest rows (status IN {DRAFT, SENT}) flip to CANCELED."

      - from: INTAKE
        to: INTAKE
        trigger: "POST /_sweep/sol — SoL expiry sweep finds Case.sol_deadline <= now() and Case.status NOT IN terminal"
        actor: system
        preconditions:
          - "Case.sol_deadline <= now()."
          - "Case.status NOT IN {SETTLED, TRIAL_AWARDED, DISMISSED, CLOSED}."
        side_effects:
          - "Case.status flips to DISMISSED; emits audit log entry sol_expired."

  - entity: MedicalRecordRequest
    initial_state: DRAFT
    terminal_states: [RECEIVED, REJECTED, CANCELED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /pi-cases/{cid}/medical-record-requests/{rid}/send"
        actor: Paralegal
        preconditions:
          - "Case.status IN {RECORDS_PENDING}."
        side_effects:
          - "sent_at = now()."

      - from: SENT
        to: RECEIVED
        trigger: "PATCH /pi-cases/{cid}/medical-record-requests/{rid} status→RECEIVED with billed_amount_cents in body"
        actor: Paralegal
        preconditions:
          - "billed_amount_cents >= 0."
        side_effects:
          - "received_at = now(); billed_amount_cents persisted. (Cascade hop 1.)"
          - "Damages.medical_bills_cents recomputed; Damages.total_damages_cents recomputed. (Cascade hop 2.)"
          - "If this was the last non-terminal request and assigned_attorney_id set, Case.status flips to READY_FOR_DEMAND. (Cascade hop 3.)"

      - from: SENT
        to: REJECTED
        trigger: "PATCH /pi-cases/{cid}/medical-record-requests/{rid} status→REJECTED"
        actor: Paralegal
        preconditions:
          - "Provider declined; no billed_amount_cents required."
        side_effects:
          - "Damages.medical_bills_cents recompute may leave Case.status unchanged."

      - from: DRAFT
        to: CANCELED
        trigger: "DELETE /pi-cases/{cid}/medical-record-requests/{rid} (only when still DRAFT)"
        actor: Paralegal
        preconditions: []
        side_effects: []

  - entity: DemandLetter
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN, RESPONDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /pi-cases/{cid}/demand-letters/{lid}/send"
        actor: Attorney
        preconditions:
          - "Case.status == READY_FOR_DEMAND."
          - "demanded_amount_cents >= Damages.total_damages_cents."
        side_effects:
          - "snapshot_total_damages_cents, snapshot_damages_version pinned; sent_at = now(); response_due_at = now() + 30d."

      - from: SENT
        to: RESPONDED
        trigger: "Defendant SettlementOffer created"
        actor: system
        preconditions:
          - "First SettlementOffer with offer_party==DEFENDANT created on the case."
        side_effects: []

      - from: SENT
        to: SUPERSEDED
        trigger: "Complaint filed; Case transitions DEMAND_SENT→LITIGATION"
        actor: system
        preconditions:
          - "First CourtEvent with event_type==COMPLAINT_FILED on the case."
        side_effects: []

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /pi-cases/{cid}/demand-letters/{lid}/withdraw"
        actor: Attorney
        preconditions:
          - "DemandLetter.status == DRAFT."
        side_effects: []

  - entity: SettlementOffer
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: COUNTERED
        trigger: "POST /pi-cases/{cid}/settlement-offers with predecessor_offer_id == this.id"
        actor: Attorney
        preconditions:
          - "Counter offer.offer_party != this.offer_party."
          - "now() <= this.expires_at."
        side_effects:
          - "New SettlementOffer row created with round_number = this.round_number + 1."

      - from: PENDING
        to: ACCEPTED
        trigger: "PATCH /pi-cases/{cid}/settlement-offers/{oid} status→ACCEPTED"
        actor: Attorney
        preconditions:
          - "now() <= expires_at."
          - "Case.status IN {NEGOTIATING, LITIGATION}."
        side_effects:
          - "Case.gross_settlement_cents = amount_cents; Case.status → SETTLED."

      - from: PENDING
        to: REJECTED
        trigger: "PATCH /pi-cases/{cid}/settlement-offers/{oid} status→REJECTED"
        actor: Attorney
        preconditions:
          - "now() <= expires_at."
        side_effects: []

      - from: PENDING
        to: EXPIRED
        trigger: "POST /_sweep/settlement_offers (sweep runs daily)"
        actor: system
        preconditions:
          - "now() > expires_at."
        side_effects: []

      - from: PENDING
        to: WITHDRAWN
        trigger: "Case state transition into LITIGATION or sibling offer ACCEPTED"
        actor: system
        preconditions:
          - "Triggered as side-effect cascade hop."
        side_effects: []

  - entity: Lien
    initial_state: ASSERTED
    terminal_states: [RESOLVED, DISPUTED]
    transitions:
      - from: ASSERTED
        to: NEGOTIATING
        trigger: "POST /pi-cases/{cid}/liens/{lid}/negotiate"
        actor: Paralegal
        preconditions:
          - "lien_type IN {PROVIDER_NEGOTIATED, HOSPITAL_STATUTORY, ATTORNEY_PRIOR_COUNSEL}."
        side_effects: []

      - from: NEGOTIATING
        to: REDUCED
        trigger: "PATCH /pi-cases/{cid}/liens/{lid} negotiated_amount_cents set"
        actor: Paralegal
        preconditions:
          - "negotiated_amount_cents > 0; <= face_amount_cents."
        side_effects: []

      - from: ASSERTED
        to: REDUCED
        trigger: "PATCH /pi-cases/{cid}/liens/{lid} negotiated_amount_cents set (statutory formula applied)"
        actor: system
        preconditions:
          - "lien_type IN {MEDICARE, MEDICAID, ERISA, CHILD_SUPPORT}."
        side_effects: []

      - from: REDUCED
        to: RESOLVED
        trigger: "POST /pi-cases/{cid}/disbursement/approve cascades final_paid_amount_cents set"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSERTED
        to: DISPUTED
        trigger: "POST /pi-cases/{cid}/liens/{lid}/dispute"
        actor: Attorney
        preconditions: []
        side_effects: []

  - entity: CourtEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "PATCH /pi-cases/{cid}/court-events/{eid} status→COMPLETED"
        actor: Attorney
        preconditions:
          - "now() >= scheduled_at."
        side_effects:
          - "If event_type==JUDGMENT and award_amount_cents > 0, Case.status flips to TRIAL_AWARDED (Cascade hop 1) and Case.gross_settlement_cents set (Cascade hop 2)."

      - from: SCHEDULED
        to: CONTINUED
        trigger: "PATCH /pi-cases/{cid}/court-events/{eid} status→CONTINUED with new scheduled_at"
        actor: Attorney
        preconditions:
          - "new scheduled_at > old scheduled_at."
        side_effects: []

      - from: SCHEDULED
        to: CANCELED
        trigger: "DELETE /pi-cases/{cid}/court-events/{eid}"
        actor: Attorney
        preconditions: []
        side_effects: []

# ============================================================================
# §1.2.1 — Concurrency Rules
# ============================================================================

concurrency_rules:
  - scenario: "Two attorneys both PATCH the same PENDING SettlementOffer to ACCEPTED simultaneously."
    guarantee: "Exactly one acceptance wins; the loser sees the offer already terminal."
    error_id: ERR_OFFER_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on SettlementOffer.status transition out of PENDING."

  - scenario: "Two paralegals create the singleton Damages row for the same Case concurrently."
    guarantee: "At most one Damages row per case; second insert rejected."
    error_id: ERR_DAMAGES_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique-index-style enforcement on Damages.case_id."

  - scenario: "Two paralegals create the singleton ContingencyFeeAgreement row for the same Case concurrently."
    guarantee: "At most one ContingencyFeeAgreement row per case; second insert rejected."
    error_id: ERR_FEE_AGREEMENT_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique-index-style enforcement on ContingencyFeeAgreement.case_id."

  - scenario: "ManagingPartner approves disbursement on a Case while a sibling request approves the same Case."
    guarantee: "Disbursement is approved exactly once; the loser sees ERR_DISBURSEMENT_ALREADY_APPROVED."
    error_id: ERR_DISBURSEMENT_ALREADY_APPROVED
    http_status: 409
    serialization: "First-writer-wins on Case.disbursement_approved_by transition from null."

  - scenario: "PATCH SettlementOffer status→ACCEPTED loses race against the SoL-expiry sweep that just dismissed the Case."
    guarantee: "Exactly one operation wins; acceptance loses because the Case is no longer in {NEGOTIATING, LITIGATION}."
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    serialization: "Sweep commits first; acceptance reads stale state and fails state-precondition."

  - scenario: "Two attorneys try to send the same DRAFT DemandLetter concurrently."
    guarantee: "Letter is sent exactly once."
    error_id: ERR_DEMAND_NOT_DRAFT
    http_status: 409
    serialization: "First-writer-wins on DemandLetter.status transition out of DRAFT."

  - scenario: "Two CourtEvents inserted with overlapping scheduled_at on the same assigned_attorney across cases."
    guarantee: "The second insert is rejected for attorney calendar conflict (see V_priority_70)."
    error_id: ERR_ATTORNEY_CALENDAR_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on overlap interval [scheduled_at, scheduled_at + duration_minutes)."

# ============================================================================
# §1.3 — Calculation Rules Table
# ============================================================================

calculations:
  - name: calc_sol_deadline
    trigger: "On POST /pi-cases (creation), and on POST /pi-cases/{id}/toll (any tolling event)."
    algorithm: threshold
    formula: |
      # SoL base years come from a fixed jurisdiction × incident_type lookup table.
      # Computation order is PINNED:
      #   1. base_deadline = incident_date + base_years_for(jurisdiction_state, incident_type) years
      #   2. if client.is_minor_at_incident: base_deadline = max(base_deadline, dob + 18y + minor_tail_years_for(jurisdiction_state))
      #   3. effective_deadline = base_deadline + sol_tolled_days (calendar days)
      # Comparison rule: a Case is OUT-OF-STATUTE iff now() >= effective_deadline (HARD >= boundary).
      base_years = SOL_TABLE[(jurisdiction_state, incident_type)]  # e.g., ("CA", "AUTO") -> 2
      base_deadline = add_years(incident_date, base_years)
      if client.is_minor_at_incident:
        minor_tail = MINOR_TAIL_TABLE[jurisdiction_state]          # e.g., "CA" -> 2
        minor_deadline = add_years(client.date_of_birth, 18 + minor_tail)
        base_deadline = max(base_deadline, minor_deadline)
      effective_deadline = base_deadline + timedelta(days=sol_tolled_days)
      return effective_deadline
    input_set: "(jurisdiction_state, incident_type) drives base_years; client.is_minor_at_incident gates minor-tail path; sol_tolled_days adds calendar days."
    constants:
      SOL_TABLE:
        "(CA, AUTO)": 2
        "(CA, MEDICAL_MALPRACTICE)": 3
        "(CA, SLIP_FALL)": 2
        "(CA, PRODUCT_LIABILITY)": 2
        "(CA, PREMISES)": 2
        "(CA, DOG_BITE)": 2
        "(NY, AUTO)": 3
        "(NY, MEDICAL_MALPRACTICE)": 2  # NY: 2y 6m simplified to 2y for table; tests pin CA only
        "(NY, SLIP_FALL)": 3
        "(NY, PRODUCT_LIABILITY)": 3
        "(NY, PREMISES)": 3
        "(NY, DOG_BITE)": 3
        "(TX, AUTO)": 2
        "(TX, MEDICAL_MALPRACTICE)": 2
        "(TX, SLIP_FALL)": 2
        "(TX, PRODUCT_LIABILITY)": 2
        "(TX, PREMISES)": 2
        "(TX, DOG_BITE)": 2
      MINOR_TAIL_TABLE:
        CA: 2
        NY: 3
        TX: 2
    precision: "Whole calendar days; deadlines stored as 'YYYY-MM-DD'."
    variants: []

  - name: calc_damages_total
    trigger: "On Damages POST/PATCH, on any MedicalRecordRequest.status flip to RECEIVED, and on POST /pi-cases/{cid}/damages/recompute."
    algorithm: aggregation
    formula: |
      medical_bills_cents = sum(MedicalRecordRequest.billed_amount_cents
                                for r in case.medical_record_requests
                                if r.status == 'RECEIVED')
      economic_cents = medical_bills_cents + lost_wages_cents + property_damage_cents
      if pain_suffering_method == 'MULTIPLIER':
        # multiplier_value is one decimal (e.g., 3.0). Convert to integer cents:
        #   pain_suffering_cents = round_half_up(economic_cents * multiplier_value)
        pain_suffering_cents = round_half_up_int(economic_cents * multiplier_value)
      elif pain_suffering_method == 'PER_DIEM':
        pain_suffering_cents = per_diem_rate_cents * per_diem_days
      total_damages_cents = economic_cents + pain_suffering_cents
    input_set: "RECEIVED MedicalRecordRequest rows only (DRAFT/SENT/REJECTED/CANCELED excluded). Damages own fields for non-medical components."
    constants:
      ROUNDING: "round_half_up to nearest integer cent"
    precision: "Integer cents; round_half_up at the multiplication step only."
    variants:
      - name: multiplier_method
        when: "pain_suffering_method == 'MULTIPLIER'"
        difference: "Non-economic damages = economic_damages × multiplier_value (rounded half-up to cents)."
      - name: per_diem_method
        when: "pain_suffering_method == 'PER_DIEM'"
        difference: "Non-economic damages = per_diem_rate_cents × per_diem_days; no multiplication by economic damages."

  - name: calc_attorney_fee
    trigger: "On SettlementDisbursement creation (POST /pi-cases/{id}/disbursement/approve)."
    algorithm: tiered_pricing
    formula: |
      # Tier selection is PINNED:
      #   if Case.status == TRIAL_AWARDED: rate_bps = trial_rate_bps
      #   elif Case.filed_in_court == true: rate_bps = post_suit_rate_bps   # SETTLED post-filing
      #   else: rate_bps = pre_suit_rate_bps                                 # SETTLED pre-filing
      # attorney_fee_cents = round_half_up_int(gross_settlement_cents * rate_bps / 10000)
      if case.status == 'TRIAL_AWARDED':
        rate_bps = trial_rate_bps
      elif case.filed_in_court:
        rate_bps = post_suit_rate_bps
      else:
        rate_bps = pre_suit_rate_bps
      attorney_fee_cents = round_half_up_int(gross_settlement_cents * rate_bps / 10000)
    input_set: "ContingencyFeeAgreement rates + Case state."
    constants:
      ROUNDING: "round_half_up_int (banker's rounding NOT used)"
    precision: "Integer cents."
    variants: []

  - name: calc_net_disbursement
    trigger: "On POST /pi-cases/{id}/disbursement/approve; strategy is supplied in request body."
    algorithm: waterfall_allocation
    formula: |
      # Step 1: compute attorney_fee_cents via calc_attorney_fee.
      # Step 2: net_after_fee = gross_settlement_cents - attorney_fee_cents.
      # Step 3: net_after_costs = net_after_fee - case_costs_cents.
      # Step 4: lien_pool = net_after_costs (this is the amount available for liens + client).
      # Step 5: apply lien strategy. Pinned order in BOTH strategies:
      #   priority_rank order (statutory first): MEDICARE=1, MEDICAID=2, ERISA=3, CHILD_SUPPORT=4,
      #     HOSPITAL_STATUTORY=5, ATTORNEY_PRIOR_COUNSEL=6, PROVIDER_NEGOTIATED=7.
      #   Tie-break inside same priority_rank: ascending Lien.created_at, then ascending Lien.id.
      #
      # CHRONOLOGICAL_PRIORITY strategy:
      #   For each Lien in priority_rank order:
      #     if lien.lien_type in {MEDICARE, MEDICAID, ERISA, CHILD_SUPPORT} and negotiated_amount_cents is null:
      #       # Apply statutory ratable-reduction formula
      #       attorney_ratio = attorney_fee_cents / gross_settlement_cents
      #       cost_ratio = case_costs_cents / gross_settlement_cents
      #       reduced = round_half_up_int(face_amount_cents * (1 - attorney_ratio - cost_ratio))
      #       pay = min(reduced, remaining_pool)
      #     else:
      #       pay = min(negotiated_amount_cents or face_amount_cents, remaining_pool)
      #     lien.final_paid_amount_cents = pay
      #     remaining_pool -= pay
      #   client_net_cents = remaining_pool
      #
      # FORWARD_LOOKING_PRORATA strategy:
      #   sum_face = sum(face_amount_cents over all liens on the case)
      #   for each Lien in priority_rank order (tie-break same as above):
      #     prorata_share = round_half_up_int(face_amount_cents * min(lien_pool, sum_face) / sum_face)
      #     pay = min(prorata_share, remaining_pool)
      #     lien.final_paid_amount_cents = pay
      #     remaining_pool -= pay
      #   # Pinned residual-rounding rule: any residual cents from rounding go to the LAST lien in the
      #   # ordered pass (i.e., remaining_pool after the final iteration is added back to the last lien).
      #   client_net_cents = max(0, lien_pool - total_lien_payment_cents)
    input_set: "All Lien rows on the case with status IN {REDUCED} (or ASSERTED for statutory types that get auto-formula). DISPUTED liens are excluded from payment but still recorded."
    constants:
      LIEN_PRIORITY_TABLE:
        MEDICARE: 1
        MEDICAID: 2
        ERISA: 3
        CHILD_SUPPORT: 4
        HOSPITAL_STATUTORY: 5
        ATTORNEY_PRIOR_COUNSEL: 6
        PROVIDER_NEGOTIATED: 7
      ROUNDING: "round_half_up_int per lien; residual goes to last lien in ordered pass"
    precision: "Integer cents."
    variants:
      - name: chronological_priority
        when: "POST /disbursement/approve with strategy='CHRONOLOGICAL_PRIORITY'."
        difference: "Each lien paid in full (or up to remaining pool) in strict priority order. Statutory liens reduced by ratable formula. Client gets whatever remains."
      - name: forward_looking_prorata
        when: "POST /disbursement/approve with strategy='FORWARD_LOOKING_PRORATA'."
        difference: "All liens share lien_pool proportional to face_amount_cents (capped at face). Produces different per-lien payments than chronological when lien_pool < sum_face, and a different client_net when statutory reduction would otherwise apply."

  - name: calc_attorney_calendar_overlap
    trigger: "On POST /pi-cases/{cid}/court-events (existence-creation validation)."
    algorithm: interval_merge
    formula: |
      # Two events on the same assigned_attorney_id conflict iff their half-open intervals overlap
      # WITH a 15-minute travel buffer added to each side. Half-open semantics: [start, end).
      # Buffer rule: e1 conflicts with e2 iff
      #   max(e1.scheduled_at - 15min, e2.scheduled_at - 15min) <
      #   min(e1.scheduled_at + e1.duration_minutes + 15min,
      #       e2.scheduled_at + e2.duration_minutes + 15min)
      # Adjacency boundary: events that touch at the buffered edge (difference == 30 minutes total)
      # do NOT conflict (half-open + exact-touch is allowed).
    input_set: "All CourtEvent rows on cases where Case.assigned_attorney_id == this case's attorney AND status IN {SCHEDULED, CONTINUED}. CANCELED and COMPLETED events do not count."
    constants:
      BUFFER_MINUTES: 15
    precision: "Whole minutes."
    variants: []

# ============================================================================
# §1.4 — Validation Rules Table (Ordered by Priority)
# ============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role value is in the declared role catalog."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role permitted for the endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 10
    category: existence
    check: "Path resource exists (Case, MedicalRecordRequest, Lien, DemandLetter, SettlementOffer, CourtEvent) — validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 11
    category: existence
    check: "Referenced foreign keys in request body (client_id, predecessor_offer_id, assigned_attorney_id) exist."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH endpoints with FK references"

  - priority: 20
    category: state
    check: "Target resource state allows requested operation per §1.2 transitions."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"

  - priority: 21
    category: state
    check: "Case.status is not in {DISMISSED, CLOSED} (no operations on closed cases)."
    error_id: ERR_CASE_CLOSED
    http_status: 409
    applies_to: "all child-resource POST/PATCH endpoints"

  - priority: 22
    category: state
    check: "Specific: DemandLetter is in DRAFT status when sending."
    error_id: ERR_DEMAND_NOT_DRAFT
    http_status: 409
    applies_to: "POST /demand-letters/{lid}/send"

  - priority: 23
    category: state
    check: "Specific: SettlementOffer is in PENDING status when accepting/rejecting/countering."
    error_id: ERR_OFFER_NOT_PENDING
    http_status: 409
    applies_to: "PATCH /settlement-offers/{oid}, POST /settlement-offers (with predecessor)"

  - priority: 24
    category: state
    check: "Specific: Case is in {NEGOTIATING, LITIGATION} for SettlementOffer acceptance."
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    applies_to: "PATCH /settlement-offers/{oid} status→ACCEPTED"

  - priority: 30
    category: business_safety
    check: "Statute of Limitations: Case.sol_deadline > now(). HARD BOUNDARY: when now() >= sol_deadline, every state-advancing mutation on the case is blocked."
    error_id: ERR_STATUTE_OF_LIMITATIONS_EXPIRED
    http_status: 422
    applies_to: "all state-advancing endpoints on Case except dismiss"

  - priority: 31
    category: business_safety
    check: "Segregation of duties: ManagingPartner approving disbursement must not equal Case.assigned_attorney_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pi-cases/{id}/disbursement/approve"

  - priority: 32
    category: business_safety
    check: "When DemandLetter would be sent, snapshot_total_damages_cents matches current Damages.total_damages_cents (no stale snapshot). If letter is in DRAFT and Damages.version has advanced past the letter's intended snapshot, reject."
    error_id: ERR_STALE_DAMAGES_SNAPSHOT
    http_status: 409
    applies_to: "POST /demand-letters/{lid}/send (only when client supplied If-Match Damages.version)"

  - priority: 40
    category: business_referential
    check: "MedicalRecordRequest.date_of_service_end >= date_of_service_start AND >= Case.incident_date."
    error_id: ERR_DATE_OF_SERVICE_INVALID
    http_status: 422
    applies_to: "POST/PATCH /medical-record-requests"

  - priority: 41
    category: business_referential
    check: "Damages: exactly one row per Case (singleton)."
    error_id: ERR_DAMAGES_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /pi-cases/{cid}/damages"

  - priority: 42
    category: business_referential
    check: "ContingencyFeeAgreement: exactly one row per Case."
    error_id: ERR_FEE_AGREEMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /pi-cases/{cid}/contingency-fee"

  - priority: 43
    category: business_referential
    check: "DemandLetter: at most one ACTIVE (status IN {DRAFT, SENT}) demand letter per case."
    error_id: ERR_ACTIVE_DEMAND_EXISTS
    http_status: 409
    applies_to: "POST /pi-cases/{cid}/demand-letters"

  - priority: 44
    category: business_referential
    check: "SettlementOffer.predecessor_offer_id, if non-null, must reference an offer on the SAME case and the new offer's party must be the opposite of the predecessor's."
    error_id: ERR_OFFER_PARTY_INVALID
    http_status: 422
    applies_to: "POST /pi-cases/{cid}/settlement-offers"

  - priority: 50
    category: business_constraint
    check: "Lien.negotiated_amount_cents must be > 0 and <= face_amount_cents."
    error_id: ERR_LIEN_NEGOTIATION_INVALID
    http_status: 422
    applies_to: "PATCH /pi-cases/{cid}/liens/{lid}"

  - priority: 51
    category: business_constraint
    check: "DemandLetter.demanded_amount_cents >= Damages.total_damages_cents at send time."
    error_id: ERR_DEMAND_BELOW_DAMAGES
    http_status: 422
    applies_to: "POST /demand-letters/{lid}/send"

  - priority: 52
    category: business_constraint
    check: "Damages pain-suffering method consistency: when method==MULTIPLIER, multiplier_value in [1.0, 5.0]; when method==PER_DIEM, per_diem_rate_cents > 0 AND per_diem_days > 0."
    error_id: ERR_DAMAGES_METHOD_INPUTS_INVALID
    http_status: 422
    applies_to: "POST/PATCH /pi-cases/{cid}/damages"

  - priority: 60
    category: business_temporal
    check: "CourtEvent.scheduled_at must be strictly after Case.incident_date AND strictly before Case.sol_deadline + 5 years (sanity bound)."
    error_id: ERR_COURT_EVENT_TIME_INVALID
    http_status: 422
    applies_to: "POST /court-events"

  - priority: 70
    category: business_temporal
    check: "Attorney calendar overlap (calc_attorney_calendar_overlap) — half-open intervals with a 15-minute buffer on each side. Adjacency exactly at the buffered edge is allowed."
    error_id: ERR_ATTORNEY_CALENDAR_CONFLICT
    http_status: 409
    applies_to: "POST /court-events"

  - priority: 71
    category: business_temporal
    check: "CourtEvent overlap on SAME COURTROOM: two events with the same non-null courtroom string conflict iff [scheduled_at, scheduled_at + duration_minutes) intervals overlap. NO buffer. Adjacency (event_a.end == event_b.start) is allowed."
    error_id: ERR_COURTROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /court-events"

  - priority: 80
    category: business_fiscal
    check: "SettlementDisbursement post-conditions: gross - attorney_fee - case_costs - total_lien_payment == client_net (no cents drift). Negative client_net rejected."
    error_id: ERR_NET_BELOW_ZERO
    http_status: 422
    applies_to: "POST /pi-cases/{id}/disbursement/approve"

  - priority: 81
    category: business_fiscal
    check: "Case.case_costs_cents PATCH: new value must be >= old value (costs are append-only, never reduced)."
    error_id: ERR_COSTS_DECREASE_NOT_ALLOWED
    http_status: 422
    applies_to: "PATCH /pi-cases/{id}/costs"

  - priority: 90
    category: business_constraint
    check: "OCC: when client sends `version` in PATCH body, it must match the stored version; otherwise 409."
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "all PATCH endpoints"

# ============================================================================
# §1.5 — API Endpoint Table
# ============================================================================

endpoints:
  # ---- Clients
  - method: POST
    path: "/clients"
    description: "Create a client (intake step 1)."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 201
    input: ["full_name", "date_of_birth", "contact_email", "state_of_residence"]
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{cid}"
    description: "Fetch a client."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: [""]
    output: Client
    side_effects: []

  # ---- Cases
  - method: POST
    path: "/pi-cases"
    description: "Open a new case (intake step 2)."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 201
    input: ["client_id", "incident_date", "incident_type", "jurisdiction_state", "assigned_attorney_id?", "assigned_paralegal_id?"]
    output: Case
    side_effects:
      - "is_minor_at_incident computed on Client; calc_sol_deadline runs and sets sol_deadline."

  - method: GET
    path: "/pi-cases/{id}"
    description: "Fetch a case."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: [""]
    output: Case
    side_effects: []

  - method: GET
    path: "/pi-cases"
    description: "List cases with filters."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: ["status?", "jurisdiction_state?", "client_id?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: PATCH
    path: "/pi-cases/{id}/costs"
    description: "Increment case_costs_cents (append-only)."
    roles: ["Attorney", "ManagingPartner"]
    code: 200
    input: ["case_costs_cents", "version?"]
    output: Case
    side_effects: []

  - method: POST
    path: "/pi-cases/{id}/toll"
    description: "Apply tolling days to the SoL deadline."
    roles: ["Attorney", "ManagingPartner"]
    code: 200
    input: ["additional_days", "reason"]
    output: Case
    side_effects:
      - "sol_tolled_days += additional_days; calc_sol_deadline reruns."

  - method: POST
    path: "/pi-cases/{id}/dismiss"
    description: "Dismiss a case before settlement."
    roles: ["ManagingPartner"]
    code: 200
    input: ["reason"]
    output: Case
    side_effects:
      - "Case.status → DISMISSED; open MedicalRecordRequest rows flipped to CANCELED."

  - method: POST
    path: "/pi-cases/{id}/disbursement/approve"
    description: "ManagingPartner approves final disbursement on a SETTLED or TRIAL_AWARDED case."
    roles: ["ManagingPartner"]
    code: 201
    input: ["strategy"]
    output: SettlementDisbursement
    side_effects:
      - "calc_net_disbursement runs; Lien.final_paid_amount_cents set; Lien.status flips to RESOLVED; Case.status → CLOSED."

  # ---- Contingency Fee
  - method: POST
    path: "/pi-cases/{cid}/contingency-fee"
    description: "Record the signed contingency fee agreement (immutable)."
    roles: ["ManagingPartner", "Attorney"]
    code: 201
    input: ["pre_suit_rate_bps", "post_suit_rate_bps", "trial_rate_bps"]
    output: ContingencyFeeAgreement
    side_effects: []

  - method: GET
    path: "/pi-cases/{cid}/contingency-fee"
    description: "Fetch the fee agreement."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: [""]
    output: ContingencyFeeAgreement
    side_effects: []

  # ---- Medical Record Requests
  - method: POST
    path: "/pi-cases/{cid}/medical-record-requests"
    description: "Create a draft request."
    roles: ["Paralegal", "Attorney"]
    code: 201
    input: ["provider_name", "date_of_service_start", "date_of_service_end"]
    output: MedicalRecordRequest
    side_effects:
      - "First created request on a case may transition Case.status INTAKE→RECORDS_PENDING."

  - method: POST
    path: "/pi-cases/{cid}/medical-record-requests/{rid}/send"
    description: "Send request to provider."
    roles: ["Paralegal", "Attorney"]
    code: 200
    input: ["version?"]
    output: MedicalRecordRequest
    side_effects: []

  - method: PATCH
    path: "/pi-cases/{cid}/medical-record-requests/{rid}"
    description: "Update status to RECEIVED/REJECTED."
    roles: ["Paralegal", "Attorney"]
    code: 200
    input: ["status", "billed_amount_cents?", "version?"]
    output: MedicalRecordRequest
    side_effects:
      - "On RECEIVED: calc_damages_total reruns; possibly Case.status→READY_FOR_DEMAND."

  - method: GET
    path: "/pi-cases/{cid}/medical-record-requests"
    description: "List requests on a case."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MedicalRecordRequest[]
    side_effects: []

  - method: DELETE
    path: "/pi-cases/{cid}/medical-record-requests/{rid}"
    description: "Cancel a draft request."
    roles: ["Paralegal", "Attorney"]
    code: 204
    input: [""]
    output: null
    side_effects: []

  # ---- Damages
  - method: POST
    path: "/pi-cases/{cid}/damages"
    description: "Create the singleton Damages row."
    roles: ["Paralegal", "Attorney"]
    code: 201
    input: ["lost_wages_cents", "property_damage_cents", "pain_suffering_method", "multiplier_value?", "per_diem_rate_cents?", "per_diem_days?"]
    output: Damages
    side_effects:
      - "calc_damages_total runs."

  - method: PATCH
    path: "/pi-cases/{cid}/damages"
    description: "Update damages inputs."
    roles: ["Paralegal", "Attorney"]
    code: 200
    input: ["lost_wages_cents?", "property_damage_cents?", "pain_suffering_method?", "multiplier_value?", "per_diem_rate_cents?", "per_diem_days?", "version?"]
    output: Damages
    side_effects:
      - "calc_damages_total reruns."

  - method: GET
    path: "/pi-cases/{cid}/damages"
    description: "Fetch damages."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: [""]
    output: Damages
    side_effects: []

  - method: POST
    path: "/pi-cases/{cid}/damages/recompute"
    description: "Force recomputation of medical_bills_cents and total."
    roles: ["Paralegal", "Attorney"]
    code: 200
    input: [""]
    output: Damages
    side_effects:
      - "calc_damages_total reruns."

  # ---- Liens
  - method: POST
    path: "/pi-cases/{cid}/liens"
    description: "Record an asserted lien."
    roles: ["Paralegal", "Attorney"]
    code: 201
    input: ["lienholder_name", "lien_type", "face_amount_cents"]
    output: Lien
    side_effects: []

  - method: POST
    path: "/pi-cases/{cid}/liens/{lid}/negotiate"
    description: "Open negotiation on a lien."
    roles: ["Paralegal", "Attorney"]
    code: 200
    input: ["version?"]
    output: Lien
    side_effects: []

  - method: PATCH
    path: "/pi-cases/{cid}/liens/{lid}"
    description: "Set negotiated amount or dispute outcome."
    roles: ["Paralegal", "Attorney"]
    code: 200
    input: ["negotiated_amount_cents?", "status?", "version?"]
    output: Lien
    side_effects: []

  - method: POST
    path: "/pi-cases/{cid}/liens/{lid}/dispute"
    description: "Mark lien as DISPUTED (excluded from disbursement)."
    roles: ["Attorney"]
    code: 200
    input: ["version?"]
    output: Lien
    side_effects: []

  - method: GET
    path: "/pi-cases/{cid}/liens"
    description: "List liens on case."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lien[]
    side_effects: []

  # ---- Demand Letters
  - method: POST
    path: "/pi-cases/{cid}/demand-letters"
    description: "Draft a demand letter."
    roles: ["Attorney"]
    code: 201
    input: ["demanded_amount_cents"]
    output: DemandLetter
    side_effects: []

  - method: POST
    path: "/pi-cases/{cid}/demand-letters/{lid}/send"
    description: "Send the letter; snapshots Damages."
    roles: ["Attorney"]
    code: 200
    input: ["version?", "expected_damages_version?"]
    output: DemandLetter
    side_effects:
      - "snapshot_total_damages_cents pinned; Case.status → DEMAND_SENT."

  - method: POST
    path: "/pi-cases/{cid}/demand-letters/{lid}/withdraw"
    description: "Withdraw a DRAFT demand letter."
    roles: ["Attorney"]
    code: 200
    input: ["version?"]
    output: DemandLetter
    side_effects: []

  # ---- Settlement Offers
  - method: POST
    path: "/pi-cases/{cid}/settlement-offers"
    description: "Record a new offer (round 1 = no predecessor; counter = predecessor_offer_id)."
    roles: ["Attorney"]
    code: 201
    input: ["offer_party", "amount_cents", "expires_at", "predecessor_offer_id?"]
    output: SettlementOffer
    side_effects:
      - "First DEFENDANT offer transitions Case.status DEMAND_SENT→NEGOTIATING."

  - method: PATCH
    path: "/pi-cases/{cid}/settlement-offers/{oid}"
    description: "Accept or reject an offer."
    roles: ["Attorney"]
    code: 200
    input: ["status", "version?"]
    output: SettlementOffer
    side_effects:
      - "On ACCEPTED: Case.gross_settlement_cents set; Case.status → SETTLED; sibling PENDING offers WITHDRAWN."

  - method: GET
    path: "/pi-cases/{cid}/settlement-offers"
    description: "List offers on case, ordered by round_number then created_at."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SettlementOffer[]
    side_effects: []

  # ---- Court Events
  - method: POST
    path: "/pi-cases/{cid}/court-events"
    description: "Create a court calendar entry."
    roles: ["Attorney", "Paralegal"]
    code: 201
    input: ["event_type", "scheduled_at", "duration_minutes", "courtroom?"]
    output: CourtEvent
    side_effects:
      - "First COMPLAINT_FILED event flips Case.filed_in_court and transitions DEMAND_SENT/NEGOTIATING→LITIGATION."

  - method: PATCH
    path: "/pi-cases/{cid}/court-events/{eid}"
    description: "Mark event COMPLETED/CONTINUED, or attach JUDGMENT award."
    roles: ["Attorney"]
    code: 200
    input: ["status", "scheduled_at?", "award_amount_cents?", "version?"]
    output: CourtEvent
    side_effects:
      - "On JUDGMENT COMPLETED with award>0: Case.status → TRIAL_AWARDED; Case.gross_settlement_cents set."

  - method: DELETE
    path: "/pi-cases/{cid}/court-events/{eid}"
    description: "Cancel a scheduled event."
    roles: ["Attorney"]
    code: 204
    input: [""]
    output: null
    side_effects: []

  - method: GET
    path: "/pi-cases/{cid}/court-events"
    description: "List court events."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: ["status?", "event_type?", "limit?", "offset?"]
    output: CourtEvent[]
    side_effects: []

  # ---- Test-driving endpoints (clock + sweeps + event emitters)
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's logical clock by N seconds (test harness)."
    roles: ["ManagingPartner"]
    code: 200
    input: ["seconds"]
    output: object
    side_effects: []

  - method: GET
    path: "/_clock/now"
    description: "Read current server time."
    roles: ["Paralegal", "Attorney", "ManagingPartner"]
    code: 200
    input: [""]
    output: object
    side_effects: []

  - method: POST
    path: "/_sweep/settlement_offers"
    description: "Run the daily PENDING-offer expiry sweep."
    roles: ["ManagingPartner"]
    code: 200
    input: [""]
    output: object
    side_effects:
      - "All SettlementOffer rows with status==PENDING AND expires_at < now() flip to EXPIRED."

  - method: POST
    path: "/_sweep/sol"
    description: "Run the SoL-expiry sweep."
    roles: ["ManagingPartner"]
    code: 200
    input: [""]
    output: object
    side_effects:
      - "All Case rows with sol_deadline <= now() AND status NOT IN terminal flip to DISMISSED."

# ============================================================================
# §1.6 — Error Code Catalog
# ============================================================================

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role missing/empty."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role value not in {Paralegal, Attorney, ManagingPartner}."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for endpoint."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same user attempting two segregated steps on same case (Attorney negotiating + same id approving disbursement)."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource id does not exist."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body-referenced FK (client_id, predecessor_offer_id, assigned_attorney_id) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state precondition not met."
  - id: ERR_CASE_CLOSED
    http: 409
    condition: "Operation attempted on a Case in DISMISSED or CLOSED."
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "Case.status not in the set required by this operation (e.g., not NEGOTIATING/LITIGATION when accepting offer)."
  - id: ERR_DEMAND_NOT_DRAFT
    http: 409
    condition: "Demand letter not in DRAFT when sending or withdrawing."
  - id: ERR_OFFER_NOT_PENDING
    http: 409
    condition: "Settlement offer not in PENDING when accept/reject/counter."
  - id: ERR_DAMAGES_ALREADY_EXISTS
    http: 409
    condition: "Second Damages insert on a case that already has one."
  - id: ERR_FEE_AGREEMENT_ALREADY_EXISTS
    http: 409
    condition: "Second ContingencyFeeAgreement insert on a case that already has one."
  - id: ERR_ACTIVE_DEMAND_EXISTS
    http: 409
    condition: "DemandLetter create attempted while another DRAFT or SENT letter exists on the case."
  - id: ERR_STALE_DAMAGES_SNAPSHOT
    http: 409
    condition: "Caller provided expected_damages_version that does not match current Damages.version when sending letter."
  - id: ERR_DISBURSEMENT_ALREADY_APPROVED
    http: 409
    condition: "Second disbursement approval on a case where Case.disbursement_approved_by is non-null."
  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "OCC version in PATCH body does not match stored version."
  - id: ERR_ATTORNEY_CALENDAR_CONFLICT
    http: 409
    condition: "Court event overlap (with 15-min buffer) on the same assigned attorney."
  - id: ERR_COURTROOM_DOUBLE_BOOKED
    http: 409
    condition: "Court event overlap (no buffer) on the same non-null courtroom."
  - id: ERR_STATUTE_OF_LIMITATIONS_EXPIRED
    http: 422
    condition: "now() >= Case.sol_deadline at the time of a state-advancing mutation."
  - id: ERR_DATE_OF_SERVICE_INVALID
    http: 422
    condition: "MedicalRecordRequest.date_of_service_end < date_of_service_start, or < Case.incident_date."
  - id: ERR_OFFER_PARTY_INVALID
    http: 422
    condition: "Counter offer's party equals predecessor's party, or predecessor belongs to another case."
  - id: ERR_LIEN_NEGOTIATION_INVALID
    http: 422
    condition: "Negotiated amount <= 0 or > face_amount_cents."
  - id: ERR_DEMAND_BELOW_DAMAGES
    http: 422
    condition: "demanded_amount_cents < total_damages_cents at send time."
  - id: ERR_DAMAGES_METHOD_INPUTS_INVALID
    http: 422
    condition: "Damages method-specific inputs missing or out of range."
  - id: ERR_COURT_EVENT_TIME_INVALID
    http: 422
    condition: "Scheduled time not within [incident_date+1day, sol_deadline+5y)."
  - id: ERR_NET_BELOW_ZERO
    http: 422
    condition: "Calculated client_net_cents < 0 (case_costs + liens exceed net after fee)."
  - id: ERR_COSTS_DECREASE_NOT_ALLOWED
    http: 422
    condition: "PATCH /costs new value < stored case_costs_cents."

# ============================================================================
# §1.7 — RBAC Matrix
# ============================================================================

roles:
  - name: Paralegal
    description: "Handles intake paperwork, medical records, and lien negotiation."
    identity: "opaque"
    exclusive_operations:
      - "POST /pi-cases/{cid}/medical-record-requests"
      - "POST /pi-cases/{cid}/medical-record-requests/{rid}/send"
      - "PATCH /pi-cases/{cid}/medical-record-requests/{rid}"
      - "POST /pi-cases/{cid}/liens/{lid}/negotiate"
    shared_operations:
      - "POST /clients"
      - "GET /pi-cases/*"
      - "POST /pi-cases"
      - "POST /pi-cases/{cid}/damages (with Attorney)"
      - "POST /pi-cases/{cid}/liens (with Attorney)"
      - "POST /pi-cases/{cid}/court-events (with Attorney)"

  - name: Attorney
    description: "Drafts demand letters, conducts settlement negotiation, manages court calendar."
    identity: "opaque"
    exclusive_operations:
      - "POST /pi-cases/{cid}/demand-letters"
      - "POST /pi-cases/{cid}/demand-letters/{lid}/send"
      - "POST /pi-cases/{cid}/demand-letters/{lid}/withdraw"
      - "POST /pi-cases/{cid}/settlement-offers"
      - "PATCH /pi-cases/{cid}/settlement-offers/{oid}"
      - "POST /pi-cases/{cid}/liens/{lid}/dispute"
      - "PATCH /pi-cases/{cid}/court-events/{eid}"
      - "DELETE /pi-cases/{cid}/court-events/{eid}"
      - "PATCH /pi-cases/{id}/costs"
    shared_operations:
      - "POST /pi-cases"
      - "POST /pi-cases/{cid}/contingency-fee (with ManagingPartner)"
      - "POST /pi-cases/{cid}/court-events"

  - name: ManagingPartner
    description: "Approves final disbursement, dismisses cases, runs administrative sweeps. Cannot also be the case's assigned_attorney_id for the same disbursement (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /pi-cases/{id}/disbursement/approve"
      - "POST /pi-cases/{id}/dismiss"
      - "POST /pi-cases/{id}/toll"
      - "POST /_clock/advance"
      - "POST /_sweep/settlement_offers"
      - "POST /_sweep/sol"
    shared_operations:
      - "All GET endpoints"
      - "POST /pi-cases/{cid}/contingency-fee"
