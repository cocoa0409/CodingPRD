  # ---------------------------------------------------------------------------
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_exam_window_overlap_half_open
        grounds:
          - validations[priority=11]
          - errors[ERR_WINDOW_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource = Exam (its testing windows), semantics = half-open intervals
          [testing_starts_at, testing_ends_at): a window whose testing range
          intersects another window of the SAME exam is rejected, while a window
          starting exactly at the other's testing_ends_at (adjacent, zero overlap)
          is accepted.
        test_recipe:
          setup:
            - "Exam P ACTIVE; window W1 testing [2026-10-10T09:00:00Z, 2026-10-12T17:00:00Z) already exists"
          setup_api_calls:
