# =============================================================================
# §1.8 — Scaffold Difficulty Design (Test Targeting Index)
# Two instances per §0.5 rule, each grounded in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: flight_billing_provisional_vs_final
        grounds:
          - calculations.flight_hour_billing
          - endpoints["GET /btaa/campaigns/{id}/billing_preview"]
          - endpoints["POST /btaa/campaigns/{id}/invoices"]
        distinguishing_aspect: |
          Same campaign, same period, same flown slots: provisional variant
          (billing_preview) counts BOOKED/SCHEDULED slots at planned hours
          AND excludes penalties and credits; final variant (invoice issuance)
          counts only FLOWN slots at hobbs hours AND includes penalties and
          credits. The two outputs differ for identical underlying flown data.
        test_recipe:
          setup:
            - "Base B1; Aircraft A1 (hourly_rate_cents=30000, max_tow_weight_lbs=500); Pilot P1 (STANDARD, base=B1)"
            - "Route R1 (BEACH, base=B1, min_banner_length_ft=50)"
            - "Client C1; Campaign CAM1"
            - "Banner BAN1 (length_ft=100, weight_lbs=200); BannerRevision REV1 approved/ACTIVE; banner fabricated READY"
            - "AirspaceApproval AP1 for R1 on 2026-08-10, window 14:00–18:00Z, GRANTED"
            - "SeasonalCapacity SC1 for B1 2026-08 with aircraft_hour_quota=200"
            - "FlightSlot S1 booked 2026-08-10 14:00Z duration 2h; flown with hobbs 100.0 → 101.5 (1.5 hr)"
            - "FlightSlot S2 booked 2026-08-10 15:00Z duration 3h; still in BOOKED (never flown)"
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /btaa/bases"
              payload: { code: "KMYB", name: "Myrtle Beach" }
              as: PlatformAdmin
              captures: { base_id: $.data.id }
            - call: "POST /btaa/bases/${base_id}/aircraft"
              payload: { tail_number: "N100AA", model: "CITABRIA", max_tow_weight_lbs: 500, hourly_rate_cents: 30000 }
              as: PlatformAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /btaa/bases/${base_id}/pilots"
              payload: { full_name: "Pilot One", certificate_number: "C1", tow_endorsement_level: "STANDARD" }
              as: PlatformAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /btaa/routes"
              payload: { code: "BEACH-N-01", kind: "BEACH", base_id: "${base_id}", length_nm: 10, min_banner_length_ft: 50 }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /btaa/clients"
              payload: { legal_name: "Acme", billing_email: "acme@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /btaa/clients/${client_id}/campaigns"
              payload: { name: "CAM1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cam_id: $.data.id }
            - call: "POST /btaa/campaigns/${cam_id}/banners"
              payload: { artwork_hash: "h1", text_message: "EAT AT JOES", banner_length_ft: 100, banner_weight_lbs: 200 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ban_id: $.data.id, ban_v: $.data.version }
            - call: "POST /btaa/banners/${ban_id}/revisions"
              payload: { proposed_text: "EAT AT JOES", proposed_artwork_hash: "h1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev_id: $.data.id }
            - call: "POST /btaa/banner_revisions/${rev_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /btaa/banners/${ban_id}/fabricate"
              payload: { expected_banner_version: "${ban_v} + 1" }
              as: GroundCrewLead
            - call: "POST /btaa/banners/${ban_id}/mark_ready"
              payload: {}
              as: GroundCrewLead
            - call: "POST /btaa/routes/${route_id}/airspace_approvals"
              payload: { date_local: "2026-08-10", window_start_utc: "2026-08-10T14:00:00Z", window_end_utc: "2026-08-10T18:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /btaa/airspace_approvals/${ap_id}/grant"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /btaa/bases/${base_id}/seasonal_capacities"
              payload: { month_yyyy_mm: "2026-08", aircraft_hour_quota: 200 }
              as: PlatformAdmin
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            - call: "POST /btaa/campaigns/${cam_id}/flight_slots"
              payload: { route_id: "${route_id}", airspace_approval_id: "${ap_id}", banner_id: "${ban_id}", date_local: "2026-08-10", planned_start_utc: "2026-08-10T14:00:00Z", planned_duration_hours: 2, expected_seasonal_capacity_version: "${sc_v}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { slot1_id: $.data.id }
            - call: "POST /btaa/campaigns/${cam_id}/flight_slots"
              payload: { route_id: "${route_id}", airspace_approval_id: "${ap_id}", banner_id: "${ban_id}", date_local: "2026-08-10", planned_start_utc: "2026-08-10T15:00:00Z", planned_duration_hours: 3, expected_seasonal_capacity_version: "${sc_v} + 1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { slot2_id: $.data.id }
            - call: "POST /btaa/flight_slots/${slot1_id}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /btaa/flight_slots/${slot1_id}/flight_log"
              payload: { hobbs_out: 100.0, hobbs_in: 101.5, pickup_technique: "GROUND_PICKUP", pickup_outcome: "CLEAN", tow_field_notes: "ok" }
              as: Pilot
              as_user_id: "${pilot_id}"
          trigger:
            - call: "GET /btaa/campaigns/${cam_id}/billing_preview"
              payload: { period_yyyy_mm: "2026-08" }
              as: FinanceOfficer
              captures: { preview_subtotal: $.data.flight_subtotal_cents, preview_total: $.data.total_cents }
            - call: "POST /btaa/campaigns/${cam_id}/invoices"
              payload: { period_yyyy_mm: "2026-08" }
              as: FinanceOfficer
              captures: { inv_subtotal: $.data.flight_subtotal_cents, inv_total: $.data.total_cents, inv_penalty: $.data.cancellation_penalty_cents, inv_credit: $.data.make_good_applied_cents }
          assert:
            # Preview: (1.5 hr FLOWN * 30000) + (3 hr BOOKED planned * 30000) = 45000 + 90000 = 135000, no discount tier (4.5 total hr <= 20 → 0%)
            # But preview formula uses planned for un-flown and hobbs for flown; subtotal = round((1.5*30000) + (3*30000), 0) = 45000 + 90000 = 135000.
            # Tier discount on preview: total_hobbs_hours = 1.5 + 3 = 4.5 ≤ 20 → discount 0. preview_subtotal = 135000. No penalties/credits on preview → total = 135000.
            - "preview_subtotal == 135000"
            - "preview_total == 135000"
            # Final: only FLOWN slot counts → 1.5 * 30000 = 45000; total_hobbs=1.5 ≤ 20 → no discount. No cancellations in period → penalty 0. No credits → 0. total = 45000.
            - "inv_subtotal == 45000"
            - "inv_penalty == 0"
            - "inv_credit == 0"
            - "inv_total == 45000"
            - "preview_subtotal != inv_subtotal"

      - name: pickup_failure_count_vs_season_hours_divergence
        grounds:
          - calculations.pickup_failure_suspension_threshold
          - calculations.flight_hour_billing
          - state_machines.Pilot.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Two derived pilot aggregates evolve under different algorithms on
          the same FlightLog stream: season_hours_flown (additive linear
          accumulation) vs season_pickup_failure_count (event counter that
          trips a threshold-driven status change at exactly 3). For an
          identical sequence of flight logs the two metrics diverge — one
          grows linearly, the other gates a state transition. This is dual-
          variant logic on Pilot, distinct from flight billing on Invoice.
        test_recipe:
          setup:
            - "Base B1; Aircraft A1; Pilot P1 (STANDARD)"
            - "Campaign CAM1 ready with banner and three approved slots S1,S2,S3"
            - "Each slot flown with pickup_outcome=FAILED and hobbs 1.0 hr each"
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /btaa/bases"
              payload: { code: "KMYB", name: "Myrtle Beach" }
              as: PlatformAdmin
              captures: { base_id: $.data.id }
            - call: "POST /btaa/bases/${base_id}/aircraft"
              payload: { tail_number: "N100AA", model: "CITABRIA", max_tow_weight_lbs: 500, hourly_rate_cents: 30000 }
              as: PlatformAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /btaa/bases/${base_id}/pilots"
              payload: { full_name: "Pilot One", certificate_number: "C1", tow_endorsement_level: "STANDARD" }
              as: PlatformAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /btaa/routes"
              payload: { code: "BEACH-N-01", kind: "BEACH", base_id: "${base_id}", length_nm: 10, min_banner_length_ft: 50 }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /btaa/clients"
              payload: { legal_name: "Acme", billing_email: "acme@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /btaa/clients/${client_id}/campaigns"
              payload: { name: "CAM1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cam_id: $.data.id }
            - call: "POST /btaa/campaigns/${cam_id}/banners"
              payload: { artwork_hash: "h1", text_message: "M", banner_length_ft: 100, banner_weight_lbs: 200 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ban_id: $.data.id, ban_v: $.data.version }
            - call: "POST /btaa/banners/${ban_id}/revisions"
              payload: { proposed_text: "M", proposed_artwork_hash: "h1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev_id: $.data.id }
            - call: "POST /btaa/banner_revisions/${rev_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /btaa/banners/${ban_id}/fabricate"
              payload: { expected_banner_version: "${ban_v} + 1" }
              as: GroundCrewLead
            - call: "POST /btaa/banners/${ban_id}/mark_ready"
              payload: {}
              as: GroundCrewLead
            - call: "POST /btaa/routes/${route_id}/airspace_approvals"
              payload: { date_local: "2026-08-10", window_start_utc: "2026-08-10T14:00:00Z", window_end_utc: "2026-08-10T18:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /btaa/airspace_approvals/${ap_id}/grant"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /btaa/bases/${base_id}/seasonal_capacities"
              payload: { month_yyyy_mm: "2026-08", aircraft_hour_quota: 200 }
              as: PlatformAdmin
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            - call: "POST /btaa/campaigns/${cam_id}/flight_slots"
              payload: { route_id: "${route_id}", airspace_approval_id: "${ap_id}", banner_id: "${ban_id}", date_local: "2026-08-10", planned_start_utc: "2026-08-10T14:00:00Z", planned_duration_hours: 1, expected_seasonal_capacity_version: "${sc_v}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { s1: $.data.id }
            - call: "POST /btaa/campaigns/${cam_id}/flight_slots"
              payload: { route_id: "${route_id}", airspace_approval_id: "${ap_id}", banner_id: "${ban_id}", date_local: "2026-08-10", planned_start_utc: "2026-08-10T15:00:00Z", planned_duration_hours: 1, expected_seasonal_capacity_version: "${sc_v} + 1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { s2: $.data.id }
            - call: "POST /btaa/campaigns/${cam_id}/flight_slots"
              payload: { route_id: "${route_id}", airspace_approval_id: "${ap_id}", banner_id: "${ban_id}", date_local: "2026-08-10", planned_start_utc: "2026-08-10T16:00:00Z", planned_duration_hours: 1, expected_seasonal_capacity_version: "${sc_v} + 2" }
              as: Client
              as_user_id: "${client_id}"
              captures: { s3: $.data.id }
            - call: "POST /btaa/flight_slots/${s1}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /btaa/flight_slots/${s1}/flight_log"
              payload: { hobbs_out: 100.0, hobbs_in: 101.0, pickup_technique: "GROUND_PICKUP", pickup_outcome: "FAILED", tow_field_notes: "" }
              as: Pilot
              as_user_id: "${pilot_id}"
            - call: "POST /btaa/flight_slots/${s2}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /btaa/flight_slots/${s2}/flight_log"
              payload: { hobbs_out: 200.0, hobbs_in: 201.0, pickup_technique: "GROUND_PICKUP", pickup_outcome: "FAILED", tow_field_notes: "" }
              as: Pilot
              as_user_id: "${pilot_id}"
            - call: "POST /btaa/flight_slots/${s3}/schedule"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /btaa/flight_slots/${s3}/flight_log"
              payload: { hobbs_out: 300.0, hobbs_in: 301.0, pickup_technique: "GROUND_PICKUP", pickup_outcome: "FAILED", tow_field_notes: "" }
              as: Pilot
              as_user_id: "${pilot_id}"
            - call: "GET /btaa/pilots/${pilot_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pilot_hours: $.data.season_hours_flown, pilot_failures: $.data.season_pickup_failure_count, pilot_status: $.data.status }
          assert:
            - "pilot_hours == 3.0"
            - "pilot_failures == 3"
            - "pilot_status == SUSPENDED"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: flight_billing_nested_rounding_order
        grounds:
          - calculations.flight_hour_billing
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Per-line
          round_half_up first (line = hobbs * rate), then sum, then apply the
          tier discount and round again. Choosing a 0.7-hour flight at
          hourly_rate_cents=33333 forces a fractional-cents line whose
          rounding direction is observable.
        test_recipe:
          setup:
            - "Aircraft hourly_rate_cents=33333"
            - "One FLOWN slot with hobbs 0.7 hr"
            - "Per-line rounding: 0.7 * 33333 = 23333.1 → round_half_up → 23333"
            - "Total 0.7 hr ≤ 20 → no discount. Subtotal = 23333"
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /btaa/bases"
              payload: { code: "KMYB", name: "MB" }
              as: PlatformAdmin
              captures: { base_id: $.data.id }
            - call: "POST /btaa/bases/${base_id}/aircraft"
              payload: { tail_number: "N200AA", model: "CITABRIA", max_tow_weight_lbs: 500, hourly_rate_cents: 33333 }
              as: PlatformAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /btaa/bases/${base_id}/pilots"
              payload: { full_name: "P1", certificate_number: "C1", tow_endorsement_level: "STANDARD" }
              as: PlatformAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /btaa/routes"
              payload: { code: "R1", kind: "BEACH", base_id: "${base_id}", length_nm: 5, min_banner_length_ft: 10 }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /btaa/clients"
              payload: { legal_name: "C", billing_email: "c@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /btaa/clients/${client_id}/campaigns"
              payload: { name: "CAM" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cam_id: $.data.id }
            - call: "POST /btaa/campaigns/${cam_id}/banners"
              payload: { artwork_hash: "h", text_message: "M", banner_length_ft: 50, banner_weight_lbs: 100 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ban_id: $.data.id, ban_v: $.data.version }
            - call: "POST /btaa/banners/${ban_id}/revisions"
              payload: { proposed_text: "M", proposed_artwork_hash: "h" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev_id: $.data.id }
            - call: "POST /btaa/banner_revisions/${rev_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /btaa/banners/${ban_id}/fabricate"
              payload: { expected_banner_version: "${ban_v} + 1" }
              as: GroundCrewLead
            - call: "POST /btaa/banners/${ban_id}/mark_ready"
              payload: {}
              as: GroundCrewLead
            - call: "POST /btaa/routes/${route_id}/airspace_approvals"
              payload: { date_local: "2026-08-10", window_start_utc: "2026-08-10T00:00:00Z", window_end_utc: "2026-08-10T23:59:59Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /btaa/airspace_approvals/${ap_id}/grant"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /btaa/bases/${base_id}/seasonal_capacities"
              payload: { month_yyyy_mm: "2026-08", aircraft_hour_quota: 500 }
              as: PlatformAdmin
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            - call: "POST /btaa/campaigns/${cam_id}/flight_slots"
              payload: { route_id: "${route_id}", airspace_approval_id: "${ap_id}", banner_id: "${ban_id}", date_local: "2026-08-10", planned_start_utc: "2026-08-10T14:00:00Z", planned_duration_hours: 1, expected_seasonal_capacity_version: "${sc_v}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /btaa/flight_slots/${slot_id}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /btaa/flight_slots/${slot_id}/flight_log"
              payload: { hobbs_out: 100.0, hobbs_in: 100.7, pickup_technique: "GROUND_PICKUP", pickup_outcome: "CLEAN", tow_field_notes: "" }
              as: Pilot
              as_user_id: "${pilot_id}"
          trigger:
            - call: "POST /btaa/campaigns/${cam_id}/invoices"
              payload: { period_yyyy_mm: "2026-08" }
              as: FinanceOfficer
              captures: { subtotal: $.data.flight_subtotal_cents, total: $.data.total_cents }
          assert:
            - "subtotal == 23333"
            - "total == 23333"

      - name: cancellation_penalty_partial_vs_late_band
        grounds:
          - calculations.weather_cancellation_penalty_rule
        distinguishing_aspect: |
          Mode (a) — non-linear multi-input formula with conditional branches
          keyed on notice period: 72h+ → 0%, 24h–72h → 25%, <24h → 50%. Two
          slots cancelled at different notice periods yield different
          penalties even at identical planned values.
        test_recipe:
          setup:
            - "Two BOOKED slots on the same campaign, each 2h at 30000c/hr → planned_value=60000 each"
            - "Slot S1 cancelled with 48h notice → penalty = round(60000 * 0.25) = 15000"
            - "Slot S2 cancelled with 12h notice → penalty = round(60000 * 0.50) = 30000"
            - "Invoice penalty total = 45000"
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
              captures: { base_id: $.data.id }
            - call: "POST /btaa/bases/${base_id}/aircraft"
              payload: { tail_number: "N1", model: "CITABRIA", max_tow_weight_lbs: 500, hourly_rate_cents: 30000 }
              as: PlatformAdmin
            - call: "POST /btaa/bases/${base_id}/pilots"
              payload: { full_name: "P", certificate_number: "C", tow_endorsement_level: "STANDARD" }
              as: PlatformAdmin
            - call: "POST /btaa/routes"
              payload: { code: "R", kind: "BEACH", base_id: "${base_id}", length_nm: 5, min_banner_length_ft: 10 }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /btaa/clients"
              payload: { legal_name: "C", billing_email: "c@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /btaa/clients/${client_id}/campaigns"
              payload: { name: "CAM" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cam_id: $.data.id }
            - call: "POST /btaa/campaigns/${cam_id}/banners"
              payload: { artwork_hash: "h", text_message: "M", banner_length_ft: 50, banner_weight_lbs: 100 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ban_id: $.data.id, ban_v: $.data.version }
            - call: "POST /btaa/banners/${ban_id}/revisions"
              payload: { proposed_text: "M", proposed_artwork_hash: "h" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev_id: $.data.id }
            - call: "POST /btaa/banner_revisions/${rev_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /btaa/banners/${ban_id}/fabricate"
              payload: { expected_banner_version: "${ban_v} + 1" }
              as: GroundCrewLead
            - call: "POST /btaa/banners/${ban_id}/mark_ready"
              payload: {}
              as: GroundCrewLead
            - call: "POST /btaa/routes/${route_id}/airspace_approvals"
              payload: { date_local: "2026-08-15", window_start_utc: "2026-08-15T14:00:00Z", window_end_utc: "2026-08-15T18:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /btaa/airspace_approvals/${ap_id}/grant"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /btaa/bases/${base_id}/seasonal_capacities"
              payload: { month_yyyy_mm: "2026-08", aircraft_hour_quota: 100 }
              as: PlatformAdmin
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            # Slot S1: 2026-08-15 14:00Z 2h. Slot S2: 2026-08-15 16:00Z 2h.
