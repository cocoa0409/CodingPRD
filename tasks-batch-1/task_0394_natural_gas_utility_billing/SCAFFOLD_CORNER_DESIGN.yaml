            - call: "POST /accounts/${acct_id}/deposits/${dep_id}/collect"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /accounts/${acct_id}/final-bill"
              payload: {}
              as: BillingAdmin
          assert:
            - "Account.${acct_id}.service_status == FINALED"
            - "Deposit.${dep_id}.status == APPLIED"
            - "BudgetPlan.${plan_id}.status == TRUED_UP"

  # ===========================================================================
  # SECTION 9 — Consistency Model (immediate: all changes visible in the same
  #   request's response).
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_issue_reflects_charges_in_same_response
        claim_type: immediate
        grounds:
          - calculations.bill_charges
          - state_machines.Bill.DRAFT_to_ISSUED
        distinguishing_aspect: "Under immediate consistency, the POST issue response itself carries the freshly computed amount_due_cents (6326), status ISSUED, and stamped due_date — no re-read needed."
        test_recipe:
          setup:
            - "RES account with a DRAFT canonical bill."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-CM1", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-02", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 40, supplier_refund_cents_per_therm: 5 }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "CM1" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MCM-101", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${so_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd_id: $.data.id }
            - call: "POST /accounts/${acct_id}/bills"
              payload: { service_month: "2026-02", to_read_id: "${rd_id}" }
              as: BillingAdmin
              captures: { bill_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/bills/${bill_id}/issue"
              payload: { expected_account_version: "${acct_v}" }
              as: BillingAdmin
              captures: { issued_status: $.data.status, issued_amount: $.data.amount_due_cents }
          assert:
            - "issue response data.status == ISSUED"
            - "issue response data.amount_due_cents == 6326"
            - "issue response data.due_date is non-null"
