            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Heritage office gift with exhibit crate list", transfer_instrument_reference: "DOG-2026-066" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
