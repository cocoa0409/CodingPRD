  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: freight_elevator_exclusive_with_15min_turnover_buffer
        grounds:
          - calculations.window_conflict_and_capacity
          - validations[priority=23]
        distinguishing_aspect: |
          Interval semantics: exclusive occupation with a 15-minute turnover
          buffer on the zone's freight elevator (only elevator_required
          windows participate). A window starting exactly 15 minutes after the
          previous end is accepted; 14 minutes after is rejected — adjacency
          with buffer, not pure touch-allowed semantics. Resource: zone
          elevator (Z1).
        test_recipe:
          setup:
            - "phase SCHEDULED in zone Z1 (4-chair acknowledged order)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
