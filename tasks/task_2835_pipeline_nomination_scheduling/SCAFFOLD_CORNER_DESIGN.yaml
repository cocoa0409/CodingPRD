            - "ImbalanceSettlement.${set_id}.loss_allocation_bbl == 100.00"
            - "ImbalanceSettlement.${set_id}.imbalance_bbl == 0.00 and ImbalanceSettlement.${set_id}.imbalance_pct == 0.000000"
            - "ImbalanceSettlement.${set_id}.imbalance_tier == TOLERANCE and ImbalanceSettlement.${set_id}.imbalance_charge_usd == 0.00"
            - "ImbalanceSettlement.${set_id}.tariff_charge_usd == 50979.50 and ImbalanceSettlement.${set_id}.alt_basis_charge_usd == 51150.00"
            - "ImbalanceSettlement.${set_id}.basis_delta_usd == 170.50 and ImbalanceSettlement.${set_id}.total_billed_usd == 50979.50"
            - "ImbalanceSettlement.${set_id}.status == DRAFT and PipelineSegment.${seg_id}.system_loss_bbl == 100.00"

