      - name: corner_missing_auth_headers_returns_unauthenticated
        claim_type: role_cannot_perform
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request carrying no X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any existence or state check runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
