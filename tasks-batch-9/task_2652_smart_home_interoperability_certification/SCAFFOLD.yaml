scenario: |
  Generate task harder than expert level!

  2652. Smart Home Interoperability Certification (device interoperability certification program):
  specification versioning with mandatory and optional feature sets by device type, member onboarding
  with intellectual property commitments and testing tool access, authorized test laboratory network
  with test plan execution and result submission, certification submission review with declaration of
  conformity and device attestation credential issuance, security requirements including device
  attestation, secure boot and firmware update capability, interoperability testing events with
  multi-vendor plugfests before formal certification, certification listing publication with feature
  declarations for consumer visibility, recertification triggers on firmware changes and specification
  version updates, noncompliance investigation and listing withdrawal

domain_name: "smart-home-interoperability-certification"
api_prefix: ""   # flat peer collections: /specifications, /feature-sets, /members, /submissions, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - version_pinning_on_approval
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: graph
  # Two self-referential edges (Specification.supersedes_specification_id forms a supersession chain;
  # FeatureSet.depends_on_feature_set_id forms a per-(specification, device_type) DAG) plus a
  # many-to-many junction (PlugfestParticipation joins Plugfest x Member x CertificationSubmission).
  # No entity is nested in another's URL path — every collection is a flat top-level peer.

  state_machine_shape: cyclic
  # CertificationSubmission.state cycles IN_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED -> IN_REVIEW
  # (bounded by MAX_REVISION_ROUNDS); TestLaboratory.accreditation_status cycles
  # AUTHORIZED -> SUSPENDED -> AUTHORIZED; CertificationListing carries two independent state axes
  # (publication_status and compliance_status) that advance on separate triggers.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The X-User-ID that recorded the conformance decision on a CertificationSubmission MUST NOT record
  # that submission's security decision; the X-User-ID that opened a NoncomplianceCase MUST NOT close
  # it. Both are enforced on X-User-ID, not on X-User-Role.

  consistency_model: immediate

  difficulty_level: "beyond-expert"
  # 11 entities / 66 endpoints / 58 error codes / 9 calculations (3 carrying variants) /
  # 50 priority-ordered validations / 14 state machines (2 cyclic, 1 pair of independent axes,
  # 2 compound bubble-up) / 2 optimistic-concurrency rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Specification
    parent: null
    common_fields: true
    fields:
      - name: version_label
        type: string
        source: input
        description: "Published specification version label, e.g. '1.0'."
        constraints: "unique across all Specification rows; 1..32 chars"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of this specification version."
        default: DRAFT
        constraints: "one of {DRAFT, RATIFIED, DEPRECATED, RETIRED}"
      - name: security_baseline_level
        type: enum
        source: input
        description: "Security baseline this version mandates. SB2 and SB3 require verified secure boot AND OTA_SIGNED firmware update capability."
        constraints: "one of {SB1, SB2, SB3}"
      - name: effective_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which this version may be cited by a CertificationSubmission."
      - name: sunset_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which this version is scheduled for retirement; null when unscheduled."
        default: null
      - name: supersedes_specification_id
        type: string
        source: input
        description: "FK -> Specification.id; the version this one replaces. Null for the first version in a chain. Target status MUST be in {RATIFIED, DEPRECATED} at creation time."
        default: null
      - name: min_plugfest_credits
        type: integer
        source: input
        description: "Number of PASSED PlugfestParticipation credits a CertificationSubmission pinned to this version MUST hold before a conformance APPROVE decision is accepted."
        default: 0
        constraints: ">= 0 and <= 4"
      - name: ratified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the DRAFT -> RATIFIED transition; null while DRAFT."
        default: null
      - name: deprecated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the RATIFIED -> DEPRECATED transition; null before it."
        default: null
      - name: feature_set_count
        type: integer
        source: computed
        description: "Count of FeatureSet rows whose specification_id equals this Specification.id (all device_types, all obligations)."
        default: 0

  - name: FeatureSet
    parent: Specification
    common_fields: true
    fields:
      - name: specification_id
        type: string
        source: input
        description: "FK -> Specification.id; owning specification version. MUST have status == DRAFT at FeatureSet creation time."
      - name: device_type
        type: enum
        source: input
        description: "Device class this feature set applies to."
        constraints: "one of {LIGHTING, THERMOSTAT, LOCK, SENSOR, HUB}"
      - name: feature_code
        type: string
        source: input
        description: "Stable machine-readable feature identifier, e.g. 'CORE_ONOFF'."
        constraints: "unique per (specification_id, device_type); 1..48 chars, uppercase letters/digits/underscore"
      - name: obligation
        type: enum
        source: input
        description: "MANDATORY = always in scope for the device_type. OPTIONAL = in scope only when the submission declares its feature_code. CONDITIONAL = in scope only when depends_on_feature_set_id is itself in scope; once in scope a CONDITIONAL feature set is treated as MANDATORY for pass requirements."
        constraints: "one of {MANDATORY, OPTIONAL, CONDITIONAL}"
      - name: test_case_count
        type: integer
        source: input
        description: "Number of test cases this feature set contributes to a TestPlan."
        constraints: ">= 1 and <= 500"
      - name: security_relevant
        type: boolean
        source: input
        description: "True when this feature set covers device attestation, secure boot or firmware update behaviour."
        default: false
      - name: depends_on_feature_set_id
        type: string
        source: input
        description: "FK -> FeatureSet.id; REQUIRED when obligation == CONDITIONAL and MUST be null otherwise. Target MUST share this row's specification_id and device_type. The resulting depends_on graph MUST stay acyclic."
        default: null

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the member company."
        constraints: "unique across all Member rows; 1..120 chars"
      - name: contact_email
        type: string
        source: input
        description: "Program contact address."
      - name: tier
        type: enum
        source: input
        description: "Membership tier; drives the certification fee discount."
        constraints: "one of {ADOPTER, PARTICIPANT, PROMOTER}"
      - name: onboarding_state
        type: enum
        source: system
        description: "Onboarding lifecycle position."
        default: REGISTERED
        constraints: "one of {REGISTERED, IP_EXECUTED, TOOLS_GRANTED, TOOLS_REVOKED, IP_WITHDRAWN}"
      - name: ip_commitment_type
        type: enum
        source: system
        description: "Executed intellectual-property commitment flavour; null until the commitment is executed."
        default: null
        constraints: "one of {RAND_ROYALTY_FREE, RAND_ROYALTY_BEARING}"
      - name: essential_patent_count
        type: integer
        source: system
        description: "Count of essential patents disclosed with the IP commitment."
        default: 0
      - name: ip_scope_specification_id
        type: string
        source: system
        description: "FK -> Specification.id; the specification version the executed IP commitment covers. Null until executed."
        default: null
      - name: ip_executed_at
        type: datetime
        source: system
        description: "Logical-clock instant the IP commitment was executed; null before."
        default: null
      - name: ip_withdrawn_at
        type: datetime
        source: system
        description: "Logical-clock instant the IP commitment was withdrawn; null unless withdrawn."
        default: null
      - name: credits_purchased_cents
        type: integer
        source: system
        description: "Cumulative certification credit purchased, in cents. Monotonically non-decreasing."
        default: 0
      - name: credits_consumed_cents
        type: integer
        source: system
        description: "Cumulative certification credit irrevocably consumed by device attestation credential issuance, in cents. Monotonically non-decreasing."
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Unescrowed spendable credit; see calculations.member_credit_ledger."
        default: 0
      - name: escrowed_credit_cents
        type: integer
        source: computed
        description: "Credit held against CertificationSubmission rows that have been submitted but not yet consumed or released; see calculations.member_credit_ledger."
        default: 0
      - name: good_standing
        type: boolean
        source: computed
        description: "True if and only if onboarding_state == TOOLS_GRANTED AND ip_commitment_type is not null AND ip_withdrawn_at is null."
        default: false
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of NoncomplianceCase rows with state IN {OPEN, EVIDENCE_REVIEW, REMEDIATION_ORDERED, WITHDRAWAL_ORDERED} whose listing_id resolves to a CertificationListing with member_id equal to this Member.id."
        default: 0

  - name: TestLaboratory
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Authorized test laboratory trading name."
        constraints: "unique across all TestLaboratory rows; 1..120 chars"
      - name: bench_capacity
        type: integer
        source: input
        description: "Number of independently bookable test benches. TestSession.bench_index MUST be in 1..bench_capacity."
        constraints: ">= 1 and <= 32"
      - name: authorized_device_types
        type: array
        source: input
        description: "Non-empty list of device_type enum members this laboratory may test."
        constraints: "non-empty subset of {LIGHTING, THERMOSTAT, LOCK, SENSOR, HUB}, no duplicates"
      - name: accreditation_expires_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which accreditation lapses; a TestSession cannot be started at or after this instant."
      - name: accreditation_status
        type: enum
        source: system
        description: "Accreditation lifecycle position."
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, AUTHORIZED, SUSPENDED, REVOKED}"
      - name: competency_score
        type: number
        source: computed
        description: "Score written by the most recent competency review; see calculations.laboratory_competency_score. Null before the first review."
        default: null
        constraints: "0.00 .. 100.00, two decimal places"
      - name: competency_variant
        type: enum
        source: system
        description: "Variant used by the most recent competency review; null before the first review."
        default: null
        constraints: "one of {ROLLING_90D, LIFETIME}"
      - name: competency_reviewed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent competency review; null before the first review."
        default: null
      - name: reserved_bench_minutes
        type: integer
        source: computed
        description: "Bench minutes currently held by this laboratory; see calculations.laboratory_reserved_bench_minutes."
        default: 0

  - name: CertificationSubmission
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the submitting member company."
      - name: specification_id
        type: string
        source: input
        description: "FK -> Specification.id; PINNED at creation. Later RATIFIED versions never re-target an existing submission."
      - name: device_model
        type: string
        source: input
        description: "Vendor device model designation."
        constraints: "1..80 chars"
      - name: device_type
        type: enum
        source: input
        description: "Device class under certification."
        constraints: "one of {LIGHTING, THERMOSTAT, LOCK, SENSOR, HUB}"
      - name: declared_feature_codes
        type: array
        source: input
        description: >
          The vendor's consumer-facing feature declaration: every feature_code the device claims,
          mandatory baseline codes included. Every entry MUST resolve to a FeatureSet of the pinned
          (specification_id, device_type) - see validations priority 33 - but its obligation is
          unconstrained. Two independent consequences: each entry costs
          PER_DECLARED_FEATURE_FEE_CENTS in calculations.submission_certification_fee_cents, and
          entries whose FeatureSet has obligation == OPTIONAL are the ONLY way an optional feature set
          enters the TestPlan closure (MANDATORY sets are seeded regardless of whether they are
          declared, so declaring them changes the fee but never the plan). May be empty.
        constraints: "no duplicates"
      - name: review_track
        type: enum
        source: input
        description: "STANDARD or EXPEDITED review; EXPEDITED adds a fee surcharge."
        default: STANDARD
        constraints: "one of {STANDARD, EXPEDITED}"
      - name: declared_secure_boot
        type: boolean
        source: input
        description: "Vendor self-declaration that the device enforces verified secure boot."
      - name: declared_firmware_update_capability
        type: enum
        source: input
        description: "Vendor self-declaration of firmware update capability."
        constraints: "one of {OTA_SIGNED, OTA_UNSIGNED, NONE}"
      - name: attestation_key_fingerprint
        type: string
        source: input
        description: "Fingerprint of the device attestation key the vendor will burn into the device."
        constraints: "1..64 chars"
      - name: state
        type: enum
        source: system
        description: "Primary submission lifecycle axis."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, IN_REVIEW, RETURNED_FOR_INFO, REVIEW_COMPLETE, CERTIFIED, REJECTED, WITHDRAWN}"
      - name: conformance_review_state
        type: enum
        source: system
        description: "Independent conformance-review axis; advances only on POST /submissions/{submission_id}/conformance-decision and POST /submissions/{submission_id}/return-for-info."
        default: PENDING
        constraints: "one of {PENDING, RETURNED, APPROVED, REJECTED}"
      - name: security_review_state
        type: enum
        source: system
        description: "Independent security-review axis; advances only on POST /submissions/{submission_id}/security-decision."
        default: PENDING
        constraints: "one of {PENDING, APPROVED, REJECTED}"
      - name: dac_state
        type: enum
        source: system
        description: "Device attestation credential axis."
        default: NOT_ISSUED
        constraints: "one of {NOT_ISSUED, ISSUED, REVOKED}"
      - name: dac_serial
        type: string
        source: system
        description: "Serial of the issued device attestation credential; null until issuance."
        default: null
        constraints: "unique across all CertificationSubmission rows when non-null"
      - name: secure_boot_verified
        type: boolean
        source: system
        description: "Security reviewer's verified secure-boot finding; null until a security decision is recorded."
        default: null
      - name: verified_firmware_update_capability
        type: enum
        source: system
        description: "Security reviewer's verified firmware update capability; null until a security decision is recorded."
        default: null
        constraints: "one of {OTA_SIGNED, OTA_UNSIGNED, NONE}"
      - name: conformance_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID that recorded the conformance decision or the most recent return-for-info; null before either."
        default: null
      - name: security_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID that recorded the security decision; null before it."
        default: null
      - name: revision_round
        type: integer
        source: system
        description: "Count of completed return-for-info rounds. Incremented by POST /submissions/{submission_id}/return-for-info."
        default: 0
        constraints: "0 .. MAX_REVISION_ROUNDS (2)"
      - name: certification_fee_cents
        type: integer
        source: computed
        description: "Fee pinned at creation; see calculations.submission_certification_fee_cents."
        default: 0
      - name: fee_escrowed_cents
        type: integer
        source: system
        description: "Cents currently escrowed on this submission; 0 before submit, equal to certification_fee_cents while escrowed, 0 again after release or consumption."
        default: 0
      - name: provisional_readiness_score
        type: number
        source: computed
        description: "PROVISIONAL variant score, refreshed on every result submission; see calculations.certification_readiness_score. Null before the first result line."
        default: null
      - name: final_readiness_score
        type: number
        source: computed
        description: "FINAL variant score, pinned when a conformance decision is recorded; see calculations.certification_readiness_score. Null before it."
        default: null
      - name: plugfest_credit_count
        type: integer
        source: computed
        description: "Count of PlugfestParticipation rows with submission_id equal to this row's id and state == PASSED."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent DRAFT/RETURNED_FOR_INFO -> SUBMITTED transition; null while DRAFT."
        default: null
      - name: review_started_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent SUBMITTED -> IN_REVIEW transition; null before."
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the REVIEW_COMPLETE -> CERTIFIED transition; null before."
        default: null

  - name: TestPlan
    parent: CertificationSubmission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> CertificationSubmission.id; the submission this plan tests. At most one TestPlan per submission may have state != VOIDED."
      - name: specification_id
        type: string
        source: system
        description: "FK -> Specification.id; copied from the submission at creation (version pinning). Never re-targeted."
      - name: device_type
        type: enum
        source: system
        description: "Copied from the submission at creation."
        constraints: "one of {LIGHTING, THERMOSTAT, LOCK, SENSOR, HUB}"
      - name: state
        type: enum
        source: system
        description: "Plan lifecycle position."
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, IN_EXECUTION, COMPLETE, VOIDED}"
      - name: included_feature_set_ids
        type: array
        source: computed
        description: "FeatureSet.id values in scope, resolved at creation by calculations.test_plan_case_counts, ordered by FeatureSet.feature_code ASC."
        default: []
      - name: required_case_count
        type: integer
        source: computed
        description: "Sum of test_case_count over included_feature_set_ids; see calculations.test_plan_case_counts."
        default: 0
      - name: mandatory_case_count
        type: integer
        source: computed
        description: "Sum of test_case_count over included feature sets whose obligation is in {MANDATORY, CONDITIONAL}; see calculations.test_plan_case_counts."
        default: 0
      - name: optional_case_count
        type: integer
        source: computed
        description: "Sum of test_case_count over included feature sets whose obligation == OPTIONAL; see calculations.test_plan_case_counts."
        default: 0
      - name: voided_reason
        type: string
        source: system
        description: "Reason token written when the plan is voided; one of {SUPERSEDED_BY_NEW_PLAN, SPECIFICATION_DEPRECATED}. Null unless state == VOIDED."
        default: null

  - name: TestSession
    parent: TestPlan
    common_fields: true
    fields:
      - name: test_plan_id
        type: string
        source: input
        description: "FK -> TestPlan.id; the plan this session executes against."
      - name: laboratory_id
        type: string
        source: input
        description: "FK -> TestLaboratory.id; the laboratory occupying a bench for this session."
      - name: bench_index
        type: integer
        source: input
        description: "1-based bench ordinal within the laboratory."
        constraints: ">= 1 and <= TestLaboratory.bench_capacity"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC inclusive start of the bench occupation."
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC exclusive end of the bench occupation; MUST be strictly after window_start."
      - name: session_type
        type: enum
        source: input
        description: "INTEROP exercises interoperability feature sets; SECURITY exercises security_relevant feature sets."
        constraints: "one of {INTEROP, SECURITY}"
      - name: state
        type: enum
        source: system
        description: "Session lifecycle position."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETE, CANCELLED}"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant of the SCHEDULED -> IN_PROGRESS transition; null before."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the IN_PROGRESS -> COMPLETE transition; null before."
        default: null
      - name: completed_late
        type: boolean
        source: computed
        description: "True if and only if completed_at is not null AND completed_at > window_end."
        default: false
      - name: result_lines
        type: array
        source: system
        description: "Append-only list of objects { feature_set_id, outcome, evidence_hash, recorded_at, disputed }, in append order. outcome is one of {PASS, FAIL, BLOCKED, WAIVED}; recorded_at is stamped by the server from the logical clock; disputed starts false and is flipped by POST /test-sessions/{test_session_id}/dispute-line. Lines are addressed by their zero-based index in this list."
        default: []
      - name: disputed_line_count
        type: integer
        source: computed
        description: "Count of result_lines entries whose disputed flag is true. Feeds the dispute-free component of calculations.laboratory_competency_score."
        default: 0
      - name: reserved_minutes
        type: integer
        source: computed
        description: "Whole minutes between window_start and window_end (window_end - window_start); the interval is always a whole number of minutes because both bounds are validated to zero seconds."
        default: 0

  - name: Plugfest
    parent: null
    common_fields: true
    fields:
      - name: host_laboratory_id
        type: string
        source: input
        description: "FK -> TestLaboratory.id; the laboratory hosting the event. MUST have accreditation_status == AUTHORIZED at creation."
      - name: specification_id
        type: string
        source: input
        description: "FK -> Specification.id; the version exercised at the event. MUST have status == RATIFIED at creation."
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the event."
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the event; MUST be strictly after window_start."
      - name: registration_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which registration is refused; MUST be at or before window_start (equality is accepted)."
      - name: min_distinct_vendors
        type: integer
        source: input
        description: "Minimum number of distinct Member.id values that must be counted by calculations.plugfest_distinct_vendor_count before the event may be locked."
        constraints: ">= 2 and <= 8"
      - name: state
        type: enum
        source: system
        description: "Event lifecycle position."
        default: REGISTRATION_OPEN
        constraints: "one of {REGISTRATION_OPEN, LOCKED, CLOSED, CANCELLED}"
      - name: distinct_vendor_count
        type: integer
        source: computed
        description: "See calculations.plugfest_distinct_vendor_count."
        default: 0
      - name: locked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the REGISTRATION_OPEN -> LOCKED transition; null before."
        default: null

  - name: PlugfestParticipation
    parent: Plugfest
    common_fields: true
    fields:
      - name: plugfest_id
        type: string
        source: input
        description: "FK -> Plugfest.id; the event registered for."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the registering vendor. MUST equal the submission's member_id."
      - name: submission_id
        type: string
        source: input
        description: "FK -> CertificationSubmission.id; the device under test at the event."
      - name: device_model
        type: string
        source: input
        description: "Model designation presented at the event."
        constraints: "1..80 chars"
      - name: state
        type: enum
        source: system
        description: "Participation lifecycle position."
        default: REGISTERED
        constraints: "one of {REGISTERED, PASSED, FAILED, NO_SHOW}"
      - name: interop_pass_count
        type: integer
        source: system
        description: "Number of multi-vendor interoperability pairings passed at the event, recorded by the host laboratory."
        default: 0
        constraints: ">= 0 and <= 8"
      - name: outcome_recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the host laboratory recorded the outcome; null before."
        default: null

  - name: CertificationListing
    parent: null
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> CertificationSubmission.id; the certified submission this listing publishes. At most one CertificationListing per submission_id."
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; copied from the submission at creation."
      - name: listing_reference
        type: string
        source: system
        description: "Public reference 'LST-' followed by a six-digit zero-padded ordinal equal to (count of CertificationListing rows with an earlier created_at) + 1."
        constraints: "unique across all CertificationListing rows"
      - name: declared_features
        type: array
        source: computed
        description: "feature_code values of the submission's non-VOIDED TestPlan included_feature_set_ids, ordered by feature_code ASC. This is the consumer-visible feature declaration."
        default: []
      - name: publication_status
        type: enum
        source: system
        description: "Consumer-visibility axis; advances independently of compliance_status."
        default: UNPUBLISHED
        constraints: "one of {UNPUBLISHED, PUBLISHED, SUPPRESSED, WITHDRAWN}"
      - name: compliance_status
        type: enum
        source: system
        description: "Enforcement axis; advances independently of publication_status."
        default: COMPLIANT
        constraints: "one of {COMPLIANT, UNDER_INVESTIGATION, NONCOMPLIANT, REMEDIATED}"
      - name: recertification_due_at
        type: datetime
        source: system
        description: "Logical-clock instant by which a fresh CertificationSubmission must be certified; null when no recertification trigger has fired."
        default: null
      - name: recert_trigger_reason
        type: enum
        source: system
        description: "Reason the recertification deadline was written; null when recertification_due_at is null."
        default: null
        constraints: "one of {SPECIFICATION_DEPRECATED, FIRMWARE_FEATURE_DELTA, FIRMWARE_SECURITY_CHANGE}"
      - name: latest_firmware_version
        type: string
        source: system
        description: "firmware_version of the most recently reported firmware revision; null before the first report."
        default: null
      - name: recert_classification
        type: enum
        source: computed
        description: "Classification of the most recently reported firmware revision; see calculations.recertification_classification. Null before the first report."
        default: null
        constraints: "one of {NONE, DELTA, FULL}"
      - name: firmware_revision_count
        type: integer
        source: system
        description: "Count of accepted firmware revision reports on this listing."
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into publication_status == PUBLISHED; null before."
        default: null

  - name: NoncomplianceCase
    parent: CertificationListing
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> CertificationListing.id; the listing under investigation."
      - name: category
        type: enum
        source: input
        description: "Investigation category; drives the penalty severity weight."
        constraints: "one of {INTEROP_DEFECT, SECURITY_DEFECT, FALSE_FEATURE_DECLARATION, IP_WITHDRAWAL}"
      - name: evidence_summary
        type: string
        source: input
        description: "Free-text summary of the evidence on file."
        constraints: "1..500 chars"
      - name: claimed_impact_units
        type: integer
        source: input
        description: "Number of impacted deployed units claimed by the complainant; drives the penalty assessment."
        constraints: ">= 0 and <= 10000000"
      - name: state
        type: enum
        source: system
        description: "Investigation lifecycle position."
        default: OPEN
        constraints: "one of {OPEN, EVIDENCE_REVIEW, REMEDIATION_ORDERED, WITHDRAWAL_ORDERED, REMEDIATED, CLOSED}"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that opened the case, or the literal 'SYSTEM' for cases auto-opened by cascade."
      - name: closed_by_user_id
        type: string
        source: system
        description: "X-User-ID that closed the case; null before closure. MUST differ from opened_by_user_id."
        default: null
      - name: auto_opened
        type: boolean
        source: system
        description: "True when the case was created by the IP-withdrawal cascade rather than by POST /noncompliance-cases."
        default: false
      - name: assessment_subtotal_cents
        type: integer
        source: computed
        description: "See calculations.noncompliance_penalty_assessment."
        default: 0
      - name: surcharge_cents
        type: integer
        source: computed
        description: "See calculations.noncompliance_penalty_assessment."
        default: 0
      - name: penalty_total_cents
        type: integer
        source: computed
        description: "See calculations.noncompliance_penalty_assessment."
        default: 0
      - name: remediation_deadline_at
        type: datetime
        source: system
        description: "Logical-clock instant by which remediation is due; written only when state becomes REMEDIATION_ORDERED."
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Specification
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: RATIFIED
        trigger: "POST /specifications/{specification_id}/ratify"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT"
          - "feature_set_count >= 1"
          - "for every device_type appearing in this Specification's FeatureSet rows, at least one FeatureSet has obligation == MANDATORY"
        side_effects:
          - "sets status = RATIFIED"
          - "sets ratified_at = logical clock now"
          - "freezes the FeatureSet population: POST /feature-sets is refused for this specification_id from now on (ERR_INVALID_SPECIFICATION_STATE)"
      - from: RATIFIED
        to: DEPRECATED
        trigger: "POST /specifications/{specification_id}/deprecate"
        actor: ProgramAdmin
        preconditions:
          - "status == RATIFIED"
        side_effects:
          - "sets status = DEPRECATED, deprecated_at = logical clock now"
          - "CASCADE HOP 1 - for every CertificationSubmission with specification_id == this Specification.id and state IN {SUBMITTED, IN_REVIEW, RETURNED_FOR_INFO}: sets conformance_review_state = RETURNED, state = RETURNED_FOR_INFO, revision_round = min(revision_round + 1, MAX_REVISION_ROUNDS), conformance_reviewer_user_id = 'SYSTEM'"
          - "CASCADE HOP 2 (caused by hop 1, not by the deprecate call) - for every TestPlan whose submission_id is a submission mutated in hop 1 and whose state IN {DRAFT, ISSUED, IN_EXECUTION, COMPLETE}: sets state = VOIDED, voided_reason = 'SPECIFICATION_DEPRECATED'"
          - "CASCADE HOP 3 (caused by hop 2) - for every TestSession whose test_plan_id is a plan voided in hop 2 and whose state IN {SCHEDULED, IN_PROGRESS}: sets state = CANCELLED and decrements TestLaboratory.reserved_bench_minutes by that session's reserved_minutes"
          - "FAN-OUT (independent of the hop chain) - for every CertificationListing whose submission's specification_id == this Specification.id and publication_status == PUBLISHED: sets recertification_due_at = logical clock now + 180 days, recert_trigger_reason = SPECIFICATION_DEPRECATED"
          - "bumps version and updated_at on every row touched above"
      - from: DEPRECATED
        to: RETIRED
        trigger: "POST /specifications/{specification_id}/deprecate"
        actor: ProgramAdmin
        preconditions:
          - "status == DEPRECATED"
          - "no CertificationSubmission with this specification_id has state IN {DRAFT, SUBMITTED, IN_REVIEW, RETURNED_FOR_INFO, REVIEW_COMPLETE}"
        side_effects:
          - "sets status = RETIRED"
        note: "The same endpoint drives both demotion steps; the reached state depends on the current status."

  - entity: Member
    field: onboarding_state
    initial_state: REGISTERED
    terminal_states: [IP_WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: IP_EXECUTED
        trigger: "POST /members/{member_id}/ip-commitment"
        actor: Member
        preconditions:
          - "onboarding_state == REGISTERED"
          - "the Specification named by scope_specification_id has status IN {RATIFIED, DEPRECATED}"
        side_effects:
          - "sets ip_commitment_type, essential_patent_count, ip_scope_specification_id from the request"
          - "sets ip_executed_at = logical clock now, onboarding_state = IP_EXECUTED"
          - "recomputes good_standing (remains false: tool access not yet granted)"
      - from: IP_EXECUTED
        to: TOOLS_GRANTED
        trigger: "POST /members/{member_id}/tool-access with decision == GRANT"
        actor: ProgramAdmin
        preconditions:
          - "onboarding_state == IP_EXECUTED"
        side_effects:
          - "sets onboarding_state = TOOLS_GRANTED"
          - "recomputes good_standing (becomes true)"
      - from: TOOLS_GRANTED
        to: TOOLS_REVOKED
        trigger: "POST /members/{member_id}/tool-access with decision == REVOKE"
        actor: ProgramAdmin
        preconditions:
          - "onboarding_state == TOOLS_GRANTED"
        side_effects:
          - "sets onboarding_state = TOOLS_REVOKED"
          - "recomputes good_standing (becomes false)"
      - from: TOOLS_REVOKED
        to: TOOLS_GRANTED
        trigger: "POST /members/{member_id}/tool-access with decision == GRANT"
        actor: ProgramAdmin
        preconditions:
          - "onboarding_state == TOOLS_REVOKED"
        side_effects:
          - "sets onboarding_state = TOOLS_GRANTED"
          - "recomputes good_standing (becomes true)"
        note: "Cyclic: testing-tool access may be revoked and restored any number of times."
      - from: IP_EXECUTED
        to: IP_WITHDRAWN
        trigger: "POST /members/{member_id}/ip-commitment/withdraw"
        actor: Member
        preconditions:
          - "onboarding_state IN {IP_EXECUTED, TOOLS_GRANTED, TOOLS_REVOKED}"
        side_effects:
          - "sets ip_withdrawn_at = logical clock now, onboarding_state = IP_WITHDRAWN, good_standing = false"
        note: "Same transition body applies from TOOLS_GRANTED and TOOLS_REVOKED; see the four-hop cascade recorded on the TOOLS_GRANTED row."
      - from: TOOLS_GRANTED
        to: IP_WITHDRAWN
        trigger: "POST /members/{member_id}/ip-commitment/withdraw"
        actor: Member
        preconditions:
          - "onboarding_state IN {IP_EXECUTED, TOOLS_GRANTED, TOOLS_REVOKED}"
        side_effects:
          - "sets ip_withdrawn_at = logical clock now, onboarding_state = IP_WITHDRAWN"
          - "CASCADE HOP 1 - recomputes good_standing to false"
          - "CASCADE HOP 2 (caused by hop 1's loss of good standing) - for every CertificationListing with member_id == this Member.id and publication_status == PUBLISHED: sets publication_status = SUPPRESSED and compliance_status = UNDER_INVESTIGATION"
          - "CASCADE HOP 3 (caused by hop 2's suppression) - for every CertificationSubmission that is the submission_id of a listing suppressed in hop 2 and whose dac_state == ISSUED: sets dac_state = REVOKED"
          - "CASCADE HOP 4 (caused by hop 3's credential revocation) - for every listing whose submission had its credential revoked in hop 3: creates one NoncomplianceCase with category = IP_WITHDRAWAL, state = OPEN, auto_opened = true, opened_by_user_id = 'SYSTEM', claimed_impact_units = 0, evidence_summary = 'Auto-opened: IP commitment withdrawn by member', and its penalty fields computed by calculations.noncompliance_penalty_assessment"
          - "bumps version and updated_at on every row touched above"
      - from: TOOLS_REVOKED
        to: IP_WITHDRAWN
        trigger: "POST /members/{member_id}/ip-commitment/withdraw"
        actor: Member
        preconditions:
          - "onboarding_state IN {IP_EXECUTED, TOOLS_GRANTED, TOOLS_REVOKED}"
        side_effects:
          - "identical to the TOOLS_GRANTED -> IP_WITHDRAWN row, including all four cascade hops"

  - entity: TestLaboratory
    field: accreditation_status
    initial_state: PROVISIONAL
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONAL
        to: AUTHORIZED
        trigger: "POST /test-laboratories/{laboratory_id}/accreditation-decision with decision == AUTHORIZE"
        actor: ProgramAdmin
        preconditions:
          - "accreditation_status == PROVISIONAL"
          - "accreditation_expires_at > logical clock now"
        side_effects:
          - "sets accreditation_status = AUTHORIZED"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /test-laboratories/{laboratory_id}/accreditation-decision with decision == SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "accreditation_status == AUTHORIZED"
        side_effects:
          - "sets accreditation_status = SUSPENDED"
          - "leaves TestSession rows untouched; POST /test-sessions/{test_session_id}/start is refused while SUSPENDED"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "system, evaluated inside POST /test-laboratories/{laboratory_id}/competency-review"
        actor: system
        preconditions:
          - "accreditation_status == AUTHORIZED"
          - "the freshly computed calculations.laboratory_competency_score is strictly less than COMPETENCY_SUSPENSION_THRESHOLD (70.00)"
        side_effects:
          - "sets accreditation_status = SUSPENDED"
        note: "A score exactly equal to 70.00 leaves accreditation_status == AUTHORIZED."
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /test-laboratories/{laboratory_id}/accreditation-decision with decision == REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "accreditation_status == SUSPENDED"
          - "accreditation_expires_at > logical clock now"
        side_effects:
          - "sets accreditation_status = AUTHORIZED"
        note: "Cyclic: AUTHORIZED -> SUSPENDED -> AUTHORIZED may repeat without bound."
      - from: AUTHORIZED
        to: REVOKED
        trigger: "POST /test-laboratories/{laboratory_id}/accreditation-decision with decision == REVOKE"
        actor: ProgramAdmin
        preconditions:
          - "accreditation_status IN {PROVISIONAL, AUTHORIZED, SUSPENDED}"
        side_effects:
          - "sets accreditation_status = REVOKED"
          - "CASCADE HOP 1 - for every TestSession with laboratory_id == this TestLaboratory.id and state IN {SCHEDULED, IN_PROGRESS}: sets state = CANCELLED; then sets reserved_bench_minutes = 0"
          - "CASCADE HOP 2 (caused by hop 1's cancellations) - for every TestPlan that has at least one session cancelled in hop 1 and whose state == IN_EXECUTION and which now has no session in state IN {SCHEDULED, IN_PROGRESS, COMPLETE}: sets state = VOIDED, voided_reason = 'SPECIFICATION_DEPRECATED'"
          - "FAN-OUT - for every Plugfest with host_laboratory_id == this TestLaboratory.id and state IN {REGISTRATION_OPEN, LOCKED}: sets state = CANCELLED; then for every PlugfestParticipation of those events with state == REGISTERED: sets state = NO_SHOW"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /test-laboratories/{laboratory_id}/accreditation-decision with decision == REVOKE"
        actor: ProgramAdmin
        preconditions:
          - "accreditation_status IN {PROVISIONAL, AUTHORIZED, SUSPENDED}"
        side_effects:
          - "identical to the AUTHORIZED -> REVOKED row"
      - from: PROVISIONAL
        to: REVOKED
        trigger: "POST /test-laboratories/{laboratory_id}/accreditation-decision with decision == REVOKE"
        actor: ProgramAdmin
        preconditions:
          - "accreditation_status IN {PROVISIONAL, AUTHORIZED, SUSPENDED}"
        side_effects:
          - "identical to the AUTHORIZED -> REVOKED row"

  - entity: CertificationSubmission
    field: state
    initial_state: DRAFT
    terminal_states: [CERTIFIED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /submissions/{submission_id}/submit"
        actor: Member
        preconditions:
          - "state == DRAFT"
          - "the Specification named by specification_id has status == RATIFIED"
          - "Member.good_standing == true (cross-entity dependency on Member.onboarding_state and Member.ip_withdrawn_at)"
          - "when the Specification's security_baseline_level IN {SB2, SB3}: declared_secure_boot == true AND declared_firmware_update_capability == OTA_SIGNED"
          - "Member.credit_balance_cents >= certification_fee_cents"
        side_effects:
          - "sets state = SUBMITTED, submitted_at = logical clock now"
          - "escrows the fee: Member.credit_balance_cents -= certification_fee_cents and Member.escrowed_credit_cents += certification_fee_cents; sets fee_escrowed_cents = certification_fee_cents"
          - "bumps Member.version and CertificationSubmission.version"
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /submissions/{submission_id}/submit"
        actor: Member
        preconditions:
          - "state == RETURNED_FOR_INFO"
          - "the Specification named by specification_id has status == RATIFIED"
          - "Member.good_standing == true"
          - "when the Specification's security_baseline_level IN {SB2, SB3}: declared_secure_boot == true AND declared_firmware_update_capability == OTA_SIGNED"
        side_effects:
          - "sets state = SUBMITTED, submitted_at = logical clock now"
          - "sets conformance_review_state = PENDING"
          - "does NOT escrow again - fee_escrowed_cents is already equal to certification_fee_cents, so the ledger is untouched"
        note: "Closes the review cycle IN_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED -> IN_REVIEW."
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /submissions/{submission_id}/start-review"
        actor: ConformanceReviewer
        preconditions:
          - "state == SUBMITTED"
        side_effects:
          - "sets state = IN_REVIEW, review_started_at = logical clock now"
      - from: IN_REVIEW
        to: RETURNED_FOR_INFO
        trigger: "POST /submissions/{submission_id}/return-for-info"
        actor: ConformanceReviewer
        preconditions:
          - "state == IN_REVIEW"
          - "conformance_review_state == PENDING"
          - "revision_round < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "sets state = RETURNED_FOR_INFO, conformance_review_state = RETURNED"
          - "increments revision_round by 1"
          - "sets conformance_reviewer_user_id = the acting X-User-ID"
      - from: IN_REVIEW
        to: REVIEW_COMPLETE
        trigger: "system, evaluated at the end of POST /submissions/{submission_id}/conformance-decision and POST /submissions/{submission_id}/security-decision"
        actor: system
        preconditions:
          - "state == IN_REVIEW"
          - "conformance_review_state == APPROVED AND security_review_state == APPROVED"
        side_effects:
          - "sets state = REVIEW_COMPLETE"
        note: "Compound bubble-up over the two independent review axes; whichever decision lands second triggers it."
      - from: IN_REVIEW
        to: REJECTED
        trigger: "system, evaluated at the end of POST /submissions/{submission_id}/conformance-decision and POST /submissions/{submission_id}/security-decision"
        actor: system
        preconditions:
          - "state == IN_REVIEW"
          - "conformance_review_state == REJECTED OR security_review_state == REJECTED"
        side_effects:
          - "sets state = REJECTED"
          - "COMPENSATION - releases the escrow: Member.escrowed_credit_cents -= fee_escrowed_cents, Member.credit_balance_cents += fee_escrowed_cents, then sets fee_escrowed_cents = 0"
          - "bumps Member.version"
      - from: REVIEW_COMPLETE
        to: CERTIFIED
        trigger: "POST /submissions/{submission_id}/issue-credential"
        actor: ProgramAdmin
        preconditions:
          - "state == REVIEW_COMPLETE"
          - "dac_state == NOT_ISSUED"
          - "secure_boot_verified == true"
          - "verified_firmware_update_capability != NONE"
          - "fee_escrowed_cents == certification_fee_cents"
          - "dac_serial in the request is not already held by any CertificationSubmission"
        side_effects:
          - "sets state = CERTIFIED, certified_at = logical clock now"
          - "sets dac_state = ISSUED, dac_serial from the request"
          - "consumes the escrow: Member.escrowed_credit_cents -= fee_escrowed_cents, Member.credits_consumed_cents += fee_escrowed_cents, then sets fee_escrowed_cents = 0"
          - "bumps Member.version"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /submissions/{submission_id}/withdraw"
        actor: Member
        preconditions:
          - "state IN {DRAFT, SUBMITTED, IN_REVIEW, RETURNED_FOR_INFO}"
        side_effects:
          - "sets state = WITHDRAWN"
          - "COMPENSATION - releases any escrow: Member.escrowed_credit_cents -= fee_escrowed_cents, Member.credit_balance_cents += fee_escrowed_cents, then sets fee_escrowed_cents = 0 (a no-op from DRAFT, where fee_escrowed_cents is already 0)"
          - "for the submission's TestPlan with state != VOIDED (at most one exists): sets state = VOIDED, voided_reason = 'SUPERSEDED_BY_NEW_PLAN'; then for every TestSession of that plan with state IN {SCHEDULED, IN_PROGRESS}: sets state = CANCELLED and decrements TestLaboratory.reserved_bench_minutes by that session's reserved_minutes"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /submissions/{submission_id}/withdraw"
        actor: Member
        preconditions:
          - "state IN {DRAFT, SUBMITTED, IN_REVIEW, RETURNED_FOR_INFO}"
        side_effects:
          - "identical to the DRAFT -> WITHDRAWN row; here the escrow release is observable because fee_escrowed_cents == certification_fee_cents"
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /submissions/{submission_id}/withdraw"
        actor: Member
        preconditions:
          - "state IN {DRAFT, SUBMITTED, IN_REVIEW, RETURNED_FOR_INFO}"
        side_effects:
          - "identical to the DRAFT -> WITHDRAWN row"
      - from: RETURNED_FOR_INFO
        to: WITHDRAWN
        trigger: "POST /submissions/{submission_id}/withdraw"
        actor: Member
        preconditions:
          - "state IN {DRAFT, SUBMITTED, IN_REVIEW, RETURNED_FOR_INFO}"
        side_effects:
          - "identical to the DRAFT -> WITHDRAWN row"

  - entity: CertificationSubmission#conformance_review_state
    field: conformance_review_state
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: RETURNED
        trigger: "POST /submissions/{submission_id}/return-for-info"
        actor: ConformanceReviewer
        preconditions:
          - "CertificationSubmission.state == IN_REVIEW"
          - "conformance_review_state == PENDING"
          - "revision_round < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "sets conformance_review_state = RETURNED (see the state-axis row for the rest)"
      - from: RETURNED
        to: PENDING
        trigger: "POST /submissions/{submission_id}/submit"
        actor: Member
        preconditions:
          - "CertificationSubmission.state == RETURNED_FOR_INFO"
        side_effects:
          - "sets conformance_review_state = PENDING"
        note: "This axis is itself cyclic: PENDING -> RETURNED -> PENDING."
      - from: PENDING
        to: APPROVED
        trigger: "POST /submissions/{submission_id}/conformance-decision with decision == APPROVE"
        actor: ConformanceReviewer
        preconditions:
          - "CertificationSubmission.state == IN_REVIEW"
          - "conformance_review_state == PENDING"
          - "the submission's TestPlan with state != VOIDED exists and has state == COMPLETE"
          - "the freshly pinned final_readiness_score >= FINAL_APPROVAL_THRESHOLD (65.00)"
          - "plugfest_credit_count >= the pinned Specification's min_plugfest_credits"
        side_effects:
          - "computes and pins final_readiness_score via calculations.certification_readiness_score variant FINAL"
          - "sets conformance_review_state = APPROVED, conformance_reviewer_user_id = the acting X-User-ID"
          - "may trigger the IN_REVIEW -> REVIEW_COMPLETE bubble-up"
      - from: PENDING
        to: REJECTED
        trigger: "POST /submissions/{submission_id}/conformance-decision with decision == REJECT"
        actor: ConformanceReviewer
        preconditions:
          - "CertificationSubmission.state == IN_REVIEW"
          - "conformance_review_state == PENDING"
          - "the submission's TestPlan with state != VOIDED exists and has state == COMPLETE"
        side_effects:
          - "computes and pins final_readiness_score via calculations.certification_readiness_score variant FINAL"
          - "sets conformance_review_state = REJECTED, conformance_reviewer_user_id = the acting X-User-ID"
          - "triggers the IN_REVIEW -> REJECTED transition and its escrow compensation"

  - entity: CertificationSubmission#security_review_state
    field: security_review_state
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /submissions/{submission_id}/security-decision with decision == APPROVE"
        actor: SecurityReviewer
        preconditions:
          - "CertificationSubmission.state == IN_REVIEW"
          - "security_review_state == PENDING"
          - "the acting X-User-ID != conformance_reviewer_user_id (segregation of duties)"
          - "the request's secure_boot_verified == true"
          - "when the pinned Specification's security_baseline_level IN {SB2, SB3}: the request's verified_firmware_update_capability == OTA_SIGNED"
        side_effects:
          - "writes secure_boot_verified and verified_firmware_update_capability from the request"
          - "sets security_review_state = APPROVED, security_reviewer_user_id = the acting X-User-ID"
          - "may trigger the IN_REVIEW -> REVIEW_COMPLETE bubble-up"
        note: "This axis advances independently of conformance_review_state; either decision may be recorded first."
      - from: PENDING
        to: REJECTED
        trigger: "POST /submissions/{submission_id}/security-decision with decision == REJECT"
        actor: SecurityReviewer
        preconditions:
          - "CertificationSubmission.state == IN_REVIEW"
          - "security_review_state == PENDING"
          - "the acting X-User-ID != conformance_reviewer_user_id (segregation of duties)"
        side_effects:
          - "writes secure_boot_verified and verified_firmware_update_capability from the request"
          - "sets security_review_state = REJECTED, security_reviewer_user_id = the acting X-User-ID"
          - "triggers the IN_REVIEW -> REJECTED transition and its escrow compensation"

  - entity: CertificationSubmission#dac_state
    field: dac_state
    initial_state: NOT_ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: NOT_ISSUED
        to: ISSUED
        trigger: "POST /submissions/{submission_id}/issue-credential"
        actor: ProgramAdmin
        preconditions:
          - "see the REVIEW_COMPLETE -> CERTIFIED row"
        side_effects:
          - "sets dac_state = ISSUED, dac_serial from the request"
      - from: ISSUED
        to: REVOKED
        trigger: "system, cascade hop 3 of POST /members/{member_id}/ip-commitment/withdraw"
        actor: system
        preconditions:
          - "dac_state == ISSUED"
          - "the submission's CertificationListing was suppressed by cascade hop 2 of the same call"
        side_effects:
          - "sets dac_state = REVOKED"
          - "causes cascade hop 4: auto-opens a NoncomplianceCase on the listing"
      - from: ISSUED
        to: REVOKED
        trigger: "system, evaluated inside POST /listings/{listing_id}/firmware-revisions when recert_classification == FULL"
        actor: system
        preconditions:
          - "dac_state == ISSUED"
          - "the reported firmware revision classifies as FULL"
        side_effects:
          - "sets dac_state = REVOKED"

  - entity: TestPlan
    field: state
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /test-plans/{test_plan_id}/issue"
        actor: ProgramAdmin
        preconditions:
          - "state == DRAFT"
          - "required_case_count >= 1"
          - "the parent CertificationSubmission has state == IN_REVIEW"
        side_effects:
          - "sets state = ISSUED"
      - from: ISSUED
        to: IN_EXECUTION
        trigger: "system, evaluated inside POST /test-sessions/{test_session_id}/start"
        actor: system
        preconditions:
          - "state == ISSUED"
        side_effects:
          - "sets state = IN_EXECUTION"
      - from: IN_EXECUTION
        to: COMPLETE
        trigger: "system, evaluated inside POST /test-sessions/{test_session_id}/complete"
        actor: system
        preconditions:
          - "state == IN_EXECUTION"
          - "no TestSession of this plan has state IN {SCHEDULED, IN_PROGRESS}"
          - "at least one TestSession of this plan has state == COMPLETE"
          - "every FeatureSet in included_feature_set_ids whose obligation IN {MANDATORY, CONDITIONAL} appears as the feature_set_id of at least one result_lines entry across this plan's COMPLETE sessions"
        side_effects:
          - "sets state = COMPLETE"
        note: "Compound bubble-up: the plan's state is a function of its sessions' states and their result coverage."
      - from: DRAFT
        to: VOIDED
        trigger: "system, evaluated inside POST /test-plans (supersede) and POST /specifications/{specification_id}/deprecate (cascade hop 2) and POST /submissions/{submission_id}/withdraw"
        actor: system
        preconditions:
          - "state IN {DRAFT, ISSUED, IN_EXECUTION, COMPLETE}"
        side_effects:
          - "sets state = VOIDED and voided_reason to SUPERSEDED_BY_NEW_PLAN or SPECIFICATION_DEPRECATED per the trigger"
          - "cancels this plan's TestSession rows in state IN {SCHEDULED, IN_PROGRESS} and decrements the owning TestLaboratory.reserved_bench_minutes by each cancelled session's reserved_minutes"
      - from: ISSUED
        to: VOIDED
        trigger: "system, same triggers as the DRAFT -> VOIDED row"
        actor: system
        preconditions:
          - "state IN {DRAFT, ISSUED, IN_EXECUTION, COMPLETE}"
        side_effects:
          - "identical to the DRAFT -> VOIDED row"
      - from: IN_EXECUTION
        to: VOIDED
        trigger: "system, same triggers as the DRAFT -> VOIDED row"
        actor: system
        preconditions:
          - "state IN {DRAFT, ISSUED, IN_EXECUTION, COMPLETE}"
        side_effects:
          - "identical to the DRAFT -> VOIDED row"
      - from: COMPLETE
        to: VOIDED
        trigger: "system, same triggers as the DRAFT -> VOIDED row"
        actor: system
        preconditions:
          - "state IN {DRAFT, ISSUED, IN_EXECUTION, COMPLETE}"
        side_effects:
          - "identical to the DRAFT -> VOIDED row"

  - entity: TestSession
    field: state
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /test-sessions/{test_session_id}/start"
        actor: TestLaboratory
        preconditions:
          - "state == SCHEDULED"
          - "the acting X-User-ID == laboratory_id (ownership)"
          - "TestLaboratory.accreditation_status == AUTHORIZED (cross-entity dependency)"
          - "TestLaboratory.accreditation_expires_at > logical clock now"
          - "the parent TestPlan has state IN {ISSUED, IN_EXECUTION}"
        side_effects:
          - "sets state = IN_PROGRESS, started_at = logical clock now"
          - "if the parent TestPlan has state == ISSUED: sets TestPlan.state = IN_EXECUTION"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /test-sessions/{test_session_id}/complete"
        actor: TestLaboratory
        preconditions:
          - "state == IN_PROGRESS"
          - "the acting X-User-ID == laboratory_id (ownership)"
          - "result_lines is non-empty"
        side_effects:
          - "sets state = COMPLETE, completed_at = logical clock now"
          - "recomputes completed_late = (completed_at > window_end)"
          - "decrements TestLaboratory.reserved_bench_minutes by reserved_minutes"
          - "may trigger the parent TestPlan's IN_EXECUTION -> COMPLETE bubble-up"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /test-sessions/{test_session_id}/cancel"
        actor: TestLaboratory | ProgramAdmin
        preconditions:
          - "state IN {SCHEDULED, IN_PROGRESS}"
          - "when the actor role is TestLaboratory: the acting X-User-ID == laboratory_id"
        side_effects:
          - "sets state = CANCELLED"
          - "COMPENSATION - decrements TestLaboratory.reserved_bench_minutes by reserved_minutes, restoring it to the value held before this session was created"
          - "frees the bench window: a later POST /test-sessions may occupy the same (laboratory_id, bench_index) interval"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /test-sessions/{test_session_id}/cancel"
        actor: TestLaboratory | ProgramAdmin
        preconditions:
          - "state IN {SCHEDULED, IN_PROGRESS}"
          - "when the actor role is TestLaboratory: the acting X-User-ID == laboratory_id"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED row"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system, cascade from POST /specifications/{specification_id}/deprecate (hop 3), POST /test-laboratories/{laboratory_id}/accreditation-decision with decision == REVOKE (hop 1), POST /submissions/{submission_id}/withdraw, and TestPlan voiding"
        actor: system
        preconditions:
          - "state IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED row"

  - entity: Plugfest
    field: state
    initial_state: REGISTRATION_OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REGISTRATION_OPEN
        to: LOCKED
        trigger: "POST /plugfests/{plugfest_id}/lock"
        actor: ProgramAdmin
        preconditions:
          - "state == REGISTRATION_OPEN"
          - "distinct_vendor_count >= min_distinct_vendors"
        side_effects:
          - "sets state = LOCKED, locked_at = logical clock now"
          - "refuses all further POST /plugfest-participations for this event"
      - from: LOCKED
        to: CLOSED
        trigger: "POST /plugfests/{plugfest_id}/close"
        actor: ProgramAdmin
        preconditions:
          - "state == LOCKED"
        side_effects:
          - "sets state = CLOSED"
          - "for every PlugfestParticipation of this event with state == REGISTERED: sets state = NO_SHOW"
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "system, fan-out of POST /test-laboratories/{laboratory_id}/accreditation-decision with decision == REVOKE on host_laboratory_id"
        actor: system
        preconditions:
          - "state IN {REGISTRATION_OPEN, LOCKED}"
        side_effects:
          - "sets state = CANCELLED"
          - "for every PlugfestParticipation of this event with state == REGISTERED: sets state = NO_SHOW"
      - from: LOCKED
        to: CANCELLED
        trigger: "system, fan-out of POST /test-laboratories/{laboratory_id}/accreditation-decision with decision == REVOKE on host_laboratory_id"
        actor: system
        preconditions:
          - "state IN {REGISTRATION_OPEN, LOCKED}"
        side_effects:
          - "identical to the REGISTRATION_OPEN -> CANCELLED row"

  - entity: PlugfestParticipation
    field: state
    initial_state: REGISTERED
    terminal_states: [PASSED, FAILED, NO_SHOW]
    transitions:
      - from: REGISTERED
        to: PASSED
        trigger: "POST /plugfest-participations/{participation_id}/record-outcome with outcome == PASS"
        actor: TestLaboratory
        preconditions:
          - "state == REGISTERED"
          - "the parent Plugfest has state == LOCKED"
          - "the acting X-User-ID == the parent Plugfest's host_laboratory_id (ownership)"
          - "interop_pass_count in the request is >= 1"
        side_effects:
          - "sets state = PASSED, interop_pass_count from the request, outcome_recorded_at = logical clock now"
          - "increments CertificationSubmission.plugfest_credit_count by 1 on submission_id"
      - from: REGISTERED
        to: FAILED
        trigger: "POST /plugfest-participations/{participation_id}/record-outcome with outcome == FAIL"
        actor: TestLaboratory
        preconditions:
          - "state == REGISTERED"
          - "the parent Plugfest has state == LOCKED"
          - "the acting X-User-ID == the parent Plugfest's host_laboratory_id (ownership)"
        side_effects:
          - "sets state = FAILED, interop_pass_count from the request, outcome_recorded_at = logical clock now"
          - "leaves CertificationSubmission.plugfest_credit_count unchanged"
      - from: REGISTERED
        to: NO_SHOW
        trigger: "system, cascade of POST /plugfests/{plugfest_id}/close and of Plugfest cancellation"
        actor: system
        preconditions:
          - "state == REGISTERED"
        side_effects:
          - "sets state = NO_SHOW"
          - "leaves CertificationSubmission.plugfest_credit_count unchanged"

  - entity: CertificationListing#publication_status
    field: publication_status
    initial_state: UNPUBLISHED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: UNPUBLISHED
        to: PUBLISHED
        trigger: "POST /listings/{listing_id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "publication_status IN {UNPUBLISHED, SUPPRESSED}"
          - "the listing's CertificationSubmission has dac_state == ISSUED (cross-entity dependency)"
          - "compliance_status IN {COMPLIANT, REMEDIATED}"
          - "the listing's Member has good_standing == true"
        side_effects:
          - "sets publication_status = PUBLISHED, published_at = logical clock now"
          - "recomputes declared_features from the submission's non-VOIDED TestPlan"
      - from: SUPPRESSED
        to: PUBLISHED
        trigger: "POST /listings/{listing_id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "publication_status IN {UNPUBLISHED, SUPPRESSED}"
          - "the listing's CertificationSubmission has dac_state == ISSUED"
          - "compliance_status IN {COMPLIANT, REMEDIATED}"
          - "the listing's Member has good_standing == true"
        side_effects:
          - "identical to the UNPUBLISHED -> PUBLISHED row"
        note: "Re-publication after remediation; this axis is therefore cyclic while compliance_status walks its own axis."
      - from: PUBLISHED
        to: SUPPRESSED
        trigger: "system, cascade hop 2 of POST /members/{member_id}/ip-commitment/withdraw, and inside POST /listings/{listing_id}/firmware-revisions when recert_classification == FULL"
        actor: system
        preconditions:
          - "publication_status == PUBLISHED"
        side_effects:
          - "sets publication_status = SUPPRESSED"
          - "when driven by the IP-withdrawal cascade, also sets compliance_status = UNDER_INVESTIGATION and causes cascade hop 3"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /listings/{listing_id}/withdraw, and system on NoncomplianceCase EVIDENCE_REVIEW -> WITHDRAWAL_ORDERED"
        actor: ComplianceOfficer | system
        preconditions:
          - "publication_status IN {UNPUBLISHED, PUBLISHED, SUPPRESSED}"
        side_effects:
          - "sets publication_status = WITHDRAWN"
          - "sets compliance_status = NONCOMPLIANT"
          - "for the listing's CertificationSubmission with dac_state == ISSUED: sets dac_state = REVOKED"
      - from: SUPPRESSED
        to: WITHDRAWN
        trigger: "POST /listings/{listing_id}/withdraw, and system on NoncomplianceCase EVIDENCE_REVIEW -> WITHDRAWAL_ORDERED"
        actor: ComplianceOfficer | system
        preconditions:
          - "publication_status IN {UNPUBLISHED, PUBLISHED, SUPPRESSED}"
        side_effects:
          - "identical to the PUBLISHED -> WITHDRAWN row"
      - from: UNPUBLISHED
        to: WITHDRAWN
        trigger: "POST /listings/{listing_id}/withdraw, and system on NoncomplianceCase EVIDENCE_REVIEW -> WITHDRAWAL_ORDERED"
        actor: ComplianceOfficer | system
        preconditions:
          - "publication_status IN {UNPUBLISHED, PUBLISHED, SUPPRESSED}"
        side_effects:
          - "identical to the PUBLISHED -> WITHDRAWN row"

  - entity: CertificationListing#compliance_status
    field: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: UNDER_INVESTIGATION
        trigger: "POST /noncompliance-cases, and system cascade hop 2 of POST /members/{member_id}/ip-commitment/withdraw"
        actor: ComplianceOfficer | system
        preconditions:
          - "compliance_status IN {COMPLIANT, REMEDIATED}"
        side_effects:
          - "sets compliance_status = UNDER_INVESTIGATION"
          - "leaves publication_status untouched when driven by POST /noncompliance-cases - the two axes move on separate triggers"
      - from: REMEDIATED
        to: UNDER_INVESTIGATION
        trigger: "POST /noncompliance-cases"
        actor: ComplianceOfficer
        preconditions:
          - "compliance_status IN {COMPLIANT, REMEDIATED}"
        side_effects:
          - "identical to the COMPLIANT -> UNDER_INVESTIGATION row"
        note: "Cyclic on this axis: a remediated listing can be re-investigated without bound."
      - from: UNDER_INVESTIGATION
        to: NONCOMPLIANT
        trigger: "system, on NoncomplianceCase EVIDENCE_REVIEW -> WITHDRAWAL_ORDERED and on POST /listings/{listing_id}/withdraw"
        actor: system
        preconditions:
          - "compliance_status == UNDER_INVESTIGATION"
        side_effects:
          - "sets compliance_status = NONCOMPLIANT"
      - from: UNDER_INVESTIGATION
        to: REMEDIATED
        trigger: "system, on NoncomplianceCase REMEDIATION_ORDERED -> REMEDIATED"
        actor: system
        preconditions:
          - "compliance_status == UNDER_INVESTIGATION"
        side_effects:
          - "sets compliance_status = REMEDIATED"
          - "leaves publication_status at SUPPRESSED - a separate POST /listings/{listing_id}/publish is required to restore consumer visibility"

  - entity: NoncomplianceCase
    field: state
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EVIDENCE_REVIEW
        trigger: "POST /noncompliance-cases/{case_id}/advance with disposition == ESCALATE"
        actor: ComplianceOfficer
        preconditions:
          - "state == OPEN"
        side_effects:
          - "sets state = EVIDENCE_REVIEW"
      - from: EVIDENCE_REVIEW
        to: REMEDIATION_ORDERED
        trigger: "POST /noncompliance-cases/{case_id}/advance with disposition == ORDER_REMEDIATION"
        actor: ComplianceOfficer
        preconditions:
          - "state == EVIDENCE_REVIEW"
          - "remediation_days is present in the request and is >= 1 and <= 365"
        side_effects:
          - "sets state = REMEDIATION_ORDERED"
          - "sets remediation_deadline_at = logical clock now + remediation_days days"
          - "for the listing with publication_status == PUBLISHED: sets publication_status = SUPPRESSED"
      - from: EVIDENCE_REVIEW
        to: WITHDRAWAL_ORDERED
        trigger: "POST /noncompliance-cases/{case_id}/advance with disposition == ORDER_WITHDRAWAL"
        actor: ComplianceOfficer
        preconditions:
          - "state == EVIDENCE_REVIEW"
        side_effects:
          - "sets state = WITHDRAWAL_ORDERED"
          - "for the listing: sets publication_status = WITHDRAWN and compliance_status = NONCOMPLIANT"
          - "for the listing's CertificationSubmission with dac_state == ISSUED: sets dac_state = REVOKED"
      - from: REMEDIATION_ORDERED
        to: REMEDIATED
        trigger: "POST /noncompliance-cases/{case_id}/advance with disposition == CONFIRM_REMEDIATION"
        actor: ComplianceOfficer
        preconditions:
          - "state == REMEDIATION_ORDERED"
          - "logical clock now <= remediation_deadline_at"
        side_effects:
          - "sets state = REMEDIATED"
          - "for the listing: sets compliance_status = REMEDIATED (publication_status stays SUPPRESSED)"
      - from: REMEDIATED
        to: CLOSED
        trigger: "POST /noncompliance-cases/{case_id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "state IN {REMEDIATED, WITHDRAWAL_ORDERED}"
          - "the acting X-User-ID != opened_by_user_id (segregation of duties)"
        side_effects:
          - "sets state = CLOSED, closed_by_user_id = the acting X-User-ID"
          - "recomputes Member.open_case_count on the listing's member"
      - from: WITHDRAWAL_ORDERED
        to: CLOSED
        trigger: "POST /noncompliance-cases/{case_id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "state IN {REMEDIATED, WITHDRAWAL_ORDERED}"
          - "the acting X-User-ID != opened_by_user_id (segregation of duties)"
        side_effects:
          - "identical to the REMEDIATED -> CLOSED row"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: test-plan-create-stale-submission
    parent_entity: CertificationSubmission
    write_endpoint: "POST /test-plans"
    occ_field: "expected_submission_version"
    description: |
      Creating a TestPlan against a CertificationSubmission whose version has advanced since the
      client last observed it is rejected. Plan creation legitimately supersedes the submission's
      existing non-VOIDED TestPlan (voiding it and cancelling its scheduled sessions), so a second
      create is not blocked by any state precondition - the submission is still IN_REVIEW and the
      operation would succeed under the natural product semantics. The stale-version check is what
      makes the supersede deliberate rather than accidental.
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412

  - rule_id: firmware-revision-stale-listing
    parent_entity: CertificationListing
    write_endpoint: "POST /listings/{listing_id}/firmware-revisions"
    occ_field: "expected_listing_version"
    description: |
      Reporting a firmware revision against a CertificationListing whose version has advanced since
      the client last observed it is rejected. Each report legitimately supersedes the previous
      report's recert_classification, recert_trigger_reason and recertification_due_at, so a second
      report from a stale view is not blocked by any state precondition - the listing is still
      PUBLISHED and the report would succeed. The stale-version check prevents a client from
      overwriting a classification it never saw.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules
#   All money is integer cents. All ratios are Decimal rounded ROUND_HALF_UP to
#   4 decimal places; all weighted components are then rounded ROUND_HALF_UP to
#   2 decimal places BEFORE summation. Per-component rounding then summing is
#   normative - summing at full precision and rounding once at the end is a
#   different (wrong) answer and the two diverge observably.
# ---------------------------------------------------------------------------
calculations:

  - name: member_credit_ledger
    trigger: >
      Recomputed on every write that moves credit: POST /members/{member_id}/credits (purchase),
      CertificationSubmission DRAFT -> SUBMITTED (escrow), IN_REVIEW -> REJECTED and
      * -> WITHDRAWN (escrow release), REVIEW_COMPLETE -> CERTIFIED (escrow consumption).
      Read on demand via GET /members/{member_id}/credit-ledger.
    algorithm: aggregation
    formula: |
      escrowed_credit_cents = SUM(s.fee_escrowed_cents
                                  FOR s IN CertificationSubmission WHERE s.member_id == member.id)

      # base (AVAILABLE) variant, and the value persisted on Member.credit_balance_cents
      credit_balance_cents  = credits_purchased_cents
                            - credits_consumed_cents
                            - escrowed_credit_cents

      INVARIANT (must hold after every write, no drift):
        credits_purchased_cents == credit_balance_cents
                                 + credits_consumed_cents
                                 + escrowed_credit_cents
    input_set: >
      Every CertificationSubmission of the member contributes its current fee_escrowed_cents, which is
      non-zero exactly while the submission's state IS IN {SUBMITTED, IN_REVIEW, RETURNED_FOR_INFO}.
      DRAFT submissions contribute 0 (never escrowed); CERTIFIED submissions contribute 0 (escrow was
      consumed into credits_consumed_cents); REJECTED and WITHDRAWN submissions contribute 0 (escrow
      was released back into credit_balance_cents).
    constants:
      CREDIT_PURCHASE_MIN_CENTS: 1000
      CREDIT_PURCHASE_MAX_CENTS: 100000000
    precision: "integer cents; no rounding occurs - every term is already an integer"
    variants:
      - name: AVAILABLE
        when: >
          The default variant, and the one persisted on Member.credit_balance_cents and enforced by the
          DRAFT -> SUBMITTED precondition `credit_balance_cents >= certification_fee_cents`.
        difference: "Subtracts escrowed_credit_cents - money committed to in-flight submissions is not spendable."
      - name: COMMITTED
        when: >
          Requested explicitly as `GET /members/{member_id}/credit-ledger?variant=COMMITTED`; the
          finance view of what the member still owns including money held in escrow.
        difference: >
          Does NOT subtract escrowed_credit_cents: balance_cents = credits_purchased_cents -
          credits_consumed_cents. For a member with one escrowed submission the two variants differ by
          exactly that submission's fee_escrowed_cents, from identical stored data.

  - name: submission_certification_fee_cents
    trigger: >
      Computed once, at POST /submissions, and pinned onto CertificationSubmission.certification_fee_cents.
      Never recomputed - later changes to Member.tier or to the Specification do not move a pinned fee.
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = DEVICE_TYPE_BASE_FEE_CENTS[submission.device_type]
                     + PER_DECLARED_FEATURE_FEE_CENTS * len(submission.declared_feature_codes)
                     + SECURITY_BASELINE_SURCHARGE_CENTS[specification.security_baseline_level]

      # STEP 1 - tier discount, rounded to whole cents
      discounted_cents = ROUND_HALF_UP(subtotal_cents * (1 - TIER_DISCOUNT_RATE[member.tier]), 0)

      # STEP 2 - review-track multiplier applied to the ROUNDED step-1 result
      certification_fee_cents = ROUND_HALF_UP(discounted_cents * TRACK_MULTIPLIER[submission.review_track], 0)

      # Step order is normative. Discount-then-multiply with a rounding step between the two is NOT
      # the same as multiplying the raw subtotal by (1 - discount) * multiplier in one shot; the
      # 5-device-type x 3-tier x 2-track x 3-baseline matrix contains cells where the two differ by
      # 1 cent.
    input_set: >
      Exactly three stored inputs plus one request input: the submission's own device_type,
      declared_feature_codes and review_track; the owning Member's tier; and the pinned Specification's
      security_baseline_level. No TestPlan, TestSession or Plugfest data participates.
    constants:
      DEVICE_TYPE_BASE_FEE_CENTS:
        LIGHTING: 120000
        THERMOSTAT: 180000
        LOCK: 240000
        SENSOR: 100000
        HUB: 300000
      PER_DECLARED_FEATURE_FEE_CENTS: 15000
      SECURITY_BASELINE_SURCHARGE_CENTS:
        SB1: 0
        SB2: 50000
        SB3: 125000
      TIER_DISCOUNT_RATE:
        ADOPTER: "0.00"
        PARTICIPANT: "0.10"
        PROMOTER: "0.25"
      TRACK_MULTIPLIER:
        STANDARD: "1.00"
        EXPEDITED: "1.40"
    precision: "integer cents, ROUND_HALF_UP at each of the two steps"

  - name: certification_readiness_score
    trigger: >
      The PROVISIONAL variant is recomputed and written to
      CertificationSubmission.provisional_readiness_score on every
      POST /test-sessions/{test_session_id}/results and every
      POST /plugfest-participations/{participation_id}/record-outcome.
      The FINAL variant is computed inside
      POST /submissions/{submission_id}/conformance-decision, before that endpoint's
      threshold precondition is evaluated, and is pinned to final_readiness_score only when that
      request is accepted - a request refused with ERR_READINESS_BELOW_THRESHOLD leaves
      final_readiness_score unchanged. Both variants are readable, without writing, via
      GET /submissions/{submission_id}/readiness.
    algorithm: weighted_scoring
    formula: |
      plan = the submission's TestPlan whose state != VOIDED   # at most one exists

      # ---- line selection -------------------------------------------------
      # For a feature set F, its EFFECTIVE OUTCOME is the outcome of the latest result line
      # naming F across the counted sessions, ordered by result_lines[].recorded_at ASC and,
      # for equal recorded_at, by the line's position in result_lines ASC (created_at order of
      # the enclosing session breaks ties across sessions). `id` is never a decision input.
      counted_sessions(PROVISIONAL) = sessions of `plan` with state IN {IN_PROGRESS, COMPLETE}
      counted_sessions(FINAL)       = sessions of `plan` with state == COMPLETE

      PASS_SET(PROVISIONAL) = {PASS, WAIVED, BLOCKED}   # optimistic: a blocked case is assumed recoverable
      PASS_SET(FINAL)       = {PASS, WAIVED}            # strict: a blocked case counts as a failure

      # ---- coverage ratios ------------------------------------------------
      # A feature set contributes its FULL test_case_count when its effective outcome is in PASS_SET.
      mand_passed = SUM(F.test_case_count FOR F IN plan.included_feature_set_ids
                        WHERE F.obligation IN {MANDATORY, CONDITIONAL}
                          AND effective_outcome(F) IN PASS_SET)
      opt_passed  = SUM(F.test_case_count FOR F IN plan.included_feature_set_ids
                        WHERE F.obligation == OPTIONAL
                          AND effective_outcome(F) IN PASS_SET)

      mand_ratio = ROUND_HALF_UP(mand_passed / plan.mandatory_case_count, 4)
                   if plan.mandatory_case_count > 0 else 0.0000
      opt_ratio  = ROUND_HALF_UP(opt_passed  / plan.optional_case_count,  4)
                   if plan.optional_case_count  > 0 else 1.0000   # vacuously satisfied

      # ---- interop ratio --------------------------------------------------
      interop_ratio = ROUND_HALF_UP(MIN(submission.plugfest_credit_count, INTEROP_CREDIT_TARGET)
                                    / INTEROP_CREDIT_TARGET, 4)

      # ---- timeliness ratio -----------------------------------------------
      late_ratio      = ROUND_HALF_UP(COUNT(s IN counted_sessions WHERE s.completed_late)
                                      / COUNT(counted_sessions), 4)
                        if COUNT(counted_sessions) > 0 else 0.0000
      timeliness_ratio(PROVISIONAL) = 1.0000                 # nothing is late until it is complete
      timeliness_ratio(FINAL)       = 1.0000 - late_ratio

      # ---- weighted sum, PER-COMPONENT ROUNDING ---------------------------
      score = ROUND_HALF_UP(WEIGHT_MANDATORY   * mand_ratio,             2)
            + ROUND_HALF_UP(WEIGHT_OPTIONAL    * opt_ratio,              2)
            + ROUND_HALF_UP(WEIGHT_INTEROP     * interop_ratio,          2)
            + ROUND_HALF_UP(WEIGHT_TIMELINESS  * timeliness_ratio,       2)

      # Worked divergence on identical stored data (mandatory_case_count 30 over two mandatory
      # feature sets of 20 and 10 cases, optional_case_count 8 over one optional feature set,
      # one COMPLETE session carrying FS_A=PASS and FS_B=BLOCKED with completed_late == true, one
      # IN_PROGRESS session carrying FS_C(optional)=PASS, plugfest_credit_count == 0):
      #   PROVISIONAL: 50.00 + 20.00 + 0.00 + 15.00 = 85.00
      #   FINAL      : mand 20/30 -> 0.6667 -> ROUND(33.3350, 2) = 33.34
      #                opt   0/8  -> 0.0000 -> 0.00
      #                interop    -> 0.0000 -> 0.00
      #                timeliness 1 late of 1 counted -> 1.0000 - 1.0000 = 0.0000 -> 0.00
      #                total = 33.34         (delta 51.66; FINAL is below FINAL_APPROVAL_THRESHOLD)
      # Summing at full precision instead would give 33.33 for the FINAL total - a 0.01 divergence
      # that the per-component rule forbids.
    input_set: >
      Only result lines belonging to sessions of the submission's non-VOIDED TestPlan participate, and
      the two variants filter those sessions differently (IN_PROGRESS + COMPLETE versus COMPLETE only).
      Sessions in state SCHEDULED or CANCELLED never participate in either variant, so cancelling a
      session that carried failures raises both scores. Result lines whose feature_set_id is not in
      plan.included_feature_set_ids are ignored entirely.
    constants:
      WEIGHT_MANDATORY: 50
      WEIGHT_OPTIONAL: 20
      WEIGHT_INTEROP: 15
      WEIGHT_TIMELINESS: 15
      INTEROP_CREDIT_TARGET: 2
      FINAL_APPROVAL_THRESHOLD: "65.00"
    precision: "ratios 4 dp ROUND_HALF_UP; each weighted component 2 dp ROUND_HALF_UP; score is the exact sum of the four rounded components"
    variants:
      - name: PROVISIONAL
        when: >
          Written to provisional_readiness_score after every result-line submission and every plugfest
          outcome, and returned by GET /submissions/{submission_id}/readiness?variant=PROVISIONAL
          (also the default when `variant` is omitted).
        difference: >
          Counts IN_PROGRESS sessions as well as COMPLETE ones, treats BLOCKED as passing, and pins
          timeliness_ratio at 1.0000 regardless of any completed_late session.
      - name: FINAL
        when: >
          Computed and pinned to final_readiness_score inside
          POST /submissions/{submission_id}/conformance-decision, and returned by
          GET /submissions/{submission_id}/readiness?variant=FINAL.
        difference: >
          Counts COMPLETE sessions only, treats BLOCKED as failing, and penalises lateness through
          timeliness_ratio = 1.0000 - late_ratio. FINAL is therefore always <= PROVISIONAL on the same
          data, and only FINAL is compared against FINAL_APPROVAL_THRESHOLD.

  - name: test_plan_case_counts
    trigger: >
      Runs once inside POST /test-plans, resolving included_feature_set_ids and the three case counts
      onto the new TestPlan. Never recomputed - a plan is a frozen snapshot of the specification's
      feature graph at creation time.
    algorithm: constraint_propagation
    formula: |
      spec        = submission.specification_id            # pinned by the submission
      device_type = submission.device_type
      candidates  = FeatureSet rows with specification_id == spec AND device_type == device_type

      # SEED
      working = { F IN candidates : F.obligation == MANDATORY }
              U { F IN candidates : F.obligation == OPTIONAL
                                    AND F.feature_code IN submission.declared_feature_codes }

      # PROPAGATE to a fixed point (both rules run each round; iterate until `working` stops growing)
      REPEAT:
        # (a) dependency closure - a needed feature set drags in what it depends on, transitively,
        #     regardless of the dependency's own obligation
        working U= { F.depends_on target : F IN working AND F.depends_on_feature_set_id IS NOT NULL }
        # (b) conditional activation - a CONDITIONAL feature set becomes required exactly when the
        #     feature set it depends on is already in `working`
        working U= { F IN candidates : F.obligation == CONDITIONAL
                                       AND F.depends_on_feature_set_id IN working }
      UNTIL no change

      included_feature_set_ids = working, ordered by FeatureSet.feature_code ASC
      required_case_count  = SUM(F.test_case_count FOR F IN working)
      mandatory_case_count = SUM(F.test_case_count FOR F IN working WHERE F.obligation IN {MANDATORY, CONDITIONAL})
      optional_case_count  = SUM(F.test_case_count FOR F IN working WHERE F.obligation == OPTIONAL)
      # required_case_count == mandatory_case_count + optional_case_count always holds.

      # Rule (b) is why a single extra declared OPTIONAL code can pull in a CONDITIONAL set, whose
      # own depends_on then pulls in a further OPTIONAL set through rule (a) - a two-round chain that
      # a single-pass implementation silently truncates.
    input_set: >
      Only FeatureSet rows of the submission's pinned Specification whose device_type equals the
      submission's device_type are candidates. Feature sets of other device types are never included
      even when their feature_code appears in declared_feature_codes. Declared codes with no matching
      candidate are ignored here (POST /submissions rejects unknown codes up front).
    constants:
      MAX_PROPAGATION_ROUNDS: 8
    precision: "integer case counts; no rounding"

  - name: laboratory_competency_score
    trigger: >
      Computed inside POST /test-laboratories/{laboratory_id}/competency-review, which writes
      competency_score, competency_variant and competency_reviewed_at and may drive the
      AUTHORIZED -> SUSPENDED transition. Also readable via
      GET /test-laboratories/{laboratory_id}/competency.
    algorithm: weighted_scoring
    formula: |
      all_complete = TestSession rows with laboratory_id == lab.id AND state == COMPLETE

      counted(ROLLING_90D) = { s IN all_complete :
                               s.completed_at >= now - ROLLING_WINDOW_DAYS days }   # inclusive lower bound
      counted(LIFETIME)    = all_complete

      IF COUNT(counted) == 0: reject the review with ERR_NO_COMPLETED_SESSIONS (no score is written)

      on_time_ratio      = ROUND_HALF_UP(COUNT(s IN counted WHERE s.completed_late == false)
                                         / COUNT(counted), 4)
      counted_lines      = SUM(len(s.result_lines) FOR s IN counted)
      disputed_lines     = SUM(s.disputed_line_count FOR s IN counted)
      dispute_free_ratio = ROUND_HALF_UP((counted_lines - disputed_lines) / counted_lines, 4)
                           if counted_lines > 0 else 1.0000

      competency_score = ROUND_HALF_UP(WEIGHT_PUNCTUALITY  * on_time_ratio,      2)
                       + ROUND_HALF_UP(WEIGHT_DISPUTE_FREE * dispute_free_ratio, 2)

      # Worked divergence on identical stored data (three COMPLETE sessions: two completed 200 days
      # before `now`, on time, 2 result lines each, 0 disputed; one completed 5 days before `now`,
      # completed_late == true, 4 result lines, 2 disputed):
      #   ROLLING_90D: counted = 1 session   -> on_time 0/1 = 0.0000 -> 0.00
      #                                      -> dispute_free 2/4 = 0.5000 -> 20.00
      #                total = 20.00   (< COMPETENCY_SUSPENSION_THRESHOLD -> lab is SUSPENDED)
      #   LIFETIME   : counted = 3 sessions  -> on_time 2/3 = 0.6667 -> ROUND(40.0020, 2) = 40.00
      #                                      -> dispute_free 6/8 = 0.7500 -> 30.00
      #                total = 70.00   (exactly the threshold -> lab stays AUTHORIZED)
    input_set: >
      Only the laboratory's own TestSession rows in state COMPLETE. SCHEDULED, IN_PROGRESS and
      CANCELLED sessions are invisible to both variants, so cancelling a late session erases its
      punctuality damage. Sessions of VOIDED test plans still count if they reached COMPLETE.
    constants:
      WEIGHT_PUNCTUALITY: 60
      WEIGHT_DISPUTE_FREE: 40
      ROLLING_WINDOW_DAYS: 90
      COMPETENCY_SUSPENSION_THRESHOLD: "70.00"
    precision: "ratios 4 dp ROUND_HALF_UP; each weighted component 2 dp ROUND_HALF_UP; score is the exact sum of the two rounded components"
    variants:
      - name: ROLLING_90D
        when: >
          `variant: ROLLING_90D` in the competency-review request body, and
          GET /test-laboratories/{laboratory_id}/competency?variant=ROLLING_90D.
        difference: >
          Restricts the counted set to sessions whose completed_at is at or after
          (logical clock now - 90 days). The lower bound is INCLUSIVE: a session completed at exactly
          now - 90 days is counted.
      - name: LIFETIME
        when: >
          `variant: LIFETIME` in the competency-review request body, and
          GET /test-laboratories/{laboratory_id}/competency?variant=LIFETIME.
        difference: >
          Counts every COMPLETE session ever. Old clean history dilutes recent misconduct, so LIFETIME
          is typically the higher score - and the two variants can land on opposite sides of
          COMPETENCY_SUSPENSION_THRESHOLD from identical stored data.

  - name: laboratory_reserved_bench_minutes
    trigger: >
      reserved_minutes is computed once per TestSession at POST /test-sessions. The laboratory-level
      aggregate reserved_bench_minutes is adjusted on every TestSession lifecycle write: incremented at
      creation, decremented on complete, decremented on cancel (whether the cancel is direct or a
      cascade), and zeroed by an accreditation REVOKE.
    algorithm: aggregation
    formula: |
      # per session, at creation
      reserved_minutes = FLOOR((window_end - window_start) / 60 seconds)   # whole minutes, exact by
                                                                          # construction: both bounds
                                                                          # must be on a minute boundary

      # laboratory aggregate - the normative definition
      reserved_bench_minutes = SUM(s.reserved_minutes
                                   FOR s IN TestSession
                                   WHERE s.laboratory_id == lab.id
                                     AND s.state IN {SCHEDULED, IN_PROGRESS})

      INVARIANT (compensating; must hold after every write):
        lab.reserved_bench_minutes == that SUM, exactly - no drift after any number of
        create / start / complete / cancel / cascade-cancel cycles. Completing a session and
        cancelling a session both remove exactly reserved_minutes, so a create-then-cancel pair
        restores the pre-create value bit for bit.

      # capacity ceiling, enforced at POST /test-sessions BEFORE the session is stored
      capacity_ceiling_minutes = lab.bench_capacity * MINUTES_PER_BENCH_PER_CYCLE
      IF reserved_bench_minutes + reserved_minutes > capacity_ceiling_minutes:
        reject with ERR_LAB_CAPACITY_EXCEEDED
      # `>` not `>=`: landing exactly on the ceiling is allowed.
    input_set: >
      Only SCHEDULED and IN_PROGRESS sessions of the laboratory. COMPLETE and CANCELLED sessions
      contribute nothing, so a laboratory that has finished all its work is back at 0 regardless of how
      much it ever booked.
    constants:
      MINUTES_PER_BENCH_PER_CYCLE: 600
      BENCH_CHANGEOVER_MINUTES: 60
    precision: "integer minutes; FLOOR on the per-session duration, no rounding on the aggregate"

  - name: plugfest_distinct_vendor_count
    trigger: >
      Recomputed on POST /plugfest-participations, on
      POST /plugfest-participations/{participation_id}/record-outcome, and on the NO_SHOW cascades
      driven by POST /plugfests/{plugfest_id}/close and by Plugfest cancellation. Read as
      Plugfest.distinct_vendor_count.
    algorithm: aggregation
    formula: |
      distinct_vendor_count = COUNT(DISTINCT p.member_id
                                    FOR p IN PlugfestParticipation
                                    WHERE p.plugfest_id == plugfest.id
                                      AND p.state IN {REGISTERED, PASSED, FAILED})

      # Lock gate, enforced at POST /plugfests/{plugfest_id}/lock:
      IF distinct_vendor_count < plugfest.min_distinct_vendors:
        reject with ERR_INSUFFICIENT_DISTINCT_VENDORS
      # `<` not `<=`: exactly min_distinct_vendors is sufficient.
    input_set: >
      Participations in state NO_SHOW are excluded, so the count is not monotonic - closing an event
      drops it. Two devices registered by the same Member count once: it is a DISTINCT member_id count,
      not a participation count.
    constants:
      MIN_DISTINCT_VENDORS_FLOOR: 2
      MIN_DISTINCT_VENDORS_CEILING: 8
    precision: "integer count; no rounding"

  - name: recertification_classification
    trigger: >
      Runs inside POST /listings/{listing_id}/firmware-revisions, after the OCC check on
      expected_listing_version and before any state write. Sets recert_classification,
      recert_trigger_reason and recertification_due_at on the listing, and drives that endpoint's
      suppression / credential-revocation side effects.
    algorithm: threshold
    formula: |
      spec            = the listing's submission's pinned Specification
      declared        = SET(listing.declared_features)             # feature_code strings
      changed         = SET(request.changed_feature_codes)
      overlap         = changed INTERSECT declared
      security_sets   = { c IN overlap : the FeatureSet of (spec, submission.device_type) with
                                         feature_code == c has security_relevant == true }

      # Classification is decided by the FIRST matching rule, in this exact order.
      # R1 wins over R2 even when both hold, and both win over R3.
      R1 (FULL,  reason FIRMWARE_SECURITY_CHANGE):
           request.security_change == true AND spec.security_baseline_level IN {SB2, SB3}
      R2 (FULL,  reason FIRMWARE_SECURITY_CHANGE):
           len(security_sets) >= 1
      R3 (FULL,  reason FIRMWARE_FEATURE_DELTA):
           len(overlap) > FULL_RECERT_FEATURE_DELTA_THRESHOLD
      R4 (DELTA, reason FIRMWARE_FEATURE_DELTA):
           len(overlap) >= 1
      R5 (NONE,  reason unchanged):
           otherwise - including `security_change == true` on an SB1 specification with no
           overlapping feature codes

      recertification_due_at:
        FULL  -> now + FULL_RECERT_DUE_DAYS  days
        DELTA -> now + DELTA_RECERT_DUE_DAYS days
        NONE  -> unchanged (stays whatever it was, including null)

      # R3's boundary is strict: an overlap of exactly FULL_RECERT_FEATURE_DELTA_THRESHOLD codes
      # falls through to R4 and classifies DELTA; one more code classifies FULL.
      # Always applied, for every classification including NONE:
      latest_firmware_version  = request.firmware_version
      firmware_revision_count += 1
    input_set: >
      Only feature codes that appear in the listing's declared_features are eligible for overlap - a
      firmware change touching a feature the device never declared is invisible to R2, R3 and R4.
      security_relevant is read from the FeatureSet rows of the pinned Specification and the
      submission's device_type, so the same feature_code on another device type is not consulted.
    constants:
      FULL_RECERT_FEATURE_DELTA_THRESHOLD: 2
      FULL_RECERT_DUE_DAYS: 30
      DELTA_RECERT_DUE_DAYS: 90
      SPECIFICATION_DEPRECATION_RECERT_DUE_DAYS: 180
    precision: "integer day arithmetic on the logical clock; due dates are exact UTC instants (now + N*86400 seconds)"

  - name: noncompliance_penalty_assessment
    trigger: >
      Computed once at NoncomplianceCase creation - both for an operator-filed
      POST /noncompliance-cases and for a case auto-opened by cascade hop 4 of
      POST /members/{member_id}/ip-commitment/withdraw. Pinned onto the case; never recomputed.
    algorithm: tiered_pricing
    formula: |
      u = case.claimed_impact_units

      # marginal tiering - each band is priced only on the units that fall inside it
      band1 = MIN(u, 100)                                        @ TIER_RATES[0] cents/unit
      band2 = MIN(MAX(u - 100, 0), 900)                          @ TIER_RATES[1] cents/unit
      band3 = MAX(u - 1000, 0)                                   @ TIER_RATES[2] cents/unit
      assessment_subtotal_cents = band1*500 + band2*300 + band3*150

      surcharge_cents = ROUND_HALF_UP(assessment_subtotal_cents
                                      * CATEGORY_SURCHARGE_RATE[case.category], 0)

      penalty_total_cents = MIN(assessment_subtotal_cents + surcharge_cents, PENALTY_CAP_CENTS)
      # The cap applies to the TOTAL only. assessment_subtotal_cents and surcharge_cents are stored
      # uncapped, so a capped case is recognisable by subtotal + surcharge > penalty_total.

      # Worked boundaries:
      #   u = 100,   INTEROP_DEFECT   -> subtotal 50000;    surcharge 5000;    total 55000
      #   u = 101,   INTEROP_DEFECT   -> subtotal 50300;    surcharge 5030;    total 55330
      #   u = 1200,  SECURITY_DEFECT  -> subtotal 350000;   surcharge 122500;  total 472500
      #   u = 30000, SECURITY_DEFECT  -> subtotal 4670000;  surcharge 1634500; total 5000000 (capped)
      #   u = 0,     IP_WITHDRAWAL    -> subtotal 0;        surcharge 0;       total 0
    input_set: >
      Only the case's own claimed_impact_units and category. Neither the listing's history nor the
      member's other open cases participate - each case is priced in isolation.
    constants:
      TIER_BREAKPOINTS: [100, 1000]
      TIER_RATES: [500, 300, 150]
      CATEGORY_SURCHARGE_RATE:
        INTEROP_DEFECT: "0.10"
        SECURITY_DEFECT: "0.35"
        FALSE_FEATURE_DECLARATION: "0.25"
        IP_WITHDRAWAL: "0.00"
      PENALTY_CAP_CENTS: 5000000
    precision: "integer cents; ROUND_HALF_UP to whole cents on the surcharge; the cap is a hard MIN, not a rounding step"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules (evaluated strictly in ascending `priority` order; the
#     FIRST violated rule decides the response and no later rule is evaluated)
# ---------------------------------------------------------------------------
validations:

  # --- 1-2 authentication and authorization ---------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's declared `roles` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: >
      Ownership: when X-User-Role == Member the acting X-User-ID equals the target resource's member_id
      (or the member_id of its parent chain); when X-User-Role == TestLaboratory the acting X-User-ID
      equals the target TestSession's laboratory_id or the target Plugfest's host_laboratory_id.
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: >
      POST /members/{member_id}/ip-commitment, POST /members/{member_id}/ip-commitment/withdraw,
      POST /members/{member_id}/credits, POST /submissions, POST /submissions/{submission_id}/submit,
      POST /submissions/{submission_id}/withdraw, POST /plugfest-participations,
      POST /test-sessions/{test_session_id}/start, POST /test-sessions/{test_session_id}/results,
      POST /test-sessions/{test_session_id}/complete, POST /test-sessions/{test_session_id}/cancel,
      POST /plugfest-participations/{participation_id}/record-outcome

  # --- 4-5 existence -------------------------------------------------------
  - priority: 4
    category: existence
    check: "every templated path segment resolves to a stored row, validated left to right"
    error_id: "ERR_SPECIFICATION_NOT_FOUND | ERR_FEATURE_SET_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_LABORATORY_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_TEST_PLAN_NOT_FOUND | ERR_TEST_SESSION_NOT_FOUND | ERR_PLUGFEST_NOT_FOUND | ERR_PARTICIPATION_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path"

  - priority: 5
    category: existence
    check: >
      every foreign-key id supplied in the request body resolves to a stored row, validated in the
      order the fields are listed in the endpoint's `input:`
    error_id: "ERR_SPECIFICATION_NOT_FOUND | ERR_FEATURE_SET_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_LABORATORY_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_TEST_PLAN_NOT_FOUND | ERR_PLUGFEST_NOT_FOUND | ERR_LISTING_NOT_FOUND"
    http_status: 404
    applies_to: "POST /feature-sets, POST /submissions, POST /test-plans, POST /test-sessions, POST /plugfests, POST /plugfest-participations, POST /listings, POST /noncompliance-cases, POST /members/{member_id}/ip-commitment"

  # --- 6-9 request shape ---------------------------------------------------
  - priority: 6
    category: business_constraint
    check: >
      every field the endpoint declares as required is present and of the declared JSON type, and every
      numeric field is inside its §1.1 range. This includes the CONDITIONALLY required fields §1.1
      declares: depends_on_feature_set_id is required when obligation == CONDITIONAL and MUST be null
      for MANDATORY and OPTIONAL; remediation_days is required when disposition == ORDER_REMEDIATION
      and MUST be absent for every other disposition; authorized_device_types must be a non-empty
      duplicate-free array; result_lines must be a non-empty array of objects each carrying
      feature_set_id, outcome and evidence_hash; interop_pass_count must be >= 1 when outcome == PASS
      (its declared range 0..8 applies to both outcomes).
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 7
    category: business_constraint
    check: "every enum-typed field carries one of that field's declared values (device_type, obligation, tier, review_track, session_type, decision, disposition, outcome, variant, category, security_baseline_level, ip_commitment_type)"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all endpoints with an enum input"

  - priority: 8
    category: business_temporal
    check: >
      window_end > window_start, and both window_start and window_end fall exactly on a minute boundary
      (zero seconds, zero microseconds)
    error_id: ERR_INVALID_WINDOW_BOUNDS
    http_status: 422
    applies_to: "POST /test-sessions, POST /plugfests"

  - priority: 9
    category: business_temporal
    check: >
      for POST /specifications: sunset_date, when present, is strictly after effective_date.
      For POST /plugfests: registration_deadline is at or before window_start.
      For POST /noncompliance-cases/{case_id}/advance with disposition == ORDER_REMEDIATION:
      1 <= remediation_days <= 365.
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /specifications, POST /plugfests, POST /noncompliance-cases/{case_id}/advance"

  - priority: 10
    category: business_fiscal
    check: "CREDIT_PURCHASE_MIN_CENTS <= amount_cents <= CREDIT_PURCHASE_MAX_CENTS"
    error_id: ERR_CREDIT_AMOUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /members/{member_id}/credits"

  # --- 11-12 optimistic concurrency ---------------------------------------
  - priority: 11
    category: state
    check: "expected_submission_version equals the parent CertificationSubmission's current version"
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412
    applies_to: "POST /test-plans"

  - priority: 12
    category: state
    check: "expected_listing_version equals the target CertificationListing's current version"
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
    applies_to: "POST /listings/{listing_id}/firmware-revisions"

  # --- 13-22 state preconditions ------------------------------------------
  - priority: 13
    category: state
    check: >
      the target Specification's status permits the operation: RATIFIED-only for
      POST /submissions/{submission_id}/submit; DRAFT-only for POST /feature-sets and
      POST /specifications/{specification_id}/ratify; RATIFIED or DEPRECATED for
      POST /members/{member_id}/ip-commitment and POST /plugfests; the DEPRECATED -> RETIRED step
      additionally requires that no submission of the specification sits in a live state. For
      POST /specifications, a non-null supersedes_specification_id must name a Specification whose
      status IS IN {RATIFIED, DEPRECATED} - a DRAFT version cannot be superseded before it is ratified.
    error_id: ERR_INVALID_SPECIFICATION_STATE
    http_status: 409
    applies_to: "POST /specifications, POST /feature-sets, POST /specifications/{specification_id}/ratify, POST /specifications/{specification_id}/deprecate, POST /members/{member_id}/ip-commitment, POST /plugfests, POST /submissions/{submission_id}/submit"

  - priority: 14
    category: state
    check: "the target Member's onboarding_state permits the operation (REGISTERED for ip-commitment; IP_EXECUTED or TOOLS_REVOKED for a GRANT; TOOLS_GRANTED for a REVOKE; not already IP_WITHDRAWN for a withdraw)"
    error_id: ERR_INVALID_MEMBER_STATE
    http_status: 409
    applies_to: "POST /members/{member_id}/ip-commitment, POST /members/{member_id}/ip-commitment/withdraw, POST /members/{member_id}/tool-access"

  - priority: 15
    category: state
    check: "the target TestLaboratory's accreditation_status permits the operation (PROVISIONAL for AUTHORIZE, AUTHORIZED for SUSPEND, SUSPENDED for REINSTATE, any of PROVISIONAL/AUTHORIZED/SUSPENDED for REVOKE, AUTHORIZED for a session start)"
    error_id: ERR_INVALID_LABORATORY_STATE
    http_status: 409
    applies_to: "POST /test-laboratories/{laboratory_id}/accreditation-decision, POST /test-sessions, POST /test-sessions/{test_session_id}/start, POST /test-laboratories/{laboratory_id}/competency-review"

  - priority: 16
    category: state
    check: >
      the linked CertificationSubmission's state and credential posture permit the operation, per the
      §1.2 CertificationSubmission transition table: POST /test-plans requires state == IN_REVIEW;
      POST /listings requires state IN {REVIEW_COMPLETE, CERTIFIED};
      POST /listings/{listing_id}/publish requires the linked submission's dac_state == ISSUED
    error_id: ERR_INVALID_SUBMISSION_STATE
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/*, POST /test-plans, POST /listings, POST /listings/{listing_id}/publish"

  - priority: 17
    category: state
    check: "the target CertificationSubmission's review axis is still PENDING - a conformance or security decision cannot be recorded twice, and return-for-info requires conformance_review_state == PENDING"
    error_id: ERR_REVIEW_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/conformance-decision, POST /submissions/{submission_id}/security-decision, POST /submissions/{submission_id}/return-for-info"

  - priority: 18
    category: state
    check: "the target TestPlan's state permits the operation (DRAFT for issue; ISSUED or IN_EXECUTION for a session start; not VOIDED for session creation)"
    error_id: ERR_INVALID_TEST_PLAN_STATE
    http_status: 409
    applies_to: "POST /test-plans/{test_plan_id}/issue, POST /test-sessions, POST /test-sessions/{test_session_id}/start"

  - priority: 19
    category: state
    check: "the target TestSession's state permits the operation (SCHEDULED for start; IN_PROGRESS for results and complete; IN_PROGRESS or COMPLETE for dispute-line; SCHEDULED or IN_PROGRESS for cancel)"
    error_id: ERR_INVALID_SESSION_STATE
    http_status: 409
    applies_to: "POST /test-sessions/{test_session_id}/start, POST /test-sessions/{test_session_id}/results, POST /test-sessions/{test_session_id}/complete, POST /test-sessions/{test_session_id}/cancel, POST /test-sessions/{test_session_id}/dispute-line"

  - priority: 20
    category: state
    check: "the target Plugfest's state permits the operation (REGISTRATION_OPEN for registration and lock; LOCKED for outcome recording and close)"
    error_id: ERR_INVALID_PLUGFEST_STATE
    http_status: 409
    applies_to: "POST /plugfest-participations, POST /plugfests/{plugfest_id}/lock, POST /plugfests/{plugfest_id}/close, POST /plugfest-participations/{participation_id}/record-outcome"

  - priority: 21
    category: state
    check: "the target PlugfestParticipation is still in state REGISTERED"
    error_id: ERR_INVALID_PARTICIPATION_STATE
    http_status: 409
    applies_to: "POST /plugfest-participations/{participation_id}/record-outcome"

  - priority: 22
    category: state
    check: >
      the target CertificationListing's publication_status and compliance_status permit the operation:
      publish requires publication_status IN {UNPUBLISHED, SUPPRESSED} and compliance_status IN
      {COMPLIANT, REMEDIATED}; withdraw and firmware-revision reporting require publication_status !=
      WITHDRAWN; opening a case requires compliance_status IN {COMPLIANT, REMEDIATED}
    error_id: ERR_INVALID_LISTING_STATE
    http_status: 409
    applies_to: "POST /listings/{listing_id}/publish, POST /listings/{listing_id}/withdraw, POST /listings/{listing_id}/firmware-revisions, POST /noncompliance-cases"

  - priority: 23
    category: state
    check: "the target NoncomplianceCase's state permits the disposition (OPEN for ESCALATE; EVIDENCE_REVIEW for ORDER_REMEDIATION and ORDER_WITHDRAWAL; REMEDIATION_ORDERED for CONFIRM_REMEDIATION; REMEDIATED or WITHDRAWAL_ORDERED for close)"
    error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    applies_to: "POST /noncompliance-cases/{case_id}/advance, POST /noncompliance-cases/{case_id}/close"

  # --- 24-29 compliance / security (regulatory tier - outranks constraint and fiscal) ---
  - priority: 24
    category: business_safety
    check: >
      Segregation of duties on X-User-ID: the security decision may not be recorded by the X-User-ID
      stored in conformance_reviewer_user_id, and a NoncomplianceCase may not be closed by the
      X-User-ID stored in opened_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/security-decision, POST /noncompliance-cases/{case_id}/close"

  - priority: 25
    category: business_safety
    check: >
      Member good standing: the acting Member has good_standing == true. good_standing is true exactly
      when onboarding_state == TOOLS_GRANTED and ip_commitment_type is not null and ip_withdrawn_at is
      null (open_case_count is reported for operators but does not gate good standing).
    error_id: ERR_MEMBER_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/submit, POST /plugfest-participations, POST /listings/{listing_id}/publish"
    note: >
      PRIORITY PAIR A (higher half). A submit request from a member who both lost good standing AND
      lacks the credit for the fee returns THIS error, never ERR_INSUFFICIENT_CREDIT (priority 50) -
      compliance outranks money.

  - priority: 26
    category: business_safety
    check: "an IP commitment has been executed against the submission's pinned Specification: the member's ip_scope_specification_id equals the submission's specification_id"
    error_id: ERR_IP_COMMITMENT_REQUIRED
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/submit"

  - priority: 27
    category: business_safety
    check: >
      Security-baseline declaration: when the pinned Specification's security_baseline_level IN
      {SB2, SB3}, the submission's declared_secure_boot == true and
      declared_firmware_update_capability == OTA_SIGNED. On a security decision, the request's
      verified_firmware_update_capability == OTA_SIGNED under the same condition.
    error_id: ERR_SECURITY_BASELINE_NOT_MET
    http_status: 422
    applies_to: "POST /submissions/{submission_id}/submit, POST /submissions/{submission_id}/security-decision"

  - priority: 28
    category: business_safety
    check: >
      Device attestation: a security APPROVE requires the request's secure_boot_verified == true, and
      credential issuance requires the stored secure_boot_verified == true and
      verified_firmware_update_capability != NONE.
    error_id: ERR_SECURE_BOOT_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /submissions/{submission_id}/security-decision, POST /submissions/{submission_id}/issue-credential"

  - priority: 29
    category: business_safety
    check: "the laboratory's accreditation_expires_at is strictly after the logical clock now"
    error_id: ERR_ACCREDITATION_EXPIRED
    http_status: 409
    applies_to: "POST /test-laboratories/{laboratory_id}/accreditation-decision (AUTHORIZE and REINSTATE), POST /test-sessions, POST /test-sessions/{test_session_id}/start"

  - priority: 30
    category: business_referential
    check: "the laboratory's authorized_device_types contains the device_type of the session's TestPlan (or, for a plugfest host, of every registered participation)"
    error_id: ERR_DEVICE_TYPE_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /test-sessions"

  # --- 31-45 constraint satisfaction --------------------------------------
  - priority: 31
    category: business_referential
    check: "feature_code is unique within (specification_id, device_type)"
    error_id: ERR_DUPLICATE_FEATURE_CODE
    http_status: 409
    applies_to: "POST /feature-sets"

  - priority: 32
    category: business_referential
    check: >
      depends_on_feature_set_id, when present, names a FeatureSet of the same specification_id and the
      same device_type, and adding the edge does not create a cycle in the per-(specification,
      device_type) dependency graph
    error_id: ERR_FEATURE_DEPENDENCY_CYCLE
    http_status: 422
    applies_to: "POST /feature-sets"

  - priority: 33
    category: business_referential
    check: >
      every code in declared_feature_codes matches the feature_code of a FeatureSet of the pinned
      Specification with device_type equal to the submission's device_type; every code in
      changed_feature_codes matches a FeatureSet of the listing's pinned Specification and device type
    error_id: ERR_UNKNOWN_FEATURE_CODE
    http_status: 422
    applies_to: "POST /submissions, POST /listings/{listing_id}/firmware-revisions"

  - priority: 34
    category: business_referential
    check: >
      device-type coherence: a TestSession's session_type-independent device type must match its
      TestPlan's device_type; a PlugfestParticipation's submission must have specification_id equal to
      the Plugfest's specification_id; a NoncomplianceCase's category IP_WITHDRAWAL may only be
      auto-opened by the system, never supplied by an operator
    error_id: ERR_DEVICE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /test-sessions, POST /plugfest-participations, POST /noncompliance-cases"

  - priority: 35
    category: business_referential
    check: "the dac_serial supplied at credential issuance is not already held by any CertificationSubmission"
    error_id: ERR_DUPLICATE_DAC_SERIAL
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/issue-credential"

  - priority: 36
    category: business_referential
    check: "at most one CertificationListing exists per CertificationSubmission"
    error_id: ERR_LISTING_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /listings"

  - priority: 37
    category: business_referential
    check: "every feature_set_id in a submitted result line appears in the enclosing session's TestPlan.included_feature_set_ids, and the disputed line_index addresses an existing result_lines entry"
    error_id: ERR_UNKNOWN_RESULT_FEATURE_SET
    http_status: 422
    applies_to: "POST /test-sessions/{test_session_id}/results, POST /test-sessions/{test_session_id}/dispute-line"

  - priority: 38
    category: business_temporal
    check: >
      Bench occupancy: no other TestSession of the same (laboratory_id, bench_index) in state IN
      {SCHEDULED, IN_PROGRESS} overlaps the requested window under HALF-OPEN [window_start, window_end)
      semantics EXTENDED by a mandatory BENCH_CHANGEOVER_MINUTES (60) buffer on both sides. Two
      sessions that merely touch (A.window_end == B.window_start) still conflict, because the buffer
      forces a 60-minute gap; a gap of exactly 60 minutes is accepted.
    error_id: ERR_BENCH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /test-sessions"
    note: >
      PRIORITY PAIR B (higher half). A session request that both collides with an existing booking AND
      would push the laboratory past its capacity ceiling returns THIS error, never
      ERR_LAB_CAPACITY_EXCEEDED (priority 49) - a conflicting booking is rejected before its minutes
      are ever considered.

  - priority: 39
    category: business_temporal
    check: >
      Plugfest overlap on a device: no other PlugfestParticipation of the same submission_id in state
      IN {REGISTERED, PASSED, FAILED} whose plugfest_id is DIFFERENT from the requested plugfest_id
      belongs to a Plugfest whose UTC-CALENDAR-DATE range
      [DATE(window_start) .. DATE(window_end)] - a CLOSED range, inclusive at both ends - shares any
      date with the requested Plugfest's date range. Clock times are irrelevant: an event ending
      2026-10-06T18:00Z and one starting 2026-10-06T20:00Z both occupy 2026-10-06 and therefore
      conflict, even though their instants do not overlap.
    error_id: ERR_PARTICIPATION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /plugfest-participations"
    note: >
      Participations of the REQUESTED plugfest are deliberately excluded from this check so that a
      second registration of the same (plugfest_id, submission_id) pair - which trivially shares every
      date with itself - falls through to ERR_DUPLICATE_PARTICIPATION (priority 40) instead of being
      mislabelled as a window conflict.

  - priority: 40
    category: business_referential
    check: "the (plugfest_id, submission_id) pair is not already registered"
    error_id: ERR_DUPLICATE_PARTICIPATION
    http_status: 409
    applies_to: "POST /plugfest-participations"

  - priority: 41
    category: business_temporal
    check: "the logical clock now is at or before the Plugfest's registration_deadline"
    error_id: ERR_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST /plugfest-participations"

  - priority: 42
    category: business_constraint
    check: "distinct_vendor_count >= min_distinct_vendors"
    error_id: ERR_INSUFFICIENT_DISTINCT_VENDORS
    http_status: 409
    applies_to: "POST /plugfests/{plugfest_id}/lock"

  - priority: 43
    category: business_constraint
    check: >
      Coverage completeness, in the four contexts where it is required:
      (a) POST /submissions/{submission_id}/conformance-decision - the submission's non-VOIDED TestPlan
      exists, has state == COMPLETE, and every MANDATORY or CONDITIONAL feature set in
      included_feature_set_ids is covered by a result line;
      (b) POST /test-plans/{test_plan_id}/issue - the plan's required_case_count >= 1, i.e. the closure
      is not empty;
      (c) POST /test-sessions/{test_session_id}/complete - the session's result_lines is non-empty;
      (d) POST /specifications/{specification_id}/ratify - feature_set_count >= 1 and, for every
      device_type appearing among the specification's FeatureSet rows, at least one of that device
      type's feature sets has obligation == MANDATORY.
    error_id: ERR_MANDATORY_COVERAGE_INCOMPLETE
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/conformance-decision, POST /test-plans/{test_plan_id}/issue, POST /test-sessions/{test_session_id}/complete, POST /specifications/{specification_id}/ratify"

  - priority: 44
    category: business_constraint
    check: "plugfest_credit_count >= the pinned Specification's min_plugfest_credits"
    error_id: ERR_INSUFFICIENT_PLUGFEST_CREDITS
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/conformance-decision (decision == APPROVE)"

  - priority: 45
    category: business_constraint
    check: "the freshly computed FINAL readiness score is >= FINAL_APPROVAL_THRESHOLD (65.00); a score of exactly 65.00 passes"
    error_id: ERR_READINESS_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/conformance-decision (decision == APPROVE)"
    note: >
      The FINAL score is computed before this check, but a refused request persists nothing: on
      ERR_READINESS_BELOW_THRESHOLD the submission's final_readiness_score is left exactly as it was
      (null on a first decision attempt) and its version is not bumped. The computed value is still
      observable through GET /submissions/{submission_id}/readiness?variant=FINAL, which never writes.

  - priority: 46
    category: business_constraint
    check: "revision_round < MAX_REVISION_ROUNDS (2)"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /submissions/{submission_id}/return-for-info"

  - priority: 47
    category: business_constraint
    check: "the laboratory has at least one COMPLETE TestSession inside the requested variant's counted set"
    error_id: ERR_NO_COMPLETED_SESSIONS
    http_status: 409
    applies_to: "POST /test-laboratories/{laboratory_id}/competency-review"

  - priority: 48
    category: business_temporal
    check: "the logical clock now is at or before the case's remediation_deadline_at"
    error_id: ERR_REMEDIATION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /noncompliance-cases/{case_id}/advance (disposition == CONFIRM_REMEDIATION)"

  # --- 49-50 capacity and money (lowest tier) ------------------------------
  - priority: 49
    category: business_constraint
    check: >
      reserved_bench_minutes + this session's reserved_minutes <= bench_capacity *
      MINUTES_PER_BENCH_PER_CYCLE (600). Landing exactly on the ceiling is allowed; one minute over is
      not.
    error_id: ERR_LAB_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /test-sessions"
    note: "PRIORITY PAIR B (lower half). Loses to ERR_BENCH_WINDOW_CONFLICT (priority 38)."

  - priority: 50
    category: business_fiscal
    check: "Member.credit_balance_cents >= CertificationSubmission.certification_fee_cents"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /submissions/{submission_id}/submit (from state DRAFT only)"
    note: "PRIORITY PAIR A (lower half). Loses to ERR_MEMBER_NOT_IN_GOOD_STANDING (priority 25)."

  # --- 51 collection-wide name uniqueness (last tier) ----------------------
  - priority: 51
    category: business_referential
    check: >
      an input-supplied scalar §1.1 declares unique across its whole collection does not repeat a value
      already stored: Specification.version_label, Member.legal_name and TestLaboratory.name. Comparison
      is exact and case-sensitive.
    error_id: ERR_DUPLICATE_NAME
    http_status: 409
    applies_to: "POST /specifications, POST /members, POST /test-laboratories"
    note: >
      Deliberately the lowest priority: every shape, enum, range and referential rule is evaluated
      first, so a request that is both malformed and a duplicate reports the malformation. The other
      uniqueness rules are scoped narrower and keep their own ids (ERR_DUPLICATE_FEATURE_CODE priority
      31, ERR_DUPLICATE_DAC_SERIAL priority 35, ERR_DUPLICATE_PARTICIPATION priority 40).

# ---------------------------------------------------------------------------
# 1.5 API Endpoints
#   Flat peer collections (api_prefix is empty). Every list endpoint accepts
#   `limit?` / `offset?` and returns the array in created_at ASC order.
#   Every FK declared in §1.1 is reverse-reachable through the filtered-list
#   form of its child collection.
#   ALL_ROLES below means: ProgramAdmin, Member, TestLaboratory,
#   ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer.
# ---------------------------------------------------------------------------
endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >
      Sets the server's logical clock to an arbitrary UTC instant. Every deadline, window, expiry and
      `now + N days` computation in this domain reads this clock and never the host wall clock. The
      server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the
      logical clock reads that instant, and it MUST NOT fall back to real wall-clock time.
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: [logical clock repositioned for all subsequent requests]

  # --- Specification --------------------------------------------------------
  - method: POST
    path: "/specifications"
    description: "Creates a specification version in DRAFT."
    roles: [ProgramAdmin]
    code: 201
    input: [version_label, security_baseline_level, effective_date, "sunset_date?", "supersedes_specification_id?", "min_plugfest_credits?"]
    output: Specification
    side_effects: [status set to DRAFT, feature_set_count set to 0]

  - method: GET
    path: "/specifications/{specification_id}"
    description: "Reads one specification version."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: []
    output: Specification
    side_effects: []

  - method: GET
    path: "/specifications"
    description: >
      Lists specification versions. `supersedes_specification_id` finds the versions that supersede a
      given version (reverse reachability for Specification.supersedes_specification_id).
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: ["status?", "security_baseline_level?", "supersedes_specification_id?", "limit?", "offset?"]
    output: Specification[]
    side_effects: []

  - method: POST
    path: "/specifications/{specification_id}/ratify"
    description: "DRAFT -> RATIFIED. Freezes the feature-set population."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Specification
    side_effects: [status RATIFIED, ratified_at stamped, POST /feature-sets refused for this specification from now on]

  - method: POST
    path: "/specifications/{specification_id}/deprecate"
    description: >
      Demotes the specification one step: RATIFIED -> DEPRECATED (driving the three-hop
      submission/plan/session cascade and the listing recertification fan-out) or
      DEPRECATED -> RETIRED.
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Specification
    side_effects: [cascade hop 1 submissions returned, hop 2 test plans voided, hop 3 sessions cancelled and lab minutes released, fan-out listings given a 180-day recertification due date]

  # --- FeatureSet -----------------------------------------------------------
  - method: POST
    path: "/feature-sets"
    description: "Adds a feature set to a DRAFT specification for one device type."
    roles: [ProgramAdmin]
    code: 201
    input: [specification_id, device_type, feature_code, obligation, test_case_count, "security_relevant?", "depends_on_feature_set_id?"]
    output: FeatureSet
    side_effects: [Specification.feature_set_count incremented, dependency edge validated for same specification, same device type and acyclicity]

  - method: GET
    path: "/feature-sets/{feature_set_id}"
    description: "Reads one feature set."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: []
    output: FeatureSet
    side_effects: []

  - method: GET
    path: "/feature-sets"
    description: >
      Lists feature sets. `specification_id` and `depends_on_feature_set_id` provide reverse
      reachability for both of FeatureSet's foreign keys.
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: ["specification_id?", "device_type?", "obligation?", "depends_on_feature_set_id?", "limit?", "offset?"]
    output: FeatureSet[]
    side_effects: []

  # --- Member ---------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Registers a program member in onboarding_state REGISTERED."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, contact_email, tier]
    output: Member
    side_effects: [onboarding_state REGISTERED, good_standing false, all credit counters zeroed]

  - method: GET
    path: "/members/{member_id}"
    description: "Reads one member, including the derived credit and standing fields."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: >
      Lists members. `ip_scope_specification_id` provides reverse reachability for
      Member.ip_scope_specification_id.
    roles: [ProgramAdmin, ComplianceOfficer]
    code: 200
    input: ["tier?", "onboarding_state?", "ip_scope_specification_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{member_id}/ip-commitment"
    description: "Executes the member's intellectual-property commitment against one specification version. REGISTERED -> IP_EXECUTED."
    roles: [Member]
    code: 200
    input: [ip_commitment_type, essential_patent_count, scope_specification_id]
    output: Member
    side_effects: [onboarding_state IP_EXECUTED, ip_executed_at stamped, ip_scope_specification_id pinned]

  - method: POST
    path: "/members/{member_id}/ip-commitment/withdraw"
    description: >
      Withdraws the IP commitment. Terminal for onboarding, and the head of the four-hop cascade
      good_standing -> listing suppression -> credential revocation -> auto-opened noncompliance case.
    roles: [Member]
    code: 200
    input: []
    output: Member
    side_effects: [onboarding_state IP_WITHDRAWN, good_standing false, published listings suppressed and put under investigation, issued attestation credentials revoked, one IP_WITHDRAWAL case auto-opened per affected listing]

  - method: POST
    path: "/members/{member_id}/tool-access"
    description: "Grants or revokes testing-tool access. Cyclic between TOOLS_GRANTED and TOOLS_REVOKED."
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: Member
    side_effects: [onboarding_state moved, good_standing recomputed]

  - method: POST
    path: "/members/{member_id}/credits"
    description: "Purchases certification credit for the member (the general admin/finance surface for funding a member account)."
    roles: [ProgramAdmin, Member]
    code: 200
    input: [amount_cents]
    output: Member
    side_effects: [credits_purchased_cents increased, credit_balance_cents recomputed]

  - method: GET
    path: "/members/{member_id}/credit-ledger"
    description: "Computed read of the member credit ledger. `variant` selects AVAILABLE (default) or COMMITTED."
    roles: [ProgramAdmin, Member, ComplianceOfficer]
    code: 200
    input: ["variant?"]
    output: "{ member_id: string, variant: string, credits_purchased_cents: integer, credits_consumed_cents: integer, escrowed_credit_cents: integer, balance_cents: integer }"
    side_effects: []

  # --- TestLaboratory -------------------------------------------------------
  - method: POST
    path: "/test-laboratories"
    description: "Registers a test laboratory in accreditation_status PROVISIONAL."
    roles: [ProgramAdmin]
    code: 201
    input: [name, bench_capacity, authorized_device_types, accreditation_expires_at]
    output: TestLaboratory
    side_effects: [accreditation_status PROVISIONAL, reserved_bench_minutes 0]

  - method: GET
    path: "/test-laboratories/{laboratory_id}"
    description: "Reads one laboratory."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: []
    output: TestLaboratory
    side_effects: []

  - method: GET
    path: "/test-laboratories"
    description: "Lists laboratories, optionally filtered by accreditation status or authorized device type."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: ["accreditation_status?", "device_type?", "limit?", "offset?"]
    output: TestLaboratory[]
    side_effects: []

  - method: POST
    path: "/test-laboratories/{laboratory_id}/accreditation-decision"
    description: "AUTHORIZE / SUSPEND / REINSTATE / REVOKE. REVOKE runs the two-hop session/plan cascade and the plugfest fan-out."
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: TestLaboratory
    side_effects: [accreditation_status moved, on REVOKE all live sessions cancelled and reserved_bench_minutes zeroed, orphaned in-execution plans voided, hosted plugfests cancelled and their registered participations marked NO_SHOW]

  - method: POST
    path: "/test-laboratories/{laboratory_id}/competency-review"
    description: "Runs a competency review under the requested variant, writing competency_score and possibly suspending the laboratory."
    roles: [ProgramAdmin]
    code: 200
    input: [variant]
    output: TestLaboratory
    side_effects: [competency_score, competency_variant and competency_reviewed_at written, AUTHORIZED -> SUSPENDED when the score is strictly below 70.00]

  - method: GET
    path: "/test-laboratories/{laboratory_id}/competency"
    description: "Computed read of the competency score without writing it. `variant` selects ROLLING_90D (default) or LIFETIME."
    roles: [ProgramAdmin, TestLaboratory, ComplianceOfficer]
    code: 200
    input: ["variant?"]
    output: "{ laboratory_id: string, variant: string, counted_session_count: integer, counted_line_count: integer, disputed_line_count: integer, on_time_ratio: string, dispute_free_ratio: string, competency_score: string }"
    side_effects: []

  # --- CertificationSubmission ---------------------------------------------
  - method: POST
    path: "/submissions"
    description: >
      Opens a certification submission in DRAFT and pins the specification version plus the
      certification fee. review_track defaults to STANDARD.
    roles: [Member]
    code: 201
    input: [member_id, specification_id, device_model, device_type, declared_feature_codes, declared_secure_boot, declared_firmware_update_capability, attestation_key_fingerprint, "review_track?"]
    output: CertificationSubmission
    side_effects: [specification_id pinned, certification_fee_cents computed and pinned by calculations.submission_certification_fee_cents, state DRAFT, all three review axes at their initial states]

  - method: GET
    path: "/submissions/{submission_id}"
    description: "Reads one submission, including both readiness scores and the attestation-credential fields."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: CertificationSubmission
    side_effects: []

  - method: GET
    path: "/submissions"
    description: >
      Lists submissions. `member_id` and `specification_id` provide reverse reachability for both of
      CertificationSubmission's foreign keys.
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer]
    code: 200
    input: ["member_id?", "specification_id?", "state?", "dac_state?", "device_type?", "limit?", "offset?"]
    output: CertificationSubmission[]
    side_effects: []

  - method: POST
    path: "/submissions/{submission_id}/submit"
    description: "DRAFT -> SUBMITTED (escrows the fee) or RETURNED_FOR_INFO -> SUBMITTED (no second escrow)."
    roles: [Member]
    code: 200
    input: []
    output: CertificationSubmission
    side_effects: [state SUBMITTED, submitted_at stamped, fee escrowed on the first submit only, conformance_review_state reset to PENDING on a resubmit]

  - method: POST
    path: "/submissions/{submission_id}/start-review"
    description: "SUBMITTED -> IN_REVIEW."
    roles: [ConformanceReviewer]
    code: 200
    input: []
    output: CertificationSubmission
    side_effects: [state IN_REVIEW, review_started_at stamped]

  - method: POST
    path: "/submissions/{submission_id}/return-for-info"
    description: "IN_REVIEW -> RETURNED_FOR_INFO, bounded by MAX_REVISION_ROUNDS."
    roles: [ConformanceReviewer]
    code: 200
    input: [reason]
    output: CertificationSubmission
    side_effects: [state RETURNED_FOR_INFO, conformance_review_state RETURNED, revision_round incremented, conformance_reviewer_user_id recorded]

  - method: POST
    path: "/submissions/{submission_id}/conformance-decision"
    description: >
      Records the declaration-of-conformity review. Computes and pins the FINAL readiness score BEFORE
      evaluating the approval threshold, so a rejected APPROVE still leaves the pre-decision score
      untouched (the write is rolled back with the request).
    roles: [ConformanceReviewer]
    code: 200
    input: [decision, "note?"]
    output: CertificationSubmission
    side_effects: [final_readiness_score pinned via calculations.certification_readiness_score variant FINAL, conformance_review_state APPROVED or REJECTED, conformance_reviewer_user_id recorded, REVIEW_COMPLETE bubble-up or REJECTED with escrow release]

  - method: POST
    path: "/submissions/{submission_id}/security-decision"
    description: >
      Records the device-attestation / secure-boot / firmware-update review. Segregation of duties:
      the X-User-ID that recorded the conformance decision may not record this one.
    roles: [SecurityReviewer]
    code: 200
    input: [decision, secure_boot_verified, verified_firmware_update_capability]
    output: CertificationSubmission
    side_effects: [secure_boot_verified and verified_firmware_update_capability written, security_review_state APPROVED or REJECTED, security_reviewer_user_id recorded, REVIEW_COMPLETE bubble-up or REJECTED with escrow release]

  - method: POST
    path: "/submissions/{submission_id}/issue-credential"
    description: "REVIEW_COMPLETE -> CERTIFIED and NOT_ISSUED -> ISSUED. Consumes the escrowed fee."
    roles: [ProgramAdmin]
    code: 200
    input: [dac_serial]
    output: CertificationSubmission
    side_effects: [state CERTIFIED, certified_at stamped, dac_state ISSUED with a globally unique dac_serial, escrow consumed into credits_consumed_cents]

  - method: POST
    path: "/submissions/{submission_id}/withdraw"
    description: "Withdraws a live submission, releasing any escrow and voiding its test plan and live sessions."
    roles: [Member]
    code: 200
    input: []
    output: CertificationSubmission
    side_effects: [state WITHDRAWN, escrow released back to credit_balance_cents, non-voided test plan voided, its live sessions cancelled and lab minutes released]

  - method: GET
    path: "/submissions/{submission_id}/readiness"
    description: >
      Computed read of the readiness score without writing it. `variant` selects PROVISIONAL (default)
      or FINAL, and exposes the component inputs so the divergence between the two is observable.
    roles: [ProgramAdmin, Member, ConformanceReviewer, SecurityReviewer]
    code: 200
    input: ["variant?"]
    output: "{ submission_id: string, variant: string, mandatory_case_count: integer, mandatory_passed_cases: integer, optional_case_count: integer, optional_passed_cases: integer, plugfest_credit_count: integer, counted_session_count: integer, late_session_count: integer, score: string }"
    side_effects: []

  # --- TestPlan -------------------------------------------------------------
  - method: POST
    path: "/test-plans"
    description: >
      Creates the test plan for a submission under review, resolving the feature-set closure and the
      three case counts. Supersedes any existing non-VOIDED plan of the same submission, which is why
      the write is guarded by expected_submission_version.
    roles: [ProgramAdmin]
    code: 201
    input: [submission_id, expected_submission_version]
    output: TestPlan
    side_effects: [specification_id and device_type copied from the submission, included_feature_set_ids and the three case counts computed by calculations.test_plan_case_counts, any prior non-VOIDED plan voided with reason SUPERSEDED_BY_NEW_PLAN and its live sessions cancelled, parent submission version bumped]

  - method: GET
    path: "/test-plans/{test_plan_id}"
    description: "Reads one test plan."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer]
    code: 200
    input: []
    output: TestPlan
    side_effects: []

  - method: GET
    path: "/test-plans"
    description: >
      Lists test plans. `submission_id` and `specification_id` provide reverse reachability for both of
      TestPlan's foreign keys.
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer]
    code: 200
    input: ["submission_id?", "specification_id?", "state?", "limit?", "offset?"]
    output: TestPlan[]
    side_effects: []

  - method: POST
    path: "/test-plans/{test_plan_id}/issue"
    description: "DRAFT -> ISSUED, releasing the plan to the laboratory network."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: TestPlan
    side_effects: [state ISSUED]

  # --- TestSession ----------------------------------------------------------
  - method: POST
    path: "/test-sessions"
    description: >
      Books a bench window at a laboratory for one test plan. Enforces bench occupancy with a mandatory
      60-minute changeover buffer, then the laboratory's capacity ceiling.
    roles: [ProgramAdmin, TestLaboratory]
    code: 201
    input: [test_plan_id, laboratory_id, bench_index, window_start, window_end, session_type]
    output: TestSession
    side_effects: [reserved_minutes computed from the window, TestLaboratory.reserved_bench_minutes incremented, state SCHEDULED]

  - method: GET
    path: "/test-sessions/{test_session_id}"
    description: "Reads one test session, including its result_lines array."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer]
    code: 200
    input: []
    output: TestSession
    side_effects: []

  - method: GET
    path: "/test-sessions"
    description: >
      Lists test sessions. `test_plan_id` and `laboratory_id` provide reverse reachability for both of
      TestSession's foreign keys.
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer]
    code: 200
    input: ["test_plan_id?", "laboratory_id?", "state?", "session_type?", "limit?", "offset?"]
    output: TestSession[]
    side_effects: []

  - method: POST
    path: "/test-sessions/{test_session_id}/start"
    description: "SCHEDULED -> IN_PROGRESS. Requires a currently AUTHORIZED, unexpired laboratory."
    roles: [TestLaboratory]
    code: 200
    input: []
    output: TestSession
    side_effects: [state IN_PROGRESS, started_at stamped, parent TestPlan ISSUED -> IN_EXECUTION]

  - method: POST
    path: "/test-sessions/{test_session_id}/results"
    description: >
      Appends result lines to an in-progress session. Each line names a feature set of the plan and
      carries an outcome of PASS, FAIL, BLOCKED or WAIVED plus an evidence hash. Refreshes the
      submission's PROVISIONAL readiness score.
    roles: [TestLaboratory]
    code: 200
    input: [result_lines]
    output: TestSession
    side_effects: [result_lines appended with recorded_at set to the logical clock, CertificationSubmission.provisional_readiness_score recomputed]

  - method: POST
    path: "/test-sessions/{test_session_id}/complete"
    description: "IN_PROGRESS -> COMPLETE. Releases the bench minutes and may bubble the plan up to COMPLETE."
    roles: [TestLaboratory]
    code: 200
    input: []
    output: TestSession
    side_effects: [state COMPLETE, completed_at stamped, completed_late recomputed against window_end, reserved_bench_minutes decremented, parent TestPlan IN_EXECUTION -> COMPLETE when coverage is satisfied]

  - method: POST
    path: "/test-sessions/{test_session_id}/cancel"
    description: "Cancels a live session, compensating the laboratory's reserved minutes exactly and freeing the bench window."
    roles: [ProgramAdmin, TestLaboratory]
    code: 200
    input: ["reason?"]
    output: TestSession
    side_effects: [state CANCELLED, reserved_bench_minutes decremented by exactly this session's reserved_minutes, the bench window becomes bookable again]

  - method: POST
    path: "/test-sessions/{test_session_id}/dispute-line"
    description: >
      Flags one already-recorded result line as disputed by its zero-based index in result_lines. Feeds
      the laboratory competency score's dispute-free component.
    roles: [ProgramAdmin, ConformanceReviewer]
    code: 200
    input: [line_index]
    output: TestSession
    side_effects: [disputed_line_count incremented, laboratory competency reads change on the next review]

  # --- Plugfest -------------------------------------------------------------
  - method: POST
    path: "/plugfests"
    description: "Schedules a multi-vendor interoperability plugfest hosted by a laboratory against one specification version."
    roles: [ProgramAdmin]
    code: 201
    input: [host_laboratory_id, specification_id, window_start, window_end, registration_deadline, min_distinct_vendors]
    output: Plugfest
    side_effects: [state REGISTRATION_OPEN, distinct_vendor_count 0]

  - method: GET
    path: "/plugfests/{plugfest_id}"
    description: "Reads one plugfest."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: []
    output: Plugfest
    side_effects: []

  - method: GET
    path: "/plugfests"
    description: >
      Lists plugfests. `host_laboratory_id` and `specification_id` provide reverse reachability for both
      of Plugfest's foreign keys.
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: ["host_laboratory_id?", "specification_id?", "state?", "limit?", "offset?"]
    output: Plugfest[]
    side_effects: []

  - method: POST
    path: "/plugfests/{plugfest_id}/lock"
    description: "REGISTRATION_OPEN -> LOCKED once enough distinct vendors have registered."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Plugfest
    side_effects: [state LOCKED, locked_at stamped, further registrations refused]

  - method: POST
    path: "/plugfests/{plugfest_id}/close"
    description: "LOCKED -> CLOSED. Every still-REGISTERED participation becomes NO_SHOW."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Plugfest
    side_effects: [state CLOSED, registered participations marked NO_SHOW, distinct_vendor_count recomputed and therefore falls]

  - method: POST
    path: "/plugfest-participations"
    description: >
      Registers one of the member's devices (a submission) into a plugfest. Rejects a second
      registration whose plugfest shares any UTC calendar date with an existing registration of the same
      submission.
    roles: [Member]
    code: 201
    input: [plugfest_id, member_id, submission_id, device_model]
    output: PlugfestParticipation
    side_effects: [state REGISTERED, Plugfest.distinct_vendor_count recomputed]

  - method: GET
    path: "/plugfest-participations/{participation_id}"
    description: "Reads one plugfest participation."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: PlugfestParticipation
    side_effects: []

  - method: GET
    path: "/plugfest-participations"
    description: >
      Lists plugfest participations. `plugfest_id`, `member_id` and `submission_id` provide reverse
      reachability for all three of PlugfestParticipation's foreign keys.
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer]
    code: 200
    input: ["plugfest_id?", "member_id?", "submission_id?", "state?", "limit?", "offset?"]
    output: PlugfestParticipation[]
    side_effects: []

  - method: POST
    path: "/plugfest-participations/{participation_id}/record-outcome"
    description: "The hosting laboratory records PASS or FAIL. A PASS grants the submission one plugfest credit."
    roles: [TestLaboratory]
    code: 200
    input: [outcome, interop_pass_count]
    output: PlugfestParticipation
    side_effects: [state PASSED or FAILED, outcome_recorded_at stamped, on PASS CertificationSubmission.plugfest_credit_count incremented and provisional_readiness_score recomputed]

  # --- CertificationListing -------------------------------------------------
  - method: POST
    path: "/listings"
    description: >
      Creates the consumer-visible listing for a submission that has cleared both review axes -
      state IN {REVIEW_COMPLETE, CERTIFIED} - in publication_status UNPUBLISHED. A listing may
      therefore exist before the device attestation credential is issued; publication is what
      requires dac_state == ISSUED.
    roles: [ProgramAdmin]
    code: 201
    input: [submission_id]
    output: CertificationListing
    side_effects: [member_id copied from the submission, listing_reference assigned as LST- plus a zero-padded six-digit creation ordinal, declared_features resolved from the submission's non-VOIDED test plan, publication_status UNPUBLISHED, compliance_status COMPLIANT]

  - method: GET
    path: "/listings/{listing_id}"
    description: "Reads one certification listing."
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: []
    output: CertificationListing
    side_effects: []

  - method: GET
    path: "/listings"
    description: >
      The consumer-visible directory. `submission_id` and `member_id` provide reverse reachability for
      both of CertificationListing's foreign keys.
    roles: [ProgramAdmin, Member, TestLaboratory, ConformanceReviewer, SecurityReviewer, ComplianceOfficer, PublicViewer]
    code: 200
    input: ["submission_id?", "member_id?", "publication_status?", "compliance_status?", "limit?", "offset?"]
    output: CertificationListing[]
    side_effects: []

  - method: POST
    path: "/listings/{listing_id}/publish"
    description: "Publishes or re-publishes the listing for consumer visibility. Requires an issued attestation credential and a member in good standing."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CertificationListing
    side_effects: [publication_status PUBLISHED, published_at stamped, declared_features refreshed from the submission's non-VOIDED test plan]

  - method: POST
    path: "/listings/{listing_id}/withdraw"
    description: "Withdraws the listing from the directory and revokes the device attestation credential. Terminal on the publication axis."
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: CertificationListing
    side_effects: [publication_status WITHDRAWN, compliance_status NONCOMPLIANT, the submission's issued dac_state REVOKED]

  - method: POST
    path: "/listings/{listing_id}/firmware-revisions"
    description: >
      Reports a firmware revision of the listed device and classifies the recertification trigger as
      NONE, DELTA or FULL. Guarded by expected_listing_version because each report supersedes the
      previous classification.
    roles: [ProgramAdmin, Member]
    code: 200
    input: [firmware_version, changed_feature_codes, security_change, expected_listing_version]
    output: CertificationListing
    side_effects: [latest_firmware_version and firmware_revision_count updated, recert_classification / recert_trigger_reason / recertification_due_at set by calculations.recertification_classification, on FULL the listing is suppressed and the submission's issued credential revoked]

  # --- NoncomplianceCase ----------------------------------------------------
  - method: POST
    path: "/noncompliance-cases"
    description: "Opens a noncompliance investigation against a listing and prices the assessment. Puts the listing under investigation."
    roles: [ComplianceOfficer]
    code: 201
    input: [listing_id, category, evidence_summary, claimed_impact_units]
    output: NoncomplianceCase
    side_effects: [state OPEN, opened_by_user_id recorded from X-User-ID, penalty fields computed by calculations.noncompliance_penalty_assessment, listing compliance_status UNDER_INVESTIGATION, Member.open_case_count recomputed]

  - method: GET
    path: "/noncompliance-cases/{case_id}"
    description: "Reads one noncompliance case."
    roles: [ProgramAdmin, ComplianceOfficer, Member]
    code: 200
    input: []
    output: NoncomplianceCase
    side_effects: []

  - method: GET
    path: "/noncompliance-cases"
    description: "Lists noncompliance cases. `listing_id` provides reverse reachability for NoncomplianceCase.listing_id."
    roles: [ProgramAdmin, ComplianceOfficer, Member]
    code: 200
    input: ["listing_id?", "state?", "category?", "auto_opened?", "limit?", "offset?"]
    output: NoncomplianceCase[]
    side_effects: []

  - method: POST
    path: "/noncompliance-cases/{case_id}/advance"
    description: >
      Advances the investigation: ESCALATE, ORDER_REMEDIATION (requires remediation_days),
      ORDER_WITHDRAWAL or CONFIRM_REMEDIATION.
    roles: [ComplianceOfficer]
    code: 200
    input: [disposition, "remediation_days?"]
    output: NoncomplianceCase
    side_effects: [case state moved, remediation_deadline_at set on ORDER_REMEDIATION with the listing suppressed, listing withdrawn and credential revoked on ORDER_WITHDRAWAL, listing compliance_status REMEDIATED on CONFIRM_REMEDIATION]

  - method: POST
    path: "/noncompliance-cases/{case_id}/close"
    description: "Closes a resolved case. Segregation of duties: the X-User-ID that opened the case may not close it."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: NoncomplianceCase
    side_effects: [state CLOSED, closed_by_user_id recorded, Member.open_case_count recomputed]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization --------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint, or a Member / TestLaboratory actor is not the owner of the addressed resource"

  # --- existence -----------------------------------------------------------
  - id: ERR_SPECIFICATION_NOT_FOUND
    http: 404
    condition: "no Specification with the given id (path segment or body reference)"
  - id: ERR_FEATURE_SET_NOT_FOUND
    http: 404
    condition: "no FeatureSet with the given id, including a depends_on_feature_set_id that resolves to nothing"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "no Member with the given id"
  - id: ERR_LABORATORY_NOT_FOUND
    http: 404
    condition: "no TestLaboratory with the given id"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "no CertificationSubmission with the given id"
  - id: ERR_TEST_PLAN_NOT_FOUND
    http: 404
    condition: "no TestPlan with the given id"
  - id: ERR_TEST_SESSION_NOT_FOUND
    http: 404
    condition: "no TestSession with the given id"
  - id: ERR_PLUGFEST_NOT_FOUND
    http: 404
    condition: "no Plugfest with the given id"
  - id: ERR_PARTICIPATION_NOT_FOUND
    http: 404
    condition: "no PlugfestParticipation with the given id"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "no CertificationListing with the given id"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "no NoncomplianceCase with the given id"

  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, or a supplied field has the wrong JSON type, or a numeric field is outside its declared range (bench_capacity, test_case_count, min_distinct_vendors, interop_pass_count, claimed_impact_units, line_index, limit, offset)"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum-typed input carries a value outside that field's declared set"
  - id: ERR_INVALID_WINDOW_BOUNDS
    http: 422
    condition: "window_end is not strictly after window_start, or either bound is not exactly on a minute boundary"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "sunset_date is not after effective_date; registration_deadline is after window_start; remediation_days is outside 1..365"
  - id: ERR_CREDIT_AMOUNT_OUT_OF_RANGE
    http: 422
    condition: "amount_cents is below CREDIT_PURCHASE_MIN_CENTS or above CREDIT_PURCHASE_MAX_CENTS"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_SUBMISSION_VERSION
    http: 412
    condition: "expected_submission_version does not equal the parent CertificationSubmission's current version at POST /test-plans"
  - id: ERR_STALE_LISTING_VERSION
    http: 412
    condition: "expected_listing_version does not equal the target CertificationListing's current version at POST /listings/{listing_id}/firmware-revisions"

  # --- state preconditions -------------------------------------------------
  - id: ERR_INVALID_SPECIFICATION_STATE
    http: 409
    condition: "the Specification's status does not permit the operation (adding a feature set to a non-DRAFT version, ratifying a non-DRAFT version, deprecating a DRAFT or RETIRED version, retiring a version that still has live submissions, submitting against a non-RATIFIED version, executing an IP commitment against a DRAFT version)"
  - id: ERR_INVALID_MEMBER_STATE
    http: 409
    condition: "the Member's onboarding_state does not permit the operation (a second IP commitment, granting tools before the commitment, revoking tools that were never granted, withdrawing an already withdrawn commitment)"
  - id: ERR_INVALID_LABORATORY_STATE
    http: 409
    condition: "the TestLaboratory's accreditation_status does not permit the operation (authorizing a non-PROVISIONAL lab, suspending a non-AUTHORIZED lab, reinstating a non-SUSPENDED lab, any operation on a REVOKED lab, booking or starting a session at a lab that is not AUTHORIZED)"
  - id: ERR_INVALID_SUBMISSION_STATE
    http: 409
    condition: "the CertificationSubmission's state does not permit the operation, per the §1.2 transition table; also raised when a listing is created for a submission that has not cleared review, or published while the linked submission's dac_state is NOT_ISSUED or REVOKED"
  - id: ERR_REVIEW_ALREADY_DECIDED
    http: 409
    condition: "a conformance or security decision has already been recorded on this submission, or return-for-info is attempted after the conformance axis left PENDING"
  - id: ERR_INVALID_TEST_PLAN_STATE
    http: 409
    condition: "the TestPlan's state does not permit the operation (issuing a non-DRAFT plan, booking a session against a VOIDED plan, starting a session whose plan is not ISSUED or IN_EXECUTION)"
  - id: ERR_INVALID_SESSION_STATE
    http: 409
    condition: "the TestSession's state does not permit the operation (starting a non-SCHEDULED session, recording results on a session that is not IN_PROGRESS, completing a non-IN_PROGRESS session, cancelling a terminal session, disputing a line on a SCHEDULED or CANCELLED session)"
  - id: ERR_INVALID_PLUGFEST_STATE
    http: 409
    condition: "the Plugfest's state does not permit the operation (registering after the event is LOCKED, CLOSED or CANCELLED; locking a non-REGISTRATION_OPEN event; closing a non-LOCKED event; recording an outcome while the event is not LOCKED)"
  - id: ERR_INVALID_PARTICIPATION_STATE
    http: 409
    condition: "the PlugfestParticipation has already left REGISTERED"
  - id: ERR_INVALID_LISTING_STATE
    http: 409
    condition: "the CertificationListing's publication_status or compliance_status does not permit the operation (publishing an already PUBLISHED or WITHDRAWN listing, publishing while UNDER_INVESTIGATION or NONCOMPLIANT, withdrawing an already WITHDRAWN listing, reporting a firmware revision on a WITHDRAWN listing, opening a case on a listing already UNDER_INVESTIGATION)"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "the NoncomplianceCase's state does not permit the requested disposition, or a close is attempted from a state other than REMEDIATED or WITHDRAWAL_ORDERED"

  # --- compliance / security ----------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID equals conformance_reviewer_user_id on a security decision, or equals opened_by_user_id on a case close"
  - id: ERR_MEMBER_NOT_IN_GOOD_STANDING
    http: 409
    condition: "the Member's good_standing is false at submit, plugfest registration or listing publication"
  - id: ERR_IP_COMMITMENT_REQUIRED
    http: 409
    condition: "the Member's ip_scope_specification_id does not equal the submission's pinned specification_id"
  - id: ERR_SECURITY_BASELINE_NOT_MET
    http: 422
    condition: "the pinned Specification's security_baseline_level is SB2 or SB3 but the declared (or verified) secure boot / firmware-update capability does not meet the baseline"
  - id: ERR_SECURE_BOOT_NOT_VERIFIED
    http: 422
    condition: "a security APPROVE carries secure_boot_verified == false, or credential issuance is attempted with secure_boot_verified false or verified_firmware_update_capability == NONE"
  - id: ERR_ACCREDITATION_EXPIRED
    http: 409
    condition: "the laboratory's accreditation_expires_at is at or before the logical clock now"
  - id: ERR_DEVICE_TYPE_NOT_AUTHORIZED
    http: 422
    condition: "the laboratory's authorized_device_types does not contain the test plan's device_type"

  # --- constraint satisfaction --------------------------------------------
  - id: ERR_DUPLICATE_NAME
    http: 409
    condition: "a collection-wide unique scalar repeats a stored value: Specification.version_label, Member.legal_name or TestLaboratory.name"
  - id: ERR_DUPLICATE_FEATURE_CODE
    http: 409
    condition: "feature_code already exists within the same (specification_id, device_type)"
  - id: ERR_FEATURE_DEPENDENCY_CYCLE
    http: 422
    condition: "depends_on_feature_set_id points at another specification or device type, or the new edge would close a cycle in the dependency graph"
  - id: ERR_UNKNOWN_FEATURE_CODE
    http: 422
    condition: "a declared_feature_codes or changed_feature_codes entry matches no FeatureSet of the pinned specification and device type"
  - id: ERR_DEVICE_TYPE_MISMATCH
    http: 422
    condition: "a session's laboratory / plan device types disagree, a participation's submission is pinned to a different specification than the plugfest, or an operator supplies category IP_WITHDRAWAL on POST /noncompliance-cases"
  - id: ERR_DUPLICATE_DAC_SERIAL
    http: 409
    condition: "the dac_serial supplied at credential issuance is already held by another CertificationSubmission"
  - id: ERR_LISTING_ALREADY_EXISTS
    http: 409
    condition: "the submission already has a CertificationListing"
  - id: ERR_UNKNOWN_RESULT_FEATURE_SET
    http: 422
    condition: "a result line's feature_set_id is not in the enclosing session's TestPlan.included_feature_set_ids, or line_index addresses no existing result_lines entry"
  - id: ERR_BENCH_WINDOW_CONFLICT
    http: 409
    condition: "the requested bench window, extended by the 60-minute changeover buffer, overlaps a live session on the same (laboratory_id, bench_index)"
  - id: ERR_PARTICIPATION_WINDOW_CONFLICT
    http: 409
    condition: "the requested plugfest shares at least one UTC calendar date with another live plugfest the same submission is already registered for"
  - id: ERR_DUPLICATE_PARTICIPATION
    http: 409
    condition: "the (plugfest_id, submission_id) pair is already registered"
  - id: ERR_REGISTRATION_CLOSED
    http: 409
    condition: "the logical clock now is past the plugfest's registration_deadline"
  - id: ERR_INSUFFICIENT_DISTINCT_VENDORS
    http: 409
    condition: "distinct_vendor_count is below min_distinct_vendors at lock time"
  - id: ERR_MANDATORY_COVERAGE_INCOMPLETE
    http: 409
    condition: "the submission has no non-VOIDED TestPlan, its plan is not COMPLETE, a mandatory or conditional feature set has no result line, an issue is attempted on a plan with required_case_count == 0, a session with an empty result_lines is completed, or a ratify is attempted on a specification with no feature sets or with a device type that has no MANDATORY feature set"
  - id: ERR_INSUFFICIENT_PLUGFEST_CREDITS
    http: 409
    condition: "plugfest_credit_count is below the pinned Specification's min_plugfest_credits at conformance APPROVE"
  - id: ERR_READINESS_BELOW_THRESHOLD
    http: 409
    condition: "the freshly pinned FINAL readiness score is strictly below FINAL_APPROVAL_THRESHOLD at conformance APPROVE"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "revision_round has already reached MAX_REVISION_ROUNDS at return-for-info"
  - id: ERR_NO_COMPLETED_SESSIONS
    http: 409
    condition: "the requested competency variant's counted set contains no COMPLETE session"
  - id: ERR_REMEDIATION_DEADLINE_PASSED
    http: 409
    condition: "CONFIRM_REMEDIATION is attempted after remediation_deadline_at"

  # --- capacity and money -------------------------------------------------
  - id: ERR_LAB_CAPACITY_EXCEEDED
    http: 409
    condition: "reserved_bench_minutes plus the requested session's minutes would exceed bench_capacity * 600"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 402
    condition: "Member.credit_balance_cents is below the submission's pinned certification_fee_cents at the first submit"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "Certification program operator: owns specification versioning, laboratory accreditation, test-plan issuance, plugfest scheduling, credential issuance and listing publication."
    identity: "opaque"
    exclusive_operations:
      - "POST /specifications, POST /specifications/{specification_id}/ratify, POST /specifications/{specification_id}/deprecate"
      - "POST /feature-sets"
      - "POST /members"
      - "POST /members/{member_id}/tool-access"
      - "POST /test-laboratories, POST /test-laboratories/{laboratory_id}/accreditation-decision, POST /test-laboratories/{laboratory_id}/competency-review"
      - "POST /test-plans, POST /test-plans/{test_plan_id}/issue"
      - "POST /plugfests, POST /plugfests/{plugfest_id}/lock, POST /plugfests/{plugfest_id}/close"
      - "POST /listings, POST /listings/{listing_id}/publish"
      - "POST /submissions/{submission_id}/issue-credential"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /members/{member_id}/credits (with Member)"
      - "POST /test-sessions, POST /test-sessions/{test_session_id}/cancel (with TestLaboratory)"
      - "POST /test-sessions/{test_session_id}/dispute-line (with ConformanceReviewer)"
      - "POST /listings/{listing_id}/firmware-revisions (with Member)"
      - "all GET reads"

  - name: Member
    description: "Device vendor participating in the program. X-User-ID is the Member row's id, so ownership of submissions, participations, listings and firmware reports is checked by comparing X-User-ID to the resource's member_id."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{member_id}/ip-commitment"
      - "POST /members/{member_id}/ip-commitment/withdraw"
      - "POST /submissions"
      - "POST /submissions/{submission_id}/submit"
      - "POST /submissions/{submission_id}/withdraw"
      - "POST /plugfest-participations"
    shared_operations:
      - "POST /members/{member_id}/credits (with ProgramAdmin)"
      - "POST /listings/{listing_id}/firmware-revisions (with ProgramAdmin)"
      - "GET reads of own members, submissions, test plans, sessions, participations, listings and cases"

  - name: TestLaboratory
    description: "Authorized test laboratory. X-User-ID is the TestLaboratory row's id, so session ownership is checked against TestSession.laboratory_id and plugfest hosting against Plugfest.host_laboratory_id."
    identity: "entity_backed:TestLaboratory"
    exclusive_operations:
      - "POST /test-sessions/{test_session_id}/start"
      - "POST /test-sessions/{test_session_id}/results"
      - "POST /test-sessions/{test_session_id}/complete"
      - "POST /plugfest-participations/{participation_id}/record-outcome"
    shared_operations:
      - "POST /test-sessions, POST /test-sessions/{test_session_id}/cancel (with ProgramAdmin)"
      - "GET reads of specifications, feature sets, laboratories, submissions, plans, sessions, plugfests and participations"

  - name: ConformanceReviewer
    description: "Reviews the declaration of conformity. Approval chain step 1 of 2 for a submission; the X-User-ID recorded here is locked out of the security decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /submissions/{submission_id}/start-review"
      - "POST /submissions/{submission_id}/return-for-info"
      - "POST /submissions/{submission_id}/conformance-decision"
    shared_operations:
      - "POST /test-sessions/{test_session_id}/dispute-line (with ProgramAdmin)"
      - "GET reads of specifications, feature sets, members, submissions, plans, sessions, plugfests and listings"

  - name: SecurityReviewer
    description: "Reviews device attestation, secure boot and firmware-update capability. Approval chain step 2 of 2, and the segregation-of-duties counterpart of ConformanceReviewer."
    identity: "opaque"
    exclusive_operations:
      - "POST /submissions/{submission_id}/security-decision"
    shared_operations:
      - "GET reads of specifications, feature sets, members, submissions, plans, sessions, plugfests and listings"

  - name: ComplianceOfficer
    description: "Runs noncompliance investigations and listing withdrawal. Cannot review or certify, and cannot close a case they opened themselves."
    identity: "opaque"
    exclusive_operations:
      - "POST /noncompliance-cases"
      - "POST /noncompliance-cases/{case_id}/advance"
      - "POST /noncompliance-cases/{case_id}/close"
      - "POST /listings/{listing_id}/withdraw"
    shared_operations:
      - "GET reads of members, credit ledgers, laboratory competency, submissions, plugfests, listings and cases"

  - name: PublicViewer
    description: "Unauthenticated-equivalent consumer role for the certification directory. Read-only, and restricted to the consumer-facing surface: specifications, feature sets, laboratories, plugfests and listings."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /specifications, GET /specifications/{specification_id}"
      - "GET /feature-sets, GET /feature-sets/{feature_set_id}"
      - "GET /test-laboratories, GET /test-laboratories/{laboratory_id}"
      - "GET /plugfests, GET /plugfests/{plugfest_id}"
      - "GET /listings, GET /listings/{listing_id}"
