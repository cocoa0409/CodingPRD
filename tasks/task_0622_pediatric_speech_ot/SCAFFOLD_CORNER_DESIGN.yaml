        claim_type: cascading_side_effects
        grounds: [state_machines.PlanOfCare.ACTIVE_to_ON_HOLD, state_machines.Appointment.SCHEDULED_to_CANCELLED, entities.Authorization.fields.reserved_visits]
        distinguishing_aspect: "Holding an ACTIVE plan cancels its SCHEDULED appointment, releasing the reserved visit (reserved 1 -> 0) and freeing the therapist caseload slot."
        test_recipe:
          setup: ["ACTIVE plan with one SCHEDULED appointment (reserved 1). Therapist caseload 1 after activation."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
