              as: FleetPlanner
              captures: { seed_r: $.data.id }
            - call: "POST /pallet-ops/routes/${seed_r}/stops"
              payload: { stop_sequence: 1, stop_type: "DELIVERY", order_id: "${seed_o}" }
              as: FleetPlanner
              captures: { seed_s: $.data.id }
            - call: "GET /pallet-ops/routes/${seed_r}"
              payload: {}
              as: FleetPlanner
              captures: { seed_rv: $.data.version }
            - call: "POST /pallet-ops/routes/${seed_r}/dispatch"
              payload: { expected_route_version: "${seed_rv}" }
