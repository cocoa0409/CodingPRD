  - name: closing_notice_issue_then_withdraw_conserves_committed_budget
    grounds:
    - §1.2 ClosingNotice ISSUED -> WITHDRAWN
    - §1.2 Production.operating_status CLOSING_NOTICE -> RUNNING (cycle)
    - §1.1 Production.budget_committed_cents; BudgetLine.status
