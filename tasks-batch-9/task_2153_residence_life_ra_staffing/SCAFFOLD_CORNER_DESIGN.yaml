        distinguishing_aspect: "Student identity is entity_backed:Student, so submitting an application whose applicant_student_id differs from X-User-ID returns HTTP 403 ERR_NOT_RESOURCE_OWNER while the owner's own submit succeeds."
        test_recipe:
          setup:
