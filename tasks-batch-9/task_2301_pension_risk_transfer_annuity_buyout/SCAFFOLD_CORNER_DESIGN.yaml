              as_user_id: "fiduciary-01"
              captures: { q2_id: $.data.id, q2_state: $.data.quote_status }
            - call: "GET /prt/quotes"
              payload: { tranche_id: "${tranche_id}" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
          assert:
            - "the first request returns 201 with quote_status == REQUESTED"
            - "the immediate repeat returns 409 ERR_DUPLICATE_QUOTE_REQUEST — the insurer holds a non-terminal quote"
            - "the request naming an unregistered insurer returns 404 ERR_INSURER_NOT_FOUND"
            - "after the DECLINE the first quote is DECLINED (terminal) and the repeat request now returns 201 with a new id ${q2_id} != ${q1_id} in REQUESTED"
            - "GET /prt/quotes?tranche_id=${tranche_id} returns total_count == 2 — the declined quote is retained, not overwritten"

