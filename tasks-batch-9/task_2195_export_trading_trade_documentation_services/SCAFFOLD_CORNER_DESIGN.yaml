              as_user_id: "${buyer_b}"
              payload: { buyer_reference: "BR-INTRUDER-0001" }
              captures: { err_foreign_waiver: "$.data.error_id" }
            - call: "POST /dispute-cases"
              as: ForeignBuyer
              as_user_id: "${buyer_b}"
              payload: { export_order_id: "${order_a}", dispute_type: "QUALITY", claimed_amount_usd: 1000.00 }
              captures: { err_foreign_dispute: "$.data.error_id" }
            - call: "GET /export-orders"
              as: ForeignBuyer
              as_user_id: "${buyer_b}"
              payload: { limit: 20, offset: 0 }
              captures: { own_order: "$.data[0].id" }
            - call: "POST /discrepancy-findings/${finding_a}/waiver"
              as: ForeignBuyer
