          assert:
            - "Fair.${fair_id}.publisher_remittance_cents == 300000"
            - "ProfitSharePayout.${payout_id}.net_revenue_cents == 200000"
            - "ProfitSharePayout.${payout_id}.share_cents == 40000  (0.20 * 200000; tier-2 term max(0, min(200000,600000)-200000) == 0)"
            - "ProfitSharePayout.${payout_id}.cash_amount_cents == 40000"
            - "ProfitSharePayout.${payout_id}.scrip_amount_cents == 46000"

      - name: remittance_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.publisher_remittance
          - entities.Reconciliation.fields.remittance_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round_half_up PER LINE then sum.
          Three lines of qty=1 at list 999 with discount 0.45: pinned order gives
          3 * round_half_up(549.45) = 1647; the prohibited sum-then-round order gives
          round_half_up(1648.35) = 1648. The assert pins 1647.
        test_recipe:
          setup:
            - "Fair through RECONCILING, three FRONTLIST lines (list 999 each, discount 0.45, delivered 5 each), one TENDERED sale with one copy of each line (total 2997)"
            - "Reconciliation zero variance (counted 4 per line == expected 5-1)"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.45, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /stock-lines", payload: { fair_id: "${fair_id}", agreement_id: "${agr_id}", isbn: "9780000000001", title: "Alpha", list_price_cents: 999, line_type: FRONTLIST, qty_committed: 5 }, as: Organizer, captures: { line_a: "$.data.id" } }
            - { call: "POST /stock-lines", payload: { fair_id: "${fair_id}", agreement_id: "${agr_id}", isbn: "9780000000002", title: "Beta", list_price_cents: 999, line_type: FRONTLIST, qty_committed: 5 }, as: Organizer, captures: { line_b: "$.data.id" } }
            - { call: "POST /stock-lines", payload: { fair_id: "${fair_id}", agreement_id: "${agr_id}", isbn: "9780000000003", title: "Gamma", list_price_cents: 999, line_type: FRONTLIST, qty_committed: 5 }, as: Organizer, captures: { line_c: "$.data.id" } }
            - { call: "POST /stock-lines/${line_a}/commit", payload: {}, as: Organizer }
            - { call: "POST /stock-lines/${line_b}/commit", payload: {}, as: Organizer }
            - { call: "POST /stock-lines/${line_c}/commit", payload: {}, as: Organizer }
            - { call: "POST /stock-lines/${line_a}/deliver", payload: { qty_delivered: 5 }, as: Organizer }
            - { call: "POST /stock-lines/${line_b}/deliver", payload: { qty_delivered: 5 }, as: Organizer }
            - { call: "POST /stock-lines/${line_c}/deliver", payload: { qty_delivered: 5 }, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /sales", payload: { fair_id: "${fair_id}", lines: [{ stock_line_id: "${line_a}", qty: 1 }, { stock_line_id: "${line_b}", qty: 1 }, { stock_line_id: "${line_c}", qty: 1 }] }, as: Cashier, captures: { sale_id: "$.data.id" } }
            - { call: "POST /sales/${sale_id}/tender", payload: { tendered_amount_cents: 2997 }, as: Cashier }
            - { call: "POST /fairs/${fair_id}/close-sales", payload: {}, as: Organizer, as_user_id: "org_lead_1" }
            - { call: "GET /reconciliations", payload: { fair_id: "${fair_id}" }, as: Organizer, captures: { recon_id: "$.data[0].id", recon_v: "$.data[0].version" } }
            - { call: "POST /reconciliations/${recon_id}/counts", payload: { lines: [{ stock_line_id: "${line_a}", qty_on_hand: 4 }, { stock_line_id: "${line_b}", qty_on_hand: 4 }, { stock_line_id: "${line_c}", qty_on_hand: 4 }], expected_reconciliation_version: "${recon_v}" }, as: Organizer }
