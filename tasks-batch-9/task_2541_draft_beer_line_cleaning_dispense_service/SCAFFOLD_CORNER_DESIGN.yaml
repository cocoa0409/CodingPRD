        grounds:
          - errors.ERR_LOT_RELEASE_BLOCKED
          - validations[54].ERR_LOT_RELEASE_BLOCKED
          - state_machines.ChemicalLot.DEPLETED_to_QUARANTINED
          - state_machines.ChemicalLot.QUARANTINED_to_AVAILABLE
        distinguishing_aspect: |
          A 0.35 L lot drops to 0.040 L after one cycle and auto-DEPLETES; the
          auditor may still quarantine it, but the release is refused with
          ERR_LOT_RELEASE_BLOCKED (409) until the cycle is voided — and because
          the revive cascade only fires from DEPLETED, the refilled lot is still
          QUARANTINED and needs the explicit release.
