              as: Archivist
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Procurement department transfer list", transfer_instrument_reference: "IT-2026-050" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
            - call: "POST /requesters"
              payload: { display_name: "Marcus Vale", requester_class: "EXTERNAL_RESEARCHER", affiliation: "University of Leeds", nda_on_file: true }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { req_user_id: $.data.id }
            - call: "POST /access-requests"
              payload: { requester_id: "${req_user_id}", record_series_id: "${series_id}", purpose: "Supply chain history study", requested_item_ids: ["${item_id}"] }
              as: Requester
              as_user_id: "${req_user_id}"
              captures: { ar_id: $.data.id }
            - call: "POST /access-requests/${ar_id}/begin-screening"
              payload: {}
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { ar_v: $.data.version }
            - call: "POST /confidentiality-screenings"
              payload: { access_request_id: "${ar_id}", expected_access_request_version: "${ar_v}" }
              as: AccessServicesOfficer
