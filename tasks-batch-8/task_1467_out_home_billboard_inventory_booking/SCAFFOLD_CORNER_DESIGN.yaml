            - { call: "POST /api/faces", payload: { face_code: "F-2B", structure_code: "ST-2B", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { fb: $.data.id } }
