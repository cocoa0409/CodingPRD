              payload: { drone_id: "${drone_id}", work_type: "INSPECTION", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T12:00:00Z", expected_drone_version: "${drone_v1}", notes: "stale" }
              as: MaintenanceTech
              as_user_id: "mt-1"
            - call: "GET /drones/${drone_id}"
              payload: {}
              as: MaintenanceTech
              as_user_id: "mt-1"
              captures: { drone_v2: $.data.version }
            - call: "POST /maintenance-logs"
              payload: { drone_id: "${drone_id}", work_type: "INSPECTION", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T12:00:00Z", expected_drone_version: "${drone_v2}", notes: "fresh" }
