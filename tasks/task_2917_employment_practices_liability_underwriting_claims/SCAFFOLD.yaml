scenario: |
  2917. Employment Practices Liability Underwriting & Claims (employment practices liability
  insurer): exposure assessment from headcount, turnover, jurisdictions and human resources
  practices, coverage for wrongful termination, discrimination, harassment and retaliation with
  wage-and-hour sublimits, third-party coverage for customer and vendor claims, defense panel
  selection and hourly rate schedules with litigation guidelines, administrative charge
  notification and pre-suit resolution incentives, retention application per claim and
  related-claims aggregation, risk management services including hotline and policy review
  credits, class action and mass claim aggregation handling

domain_name: employment-practices-liability-underwriting-claims
api_prefix: "/epli"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # graph: Claim is self-referential (related_to_claim_id) and participates in a
  # RelatedClaimGroup that itself points back at two different Claim roles
  # (lead_claim_id, retention_basis_claim_id). Policy/Claim/DefenseAssignment/
  # DefenseInvoice form a chain that is cross-cut by RelatedClaimGroup and by the
  # Applicant -> RiskManagementService -> ExposureAssessment credit basis.

  state_machine_shape: cyclic
  # ExposureAssessment: DRAFT -> {PRICED, REFERRED}, REFERRED -> PRICED, REFERRED -> REFERRED.
  # DefenseInvoice: UNDER_AUDIT -> ADJUSTED -> UNDER_AUDIT (audit/dispute revision loop).
  # Claim: CLOSED -> UNDER_REVIEW (reopen, bounded by REOPEN_LIMIT = 1).
  # DefenseAssignment: ACTIVE -> SUSPENDED_FUNDING -> ACTIVE.
  # Policy carries two independent axes: status x limit_posture (parallel dimensions).

  relationship_patterns:
    - one_to_many
    - self_referential          # Claim.related_to_claim_id -> Claim.id
    - cross_aggregate          # RelatedClaimGroup spans Policy and many Claims
    - polymorphic_valued       # Claim.claimant_class selects FIRST_PARTY vs THIRD_PARTY coverage bucket

  role_model: segregation_of_duties
  # Three four-eyes gates keyed on X-User-ID:
  #   ExposureAssessment.priced_by_user_id  != approver of the assessment
  #   DefenseInvoice.audited_by_user_id     != approver of the invoice
  #   IndemnityPayment.created_by_user_id   != approver of the payment

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Two-letter jurisdiction code; natural key used by Applicant.jurisdiction_headcounts[].code, Applicant.primary_jurisdiction_code and DefensePanelFirm.jurisdiction_codes"
        constraints: "matches ^[A-Z]{2}$; unique across all Jurisdiction rows"
      - name: name
        type: string
        source: input
        description: "Display name of the jurisdiction"
      - name: hazard_tier
        type: enum
        source: input
        description: "Employment-litigation hazard tier driving both exposure points and the premium hazard load"
        constraints: "one of T1, T2, T3, T4"
      - name: admin_agency_name
        type: string
        source: input
        description: "Administrative agency that issues charges of discrimination in this jurisdiction"
      - name: pre_suit_mediation_required
        type: boolean
        source: input
        description: "Whether the agency mandates pre-suit mediation before a civil action may be filed"
        default: false
      - name: pre_suit_window_days
        type: integer
        source: input
        description: "Maximum whole days between Claim.first_notice_at and a PreSuitResolution acceptance for the pre-suit incentive credit to apply"
        constraints: ">= 0"
      - name: wage_hour_multiplier
        type: number
        source: input
        description: "Reference multiplier published for wage-and-hour exposure in this jurisdiction; recorded for underwriting disclosure only and never used in any calculation in §1.3"
        constraints: ">= 1.00, 2 decimal places"
      - name: class_action_propensity_pct
        type: number
        source: input
        description: "Published class-action propensity percentage; recorded for underwriting disclosure only and never used in any calculation in §1.3"
        constraints: "0.00 <= value <= 100.00"

  - name: RatePlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Rate plan name"
        constraints: "unique across all RatePlan rows"
      - name: base_rate_per_employee_cents
        type: integer
        source: input
        description: "Whole-cent base rate per covered employee before the headcount volume factor"
        constraints: ">= 1"
      - name: min_premium_cents
        type: integer
        source: input
        description: "Whole-cent minimum premium floor applied AFTER all credits (see calculations.indicated_premium step 8)"
        constraints: ">= 1"
      - name: wage_hour_sublimit_pct
        type: number
        source: input
        description: "Fraction of the aggregate limit reserved as the wage-and-hour sublimit"
        constraints: "0 < value <= 1, 2 decimal places"
      - name: third_party_sublimit_pct
        type: number
        source: input
        description: "Fraction of the aggregate limit reserved as the third-party (customer/vendor) sublimit"
        constraints: "0 < value <= 1, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; only ACTIVE plans may be referenced by a new ExposureAssessment"
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the prospective insured employer"
      - name: total_headcount
        type: integer
        source: input
        description: "Total covered employee count across all jurisdictions"
        constraints: ">= 1"
      - name: prior_year_separations
        type: integer
        source: input
        description: "Involuntary and voluntary separations in the 12 months preceding the application; sole turnover input of the QUOTE premium variant"
        constraints: ">= 0"
      - name: separations_since_assessment
        type: integer
        source: input
        description: "Separations recorded after the exposure assessment was priced; read ONLY by the BOUND_AUDIT premium variant. Changing this field does NOT stale any ExposureAssessment (see the ExposureAssessment PRICED -> REFERRED transition note in §1.2)"
        default: 0
        constraints: ">= 0"
      - name: jurisdiction_headcounts
        type: array
        source: input
        description: "Array of objects { code: string, headcount: integer }; each `code` is a natural-key reference resolved by Jurisdiction WHERE code == entry.code; the sum of `headcount` MUST equal total_headcount"
        constraints: "length >= 1; codes unique within the array; every headcount >= 1"
      - name: primary_jurisdiction_code
        type: string
        source: input
        description: "Natural-key reference resolved by Jurisdiction WHERE code == this value; MUST also appear in jurisdiction_headcounts[].code; this is the single jurisdiction used by the defense-panel eligibility filter"
      - name: turnover_pct
        type: number
        source: computed
        description: "Computed by calculations.turnover_pct from prior_year_separations and total_headcount"
        constraints: "2 decimal places, round_half_up"
      - name: hazard_load_pct
        type: number
        source: computed
        description: "Computed by calculations.hazard_load_pct from the hazard_tier of every Jurisdiction resolved from jurisdiction_headcounts[].code"
        constraints: "3 decimal places"
      - name: risk_credit_pct
        type: number
        source: computed
        description: "Computed by calculations.risk_credit_pct; sum of credit_pct over this applicant's RiskManagementService rows with status == ACTIVE, capped at RISK_CREDIT_CAP_PCT"
        constraints: "0.00 <= value <= 0.15, 2 decimal places"
      - name: exposure_score
        type: number
        source: computed
        description: "Computed by calculations.exposure_score; cross-entity derived value over Jurisdiction rows and RiskManagementService rows"
        constraints: "0.00 <= value <= 100.00, 2 decimal places"

  - name: RiskManagementService
    parent: Applicant
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: system
        description: "FK -> Applicant.id; taken from the path segment of POST /epli/applicants/{applicant_id}/risk-management-services"
      - name: service_type
        type: enum
        source: input
        description: "Risk-management service purchased by the applicant"
        constraints: "one of HOTLINE_SUBSCRIPTION, HANDBOOK_REVIEW, MANAGER_TRAINING"
      - name: credit_pct
        type: number
        source: input
        description: "Premium credit fraction this service contributes once status == ACTIVE"
        constraints: "0.00 <= value <= 0.15, 2 decimal places"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the service window (ISO 8601 UTC, three fractional digits)"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the service window; MUST be strictly greater than effective_from"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the service was marked complete; null while status == PENDING"
        default: null
      - name: revocation_reason
        type: string
        source: input
        description: "Free-text reason recorded on the revoke transition; null until then"
        default: null
      - name: status
        type: enum
        source: system
        description: "Service lifecycle state; only ACTIVE rows contribute to Applicant.risk_credit_pct"
        default: PENDING
        constraints: "one of PENDING, ACTIVE, LAPSED, REVOKED"

  - name: ExposureAssessment
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id"
      - name: rate_plan_id
        type: string
        source: input
        description: "FK -> RatePlan.id; the referenced plan MUST have status == ACTIVE at creation time"
      - name: requested_aggregate_limit_cents
        type: integer
        source: input
        description: "Whole-cent aggregate limit requested by the applicant"
        constraints: ">= 100000000 is NOT required; must be >= 1000000"
      - name: requested_retention_cents
        type: integer
        source: input
        description: "Whole-cent per-claim retention requested by the applicant"
        constraints: ">= 0"
      - name: third_party_coverage_requested
        type: boolean
        source: input
        description: "Whether third-party (customer/vendor claimant) coverage is requested"
        default: false
      - name: priced_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Underwriter who last executed the price transition; null while status == DRAFT"
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the UnderwritingManager who approved; MUST differ from priced_by_user_id (segregation of duties)"
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Free-text reason recorded on the reject transition"
        default: null
      - name: exposure_score_snapshot
        type: number
        source: computed
        description: "Applicant.exposure_score copied at the moment of the price transition; the referral decision reads this snapshot, never the live applicant value"
        constraints: "2 decimal places"
      - name: turnover_pct_snapshot
        type: number
        source: computed
        description: "Turnover percentage used by the QUOTE premium variant; equals round_half_up(Applicant.prior_year_separations / Applicant.total_headcount * 100, 2)"
        constraints: "2 decimal places"
      - name: base_premium_cents
        type: integer
        source: computed
        description: "Component A of calculations.indicated_premium; sum of PER-JURISDICTION rounded base amounts (round-then-sum order is pinned)"
      - name: turnover_load_cents
        type: integer
        source: computed
        description: "Component B of calculations.indicated_premium"
      - name: hazard_load_cents
        type: integer
        source: computed
        description: "Component C of calculations.indicated_premium"
      - name: limit_load_cents
        type: integer
        source: computed
        description: "Component D of calculations.indicated_premium"
      - name: retention_credit_cents
        type: integer
        source: computed
        description: "Credit E of calculations.indicated_premium"
      - name: risk_mgmt_credit_cents
        type: integer
        source: computed
        description: "Credit F of calculations.indicated_premium; the hotline / policy-review credit"
      - name: indicated_premium_cents
        type: integer
        source: computed
        description: "QUOTE variant result of calculations.indicated_premium"
      - name: credit_basis_stale
        type: boolean
        source: system
        description: "Set true when a RiskManagementService status change or an assessment-relevant Applicant field change invalidated the credit basis; approve is blocked while true"
        default: false
      - name: status
        type: enum
        source: system
        description: "Assessment lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, PRICED, REFERRED, APPROVED, REJECTED, SUPERSEDED, BOUND"

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: system
        description: "FK -> Applicant.id; copied from ExposureAssessment.applicant_id at bind"
      - name: exposure_assessment_id
        type: string
        source: input
        description: "FK -> ExposureAssessment.id; the referenced assessment MUST have status == APPROVED"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the policy period (ISO 8601 UTC, three fractional digits)"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the policy period; MUST be strictly greater than effective_from"
      - name: aggregate_limit_cents
        type: integer
        source: system
        description: "Copied from ExposureAssessment.requested_aggregate_limit_cents at bind"
      - name: per_claim_retention_cents
        type: integer
        source: system
        description: "Copied from ExposureAssessment.requested_retention_cents at bind; base retention before the §1.3 retention multipliers"
      - name: third_party_coverage_elected
        type: boolean
        source: system
        description: "Copied from ExposureAssessment.third_party_coverage_requested at bind"
      - name: wage_hour_sublimit_cents
        type: integer
        source: computed
        description: "round_half_up(aggregate_limit_cents * RatePlan.wage_hour_sublimit_pct) using the plan referenced by the bound assessment"
      - name: third_party_sublimit_cents
        type: integer
        source: computed
        description: "round_half_up(aggregate_limit_cents * RatePlan.third_party_sublimit_pct)"
      - name: bound_premium_cents
        type: integer
        source: computed
        description: "BOUND_AUDIT variant result of calculations.indicated_premium, evaluated at bind"
      - name: premium_variance_cents
        type: integer
        source: computed
        description: "bound_premium_cents - ExposureAssessment.indicated_premium_cents; may be negative"
      - name: indemnity_paid_cents
        type: integer
        source: computed
        description: "Sum of IndemnityPayment.insurer_portion_cents over payments whose status == APPROVED and whose claim_id belongs to a Claim with policy_id == this policy"
        default: 0
      - name: defense_spend_cents
        type: integer
        source: computed
        description: "Sum of DefenseInvoice.allowed_amount_cents over invoices whose status == APPROVED and whose assignment belongs to a Claim with policy_id == this policy"
        default: 0
      - name: aggregate_limit_remaining_cents
        type: integer
        source: computed
        description: "aggregate_limit_cents - indemnity_paid_cents - defense_spend_cents; never negative because every debiting endpoint pre-checks it"
      - name: wage_hour_sublimit_remaining_cents
        type: integer
        source: computed
        description: "wage_hour_sublimit_cents minus the sum of insurer_portion_cents over APPROVED payments whose sublimit_bucket == WAGE_HOUR on this policy's claims"
      - name: third_party_sublimit_remaining_cents
        type: integer
        source: computed
        description: "third_party_sublimit_cents minus the sum of insurer_portion_cents over APPROVED payments whose sublimit_bucket == THIRD_PARTY on this policy's claims"
      - name: suspension_reason
        type: string
        source: input
        description: "Free-text reason recorded on the suspend transition; cleared to null on reinstate"
        default: null
      - name: suspended_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent suspend transition; cleared to null on reinstate"
        default: null
      - name: status
        type: enum
        source: system
        description: "Coverage-availability axis of the parallel state machine"
        default: BOUND
        constraints: "one of BOUND, ACTIVE, SUSPENDED, EXPIRED"
      - name: limit_posture
        type: enum
        source: computed
        description: "Limit-erosion axis of the parallel state machine; evolves independently of status"
        default: OPEN
        constraints: "one of OPEN, ERODED, EXHAUSTED"

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> Policy.id; taken from the path segment of POST /epli/policies/{policy_id}/claims"
      - name: claim_type
        type: enum
        source: input
        description: "Alleged employment practice"
        constraints: "one of WRONGFUL_TERMINATION, DISCRIMINATION, HARASSMENT, RETALIATION, WAGE_AND_HOUR"
      - name: claimant_class
        type: enum
        source: input
        description: "Who is asserting the claim; CUSTOMER and VENDOR are third-party claimants"
        constraints: "one of EMPLOYEE, CUSTOMER, VENDOR"
      - name: notice_type
        type: enum
        source: input
        description: "Form in which the claim was first noticed; only ADMIN_CHARGE is eligible for the pre-suit incentive credit"
        constraints: "one of ADMIN_CHARGE, LAWSUIT, DEMAND_LETTER"
      - name: first_notice_at
        type: datetime
        source: input
        description: "Instant the insured first received notice; MUST fall in [Policy.effective_from, Policy.effective_to)"
      - name: alleged_damages_cents
        type: integer
        source: input
        description: "Whole-cent damages alleged by the claimant"
        constraints: ">= 0"
      - name: claimant_count
        type: integer
        source: input
        description: "Number of named claimants; > 1 marks a class or mass claim"
        default: 1
        constraints: ">= 1"
      - name: related_to_claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the earlier claim this claim is alleged to arise from; MUST reference a Claim with the same policy_id"
        default: null
      - name: related_claim_group_id
        type: string
        source: system
        description: "FK -> RelatedClaimGroup.id; set when the claim is attached to a group, null otherwise"
        default: null
      - name: coverage_bucket
        type: enum
        source: computed
        description: "Computed by calculations.coverage_bucket from claim_type and claimant_class"
        constraints: "one of FIRST_PARTY, THIRD_PARTY, WAGE_HOUR"
      - name: retention_basis
        type: enum
        source: computed
        description: "PER_CLAIM while related_claim_group_id is null; GROUP_AGGREGATED once attached to a RelatedClaimGroup"
        default: PER_CLAIM
        constraints: "one of PER_CLAIM, GROUP_AGGREGATED"
      - name: per_claim_retention_cents
        type: integer
        source: computed
        description: "Multiplier-adjusted retention for this claim alone, per calculations.claim_retention (step 1-3); always populated even under GROUP_AGGREGATED basis"
      - name: pre_suit_credit_cents
        type: integer
        source: computed
        description: "Incentive credit applied by calculations.pre_suit_incentive_credit; 0 until a PreSuitResolution on this claim is ACCEPTED"
        default: 0
      - name: applied_retention_cents
        type: integer
        source: computed
        description: "Retention the insured must bear before insurer funds attach for THIS claim; equals max(0, per_claim_retention_cents - pre_suit_credit_cents) under PER_CLAIM basis and 0 under GROUP_AGGREGATED basis (the group bears it)"
      - name: retention_satisfied_cents
        type: integer
        source: computed
        description: "Sum of IndemnityPayment.retention_portion_cents over payments on this claim whose status == APPROVED"
        default: 0
      - name: indemnity_paid_cents
        type: integer
        source: computed
        description: "Sum of IndemnityPayment.insurer_portion_cents over payments on this claim whose status == APPROVED"
        default: 0
      - name: defense_paid_cents
        type: integer
        source: computed
        description: "Sum of DefenseInvoice.allowed_amount_cents over invoices with status == APPROVED on DefenseAssignment rows whose claim_id == this claim"
        default: 0
      - name: reopen_count
        type: integer
        source: system
        description: "Number of completed reopen transitions; capped by REOPEN_LIMIT = 1"
        default: 0
      - name: coverage_gated
        type: boolean
        source: system
        description: "True while the owning Policy.status == SUSPENDED; set and cleared by the policy suspend/reinstate cascades"
        default: false
      - name: denial_reason
        type: string
        source: input
        description: "Free-text reason recorded when the coverage decision is DENY"
        default: null
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state"
        default: REPORTED
        constraints: "one of REPORTED, UNDER_REVIEW, COVERAGE_ACCEPTED, COVERAGE_DENIED, DEFENSE_OPEN, RESOLVED, CLOSED"

  - name: RelatedClaimGroup
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; every member claim MUST have this same policy_id"
      - name: lead_claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the first member, attached automatically at group creation"
      - name: aggregation_basis
        type: enum
        source: input
        description: "Ground on which the members are treated as a single claim for retention and limit purposes"
        constraints: "one of COMMON_DECISION_MAKER, COMMON_POLICY_PRACTICE, CLASS_ACTION_MEMBER, MASS_CLAIM_WAVE"
      - name: member_count
        type: integer
        source: computed
        description: "Count of Claim rows whose related_claim_group_id == this group's id"
      - name: retention_basis_claim_id
        type: string
        source: computed
        description: "FK -> Claim.id; the member whose per_claim_retention_cents equals shared_retention_cents; ties broken by member Claim.created_at ASC"
      - name: shared_retention_cents
        type: integer
        source: computed
        description: "max(per_claim_retention_cents) over member Claim rows (all statuses included); the single retention the whole group bears"
      - name: retention_paid_cents
        type: integer
        source: computed
        description: "Sum of IndemnityPayment.retention_portion_cents over APPROVED payments on every member claim"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN while retention_paid_cents < shared_retention_cents; LOCKED once the shared retention is fully satisfied"
        default: OPEN
        constraints: "one of OPEN, LOCKED"

  - name: DefensePanelFirm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Firm name"
        constraints: "unique across all DefensePanelFirm rows"
      - name: tier
        type: enum
        source: input
        description: "Panel tier; ordinal LOCAL=0, REGIONAL=1, NATIONAL=2 is the first tie-break of the panel selector"
        constraints: "one of NATIONAL, REGIONAL, LOCAL"
      - name: jurisdiction_codes
        type: array
        source: input
        description: "Array of strings; each entry is a natural-key reference resolved by Jurisdiction WHERE code == entry"
        constraints: "length >= 1; entries unique"
      - name: partner_rate_cents_per_hour
        type: integer
        source: input
        description: "Whole-cent partner hourly rate on the firm's current schedule"
        constraints: ">= 1"
      - name: associate_rate_cents_per_hour
        type: integer
        source: input
        description: "Whole-cent associate hourly rate"
        constraints: ">= 1"
      - name: paralegal_rate_cents_per_hour
        type: integer
        source: input
        description: "Whole-cent paralegal hourly rate"
        constraints: ">= 1"
      - name: capacity_open_matters
        type: integer
        source: input
        description: "Maximum number of window-overlapping DefenseAssignment rows in status ACTIVE or SUSPENDED_FUNDING the firm may hold"
        constraints: ">= 1"
      - name: blended_rate_cents
        type: integer
        source: computed
        description: "Computed by calculations.blended_rate; the ranking key of the panel selector"
      - name: open_matter_count
        type: integer
        source: computed
        description: "Count of DefenseAssignment rows with panel_firm_id == this firm and status IN {ACTIVE, SUSPENDED_FUNDING}"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Panel membership state; only PANEL_ACTIVE firms are eligible for assignment"
        default: PANEL_ACTIVE
        constraints: "one of PANEL_ACTIVE, PANEL_SUSPENDED"

  - name: DefenseAssignment
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: "FK -> Claim.id; taken from the path segment of POST /epli/claims/{claim_id}/defense-assignments"
      - name: panel_firm_id
        type: string
        source: system
        description: "FK -> DefensePanelFirm.id; equals the request's panel_firm_id when supplied, otherwise the winner of calculations.panel_firm_selection"
      - name: engagement_from
        type: datetime
        source: input
        description: "Inclusive start of the engagement window"
      - name: engagement_to
        type: datetime
        source: input
        description: "Exclusive end of the engagement window; MUST be strictly greater than engagement_from"
      - name: partner_rate_cents_per_hour
        type: integer
        source: computed
        description: "Snapshot of DefensePanelFirm.partner_rate_cents_per_hour pinned at assignment; later firm-schedule changes do not affect this assignment"
      - name: associate_rate_cents_per_hour
        type: integer
        source: computed
        description: "Snapshot of DefensePanelFirm.associate_rate_cents_per_hour pinned at assignment"
      - name: paralegal_rate_cents_per_hour
        type: integer
        source: computed
        description: "Snapshot of DefensePanelFirm.paralegal_rate_cents_per_hour pinned at assignment"
      - name: litigation_guideline_version
        type: integer
        source: input
        description: "Version of the litigation guidelines governing invoice audits on this matter"
        default: 1
        constraints: ">= 1"
      - name: budget_cap_cents
        type: integer
        source: input
        description: "Whole-cent defense budget for this matter"
        constraints: ">= 1"
      - name: budget_spent_cents
        type: integer
        source: computed
        description: "Sum of DefenseInvoice.allowed_amount_cents over invoices on this assignment whose status == APPROVED"
        default: 0
      - name: budget_remaining_cents
        type: integer
        source: computed
        description: "budget_cap_cents - budget_spent_cents"
      - name: selection_reason
        type: enum
        source: computed
        description: "AUTO_SELECTED when the selector chose the firm, CLIENT_DIRECTED when panel_firm_id was supplied in the request"
        constraints: "one of AUTO_SELECTED, CLIENT_DIRECTED"
      - name: hold_reason
        type: enum
        source: system
        description: "Why funding is paused; set by the policy-suspend cascade and cleared by the reinstate cascade"
        default: null
        constraints: "null or POLICY_SUSPENDED"
      - name: funding_ceased_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the assignment was closed by the limit-exhaustion cascade; null for adjuster-initiated closes"
        default: null
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle state"
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED_FUNDING, CLOSED"

  - name: DefenseInvoice
    parent: DefenseAssignment
    common_fields: true
    fields:
      - name: defense_assignment_id
        type: string
        source: system
        description: "FK -> DefenseAssignment.id; taken from the path segment of POST /epli/defense-assignments/{assignment_id}/invoices"
      - name: period_start
        type: datetime
        source: input
        description: "INCLUSIVE start of the billing period"
      - name: period_end
        type: datetime
        source: input
        description: "INCLUSIVE end of the billing period; MUST be >= period_start. Billing periods on one assignment are CLOSED intervals: two invoices collide iff a.period_start <= b.period_end AND b.period_start <= a.period_end"
      - name: partner_hours
        type: number
        source: input
        description: "Partner hours billed; at most one decimal place"
        default: 0
        constraints: ">= 0"
      - name: associate_hours
        type: number
        source: input
        description: "Associate hours billed; at most one decimal place"
        default: 0
        constraints: ">= 0"
      - name: paralegal_hours
        type: number
        source: input
        description: "Paralegal hours billed; at most one decimal place"
        default: 0
        constraints: ">= 0"
      - name: block_billed_hours
        type: number
        source: input
        description: "Subset of the billed hours recorded as block entries; MUST be <= partner_hours + associate_hours + paralegal_hours"
        default: 0
        constraints: ">= 0"
      - name: expenses_cents
        type: integer
        source: input
        description: "Whole-cent disbursements claimed on this invoice"
        default: 0
        constraints: ">= 0"
      - name: dispute_note
        type: string
        source: input
        description: "Free-text note recorded when counsel disputes an audit and resubmits revised hours"
        default: null
      - name: billed_fees_cents
        type: integer
        source: computed
        description: "Step 1 of calculations.defense_invoice_audit; fees at the assignment's snapshot rates"
      - name: rate_cap_excess_cents
        type: integer
        source: computed
        description: "Step 2 of calculations.defense_invoice_audit; excess over the litigation-guideline rate caps"
      - name: block_reduction_cents
        type: integer
        source: computed
        description: "Step 3 of calculations.defense_invoice_audit; block-billing reduction on post-rate-cap fees"
      - name: expense_disallowance_cents
        type: integer
        source: computed
        description: "Step 4 of calculations.defense_invoice_audit; expenses above the cap keyed on POST-reduction allowed fees"
      - name: guideline_reduction_cents
        type: integer
        source: computed
        description: "rate_cap_excess_cents + block_reduction_cents + expense_disallowance_cents"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "Step 5 of calculations.defense_invoice_audit; the amount that debits the matter budget and the policy aggregate on approval"
      - name: disallowed_amount_cents
        type: integer
        source: computed
        description: "(billed_fees_cents + expenses_cents) - allowed_amount_cents"
      - name: audited_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClaimsAdjuster who last executed the audit transition; the approver MUST differ from this value"
        default: null
      - name: void_reason
        type: string
        source: input
        description: "Free-text reason recorded on the void transition"
        default: null
      - name: hold_reason
        type: enum
        source: system
        description: "Why the invoice is held; set by the policy-suspend cascade (POLICY_SUSPENDED) or the limit-exhaustion cascade (LIMIT_EXHAUSTED)"
        default: null
        constraints: "null or one of POLICY_SUSPENDED, LIMIT_EXHAUSTED"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle state"
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_AUDIT, ADJUSTED, APPROVED, REJECTED, VOIDED"

  - name: IndemnityPayment
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: "FK -> Claim.id; taken from the path segment of POST /epli/claims/{claim_id}/indemnity-payments"
      - name: amount_cents
        type: integer
        source: input
        description: "Gross whole-cent settlement or judgment amount, before the retention split"
        constraints: ">= 1"
      - name: payment_basis
        type: enum
        source: input
        description: "Legal basis of the payment"
        constraints: "one of SETTLEMENT, JUDGMENT, PRE_SUIT_SETTLEMENT"
      - name: retention_portion_cents
        type: integer
        source: computed
        description: "Step 2 of calculations.indemnity_waterfall; the part borne by the insured"
      - name: insurer_portion_cents
        type: integer
        source: computed
        description: "amount_cents - retention_portion_cents; the part that erodes sublimits and the aggregate limit on approval"
      - name: sublimit_bucket
        type: enum
        source: computed
        description: "Copied from Claim.coverage_bucket at creation; selects which sublimit the insurer portion debits"
        constraints: "one of FIRST_PARTY, THIRD_PARTY, WAGE_HOUR"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClaimsAdjuster who created the payment; the approver MUST differ from this value"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClaimsManager who approved the payment"
        default: null
      - name: void_reason
        type: string
        source: input
        description: "Free-text reason recorded on the void transition"
        default: null
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle state"
        default: PENDING_APPROVAL
        constraints: "one of PENDING_APPROVAL, APPROVED, VOIDED"

  - name: PreSuitResolution
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: "FK -> Claim.id; taken from the path segment of POST /epli/claims/{claim_id}/pre-suit-resolutions"
      - name: mediation_offered_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the offer was created"
      - name: offer_expires_at
        type: datetime
        source: input
        description: "Instant after which the offer LAPSES; MUST be strictly greater than the logical clock at creation"
      - name: settlement_offer_cents
        type: integer
        source: input
        description: "Whole-cent pre-suit settlement offer extended to the claimant"
        constraints: ">= 1"
      - name: elapsed_days_at_accept
        type: integer
        source: computed
        description: "floor((accept instant - Claim.first_notice_at) / 86400 seconds), evaluated on the accept transition"
        default: null
      - name: incentive_credit_cents
        type: integer
        source: computed
        description: "Credit computed by calculations.pre_suit_incentive_credit and posted to Claim.pre_suit_credit_cents on acceptance"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Offer lifecycle state"
        default: OFFERED
        constraints: "one of OFFERED, ACCEPTED, LAPSED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: RatePlan
    initial_state: DRAFT
    terminal_states: [ACTIVE]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /epli/rate-plans/{rate_plan_id}/activate"
        actor: PlatformAdmin
        preconditions: ["rate_plan.status == DRAFT"]
        side_effects: ["increments RatePlan.version by 1"]
        note: "Only RatePlan rows with status == ACTIVE may be referenced by POST /epli/exposure-assessments."

  - entity: DefensePanelFirm
    initial_state: PANEL_ACTIVE
    terminal_states: [PANEL_SUSPENDED]
    transitions:
      - from: PANEL_ACTIVE
        to: PANEL_SUSPENDED
        trigger: "POST /epli/defense-panel-firms/{panel_firm_id}/suspend"
        actor: PlatformAdmin
        preconditions: ["panel_firm.status == PANEL_ACTIVE"]
        side_effects:
          - "increments DefensePanelFirm.version by 1"
          - "firm is removed from the calculations.panel_firm_selection candidate set for all future assignments"
        note: "Existing DefenseAssignment rows on the firm are NOT touched; suspension is forward-looking only."

  - entity: RiskManagementService
    initial_state: PENDING
    terminal_states: [LAPSED, REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /epli/risk-management-services/{service_id}/complete"
        actor: Underwriter
        preconditions:
          - "service.status == PENDING"
          - "logical clock is in [service.effective_from, service.effective_to)"
        side_effects:
          - "sets RiskManagementService.completed_at to the logical clock instant"
          - "recomputes Applicant.risk_credit_pct and Applicant.exposure_score (calculations.risk_credit_pct, calculations.exposure_score) and increments Applicant.version by 1"
          - "CASCADE HOP: because Applicant's credit basis changed, every ExposureAssessment with applicant_id == this applicant and status == PRICED transitions PRICED -> REFERRED and gets credit_basis_stale = true; assessments already in REFERRED only get credit_basis_stale = true"
      - from: ACTIVE
        to: LAPSED
        trigger: "system: POST /epli/_clock/set_current_utc advances the logical clock to an instant >= service.effective_to"
        actor: system
        preconditions: ["service.status == ACTIVE", "new clock instant >= service.effective_to"]
        side_effects:
          - "recomputes Applicant.risk_credit_pct and Applicant.exposure_score and increments Applicant.version by 1"
          - "CASCADE HOP: same credit-basis invalidation as the complete transition"
      - from: PENDING
        to: REVOKED
        trigger: "POST /epli/risk-management-services/{service_id}/revoke"
        actor: Underwriter
        preconditions: ["service.status == PENDING"]
        side_effects:
          - "records revocation_reason"
          - "recomputes Applicant.risk_credit_pct and Applicant.exposure_score and increments Applicant.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /epli/risk-management-services/{service_id}/revoke"
        actor: Underwriter
        preconditions: ["service.status == ACTIVE"]
        side_effects:
          - "records revocation_reason"
          - "CASCADE HOP 1: recomputes Applicant.risk_credit_pct (this service's credit_pct is removed from the sum) and Applicant.exposure_score, and increments Applicant.version by 1"
          - "CASCADE HOP 2: that Applicant mutation invalidates the credit basis, so every ExposureAssessment with applicant_id == this applicant and status == PRICED transitions PRICED -> REFERRED with credit_basis_stale = true, and its version increments by 1"
        note: "Depth-2 transitive cascade: service -> applicant -> assessment. Each hop is caused by the previous hop's mutation, not by the revoke request itself."

  - entity: ExposureAssessment
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED, BOUND]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /epli/exposure-assessments/{assessment_id}/price"
        actor: Underwriter
        preconditions:
          - "assessment.status == DRAFT"
          - "the RatePlan referenced by rate_plan_id has status == ACTIVE"
          - "the recomputed Applicant.exposure_score is < REFERRAL_SCORE_THRESHOLD (72.00)"
        side_effects:
          - "sets exposure_score_snapshot = Applicant.exposure_score and turnover_pct_snapshot = Applicant.turnover_pct"
          - "computes base_premium_cents, turnover_load_cents, hazard_load_cents, limit_load_cents, retention_credit_cents, risk_mgmt_credit_cents and indicated_premium_cents via the QUOTE variant of calculations.indicated_premium"
          - "sets priced_by_user_id = X-User-ID, credit_basis_stale = false"
          - "increments ExposureAssessment.version by 1"
      - from: DRAFT
        to: REFERRED
        trigger: "POST /epli/exposure-assessments/{assessment_id}/price"
        actor: Underwriter
        preconditions:
          - "assessment.status == DRAFT"
          - "the RatePlan referenced by rate_plan_id has status == ACTIVE"
          - "the recomputed Applicant.exposure_score is >= REFERRAL_SCORE_THRESHOLD (72.00)"
        side_effects: ["identical side effects to the DRAFT -> PRICED transition; only the resulting status differs"]
      - from: REFERRED
        to: PRICED
        trigger: "POST /epli/exposure-assessments/{assessment_id}/price"
        actor: Underwriter
        preconditions:
          - "assessment.status == REFERRED"
          - "the RatePlan referenced by rate_plan_id has status == ACTIVE"
          - "the recomputed Applicant.exposure_score is < REFERRAL_SCORE_THRESHOLD (72.00)"
        side_effects:
          - "recomputes every premium component and indicated_premium_cents from current Applicant / Jurisdiction / RiskManagementService data"
          - "sets credit_basis_stale = false, priced_by_user_id = X-User-ID"
          - "increments ExposureAssessment.version by 1"
        note: "Revision loop: an assessment referred because of a high exposure score returns to PRICED once the applicant's risk-management credits bring the score under the threshold."
      - from: REFERRED
        to: REFERRED
        trigger: "POST /epli/exposure-assessments/{assessment_id}/price"
        actor: Underwriter
        preconditions:
          - "assessment.status == REFERRED"
          - "the RatePlan referenced by rate_plan_id has status == ACTIVE"
          - "the recomputed Applicant.exposure_score is >= REFERRAL_SCORE_THRESHOLD (72.00)"
        side_effects: ["same recomputation as REFERRED -> PRICED; sets credit_basis_stale = false; status stays REFERRED"]
        note: "Self-loop closing the cycle DRAFT -> REFERRED -> REFERRED."
      - from: PRICED
        to: REFERRED
        trigger: "system: a RiskManagementService status change (complete / revoke / lapse) or a PATCH /epli/applicants/{applicant_id} that changes total_headcount, prior_year_separations, jurisdiction_headcounts or primary_jurisdiction_code"
        actor: system
        preconditions: ["assessment.status == PRICED"]
        side_effects:
          - "sets credit_basis_stale = true"
          - "increments ExposureAssessment.version by 1"
        note: "A PATCH that changes ONLY separations_since_assessment does NOT fire this transition, because that field is read exclusively by the BOUND_AUDIT variant and never by the QUOTE variant."
      - from: PRICED
        to: APPROVED
        trigger: "POST /epli/exposure-assessments/{assessment_id}/approve"
        actor: UnderwritingManager
        preconditions:
          - "assessment.status == PRICED"
          - "assessment.credit_basis_stale == false"
          - "X-User-ID != assessment.priced_by_user_id (segregation of duties)"
        side_effects: ["sets approved_by_user_id = X-User-ID", "increments ExposureAssessment.version by 1"]
      - from: REFERRED
        to: APPROVED
        trigger: "POST /epli/exposure-assessments/{assessment_id}/approve"
        actor: UnderwritingManager
        preconditions:
          - "assessment.status == REFERRED"
          - "assessment.credit_basis_stale == false"
          - "X-User-ID != assessment.priced_by_user_id (segregation of duties)"
        side_effects: ["sets approved_by_user_id = X-User-ID", "increments ExposureAssessment.version by 1"]
        note: "Referred risks are bindable, but only a manager may release them."
      - from: PRICED
        to: REJECTED
        trigger: "POST /epli/exposure-assessments/{assessment_id}/reject"
        actor: UnderwritingManager
        preconditions: ["assessment.status == PRICED"]
        side_effects: ["records rejection_reason", "increments ExposureAssessment.version by 1"]
      - from: REFERRED
        to: REJECTED
        trigger: "POST /epli/exposure-assessments/{assessment_id}/reject"
        actor: UnderwritingManager
        preconditions: ["assessment.status == REFERRED"]
        side_effects: ["records rejection_reason", "increments ExposureAssessment.version by 1"]
      - from: APPROVED
        to: BOUND
        trigger: "system: POST /epli/policies referencing this assessment"
        actor: system
        preconditions: ["assessment.status == APPROVED"]
        side_effects: ["increments ExposureAssessment.version by 1"]
      - from: PRICED
        to: SUPERSEDED
        trigger: "system: POST /epli/exposure-assessments creates a newer assessment for the same applicant_id"
        actor: system
        preconditions: ["assessment.status == PRICED"]
        side_effects: ["increments ExposureAssessment.version by 1"]
      - from: REFERRED
        to: SUPERSEDED
        trigger: "system: POST /epli/exposure-assessments creates a newer assessment for the same applicant_id"
        actor: system
        preconditions: ["assessment.status == REFERRED"]
        side_effects: ["increments ExposureAssessment.version by 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: POST /epli/exposure-assessments creates a newer assessment for the same applicant_id"
        actor: system
        preconditions: ["assessment.status == APPROVED"]
        side_effects: ["increments ExposureAssessment.version by 1"]
        note: "An APPROVED-but-unbound assessment is legitimately superseded by a re-quote; this is the true race resolved by concurrency_rules.assessment-create-stale-applicant."

  - entity: Policy
    initial_state: BOUND
    terminal_states: [EXPIRED]
    transitions:
      - from: BOUND
        to: ACTIVE
        trigger: "system: evaluated at the end of POST /epli/policies and again on every POST /epli/_clock/set_current_utc, whenever the logical clock is >= policy.effective_from and < policy.effective_to"
        actor: system
        preconditions: ["policy.status == BOUND", "logical clock >= policy.effective_from", "logical clock < policy.effective_to"]
        side_effects: ["increments Policy.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /epli/policies/{policy_id}/suspend"
        actor: UnderwritingManager
        preconditions: ["policy.status == ACTIVE"]
        side_effects:
          - "records suspension_reason and sets suspended_at to the logical clock instant"
          - "CASCADE HOP 1: every Claim with policy_id == this policy and status IN {UNDER_REVIEW, COVERAGE_ACCEPTED, DEFENSE_OPEN} gets coverage_gated = true and its version incremented by 1"
          - "CASCADE HOP 2: that Claim mutation propagates to defense — every DefenseAssignment whose claim_id is one of the claims mutated in HOP 1 and whose status == ACTIVE transitions ACTIVE -> SUSPENDED_FUNDING with hold_reason = POLICY_SUSPENDED"
          - "CASCADE HOP 3: that DefenseAssignment mutation propagates to billing — every DefenseInvoice on those assignments with status IN {SUBMITTED, UNDER_AUDIT, ADJUSTED} gets hold_reason = POLICY_SUSPENDED and its version incremented by 1"
          - "increments Policy.version by 1"
        note: "Depth-3 transitive cascade Policy -> Claim -> DefenseAssignment -> DefenseInvoice; each hop is triggered by the mutation produced by the previous hop."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /epli/policies/{policy_id}/reinstate"
        actor: UnderwritingManager
        preconditions: ["policy.status == SUSPENDED", "logical clock < policy.effective_to"]
        side_effects:
          - "clears suspension_reason and suspended_at to null"
          - "reverses HOP 1: every Claim with policy_id == this policy and coverage_gated == true gets coverage_gated = false"
          - "reverses HOP 2: every DefenseAssignment on those claims with status == SUSPENDED_FUNDING and hold_reason == POLICY_SUSPENDED transitions SUSPENDED_FUNDING -> ACTIVE and hold_reason becomes null"
          - "reverses HOP 3: every DefenseInvoice on those assignments whose hold_reason == POLICY_SUSPENDED gets hold_reason = null"
          - "increments Policy.version by 1"
        note: "Compensating transition closing the cycle ACTIVE -> SUSPENDED -> ACTIVE."
      - from: BOUND
        to: EXPIRED
        trigger: "system: POST /epli/_clock/set_current_utc advances the logical clock to an instant >= policy.effective_to"
        actor: system
        preconditions: ["policy.status == BOUND", "new clock instant >= policy.effective_to"]
        side_effects: ["increments Policy.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /epli/_clock/set_current_utc advances the logical clock to an instant >= policy.effective_to"
        actor: system
        preconditions: ["policy.status == ACTIVE", "new clock instant >= policy.effective_to"]
        side_effects: ["increments Policy.version by 1"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: POST /epli/_clock/set_current_utc advances the logical clock to an instant >= policy.effective_to"
        actor: system
        preconditions: ["policy.status == SUSPENDED", "new clock instant >= policy.effective_to"]
        side_effects: ["increments Policy.version by 1"]

  - entity: Policy
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ERODED
        trigger: "system: an IndemnityPayment on one of this policy's claims transitions PENDING_APPROVAL -> APPROVED with insurer_portion_cents > 0, or a DefenseInvoice transitions UNDER_AUDIT -> APPROVED with allowed_amount_cents > 0"
        actor: system
        preconditions: ["policy.limit_posture == OPEN", "recomputed aggregate_limit_remaining_cents > 0", "recomputed aggregate_limit_remaining_cents < aggregate_limit_cents"]
        side_effects: ["increments Policy.version by 1"]
      - from: OPEN
        to: EXHAUSTED
        trigger: "system: same debits as OPEN -> ERODED, when a single approval consumes the entire aggregate limit"
        actor: system
        preconditions: ["policy.limit_posture == OPEN", "recomputed aggregate_limit_remaining_cents == 0"]
        side_effects: ["fires the depth-4 limit-exhaustion cascade described on the ERODED -> EXHAUSTED transition", "increments Policy.version by 1"]
      - from: ERODED
        to: EXHAUSTED
        trigger: "system: an IndemnityPayment approval or DefenseInvoice approval brings aggregate_limit_remaining_cents to exactly 0"
        actor: system
        preconditions: ["policy.limit_posture == ERODED", "recomputed aggregate_limit_remaining_cents == 0"]
        side_effects:
          - "CASCADE HOP 3 (of the payment-approval chain): every DefenseAssignment whose claim_id belongs to a Claim with policy_id == this policy and whose status IN {ACTIVE, SUSPENDED_FUNDING} transitions to CLOSED with funding_ceased_at = the logical clock instant"
          - "CASCADE HOP 4: each of those DefenseAssignment mutations propagates to its own invoices — every DefenseInvoice on the closed assignment with status IN {SUBMITTED, UNDER_AUDIT, ADJUSTED} transitions to REJECTED with hold_reason = LIMIT_EXHAUSTED, and DefensePanelFirm.open_matter_count is recomputed for each affected firm"
          - "increments Policy.version by 1"
        note: "Independent of the status axis: a policy may be ACTIVE and EXHAUSTED, or SUSPENDED and OPEN. status transitions never read limit_posture and vice versa."
      - from: EXHAUSTED
        to: ERODED
        trigger: "system: POST /epli/indemnity-payments/{payment_id}/void or POST /epli/defense-invoices/{invoice_id}/void restores limit"
        actor: system
        preconditions: ["policy.limit_posture == EXHAUSTED", "recomputed aggregate_limit_remaining_cents > 0", "recomputed aggregate_limit_remaining_cents < aggregate_limit_cents"]
        side_effects: ["increments Policy.version by 1"]
        note: "Assignments closed and invoices rejected by the exhaustion cascade are NOT resurrected; only the posture and the ledger are restored."
      - from: ERODED
        to: OPEN
        trigger: "system: the last remaining debit is voided, restoring aggregate_limit_remaining_cents to aggregate_limit_cents"
        actor: system
        preconditions: ["policy.limit_posture == ERODED", "recomputed aggregate_limit_remaining_cents == aggregate_limit_cents"]
        side_effects: ["increments Policy.version by 1"]
      - from: EXHAUSTED
        to: OPEN
        trigger: "system: voiding the single debit that exhausted the policy restores the full aggregate limit"
        actor: system
        preconditions: ["policy.limit_posture == EXHAUSTED", "recomputed aggregate_limit_remaining_cents == aggregate_limit_cents"]
        side_effects: ["increments Policy.version by 1"]

  - entity: Claim
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /epli/claims/{claim_id}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == REPORTED"
          - "the owning Policy.status IN {BOUND, ACTIVE}"
          - "claim.coverage_gated == false"
        side_effects: ["increments Claim.version by 1"]
        note: "Cross-entity guard: the claim's own state is valid but the transition is refused when the parent Policy is SUSPENDED or EXPIRED."
      - from: UNDER_REVIEW
        to: COVERAGE_ACCEPTED
        trigger: "POST /epli/claims/{claim_id}/coverage-decision with decision == ACCEPT"
        actor: ClaimsAdjuster
        preconditions: ["claim.status == UNDER_REVIEW", "the owning Policy.status IN {BOUND, ACTIVE}"]
        side_effects:
          - "computes per_claim_retention_cents and applied_retention_cents via calculations.claim_retention"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: COVERAGE_DENIED
        trigger: "POST /epli/claims/{claim_id}/coverage-decision with decision == DENY"
        actor: ClaimsAdjuster
        preconditions: ["claim.status == UNDER_REVIEW", "denial_reason is present in the request"]
        side_effects: ["records denial_reason", "increments Claim.version by 1"]
        note: "Branch point: ACCEPT and DENY diverge in side-effect sets — only ACCEPT computes retention."
      - from: COVERAGE_ACCEPTED
        to: DEFENSE_OPEN
        trigger: "system: the first DefenseAssignment on this claim is created"
        actor: system
        preconditions: ["claim.status == COVERAGE_ACCEPTED"]
        side_effects: ["increments Claim.version by 1"]
      - from: COVERAGE_ACCEPTED
        to: RESOLVED
        trigger: "system: the first IndemnityPayment on this claim reaches APPROVED, or a PreSuitResolution on this claim reaches ACCEPTED"
        actor: system
        preconditions: ["claim.status == COVERAGE_ACCEPTED"]
        side_effects: ["increments Claim.version by 1"]
      - from: DEFENSE_OPEN
        to: RESOLVED
        trigger: "system: the first IndemnityPayment on this claim reaches APPROVED, or a PreSuitResolution on this claim reaches ACCEPTED"
        actor: system
        preconditions: ["claim.status == DEFENSE_OPEN"]
        side_effects: ["increments Claim.version by 1"]
      - from: COVERAGE_DENIED
        to: CLOSED
        trigger: "POST /epli/claims/{claim_id}/close"
        actor: ClaimsAdjuster
        preconditions: ["claim.status == COVERAGE_DENIED"]
        side_effects: ["increments Claim.version by 1"]
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /epli/claims/{claim_id}/close"
        actor: ClaimsAdjuster
        preconditions: ["claim.status == RESOLVED"]
        side_effects:
          - "every DefenseAssignment on this claim with status IN {ACTIVE, SUSPENDED_FUNDING} transitions to CLOSED"
          - "DefensePanelFirm.open_matter_count is recomputed for each affected firm"
          - "increments Claim.version by 1"
      - from: CLOSED
        to: UNDER_REVIEW
        trigger: "POST /epli/claims/{claim_id}/reopen"
        actor: ClaimsManager
        preconditions:
          - "claim.status == CLOSED"
          - "claim.reopen_count < REOPEN_LIMIT (1)"
          - "the owning Policy.status IN {BOUND, ACTIVE}"
        side_effects: ["increments reopen_count by 1", "increments Claim.version by 1"]
        note: "Bounded revision loop: CLOSED is terminal once reopen_count == 1."

  - entity: RelatedClaimGroup
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "system: an IndemnityPayment on a member claim reaches APPROVED and brings retention_paid_cents to >= shared_retention_cents"
        actor: system
        preconditions: ["group.status == OPEN", "recomputed retention_paid_cents >= shared_retention_cents"]
        side_effects: ["increments RelatedClaimGroup.version by 1"]
        note: "Once LOCKED the group's shared retention is spent; every further insurer_portion on any member is fully insurer-funded."
      - from: LOCKED
        to: OPEN
        trigger: "system: POST /epli/indemnity-payments/{payment_id}/void on a member claim reduces retention_paid_cents below shared_retention_cents"
        actor: system
        preconditions: ["group.status == LOCKED", "recomputed retention_paid_cents < shared_retention_cents"]
        side_effects: ["increments RelatedClaimGroup.version by 1"]

  - entity: DefenseAssignment
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED_FUNDING
        trigger: "system: HOP 2 of the Policy ACTIVE -> SUSPENDED cascade"
        actor: system
        preconditions: ["assignment.status == ACTIVE", "the assignment's Claim was gated in HOP 1 of the same cascade"]
        side_effects: ["sets hold_reason = POLICY_SUSPENDED", "increments DefenseAssignment.version by 1"]
      - from: SUSPENDED_FUNDING
        to: ACTIVE
        trigger: "system: the reverse cascade of Policy SUSPENDED -> ACTIVE"
        actor: system
        preconditions: ["assignment.status == SUSPENDED_FUNDING", "assignment.hold_reason == POLICY_SUSPENDED"]
        side_effects: ["clears hold_reason to null", "increments DefenseAssignment.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /epli/defense-assignments/{assignment_id}/close, or system HOP 3 of the limit-exhaustion cascade, or the Claim RESOLVED -> CLOSED transition"
        actor: ClaimsAdjuster | system
        preconditions: ["assignment.status == ACTIVE"]
        side_effects:
          - "recomputes DefensePanelFirm.open_matter_count for the assigned firm (the count drops by one) and increments DefensePanelFirm.version by 1"
          - "when the trigger is the limit-exhaustion cascade, sets funding_ceased_at to the logical clock instant and rejects the assignment's open invoices (HOP 4)"
          - "increments DefenseAssignment.version by 1"
      - from: SUSPENDED_FUNDING
        to: CLOSED
        trigger: "POST /epli/defense-assignments/{assignment_id}/close, or system HOP 3 of the limit-exhaustion cascade, or the Claim RESOLVED -> CLOSED transition"
        actor: ClaimsAdjuster | system
        preconditions: ["assignment.status == SUSPENDED_FUNDING"]
        side_effects: ["identical to the ACTIVE -> CLOSED side effects"]

  - entity: DefenseInvoice
    initial_state: SUBMITTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_AUDIT
        trigger: "POST /epli/defense-invoices/{invoice_id}/audit"
        actor: ClaimsAdjuster
        preconditions: ["invoice.status == SUBMITTED"]
        side_effects:
          - "computes billed_fees_cents, rate_cap_excess_cents, block_reduction_cents, expense_disallowance_cents, guideline_reduction_cents, allowed_amount_cents and disallowed_amount_cents via calculations.defense_invoice_audit"
          - "sets audited_by_user_id = X-User-ID"
          - "increments DefenseInvoice.version by 1"
      - from: ADJUSTED
        to: UNDER_AUDIT
        trigger: "POST /epli/defense-invoices/{invoice_id}/audit"
        actor: ClaimsAdjuster
        preconditions: ["invoice.status == ADJUSTED"]
        side_effects: ["re-runs calculations.defense_invoice_audit against the revised hours and expenses", "sets audited_by_user_id = X-User-ID", "increments DefenseInvoice.version by 1"]
        note: "Closes the revision cycle UNDER_AUDIT -> ADJUSTED -> UNDER_AUDIT."
      - from: UNDER_AUDIT
        to: ADJUSTED
        trigger: "POST /epli/defense-invoices/{invoice_id}/dispute"
        actor: PanelCounsel
        preconditions:
          - "invoice.status == UNDER_AUDIT"
          - "X-User-ID == the DefensePanelFirm.id referenced by the invoice's assignment (panel_firm_id)"
        side_effects:
          - "overwrites partner_hours, associate_hours, paralegal_hours, block_billed_hours and expenses_cents with the disputed values and records dispute_note"
          - "re-runs calculations.defense_invoice_audit against the revised inputs"
          - "clears audited_by_user_id to null"
          - "increments DefenseInvoice.version by 1"
      - from: UNDER_AUDIT
        to: APPROVED
        trigger: "POST /epli/defense-invoices/{invoice_id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "invoice.status == UNDER_AUDIT"
          - "X-User-ID != invoice.audited_by_user_id (segregation of duties)"
          - "the invoice's Claim has retention_satisfied_cents >= applied_retention_cents, or the Claim's RelatedClaimGroup has status == LOCKED"
          - "assignment.budget_spent_cents + allowed_amount_cents <= assignment.budget_cap_cents"
          - "allowed_amount_cents <= the owning Policy.aggregate_limit_remaining_cents"
        side_effects:
          - "recomputes DefenseAssignment.budget_spent_cents / budget_remaining_cents"
          - "recomputes Claim.defense_paid_cents and Policy.defense_spend_cents / aggregate_limit_remaining_cents, possibly advancing Policy.limit_posture"
          - "increments DefenseInvoice.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /epli/defense-invoices/{invoice_id}/void"
        actor: ClaimsManager
        preconditions: ["invoice.status == APPROVED"]
        side_effects:
          - "records void_reason"
          - "restores DefenseAssignment.budget_spent_cents / budget_remaining_cents by exactly allowed_amount_cents"
          - "restores Claim.defense_paid_cents and Policy.defense_spend_cents / aggregate_limit_remaining_cents by exactly allowed_amount_cents, possibly regressing Policy.limit_posture"
          - "increments DefenseInvoice.version by 1"
        note: "Compensating action for the UNDER_AUDIT -> APPROVED debit; the conserved quantity is the matter defense budget."
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: HOP 4 of the limit-exhaustion cascade"
        actor: system
        preconditions: ["invoice.status == SUBMITTED", "the invoice's assignment was closed in HOP 3 of the same cascade"]
        side_effects: ["sets hold_reason = LIMIT_EXHAUSTED", "increments DefenseInvoice.version by 1"]
      - from: UNDER_AUDIT
        to: REJECTED
        trigger: "system: HOP 4 of the limit-exhaustion cascade"
        actor: system
        preconditions: ["invoice.status == UNDER_AUDIT", "the invoice's assignment was closed in HOP 3 of the same cascade"]
        side_effects: ["sets hold_reason = LIMIT_EXHAUSTED", "increments DefenseInvoice.version by 1"]
      - from: ADJUSTED
        to: REJECTED
        trigger: "system: HOP 4 of the limit-exhaustion cascade"
        actor: system
        preconditions: ["invoice.status == ADJUSTED", "the invoice's assignment was closed in HOP 3 of the same cascade"]
        side_effects: ["sets hold_reason = LIMIT_EXHAUSTED", "increments DefenseInvoice.version by 1"]

  - entity: IndemnityPayment
    initial_state: PENDING_APPROVAL
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /epli/indemnity-payments/{payment_id}/approve"
        actor: ClaimsManager
        preconditions:
          - "payment.status == PENDING_APPROVAL"
          - "X-User-ID != payment.created_by_user_id (segregation of duties)"
          - "if the claim has a related_claim_group_id, that RelatedClaimGroup.status == OPEN"
          - "insurer_portion_cents <= the applicable sublimit remaining (wage_hour_sublimit_remaining_cents when sublimit_bucket == WAGE_HOUR, third_party_sublimit_remaining_cents when THIRD_PARTY)"
          - "insurer_portion_cents <= Policy.aggregate_limit_remaining_cents"
        side_effects:
          - "CASCADE HOP 1: recomputes Claim.retention_satisfied_cents and Claim.indemnity_paid_cents, and moves the Claim to RESOLVED when it was COVERAGE_ACCEPTED or DEFENSE_OPEN"
          - "CASCADE HOP 1b: the same Claim mutation recomputes RelatedClaimGroup.retention_paid_cents when the claim is a group member, locking the group at OPEN -> LOCKED once the shared retention is satisfied"
          - "CASCADE HOP 2: the Claim ledger mutation recomputes Policy.indemnity_paid_cents, the applicable sublimit remaining, and aggregate_limit_remaining_cents, advancing Policy.limit_posture (OPEN -> ERODED, OPEN -> EXHAUSTED, or ERODED -> EXHAUSTED)"
          - "CASCADE HOPS 3 and 4 fire when HOP 2 lands on EXHAUSTED, per the Policy limit_posture ERODED -> EXHAUSTED transition"
          - "sets approved_by_user_id = X-User-ID"
          - "increments IndemnityPayment.version by 1"
        note: "Depth-4 transitive cascade: payment -> claim -> policy -> defense assignments -> defense invoices."
      - from: PENDING_APPROVAL
        to: VOIDED
        trigger: "POST /epli/indemnity-payments/{payment_id}/void"
        actor: ClaimsManager
        preconditions: ["payment.status == PENDING_APPROVAL"]
        side_effects: ["records void_reason", "no ledger changes, because an unapproved payment never debited anything", "increments IndemnityPayment.version by 1"]
      - from: APPROVED
        to: VOIDED
        trigger: "POST /epli/indemnity-payments/{payment_id}/void"
        actor: ClaimsManager
        preconditions: ["payment.status == APPROVED"]
        side_effects:
          - "records void_reason"
          - "restores Claim.retention_satisfied_cents by exactly retention_portion_cents and Claim.indemnity_paid_cents by exactly insurer_portion_cents"
          - "restores RelatedClaimGroup.retention_paid_cents by exactly retention_portion_cents when the claim is a group member, possibly unlocking LOCKED -> OPEN"
          - "restores Policy.indemnity_paid_cents, the applicable sublimit remaining and aggregate_limit_remaining_cents by exactly insurer_portion_cents, possibly regressing limit_posture"
          - "the Claim status is NOT rolled back from RESOLVED"
          - "increments IndemnityPayment.version by 1"
        note: "Compensating action; the conserved quantity is the policy aggregate limit."

  - entity: PreSuitResolution
    initial_state: OFFERED
    terminal_states: [ACCEPTED, LAPSED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /epli/pre-suit-resolutions/{resolution_id}/accept"
        actor: ClaimsAdjuster
        preconditions:
          - "resolution.status == OFFERED"
          - "logical clock <= resolution.offer_expires_at"
          - "the Claim.status IN {UNDER_REVIEW, COVERAGE_ACCEPTED, DEFENSE_OPEN}"
          - "the Claim.notice_type == ADMIN_CHARGE"
          - "elapsed_days_at_accept <= the pre_suit_window_days of the Jurisdiction resolved by code == Applicant.primary_jurisdiction_code"
        side_effects:
          - "sets elapsed_days_at_accept and incentive_credit_cents via calculations.pre_suit_incentive_credit"
          - "posts incentive_credit_cents to Claim.pre_suit_credit_cents and recomputes Claim.applied_retention_cents"
          - "moves the Claim to RESOLVED when it was COVERAGE_ACCEPTED or DEFENSE_OPEN"
          - "increments PreSuitResolution.version by 1"
      - from: OFFERED
        to: LAPSED
        trigger: "system: POST /epli/_clock/set_current_utc advances the logical clock past resolution.offer_expires_at"
        actor: system
        preconditions: ["resolution.status == OFFERED", "new clock instant > resolution.offer_expires_at"]
        side_effects: ["no credit is posted to the claim", "increments PreSuitResolution.version by 1"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assessment-create-stale-applicant
    parent_entity: Applicant
    write_endpoint: "POST /epli/exposure-assessments"
    occ_field: "expected_applicant_version"
    description: |
      Creating an ExposureAssessment against an Applicant whose version has advanced
      since the client last observed it is rejected. A new assessment legitimately
      supersedes every prior PRICED / REFERRED / APPROVED assessment for the same
      applicant, so the second create would succeed under the natural product
      semantics; the OCC check is what makes it deterministic that the writer priced
      against a stale credit and headcount basis (a completed or revoked
      RiskManagementService, or a PATCH to headcount, bumps Applicant.version).
    error_id: ERR_STALE_APPLICANT_VERSION
    http_status: 412

  - rule_id: payment-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /epli/claims/{claim_id}/indemnity-payments"
    occ_field: "expected_policy_version"
    description: |
      Creating an IndemnityPayment against a Policy whose version has advanced since
      the client last observed it is rejected. Two payments on the same claim are both
      legitimate under the product spec (a claim may settle in tranches), so the second
      create would otherwise succeed while its author still believes the earlier
      sublimit and aggregate remaining figures; OCC reduces that to a stale-version
      check the client can retry after re-reading the policy ledger.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: group-attach-stale-group
    parent_entity: RelatedClaimGroup
    write_endpoint: "POST /epli/related-claim-groups/{group_id}/claims"
    occ_field: "expected_related_claim_group_version"
    description: |
      Attaching a Claim to a RelatedClaimGroup whose version has advanced since the
      client last observed it is rejected. Every attach legitimately re-derives
      shared_retention_cents and retention_basis_claim_id, so a second attach is a
      valid product operation rather than an error; OCC ensures the writer that
      computed the aggregation on an older membership and an older shared retention
      is told to re-read the group first.
    error_id: ERR_STALE_GROUP_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# All money is whole cents. All rounding is ROUND_HALF_UP unless stated otherwise.
# ---------------------------------------------------------------------------
calculations:

  - name: turnover_pct
    algorithm_type: threshold
    inputs:
      - "separations: integer (which separations count is variant-dependent -- see calculations.indicated_premium)"
      - "Applicant.total_headcount"
    formula: |
      turnover_pct = round_half_up(separations * 100 / total_headcount, 2)
    input_set_filter: "none; both inputs are scalar fields of the single Applicant row"
    constants: {}
    precision: "2 decimal places, ROUND_HALF_UP"
    writes:
      - "Applicant.turnover_pct (always evaluated with separations = Applicant.prior_year_separations)"
      - "ExposureAssessment.turnover_pct_snapshot (evaluated with separations = Applicant.prior_year_separations at the price transition)"
    note: "Applicant.turnover_pct is recomputed on POST /epli/applicants and on every PATCH /epli/applicants/{applicant_id} that supplies prior_year_separations or total_headcount."

  - name: hazard_load_pct
    algorithm_type: threshold
    inputs:
      - "Applicant.jurisdiction_headcounts[].code"
      - "Jurisdiction.hazard_tier for each resolved jurisdiction"
    formula: |
      jurisdiction_count = length(Applicant.jurisdiction_headcounts)
      max_tier          = the maximum hazard_tier under the total order T1 < T2 < T3 < T4
                          over the Jurisdiction rows resolved by code
      base_pct          = HAZARD_TIER_LOAD_PCT[max_tier]
      spread_pct        = MULTI_JURISDICTION_SPREAD_PCT * (jurisdiction_count - 1)
      hazard_load_pct   = min(HAZARD_LOAD_CAP_PCT, base_pct + spread_pct)
    input_set_filter: "every Jurisdiction whose code appears in Applicant.jurisdiction_headcounts[].code; Applicant.primary_jurisdiction_code carries no extra weight here"
    constants:
      HAZARD_TIER_LOAD_PCT: { T1: 0.025, T2: 0.070, T3: 0.135, T4: 0.205 }
      MULTI_JURISDICTION_SPREAD_PCT: 0.010
      HAZARD_LOAD_CAP_PCT: 0.30
    precision: "3 decimal places, exact (all inputs are 3-decimal constants)"
    writes: ["Applicant.hazard_load_pct"]
    note: "The worst tier governs, not the primary jurisdiction's tier, and not a headcount-weighted average."

  - name: risk_credit_pct
    algorithm_type: aggregation
    inputs: ["RiskManagementService.credit_pct", "RiskManagementService.status"]
    formula: |
      raw_pct         = sum(credit_pct) over services WHERE applicant_id == this applicant
                        AND status == 'ACTIVE'
      risk_credit_pct = min(RISK_CREDIT_CAP_PCT, raw_pct)
    input_set_filter: "ONLY RiskManagementService rows with status == ACTIVE; PENDING, LAPSED and REVOKED rows contribute nothing"
    constants:
      RISK_CREDIT_CAP_PCT: 0.15
    precision: "2 decimal places, ROUND_HALF_UP"
    writes: ["Applicant.risk_credit_pct"]
    note: "Recomputed on the complete / revoke / lapse transitions of RiskManagementService; each recomputation increments Applicant.version by 1 and stales the applicant's PRICED assessments."

  - name: exposure_score
    algorithm_type: weighted_scoring
    inputs:
      - "Applicant.total_headcount"
      - "Applicant.turnover_pct"
      - "Applicant.jurisdiction_headcounts (count) and the hazard_tier of each resolved Jurisdiction"
      - "RiskManagementService.service_type for ACTIVE services"
    formula: |
      headcount_points = HEADCOUNT_BAND_POINTS band containing total_headcount
      hazard_points    = HAZARD_TIER_POINTS[max_tier]
                         + min(MULTI_JURISDICTION_POINT_CAP,
                               MULTI_JURISDICTION_POINTS_PER_EXTRA * (jurisdiction_count - 1))
      turnover_points  = min(TURNOVER_POINT_CAP, round_half_up(turnover_pct * TURNOVER_POINT_WEIGHT, 2))
      credit_points    = sum(RISK_SERVICE_SCORE_CREDIT[service_type]) over ACTIVE services
                         (each term is negative)
      exposure_score   = max(0.00, min(100.00,
                             headcount_points + hazard_points + turnover_points + credit_points))
    input_set_filter: "Jurisdiction rows resolved from jurisdiction_headcounts[].code (max_tier uses the same total order as hazard_load_pct); RiskManagementService rows with status == ACTIVE only"
    constants:
      HEADCOUNT_BAND_POINTS: { "1..50": 8, "51..250": 16, "251..1000": 26, "1001..": 34 }
      HAZARD_TIER_POINTS: { T1: 5, T2: 12, T3: 20, T4: 28 }
      MULTI_JURISDICTION_POINTS_PER_EXTRA: 2.00
      MULTI_JURISDICTION_POINT_CAP: 8.00
      TURNOVER_POINT_WEIGHT: 0.80
      TURNOVER_POINT_CAP: 30.00
      RISK_SERVICE_SCORE_CREDIT: { HOTLINE_SUBSCRIPTION: -6.00, HANDBOOK_REVIEW: -4.00, MANAGER_TRAINING: -3.00 }
      REFERRAL_SCORE_THRESHOLD: 72.00
    precision: "2 decimal places, ROUND_HALF_UP; turnover_points is rounded to 2 places BEFORE the cap and before the sum, so rounding does not accumulate across terms"
    writes: ["Applicant.exposure_score", "ExposureAssessment.exposure_score_snapshot"]
    note: |
      Referral rule (a closed threshold on the high side): the price transition lands on REFERRED
      when exposure_score_snapshot >= REFERRAL_SCORE_THRESHOLD (72.00) and on PRICED when it is
      strictly below. exposure_score is a cross-entity derived value: it changes when a
      Jurisdiction is added to the applicant, when headcount or separations change, and when a
      RiskManagementService becomes ACTIVE, LAPSED or REVOKED.

  - name: indicated_premium
    algorithm_type: tiered_pricing
    variants: [QUOTE, BOUND_AUDIT]
    inputs:
      - "RatePlan.base_rate_per_employee_cents, RatePlan.min_premium_cents"
      - "Applicant.total_headcount, Applicant.jurisdiction_headcounts, Applicant.prior_year_separations, Applicant.separations_since_assessment, Applicant.hazard_load_pct"
      - "ExposureAssessment.requested_aggregate_limit_cents, ExposureAssessment.requested_retention_cents"
      - "RiskManagementService rows of the applicant"
    formula: |
      # ---- step 1: component A, base premium (PER-JURISDICTION ROUND-THEN-SUM) ----------
      headcount_factor      = HEADCOUNT_FACTOR band containing total_headcount
      per_employee_exact    = base_rate_per_employee_cents * headcount_factor   # NOT rounded
      for each entry in jurisdiction_headcounts, iterated by entry.code ASC:
          part[entry.code]  = round_half_up(entry.headcount * per_employee_exact)
      base_premium_cents(A) = sum(part[*])
      # The rounding order is PINNED: each jurisdiction's share is rounded to whole cents
      # FIRST and the rounded shares are then summed. Rounding the single product
      # total_headcount * per_employee_exact instead can differ by up to
      # (jurisdiction_count - 1) cents.

      # ---- steps 2-5: loads and the retention credit, each keyed on A ------------------
      turnover_load_cents(B)    = round_half_up(A * TURNOVER_LOAD_PCT band containing turnover_pct)
      hazard_load_cents(C)      = round_half_up(A * Applicant.hazard_load_pct)
      limit_factor              = max(0, (requested_aggregate_limit_cents / LIMIT_REFERENCE_CENTS - 1)
                                          * LIMIT_LOAD_PER_UNIT_PCT)
      limit_load_cents(D)       = round_half_up(A * limit_factor)
      retention_credit_cents(E) = round_half_up(A * RETENTION_CREDIT_PCT band containing
                                                requested_retention_cents)

      # ---- steps 6-8: gross, risk-management credit, floor ----------------------------
      gross_premium_cents        = A + B + C + D          # loads only; credits are NOT in gross
      risk_mgmt_credit_cents(F)  = round_half_up(gross_premium_cents * risk_credit_pct)
      net_premium_cents          = gross_premium_cents - E - F
      result                     = max(net_premium_cents, RatePlan.min_premium_cents)
      # The minimum-premium floor is applied AFTER both credits, never before them.
    variant_differences:
      QUOTE:
        separations_basis: "Applicant.prior_year_separations only"
        risk_service_filter: "RiskManagementService rows with status == ACTIVE at the moment of the price transition"
        applied_at: "POST /epli/exposure-assessments/{assessment_id}/price"
        writes: "ExposureAssessment.base_premium_cents, turnover_load_cents, hazard_load_cents, limit_load_cents, retention_credit_cents, risk_mgmt_credit_cents, indicated_premium_cents"
      BOUND_AUDIT:
        separations_basis: "Applicant.prior_year_separations + Applicant.separations_since_assessment"
        risk_service_filter: "RiskManagementService rows with status == ACTIVE AND completed_at <= Policy.effective_from -- a service that only became active after inception earns no credit on the bound audit"
        applied_at: "POST /epli/policies (evaluated once, at bind)"
        writes: "Policy.bound_premium_cents and Policy.premium_variance_cents = bound_premium_cents - ExposureAssessment.indicated_premium_cents (may be negative)"
    input_set_filter: "components B..F all key off component A, never off each other; the jurisdiction loop in step 1 consumes every entry of jurisdiction_headcounts"
    constants:
      HEADCOUNT_FACTOR: { "1..50": 1.000, "51..250": 0.925, "251..1000": 0.855, "1001..": 0.785 }
      TURNOVER_LOAD_PCT: { "0.00..9.99": 0.00, "10.00..19.99": 0.06, "20.00..34.99": 0.14, "35.00..": 0.25 }
      LIMIT_REFERENCE_CENTS: 100000000
      LIMIT_LOAD_PER_UNIT_PCT: 0.10
      RETENTION_CREDIT_PCT: { "0..2499999": 0.00, "2500000..9999999": 0.05, "10000000..": 0.11 }
    precision: "every component is rounded to whole cents with ROUND_HALF_UP at the step that produces it; per_employee_exact and limit_factor are the only values carried unrounded"
    note: |
      Band boundaries are inclusive on the low side. turnover_pct 35.00 exactly lands in the
      0.25 band; requested_retention_cents 2500000 exactly lands in the 0.05 band.

  - name: coverage_bucket
    algorithm_type: threshold
    inputs: ["Claim.claim_type", "Claim.claimant_class"]
    formula: |
      if claim_type == 'WAGE_AND_HOUR':                     coverage_bucket = 'WAGE_HOUR'
      elif claimant_class in ('CUSTOMER', 'VENDOR'):        coverage_bucket = 'THIRD_PARTY'
      else:                                                 coverage_bucket = 'FIRST_PARTY'
    input_set_filter: "none"
    constants: {}
    precision: "n/a"
    writes: ["Claim.coverage_bucket", "IndemnityPayment.sublimit_bucket (copied at payment creation)"]
    note: |
      The order is pinned: a WAGE_AND_HOUR claim brought by a CUSTOMER is bucketed WAGE_HOUR,
      not THIRD_PARTY, so its insurer portion debits the wage-and-hour sublimit. This is
      DELIBERATELY different from calculations.claim_retention, where both attributes stack.
      FIRST_PARTY has no sublimit; a FIRST_PARTY insurer portion is checked against the policy
      aggregate limit only.

  - name: claim_retention
    algorithm_type: threshold
    variants: [PER_CLAIM, GROUP_AGGREGATED]
    inputs:
      - "Policy.per_claim_retention_cents"
      - "Claim.claim_type, Claim.claimant_class, Claim.pre_suit_credit_cents"
      - "RelatedClaimGroup membership and the per_claim_retention_cents of every member"
    formula: |
      # ---- steps 1-3: the claim's own multiplier-adjusted retention (both variants) -----
      base_cents = Policy.per_claim_retention_cents
      multiplier = 1.00
      if claim_type == 'WAGE_AND_HOUR':               multiplier = multiplier * WAGE_HOUR_RETENTION_MULTIPLIER
      if claimant_class in ('CUSTOMER', 'VENDOR'):    multiplier = multiplier * THIRD_PARTY_RETENTION_MULTIPLIER
      per_claim_retention_cents = round_half_up(base_cents * multiplier)
      # The two multipliers STACK MULTIPLICATIVELY; they are not mutually exclusive and the
      # larger one does not simply win.
    variant_differences:
      PER_CLAIM:
        selected_when: "Claim.related_claim_group_id IS NULL (Claim.retention_basis == 'PER_CLAIM')"
        applied_retention: "Claim.applied_retention_cents = max(0, per_claim_retention_cents - Claim.pre_suit_credit_cents)"
        waterfall_bucket: "calculations.indemnity_waterfall draws the retention from Claim.applied_retention_cents - Claim.retention_satisfied_cents"
      GROUP_AGGREGATED:
        selected_when: "Claim.related_claim_group_id IS NOT NULL (Claim.retention_basis == 'GROUP_AGGREGATED')"
        applied_retention: "Claim.applied_retention_cents = 0; the group bears the retention instead of the claim"
        group_retention: "RelatedClaimGroup.shared_retention_cents = max(per_claim_retention_cents) over ALL member claims regardless of member status; RelatedClaimGroup.retention_basis_claim_id is the member achieving that maximum, ties broken by member Claim.created_at ASC"
        waterfall_bucket: "calculations.indemnity_waterfall draws the retention from RelatedClaimGroup.shared_retention_cents - RelatedClaimGroup.retention_paid_cents, which is SHARED across every member claim"
    input_set_filter: "shared_retention_cents scans every Claim with related_claim_group_id == the group id; no status filter"
    constants:
      WAGE_HOUR_RETENTION_MULTIPLIER: 1.50
      THIRD_PARTY_RETENTION_MULTIPLIER: 1.25
    precision: "whole cents, ROUND_HALF_UP"
    note: |
      Reconciliation on variant switch: attaching a claim to a group re-derives the claim's
      applied_retention_cents to 0 and re-derives the group's shared_retention_cents and
      retention_basis_claim_id. Retention already satisfied on the claim
      (Claim.retention_satisfied_cents) is carried into RelatedClaimGroup.retention_paid_cents
      by the group's aggregation, so no retention is double-collected.

  - name: indemnity_waterfall
    algorithm_type: waterfall_allocation
    inputs:
      - "IndemnityPayment.amount_cents"
      - "Claim.retention_basis, Claim.applied_retention_cents, Claim.retention_satisfied_cents"
      - "RelatedClaimGroup.shared_retention_cents, RelatedClaimGroup.retention_paid_cents"
      - "Policy.wage_hour_sublimit_remaining_cents, Policy.third_party_sublimit_remaining_cents, Policy.aggregate_limit_remaining_cents"
    formula: |
      # ---- bucket 1: retention (must fill completely before the insurer attaches) -------
      if Claim.retention_basis == 'PER_CLAIM':
          retention_remaining = max(0, Claim.applied_retention_cents - Claim.retention_satisfied_cents)
      else:  # GROUP_AGGREGATED
          retention_remaining = max(0, group.shared_retention_cents - group.retention_paid_cents)
      retention_portion_cents = min(amount_cents, retention_remaining)

      # ---- bucket 2: insurer portion, checked against sublimit then aggregate ----------
      insurer_portion_cents   = amount_cents - retention_portion_cents

      # ---- bucket 3: limit checks, evaluated at APPROVAL, in this pinned order ---------
      if sublimit_bucket == 'WAGE_HOUR'   and insurer_portion_cents > Policy.wage_hour_sublimit_remaining_cents:
          reject with ERR_WAGE_HOUR_SUBLIMIT_EXHAUSTED
      if sublimit_bucket == 'THIRD_PARTY' and insurer_portion_cents > Policy.third_party_sublimit_remaining_cents:
          reject with ERR_THIRD_PARTY_SUBLIMIT_EXHAUSTED
      if insurer_portion_cents > Policy.aggregate_limit_remaining_cents:
          reject with ERR_AGGREGATE_LIMIT_EXHAUSTED
      # FIRST_PARTY skips the sublimit check entirely and is bounded only by the aggregate.
    input_set_filter: "retention_satisfied_cents / retention_paid_cents count ONLY payments with status == APPROVED; a PENDING_APPROVAL payment reserves nothing"
    constants: {}
    precision: "whole cents; no rounding occurs, every term is already integral"
    writes: ["IndemnityPayment.retention_portion_cents", "IndemnityPayment.insurer_portion_cents"]
    note: |
      The split is computed and frozen at payment CREATION; the limit checks in bucket 3 run at
      APPROVAL. A payment whose insurer portion is exactly equal to the remaining sublimit or
      the remaining aggregate is ALLOWED (the comparison is strictly greater-than) and drives
      Policy.limit_posture to EXHAUSTED when the aggregate remaining reaches exactly 0.

  - name: defense_invoice_audit
    algorithm_type: waterfall_allocation
    inputs:
      - "DefenseInvoice.partner_hours, associate_hours, paralegal_hours, block_billed_hours, expenses_cents"
      - "DefenseAssignment.partner_rate_cents_per_hour, associate_rate_cents_per_hour, paralegal_rate_cents_per_hour (the SNAPSHOT rates, not the firm's current schedule)"
    formula: |
      # ---- step 1: fees at the assignment's snapshot rates ----------------------------
      billed_fees_cents = round_half_up(partner_hours   * A.partner_rate_cents_per_hour
                                      + associate_hours * A.associate_rate_cents_per_hour
                                      + paralegal_hours * A.paralegal_rate_cents_per_hour)

      # ---- step 2: litigation-guideline rate caps (per timekeeper class) --------------
      rate_cap_excess_cents = round_half_up(partner_hours
                                 * max(0, A.partner_rate_cents_per_hour - GUIDELINE_PARTNER_CAP_CENTS))
                            + round_half_up(associate_hours
                                 * max(0, A.associate_rate_cents_per_hour - GUIDELINE_ASSOCIATE_CAP_CENTS))
      fees_after_cap_cents  = billed_fees_cents - rate_cap_excess_cents
      # Paralegal time has no guideline rate cap.

      # ---- step 3: block-billing reduction on POST-RATE-CAP fees ----------------------
      total_hours           = partner_hours + associate_hours + paralegal_hours
      block_share           = block_billed_hours / total_hours   if total_hours > 0 else 0
      block_reduction_cents = round_half_up(fees_after_cap_cents * block_share
                                            * BLOCK_BILL_REDUCTION_PCT)
      allowed_fees_cents    = fees_after_cap_cents - block_reduction_cents

      # ---- step 4: expense cap keyed on POST-REDUCTION allowed fees -------------------
      expense_allowance_cents    = round_half_up(allowed_fees_cents * EXPENSE_CAP_PCT)
      expense_disallowance_cents = max(0, expenses_cents - expense_allowance_cents)
      # PINNED: the expense cap is a percentage of allowed_fees_cents (after the rate-cap AND
      # block-billing reductions), NOT of billed_fees_cents and NOT of fees_after_cap_cents.

      # ---- step 5: totals ------------------------------------------------------------
      allowed_amount_cents      = allowed_fees_cents
                                  + (expenses_cents - expense_disallowance_cents)
      guideline_reduction_cents = rate_cap_excess_cents + block_reduction_cents
                                  + expense_disallowance_cents
      disallowed_amount_cents   = (billed_fees_cents + expenses_cents) - allowed_amount_cents
    input_set_filter: "single invoice; rates come from the DefenseAssignment snapshot so a later PATCH-equivalent change to DefensePanelFirm rates cannot retroactively move an audit"
    constants:
      GUIDELINE_PARTNER_CAP_CENTS: 75000
      GUIDELINE_ASSOCIATE_CAP_CENTS: 45000
      BLOCK_BILL_REDUCTION_PCT: 0.20
      EXPENSE_CAP_PCT: 0.08
    precision: "whole cents, ROUND_HALF_UP, applied independently at steps 1, 2, 3 and 4; the four reductions are never combined into one rounding"
    writes: ["DefenseInvoice.billed_fees_cents", "rate_cap_excess_cents", "block_reduction_cents", "expense_disallowance_cents", "guideline_reduction_cents", "allowed_amount_cents", "disallowed_amount_cents"]
    note: "Re-run in full on every audit transition, including the ADJUSTED -> UNDER_AUDIT re-audit after a counsel dispute."

  - name: blended_rate
    algorithm_type: weighted_scoring
    inputs: ["DefensePanelFirm.partner_rate_cents_per_hour", "associate_rate_cents_per_hour", "paralegal_rate_cents_per_hour"]
    formula: |
      blended_rate_cents = round_half_up(  PARTNER_WEIGHT   * partner_rate_cents_per_hour
                                         + ASSOCIATE_WEIGHT * associate_rate_cents_per_hour
                                         + PARALEGAL_WEIGHT * paralegal_rate_cents_per_hour)
    input_set_filter: "single firm; recomputed on firm creation"
    constants:
      PARTNER_WEIGHT: 0.35
      ASSOCIATE_WEIGHT: 0.50
      PARALEGAL_WEIGHT: 0.15
    precision: "whole cents, ROUND_HALF_UP; the weights sum to exactly 1.00"
    writes: ["DefensePanelFirm.blended_rate_cents"]

  - name: panel_firm_selection
    algorithm_type: constraint_propagation
    inputs:
      - "every DefensePanelFirm row"
      - "Applicant.primary_jurisdiction_code (resolved through Claim -> Policy -> Applicant)"
      - "the requested engagement window [engagement_from, engagement_to)"
      - "request field excluded_panel_firm_ids (array of strings, optional)"
    formula: |
      # ---- eligibility filter (all four conditions must hold) -------------------------
      candidates = every DefensePanelFirm F such that
          F.status == 'PANEL_ACTIVE'
        AND Applicant.primary_jurisdiction_code IN F.jurisdiction_codes
        AND F.id NOT IN excluded_panel_firm_ids
        AND overlapping_matters(F) < F.capacity_open_matters
      where overlapping_matters(F) = count of DefenseAssignment rows with
          panel_firm_id == F.id
        AND status IN ('ACTIVE', 'SUSPENDED_FUNDING')
        AND engagement window overlapping the requested window under the HALF-OPEN rule
            existing.engagement_from < requested.engagement_to
            AND requested.engagement_from < existing.engagement_to

      # ---- ranking, then deterministic tie-breaks ------------------------------------
      rank candidates by  blended_rate_cents ASC
      tie-break 1:        TIER_ORDINAL[tier] ASC        (LOCAL 0 < REGIONAL 1 < NATIONAL 2)
      tie-break 2:        created_at ASC
      winner = the first candidate after ranking; DefenseAssignment.selection_reason = 'AUTO_SELECTED'

      # ---- empty-pool fallback -------------------------------------------------------
      if candidates is empty: reject with ERR_NO_ELIGIBLE_PANEL_FIRM (422)
    input_set_filter: "PANEL_SUSPENDED firms are excluded entirely; CLOSED assignments never consume capacity; the capacity count is window-scoped, so a firm at capacity for one window can still take a disjoint window"
    constants:
      TIER_ORDINAL: { LOCAL: 0, REGIONAL: 1, NATIONAL: 2 }
    precision: "n/a"
    note: |
      The selector runs ONLY when the POST /epli/claims/{claim_id}/defense-assignments request
      omits panel_firm_id. When panel_firm_id IS supplied, selection_reason becomes
      CLIENT_DIRECTED and the eligibility filter is still enforced -- a suspended firm, an
      out-of-jurisdiction firm or a firm at window capacity is refused with
      ERR_PANEL_FIRM_NOT_ACTIVE, ERR_NO_ELIGIBLE_PANEL_FIRM or ERR_PANEL_CAPACITY_EXCEEDED
      respectively. Firm id is never a tie-break; created_at ASC is the final arbiter.

  - name: pre_suit_incentive_credit
    algorithm_type: threshold
    inputs:
      - "PreSuitResolution.settlement_offer_cents"
      - "Claim.notice_type, Claim.first_notice_at"
      - "Jurisdiction.pre_suit_window_days for the jurisdiction resolved by code == Applicant.primary_jurisdiction_code"
      - "the logical clock at the accept transition"
    formula: |
      elapsed_days_at_accept = floor((accept_instant - Claim.first_notice_at) / 86400 seconds)
      if Claim.notice_type != 'ADMIN_CHARGE':                 reject with ERR_PRE_SUIT_NOT_ELIGIBLE
      if elapsed_days_at_accept > Jurisdiction.pre_suit_window_days:
                                                              reject with ERR_PRE_SUIT_WINDOW_CLOSED
      incentive_credit_cents = min(PRE_SUIT_CREDIT_CAP_CENTS,
                                   round_half_up(settlement_offer_cents * PRE_SUIT_CREDIT_PCT))
      # posted to Claim.pre_suit_credit_cents, which reduces Claim.applied_retention_cents
      # through calculations.claim_retention (PER_CLAIM variant) but never below 0
    input_set_filter: "a single PreSuitResolution; only the ACCEPTED transition posts a credit, a LAPSED offer posts nothing"
    constants:
      PRE_SUIT_CREDIT_PCT: 0.30
      PRE_SUIT_CREDIT_CAP_CENTS: 750000
    precision: "whole cents, ROUND_HALF_UP; the cap is applied AFTER the rounding"
    note: "The window comparison is inclusive: elapsed_days_at_accept exactly equal to pre_suit_window_days still earns the credit."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules -- evaluated in strict ascending `priority` order.
# The FIRST rule whose condition is violated produces the response; no later
# rule is evaluated. Every priority is distinct.
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    rule: "X-User-ID header must be present and non-empty on every endpoint under /epli"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: authorization
    rule: "the caller's role must be listed in the endpoint's `roles`"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: request_shape
    rule: "required body fields present; no unknown fields; types, enum membership, numeric ranges, decimal-place limits and ISO-8601 instant format valid; interval fields ordered (effective_to > effective_from, engagement_to > engagement_from, period_end >= period_start); pagination limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    rule: "every id in the path template must resolve to an existing row of the expected entity"
    error_id: "ERR_JURISDICTION_NOT_FOUND | ERR_RATE_PLAN_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_SERVICE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_GROUP_NOT_FOUND | ERR_PANEL_FIRM_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_RESOLUTION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 5
    category: existence
    rule: "every foreign key supplied in the request BODY must resolve: applicant_id, rate_plan_id, exposure_assessment_id, policy_id, lead_claim_id, claim_id, related_to_claim_id, panel_firm_id, and every entry of excluded_panel_firm_ids; jurisdiction natural keys (primary_jurisdiction_code, jurisdiction_headcounts[].code, jurisdiction_codes[]) must resolve to an existing Jurisdiction.code"
    error_id: "ERR_APPLICANT_NOT_FOUND | ERR_RATE_PLAN_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_PANEL_FIRM_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND"
    http_status: 404
    applies_to: "every write endpoint accepting a foreign key or a jurisdiction code in the body"

  - priority: 6
    category: ownership
    rule: "cross-aggregate consistency: Claim.related_to_claim_id must reference a Claim with the same policy_id; RelatedClaimGroup.lead_claim_id and every attached claim must have policy_id == group.policy_id; a DefenseInvoice may only be submitted or disputed by the PanelCounsel principal whose id equals the assignment's panel_firm_id; a PolicyholderContact may only read rows belonging to its own Applicant"
    error_id: "ERR_OWNERSHIP_MISMATCH | ERR_NOT_ASSIGNED_COUNSEL"
    http_status: 403
    applies_to: "POST /epli/policies/{policy_id}/claims, POST /epli/related-claim-groups, POST /epli/related-claim-groups/{group_id}/claims, POST /epli/defense-assignments/{assignment_id}/invoices, POST /epli/defense-invoices/{invoice_id}/dispute, all entity_backed reads"

  - priority: 7
    category: concurrency
    rule: "the OCC field declared by the matching §1.2.1 rule must equal the parent's current version"
    error_id: "ERR_STALE_APPLICANT_VERSION | ERR_STALE_POLICY_VERSION | ERR_STALE_GROUP_VERSION"
    http_status: 412
    applies_to: "POST /epli/exposure-assessments, POST /epli/claims/{claim_id}/indemnity-payments, POST /epli/related-claim-groups/{group_id}/claims"

  - priority: 8
    category: state
    rule: "the target entity's own current status must permit the requested transition per §1.2"
    error_id: "ERR_RATE_PLAN_NOT_ACTIVATABLE | ERR_SERVICE_NOT_COMPLETABLE | ERR_SERVICE_NOT_REVOCABLE | ERR_ASSESSMENT_NOT_PRICEABLE | ERR_ASSESSMENT_NOT_DECIDABLE | ERR_POLICY_NOT_SUSPENDABLE | ERR_POLICY_NOT_REINSTATABLE | ERR_CLAIM_NOT_REVIEWABLE | ERR_COVERAGE_ALREADY_DECIDED | ERR_CLAIM_NOT_CLOSABLE | ERR_CLAIM_NOT_REOPENABLE | ERR_ASSIGNMENT_NOT_CLOSABLE | ERR_INVOICE_NOT_AUDITABLE | ERR_INVOICE_NOT_DISPUTABLE | ERR_INVOICE_NOT_APPROVABLE | ERR_INVOICE_NOT_VOIDABLE | ERR_PAYMENT_NOT_APPROVABLE | ERR_PAYMENT_NOT_VOIDABLE | ERR_RESOLUTION_NOT_ACCEPTABLE | ERR_PANEL_FIRM_NOT_SUSPENDABLE"
    http_status: 409
    applies_to: "every action endpoint driving a §1.2 transition"

  - priority: 9
    category: state
    rule: "cross-entity state preconditions: the OWNING or REFERENCED entity must itself be in an admissible state even though the target entity's own state is fine -- Policy.status IN {BOUND, ACTIVE} and Claim.coverage_gated == false for claim work; RatePlan.status == ACTIVE for a new assessment; DefensePanelFirm.status == PANEL_ACTIVE for a client-directed assignment; RelatedClaimGroup.status == OPEN for a payment approval on a member claim; DefenseAssignment.status != CLOSED for a new invoice"
    error_id: "ERR_POLICY_NOT_IN_FORCE | ERR_RATE_PLAN_NOT_ACTIVE | ERR_PANEL_FIRM_NOT_ACTIVE | ERR_GROUP_LOCKED | ERR_ASSIGNMENT_CLOSED"
    http_status: 409
    applies_to: "POST /epli/exposure-assessments, POST /epli/policies/{policy_id}/claims, POST /epli/claims/{claim_id}/start-review, .../coverage-decision, .../reopen, .../defense-assignments, .../indemnity-payments, POST /epli/indemnity-payments/{payment_id}/approve, POST /epli/defense-assignments/{assignment_id}/invoices"

  - priority: 10
    category: business_safety
    rule: "segregation of duties on all three four-eyes gates: X-User-ID != ExposureAssessment.priced_by_user_id on approve; X-User-ID != DefenseInvoice.audited_by_user_id on approve; X-User-ID != IndemnityPayment.created_by_user_id on approve"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /epli/exposure-assessments/{assessment_id}/approve, POST /epli/defense-invoices/{invoice_id}/approve, POST /epli/indemnity-payments/{payment_id}/approve"

  - priority: 11
    category: business_safety
    rule: "an ExposureAssessment whose credit_basis_stale == true may not be approved; it must be re-priced first"
    error_id: ERR_CREDIT_BASIS_STALE
    http_status: 409
    applies_to: "POST /epli/exposure-assessments/{assessment_id}/approve"

  - priority: 12
    category: business_safety
    rule: "a Claim whose coverage_bucket == THIRD_PARTY may not be created on a Policy whose third_party_coverage_elected == false"
    error_id: ERR_THIRD_PARTY_COVERAGE_NOT_ELECTED
    http_status: 422
    applies_to: "POST /epli/policies/{policy_id}/claims"

  - priority: 13
    category: business_temporal
    rule: "Claim.first_notice_at must fall in [Policy.effective_from, Policy.effective_to)"
    error_id: ERR_CLAIM_OUTSIDE_POLICY_PERIOD
    http_status: 422
    applies_to: "POST /epli/policies/{policy_id}/claims"

  - priority: 14
    category: business_temporal
    rule: "the Claim.notice_type must be ADMIN_CHARGE for a pre-suit resolution to be offered or accepted"
    error_id: ERR_PRE_SUIT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /epli/claims/{claim_id}/pre-suit-resolutions, POST /epli/pre-suit-resolutions/{resolution_id}/accept"

  - priority: 15
    category: business_temporal
    rule: "on accept, elapsed_days_at_accept must be <= the pre_suit_window_days of the Jurisdiction resolved by code == Applicant.primary_jurisdiction_code, and the logical clock must be <= offer_expires_at"
    error_id: ERR_PRE_SUIT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /epli/pre-suit-resolutions/{resolution_id}/accept"

  - priority: 16
    category: business_temporal
    rule: "a DefenseInvoice billing period must lie inside its assignment's engagement window: period_start >= DefenseAssignment.engagement_from AND period_end < DefenseAssignment.engagement_to"
    error_id: ERR_INVOICE_OUTSIDE_ENGAGEMENT
    http_status: 422
    applies_to: "POST /epli/defense-assignments/{assignment_id}/invoices"

  - priority: 17
    category: business_temporal
    rule: "billing periods on one DefenseAssignment are single-occupancy CLOSED intervals; a new invoice collides with an existing non-VOIDED, non-REJECTED invoice iff new.period_start <= existing.period_end AND existing.period_start <= new.period_end (touching endpoints DO collide)"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /epli/defense-assignments/{assignment_id}/invoices"

  - priority: 18
    category: business_temporal
    rule: "a new RiskManagementService of the same service_type may not overlap an existing non-REVOKED service of that type on the same Applicant, where the windows are HALF-OPEN and the existing window is extended by SERVICE_GAP_BUFFER_DAYS = 30 on its high side: collision iff new.effective_from < existing.effective_to + 30 days AND existing.effective_from < new.effective_to"
    error_id: ERR_SERVICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /epli/applicants/{applicant_id}/risk-management-services"

  - priority: 19
    category: business_temporal
    rule: "policy periods for one Applicant are single-occupancy HALF-OPEN intervals across non-EXPIRED policies: collision iff new.effective_from < existing.effective_to AND existing.effective_from < new.effective_to (touching endpoints do NOT collide)"
    error_id: ERR_POLICY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /epli/policies"

  - priority: 20
    category: business_fiscal
    rule: "aggregate capacity: a DefensePanelFirm may not hold more than capacity_open_matters DefenseAssignment rows in status ACTIVE or SUSPENDED_FUNDING whose engagement windows overlap the requested window under the HALF-OPEN rule"
    error_id: ERR_PANEL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /epli/claims/{claim_id}/defense-assignments (client-directed form only; the auto-selector filters capacity out instead)"

  - priority: 21
    category: business_referential
    rule: "the panel_firm_selection candidate pool must be non-empty; a client-directed panel_firm_id that does not cover Applicant.primary_jurisdiction_code, or that appears in excluded_panel_firm_ids, is also refused here"
    error_id: ERR_NO_ELIGIBLE_PANEL_FIRM
    http_status: 422
    applies_to: "POST /epli/claims/{claim_id}/defense-assignments"

  - priority: 22
    category: business_referential
    rule: "a Claim attached to a RelatedClaimGroup must not already belong to a group (Claim.related_claim_group_id IS NULL), and the group's lead claim is attached at creation and cannot be re-attached"
    error_id: ERR_CLAIM_ALREADY_GROUPED
    http_status: 409
    applies_to: "POST /epli/related-claim-groups, POST /epli/related-claim-groups/{group_id}/claims"

  - priority: 23
    category: business_referential
    rule: "a Claim attached to a group with aggregation_basis IN {CLASS_ACTION_MEMBER, MASS_CLAIM_WAVE} must have claimant_count >= 1 and the SAME coverage_bucket as the group's lead claim; a group with aggregation_basis IN {COMMON_DECISION_MAKER, COMMON_POLICY_PRACTICE} accepts mixed buckets"
    error_id: ERR_GROUP_BASIS_MISMATCH
    http_status: 422
    applies_to: "POST /epli/related-claim-groups/{group_id}/claims"

  - priority: 24
    category: business_referential
    rule: "a Claim may be reopened at most REOPEN_LIMIT (1) time"
    error_id: ERR_CLAIM_REOPEN_LIMIT
    http_status: 409
    applies_to: "POST /epli/claims/{claim_id}/reopen"

  - priority: 25
    category: business_referential
    rule: "insurer money may not leave before the retention attaches: a DefenseInvoice may only be approved when its Claim has retention_satisfied_cents >= applied_retention_cents, or when the Claim belongs to a RelatedClaimGroup whose status == LOCKED"
    error_id: ERR_RETENTION_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /epli/defense-invoices/{invoice_id}/approve"

  - priority: 26
    category: business_fiscal
    rule: "DefenseAssignment.budget_spent_cents + invoice.allowed_amount_cents must be <= DefenseAssignment.budget_cap_cents (equality is allowed)"
    error_id: ERR_BUDGET_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /epli/defense-invoices/{invoice_id}/approve"

  - priority: 27
    category: business_fiscal
    rule: "a WAGE_HOUR-bucketed insurer portion must be <= Policy.wage_hour_sublimit_remaining_cents (equality allowed)"
    error_id: ERR_WAGE_HOUR_SUBLIMIT_EXHAUSTED
    http_status: 409
    applies_to: "POST /epli/indemnity-payments/{payment_id}/approve"

  - priority: 28
    category: business_fiscal
    rule: "a THIRD_PARTY-bucketed insurer portion must be <= Policy.third_party_sublimit_remaining_cents (equality allowed)"
    error_id: ERR_THIRD_PARTY_SUBLIMIT_EXHAUSTED
    http_status: 409
    applies_to: "POST /epli/indemnity-payments/{payment_id}/approve"

  - priority: 29
    category: business_fiscal
    rule: "the debiting amount (IndemnityPayment.insurer_portion_cents or DefenseInvoice.allowed_amount_cents) must be <= Policy.aggregate_limit_remaining_cents (equality allowed, and drives limit_posture to EXHAUSTED)"
    error_id: ERR_AGGREGATE_LIMIT_EXHAUSTED
    http_status: 409
    applies_to: "POST /epli/indemnity-payments/{payment_id}/approve, POST /epli/defense-invoices/{invoice_id}/approve"

  - priority: 30
    category: business_safety
    rule: "the sum of Applicant.jurisdiction_headcounts[].headcount must equal Applicant.total_headcount, and primary_jurisdiction_code must appear in jurisdiction_headcounts[].code; enforced on create and on any PATCH that supplies either field"
    error_id: ERR_HEADCOUNT_ALLOCATION_MISMATCH
    http_status: 422
    applies_to: "POST /epli/applicants, PATCH /epli/applicants/{applicant_id}"

  - priority: 31
    category: business_temporal
    rule: "the logical clock may only move forward or stay equal: to_iso8601 must be >= the current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /epli/_clock/set_current_utc"

  - priority: 32
    category: business_safety
    rule: "Jurisdiction.code, RatePlan.name and DefensePanelFirm.name are each globally unique"
    error_id: "ERR_DUPLICATE_JURISDICTION_CODE | ERR_DUPLICATE_RATE_PLAN_NAME | ERR_DUPLICATE_PANEL_FIRM_NAME"
    http_status: 409
    applies_to: "POST /epli/jurisdictions, POST /epli/rate-plans, POST /epli/defense-panel-firms"

validation_priority_notes:
  - pair: "priority 8 (state) vs priority 26 (business_fiscal)"
    scenario: "approving a DefenseInvoice that a dispute returned to ADJUSTED (so it is not UNDER_AUDIT) AND whose recomputed allowed_amount_cents would blow the matter budget"
    expected: "ERR_INVOICE_NOT_APPROVABLE, because 8 < 26"
  - pair: "priority 8 (state) vs priority 26 (business_fiscal)"
    scenario: "auditing a DefenseInvoice already in APPROVED while its assignment budget is exhausted"
    expected: "ERR_INVOICE_NOT_AUDITABLE, because 8 < 26"
  - pair: "priority 10 (business_safety) vs priority 25 (business_referential)"
    scenario: "the same user who audited a DefenseInvoice approves it, on a claim whose retention is not yet satisfied"
    expected: "ERR_SEGREGATION_OF_DUTIES, because 10 < 25"
  - pair: "priority 12 (business_safety) vs priority 13 (business_temporal)"
    scenario: "reporting a CUSTOMER-claimant claim on a policy that did not elect third-party coverage, with first_notice_at outside the policy period"
    expected: "ERR_THIRD_PARTY_COVERAGE_NOT_ELECTED, because 12 < 13"
  - pair: "priority 7 (concurrency) vs priority 9 (state)"
    scenario: "creating an ExposureAssessment with a stale expected_applicant_version against a RatePlan still in DRAFT"
    expected: "ERR_STALE_APPLICANT_VERSION, because 7 < 9"
  - pair: "priority 17 (business_temporal) vs priority 16 (business_temporal)"
    scenario: "an invoice period that both falls outside the engagement window and collides with an existing invoice"
    expected: "ERR_INVOICE_OUTSIDE_ENGAGEMENT, because 16 < 17"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# All paths are absolute and already include the api_prefix `/epli`.
# Every endpoint requires the X-User-ID header; role is resolved from it.
# ---------------------------------------------------------------------------
endpoints:

  # ---------------- reads: reference data ----------------------------------
  - method: GET
