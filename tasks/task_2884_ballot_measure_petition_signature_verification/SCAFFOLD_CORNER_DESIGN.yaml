            - "${e_empty} == ERR_BATCH_EMPTY (409) and SignatureBatch.${b3_id}.status is still RECEIVED"
            - "${e_nofiling} == ERR_NO_VERIFIED_BATCHES (409) and Petition.${pet_id}.status is still CLEARED"
            - "${ok_status} == AFFIDAVIT_VERIFIED and ${ok_acc} == 1 - the same affidavit call succeeds once the defect list is dropped"
            - "${ok_pet} == SIGNATURES_FILED and ${ok_raw} == 1 - filing succeeds as soon as one verified batch exists; the empty batch b3 is simply ignored"

      - name: sample_membership_and_pending_line_rejections
        claim_type: violation_to_error
        grounds:
          - validations[priority 13]
          - validations[priority 15]
          - calculations.sample_selection
          - errors[ERR_SIGNATURE_NOT_IN_OPEN_ROUND]
          - errors[ERR_ROUND_HAS_PENDING_SIGNATURES]
        distinguishing_aspect: |
          With four accepted lines, sample_pct_bps 5000 and sample_min_count 1 the draw is
          size 2 with interval k = floor(4/2) = 2, so the systematic selection is pool[0]
          and pool[2] - lines 1 and 3 once signed_on is made strictly increasing. That makes
          three distinct rejections observable on the same round: validating line 2 (never
          selected), re-validating line 1 (selected but no longer PENDING) and tallying
          while line 3 is still PENDING. The first two share one code, which is the point -
          "not in an open round" covers both membership and exhaustion - while the tally
          gate is a separate counting rule at priority 15.
        test_recipe:
          setup:
            - "Standard SOS-M: sample_pct_bps 5000, sample_min_count 1, gubernatorial_vote_total 100, signature_pct_bps 200 (required 2), sufficiency_upper_bps 10000, sufficiency_lower_bps 5000."
            - "County ALPHA; voters VA1..VA4 all ACTIVE in ALPHA with matching hashes."
            - "One batch with lines 1..4 signed on 2026-08-02, 03, 04 and 05, affidavit verified, signatures filed, RANDOM_SAMPLE round r1 open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
