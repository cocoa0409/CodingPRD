            - { call: "POST /product-classes", payload: { code: "SPIRITS", description: "Distilled spirits", base_unit: "PROOF_GALLON" }, as: ComplianceAdmin, captures: { pc_s: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur_ca}", product_class_id: "${pc_s}", rate_millicents_per_unit: 25000, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur_nv}", product_class_id: "${pc_s}", rate_millicents_per_unit: 25000, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Spirits", fein: "33-3333333" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur_ca}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn_ca: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur_nv}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn_nv: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn_ca}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { b1: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn_nv}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { b2: $.data.id } }
            - { call: "POST /bonds/${b1}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /bonds/${b2}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn_ca}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn_nv}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn_ca}", jurisdiction_id: "${jur_ca}", product_class_id: "${pc_s}", event_date: "2026-08-03T00:00:00Z", quantity_units: 4000 }, as: TaxAnalyst, captures: { ev1: $.data.id } }
            - { call: "POST /taxable-events/${ev1}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev1}/rate", payload: {}, as: TaxAnalyst, captures: { ret_ca: $.data.return_id } }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn_nv}", jurisdiction_id: "${jur_nv}", product_class_id: "${pc_s}", event_date: "2026-08-03T00:00:00Z", quantity_units: 4000 }, as: TaxAnalyst, captures: { ev2: $.data.id } }
            - { call: "POST /taxable-events/${ev2}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev2}/rate", payload: {}, as: TaxAnalyst, captures: { ret_nv: $.data.return_id } }
            - { call: "GET /deposits", payload: { registration_id: "${rgn_ca}", period: "2026-08" }, as: TaxAnalyst, captures: { depA_ca: "$.data[0].id" } }
            - { call: "GET /deposits", payload: { registration_id: "${rgn_nv}", period: "2026-08" }, as: TaxAnalyst, captures: { depA_nv: "$.data[0].id" } }
            - { call: "POST /deposits/${depA_ca}/pay", payload: { amount_cents: 90000 }, as: TaxAnalyst }
            - { call: "POST /deposits/${depA_nv}/pay", payload: { amount_cents: 89999 }, as: TaxAnalyst }
            - { call: "POST /returns/${ret_ca}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /returns/${ret_nv}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret_ca}", payload: {}, as: TaxReviewer, captures: { v1: $.data.version } }
            - { call: "GET /returns/${ret_nv}", payload: {}, as: TaxReviewer, captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /returns/${ret_ca}/file", payload: { expected_return_version: "${v1}" }, as: TaxReviewer, as_user_id: "reviewer-1", captures: { pen_ca: $.data.penalty_cents, nd_ca: $.data.net_due_cents } }
