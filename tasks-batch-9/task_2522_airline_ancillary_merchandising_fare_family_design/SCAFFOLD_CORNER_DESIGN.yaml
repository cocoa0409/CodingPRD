        distinguishing_aspect: "Two bookings with identical flight demand data (load factor 50, demand index 0) price the same SEAT product differently purely because one flight has an OPEN segment for it: RESIDUAL_INVENTORY reads sold_pct 0 and yields 2940 / EV 2058, while WTP_ELASTIC yields 4200 / EV 4200."
