        claim_type: cross_entity_validation
        grounds:
          - validations[priority=28]
          - errors.ERR_NO_GOVERNING_CALCULATION
          - calculations.acceptance_thresholds
          - calculations.project_demand_ledger
          - state_machines.HydraulicCalculation.SEALED_to_REOPENED
