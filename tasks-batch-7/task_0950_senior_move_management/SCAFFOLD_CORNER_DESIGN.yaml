      - name: authority_suspend_reinstate_cycle_and_revoke_is_terminal
        claim_type: cyclic
        grounds: ['state_machines.AuthorityRecord.status.ACTIVE_to_SUSPENDED', 'state_machines.AuthorityRecord.status.SUSPENDED_to_ACTIVE', 'state_machines.AuthorityRecord.status.ACTIVE_to_REVOKED', 'entities.PortalParty.fields.can_approve_dispositions']
        distinguishing_aspect: "Suspending flips the holder's can_approve_dispositions to false, reinstating flips it back to true, and revoking is terminal so a following reinstate returns 409 ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["A POA party with one ACTIVE FULL authority whose window covers the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
