              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-A", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${fa_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-B", acres: 200.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${fb_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${fa_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${fb_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 150.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 400000 }
              as: ProgramAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /seed-ops/production-contracts/${ca_id}/offer"
              payload: {}
              as: ProgramAdmin
            - call: "POST /seed-ops/production-contracts/${ca_id}/sign"
              payload: { planted_on: "2026-04-15" }
              as: Grower
              as_user_id: "${g_id}"
            - call: "POST /seed-ops/production-contracts/${cb_id}/offer"
              payload: {}
              as: ProgramAdmin
            - call: "POST /seed-ops/production-contracts/${cb_id}/sign"
              payload: { planted_on: "2026-04-15" }
              as: Grower
              as_user_id: "${g_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /seed-ops/field-inspections"
              payload: { production_contract_id: "${ca_id}", inspected_on: "2026-08-20", sampled_plants: 20000, off_type_plants: 20, restricted_weed_plants: 10, diseased_plants: 400, isolation_verified_m: 250.0 }
              as: FieldOfficer
              as_user_id: "fo-1"
