            - "decline response shows the re-run result: status == OFFERED and offered_to_hospitalist_id == ${h_b}"
            - "Admission.${a1}.declined_hospitalist_ids contains ${h_a}"
            - "Hospitalist.${h_a}.pending_offers == 0 and Hospitalist.${h_b}.pending_offers == 1"

      - name: cross_cover_load_formula
        claim_type: correct_result
        grounds: ["calculations.cross_cover_load", "entities.CoverageWindow.fields.current_load"]
        distinguishing_aspect: "LOCKED NIGHT_CROSS_COVER window with 3 ACTIVE assignments, 1 OPEN consult, 0 submitted handoffs: min(40, 3*2.0 + 1*1 + 0*2) == 7.0."
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00 holds P1, P2, P3; one OPEN ROUTINE consult on P1; H2 enrolled in window W (NIGHT_CROSS_COVER 19:00-07:00 capacity 3); clock advanced to 20:00 so monitor-run locks W"
          setup_api_calls:
