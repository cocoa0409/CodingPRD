      - name: duplicate_feed_side_is_scoped_to_non_released_feeds
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_FEED_SIDE] (409, the rack already holds a non-RELEASED RackFeed on the requested feed_side)"
          - "validations[12] (rack_id, feed_side) unique across RackFeed rows whose status != RELEASED; a RELEASED feed frees its side for re-reservation"
          - "endpoints[DELETE /rack-feeds/{feed_id}] moves the feed to RELEASED"
        distinguishing_aspect: "The A-side conflict is per rack and not per busway (the second attempt uses a DIFFERENT energized busway and still conflicts), and the uniqueness index excludes RELEASED rows, so after releasing the A-side feed the very same busway pair may be re-reserved. An implementation that indexes (rack_id, feed_side) unconditionally rejects the final re-reservation."
