            - "SettlementBatch.${batch_id}.settlement_rounding_delta_cents == -0.01 and is non-zero, proving the two rounding orders were kept separate"
            - "RetailerAgreement.${agr_id}.settled_fee_total_cents == 182.87 (the accrual schedule, not the payable) and accrual_pending_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: aml_alert_confirm_reopen_cycle
        grounds:
          - state_machines.AmlAlert.UNDER_REVIEW_to_CONFIRMED
          - state_machines.AmlAlert.CONFIRMED_to_UNDER_REVIEW
          - state_machines.AmlAlert.UNDER_REVIEW_to_OPEN
          - validations[priority=15]
        distinguishing_aspect: |
          The AmlAlert machine on the compliance domain is cyclic
          (OPEN → UNDER_REVIEW → CONFIRMED → UNDER_REVIEW → OPEN) rather than a
          one-way pipeline, so the same alert row re-enters review and its
          posture contribution unwinds and re-applies across cycles.
        test_recipe:
          setup:
