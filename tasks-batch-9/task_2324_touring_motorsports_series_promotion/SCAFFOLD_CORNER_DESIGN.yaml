      - name: corner_error_safety_shortfall_codes_surface_at_submit_in_rule_order
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_MEDICAL_STAFFING_SHORTFALL
          - errors.ERR_AMBULANCE_SHORTFALL
          - errors.ERR_BARRIER_INSUFFICIENT
          - validations[order=16]
          - validations[order=17]
          - validations[order=20]
          - calculations.required_safety_provisioning
        distinguishing_aspect: "All six provisioning fields accept 0, so a plan can be created with three simultaneous shortfalls; submit must report them in declared order (16 staffing, then 17 ambulance, then 20 barrier) one repair at a time. The barrier floor is BARRIER_FLOOR_FEET even with zero entries, which is why 800 feet fails on an empty floor."
