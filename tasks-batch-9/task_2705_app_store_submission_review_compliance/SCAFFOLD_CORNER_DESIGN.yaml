            - "GuidelineRule.${rule_id}.status == EFFECTIVE"
            - "GET /guideline-rules?supersedes_rule_id=${rule_id} reports pagination.total_count == 1 and data[0].id == ${rule2_id}"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: submission_create_starts_in_draft_with_the_phased_release_mode_default
        claim_type: Initial State
        grounds:
          - state_machines.Submission.initial_state
          - endpoints.POST_/submissions
          - entities.Submission.fields.release_mode
        distinguishing_aspect: "A newly created Submission is DRAFT with release_mode PHASED (omitted from the payload), pre_review_passed false, resubmission_count 0, metadata_locale_count 0 and every queue/decision timestamp null; the write also bumps AppRecord.version by exactly 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Northwind account ACTIVE with an ACTIVE IOS DISTRIBUTION_CERT and an ACTIVE IOS PROVISIONING_PROFILE."
            - "AppRecord Northwind Wallet with one PASSED mapping to EFFECTIVE rule 5.1.1, feature_compliance_index 100.00, compliance_posture OPEN."
            - "One OPEN IOS/POOL_A ReviewCapacityWindow 2026-08-01..2026-09-01 with capacity_slots 5."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - *c_prof_act
            - *c_app
            - *c_rule
            - *c_rule_pub
            - *c_map
            - *c_map_start
            - *c_window
            - *c_map_pass
            - &c_app_reread
              call: "GET /app-records/${app_id}"
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { app_v2: $.data.version }
          trigger:
            - &c_sub
              call: "POST /submissions"
              payload: { expected_app_record_version: "${app_v2}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 100, version_string: "4.2.0" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Submission.${sub_id}.state == DRAFT"
            - "Submission.${sub_id}.release_mode == PHASED"
            - "Submission.${sub_id}.submission_channel == STANDARD"
            - "Submission.${sub_id}.pre_review_passed == false"
            - "Submission.${sub_id}.resubmission_count == 0"
            - "Submission.${sub_id}.metadata_locale_count == 0"
            - "Submission.${sub_id}.queued_at is null and provisional_deadline_at is null"
            - "Submission.${sub_id}.priority_score is null and priority_band is null"
            - "Submission.${sub_id}.review_window_id is null and reviewed_by_user_id is null"
            - "AppRecord.${app_id}.version == ${app_v2} + 1"

      - name: queue_moves_pre_review_passed_to_waiting_for_review_and_freezes_the_sla_baseline
        claim_type: Valid Transition
        grounds:
          - state_machines.Submission.transitions.PRE_REVIEW_PASSED_to_WAITING_FOR_REVIEW
          - endpoints.POST_/submissions/{id}/queue
          - calculations.review_priority_score
          - calculations.review_capacity_allocation
        distinguishing_aspect: "Queueing a clean build at clock 2026-08-01T00:00:00Z pins queued_at to the clock, provisional_deadline_at to 2026-08-03T00:00:00Z (+48h BASE_SLA_HOURS), priority_score to 50.00 (0.50*100.00 standing with zero urgency and zero risk), priority_band NORMAL and effective_review_deadline_at to 2026-08-03T00:00:00Z (+48h), and reserves one slot of the single OPEN window."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind standing 100.00/100.00."
            - "AppRecord Northwind Wallet posture OPEN, index 100.00, ACTIVE profile valid to 2027-07-01T00:00:00Z."
            - "Submission build 100 in PRE_REVIEW_PASSED: one complete primary en-US locale, all-zero age-rating answers with attested 4, empty privacy declaration, provisional disclosure score 1.0000."
            - "One OPEN IOS/POOL_A window with capacity_slots 5, slots_reserved 0, slots_consumed 0, slots_available 5."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - *c_prof_act
            - *c_app
            - *c_rule
            - *c_rule_pub
            - *c_map
            - *c_map_start
            - *c_window
            - *c_map_pass
            - *c_app_reread
            - *c_sub
            - &c_loc
              call: "POST /metadata-locales"
              payload: { submission_id: "${sub_id}", locale: "en-US", title: "Northwind Wallet", subtitle: "Spend smarter", keywords: "wallet,budget,finance", promotional_text: "New in 4.2", is_primary: true, screenshot_counts: { PHONE_65: 3, TABLET_129: 2 } }
              as: ReleaseManager
              as_user_id: "${acct_id}"
              captures: { loc_id: $.data.id }
            - &c_age
              call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 4 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - &c_priv
              call: "PUT /submissions/${sub_id}/privacy-declaration"
              payload: { declared_privacy_items: [], tracking_consent_prompt_present: false }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - &c_prc
              call: "POST /submissions/${sub_id}/pre-review-check"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          trigger:
            - &c_queue
              call: "POST /submissions/${sub_id}/queue"
              payload: {}
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200"
            - "Submission.${sub_id}.state == WAITING_FOR_REVIEW"
            - "Submission.${sub_id}.queued_at == 2026-08-01T00:00:00Z"
            - "Submission.${sub_id}.provisional_deadline_at == 2026-08-03T00:00:00Z"
            - "Submission.${sub_id}.priority_score == 50.00"
            - "Submission.${sub_id}.priority_band == NORMAL"
            - "Submission.${sub_id}.effective_review_deadline_at == 2026-08-03T00:00:00Z"
            - "Submission.${sub_id}.review_window_id == ${win_id}"
            - "Submission.${sub_id}.submission_channel == STANDARD"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 1"
            - "ReviewCapacityWindow.${win_id}.slots_consumed == 0"
            - "ReviewCapacityWindow.${win_id}.slots_available == 4"

      - name: claim_moves_waiting_to_in_review_and_stamps_the_segregation_subject
        claim_type: Valid Transition
        grounds:
          - state_machines.Submission.transitions.WAITING_FOR_REVIEW_to_IN_REVIEW
          - endpoints.POST_/submissions/{id}/claim
          - calculations.disclosure_accuracy_score.variants.REVIEW_FINAL
        distinguishing_aspect: "Claiming sets reviewed_by_user_id to the claiming reviewer's X-User-ID (rev-01), recomputes disclosure_accuracy_score_final to 1.0000 against an empty finding set, and leaves the window's slot triple untouched at reserved 1 / consumed 0 / available 4."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Submission build 100 WAITING_FOR_REVIEW on window POOL_A with slots_reserved 1, slots_available 4."
            - "No BehaviorFinding rows exist for the submission; declared_privacy_items is empty."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - *c_prof_act
            - *c_app
            - *c_rule
            - *c_rule_pub
            - *c_map
            - *c_map_start
            - *c_window
            - *c_map_pass
            - *c_app_reread
            - *c_sub
            - *c_loc
            - *c_age
            - *c_priv
            - *c_prc
            - *c_queue
          trigger:
            - &c_claim
              call: "POST /submissions/${sub_id}/claim"
              payload: {}
              as: PlatformReviewer
              as_user_id: "rev-01"
          assert:
            - "the response status is 200"
            - "Submission.${sub_id}.state == IN_REVIEW"
            - "Submission.${sub_id}.reviewed_by_user_id == rev-01"
            - "Submission.${sub_id}.disclosure_accuracy_score_final == 1.0000"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 1 and slots_consumed == 0 and slots_available == 4"
      - name: reject_decision_fails_the_cited_mapping_and_drives_the_index_to_zero
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Submission.transitions.IN_REVIEW_to_REJECTED
          - endpoints.POST_/submissions/{id}/decision
          - calculations.standing_score
          - entities.PublisherAccount.fields.rejection_strike_count
        distinguishing_aspect: "One CRITICAL RejectionReason citing rule 5.1.1 flips the app's only mapping PASSED -> FAILED, drops feature_compliance_index 100.00 -> 0.00, sets posture RESTRICTED with reason [COMPLIANCE_INDEX_BELOW_FLOOR], drops both standing variants to 88.00 (100 - 12 at decay 1.0), sets rejection_strike_count 1, and moves the window slot from reserved to consumed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind standing 100.00/100.00, rejection_strike_count 0."
            - "Submission build 100 IN_REVIEW, claimed by reviewer rev-01; window POOL_A at reserved 1 / consumed 0 / available 4."
            - "The app's single FeatureMapping to EFFECTIVE rule 5.1.1 is PASSED; index 100.00; posture OPEN."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - *c_prof_act
            - *c_app
            - *c_rule
            - *c_rule_pub
            - *c_map
            - *c_map_start
            - *c_window
            - *c_map_pass
            - *c_app_reread
            - *c_sub
            - *c_loc
            - *c_age
            - *c_priv
            - *c_prc
            - *c_queue
            - *c_claim
          trigger:
            - &c_reject
              call: "POST /submissions/${sub_id}/decision"
              payload: { outcome: "REJECT", rejection_reasons: [{ guideline_rule_id: "${rule_id}", reason_code: "PRIVACY_LABEL_MISMATCH", severity: "CRITICAL", detail: "Undisclosed device identifier collection observed in build 100." }] }
              as: PlatformReviewer
              as_user_id: "rev-01"
          assert:
            - "the response status is 200"
            - "Submission.${sub_id}.state == REJECTED"
            - "Submission.${sub_id}.decided_at == 2026-08-01T00:00:00Z and rejected_at == 2026-08-01T00:00:00Z"
            - "FeatureMapping.${map_id}.self_review_status == FAILED"
            - "AppRecord.${app_id}.feature_compliance_index == 0.00"
            - "AppRecord.${app_id}.compliance_posture == RESTRICTED"
            - "AppRecord.${app_id}.posture_reason_codes == [\"COMPLIANCE_INDEX_BELOW_FLOOR\"]"
            - "AppRecord.${app_id}.distribution_state == NOT_DISTRIBUTED"
            - "PublisherAccount.${acct_id}.standing_score_rolling_365 == 88.00"
            - "PublisherAccount.${acct_id}.standing_score_lifetime == 88.00"
            - "PublisherAccount.${acct_id}.rejection_strike_count == 1"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 0 and slots_consumed == 1 and slots_available == 4"
            - "GET /rejection-reasons?submission_id=${sub_id} reports pagination.total_count == 1 with data[0].disposition == PENDING and data[0].appeal_disposition == PENDING"

      - name: metadata_reject_touches_no_mapping_index_posture_or_strike_count
        claim_type: Conditional cascade
        grounds:
          - state_machines.Submission.transitions.IN_REVIEW_to_METADATA_REJECTED
          - endpoints.POST_/submissions/{id}/decision
          - calculations.standing_score
        distinguishing_aspect: "METADATA_REJECT is the divergent branch: with one MINOR reason the mapping stays PASSED, index stays 100.00, posture stays OPEN and rejection_strike_count stays 0, yet both standing variants still drop to 98.00 (100 - 2) - proving the standing recompute is unconditional while the compliance cascade is not."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind standing 100.00/100.00, rejection_strike_count 0."
            - "Submission build 100 IN_REVIEW claimed by rev-01; the app's single mapping to rule 5.1.1 is PASSED, index 100.00, posture OPEN."
          setup_api_calls:
