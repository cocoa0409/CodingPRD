      - name: bi_component_rounding_order_is_pinned
        claim_type: precision
        grounds:
          - calculations.bi_indemnity_quantification.precision
          - entities.ProofOfLoss.fields.bi_component_usd
        excluded_because:
          difficulty_instance: bi_component_round_then_sum_order_pinned_mode_b
          rationale: "The round-then-sum ordering claim, including the one-cent fixture that separates 232500.24 from the sum-then-round 232500.23, is the second combinatorial_formula instance and needs that same bespoke revenue figure."
      - name: attested_and_verified_bases_diverge_on_one_application
        claim_type: variant_divergence
        grounds:
          - calculations.control_posture_score.variants
          - entities.Application.fields.premium_usd
        excluded_because:
          difficulty_instance: control_posture_attested_versus_verified_diverge_on_application
          rationale: "The divergence claim (identical attestations, two stored scores, two premium fields, and the modifier band crossing that follows) is the first dual_variant_calc instance and asserts both bases plus both premium figures on one fixture."
      - name: bi_baselines_diverge_on_one_proof_of_loss
        claim_type: variant_divergence
        grounds:
          - calculations.bi_indemnity_quantification.variants
          - entities.ProofOfLoss.fields.assessed_indemnity_usd
        excluded_because:
          difficulty_instance: bi_indemnity_trailing_versus_prior_year_diverge_on_proof_of_loss
          rationale: "The claim that the two baselines produce materially different indemnities from identical proof inputs is the second dual_variant_calc instance, which pins both 212500.00 and 259000.00 and the 46500.00 gap between them."
      - name: premium_layer_bands_stack_with_every_modifier
        claim_type: tiered_pricing
        grounds:
          - calculations.premium_quote.formula
          - calculations.premium_quote.constants.EXCESS_LAYER_FACTOR
        excluded_because:
          difficulty_instance: premium_layer_banding_with_stacked_modifiers_mode_a
          rationale: "The three-band layer walk with a stacked control, retention and dependency modifier is the first combinatorial_formula instance, which already pins the 10-million Redstone fixture at 50058.00."
      - name: aggregate_cap_truncates_the_net_payment
        claim_type: waterfall_allocation
        grounds:
          - calculations.tower_allocation_waterfall.formula
          - entities.IncidentClaim.fields.unallocated_loss_usd
        excluded_because:
          difficulty_instance: payment_reversal_restores_aggregate_sublimit_and_claim_ledger
          rationale: "The aggregate-cap branch, where net_paid_usd is truncated to the remaining aggregate and the balance lands in unallocated_loss_usd on an EXHAUSTED policy, is set up and asserted inside the first compensating_invariant instance."
