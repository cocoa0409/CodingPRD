scenario: |
  Ultra-Cold Vaccine Distribution & Thaw Window Management (Pfizer): manufacturing
  release and allocation across jurisdictions with order acceptance windows, ultra-cold
  shipper packing with dry ice and temperature loggers, delivery scheduling to sites
  able to accept ultra-cold or refrigerated storage with equipment verification, thaw
  window computation once a carton leaves ultra-cold with beyond-use dating cascading
  to vial and dose levels, minimum order quantity constraints from pack sizes and their
  effect on small clinics, redistribution and transfer between sites with excursion
  review, dose accountability reporting and wastage attribution, temperature excursion
  adjudication determining whether product remains usable.

domain_name: ultra-cold-vaccine-distribution
api_prefix: /vaccine-distribution

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - selector_policy
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ProductConfiguration
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Manufacturer product code, unique across configurations" }
      - { name: presentation, type: enum, source: input, description: "SINGLE_DOSE_VIAL | MULTI_DOSE_VIAL" }
      - { name: doses_per_vial, type: integer, source: input, description: "Label doses per vial" }
      - { name: vials_per_carton, type: integer, source: input, description: "Vials per carton, default 195" }
      - { name: cartons_per_pallet, type: integer, source: input, description: "Cartons per pallet layer, default 12" }
      - { name: ship_box_cartons, type: integer, source: input, description: "Cartons per insulated ship box, default 5" }
      - { name: min_order_cartons, type: integer, source: input, description: "Manufacturer minimum order quantity in cartons" }
      - { name: ultra_cold_min_c, type: number, source: input, description: "Ultra-cold lower bound in Celsius, default -90" }
      - { name: ultra_cold_max_c, type: number, source: input, description: "Ultra-cold upper bound in Celsius, default -60" }
      - { name: refrigerated_min_c, type: number, source: input, description: "Refrigerated lower bound in Celsius, default 2" }
      - { name: refrigerated_max_c, type: number, source: input, description: "Refrigerated upper bound in Celsius, default 8" }
      - { name: thaw_stability_hours, type: integer, source: input, description: "Total thawed stability budget in hours at refrigerated conditions, default 120" }
      - { name: refrigerated_shelf_life_hours, type: integer, source: input, description: "Refrigerated storage window measured from entry, default 720" }
      - { name: excursion_tolerance_min_c, type: number, source: input, description: "Coldest temperature still inside the allowed excursion band, default -50" }
      - { name: excursion_max_single_breach_minutes, type: integer, source: input, description: "Per-breach cumulative-in-one-slice minute allowance, default 180" }
      - { name: excursion_max_cumulative_minutes, type: integer, source: input, description: "Total in-band excursion minutes per carton lifetime, default 360" }
      - { name: refreeze_prohibited, type: boolean, source: input, description: "True means a thawed carton may never re-enter ultra-cold, default true" }
      - { name: punctured_bud_hours, type: integer, source: input, description: "Beyond-use window after a vial is punctured, default 6" }
      - { name: wastage_threshold_pct, type: number, source: input, description: "Lost-dose proportion of a carton that triggers a wastage report, default 0.05" }
      - { name: doses_per_carton, type: integer, source: computed, description: "doses_per_vial * vials_per_carton" }

  - name: JurisdictionProgram
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Two-letter jurisdiction code, unique" }
      - { name: regulatory_body, type: string, source: input, description: "National regulator name" }
      - { name: allocation_basis, type: enum, source: input, description: "POPULATION_SHARE | FIXED_QUANTITY" }
      - { name: population_weight, type: number, source: input, description: "Population weight used when allocation_basis is POPULATION_SHARE" }
      - { name: fixed_weekly_cartons, type: integer, source: input, description: "Weekly cartons used when allocation_basis is FIXED_QUANTITY" }
      - { name: weekly_allocation_cap_cartons, type: integer, source: input, description: "Hard weekly ceiling for this program" }
      - { name: min_order_cartons, type: integer, source: input, description: "Program-level minimum cartons per accepted order, default 2" }
      - { name: reservable_carton_pct, type: number, source: input, description: "Share of its computed entitlement a program may hold open, default 0.5" }
      - { name: acceptance_window_hours, type: integer, source: input, description: "Hours an entitlement stays open after the window opens" }
      - { name: shipping_days, type: array, source: input, description: "ISO weekday names on which dispatch is allowed, e.g. [MONDAY, WEDNESDAY]" }
      - { name: shipping_cutoff_utc, type: string, source: input, description: "UTC time-of-day cutoff on a shipping day, HH:MM:SS" }
      - { name: quarantine_on_review, type: boolean, source: input, description: "When true an excursion review cascades RESTRICTED standing and holds cartons" }
      - { name: adjudication_sla_hours, type: integer, source: input, description: "Hours allowed between excursion report and adjudication" }
      - { name: segment_rule, type: enum, source: input, description: "TIE_CONTINUE | STOP — how allocation moves past an unfilled entitlement" }
      - { name: reporting_period_days, type: integer, source: input, description: "Length in days of the accountability reporting period" }
      - { name: released_cartons_to_date, type: integer, source: computed, default: 0, description: "Sum of cartons released into this jurisdiction across all entitlements" }
      - { name: credit_balance_cartons, type: integer, source: computed, default: 0, description: "Signed entitlement-credit balance; releases credit it, reallocations draw it down, floor is 0" }
      - { name: lapsed_carton_count, type: integer, source: computed, default: 0, description: "Sum of cartons released via ShippingWindowLapse for this program" }
      - { name: standing_status, type: enum, source: computed, default: OPEN, description: "OPEN | RESTRICTED | FROZEN — derived aggregate that gates child operations" }

  - name: AllocationBatch
    parent: null
    common_fields: true
    fields:
      - { name: batch_code, type: string, source: input, description: "Manufacturing batch code, unique" }
      - { name: product_configuration_id, type: string, source: input, description: "FK -> ProductConfiguration.id; the released presentation" }
      - { name: jurisdiction_program_id, type: string, source: input, description: "FK -> JurisdictionProgram.id; program the batch was released under" }
      - { name: released_cartons, type: integer, source: input, description: "Cartons released by manufacturing QA" }
      - { name: release_date, type: datetime, source: input, description: "ISO 8601 UTC release timestamp" }
      - { name: expiry_date, type: datetime, source: input, description: "ISO 8601 UTC batch expiry" }
      - { name: status, type: enum, source: system, description: "DRAFT | RELEASED | ALLOCATED | DEPLETED | EXPIRED | RECALLED" }
      - { name: allocated_cartons, type: integer, source: computed, description: "Sum of computed_cartons over the batch's entitlements" }
      - { name: unallocated_cartons, type: integer, source: computed, description: "released_cartons - allocated_cartons" }
      - { name: doses_released_total, type: integer, source: computed, description: "released_cartons * product_configuration.doses_per_carton" }

  - name: AllocationWindow
    parent: null
    common_fields: true
    fields:
      - { name: allocation_batch_id, type: string, source: input, description: "FK -> AllocationBatch.id" }
      - { name: jurisdiction_program_id, type: string, source: input, description: "FK -> JurisdictionProgram.id" }
      - { name: opens_at, type: datetime, source: input, description: "Inclusive instant the acceptance window opens" }
      - { name: closes_at, type: datetime, source: input, description: "Exclusive instant the acceptance window closes" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED | OPEN | CLOSED" }
      - { name: requested_cartons, type: integer, source: computed, description: "Sum of requested_cartons over non-rejected SiteOrders in this window" }
      - { name: accepted_cartons, type: integer, source: computed, description: "Sum of accepted_cartons over SiteOrders in this window" }

  - name: AllocationEntitlement
    parent: null
    common_fields: true
    fields:
      - { name: allocation_window_id, type: string, source: input, description: "FK -> AllocationWindow.id" }
      - { name: jurisdiction_program_id, type: string, source: input, description: "FK -> JurisdictionProgram.id" }
      - { name: computed_cartons, type: integer, source: system, description: "Cartons computed at window opening from the program allocation basis" }
      - { name: held_cartons, type: integer, source: computed, default: 0, description: "Cartons currently held by accepted-but-unfulfilled orders" }
      - { name: accepted_cartons, type: integer, source: computed, default: 0, description: "Cartons committed by accepted orders" }
      - { name: available_cartons, type: integer, source: computed, description: "computed_cartons - held_cartons" }
      - { name: acceptance_status, type: enum, source: system, description: "PENDING | PARTIALLY_ACCEPTED | FULFILLED | LAPSED" }
      - { name: lapsed_at, type: datetime, source: system, description: "Set when the acceptance window lapses; null otherwise" }
      - { name: release_rate, type: number, source: computed, description: "accepted_cartons / computed_cartons, 4 decimal places, round_half_up" }

  - name: SiteOrder
    parent: null
    common_fields: true
    fields:
      - { name: allocation_entitlement_id, type: string, source: input, description: "FK -> AllocationEntitlement.id" }
      - { name: storage_site_id, type: string, source: input, description: "FK -> StorageSite.id; ordering site" }
      - { name: requested_cartons, type: integer, source: input, description: "Cartons requested by the site" }
      - { name: requested_doses, type: integer, source: input, description: "Doses the site actually needs; drives carton rounding" }
      - { name: accepted_cartons, type: integer, source: computed, default: 0, description: "Cartons the program accepted" }
      - { name: accepted_doses, type: integer, source: computed, default: 0, description: "accepted_cartons * product_configuration.doses_per_carton" }
      - { name: rejected_cartons, type: integer, source: computed, default: 0, description: "Cartons dropped by a rejection" }
      - { name: rounded_from_doses, type: integer, source: computed, default: 0, description: "Cartons implied by requested_doses before minimum-order uplift" }
      - { name: min_order_shortfall_cartons, type: integer, source: computed, default: 0, description: "Cartons added to reach the governing minimum order quantity" }
      - { name: requested_cartons_snapshot, type: integer, source: system, description: "Immutable copy of requested_cartons captured at submission" }
      - { name: order_status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | PARTIALLY_ACCEPTED | REJECTED | FULFILLED" }
      - { name: payment_status, type: enum, source: system, description: "NOT_DUE | DUE | DISPUTED — independent axis; NOT_DUE on creation, DUE on delivery, DISPUTED on a dock rejection or a fulfillment reversal" }
      - { name: submitted_at, type: datetime, source: system, description: "Set on submission" }
      - { name: materialization_variance_doses, type: integer, source: computed, description: "accepted_doses - requested_doses, signed" }

  - name: StorageSite
    parent: null
    common_fields: true
    fields:
      - { name: site_code, type: string, source: input, description: "Site code, unique within its jurisdiction program" }
      - { name: site_name, type: string, source: input, description: "Human-readable site name" }
      - { name: jurisdiction_program_id, type: string, source: input, description: "FK -> JurisdictionProgram.id" }
      - { name: storage_capability, type: enum, source: input, description: "ULTRA_COLD | REFRIGERATED | AMBIENT_ONLY" }
      - { name: ultra_cold_capacity_cartons, type: integer, source: input, description: "Cartons the ultra-cold equipment can hold" }
      - { name: refrigerated_capacity_cartons, type: integer, source: input, description: "Cartons the refrigerated equipment can hold" }
      - { name: cold_chain_equipment_type, type: enum, source: input, description: "ULTRA_COLD_FREEZER | THERMAL_SHIPPER" }
      - { name: equipment_certificate_expires_at, type: datetime, source: input, description: "Certificate expiry for the site's equipment" }
      - { name: expected_weekly_doses, type: integer, source: input, description: "Site's declared weekly dose demand" }
      - { name: equipment_certified, type: boolean, source: computed, default: false, description: "True only when a RECORDED, unexpired SiteEquipmentVerification with outcome PASSED exists for this site" }
      - { name: equipment_verification_id, type: string, source: computed, description: "Newest qualifying verification id, else null" }
      - { name: reported_entry_type, type: enum, source: computed, default: ULTRA_COLD, description: "ULTRA_COLD | REFRIGERATED — count-weighted mode of physical carton temperature states" }
      - { name: usable_doses, type: integer, source: computed, default: 0, description: "Sum of remaining doses over physical (non-IN_TRANSIT) cartons at this site" }
      - { name: administrative_remaining_doses, type: integer, source: computed, default: 0, description: "Sum of administrative_remaining_doses over physical cartons at this site" }
      - { name: open_excursion_count, type: integer, source: computed, default: 0, description: "Excursions at this site with review_status not ADJUDICATED" }
      - { name: inventory_status, type: enum, source: computed, default: OPEN, description: "OPEN | RESTRICTED | FROZEN — derived aggregate that gates child operations. Derivation, recomputed on every mutation that touches the site or its cartons: FROZEN when the owning jurisdiction_program.standing_status is FROZEN; otherwise RESTRICTED while open_excursion_count is greater than 0 and the program sets quarantine_on_review, else OPEN. FROZEN takes precedence over RESTRICTED." }

  - name: SiteEquipmentVerification
    parent: null
    common_fields: true
    fields:
      - { name: storage_site_id, type: string, source: input, description: "FK -> StorageSite.id" }
      - { name: equipment_type, type: enum, source: input, description: "ULTRA_COLD_FREEZER | THERMAL_SHIPPER | DATA_LOGGER" }
      - { name: certificate_number, type: string, source: input, description: "Calibration or qualification certificate number" }
      - { name: certificate_expires_at, type: datetime, source: input, description: "Certificate expiry instant" }
      - { name: verified_at, type: datetime, source: input, description: "Instant the verification was performed" }
      - { name: outcome, type: enum, source: input, description: "PASSED | FAILED" }
      - { name: status, type: enum, source: system, description: "RECORDED | INVALIDATED" }
      - { name: invalidated_at, type: datetime, source: system, description: "Set when a later verification or incident invalidates this record; null otherwise" }

  - name: DispatchOrder
    parent: null
    common_fields: true
    fields:
      - { name: site_order_id, type: string, source: input, description: "FK -> SiteOrder.id" }
      - { name: storage_site_id, type: string, source: input, description: "FK -> StorageSite.id" }
      - { name: entry_route, type: enum, source: input, description: "DIRECT_ULTRA_COLD | THAW_AT_HUB" }
      - { name: staging_site_id, type: string, source: system, description: "Site selected to perform the thaw when entry_route is THAW_AT_HUB; null otherwise. Eligibility filter: StorageSites linked to the ordering site through CartonFamily where storage_capability is ULTRA_COLD, equipment_certified is true at the logical clock, inventory_status is not FROZEN and the site is not the ordering site. Ranking: expected_weekly_doses ASC. Tie-break: created_at ASC, never identity. Empty candidate set: ERR_NO_ELIGIBLE_SITE." }
      - { name: freeze_required, type: boolean, source: computed, description: "True when the destination's reported_entry_type is ULTRA_COLD after the route is applied" }
      - { name: dispatched_at, type: datetime, source: system, description: "Set when the dispatch leaves the hub" }
      - { name: eta_at, type: datetime, source: system, description: "dispatched_at + transit hours resolved from the program shipping schedule" }
      - { name: status, type: enum, source: system, description: "DRAFT | PACKED | IN_TRANSIT | DELIVERED | REJECTED_AT_DOCK" }
      - { name: carton_count, type: integer, source: computed, default: 0, description: "Cartons attached to this dispatch" }
      - { name: route_cartons, type: integer, source: computed, default: 0, description: "Cartons accepted into ultra-cold at the destination after staging" }
      - { name: min_order_shortfall_cartons, type: integer, source: computed, default: 0, description: "Shortfall against the governing minimum order quantity, taken as the maximum over program and product minima" }

  - name: ColdChainShipper
    parent: null
    common_fields: true
    fields:
      - { name: dispatch_order_id, type: string, source: input, description: "FK -> DispatchOrder.id" }
      - { name: shipper_serial, type: string, source: input, description: "Insulated shipper serial, unique" }
      - { name: dry_ice_kg, type: number, source: input, description: "Dry ice loaded into the shipper" }
      - { name: packing_started_at, type: datetime, source: input, description: "Instant packing began" }
      - { name: packing_completed_at, type: datetime, source: system, description: "Set when packing completes" }
      - { name: logger_serial, type: string, source: input, description: "Temperature logger serial placed in the shipper" }
      - { name: packing_status, type: enum, source: system, description: "PREPARING | SEALED | IN_TRANSIT | RECEIVED | RELEASED | HELD" }
      - { name: hold_reason, type: enum, source: system, description: "MISSING_LOGGER | INSUFFICIENT_DRY_ICE | LATE_PACKING | LATE_READING; null unless HELD" }
      - { name: payload_locked_at, type: datetime, source: system, description: "Set when the first carton is attached; blocks further packing edits" }
      - { name: required_dry_ice_kg, type: integer, source: computed, description: "Minimum dry ice for the pack, from carton count and product constants" }
      - { name: dry_ice_deficit_kg, type: integer, source: computed, description: "max(0, required_dry_ice_kg - dry_ice_kg), 2 decimal places" }
      - { name: punctured_ice_slots, type: number, source: computed, description: "Sum of per-carton ice slots weighted by the reference product's thaw hairpin, 4 decimal places" }

  - name: TemperatureLoggerReading
    parent: null
    common_fields: false
    fields:
      - { name: cold_chain_shipper_id, type: string, source: input, description: "FK -> ColdChainShipper.id" }
      - { name: recorded_at, type: datetime, source: input, description: "Instant the reading was taken" }
      - { name: temperature_c, type: number, source: input, description: "Reading in Celsius" }
      - { name: source, type: enum, source: input, description: "LOGGER | MANUAL" }
      - { name: breach_minutes, type: integer, source: computed, description: "Minutes this reading spends outside the packed product's ultra-cold band, 0 when inside" }

  - name: Carton
    parent: null
    common_fields: true
    fields:
      - { name: allocation_batch_id, type: string, source: input, description: "FK -> AllocationBatch.id" }
      - { name: cold_chain_shipper_id, type: string, source: system, description: "FK -> ColdChainShipper.id; shipper the carton travelled in, set when the carton is attached to a shipper" }
      - { name: carton_serial, type: string, source: input, description: "Carton serial, unique" }
      - { name: vials_per_carton, type: integer, source: input, description: "Snapshot of the product's vials per carton at attach time" }
      - { name: doses_per_carton, type: integer, source: computed, description: "product_configuration.doses_per_vial * vials_per_carton" }
      - { name: temperature_state, type: enum, source: system, description: "ULTRA_COLD | THAWED | REFRIGERATED | PUNCTURED | EXPIRED | IN_TRANSIT | PALLET_STAGED | DESTROYED" }
      - { name: thawed_at, type: datetime, source: system, description: "Instant the carton left ultra-cold; null while ULTRA_COLD" }
      - { name: thaw_window_expires_at, type: datetime, source: system, description: "thawed_at + effective thaw hours, capped by refrigerated_shelf_life_hours from thawed_at when a THAW_AT_HUB staging hop is present" }
      - { name: current_expires_at, type: datetime, source: system, description: "Earliest of the batch expiry, the active beyond-use instant and any puncture instant the carton has; null means the governing limit is the batch expiry" }
      - { name: expired_at, type: datetime, source: system, description: "Instant the carton parked in EXPIRED; null otherwise" }
      - { name: remaining_doses, type: integer, source: computed, default: 0, description: "doses_per_carton minus doses removed by dose ledger entries" }
      - { name: administrative_remaining_doses, type: integer, source: computed, default: 0, description: "Signed sum of quantity_doses over the carton's dose ledger entries, clamped at 0" }
      - { name: cumulative_released_doses, type: integer, source: computed, default: 0, description: "Sum of quantity_doses over RELEASE and TRANSFER_IN entries for this carton" }
      - { name: administrative_expired, type: boolean, source: computed, default: false, description: "True once the logical clock reaches current_expires_at while the carton is still physical" }
      - { name: dose_shortfall_doses, type: integer, source: computed, default: 0, description: "max(0, cumulative_released_doses - remaining_doses - administered doses)" }

  - name: DoseLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: carton_id, type: string, source: input, description: "FK -> Carton.id" }
      - { name: entry_type, type: enum, source: input, description: "RELEASE | THAW | TRANSFER_IN | TRANSFER_OUT | ADMINISTER | PUNCTURE | EXPIRE | WASTE | DESTROY | REVERSE" }
      - { name: quantity_doses, type: integer, source: input, description: "Signed dose quantity; REVERSE entries carry the negated value of the entry they reverse" }
      - { name: occurred_at, type: datetime, source: input, description: "Instant the movement happened" }
      - { name: site_id, type: string, source: computed, description: "Site holding the carton at occurred_at" }
      - { name: reverses_entry_id, type: string, source: input, description: "FK -> DoseLedgerEntry.id; set only on REVERSE entries" }
      - { name: status, type: enum, source: system, description: "RECORDED | RECONCILED" }

  - name: SiteTransfer
    parent: null
    common_fields: true
    fields:
      - { name: from_site_id, type: string, source: input, description: "FK -> StorageSite.id; releasing site" }
      - { name: to_site_id, type: string, source: input, description: "FK -> StorageSite.id; receiving site" }
      - { name: carton_id, type: string, source: input, description: "FK -> Carton.id" }
      - { name: requested_at, type: datetime, source: input, description: "Instant the transfer was requested" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DISPATCHED | RECEIVED | REJECTED | CANCELLED" }
      - { name: hours_remaining_at_request, type: number, source: computed, description: "Thaw window hours left at requested_at, 4 decimal places" }
      - { name: dest_required_entry_type, type: enum, source: computed, description: "ULTRA_COLD | REFRIGERATED required to hold the carton at the destination" }
      - { name: admissibility, type: enum, source: computed, description: "ADMITTED | NOT_ADMITTED from the destination's equipment certification and capability" }
      - { name: reservation_expires_at, type: datetime, source: system, description: "requested_at + program acceptance_window_hours; null once RECEIVED or REJECTED" }
      - { name: cumulative_conflict_minutes, type: integer, source: computed, default: 0, description: "Minutes of this transfer's reservation interval that overlap an already-recorded reservation at the destination, computed under the frozen half-open rule" }
      - { name: freeze_required, type: boolean, source: computed, description: "True when the destination's reported_entry_type is ULTRA_COLD after the transfer is applied" }
      - { name: lapse_reason, type: enum, source: system, description: "WINDOW_EXPIRED | DEST_ADMISSIBILITY_FAILED | DEST_STANDING_FROZEN | REFREEZE_FORBIDDEN; null unless REJECTED or CANCELLED" }

  - name: TemperatureExcursion
    parent: null
    common_fields: true
    fields:
      - { name: carton_id, type: string, source: input, description: "FK -> Carton.id" }
      - { name: storage_site_id, type: string, source: input, description: "FK -> StorageSite.id" }
      - { name: first_breach_at, type: datetime, source: input, description: "Start of the breach interval" }
      - { name: last_breach_at, type: datetime, source: input, description: "End of the breach interval" }
      - { name: min_temperature_c, type: number, source: input, description: "Coldest reading observed during the breach" }
      - { name: reported_at, type: datetime, source: input, description: "Instant the excursion was reported" }
      - { name: review_status, type: enum, source: system, description: "REPORTED | UNDER_REVIEW | ADJUDICATED" }
      - { name: adjudication_status, type: enum, source: system, description: "PENDING | USABLE | NOT_USABLE — reset to PENDING when an appeal reopens the excursion" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Set on adjudication; cleared on reopen" }
      - { name: min_duration_minutes, type: integer, source: computed, description: "last_breach_at - first_breach_at in whole minutes" }
      - { name: dosing_hours_remaining_at_breach, type: number, source: computed, description: "Thaw window hours left at last_breach_at, 4 decimal places" }
      - { name: exceeds_cumulative_cap, type: boolean, source: computed, description: "True when min_duration_minutes > product excursion_max_cumulative_minutes" }
      - { name: dose_impact_category, type: enum, source: computed, description: "NONE | VIAL_LEVEL | DOSE_LEVEL" }
      - { name: dose_impact_factor, type: number, source: computed, description: "Certified lost doses divided by doses_per_carton, 4 decimal places, round_half_up" }
      - { name: quarantine_status, type: enum, source: system, description: "OPEN | LIFTED | RETAINED | DESTROYED — parallel dimension, independent of review_status" }
      - { name: current_resolution_trace_id, type: string, source: system, description: "optional; id of the newest adjudication or appeal that decided the current status" }

  - name: ExcursionAdjudication
    parent: null
    common_fields: true
    fields:
      - { name: temperature_excursion_id, type: string, source: input, description: "FK -> TemperatureExcursion.id" }
      - { name: adjudicator_user_id, type: string, source: input, description: "Operator id of the adjudicator" }
      - { name: outcome, type: enum, source: input, description: "USABLE | NOT_USABLE" }
      - { name: rationale, type: string, source: input, description: "Free-text rationale" }
      - { name: effective_from, type: datetime, source: system, description: "Set to the logical clock at adjudication time" }
      - { name: prior_outcome, type: enum, source: computed, description: "Outcome in force immediately before this adjudication, or null when first-time" }
      - { name: certified_lost_doses, type: integer, source: computed, description: "Certified dose loss under the write-off variant" }
      - { name: interim_lost_doses, type: integer, source: computed, description: "Interim dose loss under the interim variant" }
      - { name: freeze_transitive_doses, type: integer, source: computed, description: "Doses frozen at every site member of the carton's site-sharing community" }

  - name: DosesAffectedSlice
    parent: null
    common_fields: true
    fields:
      - { name: temperature_excursion_id, type: string, source: input, description: "FK -> TemperatureExcursion.id" }
      - { name: closure_state, type: enum, source: input, description: "OPEN | IN_REVIEW | CLOSED" }
      - { name: time_slice_c, type: number, source: input, description: "Temperature boundary the slice was observed under" }
      - { name: doses_upper_bound, type: integer, source: input, description: "Doses observed at or above time_slice_c" }
      - { name: status, type: enum, source: system, description: "PENDING | CERTIFIED" }

  - name: WastageReport
    parent: null
    common_fields: true
    fields:
      - { name: excursion_adjudication_id, type: string, source: input, description: "FK -> ExcursionAdjudication.id" }
      - { name: accounting_period_start, type: datetime, source: input, description: "Inclusive start of the accountability period" }
      - { name: accounting_period_end, type: datetime, source: input, description: "Exclusive end of the accountability period" }
      - { name: reported_at, type: datetime, source: input, description: "Instant the report was filed" }
      - { name: attributed_cause, type: enum, source: input, description: "TEMPERATURE_EXCURSION | PUNCTURE_EXPIRY | THAW_WINDOW_BREACH | REFRIGERATED_EXPIRY | TRANSFER_REJECTION | SITE_RETURN" }
      - { name: doses_reported, type: integer, source: input, description: "Doses the site declared as wasted" }
      - { name: dose_accountability_status, type: enum, source: system, description: "OPEN | RECONCILED" }
      - { name: diluent_doses, type: integer, source: computed, description: "Doses released for the carton that were never thawed or administered" }
      - { name: certified_doses, type: integer, source: computed, description: "Doses certified lost by the referenced adjudication" }
      - { name: reconciliation_variance_doses, type: integer, source: computed, description: "doses_reported - certified_doses, signed" }
      - { name: site_wastage_rate_ppm, type: integer, source: computed, description: "floor(reconciliation_variance_doses / carton.doses_per_carton * 1000000)" }

  - name: OrderRejection
    parent: null
    common_fields: true
    fields:
      - { name: site_order_id, type: string, source: input, description: "FK -> SiteOrder.id" }
      - { name: rejected_cartons, type: integer, source: input, description: "Cartons dropped from the order" }
      - { name: reason_code, type: enum, source: input, description: "BELOW_MIN_ORDER | NO_ENTITLEMENT | CAPACITY_UNAVAILABLE | SITE_NOT_READY | WINDOW_CLOSED" }
      - { name: rejected_at, type: datetime, source: input, description: "Instant of rejection" }
      - { name: doses_not_booked, type: integer, source: computed, description: "rejected_cartons * product doses per carton" }
      - { name: entitlement_release_cartons, type: integer, source: computed, description: "Cartons the entitlement returns in the compensating EntitlementRelease recorded by this rejection" }

  - name: EntitlementRelease
    parent: null
    common_fields: true
    fields:
      - { name: allocation_entitlement_id, type: string, source: input, description: "FK -> AllocationEntitlement.id; entitlement the cartons left" }
      - { name: reallocated_to_entitlement_id, type: string, source: input, description: "FK -> AllocationEntitlement.id; entitlement the cartons moved to; null for a lapse release" }
      - { name: released_cartons, type: integer, source: input, description: "Cartons released" }
      - { name: reason_code, type: enum, source: input, description: "WINDOW_LAPSE | ORDER_REJECTION | CAPACITY_UNAVAILABLE | PROGRAM_REALLOCATION" }
      - { name: released_at, type: datetime, source: input, description: "Instant of release" }
      - { name: status, type: enum, source: system, description: "RECORDED | REALLOCATED — REALLOCATED is set at creation exactly when reallocated_to_entitlement_id is non-null, otherwise RECORDED" }

  - name: ReportingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_program_id, type: string, source: input, description: "FK -> JurisdictionProgram.id" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the accountability period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the accountability period" }
      - { name: report_version, type: integer, source: system, default: 1, description: "Increments by one on every administrative re-materialization of the same period" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED" }
      - { name: released_doses, type: integer, source: computed, default: 0, description: "Doses released into the program inside the period" }
      - { name: administered_doses, type: integer, source: computed, default: 0, description: "Doses administered inside the period" }
      - { name: accounted_doses, type: integer, source: computed, default: 0, description: "Doses accounted for under the effective variant: administered + certified write-off losses" }
      - { name: forecast_remaining_doses, type: integer, source: computed, description: "Projected remaining doses at period_end under the forecast variant; null until the period is submitted" }
      - { name: unaccounted_doses, type: integer, source: computed, default: 0, description: "released_doses - accounted_doses, clamped at 0" }
      - { name: wastage_rate_basis_points, type: integer, source: computed, default: 0, description: "floor(unaccounted_doses / released_doses * 10000), 0 when released_doses is 0" }

  - name: ProgramStanding
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_program_id, type: string, source: input, description: "FK -> JurisdictionProgram.id" }
      - { name: as_of, type: datetime, source: input, description: "Instant the standing is assessed" }
      - { name: propagation_mode, type: enum, source: input, description: "IMMEDIATE | AFTER_CYCLE" }
      - { name: lapsed_period_count, type: integer, source: computed, description: "ReportingPeriods fully elapsed at as_of with no SUBMITTED report" }
      - { name: lapsed_window_count, type: integer, source: computed, description: "ShippingWindowLapses whose lapsed_at is strictly before as_of" }
      - { name: lapsed_carton_rate, type: number, source: computed, description: "lapsed_carton_count / released_cartons_to_date, 4 decimal places, round_half_up; 0 when the denominator is 0" }
      - { name: lapsed_carton_count, type: integer, source: computed, description: "Cartons released by lapses inside the accounting window ending at as_of" }
      - { name: lapsed_entitlement_count, type: integer, source: computed, description: "Distinct entitlements with a lapse inside the accounting window" }
      - { name: risk_tier, type: integer, source: computed, description: "0 when lapsed_period_count is 0; 1 when period count is 1 or 2 and rate is at least 0.10; 2 when period count is at least 3 or rate is at least 0.25; otherwise 1" }

  - name: ShippingWindowLapse
    parent: null
    common_fields: true
    fields:
      - { name: allocation_entitlement_id, type: string, source: input, description: "FK -> AllocationEntitlement.id" }
      - { name: lapsed_at, type: datetime, source: input, description: "Instant the acceptance window for the entitlement expired" }
      - { name: lapsed_cartons, type: integer, source: input, description: "Cartons returned because the window expired" }
      - { name: reason, type: enum, source: input, description: "ACCEPTANCE_WINDOW_CLOSED | SITE_NOT_READY | NO_ORDER_SUBMITTED" }
      - { name: dose_reconciliation_status, type: enum, source: system, description: "PENDING | RECONCILED" }
      - { name: doses_undelivered, type: integer, source: computed, description: "lapsed_cartons * the batch product's doses per carton" }

  - name: AdjudicationAppeal
    parent: null
    common_fields: true
    fields:
      - { name: temperature_excursion_id, type: string, source: input, description: "FK -> TemperatureExcursion.id" }
      - { name: filed_by_user_id, type: string, source: input, description: "Operator id of the filing site coordinator" }
      - { name: filed_at, type: datetime, source: input, description: "Instant the appeal was filed" }
      - { name: status, type: enum, source: system, description: "FILED | ACCEPTED | DENIED" }
      - { name: prior_trace_id, type: string, source: computed, description: "Id of the adjudication the appeal reopens; null when nothing was adjudicated" }

  - name: CartonStorageReservation
    parent: null
    common_fields: true
    fields:
      - { name: storage_site_id, type: string, source: input, description: "FK -> StorageSite.id" }
      - { name: carton_id, type: string, source: input, description: "FK -> Carton.id" }
      - { name: entry_type, type: enum, source: input, description: "ULTRA_COLD | REFRIGERATED — equipment class reserved" }
      - { name: temp_state, type: enum, source: input, description: "FROZEN | THAWED — carton temperature state the reservation works on" }
      - { name: reserved_capacity_cartons, type: integer, source: input, description: "Cartons of equipment capacity the reservation occupies" }
      - { name: start_at, type: datetime, source: input, description: "Start of the reserved interval" }
      - { name: end_at, type: datetime, source: input, description: "End of the reserved interval" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | RELEASED | LAPSED" }
      - { name: resolved_conflict_minutes, type: integer, source: computed, description: "Minutes of this interval that were adjudicated against an incumbent RESERVATION_BOUNDARY reservation" }
  - name: CartonFamily
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> StorageSite.id; one member of the sharing family" }
      - { name: member_site_id, type: string, source: input, description: "FK -> StorageSite.id; the other member of the sharing family" }
      - { name: linked_at, type: datetime, source: input, description: "Instant the membership link was created" }
      - { name: shared_dose_count, type: integer, source: computed, default: 0, description: "Sum of usable_doses over every site reachable from site_id through MEMBER_OF links, inclusive of the two endpoints" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: AllocationBatch
    initial_state: DRAFT
    terminal_states: [DEPLETED, RECALLED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /allocation-batches/{id}/release"
        actor: ManufacturingQA
        preconditions:
          - "the owning jurisdiction program's standing_status != FROZEN (ERR_PROGRAM_FROZEN)"
          - "batch expires strictly after the logical clock (ERR_BATCH_ALREADY_EXPIRED)"
          - "released_cartons >= product_configuration.min_order_cartons (ERR_BELOW_MIN_ORDER)"
        side_effects:
          - "status = RELEASED; release_cartons_at = logical clock; allocated_cartons = 0; unallocated_cartons = released_cartons"
      - from: DRAFT
        to: EXPIRED
        trigger: "system — automatic when the logical clock reaches expiry_date with unallocated_cartons greater than 0"
        actor: system
        preconditions:
          - "logical clock >= expiry_date"
        side_effects:
          - "status = EXPIRED"
          - "unallocated_cartons = 0 and allocated_cartons recomputed"
      - from: RELEASED
        to: EXPIRED
        trigger: "system — automatic when the logical clock reaches expiry_date with unallocated_cartons greater than 0"
        actor: system
        preconditions:
          - "logical clock >= expiry_date"
        side_effects:
          - "status = EXPIRED"
          - "unallocated_cartons = 0"
          - "every unallocated carton of the batch not yet DESTROYED → DESTROYED with a DESTROY ledger entry"
      - from: ALLOCATED
        to: EXPIRED
        trigger: "system — automatic when the logical clock reaches expiry_date with every carton of the batch still physical"
        actor: system
        preconditions:
          - "logical clock >= expiry_date"
        side_effects:
          - "status = EXPIRED"
          - "every carton of the batch not yet DESTROYED → DESTROYED with a DESTROY ledger entry"
      - from: RELEASED
        to: ALLOCATED
        trigger: "system — automatic when every AllocationEntitlement of the batch reaches FULFILLED"
        actor: system
        preconditions:
          - "at least one AllocationEntitlement exists for the batch"
          - "every AllocationEntitlement.allocation_batch_id == this batch has acceptance_status FULFILLED"
        side_effects:
          - "status = ALLOCATED"
          - "jurisdiction_program.released_cartons_to_date += allocated_cartons (ledger sync)"
      - from: ALLOCATED
        to: DEPLETED
        trigger: "system — automatic when the last Carton of the batch reaches DESTROYED"
        actor: system
        preconditions:
          - "every Carton.allocation_batch_id == this batch has temperature_state DESTROYED"
        side_effects:
          - "status = DEPLETED"
      - from: DRAFT
        to: RECALLED
        trigger: "POST /allocation-batches/{id}/recall"
        actor: RegulatoryAffairsOfficer
        preconditions:
          - "batch is DRAFT or RELEASED or ALLOCATED (ERR_BATCH_NOT_RECALLABLE)"
        side_effects:
          - "status = RECALLED"
          - "every Carton of the batch whose temperature_state is not DESTROYED → DESTROYED"
          - "for each of those Cartons: append DoseLedgerEntry(entry_type DESTROY, quantity_doses = 0)"
          - "for each AllocationEntitlement of the batch with available_cartons > 0: acceptance_status = LAPSED and held_cartons = 0"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /allocation-batches/{id}/recall"
        actor: RegulatoryAffairsOfficer
        preconditions:
          - "batch is DRAFT or RELEASED or ALLOCATED (ERR_BATCH_NOT_RECALLABLE)"
        side_effects:
          - "status = RECALLED"
          - "every Carton of the batch whose temperature_state is not DESTROYED → DESTROYED"
          - "for each of those Cartons: append DoseLedgerEntry(entry_type DESTROY, quantity_doses = 0)"
          - "for each AllocationEntitlement of the batch with available_cartons > 0: acceptance_status = LAPSED and held_cartons = 0"
      - from: ALLOCATED
        to: RECALLED
        trigger: "POST /allocation-batches/{id}/recall"
        actor: RegulatoryAffairsOfficer
        preconditions:
          - "batch is DRAFT or RELEASED or ALLOCATED (ERR_BATCH_NOT_RECALLABLE)"
        side_effects:
          - "status = RECALLED"
          - "every Carton of the batch whose temperature_state is not DESTROYED → DESTROYED"
          - "for each of those Cartons: append DoseLedgerEntry(entry_type DESTROY, quantity_doses = 0)"

  - entity: AllocationWindow
    initial_state: ANNOUNCED
    terminal_states: [CLOSED]
    transitions:
      - from: ANNOUNCED
        to: OPEN
        trigger: "POST /allocation-windows/{id}/open"
        actor: DistributionPlanner
        preconditions:
          - "allocation_batch.status == RELEASED (ERR_BATCH_NOT_RELEASED)"
          - "logical clock >= opens_at and logical clock < closes_at (ERR_WINDOW_NOT_OPEN)"
          - "jurisdiction_program.standing_status != FROZEN (ERR_PROGRAM_FROZEN)"
        side_effects:
          - "status = OPEN"
          - "one AllocationEntitlement is created for the window with computed_cartons from the program allocation basis and acceptance_status PENDING"
          - "jurisdiction_program.released_cartons_to_date += computed_cartons"
          - "jurisdiction_program.credit_balance_cartons -= min(computed_cartons, jurisdiction_program.credit_balance_cartons)"
          - "allocation_batch.allocated_cartons recomputed; allocation_batch.unallocated_cartons recomputed"
      - from: OPEN
        to: CLOSED
        trigger: "POST /allocation-windows/{id}/close"
        actor: DistributionPlanner | system
        preconditions:
          - "logical clock >= closes_at (ERR_WINDOW_STILL_OPEN)"
        side_effects:
          - "status = CLOSED"
          - "for the window's AllocationEntitlement: if available_cartons > 0 then ShippingWindowLapse is created with reason ACCEPTANCE_WINDOW_CLOSED and the entitlement becomes LAPSED"
          - "jurisdiction_program.lapsed_carton_count += the created lapse's lapsed_cartons"
          - "jurisdiction_program.standing_status recomputed"
          - "returns cartons to allocation_batch.unallocated_cartons"

  - entity: AllocationEntitlement
    initial_state: PENDING
    terminal_states: [FULFILLED, LAPSED]
    transitions:
      - from: PENDING
        to: PARTIALLY_ACCEPTED
        trigger: "POST /site-orders/{id}/accept (partial quantity)"
        actor: DistributionPlanner
        preconditions:
          - "the ordering site is equipment_certified and its storage_capability admits the batch (ERR_SITE_NOT_READY)"
          - "accepted cartons cover the governing minimum order (ERR_BELOW_MIN_ORDER)"
          - "accepted cartons <= available_cartons (ERR_ENTITLEMENT_EXHAUSTED)"
        side_effects:
          - "held_cartons += accepted_cartons; accepted_cartons += accepted_cartons"
          - "site_order.accepted_cartons set; order_status PARTIALLY_ACCEPTED"
          - "site_order.doses_released only when the dispatch later completes"
      - from: PENDING
        to: FULFILLED
        trigger: "POST /site-orders/{id}/accept (full quantity)"
        actor: DistributionPlanner
        preconditions:
          - "accepted cartons == available_cartons (ERR_ENTITLEMENT_EXHAUSTED)"
        side_effects:
          - "accepted_cartons += accepted_cartons; held_cartons += accepted_cartons"
          - "allocation_batch.allocated_cartons recomputed"
          - "site_order.order_status = ACCEPTED"
      - from: PARTIALLY_ACCEPTED
        to: FULFILLED
        trigger: "POST /site-orders/{id}/accept on a later order against the same entitlement"
        actor: DistributionPlanner
        preconditions:
          - "available_cartons becomes 0 after this acceptance (ERR_ENTITLEMENT_EXHAUSTED otherwise)"
        side_effects:
          - "accepted_cartons and held_cartons incremented"
          - "allocation_batch.allocated_cartons recomputed"
      - from: PENDING
        to: LAPSED
        trigger: "system — POST /allocation-windows/{id}/close with available_cartons > 0"
        actor: system
        preconditions:
          - "computed_cartons - held_cartons > 0"
        side_effects:
          - "lapsed_at = logical clock; held_cartons = 0"
      - from: PARTIALLY_ACCEPTED
        to: LAPSED
        trigger: "system — POST /allocation-windows/{id}/close with available_cartons > 0"
        actor: system
        preconditions:
          - "computed_cartons - held_cartons > 0"
        side_effects:
          - "lapsed_at = logical clock; held_cartons = 0"

  - entity: SiteOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, FULFILLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /site-orders/{id}/submit"
        actor: SiteCoordinator
        preconditions:
          - "allocation_entitlement.acceptance_status IN {PENDING, PARTIALLY_ACCEPTED} (ERR_ENTITLEMENT_NOT_ACCEPTING)"
          - "allocation_window.status == OPEN and logical clock < closes_at (ERR_WINDOW_CLOSED)"
          - "storage_site.equipment_certified == true at the logical clock (ERR_SITE_EQUIPMENT_NOT_CERTIFIED)"
          - "storage_site.storage_capability != AMBIENT_ONLY (ERR_SITE_CANNOT_ACCEPT_ULTRA_COLD)"
          - "requested_cartons <= allocation_entitlement.available_cartons (ERR_ORDER_EXCEEDS_ENTITLEMENT)"
        side_effects:
          - "order_status = SUBMITTED; submitted_at = logical clock; requested_cartons_snapshot = requested_cartons"
          - "requested_doses accepted as-is even when it disagrees with requested_cartons; rounding is deferred to acceptance"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /site-orders/{id}/accept"
        actor: DistributionPlanner
        preconditions:
          - "jurisdiction_program.standing_status == OPEN (ERR_PROGRAM_RESTRICTED)"
          - "accepted cartons >= governing minimum order (ERR_BELOW_MIN_ORDER)"
          - "accepted cartons <= allocation_entitlement.available_cartons (ERR_ENTITLEMENT_EXHAUSTED)"
          - "storage_site capacity at deliver_at accommodates the accepted cartons for the required entry_type (ERR_SITE_CAPACITY_INSUFFICIENT)"
        side_effects:
          - "accepted_cartons = computed cartons; order_status = ACCEPTED"
          - "allocation_entitlement.held_cartons += accepted_cartons"
          - "rejected_cartons = requested_cartons_snapshot - accepted_cartons"
          - "when rejected_cartons > 0 an OrderRejection is created and an EntitlementRelease records the returned cartons"
      - from: SUBMITTED
        to: PARTIALLY_ACCEPTED
        trigger: "POST /site-orders/{id}/accept"
        actor: DistributionPlanner
        preconditions:
          - "accepted cartons < requested_cartons_snapshot (ERR_INVALID_REQUEST when equal — use ACCEPTED)"
          - "accepted cartons >= governing minimum order (ERR_BELOW_MIN_ORDER)"
        side_effects:
          - "accepted_cartons = computed cartons; rejected_cartons = requested_cartons_snapshot - accepted_cartons"
          - "OrderRejection created with reason_code BELOW_MIN_ORDER or CAPACITY_UNAVAILABLE"
          - "allocation_entitlement.held_cartons += accepted_cartons"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /site-orders/{id}/reject"
        actor: DistributionPlanner
        preconditions:
          - "reason_code ∈ {BELOW_MIN_ORDER, NO_ENTITLEMENT, CAPACITY_UNAVAILABLE, SITE_NOT_READY, WINDOW_CLOSED} (ERR_INVALID_REQUEST)"
        side_effects:
          - "order_status = REJECTED; rejected_cartons = requested_cartons_snapshot"
          - "OrderRejection created and held_cartons of the entitlement released"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /site-orders/{id}/reject"
        actor: DistributionPlanner
        preconditions:
          - "reason_code == WINDOW_CLOSED or SITE_NOT_READY (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "order_status = REJECTED; rejected_cartons = requested_cartons"
      - from: ACCEPTED
        to: FULFILLED
        trigger: "POST /dispatches/{id}/deliver"
        actor: SiteCoordinator
        preconditions:
          - "the dispatch's ColdChainShipper.packing_status == RELEASED (ERR_SHIPPER_NOT_RELEASED)"
          - "all cartons on the dispatch arrive in a state the destination can hold (ERR_CARTON_POST_THAW)"
        side_effects:
          - "order_status = FULFILLED; payment_status = DUE"
          - "storage_site.inventory_status recomputed"
          - "allocation_entitlement.accepted_cartons unchanged; held_cartons -= accepted_cartons"
          - "when the entitlement's available_cartons reaches 0 the entitlement becomes FULFILLED"
      - from: PARTIALLY_ACCEPTED
        to: FULFILLED
        trigger: "POST /dispatches/{id}/deliver"
        actor: SiteCoordinator
        preconditions:
          - "the dispatch's ColdChainShipper.packing_status == RELEASED (ERR_SHIPPER_NOT_RELEASED)"
        side_effects:
          - "order_status = FULFILLED; payment_status = DUE"
          - "storage_site.inventory_status recomputed"
      - from: FULFILLED
        to: ACCEPTED
        trigger: "POST /site-orders/{id}/fulfillment/reverse (compensating action)"
        actor: DistributionPlanner
        preconditions:
          - "every Carton released under this order is still physical (temperature_state not DESTROYED) (ERR_CARTONS_DESTROYED)"
          - "no DoseLedgerEntry with entry_type ADMINISTER exists for those cartons (ERR_DOSES_ALREADY_ADMINISTERED)"
        side_effects:
          - "order_status = ACCEPTED; payment_status = NOT_DUE"
          - "one DoseLedgerEntry(entry_type REVERSE, quantity_doses negated) per RELEASE entry on each carton"
          - "allocation_entitlement.held_cartons += accepted_cartons"
          - "cumulative_released_doses on each carton decreases by exactly the reversed amount"

  - entity: DispatchOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, REJECTED_AT_DOCK]
    transitions:
      - from: DRAFT
        to: PACKED
        trigger: "POST /dispatches/{id}/pack"
        actor: LogisticsOperator
        preconditions:
          - "site_order.order_status IN {ACCEPTED, PARTIALLY_ACCEPTED} (ERR_ORDER_NOT_ACCEPTED)"
          - "storage_site.equipment_certified == true at the logical clock (ERR_SITE_EQUIPMENT_NOT_CERTIFIED)"
          - "a staging site with ULTRA_COLD capability is available when entry_route is THAW_AT_HUB (ERR_NO_HUB_AVAILABLE), and that staging site holds a RECORDED, unexpired PASSED verification (ERR_HUB_NOT_CERTIFIED)"
        side_effects:
          - "status = PACKED; freeze_required computed from the destination's reported_entry_type"
          - "staging_site_id set when entry_route == THAW_AT_HUB"
      - from: PACKED
        to: IN_TRANSIT
        trigger: "POST /dispatches/{id}/dispatch"
        actor: LogisticsOperator
        preconditions:
          - "the dispatch's ColdChainShipper.packing_status == SEALED (ERR_SHIPPER_NOT_SEALED)"
          - "logical clock is within a declared shipping day/cutoff pair of the program shipping schedule (ERR_OUTSIDE_SHIPPING_SCHEDULE)"
          - "site_order.order_status IN {ACCEPTED, PARTIALLY_ACCEPTED} and .payment_status IN {NOT_DUE, DUE} (ERR_PAYMENT_HOLD)"
        side_effects:
          - "status = IN_TRANSIT; dispatched_at = logical clock; eta_at = dispatched_at + transit hours from the shipping schedule"
          - "one DoseLedgerEntry(entry_type RELEASE) per carton on the dispatch"
          - "carton.time_state remains ULTRA_COLD while shipped; a THAW_AT_HUB route thaw happens at the staging site after arrival"
          - "each carton on the dispatch → IN_TRANSIT"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /dispatches/{id}/deliver"
        actor: SiteCoordinator
        preconditions:
          - "a SiteEquipmentVerification with outcome PASSED exists for the destination (ERR_DEST_CERT_EXPIRED_AT_DOCK)"
        side_effects:
          - "status = DELIVERED"
          - "each carton → REFRIGERATED when entry_route is THAW_AT_HUB, else the carton keeps its packed state"
          - "site_order.order_status = FULFILLED and payment_status = DUE"
          - "destination.reported_entry_type recomputed; destination.inventory_status recomputed"
      - from: IN_TRANSIT
        to: REJECTED_AT_DOCK
        trigger: "POST /dispatches/{id}/reject-at-dock"
        actor: SiteCoordinator
        preconditions:
          - "dock inspection failed: equipment certificate expired at arrival, or pack hold was raised in transit (ERR_DOCK_REJECTION_REQUIRED)"
        side_effects:
          - "status = REJECTED_AT_DOCK"
          - "site_order.payment_status = DISPUTED"
          - "the route cartons remain IN_TRANSIT and are re-consigned to the staging site"

  - entity: ColdChainShipper
    initial_state: PREPARING
    terminal_states: [RELEASED]
    transitions:
      - from: PREPARING
        to: SEALED
        trigger: "POST /shippers/{id}/seal"
        actor: LogisticsOperator
        preconditions:
          - "dry_ice_kg >= required_dry_ice_kg (ERR_DRY_ICE_INSUFFICIENT)"
          - "logger_serial is recorded (ERR_LOGGER_MISSING)"
          - "packing_completed_at - packing_started_at <= MAX_PACKING_HOURS (ERR_PACKING_EXCEEDED)"
        side_effects:
          - "packing_status = SEALED; packing_completed_at = logical clock"
          - "when any packing precondition fails the transition is refused and packing_status stays PREPARING"
      - from: SEALED
        to: IN_TRANSIT
        trigger: "POST /dispatches/{id}/dispatch"
        actor: LogisticsOperator
        preconditions:
          - "a TemperatureLoggerReading exists with recorded_at >= packing_completed_at (ERR_LOGGER_READING_MISSING)"
        side_effects:
          - "packing_status = IN_TRANSIT"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /dispatches/{id}/deliver"
        actor: SiteCoordinator
        preconditions:
          - "a TemperatureLoggerReading exists with recorded_at within LOGGER_READING_GRACE_MINUTES of the arrival instant (ERR_LOGGER_READING_LATE)"
        side_effects:
          - "packing_status = RECEIVED"
      - from: RECEIVED
        to: HELD
        trigger: "POST /shippers/{id}/hold"
        actor: ColdChainReviewer
        preconditions:
          - "a hold_reason is supplied and the shipper is RECEIVED (ERR_INVALID_REQUEST)"
        side_effects:
          - "packing_status = HELD"
          - "each carton on the shipper remains physically where it is; no carton state change"
      - from: RECEIVED
        to: RELEASED
        trigger: "POST /shippers/{id}/release"
        actor: ColdChainReviewer
        preconditions:
          - "every TemperatureExcursion for cartons on this shipper has adjudication_status != PENDING (ERR_PENDING_EXCURSION)"
          - "excursion_cumulative_minutes over the shipper's cartons <= product excursion_max_cumulative_minutes (ERR_EXCURSION_EXCEEDS_CAP)"
        side_effects:
          - "packing_status = RELEASED"
          - "destination.inventory_status recomputed"
      - from: HELD
        to: RELEASED
        trigger: "POST /shippers/{id}/release"
        actor: ColdChainReviewer
        preconditions:
          - "hold_reason has been cleared by a ColdChainReviewer decision (ERR_HOLD_NOT_CLEARED)"
        side_effects:
          - "packing_status = RELEASED; hold_reason = null"

  - entity: Carton
    initial_state: ULTRA_COLD
    terminal_states: [DESTROYED]
    transitions:
      - from: ULTRA_COLD
        to: IN_TRANSIT
        trigger: "POST /dispatches/{id}/dispatch"
        actor: LogisticsOperator
        preconditions:
          - "cold_chain_shipper.packing_status == SEALED (ERR_SHIPPER_NOT_SEALED)"
        side_effects:
          - "temperature_state = IN_TRANSIT; thawed_at remains null; current_expires_at remains null (batch expiry governs)"
      - from: ULTRA_COLD
        to: THAWED
        trigger: "POST /cartons/{id}/thaw"
        actor: LogisticsOperator | SiteCoordinator
        preconditions:
          - "carton is not IN_TRANSIT (ERR_CARTON_IN_TRANSIT)"
          - "no DoseLedgerEntry with entry_type EXPIRE exists for the carton (ERR_CARTON_EXPIRED)"
        side_effects:
          - "temperature_state = THAWED; thawed_at = logical clock"
          - "thaw_window_expires_at = thawed_at + the thaw window function's effective elapsed hours"
          - "current_expires_at = min(batch.expiry_date, thaw_window_expires_at)"
          - "one DoseLedgerEntry(entry_type THAW, quantity_doses 0) appended"
          - "when a THAW_AT_HUB staging hop exists for the carton: current_expires_at = min(batch.expiry_date, thawed_at + refrigerated_shelf_life_hours, thaw_window_expires_at)"
      - from: IN_TRANSIT
        to: REFRIGERATED
        trigger: "POST /dispatches/{id}/deliver with entry_route THAW_AT_HUB"
        actor: SiteCoordinator
        preconditions:
          - "destination storage_capability is ULTRA_COLD or REFRIGERATED (ERR_SITE_CANNOT_ACCEPT_ULTRA_COLD)"
        side_effects:
          - "temperature_state = REFRIGERATED; thawed_at = arrival instant if null"
          - "current_expires_at computed with the THAW_AT_HUB shelf-life cap"
          - "current_expires_at = min(batch.expiry_date, thawed_at + refrigerated_shelf_life_hours, thawed_at + thaw_stability_hours)"
      - from: IN_TRANSIT
        to: PALLET_STAGED
        trigger: "system — dispatch arrives at the destination with entry_route DIRECT_ULTRA_COLD and the destination has no usable ULTRA_COLD capacity"
        actor: system
        preconditions:
          - "destination.reported_entry_type == ULTRA_COLD and destination ultra-cold capacity at arrival is insufficient (ERR_SITE_CAPACITY_INSUFFICIENT)"
        side_effects:
          - "temperature_state = PALLET_STAGED"
          - "destination open_excursion_count += 1 and a TemperatureExcursion is created with review_status REPORTED"
      - from: IN_TRANSIT
        to: ULTRA_COLD
        trigger: "POST /dispatches/{id}/deliver with entry_route DIRECT_ULTRA_COLD"
        actor: SiteCoordinator
        preconditions:
          - "thawed_at is null (ERR_REFREEZE_FORBIDDEN applies when it is not)"
        side_effects:
          - "temperature_state = ULTRA_COLD; destination.reported_entry_type recomputed"
      - from: REFRIGERATED
        to: IN_TRANSIT
        trigger: "POST /site-transfers/{id}/approve then POST /site-transfers/{id}/dispatch"
        actor: DistributionPlanner
        preconditions:
          - "site_transfer.admissibility == ADMITTED (ERR_TRANSFER_NOT_ADJUDICATED)"
          - "destination.storage_capability == REFRIGERATED (ERR_DEST_CAPABILITY_MISMATCH)"
          - "logical clock < current_expires_at (ERR_CARTON_EXPIRED)"
        side_effects:
          - "temperature_state = IN_TRANSIT"
          - "one CartonStorageReservation(entry_type REFRIGERATED, temp_state THAWED) is created at the destination with the transfer's interval; cumulative_conflict_minutes computed under CAPACITY_POOLED semantics"
          - "on overlap rejection the reservation is not created and the transition is refused with ERR_STORAGE_RESERVATION_CONFLICT"
      - from: IN_TRANSIT
        to: REFRIGERATED
        trigger: "POST /site-transfers/{id}/receive"
        actor: SiteCoordinator
        preconditions:
          - "no TemperatureExcursion for this carton has review_status REPORTED or UNDER_REVIEW (ERR_PENDING_EXCURSION)"
        side_effects:
          - "temperature_state = REFRIGERATED; site_transfer.status = RECEIVED"
          - "one DoseLedgerEntry(entry_type TRANSFER_IN, quantity_doses = remaining_doses) at the destination and one TRANSFER_OUT at the origin"
          - "origin.inventory_status recomputed; destination.inventory_status recomputed"
          - "when the transfer's reservation interval overlaps an incumbent reservation under HALF_OPEN, cumulative_conflict_minutes is set and the transfer is left in RECEIVED with dest_required_entry_type unchanged"
      - from: IN_TRANSIT
        to: PALLET_STAGED
        trigger: "POST /site-transfers/{id}/receive when the destination cannot hold the carton's reported entry type"
        actor: SiteCoordinator
        preconditions:
          - "destination.reported_entry_type != site_transfer.dest_required_entry_type (ERR_DEST_RESTRICTED)"
        side_effects:
          - "temperature_state = PALLET_STAGED"
          - "dest open_excursion_count += 1; TemperatureExcursion created with review_status REPORTED"
      - from: REFRIGERATED
        to: PUNCTURED
        trigger: "POST /cartons/{id}/puncture"
        actor: SiteCoordinator
        preconditions:
          - "at least one DoseLedgerEntry with entry_type ADMINISTER exists for the carton (ERR_CARTON_NOT_IN_USE)"
          - "logical clock < current_expires_at (ERR_CARTON_EXPIRED)"
        side_effects:
          - "temperature_state = PUNCTURED"
          - "one DoseLedgerEntry(entry_type PUNCTURE, quantity_doses 0) appended"
          - "current_expires_at = min(current_expires_at, logical clock + product punctured_bud_hours)"
      - from: THAWED
        to: PUNCTURED
        trigger: "POST /cartons/{id}/puncture"
        actor: SiteCoordinator
        preconditions:
          - "at least one DoseLedgerEntry with entry_type ADMINISTER exists for the carton (ERR_CARTON_NOT_IN_USE)"
        side_effects:
          - "current_expires_at = min(current_expires_at, logical clock + product punctured_bud_hours)"
      - from: REFRIGERATED
        to: THAWED
        trigger: "POST /cartons/{id}/advance-logical-state"
        actor: ColdChainReviewer
        preconditions:
          - "a TemperatureExcursion for the carton has adjudication_status USABLE (ERR_EXCURSION_PENDING_REVIEW)"
        side_effects:
          - "temperature_state = THAWED"
          - "thawed_at reset to the adjudication instant; thaw_window_expires_at recomputed from the EFFECTIVE elapsed hours, not from wall-clock elapse"
      - from: PALLET_STAGED
        to: ULTRA_COLD
        trigger: "POST /cartons/{id}/refreeze"
        actor: ColdChainReviewer
        preconditions:
          - "product.refreeze_prohibited == false (ERR_REFREEZE_PROHIBITED)"
          - "a TemperatureExcursion for the carton has adjudication_status USABLE (ERR_EXCURSION_PENDING_REVIEW)"
        side_effects:
          - "temperature_state = ULTRA_COLD; thawed_at = null; thaw_window_expires_at = null; current_expires_at = batch.expiry_date"
          - "destination.reported_entry_type recomputed"
      - from: PUNCTURED
        to: PUNCTURED
        trigger: "POST /cartons/{id}/puncture (re-puncture of an already punctured carton)"
        actor: SiteCoordinator
        preconditions:
          - "current_expires_at is already the puncture limit, so the recomputation is a no-op (ERR_ALREADY_PUNCTURED)"
        side_effects:
          - "none; the request is refused and no ledger entry is written"
      - from: ULTRA_COLD
        to: DESTROYED
        trigger: "POST /cartons/{id}/destroy"
        actor: ColdChainReviewer
        preconditions:
          - "a TemperatureExcursion for the carton has adjudication_status NOT_USABLE (ERR_EXCURSION_PENDING_REVIEW otherwise)"
        side_effects:
          - "temperature_state = DESTROYED"
          - "one DoseLedgerEntry(entry_type DESTROY, quantity_doses = -remaining_doses) appended"
          - "origin storage_site.inventory_status recomputed"
      - from: REFRIGERATED
        to: DESTROYED
        trigger: "POST /cartons/{id}/destroy"
        actor: ColdChainReviewer
        preconditions:
          - "a TemperatureExcursion for the carton has adjudication_status NOT_USABLE (ERR_EXCURSION_PENDING_REVIEW otherwise)"
        side_effects:
          - "temperature_state = DESTROYED"
          - "one DoseLedgerEntry(entry_type DESTROY, quantity_doses = -remaining_doses) appended"
      - from: THAWED
        to: DESTROYED
        trigger: "POST /cartons/{id}/destroy"
        actor: ColdChainReviewer
        preconditions:
          - "a TemperatureExcursion for the carton has adjudication_status NOT_USABLE (ERR_EXCURSION_PENDING_REVIEW otherwise)"
        side_effects:
          - "temperature_state = DESTROYED"
          - "one DoseLedgerEntry(entry_type DESTROY, quantity_doses = -remaining_doses) appended"
      - from: PALLET_STAGED
        to: DESTROYED
        trigger: "POST /cartons/{id}/destroy"
        actor: ColdChainReviewer
        preconditions:
          - "a TemperatureExcursion for the carton has adjudication_status NOT_USABLE (ERR_EXCURSION_PENDING_REVIEW otherwise)"
        side_effects:
          - "temperature_state = DESTROYED"
          - "one DoseLedgerEntry(entry_type DESTROY, quantity_doses = -remaining_doses) appended"
      - from: "REFRIGERATED | THAWED | PUNCTURED | ULTRA_COLD | PALLET_STAGED"
        to: EXPIRED
        trigger: "system — automatic when the logical clock reaches current_expires_at"
        actor: system
        preconditions:
          - "current_expires_at is not null and logical clock >= current_expires_at"
          - "temperature_state not in {DESTROYED, EXPIRED}"
        side_effects:
          - "temperature_state = EXPIRED; expired_at = current_expires_at"
          - "one DoseLedgerEntry(entry_type EXPIRE, quantity_doses = -remaining_doses) appended"
          - "administrative_expired = true while the carton remains physical"

  - entity: DoseLedgerEntry
    initial_state: RECORDED
    terminal_states: []
    transitions:
      - from: RECORDED
        to: RECONCILED
        trigger: "POST /wastage-reports/{id}/reconcile"
        actor: ColdChainReviewer
        preconditions:
          - "the carton's administrative_remaining_doses and remaining_doses agree for the period (ERR_DOSE_ACCOUNTABILITY_MISMATCH)"
        side_effects:
          - "status = RECONCILED"
          - "wastage_report.dose_accountability_status = RECONCILED"
      - from: RECONCILED
        to: RECORDED
        trigger: "POST /dose-ledger-entries (a REVERSE entry referencing a RECONCILED entry)"
        actor: DistributionPlanner
        preconditions:
          - "reverses_entry_id names a RECONCILED entry on the same carton (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "status = RECORDED for the reversed entry and the new REVERSE entry is written RECORDED"
          - "carton.administrative_remaining_doses recomputed"

  - entity: SiteTransfer
    initial_state: REQUESTED
    terminal_states: [RECEIVED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /site-transfers/{id}/approve"
        actor: DistributionPlanner
        preconditions:
          - "from_site_id inventory_status == OPEN (ERR_SITE_RESTRICTED)"
          - "to_site_id.equipment_certified == true at the logical clock (ERR_DEST_EQUIPMENT_NOT_CERTIFIED)"
          - "to_site_id.storage_capability admits dest_required_entry_type (ERR_DEST_CAPABILITY_MISMATCH)"
          - "logical clock < carton.current_expires_at or current_expires_at is null (ERR_CARTON_EXPIRED)"
        side_effects:
          - "status = APPROVED; dest_required_entry_type recomputed; admissibility = ADMITTED"
          - "one CartonStorageReservation is created at the destination for the carton"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /site-transfers/{id}/reject"
        actor: DistributionPlanner
        preconditions:
          - "reason is one of the lapse_reason values (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "status = REJECTED; lapse_reason set"
      - from: APPROVED
        to: DISPATCHED
        trigger: "POST /site-transfers/{id}/dispatch"
        actor: LogisticsOperator
        preconditions:
          - "logical clock < thaw window expiry for the carton (ERR_THAW_WINDOW_EXPIRED)"
          - "the reservation at the destination is HELD or CONFIRMED (ERR_STORAGE_RESERVATION_CONFLICT)"
        side_effects:
          - "status = DISPATCHED; carton → IN_TRANSIT; reservation.status = HELD"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /site-transfers/{id}/cancel"
        actor: DistributionPlanner
        preconditions:
          - "the reservation is not CONFIRMED (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "status = CANCELLED; reservation.status = RELEASED; lapse_reason = WINDOW_EXPIRED when the reservation interval already elapsed"
      - from: DISPATCHED
        to: RECEIVED
        trigger: "POST /site-transfers/{id}/receive"
        actor: SiteCoordinator
        preconditions:
          - "no TemperatureExcursion for the carton has review_status REPORTED or UNDER_REVIEW (ERR_PENDING_EXCURSION)"
          - "destination.reported_entry_type == dest_required_entry_type (ERR_DEST_RESTRICTED)"
          - "logical clock < carton.current_expires_at (ERR_CARTON_EXPIRED)"
        side_effects:
          - "status = RECEIVED; reservation.status = CONFIRMED"
          - "carton → REFRIGERATED; TRANSFER_OUT at origin and TRANSFER_IN at destination appended"
          - "to_site_id.usable_doses recomputed; from_site_id.usable_doses recomputed"
      - from: DISPATCHED
        to: REJECTED
        trigger: "POST /site-transfers/{id}/reject (post-receipt excursion finding)"
        actor: ColdChainReviewer
        preconditions:
          - "logical clock >= reservation_expires_at (ERR_TRANSFER_RESERVATION_ACTIVE)"
        side_effects:
          - "status = REJECTED; lapse_reason = WINDOW_EXPIRED or REFREEZE_FORBIDDEN"
          - "carton remains in IN_TRANSIT and becomes PALLET_STAGED at the destination"
          - "reservation.status = LAPSED"

  - entity: TemperatureExcursion
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /temperature-excursions/{id}/review"
        actor: ColdChainReviewer
        preconditions:
          - "storage_site_id allows the reviewer and the site's inventory_status != FROZEN (ERR_SITE_FROZEN)"
          - "logical clock <= reported_at + program.adjudication_sla_hours (ERR_ADJUDICATION_SLA_EXCEEDED)"
        side_effects:
          - "review_status = UNDER_REVIEW"
          - "quarantine_status = OPEN for the excursion's carton; all cartons in the same CartonFamily → PALLET_STAGED"
          - "reviewing site.storage_site_id inventory_status recomputed; RESTRICTED when program.quarantine_on_review is true"
      - from: UNDER_REVIEW
        to: ADJUDICATED
        trigger: "POST /temperature-excursions/{id}/adjudicate"
        actor: MedicalScienceLiaison
        preconditions:
          - "the acting user id differs from the user id that moved the excursion to UNDER_REVIEW (ERR_SEGREGATION_OF_DUTIES)"
          - "associated DosesAffectedSlice entries with time_slice_c <= min_temperature_c have closure_state CLOSED (ERR_SLICE_NOT_CLOSED)"
          - "every SiteEquipmentVerification or disposition-evidence reference the decision cites is valid at the adjudication instant (ERR_REFERENCE_INVALID_AT_ADJUDICATION)"
        side_effects:
          - "review_status = ADJUDICATED; adjudication_status = the submitted outcome; adjudicated_at = logical clock"
          - "when outcome is NOT_USABLE: one DoseLedgerEntry(entry_type WASTE, quantity_doses = -(min(carton.remaining_doses, certified_lost_doses))) is appended, carton.temperature_state becomes DESTROYED, quarantine_status moves RETAINED then DESTROYED; no separate DESTROY entry is written and carton.remaining_doses falls only by the wasted quantity"
          - "when outcome is USABLE: quarantine_status = LIFTED and carton.current_expires_at recomputed from the EFFECTIVE elapsed hours"
          - "decrement of carton.thaw_window_expires_at by the certified effective hours"
          - "for each site in the same CartonFamily membership as the excursion's site: open_excursion_count recomputed; inventory_status recomputed"
          - "site_slice_impact_doses and transitive_site_doses recomputed for the excursion"
      - from: ADJUDICATED
        to: UNDER_REVIEW
        trigger: "POST /temperature-excursions/{id}/appeals/{appealId}/accept"
        actor: RegulatoryAffairsOfficer
        preconditions:
          - "an AdjudicationAppeal on this excursion has status FILED (ERR_APPEAL_NOT_FILED)"
          - "the appeal is filed within APPEAL_WINDOW_HOURS of adjudicated_at (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects:
          - "review_status = UNDER_REVIEW; adjudication_status = PENDING; adjudicated_at = null"
          - "quarantine_status = OPEN; the NOT_USABLE write-off is reversed by a DoseLedgerEntry(entry_type REVERSE)"
          - "carton.remaining_doses restored to its pre-adjudication value"
          - "the adjudication's decision trace id becomes the value of excursion.current_resolution_trace_id"

  - entity: ExcursionAdjudication
    initial_state: DECIDED
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DECIDED
        to: APPEALED
        trigger: "POST /temperature-excursions/{id}/appeals"
        actor: SiteCoordinator
        preconditions:
          - "the referenced excursion is ADJUDICATED and the carton is not DESTROYED (ERR_CARTON_DESTROYED)"
          - "no open appeal already exists for the excursion (ERR_APPEAL_ALREADY_OPEN)"
        side_effects:
          - "status = APPEALED; an AdjudicationAppeal row is created FILED"
      - from: APPEALED
        to: DECIDED
        trigger: "POST /temperature-excursions/{id}/appeals/{appealId}/deny"
        actor: RegulatoryAffairsOfficer
        preconditions:
          - "the appeal is FILED (ERR_APPEAL_NOT_FILED)"
        side_effects:
          - "status = DECIDED; the appeal status = DENIED; the excursion stays ADJUDICATED"
          - "decided_by = the acting RegulatoryAffairsOfficer (must differ from the original adjudicator, else ERR_SEGREGATION_OF_DUTIES)"
      - from: DECIDED
        to: WITHDRAWN
        trigger: "POST /excursion-adjudications/{id}/withdraw"
        actor: RegulatoryAffairsOfficer
        preconditions:
          - "the excursion's adjudication_status is PENDING after a reopen (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "status = WITHDRAWN"
      - from: APPEALED
        to: SUPERSEDED
        trigger: "POST /temperature-excursions/{id}/adjudicate (second adjudication while an appeal is open)"
        actor: MedicalScienceLiaison
        preconditions:
          - "the second adjudicator differs from the first (ERR_SEGREGATION_OF_DUTIES)"
          - "the second adjudicator differs from the appealing coordinator (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = SUPERSEDED; the superseding adjudication's prior_outcome = this row's outcome"
          - "excursion.current_resolution_trace_id points at the superseding adjudication"

  - entity: DosesAffectedSlice
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /temperature-excursions/{id}/review"
        actor: ColdChainReviewer
        preconditions:
          - "the parent excursion is REPORTED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "closure_state = IN_REVIEW"
      - from: IN_REVIEW
        to: CLOSED
        trigger: "POST /doses-affected-slices/{id}/close"
        actor: MedicalScienceLiaison
        preconditions:
          - "a SiteEquipmentVerification or disposition-evidence reference with verified_at <= logical clock is supplied (ERR_REFERENCE_INVALID_AT_ADJUDICATION)"
          - "doses_upper_bound >= the slice's observed doses (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "closure_state = CLOSED; status = CERTIFIED"
      - from: CLOSED
        to: IN_REVIEW
        trigger: "POST /doses-affected-slices/{id}/reopen"
        actor: RegulatoryAffairsOfficer
        preconditions:
          - "the parent excursion is not DESTROYED-adjacent: its carton is not DESTROYED (ERR_CARTON_DESTROYED)"
        side_effects:
          - "closure_state = IN_REVIEW; status = PENDING"

  - entity: WastageReport
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "POST /wastage-reports/{id}/reconcile"
        actor: ColdChainReviewer
        preconditions:
          - "the referenced adjudication is ADJUDICATED (ERR_EXCURSION_NOT_ADJUDICATED)"
          - "doses_reported >= certified_doses asserted by the adjudication (ERR_INVALID_REQUEST otherwise)"
          - "reconciliation_variance_doses / carton.doses_per_carton <= product wastage_threshold_pct (ERR_WASTAGE_THRESHOLD_EXCEEDED)"
        side_effects:
          - "dose_accountability_status = RECONCILED"
          - "the referencing ReportingPeriod.unaccounted_doses recomputed"
      - from: RECONCILED
        to: OPEN
        trigger: "POST /dose-ledger-entries with entry_type REVERSE against the reconciled carton"
        actor: DistributionPlanner
        preconditions:
          - "the reversing entry names the carton and a reconciled DoseLedgerEntry (ERR_INVALID_REQUEST)"
        side_effects:
          - "dose_accountability_status = OPEN"
          - "reconciliation_variance_doses recomputed"

  - entity: ReportingPeriod
    initial_state: OPEN
    terminal_states: [SUBMITTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /reporting-periods/{id}/submit"
        actor: RegulatoryAffairsOfficer
        preconditions:
          - "every TemperatureExcursion reported inside the period is ADJUDICATED (ERR_PENDING_ADJUDICATIONS_IN_PERIOD)"
          - "every ShippingWindowLapse inside the period has dose_reconciliation_status RECONCILED (ERR_PENDING_LAPSE_RECONCILIATION)"
          - "every DoseLedgerEntry inside the period has status RECONCILED (ERR_DOSE_ACCOUNTABILITY_MISMATCH)"
        side_effects:
          - "status = SUBMITTED"
          - "accounted_doses materialized under the effective variant; unaccounted_doses and wastage_rate_basis_points recomputed"
          - "jurisdiction_program.standing_status recomputed"
      - from: SUBMITTED
        to: OPEN
        trigger: "POST /reporting-periods/{id}/reopen"
        actor: RegulatoryAffairsOfficer
        preconditions:
          - "the period is SUBMITTED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "status = OPEN; report_version += 1"
          - "the prior materialization is dropped; accounted_doses recomputed under the effective variant when the period is resubmitted"

  - entity: CartonStorageReservation
    initial_state: HELD
    terminal_states: [RELEASED, LAPSED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /site-transfers/{id}/receive"
        actor: SiteCoordinator
        preconditions:
          - "the reservation interval has not elapsed (ERR_RESERVATION_EXPIRED)"
        side_effects:
          - "status = CONFIRMED; site_transfer.status = RECEIVED"
      - from: HELD
        to: LAPSED
        trigger: "system — automatic when logical clock >= end_at and status is HELD"
        actor: system
        preconditions:
          - "logical clock >= end_at"
        side_effects:
          - "status = LAPSED; the associated site_transfer becomes REJECTED with lapse_reason WINDOW_EXPIRED"
      - from: HELD
        to: RELEASED
        trigger: "POST /site-transfers/{id}/cancel"
        actor: DistributionPlanner
        preconditions:
          - "status is HELD, not CONFIRMED (ERR_RESERVATION_ALREADY_CONFIRMED otherwise)"
        side_effects:
          - "status = RELEASED; site_transfer.status = CANCELLED"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: entitlement-acceptance-stale-window
    parent_entity: AllocationWindow
    write_endpoint: "POST /site-orders/{id}/accept"
    occ_field: "expected_allocation_window_version"
    description: |
      Accepting a site order against an entitlement whose parent AllocationWindow
      has advanced its version since the planner last read it is rejected. The
      window version advances on every acceptance, rejection and release recorded
      against it, so a planner working from a pre-acceptance view of the window
      is holding a stale picture of how much of the window has already been
      committed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: shipper-pack-stale-dispatch
    parent_entity: ColdChainShipper
    write_endpoint: "POST /shippers/{id}/seal"
    occ_field: "expected_shipper_version"
    description: |
      Sealing a cold chain shipper whose version has advanced since the operator
      last read it is rejected. Attaching a carton or recording a temperature
      reading both advance the shipper version, so a pack sheet computed against
      the earlier cabin load is stale and must be recomputed before the shipper
      is closed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: carton_rounding_waterfall
    trigger: "POST /site-orders/{id}/submit (rounded_from_doses) and POST /site-orders/{id}/accept (accepted_cartons, min_order_shortfall_cartons)"
    algorithm: waterfall_allocation
    formula: |
      Step 1 — additive allocation over seven ordered buckets, in this exact order.
      Each bucket receives a non-negative contribution; there is no floor, so later
      buckets may receive less than their nominal ceiling and the earlier buckets keep
      their full allocation. The last bucket absorbs any residual doses.

        b1 = 4   * floor(requested_doses / 40)
        b2 = 24  * floor((requested_doses - 4  * floor(requested_doses / 40)) / 240)
        b3 = 6   * floor((requested_doses - b1 - b2) / 60)
        b4 = 9   * floor((requested_doses - b1 - b2 - b3) / 90)
        b5 = 12  * floor((requested_doses - b1 - b2 - b3 - b4) / 120)
        b6 = 8   * floor((requested_doses - b1 - b2 - b3 - b4 - b5) / 80)
        rest = requested_doses - b1 - b2 - b3 - b4 - b5 - b6
        b7 = min(requested_doses,
                 16 * floor(rest / 160) + 3 * floor((rest - 16 * floor(rest / 160)) / 30))

      Step 2 — round the dose need up to whole cartons:
        rounded_from_doses = ceil((b1 + b2 + b3 + b4 + b5 + b6 + b7) / doses_per_carton)
        Ceiling division is exact integer arithmetic: (numerator + doses_per_carton - 1) // doses_per_carton.

      Step 3 — apply the governing minimum order quantity. The shortfall is taken on
      the MANUFACTURER-COMPUTED carton need, BEFORE any earlier rejections are netted:
        governing_min = max(jurisdiction_program.min_order_cartons, product_configuration.min_order_cartons)
        min_order_shortfall_cartons = max(0, governing_min - rounded_from_doses)

      Step 4 — land the accepted cartons on the pack-size ceiling while preserving any
      prior rejection already taken on this order:
        prior_rejected = site_order.rejected_cartons
        if requested_doses > 0:
            pack_ceiling = ceil((requested_doses + prior_rejected * doses_per_carton) / doses_per_carton)
        else:
            pack_ceiling = requested_cartons + prior_rejected
        accepted_cartons = min(max(pack_ceiling, governing_min), allocation_entitlement.available_cartons)
      This is a hand-computed variant: the number of accepted cartons is a literal the
      test author derives by running these four steps by hand, not a value the server
      recomputes at the same moment the disbursement is recorded.
    input_set: "SiteOrders with order_status IN {SUBMITTED, ACCEPTED, PARTIALLY_ACCEPTED}. Orders in DRAFT, REJECTED or FULFILLED are excluded from the waterfall step. SiteOrders with requested_doses == 0 are excluded entirely: they contribute 0 to every bucket and are skipped in the ceil step, so they never create a carton. Tie-break for the allocation order across several orders competing for one entitlement at the same instant: submitted_at ASC, then created_at ASC. Identity is never used."
    constants:
      BUCKET_ORDER: [b1, b2, b3, b4, b5, b6, b7]
      B1_PER: 4
      B1_MOD: 40
      B7_MAX_PER: 16
      B7_MIN_PER: 3
    precision: "integer doses and integer cartons; ceil is exact integer ceiling division, no floating point"
    variants:
      - name: dose_driven
        when: "requested_doses >= 1; the carton need is derived from the dose requirement"
        difference: "Base behaviour: the waterfall above produces rounded_from_doses, then the minimum-order uplift is applied on top."
      - name: carton_only
        when: "requested_doses == 0 and requested_cartons >= 1; the clinic ordered in cartons and declared no dose requirement"
        difference: "The waterfall is skipped entirely. rounded_from_doses = 0, min_order_shortfall_cartons = max(0, governing_min - 0) = governing_min, and the effective carton need is max(requested_cartons, governing_min) — a different carton count than the dose-driven variant produces for any positive requested_doses."
      - name: pack_ceiling_hand_computed
        when: "acceptance after a prior rejection on the same order"
        difference: "accepted_cartons is the hand-computed pack ceiling over the dose requirement plus the already-rejected cartons, not the entitlement's full available quantity."

  - name: dose_accountability_variants
    trigger: "POST /reporting-periods/{id}/submit and GET /reporting-periods/{id}/accountability"
    algorithm: dual_variant
    formula: |
      Both variants consume the same DoseLedgerEntry rows inside the half-open period
      [period_start, period_end) and produce different accounted dose totals.

      Variant A — interim (effective at submit time):
        interim_losses = (sum of |quantity_doses| over WASTE, EXPIRE and DESTROY entries whose
                          occurred_at falls inside the period)
                         minus (sum of |quantity_doses| over REVERSE entries inside the period that
                          name one of those loss entries)
        A loss entry that was reversed has moved to RECONCILED, so a reversed write-off
        contributes nothing to the first term.
        accounted_A = administered_A + interim_losses

      Variant B — certified write-off (effective when the period's adjudications close):
        certified_losses = sum of certified_lost_doses over every ExcursionAdjudication whose
                           effective_from falls inside [period_start, period_end)
        accounted_B = administered_B + certified_losses

      administered_A counts entries with entry_type ADMINISTER; administered_B counts the
      same rows but also subtracts every REVERSE entry that names an ADMINISTER entry, so
      the two administrations totals diverge whenever an administration is reversed.

      Both variants use the same denominator: released_doses = sum of quantity_doses over
      entries with entry_type RELEASE whose occurred_at falls inside the period.
    input_set: "DoseLedgerEntry rows with occurred_at IN [period_start, period_end); ExcursionAdjudication rows with effective_from IN [period_start, period_end); ShippingWindowLapse rows with lapsed_at IN [period_start, period_end) counted as interim losses only under variant B if their dose_reconciliation_status is RECONCILED. Entries with status RECONCILED are included in the certified variant and excluded from the interim variant's RECORDED-only filter."
    constants:
      LOSS_ENTRY_TYPES: [WASTE, EXPIRE, DESTROY]
    precision: "integer doses"
    variants:
      - name: interim
        when: "GET /reporting-periods/{id}/accountability with variant=INTERIM, or any read before the period is SUBMITTED"
        difference: "Counts every RECORDED loss entry at once; an open adjudication contributes its full WASTE quantity even though the loss is not yet certified."
      - name: certified_writeoff
        when: "GET /reporting-periods/{id}/accountability with variant=CERTIFIED, or the materialization at POST /reporting-periods/{id}/submit when the period variant flag is CERTIFIED"
        difference: "Counts only certified_lost_doses from closed adjudications, so a period containing one open adjudication reports strictly fewer accounted doses than the interim variant."

  - name: governing_beyond_use_date
    trigger: "POST /cartons/{id}/thaw, POST /cartons/{id}/puncture, POST /dispatches/{id}/deliver with route THAW_AT_HUB, and every cached current_expires_at recomputation"
    algorithm: threshold
    formula: |
      Step 1 — permitted hours from the product, resolved at the instant the carton first
      leaves ultra-cold:
        permitted = min(thaw_stability_hours, refrigerated_shelf_life_hours)
      A THAW_AT_HUB staging hop TRUNCATES the permitted hours at MAX_STAGED_CARTON_HOURS:
        permitted = min(permitted, MAX_STAGED_CARTON_HOURS)

      Step 2 — the carton's own limit:
        carton_limit = thawed_at + permitted hours

      Step 3 — recoverable hours certified by adjudication. Only an adjudication whose outcome
      is USABLE restores budget, and the restored amount is capped:
        recovered = sum over ExcursionAdjudication rows of this carton with outcome USABLE of
                    min(min_duration_minutes_of_its_excursion / 60, MAX_RECOVERY_HOURS)
      An adjudication with outcome NOT_USABLE restores nothing. An excursion whose breach sits
      inside the product's excursion_tolerance_min_c band restores nothing either, because its
      excursion never consumes the refrigerated budget.

      Step 4 — cascade the limit down from carton to vial to dose and take the governing
      minimum. Each level carries its own ceiling, and the strictest one governs:
        vial_limit = carton_limit + recovered
        dose_limit = carton_limit + recovered
        refrigerated_b  = (carton.temperature_state != ULTRA_COLD) ? thawed_at + refrigerated_shelf_life_hours : null
        puncture_limit  = puncture_at ? puncture_at + punctured_bud_hours : null
        current_expires_at = min(batch.expiry_date, carton_limit, vial_limit, dose_limit,
                                 refrigerated_b if not null, puncture_limit if not null)
      Escalation is level-aware: a limit that binds only at the dose level leaves the carton
      and vial levels unchanged, so an excursion that certifies dose-level loss does not
      shorten the carton's own date.
    input_set: "The carton's own DoseLedgerEntry rows, its TemperatureExcursion rows, its ExcursionAdjudication rows, and the ProductConfiguration of its AllocationBatch. Cartons with temperature_state ULTRA_COLD contribute only their frozen_only_hours; cartons in DESTROYED are excluded."
    constants:
      MAX_STAGED_CARTON_HOURS: 48
      MAX_RECOVERY_HOURS: 48
    precision: "whole hours; the recovered hours are floored to whole hours"
    variants:
      - name: wall_clock
        when: "current_expires_at is recomputed with no certified adjudication on the carton"
        difference: "recovered is 0, so current_expires_at is thawed_at plus the permitted hours exactly."
      - name: effective
        when: "current_expires_at is recomputed after an adjudication with outcome USABLE"
        difference: "recovered is added to the vial and dose limits, so the effective variant yields a LATER current_expires_at than the wall-clock variant for the same carton."

  - name: jurisdiction_allocation_waterfall
    trigger: "POST /allocation-windows/{id}/open"
    algorithm: waterfall_allocation
    formula: |
      Step 1 — rate selection per program:
        if allocation_basis == POPULATION_SHARE:
            rate_cartons = (population_weight * TOTAL_WEEKLY_CARTONS) / SUM_OF_WEIGHTS
            where SUM_OF_WEIGHTS is the total population_weight over all programs with
            allocation_basis POPULATION_SHARE in the same jurisdiction group.
        else:
            rate_cartons = fixed_weekly_cartons

      Step 2 — segment split. Order the group's programs by tier ASC, then by
      jurisdiction_code ASC, then by created_at ASC. Never by identity.
        segment_size = max(1, ceil(n * SEGMENT_SHARE))
        segment 0 is the first segment_size programs in that order; segment 1 is the rest.

      Step 3 — hold-back with the pre-break rounding trap:
        reservable = floor(rate_cartons * reservable_carton_pct) when
                     (rate_cartons * reservable_carton_pct) is an exact integer,
                     else ceil(rate_cartons * reservable_carton_pct)
      In plain words: an exact integer product is rounded DOWN to itself; any non-integer
      product is rounded UP. So 0.5 * 5 = 2.5 → 3, but 0.5 * 4 = 2.0 → 2.

      Step 4 — segment-0 apportionment: for every program in segment 0
        computed_cartons = rate_cartons - reservable
      Segment 0 is capped by the released carton count; the remainder carries into
      segment 1 in the same order.

      Step 5 — segment-1 apportionment, governed by the program's segment_rule:
        if segment_rule == TIE_CONTINUE: an apportionment that lands on an exact half
            carton is rounded UP to the next whole carton and the program's credit balance
            is charged 1 carton for the excess.
        if segment_rule == STOP: an apportionment that lands on an exact half carton is
            rounded DOWN to the previous whole carton and the truncated half carton is
            moved to the NEXT program in the segment order; if there is no next program,
            the half carton is returned to the released pool.

      Step 6 — hard cap:
        computed_cartons = min(computed_cartons, weekly_allocation_cap_cartons)

      Step 7 — credit reconciliation:
        credit_used = min(credit_balance_cartons, computed_cartons)
        credit_balance_cartons -= credit_used
        credit_balance_cartons is never negative; the floor is 0.

      Per-program allocation is capped by the released pool; no rounding credit carries to
      another program inside the same pass.
    input_set: "Every JurisdictionProgram whose standing_status != FROZEN and whose program group matches the window's group. Programs with standing_status FROZEN receive computed_cartons 0 and their rate is redivided across the remaining programs using the same segment order."
    constants:
      TOTAL_WEEKLY_CARTONS: 500
      HALF_CARTON_TOLERANCE: 0.0
    precision: "whole cartons; the hold-back is integer-valued by construction and the only fractional quantity is rate_cartons before step 3"
    variants:
      - name: proportional
        when: "allocation_basis POPULATION_SHARE"
        difference: "rate_cartons is the population-share rate; a FROZEN program's share is redivided proportionally across the surviving programs."
      - name: fixed_quota
        when: "allocation_basis FIXED_QUANTITY"
        difference: "rate_cartons is the program's fixed weekly cartons regardless of population weight, so two programs with identical weights can receive wildly different computed_cartons."

  - name: storage_capacity_interval
    trigger: "POST /dispatches/{id}/deliver, POST /site-transfers/{id}/approve, and every SiteTransfer.cumulative_conflict_minutes computation"
    algorithm: interval_merge
    formula: |
      Inputs are two reservations on the same (storage_site_id, entry_type) pair:
        incoming = [in_start, in_end) with reserved_capacity_cartons = in_qty
        incumbent = [out_start, out_end) with reserved_capacity_cartons = out_qty
        site_capacity = storage_site.ultra_cold_capacity_cartons when entry_type is
                        ULTRA_COLD, else storage_site.refrigerated_capacity_cartons

      Overlap length under the half-open rule:
        overlap_minutes = max(0, (min(in_end, out_end) - max(in_start, out_start)) in whole minutes)
        Two intervals that merely touch (in_end == out_start) have zero overlap and DO NOT conflict.
        Two intervals that share a single instant are treated as touching, not overlapping.

      Admission decision:
        if overlap_minutes > 0 and in_qty + out_qty > site_capacity:
            reject with ERR_STORAGE_RESERVATION_CONFLICT
        the reservation endpoint takes resolve_method explicitly:
          RESERVATION_BOUNDARY (the default) keeps each reservation inside the capacity of the
              interval it was declared with, so a pooled quantity above the site's capacity is
              refused with ERR_STORAGE_RESERVATION_CONFLICT.
          CAPACITY_POOLED routes the overlapping cartons into pooled capacity that includes the
              staging site, so the same interval pair is admitted and the overlap is recorded on
              resolved_conflict_minutes instead of being rejected — provided the pooled quantity
              still fits, otherwise ERR_SITE_CAPACITY_INSUFFICIENT.

      Aggregate: for the destination site and entry type, the reservations in force at the
      incoming start instant are summed with the overlapping portion prorated:
        aggregate_at_start = sum over overlapping incumbents of
                             ceil(in_qty * incumbent_overlap_minutes / total_incoming_minutes)
        aggregate_at_start <= site_capacity must hold, else ERR_SITE_CAPACITY_INSUFFICIENT.
    input_set: "CartonStorageReservation rows with status IN {HELD, CONFIRMED} on the same (storage_site_id, entry_type) pair. Rows with status RELEASED or LAPSED are excluded. Rows whose interval is entirely before the incoming start are excluded. Tie-break when two incumbents have identical overlap length: end_at ASC, then created_at ASC."
    constants:
      HUB_POOL_HOURS: 24
    precision: "whole minutes; capacity in whole cartons; ceil for the prorated aggregate"
    variants:
      - name: half_open
        when: "resolve_method RESERVATION_BOUNDARY, the default"
        difference: "Touching intervals are free; only strictly interior overlap above the site's own capacity triggers ERR_STORAGE_RESERVATION_CONFLICT."
      - name: capacity_pooled
        when: "resolve_method CAPACITY_POOLED against a destination with a staging pool"
        difference: "The same interval pair is admitted rather than rejected, the overlap minutes are recorded on resolved_conflict_minutes, and the moved cartons occupy pooled rather than exclusive capacity."

  - name: cold_chain_shipper_hairpin
    trigger: "POST /shippers/{id}/attach-carton, POST /shippers/{id}/seal"
    algorithm: weighted_scoring
    formula: |
      Step 1 — pick the reference product for the shipper's dispatch:
        reference = the ProductConfiguration with the greatest number of cartons attached
        to the shipper. Break ties by product_code ASC. Never by identity.

      Step 2 — per-carton ice slot weight:
        slot_weight = vials_per_carton / REF_SLOTS  where REF_SLOTS = reference.vials_per_carton

      Step 3 — decay factor as a piecewise function of the absolute temperature gap:
        d = abs(carton_store_temperature_c - reference.ultra_cold_min_c)
        decay(T) = 0.70 when d < 10
                   0.80 when 10 <= d < 20
                   0.90 when 20 <= d < 30
                   1.00 when d >= 30
      This is a two-sided sqrt-shaped hairpin: the same decay applies at d = -25 and d = +25.

      Step 4 — shipper aggregate:
        tapered_doses   = sum over attached cartons of (carton.doses_per_carton * slot_weight)
        adjustment      = max(tapered_doses + 0.25 * (n - 1), 0)
        reference_doses = tapered_doses * (Math.Sqrt(adjustment) / Math.Max(n, 1))
        punctured_ice_slots = round_half_up(reference_doses, 4)

      Step 5 — dry ice requirement:
        required_dry_ice_kg = ceil((carton_count * reference.refrigerated_shelf_life_hours)
                                   / (REF_ICE_SLOT_BASE_DOSES * ICE_SLOT_HOURS_DIVISOR))
        dry_ice_deficit_kg  = round_half_up(max(0, required_dry_ice_kg - dry_ice_kg), 2)
      The multiplication is evaluated before the division and the divisor is multiplied out
      first: (carton_count * shelf_life_hours) / (REF_ICE_SLOT_BASE_DOSES * ICE_SLOT_HOURS_DIVISOR).
    input_set: "Cartons attached to the shipper whose temperature_state is not DESTROYED. Cartons arriving from a THAW_AT_HUB staging hop contribute at half weight; all other cartons contribute at full weight."
    constants:
      REF_SLOTS: 780
      REF_ICE_SLOT_BASE_DOSES: 400
      ICE_SLOT_HOURS_DIVISOR: 2
      MULT_PER_REMAINING_SLOT: 0.5
      BASE_HOURS: 10
    precision: "punctured_ice_slots 4 decimal places round_half_up; required_dry_ice_kg integer; dry_ice_deficit_kg 2 decimal places"
    variants:
      - name: frozen_intake
        when: "every attached carton's temperature_state is ULTRA_COLD"
        difference: "Every carton contributes at full weight, so tapered_doses equals the plain sum of doses_per_carton."
      - name: mixed_intake
        when: "at least one attached carton arrived from a THAW_AT_HUB staging hop"
        difference: "Staged cartons contribute at half weight, so tapered_doses is strictly smaller and the required dry ice is computed from a smaller reference dose base."

  - name: excursion_dose_adjudication
    trigger: "POST /temperature-excursions/{id}/adjudicate"
    algorithm: constraint_propagation
    formula: |
      Step 1 — magnitude reads from the excursion's own cached fields:
        breach_minutes   = temperature_excursion.min_duration_minutes
        min_temp_c       = temperature_excursion.min_temperature_c
        remaining_hours  = temperature_excursion.dosing_hours_remaining_at_breach

      Step 2 — breach classification:
        if breach_minutes <= product.excursion_max_single_breach_minutes
           and breach_minutes <= product.excursion_max_cumulative_minutes
           and min_temp_c  >= product.excursion_tolerance_min_c:
              band = IN_BAND
        elif min_temp_c >= product.ultra_cold_max_c:
              band = SEVERE_WARM
        else:
              band = SEVERE_COLD

      Step 3 — outcome:
        band IN_BAND        → USABLE
        band SEVERE_WARM    → USABLE when remaining_hours >= 24, else NOT_USABLE
        band SEVERE_COLD    → NOT_USABLE
      The comparison at 24 hours is inclusive of the boundary: exactly 24 remains USABLE.

      Step 4 — dose impact cascade:
        if band == SEVERE_COLD:      dose_impact_category = DOSE_LEVEL
        elif band == SEVERE_WARM and breach_minutes > product.excursion_max_cumulative_minutes:
                                     dose_impact_category = VIAL_LEVEL
        elif band == SEVERE_WARM:    dose_impact_category = VIAL_LEVEL
        else:                        dose_impact_category = NONE

      Step 5 — certified lost doses under BOTH variants:
        certified_lost_doses = carton.doses_per_carton * cumulative_loss_pct
        interim_lost_doses   = carton.remaining_doses   * cumulative_loss_pct
        cumulative_loss_pct is the sum over the excursion's DosesAffectedSlice rows whose
        status is CERTIFIED of that slice's cap:
           time_slice_c <= -60          → 0.10
           -60 < time_slice_c <= -40    → 0.20
           -40 < time_slice_c <= -20    → 0.35
           -20 < time_slice_c <=   0    → 0.50
           time_slice_c > 0             → 0.75

      Step 6 — transitive freeze propagation over the site-sharing community graph:
        frozen_doses = sum over every site S reachable from the excursion's site in the
        MEMBER_OF graph, including the excursion's own site, of S.usable_doses
        Reachability is transitive closure over CartonFamily membership; cycles in the
        graph must not cause the traversal to repeat a site.
    input_set: "The excursion's own cached fields, its CERTIFIED DosesAffectedSlice rows, its carton's remaining doses, and the CartonFamily membership graph. Slice rows with status PENDING are excluded from cumulative_loss_pct."
    constants:
      MIN_REMAINING_HOURS: 24
      SLICE_CAPS:
        "-60": 0.10
        "-40": 0.20
        "-20": 0.35
        "0": 0.50
        "ABOVE_0": 0.75
    precision: "certified and interim doses integer, round_half_up; cumulative_loss_pct 4 decimal places"
    variants:
      - name: writeoff_certified
        when: "the adjudication is written against the full carton"
        difference: "Certified loss is charged against doses_per_carton, so the same excursion whose carton has already been partly administered reports a larger loss."
      - name: interim_remaining
        when: "the interim dose loss is quoted before the adjudication closes"
        difference: "Loss is charged against the carton's remaining_doses, so it can be strictly smaller than the certified loss for an identical excursion."

  - name: site_standing_escalation
    trigger: "POST /reporting-periods/{id}/submit, POST /allocation-windows/{id}/close, POST /program-standings/assess"
    algorithm: weighted_scoring
    formula: |
      Step 1 — counts and rates:
        lapsed_window_count    = ShippingWindowLapse rows with lapsed_at strictly before as_of
        lapsed_entitlement_count = distinct allocation_entitlement_id among those rows
        lapsed_period_count    = ReportingPeriod rows whose period_end <= as_of and status != SUBMITTED
        lapsed_carton_rate     = lapsed_carton_count / released_cartons_to_date
                                 (0 when released_cartons_to_date == 0; 4 dp round_half_up)

      Step 2 — score and tier:
        score = lapsed_period_count * 5 + min(10, lapsed_window_count) + 2 * lapsed_entitlement_count
        if score <= 20:
            risk_tier = 0
        elif lapsed_period_count >= 3 or lapsed_carton_rate >= 0.25:
            risk_tier = 2
        else:
            risk_tier = 1
      Boundary: a score of exactly 20 is tier 0 and a score of 21 is tier 1, and a
      lapsed_carton_rate of exactly 0.25 is tier 2 — the comparisons are inclusive at the
      top of each tier.

      Step 3 — propagation mode:
        propagation_mode IMMEDIATE      → standing_status recomputed for every program whose
                                          risk_tier changed, plus every program sharing a
                                          CartonFamily membership link with it.
        propagation_mode AFTER_CYCLE    → only the reporting program's standing_status changes;
                                          linked programs are queued and updated at the next
                                          POST /_ops/run-cycle.

      Step 4 — the derived gate, used by the program-stability machine and by the stores:
        risk_tier 0 → OPEN
        risk_tier 1 → RESTRICTED
        risk_tier 2 → FROZEN
      RESTRICTED blocks new SiteOrder submission but allows existing orders to be accepted,
      dispatched and delivered. FROZEN blocks SiteOrder submission and the opening of
      AllocationWindows whose program would receive a computed entitlement.
    input_set: "ReportingPeriod, ShippingWindowLapse, EntitlementRelease and AllocationEntitlement rows for the program. Rows created after as_of are excluded. Unsubmitted programs (no ReportingPeriod at all) count as 0 lapsed periods, not as one."
    constants:
      PERIOD_WEIGHT: 5
      WINDOW_WEIGHT: 1
      ENTITLEMENT_WEIGHT: 2
      TIER1_RATE: 0.10
      TIER2_RATE: 0.25
      TIER1_SCORE: 21
    precision: "integer score and tier; rate 4 decimal places round_half_up"
    variants:
      - name: immediate
        when: "propagation_mode IMMEDIATE"
        difference: "Linked programs sharing a CartonFamily membership update in the same request's response."
      - name: after_cycle
        when: "propagation_mode AFTER_CYCLE"
        difference: "Linked programs report their prior standing_status until the next ops-run cycle; the reporting program alone reflects the new tier immediately."

  - name: cure_time_after_excursion
    trigger: "POST /temperature-excursions/{id}/adjudicate, POST /cartons/{id}/advance-logical-state"
    algorithm: decay_function
    formula: |
      Step 1 — certified effective hours per resolved excursion:
        adjusted_hours = (breach interval length in minutes) / 60 when the adjudication
        outcome is USABLE and min_duration_minutes <= product.excursion_max_single_breach_minutes;
        otherwise adjusted_hours = 0.

      Step 2 — phased cure surfaced on GET /temperature-excursions/{id}/readiness:
        phase 1: adjusted_hours_part = min(max(floor(carrier_hours_hours), 0), 48)
                 override_hours_part  = 0 when the cabin load is unchanged, else
                                        min(abs(prev_load_kg - new_load_kg), 24)
                 ready    = adjusted_hours_part + override_hours_part
        phase 2: if adjusted_hours_part + override_hours_part > 48:
                     ready = 48 + (adjusted_hours_part + override_hours_part - 48) * 0.5
                 else:
                     ready = adjusted_hours_part + override_hours_part
      The phase switch is at a ready value of exactly 48, and at exactly 48 phase 1 applies.

      Step 3 — thaw budget restored:
        restored_hours = min(adjusted_hours, max(0, ready - ready_at_first_phase))
        carton.thaw_window_expires_at += restored_hours
      ready_at_first_phase is the readiness value recorded when the excursion was reported.
    input_set: "Adjudicated TemperatureExcursion rows on the carton, in adjudicated_at ASC order; the CartonFamily load history of the destination site. Excursions with adjudication_status PENDING are excluded, so an unadjudicated excursion contributes 0 restored hours."
    constants:
      PHASE_ONE_CAP: 48
      PHASE_TWO_MULTIPLIER: 0.5
      OVERRIDE_CAP: 24
      MIN_CURE_HOURS: 3
    precision: "whole hours; floor for each phase component"
    variants:
      - name: single_phase
        when: "adjusted_hours_part + override_hours_part <= 48"
        difference: "Ready hours are the plain sum, so restoring the thaw budget is linear in the breach length."
      - name: logarithmic
        when: "adjusted_hours_part + override_hours_part > 48"
        difference: "Everything above 48 contributes at half weight, so restoring the thaw budget is superlinear in the breach length once the cap is crossed."

  - name: consistent_bud_hours
    trigger: "GET /temperature-excursions/{id}/audit (consistent-variant ordering) and the wall-clock ordering on the same read"
    algorithm: chronological
    formula: |
      Both orderings walk the same variable-condition facts and must produce different totals.

      Wall-clock ordering — sort the facts by occurred_at ASC, then by created_at ASC:
        hours = sum of fact.hours_elapsed for every fact still open at the read instant,
        where a fact is open when fact.opened_at + fact.hours_elapsed > now.
        Excursion windows are EXCLUDED: an excursion window overlapping a capacity hold
        does not add hours.

      Consistent ordering — same facts, but the excursion windows are INCLUDED whenever
        the excursion's adjudication_status is USABLE and the excursion's
        min_duration_minutes exceeds fact.capacity_hold_minutes, and a fact that the
        wall-clock pass counted is additionally counted again when its name is a strict
        superset of an earlier fact's name on the same level.

      deficits at depth L:
        deficits(L) = sum over facts at depth L of hours, counting only facts whose name
        shares a non-empty common token prefix with the level's root fact name.

      total:
        total_consistent = sum of deficits(L) for L in 0..max_depth
        total_wallclock  = the same sum computed under the wall-clock ordering
      The two totals differ whenever an excursion window exists with a USABLE adjudication.
    input_set: "Variable-condition facts attached to the carton, facts at depth L with L <= max_depth, and the excursion windows overlapping the carton. Facts with hours_elapsed == 0 are excluded from both orderings. Tie-break inside a level: opened_at ASC, then created_at ASC."
    constants:
      EXCLUDE_EXCURSION_WINDOWS_WALLCLOCK: true
      CAPACITY_HOLD_ROUNDING: "ceil"
    precision: "whole hours; ceil for capacity-hold rounding"
    variants:
      - name: wallclock
        when: "GET /temperature-excursions/{id}/audit with ordering=WALLCLOCK"
        difference: "Excursion windows are excluded from the sum, so a carton with a certified USABLE excursion reports strictly fewer hours."
      - name: consistent
        when: "GET /temperature-excursions/{id}/audit with ordering=CONSISTENT"
        difference: "Certified USABLE excursion windows are added into their depth's deficit, so the same fact set reports a strictly larger total."

  - name: carton_min_order_shortfall
    trigger: "POST /site-transfers/{id}/approve and POST /dispatches/{id}/pack (shortfall taken on the batch product)"
    algorithm: max_over
    formula: |
      shortfall = max(0, product_configuration.min_order_cartons
                         - cold_chain_shipper_payload.carton_count)
      The minimum is the BATCH PRODUCT's, never the program's: a transfer that satisfies the
      program minimum can still be short against the manufacturer's carton pack size, and the
      shortfall is charged on the shipper payload rather than on the site order.
    input_set: "Carton rows attached to the shipper whose temperature_state is not DESTROYED. Cartons attached to a different shipper are excluded even when they belong to the same site order."
    constants:
      MIN_ORDER_BASIS: product_configuration.min_order_cartons
    precision: "integer cartons"
    variants:
      - name: product_minimum
        when: "a dispatch pack is being assembled for a single product presentation"
        difference: "The base behaviour: the shortfall equals the manufacturer pack size minus the payload."
      - name: program_minimum_dominates
        when: "the program's min_order_cartons is strictly greater than the product's"
        difference: "The chargeable shortfall stays keyed to the product pack size, so the difference against the program minimum is reported separately on allocation_entitlement rather than being folded into the dispatch shortfall."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well formed; X-User-ID must be a server-minted id when the role is entity_backed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The acting role holds the operation in its exclusive_operations or shared_operations list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Every path-segment resource exists, validated left to right; the first missing resource in path order decides the error"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-templated endpoints"

  - priority: 4
    category: existence
    check: "Every referenced foreign key in the request body exists; body keys are validated in the order the endpoint's input list declares them"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with body foreign keys"

  - priority: 5
    category: state
    check: "The parent entity being mutated is in a state that admits the operation (site_order.order_status, allocation_entitlement.acceptance_status, carton.temperature_state, cold_chain_shipper.packing_status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "The entity is not already in a terminal state for this machine (REJECTED, FULFILLED, DESTROYED, RECONCILED, SUBMITTED, LAPSED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints on terminal entities"

  - priority: 7
    category: business_safety
    check: "Product temperature band: the pack must keep the carton inside the product's ultra-cold band, or the destination must be able to hold the carton's reported entry type without a refreeze"
    error_id: ERR_REFREEZE_FORBIDDEN
    http_status: 422
    applies_to: "POST /cartons/{id}/refreeze, POST /dispatches/{id}/deliver, POST /site-transfers/{id}/receive"

  - priority: 8
    category: business_safety
    check: "Excursion adjudication: adjudicator identity, closed dose-affected slices, and reference validity at the adjudication instant"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /temperature-excursions/{id}/adjudicate"

  - priority: 9
    category: business_safety
    check: "Segregation of duties on the review and adjudication pair: the user who moved an excursion to UNDER_REVIEW cannot adjudicate it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /temperature-excursions/{id}/adjudicate, POST /temperature-excursions/{id}/appeals/{appealId}/deny"

  - priority: 10
    category: business_safety
    check: "Site equipment certification: a destination must hold a RECORDED, unexpired SiteEquipmentVerification with outcome PASSED covering the entry type being required"
    error_id: ERR_SITE_EQUIPMENT_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /site-orders/{id}/submit, POST /dispatches/{id}/pack, POST /site-transfers/{id}/approve"

  - priority: 11
    category: business_safety
    check: "Destination capability admits the carton's required entry type (ULTRA_COLD requires ULTRA_COLD capability; a THAWED carton never requires ultra-cold)"
    error_id: ERR_DEST_CAPABILITY_MISMATCH
    http_status: 422
    applies_to: "POST /carton-storage-reservations, POST /site-transfers/{id}/approve, POST /site-transfers/{id}/receive"

  - priority: 12
    category: business_constraint
    check: "Storage capacity interval: the incoming reservation overlaps an incumbent reservation on the same (site, entry_type) pair and the pooled quantity exceeds the site's capacity for that entry type"
    error_id: ERR_STORAGE_RESERVATION_CONFLICT
    http_status: 409
    applies_to: "POST /carton-storage-reservations, POST /site-transfers/{id}/dispatch, POST /dispatches/{id}/deliver"

  - priority: 13
    category: business_constraint
    check: "Site capacity ceiling: the accepted or delivered carton quantity, added to the cartons already committed to that site for the same delivery window, exceeds the destination's capacity for the required entry type"
    error_id: ERR_SITE_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /site-orders/{id}/accept, POST /dispatches/{id}/deliver, POST /carton-storage-reservations"

  - priority: 14
    category: business_constraint
    check: "The accepted carton quantity meets the governing minimum order quantity, taken as the maximum of the program minimum and the product pack-size minimum"
    error_id: ERR_BELOW_MIN_ORDER
    http_status: 422
    applies_to: "POST /site-orders/{id}/accept, POST /allocation-batches/{id}/release, POST /site-transfers/{id}/approve"

  - priority: 15
    category: business_constraint
    check: "Governing beyond-use date: the carton is not at or past its current_expires_at and not at or past its thaw window expiry"
    error_id: ERR_CARTON_EXPIRED
    http_status: 422
    applies_to: "POST /cartons/{id}/thaw, POST /cartons/{id}/puncture, POST /site-transfers/{id}/approve, POST /site-transfers/{id}/dispatch, POST /dispatches/{id}/pack"

  - priority: 16
    category: business_constraint
    check: "Thawed carton ledger: every transfer, dispense and administration quantity must be covered by the carton's remaining_doses"
    error_id: ERR_DOSE_ACCOUNTABILITY_MISMATCH
    http_status: 422
    applies_to: "POST /dose-ledger-entries, POST /site-transfers/{id}/receive, POST /wastage-reports/{id}/reconcile"

  - priority: 17
    category: business_temporal
    check: "Shipper packing hold: missing logger, insufficient dry ice, packing over the 48-hour limit, or a logger reading absent/late for the shipped interval"
    error_id: ERR_SHIPPER_HOLD
    http_status: 409
    applies_to: "POST /shippers/{id}/seal, POST /shippers/{id}/release, POST /site-orders/{id}/fulfillment"

  - priority: 18
    category: business_temporal
    check: "Order acceptance window: the parent AllocationWindow must be OPEN and the logical clock strictly inside [opens_at, closes_at)"
    error_id: ERR_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /site-orders/{id}/submit, POST /site-orders/{id}/accept, POST /allocation-windows/{id}/close"

  - priority: 19
    category: business_temporal
    check: "Dispatch timing: the logical clock sits inside a declared shipping day/cutoff pair of the program's shipping schedule and before the window's closes_at"
    error_id: ERR_OUTSIDE_SHIPPING_SCHEDULE
    http_status: 422
    applies_to: "POST /dispatches/{id}/dispatch, POST /allocation-windows/{id}/open"

  - priority: 20
    category: business_temporal
    check: "Excursion review SLA: the review must start no later than reported_at plus the program's adjudication_sla_hours"
    error_id: ERR_ADJUDICATION_SLA_EXCEEDED
    http_status: 422
    applies_to: "POST /temperature-excursions/{id}/review, POST /temperature-excursions/{id}/adjudicate"

  - priority: 21
    category: business_temporal
    check: "Transfer reservation liveness: the transfer's reservation interval must not already have elapsed at the acting instant"
    error_id: ERR_TRANSFER_RESERVATION_ACTIVE
    http_status: 409
    applies_to: "POST /site-transfers/{id}/receive, POST /site-transfers/{id}/reject"

  - priority: 22
    category: business_fiscal
    check: "Entitlement availability: the requested or accepted carton quantity must not exceed the entitlement's available_cartons, nor the program's weekly_allocation_cap_cartons"
    error_id: ERR_ENTITLEMENT_EXHAUSTED
    http_status: 422
    applies_to: "POST /site-orders/{id}/submit, POST /site-orders/{id}/accept, POST /site-orders/{id}/reject"

  - priority: 23
    category: business_fiscal
    check: "Payment hold: an order whose payment_status is DISPUTED cannot be dispatched or delivered"
    error_id: ERR_PAYMENT_HOLD
    http_status: 402
    applies_to: "POST /dispatches/{id}/dispatch, POST /dispatches/{id}/deliver"

  - priority: 24
    category: business_referential
    check: "Program standing gate: the ordering program's standing_status must be OPEN for a new SiteOrder submission, and no program in the window may be FROZEN when a window opens"
    error_id: ERR_PROGRAM_NOT_OPEN
    http_status: 422
    applies_to: "POST /site-orders/{id}/submit, POST /allocation-windows/{id}/open"

  - priority: 25
    category: business_referential
    check: "Site standing gate: the acting site's inventory_status must not be FROZEN or RESTRICTED for thawing, transferring out or dispensing"
    error_id: ERR_SITE_RESTRICTED
    http_status: 422
    applies_to: "POST /cartons/{id}/thaw, POST /site-transfers/{id}/approve, POST /dose-ledger-entries, POST /shippers/{id}/release"

  - priority: 26
    category: business_referential
    check: "Unadjudicated excursion present: a carton with a TemperatureExcursion in REPORTED or UNDER_REVIEW cannot change custody, be destroyed or be packed"
    error_id: ERR_PENDING_EXCURSION
    http_status: 422
    applies_to: "POST /site-transfers/{id}/receive, POST /shippers/{id}/release, POST /cartons/{id}/destroy"

  - priority: 27
    category: business_referential
    check: "No dose-affected slice remains open at the adjudicated temperature boundary, and every cited disposition-evidence reference is valid at the adjudication instant"
    error_id: ERR_SLICE_NOT_CLOSED
    http_status: 422
    applies_to: "POST /temperature-excursions/{id}/adjudicate"

  - priority: 28
    category: business_constraint
    check: "Rejection reason code must be one of the declared enum members for the endpoint's current state"
    error_id: ERR_REJECTION_REASON_INVALID
    http_status: 400
    applies_to: "POST /site-orders/{id}/reject, POST /shippers/{id}/hold"

  - priority: 29
    category: business_constraint
    check: "Wastage reconciliation variance must not exceed the product's wastage_threshold_pct of the carton's doses"
    error_id: ERR_WASTAGE_THRESHOLD_EXCEEDED
    http_status: 422
    applies_to: "POST /wastage-reports/{id}/reconcile"

  - priority: 30
    category: business_constraint
    check: "Reversal integrity: a REVERSE entry must name a non-reversed entry on the same carton and leave no residual drift in released doses while the carton has no unreversed EXPIRE or DESTROY entry"
    error_id: ERR_REVERSAL_DRIFT_DETECTED
    http_status: 409
    applies_to: "POST /dose-ledger-entries, POST /site-orders/{id}/fulfillment/reverse"

  - priority: 31
    category: auth
    check: "Optimistic concurrency: the supplied expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /site-orders/{id}/accept, POST /shippers/{id}/seal, POST /allocation-windows/{id}/open"

  - priority: 32
    category: business_constraint
    check: "Type, enum membership and numeric range validation for every declared input field"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- ProductConfiguration ---
  - method: POST
    path: "/vaccine-distribution/product-configurations"
    description: "Register a released product presentation with its pack sizes and cold-chain limits"
    roles: [ManufacturingQA]
    code: 201
    input: [product_code, presentation, doses_per_vial, "vials_per_carton?", min_order_cartons, "ultra_cold_min_c?", "ultra_cold_max_c?", "refrigerated_min_c?", "refrigerated_max_c?", "thaw_stability_hours?", "refrigerated_shelf_life_hours?", "excursion_tolerance_min_c?", "excursion_max_single_breach_minutes?", "excursion_max_cumulative_minutes?", "refreeze_prohibited?", "punctured_bud_hours?", "wastage_threshold_pct?"]
    output: ProductConfiguration
    side_effects: ["doses_per_carton computed from doses_per_vial and vials_per_carton"]
  - method: GET
    path: "/vaccine-distribution/product-configurations"
    description: "List product configurations"
    roles: [ManufacturingQA, RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer, MedicalScienceLiaison]
    code: 200
    input: ["product_code?", "limit?", "offset?"]
    output: "ProductConfiguration[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/product-configurations/{id}"
    description: "Get one product configuration"
    roles: [ManufacturingQA, RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer, MedicalScienceLiaison]
    code: 200
    input: []
    output: ProductConfiguration
    side_effects: []

  # --- JurisdictionProgram ---
  - method: POST
    path: "/vaccine-distribution/jurisdiction-programs"
    description: "Create a jurisdiction program with its allocation basis, acceptance window and shipping schedule"
    roles: [RegulatoryAffairsOfficer]
    code: 201
    input: [jurisdiction_code, regulatory_body, allocation_basis, "population_weight?", "fixed_weekly_cartons?", weekly_allocation_cap_cartons, "min_order_cartons?", "reservable_carton_pct?", acceptance_window_hours, shipping_days, shipping_cutoff_utc, quarantine_on_review, adjudication_sla_hours, segment_rule, reporting_period_days]
    output: JurisdictionProgram
    side_effects: ["standing_status initialized to OPEN"]
  - method: GET
    path: "/vaccine-distribution/jurisdiction-programs"
    description: "List jurisdiction programs"
    roles: [ManufacturingQA, RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer, MedicalScienceLiaison]
    code: 200
    input: ["jurisdiction_code?", "limit?", "offset?"]
    output: "JurisdictionProgram[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/jurisdiction-programs/{id}"
    description: "Get one jurisdiction program"
    roles: [ManufacturingQA, RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer, MedicalScienceLiaison]
    code: 200
    input: []
    output: JurisdictionProgram
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/jurisdiction-programs/{id}/standing/assess"
    description: "Assess the program's standing at an instant and record a ProgramStanding row"
    roles: [RegulatoryAffairsOfficer, ColdChainReviewer]
    code: 201
    input: [as_of, propagation_mode]
    output: ProgramStanding
    side_effects:
      - "jurisdiction_program.standing_status recomputed from the computed risk tier"
      - "under propagation_mode IMMEDIATE, every program sharing a CartonFamily membership link has its standing_status recomputed in the same request"
      - "increments jurisdiction_program.version by 1"

  # --- AllocationBatch ---
  - method: POST
    path: "/vaccine-distribution/allocation-batches"
    description: "Record a manufacturing batch release"
    roles: [ManufacturingQA]
    code: 201
    input: [batch_code, product_configuration_id, jurisdiction_program_id, released_cartons, release_date, expiry_date]
    output: AllocationBatch
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/vaccine-distribution/allocation-batches"
    description: "List allocation batches"
    roles: [ManufacturingQA, RegulatoryAffairsOfficer, DistributionPlanner, ColdChainReviewer]
    code: 200
    input: ["product_configuration_id?", "jurisdiction_program_id?", "status?", "limit?", "offset?"]
    output: "AllocationBatch[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/allocation-batches/{id}"
    description: "Get one allocation batch"
    roles: [ManufacturingQA, RegulatoryAffairsOfficer, DistributionPlanner, ColdChainReviewer]
    code: 200
    input: []
    output: AllocationBatch
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/allocation-batches/{id}/cartons"
    description: "Register the physical cartons produced for a released batch"
    roles: [ManufacturingQA, LogisticsOperator]
    code: 201
    input: [carton_serial, vials_per_carton]
    output: Carton
    side_effects:
      - "temperature_state = ULTRA_COLD with thawed_at, thaw_window_expires_at and current_expires_at all null"
      - "doses_per_carton computed from the batch product; remaining_doses and administrative_remaining_doses initialized to doses_per_carton"
      - "increments allocation_batch.version by 1"
  - method: POST
    path: "/vaccine-distribution/allocation-batches/{id}/release"
    description: "Release a manufacturing batch for allocation"
    roles: [ManufacturingQA]
    code: 200
    input: []
    output: AllocationBatch
    side_effects: ["status = RELEASED", "allocated_cartons recomputed", "unallocated_cartons recomputed", "increments allocation_batch.version by 1"]
  - method: POST
    path: "/vaccine-distribution/allocation-batches/{id}/recall"
    description: "Recall a batch and destroy every carton on it"
    roles: [RegulatoryAffairsOfficer]
    code: 200
    input: ["reason?"]
    output: AllocationBatch
    side_effects:
      - "status = RECALLED"
      - "every Carton of the batch with temperature_state != DESTROYED → DESTROYED with a DESTROY ledger entry"
      - "every AllocationEntitlement of the batch with available_cartons > 0 → LAPSED with held_cartons reset to 0"
      - "increments allocation_batch.version by 1"

  # --- AllocationWindow ---
  - method: POST
    path: "/vaccine-distribution/allocation-windows"
    description: "Announce an order acceptance window for a batch in a jurisdiction"
    roles: [DistributionPlanner]
    code: 201
    input: [allocation_batch_id, jurisdiction_program_id, opens_at, closes_at]
    output: AllocationWindow
    side_effects: ["status = ANNOUNCED"]
  - method: GET
    path: "/vaccine-distribution/allocation-windows"
    description: "List allocation windows"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, ColdChainReviewer]
    code: 200
    input: ["allocation_batch_id?", "jurisdiction_program_id?", "status?", "limit?", "offset?"]
    output: "AllocationWindow[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/allocation-windows/{id}"
    description: "Get one allocation window"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, ColdChainReviewer]
    code: 200
    input: []
    output: AllocationWindow
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/allocation-windows/{id}/open"
    description: "Open the acceptance window and create the jurisdiction entitlement"
    roles: [DistributionPlanner]
    code: 200
    input: [expected_allocation_window_version]
    output: AllocationWindow
    side_effects:
      - "status = OPEN"
      - "one AllocationEntitlement created with computed_cartons from the jurisdiction allocation waterfall"
      - "jurisdiction_program.released_cartons_to_date increments by computed_cartons"
      - "jurisdiction_program.credit_balance_cartons decremented by the credit used, floored at 0"
      - "allocation_batch.allocated_cartons recomputed"
      - "increments allocation_window.version by 1"
  - method: POST
    path: "/vaccine-distribution/allocation-windows/{id}/close"
    description: "Close the acceptance window and lapse any unfilled entitlement"
    roles: [DistributionPlanner, ColdChainReviewer]
    code: 200
    input: []
    output: AllocationWindow
    side_effects:
      - "status = CLOSED"
      - "when available_cartons > 0 a ShippingWindowLapse is created and the entitlement becomes LAPSED"
      - "jurisdiction_program.lapsed_carton_count increments"
      - "jurisdiction_program.standing_status recomputed"
      - "increments allocation_window.version by 1"

