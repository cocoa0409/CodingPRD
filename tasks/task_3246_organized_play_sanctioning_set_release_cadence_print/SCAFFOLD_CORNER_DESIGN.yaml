            - "the tier is still LOCAL after the refused patch"

      - name: product_configuration_derived_units_available_lags_allocations
        claim_type: Side Effect Execution
        grounds:
          - entities.ProductConfiguration.fields.units_available
          - state_machines.AllocationOrder.transitions.PENDING_to_APPROVED
        distinguishing_aspect: "units_available is a derived field reconciled on every allocation mutation: it reads 50 before approval, 40 after an 10-unit approval, and 100 after the print run is increased by 60."
        test_recipe:
          setup:
            - "One store, one set release, one COLLECTOR_BOOSTER configuration with print_run_units 50; one PENDING allocation order of 10 units."
          setup_api_calls:
