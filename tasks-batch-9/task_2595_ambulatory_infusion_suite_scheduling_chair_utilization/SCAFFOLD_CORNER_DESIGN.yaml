            - "Appointment.${ap1}.observation_minutes == 120, chair_minutes == 300, end_minute == 840 and observation_extension_minutes == 60 — the extension is retained through the close"
            - "Appointment.${ap1}.readiness_status == 'FULLY_CLEARED' and schedule_status == 'INFUSING' — RESUME_SAME_DRUG lifted the grade 3 block"
