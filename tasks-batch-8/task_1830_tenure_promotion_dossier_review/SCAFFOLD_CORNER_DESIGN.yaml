  - section: cross_cutting_layers
    instances:
      - name: occ_dossier_item_stale_case_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[dossier-item-create-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on TenureCase.version: after creating item 1 (version 1 -> 2), a second create still carrying expected_case_version 1 is rejected with 412 ERR_STALE_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["case in DOSSIER_ASSEMBLY (version 1)"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand OC", employee_id: "E9600", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_oc: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_oc}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_oc: $.data.id, case_oc_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_oc}", category: "TEACHING", title: "First", page_count: 4, expected_case_version: "${case_oc_v}" }, as: Candidate, as_user_id: "${cand_oc}", captures: { oc_i1: $.data.id } }
          trigger:
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_oc}", category: "TEACHING", title: "Stale second", page_count: 4, expected_case_version: "${case_oc_v}" }, as: Candidate, as_user_id: "${cand_oc}", captures: { err_oc: $.data.error_id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_oc}", category: "TEACHING", title: "Fresh second", page_count: 4, expected_case_version: "${case_oc_v} + 1" }, as: Candidate, as_user_id: "${cand_oc}", captures: { oc_i2: $.data.id } }
          assert:
            - "err_oc == ERR_STALE_VERSION (the first create bumped TenureCase.version past the caller's snapshot)"
            - "oc_i2 created successfully against the fresh version (HTTP 201)"

