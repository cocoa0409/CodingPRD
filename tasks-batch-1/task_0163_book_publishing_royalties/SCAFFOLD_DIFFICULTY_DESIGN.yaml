      - name: zero_net_units_empty_period_yields_zero_reserve
        grounds:
          - calculations.returns_reserve_sizing
          - calculations.tiered_royalty_escalator
          - entities.ReturnsReserve.fields.reserve_units
          - entities.AuthorStatement.fields.reserve_held_cents
        distinguishing_aspect: |
          Empty/zero metric on the finalize endpoint (a different metric and endpoint than the tier threshold):
          a period whose only record is units_sold=0,units_returned=0 has net_units=0, so gross_royalty_cents=0,
          reserve_held_cents=0, reserve_units=0, and the created reserve has reserve_unit_value_cents=0 (no div-by-zero).
        test_recipe:
          setup:
            - "ACTIVE contract C reserve_pct=0.25, HARDCOVER 3000c, period seq1 with one record sold=0 returned=0, CLOSED."
          setup_api_calls:
