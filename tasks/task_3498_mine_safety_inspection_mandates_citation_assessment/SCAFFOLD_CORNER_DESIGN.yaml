              payload: { current_utc: "2026-02-12T10:00:00Z" }
              as: MSHAAdmin
            - *mk_contest1
            - call: "POST /msha/contests/${con1}/docket"
              payload: {}
              as: CommissionJudge
          trigger:
            - call: "POST /msha/contests/${con1}/decide"
              payload: { outcome: "VACATED" }
              as: Inspector
              as_user_id: "${i1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 403 with error_id ERR_UNAUTHORIZED"
            - "Contest.${con1}.status remains DOCKETED"

      - name: judge_cannot_issue_citations
        claim_type: role_denial
        grounds:
          - roles.Inspector
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The reverse direction of the segregation: a CommissionJudge calling the citation endpoint is refused 403 ERR_UNAUTHORIZED even with a perfectly valid payload."
        test_recipe:
          setup:
            - "SPOT inspection IN_PROGRESS."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
            - *mk_start1
            - *clk_feb10_0900
          trigger:
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.370", kind: "CITATION", negligence: "LOW", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
              as: CommissionJudge
              captures: { err: $.data.error_id }
          assert:
            - "the response is 403 with error_id ERR_UNAUTHORIZED"
            - "the mine has zero citations after the refused call"

      - name: publicreader_limited_to_published_reports
        claim_type: role_denial
        grounds:
          - roles.PublicReader
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "PublicReader gets 403 on every business-surface read (citation GET) and 404 on the public report of an accident whose report is not yet published — the public surface reveals nothing about unpublished accidents."
        test_recipe:
          setup:
            - "One citation exists; one accident REPORTED but not investigated or published."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
