  # -------------------- CertificateOfMedicalNecessity ------------------------
  - method: POST
    path: "/home-oxygen/cmns"
    description: "Draft a certificate of medical necessity against a qualifying study. Guarded by OCC on the parent Patient (concurrency_rules[cmn-create-stale-patient])."
    roles: [IntakeCoordinator]
    code: 201
    input: [patient_id, qualifying_test_id, form_type, prescribed_lpm, hours_per_day, "portable_prescribed?", length_of_need_months, "narrative_element_count?", expected_patient_version]
    output: CertificateOfMedicalNecessity
    side_effects:
      - "sets CertificateOfMedicalNecessity.status := DRAFT"
      - "computes CertificateOfMedicalNecessity.documentation_score via calculations.cmn_documentation_score"
      - "sets Patient.current_cmn_status := DRAFT"
      - "increments Patient.version by 1"

  - method: GET
    path: "/home-oxygen/cmns"
    description: "List certificates, filterable by patient, source study, status and form type."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist, ComplianceAuditor, Physician]
    code: 200
    input: ["patient_id?", "qualifying_test_id?", "status?", "form_type?", "limit?", "offset?"]
    output: CertificateOfMedicalNecessity[]
    side_effects: []

  - method: GET
    path: "/home-oxygen/cmns/{cmn_id}"
    description: "Read one certificate, including documentation_score, revision_round and recert_due_date."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist, ComplianceAuditor, Physician]
    code: 200
    input: []
    output: CertificateOfMedicalNecessity
    side_effects: []

  - method: PATCH
    path: "/home-oxygen/cmns/{cmn_id}"
    description: "Apply corrections to a returned certificate; drives RETURNED_FOR_CORRECTION -> DRAFT."
    roles: [IntakeCoordinator]
    code: 200
    input: ["prescribed_lpm?", "hours_per_day?", "portable_prescribed?", "length_of_need_months?", "narrative_element_count?"]
    output: CertificateOfMedicalNecessity
    side_effects:
      - "drives the CertificateOfMedicalNecessity RETURNED_FOR_CORRECTION -> DRAFT transition and all of its declared side effects"
      - "recomputes CertificateOfMedicalNecessity.documentation_score via calculations.cmn_documentation_score"
      - "increments CertificateOfMedicalNecessity.version by 1"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/cmns/{cmn_id}/submit"
    description: "Submit a drafted certificate for physician signature."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: CertificateOfMedicalNecessity
    side_effects:
      - "drives the CertificateOfMedicalNecessity DRAFT -> SUBMITTED transition and all of its declared side effects"
      - "increments CertificateOfMedicalNecessity.version by 1"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/cmns/{cmn_id}/sign"
    description: "Physician signature on a submitted certificate."
    roles: [Physician]
    code: 200
    input: []
    output: CertificateOfMedicalNecessity
    side_effects:
      - "drives the CertificateOfMedicalNecessity SUBMITTED -> PHYSICIAN_SIGNED transition and all of its declared side effects"
      - "increments CertificateOfMedicalNecessity.version by 1"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/cmns/{cmn_id}/approve"
    description: "Compliance approval of a signed certificate; enforces segregation of duties against submitted_by_user_id and signed_by_user_id, and supersedes the patient's prior ACTIVE certificate."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: CertificateOfMedicalNecessity
    side_effects:
      - "drives the CertificateOfMedicalNecessity PHYSICIAN_SIGNED -> ACTIVE transition and all of its declared side effects"
      - "computes CertificateOfMedicalNecessity.recert_due_date via calculations.recert_due_date"
      - "increments CertificateOfMedicalNecessity.version by 1"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/cmns/{cmn_id}/return-for-correction"
    description: "Return a submitted or signed certificate to the intake queue for correction; discards any physician signature."
    roles: [ComplianceAuditor]
    code: 200
    input: [correction_notes]
    output: CertificateOfMedicalNecessity
    side_effects:
      - "drives the CertificateOfMedicalNecessity SUBMITTED -> RETURNED_FOR_CORRECTION or PHYSICIAN_SIGNED -> RETURNED_FOR_CORRECTION transition and all of its declared side effects"
      - "increments CertificateOfMedicalNecessity.version by 1"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/cmns/{cmn_id}/void"
    description: "Void a certificate; suspends every contract hanging off it when it was ACTIVE."
    roles: [ComplianceAuditor]
    code: 200
    input: [void_reason]
    output: CertificateOfMedicalNecessity
    side_effects:
      - "drives the CertificateOfMedicalNecessity ACTIVE -> VOIDED, DRAFT -> VOIDED or RETURNED_FOR_CORRECTION -> VOIDED transition and all of its declared side effects"
      - "increments CertificateOfMedicalNecessity.version by 1"
      - "increments Patient.version by 1"

  # ---------------------------- RentalContract -------------------------------
  - method: POST
    path: "/home-oxygen/rental-contracts"
    description: "Open a capped-rental contract against an ACTIVE certificate."
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, cmn_id, pricing_basis, "cap_month_limit?"]
    output: RentalContract
    side_effects:
      - "sets RentalContract.billing_status := ACCRUING and service_status := PENDING_SETUP"
      - "sets RentalContract.monthly_allowable_cents := 0, posted_months := [], posted_month_count := 0, lifetime_paid_cents := 0, malfunction_count := 0, cumulative_oxygen_gap_minutes := 0"

  - method: GET
    path: "/home-oxygen/rental-contracts"
    description: "List rental contracts, filterable by patient, certificate, both state dimensions and pricing basis."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor]
    code: 200
    input: ["patient_id?", "cmn_id?", "billing_status?", "service_status?", "pricing_basis?", "limit?", "offset?"]
    output: RentalContract[]
    side_effects: []

  - method: GET
    path: "/home-oxygen/rental-contracts/{contract_id}"
    description: "Read one rental contract, including both state dimensions and the posted-month ledger."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: RentalContract
    side_effects: []

  - method: GET
    path: "/home-oxygen/rental-contracts/{contract_id}/cap-summary"
    description: "Computed read: evaluates calculations.cap_month_position for this contract and returns BOTH basis positions alongside the one the contract's pricing_basis selects. Persists nothing."
    roles: [BillingSpecialist, BranchManager, ComplianceAuditor]
    code: 200
    input: []
    output: "{ contract_id: string, candidate_service_month: string, service_month_basis_position: integer, paid_month_basis_position: integer, variant_applied: string, effective_position: integer, cap_month_limit: integer, months_remaining: integer, monthly_allowable_cents: integer, lifetime_paid_cents: integer, posted_month_count: integer }"
    side_effects: []

  - method: POST
    path: "/home-oxygen/rental-contracts/{contract_id}/billing-months"
    description: "Post a rental month against the cap. Advances billing_status to CAP_REACHED when calculations.cap_month_position hits cap_month_limit exactly."
    roles: [BillingSpecialist]
    code: 200
    input: [service_month]
    output: RentalContract
    side_effects:
      - "drives the RentalContract ACCRUING -> ACCRUING or ACCRUING -> CAP_REACHED billing transition and all of its declared side effects"
      - "appends to RentalContract.posted_months and increases lifetime_paid_cents by calculations.monthly_allowable_cents' amount_cents"
      - "increments RentalContract.version by 1"

  - method: POST
    path: "/home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse"
    description: "Reverse a previously posted rental month; the compensating counterpart of the post action."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: RentalContract
    side_effects:
      - "drives the RentalContract CAP_REACHED -> ACCRUING or ACCRUING -> ACCRUING reversal transition and all of its declared side effects"
      - "decreases RentalContract.lifetime_paid_cents by exactly the removed element's amount_cents"
      - "increments RentalContract.version by 1"

  - method: POST
    path: "/home-oxygen/rental-contracts/{contract_id}/resume-billing"
    description: "Resume a suspended contract's billing dimension once its certificate is ACTIVE again and no recalled equipment remains."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: RentalContract
    side_effects:
      - "drives the RentalContract SUSPENDED -> ACCRUING or SUSPENDED -> CAP_REACHED transition and all of its declared side effects"
      - "recomputes RentalContract.monthly_allowable_cents via calculations.monthly_allowable_cents"
      - "increments RentalContract.version by 1"

  - method: POST
    path: "/home-oxygen/rental-contracts/{contract_id}/close"
    description: "Close a returned or failed contract's billing dimension."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: RentalContract
    side_effects:
      - "drives the RentalContract ACCRUING/CAP_REACHED/SUSPENDED -> CLOSED transition and all of its declared side effects"
      - "increments RentalContract.version by 1"

  - method: POST
    path: "/home-oxygen/rental-contracts/{contract_id}/equipment-assignments"
    description: "Assign equipment for a role by running calculations.equipment_selection over the branch's IN_STOCK pool; the client names the role, never the unit."
    roles: [RespiratoryTherapist]
    code: 201
    input: [role]
    output: Placement
    side_effects:
      - "selects an EquipmentUnit via calculations.equipment_selection and creates a Placement in status RESERVED referencing it"
      - "drives the EquipmentUnit IN_STOCK -> RESERVED transition"
      - "increments EquipmentUnit.version by 1"
      - "increments RentalContract.version by 1"

  - method: POST
    path: "/home-oxygen/rental-contracts/{contract_id}/travel-authorizations"
    description: "Request travel supply and destination hand-off. Runs calculations.travel_supply_authorization. Guarded by OCC on the parent RentalContract (concurrency_rules[travel-auth-create-stale-contract])."
    roles: [IntakeCoordinator]
    code: 201
    input: ["receiving_branch_id?", "destination_altitude_feet?", depart_utc, return_utc, expected_contract_version]
    output: TravelAuthorization
    side_effects:
      - "sets TravelAuthorization.status := REQUESTED"
      - "computes trip_hours, altitude_factor, effective_lpm, base_liters, reserve_liters, required_liters, cylinders_raw, handling_surcharge_cylinders and supply_cylinders_authorized via calculations.travel_supply_authorization"
      - "increments RentalContract.version by 1"

  # ---------------------------- EquipmentUnit --------------------------------
  - method: POST
    path: "/home-oxygen/equipment-units"
    description: "Add a physical unit to a branch's fleet."
    roles: [BranchManager]
    code: 201
    input: [branch_id, serial_number, model_code, equipment_class, max_continuous_lpm, "max_pulse_setting?", "pm_interval_days?", next_pm_due_date, "replaces_unit_id?"]
    output: EquipmentUnit
    side_effects:
      - "sets EquipmentUnit.status := IN_STOCK and quarantine_reason := NONE"

  - method: GET
    path: "/home-oxygen/equipment-units"
    description: "List fleet units, filterable by owning branch, the unit each one replaces, model, class and status."
    roles: [BranchManager, RespiratoryTherapist, DeliveryDriver, ComplianceAuditor, BillingSpecialist]
    code: 200
    input: ["branch_id?", "replaces_unit_id?", "model_code?", "equipment_class?", "status?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []

  - method: GET
    path: "/home-oxygen/equipment-units/{equipment_unit_id}"
    description: "Read one fleet unit."
    roles: [BranchManager, RespiratoryTherapist, DeliveryDriver, ComplianceAuditor, BillingSpecialist]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []

  - method: POST
    path: "/home-oxygen/equipment-units/{equipment_unit_id}/service"
    description: "Record preventive maintenance or recall remediation on a quarantined unit and return it to stock."
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects:
      - "drives the EquipmentUnit IN_QUARANTINE -> IN_STOCK transition and all of its declared side effects"
      - "restamps EquipmentUnit.next_pm_due_date and, when a matching OPEN or IN_REMEDIATION RecallNotice exists, sets recall_remediated_at and increases that notice's remediated_unit_count"
      - "increments EquipmentUnit.version by 1"

  - method: POST
    path: "/home-oxygen/equipment-units/{equipment_unit_id}/retire"
    description: "Permanently retire a unit from the fleet."
    roles: [BranchManager]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects:
      - "drives the EquipmentUnit IN_STOCK -> RETIRED or IN_QUARANTINE -> RETIRED transition"
      - "increments EquipmentUnit.version by 1"

  # ------------------------------ Placement ----------------------------------
  - method: GET
    path: "/home-oxygen/placements"
    description: "List placements, filterable by contract, unit, role and status. This is the only discovery channel for placements created by the equipment-assignment cascade."
    roles: [BranchManager, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor]
    code: 200
    input: ["contract_id?", "equipment_unit_id?", "role?", "status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: GET
    path: "/home-oxygen/placements/{placement_id}"
    description: "Read one placement, including its malfunction counters."
    roles: [BranchManager, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: DELETE
    path: "/home-oxygen/placements/{placement_id}"
    description: "Release a reserved placement before setup; the compensating counterpart of the equipment assignment."
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "drives the Placement RESERVED -> REMOVED transition with removal_reason RELEASED"
      - "drives the EquipmentUnit RESERVED -> IN_STOCK transition, restoring the branch's IN_STOCK pool"
      - "recomputes RentalContract.monthly_allowable_cents via calculations.monthly_allowable_cents"
      - "increments Placement.version by 1"
      - "increments EquipmentUnit.version by 1"
      - "increments RentalContract.version by 1"

  - method: POST
    path: "/home-oxygen/placements/{placement_id}/malfunction"
    description: "File a malfunction report against a placed unit. Runs calculations.malfunction_severity_tier and recomputes the patient's risk under the ONGOING_SURVEILLANCE variant."
    roles: [RespiratoryTherapist]
    code: 200
    input: [symptom, oxygen_gap_minutes]
    output: Placement
    side_effects:
      - "computes Placement.last_severity_tier via calculations.malfunction_severity_tier and sets Placement.last_symptom"
      - "increments Placement.malfunction_count and RentalContract.malfunction_count by 1, and increases RentalContract.cumulative_oxygen_gap_minutes by body.oxygen_gap_minutes"
      - "when the tier is TIER_1: drives Placement PLACED -> REMOVED (removal_reason MALFUNCTION) and EquipmentUnit DEPLOYED -> IN_QUARANTINE (quarantine_reason MALFUNCTION), then recomputes RentalContract.monthly_allowable_cents"
      - "recomputes Patient.oxygen_safety_risk_score via the ONGOING_SURVEILLANCE variant, sets Patient.risk_variant_applied := ONGOING_SURVEILLANCE and re-evaluates Patient.compliance_hold"
      - "increments Placement.version by 1"
      - "increments RentalContract.version by 1"
      - "increments Patient.version by 1"

