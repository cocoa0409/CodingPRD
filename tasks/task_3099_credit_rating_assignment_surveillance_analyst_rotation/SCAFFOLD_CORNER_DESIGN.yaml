# =============================================================================
# §1.9 Scaffold Corner Design — task_3099
# Credit rating assignment, surveillance & analyst rotation
#
# Breadth probe over every claim §1.1–§1.7 declares beyond the §1.8 depth rules.
# Corners already covered by a named §1.8 instance appear as excluded_because stubs.
# Taxonomy section/claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: rated_entity_create_returns_every_declared_field_and_starts_normal
        claim_type: Creation
        grounds:
          - entities.RatedEntity
          - endpoints.POST_/rated-entities
        distinguishing_aspect: "An issuer registered with only the five required fields comes back 201 with solicitation_status SOLICITED, surveillance_posture NORMAL, current_grade null and first_rated_at null — the two lifecycle datetimes are never client-supplied."
        test_recipe:
          setup:
            - "Empty database. Logical clock default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Romeo Logistics SpA", sector: "CORPORATE_FINANCE", domicile_country: "IT", revenue_band: "MID", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "RatedEntity.${ent_id}.legal_name == \"Romeo Logistics SpA\" and revenue_band == MID"
            - "RatedEntity.${ent_id}.solicitation_status == SOLICITED and surveillance_posture == NORMAL"
            - "RatedEntity.${ent_id}.current_grade is null and first_rated_at is null"
            - "RatedEntity.${ent_id}.version == 1 and the response carries non-null id, created_at and updated_at"

      - name: engagement_letter_get_roundtrips_immutable_fee_fields
        claim_type: Retrieval
        grounds:
          - entities.EngagementLetter
          - endpoints.GET_/engagement-letters/{id}
        distinguishing_aspect: "Every engagement-letter configuration field round-trips through GET unchanged, including the boolean fee_payer_is_issuer false and the zeroed fee_credited_cents / fee_reversed_cents / null cooling_off_end_at on a DRAFT letter."
        test_recipe:
          setup:
            - "Empty database. One published methodology, one rated entity."
          setup_api_calls:
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Sierra Pharma Inc", sector: "CORPORATE_FINANCE", domicile_country: "US", revenue_band: "LARGE", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 7500000, fee_structure: "MILESTONE", fee_payer_is_issuer: false, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
          trigger:
            - call: "GET /rating-agency/engagement-letters/${eng_id}"
              payload: {}
              as: Any
          assert:
            - "the response status is 200"
            - "EngagementLetter.${eng_id}.fee_amount_cents == 7500000 and fee_structure == MILESTONE"
            - "EngagementLetter.${eng_id}.fee_payer_is_issuer == false"
            - "EngagementLetter.${eng_id}.fee_credited_cents == 0 and fee_reversed_cents == 0"
            - "EngagementLetter.${eng_id}.cooling_off_end_at is null while status == DRAFT"

      - name: rating_requests_list_paginates_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/rating-requests
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three requests on one engagement, limit=2&offset=0 returns two rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Empty database. One ACTIVE engagement with three SUBMITTED requests."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Tango Energy SA", sector: "CORPORATE_FINANCE", domicile_country: "BR", revenue_band: "LARGE", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 10000000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/engagement-letters/${eng_id}/activate"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SUBORDINATED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "REVOLVER", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
          trigger:
            - call: "GET /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", limit: 2, offset: 0 }
              as: Any
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /rating-requests?engagement_letter_id=${eng_id}&limit=2&offset=2 returns exactly 1 row with has_more == false"
            - "GET /rating-requests?engagement_letter_id=${eng_id} with no limit returns 3 rows, limit defaulting to 10"

      - name: rated_entity_get_with_unknown_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/rated-entities/{id}
          - errors.ERR_RESOURCE_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on a path segment produces 404 ERR_RESOURCE_NOT_FOUND, not a 400 and not a 500."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rating-agency/rated-entities/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_RESOURCE_NOT_FOUND"

      - name: rating_request_missing_engagement_letter_id_is_rejected
        claim_type: Required Fields
        grounds:
          - entities.RatingRequest.fields.engagement_letter_id
          - endpoints.POST_/rating-requests
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "Omitting the required engagement_letter_id on request creation is rejected as a malformed request rather than silently creating an orphan request."
        test_recipe:
          setup:
            - "Empty database. One published methodology and one rated entity."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Uniform Holdings Ltd", sector: "CORPORATE_FINANCE", domicile_country: "SG", revenue_band: "MID", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
          trigger:
            - call: "POST /rating-agency/rating-requests"
              payload: { rated_entity_id: "${ent_id}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER or the request is rejected before reaching persistence"
            - "no RatingRequest row is created for the entity"

      - name: rating_request_allocated_fee_id_and_created_at_are_system_sourced
        claim_type: Computed Fields
        grounds:
          - entities.RatingRequest.fields.allocated_fee_cents
          - entities.RatingRequest.fields.received_at
          - endpoints.POST_/rating-requests
        distinguishing_aspect: "A client-supplied allocated_fee_cents in the create body is ignored: the field starts at 0 on creation and is only ever written by the screening computation."
        test_recipe:
          setup:
            - "Empty database. One ACTIVE engagement."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Victor Auto SA", sector: "CORPORATE_FINANCE", domicile_country: "DE", revenue_band: "LARGE", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 10000000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/engagement-letters/${eng_id}/activate"
              payload: {}
              as: EngagementManager
          trigger:
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { req_id: $.data.id }
          assert:
            - "RatingRequest.${req_id}.allocated_fee_cents == 0 on creation (never client-supplied)"
            - "RatingRequest.${req_id}.received_at is non-null and equals the logical clock instant 2026-12-15T00:00:00Z"
            - "RatingRequest.${req_id}.request_status == SUBMITTED"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: engagement_revert_to_draft_after_request_exists_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EngagementLetter.SIGNED_to_DRAFT
          - errors.ERR_ENGAGEMENT_ALREADY_TERMINAL
        distinguishing_aspect: "The SIGNED → DRAFT revert is guarded by the absence of any child request: once even one RatingRequest exists under the letter, the revert fails with ERR_ENGAGEMENT_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "Empty database. A SIGNED engagement letter with one child request."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Whiskey Beverages PLC", sector: "CORPORATE_FINANCE", domicile_country: "GB", revenue_band: "LARGE", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 10000000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
          trigger:
            - call: "POST /rating-agency/engagement-letters/${eng_id}/revert-to-draft"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ENGAGEMENT_ALREADY_TERMINAL"
            - "EngagementLetter.${eng_id}.status == SIGNED (unchanged) and cooling_off_end_at is still populated"

      - name: activate_engagement_before_cooling_off_returns_cooling_off_active
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EngagementLetter.SIGNED_to_ACTIVE
          - errors.ERR_COOLING_OFF_ACTIVE
          - validations[priority=13]
        distinguishing_aspect: "Activation exactly three months minus one day after signing still fails with ERR_COOLING_OFF_ACTIVE, because the 90-day cooling-off boundary is not yet crossed."
        test_recipe:
          setup:
            - "Empty database. A SIGNED letter with signed_at 2026-09-01; the clock is advanced to 2026-11-29, one day short of 90 days."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Xray Diagnostics Inc", sector: "CORPORATE_FINANCE", domicile_country: "US", revenue_band: "MID", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 10000000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-11-29T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rating-agency/engagement-letters/${eng_id}/activate"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_COOLING_OFF_ACTIVE"
            - "EngagementLetter.${eng_id}.status == SIGNED"
            - "the same call succeeds once the clock reaches 2026-11-30T00:00:00Z"

      - name: return_screening_to_submitted_twice_is_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.RatingRequest.SCREENING_to_SUBMITTED
          - errors.ERR_REQUEST_NOT_SCREENING
        distinguishing_aspect: "A second return-to-submitted on a request already back at SUBMITTED fails with ERR_REQUEST_NOT_SCREENING and reverses nothing a second time."
        test_recipe:
          setup:
            - "Empty database. A request that has been screened then returned to SUBMITTED."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Yankee Rail Corp", sector: "CORPORATE_FINANCE", domicile_country: "US", revenue_band: "LARGE", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 10000000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters/${eng_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/engagement-letters/${eng_id}/activate"
              payload: {}
              as: EngagementManager
            - call: "POST /rating-agency/rating-requests"
              payload: { engagement_letter_id: "${eng_id}", rated_entity_id: "${ent_id}", instrument_type: "SENIOR_UNSECURED", instrument_notional_cents: 100000000, requested_rating_scale: "GLOBAL_LONG_TERM" }
              as: EngagementManager
              captures: { req_id: $.data.id }
            - call: "POST /rating-agency/rating-requests/${req_id}/open-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rating-requests/${req_id}/return-to-submitted"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /rating-agency/engagement-letters/${eng_id}"
              payload: {}
              as: Any
              captures: { rev_after_first: $.data.fee_reversed_cents }
          trigger:
            - call: "POST /rating-agency/rating-requests/${req_id}/return-to-submitted"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the second call returns 409 with error_id == ERR_REQUEST_NOT_SCREENING"
            - "RatingRequest.${req_id}.request_status == SUBMITTED"
            - "EngagementLetter.${eng_id}.fee_reversed_cents == ${rev_after_first} — no double reversal"

      - name: engagement_terminate_from_draft_is_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.EngagementLetter.ACTIVE_to_TERMINATED
          - errors.ERR_ENGAGEMENT_NOT_ACTIVE
        distinguishing_aspect: "Terminating a DRAFT letter (never activated) fails with ERR_ENGAGEMENT_NOT_ACTIVE; TERMINATED is reachable only from ACTIVE."
        test_recipe:
          setup:
            - "Empty database. A DRAFT engagement letter."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rating-agency/rated-entities"
              payload: { legal_name: "Zulu Mining Ltd", sector: "CORPORATE_FINANCE", domicile_country: "ZA", revenue_band: "MID", methodology_id: "${m_id}" }
              as: EngagementManager
              captures: { ent_id: $.data.id }
            - call: "POST /rating-agency/engagement-letters"
              payload: { rated_entity_id: "${ent_id}", fee_amount_cents: 10000000, fee_structure: "FLAT_ANNUAL", fee_payer_is_issuer: true, signed_at: "2026-09-01T00:00:00Z" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /rating-agency/engagement-letters/${eng_id}/terminate"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ENGAGEMENT_NOT_ACTIVE"
            - "EngagementLetter.${eng_id}.status == DRAFT"

      - name: committee_convened_is_the_initial_state_with_zero_votes
        claim_type: Initial State
        grounds:
          - entities.RatingCommittee.fields.committee_status
          - endpoints.POST_/rating-committees
        distinguishing_aspect: "A freshly convened committee starts CONVENED with votes_cast 0, quorum_met false and dissent_count 0 — never client-supplied."
        test_recipe:
          setup:
            - "Empty database. A TEAM_CONFIRMED request ready for a committee."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rating-agency/methodologies"
              payload: { name: "Corporate Finance Senior Unsecured", version_code: "2026.1", methodology_code: "CF-SENIOR-2026.1", sector: "CORPORATE_FINANCE" }
              as: ComplianceOfficer
              captures: { m_id: $.data.id }
            - call: "POST /rating-agency/methodologies/${m_id}/publish"
              payload: {}
