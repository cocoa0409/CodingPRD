  - rule_id: boundary_precision_check
    instances:
      - name: severity_score_exactly_at_mandatory_takedown_threshold
        grounds:
          - calculations.infringement_severity_score
          - validations.priority_64_ERR_TAKEDOWN_MANDATORY
          - endpoints.POST_infringement_cases_triage
        distinguishing_aspect: >-
          Metric under test is the 4-decimal weighted severity_score at the inclusive
          MANDATORY_TAKEDOWN_THRESHOLD 0.7500, exercised on POST /infringement-cases/{id}/triage.
          The two cases differ only in match_confidence (0.925 vs 0.920), which moves the score by
          0.0030 across the threshold — an implementation that truncates instead of
          round_half_up-ing to 4 places, or that treats the comparison as strictly greater than,
          fails exactly one of the two calls.
        test_recipe:
          setup:
            - "CA law profile and the SAG_AFTRA/ADVERTISING union row exist"
            - "A LIVING CA/SAG talent with rights_posture CLEAR (no grants suspended, no open removals) so POSTURE_FACTOR is 0.3"
            - "Two cases opened with detected_view_count 6000000 (reach_term 0.6) and no matched license"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/at-threshold", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 6000000, match_confidence: 0.925 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c_hi_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/below-threshold", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 6000000, match_confidence: 0.920 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c_lo_id: $.data.id }
          trigger:
            - call: "POST /infringement-cases/${c_hi_id}/triage"
              payload: { decision: "DISMISS" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /infringement-cases/${c_lo_id}/triage"
              payload: { decision: "DISMISS" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /infringement-cases/${c_hi_id}/triage"
              payload: { decision: "ISSUE_TAKEDOWN" }
              as: ComplianceOfficer
              as_user_id: "co-001"
          assert:
            - "InfringementCase.${c_hi_id}.severity_score == 0.7500 exactly (0.5550 + 0.1500 + 0.0450)"
            - "InfringementCase.${c_lo_id}.severity_score == 0.7470 (0.5520 + 0.1500 + 0.0450)"
            - "trigger call 1 -> 409 with error.id == ERR_TAKEDOWN_MANDATORY; the score AT the threshold already forbids a dismissal"
            - "trigger call 2 -> 200 and InfringementCase.${c_lo_id}.status == DISMISSED_NO_ACTION with closure_outcome == BELOW_ENFORCEMENT_THRESHOLD"
            - "trigger call 3 -> 200 and InfringementCase.${c_hi_id}.status == TAKEDOWN_ISSUED with takedown_issued_at == 2026-08-01T00:00:00Z (the untouched default clock)"
            - "both cases report enforceable_under_use_state == true and use_state_rights_until == null for a LIVING talent, so the unenforceability carve-out is not what permitted trigger call 2"

      - name: union_floor_equality_produces_no_topup_entry
        grounds:
          - calculations.initial_creation_compensation
          - calculations.royalty_share_split
          - endpoints.POST_consent_grants_countersign
        distinguishing_aspect: >-
          A different metric (integer cents against the union minimum) on a different endpoint
          (POST /consent-grants/{id}/countersign). Two grants sit one cent apart around the
          300000 floor: at exactly 300000 the scaled amount equals the floor, so max() keeps it and
          NO UNION_TOPUP entry may be appended at all; at 299999 a 1-cent top-up entry appears whose
          share split is 1 / 0 / 0. An implementation using `scaled < floor` vs `scaled <= floor`,
          or one that always writes a top-up row, breaks on exactly one of the two.
        test_recipe:
          setup:
            - "CA law profile and the SAG_AFTRA/ADVERTISING union row with minimum_initial_cents 300000"
            - "Two CA/SAG talents, each with one PENDING_COUNTERSIGN grant over [ADVERTISING] for 12 months, NON_EXCLUSIVE (all scope factors 1.00)"
            - "Grant A fee 300000 (exactly at the floor), grant B fee 299999 (one cent under)"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { ta_id: $.data.id, ta_v: $.data.version }
            - call: "POST /talents"
              payload: { legal_name: "Ben Ortiz", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
