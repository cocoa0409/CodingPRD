          - errors[ERR_UNAUTHORIZED_ROLE]
          - errors[ERR_INVALID_ORDER_STATE]
        distinguishing_aspect: |
          Category pair = auth (ERR_UNAUTHORIZED_ROLE, priority 2) vs state
          (ERR_INVALID_ORDER_STATE, priority 5). A Customer (wrong role) dispatching a
