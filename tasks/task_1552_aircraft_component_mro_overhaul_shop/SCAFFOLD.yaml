  - { method: GET, path: "/mro/work-orders/{id}/bookings", description: "List WO bookings (reverse of work_order_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "TestCellBooking[]", side_effects: [] }
  - { method: POST, path: "/mro/test-cell-bookings/{bookingId}/cancel", description: "Cancel a BOOKED booking", roles: [CustomerServiceRep], code: 200, input: [], output: TestCellBooking, side_effects: ["BOOKED->CANCELLED"] }

  # --- 8130 certificate ---
  - { method: GET, path: "/mro/work-orders/{id}/certificate", description: "Get 8130 certificate (array of 0-1; reverse of work_order_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: "ReleaseCertificate[]", side_effects: [] }

  # --- Rotable exchange pool ---
  - { method: POST, path: "/mro/exchange-agreements", description: "Open exchange agreement", roles: [CustomerServiceRep], code: 201, input: [customer_id, part_id], output: ExchangeAgreement, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/mro/exchange-agreements/{agreementId}", description: "Get exchange agreement", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: ExchangeAgreement, side_effects: [] }
  - { method: GET, path: "/mro/exchange-agreements", description: "Filtered list (reverse of customer_id/part_id/pool_unit_id/core_unit_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: ["customer_id?", "part_id?", "pool_unit_id?", "core_unit_id?", "status?", "limit?", "offset?"], output: "ExchangeAgreement[]", side_effects: [] }
