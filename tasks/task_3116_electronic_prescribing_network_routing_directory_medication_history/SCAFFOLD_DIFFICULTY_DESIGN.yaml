  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: certification_priority_business_referential_over_state
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_CERT_TESTS_INCOMPLETE]
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/network/participants/{id}/certify
        distinguishing_aspect: "The business_referential pair: a certify request against a participant that is both in the wrong state (priority 4, ERR_INVALID_STATE) and short of the required test set (priority 6, ERR_CERT_TESTS_INCOMPLETE) must return ERR_INVALID_STATE, because the state check sits two priority bands above the certification-completeness check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Riverbend Pharmacy has one endpoint but its certification_status is still UNCERTIFIED — no certification window has been opened — and it has passed neither CONNECTIVITY nor SCRIPT_NEW_RX."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Riverbend Pharmacy", participant_type: "PHARMACY", npi: "2222222222", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0200" }
              as: NetworkOperator
              captures: { ph_id: $.data.id, ph_v: $.data.version }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /network/participants/${ph_id}/certify"
              payload: { expected_participant_version: "${ph_v}" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_CERT_TESTS_INCOMPLETE — the priority-4 state check wins over the priority-6 certification-completeness check"
            - "NetworkParticipant.${ph_id}.certification_status is still UNCERTIFIED and certification_tests_passed is still empty"
            - "response_type is error and data carries both error_id and message"

      - name: cancellation_priority_business_safety_over_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_CRITICAL_ORDER_DELIVERY_REQUIRED]
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/network/prescriptions/{id}/cancel
        distinguishing_aspect: "The business_safety vs business_constraint pair: a single cancel request that violates both the safety band and the constraint band returns ERR_CRITICAL_ORDER_DELIVERY_REQUIRED on the ROUTED row (safety band, priority 5) but ERR_INVALID_STATE on the DRAFT row (state band, priority 4), so the same operation on the same prescription flips its error_id as the routing status moves."
