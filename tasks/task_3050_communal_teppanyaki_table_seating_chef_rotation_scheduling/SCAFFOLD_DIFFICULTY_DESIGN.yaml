# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3050_communal_teppanyaki_table_seating_chef_rotation_scheduling
#
# Depth probe: every difficulty feature §1.1–§1.7 claims, cross-referenced against
# the nine §0.5 Difficulty Rules. Anchors (&c_*) defined on first use below are
# reused by reference (*c_*) throughout this file so every chain stays a faithful
# clone of a chain that is known to be reachable from empty-DB.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: settlement_quote_vs_final_celebration_fee_gap
        grounds:
          - calculations.settlement
          - calculations.settlement.variants.quote
          - calculations.settlement.variants.final
          - entities.Reservation.fields.quote_final_cents
          - entities.Reservation.fields.final_bill_cents
        distinguishing_aspect: "Two valid readings of the same booking — priced without the celebration service fee while the hold is open, and with it once the grill course finishes — differ by exactly the fee: quote_final_cents is 12800 for a three-guest T6 birthday, final_bill_cents is 13700, and the delta is 900. The variant boundary is crossed by the GRILL show's FINISH, not by CLOSE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue, T6/T4/T2 tiers, one T6 table, two chefs, a PLATINUM party."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - &c_venue
              call: "POST /service-floor/venues"
              payload: { venue_name: "Midtown Iron Grill", city_code: "NYC", ventilation_zone: "ZONE_A" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id, v_venue: $.data.version }
            - &c_tier6
              call: "POST /service-floor/tiers"
              payload: { venue_id: "${venue_id}", tier_code: "T6", over_capacity_ratio: 1.25, seat_capacity: 6, base_rate_per_guest_cents: 3200, minimum_bill_cents: 16000, protein_gram_standard: 240, chef_show_minutes: 50, turn_time_standard_minutes: 75, turn_time_celebration_minutes: 95 }
              as: PlatformAdmin
              captures: { tier6_id: $.data.id }
            - &c_tier4
              call: "POST /service-floor/tiers"
              payload: { venue_id: "${venue_id}", tier_code: "T4", over_capacity_ratio: 1.25, seat_capacity: 4, base_rate_per_guest_cents: 3200, minimum_bill_cents: 14000, protein_gram_standard: 240, chef_show_minutes: 45, turn_time_standard_minutes: 60, turn_time_celebration_minutes: 80 }
              as: PlatformAdmin
              captures: { tier4_id: $.data.id }
            - &c_tier2
              call: "POST /service-floor/tiers"
              payload: { venue_id: "${venue_id}", tier_code: "T2", over_capacity_ratio: 1.25, seat_capacity: 2, base_rate_per_guest_cents: 3200, minimum_bill_cents: 8000, protein_gram_standard: 240, chef_show_minutes: 40, turn_time_standard_minutes: 50, turn_time_celebration_minutes: 70 }
              as: PlatformAdmin
              captures: { tier2_id: $.data.id }
            - &c_table1
              call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T6", seat_capacity: 6 }
              as: FloorManager
              captures: { table1_id: $.data.id, t1_v: $.data.version }
            - &c_table2
              call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T4", seat_capacity: 4 }
              as: FloorManager
              captures: { table2_id: $.data.id, t2_v: $.data.version }
            - &c_table3
              call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T2", seat_capacity: 2 }
              as: FloorManager
              captures: { table3_id: $.data.id, t3_v: $.data.version }
            - &c_chef1
              call: "POST /service-floor/chefs"
              payload: { venue_id: "${venue_id}", chef_name: "Kenji Ito", station_zone: "ZONE_A" }
              as: FloorManager
              captures: { chef1_id: $.data.id }
            - &c_chef2
              call: "POST /service-floor/chefs"
              payload: { venue_id: "${venue_id}", chef_name: "Ana Ruiz", station_zone: "ZONE_B" }
              as: FloorManager
              captures: { chef2_id: $.data.id }
            - &c_party_plat
              call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Dana Whitfield", contact_phone: "212-555-0141", loyalty_tier: "PLATINUM" }
              as: Host
              captures: { party_plat_id: $.data.id }
            - &c_party_gold
              call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Owen Marsh", contact_phone: "212-555-0177", loyalty_tier: "GOLD" }
              as: Host
              captures: { party_gold_id: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_plat_id}", tier_id: "${tier6_id}", party_size: 3, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", credit_to_apply_cents: 0, celebration: "BIRTHDAY" }
              as: Host
              captures: { res_a: $.data.id, res_a_v: $.data.version, res_a_quote: $.data.quote_final_cents }
            - call: "POST /service-floor/reservations/${res_a}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
          trigger:
            - call: "GET /service-floor/tables/${table1_id}"
              payload: {}
              as: Host
              captures: { v_table1_id_hold1: $.data.version }
            - call: "POST /service-floor/reservations/${res_a}/holds"
              payload: { expected_table_version: "${v_table1_id_hold1}", table_id: "${table1_id}" }
              as: Host
              captures: { res_a_quote_held: $.data.quote_final_cents, res_a_v2: $.data.version }
            - call: "POST /service-floor/reservations/${res_a}/seat"
              payload: {}
              as: Host
              captures: { res_a_seated_v: $.data.version, sushi_show_a: $.data.current_sushi_show_id, grill_show_a: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${sushi_show_a}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${sushi_show_a}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_show_a}/events"
              payload: { event_type: "START" }
              as: Chef
          assert:
            - "Reservation.${res_a}.quote_final_cents == 12800 at hold time (ENTITLEMENT 3*3200 = 9600, P_cap 19200, T empty, no P_fee under the quote variant)"
            - "Reservation.${res_a}.quote_final_cents stays 12800 between the hold and the grill start — the quote variant is not re-read"
            - "after the grill FINISH, Reservation.${res_a}.final_bill_cents == 10500 (ENTITLEMENT 9600 + P_fee 900, still under P_cap 19200)"
            - "Reservation.${res_a}.final_bill_cents - Reservation.${res_a}.quote_final_cents == 900"

      - name: protein_cost_posted_vs_settled_control_allowance_gap
        grounds:
          - calculations.protein_cost
          - calculations.protein_cost.variants.posted
          - calculations.protein_cost.variants.settled
          - entities.Venue.fields.protein_cost_cents
          - endpoints.GET_/service-floor/venues/{venue_id}/protein-cost-report
        distinguishing_aspect: "Two valid readings of the same venue's protein spend — the persisted rollup of posted issues, and the read-time report that adds the control allowance — differ by exactly PROTEIN_GRAM_COST_CONTROL_PCT of the rollup: protein_cost_cents is 115.20 while the report's control_allowance_cents is 5.76. The divergence is a different subject domain from the booking settlement and is invisible in the persisted field."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. Venue with T6/T4/T2 tiers, three tables, two chefs, a PLATINUM party."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_plat_id}", tier_id: "${tier6_id}", party_size: 3, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_a: $.data.id }
            - call: "POST /service-floor/reservations/${res_a}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table1_id}"
              payload: {}
              as: Host
              captures: { v_table1_id_hold2: $.data.version }
            - call: "POST /service-floor/reservations/${res_a}/holds"
              payload: { expected_table_version: "${v_table1_id_hold2}", table_id: "${table1_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_a}/seat"
              payload: {}
              as: Host
              captures: { sushi_show_a: $.data.current_sushi_show_id, grill_show_a: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${sushi_show_a}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${sushi_show_a}/events"
              payload: { event_type: "FINISH" }
              as: Chef
          trigger:
            - call: "POST /service-floor/shows/${grill_show_a}/events"
              payload: { event_type: "START" }
              as: Chef
              captures: { pt_1: $.data.protein_ticket_id }
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: FloorManager
              captures: { venue_protein_cost: $.data.protein_cost_cents }
            - call: "GET /service-floor/venues/${venue_id}/protein-cost-report"
              payload: {}
              as: FloorManager
              captures: { allow: $.data.control_allowance_cents, report_cost: $.data.protein_cost_cents }
            - call: "GET /service-floor/protein-tickets/${pt_1}"
              payload: {}
              as: Chef
          assert:
            - "ProteinTicket.${pt_1}.standard_grams == 720 (three guests * protein_gram_standard 240)"
            - "ProteinTicket.${pt_1}.issued_grams == 540 (720 minus floor(720 / 1 / 4) = 180)"
            - "ProteinTicket.${pt_1}.variance_grams == -180"
            - "ProteinTicket.${pt_1}.cost_cents == 2160.0"
            - "the posted variant persists Venue.${venue_id}.protein_cost_cents == 2160.0 and never the allowance-augmented figure"
            - "the settled variant reports control_allowance_cents == 108.0, i.e. 0.05 * 2160.0, and report_cost == 2160.0"
            - "control_allowance_cents is strictly greater than 0 and is absent from every persisted Venue field"


      - name: turn_over_window_standard_vs_celebration_tenure_variant
        grounds:
          - calculations.turn_over_window
          - entities.TableTier.fields.turn_time_standard_minutes
          - entities.TableTier.fields.turn_time_celebration_minutes
          - entities.TableSeating.fields.expected_vacate_at
        distinguishing_aspect: "A dual-variant reading of the same occupancy window on the TableSeating domain, distinct from both the booking-money variant and the venue-cost variant: an occupancy carrying a celebration is measured against turn_time_celebration_minutes while an identical occupancy without one is measured against turn_time_standard_minutes, so the two expected_vacate_at instants differ by exactly 20 minutes on the same tier."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T18:55:00Z. A venue whose T4 tier carries a 60-minute standard turn and a celebration turn of 80 minutes; one T4 table; two chefs; two parties."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T18:55:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_w: $.data.id }
            - call: "POST /service-floor/reservations/${res_w}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { t2_v_w: $.data.version }
            - call: "POST /service-floor/reservations/${res_w}/holds"
              payload: { expected_table_version: "${t2_v_w}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_w}/seat"
              payload: {}
              as: Host
              captures: { res_w_seating: $.data.current_seating_id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_plat_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T18:55:00Z", payment_mode: "CARD_ONLY", celebration: "BIRTHDAY" }
              as: Host
              captures: { res_x: $.data.id }
            - call: "POST /service-floor/reservations/${res_x}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table1_id}"
              payload: {}
              as: Host
              captures: { t1_v_x: $.data.version }
            - call: "POST /service-floor/reservations/${res_x}/holds"
              payload: { expected_table_version: "${t1_v_x}", table_id: "${table1_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_x}/seat"
              payload: {}
              as: Host
              captures: { res_x_seating: $.data.current_seating_id }
          trigger:
            - call: "GET /service-floor/seatings/${res_w_seating}"
              payload: {}
              as: Host
              captures: { std_vacate: $.data.expected_vacate_at }
            - call: "GET /service-floor/seatings/${res_x_seating}"
              payload: {}
              as: Host
              captures: { celeb_vacate: $.data.expected_vacate_at }
          assert:
            - "both seatings began at the same snapped instant 18:55 on the same 60-minute-standard T4 tier"
            - "the plain occupancy's std_vacate == 19:55, i.e. seated_at + turn_time_standard_minutes 60"
            - "the birthday occupancy's celeb_vacate == 20:15, i.e. seated_at + turn_time_celebration_minutes 80"
            - "the two variants differ by exactly 20 minutes on identical tiers and identical party sizes"
            - "the variant is selected by the reservation's celebration field and not by the table, so the same physical table produces either window"

      - name: protein_cost_role_variant_on_the_documented_control_report
        grounds:
          - calculations.protein_cost
          - calculations.protein_cost.variants.posted
          - calculations.protein_cost.variants.settled
          - endpoints.GET_/service-floor/venues/{venue_id}/protein-cost-report
        distinguishing_aspect: "A dual-variant reading that the scaffold's own prose documents rather than leaves to the reader: §1.3 states that the settled variant is never persisted and lives only on the venue read, while the posted variant is what lands in Venue.protein_cost_cents — so the two readings of the same inputs are the posted and settled rather than the earlier venues-prose pair. Reading both before and after a variance adjustment shows the split is stable and the allowance tracks the rollup."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers and tables, two chefs, a GOLD party, and one open grill show carrying a protein ticket."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: Chef
              captures: { v_venue_ev2: $.data.version }
            - call: "POST /service-floor/chefs/${chef1_id}/events"
              payload: { event_type: "CLOCK_IN", expected_venue_version: "${v_venue_ev2}" }
              as: Chef
              as_user_id: "${chef1_id}"
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_y: $.data.id }
            - call: "POST /service-floor/reservations/${res_y}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { t2_v_y: $.data.version }
            - call: "POST /service-floor/reservations/${res_y}/holds"
              payload: { expected_table_version: "${t2_v_y}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_y}/seat"
              payload: {}
              as: Host
              captures: { sushi_y: $.data.current_sushi_show_id, grill_y: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${sushi_y}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${sushi_y}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_y}/events"
              payload: { event_type: "START" }
              as: Chef
              captures: { pt_y: $.data.protein_ticket_id }
          trigger:
            - call: "GET /service-floor/venues/${venue_id}/cost-report"
              payload: {}
              as: FloorManager
              captures: { posted_before: "$.data.venue_cost_cents" }
            - call: "GET /service-floor/venues/${venue_id}/protein-cost-report"
              payload: {}
              as: FloorManager
              captures: { allow_before: $.data.control_allowance_cents }
            - call: "POST /service-floor/protein-tickets/${pt_y}/variance"
              payload: { delta_grams: 20 }
              as: Chef
              as_user_id: "${chef1_id}"
            - call: "GET /service-floor/venues/${venue_id}/protein-cost-report"
              payload: {}
              as: FloorManager
              captures: { allow_after: $.data.control_allowance_cents, report_after: $.data.protein_cost_cents }
          assert:
            - "the grill show posts a ticket with standard_grams == 960 (four guests * protein_gram_standard 240) and issued_grams == 720"
            - "the posted variant persists 720 * 4.0 == 2880.0 into Venue.protein_cost_cents"
            - "the settled variant adds only the control allowance: allow_before == 0.05 * 2880.0 == 144.0 while report_after still reports the rollup itself"
            - "after a +20 gram variance the ticket's issued_grams is 740, its variance_grams is -220, and its cost is 740 * 4.0 == 2960.0"
            - "the variant split is stable across the adjustment: allow_after == 0.05 * 2960.0 == 148.0, exactly 0.05 of the new rollup"
            - "the allowance is never written to any persisted Venue field, so re-reading the venue after the adjustment still shows protein_cost_cents == 2960.0 and not 3108.0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: trueup_band_then_ceiling_order
        grounds:
          - calculations.table_minimum_trueup
          - calculations.settlement
          - entities.VenueLedgerEntry.fields.entry_kind
          - validations[priority=7]
        distinguishing_aspect: "Formula mode (b) — nested rounding whose order is pinned: the shortfall band is chosen first and the 25-cent ceiling is applied once to the band result, so a 403-cent shortfall yields 275 (ceil(241.8/25)*25) and never 250 (sum of per-guest ceilings). The two orders differ by 25 cents on identical inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. Venue with T4 tier floor 14000 and a T2 table; a GOLD party."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_b: $.data.id }
            - call: "POST /service-floor/reservations/${res_b}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_table2_id_hold3: $.data.version }
            - call: "POST /service-floor/reservations/${res_b}/holds"
              payload: { expected_table_version: "${v_table2_id_hold3}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_b}/seat"
              payload: {}
              as: Host
              captures: { res_b_seated_v: $.data.version, sushi_show_b: $.data.current_sushi_show_id, grill_show_b: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${sushi_show_b}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${sushi_show_b}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_show_b}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_show_b}/events"
              payload: { event_type: "FINISH" }
              as: Chef
          trigger:
            - call: "POST /service-floor/reservations/${res_b}/close"
              payload: { expected_reservation_version: "${res_b_seated_v}", credit_to_apply_cents: 0 }
              as: Host
              captures: { res_b_closed_v: $.data.version }
            - call: "GET /service-floor/ledger-entries"
              payload: { venue_id: "${venue_id}", reservation_id: "${res_b}", entry_kind: "TABLE_MINIMUM_TRUEUP" }
              as: FloorManager
          assert:
            - "Reservation.${res_b}.final_bill_cents == 12800 (ENTITLEMENT 4*3200 = 12800, T empty, no celebration fee)"
            - "the shortfall against the T4 minimum of 14000 is 1200 cents, which lands in band 2 (<= SHORTFALL_BAND_2_CENTS 2000)"
            - "band_cents == 0.60 * 1200 == 720 and the ceiling is applied once to the band result: ceil(720/25)*25 == 29*25 == 725"
            - "Reservation.${res_b}.check_cents == 12800 + 4800 + 725 == 18325"
            - "exactly one VenueLedgerEntry of kind TABLE_MINIMUM_TRUEUP exists for ${res_b} with amount_cents == 725 and status POSTED"
            - "the rejected order (i) — ceiling each of the four guests' 180-cent share to 200 and summing — would give 800, which is NOT the pinned answer"

      - name: credit_cap_read_before_then_applied_after
        grounds:
          - calculations.credit_application
          - calculations.settlement
          - entities.Party.fields.loyalty_credit_cents
          - validations[priority=19]
        distinguishing_aspect: "Formula mode (c) — a circular-looking dependency on a different subject (the party's reusable credit wallet, not the venue's true-up): check_cents is defined in terms of credit_applied_cents, yet credit_applied_cents is capped by CREDIT_CAP_PCT of check_cents. The order is pinned — evaluate check_cents with the stored credit, derive the cap from that, then recompute once — so a 12800 check caps the credit at 1536 and never at floor(0.12 * 11264) == 1351."
        test_recipe:
          setup:
