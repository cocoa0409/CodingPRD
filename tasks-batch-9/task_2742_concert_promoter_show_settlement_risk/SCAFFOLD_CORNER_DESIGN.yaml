              payload: { show_id: "${vs_live_id}", expected_show_version: "${vs_live_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 500000, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { vs_of1_id: $.data.id }
            - call: "POST /offers/${vs_of1_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${vs_of1_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${vs_ar1_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${vs_live_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 1000 }
