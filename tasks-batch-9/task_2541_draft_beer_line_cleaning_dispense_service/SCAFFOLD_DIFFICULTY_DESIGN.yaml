              payload: { visit_id: "${visit}", line_id: "${line1}", chemical_lot_id: "${lot_caustic}", chemical_type: "CAUSTIC", contact_minutes: 20, recirculation_temp_f: 96.0, concentrate_liters_used: 0.31 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { cyc: $.data.id }
          assert:
            - "${bad1_source} == VENUE_MANUAL"
            - "${score_alarm} == 44.0"
            - "${state_alarm} == ALARM"
            - "GlycolLoop.${loop}.window_avg_cooler_temp_f == 45.0 while in ALARM"
            - "POST /draft-service/cleaning-cycles returns HTTP 422 with error_id ERR_GLYCOL_ALARM_BLOCK while the loop is in ALARM"
            - "${err_alarm} == ERR_GLYCOL_ALARM_BLOCK"
            - "${good1_source} == TECH_MANUAL"
            - "${score_norm} == 100.0"
            - "${state_norm} == NORMAL"
            - "GlycolLoop.${loop}.window_avg_cooler_temp_f == 38.0 after the window rolls over"
            - "the final POST /draft-service/cleaning-cycles with the identical body returns HTTP 201"
            - "CleaningCycle.${cyc}.compliance_result == PASS"
            - "CleaningCycle.${cyc}.effective_active_pct == 1.993"
            - "CleaningCycle.${cyc}.required_contact_minutes == 20"
            - "ChemicalLot.${lot_caustic}.liters_remaining == 19.690"
            - "BeerLine.${line1}.status == IN_SERVICE"

      - name: contract_activation_blocked_because_its_brewer_program_was_ended
        grounds:
          - validations.priority_26_ERR_PROGRAM_NOT_ACTIVE
          - state_machines.BrewerProgram.ACTIVE_to_ENDED
          - state_machines.ServiceContract.ABSENT_to_DRAFT
          - state_machines.ServiceContract.DRAFT_to_ACTIVE
          - entities.ServiceContract.fields.funding_status
          - endpoints.POST_brewer_programs_end
        distinguishing_aspect: |
          The contract is structurally perfect - effective_from has passed, the
          account is ACTIVE, the version token is fresh - and is still refused
          activation because a THIRD entity that only the brewer can touch went
          to ENDED. The same /end call also rewrites the DRAFT contract's
          funding_status from BREWER_FUNDED to SELF_FUNDED without any request
          naming that contract. A sibling contract on a still-ACTIVE program
          activates normally, isolating the program state as the sole cause.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "BrewerProgram P1 'Southside Brewing' ACTIVE, CLEANING_ONLY, co_pay_bps 1500, cap 50000."
            - "BrewerProgram P2 'Harbor Craft Co' ACTIVE, FULL, co_pay_bps 1000, cap 60000."
            - "ServiceAccount 'Lamplighter Inn' ACTIVE, billing_mode DIRECT_BILL."
            - "ServiceContract C1 in DRAFT naming P1, effective_from 2026-08-01T00:00:00Z, funding_status BREWER_FUNDED."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/brewer-programs"
              payload: { brewer_name: "Southside Brewing", funded_scope: "CLEANING_ONLY", co_pay_bps: 1500, funding_cap_cents: 50000 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { p1: $.data.id, p1_remaining: $.data.remaining_cents }
            - call: "POST /draft-service/brewer-programs"
              payload: { brewer_name: "Harbor Craft Co", funded_scope: "FULL", co_pay_bps: 1000, funding_cap_cents: 60000 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { p2: $.data.id }
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Lamplighter Inn", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 28, contracted_line_count: 3, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}", brewer_program_id: "${p1}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { c1: $.data.id, c1_funding: $.data.funding_status }
          trigger:
            - call: "POST /draft-service/brewer-programs/${p1}/end"
              payload: { end_note: "Season programme closed by the brewer." }
              as: BrewerRep
              as_user_id: "brewer-1"
              captures: { p1_state: $.data.status }
            - call: "POST /draft-service/contracts/${c1}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err_prog: $.data.error_id }
            - call: "GET /draft-service/accounts/${acct}"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct_v2: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 3, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v2}", brewer_program_id: "${p2}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { c2: $.data.id }
            - call: "POST /draft-service/contracts/${c2}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { c2_state: $.data.status }
          assert:
            - "${p1_remaining} == 50000"
            - "${c1_funding} == BREWER_FUNDED"
            - "${p1_state} == ENDED"
            - "ServiceContract.${c1}.funding_status == SELF_FUNDED immediately after the /end call"
            - "ServiceContract.${c1}.status == DRAFT"
            - "ServiceAccount.${acct}.billing_mode == DIRECT_BILL after the /end call"
            - "POST /draft-service/contracts/${c1}/status returns HTTP 409 with error_id ERR_PROGRAM_NOT_ACTIVE"
            - "${err_prog} == ERR_PROGRAM_NOT_ACTIVE"
            - "ServiceContract.${c2}.funding_status == BREWER_FUNDED"
            - "${c2_state} == ACTIVE"
            - "ServiceAccount.${acct}.billing_mode == PROGRAM_BILL after C2 activates"
            - "BrewerProgram.${p2}.status == ACTIVE"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # The two contended resources are the venue floor (per account + date) and the
  # crew's day (per technician + date). Each instance isolates ONE of them by
  # making the other rule structurally inapplicable.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_floor_overlap_ignores_abandoned_visits_but_not_the_replacement
        grounds:
          - validations.priority_33_ERR_VENUE_SLOT_CONFLICT
          - state_machines.ServiceVisit.work_status.SCHEDULED_to_ABANDONED
          - endpoints.POST_service_visits_reschedule
          - entities.ServiceVisit.fields.rescheduled_from_visit_id
          - entities.ServiceVisit.fields.abandon_reason
        distinguishing_aspect: |
          The contended resource is the venue floor, and the inclusion set is
          state-filtered: a 540-660 slot that was freed by a reschedule
          (original ABANDONED / RESCHEDULED) stops blocking, so a DIFFERENT
          crew books the very same minutes; the newly live booking then blocks a
          third crew at 600-700 on the same date. Every booking uses a distinct
          technician so the route rule at P34 can never be the reporter, and the
          replacement visit lands on 2026-08-06 to prove the freed slot was
          released on the original date only.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "ServiceAccount 'Quarry Street Taproom' access window 480-1080, ACTIVE contract."
            - "Three ACTIVE Technicians: T1, T2, T3."
            - "One SCHEDULED visit V1 on 2026-08-05 540-660 assigned to T1."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Quarry Street Taproom", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { t1: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Kem Adeyemi", certification_level: "CERTIFIED", caustic_certified: false, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { t2: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Sol Vranken", certification_level: "APPRENTICE", caustic_certified: false, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { t3: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${t1}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /draft-service/service-visits/${v1}/reschedule"
              payload: { scheduled_date: "2026-08-06", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { v1b: $.data.id, v1b_from: $.data.rescheduled_from_visit_id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${t2}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { v2: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${t3}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 600, scheduled_end_minute: 700 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err_venue: $.data.error_id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${t3}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 690, scheduled_end_minute: 780 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { v3: $.data.id }
          assert:
            - "ServiceVisit.${v1}.work_status == ABANDONED"
            - "ServiceVisit.${v1}.abandon_reason == RESCHEDULED"
            - "${v1b_from} == ${v1}"
            - "ServiceVisit.${v1b}.work_status == SCHEDULED"
            - "ServiceVisit.${v1b}.scheduled_date == 2026-08-06"
            - "ServiceVisit.${v1b}.technician_id == ${t1}"
            - "second trigger POST /draft-service/service-visits returns HTTP 201 - the abandoned 540-660 slot no longer blocks"
            - "ServiceVisit.${v2}.scheduled_start_minute == 540"
            - "third trigger POST /draft-service/service-visits returns HTTP 409 with error_id ERR_VENUE_SLOT_CONFLICT"
            - "${err_venue} == ERR_VENUE_SLOT_CONFLICT"
            - "fourth trigger POST /draft-service/service-visits returns HTTP 201"
            - "ServiceVisit.${v3}.scheduled_start_minute == 690"

      - name: technician_route_conflict_crosses_accounts_but_not_calendar_days
        grounds:
          - validations.priority_34_ERR_TECHNICIAN_ROUTE_CONFLICT
          - validations.priority_33_ERR_VENUE_SLOT_CONFLICT
          - endpoints.POST_service_visits
          - complexity_profile.constants.TRAVEL_BUFFER_MINUTES
        distinguishing_aspect: |
          The contended resource is the crew's day, whose scope is orthogonal to
          the venue's: it reaches ACROSS accounts (a job at account B collides
          with the same technician's job at account A, where the venue rule is
          structurally silent because the account_id differs) but never across
          dates (the identical minutes on the next day are accepted). The
          buffered edge is also shown from the far side: 700 against a job
          ending at 660 clears 660 + 30 and is accepted.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "ServiceAccount A 'Northgate Bierhaus' and ServiceAccount B 'Southgate Bierhaus', both access window 480-1080, each with its own ACTIVE contract."
            - "One ACTIVE Technician shared by both accounts."
            - "One SCHEDULED visit at account A on 2026-08-05 540-660 with that technician."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Northgate Bierhaus", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acctA: $.data.id, acctA_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acctA}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acctA_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctrA: $.data.id }
            - call: "POST /draft-service/contracts/${ctrA}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Southgate Bierhaus", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acctB: $.data.id, acctB_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acctB}", cleaning_frequency_days: 14, contracted_line_count: 3, per_line_rate_cents: 3000, visit_base_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acctB_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctrB: $.data.id }
            - call: "POST /draft-service/contracts/${ctrB}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acctA}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { va: $.data.id }
          trigger:
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acctB}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 600, scheduled_end_minute: 700 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err_route: $.data.error_id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acctB}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 700, scheduled_end_minute: 800 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { vb: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acctB}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-06", scheduled_start_minute: 600, scheduled_end_minute: 700 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { vc: $.data.id }
          assert:
