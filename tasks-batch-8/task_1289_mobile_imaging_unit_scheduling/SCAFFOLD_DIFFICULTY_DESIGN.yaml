            - { call: "POST /api/appointments", payload: { site_day_id: "${sd1}", patient_ref: "P-001", exam_type: "CT_HEAD", scheduled_start: "09:00", duration_minutes: 30, estimated_dose_msv: 1.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { ap1: $.data.id } }
          trigger:
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd1}", patient_ref: "P-002", exam_type: "CT_HEAD", scheduled_start: "09:35", duration_minutes: 30, estimated_dose_msv: 1.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { err: $.data.error_id } }
            - { call: "POST /api/appointments", payload: { site_day_id: "${sd1}", patient_ref: "P-003", exam_type: "CT_HEAD", scheduled_start: "09:40", duration_minutes: 30, estimated_dose_msv: 1.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { ap3: $.data.id } }
          assert:
            - "09:35 start conflicts (09:35 < 09:30+10) -> ERR_SLOT_OVERLAP (${err}), HTTP 409"
            - "09:40 start equals the buffered boundary exactly (09:40 < 09:40 false) -> created (${ap3})"

      - name: unit_day_double_booking_discrete_capacity
        grounds:
          - calculations.unit_day_exclusivity
          - errors[ERR_UNIT_DAY_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource: the MobileImagingUnit's calendar date; semantics: discrete whole-day
          capacity of one — a second site day on the same service_date conflicts even with
          completely disjoint HH:MM windows (evening 18:00-20:00 vs morning 08:30-16:00).
          Distinct interval semantics (aggregate day-slot, not continuous overlap) and distinct
          resource entity from the appointment-window rule.
        test_recipe:
