          - entities.Easement.fields.pending_amendment_count
          - endpoints[POST /monitoring-visits/{id}/completion]
        distinguishing_aspect: |
          Five-level chain whose terminal effect runs UPWARD then SIDEWAYS into a different
          child aggregate: (1) MonitoringVisit SCHEDULED -> COMPLETED with finding
          CONFIRMED_VIOLATION, (2) a Violation row is auto-created OPEN with excess_sqft 2,608
          and severity MAJOR, (3) the parent Easement's compliance_status becomes
          VIOLATION_OPEN with stewardship_hold true and open_violation_count 1, (4) that hold
          forces the sibling Amendment UNDER_REVIEW -> SUSPENDED, (5) the Easement's
          pending_amendment_count is re-derived 1 -> 0. Unlike the funding cascade above, the
          propagation is triggered by a measurement (observed_impervious_sqft) rather than a
          state change, and level 4 is a CONDITIONAL cascade that fires only because the
          amendment is in a non-terminal review state.
