      - name: money_conserved_capture_then_refund
        grounds:
          - state_machines.Payment.CAPTURED_to_REFUNDED
          - calculations.project_ledger
          - entities.Project.fields.balance_due_cents
        distinguishing_aspect: |
          Capturing a deposit (balance_due 340000 -> 170000) then refunding it restores
          Project.balance_due_cents to 340000 and amount_paid_cents to 0; the conserved quantity
          is MONEY, distinct from slab area.
        test_recipe:
          setup:
            - "PREMIUM project, ACTIVE quote quote_total 340000 (no template so basis=quoted), DEPOSIT 170000 CAPTURED (amount_paid 170000, balance_due 170000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Sue", address: "18 Rock Rd", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/refund"
              payload: {}
              as: SalesRep
          assert:
            - "Payment.${pay_id}.status == REFUNDED"
            - "Project.${p_id}.amount_paid_cents == 0"
            - "Project.${p_id}.balance_due_cents == 340000"
            - "Project.${p_id}.payment_status == UNPAID"
