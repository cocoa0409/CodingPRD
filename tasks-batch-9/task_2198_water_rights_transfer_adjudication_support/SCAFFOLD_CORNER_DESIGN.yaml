        grounds:
          - state_machines.ApprovalCondition.status
          - state_machines.ApprovalCondition.payment_status
          - validations[priority=21]
          - calculations.mitigation_fee
          - errors[ERR_CONDITION_FEE_OUTSTANDING]
        distinguishing_aspect: >-
          The two dimensions of one row advance on separate axes and interlock in
          one direction only: paying leaves status IMPOSED, sign-off before
          payment is ERR_CONDITION_FEE_OUTSTANDING, and only after PAID does
          /satisfy succeed. The payment also runs the depth-4 fee cascade that
          restores the claimant's standing and lifts the bank posture.
        test_recipe:
          setup:
            - "CERTIFIED right for claimant A (transferable_af 195.00) with an OPEN bank account; application for 100.00 AF with a SEASONAL_AVERAGE analysis leaving net_injury_af 20.00 (gross 78.00 - return-flow credit 58.00); approved with one MITIGATION_PAYMENT condition of required_af 20.00, priced 2500.00 + 4.0% = 2600.00, which drives claimant A DELINQUENT and the account RESTRICTED."
