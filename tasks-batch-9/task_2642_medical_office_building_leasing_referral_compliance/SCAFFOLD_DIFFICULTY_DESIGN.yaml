              as: LeasingAgent
              captures: { l15_id: $.data.id }
            - call: "POST /leases/${l15_id}/ti-projects"
              payload: { suite_id: "${s15_id}", target_suite_class: "IMAGING", lead_thickness_mm: 2.5, power_amps_requested: 150, medical_gas_requested: false, authorized_allowance_total: 500000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { tp15_id: $.data.id, tp15_v1: $.data.version }
            - call: "POST /ti-projects/${tp15_id}/line-items"
              payload: { expected_ti_project_version: "${tp15_v1}", description: "Lead shielding, walls and ceiling", category: "SHIELDING", cost_amount: 88000.00 }
              as: LeasingAgent
            - call: "POST /ti-projects/${tp15_id}/transitions"
              payload: { action: "SUBMIT_REVIEWS", note: "Packages issued" }
              as: LeasingAgent
            - call: "POST /ti-projects/${tp15_id}/reviews"
              payload: { review_type: "SHIELDING", decision: "APPROVE", lead_thickness_verified_mm: 2.5, review_note: "Physicist sign-off" }
              as: FacilitiesEngineer
            - call: "POST /ti-projects/${tp15_id}/reviews"
              payload: { review_type: "UTILITY", decision: "APPROVE", review_note: "Feeder capacity confirmed" }
              as: FacilitiesEngineer
          trigger:
            - call: "POST /ti-projects/${tp15_id}/transitions"
              payload: { action: "START_CONSTRUCTION", note: "Attempt while the lease is DRAFT" }
              as: LeasingAgent
            - call: "POST /leases/${l15_id}/submit-fmv-review"
              payload: { submission_note: "Corporate practice" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${l15_id}/certify-fmv"
