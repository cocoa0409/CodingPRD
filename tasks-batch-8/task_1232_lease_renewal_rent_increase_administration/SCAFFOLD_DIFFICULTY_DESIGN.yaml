              payload: { full_name: "Eli Fontaine", email: "eli.fontaine@x.com" }
              as: PlatformAdmin
              captures: { res: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer: "$.data.id" }
            - call: "POST /renewal-offers/${offer}/issue"
              payload: {}
              as: LeasingAgent
            - call: "POST /renewal-offers/${offer}/respond"
              payload: { response_type: "ACCEPT" }
              as: Resident
              as_user_id: "${res}"
            - call: "GET /renewal-documents"
              payload: { offer_id: "${offer}" }
              as: PropertyManager
              captures: { doc: "$.data[0].id" }
            - call: "POST /renewal-documents/${doc}/sign-resident"
              payload: {}
              as: Resident
              as_user_id: "${res}"
            - call: "POST /renewal-documents/${doc}/countersign"
              payload: {}
              as: PropertyManager
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { rent_mid: "$.data.monthly_rent_cents", end_mid: "$.data.term_end_date", status_mid: "$.data.status" }
          trigger:
            - call: "POST /renewal-documents/${doc}/rescind"
              payload: {}
              as: Resident
              as_user_id: "${res}"
              captures: { d_status: "$.data.status" }
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { rent_end: "$.data.monthly_rent_cents", start_end: "$.data.term_start_date", months_end: "$.data.term_months", end_end: "$.data.term_end_date", status_end: "$.data.status" }
            - call: "GET /renewal-offers/${offer}"
              as: PropertyManager
              captures: { o_status: "$.data.status" }
          assert:
            - "forward action applied: rent_mid == 203000, end_mid == 2028-06-01, status_mid == ACTIVE"
            - "compensating action conserves economics exactly: rent_end == 200000, start_end == 2026-06-01, months_end == 12, end_end == 2027-06-01, status_end == ACTIVE"
            - "d_status == RESCINDED and o_status == VOIDED"

      - name: notice_serve_then_rescind_restores_mtm_status
        grounds:
          - state_machines.NonRenewalNotice.SERVED_to_RESCINDED
          - state_machines.Lease.NON_RENEWAL_NOTICED_to_MTM
