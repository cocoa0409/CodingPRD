            - { call: "POST /assignments", payload: { mariner_id: "${m2_id}", manning_slot_id: "${s_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-11-08T00:00:00Z", planned_relief_date: "2027-02-08T00:00:00Z", local_join: true, relief_of_assignment_id: "${a1_id}" }, as: CrewingManager, captures: { a2_id: $.data.id } }
