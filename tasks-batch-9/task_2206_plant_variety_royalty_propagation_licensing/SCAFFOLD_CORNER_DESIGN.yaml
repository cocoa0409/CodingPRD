      - name: propagator_cannot_issue_or_void_its_own_tag_orders
        claim_type: role_operations
        grounds:
          - roles.Propagator
          - roles.LicensingOfficer.exclusive_operations
          - validations[priority=2]
        distinguishing_aspect: "The tag programme's integrity rests on the propagator requesting and reconciling but never authorizing: POST /tag-orders and reconcile are Propagator-exclusive, while issue and void are LicensingOfficer-exclusive, so the propagator that legitimately created the order still gets 403 when it tries to issue it."
