      - name: val_region_not_approved_on_checkout
        claim_type: violation_to_error
        grounds: ["validations[priority=7.1]", "errors[ERR_REGION_NOT_APPROVED]"]
        distinguishing_aspect: "Variety approved only for ZONE_9A borrowed by a member whose home site is ZONE_5A yields ERR_REGION_NOT_APPROVED (422) — regional appropriateness is a separate check from the invasive flag."
        test_recipe:
          setup: ["site S zone ZONE_5A; variety V approved_zones [ZONE_9A] non-invasive; ACTIVE lot with 1 packet; member M home S"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 5 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_9A"], invasive_flag: false }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "RG1", harvest_year: 2026, seeds_received: 50, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 1, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id" }
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_REGION_NOT_APPROVED"

      - name: val_duplicate_intake_item_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8.1]", "errors[ERR_DUPLICATE_INTAKE_ITEM]"]
        distinguishing_aspect: "Second intake item with identical (event, member, variety, item_type) while the first is still SUBMITTED yields ERR_DUPLICATE_INTAKE_ITEM."
        test_recipe:
          setup: ["event E INTAKE_OPEN; member M; variety V approved non-invasive"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "FLOWER", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-11-14T10:00:00Z", end_at: "2026-11-14T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
