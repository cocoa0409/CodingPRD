              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}" }
              as: PracticeAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
              captures: { sess_v: $.data.version }
          trigger:
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_id}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T13:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v}" }
              as: ReferralCoordinator
              captures: { bk_id: $.data.id, bst: $.data.status, planned: $.data.planned_classification }
          assert:
            - "${asa} == 4 and ${scr} == OFFICE_VISIT_REQUIRED and ${rst} == ACCEPTED_OFFICE_VISIT"
            - "${org} == REFERRAL"
            - "HTTP 201 with ${bst} == BOOKED and ${planned} == SCREENING_PREVENTIVE"
            - "ScreeningEpisode.${ep_id}.clinical_status == PROCEDURE_SCHEDULED"
            - "EndoscopySession.${sess_id}.booked_minutes == 60"
      - name: screening_start_age_boundary_corner
        claim_type: violation_to_error
        grounds:
          - validations.priority_25
          - calculations.screening_eligibility.constants
        excluded_because:
          difficulty_instance: age_exactly_forty_five_is_eligible_and_forty_four_is_not
          rationale: "Both sides of the SCREENING_START_AGE_YEARS boundary and the ERR_EPISODE_NOT_ELIGIBLE that the ineligible episode raises at booking create are asserted in that depth instance."
      - name: asa_four_preprocedure_block_corner
        claim_type: violation_to_error
        grounds:
          - validations.priority_20
          - errors.ERR_PREPROCEDURE_RISK_UNCLEARED
        excluded_because:
          difficulty_instance: asa_four_patient_on_overlapping_slot_returns_risk_uncleared
          rationale: "That depth instance already triggers ERR_PREPROCEDURE_RISK_UNCLEARED and additionally proves it outranks the slot-geometry rules, so the plain violation claim is subsumed."
      - name: mac_coverage_required_at_start_corner
        claim_type: violation_to_error
        grounds:
          - validations.priority_22
          - errors.ERR_ANESTHESIA_COVERAGE_REQUIRED
        excluded_because:
          difficulty_instance: procedure_start_requires_coverage_confirmed_session
          rationale: "The MAC gate is exercised in both directions in that depth instance - refused while the block is merely PUBLISHED and accepted once a fully covering ACTIVE coverage promotes it to COVERAGE_CONFIRMED."
      - name: buffered_occupancy_overlap_corner
        claim_type: violation_to_error
        grounds:
          - validations.priority_28
          - calculations.room_slot_feasibility
        excluded_because:
          difficulty_instance: room_occupancy_includes_turnover_buffer
          rationale: "The instructive case is a slot that clears the previous slot_end_utc but not its occupancy_end_utc, which that depth instance already builds minute by minute together with the adjacent-slot acceptance."
      - name: anesthesia_overlap_ceiling_corner
        claim_type: violation_to_error
        grounds:
          - validations.priority_29
          - calculations.anesthesia_overlap_load
        excluded_because:
          difficulty_instance: anesthesia_aggregate_ceiling_and_adjacency
          rationale: "The aggregate ceiling only becomes visible with three coverage intervals of which two overlap at a shared instant, which is exactly the fixture that depth instance builds."
      - name: recommendation_report_pairing_corner
        claim_type: priority_ordering
        grounds:
          - validations.priority_26
          - validations.priority_8
        excluded_because:
          difficulty_instance: recommendation_requires_finalized_report_pair
          rationale: "The interaction between the episode-state gate and the report-pairing gate on the same endpoint is resolved in that depth instance; the breadth surface keeps only the single-rule status case."

  - section: endpoints
    instances:
      - name: anesthesia_coverage_create_read_list_and_release
        claim_type: standard_crud
        grounds:
          - endpoints.POST_endoscopy_sessions_session_id_anesthesia_coverage
          - endpoints.GET_anesthesia_coverage_coverage_id
          - endpoints.GET_anesthesia_coverage
          - endpoints.DELETE_anesthesia_coverage_coverage_id
        distinguishing_aspect: "The four coverage endpoints are exercised on one row and each declared side effect is checked: create computes covers_full_window and overlap_index and promotes the block to COVERAGE_CONFIRMED, the release flips status to RELEASED and demotes the block back to PUBLISHED, and both writes bump EndoscopySession.version while the coverage row itself survives the release."
        test_recipe:
          setup:
            - "One ANESTHESIA clinician with max_overlapping_rooms 1 and one PUBLISHED MAC session spanning 13:00Z-21:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST" }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "2000000001", full_name: "Dr Bo Reyes", clinician_type: "ANESTHESIA", max_overlapping_rooms: 1 }
              as: PracticeAdmin
              captures: { anes_id: $.data.id }
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MAC" }
              as: PracticeAdmin
              captures: { sess_id: $.data.id, cap: $.data.capacity_minutes }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
              captures: { sess_v: $.data.version, s_rem: $.data.remaining_minutes }
          trigger:
            - call: "POST /endoscopy-sessions/${sess_id}/anesthesia-coverage"
              payload: { anesthesia_clinician_id: "${anes_id}", coverage_start_utc: "2026-09-15T12:30:00Z", coverage_end_utc: "2026-09-15T21:30:00Z" }
              as: PracticeAdmin
              captures: { cov_id: $.data.id, full: $.data.covers_full_window, oi: $.data.overlap_index, cst: $.data.status }
            - call: "GET /anesthesia-coverage/${cov_id}"
              payload: {}
              as: Endoscopist
              as_user_id: "${endo_id}"
              captures: { g_sess: $.data.session_id, g_start: $.data.coverage_start_utc, g_full: $.data.covers_full_window }
            - call: "GET /endoscopy-sessions/${sess_id}"
              payload: {}
              as: PracticeAdmin
              captures: { s1: $.data.status, v1: $.data.version }
            - call: "GET /anesthesia-coverage"
              payload: { session_id: "${sess_id}", status: "ACTIVE" }
              as: PracticeAdmin
              captures: { tc: $.meta.total_count, hm: $.meta.has_more, first_id: "$.data[0].id" }
            - call: "DELETE /anesthesia-coverage/${cov_id}"
              payload: {}
              as: PracticeAdmin
              captures: { d_st: $.data.status }
            - call: "GET /endoscopy-sessions/${sess_id}"
              payload: {}
              as: PracticeAdmin
              captures: { s2: $.data.status, v2: $.data.version }
          assert:
            - "${cap} == 480 and ${s_rem} == 480"
            - "create returns HTTP 201 with ${full} == true, ${oi} == 1 and ${cst} == ACTIVE"
            - "${g_sess} == ${sess_id}, ${g_start} == 2026-09-15T12:30:00.000Z and ${g_full} == true"
            - "${s1} == COVERAGE_CONFIRMED and ${v1} == ${sess_v} + 1"
            - "${tc} == 1, ${hm} == false and ${first_id} == ${cov_id}"
            - "${d_st} == RELEASED and GET /anesthesia-coverage/${cov_id} still returns the row"
            - "${s2} == PUBLISHED and ${v2} == ${sess_v} + 2"
            - "GET /anesthesia-coverage with status ACTIVE now reports total_count 0"
      - name: clock_endpoint_reanchors_index_date_and_due_date
        claim_type: action_endpoint
        grounds:
          - endpoints.POST__clock_set_current_utc
          - calculations.episode_due_date
          - entities.ScreeningEpisode.fields.index_date
        distinguishing_aspect: "Two episodes for two patients are created with the same payload shape on either side of one clock write, so index_date and due_date are proven to read the logical clock rather than wall time: 2026-08-01 yields 2027-01-28 and 2026-12-25 yields 2027-06-23, both 180 days out."
        test_recipe:
          setup:
            - "Untouched default logical clock at 2026-08-01T00:00:00Z, one plan, two patients"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
