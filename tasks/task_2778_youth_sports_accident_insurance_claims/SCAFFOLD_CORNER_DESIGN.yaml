      - name: verification_decision_one_day_past_the_thirty_day_window_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_VERIFICATION_WINDOW_EXPIRED
          - validations.priority_22_verification_window_expired
          - global_constants.VERIFICATION_WINDOW_DAYS
        distinguishing_aspect: "The verification window is measured from the report's own created_at, not from the injury date and not from the filing window: a report filed on 2026-07-12 can no longer be verified on 2026-08-12 (31 whole days), while a fresh report filed at that same later clock verifies immediately even though its injury is 32 days old. That contrast rules out a server that reuses the 90-day filing clock here."
        test_recipe:
          setup:
            - "One league, one BASEBALL_U12 classification and one ACTIVE policy with 404 participants and one ENROLLED athlete."
            - "One SANCTIONED game on 2026-07-11 with the clock at 2026-07-12 when report R1 is filed."
            - "The clock is then advanced to 2026-08-12, exactly 31 whole days after R1 was created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ProgramAdministrator
