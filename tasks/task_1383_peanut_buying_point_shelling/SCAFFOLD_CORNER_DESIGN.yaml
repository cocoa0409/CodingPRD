        test_recipe:
          setup: ["BP with WH-G capacity 400 (free 400 => RESTRICTED); schedule ACTIVE; grower G1; loads A and B REPORTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
