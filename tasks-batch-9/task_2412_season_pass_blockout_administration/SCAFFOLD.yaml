# =============================================================================
# Season Pass & Blockout Administration — benchmark seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2412. Season Pass & Blockout Administration (regional theme park season pass program): pass tier
  design with park access, blockout calendars, parking and discount benefits, payment plan enrollment
  with monthly billing, default handling and pass suspension, pass processing with photo capture,
  identity binding and transfer prohibition enforcement, blockout date assignment by tier with
  capacity-driven adjustments and reservation requirements on peak days, upgrade path pricing with
  credit for amounts already paid, renewal campaigns with early-bird pricing and retention offers,
  pass sharing detection and revocation, visitation frequency, in-park spend per visit and pass base
  revenue analysis

domain_name: season-pass-blockout
api_prefix: ""          # flat top-level collections: /pass-programs, /pass-tiers, /park-days, /season-passes, ...

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # graph: BlockoutAssignment is a (PassTier x ParkDay) junction, Reservation and Visit are
  # (SeasonPass x ParkDay) junctions, and SeasonPass.renewed_from_pass_id is self-referential.

  state_machine_shape: parallel
  # SeasonPass carries two independent dimensions (pass_status x billing_status); SharingCase is
  # cyclic (SUBSTANTIATED -> APPEAL_PENDING -> UNDER_REVIEW) with a branching decide fork;
  # ParkDay.day_class cycles in both directions off forecast updates.

  relationship_patterns:
    - one_to_many          # PassProgram -> PassTier / ParkDay / SeasonPass; PaymentPlan -> Installment
    - many_to_many         # BlockoutAssignment (PassTier x ParkDay), Reservation / Visit (SeasonPass x ParkDay)
    - self_referential     # SeasonPass.renewed_from_pass_id -> SeasonPass.id
    - cross_aggregate      # UpgradeOrder reaches across SeasonPass, PassTier and PaymentPlan aggregates

  role_model: segregation_of_duties
  # A SharingCase may only be opened by a GateAgent and may only be decided by a ComplianceOfficer
  # whose X-User-ID differs from the opener's; an UpgradeOrder is quoted/applied by PassOfficeClerk
  # but may only be reversed by ComplianceOfficer.

  consistency_model: immediate

  difficulty_level: beyond_expert
  entity_count: 12
  state_machine_count: 12   # 12 machines over 11 entities: SeasonPass carries two parallel dimensions
  calculation_count: 8
  endpoint_count: 54   # 53 business endpoints + 1 `/_clock` test-driving endpoint
  error_code_count: 59
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PassProgram
    parent: null
    common_fields: true
    fields:
      - { name: season_year, type: integer, source: input, description: "Season year this program sells passes for" }
      - { name: park_name, type: string, source: input, description: "Park operating the program" }
      - { name: status, type: enum, source: system, default: DESIGN, description: "DESIGN | SALES_OPEN | SEASON_ACTIVE | RENEWAL_OPEN | CLOSED", constraints: "advanced only through POST /pass-programs/{program_id}/advance-status" }
      - { name: early_bird_deadline, type: string, source: input, description: "ISO date (YYYY-MM-DD); renewal quotes priced on or before this date get the early-bird discount (inclusive)" }
      - { name: capacity_peak_threshold_pct, type: number, source: input, default: 0.85, description: "ParkDay.forecast_utilization_pct at or above this value classifies the day PEAK", constraints: "0.50 <= v < capacity_lock_threshold_pct" }
      - { name: capacity_lock_threshold_pct, type: number, source: input, default: 0.97, description: "ParkDay.forecast_utilization_pct at or above this value classifies the day CAPACITY_LOCKED", constraints: "capacity_peak_threshold_pct < v <= 1.20" }
      - { name: capacity_lock_blockout_max_rank, type: integer, source: input, default: 2, description: "On CAPACITY_LOCKED, every PUBLISHED tier with tier_rank <= this value receives a CAPACITY_ADJUSTED blockout" }
      - { name: delinquency_suspension_threshold, type: integer, source: input, default: 2, description: "PaymentPlan.missed_count at or above this value suspends the pass", constraints: "1 <= v < default_threshold" }
      - { name: default_threshold, type: integer, source: input, default: 3, description: "PaymentPlan.missed_count at or above this value defaults the pass", constraints: "2 <= v <= 12" }
      - { name: sharing_case_auto_open_score, type: integer, source: input, default: 65, description: "Passholder.sharing_risk_score at or above this value auto-opens a SharingCase on gate entry" }
      - { name: base_revenue_cents, type: integer, source: computed, description: "See calculations.program_revenue_analysis — sum of contract_value_cents over non-REVOKED passes of this program" }
      - { name: recognized_revenue_cents, type: integer, source: computed, description: "See calculations.program_revenue_analysis — sum of paid_to_date_cents over the same pass set" }
      - { name: deferred_revenue_cents, type: integer, source: computed, description: "See calculations.program_revenue_analysis — sum of outstanding_balance_cents over the same pass set" }
      - { name: forfeited_revenue_cents, type: integer, source: computed, description: "See calculations.program_revenue_analysis — sum of paid_to_date_cents over passes whose pass_status == REVOKED" }
      - { name: active_pass_count, type: integer, source: computed, description: "Count of this program's SeasonPass rows with pass_status == ACTIVE" }

  - name: PassTier
    parent: PassProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> PassProgram.id; owning season pass program" }
      - { name: name, type: string, source: input, description: "Tier label (e.g. BRONZE, GOLD)", constraints: "unique within program_id" }
      - { name: tier_rank, type: integer, source: input, description: "Access breadth rank; higher rank = broader park access", constraints: "1 <= v <= 9, unique within program_id" }
      - { name: base_price_cents, type: integer, source: input, description: "List price of the tier for the season", constraints: "v >= 1000; strictly increasing with tier_rank is NOT enforced" }
      - { name: parking_benefit, type: enum, source: input, description: "NONE | DISCOUNT | INCLUDED — parking entitlement of the tier" }
      - { name: in_park_discount_pct, type: number, source: input, description: "Merchandise/food discount applied to Visit spend", constraints: "0 <= v <= 0.30, two decimals" }
      - { name: reservation_required_on_peak, type: boolean, source: input, description: "When true, gate entry on a PEAK or CAPACITY_LOCKED ParkDay requires a CONFIRMED Reservation" }
      - { name: peak_reservation_quota, type: integer, source: input, description: "Max CONFIRMED Reservations a pass on this tier may hold for park days on or after the logical clock date", constraints: "1 <= v <= 20" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | RETIRED" }

  - name: ParkDay
    parent: PassProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> PassProgram.id; owning season pass program" }
      - { name: calendar_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the operating day", constraints: "unique within program_id" }
      - { name: capacity_total, type: integer, source: input, description: "Gate capacity of the day", constraints: "v >= 1" }
      - { name: forecast_attendance, type: integer, source: input, description: "Latest forecast attendance for the day", constraints: "v >= 0" }
      - { name: forecast_utilization_pct, type: number, source: computed, description: "See calculations.park_day_capacity_posture — forecast_attendance / capacity_total, round_half_up to 4 decimals" }
      - { name: day_class, type: enum, source: computed, description: "STANDARD | PEAK | CAPACITY_LOCKED — see calculations.park_day_capacity_posture" }
      - { name: reservation_slot_capacity, type: integer, source: computed, description: "Day-level reservable slots — see calculations.park_day_capacity_posture" }
      - { name: window_slot_capacity, type: integer, source: computed, description: "Per-overlapping-window reservable slots — see calculations.park_day_capacity_posture" }
      - { name: reserved_count, type: integer, source: computed, description: "Count of this day's Reservation rows with status == CONFIRMED" }
      - { name: remaining_slot_count, type: integer, source: computed, description: "reservation_slot_capacity - reserved_count, floored at 0" }
      - { name: released_count, type: integer, source: computed, description: "Count of this day's Reservation rows with status IN {CANCELLED_BY_HOLDER, CANCELLED_BY_SUSPENSION, CANCELLED_BY_BLOCKOUT}" }
      - { name: redeemed_count, type: integer, source: computed, description: "Count of this day's Reservation rows with status == REDEEMED" }
      - { name: no_show_count, type: integer, source: computed, description: "Count of this day's Reservation rows with status == NO_SHOW" }
      - { name: grant_count, type: integer, source: system, default: 0, description: "Monotonic counter incremented by 1 on every Reservation successfully created for this day; never decremented" }

  - name: BlockoutAssignment
    parent: null
    common_fields: true
    fields:
      - { name: tier_id, type: string, source: input, description: "FK -> PassTier.id; the blocked tier" }
      - { name: park_day_id, type: string, source: input, description: "FK -> ParkDay.id; the blocked operating day" }
      - { name: source, type: enum, source: system, description: "MANUAL | CAPACITY_ADJUSTED — MANUAL from POST /blockout-assignments, CAPACITY_ADJUSTED from the ParkDay CAPACITY_LOCKED cascade" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | LIFTED" }
      - { name: lift_reason, type: string, source: system, description: "Reason recorded when the assignment moved to LIFTED; null while ACTIVE" }

  - name: Passholder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name printed on the pass" }
      - { name: email, type: string, source: input, description: "Contact email", constraints: "globally unique" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date (YYYY-MM-DD)" }
      - { name: sharing_risk_score, type: integer, source: computed, description: "See calculations.pass_sharing_risk_score variant GATE_CLUSTER; recomputed on every gate entry across all passes of this holder" }
      - { name: photo_mismatch_count, type: integer, source: computed, description: "Count of Visit rows with photo_match == MISMATCH over all SeasonPass rows of this holder" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | BANNED — BANNED once a second SharingCase against any pass of this holder reaches SUBSTANTIATED" }

  - name: SeasonPass
    parent: PassProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> PassProgram.id; program the pass is sold under" }
      - { name: tier_id, type: string, source: input, description: "FK -> PassTier.id; current tier, mutated by upgrade apply/reverse" }
      - { name: passholder_id, type: string, source: input, description: "FK -> Passholder.id; bound holder, immutable after creation (transfer prohibited)" }
      - { name: renewed_from_pass_id, type: string, source: system, description: "FK -> SeasonPass.id; prior-season pass this one was renewed from; null for new sales" }
      - { name: media_number, type: string, source: system, description: "Sequential card number SP-000001, SP-000002, ... minted in creation order (created_at ASC)" }
      - { name: payment_mode, type: enum, source: input, description: "PAY_IN_FULL | PAYMENT_PLAN" }
      - { name: pass_status, type: enum, source: system, default: PENDING_PROCESSING, description: "PENDING_PROCESSING | ACTIVE | SUSPENDED | REVOKED | EXPIRED — park-access dimension" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | PLAN_CURRENT | DELINQUENT | DEFAULTED | PAID_IN_FULL — billing dimension, evolves independently of pass_status" }
      - { name: photo_captured, type: boolean, source: system, default: false, description: "True once POST /season-passes/{pass_id}/process stored a photo_hash" }
      - { name: photo_hash, type: string, source: system, description: "Photo digest captured at processing; null before processing" }
      - { name: identity_bound, type: boolean, source: system, default: false, description: "True once government_id_last4 was bound at processing" }
      - { name: government_id_last4, type: string, source: system, description: "Last four digits of the identity document bound at processing; null before processing" }
      - { name: contract_value_cents, type: integer, source: computed, description: "Tier list price carried by the pass: base_price_cents of tier_id at sale, replaced by the target tier's base_price_cents on upgrade apply and restored on reverse" }
      - { name: billed_total_cents, type: integer, source: computed, description: "contract_value_cents plus every PaymentPlan.setup_fee_cents charged plus every applied UpgradeOrder gross_delta_cents and admin_fee_cents" }
      - { name: paid_to_date_cents, type: integer, source: computed, description: "Down payments plus SETTLED Installment amounts plus applied UpgradeOrder payment_amount_cents; reduced on upgrade reverse" }
      - { name: credited_amount_cents, type: integer, source: computed, description: "Sum of credit_cents over APPLIED UpgradeOrder rows of this pass" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "billed_total_cents - paid_to_date_cents - credited_amount_cents" }
      - { name: visit_count, type: integer, source: computed, description: "Count of this pass's Visit rows with status IN {OPEN, CLOSED}" }
      - { name: in_park_spend_cents, type: integer, source: computed, description: "Sum of spend_cents over this pass's Visit rows with status == CLOSED" }
      - { name: suspension_count, type: integer, source: computed, description: "Number of times this pass has entered SUSPENDED" }

  - name: PaymentPlan
    parent: SeasonPass
    common_fields: true
    fields:
      - { name: season_pass_id, type: string, source: input, description: "FK -> SeasonPass.id; financed pass" }
      - { name: plan_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED | COMPLETED | TERMINATED_ON_REVOCATION" }
      - { name: down_payment_cents, type: integer, source: input, description: "Amount collected at enrollment", constraints: "see validations priority 47" }
      - { name: setup_fee_cents, type: integer, source: system, default: 1500, description: "PLAN_SETUP_FEE_CENTS charged onto the pass at enrollment" }
      - { name: financed_amount_cents, type: integer, source: computed, description: "See calculations.payment_plan_amortization" }
      - { name: installment_count, type: integer, source: input, description: "Number of monthly installments", constraints: "3 <= v <= 10" }
      - { name: first_due_date, type: string, source: input, description: "ISO date of installment 1; later installments fall on the same day-of-month of following months" }
      - { name: monthly_amount_cents, type: integer, source: computed, description: "Amount of installments 1..installment_count-1 — see calculations.payment_plan_amortization" }
      - { name: final_installment_cents, type: integer, source: computed, description: "Amount of the last installment, absorbing the rounding residual" }
      - { name: missed_count, type: integer, source: computed, description: "Count of this plan's Installment rows with status == MISSED" }
      - { name: settled_count, type: integer, source: computed, description: "Count of this plan's Installment rows with status == SETTLED" }

  - name: Installment
    parent: PaymentPlan
    common_fields: true
    fields:
      - { name: payment_plan_id, type: string, source: input, description: "FK -> PaymentPlan.id; owning plan" }
      - { name: sequence_no, type: integer, source: system, description: "1-based position in the schedule" }
      - { name: due_date, type: string, source: system, description: "ISO date derived from PaymentPlan.first_due_date + (sequence_no - 1) months" }
      - { name: amount_cents, type: integer, source: system, description: "monthly_amount_cents, or final_installment_cents for the last sequence_no" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | SETTLED | MISSED | WAIVED | VOIDED" }
      - { name: settled_at, type: datetime, source: system, description: "Logical clock instant at settlement; null otherwise" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: season_pass_id, type: string, source: input, description: "FK -> SeasonPass.id; reserving pass" }
      - { name: park_day_id, type: string, source: input, description: "FK -> ParkDay.id; reserved operating day" }
      - { name: arrival_window_start, type: string, source: input, description: "HH:MM local arrival window start (inclusive)", constraints: "08:00 <= v < arrival_window_end" }
      - { name: arrival_window_end, type: string, source: input, description: "HH:MM local arrival window end (exclusive)", constraints: "arrival_window_start < v <= 22:00" }
      - { name: status, type: enum, source: system, default: CONFIRMED, description: "CONFIRMED | REDEEMED | CANCELLED_BY_HOLDER | CANCELLED_BY_SUSPENSION | CANCELLED_BY_BLOCKOUT | NO_SHOW" }
      - { name: redeemed_visit_id, type: string, source: system, description: "FK -> Visit.id; the gate entry that redeemed this reservation; null until redeemed" }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: season_pass_id, type: string, source: input, description: "FK -> SeasonPass.id; entering pass" }
      - { name: park_day_id, type: string, source: input, description: "FK -> ParkDay.id; operating day entered" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; reservation redeemed by this entry; null when the day required none" }
      - { name: entry_at, type: datetime, source: input, description: "ISO 8601 UTC instant of the gate scan; must fall on ParkDay.calendar_date (see validations priority 71)" }
      - { name: gate_code, type: enum, source: input, description: "NORTH | SOUTH | EAST | WEST — turnstile bank used" }
      - { name: photo_match, type: enum, source: input, default: NOT_CHECKED, description: "MATCH | MISMATCH | NOT_CHECKED — turnstile photo comparison outcome" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED" }
      - { name: spend_cents, type: integer, source: system, default: 0, description: "In-park spend recorded at visit close, net of discount_applied_pct" }
      - { name: discount_applied_pct, type: number, source: computed, description: "Snapshot of the entering tier's in_park_discount_pct at entry time" }

  - name: SharingCase
    parent: null
    common_fields: true
    fields:
      - { name: season_pass_id, type: string, source: input, description: "FK -> SeasonPass.id; investigated pass" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the opening GateAgent, or the literal 'SYSTEM' for auto-opened cases" }
      - { name: opened_by_role, type: enum, source: system, description: "GATE_AGENT | SYSTEM" }
      - { name: evidence_visit_ids, type: array, source: input, description: "Visit ids cited as evidence; every element must belong to season_pass_id" }
      - { name: note, type: string, source: input, description: "Free-text observation recorded by the opener" }
      - { name: case_status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | SUBSTANTIATED | DISMISSED | APPEAL_PENDING" }
      - { name: review_round, type: integer, source: system, default: 0, description: "Incremented by 1 each time the case enters UNDER_REVIEW; caps the appeal cycle at 2" }
      - { name: risk_score_at_open, type: integer, source: computed, description: "See calculations.pass_sharing_risk_score variant ROLLING_WINDOW, evaluated at case creation" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who last decided the case; null before a decision" }
      - { name: decision_rationale, type: string, source: system, description: "Rationale of the last decision; null before a decision" }
      - { name: revocation_forfeit_cents, type: integer, source: system, description: "paid_to_date_cents forfeited when the case last reached SUBSTANTIATED; reversed on a later DISMISSED" }

  - name: UpgradeOrder
    parent: SeasonPass
    common_fields: true
    fields:
      - { name: season_pass_id, type: string, source: input, description: "FK -> SeasonPass.id; upgrading pass" }
      - { name: source_tier_id, type: string, source: system, description: "FK -> PassTier.id; tier held by the pass when the quote was produced" }
      - { name: target_tier_id, type: string, source: input, description: "FK -> PassTier.id; requested tier" }
      - { name: credit_mode, type: enum, source: input, description: "PAID_TO_DATE | PRORATED_VALUE — see calculations.upgrade_credit" }
      - { name: gross_delta_cents, type: integer, source: computed, description: "target tier base_price_cents - source tier base_price_cents" }
      - { name: raw_credit_cents, type: integer, source: computed, description: "Credit produced by credit_mode before the cap — see calculations.upgrade_credit" }
      - { name: credit_cents, type: integer, source: computed, description: "min(raw_credit_cents, gross_delta_cents) — see calculations.upgrade_settlement_total step 3" }
      - { name: net_delta_cents, type: integer, source: computed, description: "gross_delta_cents - credit_cents" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Tiered fee keyed on net_delta_cents — see calculations.upgrade_settlement_total step 5" }
      - { name: total_due_cents, type: integer, source: computed, description: "net_delta_cents + admin_fee_cents" }
      - { name: payment_amount_cents, type: integer, source: system, description: "Amount collected at apply; null while QUOTED" }
      - { name: quoted_at, type: datetime, source: system, description: "Logical clock instant of quote creation" }
      - { name: quote_expires_at, type: datetime, source: system, description: "quoted_at + 14 days; a billing run at or after this instant expires the quote" }
      - { name: status, type: enum, source: system, default: QUOTED, description: "QUOTED | APPLIED | REVERSED | EXPIRED" }
      - { name: reverse_reason, type: string, source: system, description: "Reason recorded on reverse; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PassProgram
    field: status
    initial_state: DESIGN
    terminal_states: [CLOSED]
    note: "Linear lifecycle gate; every child operation names the statuses it requires."
    transitions:
      - from: DESIGN
        to: SALES_OPEN
        trigger: "POST /pass-programs/{program_id}/advance-status with target_status=SALES_OPEN"
        actor: ProgramAdmin
        preconditions: ["at least one PassTier of this program has status == PUBLISHED"]
        side_effects: ["pass sales, payment-plan enrollment and reservations become permitted", "increments PassProgram.version by 1"]
      - from: SALES_OPEN
        to: SEASON_ACTIVE
        trigger: "POST /pass-programs/{program_id}/advance-status with target_status=SEASON_ACTIVE"
        actor: ProgramAdmin
        preconditions: ["at least one ParkDay exists for this program"]
        side_effects: ["gate entries (POST /visits) become permitted", "increments PassProgram.version by 1"]
      - from: SEASON_ACTIVE
        to: RENEWAL_OPEN
        trigger: "POST /pass-programs/{program_id}/advance-status with target_status=RENEWAL_OPEN"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["this program becomes a legal renewal TARGET for passes of other programs", "gate entries remain permitted", "increments PassProgram.version by 1"]
      - from: RENEWAL_OPEN
        to: CLOSED
        trigger: "POST /pass-programs/{program_id}/advance-status with target_status=CLOSED"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "every SeasonPass of this program with pass_status IN {PENDING_PROCESSING, ACTIVE, SUSPENDED} becomes EXPIRED"
          - "CASCADE — because those passes became EXPIRED, each pass's Reservation rows with status == CONFIRMED become NO_SHOW and their ParkDay.no_show_count / reserved_count / remaining_slot_count are recomputed"
          - "PassProgram.active_pass_count, base_revenue_cents, recognized_revenue_cents, deferred_revenue_cents recomputed"
          - "increments PassProgram.version by 1"
      - from: SEASON_ACTIVE
        to: CLOSED
        trigger: "POST /pass-programs/{program_id}/advance-status with target_status=CLOSED"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["identical to RENEWAL_OPEN -> CLOSED", "increments PassProgram.version by 1"]
        note: "The only permitted skip in the lifecycle; DESIGN and SALES_OPEN cannot jump to CLOSED."

  - entity: PassTier
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /pass-tiers/{tier_id}/status with target_status=PUBLISHED"
        actor: ProgramAdmin
        preconditions: ["PassProgram.status IN {DESIGN, SALES_OPEN}"]
        side_effects: ["tier becomes sellable and a legal upgrade/renewal target", "increments PassTier.version by 1"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /pass-tiers/{tier_id}/status with target_status=RETIRED"
        actor: ProgramAdmin
        preconditions: ["no SeasonPass of this program has tier_id == this tier and pass_status IN {PENDING_PROCESSING, ACTIVE, SUSPENDED}"]
        side_effects: ["tier stops being sellable", "increments PassTier.version by 1"]

  - entity: ParkDay
    field: day_class
    initial_state: STANDARD
    terminal_states: []
    note: "Cyclic and fully derived: every POST /park-days/{park_day_id}/forecast re-derives day_class from calculations.park_day_capacity_posture, so the day can move in either direction any number of times."
    transitions:
      - from: STANDARD
        to: PEAK
        trigger: "POST /park-days/{park_day_id}/forecast (forecast_utilization_pct >= program.capacity_peak_threshold_pct and < capacity_lock_threshold_pct)"
        actor: ProgramAdmin
        preconditions: ["PassProgram.status IN {DESIGN, SALES_OPEN, SEASON_ACTIVE, RENEWAL_OPEN}"]
        side_effects:
          - "reservation_slot_capacity, window_slot_capacity, remaining_slot_count recomputed"
          - "gate entry for tiers with reservation_required_on_peak == true now demands a CONFIRMED Reservation"
          - "increments ParkDay.version by 1"
      - from: PEAK
        to: CAPACITY_LOCKED
        trigger: "POST /park-days/{park_day_id}/forecast (forecast_utilization_pct >= program.capacity_lock_threshold_pct)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "CASCADE L1 — for every PassTier of the program with status == PUBLISHED and tier_rank <= program.capacity_lock_blockout_max_rank that has no ACTIVE BlockoutAssignment on this day, a BlockoutAssignment with source == CAPACITY_ADJUSTED and status == ACTIVE is created (processed in tier_rank ASC, created_at ASC order)"
          - "CASCADE L2 — because those blockouts became ACTIVE, every Reservation on this day whose pass tier is now blocked and whose status == CONFIRMED becomes CANCELLED_BY_BLOCKOUT"
          - "CASCADE L3 — because those reservations were released, ParkDay.reserved_count, released_count and remaining_slot_count are recomputed"
          - "new reservations on this day are refused with ERR_PARK_DAY_CAPACITY_LOCKED"
          - "increments ParkDay.version by 1"
      - from: CAPACITY_LOCKED
        to: PEAK
        trigger: "POST /park-days/{park_day_id}/forecast (utilization falls back below capacity_lock_threshold_pct but stays >= capacity_peak_threshold_pct)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "every BlockoutAssignment on this day with source == CAPACITY_ADJUSTED and status == ACTIVE becomes LIFTED with lift_reason == 'CAPACITY_RELEASED' (MANUAL assignments are untouched)"
          - "reservation_slot_capacity, window_slot_capacity, remaining_slot_count recomputed"
          - "increments ParkDay.version by 1"
      - from: PEAK
        to: STANDARD
        trigger: "POST /park-days/{park_day_id}/forecast (utilization falls below capacity_peak_threshold_pct)"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["reservation requirement on this day disappears", "reservation_slot_capacity, window_slot_capacity, remaining_slot_count recomputed", "increments ParkDay.version by 1"]
      - from: STANDARD
        to: CAPACITY_LOCKED
        trigger: "POST /park-days/{park_day_id}/forecast (utilization jumps straight to >= capacity_lock_threshold_pct)"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["identical cascade to PEAK -> CAPACITY_LOCKED", "increments ParkDay.version by 1"]
      - from: CAPACITY_LOCKED
        to: STANDARD
        trigger: "POST /park-days/{park_day_id}/forecast (utilization falls below capacity_peak_threshold_pct)"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["identical CAPACITY_ADJUSTED lift to CAPACITY_LOCKED -> PEAK", "increments ParkDay.version by 1"]

  - entity: BlockoutAssignment
    field: status
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /blockout-assignments/{assignment_id}/lift"
        actor: ProgramAdmin
        preconditions:
          - "BlockoutAssignment.status == ACTIVE"
          - "ParkDay(park_day_id).day_class != CAPACITY_LOCKED  (cross-entity guard)"
        side_effects: ["lift_reason := request reason", "the tier regains access to the day for new reservations and gate entries", "increments BlockoutAssignment.version by 1"]
      - from: ACTIVE
        to: LIFTED
        trigger: "system — ParkDay leaves CAPACITY_LOCKED (see ParkDay CAPACITY_LOCKED_to_PEAK / CAPACITY_LOCKED_to_STANDARD)"
        actor: system
        preconditions: ["BlockoutAssignment.source == CAPACITY_ADJUSTED"]
        side_effects: ["lift_reason := 'CAPACITY_RELEASED'", "increments BlockoutAssignment.version by 1"]
        note: "Auto-lift never touches MANUAL assignments; those survive the capacity release."

  - entity: SeasonPass
    field: pass_status
    initial_state: PENDING_PROCESSING
    terminal_states: [EXPIRED]
    note: "Park-access dimension. Evolves independently of billing_status (parallel dimensions on one row); REVOKED is NOT terminal because a dismissed appeal restores the pass."
    transitions:
      - from: PENDING_PROCESSING
        to: ACTIVE
        trigger: "POST /season-passes/{pass_id}/process"
        actor: PassOfficeClerk
        preconditions: ["SeasonPass.pass_status == PENDING_PROCESSING", "PassProgram.status IN {SALES_OPEN, SEASON_ACTIVE, RENEWAL_OPEN}"]
        side_effects: ["photo_captured := true, photo_hash stored", "identity_bound := true, government_id_last4 stored", "PassProgram.active_pass_count recomputed", "increments SeasonPass.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — POST /pass-programs/{program_id}/billing-runs marks installments MISSED (see Installment SCHEDULED_to_MISSED)"
        actor: system
        preconditions: ["PaymentPlan(plan_status == ACTIVE).missed_count >= PassProgram.delinquency_suspension_threshold"]
        side_effects:
          - "suspension_count += 1"
          - "CASCADE — because the pass became SUSPENDED, its Reservation rows with status == CONFIRMED become CANCELLED_BY_SUSPENSION and each affected ParkDay recomputes reserved_count / released_count / remaining_slot_count"
          - "PassProgram.active_pass_count recomputed"
          - "increments SeasonPass.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /season-passes/{pass_id}/reinstate"
        actor: PassOfficeClerk
        preconditions: ["SeasonPass.pass_status == SUSPENDED", "cure_amount_cents equals the sum of amount_cents over the plan's MISSED installments excluding waive_installment_id"]
        side_effects:
          - "each MISSED Installment of the ACTIVE plan becomes SETTLED (settled_at := logical clock); waive_installment_id, when supplied, becomes WAIVED instead"
          - "paid_to_date_cents += cure_amount_cents; outstanding_balance_cents recomputed"
          - "billing_status := PLAN_CURRENT (or PAID_IN_FULL when no SCHEDULED installment remains)"
          - "cancelled reservations are NOT restored — released slots stay released"
          - "increments SeasonPass.version by 1"
        note: "Cycle: a pass may be suspended and reinstated any number of times; suspension_count records how often."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /sharing-cases/{case_id}/decide with decision=SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions: ["SharingCase.case_status == UNDER_REVIEW", "SharingCase.season_pass_id == this pass"]
        side_effects:
          - "CASCADE L1 — pass_status := REVOKED; park access denied at every gate"
          - "CASCADE L2 — because the pass was revoked, its PaymentPlan with plan_status == ACTIVE becomes TERMINATED_ON_REVOCATION and every SCHEDULED Installment of that plan becomes VOIDED"
          - "CASCADE L3 — because the plan was terminated, PassProgram.forfeited_revenue_cents += SeasonPass.paid_to_date_cents and base_revenue_cents / recognized_revenue_cents / deferred_revenue_cents / active_pass_count are recomputed without this pass"
          - "every Reservation of the pass with status == CONFIRMED becomes CANCELLED_BY_SUSPENSION and the affected ParkDay counters are recomputed"
          - "increments SeasonPass.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /sharing-cases/{case_id}/decide with decision=SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions: ["SharingCase.case_status == UNDER_REVIEW"]
        side_effects: ["identical cascade to ACTIVE -> REVOKED", "increments SeasonPass.version by 1"]
      - from: REVOKED
        to: ACTIVE
        trigger: "POST /sharing-cases/{case_id}/decide with decision=DISMISSED on a case that had previously been SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions: ["SharingCase.case_status == UNDER_REVIEW", "SharingCase.review_round >= 2"]
        side_effects:
          - "COMPENSATION L1 — pass_status := ACTIVE"
          - "COMPENSATION L2 — because the revocation was undone, the PaymentPlan with plan_status == TERMINATED_ON_REVOCATION returns to ACTIVE and its VOIDED installments return to SCHEDULED"
          - "COMPENSATION L3 — because the plan was restored, PassProgram.forfeited_revenue_cents -= SharingCase.revocation_forfeit_cents and base/recognized/deferred revenue and active_pass_count are recomputed with this pass back in the set"
          - "increments SeasonPass.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — PassProgram advances to CLOSED"
        actor: system
        preconditions: ["PassProgram.status becomes CLOSED"]
        side_effects: ["CONFIRMED reservations become NO_SHOW; ParkDay counters recomputed", "PassProgram.active_pass_count recomputed", "increments SeasonPass.version by 1"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system — PassProgram advances to CLOSED"
        actor: system
        preconditions: ["PassProgram.status becomes CLOSED"]
        side_effects: ["identical to ACTIVE -> EXPIRED", "increments SeasonPass.version by 1"]
      - from: PENDING_PROCESSING
        to: EXPIRED
        trigger: "system — PassProgram advances to CLOSED"
        actor: system
        preconditions: ["PassProgram.status becomes CLOSED"]
        side_effects: ["pass never processed; PassProgram revenue fields recomputed", "increments SeasonPass.version by 1"]

  - entity: SeasonPass
    field: billing_status
    initial_state: UNBILLED
    terminal_states: []
    note: "Billing dimension of the same row. Moves on plan enrollment, installment settlement, billing runs and reinstatement — never on gate/access events."
    transitions:
      - from: UNBILLED
        to: PAID_IN_FULL
        trigger: "POST /season-passes with payment_mode=PAY_IN_FULL"
        actor: PassOfficeClerk
        preconditions: []
        side_effects: ["paid_to_date_cents := contract_value_cents; outstanding_balance_cents := 0"]
      - from: UNBILLED
        to: PLAN_CURRENT
        trigger: "POST /season-passes/{pass_id}/payment-plans"
        actor: PassOfficeClerk
        preconditions: ["SeasonPass.payment_mode == PAYMENT_PLAN", "SeasonPass.billing_status == UNBILLED"]
        side_effects:
          - "PaymentPlan created ACTIVE with its Installment schedule (see calculations.payment_plan_amortization)"
          - "billed_total_cents += PaymentPlan.setup_fee_cents; paid_to_date_cents += down_payment_cents; outstanding_balance_cents recomputed"
          - "increments SeasonPass.version by 1"
      - from: PLAN_CURRENT
        to: PLAN_CURRENT
        trigger: "POST /season-passes/{pass_id}/payment-plans (re-amortization: the new plan supersedes the ACTIVE one)"
        actor: PassOfficeClerk
        preconditions: ["an ACTIVE PaymentPlan exists", "expected_season_pass_version == SeasonPass.version (see concurrency_rules.plan-create-stale-pass)"]
        side_effects:
          - "the prior PaymentPlan becomes SUPERSEDED and its SCHEDULED installments become VOIDED"
          - "billed_total_cents += new PaymentPlan.setup_fee_cents; paid_to_date_cents += new down_payment_cents"
          - "increments SeasonPass.version by 1"
      - from: PLAN_CURRENT
        to: DELINQUENT
        trigger: "system — POST /pass-programs/{program_id}/billing-runs marks at least one installment MISSED"
        actor: system
        preconditions: ["PaymentPlan(plan_status == ACTIVE).missed_count >= 1"]
        side_effects: ["pass_status is NOT touched while missed_count < PassProgram.delinquency_suspension_threshold", "increments SeasonPass.version by 1"]
      - from: DELINQUENT
        to: PLAN_CURRENT
        trigger: "POST /installments/{installment_id}/settle on the last MISSED installment, or POST /season-passes/{pass_id}/reinstate"
        actor: PassOfficeClerk
        preconditions: ["after the write, the ACTIVE plan has missed_count == 0"]
        side_effects: ["paid_to_date_cents and outstanding_balance_cents recomputed", "increments SeasonPass.version by 1"]
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system — POST /pass-programs/{program_id}/billing-runs pushes missed_count to PassProgram.default_threshold"
        actor: system
        preconditions: ["PaymentPlan(plan_status == ACTIVE).missed_count >= PassProgram.default_threshold"]
        side_effects: ["pass_status is already SUSPENDED from the delinquency threshold cascade", "reinstatement still permitted once the full cure amount is paid", "increments SeasonPass.version by 1"]
      - from: DEFAULTED
        to: PLAN_CURRENT
        trigger: "POST /season-passes/{pass_id}/reinstate"
        actor: PassOfficeClerk
        preconditions: ["cure_amount_cents equals the sum of the plan's MISSED installment amounts excluding waive_installment_id"]
        side_effects: ["MISSED installments become SETTLED / WAIVED; paid_to_date_cents += cure_amount_cents", "increments SeasonPass.version by 1"]
      - from: PLAN_CURRENT
        to: PAID_IN_FULL
        trigger: "POST /installments/{installment_id}/settle on the final SCHEDULED installment"
        actor: PassOfficeClerk
        preconditions: ["after the write, the ACTIVE plan has no Installment with status IN {SCHEDULED, MISSED}"]
        side_effects: ["PaymentPlan.plan_status := COMPLETED", "outstanding_balance_cents recomputed (0 when no upgrade balance remains)", "increments SeasonPass.version by 1"]

  - entity: PaymentPlan
    field: plan_status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, COMPLETED, TERMINATED_ON_REVOCATION]
    note: "Branching: an ACTIVE plan leaves for exactly one of three outcomes, each with a different side-effect set."
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /installments/{installment_id}/settle (last outstanding installment)"
        actor: PassOfficeClerk
        preconditions: ["no Installment of this plan remains in status IN {SCHEDULED, MISSED}"]
        side_effects: ["SeasonPass.billing_status := PAID_IN_FULL", "increments PaymentPlan.version by 1"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /season-passes/{pass_id}/payment-plans (a replacement plan is created)"
        actor: PassOfficeClerk
        preconditions: ["expected_season_pass_version == SeasonPass.version"]
        side_effects: ["every Installment of this plan with status == SCHEDULED becomes VOIDED", "MISSED installments are carried over unchanged and still count toward reinstatement", "increments PaymentPlan.version by 1"]
      - from: ACTIVE
        to: TERMINATED_ON_REVOCATION
        trigger: "system — the owning SeasonPass becomes REVOKED (see SeasonPass ACTIVE_to_REVOKED)"
        actor: system
        preconditions: ["SeasonPass.pass_status becomes REVOKED"]
        side_effects: ["every SCHEDULED Installment becomes VOIDED", "PassProgram.forfeited_revenue_cents += SeasonPass.paid_to_date_cents", "increments PaymentPlan.version by 1"]
      - from: TERMINATED_ON_REVOCATION
        to: ACTIVE
        trigger: "system — a dismissed appeal restores the pass (see SeasonPass REVOKED_to_ACTIVE)"
        actor: system
        preconditions: ["SeasonPass.pass_status returns to ACTIVE"]
        side_effects: ["every VOIDED Installment of this plan returns to SCHEDULED", "PassProgram.forfeited_revenue_cents -= SharingCase.revocation_forfeit_cents", "increments PaymentPlan.version by 1"]

  - entity: Installment
    field: status
    initial_state: SCHEDULED
    terminal_states: [SETTLED, WAIVED, VOIDED]
    note: "MISSED is a revisitable state: SCHEDULED -> MISSED -> SETTLED forms the cure cycle."
    transitions:
      - from: SCHEDULED
        to: SETTLED
        trigger: "POST /installments/{installment_id}/settle"
        actor: PassOfficeClerk
        preconditions: ["Installment.status IN {SCHEDULED, MISSED}", "amount_cents in the request equals Installment.amount_cents", "SeasonPass.pass_status != REVOKED"]
        side_effects: ["settled_at := logical clock", "PaymentPlan.settled_count recomputed", "SeasonPass.paid_to_date_cents += amount_cents; outstanding_balance_cents recomputed", "PassProgram.recognized_revenue_cents / deferred_revenue_cents recomputed", "increments Installment.version by 1"]
      - from: SCHEDULED
        to: MISSED
        trigger: "system — POST /pass-programs/{program_id}/billing-runs (due_date < as_of_date)"
        actor: system
        preconditions: ["Installment.status == SCHEDULED", "Installment.due_date < as_of_date", "PaymentPlan.plan_status == ACTIVE"]
        side_effects:
          - "CASCADE L1 — PaymentPlan.missed_count recomputed (+1)"
          - "CASCADE L2 — because missed_count >= 1 the SeasonPass.billing_status becomes DELINQUENT; because missed_count >= PassProgram.delinquency_suspension_threshold the SeasonPass.pass_status ACTIVE -> SUSPENDED (suspension_count += 1); because missed_count >= PassProgram.default_threshold the billing_status becomes DEFAULTED"
          - "CASCADE L3 — because the pass became SUSPENDED, its CONFIRMED Reservation rows become CANCELLED_BY_SUSPENSION and every affected ParkDay recomputes reserved_count / released_count / remaining_slot_count"
          - "increments Installment.version by 1"
      - from: MISSED
        to: SETTLED
        trigger: "POST /installments/{installment_id}/settle or POST /season-passes/{pass_id}/reinstate"
        actor: PassOfficeClerk
        preconditions: ["Installment.status == MISSED"]
        side_effects: ["PaymentPlan.missed_count recomputed", "SeasonPass.billing_status returns to PLAN_CURRENT once missed_count == 0", "increments Installment.version by 1"]
      - from: MISSED
        to: WAIVED
        trigger: "POST /season-passes/{pass_id}/reinstate with waive_installment_id == this installment"
        actor: PassOfficeClerk
        preconditions: ["Installment.status == MISSED", "at most one installment may be waived per reinstatement"]
        side_effects: ["SeasonPass.billed_total_cents -= amount_cents; outstanding_balance_cents recomputed", "PaymentPlan.missed_count recomputed", "increments Installment.version by 1"]
      - from: SCHEDULED
        to: VOIDED
        trigger: "system — owning plan becomes SUPERSEDED or TERMINATED_ON_REVOCATION"
        actor: system
        preconditions: ["Installment.status == SCHEDULED"]
        side_effects: ["SeasonPass.outstanding_balance_cents recomputed", "increments Installment.version by 1"]
      - from: VOIDED
        to: SCHEDULED
        trigger: "system — a dismissed appeal restores a TERMINATED_ON_REVOCATION plan"
        actor: system
        preconditions: ["PaymentPlan returns to ACTIVE"]
        side_effects: ["SeasonPass.outstanding_balance_cents recomputed", "increments Installment.version by 1"]

  - entity: Reservation
    field: status
    initial_state: CONFIRMED
    terminal_states: [REDEEMED, CANCELLED_BY_HOLDER, CANCELLED_BY_SUSPENSION, CANCELLED_BY_BLOCKOUT, NO_SHOW]
    transitions:
      - from: CONFIRMED
        to: REDEEMED
        trigger: "POST /visits (gate entry whose entry time falls inside [arrival_window_start, arrival_window_end))"
        actor: GateAgent
        preconditions: ["Reservation.status == CONFIRMED", "Reservation.season_pass_id == the entering pass", "Reservation.park_day_id == the entered day"]
        side_effects: ["redeemed_visit_id := new Visit.id", "ParkDay.reserved_count / redeemed_count / remaining_slot_count recomputed", "increments Reservation.version by 1"]
      - from: CONFIRMED
        to: CANCELLED_BY_HOLDER
        trigger: "POST /reservations/{reservation_id}/cancel"
        actor: Passholder
        preconditions: ["Reservation.status == CONFIRMED"]
        side_effects: ["ParkDay.reserved_count -= 1, released_count += 1, remaining_slot_count recomputed (grant_count unchanged)", "increments Reservation.version by 1"]
      - from: CONFIRMED
        to: CANCELLED_BY_SUSPENSION
        trigger: "system — owning pass becomes SUSPENDED or REVOKED"
        actor: system
        preconditions: ["Reservation.status == CONFIRMED", "ParkDay.calendar_date >= the run's as_of_date (past days are swept to NO_SHOW instead)"]
        side_effects: ["ParkDay.reserved_count -= 1, released_count += 1, remaining_slot_count recomputed", "increments Reservation.version by 1"]
      - from: CONFIRMED
        to: CANCELLED_BY_BLOCKOUT
        trigger: "system — a CAPACITY_ADJUSTED blockout now covers this reservation's (tier, day) pair"
        actor: system
        preconditions: ["Reservation.status == CONFIRMED", "an ACTIVE BlockoutAssignment exists for (pass.tier_id, park_day_id)"]
        side_effects: ["ParkDay.reserved_count -= 1, released_count += 1, remaining_slot_count recomputed", "increments Reservation.version by 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system — POST /pass-programs/{program_id}/billing-runs sweeps reservations on days with calendar_date < as_of_date, or PassProgram advances to CLOSED"
        actor: system
        preconditions: ["Reservation.status == CONFIRMED", "ParkDay.calendar_date < as_of_date"]
        side_effects: ["ParkDay.reserved_count -= 1, no_show_count += 1, remaining_slot_count recomputed", "increments Reservation.version by 1"]

  - entity: Visit
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /visits/{visit_id}/close"
        actor: GateAgent
        preconditions: ["Visit.status == OPEN"]
        side_effects: ["spend_cents := request spend_cents", "SeasonPass.in_park_spend_cents recomputed", "PassProgram spend-per-visit analytics recomputed (see calculations.program_revenue_analysis)", "increments Visit.version by 1"]

  - entity: SharingCase
    field: case_status
    initial_state: OPEN
    terminal_states: [DISMISSED]
    note: "Cyclic + branching: UNDER_REVIEW forks to SUBSTANTIATED or DISMISSED with different side-effect sets, and SUBSTANTIATED loops back through APPEAL_PENDING to UNDER_REVIEW once."
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /sharing-cases/{case_id}/review"
        actor: ComplianceOfficer
        preconditions: ["SharingCase.case_status == OPEN"]
        side_effects: ["review_round += 1 (becomes 1)", "increments SharingCase.version by 1"]
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /sharing-cases/{case_id}/decide with decision=SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions: ["SharingCase.case_status == UNDER_REVIEW", "X-User-ID != SharingCase.opened_by_user_id (segregation of duties)"]
        side_effects:
          - "decided_by_user_id / decision_rationale recorded"
          - "revocation_forfeit_cents := SeasonPass.paid_to_date_cents at this instant"
          - "CASCADE — the SeasonPass becomes REVOKED, which terminates its ACTIVE PaymentPlan, which forfeits the paid amount onto PassProgram.forfeited_revenue_cents (see SeasonPass ACTIVE_to_REVOKED)"
          - "Passholder.status := BANNED when this is the second SUBSTANTIATED case against any pass of that holder"
          - "increments SharingCase.version by 1"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /sharing-cases/{case_id}/decide with decision=DISMISSED"
        actor: ComplianceOfficer
        preconditions: ["SharingCase.case_status == UNDER_REVIEW", "X-User-ID != SharingCase.opened_by_user_id"]
        side_effects:
          - "decided_by_user_id / decision_rationale recorded"
          - "when review_round >= 2 (i.e. the case had been SUBSTANTIATED and appealed) the SeasonPass returns from REVOKED to ACTIVE, its plan and installments are restored and PassProgram.forfeited_revenue_cents is reduced by revocation_forfeit_cents"
          - "when review_round == 1 the pass was never revoked, so only the case fields change"
          - "increments SharingCase.version by 1"
      - from: SUBSTANTIATED
        to: APPEAL_PENDING
        trigger: "POST /sharing-cases/{case_id}/appeal"
        actor: Passholder
        preconditions: ["SharingCase.case_status == SUBSTANTIATED", "SharingCase.review_round < 2 (one appeal per case)", "X-User-ID == SeasonPass.passholder_id"]
        side_effects: ["appeal statement recorded in decision_rationale", "the pass stays REVOKED during the appeal", "increments SharingCase.version by 1"]
      - from: APPEAL_PENDING
        to: UNDER_REVIEW
        trigger: "POST /sharing-cases/{case_id}/review"
        actor: ComplianceOfficer
        preconditions: ["SharingCase.case_status == APPEAL_PENDING"]
        side_effects: ["review_round += 1 (becomes 2)", "increments SharingCase.version by 1"]

  - entity: UpgradeOrder
    field: status
    initial_state: QUOTED
    terminal_states: [REVERSED, EXPIRED]
    transitions:
      - from: QUOTED
        to: APPLIED
        trigger: "POST /upgrade-orders/{upgrade_order_id}/apply"
        actor: PassOfficeClerk
        preconditions:
          - "UpgradeOrder.status == QUOTED"
          - "SeasonPass.pass_status == ACTIVE"
          - "SeasonPass.tier_id == UpgradeOrder.source_tier_id (the quote has not been overtaken by another upgrade)"
          - "payment_amount_cents == UpgradeOrder.total_due_cents"
        side_effects:
          - "SeasonPass.tier_id := target_tier_id; contract_value_cents := target tier base_price_cents"
          - "SeasonPass.billed_total_cents += gross_delta_cents + admin_fee_cents"
          - "SeasonPass.credited_amount_cents += credit_cents; paid_to_date_cents += payment_amount_cents; outstanding_balance_cents recomputed"
          - "blockout exposure is re-derived from the new tier for all future days (existing CONFIRMED reservations on days now blocked for the new tier become CANCELLED_BY_BLOCKOUT and the ParkDay counters are recomputed)"
          - "increments SeasonPass.version by 1 and UpgradeOrder.version by 1"
      - from: APPLIED
        to: REVERSED
        trigger: "POST /upgrade-orders/{upgrade_order_id}/reverse"
        actor: ComplianceOfficer
        preconditions: ["UpgradeOrder.status == APPLIED", "SeasonPass.tier_id == UpgradeOrder.target_tier_id"]
        side_effects:
          - "COMPENSATION — SeasonPass.tier_id := source_tier_id; contract_value_cents := source tier base_price_cents"
          - "SeasonPass.billed_total_cents -= (gross_delta_cents + admin_fee_cents); credited_amount_cents -= credit_cents; paid_to_date_cents -= payment_amount_cents"
          - "outstanding_balance_cents recomputed; the ledger identity billed_total == paid_to_date + credited + outstanding is preserved"
          - "reverse_reason recorded"
          - "increments SeasonPass.version by 1 and UpgradeOrder.version by 1"
      - from: QUOTED
        to: EXPIRED
        trigger: "system — POST /pass-programs/{program_id}/billing-runs where as_of_date >= date(quote_expires_at)"
        actor: system
        preconditions: ["UpgradeOrder.status == QUOTED"]
        side_effects: ["the quote can no longer be applied", "increments UpgradeOrder.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-pass
    parent_entity: SeasonPass
    write_endpoint: "POST /season-passes/{pass_id}/payment-plans"
    occ_field: "expected_season_pass_version"
    description: |
      Creating a PaymentPlan against a SeasonPass whose version has advanced since the client last
      observed it is rejected. A second plan legitimately supersedes the ACTIVE one (re-amortization
      of the remaining outstanding balance), so nothing in the state machine blocks the write; the
      stale expected_season_pass_version is the only signal that the clerk priced the new plan
      against an outstanding balance that has since changed (an installment settlement, an applied
      upgrade or a superseding plan all bump the pass version).
    error_id: ERR_STALE_PASS_VERSION
    http_status: 412

  - rule_id: blockout-create-stale-park-day
    parent_entity: ParkDay
    write_endpoint: "POST /blockout-assignments"
    occ_field: "expected_park_day_version"
    description: |
      Creating a MANUAL BlockoutAssignment against a ParkDay whose version has advanced since the
      client last observed it is rejected. A MANUAL blockout for a different tier on the same day is
      a legitimate write, so no state precondition rejects it; the stale expected_park_day_version
      catches the case where a forecast update has re-classified the day and already installed
      CAPACITY_ADJUSTED blockouts that the operator has not seen.
    error_id: ERR_STALE_PARK_DAY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: payment_plan_amortization
    applies_to: PaymentPlan
    algorithm_type: aggregation
    composition_mode: "b — multi-stage chain: the financed principal produced by stage 1 is the input to the per-installment split in stage 2, and stage 2's rounded quotient is the input to stage 3's residual"
    inputs:
      - "SeasonPass.outstanding_balance_cents at the moment the plan is created"
      - "down_payment_cents (request input)"
      - "installment_count (request input)"
      - "constants.PLAN_SETUP_FEE_CENTS"
    formula: |
      STAGE 1 — principal:
        financed_amount_cents = SeasonPass.outstanding_balance_cents
                              - down_payment_cents
                              + PLAN_SETUP_FEE_CENTS
      STAGE 2 — level payment (uses STAGE 1 output):
        monthly_amount_cents = round_half_up(financed_amount_cents / installment_count)
        Installment rows with sequence_no 1 .. installment_count-1 each carry
        amount_cents = monthly_amount_cents
      STAGE 3 — residual (uses STAGE 2 output):
        final_installment_cents = financed_amount_cents
                                - monthly_amount_cents * (installment_count - 1)
        The Installment with sequence_no == installment_count carries
        amount_cents = final_installment_cents
      DUE DATES:
        Installment(sequence_no = k).due_date = first_due_date plus (k - 1) calendar months,
        with the day-of-month clamped down to the last day of the target month.
      INVARIANT:
        sum(Installment.amount_cents) == financed_amount_cents
                                      == SeasonPass.outstanding_balance_cents immediately after
                                         the plan is created (setup fee billed, down payment paid)
    precision: "integer cents; round_half_up on the STAGE 2 quotient only — STAGE 3 absorbs the rounding residual so the schedule never drifts"
    constants:
      PLAN_SETUP_FEE_CENTS: 1500
      MIN_DOWN_PAYMENT_PCT: 0.20
      MIN_INSTALLMENT_COUNT: 3
      MAX_INSTALLMENT_COUNT: 10
    validation_hooks:
      - "installment_count outside [3, 10] -> ERR_INSTALLMENT_COUNT_OUT_OF_RANGE"
      - "down_payment_cents < round_half_up(SeasonPass.contract_value_cents * MIN_DOWN_PAYMENT_PCT) -> ERR_DOWN_PAYMENT_TOO_LOW"
    worked_example: |
      outstanding 30000, down 6000, n = 7:
        financed = 30000 - 6000 + 1500 = 25500
        monthly  = round_half_up(25500 / 7) = round_half_up(3642.857..) = 3643
        seq 1..6 = 3643 each (21858 total)
        seq 7    = 25500 - 21858 = 3642
      outstanding 12000, down 3000, n = 4:
        financed = 12000 - 3000 + 1500 = 10500 -> 4 x 2625, no residual

  - name: upgrade_credit
    applies_to: UpgradeOrder
    algorithm_type: weighted_scoring
    variants:
      - variant: PAID_TO_DATE
        selection_rule: "credit_mode == PAID_TO_DATE on POST /upgrade-orders — credits every cent the passholder has actually handed over on the source tier (down payment plus settled installments plus prior upgrade payments)"
        formula: "raw_credit_cents = SeasonPass.paid_to_date_cents"
      - variant: PRORATED_VALUE
        selection_rule: "credit_mode == PRORATED_VALUE on POST /upgrade-orders — credits the unconsumed share of the source tier's list price, measured in remaining operating days"
        formula: |
          total_days  = count(ParkDay where program_id == pass.program_id)
          future_days = count(ParkDay where program_id == pass.program_id
                              and calendar_date >= date(logical clock))
          remaining_ratio = 0.0000                              when total_days == 0
                          = round_half_up(future_days / total_days, 4)  otherwise
          raw_credit_cents = floor(source_tier.base_price_cents * remaining_ratio)
    divergence_note: |
      The two variants are independent of one another: PAID_TO_DATE rises as installments settle and
      is blind to the calendar, PRORATED_VALUE falls as the season is consumed and is blind to how
      much has been paid. On identical data they routinely differ, and either one can be the larger.
    precision: "remaining_ratio to 4 decimals (round_half_up); raw_credit_cents floored to whole cents"
    constants: {}
    worked_example: |
      Bronze (12000) -> Gold, paid_to_date 8250, 3 of 4 park days still in the future:
        PAID_TO_DATE   raw_credit = 8250
        PRORATED_VALUE remaining_ratio = 0.7500, raw_credit = floor(12000 * 0.75) = 9000

  - name: upgrade_settlement_total
    applies_to: UpgradeOrder
    algorithm_type: tiered_pricing
    composition_mode: "c — six independent adjustments applied in a pinned order; permuting steps 3 and 5 changes the answer because the admin-fee band is keyed on the POST-credit net delta, not on the gross delta"
    formula: |
      STEP 1  gross_delta_cents = target_tier.base_price_cents - source_tier.base_price_cents
              (gross_delta_cents <= 0 -> ERR_NOT_AN_UPGRADE)
      STEP 2  raw_credit_cents  = calculations.upgrade_credit for the requested credit_mode
      STEP 3  credit_cents      = min(raw_credit_cents, gross_delta_cents)      # cap: never refund
      STEP 4  net_delta_cents   = gross_delta_cents - credit_cents
      STEP 5  admin_fee_cents   = 0     when net_delta_cents <= UPGRADE_FEE_BAND_1_MAX_CENTS
                                = 1000  when net_delta_cents <= UPGRADE_FEE_BAND_2_MAX_CENTS
                                = 2500  otherwise
      STEP 6  total_due_cents   = net_delta_cents + admin_fee_cents
      quoted_at        = logical clock
      quote_expires_at = quoted_at plus UPGRADE_QUOTE_TTL_DAYS days
    precision: "integer cents throughout; no rounding is introduced after STEP 2"
    constants:
      UPGRADE_FEE_BAND_1_MAX_CENTS: 5000
      UPGRADE_FEE_BAND_2_MAX_CENTS: 20000
      UPGRADE_FEE_BAND_3_CENTS: 2500
      UPGRADE_QUOTE_TTL_DAYS: 14
    validation_hooks:
      - "payment_amount_cents != total_due_cents on apply -> ERR_UPGRADE_PAYMENT_INSUFFICIENT"
    worked_example: |
      Gold (30000) -> Platinum (55000), credit_mode PAID_TO_DATE, paid_to_date 24215:
        gross 25000 -> raw 24215 -> credit 24215 -> net 785 -> fee 0 (785 <= 5000) -> total 785
      Applying the fee band to the GROSS delta instead would have charged 2500.

  - name: pass_sharing_risk_score
    applies_to: [SeasonPass, Passholder]
    algorithm_type: weighted_scoring
    evaluated_on: "POST /visits, after the new Visit row has been recorded"
    variants:
      - variant: GATE_CLUSTER
        selection_rule: "the entered ParkDay.day_class IN {PEAK, CAPACITY_LOCKED} — on crowded days the abuse signal is one media number appearing at several gates"
        formula: |
          distinct_gates = max over calendar_date of
                           count(distinct Visit.gate_code for this pass on that date)
          mismatches     = count(Visit of this pass with photo_match == MISMATCH)
          score = GATE_CLUSTER_GATE_WEIGHT * max(0, distinct_gates - 1)
                + GATE_CLUSTER_MISMATCH_WEIGHT * mismatches
      - variant: ROLLING_WINDOW
        selection_rule: "the entered ParkDay.day_class == STANDARD — on ordinary days the abuse signal is unusual visit frequency in the trailing week"
        formula: |
          window_entries    = count(Visit of this pass with
                              entry_at >= logical_clock - ROLLING_WINDOW_DAYS days
                              and entry_at <= logical_clock)
          window_mismatches = the same set restricted to photo_match == MISMATCH
          score = ROLLING_WINDOW_FREQUENCY_WEIGHT * max(0, window_entries - ROLLING_WINDOW_FREE_ENTRIES)
                + ROLLING_WINDOW_MISMATCH_WEIGHT * window_mismatches
    outputs:
      - "Passholder.sharing_risk_score := score from the applied variant (integer, no rounding)"
      - "SharingCase auto-opened with opened_by_user_id 'SYSTEM', opened_by_role SYSTEM and risk_score_at_open := score when score >= PassProgram.sharing_case_auto_open_score and the pass has no SharingCase in status OPEN / UNDER_REVIEW / APPEAL_PENDING"
    divergence_note: "Identical visit history scores differently depending on the day_class of the day being entered; the auto-open threshold therefore fires on a PEAK day and stays silent on a STANDARD day."
    precision: "integer score; weights are integers so no rounding accumulates"
    constants:
      GATE_CLUSTER_GATE_WEIGHT: 40
      GATE_CLUSTER_MISMATCH_WEIGHT: 25
      ROLLING_WINDOW_FREQUENCY_WEIGHT: 15
      ROLLING_WINDOW_MISMATCH_WEIGHT: 35
      ROLLING_WINDOW_DAYS: 7
      ROLLING_WINDOW_FREE_ENTRIES: 3
      ANTIPASSBACK_MINUTES: 90        # closed buffer between two entries of one pass (see validations priority 62)
    worked_example: |
      Pass with 3 entries in the trailing 7 days, two of them on one calendar date through NORTH and
      SOUTH, exactly one of them photo_match == MISMATCH:
        GATE_CLUSTER  = 40 * (2 - 1) + 25 * 1 = 65   -> >= 65, SharingCase auto-opened
        ROLLING_WINDOW = 15 * max(0, 3 - 3) + 35 * 1 = 35 -> below threshold, no case

  - name: park_day_capacity_posture
    applies_to: ParkDay
    algorithm_type: threshold
    composition_mode: "a — the day_class band is selected from forecast_utilization_pct, and each band carries its own downstream reservation semantics"
    formula: |
      forecast_utilization_pct = round_half_up(forecast_attendance / capacity_total, 4)
      day_class = CAPACITY_LOCKED  when forecast_utilization_pct >= program.capacity_lock_threshold_pct
                = PEAK            when forecast_utilization_pct >= program.capacity_peak_threshold_pct
                = STANDARD        otherwise
      reservation_slot_capacity = max(0, min(
                                    floor(capacity_total * RESERVATION_SHARE_PCT),
                                    capacity_total - forecast_attendance))
      window_slot_capacity      = max(1, floor(reservation_slot_capacity / 2))
      remaining_slot_count      = reservation_slot_capacity - reserved_count
    precision: "forecast_utilization_pct to 4 decimals, round_half_up; all counts are integers and every division floors"
    constants:
      RESERVATION_SHARE_PCT: 0.10
    notes:
      - "Both thresholds are inclusive: utilization exactly equal to capacity_peak_threshold_pct is PEAK, not STANDARD."
      - "window_slot_capacity limits how many CONFIRMED reservations may hold overlapping arrival windows; reservation_slot_capacity limits the day as a whole."
    worked_example: |
      capacity_total 1000, forecast 849 -> 0.8490 -> STANDARD, slots min(100, 151) = 100
      capacity_total 1000, forecast 850 -> 0.8500 -> PEAK,     slots min(100, 150) = 100
      capacity_total 1000, forecast 975 -> 0.9750 -> CAPACITY_LOCKED
      capacity_total   40, forecast  36 -> 0.9000 -> PEAK, slots min(4, 4) = 4, window cap 2

  - name: renewal_quote
    applies_to: SeasonPass
    algorithm_type: threshold
    formula: |
      standard_price_cents = target_tier.base_price_cents
      early_bird_applied   = date(logical clock) <= program.early_bird_deadline      # inclusive
      discounted_price_cents = standard_price_cents
                               - round_half_up(standard_price_cents * EARLY_BIRD_DISCOUNT_PCT)
                                                                    when early_bird_applied
                             = standard_price_cents                 otherwise
      raw_retention_credit_cents = RETENTION_HIGH_CREDIT_CENTS when prior_pass.visit_count >= RETENTION_HIGH_VISITS
                                 = RETENTION_MID_CREDIT_CENTS  when prior_pass.visit_count >= RETENTION_MID_VISITS
                                 = 0                            otherwise
      retention_credit_cents = min(raw_retention_credit_cents,
                                   floor(discounted_price_cents * RETENTION_CREDIT_CAP_PCT))
      quoted_price_cents     = discounted_price_cents - retention_credit_cents
    outputs:
      - "GET /season-passes/{pass_id}/renewal-quote returns standard_price_cents, early_bird_applied, discounted_price_cents, retention_credit_cents, quoted_price_cents"
      - "POST /season-passes/{pass_id}/renew mints a new SeasonPass in the target program whose contract_value_cents == quoted_price_cents and whose renewed_from_pass_id == the prior pass"
    precision: "round_half_up on the early-bird discount amount; the retention cap floors"
    constants:
      EARLY_BIRD_DISCOUNT_PCT: 0.15
      RETENTION_HIGH_VISITS: 10
      RETENTION_HIGH_CREDIT_CENTS: 3000
      RETENTION_MID_VISITS: 5
      RETENTION_MID_CREDIT_CENTS: 1500
      RETENTION_CREDIT_CAP_PCT: 0.20
    worked_example: |
      target Gold 30000, clock 2026-11-01, deadline 2026-11-15, prior visit_count 6:
        early_bird_applied true -> discount round_half_up(4500) = 4500 -> discounted 25500
        raw retention 1500, cap floor(25500 * 0.20) = 5100 -> credit 1500 -> quoted 24000

  - name: program_revenue_analysis
    applies_to: PassProgram
    algorithm_type: aggregation
    input_set_filter: |
      REVENUE SET   = SeasonPass of this program with pass_status IN
                      {PENDING_PROCESSING, ACTIVE, SUSPENDED, EXPIRED}   (REVOKED excluded)
      FORFEIT SET   = SeasonPass of this program with pass_status == REVOKED
      VISIT SET     = Visit rows whose season_pass_id is in the REVENUE SET
      SPEND SET     = VISIT SET restricted to status == CLOSED
    formula: |
      base_revenue_cents       = sum(SeasonPass.contract_value_cents      over REVENUE SET)
      recognized_revenue_cents = sum(SeasonPass.paid_to_date_cents        over REVENUE SET)
      deferred_revenue_cents   = sum(SeasonPass.outstanding_balance_cents over REVENUE SET)
      forfeited_revenue_cents  = sum(SeasonPass.paid_to_date_cents        over FORFEIT SET)
      active_pass_count        = count(SeasonPass with pass_status == ACTIVE)
      total_visit_count        = count(VISIT SET)
      visits_per_active_pass   = 0.00 when active_pass_count == 0
                               = round_half_up(total_visit_count / active_pass_count, 2)
      total_in_park_spend_cents = sum(Visit.spend_cents over SPEND SET)
      spend_per_visit_cents    = 0 when count(SPEND SET) == 0
                               = floor(total_in_park_spend_cents / count(SPEND SET))
    outputs:
      - "GET /pass-programs/{program_id}/revenue-summary returns base_revenue_cents, recognized_revenue_cents, deferred_revenue_cents, forfeited_revenue_cents, active_pass_count, total_visit_count, visits_per_active_pass, total_in_park_spend_cents, spend_per_visit_cents"
    precision: "visits_per_active_pass to 2 decimals (round_half_up); spend_per_visit_cents floors; both guard the zero-denominator case explicitly"
    constants: {}
    notes:
      - "A revoked pass leaves base/recognized/deferred entirely and reappears in forfeited_revenue_cents; a dismissed appeal moves it back."

  - name: delinquency_evaluation
    applies_to: [PaymentPlan, SeasonPass]
    algorithm_type: chronological
    evaluated_on: "POST /pass-programs/{program_id}/billing-runs with as_of_date"
    processing_order: "Installment rows of every ACTIVE PaymentPlan of the program are examined in due_date ASC, then sequence_no ASC, then created_at ASC (never by id) so that out-of-order creation cannot change the outcome"
    formula: |
      FOR each Installment with status == SCHEDULED and due_date < as_of_date, in that order:
        Installment.status := MISSED
        PaymentPlan.missed_count := count(Installment of plan with status == MISSED)
        SeasonPass.billing_status := DELINQUENT   when missed_count >= 1
        SeasonPass.pass_status ACTIVE -> SUSPENDED and suspension_count += 1
                                                  when missed_count >= program.delinquency_suspension_threshold
        SeasonPass.billing_status := DEFAULTED    when missed_count >= program.default_threshold
      THEN Reservation rows with status == CONFIRMED whose ParkDay.calendar_date < as_of_date
           become NO_SHOW; those on days >= as_of_date belonging to a pass suspended by this run
           become CANCELLED_BY_SUSPENSION.
      THEN UpgradeOrder rows with status == QUOTED and as_of_date >= date(quote_expires_at)
           become EXPIRED.
      REINSTATEMENT (POST /season-passes/{pass_id}/reinstate):
        cure_amount_cents must equal
          sum(Installment.amount_cents for MISSED installments of the ACTIVE plan)
          - (the waived installment's amount_cents when waive_installment_id is supplied)
        otherwise ERR_CURE_AMOUNT_MISMATCH
    precision: "integer counts; date comparisons are calendar-date comparisons against the logical clock, never wall-clock"
    constants: {}
    worked_example: |
      Plan with installments due 2026-09-01 and 2026-10-01, thresholds 2 / 3.
        billing run as_of 2026-09-15 -> 1 missed  -> billing DELINQUENT, pass stays ACTIVE
        billing run as_of 2026-10-02 -> 2 missed  -> billing DELINQUENT, pass SUSPENDED,
                                                     future CONFIRMED reservations released

# =============================================================================
# §1.4 Validation Rules — evaluated strictly in ascending priority order.
# The first rule whose condition holds produces the response; later rules are never reached.
# =============================================================================
validations:
  - { priority: 1,  category: auth,        applies_to: "all endpoints",                          condition: "X-User-ID header absent or empty",                                                        error_id: ERR_UNAUTHENTICATED,            http_status: 401 }
  - { priority: 2,  category: auth,        applies_to: "all endpoints",                          condition: "X-User-Role header absent, empty, or not one of the five declared roles",                   error_id: ERR_UNAUTHENTICATED,            http_status: 401 }
  - { priority: 3,  category: authz,       applies_to: "all endpoints",                          condition: "X-User-Role is not listed in the endpoint's roles",                                        error_id: ERR_ROLE_NOT_PERMITTED,         http_status: 403 }
  - { priority: 4,  category: schema,      applies_to: "all write endpoints",                    condition: "unknown field, missing required field, wrong JSON type, malformed date/time, value outside a declared numeric range, or a value outside a declared enum", error_id: ERR_INVALID_REQUEST, http_status: 400 }
  - { priority: 5,  category: schema,      applies_to: "all list endpoints",                     condition: "limit < 1, limit > 100, offset < 0, or a filter value outside its enum",                   error_id: ERR_INVALID_REQUEST,            http_status: 400 }
  - { priority: 10, category: existence,   applies_to: "endpoints with {program_id}, and body program_id", condition: "no PassProgram with that id",                                                     error_id: ERR_PROGRAM_NOT_FOUND,          http_status: 404 }
  - { priority: 11, category: existence,   applies_to: "endpoints with {tier_id}, and body tier_id / source_tier_id / target_tier_id", condition: "no PassTier with that id",                             error_id: ERR_TIER_NOT_FOUND,             http_status: 404 }
  - { priority: 12, category: existence,   applies_to: "endpoints with {park_day_id}, and body park_day_id", condition: "no ParkDay with that id",                                                       error_id: ERR_PARK_DAY_NOT_FOUND,         http_status: 404 }
  - { priority: 13, category: existence,   applies_to: "endpoints with {passholder_id}, and body passholder_id", condition: "no Passholder with that id",                                                 error_id: ERR_PASSHOLDER_NOT_FOUND,       http_status: 404 }
  - { priority: 14, category: existence,   applies_to: "endpoints with {pass_id}, and body season_pass_id / renewed_from_pass_id", condition: "no SeasonPass with that id",                              error_id: ERR_PASS_NOT_FOUND,             http_status: 404 }
  - { priority: 15, category: existence,   applies_to: "endpoints with {plan_id}",               condition: "no PaymentPlan with that id",                                                             error_id: ERR_PLAN_NOT_FOUND,             http_status: 404 }
  - { priority: 16, category: existence,   applies_to: "endpoints with {installment_id}, and body waive_installment_id", condition: "no Installment with that id, or the installment does not belong to the pass's ACTIVE plan", error_id: ERR_INSTALLMENT_NOT_FOUND, http_status: 404 }
  - { priority: 17, category: existence,   applies_to: "endpoints with {reservation_id}",         condition: "no Reservation with that id",                                                             error_id: ERR_RESERVATION_NOT_FOUND,      http_status: 404 }
  - { priority: 18, category: existence,   applies_to: "endpoints with {visit_id}, and body evidence_visit_ids", condition: "no Visit with that id",                                                     error_id: ERR_VISIT_NOT_FOUND,            http_status: 404 }
  - { priority: 19, category: existence,   applies_to: "endpoints with {case_id}",                condition: "no SharingCase with that id",                                                             error_id: ERR_CASE_NOT_FOUND,             http_status: 404 }
  - { priority: 20, category: existence,   applies_to: "endpoints with {upgrade_order_id}",       condition: "no UpgradeOrder with that id",                                                            error_id: ERR_UPGRADE_ORDER_NOT_FOUND,    http_status: 404 }
  - { priority: 21, category: existence,   applies_to: "endpoints with {assignment_id}",          condition: "no BlockoutAssignment with that id",                                                      error_id: ERR_ASSIGNMENT_NOT_FOUND,       http_status: 404 }
  - { priority: 25, category: ownership,   applies_to: "POST /reservations, POST /reservations/{reservation_id}/cancel, POST /sharing-cases/{case_id}/appeal, GET /season-passes/{pass_id}", condition: "caller role is Passholder and X-User-ID != SeasonPass.passholder_id", error_id: ERR_NOT_PASS_OWNER, http_status: 403 }
  - { priority: 26, category: ownership,   applies_to: "POST /sharing-cases/{case_id}/decide",    condition: "X-User-ID == SharingCase.opened_by_user_id (the opener may not adjudicate)",                error_id: ERR_SEGREGATION_OF_DUTIES,      http_status: 403 }
  - { priority: 30, category: concurrency, applies_to: "POST /season-passes/{pass_id}/payment-plans", condition: "expected_season_pass_version != SeasonPass.version",                                   error_id: ERR_STALE_PASS_VERSION,         http_status: 412 }
  - { priority: 31, category: concurrency, applies_to: "POST /blockout-assignments",              condition: "expected_park_day_version != ParkDay.version",                                            error_id: ERR_STALE_PARK_DAY_VERSION,     http_status: 412 }
  - { priority: 39, category: business_safety, applies_to: "POST /visits",                        condition: "SeasonPass.photo_captured == false or identity_bound == false",                            error_id: ERR_PHOTO_NOT_CAPTURED,         http_status: 422, note: "Deliberately ordered BEFORE the generic priority 46 pass_status check: photo_captured / identity_bound can only be false while the pass is still PENDING_PROCESSING, so any later priority would leave this rule permanently shadowed by ERR_PASS_NOT_ACTIVE and the error code untriggerable. A turnstile must say 'no photo on file'; ERR_PASS_NOT_ACTIVE stays reachable at a gate through a SUSPENDED or REVOKED pass." }
  - { priority: 40, category: state,       applies_to: "POST /pass-programs/{program_id}/advance-status", condition: "target_status is not reachable from PassProgram.status per §1.2",                   error_id: ERR_INVALID_PROGRAM_TRANSITION, http_status: 409 }
  - { priority: 41, category: state,       applies_to: "POST /pass-tiers, POST /park-days, POST /season-passes, POST /reservations, POST /visits, POST /upgrade-orders", condition: "PassProgram.status is not one of the statuses the endpoint requires", error_id: ERR_PROGRAM_STATUS_INVALID, http_status: 409, note: "Required statuses, pinned per endpoint: POST /pass-tiers {DESIGN, SALES_OPEN}; POST /park-days {DESIGN, SALES_OPEN, SEASON_ACTIVE, RENEWAL_OPEN}; POST /season-passes {SALES_OPEN, SEASON_ACTIVE, RENEWAL_OPEN}; POST /reservations {SEASON_ACTIVE, RENEWAL_OPEN}; POST /visits {SEASON_ACTIVE, RENEWAL_OPEN}; POST /upgrade-orders {SALES_OPEN, SEASON_ACTIVE, RENEWAL_OPEN}. POST /blockout-assignments and POST /blockout-assignments/{assignment_id}/lift are deliberately absent: the blockout calendar may be edited in any non-CLOSED program status." }
  - { priority: 42, category: state,       applies_to: "POST /season-passes/{pass_id}/renew",     condition: "target PassProgram.status != RENEWAL_OPEN",                                                error_id: ERR_PROGRAM_NOT_IN_RENEWAL,     http_status: 409 }
  - { priority: 43, category: state,       applies_to: "POST /pass-tiers/{tier_id}/status",       condition: "target_status is not reachable from PassTier.status, or a RETIRED target still has live passes", error_id: ERR_TIER_NOT_PUBLISHED,       http_status: 409 }
  - { priority: 44, category: state,       applies_to: "POST /season-passes, POST /season-passes/{pass_id}/renew, POST /upgrade-orders", condition: "the referenced tier (tier_id / target_tier_id) has status != PUBLISHED", error_id: ERR_TIER_NOT_PUBLISHED,   http_status: 409 }
  - { priority: 45, category: state,       applies_to: "POST /season-passes/{pass_id}/process",   condition: "SeasonPass.pass_status != PENDING_PROCESSING",                                             error_id: ERR_PASS_ALREADY_PROCESSED,     http_status: 409 }
  - { priority: 46, category: state,       applies_to: "POST /reservations, POST /visits, POST /upgrade-orders, POST /upgrade-orders/{upgrade_order_id}/apply, POST /season-passes/{pass_id}/payment-plans", condition: "SeasonPass.pass_status != ACTIVE", error_id: ERR_PASS_NOT_ACTIVE, http_status: 409 }
  - { priority: 47, category: state,       applies_to: "POST /season-passes/{pass_id}/reinstate", condition: "SeasonPass.pass_status != SUSPENDED",                                                      error_id: ERR_PASS_NOT_SUSPENDED,         http_status: 409 }
  - { priority: 48, category: state,       applies_to: "POST /reservations",                      condition: "SeasonPass.billing_status IN {DELINQUENT, DEFAULTED}",                                     error_id: ERR_PASS_BILLING_NOT_CURRENT,   http_status: 409 }
  - { priority: 49, category: state,       applies_to: "POST /season-passes/{pass_id}/renew, GET /season-passes/{pass_id}/renewal-quote", condition: "SeasonPass.pass_status IN {PENDING_PROCESSING, REVOKED} or a SeasonPass already exists with renewed_from_pass_id == this pass", error_id: ERR_PASS_NOT_RENEWABLE, http_status: 409 }
  - { priority: 50, category: state,       applies_to: "POST /installments/{installment_id}/settle", condition: "Installment.status NOT IN {SCHEDULED, MISSED}, or the owning PaymentPlan.plan_status != ACTIVE", error_id: ERR_INSTALLMENT_NOT_PAYABLE, http_status: 409 }
  - { priority: 51, category: state,       applies_to: "POST /reservations/{reservation_id}/cancel", condition: "Reservation.status != CONFIRMED",                                                        error_id: ERR_RESERVATION_NOT_CANCELLABLE, http_status: 409 }
  - { priority: 52, category: state,       applies_to: "POST /visits/{visit_id}/close",           condition: "Visit.status != OPEN",                                                                    error_id: ERR_VISIT_ALREADY_CLOSED,       http_status: 409 }
  - { priority: 53, category: state,       applies_to: "POST /sharing-cases/{case_id}/review, POST /sharing-cases/{case_id}/decide, POST /sharing-cases/{case_id}/appeal", condition: "SharingCase.case_status is not the status the action requires (review needs OPEN or APPEAL_PENDING, decide needs UNDER_REVIEW, appeal needs SUBSTANTIATED)", error_id: ERR_INVALID_CASE_STATE, http_status: 409 }
  - { priority: 54, category: state,       applies_to: "POST /sharing-cases/{case_id}/appeal",    condition: "SharingCase.review_round >= 2 (the single appeal has already been used)",                  error_id: ERR_APPEAL_LIMIT_REACHED,       http_status: 409 }
  - { priority: 55, category: state,       applies_to: "POST /upgrade-orders/{upgrade_order_id}/apply, POST /upgrade-orders/{upgrade_order_id}/reverse", condition: "UpgradeOrder.status is not the status the action requires (apply needs QUOTED, reverse needs APPLIED), or the pass no longer sits on the order's expected tier", error_id: ERR_UPGRADE_ORDER_NOT_ACTIONABLE, http_status: 409 }
  - { priority: 56, category: state,       applies_to: "POST /blockout-assignments/{assignment_id}/lift", condition: "BlockoutAssignment.status != ACTIVE",                                               error_id: ERR_ASSIGNMENT_ALREADY_LIFTED,  http_status: 409 }
  - { priority: 57, category: state,       applies_to: "POST /blockout-assignments/{assignment_id}/lift, POST /reservations", condition: "ParkDay.day_class == CAPACITY_LOCKED — a locked day may neither release its blockouts nor accept new reservations", error_id: ERR_PARK_DAY_CAPACITY_LOCKED, http_status: 409 }
  - { priority: 61, category: business_safety, applies_to: "POST /visits",                        condition: "the pass has a SharingCase in status OPEN, UNDER_REVIEW or APPEAL_PENDING, or the Passholder.status == BANNED — the pass is under a transfer-prohibition hold", error_id: ERR_PASS_TRANSFER_PROHIBITED, http_status: 422 }
  - { priority: 62, category: business_safety, applies_to: "POST /visits",                        condition: "a Visit of the same pass has entry_at within constants.ANTIPASSBACK_MINUTES before the requested entry_at (closed buffer: exactly 90 minutes is still a violation)", error_id: ERR_ANTIPASSBACK_VIOLATION, http_status: 422 }
  - { priority: 70, category: business_temporal, applies_to: "POST /reservations, POST /visits, POST /blockout-assignments", condition: "ParkDay.program_id != the pass's / tier's program_id",             error_id: ERR_PARK_DAY_PROGRAM_MISMATCH,  http_status: 422 }
  - { priority: 71, category: business_temporal, applies_to: "POST /visits",                      condition: "date(entry_at) != ParkDay.calendar_date",                                                 error_id: ERR_ENTRY_DATE_MISMATCH,        http_status: 422 }
  - { priority: 72, category: business_temporal, applies_to: "POST /reservations",                condition: "ParkDay.calendar_date < date(logical clock)",                                              error_id: ERR_PARK_DAY_IN_PAST,           http_status: 422 }
  - { priority: 73, category: business_temporal, applies_to: "POST /reservations",                condition: "arrival_window_end <= arrival_window_start (the window is half-open and must be non-empty)", error_id: ERR_ARRIVAL_WINDOW_INVALID,   http_status: 422 }
  - { priority: 74, category: business_temporal, applies_to: "POST /reservations, POST /visits",   condition: "an ACTIVE BlockoutAssignment exists for (SeasonPass.tier_id, park_day_id)",                error_id: ERR_BLOCKOUT_DATE,              http_status: 422 }
  - { priority: 80, category: business_referential, applies_to: "POST /pass-tiers, POST /season-passes, POST /upgrade-orders", condition: "the tier's program_id != the program the operation targets (source_tier_id and target_tier_id must both belong to the pass's program)", error_id: ERR_TIER_PROGRAM_MISMATCH, http_status: 422 }
  - { priority: 81, category: business_referential, applies_to: "POST /season-passes",            condition: "the passholder already owns a SeasonPass in this program with pass_status IN {PENDING_PROCESSING, ACTIVE, SUSPENDED}", error_id: ERR_DUPLICATE_ACTIVE_PASS,  http_status: 422 }
  - { priority: 82, category: business_referential, applies_to: "POST /blockout-assignments",     condition: "an ACTIVE BlockoutAssignment already exists for the same (tier_id, park_day_id)",           error_id: ERR_DUPLICATE_BLOCKOUT_ASSIGNMENT, http_status: 422 }
  - { priority: 83, category: business_referential, applies_to: "POST /reservations",             condition: "the pass already holds a Reservation with status IN {CONFIRMED, REDEEMED} on that ParkDay", error_id: ERR_DUPLICATE_RESERVATION,      http_status: 422 }
  - { priority: 84, category: business_referential, applies_to: "POST /upgrade-orders",           condition: "target_tier.base_price_cents <= source_tier.base_price_cents, or source_tier_id != SeasonPass.tier_id", error_id: ERR_NOT_AN_UPGRADE,           http_status: 422 }
  - { priority: 85, category: business_referential, applies_to: "POST /sharing-cases",            condition: "evidence_visit_ids is empty, or any listed Visit.season_pass_id != the case's season_pass_id", error_id: ERR_INVALID_EVIDENCE,           http_status: 422 }
  - { priority: 90, category: business_constraint, applies_to: "POST /season-passes/{pass_id}/payment-plans", condition: "installment_count outside [3, 10]",                                             error_id: ERR_INSTALLMENT_COUNT_OUT_OF_RANGE, http_status: 422 }
  - { priority: 91, category: business_constraint, applies_to: "POST /season-passes/{pass_id}/payment-plans", condition: "down_payment_cents < round_half_up(SeasonPass.contract_value_cents * 0.20)",     error_id: ERR_DOWN_PAYMENT_TOO_LOW,       http_status: 422 }
  - { priority: 92, category: business_constraint, applies_to: "POST /reservations",              condition: "the pass already holds CONFIRMED reservations on PEAK / CAPACITY_LOCKED days equal to its tier's peak_reservation_quota",   error_id: ERR_RESERVATION_QUOTA_EXCEEDED, http_status: 422 }
  - { priority: 93, category: business_constraint, applies_to: "POST /visits",                    condition: "ParkDay.day_class IN {PEAK, CAPACITY_LOCKED} and the pass's tier has reservation_required_on_peak == true and the pass holds no CONFIRMED Reservation on that day", error_id: ERR_RESERVATION_REQUIRED, http_status: 422 }
  - { priority: 100, category: business_fiscal,  applies_to: "POST /reservations",                condition: "ParkDay.reserved_count >= ParkDay.reservation_slot_capacity (the day as a whole is sold out)", error_id: ERR_PARK_DAY_CAPACITY_FULL,   http_status: 422 }
  - { priority: 101, category: business_fiscal,  applies_to: "POST /reservations",                condition: "the number of CONFIRMED reservations on that day whose half-open [arrival_window_start, arrival_window_end) interval overlaps the requested window is already >= ParkDay.window_slot_capacity", error_id: ERR_RESERVATION_SLOT_FULL, http_status: 422 }
  - { priority: 102, category: business_fiscal,  applies_to: "POST /installments/{installment_id}/settle", condition: "amount_cents != Installment.amount_cents",                                           error_id: ERR_PAYMENT_AMOUNT_MISMATCH,    http_status: 422 }
  - { priority: 103, category: business_fiscal,  applies_to: "POST /upgrade-orders/{upgrade_order_id}/apply", condition: "payment_amount_cents != UpgradeOrder.total_due_cents",                            error_id: ERR_UPGRADE_PAYMENT_INSUFFICIENT, http_status: 422 }
  - { priority: 104, category: business_fiscal,  applies_to: "POST /season-passes/{pass_id}/reinstate", condition: "cure_amount_cents != sum of the ACTIVE plan's MISSED installment amounts minus the waived installment's amount", error_id: ERR_CURE_AMOUNT_MISMATCH, http_status: 422 }

# =============================================================================
# §1.5 API Endpoint Table (flat top-level collections; api_prefix is empty)
# Every list endpoint accepts limit? / offset? and returns the §1.0 pagination
# fields. Every query parameter is optional so that a bare list call is legal.
# =============================================================================
endpoints:
  # --- PassProgram ----------------------------------------------------------
  - method: POST
    path: /pass-programs
    roles: [ProgramAdmin]
    description: "Create a season pass program in DESIGN."
    input: [season_year, park_name, early_bird_deadline, "capacity_peak_threshold_pct?", "capacity_lock_threshold_pct?", "capacity_lock_blockout_max_rank?", "delinquency_suspension_threshold?", "default_threshold?", "sharing_case_auto_open_score?"]
    output: PassProgram
    side_effects: ["status := DESIGN", "all computed revenue fields initialise to 0"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /pass-programs
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "List programs, newest first (created_at DESC, then id ASC only as a stable tiebreak on equal timestamps)."
    input: ["limit?", "offset?", "status?", "season_year?"]
    output: PassProgram[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /pass-programs/{program_id}
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "Read one program including its computed revenue rollups."
    input: []
    output: PassProgram
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PROGRAM_NOT_FOUND]

  - method: POST
    path: /pass-programs/{program_id}/advance-status
    roles: [ProgramAdmin]
    description: "Advance the program lifecycle (see §1.2 PassProgram)."
    input: [target_status]
    output: PassProgram
    side_effects: ["applies every §1.2 PassProgram side effect for the transition, including the CLOSED expiry cascade", "increments PassProgram.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_FOUND, ERR_INVALID_PROGRAM_TRANSITION]

  - method: GET
    path: /pass-programs/{program_id}/revenue-summary
    roles: [ProgramAdmin, ComplianceOfficer]
    description: "Pass base revenue, visitation frequency and in-park spend analysis (calculations.program_revenue_analysis)."
    input: []
    output: { base_revenue_cents: integer, recognized_revenue_cents: integer, deferred_revenue_cents: integer, forfeited_revenue_cents: integer, active_pass_count: integer, total_visit_count: integer, visits_per_active_pass: number, total_in_park_spend_cents: integer, spend_per_visit_cents: integer }
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PROGRAM_NOT_FOUND]

  - method: POST
    path: /pass-programs/{program_id}/billing-runs
    roles: [ProgramAdmin]
    description: "Run monthly billing for the program as of as_of_date: mark overdue installments MISSED, apply the delinquency / suspension / default ladder, sweep past-dated CONFIRMED reservations to NO_SHOW and expire stale upgrade quotes (calculations.delinquency_evaluation)."
    input: [as_of_date]
    output: { missed_installment_count: integer, delinquent_pass_count: integer, defaulted_pass_count: integer, suspended_pass_count: integer, released_reservation_count: integer, no_show_reservation_count: integer, expired_upgrade_order_count: integer }
    side_effects: ["every §1.2 Installment SCHEDULED_to_MISSED cascade level", "SeasonPass billing_status / pass_status updates", "Reservation releases and no-shows with ParkDay counter recomputation", "UpgradeOrder QUOTED -> EXPIRED", "PassProgram revenue rollups recomputed"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_FOUND]

  # --- PassTier -------------------------------------------------------------
  - method: POST
    path: /pass-tiers
    roles: [ProgramAdmin]
    description: "Design a pass tier (park access breadth, parking benefit, in-park discount, peak reservation policy)."
    input: [program_id, name, tier_rank, base_price_cents, parking_benefit, in_park_discount_pct, reservation_required_on_peak, peak_reservation_quota]
    output: PassTier
    side_effects: ["status := DRAFT"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_STATUS_INVALID, ERR_TIER_PROGRAM_MISMATCH]

  - method: GET
    path: /pass-tiers
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "List tiers ordered tier_rank ASC, created_at ASC."
    input: ["limit?", "offset?", "program_id?", "status?"]
    output: PassTier[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /pass-tiers/{tier_id}
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "Read one tier."
    input: []
    output: PassTier
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TIER_NOT_FOUND]

  - method: POST
    path: /pass-tiers/{tier_id}/status
    roles: [ProgramAdmin]
    description: "Publish or retire a tier (see §1.2 PassTier)."
    input: [target_status]
    output: PassTier
    side_effects: ["increments PassTier.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_TIER_NOT_FOUND, ERR_TIER_NOT_PUBLISHED]

  # --- ParkDay --------------------------------------------------------------
  - method: POST
    path: /park-days
    roles: [ProgramAdmin]
    description: "Add an operating day to the blockout calendar; day_class and the reservation slot capacities are derived immediately (calculations.park_day_capacity_posture)."
    input: [program_id, calendar_date, capacity_total, forecast_attendance]
    output: ParkDay
    side_effects: ["forecast_utilization_pct, day_class, reservation_slot_capacity, window_slot_capacity, remaining_slot_count derived", "when the derived day_class is CAPACITY_LOCKED the CAPACITY_ADJUSTED blockout cascade runs immediately"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_STATUS_INVALID]

  - method: GET
    path: /park-days
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "List operating days ordered calendar_date ASC, created_at ASC."
    input: ["limit?", "offset?", "program_id?", "day_class?"]
    output: ParkDay[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /park-days/{park_day_id}
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "Read one operating day with its live slot counters."
    input: []
    output: ParkDay
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PARK_DAY_NOT_FOUND]

  - method: POST
    path: /park-days/{park_day_id}/forecast
    roles: [ProgramAdmin]
    description: "Re-forecast attendance for the day; re-derives day_class in either direction and runs the capacity-driven blockout install / auto-lift cascade (see §1.2 ParkDay)."
    input: [forecast_attendance, "capacity_total?"]
    output: ParkDay
    side_effects: ["every §1.2 ParkDay transition side effect for the re-derived day_class", "increments ParkDay.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PARK_DAY_NOT_FOUND]

  # --- BlockoutAssignment ---------------------------------------------------
  - method: POST
    path: /blockout-assignments
    roles: [ProgramAdmin]
    description: "Assign a blockout date to a tier. OCC-guarded on the ParkDay (see §1.2.1 blockout-create-stale-park-day)."
    input: [tier_id, park_day_id, expected_park_day_version]
    output: BlockoutAssignment
    side_effects: ["source := MANUAL, status := ACTIVE", "CONFIRMED reservations of that tier on that day become CANCELLED_BY_BLOCKOUT and the ParkDay counters are recomputed", "increments ParkDay.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_TIER_NOT_FOUND, ERR_PARK_DAY_NOT_FOUND, ERR_STALE_PARK_DAY_VERSION, ERR_PARK_DAY_PROGRAM_MISMATCH, ERR_DUPLICATE_BLOCKOUT_ASSIGNMENT]

  - method: GET
    path: /blockout-assignments
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "List blockout assignments ordered created_at ASC."
    input: ["limit?", "offset?", "tier_id?", "park_day_id?", "status?", "source?"]
    output: BlockoutAssignment[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /blockout-assignments/{assignment_id}
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "Read one blockout assignment."
    input: []
    output: BlockoutAssignment
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ASSIGNMENT_NOT_FOUND]

  - method: POST
    path: /blockout-assignments/{assignment_id}/lift
    roles: [ProgramAdmin]
    description: "Lift a blockout. Refused while the ParkDay is CAPACITY_LOCKED (cross-entity guard)."
    input: [reason]
    output: BlockoutAssignment
    side_effects: ["status := LIFTED, lift_reason := reason", "increments BlockoutAssignment.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_ASSIGNMENT_NOT_FOUND, ERR_ASSIGNMENT_ALREADY_LIFTED, ERR_PARK_DAY_CAPACITY_LOCKED]

  # --- Passholder -----------------------------------------------------------
  - method: POST
    path: /passholders
    roles: [PassOfficeClerk]
    description: "Register a passholder identity."
    input: [full_name, email, date_of_birth]
    output: Passholder
    side_effects: ["status := ACTIVE, sharing_risk_score := 0, photo_mismatch_count := 0"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /passholders
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer]
    description: "List passholders ordered created_at ASC."
    input: ["limit?", "offset?", "email?", "status?"]
    output: Passholder[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /passholders/{passholder_id}
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "Read one passholder including the live sharing_risk_score."
    input: []
    output: Passholder
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PASSHOLDER_NOT_FOUND]

  # --- SeasonPass -----------------------------------------------------------
  - method: POST
    path: /season-passes
    roles: [PassOfficeClerk]
    description: "Sell a season pass. payment_mode PAY_IN_FULL settles the contract immediately (billing_status PAID_IN_FULL); PAYMENT_PLAN leaves it UNBILLED until a plan is enrolled."
    input: [program_id, tier_id, passholder_id, payment_mode]
    output: SeasonPass
    side_effects: ["pass_status := PENDING_PROCESSING, media_number minted sequentially (SP-000001 upward by created_at ASC)", "contract_value_cents := tier.base_price_cents; billed_total_cents := contract_value_cents", "PAY_IN_FULL: paid_to_date_cents := contract_value_cents, billing_status := PAID_IN_FULL", "PassProgram revenue rollups recomputed"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_FOUND, ERR_TIER_NOT_FOUND, ERR_PASSHOLDER_NOT_FOUND, ERR_PROGRAM_STATUS_INVALID, ERR_TIER_NOT_PUBLISHED, ERR_TIER_PROGRAM_MISMATCH, ERR_DUPLICATE_ACTIVE_PASS]

  - method: GET
    path: /season-passes
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "List season passes ordered media_number ASC. Passholder callers see only their own passes."
    input: ["limit?", "offset?", "program_id?", "tier_id?", "passholder_id?", "renewed_from_pass_id?", "pass_status?", "billing_status?"]
    output: SeasonPass[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /season-passes/{pass_id}
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "Read one pass with both status dimensions and the full money ledger."
    input: []
    output: SeasonPass
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PASS_NOT_FOUND, ERR_NOT_PASS_OWNER]

  - method: POST
    path: /season-passes/{pass_id}/process
    roles: [PassOfficeClerk]
    description: "Process the pass at the pass office: capture the photo and bind the government identity. A pass cannot be used at a gate before this succeeds, and it can only be processed once."
    input: [photo_hash, government_id_last4]
    output: SeasonPass
    side_effects: ["photo_captured := true, identity_bound := true", "pass_status PENDING_PROCESSING -> ACTIVE", "PassProgram.active_pass_count recomputed", "increments SeasonPass.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PASS_NOT_FOUND, ERR_PROGRAM_STATUS_INVALID, ERR_PASS_ALREADY_PROCESSED]

  - method: POST
    path: /season-passes/{pass_id}/payment-plans
    roles: [PassOfficeClerk]
    description: "Enrol the pass in a monthly payment plan. A second enrolment legitimately supersedes the ACTIVE plan, so the write is OCC-guarded on the pass (see §1.2.1 plan-create-stale-pass)."
    input: [down_payment_cents, installment_count, first_due_date, expected_season_pass_version]
    output: PaymentPlan
    side_effects: ["PaymentPlan ACTIVE with its Installment schedule per calculations.payment_plan_amortization", "any prior ACTIVE plan becomes SUPERSEDED and its SCHEDULED installments become VOIDED", "SeasonPass.billing_status := PLAN_CURRENT, billed_total_cents += setup_fee_cents, paid_to_date_cents += down_payment_cents", "increments SeasonPass.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PASS_NOT_FOUND, ERR_STALE_PASS_VERSION, ERR_PASS_NOT_ACTIVE, ERR_INSTALLMENT_COUNT_OUT_OF_RANGE, ERR_DOWN_PAYMENT_TOO_LOW]

  - method: POST
    path: /season-passes/{pass_id}/reinstate
    roles: [PassOfficeClerk]
    description: "Cure a suspended or defaulted pass. cure_amount_cents must equal the outstanding MISSED installments (minus one optionally waived installment)."
    input: [cure_amount_cents, "waive_installment_id?"]
    output: SeasonPass
    side_effects: ["MISSED installments become SETTLED (or WAIVED for waive_installment_id)", "billing_status returns to PLAN_CURRENT / PAID_IN_FULL, pass_status SUSPENDED -> ACTIVE", "reservations released by the suspension are NOT restored", "increments SeasonPass.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PASS_NOT_FOUND, ERR_INSTALLMENT_NOT_FOUND, ERR_PASS_NOT_SUSPENDED, ERR_CURE_AMOUNT_MISMATCH]

  - method: GET
    path: /season-passes/{pass_id}/renewal-quote
    roles: [ProgramAdmin, PassOfficeClerk, Passholder]
    description: "Price a renewal campaign offer for this pass (calculations.renewal_quote). Omitting target_tier_id prices a like-for-like renewal on the pass's current tier."
    input: ["target_tier_id?"]
    output: { standard_price_cents: integer, early_bird_applied: boolean, discounted_price_cents: integer, retention_credit_cents: integer, quoted_price_cents: integer }
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PASS_NOT_FOUND, ERR_TIER_NOT_FOUND, ERR_PASS_NOT_RENEWABLE]

  - method: POST
    path: /season-passes/{pass_id}/renew
    roles: [PassOfficeClerk]
    description: "Renew the pass into a RENEWAL_OPEN program at the quoted renewal price."
    input: [target_program_id, target_tier_id, payment_mode]
    output: SeasonPass
    side_effects: ["new SeasonPass minted with renewed_from_pass_id := {pass_id} and contract_value_cents := calculations.renewal_quote.quoted_price_cents", "the new pass starts PENDING_PROCESSING / UNBILLED (or PAID_IN_FULL for PAY_IN_FULL)", "the prior pass is untouched"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PASS_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_TIER_NOT_FOUND, ERR_PROGRAM_NOT_IN_RENEWAL, ERR_TIER_NOT_PUBLISHED, ERR_TIER_PROGRAM_MISMATCH, ERR_PASS_NOT_RENEWABLE]

  # --- PaymentPlan / Installment -------------------------------------------
  - method: GET
    path: /payment-plans
    roles: [ProgramAdmin, PassOfficeClerk, ComplianceOfficer, Passholder]
    description: "List payment plans ordered created_at ASC."
    input: ["limit?", "offset?", "season_pass_id?", "plan_status?"]
    output: PaymentPlan[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /payment-plans/{plan_id}
    roles: [ProgramAdmin, PassOfficeClerk, ComplianceOfficer, Passholder]
    description: "Read one payment plan with its amortization figures and counters."
    input: []
    output: PaymentPlan
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PLAN_NOT_FOUND]

  - method: GET
    path: /installments
    roles: [ProgramAdmin, PassOfficeClerk, ComplianceOfficer, Passholder]
    description: "List installments ordered due_date ASC, sequence_no ASC, created_at ASC."
    input: ["limit?", "offset?", "payment_plan_id?", "status?"]
    output: Installment[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /installments/{installment_id}
    roles: [ProgramAdmin, PassOfficeClerk, ComplianceOfficer, Passholder]
    description: "Read one installment."
    input: []
    output: Installment
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INSTALLMENT_NOT_FOUND]

  - method: POST
    path: /installments/{installment_id}/settle
    roles: [PassOfficeClerk]
    description: "Take a monthly installment payment. The amount must match exactly; settling the last outstanding installment completes the plan and bubbles PAID_IN_FULL up to the pass."
    input: [amount_cents, "paid_at?"]
    output: Installment
    side_effects: ["status := SETTLED, settled_at := paid_at or the logical clock", "PaymentPlan.settled_count / missed_count recomputed; plan_status -> COMPLETED when nothing is outstanding", "SeasonPass.paid_to_date_cents / outstanding_balance_cents / billing_status recomputed", "PassProgram recognized and deferred revenue recomputed", "increments Installment.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_INSTALLMENT_NOT_FOUND, ERR_INSTALLMENT_NOT_PAYABLE, ERR_PAYMENT_AMOUNT_MISMATCH]

  # --- Reservation ----------------------------------------------------------
  - method: POST
    path: /reservations
    roles: [PassOfficeClerk, Passholder]
    description: "Reserve a peak-day arrival window for a pass. Half-open window [arrival_window_start, arrival_window_end); day-level and overlapping-window capacity are checked separately."
    input: [season_pass_id, park_day_id, arrival_window_start, arrival_window_end]
    output: Reservation
    side_effects: ["status := CONFIRMED", "ParkDay.reserved_count += 1, grant_count += 1, remaining_slot_count recomputed"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PASS_NOT_FOUND, ERR_PARK_DAY_NOT_FOUND, ERR_NOT_PASS_OWNER, ERR_PROGRAM_STATUS_INVALID, ERR_PASS_NOT_ACTIVE, ERR_PASS_BILLING_NOT_CURRENT, ERR_PARK_DAY_CAPACITY_LOCKED, ERR_PARK_DAY_PROGRAM_MISMATCH, ERR_PARK_DAY_IN_PAST, ERR_ARRIVAL_WINDOW_INVALID, ERR_BLOCKOUT_DATE, ERR_DUPLICATE_RESERVATION, ERR_RESERVATION_QUOTA_EXCEEDED, ERR_PARK_DAY_CAPACITY_FULL, ERR_RESERVATION_SLOT_FULL]

  - method: GET
    path: /reservations
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "List reservations ordered created_at ASC."
    input: ["limit?", "offset?", "season_pass_id?", "park_day_id?", "status?", "redeemed_visit_id?"]
    output: Reservation[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /reservations/{reservation_id}
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "Read one reservation."
    input: []
    output: Reservation
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RESERVATION_NOT_FOUND]

  - method: POST
    path: /reservations/{reservation_id}/cancel
    roles: [PassOfficeClerk, Passholder]
    description: "Cancel a confirmed reservation and return the slot unit to the day."
    input: []
    output: Reservation
    side_effects: ["status := CANCELLED_BY_HOLDER", "ParkDay.reserved_count -= 1, released_count += 1, remaining_slot_count recomputed, grant_count unchanged", "increments Reservation.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RESERVATION_NOT_FOUND, ERR_NOT_PASS_OWNER, ERR_RESERVATION_NOT_CANCELLABLE]

  # --- Visit ----------------------------------------------------------------
  - method: POST
    path: /visits
    roles: [GateAgent]
    description: "Record a gate entry. Enforces photo capture and identity binding, the transfer-prohibition hold, the anti-passback buffer, blockout dates and the peak-day reservation requirement, then re-scores sharing risk (calculations.pass_sharing_risk_score)."
    input: [season_pass_id, park_day_id, entry_at, gate_code, "photo_match?"]
    output: Visit
    side_effects: ["status := OPEN; photo_match defaults to NOT_CHECKED", "a matching CONFIRMED Reservation becomes REDEEMED and its redeemed_visit_id is set", "SeasonPass.visit_count += 1; ParkDay.redeemed_count recomputed", "Passholder.sharing_risk_score and photo_mismatch_count recomputed", "a SharingCase is auto-opened (opened_by_user_id 'SYSTEM') when the score reaches PassProgram.sharing_case_auto_open_score"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PASS_NOT_FOUND, ERR_PARK_DAY_NOT_FOUND, ERR_PROGRAM_STATUS_INVALID, ERR_PASS_NOT_ACTIVE, ERR_PHOTO_NOT_CAPTURED, ERR_PASS_TRANSFER_PROHIBITED, ERR_ANTIPASSBACK_VIOLATION, ERR_PARK_DAY_PROGRAM_MISMATCH, ERR_ENTRY_DATE_MISMATCH, ERR_BLOCKOUT_DATE, ERR_RESERVATION_REQUIRED]

  - method: GET
    path: /visits
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "List gate entries ordered entry_at ASC, created_at ASC."
    input: ["limit?", "offset?", "season_pass_id?", "park_day_id?", "status?", "reservation_id?"]
    output: Visit[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /visits/{visit_id}
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "Read one gate entry."
    input: []
    output: Visit
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VISIT_NOT_FOUND]

  - method: POST
    path: /visits/{visit_id}/close
    roles: [GateAgent]
    description: "Close the visit and post the in-park spend for the day, applying the tier's in-park discount."
    input: [spend_cents]
    output: Visit
    side_effects: ["status := CLOSED, discount_applied_pct := tier.in_park_discount_pct", "SeasonPass.in_park_spend_cents recomputed", "PassProgram spend-per-visit analytics recomputed", "increments Visit.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_VISIT_NOT_FOUND, ERR_VISIT_ALREADY_CLOSED]

  # --- SharingCase ----------------------------------------------------------
  - method: POST
    path: /sharing-cases
    roles: [GateAgent]
    description: "Open a pass-sharing case from gate evidence. Only a GateAgent may open a case; only a ComplianceOfficer with a different X-User-ID may decide it."
    input: [season_pass_id, evidence_visit_ids, note]
    output: SharingCase
    side_effects: ["case_status := OPEN, review_round := 0, opened_by_user_id := X-User-ID, opened_by_role := GATE_AGENT, risk_score_at_open := Passholder.sharing_risk_score", "the pass is placed under a transfer-prohibition hold: further gate entries are refused"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PASS_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_INVALID_EVIDENCE]

  - method: GET
    path: /sharing-cases
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "List sharing cases ordered created_at ASC."
    input: ["limit?", "offset?", "season_pass_id?", "case_status?"]
    output: SharingCase[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /sharing-cases/{case_id}
    roles: [ProgramAdmin, PassOfficeClerk, GateAgent, ComplianceOfficer, Passholder]
    description: "Read one sharing case."
    input: []
    output: SharingCase
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_CASE_NOT_FOUND]

  - method: POST
    path: /sharing-cases/{case_id}/review
    roles: [ComplianceOfficer]
    description: "Take an OPEN case (or a case returning from appeal) under review; increments review_round."
    input: []
    output: SharingCase
    side_effects: ["case_status := UNDER_REVIEW, review_round += 1", "increments SharingCase.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_CASE_NOT_FOUND, ERR_INVALID_CASE_STATE]

  - method: POST
    path: /sharing-cases/{case_id}/decide
    roles: [ComplianceOfficer]
    description: "Adjudicate the case. SUBSTANTIATED revokes the pass, terminates its plan and forfeits the amounts already paid; DISMISSED after an appeal reverses all of that."
    input: [decision, rationale]
    output: SharingCase
    side_effects: ["every §1.2 SharingCase decide side effect, including the SeasonPass revocation cascade or its compensation", "increments SharingCase.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_CASE_NOT_FOUND, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_CASE_STATE]

  - method: POST
    path: /sharing-cases/{case_id}/appeal
    roles: [Passholder]
    description: "Appeal a substantiated case once; the case returns to the review queue."
    input: [statement]
    output: SharingCase
    side_effects: ["case_status := APPEAL_PENDING; the pass stays REVOKED", "increments SharingCase.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_CASE_NOT_FOUND, ERR_NOT_PASS_OWNER, ERR_INVALID_CASE_STATE, ERR_APPEAL_LIMIT_REACHED]

  # --- UpgradeOrder ---------------------------------------------------------
  - method: POST
    path: /upgrade-orders
    roles: [PassOfficeClerk]
    description: "Quote an upgrade path from the pass's current tier to a higher-priced tier, crediting either the amounts already paid or the unconsumed prorated value (calculations.upgrade_credit + upgrade_settlement_total)."
    input: [season_pass_id, source_tier_id, target_tier_id, credit_mode]
    output: UpgradeOrder
    side_effects: ["status := QUOTED; gross_delta_cents, raw_credit_cents, credit_cents, net_delta_cents, admin_fee_cents, total_due_cents computed in the pinned order", "quoted_at := logical clock, quote_expires_at := quoted_at + 14 days"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PASS_NOT_FOUND, ERR_TIER_NOT_FOUND, ERR_PROGRAM_STATUS_INVALID, ERR_PASS_NOT_ACTIVE, ERR_TIER_NOT_PUBLISHED, ERR_TIER_PROGRAM_MISMATCH, ERR_NOT_AN_UPGRADE]

  - method: GET
    path: /upgrade-orders
    roles: [ProgramAdmin, PassOfficeClerk, ComplianceOfficer, Passholder]
    description: "List upgrade orders ordered created_at ASC."
    input: ["limit?", "offset?", "season_pass_id?", "source_tier_id?", "target_tier_id?", "status?"]
    output: UpgradeOrder[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /upgrade-orders/{upgrade_order_id}
    roles: [ProgramAdmin, PassOfficeClerk, ComplianceOfficer, Passholder]
    description: "Read one upgrade order with its full settlement breakdown."
    input: []
    output: UpgradeOrder
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_UPGRADE_ORDER_NOT_FOUND]

  - method: POST
    path: /upgrade-orders/{upgrade_order_id}/apply
    roles: [PassOfficeClerk]
    description: "Take the upgrade payment and move the pass onto the target tier."
    input: [payment_amount_cents]
    output: UpgradeOrder
    side_effects: ["every §1.2 UpgradeOrder QUOTED_to_APPLIED side effect (tier move, ledger update, blockout re-derivation)", "increments SeasonPass.version by 1 and UpgradeOrder.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_UPGRADE_ORDER_NOT_FOUND, ERR_PASS_NOT_ACTIVE, ERR_UPGRADE_ORDER_NOT_ACTIONABLE, ERR_UPGRADE_PAYMENT_INSUFFICIENT]

  - method: POST
    path: /upgrade-orders/{upgrade_order_id}/reverse
    roles: [ComplianceOfficer]
    description: "Reverse an applied upgrade (segregation of duties: the clerk who applied it may not reverse it). Every ledger effect is compensated exactly."
    input: [reason]
    output: UpgradeOrder
    side_effects: ["every §1.2 UpgradeOrder APPLIED_to_REVERSED compensation", "increments SeasonPass.version by 1 and UpgradeOrder.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_UPGRADE_ORDER_NOT_FOUND, ERR_UPGRADE_ORDER_NOT_ACTIONABLE]

  # --- Test-driving endpoint (last resort per SKILL.md §1.5 priority ladder) --
  - method: POST
    path: /_clock/set_current_utc
    roles: [ProgramAdmin]
    description: "Set the logical clock used by every date-sensitive rule (early-bird deadline, prorated upgrade credit, anti-passback buffer, quote expiry, reservation past-date guard). The default logical clock when this endpoint has never been called is 2026-08-01T00:00:00Z. No business endpoint can move time, so date-band behaviour is otherwise untestable."
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["the logical clock is set; no business entity is modified"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

# =============================================================================
# §1.6 Error Catalog — 59 codes, every one triggerable through §1.5
# =============================================================================
errors:
  - { error_id: ERR_UNAUTHENTICATED,               http_status: 401, category: auth,        message: "Authentication headers missing or invalid" }
  - { error_id: ERR_ROLE_NOT_PERMITTED,            http_status: 403, category: authz,       message: "Role is not permitted to perform this operation" }
  - { error_id: ERR_INVALID_REQUEST,               http_status: 400, category: schema,      message: "Request body or query parameters are invalid" }
  - { error_id: ERR_PROGRAM_NOT_FOUND,             http_status: 404, category: existence,   message: "Pass program not found" }
  - { error_id: ERR_TIER_NOT_FOUND,                http_status: 404, category: existence,   message: "Pass tier not found" }
  - { error_id: ERR_PARK_DAY_NOT_FOUND,            http_status: 404, category: existence,   message: "Park day not found" }
  - { error_id: ERR_PASSHOLDER_NOT_FOUND,          http_status: 404, category: existence,   message: "Passholder not found" }
  - { error_id: ERR_PASS_NOT_FOUND,                http_status: 404, category: existence,   message: "Season pass not found" }
  - { error_id: ERR_PLAN_NOT_FOUND,                http_status: 404, category: existence,   message: "Payment plan not found" }
  - { error_id: ERR_INSTALLMENT_NOT_FOUND,         http_status: 404, category: existence,   message: "Installment not found" }
  - { error_id: ERR_RESERVATION_NOT_FOUND,         http_status: 404, category: existence,   message: "Reservation not found" }
  - { error_id: ERR_VISIT_NOT_FOUND,               http_status: 404, category: existence,   message: "Visit not found" }
  - { error_id: ERR_CASE_NOT_FOUND,                http_status: 404, category: existence,   message: "Sharing case not found" }
  - { error_id: ERR_UPGRADE_ORDER_NOT_FOUND,       http_status: 404, category: existence,   message: "Upgrade order not found" }
