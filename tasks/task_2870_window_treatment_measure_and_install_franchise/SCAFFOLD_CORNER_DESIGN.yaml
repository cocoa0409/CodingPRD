      - name: superseding_a_quote_hands_its_openings_back_to_the_newer_quote
        claim_type: Cross-entity
        grounds:
          - state_machines.Quote.PRESENTED_to_SUPERSEDED
          - state_machines.Opening.QUOTED_to_CONFIGURED
          - endpoints.POST_blinds_quotes
          - validations.priority_24_ERR_OPENING_NOT_MEASURED
        distinguishing_aspect: "A second quote on the same consultation is a two-way cascade in one request: the older PRESENTED quote becomes SUPERSEDED and releases its openings QUOTED -> CONFIGURED before the new quote re-attaches them as QUOTED. Between those two effects the opening's quote_id is re-pointed, which is the only way a QUOTED opening ever becomes configurable again."
        test_recipe:
          setup:
            - "One ACTIVE territory, one designer, one ROUTED lead, one SCHEDULED consultation and one CONFIGURED opening (LT-SHEER / CORDED, INSIDE 24.000 x 48.000, list 4960)."
            - "A first quote is created and PRESENTED, so the opening is QUOTED and locked against re-configuration."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
