          a synthesized child row rather than through a withdrawal. Hop 1 writes a DEEMED_NON_CONSENT
          AfeElection for OB BECAUSE OB filed nothing before the deadline (the operator is deemed
          consenting and gets no row). Hop 2 sets non_consent_flag on OB's ACTIVE interest BECAUSE that
          synthesized row exists. Hop 3 recomputes Well.consent_working_interest_pct to 0.800000
          BECAUSE the flag changed. Hop 4 suspends OB's two ACCRUED disbursements with
