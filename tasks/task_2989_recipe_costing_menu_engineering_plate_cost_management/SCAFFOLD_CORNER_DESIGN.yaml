              captures: { st: $.data.status, base: $.data.baseline_units, pdb: $.data.price_delta_bps, pu: $.data.projected_units, mcap: $.data.market_cap_price_cents, ecap: $.data.effective_cap_price_cents, pcd: $.data.projected_contribution_delta_cents }
            - call: "PATCH /culinary/price-change-proposals/${p_id}"
              payload: { proposed_price_cents: 401 }
              as: RecipeDeveloper
              captures: { new_price: $.data.proposed_price_cents }
            - call: "POST /culinary/price-change-proposals/${p_id}/submit"
              as: RecipeDeveloper
              as_user_id: "user-dev-1"
              captures: { st2: $.data.status, pdb2: $.data.price_delta_bps, udb2: $.data.projected_unit_delta_bps, pu2: $.data.projected_units, pfc2: $.data.projected_food_cost_bps, pcd2: $.data.projected_contribution_delta_cents }
          assert:
            - "${plate} == 100"
            - "${e_margin} == ERR_MARGIN_FLOOR_BREACH (422) — 380 - 100 == 280 < MARGIN_FLOOR_CENTS 300"
            - "priority 47 did NOT fire: 380 <= the 448-cent effective cap, so the cut is a market-acceptable price that is nonetheless fiscally forbidden"
            - "${st} == DRAFT with ${base} == 0, ${pdb} == 0, ${pu} == 0, ${mcap} == 0, ${ecap} == 0 and ${pcd} == 0 — the gates run after the projection is computed but nothing is persisted when one fails; the would-be figures (-500, +600, 1060, -3200) are discarded whole"
            - "${new_price} == 401 and the resubmit gives ${st2} == SUBMITTED — 401 - 100 == 301 clears the floor by one cent"
            - "${pdb2} == 25 == round_half_up(1*10000/400), ${udb2} == -30, ${pu2} == 997, ${pfc2} == 2494 == round_half_up(1000000/401) and ${pcd2} == 270 == 997*301 - 1000*300"

      - name: the_two_review_emptiness_gates_create_an_unrecoverable_ordering_trap
        claim_type: violation_to_error
        grounds:
          - validations[priority 40] ERR_EMPTY_MIX
          - validations[priority 41] ERR_EMPTY_COUNT_SHEET
          - validations[priority 23] ERR_REVIEW_INVALID_STATE
        distinguishing_aspect: "Cascading validation with a genuine dead end. classify on a freshly OPEN review always fails with ERR_EMPTY_MIX, and close on a CLASSIFIED review with no counts always fails with ERR_EMPTY_COUNT_SHEET — but count lines only load in OPEN or MIX_LOADED, so a review classified before its counts were loaded can NEVER close. The two gates therefore pin a single legal ordering: mix lines, then count lines, then classify, then close."
        test_recipe:
          setup:
            - "GRILL WORLD in MW with MI-GRILL-MW ACTIVE at 400 cents and plate_cost_cents 100 (FRESH), plus Unit STORE-001 in MW."
            - "Two SALES_MIX_BASED reviews on STORE-001 over disjoint periods: REV-TRAP for [2026-06-01, 2026-07-01) which will be classified before any count exists, and REV-GOOD for [2026-07-01, 2026-08-01) which is loaded in the legal order."
          setup_api_calls:
            - call: "POST /culinary/units"
              payload: { code: "STORE-001", name: "Downtown", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-06-01T00:00:00.000Z", period_end: "2026-07-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { trap_id: $.data.id, trap_st0: $.data.status, trap_units0: $.data.total_units_sold }
          trigger:
            - call: "POST /culinary/menu-period-reviews/${trap_id}/classify"
              as: CostAnalyst
              captures: { e_mix: $.data.error_id }
            - call: "POST /culinary/menu-period-reviews/${trap_id}/mix-lines"
              payload: { menu_item_id: "${mi_id}", units_sold: 100, gross_sales_cents: 40000 }
              as: CostAnalyst
              captures: { ml_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews/${trap_id}/classify"
              as: CostAnalyst
              captures: { trap_st: $.data.status }
            - call: "POST /culinary/menu-period-reviews/${trap_id}/close"
              as: CostAnalyst
              captures: { e_count: $.data.error_id }
            - call: "POST /culinary/menu-period-reviews/${trap_id}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 10500, received_base_units: 0, counted_base_units: 300 }
              as: CostAnalyst
              captures: { e_state: $.data.error_id }
            - call: "GET /culinary/menu-period-reviews/${trap_id}"
              as: CostAnalyst
              captures: { trap_st2: $.data.status, trap_closed: $.data.closed_at }
          assert:
            - "${trap_st0} == OPEN and ${trap_units0} == 0 — the initial state has neither dimension loaded"
            - "${e_mix} == ERR_EMPTY_MIX (422) — classify is legal from OPEN by the state machine, so this is a validation and not a state error"
            - "loading one mix line moves the review to MIX_LOADED and the second classify succeeds with ${trap_st} == CLASSIFIED"
            - "${e_count} == ERR_EMPTY_COUNT_SHEET (422) — the review is in the right state to close and still cannot"
            - "${e_state} == ERR_REVIEW_INVALID_STATE (409), NOT ERR_EMPTY_COUNT_SHEET: count lines only load from OPEN or MIX_LOADED, so the remedy for the previous error is itself refused"
            - "${trap_st2} == CLASSIFIED with ${trap_closed} == null — REV-TRAP is permanently stuck, which is the point: the legal order is mix, then counts, then classify, then close, and nothing reverses a classification"

      - name: the_logical_clock_refuses_to_move_backwards_but_accepts_standing_still
        claim_type: violation_to_error
        grounds:
          - validations[priority 46] ERR_CLOCK_NOT_MONOTONIC
          - endpoints[POST /culinary/_clock/set_current_utc]
        distinguishing_aspect: "The clock is the substrate every temporal rule in the domain reads, so its own boundary is worth pinning: an instant strictly before the current one is rejected, the SAME instant is accepted, and one millisecond later is accepted. Because the endpoint returns no body, the clock is observed indirectly through Ingredient.retired_at, which is documented to be stamped from the logical clock — this also proves the rejected call left the clock alone rather than half-advancing it."
        test_recipe:
          setup:
            - "Three unused ACTIVE ingredients CLOCK-A, CLOCK-B and CLOCK-C. No feed, recipe or menu item is needed: retire has no cost preconditions."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CLOCK-A", name: "Probe A", base_uom: "GRAM", pack_base_units: 1000, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 0, kcal_per_base_unit_micros: 1000000, sodium_mcg_per_base_unit: 10 }
              as: RecipeDeveloper
              captures: { a_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CLOCK-B", name: "Probe B", base_uom: "GRAM", pack_base_units: 1000, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 0, kcal_per_base_unit_micros: 1000000, sodium_mcg_per_base_unit: 10 }
              as: RecipeDeveloper
              captures: { b_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CLOCK-C", name: "Probe C", base_uom: "GRAM", pack_base_units: 1000, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 0, kcal_per_base_unit_micros: 1000000, sodium_mcg_per_base_unit: 10 }
              as: RecipeDeveloper
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /culinary/ingredients/${a_id}/retire"
              as: CulinaryDirector
              captures: { a_retired: $.data.retired_at, a_status: $.data.status }
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T23:59:59.999Z" }
              as: PlatformAdmin
              captures: { e_back: $.data.error_id }
            - call: "POST /culinary/ingredients/${b_id}/retire"
              as: CulinaryDirector
              captures: { b_retired: $.data.retired_at }
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.001Z" }
              as: PlatformAdmin
            - call: "POST /culinary/ingredients/${c_id}/retire"
              as: CulinaryDirector
              captures: { c_retired: $.data.retired_at }
          assert:
            - "${a_status} == RETIRED and ${a_retired} == 2026-08-10T00:00:00.000Z — the clock really moved from its 2026-08-01T00:00:00Z default and retired_at is stamped from it, not from wall-clock time"
            - "${e_back} == ERR_CLOCK_NOT_MONOTONIC (422) — one millisecond earlier is still earlier"
            - "${b_retired} == 2026-08-10T00:00:00.000Z — the rejected call did not move the clock even partially"
            - "re-setting the clock to the EXACT current instant 2026-08-10T00:00:00.000Z succeeds: the check is at-or-after, not strictly-after, so an idempotent set is legal"
            - "${c_retired} == 2026-08-10T00:00:00.001Z — a one-millisecond advance is accepted and observable, so the comparison is at millisecond resolution and not truncated to whole days"

  - section: endpoints
    instances:
      - name: component_delete_is_a_soft_remove_guarded_by_three_different_gates
        claim_type: standard_crud
        grounds:
          - endpoints[DELETE /culinary/recipe-components/{recipe_component_id}]
          - validations[priority 8] ERR_COMPONENT_NOT_FOUND
          - validations[priority 17] ERR_RECIPE_NOT_MUTABLE
          - validations[priority 28] ERR_COMPONENT_ALREADY_REMOVED
        distinguishing_aspect: "The D of CRUD is not a delete. The row survives with status REMOVED, keeps the extended_cost_micros the last roll-up wrote, and is still readable by id — while the owning recipe's derived counters, allergen mask and nutrition are recomputed from the survivors and its batch cost is deliberately NOT, so batch_cost_micros keeps a figure that no longer matches the component set until the next roll-up. Three distinct gates guard it: a missing row, an already-removed row and a recipe past UNDER_REVIEW."
        test_recipe:
          setup:
            - "CHEDDAR-BLOCK (mask 1 MILK, 6200 sodium mcg, 4000000 micro-kcal per base unit, pack 2268 at 22000000 micros) and WHEAT-FLOUR (mask 4 GLUTEN, 20 sodium mcg, 3500000 micro-kcal, pack 22680 at 12000000 micros), both PUBLISHED in MW with trim_yield 10000 and cook_shrink 0."
            - "DRAFT recipe PLATE-TWO (PLATED, EACH, batch 4, portions 4) with CHEDDAR ep 400 at sequence 1 and WHEAT-FLOUR ep 200 at sequence 2, rolled up under LATEST_PUBLISHED so both components carry an extended cost."
            - "DRAFT menu item MI-TWO in MW at 400 cents on PLATE-TWO with a FRESH plate cost, to observe the delete's menu-item cascade."
            - "A second recipe PLATE-ONE, CHEDDAR ep 400 only, driven all the way to ACTIVE so its component can be attacked while the recipe is immutable."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "WHEAT-FLOUR", name: "Bread Flour", base_uom: "GRAM", pack_base_units: 22680, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 4, kcal_per_base_unit_micros: 3500000, sodium_mcg_per_base_unit: 20 }
              as: RecipeDeveloper
              captures: { flour_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${flour_id}", pack_cost_micros: 12000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-TWO", name: "Two Component Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { two_id: $.data.id, two_v0: $.data.version }
            - call: "POST /culinary/recipes/${two_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${two_v0}" }
              as: RecipeDeveloper
              captures: { c_ched: $.data.id }
            - call: "GET /culinary/recipes/${two_id}"
              as: RecipeDeveloper
              captures: { two_v1: $.data.version }
            - call: "POST /culinary/recipes/${two_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${flour_id}", ep_quantity_base_units: 200, sequence_no: 2, expected_recipe_version: "${two_v1}" }
