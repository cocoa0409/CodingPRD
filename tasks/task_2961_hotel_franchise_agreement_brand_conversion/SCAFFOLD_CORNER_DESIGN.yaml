      - name: two_rules_violated_at_open_returns_the_lower_priority_number
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: open_rejected_with_life_safety_error_not_channel_not_connected
          rationale: "That priority_interaction instance already stages an open call that violates the life-safety gate at priority 22 and the channel gate at priority 36 simultaneously and pins the returned error to the lower priority number."

      - name: transfer_request_violating_two_rules_returns_the_first
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: transfer_request_rejected_with_default_block_not_proposed_owner_capacity
          rationale: "That priority_interaction instance already violates the default block at priority 26 and the transferee capacity floor at priority 48 in one call and asserts the priority-26 error, which is the priority-conflict pattern for this scaffold."

      - name: claim_filing_depends_on_the_units_own_status
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: encroachment_claim_filing_gated_by_existing_unit_operating_status
          rationale: "That cross_entity_condition instance already tests claim filing against both an OPERATING unit (accepted) and the same unit after suspension (refused with ERR_UNIT_NOT_OPERATING), which is the whole cross-entity validation claim."

      - name: approval_checks_run_in_dependency_order
        claim_type: cascading_validation
        excluded_because:
          difficulty_instance: approval_gated_by_encroachment_claim_status_until_overruled
          rationale: "That cross_entity_condition instance already shows the approval path refusing on the open-claim gate before any downstream verdict or waiver check can be reached, and then succeeding once the claim is overruled, which is the cascading-check-order claim."

