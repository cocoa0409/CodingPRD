              as_user_id: "officer-beta"
          assert:
            - "EqualOpportunityRequest.${eq}.owed_units == 5"
            - "EqualOpportunityRequest.${eq}.parity_basis_applied == DOLLAR_VALUE"
            - "EqualOpportunityRequest.${eq}.status == GRANTED"
            - "EqualOpportunityRequest.${eq}.granted_order_id == ${ord_g}"
            - "EqualOpportunityRequest.${eq}.fulfilled_units == 0"
            - "CommercialOrder.${ord_t}.gross_charge_cents == 570000"

  - rule_id: combinatorial_formula
    instances:
      - name: gross_charge_rounds_per_spot_then_sums_at_reselected_tier
        grounds:
          - calculations.order_gross_charge
          - entities.ScheduledSpot.fields.charged_rate_cents
          - entities.CommercialOrder.fields.gross_charge_cents
          - entities.CommercialOrder.fields.spot_count
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the answer: adding the fifth spot moves the
          order into the 5 percent volume tier, and rounding each spot's 7036.65-cent product to
          7037 before summing yields 35185, whereas summing first and rounding once yields 35183.
        test_recipe:
          setup:
            - "One station, one MORNING rate class with posted_rate_cents 12345, and one issue advertiser."
            - "A DRAFT order holding four 30-second spots on 2026-08-20; at four spots the volume tier is 0 percent, each spot is charged 7407 and gross_charge_cents is 29628."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WMRN-TV", licensee_name: "Morning Line Media LLC", market_code: "DMA-311", political_file_posting_deadline_hours: 24, daily_political_seconds_cap: 300 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-AM", daypart: "MORNING", preemptible: true, preemption_priority: 3, posted_rate_cents: 12345 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Empire Growth Fund", requested_class: "ISSUE" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv: $.data.id }
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv}", rate_class_id: "${rc}", payment_terms: "PREPAY", sponsorship_disclosure_text: "PAID FOR BY Empire Growth Fund", disclosure_duration_seconds: 5, agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 0, duration_seconds: 30, program_code: "AM-1" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { sp1: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 3600, duration_seconds: 30, program_code: "AM-2" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 7200, duration_seconds: 30, program_code: "AM-3" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 10800, duration_seconds: 30, program_code: "AM-4" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
          trigger:
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 14400, duration_seconds: 30, program_code: "AM-5" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { sp5: $.data.id }
          assert:
            - "ScheduledSpot.${sp5}.charged_rate_cents == 7037"
            - "ScheduledSpot.${sp1}.charged_rate_cents == 7037"
            - "CommercialOrder.${ord}.spot_count == 5"
            - "CommercialOrder.${ord}.gross_charge_cents == 35185"
            - "CommercialOrder.${ord}.net_due_cents == 35185"
            - "CommercialOrder.${ord}.agency_commission_cents == 0"

      - name: agency_commission_tier_keyed_on_gross_not_on_net_due
        grounds:
          - calculations.order_net_due
          - entities.CommercialOrder.fields.agency_commission_cents
          - entities.CommercialOrder.fields.net_due_cents
          - entities.CommercialOrder.fields.agency_placed
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency resolved by a pinned evaluation order: the
          commission tier is selected from gross_charge_cents 246000 (the 2 percent band) giving
          4920 and net_due 250920, even though net_due 250920 itself sits in the 3.5 percent band
          that a fixed-point reading would select to give 8610 and net_due 254610.
        test_recipe:
          setup:
            - "One station and one EARLY_NEWS rate class with posted_rate_cents 61500."
            - "An agency-placed DRAFT order holding three 30-second spots on 2026-08-20, gross_charge_cents 184500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WCOM-TV", licensee_name: "Commission Broadcast Group", market_code: "DMA-221", political_file_posting_deadline_hours: 24, daily_political_seconds_cap: 300 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-EN", daypart: "EARLY_NEWS", preemptible: false, preemption_priority: 0, posted_rate_cents: 61500 }
              as: PlatformAdmin
              as_user_id: "admin-01"
