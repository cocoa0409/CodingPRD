scenario: |
  1274. Product Placement & Brand Integration (brand integration agency): brand brief intake & script opportunity identification, integration approval by production & network standards, contract terms (guaranteed exposure/verbal mention) & fee, prop/product delivery & continuity tracking, clearance of competing brands, post-air verification & exposure measurement, cross-promotion obligation, disclosure requirements

domain_name: "product-placement-brand-integration"
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - conditional_feature_flags
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand display name" }
      - { name: category, type: enum, source: input, description: "Product category used for exclusivity clearance", constraints: "one of {BEVERAGE, AUTOMOTIVE, TECH, FOOD, BEAUTY, OTHER}" }
      - { name: watchlist_flag, type: boolean, source: input, description: "Agency watchlist flag; feeds clearance risk score", default: false }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "one of {ACTIVE, SUSPENDED}" }

  - name: BrandBrief
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; owning brand (path-scoped)" }
      - { name: title, type: string, source: input, description: "Brief title" }
      - { name: objective, type: string, source: input, description: "Campaign objective text" }
      - { name: budget_cents, type: integer, source: input, description: "Total budget ceiling in cents", constraints: ">= 0" }
      - { name: remaining_budget_cents, type: integer, source: computed, description: "budget_cents minus fees held by in-flight proposals and contracted base fees (see calculation brief_budget_remaining)" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: DRAFT, constraints: "one of {DRAFT, OPEN, CLOSED}" }

  - name: Series
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Series name" }
      - { name: network_name, type: string, source: input, description: "Airing network" }
      - { name: clearance_policy, type: enum, source: input, description: "Competing-brand clearance strictness for episodes of this series", default: STANDARD, constraints: "one of {STANDARD, STRICT}" }

  - name: Episode
    parent: null
    common_fields: true
    fields:
      - { name: series_id, type: string, source: input, description: "FK -> Series.id; parent series (path-scoped)" }
      - { name: episode_number, type: integer, source: input, description: "Episode number within series", constraints: ">= 1" }
      - { name: runtime_seconds, type: integer, source: input, description: "Total runtime; scene windows must fit inside [0, runtime_seconds)", constraints: "> 0" }
      - { name: air_date, type: datetime, source: input, description: "Scheduled air date-time (UTC ISO8601)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ProductionRep who created the episode; used by segregation-of-duties checks" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: SCRIPT_REVIEW, constraints: "one of {SCRIPT_REVIEW, LOCKED, AIRED, VERIFIED}" }

  - name: ScriptOpportunity
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; owning episode (path-scoped)" }
      - { name: scene_description, type: string, source: input, description: "Scene description from the script" }
      - { name: start_timecode_seconds, type: integer, source: input, description: "Scene window start (inclusive)", constraints: ">= 0" }
      - { name: end_timecode_seconds, type: integer, source: input, description: "Scene window end (exclusive); must be > start and <= episode.runtime_seconds" }
      - { name: estimated_exposure_seconds, type: integer, source: input, description: "Script-estimated on-screen seconds for the integrated product", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: IDENTIFIED, constraints: "one of {IDENTIFIED, PITCHED, RESERVED, CONSUMED, WITHDRAWN}" }

  - name: IntegrationProposal
    parent: null
    common_fields: true
    fields:
      - { name: brief_id, type: string, source: input, description: "FK -> BrandBrief.id; brief this proposal answers" }
      - { name: opportunity_id, type: string, source: input, description: "FK -> ScriptOpportunity.id; script opportunity being pitched" }
      - { name: proposed_fee_cents, type: integer, source: input, description: "Negotiated fee in cents", constraints: ">= guaranteed_seconds * rate_cents_per_second" }
      - { name: guaranteed_seconds, type: integer, source: input, description: "Guaranteed on-screen exposure seconds", constraints: "> 0" }
      - { name: guaranteed_verbal_mentions, type: integer, source: input, description: "Guaranteed verbal mention count", constraints: ">= 0" }
      - { name: cross_promo_owed_count, type: integer, source: input, description: "Cross-promotion obligations owed by the production", constraints: ">= 0" }
      - { name: rate_cents_per_second, type: number, source: input, description: "Negotiated per-second rate used for makegood/bonus math", constraints: "> 0" }
      - { name: terms_revision, type: integer, source: system, description: "Terms revision counter; starts at 1 and increments on each revision round" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: DRAFT, constraints: "one of {DRAFT, PRODUCTION_REVIEW, NETWORK_REVIEW, REVISION_REQUESTED, APPROVED, REJECTED, CONTRACTED, WITHDRAWN}" }

  - name: IntegrationContract
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> IntegrationProposal.id; source proposal (at most one contract per proposal)" }
      - { name: episode_id, type: string, source: system, description: "FK -> Episode.id; denormalized from the proposal's opportunity at creation" }
      - { name: base_fee_cents, type: integer, source: input, description: "Contract base fee in cents (initialized from proposal.proposed_fee_cents)" }
      - { name: guaranteed_seconds, type: integer, source: system, description: "Copied from proposal at creation" }
      - { name: guaranteed_verbal_mentions, type: integer, source: system, description: "Copied from proposal at creation" }
      - { name: rate_cents_per_second, type: number, source: system, description: "Copied from proposal at creation" }
      - { name: cross_promo_owed_count, type: integer, source: system, description: "Copied from proposal at creation" }
      - { name: provisional_value_cents, type: integer, source: computed, description: "Provisional settlement estimate at creation (see calculation contract_billing_value, variant provisional)" }
      - { name: bonus_cents, type: integer, source: computed, description: "Over-delivery bonus determined at verification", default: 0 }
      - { name: makegood_total_cents, type: integer, source: computed, description: "Sum of PENDING MakeGoodCredit amounts", default: 0 }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Amount the brand still owes: base fee at activation, adjusted by bonus/makegood at verification and restored on waive" }
      - { name: final_settlement_cents, type: integer, source: computed, description: "Final settled value (base + bonus - applied makegoods); null until SETTLED, reset to null on dispute", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: PENDING_SIGNATURE, constraints: "one of {PENDING_SIGNATURE, ACTIVE, UNDER_VERIFICATION, MAKEGOOD_REQUIRED, SETTLED, TERMINATED}" }

  - name: PropShipment
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> IntegrationContract.id; contract the props serve (path-scoped)" }
      - { name: item_description, type: string, source: input, description: "Prop/product description" }
      - { name: quantity, type: integer, source: input, description: "Units shipped", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: PENDING, constraints: "one of {PENDING, DISPATCHED, DELIVERED, STAGED, RETURN_REQUESTED, IN_RETURN, RETURNED, CANCELLED}" }

  - name: ContinuityRecord
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> IntegrationContract.id; contract this continuity note belongs to (path-scoped)" }
      - { name: shipment_id, type: string, source: input, description: "FK -> PropShipment.id; shipment whose props appear in the scene" }
      - { name: scene_timecode_seconds, type: integer, source: input, description: "Scene timecode the note refers to", constraints: ">= 0" }
      - { name: note, type: string, source: input, description: "Continuity note text" }
      - { name: status, type: enum, source: system, description: "LOGGED until voided by contract termination cascade", default: LOGGED, constraints: "one of {LOGGED, VOID}" }

  - name: CompetitiveClearance
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; episode requesting clearance (path-scoped)" }
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; brand being cleared" }
      - { name: category, type: enum, source: computed, description: "Copied from brand.category at creation; exclusivity is per (episode, category)" }
      - { name: risk_score, type: integer, source: computed, description: "Clearance conflict score at decision time (see calculation clearance_conflict_score)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding ClearanceOfficer; null until decided", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: REQUESTED, constraints: "one of {REQUESTED, GRANTED, DENIED, RELEASED}" }

  - name: AiringReport
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; aired episode (path-scoped)" }
      - { name: contract_id, type: string, source: input, description: "FK -> IntegrationContract.id; contract being verified" }
      - { name: measured_segments_seconds, type: array, source: input, description: "Measured on-screen exposure segments in seconds (numbers, may be fractional)", constraints: "non-empty; each element > 0" }
      - { name: measured_verbal_mentions, type: integer, source: input, description: "Measured verbal mention count", constraints: ">= 0" }
      - { name: measured_seconds, type: number, source: computed, description: "Sum of measured_segments_seconds" }
      - { name: measured_value_cents, type: integer, source: computed, description: "Per-segment rounded value sum (see calculation measured_exposure_valuation)" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the VerificationAnalyst who filed; verifier must differ (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: FILED, constraints: "one of {FILED, VERIFIED, DISPUTED, RE_MEASURED}" }

  - name: MakeGoodCredit
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> IntegrationContract.id; created by the verification cascade" }
      - { name: amount_cents, type: integer, source: computed, description: "Credit amount (see calculation makegood_compensation)" }
      - { name: reason, type: enum, source: system, description: "Why the credit was issued", constraints: "one of {EXPOSURE_SHORTFALL, VERBAL_MISS, COMBINED}" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: PENDING, constraints: "one of {PENDING, WAIVED}" }

  - name: CrossPromoObligation
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> IntegrationContract.id; created at contract activation" }
      - { name: owed_count, type: integer, source: system, description: "Promos owed; initialized from contract.cross_promo_owed_count and incremented by the makegood cascade" }
      - { name: fulfilled_count, type: integer, source: system, description: "Promos fulfilled so far", default: 0 }
      - { name: status, type: enum, source: system, description: "Derived from owed vs fulfilled", default: OWED, constraints: "one of {OWED, PARTIALLY_FULFILLED, FULFILLED}" }

  - name: DisclosureFiling
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> IntegrationContract.id; contract being disclosed (path-scoped)" }
      - { name: disclosure_text, type: string, source: input, description: "Sponsorship disclosure wording", constraints: "non-empty at file time" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: DRAFT, constraints: "one of {DRAFT, FILED, ACKNOWLEDGED}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Brand
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /brands/{id}/suspend"
        actor: AgencyAdmin
        preconditions: ["brand.status == ACTIVE"]
        side_effects: ["increments Brand.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /brands/{id}/resume"
        actor: AgencyAdmin
        preconditions: ["brand.status == SUSPENDED"]
        side_effects: ["increments Brand.version by 1"]

  - entity: BrandBrief
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /briefs/{id}/submit"
        actor: BrandRep
        preconditions:
          - "brief.status == DRAFT"
          - "acting BrandRep's X-User-ID == brief.brand_id"
          - "brief.budget_cents > 0"
        side_effects:
          - "increments BrandBrief.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /briefs/{id}/close"
        actor: BrandRep
        preconditions:
          - "brief.status == OPEN"
          - "acting BrandRep's X-User-ID == brief.brand_id"
          - "no IntegrationProposal with proposal.brief_id == brief.id in {DRAFT, PRODUCTION_REVIEW, NETWORK_REVIEW, REVISION_REQUESTED, APPROVED}"
        side_effects:
          - "increments BrandBrief.version by 1"

  - entity: Episode
    initial_state: SCRIPT_REVIEW
    terminal_states: [VERIFIED]
    transitions:
      - from: SCRIPT_REVIEW
        to: LOCKED
        trigger: "POST /episodes/{id}/lock"
        actor: ProductionRep
        preconditions: ["episode.status == SCRIPT_REVIEW"]
        side_effects: ["increments Episode.version by 1"]
      - from: LOCKED
        to: AIRED
        trigger: "POST /episodes/{id}/mark-aired"
        actor: ProductionRep
        preconditions:
          - "episode.status == LOCKED"
          - "logical clock >= episode.air_date"
        side_effects:
          - "every ScriptOpportunity with episode_id == episode.id and status == RESERVED transitions to CONSUMED"
          - "increments Episode.version by 1"
      - from: AIRED
        to: VERIFIED
        trigger: "system bubble-up after AiringReport verify or contract settle/terminate"
        actor: system
        preconditions:
          - "episode.status == AIRED"
          - "every IntegrationContract with episode_id == episode.id has status in {SETTLED, TERMINATED}"
          - "every AiringReport with episode_id == episode.id has status == VERIFIED"
          - "at least one IntegrationContract exists for the episode"
        side_effects: ["increments Episode.version by 1"]
        note: "compound/bubble-up transition evaluated after each verify, waive, or terminate side effect"

  - entity: ScriptOpportunity
    initial_state: IDENTIFIED
    terminal_states: [CONSUMED, WITHDRAWN]
    transitions:
      - from: IDENTIFIED
        to: PITCHED
        trigger: "POST /proposals (creation of a proposal referencing this opportunity)"
        actor: IntegrationManager
        preconditions: ["opportunity.status == IDENTIFIED"]
        side_effects: ["increments ScriptOpportunity.version by 1"]
      - from: PITCHED
        to: IDENTIFIED
        trigger: "proposal REJECTED (production-decision/network-decision REJECT) or WITHDRAWN"
        actor: system
        preconditions: ["opportunity.status == PITCHED"]
        side_effects: ["increments ScriptOpportunity.version by 1"]
      - from: PITCHED
        to: RESERVED
        trigger: "POST /proposals/{id}/contract (contract created from the APPROVED proposal)"
        actor: system
        preconditions: ["opportunity.status == PITCHED"]
        side_effects: ["increments ScriptOpportunity.version by 1"]
      - from: RESERVED
        to: IDENTIFIED
        trigger: "POST /contracts/{id}/terminate while contract is PENDING_SIGNATURE or ACTIVE"
        actor: system
        preconditions: ["opportunity.status == RESERVED"]
        side_effects: ["increments ScriptOpportunity.version by 1"]
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /episodes/{id}/mark-aired"
        actor: system
        preconditions: ["opportunity.status == RESERVED"]
        side_effects: ["increments ScriptOpportunity.version by 1"]
      - from: IDENTIFIED
        to: WITHDRAWN
        trigger: "POST /opportunities/{id}/withdraw"
        actor: ProductionRep
        preconditions: ["opportunity.status == IDENTIFIED"]
        side_effects: ["increments ScriptOpportunity.version by 1"]

  - entity: IntegrationProposal
    initial_state: DRAFT
    terminal_states: [REJECTED, CONTRACTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PRODUCTION_REVIEW
        trigger: "POST /proposals/{id}/submit"
        actor: IntegrationManager
        preconditions:
          - "proposal.status == DRAFT"
          - "brief of proposal.brief_id has status == OPEN"
          - "episode of proposal's opportunity has status in {SCRIPT_REVIEW, LOCKED}"
          - "proposal.proposed_fee_cents <= brief.remaining_budget_cents"
        side_effects:
          - "recompute brief.remaining_budget_cents (calculation brief_budget_remaining)"
          - "increments IntegrationProposal.version by 1"
      - from: PRODUCTION_REVIEW
        to: NETWORK_REVIEW
        trigger: "POST /proposals/{id}/production-decision with decision=APPROVE"
        actor: ProductionRep
        preconditions:
          - "proposal.status == PRODUCTION_REVIEW"
          - "acting X-User-ID != episode.created_by_user_id (segregation of duties)"
        side_effects: ["increments IntegrationProposal.version by 1"]
      - from: PRODUCTION_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /proposals/{id}/production-decision with decision=REQUEST_REVISION"
        actor: ProductionRep
        preconditions:
          - "proposal.status == PRODUCTION_REVIEW"
          - "acting X-User-ID != episode.created_by_user_id"
        side_effects: ["increments IntegrationProposal.version by 1"]
      - from: PRODUCTION_REVIEW
        to: REJECTED
        trigger: "POST /proposals/{id}/production-decision with decision=REJECT"
        actor: ProductionRep
        preconditions:
          - "proposal.status == PRODUCTION_REVIEW"
          - "acting X-User-ID != episode.created_by_user_id"
        side_effects:
          - "opportunity of proposal transitions PITCHED -> IDENTIFIED"
          - "recompute brief.remaining_budget_cents"
          - "increments IntegrationProposal.version by 1"
      - from: NETWORK_REVIEW
        to: APPROVED
        trigger: "POST /proposals/{id}/network-decision with decision=APPROVE"
        actor: NetworkStandardsReviewer
        preconditions: ["proposal.status == NETWORK_REVIEW"]
        side_effects: ["increments IntegrationProposal.version by 1"]
      - from: NETWORK_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /proposals/{id}/network-decision with decision=REQUEST_REVISION"
        actor: NetworkStandardsReviewer
        preconditions: ["proposal.status == NETWORK_REVIEW"]
        side_effects: ["increments IntegrationProposal.version by 1"]
      - from: NETWORK_REVIEW
        to: REJECTED
        trigger: "POST /proposals/{id}/network-decision with decision=REJECT"
        actor: NetworkStandardsReviewer
        preconditions: ["proposal.status == NETWORK_REVIEW"]
        side_effects:
          - "opportunity of proposal transitions PITCHED -> IDENTIFIED"
          - "recompute brief.remaining_budget_cents"
          - "increments IntegrationProposal.version by 1"
      - from: REVISION_REQUESTED
        to: PRODUCTION_REVIEW
        trigger: "POST /proposals/{id}/revisions (new terms with OCC expected_proposal_version)"
        actor: IntegrationManager
        preconditions: ["proposal.status == REVISION_REQUESTED"]
        side_effects:
          - "replace terms with the revision payload; increments terms_revision by 1"
          - "recompute brief.remaining_budget_cents with the new fee"
          - "increments IntegrationProposal.version by 1"
        note: "cycle PRODUCTION_REVIEW -> REVISION_REQUESTED -> PRODUCTION_REVIEW is the negotiation round loop"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /proposals/{id}/withdraw"
        actor: IntegrationManager
        preconditions: ["proposal.status == DRAFT"]
        side_effects:
          - "opportunity of proposal transitions PITCHED -> IDENTIFIED"
          - "increments IntegrationProposal.version by 1"
      - from: APPROVED
        to: CONTRACTED
        trigger: "POST /proposals/{id}/contract"
        actor: IntegrationManager
        preconditions:
          - "proposal.status == APPROVED"
          - "no existing IntegrationContract with proposal_id == proposal.id"
        side_effects:
          - "create IntegrationContract (status PENDING_SIGNATURE, provisional_value_cents via contract_billing_value provisional variant)"
          - "opportunity of proposal transitions PITCHED -> RESERVED"
          - "recompute brief.remaining_budget_cents (proposal now counted at contract base_fee)"
          - "increments IntegrationProposal.version by 1"

  - entity: IntegrationContract
    initial_state: PENDING_SIGNATURE
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: IntegrationManager
        preconditions:
          - "contract.status == PENDING_SIGNATURE"
          - "episode of contract has status == LOCKED"
          - "exists a CompetitiveClearance with episode_id == contract.episode_id and brand == proposal's brief's brand and status == GRANTED"
        side_effects:
          - "outstanding_balance_cents := base_fee_cents"
          - "create CrossPromoObligation (owed_count := contract.cross_promo_owed_count, fulfilled_count := 0, status FULFILLED if owed_count == 0 else OWED)"
          - "increments IntegrationContract.version by 1"
      - from: ACTIVE
        to: UNDER_VERIFICATION
        trigger: "POST /episodes/{id}/airing-reports (first report filed for this contract)"
        actor: system
        preconditions: ["contract.status == ACTIVE"]
        side_effects: ["increments IntegrationContract.version by 1"]
      - from: UNDER_VERIFICATION
        to: SETTLED
        trigger: "POST /airing-reports/{id}/verify when makegood_cents == 0"
        actor: VerificationAnalyst
        preconditions: ["contract.status == UNDER_VERIFICATION"]
        side_effects:
          - "bonus_cents := min(BONUS_CAP_PCT * base_fee_cents, max(0, measured_seconds - guaranteed_seconds) * rate_cents_per_second)"
          - "outstanding_balance_cents := base_fee_cents + bonus_cents"
          - "final_settlement_cents := base_fee_cents + bonus_cents"
          - "evaluate Episode bubble-up to VERIFIED"
          - "increments IntegrationContract.version by 1"
      - from: UNDER_VERIFICATION
        to: MAKEGOOD_REQUIRED
        trigger: "POST /airing-reports/{id}/verify when makegood_cents > 0"
        actor: VerificationAnalyst
        preconditions: ["contract.status == UNDER_VERIFICATION"]
        side_effects:
          - "bonus_cents := min(BONUS_CAP_PCT * base_fee_cents, max(0, measured_seconds - guaranteed_seconds) * rate_cents_per_second)"
          - "create MakeGoodCredit (status PENDING, amount_cents via makegood_compensation) [cascade link 1]"
          - "MakeGoodCredit creation increments CrossPromoObligation.owed_count by MAKEGOOD_PROMO_PENALTY and, if its status was FULFILLED, flips it to PARTIALLY_FULFILLED [cascade link 2]"
          - "makegood_total_cents := sum of PENDING MakeGoodCredit amounts"
          - "outstanding_balance_cents := base_fee_cents + bonus_cents - makegood_total_cents"
          - "increments IntegrationContract.version by 1"
      - from: MAKEGOOD_REQUIRED
        to: SETTLED
        trigger: "POST /makegood-credits/{id}/waive when no PENDING MakeGoodCredit remains for the contract"
        actor: system
        preconditions: ["contract.status == MAKEGOOD_REQUIRED", "count of PENDING MakeGoodCredit for contract == 0"]
        side_effects:
          - "final_settlement_cents := base_fee_cents + bonus_cents"
          - "evaluate Episode bubble-up to VERIFIED"
          - "increments IntegrationContract.version by 1"
      - from: SETTLED
        to: UNDER_VERIFICATION
        trigger: "POST /airing-reports/{id}/dispute on this contract's VERIFIED report"
        actor: BrandRep
        preconditions: ["contract.status == SETTLED"]
        side_effects:
          - "final_settlement_cents := null"
          - "outstanding_balance_cents := base_fee_cents"
          - "bonus_cents := 0"
          - "increments IntegrationContract.version by 1"
        note: "compensation transition: reopens settlement; bonus/makegood effects are reversed"
      - from: PENDING_SIGNATURE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: IntegrationManager
        preconditions: ["contract.status == PENDING_SIGNATURE"]
        side_effects:
          - "opportunity of proposal transitions RESERVED -> IDENTIFIED"
          - "recompute brief.remaining_budget_cents"
          - "increments IntegrationContract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: IntegrationManager
        preconditions: ["contract.status == ACTIVE"]
        side_effects:
          - "every PropShipment with contract_id == contract.id and status in {PENDING, DISPATCHED, DELIVERED, STAGED} transitions to RETURN_REQUESTED [cascade link 1]"
          - "each shipment entering RETURN_REQUESTED voids its ContinuityRecords: status LOGGED -> VOID [cascade link 2]"
          - "opportunity of proposal transitions RESERVED -> IDENTIFIED"
          - "recompute brief.remaining_budget_cents"
          - "evaluate Episode bubble-up to VERIFIED"
          - "increments IntegrationContract.version by 1"

  - entity: PropShipment
    initial_state: PENDING
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /shipments/{id}/advance with to=DISPATCHED"
        actor: IntegrationManager
        preconditions: ["shipment.status == PENDING", "contract.status == ACTIVE"]
        side_effects: ["increments PropShipment.version by 1"]
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /shipments/{id}/advance with to=DELIVERED"
        actor: IntegrationManager
        preconditions: ["shipment.status == DISPATCHED"]
        side_effects: ["increments PropShipment.version by 1"]
      - from: DELIVERED
        to: STAGED
        trigger: "POST /shipments/{id}/advance with to=STAGED"
        actor: IntegrationManager
        preconditions: ["shipment.status == DELIVERED"]
        side_effects: ["increments PropShipment.version by 1"]
      - from: DELIVERED
        to: RETURN_REQUESTED
        trigger: "POST /shipments/{id}/advance with to=RETURN_REQUESTED"
        actor: IntegrationManager
        preconditions: ["shipment.status == DELIVERED"]
        side_effects: ["increments PropShipment.version by 1"]
      - from: STAGED
        to: RETURN_REQUESTED
        trigger: "POST /shipments/{id}/advance with to=RETURN_REQUESTED or contract termination cascade"
        actor: IntegrationManager
        preconditions: ["shipment.status == STAGED"]
        side_effects:
          - "void this shipment's ContinuityRecords: status LOGGED -> VOID"
          - "increments PropShipment.version by 1"
      - from: RETURN_REQUESTED
        to: DISPATCHED
        trigger: "POST /shipments/{id}/advance with to=DISPATCHED (reshipment)"
        actor: IntegrationManager
        preconditions: ["shipment.status == RETURN_REQUESTED", "contract.status == ACTIVE"]
        side_effects: ["increments PropShipment.version by 1"]
        note: "cycle DISPATCHED -> DELIVERED -> RETURN_REQUESTED -> DISPATCHED covers defective-prop reshipment"
      - from: RETURN_REQUESTED
        to: IN_RETURN
        trigger: "POST /shipments/{id}/advance with to=IN_RETURN"
        actor: IntegrationManager
        preconditions: ["shipment.status == RETURN_REQUESTED"]
        side_effects: ["increments PropShipment.version by 1"]
      - from: IN_RETURN
        to: RETURNED
        trigger: "POST /shipments/{id}/advance with to=RETURNED"
        actor: IntegrationManager
        preconditions: ["shipment.status == IN_RETURN"]
        side_effects: ["increments PropShipment.version by 1"]
      - from: PENDING
        to: CANCELLED
        trigger: "POST /shipments/{id}/advance with to=CANCELLED"
        actor: IntegrationManager
        preconditions: ["shipment.status == PENDING"]
        side_effects: ["increments PropShipment.version by 1"]

  - entity: CompetitiveClearance
    initial_state: REQUESTED
    terminal_states: [DENIED, RELEASED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /clearances/{id}/decide with decision=GRANT"
        actor: ClearanceOfficer
        preconditions:
          - "clearance.status == REQUESTED"
          - "no other CompetitiveClearance with same episode_id, same category, status == GRANTED"
          - "no CompetitiveClearance on another episode with same category, status == GRANTED, and |air_date delta in days| within the policy window of this episode's series (STRICT: <= 7; STANDARD: < 7)"
          - "clearance_conflict_score below policy deny threshold (STRICT: >= 40 denies; STANDARD: >= 60 denies)"
        side_effects:
          - "decided_by_user_id := acting X-User-ID; risk_score computed and stored"
          - "increments CompetitiveClearance.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /clearances/{id}/decide with decision=DENY"
        actor: ClearanceOfficer
        preconditions: ["clearance.status == REQUESTED"]
        side_effects:
          - "decided_by_user_id := acting X-User-ID"
          - "increments CompetitiveClearance.version by 1"
      - from: GRANTED
        to: RELEASED
        trigger: "POST /clearances/{id}/release"
        actor: ClearanceOfficer
        preconditions: ["clearance.status == GRANTED"]
        side_effects: ["increments CompetitiveClearance.version by 1"]

  - entity: AiringReport
    initial_state: FILED
    terminal_states: []
    transitions:
      - from: FILED
        to: VERIFIED
        trigger: "POST /airing-reports/{id}/verify"
        actor: VerificationAnalyst
        preconditions:
          - "report.status in {FILED, RE_MEASURED}"
          - "acting X-User-ID != report.filed_by_user_id (segregation of duties)"
          - "exists a DisclosureFiling with contract_id == report.contract_id and status == ACKNOWLEDGED"
        side_effects:
          - "run contract_billing_value final variant + makegood_compensation; contract transitions to SETTLED (makegood == 0) or MAKEGOOD_REQUIRED (makegood > 0)"
          - "increments AiringReport.version by 1"
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /airing-reports/{id}/dispute"
        actor: BrandRep
        preconditions:
          - "report.status == VERIFIED"
          - "acting BrandRep's X-User-ID == brand of the report's contract"
        side_effects:
          - "contract transitions SETTLED -> UNDER_VERIFICATION with settlement fields reversed"
          - "increments AiringReport.version by 1"
      - from: DISPUTED
        to: RE_MEASURED
        trigger: "POST /airing-reports/{id}/remeasure"
        actor: VerificationAnalyst
        preconditions: ["report.status == DISPUTED"]
        side_effects:
          - "replace measured_segments_seconds and measured_verbal_mentions with payload; recompute measured_seconds and measured_value_cents"
          - "increments AiringReport.version by 1"
        note: "cycle VERIFIED -> DISPUTED -> RE_MEASURED -> VERIFIED"

  - entity: MakeGoodCredit
    initial_state: PENDING
    terminal_states: [WAIVED]
    transitions:
      - from: PENDING
        to: WAIVED
        trigger: "POST /makegood-credits/{id}/waive"
        actor: IntegrationManager
        preconditions: ["credit.status == PENDING"]
        side_effects:
          - "contract.outstanding_balance_cents += credit.amount_cents (compensation restores balance)"
          - "contract.makegood_total_cents -= credit.amount_cents"
          - "if no PENDING MakeGoodCredit remains for the contract and contract.status == MAKEGOOD_REQUIRED: contract -> SETTLED"
          - "increments MakeGoodCredit.version by 1"

  - entity: CrossPromoObligation
    initial_state: OWED
    terminal_states: []
    transitions:
      - from: OWED
        to: PARTIALLY_FULFILLED
        trigger: "POST /cross-promos/{id}/fulfill when fulfilled_count + 1 < owed_count"
        actor: IntegrationManager
        preconditions: ["obligation.status in {OWED, PARTIALLY_FULFILLED}"]
        side_effects: ["fulfilled_count += 1", "increments CrossPromoObligation.version by 1"]
      - from: OWED
        to: FULFILLED
        trigger: "POST /cross-promos/{id}/fulfill when fulfilled_count + 1 == owed_count"
        actor: IntegrationManager
        preconditions: ["obligation.status in {OWED, PARTIALLY_FULFILLED}"]
        side_effects: ["fulfilled_count += 1", "increments CrossPromoObligation.version by 1"]
      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "POST /cross-promos/{id}/fulfill when fulfilled_count + 1 == owed_count"
        actor: IntegrationManager
        preconditions: ["obligation.status in {OWED, PARTIALLY_FULFILLED}"]
        side_effects: ["fulfilled_count += 1", "increments CrossPromoObligation.version by 1"]
      - from: FULFILLED
        to: PARTIALLY_FULFILLED
        trigger: "system: makegood cascade increments owed_count on a FULFILLED obligation"
        actor: system
        preconditions: ["obligation.status == FULFILLED"]
        side_effects: ["increments CrossPromoObligation.version by 1"]

  - entity: DisclosureFiling
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /disclosures/{id}/file"
        actor: IntegrationManager
        preconditions:
          - "filing.status == DRAFT"
          - "filing.disclosure_text is non-empty"
          - "episode of the filing's contract has status in {SCRIPT_REVIEW, LOCKED} (pre-air)"
        side_effects: ["increments DisclosureFiling.version by 1"]
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "POST /disclosures/{id}/acknowledge"
        actor: NetworkStandardsReviewer
        preconditions: ["filing.status == FILED"]
        side_effects: ["increments DisclosureFiling.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: proposal-revision-stale-version
    parent_entity: IntegrationProposal
    write_endpoint: "POST /proposals/{id}/revisions"
    occ_field: "expected_proposal_version"
    description: |
      Submitting a revision against an IntegrationProposal whose version has
      advanced since the client last observed it is rejected. A revision
      legitimately supersedes the prior terms, so a writer holding a stale
      view of the proposal must re-read before its terms can win.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: clearance-create-stale-episode
    parent_entity: Episode
    write_endpoint: "POST /episodes/{id}/clearances"
    occ_field: "expected_episode_version"
    description: |
      Requesting a clearance against an Episode whose version has advanced
      since the client last observed it is rejected. Clearance requests
      legitimately stack on the same episode (each new request supersedes the
      requester's prior view of the episode's clearance set), so a requester
      holding a stale episode version must re-read before its request is
      evaluated against the current exclusivity state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-terms-stale-version
    parent_entity: IntegrationContract
    write_endpoint: "PATCH /contracts/{id}/terms"
    occ_field: "expected_contract_version"
    description: |
      Amending terms on an IntegrationContract whose version has advanced
      since the client last observed it is rejected. Each amendment supersedes
      the prior fee, so a stale writer's amendment must not silently overwrite
      terms it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contract_billing_value
    description: "Settlement value of a contract; provisional estimate at creation vs final value at verification"
    trigger: "contract creation (provisional variant); airing report verification (final variant)"
    algorithm: threshold
    formula: |
      provisional (at contract creation):
        projected_shortfall = max(0, contract.guaranteed_seconds - opportunity.estimated_exposure_seconds)
        provisional_value_cents = contract.base_fee_cents - round_half_up(projected_shortfall * contract.rate_cents_per_second * MAKEGOOD_MULTIPLIER, 0)
        (provisional ignores verbal-miss penalties: a script cannot evidence spoken mentions)
      final (at verification, report VERIFIED):
        bonus_cents = min(BONUS_CAP_PCT * base_fee_cents, max(0, report.measured_seconds - guaranteed_seconds) * rate_cents_per_second)
        makegood_cents = result of makegood_compensation
        final_settlement_cents = base_fee_cents + bonus_cents - (applied, i.e. non-WAIVED, makegood credits)
      rounding: all intermediate multiplications rounded to whole cents round_half_up at the step shown
    input_set: "provisional: the proposal's ScriptOpportunity (any status) + contract terms; final: the VERIFIED AiringReport for this contract only"
    constants:
      MAKEGOOD_MULTIPLIER: 1.5
      BONUS_CAP_PCT: 0.25
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: provisional
        when: "contract creation; uses script-estimated exposure seconds"
        difference: "uses estimated_exposure_seconds and ignores verbal-miss penalties"
      - name: final
        when: "airing report verification; uses measured exposure"
        difference: "uses measured_seconds/measured_verbal_mentions, adds bonus and verbal-miss penalties; different result for the same contract whenever measured != estimated"

  - name: clearance_conflict_score
    description: "Risk score for granting a CompetitiveClearance; policy variant changes window inclusivity and deny threshold"
    trigger: "POST /clearances/{id}/decide with decision=GRANT"
    algorithm: weighted_scoring
    formula: |
      let P = set of CompetitiveClearance with same category, status == GRANTED, on other episodes of any series
      proximity_hit = exists p in P with |air_date(p.episode) - air_date(this episode)| in days within window
        STRICT: window is |delta_days| <= 7 (inclusive)
        STANDARD: window is |delta_days| < 7 (exclusive of day 7)
      score = PROXIMITY_SCORE * (proximity_hit ? 1 : 0)
            + WATCHLIST_SCORE * (brand.watchlist_flag ? 1 : 0)
      deny decision=GRANT when score >= policy threshold
        STRICT: threshold 40
        STANDARD: threshold 60
    input_set: "clearances with status == GRANTED only; REQUESTED/DENIED/RELEASED excluded; same episode excluded (handled by exclusivity rule); ordering irrelevant (max-style aggregation)"
    constants:
      PROXIMITY_SCORE: 40
      WATCHLIST_SCORE: 30
      STRICT_WINDOW_DAYS: 7
      STANDARD_WINDOW_DAYS: 7
      STRICT_DENY_THRESHOLD: 40
      STANDARD_DENY_THRESHOLD: 60
    precision: "integer score"
    variants:
      - name: strict
        when: "episode's series has clearance_policy == STRICT"
        difference: "day-7 boundary counts as a conflict (|delta| <= 7) and deny threshold is 40: a pure proximity hit denies"
      - name: standard
        when: "episode's series has clearance_policy == STANDARD"
        difference: "day-7 boundary does NOT count (|delta| < 7) and threshold is 60: identical data yields score 0 and the grant succeeds"

  - name: measured_exposure_valuation
    description: "Monetized value of measured exposure; per-segment rounding then sum (pinned order)"
    trigger: "AiringReport creation and remeasure"
    algorithm: aggregation
    formula: |
      measured_value_cents = sum over each segment s in measured_segments_seconds of round_half_up(s * VALUE_RATE_CENTS_PER_SECOND, 0)
      measured_seconds = sum of measured_segments_seconds (unrounded sum)
      PINNED ORDER: round each per-segment product to whole cents FIRST, then sum.
      (Counter-order "sum seconds then round once" yields different cents, e.g. segments [3, 3] at 7.5: per-segment gives 23 + 23 = 46; sum-first gives round(45.0) = 45.)
    input_set: "the single AiringReport's measured_segments_seconds at creation or remeasure"
    constants:
      VALUE_RATE_CENTS_PER_SECOND: 7.5
    precision: "0 decimal places (whole cents), round_half_up per segment"

  - name: makegood_compensation
    description: "Make-good credit owed to the brand when delivery underperforms guarantees"
    trigger: "airing report verification when report.measured_seconds < contract.guaranteed_seconds OR report.measured_verbal_mentions < contract.guaranteed_verbal_mentions"
    algorithm: tiered_pricing
    formula: |
      shortfall_seconds = max(0, contract.guaranteed_seconds - report.measured_seconds)
      verbal_misses = max(0, contract.guaranteed_verbal_mentions - report.measured_verbal_mentions)
      shortfall_ratio = shortfall_seconds / contract.guaranteed_seconds
      raw = round_half_up(shortfall_seconds * contract.rate_cents_per_second * MAKEGOOD_MULTIPLIER, 0)
          + verbal_misses * VERBAL_MISS_PENALTY_CENTS
      if shortfall_ratio >= SEVERE_SHORTFALL_RATIO: raw = round_half_up(raw * SEVERE_SURCHARGE, 0)
      makegood_cents = min(contract.base_fee_cents, raw)
      reason = COMBINED if shortfall_seconds > 0 and verbal_misses > 0
               else EXPOSURE_SHORTFALL if shortfall_seconds > 0
               else VERBAL_MISS
      evaluation order pinned: shortfall terms first, severity surcharge second, fee cap last
    input_set: "the single VERIFIED AiringReport for the contract; exactly one MakeGoodCredit per verification"
    constants:
      MAKEGOOD_MULTIPLIER: 1.5
      VERBAL_MISS_PENALTY_CENTS: 5000
      SEVERE_SHORTFALL_RATIO: 0.5
      SEVERE_SURCHARGE: 1.2
      MAKEGOOD_PROMO_PENALTY: 1
    precision: "0 decimal places (whole cents), round_half_up"

  - name: brief_budget_remaining
    description: "Remaining budget on a brief after in-flight proposal holds and contracted fees"
    trigger: "proposal create/submit/reject/withdraw/revision; contract create; contract terminate; terms amend"
    algorithm: aggregation
    formula: |
      remaining_budget_cents = budget_cents
        - sum(proposal.proposed_fee_cents for proposals of brief with status in {DRAFT, PRODUCTION_REVIEW, NETWORK_REVIEW, REVISION_REQUESTED, APPROVED})
        - sum(contract.base_fee_cents for contracts whose proposal belongs to brief with contract.status in {PENDING_SIGNATURE, ACTIVE, UNDER_VERIFICATION, MAKEGOOD_REQUIRED, SETTLED})
      (TERMINATED contracts release their hold; REJECTED/WITHDRAWN proposals release theirs)
    input_set: "all IntegrationProposal rows with brief_id == brief.id (status filter as above) plus their contracts"
    constants: {}
    precision: "integer cents; incremental recompute on each trigger must equal full recompute"

  - name: cross_promo_balance
    description: "Obligation status from owed vs fulfilled counts"
    trigger: "contract activation (creation), cross-promo fulfill, makegood cascade increment"
    algorithm: threshold
    formula: |
      at creation: status = FULFILLED if owed_count == 0 else OWED
      on fulfill: fulfilled_count += 1; status = FULFILLED if fulfilled_count == owed_count else PARTIALLY_FULFILLED (OWED only while fulfilled_count == 0)
      on makegood cascade: owed_count += MAKEGOOD_PROMO_PENALTY; if status == FULFILLED then status = PARTIALLY_FULFILLED
      boundary: fulfilled_count == owed_count means FULFILLED (>= semantics; fulfilling beyond owed_count is rejected by state precondition)
    input_set: "the single CrossPromoObligation row of the contract"
    constants:
      MAKEGOOD_PROMO_PENALTY: 1
    precision: "integer counts"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "ownership: BrandRep X-User-ID equals the brand id of the scoped resource (brief create/submit/close; report dispute resolves brand via contract's proposal's brief); segregation-of-identity checks on decisions are at priority 7"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: ["POST /brands/{id}/briefs", "POST /briefs/{id}/submit", "POST /briefs/{id}/close", "POST /airing-reports/{id}/dispute"]
  - priority: 4
    category: existence
    check: "request body shape: required fields present, types match, enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: existence
    check: "path and body-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: state
    check: "target entity in a valid from-state for the transition; from terminal states the error is ERR_ALREADY_TERMINAL"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "operation attempted on an entity in a terminal state (CLOSED brief, REJECTED/CONTRACTED/WITHDRAWN proposal, TERMINATED contract, RETURNED/CANCELLED shipment, DENIED/RELEASED clearance, WAIVED credit, ACKNOWLEDGED filing, CONSUMED/WITHDRAWN opportunity)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints on terminal entities"
  - priority: 7
    category: business_safety
    check: "segregation of duties: production-decision actor != episode.created_by_user_id; airing-report verify actor != report.filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /proposals/{id}/production-decision", "POST /airing-reports/{id}/verify"]
  - priority: 7
    category: business_safety
    check: "disclosure compliance: an ACKNOWLEDGED DisclosureFiling for the contract must exist before a report can be verified"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: ["POST /airing-reports/{id}/verify"]
  - priority: 8
    category: business_constraint
    check: "scene window sanity: 0 <= start_timecode_seconds < end_timecode_seconds <= episode.runtime_seconds"
    error_id: ERR_INVALID_SCENE_WINDOW
    http_status: 400
    applies_to: ["POST /episodes/{id}/opportunities"]
  - priority: 8
    category: business_constraint
    check: "scene window overlap: half-open [start, end) intersection with any opportunity of the same episode in {IDENTIFIED, PITCHED, RESERVED} is rejected; touching endpoints (a.end == b.start) do not overlap"
    error_id: ERR_SCENE_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /episodes/{id}/opportunities"]
  - priority: 8
    category: business_constraint
    check: "opportunity availability: proposal creation requires opportunity.status == IDENTIFIED"
    error_id: ERR_OPPORTUNITY_UNAVAILABLE
    http_status: 409
    applies_to: ["POST /proposals"]
  - priority: 8
    category: business_constraint
    check: "category exclusivity: at most one GRANTED clearance per (episode_id, category)"
    error_id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: ["POST /clearances/{id}/decide"]
  - priority: 8
    category: business_constraint
    check: "activation prerequisites: episode LOCKED (else ERR_EPISODE_NOT_LOCKED) and a GRANTED clearance exists for (episode, brand category) (else ERR_CLEARANCE_REQUIRED)"
    error_id: ERR_EPISODE_NOT_LOCKED
    http_status: 409
    applies_to: ["POST /contracts/{id}/activate"]
  - priority: 8
    category: business_constraint
    check: "activation clearance prerequisite (checked after ERR_EPISODE_NOT_LOCKED)"
    error_id: ERR_CLEARANCE_REQUIRED
    http_status: 409
    applies_to: ["POST /contracts/{id}/activate"]
  - priority: 9
    category: business_temporal
    check: "episode already aired: proposals and clearance requests cannot be created once the episode has status AIRED or VERIFIED; disclosure filings cannot be filed once aired"
    error_id: ERR_EPISODE_ALREADY_AIRED
    http_status: 409
    applies_to: ["POST /proposals", "POST /episodes/{id}/clearances", "POST /disclosures/{id}/file"]
  - priority: 9
    category: business_temporal
    check: "air-date proximity: GRANT decision rejected when a GRANTED same-category clearance exists on another episode whose air_date is within the policy window (STRICT: |delta_days| <= 7; STANDARD: |delta_days| < 7)"
    error_id: ERR_AIRDATE_PROXIMITY_CONFLICT
    http_status: 409
    applies_to: ["POST /clearances/{id}/decide"]
  - priority: 9
    category: business_temporal
    check: "airing report filing requires episode status AIRED (or VERIFIED)"
    error_id: ERR_EPISODE_NOT_AIRED
    http_status: 409
    applies_to: ["POST /episodes/{id}/airing-reports"]
  - priority: 9
    category: business_temporal
    check: "mark-aired requires logical clock >= episode.air_date"
    error_id: ERR_AIR_DATE_NOT_REACHED
    http_status: 409
    applies_to: ["POST /episodes/{id}/mark-aired"]
  - priority: 10
    category: business_referential
    check: "brief must be OPEN to create a proposal against it"
    error_id: ERR_BRIEF_NOT_OPEN
    http_status: 409
    applies_to: ["POST /proposals"]
  - priority: 10
    category: business_referential
    check: "brand must be ACTIVE to create proposals or clearance requests referencing it"
    error_id: ERR_BRAND_SUSPENDED
    http_status: 409
    applies_to: ["POST /proposals", "POST /episodes/{id}/clearances"]
  - priority: 11
    category: business_fiscal
    check: "fee floor: proposed/base fee >= guaranteed_seconds * rate_cents_per_second"
    error_id: ERR_FEE_BELOW_MINIMUM
    http_status: 400
    applies_to: ["POST /proposals", "POST /proposals/{id}/revisions", "PATCH /contracts/{id}/terms"]
  - priority: 11
    category: business_fiscal
    check: "budget ceiling: fee <= brief.remaining_budget_cents; for revisions and terms amend the entity's own current hold is added back first (revision: fee <= remaining + proposal's current proposed_fee_cents; terms amend: fee <= remaining + contract's current base_fee_cents); checked after fee floor"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: ["POST /proposals", "POST /proposals/{id}/submit", "POST /proposals/{id}/revisions", "PATCH /contracts/{id}/terms"]
  - priority: 12
    category: business_referential
    check: "continuity record's shipment_id must reference a PropShipment of the same contract"
    error_id: ERR_SHIPMENT_CONTRACT_MISMATCH
    http_status: 422
    applies_to: ["POST /contracts/{id}/continuity-records"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Brand & Brief ----
  - method: POST
    path: "/brands"
    description: "Register a brand client"
    roles: [AgencyAdmin]
    code: 201
    input: [name, category,"watchlist_flag?"]
    output: Brand
    side_effects: []
  - method: GET
    path: "/brands/{id}"
    description: "Fetch a brand"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, ClearanceOfficer, VerificationAnalyst]
    code: 200
    input: []
    output: Brand
    side_effects: []
  - method: POST
    path: "/brands/{id}/suspend"
    description: "Suspend a brand (blocks new proposals/clearances)"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Brand
    side_effects: ["Brand ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/brands/{id}/resume"
    description: "Resume a suspended brand"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Brand
    side_effects: ["Brand SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/brands/{id}/briefs"
    description: "Create a brand brief (BrandRep of that brand)"
    roles: [BrandRep]
    code: 201
    input: [title, objective, budget_cents]
    output: BrandBrief
    side_effects: ["remaining_budget_cents := budget_cents"]
  - method: GET
    path: "/brands/{id}/briefs"
    description: "List briefs of a brand"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ClearanceOfficer, VerificationAnalyst, ProductionRep, NetworkStandardsReviewer]
    code: 200
    input: ["limit?","offset?","status?"]
    output: BrandBrief[]
    side_effects: []
  - method: GET
    path: "/brands/{id}/clearances"
    description: "List clearances referencing a brand"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ClearanceOfficer]
    code: 200
    input: ["limit?","offset?","status?"]
    output: CompetitiveClearance[]
    side_effects: []
  - method: GET
    path: "/briefs/{id}"
    description: "Fetch a brief (includes computed remaining_budget_cents)"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ClearanceOfficer, VerificationAnalyst, ProductionRep, NetworkStandardsReviewer]
    code: 200
    input: []
    output: BrandBrief
    side_effects: []
  - method: POST
    path: "/briefs/{id}/submit"
    description: "Open a brief for proposals"
    roles: [BrandRep]
    code: 200
    input: []
    output: BrandBrief
    side_effects: ["BrandBrief DRAFT -> OPEN"]
  - method: POST
    path: "/briefs/{id}/close"
    description: "Close a brief (requires no in-flight proposals)"
    roles: [BrandRep]
    code: 200
    input: []
    output: BrandBrief
    side_effects: ["BrandBrief OPEN -> CLOSED"]
  - method: GET
    path: "/briefs/{id}/proposals"
    description: "List proposals answering a brief"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer]
    code: 200
    input: ["limit?","offset?","status?"]
    output: IntegrationProposal[]
    side_effects: []

  # ---- Series / Episode / Opportunity ----
  - method: POST
    path: "/series"
    description: "Register a series"
    roles: [AgencyAdmin]
    code: 201
    input: [name, network_name,"clearance_policy?"]
    output: Series
    side_effects: []
  - method: GET
    path: "/series/{id}"
    description: "Fetch a series"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, ClearanceOfficer, VerificationAnalyst]
    code: 200
    input: []
    output: Series
    side_effects: []
  - method: POST
    path: "/series/{id}/episodes"
    description: "Create an episode under a series; created_by_user_id stamped from X-User-ID"
    roles: [ProductionRep]
    code: 201
    input: [episode_number, runtime_seconds, air_date]
    output: Episode
    side_effects: []
  - method: GET
    path: "/series/{id}/episodes"
    description: "List episodes of a series"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, ClearanceOfficer, VerificationAnalyst]
    code: 200
    input: ["limit?","offset?","status?"]
    output: Episode[]
    side_effects: []
  - method: GET
    path: "/episodes/{id}"
    description: "Fetch an episode"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, ClearanceOfficer, VerificationAnalyst]
    code: 200
    input: []
    output: Episode
    side_effects: []
  - method: POST
    path: "/episodes/{id}/lock"
    description: "Lock the script (SCRIPT_REVIEW -> LOCKED)"
    roles: [ProductionRep]
    code: 200
    input: []
    output: Episode
    side_effects: ["Episode SCRIPT_REVIEW -> LOCKED"]
  - method: POST
    path: "/episodes/{id}/mark-aired"
    description: "Mark episode aired at/after air_date; RESERVED opportunities become CONSUMED"
    roles: [ProductionRep]
    code: 200
    input: []
    output: Episode
    side_effects: ["Episode LOCKED -> AIRED", "ScriptOpportunity RESERVED -> CONSUMED for episode"]
  - method: POST
    path: "/episodes/{id}/opportunities"
    description: "Identify a script opportunity (scene window) in a SCRIPT_REVIEW episode"
    roles: [ProductionRep]
    code: 201
    input: [scene_description, start_timecode_seconds, end_timecode_seconds, estimated_exposure_seconds]
    output: ScriptOpportunity
    side_effects: []
  - method: GET
    path: "/episodes/{id}/opportunities"
    description: "List opportunities of an episode"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, ClearanceOfficer, VerificationAnalyst]
    code: 200
    input: ["limit?","offset?","status?"]
    output: ScriptOpportunity[]
    side_effects: []
  - method: GET
    path: "/opportunities/{id}"
    description: "Fetch an opportunity"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, ClearanceOfficer, VerificationAnalyst]
    code: 200
    input: []
    output: ScriptOpportunity
    side_effects: []
  - method: POST
    path: "/opportunities/{id}/withdraw"
    description: "Withdraw an unpitched opportunity"
    roles: [ProductionRep]
    code: 200
    input: []
    output: ScriptOpportunity
    side_effects: ["ScriptOpportunity IDENTIFIED -> WITHDRAWN"]
  - method: GET
    path: "/opportunities/{id}/proposals"
    description: "List proposals referencing an opportunity"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer]
    code: 200
    input: ["limit?","offset?","status?"]
    output: IntegrationProposal[]
    side_effects: []

  # ---- Clearance ----
  - method: POST
    path: "/episodes/{id}/clearances"
    description: "Request competitive clearance of a brand for an episode (OCC on Episode.version); increments Episode.version by 1"
    roles: [IntegrationManager]
    code: 201
    input: [brand_id, expected_episode_version]
    output: CompetitiveClearance
    side_effects: ["increments Episode.version by 1", "category copied from brand.category"]
  - method: GET
    path: "/episodes/{id}/clearances"
    description: "List clearances of an episode"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ClearanceOfficer, NetworkStandardsReviewer]
    code: 200
    input: ["limit?","offset?","status?"]
    output: CompetitiveClearance[]
    side_effects: []
  - method: POST
    path: "/clearances/{id}/decide"
    description: "Grant or deny a clearance request (exclusivity, proximity, and risk-score checks on GRANT)"
    roles: [ClearanceOfficer]
    code: 200
    input: [decision]
    output: CompetitiveClearance
    side_effects: ["CompetitiveClearance REQUESTED -> GRANTED or DENIED", "risk_score computed on GRANT attempt"]
  - method: POST
    path: "/clearances/{id}/release"
    description: "Release a granted clearance, freeing the (episode, category) slot"
    roles: [ClearanceOfficer]
    code: 200
    input: []
    output: CompetitiveClearance
    side_effects: ["CompetitiveClearance GRANTED -> RELEASED"]

  # ---- Proposal ----
  - method: POST
    path: "/proposals"
    description: "Create an integration proposal against a brief and an opportunity"
    roles: [IntegrationManager]
    code: 201
    input: [brief_id, opportunity_id, proposed_fee_cents, guaranteed_seconds, guaranteed_verbal_mentions, cross_promo_owed_count, rate_cents_per_second]
    output: IntegrationProposal
    side_effects: ["ScriptOpportunity IDENTIFIED -> PITCHED", "terms_revision := 1", "recompute brief.remaining_budget_cents"]
  - method: GET
    path: "/proposals/{id}"
    description: "Fetch a proposal"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, ClearanceOfficer, VerificationAnalyst]
    code: 200
    input: []
    output: IntegrationProposal
    side_effects: []
  - method: POST
    path: "/proposals/{id}/submit"
    description: "Submit a DRAFT proposal to production review"
    roles: [IntegrationManager]
    code: 200
    input: []
    output: IntegrationProposal
    side_effects: ["IntegrationProposal DRAFT -> PRODUCTION_REVIEW", "recompute brief.remaining_budget_cents"]
  - method: POST
    path: "/proposals/{id}/production-decision"
    description: "Production approve / request-revision / reject (actor must differ from episode creator)"
    roles: [ProductionRep]
    code: 200
    input: [decision,"note?"]
    output: IntegrationProposal
    side_effects: ["IntegrationProposal PRODUCTION_REVIEW -> NETWORK_REVIEW | REVISION_REQUESTED | REJECTED", "on REJECT: opportunity PITCHED -> IDENTIFIED, budget recompute"]
  - method: POST
    path: "/proposals/{id}/network-decision"
    description: "Network standards approve / request-revision / reject"
    roles: [NetworkStandardsReviewer]
    code: 200
    input: [decision,"note?"]
    output: IntegrationProposal
    side_effects: ["IntegrationProposal NETWORK_REVIEW -> APPROVED | REVISION_REQUESTED | REJECTED", "on REJECT: opportunity PITCHED -> IDENTIFIED, budget recompute"]
  - method: POST
    path: "/proposals/{id}/revisions"
    description: "Submit revised terms for a REVISION_REQUESTED proposal (OCC on IntegrationProposal.version); increments IntegrationProposal.version by 1"
    roles: [IntegrationManager]
    code: 200
    input: [proposed_fee_cents, guaranteed_seconds, guaranteed_verbal_mentions, cross_promo_owed_count, rate_cents_per_second, expected_proposal_version]
    output: IntegrationProposal
    side_effects: ["IntegrationProposal REVISION_REQUESTED -> PRODUCTION_REVIEW", "terms_revision += 1", "recompute brief.remaining_budget_cents", "increments IntegrationProposal.version by 1"]
  - method: POST
    path: "/proposals/{id}/withdraw"
    description: "Withdraw a DRAFT proposal"
    roles: [IntegrationManager]
    code: 200
    input: []
    output: IntegrationProposal
    side_effects: ["IntegrationProposal DRAFT -> WITHDRAWN", "opportunity PITCHED -> IDENTIFIED"]
  - method: POST
    path: "/proposals/{id}/contract"
    description: "Create the integration contract from an APPROVED proposal"
    roles: [IntegrationManager]
    code: 201
    input: []
    output: IntegrationContract
    side_effects: ["IntegrationProposal APPROVED -> CONTRACTED", "ScriptOpportunity PITCHED -> RESERVED", "contract PENDING_SIGNATURE created with provisional_value_cents (contract_billing_value provisional)", "recompute brief.remaining_budget_cents"]
  - method: GET
    path: "/proposals/{id}/contracts"
    description: "List contracts of a proposal (length 0 or 1)"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, VerificationAnalyst]
    code: 200
    input: ["limit?","offset?"]
    output: IntegrationContract[]
    side_effects: []

  # ---- Contract ----
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, ClearanceOfficer, VerificationAnalyst]
    code: 200
    input: []
    output: IntegrationContract
    side_effects: []
  - method: GET
    path: "/episodes/{id}/contracts"
    description: "List contracts tied to an episode"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, VerificationAnalyst]
    code: 200
    input: ["limit?","offset?","status?"]
    output: IntegrationContract[]
    side_effects: []
  - method: PATCH
    path: "/contracts/{id}/terms"
    description: "Amend the base fee while PENDING_SIGNATURE (OCC on IntegrationContract.version); increments IntegrationContract.version by 1"
    roles: [IntegrationManager]
    code: 200
    input: [base_fee_cents, expected_contract_version]
    output: IntegrationContract
    side_effects: ["base_fee_cents updated", "provisional_value_cents recomputed", "recompute brief.remaining_budget_cents", "increments IntegrationContract.version by 1"]
  - method: POST
    path: "/contracts/{id}/activate"
    description: "Sign/activate a contract (requires LOCKED episode and GRANTED clearance)"
    roles: [IntegrationManager]
    code: 200
    input: []
    output: IntegrationContract
    side_effects: ["IntegrationContract PENDING_SIGNATURE -> ACTIVE", "outstanding_balance_cents := base_fee_cents", "create CrossPromoObligation"]
  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate a contract; cascades to shipments and continuity records"
    roles: [IntegrationManager]
    code: 200
    input: []
    output: IntegrationContract
    side_effects: ["IntegrationContract -> TERMINATED", "shipments in {PENDING, DISPATCHED, DELIVERED, STAGED} -> RETURN_REQUESTED", "ContinuityRecord LOGGED -> VOID via returned shipments", "opportunity RESERVED -> IDENTIFIED", "budget recompute", "Episode bubble-up evaluation"]
  - method: GET
    path: "/contracts/{id}/ledger"
    description: "Computed ledger view of a contract"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, VerificationAnalyst]
    code: 200
    input: []
    output: { base_fee_cents: integer, bonus_cents: integer, makegood_total_cents: integer, outstanding_balance_cents: integer, provisional_value_cents: integer, final_settlement_cents: integer }
    side_effects: []

  # ---- Shipment & Continuity ----
  - method: POST
    path: "/contracts/{id}/shipments"
    description: "Create a prop shipment for an ACTIVE or PENDING_SIGNATURE contract"
    roles: [IntegrationManager]
    code: 201
    input: [item_description, quantity]
    output: PropShipment
    side_effects: []
  - method: GET
    path: "/contracts/{id}/shipments"
    description: "List shipments of a contract"
    roles: [AgencyAdmin, IntegrationManager, ProductionRep]
    code: 200
    input: ["limit?","offset?","status?"]
    output: PropShipment[]
    side_effects: []
  - method: GET
    path: "/shipments/{id}"
    description: "Fetch a shipment"
    roles: [AgencyAdmin, IntegrationManager, ProductionRep]
    code: 200
    input: []
    output: PropShipment
    side_effects: []
  - method: POST
    path: "/shipments/{id}/advance"
    description: "Advance a shipment along its lifecycle (to: DISPATCHED | DELIVERED | STAGED | RETURN_REQUESTED | IN_RETURN | RETURNED | CANCELLED)"
    roles: [IntegrationManager]
    code: 200
    input: [to]
    output: PropShipment
    side_effects: ["PropShipment transition per state machine", "on entering RETURN_REQUESTED: ContinuityRecord LOGGED -> VOID"]
  - method: POST
    path: "/contracts/{id}/continuity-records"
    description: "Log a continuity record tying a shipment's props to a scene timecode"
    roles: [ProductionRep]
    code: 201
    input: [shipment_id, scene_timecode_seconds, note]
    output: ContinuityRecord
    side_effects: []
  - method: GET
    path: "/contracts/{id}/continuity-records"
    description: "List continuity records of a contract"
    roles: [AgencyAdmin, IntegrationManager, ProductionRep]
    code: 200
    input: ["limit?","offset?","status?"]
    output: ContinuityRecord[]
    side_effects: []
  - method: GET
    path: "/shipments/{id}/continuity-records"
    description: "List continuity records referencing a shipment"
    roles: [AgencyAdmin, IntegrationManager, ProductionRep]
    code: 200
    input: ["limit?","offset?","status?"]
    output: ContinuityRecord[]
    side_effects: []

  # ---- Airing report / verification / makegood ----
  - method: POST
    path: "/episodes/{id}/airing-reports"
    description: "File a post-air measurement report for a contract of this episode (episode must be AIRED)"
    roles: [VerificationAnalyst]
    code: 201
    input: [contract_id, measured_segments_seconds, measured_verbal_mentions]
    output: AiringReport
    side_effects: ["measured_seconds and measured_value_cents computed (measured_exposure_valuation)", "filed_by_user_id stamped", "contract ACTIVE -> UNDER_VERIFICATION"]
  - method: GET
    path: "/episodes/{id}/airing-reports"
    description: "List airing reports of an episode"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, VerificationAnalyst]
    code: 200
    input: ["limit?","offset?","status?"]
    output: AiringReport[]
    side_effects: []
  - method: GET
    path: "/contracts/{id}/airing-reports"
    description: "List airing reports of a contract"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep, NetworkStandardsReviewer, VerificationAnalyst]
    code: 200
    input: ["limit?","offset?","status?"]
    output: AiringReport[]
    side_effects: []
  - method: POST
    path: "/airing-reports/{id}/verify"
    description: "Verify a filed/re-measured report; settles the contract or opens a makegood (SoD: verifier != filer)"
    roles: [VerificationAnalyst]
    code: 200
    input: []
    output: AiringReport
    side_effects: ["AiringReport -> VERIFIED", "contract SETTLED or MAKEGOOD_REQUIRED with bonus/makegood computation", "makegood cascade increments CrossPromoObligation.owed_count", "Episode bubble-up evaluation"]
  - method: POST
    path: "/airing-reports/{id}/dispute"
    description: "Brand disputes a VERIFIED report; reopens contract settlement"
    roles: [BrandRep]
    code: 200
    input: []
    output: AiringReport
    side_effects: ["AiringReport VERIFIED -> DISPUTED", "contract SETTLED -> UNDER_VERIFICATION with settlement reversal"]
  - method: POST
    path: "/airing-reports/{id}/remeasure"
    description: "Re-measure a DISPUTED report with corrected segments"
    roles: [VerificationAnalyst]
    code: 200
    input: [measured_segments_seconds, measured_verbal_mentions]
    output: AiringReport
    side_effects: ["AiringReport DISPUTED -> RE_MEASURED", "measured_seconds and measured_value_cents recomputed"]
  - method: GET
    path: "/contracts/{id}/makegood-credits"
    description: "List makegood credits of a contract"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, VerificationAnalyst]
    code: 200
    input: ["limit?","offset?","status?"]
    output: MakeGoodCredit[]
    side_effects: []
  - method: POST
    path: "/makegood-credits/{id}/waive"
    description: "Waive a PENDING makegood credit; restores contract outstanding balance and may settle the contract"
    roles: [IntegrationManager]
    code: 200
    input: []
    output: MakeGoodCredit
    side_effects: ["MakeGoodCredit PENDING -> WAIVED", "contract.outstanding_balance_cents += amount_cents", "contract MAKEGOOD_REQUIRED -> SETTLED when no PENDING credits remain", "Episode bubble-up evaluation"]

  # ---- Cross-promotion & disclosure ----
  - method: GET
    path: "/contracts/{id}/cross-promos"
    description: "List cross-promotion obligations of a contract"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, ProductionRep]
    code: 200
    input: ["limit?","offset?","status?"]
    output: CrossPromoObligation[]
    side_effects: []
  - method: POST
    path: "/cross-promos/{id}/fulfill"
    description: "Record one fulfilled cross-promotion"
    roles: [IntegrationManager]
    code: 200
    input: []
    output: CrossPromoObligation
    side_effects: ["fulfilled_count += 1", "status OWED/PARTIALLY_FULFILLED -> PARTIALLY_FULFILLED | FULFILLED"]
  - method: POST
    path: "/contracts/{id}/disclosures"
    description: "Draft a sponsorship disclosure filing for a contract"
    roles: [IntegrationManager]
    code: 201
    input: [disclosure_text]
    output: DisclosureFiling
    side_effects: []
  - method: GET
    path: "/contracts/{id}/disclosures"
    description: "List disclosure filings of a contract"
    roles: [AgencyAdmin, IntegrationManager, BrandRep, NetworkStandardsReviewer, VerificationAnalyst]
    code: 200
    input: ["limit?","offset?","status?"]
    output: DisclosureFiling[]
    side_effects: []
  - method: POST
    path: "/disclosures/{id}/file"
    description: "File a DRAFT disclosure (must happen before the episode airs)"
    roles: [IntegrationManager]
    code: 200
    input: []
    output: DisclosureFiling
    side_effects: ["DisclosureFiling DRAFT -> FILED"]
  - method: POST
    path: "/disclosures/{id}/acknowledge"
    description: "Network standards acknowledges a filed disclosure"
    roles: [NetworkStandardsReviewer]
    code: 200
    input: []
    output: DisclosureFiling
    side_effects: ["DisclosureFiling FILED -> ACKNOWLEDGED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call to this endpoint, the logical clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed role acting on a resource it does not own (e.g. BrandRep of another brand)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, type mismatch, invalid enum value" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a valid from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Operation attempted on an entity in a terminal state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same operator attempting both sides of a segregated duty (episode creator deciding; report filer verifying)" }
  - { id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED, http: 422, condition: "Verification attempted without an ACKNOWLEDGED disclosure filing for the contract" }
  - { id: ERR_INVALID_SCENE_WINDOW, http: 400, condition: "Scene window fails 0 <= start < end <= runtime_seconds" }
  - { id: ERR_SCENE_WINDOW_OVERLAP, http: 409, condition: "Scene window overlaps (half-open intersection) an existing non-withdrawn opportunity of the episode" }
  - { id: ERR_OPPORTUNITY_UNAVAILABLE, http: 409, condition: "Proposal references an opportunity not in IDENTIFIED status" }
  - { id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT, http: 409, condition: "GRANT would create a second GRANTED clearance for the same (episode, category)" }
  - { id: ERR_AIRDATE_PROXIMITY_CONFLICT, http: 409, condition: "GRANT conflicts with a same-category GRANTED clearance inside the policy air-date window" }
  - { id: ERR_EPISODE_ALREADY_AIRED, http: 409, condition: "Proposal/clearance creation or disclosure filing after the episode aired" }
  - { id: ERR_EPISODE_NOT_LOCKED, http: 409, condition: "Contract activation requires episode status LOCKED" }
  - { id: ERR_EPISODE_NOT_AIRED, http: 409, condition: "Airing report filing requires episode status AIRED or VERIFIED" }
  - { id: ERR_AIR_DATE_NOT_REACHED, http: 409, condition: "mark-aired before the logical clock reaches episode.air_date" }
  - { id: ERR_BRAND_SUSPENDED, http: 409, condition: "Operation references a SUSPENDED brand" }
  - { id: ERR_BRIEF_NOT_OPEN, http: 409, condition: "Proposal creation requires brief status OPEN" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Fee exceeds the brief's remaining budget" }
  - { id: ERR_FEE_BELOW_MINIMUM, http: 400, condition: "Fee below guaranteed_seconds * rate_cents_per_second floor" }
  - { id: ERR_CLEARANCE_REQUIRED, http: 409, condition: "Contract activation requires a GRANTED clearance for (episode, brand category)" }
  - { id: ERR_SHIPMENT_CONTRACT_MISMATCH, http: 422, condition: "Continuity record's shipment belongs to a different contract" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency platform administrator; registers brands and series, drives the logical clock"
    identity: opaque
    exclusive_operations: ["POST /brands", "POST /brands/{id}/suspend", "POST /brands/{id}/resume", "POST /series", "POST /_clock/set_current_utc"]
    shared_operations: ["GET reads across resources"]
  - name: BrandRep
    description: "Brand-side representative; owns briefs of their brand and disputes airing reports"
    identity: entity_backed:Brand
    exclusive_operations: ["POST /brands/{id}/briefs", "POST /briefs/{id}/submit", "POST /briefs/{id}/close", "POST /airing-reports/{id}/dispute"]
    shared_operations: ["GET reads across resources"]
  - name: IntegrationManager
    description: "Agency integration manager; runs proposals, contracts, shipments, clearances requests, disclosures, cross-promos"
    identity: opaque
    exclusive_operations: ["POST /proposals", "POST /proposals/{id}/submit", "POST /proposals/{id}/revisions", "POST /proposals/{id}/withdraw", "POST /proposals/{id}/contract", "PATCH /contracts/{id}/terms", "POST /contracts/{id}/activate", "POST /contracts/{id}/terminate", "POST /contracts/{id}/shipments", "POST /shipments/{id}/advance", "POST /episodes/{id}/clearances", "POST /makegood-credits/{id}/waive", "POST /cross-promos/{id}/fulfill", "POST /contracts/{id}/disclosures", "POST /disclosures/{id}/file"]
    shared_operations: ["GET reads across resources"]
  - name: ProductionRep
    description: "Production-side representative; creates episodes/opportunities, logs continuity, makes production decisions (never on episodes they created)"
    identity: opaque
    exclusive_operations: ["POST /series/{id}/episodes", "POST /episodes/{id}/lock", "POST /episodes/{id}/mark-aired", "POST /episodes/{id}/opportunities", "POST /opportunities/{id}/withdraw", "POST /proposals/{id}/production-decision", "POST /contracts/{id}/continuity-records"]
    shared_operations: ["GET reads across resources"]
  - name: NetworkStandardsReviewer
    description: "Network standards & practices reviewer; second approval gate and disclosure acknowledgement"
    identity: opaque
    exclusive_operations: ["POST /proposals/{id}/network-decision", "POST /disclosures/{id}/acknowledge"]
    shared_operations: ["GET reads across resources"]
  - name: ClearanceOfficer
    description: "Competitive-clearance adjudicator; decides and releases clearances"
    identity: opaque
    exclusive_operations: ["POST /clearances/{id}/decide", "POST /clearances/{id}/release"]
    shared_operations: ["GET reads across resources"]
  - name: VerificationAnalyst
    description: "Post-air measurement analyst; files, verifies, and re-measures airing reports (never verifies own filings)"
    identity: opaque
    exclusive_operations: ["POST /episodes/{id}/airing-reports", "POST /airing-reports/{id}/verify", "POST /airing-reports/{id}/remeasure"]
    shared_operations: ["GET reads across resources"]
