              captures: { agr_id: $.data.id }
            - call: "POST /wbl/agreements/${agr_id}/employer-sign"
              payload: {}
              as: EmployerSupervisor
              as_user_id: "${sup_id}"
            - call: "POST /wbl/agreements/${agr_id}/execute"
              payload: {}
              as: WblCoordinator
              as_user_id: "coord-signer-2"
            - call: "POST /wbl/students"
