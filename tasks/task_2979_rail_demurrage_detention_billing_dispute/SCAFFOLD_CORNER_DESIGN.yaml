              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/disputes/${dsp_id}/begin-review"
              payload: {}
              as: DemurrageAdjudicator
              as_user_id: "adj-c9s19-b"
            - call: "POST /demurrage/disputes/${dsp_id}/decide"
              payload: { decision: "DENIED", allowance_pct: 0, decision_rationale: "The tariff stands." }
              as: DemurrageAdjudicator
              as_user_id: "adj-c9s19-b"
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /demurrage/regulatory-complaints"
              payload: { demurrage_dispute_id: "${dsp_id}", tariff_rule_set_id: "${tar_id}", complaint_type: "RULE_REASONABLENESS", docket_narrative: "Rule 6004 tier three is unreasonable." }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car2_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9S19-2", expected_rail_car_version: "${car2_v}" }
              as: RailroadAgent
              captures: { cyc2_id: $.data.id }
            - call: "POST /demurrage/regulatory-complaints/${cmp_id}/answer"
              payload: { answer_narrative: "The rate was filed and published." }
              as: RailroadAgent
            - call: "POST /demurrage/regulatory-complaints/${cmp_id}/decide"
              payload: { outcome: "DISMISSED", ordered_credit_cents: 0 }
              as: RegulatoryOfficer
          assert:
            - "filing: 201 with complaint status FILED, filed_at 2026-09-05T09:00:00.000Z and a docket_number stamped by the server"
            - "filing pushed TariffRuleSet.${tar_id} from PUBLISHED to CHALLENGED with challenge_count 1, and the dispute to ESCALATED"
            - "the mid-loop POST /demurrage/placement-cycles succeeds 201: a CHALLENGED rule set is still in force, so it may back a new cycle"
            - "the answer moved the complaint to RAILROAD_ANSWERED"
            - "the dismissal moved the complaint to DISMISSED and returned TariffRuleSet.${tar_id} to PUBLISHED with challenge_count still 1, not 0: the loop preserves the counter"
            - "the dispute is still ESCALATED after the dismissal: the regulator's outcome does not reopen the railroad's own adjudication"

      - name: decide_cascades_charge_to_invoice_to_customer
        claim_type: cross_entity
        grounds:
          - state_machines.DemurrageDispute.UNDER_REVIEW_to_DECIDED
        excluded_because:
          difficulty_instance: transitive_cascade / decide_cascades_charge_to_invoice_to_customer_four_hops
          rationale: |
            The §1.8 instance already walks the full four-hop cascade from the
            decide endpoint through DemurrageCharge, Invoice and Customer with
            per-hop literals, and it also pins the hops that must NOT fire. A
            second corner instance on the same edge would assert a strict subset.

      - name: release_syncs_the_average_agreement_day_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.PlacementCycle.movement_status.ACTUALLY_PLACED_to_RELEASED
        excluded_because:
          difficulty_instance: transitive_cascade / release_cascades_cycle_to_charge_to_average_agreement_three_hops
          rationale: |
            The §1.8 instance drives one release and asserts the cycle, the
            charge and the AverageAgreement day counters in the same replay,
            including the credit_days_earned versus debit_days_incurred split
            that this row would otherwise duplicate.

      - name: void_compensates_every_aggregate_it_touched
        claim_type: compensation
        grounds:
          - state_machines.DemurrageCharge.FINAL_to_VOIDED
        excluded_because:
          difficulty_instance: compensating_invariant / void_restores_average_agreement_day_ledger_identity
          rationale: |
            The §1.8 instance voids a charge and asserts the restored identity
            across the Invoice totals, Customer.credit_balance_cents and the
            AverageAgreement ledger. The compensation claim for this edge is
            exactly that identity, so a corner copy would add no observable.

  # ===========================================================================
  - section: calculations
    instances:

      - name: fax_clock_starts_at_the_acknowledgement_and_ignores_the_grace_window
        claim_type: chronological
        grounds:
          - calculations.demurrage_clock_basis_resolution
          - endpoints.POST_/demurrage/placement-cycles/{id}/acknowledge-notification
        distinguishing_aspect: |
          For a FAX customer the effective notice instant is the
          ACKNOWLEDGEMENT, so the 4-hour notification grace is not added at all:
          sending the fax at 09:00 and acknowledging it at 20:00 starts the
          clock at 20:00, not at 13:00. A late actual placement then fails to
          capture the clock and the basis stays CONSTRUCTIVE.
        test_recipe:
          setup:
            - "one customer with notification_method FAX and one INDUSTRY_TRACK facility with gate_close_hour 16"
            - "one RAILROAD_OWNED car under the default tariff (48 free hours, notification_grace_hours 4)"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9C1-CUST", name: "Fax Clock Fluorspar", serving_station_code: "STN60", notification_method: "FAX" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9C1-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9C1-6004", car_ownership_scope: "ANY", notification_grace_hours: 4 }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9C1-FXX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9C1-1", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "FAX", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_id}/acknowledge-notification"
              payload: { ack_at: "2026-08-03T20:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T12:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-08T10:00:00Z" }
              as: RailroadAgent
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc_id}&limit=10&offset=0"
              payload: {}
              as: BillingAdmin
              captures: { chg_id: "$.data[0].id" }
          assert:
            - "immediately after the notify the cycle had clock_basis NONE and clock_start_at null: a FAX notice alone starts nothing"
            - "the acknowledge returns 200 on the CarNotification with delivery_status ACKNOWLEDGED and acknowledged_at 2026-08-03T20:00:00.000Z"
            - "the cycle now reports clock_basis CONSTRUCTIVE, clock_start_at 2026-08-03T20:00:00.000Z (NOT 2026-08-03T13:00:00.000Z), free_days 2 and free_time_expires_at 2026-08-05T23:59:59.999Z"
            - "the actual placement at 2026-08-08T10:00:00Z is later than the constructive expiry, so clock_basis stays CONSTRUCTIVE and clock_start_at stays 2026-08-03T20:00:00.000Z"
            - "that placement re-ran the provisional variant against the logical clock 2026-08-08T12:00:00Z: chargeable_days 2 (2026-08-06 and 2026-08-07; the clock date itself is never charged) and gross_amount_cents 25100"
            - "the charge is still status PROVISIONAL with charge_kind DEMURRAGE and computation_basis CONSTRUCTIVE"

      - name: private_assigned_car_takes_railroad_free_time_and_the_private_ladder
        claim_type: correct_result
        grounds:
          - calculations.tiered_charge_amount
          - entities.RailCar.fields.ownership
        distinguishing_aspect: |
          PRIVATE_ASSIGNED is the mixed case: it receives the RAILROAD free time
          of 48 hours but is rated on the PRIVATE ladder, and its charge_kind is
          DETENTION rather than DEMURRAGE. Reading ownership once and using it
          for both decisions gives the wrong answer either way.
        test_recipe:
          setup:
            - "one PRIVATE_ASSIGNED car on the Cycle A timeline with release 2026-08-11T16:00:00Z"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
