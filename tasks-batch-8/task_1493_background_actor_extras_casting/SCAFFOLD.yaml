  - { method: POST, path: "/central-casting/payroll-batches/{id}/submit", description: "OPEN|PARTIALLY_REJECTED -> SUBMITTED; member vouchers -> SUBMITTED", roles: [PayrollCoordinator], code: 200, input: [], output: PayrollBatch, side_effects: ["voucher SUBMITTED cascade; submitted_by/at set; version +1"] }
  - { method: POST, path: "/central-casting/payroll-batches/{id}/acknowledge", description: "Record payroll company response: ACCEPTED -> ACKNOWLEDGED (vouchers PAID); REJECTED with rejected_voucher_ids -> PARTIALLY_REJECTED (those vouchers REJECTED and removed). SoD: acknowledger != submitter.", roles: [PayrollCoordinator], code: 200, input: [outcome, "rejected_voucher_ids?"], output: PayrollBatch, side_effects: ["voucher PAID/REJECTED cascades; totals and exposure recomputed; version +1"] }

  # --- ReplacementCase ---
  - { method: GET, path: "/central-casting/replacement-cases", description: "List replacement cases", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "casting_call_id?", "original_booking_id?", "status?"], output: "ReplacementCase[]", side_effects: [] }
  - { method: GET, path: "/central-casting/replacement-cases/{id}", description: "Get replacement case", roles: *ALL_ROLES, code: 200, input: [], output: ReplacementCase, side_effects: [] }
  - { method: POST, path: "/central-casting/replacement-cases/{id}/offer-next", description: "Select top eligible standby (reliability DESC, created_at ASC, exclusions applied); creates OFFERED replacement booking consuming the released slot; empty pool -> case EXPIRED (200)", roles: [CastingAssociate], code: 200, input: [], output: ReplacementCase, side_effects: ["booking created + slot consumed when candidate found; attempts_count +1; version +1"] }
  - { method: POST, path: "/central-casting/replacement-cases/{id}/expire", description: "OPEN -> EXPIRED (manual)", roles: [CastingAssociate], code: 200, input: [], output: ReplacementCase, side_effects: ["version +1"] }

  # --- StandbyEntry ---
  - { method: POST, path: "/central-casting/standby-entries", description: "Register actor on a call's standby pool (call PUBLISHED|LOCKED; actor ELIGIBLE; no duplicate ACTIVE entry)", roles: [CastingAssociate], code: 201, input: [casting_call_id, actor_id], output: StandbyEntry, side_effects: ["status ACTIVE; slot_type snapshot"] }
  - { method: GET, path: "/central-casting/standby-entries", description: "List standby entries", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "casting_call_id?", "actor_id?", "status?"], output: "StandbyEntry[]", side_effects: [] }
  - { method: GET, path: "/central-casting/standby-entries/{id}", description: "Get standby entry", roles: *ALL_ROLES, code: 200, input: [], output: StandbyEntry, side_effects: [] }
  - { method: POST, path: "/central-casting/standby-entries/{id}/withdraw", description: "ACTIVE -> WITHDRAWN (owner actor or associate)", roles: [BackgroundActor, CastingAssociate], code: 200, input: [], output: StandbyEntry, side_effects: ["version +1"] }

  # --- RatioWaiver ---
  - { method: POST, path: "/central-casting/ratio-waivers", description: "Request union slot reduction for a call (call DRAFT|PUBLISHED)", roles: [CastingDirector], code: 201, input: [casting_call_id, union_slot_reduction, justification], output: RatioWaiver, side_effects: ["status REQUESTED; requested_by_user_id from header"] }
  - { method: GET, path: "/central-casting/ratio-waivers", description: "List ratio waivers", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "casting_call_id?", "status?"], output: "RatioWaiver[]", side_effects: [] }
  - { method: GET, path: "/central-casting/ratio-waivers/{id}", description: "Get ratio waiver", roles: *ALL_ROLES, code: 200, input: [], output: RatioWaiver, side_effects: [] }
  - { method: POST, path: "/central-casting/ratio-waivers/{id}/approve", description: "REQUESTED -> APPROVED; lowers call required_union_slots (only one APPROVED per call)", roles: [UnionRepresentative], code: 200, input: [], output: RatioWaiver, side_effects: ["call approved_waiver_reduction set; required_union_slots recomputed; call version +1; version +1"] }
  - { method: POST, path: "/central-casting/ratio-waivers/{id}/deny", description: "REQUESTED -> DENIED", roles: [UnionRepresentative], code: 200, input: [], output: RatioWaiver, side_effects: ["version +1"] }

  # --- Test-driving: logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock). Advancing the clock sweeps: OFFERED bookings past offer_expires_at -> EXPIRED (slot released; owning replacement case reopens with exclusion or expires past deadline); OPEN/CANDIDATE_OFFERED cases past deadline_at -> EXPIRED.", roles: [AgencyAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["offer/case expiry sweep"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role name unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "BackgroundActor caller acts on a booking/voucher/standby entry whose actor_id != X-User-ID" }
  - { id: ERR_SOD_SELF_APPROVAL, http: 403, condition: "Bump approve/reject where X-User-ID == requested_by_user_id" }
  - { id: ERR_SOD_SELF_ACKNOWLEDGE, http: 403, condition: "Batch acknowledge where X-User-ID == submitted_by_user_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum member, or out-of-range integer (slots/rates/capacity/amounts/duration/reduction)" }
  - { id: ERR_PRODUCTION_NOT_FOUND, http: 404, condition: "production id does not exist" }
  - { id: ERR_ACTOR_NOT_FOUND, http: 404, condition: "actor id does not exist" }
  - { id: ERR_CASTING_CALL_NOT_FOUND, http: 404, condition: "casting call id does not exist" }
  - { id: ERR_LOOK_REQUIREMENT_NOT_FOUND, http: 404, condition: "look requirement id does not exist" }
  - { id: ERR_HOLDING_AREA_NOT_FOUND, http: 404, condition: "holding area id does not exist (or belongs to another call)" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking id does not exist" }
  - { id: ERR_TIME_EVENT_NOT_FOUND, http: 404, condition: "time event id (or corrects_event_id target) does not exist" }
  - { id: ERR_VOUCHER_NOT_FOUND, http: 404, condition: "voucher id does not exist" }
  - { id: ERR_BUMP_ADJUSTMENT_NOT_FOUND, http: 404, condition: "bump adjustment id does not exist" }
  - { id: ERR_PAYROLL_BATCH_NOT_FOUND, http: 404, condition: "payroll batch id does not exist" }
  - { id: ERR_REPLACEMENT_CASE_NOT_FOUND, http: 404, condition: "replacement case id does not exist" }
  - { id: ERR_STANDBY_ENTRY_NOT_FOUND, http: 404, condition: "standby entry id does not exist" }
  - { id: ERR_RATIO_WAIVER_NOT_FOUND, http: 404, condition: "ratio waiver id does not exist" }
  - { id: ERR_PRODUCTION_NOT_ACTIVE, http: 409, condition: "Mutation requires Production ACTIVE (or ACTIVE|WRAPPED for payroll-phase operations)" }
  - { id: ERR_PRODUCTION_NOT_WRAPPABLE, http: 409, condition: "Production wrap requires every casting call WRAPPED or CANCELLED" }
  - { id: ERR_CALL_INVALID_STATE, http: 409, condition: "Casting call source state does not allow this transition (publish/lock/start/wrap/cancel, look-req create, holding-area create, standby create, waiver create/approve, day-of booking ops)" }
  - { id: ERR_CALL_NOT_ACCEPTING, http: 409, condition: "Booking accept window closed: normal bookings accept only while call PUBLISHED; replacement bookings only while call SHOOTING" }
  - { id: ERR_BOOKING_INVALID_STATE, http: 409, condition: "Booking source state does not allow this transition (accept/decline/cancel/check-in/mark-no-show/wrap-out)" }
  - { id: ERR_BOOKING_NOT_WRAPPED, http: 409, condition: "Voucher issue requires the booking to be WRAPPED" }
  - { id: ERR_VOUCHER_INVALID_STATE, http: 409, condition: "Voucher source state does not allow this transition (issue requires DRAFT; dispute requires ISSUED; adjust requires ISSUED|DISPUTED|REJECTED)" }
  - { id: ERR_BUMP_INVALID_STATE, http: 409, condition: "Bump approve/reject requires PENDING" }
  - { id: ERR_BUMP_VOUCHER_LOCKED, http: 409, condition: "Bump create/approve forbidden while voucher is SUBMITTED or PAID" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "Batch source state does not allow this transition (add-item OPEN|PARTIALLY_REJECTED; remove-item/submit OPEN|PARTIALLY_REJECTED; acknowledge SUBMITTED)" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "offer-next/expire requires replacement case OPEN" }
  - { id: ERR_WAIVER_INVALID_STATE, http: 409, condition: "Waiver approve/deny requires REQUESTED" }
  - { id: ERR_STANDBY_NOT_ACTIVE, http: 409, condition: "Standby withdraw requires ACTIVE entry" }
  - { id: ERR_STALE_BATCH_VERSION, http: 412, condition: "expected_batch_version != current batch.version on add-item (OCC)" }
  - { id: ERR_STALE_VOUCHER_VERSION, http: 412, condition: "expected_voucher_version != current voucher.version on adjust (OCC)" }
  - { id: ERR_ACTOR_NOT_ELIGIBLE, http: 409, condition: "Actor is REGISTERED or SUSPENDED where ELIGIBLE is required" }
  - { id: ERR_COMPLIANCE_INDEX_TOO_LOW, http: 409, condition: "Casting call publish blocked: production compliance_index < 30" }
  - { id: ERR_SHOOT_DATE_MISMATCH, http: 409, condition: "start-shooting requires logical clock date == shoot_date" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 409, condition: "mark-no-show before call_time + 60 minutes" }
  - { id: ERR_TURNAROUND_VIOLATION, http: 409, condition: "Less than 600 minutes rest (or overlap) vs another OFFERED|CONFIRMED|CHECKED_IN|WRAPPED booking of the actor" }
  - { id: ERR_DUPLICATE_BOOKING, http: 409, condition: "Actor already has an active booking (or ACTIVE standby entry) on this call" }
  - { id: ERR_NO_SLOT_AVAILABLE, http: 409, condition: "Union actor booking but all slots consumed" }
  - { id: ERR_NO_NONUNION_SLOT, http: 409, condition: "Nonunion actor booking but nonunion capacity (nonunion_slots + approved waiver reduction) exhausted" }
  - { id: ERR_UNION_RATIO_SHORTFALL, http: 422, condition: "Lock blocked: projected_union_count < required_union_slots" }
  - { id: ERR_WAIVER_REDUCTION_INVALID, http: 422, condition: "union_slot_reduction > casting_call.union_slots" }
  - { id: ERR_HOLDING_AREA_FULL, http: 409, condition: "Check-in would exceed holding area capacity (occupancy == capacity)" }
  - { id: ERR_TIME_EVENT_INVALID, http: 409, condition: "Event sequencing violation (before CHECK_IN, unmatched MEAL_IN, manual WRAP_OUT, bad corrects_event_id)" }
  - { id: ERR_VOUCHER_NOT_SUBMITTABLE, http: 409, condition: "Voucher not ISSUED, already in a batch, wrong production, or not a SUBMITTED member during acknowledge rejection" }
  - { id: ERR_BATCH_EMPTY, http: 422, condition: "Batch submit with zero member vouchers" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Casting agency platform administrator; owns productions, actor roster verification/discipline, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /central-casting/productions; POST .../activate"
      - "POST /central-casting/actors; POST /actors/{id}/verify|suspend|reinstate"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET list/item endpoints"]
  - name: CastingDirector
    description: "Production-side casting lead; owns casting calls, look requirements, waivers, bump decisions, production wrap"
    identity: opaque
    exclusive_operations:
      - "POST /central-casting/casting-calls; POST /casting-calls/{id}/publish|lock|cancel"
      - "POST /central-casting/look-requirements"
      - "POST /central-casting/ratio-waivers"
      - "POST /central-casting/bump-adjustments/{id}/approve|reject (SoD: != requester)"
      - "POST /central-casting/productions/{id}/wrap"
    shared_operations: ["All GET list/item endpoints"]
  - name: CastingAssociate
    description: "Day-of operations: bookings, check-in/holding/wrap-out, time events, vouchers, standby pool, replacement offers, call start/wrap"
    identity: opaque
    exclusive_operations:
      - "POST /central-casting/bookings; POST /bookings/{id}/cancel|check-in|mark-no-show|wrap-out"
      - "POST /central-casting/time-events"
      - "POST /central-casting/vouchers/{id}/issue|adjust"
      - "POST /central-casting/bump-adjustments"
      - "POST /central-casting/holding-areas; POST /central-casting/standby-entries"
      - "POST /central-casting/casting-calls/{id}/start-shooting|wrap"
      - "POST /central-casting/replacement-cases/{id}/offer-next|expire"
    shared_operations: ["All GET list/item endpoints", "POST /central-casting/standby-entries/{id}/withdraw"]
  - name: BackgroundActor
    description: "The background performer; acts only on own bookings/vouchers/standby entries"
    identity: entity_backed:BackgroundActor
    exclusive_operations:
      - "POST /central-casting/bookings/{id}/accept|decline (own bookings only)"
      - "POST /central-casting/vouchers/{id}/dispute (own voucher only)"
    shared_operations: ["All GET list/item endpoints", "POST /central-casting/standby-entries/{id}/withdraw (own entry)"]
  - name: PayrollCoordinator
    description: "Payroll operations; owns batches and payroll company submission/acknowledgment"
    identity: opaque
    exclusive_operations:
      - "POST /central-casting/payroll-batches; POST /payroll-batches/{id}/items|remove-item|submit|acknowledge (SoD: acknowledger != submitter)"
    shared_operations: ["All GET list/item endpoints"]
  - name: UnionRepresentative
    description: "Union liaison; decides ratio waivers"
    identity: opaque
    exclusive_operations:
      - "POST /central-casting/ratio-waivers/{id}/approve|deny"
    shared_operations: ["All GET list/item endpoints"]
