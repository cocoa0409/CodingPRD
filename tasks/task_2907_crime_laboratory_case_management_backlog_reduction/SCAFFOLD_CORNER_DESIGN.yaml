      - name: capa_due_date_reads_the_sla_constant_for_each_severity_tier
        claim_type: constants_applied
        grounds:
          - calculations.capa_due_and_escalation
          - entities.Nonconformance.fields.due_utc
          - entities.Nonconformance.fields.opened_at_utc
        distinguishing_aspect: "Three findings opened on the same instant with different severities receive three different due dates taken from CAPA_SLA_DAYS - MINOR +60 days, MAJOR +30 days, CRITICAL +10 days - and none of them carries an analyst_id, so no qualification cascade perturbs the arithmetic."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "No analyst is named on any of the three findings, so the MAJOR/CRITICAL probation cascade cannot fire."
            - "Hand-executed formula: MINOR 2026-08-01 + 60d = 2026-09-30T00:00:00Z; MAJOR + 30d = 2026-08-31T00:00:00Z; CRITICAL + 10d = 2026-08-11T00:00:00Z."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/nonconformances"
              payload: { source: "ACCREDITATION_AUDIT", severity: "MINOR", description: "Balance calibration record filed late." }
              as: QualityManager
              captures: { n_minor: $.data.id, minor_due: $.data.due_utc }
            - call: "POST /lab/nonconformances"
              payload: { source: "ACCREDITATION_AUDIT", severity: "MAJOR", description: "Uncontrolled copy of a procedure in use at the bench." }
              as: QualityManager
              captures: { n_major: $.data.id, major_due: $.data.due_utc }
            - call: "POST /lab/nonconformances"
              payload: { source: "ACCREDITATION_AUDIT", severity: "CRITICAL", description: "Reference standard used past its expiry." }
              as: QualityManager
              captures: { n_crit: $.data.id, crit_due: $.data.due_utc }
          assert:
            - "all three triggers return HTTP status == 201"
            - "${minor_due} == 2026-09-30T00:00:00Z"
            - "${major_due} == 2026-08-31T00:00:00Z"
            - "${crit_due} == 2026-08-11T00:00:00Z"
            - "Nonconformance.${n_minor}.opened_at_utc == 2026-08-01T00:00:00Z and the same for ${n_major} and ${n_crit}"
            - "Nonconformance.${n_minor}.status == OPEN and Nonconformance.${n_minor}.capa_rejection_count == 0"
            - "Nonconformance.${n_minor}.overdue == false and Nonconformance.${n_major}.overdue == false and Nonconformance.${n_crit}.overdue == false"
            - "Nonconformance.${n_minor}.analyst_id is null and Nonconformance.${n_minor}.examination_request_id is null"

      - name: capa_overdue_flag_turns_over_one_second_after_the_due_instant
        claim_type: threshold
        grounds:
          - calculations.capa_due_and_escalation
          - entities.Nonconformance.fields.overdue
        distinguishing_aspect: "The overdue comparison is strict: at 2026-09-29T23:59:59Z and at exactly the due instant 2026-09-30T00:00:00Z the flag is false, and only at 2026-09-30T00:00:01Z does it become true - the clock moves backwards and forwards between reads and the stored due_utc never shifts."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z; one MINOR ACCREDITATION_AUDIT finding N1 is opened, so due_utc is 2026-09-30T00:00:00Z."
            - "Clock moves are legal in both directions per POST /lab/_clock/set_current_utc taking an arbitrary instant."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/nonconformances"
              payload: { source: "ACCREDITATION_AUDIT", severity: "MINOR", description: "Temperature log gap on the drying cabinet." }
              as: QualityManager
              captures: { n1: $.data.id, n1_due: $.data.due_utc }
          trigger:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-09-29T23:59:59Z" }
              as: LabDirector
            - call: "GET /lab/nonconformances/${n1}"
              payload: {}
              as: QualityManager
              captures: { overdue_before: $.data.overdue }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: LabDirector
            - call: "GET /lab/nonconformances/${n1}"
              payload: {}
              as: QualityManager
              captures: { overdue_at: $.data.overdue }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:01Z" }
              as: LabDirector
            - call: "GET /lab/nonconformances/${n1}"
              payload: {}
              as: QualityManager
              captures: { overdue_after: $.data.overdue }
          assert:
            - "${n1_due} == 2026-09-30T00:00:00Z"
            - "${overdue_before} == false"
            - "${overdue_at} == false"
            - "${overdue_after} == true"
            - "Nonconformance.${n1}.due_utc == 2026-09-30T00:00:00Z on all three reads"
            - "Nonconformance.${n1}.status == OPEN and Nonconformance.${n1}.closed_at_utc is null"

