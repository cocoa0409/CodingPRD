  - rule_id: resource_temporal_overlap
    instances:
      - name: shell_window_half_open_plus_thirty_minute_turnaround_buffer
        grounds:
          - validations[priority=35]
          - errors[ERR_SHELL_WINDOW_CONFLICT]
          - entities.WaterSession.planned_start_at
          - entities.WaterSession.planned_end_at
        distinguishing_aspect: |
          Resource pair (Shell x water window) under half-open interval semantics WITH a 30 minute
          turnaround buffer appended to the earlier session's end: 07:45 is refused against an
          06:00-07:30 booking because the buffer stretches it to 08:00, while a booking that starts
          exactly at 08:00 and one that ends exactly at 06:00 are both accepted, so the buffered
          endpoints are exclusive on both sides.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one certified coach, one rower, one 1X hull"
            - "session A on that hull 06:00-07:30, left in PLANNED (PLANNED already counts in the conflict input set)"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], swim_test_passed_on: "2026-04-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T06:00:00Z", planned_end_at: "2026-08-01T07:30:00Z", coach_member_id: "${coach_id}", athlete_member_ids: ["${rita_id}"] }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { session_a_id: $.data.id }
          trigger:
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T07:45:00Z", planned_end_at: "2026-08-01T09:00:00Z", coach_member_id: "${coach_id}", athlete_member_ids: ["${rita_id}"] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z", coach_member_id: "${coach_id}", athlete_member_ids: ["${rita_id}"] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T04:30:00Z", planned_end_at: "2026-08-01T05:30:00Z", coach_member_id: "${coach_id}", athlete_member_ids: ["${rita_id}"] }
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == ERR_SHELL_WINDOW_CONFLICT because session A's end 07:30 plus SHELL_TURNAROUND_BUFFER_MINUTES = 30 reaches 08:00, which is strictly after the requested 07:45 start"
            - "the second trigger call returns HTTP 201 with status == PLANNED: a start of exactly 08:00 touches the buffered end without intersecting it"
            - "the third trigger call returns HTTP 201: its end 05:30 plus the 30 minute buffer reaches exactly 06:00, session A's start, which again only touches"
            - "GET /boathouse/water-sessions?shell_id=${shell_id} returns exactly 3 rows, all with status == PLANNED"
            - "WaterSession.${session_a_id}.planned_start_at == 2026-08-01T06:00:00Z and planned_end_at == 2026-08-01T07:30:00Z are unchanged by the rejected call"

      - name: launch_driver_aggregate_capacity_touching_windows_do_not_conflict
        grounds:
          - validations[priority=36]
          - errors[ERR_LAUNCH_DRIVER_OVERBOOKED]
          - entities.Member.launch_supervision_limit
          - calculations.session_launch_requirement
        distinguishing_aspect: |
          A different resource entity (Member as launch driver) under a different interval
          semantics: pure half-open with NO buffer and an aggregate capacity check against
          launch_supervision_limit, so a driver capped at 1 is refused a strictly overlapping
          outing but accepted for an outing that starts exactly when the first one ends — the same
          08:00 boundary that the buffered shell rule would have rejected.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one certified coach, one SafetyOfficer, three rowers with current swim tests"
            - "one launch driver Dana with LAUNCH_DRIVER in club_roles, a valid launch certification and launch_supervision_limit == 1"
            - "three separate 1X hulls so the per-hull window rule never fires"
            - "one OPEN-posture reading; all three sessions are LEARN_TO_ROW so required_launch_count is 1 and Dana alone satisfies coverage"
            - "session S1 on hull A 06:00-08:00 already CLEARED with Dana as primary driver; S2 on hull B 08:00-09:00 and S3 on hull C 07:00-09:00 both PLANNED with Dana as primary driver"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], swim_test_passed_on: "2026-04-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z" }
