              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { p_id: $.data.id }
            - call: "POST /plans/${plan_id}/close-year"
              payload: {}
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_v_closed: $.data.version }
            - call: "POST /valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2026, enterprise_value_cents: 12000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2026-01-01", effective_to_date: "2027-01-01", expected_plan_version: "${plan_v_closed}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { plan_v_priced: $.data.version }
            - call: "POST /allocation-runs"
              payload: { plan_id: "${plan_id}", valuation_id: "${val_id}", plan_year: 2026, contributed_shares: 500, expected_plan_version: "${plan_v_priced}" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /allocation-runs"
              payload: { plan_id: "${plan_id}", valuation_id: "${val_id}", plan_year: 2026, contributed_shares: 400, expected_plan_version: "${plan_v_priced}" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { err: $.data.error_id }
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { plan_v_fresh: $.data.version }
            - call: "POST /allocation-runs"
              payload: { plan_id: "${plan_id}", valuation_id: "${val_id}", plan_year: 2026, contributed_shares: 400, expected_plan_version: "${plan_v_fresh}" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { run2_id: $.data.id }
          assert:
            - "the stale create returns error_id ERR_STALE_PLAN_VERSION with HTTP 412"
            - "EsopPlan.${plan_id}.draft_run_count == 1 immediately after the refusal"
            - "the retry with the refreshed version returns HTTP 201 with AllocationRun.${run2_id}.status == DRAFT and contributed_shares == 400"
            - "EsopPlan.${plan_id}.draft_run_count == 2"
            - "AllocationRun.${run1_id}.status == DRAFT, untouched"

      - name: reduce_contribution_flag_changes_finalize_outcome
        claim_type: conditional_feature_flags
        grounds: ["entities.EsopPlan.fields.forfeiture_policy", "calculations.annual_additions_cap_reallocation"]
        excluded_because:
          difficulty_instance: section415_residue_zero_at_876_nonzero_at_877
          rationale: "That instance exercises the REDUCE_CONTRIBUTION branch on both sides of the residue boundary; the REALLOCATE_PRO_RATA branch carrying a residue forward is asserted by allocation_eligible_set_excludes_zero_compensation_and_terminated and by the Northgate cascade instance."

      - name: forfeiture_threshold_trigger_flips_posture
        claim_type: rate_threshold_triggers
        grounds: ["entities.EsopPlan.fields.forfeiture_sweep_threshold_shares", "entities.EsopPlan.fields.forfeiture_posture"]
        excluded_because:
          difficulty_instance: termination_forfeiture_cascade_blocks_rollover_depth4
          rationale: "That instance crosses the 100-share threshold with 388 forfeited shares and asserts the SWEEP_REQUIRED posture plus the rollover refusal it causes."

      - name: reserve_floor_threshold_trigger_flips_posture
        claim_type: rate_threshold_triggers
        grounds: ["entities.EsopPlan.fields.repurchase_reserve_floor_cents", "entities.EsopPlan.fields.repurchase_posture"]
        excluded_because:
          difficulty_instance: put_funding_underfunds_plan_and_defers_siblings_depth3
          rationale: "That instance drops the reserve from 5000000 to 1437500 against a 3000000 floor and asserts the UNDERFUNDED posture and the sibling deferral."

      - name: allocation_void_cascade_reverses_every_side_effect
        claim_type: cascading_side_effects
        grounds: ["state_machines.AllocationRun.FINALIZED_to_VOID"]
        excluded_because:
          difficulty_instance: allocation_void_conserves_total_plan_shares
          rationale: "That instance asserts the reversal of every participant balance, every plan counter, the statement deletion and the plan_status rollback."

      - name: dual_variant_release_method_divergence
        claim_type: dual_variant_calculation
        grounds: ["calculations.loan_share_release"]
        excluded_because:
          difficulty_instance: loan_share_release_principal_only_vs_principal_and_interest
          rationale: "That instance is the divergence test for this layer."

