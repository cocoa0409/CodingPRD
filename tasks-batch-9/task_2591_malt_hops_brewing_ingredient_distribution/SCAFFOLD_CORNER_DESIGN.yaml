            - call: "GET /sales-orders/${rh_b_id}"
              payload: {}
              as: WarehouseOperator
              captures: { rh_b_v: $.data.version }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${rh_b_id}", cold_storage_zone_id: "${rh_zone_id}", expected_sales_order_version: "${rh_b_v}", pallet_count: 1, stage_from: "2026-08-01T06:00:00Z", stage_until: "2026-08-01T18:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { rh_sb_id: $.data.id, rh_sb_status: $.data.status }
            - call: "POST /sales-orders/${rh_a_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "receivable cleared" }
              as: CreditManager
              captures: { rh_a_credit_2: $.data.credit_status }
            - call: "POST /cold-chain-shipments/${rh_sa_id}/release-hold"
              payload: {}
              as: CreditManager
              captures: { rh_err: $.data.error_id }
            - call: "POST /sales-orders/${rh_b_id}/cancel"
              payload: { cancel_reason: "brewer deferred the load" }
              as: Brewer
              as_user_id: "${rh_id}"
            - call: "POST /cold-chain-shipments/${rh_sa_id}/release-hold"
              payload: {}
              as: CreditManager
              captures: { rh_sa_status_final: $.data.status }
          assert:
            - "credit HOLD on order A: ${rh_a_credit} == ON_HOLD and ${rh_sa_status_held} == HELD, while fulfillment_status stays PICKED"
            - "the hold released the slot: ColdStorageZone.${rh_zone_id} admits shipment B over the identical window, ${rh_sb_status} == STAGED"
            - "credit APPROVE on order A: ${rh_a_credit_2} == APPROVED — but the shipment does not restage itself"
            - "release-hold while B occupies the only slot: HTTP 409 with ${rh_err} == ERR_ZONE_CAPACITY_EXCEEDED and ColdChainShipment.${rh_sa_id}.status still HELD"
            - "GET /cold-chain-shipments?status=HELD returns total_count 1 and GET /cold-chain-shipments?cold_storage_zone_id=${rh_zone_id} returns total_count 2 while both rows live"
            - "cancelling order B moves ColdChainShipment.${rh_sb_id}.status to SUPERSEDED and frees the slot"
            - "release-hold retried: HTTP 200 with ${rh_sa_status_final} == STAGED and held_for_credit back to false"
            - "release-hold on an already STAGED shipment returns 409 ERR_INVALID_SHIPMENT_STATE"

      - name: crop_year_program_listing_filters_by_status_and_paginates
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /crop-year-programs]
          - endpoints[GET /crop-year-programs/{id}]
        distinguishing_aspect: "Filter, limit and offset compose on the same request and the residual order is created_at ASC, so status=OPEN with limit 1 and offset 1 returns the SECOND open program deterministically while total_count still reports the filtered population rather than the whole table."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three crop-year programs created in order: 2026, 2027, 2028. The 2026 program reports a harvest and leaves OPEN; the other two stay OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { pl_p26: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2027, contract_open_date: "2027-01-15T00:00:00Z", harvest_report_due_date: "2027-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { pl_p27: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2028, contract_open_date: "2028-01-15T00:00:00Z", harvest_report_due_date: "2028-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { pl_p28: $.data.id }
            - call: "POST /crop-year-programs/${pl_p26}/report-harvest"
              payload: { harvest_yield_pct: 90.00, reported_note: "empty book" }
              as: AllocationManager
          trigger:
            - call: "GET /crop-year-programs"
              payload: {}
              as: AllocationManager
              captures: { pl_first_year: "$.data[0].crop_year" }
            - call: "GET /crop-year-programs?status=OPEN"
              payload: {}
              as: CreditManager
              captures: {}
            - call: "GET /crop-year-programs?status=OPEN&limit=1&offset=1"
              payload: {}
              as: CreditManager
              captures: { pl_page_year: "$.data[0].crop_year" }
            - call: "GET /crop-year-programs?crop_year=2026"
              payload: {}
              as: WarehouseOperator
              captures: { pl_yr_status: "$.data[0].status" }
            - call: "GET /crop-year-programs/${pl_p28}"
              payload: {}
              as: PlatformAdmin
              captures: { pl_one_year: $.data.crop_year, pl_one_status: $.data.status, pl_one_pool: $.data.allocatable_pool_lbs }
          assert:
            - "unfiltered: the envelope carries total_count 3 and has_more false (the default limit is 10), and ${pl_first_year} == 2026 under created_at ASC"
            - "status=OPEN: total_count 2 — the harvested 2026 program is filtered out"
            - "status=OPEN with limit 1 offset 1: total_count 2, has_more false and ${pl_page_year} == 2028 — the second open program, never 2027"
            - "crop_year=2026: total_count 1 with ${pl_yr_status} == HARVEST_REPORTED"
            - "single fetch: ${pl_one_year} == 2028, ${pl_one_status} == OPEN, ${pl_one_pool} == null and harvest_yield_pct == null"
            - "every role including Brewer may read the program catalogue, because crop-year programs are not brewer-scoped"

