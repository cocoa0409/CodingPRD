              payload: { dealership_id: "${did}", full_name: "No Auth", email: "noauth@x.com" }
              as: MISSING
              captures: { err: $.data.error_id }
          assert:
            - "response code == 401 and error_id == ERR_MISSING_AUTH"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_unit_version_on_deal_create
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[deal-create-stale-unit]'
          - 'errors[ERR_STALE_UNIT_VERSION]'
          - 'endpoints["POST /deals"]'
        distinguishing_aspect: "A second deal-create carrying the pre-hold unit version (after a first deal bumped Unit.version) is rejected with ERR_STALE_UNIT_VERSION (412)."
        test_recipe:
          setup: ["unit read at version V; one deal created (unit -> HELD, version V+1); cancel to make unit AVAILABLE again at V+2; retry create with stale V"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Occ RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Oc Buyer", email: "oc@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-OC-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v0: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v0}" }
              as: SalesAgent
              captures: { deal1: $.data.id }
            - call: "POST /deals/${deal1}/cancel"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v0}" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412 and error_id == ERR_STALE_UNIT_VERSION"

      - name: occ_correct_unit_version_storage_book_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[storage-book-stale-unit]'
          - 'endpoints["POST /storage-slots"]'
          - 'entities.Unit.fields.version'
        distinguishing_aspect: "Booking a storage slot with the current Unit.version succeeds and increments Unit.version (happy path of the storage OCC rule)."
        test_recipe:
          setup: ["a fresh unit read at its current version"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Occ2 RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "O2 Owner", email: "o2@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-O2-1", model_year: 2022, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v0: $.data.version }
          trigger:
            - call: "POST /storage-slots"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", daily_rate_cents: 5000, start_utc: "2026-06-01T00:00:00.000Z", end_utc: "2026-06-10T00:00:00.000Z", expected_unit_version: "${unit_v0}" }
              as: ServiceAdvisor
              captures: { slot: $.data.id }
          assert:
            - "StorageSlot.${slot}.status == BOOKED"
            - "Unit.${unit}.version == unit_v0 + 1 (storage booking bumps unit version)"

      - name: so_cancel_releases_parts_and_appointments_cascade
        claim_type: cascading_side_effects
        grounds:
          - 'state_machines.ServiceOrder.OPEN_to_CANCELLED'
          - 'entities.Appointment.fields.status'
          - 'entities.PartItem.fields.qty_reserved'
        distinguishing_aspect: "Cancelling an SO with a RESERVED part and a SCHEDULED appointment releases both: part qty_reserved->0 and appointment->CANCELLED (multi-target cascade)."
        test_recipe:
          setup: ["SO started, 1 part reserved, 1 repair appointment scheduled on its bay"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Casc RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Ca Owner", email: "ca@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-CC-1", model_year: 2022, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /part-items"
              payload: { dealership_id: "${did}", sku: "GSKT-1", name: "Gasket", unit_price_cents: 3000, qty_on_hand: 8 }
              as: ServiceAdvisor
              captures: { part: $.data.id }
            - call: "POST /service-bays"
              payload: { dealership_id: "${did}", name: "Repair-C", bay_kind: "REPAIR" }
              as: ServiceAdvisor
              captures: { bay: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 1.0, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /part-reservations"
              payload: { service_order_id: "${so}", part_item_id: "${part}", quantity: 3 }
              as: ServiceAdvisor
            - call: "POST /appointments"
              payload: { dealership_id: "${did}", service_bay_id: "${bay}", appt_kind: "REPAIR", service_order_id: "${so}", start_utc: "2026-06-01T09:00:00.000Z", end_utc: "2026-06-01T10:00:00.000Z" }
              as: ServiceAdvisor
              captures: { appt: $.data.id }
          trigger:
            - call: "POST /service-orders/${so}/cancel"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "PartItem.${part}.qty_reserved == 0 and qty_available == 8"
            - "Appointment.${appt}.status == CANCELLED"
            - "ServiceOrder.${so}.status == CANCELLED"

      - name: recall_remediation_recomputes_unit_open_recall_count
        claim_type: derived_field_reconciliation
        grounds:
          - 'state_machines.ServiceOrder.IN_PROGRESS_to_COMPLETED'
          - 'entities.Unit.fields.open_recall_count'
          - 'endpoints["POST /service-orders/{soId}/complete"]'
        distinguishing_aspect: "Remediating via SO complete clears the RecallRemedy and recomputes Unit.open_recall_count from 1 to 0."
        test_recipe:
          setup: ["unit in scope (open_recall_count 1); SO remediating the campaign started"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Rcl RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Rl Owner", email: "rl@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-RL-1", model_year: 2024, class_type: "CLASS_A", acquisition: "STOCK", list_price_cents: 9000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /recall-campaigns"
              payload: { dealership_id: "${did}", campaign_code: "RC-RL-1", target_class_type: "CLASS_A", target_model_year: 2024, severity: "STOP_SALE" }
              as: DealerManager
              captures: { rc: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 1.0, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /service-orders/${so}/complete"
              payload: { remediates_campaign_id: "${rc}" }
              as: ServiceAdvisor
          assert:
            - "Unit.${unit}.open_recall_count == 0 after remediation"
            - "ServiceOrder.${so}.status == COMPLETED"

