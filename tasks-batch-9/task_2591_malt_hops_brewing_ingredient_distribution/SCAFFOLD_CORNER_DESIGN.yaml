        distinguishing_aspect: "ADJUNCT_DP_BONUS 10.0 is applied only when the recipe's adjunct_pct is strictly positive, so the SAME lot at 65.0 diastatic power scores normally for an all-malt recipe and hard-fails for a 25 percent adjunct recipe — proving the floor is read from the recipe, not the product alone."
