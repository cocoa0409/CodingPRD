          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "NotClosed" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "NCStore", store_code: "NC1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { stmt: "$.data.id", stmt_v: "$.data.version" } }
          trigger:
            - { call: "POST /settlement-statements/${stmt}/finalize", payload: { expected_settlement_statement_version: "${stmt_v}" }, as: JobberFinance, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_SETTLEMENT_PERIOD_NOT_CLOSED (http 409); status remains PROVISIONAL"

      - name: audit_certify_before_submit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AuditCount.SUBMITTED_to_CERTIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "certify from IN_PROGRESS (no frozen counts) is rejected even with the correct OCC version."
        test_recipe:
          setup: ["ACTIVE agreement; audit started but not submitted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "CertCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "CertStore", store_code: "CT1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
