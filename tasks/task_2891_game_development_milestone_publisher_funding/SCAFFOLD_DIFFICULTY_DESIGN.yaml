      - name: invoice_approval_depends_on_agreement_status_two_hops_above_the_invoice
        grounds:
          - validations[priority=23]
          - validations[priority=38]
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - state_machines.DevelopmentAgreement.ACTIVE_to_SUSPENDED
          - state_machines.DevelopmentAgreement.SUSPENDED_to_ACTIVE
          - state_machines.ContractorInvoice.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The invoice and its engagement never change between the two attempts; only the
          grandparent agreement moves ACTIVE -> SUSPENDED -> ACTIVE. The first
          POST /contractor-invoices/{id}/decide must answer 409 ERR_AGREEMENT_NOT_ACTIVE
          (priority 23, not the priority-38 engagement error, even though the suspension cascade
          also parked the engagement in SUSPENDED) and the second must answer 200 with the invoice
          APPROVED and approved_invoice_total_cents 100000.
        test_recipe:
          setup:
            - "Agreement Willowmark: advance_total_cents 1000000, one ALPHA milestone funded 1000000 with contractor_budget_cents 200000, ACTIVE and IN_DEVELOPMENT."
            - "Engagement E1 (vendor UI-WILLOW, committed 200000) is born ACTIVE; invoice WIL-001 for 100000 is SUBMITTED."
            - "The agreement is then suspended, which parks E1 in SUSPENDED (no payments exist, so withheld_payment_cents stays 0)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Willowmark Studio", contact_email: "dev@willowmark.example", country_code: "IE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Willowmark", advance_total_cents: 1000000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31", recoupable_cost_cap_bps: 2000, platform_fee_bps: 3000 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 1000000, contractor_budget_cents: 200000, acceptance_criteria: ["Prototype loop", "UI shell"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "UI-WILLOW", scope_summary: "UI shell and HUD", committed_cents: 200000, start_date: "2026-08-05", end_date: "2026-09-20" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /contractor-invoices"
              payload: { engagement_id: "${e1_id}", invoice_number: "WIL-001", amount_cents: 100000, period_end_date: "2026-08-31", description: "HUD milestone" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { i1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/suspend"
              payload: { reason: "Publisher liquidity review" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
          trigger:
            - call: "POST /contractor-invoices/${i1_id}/decide"
              payload: { decision: "APPROVE" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { blocked_error_id: "$.data.error_id" }
            - call: "POST /development-agreements/${agreement_id}/reinstate"
              payload: { reason: "Liquidity review cleared" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /contractor-invoices/${i1_id}/decide"
              payload: { decision: "APPROVE" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
          assert:
            - "trigger call 1 -> 409 with error_id ERR_AGREEMENT_NOT_ACTIVE (priority 23, not ERR_ENGAGEMENT_NOT_INVOICEABLE)"
            - "after trigger call 1: ContractorInvoice.${i1_id}.status == SUBMITTED and ContractorEngagement.${e1_id}.approved_invoice_total_cents == 0"
            - "after trigger call 2: DevelopmentAgreement.${agreement_id}.status == ACTIVE, funding_posture == OPEN, ContractorEngagement.${e1_id}.status == ACTIVE"
            - "trigger call 3 -> 200; ContractorInvoice.${i1_id}.status == APPROVED"
            - "ContractorEngagement.${e1_id}.approved_invoice_total_cents == 100000"
            - "GET /milestones/${m1_id}/budget-summary reports incurred_basis_cents 100000, committed_basis_cents 200000, overrun_cents 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: reviewer_window_half_open_overlap_blocks_but_adjacency_is_legal
        grounds:
          - calculations.reviewer_window_occupancy
          - calculations.reviewer_window_occupancy.constants.REVIEWER_CONCURRENT_CAPACITY
          - validations[priority=53]
          - errors.ERR_REVIEWER_WINDOW_CONFLICT
          - entities.PublisherReview.fields.review_window_start_at
          - entities.PublisherReview.fields.review_window_end_at
        distinguishing_aspect: |
          The same reviewer's occupancy is enforced ACROSS agreements and with half-open semantics:
          [12:00, 14:00) against an existing [09:00, 13:00) is 409 ERR_REVIEWER_WINDOW_CONFLICT,
          while [13:00, 17:00) - touching the prior end instant exactly - is 201. An implementation
          using closed intervals rejects the adjacent window; one that scopes the check to a single
          agreement or a single build accepts the overlapping one.
        test_recipe:
          setup:
            - "Two independent single-milestone agreements under one publisher: Marrow A (advance 3600000, ALPHA milestone 3600000) and Marrow B (advance 1000000, ALPHA milestone 1000000), both ACTIVE."
            - "Each milestone has one gate-passing build (75.00 / 96.00 / 60.00 / 5) and sits in UNDER_REVIEW."
            - "Reviewer Rae files an ACCEPTED review on Marrow A's build occupying [2026-08-01T09:00:00.000Z, 2026-08-01T13:00:00.000Z)."
            - "All three windows belong to the same reviewer_user_id; the logical clock never moves, so decided_at is identical for every review."
