            - "Submission.${sub_id}.review_status == DRAFT"
            - "Submission.${sub_id}.self_reported_coverage_pct == 0.00"
            - "AdoptionCycle.${cyc_id}.submission_count == 0"

      - name: cycle_state_check_outranks_content_safety_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=23]
          - validations[priority=33]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / cycle_phase_state_outranks_prohibited_content_on_file"
          rationale: "That instance violates both rules in one call and asserts the lower-numbered error wins."
      - name: referential_check_outranks_fiscal_check_on_confirm
        claim_type: priority_conflict
        grounds:
          - validations[priority=40]
          - validations[priority=66]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pricing_proposal_referential_outranks_inventory_fiscal_on_confirm"
          rationale: "That instance violates the referential and the fiscal rule together on a single confirm."
      - name: temporal_window_check_outranks_capacity_check
        claim_type: temporal_validation
        grounds:
          - validations[priority=46]
          - validations[priority=62]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / slot_session_window_temporal_outranks_capacity_constraint"
          rationale: "That instance places a slot both outside the session and over the minute cap in one request."
      - name: order_confirm_depends_on_title_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=29]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / order_confirm_gated_by_title_sunset_state"
          rationale: "That instance confirms the same order before and after the title sunsets."
      - name: filing_passes_when_every_gate_is_satisfied
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=53]
        excluded_because:
          difficulty_instance: "boundary_precision_check / coverage_rounds_to_exact_minimum_while_lower_claim_is_rejected"
          rationale: "That instance asserts the successful filing at exactly the minimum coverage alongside the rejected one."
      - name: overlapping_submission_windows_are_refused
        claim_type: violation_error
        grounds:
          - validations[priority=45]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / cycle_submission_window_half_open_overlap"
          rationale: "That instance asserts the half-open overlap rejection and the touching-endpoint acceptance."

  # ===========================================================================
  # Section 5 - Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: fulfill_moves_committed_units_to_fulfilled
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /district-orders/{id}/fulfill]
          - state_machines.DistrictOrder.CONFIRMED_to_FULFILLED
          - calculations.order_total_value
        distinguishing_aspect: |
          Fulfilling a confirmed 40-unit order must move exactly those 40 units from committed_units
          to fulfilled_units while on_hand_units stays 60, and must leave contracted_tcv_cents at
          365400 including the 5400-cent freight surcharge.
        test_recipe:
          setup:
            - "State MT is OPEN_TERRITORY, so orders need no price filing"
            - "Title MT-M-9 is ACTIVE at 9000 cents list with 100 units on hand"
            - "Sales rep sr-1 quoted 40 print units and 0 digital seats and sr-2 confirmed the order, committing 40 units"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "MT", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0 }
              as: PlatformAdmin
              captures: { st_mt_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000011701", subject: "MATH", grade_low: 9, grade_high: 9, copyright_year: 2026, content_tags: ["ALGEBRA_MODELS"], page_count: 340, signature_page_capacity: 384, list_price_cents: 9000 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /titles/${ttl_id}/inventory-adjustments"
              payload: { adjustment_type: "RECEIPT", units: 100, reason: "First print run." }
              as: PlatformAdmin
            - call: "POST /district-orders"
              payload: { district_ref: "MT-DIST-07", state_id: "${st_mt_id}", title_id: "${ttl_id}", print_units: 40, digital_seats: 0 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ord_id: $.data.id }
            - call: "POST /district-orders/${ord_id}/confirm"
              payload: {}
              as: SalesRep
              as_user_id: "sr-2"
          trigger:
            - call: "POST /district-orders/${ord_id}/fulfill"
              payload: {}
              as: SalesRep
              as_user_id: "sr-2"
          assert:
            - "HTTP status == 200"
            - "DistrictOrder.${ord_id}.status == FULFILLED"
            - "DistrictOrder.${ord_id}.quoted_tcv_cents == 365400"
            - "DistrictOrder.${ord_id}.contracted_tcv_cents == 365400"
            - "DistrictOrder.${ord_id}.freight_surcharge_cents == 5400"
            - "DistrictOrder.${ord_id}.allocated_units == 40"
            - "Title.${ttl_id}.committed_units == 0"
            - "Title.${ttl_id}.fulfilled_units == 40"
            - "Title.${ttl_id}.on_hand_units == 60"
            - "Title.${ttl_id}.total_received_units == 100"

      - name: adoption_list_confirm_requires_the_title_on_the_adopted_list
        claim_type: conditional_action
        grounds:
          - validations[priority=41]
          - errors[ERR_TITLE_NOT_ON_ADOPTED_LIST]
        distinguishing_aspect: |
          In an ADOPTION_LIST state a confirm that carries an APPROVED pricing_proposal_id must still
          fail with ERR_TITLE_NOT_ON_ADOPTED_LIST (422) while the title's adopted_state_codes is
          empty, leaving the order QUOTED with allocated_units 0 and contracted_tcv_cents null.
        test_recipe:
          setup:
            - "State AL is an ADOPTION_LIST state with min_verified_coverage_pct 50.00 and one SOCIAL_STUDIES standard AL.SS.7.1"
            - "The submission is FILED in the OPEN 2027 cycle at clock 2026-09-15 and carries an APPROVED single-year proposal"
            - "The title has 100 units on hand and its adopted_state_codes is still empty because no tally has run"
            - "Sales rep sr-1 quoted 20 print units against that approved proposal"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "AL", adoption_model: "ADOPTION_LIST", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_al_id: $.data.id }
            - call: "POST /state-profiles/${st_al_id}/standards"
              payload: { subject: "SOCIAL_STUDIES", standard_code: "AL.SS.7.1", grade_low: 7, grade_high: 7, weight: 3 }
              as: StateAdoptionOfficer
