# ============================================================================
# PRD Benchmark Scaffold — Flavor House Sample Development & Formulation Project
# Sections §1.0 – §1.7. (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.)
# ============================================================================

scenario: "2727. Flavor House Sample Development & Formulation Project (Givaudan): customer brief intake with target profile, cost-in-use and label constraints, bench formulation iteration with sample lot numbering and retention, allergen, kosher/halal and natural-claim substantiation for each component, application testing in the customer's finished matrix, sample shipment with regulatory documentation packet, intellectual property protection and formula confidentiality tiers, scale-up from bench to production batch with tolerance specification, win/loss tracking and commercialization forecast"

domain_name: "flavor-house-sample-development"

# Flat topology: every business entity is a peer collection at the root; the
# bill-of-material relationship between Formula rows is expressed as a graph
# (FormulaComponent junction rows), never as nested URL paths.
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - version_pinning_on_approval
    - derived_field_reconciliation

  entity_topology: graph
  # Formula --(FormulaComponent)--> Formula is a many-to-many self-referential
  # DAG (a compound flavour base can be a component of another formula), plus
  # Formula --(FormulaComponent)--> RawMaterial leaf edges. Cycle rejection and
  # transitive claim/allergen/cost roll-up over that DAG are the core challenge.

  state_machine_shape: cyclic
  # CustomerBrief: SUBMITTED -> CLARIFICATION_REQUESTED -> SUBMITTED loop.
  # Formula: APPROVED -> REWORK_REQUIRED -> DRAFT -> COSTED -> SUBMITTED -> APPROVED loop,
  #          plus COSTED -> DRAFT cost-invalidation loop.
  # SubstantiationRecord: VERIFIED -> REVOKED -> VERIFIED re-verification loop.
  # SampleLot: two independent parallel dimensions (qc_status x disposition_status).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  # many_to_many + self_referential: FormulaComponent joins Formula to Formula.
  # polymorphic: FormulaComponent.component_type selects which of
  #   {raw_material_id, sub_formula_id} is populated.
  # cross_aggregate: SampleShipment reaches CustomerBrief through
  #   SampleLot -> Formula -> CustomerBrief.

  role_model: segregation_of_duties
  # The Flavorist who submits a formula may not be the identity that approves it,
  # and the LabTech who compounds a sample lot may not be the identity that
  # records its QC verdict (both compared on X-User-ID).

  consistency_model: immediate

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:
  - name: CustomerBrief
    parent: null
    common_fields: true
    fields:
      - name: brief_code
        type: string
        source: input
        description: "Customer-facing brief identifier; the lot-numbering prefix"
        constraints: "matches ^BRF-[0-9]{4}$; globally unique (case-sensitive)"
      - name: customer_name
        type: string
        source: input
        description: "Customer organisation the brief belongs to"
        constraints: "1..120 chars"
      - name: matrix_type
        type: enum
        source: input
        description: "Finished matrix the flavour must perform in"
        constraints: "one of BEVERAGE_STILL, BEVERAGE_CARBONATED, DAIRY_YOGURT, BAKERY_SWEET, SAVOURY_SNACK"
      - name: target_profile
        type: enum
        source: input
        description: "Requested sensory direction"
        constraints: "one of CITRUS_TOP_NOTE, VANILLA_CREAM, RED_FRUIT, SAVOURY_UMAMI, MINT_COOL"
      - name: dosage_pct
        type: number
        source: input
        description: "Flavour use level in the finished matrix, in percent by weight"
        constraints: "> 0 and <= 100; exactly 4 decimal places retained"
      - name: annual_volume_kg
        type: integer
        source: input
        description: "Projected annual flavour volume in kg; selects the scale-up price-break tier"
        constraints: ">= 1"
      - name: cost_in_use_cap_cents_per_tonne
        type: integer
        source: input
        description: "Maximum acceptable cost-in-use per tonne of finished product, in cents"
        constraints: ">= 0"
      - name: natural_claim_required
        type: boolean
        source: input
        default: false
        description: "When true the winning formula must carry a substantiated NATURAL claim"
      - name: kosher_required
        type: boolean
        source: input
        default: false
        description: "When true every leaf raw material must carry a substantiated KOSHER claim"
      - name: halal_required
        type: boolean
        source: input
        default: false
        description: "When true every leaf raw material must carry a substantiated HALAL claim"
      - name: allergen_exclusions
        type: array
        source: input
        default: []
        description: "Allergen codes the finished flavour must not contain"
        constraints: "subset of MILK, EGG, SOY, WHEAT, PEANUT, TREE_NUT, FISH, CELERY, MUSTARD, SESAME, SULPHITES; no duplicates"
      - name: confidentiality_tier
        type: enum
        source: input
        description: "IP protection tier requested by the customer; default tier for formulas created under the brief"
        constraints: "one of TIER_1_STANDARD, TIER_2_RESTRICTED, TIER_3_BLACK_BOX"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Brief lifecycle state"
        constraints: "one of DRAFT, SUBMITTED, CLARIFICATION_REQUESTED, ACCEPTED, REJECTED, CLOSED_WON, CLOSED_LOST"
      - name: clarification_round_count
        type: integer
        source: system
        default: 0
        description: "Number of SUBMITTED -> CLARIFICATION_REQUESTED transitions taken so far"
      - name: clarification_note
        type: string
        source: system
        description: "Most recent clarification request text; null until first request"
      - name: decision_note
        type: string
        source: system
        description: "Most recent intake decision note; set to CLARIFICATION_EXHAUSTED on automatic rejection"
      - name: outcome
        type: enum
        source: system
        description: "Win/loss outcome; null until the brief is closed"
        constraints: "one of WON, LOST"
      - name: loss_reason
        type: enum
        source: system
        description: "Loss driver captured at close; null unless outcome == LOST"
        constraints: "one of PRICE, PERFORMANCE, REGULATORY, TIMING, OTHER"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the brief was closed; null while open"

  - name: RawMaterial
    parent: null
    common_fields: true
    fields:
      - name: material_code
        type: string
        source: input
        description: "Purchasing code for the raw material"
        constraints: "1..40 chars; globally unique (case-sensitive)"
      - name: name
        type: string
        source: input
        description: "Trade name of the raw material"
        constraints: "1..120 chars"
      - name: cost_per_kg_cents
        type: integer
        source: input
        description: "List price per kg in cents; the leaf input of every bench cost roll-up"
        constraints: ">= 1"
      - name: natural_status
        type: enum
        source: input
        description: "Regulatory nature of the material"
        constraints: "one of NATURAL, NATURAL_FLAVOR_WONF, NATURE_IDENTICAL, ARTIFICIAL"
      - name: potency_class
        type: enum
        source: input
        description: "Impact class; HIGH_IMPACT materials get halved scale-up tolerance bands"
        constraints: "one of HIGH_IMPACT, STANDARD"
      - name: max_use_ppm
        type: integer
        source: input
        description: "Safety ceiling for this material in the finished flavour, in ppm of the flavour"
        constraints: ">= 1 and <= 1000000"
      - name: allergen_codes
        type: array
        source: input
        default: []
        description: "Allergen codes carried by this material"
        constraints: "subset of MILK, EGG, SOY, WHEAT, PEANUT, TREE_NUT, FISH, CELERY, MUSTARD, SESAME, SULPHITES; no duplicates"
      - name: claim_status
        type: enum
        source: computed
        default: CLEAR
        description: "RESTRICTED as soon as any SubstantiationRecord for this material reaches status REVOKED, otherwise CLEAR"
        constraints: "one of CLEAR, RESTRICTED"
      - name: verified_claim_types
        type: array
        source: computed
        description: "Claim types with a SubstantiationRecord in status VERIFIED whose valid_until >= the logical clock"
        constraints: "subset of ALLERGEN_FREE_STATEMENT, KOSHER, HALAL, NATURAL"

  - name: SubstantiationRecord
    parent: RawMaterial
    common_fields: true
    fields:
      - name: raw_material_id
        type: string
        source: input
        description: "FK -> RawMaterial.id; the material this certificate substantiates"
      - name: claim_type
        type: enum
        source: input
        description: "Claim the certificate substantiates"
        constraints: "one of ALLERGEN_FREE_STATEMENT, KOSHER, HALAL, NATURAL"
      - name: issuing_body
        type: string
        source: input
        description: "Certifying body named on the certificate"
        constraints: "1..120 chars"
      - name: document_ref
        type: string
        source: input
        description: "Certificate document reference as filed"
        constraints: "1..80 chars"
      - name: valid_until
        type: datetime
        source: input
        description: "Instant the certificate stops being valid; a record is unexpired while valid_until >= the logical clock"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Certificate lifecycle state; expiry is computed, never a status value"
        constraints: "one of PENDING, VERIFIED, REVOKED"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent verification; null while PENDING"
      - name: revocation_reason
        type: string
        source: system
        description: "Reason captured at revocation; null unless the record has been revoked at least once"
      - name: is_expired
        type: boolean
        source: computed
        description: "True when valid_until < the logical clock"

  - name: Formula
    parent: CustomerBrief
    common_fields: true
    fields:
      - name: brief_id
        type: string
        source: input
        description: "FK -> CustomerBrief.id; the brief this bench formula answers"
      - name: parent_formula_id
        type: string
        source: input
        description: "FK -> Formula.id; the iteration this formula revises, null for the first iteration"
      - name: superseded_by_formula_id
        type: string
        source: system
        description: "FK -> Formula.id; the revision that superseded this formula, null while not superseded"
      - name: name
        type: string
        source: input
        description: "Bench name of the formula"
        constraints: "1..120 chars"
      - name: iteration_no
        type: integer
        source: computed
        description: "1 + count(Formula where brief_id == this.brief_id and created_at < this.created_at)"
      - name: confidentiality_tier
        type: enum
        source: input
        description: "IP tier of this formula; defaults to the brief's confidentiality_tier when omitted"
        constraints: "one of TIER_1_STANDARD, TIER_2_RESTRICTED, TIER_3_BLACK_BOX"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Formula lifecycle state"
        constraints: "one of DRAFT, COSTED, SUBMITTED, APPROVED, REWORK_REQUIRED, SUPERSEDED, ARCHIVED"
      - name: component_count
        type: integer
        source: computed
        default: 0
        description: "count(FormulaComponent where formula_id == this.id)"
      - name: total_weight_pct
        type: number
        source: computed
        default: 0
        description: "sum(FormulaComponent.weight_pct where formula_id == this.id), 4 decimal places"
      - name: bench_cost_per_kg_cents
        type: integer
        source: computed
        description: "Bench cost per kg of neat flavour; null until the formula has been costed"
      - name: bench_cost_in_use_cents_per_tonne
        type: integer
        source: computed
        description: "BENCH_PROVISIONAL cost-in-use variant per tonne of finished matrix; null until costed"
      - name: firm_cost_in_use_cents_per_tonne
        type: integer
        source: computed
        description: "PRODUCTION_FIRM cost-in-use variant per tonne of finished matrix; null until costed"
      - name: allergen_codes
        type: array
        source: computed
        description: "Transitive union of RawMaterial.allergen_codes over every leaf reached through the component DAG"
      - name: natural_claim_eligible
        type: boolean
        source: computed
        description: "True when every reachable leaf material is NATURAL or NATURAL_FLAVOR_WONF and carries an unexpired VERIFIED NATURAL record; null until costed"
      - name: kosher_eligible
        type: boolean
        source: computed
        description: "True when every reachable leaf material carries an unexpired VERIFIED KOSHER record; null until costed"
      - name: halal_eligible
        type: boolean
        source: computed
        description: "True when every reachable leaf material carries an unexpired VERIFIED HALAL record; null until costed"
      - name: cost_stale
        type: boolean
        source: computed
        default: false
        description: "True when a raw-material reprice recomputed the cost of this formula while it was already APPROVED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Flavorist identity that last submitted the formula; null before first submit"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TechnicalDirector identity that approved the formula; null while never approved"
      - name: rework_reason
        type: enum
        source: system
        description: "Why the formula was pushed back to REWORK_REQUIRED; null while never reworked"
        constraints: "one of DIRECTOR_REJECTION, APPLICATION_TEST_FAILURE, SUBSTANTIATION_REVOKED, RAW_MATERIAL_REPRICED"

  - name: FormulaComponent
    parent: Formula
    common_fields: true
    fields:
      - name: formula_id
        type: string
        source: input
        description: "FK -> Formula.id; the formula this line belongs to"
      - name: component_type
        type: enum
        source: input
        description: "Selects which reference field is populated"
        constraints: "one of RAW_MATERIAL, SUB_FORMULA"
      - name: raw_material_id
        type: string
        source: input
        description: "FK -> RawMaterial.id; required when component_type == RAW_MATERIAL, must be null otherwise"
      - name: sub_formula_id
        type: string
        source: input
        description: "FK -> Formula.id; required when component_type == SUB_FORMULA, must be null otherwise"
      - name: weight_pct
        type: number
        source: input
        description: "Weight percent of this line in the parent formula"
        constraints: "> 0 and <= 100; exactly 4 decimal places retained"
      - name: sequence_no
        type: integer
        source: computed
        description: "1 + count(FormulaComponent where formula_id == this.formula_id and created_at < this.created_at)"
      - name: contribution_cents
        type: integer
        source: computed
        description: "Per-line rounded cost contribution in cents; null until the owning formula is costed"

  - name: SampleLot
    parent: Formula
    common_fields: true
    fields:
      - name: formula_id
        type: string
        source: input
        description: "FK -> Formula.id; the approved formula compounded into this lot"
      - name: lot_number
        type: string
        source: computed
        description: "Retention-traceable lot number minted at creation; globally unique"
        constraints: "matches ^BRF-[0-9]{4}-I[0-9]{2}-L[0-9]{3}$"
      - name: formula_iteration_no
        type: integer
        source: computed
        description: "Snapshot of Formula.iteration_no at compounding time"
      - name: batch_size_g
        type: integer
        source: input
        description: "Grams compounded on the bench"
        constraints: ">= 1 and <= 5000"
      - name: qc_status
        type: enum
        source: system
        default: PENDING
        description: "First parallel state dimension: bench QC verdict"
        constraints: "one of PENDING, PASSED, FAILED"
      - name: disposition_status
        type: enum
        source: system
        default: HELD
        description: "Second parallel state dimension: what the lot may be used for"
        constraints: "one of HELD, RELEASED, SCRAPPED, CONSUMED"
      - name: allocated_g
        type: integer
        source: computed
        default: 0
        description: "Grams committed to retention, application tests and live shipments"
      - name: available_g
        type: integer
        source: computed
        description: "batch_size_g - allocated_g"
      - name: compounded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LabTech identity that compounded the lot"
      - name: qc_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LabTech identity that recorded the QC verdict; null while qc_status == PENDING"

  - name: RetentionCabinet
    parent: null
    common_fields: true
    fields:
      - name: cabinet_code
        type: string
        source: input
        description: "Physical cabinet identifier"
        constraints: "1..40 chars; globally unique (case-sensitive)"
      - name: capacity_slots
        type: integer
        source: input
        description: "Total retention slots the cabinet holds at any single clock position"
        constraints: ">= 1 and <= 200"
      - name: storage_temp_c
        type: number
        source: input
        description: "Nominal storage temperature in degrees Celsius"
        constraints: ">= -40 and <= 30"
      - name: slots_available
        type: integer
        source: computed
        description: "capacity_slots minus the slot_count of every STORED RetentionSample whose stored_from <= logical clock < stored_until"

  - name: RetentionSample
    parent: SampleLot
    common_fields: true
    fields:
      - name: sample_lot_id
        type: string
        source: input
        description: "FK -> SampleLot.id; the lot this retention aliquot was drawn from"
      - name: cabinet_id
        type: string
        source: input
        description: "FK -> RetentionCabinet.id; where the aliquot is stored"
      - name: quantity_g
        type: integer
        source: input
        description: "Grams drawn from the lot for retention"
        constraints: ">= 1"
      - name: slot_count
        type: integer
        source: computed
        description: "ceil(quantity_g / RETENTION_SLOT_CAPACITY_G) using the constant in calculations.retention_slot_occupancy"
      - name: stored_from
        type: datetime
        source: input
        description: "Inclusive start of the storage interval"
      - name: stored_until
        type: datetime
        source: input
        description: "Exclusive end of the storage interval"
      - name: status
        type: enum
        source: system
        default: STORED
        description: "Retention aliquot state"
        constraints: "one of STORED, WITHDRAWN"
      - name: withdrawal_reason
        type: string
        source: system
        description: "Reason recorded at withdrawal; null while STORED"
      - name: withdrawn_at
        type: datetime
        source: system
        description: "Logical-clock instant of withdrawal; null while STORED"

  - name: ApplicationRig
    parent: null
    common_fields: true
    fields:
      - name: rig_code
        type: string
        source: input
        description: "Pilot application rig identifier"
        constraints: "1..40 chars; globally unique (case-sensitive)"
      - name: matrix_type
        type: enum
        source: input
        description: "Finished matrix this rig is plumbed for"
        constraints: "one of BEVERAGE_STILL, BEVERAGE_CARBONATED, DAIRY_YOGURT, BAKERY_SWEET, SAVOURY_SNACK"
      - name: cleanout_buffer_minutes
        type: integer
        source: input
        description: "Minutes of carry-over cleanout required between two occupations of this rig"
        constraints: ">= 0 and <= 480"

  - name: ApplicationTest
    parent: SampleLot
    common_fields: true
    fields:
      - name: sample_lot_id
        type: string
        source: input
        description: "FK -> SampleLot.id; the lot dosed into the finished matrix"
      - name: rig_id
        type: string
        source: input
        description: "FK -> ApplicationRig.id; the rig occupied by this test"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the rig occupation"
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive end of the rig occupation"
      - name: dosage_pct
        type: number
        source: input
        description: "Use level dosed in this test; must equal the brief's dosage_pct"
        constraints: "> 0 and <= 100; exactly 4 decimal places retained"
      - name: consumed_g
        type: integer
        source: input
        description: "Grams of the lot consumed by the test"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Application test state"
        constraints: "one of SCHEDULED, IN_PROGRESS, PASSED, FAILED"
      - name: aroma_score
        type: number
        source: system
        description: "Panel aroma score as recorded; null until a result is recorded"
        constraints: ">= 0 and <= 100"
      - name: taste_score
        type: number
        source: system
        description: "Panel taste score as recorded; null until a result is recorded"
        constraints: ">= 0 and <= 100"
      - name: stability_score
        type: number
        source: system
        description: "Matrix stability score as recorded; null until a result is recorded"
        constraints: ">= 0 and <= 100"
      - name: panel_score
        type: number
        source: computed
        description: "Weighted panel score to 2 decimal places; null until a result is recorded"
      - name: verdict_recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the verdict was recorded; null until a result is recorded"

  - name: SampleShipment
    parent: SampleLot
    common_fields: true
    fields:
      - name: sample_lot_id
        type: string
        source: input
        description: "FK -> SampleLot.id; the lot being shipped"
      - name: brief_id
        type: string
        source: computed
        description: "FK -> CustomerBrief.id; resolved at creation through sample_lot -> formula -> brief"
      - name: destination_country
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 destination country code, upper case"
        constraints: "matches ^[A-Z]{2}$"
      - name: shipped_g
        type: integer
        source: input
        description: "Grams allocated to this shipment"
        constraints: ">= 1"
      - name: carrier
        type: string
        source: input
        description: "Carrier name; null when not yet chosen"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Shipment state"
        constraints: "one of DRAFT, PACKET_ASSEMBLED, BLOCKED, DISPATCHED, CANCELLED"
      - name: required_document_types
        type: array
        source: computed
        description: "Document types the regulatory packet must contain, derived at assembly time"
      - name: packet_valid_until
        type: datetime
        source: computed
        description: "Earliest pinned_valid_until across the packet's substantiation-backed documents; null before assembly"
      - name: tracking_reference
        type: string
        source: system
        description: "Carrier tracking reference captured at dispatch; null before dispatch"
      - name: dispatched_at
        type: datetime
        source: system
        description: "Logical-clock instant of dispatch; null before dispatch"
      - name: block_reason
        type: enum
        source: system
        description: "Why the shipment was blocked; null unless it has been blocked"
        constraints: "one of LOT_HELD, SUBSTANTIATION_REVOKED"
      - name: cancellation_reason
        type: string
        source: system
        description: "Reason recorded at cancellation; null unless cancelled"

  - name: RegulatoryDocument
    parent: SampleShipment
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: system
        description: "FK -> SampleShipment.id; the packet this document belongs to"
      - name: doc_type
        type: enum
        source: system
        description: "Document type generated into the packet"
        constraints: "one of SDS, ALLERGEN_STATEMENT, NATURAL_DECLARATION, KOSHER_CERT, HALAL_CERT, EXPORT_DECLARATION, IP_NDA_ADDENDUM"
      - name: substantiation_id
        type: string
        source: system
        description: "FK -> SubstantiationRecord.id; the pinned certificate, null for document types not backed by a certificate"
      - name: pinned_substantiation_version
        type: integer
        source: system
        description: "SubstantiationRecord.version captured at assembly; null when substantiation_id is null"
      - name: pinned_valid_until
        type: datetime
        source: system
        description: "SubstantiationRecord.valid_until captured at assembly; null when substantiation_id is null"
      - name: status
        type: enum
        source: system
        default: PINNED
        description: "PINNED while the pinned certificate version still matches, STALE once that certificate mutates"
        constraints: "one of PINNED, STALE"
      - name: generated_at
        type: datetime
        source: system
        description: "Logical-clock instant the document was generated into the packet"

  - name: ScaleUpBatch
    parent: Formula
    common_fields: true
    fields:
      - name: formula_id
        type: string
        source: input
        description: "FK -> Formula.id; the approved formula being scaled up"
      - name: target_kg
        type: integer
        source: input
        description: "Production batch size in kg"
        constraints: ">= 1 and <= 20000"
      - name: pinned_formula_version
        type: integer
        source: system
        description: "Snapshot of Formula.version taken when the batch was created; the tolerance step rejects the batch when it no longer matches"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Scale-up batch state"
        constraints: "one of REQUESTED, TOLERANCE_SET, PILOT_RUN, QUALIFIED, REJECTED, CANCELLED"
      - name: material_cost_cents
        type: integer
        source: computed
        description: "Material cost of the whole batch in cents; null until the tolerance step has run"
      - name: compounding_fee_pct
        type: number
        source: computed
        description: "Fee percentage selected from the pre-fee material cost tier; null until the tolerance step has run"
      - name: compounding_fee_cents
        type: integer
        source: computed
        description: "Compounding fee in cents; null until the tolerance step has run"
      - name: batch_total_cents
        type: integer
        source: computed
        description: "material_cost_cents + compounding_fee_cents + QA_RELEASE_FEE_CENTS; null until the tolerance step has run"
      - name: production_cost_per_kg_cents
        type: integer
        source: computed
        description: "batch_total_cents divided by target_kg, rounded; null until the tolerance step has run"
      - name: tolerance_spec
        type: array
        source: computed
        description: "One object per formula component: { component_id, weight_pct, band_pct }; empty until the tolerance step has run"
      - name: measured_yield_kg
        type: number
        source: system
        description: "Yield reported by the pilot run; null before the pilot run"
      - name: yield_variance_pct
        type: number
        source: computed
        description: "Signed percentage deviation of measured_yield_kg from target_kg to 2 decimal places; null before the pilot run"
      - name: decision_note
        type: string
        source: system
        description: "Qualification decision note; null before the decision"
      - name: cancellation_reason
        type: enum
        source: system
        description: "Why the batch was cancelled; null unless cancelled"
        constraints: "one of FORMULA_REWORK, PARENT_SUPERSEDED, BATCH_SUPERSEDED"

  - name: CommercializationForecast
    parent: CustomerBrief
    common_fields: true
    fields:
      - name: brief_id
        type: string
        source: input
        description: "FK -> CustomerBrief.id; the opportunity being forecast"
      - name: annual_volume_kg
        type: integer
        source: input
        description: "Forecast annual flavour volume in kg"
        constraints: ">= 1"
      - name: unit_price_cents_per_kg
        type: integer
        source: input
        description: "Quoted selling price per kg of neat flavour in cents"
        constraints: ">= 1"
      - name: pinned_brief_version
        type: integer
        source: system
        description: "CustomerBrief.version observed by the requester and pinned at forecast creation"
      - name: variant_applied
        type: enum
        source: computed
        description: "Which forecast_value variant produced weighted_annual_value_cents"
        constraints: "one of RISK_WEIGHTED, COMMITTED"
      - name: stage_probability
        type: number
        source: computed
        description: "Stage factor taken from the brief's status; 1.00 under the COMMITTED variant"
      - name: technical_factor
        type: number
        source: computed
        description: "Technical de-risking factor from formula and application-test evidence; 1.00 under the COMMITTED variant"
      - name: weighted_annual_value_cents
        type: integer
        source: computed
        description: "Forecast annual revenue in cents under variant_applied"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Forecast state"
        constraints: "one of ACTIVE, AT_RISK, SUPERSEDED, REALIZED, LAPSED"

  - name: DisclosureGrant
    parent: CustomerBrief
    common_fields: true
    fields:
      - name: brief_id
        type: string
        source: input
        description: "FK -> CustomerBrief.id; the customer engagement the grant is issued under"
      - name: formula_id
        type: string
        source: input
        description: "FK -> Formula.id; the single formula whose composition the grant discloses"
      - name: disclosed_tier
        type: enum
        source: input
        description: "Highest confidentiality tier this grant may disclose"
        constraints: "one of TIER_1_STANDARD, TIER_2_RESTRICTED, TIER_3_BLACK_BOX"
      - name: redaction_level
        type: enum
        source: input
        description: "REDACTED hides material identities and buckets weights; FULL discloses both"
        constraints: "one of REDACTED, FULL"
      - name: expires_at
        type: datetime
        source: input
        description: "Instant the grant stops being usable; the grant is ACTIVE only while the logical clock is strictly before it"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while logical clock < expires_at, otherwise EXPIRED"
        constraints: "one of ACTIVE, EXPIRED"

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:
  - entity: CustomerBrief
    state_field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, CLOSED_WON, CLOSED_LOST]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /customer-briefs/{brief_id}/submit"
        actor: AccountManager
        preconditions: ["status == DRAFT (else ERR_BRIEF_STATE_INVALID)"]
        side_effects: ["increments CustomerBrief.version by 1"]
      - from: CLARIFICATION_REQUESTED
        to: SUBMITTED
        trigger: "POST /customer-briefs/{brief_id}/submit"
        actor: AccountManager
        preconditions: ["status == CLARIFICATION_REQUESTED (else ERR_BRIEF_STATE_INVALID)"]
        side_effects: ["clarification_note is retained verbatim", "clarification_round_count is NOT changed", "increments CustomerBrief.version by 1"]
        note: "Closes the intake revision loop; the brief may re-enter SUBMITTED at most three times."
      - from: SUBMITTED
        to: CLARIFICATION_REQUESTED
        trigger: "POST /customer-briefs/{brief_id}/clarification-request"
        actor: TechnicalDirector
        preconditions: ["status == SUBMITTED (else ERR_BRIEF_STATE_INVALID)", "clarification_round_count <= 2"]
        side_effects: ["increments clarification_round_count by 1", "sets clarification_note to the request body value", "increments CustomerBrief.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /customer-briefs/{brief_id}/clarification-request when clarification_round_count == 3 (automatic exhaustion)"
        actor: TechnicalDirector
        preconditions: ["status == SUBMITTED", "clarification_round_count == 3"]
        side_effects:
          - "sets decision_note to the literal string CLARIFICATION_EXHAUSTED"
          - "sets clarification_note to the request body value"
          - "clarification_round_count is NOT incremented past 3"
          - "cascade: every Formula of this brief with status IN {DRAFT, COSTED, SUBMITTED, REWORK_REQUIRED} -> ARCHIVED"
          - "cascade: every CommercializationForecast of this brief with status IN {ACTIVE, AT_RISK} -> LAPSED"
        note: "Boundary rule: the fourth clarification request does not loop, it terminates the brief."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /customer-briefs/{brief_id}/decision with decision == ACCEPTED"
        actor: TechnicalDirector
        preconditions: ["status == SUBMITTED (else ERR_BRIEF_STATE_INVALID)"]
        side_effects: ["sets decision_note", "increments CustomerBrief.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /customer-briefs/{brief_id}/decision with decision == REJECTED"
        actor: TechnicalDirector
        preconditions: ["status == SUBMITTED (else ERR_BRIEF_STATE_INVALID)"]
        side_effects:
          - "sets decision_note"
          - "cascade: every Formula of this brief with status IN {DRAFT, COSTED, SUBMITTED, REWORK_REQUIRED} -> ARCHIVED"
          - "cascade: every CommercializationForecast of this brief with status IN {ACTIVE, AT_RISK} -> LAPSED"
      - from: ACCEPTED
        to: CLOSED_WON
        trigger: "POST /customer-briefs/{brief_id}/close with outcome == WON"
        actor: AccountManager
        preconditions:
          - "status == ACCEPTED (else ERR_BRIEF_STATE_INVALID)"
          - "at least one Formula with brief_id == this brief has status == APPROVED (else ERR_FORMULA_NOT_APPROVED)"
        side_effects:
          - "sets outcome = WON and closed_at = logical clock"
          - "cascade: every CommercializationForecast of this brief with status IN {ACTIVE, AT_RISK} -> REALIZED and its weighted_annual_value_cents is recomputed under the COMMITTED variant of calculations.forecast_value"
          - "cascade: every Formula of this brief with status IN {DRAFT, COSTED, SUBMITTED, REWORK_REQUIRED} -> ARCHIVED"
      - from: ACCEPTED
        to: CLOSED_LOST
        trigger: "POST /customer-briefs/{brief_id}/close with outcome == LOST"
        actor: AccountManager
        preconditions: ["status == ACCEPTED (else ERR_BRIEF_STATE_INVALID)", "loss_reason present in the request body (else ERR_INVALID_REQUEST)"]
        side_effects:
          - "sets outcome = LOST, loss_reason, closed_at = logical clock"
          - "cascade: every CommercializationForecast of this brief with status IN {ACTIVE, AT_RISK} -> LAPSED"
          - "cascade: every Formula of this brief with status IN {DRAFT, COSTED, SUBMITTED, REWORK_REQUIRED} -> ARCHIVED"
          - "cascade: every SampleShipment whose brief_id == this brief and status IN {DRAFT, PACKET_ASSEMBLED, BLOCKED} -> CANCELLED with cancellation_reason BRIEF_CLOSED_LOST; each cancellation returns shipped_g to its SampleLot (see calculations.sample_mass_ledger)"

  - entity: SubstantiationRecord
    state_field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /substantiation-records/{record_id}/verify"
        actor: RegulatoryAffairs
        preconditions: ["status == PENDING (else ERR_SUBSTANTIATION_STATE_INVALID)"]
        side_effects:
          - "sets verified_at = logical clock"
          - "increments SubstantiationRecord.version by 1"
          - "recomputes RawMaterial.verified_claim_types for raw_material_id"
      - from: REVOKED
        to: VERIFIED
        trigger: "POST /substantiation-records/{record_id}/verify (re-verification after remediation)"
        actor: RegulatoryAffairs
        preconditions: ["status == REVOKED"]
        side_effects:
          - "sets verified_at = logical clock"
          - "increments SubstantiationRecord.version by 1"
          - "recomputes RawMaterial.claim_status for raw_material_id: back to CLEAR when no other record of that material is REVOKED"
          - "cascade: every RegulatoryDocument with substantiation_id == this record and status == PINNED -> STALE, because pinned_substantiation_version no longer equals this record's version"
        note: "Closes the certificate revision loop. Re-verification deliberately invalidates already-assembled packets."
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /substantiation-records/{record_id}/revoke"
        actor: RegulatoryAffairs
        preconditions: ["status == VERIFIED (else ERR_SUBSTANTIATION_STATE_INVALID)"]
        side_effects:
          - "sets revocation_reason; increments SubstantiationRecord.version by 1"
          - "LINK 1 - because this record became REVOKED: RawMaterial.claim_status for raw_material_id -> RESTRICTED and claim_type is removed from verified_claim_types"
          - "LINK 2 - because that RawMaterial became RESTRICTED: every Formula that transitively contains it through the component DAG and whose status == APPROVED -> REWORK_REQUIRED with rework_reason SUBSTANTIATION_REVOKED, but ONLY when claim_type is in the required claim set of that formula's brief ({NATURAL if natural_claim_required} u {KOSHER if kosher_required} u {HALAL if halal_required}); the eligibility flag for claim_type on those formulas is recomputed to false"
          - "LINK 3 - because those Formulas left APPROVED: each of their SampleLots with disposition_status == RELEASED -> HELD (see the SampleLot disposition machine)"
          - "LINK 4 - because those SampleLots became HELD: each of their SampleShipments with status IN {DRAFT, PACKET_ASSEMBLED} -> BLOCKED with block_reason LOT_HELD"
          - "fan-out at LINK 2 (independent of LINK 3/4): those Formulas' ScaleUpBatch rows with status IN {REQUESTED, TOLERANCE_SET, PILOT_RUN} -> CANCELLED with cancellation_reason FORMULA_REWORK, and the brief's CommercializationForecast with status == ACTIVE -> AT_RISK with weighted_annual_value_cents recomputed"
          - "cascade: every RegulatoryDocument with substantiation_id == this record and status == PINNED -> STALE"

  - entity: Formula
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: COSTED
        trigger: "POST /formulas/{formula_id}/cost"
        actor: Flavorist
        preconditions:
          - "status == DRAFT (else ERR_FORMULA_STATE_INVALID)"
          - "component_count >= 1 (else ERR_FORMULA_NO_COMPONENTS)"
          - "total_weight_pct == 100.0000 exactly (else ERR_WEIGHT_SUM_INVALID)"
          - "every SUB_FORMULA component's referenced Formula has status IN {COSTED, APPROVED} (else ERR_SUB_FORMULA_NOT_COSTED)"
        side_effects:
          - "runs calculations.formula_bench_cost: writes FormulaComponent.contribution_cents for every line and Formula.bench_cost_per_kg_cents"
          - "runs calculations.formula_cost_in_use: writes bench_cost_in_use_cents_per_tonne and firm_cost_in_use_cents_per_tonne"
          - "runs calculations.formula_claim_profile: writes allergen_codes, natural_claim_eligible, kosher_eligible, halal_eligible"
          - "sets cost_stale = false"
          - "increments Formula.version by 1"
      - from: COSTED
        to: DRAFT
        trigger: "POST /formulas/{formula_id}/components or DELETE /formula-components/{component_id} (cost invalidation on edit)"
        actor: Flavorist
        preconditions: ["status == COSTED"]
        side_effects:
          - "the new FormulaComponent row is created, or the named FormulaComponent row is removed"
          - "clears bench_cost_per_kg_cents, bench_cost_in_use_cents_per_tonne, firm_cost_in_use_cents_per_tonne, natural_claim_eligible, kosher_eligible, halal_eligible to null and allergen_codes to []"
          - "clears contribution_cents to null on every FormulaComponent of this formula"
          - "recomputes component_count and total_weight_pct"
      - from: REWORK_REQUIRED
        to: DRAFT
        trigger: "POST /formulas/{formula_id}/components or DELETE /formula-components/{component_id} (rework resumes editing)"
        actor: Flavorist
        preconditions: ["status == REWORK_REQUIRED"]
        side_effects: ["same field clearing as the COSTED -> DRAFT edit transition", "rework_reason is retained for audit"]
      - from: COSTED
        to: SUBMITTED
        trigger: "POST /formulas/{formula_id}/submit"
        actor: Flavorist
        preconditions:
          - "status == COSTED (else ERR_FORMULA_STATE_INVALID)"
          - "brief.status == ACCEPTED (else ERR_BRIEF_NOT_ACCEPTED)"
          - "allergen_codes intersect brief.allergen_exclusions is empty (else ERR_ALLERGEN_EXCLUSION_BREACH)"
          - "for each required claim of the brief the matching eligibility flag is true (else ERR_CLAIM_UNSUBSTANTIATED)"
          - "bench_cost_in_use_cents_per_tonne <= brief.cost_in_use_cap_cents_per_tonne (else ERR_COST_IN_USE_CAP_EXCEEDED)"
        side_effects: ["sets submitted_by_user_id = X-User-ID of the caller", "increments Formula.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /formulas/{formula_id}/decision with decision == APPROVED"
        actor: TechnicalDirector
        preconditions:
          - "status == SUBMITTED (else ERR_FORMULA_STATE_INVALID)"
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "brief.status == ACCEPTED (else ERR_BRIEF_NOT_ACCEPTED)"
        side_effects:
          - "sets approved_by_user_id = X-User-ID of the caller"
          - "increments Formula.version by 1"
          - "cascade: the brief's CommercializationForecast with status == AT_RISK -> ACTIVE"
          - "cascade: the brief's CommercializationForecast with status IN {ACTIVE, AT_RISK} has technical_factor and weighted_annual_value_cents recomputed by calculations.forecast_value"
      - from: SUBMITTED
        to: REWORK_REQUIRED
        trigger: "POST /formulas/{formula_id}/decision with decision == REWORK_REQUIRED"
        actor: TechnicalDirector
        preconditions: ["status == SUBMITTED (else ERR_FORMULA_STATE_INVALID)", "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "sets rework_reason = DIRECTOR_REJECTION"
          - "cascade: the brief's CommercializationForecast with status == ACTIVE keeps status ACTIVE and has technical_factor and weighted_annual_value_cents recomputed"
        note: "A formula that was never APPROVED does not put the forecast AT_RISK; only the APPROVED -> REWORK_REQUIRED transition does."
      - from: SUBMITTED
        to: REWORK_REQUIRED
        trigger: "system event: PATCH /raw-materials/{material_id} repriced a material this formula transitively contains"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: ["sets rework_reason = RAW_MATERIAL_REPRICED", "cost fields are recomputed in place from the new price"]
      - from: APPROVED
        to: REWORK_REQUIRED
        trigger: "system event: application test FAILED, or a required-claim SubstantiationRecord for a contained material was REVOKED"
        actor: system
        preconditions: ["status == APPROVED"]
        side_effects:
          - "sets rework_reason = APPLICATION_TEST_FAILURE or SUBSTANTIATION_REVOKED according to the trigger"
          - "sets cost_stale = false"
          - "because the formula left APPROVED: every SampleLot of this formula with disposition_status == RELEASED -> HELD"
          - "because those SampleLots became HELD: every SampleShipment of those lots with status IN {DRAFT, PACKET_ASSEMBLED} -> BLOCKED with block_reason LOT_HELD"
          - "because the formula left APPROVED: every ScaleUpBatch of this formula with status IN {REQUESTED, TOLERANCE_SET, PILOT_RUN} -> CANCELLED with cancellation_reason FORMULA_REWORK"
          - "because the formula left APPROVED: the brief's CommercializationForecast with status == ACTIVE -> AT_RISK and weighted_annual_value_cents is recomputed by calculations.forecast_value"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /formulas/{formula_id}/revisions"
        actor: Flavorist
        preconditions:
          - "status IN {APPROVED, REWORK_REQUIRED} (else ERR_FORMULA_NOT_REVISABLE)"
          - "expected_formula_version == version (else ERR_STALE_FORMULA_VERSION, see concurrency_rules)"
        side_effects:
          - "creates the successor Formula in status DRAFT with parent_formula_id = this formula and iteration_no = 1 + count(Formula of the same brief created earlier)"
          - "sets superseded_by_formula_id on this formula and increments Formula.version by 1"
          - "when carry_components == true, copies this formula's FormulaComponent rows to the successor in ascending sequence_no order"
          - "cascade: every ScaleUpBatch of this formula with status IN {REQUESTED, TOLERANCE_SET} -> CANCELLED with cancellation_reason PARENT_SUPERSEDED"
      - from: REWORK_REQUIRED
        to: SUPERSEDED
        trigger: "POST /formulas/{formula_id}/revisions"
        actor: Flavorist
        preconditions: ["status IN {APPROVED, REWORK_REQUIRED}", "expected_formula_version == version"]
        side_effects: ["identical to the APPROVED -> SUPERSEDED transition"]
      - from: DRAFT
        to: ARCHIVED
        trigger: "system event: the owning brief reached REJECTED, CLOSED_WON or CLOSED_LOST"
        actor: system
        preconditions: ["status IN {DRAFT, COSTED, SUBMITTED, REWORK_REQUIRED}"]
        side_effects: ["no further transition is possible from ARCHIVED"]
      - from: COSTED
        to: ARCHIVED
        trigger: "system event: the owning brief reached REJECTED, CLOSED_WON or CLOSED_LOST"
        actor: system
        preconditions: ["status IN {DRAFT, COSTED, SUBMITTED, REWORK_REQUIRED}"]
        side_effects: ["no further transition is possible from ARCHIVED"]
      - from: SUBMITTED
        to: ARCHIVED
        trigger: "system event: the owning brief reached REJECTED, CLOSED_WON or CLOSED_LOST"
        actor: system
        preconditions: ["status IN {DRAFT, COSTED, SUBMITTED, REWORK_REQUIRED}"]
        side_effects: ["no further transition is possible from ARCHIVED"]
      - from: REWORK_REQUIRED
        to: ARCHIVED
        trigger: "system event: the owning brief reached REJECTED, CLOSED_WON or CLOSED_LOST"
        actor: system
        preconditions: ["status IN {DRAFT, COSTED, SUBMITTED, REWORK_REQUIRED}"]
        side_effects: ["no further transition is possible from ARCHIVED"]

  - entity: SampleLot
    state_field: qc_status
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /sample-lots/{lot_id}/qc with result == PASSED"
        actor: LabTech
        preconditions:
          - "qc_status == PENDING (else ERR_LOT_STATE_INVALID)"
          - "X-User-ID != compounded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["sets qc_by_user_id = X-User-ID", "disposition_status is NOT changed by this dimension"]
      - from: PENDING
        to: FAILED
        trigger: "POST /sample-lots/{lot_id}/qc with result == FAILED"
        actor: LabTech
        preconditions:
          - "qc_status == PENDING (else ERR_LOT_STATE_INVALID)"
          - "X-User-ID != compounded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["sets qc_by_user_id = X-User-ID", "cross-dimension effect: disposition_status HELD -> SCRAPPED"]
    note: "First of two independent parallel state dimensions on SampleLot; qc_status and disposition_status evolve on the same row through different endpoints."

  - entity: SampleLot
    state_field: disposition_status
    initial_state: HELD
    terminal_states: [SCRAPPED]
    transitions:
      - from: HELD
        to: RELEASED
        trigger: "POST /sample-lots/{lot_id}/release"
        actor: LabTech
        preconditions:
          - "disposition_status == HELD (else ERR_LOT_STATE_INVALID)"
          - "qc_status == PASSED (else ERR_LOT_NOT_QC_PASSED) - cross-dimension guard"
          - "formula.status == APPROVED (else ERR_FORMULA_NOT_APPROVED)"
        side_effects: ["the lot becomes eligible for application tests and shipments"]
      - from: HELD
        to: SCRAPPED
        trigger: "system event: QC verdict FAILED on this lot"
        actor: system
        preconditions: ["disposition_status == HELD"]
        side_effects: ["no allocation of any kind is accepted against a SCRAPPED lot"]
      - from: RELEASED
        to: HELD
        trigger: "system event: the lot's Formula left APPROVED (rework cascade)"
        actor: system
        preconditions: ["disposition_status == RELEASED"]
        side_effects: ["because the lot became HELD: its SampleShipment rows with status IN {DRAFT, PACKET_ASSEMBLED} -> BLOCKED with block_reason LOT_HELD"]
      - from: RELEASED
        to: CONSUMED
        trigger: "system event: an allocation (retention, application test or shipment) drove available_g to 0"
        actor: system
        preconditions: ["disposition_status == RELEASED", "available_g == 0 after the allocation"]
        side_effects: ["no further allocation can succeed while available_g == 0"]
      - from: CONSUMED
        to: RELEASED
        trigger: "system event: a compensating action (retention withdrawal or shipment cancellation) returned grams"
        actor: system
        preconditions: ["disposition_status == CONSUMED", "available_g > 0 after the compensating action"]
        side_effects: ["restores allocation eligibility; conserves calculations.sample_mass_ledger"]
    note: "Second parallel dimension on SampleLot. The RELEASED <-> CONSUMED pair is the mass-conservation loop."

  - entity: RetentionSample
    state_field: status
    initial_state: STORED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: STORED
        to: WITHDRAWN
        trigger: "POST /retention-samples/{retention_id}/withdraw"
        actor: LabTech
        preconditions: ["status == STORED (else ERR_RETENTION_STATE_INVALID)"]
        side_effects:
          - "sets withdrawal_reason and withdrawn_at = logical clock"
          - "the row leaves the STORED filter of calculations.retention_slot_occupancy, so cabinet.slots_available rises by slot_count"
          - "the row leaves the allocation filter of calculations.sample_mass_ledger, so lot.available_g rises by quantity_g"
          - "if the lot's disposition_status == CONSUMED and available_g > 0 afterwards: lot disposition_status -> RELEASED"

  - entity: ApplicationTest
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /application-tests/{test_id}/start"
        actor: LabTech
        preconditions:
          - "status == SCHEDULED (else ERR_TEST_STATE_INVALID)"
          - "sample_lot.qc_status == PASSED (else ERR_LOT_NOT_QC_PASSED)"
          - "sample_lot.disposition_status == RELEASED (else ERR_LOT_NOT_RELEASED)"
        side_effects: ["the rig occupation is now firm; the interval still participates in overlap detection"]
        note: "Guarded transition: a rework cascade that puts the lot back to HELD blocks the start even though the test row itself is untouched."
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /application-tests/{test_id}/result with panel_score >= PANEL_PASS_THRESHOLD"
        actor: LabTech
        preconditions: ["status == IN_PROGRESS (else ERR_TEST_STATE_INVALID)"]
        side_effects:
          - "runs calculations.application_panel_score and stores aroma_score, taste_score, stability_score, panel_score, verdict_recorded_at"
          - "cascade: the formula's brief's CommercializationForecast with status IN {ACTIVE, AT_RISK} has technical_factor recomputed to 1.00 and weighted_annual_value_cents recomputed"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /application-tests/{test_id}/result with panel_score < PANEL_PASS_THRESHOLD"
        actor: LabTech
        preconditions: ["status == IN_PROGRESS (else ERR_TEST_STATE_INVALID)"]
        side_effects:
          - "runs calculations.application_panel_score and stores the scores and verdict_recorded_at"
          - "LINK 1 - because this test FAILED: the lot's Formula with status == APPROVED -> REWORK_REQUIRED with rework_reason APPLICATION_TEST_FAILURE"
          - "LINK 2 - because that Formula left APPROVED: the brief's CommercializationForecast with status == ACTIVE -> AT_RISK and weighted_annual_value_cents is recomputed by calculations.forecast_value with technical_factor 0.55"
          - "fan-out at LINK 1: that formula's SampleLots RELEASED -> HELD, its ScaleUpBatch rows -> CANCELLED with cancellation_reason FORMULA_REWORK, and shipments of the held lots -> BLOCKED"

  - entity: SampleShipment
    state_field: status
    initial_state: DRAFT
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PACKET_ASSEMBLED
        trigger: "POST /shipments/{shipment_id}/assemble-packet"
        actor: RegulatoryAffairs
        preconditions:
          - "status IN {DRAFT, BLOCKED} (else ERR_SHIPMENT_STATE_INVALID)"
          - "for every doc type in calculations.regulatory_packet.required_document_types that is certificate-backed, a substantiation record satisfying the pin selector exists (else ERR_DOC_PACKET_INCOMPLETE)"
        side_effects:
          - "runs calculations.regulatory_packet: writes required_document_types"
          - "creates one RegulatoryDocument per required type that has no row yet, in the enum order declared on RegulatoryDocument.doc_type, each with status PINNED and generated_at = logical clock"
          - "re-pins substantiation_id, pinned_substantiation_version and pinned_valid_until on every RegulatoryDocument of this shipment and sets their status to PINNED"
          - "sets packet_valid_until = min(pinned_valid_until) over the certificate-backed documents"
      - from: BLOCKED
        to: PACKET_ASSEMBLED
        trigger: "POST /shipments/{shipment_id}/assemble-packet (re-assembly after remediation)"
        actor: RegulatoryAffairs
        preconditions: ["status IN {DRAFT, BLOCKED}", "same packet derivability precondition as the DRAFT transition"]
        side_effects: ["identical to the DRAFT -> PACKET_ASSEMBLED transition", "clears block_reason to null"]
        note: "Closes the shipment remediation loop: BLOCKED -> PACKET_ASSEMBLED -> DISPATCHED."
      - from: PACKET_ASSEMBLED
        to: DISPATCHED
        trigger: "POST /shipments/{shipment_id}/dispatch"
        actor: RegulatoryAffairs
        preconditions:
          - "status == PACKET_ASSEMBLED (else ERR_SHIPMENT_STATE_INVALID)"
          - "every certificate-backed RegulatoryDocument of the packet has its SubstantiationRecord in status VERIFIED (else ERR_SUBSTANTIATION_REVOKED)"
          - "packet_valid_until >= logical clock (else ERR_PACKET_EXPIRED)"
          - "every RegulatoryDocument of the packet has status == PINNED and pinned_substantiation_version == its record's current version (else ERR_PINNED_DOC_STALE)"
        side_effects: ["sets tracking_reference and dispatched_at = logical clock", "shipped_g stays allocated against the lot permanently"]
      - from: DRAFT
        to: BLOCKED
        trigger: "system event: the shipped SampleLot went RELEASED -> HELD"
        actor: system
        preconditions: ["status IN {DRAFT, PACKET_ASSEMBLED}"]
        side_effects: ["sets block_reason = LOT_HELD", "shipped_g stays allocated while blocked"]
      - from: PACKET_ASSEMBLED
        to: BLOCKED
        trigger: "system event: the shipped SampleLot went RELEASED -> HELD"
        actor: system
        preconditions: ["status IN {DRAFT, PACKET_ASSEMBLED}"]
        side_effects: ["sets block_reason = LOT_HELD", "already generated RegulatoryDocument rows are retained"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /shipments/{shipment_id}/cancel, or system event: the brief reached CLOSED_LOST"
        actor: AccountManager
        preconditions: ["status IN {DRAFT, PACKET_ASSEMBLED, BLOCKED} (else ERR_SHIPMENT_STATE_INVALID)"]
        side_effects:
          - "sets cancellation_reason"
          - "the row leaves the allocation filter of calculations.sample_mass_ledger, so lot.available_g rises by shipped_g"
          - "if the lot's disposition_status == CONSUMED and available_g > 0 afterwards: lot disposition_status -> RELEASED"
      - from: PACKET_ASSEMBLED
        to: CANCELLED
        trigger: "POST /shipments/{shipment_id}/cancel"
        actor: AccountManager
        preconditions: ["status IN {DRAFT, PACKET_ASSEMBLED, BLOCKED}"]
        side_effects: ["identical to the DRAFT -> CANCELLED transition"]
      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /shipments/{shipment_id}/cancel"
        actor: AccountManager
        preconditions: ["status IN {DRAFT, PACKET_ASSEMBLED, BLOCKED}"]
        side_effects: ["identical to the DRAFT -> CANCELLED transition"]

  - entity: RegulatoryDocument
    state_field: status
    initial_state: PINNED
    terminal_states: []
    transitions:
      - from: PINNED
        to: STALE
        trigger: "system event: the pinned SubstantiationRecord's version advanced (verify or revoke)"
        actor: system
        preconditions: ["status == PINNED", "substantiation_id is not null"]
        side_effects: ["the owning shipment can no longer be dispatched until re-assembly re-pins the document"]
      - from: STALE
        to: PINNED
        trigger: "POST /shipments/{shipment_id}/assemble-packet (re-pin)"
        actor: RegulatoryAffairs
        preconditions: ["status == STALE"]
        side_effects: ["pinned_substantiation_version and pinned_valid_until are refreshed from the record's current values"]

  - entity: ScaleUpBatch
    state_field: status
    initial_state: REQUESTED
    terminal_states: [QUALIFIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: TOLERANCE_SET
        trigger: "POST /scale-up-batches/{batch_id}/tolerance"
        actor: TechnicalDirector
        preconditions:
          - "status IN {REQUESTED, REJECTED} (else ERR_BATCH_STATE_INVALID)"
          - "formula.status == APPROVED (else ERR_FORMULA_NOT_APPROVED)"
          - "pinned_formula_version == formula.version (else ERR_PINNED_FORMULA_STALE)"
        side_effects:
          - "runs calculations.production_cost: writes material_cost_cents, compounding_fee_pct, compounding_fee_cents, batch_total_cents, production_cost_per_kg_cents"
          - "runs calculations.component_tolerance_band: writes one tolerance_spec entry per FormulaComponent of the formula in ascending sequence_no order"
      - from: REJECTED
        to: TOLERANCE_SET
        trigger: "POST /scale-up-batches/{batch_id}/tolerance (re-specification after a rejected pilot)"
        actor: TechnicalDirector
        preconditions: ["status IN {REQUESTED, REJECTED}", "formula.status == APPROVED", "pinned_formula_version == formula.version"]
        side_effects: ["recomputes every field the REQUESTED -> TOLERANCE_SET transition writes", "clears measured_yield_kg and yield_variance_pct to null"]
        note: "Closes the scale-up qualification loop."
      - from: TOLERANCE_SET
        to: PILOT_RUN
        trigger: "POST /scale-up-batches/{batch_id}/pilot-run"
        actor: LabTech
        preconditions: ["status == TOLERANCE_SET (else ERR_BATCH_STATE_INVALID)"]
        side_effects: ["stores measured_yield_kg", "computes yield_variance_pct = round_half_up((measured_yield_kg - target_kg) * 100 / target_kg, 2)"]
      - from: PILOT_RUN
        to: QUALIFIED
        trigger: "POST /scale-up-batches/{batch_id}/decision with decision == QUALIFIED"
        actor: TechnicalDirector
        preconditions: ["status == PILOT_RUN (else ERR_BATCH_STATE_INVALID)"]
        side_effects: ["sets decision_note"]
      - from: PILOT_RUN
        to: REJECTED
        trigger: "POST /scale-up-batches/{batch_id}/decision with decision == REJECTED"
        actor: TechnicalDirector
        preconditions: ["status == PILOT_RUN (else ERR_BATCH_STATE_INVALID)"]
        side_effects: ["sets decision_note", "the batch may re-enter TOLERANCE_SET"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "system event: formula rework, parent formula superseded, or a newer batch superseded this one"
        actor: system
        preconditions: ["status IN {REQUESTED, TOLERANCE_SET, PILOT_RUN}"]
        side_effects: ["sets cancellation_reason to FORMULA_REWORK, PARENT_SUPERSEDED or BATCH_SUPERSEDED"]
      - from: TOLERANCE_SET
        to: CANCELLED
        trigger: "system event: formula rework, parent formula superseded, or a newer batch superseded this one"
        actor: system
        preconditions: ["status IN {REQUESTED, TOLERANCE_SET, PILOT_RUN}"]
        side_effects: ["sets cancellation_reason to FORMULA_REWORK, PARENT_SUPERSEDED or BATCH_SUPERSEDED"]
      - from: PILOT_RUN
        to: CANCELLED
        trigger: "system event: formula rework or a newer batch superseded this one"
        actor: system
        preconditions: ["status IN {REQUESTED, TOLERANCE_SET, PILOT_RUN}"]
        side_effects: ["sets cancellation_reason to FORMULA_REWORK or BATCH_SUPERSEDED"]

  - entity: CommercializationForecast
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REALIZED, LAPSED]
    transitions:
      - from: ACTIVE
        to: AT_RISK
        trigger: "system event: a Formula of the brief left APPROVED for REWORK_REQUIRED"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: ["technical_factor recomputed to 0.55 and weighted_annual_value_cents recomputed under the RISK_WEIGHTED variant"]
      - from: AT_RISK
        to: ACTIVE
        trigger: "system event: a Formula of the brief reached APPROVED again"
        actor: system
        preconditions: ["status == AT_RISK"]
        side_effects: ["technical_factor and weighted_annual_value_cents recomputed under the RISK_WEIGHTED variant"]
        note: "Recovery loop: the forecast oscillates with the formula's approval state."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: POST /commercialization-forecasts created a newer forecast for the same brief"
        actor: system
        preconditions: ["status IN {ACTIVE, AT_RISK}"]
        side_effects: ["the superseded row keeps its computed values frozen"]
      - from: AT_RISK
        to: SUPERSEDED
        trigger: "system event: POST /commercialization-forecasts created a newer forecast for the same brief"
        actor: system
        preconditions: ["status IN {ACTIVE, AT_RISK}"]
        side_effects: ["the superseded row keeps its computed values frozen"]
      - from: ACTIVE
        to: REALIZED
        trigger: "system event: the brief reached CLOSED_WON"
        actor: system
        preconditions: ["status IN {ACTIVE, AT_RISK}"]
        side_effects: ["variant_applied -> COMMITTED, stage_probability -> 1.00, technical_factor -> 1.00, weighted_annual_value_cents recomputed under the COMMITTED variant"]
      - from: AT_RISK
        to: REALIZED
        trigger: "system event: the brief reached CLOSED_WON"
        actor: system
        preconditions: ["status IN {ACTIVE, AT_RISK}"]
        side_effects: ["identical to the ACTIVE -> REALIZED transition"]
      - from: ACTIVE
        to: LAPSED
        trigger: "system event: the brief reached CLOSED_LOST or REJECTED"
        actor: system
        preconditions: ["status IN {ACTIVE, AT_RISK}"]
        side_effects: ["computed values are frozen at their pre-close values"]
      - from: AT_RISK
        to: LAPSED
        trigger: "system event: the brief reached CLOSED_LOST or REJECTED"
        actor: system
        preconditions: ["status IN {ACTIVE, AT_RISK}"]
        side_effects: ["computed values are frozen at their pre-close values"]

# ============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ============================================================================

concurrency_rules:
  - rule_id: formula-revision-stale-parent
    parent_entity: Formula
    write_endpoint: "POST /formulas/{formula_id}/revisions"
    occ_field: "expected_formula_version"
    description: |
      Creating a revision of a Formula whose version has advanced since the
      client last observed it is rejected. The product semantics legitimately
      allow a new revision to supersede the parent (parent -> SUPERSEDED), so a
      second create against the same parent view is not blocked by any state
      precondition; it is blocked because the caller's view of the parent is
      stale.
    error_id: ERR_STALE_FORMULA_VERSION
    http_status: 412
  - rule_id: forecast-create-stale-brief
    parent_entity: CustomerBrief
    write_endpoint: "POST /commercialization-forecasts"
    occ_field: "expected_brief_version"
    description: |
      Creating a CommercializationForecast against a CustomerBrief whose version
      has advanced since the client last observed it is rejected. A newer
      forecast legitimately supersedes the prior ACTIVE forecast for the brief,
      so the second create is otherwise valid; it is rejected only because the
      caller pinned an outdated brief version.
    error_id: ERR_STALE_BRIEF_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================

calculations:
  - name: formula_bench_cost
    trigger: "the Formula DRAFT -> COSTED transition (POST /formulas/{formula_id}/cost)"
    algorithm: topological
    formula: |
      # Step 1 - resolve the component DAG bottom-up.
      # visit(F) walks FormulaComponent rows of F in ascending sequence_no
      # (equivalently created_at ASC); SUB_FORMULA lines are resolved before the
      # parent line is priced. The DAG is acyclic by construction (see
      # validations ERR_FORMULA_CYCLE), so the walk terminates.
      #
      # Step 2 - price each line, ROUNDING PER LINE FIRST (pinned order):
      for line in components(F) ordered by sequence_no ASC:
          if line.component_type == RAW_MATERIAL:
              unit_cents = line.raw_material.cost_per_kg_cents
          else:
              unit_cents = bench_cost_per_kg_cents(line.sub_formula)   # already resolved
          line.contribution_cents = round_half_up(unit_cents * line.weight_pct / 100, 0)
      #
      # Step 3 - sum the ALREADY ROUNDED line contributions:
      F.bench_cost_per_kg_cents = sum(line.contribution_cents for line in components(F))
      #
      # PINNED ORDER: round-per-line-then-sum. Summing the unrounded products and
      # rounding once at the end is WRONG and yields a different integer
      # (worked example: 1699.9875 + 123.45 + 1154.25 -> per-line 1700 + 123 +
      # 1154 = 2977, sum-then-round = 2978).
    input_set: "every FormulaComponent row of the formula, no status filter (components have no status); SUB_FORMULA lines require the referenced Formula to be in status COSTED or APPROVED, so its bench_cost_per_kg_cents is non-null"
    constants: {}
    precision: "integer cents; round_half_up applied once per component line, never to the sum"
    variants: []

  - name: formula_cost_in_use
    trigger: "the Formula DRAFT -> COSTED transition (POST /formulas/{formula_id}/cost); recomputed in place by PATCH /raw-materials/{material_id} for formulas whose status is APPROVED or SUBMITTED"
    algorithm: tiered_pricing
    formula: |
      # BENCH_PROVISIONAL variant (always written to bench_cost_in_use_cents_per_tonne)
      bench_cost_in_use_cents_per_tonne =
          round_half_up(F.bench_cost_per_kg_cents * brief.dosage_pct * 10, 0)
      # (1 tonne of finished matrix carries 1000 * dosage_pct / 100 kg of flavour,
      #  i.e. dosage_pct * 10 kg.)
      #
      # PRODUCTION_FIRM variant (always written to firm_cost_in_use_cents_per_tonne)
      if   brief.annual_volume_kg <  500: discount_pct = VOLUME_DISCOUNT_TIER_1_PCT
      elif brief.annual_volume_kg < 2000: discount_pct = VOLUME_DISCOUNT_TIER_2_PCT
      else:                               discount_pct = VOLUME_DISCOUNT_TIER_3_PCT
      firm_cost_per_kg_cents =
          round_half_up(F.bench_cost_per_kg_cents * (1 - discount_pct/100) / (1 - YIELD_LOSS_PCT/100), 0)
      firm_cost_in_use_cents_per_tonne =
          round_half_up(firm_cost_per_kg_cents * brief.dosage_pct * 10, 0)
      #
      # The submit gate (validations priority 82) compares the BENCH_PROVISIONAL
      # value against brief.cost_in_use_cap_cents_per_tonne. The PRODUCTION_FIRM
      # value is reported but NEVER used as the gate, so a formula can be
      # rejected on bench cost while its firm cost sits under the cap.
    input_set: "the formula's own bench_cost_per_kg_cents plus brief.dosage_pct and brief.annual_volume_kg of the owning CustomerBrief"
    constants:
      VOLUME_DISCOUNT_TIER_1_PCT: 0.0
      VOLUME_DISCOUNT_TIER_2_PCT: 4.0
      VOLUME_DISCOUNT_TIER_3_PCT: 7.5
      YIELD_LOSS_PCT: 2.5
    precision: "integer cents per tonne; round_half_up at each of the two named steps"
    variants:
      - name: BENCH_PROVISIONAL
        when: "always computed at costing time; the only variant the submit cost cap is evaluated against"
        difference: "uses raw-material list prices with no volume discount and no yield loss"
      - name: PRODUCTION_FIRM
        when: "always computed at costing time; reported to the customer and used for margin discussion"
        difference: "applies the annual-volume price-break discount and then inflates for production yield loss, so the same formula and brief produce a different cents-per-tonne figure than BENCH_PROVISIONAL"

  - name: formula_claim_profile
    trigger: "the Formula DRAFT -> COSTED transition (POST /formulas/{formula_id}/cost)"
    algorithm: constraint_propagation
    formula: |
      leaves(F) = every RawMaterial reached by walking FormulaComponent rows of F
                  in ascending sequence_no, descending into SUB_FORMULA lines
                  recursively (a material reached twice counts once).
      F.allergen_codes = union(m.allergen_codes for m in leaves(F))   # sorted ascending, deduplicated
      substantiated(m, claim) = exists SubstantiationRecord r with
                                   r.raw_material_id == m.id
                               AND r.claim_type == claim
                               AND r.status == VERIFIED
                               AND r.valid_until >= logical_clock_now     # boundary: equality is still valid
      F.natural_claim_eligible = all(m.natural_status IN {NATURAL, NATURAL_FLAVOR_WONF}
                                     AND substantiated(m, NATURAL) for m in leaves(F))
      F.kosher_eligible        = all(substantiated(m, KOSHER) for m in leaves(F))
      F.halal_eligible         = all(substantiated(m, HALAL)  for m in leaves(F))
      # An empty leaf set cannot occur: costing requires component_count >= 1.
    input_set: "the transitive leaf RawMaterial set of the component DAG, and for each leaf only SubstantiationRecord rows in status VERIFIED whose valid_until >= the logical clock; PENDING and REVOKED records are excluded"
    constants: {}
    precision: "boolean flags; allergen_codes emitted as an ascending, deduplicated string array"
    variants: []

  - name: lot_number_minting
    trigger: "POST /sample-lots (SampleLot creation)"
    algorithm: aggregation
    formula: |
      seq = 1 + count(SampleLot L where L.formula_id == formula.id
                      AND L.created_at < this.created_at)     # every status counted; numbers are never reused
      lot_number = brief.brief_code + "-I" + zero_pad(formula.iteration_no, 2)
                                    + "-L" + zero_pad(seq, 3)
      formula_iteration_no = formula.iteration_no             # snapshot
    input_set: "all SampleLot rows of the same formula regardless of qc_status or disposition_status, ordered by created_at ASC"
    constants: {}
    precision: "iteration zero-padded to 2 digits, sequence zero-padded to 3 digits"
    variants: []

  - name: sample_mass_ledger
    trigger: "recomputed on POST /retention-samples, POST /retention-samples/{retention_id}/withdraw, POST /application-tests, POST /shipments, POST /shipments/{shipment_id}/cancel and on the brief CLOSED_LOST shipment-cancellation cascade"
    algorithm: aggregation
    formula: |
      allocated_g(L) = sum(rs.quantity_g for RetentionSample rs
                             where rs.sample_lot_id == L.id AND rs.status == STORED)
                     + sum(t.consumed_g   for ApplicationTest t
                             where t.sample_lot_id == L.id
                               AND t.status IN {SCHEDULED, IN_PROGRESS, PASSED, FAILED})
                     + sum(s.shipped_g    for SampleShipment s
                             where s.sample_lot_id == L.id
                               AND s.status IN {DRAFT, PACKET_ASSEMBLED, BLOCKED, DISPATCHED})
      available_g(L) = L.batch_size_g - allocated_g(L)
      # CONSERVED QUANTITY (gram mass of a lot):
      #   L.batch_size_g == L.available_g + L.allocated_g   holds after every request.
      # WITHDRAWN retention rows and CANCELLED shipments leave the allocation
      # filter, so a store-then-withdraw pair and a ship-then-cancel pair each
      # return available_g to exactly its pre-action value.
    input_set: "RetentionSample rows with status STORED, ApplicationTest rows in any status (a test consumes its aliquot the moment it is scheduled), SampleShipment rows in status DRAFT, PACKET_ASSEMBLED, BLOCKED or DISPATCHED; WITHDRAWN retention rows and CANCELLED shipments are excluded"
    constants: {}
    precision: "integer grams; no rounding"
    variants: []

  - name: retention_slot_occupancy
    trigger: "evaluated on POST /retention-samples (admission control) and whenever RetentionCabinet.slots_available or RetentionSample.slot_count is read"
    algorithm: interval_merge
    formula: |
      slot_count(rs) = ceil(rs.quantity_g / RETENTION_SLOT_CAPACITY_G)
      # HALF-OPEN interval semantics [stored_from, stored_until):
      overlaps(a, b) = a.stored_from < b.stored_until AND b.stored_from < a.stored_until
      # Two aliquots that merely touch (a.stored_until == b.stored_from) do NOT overlap.
      occupied_slots(cabinet, candidate) =
          sum(rs.slot_count for RetentionSample rs
                where rs.cabinet_id == cabinet.id
                  AND rs.status == STORED
                  AND overlaps(rs, candidate))
      # AGGREGATE capacity admission (not exclusive occupancy):
      admit(candidate) = occupied_slots(cabinet, candidate) + slot_count(candidate)
                         <= cabinet.capacity_slots            # boundary: equality admits
      cabinet.slots_available = cabinet.capacity_slots
                             - sum(rs.slot_count for rs where rs.cabinet_id == cabinet.id
                                     AND rs.status == STORED
                                     AND rs.stored_from <= logical_clock_now < rs.stored_until)
      # CONSERVED QUANTITY (cabinet slots): for a fixed clock position,
      #   cabinet.capacity_slots == cabinet.slots_available + sum(slot_count of STORED rows covering now)
      # so a store-then-withdraw pair restores slots_available exactly.
    input_set: "RetentionSample rows of the same cabinet with status STORED only; WITHDRAWN rows never occupy slots"
    constants:
      RETENTION_SLOT_CAPACITY_G: 50
      RETENTION_MIN_PERIOD_DAYS: 90
    precision: "integer slots; ceil on the grams-to-slots conversion"
    variants: []

  - name: rig_occupation_conflict
    trigger: "evaluated on POST /application-tests (admission control)"
    algorithm: interval_merge
    formula: |
      # CLOSED interval semantics [window_start, window_end] inflated by the rig's
      # cleanout buffer on BOTH sides, with EXCLUSIVE occupancy (capacity 1):
      buffer = rig.cleanout_buffer_minutes
      conflicts(candidate, t) =
             candidate.window_start <= t.window_end   + buffer
         AND t.window_start - buffer <= candidate.window_end
      reject candidate if any ApplicationTest t exists with
             t.rig_id == candidate.rig_id
         AND t.status IN {SCHEDULED, IN_PROGRESS}
         AND conflicts(candidate, t)
      # Boundary: a candidate starting exactly buffer minutes after an incumbent's
      # window_end is admitted (the inequality above is not satisfied only when the
      # gap is strictly greater than the buffer... pinned concretely:
      #   gap = candidate.window_start - t.window_end
      #   admitted  <=> gap > buffer   (gap == buffer is REJECTED, gap == buffer + 1 minute is admitted)
      # Tests in status PASSED or FAILED have released the rig and are ignored.
    input_set: "ApplicationTest rows on the same rig with status SCHEDULED or IN_PROGRESS; PASSED and FAILED rows are excluded"
    constants: {}
    precision: "whole minutes; datetimes compared at second resolution"
    variants: []

  - name: application_panel_score
    trigger: "the ApplicationTest IN_PROGRESS -> PASSED / IN_PROGRESS -> FAILED transitions (POST /application-tests/{test_id}/result)"
    algorithm: weighted_scoring
    formula: |
      panel_score = round_half_up(  AROMA_WEIGHT     * aroma_score
                                  + TASTE_WEIGHT     * taste_score
                                  + STABILITY_WEIGHT * stability_score, 2)
      verdict = PASSED if panel_score >= PANEL_PASS_THRESHOLD else FAILED
      # Boundary: panel_score == 70.00 PASSES.
    input_set: "the three panel scores supplied in the request body; no other rows participate"
    constants:
      AROMA_WEIGHT: 0.40
      TASTE_WEIGHT: 0.35
      STABILITY_WEIGHT: 0.25
      PANEL_PASS_THRESHOLD: 70.00
    precision: "2 decimal places, round_half_up, applied once to the weighted sum"
    variants: []

  - name: production_cost
    trigger: "the ScaleUpBatch REQUESTED -> TOLERANCE_SET and REJECTED -> TOLERANCE_SET transitions (POST /scale-up-batches/{batch_id}/tolerance)"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The fee tier is keyed on a subtotal that the
      # fee itself later enters, so the order below is the definition of the
      # value; re-selecting the tier after adding the fee is WRONG.
      # step 1
      material_cost_cents = round_half_up(formula.bench_cost_per_kg_cents * target_kg, 0)
      # step 2 - tier selected from the PRE-FEE material cost, once, and never revisited
      if   material_cost_cents <  FEE_TIER_1_CEILING_CENTS: compounding_fee_pct = FEE_TIER_1_PCT
      elif material_cost_cents <  FEE_TIER_2_CEILING_CENTS: compounding_fee_pct = FEE_TIER_2_PCT
      else:                                                 compounding_fee_pct = FEE_TIER_3_PCT
      # step 3
      compounding_fee_cents = round_half_up(material_cost_cents * compounding_fee_pct / 100, 0)
      # step 4
      batch_total_cents = material_cost_cents + compounding_fee_cents + QA_RELEASE_FEE_CENTS
      # step 5
      production_cost_per_kg_cents = round_half_up(batch_total_cents / target_kg, 0)
      # Worked trap: material 446550 (< 500000) selects 12.0 -> fee 53586 ->
      # total 525136 which is >= 500000. The tier stays 12.0.
    input_set: "the pinned formula's bench_cost_per_kg_cents (formula must be APPROVED and pinned_formula_version must still match) and the batch's own target_kg"
    constants:
      FEE_TIER_1_CEILING_CENTS: 500000
      FEE_TIER_2_CEILING_CENTS: 2000000
      FEE_TIER_1_PCT: 12.0
      FEE_TIER_2_PCT: 8.0
      FEE_TIER_3_PCT: 5.5
      QA_RELEASE_FEE_CENTS: 25000
    precision: "integer cents; round_half_up at steps 1, 3 and 5"
    variants: []

  - name: component_tolerance_band
    trigger: "the ScaleUpBatch REQUESTED -> TOLERANCE_SET and REJECTED -> TOLERANCE_SET transitions (POST /scale-up-batches/{batch_id}/tolerance)"
    algorithm: constraint_propagation
    formula: |
      for line in components(formula) ordered by sequence_no ASC:
          base_pct = max(MIN_BAND_PCT, line.weight_pct * RELATIVE_BAND_FRACTION)
          if line.component_type == SUB_FORMULA:                potency_factor = SUB_FORMULA_POTENCY_FACTOR
          elif line.raw_material.potency_class == HIGH_IMPACT:  potency_factor = HIGH_IMPACT_POTENCY_FACTOR
          else:                                                potency_factor = 1.0
          if   target_kg <  100: scale_factor = 1.0
          elif target_kg < 1000: scale_factor = SCALE_FACTOR_MID
          else:                  scale_factor = SCALE_FACTOR_LARGE
          geometric_band = min(MAX_BAND_PCT, base_pct * potency_factor * scale_factor)
          if line.component_type == RAW_MATERIAL:
              headroom_band = max(0.0000, line.raw_material.max_use_ppm / 10000 - line.weight_pct)
          else:
              headroom_band = MAX_BAND_PCT
          band_pct = round_half_up(min(geometric_band, headroom_band), 4)
          emit { component_id: line.id, weight_pct: line.weight_pct, band_pct: band_pct }
      # Four interacting inputs (weight_pct, potency_class, target_kg, max_use_ppm)
      # with two nested max() and two nested min() clamps.
    input_set: "every FormulaComponent row of the pinned formula in ascending sequence_no order; the RawMaterial referenced by RAW_MATERIAL lines supplies potency_class and max_use_ppm"
    constants:
      MIN_BAND_PCT: 0.0050
      MAX_BAND_PCT: 1.0000
      RELATIVE_BAND_FRACTION: 0.02
      HIGH_IMPACT_POTENCY_FACTOR: 0.5
      SUB_FORMULA_POTENCY_FACTOR: 0.75
      SCALE_FACTOR_MID: 0.8
      SCALE_FACTOR_LARGE: 0.6
    precision: "4 decimal places, round_half_up, applied once per component after both clamps"
    variants: []

  - name: forecast_value
    trigger: "POST /commercialization-forecasts, and recomputed by the Formula SUBMITTED -> APPROVED, SUBMITTED -> REWORK_REQUIRED and APPROVED -> REWORK_REQUIRED transitions, the ApplicationTest IN_PROGRESS -> PASSED transition and the CustomerBrief ACCEPTED -> CLOSED_WON transition"
    algorithm: weighted_scoring
    formula: |
      base_cents = annual_volume_kg * unit_price_cents_per_kg
      #
      # RISK_WEIGHTED variant - applied while brief.status IN {SUBMITTED,
      # CLARIFICATION_REQUESTED, ACCEPTED}:
      stage_probability = STAGE_PROB_ACCEPTED    if brief.status == ACCEPTED
                          else STAGE_PROB_SUBMITTED if brief.status == SUBMITTED
                          else STAGE_PROB_CLARIFICATION
      approved_exists = exists Formula f with f.brief_id == brief.id AND f.status == APPROVED
      passed_test_exists = exists ApplicationTest t with t.status == PASSED
                             AND t.sample_lot.formula.brief_id == brief.id
      technical_factor = TECH_FACTOR_PROVEN     if (approved_exists AND passed_test_exists)
                         else TECH_FACTOR_APPROVED if approved_exists
                         else TECH_FACTOR_EARLY
      weighted_annual_value_cents =
          round_half_up(base_cents * stage_probability * technical_factor, 0)
      variant_applied = RISK_WEIGHTED
      #
      # COMMITTED variant - applied when brief.status == CLOSED_WON:
      stage_probability = 1.00
      technical_factor  = 1.00
      weighted_annual_value_cents = base_cents      # no rounding needed, both factors are 1
      variant_applied = COMMITTED
    input_set: "the forecast's own annual_volume_kg and unit_price_cents_per_kg, the owning brief's status, all Formula rows of that brief filtered to status == APPROVED, and all ApplicationTest rows reachable through those formulas' lots filtered to status == PASSED"
    constants:
      STAGE_PROB_CLARIFICATION: 0.10
      STAGE_PROB_SUBMITTED: 0.20
      STAGE_PROB_ACCEPTED: 0.45
      TECH_FACTOR_EARLY: 0.55
      TECH_FACTOR_APPROVED: 0.80
      TECH_FACTOR_PROVEN: 1.00
    precision: "integer cents, round_half_up once on the product"
    variants:
      - name: RISK_WEIGHTED
        when: "the owning brief is still open (status IN {SUBMITTED, CLARIFICATION_REQUESTED, ACCEPTED})"
        difference: "multiplies the gross annual value by both a stage probability and a technical de-risking factor"
      - name: COMMITTED
        when: "the owning brief reached CLOSED_WON"
        difference: "drops both factors to 1.00, so the identical annual_volume_kg and unit_price_cents_per_kg produce the full gross value instead of the risk-weighted value"

  - name: regulatory_packet
    trigger: "the SampleShipment DRAFT -> PACKET_ASSEMBLED and BLOCKED -> PACKET_ASSEMBLED transitions (POST /shipments/{shipment_id}/assemble-packet)"
    algorithm: projection
    formula: |
      brief = shipment.brief; formula = shipment.sample_lot.formula
      required_document_types = [SDS, ALLERGEN_STATEMENT]
      if brief.natural_claim_required: append NATURAL_DECLARATION
      if brief.kosher_required:        append KOSHER_CERT
      if brief.halal_required:         append HALAL_CERT
      if shipment.destination_country != "US": append EXPORT_DECLARATION
      if formula.confidentiality_tier IN {TIER_2_RESTRICTED, TIER_3_BLACK_BOX}: append IP_NDA_ADDENDUM
      # emitted in the order above, which is also the RegulatoryDocument.doc_type enum order
      #
      certificate_backed = { ALLERGEN_STATEMENT: ALLERGEN_FREE_STATEMENT,
                             NATURAL_DECLARATION: NATURAL,
                             KOSHER_CERT: KOSHER,
                             HALAL_CERT: HALAL }
      # PIN SELECTOR - for each certificate-backed doc type, over the candidate set
      #   { r : r.raw_material_id IN leaves(formula)
      #         AND r.claim_type == certificate_backed[doc_type]
      #         AND r.status == VERIFIED
      #         AND r.valid_until >= logical_clock_now }
      #   ranking: valid_until ASC   (the certificate that expires first binds the packet)
      #   tie-break: created_at ASC
      #   empty candidate set: reject the whole assembly with ERR_DOC_PACKET_INCOMPLETE
      # SDS, EXPORT_DECLARATION and IP_NDA_ADDENDUM are not certificate-backed:
      # substantiation_id, pinned_substantiation_version and pinned_valid_until stay null.
      pinned_substantiation_version = selected_record.version
      pinned_valid_until            = selected_record.valid_until
      packet_valid_until = min(pinned_valid_until over certificate-backed documents)
    input_set: "SubstantiationRecord rows whose raw_material_id is a transitive leaf of the shipped lot's formula, filtered to status == VERIFIED and valid_until >= the logical clock; one record is pinned per certificate-backed document type"
    constants: {}
    precision: "no arithmetic; packet_valid_until is an ISO 8601 UTC instant with three fractional digits"
    variants: []

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ============================================================================
# Ladder shape: auth (10-20) -> IP/confidentiality gating (24-28) -> schema
# (30-32) -> existence (34-36) -> polymorphic shape (38) -> own state (40) ->
# cross-entity state (42) -> OCC / version pinning (45-48) -> segregation of
# duties (50) -> safety & regulatory (54-58) -> graph/capacity constraints
# (60-64) -> temporal (65-68) -> referential coherence (70-75) -> fiscal (80-82).
# Regulatory safety deliberately outranks referential coherence, and the
# entity's own state outranks every business check, so an already-APPROVED
# formula reports a state error rather than a cost-cap error.

validations:
  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "the caller's X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 24
    category: business_safety
    check: "reading a formula's composition when formula.confidentiality_tier IN {TIER_2_RESTRICTED, TIER_3_BLACK_BOX} requires a grant_id query value naming a DisclosureGrant whose formula_id == this formula and whose disclosed_tier is at or above formula.confidentiality_tier in the order TIER_1_STANDARD < TIER_2_RESTRICTED < TIER_3_BLACK_BOX; TIER_1_STANDARD formulas need no grant"
    error_id: ERR_IP_TIER_FORBIDDEN
    http_status: 403
    applies_to: "GET /formulas/{formula_id}/composition"

  - priority: 26
    category: business_safety
    check: "the supplied DisclosureGrant has computed status == ACTIVE, i.e. the logical clock is strictly before expires_at (clock == expires_at is already EXPIRED)"
    error_id: ERR_DISCLOSURE_GRANT_EXPIRED
    http_status: 403
    applies_to: "GET /formulas/{formula_id}/composition"

  - priority: 28
    category: business_safety
    check: "disclose_full == true is only honoured when the supplied grant's redaction_level == FULL; a REDACTED grant may not un-redact material identities"
    error_id: ERR_REDACTION_LEVEL_INSUFFICIENT
    http_status: 403
    applies_to: "GET /formulas/{formula_id}/composition"

  - priority: 30
    category: schema
    check: "request body and query parameters parse; every required input field is present; every value satisfies the type, enum, range, array-subset and decimal-place constraints declared in §1.1 (dosage_pct and weight_pct carry at most 4 decimals, panel scores at most 2, limit in 1..100, offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 32
    category: schema
    check: "brief_code, material_code, cabinet_code and rig_code are globally unique, compared case-sensitively"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /customer-briefs, POST /raw-materials, POST /retention-cabinets, POST /application-rigs"

  - priority: 34
    category: existence
    check: "every id in the URL path exists, validated left to right"
    error_id: "ERR_BRIEF_NOT_FOUND | ERR_MATERIAL_NOT_FOUND | ERR_SUBSTANTIATION_NOT_FOUND | ERR_FORMULA_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_CABINET_NOT_FOUND | ERR_RETENTION_NOT_FOUND | ERR_RIG_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_FORECAST_NOT_FOUND | ERR_GRANT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 36
    category: existence
    check: "every id supplied in the request body or query string exists (brief_id, raw_material_id, sub_formula_id, formula_id, sample_lot_id, cabinet_id, rig_id, grant_id, substantiation_id, shipment_id)"
    error_id: "ERR_BRIEF_NOT_FOUND | ERR_MATERIAL_NOT_FOUND | ERR_FORMULA_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_CABINET_NOT_FOUND | ERR_RIG_NOT_FOUND | ERR_GRANT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /substantiation-records, POST /formulas, POST /formulas/{formula_id}/components, POST /sample-lots, POST /retention-samples, POST /application-tests, POST /shipments, POST /scale-up-batches, POST /commercialization-forecasts, POST /disclosure-grants, GET /formulas/{formula_id}/composition"

  - priority: 38
    category: business_referential
    check: "polymorphic component shape: component_type == RAW_MATERIAL requires raw_material_id present and sub_formula_id absent; component_type == SUB_FORMULA requires sub_formula_id present and raw_material_id absent"
    error_id: ERR_COMPONENT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /formulas/{formula_id}/components"

  - priority: 40
    category: state
    check: "the target resource's own state field is in the transition's from-set, per §1.2"
    error_id: "ERR_BRIEF_STATE_INVALID | ERR_SUBSTANTIATION_STATE_INVALID | ERR_FORMULA_STATE_INVALID | ERR_FORMULA_NOT_REVISABLE | ERR_LOT_STATE_INVALID | ERR_RETENTION_STATE_INVALID | ERR_TEST_STATE_INVALID | ERR_SHIPMENT_STATE_INVALID | ERR_BATCH_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 42
    category: state
    check: "cross-entity state guards: brief.status == ACCEPTED for formula submit/decision; formula.status == APPROVED for POST /sample-lots, lot release and batch tolerance; every SUB_FORMULA component's formula is COSTED or APPROVED at costing time; lot.qc_status == PASSED for release and test start; lot.disposition_status == RELEASED for test start, retention storage, shipment creation; at least one APPROVED formula for close WON"
    error_id: "ERR_BRIEF_NOT_ACCEPTED | ERR_FORMULA_NOT_APPROVED | ERR_SUB_FORMULA_NOT_COSTED | ERR_LOT_NOT_QC_PASSED | ERR_LOT_NOT_RELEASED"
    http_status: 409
    applies_to: "POST /formulas/{formula_id}/cost, POST /formulas/{formula_id}/submit, POST /formulas/{formula_id}/decision, POST /sample-lots, POST /sample-lots/{lot_id}/release, POST /retention-samples, POST /application-tests, POST /application-tests/{test_id}/start, POST /shipments, POST /scale-up-batches, POST /scale-up-batches/{batch_id}/tolerance, POST /customer-briefs/{brief_id}/close"

  - priority: 45
    category: concurrency
    check: "the OCC field equals the parent's current version, per §1.2.1 (expected_formula_version vs Formula.version; expected_brief_version vs CustomerBrief.version)"
    error_id: "ERR_STALE_FORMULA_VERSION | ERR_STALE_BRIEF_VERSION"
    http_status: 412
    applies_to: "POST /formulas/{formula_id}/revisions, POST /commercialization-forecasts"

  - priority: 48
    category: concurrency
    check: "the ScaleUpBatch's pinned_formula_version still equals the formula's current version; any reprice, approval or rework that bumped Formula.version after the batch was created invalidates the pin"
    error_id: ERR_PINNED_FORMULA_STALE
    http_status: 409
    applies_to: "POST /scale-up-batches/{batch_id}/tolerance"

  - priority: 50
    category: business_safety
    check: "segregation of duties on X-User-ID: the approver of a formula may not be its submitted_by_user_id, and the QC recorder of a lot may not be its compounded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /formulas/{formula_id}/decision, POST /sample-lots/{lot_id}/qc"

  - priority: 54
    category: business_safety
    check: "the formula's transitive allergen_codes and the brief's allergen_exclusions have an empty intersection"
    error_id: ERR_ALLERGEN_EXCLUSION_BREACH
    http_status: 422
    applies_to: "POST /formulas/{formula_id}/submit"

  - priority: 56
    category: business_safety
    check: "for every claim the brief requires (natural_claim_required -> natural_claim_eligible, kosher_required -> kosher_eligible, halal_required -> halal_eligible) the formula's eligibility flag is true"
    error_id: ERR_CLAIM_UNSUBSTANTIATED
    http_status: 422
    applies_to: "POST /formulas/{formula_id}/submit"

  - priority: 57
    category: business_safety
    check: "a RAW_MATERIAL component's weight_pct does not exceed its material's safety ceiling max_use_ppm / 10000 percent (equality is allowed)"
    error_id: ERR_MAX_USE_EXCEEDED
    http_status: 422
    applies_to: "POST /formulas/{formula_id}/components"

  - priority: 58
    category: business_safety
    check: "every certificate-backed RegulatoryDocument of the packet points at a SubstantiationRecord whose status is VERIFIED"
    error_id: ERR_SUBSTANTIATION_REVOKED
    http_status: 422
    applies_to: "POST /shipments/{shipment_id}/dispatch"

  - priority: 60
    category: business_constraint
    check: "adding a SUB_FORMULA component must not create a cycle in the component DAG: the referenced sub-formula must not be the parent formula itself and must not transitively contain the parent formula"
    error_id: ERR_FORMULA_CYCLE
    http_status: 422
    applies_to: "POST /formulas/{formula_id}/components"

  - priority: 61
    category: business_constraint
    check: "the formula has at least one FormulaComponent row (component_count >= 1); an empty formula cannot be costed"
    error_id: ERR_FORMULA_NO_COMPONENTS
    http_status: 422
    applies_to: "POST /formulas/{formula_id}/cost"

  - priority: 62
    category: business_constraint
    check: "at costing time total_weight_pct == 100.0000 exactly; when adding a component the resulting total_weight_pct must not exceed 100.0000 (equality is allowed)"
    error_id: ERR_WEIGHT_SUM_INVALID
    http_status: 422
    applies_to: "POST /formulas/{formula_id}/cost, POST /formulas/{formula_id}/components"

  - priority: 64
    category: business_constraint
    check: "aggregate cabinet capacity: occupied_slots(cabinet, candidate) + slot_count(candidate) <= cabinet.capacity_slots over the candidate's half-open storage interval, per calculations.retention_slot_occupancy (equality is admitted)"
    error_id: ERR_CABINET_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /retention-samples"

  - priority: 65
    category: business_temporal
    check: "interval well-formedness: RetentionSample.stored_from < stored_until; ApplicationTest.window_start <= window_end; DisclosureGrant.expires_at > the logical clock at creation"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /retention-samples, POST /application-tests, POST /disclosure-grants"

  - priority: 66
    category: business_temporal
    check: "the retention interval spans at least RETENTION_MIN_PERIOD_DAYS (90) days: stored_until - stored_from >= 90 days (equality is admitted)"
    error_id: ERR_RETENTION_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /retention-samples"

  - priority: 67
    category: business_temporal
    check: "exclusive rig occupation with a symmetric cleanout buffer, per calculations.rig_occupation_conflict: the candidate window must be separated from every SCHEDULED or IN_PROGRESS test on the same rig by strictly more than cleanout_buffer_minutes"
    error_id: ERR_RIG_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /application-tests"

  - priority: 68
    category: business_temporal
    check: "packet_valid_until >= the logical clock at dispatch (equality still dispatches)"
    error_id: ERR_PACKET_EXPIRED
    http_status: 422
    applies_to: "POST /shipments/{shipment_id}/dispatch"

  - priority: 70
    category: business_referential
    check: "the rig's matrix_type equals the brief's matrix_type, resolved through sample_lot -> formula -> brief"
    error_id: ERR_RIG_MATRIX_MISMATCH
    http_status: 422
    applies_to: "POST /application-tests"

  - priority: 71
    category: business_referential
    check: "the test's dosage_pct equals the brief's dosage_pct exactly"
    error_id: ERR_DOSAGE_MISMATCH
    http_status: 422
    applies_to: "POST /application-tests"

  - priority: 72
    category: business_referential
    check: "every certificate-backed document type in calculations.regulatory_packet.required_document_types has at least one candidate SubstantiationRecord (VERIFIED and valid_until >= the logical clock) on every transitive leaf material"
    error_id: ERR_DOC_PACKET_INCOMPLETE
    http_status: 422
    applies_to: "POST /shipments/{shipment_id}/assemble-packet"

  - priority: 73
    category: business_referential
    check: "every RegulatoryDocument of the packet has status == PINNED and pinned_substantiation_version == its SubstantiationRecord's current version"
    error_id: ERR_PINNED_DOC_STALE
    http_status: 422
    applies_to: "POST /shipments/{shipment_id}/dispatch"

  - priority: 74
    category: business_referential
    check: "a DisclosureGrant's formula_id must name a Formula whose brief_id equals the grant's brief_id"
    error_id: ERR_GRANT_FORMULA_MISMATCH
    http_status: 422
    applies_to: "POST /disclosure-grants"

  - priority: 75
    category: business_referential
    check: "a Formula's parent_formula_id, when supplied, must name a Formula belonging to the same brief_id"
    error_id: ERR_PARENT_FORMULA_MISMATCH
    http_status: 422
    applies_to: "POST /formulas"

  - priority: 80
    category: business_fiscal
    check: "the lot has enough unallocated mass: requested grams <= sample_lot.available_g, per calculations.sample_mass_ledger (equality is admitted and drives the lot to CONSUMED)"
    error_id: ERR_INSUFFICIENT_SAMPLE_MASS
    http_status: 422
    applies_to: "POST /retention-samples, POST /application-tests, POST /shipments"

  - priority: 82
    category: business_fiscal
    check: "the BENCH_PROVISIONAL variant satisfies bench_cost_in_use_cents_per_tonne <= brief.cost_in_use_cap_cents_per_tonne (equality passes); the PRODUCTION_FIRM variant is never the gate"
    error_id: ERR_COST_IN_USE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /formulas/{formula_id}/submit"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
# api_prefix is "/", so every path below is the full path. Read endpoints are
# open to all six roles; write endpoints follow the §1.7 peer/SoD split.

endpoints:
  # ---------------- CustomerBrief ----------------
  - method: POST
    path: "/customer-briefs"
    description: "Intake a customer brief in DRAFT with its target profile, cost-in-use cap and label constraints"
    roles: [AccountManager]
    code: 201
    input: ["brief_code", "customer_name", "matrix_type", "target_profile", "dosage_pct", "annual_volume_kg", "cost_in_use_cap_cents_per_tonne", "confidentiality_tier", "natural_claim_required?", "kosher_required?", "halal_required?", "allergen_exclusions?"]
    output: CustomerBrief
    side_effects: ["creates the brief with status DRAFT, clarification_round_count 0 and version 1"]

  - method: GET
    path: "/customer-briefs"
    description: "List customer briefs, optionally filtered by status or customer"
    roles: [AccountManager, TechnicalDirector, Flavorist, RegulatoryAffairs, LabTech, PurchasingManager]
    code: 200
    input: ["status?", "customer_name?", "outcome?", "limit?", "offset?"]
    output: CustomerBrief[]
    side_effects: []

  - method: GET
    path: "/customer-briefs/{brief_id}"
    description: "Read one customer brief"
    roles: [AccountManager, TechnicalDirector, Flavorist, RegulatoryAffairs, LabTech, PurchasingManager]
    code: 200
    input: []
    output: CustomerBrief
    side_effects: []

  - method: POST
    path: "/customer-briefs/{brief_id}/submit"
    description: "Submit a DRAFT brief, or re-submit after answering a clarification request"
    roles: [AccountManager]
    code: 200
    input: []
    output: CustomerBrief
    side_effects: ["DRAFT -> SUBMITTED or CLARIFICATION_REQUESTED -> SUBMITTED", "increments CustomerBrief.version"]

  - method: POST
    path: "/customer-briefs/{brief_id}/clarification-request"
    description: "Ask the customer for clarification; the fourth request instead rejects the brief for clarification exhaustion"
    roles: [TechnicalDirector]
    code: 200
    input: [clarification_note]
    output: CustomerBrief
    side_effects:
      - "SUBMITTED -> CLARIFICATION_REQUESTED with clarification_round_count incremented, while clarification_round_count <= 2"
      - "SUBMITTED -> REJECTED with decision_note CLARIFICATION_EXHAUSTED when clarification_round_count == 3"
      - "on rejection: cascades Formula rows to ARCHIVED and CommercializationForecast rows to LAPSED"
      - "increments CustomerBrief.version"

  - method: POST
    path: "/customer-briefs/{brief_id}/decision"
    description: "Accept or reject a submitted brief"
    roles: [TechnicalDirector]
    code: 200
    input: ["decision", "decision_note?"]
    output: CustomerBrief
    side_effects: ["SUBMITTED -> ACCEPTED or SUBMITTED -> REJECTED", "on rejection: Formula rows -> ARCHIVED, CommercializationForecast rows -> LAPSED", "increments CustomerBrief.version"]

  - method: POST
    path: "/customer-briefs/{brief_id}/close"
    description: "Close an accepted brief as won or lost and record the win/loss driver"
    roles: [AccountManager]
    code: 200
    input: ["outcome", "loss_reason?"]
    output: CustomerBrief
    side_effects:
      - "ACCEPTED -> CLOSED_WON (requires an APPROVED formula) or ACCEPTED -> CLOSED_LOST"
      - "on WON: CommercializationForecast rows -> REALIZED with weighted_annual_value_cents recomputed under the COMMITTED variant of calculations.forecast_value"
      - "on LOST: CommercializationForecast rows -> LAPSED and every live SampleShipment of the brief -> CANCELLED, returning shipped_g through calculations.sample_mass_ledger"
      - "either outcome: Formula rows in DRAFT, COSTED, SUBMITTED or REWORK_REQUIRED -> ARCHIVED"
      - "increments CustomerBrief.version"

