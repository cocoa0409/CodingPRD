# =============================================================================
# Scaffold: Gutter Installation & Leaf-Guard sales/install/warranty platform
# Task 0548 — SCAFFOLD.yaml (§1.0–§1.7)
# =============================================================================

scenario: |
  548. Gutter Installation & Leaf-Guard (LeafFilter style): in-home measure &
  linear-foot quote, gutter/guard product & color, financing & discount, install
  crew & weather, downspout/drainage add-on, lifetime clog-free warranty & claim,
  referral, callback

domain_name: gutter-leaf-guard
api_prefix: /api

complexity_profile:
  primary_archetype: Pricing engine
  secondary_archetype: Temporal windowing
  complexity_layers:
    - Dual-variant calculation
    - Cascading side effects
    - Optimistic concurrency
    - Rate / threshold triggers
  entity_topology: flat            # peer collections under /api, linked by FK fields in bodies
  state_machine_shape: cyclic      # Quote revision loop + Job weather-hold loop; several branching machines
  relationship_patterns:
    - one_to_many
    - self_referential             # Referral references Lead twice (referrer + referee)
  role_model: peer_roles           # SalesRep / Scheduler / WarrantyAgent own disjoint surfaces; Admin overrides
  consistency_model: immediate
  difficulty_level: expert         # 10 entities, ~36 endpoints, deeply coupled

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Configuration / catalog ----
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product name (e.g., MicroMesh LeafGuard)" }
      - { name: category, type: enum, source: input, description: "GUTTER | LEAF_GUARD | DOWNSPOUT", constraints: "one of GUTTER, LEAF_GUARD, DOWNSPOUT" }
      - { name: base_rate_cents_per_foot, type: integer, source: input, description: "Base install price per linear foot in cents (integer)" }
      - { name: available_colors, type: array, source: input, description: "Allowed color enum values, e.g. [WHITE, BRONZE, BLACK, COPPER]" }
      - { name: premium_colors, type: array, source: input, description: "Subset of available_colors that carry the color surcharge, e.g. [COPPER]" }
      - { name: color_surcharge_cents_per_foot, type: integer, source: input, description: "Per-foot surcharge in cents applied when chosen color is in premium_colors", default: 0 }
      - { name: is_active, type: boolean, source: input, description: "Whether product may be quoted", default: true }

  - name: SalesRep
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Sales representative name" }
      - { name: region, type: string, source: input, description: "Service region code, e.g. NE, SE" }
      - { name: is_active, type: boolean, source: input, description: "Whether rep may take appointments", default: true }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Install crew name/label" }
      - { name: region, type: string, source: input, description: "Service region code" }
      - { name: is_certified_leaf_guard, type: boolean, source: input, description: "Whether crew is certified to install LEAF_GUARD-category jobs", default: false }
      - { name: booked_days, type: integer, source: computed, description: "Sum of install_days over Jobs assigned to this crew whose status IN {SCHEDULED, IN_PROGRESS}; recomputed on every job schedule/hold/complete/cancel" }

  # ---- Sales funnel resources ----
  - name: Lead
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Homeowner name" }
      - { name: address, type: string, source: input, description: "Property street address" }
      - { name: phone, type: string, source: input, description: "Homeowner phone / callback number" }
      - { name: region, type: string, source: input, description: "Service region code" }
      - { name: sales_rep_id, type: string, source: input, description: "FK -> SalesRep.id; rep who owns this lead" }
      - { name: status, type: enum, source: system, description: "NEW | CONTACTED | APPOINTMENT_SET | QUOTED | WON | LOST", default: "NEW" }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of this lead's Appointments in status NO_SHOW; recomputed on each NO_SHOW transition" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "As a referrer: SUM(Referral.payout_cents) over Referrals with referrer_lead_id == this lead AND status IN {PAYABLE, PAID}" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id; lead being measured" }
      - { name: sales_rep_id, type: string, source: input, description: "FK -> SalesRep.id; rep performing the in-home measure" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC measure window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC measure window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | CANCELED | NO_SHOW", default: "SCHEDULED" }
      - { name: measured_linear_feet, type: number, source: input, description: "Measured gutter run in linear feet, supplied on the COMPLETED transition (must be > 0)" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id; homeowner being quoted" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; measure appointment backing this quote" }
      - { name: sales_rep_id, type: string, source: input, description: "FK -> SalesRep.id; rep who authored the quote" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; gutter/guard product being quoted" }
      - { name: color, type: enum, source: input, description: "Chosen color; must be in Product.available_colors" }
      - { name: estimated_linear_feet, type: number, source: input, description: "Rep's rough estimate in linear feet used for the provisional total at DRAFT (must be > 0)" }
      - { name: downspout_count, type: integer, source: input, description: "Downspout/drainage add-on units", default: 0 }
      - { name: discount_pct, type: number, source: input, description: "Requested discount fraction in [0, 1]; capped by the subtotal tier", default: 0 }
      - { name: linear_feet, type: number, source: computed, description: "Effective feet driving the current total: == estimated_linear_feet while DRAFT/REVISION_REQUESTED, == measured_linear_feet once PRESENTED" }
      - { name: measured_linear_feet, type: number, source: computed, description: "Copied from Appointment.measured_linear_feet on the present action" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Pre-discount total in cents (see quote_pricing)" }
      - { name: discount_cents, type: integer, source: computed, description: "Applied discount in cents (see discount_resolution)" }
      - { name: total_cents, type: integer, source: computed, description: "= subtotal_cents - discount_cents" }
      - { name: presented_at, type: datetime, source: system, description: "Logical-clock timestamp stamped on the DRAFT->PRESENTED transition; null before" }
      - { name: status, type: enum, source: system, description: "DRAFT | PRESENTED | ACCEPTED | DECLINED | REVISION_REQUESTED | SUPERSEDED", default: "DRAFT" }

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; quote being financed" }
      - { name: plan_type, type: enum, source: input, description: "DEFERRED_INTEREST | AMORTIZED", constraints: "one of DEFERRED_INTEREST, AMORTIZED" }
      - { name: apr_bps, type: integer, source: input, description: "Annual percentage rate in basis points (e.g. 1200 = 12.00%); use 0 for DEFERRED_INTEREST" }
      - { name: term_months, type: integer, source: input, description: "Number of monthly installments (>= 1)" }
      - { name: promo_window_days, type: integer, source: input, description: "Deferred-interest same-as-cash promo length in days from plan creation", default: 0 }
      - { name: principal_cents, type: integer, source: computed, description: "Financed amount in cents; snapshot of Quote.total_cents at plan creation" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Per-installment payment in cents (see financing_cost)" }
      - { name: total_cost_cents, type: integer, source: computed, description: "Total cost of financing in cents (see financing_cost)" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | CANCELED", default: "OFFERED" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; accepted quote this install fulfills" }
      - { name: lead_id, type: string, source: input, description: "FK -> Lead.id; homeowner" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; assigned install crew; null until SCHEDULED", default: null }
      - { name: install_date, type: string, source: input, description: "Assigned install start date (YYYY-MM-DD); null until SCHEDULED", default: null }
      - { name: install_days, type: integer, source: computed, description: "= ceil(Quote.linear_feet / FEET_PER_CREW_DAY); crew-day span this job occupies" }
      - { name: deposit_cents, type: integer, source: computed, description: "= round_half_up(Quote.total_cents * DEPOSIT_PCT); collected at job creation" }
      - { name: status, type: enum, source: system, description: "PENDING | SCHEDULED | WEATHER_HOLD | IN_PROGRESS | COMPLETED | CANCELED", default: "PENDING" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; completed install under the lifetime clog-free warranty" }
      - { name: issue_type, type: enum, source: input, description: "CLOG | OVERFLOW | DETACHMENT", constraints: "one of CLOG, OVERFLOW, DETACHMENT" }
      - { name: estimated_remediation_cents, type: integer, source: computed, description: "Estimated remediation cost in cents, computed on the SUBMITTED->UNDER_REVIEW transition (see warranty_remediation)" }
      - { name: actual_remediation_cents, type: integer, source: input, description: "Actual remediation cost in cents, supplied on the APPROVED->RESOLVED transition" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | RESOLVED", default: "SUBMITTED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: referrer_lead_id, type: string, source: input, description: "FK -> Lead.id; existing customer who referred" }
      - { name: referee_lead_id, type: string, source: input, description: "FK -> Lead.id; newly referred homeowner" }
      - { name: payout_cents, type: integer, source: computed, description: "Referral credit in cents, computed when the referee reaches WON on quote accept (see referral_payout); 0 until PAYABLE" }
      - { name: status, type: enum, source: system, description: "PENDING | PAYABLE | PAID | CLAWED_BACK", default: "PENDING" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ------------------------------------------------------------------ Lead
  - entity: Lead
    initial_state: NEW
    terminal_states: [WON, LOST]
    transitions:
      - from: NEW
        to: CONTACTED
        trigger: "POST /api/leads/{id}/transition {to_status: CONTACTED}"
        actor: SalesRep
        preconditions: []
        side_effects: []
      - from: NEW
        to: APPOINTMENT_SET
        trigger: "system: Appointment created for this Lead (POST /api/appointments)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Applies from NEW or CONTACTED; first Appointment moves the lead to APPOINTMENT_SET"
      - from: CONTACTED
        to: APPOINTMENT_SET
        trigger: "system: Appointment created for this Lead"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPOINTMENT_SET
        to: QUOTED
        trigger: "system: Quote created for this Lead (POST /api/quotes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: WON
        trigger: "system: a Quote for this Lead transitions to ACCEPTED (cascade link 2 of accept cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "If this Lead is the referee of a Referral in status PENDING, that Referral -> PAYABLE (cascade link 3): compute payout_cents from this lead's ACCEPTED Quote.total_cents and increase the referrer Lead.credit_balance_cents by payout_cents (referrer_credit invariant, forward)"
      - from: NEW
        to: LOST
        trigger: "POST /api/leads/{id}/transition {to_status: LOST} OR system: no_show_strikes reaches NO_SHOW_LIMIT"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "All Quotes for this Lead in {DRAFT, PRESENTED, REVISION_REQUESTED} -> DECLINED"
          - "All Appointments for this Lead in {SCHEDULED, CONFIRMED} -> CANCELED (release rep windows)"
        note: "LOST is reachable from any non-terminal state (NEW, CONTACTED, APPOINTMENT_SET, QUOTED)"
      - from: CONTACTED
        to: LOST
        trigger: "POST /api/leads/{id}/transition {to_status: LOST}"
        actor: SalesRep
        preconditions: []
        side_effects: ["Same LOST cascade as NEW->LOST"]
      - from: APPOINTMENT_SET
        to: LOST
        trigger: "POST /api/leads/{id}/transition {to_status: LOST} OR system: no_show_strikes reaches NO_SHOW_LIMIT"
        actor: SalesRep
        preconditions: []
        side_effects: ["Same LOST cascade as NEW->LOST"]
      - from: QUOTED
        to: LOST
        trigger: "POST /api/leads/{id}/transition {to_status: LOST}"
        actor: SalesRep
        preconditions: []
        side_effects: ["Same LOST cascade as NEW->LOST"]

  # ------------------------------------------------------------ Appointment
  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /api/appointments/{id}/transition {to_status: CONFIRMED}"
        actor: SalesRep
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/appointments/{id}/transition {to_status: COMPLETED, measured_linear_feet}"
        actor: SalesRep
        preconditions:
          - "measured_linear_feet present AND > 0, else ERR_INVALID_MEASUREMENT (business_constraint)"
        side_effects:
          - "Persist measured_linear_feet on the Appointment"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/appointments/{id}/transition {to_status: COMPLETED, measured_linear_feet}"
        actor: SalesRep
        preconditions:
          - "measured_linear_feet present AND > 0, else ERR_INVALID_MEASUREMENT"
        side_effects: ["Persist measured_linear_feet"]
      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /api/appointments/{id}/transition {to_status: CANCELED}"
        actor: SalesRep
        preconditions: []
        side_effects: ["Release the rep window (no longer counts toward rep overlap)"]
      - from: CONFIRMED
        to: CANCELED
        trigger: "POST /api/appointments/{id}/transition {to_status: CANCELED}"
        actor: SalesRep
        preconditions: []
        side_effects: ["Release the rep window"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/appointments/{id}/transition {to_status: NO_SHOW}"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "Recompute Lead.no_show_strikes (cascade link 1)"
          - "If Lead.no_show_strikes >= NO_SHOW_LIMIT (2), Lead -> LOST (cascade link 2), which DECLINEs the lead's non-terminal Quotes and CANCELs its non-terminal Appointments (cascade link 3)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /api/appointments/{id}/transition {to_status: NO_SHOW}"
        actor: SalesRep
        preconditions: []
        side_effects: ["Same NO_SHOW cascade as SCHEDULED->NO_SHOW"]

  # ------------------------------------------------------------------ Quote
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /api/quotes/{id}/present"
        actor: SalesRep
        preconditions:
          - "The backing Appointment (appointment_id) is in status COMPLETED, else ERR_APPOINTMENT_NOT_COMPLETED (state; cross-entity Quote<-Appointment)"
        side_effects:
          - "Copy Appointment.measured_linear_feet into Quote.measured_linear_feet and set Quote.linear_feet = measured_linear_feet"
          - "Recompute subtotal_cents, discount_cents, total_cents from the measured feet (FINAL variant of quote_pricing)"
          - "Stamp presented_at = current logical clock"
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /api/quotes/{id}/transition {to_status: ACCEPTED}"
        actor: SalesRep
        preconditions:
          - "current_clock <= presented_at + QUOTE_VALIDITY_DAYS (30d), else ERR_QUOTE_EXPIRED (state)"
        side_effects:
          - "Create a Job in status PENDING for this Quote (cascade link 1): compute install_days and deposit_cents"
          - "Job creation moves the Lead QUOTED -> WON (cascade link 2)"
          - "Lead -> WON moves any PENDING Referral whose referee_lead_id == lead_id to PAYABLE (cascade link 3): compute payout_cents and credit the referrer"
      - from: PRESENTED
        to: DECLINED
        trigger: "POST /api/quotes/{id}/transition {to_status: DECLINED}"
        actor: SalesRep
        preconditions: []
        side_effects: []
      - from: PRESENTED
        to: REVISION_REQUESTED
        trigger: "POST /api/quotes/{id}/transition {to_status: REVISION_REQUESTED}"
        actor: SalesRep
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /api/quotes/{id}/transition {to_status: DRAFT}"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "Reset linear_feet = estimated_linear_feet and recompute the PROVISIONAL total; clear presented_at"
        note: "Revision loop: REVISION_REQUESTED -> DRAFT -> PRESENTED (cycle)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a newer Quote is created for the same Lead (POST /api/quotes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRESENTED
        to: SUPERSEDED
        trigger: "system: a newer Quote is created for the same Lead"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system: a newer Quote is created for the same Lead"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------- FinancingPlan
  - entity: FinancingPlan
    initial_state: OFFERED
    terminal_states: [ACCEPTED, CANCELED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/financing-plans/{id}/transition {to_status: ACCEPTED}"
        actor: SalesRep
        preconditions:
          - "The backing Quote (quote_id) is in status ACCEPTED, else ERR_QUOTE_NOT_ACCEPTED (state; cross-entity FinancingPlan<-Quote)"
        side_effects: []
      - from: OFFERED
        to: CANCELED
        trigger: "POST /api/financing-plans/{id}/transition {to_status: CANCELED}"
        actor: SalesRep
        preconditions: []
        side_effects: []

  # ------------------------------------------------------------------- Job
  - entity: Job
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /api/jobs/{id}/schedule {crew_id, install_date}"
        actor: Scheduler
        preconditions:
          - "Forecast for install_date is not SEVERE, else ERR_WEATHER_UNSAFE (business_safety, priority 5)"
          - "If the job's Product.category == LEAF_GUARD, Crew.is_certified_leaf_guard must be true, else ERR_CREW_NOT_CERTIFIED (business_referential, priority 6)"
          - "The crew-day span [install_date .. install_date + install_days - 1] (inclusive whole-day) must not overlap any other SCHEDULED/IN_PROGRESS Job on the same crew, else ERR_CREW_DOUBLE_BOOKED (business_temporal, priority 7)"
        side_effects:
          - "Assign crew_id and install_date"
          - "Crew.booked_days increases by install_days (crew-day reservation; crew_booked_days invariant)"
      - from: WEATHER_HOLD
        to: SCHEDULED
        trigger: "POST /api/jobs/{id}/schedule {crew_id, install_date}"
        actor: Scheduler
        preconditions:
          - "Same three checks as PENDING->SCHEDULED (weather, certification, crew overlap)"
        side_effects:
          - "Re-assign crew_id and install_date"
          - "Crew.booked_days increases by install_days (re-reservation)"
        note: "Weather-hold recovery closes the SCHEDULED -> WEATHER_HOLD -> SCHEDULED cycle"
      - from: SCHEDULED
        to: WEATHER_HOLD
        trigger: "POST /api/jobs/{id}/transition {to_status: WEATHER_HOLD}"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Crew.booked_days decreases by install_days (release reservation; compensating half of crew_booked_days invariant)"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/jobs/{id}/transition {to_status: IN_PROGRESS}"
        actor: Scheduler
        preconditions:
          - "current_clock date >= install_date, else ERR_INVALID_STATE"
          - "Forecast for the current date is not SEVERE, else ERR_WEATHER_UNSAFE (business_safety)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/jobs/{id}/transition {to_status: COMPLETED}"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Crew.booked_days decreases by install_days (crew released)"
      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /api/jobs/{id}/transition {to_status: CANCELED}"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Crew.booked_days decreases by install_days (compensating release; crew_booked_days invariant)"
          - "Any Referral tied to this Job's lead as referee in {PAYABLE, PAID} -> CLAWED_BACK; decrease that referrer Lead.credit_balance_cents by payout_cents (referrer_credit invariant, compensating)"
      - from: WEATHER_HOLD
        to: CANCELED
        trigger: "POST /api/jobs/{id}/transition {to_status: CANCELED}"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "No crew-day change (WEATHER_HOLD already released the reservation)"
          - "Same referral clawback as SCHEDULED->CANCELED (PAYABLE/PAID -> CLAWED_BACK, decrement referrer credit)"
      - from: IN_PROGRESS
        to: CANCELED
        trigger: "POST /api/jobs/{id}/transition {to_status: CANCELED}"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "Crew.booked_days decreases by install_days"
          - "Same referral clawback as SCHEDULED->CANCELED"

  # --------------------------------------------------------- WarrantyClaim
  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, RESOLVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/warranty-claims/{id}/transition {to_status: UNDER_REVIEW}"
        actor: WarrantyAgent
        preconditions: []
        side_effects:
          - "Compute estimated_remediation_cents (warranty_remediation)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/warranty-claims/{id}/transition {to_status: APPROVED}"
        actor: WarrantyAgent
        preconditions: []
        side_effects: []
        note: "APPROVED branch: claim proceeds toward RESOLVED with an actual remediation cost"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/warranty-claims/{id}/transition {to_status: DENIED}"
        actor: WarrantyAgent
        preconditions: []
        side_effects: []
        note: "DENIED branch: terminal, no remediation cost recorded (divergent side-effect set from APPROVED)"
      - from: APPROVED
        to: RESOLVED
        trigger: "POST /api/warranty-claims/{id}/transition {to_status: RESOLVED, actual_remediation_cents}"
        actor: WarrantyAgent
        preconditions:
          - "actual_remediation_cents present AND >= 0, else ERR_VALIDATION"
        side_effects:
          - "Persist actual_remediation_cents (reconciled against estimated_remediation_cents)"

  # -------------------------------------------------------------- Referral
  - entity: Referral
    initial_state: PENDING
    terminal_states: [CLAWED_BACK]
    transitions:
      - from: PENDING
        to: PAYABLE
        trigger: "system: referee Lead transitions QUOTED -> WON on quote accept (cascade link 3 of accept cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Compute payout_cents (referral_payout) from the referee's ACCEPTED Quote.total_cents"
          - "Increase referrer Lead.credit_balance_cents by payout_cents (referrer_credit invariant, forward)"
      - from: PAYABLE
        to: PAID
        trigger: "POST /api/referrals/{id}/transition {to_status: PAID}"
        actor: Admin
        preconditions: []
        side_effects: []
        note: "PAID still counts toward the referrer's credit_balance_cents"
      - from: PAYABLE
        to: CLAWED_BACK
        trigger: "system: referee's Job -> CANCELED"
        actor: system
        preconditions: []
        side_effects:
          - "Decrease referrer Lead.credit_balance_cents by payout_cents (referrer_credit invariant, compensating)"
      - from: PAID
        to: CLAWED_BACK
        trigger: "system: referee's Job -> CANCELED"
        actor: system
        preconditions: []
        side_effects:
          - "Decrease referrer Lead.credit_balance_cents by payout_cents (referrer_credit invariant, compensating)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC — true CREATE-with-supersede race only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-supersede-stale-lead
    parent_entity: Lead
    write_endpoint: "POST /api/quotes"
    occ_field: "expected_lead_version"
    description: |
      Creating a Quote for a Lead whose version has advanced since the client
      last observed it is rejected. A new Quote legitimately supersedes the
      Lead's prior non-terminal Quote (setting it to SUPERSEDED) and bumps the
      Lead's version; a create still carrying the pre-supersede version is
      operating on a stale view of the Lead and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_pricing
    trigger: "Quote creation (PROVISIONAL) and the DRAFT->PRESENTED present action (FINAL); also on REVISION_REQUESTED->DRAFT (back to PROVISIONAL)"
    algorithm: tiered_pricing
    formula: |
      feet        = linear_feet                       # estimated (provisional) or measured (final)
      tier_mult   = 1.00 if feet < 200
                    0.95 if 200 <= feet < 400
                    0.90 if feet >= 400
      tier_rate   = Product.base_rate_cents_per_foot * tier_mult      # exact, not rounded
      gutter_line = round_half_up(feet * tier_rate)
      color_line  = round_half_up(feet * Product.color_surcharge_cents_per_foot) if color in Product.premium_colors else 0
      downspout   = downspout_count * DOWNSPOUT_UNIT_CENTS
      subtotal_cents = gutter_line + color_line + downspout
      # discount_cents comes from discount_resolution; evaluation order is pinned there
      total_cents = subtotal_cents - discount_cents
    input_set: "Single Quote plus its Product; feet = estimated_linear_feet in PROVISIONAL, measured_linear_feet in FINAL"
    constants:
      TIER1_MAX_FEET: 200          # feet < 200 -> tier 1 (>= 200 crosses to tier 2)
      TIER2_MAX_FEET: 400
      TIER1_MULT: 1.00
      TIER2_MULT: 0.95
      TIER3_MULT: 0.90
      DOWNSPOUT_UNIT_CENTS: 12000
    precision: "cents, round_half_up; each line item rounded before summation (round-per-line then sum)"
    variants:
      - name: PROVISIONAL
        when: "Quote is DRAFT (at creation or after REVISION_REQUESTED->DRAFT)"
        difference: "feet = estimated_linear_feet"
      - name: FINAL
        when: "Quote reaches PRESENTED via the present action"
        difference: "feet = Appointment.measured_linear_feet; total differs from PROVISIONAL for identical Product/color/downspout when estimated != measured"

  - name: discount_resolution
    trigger: "Same moments as quote_pricing (create / present / revision reset)"
    algorithm: threshold
    formula: |
      # Circular-looking dependency, evaluation order PINNED to break it:
      # the discount cap tier is keyed on subtotal_cents (PRE-discount), NOT on
      # total_cents (post-discount). Naively keying the cap on total_cents is
      # circular (total depends on discount, discount depends on total's tier).
      cap = 0.10 if subtotal_cents < 500000
            0.15 if 500000 <= subtotal_cents < 1000000
            0.20 if subtotal_cents >= 1000000
      effective_pct = min(Quote.discount_pct, cap)
      discount_cents = round_half_up(subtotal_cents * effective_pct)
    input_set: "Single Quote's subtotal_cents and requested discount_pct"
    constants:
      CAP_TIER1_MAX_CENTS: 500000
      CAP_TIER2_MAX_CENTS: 1000000
      CAP_TIER1: 0.10
      CAP_TIER2: 0.15
      CAP_TIER3: 0.20
    precision: "cents, round_half_up"

  - name: financing_cost
    trigger: "FinancingPlan creation (POST /api/financing-plans)"
    algorithm: amortization
    formula: |
      principal_cents = snapshot of Quote.total_cents at plan creation
      if plan_type == DEFERRED_INTEREST:
        monthly_payment_cents = round_half_up(principal_cents / term_months)
        total_cost_cents      = principal_cents            # same-as-cash if paid within promo_window_days
      else:  # AMORTIZED
        r = (apr_bps / 10000) / 12                         # monthly rate
        exact_monthly = principal_cents * r / (1 - (1 + r) ** (-term_months))
        monthly_payment_cents = round_half_up(exact_monthly)          # ROUND per installment FIRST
        total_cost_cents      = monthly_payment_cents * term_months   # THEN multiply (pinned order)
    input_set: "Single FinancingPlan and its Quote.total_cents"
    constants:
      MIN_FINANCE_AMOUNT_CENTS: 100000
      FINANCE_MAX_CENTS: 5000000
    precision: |
      cents, round_half_up. Rounding ORDER is pinned: for AMORTIZED, round the
      monthly payment to whole cents and THEN multiply by term_months
      (round-per-installment then sum), NOT compute the exact total then round
      once. The two orders can diverge by up to (term_months) cents.
    variants:
      - name: DEFERRED_INTEREST
        when: "plan_type == DEFERRED_INTEREST"
        difference: "total_cost_cents == principal_cents (0 interest)"
      - name: AMORTIZED
        when: "plan_type == AMORTIZED"
        difference: "total_cost_cents > principal_cents by the financed interest; for identical principal it exceeds the DEFERRED_INTEREST total"

  - name: install_days
    trigger: "Job creation (on Quote accept)"
    algorithm: threshold
    formula: |
      install_days = ceil(Quote.linear_feet / FEET_PER_CREW_DAY)
    input_set: "The accepted Quote's linear_feet (measured feet)"
    constants:
      FEET_PER_CREW_DAY: 150
    precision: "integer days, ceil"

  - name: crew_booked_days
    trigger: "Any Job schedule / weather-hold / complete / cancel"
    algorithm: aggregation
    formula: |
      Crew.booked_days = SUM(Job.install_days) over Jobs where
        Job.crew_id == Crew.id AND Job.status IN {SCHEDULED, IN_PROGRESS}
    input_set: "All Jobs assigned to the crew in status SCHEDULED or IN_PROGRESS (WEATHER_HOLD, PENDING, COMPLETED, CANCELED excluded)"
    precision: "integer days"

  - name: referral_payout
    trigger: "Referral PENDING->PAYABLE (referee Lead reaches WON on quote accept)"
    algorithm: threshold
    formula: |
      referee_total = the referee Lead's ACCEPTED Quote.total_cents
      payout_cents  = min(round_half_up(referee_total * REFERRAL_PCT), REFERRAL_MAX_CENTS)
    input_set: "The single referee's ACCEPTED Quote.total_cents"
    constants:
      REFERRAL_PCT: 0.03
      REFERRAL_MAX_CENTS: 50000
    precision: "cents, round_half_up, capped at REFERRAL_MAX_CENTS"

  - name: referrer_credit
    trigger: "Referral PAYABLE add (forward) and CLAWED_BACK from PAYABLE/PAID (compensating)"
    algorithm: aggregation
    formula: |
      Lead.credit_balance_cents = SUM(Referral.payout_cents) over Referrals where
        Referral.referrer_lead_id == Lead.id AND Referral.status IN {PAYABLE, PAID}
    input_set: "All Referrals referred BY this lead in status PAYABLE or PAID"
    precision: "cents"

  - name: warranty_remediation
    trigger: "WarrantyClaim SUBMITTED->UNDER_REVIEW"
    algorithm: threshold
    formula: |
      base = REMEDIATION_BASE_CENTS[issue_type]              # CLOG:15000, OVERFLOW:30000, DETACHMENT:60000
      estimated_remediation_cents = base + round_half_up(Job's Quote.linear_feet * REMEDIATION_CENTS_PER_FOOT)
    input_set: "The claim's Job -> Quote.linear_feet and the claim issue_type"
    constants:
      REMEDIATION_BASE_CLOG_CENTS: 15000
      REMEDIATION_BASE_OVERFLOW_CENTS: 30000
      REMEDIATION_BASE_DETACHMENT_CENTS: 60000
      REMEDIATION_CENTS_PER_FOOT: 200
    precision: "cents, round_half_up"

  - name: deposit_amount
    trigger: "Job creation (on Quote accept)"
    algorithm: threshold
    formula: |
      deposit_cents = round_half_up(Quote.total_cents * DEPOSIT_PCT)
    input_set: "The accepted Quote's total_cents"
    constants:
      DEPOSIT_PCT: 0.10
    precision: "cents, round_half_up"

  - name: no_show_strikes
    trigger: "Appointment -> NO_SHOW"
    algorithm: aggregation
    formula: |
      Lead.no_show_strikes = COUNT(Appointment) where
        Appointment.lead_id == Lead.id AND Appointment.status == NO_SHOW
    input_set: "All of the lead's Appointments in status NO_SHOW"
    constants:
      NO_SHOW_LIMIT: 2
    precision: "integer count; reaching NO_SHOW_LIMIT (>= 2) triggers Lead -> LOST"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role (Admin | SalesRep | Scheduler | WarrantyAgent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role is permitted for this operation per §1.7 (e.g., only Scheduler/Admin may schedule Jobs; SalesRep acting on another rep's Lead is denied)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every referenced resource (path id, then body FK fields left-to-right) exists"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a valid from-state for the requested transition, including cross-entity state preconditions (present requires Appointment COMPLETED; financing accept requires Quote ACCEPTED; quote accept requires not expired)"
    error_id: "ERR_INVALID_STATE / ERR_APPOINTMENT_NOT_COMPLETED / ERR_QUOTE_NOT_ACCEPTED / ERR_QUOTE_EXPIRED / ERR_JOB_NOT_COMPLETED"
    http_status: 409
    applies_to: "transition, present, schedule, financing/warranty create endpoints"

  - priority: 5
    category: business_safety
    check: "For POST /api/jobs/{id}/schedule and Job->IN_PROGRESS: the relevant date's forecast is not SEVERE"
    error_id: ERR_WEATHER_UNSAFE
    http_status: 422
    applies_to: "POST /api/jobs/{id}/schedule, POST /api/jobs/{id}/transition (IN_PROGRESS)"

  - priority: 6
    category: business_referential
    check: "For LEAF_GUARD-category jobs, the assigned Crew.is_certified_leaf_guard is true"
    error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /api/jobs/{id}/schedule"

  - priority: 7
    category: business_temporal
    check: "Resource interval does not overlap an existing occupation — rep window [scheduled_start, scheduled_end) plus TRAVEL_BUFFER_MIN buffer for Appointments; crew whole-day span [install_date .. install_date+install_days-1] for Jobs"
    error_id: "ERR_REP_DOUBLE_BOOKED / ERR_CREW_DOUBLE_BOOKED"
    http_status: 409
    applies_to: "POST /api/appointments, POST /api/jobs/{id}/schedule"

  - priority: 8
    category: business_constraint
    check: "Field-domain and catalog constraints: measured_linear_feet > 0; estimated_linear_feet > 0; discount_pct in [0,1]; color in Product.available_colors; referrer_lead_id != referee_lead_id; financing principal >= MIN_FINANCE_AMOUNT_CENTS; pagination limit in [1,100] and offset >= 0"
    error_id: "ERR_INVALID_MEASUREMENT / ERR_INVALID_DISCOUNT / ERR_COLOR_UNAVAILABLE / ERR_SELF_REFERRAL / ERR_FINANCE_BELOW_MIN / ERR_PAGINATION_INVALID"
    http_status: 422
    applies_to: "appointment complete, quote create, referral create, financing create, list endpoints"

  - priority: 9
    category: business_fiscal
    check: "Financing principal must not exceed FINANCE_MAX_CENTS (5,000,000)"
    error_id: ERR_FINANCE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /api/financing-plans"

  - priority: 10
    category: state
    check: "OCC: on POST /api/quotes, expected_lead_version must equal the current Lead.version, else stale"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/quotes"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Product (catalog) ----------------
  - method: POST
    path: "/api/products"
    description: "Create a Product (catalog entry)"
    roles: [Admin]
    code: 201
    input: [name, category, base_rate_cents_per_foot, available_colors, premium_colors, "color_surcharge_cents_per_foot?", "is_active?"]
    output: Product
    side_effects: ["is_active defaults true"]
  - method: GET
    path: "/api/products/{id}"
    description: "Get a Product"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: Product
    side_effects: []

  # ---------------- SalesRep ----------------
  - method: POST
    path: "/api/sales-reps"
    description: "Create a SalesRep"
    roles: [Admin]
    code: 201
    input: [full_name, region, "is_active?"]
    output: SalesRep
    side_effects: []
  - method: GET
    path: "/api/sales-reps/{id}"
    description: "Get a SalesRep"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: SalesRep
    side_effects: []

  # ---------------- Crew ----------------
  - method: POST
    path: "/api/crews"
    description: "Create an install Crew"
    roles: [Admin]
    code: 201
    input: [name, region, "is_certified_leaf_guard?"]
    output: Crew
    side_effects: ["booked_days initialized to 0"]
  - method: GET
    path: "/api/crews/{id}"
    description: "Get a Crew (includes computed booked_days)"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # ---------------- Lead ----------------
  - method: POST
    path: "/api/leads"
    description: "Create a Lead (homeowner)"
    roles: [SalesRep, Admin]
    code: 201
    input: [full_name, address, phone, region, sales_rep_id]
    output: Lead
    side_effects: ["status=NEW; no_show_strikes=0; credit_balance_cents=0"]
  - method: GET
    path: "/api/leads/{id}"
    description: "Get a Lead"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: Lead
    side_effects: []
  - method: GET
    path: "/api/leads"
    description: "List Leads (paginated; filter by rep or status)"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: ["sales_rep_id?", "status?", "limit?", "offset?"]
    output: Lead[]
    side_effects: []
  - method: POST
    path: "/api/leads/{id}/transition"
    description: "Manual Lead transition (CONTACTED, LOST)"
    roles: [SalesRep, Admin]
    code: 200
    input: [to_status]
    output: Lead
    side_effects: ["Lead state machine incl. LOST cascade (decline quotes, cancel appointments)"]

  # ---------------- Appointment ----------------
  - method: POST
    path: "/api/appointments"
    description: "Book an in-home measure Appointment (rep window; overlap-checked)"
    roles: [SalesRep, Admin]
    code: 201
    input: [lead_id, sales_rep_id, scheduled_start, scheduled_end]
    output: Appointment
    side_effects: ["status=SCHEDULED; Lead NEW/CONTACTED -> APPOINTMENT_SET; rep-overlap check with TRAVEL_BUFFER_MIN"]
  - method: GET
    path: "/api/appointments/{id}"
    description: "Get an Appointment"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/api/appointments"
    description: "List Appointments (paginated; filter by lead or rep)"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: ["lead_id?", "sales_rep_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/api/appointments/{id}/transition"
    description: "Transition an Appointment (CONFIRMED, COMPLETED w/ measured_linear_feet, CANCELED, NO_SHOW)"
    roles: [SalesRep, Admin]
    code: 200
    input: [to_status, "measured_linear_feet?"]
    output: Appointment
    side_effects: ["Appointment state machine incl. NO_SHOW -> no_show_strikes recompute -> possible Lead LOST cascade"]

  # ---------------- Quote ----------------
  - method: POST
    path: "/api/quotes"
    description: "Create a Quote for a Lead (PROVISIONAL pricing; OCC on Lead; supersedes prior non-terminal quote)"
    roles: [SalesRep, Admin]
    code: 201
    input: [lead_id, appointment_id, sales_rep_id, product_id, color, estimated_linear_feet, expected_lead_version, "downspout_count?", "discount_pct?"]
    output: Quote
    side_effects:
      - "status=DRAFT; compute PROVISIONAL subtotal_cents/discount_cents/total_cents; linear_feet=estimated_linear_feet"
      - "Lead APPOINTMENT_SET -> QUOTED"
      - "Any prior Quote for this Lead in {DRAFT, PRESENTED, REVISION_REQUESTED} -> SUPERSEDED"
      - "increments Lead.version by 1"
  - method: GET
    path: "/api/quotes/{id}"
    description: "Get a Quote"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: GET
    path: "/api/quotes"
    description: "List Quotes (paginated; filter by lead/appointment/rep/product/status)"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: ["lead_id?", "appointment_id?", "sales_rep_id?", "product_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: POST
    path: "/api/quotes/{id}/present"
    description: "Present a DRAFT quote to the homeowner (recompute FINAL total from the completed appointment's measured feet)"
    roles: [SalesRep, Admin]
    code: 200
    input: []
    output: Quote
    side_effects: ["DRAFT->PRESENTED; copy measured_linear_feet; FINAL quote_pricing; stamp presented_at"]
  - method: POST
    path: "/api/quotes/{id}/transition"
    description: "Transition a Quote (ACCEPTED, DECLINED, REVISION_REQUESTED; and REVISION_REQUESTED->DRAFT via to_status=DRAFT)"
    roles: [SalesRep, Admin]
    code: 200
    input: [to_status]
    output: Quote
    side_effects: ["Quote state machine; ACCEPTED triggers Job creation cascade (Job->Lead WON->Referral PAYABLE + referrer credit)"]

  # ---------------- FinancingPlan ----------------
  - method: POST
    path: "/api/financing-plans"
    description: "Offer a financing plan for a PRESENTED/ACCEPTED quote (compute monthly_payment_cents & total_cost_cents)"
    roles: [SalesRep, Admin]
    code: 201
    input: [quote_id, plan_type, apr_bps, term_months, "promo_window_days?"]
    output: FinancingPlan
    side_effects: ["status=OFFERED; snapshot principal_cents=Quote.total_cents; financing_cost"]
  - method: GET
    path: "/api/financing-plans/{id}"
    description: "Get a FinancingPlan"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: []
  - method: GET
    path: "/api/financing-plans"
    description: "List FinancingPlans (paginated; filter by quote)"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: ["quote_id?", "status?", "limit?", "offset?"]
    output: FinancingPlan[]
    side_effects: []
  - method: POST
    path: "/api/financing-plans/{id}/transition"
    description: "Transition a FinancingPlan (ACCEPTED requires Quote ACCEPTED; CANCELED)"
    roles: [SalesRep, Admin]
    code: 200
    input: [to_status]
    output: FinancingPlan
    side_effects: ["FinancingPlan state machine"]

  # ---------------- Job (created via quote accept; not POST-created) ----------------
  - method: GET
    path: "/api/jobs/{id}"
    description: "Get a Job"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: Job
    side_effects: []
  - method: GET
    path: "/api/jobs"
    description: "List Jobs (paginated; filter by quote/lead/crew/status)"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: ["quote_id?", "lead_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: Job[]
    side_effects: []
  - method: POST
    path: "/api/jobs/{id}/schedule"
    description: "Assign crew + install_date to a PENDING or WEATHER_HOLD job (weather/certification/crew-overlap checks; reserves crew-days)"
    roles: [Scheduler, Admin]
    code: 200
    input: [crew_id, install_date]
    output: Job
    side_effects: ["PENDING/WEATHER_HOLD -> SCHEDULED; Crew.booked_days += install_days"]
  - method: POST
    path: "/api/jobs/{id}/transition"
    description: "Transition a Job (WEATHER_HOLD, IN_PROGRESS, COMPLETED, CANCELED)"
    roles: [Scheduler, Admin]
    code: 200
    input: [to_status]
    output: Job
    side_effects: ["Job state machine incl. crew-day release, referral PAYABLE (on COMPLETED) / CLAWED_BACK (on CANCELED)"]

  # ---------------- WarrantyClaim ----------------
  - method: POST
    path: "/api/warranty-claims"
    description: "File a lifetime clog-free warranty claim against a COMPLETED job"
    roles: [WarrantyAgent, Admin]
    code: 201
    input: [job_id, issue_type]
    output: WarrantyClaim
    side_effects: ["status=SUBMITTED; requires Job COMPLETED"]
  - method: GET
    path: "/api/warranty-claims/{id}"
    description: "Get a WarrantyClaim"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/api/warranty-claims"
    description: "List WarrantyClaims (paginated; filter by job)"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/api/warranty-claims/{id}/transition"
    description: "Transition a WarrantyClaim (UNDER_REVIEW computes estimate; APPROVED; DENIED; RESOLVED w/ actual_remediation_cents)"
    roles: [WarrantyAgent, Admin]
    code: 200
    input: [to_status, "actual_remediation_cents?"]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim state machine incl. warranty_remediation on UNDER_REVIEW"]

  # ---------------- Referral ----------------
  - method: POST
    path: "/api/referrals"
    description: "Record a referral linking a referrer Lead to a referee Lead"
    roles: [SalesRep, Admin]
    code: 201
    input: [referrer_lead_id, referee_lead_id]
    output: Referral
    side_effects: ["status=PENDING; payout_cents=0; rejects self-referral"]
  - method: GET
    path: "/api/referrals/{id}"
    description: "Get a Referral"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/api/referrals"
    description: "List Referrals (paginated; filter by referrer or referee lead)"
    roles: [Admin, SalesRep, Scheduler, WarrantyAgent]
    code: 200
    input: ["referrer_lead_id?", "referee_lead_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/api/referrals/{id}/transition"
    description: "Mark a PAYABLE referral PAID (Admin only)"
    roles: [Admin]
    code: 200
    input: [to_status]
    output: Referral
    side_effects: ["PAYABLE->PAID"]

  # ---------------- Test-driving endpoints ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (drives quote expiry and Job IN_PROGRESS date gating). Server default before any call is 2026-05-01T00:00:00Z (never wall-clock)."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets the server logical clock used for presented_at, expiry, and install_date >= now checks"]
  - method: POST
    path: "/_weather/set_forecast"
    description: "Set the forecast condition for an install date (default for all dates is CLEAR). Used by the weather-safety gate."
    roles: [Admin]
    code: 200
    input: [install_date, condition]
    output: null
    side_effects: ["Records condition (CLEAR | RAIN | SEVERE) for the given YYYY-MM-DD; SEVERE blocks schedule and IN_PROGRESS"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or bad enum/type" }
  - { id: ERR_PAGINATION_INVALID, http: 422, condition: "limit outside [1,100] or offset < 0" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or SalesRep acting on another rep's Lead" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product_id does not exist" }
  - { id: ERR_SALES_REP_NOT_FOUND, http: 404, condition: "sales_rep_id does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "crew_id does not exist" }
  - { id: ERR_LEAD_NOT_FOUND, http: 404, condition: "lead_id / referrer_lead_id / referee_lead_id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appointment_id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "quote_id does not exist" }
  - { id: ERR_FINANCING_PLAN_NOT_FOUND, http: 404, condition: "financing plan id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "job_id does not exist" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "warranty claim id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "referral id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not valid from the resource's current state" }
  - { id: ERR_APPOINTMENT_NOT_COMPLETED, http: 409, condition: "present requires the backing Appointment to be COMPLETED" }
  - { id: ERR_QUOTE_NOT_ACCEPTED, http: 409, condition: "financing accept requires the backing Quote to be ACCEPTED" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Quote accept attempted after presented_at + QUOTE_VALIDITY_DAYS" }
  - { id: ERR_JOB_NOT_COMPLETED, http: 409, condition: "Warranty claim requires the Job to be COMPLETED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lead_version does not match current Lead.version on POST /api/quotes" }
  - { id: ERR_WEATHER_UNSAFE, http: 422, condition: "Forecast for the install/current date is SEVERE" }
  - { id: ERR_CREW_NOT_CERTIFIED, http: 422, condition: "LEAF_GUARD job assigned to a crew without is_certified_leaf_guard" }
  - { id: ERR_REP_DOUBLE_BOOKED, http: 409, condition: "Appointment window (plus TRAVEL_BUFFER_MIN) overlaps an existing rep occupation" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Job crew-day span overlaps an existing SCHEDULED/IN_PROGRESS job on the same crew" }
  - { id: ERR_INVALID_MEASUREMENT, http: 422, condition: "measured_linear_feet or estimated_linear_feet <= 0" }
  - { id: ERR_INVALID_DISCOUNT, http: 422, condition: "discount_pct outside [0,1]" }
  - { id: ERR_COLOR_UNAVAILABLE, http: 422, condition: "Chosen color not in Product.available_colors" }
  - { id: ERR_SELF_REFERRAL, http: 422, condition: "referrer_lead_id == referee_lead_id" }
  - { id: ERR_FINANCE_BELOW_MIN, http: 422, condition: "Financing principal < MIN_FINANCE_AMOUNT_CENTS (100000)" }
  - { id: ERR_FINANCE_LIMIT_EXCEEDED, http: 422, condition: "Financing principal > FINANCE_MAX_CENTS (5000000)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Platform operator. Manages catalog (Products, SalesReps, Crews), the logical clock and weather forecast, marks referrals PAID, and may perform any business operation (hierarchical override over the peer roles)."
    identity: opaque
    exclusive_operations:
      - "POST /api/products"
      - "POST /api/sales-reps"
      - "POST /api/crews"
      - "POST /api/referrals/{id}/transition (PAYABLE->PAID)"
      - "POST /_clock/set_current_utc"
      - "POST /_weather/set_forecast"
    shared_operations:
      - "All SalesRep, Scheduler, and WarrantyAgent operations (override)"
      - "All GET endpoints"

  - name: SalesRep
    description: "Field sales rep. Owns the sales funnel for their own Leads: creates Leads, books Appointments, authors/presents/transitions Quotes, offers financing, records referrals. Ownership: a SalesRep may only act on a Lead (and its Appointments/Quotes) whose sales_rep_id equals the acting X-User-ID."
    identity: "entity_backed:SalesRep"
    exclusive_operations:
      - "POST /api/leads and POST /api/leads/{id}/transition"
      - "POST /api/appointments and POST /api/appointments/{id}/transition"
      - "POST /api/quotes, POST /api/quotes/{id}/present, POST /api/quotes/{id}/transition"
      - "POST /api/financing-plans and POST /api/financing-plans/{id}/transition"
      - "POST /api/referrals"
    shared_operations:
      - "All GET endpoints (shared with Admin as override)"

  - name: Scheduler
    description: "Install operations. Schedules Jobs to crews and dates, applies weather holds, and advances jobs through the install lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /api/jobs/{id}/schedule"
      - "POST /api/jobs/{id}/transition"
    shared_operations:
      - "All GET endpoints"

  - name: WarrantyAgent
    description: "Warranty operations. Files and adjudicates lifetime clog-free warranty claims on completed jobs."
    identity: opaque
    exclusive_operations:
      - "POST /api/warranty-claims"
      - "POST /api/warranty-claims/{id}/transition"
    shared_operations:
      - "All GET endpoints"
