  # --- Registry credit (business adjustment endpoint) ---
  - method: POST
    path: "/accreditation/facilities/{facility_id}/registry-credit"
    description: "Purchase registry submission credit for the facility (business adjustment endpoint)"
    roles: [FacilityAdmin]
    code: 200
    input: [amount_cents, expected_facility_version]
    output: Facility
    side_effects: ["Facility.registry_credit_cents += amount_cents", "increments Facility.version by 1"]

  # --- Logical clock (test-driving endpoint, §1.5 last resort) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. The server starts with the logical clock fixed at the default 2026-09-01T00:00:00Z and never reads real wall-clock time, so every deadline, expiry and window rule is deterministic before this endpoint is ever called."
    roles: [AccreditationBody]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, default_utc: datetime }"
    side_effects: ["advances the logical clock; re-evaluates every credential expiry, deadline_status, and testing_deadline_at threshold"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or naming an undeclared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is not permitted to call this endpoint" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "no Facility exists for the facility id in the request" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "no ModalityUnit exists for the unit id, or it belongs to a different facility than the request names" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "no EquipmentItem exists for the equipment id, or it belongs to a different unit than the request names" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "no ClinicalImageSubmission exists for the submission id, or a supplied resubmission_of_submission_id does not resolve" }
  - { id: ERR_PHANTOM_TEST_NOT_FOUND, http: 404, condition: "no PhantomTest exists for the phantom test id" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "no PhysicistSurvey exists for the survey id, or a supplied physicist_qualification_id does not resolve" }
  - { id: ERR_QUALIFICATION_NOT_FOUND, http: 404, condition: "no PersonnelQualification exists for the qualification id" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "no AccreditationCycle exists for the cycle id, or a supplied prior_cycle_id does not resolve" }
  - { id: ERR_RECORD_NOT_FOUND, http: 404, condition: "no DoseRegistryRecord exists for the record id" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "no CorrectiveActionPlan exists for the plan id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a state from which the requested transition is declared" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "the target resource is already in a terminal state (PASS, FAIL, VOIDED, ACCEPTED, RESUBMITTED, RETIRED, WITHDRAWN, EXPIRED, RENEWED, LAPSED, SUBMITTED, REJECTED, REVOKED)" }
  - { id: ERR_UNIT_DEFERRED, http: 409, condition: "the owning ModalityUnit has unit_status DEFERRED or WITHDRAWN" }
  - { id: ERR_CREDENTIAL_REVOKED, http: 409, condition: "the acting MedicalPhysicist's qualification has credential_status REVOKED" }
  - { id: ERR_ACCREDITATION_LAPSED, http: 409, condition: "the owning Facility's accreditation_currency is LAPSED or SUSPENDED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "the supplied expected_facility_version or expected_unit_version does not equal the current version of that parent entity" }
  - { id: ERR_DEADLINE_OVERDUE, http: 400, condition: "the facility has a CorrectiveActionPlan with deadline_status OVERDUE" }
  - { id: ERR_DEFICIENCY_PENDING, http: 400, condition: "the facility has a CorrectiveActionPlan with plan_status OPEN or SUBMITTED" }
  - { id: ERR_QUALIFICATION_UNVERIFIED, http: 400, condition: "a personnel qualification of the facility with personnel_role INTERPRETING_PHYSICIAN or TECHNOLOGIST has credential_status other than VERIFIED" }
  - { id: ERR_SURVEY_SHORTFALL, http: 400, condition: "the facility's roster_deficiency_aggregation is HALT, or a personnel qualification has credential_status REVOKED" }
  - { id: ERR_ROSTER_INELIGIBLE, http: 400, condition: "the facility's roster_disposition is HALT" }
  - { id: ERR_CE_HOURS_SHORTFALL, http: 400, condition: "ce_credit_hours < required_ce_hours for the qualification being verified" }
  - { id: ERR_SHIELDING_FAILED, http: 400, condition: "the physicist survey carries shielding_verdict FAIL" }
  - { id: ERR_UNIT_LABEL_DUPLICATE, http: 400, condition: "unit_label already exists among the facility's ModalityUnit rows" }
  - { id: ERR_SERIAL_DUPLICATE, http: 400, condition: "serial_number already exists among the facility's EquipmentItem rows" }
  - { id: ERR_CREDENTIAL_NUMBER_DUPLICATE, http: 400, condition: "credential_number already exists on any PersonnelQualification row" }
  - { id: ERR_PHANTOM_SCHEDULE_CONFLICT, http: 400, condition: "the new phantom acquisition window overlaps another PhantomTest of the unit with result_status ACQUIRED" }
  - { id: ERR_PHANTOM_TEST_CONFLICT, http: 400, condition: "the phantom test being scored is itself overlapped by another PhantomTest of the unit with result_status ACQUIRED, or is not in the ACQUIRED window" }
  - { id: ERR_SURVEY_WINDOW_CONFLICT, http: 400, condition: "the new survey's one-day window overlaps another PhysicistSurvey of the facility that is not REJECTED, or its performed_at precedes a stored survey's window" }
  - { id: ERR_DOSE_RECORD_DUPLICATE, http: 400, condition: "(unit_id, exam_category_code, exam_month) already exists on a DoseRegistryRecord" }
  - { id: ERR_CYCLE_INDEX_DUPLICATE, http: 400, condition: "cycle_index already exists among the facility's AccreditationCycle rows" }
  - { id: ERR_INVALID_VIEW_COUNT, http: 400, condition: "accepted_view_count is outside 0..required_view_count, or review_outcome ACCEPT was requested with accepted_view_count < required_view_count" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "a required body field is missing, or an enum-typed field carries a value outside its declared member set" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 400, condition: "the unit's clinical_deadline_at (image submissions) or testing_deadline_at (phantom tests) has already passed" }
  - { id: ERR_RESUBMISSION_LIMIT_EXCEEDED, http: 400, condition: "a submission carrying resubmission_of_submission_id would have resubmission_round greater than 2" }
  - { id: ERR_CAUSAL_ORDER, http: 400, condition: "a phantom test is scored with scored_at earlier than the deficiency_issued_at of the deficiency it answers" }
  - { id: ERR_RESUBMISSION_CHAIN, http: 400, condition: "resubmission_of_submission_id names a submission of a different unit, or one whose resubmission_round is not exactly one less than the new submission's round" }
  - { id: ERR_PHANTOM_UNSCORED, http: 400, condition: "the corrective action plan's unit has no PhantomTest with result_status SCORED or PASS at or after the deficiency was issued" }
  - { id: ERR_INSUFFICIENT_REGISTRY_CREDIT, http: 402, condition: "Facility.registry_credit_cents does not cover the operation's debit (2500 record submission, 75000 cycle start-renewal, 100000 survey resubmission)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FacilityAdmin
    description: "The facility being accredited. Acts as the Facility entity in the path of every facility-scoped action; the accreditation API additionally supports an operator user (X-User-ID not equal to any Facility id) for cross-facility administrative plumbing such as commissioning equipment or staging registry records."
    identity: entity_backed:Facility
    exclusive_operations:
      - "POST /facilities"
      - "POST /accreditation/facilities/{facility_id}/register"
      - "POST /accreditation/modality-units"
      - "POST /accreditation/modality-units/{unit_id}/withdraw"
      - "POST /accreditation/equipment"
      - "POST /accreditation/equipment/{equipment_id}/take-out-of-service"
      - "POST /accreditation/equipment/{equipment_id}/return-to-service"
      - "POST /accreditation/equipment/{equipment_id}/retire"
      - "POST /accreditation/clinical-image-submissions"
      - "POST /accreditation/phantom-tests"
      - "POST /accreditation/phantom-tests/{phantom_test_id}/score"
      - "POST /accreditation/corrective-action-plans/{plan_id}/submit"
      - "POST /accreditation/dose-registry-records"
      - "POST /accreditation/dose-registry-records/{record_id}/submit"
      - "POST /accreditation/facilities/{facility_id}/registry-credit"
    shared_operations:
      - "GET /accreditation/facilities/{facility_id} and every read endpoint"

  - name: MedicalPhysicist
    description: "The medical physicist performing the survey. Acts as the PersonnelQualification row named by physicist_qualification_id, so the survey submit, resubmit and schedule calls carry the qualification's id as X-User-ID."
    identity: entity_backed:PersonnelQualification
    exclusive_operations:
      - "POST /accreditation/physicist-surveys"
      - "POST /accreditation/physicist-surveys/{survey_id}/submit"
      - "POST /accreditation/physicist-surveys/{survey_id}/resubmit"
    shared_operations:
      - "GET /accreditation/physicist-surveys, GET /accreditation/physicist-surveys/{survey_id}"

  - name: AccreditationBody
    description: "The accrediting organization. A purely operational reviewer identity not tied to any persisted entity"
    identity: opaque
    exclusive_operations:
      - "POST /accreditation/facilities/{facility_id}/suspend"
      - "POST /accreditation/facilities/{facility_id}/reinstate"
      - "POST /accreditation/clinical-image-submissions/{submission_id}/review"
      - "POST /accreditation/phantom-tests/{phantom_test_id}/void"
      - "POST /accreditation/physicist-surveys/{survey_id}/accept"
      - "POST /accreditation/physicist-surveys/{survey_id}/reject"
      - "POST /accreditation/qualifications"
      - "POST /accreditation/qualifications/{qualification_id}/verify"
      - "POST /accreditation/qualifications/{qualification_id}/revoke"
      - "POST /accreditation/corrective-action-plans/{plan_id}/accept"
      - "POST /accreditation/corrective-action-plans/{plan_id}/reject"
      - "POST /accreditation/cycles"
      - "POST /accreditation/cycles/{cycle_id}/activate"
      - "POST /accreditation/cycles/{cycle_id}/start-renewal"
      - "POST /accreditation/cycles/{cycle_id}/renew"
      - "POST /accreditation/cycles/{cycle_id}/reject-renewal"
      - "POST /accreditation/dose-registry-records/{record_id}/reject"
    shared_operations: []

  - name: Any
    description: "Any authenticated caller of any role; used only for read endpoints, the facility summary, and the logical clock"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint"

  - name: Anonymous
    description: "No X-User-Role header, or an unparseable one. Only used by negative tests that assert ERR_UNAUTHENTICATED"
    identity: opaque
    exclusive_operations: []
    shared_operations: []