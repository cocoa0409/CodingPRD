# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3246_organized_play_sanctioning_set_release_cadence_print
#
# Nine §0.5 rules × 2 instances each = 18 instances. Every instance grounds in
# elements declared in SCAFFOLD.yaml §1.1–§1.7, and every setup_api_calls /
# trigger chain is expressible with §1.5 endpoints alone.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc: two valid interpretations on different domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: bundled_vs_unbundled_pod_pool_diverges
        grounds:
          - calculations.tier_prize_support_pool
          - calculations.prize_pool_remaining
          - validations[priority=6]
        distinguishing_aspect: "On the PrizeAllocation domain, the same QUALIFIER application with exactly four redeemed DIGITAL codes yields base_tp 48 under pool_mode=BUNDLED but 64 under pool_mode=UNBUNDLED — two valid readings of the same prose producing different pools for identical inputs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z, then advanced to the set release street date 2026-09-18T00:00:00Z so the release settles to RELEASED."
            - "One store with daily_event_capacity 8 and event_space_capacity 8, one set release, one FIXED format."
            - "Two identical QUALIFIER applications on 2026-09-26 and 2026-09-27, each pre-bound to four AVAILABLE DIGITAL code cards; all four cards of each application are then REDEEMED so member_count is exactly 4."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "QUALIFIER", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 30 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_a: $.data.id }
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "QOPA-1", code_kind: "DIGITAL", event_application_id: "${app_a}" }
              as: OpsAdmin
              captures: { ca1: $.data.id }
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "QOPA-2", code_kind: "DIGITAL", event_application_id: "${app_a}" }
              as: OpsAdmin
              captures: { ca2: $.data.id }
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "QOPA-3", code_kind: "DIGITAL", event_application_id: "${app_a}" }
              as: OpsAdmin
              captures: { ca3: $.data.id }
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "QOPA-4", code_kind: "DIGITAL", event_application_id: "${app_a}" }
              as: OpsAdmin
              captures: { ca4: $.data.id }
            - call: "POST /op/event-applications/${app_a}/code-redemption"
              payload: { redemption_code: "QOPA-1", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_a}/code-redemption"
              payload: { redemption_code: "QOPA-2", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_a}/code-redemption"
              payload: { redemption_code: "QOPA-3", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_a}/code-redemption"
              payload: { redemption_code: "QOPA-4", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "QUALIFIER", scheduled_date: "2026-09-27T18:00:00Z", expected_headcount: 30 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_b: $.data.id }
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "QOPB-1", code_kind: "DIGITAL", event_application_id: "${app_b}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "QOPB-2", code_kind: "DIGITAL", event_application_id: "${app_b}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "QOPB-3", code_kind: "DIGITAL", event_application_id: "${app_b}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "QOPB-4", code_kind: "DIGITAL", event_application_id: "${app_b}" }
              as: OpsAdmin
            - call: "POST /op/event-applications/${app_b}/code-redemption"
              payload: { redemption_code: "QOPB-1", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_b}/code-redemption"
              payload: { redemption_code: "QOPB-2", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_b}/code-redemption"
              payload: { redemption_code: "QOPB-3", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_b}/code-redemption"
              payload: { redemption_code: "QOPB-4", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /op/event-applications/${app_a}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_a: $.data.prize_allocation_id }
            - call: "POST /op/event-applications/${app_b}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "UNBUNDLED", pool_variant: "UNBUNDLED" }
              as: OpsAdmin
              captures: { alloc_b: $.data.prize_allocation_id }
          assert:
            - "PrizeAllocation.${alloc_a}.base_tp == 48"
            - "PrizeAllocation.${alloc_b}.base_tp == 64"
            - "PrizeAllocation.${alloc_a}.base_tp != PrizeAllocation.${alloc_b}.base_tp"
            - "PrizeAllocation.${alloc_a}.remaining_tp == 48 and PrizeAllocation.${alloc_b}.remaining_tp == 64"
            - "PrizeAllocation.${alloc_a}.total_drawn_tp == 0 and PrizeAllocation.${alloc_a}.total_restored_tp == 0"

      - name: reprint_verdict_addendum_vs_suppressed_ceiling
        grounds:
          - calculations.reprint_policy_verdict
          - entities.ReprintPlan.fields.verdict
        distinguishing_aspect: "On the ReprintPlan domain, secondary_market_index 42 yields verdict REPRINT_DENIED with the market-context addendum in force (wow_index 61) but REPRINT_ALLOWED when the addendum is suppressed — two valid readings of the same accessibility rule over identical input."
        test_recipe:
          setup:
            - "Logical clock at the street date so the set release is RELEASED; one store, one set release, one FIXED format."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 1, event_space_capacity: 2 }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/reprint-plans"
              payload: { card_name: "Ceiling Card", set_release_id: "${set_id}", format_id: "${format_id}", secondary_market_index: 42, first_print_index: 40 }
              as: OpsAdmin
              captures: { plan_ceiling: $.data.id }
            - call: "POST /op/reprint-plans"
              payload: { card_name: "Slack Card", set_release_id: "${set_id}", format_id: "${format_id}", secondary_market_index: 28, first_print_index: 30 }
              as: OpsAdmin
              captures: { plan_slack: $.data.id }
          assert:
            - "ReprintPlan.${plan_ceiling}.verdict == REPRINT_DENIED"
            - "ReprintPlan.${plan_ceiling}.status == DRAFT"
            - "ReprintPlan.${plan_slack}.verdict == REPRINT_ALLOWED"
            - "the suppressed variant would return REPRINT_ALLOWED for secondary_market_index 42 because 42 <= REPRINT_CEILING_INDEX 42, so the two readings disagree on exactly this input"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: two different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: physical_grant_nested_rounding_floor_then_sum
        grounds:
          - calculations.prize_pool_remaining
          - state_machines.CodeRedemption.physical_grant_status.RESERVED_to_DISBURSED
          - validations[priority=14]
        distinguishing_aspect: "Mode (b) nested rounding: three LOCAL-tier physical grants are each floored to 40 before summing, giving total_drawn_tp 120, whereas summing the unrounded 40.5 grants and flooring once gives 121 — the scaffold pins floor-then-sum."
        test_recipe:
          setup:
            - "Logical clock advanced past street_date + 7 days so the LOCAL application can be COMPLETED."
            - "One store, one set release (street 2026-09-18T00:00:00Z), one FIXED format, and one LOCAL application approved with a BUNDLED pool of base_tp 16 raised to 166 by an INCREASE_REPRINT_RUN of 150."
            - "Three PHYSICAL code cards pre-bound to that application, all three REDEEMED so physical_grant_status is RESERVED on each."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/prize-allocations/${alloc_id}/transition"
              payload: { action: "INCREASE_REPRINT_RUN", additional_tp: 150 }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "PHY-1", code_kind: "PHYSICAL", event_application_id: "${app_id}" }
              as: OpsAdmin
              captures: { p1: $.data.id }
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "PHY-2", code_kind: "PHYSICAL", event_application_id: "${app_id}" }
              as: OpsAdmin
              captures: { p2: $.data.id }
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "PHY-3", code_kind: "PHYSICAL", event_application_id: "${app_id}" }
              as: OpsAdmin
              captures: { p3: $.data.id }
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "PHY-1", code_kind: "PHYSICAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "PHY-2", code_kind: "PHYSICAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "PHY-3", code_kind: "PHYSICAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-26T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "COMPLETE" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /op/code-redemptions/${p1}/transition"
              payload: { action: "DISBURSE" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions/${p2}/transition"
              payload: { action: "DISBURSE" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions/${p3}/transition"
              payload: { action: "DISBURSE" }
              as: OpsAdmin
          assert:
            - "PrizeAllocation.${alloc_id}.total_drawn_tp == 120"
            - "PrizeAllocation.${alloc_id}.total_restored_tp == 120"
            - "PrizeAllocation.${alloc_id}.remaining_tp == 166"
            - "PrizeAllocation.${alloc_id}.base_tp == 166"
            - "sum-then-floor would give floor(3 * 40.5) == 121, so 120 pins the floor-then-sum order"
            - "CodeRedemption.${p1}.physical_grant_status == DISBURSED and CodeRedemption.${p1}.status == REDEEMED"

      - name: championship_pool_tier_and_member_threshold_interaction
        grounds:
          - calculations.tier_prize_support_pool
          - calculations.prize_pool_remaining
          - entities.PrizeAllocation.fields.base_tp
        distinguishing_aspect: "Mode (a) combinatorial formula: pool size is a tiered lookup free_base[tier] combined with a conditional branch on member_count >= 4 that multiplies only the excess members, so CHAMPIONSHIP pools move from 96 to 108 exactly at the fourth-member boundary."
        test_recipe:
          setup:
            - "Logical clock advanced to the set release street date; one store with daily_event_capacity 8 and event_space_capacity 8."
            - "Two CHAMPIONSHIP applications on different calendar days; the first has exactly four REDEEMED DIGITAL codes plus one AVAILABLE DIGITAL invitation, the second has exactly five REDEEMED DIGITAL codes plus one AVAILABLE DIGITAL invitation."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "CHAMPIONSHIP", scheduled_date: "2026-10-03T18:00:00Z", expected_headcount: 60 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_four: $.data.id }
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM4-0", code_kind: "DIGITAL", event_application_id: "${app_four}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM4-1", code_kind: "DIGITAL", event_application_id: "${app_four}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM4-2", code_kind: "DIGITAL", event_application_id: "${app_four}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM4-3", code_kind: "DIGITAL", event_application_id: "${app_four}" }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "CHM4-4", code_kind: "DIGITAL", event_application_id: "${app_four}" }
              as: OpsAdmin
            - call: "POST /op/event-applications/${app_four}/code-redemption"
              payload: { redemption_code: "CHM4-1", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_four}/code-redemption"
              payload: { redemption_code: "CHM4-2", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_four}/code-redemption"
              payload: { redemption_code: "CHM4-3", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_four}/code-redemption"
              payload: { redemption_code: "CHM4-4", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "CHAMPIONSHIP", scheduled_date: "2026-10-04T18:00:00Z", expected_headcount: 60 }
              as: StoreOrganizer
