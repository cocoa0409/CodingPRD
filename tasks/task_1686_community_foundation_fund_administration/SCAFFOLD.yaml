  - method: POST
    path: "/statements/{statementId}/deliver"
    description: "Mark statement delivered"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: AnnualStatement
    side_effects: ["status -> DELIVERED"]

  - method: GET
    path: "/funds/{fundId}/disbursements"
    description: "List disbursements (grants + awards) for a fund — impact reporting feed"
    roles: [FoundationAdmin, FinanceOfficer]
    code: 200
    input: ["source_kind?", "limit?", "offset?"]
    output: "Disbursement[]"
