  - rule_id: transitive_cascade
    instances:
      - name: work_order_completion_cascades_six_hops_into_an_unnamed_work_orders_priority_score
        grounds:
          - endpoints.POST_/wind-ops/work-orders/{id}/complete
          - state_machines.FaultEvent.DISPATCHED_to_CLEARED
          - state_machines.FaultEvent.CLEARED_to_CLOSED
          - entities.Turbine.fields.counted_downtime_hours_period
          - entities.ServiceAgreement.fields.projected_shortfall_pct
          - entities.ServiceAgreement.fields.at_risk_flag
          - entities.WorkOrder.fields.priority_score
          - calculations.availability_and_liquidated_damages
          - calculations.work_order_priority_score
        distinguishing_aspect: |
          One request reaches six hops deep and lands on an entity the request never names.
          complete -> (1) WorkOrder COMPLETED with labour cost -> (2) Turbine back ONLINE ->
          (3) FaultEvent DISPATCHED through CLEARED to CLOSED -> (4) turbine downtime and lost
          energy counters -> (5) the ACTIVE ServiceAgreement's LIVE_PROJECTION shortfall flips
          at_risk_flag to true -> (6) an unrelated SUBMITTED work order on a DIFFERENT turbine is
          re-scored from 70.00 to 90.67 because the LDA term switched on. Truncating the chain at
          hop 5 leaves the second order at 70.00 and is the failure this instance detects.
        test_recipe:
          setup:
            - "one farm with two ONLINE turbines T1 and T2, both expecting 2000 kWh per hour"
            - "one ACTIVE TIME_BASED ServiceAgreement guaranteeing 99.0000 pct over 2026-07-01T00:00:00Z to 2026-07-31T00:00:00Z, i.e. 720 period hours across 2 turbines for a 1440-hour denominator"
            - "one LOCKOUT fault code rule FC-2000 with requires_dispatch true and contractual_exclusion false"
            - "one AVAILABLE crew certified GWO_BASIC at 18000 cents per hour with daily_hours_capacity 12"
            - "one SUBMITTED MAJOR_COMPONENT work order WO2 on T2 with estimated_hours 4, submitted at 2026-07-01T00:00:00Z, whose priority_score is 70.00"
            - "one IN_PROGRESS FAULT_DISPATCH work order WO1 on T1 with estimated_hours 6, backing a fault raised at 2026-07-02T00:00:00Z"
            - "the logical clock is advanced to 2026-07-03T00:00:00Z immediately before the trigger"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Coyote Ridge", region_code: "TX-W", grid_operator_code: "ERCOT", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 1000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-02", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 1000 }
              as: SiteAdmin
              as_user_id: "admin-1"
