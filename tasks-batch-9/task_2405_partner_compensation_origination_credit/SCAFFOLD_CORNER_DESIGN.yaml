              payload: { full_name: "Ready Subject", practice_group: "CORPORATE", compensation_model: "DISCRETIONARY", admission_year: 2012 }
              as: CycleAdmin
              captures: { ps: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ready One", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2004, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ready Two", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Ready for deliberation.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${ps}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${ps}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { r1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c2}" }
              as: CycleAdmin
              captures: { r2: "$.data.id" }
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Fine." }
              as: Partner
              as_user_id: "${c1}"
            - call: "POST /comp/peer-reviews/${r2}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Fine." }
              as: Partner
              as_user_id: "${c2}"
            - call: "POST /comp/self-assessments/${sa}/review-decision"
              payload: { decision: "ACCEPT" }
              as: CommitteeMember
              as_user_id: "${c1}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "GET /comp/awards"
              payload: { cycle_id: "${cy}", partner_id: "${ps}" }
              as: CycleAdmin
              captures: { aw: "$.data[0].id" }
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${ps}", committee_member_id: "${c1}" }
              as: CycleAdmin
              captures: { b1: "$.data[0].id" }
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${ps}", committee_member_id: "${c2}" }
              as: CycleAdmin
              captures: { b2: "$.data[0].id" }
          trigger:
            - call: "POST /comp/awards/${aw}/draw-run"
              payload: { period_year: 2026, period_month: 1 }
              as: CycleAdmin
              captures: { e_draw: "$.data.error_id" }
            - call: "POST /comp/awards/${aw}/true-up"
              payload: {}
              as: CycleAdmin
              captures: { e_tu: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
              captures: { e_quorum: "$.data.error_id" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { v1: "$.data.version" }
            - call: "POST /comp/ballots/${b1}/cast"
              payload: { action: "CAST", points_proposed: 1500.00, rationale: "Well above the cap.", expected_cycle_version: "${v1}" }
              as: CommitteeMember
              as_user_id: "${c1}"
              captures: { e_cap: "$.data.error_id" }
            - call: "POST /comp/ballots/${b1}/cast"
              payload: { action: "CAST", points_proposed: 800.00, rationale: "Strong year.", expected_cycle_version: "${v1}" }
              as: CommitteeMember
              as_user_id: "${c1}"
              captures: { bst: "$.data.state" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { v2: "$.data.version" }
            - call: "POST /comp/ballots/${b1}/cast"
              payload: { action: "ABSTAIN", recusal_reason: "On reflection I abstain.", expected_cycle_version: "${v2}" }
              as: CommitteeMember
              as_user_id: "${c1}"
              captures: { e_already: "$.data.error_id" }
            - call: "POST /comp/ballots/${b2}/cast"
              payload: { action: "CAST", points_proposed: 600.00, rationale: "Solid year.", expected_cycle_version: "${v2}" }
              as: CommitteeMember
              as_user_id: "${c2}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
              captures: { st1: "$.data.state" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
              captures: { st2: "$.data.state", rc1: "$.data.reopen_count" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
              captures: { st3: "$.data.state" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
              captures: { e_reopen: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "TRUE_UP_OPEN" }
              as: CycleAdmin
              captures: { st4: "$.data.state" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
              captures: { e_settle: "$.data.error_id" }
          assert:
            - "${e_draw} == ERR_AWARD_NOT_DRAWABLE with HTTP 409, because the award is still PROPOSED"
            - "${e_tu} == ERR_AWARD_NOT_TRUE_UP_READY with HTTP 409, because payment_state is PENDING and the cycle is not TRUE_UP_OPEN"
            - "${e_quorum} == ERR_QUORUM_NOT_MET with HTTP 409 with zero CAST ballots"
            - "${e_cap} == ERR_POINTS_CAP_EXCEEDED with HTTP 409, and the rejected cast neither decided the ballot nor bumped the cycle version, so ${v1} is still current"
            - "${bst} == CAST"
            - "${e_already} == ERR_BALLOT_ALREADY_DECIDED with HTTP 409 - a decided ballot cannot be switched to ABSTAIN"
            - "${st1} == AWARDS_PUBLISHED with Partner.${ps}.committee_points == 700.00"
            - "${st2} == DELIBERATION and ${rc1} == 1, with the award back in PROPOSED/PENDING"
            - "${st3} == AWARDS_PUBLISHED - the two CAST ballots survived the reopen, so quorum was still met"
            - "${e_reopen} == ERR_CYCLE_NOT_REOPENABLE with HTTP 409, because reopen_count 1 has reached MAX_REOPENS"
            - "${st4} == TRUE_UP_OPEN"
            - "${e_settle} == ERR_AWARDS_NOT_SETTLED with HTTP 409, because unsettled_award_count is 1"
            - "CompensationCycle.${cy}.reopen_count == 1 and confidentiality_locked == false"

      - name: verifying_an_already_verified_record_is_refused
        claim_type: Violation → Error
        grounds:
          - errors[ERR_RECORD_ALREADY_VERIFIED]
          - endpoints[POST /comp/contribution-records/{id}/verify]
          - entities.ContributionRecord.fields.verified_at
        distinguishing_aspect: |
          Verification is a one-way latch: the second verify returns
          ERR_RECORD_ALREADY_VERIFIED 409 and, crucially, does not double-count the hours -
          Partner.verified_billable_hours stays at 10.00 rather than becoming 20.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE; partner P owns OPEN Matter M and one unverified 10.00-hour BILLABLE record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ver Ified", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-VF", client_display_name: "Verified Ventures", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-01-05", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", matter_id: "${m}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 10.00, standard_rate_cents: 50000, service_period_start: "2026-02-01", service_period_end: "2026-02-28" }
              as: CycleAdmin
              captures: { cr: "$.data.id" }
          trigger:
            - call: "POST /comp/contribution-records/${cr}/verify"
              payload: {}
              as: CycleAdmin
              captures: { ver: "$.data.verified", vat: "$.data.verified_at", v1: "$.data.version" }
            - call: "POST /comp/contribution-records/${cr}/verify"
              payload: {}
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { hrs: "$.data.verified_billable_hours" }
          assert:
            - "${ver} == true and ${vat} == 2026-08-01T00:00:00Z"
            - "${err} == ERR_RECORD_ALREADY_VERIFIED with HTTP 409"
            - "ContributionRecord.${cr}.version == ${v1}, unchanged by the refused second verify"
            - "${hrs} == 10.00, not 20.00"
            - "GET /comp/matters/${m}/credit-allocations with credit_role WORKING returns exactly 1 row at credit_pct 100.00"

      - name: an_unfundable_lockstep_obligation_stops_publication
        claim_type: Violation → Error
        grounds:
          - errors[ERR_POOL_INSUFFICIENT]
          - calculations.cycle_pool_waterfall
          - state_machines[CompensationCycle].transitions[DELIBERATION->AWARDS_PUBLISHED]
        distinguishing_aspect: |
          A deficit that survives both haircut ceilings is an error rather than a negative
          pool: 200000000 of lockstep obligation plus 50000000 discretionary against
          100000000 distributable leaves 150000000 of deficit, the two ceilings absorb only
          60000000 and 15000000, and the remaining 75000000 aborts the whole advance -
          leaving all four pool fields and the cycle state exactly as they were.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 with distributable_pool_cents 100000000, lockstep_unit_cents 10000000 and discretionary_pool_pct 0.5000."
            - "Partner L is LOCKSTEP at lockstep_step 20 and evaluation_required; C1 and C2 review L."
            - "The cycle has been carried to DELIBERATION with no ballots, since there is no DISCRETIONARY subject."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 10000000, discretionary_pool_pct: 0.5000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Over Committed", practice_group: "CORPORATE", compensation_model: "LOCKSTEP", admission_year: 1996, lockstep_step: 20 }
              as: CycleAdmin
              captures: { pl: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Pool One", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2004, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Pool Two", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Senior lockstep partner statement.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${pl}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pl}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { r1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c2}" }
              as: CycleAdmin
              captures: { r2: "$.data.id" }
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Fine." }
              as: Partner
              as_user_id: "${c1}"
            - call: "POST /comp/peer-reviews/${r2}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Fine." }
              as: Partner
              as_user_id: "${c2}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
              captures: { dv: "$.data.version" }
          trigger:
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { st: "$.data.state", lock: "$.data.lockstep_reserved_cents", disc: "$.data.discretionary_pool_cents", form: "$.data.formula_pool_cents", hc: "$.data.haircut_applied_pct", cv: "$.data.version" }
            - call: "GET /comp/awards"
              payload: { cycle_id: "${cy}", partner_id: "${pl}" }
              as: CycleAdmin
              captures: { awst: "$.data[0].award_state", awtgt: "$.data[0].target_award_cents" }
          assert:
            - "${err} == ERR_POOL_INSUFFICIENT with HTTP 409"
            - "${st} == DELIBERATION and ${cv} == ${dv} - the aborted advance wrote nothing"
            - "${lock} == 0, ${disc} == 0, ${form} == 0 and ${hc} == 0.0000, all still at their pre-call values"
            - "${awst} == PROPOSED and ${awtgt} == 0"
            - "no DrawPayment exists"

      - name: departure_and_credit_transition_refusals
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PARTNER_NOT_DEPARTING]
          - errors[ERR_TRANSITION_NOT_PENDING]
          - errors[ERR_TRANSITION_NOT_VOIDABLE]
          - endpoints[POST /comp/partners/{id}/notice-of-departure]
          - endpoints[POST /comp/credit-transitions/{id}/effectuate]
          - endpoints[POST /comp/credit-transitions/{id}/void]
        distinguishing_aspect: |
          Notice of departure is not repeatable and an effectuated transition is not
          re-effectuable or voidable: the second notice returns ERR_PARTNER_NOT_DEPARTING
          403, the second effectuate ERR_TRANSITION_NOT_PENDING 409 and the void
          ERR_TRANSITION_NOT_VOIDABLE 409 - and the departing partner has already been
          moved to DEPARTED by the automatic bubble-up once its last PROPOSED transition
          cleared.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner PD holds an ALLOCATED 100.00 ORIGINATING credit on OPEN Matter M; PS is an ACTIVE successor; ARB is an uninvolved credit arbiter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
