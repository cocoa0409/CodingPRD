      - name: derived_remaining_obligation_reconciled_after_disbursement
        claim_type: derived_field_reconciliation
        grounds: [entities.IhpCase.fields.remaining_obligation_cents, entities.IhpCase.fields.disbursed_total_cents]
        distinguishing_aspect: "After a 300,000 disbursement on a 1,540,000 approved case, remaining_obligation_cents reconciles to 1,240,000 and disbursed_total_cents to 300,000."
        test_recipe:
          setup: ["Approved case total_approved 1,540,000, one disbursement of 300,000."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-CC2", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/inspectors"
              payload: { full_name: "Cc2 Insp", badge_number: "INS-CC2" }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /disaster-relief/caseworkers"
              payload: { full_name: "Cc2 Cw", employee_id: "CW-CC2" }
              as: ProgramAdmin
              captures: { cw1_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Cc2 Household", household_size: 4, annual_income_cents: 3500000, damage_date: "2026-01-18T00:00:00Z", reported_repair_cost_cents: 900000, reported_personal_property_cents: 400000, reported_rental_months: 2 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/assessments"
              payload: { applicant_id: "${app_id}", inspector_id: "${insp_id}", scheduled_start: "2026-02-15T09:00:00Z", scheduled_end: "2026-02-15T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /disaster-relief/assessments/${asm_id}/inspect"
              payload: { habitability: "UNINHABITABLE", verified_repair_cost_cents: 900000, verified_personal_property_cents: 400000, verified_rental_months: 2 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /disaster-relief/assessments/${asm_id}/verify"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
            - call: "POST /disaster-relief/ihp-cases"
              payload: { applicant_id: "${app_id}", assessment_id: "${asm_id}", monthly_fmr_cents: 120000 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /disaster-relief/ihp-cases/${case_id}/approve"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { case_v: $.data.version }
            - call: "GET /disaster-relief/award-line-items?ihp_case_id=${case_id}&category=REPAIR_ASSISTANCE"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { repair_li_id: "$.data[0].id" }
            - call: "POST /disaster-relief/disbursements"
              payload: { ihp_case_id: "${case_id}", line_item_id: "${repair_li_id}", expected_ihp_case_version: "${case_v}", amount_cents: 300000 }
              as: Caseworker
              as_user_id: "${cw1_id}"
          trigger:
            - call: "GET /disaster-relief/ihp-cases/${case_id}"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { remaining: $.data.remaining_obligation_cents, disbursed: $.data.disbursed_total_cents }
          assert:
            - "IhpCase.${case_id}.disbursed_total_cents (disbursed) == 300000"
            - "IhpCase.${case_id}.remaining_obligation_cents (remaining) == 1240000"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_sba_cascade_visible_in_same_request_chain
        claim_type: immediate
        grounds: [state_machines.SbaReferral.REFERRED_to_SBA_APPROVED]
        excluded_because:
          difficulty_instance: transitive_cascade / sba_approval_three_hop_to_recoupment
          rationale: "The SBA-approval cascade (DOB -> net recompute -> recoupment) completing within the triggering request is asserted by the named §1.8 instance."
