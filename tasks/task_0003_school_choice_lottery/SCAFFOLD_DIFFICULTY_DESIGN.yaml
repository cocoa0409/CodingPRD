          setup:
            - "School total_seats=1; 2 SUBMITTED apps; after lottery: 1 ACCEPTED, 1 WAITLISTED. The ACCEPTED app's Offer is then DECLINED. Cascade promotes the WAITLISTED app to ACCEPTED. ACCEPTED-count for school: 1 before, 1 after."
