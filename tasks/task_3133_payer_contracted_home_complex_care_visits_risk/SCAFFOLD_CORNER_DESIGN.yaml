# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3133_payer_contracted_home_complex_care_visits_risk
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section 1: Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: care_program_creation_201_and_fields_returned
        claim_type: creation
        grounds:
          - entities.CareProgram
          - endpoints."POST /care-programs"
        distinguishing_aspect: "POST /care-programs with all required fields returns 201 and echoes back program_code, display_name, service_geography_zips, urgent_response_sla_hours (default 24), and system-computed current_period_index == 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_code: $.data.program_code, prog_period: $.data.current_period_index, prog_sla: $.data.urgent_response_sla_hours }
          assert:
            - "response status == 201"
            - "prog_code == 'LMRK-TX'"
            - "prog_period == 0"
            - "prog_sla == 24"

      - name: care_program_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds:
          - entities.CareProgram
          - endpoints."GET /care-programs/{programId}"
        distinguishing_aspect: "GET /care-programs/{id} returns the same program_code, display_name, service_geography_zips, and urgent_response_sla_hours that were supplied at creation."
        test_recipe:
          setup: ["CareProgram CP exists."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /care-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { prog_code: $.data.program_code, prog_zips: $.data.service_geography_zips }
          assert:
            - "prog_code == 'LMRK-TX'"
            - "prog_zips == ['75201']"

      - name: care_program_not_found_404
        claim_type: not_found
        grounds:
          - entities.CareProgram
          - errors.ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: "GET /care-programs/{nonexistent-uuid} returns 404 with ERR_PROGRAM_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /care-programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_PROGRAM_NOT_FOUND"

      - name: payer_contract_creation_capitated_requires_pmpm
        claim_type: required_fields
        grounds:
          - entities.PayerContract
          - validations.priority_15_business_fiscal
        distinguishing_aspect: "POST /payer-contracts with payment_model == CAPITATED but missing pmpm_rate_cents returns 400 ERR_PAYMENT_MODEL_MISMATCH."
        test_recipe:
          setup: ["CareProgram CP exists."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED" }
              as: ContractAdministrator
              captures: { error_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "error_id == ERR_PAYMENT_MODEL_MISMATCH"

      - name: payer_contract_creation_shared_savings_requires_baseline_and_split
        claim_type: required_fields
        grounds:
          - entities.PayerContract
          - validations.priority_15_business_fiscal
        distinguishing_aspect: "POST /payer-contracts with payment_model == SHARED_SAVINGS but missing shared_savings_baseline_pmpm_cents returns 400 ERR_PAYMENT_MODEL_MISMATCH."
        test_recipe:
          setup: ["CareProgram CP exists."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanSS", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "SHARED_SAVINGS", shared_savings_split_pct: 0.50 }
              as: ContractAdministrator
              captures: { error_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "error_id == ERR_PAYMENT_MODEL_MISMATCH"

      - name: clinician_creation_defaults_active_and_zero_count
        claim_type: defaults
        grounds:
          - entities.Clinician
          - endpoints."POST /clinicians"
        distinguishing_aspect: "POST /clinicians creates a row with status == ACTIVE and active_daily_visit_count == 0 by default."
        test_recipe:
          setup: ["CareProgram CP exists."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 5 }
              as: PlatformAdmin
              captures: { clin_status: $.data.status, clin_count: $.data.active_daily_visit_count }
          assert:
            - "clin_status == ACTIVE"
            - "clin_count == 0"

      - name: member_creation_computes_provisional_burden_and_tier
        claim_type: computed_fields
        grounds:
          - entities.Member
          - calculations.chronic_condition_burden_provisional
        distinguishing_aspect: "POST /members with CHF (6), 2 ED visits (3*2=6), 1 IP admit (5*1=5) yields burden_score_provisional == 17 and risk_tier == HIGH."
        test_recipe:
          setup: ["CareProgram CP and PCPProvider P exist."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM" }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 2, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { burden: $.data.burden_score_provisional, tier: $.data.risk_tier }
          assert:
            - "burden == 17"
            - "tier == HIGH"

      - name: member_creation_ignores_input_burden_score_provisional
        claim_type: system_fields
        grounds:
          - entities.Member
          - calculations.chronic_condition_burden_provisional
        distinguishing_aspect: "Client-supplied burden_score_provisional in POST /members is ignored; the server computes it from claims history."
        test_recipe:
          setup: ["CareProgram CP, contract, PCP exist."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM" }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 2, prior_inpatient_admits_12mo: 1, burden_score_provisional: 999 }
              as: PlatformAdmin
              captures: { burden: $.data.burden_score_provisional }
          assert:
            - "burden == 17 (not 999)"

      - name: visit_creation_assigns_clinician_by_selector_not_client
        claim_type: system_fields
        grounds:
          - entities.Visit
          - calculations.routine_visit_clinician_selector
        distinguishing_aspect: "POST /visits ignores any client-supplied clinician_id and assigns via the selector; the response clinician_id matches the chosen NP."
        test_recipe:
          setup: ["ACTIVE enrollment with NP1 assigned; NP1 has capacity."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM" }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 5 }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_id}/record-consent"
              payload: { consent_document_id: "DOC-1" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
          trigger:
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", visit_type: "ROUTINE_FOLLOWUP", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:00:00Z", clinician_id: "00000000-0000-0000-0000-000000000000" }
              as: CareCoordinator
              captures: { visit_clin: $.data.clinician_id }
          assert:
            - "visit_clin == ${np_id}"
            - "visit_clin != '00000000-0000-0000-0000-000000000000'"

      - name: medical_cost_amount_zero_accepted
        claim_type: type_constraints
        grounds:
          - entities.MedicalCost
          - endpoints."POST /medical-costs"
        distinguishing_aspect: "POST /medical-costs with amount_cents == 0 is accepted (>= 0 constraint); negative amount_cents is rejected."
        test_recipe:
          setup: ["CareProgram CP, contract, member exist."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM" }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /medical-costs"
              payload: { payer_contract_id: "${contract_id}", member_id: "${member_id}", period_index: 0, amount_cents: 0, incurred_date: "2026-08-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { mc_id: $.data.id, mc_amount: $.data.amount_cents }
          assert:
            - "response status == 201"
            - "mc_amount == 0"

      - name: medical_cost_amount_negative_rejected
        claim_type: type_constraints
        grounds:
          - entities.MedicalCost
          - endpoints."POST /medical-costs"
        distinguishing_aspect: "POST /medical-costs with amount_cents == -1 is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["CareProgram CP, contract, member exist."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM" }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /medical-costs"
              payload: { payer_contract_id: "${contract_id}", member_id: "${member_id}", period_index: 0, amount_cents: -1, incurred_date: "2026-08-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { error_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: enrollment_creation_sets_is_current_true_and_outreach_attempts_zero
        claim_type: computed_fields
        grounds:
          - entities.MemberEnrollment
          - endpoints."POST /members/{memberId}/enrollments"
        distinguishing_aspect: "POST /members/{id}/enrollments creates a row with status == IDENTIFIED, is_current == true, outreach_attempts == 0."
        test_recipe:
          setup: ["Member M exists."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM" }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
          trigger:
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_status: $.data.status, enr_current: $.data.is_current, enr_attempts: $.data.outreach_attempts }
          assert:
            - "enr_status == IDENTIFIED"
            - "enr_current == true"
            - "enr_attempts == 0"

      - name: care_team_composition_complete_false_when_only_np_set
        claim_type: computed_fields
        grounds:
          - entities.CareTeam
          - endpoints."PUT /enrollments/{enrollmentId}/care-team"
        distinguishing_aspect: "PUT /enrollments/{id}/care-team with only primary_np_id set yields composition_complete == false."
        test_recipe:
          setup: ["Enrollment E in CONSENTED with CareTeam DRAFT."]
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM" }
