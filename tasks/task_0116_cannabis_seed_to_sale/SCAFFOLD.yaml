scenario: "Cannabis Seed-to-Sale (METRC): plant tag/lot tracking, cultivation→harvest→package transitions, lab test (potency/pesticide) hold, transfer manifest, per-customer purchase limit, inventory reconciliation, waste destruction, state license compliance"
domain_name: cannabis-seed-to-sale
api_prefix: "/compliance"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # PlantBatch -> Harvest -> Package -> SaleLine forms a provenance DAG with
  # cross-aggregate references (Manifest <-> Package via junction ManifestLine,
  # LabResult -> Package, ReconciliationCount -> Package). Not a strict tree.

  state_machine_shape: branching
  # Package: TESTING -> {PASSED, FAILED} (branching with divergent side effects);
  # Manifest: DRAFT <-> IN_TRANSIT revision loop is cyclic; PlantBatch and Harvest
  # are guarded pipelines with cross-entity preconditions.

  relationship_patterns:
    - one_to_many        # License -> PlantBatch, Harvest -> Package
    - many_to_many       # Manifest <-> Package via ManifestLine junction
    - cross_aggregate    # LabResult, ReconciliationCount, WasteEvent reference Package across aggregates
    - polymorphic        # WasteEvent.source references PlantBatch or Package via source_type discriminator

  role_model: segregation_of_duties
  # A QALabUser who records a LabResult cannot also release the same Package from
  # hold; a Cultivator cannot self-record reconciliation counts they perform.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: License
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix; identity only."
      - name: license_number
        type: string
        source: input
        description: "State-issued license number, unique."
        constraints: "unique across all License; non-empty"
      - name: license_type
        type: enum
        source: input
        description: "Operating category that gates which operations are allowed."
        constraints: "one of {CULTIVATION, MANUFACTURING, RETAIL, TESTING, DISTRIBUTION}"
      - name: status
        type: enum
        source: system
        description: "Compliance status; gates all child operations under this license."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED, REVOKED}"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state of issuance."
        constraints: "two uppercase letters"
      - name: expires_on
        type: datetime
        source: input
        description: "License expiry date (ISO 8601 UTC)."
      - name: daily_purchase_limit_grams
        type: number
        source: input
        description: "State per-customer daily flower-equivalent purchase cap in grams (RETAIL only)."
        default: 28.5
        constraints: ">= 0; used only when license_type == RETAIL"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."

  - name: PlantBatch
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the CULTIVATION license owning this batch."
      - name: lot_tag
        type: string
        source: input
        description: "Unique METRC plant-lot tag string."
        constraints: "unique across all PlantBatch; non-empty"
      - name: strain
        type: string
        source: input
        description: "Cultivar / strain name."
      - name: status
        type: enum
        source: system
        description: "Cultivation lifecycle state."
        default: "IMMATURE"
        constraints: "one of {IMMATURE, VEGETATIVE, FLOWERING, HARVESTED, DESTROYED}"
      - name: plant_count
        type: integer
        source: input
        description: "Number of live plants in the batch."
        constraints: ">= 1 at creation"
      - name: live_plant_count
        type: integer
        source: computed
        description: "plant_count minus cumulative destroyed plants from WasteEvent rows on this batch."
      - name: planted_at
        type: datetime
        source: input
        description: "ISO 8601 UTC date the batch was planted."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."

  - name: Harvest
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: plant_batch_id
        type: string
        source: input
        description: "FK -> PlantBatch.id; the batch this harvest was cut from."
      - name: license_id
        type: string
        source: computed
        description: "FK -> License.id; copied from the source PlantBatch at harvest time."
      - name: harvest_name
        type: string
        source: input
        description: "Operator-assigned harvest group name."
      - name: status
        type: enum
        source: system
        description: "Drying/curing lifecycle state."
        default: "DRYING"
        constraints: "one of {DRYING, CURED, FINISHED}"
      - name: wet_weight_grams
        type: number
        source: input
        description: "Wet harvest weight in grams at cut."
        constraints: "> 0"
      - name: dry_weight_grams
        type: number
        source: input
        description: "Dry weight in grams recorded at CURED transition."
        constraints: "> 0 and <= wet_weight_grams when supplied"
      - name: packaged_weight_grams
        type: number
        source: computed
        description: "Cumulative dry grams pulled into Packages from this harvest."
        default: 0
      - name: remaining_weight_grams
        type: number
        source: computed
        description: "dry_weight_grams minus packaged_weight_grams minus harvest-level waste grams."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."

  - name: Package
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: harvest_id
        type: string
        source: input
        description: "FK -> Harvest.id; the harvest this package was pulled from."
      - name: license_id
        type: string
        source: computed
        description: "FK -> License.id; the license currently custodying the package (changes on transfer receipt)."
      - name: package_tag
        type: string
        source: input
        description: "Unique METRC package tag string."
        constraints: "unique across all Package; non-empty"
      - name: product_category
        type: enum
        source: input
        description: "Product form; drives flower-equivalent conversion in purchase-limit math."
        constraints: "one of {FLOWER, CONCENTRATE, EDIBLE}"
      - name: quantity_grams
        type: number
        source: input
        description: "Net product weight in grams at package creation."
        constraints: "> 0; cannot exceed source Harvest.remaining_weight_grams"
      - name: remaining_grams
        type: number
        source: computed
        description: "quantity_grams minus grams sold via SaleLine minus package-level waste grams."
      - name: status
        type: enum
        source: system
        description: "Package compliance/lifecycle state."
        default: "TESTING"
        constraints: "one of {TESTING, PASSED, FAILED, ON_HOLD, ACTIVE, IN_TRANSIT, DEPLETED, DESTROYED}"
      - name: lab_hold
        type: boolean
        source: computed
        description: "True while no PASS LabResult exists for this package; blocks sale and transfer-as-final."
        default: true
      - name: thc_pct
        type: number
        source: computed
        description: "Potency from the latest PASS LabResult; null until a PASS result exists."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."

  - name: LabResult
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix; append-only test record."
      - name: package_id
        type: string
        source: input
        description: "FK -> Package.id; the package under test."
      - name: testing_license_id
        type: string
        source: input
        description: "FK -> License.id; the TESTING-type lab license that recorded the result."
      - name: thc_pct
        type: number
        source: input
        description: "Total THC percentage measured."
        constraints: ">= 0 and <= 100"
      - name: pesticide_pass
        type: boolean
        source: input
        description: "True if pesticide screen is within limits."
      - name: overall_result
        type: enum
        source: computed
        description: "PASS only if pesticide_pass is true AND thc_pct <= POTENCY_CEILING_PCT; else FAIL."
        constraints: "one of {PASS, FAIL}"
      - name: tested_at
        type: datetime
        source: input
        description: "ISO 8601 UTC timestamp the sample was tested."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."

  - name: Manifest
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: origin_license_id
        type: string
        source: input
        description: "FK -> License.id; the shipping (DISTRIBUTION or CULTIVATION) license."
      - name: destination_license_id
        type: string
        source: input
        description: "FK -> License.id; the receiving license."
      - name: status
        type: enum
        source: system
        description: "Transfer manifest lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, IN_TRANSIT, RECEIVED, REJECTED, VOIDED}"
      - name: line_count
        type: integer
        source: computed
        description: "Count of ManifestLine rows attached to this manifest."
        default: 0
      - name: total_grams
        type: number
        source: computed
        description: "Sum of ManifestLine.grams across attached lines."
        default: 0
      - name: departed_at
        type: datetime
        source: system
        description: "Set when manifest transitions DRAFT -> IN_TRANSIT; null before."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."

  - name: ManifestLine
    parent: Manifest
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: manifest_id
        type: string
        source: input
        description: "FK -> Manifest.id; the manifest this line belongs to."
      - name: package_id
        type: string
        source: input
        description: "FK -> Package.id; the package being transferred on this line."
      - name: grams
        type: number
        source: input
        description: "Grams of the package allocated to this transfer line."
        constraints: "> 0 and <= Package.remaining_grams at attach time"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: medical_card_number
        type: string
        source: input
        description: "Patient medical card id; null for adult-use customers."
        default: null
      - name: is_medical
        type: boolean
        source: input
        description: "True if the customer is a medical patient (higher daily limit)."
        default: false
      - name: birthdate
        type: datetime
        source: input
        description: "ISO 8601 UTC date of birth for age verification."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: retail_license_id
        type: string
        source: input
        description: "FK -> License.id; the RETAIL license making the sale."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the purchaser."
      - name: sale_date
        type: datetime
        source: input
        description: "ISO 8601 UTC business date the sale is attributed to (drives daily-limit window)."
      - name: status
        type: enum
        source: system
        description: "Sale lifecycle state."
        default: "OPEN"
        constraints: "one of {OPEN, FINALIZED, VOIDED}"
      - name: flower_equiv_grams
        type: number
        source: computed
        description: "Sum of SaleLine flower-equivalent grams; compared against the customer daily limit at finalize."
        default: 0
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."

  - name: SaleLine
    parent: Sale
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: sale_id
        type: string
        source: input
        description: "FK -> Sale.id; the sale this line belongs to."
      - name: package_id
        type: string
        source: input
        description: "FK -> Package.id; the package dispensed from."
      - name: grams
        type: number
        source: input
        description: "Grams of product dispensed on this line."
        constraints: "> 0 and <= Package.remaining_grams at add time"
      - name: flower_equiv_grams
        type: number
        source: computed
        description: "grams multiplied by the product-category flower-equivalent factor."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."

  - name: ReconciliationCount
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix; append-only audit record."
      - name: package_id
        type: string
        source: input
        description: "FK -> Package.id; the package being physically counted."
      - name: counted_by_user_id
        type: string
        source: input
        description: "Opaque InventoryAuditor user id who performed the physical count."
      - name: counted_grams
        type: number
        source: input
        description: "Physically observed grams on hand."
        constraints: ">= 0"
      - name: expected_grams
        type: number
        source: computed
        description: "Snapshot of Package.remaining_grams at count time."
      - name: variance_grams
        type: number
        source: computed
        description: "counted_grams minus expected_grams; signed."
      - name: outcome
        type: enum
        source: computed
        description: "MATCH if |variance| <= tolerance, else DISCREPANCY (which puts the package ON_HOLD)."
        constraints: "one of {MATCH, DISCREPANCY}"
      - name: counted_at
        type: datetime
        source: input
        description: "ISO 8601 UTC timestamp of the count."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."

  - name: WasteEvent
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix; append-only destruction record."
      - name: source_type
        type: enum
        source: input
        description: "Discriminator for the polymorphic source being destroyed."
        constraints: "one of {PLANT_BATCH, PACKAGE}"
      - name: plant_batch_id
        type: string
        source: input
        description: "FK -> PlantBatch.id; set when source_type == PLANT_BATCH, else null."
        default: null
      - name: package_id
        type: string
        source: input
        description: "FK -> Package.id; set when source_type == PACKAGE, else null."
        default: null
      - name: reason
        type: enum
        source: input
        description: "Destruction reason code."
        constraints: "one of {MOLD, PEST, FAILED_TEST, EXPIRED, OTHER}"
      - name: destroyed_grams
        type: number
        source: input
        description: "Grams destroyed; required when source_type == PACKAGE."
        default: 0
        constraints: ">= 0; <= Package.remaining_grams when source is a package"
      - name: destroyed_plant_count
        type: integer
        source: input
        description: "Plants destroyed; required when source_type == PLANT_BATCH."
        default: 0
        constraints: ">= 0; <= PlantBatch.live_plant_count when source is a batch"
      - name: destroyed_at
        type: datetime
        source: input
        description: "ISO 8601 UTC timestamp of destruction."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: License
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /compliance/licenses/{id}/suspend"
        actor: StateRegulator
        preconditions: ["license.status == ACTIVE"]
        side_effects:
          - "increments License.version by 1"
          - "no child PlantBatch/Package mutations may proceed under this license while SUSPENDED (guarded by validations)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /compliance/licenses/{id}/reinstate"
        actor: StateRegulator
        preconditions: ["license.status == SUSPENDED", "license.expires_on is in the future relative to clock"]
        side_effects:
          - "increments License.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /compliance/licenses/{id}/revoke"
        actor: StateRegulator
        preconditions: ["license.status == ACTIVE"]
        side_effects:
          - "increments License.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /compliance/licenses/{id}/revoke"
        actor: StateRegulator
        preconditions: ["license.status == SUSPENDED"]
        side_effects:
          - "increments License.version by 1"

  - entity: PlantBatch
    initial_state: IMMATURE
    terminal_states: [DESTROYED]
    transitions:
      - from: IMMATURE
        to: VEGETATIVE
        trigger: "POST /compliance/plant-batches/{id}/advance"
        actor: Cultivator
        preconditions: ["batch.status == IMMATURE", "owning License.status == ACTIVE", "batch.live_plant_count >= 1"]
        side_effects: ["increments PlantBatch.version by 1"]
      - from: VEGETATIVE
        to: FLOWERING
        trigger: "POST /compliance/plant-batches/{id}/advance"
        actor: Cultivator
        preconditions: ["batch.status == VEGETATIVE", "owning License.status == ACTIVE", "batch.live_plant_count >= 1"]
        side_effects: ["increments PlantBatch.version by 1"]
      - from: FLOWERING
        to: HARVESTED
        trigger: "POST /compliance/harvests (creates a Harvest from this FLOWERING batch)"
        actor: Cultivator
        preconditions: ["batch.status == FLOWERING", "owning License.status == ACTIVE", "batch.live_plant_count >= 1"]
        side_effects:
          - "creates a Harvest in DRYING state with license_id copied from the batch"
          - "sets PlantBatch.status = HARVESTED"
          - "increments PlantBatch.version by 1"
      - from: IMMATURE
        to: DESTROYED
        trigger: "POST /compliance/waste-events (source_type=PLANT_BATCH destroying all live plants)"
        actor: Cultivator
        preconditions: ["destroyed_plant_count == batch.live_plant_count", "owning License.status == ACTIVE"]
        side_effects:
          - "decrements PlantBatch.live_plant_count to 0"
          - "sets PlantBatch.status = DESTROYED"
          - "increments PlantBatch.version by 1"
        note: "Same DESTROY transition is valid from VEGETATIVE and FLOWERING; only a full-batch waste event (destroyed_plant_count == live_plant_count) flips status to DESTROYED. A partial waste event only decrements live_plant_count."
      - from: VEGETATIVE
        to: DESTROYED
        trigger: "POST /compliance/waste-events (source_type=PLANT_BATCH destroying all live plants)"
        actor: Cultivator
        preconditions: ["destroyed_plant_count == batch.live_plant_count", "owning License.status == ACTIVE"]
        side_effects:
          - "decrements PlantBatch.live_plant_count to 0"
          - "sets PlantBatch.status = DESTROYED"
          - "increments PlantBatch.version by 1"
      - from: FLOWERING
        to: DESTROYED
        trigger: "POST /compliance/waste-events (source_type=PLANT_BATCH destroying all live plants)"
        actor: Cultivator
        preconditions: ["destroyed_plant_count == batch.live_plant_count", "owning License.status == ACTIVE"]
        side_effects:
          - "decrements PlantBatch.live_plant_count to 0"
          - "sets PlantBatch.status = DESTROYED"
          - "increments PlantBatch.version by 1"

  - entity: Harvest
    initial_state: DRYING
    terminal_states: [FINISHED]
    transitions:
      - from: DRYING
        to: CURED
        trigger: "POST /compliance/harvests/{id}/cure"
        actor: Cultivator
        preconditions: ["harvest.status == DRYING", "supplied dry_weight_grams > 0 and <= harvest.wet_weight_grams", "owning License.status == ACTIVE"]
        side_effects:
          - "sets Harvest.dry_weight_grams to the supplied value"
          - "recomputes Harvest.remaining_weight_grams = dry_weight_grams - packaged_weight_grams"
          - "increments Harvest.version by 1"
      - from: CURED
        to: FINISHED
        trigger: "POST /compliance/harvests/{id}/finish"
        actor: Cultivator
        preconditions: ["harvest.status == CURED", "harvest.remaining_weight_grams == 0", "owning License.status == ACTIVE", "harvest has >= 1 package"]
        side_effects: ["increments Harvest.version by 1"]
        note: "FINISHED is terminal; remaining_weight must be fully packaged to zero first."
      - from: CURED
        to: FINISHED
        trigger: "system: triggered by the last package of a fully-packaged harvest reaching a terminal status (DEPLETED via sale, or DESTROYED via FAILED_TEST waste)"
        actor: system
        preconditions: ["harvest.status == CURED", "harvest.remaining_weight_grams == 0", "every package of this harvest is in a terminal status (DEPLETED or DESTROYED)"]
        side_effects: ["sets Harvest.status = FINISHED", "increments Harvest.version by 1"]
        note: "Bubble-up auto-finish: harvest closes itself when its last live package terminalizes. This is hop 3 of the FAILED_TEST destroy cascade."

  - entity: Package
    initial_state: TESTING
    terminal_states: [DEPLETED, DESTROYED]
    transitions:
      - from: TESTING
        to: PASSED
        trigger: "POST /compliance/lab-results (overall_result == PASS for this package)"
        actor: QALabUser
        preconditions: ["package.status == TESTING", "LabResult.overall_result == PASS", "TESTING license is ACTIVE and not the custodying license"]
        side_effects:
          - "sets Package.status = PASSED"
          - "sets Package.lab_hold = false"
          - "sets Package.thc_pct from the LabResult.thc_pct"
          - "increments Package.version by 1"
      - from: TESTING
        to: FAILED
        trigger: "POST /compliance/lab-results (overall_result == FAIL for this package)"
        actor: QALabUser
        preconditions: ["package.status == TESTING", "LabResult.overall_result == FAIL"]
        side_effects:
          - "sets Package.status = FAILED"
          - "keeps Package.lab_hold = true"
          - "increments Package.version by 1"
        note: "Divergent branch from TESTING: PASS clears hold and sets thc_pct; FAIL keeps hold and clears nothing."
      - from: PASSED
        to: ACTIVE
        trigger: "POST /compliance/packages/{id}/release"
        actor: ComplianceManager
        preconditions: ["package.status == PASSED", "package.lab_hold == false", "release actor differs from the QALabUser who recorded the PASS LabResult (segregation of duties)"]
        side_effects:
          - "sets Package.status = ACTIVE"
          - "increments Package.version by 1"
      - from: FAILED
        to: DESTROYED
        trigger: "POST /compliance/waste-events (source_type=PACKAGE, reason=FAILED_TEST, destroying all remaining grams)"
        actor: ComplianceManager
        preconditions: ["package.status == FAILED", "destroyed_grams == package.remaining_grams"]
        side_effects:
          - "sets Package.remaining_grams = 0 (hop 1)"
          - "sets Package.status = DESTROYED (hop 2, caused by full destruction)"
          - "increments Package.version by 1"
          - "bubble-up (hop 3): if the source Harvest is CURED, its remaining_weight_grams == 0, and EVERY package of that harvest is now in a terminal status (DEPLETED or DESTROYED), the Harvest auto-transitions CURED -> FINISHED and Harvest.version increments by 1"
        note: "Depth-3 cascade: waste mutates Package (hop1) -> Package becomes DESTROYED (hop2, caused by full-destroy) -> Harvest auto-finishes if hop2 leaves the harvest fully terminal (hop3, caused by the DESTROYED transition). harvest_yield_reconciliation is NOT re-run here — package destruction never changes harvest.packaged_weight_grams or remaining_weight_grams."
      - from: ACTIVE
        to: IN_TRANSIT
        trigger: "POST /compliance/manifests/{id}/depart (package on a ManifestLine of this manifest)"
        actor: DistributionAgent
        preconditions: ["package.status == ACTIVE", "package.lab_hold == false", "manifest.status == DRAFT", "manifest has >= 1 ManifestLine"]
        side_effects:
          - "sets Package.status = IN_TRANSIT"
          - "increments Package.version by 1"
      - from: IN_TRANSIT
        to: ACTIVE
        trigger: "POST /compliance/manifests/{id}/receive (accept) — re-homes each line's package to destination license"
        actor: DistributionAgent
        preconditions: ["package.status == IN_TRANSIT", "manifest.status == IN_TRANSIT", "destination License.status == ACTIVE"]
        side_effects:
          - "sets Package.license_id = manifest.destination_license_id"
          - "sets Package.status = ACTIVE"
          - "increments Package.version by 1"
      - from: IN_TRANSIT
        to: ACTIVE
        trigger: "POST /compliance/manifests/{id}/receive (reject) — returns each line's package to origin custody"
        actor: DistributionAgent
        preconditions: ["package.status == IN_TRANSIT", "manifest.status == IN_TRANSIT"]
        side_effects:
          - "keeps Package.license_id = manifest.origin_license_id"
          - "sets Package.status = ACTIVE"
          - "increments Package.version by 1"
        note: "Reject branch leaves custody at origin; accept branch re-homes to destination. Divergent side-effect sets on the same from-state."
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /compliance/reconciliation-counts (outcome == DISCREPANCY for this package)"
        actor: InventoryAuditor
        preconditions: ["package.status == ACTIVE", "|counted_grams - remaining_grams| > RECON_TOLERANCE_GRAMS"]
        side_effects:
          - "sets Package.status = ON_HOLD"
          - "increments Package.version by 1"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /compliance/packages/{id}/clear-hold"
        actor: ComplianceManager
        preconditions: ["package.status == ON_HOLD", "clear actor differs from the InventoryAuditor whose DISCREPANCY count placed the hold (segregation of duties)"]
        side_effects:
          - "sets Package.status = ACTIVE"
          - "increments Package.version by 1"
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: SaleLine added that drives Package.remaining_grams to 0"
        actor: system
        preconditions: ["package.remaining_grams reaches exactly 0 after the SaleLine grams are deducted"]
        side_effects:
          - "sets Package.status = DEPLETED"
          - "increments Package.version by 1"
        note: "Auto-transition bubbled from the sale-line add side effect; DEPLETED is terminal."

  - entity: Manifest
    initial_state: DRAFT
    terminal_states: [RECEIVED, REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: IN_TRANSIT
        trigger: "POST /compliance/manifests/{id}/depart"
        actor: DistributionAgent
        preconditions:
          - "manifest.status == DRAFT"
          - "manifest has >= 1 ManifestLine"
          - "every line's Package.status == ACTIVE and lab_hold == false"
          - "origin License.status == ACTIVE"
          - "expected_manifest_version matches manifest.version"
        side_effects:
          - "sets Manifest.status = IN_TRANSIT"
          - "sets Manifest.departed_at to clock"
          - "sets each line's Package.status = IN_TRANSIT (cascade)"
          - "increments Manifest.version by 1"
      - from: IN_TRANSIT
        to: DRAFT
        trigger: "POST /compliance/manifests/{id}/recall"
        actor: DistributionAgent
        preconditions: ["manifest.status == IN_TRANSIT"]
        side_effects:
          - "sets Manifest.status = DRAFT"
          - "sets Manifest.departed_at = null"
          - "sets each line's Package.status back to ACTIVE (cascade)"
          - "increments Manifest.version by 1"
        note: "Cyclic revision loop: DRAFT -> IN_TRANSIT -> DRAFT lets a distributor recall and re-edit before receipt."
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /compliance/manifests/{id}/receive (accept)"
        actor: DistributionAgent
        preconditions: ["manifest.status == IN_TRANSIT", "destination License.status == ACTIVE"]
        side_effects:
          - "sets Manifest.status = RECEIVED"
          - "re-homes each line's Package.license_id to destination and sets each Package.status = ACTIVE (cascade)"
          - "increments Manifest.version by 1"
      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /compliance/manifests/{id}/receive (reject)"
        actor: DistributionAgent
        preconditions: ["manifest.status == IN_TRANSIT"]
        side_effects:
          - "sets Manifest.status = REJECTED"
          - "returns each line's Package to origin custody and sets each Package.status = ACTIVE (cascade)"
          - "increments Manifest.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /compliance/manifests/{id}/void"
        actor: ComplianceManager
        preconditions: ["manifest.status == DRAFT"]
        side_effects:
          - "sets Manifest.status = VOIDED"
          - "increments Manifest.version by 1"

  - entity: Sale
    initial_state: OPEN
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /compliance/sales/{id}/finalize"
        actor: Budtender
        preconditions:
          - "sale.status == OPEN"
          - "sale has >= 1 SaleLine"
          - "customer's cumulative flower_equiv_grams for sale_date (this sale + prior FINALIZED sales) <= customer daily limit"
          - "retail License.status == ACTIVE"
          - "expected_sale_version matches sale.version"
        side_effects:
          - "sets Sale.status = FINALIZED"
          - "decrements each line's Package.remaining_grams by the line grams (cascade)"
          - "auto-transitions any Package whose remaining_grams hits 0 to DEPLETED (cascade)"
          - "increments Sale.version by 1"
      - from: OPEN
        to: VOIDED
        trigger: "POST /compliance/sales/{id}/void"
        actor: Budtender
        preconditions: ["sale.status == OPEN"]
        side_effects:
          - "sets Sale.status = VOIDED"
          - "increments Sale.version by 1"
        note: "Voiding an OPEN sale releases no inventory because OPEN lines never decremented remaining_grams."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: manifest-depart-stale-version
    parent_entity: Manifest
    write_endpoint: "POST /compliance/manifests/{id}/depart"
    occ_field: "expected_manifest_version"
    description: |
      Departing a manifest whose version has advanced since the client last
      observed it is rejected. A prior writer may have attached or removed a
      ManifestLine (each line mutation bumps the manifest version), so the
      current writer's view of which packages will ship is stale; the depart
      is rejected on the version mismatch rather than shipping a stale line set.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: sale-finalize-stale-version
    parent_entity: Sale
    write_endpoint: "POST /compliance/sales/{id}/finalize"
    occ_field: "expected_sale_version"
    description: |
      Finalizing a sale whose version has advanced since the client last read
      it is rejected. Another writer may have added a SaleLine (bumping the
      sale version), changing the flower-equivalent total that the daily-limit
      check evaluates; finalize is rejected on the version mismatch so the
      limit is never checked against a stale line set.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: package_flower_equivalent
    trigger: "on POST /compliance/sales/{id}/lines (compute SaleLine.flower_equiv_grams) and re-aggregated into Sale.flower_equiv_grams"
    algorithm: weighted_scoring
    formula: |
      factor = FLOWER_EQUIV_FACTOR[package.product_category]
      line.flower_equiv_grams = round(line.grams * factor, 2)   # round per line
      sale.flower_equiv_grams = round(sum(round(l.grams * FLOWER_EQUIV_FACTOR[l.cat], 2)
                                          for l in sale.lines), 2)
    input_set: "All SaleLine rows of the sale, each weighted by its package product_category factor."
    constants:
      FLOWER_EQUIV_FACTOR_FLOWER: 1.0
      FLOWER_EQUIV_FACTOR_CONCENTRATE: 5.0
      FLOWER_EQUIV_FACTOR_EDIBLE: 0.1
    precision: "2 decimal places, round_half_up; rounding is applied PER LINE FIRST, then the rounded line values are summed (round-then-sum, NOT sum-then-round)."
    variants:
      - name: per_line_then_sum
        when: "always — this is the pinned order for Sale.flower_equiv_grams"
        difference: "Each line is rounded to 2dp before summing; summing raw products then rounding once can differ by a cent and is NOT used."

  - name: customer_daily_limit_check
    trigger: "on POST /compliance/sales/{id}/finalize"
    algorithm: aggregation
    formula: |
      window = sales S where S.customer_id == this.customer_id
                            and S.sale_date == this.sale_date
                            and S.status == FINALIZED
      prior = sum(S.flower_equiv_grams for S in window)         # excludes the current OPEN sale
      projected = round(prior + this.flower_equiv_grams, 2)
      limit = retail_license.daily_purchase_limit_grams
              * (MEDICAL_LIMIT_MULTIPLIER if customer.is_medical else 1)
      reject if projected > limit                               # strictly greater; projected == limit passes
    input_set: "Prior FINALIZED sales for the same customer and same sale_date, PLUS the current sale's flower_equiv_grams. OPEN and VOIDED sales are excluded."
    constants:
      MEDICAL_LIMIT_MULTIPLIER: 3
    precision: "2 decimal places, round_half_up; boundary is '> limit' rejects, '== limit' passes."
    variants:
      - name: adult_use
        when: "customer.is_medical == false"
        difference: "limit = daily_purchase_limit_grams * 1."
      - name: medical
        when: "customer.is_medical == true"
        difference: "limit = daily_purchase_limit_grams * MEDICAL_LIMIT_MULTIPLIER (3x)."

  - name: reconciliation_variance
    trigger: "on POST /compliance/reconciliation-counts"
    algorithm: threshold
    formula: |
      expected = package.remaining_grams                        # snapshot at count time
      variance = round(counted_grams - expected, 2)             # signed
      outcome  = MATCH if abs(variance) <= RECON_TOLERANCE_GRAMS else DISCREPANCY
      # DISCREPANCY drives Package ACTIVE -> ON_HOLD (cross-entity side effect)
    input_set: "A single Package's remaining_grams snapshot versus the physically counted grams."
    constants:
      RECON_TOLERANCE_GRAMS: 0.5
    precision: "2 decimal places, round_half_up; boundary is abs(variance) <= 0.5 is MATCH (inclusive), > 0.5 is DISCREPANCY."
    variants:
      - name: within_tolerance
        when: "abs(variance) <= RECON_TOLERANCE_GRAMS"
        difference: "outcome MATCH; package stays ACTIVE; no hold."
      - name: out_of_tolerance
        when: "abs(variance) > RECON_TOLERANCE_GRAMS"
        difference: "outcome DISCREPANCY; package moves ACTIVE -> ON_HOLD."

  - name: harvest_yield_reconciliation
    trigger: "recomputed on Package creation (NOT on package-level waste — package destruction does not change harvest remaining because those grams already left the bin at packaging)"
    algorithm: aggregation
    formula: |
      # packaged_weight_grams counts EVERY package ever pulled from the harvest,
      # at its original quantity_grams (which never changes), regardless of the
      # package's later status (TESTING/PASSED/ACTIVE/FAILED/DESTROYED/DEPLETED).
      # Package destruction or sale shrinks Package.remaining_grams, NOT the
      # harvest's packaged total — the grams left the bin when the package was cut.
      packaged = sum(P.quantity_grams for P in packages where P.harvest_id == harvest.id)
      harvest.packaged_weight_grams = round(packaged, 2)
      # remaining = un-packaged dry product still in the harvest bin.
      harvest.remaining_weight_grams = round(harvest.dry_weight_grams - packaged, 2)
    input_set: "All Packages pulled from the harvest, each at its immutable quantity_grams. Package-level WasteEvents do NOT enter this formula."
    constants:
      MIN_REMAINING_FOR_FINISH: 0
    precision: "2 decimal places, round_half_up; remaining_weight_grams is floored at 0 by the package-create insufficiency check (priority 11)."
    variants:
      - name: pre_cure_unknown
        when: "harvest.status == DRYING (dry_weight_grams not yet set)"
        difference: "remaining_weight_grams is null/undefined until CURE supplies dry_weight_grams; packaging is blocked before CURED."
      - name: post_cure_known
        when: "harvest.status IN {CURED, FINISHED}"
        difference: "remaining_weight_grams = dry_weight_grams - packaged (sum of immutable package quantities), fully defined and independent of package lifecycle."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET list/detail open reads"

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 5
    category: business_safety
    check: "Owning/operating License.status == ACTIVE for the operation (cultivation advance, harvest, package create, sale finalize, manifest depart)"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 403
    applies_to: "POST advance, POST harvests, POST packages, POST sales/{id}/finalize, POST manifests/{id}/depart"

  - priority: 6
    category: business_safety
    check: "License.license_type matches the operation (only CULTIVATION advances batches, only RETAIL finalizes sales, only TESTING records lab results)"
    error_id: ERR_LICENSE_TYPE_MISMATCH
    http_status: 403
    applies_to: "POST plant-batches, POST sales, POST lab-results, POST manifests"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the actor releasing a package differs from the QALabUser who recorded its PASS LabResult; the actor clearing a hold differs from the InventoryAuditor whose DISCREPANCY placed it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST packages/{id}/release, POST packages/{id}/clear-hold"

  - priority: 8
    category: business_safety
    check: "Package may be sold or transferred-as-final only when lab_hold == false (a PASS LabResult exists)"
    error_id: ERR_LAB_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST sales/{id}/lines, POST manifests/{id}/depart"

  - priority: 9
    category: business_referential
    check: "WasteEvent source discriminator matches supplied FK (PLANT_BATCH requires plant_batch_id and null package_id; PACKAGE requires package_id and null plant_batch_id)"
    error_id: ERR_SOURCE_DISCRIMINATOR_MISMATCH
    http_status: 422
    applies_to: "POST waste-events"

  - priority: 10
    category: business_constraint
    check: "lot_tag / package_tag / license_number uniqueness on create"
    error_id: ERR_DUPLICATE_TAG
    http_status: 409
    applies_to: "POST plant-batches, POST packages, POST licenses"

  - priority: 11
    category: business_constraint
    check: "Package quantity_grams at creation must not exceed source Harvest.remaining_weight_grams; SaleLine/ManifestLine grams must not exceed Package.remaining_grams"
    error_id: ERR_INSUFFICIENT_QUANTITY
    http_status: 409
    applies_to: "POST packages, POST sales/{id}/lines, POST manifests/{id}/lines"

  - priority: 12
    category: business_temporal
    check: "A package may appear on at most one ACTIVE (DRAFT or IN_TRANSIT) ManifestLine at a time; a second open-manifest attach for the same package is a transfer-window overlap"
    error_id: ERR_MANIFEST_OVERLAP
    http_status: 409
    applies_to: "POST manifests/{id}/lines"

  - priority: 13
    category: business_temporal
    check: "A customer may have at most one OPEN sale per retail license per sale_date; opening a second overlapping same-day sale window is rejected"
    error_id: ERR_SALE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST sales"

  - priority: 14
    category: business_fiscal
    check: "Finalizing a sale whose projected same-day flower-equivalent total exceeds the customer daily limit is rejected"
    error_id: ERR_DAILY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST sales/{id}/finalize"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the parent's current version on depart/finalize"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST manifests/{id}/depart, POST sales/{id}/finalize"

  - priority: 16
    category: business_constraint
    check: "Request body has all required fields, valid enums, and numeric ranges (grams > 0, plant_count >= 1, thc_pct in [0,100])"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH"

  # Rows 17-20 are catalog refinements; each states its evaluation-order rank
  # relative to the numbered tiers above (the integer is a stable index, not an
  # independent ordering, since each applies to a distinct endpoint/check).
  - priority: 17
    category: state
    check: "Child-creation requires the parent in the correct state: packaging requires Harvest.status == CURED; a SaleLine requires Sale.status == OPEN; a ManifestLine requires Manifest.status == DRAFT. Evaluated at the state tier (same rank as priority 4, before business checks)."
    error_id: ERR_INVALID_PARENT_STATE
    http_status: 409
    applies_to: "POST packages, POST sales/{id}/lines, POST manifests/{id}/lines"
  - priority: 18
    category: state
    check: "A FAILED_TEST package waste event must destroy the FULL remaining grams to terminalize a FAILED package to DESTROYED; a partial destroy on a FAILED package is rejected. Evaluated at the state tier."
    error_id: ERR_PARTIAL_DESTROY_NOT_TERMINAL
    http_status: 409
    applies_to: "POST waste-events"
  - priority: 19
    category: business_constraint
    check: "Weight ranges: cure dry_weight_grams <= wet_weight_grams; package-waste destroyed_grams <= Package.remaining_grams; batch-waste destroyed_plant_count <= PlantBatch.live_plant_count. Evaluated at the business-constraint tier."
    error_id: ERR_WEIGHT_RANGE
    http_status: 422
    applies_to: "POST harvests/{id}/cure, POST waste-events"
  - priority: 20
    category: business_safety
    check: "On finalize, the customer must be at least 21 years old (adult-use) at sale_date, computed from Customer.birthdate. Evaluated at the safety tier, before the fiscal daily-limit check."
    error_id: ERR_AGE_VERIFICATION_FAILED
    http_status: 422
    applies_to: "POST sales/{id}/finalize"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- License ----
  - method: POST
    path: "/compliance/licenses"
    description: "Register a state license."
    roles: [StateRegulator]
    code: 201
    input: [license_number, license_type, state_code, expires_on, "daily_purchase_limit_grams?"]
    output: License
    side_effects: ["License created in ACTIVE status with version 1"]
  - method: GET
    path: "/compliance/licenses"
    description: "List licenses (paginated; filter by license_type/status)."
    roles: [StateRegulator, ComplianceManager, DistributionAgent, Budtender, Cultivator, QALabUser, InventoryAuditor]
    code: 200
    input: ["license_type?", "status?", "limit?", "offset?"]
    output: License[]
    side_effects: []
  - method: GET
    path: "/compliance/licenses/{id}"
    description: "Get one license."
    roles: [StateRegulator, ComplianceManager, DistributionAgent, Budtender, Cultivator, QALabUser, InventoryAuditor]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: POST
    path: "/compliance/licenses/{id}/suspend"
    description: "Suspend a license (regulator)."
    roles: [StateRegulator]
    code: 200
    input: []
    output: License
    side_effects: ["License.status ACTIVE -> SUSPENDED", "increments License.version by 1"]
  - method: POST
    path: "/compliance/licenses/{id}/reinstate"
    description: "Reinstate a suspended license."
    roles: [StateRegulator]
    code: 200
    input: []
    output: License
    side_effects: ["License.status SUSPENDED -> ACTIVE", "increments License.version by 1"]
  - method: POST
    path: "/compliance/licenses/{id}/revoke"
    description: "Revoke a license (terminal)."
    roles: [StateRegulator]
    code: 200
    input: []
    output: License
    side_effects: ["License.status -> REVOKED", "increments License.version by 1"]

  # ---- Test-driving clock (outside public business surface) ----
  - method: POST
    path: "/compliance/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving endpoint; used for license-expiry and dated sale windows)."
    roles: [StateRegulator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to the supplied ISO 8601 instant"]

  # ---- PlantBatch ----
  - method: POST
    path: "/compliance/plant-batches"
    description: "Create an immature plant batch under a CULTIVATION license."
    roles: [Cultivator]
    code: 201
    input: [license_id, lot_tag, strain, plant_count, planted_at]
    output: PlantBatch
    side_effects: ["PlantBatch created in IMMATURE; live_plant_count = plant_count"]
  - method: GET
    path: "/compliance/plant-batches"
    description: "List plant batches; filter by license_id."
    roles: [Cultivator, ComplianceManager, StateRegulator, InventoryAuditor]
    code: 200
    input: ["license_id?", "status?", "limit?", "offset?"]
    output: PlantBatch[]
    side_effects: []
  - method: GET
    path: "/compliance/plant-batches/{id}"
    description: "Get one plant batch."
    roles: [Cultivator, ComplianceManager, StateRegulator, InventoryAuditor]
    code: 200
    input: []
    output: PlantBatch
    side_effects: []
  - method: POST
    path: "/compliance/plant-batches/{id}/advance"
    description: "Advance batch growth stage (IMMATURE->VEGETATIVE->FLOWERING)."
    roles: [Cultivator]
    code: 200
    input: []
    output: PlantBatch
    side_effects: ["PlantBatch.status advances one stage", "increments PlantBatch.version by 1"]

  # ---- Harvest ----
  - method: POST
    path: "/compliance/harvests"
    description: "Harvest a FLOWERING batch; creates Harvest and flips batch to HARVESTED."
    roles: [Cultivator]
    code: 201
    input: [plant_batch_id, harvest_name, wet_weight_grams]
    output: Harvest
    side_effects:
      - "Harvest created in DRYING; license_id copied from batch"
      - "source PlantBatch.status FLOWERING -> HARVESTED (cascade)"
      - "increments PlantBatch.version by 1"
  - method: GET
    path: "/compliance/harvests"
    description: "List harvests; filter by plant_batch_id or license_id."
    roles: [Cultivator, ComplianceManager, StateRegulator, InventoryAuditor]
    code: 200
    input: ["plant_batch_id?", "license_id?", "status?", "limit?", "offset?"]
    output: Harvest[]
    side_effects: []
  - method: GET
    path: "/compliance/harvests/{id}"
    description: "Get one harvest with computed remaining_weight_grams."
    roles: [Cultivator, ComplianceManager, StateRegulator, InventoryAuditor]
    code: 200
    input: []
    output: Harvest
    side_effects: []
  - method: POST
    path: "/compliance/harvests/{id}/cure"
    description: "Record dry weight; DRYING -> CURED."
    roles: [Cultivator]
    code: 200
    input: [dry_weight_grams]
    output: Harvest
    side_effects: ["sets dry_weight_grams", "recomputes remaining_weight_grams", "increments Harvest.version by 1"]
  - method: POST
    path: "/compliance/harvests/{id}/finish"
    description: "Close a fully-packaged harvest; CURED -> FINISHED."
    roles: [Cultivator]
    code: 200
    input: []
    output: Harvest
    side_effects: ["Harvest.status CURED -> FINISHED", "increments Harvest.version by 1"]

  # ---- Package ----
  - method: POST
    path: "/compliance/packages"
    description: "Pull a package from a CURED harvest; starts in TESTING with lab_hold true."
    roles: [Cultivator, ComplianceManager]
    code: 201
    input: [harvest_id, package_tag, product_category, quantity_grams]
    output: Package
    side_effects:
      - "Package created in TESTING; lab_hold = true; remaining_grams = quantity_grams"
      - "Harvest.packaged_weight_grams and remaining_weight_grams recomputed (cascade)"
      - "increments Harvest.version by 1"
  - method: GET
    path: "/compliance/packages"
    description: "List packages; filter by harvest_id or license_id or status."
    roles: [Cultivator, ComplianceManager, DistributionAgent, Budtender, QALabUser, InventoryAuditor, StateRegulator]
    code: 200
    input: ["harvest_id?", "license_id?", "status?", "limit?", "offset?"]
    output: Package[]
    side_effects: []
  - method: GET
    path: "/compliance/packages/{id}"
    description: "Get one package with computed remaining_grams, lab_hold, thc_pct."
    roles: [Cultivator, ComplianceManager, DistributionAgent, Budtender, QALabUser, InventoryAuditor, StateRegulator]
    code: 200
    input: []
    output: Package
    side_effects: []
  - method: GET
    path: "/compliance/packages/{id}/lab-results"
    description: "List the lab results recorded for a package (FK reverse-reachability for LabResult)."
    roles: [Cultivator, ComplianceManager, QALabUser, StateRegulator, InventoryAuditor]
    code: 200
    input: []
    output: LabResult[]
    side_effects: []
  - method: GET
    path: "/compliance/packages/{id}/reconciliation-counts"
    description: "List reconciliation counts recorded against a package (FK reverse-reachability)."
    roles: [ComplianceManager, InventoryAuditor, StateRegulator]
    code: 200
    input: []
    output: ReconciliationCount[]
    side_effects: []
  - method: GET
    path: "/compliance/packages/{id}/waste-events"
    description: "List package-source waste events for a package (FK reverse-reachability)."
    roles: [ComplianceManager, Cultivator, InventoryAuditor, StateRegulator]
    code: 200
    input: []
    output: WasteEvent[]
    side_effects: []
  - method: POST
    path: "/compliance/packages/{id}/release"
    description: "Release a PASSED package to ACTIVE inventory (segregation-of-duties enforced)."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: Package
    side_effects: ["Package.status PASSED -> ACTIVE", "increments Package.version by 1"]
  - method: POST
    path: "/compliance/packages/{id}/clear-hold"
    description: "Clear a reconciliation hold; ON_HOLD -> ACTIVE (segregation-of-duties enforced)."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: Package
    side_effects: ["Package.status ON_HOLD -> ACTIVE", "increments Package.version by 1"]

  # ---- LabResult ----
  - method: POST
    path: "/compliance/lab-results"
    description: "Record a potency/pesticide test result for a TESTING package; drives PASS/FAIL branch."
    roles: [QALabUser]
    code: 201
    input: [package_id, testing_license_id, thc_pct, pesticide_pass, tested_at]
    output: LabResult
    side_effects:
      - "computes overall_result (PASS/FAIL)"
      - "PASS: Package TESTING -> PASSED, lab_hold=false, thc_pct set (cascade)"
      - "FAIL: Package TESTING -> FAILED, lab_hold stays true (cascade)"
      - "increments Package.version by 1"
  - method: GET
    path: "/compliance/lab-results"
    description: "List lab results; filter by package_id or testing_license_id (FK reverse-reachability for LabResult -> License and LabResult -> Package)."
    roles: [QALabUser, ComplianceManager, StateRegulator]
    code: 200
    input: ["package_id?", "testing_license_id?", "limit?", "offset?"]
    output: LabResult[]
    side_effects: []
  - method: GET
    path: "/compliance/lab-results/{id}"
    description: "Get one lab result."
    roles: [QALabUser, ComplianceManager, StateRegulator]
    code: 200
    input: []
    output: LabResult
    side_effects: []

  # ---- Manifest + lines ----
  - method: POST
    path: "/compliance/manifests"
    description: "Create a transfer manifest between two licenses (DRAFT)."
    roles: [DistributionAgent]
    code: 201
    input: [origin_license_id, destination_license_id]
    output: Manifest
    side_effects: ["Manifest created in DRAFT; version 1"]
  - method: GET
    path: "/compliance/manifests"
    description: "List manifests; filter by origin/destination license and status."
    roles: [DistributionAgent, ComplianceManager, StateRegulator]
    code: 200
    input: ["origin_license_id?", "destination_license_id?", "status?", "limit?", "offset?"]
    output: Manifest[]
    side_effects: []
  - method: GET
    path: "/compliance/manifests/{id}"
    description: "Get one manifest with computed line_count and total_grams."
    roles: [DistributionAgent, ComplianceManager, StateRegulator]
    code: 200
    input: []
    output: Manifest
    side_effects: []
  - method: POST
    path: "/compliance/manifests/{id}/lines"
    description: "Attach a package to a DRAFT manifest (creates ManifestLine; bumps manifest version)."
    roles: [DistributionAgent]
    code: 201
    input: [package_id, grams]
    output: ManifestLine
    side_effects:
      - "ManifestLine created"
      - "recomputes Manifest.line_count and total_grams"
      - "increments Manifest.version by 1"
  - method: GET
    path: "/compliance/manifests/{id}/lines"
    description: "List the lines on a manifest (FK reverse-reachability for ManifestLine -> Manifest)."
    roles: [DistributionAgent, ComplianceManager, StateRegulator]
    code: 200
    input: []
    output: ManifestLine[]
    side_effects: []
  - method: GET
    path: "/compliance/packages/{id}/manifest-lines"
    description: "List the manifest lines that reference a package (FK reverse-reachability for ManifestLine -> Package)."
    roles: [DistributionAgent, ComplianceManager, StateRegulator]
    code: 200
    input: []
    output: ManifestLine[]
    side_effects: []
  - method: POST
    path: "/compliance/manifests/{id}/depart"
    description: "Depart a manifest (DRAFT -> IN_TRANSIT); cascades line packages to IN_TRANSIT (OCC-guarded)."
    roles: [DistributionAgent]
    code: 200
    input: [expected_manifest_version]
    output: Manifest
    side_effects:
      - "Manifest.status DRAFT -> IN_TRANSIT; departed_at set"
      - "each line Package.status ACTIVE -> IN_TRANSIT (cascade)"
      - "increments Manifest.version by 1"
  - method: POST
    path: "/compliance/manifests/{id}/recall"
    description: "Recall an in-transit manifest back to DRAFT; restores line packages to ACTIVE."
    roles: [DistributionAgent]
    code: 200
    input: []
    output: Manifest
    side_effects:
      - "Manifest.status IN_TRANSIT -> DRAFT; departed_at cleared"
      - "each line Package.status IN_TRANSIT -> ACTIVE (cascade)"
      - "increments Manifest.version by 1"
  - method: POST
    path: "/compliance/manifests/{id}/receive"
    description: "Receive an in-transit manifest; accept re-homes packages to destination, reject returns them to origin."
    roles: [DistributionAgent]
    code: 200
    input: [decision]
    output: Manifest
    side_effects:
      - "accept: Manifest -> RECEIVED; each Package.license_id = destination, status -> ACTIVE (cascade)"
      - "reject: Manifest -> REJECTED; each Package returned to origin, status -> ACTIVE (cascade)"
      - "increments Manifest.version by 1"
  - method: POST
    path: "/compliance/manifests/{id}/void"
    description: "Void a DRAFT manifest."
    roles: [ComplianceManager]
    code: 200
    input: []
    output: Manifest
    side_effects: ["Manifest.status DRAFT -> VOIDED", "increments Manifest.version by 1"]

  # ---- Customer ----
  - method: POST
    path: "/compliance/customers"
    description: "Register a retail customer/patient."
    roles: [Budtender, ComplianceManager]
    code: 201
    input: [birthdate, "is_medical?", "medical_card_number?"]
    output: Customer
    side_effects: ["Customer created"]
  - method: GET
    path: "/compliance/customers/{id}"
    description: "Get one customer."
    roles: [Budtender, ComplianceManager, StateRegulator]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Sale + lines ----
  - method: POST
    path: "/compliance/sales"
    description: "Open a retail sale for a customer on a sale_date (OPEN)."
    roles: [Budtender]
    code: 201
    input: [retail_license_id, customer_id, sale_date]
    output: Sale
    side_effects: ["Sale created in OPEN; flower_equiv_grams = 0"]
  - method: GET
    path: "/compliance/sales"
    description: "List sales; filter by retail_license_id, customer_id, sale_date, status."
    roles: [Budtender, ComplianceManager, StateRegulator]
    code: 200
    input: ["retail_license_id?", "customer_id?", "sale_date?", "status?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []
  - method: GET
    path: "/compliance/sales/{id}"
    description: "Get one sale with computed flower_equiv_grams."
    roles: [Budtender, ComplianceManager, StateRegulator]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/compliance/sales/{id}/lines"
    description: "Add a dispensing line to an OPEN sale (lab_hold + quantity checks); recomputes flower-equivalent."
    roles: [Budtender]
    code: 201
    input: [package_id, grams]
    output: SaleLine
    side_effects:
      - "SaleLine created; flower_equiv_grams computed per line"
      - "recomputes Sale.flower_equiv_grams"
      - "increments Sale.version by 1"
  - method: GET
    path: "/compliance/sales/{id}/lines"
    description: "List the lines on a sale (FK reverse-reachability for SaleLine -> Sale)."
    roles: [Budtender, ComplianceManager, StateRegulator]
    code: 200
    input: []
    output: SaleLine[]
    side_effects: []
  - method: GET
    path: "/compliance/packages/{id}/sale-lines"
    description: "List the sale lines that dispensed from a package (FK reverse-reachability for SaleLine -> Package)."
    roles: [Budtender, ComplianceManager, StateRegulator]
    code: 200
    input: []
    output: SaleLine[]
    side_effects: []
  - method: POST
    path: "/compliance/sales/{id}/finalize"
    description: "Finalize an OPEN sale (daily-limit check, OCC-guarded); decrements package inventory."
    roles: [Budtender]
    code: 200
    input: [expected_sale_version]
    output: Sale
    side_effects:
      - "daily-limit check; Sale.status OPEN -> FINALIZED"
      - "each line Package.remaining_grams decremented (cascade)"
      - "any Package hitting 0 grams auto-transitions ACTIVE -> DEPLETED (cascade)"
      - "increments Sale.version by 1"
  - method: POST
    path: "/compliance/sales/{id}/void"
    description: "Void an OPEN sale."
    roles: [Budtender]
    code: 200
    input: []
    output: Sale
    side_effects: ["Sale.status OPEN -> VOIDED", "increments Sale.version by 1"]

  # ---- ReconciliationCount ----
  - method: POST
    path: "/compliance/reconciliation-counts"
    description: "Record a physical inventory count of a package; DISCREPANCY puts the package ON_HOLD."
    roles: [InventoryAuditor]
    code: 201
    input: [package_id, counted_by_user_id, counted_grams, counted_at]
    output: ReconciliationCount
    side_effects:
      - "computes expected_grams snapshot, variance_grams, outcome"
      - "DISCREPANCY: Package ACTIVE -> ON_HOLD (cascade)"
      - "increments Package.version by 1 when a hold is placed"
  - method: GET
    path: "/compliance/reconciliation-counts"
    description: "List reconciliation counts; filter by package_id."
    roles: [InventoryAuditor, ComplianceManager, StateRegulator]
    code: 200
    input: ["package_id?", "outcome?", "limit?", "offset?"]
    output: ReconciliationCount[]
    side_effects: []

  # ---- WasteEvent ----
  - method: POST
    path: "/compliance/waste-events"
    description: "Record a destruction of plants or product (polymorphic source)."
    roles: [Cultivator, ComplianceManager]
    code: 201
    input: [source_type, reason, destroyed_at, "plant_batch_id?", "package_id?", "destroyed_grams?", "destroyed_plant_count?"]
    output: WasteEvent
    side_effects:
      - "PLANT_BATCH: decrements PlantBatch.live_plant_count; full destruction flips status to DESTROYED (cascade)"
      - "PACKAGE: decrements Package.remaining_grams; FAILED_TEST full destruction flips FAILED -> DESTROYED (cascade)"
      - "recomputes source Harvest remaining_weight_grams when source is a package (cascade)"
  - method: GET
    path: "/compliance/waste-events"
    description: "List waste events; filter by plant_batch_id or package_id (FK reverse-reachability for WasteEvent -> PlantBatch and WasteEvent -> Package)."
    roles: [Cultivator, ComplianceManager, InventoryAuditor, StateRegulator]
    code: 200
    input: ["source_type?", "plant_batch_id?", "package_id?", "reason?", "limit?", "offset?"]
    output: WasteEvent[]
    side_effects: []
  - method: GET
    path: "/compliance/plant-batches/{id}/waste-events"
    description: "List the waste events recorded against a plant batch (FK reverse-reachability for WasteEvent -> PlantBatch)."
    roles: [Cultivator, ComplianceManager, InventoryAuditor, StateRegulator]
    code: 200
    input: []
    output: WasteEvent[]
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing on a protected endpoint."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role not permitted to perform the operation per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or body FK references a resource that does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a valid state for the requested transition (e.g., advancing a HARVESTED batch, finalizing a FINALIZED sale, departing a non-DRAFT manifest)."
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 403
    condition: "The owning/operating license is SUSPENDED or REVOKED for an operation that requires ACTIVE."
  - id: ERR_LICENSE_TYPE_MISMATCH
    http: 403
    condition: "License.license_type does not match the operation (e.g., non-RETAIL finalizing a sale, non-TESTING recording a lab result, non-CULTIVATION harvesting)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Actor releasing a package is the same user who recorded its PASS lab result, or actor clearing a hold is the same auditor who placed it."
  - id: ERR_LAB_HOLD_ACTIVE
    http: 409
    condition: "Attempt to sell or transfer-depart a package while lab_hold is true (no PASS lab result)."
  - id: ERR_SOURCE_DISCRIMINATOR_MISMATCH
    http: 422
    condition: "WasteEvent source_type does not agree with the supplied plant_batch_id/package_id pair."
  - id: ERR_DUPLICATE_TAG
    http: 409
    condition: "lot_tag, package_tag, or license_number collides with an existing record."
  - id: ERR_INSUFFICIENT_QUANTITY
    http: 409
    condition: "Requested grams exceed the available source quantity (harvest remaining, package remaining)."
  - id: ERR_MANIFEST_OVERLAP
    http: 409
    condition: "Package is already on a line of another open (DRAFT or IN_TRANSIT) manifest."
  - id: ERR_SALE_WINDOW_OVERLAP
    http: 409
    condition: "Customer already has an OPEN sale at the same retail license for the same sale_date."
  - id: ERR_DAILY_LIMIT_EXCEEDED
    http: 409
    condition: "Projected same-day flower-equivalent purchase exceeds the customer's daily limit."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version on depart/finalize."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum, or out-of-range numeric (grams <= 0, plant_count < 1, thc_pct outside [0,100])."
  - id: ERR_INVALID_PARENT_STATE
    http: 409
    condition: "Creating a child under a parent in an incompatible state (packaging from a non-CURED harvest, attaching a sale line to a non-OPEN sale, attaching a manifest line to a non-DRAFT manifest)."
  - id: ERR_WEIGHT_RANGE
    http: 422
    condition: "Supplied dry_weight_grams exceeds wet_weight_grams, or destroyed_grams exceeds package remaining, or destroyed_plant_count exceeds live_plant_count."
  - id: ERR_AGE_VERIFICATION_FAILED
    http: 422
    condition: "Customer birthdate indicates age below the legal threshold for the sale_date."
  - id: ERR_PARTIAL_DESTROY_NOT_TERMINAL
    http: 409
    condition: "A package-source FAILED_TEST waste event must destroy the full remaining grams to flip a FAILED package to DESTROYED; a partial destroy is rejected for terminalization."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: StateRegulator
    description: "State authority that issues, suspends, reinstates, and revokes licenses."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/licenses"
      - "POST /compliance/licenses/{id}/suspend"
      - "POST /compliance/licenses/{id}/reinstate"
      - "POST /compliance/licenses/{id}/revoke"
    shared_operations:
      - "GET (read) on all compliance resources"

  - name: Cultivator
    description: "Operates a CULTIVATION license: plant batches, growth advancement, harvests, packaging, plant waste."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/plant-batches"
      - "POST /compliance/plant-batches/{id}/advance"
      - "POST /compliance/harvests"
      - "POST /compliance/harvests/{id}/cure"
      - "POST /compliance/harvests/{id}/finish"
    shared_operations:
      - "POST /compliance/packages (with ComplianceManager)"
      - "POST /compliance/waste-events (with ComplianceManager)"
      - "GET reads on cultivation/inventory resources"

  - name: QALabUser
    description: "Operates a TESTING license; records potency/pesticide lab results. Cannot release the packages it tests."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/lab-results"
    shared_operations:
      - "GET reads on packages and lab-results"

  - name: ComplianceManager
    description: "Releases passed packages, clears reconciliation holds, voids manifests, can package and record waste. Bound by segregation of duties versus QA and audit."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/packages/{id}/release"
      - "POST /compliance/packages/{id}/clear-hold"
      - "POST /compliance/manifests/{id}/void"
    shared_operations:
      - "POST /compliance/packages (with Cultivator)"
      - "POST /compliance/waste-events (with Cultivator)"
      - "POST /compliance/customers (with Budtender)"
      - "GET reads on all resources"

  - name: DistributionAgent
    description: "Operates a DISTRIBUTION license; builds and moves transfer manifests."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/manifests"
      - "POST /compliance/manifests/{id}/lines"
      - "POST /compliance/manifests/{id}/depart"
      - "POST /compliance/manifests/{id}/recall"
      - "POST /compliance/manifests/{id}/receive"
    shared_operations:
      - "GET reads on manifests and packages"

  - name: Budtender
    description: "Operates a RETAIL license; opens sales, adds dispensing lines, finalizes/voids sales, registers customers."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/sales"
      - "POST /compliance/sales/{id}/lines"
      - "POST /compliance/sales/{id}/finalize"
      - "POST /compliance/sales/{id}/void"
    shared_operations:
      - "POST /compliance/customers (with ComplianceManager)"
      - "GET reads on sales and customers"

  - name: InventoryAuditor
    description: "Performs physical inventory counts and reconciliation. Cannot clear a hold its own discrepancy placed."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/reconciliation-counts"
    shared_operations:
      - "GET reads on packages, reconciliation-counts, waste-events"
