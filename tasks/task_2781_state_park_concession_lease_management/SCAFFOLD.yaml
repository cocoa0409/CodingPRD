    side_effects: ["status SUBMITTED -> ACCEPTED", "remittance_received_cents persisted", "Lease.reported_receipts_ytd_cents, Lease.remitted_fee_ytd_cents and Lease.maintenance_reserve_balance_cents incremented", "increments GrossReceiptsReport.version by 1"]
  - method: POST
