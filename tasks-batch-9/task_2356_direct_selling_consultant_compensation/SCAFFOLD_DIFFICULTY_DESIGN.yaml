          - calculations.income_disclosure_distribution
          - entities.IncomeDisclosureStatement.fields.population_count
          - entities.IncomeDisclosureStatement.fields.median_earnings_cents
          - entities.IncomeDisclosureStatement.fields.top_decile_share_bp
          - entities.IncomeDisclosureStatement.fields.distribution_buckets
          - concurrency_rules[stale-run-version-on-disclosure-draft]
        distinguishing_aspect: |
          Entity domain = earnings-distribution statistics on IncomeDisclosureStatement, a
          different entity domain from the genealogy override payout of
          override_compression_dynamic_vs_static_divergence. Drafted from one PAID run, the
          two population bases disagree on population_count (3 vs 2), total (47500 vs 47000),
          median (23200 vs 23500), mean (15833 vs 23500) and top_decile_share_bp (5011 vs
          5064) because PAID_ONLY drops B's 500-cent carried-forward statement.
        test_recipe:
          setup:
            - "G1 fixture as in override_compression_dynamic_vs_static_divergence, period 2026-08 CLOSED."
            - "CommissionRun run1 CALCULATED under DYNAMIC, APPROVED by a second user, then PAID."
            - "Statement outcomes after pay: A 23800 PAID, C 23200 PAID, B 500 CARRIED_FORWARD (below min_payout_cents 2500)."
