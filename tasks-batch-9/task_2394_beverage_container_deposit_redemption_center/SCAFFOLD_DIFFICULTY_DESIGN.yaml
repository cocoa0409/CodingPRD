          assert:
            - "the first trigger response status is 409 and $.data.error_id == ERR_MACHINE_COOLDOWN_ACTIVE"
            - "immediately after the refused call: ReverseVendingMachine.${mach_id}.status == IDLE and ReverseVendingMachine.${mach_id}.session_started_at == null"
            - "immediately after the refused call: ReverseVendingMachine.${mach_id}.last_session_closed_at == 2026-08-05T09:10:00Z"
            - "after the 09:15:00Z call: ReverseVendingMachine.${mach_id}.status == COUNTING"
            - "after the 09:15:00Z call: ReverseVendingMachine.${mach_id}.session_started_at == 2026-08-05T09:15:00Z"
            - "after the 09:15:00Z call: ReverseVendingMachine.${mach_id}.open_session_count == 1"
            - "RedemptionVisit.${visit_id}.count_status == OPEN"
            - "ReverseVendingMachine.${mach_id}.jam_hold_count == 0"

      - name: program_period_closed_interval_shared_endpoint_overlap
        grounds:
          - validations[priority=29]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.ProgramPeriod.fields.start_date
          - entities.ProgramPeriod.fields.end_date
        distinguishing_aspect: |
          Two ProgramPeriod intervals may not share a single calendar date: a 2026-09-30 start
          against a stored 2026-07-01..2026-09-30 period is refused with ERR_PERIOD_OVERLAP even
          though only one day is common, while the zero-gap adjacent interval starting
          2026-10-01 is accepted — the reservation is a closed interval, not a half-open one.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z"
            - "One OPEN ProgramPeriod 2026Q3 spanning 2026-07-01..2026-09-30 and no other period"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q3", start_date: "2026-07-01", end_date: "2026-09-30", operating_cost_cents: 1000 }
              as: ProgramAdmin
              captures: { q3_id: $.data.id }
          trigger:
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q4", start_date: "2026-09-30", end_date: "2026-12-31", operating_cost_cents: 900 }
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q4", start_date: "2026-10-01", end_date: "2026-12-31", operating_cost_cents: 900 }
              as: ProgramAdmin
              captures: { q4_id: $.data.id }
          assert:
            - "the first trigger response status is 409 and $.data.error_id == ERR_PERIOD_OVERLAP"
            - "the second trigger response status is 201"
            - "ProgramPeriod.${q4_id}.status == OPEN"
            - "ProgramPeriod.${q4_id}.start_date == 2026-10-01"
            - "ProgramPeriod.${q4_id}.end_date == 2026-12-31"
            - "ProgramPeriod.${q4_id}.funding_status == UNSETTLED"
            - "ProgramPeriod.${q3_id}.end_date == 2026-09-30"
            - "GET /program-periods returns total_count 2"

  - rule_id: compensating_invariant
    instances:

      - name: payout_reversal_restores_program_deposit_liability
        grounds:
          - state_machines.RedemptionVisit.PAID_to_REVERSED
          - calculations.program_deposit_liability
          - entities.DepositLedgerEntry.fields.liability_after_cents
          - entities.RedemptionCenter.fields.cash_drawer_balance_cents
          - entities.ContainerLot.fields.reconciliation_flag
        distinguishing_aspect: |
          REVERSE undoes every side effect of PAY without deleting history: the drawer returns to
          50000, ProgramPeriod.outstanding_liability_cents returns to 3000 with
          redemptions_paid_cents 0 and containers_redeemed_count 0, the paid lot returns to
          paid_quantity 0 / UNPAID, and the account's containers_redeemed_today returns to 0 —
          the reversal is a new REDEMPTION_REVERSED ledger line, not an edit of the paid line.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; OPEN ProgramPeriod 2026Q3 with operating_cost_cents 1000"
            - "DEPOSIT_INITIATED line of 300 containers x 10 cents, so outstanding_liability_cents is 3000"
            - "OPERATIONAL center with opening_cash_cents 50000 and one PET_PLASTIC machine"
            - "One CENTER MACHINE_COUNT visit for an ACTIVE account, COUNTED with payable_count 220 and payout_cents 2200, APPROVED and PAID"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q3", start_date: "2026-07-01", end_date: "2026-09-30", operating_cost_cents: 1000 }
              as: ProgramAdmin
              captures: { period_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /distributors/${dist_id}/deposit-initiations"
              payload: { product_id: "${prod_id}", container_count: 300, period_id: "${period_id}" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
              captures: { mach_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001", bag_drop_enrolled: true }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "MACHINE_COUNT", center_id: "${center_id}", account_id: "${acct_id}", machine_id: "${mach_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { visit_id: $.data.id, visit_ver: $.data.version }
            - call: "POST /redemption-visits/${visit_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 220, out_of_state_marked_quantity: 0, contaminated_quantity: 0, expected_visit_version: "${visit_ver}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /redemption-visits/${visit_id}/close-count"
              payload: {}
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /redemption-visits/${visit_id}/payout-actions"
              payload: { action: "APPROVE" }
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /redemption-visits/${visit_id}/payout-actions"
              payload: { action: "PAY" }
              as: CenterOperator
              as_user_id: "${center_id}"
          trigger:
            - call: "POST /redemption-visits/${visit_id}/payout-actions"
              payload: { action: "REVERSE", reason: "duplicate payout discovered at the drawer count" }
              as: ProgramAdmin
          assert:
            - "before the trigger: RedemptionCenter.${center_id}.cash_drawer_balance_cents == 47800 and ProgramPeriod.${period_id}.outstanding_liability_cents == 800"
            - "RedemptionVisit.${visit_id}.payout_status == REVERSED"
            - "RedemptionVisit.${visit_id}.payable_count == 220"
            - "RedemptionVisit.${visit_id}.payout_cents == 2200"
            - "RedemptionCenter.${center_id}.cash_drawer_balance_cents == 50000"
            - "ProgramPeriod.${period_id}.outstanding_liability_cents == 3000"
            - "ProgramPeriod.${period_id}.redemptions_paid_cents == 0"
            - "ProgramPeriod.${period_id}.containers_redeemed_count == 0"
            - "ProgramPeriod.${period_id}.deposits_initiated_cents == 3000"
            - "ContainerLot.${lot_id}.paid_quantity == 0"
            - "ContainerLot.${lot_id}.reconciliation_flag == UNPAID"
            - "RedeemerAccount.${acct_id}.containers_redeemed_today == 0"
            - "RedeemerAccount.${acct_id}.cap_reached_today == false"
            - "GET /program-periods/${period_id}/ledger-entries returns total_count 3 with entry_type DEPOSIT_INITIATED liability_after_cents 3000, then REDEMPTION_PAID amount_cents -2200 liability_after_cents 800, then REDEMPTION_REVERSED amount_cents 2200 liability_after_cents 3000"

      - name: bag_drop_void_clawback_restores_account_balance
        grounds:
          - state_machines.BagDrop.DROPPED_to_VOIDED
          - calculations.bag_drop_credit_valuation
          - entities.AccountCreditEntry.fields.entry_type
          - entities.AccountCreditEntry.fields.balance_after_cents
          - entities.RedeemerAccount.fields.credit_balance_cents
        distinguishing_aspect: |
          VOID reverses the provisional credit exactly: a CLAWBACK line of -2000 cents brings
          RedeemerAccount.credit_balance_cents from 2000 back to 0 with balance_after_cents 0 on
          the new line, the PROVISIONAL line is left untouched, and the account becomes closeable
          because its balance is zero and no bag remains in DROPPED, COUNTED or DISPUTED.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; OPERATIONAL center; bag-drop-enrolled ACTIVE account"
            - "One BagDrop in status DROPPED with declared_count 300, provisional_credit_cents 2000, and credit_balance_cents 2000 on the account"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001", bag_drop_enrolled: true }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bag-drops"
              payload: { account_id: "${acct_id}", center_id: "${center_id}", tag_code: "BAG-1001", declared_count: 300 }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { bag_id: $.data.id }
          trigger:
            - call: "POST /bag-drops/${bag_id}/settlement-actions"
              payload: { action: "VOID", reason: "bag tag mismatch at the plant intake" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts/${acct_id}/status-changes"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
          assert:
            - "before the trigger: RedeemerAccount.${acct_id}.credit_balance_cents == 2000"
            - "BagDrop.${bag_id}.status == VOIDED"
            - "BagDrop.${bag_id}.provisional_units == 250"
            - "BagDrop.${bag_id}.provisional_credit_cents == 2000"
            - "BagDrop.${bag_id}.counted_total == 0"
            - "BagDrop.${bag_id}.settled_at == null"
            - "RedeemerAccount.${acct_id}.credit_balance_cents == 0"
            - "GET /redeemer-accounts/${acct_id}/credit-entries returns total_count 2 with entry_type PROVISIONAL amount_cents 2000 balance_after_cents 2000, then entry_type CLAWBACK amount_cents -2000 balance_after_cents 0"
            - "after the CLOSE call: RedeemerAccount.${acct_id}.status == CLOSED and RedeemerAccount.${acct_id}.bag_drop_enrolled == false"
