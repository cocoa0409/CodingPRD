      - name: credit_cap_is_checked_against_the_freshly_priced_lines
        claim_type: cascading_validation
        grounds:
          - validations[priority=37]
          - errors.ERR_CREDIT_EXCEEDS_CAP
          - calculations.change_order_upcharge
          - entities.Project.fields.quoted_labor_cents
          - endpoints[POST /change-orders]
          - endpoints[POST /change-orders/{id}/submit]
        distinguishing_aspect: "The cap check at priority 37 cannot run until the lines have been priced by the LINE_ITEMIZED variant: on a project quoted at 171020 the cap is -85510, so a -190.00-unit line priced at -85595 is rejected on submit while a -188.00-unit line priced at -84694 passes."
        test_recipe:
          setup:
            - "FLOOR-DIRECT 420.00-unit project in METRO-02 (multiplier 1.00), quoted_labor_cents 171020, so the credit cap is -round_half_up(171020 * 0.5) = -85510."
            - "The change order is created in DRAFT (creation prices the lines) and the cap is enforced when it is submitted."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, quoted: $.data.quoted_labor_cents, pv: $.data.version }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "CUSTOMER_REQUEST", lines: [{ unit_kind: "PRIMARY_UNITS", units_delta: -190.00 }], expected_project_version: "${pv}" }
              as: ProjectCoordinator
              captures: { co_id: $.data.id, up1: $.data.upcharge_cents, st1: $.data.status }
          trigger:
            - call: "POST /change-orders/${co_id}/submit"
              payload: {}
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /change-orders/${co_id}/submit"
              payload: { lines: [{ unit_kind: "PRIMARY_UNITS", units_delta: -188.00 }] }
              as: ProjectCoordinator
              captures: { up2: $.data.upcharge_cents, st2: $.data.status }
          assert:
            - "${quoted} == 171020 AND ${up1} == -85595 AND ${st1} == 'DRAFT' — creation prices the credit without enforcing the cap"
            - "${err} == 'ERR_CREDIT_EXCEEDS_CAP' with HTTP 409 — -85595 is below the -85510 cap"
            - "After the rejection, ChangeOrder.${co_id}.status == 'DRAFT' AND Project.${proj_id}.fulfillment_status == 'MEASURED' — the MEASURED -> CHANGE_PENDING side effect did not run"
            - "${up2} == -84694 AND ${st2} == 'PENDING_CUSTOMER' — -188.00 * 425 * 1.00 * 1.06 clears the cap, and the replacement lines are re-priced on submit"
            - "Project.${proj_id}.fulfillment_status == 'CHANGE_PENDING' after the accepted submit"

      - name: licence_failure_outranks_a_calendar_conflict
        claim_type: priority_conflict
        grounds:
          - validations[priority=17]
          - validations[priority=23]
          - errors.ERR_INSTALLER_NOT_LICENSED
          - errors.ERR_INSTALLER_WINDOW_CONFLICT
        distinguishing_aspect: "A single request that violates both the licence rule and the overlap rule must return the licence error, because 17 is evaluated before 23."
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / unlicensed_installer_with_overlapping_window_is_rejected_for_licence_first"
          rationale: "That instance builds exactly this doubly-invalid request, asserts ERR_INSTALLER_NOT_LICENSED, then repairs the credential and re-sends to observe ERR_INSTALLER_WINDOW_CONFLICT from the same payload — both halves of the priority-conflict claim."

  # ==========================================================================
  # SECTION — endpoints  (claim-extraction-guide Table 5)
