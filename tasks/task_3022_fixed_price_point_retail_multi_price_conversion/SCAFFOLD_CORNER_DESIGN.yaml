  # ===========================================================================
  - section: validations
    instances:

      - name: clock_endpoint_requires_the_platform_admin_role
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_INSUFFICIENT_ROLE
          - errors.ERR_MISSING_USER_CONTEXT
        distinguishing_aspect: "The two auth priorities fire in order: an absent header pair is a 401 ERR_MISSING_USER_CONTEXT, while a well-formed but non-PlatformAdmin role on the same endpoint is a 403 ERR_INSUFFICIENT_ROLE — the 401 is never returned for a request that has headers."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MerchandiseBuyer
              captures: { err_role: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ok_clock: $.data.current_utc }
          assert:
            - "the MerchandiseBuyer attempt returns 403 and err_role == ERR_INSUFFICIENT_ROLE"
            - "err_role != ERR_MISSING_USER_CONTEXT — the headers were present, so priority 1 passed and priority 2 decided"
            - "the PlatformAdmin attempt returns 200 and ok_clock == 2026-10-01T00:00:00Z"

      - name: required_field_omission_beats_state_precondition_on_landed_costs
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_ITEM_NOT_DENOMINATED
        distinguishing_aspect: "A request that is BOTH in the wrong shape and against an item in the wrong state is decided by priority 7 first: omitting applied_amount_cents entirely yields 400 ERR_INVALID_REQUEST even though the target item is DENOMINATED and would otherwise have produced the 409 ERR_ITEM_NOT_DENOMINATED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE price point at 125 cents, one import vendor, one DENOMINATED item that was never price-assigned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "1001", description: "Bath Bar 4ct", unit_retail_cents: 125, commodity_class: "BATH", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /merchandise/items/${item_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE" }
              as: MerchandiseBuyer
              captures: { err_shape: $.data.error_id }
            - call: "POST /merchandise/items/${item_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 105 }
              as: MerchandiseBuyer
              captures: { err_state: $.data.error_id }
          assert:
            - "the shape-broken request returns 400 and err_shape == ERR_INVALID_REQUEST"
            - "err_shape != ERR_ITEM_NOT_DENOMINATED — priority 7 short-circuited the priority 5 state check"
            - "the well-formed request returns 409 and err_state == ERR_ITEM_NOT_DENOMINATED — the DENOMINATED item is only reachable by price assignment first"
            - "Item.${item_id}.status == DENOMINATED and Item.${item_id}.landed_cost_cents == 0"
            - "GET /merchandise/items/${item_id}/landed-costs returns 0 rows"

      - name: duplicate_store_number_is_rejected_at_the_unique_key_priority
        claim_type: Violation To Error
        grounds:
          - validations[priority=8]
          - errors.ERR_DUPLICATE_SKU
          - endpoints.POST_/merchandise/stores
        distinguishing_aspect: "The four unique keys share one error id at priority 8, so a second store with a taken store_number is a 409 ERR_DUPLICATE_SKU — collision on a store's key, not on an item's key, still reports the same id."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One store numbered 1927."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 300.0 }
              as: StoreOperationsManager
              captures: { err_dup: $.data.error_id }
          assert:
            - "the duplicate returns 409 and err_dup == ERR_DUPLICATE_SKU"
            - "GET /merchandise/stores returns exactly 1 row — the duplicate never persisted"
            - "Store.${store_id}.shelf_facing_capacity_sqft == 400.0 — the second attempt did not overwrite the first"

      - name: release_units_above_the_line_allocation_is_rejected
        claim_type: Violation To Error
        grounds:
          - validations[priority=7]
          - errors.ERR_RELEASE_EXCEEDS_ALLOCATION
          - endpoints.POST_/merchandise/allocation-lines/{id}/release
        distinguishing_aspect: "Releasing exactly the remaining units passes while releasing one unit more is a 422 ERR_RELEASE_EXCEEDS_ALLOCATION, and the refused over-release leaves on_hand_units untouched — the aggregate check is on the line's remaining, not on the item's stock."
        test_recipe:
