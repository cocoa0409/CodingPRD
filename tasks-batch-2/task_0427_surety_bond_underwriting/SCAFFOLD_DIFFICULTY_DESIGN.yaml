            - call: "POST /surety/programs"
              payload: { name: "P15", single_limit_cents: 20000000, aggregate_limit_cents: 10000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
