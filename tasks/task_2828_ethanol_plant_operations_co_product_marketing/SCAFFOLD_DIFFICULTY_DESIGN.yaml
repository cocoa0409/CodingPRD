            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T06:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "GET /ethanol-ops/product-tanks/${t301_id}"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_v: $.data.version }
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-1", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${t301_v}", neat_gallons: 2565.00, denaturant_gallons: 60.00, window_start: "2026-09-04T08:00:00Z", window_end: "2026-09-04T12:00:00Z" }
