            - "The 23-hour attempt returns HTTP 409 with ${err_cool} == ERR_NOTIFICATION_COOLING_OFF"
            - "The 24-hour attempt returns HTTP 201"
            - "${n2_attempt} == 2"
            - "${n2_sent} == 2026-09-02T00:00:00.000Z"
            - "ConsigneeNotification.${n2_id}.delivery_state == SENT and ConsigneeNotification.${n2_id}.response_state == AWAITING"
            - "Consignee.${c1_id}.escalation_level == 1"
            - "GET /consignees/${c1_id}/notifications -> total_count == 2"

  - rule_id: compensating_invariant
    instances:
      - name: distribution_confirm_dispute_confirm_conserves_total_shipped_units
        grounds:
          - state_machines.DistributionRecord.CONFIRMED_to_DISPUTED
          - state_machines.DistributionRecord.DISPUTED_to_CONFIRMED
          - entities.DistributionRecord.fields.effective_quantity
          - entities.Recall.fields.total_shipped_units
        distinguishing_aspect: |
          Conserved quantity #1 is PHYSICAL UNITS, pinned as
          Recall.total_shipped_units == sum(DistributionRecord.effective_quantity over all rows of
          the recall). A CONFIRM -> DISPUTE -> CONFIRM round trip on one 600-unit line drives the
          ledger 1000 -> 400 -> 1000 with zero drift, even though reconcile_round has advanced to 3.
        test_recipe:
          setup:
            - "One Firm and one FDA Recall in DRAFT with two consignees."
            - "Two CONFIRMED distribution records of 600 and 400 units, so Recall.total_shipped_units is 1000."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "USDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id }
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Harbor Grocery", consignee_type: "RETAILER" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /recalls/${r_id}/distribution-records"
              payload: { consignee_id: "${c1_id}", lot_code: "L-88A", quantity_shipped: 600, ship_date: "2026-08-20T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /recalls/${r_id}/distribution-records"
              payload: { consignee_id: "${c2_id}", lot_code: "L-88A", quantity_shipped: 400, ship_date: "2026-08-21T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /distribution-records/${d1_id}/reconcile"
              payload: { outcome: "CONFIRM" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /distribution-records/${d2_id}/reconcile"
              payload: { outcome: "CONFIRM" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "GET /recalls/${r_id}"
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { total_before: $.data.total_shipped_units }
          trigger:
            - call: "POST /distribution-records/${d1_id}/reconcile"
              payload: { outcome: "DISPUTE" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "GET /recalls/${r_id}"
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { total_mid: $.data.total_shipped_units, quantity_pct_mid: $.data.quantity_effectiveness_pct }
            - call: "POST /distribution-records/${d1_id}/reconcile"
              payload: { outcome: "CONFIRM" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { d1_status: $.data.status, d1_eff: $.data.effective_quantity, d1_round: $.data.reconcile_round }
            - call: "GET /recalls/${r_id}"
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { total_after: $.data.total_shipped_units }
          assert:
            - "${total_before} == 1000"
            - "${total_mid} == 400"
            - "${quantity_pct_mid} == 0.00"
            - "${total_after} == 1000"
            - "${total_after} == ${total_before}"
            - "${d1_status} == CONFIRMED and ${d1_eff} == 600 and ${d1_round} == 3"
            - "DistributionRecord.${d1_id}.quantity_confirmed == null"

      - name: cost_accept_reject_roundtrip_conserves_loaded_cost_ledger
        grounds:
          - state_machines.CostEntry.PENDING_to_ACCEPTED
          - state_machines.CostEntry.ACCEPTED_to_REJECTED
          - calculations.recall_cost_accumulation
          - entities.Recall.fields.total_loaded_cost_cents
          - entities.Recall.fields.insurable_loaded_cost_cents
        distinguishing_aspect: |
          Conserved quantity #2 is MONEY IN CENTS, a different type from the unit invariant,
          pinned as Recall.total_loaded_cost_cents == sum(CostEntry.line_loaded_cost_cents over
          ACCEPTED rows). Accepting then rejecting a 40000-cent DESTRUCTION line drives the ledger
          158500 -> 204300 -> 158500 and the insurable ledger 108500 -> 154300 -> 108500, with the
          rejected line retaining its computed line_loaded_cost_cents of 45800.
        test_recipe:
          setup:
            - "One Firm and one FDA Recall in DRAFT."
            - "Two ACCEPTED cost entries: LOGISTICS 100000 cents (loaded 108500) and LEGAL 50000 cents (loaded 50000), giving total_loaded_cost_cents 158500 and insurable_loaded_cost_cents 108500."
            - "A third ACCEPTED cost entry: DESTRUCTION 40000 cents (loaded 45800), lifting the ledgers to 204300 and 154300."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "LOGISTICS", amount_cents: 100000, description: "Freight recovery" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce_log: $.data.id, ce_log_loaded: $.data.line_loaded_cost_cents }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "LEGAL", amount_cents: 50000, description: "Outside counsel" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce_leg: $.data.id, ce_leg_loaded: $.data.line_loaded_cost_cents, ce_leg_insurable: $.data.insurable }
            - call: "POST /cost-entries/${ce_log}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /cost-entries/${ce_leg}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "GET /recalls/${r_id}"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { total_before: $.data.total_loaded_cost_cents, insurable_before: $.data.insurable_loaded_cost_cents }
            - call: "POST /recalls/${r_id}/cost-entries"
              payload: { category: "DESTRUCTION", amount_cents: 40000, description: "Third-party incineration" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { ce_des: $.data.id, ce_des_loaded: $.data.line_loaded_cost_cents }
            - call: "POST /cost-entries/${ce_des}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "GET /recalls/${r_id}"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { total_peak: $.data.total_loaded_cost_cents, insurable_peak: $.data.insurable_loaded_cost_cents }
          trigger:
            - call: "POST /cost-entries/${ce_des}/adjudicate"
              payload: { decision: "REJECT", adjudication_note: "Certificate missing." }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { ce_des_status: $.data.status, ce_des_loaded_after: $.data.line_loaded_cost_cents }
            - call: "GET /recalls/${r_id}"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { total_after: $.data.total_loaded_cost_cents, insurable_after: $.data.insurable_loaded_cost_cents }
          assert:
            - "${ce_log_loaded} == 108500 and ${ce_leg_loaded} == 50000 and ${ce_leg_insurable} == false"
            - "${total_before} == 158500 and ${insurable_before} == 108500"
            - "${ce_des_loaded} == 45800"
            - "${total_peak} == 204300 and ${insurable_peak} == 154300"
            - "${ce_des_status} == REJECTED and ${ce_des_loaded_after} == 45800"
            - "${total_after} == 158500 and ${total_after} == ${total_before}"
            - "${insurable_after} == 108500 and ${insurable_after} == ${insurable_before}"
