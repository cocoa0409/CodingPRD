            - "AggregatorOrder.${o11_id}.status == ROUTED"

      - name: booking_buffer_inclusive_lower_bound
        grounds:
          - validations[priority=9]
          - calculations.order_prep_window
          - entities.Equipment.fields.turnaround_buffer_minutes
        distinguishing_aspect: |
          On a unit with turnaround_buffer_minutes 10 holding [100,150), a new booking starting at
          exactly 160 (= 150 + 10) is ACCEPTED (inclusive lower bound), reached via POST
          /equipment-bookings — a different metric (time-window adjacency) and endpoint than the
          grams threshold of instance 1.
