            - "${bic} == 25.00 because the clinician-weighted variant divides distinct_overriding 5 by distinct_fired 5 (ratio 1.0000) and normalises 5 clinicians against EXPECTED_CLINICIANS_PER_WINDOW 20 (volume 0.2500), while the fire-weighted ${bi} == 50.00 uses 25/50 == 0.5000 against 50 expected fires (volume 1.0000)"
