              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/confirm"
              payload: {}
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/booth-locations"
              payload: { host_business_name: "Grocer Co", address: "9 Main St", host_permission_granted: true }
              as: CouncilAdmin
              captures: { loc1: $.data.id }
            - call: "POST /cookie-program/booth-slots"
