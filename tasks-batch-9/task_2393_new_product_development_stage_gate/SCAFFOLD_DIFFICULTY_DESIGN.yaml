            - "ShelfResetWindow.${wins_id}.booked_slot_count == 1 because the rejected presentation released its slot before the second one took it"
            - "commercial_status re-entered SELL_IN_SCHEDULED after leaving it, so the dimension is cyclic rather than linear"

      - name: deliverable_reject_resubmit_revision_cycle
        grounds:
          - state_machines.Deliverable
          - entities.Deliverable.fields.submission_count
          - entities.Deliverable.fields.decided_by_user_id
        distinguishing_aspect: |
          Non-linearity on Deliverable is a resubmission loop rather than parallel dimensions:
          the row travels PENDING, SUBMITTED, REJECTED, SUBMITTED, APPROVED so SUBMITTED is
          occupied twice and submission_count settles at 2, while decided_by_user_id is cleared
          on re-entry and re-set on the second decision.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 with an empty required checklist so no auto-created row collides."
            - "One SNACK project in dev_status IDEA."
            - "A manually created MARKETING_LAUNCH_PLAN deliverable, submitted once and rejected."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 999, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { g2c_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Cycle Probe", brand: "SnackWorks", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              as_user_id: "lead-pc"
              captures: { pc_id: $.data.id }
            - call: "POST /innovation-projects/${pc_id}/deliverables"
              payload: { gate_id: "${g2c_id}", deliverable_type: "MARKETING_LAUNCH_PLAN", owner_function: "MARKETING", due_at: "2026-08-25T00:00:00Z" }
              as: InnovationLead
              captures: { dc_id: $.data.id }
            - call: "POST /deliverables/${dc_id}/submit"
              payload: { evidence_url: "https://npd.example/pc/launch-plan-v1" }
              as: FunctionalReviewer
              as_user_id: "sub-mkt"
            - call: "POST /deliverables/${dc_id}/decide"
              payload: { decision: "REJECT", comment: "Media plan missing" }
              as: FunctionalReviewer
              as_user_id: "rev-mkt"
            - call: "POST /deliverables/${dc_id}/submit"
              payload: { evidence_url: "https://npd.example/pc/launch-plan-v2" }
              as: FunctionalReviewer
              as_user_id: "sub-mkt"
          trigger:
            - call: "POST /deliverables/${dc_id}/decide"
              payload: { decision: "APPROVE", comment: "Media plan complete" }
              as: FunctionalReviewer
              as_user_id: "rev-mkt"
          assert:
            - "Deliverable.${dc_id}.status == APPROVED"
            - "Deliverable.${dc_id}.submission_count == 2, proving SUBMITTED was entered twice"
            - "Deliverable.${dc_id}.evidence_url == https://npd.example/pc/launch-plan-v2"
            - "Deliverable.${dc_id}.submitted_by_user_id == sub-mkt and Deliverable.${dc_id}.decided_by_user_id == rev-mkt"
            - "the row was REJECTED between the two SUBMITTED visits, so the machine is not forward-only"
            - "InnovationProject.${pc_id}.dev_status == IDEA, unchanged by the deliverable loop"

      - name: gate_review_veto_fork_divergent_project_outcomes
        grounds:
          - state_machines.GateReview.IN_SESSION_to_KILLED
          - state_machines.GateReview.IN_SESSION_to_RECYCLED
          - entities.StageGate.fields.veto_functions
          - entities.InnovationProject.fields.recycle_count
        distinguishing_aspect: |
          Non-linearity on GateReview is a branching fork out of one state: from IN_SESSION with
          identical vote_count 2 and exactly one REJECT vote each, the review forks to KILLED when
          the rejecting function is in veto_functions and to RECYCLED when it is not, and the two
          branches drive opposite project side effects (terminal KILLED versus a SCREENED self-loop
          with recycle_count 1).
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "A DAIRY gate 2 with quorum 2 and veto_functions [FINANCE]."
            - "Two DAIRY LINE_EXTENSION projects, both screened to dev_status SCREENED."
            - "Review A holds a FINANCE REJECT plus an OPERATIONS APPROVE and is already closed."
            - "Review B holds a MARKETING REJECT plus an OPERATIONS APPROVE and is still IN_SESSION."
