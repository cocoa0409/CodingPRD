            - "pledge_b_amt == 1 (one cent over creates a pledge of exactly one cent)"
            - "DrawRequest.${draw_a}.status == APPROVED and DrawRequest.${draw_b}.status == APPROVED (both approvals succeed; only the pledge side effect differs)"

      - name: expire_deadline_date_boundary
        grounds:
          - state_machines.Holdback.ACTIVE_to_EXPIRED
          - validations[priority=14]
          - errors[ERR_NOT_EXPIRED]
        distinguishing_aspect: |
          Date boundary at the expire endpoint: at clock date == effective_deadline_date
          (2026-09-15) expire is rejected (comparison is strictly-greater on the date), and
          at 2026-09-16 it succeeds — a one-day flip with equality on the deadline date
          being non-expiring. Distinct metric (calendar date) and endpoint (expire) from
          shortfall_threshold_exact_fit_vs_one_cent (cents, draw approve).
        test_recipe:
          setup:
            - "ACTIVE holdback, work_deadline_date 2026-09-15, no extensions, no bid selected (work never verified)"
            - "Clock parked at 2026-09-15T12:00:00Z"
          setup_api_calls:
