# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Retail Checking & Savings Account — Expert band
# 9 Difficulty Rules × 2 instances = 18 instances
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ach_posting_order_diverges_fee_total
        grounds:
          - calculations.ach_settlement_posting
          - state_machines.AchOrigination.STAGED_to_SETTLED
          - entities.AchOrigination.fields.posting_order
          - entities.Account.fields.ledger_balance_cents
        distinguishing_aspect: |
          Same debit legs (4000 then 7000 cents) settled against an identically-seeded
          debtor (available 5000, courtesy limit 6000): CHRONOLOGICAL yields one OVERDRAFT
          fee (3000) and debtor ledger -9000, while HIGH_TO_LOW yields one OVERDRAFT + one
          NSF fee (3000+3500=6500) and debtor ledger -8500 — a divergence on the AchOrigination
          domain, distinct from the Account/Transaction fee-tier variant below.
        test_recipe:
          setup:
            - "Two checking accounts A_chrono and A_h2l each with ledger 5000, courtesy_pay_opted_in=true, limit 6000."
            - "Two STAGED AchOriginations: O_chrono (posting_order CHRONOLOGICAL) and O_h2l (HIGH_TO_LOW), each debtor=its account, creditor a third account, each with DEBIT legs 4000 then 7000 (created in that order)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
              captures: { tier_code: $.data.code }
            # --- debtor A_chrono ---
            - call: "POST /customers"
              payload: { legal_name: "Chrono Owner", date_of_birth: "1990-01-01", tax_id_last4: "1111", country_of_residence: "US" }
              as: Teller
              captures: { cust_chrono: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_chrono}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_chrono: $.data.id }
            - call: "POST /applications/${app_chrono}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_chrono}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_chrono: $.data.opened_account_id }
            - call: "POST /accounts/${acct_chrono}/courtesy-pay"
              payload: { courtesy_pay_opted_in: true, courtesy_pay_limit_cents: 6000 }
              as: AccountHolder
              as_user_id: "${cust_chrono}"
            - call: "POST /accounts/${acct_chrono}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 5000 }
              as: AccountHolder
              as_user_id: "${cust_chrono}"
            # --- debtor A_h2l ---
            - call: "POST /customers"
              payload: { legal_name: "H2L Owner", date_of_birth: "1990-01-01", tax_id_last4: "2222", country_of_residence: "US" }
              as: Teller
              captures: { cust_h2l: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_h2l}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_h2l: $.data.id }
            - call: "POST /applications/${app_h2l}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_h2l}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_h2l: $.data.opened_account_id }
            - call: "POST /accounts/${acct_h2l}/courtesy-pay"
              payload: { courtesy_pay_opted_in: true, courtesy_pay_limit_cents: 6000 }
              as: AccountHolder
              as_user_id: "${cust_h2l}"
            - call: "POST /accounts/${acct_h2l}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 5000 }
              as: AccountHolder
              as_user_id: "${cust_h2l}"
            # --- creditor (shared) ---
            - call: "POST /customers"
              payload: { legal_name: "Creditor Owner", date_of_birth: "1990-01-01", tax_id_last4: "3333", country_of_residence: "US" }
              as: Teller
              captures: { cust_cr: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_cr}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_cr: $.data.id }
            - call: "POST /applications/${app_cr}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_cr}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_cr: $.data.opened_account_id }
            # --- batch O_chrono ---
            - call: "POST /ach-originations"
              payload: { debtor_account_id: "${acct_chrono}", creditor_account_id: "${acct_cr}", posting_order: "CHRONOLOGICAL" }
              as: ComplianceOfficer
              captures: { o_chrono: $.data.id, o_chrono_v: $.data.version }
            - call: "POST /ach-originations/${o_chrono}/legs"
              payload: { leg_role: "DEBIT", amount_cents: 4000, expected_ach_origination_version: "${o_chrono_v}" }
              as: ComplianceOfficer
              captures: { o_chrono_v2: $.data.version }
            - call: "POST /ach-originations/${o_chrono}/legs"
              payload: { leg_role: "DEBIT", amount_cents: 7000, expected_ach_origination_version: "${o_chrono_v2}" }
              as: ComplianceOfficer
              captures: { o_chrono_v3: $.data.version }
            # --- batch O_h2l ---
            - call: "POST /ach-originations"
              payload: { debtor_account_id: "${acct_h2l}", creditor_account_id: "${acct_cr}", posting_order: "HIGH_TO_LOW" }
              as: ComplianceOfficer
              captures: { o_h2l: $.data.id, o_h2l_v: $.data.version }
            - call: "POST /ach-originations/${o_h2l}/legs"
              payload: { leg_role: "DEBIT", amount_cents: 4000, expected_ach_origination_version: "${o_h2l_v}" }
              as: ComplianceOfficer
              captures: { o_h2l_v2: $.data.version }
            - call: "POST /ach-originations/${o_h2l}/legs"
              payload: { leg_role: "DEBIT", amount_cents: 7000, expected_ach_origination_version: "${o_h2l_v2}" }
              as: ComplianceOfficer
              captures: { o_h2l_v3: $.data.version }
          trigger:
            - call: "POST /ach-originations/${o_chrono}/settle"
              payload: { expected_ach_origination_version: "${o_chrono_v3}" }
              as: ComplianceOfficer
            - call: "POST /ach-originations/${o_h2l}/settle"
              payload: { expected_ach_origination_version: "${o_h2l_v3}" }
              as: ComplianceOfficer
          assert:
            - "GET /accounts/${acct_chrono} -> Account.ledger_balance_cents == -9000"
            - "GET /accounts/${acct_h2l} -> Account.ledger_balance_cents == -8500"
            - "sum of FeeAssessment.fee_amount_cents for acct_chrono == 3000 (one OVERDRAFT fee)"
            - "sum of FeeAssessment.fee_amount_cents for acct_h2l == 6500 (one OVERDRAFT 3000 + one NSF 3500)"

      - name: courtesy_pay_overdraft_vs_nsf_variant
        grounds:
          - calculations.overdraft_nsf_fee_tier
          - state_machines.Transaction.PENDING_to_POSTED
          - state_machines.Transaction.PENDING_to_RETURNED
          - entities.Account.fields.courtesy_pay_opted_in
        distinguishing_aspect: |
          The same 12000-cent debit against the same 10000-balance Account diverges purely on
          courtesy_pay_opted_in: opted-in -> overdraft_paid variant (txn POSTED, OVERDRAFT fee
          3000, ledger -5000); opted-out -> nsf_returned variant (txn RETURNED, NSF fee 3000,
          ledger unchanged at 10000). This dual-variant lives on the Account/Transaction domain,
          a different subject than the AchOrigination posting-order variant above.
        test_recipe:
          setup:
            - "Account A_in (courtesy opted in, limit 50000) and A_out (opted out) each ledger 10000."
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "In Owner", date_of_birth: "1990-01-01", tax_id_last4: "1212", country_of_residence: "US" }
              as: Teller
              captures: { c_in: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${c_in}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { a_in: $.data.id }
            - call: "POST /applications/${a_in}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${a_in}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_in: $.data.opened_account_id }
            - call: "POST /accounts/${acct_in}/courtesy-pay"
              payload: { courtesy_pay_opted_in: true, courtesy_pay_limit_cents: 50000 }
              as: AccountHolder
              as_user_id: "${c_in}"
            - call: "POST /accounts/${acct_in}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 10000 }
              as: AccountHolder
              as_user_id: "${c_in}"
            - call: "POST /customers"
              payload: { legal_name: "Out Owner", date_of_birth: "1990-01-01", tax_id_last4: "3434", country_of_residence: "US" }
              as: Teller
              captures: { c_out: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${c_out}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { a_out: $.data.id }
            - call: "POST /applications/${a_out}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${a_out}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_out: $.data.opened_account_id }
            - call: "POST /accounts/${acct_out}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 10000 }
              as: AccountHolder
              as_user_id: "${c_out}"
          trigger:
            - call: "POST /accounts/${acct_in}/transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 12000 }
              as: AccountHolder
              as_user_id: "${c_in}"
              captures: { txn_in: $.data.id, txn_in_status: $.data.status }
            - call: "POST /accounts/${acct_out}/transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 12000 }
              as: AccountHolder
              as_user_id: "${c_out}"
              captures: { txn_out: $.data.id, txn_out_status: $.data.status }
          assert:
            - "Transaction.${txn_in}.status == POSTED"
            - "GET /accounts/${acct_in} -> Account.ledger_balance_cents == -5000"
            - "FeeAssessment for acct_in has fee_type == OVERDRAFT and fee_amount_cents == 3000"
            - "Transaction.${txn_out}.status == RETURNED and return_reason_code == NSF"
            - "GET /accounts/${acct_out} -> Account.ledger_balance_cents == 7000 (item itself does not post; NSF fee of 3000 posts as a FEE debit: 10000 - 3000)"
            - "FeeAssessment for acct_out has fee_type == NSF and fee_amount_cents == 3000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: kyc_risk_score_multifactor_nonlinear
        grounds:
          - calculations.kyc_risk_scoring
          - state_machines.Application.DRAFT_to_SUBMITTED
          - entities.Customer.fields.country_of_residence
          - entities.Application.fields.kyc_risk_score
        distinguishing_aspect: |
          Mode (a): kyc_risk_score combines ≥3 inputs (non-US +40, sanctioned-last4 +50,
          prior-rejection count capped at 3 ×10) with a non-linear min() ceiling clamp at 100 —
          a non-US + sanctioned applicant scores 90, and a non-US + sanctioned + 5 prior
          rejections clamps to 100 (not 170). Distinct combinatorial mode from the interest
          rounding-order instance below.
        test_recipe:
          setup:
            - "A customer with country_of_residence GB and tax_id_last4 9999 (sanctioned) submitted on 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Risky Applicant", date_of_birth: "1985-06-01", tax_id_last4: "9999", country_of_residence: "GB" }
              as: Teller
              captures: { cust_r: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_r}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_r: $.data.id }
          trigger:
            - call: "POST /applications/${app_r}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
              captures: { score: $.data.kyc_risk_score }
          assert:
            - "Application.${app_r}.kyc_risk_score == 90"
            - "Application.${app_r}.status == SUBMITTED"

      - name: interest_accrual_truncate_after_full_product
        grounds:
          - calculations.interest_accrual_apy
          - entities.ApyTier.fields.annual_rate_bps
          - entities.InterestPosting.fields.posted_interest_cents
          - state_machines.Account.ACTIVE_to_DORMANT
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — interest = floor(ledger * bps / 10000
          * days / 365) truncates ONCE after the full multiplication, not per-factor. For
          ledger 1000000, 450 bps, 31 days the pinned single-truncation yields 3821 cents,
          whereas truncating intermediate products would drift. Distinct mode from the kyc
          multi-input formula above.
        test_recipe:
          setup:
            - "Savings account with ledger 1000000 on apy tier HY1 (450 bps)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "HY1", product_type: "SAVINGS", min_balance_cents: 0, annual_rate_bps: 450 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Saver One", date_of_birth: "1980-01-01", tax_id_last4: "1010", country_of_residence: "US" }
              as: Teller
              captures: { cust_s: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_s}", product_type: "SAVINGS", requested_apy_tier_code: "HY1" }
              as: Teller
              captures: { app_s: $.data.id }
            - call: "POST /applications/${app_s}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_s}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_s: $.data.opened_account_id }
            - call: "POST /accounts/${acct_s}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 1000000 }
              as: AccountHolder
              as_user_id: "${cust_s}"
          trigger:
            - call: "POST /accounts/${acct_s}/post-interest"
              payload: { period_start_date: "2026-01-01", period_end_date: "2026-02-01" }
              as: ComplianceOfficer
              captures: { posting_id: $.data.id, posted: $.data.posted_interest_cents }
          assert:
            - "InterestPosting.${posting_id}.posted_interest_cents == 3821"
            - "GET /accounts/${acct_s} -> Account.ledger_balance_cents == 1003821"
            - "GET /accounts/${acct_s} -> Account.accrued_interest_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_dormant_reactivation_cycle
        grounds:
          - state_machines.Account.ACTIVE_to_DORMANT
          - state_machines.Account.DORMANT_to_ACTIVE
          - entities.Account.fields.last_activity_date
        distinguishing_aspect: |
          Account exhibits a true cycle ACTIVE->DORMANT->ACTIVE: a dormancy scan after 365+
          inactive days flips ACTIVE->DORMANT, and a customer DEPOSIT flips DORMANT->ACTIVE
          and resets last_activity_date — a revert loop on the Account entity, a different
          entity than the Transaction branching machine below.
        test_recipe:
          setup:
            - "An ACTIVE checking account opened 2024-01-01 with a deposit on 2024-01-01, clock advanced past dormancy threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Sleepy Owner", date_of_birth: "1975-01-01", tax_id_last4: "2020", country_of_residence: "US" }
              as: Teller
              captures: { cust_d: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_d}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_d: $.data.id }
            - call: "POST /applications/${app_d}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_d}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_d: $.data.opened_account_id }
            - call: "POST /accounts/${acct_d}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 30000 }
              as: AccountHolder
              as_user_id: "${cust_d}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /accounts/${acct_d}/run-dormancy-scan"
              payload: {}
              as: ComplianceOfficer
              captures: { status_after_scan: $.data.status }
          trigger:
            - call: "POST /accounts/${acct_d}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${cust_d}"
              captures: { reactivation_txn: $.data.id }
          assert:
            - "Account.${acct_d}.status was DORMANT after the dormancy scan"
            - "GET /accounts/${acct_d} -> Account.status == ACTIVE"
            - "GET /accounts/${acct_d} -> Account.last_activity_date == 2025-06-01"
            - "GET /accounts/${acct_d} -> Account.ledger_balance_cents == 31000"

      - name: transaction_branch_posted_returned_stopped
        grounds:
          - state_machines.Transaction.PENDING_to_POSTED
          - state_machines.Transaction.PENDING_to_RETURNED
          - state_machines.Transaction.PENDING_to_STOPPED
          - entities.Transaction.fields.return_reason_code
        distinguishing_aspect: |
          The Transaction entity forks PENDING -> {POSTED, RETURNED, STOPPED} with divergent
          side-effect sets per branch (POSTED adjusts ledger; RETURNED stamps NSF + fee;
          STOPPED stamps STOP_PAYMENT + consumes a StopPayment, no fee). A check matching an
          ACTIVE stop is STOPPED, not POSTED — branching on a different entity than the Account
          cycle above.
        test_recipe:
          setup:
            - "Account with ledger 20000, opted out of courtesy pay, and an ACTIVE StopPayment on check 5001 with max_amount_cents 9000, expiring 2026-12-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Branch Owner", date_of_birth: "1988-01-01", tax_id_last4: "4040", country_of_residence: "US" }
              as: Teller
              captures: { cust_b: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_b}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_b: $.data.id }
            - call: "POST /applications/${app_b}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_b}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_b: $.data.opened_account_id }
            - call: "POST /accounts/${acct_b}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 20000 }
              as: AccountHolder
              as_user_id: "${cust_b}"
            - call: "POST /accounts/${acct_b}/stop-payments"
              payload: { check_number: "5001", max_amount_cents: 9000, expires_on: "2026-12-31" }
              as: AccountHolder
              as_user_id: "${cust_b}"
          trigger:
            - call: "POST /accounts/${acct_b}/transactions"
              payload: { txn_type: "CHECK_DEBIT", amount_cents: 8000, check_number: "5001" }
              as: AccountHolder
              as_user_id: "${cust_b}"
              captures: { stopped_txn: $.data.id, stopped_status: $.data.status }
          assert:
            - "Transaction.${stopped_txn}.status == STOPPED"
            - "Transaction.${stopped_txn}.return_reason_code == STOP_PAYMENT"
            - "GET /accounts/${acct_b} -> Account.ledger_balance_cents == 20000 (unchanged; stopped item never posts)"
            - "the StopPayment on check 5001 is now CONSUMED"
            - "no FeeAssessment exists for acct_b"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: approve_application_cascades_account_owner
        grounds:
          - state_machines.Application.SUBMITTED_to_APPROVED
          - entities.Account.fields.origin_application_id
          - entities.AccountOwner.fields.ownership_role
          - calculations.cip_status_derivation
        distinguishing_aspect: |
          Depth-3 cascade from APPROVE: approving the Application creates the Account
          (link 1), the Account's existence causes a PRIMARY AccountOwner to be created
          (link 2), and that owner's customer_id drives Customer.cip_status -> VERIFIED
          (link 3). Each link is caused by the prior link, not directly by the approve call,
          and originates from a different trigger than the escheat cascade below.
        test_recipe:
          setup:
            - "A SUBMITTED low-risk US application (score 0) ready for approval by a different officer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Clean Owner", date_of_birth: "1990-01-01", tax_id_last4: "1234", country_of_residence: "US" }
              as: Teller
              captures: { cust_c: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_c}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_c: $.data.id }
            - call: "POST /applications/${app_c}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
          trigger:
            - call: "POST /applications/${app_c}/approve"
              payload: {}
