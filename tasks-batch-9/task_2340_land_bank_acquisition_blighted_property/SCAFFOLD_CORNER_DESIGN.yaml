              captures: { order_id: $.data.id, est: $.data.estimated_cost_cents }
            - call: "GET /land-bank/funding-sources/${fs_id}"
              payload: {}
              as: CountyTreasurer
              as_user_id: "treas-1"
              captures: { comm: $.data.committed_cents, avail: $.data.available_cents, disb: $.data.disbursed_cents }
            - call: "GET /land-bank/inventory-summary?situs_ward=6"
              payload: { situs_ward: 6 }
              as: CountyTreasurer
              as_user_id: "treas-1"
