  - section: validations
    instances:
      - name: missing_role_header_is_unauthorized
        claim_type: "satisfaction_to_pass"
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "The auth rule at priority 1: a request with no X-User-Role is refused with ERR_UNAUTHORIZED rather than with a role-specific refusal."
        test_recipe:
          setup:
            - "no rows exist"
          setup_api_calls: []
          trigger:
            - call: "GET /api/appointments"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_UNAUTHORIZED with http status 401"
            - "the error body's response_type is error, per the fixed response envelope"
      - name: technician_cannot_book_an_appointment
        claim_type: "violation_to_error"
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The authorization rule at priority 2: booking is exclusive to the Dispatcher role, so a Technician is refused even though the payload is well formed."
        test_recipe:
          setup:
            - "one branch exists"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Technician
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_FORBIDDEN with http status 403, the authorization rule at priority 2"
            - "the identical payload as Dispatcher returns 201, so the refusal is on the role rather than the body"
      - name: dispatch_skill_gap_reports_no_eligible_technician
        claim_type: "violation_to_error"
        grounds: ["validations[priority=10]", "errors[ERR_NO_ELIGIBLE_TECHNICIAN]"]
        distinguishing_aspect: "The referential rule at priority 10: a PLUMBING-only roster cannot cover an HVAC appointment, and the venue the error surfaces from is dispatch rather than booking."
        test_recipe:
          setup:
            - "one branch, one PLUMBING-only technician, one published HVAC task, one appointment carrying that task"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["PLUMBING"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COMP", category: "HVAC", display_name: "Compressor Replacement", required_skill_code: "HVAC", estimated_hours: 3.0, flat_rate_cents: 300000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T12:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /api/appointments/${ap_id}/lines"
              payload: { pricebook_task_code: "HVAC-COMP" }
              as: Dispatcher
          trigger:
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_NO_ELIGIBLE_TECHNICIAN (422)"
            - "Appointment.${ap_id}.technician_id is still null and dispatch_status is still UNASSIGNED"
            - "adding a second technician who holds HVAC makes the identical trigger return 201"
      - name: over_collection_on_membership_payment
        claim_type: "violation_to_error"
        grounds: ["validations[priority=18]", "errors[ERR_OVER_COLLECTION]"]
        distinguishing_aspect: "The fiscal rule at priority 18: a payment that would push collected amounts past the annual price is refused, including the exact-boundary case that is admitted."
        test_recipe:
          setup:
            - "one branch, one published plan priced 100000 cents, one activated agreement holding 30000 cents"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/membership-plans"
              payload: { name: "Comfort Club", annual_price_cents: 100000, included_service_visit_count: 4, maintenance_visit_interval_days: 30, included_labor_discount_pct: 0.10, status: "PUBLISHED" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/membership-agreements"
              payload: { membership_plan_id: "${plan_id}", branch_id: "${br_id}", homeowner_name: "Ada", homeowner_postal_code: "78701", term_months: 12 }
              as: Technician
              captures: { ag_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/payments"
              payload: { amount_cents: 30000 }
              as: Dispatcher
          trigger:
            - call: "POST /api/membership-agreements/${ag_id}/payments"
              payload: { amount_cents: 80000 }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_OVER_COLLECTION (422), because 30000 plus 80000 exceeds the 100000-cent annual price"
            - "a payment of exactly 70000 succeeds, leaving collected_amount_cents at 100000, so the boundary is inclusive"
            - "MembershipAgreement.${ag_id}.unearned_revenue_balance_cents is unaffected by the refused call"
      - name: override_ceiling_on_manager_decision
        claim_type: "violation_to_error"
        grounds: ["validations[priority=16]", "calculations.discount_floor_check", "errors[ERR_OVERRIDE_EXCEEDS_LIMIT]"]
        distinguishing_aspect: "The fiscal rule at priority 16: the ceiling is recomputed from the appointment's labour base, so a 150000-cent request against a 100000-cent base is refused at decision time rather than at filing time."
