        distinguishing_aspect: "The ops-run epoch cascades three levels: program OPEN -> CLOSED at/past close_at, its DRAFT applications -> EXPIRED, and their SCHEDULED reminders -> SUPPRESSED; a SUBMITTED application is untouched."
