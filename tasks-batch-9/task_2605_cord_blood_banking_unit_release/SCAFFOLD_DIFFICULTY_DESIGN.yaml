            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_b1_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL" }
              as: CollectionSite
