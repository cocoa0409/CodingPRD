  - rule_id: compensating_invariant
    instances:
      - name: paired_folio_adjustments_restore_the_final_folio_total_exactly
        conserved_quantity: "Booking folio money: folio_adjustment_total_cents, final_folio_total_cents and folio_balance_cents"
        grounds:
          - calculations.folio_settlement_amount
          - entities.Booking.fields.folio_adjustment_total_cents
          - entities.Booking.fields.folio_balance_cents
          - concurrency_rules[folio-adjustment-stale-booking]
          - endpoints[POST /bookings/{bookingId}/folio-adjustments]
        distinguishing_aspect: |
          A checked-out folio is charged 50000 cents and then credited 50000 cents. Because the
          gratuity base deliberately excludes adjustments (step 6 of the waterfall), the pair must
          return final_folio_total_cents to exactly its pre-adjustment 1485255 and folio_balance_cents
          to exactly 0 — no gratuity recomputation, no rounding residue, no drift. Each adjustment
          carries the booking version read immediately before it, so the second post also proves the
          version advanced by the first.
        test_recipe:
          setup:
            - "IN_SEASON season, cabin, party of Ann/Ben/Cal on a confirmed 7-night booking with a 377607-cent deposit"
            - "the party checks in on 2026-10-11, books no activities, and checks out on 2026-10-18 settling 1107648 cents, giving final_folio_total_cents 1485255 and folio_balance_cents 0"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "IN_SEASON" }
              as: RanchManager
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ben Adult", birth_date: "1983-07-11", weight_lb: 190 }
              as: ReservationsAgent
              captures: { g_a2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cal Child", birth_date: "2016-05-20", weight_lb: 95 }
              as: ReservationsAgent
              captures: { g_c1: $.data.id }
            - call: "POST /bookings"
              payload: { season_id: "${season_id}", cabin_id: "${cabin_id}", lead_guest_id: "${g_a1}", package_tier_code: "CLASSIC", arrival_date: "2026-10-11", departure_date: "2026-10-18", party_members: [{ guest_id: "${g_a1}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_a2}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_c1}", member_type: "CHILD", dietary_restrictions: ["NONE"] }] }
              as: ReservationsAgent
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 377607 }
              as: ReservationsAgent
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: ReservationsAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-11T16:00:00Z" }
              as: RanchManager
            - call: "POST /bookings/${booking_id}/check-in"
              payload: { dietary_briefing_ack: true }
              as: ReservationsAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-18T10:00:00Z" }
              as: RanchManager
            - call: "POST /bookings/${booking_id}/check-out"
              payload: { settle_payment_cents: 1107648 }
              as: ReservationsAgent
              captures: { total_before: $.data.final_folio_total_cents, gratuity_before: $.data.gratuity_cents }
            - call: "GET /bookings/${booking_id}"
              payload: {}
              as: RanchManager
              captures: { bv1: $.data.version }
          trigger:
            - call: "POST /bookings/${booking_id}/folio-adjustments"
              payload: { amount_cents: 50000, memo: "broken tack repair charged to the folio", expected_booking_version: "${bv1}" }
              as: RanchManager
              captures: { total_after_charge: $.data.final_folio_total_cents, adj_after_charge: $.data.folio_adjustment_total_cents, balance_after_charge: $.data.folio_balance_cents }
            - call: "GET /bookings/${booking_id}"
              payload: {}
              as: RanchManager
              captures: { bv2: $.data.version }
            - call: "POST /bookings/${booking_id}/folio-adjustments"
              payload: { amount_cents: -50000, memo: "tack damage waived, charge reversed", expected_booking_version: "${bv2}" }
              as: RanchManager
          assert:
            - "${total_before} == 1485255"
            - "${gratuity_before} == 226564"
            - "${adj_after_charge} == 50000"
            - "${total_after_charge} == 1535255"
            - "${balance_after_charge} == 50000"
            - "Booking.${booking_id}.folio_adjustment_total_cents == 0"
            - "Booking.${booking_id}.final_folio_total_cents == 1485255"
            - "Booking.${booking_id}.folio_balance_cents == 0"
            - "Booking.${booking_id}.gratuity_cents == 226564"
            - "${bv2} == ${bv1} + 1"

      - name: mount_release_returns_the_horses_scheduled_hours_to_zero
        conserved_quantity: "Horse resource hours: Horse.scheduled_load_hours and the slot's mount_assigned_count"
        grounds:
          - calculations.horse_load_index
          - state_machines.ActivityReservation.mount_status.ASSIGNED_to_RELEASED
          - entities.Horse.fields.scheduled_load_hours
          - entities.ActivitySlot.fields.mount_assigned_count
          - endpoints[POST /activity-reservations/{reservationId}/mount-release]
        distinguishing_aspect: |
          A different conserved quantity from the folio pair — scheduled animal-duty hours rather
          than money. Assigning Comet to a 2.0-hour ride raises scheduled_load_hours from 0.0 to
          2.0 and the slot's mount_assigned_count from 0 to 1; releasing the mount must return both
          to exactly 0.0 and 0 while leaving confirmed_rider_count at 1 and realized_load_hours at
          0.0, and it must bump mount_release_count to 1 rather than silently discarding the event.
