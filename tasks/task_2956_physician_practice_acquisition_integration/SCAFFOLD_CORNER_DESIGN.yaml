              as: DealLead
              as_user_id: "dl-1"
              captures: { lease_item_id: "$.data.id" }
            - call: "POST /liability-items"
              payload: { acquisition_id: "${acq_id}", category: "UNPAID_PTO", description: "Accrued but untaken staff PTO at close.", estimated_amount_cents: 400000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { pto_item_id: "$.data.id" }
            - call: "POST /liability-items/${lease_item_id}/disposition"
              payload: { target_disposition: "ESCROWED", disposition_note: "Held against the escrow." }
              as: DealLead
              as_user_id: "dl-1"
          trigger:
            - call: "GET /liability-items"
              payload: { acquisition_id: "${acq_id}", disposition: "ESCROWED" }
