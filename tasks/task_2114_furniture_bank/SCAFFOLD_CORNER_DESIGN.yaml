  # =========================================================================
  - section: errors
    instances:

      - name: corner_truck_capacity_exceeded_at_dispatch
        claim_type: Violation to Error
        grounds: ["validations[priority=25]", "errors[ERR_TRUCK_CAPACITY_EXCEEDED]", "calculations.run_load_and_crew_feasibility"]
        distinguishing_aspect: "A CREWED run whose load_cubic_feet is 55.0 against a truck capacity of 40.0 answers ERR_TRUCK_CAPACITY_EXCEEDED 422, and no unit is staged."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "Truck BOX-54 with capacity_cubic_feet 40.0 and crew_minimum 1."
            - "An APPROVED referral's Voucher for one BED (30.0 cf) and one DRESSER (25.0 cf) is fully allocated, so the run's load is 55.0."
            - "The voucher is the run's only stop and a certified DRIVER has confirmed, so the run is CREWED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Underhill Relief Board", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED", "DRESSER"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /vouchers"
              payload: { referral_id: "${ref_id}", lines: [ { category: "BED", quantity_requested: 1, min_condition: "B" }, { category: "DRESSER", quantity_requested: 1, min_condition: "B" } ] }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { v_id: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /trucks"
              payload: { label: "BOX-54", capacity_cubic_feet: 40.0, home_county: "CENTRAL", crew_minimum: 1 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /donation-offers"
              payload: { donor_name: "Freya Osborne", donor_phone: "555-0821", pickup_county: "CENTRAL", pickup_window_start: "2026-08-04T10:00:00Z", pickup_window_end: "2026-08-04T12:00:00Z", items: [ { category: "BED", declared_condition: "B", soft_surface: false, cubic_feet: 30.0 }, { category: "DRESSER", declared_condition: "B", soft_surface: false, cubic_feet: 25.0 } ] }
              as: IntakeCoordinator
              captures: { off_id: "$.data.id" }
            - call: "POST /donation-offers/${off_id}/triage"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /donation-offers/${off_id}/schedule-pickup"
              payload: { truck_id: "${tr_id}" }
              as: IntakeCoordinator
            - call: "GET /donation-offers/${off_id}/items"
              payload: {}
              as: WarehouseLead
              captures: { i1: "$.data[0].id", i2: "$.data[1].id" }
            - call: "POST /donation-offers/${off_id}/intake"
              payload: { inspections: [ { item_id: "${i1}", graded_condition: "B", live_pest_observed: false }, { item_id: "${i2}", graded_condition: "B", live_pest_observed: false } ] }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
            - call: "POST /vouchers/${v_id}/allocate"
              payload: { expected_voucher_version: "${v_ver}" }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
            - call: "POST /volunteers"
              payload: { name: "Gil Baptiste", county: "CENTRAL", lift_certified: true }
              as: PlatformAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /delivery-runs"
              payload: { truck_id: "${tr_id}", service_date: "2026-08-05", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T17:00:00Z", county: "CENTRAL" }
              as: DispatchPlanner
              captures: { run_id: "$.data.id", run_ver: "$.data.version" }
            - call: "POST /delivery-runs/${run_id}/stops"
              payload: { voucher_id: "${v_id}", sequence: 1, expected_run_version: "${run_ver}" }
              as: DispatchPlanner
              captures: { stop_id: "$.data.id" }
            - call: "POST /delivery-runs/${run_id}/crew"
