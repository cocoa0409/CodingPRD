              payload: {}
              as: EditorInChief
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-10-14" }
              as: ManagingEditor
              captures: { i1: $.data.id }
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 2, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-12-02" }
              as: ManagingEditor
              captures: { i2: $.data.id }
          trigger:
            - call: "POST /comics/issues/${i2}/release-windows"
              payload: { channel: "DIGITAL", release_date: "2026-12-31", expected_net_receipts_cents: 56000 }
              as: SalesDirector
            - call: "POST /comics/issues/${i2}/release-windows"
              payload: { channel: "DIGITAL", release_date: "2027-01-01", expected_net_receipts_cents: 56000 }
              as: SalesDirector
              captures: { rw_dig: $.data.release_date }
            - call: "POST /comics/issues/${i2}/release-windows"
              payload: { channel: "COLLECTED", release_date: "2027-03-02", expected_net_receipts_cents: 90000 }
              as: SalesDirector
            - call: "POST /comics/issues/${i2}/release-windows"
              payload: { channel: "COLLECTED", release_date: "2027-03-03", expected_net_receipts_cents: 90000 }
              as: SalesDirector
              captures: { rw_col: $.data.release_date }
          assert:
            - "the 2026-12-31 DIGITAL call -> 422 ERR_DIGITAL_EMBARGO_VIOLATION (one day inside the 30-day embargo)"
            - "the 2027-01-01 DIGITAL call -> 201 and ${rw_dig} == 2027-01-01T00:00:00Z (the bound is inclusive)"
            - "the 2027-03-02 COLLECTED call -> 409 ERR_CANNIBALIZATION_WINDOW_CONFLICT (the blackout end date is still inside the window)"
            - "the 2027-03-03 COLLECTED call -> 201 and ${rw_col} == 2027-03-03T00:00:00Z"
            - "the collected boundary is measured from the title-wide maximum 2026-12-02, not from issue #1's 2026-10-14: a COLLECTED window on issue #1 at 2027-01-13 (2026-10-14 + 90 + 1) is also refused with ERR_CANNIBALIZATION_WINDOW_CONFLICT"
            - "GET /comics/issues/${i2}/release-windows returns exactly 2 rows (the two refused calls wrote nothing)"

