          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "NetworkLoop LOOP-A (DUAL, rated 9000.0), PipeSegment SEG-A1, RateSchedule RS-H (HOSPITAL)."
            - "ConnectionAgreement CA1 (HOSPITAL, reserved 4000.0) ACTIVE with billing_state CURRENT and balance_due 0.00."
