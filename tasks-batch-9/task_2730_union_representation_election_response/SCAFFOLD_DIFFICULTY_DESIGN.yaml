  - rule_id: non_linear_state_machine
    instances:
      - name: petition_rerun_cycle_reenters_election_set
        grounds:
          - state_machines.Petition.TALLY_POSTED_to_OBJECTIONS_PENDING
          - state_machines.Petition.OBJECTIONS_PENDING_to_RERUN_DIRECTED
          - state_machines.Petition.RERUN_DIRECTED_to_ELECTION_SET
          - state_machines.ElectionRound.TALLY_POSTED_to_SET_ASIDE
          - entities.ElectionRound.fields.prior_round_id
        distinguishing_aspect: |
          Petition.case_status revisits ELECTION_SET a second time after passing through
          TALLY_POSTED -> OBJECTIONS_PENDING -> RERUN_DIRECTED, and the second ElectionRound carries
          round_number 2 with prior_round_id pointing at the SET_ASIDE first round - a true cycle, not
          a terminal branch.
        test_recipe:
          setup:
            - "a full first election arc: petition SOI_VERIFIED, stipulated agreement, accepted voter list, one poll session closed with 42 for / 39 against / 1 void, three challenged ballots still OPEN"
            - "provisional tally posted on 2026-09-02T12:00:00Z with margin 3 and objection window closing 2026-09-14T23:59:59Z"
            - "the union has filed one objection alleging 5 affected voters, so affects_results is true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
