  - rule_id: transitive_cascade
    instances:
      - name: default_declaration_cascade_customer_lock_apps_void_upgrade_expire
        grounds:
          - state_machines.InstallmentLoan.delinquency_state.DELINQUENT_to_DEFAULT
          - state_machines.Customer.status.ACTIVE_to_FINANCING_LOCKED
          - state_machines.CreditApplication.status.SUBMITTED_to_VOIDED_BY_LOCK
          - state_machines.UpgradeRequest.status.TRADE_IN_DECLARED_to_EXPIRED
          - state_machines.TradeIn.status.DECLARED_to_CANCELLED
          - calculations.model_reservation_capacity
          - endpoints.POST_/servicing/daily-run
        distinguishing_aspect: |
          Depth-5 chain, each link caused strictly by the previous one, all inside one
          POST /servicing/daily-run: (1) loan_x crosses DEFAULT_MIN_DPD 90 and is declared
          DEFAULT; (2) because a loan of the customer reached DEFAULT the Customer becomes
          FINANCING_LOCKED with reason DEFAULTED_LOAN; (3) because the Customer is locked the
          ELIGIBILITY-passed UpgradeRequest sitting on the customer's OTHER, perfectly current
          loan_y is EXPIRED; (4) because that request left a reserving state, Handset A's
          reserved_slot_count drops to 0 and loan_y.upgrade_hold_flag is cleared; (5) because
          the request expired its TradeIn is CANCELLED and the traded DeviceUnit's
          possession_status returns from RETURN_PENDING to WITH_CUSTOMER. The reach across
          loans is what makes it non-local: nothing about loan_y is delinquent, and the
          fulfillment window [2027-10-20, 2027-10-27) has NOT elapsed at 2027-10-25, so the
          request can only have died through the lock chain, not through the sweep's own
          window-expiry step. (Because the expiry is cascade-driven rather than
          window-driven, this instance deliberately does not pin
          expired_upgrade_request_count.) The application void is a side branch of link 2,
          not part of the depth count.
