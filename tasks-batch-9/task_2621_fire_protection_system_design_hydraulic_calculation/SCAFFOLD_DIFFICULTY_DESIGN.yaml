          - validations[priority=22]
          - validations[priority=35]
          - calculations.water_supply_availability
          - endpoints.POST_/water-supply-evaluations
        distinguishing_aspect: |
          The request is doubly unfit for evaluation: its hydrant test is 426 days old against the
          365-day validity window and the calculation it would be measured against has an empty
          iteration chain. The referential check on the flow test at priority 22 must win with 422
          ERR_FLOW_TEST_STALE; ERR_NO_ITERATIONS_IN_CHAIN at priority 35 only surfaces once the same
          request is re-issued with a fresh hydrant test, so an implementation that guards the
          division by an undefined required pressure first reports the wrong error.
