              captures: { standing_final: $.data.standing_enforcement_count, posture_final: $.data.safety_posture, reinstatements: $.data.prior_reinstatement_count }
          assert:
            - "Account.${acct_id}.standing_enforcement_count advances from 0 to exactly 1 on the forward deactivation"
            - "standing_enforcement_count after the compensating overturn == 0, exactly equal to standing_baseline captured before any deactivation, so the conservation holds with zero drift"
