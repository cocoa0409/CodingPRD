  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any role, existence or body check — priority 1 beats everything including a malformed body."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "POST /ops/storm-events"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_UNAUTHENTICATED with http 401 (no declared role header)"

      - name: role_denied_returns_forbidden_before_existence
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "A UnitManager calling the admin-only PATCH /ops/units/{id} on a NON-EXISTENT unit id gets 403 ERR_FORBIDDEN, not 404 — authorization (priority 2) precedes existence (priority 3)."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "PATCH /ops/units/00000000-0000-0000-0000-000000000000"
              payload: { lodging_fund_top_up_cents: 5000 }
              as: UnitManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_FORBIDDEN with http 403 (not ERR_NOT_FOUND)"

      - name: fail_checklist_item_requires_note
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "A FAIL checklist item without note fails the body-shape gate with 422 ERR_VALIDATION; the same item with a note is accepted — conditional required field keyed on another field's enum value."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm S; unit U; checklist run R IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/units/${u}/checklists"
              payload: {}
              as: UnitManager
              captures: { run: $.data.id }
          trigger:
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "GAS_LEAK_CHECK", result: "FAIL" }
              as: UnitManager
              captures: { err: $.data.error_id }
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "GAS_LEAK_CHECK", result: "FAIL", note: "odor at manifold" }
              as: UnitManager
              captures: { item: $.data.id }
          assert:
            - "the noteless FAIL item fails with error_id == ERR_VALIDATION (422)"
            - "the FAIL item with note is accepted: ChecklistItem.${item}.result == FAIL"

      - name: lodging_fund_exact_balance_boundary
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_LODGING_FUND_EXCEEDED]
        distinguishing_aspect: "The fund check is >=: a booking costing exactly the remaining fund succeeds (fund reaches 0), and the next booking costing 1 cent more than 0 fails ERR_LODGING_FUND_EXCEEDED — fiscal check is priority 11, after overlap (priority 8)."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm WATCH; unit U fund exactly 18000. Member M assigned; booking B1 costs exactly 18000 (1 room, 9000, 2 nights)."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way", lodging_fund_cents: 18000 }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/crew-members"
              payload: { full_name: "Jo Vega", role: "GRILL_OP", home_unit_id: "${u}", is_jump_team: true }
              as: FieldCoordinator
              captures: { m: $.data.id }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u}", assigned_from: "2026-09-10T08:00:00Z", assigned_until: "2026-09-14T08:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a: $.data.id }
            - call: "POST /ops/lodging-bookings"
              payload: { crew_assignment_id: "${a}", unit_id: "${u}", rooms: 1, nightly_rate_cents: 9000, check_in: "2026-09-10T14:00:00Z", check_out: "2026-09-12T09:00:00Z" }
              as: FieldCoordinator
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /ops/lodging-bookings"
              payload: { crew_assignment_id: "${a}", unit_id: "${u}", rooms: 1, nightly_rate_cents: 1, check_in: "2026-09-12T14:00:00Z", check_out: "2026-09-13T09:00:00Z" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "B1 succeeded with cost_cents == 18000 (exact balance is sufficient — >= semantics)"
            - "Unit.${u}.lodging_fund_cents == 0 after B1"
            - "trigger fails with error_id == ERR_LODGING_FUND_EXCEEDED (cost 1 > remaining 0)"

      - name: confirm_before_service_date_rejected
        claim_type: Violation → Error
