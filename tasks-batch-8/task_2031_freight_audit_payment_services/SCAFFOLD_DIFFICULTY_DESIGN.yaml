            - "payment dimension untouched by the audit cycle: ${pay0} == UNPAID, ${pay1} == UNPAID, ${pay2} == UNPAID"
            - "CarrierInvoice.${inv}.approved_amount_minor == 87500 (resolution-pinned to rated total)"

      - name: exception_counter_cycle_round_limit
