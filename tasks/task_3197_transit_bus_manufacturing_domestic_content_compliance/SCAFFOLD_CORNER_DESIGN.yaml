  # ===========================================================================
  # Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without a role header fails priority-1 auth with ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/agencies"
              payload: { name: "NoAuth Transit", agency_code: "NAU1", transition_target_year: 2035 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Request missing X-User-Role / X-User-ID headers returns err == ERR_UNAUTHENTICATED"

      - name: contract_create_for_suspended_agency_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_AGENCY_SUSPENDED]", state_machines.Agency]
        distinguishing_aspect: "A SUSPENDED agency rejects new contract creation with ERR_AGENCY_SUSPENDED (409)."
        test_recipe:
          setup: ["Agency suspended while no AWARDED/ACTIVE contracts exist"]
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Frozen Transit", agency_code: "FZT1", transition_target_year: 2035 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "PATCH /api/agencies/${ag_id}"
              payload: { status: SUSPENDED }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 1, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413 }
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AGENCY_SUSPENDED"

      - name: inspection_fail_without_defects_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSPECTION_DEFECTS_REQUIRED]", state_machines.BusUnit.PLANT_INSPECTION_to_BUILT]
        distinguishing_aspect: "A FAIL inspection with an empty defects list is rejected with ERR_INSPECTION_DEFECTS_REQUIRED (400)."
