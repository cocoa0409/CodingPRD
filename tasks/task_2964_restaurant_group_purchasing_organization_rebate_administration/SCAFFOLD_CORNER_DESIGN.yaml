              as: GpoAdmin
              captures: { e5: $.data.error_id }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "TIERED_VOLUME", tier_breaks: [{ min_cases: 0, rate_cents_per_case: 0 }, { min_cases: 50, rate_cents_per_case: 180 }], effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: GpoAdmin
              captures: { e6: $.data.error_id }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "TIERED_VOLUME", tier_breaks: [{ min_cases: 0, rate_cents_per_case: 120 }, { min_cases: 50, rate_cents_per_case: 180 }, { min_cases: 200, rate_cents_per_case: 250 }], effective_from: "2026-01-01", effective_to: "2026-12-31" }
