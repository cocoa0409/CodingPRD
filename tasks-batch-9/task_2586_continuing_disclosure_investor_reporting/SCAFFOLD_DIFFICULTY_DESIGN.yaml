# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2586_continuing_disclosure_investor_reporting
#
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Conventions used by every recipe below:
#   * The logical clock's startup default is 2026-08-01T00:00:00Z; recipes still
#     set it explicitly whenever a date matters.
#   * X-User-ID literals: fd-1 (FinanceDirector), off-prep / off-asm
#     (DisclosureOfficer, deliberately distinct to satisfy segregation of
#     duties), rev-1 / rev-2 (ComplianceReviewer). DisseminationAgent always
#     uses the engagement id captured earlier.
#   * Every numeric assert below was computed by executing the §1.3 formula.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: cycle_timeliness_submission_basis_vs_confirmation_basis_divergence
        grounds:
          - calculations.cycle_timeliness_assessment
          - entities.Undertaking.fields.timeliness_basis
          - entities.AnnualReportCycle.fields.timeliness_basis_applied
          - state_machines.AnnualReportCycle.FILING_IN_PROGRESS_to_FILED_TIMELY
          - state_machines.AnnualReportCycle.FILING_IN_PROGRESS_to_FILED_LATE
          - calculations.undertaking_disclosure_risk_score
        distinguishing_aspect: |
          Two cycles with byte-identical due_date (2027-01-26), submitted_at (2027-01-26) and
          repository_confirmed_at (2027-01-28) land on opposite terminal states purely because
          their undertakings carry different timeliness_basis values: SUBMISSION_BASIS yields
          FILED_TIMELY with days_late 0 and no FailureToFileEvent, CONFIRMATION_BASIS yields
          FILED_LATE with days_late 2, one FailureToFileEvent, and disclosure_risk_score 12.00.
        test_recipe:
          setup:
            - "Two bond issues in credit program CITYWATER, each with one Undertaking."
            - "Undertaking A has timeliness_basis SUBMISSION_BASIS; Undertaking B has CONFIRMATION_BASIS. Everything else about them is identical."
            - "Each undertaking has exactly one ContentRequirement of weight_bp 10000 and one ACTIVE DisseminationEngagement with retainer_cents 250000."
            - "Each has an AnnualReportCycle for period [2025-07-01, 2026-06-30) whose derived due_date is 2027-01-26, fully prepared, attested and assembled to READY_TO_FILE."
            - "Each has an ANNUAL_REPORT Filing in status SUBMITTED with submitted_at on 2027-01-26."
            - "The logical clock stands at 2027-01-28T00:00:00Z when the confirmations arrive."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CITYWATER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-01-15", final_maturity_date: "2046-01-15", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_a_id: "$.data.id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CITYWATER", series_designation: "2026B", security_type: "REVENUE", dated_date: "2026-01-15", final_maturity_date: "2046-01-15", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_b_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_a_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_a_id: "$.data.id", und_a_v: "$.data.version" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_b_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "CONFIRMATION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_b_id: "$.data.id", und_b_v: "$.data.version" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_a_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_b_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_a_id}", agent_name: "Meridian Disclosure LLC", effective_date: "2026-07-01", expiration_date: "2027-12-31", retainer_cents: 250000, last_calendar_ack_date: "2026-08-01", expected_undertaking_version: "${und_a_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_b_id}", agent_name: "Meridian Disclosure LLC", effective_date: "2026-07-01", expiration_date: "2027-12-31", retainer_cents: 250000, last_calendar_ack_date: "2026-08-01", expected_undertaking_version: "${und_b_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_b_id: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_a_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_a_id: "$.data.id", due_a: "$.data.due_date" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_b_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_b_id: "$.data.id", due_b: "$.data.due_date" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_a_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_a_id: "$.data[0].id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_b_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_b_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_a_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-2026A.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "PATCH /disclosure/cycle-content-items/${item_b_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-2026B.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_a_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_b_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles/${cycle_a_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
            - call: "POST /disclosure/annual-report-cycles/${cycle_b_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
            - call: "GET /disclosure/bond-issues/${issue_a_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { issue_a_v: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_a_id}", filing_type: "ANNUAL_REPORT", cycle_id: "${cycle_a_id}", expected_issue_version: "${issue_a_v}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { filing_a_id: "$.data.id" }
            - call: "GET /disclosure/bond-issues/${issue_b_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { issue_b_v: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_b_id}", filing_type: "ANNUAL_REPORT", cycle_id: "${cycle_b_id}", expected_issue_version: "${issue_b_v}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { filing_b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-26T09:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/filings/${filing_a_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_a_id}"
            - call: "POST /disclosure/filings/${filing_b_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-28T14:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
          trigger:
            - call: "POST /disclosure/filings/${filing_a_id}/confirm"
              payload: { repository_receipt_id: "EMMA-2027-A-0001" }
              as: DisseminationAgent
              as_user_id: "${eng_a_id}"
            - call: "POST /disclosure/filings/${filing_b_id}/confirm"
              payload: { repository_receipt_id: "EMMA-2027-B-0001" }
              as: DisseminationAgent
              as_user_id: "${eng_b_id}"
            - call: "GET /disclosure/failure-to-file-events?undertaking_id=${und_b_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { fte_b_id: "$.data[0].id", fte_b_kind: "$.data[0].kind", fte_b_days: "$.data[0].days_late", fte_b_sev: "$.data[0].severity", fte_b_occ: "$.data[0].occurred_at" }
          assert:
            - "${due_a} == \"2027-01-26\" and ${due_b} == \"2027-01-26\" — identical derived due dates"
            - "AnnualReportCycle.${cycle_a_id}.status == FILED_TIMELY"
            - "AnnualReportCycle.${cycle_a_id}.days_late == 0"
            - "AnnualReportCycle.${cycle_a_id}.timeliness_basis_applied == SUBMISSION_BASIS"
            - "AnnualReportCycle.${cycle_a_id}.filed_at == \"2027-01-26T09:00:00Z\" (the submission instant)"
            - "AnnualReportCycle.${cycle_b_id}.status == FILED_LATE"
            - "AnnualReportCycle.${cycle_b_id}.days_late == 2"
            - "AnnualReportCycle.${cycle_b_id}.timeliness_basis_applied == CONFIRMATION_BASIS"
            - "AnnualReportCycle.${cycle_b_id}.filed_at == \"2027-01-28T14:00:00Z\" (the confirmation instant)"
            - "Undertaking.${und_a_id}.late_filing_count == 0"
            - "Undertaking.${und_a_id}.disclosure_risk_score == 0.00"
            - "Undertaking.${und_a_id}.remediation_tier == TIER_0"
            - "Undertaking.${und_b_id}.late_filing_count == 1"
            - "Undertaking.${und_b_id}.disclosure_risk_score == 12.00"
            - "Undertaking.${und_b_id}.remediation_tier == TIER_0"
            - "Undertaking.${und_b_id}.compliance_posture == COMPLIANT"
            - "GET /disclosure/failure-to-file-events?undertaking_id=${und_a_id} returns 0 rows"
            - "${fte_b_kind} == ANNUAL_REPORT_LATE"
            - "${fte_b_occ} == \"2027-01-26\" (the missed due_date)"
            - "${fte_b_days} == 2"
            - "${fte_b_sev} == MINOR (2 < MAJOR_DAYS_LATE 30)"

      - name: official_statement_lookback_strict_five_year_vs_remediated_excluded
        grounds:
          - calculations.official_statement_disclosure_lookback
          - entities.OfficialStatement.fields.lookback_policy
          - entities.OfficialStatement.fields.required_disclosure_event_count
          - entities.OfficialStatement.fields.disclosure_adequacy
          - entities.FailureToFileEvent.fields.remediated_at
          - state_machines.OfficialStatement.COMPLIANCE_REVIEW_to_COMPLIANCE_REVIEW
        distinguishing_aspect: |
          A different entity domain than the timeliness pair: this variant pair lives on
          OfficialStatement and aggregates across BondIssues sharing issuer_program_code rather
          than reading one Filing. Over the identical two-event failure population,
          STRICT_FIVE_YEAR returns required_disclosure_event_count 2 and disclosure_adequacy
          INCOMPLETE while REMEDIATED_EXCLUDED returns 1 and ADEQUATE — the delta being exactly
          the event remediated before the dated date.
        test_recipe:
          setup:
            - "Credit program CITYWATER holds a seasoned issue (series 2019A) with one Undertaking, one ContentRequirement of weight_bp 10000, and one ACTIVE DisseminationEngagement."
            - "Two AnnualReportCycles of that undertaking were both filed late, minting two FailureToFileEvents: e1 with occurred_at 2026-01-26 and e2 with occurred_at 2027-01-26."
            - "e1 was remediated on 2027-02-06 against its own confirmed filing; e2 is still OPEN."
            - "A new issue (series 2027A) in the SAME program CITYWATER has a DRAFT OfficialStatement with dated_date 2027-03-01 and disclosed_event_ids listing only e2, so the document discloses one of the two failures."
            - "The lookback window is therefore [2022-03-01, 2027-03-01) and both events fall inside it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CITYWATER", series_designation: "2019A", security_type: "REVENUE", dated_date: "2019-06-01", final_maturity_date: "2049-06-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue1_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue1_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_v: "$.data.version" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Meridian Disclosure LLC", effective_date: "2026-07-01", expiration_date: "2027-12-31", retainer_cents: 250000, last_calendar_ack_date: "2026-08-01", expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2025", period_start_date: "2024-07-01", period_end_date: "2025-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cyc1_id: "$.data.id", due1: "$.data.due_date" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cyc1_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item1_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item1_id}"
              payload: { data_as_of_date: "2025-06-30", source_document_ref: "OPDATA-FY2025.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item1_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles/${cyc1_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
            - call: "GET /disclosure/bond-issues/${issue1_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { iv1: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue1_id}", filing_type: "ANNUAL_REPORT", cycle_id: "${cyc1_id}", expected_issue_version: "${iv1}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { f1_id: "$.data.id" }
            - call: "POST /disclosure/filings/${f1_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_id}"
            - call: "POST /disclosure/filings/${f1_id}/confirm"
              payload: { repository_receipt_id: "EMMA-FY2025-0001" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cyc2_id: "$.data.id", due2: "$.data.due_date" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cyc2_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item2_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item2_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item2_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles/${cyc2_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-05T10:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "GET /disclosure/bond-issues/${issue1_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { iv2: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue1_id}", filing_type: "ANNUAL_REPORT", cycle_id: "${cyc2_id}", expected_issue_version: "${iv2}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { f2_id: "$.data.id" }
            - call: "POST /disclosure/filings/${f2_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_id}"
            - call: "POST /disclosure/filings/${f2_id}/confirm"
              payload: { repository_receipt_id: "EMMA-FY2026-0001" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
            - call: "GET /disclosure/failure-to-file-events?cycle_id=${cyc1_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e1_id: "$.data[0].id", e1_occ: "$.data[0].occurred_at", e1_days: "$.data[0].days_late", e1_sev: "$.data[0].severity" }
            - call: "GET /disclosure/failure-to-file-events?cycle_id=${cyc2_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e2_id: "$.data[0].id", e2_occ: "$.data[0].occurred_at", e2_days: "$.data[0].days_late", e2_sev: "$.data[0].severity" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-06T08:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/failure-to-file-events/${e1_id}/remediate"
              payload: { remediation_filing_id: "${f1_id}", remediation_note: "FY2025 annual report filed and confirmed; remediation policy step 3 complete." }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CITYWATER", series_designation: "2027A", security_type: "REVENUE", dated_date: "2027-03-01", final_maturity_date: "2057-03-01", original_par_amount_cents: 50000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue2_id: "$.data.id" }
            - call: "POST /disclosure/official-statements"
              payload: { issue_id: "${issue2_id}", dated_date: "2027-03-01", lookback_policy: "STRICT_FIVE_YEAR", disclosed_event_ids: ["${e2_id}"] }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { os_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure/official-statements/${os_id}/compliance-review"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { strict_count: "$.data.required_disclosure_event_count", strict_adeq: "$.data.disclosure_adequacy", strict_ids: "$.data.required_disclosure_event_ids" }
            - call: "POST /disclosure/official-statements/${os_id}/compliance-review"
              payload: { lookback_policy: "REMEDIATED_EXCLUDED" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { excl_count: "$.data.required_disclosure_event_count", excl_adeq: "$.data.disclosure_adequacy", excl_ids: "$.data.required_disclosure_event_ids" }
          assert:
            - "${due1} == \"2026-01-26\" and ${due2} == \"2027-01-26\""
            - "${e1_occ} == \"2026-01-26\" and ${e2_occ} == \"2027-01-26\" — both inside [2022-03-01, 2027-03-01)"
            - "${e1_days} == 187 and ${e1_sev} == MAJOR (187 >= MAJOR_DAYS_LATE 30)"
            - "${e2_days} == 10 and ${e2_sev} == MINOR"
            - "FailureToFileEvent.${e1_id}.status == REMEDIATED with remediated_at == \"2027-02-06T08:00:00Z\""
            - "FailureToFileEvent.${e2_id}.status == OPEN"
            - "${strict_count} == 2"
            - "${strict_ids} == [\"${e1_id}\", \"${e2_id}\"] — ordered occurred_at ASC"
            - "${strict_adeq} == INCOMPLETE"
            - "${excl_count} == 1"
            - "${excl_ids} == [\"${e2_id}\"]"
            - "${excl_adeq} == ADEQUATE"
            - "the STRICT/EXCLUDED delta is exactly ${e1_id}, the event remediated before dated_date 2027-03-01"
            - "OfficialStatement.${os_id}.status == COMPLIANCE_REVIEW after both calls (self-loop, not an error)"
            - "Undertaking.${und_id}.late_filing_count == 2 — remediation did NOT decrement it"

  - rule_id: combinatorial_formula
    instances:

      - name: completeness_score_rounds_each_item_before_summation
        grounds:
          - calculations.content_preparation_completeness_score
          - entities.AnnualReportCycle.fields.completeness_score_pct
          - entities.CycleContentItem.fields.readiness_factor
          - entities.CycleContentItem.fields.weight_bp_snapshot
          - entities.ContentRequirement.fields.requires_audit_opinion
        distinguishing_aspect: |
          Mode (b) — order-of-operations sensitivity. Weights [3333, 3333, 3333, 1] with the
          three 3333-bp items in DRAFT force the pinned round-then-sum order to 50.01 while the
          natural sum-then-round order gives 50.00. A single one-cent-of-a-percent difference is
          the only observable, so the test cannot pass by accident.
        test_recipe:
          setup:
            - "One BondIssue with one Undertaking."
            - "Four ContentRequirements whose weight_bp are exactly 3333 (AUDITED_FINANCIALS), 3333 (OPERATING_DATA_TABLE), 3333 (DEBT_SERVICE_SCHEDULE) and 1 (ENTERPRISE_STATISTICS) — summing to 10000 so §1.4 priority 18 is satisfied."
            - "One AnnualReportCycle snapshots all four weights into four CycleContentItems, all NOT_STARTED."
            - "The three 3333-bp items are PATCHed to DRAFT; the AUDITED_FINANCIALS item additionally carries audit_opinion_type UNMODIFIED so its opinion_multiplier is 1.0 and does not muddy the arithmetic."
            - "The weight-1 ENTERPRISE_STATISTICS item is left untouched at NOT_STARTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
