          cov_frozen: $.data.crm_coverage_pct
          risk_frozen: $.data.residual_risk_score_at_submission
          open_frozen: $.data.open_findings_at_submission
      - call: POST /authorization-packages/${pkg_id}/review
        payload: {}
        as: ProgramBoardReviewer
