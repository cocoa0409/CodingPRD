  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_settlement_to_agreement_to_screen_to_film
        grounds:
          - state_machines.Settlement.FINALIZED_to_SETTLED
          - state_machines.BookingAgreement.HELD_OVER_to_COMPLETED
          - state_machines.BookingAgreement.IN_PLAY_to_COMPLETED
        distinguishing_aspect: |
          Trigger: POST /settlements/{id}/mark_settled.
          Chain (depth 3):
            1. Settlement FINALIZED → SETTLED (initial mutation)
            2. BookingAgreement.weeks_played += 1 AND current_week_rental_pct recomputed (B mutated by A)
            3. When weeks_played >= min_weeks_committed at next close_box_office_week: deal_status → COMPLETED (C mutated by B's state)
            4. Screen.status → AVAILABLE (D mutated by C) AND Film.screens_committed -= 1 (E mutated by C)
          Each link is caused by the previous link, not the original trigger.
