          - "errors[ERR_DUPLICATE_ACTIVE_REQUIREMENT]"
          - "state_machines.RoleRequirement"
        distinguishing_aspect: "Uniqueness is over ACTIVE requirements only: a second (role, curriculum) requirement is 409 while the first is ACTIVE, and succeeds after the first is retired."
