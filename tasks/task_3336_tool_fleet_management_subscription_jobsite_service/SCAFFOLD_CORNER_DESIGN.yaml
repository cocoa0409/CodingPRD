      - name: loaner_dispatch_empty_pool_rejected
        claim_type: precondition_enforcement
        grounds: [calculations.loaner_allocation, "errors[ERR_LOANER_POOL_EMPTY]"]
        distinguishing_aspect: "loaner_requested=true but no AVAILABLE unit of the model -> ERR_LOANER_POOL_EMPTY and the ticket stays IN_SHOP."
        test_recipe:
          setup: ["ticket in IN_SHOP with loaner_requested=true; zero loaner units registered"]
