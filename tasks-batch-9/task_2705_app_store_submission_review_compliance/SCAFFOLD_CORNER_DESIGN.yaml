          - calculations.review_priority_score.constants.NORMAL_BAND_FLOOR
        distinguishing_aspect: "At queued_at + 31h the score is round_half_up(50 + 0.30 * 100 * 31/48, 2) == 69.38, below the 70.00 floor, so the band stays NORMAL and effective_review_deadline_at remains queued_at + 48h."
        test_recipe:
