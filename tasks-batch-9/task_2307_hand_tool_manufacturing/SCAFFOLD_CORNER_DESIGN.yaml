            - "GET /toolworks/production-lots?limit=1&offset=2 returns an empty data array with meta.total_count 2 and meta.has_more false — paging past the end is not an error"
            - "The test-run read filtered on chamber_id returns total_count 0 (the HARDNESS run has no chamber) while the unscoped mandatory HARDNESS read returns total_count 1 with run_hit == '${run1}'"
            - "furnace_hit == 'FCE-1' with status=AVAILABLE (the furnace was released back to AVAILABLE when the campaign completed) and chamber_hit == 'SSC-1'"
