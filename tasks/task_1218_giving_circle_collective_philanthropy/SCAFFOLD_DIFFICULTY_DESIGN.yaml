          assert:
            - "error_id == ERR_SESSION_FULL (409) when seats_taken == capacity == 2"
            - "LearningSession.${sess_id}.seats_taken == 2 (unchanged by the rejected RSVP)"
            - "LearningSession.${sess_id}.rsvp_membership_ids has length 2"
