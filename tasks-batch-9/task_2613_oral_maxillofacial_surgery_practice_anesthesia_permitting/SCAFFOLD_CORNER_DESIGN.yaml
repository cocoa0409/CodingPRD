              as: SchedulingCoordinator
              captures: { case_b: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "ORTHOGNATHIC", planned_start: "2026-09-28T13:00:00Z", planned_end: "2026-09-28T14:00:00Z", total_charge_cents: 70000, prerequisite_case_id: "${case_b}" }
              as: SchedulingCoordinator
              captures: { case_c: $.data.id }
          trigger:
            - call: "POST /surgical-cases/${case_a}/prerequisite"
              payload: { prerequisite_case_id: "${case_c}" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /surgical-cases/${case_a}/prerequisite"
              payload: { prerequisite_case_id: "${case_a}" }
              as: SchedulingCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "trigger[0]: HTTP 409 with data.error_id == ERR_PREREQUISITE_CYCLE (A -> C -> B -> A)"
            - "trigger[1]: HTTP 409 with data.error_id == ERR_PREREQUISITE_CYCLE for the one-node self reference"
            - "SurgicalCase.${case_a}.prerequisite_case_id is still null and its version was not incremented by either refusal"
            - "pointing A at an unrelated fourth DRAFT case instead succeeds with HTTP 200 and bumps A's version by 1"

      - name: drill_lapse_outranks_the_prerequisite_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=59]
          - validations[priority=70]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / drill_safety_59_beats_prerequisite_constraint_70
          rationale: "That instance violates both rules on one confirmation and asserts the safety error wins."

      - name: surgeon_mismatch_outranks_the_room_turnover_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=75]
          - validations[priority=76]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_75_beats_temporal_76_on_hold_block
          rationale: "That instance sets up a hold that violates both the surgeon match and the turnover buffer and asserts the referential error."

      - name: segregation_of_duties_outranks_the_fasting_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=62]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / auth_9_beats_fasting_safety_62
          rationale: "That instance submits a day-of verification that is both self-reviewed and under-fasted and asserts the auth error."

      - name: reservation_validity_depends_on_the_parent_lot_status
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=42]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / reservation_creation_depends_on_lot_status
          rationale: "That instance creates the same reservation against an AVAILABLE and a QUARANTINED lot and asserts both outcomes."

  # ==========================================================================
  - section: endpoints
    instances:
      - name: staff_member_create_read_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints["POST /staff-members"]
          - endpoints["GET /staff-members/{staffId}"]
          - endpoints["GET /staff-members"]
        distinguishing_aspect: "The staff roster is the reference data every other flow depends on: creation echoes the optional certification and ACLS fields, the single read returns the same row, and the collection filters by role_type within the practice."
        test_recipe:
          setup:
            - "one practice"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Roster OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Mo Monitor", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { mon_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Ren Nurse", role_type: "RECOVERY_NURSE" }
              as: PracticeAdministrator
              captures: { nurse_id: $.data.id }
            - call: "GET /staff-members/${mon_id}"
              as: SchedulingCoordinator
          assert:
            - "each creation returns HTTP 201 with a server-minted id, created_at, updated_at and version == 1"
            - "the surgeon row carries acls_expires_on == 2027-06-30T00:00:00Z with monitoring_certified defaulted to false; the nurse row has both optional fields at their defaults (false and null)"
            - "GET /staff-members/${mon_id} returns full_name == Mo Monitor, role_type == ANESTHESIA_MONITOR, monitoring_certified == true"
            - "GET /staff-members?practice_id=${prac_id}&role_type=ANESTHESIA_MONITOR returns total_count == 1 and only ${mon_id}"
            - "GET /staff-members?practice_id=${prac_id} returns total_count == 3"

      - name: regulator_notification_flips_the_flag_without_moving_the_status
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /adverse-events/{eventId}/regulator-notification"]
          - entities.AdverseEvent.fields.regulator_notified
        distinguishing_aspect: "The notification action is a self-loop on the independent regulator track: it sets regulator_notified and bumps the event version while leaving status at REPORTED, and it is legal before any morbidity review has been opened."
        test_recipe:
          setup:
            - "one SEVERE adverse event reported inside its 72-hour deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T15:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Notify OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Notify", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "TRAUMA", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 50000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /adverse-events"
              payload: { case_id: "${case_id}", event_type: "AIRWAY_EVENT", severity: "SEVERE", occurred_at: "2026-09-14T14:30:00Z", narrative: "Transient desaturation requiring airway support." }
              as: Surgeon
              as_user_id: "${surg_id}"
              captures: { ev_id: $.data.id, ev_v: $.data.version }
          trigger:
            - call: "POST /adverse-events/${ev_id}/regulator-notification"
              payload: { notified_at: "2026-09-14T16:00:00Z", notification_reference: "OH-DENT-2026-0914-01" }
              as: QualityReviewer
              as_user_id: "${surg_id}"
          assert:
            - "before the trigger: regulator_notified == false, status == REPORTED, reporting_deadline_at == 2026-09-17T14:30:00Z (occurred_at + 72 hours for SEVERE) and late_report == false"
            - "trigger: HTTP 200 with data.regulator_notified == true and data.status still REPORTED"
            - "the event version advanced past ${ev_v} while reviewer_staff_id is still null - the notification track needs no reviewer"
            - "Practice.${prac_id}.open_adverse_event_count is still 1 because notification is not closure"

      - name: referral_acknowledgement_links_the_referring_provider
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /surgical-cases/{caseId}/referral-coordination"]
          - entities.SurgicalCase.fields.referral_coordination_status
        distinguishing_aspect: "The link is only meaningful when the case actually carries a referral: an ORTHOGNATHIC case filed with a referring NPI opens at PENDING and moves to ACKNOWLEDGED, while a case filed without one is NOT_REQUIRED and rejects the same call."
        test_recipe:
          setup:
            - "one ORTHOGNATHIC case with referring_provider_npi and one IMPLANT case without"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Referral OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Referral", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "ORTHOGNATHIC", planned_start: "2026-09-21T13:00:00Z", planned_end: "2026-09-21T14:30:00Z", total_charge_cents: 120000, referring_provider_npi: "1447382910" }
              as: SchedulingCoordinator
              captures: { linked_case: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-22T13:00:00Z", planned_end: "2026-09-22T14:00:00Z", total_charge_cents: 90000 }
              as: SchedulingCoordinator
              captures: { solo_case: $.data.id }
          trigger:
            - call: "POST /surgical-cases/${linked_case}/referral-coordination"
              payload: { acknowledged_by_npi: "1447382910" }
              as: SchedulingCoordinator
            - call: "POST /surgical-cases/${solo_case}/referral-coordination"
              payload: { acknowledged_by_npi: "1447382910" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "before the triggers: SurgicalCase.${linked_case}.referral_coordination_status == PENDING and SurgicalCase.${solo_case}.referral_coordination_status == NOT_REQUIRED"
            - "trigger[0]: HTTP 200 with data.referral_coordination_status == ACKNOWLEDGED and the case version incremented"
            - "trigger[1]: HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION - a NOT_REQUIRED case has nothing to acknowledge"
            - "GET /surgical-cases?practice_id=${prac_id} shows both cases still DRAFT: acknowledgement is orthogonal to the scheduling dimension"

