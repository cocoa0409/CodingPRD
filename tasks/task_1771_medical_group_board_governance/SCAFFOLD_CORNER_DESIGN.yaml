# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Medical Group Board & Governance. Breadth walk over §1.1–§1.7 following the
# claim-extraction guide taxonomy. 37 real instances + 9 excluded stubs.
# Default logical clock is 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:

  # ===================================================== 1. entities
  - section: entities
    instances:
      - name: physician_create_associate_defaults
        claim_type: defaults
        grounds: [entities.Physician.fields.partnership_status, entities.Physician.fields.standing]
        distinguishing_aspect: "Omitting founding_shareholder/initial_shares/specialty yields ASSOCIATE + GOOD_STANDING + 0 shares + 0 capital account; system stamps id/created_at/version=1."
        test_recipe:
          setup: ["Policy exists"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/physicians", payload: { full_name: "Dr New", hire_date: "2024-03-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
          assert:
            - "Physician.${p_id}: partnership_status == ASSOCIATE, standing == GOOD_STANDING, shares_held == 0, capital_account_balance_cents == 0, version == 1, id is a bare UUID"

      - name: physician_create_founding_shareholder_debits_treasury
        claim_type: creation
        grounds: [entities.Physician.fields.founding_shareholder, entities.GovernancePolicy.fields.treasury_shares]
        distinguishing_aspect: "founding_shareholder=true with initial_shares 500 creates a SHAREHOLDER holding 500 and debits treasury from 1000000 to 999500."
        test_recipe:
          setup: ["Policy with 1000000 authorized shares"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/physicians", payload: { full_name: "Dr F", hire_date: "2010-06-01T00:00:00Z", founding_shareholder: true, initial_shares: 500 }, as: BoardAdmin, captures: { p_id: $.data.id } }
            - { call: "GET /governance/policy", as: BoardAdmin }
          assert:
            - "Physician.${p_id}.partnership_status == SHAREHOLDER and shares_held == 500"
            - "GovernancePolicy.treasury_shares == 999500"

      - name: physician_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Physician.fields.hire_date, "validations[priority=2]"]
        distinguishing_aspect: "Omitting required hire_date yields ERR_INVALID_REQUEST (400) before any state or business check."
        test_recipe:
          setup: ["Policy exists"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/physicians", payload: { full_name: "Dr NoHire" }, as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status 400"

      - name: physician_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404), not a state error."
        test_recipe:
          setup: ["Policy exists"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
          trigger:
            - { call: "GET /governance/physicians/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404"

      - name: policy_singleton_second_create_rejected
        claim_type: type_constraints
        grounds: [entities.GovernancePolicy.fields.singleton_key, "errors[ERR_POLICY_ALREADY_EXISTS]"]
        distinguishing_aspect: "The GovernancePolicy is a singleton: a second POST /governance/policy is rejected with ERR_POLICY_ALREADY_EXISTS."
        test_recipe:
          setup: ["Policy already created"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 500 }, as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_POLICY_ALREADY_EXISTS and HTTP status 409"

      - name: committee_create_charter_initial_state
        claim_type: initial_state
        grounds: [entities.Committee.fields.charter_version, state_machines.Committee]
        distinguishing_aspect: "A new committee starts CHARTERED (not ACTIVE) with charter_version 1, empty members, active_member_count 0."
        test_recipe:
          setup: ["Policy exists"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/committees", payload: { name: "Finance Committee", committee_type: FINANCE, quorum_count: 2, approval_threshold: SUPERMAJORITY }, as: BoardAdmin, captures: { c_id: $.data.id } }
          assert:
            - "Committee.${c_id}: status == CHARTERED, charter_version == 1, members == [], active_member_count == 0"

      - name: motion_threshold_type_computed_from_motion_type
        claim_type: computed_fields
        grounds: [entities.Motion.fields.threshold_type]
        distinguishing_aspect: "threshold_type is computed from motion_type (SUPERMAJORITY for MERGER, SIMPLE_MAJORITY for CAPITAL_CALL); the field is not part of the request schema and a client-supplied threshold_type is rejected as an unknown field."
        test_recipe:
          setup: ["Policy exists; one SHAREHOLDER A; one merger proposal exists"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/merger-proposals", payload: { counterparty_name: "Regional Health", exchange_ratio_x1000: 1250, cash_consideration_cents: 900000000 }, as: BoardAdmin, captures: { mp_id: $.data.id } }
          trigger:
            - { call: "POST /governance/motions", payload: { motion_type: MERGER, sponsor_physician_id: "${a_id}", payload: { merger_proposal_id: "${mp_id}" } }, as: Physician, as_user_id: "${a_id}", captures: { m1_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Minor" } }, as: Physician, as_user_id: "${a_id}", captures: { m2_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", threshold_type: UNANIMOUS, payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Sneaky" } }, as: Physician, as_user_id: "${a_id}", captures: { err_extra: $.data.error_id } }
          assert:
            - "Motion.${m1_id}.threshold_type == SUPERMAJORITY (computed from MERGER type)"
            - "Motion.${m2_id}.threshold_type == SIMPLE_MAJORITY (computed from CAPITAL_CALL type)"
            - "err_extra == ERR_INVALID_REQUEST (client-supplied threshold_type rejected)"

      - name: buy_in_offer_min_floor_binding_in_june
        claim_type: computed_fields
        grounds: [calculations.buy_in_price, entities.BuyInOffer.fields.final_amount_cents]
        distinguishing_aspect: "The max() floor binds: a PARTNER_TRACK offer created in June (1/12 proration) for a 0-tenure associate computes 833333 raw and is floored to min_buy_in_cents 5000000."
        test_recipe:
          setup: ["Policy defaults; clock advanced to 2027-06-01 (June -> fiscal_month_index 12 -> 1/12 proration); associate hired 2027-05-01 (0 full years)"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr J", hire_date: "2027-05-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p_id}", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 1 }, as: BoardAdmin, captures: { o_id: $.data.id } }
          assert:
            - "BuyInOffer.${o_id}.proration_twelfths == 1 and discount_pct_applied == 0"
            - "BuyInOffer.${o_id}.final_amount_cents == 5000000 (floor binds over raw 833333)"

      - name: physician_ownership_pct_six_decimal_precision
        claim_type: precision
        grounds: [calculations.ownership_recalc, entities.Physician.fields.ownership_pct]
        distinguishing_aspect: "ownership_pct is round_half_up to 6 decimals: 1000/9000 renders 0.111111 and 8000/9000 renders 0.888889."
        test_recipe:
          setup: ["Policy; X 1000 shares; Y 8000 shares"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Y", hire_date: "2011-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 8000 }, as: BoardAdmin, captures: { y_id: $.data.id } }
          trigger:
            - { call: "GET /governance/physicians/${x_id}", as: BoardAdmin }
            - { call: "GET /governance/physicians/${y_id}", as: BoardAdmin }
          assert:
            - "Physician.${x_id}.ownership_pct == 0.111111"
            - "Physician.${y_id}.ownership_pct == 0.888889"

  # ===================================================== 2. state_machines
  - section: state_machines
    instances:
      - name: motion_close_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Motion, "errors[ERR_MOTION_NOT_OPEN]"]
        distinguishing_aspect: "close is only valid from OPEN; closing a DRAFT motion returns ERR_MOTION_NOT_OPEN and fires no side effects."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER A; CAPITAL_CALL motion in DRAFT"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Minor" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /governance/capital-calls?motion_id=${m_id}", as: BoardAdmin }
          assert:
            - "err == ERR_MOTION_NOT_OPEN; Motion.${m_id}.status still DRAFT; no CapitalCall created (empty list)"

      - name: motion_withdraw_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Motion]
        distinguishing_aspect: "withdraw is valid only from DRAFT/PROPOSED/TABLED; from OPEN it returns ERR_INVALID_STATE — an OPEN motion must be tabled first."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER A; motion OPEN"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Minor" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /governance/motions/${m_id}/withdraw", payload: {}, as: Physician, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
            - { call: "POST /governance/motions/${m_id}/table", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/withdraw", payload: {}, as: Physician, as_user_id: "${a_id}" }
          assert:
            - "First withdraw (from OPEN): err == ERR_INVALID_STATE"
            - "After table, withdraw succeeds: Motion.${m_id}.status == WITHDRAWN"

      - name: motion_supersede_lifecycle
        claim_type: valid_transition
        grounds: [entities.Motion.fields.supersedes_motion_id, "errors[ERR_MOTION_TERMINAL]"]
        distinguishing_aspect: "Self-referential supersede: creating a motion against a PROPOSED target moves the target to SUPERSEDED; targeting a terminal (SUPERSEDED/ADOPTED) motion returns ERR_MOTION_TERMINAL."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER A; M1 PROPOSED"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "v1" } }, as: Physician, as_user_id: "${a_id}", captures: { m1_id: $.data.id } }
            - { call: "POST /governance/motions/${m1_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", supersedes_motion_id: "${m1_id}", payload: { amount_cents: 60000, due_date: "2026-08-20T00:00:00Z", purpose: "v2" } }, as: Physician, as_user_id: "${a_id}", captures: { m2_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", supersedes_motion_id: "${m1_id}", payload: { amount_cents: 70000, due_date: "2026-08-20T00:00:00Z", purpose: "v3" } }, as: Physician, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "M1 becomes SUPERSEDED; M2 created in DRAFT"
            - "Second supersede of the now-terminal M1: err == ERR_MOTION_TERMINAL"
            - "GET /governance/motions?supersedes_motion_id=${m1_id} returns exactly [M2]"

      - name: motion_expiry_sweep_after_closes_at
        claim_type: valid_transition
        grounds: [state_machines.Motion.OPEN_to_EXPIRED, entities.Motion.fields.closes_at]
        distinguishing_aspect: "The clock sweep expires an OPEN motion only when clock > closes_at (strict): at 2026-08-16T00:00:00Z a motion opened 2026-08-01 with a 14-day window is EXPIRED and its close fails."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER A; motion OPEN (closes_at 2026-08-15T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-09-20T00:00:00Z", purpose: "Minor" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: BoardAdmin }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Motion.${m_id}.status == EXPIRED after the sweep"
            - "err == ERR_MOTION_NOT_OPEN on the late close"

      - name: seat_appoint_non_shareholder_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.BoardSeat.VACANT_to_FILLED]
        distinguishing_aspect: "Only SHAREHOLDER physicians in non-SUSPENDED standing may hold a seat; appointing an ASSOCIATE returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Policy; associate P; VACANT seat"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /governance/board-seats", payload: { seat_label: "SEAT-2", seat_class: EX_OFFICIO }, as: BoardAdmin, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /governance/board-seats/${s_id}/appoint", payload: { physician_id: "${p_id}", term_start: "2026-08-01T00:00:00Z", term_end: "2029-08-01T00:00:00Z" }, as: BoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; BoardSeat.${s_id}.status still VACANT"

      - name: committee_dissolve_blocked_while_motion_open
        claim_type: precondition_enforcement
        grounds: [state_machines.Committee.ACTIVE_to_DISSOLVED]
        distinguishing_aspect: "Dissolve is blocked while any referencing motion is OPEN or TABLED; after table+withdraw of the motion, dissolve succeeds and clears members."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER A; committee ACTIVE (A sole member); CHARTER_AMENDMENT motion OPEN referencing it"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/committees", payload: { name: "Quality Committee", committee_type: QUALITY, quorum_count: 1, approval_threshold: SIMPLE_MAJORITY }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/committees/${c_id}/members", payload: { physician_id: "${a_id}", committee_role: MEMBER }, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: CHARTER_AMENDMENT, sponsor_physician_id: "${a_id}", committee_id: "${c_id}", payload: { new_quorum_count: 1 } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /governance/committees/${c_id}/dissolve", payload: {}, as: BoardAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /governance/motions/${m_id}/table", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/withdraw", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/committees/${c_id}/dissolve", payload: {}, as: BoardAdmin }
          assert:
            - "First dissolve: err == ERR_INVALID_STATE (OPEN reference blocks)"
            - "After withdraw: dissolve succeeds; Committee.${c_id}.status == DISSOLVED, members == []"

      - name: committee_membership_constraints
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_DUPLICATE_MEMBERSHIP]", "errors[ERR_CHAIR_ALREADY_ASSIGNED]", "errors[ERR_COMMITTEE_FULL]"]
        distinguishing_aspect: "Membership triple constraint: same physician twice -> ERR_DUPLICATE_MEMBERSHIP; second CHAIR -> ERR_CHAIR_ALREADY_ASSIGNED; 8th member beyond max_committee_members 7 -> ERR_COMMITTEE_FULL."
        test_recipe:
          setup: ["Policy defaults (max_committee_members 7); 8 shareholders P1..P8; committee quorum 1 with P1 as CHAIR"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P1", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { p1: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P2", hire_date: "2010-01-02T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { p2: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P3", hire_date: "2010-01-03T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { p3: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P4", hire_date: "2010-01-04T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { p4: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P5", hire_date: "2010-01-05T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { p5: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P6", hire_date: "2010-01-06T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { p6: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P7", hire_date: "2010-01-07T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { p7: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P8", hire_date: "2010-01-08T00:00:00Z", founding_shareholder: true, initial_shares: 100 }, as: BoardAdmin, captures: { p8: $.data.id } }
            - { call: "POST /governance/committees", payload: { name: "Comp", committee_type: COMPENSATION, quorum_count: 1, approval_threshold: SIMPLE_MAJORITY }, as: BoardAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /governance/committees/${c_id}/members", payload: { physician_id: "${p1}", committee_role: CHAIR }, as: BoardAdmin }
          trigger:
