              payload: { account_name: "Pi A", event_date: "2027-11-02", setup_style: "ROUNDS", expected_attendance: 40 }
              as: SalesManager
              captures: { event_a: $.data.id }
            - call: "POST /events/${event_a}/room-block-links"
              payload: { hotel_room_block_id: "${block_id}", rooms_reserved: 7, check_in_date: "2027-11-01", check_out_date: "2027-11-03" }
              as: SalesManager
              captures: { link_a: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Pi B", event_date: "2027-11-03", setup_style: "ROUNDS", expected_attendance: 40 }
              as: SalesManager
              captures: { event_b: $.data.id }
          trigger:
            - call: "POST /events/${event_b}/room-block-links"
              payload: { hotel_room_block_id: "${block_id}", rooms_reserved: 4, check_in_date: "2027-11-02", check_out_date: "2027-11-04" }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BLOCK_INSUFFICIENT_ROOMS"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: link_reserve_then_release_conserves_block_total_rooms
        grounds:
          - state_machines.RoomBlockLink.RESERVED_to_RELEASED
          - calculations.rooms_committed
          - entities.HotelRoomBlock.fields.rooms_committed
          - entities.HotelRoomBlock.fields.rooms_available
        distinguishing_aspect: |
          Conserved quantity = ROOM INVENTORY. Invariant block.rooms_available + block.rooms_committed
          == block.total_rooms holds at every step; reserving 6 then releasing the link returns
          rooms_available to exactly 10 with rooms_committed 0 — no drift in total_rooms.
        test_recipe:
          setup:
            - "Block total_rooms=10; Event TENTATIVE with one RESERVED link reserving 6 rooms (available 4, committed 6)."
          setup_api_calls:
            - call: "POST /hotel-room-blocks"
              payload: { block_name: "Invariant Block", total_rooms: 10, nightly_rate_cents: 10000 }
              as: PlatformAdmin
              captures: { block_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Rho Event", event_date: "2027-12-02", setup_style: "ROUNDS", expected_attendance: 40 }
              as: SalesManager
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/room-block-links"
              payload: { hotel_room_block_id: "${block_id}", rooms_reserved: 6, check_in_date: "2027-12-01", check_out_date: "2027-12-03" }
              as: SalesManager
              captures: { link_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/room-block-links/${link_id}/release"
              payload: {}
              as: AccountingClerk
          assert:
            - "HotelRoomBlock.${block_id}.rooms_available == 10"
            - "HotelRoomBlock.${block_id}.rooms_committed == 0"

      - name: payment_apply_then_void_conserves_paid_and_allocations
        grounds:
          - state_machines.Payment.APPLIED_to_VOIDED
          - calculations.payment_waterfall
          - calculations.balance_due
          - entities.Event.fields.paid_to_date_cents
          - entities.PaymentScheduleItem.fields.allocated_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = MONEY (paid_to_date_cents and schedule allocations).
          Applying a 400000 payment then voiding it restores Event.paid_to_date_cents to its
          pre-apply value 500000 and the second schedule item's allocated_cents back to 0 — the
          forward+compensating pair leaves the ledger unchanged.
        test_recipe:
          setup:
            - "Event with two schedule items seq1=500000, seq2=300000 and one APPLIED 500000 deposit payment (paid_to_date 500000; item1 settled, item2 allocated 0)."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon L", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Sigma Event", event_date: "2028-01-15", setup_style: "THEATER", expected_attendance: 50, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2027-12-01", amount_due_cents: 500000 }
              as: AccountingClerk
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Second", due_date: "2028-01-01", amount_due_cents: 300000 }
              as: AccountingClerk
              captures: { item2_id: $.data.id }
            - call: "GET /events/${event_id}"
              payload: {}
              as: AccountingClerk
              captures: { ev_v_pre_p1: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 500000, method: "WIRE", expected_event_version: "${ev_v_pre_p1}" }
              as: AccountingClerk
            - call: "GET /events/${event_id}"
              payload: {}
              as: AccountingClerk
              captures: { ev_v_pre_p2: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 400000, method: "ACH", expected_event_version: "${ev_v_pre_p2}" }
              as: AccountingClerk
              captures: { pay2_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/payments/${pay2_id}/void"
              payload: {}
              as: AccountingClerk
          assert:
            - "Event.${event_id}.paid_to_date_cents == 500000"
            - "PaymentScheduleItem.${item2_id}.allocated_cents == 0"
            - "PaymentScheduleItem.${item2_id}.settled == false"
