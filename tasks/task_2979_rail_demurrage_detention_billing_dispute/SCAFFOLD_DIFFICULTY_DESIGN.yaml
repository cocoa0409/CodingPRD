        distinguishing_aspect: |
          Three independent inputs collapse into one instant: a per-grounds
          multiplier applied with CEIL to adjudication_days_base, a
          FLOOR(evidence_weight / 2) discount, a 5-day floor, and finally a walk
          of N Monday-to-Friday dates strictly after the submission date. Two
