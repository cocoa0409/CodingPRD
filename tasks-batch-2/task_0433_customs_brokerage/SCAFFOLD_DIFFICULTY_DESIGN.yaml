              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "2106909998", customs_value_cents: 200000, quantity: 1, preference_claim: "NONE", pga_flag: "FDA" }
              as: LicensedBroker
            - call: "POST /pga-reviews"
              payload: { entry_id: "${entry_id}", agency: "FDA" }
              as: LicensedBroker
              captures: { pga_id: $.data.id }
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/review"
              payload: { action: "HOLD" }
              as: CBPOfficer
              as_user_id: "officer-1"
            - call: "POST /exam-slots"
              payload: { station_code: "CES_LAX", entry_id: "${entry_id}", window_start: "2026-06-06T10:00:00Z", window_end: "2026-06-06T12:00:00Z" }
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { slot_a: $.data.id }
          trigger:
            - call: "POST /exam-slots"
              payload: { station_code: "CES_LAX", entry_id: "${entry_id}", window_start: "2026-06-06T11:00:00Z", window_end: "2026-06-06T13:00:00Z" }
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EXAM_SLOT_OVERLAP"
            - "http status == 409"

      - name: statement_calendar_month_overlap_rejected
        grounds:
          - validations[priority=19]
          - entities.MonthlyStatement.fields.period_month
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          MonthlyStatement resource with CLOSED whole-calendar-month interval semantics (different
          interval arithmetic and a different resource entity from ExamSlot's half-open windows):
          a second OPEN statement for the same importer naming the same 2026-06 month collides and is
          rejected ERR_STATEMENT_PERIOD_OVERLAP (409).
        test_recipe:
          setup:
            - "An OPEN MonthlyStatement for importer X, period_month 2026-06."
            - "Admin attempts a second 2026-06 statement for the same importer."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-RT-002", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /monthly-statements"
              payload: { importer_id: "${imp_id}", period_month: "2026-06" }
              as: AccountAdmin
              captures: { stmt_a: $.data.id }
          trigger:
            - call: "POST /monthly-statements"
              payload: { importer_id: "${imp_id}", period_month: "2026-06" }
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STATEMENT_PERIOD_OVERLAP"
            - "http status == 409"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: liquidation_keeps_bond_liability_equal_to_sum_of_owed_totals
        grounds:
          - state_machines.CustomsEntry.RELEASED_to_LIQUIDATED
          - entities.Bond.fields.outstanding_liability_cents
          - entities.CustomsEntry.fields.total_duties_owed_cents
        distinguishing_aspect: |
          Conserved quantity #1 — bond.outstanding_liability_cents MUST equal the sum of
          total_duties_owed_cents over its non-terminal entries after the provisional->final swap.
          Filing reserves 520 (provisional), liquidation (origin CN, USMCA unverified) raises owed to
          69735; the bond's liability must read exactly 69735, not the stale 520 (no drift).
        test_recipe:
          setup:
            - "Single entry, origin CN, USMCA apparel line, bond high limit. Provisional 520, final 69735."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CI-001", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-CI-001", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
            - call: "POST /isf-filings/${isf_id}/file"
