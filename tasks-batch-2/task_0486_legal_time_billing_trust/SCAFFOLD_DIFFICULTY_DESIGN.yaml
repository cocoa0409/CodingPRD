  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_overpayment_on_trust_sweep
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Error-category pair {state (p5) vs business_constraint (p13)}: a trust-sweep of 999999 (well
          over the balance) against a DRAFT (not yet ISSUED) invoice violates BOTH the state precondition
          and the overpayment cap; the higher-priority state check wins -> ERR_INVALID_STATE, not
          ERR_OVERPAYMENT.
        test_recipe:
          setup:
            - "DRAFT invoice (not finalized) on a matter; client trust ledger funded 100000."
          setup_api_calls:
