            - call: "POST /bookings/${bkA}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${a_v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${bkA}/place-hold"
