            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /species"
              payload: {scientific_name: "Vireo bellii pusillus", common_name: "Least Bell's vireo", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.25, recovery_unit_population: 9000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_t_id: "$.data.id"}
            - call: "POST /conservation-banks"
              payload: {bank_name: "Mojave Habitat Bank", covered_species_id: "${species_e_id}", service_area_county_codes: ["06037"], credit_price_cents: 250000, credits_total_minted: 500.00}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {bank_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 10.00, critical_habitat_unit_id: "${chu1_id}", survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_t_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 7.35}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {consultation_id: "$.data.active_consultation_id"}
            - call: "POST /consultations/${consultation_id}/biological-assessment"
              payload: {ba_narrative: "Effects analysis for 17.35 acres of occupied habitat.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /consultations/${consultation_id}/biological-opinion"
              payload: {}
              as: WildlifeAgency
              as_user_id: "fws-user-issuer"
              captures: {bo_id: "$.data.id", bo_primary: "$.data.primary_species_scientific_name", bo_conclusion: "$.data.conclusion"}
            - call: "GET /project-actions/${action_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_status_before: "$.data.status", reason_before: "$.data.reinitiation_reason"}
          trigger:
            - call: "POST /species/${species_t_id}/listing-change"
              payload: {new_listing_status: "ENDANGERED", rationale: "Range-wide decline documented in the 5-year status review."}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
          assert:
            - "the captured ${action_status_before} == 'CONSULTATION_CONCLUDED' and ${reason_before} == 'NONE'"
            - "hop 1: the trigger returns 200 with Species.listing_status == 'ENDANGERED', listing_change_count == 1 and last_listing_change_at == '2026-10-01T00:00:00.000Z'"
            - "hop 2: GET /presence-determinations?species_id=${species_t_id} shows PD2 with requires_reevaluation == true"
            - "the cascade is conditional: GET /presence-determinations?species_id=${species_e_id} shows PD1 still requires_reevaluation == false — SP-E was not uplisted"
            - "hop 3: GET /project-actions/${action_id} reports status == 'REINITIATION_PENDING' and reinitiation_reason == 'SPECIES_UPLISTED', not 'TAKE_EXCEEDANCE'"
            - "hop 4: GET /consultations/${consultation_id} reports status == 'REINITIATION_REQUIRED', reinitiation_count == 1 and reinitiation_triggered_at == '2026-10-01T00:00:00.000Z'"
            - "the cascade tail reaches the proponent: GET /proponents/${proponent_id} reports open_reinitiation_count == 1, compliance_variant_applied == 'LIFETIME' (this proponent has no MonitoringReport at all) and compliance_standing_score == 82.00 (one OPEN_REINITIATION event, weight 18, age 0)"
            - "the already-issued BiologicalOpinion is untouched: GET /consultations/${consultation_id}/biological-opinions still returns exactly one row whose conclusion == ${bo_conclusion} and authorized_take_units == 4.00 — reinitiation does not rewrite history"
            - "POST /project-actions/${action_id}/habitat-conservation-plans now returns ERR_INVALID_STATE_TRANSITION (409): plan development requires CONSULTATION_CONCLUDED and the action has left it"
            - "a second POST /species/${species_t_id}/listing-change with new_listing_status 'ENDANGERED' returns 200 but changes nothing downstream — the LISTING_RANK did not increase, so no hop fires and listing_change_count becomes 2 while reinitiation_count stays 1"

