      - name: lot_sampling_plan_sqrt_offset_clamp_tier_mode_a
        grounds:
          - calculations.lot_sampling_plan
          - entities.ProductionLot.fields.sample_size
          - entities.ProductionLot.fields.acceptance_number
          - entities.ProductionLot.fields.sampling_plan_revision
          - entities.CellDesign.fields.retest_tightening_enabled
          - state_machines.ProductionLot.process_state.ASSEMBLY_to_LOT_TESTING
          - state_machines.ProductionLot.process_state.QUARANTINED_to_LOT_TESTING
          - concurrency_rules[sampling-plan-create-stale-lot]
        distinguishing_aspect: |
