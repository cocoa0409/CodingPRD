        excluded_because:
          difficulty_instance: combinatorial_formula / staffing_waterfall_step_order_and_cap_stop
          rationale: "The named §1.8 instance asserts the tier ordering, the FTE-target stop, the cap stop, the resulting reduction_sequence_position sequence with no gaps, and both liability/deferred_fte outcomes for the same roster."

