scenario: "927. Home Inventory & Valuables Cataloging Service: room-by-room inventory & photo/serial, valuation & appraisal linkage, insurance-documentation package, cloud vault & update, post-loss claim support, estate/downsizing use, subscription/refresh, secure sharing"
domain_name: "home-inventory-valuables-vault"
api_prefix: "/vault"

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
    - soft_delete
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Depth over breadth. Three posture gates stack on top of every ordinary write:
    (1) Subscription.status == LAPSED turns the whole Household read-only with a
    documented exclusion list; (2) Subscription.refresh_state == OVERDUE puts the
    Household in RESTRICTED, which blocks package generation and share creation
    only; (3) an OPEN LossClaim freezes the affected Items, pre-empting every
    ordinary edit rung. On top of that sit two reconciliation ledgers whose
    numbers must agree with a frozen snapshot: Policy.scheduled_consumed_cents
    (allowance conservation) and DocumentationPackage snapshot totals
    (reproducible from the snapshot, never recomputed).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
  BILLING_PERIOD_DAYS: 30
  TRIAL_DAYS: 14
  PAST_DUE_GRACE_DAYS: 10
  REFRESH_INTERVAL_DAYS: 365
  REFRESH_DUE_BAND_DAYS: 15
  REFRESH_GRACE_DAYS: 30
  APPRAISAL_VALIDITY_DAYS: 1095
  APPRAISAL_REQUIRED_THRESHOLD_CENTS: 1000000
  SCHEDULE_REQUIRED_THRESHOLD_CENTS: 500000
  APPRAISAL_BUFFER_HOURS: 24
  CLAIM_MIN_EVIDENCE_TIER: "PHOTO_SERIAL"
  PACKAGE_MIN_EVIDENCE_TIER: "PHOTO_ONLY"
  MAX_APPEALS_PER_LINE: 2
  SHARE_MAX_DURATION_DAYS: 90
  SHARE_DEFAULT_ACCESS_CAP: 10
  PACKAGE_VALIDITY_DAYS: 180
  FAIR_DIVISION_TOLERANCE_PCT: 5.0
  SELL_DISPOSITION_COST_PCT: 12.0
  DONATE_DISPOSITION_COST_PCT: 0.0
  DISCARD_DISPOSITION_COST_PCT: 0.0
  KEEP_DISPOSITION_COST_PCT: 0.0
  MAX_ITEM_QUANTITY: 999
  MIN_ITEM_QUANTITY: 1
  MONTH_DAYS_FOR_AGE: 30
  ROUNDING_MODE: "round_half_up"
  MONEY_UNIT: "integer cents (no fractional cents anywhere)"
  SUBSCRIPTION_TIERS:
    BASIC:
      monthly_fee_cents: 900
      max_items: 50
      max_assets: 200
      max_asset_bytes: 2000000000
      max_households: 1
      included_appraisal_credits: 0
      included_packages_per_period: 1
      tier_rank: 1
    PLUS:
      monthly_fee_cents: 2900
      max_items: 500
      max_assets: 2000
      max_asset_bytes: 20000000000
      max_households: 2
      included_appraisal_credits: 2
      included_packages_per_period: 4
      tier_rank: 2
    ESTATE:
      monthly_fee_cents: 7900
      max_items: 5000
      max_assets: 20000
      max_asset_bytes: 200000000000
      max_households: 5
      included_appraisal_credits: 6
      included_packages_per_period: 12
      tier_rank: 3
  WRITE_GATE_EXCLUSION_LIST:
    description: |
      Endpoints that remain callable while Household.write_gate_state == READ_ONLY
      (Subscription.status == LAPSED). Every other mutating endpoint under /vault
      is rejected at ladder rung 10 with ERR_VAULT_READ_ONLY.
    endpoints:
      - "POST /vault/subscriptions/{subscription_id}/billing-event"
      - "POST /vault/subscriptions/{subscription_id}/reinstate"
      - "POST /vault/subscriptions/{subscription_id}/attest-refresh"
      - "POST /vault/claims"
      - "POST /vault/claims/{claim_id}/lines"
      - "POST /vault/claims/{claim_id}/submit"
      - "POST /vault/claims/{claim_id}/withdraw"
      - "POST /vault/claim-lines/{claim_line_id}/adjudicate"
      - "POST /vault/claim-lines/{claim_line_id}/appeal"
      - "POST /vault/claims/{claim_id}/settle"
      - "POST /vault/share-grants/{share_grant_id}/revoke"
      - "POST /_clock/set_current_utc"
      - "every GET under /vault"
  RESTRICTED_GATE_BLOCK_LIST:
    description: |
      Endpoints blocked while Household.write_gate_state == RESTRICTED
      (Subscription.refresh_state == OVERDUE and Subscription.status != LAPSED).
      Rejected at ladder rung 11 with ERR_REFRESH_OVERDUE. All other writes pass.
    endpoints:
      - "POST /vault/packages/{package_id}/generate"
      - "POST /vault/share-grants"

entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login handle for the person; unique across the platform."
        constraints: "unique platform-wide; rejected with ERR_INVALID_REQUEST when duplicated"
      - name: full_name
        type: string
        source: input
        description: "Display name of the member."
      - name: member_role
        type: enum
        source: input
        default: "LIMITED"
        description: "The member's standing inside its household."
        constraints: "one of OWNER, LIMITED, EXECUTOR, HEIR"
      - name: household_id
        type: string
        source: input
        default: null
        description: "FK -> Household.id; null for a self-registered OWNER until POST /vault/households binds them."

  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Household display name."
      - name: address_label
        type: string
        source: input
        description: "Free-text location label used on documentation packages."
      - name: write_gate_state
        type: enum
        source: computed
        default: "OPEN"
        description: "Posture derived from the household's Subscription; gates every mutating endpoint under /vault."
        constraints: "one of OPEN, RESTRICTED, READ_ONLY"
      - name: records_freeze_active
        type: boolean
        source: computed
        default: false
        description: "True when at least one LossClaim on this household is in status OPEN, SUBMITTED, UNDER_REVIEW or SUPPLEMENT_REQUESTED."
      - name: item_count
        type: integer
        source: computed
        default: 0
        description: "Count of Item rows on this household whose lifecycle_state is in {DRAFT, CATALOGED, FROZEN}."
      - name: asset_count
        type: integer
        source: computed
        default: 0
        description: "Count of Asset rows with status STORED across all items of this household."
      - name: asset_bytes_used
        type: integer
        source: computed
        default: 0
        description: "Sum of Asset.byte_size over Asset rows with status STORED across all items of this household."
      - name: frozen_item_count
        type: integer
        source: computed
        default: 0
        description: "Count of Item rows on this household whose lifecycle_state == FROZEN."
      - name: active_share_count
        type: integer
        source: computed
        default: 0
        description: "Count of ShareGrant rows on this household whose status == ACTIVE."
      - name: total_effective_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Item.effective_value_cents over items whose lifecycle_state is in {CATALOGED, FROZEN}."

  - name: Subscription
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; at most one Subscription row per household."
      - name: tier
        type: enum
        source: input
        description: "Storage/entitlement tier; drives every quota in SUBSCRIPTION_TIERS."
        constraints: "one of BASIC, PLUS, ESTATE"
      - name: status
        type: enum
        source: system
        default: "TRIAL"
        description: "Billing lifecycle axis."
        constraints: "one of TRIAL, ACTIVE, PAST_DUE, LAPSED, CLOSED"
      - name: refresh_state
        type: enum
        source: system
        default: "CURRENT"
        description: "Independent refresh-obligation axis that advances on its own timeline, unrelated to the status axis."
        constraints: "one of CURRENT, DUE, GRACE, OVERDUE"
      - name: period_start_at
        type: datetime
        source: system
        description: "Start of the current billing period; reset on every successful payment and on reinstatement."
      - name: period_end_at
        type: datetime
        source: computed
        description: "period_start_at + BILLING_PERIOD_DAYS days."
      - name: past_due_since_at
        type: datetime
        source: system
        default: null
        description: "Clock instant at which status became PAST_DUE; null in every other status."
      - name: last_attested_at
        type: datetime
        source: system
        default: null
        description: "Clock instant of the most recent refresh attestation; null until the first attestation."
      - name: refresh_due_at
        type: datetime
        source: computed
        description: "coalesce(last_attested_at, created_at) + REFRESH_INTERVAL_DAYS days."
      - name: appraisal_credits_remaining
        type: integer
        source: computed
        default: 0
        description: "Included appraisal credits left in the current period; reset to the tier's included_appraisal_credits at every period_start_at change; never rolls over."
      - name: packages_used_this_period
        type: integer
        source: computed
        default: 0
        description: "Count of successful POST /vault/packages/{id}/generate calls since period_start_at."
      - name: monthly_fee_cents
        type: integer
        source: computed
        description: "SUBSCRIPTION_TIERS[tier].monthly_fee_cents."
      - name: last_proration_charge_cents
        type: integer
        source: computed
        default: 0
        description: "Signed net proration amount produced by the most recent change-tier call; 0 before the first tier change."

  - name: Room
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id"
      - name: name
        type: string
        source: input
        description: "Room label, e.g. Primary Bedroom."
      - name: floor_label
        type: string
        source: input
        description: "Floor or level label used for room-by-room walkthrough ordering."
      - name: item_count
        type: integer
        source: computed
        default: 0
        description: "Count of Item rows in this room whose lifecycle_state is in {DRAFT, CATALOGED, FROZEN}."

  - name: Item
    parent: Room
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id"
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the room must belong to household_id."
      - name: name
        type: string
        source: input
        description: "Item label."
      - name: category
        type: enum
        source: input
        description: "Valuation category; must match an existing CategorySchedule.category."
        constraints: "one of JEWELRY, FINE_ART, ELECTRONICS, FURNITURE, APPLIANCE, COLLECTIBLE, MUSICAL_INSTRUMENT, FIREARM, WATCH, GENERAL"
      - name: quantity
        type: integer
        source: input
        default: 1
        description: "Number of identical units catalogued under this row."
        constraints: "MIN_ITEM_QUANTITY (1) <= quantity <= MAX_ITEM_QUANTITY (999)"
      - name: serial_number
        type: string
        source: input
        default: null
        description: "Manufacturer serial or engraved identifier; required when the item's CategorySchedule.serial_required is true."
        constraints: "unique within household_id among Item rows whose lifecycle_state is in {DRAFT, CATALOGED, FROZEN}"
      - name: acquired_at
        type: datetime
        source: input
        description: "Acquisition instant; the age basis for actual-cash-value depreciation."
      - name: purchase_price_cents
        type: integer
        source: input
        default: null
        description: "Original purchase price; when null the ACV basis is unavailable."
      - name: replacement_cost_cents
        type: integer
        source: input
        default: null
        description: "Today's replacement cost; used only when LossClaim.settlement_basis == RCV."
      - name: declared_value_cents
        type: integer
        source: system
        default: 0
        description: "Owner-declared value written by POST /vault/items/{item_id}/declare-value."
      - name: declared_by_member_id
        type: string
        source: system
        default: null
        description: "FK -> Member.id; the member who most recently called declare-value on this item. Null until first declaration."
      - name: lifecycle_state
        type: enum
        source: system
        default: "DRAFT"
        description: "Cataloguing lifecycle axis."
        constraints: "one of DRAFT, CATALOGED, FROZEN, REPLACED, DISPOSED"
      - name: evidence_tier
        type: enum
        source: computed
        default: "NONE"
        description: "Evidentiary completeness axis derived from the item's STORED assets; moves up and down."
        constraints: "one of NONE, PHOTO_ONLY, PHOTO_SERIAL, DOCUMENTED"
      - name: valuation_state
        type: enum
        source: computed
        default: "UNVALUED"
        description: "Derived verdict over the three valuation regimes."
        constraints: "one of UNVALUED, DECLARED_ONLY, APPRAISAL_REQUIRED, CERTIFIED"
      - name: effective_value_cents
        type: integer
        source: computed
        default: 0
        description: "Winner of the valuation precedence order (see calculations.effective_value_resolution)."
      - name: effective_value_basis
        type: enum
        source: computed
        default: "NONE"
        description: "Which regime supplied effective_value_cents."
        constraints: "one of NONE, DECLARED, ACV, APPRAISAL"
      - name: acv_value_cents
        type: integer
        source: computed
        default: 0
        description: "Actual-cash-value at the current logical clock; 0 when purchase_price_cents is null."
      - name: coverage_mode
        type: enum
        source: computed
        default: "BLANKET"
        description: "Whether the item draws on a category blanket sublimit or on an individual schedule."
        constraints: "one of BLANKET, SCHEDULED"
      - name: scheduled_policy_id
        type: string
        source: system
        default: null
        description: "FK -> Policy.id; null while coverage_mode == BLANKET."
      - name: scheduled_value_cents
        type: integer
        source: system
        default: 0
        description: "Allowance amount this item consumes on scheduled_policy_id; 0 while coverage_mode == BLANKET."
      - name: replaces_item_id
        type: string
        source: system
        default: null
        description: "FK -> Item.id; set only on rows created by POST /vault/items/{item_id}/replace, pointing at the predecessor."
      - name: serial_chain_intact
        type: boolean
        source: computed
        default: true
        description: "False when this row was created by replace with a serial_number different from its predecessor's, breaking the provenance chain."
      - name: allocated_quantity
        type: integer
        source: computed
        default: 0
        description: "Sum of Allocation.quantity over allocations of this item whose EstatePlan.status is in {DRAFT, PROPOSED, APPROVED}. EXECUTED plans drop out because their items are already DISPOSED."
      - name: frozen_by_claim_id
        type: string
        source: system
        default: null
        description: "FK -> LossClaim.id; set when a claim freezes this item, cleared when the claim reaches SETTLED, DENIED or WITHDRAWN."

  - name: Asset
    parent: Item
    common_fields: false
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id"
      - name: asset_kind
        type: enum
        source: input
        description: "What kind of evidence this blob is."
        constraints: "one of PHOTO, SERIAL_PLATE, RECEIPT, PROVENANCE_DOC, APPRAISAL_PDF"
      - name: byte_size
        type: integer
        source: input
        description: "Stored size in bytes; counts against the tier's max_asset_bytes quota."
        constraints: "byte_size >= 1"
      - name: checksum
        type: string
        source: input
        description: "Content hash supplied by the uploading client."
      - name: captured_at
        type: datetime
        source: input
        description: "When the photo/scan was taken."
      - name: status
        type: enum
        source: system
        default: "STORED"
        description: "STORED until DELETE /vault/assets/{asset_id} soft-deletes it to DELETED."
        constraints: "one of STORED, DELETED"

  - name: CategorySchedule
    parent: null
    common_fields: false
    fields:
      - name: category
        type: enum
        source: input
        description: "The item category this schedule governs; unique across CategorySchedule rows."
        constraints: "one of JEWELRY, FINE_ART, ELECTRONICS, FURNITURE, APPLIANCE, COLLECTIBLE, MUSICAL_INSTRUMENT, FIREARM, WATCH, GENERAL"
      - name: useful_life_months
        type: integer
        source: input
        description: "Nominal service life; documentation only, the depreciation curve uses annual_depreciation_pct."
      - name: annual_depreciation_pct
        type: number
        source: input
        description: "Straight-line depreciation rate per year applied to purchase_price_cents."
      - name: salvage_floor_pct
        type: number
        source: input
        description: "ACV never falls below this percentage of purchase_price_cents."
      - name: blanket_sublimit_cents
        type: integer
        source: input
        description: "Per-category blanket coverage ceiling shared by every unscheduled item in the category."
      - name: appraisal_scope
        type: enum
        source: input
        description: "The appraiser credential scope required to certify items in this category."
        constraints: "one of JEWELRY, FINE_ART, ELECTRONICS, COLLECTIBLE, MUSICAL_INSTRUMENT, FIREARM, WATCH, GENERAL"
      - name: serial_required
        type: boolean
        source: input
        default: false
        description: "When true, Item.serial_number is mandatory for items in this category."

  - name: Appraiser
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Appraiser's public name."
      - name: credential_id
        type: string
        source: input
        description: "Credential registration number; unique across appraisers."
      - name: scope_categories
        type: array
        source: input
        description: "Appraisal scopes this credential covers."
        constraints: "non-empty array whose members are drawn from JEWELRY, FINE_ART, ELECTRONICS, COLLECTIBLE, MUSICAL_INSTRUMENT, FIREARM, WATCH, GENERAL"
      - name: linked_member_id
        type: string
        source: input
        default: null
        description: "FK -> Member.id; non-null when this appraiser is also a household member, which activates the segregation-of-duties bar."
      - name: status
        type: enum
        source: system
        default: "ACTIVE"
        description: "ACTIVE appraisers may certify; SUSPENDED appraisers may not."
        constraints: "one of ACTIVE, SUSPENDED"

  - name: Appraisal
    parent: Item
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id"
      - name: appraiser_id
        type: string
        source: input
        description: "FK -> Appraiser.id"
      - name: requested_by_member_id
        type: string
        source: system
        description: "FK -> Member.id; the X-User-ID of the Homeowner who requested the appraisal."
      - name: status
        type: enum
        source: system
        default: "REQUESTED"
        description: "Appraisal lifecycle axis."
        constraints: "one of REQUESTED, CERTIFIED, VOIDED, EXPIRED"
      - name: inspection_start_at
        type: datetime
        source: input
        description: "Start of the on-site inspection window occupying the item."
      - name: inspection_end_at
        type: datetime
        source: input
        description: "End of the on-site inspection window; must be strictly after inspection_start_at."
      - name: appraised_value_cents
        type: integer
        source: system
        default: null
        description: "Certified value; null until status becomes CERTIFIED."
      - name: certified_at
        type: datetime
        source: system
        default: null
        description: "Clock instant of certification; null until status becomes CERTIFIED."
      - name: valid_until_at
        type: datetime
        source: computed
        default: null
        description: "certified_at + APPRAISAL_VALIDITY_DAYS days; null until certified."
      - name: credit_consumed
        type: boolean
        source: system
        default: false
        description: "True when this appraisal consumed one of the subscription's included appraisal credits at request time."
      - name: void_reason
        type: enum
        source: system
        default: null
        description: "Why the appraisal was voided; null unless status == VOIDED."
        constraints: "one of APPRAISER_WITHDRAWN, SCOPE_REVOKED, VALUE_DISPUTED"

  - name: Policy
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id"
      - name: carrier_name
        type: string
        source: input
        description: "Insurance carrier name."
      - name: policy_number
        type: string
        source: input
        description: "Carrier-assigned policy number."
      - name: deductible_cents
        type: integer
        source: input
        description: "Per-claim deductible allocated across approved claim lines."
      - name: scheduled_allowance_cents
        type: integer
        source: input
        description: "Total value the policy allows to be individually scheduled."
      - name: scheduled_consumed_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Item.scheduled_value_cents over items with coverage_mode == SCHEDULED and scheduled_policy_id == this policy."
      - name: scheduled_remaining_cents
        type: integer
        source: computed
        description: "scheduled_allowance_cents - scheduled_consumed_cents; the conserved quantity of the scheduling ledger."
      - name: coverage_gap_cents
        type: integer
        source: computed
        default: 0
        description: "Latest SCHEDULED_FIRST coverage gap over the household's catalogued items."
      - name: total_effective_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Item.effective_value_cents over the household's items whose lifecycle_state is in {CATALOGED, FROZEN} and evidence_tier != NONE."
      - name: effective_from
        type: datetime
        source: input
        description: "Policy inception instant."

  - name: DocumentationPackage
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id"
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy the package documents."
      - name: status
        type: enum
        source: system
        default: "DRAFT"
        description: "Package lifecycle axis; the package body is immutable from GENERATED onward."
        constraints: "one of DRAFT, GENERATED, DELIVERED, SUPERSEDED, EXPIRED"
      - name: recipient_ref
        type: string
        source: input
        default: null
        description: "Opaque recipient handle (agent email or portal id) recorded at delivery."
      - name: generated_at
        type: datetime
        source: system
        default: null
        description: "Clock instant the snapshot was frozen; null while DRAFT."
      - name: delivered_at
        type: datetime
        source: system
        default: null
        description: "Clock instant the package was delivered; null before DELIVERED."
      - name: expires_at
        type: datetime
        source: computed
        default: null
        description: "generated_at + PACKAGE_VALIDITY_DAYS days; null while DRAFT."
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "Count of PackageLine rows under this package; frozen once GENERATED."
      - name: snapshot_total_effective_cents
        type: integer
        source: system
        default: 0
        description: "Frozen sum of PackageLine.snapshot_effective_value_cents; never recomputed after GENERATED."
      - name: snapshot_total_covered_cents
        type: integer
        source: system
        default: 0
        description: "Frozen sum of the per-line rounded covered amounts; never recomputed after GENERATED."
      - name: snapshot_coverage_gap_cents
        type: integer
        source: system
        default: 0
        description: "snapshot_total_effective_cents - snapshot_total_covered_cents, frozen at generation."
      - name: stale_line_count
        type: integer
        source: computed
        default: 0
        description: "Count of PackageLine rows whose stale flag is true; the only field that keeps moving after GENERATED."
      - name: superseded_by_package_id
        type: string
        source: system
        default: null
        description: "FK -> DocumentationPackage.id; the package that superseded this one, null otherwise."

  - name: PackageLine
    parent: DocumentationPackage
    common_fields: false
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> DocumentationPackage.id"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id"
      - name: snapshot_name
        type: string
        source: system
        description: "Item.name copied at generation time."
      - name: snapshot_category
        type: enum
        source: system
        description: "Item.category copied at generation time."
        constraints: "one of JEWELRY, FINE_ART, ELECTRONICS, FURNITURE, APPLIANCE, COLLECTIBLE, MUSICAL_INSTRUMENT, FIREARM, WATCH, GENERAL"
      - name: snapshot_evidence_tier
        type: enum
        source: system
        description: "Item.evidence_tier copied at generation time."
        constraints: "one of PHOTO_ONLY, PHOTO_SERIAL, DOCUMENTED"
      - name: snapshot_effective_value_cents
        type: integer
        source: system
        description: "Item.effective_value_cents copied at generation time."
      - name: snapshot_effective_value_basis
        type: enum
        source: system
        description: "Item.effective_value_basis copied at generation time."
        constraints: "one of DECLARED, ACV, APPRAISAL"
      - name: snapshot_covered_cents
        type: integer
        source: system
        description: "Per-line covered amount, rounded to cents at generation time before summing."
      - name: snapshot_coverage_mode
        type: enum
        source: system
        description: "Item.coverage_mode copied at generation time."
        constraints: "one of BLANKET, SCHEDULED"
      - name: stale
        type: boolean
        source: system
        default: false
        description: "Set true when the underlying item's effective_value_basis or effective_value_cents has diverged from the snapshot since generation."

  - name: LossClaim
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id"
      - name: package_id
        type: string
        source: input
        description: "FK -> DocumentationPackage.id; the frozen evidence package the claim is built on."
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; must equal the package's policy_id."
      - name: loss_date
        type: datetime
        source: input
        description: "Date of loss; the age basis for AT_LOSS_DATE actual-cash-value."
      - name: peril
        type: enum
        source: input
        description: "Cause of loss."
        constraints: "one of FIRE, THEFT, WATER, STORM, OTHER"
      - name: settlement_basis
        type: enum
        source: input
        description: "Whether lines settle on depreciated value or replacement cost."
        constraints: "one of ACV, RCV"
      - name: deductible_mode
        type: enum
        source: input
        default: "PRO_RATA"
        description: "Which deductible-allocation variant the settlement uses."
        constraints: "one of PRO_RATA, HIGHEST_VALUE_FIRST"
      - name: affected_room_ids
        type: array
        source: input
        description: "Room ids whose items are frozen by this claim; every id must be a Room of household_id."
        constraints: "non-empty array of Room.id strings"
      - name: status
        type: enum
        source: system
        default: "OPEN"
        description: "Claim lifecycle axis."
        constraints: "one of OPEN, SUBMITTED, UNDER_REVIEW, SUPPLEMENT_REQUESTED, SETTLED, DENIED, WITHDRAWN"
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: "Clock instant of submission; null while OPEN."
      - name: frozen_item_count
        type: integer
        source: computed
        default: 0
        description: "Count of Item rows this claim froze; the conserved quantity of the freeze ledger."
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "Count of ClaimLine rows under this claim."
      - name: approved_line_count
        type: integer
        source: computed
        default: 0
        description: "Count of ClaimLine rows with status APPROVED."
      - name: denied_line_count
        type: integer
        source: computed
        default: 0
        description: "Count of ClaimLine rows with status DENIED."
      - name: blocked_line_count
        type: integer
        source: computed
        default: 0
        description: "Count of ClaimLine rows whose settlement_hold is true."
      - name: total_settlement_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of ClaimLine.net_settlement_cents over APPROVED lines; 0 until submission."

  - name: ClaimLine
    parent: LossClaim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> LossClaim.id"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; at most one line per item per claim."
      - name: claimed_quantity
        type: integer
        source: input
        description: "Units claimed; must be between 1 and the item's quantity."
      - name: status
        type: enum
        source: system
        default: "PENDING"
        description: "Line adjudication axis with a bounded appeal loop."
        constraints: "one of PENDING, APPROVED, DENIED, APPEALED"
      - name: gross_value_cents
        type: integer
        source: computed
        default: 0
        description: "Pre-cap settlement value on the claim's settlement_basis; 0 until submission."
      - name: capped_value_cents
        type: integer
        source: computed
        default: 0
        description: "gross_value_cents after scheduled-value or blanket-sublimit clipping."
      - name: deductible_share_cents
        type: integer
        source: computed
        default: 0
        description: "This line's share of Policy.deductible_cents under the claim's deductible_mode."
      - name: net_settlement_cents
        type: integer
        source: computed
        default: 0
        description: "max(0, capped_value_cents - deductible_share_cents)."
      - name: appeal_count
        type: integer
        source: computed
        default: 0
        description: "Number of appeals filed on this line; capped at MAX_APPEALS_PER_LINE."
      - name: settlement_hold
        type: boolean
        source: computed
        default: false
        description: "True when the evidence package backing this line has EXPIRED, blocking settlement."
      - name: basis_downgraded
        type: boolean
        source: system
        default: false
        description: "True when the item's effective_value_basis fell away from APPRAISAL after this line was created."
      - name: denial_reason
        type: enum
        source: system
        default: null
        description: "Why the line was denied; null unless status == DENIED."
        constraints: "one of EVIDENCE_INSUFFICIENT, NOT_COVERED, VALUE_DISPUTED, DUPLICATE"

  - name: EstatePlan
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id"
      - name: executor_member_id
        type: string
        source: input
        description: "FK -> Member.id; the member acting as EstateExecutor for this plan."
      - name: status
        type: enum
        source: system
        default: "DRAFT"
        description: "Estate disposition lifecycle axis with a PROPOSED -> DRAFT revision loop."
        constraints: "one of DRAFT, PROPOSED, APPROVED, EXECUTED"
      - name: valuation_mode
        type: enum
        source: input
        default: "GROSS"
        description: "Which fair-division variant scores heir balance."
        constraints: "one of GROSS, NET"
      - name: proposed_at
        type: datetime
        source: system
        default: null
        description: "Clock instant of the most recent proposal; null while never proposed."
      - name: approved_at
        type: datetime
        source: system
        default: null
        description: "Clock instant of approval; null until APPROVED."
      - name: executed_at
        type: datetime
        source: system
        default: null
        description: "Clock instant of execution; null until EXECUTED."
      - name: approved_by_member_id
        type: string
        source: system
        default: null
        description: "FK -> Member.id; the Homeowner who approved the plan, null until APPROVED."
      - name: heir_count
        type: integer
        source: computed
        default: 0
        description: "Count of distinct Allocation.heir_member_id values that are non-null under this plan."
      - name: balance_spread_pct
        type: number
        source: computed
        default: null
        description: "Fair-division spread across heirs under valuation_mode; null while DRAFT."
      - name: balanced
        type: boolean
        source: computed
        default: false
        description: "True when balance_spread_pct <= FAIR_DIVISION_TOLERANCE_PCT."
      - name: unallocated_item_count
        type: integer
        source: computed
        default: 0
        description: "Count of household items in lifecycle_state CATALOGED whose allocated_quantity under this plan is strictly less than Item.quantity."

  - name: Allocation
    parent: EstatePlan
    common_fields: true
    fields:
      - name: estate_plan_id
        type: string
        source: input
        description: "FK -> EstatePlan.id"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id"
      - name: heir_member_id
        type: string
        source: input
        default: null
        description: "FK -> Member.id; required when disposition == KEEP, must be null for SELL, DONATE and DISCARD (sale proceeds are pooled, not attributed)."
      - name: disposition
        type: enum
        source: input
        description: "What happens to the allocated units."
        constraints: "one of KEEP, SELL, DONATE, DISCARD"
      - name: quantity
        type: integer
        source: input
        description: "Units of the item allocated by this row."
        constraints: "quantity >= 1"
      - name: allocated_value_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(Item.effective_value_cents * quantity / Item.quantity) at allocation time."
      - name: blocked
        type: boolean
        source: computed
        default: false
        description: "True when the allocated item is FROZEN by a claim, which forces the plan back to DRAFT."

  - name: ShareGrant
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id"
      - name: scope_kind
        type: enum
        source: input
        description: "What the grant exposes."
        constraints: "one of HOUSEHOLD, ROOM, PACKAGE, CLAIM"
      - name: scope_room_id
        type: string
        source: input
        default: null
        description: "FK -> Room.id; required when scope_kind == ROOM, must be null otherwise."
      - name: scope_package_id
        type: string
        source: input
        default: null
        description: "FK -> DocumentationPackage.id; required when scope_kind == PACKAGE, must be null otherwise."
      - name: scope_claim_id
        type: string
        source: input
        default: null
        description: "FK -> LossClaim.id; required when scope_kind == CLAIM, must be null otherwise."
      - name: recipient_ref
        type: string
        source: input
        description: "Opaque handle for the person the link is issued to; overlap is checked per (household_id, recipient_ref)."
      - name: redaction_level
        type: enum
        source: input
        description: "How much the recipient sees."
        constraints: "one of VALUES_HIDDEN, SERIALS_HIDDEN, FULL"
      - name: share_token
        type: string
        source: system
        description: "Server-minted opaque token used as the path segment of GET /vault/shared/{share_token}."
      - name: starts_at
        type: datetime
        source: input
        description: "Inclusive start of the grant window."
      - name: expires_at
        type: datetime
        source: input
        description: "Exclusive end of the grant window; the window is half-open [starts_at, expires_at)."
      - name: access_cap
        type: integer
        source: input
        default: 10
        description: "Maximum number of successful redemptions."
        constraints: "access_cap >= 1"
      - name: access_count
        type: integer
        source: computed
        default: 0
        description: "Number of successful redemptions so far."
      - name: status
        type: enum
        source: system
        default: "ACTIVE"
        description: "Grant lifecycle axis; four distinguishable terminal reasons."
        constraints: "one of ACTIVE, REVOKED, EXPIRED, EXHAUSTED, VOIDED_BY_SCOPE"
      - name: voided_reason
        type: enum
        source: system
        default: null
        description: "Why the grant was voided by its scope entity; null unless status == VOIDED_BY_SCOPE."
        constraints: "one of SCOPE_DELETED, SCOPE_SUPERSEDED, SUBSCRIPTION_LAPSED"

ordering_contract: |
  Every ordering in this scaffold is written as "<field> ASC/DESC". When two rows tie on
  the named field, the tie is ALWAYS broken by CREATION ORDER: the row created by the
  earlier API request wins. Creation order is a total order the server observes directly
  (the append order of each collection); it is NEVER approximated by comparing `id`
  values, which are random UUIDs and are forbidden from every business decision.
  `created_at` is stamped from the logical clock, so rows created without an intervening
  POST /_clock/set_current_utc share the same `created_at` to the millisecond - the
  creation-order tie-break is what makes those orderings deterministic.

posture_recomputation_order:
  description: |
    Deterministic recomputation contract. Two hooks, no others:
    (H1) At the END of a successful POST /_clock/set_current_utc, for every
         Subscription in the store: recompute refresh_state from the bands in
         state_machines.Subscription.refresh_state, then recompute the owning
         Household.write_gate_state, then recompute every ShareGrant status
         (ACTIVE -> EXPIRED when now >= expires_at), then recompute every
         Appraisal status (CERTIFIED -> EXPIRED when now >= valid_until_at),
         then recompute every DocumentationPackage status (GENERATED or
         DELIVERED -> EXPIRED when now >= expires_at).
    (H2) As the FIRST step of evaluating any request under /vault (before ladder
         rung 1), for the household(s) reachable from the request path or body:
         recompute Subscription.refresh_state, then Household.write_gate_state.
         This hook is read-modify-write and DOES bump the affected
         Subscription.version / Household.version when a value actually changes.
    Order within a single request is always: Subscription.refresh_state ->
    Household.write_gate_state -> ladder rung 1.

state_machines:
  - entity: Subscription
    axis: status
    initial_state: TRIAL
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /vault/subscriptions/{subscription_id}/billing-event with outcome PAYMENT_SUCCEEDED"
        actor: PlatformAdmin
        preconditions:
          - "Subscription.status == TRIAL"
        side_effects:
          - "period_start_at := logical clock now"
          - "period_end_at := period_start_at + BILLING_PERIOD_DAYS days"
          - "appraisal_credits_remaining := SUBSCRIPTION_TIERS[tier].included_appraisal_credits"
          - "packages_used_this_period := 0"
          - "Household.write_gate_state recomputed per posture_recomputation_order"
          - "increments Subscription.version by 1"
      - from: TRIAL
        to: LAPSED
        trigger: "POST /vault/subscriptions/{subscription_id}/billing-event with outcome LAPSE"
        actor: PlatformAdmin
        preconditions:
          - "Subscription.status == TRIAL"
          - "logical clock now >= Subscription.created_at + TRIAL_DAYS days"
        side_effects:
          - "Household.write_gate_state := READ_ONLY"
          - "every ShareGrant on the household with status ACTIVE and redaction_level == FULL transitions to VOIDED_BY_SCOPE with voided_reason SUBSCRIPTION_LAPSED"
          - "Household.active_share_count decremented once per voided grant"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /vault/subscriptions/{subscription_id}/billing-event with outcome PAYMENT_FAILED"
        actor: PlatformAdmin
        preconditions:
          - "Subscription.status == ACTIVE"
        side_effects:
          - "past_due_since_at := logical clock now"
          - "Household.write_gate_state unchanged (PAST_DUE households keep full write access)"
          - "increments Subscription.version by 1"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /vault/subscriptions/{subscription_id}/billing-event with outcome PAYMENT_SUCCEEDED"
        actor: PlatformAdmin
        preconditions:
          - "Subscription.status == PAST_DUE"
        side_effects:
          - "past_due_since_at := null"
          - "period_start_at := logical clock now; period_end_at recomputed"
          - "appraisal_credits_remaining := SUBSCRIPTION_TIERS[tier].included_appraisal_credits (no roll-over of the unused balance)"
          - "packages_used_this_period := 0"
          - "increments Subscription.version by 1"
      - from: PAST_DUE
        to: LAPSED
        trigger: "POST /vault/subscriptions/{subscription_id}/billing-event with outcome LAPSE"
        actor: PlatformAdmin
        preconditions:
          - "Subscription.status == PAST_DUE"
          - "logical clock now >= past_due_since_at + PAST_DUE_GRACE_DAYS days"
        side_effects:
          - "CASCADE HOP 1: Subscription.status := LAPSED"
          - "CASCADE HOP 2: caused by hop 1, Household.write_gate_state := READ_ONLY (the global write gate)"
          - "CASCADE HOP 3: caused by hop 2, every ShareGrant on that household with status ACTIVE and redaction_level == FULL transitions to VOIDED_BY_SCOPE, voided_reason := SUBSCRIPTION_LAPSED"
          - "CASCADE HOP 4: caused by hop 3, Household.active_share_count := count of remaining ACTIVE grants, and Household.version increments"
          - "increments Subscription.version by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /vault/subscriptions/{subscription_id}/reinstate"
        actor: Homeowner
        preconditions:
          - "Subscription.status == LAPSED"
          - "Household.item_count <= SUBSCRIPTION_TIERS[tier].max_items"
          - "Household.asset_count <= SUBSCRIPTION_TIERS[tier].max_assets"
          - "Household.asset_bytes_used <= SUBSCRIPTION_TIERS[tier].max_asset_bytes"
        side_effects:
          - "past_due_since_at := null"
          - "period_start_at := logical clock now; period_end_at recomputed"
          - "appraisal_credits_remaining := SUBSCRIPTION_TIERS[tier].included_appraisal_credits"
          - "packages_used_this_period := 0"
          - "Household.write_gate_state := RESTRICTED when refresh_state == OVERDUE, otherwise OPEN"
          - "ShareGrants voided with reason SUBSCRIPTION_LAPSED are NOT restored (VOIDED_BY_SCOPE is terminal)"
          - "increments Subscription.version by 1"
      - from: LAPSED
        to: CLOSED
        trigger: "POST /vault/subscriptions/{subscription_id}/billing-event with outcome CLOSE"
        actor: PlatformAdmin
        preconditions:
          - "Subscription.status == LAPSED"
        side_effects:
          - "Household.write_gate_state stays READ_ONLY permanently"
          - "increments Subscription.version by 1"
        note: "CLOSED is terminal; every further billing-event on this subscription fails ladder rung 13 with ERR_ALREADY_TERMINAL."

  - entity: Subscription
    axis: refresh_state
    initial_state: CURRENT
    terminal_states: []
    shape: cyclic
    note: |
      Parallel dimension on the SAME Subscription row as the status axis: the two
      axes evolve independently (a PAST_DUE subscription can be refresh CURRENT,
      an ACTIVE subscription can be refresh OVERDUE). Band boundaries, with
      D = refresh_due_at = coalesce(last_attested_at, created_at) + REFRESH_INTERVAL_DAYS days:
        CURRENT  while now <  D
        DUE      while D <= now <  D + REFRESH_DUE_BAND_DAYS days
        GRACE    while D + REFRESH_DUE_BAND_DAYS days <= now < D + REFRESH_GRACE_DAYS days
        OVERDUE  while now >= D + REFRESH_GRACE_DAYS days
      All four comparisons are inclusive on the lower edge, exclusive on the upper.
    transitions:
      - from: CURRENT
        to: DUE
        trigger: "system, evaluated by posture_recomputation_order hooks H1 and H2"
        actor: system
        preconditions:
          - "logical clock now >= refresh_due_at"
          - "logical clock now < refresh_due_at + REFRESH_DUE_BAND_DAYS days"
        side_effects:
          - "increments Subscription.version by 1"
      - from: DUE
        to: GRACE
        trigger: "system, evaluated by posture_recomputation_order hooks H1 and H2"
        actor: system
        preconditions:
          - "logical clock now >= refresh_due_at + REFRESH_DUE_BAND_DAYS days"
          - "logical clock now < refresh_due_at + REFRESH_GRACE_DAYS days"
        side_effects:
          - "increments Subscription.version by 1"
      - from: GRACE
        to: OVERDUE
        trigger: "system, evaluated by posture_recomputation_order hooks H1 and H2"
        actor: system
        preconditions:
          - "logical clock now >= refresh_due_at + REFRESH_GRACE_DAYS days"
        side_effects:
          - "Household.write_gate_state := RESTRICTED when Subscription.status != LAPSED and != CLOSED"
          - "increments Subscription.version by 1"
        note: "A single clock jump past D + REFRESH_GRACE_DAYS collapses CURRENT -> DUE -> GRACE -> OVERDUE in one recomputation; the terminal band wins and only one version increment is applied."
      - from: OVERDUE
        to: CURRENT
        trigger: "POST /vault/subscriptions/{subscription_id}/attest-refresh"
        actor: Homeowner
        preconditions:
          - "Subscription.refresh_state == OVERDUE"
          - "Subscription.status != CLOSED"
        side_effects:
          - "last_attested_at := logical clock now"
          - "refresh_due_at := last_attested_at + REFRESH_INTERVAL_DAYS days (the rolling window resets)"
          - "Household.write_gate_state := OPEN when Subscription.status != LAPSED, else stays READ_ONLY"
          - "increments Subscription.version by 1"
      - from: GRACE
        to: CURRENT
        trigger: "POST /vault/subscriptions/{subscription_id}/attest-refresh"
        actor: Homeowner
        preconditions:
          - "Subscription.refresh_state == GRACE"
          - "Subscription.status != CLOSED"
        side_effects:
          - "last_attested_at := logical clock now; refresh_due_at recomputed"
          - "increments Subscription.version by 1"
      - from: DUE
        to: CURRENT
        trigger: "POST /vault/subscriptions/{subscription_id}/attest-refresh"
        actor: Homeowner
        preconditions:
          - "Subscription.refresh_state == DUE"
          - "Subscription.status != CLOSED"
        side_effects:
          - "last_attested_at := logical clock now; refresh_due_at recomputed"
          - "increments Subscription.version by 1"
      - from: CURRENT
        to: CURRENT
        trigger: "POST /vault/subscriptions/{subscription_id}/attest-refresh"
        actor: Homeowner
        preconditions:
          - "Subscription.refresh_state == CURRENT"
          - "Subscription.status != CLOSED"
        side_effects:
          - "last_attested_at := logical clock now; refresh_due_at pushed forward by REFRESH_INTERVAL_DAYS days from now"
          - "increments Subscription.version by 1"
        note: "Early attestation is legal and is the self-loop that makes this axis cyclic."

  - entity: Household
    axis: write_gate_state
    initial_state: OPEN
    terminal_states: []
    shape: posture_driven
    note: "Derived posture. Never set by a direct endpoint; only by the two hooks in posture_recomputation_order. Precedence: READ_ONLY (status LAPSED or CLOSED) outranks RESTRICTED (refresh_state OVERDUE) outranks OPEN."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system, when the household's Subscription.refresh_state becomes OVERDUE"
        actor: system
        preconditions:
          - "Subscription.refresh_state == OVERDUE"
          - "Subscription.status not in {LAPSED, CLOSED}"
        side_effects:
          - "POST /vault/packages/{package_id}/generate and POST /vault/share-grants start failing at ladder rung 11 with ERR_REFRESH_OVERDUE"
          - "increments Household.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system, after POST /vault/subscriptions/{subscription_id}/attest-refresh"
        actor: system
        preconditions:
          - "Subscription.refresh_state in {CURRENT, DUE, GRACE}"
          - "Subscription.status not in {LAPSED, CLOSED}"
        side_effects:
          - "increments Household.version by 1"
      - from: OPEN
        to: READ_ONLY
        trigger: "system, when the household's Subscription.status becomes LAPSED or CLOSED"
        actor: system
        preconditions:
          - "Subscription.status in {LAPSED, CLOSED}"
        side_effects:
          - "every mutating /vault endpoint outside WRITE_GATE_EXCLUSION_LIST starts failing at ladder rung 10 with ERR_VAULT_READ_ONLY"
          - "increments Household.version by 1"
      - from: RESTRICTED
        to: READ_ONLY
        trigger: "system, when the household's Subscription.status becomes LAPSED or CLOSED"
        actor: system
        preconditions:
          - "Subscription.status in {LAPSED, CLOSED}"
        side_effects:
          - "increments Household.version by 1"
      - from: READ_ONLY
        to: OPEN
        trigger: "system, after POST /vault/subscriptions/{subscription_id}/reinstate"
        actor: system
        preconditions:
          - "Subscription.status == ACTIVE"
          - "Subscription.refresh_state != OVERDUE"
        side_effects:
          - "increments Household.version by 1"
      - from: READ_ONLY
        to: RESTRICTED
        trigger: "system, after POST /vault/subscriptions/{subscription_id}/reinstate"
        actor: system
        preconditions:
          - "Subscription.status == ACTIVE"
          - "Subscription.refresh_state == OVERDUE"
        side_effects:
          - "increments Household.version by 1"

  - entity: Item
    axis: lifecycle_state
    initial_state: DRAFT
    terminal_states: [REPLACED, DISPOSED]
    shape: branching_with_cycle
    transitions:
      - from: DRAFT
        to: CATALOGED
        trigger: "system, re-evaluated at the end of POST /vault/items/{item_id}/assets and POST /vault/items/{item_id}/declare-value"
        actor: system
        preconditions:
          - "Item.evidence_tier != NONE"
          - "Item.declared_value_cents > 0"
        side_effects:
          - "Household.item_count and Room.item_count are unchanged (DRAFT items already count)"
          - "Household.total_effective_value_cents recomputed"
          - "increments Item.version by 1"
        note: "Both producing endpoints re-evaluate the same predicate; whichever call completes the pair flips the item."
      - from: CATALOGED
        to: FROZEN
        trigger: "system side effect of POST /vault/claims"
        actor: system
        preconditions:
          - "Item.room_id is a member of LossClaim.affected_room_ids"
          - "Item.lifecycle_state == CATALOGED"
        side_effects:
          - "Item.frozen_by_claim_id := the new claim's id"
          - "Household.frozen_item_count incremented; Household.records_freeze_active := true"
          - "LossClaim.frozen_item_count incremented"
          - "increments Item.version by 1"
      - from: FROZEN
        to: CATALOGED
        trigger: "system side effect of POST /vault/claims/{claim_id}/settle, POST /vault/claims/{claim_id}/withdraw, or the UNDER_REVIEW -> DENIED auto-transition"
        actor: system
        preconditions:
          - "Item.frozen_by_claim_id == the claim reaching SETTLED, WITHDRAWN or DENIED"
        side_effects:
          - "Item.frozen_by_claim_id := null"
          - "Household.frozen_item_count decremented; Household.records_freeze_active := (frozen_item_count > 0)"
          - "increments Item.version by 1"
      - from: CATALOGED
        to: REPLACED
        trigger: "POST /vault/items/{item_id}/replace"
        actor: Homeowner
        preconditions:
          - "Item.lifecycle_state == CATALOGED"
          - "Item.frozen_by_claim_id is null"
        side_effects:
          - "a new Item row is created in DRAFT with replaces_item_id := this item's id, same household_id, room_id and category"
          - "the new row's serial_chain_intact := (submitted serial_number equals this item's serial_number)"
          - "when this item had coverage_mode == SCHEDULED, its scheduled_value_cents is released: Policy.scheduled_consumed_cents decremented by exactly that amount, Policy.scheduled_remaining_cents recomputed, and this item's coverage_mode := BLANKET, scheduled_policy_id := null, scheduled_value_cents := 0"
          - "the predecessor's serial_number is freed for uniqueness (REPLACED rows are excluded from the uniqueness scope)"
          - "increments Item.version by 1 and Policy.version by 1 when an allowance release happened"
      - from: CATALOGED
        to: DISPOSED
        trigger: "system side effect of POST /vault/estate-plans/{estate_plan_id}/execute"
        actor: system
        preconditions:
          - "EstatePlan.status == APPROVED at the moment execute is called"
          - "the sum of Allocation.quantity for this item under the plan with disposition in {SELL, DONATE, DISCARD} equals Item.quantity"
        side_effects:
          - "Household.item_count decremented; Household.total_effective_value_cents recomputed"
          - "when the item was SCHEDULED, its allowance is released back to the policy exactly as in the REPLACED transition"
          - "increments Item.version by 1"

  - entity: Item
    axis: evidence_tier
    initial_state: NONE
    terminal_states: []
    shape: parallel
    note: |
      Second, independent axis on the SAME Item row. It is recomputed wholesale by
      calculations.item_evidence_tier after every POST /vault/items/{item_id}/assets,
      every DELETE /vault/assets/{asset_id} and every PATCH /vault/items/{item_id}
      that changes serial_number. Any (from, to) pair the recomputation produces is
      legal, including multi-step jumps such as NONE -> PHOTO_SERIAL (first PHOTO
      uploaded on an item that already carries a serial_number) and
      DOCUMENTED -> NONE (the only PHOTO deleted). The rows below name the four
      canonical upgrades and the three canonical downgrades.
    transitions:
      - from: NONE
        to: PHOTO_ONLY
        trigger: "POST /vault/items/{item_id}/assets with asset_kind PHOTO"
        actor: Homeowner
        preconditions:
          - "the item has no other STORED asset and serial_number is null"
        side_effects:
          - "Household.asset_count and Household.asset_bytes_used incremented"
          - "increments Item.version by 1"
      - from: PHOTO_ONLY
        to: PHOTO_SERIAL
        trigger: "POST /vault/items/{item_id}/assets with asset_kind SERIAL_PLATE, or PATCH /vault/items/{item_id} setting serial_number"
        actor: Homeowner
        preconditions:
          - "the item has at least one STORED PHOTO asset"
        side_effects:
          - "the item becomes eligible for ClaimLine creation (CLAIM_MIN_EVIDENCE_TIER is PHOTO_SERIAL)"
          - "increments Item.version by 1"
      - from: PHOTO_SERIAL
        to: DOCUMENTED
        trigger: "POST /vault/items/{item_id}/assets with asset_kind RECEIPT or PROVENANCE_DOC"
        actor: Homeowner
        preconditions:
          - "the item is already at PHOTO_SERIAL"
        side_effects:
          - "increments Item.version by 1"
      - from: NONE
        to: PHOTO_SERIAL
        trigger: "POST /vault/items/{item_id}/assets with asset_kind PHOTO on an item whose serial_number is non-null"
        actor: Homeowner
        preconditions:
          - "Item.serial_number is not null and the item has no STORED asset yet"
        side_effects:
          - "increments Item.version by 1"
      - from: DOCUMENTED
        to: PHOTO_SERIAL
        trigger: "DELETE /vault/assets/{asset_id} removing the last RECEIPT/PROVENANCE_DOC asset"
        actor: Homeowner
        preconditions:
          - "no STORED asset of kind RECEIPT or PROVENANCE_DOC remains after the delete"
        side_effects:
          - "Household.asset_count and Household.asset_bytes_used decremented"
          - "increments Item.version by 1"
      - from: PHOTO_SERIAL
        to: PHOTO_ONLY
        trigger: "DELETE /vault/assets/{asset_id} removing the last SERIAL_PLATE asset"
        actor: Homeowner
        preconditions:
          - "Item.serial_number is null and no STORED SERIAL_PLATE asset remains"
        side_effects:
          - "CASCADE HOP 1: Asset.status := DELETED"
          - "CASCADE HOP 2: caused by hop 1, Item.evidence_tier recomputed downward to PHOTO_ONLY"
          - "CASCADE HOP 3: caused by hop 2, every ClaimLine in status PENDING on this item transitions to DENIED with denial_reason EVIDENCE_INSUFFICIENT, because PHOTO_ONLY is below CLAIM_MIN_EVIDENCE_TIER"
          - "CASCADE HOP 4: caused by hop 3, LossClaim.denied_line_count recomputed and, when denied_line_count == line_count and the claim is in UNDER_REVIEW, the claim transitions UNDER_REVIEW -> DENIED"
          - "increments Item.version by 1"
      - from: PHOTO_ONLY
        to: NONE
        trigger: "DELETE /vault/assets/{asset_id} removing the last PHOTO asset"
        actor: Homeowner
        preconditions:
          - "no STORED asset of kind PHOTO remains after the delete"
        side_effects:
          - "the item is excluded from every future package generation (below PACKAGE_MIN_EVIDENCE_TIER)"
          - "increments Item.version by 1"

  - entity: Appraisal
    axis: status
    initial_state: REQUESTED
    terminal_states: [VOIDED, EXPIRED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: CERTIFIED
        trigger: "POST /vault/appraisals/{appraisal_id}/certify"
        actor: Appraiser
        preconditions:
          - "Appraisal.status == REQUESTED"
          - "X-User-ID equals Appraisal.appraiser_id"
          - "Appraiser.status == ACTIVE"
          - "logical clock now >= Appraisal.inspection_end_at"
          - "the appraised Item.lifecycle_state != FROZEN (enforced at ladder rung 12, so the observable error is ERR_ITEM_FROZEN, never ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE HOP 1: appraised_value_cents := body value; certified_at := now; valid_until_at := certified_at + APPRAISAL_VALIDITY_DAYS days"
          - "CASCADE HOP 2: caused by hop 1, Item.effective_value_cents / effective_value_basis recomputed by calculations.effective_value_resolution (basis becomes APPRAISAL) and Item.valuation_state := CERTIFIED"
          - "CASCADE HOP 3: caused by hop 2, Household.total_effective_value_cents recomputed"
          - "CASCADE HOP 4: caused by hop 2, every Policy of the item's household has total_effective_value_cents and coverage_gap_cents recomputed under the SCHEDULED_FIRST variant"
          - "increments Appraisal.version by 1, Item.version by 1, Household.version by 1"
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /vault/appraisals/{appraisal_id}/void"
        actor: PlatformAdmin
        preconditions:
          - "Appraisal.status == REQUESTED"
        side_effects:
          - "void_reason := body value"
          - "when credit_consumed is true the credit is NOT refunded (entitlements never roll back)"
          - "the item's appraisal hold is released, freeing its inspection window for a new request"
          - "increments Appraisal.version by 1"
      - from: CERTIFIED
        to: VOIDED
        trigger: "POST /vault/appraisals/{appraisal_id}/void"
        actor: PlatformAdmin
        preconditions:
          - "Appraisal.status == CERTIFIED"
        side_effects:
          - "CASCADE HOP 1: Appraisal.status := VOIDED, void_reason := body value"
          - "CASCADE HOP 2: caused by hop 1, the item loses its APPRAISAL basis - Item.effective_value_cents / effective_value_basis / valuation_state are recomputed by calculations.effective_value_resolution"
          - "CASCADE HOP 3: caused by hop 2, every Policy of the item's household has total_effective_value_cents and coverage_gap_cents recomputed - this hop does NOT require the item to be scheduled"
          - "CASCADE HOP 4: caused by hop 3, every DocumentationPackage with that policy_id in status GENERATED transitions GENERATED -> EXPIRED unconditionally - the trigger is that hop 3 executed, NOT whether the recomputed coverage_gap_cents actually changed - and every PackageLine of any package referencing that item has stale := true with the owning package's stale_line_count recomputed"
          - "CASCADE HOP 5: caused by hop 4, every ClaimLine in status PENDING whose LossClaim.package_id is one of those now-EXPIRED packages gets settlement_hold := true, and each such LossClaim.blocked_line_count is recomputed"
          - "increments Appraisal.version, Item.version, Policy.version, each affected DocumentationPackage.version and each affected ClaimLine.version by 1"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system, evaluated by posture_recomputation_order hook H1 and as the first step of POST /vault/packages/{package_id}/generate"
        actor: system
        preconditions:
          - "logical clock now >= Appraisal.valid_until_at"
        side_effects:
          - "Item.effective_value_basis falls back to ACV or DECLARED per calculations.effective_value_resolution"
          - "when Item.declared_value_cents >= APPRAISAL_REQUIRED_THRESHOLD_CENTS the item's valuation_state := APPRAISAL_REQUIRED and it is excluded from package generation and refused for new claim lines"
          - "increments Appraisal.version by 1 and Item.version by 1"

  - entity: DocumentationPackage
    axis: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    shape: branching
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /vault/packages/{package_id}/generate"
        actor: Homeowner
        preconditions:
          - "DocumentationPackage.status == DRAFT"
          - "Household.write_gate_state == OPEN"
          - "Subscription.packages_used_this_period < SUBSCRIPTION_TIERS[tier].included_packages_per_period"
          - "at least one eligible Item exists (lifecycle_state in {CATALOGED, FROZEN}, evidence_tier >= PACKAGE_MIN_EVIDENCE_TIER, valuation_state != APPRAISAL_REQUIRED)"
          - "expected_household_version equals Household.version"
        side_effects:
          - "CASCADE HOP 1: one immutable PackageLine per eligible item is created; snapshot totals frozen by calculations.package_totals_snapshot; generated_at := now; expires_at := generated_at + PACKAGE_VALIDITY_DAYS days; line_count set"
          - "CASCADE HOP 2: caused by hop 1, any prior DocumentationPackage for the same policy_id in status DELIVERED transitions DELIVERED -> SUPERSEDED with superseded_by_package_id := this package's id"
          - "CASCADE HOP 3: caused by hop 2, every ShareGrant with status ACTIVE whose scope_package_id is that superseded package transitions to VOIDED_BY_SCOPE with voided_reason SCOPE_SUPERSEDED"
          - "CASCADE HOP 4: caused by hop 3, Household.active_share_count is recomputed"
          - "Subscription.packages_used_this_period incremented by 1"
          - "increments Household.version by 1 (OCC parent), DocumentationPackage.version by 1, Subscription.version by 1"
      - from: GENERATED
        to: DELIVERED
        trigger: "POST /vault/packages/{package_id}/deliver"
        actor: Homeowner
        preconditions:
          - "DocumentationPackage.status == GENERATED"
          - "logical clock now < DocumentationPackage.expires_at"
        side_effects:
          - "delivered_at := now; recipient_ref := body value"
          - "snapshot totals are NOT recomputed - the package body stays exactly as frozen at GENERATED"
          - "increments DocumentationPackage.version by 1"
      - from: DELIVERED
        to: SUPERSEDED
        trigger: "system side effect of a later POST /vault/packages/{package_id}/generate on the same policy_id"
        actor: system
        preconditions:
          - "DocumentationPackage.status == DELIVERED"
          - "the newly generated package shares this package's policy_id"
        side_effects:
          - "superseded_by_package_id := the new package's id"
          - "every ACTIVE ShareGrant scoped to this package transitions to VOIDED_BY_SCOPE with voided_reason SCOPE_SUPERSEDED"
          - "increments DocumentationPackage.version by 1"
      - from: GENERATED
        to: EXPIRED
        trigger: "system, either by posture_recomputation_order hook H1 when now >= expires_at, or as CASCADE HOP 4 of the Appraisal CERTIFIED -> VOIDED chain"
        actor: system
        preconditions:
          - "DocumentationPackage.status == GENERATED"
          - "logical clock now >= expires_at, OR hop 3 of the Appraisal CERTIFIED -> VOIDED cascade executed for a Policy this package documents (unconditional on the numeric outcome of that recompute)"
        side_effects:
          - "every ClaimLine in status PENDING under a LossClaim whose package_id is this package gets settlement_hold := true"
          - "each such LossClaim.blocked_line_count recomputed"
          - "increments DocumentationPackage.version by 1"
      - from: DELIVERED
        to: EXPIRED
        trigger: "system, by posture_recomputation_order hook H1 when now >= expires_at"
        actor: system
        preconditions:
          - "DocumentationPackage.status == DELIVERED"
          - "logical clock now >= expires_at"
        side_effects:
          - "every ACTIVE ShareGrant scoped to this package transitions to VOIDED_BY_SCOPE with voided_reason SCOPE_SUPERSEDED"
          - "increments DocumentationPackage.version by 1"

  - entity: LossClaim
    axis: status
    initial_state: OPEN
    terminal_states: [SETTLED, DENIED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /vault/claims/{claim_id}/submit"
        actor: Homeowner
        preconditions:
          - "LossClaim.status == OPEN"
          - "LossClaim.line_count >= 1"
          - "the claim's DocumentationPackage.status is in {GENERATED, DELIVERED}"
        side_effects:
          - "calculations.claim_settlement_allocation runs: every ClaimLine gets gross_value_cents, capped_value_cents, deductible_share_cents and net_settlement_cents"
          - "submitted_at := logical clock now"
          - "LossClaim.total_settlement_cents := sum of net_settlement_cents over lines in status APPROVED (zero at submission because every line is still PENDING)"
          - "increments LossClaim.version by 1 and every ClaimLine.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system side effect of the first POST /vault/claim-lines/{claim_line_id}/adjudicate under this claim"
        actor: system
        preconditions:
          - "LossClaim.status == SUBMITTED"
        side_effects:
          - "increments LossClaim.version by 1"
      - from: UNDER_REVIEW
        to: SUPPLEMENT_REQUESTED
        trigger: "system side effect of POST /vault/claim-lines/{claim_line_id}/appeal"
        actor: system
        preconditions:
          - "LossClaim.status == UNDER_REVIEW"
        side_effects:
          - "increments LossClaim.version by 1"
      - from: SUPPLEMENT_REQUESTED
        to: UNDER_REVIEW
        trigger: "system side effect of POST /vault/claim-lines/{claim_line_id}/adjudicate on an APPEALED line"
        actor: system
        preconditions:
          - "LossClaim.status == SUPPLEMENT_REQUESTED"
          - "no ClaimLine under this claim remains in status APPEALED after the adjudication"
        side_effects:
          - "increments LossClaim.version by 1"
        note: "This is the cycle: UNDER_REVIEW -> SUPPLEMENT_REQUESTED -> UNDER_REVIEW, bounded by MAX_APPEALS_PER_LINE per line."
      - from: UNDER_REVIEW
        to: SETTLED
        trigger: "POST /vault/claims/{claim_id}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "LossClaim.status == UNDER_REVIEW"
          - "no ClaimLine under this claim is in status PENDING or APPEALED"
          - "LossClaim.blocked_line_count == 0"
          - "LossClaim.approved_line_count >= 1"
        side_effects:
          - "LossClaim.total_settlement_cents := sum of net_settlement_cents over APPROVED lines"
          - "every Item frozen by this claim transitions FROZEN -> CATALOGED and frozen_by_claim_id := null"
          - "Household.frozen_item_count decremented by exactly LossClaim.frozen_item_count; Household.records_freeze_active recomputed"
          - "increments LossClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system, when the last PENDING/APPEALED line becomes DENIED (via adjudicate or via the evidence-downgrade cascade)"
        actor: system
        preconditions:
          - "LossClaim.denied_line_count == LossClaim.line_count"
        side_effects:
          - "LossClaim.total_settlement_cents := 0"
          - "every Item frozen by this claim transitions FROZEN -> CATALOGED"
          - "Household.frozen_item_count decremented by exactly LossClaim.frozen_item_count"
          - "increments LossClaim.version by 1"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /vault/claims/{claim_id}/withdraw"
        actor: Homeowner
        preconditions:
          - "LossClaim.status == OPEN"
        side_effects:
          - "COMPENSATING ACTION: every Item with frozen_by_claim_id == this claim transitions FROZEN -> CATALOGED and frozen_by_claim_id := null"
          - "Household.frozen_item_count decremented by exactly LossClaim.frozen_item_count, restoring the pre-claim value"
          - "every ShareGrant with status ACTIVE and scope_claim_id == this claim transitions to VOIDED_BY_SCOPE with voided_reason SCOPE_DELETED"
          - "increments LossClaim.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /vault/claims/{claim_id}/withdraw"
        actor: Homeowner
        preconditions:
          - "LossClaim.status == SUBMITTED"
        side_effects:
          - "identical compensating side effects as the OPEN -> WITHDRAWN transition"
          - "increments LossClaim.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /vault/claims/{claim_id}/withdraw"
        actor: Homeowner
        preconditions:
          - "LossClaim.status == UNDER_REVIEW"
        side_effects:
          - "identical compensating side effects as the OPEN -> WITHDRAWN transition"
          - "increments LossClaim.version by 1"

  - entity: ClaimLine
    axis: status
    initial_state: PENDING
    terminal_states: [APPROVED]
    shape: cyclic
    note: "DENIED is deliberately NOT terminal: it re-enters the loop through APPEALED until appeal_count reaches MAX_APPEALS_PER_LINE (2)."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /vault/claim-lines/{claim_line_id}/adjudicate with decision APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "ClaimLine.status == PENDING"
          - "LossClaim.status in {SUBMITTED, UNDER_REVIEW}"
          - "ClaimLine.settlement_hold == false"
        side_effects:
          - "LossClaim.approved_line_count recomputed; LossClaim SUBMITTED -> UNDER_REVIEW when it was SUBMITTED"
          - "increments ClaimLine.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /vault/claim-lines/{claim_line_id}/adjudicate with decision DENY, or the evidence-downgrade cascade from DELETE /vault/assets/{asset_id}"
        actor: ClaimsAdjuster
        preconditions:
          - "ClaimLine.status == PENDING"
        side_effects:
          - "denial_reason := body value for the adjudicate path, or EVIDENCE_INSUFFICIENT for the cascade path"
          - "net_settlement_cents := 0"
          - "LossClaim.denied_line_count recomputed; the claim auto-transitions UNDER_REVIEW -> DENIED when denied_line_count == line_count"
          - "increments ClaimLine.version by 1"
      - from: DENIED
        to: APPEALED
        trigger: "POST /vault/claim-lines/{claim_line_id}/appeal"
        actor: Homeowner
        preconditions:
          - "ClaimLine.status == DENIED"
          - "ClaimLine.appeal_count < MAX_APPEALS_PER_LINE"
          - "LossClaim.status in {UNDER_REVIEW, SUPPLEMENT_REQUESTED}"
        side_effects:
          - "appeal_count incremented by 1"
          - "denial_reason := null"
          - "LossClaim UNDER_REVIEW -> SUPPLEMENT_REQUESTED"
          - "increments ClaimLine.version by 1"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /vault/claim-lines/{claim_line_id}/adjudicate with decision APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "ClaimLine.status == APPEALED"
          - "ClaimLine.settlement_hold == false"
        side_effects:
          - "LossClaim.approved_line_count and denied_line_count recomputed"
          - "LossClaim SUPPLEMENT_REQUESTED -> UNDER_REVIEW when no APPEALED line remains"
          - "increments ClaimLine.version by 1"
      - from: APPEALED
        to: DENIED
        trigger: "POST /vault/claim-lines/{claim_line_id}/adjudicate with decision DENY"
        actor: ClaimsAdjuster
        preconditions:
          - "ClaimLine.status == APPEALED"
        side_effects:
          - "denial_reason := body value"
          - "LossClaim SUPPLEMENT_REQUESTED -> UNDER_REVIEW when no APPEALED line remains"
          - "increments ClaimLine.version by 1"

  - entity: EstatePlan
    axis: status
    initial_state: DRAFT
    terminal_states: [EXECUTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /vault/estate-plans/{estate_plan_id}/propose"
        actor: EstateExecutor
        preconditions:
          - "EstatePlan.status == DRAFT"
          - "EstatePlan.unallocated_item_count == 0 (CONSERVATION: every unit of every CATALOGED item is allocated exactly once)"
          - "no Allocation under this plan has blocked == true"
        side_effects:
          - "calculations.estate_fair_division_balance runs under EstatePlan.valuation_mode; balance_spread_pct and balanced are written"
          - "proposed_at := logical clock now"
          - "increments EstatePlan.version by 1"
      - from: PROPOSED
        to: PROPOSED
        trigger: "POST /vault/estate-plans/{estate_plan_id}/propose on an already PROPOSED plan"
        actor: EstateExecutor
        preconditions:
          - "EstatePlan.status == PROPOSED"
          - "EstatePlan.unallocated_item_count == 0"
          - "no Allocation under this plan has blocked == true"
        side_effects:
          - "valuation_mode := body value when supplied"
          - "balance_spread_pct and balanced recomputed under the (possibly new) valuation_mode"
          - "proposed_at := logical clock now"
          - "increments EstatePlan.version by 1"
        note: "Re-proposal self-loop; this is what makes the GROSS vs NET fair-division variants directly comparable on one set of allocations."
      - from: PROPOSED
        to: DRAFT
        trigger: "DELETE /vault/allocations/{allocation_id} on a PROPOSED plan, or the system cascade from POST /vault/claims freezing an allocated item"
        actor: EstateExecutor
        preconditions:
          - "EstatePlan.status == PROPOSED"
        side_effects:
          - "balance_spread_pct := null; balanced := false; proposed_at is left at its previous value"
          - "unallocated_item_count recomputed"
          - "increments EstatePlan.version by 1"
        note: "This is the revision loop that makes the axis cyclic."
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /vault/estate-plans/{estate_plan_id}/approve"
        actor: Homeowner
        preconditions:
          - "EstatePlan.status == PROPOSED"
          - "SEGREGATION OF DUTIES: X-User-ID != EstatePlan.executor_member_id"
          - "EstatePlan.balanced == true, unless the request body sets override_unbalanced to true"
        side_effects:
          - "approved_at := logical clock now; approved_by_member_id := X-User-ID"
          - "increments EstatePlan.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /vault/estate-plans/{estate_plan_id}/execute"
        actor: EstateExecutor
        preconditions:
          - "EstatePlan.status == APPROVED"
          - "no Allocation under this plan has blocked == true"
        side_effects:
          - "CASCADE HOP 1: EstatePlan.status := EXECUTED; executed_at := now"
          - "CASCADE HOP 2: caused by hop 1, every Item whose SELL/DONATE/DISCARD allocations cover its full quantity transitions CATALOGED -> DISPOSED"
          - "CASCADE HOP 3: caused by hop 2, each disposed item that was SCHEDULED releases its allowance: Policy.scheduled_consumed_cents decremented and Policy.scheduled_remaining_cents recomputed"
          - "CASCADE HOP 4: caused by hop 3, Policy.coverage_gap_cents recomputed and Household.item_count / total_effective_value_cents recomputed"
          - "increments EstatePlan.version, every disposed Item.version, Policy.version and Household.version by 1"

  - entity: ShareGrant
    axis: status
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED, EXHAUSTED, VOIDED_BY_SCOPE]
    shape: branching
    note: "Fork with four divergent terminal branches; each carries a different observable side-effect set and a different error surface on GET /vault/shared/{share_token}."
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /vault/share-grants/{share_grant_id}/revoke"
        actor: Homeowner
        preconditions:
          - "ShareGrant.status == ACTIVE"
        side_effects:
          - "Household.active_share_count decremented"
          - "increments ShareGrant.version by 1 and Household.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, by posture_recomputation_order hook H1 when now >= expires_at"
        actor: system
        preconditions:
          - "logical clock now >= ShareGrant.expires_at"
        side_effects:
          - "Household.active_share_count decremented"
          - "increments ShareGrant.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system side effect of the GET /vault/shared/{share_token} redemption that brings access_count up to access_cap"
        actor: system
        preconditions:
          - "access_count + 1 == access_cap after this redemption"
        side_effects:
          - "the redemption itself SUCCEEDS and returns the redacted view; only the next one fails"
          - "Household.active_share_count decremented"
          - "increments ShareGrant.version by 1"
      - from: ACTIVE
        to: VOIDED_BY_SCOPE
        trigger: "system, from the package-supersede cascade, the package-expiry cascade, the claim-withdraw cascade, or the subscription-lapse cascade"
        actor: system
        preconditions:
          - "ShareGrant.status == ACTIVE"
          - "the grant's scope entity was superseded, expired, withdrawn, or the household's subscription lapsed while redaction_level == FULL"
        side_effects:
          - "voided_reason := SCOPE_SUPERSEDED (package superseded or expired), SCOPE_DELETED (scope claim withdrawn), or SUBSCRIPTION_LAPSED (subscription lapsed)"
          - "Household.active_share_count decremented"
          - "increments ShareGrant.version by 1"

concurrency_rules:
  - rule_id: item-schedule-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /vault/items/{item_id}/schedule"
    occ_field: "expected_policy_version"
    description: |
      Scheduling an item against a Policy whose version has advanced since the
      client last read it is rejected. Another writer has already consumed part
      of the same scheduled_allowance_cents pool (a legitimate operation under
      the allowance ledger), so the current writer's view of
      scheduled_remaining_cents is stale and its own schedule request would be
      sized against a number that no longer exists.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: tier-change-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /vault/subscriptions/{subscription_id}/change-tier"
    occ_field: "expected_subscription_version"
    description: |
      Changing tier against a Subscription whose version has advanced is
      rejected. Proration is computed from period_start_at and monthly_fee_cents,
      both of which a prior billing-event or tier change may have already
      rewritten; a stale version means the client priced the change against a
      superseded period.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

  - rule_id: package-generate-stale-household
    parent_entity: Household
    write_endpoint: "POST /vault/packages/{package_id}/generate"
    occ_field: "expected_household_version"
    description: |
      Generating a package snapshots the household at a point in time and
      supersedes the prior DELIVERED package for the same policy. A generation
      whose expected_household_version is behind Household.version is rejected,
      because the snapshot the client intended to freeze is not the household
      state that exists now.
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412

  - rule_id: allocation-create-stale-plan
    parent_entity: EstatePlan
    write_endpoint: "POST /vault/estate-plans/{estate_plan_id}/allocations"
    occ_field: "expected_estate_plan_version"
    description: |
      Adding an allocation to an EstatePlan whose version has advanced is
      rejected. Each allocation consumes units out of the plan-wide conservation
      budget, so a writer holding a stale plan version is sizing its quantity
      against an unallocated remainder that another allocation already claimed.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

calculations:
  - name: item_actual_cash_value
    trigger: "Recomputed on POST /vault/items, PATCH /vault/items/{item_id}, POST /vault/items/{item_id}/declare-value, POST /_clock/set_current_utc, and read as an input by package_totals_snapshot and claim_settlement_allocation."
    algorithm: decay_function
    formula: |
      # inputs: Item.purchase_price_cents, Item.acquired_at,
      #         CategorySchedule row whose category == Item.category, and an `as_of` instant.
      if Item.purchase_price_cents is null or no CategorySchedule exists for Item.category:
          return 0                      # the ACV regime is unavailable for this item
      elapsed_days   = floor( (as_of - Item.acquired_at) expressed in whole days )
      age_months     = max(0, floor( elapsed_days / MONTH_DAYS_FOR_AGE ))       # 30-day months
      depreciated_pct = min(100.0, (CategorySchedule.annual_depreciation_pct / 12.0) * age_months)
      raw_cents      = Item.purchase_price_cents * (1.0 - depreciated_pct / 100.0)
      floor_cents    = Item.purchase_price_cents * (CategorySchedule.salvage_floor_pct / 100.0)
      acv_cents      = round_half_up( max(raw_cents, floor_cents) )
      return acv_cents
    input_set: "One Item row plus the CategorySchedule row for its category. Items whose purchase_price_cents is null are excluded from the ACV regime entirely and fall through to the DECLARED regime."
    constants:
      MONTH_DAYS_FOR_AGE: 30
      MONTHS_PER_YEAR: 12
    precision: "integer cents, round_half_up applied once at the end"
    variants:
      - name: AT_CURRENT_CLOCK
        when: "Writing Item.acv_value_cents and resolving Item.effective_value_cents at any ordinary read or write."
        difference: "as_of := the logical clock's current instant."
      - name: AT_LOSS_DATE
        when: "Computing ClaimLine.gross_value_cents during POST /vault/claims/{claim_id}/submit when LossClaim.settlement_basis == ACV."
        difference: "as_of := LossClaim.loss_date, which is earlier than the clock, so age_months is smaller and the ACV is strictly higher for any item whose depreciation has not yet hit the salvage floor. Identical item data, two different numbers."
      - name: AT_SNAPSHOT
        when: "Freezing PackageLine.snapshot_effective_value_cents during POST /vault/packages/{package_id}/generate."
        difference: "as_of := DocumentationPackage.generated_at, pinned into the snapshot and never recomputed afterwards."

  - name: effective_value_resolution
    trigger: "Recomputed whenever an Item's assets, declared value, serial number or appraisals change, and at the end of POST /_clock/set_current_utc."
    algorithm: constraint_propagation
    formula: |
      # Precedence order, FIRST MATCH WINS.
      # 1. APPRAISAL regime
      candidates = Appraisal rows on this item with status == CERTIFIED
                   and logical_clock_now < valid_until_at
      if candidates is non-empty:
          a = the candidate with the greatest certified_at; tie-break Appraisal.created_at ASC
          effective_value_cents  = a.appraised_value_cents
          effective_value_basis  = APPRAISAL
          valuation_state        = CERTIFIED
      # 2. ACV regime
      elif Item.purchase_price_cents is not null
           and a CategorySchedule exists for Item.category:
          effective_value_cents  = item_actual_cash_value(AT_CURRENT_CLOCK)
          effective_value_basis  = ACV
      # 3. DECLARED regime
      elif Item.declared_value_cents > 0:
          effective_value_cents  = Item.declared_value_cents
          effective_value_basis  = DECLARED
      else:
          effective_value_cents  = 0
          effective_value_basis  = NONE
      # valuation_state for every non-APPRAISAL branch
      if effective_value_basis != APPRAISAL:
          if Item.declared_value_cents >= APPRAISAL_REQUIRED_THRESHOLD_CENTS:
              valuation_state = APPRAISAL_REQUIRED
          elif effective_value_basis in {ACV, DECLARED}:
              valuation_state = DECLARED_ONLY
          else:
              valuation_state = UNVALUED
    input_set: "One Item row, its CERTIFIED and non-expired Appraisal rows, and the CategorySchedule for its category."
    constants:
      APPRAISAL_REQUIRED_THRESHOLD_CENTS: 1000000
    precision: "integer cents"
    variants: []

  - name: item_evidence_tier
    trigger: "Recomputed at the end of POST /vault/items/{item_id}/assets, DELETE /vault/assets/{asset_id}, and any PATCH /vault/items/{item_id} that changes serial_number."
    algorithm: threshold
    formula: |
      P = exists Asset with item_id == Item.id, status == STORED, asset_kind == PHOTO
      S = (exists Asset with item_id == Item.id, status == STORED, asset_kind == SERIAL_PLATE)
          or (Item.serial_number is not null)
      D = exists Asset with item_id == Item.id, status == STORED,
          asset_kind in {RECEIPT, PROVENANCE_DOC}
      evidence_tier = DOCUMENTED   if (P and S and D)
                    = PHOTO_SERIAL if (P and S)
                    = PHOTO_ONLY   if (P)
                    = NONE         otherwise
      # ordinal ladder used by every >= comparison in this scaffold
      rank(NONE)=0, rank(PHOTO_ONLY)=1, rank(PHOTO_SERIAL)=2, rank(DOCUMENTED)=3
    input_set: "Asset rows with status == STORED under this item, plus Item.serial_number. DELETED assets are excluded."
    constants:
      CLAIM_MIN_EVIDENCE_TIER_RANK: 2
      PACKAGE_MIN_EVIDENCE_TIER_RANK: 1
    precision: "exact enum, no rounding"
    variants: []

  - name: policy_coverage_gap
    trigger: "GET /vault/policies/{policy_id}/coverage-gap; also written to Policy.coverage_gap_cents (SCHEDULED_FIRST only) whenever an item's effective value, coverage_mode or scheduled_value_cents changes."
    algorithm: waterfall_allocation
    formula: |
      # candidate set, ordered by Item.created_at ASC (creation-order tie-break per ordering_contract)
      C = Item rows with household_id == Policy.household_id
          and lifecycle_state in {CATALOGED, FROZEN}
          and evidence_tier != NONE
      # ordered by Item.created_at ASC with the creation-order tie-break of ordering_contract
      ev(i) = Item.effective_value_cents

      # ---- VARIANT SCHEDULED_FIRST (the pinned default) ----
      allowance_left = Policy.scheduled_allowance_cents
      for i in C ordered by created_at ASC:
          if i.coverage_mode == SCHEDULED and i.scheduled_policy_id == Policy.id:
              take        = min(i.scheduled_value_cents, ev(i), allowance_left)
              covered[i]  = take
              allowance_left -= take
          else:
              covered[i]  = 0
          residual[i] = ev(i) - covered[i]
      sub_left[c] = CategorySchedule[c].blanket_sublimit_cents   for every category c
      for i in C ordered by created_at ASC:
          take2 = min(residual[i], sub_left[i.category])
          covered[i]  += take2
          sub_left[i.category] -= take2

      # ---- VARIANT BLANKET_FIRST ----
      sub_left[c] = CategorySchedule[c].blanket_sublimit_cents   for every category c
      for i in C ordered by created_at ASC:
          take        = min(ev(i), sub_left[i.category])
          covered[i]  = take
          sub_left[i.category] -= take
          residual[i] = ev(i) - covered[i]
      allowance_left = Policy.scheduled_allowance_cents
      for i in C ordered by created_at ASC:
          if i.coverage_mode == SCHEDULED and i.scheduled_policy_id == Policy.id:
              take2 = min(residual[i], i.scheduled_value_cents, allowance_left)
              covered[i] += take2
              allowance_left -= take2

      # ---- common tail for both variants ----
      total_value       = sum(ev(i) for i in C)
      total_covered     = sum(covered[i] for i in C)
      coverage_gap_cents = total_value - total_covered
      item_count        = |C|
      schedule_required_unscheduled_count =
          count(i in C where ev(i) >= SCHEDULE_REQUIRED_THRESHOLD_CENTS
                          and i.coverage_mode == BLANKET)
      # an item at or above SCHEDULE_REQUIRED_THRESHOLD_CENTS that is not individually
      # scheduled is only ever covered up to its category blanket sublimit; this counter
      # is the documentation package's headline warning.
    input_set: "Every CATALOGED or FROZEN item of the policy's household whose evidence_tier != NONE, both SCHEDULED and BLANKET, ordered by Item.created_at ASC with the creation-order tie-break of ordering_contract. DRAFT, REPLACED and DISPOSED items are excluded, as are items at evidence_tier NONE."
    constants:
      DEFAULT_BASIS: "SCHEDULED_FIRST"
      SCHEDULE_REQUIRED_THRESHOLD_CENTS: 500000
    precision: "integer cents throughout; no rounding is needed because every input is already integer cents"
    variants:
      - name: SCHEDULED_FIRST
        when: "Default for GET /vault/policies/{policy_id}/coverage-gap and the only variant written to Policy.coverage_gap_cents."
        difference: "Scheduled items draw on scheduled_allowance_cents first; whatever they cannot absorb falls back onto their category's blanket sublimit alongside the unscheduled items."
      - name: BLANKET_FIRST
        when: "GET /vault/policies/{policy_id}/coverage-gap with basis=BLANKET_FIRST."
        difference: "Every item first draws on its category's blanket sublimit in created_at order, so early unscheduled items exhaust the sublimit that the scheduled item would otherwise have fallen back on. The two variants report different coverage_gap_cents for identical data whenever a scheduled item shares its category with unscheduled items and the sublimit binds."

  - name: package_totals_snapshot
    trigger: "POST /vault/packages/{package_id}/generate"
    algorithm: aggregation
    formula: |
      # eligible set, ordered by Item.created_at ASC
      E = Item rows with household_id == package.household_id
          and lifecycle_state in {CATALOGED, FROZEN}
          and rank(evidence_tier) >= PACKAGE_MIN_EVIDENCE_TIER_RANK   # >= PHOTO_ONLY
          and valuation_state != APPRAISAL_REQUIRED
      if E is empty: reject with ERR_PACKAGE_EMPTY (ladder rung 31)

      # per-line snapshot values
      for i in E ordered by created_at ASC:
          exact_i = the UNROUNDED effective value of item i evaluated at as_of = generated_at
                    (for ACV-basis items this is purchase_price_cents * (1 - depreciated_pct/100)
                     before rounding; for APPRAISAL and DECLARED bases it is already integral)
          PackageLine.snapshot_effective_value_cents = round_half_up(exact_i)      # ROUND PER LINE
          PackageLine.snapshot_covered_cents = covered[i] from the SCHEDULED_FIRST
                     waterfall of policy_coverage_gap restricted to E
          PackageLine.snapshot_* fields copy name, category, evidence_tier,
                     effective_value_basis and coverage_mode verbatim

      # PINNED ROUNDING ORDER: round every line first, then sum the rounded lines.
      snapshot_total_effective_cents = sum of PackageLine.snapshot_effective_value_cents
      snapshot_total_covered_cents   = sum of PackageLine.snapshot_covered_cents
      snapshot_coverage_gap_cents    = snapshot_total_effective_cents - snapshot_total_covered_cents
      line_count                     = |E|
      # The alternative order - sum the unrounded exact_i values and round the total ONCE -
      # is explicitly NOT what this scaffold specifies, and the two orders differ by up to
      # (|E| / 2) cents. Three items each with exact_i = 189990.5 give 569973 under the pinned
      # order and 569972 under the forbidden one.
    input_set: "Only items eligible at the moment of generation; the set and every number are frozen. After GENERATED the package is immutable: no field except stale_line_count and superseded_by_package_id may change."
    constants:
      PACKAGE_MIN_EVIDENCE_TIER_RANK: 1
      PACKAGE_VALIDITY_DAYS: 180
    precision: "integer cents, round_half_up, applied per line BEFORE summation"
    variants: []

  - name: claim_settlement_allocation
    trigger: "POST /vault/claims/{claim_id}/submit (over all lines) and again at POST /vault/claims/{claim_id}/settle (over the APPROVED subset)."
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER. The apparent circularity - sublimit clipping needs the
      # gross values, the deductible needs the clipped values, and the reported total needs
      # both - is resolved by running ALL of step 1, then ALL of step 2, then ALL of step 3.
      # No step may look ahead at a later step's output.

      # ---- step 1: gross ----
      for each ClaimLine l on Item i, q = l.claimed_quantity, Q = i.quantity:
          if LossClaim.settlement_basis == ACV:
              unit = item_actual_cash_value(i, as_of = LossClaim.loss_date) / Q
          else:                                    # RCV
              unit = i.replacement_cost_cents / Q
          l.gross_value_cents = round_half_up(unit * q)

      # ---- step 2: cap (scheduled value, else shared category sublimit) ----
      sub_left[c] = CategorySchedule[c].blanket_sublimit_cents for every category c
      for each ClaimLine l ordered by ClaimLine.created_at ASC:
          if i.coverage_mode == SCHEDULED and i.scheduled_policy_id == LossClaim.policy_id:
              cap = i.scheduled_value_cents
          else:
              cap = sub_left[i.category]
              sub_left[i.category] -= min(l.gross_value_cents, cap)
          l.capped_value_cents = min(l.gross_value_cents, cap)

      # ---- step 3: deductible allocation over the lines in scope ----
      # scope at submit  = every ClaimLine of the claim (all still PENDING)
      # scope at settle  = only the lines in status APPROVED
      base = sum(l.capped_value_cents for l in scope)
      if base == 0:
          every l.deductible_share_cents = 0
      elif LossClaim.deductible_mode == PRO_RATA:
          for each l in scope except the anchor line:
              l.deductible_share_cents = round_half_up(
                    Policy.deductible_cents * l.capped_value_cents / base )
          anchor = the line in scope with the greatest capped_value_cents,
                   tie-break ClaimLine.created_at ASC
          anchor.deductible_share_cents = min(Policy.deductible_cents, base)
                                          - sum(the other shares)
      else:                                        # HIGHEST_VALUE_FIRST
          remaining = Policy.deductible_cents
          for each l in scope ordered by capped_value_cents DESC,
                                        tie-break ClaimLine.created_at ASC:
              l.deductible_share_cents = min(remaining, l.capped_value_cents)
              remaining -= l.deductible_share_cents

      # ---- step 4 and 5 ----
      for each l in scope: l.net_settlement_cents = max(0, l.capped_value_cents - l.deductible_share_cents)
      LossClaim.total_settlement_cents = sum(l.net_settlement_cents for l in scope with status == APPROVED)
    input_set: "At submit: every ClaimLine of the claim. At settle: only lines whose status == APPROVED; DENIED lines contribute nothing and their net_settlement_cents is forced to 0 at denial time."
    constants:
      DEDUCTIBLE_DEFAULT_MODE: "PRO_RATA"
    precision: "integer cents; round_half_up per line in steps 1 and 3, with the anchor line absorbing the PRO_RATA remainder so the shares sum exactly to min(deductible_cents, base)"
    variants:
      - name: PRO_RATA
        when: "LossClaim.deductible_mode == PRO_RATA (the default)."
        difference: "Every line in scope carries a share proportional to its capped value, so a small line still loses part of its settlement."
      - name: HIGHEST_VALUE_FIRST
        when: "LossClaim.deductible_mode == HIGHEST_VALUE_FIRST."
        difference: "The deductible is consumed entirely from the largest capped line downward, so small lines settle at their full capped value while the largest line absorbs the whole deductible. Identical inputs, a different per-line split, and a different set of lines whose net_settlement_cents is zero."

  - name: estate_fair_division_balance
    trigger: "POST /vault/estate-plans/{estate_plan_id}/propose"
    algorithm: weighted_scoring
    formula: |
      # per-allocation value, written to Allocation.allocated_value_cents at creation time
      allocated_value_cents(a) = round_half_up( Item.effective_value_cents * a.quantity / Item.quantity )

      heirs = the distinct non-null Allocation.heir_member_id values under this plan
              (only KEEP allocations carry one), ordered by Member.created_at ASC with the
              creation-order tie-break of ordering_contract
      n = |heirs|                                            # EstatePlan.heir_count
      if n == 0:
          balance_spread_pct = 0.0 ; balanced = true ; stop

      keep_value[h] = sum of allocated_value_cents over allocations with
                      disposition == KEEP and heir_member_id == h
      sell_pool     = sum of allocated_value_cents over allocations with disposition == SELL
      # DONATE and DISCARD allocations contribute nothing to any heir.

      if EstatePlan.valuation_mode == GROSS:
          distributable = sell_pool
      else:                                                  # NET
          distributable = round_half_up( sell_pool * (1.0 - SELL_DISPOSITION_COST_PCT / 100.0) )

      share     = floor(distributable / n)
      remainder = distributable - share * n                   # 0 <= remainder < n
      # the first `remainder` heirs in that same order get one extra cent each
      heir_share[h] = share + 1 for the first `remainder` heirs, else share

      heir_total[h]      = keep_value[h] + heir_share[h]
      mean               = sum(heir_total) / n
      balance_spread_pct = 0.0 when mean == 0
                         = round_half_up_to_2_decimals(
                               (max(heir_total) - min(heir_total)) / mean * 100.0 )
      balanced           = (balance_spread_pct <= FAIR_DIVISION_TOLERANCE_PCT)
    input_set: "Every Allocation under the plan. Heirs are exactly the distinct heir_member_id values on KEEP allocations; a member who receives only pooled sale proceeds is not an heir and does not enter the balance."
    constants:
      SELL_DISPOSITION_COST_PCT: 12.0
      FAIR_DIVISION_TOLERANCE_PCT: 5.0
    precision: "integer cents for values; balance_spread_pct is a number rounded half-up to 2 decimal places"
    variants:
      - name: GROSS
        when: "EstatePlan.valuation_mode == GROSS (the default)."
        difference: "Sale proceeds enter the pool at their full allocated value."
      - name: NET
        when: "EstatePlan.valuation_mode == NET."
        difference: "Sale proceeds are reduced by SELL_DISPOSITION_COST_PCT before being split, which lowers every heir's total by the same amount and therefore lowers the mean while leaving (max - min) unchanged. The spread percentage is strictly larger under NET, so a plan can be BALANCED under GROSS and UNBALANCED under NET on identical allocations."

  - name: subscription_proration
    trigger: "POST /vault/subscriptions/{subscription_id}/change-tier"
    algorithm: tiered_pricing
    formula: |
      old_fee   = SUBSCRIPTION_TIERS[Subscription.tier].monthly_fee_cents      # before the change
      new_fee   = SUBSCRIPTION_TIERS[requested tier].monthly_fee_cents
      elapsed_days   = floor( (logical clock now - period_start_at) in whole days )
      elapsed_days   = clamp(elapsed_days, 0, BILLING_PERIOD_DAYS)
      remaining_days = BILLING_PERIOD_DAYS - elapsed_days

      if proration_mode == DAILY:
          credit = round_half_up( old_fee * remaining_days / BILLING_PERIOD_DAYS )
          charge = round_half_up( new_fee * remaining_days / BILLING_PERIOD_DAYS )
          last_proration_charge_cents = charge - credit          # signed
      else:                                     # WHOLE_PERIOD
          last_proration_charge_cents = new_fee - old_fee        # signed

      # applied by both variants
      tier = requested tier
      monthly_fee_cents = new_fee
      appraisal_credits_remaining = min(appraisal_credits_remaining,
                                        SUBSCRIPTION_TIERS[tier].included_appraisal_credits)
      period_start_at is NOT reset by a tier change
    input_set: "One Subscription row and the SUBSCRIPTION_TIERS table. A change to the tier the subscription already holds is rejected at ladder rung 14 with ERR_INVALID_STATE."
    constants:
      BILLING_PERIOD_DAYS: 30
    precision: "integer cents, round_half_up per term (credit and charge rounded separately, then subtracted)"
    variants:
      - name: DAILY
        when: "proration_mode == DAILY (the default)."
        difference: "Both the credit for the unused old tier and the charge for the new tier are prorated across remaining_days, so a change late in the period costs a fraction of the fee delta."
      - name: WHOLE_PERIOD
        when: "proration_mode == WHOLE_PERIOD."
        difference: "The full fee delta is charged regardless of how much of the period has elapsed. On identical inputs the two variants differ by (new_fee - old_fee) * elapsed_days / BILLING_PERIOD_DAYS."

  - name: vault_quota_usage
    trigger: "Evaluated before POST /vault/items, POST /vault/items/{item_id}/assets, POST /vault/items/{item_id}/replace, POST /vault/subscriptions/{subscription_id}/change-tier and POST /vault/subscriptions/{subscription_id}/reinstate."
    algorithm: aggregation
    formula: |
      item_usage  = count(Item  where household_id == H
                                and lifecycle_state in {DRAFT, CATALOGED, FROZEN})
      asset_usage = count(Asset where status == STORED and its Item.household_id == H)
      bytes_usage = sum(Asset.byte_size where status == STORED and its Item.household_id == H)
      L = SUBSCRIPTION_TIERS[Subscription.tier]

      # create-time admission (ladder rung 32, ERR_QUOTA_EXCEEDED)
      item create refused   when item_usage + 1  > L.max_items
      asset create refused  when asset_usage + 1 > L.max_assets
                             or bytes_usage + byte_size > L.max_asset_bytes
      # downgrade admission (ladder rung 33, ERR_DOWNGRADE_BLOCKED_BY_USAGE)
      change-tier to T refused when item_usage  > SUBSCRIPTION_TIERS[T].max_items
                                 or asset_usage > SUBSCRIPTION_TIERS[T].max_assets
                                 or bytes_usage > SUBSCRIPTION_TIERS[T].max_asset_bytes
      # reinstate admission uses the SAME three comparisons against the current tier
    input_set: "REPLACED and DISPOSED items and DELETED assets are excluded from all three usage numbers, so a replace that supersedes an item is quota-neutral only after the predecessor leaves the counted set."
    constants:
      COUNTED_ITEM_STATES: "DRAFT, CATALOGED, FROZEN"
      COUNTED_ASSET_STATE: "STORED"
    precision: "exact integers"
    variants: []

  - name: appraisal_credit_entitlement
    trigger: "POST /vault/appraisals consumes; TRIAL->ACTIVE, PAST_DUE->ACTIVE and LAPSED->ACTIVE reset."
    algorithm: threshold
    formula: |
      on POST /vault/appraisals:
          if Subscription.appraisal_credits_remaining >= 1:
              appraisal_credits_remaining -= 1
              Appraisal.credit_consumed = true
          else:
              reject at ladder rung 34 with ERR_NO_APPRAISAL_CREDITS
      on any transition that sets a new period_start_at
      (billing-event PAYMENT_SUCCEEDED from TRIAL or PAST_DUE, and reinstate):
          appraisal_credits_remaining = SUBSCRIPTION_TIERS[tier].included_appraisal_credits
          # assignment, NOT addition - an unused balance is discarded, never rolled over
      on POST /vault/appraisals/{appraisal_id}/void:
          the credit is NOT refunded; credit_consumed stays true
    input_set: "One Subscription row. A BASIC subscription has included_appraisal_credits == 0, so its very first appraisal request is refused."
    constants:
      BASIC_INCLUDED_APPRAISAL_CREDITS: 0
      PLUS_INCLUDED_APPRAISAL_CREDITS: 2
      ESTATE_INCLUDED_APPRAISAL_CREDITS: 6
    precision: "exact integers"
    variants: []

  - name: scheduled_allowance_ledger
    trigger: "POST /vault/items/{item_id}/schedule (forward) and POST /vault/items/{item_id}/unschedule (compensating); also the allowance releases inside the REPLACED and DISPOSED item transitions."
    algorithm: aggregation
    formula: |
      # CONSERVATION INVARIANT 1 - conserved quantity: allowance cents on one Policy
      Policy.scheduled_consumed_cents
          == sum(Item.scheduled_value_cents for items with coverage_mode == SCHEDULED
                 and scheduled_policy_id == Policy.id)
      Policy.scheduled_remaining_cents
          == Policy.scheduled_allowance_cents - Policy.scheduled_consumed_cents

      forward      : schedule   -> consumed += scheduled_value_cents, remaining -= same
      compensating : unschedule -> consumed -= the exact amount that item consumed,
                                   remaining += same, item.coverage_mode := BLANKET,
                                   item.scheduled_policy_id := null,
                                   item.scheduled_value_cents := 0
      After a schedule/unschedule round trip on the same item, both
      scheduled_consumed_cents and scheduled_remaining_cents equal their pre-schedule
      values exactly - no drift, including when other items were scheduled in between.
      A schedule request is refused at ladder rung 36 (ERR_ALLOWANCE_EXCEEDED) when
      scheduled_value_cents > scheduled_remaining_cents.
    input_set: "All SCHEDULED items pointing at this policy. Items in REPLACED or DISPOSED never appear (their allowance is released as part of those transitions)."
    constants:
      SCHEDULE_REQUIRED_THRESHOLD_CENTS: 500000
    precision: "exact integer cents"
    variants: []

  - name: claim_freeze_ledger
    trigger: "POST /vault/claims (forward) and POST /vault/claims/{claim_id}/withdraw (compensating); settle and the auto-DENIED transition release the freeze too."
    algorithm: aggregation
    formula: |
      # CONSERVATION INVARIANT 2 - conserved quantity: count of frozen item records
      Household.frozen_item_count
          == count(Item where household_id == H and lifecycle_state == FROZEN)
      every FROZEN item has a non-null frozen_by_claim_id pointing at a LossClaim whose
      status is in {OPEN, SUBMITTED, UNDER_REVIEW, SUPPLEMENT_REQUESTED}
      Household.records_freeze_active == (Household.frozen_item_count > 0)

      forward      : POST /vault/claims freezes exactly the CATALOGED items whose room_id
                     is in affected_room_ids, and writes that count to
                     LossClaim.frozen_item_count
      compensating : withdraw unfreezes exactly the items whose frozen_by_claim_id is
                     this claim - not "all frozen items of the household" - so a second
                     concurrent claim's freeze survives the withdrawal untouched
      After an open/withdraw round trip, Household.frozen_item_count and
      records_freeze_active equal their pre-claim values exactly.
    input_set: "Only items in lifecycle_state CATALOGED are frozen. DRAFT items in an affected room are NOT frozen and are therefore still editable during the claim."
    constants:
      FREEZING_CLAIM_STATES: "OPEN, SUBMITTED, UNDER_REVIEW, SUPPLEMENT_REQUESTED"
    precision: "exact integer counts"
    variants: []

  - name: estate_allocation_conservation
    trigger: "POST /vault/estate-plans/{estate_plan_id}/allocations (forward) and DELETE /vault/allocations/{allocation_id} (compensating)."
    algorithm: aggregation
    formula: |
      # CONSERVATION INVARIANT 3 - conserved quantity: allocated units of an item
      for every Item i of the plan's household with lifecycle_state == CATALOGED:
          Item.allocated_quantity == sum(Allocation.quantity over allocations of i
                                         under this plan)
          Item.allocated_quantity <= Item.quantity
      EstatePlan.unallocated_item_count
          == count(such items where allocated_quantity < Item.quantity)

      forward      : allocation create -> allocated_quantity += quantity;
                     refused at ladder rung 26 (ERR_ALLOCATION_OVER_QUANTITY) when
                     allocated_quantity + quantity > Item.quantity
      compensating : allocation delete -> allocated_quantity -= that row's quantity
      After a create/delete round trip, Item.allocated_quantity and
      EstatePlan.unallocated_item_count equal their pre-allocation values exactly.
      propose requires unallocated_item_count == 0: every unit of every CATALOGED item
      is allocated exactly once.
    input_set: "Only CATALOGED items count toward unallocated_item_count. DRAFT, FROZEN, REPLACED and DISPOSED items are outside the conservation scope, which is why a claim freeze is what forces a PROPOSED plan back to DRAFT rather than silently changing the count."
    constants:
      MIN_ALLOCATION_QUANTITY: 1
    precision: "exact integer counts"
    variants: []

  - name: share_redaction_projection
    trigger: "GET /vault/shared/{share_token}"
    algorithm: projection
    formula: |
      # row selection by scope_kind
      HOUSEHOLD -> every Item of household_id with lifecycle_state in {CATALOGED, FROZEN},
                   ordered by Item.created_at ASC
      ROOM      -> the same set restricted to room_id == scope_room_id
      PACKAGE   -> one row per PackageLine of scope_package_id, ordered by
                   PackageLine.created_at ASC, carrying the SNAPSHOT values, never live values
      CLAIM     -> one row per ClaimLine of scope_claim_id, ordered by ClaimLine.created_at ASC

      # redaction
      VALUES_HIDDEN  -> every field whose name ends in _cents is omitted from every row
                        and from the envelope totals; serial_number is present
      SERIALS_HIDDEN -> serial_number is omitted from every row; _cents fields are present
      FULL           -> nothing is omitted

      # metering
      access_count += 1 on every successful redemption, applied BEFORE the response is
      rendered, so the response body carries the post-increment value.
      When access_count reaches access_cap the grant transitions ACTIVE -> EXHAUSTED and
      THIS redemption still succeeds; the NEXT one fails at ladder rung 9 with
      ERR_SHARE_GRANT_INACTIVE.
    input_set: "Rows are always drawn from the household named on the grant; a grant can never surface another household's rows."
    constants:
      SHARE_DEFAULT_ACCESS_CAP: 10
      SHARE_MAX_DURATION_DAYS: 90
    precision: "not numeric"
    variants: []

  - name: household_write_gate_posture
    trigger: "Both hooks in posture_recomputation_order."
    algorithm: constraint_propagation
    formula: |
      if the household has no Subscription row:
          write_gate_state = OPEN
      elif Subscription.status in {LAPSED, CLOSED}:
          write_gate_state = READ_ONLY
      elif Subscription.refresh_state == OVERDUE:
          write_gate_state = RESTRICTED
      else:
          write_gate_state = OPEN
      # READ_ONLY strictly outranks RESTRICTED: a lapsed subscription that is also
      # refresh-OVERDUE reports READ_ONLY, and rung 10 fires before rung 11.
    input_set: "One Household row and its single Subscription row."
    constants:
      GATE_PRECEDENCE: "READ_ONLY > RESTRICTED > OPEN"
    precision: "exact enum"
    variants: []

validation_ladder_contract: |
  The `priority` integer on every row below IS the rung number. Rungs are evaluated
  strictly in ascending order and the FIRST rung whose condition fires produces the
  response; no later rung is evaluated. Two rungs never share a number, so a request
  that violates several rules has exactly one defined error. Rungs whose applies_to
  sets are disjoint can never both fire on one request; where they do overlap, the
  numbering below is the tie-break and the §1.8 priority-conflict instances pin the
  observable outcome. The three posture rungs (10, 11, 12) sit ABOVE every ordinary
  state rung (13, 14) on purpose: a lapsed vault, a restricted vault and a
  records-freeze each pre-empt the ordinary state machine rather than being pre-empted
  by it.

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in §1.7; X-User-ID is present and non-empty for every role except Anonymous."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The X-User-Role value appears in the called endpoint's declared roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Every required body field for the endpoint is present, JSON types match, arrays are non-empty where declared, and datetime fields parse as ISO 8601 UTC. Also covers inspection_end_at <= inspection_start_at, expires_at <= starts_at, byte_size < 1, access_cap < 1, and a duplicate Member.email."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: business_constraint
    check: "Closed iff-list of enum-valued fields. A value outside the declared member set of ANY of these fields routes here and to no other error: Member.member_role, Subscription.tier, Item.category, Asset.asset_kind, CategorySchedule.category, CategorySchedule.appraisal_scope, Appraiser.scope_categories members, Appraisal.void_reason, LossClaim.peril, LossClaim.settlement_basis, LossClaim.deductible_mode, ClaimLine.denial_reason, EstatePlan.valuation_mode, Allocation.disposition, ShareGrant.scope_kind, ShareGrant.redaction_level, the billing-event `outcome` field, the adjudicate `decision` field, the change-tier `proration_mode` field, and the coverage-gap `basis` query field. No other field routes to ERR_INVALID_ENUM, and none of these fields ever routes to ERR_INVALID_REQUEST for a bad member value."
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all write endpoints plus GET /vault/policies/{policy_id}/coverage-gap"

  - priority: 5
    category: existence
    check: "Every id in the request PATH resolves, validated left to right. A missing household routes to ERR_HOUSEHOLD_NOT_FOUND, a missing item to ERR_ITEM_NOT_FOUND, and every other missing path resource (member, room, subscription, policy, package, package line, appraiser, appraisal, claim, claim line, estate plan, allocation, share grant, asset) to ERR_REFERENCE_NOT_FOUND."
    error_id: ERR_HOUSEHOLD_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request BODY resolves: household_id, room_id, item_id, policy_id, package_id, appraiser_id, heir_member_id, executor_member_id, scope_room_id, scope_package_id, scope_claim_id, and every element of affected_room_ids."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints that accept a foreign key in the body"

  - priority: 7
    category: existence
    check: "The {share_token} path segment matches the share_token of some ShareGrant row. An unknown token is distinguishable from a known-but-unusable one, which is rung 9."
    error_id: ERR_SHARE_TOKEN_UNKNOWN
    http_status: 404
    applies_to: "GET /vault/shared/{share_token}"

  - priority: 8
    category: auth
    check: "Household scoping. For Homeowner, HouseholdMember and EstateExecutor the acting Member.household_id must equal the target resource's household_id. For Appraiser, X-User-ID must equal Appraisal.appraiser_id. Homeowner-only operations additionally require the acting Member.member_role == OWNER; EstateExecutor-only operations require member_role == EXECUTOR AND X-User-ID == EstatePlan.executor_member_id."
    error_id: ERR_HOUSEHOLD_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every /vault endpoint acted on by an entity_backed role"

  - priority: 9
    category: state
    check: "The resolved ShareGrant is usable: status == ACTIVE, starts_at <= now < expires_at (half-open), and access_count < access_cap. A REVOKED, EXPIRED, EXHAUSTED or VOIDED_BY_SCOPE grant fails here, which is what distinguishes 'acting on a dead grant' (403) from 'acting with no grant at all' (404 at rung 7)."
    error_id: ERR_SHARE_GRANT_INACTIVE
    http_status: 403
    applies_to: "GET /vault/shared/{share_token}"

  - priority: 10
    category: business_constraint
    check: "GLOBAL WRITE GATE. Household.write_gate_state == READ_ONLY and the endpoint is a mutating /vault endpoint that is NOT in global_constants.WRITE_GATE_EXCLUSION_LIST."
    error_id: ERR_VAULT_READ_ONLY
    http_status: 403
    applies_to: "every mutating /vault endpoint outside WRITE_GATE_EXCLUSION_LIST"

  - priority: 11
    category: business_constraint
    check: "RESTRICTED GATE. Household.write_gate_state == RESTRICTED and the endpoint is in global_constants.RESTRICTED_GATE_BLOCK_LIST."
    error_id: ERR_REFRESH_OVERDUE
    http_status: 403
    applies_to: "POST /vault/packages/{package_id}/generate and POST /vault/share-grants"

  - priority: 12
    category: state
    check: "RECORDS FREEZE. The target Item (or the item behind the target Appraisal / Allocation) has lifecycle_state == FROZEN. Pre-empts every ordinary edit rung below."
    error_id: ERR_ITEM_FROZEN
    http_status: 409
    applies_to: "PATCH /vault/items/{item_id}, DELETE /vault/assets/{asset_id}, POST /vault/items/{item_id}/assets, POST /vault/items/{item_id}/declare-value, POST /vault/items/{item_id}/schedule, POST /vault/items/{item_id}/unschedule, POST /vault/items/{item_id}/replace, POST /vault/appraisals, POST /vault/appraisals/{appraisal_id}/certify"

  - priority: 13
    category: state
    check: "The target entity is already in one of its state machine's terminal_states for the requested transition."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 14
    category: state
    check: "The target entity's current state is not a declared `from:` state for the requested transition, or a cross-entity precondition of that transition fails (for example: submit on a claim whose package is not GENERATED/DELIVERED; certify before inspection_end_at; certify with Appraiser.status == SUSPENDED; open a claim against a package that is not GENERATED/DELIVERED; create a second live EstatePlan for a household that already has one; change-tier to the tier already held; deliver a package after expires_at)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 15
    category: business_referential
    check: "The Appraiser's scope_categories array contains the appraisal_scope of the CategorySchedule for the target Item's category."
    error_id: ERR_APPRAISER_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /vault/appraisals"

  - priority: 16
    category: business_safety
    check: "SEGREGATION OF DUTIES. (a) On POST /vault/appraisals, Appraiser.linked_member_id must not equal the target Item.declared_by_member_id - the party who declared a value may not be the party who certifies it. (b) On POST /vault/estate-plans/{estate_plan_id}/approve, X-User-ID must not equal EstatePlan.executor_member_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /vault/appraisals, POST /vault/estate-plans/{estate_plan_id}/approve"

  - priority: 17
    category: business_temporal
    check: "APPRAISAL HOLD OVERLAP - CLOSED interval with a symmetric buffer. A new Appraisal on the same item is refused when its [inspection_start_at, inspection_end_at] interval, widened by APPRAISAL_BUFFER_HOURS (24) on BOTH sides, intersects the un-widened closed interval of an existing Appraisal on that item whose status is REQUESTED or CERTIFIED. Touching endpoints count as intersecting."
    error_id: ERR_APPRAISAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /vault/appraisals"

  - priority: 18
    category: business_temporal
    check: "SHARE WINDOW OVERLAP - HALF-OPEN interval with NO buffer. A new ShareGrant is refused when another ShareGrant with status == ACTIVE has the same (household_id, recipient_ref) pair and its [starts_at, expires_at) interval intersects the new one's. Exact adjacency (new.starts_at == existing.expires_at) does NOT intersect and is allowed."
    error_id: ERR_SHARE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /vault/share-grants"

  - priority: 19
    category: business_temporal
    check: "expires_at - starts_at is strictly greater than SHARE_MAX_DURATION_DAYS (90) days. A window of exactly 90 days is accepted."
    error_id: ERR_SHARE_WINDOW_TOO_LONG
    http_status: 422
    applies_to: "POST /vault/share-grants"

  - priority: 20
    category: business_safety
    check: "rank(Item.evidence_tier) < CLAIM_MIN_EVIDENCE_TIER_RANK (2, i.e. below PHOTO_SERIAL)."
    error_id: ERR_EVIDENCE_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /vault/claims/{claim_id}/lines"

  - priority: 21
    category: business_safety
    check: "Item.valuation_state == APPRAISAL_REQUIRED - a declared value at or above APPRAISAL_REQUIRED_THRESHOLD_CENTS (1000000) with no CERTIFIED, unexpired appraisal behind it."
    error_id: ERR_APPRAISAL_REQUIRED
    http_status: 422
    applies_to: "POST /vault/claims/{claim_id}/lines, POST /vault/items/{item_id}/schedule"

  - priority: 22
    category: business_constraint
    check: "The CategorySchedule for the submitted category has serial_required == true and serial_number is null or empty."
    error_id: ERR_SERIAL_REQUIRED
    http_status: 422
    applies_to: "POST /vault/items, PATCH /vault/items/{item_id}, POST /vault/items/{item_id}/replace"

  - priority: 23
    category: business_constraint
    check: "Another Item in the same household_id already carries this serial_number and its lifecycle_state is in {DRAFT, CATALOGED, FROZEN}. REPLACED and DISPOSED rows are outside the uniqueness scope, so a replacement may reuse its predecessor's serial."
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /vault/items, PATCH /vault/items/{item_id}, POST /vault/items/{item_id}/replace"

  - priority: 24
    category: business_constraint
    check: "Item.quantity outside [MIN_ITEM_QUANTITY (1), MAX_ITEM_QUANTITY (999)], Allocation.quantity < 1, or ClaimLine.claimed_quantity outside [1, Item.quantity]."
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /vault/items, PATCH /vault/items/{item_id}, POST /vault/items/{item_id}/replace, POST /vault/estate-plans/{estate_plan_id}/allocations, POST /vault/claims/{claim_id}/lines"

  - priority: 25
    category: business_constraint
    check: "CONSERVATION. Item.allocated_quantity + requested quantity > Item.quantity under this plan."
    error_id: ERR_ALLOCATION_OVER_QUANTITY
    http_status: 409
    applies_to: "POST /vault/estate-plans/{estate_plan_id}/allocations"

  - priority: 26
    category: business_constraint
    check: "The item being allocated is not dispositionable: its lifecycle_state == FROZEN, or an Appraisal on it is in status REQUESTED (an active appraisal hold)."
    error_id: ERR_ITEM_NOT_DISPOSABLE
    http_status: 409
    applies_to: "POST /vault/estate-plans/{estate_plan_id}/allocations"

  - priority: 27
    category: business_constraint
    check: "EstatePlan.unallocated_item_count > 0 at propose time."
    error_id: ERR_PLAN_NOT_FULLY_ALLOCATED
    http_status: 422
    applies_to: "POST /vault/estate-plans/{estate_plan_id}/propose"

  - priority: 28
    category: business_constraint
    check: "EstatePlan.balanced == false and the approve request did not set override_unbalanced to true."
    error_id: ERR_PLAN_UNBALANCED
    http_status: 409
    applies_to: "POST /vault/estate-plans/{estate_plan_id}/approve"

  - priority: 29
    category: business_constraint
    check: "A ClaimLine for this (claim_id, item_id) pair already exists."
    error_id: ERR_DUPLICATE_CLAIM_LINE
    http_status: 409
    applies_to: "POST /vault/claims/{claim_id}/lines"

  - priority: 30
    category: business_constraint
    check: "ClaimLine.appeal_count >= MAX_APPEALS_PER_LINE (2)."
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /vault/claim-lines/{claim_line_id}/appeal"

  - priority: 31
    category: business_constraint
    check: "EMPTY-SET BOUNDARY. The eligible item set for package generation is empty (no item satisfies all three of: lifecycle_state in {CATALOGED, FROZEN}, evidence_tier at or above PACKAGE_MIN_EVIDENCE_TIER, valuation_state != APPRAISAL_REQUIRED)."
    error_id: ERR_PACKAGE_EMPTY
    http_status: 422
    applies_to: "POST /vault/packages/{package_id}/generate"

  - priority: 32
    category: business_fiscal
    check: "STORAGE QUOTA. item_usage + 1 > max_items, or asset_usage + 1 > max_assets, or bytes_usage + byte_size > max_asset_bytes for the household's current tier."
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 402
    applies_to: "POST /vault/items, POST /vault/items/{item_id}/assets, POST /vault/items/{item_id}/replace"

  - priority: 33
    category: business_fiscal
    check: "The requested target tier's max_items, max_assets or max_asset_bytes is strictly less than the household's current usage."
    error_id: ERR_DOWNGRADE_BLOCKED_BY_USAGE
    http_status: 409
    applies_to: "POST /vault/subscriptions/{subscription_id}/change-tier, POST /vault/subscriptions/{subscription_id}/reinstate"

  - priority: 34
    category: business_fiscal
    check: "Subscription.appraisal_credits_remaining == 0."
    error_id: ERR_NO_APPRAISAL_CREDITS
    http_status: 402
    applies_to: "POST /vault/appraisals"

  - priority: 35
    category: business_fiscal
    check: "Subscription.packages_used_this_period >= SUBSCRIPTION_TIERS[tier].included_packages_per_period."
    error_id: ERR_PACKAGE_QUOTA_EXCEEDED
    http_status: 402
    applies_to: "POST /vault/packages/{package_id}/generate"

  - priority: 36
    category: business_fiscal
    check: "THRESHOLD BOUNDARY. The requested scheduled_value_cents is strictly greater than Policy.scheduled_remaining_cents. A request for exactly the remaining amount succeeds and drives scheduled_remaining_cents to 0."
    error_id: ERR_ALLOWANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /vault/items/{item_id}/schedule"

  - priority: 37
    category: business_fiscal
    check: "AGGREGATE VALIDATION. The submitted scheduled_allowance_cents is strictly less than the policy's current scheduled_consumed_cents; individually every existing rider is fine, collectively they no longer fit."
    error_id: ERR_ALLOWANCE_BELOW_CONSUMED
    http_status: 409
    applies_to: "PATCH /vault/policies/{policy_id}"

  - priority: 38
    category: state
    check: "OPTIMISTIC CONCURRENCY, evaluated last. The supplied expected_<parent>_version does not equal the parent's current version. Routes to ERR_STALE_POLICY_VERSION, ERR_STALE_SUBSCRIPTION_VERSION, ERR_STALE_HOUSEHOLD_VERSION or ERR_STALE_PLAN_VERSION per the matching concurrency_rules entry."
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /vault/items/{item_id}/schedule, POST /vault/subscriptions/{subscription_id}/change-tier, POST /vault/packages/{package_id}/generate, POST /vault/estate-plans/{estate_plan_id}/allocations"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before the first call the clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, window, expiry and depreciation age in this scaffold is measured against this logical clock, and EVERY server-stamped created_at / updated_at / *_at field is taken from it, so an entity created before any set_current_utc call carries created_at == 2026-05-01T00:00:00.000Z."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, subscriptions_repostured: integer, share_grants_expired: integer, appraisals_expired: integer, packages_expired: integer }
    side_effects:
      - "runs posture_recomputation_order hook H1 over every Subscription, Household, ShareGrant, Appraisal and DocumentationPackage"

  - method: POST
    path: "/vault/members"
    description: "Registers a person. Omitting household_id self-registers an unattached OWNER; supplying it adds a member to an existing household and requires the Homeowner role."
    roles: [Anonymous, Homeowner]
    code: 201
    input: [email, full_name, "member_role?", "household_id?"]
