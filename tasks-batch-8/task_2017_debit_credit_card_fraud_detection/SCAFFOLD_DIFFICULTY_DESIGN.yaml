            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${a1}", card_id: "${c1}" }, as: FraudAnalyst, captures: { m1: "$.data.id", m1_prio0: "$.data.priority" } }
