          setup:
            - "Canonical program, a SELECTED household with 3000000 verified annual income, a READY_TO_BUILD site appraised at 15000000, and an application structured by officer-1 sitting in UNDERWRITING with a silent second of 1950000. Committed and disbursed subsidy are both 0, so available is the full 5000000."
