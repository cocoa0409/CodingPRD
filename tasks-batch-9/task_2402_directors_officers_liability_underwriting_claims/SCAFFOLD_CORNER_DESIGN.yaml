          the tail factor (1.45 * 1.20), not additive to it (1.65); base and credit are each
          rounded once, before the subtraction; the unexpired credit is measured from the change
          of control to period_end, not from the clock; and the guard order is
          ERR_NO_CHANGE_OF_CONTROL (79 < 80 < 81 means the duplicate guard outranks both, and 80
          outranks the tail-length guard) so a tail_years of 4 on an INDEPENDENT insured answers
          the control error, not the tail error. The final probe also pins that a second
          endorsement on a policy already in RUNOFF answers ERR_RUNOFF_ALREADY_ENDORSED rather
          than ERR_INVALID_POLICY_STATE.
