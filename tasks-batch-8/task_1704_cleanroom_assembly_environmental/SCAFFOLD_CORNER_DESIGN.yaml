              payload: { sampling_point_id: "${sp_rb3}", result_value: 5, sampled_at: "2026-08-01T09:00:00Z" }
              as: MaterialHandler
              captures: { err_rb3: $.data.error_id }
          assert:
            - "HTTP 403 error_id == ERR_FORBIDDEN"

      - name: segregation_of_duties_investigator_cannot_approve_own
        claim_type: rbac_denial
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "The QA who opened the investigation (investigated_by_user_id) approving it is denied with 403 ERR_SEGREGATION_OF_DUTIES; a DIFFERENT QA approves successfully."
        test_recipe:
          setup: ["Room CR-RB4 with ACTIVE VIABLE point; excursion recorded by tech-rb4; investigation opened by qa-rb4a"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-RB4", iso_class: "ISO_5", particle_alert_limit: 100000, particle_action_limit: 352000, viable_alert_limit: 10, viable_action_limit: 20, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_rb4: $.data.id }
            - call: "POST /cleanroom/rooms/${room_rb4}/sampling-points"
              payload: { point_code: "SP-RB4", metric: "VIABLE", zone_iso_class: "ISO_5" }
              as: QualityAssurance
              captures: { sp_rb4: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_rb4}", result_value: 15, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              as_user_id: "tech-rb4"
              captures: { exc_rb4: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/excursions/${exc_rb4}/investigations"
              payload: { root_cause: "Investigation narrative for RB4 segregation", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-rb4a"
              captures: { inv_rb4: $.data.id }
          trigger:
            - call: "POST /cleanroom/investigations/${inv_rb4}/approve"
