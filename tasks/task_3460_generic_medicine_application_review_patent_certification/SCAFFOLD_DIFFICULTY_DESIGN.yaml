              captures: { insp1: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/facility-inspections"
              payload: { facility_id: "${fac_id}", application_id: "${app_id}", scheduled_start_date: "2026-09-12", scheduled_end_date: "2026-09-14" }
              as: RegulatoryReviewer
              captures: { insp2: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections"
              payload: { facility_id: "${fac_id}", application_id: "${app_id}", scheduled_start_date: "2026-09-11", scheduled_end_date: "2026-09-13" }
              as: RegulatoryReviewer
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent inspection [2026-09-12, 2026-09-14) is created with 201: start == I1.end does not collide under half-open [start, end) semantics"
            - "the straddling inspection [2026-09-11, 2026-09-13) returns 409 with data.error_id == ERR_INSPECTION_OVERLAP"

      - name: protection_window_closed_overlap_rejects_adjacency
        grounds:
          - calculations.indication_protection_overlap_rule
          - validations[priority=13]
        distinguishing_aspect: |
          Interval semantics CLOSED on ProtectedIndication (contrasts with the
          HALF-OPEN inspection windows of the sibling): a window starting on
          the exact day another ends IS a conflict, and a one-day gap is
          required to register a follow-on window for the same indication code.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Reference product with indication_codes [IND-A, IND-B]; an ACTIVE protection window for IND-A [2026-01-01, 2028-01-01]."
          setup_api_calls:
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Protectin", active_ingredient: "protectinol", strength: "70 mg", dosage_form: "CAPSULE", rld_approval_date: "2019-12-01", is_new_chemical_entity: false, indication_codes: ["IND-A", "IND-B"], patent_owner_user_id: "innovator-ops-17" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products/${rld_id}/protected-indications"
              payload: { indication_code: "IND-A", effective_from: "2026-01-01", protected_until: "2028-01-01" }
              as: ProgramAdmin
              captures: { pi1: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/reference-products/${rld_id}/protected-indications"
              payload: { indication_code: "IND-A", effective_from: "2028-01-01", protected_until: "2029-06-30" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "POST /generic-drug-review/reference-products/${rld_id}/protected-indications"
              payload: { indication_code: "IND-A", effective_from: "2028-01-02", protected_until: "2029-06-30" }
              as: ProgramAdmin
              captures: { pi3: $.data.id }
            - call: "POST /generic-drug-review/reference-products/${rld_id}/protected-indications"
              payload: { indication_code: "IND-B", effective_from: "2027-06-01", protected_until: "2027-12-31" }
              as: ProgramAdmin
              captures: { pi4: $.data.id }
          assert:
            - "adjacent window [2028-01-01, 2029-06-30] for IND-A returns 409 with data.error_id == ERR_INDICATION_WINDOW_OVERLAP — closed intervals treat shared endpoints as overlap"
            - "window [2028-01-02, 2029-06-30] for IND-A succeeds with 201: a one-day gap is sufficient"
            - "overlapping window [2027-06-01, 2027-12-31] for IND-B succeeds with 201: the conflict rule is scoped per (reference_product_id, indication_code)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: supplement_submit_withdraw_conserves_open_count
        grounds:
          - entities.GenericApplication.fields.open_supplement_count
          - state_machines.Supplement
        distinguishing_aspect: |
          Conserved quantity: the count of an application's SUBMITTED
          supplements (contrasts with the CRL_ISSUED-cycle count of the
          sibling). A create followed by a withdraw must leave
          open_supplement_count bit-identical to its pre-pair value.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Application fully approved (ACCEPTED BE study, PASSED inspection, no patents); open_supplement_count == 0."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Conserve Generics", contact_email: "reg@con.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Conservx", active_ingredient: "conservxol", strength: "3 mg", dosage_form: "TABLET", rld_approval_date: "2006-06-06", is_new_chemical_entity: false, indication_codes: ["IND-HTN"], patent_owner_user_id: "innovator-ops-18" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "conservxol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/manufacturing-facilities"
              payload: { applicant_id: "${ac_id}", facility_name: "Con Plant", fei_number: "FEI-CN-1", country_code: "US" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections"
              payload: { facility_id: "${fac_id}", application_id: "${app_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-07" }
              as: RegulatoryReviewer
              captures: { insp_id: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections/${insp_id}/record-outcome"
              payload: { outcome: "PASSED" }
              as: FacilityInspector
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/applications/${app_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
            - call: "GET /generic-drug-review/applications/${app_id}"
              payload: {}
              as: RegulatoryReviewer
              captures: { open0: $.data.open_supplement_count }
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/supplements"
              payload: { change_type: "MANUFACTURING_SITE", pathway: "PRIOR_APPROVAL", description: "add second site" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { supp_id: $.data.id }
            - call: "GET /generic-drug-review/applications/${app_id}"
              payload: {}
              as: RegulatoryReviewer
              captures: { open1: $.data.open_supplement_count }
            - call: "POST /generic-drug-review/supplements/${supp_id}/withdraw"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "GET /generic-drug-review/applications/${app_id}"
              payload: {}
              as: RegulatoryReviewer
              captures: { open2: $.data.open_supplement_count }
          assert:
            - "open_supplement_count before the pair == 0, after create == 1, after withdraw == 0 — the forward action and its compensation conserve the invariant count(Supplement where review_status == SUBMITTED)"
            - "Supplement.${supp_id}.review_status == WITHDRAWN after the compensating action"

      - name: deficiency_issue_and_response_conserve_open_deficiency_count
        grounds:
          - entities.GenericApplication.fields.open_deficiency_count
          - state_machines.ReviewCycle.OPEN_to_CRL_ISSUED
          - state_machines.ReviewCycle.CRL_ISSUED_to_AMENDMENT_RECEIVED
        distinguishing_aspect: |
          Conserved quantity: the count of an application's CRL_ISSUED review
          cycles (contrasts with the SUBMITTED-supplement count of the
          sibling). Issuing a deficiency letter and then receiving the
          applicant's amendment must return open_deficiency_count to 0 and
          leave a MINOR amendment's cycle goal_date untouched.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. STANDARD application submitted at 2026-09-01 (cycle 1 OPEN, goal 2027-07-01); ACCEPTED BE study; no patents."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Ledger Generics", contact_email: "reg@lg.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Ledgerex", active_ingredient: "ledgerexol", strength: "18 mg", dosage_form: "TABLET", rld_approval_date: "2005-05-05", is_new_chemical_entity: false, indication_codes: ["IND-HTN"], patent_owner_user_id: "innovator-ops-19" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "ledgerexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "GET /generic-drug-review/applications/${app_id}/review-cycles"
              payload: {}
              as: RegulatoryReviewer
              captures: { cyc_id: "$.data[0].id", goal0: "$.data[0].goal_date" }
            - call: "GET /generic-drug-review/applications/${app_id}"
              payload: {}
              as: RegulatoryReviewer
              captures: { odc0: $.data.open_deficiency_count }
            - call: "POST /generic-drug-review/review-cycles/${cyc_id}/issue-deficiency"
              payload: { deficiency_summary: "labeling format comments" }
              as: RegulatoryReviewer
            - call: "GET /generic-drug-review/applications/${app_id}"
              payload: {}
              as: RegulatoryReviewer
              captures: { odc1: $.data.open_deficiency_count, app_v_pre: $.data.version }
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/amendments"
              payload: { classification: "MINOR", contains_new_be_data: false, expected_application_version: "${app_v_pre}", notes: "response to labeling comments" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "GET /generic-drug-review/applications/${app_id}"
              payload: {}
              as: RegulatoryReviewer
              captures: { odc2: $.data.open_deficiency_count }
            - call: "GET /generic-drug-review/applications/${app_id}/review-cycles"
              payload: {}
              as: RegulatoryReviewer
              captures: { goal1: "$.data[0].goal_date", cyc_status: "$.data[0].status" }
          assert:
            - "open_deficiency_count: 0 before issuance, 1 while CRL_ISSUED, 0 after the amendment response — count(ReviewCycle where status == CRL_ISSUED) is conserved across the issue/respond pair"
            - "cycle 1 status == AMENDMENT_RECEIVED with deficiency_response_received_date == \"2026-09-01\""
            - "goal_date == \"2027-07-01\" both before issuance and after the MINOR response — a MINOR amendment perturbs no timeline constant"
