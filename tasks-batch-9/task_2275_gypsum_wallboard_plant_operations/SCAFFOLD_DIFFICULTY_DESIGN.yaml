  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: retained_stucco_fail_cascades_batch_run_plant_load
        grounds:
          - state_machines.CalcinerBatch.COMPLETED_to_COMPLETED
          - state_machines.ProductionRun.RELEASED_to_HELD
          - state_machines.LoadOrder.STAGED_to_HELD
          - calculations.stucco_test_result
          - calculations.plant_production_posture
          - entities.LoadOrder.fields.hold_source
        distinguishing_aspect: |
          Four-hop chain where each hop is caused only by the previous one: a FAIL retained sample
          flips CalcinerBatch.stucco_quality_flag to FAIL (hop 1), which forces the RELEASED run to
          quality_state HELD with held_reason STUCCO_NONCONFORMING (hop 2), which raises
          Plant.held_run_count 0 -> 1 and flips production_posture OPEN -> RESTRICTED (hop 3), which
          in turn moves the run's STAGED LoadOrder to HELD with hold_source RUN_QUALITY_HELD (hop 4).
        test_recipe:
          setup:
            - "Plant GYP-1 with batches B1 (204.530 t) and B2 (92.747 t) COMPLETED -> silo 297.277 t."
            - "Run R1 sourced from B1 scheduled, started, completed (295.000 / 5.000 MSF) -> silo on hand 98.152 t, posture OPEN."
            - "Three passing specimens recorded and R1 evaluated RELEASED; one 12-bundle LoadOrder staged for the FAR market."
