              payload: { insurer_id: "00000000-0000-0000-0000-000000000000", policy_number: "MC-XR-GHOST2", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { xr_e_body: "$.data.error_id" }
            - call: "POST /agreements/${xr_agr}/policies"
              payload: { insurer_id: "${xr_ins_a}", policy_number: "MC-XR-1", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { xr_pol_a: "$.data.id", xr_pol_a_agr: "$.data.agreement_id", xr_pol_a_ins: "$.data.insurer_id", xr_pol_a_status: "$.data.status" }
            - call: "POST /agreements/${xr_agr}/policies"
              payload: { insurer_id: "${xr_ins_b}", policy_number: "CM-XR-2", gross_premium_cents: 400000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
