              as: Operator
              as_user_id: "${r_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/order-taker-deployments"
              payload: { restaurant_id: "${r_id}", staff_member_id: "${s1_id}", daypart_profile_id: "${dp_id}", position: "OOT_LANE_A", planned_start_at: "2026-08-01T11:00:00Z", planned_end_at: "2026-08-01T11:30:00Z" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /drive-thru/order-taker-deployments/${d1_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { committed_active: $.data.labor_minutes_committed, available_active: $.data.labor_minutes_available, oot_active: $.data.deployed_oot_count }
