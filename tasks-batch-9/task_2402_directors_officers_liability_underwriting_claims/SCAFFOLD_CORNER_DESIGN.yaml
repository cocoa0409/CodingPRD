      - name: disclosure_presence_is_checked_before_disclosure_staleness
        claim_type: cascading_validation
        grounds:
          - validations[priority=66]
          - validations[priority=67]
          - calculations.governance_risk_assessment.constants.DISCLOSURE_STALE_DAYS
        distinguishing_aspect: |
          Staleness can only be evaluated once a package has been selected, so the presence check
          at priority 66 must run first: with no packages the answer is ERR_DISCLOSURE_REQUIRED,
          never ERR_DISCLOSURE_STALE or a null-dereference. Then the staleness cutoff is applied
          to the SELECTED package only — adding a fresher fiscal-2025 package makes the same
          submission scoreable even though the stale 2024 package is still on file. Neither
          failed attempt may bump the submission version or leave a partial score.
        test_recipe:
          setup:
