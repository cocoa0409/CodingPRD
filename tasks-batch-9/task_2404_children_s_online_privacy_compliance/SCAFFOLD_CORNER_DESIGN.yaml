        grounds:
          - state_machines.AgeScreen.initial_state
          - entities.AgeScreen.fields.status
          - entities.AgeScreen.fields.revision_round
        distinguishing_aspect: "A newly declared AgeScreen is DRAFT with revision_round 0 and activated_at null — it is not ACTIVE, so the service it belongs to gains no screening capability from the mere existence of the row."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one MIXED_AUDIENCE service with no age screen."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Initial State Kids", operator_organization: "Initial Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "NEUTRAL_DOB_ENTRY", retry_allowed_on_fail: false, outcome_session_persisted: true }
              as: PrivacyEngineer
              captures: { screen_id: $.data.id, status: $.data.status, rounds: $.data.revision_round, activated: $.data.activated_at, violations: $.data.neutrality_violation_codes }
            - call: "GET /online-services/${svc_id}/age-screens"
              payload: { status: "ACTIVE", limit: 100, offset: 0 }
              as: PrivacyEngineer
              captures: { active_total: $.meta.total_count }
          assert:
            - "${status} == DRAFT and ${rounds} == 0 and ${activated} == null and ${violations} == []"
            - "${active_total} == 0 (the service has no ACTIVE screen yet)"
            - "AgeScreen.${screen_id}.version == 1"

      - name: notice_publish_from_superseded_status_reports_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.ParentalNotice.DRAFT_to_PUBLISHED
          - state_machines.ParentalNotice.PUBLISHED_to_SUPERSEDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Publication is not idempotent and not re-runnable: publishing r2 supersedes r1, after which publishing r1 again is ERR_INVALID_STATE (SUPERSEDED has no outgoing publish), and publishing the already-PUBLISHED r2 a second time is refused for the same reason — the service keeps exactly one PUBLISHED notice."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one service with two notices, r1 published then r2 published."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Single Published Notice Kids", operator_organization: "Notice Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_r1: $.data.id }
            - call: "POST /parental-notices/${notice_r1}/publish"
              payload: {}
              as: ComplianceOfficer
              captures: { r1_status: $.data.status }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r2", delivery_channel: "IN_APP_MODAL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { notice_r2: $.data.id }
            - call: "POST /parental-notices/${notice_r2}/publish"
              payload: {}
              as: ComplianceOfficer
              captures: { r2_status: $.data.status }
          trigger:
            - call: "POST /parental-notices/${notice_r1}/publish"
              payload: {}
              as: ComplianceOfficer
              captures: { err_superseded: $.data.error_id }
            - call: "POST /parental-notices/${notice_r2}/publish"
              payload: {}
              as: ComplianceOfficer
              captures: { err_already_published: $.data.error_id }
            - call: "GET /online-services/${svc_id}/parental-notices"
              payload: { status: "PUBLISHED", limit: 100, offset: 0 }
              as: ComplianceOfficer
              captures: { published_total: $.meta.total_count, published_row: "$.data[0].id" }
          assert:
            - "${r1_status} == PUBLISHED and ${r2_status} == PUBLISHED at the moment of their own calls"
            - "ParentalNotice.${notice_r1}.status == SUPERSEDED after r2 was published"
            - "${err_superseded} == ERR_INVALID_STATE with HTTP 409 (SUPERSEDED declares no publish transition)"
            - "${err_already_published} == ERR_INVALID_STATE with HTTP 409 (re-publishing is not an idempotent no-op)"
            - "${published_total} == 1 and ${published_row} == ${notice_r2}"

      - name: denied_consent_cannot_be_granted_or_revoked_afterwards
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ConsentRequest.terminal_states
          - state_machines.ConsentRequest.PENDING_VERIFICATION_to_DENIED
          - errors[ERR_INVALID_STATE]
          - entities.OnlineService.fields.active_consent_count
        distinguishing_aspect: "DENIED is terminal: the denial stores denial_reason and leaves every counter at zero, and both a later GRANTED and a later REVOKED are ERR_INVALID_STATE — a refused parent cannot be walked into consent by re-issuing the grant call."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; MIXED_AUDIENCE service with a PUBLISHED notice."
            - "Consent D1 driven to PENDING_VERIFICATION, then DENIED with denial_reason PARENT_REFUSED_VERIFICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
