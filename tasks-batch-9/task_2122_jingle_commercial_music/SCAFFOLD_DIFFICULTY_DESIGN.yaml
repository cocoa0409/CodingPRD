  - rule_id: resource_temporal_overlap
    instances:

      - name: studio_room_half_open_window_allows_touching_rejects_crossing
        grounds:
          - validations[priority=60]
          - errors[ERR_STUDIO_ROOM_DOUBLE_BOOKED]
          - entities.SessionCall.fields.studio_room_id
          - entities.StudioRoom.fields.name
        distinguishing_aspect: |
          Room occupancy is half-open with a zero-length buffer: a call starting at
          exactly 13:00:00Z, the instant the 09:00-13:00 call ends, is accepted,
          while a call spanning 12:00-12:30 inside that window is rejected with
          ERR_STUDIO_ROOM_DOUBLE_BOOKED. The resource entity is StudioRoom.
