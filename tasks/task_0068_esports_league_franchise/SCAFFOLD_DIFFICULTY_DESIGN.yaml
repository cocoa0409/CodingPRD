scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cap_payroll_excludes_unpromoted_two_way_vs_full_commitment
        grounds:
          - calculations.active_payroll
          - entities.Contract.fields.two_way_promoted
          - endpoints["GET /teams/{id}/payroll"]
        distinguishing_aspect: |
          Two valid payroll readings on the Team domain diverge: cap_standard
          excludes the unpromoted TWO_WAY salary (payroll_active_cents == 3000000)
          while full_roster_commitment includes it (full_commitment_cents == 3800000).
        test_recipe:
          setup:
            - "Season with salary_cap_cents=50000000."
            - "Team T1 with one ACTIVE STANDARD contract base_salary_cents=30000000 and one ACTIVE unpromoted TWO_WAY contract base_salary_cents=8000000."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T1", market_size_weight: 3 }
              as: LeagueCommissioner
              captures: { t1_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p_std" }
              as: LeagueCommissioner
              captures: { p_std_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p_tw" }
              as: LeagueCommissioner
              captures: { p_tw_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t1_id}", player_id: "${p_std_id}", base_salary_cents: 30000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t1_id}"
            - call: "POST /contracts"
              payload: { team_id: "${t1_id}", player_id: "${p_tw_id}", base_salary_cents: 8000000, contract_type: "TWO_WAY", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t1_id}"
          trigger:
            - call: "GET /teams/${t1_id}/payroll"
              as: TeamGM
              as_user_id: "${t1_id}"
          assert:
            - "response.data.payroll_active_cents == 30000000"
            - "response.data.full_commitment_cents == 38000000"
            - "response.data.full_commitment_cents - response.data.payroll_active_cents == 8000000"
      - name: revenue_waterfall_league_first_vs_split_then_deduct
        grounds:
          - calculations.revenue_waterfall
          - state_machines.Sponsorship.transitions.PENDING_to_DISTRIBUTED
          - entities.RevenueShare.fields.amount_cents
        distinguishing_aspect: |
          The Sponsorship domain pins league_first: the 40% league cut is taken
          off the gross 10000000 pool FIRST (distributable == 6000000), so the
          highest-weight team's share is 2571429 — NOT the split-then-deduct
          reading that would net each team 60% of its gross slice.
        test_recipe:
          setup:
            - "Season with three teams A(weight 3, created first), B(weight 3), C(weight 1)."
            - "Sponsorship pool_cents=10000000, league_share_pct=0.40, PENDING."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S2", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "A", market_size_weight: 3 }
              as: LeagueCommissioner
              captures: { a_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "B", market_size_weight: 3 }
              as: LeagueCommissioner
              captures: { b_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "C", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { c_id: $.data.id }
            - call: "POST /sponsorships"
              payload: { season_id: "${season_id}", sponsor_name: "Acme", pool_cents: 10000000, league_share_pct: 0.40 }
              as: LeagueCommissioner
              captures: { spo_id: $.data.id, spo_v: $.data.version }
          trigger:
            - call: "POST /sponsorships/${spo_id}/distribute"
              payload: { expected_sponsorship_version: "${spo_v}" }
              as: LeagueCommissioner
            - call: "GET /teams/${a_id}/revenue-shares"
              as: LeagueCommissioner
              captures: { a_share: "$.data[0].amount_cents" }
          assert:
            - "RevenueShare for team A.amount_cents == 2571429"
            - "RevenueShare for team B.amount_cents == 2571429"
            - "RevenueShare for team C.amount_cents == 857142"
            - "sum of all RevenueShare.amount_cents == 6000000"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: luxury_tax_marginal_tiering_mode_a
        grounds:
          - calculations.luxury_tax
          - entities.Season.fields.salary_cap_cents
          - endpoints["GET /teams/{id}/payroll"]
        distinguishing_aspect: |
          Mode (a): luxury_tax is a >=3-input nested-min/max marginal formula —
          overage 6000000 splits across tiers (5000000@1.5 + 1000000@2.0) yielding
          9500000, NOT a single flat top-tier rate on the whole overage.
        test_recipe:
          setup:
            - "Season salary_cap_cents=50000000."
            - "Team with two ACTIVE STANDARD contracts summing payroll_active_cents=56000000."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p1" }
              as: LeagueCommissioner
              captures: { p1_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p2" }
              as: LeagueCommissioner
              captures: { p2_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p1_id}", base_salary_cents: 30000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p2_id}", base_salary_cents: 26000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
          trigger:
            - call: "GET /teams/${t_id}/payroll"
              as: TeamGM
              as_user_id: "${t_id}"
          assert:
            - "response.data.payroll_active_cents == 56000000"
            - "response.data.luxury_tax_cents == 9500000"
      - name: revenue_waterfall_floor_then_remainder_rounding_order_mode_b
        grounds:
          - calculations.revenue_waterfall
          - entities.Team.fields.market_size_weight
          - entities.RevenueShare.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — floor each team's raw share
          FIRST, then award the 2-cent remainder one at a time by weight DESC,
          created_at ASC; A and B each receive +1 (2571429), C gets 0 extra
          (857142). A sum-then-round reading would not produce these exact cents.
        test_recipe:
          setup:
            - "Season with teams A(weight 3, created first), B(weight 3), C(weight 1); distributable=6000000 does not divide evenly by total weight 7."
            - "Sponsorship pool_cents=10000000, league_share_pct=0.40, PENDING."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S3", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "A", market_size_weight: 3 }
              as: LeagueCommissioner
              captures: { a_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "B", market_size_weight: 3 }
              as: LeagueCommissioner
              captures: { b_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "C", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { c_id: $.data.id }
            - call: "POST /sponsorships"
              payload: { season_id: "${season_id}", sponsor_name: "Acme", pool_cents: 10000000, league_share_pct: 0.40 }
              as: LeagueCommissioner
              captures: { spo_id: $.data.id, spo_v: $.data.version }
          trigger:
            - call: "POST /sponsorships/${spo_id}/distribute"
              payload: { expected_sponsorship_version: "${spo_v}" }
              as: LeagueCommissioner
            - call: "GET /teams/${c_id}/revenue-shares"
              as: LeagueCommissioner
              captures: { c_share: "$.data[0].amount_cents" }
          assert:
            - "RevenueShare for team A.amount_cents == 2571429"
            - "RevenueShare for team B.amount_cents == 2571429"
            - "RevenueShare for team C.amount_cents == 857142"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trade_branching_fork_accept_vs_reject_divergent_side_effects
        grounds:
          - state_machines.Trade.transitions.PROPOSED_to_ACCEPTED
          - state_machines.Trade.transitions.PROPOSED_to_REJECTED
          - state_machines.Trade.transitions.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: |
          Trade is a branching fork on one entity: PROPOSED forks to ACCEPTED
          (reassigns contracts + recomputes both payrolls) vs REJECTED (no
          reassignment); the ACCEPTED branch's contract.team_id change is the
          observable that distinguishes the branches.
        test_recipe:
          setup:
            - "REGULAR season, window OPEN, teams F and G, contract C1 ACTIVE on F."
            - "Trade TR PROPOSED moving C1 from F to G (contract_ids_in empty list disallowed, so G also sends C2)."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/start-regular"
              as: LeagueCommissioner
            - call: "POST /seasons/${season_id}/trade-window"
              payload: { trade_window_state: "OPEN" }
              as: LeagueCommissioner
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "F", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { f_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "G", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { g_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "pf" }
              as: LeagueCommissioner
              captures: { pf_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "pg" }
              as: LeagueCommissioner
              captures: { pg_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${f_id}", player_id: "${pf_id}", base_salary_cents: 10000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${f_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${g_id}", player_id: "${pg_id}", base_salary_cents: 12000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${g_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /trades"
              payload: { season_id: "${season_id}", from_team_id: "${f_id}", to_team_id: "${g_id}", contract_ids_out: ["${c1_id}"], contract_ids_in: ["${c2_id}"] }
              as: TeamGM
              as_user_id: "${f_id}"
              captures: { tr_id: $.data.id }
            - call: "GET /teams/${g_id}"
              as: LeagueCommissioner
              captures: { g_v: $.data.version }
          trigger:
            - call: "POST /trades/${tr_id}/accept"
              payload: { expected_to_team_version: "${g_v}" }
              as: TeamGM
              as_user_id: "${g_id}"
          assert:
            - "Trade.${tr_id}.status == ACCEPTED"
            - "Contract.${c1_id}.team_id == ${g_id}"
            - "Contract.${c2_id}.team_id == ${f_id}"
      - name: team_posture_cycle_open_restricted_open
        grounds:
          - state_machines.Team.transitions.OPEN_to_RESTRICTED
          - state_machines.Team.transitions.RESTRICTED_to_OPEN
          - entities.Team.fields.penalty_points
        distinguishing_aspect: |
          Team is a cyclic machine on a different entity: OPEN -> RESTRICTED
          (fine assess pushes penalty_points to threshold) then RESTRICTED ->
          OPEN (fine waive drops it back), returning to the start state — a
          genuine A->B->A loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Season penalty_threshold=3, team T OPEN, player P signed on T."
            - "One ASSESSED Fine on T with penalty_points=3 (T flips RESTRICTED)."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000, penalty_threshold: 3 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p" }
              as: LeagueCommissioner
              captures: { p_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p_id}", base_salary_cents: 5000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
            - call: "POST /fines"
              payload: { team_id: "${t_id}", player_id: "${p_id}", amount_cents: 100000, penalty_points: 3 }
              as: LeagueCommissioner
              captures: { fine_id: $.data.id }
          trigger:
            - call: "POST /fines/${fine_id}/waive"
              as: LeagueCommissioner
            - call: "GET /teams/${t_id}"
              as: LeagueCommissioner
              captures: { final_posture: $.data.posture }
          assert:
            - "after fine assess (in setup) Team.${t_id}.posture == RESTRICTED"
            - "after waive Team.${t_id}.posture == OPEN"
            - "after waive Team.${t_id}.penalty_points == 0"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fine_assess_cascade_points_then_posture_depth3
        grounds:
          - state_machines.Fine.transitions.ASSESSED_to_WAIVED
          - state_machines.Team.transitions.OPEN_to_RESTRICTED
          - entities.Team.fields.penalty_points
          - entities.Team.fields.posture
        distinguishing_aspect: |
          Depth-3 cascade from a Fine-assess trigger: POST /fines (A) mutates
          team.penalty_points (B); that B mutation crossing >= threshold itself
          triggers Team.posture OPEN->RESTRICTED (C). Each hop is caused by the
          prior hop, not by the original POST directly.
        test_recipe:
          setup:
            - "Season penalty_threshold=3, team T OPEN with penalty_points=0, player P signed on T."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000, penalty_threshold: 3 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p" }
              as: LeagueCommissioner
              captures: { p_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p_id}", base_salary_cents: 5000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /fines"
              payload: { team_id: "${t_id}", player_id: "${p_id}", amount_cents: 100000, penalty_points: 4 }
              as: LeagueCommissioner
              captures: { fine_id: $.data.id }
            - call: "GET /teams/${t_id}"
              as: LeagueCommissioner
              captures: { posture_after: $.data.posture }
          assert:
            - "Team.${t_id}.penalty_points == 4"
            - "Team.${t_id}.posture == RESTRICTED"
      - name: contract_waive_cascade_status_then_player_free_agent_depth3
        grounds:
          - state_machines.Contract.transitions.ACTIVE_to_WAIVED
          - state_machines.Player.transitions.SIGNED_to_FREE_AGENT
          - entities.Player.fields.status
        distinguishing_aspect: |
          Distinct trigger (contract waive) drives a depth-3 cascade: POST
          /contracts/{id}/waive (A) sets contract.status=WAIVED (B); because that
          was the player's last ACTIVE contract, B triggers Player.status
          SIGNED->FREE_AGENT (C). Different propagation pattern from the fine cascade.
        test_recipe:
          setup:
            - "Season, team T, player P SIGNED on a single ACTIVE STANDARD contract C."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p" }
              as: LeagueCommissioner
              captures: { p_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p_id}", base_salary_cents: 5000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "GET /teams/${t_id}"
              as: LeagueCommissioner
              captures: { t_v: $.data.version }
          trigger:
            - call: "POST /contracts/${c_id}/waive"
              payload: { expected_team_version: "${t_v}" }
              as: TeamGM
              as_user_id: "${t_id}"
            - call: "GET /players/${p_id}"
              as: LeagueCommissioner
              captures: { p_status: $.data.status }
          assert:
            - "Contract.${c_id}.status == WAIVED"
            - "Player.${p_id}.status == FREE_AGENT"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: window_closed_beats_team_restricted_on_accept
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          business_temporal (ERR_TRADE_WINDOW_CLOSED, pri 7) vs business_safety
          (ERR_TEAM_RESTRICTED, pri 8): a PROPOSED trade whose to_team is
          RESTRICTED and whose window is CLOSED must return ERR_TRADE_WINDOW_CLOSED
          (the lower priority number wins).
        test_recipe:
          setup:
            - "REGULAR season; trade TR PROPOSED while window was OPEN; then window CLOSED; to_team G is RESTRICTED via a threshold fine."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000, penalty_threshold: 3 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/start-regular"
              as: LeagueCommissioner
            - call: "POST /seasons/${season_id}/trade-window"
              payload: { trade_window_state: "OPEN" }
              as: LeagueCommissioner
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "F", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { f_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "G", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { g_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "pf" }
              as: LeagueCommissioner
              captures: { pf_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "pg" }
              as: LeagueCommissioner
              captures: { pg_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${f_id}", player_id: "${pf_id}", base_salary_cents: 10000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${f_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${g_id}", player_id: "${pg_id}", base_salary_cents: 12000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${g_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /trades"
              payload: { season_id: "${season_id}", from_team_id: "${f_id}", to_team_id: "${g_id}", contract_ids_out: ["${c1_id}"], contract_ids_in: ["${c2_id}"] }
              as: TeamGM
              as_user_id: "${f_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /fines"
              payload: { team_id: "${g_id}", player_id: "${pg_id}", amount_cents: 100000, penalty_points: 3 }
              as: LeagueCommissioner
            - call: "POST /seasons/${season_id}/trade-window"
              payload: { trade_window_state: "CLOSED" }
              as: LeagueCommissioner
            - call: "GET /teams/${g_id}"
              as: LeagueCommissioner
              captures: { g_v: $.data.version }
          trigger:
            - call: "POST /trades/${tr_id}/accept"
              payload: { expected_to_team_version: "${g_v}" }
              as: TeamGM
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TRADE_WINDOW_CLOSED"
      - name: invalid_state_beats_window_closed_on_accept
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          state (ERR_INVALID_STATE, pri 5) vs business_temporal
          (ERR_TRADE_WINDOW_CLOSED, pri 7): re-accepting an already-REJECTED trade
          while the window is CLOSED must return ERR_INVALID_STATE — the state
          precondition outranks the window check. Different category pair from instance 1.
        test_recipe:
          setup:
            - "REGULAR season; trade TR proposed under OPEN window, then REJECTED by G; window then CLOSED."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
