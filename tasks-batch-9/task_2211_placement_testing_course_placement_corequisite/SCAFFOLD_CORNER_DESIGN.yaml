      - name: section_reopens_from_closed_and_registrations_resume
        claim_type: "cyclic shape: entity can loop back"
        grounds: [state_machines.Section.CLOSED_to_OPEN, "errors[ERR_SECTION_NOT_OPEN]", "errors[ERR_SECTION_NOT_CLOSED]"]
