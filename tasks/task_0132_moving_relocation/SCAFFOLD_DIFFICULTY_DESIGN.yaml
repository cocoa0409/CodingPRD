            - call: "POST /dispatches/${disp_id}/complete"
              payload: { actual_weight_lbs: 840 }
              as: Dispatcher
            - call: "POST /storage-lots/${lot_id}/release"
              payload: { release_date: "2026-07-11T00:00:00Z" }
              as: Dispatcher
            - call: "GET /move-jobs/${job_id}"
              payload: {}
              as: PlatformAdmin
              captures: { gross_before: $.data.gross_charges_cents, job_v_pre_waive: $.data.version }
          trigger:
            - call: "POST /storage-lots/${lot_id}/waive"
              payload: { expected_move_job_version: "${job_v_pre_waive}" }
              as: PlatformAdmin
          assert:
            - "StorageLot.${lot_id}.sit_charge_cents == 51400"
            - "MoveJob.${job_id}.waived_cents == 51400"
            - "MoveJob.${job_id}.gross_charges_cents == ${gross_before}"

      - name: claim_reopen_conserves_payout_credit
        grounds:
          - state_machines.DamageClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.DamageClaim.APPROVED_to_UNDER_REVIEW
          - entities.MoveJob.fields.refunded_cents
          - entities.DamageClaim.fields.settlement_cents
        distinguishing_aspect: "Conserved quantity = MoveJob.refunded_cents (a payout-credit ledger, a DIFFERENT conserved type than gross_charges): approve adds settlement 2400 to refunded_cents; reopen subtracts exactly 2400, restoring refunded_cents to its pre-approval value with zero drift."
        test_recipe:
          setup:
            - "DELIVERED RELEASED job with an UNDER_REVIEW claim (single 40lb item) and refunded_cents == 0 before approval."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ci2@x.com", full_name: "CI Two", origin_state_code: "CA", phone: "555-1800" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "NON_BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v}" }
              as: Estimator
              as_user_id: "estimator-e"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /move-jobs/${job_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 10000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trucks"
              payload: { plate: "CI2-TRK", capacity_cubic_feet: 2000, home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "CI2 Crew", head_count: 3, home_state_code: "CA" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /dispatches"
              payload: { move_job_id: "${job_id}", truck_id: "${truck_id}", crew_id: "${crew_id}", window_start: "2026-07-01T09:00:00Z", window_end: "2026-07-01T12:00:00Z", required_crew_size: 3 }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /dispatches/${disp_id}/depart"
              payload: {}
              as: Dispatcher
            - call: "POST /dispatches/${disp_id}/complete"
              payload: { actual_weight_lbs: 840 }
              as: Dispatcher
            - call: "POST /damage-claims"
              payload: { move_job_id: "${job_id}" }
              as: ClaimsAdjuster
              as_user_id: "adj-filer"
              captures: { claim_id: $.data.id }
            - call: "POST /damage-claims/${claim_id}/items"
              payload: { label: "mirror", item_weight_lbs: 40, repair_cost_cents: 90000, replacement_value_cents: 150000 }
              as: ClaimsAdjuster
              as_user_id: "adj-filer"
            - call: "POST /damage-claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-approver"
          trigger:
            - call: "POST /damage-claims/${claim_id}/reopen"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-approver"
          assert:
            - "DamageClaim.${claim_id}.settlement_cents == 0"
            - "MoveJob.${job_id}.refunded_cents == 0"
            - "DamageClaim.${claim_id}.status == UNDER_REVIEW"
