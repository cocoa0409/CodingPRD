              as: LoadControlAdmin
              captures: { rw: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /performance-bands"
