              payload: { document_year: 2027, governing_capital_plan_id: "${plan_xd2}", sections: [{section_code: "GOVERNANCE", content: "x"}, {section_code: "RISK_APPETITE", content: "x"}, {section_code: "CAPITAL_ADEQUACY", content: "x"}, {section_code: "STRESS_TESTING", content: "x"}, {section_code: "DISTRIBUTION_POLICY", content: "x"}] }
              as: CapitalAnalyst
              captures: { icaap_xd2: $.data.id }
          trigger:
            - call: "POST /banks/${bank_xd2}/icaap-documents/${icaap_xd2}/submit_review"
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "CapitalPlan.${plan_xd2}.status == SUBMITTED  # not APPROVED or EFFECTIVE"
            - "error_id == ERR_PLAN_NOT_FINAL"
            - "ICAAPDocument.${icaap_xd2}.status == DRAFT  # unchanged"

  # -------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: distribution_window_half_open_interval
        grounds:
          - state_machines.CapitalDistributionRequest.transitions
          - validations[priority=9]
        distinguishing_aspect: |
          Interval semantics: half-open payment window. Distribution may execute
          in the window [proposed_payment_date, proposed_payment_date + 10 days],
          inclusive at start, exclusive at end + 1 day. Executing exactly at
          proposed_payment_date succeeds; executing at proposed_payment_date + 11
          days fails (already EXPIRED). Resource entity: CapitalDistributionRequest.
        test_recipe:
          setup:
            - "Bank with APPROVED plan and two APPROVED_NOT_EXECUTED distributions, both payment_date 2027-03-15"
            - "Clock advanced to 2027-03-15 for D1 (execute succeeds)"
            - "Clock advanced to 2027-03-26 for D2 (payment_date + 11 days; auto-EXPIRED)"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "TempBank1", charter_id: "CH-TP1-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_tp1: $.data.id }
            - call: "POST /banks/${bank_tp1}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_tp1: $.data.id }
            - call: "POST /banks/${bank_tp1}/reporting-periods/${period_tp1}/risk-exposures"
              payload: { reporting_period_id: "${period_tp1}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp1}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp1}/reporting-periods/${period_tp1}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_tp1: $.data.id }
            - call: "POST /banks/${bank_tp1}/reporting-periods/${period_tp1}/call-reports/${report_tp1}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp1}/reporting-periods/${period_tp1}/call-reports/${report_tp1}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_tp1}/reporting-periods/${period_tp1}/call-reports/${report_tp1}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_tp1}/stress-scenarios"
              payload: { scenario_code: "BASE-TP1", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { scen_tp1: $.data.id }
            - call: "POST /banks/${bank_tp1}/stress-scenarios/${scen_tp1}/activate"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp1}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${period_tp1}", stress_scenario_id: "${scen_tp1}" }
              as: CapitalAnalyst
              captures: { plan_tp1: $.data.id }
            - call: "POST /banks/${bank_tp1}/capital-plans/${plan_tp1}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
            - call: "POST /banks/${bank_tp1}/capital-plans/${plan_tp1}/board_approve"
              as: BoardApprover
              as_user_id: "board-1"
            - call: "GET /banks/${bank_tp1}"
              as: CapitalAnalyst
              captures: { bank_v_tp1a: $.data.version }
            - call: "POST /banks/${bank_tp1}/capital-plans/${plan_tp1}/submit_regulator"
              payload: { expected_bank_version: "${bank_v_tp1a}" }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp1}/capital-plans/${plan_tp1}/regulator_approve"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_tp1}/distribution-requests"
              payload: { capital_plan_id: "${plan_tp1}", reporting_period_id: "${period_tp1}", distribution_kind: "DIVIDEND", distribution_amount_cents: 50000000, proposed_payment_date: "2027-03-15" }
              as: CapitalAnalyst
              captures: { dist_d1: $.data.id }
            - call: "POST /banks/${bank_tp1}/distribution-requests"
              payload: { capital_plan_id: "${plan_tp1}", reporting_period_id: "${period_tp1}", distribution_kind: "BUYBACK", distribution_amount_cents: 30000000, proposed_payment_date: "2027-03-15" }
              as: CapitalAnalyst
              captures: { dist_d2: $.data.id }
            - call: "GET /banks/${bank_tp1}"
              as: CapitalAnalyst
              captures: { bank_v_tp1b: $.data.version }
            - call: "POST /banks/${bank_tp1}/distribution-requests/${dist_d1}/approve"
              payload: { expected_bank_version: "${bank_v_tp1b}" }
              as: CapitalAnalyst
            - call: "GET /banks/${bank_tp1}"
              as: CapitalAnalyst
              captures: { bank_v_tp1c: $.data.version }
            - call: "POST /banks/${bank_tp1}/distribution-requests/${dist_d2}/approve"
              payload: { expected_bank_version: "${bank_v_tp1c}" }
              as: CapitalAnalyst
            # Move clock to exactly payment date for D1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-15T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /banks/${bank_tp1}/distribution-requests/${dist_d1}/execute"
              as: CapitalAnalyst
              captures: { d1_status: $.data.status, d1_exec: $.data.executed_amount_cents }
            # Move clock past window for D2
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-26T09:00:00Z" }  # payment_date + 11 days
              as: SystemOperator
            - call: "POST /banks/${bank_tp1}/distribution-requests/${dist_d2}/execute"
              as: CapitalAnalyst
              captures: { d2_err: $.data.error_id }
          assert:
            - "D1 executed at exactly payment_date: status == EXECUTED, executed_amount_cents == 50000000"
            - "D2 execute at payment_date + 11 days: error_id == ERR_INVALID_STATE_TRANSITION (auto-EXPIRED) OR ERR_TEMPORAL_VIOLATION"
            - "Boundary: [payment_date, payment_date + 10 days] inclusive; day 11 is outside"

      - name: reporting_period_close_chronological_order
        grounds:
          - state_machines.ReportingPeriod.transitions
          - validations[priority=9]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity over the period sequence — a
          period cannot close while any EARLIER period is non-CLOSED. Different
          from the distribution half-open window (which is a single-entity
          duration check): this is an aggregate sequencing rule across a
          chronologically ordered set of sibling ReportingPeriod entities.
        test_recipe:
          setup:
            - "Bank with two periods P1 2026Q1 and P2 2026Q2, both ACCEPTED (filed and accepted)"
            - "Attempt to close P2 BEFORE closing P1 — must fail"
            - "Then close P1, then P2 — both succeed"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "TempBank2", charter_id: "CH-TP2-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_tp2: $.data.id }
            - call: "POST /banks/${bank_tp2}/reporting-periods"
              payload: { period_end_date: "2026-03-31", period_year: 2026, period_quarter: "Q1" }
              as: CapitalAnalyst
              captures: { p1_tp2: $.data.id }
            - call: "POST /banks/${bank_tp2}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p2_tp2: $.data.id }
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p1_tp2}/risk-exposures"
              payload: { reporting_period_id: "${p1_tp2}", exposure_class: "CORPORATE", exposure_at_default_cents: 50000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p2_tp2}/risk-exposures"
              payload: { reporting_period_id: "${p2_tp2}", exposure_class: "CORPORATE", exposure_at_default_cents: 50000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp2}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p1_tp2}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { rep1_tp2: $.data.id }
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p1_tp2}/call-reports/${rep1_tp2}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p1_tp2}/call-reports/${rep1_tp2}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p1_tp2}/call-reports/${rep1_tp2}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p2_tp2}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { rep2_tp2: $.data.id }
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p2_tp2}/call-reports/${rep2_tp2}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p2_tp2}/call-reports/${rep2_tp2}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p2_tp2}/call-reports/${rep2_tp2}/accept"
              as: RegulatorReviewer
          trigger:
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p2_tp2}/close"
              as: CapitalAnalyst
              captures: { err_out_of_order: $.data.error_id }
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p1_tp2}/close"
              as: CapitalAnalyst
              captures: { p1_status: $.data.status }
            - call: "POST /banks/${bank_tp2}/reporting-periods/${p2_tp2}/close"
              as: CapitalAnalyst
              captures: { p2_status: $.data.status }
          assert:
            - "Closing P2 first fails: error_id == ERR_TEMPORAL_VIOLATION (chronological close order)"
            - "Closing P1 succeeds: status == CLOSED"
            - "Closing P2 after P1 succeeds: status == CLOSED"

  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: distribution_approve_withdraw_conserves_mdba_pending
        grounds:
          - state_machines.CapitalDistributionRequest.transitions
          - entities.Bank.fields.pending_distribution_cents
          - entities.Bank.fields.mdba_cents
        distinguishing_aspect: |
          Conserved quantity: pending_distribution_cents. Forward action
          (approve) increments pending by X; compensating action (withdraw)
          decrements pending by exactly X. After the pair, pending returns
          to its pre-approve value and mdba_cents is unchanged.
        test_recipe:
          setup:
            - "Bank with APPROVED plan; baseline pending_distribution_cents = 0, mdba_cents = M"
            - "Distribution request for 75_000_000 cents"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "CompBank1", charter_id: "CH-CP1-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_cp1: $.data.id }
            - call: "POST /banks/${bank_cp1}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_cp1: $.data.id }
            - call: "POST /banks/${bank_cp1}/reporting-periods/${period_cp1}/risk-exposures"
              payload: { reporting_period_id: "${period_cp1}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cp1}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cp1}/reporting-periods/${period_cp1}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_cp1: $.data.id }
            - call: "POST /banks/${bank_cp1}/reporting-periods/${period_cp1}/call-reports/${report_cp1}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cp1}/reporting-periods/${period_cp1}/call-reports/${report_cp1}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_cp1}/reporting-periods/${period_cp1}/call-reports/${report_cp1}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_cp1}/stress-scenarios"
              payload: { scenario_code: "BASE-CP1", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { scen_cp1: $.data.id }
            - call: "POST /banks/${bank_cp1}/stress-scenarios/${scen_cp1}/activate"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cp1}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${period_cp1}", stress_scenario_id: "${scen_cp1}" }
              as: CapitalAnalyst
              captures: { plan_cp1: $.data.id }
            - call: "POST /banks/${bank_cp1}/capital-plans/${plan_cp1}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
            - call: "POST /banks/${bank_cp1}/capital-plans/${plan_cp1}/board_approve"
              as: BoardApprover
              as_user_id: "board-1"
            - call: "GET /banks/${bank_cp1}"
              as: CapitalAnalyst
              captures: { bank_v_cp1a: $.data.version }
            - call: "POST /banks/${bank_cp1}/capital-plans/${plan_cp1}/submit_regulator"
              payload: { expected_bank_version: "${bank_v_cp1a}" }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cp1}/capital-plans/${plan_cp1}/regulator_approve"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_cp1}/distribution-requests"
              payload: { capital_plan_id: "${plan_cp1}", reporting_period_id: "${period_cp1}", distribution_kind: "DIVIDEND", distribution_amount_cents: 75000000, proposed_payment_date: "2027-03-15" }
              as: CapitalAnalyst
              captures: { dist_cp1: $.data.id }
            - call: "GET /banks/${bank_cp1}"
              as: CapitalAnalyst
              captures: { pending_before: $.data.pending_distribution_cents, mdba_before: $.data.mdba_cents, bank_v_cp1b: $.data.version }
          trigger:
            - call: "POST /banks/${bank_cp1}/distribution-requests/${dist_cp1}/approve"
              payload: { expected_bank_version: "${bank_v_cp1b}" }
              as: CapitalAnalyst
            - call: "GET /banks/${bank_cp1}"
              as: CapitalAnalyst
              captures: { pending_mid: $.data.pending_distribution_cents, mdba_mid: $.data.mdba_cents }
            - call: "POST /banks/${bank_cp1}/distribution-requests/${dist_cp1}/withdraw"
              as: CapitalAnalyst
            - call: "GET /banks/${bank_cp1}"
              as: CapitalAnalyst
              captures: { pending_after: $.data.pending_distribution_cents, mdba_after: $.data.mdba_cents }
          assert:
            - "pending_before == 0"
            - "pending_mid == 75000000  # approve incremented by distribution_amount_cents"
            - "pending_after == 0  # withdraw decremented back"
            - "mdba_after == mdba_before  # conserved: withdraw restores mdba"
            - "Invariant: approve + withdraw leaves Bank.pending_distribution_cents unchanged AND Bank.mdba_cents unchanged"

      - name: sub_debt_settle_then_call_conserves_t2_headroom
        grounds:
          - state_machines.SubordinatedDebtIssuance.transitions
          - state_machines.CapitalInstrument.transitions
          - calculations.t2_capacity_headroom
        distinguishing_aspect: |
          Conserved quantity: t2_capacity_headroom_cents (on open
          SubordinatedDebtIssuance rows). Forward action (settle) consumes
          headroom; compensating action (call the resulting instrument)
          restores headroom to its pre-settle value. Different conserved
          quantity than pending_distribution_cents above.
        test_recipe:
          setup:
            - "Bank with accepted report (RWA 100e9, T2 cap = 2e9)"
            - "Sub-debt P1 for 800_000_000 → approved, priced"
            - "Open sub-debt P2 in PROPOSED with initial headroom = 2_000_000_000"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "CompBank2", charter_id: "CH-CP2-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_cp2: $.data.id }
            - call: "POST /banks/${bank_cp2}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_cp2: $.data.id }
            - call: "POST /banks/${bank_cp2}/reporting-periods/${period_cp2}/risk-exposures"
              payload: { reporting_period_id: "${period_cp2}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cp2}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cp2}/reporting-periods/${period_cp2}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_cp2: $.data.id }
            - call: "POST /banks/${bank_cp2}/reporting-periods/${period_cp2}/call-reports/${report_cp2}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cp2}/reporting-periods/${period_cp2}/call-reports/${report_cp2}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_cp2}/reporting-periods/${period_cp2}/call-reports/${report_cp2}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_cp2}/sub-debt-issuances"
              payload: { proposed_amount_cents: 800000000, proposed_rate_bps: 500, maturity_years: 10, target_settlement_date: "2026-08-15" }
              as: CapitalAnalyst
              captures: { sd_cp2: $.data.id }
            - call: "POST /banks/${bank_cp2}/sub-debt-issuances"
              payload: { proposed_amount_cents: 100000000, proposed_rate_bps: 600, maturity_years: 5, target_settlement_date: "2026-09-01" }
              as: CapitalAnalyst
              captures: { sd_cp2_observer: $.data.id, headroom_initial: $.data.t2_capacity_headroom_cents }
            - call: "GET /banks/${bank_cp2}"
              as: CapitalAnalyst
              captures: { bank_v_cp2a: $.data.version }
            - call: "POST /banks/${bank_cp2}/sub-debt-issuances/${sd_cp2}/approve"
              payload: { expected_bank_version: "${bank_v_cp2a}" }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cp2}/sub-debt-issuances/${sd_cp2}/price"
              as: CapitalAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T12:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /banks/${bank_cp2}/sub-debt-issuances/${sd_cp2}/settle"
              as: CapitalAnalyst
              captures: { instr_id: $.data.capital_instrument_id }
            - call: "GET /banks/${bank_cp2}/sub-debt-issuances/${sd_cp2_observer}"
              as: CapitalAnalyst
              captures: { headroom_after_settle: $.data.t2_capacity_headroom_cents }
            - call: "POST /banks/${bank_cp2}/capital-instruments/${instr_id}/call"
              as: CapitalAnalyst
            - call: "GET /banks/${bank_cp2}/sub-debt-issuances/${sd_cp2_observer}"
              as: CapitalAnalyst
              captures: { headroom_after_call: $.data.t2_capacity_headroom_cents }
          assert:
            - "headroom_initial == 2000000000"
            - "headroom_after_settle == 1200000000  # 2e9 - 800e6"
            - "headroom_after_call == 2000000000  # call restored full headroom"
            - "Invariant: settle + call leaves t2_capacity_headroom_cents unchanged on observer ${sd_cp2_observer}"
