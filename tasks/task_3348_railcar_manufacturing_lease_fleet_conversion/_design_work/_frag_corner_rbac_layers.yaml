            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_o_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_id: "$.data[0].id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_id}", lease_contract_id: "${lc_id}", lessee_id: "${ls_id}", start_date: "2024-06-01", end_date: "2027-01-01", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg_id: $.data.id, seq_before: $.data.id }
            - call: "GET /api/v1/car-assignments/${asg_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { accrued_before: $.data.per_diem_accrued_cents }
            - call: "POST /api/v1/lease-contracts/${lc_id}/amendments"
              payload: { per_diem_rate_cents: 10000, liability_bearer: "LESSEE", expected_lease_version: "${lc_v1}" }
              as: LeaseAdministrator
              captures: { lc_v2: $.data.version }
          trigger:
            - call: "POST /api/v1/lease-contracts/${lc_id}/amendments/ratify"
              payload: { expected_lease_version: "${lc_v2}" }
              as: LeaseAdministrator
              captures: { status_in_response: $.data.status, seq_in_response: $.data.amendment_seq, v_in_response: $.data.version }
            - call: "GET /api/v1/car-assignments/${asg_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { accrued_immediate: $.data.per_diem_accrued_cents, asg_status_immediate: $.data.status }
          assert:
            - "Before ratification the placement reads the open-placement accrual data.per_diem_accrued_cents == ${accrued_before} == 8220000"
            - "The ratify response itself carries the cascade counter, not a deferred one: data.status == ${status_in_response} == \"ACTIVE\" and data.amendment_seq == ${seq_in_response} == 1"
            - "The response also carries its own version bump: data.version == ${v_in_response} == ${lc_v2} + 1"
            - "The restated accrual is readable in the same instant, with no clock movement and no second write: the placement now returns data.per_diem_accrued_cents == ${accrued_immediate} == 3650000"
            - "The placement is untouched by the restatement: data.status == ${asg_status_immediate} == \"ACTIVE\""
            - "Both the contract counter and the restated assignment field are observable without any delay, which is exactly what the immediate consistency model promises"
