    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/estimates/{id}"
    description: "Get an estimate with computed totals"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: []
    output: Estimate
    side_effects: []

  - method: GET
    path: "/estimates"
    description: "List estimates, filterable by job_id"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: ["job_id?", "status?"]
    output: Estimate[]
    side_effects: []

  - method: POST
    path: "/estimates/{id}/line-items"
    description: "Append a line item to a DRAFT estimate"
    roles: [Estimator]
