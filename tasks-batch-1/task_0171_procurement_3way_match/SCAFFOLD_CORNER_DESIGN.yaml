              payload: { name: "Cat", code: "CALC1CAT", approval_threshold_cents: 500000, director_threshold_cents: 2000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "B", lines: [ { sku: "A", description: "A", quantity: 10, estimated_unit_price_cents: 50000 } ] }
