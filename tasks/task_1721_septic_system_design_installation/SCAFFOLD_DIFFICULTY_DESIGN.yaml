            - "Design.${db}.required_absorption_area_sqft == 450 (reduced variant: 360 gpd / 0.80)"
            - "Design.${da}.tank_capacity_gal == 1000"
            - "Design.${db}.tank_capacity_gal == 1000 (tank leg stays on book flow despite the approved AREA_REDUCTION variance)"
            - "Design.${da}.reserve_area_sqft == 563"
            - "Design.${db}.reserve_area_sqft == 450"

