# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 Difficulty Rules x 2 instances. All chains replay against SCAFFOLD.yaml §1.2/§1.4/§1.5.
# Canonical literal fixture: profile tasks [Government ID(req, DOCUMENT_UPLOAD), NDA(req, FORM_ACK),
# Handbook(opt, POLICY_READ)]; trainings [SEC101 +7d, HR201 +14d]; equipment [Laptop x1]; access [VPN];
# probation_days 90; max_probation_extensions 1; extension_days 30; buddy interval 7 count 2;
# manager offsets [1,30]; sla 48h. Case start_date 2026-05-04 (Mon). Default clock 2026-05-01T00:00:00Z.

scaffold_difficulty_design:
  # ================================================================ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: ttp_estimated_forward_vs_actual_chronological
        grounds:
          - calculations.time_to_productivity
          - state_machines.TrainingAssignment.ASSIGNED_to_COMPLETED
          - state_machines.CheckIn.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          OnboardingCase domain: ESTIMATED variant is forward-looking (profile base max(14,30) + slip
          penalties = 30), ACTUAL variant is chronological (last completion date 2026-05-06 minus start
          2026-05-04 = 2). Identical case data yields 30 vs 2 — the test asserts both literals.
        test_recipe:
          setup:
            - "Case IN_PROGRESS at clock 2026-05-04T00:00:00Z; both trainings ASSIGNED; 4 check-ins SCHEDULED"
            - "MANAGER check-ins completed 2026-05-05T08:00:00Z; trainings still ASSIGNED; nothing OVERDUE or MISSED"
          setup_api_calls:
            - { call: "POST /api/role-profiles", as: HRAdmin, captures: { p_id: "$.data.id" }, payload: { name: "SE", preboarding_tasks: [{task_kind: "DOCUMENT_UPLOAD", title: "Government ID", is_required: true}, {task_kind: "FORM_ACK", title: "NDA", is_required: true}, {task_kind: "POLICY_READ", title: "Handbook", is_required: false}], training_modules: [{module_code: "SEC101", due_offset_days: 7}, {module_code: "HR201", due_offset_days: 14}], equipment_items: [{item_name: "Laptop", quantity: 1}], access_grants: [{system_name: "VPN", permission_level: "STANDARD"}], probation_days: 90, max_probation_extensions: 1, extension_days: 30, buddy_checkin_interval_days: 7, buddy_checkin_count: 2, manager_checkin_offsets_days: [1, 30], provisioning_sla_hours: 48 } }
            - { call: "POST /api/role-profiles/${p_id}/publish", as: HRAdmin }
            - { call: "POST /api/employees", as: HRAdmin, captures: { mgr_id: "$.data.id" }, payload: { full_name: "Mgr One", email: "mgr-r1a@x.com" } }
            - { call: "POST /api/employees", as: HRAdmin, captures: { bud_id: "$.data.id" }, payload: { full_name: "Bud One", email: "bud-r1a@x.com", manager_id: "${mgr_id}" } }
            - { call: "POST /api/new-hires", as: HRAdmin, captures: { nh_id: "$.data.id" }, payload: { full_name: "New Hire", personal_email: "nh-r1a@x.com", start_date: "2026-05-04", department: "Engineering" } }
            - { call: "POST /api/onboarding-cases", as: HRAdmin, captures: { case_id: "$.data.id" }, payload: { new_hire_id: "${nh_id}", role_profile_id: "${p_id}", manager_id: "${mgr_id}", buddy_id: "${bud_id}", start_date: "2026-05-04", base_salary_cents: 90000, signing_bonus_cents: 10000, relocation_stipend_cents: 2500, benefits_tier: "PLUS" } }
            - { call: "GET /api/onboarding-cases/${case_id}/tasks", as: HRAdmin, captures: { t1: "$.data[0].id", t2: "$.data[1].id" } }
            - { call: "POST /api/onboarding-tasks/${t1}/submit", as: NewHire, as_user_id: "${nh_id}", payload: { document_ref: "doc://id-1" } }
            - { call: "POST /api/onboarding-tasks/${t1}/review", as: HRAdmin, payload: { decision: "APPROVE" } }
            - { call: "POST /api/onboarding-tasks/${t2}/submit", as: NewHire, as_user_id: "${nh_id}", payload: { note: "signed" } }
            - { call: "POST /api/onboarding-tasks/${t2}/review", as: HRAdmin, payload: { decision: "APPROVE" } }
            - { call: "POST /api/onboarding-cases/${case_id}/submit-for-clearance", as: HRAdmin, as_user_id: "hr-1" }
            - { call: "GET /api/onboarding-cases/${case_id}/clearance-cases", as: HRAdmin, captures: { cl_id: "$.data[0].id" } }
            - { call: "POST /api/clearance-cases/${cl_id}/record-result", as: HRAdmin, payload: { component: "BACKGROUND", result: "PASSED" } }
            - { call: "POST /api/clearance-cases/${cl_id}/record-result", as: HRAdmin, payload: { component: "REFERENCE", result: "PASSED" } }
            - { call: "GET /api/onboarding-cases/${case_id}/provisioning-orders", as: HRAdmin, captures: { ord_id: "$.data[0].id" } }
            - { call: "GET /api/provisioning-orders/${ord_id}/items", as: HRAdmin, captures: { i1: "$.data[0].id", i2: "$.data[1].id" } }
            - { call: "POST /api/provisioning-orders/${ord_id}/submit", as: HRAdmin }
            - { call: "POST /api/provisioning-items/${i1}/transition", as: ITProvisioner, payload: { to: "IN_FULFILLMENT" } }
            - { call: "POST /api/provisioning-items/${i1}/transition", as: ITProvisioner, payload: { to: "DONE" } }
            - { call: "POST /api/provisioning-items/${i2}/transition", as: ITProvisioner, payload: { to: "IN_FULFILLMENT" } }
            - { call: "POST /api/provisioning-items/${i2}/transition", as: ITProvisioner, payload: { to: "DONE" } }
            - { call: "POST /api/orientation-sessions", as: HRAdmin, captures: { s_id: "$.data.id" }, payload: { room: "R1", starts_at: "2026-05-04T09:00:00Z", ends_at: "2026-05-04T12:00:00Z", capacity: 10 } }
            - { call: "POST /api/onboarding-cases/${case_id}/orientation-booking", as: HRAdmin, payload: { session_id: "${s_id}" } }
            - { call: "POST /api/_clock/set_current_utc", as: HRAdmin, payload: { to_iso8601: "2026-05-04T00:00:00Z" } }
            - { call: "GET /api/onboarding-cases/${case_id}/training-assignments", as: HRAdmin, captures: { tr1: "$.data[0].id", tr2: "$.data[1].id" } }
            - { call: "GET /api/onboarding-cases/${case_id}/check-ins", as: HRAdmin, captures: { c_m1: "$.data[0].id", c_m2: "$.data[1].id", c_b1: "$.data[2].id", c_b2: "$.data[3].id" } }
            - { call: "POST /api/_clock/set_current_utc", as: HRAdmin, payload: { to_iso8601: "2026-05-05T08:00:00Z" } }
            - { call: "POST /api/check-ins/${c_m1}/complete", as: HiringManager, as_user_id: "${mgr_id}", payload: { productivity_rating: 4 } }
            - { call: "POST /api/check-ins/${c_m2}/complete", as: HiringManager, as_user_id: "${mgr_id}", payload: { productivity_rating: 5 } }
            - { call: "POST /api/_clock/set_current_utc", as: HRAdmin, payload: { to_iso8601: "2026-05-06T08:00:00Z" } }
          trigger:
            - { call: "POST /api/training-assignments/${tr1}/complete", as: NewHire, as_user_id: "${nh_id}", payload: { score: 90 } }
            - { call: "POST /api/training-assignments/${tr2}/complete", as: NewHire, as_user_id: "${nh_id}", payload: { score: 85 } }
            - { call: "GET /api/onboarding-cases/${case_id}/summary", as: HRAdmin, captures: { est: "$.data.estimated_ttp_days", act: "$.data.actual_ttp_days", ph: "$.data.phase" } }
          assert:
            - "summary.estimated_ttp_days == 30 (forward-looking variant: base max(14,30) + 3*0 overdue + 5*0 missed)"
            - "summary.actual_ttp_days == 2 (chronological variant: last completion 2026-05-06 minus start_date 2026-05-04)"
            - "summary.estimated_ttp_days != summary.actual_ttp_days for identical data (30 vs 2)"
            - "summary.phase == PROBATION (gate: all trainings COMPLETED and >= 1 MANAGER check-in COMPLETED)"

      - name: provisioning_sla_calendar_vs_business_hours
        grounds:
          - calculations.provisioning_sla_elapsed
          - entities.ProvisioningOrder.fields.sla_breached_calendar
          - entities.ProvisioningOrder.fields.sla_breached_business
        distinguishing_aspect: |
          ProvisioningOrder domain (different entity domain than the TTP instance): CALENDAR variant counts
          weekend hours (73.0h, breached), BUSINESS variant excludes Sat/Sun (25.0h, not breached) for the
          identical submitted_at/now interval — the test asserts both variants and both booleans.
        test_recipe:
          setup:
            - "Case in PROVISIONING with a DRAFT order (sla_hours 48 pinned from profile)"
            - "Order submitted at logical time 2026-05-08T10:00:00Z (Friday); clock then advanced to 2026-05-11T11:00:00Z (Monday)"
          setup_api_calls:
            - { call: "POST /api/role-profiles", as: HRAdmin, captures: { p_id: "$.data.id" }, payload: { name: "SE", preboarding_tasks: [{task_kind: "DOCUMENT_UPLOAD", title: "Government ID", is_required: true}, {task_kind: "FORM_ACK", title: "NDA", is_required: true}, {task_kind: "POLICY_READ", title: "Handbook", is_required: false}], training_modules: [{module_code: "SEC101", due_offset_days: 7}, {module_code: "HR201", due_offset_days: 14}], equipment_items: [{item_name: "Laptop", quantity: 1}], access_grants: [{system_name: "VPN", permission_level: "STANDARD"}], probation_days: 90, max_probation_extensions: 1, extension_days: 30, buddy_checkin_interval_days: 7, buddy_checkin_count: 2, manager_checkin_offsets_days: [1, 30], provisioning_sla_hours: 48 } }
            - { call: "POST /api/role-profiles/${p_id}/publish", as: HRAdmin }
            - { call: "POST /api/employees", as: HRAdmin, captures: { mgr_id: "$.data.id" }, payload: { full_name: "Mgr Two", email: "mgr-r1b@x.com" } }
            - { call: "POST /api/employees", as: HRAdmin, captures: { bud_id: "$.data.id" }, payload: { full_name: "Bud Two", email: "bud-r1b@x.com", manager_id: "${mgr_id}" } }
            - { call: "POST /api/new-hires", as: HRAdmin, captures: { nh_id: "$.data.id" }, payload: { full_name: "New Hire", personal_email: "nh-r1b@x.com", start_date: "2026-05-04", department: "Engineering" } }
            - { call: "POST /api/onboarding-cases", as: HRAdmin, captures: { case_id: "$.data.id" }, payload: { new_hire_id: "${nh_id}", role_profile_id: "${p_id}", manager_id: "${mgr_id}", buddy_id: "${bud_id}", start_date: "2026-05-04", base_salary_cents: 90000, signing_bonus_cents: 10000, relocation_stipend_cents: 2500, benefits_tier: "PLUS" } }
            - { call: "GET /api/onboarding-cases/${case_id}/tasks", as: HRAdmin, captures: { t1: "$.data[0].id", t2: "$.data[1].id" } }
            - { call: "POST /api/onboarding-tasks/${t1}/submit", as: NewHire, as_user_id: "${nh_id}", payload: { document_ref: "doc://id-1" } }
            - { call: "POST /api/onboarding-tasks/${t1}/review", as: HRAdmin, payload: { decision: "APPROVE" } }
            - { call: "POST /api/onboarding-tasks/${t2}/submit", as: NewHire, as_user_id: "${nh_id}", payload: { note: "signed" } }
            - { call: "POST /api/onboarding-tasks/${t2}/review", as: HRAdmin, payload: { decision: "APPROVE" } }
            - { call: "POST /api/onboarding-cases/${case_id}/submit-for-clearance", as: HRAdmin, as_user_id: "hr-1" }
            - { call: "GET /api/onboarding-cases/${case_id}/clearance-cases", as: HRAdmin, captures: { cl_id: "$.data[0].id" } }
            - { call: "POST /api/clearance-cases/${cl_id}/record-result", as: HRAdmin, payload: { component: "BACKGROUND", result: "PASSED" } }
            - { call: "POST /api/clearance-cases/${cl_id}/record-result", as: HRAdmin, payload: { component: "REFERENCE", result: "PASSED" } }
            - { call: "GET /api/onboarding-cases/${case_id}/provisioning-orders", as: HRAdmin, captures: { ord_id: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", as: HRAdmin, payload: { to_iso8601: "2026-05-08T10:00:00Z" } }
            - { call: "POST /api/provisioning-orders/${ord_id}/submit", as: HRAdmin }
            - { call: "POST /api/_clock/set_current_utc", as: HRAdmin, payload: { to_iso8601: "2026-05-11T11:00:00Z" } }
          trigger:
            - { call: "GET /api/provisioning-orders/${ord_id}", as: HRAdmin, captures: { cal: "$.data.elapsed_calendar_hours", biz: "$.data.elapsed_business_hours", bc: "$.data.sla_breached_calendar", bb: "$.data.sla_breached_business", sla: "$.data.sla_hours" } }
          assert:
            - "ProvisioningOrder.${ord_id}.elapsed_calendar_hours == 73.0 (Fri 10:00Z to Mon 11:00Z wall clock)"
            - "ProvisioningOrder.${ord_id}.elapsed_business_hours == 25.0 (Fri 14h + Mon 11h; Sat/Sun excluded)"
            - "ProvisioningOrder.${ord_id}.sla_breached_calendar == true (73.0 > 48)"
            - "ProvisioningOrder.${ord_id}.sla_breached_business == false (25.0 <= 48)"
            - "ProvisioningOrder.${ord_id}.sla_hours == 48 (pinned from RoleProfile.provisioning_sla_hours)"

  # ================================================================ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: health_score_multi_input_conditional_formula
        grounds:
          - calculations.case_health_score
          - entities.OnboardingCase.fields.health
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — nested max(0, ...) floor plus conditional
          terms keyed on child entity state (OVERDUE trainings, MISSED check-ins, probation overdue,
          order ATTENTION_REQUIRED, NO_SHOW). Stage 1 drives 2 OVERDUE trainings => exactly 70 => ON_TRACK;
          stage 2 adds 1 MISSED check-in => 60 => AT_RISK. Differs from the rounding-order mode (b) instance.
        test_recipe:
          setup:
            - "Case IN_PROGRESS; check-ins c_m1, c_b1, c_b2 completed early at clock 2026-05-04T00:00:00Z; c_m2 (2026-06-03T09:00:00Z) left SCHEDULED"
            - "Clock advanced to 2026-05-19T00:00:00Z: both trainings OVERDUE (due 2026-05-11T23:59:59Z / 2026-05-18T23:59:59Z), zero MISSED check-ins"
          setup_api_calls:
            - { call: "POST /api/role-profiles", as: HRAdmin, captures: { p_id: "$.data.id" }, payload: { name: "SE", preboarding_tasks: [{task_kind: "DOCUMENT_UPLOAD", title: "Government ID", is_required: true}, {task_kind: "FORM_ACK", title: "NDA", is_required: true}, {task_kind: "POLICY_READ", title: "Handbook", is_required: false}], training_modules: [{module_code: "SEC101", due_offset_days: 7}, {module_code: "HR201", due_offset_days: 14}], equipment_items: [{item_name: "Laptop", quantity: 1}], access_grants: [{system_name: "VPN", permission_level: "STANDARD"}], probation_days: 90, max_probation_extensions: 1, extension_days: 30, buddy_checkin_interval_days: 7, buddy_checkin_count: 2, manager_checkin_offsets_days: [1, 30], provisioning_sla_hours: 48 } }
            - { call: "POST /api/role-profiles/${p_id}/publish", as: HRAdmin }
            - { call: "POST /api/employees", as: HRAdmin, captures: { mgr_id: "$.data.id" }, payload: { full_name: "Mgr Three", email: "mgr-r2a@x.com" } }
            - { call: "POST /api/employees", as: HRAdmin, captures: { bud_id: "$.data.id" }, payload: { full_name: "Bud Three", email: "bud-r2a@x.com", manager_id: "${mgr_id}" } }
            - { call: "POST /api/new-hires", as: HRAdmin, captures: { nh_id: "$.data.id" }, payload: { full_name: "New Hire", personal_email: "nh-r2a@x.com", start_date: "2026-05-04", department: "Engineering" } }
            - { call: "POST /api/onboarding-cases", as: HRAdmin, captures: { case_id: "$.data.id" }, payload: { new_hire_id: "${nh_id}", role_profile_id: "${p_id}", manager_id: "${mgr_id}", buddy_id: "${bud_id}", start_date: "2026-05-04", base_salary_cents: 90000, signing_bonus_cents: 10000, relocation_stipend_cents: 2500, benefits_tier: "PLUS" } }
            - { call: "GET /api/onboarding-cases/${case_id}/tasks", as: HRAdmin, captures: { t1: "$.data[0].id", t2: "$.data[1].id" } }
            - { call: "POST /api/onboarding-tasks/${t1}/submit", as: NewHire, as_user_id: "${nh_id}", payload: { document_ref: "doc://id-1" } }
            - { call: "POST /api/onboarding-tasks/${t1}/review", as: HRAdmin, payload: { decision: "APPROVE" } }
            - { call: "POST /api/onboarding-tasks/${t2}/submit", as: NewHire, as_user_id: "${nh_id}", payload: { note: "signed" } }
            - { call: "POST /api/onboarding-tasks/${t2}/review", as: HRAdmin, payload: { decision: "APPROVE" } }
            - { call: "POST /api/onboarding-cases/${case_id}/submit-for-clearance", as: HRAdmin, as_user_id: "hr-1" }
            - { call: "GET /api/onboarding-cases/${case_id}/clearance-cases", as: HRAdmin, captures: { cl_id: "$.data[0].id" } }
            - { call: "POST /api/clearance-cases/${cl_id}/record-result", as: HRAdmin, payload: { component: "BACKGROUND", result: "PASSED" } }
            - { call: "POST /api/clearance-cases/${cl_id}/record-result", as: HRAdmin, payload: { component: "REFERENCE", result: "PASSED" } }
            - { call: "GET /api/onboarding-cases/${case_id}/provisioning-orders", as: HRAdmin, captures: { ord_id: "$.data[0].id" } }
            - { call: "GET /api/provisioning-orders/${ord_id}/items", as: HRAdmin, captures: { i1: "$.data[0].id", i2: "$.data[1].id" } }
            - { call: "POST /api/provisioning-orders/${ord_id}/submit", as: HRAdmin }
            - { call: "POST /api/provisioning-items/${i1}/transition", as: ITProvisioner, payload: { to: "IN_FULFILLMENT" } }
            - { call: "POST /api/provisioning-items/${i1}/transition", as: ITProvisioner, payload: { to: "DONE" } }
            - { call: "POST /api/provisioning-items/${i2}/transition", as: ITProvisioner, payload: { to: "IN_FULFILLMENT" } }
            - { call: "POST /api/provisioning-items/${i2}/transition", as: ITProvisioner, payload: { to: "DONE" } }
            - { call: "POST /api/orientation-sessions", as: HRAdmin, captures: { s_id: "$.data.id" }, payload: { room: "R1", starts_at: "2026-05-04T09:00:00Z", ends_at: "2026-05-04T12:00:00Z", capacity: 10 } }
            - { call: "POST /api/onboarding-cases/${case_id}/orientation-booking", as: HRAdmin, payload: { session_id: "${s_id}" } }
            - { call: "POST /api/_clock/set_current_utc", as: HRAdmin, payload: { to_iso8601: "2026-05-04T00:00:00Z" } }
            - { call: "GET /api/onboarding-cases/${case_id}/check-ins", as: HRAdmin, captures: { c_m1: "$.data[0].id", c_m2: "$.data[1].id", c_b1: "$.data[2].id", c_b2: "$.data[3].id" } }
            - { call: "POST /api/check-ins/${c_m1}/complete", as: HiringManager, as_user_id: "${mgr_id}", payload: { productivity_rating: 4 } }
            - { call: "POST /api/check-ins/${c_b1}/complete", as: Buddy, as_user_id: "${bud_id}" }
            - { call: "POST /api/check-ins/${c_b2}/complete", as: Buddy, as_user_id: "${bud_id}" }
            - { call: "POST /api/_clock/set_current_utc", as: HRAdmin, payload: { to_iso8601: "2026-05-19T00:00:00Z" } }
          trigger:
            - { call: "GET /api/onboarding-cases/${case_id}/summary", as: HRAdmin, captures: { s1_score: "$.data.health_score", s1_health: "$.data.health" } }
            - { call: "POST /api/_clock/set_current_utc", as: HRAdmin, payload: { to_iso8601: "2026-06-04T10:00:00Z" } }
            - { call: "GET /api/onboarding-cases/${case_id}/summary", as: HRAdmin, captures: { s2_score: "$.data.health_score", s2_health: "$.data.health" } }
          assert:
            - "Stage 1 summary.health_score == 70 (100 - 15*2 OVERDUE - 10*0 MISSED)"
            - "Stage 1 summary.health == ON_TRACK (70 >= 70 threshold)"
            - "Stage 2 summary.health_score == 60 (c_m2 flipped MISSED at 2026-06-04T09:00:00Z grace: 100 - 30 - 10)"
            - "Stage 2 summary.health == AT_RISK (60 < 70)"

      - name: first_period_gross_per_component_rounding_order
        grounds:
          - calculations.first_period_gross_proration
          - entities.PayrollHandoff.fields.first_period_gross_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — scaffold pins round-half-up per component THEN sum.
          Inputs base 90000 / bonus 10000 / relocation 2500 at ratio 11/14 give components
          70714 + 7857 + 1964 = 80535; the forbidden sum-then-round order yields 80536.
          The test asserts exactly 80535. Different mode than the health-score instance.
        test_recipe:
          setup:
            - "Case IN_PROGRESS (phase >= DAY_ONE_READY satisfied); compensation snapshot base 90000, bonus 10000, relocation 2500, start_date 2026-05-04"
          setup_api_calls:
            - { call: "POST /api/role-profiles", as: HRAdmin, captures: { p_id: "$.data.id" }, payload: { name: "SE", preboarding_tasks: [{task_kind: "DOCUMENT_UPLOAD", title: "Government ID", is_required: true}, {task_kind: "FORM_ACK", title: "NDA", is_required: true}, {task_kind: "POLICY_READ", title: "Handbook", is_required: false}], training_modules: [{module_code: "SEC101", due_offset_days: 7}, {module_code: "HR201", due_offset_days: 14}], equipment_items: [{item_name: "Laptop", quantity: 1}], access_grants: [{system_name: "VPN", permission_level: "STANDARD"}], probation_days: 90, max_probation_extensions: 1, extension_days: 30, buddy_checkin_interval_days: 7, buddy_checkin_count: 2, manager_checkin_offsets_days: [1, 30], provisioning_sla_hours: 48 } }
            - { call: "POST /api/role-profiles/${p_id}/publish", as: HRAdmin }
            - { call: "POST /api/employees", as: HRAdmin, captures: { mgr_id: "$.data.id" }, payload: { full_name: "Mgr Four", email: "mgr-r2b@x.com" } }
            - { call: "POST /api/employees", as: HRAdmin, captures: { bud_id: "$.data.id" }, payload: { full_name: "Bud Four", email: "bud-r2b@x.com", manager_id: "${mgr_id}" } }
            - { call: "POST /api/new-hires", as: HRAdmin, captures: { nh_id: "$.data.id" }, payload: { full_name: "New Hire", personal_email: "nh-r2b@x.com", start_date: "2026-05-04", department: "Engineering" } }
            - { call: "POST /api/onboarding-cases", as: HRAdmin, captures: { case_id: "$.data.id" }, payload: { new_hire_id: "${nh_id}", role_profile_id: "${p_id}", manager_id: "${mgr_id}", buddy_id: "${bud_id}", start_date: "2026-05-04", base_salary_cents: 90000, signing_bonus_cents: 10000, relocation_stipend_cents: 2500, benefits_tier: "PLUS" } }
            - { call: "GET /api/onboarding-cases/${case_id}/tasks", as: HRAdmin, captures: { t1: "$.data[0].id", t2: "$.data[1].id" } }
            - { call: "POST /api/onboarding-tasks/${t1}/submit", as: NewHire, as_user_id: "${nh_id}", payload: { document_ref: "doc://id-1" } }
