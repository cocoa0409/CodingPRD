        grounds:
          - calculations.parcel_value_decomposition
          - entities.ExemptionGrant.fields.applied_exempt_value_cents
          - entities.Parcel.fields.exemption_status
        distinguishing_aspect: "On assessed 1000000 the rank-10 grant absorbs its whole 900000 and the rank-40 grant — whose benefit_amount_cents is 500000 — is absorbed only up to the remaining 100000, so exempt_value_cents is 1000000, taxable_value_cents is 0 and exemption_status is FULLY_EXEMPT while the second grant's applied_exempt_value_cents (100000) stays below its benefit."
