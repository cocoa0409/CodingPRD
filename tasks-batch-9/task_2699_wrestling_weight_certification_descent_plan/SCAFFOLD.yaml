scenario: |
  Generate task harder than expert level!

  2699. Wrestling Weight Certification & Descent Plan (state high school wrestling program): initial assessment with body composition testing, hydration verification and minimum weight class determination, weight loss plan with maximum weekly descent rate and certified progression schedule, weigh-in procedures at events with allowances, growth allowance dates and consecutive-day rules, weight class eligibility tracking with certification database checks before each competition, appeal of an assessment result with retesting protocols and assessor qualifications, tournament seeding and bracket implications of weight class changes, health and safety monitoring with disqualification for unhealthy weight management, assessor training and program audit

domain_name: wrestling-weight-certification
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: graph
  # Wrestler/Event form a many-to-many junction (TournamentEntry); Assessment is
  # self-referential (retest_of_assessment_id); DescentPlan is self-referential
  # (supersedes_plan_id); Appeal points at two different Assessment rows.
  state_machine_shape: cyclic
  # Appeal cycles RETEST_ORDERED -> RETEST_COMPLETED -> RETEST_ORDERED (bounded
  # rounds); DescentPlan cycles CERTIFIED -> BREACHED -> CERTIFIED; Wrestler
  # carries two independent state dimensions (certification_status x
  # eligibility_status); Assessment forks DRAFT -> {VALIDATED, HYDRATION_FAILED}.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # The Assessor who produced an Assessment may neither review its Appeal nor
  # perform the appeal-ordered retest; a MedicalReviewer escalates a HealthFlag
  # but only StateOffice may disqualify on it.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Season label, e.g. "2026-27 State Wrestling Season".
        constraints: non-empty, max 120 chars
      - name: start_date
        type: string
        source: input
        description: First calendar date of the season (ISO 8601 date, YYYY-MM-DD).
      - name: weight_classes
        type: array
        source: input
        description: Ascending list of integer weight-class limits in pounds used for every eligibility determination in this season.
        default: [106, 113, 120, 126, 132, 138, 144, 150, 157, 165, 175, 190, 215, 285]
        constraints: non-empty array of distinct positive integers, strictly ascending
      - name: min_body_fat_pct_male
        type: number
        source: input
        description: Regulatory minimum body-fat percentage floor applied when sex == M.
        default: 7.0
        constraints: 0 < value < 30
      - name: min_body_fat_pct_female
        type: number
        source: input
        description: Regulatory minimum body-fat percentage floor applied when sex == F.
        default: 12.0
        constraints: 0 < value < 40
      - name: hydration_max_specific_gravity
        type: number
        source: input
        description: Maximum urine specific gravity accepted as hydrated; a reading above this value fails hydration verification.
        default: 1.025
        constraints: 1.000 < value < 1.060
      - name: max_weekly_descent_pct
        type: number
        source: input
        description: Maximum permitted weekly descent rate expressed as a percentage of the descent baseline.
        default: 1.5
        constraints: 0 < value <= 3.0
      - name: assessor_min_training_hours
        type: integer
        source: input
        description: Cumulative training hours an Assessor must accumulate before auto-transitioning PROVISIONAL to CERTIFIED.
        default: 8
        constraints: value >= 1
      - name: audit_fail_threshold_pct
        type: number
        source: input
        description: Discrepancy-score threshold at or above which a ProgramAudit finalizes as FAIL.
        default: 2.0
        constraints: value > 0
      - name: audit_min_sample_count
        type: integer
        source: input
        description: Minimum sample count for a scoreable ASSESSOR_SAMPLE audit; fewer samples finalize as INCONCLUSIVE.
        default: 3
        constraints: value >= 1
      - name: max_consecutive_day_allowance_lbs
        type: number
        source: input
        description: Ceiling on the cumulative consecutive-day weigh-in allowance regardless of how many weigh-in days an event runs.
        default: 2.0
        constraints: value >= 0
      - name: appeal_filing_window_days
        type: integer
        source: input
        description: Number of days after Assessment.assessed_at during which an Appeal may be filed (inclusive deadline).
        default: 5
        constraints: value >= 1
      - name: max_appeal_retest_rounds
        type: integer
        source: input
        description: Maximum number of retests a single Appeal may order before the reviewer must decide.
        default: 2
        constraints: value >= 1
      - name: assessor_daily_assessment_capacity
        type: integer
        source: input
        description: Maximum number of non-VOIDED Assessments one Assessor may stamp with assessed_at inside a single UTC calendar day.
        default: 3
        constraints: value >= 1
      - name: plan_breach_limit
        type: integer
        source: input
        description: Number of MISSED milestones at which a CERTIFIED DescentPlan transitions to BREACHED.
        default: 2
        constraints: value >= 1
      - name: status
        type: enum
        source: system
        description: Season lifecycle state.
        default: SETUP
        constraints: one of {SETUP, OPEN, CLOSED}
      - name: team_count
        type: integer
        source: computed
        description: Count of Team rows whose season_id == this Season.id.
        default: 0
      - name: certified_wrestler_count
        type: integer
        source: computed
        description: Count of Wrestler rows on this season's Teams whose certification_status == CERTIFIED.
        default: 0

  - name: Team
    parent: Season
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this team competes in."
      - name: school_name
        type: string
        source: input
        description: School name; unique within the owning Season.
        constraints: non-empty, max 160 chars
      - name: roster_count
        type: integer
        source: computed
        description: Count of Wrestler rows whose team_id == this Team.id, excluding those with certification_status == DISQUALIFIED.
        default: 0
      - name: open_flag_severity_total
        type: integer
        source: computed
        description: Conserved severity ledger — sum of HealthFlag.severity over all HealthFlag rows whose wrestler_id belongs to this Team and whose status IN {OPEN, ESCALATED}.
        default: 0
      - name: compliance_status
        type: enum
        source: computed
        description: Derived compliance posture recomputed from open_flag_severity_total on every HealthFlag raise or review.
        default: CLEAR
        constraints: one of {CLEAR, WATCH, PROBATION}

  - name: Assessor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Assessor legal name.
        constraints: non-empty, max 120 chars
      - name: credential_number
        type: string
        source: input
        description: State credential number; globally unique across Assessor rows.
        constraints: non-empty, max 40 chars, unique
      - name: certified_methods
        type: array
        source: input
        description: Body-composition measurement methods this assessor is credentialed to perform.
        constraints: non-empty array whose members are drawn from {SKINFOLD, BIA, HYDROSTATIC, ADP}
      - name: certification_expires_on
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) after which the credential lapses; an assessment finalize attempt on or after this date auto-transitions the assessor to EXPIRED.
      - name: training_hours_completed
        type: number
        source: computed
        description: Cumulative sum of `hours` across every POST /assessors/{id}/training-records call for this assessor.
        default: 0
      - name: status
        type: enum
        source: system
        description: Assessor credential state.
        default: PROVISIONAL
        constraints: one of {PROVISIONAL, CERTIFIED, SUSPENDED, EXPIRED}
      - name: validated_assessment_count
        type: integer
        source: computed
        description: Count of Assessment rows with assessor_id == this Assessor.id and status IN {VALIDATED, SUPERSEDED}.
        default: 0
      - name: voided_assessment_count
        type: integer
        source: computed
        description: Count of Assessment rows with assessor_id == this Assessor.id and status == VOIDED.
        default: 0
      - name: last_audit_outcome
        type: enum
        source: computed
        description: Outcome of the most recently FINALIZED ProgramAudit with assessor_id == this Assessor.id, ordered by created_at DESC; null when none exists.
        default: null
        constraints: null or one of {PASS, FAIL, INCONCLUSIVE}
      - name: suspension_reason
        type: string
        source: system
        description: Free text recorded when status becomes SUSPENDED; null otherwise.
        default: null

  - name: Wrestler
    parent: Team
    common_fields: true
    fields:
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; roster owner. The acting TeamCoach's X-User-ID must equal this value for every coach-driven mutation."
      - name: source_assessment_id
        type: string
        source: system
        description: "FK -> Assessment.id; the single VALIDATED Assessment currently supplying this wrestler's certified body-composition figures. Null while certification_status == UNCERTIFIED."
        default: null
      - name: full_name
        type: string
        source: input
        description: Wrestler legal name.
        constraints: non-empty, max 120 chars
      - name: sex
        type: enum
        source: input
        description: Sex used to select the body-fat floor constant from the Season.
        constraints: one of {M, F}
      - name: grade
        type: integer
        source: input
        description: School grade level.
        constraints: 9 <= value <= 12
      - name: certification_status
        type: enum
        source: system
        description: Certification dimension of the wrestler's parallel state machine; evolves independently of eligibility_status.
        default: UNCERTIFIED
        constraints: one of {UNCERTIFIED, PROVISIONAL, CERTIFIED, SUSPENDED, DISQUALIFIED}
      - name: eligibility_status
        type: enum
        source: system
        description: Eligibility dimension of the wrestler's parallel state machine; driven by team compliance posture and health flags, not by certification transitions.
        default: INELIGIBLE
        constraints: one of {INELIGIBLE, ELIGIBLE, RESTRICTED}
      - name: alpha_weight_lbs
        type: number
        source: computed
        description: Descent baseline copied from the source Assessment's measured_weight_lbs at validation time; null while source_assessment_id is null.
        default: null
      - name: body_fat_pct
        type: number
        source: computed
        description: Body-fat percentage copied from the source Assessment; null while source_assessment_id is null.
        default: null
      - name: minimum_certified_weight_lbs
        type: number
        source: computed
        description: Minimum certified weight in pounds copied from the source Assessment's minimum_certified_weight_lbs; the absolute floor no descent plan or weigh-in may go below.
        default: null
      - name: min_weight_class_lbs
        type: integer
        source: computed
        description: Smallest Season.weight_classes member greater than or equal to minimum_certified_weight_lbs; null while source_assessment_id is null.
        default: null
      - name: lowest_eligible_class_lbs
        type: integer
        source: computed
        description: Lowest weight class the wrestler may enter as of the current logical clock date, recomputed by calculations.lowest_eligible_class_at_date; null while source_assessment_id is null.
        default: null
      - name: open_health_flag_count
        type: integer
        source: computed
        description: Count of HealthFlag rows with wrestler_id == this Wrestler.id and status IN {OPEN, ESCALATED}.
        default: 0
      - name: disqualified_at
        type: datetime
        source: system
        description: Logical-clock instant at which certification_status became DISQUALIFIED; null otherwise.
        default: null
      - name: certification_hold_reason
        type: string
        source: system
        description: Reason recorded when certification_status becomes SUSPENDED or DISQUALIFIED; null otherwise.
        default: null

  - name: Assessment
    parent: Wrestler
    common_fields: true
    fields:
      - name: wrestler_id
        type: string
        source: input
        description: "FK -> Wrestler.id; the subject of this body-composition assessment."
      - name: assessor_id
        type: string
        source: input
        description: "FK -> Assessor.id; must equal the acting Assessor's X-User-ID."
      - name: retest_of_assessment_id
        type: string
        source: system
        description: "FK -> Assessment.id; self-reference set when this assessment was created as an appeal-ordered retest of an earlier assessment. Null for original assessments."
        default: null
      - name: appeal_id
        type: string
        source: input
        description: "FK -> Appeal.id; supplied only when creating an appeal-ordered retest. Null for original assessments."
        default: null
      - name: method
        type: enum
        source: input
        description: Body-composition measurement method used; must be a member of the acting assessor's certified_methods.
        constraints: one of {SKINFOLD, BIA, HYDROSTATIC, ADP}
      - name: assessed_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the measurement was taken; its UTC calendar day drives the assessor daily-capacity interval.
      - name: measured_weight_lbs
        type: number
        source: input
        description: Scale weight in pounds at assessment time; becomes the descent baseline (alpha weight) on validation.
        constraints: 60.0 <= value <= 400.0
      - name: body_fat_pct
        type: number
        source: input
        description: Measured body-fat percentage.
        constraints: 1.0 <= value <= 50.0
      - name: urine_specific_gravity
        type: number
        source: input
        description: Hydration reading compared against Season.hydration_max_specific_gravity at finalize time.
        constraints: 1.000 <= value <= 1.060
      - name: status
        type: enum
        source: system
        description: Assessment lifecycle state; DRAFT forks to exactly one of VALIDATED or HYDRATION_FAILED at finalize.
        default: DRAFT
        constraints: one of {DRAFT, VALIDATED, HYDRATION_FAILED, VOIDED, SUPERSEDED}
      - name: hydration_passed
        type: boolean
        source: computed
        description: True when urine_specific_gravity <= Season.hydration_max_specific_gravity; evaluated at finalize, null while DRAFT.
        default: null
      - name: lean_body_weight_lbs
        type: number
        source: computed
        description: measured_weight_lbs * (1 - body_fat_pct / 100), rounded to 1 decimal place, round_half_up; computed only on the VALIDATED branch.
        default: null
      - name: minimum_certified_weight_lbs
        type: number
        source: computed
        description: lean_body_weight_lbs divided by (1 - sex floor / 100), rounded to 1 decimal place, round_half_up; computed only on the VALIDATED branch.
        default: null
      - name: min_weight_class_lbs
        type: integer
        source: computed
        description: Smallest Season.weight_classes member greater than or equal to minimum_certified_weight_lbs; computed only on the VALIDATED branch.
        default: null
      - name: alpha_weight_lbs
        type: number
        source: computed
        description: Certified descent baseline; equals measured_weight_lbs on the VALIDATED branch, null otherwise.
        default: null
      - name: void_reason
        type: string
        source: system
        description: Reason recorded when status becomes VOIDED (appeal upheld or audit-failure cascade); null otherwise.
        default: null

  - name: Appeal
    parent: Assessment
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the VALIDATED assessment whose result is contested."
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the filing team, which must equal the acting TeamCoach's X-User-ID and must own the contested assessment's wrestler."
      - name: reviewing_assessor_id
        type: string
        source: system
        description: "FK -> Assessor.id; reviewer assigned by StateOffice, never equal to the contested assessment's assessor_id. Null until assignment."
        default: null
      - name: retest_assessment_id
        type: string
        source: system
        description: "FK -> Assessment.id; the most recent appeal-ordered retest Assessment created against this appeal. Null until the first retest is finalized."
        default: null
      - name: reason
        type: string
        source: input
        description: Coach's stated grounds for the appeal.
        constraints: non-empty, max 500 chars
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant at filing; compared against Assessment.assessed_at plus Season.appeal_filing_window_days.
      - name: status
        type: enum
        source: system
        description: Appeal lifecycle state; cycles between RETEST_ORDERED and RETEST_COMPLETED up to Season.max_appeal_retest_rounds times.
        default: SUBMITTED
        constraints: one of {SUBMITTED, UNDER_REVIEW, RETEST_ORDERED, RETEST_COMPLETED, UPHELD, DENIED, WITHDRAWN}
      - name: retest_round_count
        type: integer
        source: computed
        description: Number of times this appeal has entered RETEST_ORDERED.
        default: 0
      - name: decision_note
        type: string
        source: system
        description: Reviewer note recorded on the UPHELD or DENIED transition; null otherwise.
        default: null

  - name: DescentPlan
    parent: Wrestler
    common_fields: true
    fields:
      - name: wrestler_id
        type: string
        source: input
        description: "FK -> Wrestler.id; the wrestler descending."
      - name: source_assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; must be a VALIDATED assessment whose wrestler_id equals this plan's wrestler_id."
      - name: supersedes_plan_id
        type: string
        source: system
        description: "FK -> DescentPlan.id; self-reference to the plan this one replaced at creation time. Null when the wrestler had no prior non-terminal plan."
        default: null
      - name: plan_variant
        type: enum
        source: input
        description: Selects which descent-projection algorithm generates the certified progression schedule.
        constraints: one of {WEEKLY_STEP, LINEAR_RATE}
      - name: target_class_lbs
        type: integer
        source: input
        description: Weight class the wrestler intends to certify into; must be a Season.weight_classes member and must be >= Wrestler.min_weight_class_lbs.
      - name: plan_start_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) of week 0 of the progression schedule.
      - name: weekly_rate_pct
        type: number
        source: computed
        description: Copied from Season.max_weekly_descent_pct at creation time and pinned for the life of the plan.
      - name: weekly_delta_lbs
        type: number
        source: computed
        description: Fixed per-week pound reduction used only by the LINEAR_RATE variant; null for WEEKLY_STEP.
        default: null
      - name: status
        type: enum
        source: system
        description: Plan lifecycle state; cycles CERTIFIED -> BREACHED -> CERTIFIED through revision.
        default: DRAFT
        constraints: one of {DRAFT, CERTIFIED, BREACHED, COMPLETED, CANCELLED}
      - name: total_weeks
        type: integer
        source: computed
        description: Smallest week index k >= 0 at which the projected allowable weight is <= target_class_lbs; null while DRAFT is unscheduled.
        default: null
      - name: milestone_count
        type: integer
        source: computed
        description: Count of DescentMilestone rows for this plan, equal to total_weeks + 1 once certified.
        default: 0
      - name: projected_certification_date
        type: string
        source: computed
        description: plan_start_date plus 7 * total_weeks days, as an ISO 8601 date; null until the schedule is generated.
        default: null
      - name: missed_milestone_count
        type: integer
        source: computed
        description: Count of DescentMilestone rows for this plan whose status == MISSED.
        default: 0
      - name: breach_count
        type: integer
        source: computed
        description: Number of times this plan has transitioned CERTIFIED -> BREACHED.
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: Number of times this plan has transitioned BREACHED -> CERTIFIED via revision.
        default: 0
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded when status becomes CANCELLED; null otherwise.
        default: null

  - name: DescentMilestone
    parent: DescentPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: system
        description: "FK -> DescentPlan.id; the certified plan this weekly milestone belongs to. Milestones are only ever created by the plan-certification cascade, never by direct client input."
      - name: week_index
        type: integer
        source: computed
        description: Zero-based week offset from DescentPlan.plan_start_date.
      - name: effective_date
        type: string
        source: computed
        description: plan_start_date plus 7 * week_index days, as an ISO 8601 date.
      - name: allowable_weight_lbs
        type: number
        source: computed
        description: Maximum weight permitted for this week under the plan's variant, rounded to 1 decimal place, round_half_up.
      - name: min_eligible_class_lbs
        type: integer
        source: computed
        description: Smallest Season.weight_classes member greater than or equal to max(allowable_weight_lbs, Wrestler.minimum_certified_weight_lbs) for this milestone week, ignoring growth allowances.
      - name: status
        type: enum
        source: system
        description: Milestone compliance state set by the season compliance run.
        default: SCHEDULED
        constraints: one of {SCHEDULED, MET, MISSED, WAIVED}
      - name: evaluated_recorded_weight_lbs
        type: number
        source: system
        description: recorded_weight_lbs of the WeighIn the compliance run used to judge this milestone; null when no qualifying weigh-in existed or the milestone is still SCHEDULED.
        default: null

  - name: Event
    parent: Season
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this competition belongs to."
      - name: name
        type: string
        source: input
        description: Event name.
        constraints: non-empty, max 160 chars
      - name: event_type
        type: enum
        source: input
        description: Competition format.
        constraints: one of {DUAL, TOURNAMENT, STATE_CHAMPIONSHIP}
      - name: event_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) of the first competition day; start of the half-open competition window.
      - name: competition_days
        type: integer
        source: input
        description: Length in days of the half-open competition window [event_date T00:00:00Z, event_date + competition_days T00:00:00Z).
        default: 1
        constraints: 1 <= value <= 4
      - name: weigh_in_days
        type: integer
        source: input
        description: Number of permitted weigh-in day indices; valid day_index values are 0 .. weigh_in_days - 1.
        default: 1
        constraints: 1 <= value <= 4
      - name: consecutive_day_allowance_lbs
        type: number
        source: input
        description: Pounds of allowance granted per additional consecutive weigh-in day at this event, before the season ceiling is applied.
        default: 1.0
        constraints: 0 <= value <= 2.0
      - name: status
        type: enum
        source: system
        description: Event lifecycle state.
        default: SCHEDULED
        constraints: one of {SCHEDULED, WEIGH_IN_OPEN, WEIGH_IN_CLOSED, SEEDED, COMPLETED, CANCELLED}
      - name: bracket_locked
        type: boolean
        source: system
        description: True once seeding has run; a locked bracket restricts weight-class changes to StateOffice overrides.
        default: false
      - name: reseed_required
        type: boolean
        source: system
        description: True when a post-seeding cascade invalidated at least one assigned seed and the bracket must be reseeded.
        default: false
      - name: entry_count
        type: integer
        source: computed
        description: Count of TournamentEntry rows for this event with status IN {ENTERED, WEIGHED_IN, SEEDED}.
        default: 0
      - name: weighed_in_count
        type: integer
        source: computed
        description: Count of TournamentEntry rows for this event with status IN {WEIGHED_IN, SEEDED}.
        default: 0
      - name: seeded_entry_count
        type: integer
        source: computed
        description: Count of TournamentEntry rows for this event whose seed_number is not null.
        default: 0
      - name: seed_integrity_sum
        type: integer
        source: computed
        description: Conserved seeding quantity — sum of seed_number over every TournamentEntry of this event whose seed_number is not null.
        default: 0

  - name: TournamentEntry
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the competition entered."
      - name: wrestler_id
        type: string
        source: input
        description: "FK -> Wrestler.id; the competitor. (Event, Wrestler) is unique across non-SCRATCHED entries."
      - name: weight_class_lbs
        type: integer
        source: input
        description: Weight class the wrestler is entered in; must be a Season.weight_classes member.
      - name: season_win_count
        type: integer
        source: input
        description: Season win total supplied by the coach at entry time; primary seeding sort key.
        default: 0
        constraints: value >= 0
      - name: status
        type: enum
        source: system
        description: Entry lifecycle state.
        default: ENTERED
        constraints: one of {ENTERED, WEIGHED_IN, SEEDED, SCRATCHED, DISQUALIFIED}
      - name: seed_number
        type: integer
        source: system
        description: Seed position within (event_id, weight_class_lbs), assigned 1..n by the seeding run; null before seeding and after a reseed-invalidating cascade.
        default: null
      - name: latest_effective_weight_lbs
        type: number
        source: computed
        description: effective weight of the WeighIn for this entry with the greatest day_index; null before any weigh-in. Secondary seeding sort key.
        default: null
      - name: weight_class_change_count
        type: integer
        source: computed
        description: Number of successful weight-class changes applied to this entry.
        default: 0
      - name: scratch_reason
        type: string
        source: system
        description: Reason recorded when status becomes SCRATCHED or DISQUALIFIED; null otherwise.
        default: null

  - name: WeighIn
    parent: Event
    common_fields: false
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event at which the wrestler stepped on the scale."
      - name: wrestler_id
        type: string
        source: system
        description: "FK -> Wrestler.id; copied from the referenced entry so weigh-ins are queryable per wrestler across events."
      - name: entry_id
        type: string
        source: input
        description: "FK -> TournamentEntry.id; the entry being weighed. (entry_id, day_index) is unique."
      - name: day_index
        type: integer
        source: input
        description: Zero-based weigh-in day; must satisfy 0 <= day_index <= Event.weigh_in_days - 1.
        constraints: value >= 0
      - name: recorded_weight_lbs
        type: number
        source: input
        description: Scale weight in pounds at the weigh-in.
        constraints: 60.0 <= value <= 400.0
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant at which the weigh-in was recorded.
      - name: official_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the WeighInOfficial who recorded the reading; never compared against any entity id.
      - name: allowance_lbs
        type: number
        source: computed
        description: Total pounds of allowance applied — growth allowance total as of Event.event_date plus the capped consecutive-day allowance for this day_index.
      - name: effective_limit_lbs
        type: number
        source: computed
        description: TournamentEntry.weight_class_lbs plus allowance_lbs; the ceiling recorded_weight_lbs is compared against.
      - name: result
        type: enum
        source: computed
        description: Weigh-in outcome derived from recorded_weight_lbs, the entry's class and allowance_lbs.
        constraints: one of {PASS, PASS_WITH_ALLOWANCE, FAIL}
      - name: below_minimum
        type: boolean
        source: computed
        description: True when recorded_weight_lbs < Wrestler.minimum_certified_weight_lbs, which raises a WEIGH_IN_DEFICIT health flag.

  - name: EligibilityCheck
    parent: Wrestler
    common_fields: false
    fields:
      - name: wrestler_id
        type: string
        source: input
        description: "FK -> Wrestler.id; subject of the certification-database check."
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the competition the check is being run against; supplies the as-of date."
      - name: requested_class_lbs
        type: integer
        source: input
        description: Weight class being checked for eligibility; must be a Season.weight_classes member.
      - name: checked_at
        type: datetime
        source: system
        description: Logical-clock instant at which the check ran.
      - name: as_of_date
        type: string
        source: computed
        description: Event.event_date of the referenced event; the date all allowance and schedule lookups are evaluated at.
      - name: growth_allowance_lbs
        type: number
        source: computed
        description: Sum of GrowthAllowance.allowance_lbs for the season whose effective_date <= as_of_date.
      - name: schedule_allowable_weight_lbs
        type: number
        source: computed
        description: allowable_weight_lbs of the governing DescentMilestone as of as_of_date; null when the wrestler has no CERTIFIED or BREACHED plan.
        default: null
      - name: lowest_eligible_class_lbs
        type: integer
        source: computed
        description: Smallest Season.weight_classes member C such that C + growth_allowance_lbs >= the eligibility floor; null when the wrestler is uncertified.
        default: null
      - name: outcome
        type: enum
        source: computed
        description: Check verdict written to the certification database log.
        constraints: one of {CLEARED, BLOCKED_NOT_CERTIFIED, BLOCKED_CLASS_BELOW_MINIMUM, BLOCKED_PLAN_BREACHED, BLOCKED_TEAM_PROBATION, BLOCKED_DISQUALIFIED, BLOCKED_ESCALATED_FLAG}
      - name: blocking_error_id
        type: string
        source: computed
        description: The error_id a competition-entry attempt would return under this outcome; null when outcome == CLEARED.
        default: null

  - name: GrowthAllowance
    parent: Season
    common_fields: false
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season the allowance applies to."
      - name: effective_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) on and after which this allowance counts; unique per season.
      - name: allowance_lbs
        type: number
        source: input
        description: Pounds added to every weight-class limit from effective_date onward.
        constraints: 0 < value <= 4.0
      - name: note
        type: string
        source: input
        description: Optional administrative note.
        default: null

  - name: HealthFlag
    parent: Wrestler
    common_fields: true
    fields:
      - name: wrestler_id
        type: string
        source: system
        description: "FK -> Wrestler.id; the wrestler whose weight management raised concern."
      - name: weigh_in_id
        type: string
        source: system
        description: "FK -> WeighIn.id; the weigh-in that raised the flag, when the source is WEIGH_IN_DEFICIT. Null for plan- and hydration-sourced flags."
        default: null
      - name: source
        type: enum
        source: system
        description: What raised the flag.
        constraints: one of {HYDRATION_FAIL, WEIGH_IN_DEFICIT, PLAN_BREACH, RAPID_LOSS}
      - name: severity
        type: integer
        source: system
        description: Severity weight contributed to Team.open_flag_severity_total; pinned per source as HYDRATION_FAIL=1, RAPID_LOSS=2, PLAN_BREACH=3, WEIGH_IN_DEFICIT=4.
        constraints: one of {1, 2, 3, 4}
      - name: status
        type: enum
        source: system
        description: Review state; only OPEN and ESCALATED count toward Team.open_flag_severity_total.
        default: OPEN
        constraints: one of {OPEN, REVIEWED, DISMISSED, ESCALATED}
      - name: raised_at
        type: datetime
        source: system
        description: Logical-clock instant at which the flag was raised.
      - name: review_note
        type: string
        source: system
        description: MedicalReviewer note recorded on review; null while OPEN.
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the reviewing MedicalReviewer; null while OPEN.
        default: null

  - name: ProgramAudit
    parent: Season
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season under audit."
      - name: assessor_id
        type: string
        source: input
        description: "FK -> Assessor.id; the assessor sampled. Required for audit_type == ASSESSOR_SAMPLE, null for TEAM_COMPLIANCE."
        default: null
      - name: audit_type
        type: enum
        source: input
        description: Audit scope.
        constraints: one of {ASSESSOR_SAMPLE, TEAM_COMPLIANCE}
      - name: scoring_variant
        type: enum
        source: input
        description: Selects which discrepancy-scoring algorithm the finalize step runs.
        constraints: one of {WORST_CASE, SAMPLE_MEAN}
      - name: sample_window_start
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); on a FAIL outcome, only Assessments whose assessed_at date is >= this value are voided.
      - name: samples
        type: array
        source: input
        description: Array of objects { assessment_id, remeasured_body_fat_pct } collected by the auditor; empty or omitted for TEAM_COMPLIANCE audits.
        default: []
      - name: sample_count
        type: integer
        source: computed
        description: Length of samples.
        default: 0
      - name: discrepancy_score
        type: number
        source: computed
        description: Score produced by the selected scoring_variant, rounded to 2 decimal places, round_half_up; null until finalized or when INCONCLUSIVE.
        default: null
      - name: outcome
        type: enum
        source: computed
        description: Audit verdict set at finalize.
        default: null
        constraints: null or one of {PASS, FAIL, INCONCLUSIVE}
      - name: voided_assessment_count
        type: integer
        source: computed
        description: Number of Assessment rows this audit's FAIL cascade transitioned to VOIDED.
        default: 0
      - name: status
        type: enum
        source: system
        description: Audit lifecycle state.
        default: OPEN
        constraints: one of {OPEN, FINALIZED}

state_machines:
  - entity: Season
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /seasons/{id}/status with status=OPEN"
        actor: StateOffice
        preconditions:
          - "season.status == SETUP"
          - "season.weight_classes is non-empty"
        side_effects:
          - "increments Season.version by 1"
        note: "Assessment creation, plan certification and event creation all require status == OPEN."
      - from: OPEN
        to: CLOSED
        trigger: "POST /seasons/{id}/status with status=CLOSED"
        actor: StateOffice
        preconditions:
          - "season.status == OPEN"
          - "no Event of this season has status IN {WEIGH_IN_OPEN, SEEDED}"
        side_effects:
          - "every Event of this season with status IN {SCHEDULED, WEIGH_IN_CLOSED} transitions to COMPLETED"
          - "increments Season.version by 1"

  - entity: Assessor
    initial_state: PROVISIONAL
    terminal_states: [SUSPENDED, EXPIRED]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /assessors/{id}/training-records (auto-transition when the cumulative hours threshold is reached)"
        actor: StateOffice
        preconditions:
          - "assessor.status == PROVISIONAL"
          - "assessor.training_hours_completed + hours >= Season.assessor_min_training_hours of the most recently created Season"
        side_effects:
          - "sets Assessor.training_hours_completed to the new cumulative sum"
          - "increments Assessor.version by 1"
        note: "When the threshold is not reached the hours are still added and status stays PROVISIONAL."
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /assessors/{id}/suspension"
        actor: StateOffice
        preconditions:
          - "assessor.status == CERTIFIED"
        side_effects:
          - "sets Assessor.suspension_reason to the supplied reason"
          - "every Assessment of this assessor with status == DRAFT transitions to VOIDED with void_reason 'ASSESSOR_SUSPENDED'"
          - "increments Assessor.version by 1"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /audits/{id}/finalize resolving to outcome FAIL (system cascade, hop 1 of the audit-failure chain)"
        actor: system
        preconditions:
          - "audit.audit_type == ASSESSOR_SAMPLE"
          - "audit.discrepancy_score >= Season.audit_fail_threshold_pct"
        side_effects:
          - "sets Assessor.suspension_reason to 'AUDIT_FAIL:<audit.id>'"
          - "sets Assessor.last_audit_outcome to FAIL"
          - "hop 2: because the assessor is now SUSPENDED, every Assessment of this assessor with status == VALIDATED and assessed_at date >= audit.sample_window_start transitions to VOIDED"
          - "increments Assessor.version by 1"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "POST /assessments/{id}/finalize (auto-transition evaluated before the hydration fork)"
        actor: system
        preconditions:
          - "assessor.status == CERTIFIED"
          - "current logical clock date >= assessor.certification_expires_on"
        side_effects:
          - "the finalize request is rejected with ERR_ASSESSOR_NOT_CERTIFIED after the status change is persisted"
          - "increments Assessor.version by 1"

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [HYDRATION_FAILED, VOIDED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /assessments/{id}/finalize (hydration branch: urine_specific_gravity <= Season.hydration_max_specific_gravity)"
        actor: Assessor
        preconditions:
          - "assessment.status == DRAFT"
          - "assessment.assessor_id == acting X-User-ID"
          - "assessor.status == CERTIFIED"
          - "assessment.method IN assessor.certified_methods"
          - "season.status == OPEN"
        side_effects:
          - "sets hydration_passed=true, lean_body_weight_lbs, minimum_certified_weight_lbs, min_weight_class_lbs, alpha_weight_lbs per calculations.minimum_certified_weight"
          - "any other Assessment of the same wrestler with status == VALIDATED transitions to SUPERSEDED, EXCEPT the assessment contested by the appeal this retest belongs to (assessment.appeal_id is not null and Appeal(assessment.appeal_id).assessment_id == that assessment), which stays VALIDATED until the appeal is decided so that the appeal-upheld void cascade still has a VALIDATED from-state"
          - "Wrestler.source_assessment_id is repointed at this assessment and the wrestler's alpha_weight_lbs, body_fat_pct, minimum_certified_weight_lbs, min_weight_class_lbs and lowest_eligible_class_lbs are recomputed"
          - "Wrestler.certification_status UNCERTIFIED -> PROVISIONAL, or SUSPENDED -> PROVISIONAL when the prior source assessment had been voided"
          - "when assessment.appeal_id is not null: Appeal.retest_assessment_id is set to this assessment and Appeal.status RETEST_ORDERED -> RETEST_COMPLETED"
          - "increments Assessor.validated_assessment_count by 1"
          - "increments Assessment.version and Wrestler.version by 1"
        note: "This is the VALIDATED arm of the fork; no health flag is raised on this arm."
      - from: DRAFT
        to: HYDRATION_FAILED
        trigger: "POST /assessments/{id}/finalize (hydration branch: urine_specific_gravity > Season.hydration_max_specific_gravity)"
        actor: Assessor
        preconditions:
          - "assessment.status == DRAFT"
          - "assessment.assessor_id == acting X-User-ID"
          - "assessor.status == CERTIFIED"
          - "assessment.method IN assessor.certified_methods"
          - "season.status == OPEN"
        side_effects:
          - "sets hydration_passed=false and leaves lean_body_weight_lbs, minimum_certified_weight_lbs, min_weight_class_lbs and alpha_weight_lbs null"
          - "raises a HealthFlag with source=HYDRATION_FAIL, severity=1, status=OPEN on the wrestler"
          - "recomputes Team.open_flag_severity_total and Team.compliance_status"
          - "Wrestler.certification_status is left unchanged and Wrestler.source_assessment_id is not repointed"
          - "when assessment.appeal_id is not null: Appeal.retest_assessment_id is set to this assessment and Appeal.status RETEST_ORDERED -> RETEST_COMPLETED"
          - "increments Assessment.version by 1"
        note: "Divergent side-effect set versus the VALIDATED arm: a flag is raised and no certified figures are produced."
      - from: VALIDATED
        to: VOIDED
        trigger: "POST /appeals/{id}/decide with outcome=UPHELD (system cascade, hop 1 of the appeal-upheld chain)"
        actor: system
        preconditions:
          - "appeal.assessment_id == assessment.id"
          - "appeal.retest_assessment_id is not null and that retest assessment has status == VALIDATED"
        side_effects:
          - "sets void_reason='APPEAL_UPHELD:<appeal.id>'"
          - "hop 2: because this assessment is voided, Wrestler.source_assessment_id is repointed at appeal.retest_assessment_id and the wrestler's certified figures are recomputed from it"
          - "hop 3: because the wrestler's min_weight_class_lbs moved, any DescentPlan of the wrestler with status IN {CERTIFIED, BREACHED} whose target_class_lbs < the new min_weight_class_lbs transitions to CANCELLED with cancel_reason='MINIMUM_RAISED'"
          - "increments Assessor.voided_assessment_count by 1"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "POST /assessments/{id}/finalize on a newer assessment of the same wrestler that lands on the VALIDATED arm"
        actor: system
        preconditions:
          - "a different Assessment of the same wrestler_id has just transitioned DRAFT -> VALIDATED"
        side_effects:
          - "increments Assessment.version by 1"
      - from: VALIDATED
        to: VOIDED
        trigger: "POST /audits/{id}/finalize resolving to outcome FAIL (system cascade, hop 2 of the audit-failure chain)"
        actor: system
        preconditions:
          - "assessment.assessor_id == audit.assessor_id"
          - "assessment.assessed_at date >= audit.sample_window_start"
          - "the assessor has just transitioned CERTIFIED -> SUSPENDED in hop 1"
        side_effects:
          - "sets void_reason='AUDIT_FAIL:<audit.id>'"
          - "hop 3: because this assessment was the wrestler's source_assessment_id, Wrestler.certification_status CERTIFIED|PROVISIONAL -> SUSPENDED, source_assessment_id is cleared and every certified figure (alpha_weight_lbs, body_fat_pct, minimum_certified_weight_lbs, min_weight_class_lbs, lowest_eligible_class_lbs) is set to null"
          - "increments ProgramAudit.voided_assessment_count and Assessor.voided_assessment_count by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /assessors/{id}/suspension (cascade)"
        actor: system
        preconditions:
          - "assessment.assessor_id == the suspended assessor"
          - "assessment.status == DRAFT"
        side_effects:
          - "sets void_reason='ASSESSOR_SUSPENDED'"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/assign-reviewer"
        actor: StateOffice
        preconditions:
          - "appeal.status == SUBMITTED"
          - "reviewing_assessor_id != the contested Assessment.assessor_id (segregation of duties)"
          - "the reviewing assessor has status == CERTIFIED"
        side_effects:
          - "sets Appeal.reviewing_assessor_id"
          - "increments Appeal.version by 1"
      - from: UNDER_REVIEW
        to: RETEST_ORDERED
        trigger: "POST /appeals/{id}/order-retest"
        actor: Assessor
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "acting X-User-ID == appeal.reviewing_assessor_id"
          - "appeal.retest_round_count < Season.max_appeal_retest_rounds"
        side_effects:
          - "increments Appeal.retest_round_count by 1"
          - "increments Appeal.version by 1"
      - from: RETEST_ORDERED
        to: RETEST_COMPLETED
        trigger: "POST /assessments/{id}/finalize on the retest assessment carrying appeal_id == appeal.id"
        actor: system
        preconditions:
          - "appeal.status == RETEST_ORDERED"
          - "the finalized assessment's appeal_id == appeal.id"
        side_effects:
          - "sets Appeal.retest_assessment_id to the finalized assessment id"
          - "increments Appeal.version by 1"
      - from: RETEST_COMPLETED
        to: RETEST_ORDERED
        trigger: "POST /appeals/{id}/order-retest (cycle: the reviewer rejects the retest and orders another)"
        actor: Assessor
        preconditions:
          - "appeal.status == RETEST_COMPLETED"
          - "acting X-User-ID == appeal.reviewing_assessor_id"
          - "appeal.retest_round_count < Season.max_appeal_retest_rounds"
        side_effects:
          - "increments Appeal.retest_round_count by 1"
          - "increments Appeal.version by 1"
        note: "This edge closes the cycle RETEST_ORDERED -> RETEST_COMPLETED -> RETEST_ORDERED; it is bounded by Season.max_appeal_retest_rounds."
      - from: RETEST_COMPLETED
        to: UPHELD
        trigger: "POST /appeals/{id}/decide with outcome=UPHELD"
        actor: Assessor
        preconditions:
          - "appeal.status == RETEST_COMPLETED"
          - "acting X-User-ID == appeal.reviewing_assessor_id"
          - "appeal.retest_assessment_id is not null and that assessment has status == VALIDATED"
        side_effects:
          - "sets Appeal.decision_note"
          - "hop 1: the contested Assessment transitions VALIDATED -> VOIDED (see Assessment machine for hops 2 and 3)"
          - "increments Appeal.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /appeals/{id}/decide with outcome=DENIED"
        actor: Assessor
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "acting X-User-ID == appeal.reviewing_assessor_id"
        side_effects:
          - "sets Appeal.decision_note"
          - "the contested Assessment keeps status VALIDATED and the wrestler's certified figures are untouched"
          - "increments Appeal.version by 1"
      - from: RETEST_COMPLETED
        to: DENIED
        trigger: "POST /appeals/{id}/decide with outcome=DENIED"
        actor: Assessor
        preconditions:
          - "appeal.status == RETEST_COMPLETED"
          - "acting X-User-ID == appeal.reviewing_assessor_id"
        side_effects:
          - "sets Appeal.decision_note"
          - "increments Appeal.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /audits/{id}/finalize resolving to FAIL (cascade: the contested assessment is voided out from under the appeal)"
        actor: system
        preconditions:
          - "appeal.status IN {SUBMITTED, UNDER_REVIEW, RETEST_ORDERED, RETEST_COMPLETED}"
          - "the contested Assessment has just transitioned VALIDATED -> VOIDED with void_reason starting 'AUDIT_FAIL'"
        side_effects:
          - "sets Appeal.decision_note='WITHDRAWN_ASSESSMENT_VOIDED'"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /audits/{id}/finalize resolving to FAIL (cascade)"
        actor: system
        preconditions:
          - "the contested Assessment has just transitioned VALIDATED -> VOIDED with void_reason starting 'AUDIT_FAIL'"
        side_effects:
          - "sets Appeal.decision_note='WITHDRAWN_ASSESSMENT_VOIDED'"

  - entity: DescentPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /descent-plans/{id}/certify"
        actor: StateOffice
        preconditions:
          - "plan.status == DRAFT"
          - "season.status == OPEN"
          - "the source Assessment still has status == VALIDATED"
          - "plan.target_class_lbs >= wrestler.min_weight_class_lbs"
          - "wrestler.certification_status IN {PROVISIONAL, CERTIFIED}"
        side_effects:
          - "generates DescentMilestone rows for week_index 0..total_weeks per calculations.descent_schedule_projection, each with status=SCHEDULED"
          - "sets plan.total_weeks, plan.milestone_count, plan.projected_certification_date and (for LINEAR_RATE) plan.weekly_delta_lbs"
          - "Wrestler.certification_status PROVISIONAL -> CERTIFIED"
          - "Wrestler.eligibility_status INELIGIBLE -> ELIGIBLE when team.compliance_status IN {CLEAR, WATCH}, or INELIGIBLE -> RESTRICTED when team.compliance_status == PROBATION"
          - "increments Season.certified_wrestler_count by 1"
          - "increments DescentPlan.version and Wrestler.version by 1"
      - from: CERTIFIED
        to: BREACHED
        trigger: "POST /seasons/{id}/compliance-run (system, threshold crossing on missed milestones)"
        actor: system
        preconditions:
          - "plan.status == CERTIFIED"
          - "plan.missed_milestone_count >= Season.plan_breach_limit"
        side_effects:
          - "increments plan.breach_count by 1"
          - "hop 3: because the plan became BREACHED, a HealthFlag with source=PLAN_BREACH, severity=3, status=OPEN is raised on the wrestler"
          - "increments DescentPlan.version by 1"
      - from: BREACHED
        to: CERTIFIED
        trigger: "POST /descent-plans/{id}/revise"
        actor: TeamCoach
        preconditions:
          - "plan.status == BREACHED"
          - "season.status == OPEN"
          - "the revised target_class_lbs >= wrestler.min_weight_class_lbs"
          - "wrestler.certification_status != DISQUALIFIED"
        side_effects:
          - "every SCHEDULED DescentMilestone whose effective_date is strictly before the new plan_start_date becomes WAIVED; every other SCHEDULED milestone is deleted"
          - "regenerates the schedule from the new plan_start_date using the same plan_variant unless overridden, with week_index continuing at (highest week_index still on the plan) + 1 so indices stay unique; the k-th regenerated row has effective_date = new plan_start_date + 7*k and allowable_weight_lbs = w[k] of the variant recomputed from wrestler.alpha_weight_lbs"
          - "leaves already MET, MISSED and WAIVED milestones in place; plan.missed_milestone_count is preserved and plan.milestone_count becomes the total row count on the plan"
          - "increments plan.revision_count by 1"
          - "increments DescentPlan.version by 1"
        note: "Closes the CERTIFIED -> BREACHED -> CERTIFIED cycle."
      - from: CERTIFIED
        to: COMPLETED
        trigger: "POST /seasons/{id}/compliance-run (system)"
        actor: system
        preconditions:
          - "plan.status == CERTIFIED"
          - "every DescentMilestone of the plan has status IN {MET, WAIVED}"
          - "plan.milestone_count == plan.total_weeks + 1"
        side_effects:
          - "increments DescentPlan.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /wrestlers/{id}/descent-plans (a newer plan supersedes this one)"
        actor: system
        preconditions:
          - "plan.status IN {DRAFT, CERTIFIED, BREACHED}"
          - "the new plan's wrestler_id == plan.wrestler_id"
        side_effects:
          - "sets cancel_reason='SUPERSEDED' and the new plan's supersedes_plan_id to this plan id"
          - "when this plan was CERTIFIED: Wrestler.certification_status CERTIFIED -> PROVISIONAL and Wrestler.eligibility_status -> INELIGIBLE"
      - from: CERTIFIED
        to: CANCELLED
        trigger: "POST /wrestlers/{id}/descent-plans (a newer plan supersedes this one)"
        actor: system
        preconditions:
          - "plan.status == CERTIFIED"
          - "the new plan's wrestler_id == plan.wrestler_id"
        side_effects:
          - "sets cancel_reason='SUPERSEDED'"
          - "Wrestler.certification_status CERTIFIED -> PROVISIONAL, Wrestler.eligibility_status -> INELIGIBLE"
          - "decrements Season.certified_wrestler_count by 1"
      - from: CERTIFIED
        to: CANCELLED
        trigger: "POST /audits/{id}/finalize resolving to FAIL (system cascade, hop 4 of the audit-failure chain)"
        actor: system
        preconditions:
          - "the plan's wrestler has just transitioned to certification_status == SUSPENDED in hop 3"
        side_effects:
          - "sets cancel_reason='WRESTLER_SUSPENDED'"
          - "hop 5: because the plan is cancelled, every TournamentEntry of this wrestler with status IN {ENTERED, WEIGHED_IN, SEEDED} on an Event with status IN {SCHEDULED, WEIGH_IN_OPEN, WEIGH_IN_CLOSED, SEEDED} transitions to SCRATCHED"
      - from: CERTIFIED
        to: CANCELLED
        trigger: "POST /appeals/{id}/decide with outcome=UPHELD (system cascade, hop 3 of the appeal-upheld chain)"
        actor: system
        preconditions:
          - "the wrestler's min_weight_class_lbs was just recomputed in hop 2"
          - "plan.target_class_lbs < the new wrestler.min_weight_class_lbs"
        side_effects:
          - "sets cancel_reason='MINIMUM_RAISED'"
          - "hop 4: every TournamentEntry of this wrestler with status IN {ENTERED, WEIGHED_IN} transitions to SCRATCHED with scratch_reason='PLAN_CANCELLED'"

  - entity: DescentMilestone
    initial_state: SCHEDULED
    terminal_states: [MET, MISSED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: MET
        trigger: "POST /seasons/{id}/compliance-run"
        actor: system
        preconditions:
          - "milestone.effective_date <= current logical clock date"
          - "a qualifying WeighIn exists per calculations.milestone_evaluation and its recorded_weight_lbs <= milestone.allowable_weight_lbs"
        side_effects:
          - "sets evaluated_recorded_weight_lbs to that weigh-in's recorded_weight_lbs"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /seasons/{id}/compliance-run"
        actor: system
        preconditions:
          - "milestone.effective_date <= current logical clock date"
          - "either no qualifying WeighIn exists, or the qualifying WeighIn's recorded_weight_lbs > milestone.allowable_weight_lbs"
        side_effects:
          - "sets evaluated_recorded_weight_lbs to the qualifying weigh-in's recorded_weight_lbs, or null when none existed"
          - "hop 2: because this milestone became MISSED, plan.missed_milestone_count increases by 1 and the plan transitions CERTIFIED -> BREACHED once the count reaches Season.plan_breach_limit"
      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /descent-plans/{id}/revise (milestones whose effective_date is strictly before the new plan_start_date)"
        actor: system
        preconditions:
          - "milestone.status == SCHEDULED"
          - "milestone.effective_date < the revised plan_start_date"
        side_effects:
          - "the milestone is retained as WAIVED and excluded from plan.missed_milestone_count"

  - entity: Wrestler
    initial_state: UNCERTIFIED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: UNCERTIFIED
        to: PROVISIONAL
        trigger: "POST /assessments/{id}/finalize landing on the VALIDATED arm"
        actor: system
        preconditions:
          - "wrestler.certification_status == UNCERTIFIED"
          - "the finalized assessment's wrestler_id == wrestler.id"
        side_effects:
          - "sets source_assessment_id, alpha_weight_lbs, body_fat_pct, minimum_certified_weight_lbs, min_weight_class_lbs, lowest_eligible_class_lbs"
          - "eligibility_status is deliberately left at its current value: the certification dimension moves alone"
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /descent-plans/{id}/certify"
        actor: system
        preconditions:
          - "wrestler.certification_status == PROVISIONAL"
          - "the certified plan's wrestler_id == wrestler.id"
        side_effects:
          - "eligibility_status INELIGIBLE -> ELIGIBLE or INELIGIBLE -> RESTRICTED depending on team.compliance_status"
      - from: CERTIFIED
        to: PROVISIONAL
        trigger: "POST /wrestlers/{id}/descent-plans (superseding plan cancels the certified plan)"
        actor: system
        preconditions:
          - "wrestler.certification_status == CERTIFIED"
          - "the wrestler's prior plan transitioned CERTIFIED -> CANCELLED"
        side_effects:
          - "eligibility_status -> INELIGIBLE"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /audits/{id}/finalize resolving to FAIL (system cascade, hop 3 of the audit-failure chain)"
        actor: system
        preconditions:
          - "wrestler.source_assessment_id has just transitioned VALIDATED -> VOIDED in hop 2"
        side_effects:
          - "clears source_assessment_id, alpha_weight_lbs, body_fat_pct, minimum_certified_weight_lbs, min_weight_class_lbs, lowest_eligible_class_lbs"
          - "sets certification_hold_reason='SOURCE_ASSESSMENT_VOIDED'"
          - "eligibility_status -> INELIGIBLE"
          - "hop 4: because the wrestler is SUSPENDED, the wrestler's CERTIFIED DescentPlan transitions to CANCELLED"
          - "decrements Season.certified_wrestler_count by 1"
      - from: PROVISIONAL
        to: SUSPENDED
        trigger: "POST /audits/{id}/finalize resolving to FAIL (system cascade, hop 3 of the audit-failure chain)"
        actor: system
        preconditions:
          - "wrestler.source_assessment_id has just transitioned VALIDATED -> VOIDED in hop 2"
        side_effects:
          - "clears source_assessment_id, alpha_weight_lbs, body_fat_pct, minimum_certified_weight_lbs, min_weight_class_lbs, lowest_eligible_class_lbs"
          - "sets certification_hold_reason='SOURCE_ASSESSMENT_VOIDED'"
          - "every DescentPlan of the wrestler with status == DRAFT transitions to CANCELLED with cancel_reason='WRESTLER_SUSPENDED'"
          - "Season.certified_wrestler_count is NOT decremented: a PROVISIONAL wrestler was never counted in it"
        note: "Same hop-3 trigger as CERTIFIED -> SUSPENDED but a deliberately smaller side-effect set, so the cascade width depends on which certification state each affected wrestler was in."
      - from: SUSPENDED
        to: PROVISIONAL
        trigger: "POST /assessments/{id}/finalize landing on the VALIDATED arm (a fresh assessment restores certified figures)"
        actor: system
        preconditions:
          - "wrestler.certification_status == SUSPENDED"
          - "the finalizing assessor has status == CERTIFIED"
        side_effects:
          - "clears certification_hold_reason and repopulates every certified figure"
      - from: PROVISIONAL
        to: DISQUALIFIED
        trigger: "POST /wrestlers/{id}/disqualification"
        actor: StateOffice
        preconditions:
          - "wrestler.certification_status IN {PROVISIONAL, CERTIFIED}"
          - "the referenced HealthFlag has status == ESCALATED and wrestler_id == wrestler.id"
        side_effects:
          - "sets disqualified_at to the current logical clock instant and certification_hold_reason to the supplied reason"
          - "eligibility_status -> INELIGIBLE"
          - "every DescentPlan of the wrestler with status IN {DRAFT, CERTIFIED, BREACHED} transitions to CANCELLED with cancel_reason='DISQUALIFIED'"
          - "every TournamentEntry of the wrestler with status IN {ENTERED, WEIGHED_IN, SEEDED} transitions to DISQUALIFIED with scratch_reason='UNHEALTHY_WEIGHT_MANAGEMENT'; when any of them had a seed_number, that entry's seed_number is cleared and its Event.reseed_required is set true"
          - "decrements Team.roster_count by 1"
      - from: CERTIFIED
        to: DISQUALIFIED
        trigger: "POST /wrestlers/{id}/disqualification"
        actor: StateOffice
        preconditions:
          - "wrestler.certification_status == CERTIFIED"
          - "the referenced HealthFlag has status == ESCALATED and wrestler_id == wrestler.id"
        side_effects:
          - "same cascade as PROVISIONAL -> DISQUALIFIED, plus Season.certified_wrestler_count is decremented by 1"

  - entity: Wrestler
    initial_state: INELIGIBLE
    terminal_states: []
    transitions:
      - from: INELIGIBLE
        to: ELIGIBLE
        trigger: "POST /descent-plans/{id}/certify"
        actor: system
        preconditions:
          - "wrestler.eligibility_status == INELIGIBLE"
          - "team.compliance_status IN {CLEAR, WATCH}"
        side_effects:
          - "no change to certification_status beyond the independent PROVISIONAL -> CERTIFIED move"
        note: "Second, independent state dimension of Wrestler: eligibility_status. It is driven by team posture and health flags, never by assessment lifecycle."
      - from: INELIGIBLE
        to: RESTRICTED
        trigger: "POST /descent-plans/{id}/certify while the team is on probation"
        actor: system
        preconditions:
          - "wrestler.eligibility_status == INELIGIBLE"
          - "team.compliance_status == PROBATION"
        side_effects: []
      - from: ELIGIBLE
        to: RESTRICTED
        trigger: "any HealthFlag raise that pushes Team.open_flag_severity_total to >= 5 (system, hop 5 of the compliance-run chain)"
        actor: system
        preconditions:
          - "team.compliance_status has just become PROBATION"
          - "wrestler.eligibility_status == ELIGIBLE"
        side_effects:
          - "certification_status is untouched, demonstrating the two dimensions move independently"
      - from: RESTRICTED
        to: ELIGIBLE
        trigger: "POST /health-flags/{id}/review with outcome=DISMISSED (compensating action)"
        actor: system
        preconditions:
          - "team.compliance_status has just returned to CLEAR or WATCH"
          - "wrestler.certification_status == CERTIFIED"
        side_effects:
          - "Team.open_flag_severity_total returns to its pre-raise value"
      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "any cascade that removes the wrestler's CERTIFIED plan or source assessment"
        actor: system
        preconditions:
          - "wrestler.certification_status transitions to PROVISIONAL, SUSPENDED or DISQUALIFIED"
        side_effects: []
      - from: RESTRICTED
        to: INELIGIBLE
        trigger: "any cascade that removes the wrestler's CERTIFIED plan or source assessment"
        actor: system
        preconditions:
          - "wrestler.certification_status transitions to PROVISIONAL, SUSPENDED or DISQUALIFIED"
        side_effects: []

  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: WEIGH_IN_OPEN
        trigger: "POST /events/{id}/status with status=WEIGH_IN_OPEN"
        actor: StateOffice
        preconditions:
          - "event.status == SCHEDULED"
          - "season.status == OPEN"
        side_effects:
          - "increments Event.version by 1"
      - from: WEIGH_IN_OPEN
        to: WEIGH_IN_CLOSED
        trigger: "POST /events/{id}/status with status=WEIGH_IN_CLOSED"
        actor: StateOffice
        preconditions:
          - "event.status == WEIGH_IN_OPEN"
        side_effects:
          - "every TournamentEntry of this event with status == ENTERED transitions to SCRATCHED with scratch_reason='NO_WEIGH_IN'"
          - "every TournamentEntry of this event whose most recent WeighIn has result == FAIL transitions to SCRATCHED with scratch_reason='WEIGH_IN_FAILED'"
          - "increments Event.version by 1"
      - from: WEIGH_IN_CLOSED
        to: SEEDED
        trigger: "POST /events/{id}/seed"
        actor: StateOffice
        preconditions:
          - "event.status == WEIGH_IN_CLOSED"
          - "at least one TournamentEntry of this event has status == WEIGHED_IN"
        side_effects:
          - "assigns seed_number 1..n within each (event_id, weight_class_lbs) group per calculations.seed_assignment and moves those entries WEIGHED_IN -> SEEDED"
          - "sets bracket_locked=true, reseed_required=false, seeded_entry_count and seed_integrity_sum"
          - "increments Event.version by 1"
      - from: SEEDED
        to: SEEDED
        trigger: "POST /events/{id}/seed (reseed after a weight-class change or a disqualification invalidated seeds)"
        actor: StateOffice
        preconditions:
          - "event.status == SEEDED"
          - "event.reseed_required == true"
        side_effects:
          - "reassigns seed_number 1..n within every affected (event_id, weight_class_lbs) group so that seed_integrity_sum again equals the sum of n_c*(n_c+1)/2 over classes"
          - "sets reseed_required=false"
          - "increments Event.version by 1"
      - from: SEEDED
        to: COMPLETED
        trigger: "POST /events/{id}/status with status=COMPLETED"
        actor: StateOffice
        preconditions:
          - "event.status IN {WEIGH_IN_CLOSED, SEEDED}"
          - "event.reseed_required == false"
        side_effects:
          - "increments Event.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/status with status=CANCELLED"
        actor: StateOffice
        preconditions:
          - "event.status IN {SCHEDULED, WEIGH_IN_OPEN}"
        side_effects:
          - "every TournamentEntry of this event with status IN {ENTERED, WEIGHED_IN} transitions to SCRATCHED with scratch_reason='EVENT_CANCELLED'"
          - "increments Event.version by 1"

  - entity: TournamentEntry
    initial_state: ENTERED
    terminal_states: [SCRATCHED, DISQUALIFIED]
    transitions:
      - from: ENTERED
        to: WEIGHED_IN
        trigger: "POST /events/{id}/weigh-ins whose computed result IN {PASS, PASS_WITH_ALLOWANCE}"
        actor: system
        preconditions:
          - "entry.status == ENTERED"
          - "event.status == WEIGH_IN_OPEN"
        side_effects:
          - "sets entry.latest_effective_weight_lbs to the recorded weight of the weigh-in with the greatest day_index"
          - "when the weigh-in has below_minimum == true, a HealthFlag with source=WEIGH_IN_DEFICIT, severity=4, status=OPEN is raised on the wrestler and Team.open_flag_severity_total / compliance_status are recomputed"
          - "increments TournamentEntry.version by 1"
      - from: WEIGHED_IN
        to: WEIGHED_IN
        trigger: "POST /events/{id}/weigh-ins on a later day_index whose result IN {PASS, PASS_WITH_ALLOWANCE}"
        actor: system
        preconditions:
          - "entry.status == WEIGHED_IN"
          - "day_index > every existing WeighIn.day_index for this entry"
        side_effects:
          - "updates entry.latest_effective_weight_lbs"
      - from: WEIGHED_IN
        to: SEEDED
        trigger: "POST /events/{id}/seed"
        actor: system
        preconditions:
          - "entry.status == WEIGHED_IN"
        side_effects:
          - "sets entry.seed_number"
      - from: ENTERED
        to: SCRATCHED
        trigger: "POST /events/{id}/status with status=WEIGH_IN_CLOSED (cascade) or a plan-cancellation cascade"
        actor: system
        preconditions:
          - "entry.status IN {ENTERED, WEIGHED_IN}"
        side_effects:
          - "sets scratch_reason"
          - "decrements Event.entry_count by 1"
      - from: SEEDED
        to: DISQUALIFIED
        trigger: "POST /wrestlers/{id}/disqualification (cascade)"
        actor: system
        preconditions:
          - "entry.wrestler_id == the disqualified wrestler"
        side_effects:
          - "sets scratch_reason='UNHEALTHY_WEIGHT_MANAGEMENT'"
          - "clears seed_number, decrements Event.seeded_entry_count and Event.seed_integrity_sum accordingly, and sets Event.reseed_required=true"
      - from: SEEDED
        to: SEEDED
        trigger: "POST /entries/{id}/weight-class-change on a locked bracket"
        actor: StateOffice
        preconditions:
          - "entry.status == SEEDED"
          - "event.bracket_locked == true"
          - "acting role == StateOffice"
        side_effects:
          - "sets entry.weight_class_lbs to the new class and increments weight_class_change_count by 1"
          - "reseeds both the vacated and the destination (event_id, weight_class_lbs) groups so every group's seed numbers are again contiguous 1..n; Event.seed_integrity_sum is recomputed as the sum of n_c*(n_c+1)/2 over the event's occupied classes, so a class change followed by the reverse class change restores it to exactly its pre-change value"
          - "increments TournamentEntry.version and Event.version by 1"

  - entity: HealthFlag
    initial_state: OPEN
    terminal_states: [REVIEWED, DISMISSED]
    transitions:
      - from: OPEN
        to: REVIEWED
        trigger: "POST /health-flags/{id}/review with outcome=REVIEWED"
        actor: MedicalReviewer
        preconditions:
          - "flag.status == OPEN"
        side_effects:
          - "sets review_note and reviewer_user_id"
          - "removes flag.severity from Team.open_flag_severity_total and recomputes Team.compliance_status"
          - "increments HealthFlag.version by 1"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /health-flags/{id}/review with outcome=DISMISSED"
        actor: MedicalReviewer
        preconditions:
          - "flag.status == OPEN"
        side_effects:
          - "sets review_note and reviewer_user_id"
          - "removes flag.severity from Team.open_flag_severity_total, restoring the exact pre-raise value, and recomputes Team.compliance_status"
          - "when the team leaves PROBATION, every Wrestler of the team with eligibility_status == RESTRICTED and certification_status == CERTIFIED returns to ELIGIBLE"
          - "increments HealthFlag.version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /health-flags/{id}/review with outcome=ESCALATED"
        actor: MedicalReviewer
        preconditions:
          - "flag.status == OPEN"
        side_effects:
          - "sets review_note and reviewer_user_id"
          - "flag.severity remains inside Team.open_flag_severity_total"
          - "the wrestler becomes disqualification-eligible: POST /wrestlers/{id}/disqualification now accepts this flag id"
          - "increments HealthFlag.version by 1"
      - from: ESCALATED
        to: DISMISSED
        trigger: "POST /health-flags/{id}/review with outcome=DISMISSED (the MedicalReviewer clears the escalation)"
        actor: MedicalReviewer
        preconditions:
          - "flag.status == ESCALATED"
        side_effects:
          - "overwrites review_note and reviewer_user_id"
          - "removes flag.severity from Team.open_flag_severity_total, restoring the exact pre-raise value, and recomputes Team.compliance_status"
          - "when the team leaves PROBATION, every Wrestler of the team with eligibility_status == RESTRICTED and certification_status == CERTIFIED returns to ELIGIBLE"
          - "the wrestler is no longer disqualification-eligible and ERR_UNHEALTHY_WEIGHT_MANAGEMENT stops blocking entries and class changes"
          - "increments HealthFlag.version by 1"
        note: "This is the only exit from ESCALATED; it is what makes the ERR_UNHEALTHY_WEIGHT_MANAGEMENT competition block clearable rather than permanent. Reviewing an already REVIEWED or DISMISSED flag is ERR_HEALTH_FLAG_INVALID_STATE."

  - entity: Team
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: WATCH
        trigger: "any HealthFlag raise or review that moves open_flag_severity_total into 1..4 (compound state derived from children)"
        actor: system
        preconditions:
          - "1 <= team.open_flag_severity_total <= 4"
        side_effects:
          - "no wrestler eligibility change: WATCH is advisory"
      - from: WATCH
        to: PROBATION
        trigger: "any HealthFlag raise that moves open_flag_severity_total to >= 5"
        actor: system
        preconditions:
          - "team.open_flag_severity_total >= 5"
        side_effects:
          - "every Wrestler of the team with eligibility_status == ELIGIBLE transitions to RESTRICTED"
          - "new TournamentEntry creation for this team's wrestlers is rejected with ERR_TEAM_ON_PROBATION"
      - from: PROBATION
        to: WATCH
        trigger: "POST /health-flags/{id}/review with outcome IN {REVIEWED, DISMISSED} dropping open_flag_severity_total into 1..4"
        actor: system
        preconditions:
          - "1 <= team.open_flag_severity_total <= 4"
        side_effects:
          - "every Wrestler of the team with eligibility_status == RESTRICTED and certification_status == CERTIFIED returns to ELIGIBLE"
      - from: WATCH
        to: CLEAR
        trigger: "POST /health-flags/{id}/review with outcome IN {REVIEWED, DISMISSED} dropping open_flag_severity_total to 0"
        actor: system
        preconditions:
          - "team.open_flag_severity_total == 0"
        side_effects:
          - "every Wrestler of the team with eligibility_status == RESTRICTED and certification_status == CERTIFIED returns to ELIGIBLE"
      - from: CLEAR
        to: PROBATION
        trigger: "a single WEIGH_IN_DEFICIT raise combined with an existing open flag pushing the total to >= 5"
        actor: system
        preconditions:
          - "team.open_flag_severity_total >= 5"
        side_effects:
          - "every Wrestler of the team with eligibility_status == ELIGIBLE transitions to RESTRICTED"

concurrency_rules:
  - rule_id: descent-plan-create-stale-wrestler
    parent_entity: Wrestler
    write_endpoint: "POST /wrestlers/{id}/descent-plans"
    occ_field: "expected_wrestler_version"
    description: |
      Creating a DescentPlan against a Wrestler whose version has advanced since
      the client last observed it is rejected. Plan creation legitimately
      supersedes the wrestler's prior non-terminal plan and rewrites the
      wrestler's certification dimension, so a writer holding a stale view of the
      wrestler would silently discard a plan or an assessment repoint it never
      saw. The check is a pure stale-version comparison against
      Wrestler.version.
    error_id: ERR_STALE_WRESTLER_VERSION
    http_status: 412

  - rule_id: entry-class-change-stale-entry
    parent_entity: TournamentEntry
    write_endpoint: "POST /entries/{id}/weight-class-change"
    occ_field: "expected_entry_version"
    description: |
      Changing an entry's weight class while holding a stale
      TournamentEntry.version is rejected. A class change is idempotent-looking
      but not idempotent: it reseeds two bracket groups, so a writer whose view
      predates an earlier change (or a seeding run that assigned seed_number)
      would move the entry out of a bracket state it never observed. The check is
      a pure stale-version comparison against TournamentEntry.version.
    error_id: ERR_STALE_ENTRY_VERSION
    http_status: 412

calculations:
  - name: minimum_certified_weight
    trigger: "POST /assessments/{id}/finalize landing on the VALIDATED arm (state_machines.Assessment.DRAFT_to_VALIDATED)"
    algorithm: threshold
    formula: |
      floor_pct = season.min_body_fat_pct_male   if wrestler.sex == 'M'
      floor_pct = season.min_body_fat_pct_female if wrestler.sex == 'F'

      # Rounding order is PINNED: lean body weight is rounded to 1 decimal FIRST,
      # then divided, then the quotient is rounded to 1 decimal. Do NOT carry the
      # unrounded lean weight into the division.
      lean_body_weight_lbs         = round_half_up(assessment.measured_weight_lbs * (1 - assessment.body_fat_pct / 100), 1)
      minimum_certified_weight_lbs = round_half_up(lean_body_weight_lbs / (1 - floor_pct / 100), 1)
      alpha_weight_lbs             = assessment.measured_weight_lbs

      # Class selection uses >= (inclusive): a minimum that lands exactly on a
      # class limit certifies INTO that class, not the next one up.
      candidates = [C for C in season.weight_classes if C >= minimum_certified_weight_lbs]
      if candidates is empty: reject with ERR_NO_ELIGIBLE_WEIGHT_CLASS
      min_weight_class_lbs = min(candidates)
    input_set: "Exactly one Assessment row — the one being finalized. Season constants are read from the Season owning the wrestler's Team. Runs only on the VALIDATED arm; the HYDRATION_FAILED arm leaves all four outputs null."
    constants:
      MIN_BODY_FAT_PCT_MALE: 7.0
      MIN_BODY_FAT_PCT_FEMALE: 12.0
    precision: "1 decimal place, round_half_up, applied twice (after the lean-weight multiply and after the floor divide)"
    variants: []

  - name: descent_schedule_projection
    trigger: "POST /descent-plans/{id}/certify (state_machines.DescentPlan.DRAFT_to_CERTIFIED) and POST /descent-plans/{id}/revise (state_machines.DescentPlan.BREACHED_to_CERTIFIED)"
    algorithm: chronological
    formula: |
      rate   = plan.weekly_rate_pct            # copied from season.max_weekly_descent_pct at plan creation
      alpha  = wrestler.alpha_weight_lbs       # descent baseline from the source assessment
      target = plan.target_class_lbs

      # --- variant WEEKLY_STEP (compounding, round-per-step) ---
      #   w[0] = alpha
      #   w[k] = round_half_up(w[k-1] * (1 - rate/100), 1)
      #   PINNED ROUNDING ORDER: each week's value is rounded to 1 decimal BEFORE
      #   it becomes the base of the next week. Computing
      #   round_half_up(alpha * (1 - rate/100)**k, 1) in one shot is WRONG and
      #   diverges from week 5 onward for alpha=159.6, rate=1.5.
      #
      # --- variant LINEAR_RATE (fixed pound delta) ---
      #   weekly_delta_lbs = round_half_up(alpha * rate / 100, 1)
      #   w[k] = round_half_up(alpha - k * weekly_delta_lbs, 1)
      #
      total_weeks = min { k >= 0 : w[k] <= target }
      for k in 0..total_weeks:
        milestone[k].week_index           = k
        milestone[k].effective_date       = plan.plan_start_date + 7*k days
        milestone[k].allowable_weight_lbs = w[k]
        milestone[k].min_eligible_class_lbs =
            min { C in season.weight_classes : C >= max(w[k], wrestler.minimum_certified_weight_lbs) }
      plan.milestone_count               = total_weeks + 1
      plan.projected_certification_date  = plan.plan_start_date + 7*total_weeks days

      # Admissibility gate, evaluated BEFORE any milestone is generated, only when
      # the client supplied requested_weeks:
      required_weekly_delta = round_half_up((alpha - target) / requested_weeks, 1)
      max_weekly_delta      = round_half_up(alpha * rate / 100, 1)
      if required_weekly_delta > max_weekly_delta: reject with ERR_DESCENT_RATE_EXCEEDED
    input_set: "One DescentPlan plus its wrestler's alpha_weight_lbs and minimum_certified_weight_lbs, plus the Season weight_classes list. Milestones already in status MET or MISSED are never regenerated by a revision; only SCHEDULED milestones are replaced."
    constants:
      MAX_WEEKLY_DESCENT_PCT: 1.5
    precision: "1 decimal place, round_half_up, applied once per week for WEEKLY_STEP and once per week for LINEAR_RATE"
    variants:
      - name: WEEKLY_STEP
        when: "plan.plan_variant == WEEKLY_STEP"
        difference: "Each week's allowable weight is a compounding 1.5% reduction of the PREVIOUS week's already-rounded allowable weight, so the pound delta shrinks every week. For alpha=159.6 / rate=1.5 / target=150 this yields w = [159.6, 157.2, 154.8, 152.5, 150.2, 147.9], total_weeks=5."
      - name: LINEAR_RATE
        when: "plan.plan_variant == LINEAR_RATE"
        difference: "A single fixed delta of round_half_up(alpha*rate/100, 1) = 2.4 lbs is subtracted k times from the untouched alpha, so the pound delta is constant. For the same inputs this yields w = [159.6, 157.2, 154.8, 152.4, 150.0], total_weeks=4 — one week earlier, and week 4's min_eligible_class_lbs is 150 rather than 157."

  - name: lowest_eligible_class_at_date
    trigger: "POST /wrestlers/{id}/eligibility-checks, POST /events/{id}/entries (pre-competition certification-database check), and any recomputation of Wrestler.lowest_eligible_class_lbs"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED. The dependency looks circular (the class
      # decides which plan target applies, the plan decides the floor, the floor
      # decides the class), so the four steps below run in exactly this order and
      # never iterate.
      #
      # Step 1 — growth allowance total (inclusive lower bound on effective_date):
      G = sum( ga.allowance_lbs for ga in GrowthAllowance
               where ga.season_id == season.id and ga.effective_date <= as_of_date )
      #   as_of_date == Event.event_date of the referenced event.
      #
      # Step 2 — governing milestone of the wrestler's governing plan:
      governing_plan = the wrestler's DescentPlan with status IN {CERTIFIED, BREACHED}
                       (at most one exists; if two ever coexist take the greatest created_at)
      if governing_plan is null: S = null
      else:
        past = [m for m in milestones(governing_plan) if m.effective_date <= as_of_date]
        S = max(past, key=effective_date).allowable_weight_lbs   if past is non-empty
        S = milestone[week_index=0].allowable_weight_lbs         if past is empty
      #   as_of_date beyond the last milestone keeps the LAST milestone's value.
      #
      # Step 3 — eligibility floor:
      F = wrestler.minimum_certified_weight_lbs        if S is null
      F = max(wrestler.minimum_certified_weight_lbs, S) otherwise
      #
      # Step 4 — class selection, then the hard-floor clamp:
      candidates = [C for C in season.weight_classes if C + G >= F]
      candidate_class = min(candidates)   # null when candidates is empty
      hard_floor_class = wrestler.min_weight_class_lbs
      #   min_weight_class_lbs was computed at assessment-validation time from the
      #   UNADJUSTED minimum. Growth allowance MUST NOT be folded back into it.
      lowest_eligible_class_lbs = max(candidate_class, hard_floor_class)
      if candidates is empty: lowest_eligible_class_lbs = null, outcome = BLOCKED_CLASS_BELOW_MINIMUM
    input_set: "One Wrestler (must have source_assessment_id non-null), the wrestler's single non-terminal DescentPlan with status IN {CERTIFIED, BREACHED} and its DescentMilestone rows, and every GrowthAllowance of the season with effective_date <= as_of_date."
    constants: {}
    precision: "Weights compared at 1 decimal place; the result is an integer weight class"
    variants: []

  - name: weigh_in_allowance_and_result
    trigger: "POST /events/{id}/weigh-ins"
    algorithm: threshold
    formula: |
      G = sum( ga.allowance_lbs for ga in GrowthAllowance
               where ga.season_id == season.id and ga.effective_date <= event.event_date )
      consecutive       = min( round_half_up(weigh_in.day_index * event.consecutive_day_allowance_lbs, 1),
                               season.max_consecutive_day_allowance_lbs )
      allowance_lbs     = round_half_up(G + consecutive, 1)
      effective_limit   = round_half_up(entry.weight_class_lbs + allowance_lbs, 1)

      result = PASS                 if recorded_weight_lbs <= entry.weight_class_lbs
             = PASS_WITH_ALLOWANCE  if entry.weight_class_lbs < recorded_weight_lbs <= effective_limit
             = FAIL                 otherwise
      below_minimum = recorded_weight_lbs < wrestler.minimum_certified_weight_lbs

      entry.latest_effective_weight_lbs = recorded_weight_lbs of this entry's WeighIn whose
          result IN {PASS, PASS_WITH_ALLOWANCE} with the greatest day_index (tie-break
          created_at ASC); a FAIL weigh-in never overwrites it and leaves the prior value intact
    input_set: "One WeighIn being recorded, its TournamentEntry, the entry's Event, the wrestler's minimum_certified_weight_lbs, and every GrowthAllowance of the season with effective_date <= event.event_date."
    constants:
      MAX_CONSECUTIVE_DAY_ALLOWANCE_LBS: 2.0
    precision: "1 decimal place, round_half_up; both comparison boundaries are inclusive on the upper side (<=)"
    variants: []

  - name: milestone_evaluation
    trigger: "POST /seasons/{id}/compliance-run (state_machines.DescentMilestone.SCHEDULED_to_MET and SCHEDULED_to_MISSED)"
    algorithm: chronological
    formula: |
      for each DescentPlan with status == CERTIFIED, in created_at ASC order:
        for each DescentMilestone of that plan with status == SCHEDULED
            and effective_date <= current_clock_date, in week_index ASC order:
          window     = [ effective_date T00:00:00Z , effective_date + 3 days T00:00:00Z )   # half-open, 3-day grace
          candidates = WeighIn rows with wrestler_id == plan.wrestler_id and recorded_at in window
          qualifying = max(candidates, key=recorded_at); tie-break created_at ASC
          if qualifying is null:                                     status = MISSED, evaluated_recorded_weight_lbs = null
          elif qualifying.recorded_weight_lbs <= allowable_weight_lbs: status = MET,    evaluated_recorded_weight_lbs = qualifying.recorded_weight_lbs
          else:                                                       status = MISSED, evaluated_recorded_weight_lbs = qualifying.recorded_weight_lbs
        plan.missed_milestone_count = count(milestones of plan with status == MISSED)
        if plan.missed_milestone_count >= season.plan_breach_limit: plan CERTIFIED -> BREACHED
        elif every milestone of plan has status IN {MET, WAIVED}:    plan CERTIFIED -> COMPLETED
    input_set: "Every DescentPlan of the season with status == CERTIFIED, processed in created_at ASC order (never id order); within a plan, milestones in week_index ASC order. Milestones with effective_date > the current clock date are skipped and stay SCHEDULED."
    constants:
      MILESTONE_GRACE_DAYS: 3
      PLAN_BREACH_LIMIT: 2
    precision: "Weights compared at 1 decimal place"
    variants: []

  - name: audit_discrepancy_score
    trigger: "POST /audits/{id}/finalize (state_machines.Assessor.CERTIFIED_to_SUSPENDED on the FAIL branch)"
    algorithm: weighted_scoring
    formula: |
      for each sample s in audit.samples:
        d[s] = round_half_up( abs( s.remeasured_body_fat_pct
                                   - Assessment(s.assessment_id).body_fat_pct ), 2 )

      if audit.sample_count < season.audit_min_sample_count:
        outcome = INCONCLUSIVE, discrepancy_score = null      # empty / undersized sample edge
      else:
        # variant WORST_CASE : score = max(d)
        # variant SAMPLE_MEAN: score = round_half_up( sum(d) / audit.sample_count, 2 )
        outcome = FAIL if discrepancy_score >= season.audit_fail_threshold_pct else PASS
    input_set: "The samples array of exactly one ProgramAudit, joined to the referenced Assessment rows for their recorded body_fat_pct. Assessments already in status VOIDED are still scored; only the FAIL cascade skips them."
    constants:
      AUDIT_FAIL_THRESHOLD_PCT: 2.0
      AUDIT_MIN_SAMPLE_COUNT: 3
    precision: "2 decimal places, round_half_up, applied per sample deviation and again to the mean"
    variants:
      - name: WORST_CASE
        when: "audit.scoring_variant == WORST_CASE"
        difference: "Takes the single largest per-sample deviation. For deviations [1.20, 2.40, 0.60] the score is 2.40, which is >= 2.0 and finalizes FAIL, triggering the assessor-suspension cascade."
      - name: SAMPLE_MEAN
        when: "audit.scoring_variant == SAMPLE_MEAN"
        difference: "Averages the deviations. The same [1.20, 2.40, 0.60] yields 1.40, which is < 2.0 and finalizes PASS with no cascade at all — identical audit inputs, opposite regulatory consequence."

  - name: team_compliance_posture
    trigger: "Every HealthFlag raise (assessment hydration failure, weigh-in deficit, plan breach) and every POST /health-flags/{id}/review"
    algorithm: aggregation
    formula: |
      open_flag_severity_total =
          sum( hf.severity for hf in HealthFlag
               where hf.status IN {OPEN, ESCALATED}
                 and Wrestler(hf.wrestler_id).team_id == team.id )
      #   Wrestlers of every certification_status contribute, DISQUALIFIED included.
      compliance_status = CLEAR      if open_flag_severity_total == 0
                        = WATCH      if 1 <= open_flag_severity_total <= 4
                        = PROBATION  if open_flag_severity_total >= 5
    input_set: "Every HealthFlag whose wrestler belongs to the team and whose status IN {OPEN, ESCALATED}. REVIEWED and DISMISSED flags are excluded, which is what makes review a true compensating action on the severity ledger."
    constants:
      SEVERITY_HYDRATION_FAIL: 1
      SEVERITY_RAPID_LOSS: 2
      SEVERITY_PLAN_BREACH: 3
      SEVERITY_WEIGH_IN_DEFICIT: 4
      WATCH_LOWER_BOUND: 1
      PROBATION_LOWER_BOUND: 5
    precision: "Integer arithmetic; thresholds are inclusive lower bounds"
    variants: []

  - name: seed_assignment
    trigger: "POST /events/{id}/seed and the reseed branch of POST /entries/{id}/weight-class-change"
    algorithm: waterfall_allocation
    formula: |
      # Eligibility filter (explicit status set, no fuzzy adjectives). The admitted
      # status set depends on which branch is running:
      #   initial seeding (event.status == WEIGH_IN_CLOSED): {WEIGHED_IN}
      #   reseed          (event.status == SEEDED):          {WEIGHED_IN, SEEDED}
      # so a reseed re-ranks the entries that are already seeded together with any
      # entry that weighed in after the first seeding run.
      admitted = {WEIGHED_IN} if event.status == WEIGH_IN_CLOSED else {WEIGHED_IN, SEEDED}
      candidates = [ e for e in TournamentEntry
                     where e.event_id == event.id and e.status IN admitted ]
      if candidates is empty: reject with ERR_NO_SEEDABLE_ENTRIES   # empty-pool fallback

      for each class C present among candidates, ascending by C:
        group = [ e for e in candidates if e.weight_class_lbs == C ]
        # Ranking expression, in order:
        #   1. season_win_count DESC
        #   2. latest_effective_weight_lbs ASC        (null sorts last)
        #   3. created_at ASC                          (final tie-break; id is NEVER consulted)
        for i, e in enumerate(sorted(group), start=1):
          e.seed_number = i
          e.status = SEEDED

      event.seeded_entry_count = count(entries of event with seed_number != null)
      # Conserved seeding quantity, asserted after every seeding or reseeding run:
      event.seed_integrity_sum = sum(e.seed_number for e in entries of event if e.seed_number != null)
      #   invariant: seed_integrity_sum == sum over classes C of n_C*(n_C+1)/2
      #              where n_C = count of seeded entries in class C
    input_set: "TournamentEntry rows of one Event with status == WEIGHED_IN on the initial seeding run, or status IN {WEIGHED_IN, SEEDED} on a reseed. SCRATCHED, DISQUALIFIED and still-ENTERED entries are excluded and receive no seed_number. A class with an empty group is silently skipped; only a globally empty candidate set is an error."
    constants: {}
    precision: "Integer seed numbers starting at 1 within each (event_id, weight_class_lbs) group"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id resolves to a stored row, validated left-to-right in the path"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_TEAM_NOT_FOUND | ERR_WRESTLER_NOT_FOUND | ERR_ASSESSOR_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_WEIGH_IN_NOT_FOUND | ERR_ELIGIBILITY_CHECK_NOT_FOUND | ERR_HEALTH_FLAG_NOT_FOUND | ERR_AUDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "Every FK supplied in the request body resolves to a stored row, validated in the order the fields are listed in the endpoint's input"
    error_id: "ERR_ASSESSOR_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_WRESTLER_NOT_FOUND | ERR_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "POST /wrestlers/{id}/assessments, POST /wrestlers/{id}/descent-plans, POST /appeals/{id}/assign-reviewer, POST /events/{id}/entries, POST /events/{id}/weigh-ins, POST /seasons/{id}/audits"
  - priority: 5
    category: business_referential
    check: "Ownership: a TeamCoach may only act on wrestlers, appeals and entries whose team_id equals the acting X-User-ID; an Assessor may only finalize an assessment whose assessor_id equals the acting X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /teams/{id}/wrestlers, POST /assessments/{id}/appeals, POST /wrestlers/{id}/descent-plans, POST /events/{id}/entries, POST /assessments/{id}/finalize, POST /entries/{id}/weight-class-change"
  - priority: 6
    category: business_constraint
    check: "Request body parses, all required fields present, enums within their declared value sets, numeric fields within range (measured_weight_lbs 60.0-400.0, body_fat_pct 1.0-50.0, urine_specific_gravity 1.000-1.060, recorded_weight_lbs 60.0-400.0, allowance_lbs 0 < v <= 4.0, requested_weeks >= 1, grade 9-12), limit 1-100 and offset >= 0, and every weight_class_lbs / target_class_lbs / requested_class_lbs is a member of Season.weight_classes"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_WEIGHT_CLASS"
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: business_constraint
    check: "expected_wrestler_version / expected_entry_version equals the parent row's stored version (see concurrency_rules)"
    error_id: "ERR_STALE_WRESTLER_VERSION | ERR_STALE_ENTRY_VERSION"
    http_status: 412
    applies_to: "POST /wrestlers/{id}/descent-plans, POST /entries/{id}/weight-class-change"
  - priority: 8
    category: business_safety
    check: "The wrestler's certification_status is not DISQUALIFIED — a disqualified wrestler is frozen out of every downstream operation, ahead of even the season-open check"
    error_id: ERR_WRESTLER_DISQUALIFIED
    http_status: 409
    applies_to: "POST /wrestlers/{id}/assessments, POST /wrestlers/{id}/descent-plans, POST /events/{id}/entries, POST /events/{id}/weigh-ins"
  - priority: 9
    category: state
    check: "The owning Season is in status OPEN"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 409
    applies_to: "POST /seasons/{id}/growth-allowances, POST /teams, POST /teams/{id}/wrestlers, POST /wrestlers/{id}/assessments, POST /wrestlers/{id}/descent-plans, POST /seasons/{id}/events, POST /events/{id}/entries, POST /events/{id}/weigh-ins, POST /seasons/{id}/compliance-run, POST /seasons/{id}/audits"
  - priority: 10
    category: state
    check: "The target row is in a from-state that permits the requested transition per state_machines"
    error_id: "ERR_SEASON_INVALID_STATE | ERR_ASSESSMENT_INVALID_STATE | ERR_APPEAL_INVALID_STATE | ERR_PLAN_INVALID_STATE | ERR_EVENT_INVALID_STATE | ERR_ENTRY_INVALID_STATE | ERR_AUDIT_INVALID_STATE | ERR_HEALTH_FLAG_INVALID_STATE | ERR_ASSESSOR_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"
  - priority: 11
    category: business_safety
    check: "The wrestler's certification_status is CERTIFIED (a source_assessment_id is on file) before any entry, weigh-in or descent plan is accepted"
    error_id: ERR_WRESTLER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /wrestlers/{id}/descent-plans, POST /events/{id}/entries, POST /events/{id}/weigh-ins"
  - priority: 12
    category: business_safety
    check: "The wrestler has no HealthFlag in status ESCALATED — an escalated flag blocks competition until a MedicalReviewer clears it"
    error_id: ERR_UNHEALTHY_WEIGHT_MANAGEMENT
    http_status: 409
    applies_to: "POST /events/{id}/entries, POST /entries/{id}/weight-class-change"
  - priority: 13
    category: business_safety
    check: "The requested weight_class_lbs is >= the wrestler's lowest_eligible_class_at_date for the event date (certification-database check), and a plan's target_class_lbs is >= wrestler.min_weight_class_lbs; a class below the certified minimum is refused regardless of scheduling"
    error_id: "ERR_CLASS_BELOW_CERTIFIED_MINIMUM | ERR_TARGET_BELOW_MINIMUM"
    http_status: 422
    applies_to: "POST /events/{id}/entries, POST /entries/{id}/weight-class-change, POST /wrestlers/{id}/descent-plans, POST /descent-plans/{id}/certify, POST /descent-plans/{id}/revise"
  - priority: 14
    category: business_safety
    check: "lowest_eligible_class_at_date returns a non-null class — no class in the season satisfies the wrestler's floor otherwise"
    error_id: ERR_NO_ELIGIBLE_WEIGHT_CLASS
    http_status: 422
    applies_to: "POST /assessments/{id}/finalize, POST /events/{id}/entries"
  - priority: 15
    category: business_safety
    check: "When requested_weeks is supplied, the implied weekly delta does not exceed round_half_up(alpha_weight_lbs * weekly_rate_pct / 100, 1); equality is allowed"
    error_id: ERR_DESCENT_RATE_EXCEEDED
    http_status: 422
    applies_to: "POST /wrestlers/{id}/descent-plans, POST /descent-plans/{id}/revise"
  - priority: 16
    category: business_safety
    check: "Disqualification is only accepted against a HealthFlag whose status is ESCALATED and whose wrestler_id equals the path wrestler; an OPEN, REVIEWED or DISMISSED flag is refused"
    error_id: ERR_ESCALATED_FLAG_REQUIRED
    http_status: 409
    applies_to: "POST /wrestlers/{id}/disqualification"
  - priority: 17
    category: business_referential
    check: "The referenced assessor's status is CERTIFIED (not PROVISIONAL, SUSPENDED or EXPIRED)"
    error_id: ERR_ASSESSOR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /wrestlers/{id}/assessments, POST /appeals/{id}/assign-reviewer, POST /seasons/{id}/audits"
  - priority: 18
    category: business_referential
    check: "The requested assessment method appears in the assessor's certified_methods array"
    error_id: ERR_METHOD_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /wrestlers/{id}/assessments"
  - priority: 19
    category: business_referential
    check: "Segregation of duties: the reviewing assessor of an appeal and the assessor of the appeal-ordered retest must both differ from the assessor who produced the assessment under review"
    error_id: ERR_SAME_ASSESSOR_CONFLICT
    http_status: 409
    applies_to: "POST /appeals/{id}/assign-reviewer, POST /wrestlers/{id}/assessments"
  - priority: 20
    category: business_referential
    check: "The referenced source_assessment_id / retest_of_assessment_id belongs to the same wrestler as the path wrestler, a plan's source assessment is in status VALIDATED, and every ProgramAudit sample references an Assessment whose assessor_id equals the audit's assessor_id"
    error_id: "ERR_ASSESSMENT_WRESTLER_MISMATCH | ERR_AUDIT_SAMPLE_MISMATCH"
    http_status: 422
    applies_to: "POST /wrestlers/{id}/descent-plans, POST /wrestlers/{id}/assessments, POST /seasons/{id}/audits"
  - priority: 21
    category: business_referential
    check: "The wrestler's Team is not in compliance_status PROBATION — a team on probation cannot add entries or open new plans"
    error_id: ERR_TEAM_ON_PROBATION
    http_status: 409
    applies_to: "POST /events/{id}/entries, POST /wrestlers/{id}/descent-plans"
  - priority: 22
    category: business_temporal
    check: "An appeal is filed within season.appeal_filing_window_days of the assessment's assessed_at, measured against the logical clock; the boundary instant assessed_at + appeal_filing_window_days is still inside the window"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /assessments/{id}/appeals"
  - priority: 23
    category: business_temporal
    check: "day_index is within 0..event.weigh_in_days-1 and recorded_at falls on event_date + day_index"
    error_id: ERR_WEIGH_IN_DAY_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /events/{id}/weigh-ins"
  - priority: 24
    category: business_constraint
    check: "The assessor has fewer than season.assessor_daily_assessment_capacity non-VOIDED assessments already recorded on the UTC calendar day of assessed_at, counted across every wrestler and every team"
    error_id: ERR_ASSESSOR_DAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /wrestlers/{id}/assessments"
  - priority: 25
    category: business_temporal
    check: "The wrestler has no other non-SCRATCHED entry whose event competition window [event_date, event_date + competition_days) overlaps this event's window; adjacency (gap of exactly zero days) is permitted"
    error_id: ERR_ENTRY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /events/{id}/entries"
  - priority: 26
    category: business_constraint
    check: "Uniqueness: at most one non-SCRATCHED TournamentEntry per (event_id, wrestler_id)"
    error_id: ERR_DUPLICATE_ENTRY
    http_status: 409
    applies_to: "POST /events/{id}/entries"
  - priority: 27
    category: business_constraint
    check: "Uniqueness: at most one WeighIn per (entry_id, day_index)"
    error_id: ERR_DUPLICATE_WEIGH_IN
    http_status: 409
    applies_to: "POST /events/{id}/weigh-ins"
  - priority: 28
    category: business_constraint
    check: "Uniqueness: at most one GrowthAllowance per (season_id, effective_date)"
    error_id: ERR_GROWTH_ALLOWANCE_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /seasons/{id}/growth-allowances"
  - priority: 29
    category: business_constraint
    check: "The event's bracket_locked flag is false — once the first successful seeding locks the bracket, no new TournamentEntry may be added to the event. StateOffice-driven weight-class changes and reseeds are the only sanctioned way to alter a locked bracket and are therefore exempt."
    error_id: ERR_BRACKET_LOCKED
    http_status: 409
    applies_to: "POST /events/{id}/entries"
  - priority: 30
    category: business_constraint
    check: "The assessment under appeal has fewer than season.max_appeal_retest_rounds prior retest rounds recorded on any appeal of that assessment"
    error_id: ERR_APPEAL_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /assessments/{id}/appeals"
  - priority: 31
    category: business_constraint
    check: "The seeding pool is non-empty: on the initial seeding run (event.status == WEIGH_IN_CLOSED) at least one TournamentEntry of the event is in status WEIGHED_IN; on a reseed (event.status == SEEDED) at least one entry is in status IN {WEIGHED_IN, SEEDED}"
    error_id: ERR_NO_SEEDABLE_ENTRIES
    http_status: 409
    applies_to: "POST /events/{id}/seed"
  - priority: 32
    category: business_constraint
    check: "Uniqueness: credential_number is unique across every Assessor row, and school_name is unique within the owning Season"
    error_id: "ERR_DUPLICATE_CREDENTIAL | ERR_DUPLICATE_SCHOOL_NAME"
    http_status: 409
    applies_to: "POST /assessors, POST /teams"
  - priority: 33
    category: business_constraint
    check: "An Event may only transition to COMPLETED while reseed_required == false, and a Season may only close while no Event of the season is in status WEIGH_IN_OPEN or SEEDED"
    error_id: ERR_RESEED_REQUIRED
    http_status: 409
    applies_to: "POST /events/{id}/status, POST /seasons/{id}/status"

endpoints:
  # ---------- logical clock (test-driving endpoint, §1.5 ladder step 3) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every filed_at, raised_at, recorded_at, checked_at, disqualified_at and every window/expiry comparison reads that fixed default and never falls back to real wall-clock time."
    roles: [StateOffice]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets the logical clock consulted by appeal-window, milestone-grace, credential-expiry and compliance-run evaluation"]

  # ---------- Season ----------
  - method: POST
    path: "/seasons"
    description: "Creates a season with its full regulatory constant set."
    roles: [StateOffice]
    code: 201
    input: [name, start_date, "weight_classes?", "min_body_fat_pct_male?", "min_body_fat_pct_female?", "hydration_max_specific_gravity?", "max_weekly_descent_pct?", "assessor_min_training_hours?", "audit_fail_threshold_pct?", "audit_min_sample_count?", "max_consecutive_day_allowance_lbs?", "appeal_filing_window_days?", "max_appeal_retest_rounds?", "assessor_daily_assessment_capacity?", "plan_breach_limit?"]
    output: Season
    side_effects: ["status=SETUP, team_count=0, certified_wrestler_count=0"]
  - method: GET
    path: "/seasons/{id}"
    description: "Reads one season including its derived counters."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: POST
    path: "/seasons/{id}/status"
    description: "Drives the season lifecycle SETUP -> OPEN -> CLOSED."
    roles: [StateOffice]
    code: 200
    input: [status]
    output: Season
    side_effects: ["state_machines.Season transitions", "on CLOSED: SCHEDULED and WEIGH_IN_CLOSED events of the season transition to COMPLETED"]
  - method: POST
    path: "/seasons/{id}/growth-allowances"
    description: "Publishes a growth-allowance date for the season."
    roles: [StateOffice]
    code: 201
    input: [effective_date, allowance_lbs, "note?"]
    output: GrowthAllowance
    side_effects: ["enters calculations.lowest_eligible_class_at_date step 1 and calculations.weigh_in_allowance_and_result for every event on or after effective_date"]
  - method: GET
    path: "/seasons/{id}/growth-allowances"
    description: "Lists the season's growth allowances in effective_date ASC order (FK reverse-reachability for GrowthAllowance.season_id)."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: GrowthAllowance[]
    side_effects: []
  - method: GET
    path: "/seasons/{id}/teams"
    description: "Lists the season's teams (FK reverse-reachability for Team.season_id)."
    roles: [StateOffice, Assessor, TeamCoach, MedicalReviewer]
    code: 200
    input: ["compliance_status?", "limit?", "offset?"]
    output: Team[]
    side_effects: []
  - method: POST
    path: "/seasons/{id}/compliance-run"
    description: "Evaluates every CERTIFIED plan's due milestones against recorded weigh-ins, raises PLAN_BREACH flags and recomputes team posture. Returns the season with refreshed counters."
    roles: [StateOffice]
    code: 200
    input: []
    output: Season
    side_effects: ["calculations.milestone_evaluation over every CERTIFIED plan in created_at ASC order", "DescentMilestone SCHEDULED -> MET | MISSED", "DescentPlan CERTIFIED -> BREACHED at plan_breach_limit, or CERTIFIED -> COMPLETED when all milestones are MET/WAIVED", "HealthFlag PLAN_BREACH severity 3 raised per breach", "Team.open_flag_severity_total and compliance_status recomputed", "Wrestler eligibility ELIGIBLE -> RESTRICTED on PROBATION"]

  # ---------- Team ----------
  - method: POST
    path: "/teams"
    description: "Registers a team into a season."
    roles: [StateOffice]
    code: 201
    input: [season_id, school_name]
    output: Team
    side_effects: ["increments Season.team_count", "compliance_status=CLEAR, open_flag_severity_total=0"]
  - method: GET
    path: "/teams/{id}"
    description: "Reads one team including its severity ledger and derived compliance posture."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: []
    output: Team
    side_effects: []

  # ---------- Assessor ----------
  - method: POST
    path: "/assessors"
    description: "Registers an assessor; starts in PROVISIONAL until training hours accumulate."
    roles: [StateOffice]
    code: 201
    input: [full_name, credential_number, certified_methods, certification_expires_on]
    output: Assessor
    side_effects: ["status=PROVISIONAL, training_hours_completed=0"]
  - method: GET
    path: "/assessors/{id}"
    description: "Reads one assessor including training hours and last audit outcome."
    roles: [StateOffice, Assessor, TeamCoach, MedicalReviewer]
    code: 200
    input: []
    output: Assessor
    side_effects: []
  - method: POST
    path: "/assessors/{id}/training-records"
    description: "Records completed assessor training hours; auto-certifies the assessor once the season threshold is reached."
    roles: [StateOffice]
    code: 200
    input: [credential_code, hours]
    output: Assessor
    side_effects: ["adds hours to training_hours_completed", "Assessor PROVISIONAL -> CERTIFIED when the cumulative total reaches Season.assessor_min_training_hours"]
  - method: POST
    path: "/assessors/{id}/suspension"
    description: "Suspends a certified assessor administratively."
    roles: [StateOffice]
    code: 200
    input: [reason]
    output: Assessor
    side_effects: ["Assessor CERTIFIED -> SUSPENDED", "every DRAFT Assessment of this assessor transitions to VOIDED with void_reason='ASSESSOR_SUSPENDED'"]

  # ---------- Wrestler ----------
  - method: POST
    path: "/teams/{id}/wrestlers"
    description: "Adds a wrestler to a team roster."
    roles: [TeamCoach, StateOffice]
    code: 201
    input: [full_name, sex, grade]
    output: Wrestler
    side_effects: ["certification_status=UNCERTIFIED, eligibility_status=INELIGIBLE", "increments Team.roster_count"]
  - method: GET
    path: "/wrestlers/{id}"
    description: "Reads one wrestler including both state dimensions and every certified figure."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: []
    output: Wrestler
    side_effects: []
  - method: GET
    path: "/wrestlers"
    description: "Filtered wrestler list (FK reverse-reachability for Wrestler.team_id and Wrestler.source_assessment_id)."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: ["team_id?", "source_assessment_id?", "certification_status?", "eligibility_status?", "limit?", "offset?"]
    output: Wrestler[]
    side_effects: []
  - method: POST
    path: "/wrestlers/{id}/disqualification"
    description: "Disqualifies a wrestler for unhealthy weight management on the strength of an ESCALATED health flag."
    roles: [StateOffice]
    code: 200
    input: [health_flag_id, reason]
    output: Wrestler
    side_effects: ["Wrestler certification_status -> DISQUALIFIED, eligibility_status -> INELIGIBLE", "every non-terminal DescentPlan -> CANCELLED with cancel_reason='DISQUALIFIED'", "every ENTERED/WEIGHED_IN/SEEDED TournamentEntry -> DISQUALIFIED, seed_number cleared, Event.reseed_required=true", "decrements Team.roster_count"]

  # ---------- Assessment ----------
  - method: POST
    path: "/wrestlers/{id}/assessments"
    description: "Opens a DRAFT body-composition assessment. Supply appeal_id and retest_of_assessment_id to create an appeal-ordered retest."
    roles: [Assessor]
    code: 201
    input: [assessor_id, method, assessed_at, measured_weight_lbs, body_fat_pct, urine_specific_gravity, "appeal_id?", "retest_of_assessment_id?"]
    output: Assessment
    side_effects: ["status=DRAFT; no certified figure is computed until finalize", "counts against the assessor's daily capacity interval for the UTC calendar day of assessed_at"]
  - method: POST
    path: "/assessments/{id}/finalize"
    description: "Runs hydration verification and forks the assessment to VALIDATED or HYDRATION_FAILED."
    roles: [Assessor]
    code: 200
    input: []
    output: Assessment
    side_effects: ["VALIDATED arm: calculations.minimum_certified_weight, prior VALIDATED assessment -> SUPERSEDED, Wrestler figures repointed, certification_status UNCERTIFIED|SUSPENDED -> PROVISIONAL", "HYDRATION_FAILED arm: HealthFlag HYDRATION_FAIL severity 1 raised, no figures produced", "either arm: when appeal_id is set, Appeal RETEST_ORDERED -> RETEST_COMPLETED"]
  - method: GET
    path: "/assessments/{id}"
    description: "Reads one assessment including every derived body-composition figure."
    roles: [StateOffice, Assessor, TeamCoach, MedicalReviewer]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: GET
    path: "/assessments"
    description: "Filtered assessment list (FK reverse-reachability for Assessment.wrestler_id, assessor_id, retest_of_assessment_id and appeal_id)."
    roles: [StateOffice, Assessor, TeamCoach, MedicalReviewer]
    code: 200
    input: ["wrestler_id?", "assessor_id?", "retest_of_assessment_id?", "appeal_id?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  # ---------- Appeal ----------
  - method: POST
    path: "/assessments/{id}/appeals"
    description: "Files a coach appeal against a VALIDATED assessment inside the filing window."
    roles: [TeamCoach]
    code: 201
    input: [team_id, reason]
    output: Appeal
    side_effects: ["status=SUBMITTED, filed_at=logical clock, retest_round_count=0"]
  - method: GET
    path: "/appeals/{id}"
    description: "Reads one appeal including its retest round count."
    roles: [StateOffice, Assessor, TeamCoach]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/appeals"
    description: "Filtered appeal list (FK reverse-reachability for Appeal.assessment_id, team_id, reviewing_assessor_id and retest_assessment_id)."
    roles: [StateOffice, Assessor, TeamCoach]
    code: 200
    input: ["assessment_id?", "team_id?", "reviewing_assessor_id?", "retest_assessment_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/appeals/{id}/assign-reviewer"
    description: "Assigns a certified reviewing assessor who is not the original assessor."
    roles: [StateOffice]
    code: 200
    input: [reviewing_assessor_id]
    output: Appeal
    side_effects: ["Appeal SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/appeals/{id}/order-retest"
    description: "Reviewer orders a retest; bounded by Season.max_appeal_retest_rounds. Closes the RETEST_COMPLETED -> RETEST_ORDERED cycle."
    roles: [Assessor]
    code: 200
    input: []
    output: Appeal
    side_effects: ["Appeal UNDER_REVIEW|RETEST_COMPLETED -> RETEST_ORDERED", "increments retest_round_count"]
  - method: POST
    path: "/appeals/{id}/decide"
    description: "Reviewer upholds or denies the appeal. UPHELD launches the three-hop void/repoint/cancel cascade."
    roles: [Assessor]
    code: 200
    input: [outcome, decision_note]
    output: Appeal
    side_effects: ["UPHELD: contested Assessment VALIDATED -> VOIDED, Wrestler figures repointed at the retest, DescentPlan -> CANCELLED when target_class_lbs < the new min_weight_class_lbs, entries -> SCRATCHED", "DENIED: contested assessment and wrestler figures untouched"]

  # ---------- DescentPlan ----------
  - method: POST
    path: "/wrestlers/{id}/descent-plans"
    description: "Opens a DRAFT descent plan. Supersedes the wrestler's prior non-terminal plan. Guarded by OCC on Wrestler.version (concurrency_rules.descent-plan-create-stale-wrestler)."
    roles: [TeamCoach]
    code: 201
    input: [source_assessment_id, plan_variant, target_class_lbs, plan_start_date, expected_wrestler_version, "requested_weeks?"]
    output: DescentPlan
    side_effects: ["status=DRAFT, weekly_rate_pct copied from Season.max_weekly_descent_pct", "any prior DescentPlan of the wrestler with status IN {DRAFT, CERTIFIED, BREACHED} -> CANCELLED with cancel_reason='SUPERSEDED' and supersedes_plan_id set on the new plan", "when the superseded plan was CERTIFIED: Wrestler certification_status CERTIFIED -> PROVISIONAL, eligibility_status -> INELIGIBLE, Season.certified_wrestler_count decremented", "increments Wrestler.version by 1"]
  - method: GET
    path: "/descent-plans/{id}"
    description: "Reads one plan including total_weeks, breach_count and revision_count."
    roles: [StateOffice, Assessor, TeamCoach, MedicalReviewer]
    code: 200
    input: []
    output: DescentPlan
    side_effects: []
  - method: GET
    path: "/descent-plans"
    description: "Filtered plan list (FK reverse-reachability for DescentPlan.wrestler_id, source_assessment_id and supersedes_plan_id)."
    roles: [StateOffice, Assessor, TeamCoach, MedicalReviewer]
    code: 200
    input: ["wrestler_id?", "source_assessment_id?", "supersedes_plan_id?", "status?", "limit?", "offset?"]
    output: DescentPlan[]
    side_effects: []
  - method: POST
    path: "/descent-plans/{id}/certify"
    description: "Certifies the plan and generates the whole weekly progression schedule from the selected variant."
    roles: [StateOffice]
    code: 200
    input: []
    output: DescentPlan
    side_effects: ["calculations.descent_schedule_projection generates DescentMilestone rows week 0..total_weeks with status=SCHEDULED", "sets total_weeks, milestone_count, projected_certification_date and (LINEAR_RATE only) weekly_delta_lbs", "Wrestler certification_status PROVISIONAL -> CERTIFIED", "Wrestler eligibility_status INELIGIBLE -> ELIGIBLE, or -> RESTRICTED when the team is on PROBATION", "increments Season.certified_wrestler_count"]
  - method: POST
    path: "/descent-plans/{id}/revise"
    description: "Revises a BREACHED plan back to CERTIFIED with a new start date and optionally a new target or variant. Closes the CERTIFIED -> BREACHED -> CERTIFIED cycle."
    roles: [TeamCoach]
    code: 200
    input: [plan_start_date, "target_class_lbs?", "plan_variant?", "requested_weeks?"]
    output: DescentPlan
    side_effects: ["SCHEDULED milestones whose effective_date is strictly before the new plan_start_date become WAIVED; every other SCHEDULED milestone is deleted and the schedule is regenerated with week_index continuing at (highest retained week_index) + 1", "MET and MISSED milestones are preserved and missed_milestone_count is not reset", "increments revision_count"]
  - method: GET
    path: "/descent-plans/{id}/milestones"
    description: "Lists the plan's milestones in week_index ASC order (FK reverse-reachability for DescentMilestone.plan_id; the only discovery channel for cascade-created milestones)."
    roles: [StateOffice, Assessor, TeamCoach, MedicalReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DescentMilestone[]
    side_effects: []

  # ---------- Event ----------
  - method: POST
    path: "/seasons/{id}/events"
    description: "Schedules a competition with its competition window and weigh-in day configuration."
    roles: [StateOffice]
    code: 201
    input: [name, event_type, event_date, "competition_days?", "weigh_in_days?", "consecutive_day_allowance_lbs?"]
    output: Event
    side_effects: ["status=SCHEDULED, bracket_locked=false, reseed_required=false, seed_integrity_sum=0"]
  - method: GET
    path: "/events/{id}"
    description: "Reads one event including bracket_locked, reseed_required and the conserved seed_integrity_sum."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: GET
    path: "/events"
    description: "Filtered event list (FK reverse-reachability for Event.season_id)."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: POST
    path: "/events/{id}/status"
    description: "Drives the event lifecycle SCHEDULED -> WEIGH_IN_OPEN -> WEIGH_IN_CLOSED -> COMPLETED, or -> CANCELLED."
    roles: [StateOffice]
    code: 200
    input: [status]
    output: Event
    side_effects: ["WEIGH_IN_CLOSED: ENTERED entries -> SCRATCHED with 'NO_WEIGH_IN'; entries whose latest WeighIn result == FAIL -> SCRATCHED with 'WEIGH_IN_FAILED'", "CANCELLED: every ENTERED/WEIGHED_IN entry -> SCRATCHED with 'EVENT_CANCELLED'"]
  - method: POST
    path: "/events/{id}/seed"
    description: "Seeds (or reseeds) the bracket. Assigns 1..n inside each weight class by calculations.seed_assignment."
    roles: [StateOffice]
    code: 200
    input: []
    output: Event
    side_effects: ["WEIGHED_IN entries -> SEEDED with seed_number assigned", "sets bracket_locked=true, reseed_required=false, seeded_entry_count and seed_integrity_sum", "Event WEIGH_IN_CLOSED -> SEEDED, or SEEDED -> SEEDED on a reseed"]

  # ---------- TournamentEntry ----------
  - method: POST
    path: "/events/{id}/entries"
    description: "Enters a certified wrestler in a weight class after the certification-database check."
    roles: [TeamCoach]
    code: 201
    input: [wrestler_id, weight_class_lbs, "season_win_count?"]
    output: TournamentEntry
    side_effects: ["status=ENTERED, seed_number=null", "increments Event.entry_count", "runs calculations.lowest_eligible_class_at_date as the pre-competition certification check"]
  - method: GET
    path: "/entries/{id}"
    description: "Reads one entry including seed_number and latest_effective_weight_lbs."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: []
    output: TournamentEntry
    side_effects: []
  - method: GET
    path: "/entries"
    description: "Filtered entry list (FK reverse-reachability for TournamentEntry.event_id and wrestler_id)."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: ["event_id?", "wrestler_id?", "status?", "weight_class_lbs?", "limit?", "offset?"]
    output: TournamentEntry[]
    side_effects: []
  - method: POST
    path: "/entries/{id}/weight-class-change"
    description: "Moves an entry to another weight class and reseeds the vacated and destination groups. Guarded by OCC on TournamentEntry.version (concurrency_rules.entry-class-change-stale-entry)."
    roles: [StateOffice]
    code: 200
    input: [weight_class_lbs, expected_entry_version]
    output: TournamentEntry
    side_effects: ["sets weight_class_lbs, increments weight_class_change_count", "reseeds both affected (event_id, weight_class_lbs) groups to contiguous 1..n; Event.seed_integrity_sum is recomputed as the sum of n_c*(n_c+1)/2 over the occupied classes and is restored exactly by the reverse class change", "increments TournamentEntry.version and Event.version by 1"]

  # ---------- WeighIn ----------
  - method: POST
    path: "/events/{id}/weigh-ins"
    description: "Records an official weigh-in and computes the allowance, effective limit and result."
    roles: [WeighInOfficial, StateOffice]
    code: 201
    input: [entry_id, day_index, recorded_weight_lbs]
    output: WeighIn
    side_effects: ["calculations.weigh_in_allowance_and_result sets allowance_lbs, effective_limit_lbs, result and below_minimum", "PASS or PASS_WITH_ALLOWANCE: TournamentEntry ENTERED -> WEIGHED_IN and latest_effective_weight_lbs updated", "below_minimum: HealthFlag WEIGH_IN_DEFICIT severity 4 raised, Team ledger and compliance_status recomputed, ELIGIBLE wrestlers -> RESTRICTED on PROBATION"]
  - method: GET
    path: "/weigh-ins/{id}"
    description: "Reads one weigh-in including its allowance breakdown."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: []
    output: WeighIn
    side_effects: []
  - method: GET
    path: "/weigh-ins"
    description: "Filtered weigh-in list (FK reverse-reachability for WeighIn.event_id, wrestler_id and entry_id)."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: ["event_id?", "wrestler_id?", "entry_id?", "result?", "limit?", "offset?"]
    output: WeighIn[]
    side_effects: []

  # ---------- EligibilityCheck ----------
  - method: POST
    path: "/wrestlers/{id}/eligibility-checks"
    description: "Runs the certification-database check for a wrestler against an event date and class, and logs the verdict. Purely informational: it always returns 201 with an outcome (CLEARED or a BLOCKED_* value plus the blocking_error_id a real entry attempt would return) and never rejects on a business rule."
    roles: [StateOffice, TeamCoach, WeighInOfficial]
    code: 201
    input: [event_id, requested_class_lbs]
    output: EligibilityCheck
    side_effects: ["calculations.lowest_eligible_class_at_date populates growth_allowance_lbs, schedule_allowable_weight_lbs, lowest_eligible_class_lbs, outcome and blocking_error_id", "refreshes Wrestler.lowest_eligible_class_lbs"]
  - method: GET
    path: "/eligibility-checks/{id}"
    description: "Reads one logged certification-database check."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: []
    output: EligibilityCheck
    side_effects: []
  - method: GET
    path: "/eligibility-checks"
    description: "Filtered check list (FK reverse-reachability for EligibilityCheck.wrestler_id and event_id)."
    roles: [StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer]
    code: 200
    input: ["wrestler_id?", "event_id?", "outcome?", "limit?", "offset?"]
    output: EligibilityCheck[]
    side_effects: []

  # ---------- HealthFlag ----------
  - method: GET
    path: "/health-flags/{id}"
    description: "Reads one health flag."
    roles: [StateOffice, TeamCoach, MedicalReviewer]
    code: 200
    input: []
    output: HealthFlag
    side_effects: []
  - method: GET
    path: "/health-flags"
    description: "Filtered flag list (FK reverse-reachability for HealthFlag.wrestler_id and weigh_in_id; the only discovery channel for cascade-raised flags)."
    roles: [StateOffice, TeamCoach, MedicalReviewer, WeighInOfficial]
    code: 200
    input: ["wrestler_id?", "weigh_in_id?", "source?", "status?", "limit?", "offset?"]
    output: HealthFlag[]
    side_effects: []
  - method: POST
    path: "/health-flags/{id}/review"
    description: "Medical review of an open flag: REVIEWED, DISMISSED (compensating action that restores the severity ledger exactly) or ESCALATED (makes the wrestler disqualification-eligible)."
    roles: [MedicalReviewer]
    code: 200
    input: [outcome, review_note]
    output: HealthFlag
    side_effects: ["REVIEWED | DISMISSED: severity removed from Team.open_flag_severity_total, compliance_status recomputed, RESTRICTED wrestlers returned to ELIGIBLE when the team leaves PROBATION", "ESCALATED: severity stays in the ledger and the wrestler becomes disqualification-eligible"]

  # ---------- ProgramAudit ----------
  - method: POST
    path: "/seasons/{id}/audits"
    description: "Opens a program audit. ASSESSOR_SAMPLE audits carry remeasured samples for discrepancy scoring."
    roles: [StateOffice]
    code: 201
    input: [audit_type, scoring_variant, sample_window_start, "assessor_id?", "samples?"]
    output: ProgramAudit
    side_effects: ["status=OPEN, sample_count set from samples, discrepancy_score and outcome null until finalize"]
  - method: GET
    path: "/audits/{id}"
    description: "Reads one audit including its discrepancy score and void count."
    roles: [StateOffice, Assessor]
    code: 200
    input: []
    output: ProgramAudit
    side_effects: []
  - method: GET
    path: "/audits"
    description: "Filtered audit list (FK reverse-reachability for ProgramAudit.season_id and assessor_id)."
    roles: [StateOffice, Assessor]
    code: 200
    input: ["season_id?", "assessor_id?", "audit_type?", "outcome?", "limit?", "offset?"]
    output: ProgramAudit[]
    side_effects: []
  - method: POST
    path: "/audits/{id}/finalize"
    description: "Scores the audit with the selected variant and, on FAIL, launches the five-hop assessor-suspension cascade."
    roles: [StateOffice]
    code: 200
    input: []
    output: ProgramAudit
    side_effects: ["calculations.audit_discrepancy_score sets discrepancy_score and outcome", "FAIL hop 1: Assessor CERTIFIED -> SUSPENDED", "FAIL hop 2: the assessor's VALIDATED assessments dated on or after sample_window_start -> VOIDED (open appeals against them -> WITHDRAWN)", "FAIL hop 3: affected Wrestlers -> SUSPENDED with every certified figure cleared", "FAIL hop 4: their CERTIFIED DescentPlans -> CANCELLED", "FAIL hop 5: their non-terminal TournamentEntries -> SCRATCHED", "PASS or INCONCLUSIVE: no cascade at all"]

errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A TeamCoach acts on a wrestler, appeal, plan or entry outside their own team, or an Assessor finalizes an assessment whose assessor_id is not their X-User-ID"
  # --- existence ---
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "No Season with the referenced id"
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "No Team with the referenced id"
  - id: ERR_ASSESSOR_NOT_FOUND
    http: 404
    condition: "No Assessor with the referenced id"
  - id: ERR_WRESTLER_NOT_FOUND
    http: 404
    condition: "No Wrestler with the referenced id"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No Assessment with the referenced id (path id, source_assessment_id, retest_of_assessment_id or an audit sample's assessment_id)"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "No Appeal with the referenced id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No DescentPlan with the referenced id"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "No Event with the referenced id"
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "No TournamentEntry with the referenced id"
  - id: ERR_WEIGH_IN_NOT_FOUND
    http: 404
    condition: "No WeighIn with the referenced id"
  - id: ERR_ELIGIBILITY_CHECK_NOT_FOUND
    http: 404
    condition: "No EligibilityCheck with the referenced id"
  - id: ERR_HEALTH_FLAG_NOT_FOUND
    http: 404
    condition: "No HealthFlag with the referenced id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "No ProgramAudit with the referenced id"
  # --- schema / enum / range ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, enum outside its declared set, numeric field outside its declared range, or pagination limit/offset out of bounds"
  - id: ERR_INVALID_WEIGHT_CLASS
    http: 422
    condition: "A supplied weight_class_lbs, target_class_lbs or requested_class_lbs is not a member of Season.weight_classes"
  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_WRESTLER_VERSION
    http: 412
    condition: "expected_wrestler_version does not equal the stored Wrestler.version on POST /wrestlers/{id}/descent-plans"
  - id: ERR_STALE_ENTRY_VERSION
    http: 412
    condition: "expected_entry_version does not equal the stored TournamentEntry.version on POST /entries/{id}/weight-class-change"
  # --- state ---
  - id: ERR_SEASON_NOT_OPEN
    http: 409
    condition: "The owning Season is not in status OPEN for an operation that requires an open season"
  - id: ERR_SEASON_INVALID_STATE
    http: 409
    condition: "The requested Season status transition is not declared from the season's current status"
  - id: ERR_ASSESSOR_INVALID_STATE
    http: 409
    condition: "The requested Assessor transition is not declared from the assessor's current status (e.g. suspending an assessor who is PROVISIONAL, SUSPENDED or EXPIRED)"
  - id: ERR_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "Finalizing an Assessment that is not in status DRAFT (including a second finalize of the same assessment), or certifying a DescentPlan whose source Assessment is no longer VALIDATED"
  - id: ERR_APPEAL_INVALID_STATE
    http: 409
    condition: "The requested Appeal transition is not declared from the appeal's current status (assigning a reviewer twice, deciding from SUBMITTED, ordering a retest from a terminal status)"
  - id: ERR_PLAN_INVALID_STATE
    http: 409
    condition: "Certifying a DescentPlan that is not DRAFT, or revising a plan that is not BREACHED"
  - id: ERR_EVENT_INVALID_STATE
    http: 409
    condition: "The requested Event transition is not declared from the event's current status, including recording a weigh-in while the event is not WEIGH_IN_OPEN and seeding an event that is not WEIGH_IN_CLOSED or awaiting a reseed"
  - id: ERR_ENTRY_INVALID_STATE
    http: 409
    condition: "Weighing in or changing the class of an entry whose status is SCRATCHED or DISQUALIFIED"
  - id: ERR_HEALTH_FLAG_INVALID_STATE
    http: 409
    condition: "Reviewing a HealthFlag whose status is already REVIEWED or DISMISSED (only OPEN and ESCALATED flags are reviewable)"
  - id: ERR_AUDIT_INVALID_STATE
    http: 409
    condition: "Finalizing a ProgramAudit that is already FINALIZED"
  # --- safety / compliance ---
  - id: ERR_WRESTLER_DISQUALIFIED
    http: 409
    condition: "The wrestler's certification_status is DISQUALIFIED; every downstream write on that wrestler is frozen"
  - id: ERR_WRESTLER_NOT_CERTIFIED
    http: 409
    condition: "The wrestler has no VALIDATED source assessment on file (certification_status IN {UNCERTIFIED, SUSPENDED}) for an operation that requires certification"
  - id: ERR_UNHEALTHY_WEIGHT_MANAGEMENT
    http: 409
    condition: "The wrestler has a HealthFlag in status ESCALATED, blocking competition entry and class changes until a MedicalReviewer clears it"
  - id: ERR_CLASS_BELOW_CERTIFIED_MINIMUM
    http: 422
    condition: "The requested class is below the wrestler's lowest eligible class for that date after growth allowance and descent schedule are applied"
  - id: ERR_TARGET_BELOW_MINIMUM
    http: 422
    condition: "A descent plan's target_class_lbs is below the wrestler's min_weight_class_lbs"
  - id: ERR_NO_ELIGIBLE_WEIGHT_CLASS
    http: 422
    condition: "No member of Season.weight_classes satisfies the wrestler's eligibility floor — the wrestler's certified minimum exceeds every declared class"
  - id: ERR_DESCENT_RATE_EXCEEDED
    http: 422
    condition: "The weekly delta implied by requested_weeks exceeds round_half_up(alpha_weight_lbs * weekly_rate_pct / 100, 1); equality is accepted"
  - id: ERR_ESCALATED_FLAG_REQUIRED
    http: 409
    condition: "Disqualification was requested against a HealthFlag that is not in status ESCALATED"
  # --- referential / segregation of duties ---
  - id: ERR_ASSESSOR_NOT_CERTIFIED
    http: 409
    condition: "The referenced assessor's status is not CERTIFIED, including the credential-expiry auto-transition to EXPIRED evaluated at finalize"
  - id: ERR_METHOD_NOT_CERTIFIED
    http: 422
    condition: "The requested assessment method is not a member of the assessor's certified_methods"
  - id: ERR_SAME_ASSESSOR_CONFLICT
    http: 409
    condition: "The appeal reviewer or the appeal-ordered retest assessor is the same assessor who produced the contested assessment"
  - id: ERR_ASSESSMENT_WRESTLER_MISMATCH
    http: 422
    condition: "A referenced source_assessment_id or retest_of_assessment_id belongs to a different wrestler than the path wrestler, or a plan's source assessment is not VALIDATED"
  - id: ERR_AUDIT_SAMPLE_MISMATCH
    http: 422
    condition: "An audit sample references an Assessment whose assessor_id is not the audit's assessor_id"
  - id: ERR_TEAM_ON_PROBATION
    http: 409
    condition: "The wrestler's team is in compliance_status PROBATION, blocking new entries and new plans"
  # --- temporal ---
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 422
    condition: "The logical clock is past Assessment.assessed_at plus Season.appeal_filing_window_days; the boundary instant itself is still inside the window"
  - id: ERR_WEIGH_IN_DAY_OUT_OF_RANGE
    http: 422
    condition: "day_index is negative or greater than Event.weigh_in_days - 1"
  - id: ERR_ENTRY_WINDOW_CONFLICT
    http: 409
    condition: "The wrestler already has a non-SCRATCHED entry on an event whose half-open competition window overlaps this event's window; adjacency with a zero-day gap is accepted"
  # --- capacity / uniqueness / bracket ---
  - id: ERR_ASSESSOR_DAY_CAPACITY_EXCEEDED
    http: 409
    condition: "The assessor already has Season.assessor_daily_assessment_capacity non-VOIDED assessments on the UTC calendar day of assessed_at, counted across every wrestler and team"
  - id: ERR_DUPLICATE_ENTRY
    http: 409
    condition: "A non-SCRATCHED TournamentEntry already exists for this (event_id, wrestler_id)"
  - id: ERR_DUPLICATE_WEIGH_IN
    http: 409
    condition: "A WeighIn already exists for this (entry_id, day_index)"
  - id: ERR_GROWTH_ALLOWANCE_DATE_CONFLICT
    http: 409
    condition: "A GrowthAllowance already exists for this (season_id, effective_date)"
  - id: ERR_DUPLICATE_CREDENTIAL
    http: 409
    condition: "credential_number is already used by another Assessor"
  - id: ERR_DUPLICATE_SCHOOL_NAME
    http: 409
    condition: "school_name is already used by another Team in the same Season"
  - id: ERR_BRACKET_LOCKED
    http: 409
    condition: "A new TournamentEntry was requested on an Event whose bracket_locked flag is true (set by the first successful seeding); StateOffice weight-class changes and reseeds are exempt"
  - id: ERR_APPEAL_ROUND_LIMIT
    http: 409
    condition: "The appeal has already reached Season.max_appeal_retest_rounds retest rounds"
  - id: ERR_NO_SEEDABLE_ENTRIES
    http: 409
    condition: "The seeding pool is empty — no TournamentEntry of the event is in status WEIGHED_IN on the initial seeding run, or none is in status WEIGHED_IN or SEEDED on a reseed"
  - id: ERR_RESEED_REQUIRED
    http: 409
    condition: "An Event was asked to complete while reseed_required is true, or a Season was asked to close while an Event is WEIGH_IN_OPEN or SEEDED"

roles:
  - name: StateOffice
    description: "State athletic association staff: owns seasons, growth-allowance dates, assessor credentialing and suspension, plan certification, event lifecycle, seeding, bracket overrides, audits and disqualification."
    identity: "opaque"
    exclusive_operations:
      - "POST /seasons and POST /seasons/{id}/status"
      - "POST /seasons/{id}/growth-allowances"
      - "POST /_clock/set_current_utc"
      - "POST /assessors, POST /assessors/{id}/training-records, POST /assessors/{id}/suspension"
      - "POST /teams"
      - "POST /appeals/{id}/assign-reviewer"
      - "POST /descent-plans/{id}/certify"
      - "POST /seasons/{id}/events and POST /events/{id}/status"
      - "POST /events/{id}/seed"
      - "POST /entries/{id}/weight-class-change"
      - "POST /wrestlers/{id}/disqualification"
      - "POST /seasons/{id}/audits and POST /audits/{id}/finalize"
      - "POST /seasons/{id}/compliance-run"
    shared_operations:
      - "POST /teams/{id}/wrestlers (shared with TeamCoach)"
      - "POST /events/{id}/weigh-ins (shared with WeighInOfficial)"
      - "POST /wrestlers/{id}/eligibility-checks (shared with TeamCoach and WeighInOfficial)"
      - "every GET endpoint"
  - name: Assessor
    description: "Credentialed body-composition assessor: records and finalizes assessments, and when assigned as appeal reviewer orders retests and decides appeals. May never review an appeal against their own assessment."
    identity: "entity_backed:Assessor"
    exclusive_operations:
      - "POST /wrestlers/{id}/assessments"
      - "POST /assessments/{id}/finalize"
      - "POST /appeals/{id}/order-retest"
      - "POST /appeals/{id}/decide"
    shared_operations:
      - "GET /assessments, GET /assessments/{id}, GET /appeals, GET /appeals/{id}, GET /descent-plans, GET /descent-plans/{id}/milestones, GET /wrestlers, GET /audits"
  - name: TeamCoach
    description: "School coach: manages the roster, files appeals, opens and revises descent plans, and enters wrestlers in competitions. Confined to their own team by the ownership rule."
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST /assessments/{id}/appeals"
      - "POST /wrestlers/{id}/descent-plans"
      - "POST /descent-plans/{id}/revise"
      - "POST /events/{id}/entries"
    shared_operations:
      - "POST /teams/{id}/wrestlers (shared with StateOffice)"
      - "POST /wrestlers/{id}/eligibility-checks (shared with StateOffice and WeighInOfficial)"
      - "read access to their own team's wrestlers, assessments, appeals, plans, entries, weigh-ins and health flags"
  - name: WeighInOfficial
    description: "Event-day official who operates the scale. Records weigh-ins and runs pre-competition certification-database checks; holds no authority over certification, plans or brackets."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /events/{id}/weigh-ins (shared with StateOffice)"
      - "POST /wrestlers/{id}/eligibility-checks (shared with StateOffice and TeamCoach)"
      - "GET /events, GET /events/{id}, GET /entries, GET /weigh-ins, GET /wrestlers, GET /health-flags"
  - name: MedicalReviewer
    description: "Program physician who triages health flags. Escalation is theirs alone, but only StateOffice may disqualify — the segregation of duties at the heart of the health-and-safety workflow."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-flags/{id}/review"
    shared_operations:
      - "GET /health-flags, GET /health-flags/{id}, GET /wrestlers, GET /teams/{id}, GET /descent-plans, GET /descent-plans/{id}/milestones, GET /assessments"
