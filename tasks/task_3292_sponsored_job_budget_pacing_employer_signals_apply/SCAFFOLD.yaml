# =============================================================================
# PRD Benchmark Seed Tables — Sponsored Job Budget Pacing, Employer Signals &
# Apply Routing (Indeed)
# Task: task_3292_sponsored_job_budget_pacing_employer_signals_apply
# =============================================================================

scenario: |
  Sponsored Job Budget Pacing, Employer Signals & Apply Routing (Indeed): job
  posting ingestion from employer sites and applicant tracking systems with
  duplicate and expired posting detection, sponsored job auction with
  cost-per-application and cost-per-click models and budget pacing across a
  campaign, employer quality signals including response rate and disposition
  feedback affecting distribution, applicant apply routing through hosted
  applications or redirect to the employer with completion tracking, job seeker
  matching and alert delivery with relevance modeling, fraudulent and misleading
  job posting detection with account suspension, employer account billing,
  refunds for invalid clicks and campaign management tools, assessment and
  screening question integration

domain_name: sponsored-job-pacing
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation          # finite campaign budget competed for, reserved, committed, released
  secondary_archetype: pricing_engine          # CPC/CPA auction clearing with pacing multipliers and threshold gates
  complexity_layers:
    - optimistic_concurrency                   # Campaign OCC on `version` for hold/serve/refund writes
    - cascading_side_effects                   # click -> spend -> ledger debit -> campaign auto-complete / sponsored-job hold
    - dual_variant_calculation                 # pacing (scheduled vs realized) and auction (CPC vs CPA)
    - rate_threshold_triggers                   # budget thresholds (>=100% total, >=90% daily) and quality-signal tiers
    - derived_field_reconciliation              # campaign.spent_cents reconciled from the immutable BudgetLedger
    - selector_policy                          # sponsored placement selector and alert-match selector over candidate pools
  entity_topology: hybrid                      # flat FK graph between parties, with Employer -> Campaign -> SponsoredJob chains
  state_machine_shape: compound                # JobPosting.state derived from the newest JobPostingVersion.freshness
  role_model: peer_roles                       # Employer / JobSeeker peer ownership; opaque PlatformAdmin / TrustReviewer

  relationship_patterns:
    - one_to_many
    - cross_aggregate                          # SponsoredJob <- JobPosting; ApplyEvent <- Application

  consistency_model: immediate                 # every mutation incl. cascaded side effects visible in the same response

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered employer / company legal name" }
      - { name: domain, type: string, source: input, description: "Primary hiring domain; used for ATS feed keying" }
      - { name: ats_provider, type: enum, source: input, description: "ATS feed integration", constraints: "WORKDAY | GREENHOUSE | LEVER | TALEO | NONE" }
      - { name: status, type: enum, source: system, description: "Employer account lifecycle", constraints: "ACTIVE | SUSPENDED" }
      - { name: quality_score, type: integer, source: computed, description: "Employer quality signal 0..100 from employer_quality_signal; starts at 100" }
      - { name: response_rate_bps, type: integer, source: computed, description: "Dispositioned applications receiving an employer response, in basis points (0..10000)" }
      - { name: billing_status, type: enum, source: system, description: "Billing account posture", constraints: "CURRENT | FROZEN" }
      - { name: balance_cents, type: integer, source: computed, description: "Outstanding amount owed in cents; rises on BILLED SponsorEvent, falls on refund grant and invoice settlement (starts 0)" }
      - { name: last_invoice_at, type: datetime, source: system, description: "Timestamp of the most recent invoice settlement; null before the first settlement" }
      - { name: suspended_at, type: datetime, source: system, description: "Timestamp of the suspension that set status=SUSPENDED; null while ACTIVE" }
      - { name: suspension_reason, type: string, source: system, description: "Reason recorded with the most recent suspension; null while ACTIVE" }

  - name: JobSeeker
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Applicant email; unique across seekers" }
      - { name: full_name, type: string, source: input, description: "Applicant display name" }
      - { name: location, type: string, source: input, description: "Seeker home location used by the alert-match selector" }
      - { name: status, type: enum, source: system, description: "Seeker account state; ACTIVE for the lifetime of the account in this scaffold", constraints: "ACTIVE" }

  - name: Campaign
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; owning employer account" }
      - { name: name, type: string, source: input, description: "Campaign display name" }
      - { name: pricing_model, type: enum, source: input, description: "Billing model for every sponsored job in this campaign", constraints: "CPC | CPA" }
      - { name: daily_budget_cents, type: integer, source: input, description: "Maximum spend authorized in one logical day" }
      - { name: total_budget_cents, type: integer, source: input, description: "Maximum lifetime spend for the campaign" }
      - { name: status, type: enum, source: system, description: "Campaign lifecycle", constraints: "DRAFT | ACTIVE | PACING_HOLD | PAUSED | COMPLETED" }
      - { name: spent_cents, type: integer, source: computed, description: "Lifetime committed spend in cents, reconciled from BudgetLedger COMMIT debits (starts 0)" }
      - { name: daily_spent_cents, type: integer, source: computed, description: "Spend committed since the current logical day opened (00:00Z of the clock date); resets when the clock date advances" }
      - { name: held_cents, type: integer, source: computed, description: "Sum of ACTIVE pacing holds reserved against future spend (starts 0)" }
      - { name: day_open_date, type: datetime, source: system, description: "Logical day (00:00:00Z of the current clock date) that daily_spent_cents belongs to" }

  - name: SponsoredJob
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; owning campaign" }
      - { name: job_posting_id, type: string, source: system, description: "FK -> JobPosting.id; the posting being sponsored" }
      - { name: cpc_bid_cents, type: integer, source: input, description: "Cost-per-click bid; used when the campaign pricing_model is CPC" }
      - { name: cpa_bid_cents, type: integer, source: input, description: "Cost-per-application bid; used when the campaign pricing_model is CPA" }
      - { name: scheduled_pacing_multiplier, type: number, source: computed, description: "A-priori pacing multiplier in [0.0, 2.0] from campaign_pacing_multiplier; 1.0 until the campaign is ACTIVE" }
      - { name: realized_pacing_multiplier, type: number, source: computed, description: "Post-hoc pacing multiplier in [0.0, 2.0] from realized_pacing_multiplier, measured against expected spend so far" }
      - { name: status, type: enum, source: system, description: "Sponsored job lifecycle", constraints: "DRAFT | ELIGIBLE | PAUSED | BUDGET_HOLD" }
      - { name: impressions, type: integer, source: computed, description: "Count of sponsored impressions served (starts 0)" }
      - { name: clicks, type: integer, source: computed, description: "Count of billable CLICK events recorded (starts 0)" }
      - { name: applications, type: integer, source: computed, description: "Count of billable APPLICATION events recorded (starts 0)" }

  - name: JobPosting
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; the employer that posted the job" }
      - { name: title, type: string, source: input, description: "Job title as advertised" }
      - { name: location, type: string, source: input, description: "Free-text work location" }
      - { name: description_text, type: string, source: input, description: "Job description body; source for fraud keyword scanning" }
      - { name: state, type: enum, source: computed, description: "Distribution state derived from the newest JobPostingVersion.freshness", constraints: "DRAFT | ACTIVE | STALE | EXPIRED | SUSPENDED" }
      - { name: current_freshness, type: enum, source: computed, description: "Freshness of the newest JobPostingVersion", constraints: "FRESH | STALE | EXPIRED" }
      - { name: apply_mode, type: enum, source: input, description: "How applicants complete the application", constraints: "HOSTED | ATS_REDIRECT" }
      - { name: apply_redirect_url, type: string, source: input, description: "Destination URL used when apply_mode is ATS_REDIRECT; required in that mode" }
      - { name: posted_at, type: datetime, source: system, description: "Timestamp of the current JobPostingVersion; drives freshness expiry" }
      - { name: apply_started_count, type: integer, source: computed, description: "Applications that started an apply flow for this posting (starts 0)" }
      - { name: apply_completed_count, type: integer, source: computed, description: "Applications marked completed for this posting (starts 0)" }
      - { name: dedupe_key, type: string, source: computed, description: "casefold(title) + normalized(location) + external_posting_id; equality across feeds marks an ingestion as a duplicate" }

  - name: JobPostingVersion
    parent: JobPosting
    common_fields: true
    fields:
      - { name: job_posting_id, type: string, source: system, description: "FK -> JobPosting.id; the posting this snapshot belongs to" }
      - { name: content_hash, type: string, source: computed, description: "Hash of casefold(title) + description_text; repeated hashes within the 30-day window reveal duplicate ingestion" }
      - { name: external_posting_id, type: string, source: input, description: "Employer/ATS-side posting identifier" }
      - { name: ingested_at, type: datetime, source: system, description: "When this snapshot was ingested from the employer feed" }
      - { name: freshness, type: enum, source: computed, description: "FRESH while age < 30 days from ingested_at, STALE at 30..59 days, EXPIRED at >= 60 days (evaluated against the logical clock)" }

  - name: Assessment
    parent: JobPosting
    common_fields: true
    fields:
      - { name: job_posting_id, type: string, source: system, description: "FK -> JobPosting.id; the posting this screening belongs to" }
      - { name: questions, type: array, source: input, description: "Ordered screening questions; each item is { prompt: string, kind: BOOLEAN | SINGLE_CHOICE | NUMERIC, required: boolean }" }
      - { name: pass_threshold, type: integer, source: input, description: "Minimum number of correctly answered required questions to pass" }
      - { name: status, type: enum, source: system, description: "Assessment state; PUBLISHED for the lifetime of the assessment in this scaffold", constraints: "PUBLISHED" }

  - name: Application
    parent: JobPosting
    common_fields: true
    fields:
      - { name: job_posting_id, type: string, source: system, description: "FK -> JobPosting.id; the posting applied to" }
      - { name: job_seeker_id, type: string, source: system, description: "FK -> JobSeeker.id; the applicant" }
      - { name: status, type: enum, source: system, description: "Apply-flow lifecycle", constraints: "STARTED | COMPLETED | RESPONDED | CLOSED" }
      - { name: started_at, type: datetime, source: system, description: "When the apply flow began" }
      - { name: completed_at, type: datetime, source: system, description: "When the apply flow reached completion tracking; null until COMPLETED" }
      - { name: disposition, type: enum, source: input, description: "Employer disposition feedback dimension, evolves independently of status", constraints: "NONE | REVIEWED | INTERVIEW | REJECTED | HIRED" }
      - { name: responded_at, type: datetime, source: system, description: "First employer response timestamp; null until a responding disposition is recorded" }
      - { name: assessment_id, type: string, source: input, description: "Associated Assessment id captured at apply time (null when none)" }
      - { name: assessment_score, type: integer, source: computed, description: "Number of correctly answered required questions; null when no assessment attached" }

  - name: ApplyEvent
    parent: Application
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; the application this event belongs to" }
      - { name: kind, type: enum, source: system, description: "Kind of apply-routing event", constraints: "STARTED | COMPLETED | INVALID_CLICK" }
      - { name: source, type: enum, source: system, description: "Channel that produced the event", constraints: "HOSTED | REDIRECT | PIXEL" }
      - { name: occurred_at, type: datetime, source: system, description: "Event timestamp, from the logical clock at emission" }

  - name: JobAlertSubscription
    parent: JobSeeker
    common_fields: true
    fields:
      - { name: job_seeker_id, type: string, source: system, description: "FK -> JobSeeker.id; the subscribing seeker" }
      - { name: keywords, type: string, source: input, description: "Comma-separated keyword filter matched case-insensitively against posting title" }
      - { name: location, type: string, source: input, description: "Location filter matched case-insensitively against posting location" }
      - { name: status, type: enum, source: system, description: "Subscription state; ACTIVE for the lifetime of the subscription in this scaffold", constraints: "ACTIVE" }
      - { name: last_notified_at, type: datetime, source: system, description: "Timestamp of the most recent alert delivery; null until a delivery occurs" }
      - { name: notified_posting_ids, type: array, source: system, description: "Ids of postings already delivered through this subscription (dedupe set)" }

  - name: SponsorEvent
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; the campaign that was charged" }
      - { name: sponsored_job_id, type: string, source: system, description: "Associated SponsoredJob id that served the placement (resolvable through the serving campaign's sponsored jobs; not a declared foreign key)" }
      - { name: event_type, type: enum, source: system, description: "Billed or non-billed sponsored event", constraints: "IMPRESSION | CLICK | APPLICATION" }
      - { name: billable, type: boolean, source: computed, description: "True when the event clears into a billed charge (CPC bills CLICK, CPA bills APPLICATION)" }
      - { name: cost_cents, type: integer, source: computed, description: "Cleared cost in cents from auction_clearing_price; 0 while not billable" }
      - { name: status, type: enum, source: system, description: "Clearing lifecycle", constraints: "RECORDED | BILLED | REFUNDED" }
      - { name: occurred_at, type: datetime, source: system, description: "Timestamp the sponsored event occurred, stamped from the logical clock; anchors the 24-hour refund window" }
      - { name: device_fingerprint, type: string, source: system, description: "Opaque device identifier attached to the event; equality within the invalid-click window marks a duplicate" }
      - { name: ip_hash, type: string, source: system, description: "Opaque hashed IP attached to the event; equality within the invalid-click window marks a duplicate" }

  - name: BudgetLedger
    parent: Campaign
    common_fields: false
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; the campaign whose budget this entry mutates" }
      - { name: entry_type, type: enum, source: system, description: "Append-only budget mutation kind", constraints: "HOLD | COMMIT | RELEASE | REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents applied to the campaign balance (positive debits, negative credits)" }
      - { name: sponsor_event_id, type: string, source: system, description: "Associated SponsorEvent id that produced this entry (null for ADJUST entries)" }
      - { name: reference_code, type: string, source: system, description: "Human-readable ledger reference, e.g. CMT-<seq> / RFD-<seq> / REV-<seq> / HLD-<seq>" }

  - name: PacingHold
    parent: SponsoredJob
    common_fields: true
    fields:
      - { name: sponsored_job_id, type: string, source: system, description: "FK -> SponsoredJob.id; the sponsored job reserving budget" }
      - { name: campaign_id, type: string, source: system, description: "Associated Campaign id whose budget is reserved (resolvable via sponsored_job.campaign_id)" }
      - { name: amount_cents, type: integer, source: input, description: "Reserved cents for this hold; at least the campaign's minimum hold unit" }
      - { name: status, type: enum, source: system, description: "Pacing hold lifecycle", constraints: "ACTIVE | COMMITTED | RELEASED" }
      - { name: sponsor_event_id, type: string, source: system, description: "Associated SponsorEvent id filled when the hold commits (null until COMMITTED)" }

# continued below (state machines, calculations, validations, endpoints, errors, roles)
# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:

  - entity: Employer
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /employers/{id}/suspend (fraud review) or system when billing_status becomes FROZEN"
        actor: TrustReviewer | system
        preconditions:
          - "employer.status == ACTIVE"
        side_effects:
          - "Every SponsoredJob whose campaign belongs to this employer moves status -> PAUSED (one hop, from Employer to SponsoredJob)"
          - "Every JobPosting whose employer_id == employer.id moves state -> SUSPENDED"
          - "Every Campaign whose employer_id == employer.id moves status -> PAUSED"
          - "updated_at refreshed on Employer, every affected SponsoredJob, JobPosting and Campaign"
        note: "Suspension chain hop 1: Employer -> SponsoredJob (sponsored jobs stop serving)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /employers/{id}/reinstate (fraud review cleared)"
        actor: TrustReviewer
        preconditions:
          - "employer.status == SUSPENDED"
        side_effects:
          - "Every SponsoredJob paused by the suspension stays PAUSED until an explicit resume"
          - "JobPosting state is re-derived from current_freshness; postings whose newest version is EXPIRED become EXPIRED, otherwise ACTIVE"
          - "updated_at refreshed on Employer and every re-derived JobPosting"

  - entity: JobPosting
    field: state
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /job-postings/{id}/versions (first ingestion) or POST /employers/{id}/job-postings"
        actor: Employer
        preconditions:
          - "posting has at least one JobPostingVersion"
        side_effects:
          - "state re-derived = ACTIVE when current_freshness == FRESH"
      - from: ACTIVE
        to: STALE
        trigger: "system re-derivation when a JobPostingVersion advances the posting to STALE freshness"
        actor: system
        preconditions:
          - "job_posting.current_freshness == STALE"
        side_effects:
          - "posting is excluded from the sponsored placement candidate set"
      - from: STALE
        to: EXPIRED
        trigger: "system re-derivation when a JobPostingVersion advances the posting to EXPIRED freshness"
        actor: system
        preconditions:
          - "job_posting.current_freshness == EXPIRED"
        side_effects:
          - "posting is terminal for distribution; every SponsoredJob sponsoring it moves status -> PAUSED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system re-derivation when the current JobPostingVersion is EXPIRED"
        actor: system
        preconditions:
          - "job_posting.current_freshness == EXPIRED"
        side_effects:
          - "every SponsoredJob sponsoring it moves status -> PAUSED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /job-postings/{id}/suspend (fraud review) or Employer suspension cascade"
        actor: TrustReviewer | system
        preconditions:
          - "job_posting.state IN {DRAFT, ACTIVE, STALE}"
        side_effects:
          - "every SponsoredJob sponsoring it moves status -> PAUSED"
        note: "Reachable from DRAFT/ACTIVE/STALE; listed once from ACTIVE and once from STALE for completeness of the guard."
      - from: STALE
        to: SUSPENDED
        trigger: "POST /job-postings/{id}/suspend (fraud review) or Employer suspension cascade"
        actor: TrustReviewer | system
        preconditions:
          - "job_posting.state == STALE"
        side_effects:
          - "every SponsoredJob sponsoring it moves status -> PAUSED"
  - entity: SponsoredJob
    field: status
    initial_state: ELIGIBLE
    terminal_states: []
    transitions:
      - from: ELIGIBLE
        to: BUDGET_HOLD
        trigger: "system when the campaign's remaining daily budget (daily_budget_cents - daily_spent_cents - held_cents) < 1000"
        actor: system
        preconditions:
          - "remaining_daily_cents < 1000"
        side_effects:
          - "sponsored job leaves the candidate set and stops being selected, but its SponsoredJob.status stays non-terminal"
      - from: BUDGET_HOLD
        to: ELIGIBLE
        trigger: "system when the logical day advances (day rollover) or a REFUND restores remaining_daily_cents >= 1000"
        actor: system
        preconditions:
          - "remaining_daily_cents >= 1000"
        side_effects:
          - "sponsored job re-enters the sponsored placement candidate set"
      - from: ELIGIBLE
        to: PAUSED
        trigger: "JobPosting suspension/expiry cascade, Campaign pause cascade, or Employer suspension cascade"
        actor: system
        preconditions:
          - "sponsored_job.status IN {ELIGIBLE, BUDGET_HOLD}"
        side_effects:
          - "any ACTIVE PacingHold on this sponsored job moves status -> RELEASED (cascade hop)"
      - from: PAUSED
        to: ELIGIBLE
        trigger: "POST /sponsored-jobs/{id}/resume"
        actor: Employer
        preconditions:
          - "campaign.status == ACTIVE"
          - "the sponsored job's JobPosting.state == ACTIVE"
          - "campaign employer not SUSPENDED"
        side_effects:
          - "sponsored job re-enters the sponsored placement candidate set"

  - entity: Campaign
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /campaigns/{id}/activate"
        actor: Employer
        preconditions:
          - "employer.status == ACTIVE"
        side_effects:
          - "spent_cents copied forward from the BudgetLedger COMMIT sum (0 for a new campaign)"
      - from: ACTIVE
        to: PACING_HOLD
        trigger: "system when daily_spent_cents >= daily_budget_cents (daily budget fully spent)"
        actor: system
        preconditions:
          - "campaign.daily_spent_cents >= campaign.daily_budget_cents"
        side_effects:
          - "every SponsoredJob in this campaign with status ELIGIBLE moves to BUDGET_HOLD"
      - from: PACING_HOLD
        to: ACTIVE
        trigger: "system on logical day rollover (day_open_date < current logical day)"
        actor: system
        preconditions:
          - "campaign.day_open_date < current logical day (00:00Z)"
        side_effects:
          - "daily_spent_cents reset to 0; day_open_date advanced to the current logical day"
          - "every BUDGET_HOLD SponsoredJob re-derived (ELIGIBLE when posting ACTIVE, else stays PAUSED)"
      - from: PACING_HOLD
        to: COMPLETED
        trigger: "system when a committed spend makes spent_cents >= total_budget_cents"
        actor: system
        preconditions:
          - "campaign.spent_cents >= campaign.total_budget_cents"
        side_effects:
          - "every SponsoredJob in this campaign moves status -> PAUSED"
          - "every ACTIVE PacingHold in this campaign moves status -> RELEASED"
          - "campaign becomes terminal for spend; further HOLDs are rejected"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system when a committed spend makes spent_cents >= total_budget_cents in the same request that reached the total"
        actor: system
        preconditions:
          - "campaign.spent_cents >= campaign.total_budget_cents"
        side_effects:
          - "every SponsoredJob in this campaign moves status -> PAUSED"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /campaigns/{id}/pause"
        actor: Employer
        preconditions:
          - "campaign.status IN {ACTIVE, PACING_HOLD}"
        side_effects:
          - "every ELIGIBLE SponsoredJob moves to PAUSED"
      - from: PACING_HOLD
        to: PAUSED
        trigger: "POST /campaigns/{id}/pause"
        actor: Employer
        preconditions:
          - "campaign.status IN {ACTIVE, PACING_HOLD}"
        side_effects:
          - "every ELIGIBLE SponsoredJob moves to PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /campaigns/{id}/resume"
        actor: Employer
        preconditions:
          - "campaign.status == PAUSED"
          - "campaign.spent_cents < campaign.total_budget_cents"
          - "employer.status == ACTIVE"
        side_effects:
          - "every PAUSED SponsoredJob moves back to ELIGIBLE when its posting state == ACTIVE"

  - entity: Application
    field: status
    initial_state: STARTED
    terminal_states: [CLOSED]
    transitions:
      - from: STARTED
        to: COMPLETED
        trigger: "POST /applications/{id}/complete (hosted submit or ATS completion pixel)"
        actor: JobSeeker | system
        preconditions:
          - "application.status == STARTED"
          - "when the posting has a PUBLISHED Assessment with pass_threshold > 0, the submitted assessment_score >= pass_threshold"
        side_effects:
          - "completed_at stamped from the logical clock"
          - "JobPosting.apply_completed_count += 1"
          - "an ApplyEvent kind=COMPLETED is appended (source = HOSTED when apply_mode HOSTED, else REDIRECT)"
          - "when the posting is sponsored by an ELIGIBLE SponsoredJob on a CPC or CPA campaign: a SponsorEvent event_type=APPLICATION is recorded; for a CPA campaign it is billable and its committed cost flows through the click/commit cascade"
      - from: STARTED
        to: CLOSED
        trigger: "POST /applications/{id}/close (abandoned apply flow)"
        actor: JobSeeker
        preconditions:
          - "application.status == STARTED"
        side_effects:
          - "JobPosting.apply_started_count is not decremented; the abandoned start remains counted"
      - from: COMPLETED
        to: RESPONDED
        trigger: "POST /applications/{id}/disposition (employer feedback)"
        actor: Employer
        preconditions:
          - "application.status == COMPLETED"
          - "disposition IN {REVIEWED, INTERVIEW, REJECTED, HIRED}"
        side_effects:
          - "responded_at stamped from the logical clock on the first responding disposition"
          - "Employer.response_rate_bps recomputed by employer_quality_signal (response-rate half)"
          - "Employer.quality_score recomputed by employer_quality_signal (tier + delta)"
          - "every SponsoredJob of that employer recomputes pacing_multiplier and its candidate-set relative priority"
        note: "Cross-entity state dependency: the Application transition is allowed regardless of the Employer status, but the quality recompute only fires while employer.status == ACTIVE."
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /applications/{id}/close (employer closes an answered application)"
        actor: Employer
        preconditions:
          - "application.status == RESPONDED"
        side_effects:
          - "terminal; no further disposition is accepted"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /applications/{id}/close (employer closes without responding)"
        actor: Employer
        preconditions:
          - "application.status == COMPLETED"
        side_effects:
          - "disposition stays NONE; responded_at stays null; the non-response counts against response_rate_bps"

# =============================================================================
# Concurrency Rules (see §1.2.1). OCC on Campaign.version is the sole mechanism.
# =============================================================================
concurrency_rules:
  - rule_id: campaign-serve-stale-version
    parent_entity: Campaign
    write_endpoint: "POST /api/events"
    occ_field: "expected_campaign_version"
    description: |
      Recording a billed sponsored event against a Campaign whose version has
      advanced since the client last observed it is rejected with 412. This
      captures the case where an intervening committed spend (which legitimately
      changes the campaign's day/spend posture) has already moved the campaign
      forward, so the current writer's view of the campaign is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: campaign-refund-stale-version
    parent_entity: Campaign
    write_endpoint: "POST /api/events/{id}/refund"
    occ_field: "expected_campaign_version"
    description: |
      Requesting a refund against a Campaign whose version has advanced since
      the reviewer last observed it is rejected with 412. A refund is only a
      compensation of a still-unrefunded billed event, so a stale campaign view
      (one where a second billable event has since committed) cannot be trusted
      to compute the corrective ledger entry.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:

  - name: campaign_pacing_multiplier
    trigger: "GET /sponsored-jobs/{id}/summary and the sponsored placement selector"
    algorithm: threshold
    formula: |
      # Scheduled (a-priori) pacing for one logical day. All cents are integers;
      # the multiplier is a rounded ratio and is clamped into [0.0, 2.0].
      elapsed_fraction = clamp((clock_now - day_open_date) / 86400 seconds, 0.0, 1.0)
      if elapsed_fraction < 0.05:            # first ~72 minutes of the logical day
          return 1.0                         # warm-up: never front-load
      target_fraction = elapsed_fraction
      actual_fraction = daily_spent_cents / daily_budget_cents
      if actual_fraction <= target_fraction:
          raw = 1.0 + (target_fraction - actual_fraction)
      else:
          raw = 1.0 - (actual_fraction - target_fraction)
      return round(clamp(raw, 0.0, 2.0), 3)
    input_set: "campaigns with status ACTIVE or PACING_HOLD whose day_open_date equals the current logical day"
    constants:
      WARMUP_FRACTION: 0.05
      MIN_MULTIPLIER: 0.0
      MAX_MULTIPLIER: 2.0
      DAY_SECONDS: 86400
    precision: "3 decimal places, round_half_up"
    variants:
      - name: scheduled
        when: "daily_spent_cents < daily_budget_cents (the day is not yet exhausted)"
        difference: "Drives the multiplier directly from the a-priori elapsed-time target."
      - name: realized
        when: "daily_spent_cents >= daily_budget_cents (the day is exhausted)"
        difference: "Returns 1.0 exactly, ignoring elapsed time, because the remaining day has no budget to pace."

  - name: realized_pacing_multiplier
    trigger: "sponsored placement selector; recomputed on every committed spend and day rollover"
    algorithm: aggregation
    formula: |
      # Realized (post-hoc) pacing actually delivered during the open logical day.
      # Denominator is the expected spend under a perfectly even schedule elapsed so far.
      # When elapsed_fraction rounds to 0, the multiplier is 1.0 by convention.
      elapsed_fraction = clamp((clock_now - day_open_date) / 86400 seconds, 0.0, 1.0)
      expected_spend = floor(daily_budget_cents * elapsed_fraction)
      if expected_spend == 0:
          return 1.0
      return round(clamp(daily_spent_cents / expected_spend, 0.0, 2.0), 3)
    input_set: "campaigns with status ACTIVE, PACING_HOLD or COMPLETED whose day_open_date equals the current logical day"
    constants:
      MIN_MULTIPLIER: 0.0
      MAX_MULTIPLIER: 2.0
      DAY_SECONDS: 86400
    precision: "3 decimal places, round_half_up"
    variants:
      - name: scheduled
        when: "prospective: used by campaign_pacing_multiplier before spend is committed"
        difference: "Projects forward from a time target rather than measuring delivered spend."
      - name: realized
        when: "retrospective: measured against expected spend so far"
        difference: "For identical spend data the two multipliers differ (scheduled advances toward 2.0 when behind pace; realized is below 1.0 when behind pace)."

  - name: auction_clearing_price
    trigger: "POST /events (billed CLICK or APPLICATION) and GET /sponsored-jobs/{id}/bid-quote"
    algorithm: tiered_pricing
    formula: |
      # Generalized second-price (GSP) with a quality tilt. Bids are per the
      # campaign pricing_model: CPC bids on cpc_bid_cents, CPA bids on cpa_bid_cents.
      # Ranking expression (pinned): rank = effective_bid * (quality_score / 100)
      # where effective_bid = bidding_job_bid * bidding_job.scheduled_pacing_multiplier.
      candidates = every SponsoredJob with status ELIGIBLE whose JobPosting.state == ACTIVE
      # order candidates by (rank DESC, cpc_bid_cents DESC, created_at ASC); the
      # first two keys can tie, so created_at ASC is the explicit final tie-break.
      if len(candidates) < 2:
          return bidder_bid_cents            # first-price when unopposed
      second = rank of the runner-up candidate
      bidder_quality = bidding_job_employer.quality_score
      raw = (second / bidder_quality) * 100 + 1
      return min(max(ceil(raw), 1), bidder_bid_cents)
    input_set: "SponsoredJob rows with status ELIGIBLE whose posting is ACTIVE, within campaigns whose status is ACTIVE"
    constants:
      MIN_INCREMENT_CENTS: 1
      QUALITY_SCALE: 100
    precision: "integer cents, ceiling"
    variants:
      - name: cpc_model
        when: "campaign.pricing_model == CPC"
        difference: "Clears on cpc_bid_cents and bills one charge per CLICK event."
      - name: cpa_model
        when: "campaign.pricing_model == CPA"
        difference: "Clears on cpa_bid_cents and bills one charge per APPLICATION event; CLICK events are recorded but not billable."

  - name: employer_quality_signal
    trigger: "every responding or closing disposition on an Application of this employer"
    algorithm: weighted_scoring
    formula: |
      # Two components, both over the employer's dispositioned applications only.
      dispositioned = applications of this employer whose disposition != NONE
                      OR whose status == CLOSED while disposition == NONE
      responding = dispositioned whose disposition IN {REVIEWED, INTERVIEW, REJECTED, HIRED}
      response_rate_bps = floor(10000 * len(responding) / len(dispositioned))   # 0 when len(dispositioned) == 0
      # Base tier from the response rate (the boundary is inclusive at 50%).
      if response_rate_bps >= 6000:
          tier = 100
      elif response_rate_bps >= 3000:
          tier = 70
      else:
          tier = 40
      # Disposition mix delta, evaluated on the CLOSED+RSP dispositions only.
      hired = count(disposition == HIRED)
      interviewed = count(disposition == INTERVIEW)
      rejected = count(disposition == REJECTED)
      delta = round_to_int((30 * hired) / max(len(dispositioned), 1)
                           + (10 * interviewed) / max(len(dispositioned), 1)
                           - (10 * rejected) / max(len(dispositioned), 1))
      return clamp(tier + delta, 0, 100)
    input_set: "the employer's applications with status in {COMPLETED, RESPONDED, CLOSED}"
    constants:
      HIRE_WEIGHT_BP: 3000
      INTERVIEW_WEIGHT_BP: 1000
      REJECT_WEIGHT_BP: 1000
      TIER_HIGH_MIN_BPS: 6000
      TIER_MID_MIN_BPS: 3000
      TIER_HIGH: 100
      TIER_MID: 70
      TIER_LOW: 40
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "integer, round_half_up"
    variants:
      - name: response_rate_only
        when: "the employer has only non-responding dispositions so far"
        difference: "score = tier only (delta is 0), so a 3-of-4 response history scores lower than the same count with one HIRED."
      - name: tier_plus_mix
        when: "at least one disposition is INTERVIEW or HIRED"
        difference: "adds the disposition-mix delta on top of the tier, so identical response rates diverge by hire/interview mix."

  - name: relevance_score
    trigger: "GET /job-postings/{id}/matches and the alert-match selector"
    algorithm: weighted_scoring
    formula: |
      # Search relevance of one JobPosting for one JobSeeker.
      # Exact-token keyword match (case-insensitive, whitespace-split, deduped).
      keyword_score = 40 if keywords_match == FULL else (20 if keywords_match == PARTIAL else 0)
      location_score = 35 if location_match == EXACT else (15 if location_match == SAME_PREFIX else 0)
      freshness_score = 25 if current_freshness == FRESH else (10 if current_freshness == STALE else 0)
      return keyword_score + location_score + freshness_score
    input_set: "JobPosting rows with state in {ACTIVE, STALE}; expired and suspended postings are excluded"
    constants:
      KEYWORD_FULL: 40
      KEYWORD_PARTIAL: 20
      LOCATION_EXACT: 35
      LOCATION_PREFIX: 15
      FRESHNESS_FRESH: 25
      FRESHNESS_STALE: 10
    precision: "integer"
    variants:
      - name: unmapped
        when: "the seeker supplies no location"
        difference: "location_score is 0 and the maximum attainable relevance is 65."
      - name: mapped
        when: "the seeker supplies a location"
        difference: "location_score can add up to 35, so two postings identical on keywords diverge by location."

  - name: budget_commit_split
    trigger: "POST /events clearing a billable SponsorEvent"
    algorithm: waterfall_allocation
    formula: |
      # Split the cleared cost across the campaign's committed and outstanding holders.
      # Evaluation order is pinned: (1) fill ACTIVE PacingHold amounts oldest-first
      # (created_at ASC, id never used); (2) any remainder is a direct COMMIT against
      # the campaign with no hold.
      cleared = auction_clearing_price
      remaining = cleared
      for hold in ACTIVE PacingHold of this campaign ordered by created_at ASC:
          take = min(hold.amount_cents, remaining)
          if take == hold.amount_cents:
              hold.status = COMMITTED
          else:
              hold.amount_cents = hold.amount_cents - take
          remaining = remaining - take
          if remaining == 0: break
      # Append ledger entries: one COMMIT per fully/partially consumed hold plus a
      # final COMMIT for `remaining` when > 0. Campaign.spent_cents += cleared exactly.
      return cleared
    input_set: "ACTIVE PacingHold rows of the event's campaign; COMMITTED and RELEASED holds are skipped"
    constants:
      NONE: 0
    precision: "integer cents"
    variants:
      - name: hold_backed
        when: "at least one ACTIVE PacingHold exists"
        difference: "the charge consumes reserved holds before touching unreserved budget."
      - name: unreserved
        when: "no ACTIVE PacingHold exists"
        difference: "the entire charge is a single direct COMMIT with no hold release."

  - name: total_budget_invariant
    trigger: "recomputed after every HOLD, COMMIT, RELEASE, REFUND and ADJUST ledger entry"
    algorithm: aggregation
    formula: |
      # The conserved quantity. Evaluated from the immutable BudgetLedger only.
      net_committed = sum(entry.amount_cents for entry in BudgetLedger where entry.entry_type == COMMIT)
                    + sum(entry.amount_cents for entry in BudgetLedger where entry.entry_type == REFUND)
      # REFUND entries are negative; ADJUST entries are excluded from this invariant.
      campaign.spent_cents == net_committed
      # and, independently:
      campaign.held_cents == sum(hold.amount_cents for hold in PacingHold
                                 where hold.campaign_id == campaign.id and hold.status == ACTIVE)
    input_set: "all BudgetLedger entries of the campaign, append-only"
    constants:
      NONE: 0
    precision: "integer cents"
    variants:
      - name: after_hold
        when: "evaluated immediately after a HOLD entry"
        difference: "spent_cents is unchanged and held_cents rises by the hold amount."
      - name: after_commit
        when: "evaluated immediately after a COMMIT entry"
        difference: "spent_cents rises by the committed amount and held_cents falls by any consumed hold."

  - name: posting_freshness
    trigger: "GET /_clock/advance_day and every POST /job-postings/{id}/versions ingestion"
    algorithm: decay_function
    formula: |
      age_days = floor((clock_now - newest_version.ingested_at) / 86400 seconds)
      if age_days < 30:   freshness = FRESH
      elif age_days < 60: freshness = STALE
      else:               freshness = EXPIRED
      # JobPosting.current_freshness = freshness of its newest version by ingested_at;
      # ties on ingested_at break by created_at DESC. JobPosting.state is then re-derived:
      #   SUSPENDED (sticky, if already SUSPENDED) > EXPIRED > STALE > ACTIVE (DRAFT only before a first version).
    input_set: "the newest JobPostingVersion of every posting, keyed by ingested_at"
    constants:
      STALE_AFTER_DAYS: 30
      EXPIRED_AFTER_DAYS: 60
      DAY_SECONDS: 86400
    precision: "integer days"
    variants:
      - name: fresh
        when: "age_days < 30"
        difference: "posting remains ACTIVE and eligible for sponsored placement."
      - name: expired
        when: "age_days >= 60"
        difference: "posting becomes EXPIRED and every SponsoredJob sponsoring it is paused."

# continued below (validations, endpoints, errors, roles)

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed; the role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role is permitted for the operation, and for entity_backed roles X-User-ID equals the owner recorded on the target resource"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path or payload resolves to an existing row (validated left-to-right along the path)"
    error_id: "ERR_EMPLOYER_NOT_FOUND | ERR_JOB_SEEKER_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_SPONSORED_JOB_NOT_FOUND | ERR_JOB_POSTING_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_SPONSOR_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path params

  - priority: 4
    category: state
    check: "The target resource is in a state that permits the requested lifecycle action (campaign, sponsored job, posting, application, assessment, employer)"
    error_id: "ERR_CAMPAIGN_NOT_ACTIVE | ERR_CAMPAIGN_TERMINAL | ERR_SPONSORED_JOB_NOT_ELIGIBLE | ERR_POSTING_NOT_ACTIVE | ERR_INVALID_APPLICATION_STATE | ERR_APPLICATION_ALREADY_TERMINAL | ERR_EMPLOYER_NOT_SUSPENDED | ERR_INVALID_STATE_TRANSITION"
    http_status: 409
    applies_to: all state transition endpoints

  - priority: 5
    category: business_safety
    check: "Fraud / trust safety: the acting employer is not SUSPENDED, and the submitted posting content carries no fraud keyword from the misleading-posting list"
    error_id: "ERR_EMPLOYER_SUSPENDED | ERR_FRAUD_KEYWORDS_DETECTED"
    http_status: 409
    applies_to: ["POST /api/job-postings", "POST /api/job-postings/{id}/versions", "POST /api/campaigns", "POST /api/sponsored-jobs", "POST /api/events", "POST /api/campaigns/{id}/resume", "POST /api/sponsored-jobs/{id}/resume"]

  - priority: 6
    category: business_constraint
    check: "Ingestion dedupe, apply-mode / redirect-url coherence, assessment shape and screening threshold"
    error_id: "ERR_DUPLICATE_INGESTION | ERR_INVALID_REDIRECT_URL | ERR_UNSUPPORTED_ASSESSMENT_QUESTIONS | ERR_ASSESSMENT_SCORE_BELOW_THRESHOLD | ERR_BID_BELOW_MINIMUM"
    http_status: "400 or 409"
    applies_to: ["POST /api/job-postings", "POST /api/job-postings/{id}/versions", "POST /api/applications", "POST /api/assessments", "POST /api/sponsored-jobs"]

  - priority: 7
    category: business_temporal
    check: "Logical clock ordering: the requested instant must not precede the current logical clock; freshness windows are evaluated at the requested instant"
    error_id: ERR_INVALID_CLOCK_ORDER
    http_status: 400
    applies_to: ["POST /api/_clock/set_current_utc"]

  - priority: 8
    category: business_fiscal
    check: "Campaign budget and employer billing posture: daily and total budget capacity, pacing-hold capacity, billing account not FROZEN"
    error_id: "ERR_DAILY_BUDGET_EXCEEDED | ERR_TOTAL_BUDGET_EXCEEDED | ERR_INSUFFICIENT_DAILY_BUDGET"
    http_status: 409
    applies_to: ["POST /api/events", "POST /api/sponsored-jobs/{id}/pacing-holds", "POST /api/sponsored-jobs", "POST /api/campaigns"]

  - priority: 9
    category: business_referential
    check: "The event under review is refundable: within the 24-hour invalid-click window, still in BILLED status, and not already compensated"
    error_id: "ERR_EVENT_NOT_REFUNDABLE | ERR_REFUND_WINDOW_EXPIRED | ERR_DUPLICATE_REFUND_CLAIM | ERR_PACING_HOLD_OVERLAP"
    http_status: 409
    applies_to: ["POST /api/events/{id}/refund", "POST /api/sponsored-jobs/{id}/pacing-holds"]

  - priority: 10
    category: state
    check: "Optimistic concurrency: expected_<parent>_version must be present and equal the parent Campaign's current version"
    error_id: "ERR_MISSING_EXPECTED_VERSION | ERR_STALE_VERSION"
    http_status: "400 or 412"
    applies_to: ["POST /api/events", "POST /api/events/{id}/refund"]

  - priority: 11
    category: business_constraint
    check: "General request shape: required fields present, types correct, enums valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Employer ---
  - method: POST
    path: "/api/employers"
    description: "Create an employer account"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, domain, "ats_provider?"]
    output: Employer
    side_effects:
      - "status initialized to ACTIVE, quality_score to 100, response_rate_bps to 0, balance_cents to 0, billing_status to CURRENT"
  - method: GET
    path: "/api/employers/{id}"
    description: "Get an employer account"
    roles: [PlatformAdmin, Employer, TrustReviewer]
    code: 200
    input: []
    output: Employer
    side_effects: []
  - method: POST
    path: "/api/employers/{id}/suspend"
    description: "Suspend an employer for fraudulent or misleading postings"
    roles: [TrustReviewer]
    code: 200
    input: [reason]
    output: Employer
    side_effects:
      - "Employer.status -> SUSPENDED and billing_status -> FROZEN"
      - "every JobPosting of this employer -> SUSPENDED"
      - "every Campaign of this employer -> PAUSED"
      - "every SponsoredJob in those campaigns -> PAUSED"
      - "each PAUSED SponsoredJob's ACTIVE PacingHold -> RELEASED"
      - "increments Employer.version by 1"
  - method: POST
    path: "/api/employers/{id}/reinstate"
    description: "Reinstate a suspended employer after fraud review"
    roles: [TrustReviewer]
    code: 200
    input: []
    output: Employer
    side_effects:
      - "Employer.status -> ACTIVE and billing_status -> CURRENT"
      - "JobPosting.state re-derived from current_freshness"
      - "increments Employer.version by 1"
  - method: GET
    path: "/api/employers/{id}/campaigns"
    description: "List the campaigns of an employer"
    roles: [PlatformAdmin, Employer, TrustReviewer]
    code: 200
    input: ["status?"]
    output: Campaign[]
    side_effects: []

  # --- JobSeeker ---
  - method: POST
    path: "/api/job-seekers"
    description: "Register a job seeker"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, "location?"]
    output: JobSeeker
    side_effects: ["status initialized to ACTIVE"]
  - method: GET
    path: "/api/job-seekers/{id}"
    description: "Get a job seeker"
    roles: [PlatformAdmin, JobSeeker, Employer]
    code: 200
    input: []
    output: JobSeeker
    side_effects: []
  - method: GET
    path: "/api/job-seekers/{id}/alert-subscriptions"
    description: "List a seeker's job alert subscriptions"
    roles: [PlatformAdmin, JobSeeker]
    code: 200
    input: []
    output: JobAlertSubscription[]
    side_effects: []
  - method: GET
    path: "/api/job-seekers/{id}/matches"
    description: "Rank the seeker's matching postings by relevance_score"
    roles: [PlatformAdmin, JobSeeker]
    code: 200
    input: ["keywords?", "location?", "limit?", "offset?"]
    output: PostingMatch[]
    side_effects: []
  - method: GET
    path: "/api/job-seekers/{id}/applications"
    description: "List the applications submitted by a seeker"
    roles: [PlatformAdmin, JobSeeker]
    code: 200
    input: ["status?"]
    output: Application[]
    side_effects: []

  # --- Campaign ---
  - method: POST
    path: "/api/campaigns"
    description: "Create a sponsored campaign for an employer"
    roles: [Employer, PlatformAdmin]
    code: 201
    input: [employer_id, name, pricing_model, daily_budget_cents, total_budget_cents]
    output: Campaign
    side_effects:
      - "status initialized to DRAFT, spent_cents/daily_spent_cents/held_cents to 0, day_open_date to the current logical day"
  - method: GET
    path: "/api/campaigns/{id}"
    description: "Get a campaign including its computed budget fields"
    roles: [PlatformAdmin, Employer]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: POST
    path: "/api/campaigns/{id}/activate"
    description: "Activate a draft campaign"
    roles: [Employer]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "Campaign.status -> ACTIVE"
      - "increments Campaign.version by 1"
  - method: POST
    path: "/api/campaigns/{id}/pause"
    description: "Pause a running campaign"
    roles: [Employer]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "Campaign.status -> PAUSED"
      - "every ELIGIBLE SponsoredJob of this campaign -> PAUSED"
      - "increments Campaign.version by 1"
  - method: POST
    path: "/api/campaigns/{id}/resume"
    description: "Resume a paused campaign"
    roles: [Employer]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "Campaign.status -> ACTIVE"
      - "every PAUSED SponsoredJob of this campaign -> ELIGIBLE when its posting state is ACTIVE"
      - "increments Campaign.version by 1"
  - method: GET
    path: "/api/campaigns/{id}/events"
    description: "List the sponsor events of a campaign"
    roles: [PlatformAdmin, Employer]
    code: 200
    input: ["event_type?", "status?", "limit?", "offset?"]
    output: SponsorEvent[]
    side_effects: []
  - method: GET
    path: "/api/campaigns/{id}/budget-ledger"
    description: "List the append-only budget ledger of a campaign"
    roles: [PlatformAdmin, Employer]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: BudgetLedger[]
    side_effects: []

  # --- SponsoredJob ---
  - method: POST
    path: "/api/sponsored-jobs"
    description: "Attach a job posting to a campaign as a sponsored job"
    roles: [Employer]
    code: 201
    input: [campaign_id, job_posting_id, cpc_bid_cents, cpa_bid_cents]
    output: SponsoredJob
    side_effects:
      - "status initialized to ELIGIBLE"
      - "impressions/clicks/applications initialized to 0, and scheduled_pacing_multiplier and realized_pacing_multiplier to 1.0"
  - method: GET
    path: "/api/sponsored-jobs"
    description: "List sponsored jobs filtered by campaign and/or posting"
    roles: [PlatformAdmin, Employer]
    code: 200
    input: ["campaign_id?", "job_posting_id?", "status?", "limit?", "offset?"]
    output: SponsoredJob[]
    side_effects: []
  - method: GET
    path: "/api/sponsored-jobs/{id}"
    description: "Get a sponsored job including its computed pacing_multiplier"
    roles: [PlatformAdmin, Employer]
    code: 200
    input: []
    output: SponsoredJob
    side_effects: []
  - method: POST
    path: "/api/sponsored-jobs/{id}/pacing-holds"
    description: "Reserve campaign budget as a pacing hold for this sponsored job"
    roles: [Employer]
    code: 201
    input: [amount_cents]
    output: PacingHold
    side_effects:
      - "a HOLD entry is appended to the campaign BudgetLedger; Campaign.held_cents += amount_cents"
      - "rejected with ERR_PACING_HOLD_OVERLAP when this sponsored job already holds an ACTIVE hold for the same logical day"
      - "rejected with ERR_INSUFFICIENT_DAILY_BUDGET when held_cents + daily_spent_cents + amount_cents would exceed daily_budget_cents"
      - "increments Campaign.version by 1"
  - method: POST
    path: "/api/sponsored-jobs/{id}/resume"
    description: "Resume a paused sponsored job"
    roles: [Employer]
    code: 200
    input: []
    output: SponsoredJob
    side_effects:
      - "SponsoredJob.status -> ELIGIBLE"
      - "increments SponsoredJob.version by 1"
  - method: GET
    path: "/api/sponsored-jobs/{id}/pacing-holds"
    description: "List the pacing holds of a sponsored job"
    roles: [PlatformAdmin, Employer]
    code: 200
    input: ["status?"]
    output: PacingHold[]
    side_effects: []

  # --- JobPosting ---
  - method: POST
    path: "/api/job-postings"
    description: "Create a job posting and its first version"
    roles: [Employer]
    code: 201
    input: [employer_id, title, location, description_text, apply_mode, "apply_redirect_url?", "external_posting_id?"]
    output: JobPosting
    side_effects:
      - "state initialized to ACTIVE when the first version is FRESH"
      - "apply_started_count / apply_completed_count initialized to 0"
      - "dedupe_key computed from casefold(title) + normalized(location) + external_posting_id"
  - method: GET
    path: "/api/job-postings"
    description: "List job postings filtered by employer, state or supersession"
    roles: [PlatformAdmin, Employer, JobSeeker]
    code: 200
    input: ["employer_id?", "state?", "limit?", "offset?"]
    output: JobPosting[]
    side_effects: []
  - method: GET
    path: "/api/job-postings/{id}"
    description: "Get a job posting including its derived state and freshness"
    roles: [PlatformAdmin, Employer, JobSeeker]
    code: 200
    input: []
    output: JobPosting
    side_effects: []
  - method: POST
    path: "/api/job-postings/{id}/versions"
    description: "Ingest a feed snapshot for a posting; duplicate and expired detection run here"
    roles: [Employer]
    code: 201
    input: [external_posting_id, "title?", "description_text?", "apply_mode?", "apply_redirect_url?"]
    output: JobPostingVersion
    side_effects:
      - "freshness computed from the logical clock against ingested_at"
      - "JobPosting.current_freshness and JobPosting.state re-derived; an EXPIRED re-derivation pauses every SponsoredJob sponsoring the posting"
      - "when the content_hash matches an existing version within 30 days the ingestion is rejected as a duplicate"
      - "increments JobPosting.version by 1"
  - method: GET
    path: "/api/job-postings/{id}/versions"
    description: "List the ingested versions of a posting"
    roles: [PlatformAdmin, Employer]
    code: 200
    input: []
    output: JobPostingVersion[]
    side_effects: []
  - method: GET
    path: "/api/job-postings/{id}/assessments"
    description: "List the screening assessments attached to a posting"
    roles: [PlatformAdmin, Employer]
    code: 200
    input: []
    output: Assessment[]
    side_effects: []

  # --- Assessment ---
  - method: POST
    path: "/api/assessments"
    description: "Create a published screening assessment for a posting"
    roles: [Employer]
    code: 201
    input: [job_posting_id, questions, pass_threshold]
    output: Assessment
    side_effects: ["status initialized to PUBLISHED"]

  # --- Application ---
  - method: POST
    path: "/api/applications"
    description: "Start an apply flow (hosted or ATS redirect) for a seeker on a posting"
    roles: [JobSeeker, PlatformAdmin]
    code: 201
    input: [job_posting_id, job_seeker_id, "assessment_id?", "assessment_answers?"]
    output: Application
    side_effects:
      - "status initialized to STARTED"
      - "JobPosting.apply_started_count += 1"
      - "when an assessment_id is attached, assessment_score is computed from assessment_answers"
  - method: GET
    path: "/api/applications"
    description: "List applications filtered by seeker, posting or status"
    roles: [PlatformAdmin, Employer, JobSeeker]
    code: 200
    input: ["job_seeker_id?", "job_posting_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/api/applications/{id}"
    description: "Get an application"
    roles: [PlatformAdmin, Employer, JobSeeker]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/api/applications/{id}/complete"
    description: "Mark an apply flow complete (hosted submit or ATS completion pixel)"
    roles: [JobSeeker, PlatformAdmin]
    code: 200
    input: ["assessment_answers?"]
    output: Application
    side_effects:
      - "Application.status -> COMPLETED; completed_at stamped"
      - "JobPosting.apply_completed_count += 1"
      - "an ApplyEvent kind=COMPLETED is appended (source HOSTED or REDIRECT)"
      - "when the posting is sponsored on a CPA campaign, a billable SponsorEvent APPLICATION is recorded and its cost flows through the budget commit split"
      - "increments Application.version by 1"
  - method: POST
    path: "/api/applications/{id}/close"
    description: "Close or abandon an application"
    roles: [Employer, JobSeeker, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application.status -> CLOSED"
      - "when the application was STARTED, JobPosting.apply_started_count -= 1 (the in-flight start is released)"
      - "increments Application.version by 1"
  - method: POST
    path: "/api/applications/{id}/disposition"
    description: "Record the employer's disposition feedback on an application"
    roles: [Employer]
    code: 200
    input: [disposition]
    output: Application
    side_effects:
      - "Application.status -> RESPONDED when the disposition is responding; disposition stored"
      - "responded_at stamped on the first responding disposition"
      - "Employer.response_rate_bps and Employer.quality_score recomputed by employer_quality_signal"
      - "every SponsoredJob of the employer recomputes scheduled_pacing_multiplier and realized_pacing_multiplier"
      - "increments Application.version by 1"
  - method: GET
    path: "/api/applications/{id}/apply-events"
    description: "List the apply-routing events of an application"
    roles: [PlatformAdmin, Employer, JobSeeker]
    code: 200
    input: []
    output: ApplyEvent[]
    side_effects: []

  # --- SponsorEvent / billing ---
  - method: POST
    path: "/api/events"
    description: "Record a sponsored impression, click or application event and clear its charge"
    roles: [PlatformAdmin]
    code: 201
    input: [campaign_id, sponsored_job_id, event_type, device_fingerprint, ip_hash, expected_campaign_version]
    output: SponsorEvent
    side_effects:
      - "rejected with ERR_CAMPAIGN_NOT_ACTIVE when the campaign status is not ACTIVE (priority-4 state check)"
      - "billable = (event_type == CLICK and pricing_model == CPC) or (event_type == APPLICATION and pricing_model == CPA)"
      - "cost_cents from auction_clearing_price; budget_commit_split consumes ACTIVE PacingHolds and appends COMMIT entries"
      - "Campaign.spent_cents and daily_spent_cents increase; Employer.balance_cents increases by cost_cents"
      - "Campaign.status -> COMPLETED when spent_cents >= total_budget_cents, which pauses all its SponsoredJobs and releases their ACTIVE PacingHolds"
      - "increments Campaign.version by 1"
  - method: POST
    path: "/api/events/{id}/refund"
    description: "Refund an invalid or duplicate click"
    roles: [TrustReviewer, PlatformAdmin]
    code: 200
    input: [reason, expected_campaign_version]
    output: SponsorEvent
    side_effects:
      - "SponsorEvent.status -> REFUNDED"
      - "a REFUND (negative) entry is appended; Campaign.spent_cents and daily_spent_cents decrease; Employer.balance_cents decreases by cost_cents"
      - "increments Campaign.version by 1"

  # --- Alerts ---
  - method: POST
    path: "/api/job-alert-subscriptions"
    description: "Create a job alert subscription for a seeker"
    roles: [JobSeeker, PlatformAdmin]
    code: 201
    input: [job_seeker_id, keywords, location]
    output: JobAlertSubscription
    side_effects: ["status initialized to ACTIVE, notified_posting_ids to []"]
  - method: POST
    path: "/api/alerts/dispatch"
    description: "Deliver matching postings to alert subscriptions, highest relevance first"
    roles: [PlatformAdmin]
    code: 200
    input: ["subscription_id?"]
    output: "{ delivered_count: integer, subscription_ids: array, job_posting_ids: array, delivery_id: string }"
    side_effects:
      - "for every alert subscription, the alert-match selector ranks ACTIVE/STALE postings by relevance_score"
      - "postings already in notified_posting_ids are excluded (dedupe)"
      - "last_notified_at stamped; notified_posting_ids extended"

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock; advancing across a day boundary triggers day rollover. The server's startup default logical time is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, day_open_date: string, campaigns_reset: integer, postings_rederived: integer }"
    side_effects:
      - "every campaign whose day_open_date precedes the new logical day resets daily_spent_cents to 0 and advances day_open_date"
      - "PACING_HOLD campaigns with a fresh day return to ACTIVE; their BUDGET_HOLD sponsored jobs re-derive"
      - "posting freshness is re-derived for every posting; EXPIRED postings pause their sponsored jobs"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The acting role is not permitted for the operation, or an entity_backed caller does not own the target resource"

  # --- Not found ---
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "No employer exists with the given id"
  - id: ERR_JOB_SEEKER_NOT_FOUND
    http: 404
    condition: "No job seeker exists with the given id"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "No campaign exists with the given id"
  - id: ERR_SPONSORED_JOB_NOT_FOUND
    http: 404
    condition: "No sponsored job exists with the given id"
  - id: ERR_JOB_POSTING_NOT_FOUND
    http: 404
    condition: "No job posting exists with the given id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No application exists with the given id"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No assessment exists with the given id"
  - id: ERR_SPONSOR_EVENT_NOT_FOUND
    http: 404
    condition: "No sponsor event exists with the given id"

  # --- State constraints ---
  - id: ERR_CAMPAIGN_NOT_ACTIVE
    http: 409
    condition: "The operation requires the campaign to be in ACTIVE status"
  - id: ERR_CAMPAIGN_TERMINAL
    http: 409
    condition: "The campaign is COMPLETED (or PAUSED for spend) and cannot accept further holds or billed events"
  - id: ERR_SPONSORED_JOB_NOT_ELIGIBLE
    http: 409
    condition: "The sponsored job is not in a state that can serve a placement (DRAFT, PAUSED or BUDGET_HOLD)"
  - id: ERR_POSTING_NOT_ACTIVE
    http: 409
    condition: "The job posting is not ACTIVE (DRAFT, STALE, EXPIRED or SUSPENDED)"
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "The application is not in the state required by the requested action (e.g. complete requires STARTED)"
  - id: ERR_APPLICATION_ALREADY_TERMINAL
    http: 409
    condition: "The application is CLOSED; no further transition is possible"
  - id: ERR_EMPLOYER_NOT_SUSPENDED
    http: 409
    condition: "Reinstatement was requested for an employer that is not SUSPENDED"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested lifecycle action is not permitted from the resource's current state"

  # --- Business safety (fraud / trust) ---
  - id: ERR_EMPLOYER_SUSPENDED
    http: 409
    condition: "The acting employer account is SUSPENDED and may not create postings, campaigns, sponsored jobs or events"
  - id: ERR_FRAUD_KEYWORDS_DETECTED
    http: 409
    condition: "The posting title or description contains a misleading-posting keyword (e.g. 'wire transfer', 'upfront fee', 'pay to start')"

  # --- Business constraints ---
  - id: ERR_DUPLICATE_INGESTION
    http: 409
    condition: "An incoming feed snapshot duplicates an existing version by content_hash within the 30-day window, or the posting dedupe_key already exists for the employer"
  - id: ERR_INVALID_REDIRECT_URL
    http: 400
    condition: "apply_mode is ATS_REDIRECT but apply_redirect_url is missing or not an absolute https URL"
  - id: ERR_UNSUPPORTED_ASSESSMENT_QUESTIONS
    http: 400
    condition: "questions is empty, or pass_threshold exceeds the number of required questions"
  - id: ERR_ASSESSMENT_SCORE_BELOW_THRESHOLD
    http: 409
    condition: "The submitted assessment score is below the assessment pass_threshold"
  - id: ERR_BID_BELOW_MINIMUM
    http: 400
    condition: "cpc_bid_cents or cpa_bid_cents is below 1 cent"
  - id: ERR_INVALID_CLOCK_ORDER
    http: 400
    condition: "The requested logical instant precedes the current logical clock"

  # --- Business temporal ---
  - id: ERR_REFUND_WINDOW_EXPIRED
    http: 409
    condition: "The sponsor event's occurred_at is more than 24 hours before the logical clock"

  # --- Business fiscal ---
  - id: ERR_DAILY_BUDGET_EXCEEDED
    http: 409
    condition: "The cleared cost would push daily_spent_cents above daily_budget_cents"
  - id: ERR_TOTAL_BUDGET_EXCEEDED
    http: 409
    condition: "The cleared cost would push spent_cents above total_budget_cents"
  - id: ERR_INSUFFICIENT_DAILY_BUDGET
    http: 409
    condition: "A pacing hold would push held_cents + daily_spent_cents above daily_budget_cents"

  # --- Business referential ---
  - id: ERR_EVENT_NOT_REFUNDABLE
    http: 409
    condition: "The sponsor event is not BILLED (RECORDED, HOLDING, REFUNDED or VOID)"
  - id: ERR_DUPLICATE_REFUND_CLAIM
    http: 409
    condition: "A refund was already granted for this device_fingerprint within the invalid-click window"
  - id: ERR_PACING_HOLD_OVERLAP
    http: 409
    condition: "An ACTIVE pacing hold already exists for this sponsored job on the current logical day"

  # --- Concurrency ---
  - id: ERR_MISSING_EXPECTED_VERSION
    http: 400
    condition: "expected_campaign_version is absent from a write that requires OCC"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_campaign_version does not equal the campaign's current version"

  # --- General ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "General request shape error (missing required field, wrong type, invalid enum)"

# =============================================================================
# Table 7: RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Indeed operations staff; seeds employers and seekers, records and refunds sponsored events, dispatches alerts, and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/employers"
      - "POST /api/job-seekers"
      - "POST /api/events"
      - "POST /api/alerts/dispatch"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "POST /api/events/{id}/refund"
      - "POST /api/campaigns"
      - "POST /api/job-alert-subscriptions"
      - "GET /api/employers/{id}"
      - "GET /api/sponsored-jobs"
      - "GET /api/campaigns/{id}"
      - "GET /api/campaigns/{id}/budget-ledger"
      - "GET /api/job-postings"

  - name: TrustReviewer
    description: "Fraud and trust reviewer; suspends and reinstates employers, and grants invalid-click refunds"
    identity: opaque
    exclusive_operations:
      - "POST /api/employers/{id}/suspend"
      - "POST /api/employers/{id}/reinstate"
    shared_operations:
      - "POST /api/events/{id}/refund"
      - "GET /api/employers/{id}"
      - "GET /api/job-postings/{id}"

  - name: Employer
    description: "Hiring employer account; owns its campaigns, sponsored jobs, job postings, assessments and applications, and records applicant dispositions"
    identity: entity_backed:Employer
    exclusive_operations:
      - "POST /api/campaigns/{id}/activate"
      - "POST /api/campaigns/{id}/pause"
      - "POST /api/campaigns/{id}/resume"
      - "POST /api/sponsored-jobs"
      - "POST /api/sponsored-jobs/{id}/pacing-holds"
      - "POST /api/sponsored-jobs/{id}/resume"
      - "POST /api/job-postings"
      - "POST /api/job-postings/{id}/versions"
      - "POST /api/assessments"
      - "POST /api/applications/{id}/disposition"
    shared_operations:
      - "POST /api/campaigns"
      - "POST /api/sponsored-jobs/{id}/resume"
      - "GET /api/employers/{id}"
      - "GET /api/sponsored-jobs/{id}"

  - name: JobSeeker
    description: "Job applicant; starts, completes and abandons apply flows, manages alert subscriptions, and reads postings and its own applications"
    identity: entity_backed:JobSeeker
    exclusive_operations:
      - "POST /api/applications"
      - "POST /api/applications/{id}/complete"
      - "POST /api/job-alert-subscriptions"
    shared_operations:
      - "GET /api/job-seekers/{id}/matches"
      - "POST /api/applications/{id}/close"
      - "GET /api/job-postings/{id}"
      - "GET /api/job-postings"
      - "GET /api/job-seekers/{id}/applications"
      - "GET /api/job-seekers/{id}/alert-subscriptions"
      - "GET /api/applications/{id}"
