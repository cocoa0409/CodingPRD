  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_agreement_create_with_a_superseded_publisher_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-create-stale-publisher]
          - errors[ERR_STALE_PARENT_VERSION]
        distinguishing_aspect: |
          The publisher's version is read before a screening run bumps it. Replaying the earlier
          value in expected_publisher_version returns ERR_STALE_PARENT_VERSION 412 and writes
          nothing; re-reading the publisher and sending the current value creates the agreement.
          The guard compares against the live version, not merely against a non-null value.
        test_recipe:
          setup:
            - "one publisher; its version is captured, then a screening run bumps it"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { cc1_p_id: $.data.id, cc1_v_old: $.data.version }
            - call: "POST /publishers/${cc1_p_id}/screening-runs"
              payload: { doaj_indexed: true, cope_member: true, editorial_board_verified: true, retraction_rate_per_1000: 0.0, peer_review_days_median: 30, apc_transparency_score: 90 }
              as: ScholCommLibrarian
              captures: { cc1_v_new: $.data.version, cc1_screen: $.data.screening_status }
          trigger:
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${cc1_p_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2027-07-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${cc1_v_old}" }
              as: AgreementAdmin
              captures: { cc1_err: $.data.error_id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${cc1_p_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2027-07-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${cc1_v_new}" }
              as: AgreementAdmin
              captures: { cc1_ta_id: $.data.id, cc1_ta_status: $.data.status, cc1_used: $.data.articles_used }
          assert:
            - "${cc1_v_old} == 1"
            - "${cc1_screen} == CLEARED"
            - "${cc1_v_new} == 2"
            - "${cc1_err} == ERR_STALE_PARENT_VERSION"
            - "the first response returned HTTP 412"
            - "the second response returned HTTP 201"
            - "${cc1_ta_status} == DRAFT"
            - "${cc1_used} == 0"
            - "Publisher.${cc1_p_id}.version == 3"
            - "exactly 1 TransformativeAgreement exists for ${cc1_p_id}, namely ${cc1_ta_id}"

      - name: corner_deposit_create_with_a_superseded_article_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[deposit-create-stale-article]
          - errors[ERR_STALE_PARENT_VERSION]
        distinguishing_aspect: |
          The article's version is captured at creation, then a first deposit and its ingest bump
          it. Reusing the captured value returns ERR_STALE_PARENT_VERSION 412 — and it wins over
          the deposit-uniqueness rule at priority 25 — while the refreshed value creates
          version_ordinal 2 and supersedes the earlier ingested deposit.
        test_recipe:
          setup:
            - "logical clock at 2026-08-12T00:00:00Z"
            - "article with no grant by an author with an orcid; first deposit ingested (version_ordinal 1)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { cc2_p_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${cc2_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { cc2_j_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", orcid: "0000-0001-5109-3700", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { cc2_au_id: $.data.id }
            - call: "POST /articles"
              payload: { journal_id: "${cc2_j_id}", corresponding_author_id: "${cc2_au_id}", manuscript_title: "Versioned deposits", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { cc2_a_id: $.data.id, cc2_v_old: $.data.version }
            - call: "POST /repository-deposits"
              payload: { article_id: "${cc2_a_id}", version_label: "ACCEPTED_MANUSCRIPT", file_checksum: "1122334455667788990011223344556677889900112233445566778899001122", license: "CC_BY", expected_article_version: "${cc2_v_old}" }
              as: CorrespondingAuthor
              as_user_id: "${cc2_au_id}"
              captures: { cc2_dep1_id: $.data.id, cc2_ord1: $.data.version_ordinal }
            - call: "POST /repository-deposits/${cc2_dep1_id}/submission"
              payload: {}
              as: CorrespondingAuthor
              as_user_id: "${cc2_au_id}"
            - call: "POST /repository-deposits/${cc2_dep1_id}/curation-decision"
              payload: { decision: "INGEST" }
              as: RepositoryCurator
              captures: { cc2_dep1_status: $.data.status }
            - call: "GET /articles/${cc2_a_id}"
              as: ScholCommLibrarian
              captures: { cc2_v_new: $.data.version, cc2_ordinal: $.data.latest_deposit_ordinal }
          trigger:
            - call: "POST /repository-deposits"
              payload: { article_id: "${cc2_a_id}", version_label: "VERSION_OF_RECORD", file_checksum: "2233445566778899001122334455667788990011223344556677889900112233", license: "CC_BY", expected_article_version: "${cc2_v_old}" }
              as: CorrespondingAuthor
              as_user_id: "${cc2_au_id}"
              captures: { cc2_err: $.data.error_id }
            - call: "POST /repository-deposits"
              payload: { article_id: "${cc2_a_id}", version_label: "VERSION_OF_RECORD", file_checksum: "2233445566778899001122334455667788990011223344556677889900112233", license: "CC_BY", expected_article_version: "${cc2_v_new}" }
              as: CorrespondingAuthor
              as_user_id: "${cc2_au_id}"
              captures: { cc2_dep2_id: $.data.id, cc2_ord2: $.data.version_ordinal, cc2_dep2_status: $.data.status }
          assert:
            - "${cc2_ord1} == 1"
            - "${cc2_dep1_status} == INGESTED"
            - "${cc2_ordinal} == 1"
            - "${cc2_err} == ERR_STALE_PARENT_VERSION"
            - "the first response returned HTTP 412"
            - "the second response returned HTTP 201"
            - "${cc2_ord2} == 2"
            - "${cc2_dep2_status} == DRAFT"
            - "RepositoryDeposit.${cc2_dep1_id}.status == INGESTED"
            - "Article.${cc2_a_id}.latest_deposit_ordinal == 2"

      - name: corner_current_parent_version_is_accepted_on_the_guarded_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-create-stale-publisher]
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_ta_full_vs_final_author_pays_coverage_window
          rationale: "That instance creates its agreement with the freshly captured expected_publisher_version, exercising the accepting side of the OCC guard as part of its setup."

      - name: corner_publication_cascades_through_three_entities
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /articles/{id}/publication]
        excluded_because:
          difficulty_instance: transitive_cascade / publication_cascade_determination_to_agreement_to_publisher
          rationale: "That instance follows one publication call from the appended FINAL determination through the agreement's articles_used and status to Publisher.active_agreement_count and version."

      - name: corner_ingest_cascades_through_deposit_article_and_grant
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /repository-deposits/{id}/curation-decision]
        excluded_because:
          difficulty_instance: transitive_cascade / ingest_cascade_supersede_to_article_to_grant
          rationale: "That instance asserts the supersede of the earlier deposit, the article's compliance recomputation and the grant's compliant_output_count / mandate_status in one hop chain."

      - name: corner_coverage_determination_runs_two_variants
        claim_type: dual_variant_calculation
        grounds:
          - calculations.apc_coverage_determination.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_ta_full_vs_final_author_pays_coverage_window
          rationale: "That instance is the dual-variant probe for the coverage determination itself."

      - name: corner_utilisation_runs_two_variants
        claim_type: dual_variant_calculation
        grounds:
          - calculations.fund_utilisation_by_basis.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / encumbrance_vs_cash_basis_fund_utilisation_divergence
          rationale: "That instance is the dual-variant probe for the utilisation basis."

      - name: corner_fund_freeze_fires_at_the_utilisation_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.apc_fund_waterfall_allocation.constants.FUND_FREEZE_THRESHOLD_PCT
        excluded_because:
          difficulty_instance: boundary_precision_check / fund_auto_freeze_at_exactly_ninety_eight_percent_vs_one_cent_below
          rationale: "That instance pins the auto-freeze trigger to the inclusive 98% boundary and its one-cent-below twin."

      - name: corner_screening_verdict_bands_are_threshold_driven
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.predatory_screening_score.constants.BLOCK_MIN
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_safety_publisher_blocked_outranks_grant_not_active
          rationale: "That instance drives a publisher past BLOCK_MIN so screening_status BLOCKED gates the eligibility check, exercising the threshold trigger end to end."

  - section: consistency_model
    instances:
      - name: corner_side_effects_are_visible_to_the_next_read
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /transformative-agreements/{id}/activation]
          - endpoints[GET /eligibility-determinations]
        distinguishing_aspect: |
          The consistency model is immediate: the activation response already reports ACTIVE, and
          the very next GET /publishers/{id} shows active_agreement_count 1 with the bumped
          version — no settling step, no background job. Likewise the determination appended by
          the eligibility check is returned by GET /eligibility-determinations?article_id= on the
          immediately following request, and the article already carries the route TA_FULL.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "publisher MERID with a HYBRID journal at 380000 and a DRAFT agreement carrying one FULL_APC coverage line"
            - "author with no grant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { cm1_p_id: $.data.id, cm1_p_v: $.data.version }
            - call: "POST /journals"
              payload: { publisher_id: "${cm1_p_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { cm1_j_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Ilse Vermeer", email: "ilse.vermeer@uni.example", orcid: "0000-0002-1111-2222", department_code: "CEL", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { cm1_au_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${cm1_p_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2027-07-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${cm1_p_v}" }
              as: AgreementAdmin
              captures: { cm1_ta_id: $.data.id }
            - call: "POST /transformative-agreements/${cm1_ta_id}/coverages"
              payload: { journal_id: "${cm1_j_id}", coverage_type: "FULL_APC", covered_from: "2026-07-01", covered_until: "2027-06-30" }
              as: AgreementAdmin
            - call: "POST /articles"
              payload: { journal_id: "${cm1_j_id}", corresponding_author_id: "${cm1_au_id}", manuscript_title: "Immediately visible side effects", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { cm1_a_id: $.data.id }
          trigger:
            - call: "POST /transformative-agreements/${cm1_ta_id}/activation"
              payload: {}
              as: AgreementAdmin
              captures: { cm1_status: $.data.status, cm1_activated: $.data.activated_at }
            - call: "GET /publishers/${cm1_p_id}"
              as: AgreementAdmin
              captures: { cm1_count: $.data.active_agreement_count, cm1_p_v3: $.data.version }
            - call: "POST /articles/${cm1_a_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures: { cm1_route: $.data.route, cm1_seq: $.data.sequence_no }
            - call: "GET /eligibility-determinations"
              payload: { article_id: "${cm1_a_id}", limit: 10, offset: 0 }
              as: ScholCommLibrarian
            - call: "GET /articles/${cm1_a_id}"
              as: ScholCommLibrarian
              captures: { cm1_a_route: $.data.eligibility_route, cm1_a_covered: $.data.covered_amount_cents, cm1_a_det: $.data.determination_count }
          assert:
            - "${cm1_status} == ACTIVE"
            - "${cm1_activated} == 2026-08-10T00:00:00Z"
            - "${cm1_count} == 1"
            - "${cm1_p_v3} == 3"
            - "${cm1_route} == TA_FULL"
            - "${cm1_seq} == 1"
            - "the determinations page returns exactly 1 row with total_count 1"
            - "${cm1_a_route} == TA_FULL"
            - "${cm1_a_covered} == 304000"
            - "${cm1_a_det} == 1"
            - "TransformativeAgreement.${cm1_ta_id}.articles_used == 1"
