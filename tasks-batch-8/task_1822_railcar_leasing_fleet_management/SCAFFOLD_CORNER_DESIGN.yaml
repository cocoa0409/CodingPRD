        distinguishing_aspect: "Execute requires an open CapitalPool for the execution year (2026); with none created it fails 404 ERR_POOL_NOT_FOUND and the car stays RETIREMENT_PENDING."
        test_recipe:
          setup: ["APPROVED retirement case on car GATX1601; no CapitalPool exists"]
