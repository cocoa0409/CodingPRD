scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: restaurant_creation_returns_201_and_system_fields
        claim_type: creation
        grounds: [entities.Restaurant]
        distinguishing_aspect: "POST /api/restaurants with required fields returns 201 with server-minted id, created_at, updated_at, version == 1."
        test_recipe:
          setup: ["empty DB; clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
          assert:
            - "response code 201; Restaurant.id is a UUID; version == 1; created_at == 2026-09-01T00:00:00.000Z (logical clock)"
      - name: restaurant_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Restaurant, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/restaurants/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/restaurants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"
      - name: hopper_default_calibration_and_computed_drift_null
        claim_type: defaults
        grounds: [entities.Hopper.fields.calibration_coefficient, entities.Hopper.fields.drift_pct]
        distinguishing_aspect: "Omitting calibration_coefficient defaults to 1.0; computed drift_pct is null on creation and client-supplied drift_pct input is ignored."
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1; ingredient ING"
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED" }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
          trigger:
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0 }
              as: OpsAdmin
              captures: { h1_coef: $.data.calibration_coefficient, h1_drift: $.data.drift_pct, h1_rate: $.data.id }
          assert:
            - "Hopper.calibration_coefficient == 1.0 (default applied)"
            - "Hopper.drift_pct == null (computed, insufficient samples)"
      - name: assembly_line_default_service_rate_by_type
        claim_type: defaults
        grounds: [entities.AssemblyLine.fields.service_rate_seconds_per_bowl]
        distinguishing_aspect: "Omitting service_rate_seconds_per_bowl defaults to 45 for AUTOMATED and 120 for MANUAL lines."
        test_recipe:
          setup: ["Restaurant R1"]
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "LA", line_type: "AUTOMATED" }
              as: OpsAdmin
              captures: { la_rate: $.data.service_rate_seconds_per_bowl }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "LM", line_type: "MANUAL" }
              as: OpsAdmin
              captures: { lm_rate: $.data.service_rate_seconds_per_bowl }
          assert:
            - "AUTOMATED line default service_rate_seconds_per_bowl == 45"
            - "MANUAL line default == 120"
      - name: recipe_is_available_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Recipe.fields.is_available]
        distinguishing_aspect: "Client-supplied is_available on recipe creation is ignored; the value is derived from ingredient status (true when the sole ingredient is ACTIVE)."
        test_recipe:
          setup: ["Restaurant R1; ingredient ING ACTIVE"]
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
          trigger:
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }], is_available: false }
              as: OpsAdmin
              captures: { rc_avail: $.data.is_available }
          assert:
            - "Recipe.is_available == true (input false ignored; computed from ACTIVE ingredient)"
      - name: portion_verification_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.PortionVerification]
        distinguishing_aspect: "PortionVerification has common_fields: false — responses carry id and created_at but no version and no updated_at; no update endpoint exists."
        test_recipe:
          setup:
            - "Full happy path to one completed order with a verification (restaurant, line, ingredient, recipe, hopper loaded 1000, order started)"
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED" }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 100.0 }] }
              as: LineOperator
          trigger:
            - call: "GET /api/orders/${o1}/portion-verifications"
              payload: {}
              as: QualityLead
              captures: { pv: $.data.0.id }
          assert:
            - "PortionVerification response has id and created_at but no version field"
            - "result == PASS and variance_pct == 0.00"
      - name: ingredients_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Ingredient]
        distinguishing_aspect: "GET /api/ingredients?limit=1 returns data array of size 1 plus pagination fields total_count and has_more; default limit is 10."
        test_recipe:
          setup: ["two ingredients created"]
          setup_api_calls:
            - call: "POST /api/ingredients"
              payload: { sku: "A1", name: "IngA", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
            - call: "POST /api/ingredients"
              payload: { sku: "B1", name: "IngB", station_type: "PROTEIN", shelf_life_minutes: 240 }
              as: OpsAdmin
          trigger:
            - call: "GET /api/ingredients?limit=1"
              payload: {}
              as: PrepCook
          assert:
            - "response_type == array; data length == 1; total_count == 2; has_more == true"
      - name: ingredient_sku_uniqueness_rejected
        claim_type: type_constraints
        grounds: [entities.Ingredient.fields.sku, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Second ingredient with the same sku is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["ingredient with sku ROM exists"]
          setup_api_calls:
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
          trigger:
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine2", station_type: "TOPPING", shelf_life_minutes: 120 }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION with http 400"
      - name: hopper_station_slot_must_match_station_type
        claim_type: type_constraints
        grounds: ["validations[priority=19]", "errors[ERR_INGREDIENT_STATION_MISMATCH]"]
        distinguishing_aspect: "Mounting a DRESSING ingredient on slot 0 (BASE slot) is rejected with ERR_INGREDIENT_STATION_MISMATCH; slot 6 (DRESSING) is accepted."
        test_recipe:
          setup: ["Restaurant R1; line L1; ingredient DRS station_type DRESSING"]
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED" }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "DRS", name: "Dressing", station_type: "DRESSING", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { drs: $.data.id }
          trigger:
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${drs}", capacity_grams: 500, station_slot: 0 }
              as: OpsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${drs}", capacity_grams: 500, station_slot: 6 }
              as: OpsAdmin
              captures: { h_ok: $.data.id }
          assert:
            - "slot 0 attempt rejected with ERR_INGREDIENT_STATION_MISMATCH (422)"
            - "slot 6 attempt accepted (201)"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: pause_with_in_flight_order_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.AssemblyLine, "errors[ERR_LINE_BUSY]"]
        distinguishing_aspect: "Pausing a line that hosts an ASSEMBLING order is rejected with ERR_LINE_BUSY; the line stays ACTIVE."
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1 OPEN; hopper loaded; order O1 started (ASSEMBLING)"
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED" }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
          trigger:
            - call: "POST /api/assembly-lines/${l1}/pause"
              payload: {}
              as: ShiftManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LINE_BUSY (409); AssemblyLine.${l1}.status remains ACTIVE"
      - name: completed_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Order]
        distinguishing_aspect: "From COMPLETED no transition is possible: cancel and reroute both return ERR_INVALID_STATE."
        test_recipe:
          setup: ["one COMPLETED order O1 (full happy path)"]
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED" }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 100.0 }] }
              as: LineOperator
          trigger:
            - call: "POST /api/orders/${o1}/cancel"
              payload: {}
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); Order.${o1}.status remains COMPLETED"
      - name: eighty_six_propagates_to_recipe_availability
        claim_type: side_effect_execution
        grounds: [entities.Recipe.fields.is_available, entities.Ingredient.fields.status]
        distinguishing_aspect: "Eighty-sixing the sole ingredient of a recipe flips Recipe.is_available to false; restore flips it back to true — the digital-menu propagation side effect."
        test_recipe:
          setup: ["Restaurant R1; ingredient ING; recipe RC with portion ING"]
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /api/ingredients/${ing}/eighty-six"
              payload: {}
              as: ShiftManager
            - call: "GET /api/recipes/${rc}"
              payload: {}
              as: Customer
              captures: { avail_off: $.data.is_available }
            - call: "POST /api/ingredients/${ing}/restore"
              payload: {}
              as: ShiftManager
            - call: "GET /api/recipes/${rc}"
              payload: {}
              as: Customer
              captures: { avail_on: $.data.is_available }
          assert:
            - "after eighty-six: Recipe.is_available == false"
            - "after restore: Recipe.is_available == true"
      - name: substitution_covers_eighty_sixed_ingredient
        claim_type: side_effect_execution
        grounds: [entities.Recipe.fields.is_available, state_machines.SubstitutionRule]
        distinguishing_aspect: "With ingredient A eighty-sixed, a recipe containing A stays available iff an ACTIVE SubstitutionRule A->B covers the current clock time; retiring the rule flips availability back to false."
        test_recipe:
          setup:
            - "Restaurant R1; ingredients A (eighty-sixed) and B (ACTIVE); recipe RC contains A; substitution rule A->B window 00:00-23:59 ACTIVE"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "A1", name: "IngA", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { inga: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "B1", name: "IngB", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ingb: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${inga}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id }
            - call: "POST /api/substitution-rules"
              payload: { restaurant_id: "${r1}", from_ingredient_id: "${inga}", to_ingredient_id: "${ingb}", effective_start: "2026-09-01T00:00:00Z", effective_end: "2026-09-01T23:59:00Z" }
              as: OpsAdmin
              captures: { sub1: $.data.id }
            - call: "POST /api/substitution-rules/${sub1}/activate"
              payload: {}
              as: ShiftManager
            - call: "POST /api/ingredients/${inga}/eighty-six"
              payload: {}
              as: ShiftManager
            - call: "GET /api/recipes/${rc}"
              payload: {}
              as: Customer
              captures: { avail_covered: $.data.is_available }
          trigger:
            - call: "POST /api/substitution-rules/${sub1}/retire"
              payload: {}
              as: ShiftManager
            - call: "GET /api/recipes/${rc}"
              payload: {}
              as: Customer
              captures: { avail_after: $.data.is_available }
          assert:
            - "with ACTIVE rule: Recipe.is_available == true despite A EIGHTY_SIXED"
            - "after retire: Recipe.is_available == false"
      - name: expire_sweep_releases_ready_task_and_reallocates
        claim_type: compensation
        grounds: [state_machines.PrepBatch.READY_to_EXPIRED, calculations.refill_allocation_waterfall]
        distinguishing_aspect: "Expiring the allocated batch moves its READY task back to SCHEDULED with allocated_grams 0 and null batch, returns the hopper to DEPLETED, then the waterfall re-allocates from a second READY batch — the release is fully compensated, not leaked."
        test_recipe:
          setup:
            - "Restaurant R1; line L1; ingredient ING shelf life 60; hopper H1 cap 500 loaded 300"
            - "batch B1 qty 400 READY at 00:00 (expires 01:00); sensor 150 g -> auto task allocated 350 from B1"
            - "batch B2 qty 1000 READY (fresh); clock advanced to 01:30 (B1 expired)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED" }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 60 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 300, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 400 }
              as: PrepCook
              captures: { b1: $.data.id }
            - call: "POST /api/prep-batches/${b1}/mark-ready"
              payload: {}
              as: PrepCook
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 150 }
              as: LineOperator
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 1000 }
              as: PrepCook
              captures: { b2: $.data.id }
            - call: "POST /api/prep-batches/${b2}/mark-ready"
              payload: {}
              as: PrepCook
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:30:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /api/prep-batches/expire-sweep"
              payload: {}
              as: ShiftManager
              captures: { swept: $.data.expired_count }
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t_status: $.data.0.status, t_alloc: $.data.0.allocated_grams, t_batch: $.data.0.prep_batch_id }
          assert:
            - "expired_count == 1 (only B1)"
            - "task re-allocated from B2: status == READY, allocated_grams == 350.0, prep_batch_id == ${b2}"
            - "Hopper.${h1}.status == REFILL_SCHEDULED (re-allocated, not stranded DEPLETED)"
      - name: sanitation_complete_clears_quarantine_to_depleted
        claim_type: conditional_cascade
        grounds: [state_machines.AssemblyLine, state_machines.SanitationCycle]
        distinguishing_aspect: "Completing a sanitation cycle resets QUARANTINED hoppers to DEPLETED (must reload) and stamps last_sanitation_completed_at; aborting leaves quarantine intact and the line overdue (RESTRICTED)."
        test_recipe:
          setup:
            - "Restaurant R1; line L1 with QUARANTINED hopper H1 (drift 4.00 from 3 verified orders at 104 g)"
            - "cycle C1 scheduled 00:30-01:30; clock 01:00; cycle started (line CLEANING)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
