          - endpoints[POST /neighborhood-safety/resident-posts]
          - endpoints[POST /neighborhood-safety/residents/{id}/data-controls]
        distinguishing_aspect: "The mirror image of the unauthorized case: the Resident role really can exercise every operation its row claims exclusively — alert settings, device registration, device patch, post creation and an account-level data control — each returning 2xx on its own resource with no other role involved."
        test_recipe:
          setup:
