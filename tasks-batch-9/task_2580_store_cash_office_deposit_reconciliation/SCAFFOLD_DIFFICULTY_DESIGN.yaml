  - rule_id: priority_pair_validation_conflict
    instances:
      - name: deposit_prepare_on_locked_safe_rejects_before_balance_floor
        grounds:
          - validations[priority=40]
          - validations[priority=62]
          - errors.ERR_SAFE_NOT_UNLOCKED
          - errors.ERR_INSUFFICIENT_SAFE_BALANCE
          - entities.Safe.fields.open_state
          - endpoints["POST /cash-ops/deposits"]
        distinguishing_aspect: |
          One request violates both the priority-40 `state` rule (Safe.open_state is LOCKED) and the
          priority-62 `business_fiscal` rule (a 200000 removal against a 5000 balance): the response
          MUST be ERR_SAFE_NOT_UNLOCKED with HTTP 409, never ERR_INSUFFICIENT_SAFE_BALANCE with
          HTTP 422. Category pair: state vs business_fiscal.
        test_recipe:
          setup:
            - "Store S-1009 with safe_time_delay_minutes 5, safe_open_window_minutes 10, dual_control_required true"
            - "MANUAL safe SAFE-A commissioned with only 5000, open_state LOCKED, posture OPEN"
            - "Sales journal for 2026-08-03 exists"
            - "Logical clock is 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1009", name: "Store 1009", region_code: "EAST", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 5000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id, safe_v0: $.data.version }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/deposits"
              payload: { safe_id: "${safe_id}", sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 100 }], expected_safe_version: "${safe_v0}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Prepare deposit" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "GET /cash-ops/safes/${safe_id}"
              payload: {}
              as: CashOfficeClerk
              captures: { safe_v1: $.data.version }
            - call: "POST /cash-ops/deposits"
              payload: { safe_id: "${safe_id}", sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 100 }], expected_safe_version: "${safe_v1}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
          assert:
            - "the first deposit call returns 409 with error_id == ERR_SAFE_NOT_UNLOCKED"
            - "the first deposit call does NOT return error_id == ERR_INSUFFICIENT_SAFE_BALANCE and does NOT return HTTP 422"
            - "the second deposit call (same body, safe now UNLOCKED) returns 422 with error_id == ERR_INSUFFICIENT_SAFE_BALANCE"
            - "Safe.${safe_id}.balance_cents == 5000 after both calls"
            - "GET /cash-ops/deposits?safe_id=${safe_id} returns 0 deposits"

      - name: safe_open_dual_control_rejects_before_time_delay_elapsed
        grounds:
          - validations[priority=52]
          - validations[priority=56]
          - errors.ERR_DUAL_CONTROL_VIOLATION
          - errors.ERR_TIME_DELAY_NOT_ELAPSED
          - entities.Store.fields.dual_control_required
          - entities.Safe.fields.open_requested_by_user_id
          - endpoints["POST /cash-ops/safes/{id}/open"]
        distinguishing_aspect: |
          One request violates both the priority-52 `business_safety` rule (the requester U-CLERK-1
          is also the opener) and the priority-56 `business_temporal` rule (only 2 of the 5 delay
          minutes have elapsed): the response MUST be ERR_DUAL_CONTROL_VIOLATION with HTTP 403, so
          a lone operator learns nothing about the delay clock. Category pair: business_safety vs
          business_temporal — disjoint from the state/business_fiscal pair of the locked-safe instance.
        test_recipe:
          setup:
            - "Store S-1010 with dual_control_required true, safe_time_delay_minutes 5, safe_open_window_minutes 10"
            - "MANUAL safe SAFE-A commissioned with 500000"
            - "U-CLERK-1 armed the open request at 2026-08-03T18:00:00Z, so open_state is OPEN_REQUESTED"
            - "Logical clock advanced to 2026-08-03T18:02:00Z — 2 minutes into the 5-minute delay"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T18:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1010", name: "Store 1010", region_code: "EAST", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Cash pull" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T18:02:00Z" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T18:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
          assert:
            - "the first open call (requester acting as opener) returns 403 with error_id == ERR_DUAL_CONTROL_VIOLATION"
            - "the first open call does NOT return error_id == ERR_TIME_DELAY_NOT_ELAPSED"
            - "the second open call (different user, still inside the delay) returns 409 with error_id == ERR_TIME_DELAY_NOT_ELAPSED"
            - "after both failures Safe.${safe_id}.open_state == OPEN_REQUESTED and open_requested_at == 2026-08-03T18:00:00Z"
            - "the third open call at exactly 18:05:00Z returns 200 and Safe.${safe_id}.open_state == UNLOCKED with unlocked_at == 2026-08-03T18:05:00Z"

  - rule_id: boundary_precision_check
    instances:
      - name: rolling_variance_one_cent_below_threshold_keeps_cashier_eligible
        grounds:
          - calculations.cashier_rolling_variance
          - entities.Store.fields.rolling_variance_threshold_cents
          - entities.Cashier.fields.rolling_absolute_variance_cents
          - entities.Cashier.fields.till_eligibility
          - endpoints["POST /cash-ops/till-sessions/{id}/reconcile"]
        distinguishing_aspect: |
          The rolling comparison is `>=`, so a cumulative absolute variance of 9999 against a 10000
          threshold — one single cent below — must leave till_eligibility ELIGIBLE and open no
          ROLLING_PATTERN case, while the same chain with one cent less counted (9999 -> 10000)
          restricts the cashier. The boundary is an accumulated integer-cent sum across two sessions,
          not a rate or a tier.
        test_recipe:
          setup:
            - "Store S-1011 with single_event_variance_threshold_cents 2500 and rolling_variance_threshold_cents 10000"
            - "MANUAL safe SAFE-A with 500000, UNLOCKED at 09:05Z and left unlocked"
            - "Cashier E-100 with session A (register 1, 09:00-13:00) already RECONCILED at variance -3000"
            - "Session B (register 2, 13:00-17:00, starting bank 20000) closed with POS cash 150000, a declared 150000 closing drop, blind-counted at 13001, status COUNTED"
            - "Logical clock is 2026-08-03T17:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1011", name: "Store 1011", region_code: "WEST", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true, single_event_variance_threshold_cents: 2500, rolling_variance_threshold_cents: 10000, rolling_window_days: 30 }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              captures: { cashier_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Cash room open" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T13:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              captures: { session_a_id: $.data.id }
            - call: "POST /cash-ops/till-sessions/${session_a_id}/drops"
              payload: { txn_type: "CLOSING_DROP", declared_amount_cents: 100000 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/till-sessions/${session_a_id}/close"
              payload: { pos_cash_sales_cents: 100000, pos_card_sales_cents: 40000, pos_paid_out_cents: 0 }
              as: Cashier
