  - rule_id: boundary_precision_check
    instances:
      - name: appeal_ripeness_at_the_exact_tolled_deadline_millisecond
        grounds:
          - validations[priority=160]
          - state_machines.RecordsRequest.AWAITING_AGENCY_RESPONSE_to_APPEAL_FILED
          - calculations.statutory_deadline
          - entities.Appeal.fields.ripeness_basis
        distinguishing_aspect: |
          The delay ground requires the logical clock to be STRICTLY after due_at_tolled, and
          due_at_tolled has millisecond resolution ("2026-08-17T23:59:59.000Z"). At exactly that instant
          the appeal is not ripe; one millisecond later it is. An implementation using >= , or
          truncating the comparison to whole seconds or to the calendar date, flips exactly one of these
          two calls.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk (fee_budget_total_cents 500000), one Agency with initial_response_days 10 on BUSINESS_DAYS and appeal_venue OMBUDS."
            - "One RecordsRequest submitted 2026-08-03 with no clarification rounds, so due_at_strict == due_at_tolled == \"2026-08-17T23:59:59.000Z\"."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Overdue inspection records", requested_format: "CSV", estimated_page_count: 100, waiver_requested: false, public_interest_score: 70, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T23:59:59.000Z" }
              as: LegalCounsel
          trigger:
            - call: "POST /records-desk/appeals"
              payload: { request_id: "${req_id}", venue: "OMBUDS", grounds: "The agency blew the statutory deadline.", filing_fee_cents: 4500 }
              as: LegalCounsel
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T23:59:59.001Z" }
              as: LegalCounsel
            - call: "POST /records-desk/appeals"
              payload: { request_id: "${req_id}", venue: "OMBUDS", grounds: "The agency blew the statutory deadline.", filing_fee_cents: 4500 }
              as: LegalCounsel
              captures: { appeal_id: $.data.id }
          assert:
            - "RecordsRequest.${req_id}.due_at_tolled == \"2026-08-17T23:59:59.000Z\" and equals due_at_strict"
            - "trigger call 1 at exactly due_at_tolled: HTTP 409 with error_id == \"ERR_APPEAL_NOT_RIPE\""
            - "after trigger call 1: RecordsRequest.${req_id}.status == \"AWAITING_AGENCY_RESPONSE\", Desk.${desk_id}.open_appeal_count == 0, Desk.${desk_id}.fee_budget_committed_cents == 0"
            - "trigger call 3 at due_at_tolled + 1 millisecond: HTTP 201"
            - "Appeal.${appeal_id}.ripeness_basis == \"OVERDUE\" and Appeal.${appeal_id}.status == \"FILED\""
            - "Appeal.${appeal_id}.venue == \"OMBUDS\" and filed_at == \"2026-08-17T23:59:59.001Z\""
            - "Appeal.${appeal_id}.decision_due_at == \"2026-09-15T23:59:59.000Z\" (2026-08-17 plus 20 business days, skipping the 2026-09-07 holiday)"
            - "RecordsRequest.${req_id}.status == \"APPEAL_FILED\", Desk.${desk_id}.open_appeal_count == 1, fee_budget_committed_cents == 4500, fee_budget_available_cents == 495500"

      - name: cost_allocation_zero_record_share_and_empty_allocable_set
        grounds:
          - calculations.analysis_cost_allocation
          - validations[priority=230]
          - state_machines.Dataset.CLEAN_LOCKED_to_QUARANTINED
          - entities.Dataset.fields.allocated_cost_cents
