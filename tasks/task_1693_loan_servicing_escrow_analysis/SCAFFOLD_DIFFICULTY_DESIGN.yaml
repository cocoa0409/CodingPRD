  - rule_id: cross_entity_state_dependency
    instances:
      - name: disbursement_create_requires_verified_payee
        grounds:
          - "validations[priority=17]"
          - state_machines.Payee
          - state_machines.Disbursement
        distinguishing_aspect: |
          Entity pair Disbursement -> Payee: scheduling a disbursement against a
          PENDING_VERIFICATION payee fails with ERR_PAYEE_NOT_VERIFIED; the same failure fires on
          EscrowLineItem creation (also payee-state-dependent at the referenced entity).
        test_recipe:
          setup:
            - "Setup A account ACTIVE (payee1 VERIFIED, line item present, loan ACTIVE)"
            - "payee2 exists but is PENDING_VERIFICATION (never verified)"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-XDS-1", borrower_name: "Xav Deps", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/payees", payload: { payee_type: "INSURANCE_CARRIER", legal_name: "Unverified Mutual", remit_to_address: "5 Doubt St", ach_routing_mask: "****5555" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay2_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay2_id}", amount_cents: 30000, due_date: "2026-12-20", scheduled_release_date: "2026-12-01" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { err1: $.data.error_id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay2_id}", expense_type: "HAZARD_INSURANCE", expected_annual_amount_cents: 120000, installments_per_year: 1, first_due_date: "2027-03-01" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_PAYEE_NOT_VERIFIED (disbursement creation gated on Payee.verification_status)"
            - "err2 == ERR_PAYEE_NOT_VERIFIED (line-item creation gated on the same cross-entity state)"
            - "Payee.${pay2_id}.verification_status == PENDING_VERIFICATION"

      - name: analysis_compute_blocked_by_compliance_hold
        grounds:
          - "validations[priority=10]"
          - state_machines.EscrowAccount.hold_status.NONE_to_COMPLIANCE_HOLD
          - state_machines.EscrowAnalysisCycle.DRAFT_to_COMPUTED
        distinguishing_aspect: |
          Entity pair EscrowAnalysisCycle -> EscrowAccount: compute is gated on the ACCOUNT's
          hold_status dimension (not on any field of the analysis itself) — a different entity pair
          than Disbursement -> Payee.
        test_recipe:
          setup:
            - "Setup A account ACTIVE with line items; analysis 2027 created DRAFT"
            - "Account placed under COMPLIANCE_HOLD"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-XDS-2", borrower_name: "Holly Gates", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/hold", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_v: $.data.version } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${acct_v}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/analyses/${ana_id}/compute", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { err: $.data.error_id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/release-hold", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/analyses/${ana_id}/compute", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
          assert:
            - "err == ERR_ACCOUNT_ON_HOLD while hold_status == COMPLIANCE_HOLD"
            - "EscrowAnalysisCycle.${ana_id}.status stays DRAFT after the rejected compute"
            - "After release-hold: compute succeeds and EscrowAnalysisCycle.${ana_id}.status == COMPUTED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: insurance_coverage_half_open_adjacency
        grounds:
          - "validations[priority=16]"
          - entities.InsurancePolicy.fields.coverage_start_date
        distinguishing_aspect: |
          Half-open interval semantics on the Loan's HAZARD coverage resource: a policy whose start
          equals the existing policy's end ([2027-08-01, 2028-08-01) vs [2026-08-01, 2027-08-01)) is
          ADJACENT and allowed; one sharing any interior day is rejected with ERR_COVERAGE_OVERLAP.
        test_recipe:
          setup:
            - "Loan LN-OVL-1 ACTIVE (escrow_required false)"
            - "Policy A ACTIVE with coverage [2026-08-01, 2027-08-01)"
          setup_api_calls:
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-OVL-1", borrower_name: "Olive Lap", principal_balance_cents: 22000000, monthly_pi_cents: 140000, closing_date: "2026-07-01", escrow_required: false }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/loans/${loan_id}/insurance-policies", payload: { policy_type: "HAZARD", carrier_name: "Carrier A", policy_number: "POL-A", coverage_start_date: "2026-08-01", coverage_end_date: "2027-08-01", annual_premium_cents: 120000 }, as: InsuranceSpecialist, as_user_id: "is_1", captures: { pol_a: $.data.id } }
          trigger:
            - { call: "POST /servicing/loans/${loan_id}/insurance-policies", payload: { policy_type: "HAZARD", carrier_name: "Carrier B", policy_number: "POL-B", coverage_start_date: "2027-01-01", coverage_end_date: "2028-01-01", annual_premium_cents: 130000 }, as: InsuranceSpecialist, as_user_id: "is_1", captures: { err: $.data.error_id } }
            - { call: "POST /servicing/loans/${loan_id}/insurance-policies", payload: { policy_type: "HAZARD", carrier_name: "Carrier C", policy_number: "POL-C", coverage_start_date: "2027-08-01", coverage_end_date: "2028-08-01", annual_premium_cents: 130000 }, as: InsuranceSpecialist, as_user_id: "is_1", captures: { pol_c: $.data.id } }
          assert:
            - "err == ERR_COVERAGE_OVERLAP for POL-B (interior overlap)"
            - "POL-C created: InsurancePolicy.${pol_c}.status == ACTIVE (start == existing end is NOT overlap under half-open semantics)"

      - name: analysis_window_closed_interval_overlap
        grounds:
          - "validations[priority=16]"
          - entities.EscrowAnalysisCycle.fields.projection_start_date
          - entities.EscrowAnalysisCycle.fields.window_end_date
        distinguishing_aspect: |
          Closed-interval semantics on the EscrowAccount's analysis timeline: windows include BOTH
          endpoints, so a cycle starting 2027-08-31 collides with the existing [2026-09-01,
          2027-08-31] window (the shared boundary day IS an overlap — opposite of the insurance
          half-open rule); starting 2027-09-01 is allowed. Different resource, different interval
          arithmetic.
        test_recipe:
          setup:
            - "Setup A account ACTIVE with line items; analysis 2027 window [2026-09-01, 2027-08-31] COMPUTED (non-terminal)"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-OVL-2", borrower_name: "Ada Jacent", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { v1: $.data.version } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${v1}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana1_id: $.data.id } }
            - { call: "POST /servicing/analyses/${ana1_id}/compute", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2028, projection_start_date: "2027-08-31", method: "PROSPECTIVE", expected_escrow_account_version: "${v2}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { err: $.data.error_id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2028, projection_start_date: "2027-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${v2}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana3_id: $.data.id } }
          assert:
            - "err == ERR_ANALYSIS_WINDOW_OVERLAP (2027-08-31 shared boundary day collides under closed-interval semantics)"
            - "EscrowAnalysisCycle.${ana3_id}.status == DRAFT (window [2027-09-01, 2028-08-31] tiles without sharing a day)"

  - rule_id: compensating_invariant
    instances:
      - name: disbursement_release_return_balance_conservation
        grounds:
          - state_machines.Disbursement.SCHEDULED_to_RELEASED
          - state_machines.Disbursement.RELEASED_to_RETURNED
          - entities.EscrowAccount.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = escrow monetary balance: balance_cents == sum of ledger amount_cents
          after every step, and the release (+entry -70000) paired with its compensating return
          (+70000) restores the pre-release balance exactly (100000) with no drift and no advance
          residue.
        test_recipe:
          setup:
            - "Setup A account ACTIVE; balance 100000 (deposit eff 2026-08-05)"
            - "Disbursement 70000 due 2026-08-20, release date 2026-08-10, clock at 2026-08-10"
