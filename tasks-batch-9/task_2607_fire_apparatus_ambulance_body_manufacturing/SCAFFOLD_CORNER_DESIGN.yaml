        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / axle_safety_check_preempts_open_change_order_check
          rationale: "The overweight unit there is refused final inspection with exactly this error."

      - name: restrictive_ratio_and_compliance_threshold_errors_triggerable
