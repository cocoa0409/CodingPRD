              as: ComplianceOfficer
          assert:
            - "Household.${hh}.ami_pct == 0.5000"
            - "GroundLease.${lease}.monthly_fee_cents == 25000"
            # depth 2 link — fee was recomputed BECAUSE cert approval mutated household

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_lease_activate
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SO_DUTY_VIOLATION]
        distinguishing_aspect: |
          Category pair: state vs business_safety. When activating a lease in DRAFT (state ok)
          against a household whose cert approval violated SoD (reviewed_by == submitted_by),
          the state rule must fire first if state is wrong; the SoD rule fires only if state
          is correct. A request that violates both (lease already ACTIVE + SoD conflict) must
          return ERR_INVALID_STATE, not ERR_SO_DUTY_VIOLATION.
        test_recipe:
          setup:
            - "Program with a lease already in ACTIVE state"
            - "Triggering activate again with expected_unit_version correct"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P9", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 V St", bedrooms: 2, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Buyer", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v1: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/activate"
              payload: { expected_unit_version: "${unit_v1}" }
              as: LeaseManager
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v2: $.data.version }
          trigger:
            # Second activation attempt: lease already ACTIVE (state violation)
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/activate"
              payload: { expected_unit_version: "${unit_v2}" }
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_INVALID_STATE"
            - "GroundLease.${lease}.status remains ACTIVE (no transition)"

      - name: business_safety_vs_business_fiscal_on_default_cure
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_CURE_EVIDENCE_MISSING]
          - errors[ERR_ARREARS_NOT_CLEARED]
        distinguishing_aspect: |
          Category pair: business_safety vs business_fiscal. A cure request on a FEE_ARREARS
          notice with fee_arrears_cents > 0 AND empty cure_evidence violates both. The
          business_safety rule (priority 7) fires first: ERR_CURE_EVIDENCE_MISSING, not
          ERR_ARREARS_NOT_CLEARED.
        test_recipe:
          setup:
            - "Household on ACTIVE lease; DefaultNotice(FEE_ARREARS, amount_due=50000) OPEN; fee_arrears_cents=50000"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P10", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 W St", bedrooms: 2, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Buyer", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/default-notices"
              payload: { notice_kind: "FEE_ARREARS", amount_due_cents: 50000 }
              as: LeaseManager
              captures: { notice: $.data.id }
          trigger:
            # Try to cure with empty evidence AND arrears still unpaid — both rules violated
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/default-notices/${notice}/cure"
              payload: { cure_evidence: "" }
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_CURE_EVIDENCE_MISSING"
            - "DefaultNotice.${notice}.status remains OPEN"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ami_pct_max_eligibility_inclusive_boundary
        grounds:
          - calculations.ami_pct_calc
          - entities.CLTProgram.fields.max_eligibility_ami_pct
          - entities.Household.fields.eligibility_status
        distinguishing_aspect: |
          Metric: ami_pct. Boundary: max_eligibility_ami_pct=0.80 with inclusive (<=) comparison.
          Household with verified income yielding ami_pct exactly 0.8000 MUST become ELIGIBLE;
          ami_pct 0.8001 MUST become INELIGIBLE. Endpoint: income-certifications approve.
        test_recipe:
          setup:
            - "Program with max_eligibility_ami_pct=0.80"
            - "Two households H_at (ami=0.8000) and H_over (ami=0.8001)"
            - "size=4 (adj=1.00) so income = ami * 10000000"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P11", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            # H_at: income = 8000000 → ami = 0.8000
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H At", household_size: 4, annual_gross_income_cents: 8000000 }
              as: IntakeSpecialist
              captures: { h_at: $.data.id }
            - call: "POST /programs/${prog}/households/${h_at}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 8000000, verified_annual_income_cents: 8000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { c_at: $.data.id }
            - call: "POST /programs/${prog}/households/${h_at}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            # H_over: income = 8001000 → ami = 0.8001
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H Over", household_size: 4, annual_gross_income_cents: 8001000 }
              as: IntakeSpecialist
              captures: { h_over: $.data.id }
            - call: "POST /programs/${prog}/households/${h_over}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 8001000, verified_annual_income_cents: 8001000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { c_over: $.data.id }
            - call: "POST /programs/${prog}/households/${h_over}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households/${h_at}/income-certifications/${c_at}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${h_over}/income-certifications/${c_over}/start-review"
              as: ComplianceOfficer
          trigger:
            - call: "POST /programs/${prog}/households/${h_at}/income-certifications/${c_at}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${h_over}/income-certifications/${c_over}/approve"
              as: ComplianceOfficer
          assert:
            - "Household.${h_at}.eligibility_status == ELIGIBLE"
            - "Household.${h_at}.ami_pct == 0.8000"
            - "Household.${h_over}.eligibility_status == INELIGIBLE"
            - "Household.${h_over}.ami_pct == 0.8001"

      - name: refinance_ltv_zero_appraisal_and_max_cashout_boundary
        grounds:
          - calculations.refi_ltv_calc
          - entities.CLTProgram.fields.max_refi_ltv_pct
          - entities.CLTProgram.fields.max_equity_withdrawal_cents
        distinguishing_aspect: |
          Different metric: computed_ltv (ratio). Endpoint: refinance-requests approve. Boundary
          on ltv exactly == max_refi_ltv_pct (0.95) passes (inclusive); 0.9501 fails. Separate
          boundary: requested_cash_out == max_equity_withdrawal passes; +1 cent fails. Different
          metric, different endpoint from AMI eligibility check.
        test_recipe:
          setup:
            - "Program with max_refi_ltv_pct=0.95, max_equity_withdrawal_cents=100000"
            - "Household on ACTIVE lease"
            - "Two refinance requests: one at exactly ltv=0.9500, one at 0.9501"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P12", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED", max_refi_ltv_pct: 0.95, max_equity_withdrawal_cents: 100000 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 L St", bedrooms: 2, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Owner", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            # Refi 1: at boundary — loan=19,000,000 / appraised=20,000,000 = 0.9500 exactly
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/refinance-requests"
              payload: { lender_name: "BankA", requested_loan_cents: 19000000, requested_cash_out_cents: 100000, appraised_value_cents: 20000000 }
              as: Household
              as_user_id: "${hh}"
              captures: { refi_at: $.data.id }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/refinance-requests/${refi_at}/submit-to-lender"
              as: Household
              as_user_id: "${hh}"
            # Refi 2: above boundary — loan=19,002,000 / appraised=20,000,000 = 0.9501
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/refinance-requests"
              payload: { lender_name: "BankB", requested_loan_cents: 19002000, requested_cash_out_cents: 100001, appraised_value_cents: 20000000 }
              as: Household
              as_user_id: "${hh}"
              captures: { refi_over: $.data.id }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/refinance-requests/${refi_over}/submit-to-lender"
              as: Household
              as_user_id: "${hh}"
          trigger:
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/refinance-requests/${refi_at}/approve"
              as: LeaseManager
              captures: { ok_status: $.data.status }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/refinance-requests/${refi_over}/approve"
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "RefinanceRequest.${refi_at}.status == APPROVED"
            - "RefinanceRequest.${refi_at}.computed_ltv == 0.9500"
            - "RefinanceRequest.${refi_over}.computed_ltv == 0.9501"
            - "Second approve returned error ERR_REFINANCE_LIMIT_EXCEEDED"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: waitlist_match_requires_household_eligible
        grounds:
          - state_machines.WaitlistEntry
          - state_machines.Household
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair: WaitlistEntry → Household. WaitlistEntry's transition to MATCHED requires
          Household.eligibility_status == ELIGIBLE at match time. If Household transitions to
          EXPIRED (cert lapse), the match must fail with ERR_HOUSEHOLD_INELIGIBLE.
        test_recipe:
          setup:
            - "Program with seller ACTIVE lease + resale listing OPEN"
            - "Buyer Household EXPIRED (cert decided >24 months ago) — eligibility_status = EXPIRED"
            - "Buyer WaitlistEntry in ACTIVE status (created before lapse)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P13", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 M St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            # Seller
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Seller", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh_s}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_s: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease_s}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            # Buyer certified long ago, then lapse
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Buyer", household_size: 4, annual_gross_income_cents: 6000000 }
              as: IntakeSpecialist
              captures: { hh_b: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications"
              payload: { tax_year: 2023, reported_annual_income_cents: 6000000, verified_annual_income_cents: 6000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_b: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications/${cert_b}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications/${cert_b}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_b}/education-completions"
              payload: { course_id: "${course}", completed_at: "2024-01-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households/${hh_b}/waitlist-entries"
              payload: { desired_bedrooms: 3, max_price_cents: 50000000 }
              as: IntakeSpecialist
              captures: { entry: $.data.id }
            # Move clock 25 months forward — cert expires (24 months)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/${prog}/units/${unit}/resale-listings"
              payload: { seller_lease_id: "${lease_s}", appraisal_at_listing_cents: 25000000 }
              as: LeaseManager
              captures: { listing: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}/resale-listings/${listing}"
              as: LeaseManager
              captures: { listing_v: $.data.version }
          trigger:
            - call: "POST /programs/${prog}/units/${unit}/resale-listings/${listing}/run-matching"
              payload: { expected_listing_version: "${listing_v}" }
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_NO_ELIGIBLE_BUYER"
            - "ResaleListing.${listing}.status == OPEN"
            - "WaitlistEntry.${entry}.status == ACTIVE"

      - name: refinance_approve_requires_lease_active
        grounds:
          - state_machines.RefinanceRequest
          - state_machines.GroundLease
          - validations[priority=4]
        distinguishing_aspect: |
          Different entity pair: RefinanceRequest → GroundLease. RefinanceRequest approve requires
          GroundLease.status == ACTIVE AND no OPEN DefaultNotice on the lease. A lease in
          IN_DEFAULT must trigger ERR_INVALID_STATE on approve.
        test_recipe:
          setup:
            - "Household on lease IN_DEFAULT (unresolved FEE_ARREARS notice)"
            - "RefinanceRequest in LENDER_REVIEW"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P14", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED", max_refi_ltv_pct: 0.95, max_equity_withdrawal_cents: 100000 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 N St", bedrooms: 2, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Owner", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            # Submit refi while ACTIVE
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/refinance-requests"
              payload: { lender_name: "BankX", requested_loan_cents: 15000000, requested_cash_out_cents: 50000, appraised_value_cents: 20000000 }
              as: Household
              as_user_id: "${hh}"
              captures: { refi: $.data.id }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/refinance-requests/${refi}/submit-to-lender"
              as: Household
              as_user_id: "${hh}"
            # Now a default notice arrives
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/default-notices"
              payload: { notice_kind: "FEE_ARREARS", amount_due_cents: 50000 }
              as: LeaseManager
          trigger:
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/refinance-requests/${refi}/approve"
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_INVALID_STATE"
            - "RefinanceRequest.${refi}.status == LENDER_REVIEW"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: education_completion_validity_window_overlap
        grounds:
          - calculations.waitlist_match_selector
          - entities.EducationCompletion.fields.expires_at
        distinguishing_aspect: |
          Interval semantic: closed-end validity window [completed_at, expires_at] — completion
          counts only while now < expires_at. Resource: Household's education readiness. The
          same course completion becomes invalid the moment expires_at passes. A household with
          expired education CANNOT be matched even if all other criteria are met.
        test_recipe:
          setup:
            - "Program with course validity_months=12"
            - "Buyer household completed course 13 months ago → expires_at has passed"
            - "All other match criteria satisfied"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P15", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 E St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
