- section: endpoints
  instances:
  - name: contracts_list_pagination_envelope
    claim_type: pagination
    grounds:
    - response_envelope
    - endpoints
    distinguishing_aspect: GET /contracts with limit=1 returns pagination fields (limit, offset, total_count, has_more) and has_more=true when more contracts exist.
    test_recipe:
      setup:
      - three contracts exist
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-PAG-1
          product_tier: RECRUITER_LITE
          seat_cap: 1
        as: ContractAdmin
      - call: POST /contracts
        payload:
          contract_number: C-PAG-2
          product_tier: RECRUITER_LITE
          seat_cap: 1
        as: ContractAdmin
      - call: POST /contracts
        payload:
          contract_number: C-PAG-3
          product_tier: RECRUITER_LITE
          seat_cap: 1
        as: ContractAdmin
      trigger:
      - call: GET /contracts
        as: ContractAdmin
        payload:
          limit: 1
          offset: 0
      assert:
      - response carries pagination fields limit=1, offset=0, total_count=3, has_more=true
      - data array length == 1
  - name: seats_list_filter_by_status
    claim_type: filtered_list
    grounds:
    - endpoints
    - entities.Seat.fields.seat_status
    distinguishing_aspect: GET /contracts/{cid}/seats?seat_status=ASSIGNED returns only assigned seats after one of two seats is assigned.
    test_recipe:
      setup:
      - ACTIVE PRO contract with 2 seats; one assigned, one UNASSIGNED
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-EP-1
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 2
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: ep1@x.com
          full_name: EP One
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      trigger:
      - call: GET /contracts/${cid}/seats
        as: Auditor
        payload:
          seat_status: ASSIGNED
      assert:
      - list contains exactly the one assigned seat (total_count == 1)
