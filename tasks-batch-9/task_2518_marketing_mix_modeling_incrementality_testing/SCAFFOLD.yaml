# =============================================================================
# PRD-Bench Scaffold — Marketing Mix Modeling & Incrementality Testing
# Difficulty target: Expert+ (13 entities / 54 endpoints / 9 calculations /
# 6 state machines / 2 OCC races). Density over volume: every entity below is
# load-bearing for at least two cross-cutting rules.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2518. Marketing Mix Modeling & Incrementality Testing (brand marketing analytics team): data
  collection across media spend, sales, pricing, distribution and external factors with granularity
  and lag structures, model specification with adstock, saturation curves and control variables
  addressing seasonality and macro effects, channel contribution and return on investment estimation
  with confidence intervals and validation against holdouts, geographic and audience-based experiment
  design for incrementality measurement, calibration of the model against experiment results to
  correct attribution bias, budget optimization scenarios with diminishing return curves and
  constraints, refresh cadence with model retraining and stability monitoring, stakeholder reporting
  reconciling model results with platform-reported attribution

domain_name: marketing-mix-incrementality
api_prefix: /mmm

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Temporal windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every business entity is a peer collection directly under /mmm; parentage is
  # expressed purely through foreign keys, never through nested URL paths. The
  # only nested paths in §1.5 are reverse-reachability reads.

  state_machine_shape: parallel
  # ModelRun carries FOUR independent state dimensions (fit_status x
  # validation_status x calibration_status x publication_status) that evolve on
  # different triggers. DataWindow (OPEN->SEALED->REOPENED->SEALED), Experiment
  # (REJECTED->DRAFT) and GeoCell (UNASSIGNED->TREATMENT->WASHOUT->UNASSIGNED)
  # are cyclic; BudgetScenario branches OPTIMIZED->{APPROVED, INVALIDATED, DRAFT}.

  relationship_patterns:
    - one_to_many
    - self_referential      # SpendObservation.superseded_by_id, ModelRun.previous_published_run_id
    - cross_aggregate       # CalibrationRecord binds ModelRun x MediaChannel x Experiment

  role_model: segregation_of_duties
  # The AnalyticsLead who designed an Experiment may not accept its readout; the
  # AnalyticsLead who created a BudgetScenario may not approve it. Both roles can
  # legitimately perform both steps, so the constraint is per-user, not per-role.

  consistency_model: immediate

list_ordering: |
  Every list endpoint returns rows ordered by `created_at` ASC. When two rows of the
  same collection share `created_at` to the millisecond, the tie-break is the ascending
  lexicographic order of that collection's natural key: MediaChannel.channel_code,
  GeoCell.cell_code, Market.market_code, SpendObservation/SalesObservation
  (period_start_date ASC then channel_code ASC), ChannelContribution / BudgetAllocation
  (the referenced MediaChannel.channel_code ASC), DataWindow / Experiment /
  BudgetScenario / ModelRun / CalibrationRecord / ReconciliationReport
  (window_start_date / start_date / planning_start_date / created_at ASC).
  Row `id` is NEVER a sort key, a tie-break, or an allocation-order input.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MAX_HOLDOUT_POPULATION_PCT: 20            # integer comparison, see calc holdout_capacity_check
  MIN_EXPERIMENT_POWER: 0.80
  MAPE_CEILING_PCT: 12.00
  STABILITY_FLOOR: 0.6000
  MATERIALITY_PCT: 15.00
  CALIBRATION_MULTIPLIER_FLOOR: 0.25
  CALIBRATION_MULTIPLIER_CEILING: 4.00
  CALIBRATION_ALIGNMENT_BAND: 0.05
  CI_BASE_PCT: 40.0
  Z_ALPHA_TWO_SIDED: 1.96
  MARGINAL_STEP_CENTS: 100000
  MAX_REDESIGNS: 2
  MIN_SEALED_PERIOD_COUNT: 4

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Market
    parent: null
    common_fields: true
    fields:
      - name: market_code
        type: string
        source: input
        description: Uppercase snake-case brand-market identifier, globally unique.
        constraints: "matches ^[A-Z][A-Z0-9_]{2,31}$; unique across all Markets"
      - name: name
        type: string
        source: input
        description: Human-readable market name.
        constraints: "1..120 chars"
      - name: total_population
        type: integer
        source: input
        description: Addressable population of the market, denominator of every holdout-share rule.
        constraints: ">= 1000"
      - name: annual_budget_ceiling_cents
        type: integer
        source: input
        description: Hard fiscal ceiling any single BudgetScenario total_budget_cents must not exceed.
        constraints: ">= 0"
      - name: currency_code
        type: string
        source: input
        description: ISO-4217 code; reporting currency for every *_cents field on this market's rows.
        default: USD
        constraints: "3 uppercase letters"
      - name: celled_population
        type: integer
        source: computed
        description: Sum of GeoCell.population over all GeoCells whose market_id equals this Market.id.
      - name: held_out_population
        type: integer
        source: computed
        description: >-
          Sum of GeoCell.population over this Market's GeoCells whose assignment_state
          IN {TREATMENT, CONTROL, WASHOUT}. Conserved quantity of invariant
          holdout_population_conservation.
      - name: held_out_population_pct
        type: number
        source: computed
        description: round(100 * held_out_population / total_population, 2), round_half_up. Reporting only.
      - name: data_posture
        type: enum
        source: computed
        description: >-
          Derived gate over all child operations. Evaluation order is pinned in
          calculations.market_data_posture; FROZEN is checked before RESTRICTED.
        default: RESTRICTED
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: published_model_run_id
        type: string
        source: computed
        description: >-
          Id of the single ModelRun of this Market whose publication_status == PUBLISHED,
          or null when none exists. Not a stored foreign key; resolvable via
          GET /mmm/model-runs?market_id=<id>&publication_status=PUBLISHED.

  - name: MediaChannel
    parent: null
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: FK -> Market.id; the market this channel's spend and response curve belong to.
      - name: channel_code
        type: string
        source: input
        description: >-
          Uppercase snake-case channel key, unique per market_id. Sole tie-break key for
          the budget-optimization waterfall (ascending lexicographic).
        constraints: "matches ^[A-Z][A-Z0-9_]{2,31}$; unique per (market_id, channel_code)"
      - name: channel_type
        type: enum
        source: input
        description: Media family; documentation only, no behaviour keys off it.
        constraints: "one of {SEARCH, SOCIAL, VIDEO, DISPLAY, OOH, TV, RETAIL_MEDIA}"
      - name: adstock_decay_rate
        type: number
        source: input
        description: Geometric carryover weight per lag period; 2 decimal places.
        constraints: ">= 0.00 and <= 0.95, exactly 2 decimals"
      - name: adstock_max_lag_periods
        type: integer
        source: input
        description: Highest lag L included in the adstock sum; L runs 0..adstock_max_lag_periods.
        constraints: ">= 0 and <= 8"
      - name: saturation_half_point_cents
        type: integer
        source: input
        description: >-
          Per-period adstocked spend at which the Hill response reaches half of
          response_ceiling_units. Denominator anchor of every saturation term.
        constraints: "> 0"
      - name: response_ceiling_units
        type: integer
        source: input
        description: Per-period asymptotic incremental unit response of this channel.
        constraints: ">= 0"
      - name: min_spend_cents
        type: integer
        source: input
        description: Contractual per-planning-horizon spend floor honoured by budget optimization.
        constraints: ">= 0"
      - name: max_spend_cents
        type: integer
        source: input
        description: Per-planning-horizon spend ceiling honoured by budget optimization.
        constraints: ">= min_spend_cents"
      - name: status
        type: enum
        source: input
        description: >-
          ACTIVE channels may enter a ModelRun fit; PAUSED channels keep history but are
          skipped by budget optimization; RETIRED channels block a fit that includes them.
        default: ACTIVE
        constraints: "one of {ACTIVE, PAUSED, RETIRED}"

  - name: GeoCell
    parent: null
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: FK -> Market.id; the market whose population this cell partitions.
      - name: cell_code
        type: string
        source: input
        description: Uppercase cell key, unique per market_id.
        constraints: "matches ^[A-Z][A-Z0-9_]{1,15}$; unique per (market_id, cell_code)"
      - name: population
        type: integer
        source: input
        description: Population of the cell; immutable after creation.
        constraints: "> 0"
      - name: assignment_state
        type: enum
        source: computed
        description: >-
          UNASSIGNED -> TREATMENT | CONTROL on experiment assign-cells; -> WASHOUT on
          release-cells; -> UNASSIGNED on the market washout sweep. Cyclic.
        default: UNASSIGNED
        constraints: "one of {UNASSIGNED, TREATMENT, CONTROL, WASHOUT}"
      - name: assigned_experiment_id
        type: string
        source: computed
        description: >-
          FK -> Experiment.id; set when the cell enters TREATMENT or CONTROL, retained
          through WASHOUT, cleared to null by the washout sweep.
      - name: washout_until_date
        type: datetime
        source: computed
        description: >-
          ISO-8601 date (UTC midnight) computed as Experiment.end_date + Experiment.washout_days
          when the cell enters WASHOUT; null in every other assignment_state.

  - name: DataWindow
    parent: null
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: FK -> Market.id; the market whose observations this window collects.
      - name: window_start_date
        type: datetime
        source: input
        description: ISO-8601 date at UTC midnight; inclusive start of the half-open window.
      - name: window_end_date
        type: datetime
        source: input
        description: ISO-8601 date at UTC midnight; EXCLUSIVE end of the half-open window.
        constraints: "> window_start_date"
      - name: granularity
        type: enum
        source: input
        description: Period length; WEEKLY = 7 days per period, DAILY = 1 day per period.
        constraints: "one of {WEEKLY, DAILY}"
      - name: expected_period_count
        type: integer
        source: computed
        description: >-
          (window_end_date - window_start_date) in days divided by 7 for WEEKLY or by 1 for
          DAILY. Must divide evenly or the create is rejected with ERR_INVALID_REQUEST.
      - name: sales_period_count
        type: integer
        source: computed
        description: Count of SalesObservation rows whose data_window_id equals this window.
      - name: spend_observation_count
        type: integer
        source: computed
        description: Count of SpendObservation rows of this window whose superseded_by_id IS null.
      - name: lag_completeness_pct
        type: number
        source: computed
        description: >-
          round(100 * (number of the window's expected periods that carry exactly one
          SalesObservation) / expected_period_count, 2), round_half_up.
      - name: status
        type: enum
        source: computed
        description: >-
          OPEN accepts observation writes; SEALED is the only state a ModelRun may fit
          against; REOPENED re-admits writes and freezes the market. Cyclic
          OPEN->SEALED->REOPENED->SEALED.
        default: OPEN
        constraints: "one of {OPEN, SEALED, REOPENED}"
      - name: reopen_reason
        type: string
        source: input
        description: Free-text justification recorded by the most recent reopen; null before the first reopen.
      - name: reopen_count
        type: integer
        source: computed
        description: Number of OPEN/SEALED -> REOPENED transitions this window has undergone.
        default: 0

  - name: SpendObservation
    parent: null
    common_fields: true
    fields:
      - name: data_window_id
        type: string
        source: input
        description: FK -> DataWindow.id; the collection window this media-spend row lands in.
      - name: channel_id
        type: string
        source: input
        description: FK -> MediaChannel.id; the channel that spent the money.
      - name: period_start_date
        type: datetime
        source: input
        description: >-
          ISO-8601 date at UTC midnight; MUST equal window_start_date + k * period_length
          for an integer k in [0, expected_period_count).
      - name: spend_cents
        type: integer
        source: input
        description: Gross media spend for the period, in cents.
        constraints: ">= 0"
      - name: impressions
        type: integer
        source: input
        description: Delivered impressions for the period; reporting only.
        constraints: ">= 0"
      - name: price_index
        type: number
        source: input
        description: External control variable - relative own-price index for the period (100.00 = base).
      - name: distribution_index
        type: number
        source: input
        description: External control variable - relative distribution/availability index for the period.
      - name: superseded_by_id
        type: string
        source: computed
        description: >-
          FK -> SpendObservation.id; set on the older row when a later row restates the same
          (data_window_id, channel_id, period_start_date) triple. Null on the live row.
      - name: is_restatement
        type: boolean
        source: computed
        description: True when this row superseded an earlier row for the same triple.
        default: false
      - name: data_window_version_after
        type: integer
        source: system
        description: >-
          DataWindow.version immediately after this row was persisted. Lets a client chain
          optimistic-concurrency writes without re-reading the window.

  - name: SalesObservation
    parent: null
    common_fields: true
    fields:
      - name: data_window_id
        type: string
        source: input
        description: FK -> DataWindow.id; the collection window this sales row lands in.
      - name: period_start_date
        type: datetime
        source: input
        description: >-
          ISO-8601 date at UTC midnight; MUST equal window_start_date + k * period_length and
          MUST be unique within the window.
      - name: units_sold
        type: integer
        source: input
        description: Total units sold in the period; denominator of every MAPE term.
        constraints: "> 0"
      - name: revenue_cents
        type: integer
        source: input
        description: Total revenue in the period, in cents.
        constraints: ">= 0"
      - name: avg_price_cents
        type: integer
        source: computed
        description: round(revenue_cents / units_sold, 0), round_half_up; reporting only.
      - name: distribution_pct
        type: number
        source: input
        description: Weighted distribution percentage for the period (0.00..100.00).
      - name: macro_index
        type: number
        source: input
        description: External macro control variable for the period (100.00 = base).

  - name: ModelRun
    parent: null
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: FK -> Market.id; the market this run models.
      - name: data_window_id
        type: string
        source: input
        description: FK -> DataWindow.id; the training window; MUST belong to the same market_id.
      - name: previous_published_run_id
        type: string
        source: computed
        description: >-
          FK -> ModelRun.id; the run that held publication_status == PUBLISHED for this market
          at the instant this run published. Null until this run publishes, and null for the
          first ever publication in the market.
      - name: included_channel_ids
        type: array
        source: input
        description: >-
          Array of MediaChannel.id values in the run's specification. Every element MUST
          reference a MediaChannel whose market_id equals this run's market_id. Order is
          irrelevant; the fit always processes channels in ascending channel_code.
        constraints: "1..8 distinct elements"
      - name: control_variables
        type: array
        source: input
        description: >-
          Control variables the specification carries. Documented as part of the spec and
          echoed back verbatim; they do not alter the pinned contribution formula.
        constraints: "subset of {PRICE_INDEX, DISTRIBUTION_INDEX, MACRO_INDEX, SEASONALITY_WEEK_OF_YEAR}"
      - name: seasonality_mode
        type: enum
        source: input
        description: Declared seasonality treatment; part of the spec, echoed back verbatim.
        default: WEEK_OF_YEAR
        constraints: "one of {NONE, WEEK_OF_YEAR, MONTH_OF_YEAR}"
      - name: carryover_attribution_mode
        type: enum
        source: input
        description: >-
          Selects which of the two valid contribution decompositions the fit uses.
          EFFECT_PERIOD credits a period with the adstock that materialised in it;
          SPEND_PERIOD credits a period with every future effect its own spend generates.
        default: EFFECT_PERIOD
        constraints: "one of {EFFECT_PERIOD, SPEND_PERIOD}"
      - name: holdout_periods
        type: integer
        source: input
        description: Number of trailing periods of the window scored by the holdout backtest.
        default: 1
        constraints: ">= 1 and < DataWindow.expected_period_count"
      - name: fit_status
        type: enum
        source: computed
        description: >-
          Dimension 1 of 4. PENDING -> FITTED on fit; FITTED -> STALE_FIT when the training
          window reopens; STALE_FIT -> FITTED on a re-fit.
        default: PENDING
        constraints: "one of {PENDING, FITTED, STALE_FIT}"
      - name: validation_status
        type: enum
        source: computed
        description: >-
          Dimension 2 of 4. UNVALIDATED -> HOLDOUT_PASSED | HOLDOUT_FAILED on validate;
          reset to UNVALIDATED by any fit or by a training-window reopen.
        default: UNVALIDATED
        constraints: "one of {UNVALIDATED, HOLDOUT_PASSED, HOLDOUT_FAILED}"
      - name: calibration_status
        type: enum
        source: computed
        description: >-
          Dimension 3 of 4. NOT_REQUIRED -> PENDING_CALIBRATION when a CalibrationRecord is
          filed; PENDING_CALIBRATION -> CALIBRATED on recalibrate; CALIBRATED -> STALE when a
          new Experiment readout is accepted; STALE -> PENDING_CALIBRATION on the next record.
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, PENDING_CALIBRATION, CALIBRATED, STALE}"
      - name: publication_status
        type: enum
        source: computed
        description: >-
          Dimension 4 of 4. UNPUBLISHED -> PUBLISHED on publish; PUBLISHED -> SUPERSEDED when
          another run of the same market publishes. SUPERSEDED is terminal for this dimension.
        default: UNPUBLISHED
        constraints: "one of {UNPUBLISHED, PUBLISHED, SUPERSEDED}"
      - name: unit_price_cents
        type: integer
        source: computed
        description: >-
          round(sum(SalesObservation.revenue_cents) / sum(SalesObservation.units_sold), 0)
          round_half_up over every SalesObservation of the training window.
      - name: modeled_sales_units
        type: integer
        source: computed
        description: Sum of SalesObservation.units_sold over every period of the training window.
      - name: baseline_sales_units
        type: number
        source: computed
        description: >-
          modeled_sales_units minus the sum of every included channel's contribution_units,
          rounded to 4 decimals. Conserved quantity of invariant contribution_decomposition_closure.
      - name: observation_period_count
        type: integer
        source: computed
        description: Count of SalesObservation rows in the training window; denominator of the CI width.
      - name: holdout_mape_pct
        type: number
        source: computed
        description: Mean absolute percentage error over the trailing holdout_periods, 2 decimals.
      - name: stability_score
        type: number
        source: computed
        description: >-
          Refresh-cadence stability of this run's ROI vector against previous_published_run_id,
          4 decimals, floored at 0.0000. Exactly 1.0000 when the market has no prior publication.
      - name: refresh_generation
        type: integer
        source: computed
        description: 1 for the market's first publication, previous run's refresh_generation + 1 thereafter.
        default: 1
      - name: fitted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the Modeler whose fit call last produced contributions.
      - name: published_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the AnalyticsLead who published this run; null while UNPUBLISHED.

  - name: ChannelContribution
    parent: null
    common_fields: true
    fields:
      - name: model_run_id
        type: string
        source: input
        description: FK -> ModelRun.id; the run whose fit produced this row.
      - name: channel_id
        type: string
        source: input
        description: FK -> MediaChannel.id; the channel this decomposition line belongs to.
      - name: attribution_mode_used
        type: enum
        source: computed
        description: Copy of the ModelRun.carryover_attribution_mode in force when the row was produced.
        constraints: "one of {EFFECT_PERIOD, SPEND_PERIOD}"
      - name: adstocked_spend_series
        type: array
        source: computed
        description: >-
          Integer cents per window period, in ascending period_start_date order, produced by
          calculations.adstock_transform under attribution_mode_used.
      - name: mean_adstocked_spend_cents
        type: integer
        source: computed
        description: round(sum(adstocked_spend_series) / expected_period_count, 0), round_half_up.
      - name: contribution_units
        type: number
        source: computed
        description: Uncalibrated incremental units attributed to this channel over the window, 4 decimals.
      - name: calibrated_contribution_units
        type: number
        source: computed
        description: >-
          round(contribution_units * CalibrationRecord.calibration_multiplier, 4) after a
          recalibrate; equal to contribution_units while the run is NOT_REQUIRED or
          PENDING_CALIBRATION.
      - name: contribution_revenue_cents
        type: integer
        source: computed
        description: round(contribution_units * ModelRun.unit_price_cents, 0), round_half_up.
      - name: calibrated_contribution_revenue_cents
        type: integer
        source: computed
        description: round(calibrated_contribution_units * ModelRun.unit_price_cents, 0), round_half_up.
      - name: attributed_spend_cents
        type: integer
        source: computed
        description: >-
          Sum of spend_cents over this channel's SpendObservation rows in the training window
          whose superseded_by_id IS null.
      - name: average_roi
        type: number
        source: computed
        description: >-
          round(contribution_revenue_cents / attributed_spend_cents, 4); exactly 0.0000 when
          attributed_spend_cents == 0.
      - name: marginal_roi
        type: number
        source: computed
        description: Revenue per additional cent at mean_adstocked_spend_cents, 6 decimals.
      - name: ci_half_width_pct
        type: number
        source: computed
        description: round(CI_BASE_PCT / sqrt(ModelRun.observation_period_count), 2), round_half_up.
      - name: ci_low_units
        type: number
        source: computed
        description: round(contribution_units * (1 - ci_half_width_pct / 100), 4).
      - name: ci_high_units
        type: number
        source: computed
        description: round(contribution_units * (1 + ci_half_width_pct / 100), 4).
      - name: is_current
        type: boolean
        source: computed
        description: >-
          False once the producing run's fit_status leaves FITTED or its publication_status
          becomes SUPERSEDED; a re-fit produces a fresh row set with is_current true.
        default: true

  - name: Experiment
    parent: null
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: FK -> Market.id; the market whose geography or audience is split.
      - name: channel_id
        type: string
        source: input
        description: >-
          FK -> MediaChannel.id; the single channel whose incrementality is measured. MUST
          belong to market_id.
      - name: design_type
        type: enum
        source: input
        description: >-
          GEO_HOLDOUT consumes GeoCell population; AUDIENCE_SPLIT declares its arm populations
          directly and consumes no GeoCells.
        constraints: "one of {GEO_HOLDOUT, AUDIENCE_SPLIT}"
      - name: readout_method
        type: enum
        source: input
        description: Selects which of the two valid lift estimators the readout applies.
        constraints: "one of {DIFF_IN_DIFF, SYNTHETIC_CONTROL}"
      - name: start_date
        type: datetime
        source: input
        description: ISO-8601 date at UTC midnight; inclusive first in-market day of the test.
      - name: end_date
        type: datetime
        source: input
        description: ISO-8601 date at UTC midnight; EXCLUSIVE end of the in-market period.
        constraints: "> start_date"
      - name: washout_days
        type: integer
        source: input
        description: >-
          Adstock carryover quarantine appended to end_date. Extends the interval this
          experiment occupies on its channel and delays cell release.
        constraints: ">= 0 and <= 60"
      - name: minimum_detectable_effect_pct
        type: number
        source: input
        description: Relative lift the design must be able to detect, in percent (1 decimal).
        constraints: "> 0.0 and <= 100.0"
      - name: baseline_conversion_rate
        type: number
        source: input
        description: Pre-test conversion rate per person, 4 decimals; must be strictly inside (0, 1).
        constraints: "> 0.0000 and < 1.0000"
      - name: planned_treatment_population
        type: integer
        source: input
        description: Population the design assumes in the treatment arm.
        constraints: "> 0"
      - name: planned_control_population
        type: integer
        source: input
        description: Population the design assumes in the control arm.
        constraints: "> 0"
      - name: power_index
        type: number
        source: computed
        description: Standardised effect size of the design, 4 decimals; input to the power step table.
      - name: computed_power
        type: number
        source: computed
        description: Statistical power read off POWER_INDEX_TABLE, 4 decimals; set by lock-design.
      - name: treatment_population
        type: integer
        source: computed
        description: >-
          Realised treatment-arm population. For AUDIENCE_SPLIT it is copied from
          planned_treatment_population by lock-design; for GEO_HOLDOUT it is the summed
          population of the treatment cells and stays 0 until assign-cells.
        default: 0
      - name: control_population
        type: integer
        source: computed
        description: >-
          Realised control-arm population. For AUDIENCE_SPLIT it is copied from
          planned_control_population by lock-design; for GEO_HOLDOUT it is the summed
          population of the control cells and stays 0 until assign-cells.
        default: 0
      - name: treatment_conversions
        type: integer
        source: input
        description: In-test conversions observed in the treatment arm; supplied at read-out.
        constraints: ">= 0 and <= treatment_population"
      - name: control_conversions
        type: integer
        source: input
        description: In-test conversions observed in the control arm; supplied at read-out.
        constraints: "> 0 and <= control_population"
      - name: pre_treatment_conversions
        type: integer
        source: input
        description: Pre-period conversions in the treatment arm; supplied at read-out.
        constraints: ">= 0 and <= treatment_population"
      - name: pre_control_conversions
        type: integer
        source: input
        description: Pre-period conversions in the control arm; supplied at read-out.
        constraints: "> 0 and <= control_population"
      - name: synthetic_control_weight
        type: number
        source: computed
        description: >-
          round(pre_treatment_rate / pre_control_rate, 6), derived at read-out from the two
          pre-period counts; populated only when readout_method is SYNTHETIC_CONTROL, null
          otherwise. Never accepted from the request body.
      - name: measured_lift_pct
        type: number
        source: computed
        description: Incremental lift in percent, 2 decimals, per the selected readout_method.
      - name: lift_ci_half_width_pct
        type: number
        source: computed
        description: Two-sided 95% half width in lift-percent points, 2 decimals.
      - name: lift_ci_low_pct
        type: number
        source: computed
        description: round(measured_lift_pct - lift_ci_half_width_pct, 2).
      - name: lift_ci_high_pct
        type: number
        source: computed
        description: round(measured_lift_pct + lift_ci_half_width_pct, 2).
      - name: status
        type: enum
        source: computed
        description: >-
          DRAFT -> DESIGN_LOCKED -> CELLS_ASSIGNED -> RUNNING -> READ_OUT ->
          {ACCEPTED, REJECTED}; ACCEPTED -> CLOSED and REJECTED -> DRAFT both via
          release-cells, making the machine cyclic.
        default: DRAFT
        constraints: "one of {DRAFT, DESIGN_LOCKED, CELLS_ASSIGNED, RUNNING, READ_OUT, ACCEPTED, REJECTED, CLOSED}"
      - name: redesign_count
        type: integer
        source: computed
        description: Number of REJECTED -> DRAFT loops this experiment has taken.
        default: 0
      - name: designed_by_user_id
        type: string
        source: system
        description: >-
          Opaque X-User-ID captured at create. The accept step rejects an actor whose
          X-User-ID equals this value (segregation of duties).
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the AnalyticsLead who accepted or rejected the readout.
      - name: rejection_reason
        type: string
        source: input
        description: Free-text justification supplied with reject; null otherwise.

  - name: CalibrationRecord
    parent: null
    common_fields: true
    fields:
      - name: model_run_id
        type: string
        source: input
        description: FK -> ModelRun.id; the run whose channel attribution this record corrects.
      - name: channel_id
        type: string
        source: input
        description: >-
          FK -> MediaChannel.id; MUST appear in the run's included_channel_ids and MUST equal
          the experiment's channel_id.
      - name: experiment_id
        type: string
        source: input
        description: FK -> Experiment.id; the ACCEPTED readout that supplies the ground-truth lift.
      - name: experiment_lift_pct
        type: number
        source: computed
        description: Copy of Experiment.measured_lift_pct at the instant the record was filed.
      - name: model_implied_lift_pct
        type: number
        source: computed
        description: >-
          round(100 * contribution_units / (ModelRun.modeled_sales_units - contribution_units), 4)
          using the run's current ChannelContribution for channel_id.
      - name: calibration_multiplier
        type: number
        source: computed
        description: >-
          round(experiment_lift_pct / model_implied_lift_pct, 4), then clamped to
          [CALIBRATION_MULTIPLIER_FLOOR, CALIBRATION_MULTIPLIER_CEILING].
      - name: bias_direction
        type: enum
        source: computed
        description: >-
          OVER_ATTRIBUTED when calibration_multiplier < 1 - CALIBRATION_ALIGNMENT_BAND;
          UNDER_ATTRIBUTED when > 1 + CALIBRATION_ALIGNMENT_BAND; ALIGNED inclusive between.
        constraints: "one of {OVER_ATTRIBUTED, UNDER_ATTRIBUTED, ALIGNED}"
      - name: superseded
        type: boolean
        source: computed
        description: True once a newer record is filed for the same (model_run_id, channel_id) pair.
        default: false
      - name: model_run_version_after
        type: integer
        source: system
        description: >-
          ModelRun.version immediately after this record was persisted; lets a client chain
          optimistic-concurrency writes without re-reading the run.
      - name: created_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the AnalyticsLead who filed the record.

  - name: BudgetScenario
    parent: null
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: FK -> Market.id; the market being planned.
      - name: model_run_id
        type: string
        source: input
        description: >-
          FK -> ModelRun.id; the run whose response curves drive the optimizer. MUST belong to
          the same market_id.
      - name: total_budget_cents
        type: integer
        source: input
        description: Total planning budget; the conserved quantity of invariant budget_cent_conservation.
        constraints: "> 0"
      - name: planning_start_date
        type: datetime
        source: input
        description: ISO-8601 date at UTC midnight; inclusive start of the planning horizon.
      - name: planning_end_date
        type: datetime
        source: input
        description: ISO-8601 date at UTC midnight; EXCLUSIVE end of the planning horizon.
        constraints: "> planning_start_date"
      - name: planning_period_count
        type: integer
        source: computed
        description: >-
          Horizon length divided by the referenced ModelRun's DataWindow period length; must
          divide evenly or the create is rejected with ERR_INVALID_REQUEST.
      - name: reallocation_fee_pct
        type: number
        source: input
        description: >-
          Agency re-planning fee charged on shifted dollars, in percent, 2 decimals. Drawn out
          of total_budget_cents, which is what makes the optimization circular-looking.
        constraints: ">= 0.00 and <= 5.00"
      - name: reallocation_fee_cents
        type: integer
        source: computed
        description: Fee pinned from PASS 1 of calculations.budget_optimization; 0 while DRAFT.
        default: 0
      - name: allocated_total_cents
        type: integer
        source: computed
        description: Sum of BudgetAllocation.allocated_cents over this scenario's allocations.
      - name: unallocated_cents
        type: integer
        source: computed
        description: total_budget_cents - reallocation_fee_cents - allocated_total_cents.
      - name: shifted_total_cents
        type: integer
        source: computed
        description: Sum of BudgetAllocation.shifted_cents after PASS 2; reporting only.
      - name: projected_contribution_units
        type: number
        source: computed
        description: Sum of BudgetAllocation.projected_contribution_units, 4 decimals.
      - name: projected_incremental_revenue_cents
        type: integer
        source: computed
        description: round(projected_contribution_units * ModelRun.unit_price_cents, 0), round_half_up.
      - name: status
        type: enum
        source: computed
        description: >-
          DRAFT <-> OPTIMIZED; OPTIMIZED -> APPROVED; OPTIMIZED -> FROZEN when the market
          posture leaves OPEN and FROZEN -> DRAFT when it returns (a DRAFT scenario is NOT
          frozen - it holds no optimizer output to unwind, so it stays writable and its
          optimize attempt is what surfaces ERR_MARKET_POSTURE_BLOCKED); OPTIMIZED|APPROVED ->
          INVALIDATED when the referenced run's contributions stop being current.
        default: DRAFT
        constraints: "one of {DRAFT, OPTIMIZED, FROZEN, APPROVED, INVALIDATED}"
      - name: created_by_user_id
        type: string
        source: system
        description: >-
          Opaque X-User-ID captured at create. The approve step rejects an actor whose
          X-User-ID equals this value (segregation of duties).
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the AnalyticsLead who approved the scenario; null otherwise.

  - name: BudgetAllocation
    parent: null
    common_fields: true
    fields:
      - name: budget_scenario_id
        type: string
        source: input
        description: FK -> BudgetScenario.id; the scenario this per-channel line belongs to.
      - name: channel_id
        type: string
        source: input
        description: >-
          FK -> MediaChannel.id; MUST appear in the scenario's ModelRun.included_channel_ids.
      - name: baseline_spend_cents
        type: integer
        source: input
        description: >-
          Current plan for this channel over the horizon, supplied through the parent
          scenario's baseline_allocations array. Restored verbatim by revert-optimization.
        constraints: ">= 0"
      - name: allocated_cents
        type: integer
        source: computed
        description: >-
          Optimizer output after PASS 2; equal to baseline_spend_cents while the scenario is
          DRAFT and after revert-optimization.
      - name: shifted_cents
        type: integer
        source: computed
        description: abs(allocated_cents - baseline_spend_cents); 0 while DRAFT.
        default: 0
      - name: projected_contribution_units
        type: number
        source: computed
        description: round(response_curve(channel, allocated_cents), 4) over the planning horizon.
      - name: constraint_binding
        type: enum
        source: computed
        description: >-
          FLOOR when allocated_cents == MediaChannel.min_spend_cents, CEILING when it equals
          max_spend_cents, NONE otherwise. FLOOR wins when the floor equals the ceiling.
        default: NONE
        constraints: "one of {NONE, FLOOR, CEILING}"

  - name: ReconciliationReport
    parent: null
    common_fields: true
    fields:
      - name: model_run_id
        type: string
        source: input
        description: FK -> ModelRun.id; the PUBLISHED run whose attribution is reconciled.
      - name: reporting_period_start
        type: datetime
        source: input
        description: ISO-8601 date at UTC midnight; inclusive start of the stakeholder reporting period.
      - name: reporting_period_end
        type: datetime
        source: input
        description: ISO-8601 date at UTC midnight; EXCLUSIVE end of the reporting period.
        constraints: "> reporting_period_start"
      - name: platform_lines
        type: array
        source: input
        description: >-
          Input objects { channel_id, platform_revenue_cents }. Exactly one entry per
          is_current ChannelContribution of the run; a missing or extra channel is
          ERR_PLATFORM_LINE_MISMATCH.
      - name: variance_lines
        type: array
        source: computed
        description: >-
          Computed objects { channel_id, model_cents, platform_revenue_cents, variance_cents,
          variance_pct } in ascending MediaChannel.channel_code order.
      - name: platform_reported_revenue_cents
        type: integer
        source: computed
        description: Sum of variance_lines[].platform_revenue_cents.
      - name: model_attributed_revenue_cents
        type: integer
        source: computed
        description: Sum of variance_lines[].model_cents.
      - name: total_variance_cents
        type: integer
        source: computed
        description: >-
          Sum of variance_lines[].variance_cents. Exact integer arithmetic, no rounding.
      - name: weighted_variance_pct
        type: number
        source: computed
        description: >-
          Revenue-weighted mean of the ALREADY-ROUNDED variance_pct values, then rounded
          to 2 decimals. The round-per-line-then-weight order is pinned; the
          weight-then-round order is explicitly rejected.
      - name: attribution_gap_flag
        type: enum
        source: computed
        description: >-
          MATERIAL when abs(weighted_variance_pct) >= MATERIALITY_PCT, IMMATERIAL otherwise.
        constraints: "one of {MATERIAL, IMMATERIAL}"
      - name: basis
        type: enum
        source: computed
        description: >-
          CALIBRATED when the run's calibration_status == CALIBRATED (calibrated revenue used),
          RAW in every other calibration_status.
        constraints: "one of {RAW, CALIBRATED}"
      - name: status
        type: enum
        source: computed
        description: >-
          CURRENT at create; flips to STALE when the run becomes SUPERSEDED or its
          calibration_status becomes STALE. STALE is terminal.
        default: CURRENT
        constraints: "one of {CURRENT, STALE}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: DataWindow
    initial_state: OPEN
    terminal_states: []
    note: >-
      Cyclic. The REOPENED state is the market's data-integrity breach marker: while any
      window of a market is REOPENED the market posture is FROZEN.
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /mmm/data-windows/{id}/seal"
        actor: DataEngineer
        preconditions:
          - "current_utc >= window_end_date, else ERR_DATA_WINDOW_NOT_ELAPSED"
          - "sales_period_count >= MIN_SEALED_PERIOD_COUNT (4), else ERR_DATA_WINDOW_INCOMPLETE"
          - "lag_completeness_pct == 100.00, else ERR_DATA_WINDOW_INCOMPLETE"
        side_effects:
          - "status := SEALED; version += 1"
          - "recompute Market.data_posture (a first SEALED window can lift RESTRICTED to OPEN)"
      - from: SEALED
        to: REOPENED
        trigger: "POST /mmm/data-windows/{id}/reopen"
        actor: DataEngineer
        preconditions:
          - "status == SEALED, else ERR_DATA_WINDOW_INVALID_STATE"
        side_effects:
          - "status := REOPENED; reopen_count += 1; reopen_reason := body.reason; version += 1"
          - "CASCADE HOP 1: every ModelRun with data_window_id == this window and fit_status == FITTED gets fit_status := STALE_FIT and validation_status := UNVALIDATED"
          - "CASCADE HOP 2 (caused by HOP 1): each such run's ChannelContribution rows get is_current := false"
          - "CASCADE HOP 3 (caused by HOP 2): every BudgetScenario whose model_run_id is one of those runs and whose status IN {OPTIMIZED, APPROVED} gets status := INVALIDATED"
          - "recompute Market.data_posture -> FROZEN (a REOPENED window exists)"
          - "CASCADE HOP 4 (caused by the posture change): every BudgetScenario of the market with status == OPTIMIZED gets status := FROZEN (DRAFT scenarios are untouched)"
      - from: REOPENED
        to: SEALED
        trigger: "POST /mmm/data-windows/{id}/seal"
        actor: DataEngineer
        preconditions:
          - "current_utc >= window_end_date, else ERR_DATA_WINDOW_NOT_ELAPSED"
          - "sales_period_count >= MIN_SEALED_PERIOD_COUNT (4), else ERR_DATA_WINDOW_INCOMPLETE"
          - "lag_completeness_pct == 100.00, else ERR_DATA_WINDOW_INCOMPLETE"
        side_effects:
          - "status := SEALED; version += 1"
          - "recompute Market.data_posture; when no other window of the market is REOPENED the posture leaves FROZEN"
          - "CASCADE (caused by the posture leaving FROZEN): every BudgetScenario of the market with status == FROZEN gets status := DRAFT with allocated_cents restored to baseline_spend_cents and reallocation_fee_cents := 0"

  - entity: ModelRun
    initial_state: "fit_status=PENDING, validation_status=UNVALIDATED, calibration_status=NOT_REQUIRED, publication_status=UNPUBLISHED"
    terminal_states: ["publication_status=SUPERSEDED"]
    note: >-
      FOUR parallel state dimensions on one row. fit_status is driven by fit and by training
      window reopens; validation_status branches on the holdout backtest; calibration_status
      cycles through experiment calibration; publication_status is the only dimension with a
      terminal value. No transition in one dimension implies a transition in another except
      where listed in side_effects.
    transitions:
      - from: "fit_status=PENDING"
        to: "fit_status=FITTED"
        trigger: "POST /mmm/model-runs/{id}/fit"
        actor: Modeler
        preconditions:
          - "DataWindow.status == SEALED, else ERR_DATA_WINDOW_NOT_SEALED"
          - "every included channel has status IN {ACTIVE, PAUSED}, else ERR_CHANNEL_RETIRED"
          - "every included channel has market_id == run.market_id, else ERR_CHANNEL_NOT_IN_MARKET"
          - "DataWindow.expected_period_count > max(adstock_max_lag_periods over included channels), else ERR_LAG_WINDOW_INCOMPLETE"
          - "every included channel has >= 1 non-superseded SpendObservation in the window, else ERR_NO_SPEND_OBSERVATIONS"
          - "computed baseline_sales_units >= 0, else ERR_MODEL_BASELINE_NEGATIVE and no row is written"
        side_effects:
          - "unit_price_cents, modeled_sales_units, observation_period_count recomputed (calculations.model_run_aggregates)"
          - "one ChannelContribution row per included channel created in ascending channel_code order (calculations.channel_contribution_decomposition, calculations.adstock_transform, calculations.roi_estimation, calculations.contribution_confidence_interval)"
          - "baseline_sales_units recomputed so contributions + baseline == modeled_sales_units"
          - "fit_status := FITTED; validation_status := UNVALIDATED; holdout_mape_pct := null"
          - "fitted_by_user_id := X-User-ID; version += 1"
      - from: "fit_status=FITTED"
        to: "fit_status=STALE_FIT"
        trigger: "system event: the run's DataWindow transitions SEALED -> REOPENED"
        actor: system
        preconditions:
          - "fit_status == FITTED"
        side_effects:
          - "fit_status := STALE_FIT; validation_status := UNVALIDATED; version += 1"
          - "every ChannelContribution of this run gets is_current := false"
      - from: "fit_status=STALE_FIT"
        to: "fit_status=FITTED"
        trigger: "POST /mmm/model-runs/{id}/fit"
        actor: Modeler
        preconditions:
          - "DataWindow.status == SEALED, else ERR_DATA_WINDOW_NOT_SEALED"
          - "same channel, lag and observation preconditions as the PENDING -> FITTED transition"
        side_effects:
          - "the previous ChannelContribution row set is deleted and replaced by a freshly computed set with is_current := true"
          - "fit_status := FITTED; validation_status := UNVALIDATED; version += 1"
      - from: "validation_status=UNVALIDATED"
        to: "validation_status=HOLDOUT_PASSED"
        trigger: "POST /mmm/model-runs/{id}/validate"
        actor: Modeler
        preconditions:
          - "fit_status == FITTED, else ERR_MODEL_RUN_INVALID_STATE"
          - "computed holdout_mape_pct <= MAPE_CEILING_PCT (12.00)"
        side_effects:
          - "holdout_mape_pct recomputed (calculations.holdout_backtest); validation_status := HOLDOUT_PASSED; version += 1"
      - from: "validation_status=UNVALIDATED"
        to: "validation_status=HOLDOUT_FAILED"
        trigger: "POST /mmm/model-runs/{id}/validate"
        actor: Modeler
        preconditions:
          - "fit_status == FITTED, else ERR_MODEL_RUN_INVALID_STATE"
          - "computed holdout_mape_pct > MAPE_CEILING_PCT (12.00)"
        side_effects:
          - "holdout_mape_pct recomputed; validation_status := HOLDOUT_FAILED; version += 1"
        note: "Branching fork - the same trigger reaches two different states with different downstream rights; only HOLDOUT_PASSED may publish."
      - from: "publication_status=UNPUBLISHED"
        to: "publication_status=PUBLISHED"
        trigger: "POST /mmm/model-runs/{id}/publish"
        actor: AnalyticsLead
        preconditions:
          - "fit_status == FITTED, else ERR_MODEL_RUN_INVALID_STATE"
          - "validation_status == HOLDOUT_PASSED, else ERR_HOLDOUT_NOT_PASSED"
          - "Market.data_posture != FROZEN, else ERR_MARKET_POSTURE_BLOCKED"
          - "stability_score >= STABILITY_FLOOR (0.6000) OR body.override_stability == true, else ERR_MODEL_UNSTABLE"
        side_effects:
          - "previous_published_run_id := the market's current PUBLISHED run id (null when none); stability_score and refresh_generation computed (calculations.refresh_stability)"
          - "publication_status := PUBLISHED; published_by_user_id := X-User-ID; version += 1"
          - "CASCADE HOP 1: the market's previously PUBLISHED run (if any) gets publication_status := SUPERSEDED"
          - "CASCADE HOP 2 (caused by HOP 1): the superseded run's ChannelContribution rows get is_current := false, and its ReconciliationReport rows with status == CURRENT get status := STALE"
          - "CASCADE HOP 3 (caused by HOP 2): every BudgetScenario whose model_run_id is the superseded run and whose status IN {OPTIMIZED, APPROVED} gets status := INVALIDATED"
          - "recompute Market.data_posture and Market.published_model_run_id"
      - from: "publication_status=PUBLISHED"
        to: "publication_status=SUPERSEDED"
        trigger: "system event: another ModelRun of the same market publishes"
        actor: system
        preconditions:
          - "publication_status == PUBLISHED"
        side_effects:
          - "publication_status := SUPERSEDED; version += 1"
          - "ChannelContribution rows of this run get is_current := false"
          - "ReconciliationReport rows of this run with status == CURRENT get status := STALE"
      - from: "calibration_status=NOT_REQUIRED"
        to: "calibration_status=PENDING_CALIBRATION"
        trigger: "system event: POST /mmm/calibration-records files a record against this run"
        actor: system
        preconditions:
          - "calibration_status IN {NOT_REQUIRED, CALIBRATED, STALE, PENDING_CALIBRATION}"
        side_effects:
          - "calibration_status := PENDING_CALIBRATION; version += 1 (this is the version bump the OCC rule calibration-record-stale-model-run observes)"
          - "recompute Market.data_posture when this run is the market's PUBLISHED run"
      - from: "calibration_status=PENDING_CALIBRATION"
        to: "calibration_status=CALIBRATED"
        trigger: "POST /mmm/model-runs/{id}/recalibrate"
        actor: Modeler
        preconditions:
          - "fit_status == FITTED, else ERR_MODEL_RUN_INVALID_STATE"
          - "calibration_status == PENDING_CALIBRATION, else ERR_CALIBRATION_NOT_PENDING"
          - "resulting baseline_sales_units >= 0, else ERR_MODEL_BASELINE_NEGATIVE"
        side_effects:
          - "for every channel with a non-superseded CalibrationRecord on this run, calibrated_contribution_units and calibrated_contribution_revenue_cents recomputed (calculations.calibration_application)"
          - "baseline_sales_units recomputed so calibrated contributions + baseline == modeled_sales_units"
          - "calibration_status := CALIBRATED; version += 1"
          - "recompute Market.data_posture (a CALIBRATED published run can restore OPEN)"
      - from: "calibration_status=CALIBRATED"
        to: "calibration_status=STALE"
        trigger: "system event: POST /mmm/experiments/{id}/accept accepts a readout for this market"
        actor: system
        preconditions:
          - "this run is the market's PUBLISHED run and calibration_status == CALIBRATED"
        side_effects:
          - "calibration_status := STALE; version += 1"
          - "CASCADE: this run's ReconciliationReport rows with status == CURRENT get status := STALE"
          - "recompute Market.data_posture -> RESTRICTED"

  - entity: Experiment
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: >-
      Branching at READ_OUT (accept vs reject) and cyclic on the reject arm
      (REJECTED -> DRAFT), bounded by MAX_REDESIGNS (2). CLOSED is terminal.
    transitions:
      - from: DRAFT
        to: DESIGN_LOCKED
        trigger: "POST /mmm/experiments/{id}/lock-design"
        actor: ExperimentDesigner
        preconditions:
          - "status == DRAFT, else ERR_EXPERIMENT_INVALID_STATE"
          - "Market.data_posture != FROZEN, else ERR_MARKET_POSTURE_BLOCKED"
          - "computed_power >= MIN_EXPERIMENT_POWER (0.80), else ERR_EXPERIMENT_UNDERPOWERED (priority 52, evaluated BEFORE the holdout-share ceiling at priority 60)"
          - "for GEO_HOLDOUT: (Market.held_out_population + planned_treatment_population + planned_control_population) * 100 <= MAX_HOLDOUT_POPULATION_PCT * Market.total_population, else ERR_HOLDOUT_SHARE_EXCEEDED"
          - "no other Experiment on the same (market_id, channel_id) with status IN {DESIGN_LOCKED, CELLS_ASSIGNED, RUNNING, READ_OUT, ACCEPTED} occupies an overlapping interval, else ERR_EXPERIMENT_WINDOW_CONFLICT (a DRAFT sibling reserves nothing)"
        side_effects:
          - "power_index and computed_power recomputed and frozen (calculations.experiment_power)"
          - "for design_type == AUDIENCE_SPLIT: treatment_population := planned_treatment_population and control_population := planned_control_population (a GEO_HOLDOUT design leaves both at 0 until assign-cells consumes real GeoCells)"
          - "status := DESIGN_LOCKED; version += 1"
      - from: DESIGN_LOCKED
        to: CELLS_ASSIGNED
        trigger: "POST /mmm/experiments/{id}/assign-cells"
        actor: ExperimentDesigner
        preconditions:
          - "status == DESIGN_LOCKED, else ERR_EXPERIMENT_INVALID_STATE"
          - "design_type == GEO_HOLDOUT, else ERR_DESIGN_TYPE_MISMATCH"
          - "every body cell id exists and has market_id == experiment.market_id, else ERR_GEO_CELL_NOT_IN_MARKET"
          - "every body cell has assignment_state == UNASSIGNED, else ERR_GEO_CELL_UNAVAILABLE"
          - "(Market.held_out_population + sum of the body cells' population) * 100 <= MAX_HOLDOUT_POPULATION_PCT * Market.total_population, else ERR_HOLDOUT_SHARE_EXCEEDED"
        side_effects:
          - "each listed treatment cell gets assignment_state := TREATMENT, each listed control cell gets assignment_state := CONTROL, both with assigned_experiment_id := experiment.id"
          - "treatment_population := sum of treatment cell populations; control_population := sum of control cell populations"
          - "Market.held_out_population and held_out_population_pct recomputed"
          - "status := CELLS_ASSIGNED; version += 1"
      - from: DESIGN_LOCKED
        to: RUNNING
        trigger: "POST /mmm/experiments/{id}/start"
        actor: ExperimentDesigner
        preconditions:
          - "status == DESIGN_LOCKED, else ERR_EXPERIMENT_INVALID_STATE"
          - "design_type == AUDIENCE_SPLIT, else ERR_CELLS_NOT_ASSIGNED"
          - "current_utc >= start_date, else ERR_EXPERIMENT_NOT_STARTED"
        side_effects:
          - "treatment_population := planned_treatment_population; control_population := planned_control_population"
          - "status := RUNNING; version += 1"
        note: "Branching fork out of DESIGN_LOCKED: GEO_HOLDOUT must pass through CELLS_ASSIGNED, AUDIENCE_SPLIT goes straight to RUNNING."
      - from: CELLS_ASSIGNED
        to: RUNNING
        trigger: "POST /mmm/experiments/{id}/start"
        actor: ExperimentDesigner
        preconditions:
          - "status == CELLS_ASSIGNED, else ERR_EXPERIMENT_INVALID_STATE"
          - "current_utc >= start_date, else ERR_EXPERIMENT_NOT_STARTED"
        side_effects:
          - "status := RUNNING; version += 1"
      - from: RUNNING
        to: READ_OUT
        trigger: "POST /mmm/experiments/{id}/read-out"
        actor: ExperimentDesigner
        preconditions:
          - "status == RUNNING, else ERR_EXPERIMENT_INVALID_STATE"
          - "current_utc >= end_date, else ERR_EXPERIMENT_NOT_ELAPSED"
          - "treatment_conversions <= treatment_population and control_conversions <= control_population, else ERR_CONVERSIONS_EXCEED_POPULATION"
        side_effects:
          - "the four conversion counts are stored from the body"
          - "for readout_method == SYNTHETIC_CONTROL: synthetic_control_weight := round(pre_treatment_conversions / pre_control_conversions, 6) (equivalently t_pre / c_pre, since each arm divides by its own population); it stays null for DIFF_IN_DIFF"
          - "measured_lift_pct, lift_ci_half_width_pct, lift_ci_low_pct, lift_ci_high_pct computed by the variant named in readout_method (calculations.experiment_lift_readout)"
          - "status := READ_OUT; version += 1"
      - from: READ_OUT
        to: ACCEPTED
        trigger: "POST /mmm/experiments/{id}/accept"
        actor: AnalyticsLead
        preconditions:
          - "status == READ_OUT, else ERR_EXPERIMENT_INVALID_STATE"
          - "X-User-ID != designed_by_user_id, else ERR_SEGREGATION_OF_DUTIES (priority 22)"
          - "the market has a ModelRun with publication_status == PUBLISHED, else ERR_NO_PUBLISHED_MODEL_RUN"
          - "lift_ci_low_pct > 0.00, else ERR_LIFT_NOT_SIGNIFICANT"
        side_effects:
          - "status := ACCEPTED; decided_by_user_id := X-User-ID; version += 1"
          - "CASCADE HOP 1: the market's PUBLISHED ModelRun with calibration_status == CALIBRATED gets calibration_status := STALE"
          - "CASCADE HOP 2 (caused by HOP 1): that run's ReconciliationReport rows with status == CURRENT get status := STALE, and Market.data_posture is recomputed from OPEN to RESTRICTED"
          - "CASCADE HOP 3 (caused by the posture leaving OPEN): every BudgetScenario of the market with status == OPTIMIZED gets status := FROZEN, allocated_cents of each of its BudgetAllocation rows reset to baseline_spend_cents, reallocation_fee_cents := 0, unallocated_cents := 0 (DRAFT scenarios are untouched)"
      - from: READ_OUT
        to: REJECTED
        trigger: "POST /mmm/experiments/{id}/reject"
        actor: AnalyticsLead
        preconditions:
          - "status == READ_OUT, else ERR_EXPERIMENT_INVALID_STATE"
          - "X-User-ID != designed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "body.rejection_reason present and non-empty, else ERR_INVALID_REQUEST"
        side_effects:
          - "status := REJECTED; rejection_reason := body.rejection_reason; decided_by_user_id := X-User-ID; version += 1"
          - "NO calibration cascade fires - the market posture, the published run and every BudgetScenario are left untouched. This is the falsifiable contrast with the accept arm."
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /mmm/experiments/{id}/release-cells"
        actor: ExperimentDesigner
        preconditions:
          - "status IN {ACCEPTED, REJECTED}, else ERR_EXPERIMENT_INVALID_STATE"
        side_effects:
          - "every GeoCell with assigned_experiment_id == experiment.id and assignment_state IN {TREATMENT, CONTROL} gets assignment_state := WASHOUT and washout_until_date := end_date + washout_days days"
          - "Market.held_out_population is UNCHANGED by this step (WASHOUT still counts as held out) - the conserved quantity only returns to 0 after the market washout sweep"
          - "status := CLOSED; version += 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /mmm/experiments/{id}/release-cells"
        actor: ExperimentDesigner
        preconditions:
          - "status == REJECTED, else ERR_EXPERIMENT_INVALID_STATE"
          - "redesign_count < MAX_REDESIGNS (2), else ERR_REDESIGN_LIMIT_REACHED"
        side_effects:
          - "cells released to WASHOUT exactly as on the ACCEPTED arm"
          - "status := DRAFT; redesign_count += 1; computed_power := null; power_index := null; the four conversion counts and all four lift fields reset to null; treatment_population := 0; control_population := 0; version += 1"
        note: >-
          Cyclic loop. The SAME trigger reaches CLOSED from ACCEPTED and DRAFT from REJECTED -
          the source state, not the request, selects the target.

  - entity: BudgetScenario
    initial_state: DRAFT
    terminal_states: [INVALIDATED]
    note: >-
      Branching, with a DRAFT <-> OPTIMIZED cycle carried by optimize / revert-optimization.
      revert-optimization is the compensating action of invariant budget_cent_conservation.
    transitions:
      - from: DRAFT
        to: OPTIMIZED
        trigger: "POST /mmm/budget-scenarios/{id}/optimize"
        actor: BrandPlanner
        preconditions:
          - "status == DRAFT, else ERR_BUDGET_SCENARIO_INVALID_STATE"
          - "Market.data_posture == OPEN, else ERR_MARKET_POSTURE_BLOCKED"
          - "the referenced ModelRun has publication_status == PUBLISHED and fit_status == FITTED, else ERR_MODEL_RUN_NOT_PUBLISHED"
          - "at least one BudgetAllocation row exists, else ERR_NO_ALLOCATIONS"
          - "sum of BudgetAllocation.baseline_spend_cents == total_budget_cents, else ERR_BASELINE_BUDGET_MISMATCH"
          - "sum of the channels' min_spend_cents <= total_budget_cents, else ERR_FLOORS_EXCEED_BUDGET"
        side_effects:
          - "allocated_cents, shifted_cents, constraint_binding and projected_contribution_units recomputed per allocation row, and reallocation_fee_cents, shifted_total_cents, allocated_total_cents, unallocated_cents, projected_contribution_units, projected_incremental_revenue_cents recomputed on the scenario (calculations.budget_optimization)"
          - "status := OPTIMIZED; version += 1"
      - from: OPTIMIZED
        to: DRAFT
        trigger: "POST /mmm/budget-scenarios/{id}/revert-optimization"
        actor: BrandPlanner
        preconditions:
          - "status == OPTIMIZED, else ERR_BUDGET_SCENARIO_INVALID_STATE"
        side_effects:
          - "every BudgetAllocation row gets allocated_cents := baseline_spend_cents, shifted_cents := 0, constraint_binding := NONE, projected_contribution_units := 0.0000"
          - "reallocation_fee_cents := 0; shifted_total_cents := 0; unallocated_cents := 0; allocated_total_cents := total_budget_cents; projected_contribution_units := 0.0000; projected_incremental_revenue_cents := 0"
          - "status := DRAFT; version += 1"
          - "COMPENSATION: every side effect of optimize is reversed with no residual drift; the conservation identity allocated_total + fee + unallocated == total_budget_cents still holds"
      - from: OPTIMIZED
        to: APPROVED
        trigger: "POST /mmm/budget-scenarios/{id}/approve"
        actor: AnalyticsLead
        preconditions:
          - "status == OPTIMIZED, else ERR_BUDGET_SCENARIO_INVALID_STATE"
          - "X-User-ID != created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the referenced ModelRun still has publication_status == PUBLISHED, else ERR_MODEL_RUN_NOT_PUBLISHED"
          - "the referenced ModelRun has calibration_status IN {NOT_REQUIRED, CALIBRATED}, else ERR_CALIBRATION_STALE"
        side_effects:
          - "status := APPROVED; approved_by_user_id := X-User-ID; version += 1"
      - from: OPTIMIZED
        to: FROZEN
        trigger: "system event: Market.data_posture leaves OPEN"
        actor: system
        preconditions:
          - "status == OPTIMIZED (a DRAFT scenario is deliberately NOT frozen)"
        side_effects:
          - "status := FROZEN; allocations reset to baseline exactly as on revert-optimization; version += 1"
      - from: FROZEN
        to: DRAFT
        trigger: "system event: Market.data_posture returns to OPEN"
        actor: system
        preconditions:
          - "status == FROZEN"
        side_effects:
          - "status := DRAFT; version += 1"
      - from: OPTIMIZED
        to: INVALIDATED
        trigger: "system event: the referenced ModelRun's ChannelContribution rows stop being current (training window reopened, or the run superseded)"
        actor: system
        preconditions:
          - "status IN {OPTIMIZED, APPROVED}"
        side_effects:
          - "status := INVALIDATED; version += 1"
          - "computed allocation and projection fields are FROZEN AS-IS (not reset) so the invalid plan stays auditable"
      - from: APPROVED
        to: INVALIDATED
        trigger: "system event: the referenced ModelRun's ChannelContribution rows stop being current"
        actor: system
        preconditions:
          - "status IN {OPTIMIZED, APPROVED}"
        side_effects:
          - "status := INVALIDATED; version += 1"
        note: "INVALIDATED is terminal - optimize, revert-optimization and approve all return ERR_BUDGET_SCENARIO_INVALID_STATE from it."

  - entity: GeoCell
    initial_state: UNASSIGNED
    terminal_states: []
    note: Cyclic; a cell returns to UNASSIGNED and can be re-enlisted by a later experiment.
    transitions:
      - from: UNASSIGNED
        to: TREATMENT
        trigger: "POST /mmm/experiments/{id}/assign-cells (cell id listed in treatment_cell_ids)"
        actor: ExperimentDesigner
        preconditions:
          - "assignment_state == UNASSIGNED, else ERR_GEO_CELL_UNAVAILABLE"
          - "market_id == experiment.market_id, else ERR_GEO_CELL_NOT_IN_MARKET"
        side_effects:
          - "assignment_state := TREATMENT; assigned_experiment_id := experiment.id; Market.held_out_population += population"
      - from: UNASSIGNED
        to: CONTROL
        trigger: "POST /mmm/experiments/{id}/assign-cells (cell id listed in control_cell_ids)"
        actor: ExperimentDesigner
        preconditions:
          - "assignment_state == UNASSIGNED, else ERR_GEO_CELL_UNAVAILABLE"
          - "market_id == experiment.market_id, else ERR_GEO_CELL_NOT_IN_MARKET"
        side_effects:
          - "assignment_state := CONTROL; assigned_experiment_id := experiment.id; Market.held_out_population += population"
      - from: TREATMENT
        to: WASHOUT
        trigger: "POST /mmm/experiments/{id}/release-cells"
        actor: ExperimentDesigner
        preconditions:
          - "assignment_state IN {TREATMENT, CONTROL}"
        side_effects:
          - "assignment_state := WASHOUT; washout_until_date := experiment.end_date + experiment.washout_days days"
          - "Market.held_out_population UNCHANGED"
      - from: CONTROL
        to: WASHOUT
        trigger: "POST /mmm/experiments/{id}/release-cells"
        actor: ExperimentDesigner
        preconditions:
          - "assignment_state IN {TREATMENT, CONTROL}"
        side_effects:
          - "assignment_state := WASHOUT; washout_until_date := experiment.end_date + experiment.washout_days days"
          - "Market.held_out_population UNCHANGED"
      - from: WASHOUT
        to: UNASSIGNED
        trigger: "POST /mmm/markets/{id}/washout-sweep"
        actor: ExperimentDesigner
        preconditions:
          - "assignment_state == WASHOUT"
          - "current_utc >= washout_until_date - cells whose quarantine has not elapsed are SKIPPED, not errored"
        side_effects:
          - "assignment_state := UNASSIGNED; assigned_experiment_id := null; washout_until_date := null"
          - "Market.held_out_population -= population; when the last held cell clears, held_out_population returns to 0 and held_out_population_pct to 0.00"
        note: >-
          Conditional cascade: one sweep call partially applies - elapsed cells clear and
          non-elapsed cells are untouched in the same request.

  - entity: ReconciliationReport
    initial_state: CURRENT
    terminal_states: [STALE]
    note: Two-state ledger-sync marker; STALE is terminal and cannot be refreshed in place.
    transitions:
      - from: CURRENT
        to: STALE
        trigger: "system event: the report's ModelRun becomes SUPERSEDED, or its calibration_status becomes STALE"
        actor: system
        preconditions:
          - "status == CURRENT"
        side_effects:
          - "status := STALE; version += 1"
          - "every computed variance field is frozen at its filed value; a fresh report must be created against the new run"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: spend-observation-restatement-stale-window
    parent_entity: DataWindow
    child_entity: SpendObservation
    write_endpoint: "POST /mmm/spend-observations"
    occ_field: expected_data_window_version
    error_id: ERR_STALE_DATA_WINDOW_VERSION
    http_status: 412
    rationale: >-
      Filing a restatement for a (channel_id, period_start_date) that already has a live
      observation supersedes the incumbent, so two analysts restating the same period from the
      same read would each believe they superseded the original. The DataWindow version is the
      serialization point: every accepted observation write increments it, and the write echoes
      the post-write value in SpendObservation.data_window_version_after so the next caller can
      chain. This is a true CREATE-with-supersede race, not an update.
    required_when: "always on POST /mmm/spend-observations, including the first (non-restatement) observation for a period"
    version_source: DataWindow.version

  - rule_id: calibration-record-stale-model-run
    parent_entity: ModelRun
    child_entity: CalibrationRecord
    write_endpoint: "POST /mmm/calibration-records"
    occ_field: expected_model_run_version
    error_id: ERR_STALE_MODEL_RUN_VERSION
    http_status: 412
    rationale: >-
      A calibration record for a (model_run_id, channel_id) pair supersedes any prior live
      record for that pair and drives the run's calibration multiplier, so two experiment
      readouts calibrating the same channel from the same read would silently pick a winner.
      The ModelRun version is the serialization point: each accepted record increments it and
      the write echoes it in CalibrationRecord.model_run_version_after.
    required_when: "always on POST /mmm/calibration-records"
    version_source: ModelRun.version

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Global arithmetic convention: every division and multiplication is carried in exact
# Decimal arithmetic; a value is rounded ONLY where a formula says round(x, n), and every
# round is round_half_up. Square roots are evaluated to 12 decimal places before use.
# No calculation, ordering, tie-break or allocation step reads a row's `id`.
calculations:

  - name: market_data_posture
    trigger: >-
      Recomputed on every write that touches a Market's DataWindows or ModelRuns:
      window seal/reopen, model-run fit/publish/recalibrate, calibration-record create,
      experiment accept.
    algorithm: constraint_propagation
    formula: |
      # FIRST MATCH WINS - the order of these three tests is normative.
      if EXISTS DataWindow w WHERE w.market_id == market.id AND w.status == 'REOPENED':
          posture = 'FROZEN'
      elif (no ModelRun r WHERE r.market_id == market.id AND r.publication_status == 'PUBLISHED')
           OR (that published run's calibration_status == 'STALE')
           OR (no DataWindow w WHERE w.market_id == market.id AND w.status == 'SEALED'):
          posture = 'RESTRICTED'
      else:
          posture = 'OPEN'
    input_set: >-
      All DataWindows and ModelRuns of the market, in any state. A market with no children
      lands on RESTRICTED, which is why RESTRICTED is the create-time default.
    constants: {}
    precision: "enum, no rounding"

  - name: adstock_transform
    trigger: "Inside model-run fit, once per included MediaChannel, before saturation."
    algorithm: decay_function
    formula: |
      # periods p_0..p_{T-1} are the DataWindow's period starts in ascending
      # period_start_date order. spend[t] is the sum of spend_cents over the
      # channel's non-superseded SpendObservations whose period_start_date == p_t
      # (0 when the channel has no observation for that period).
      d = channel.adstock_decay_rate          # 0.00 .. 0.95, 2 decimals
      L = channel.adstock_max_lag_periods     # 0 .. 8

      # variant EFFECT_PERIOD - carryover lands on LATER periods
      adstocked[t] = round( spend[t] + SUM over k in 1..min(L, t) of d**k * spend[t-k], 0 )

      # variant SPEND_PERIOD - the whole carryover tail is credited back to the SPEND period
      G = SUM over k in 0..L of d**k
      adstocked[t] = round( spend[t] * G, 0 )

      mean_adstocked_spend_cents = round( SUM(adstocked) / T, 0 )
    input_set: >-
      SpendObservations of (data_window_id, channel_id) with superseded_by_id IS NULL.
      Superseded restatements are EXCLUDED. Periods with no observation contribute spend 0.
    constants:
      MAX_LAG_CEILING: 8
    precision: "integer cents, round_half_up at each period"
    variants:
      - name: EFFECT_PERIOD
        when: "ModelRun.carryover_attribution_mode == 'EFFECT_PERIOD'"
        difference: >-
          Backward-looking convolution: period t absorbs decayed spend from the L periods
          BEFORE it, so early periods are truncated (no pre-window spend is imputed) and the
          series total is LESS than the un-decayed geometric total.
      - name: SPEND_PERIOD
        when: "ModelRun.carryover_attribution_mode == 'SPEND_PERIOD'"
        difference: >-
          Every period is scaled by the same closed-form geometric gain G, so no truncation
          occurs and the series total is strictly LARGER than EFFECT_PERIOD's for the same
          spend. Worked divergence on the pinned fixture (d=0.50, L=2, spend
          [400000,600000,300000,500000]): EFFECT_PERIOD -> [400000,800000,700000,800000]
          (mean 675000); SPEND_PERIOD with G=1.75 -> [700000,1050000,525000,875000]
          (mean 787500).

  - name: model_run_aggregates
    trigger: "Inside model-run fit, before channel decomposition."
    algorithm: aggregation
    formula: |
      T = count of SalesObservations of the run's DataWindow
      total_units   = SUM(SalesObservation.units_sold)
      total_revenue = SUM(SalesObservation.revenue_cents)
      observation_period_count = T
      modeled_sales_units = total_units
      unit_price_cents = round( total_revenue / total_units, 0 )
    input_set: >-
      ALL SalesObservations of the run's DataWindow, including the holdout periods. The
      holdout split affects only holdout_backtest, never the price or the sales total.
    constants: {}
    precision: "integer cents for unit_price_cents, round_half_up"

  - name: channel_contribution_decomposition
    trigger: "Inside model-run fit, once per included MediaChannel in ascending channel_code order."
    algorithm: threshold
    formula: |
      # Hill saturation applied per period to the adstocked series, then summed.
      # C = channel.response_ceiling_units (PER PERIOD), H = channel.saturation_half_point_cents
      period_units[t] = C * adstocked[t] / (adstocked[t] + H)      # 0 when adstocked[t] == 0
      contribution_units = round( SUM over t of period_units[t], 4 )   # ONE round, over the exact sum

      # baseline closes the identity after every channel row is written
      baseline_sales_units = round( modeled_sales_units
                                    - SUM over channels of contribution_units, 4 )
      if baseline_sales_units < 0: ERR_MODEL_BASELINE_NEGATIVE and the fit is rejected
    input_set: >-
      Channels listed in ModelRun.included_channel_ids whose status IN {ACTIVE, PAUSED}, in
      ascending channel_code order (never id order). RETIRED channels are rejected, not skipped.
    constants: {}
    precision: >-
      4 decimal places on contribution_units and baseline_sales_units, round_half_up. The
      per-period terms are NOT pre-rounded - the exact rational sum is rounded once. On the
      pinned fixture the two orders diverge: rounding B_SOCIAL's four terms first gives
      2014.2858, the mandated single round gives 2014.2857.
    variants:
      - name: EFFECT_PERIOD
        when: "ModelRun.carryover_attribution_mode == 'EFFECT_PERIOD'"
        difference: >-
          Consumes the EFFECT_PERIOD adstock series. Pinned fixture: A_SEARCH 3653.3333,
          B_SOCIAL 2014.2857, baseline 17332.3810.
      - name: SPEND_PERIOD
        when: "ModelRun.carryover_attribution_mode == 'SPEND_PERIOD'"
        difference: >-
          Consumes the SPEND_PERIOD adstock series. Identical spend, sales, decay, lag,
          ceiling and half-point produce DIFFERENT contributions and a DIFFERENT baseline:
          A_SEARCH 3787.0430, B_SOCIAL 1979.0210, baseline 17233.9360. Note the divergence is
          not monotone per channel - A_SEARCH rises while B_SOCIAL falls - because saturation
          is concave, so a larger but flatter adstock series can buy fewer units.

  - name: roi_estimation
    trigger: "Inside model-run fit, immediately after each channel's contribution is known."
    algorithm: tiered_pricing
    formula: |
      attributed_spend_cents = SUM of spend_cents over the channel's non-superseded
                               SpendObservations in the window   # RAW spend, never adstocked
      contribution_revenue_cents = round( contribution_units * unit_price_cents, 0 )
      average_roi  = round( contribution_revenue_cents / attributed_spend_cents, 4 )

      # marginal ROI: revenue cents earned by the NEXT cent of spend, evaluated at the mean
      # of the adstocked series (the derivative of the Hill curve)
      marginal_roi = round( unit_price_cents * C * H
                            / (mean_adstocked_spend_cents + H) ** 2, 6 )
    input_set: "Same non-superseded SpendObservation set as adstock_transform."
    constants: {}
    precision: "average_roi 4 dp, marginal_roi 6 dp, revenue integer cents; all round_half_up"
    variants:
      - name: EFFECT_PERIOD
        when: "ModelRun.carryover_attribution_mode == 'EFFECT_PERIOD'"
        difference: >-
          Pinned fixture: A_SEARCH average_roi 10.2009 / marginal_roi 1.575497;
          B_SOCIAL average_roi 11.2487 / marginal_roi 3.339073. average_roi RANKS B above A
          while marginal_roi ALSO ranks B above A.
      - name: SPEND_PERIOD
        when: "ModelRun.carryover_attribution_mode == 'SPEND_PERIOD'"
        difference: >-
          Pinned fixture: A_SEARCH average_roi 10.5743 / marginal_roi 1.236971;
          B_SOCIAL average_roi 11.0517 / marginal_roi 3.242989. The denominator
          (attributed_spend_cents) is IDENTICAL across variants - only the numerator moves -
          which is what makes the two variants' ROI comparable and their divergence auditable.

  - name: contribution_confidence_interval
    trigger: "Inside model-run fit, after each channel's contribution_units is known."
    algorithm: weighted_scoring
    formula: |
      ci_half_width_pct = round( CI_BASE_PCT / sqrt(observation_period_count), 2 )
      ci_low_units  = round( contribution_units * (1 - ci_half_width_pct / 100), 4 )
      ci_high_units = round( contribution_units * (1 + ci_half_width_pct / 100), 4 )
    input_set: "The run's own observation_period_count; identical for every channel of a run."
    constants:
      CI_BASE_PCT: 40.0
    precision: "ci_half_width_pct 2 dp; the two bounds 4 dp; round_half_up"

  - name: holdout_backtest
    trigger: "POST /mmm/model-runs/{id}/validate"
    algorithm: projection
    formula: |
      # the LAST holdout_periods periods (by ascending period_start_date) are the holdout
      baseline_per_period = round( baseline_sales_units / observation_period_count, 4 )
      for each holdout period t:
          predicted[t] = round( baseline_per_period
                                + SUM over channels of round(period_units[t], 4), 4 )
          actual[t]    = SalesObservation.units_sold for period t
      holdout_mape_pct = round( 100 * ( SUM over holdout periods of
                                        abs(predicted[t] - actual[t]) / actual[t] )
                                / holdout_periods, 2 )
      validation_status = 'HOLDOUT_PASSED' if holdout_mape_pct <= MAPE_CEILING_PCT
                          else 'HOLDOUT_FAILED'
    input_set: >-
      The holdout periods only. Note the model was fit on ALL periods including the holdout -
      the backtest is deliberately in-sample-contaminated, which is exactly why the ceiling is
      as tight as 12.00.
    constants:
      MAPE_CEILING_PCT: 12.00
    precision: >-
      baseline_per_period and predicted 4 dp, holdout_mape_pct 2 dp, all round_half_up. Note
      the per-period contribution terms ARE pre-rounded to 4 dp here (unlike in
      channel_contribution_decomposition, which rounds only the total) - the two rules use
      deliberately different rounding points.

  - name: experiment_power
    trigger: "POST /mmm/experiments/{id}/lock-design, before any holdout-share check."
    algorithm: threshold
    formula: |
      n = min(planned_treatment_population, planned_control_population)
      p = baseline_conversion_rate
      power_index = round( (minimum_detectable_effect_pct / 100)
                           * sqrt( n * p / (2 * (1 - p)) ), 4 )
      # POWER_INDEX_TABLE - strict < upper bound, first matching row wins
      #   power_index <  1.0000 -> 0.2000
      #   power_index <  1.6000 -> 0.4500
      #   power_index <  2.0000 -> 0.6500
      #   power_index <  2.5000 -> 0.7500
      #   power_index <  2.8000 -> 0.8000
      #   power_index <  3.2400 -> 0.9000
      #   otherwise             -> 0.9500
      computed_power = table lookup
      if computed_power < MIN_EXPERIMENT_POWER: ERR_EXPERIMENT_UNDERPOWERED
    input_set: "The experiment's own planned populations and design parameters; no other rows."
    constants:
      MIN_EXPERIMENT_POWER: 0.80
      POWER_INDEX_TABLE: "[[1.0000, 0.2000], [1.6000, 0.4500], [2.0000, 0.6500], [2.5000, 0.7500], [2.8000, 0.8000], [3.2400, 0.9000], [null, 0.9500]]"
    precision: >-
      power_index 4 dp, computed_power 4 dp, round_half_up. The bounds are STRICT `<`, so
      power_index == 2.5000 exactly falls into the 0.8000 row and PASSES the >= 0.80 gate,
      while power_index == 2.4999 lands on 0.7500 and fails.

  - name: experiment_lift_readout
    trigger: "POST /mmm/experiments/{id}/read-out"
    algorithm: weighted_scoring
    formula: |
      t_post = treatment_conversions     / treatment_population
      c_post = control_conversions       / control_population
      t_pre  = pre_treatment_conversions / treatment_population
      c_pre  = pre_control_conversions   / control_population

      # derived at read-out for SYNTHETIC_CONTROL only; stays null for DIFF_IN_DIFF
      synthetic_control_weight = round( t_pre / c_pre, 6 )

      # variant DIFF_IN_DIFF
      did          = (t_post - t_pre) - (c_post - c_pre)
      measured_lift_pct = round( 100 * did / c_post, 2 )

      # variant SYNTHETIC_CONTROL
      scaled_control_rate = synthetic_control_weight * c_post
      measured_lift_pct = round( 100 * (t_post - scaled_control_rate)
                                 / scaled_control_rate, 2 )

      # the interval half-width is VARIANT-INVARIANT: c_post is the denominator in BOTH
      p_pool  = (treatment_conversions + control_conversions)
                / (treatment_population + control_population)
      se_rate = sqrt( p_pool * (1 - p_pool)
                      * (1 / treatment_population + 1 / control_population) )
      lift_ci_half_width_pct = round( 100 * Z_ALPHA_TWO_SIDED * se_rate / c_post, 2 )
      lift_ci_low_pct  = round( measured_lift_pct - lift_ci_half_width_pct, 2 )
      lift_ci_high_pct = round( measured_lift_pct + lift_ci_half_width_pct, 2 )
    input_set: >-
      The experiment's own realised arm populations and the four conversion counts supplied on
      the read-out call. No GeoCell or SpendObservation row participates.
    constants:
      Z_ALPHA_TWO_SIDED: 1.96
    precision: "all four published fields 2 dp, round_half_up; sqrt evaluated to 12 dp"
    variants:
      - name: DIFF_IN_DIFF
        when: "Experiment.readout_method == 'DIFF_IN_DIFF'"
        difference: >-
          Removes the control arm's own pre-to-post drift and divides by the OBSERVED control
          post rate. synthetic_control_weight is not derived at all and stays null. Pinned fixture
          (arms 245000/245000; tc 5145, cc 4900, ptc 4655, pcc 4900): lift 10.00,
          CI [6.03, 13.97].
      - name: SYNTHETIC_CONTROL
        when: "Experiment.readout_method == 'SYNTHETIC_CONTROL'"
        difference: >-
          Consumes the two pre-period counts ONLY to derive synthetic_control_weight, then
          rescales the control POST rate by that weight and divides by the RESCALED rate - it
          never forms a pre-to-post difference. The same four counts derive weight 0.950000
          and give lift 10.53 and CI [6.56, 14.50] - a 0.53pp divergence from
          DIFF_IN_DIFF with the identical half-width 3.97, which is what makes the delta
          attributable to the estimator rather than to the interval.

  - name: calibration_multiplier
    trigger: "POST /mmm/calibration-records"
    algorithm: aggregation
    formula: |
      cc = the CURRENT ChannelContribution row of (model_run_id, channel_id)
           with is_current == true
      model_implied_lift_pct = round( 100 * cc.contribution_units
                                      / (run.modeled_sales_units - cc.contribution_units), 4 )
      experiment_lift_pct = experiment.measured_lift_pct        # copied, never recomputed
      calibration_multiplier = round( experiment_lift_pct / model_implied_lift_pct, 4 )
      clamp to [CALIBRATION_MULTIPLIER_FLOOR, CALIBRATION_MULTIPLIER_CEILING]
      if the raw quotient is outside the clamp range: ERR_CALIBRATION_MULTIPLIER_OUT_OF_RANGE
                                                     (the record is NOT created)
      bias_direction = 'OVER_ATTRIBUTED'  if calibration_multiplier < 1 - CALIBRATION_ALIGNMENT_BAND
                       'UNDER_ATTRIBUTED' if calibration_multiplier > 1 + CALIBRATION_ALIGNMENT_BAND
                       else 'ALIGNED'
    input_set: >-
      Exactly one ChannelContribution row (is_current == true) and one Experiment with
      status IN {READ_OUT, ACCEPTED}. Superseded CalibrationRecords for the same
      (model_run_id, channel_id) are excluded from every downstream read.
    constants:
      CALIBRATION_MULTIPLIER_FLOOR: 0.25
      CALIBRATION_MULTIPLIER_CEILING: 4.00
      CALIBRATION_ALIGNMENT_BAND: 0.05
    precision: >-
      model_implied_lift_pct and calibration_multiplier 4 dp, round_half_up. Pinned fixture:
      contribution 3653.3333 of 23000 modeled -> model_implied_lift_pct 18.8835; a
      DIFF_IN_DIFF lift of 10.00 gives multiplier 0.5296 (OVER_ATTRIBUTED) while the
      SYNTHETIC_CONTROL lift of 10.53 on the SAME contribution gives 0.5576.

  - name: calibration_application
    trigger: "POST /mmm/model-runs/{id}/recalibrate"
    algorithm: constraint_propagation
    formula: |
      for each channel with a CalibrationRecord where superseded == false:
          calibrated_contribution_units = round( contribution_units
                                                 * calibration_multiplier, 4 )
          calibrated_contribution_revenue_cents = round( calibrated_contribution_units
                                                         * run.unit_price_cents, 0 )
      for channels with no live record:
          calibrated_contribution_units = contribution_units          # pass-through
          calibrated_contribution_revenue_cents = contribution_revenue_cents

      baseline_sales_units = round( modeled_sales_units
                                    - SUM over channels of calibrated_contribution_units, 4 )
      if baseline_sales_units < 0: ERR_MODEL_BASELINE_NEGATIVE and NOTHING is written
    input_set: >-
      Non-superseded CalibrationRecords of the run, joined to its is_current
      ChannelContribution rows in ascending channel_code order.
    constants: {}
    precision: >-
      units 4 dp, revenue integer cents, round_half_up. Pinned fixture (multiplier 0.5296 on
      A_SEARCH only): calibrated units 1934.8053, calibrated revenue 9724331, and the baseline
      RISES from 17332.3810 to 19050.9090 - the units the model over-credited to search are
      pushed back into baseline, never discarded.

  - name: budget_optimization
    trigger: "POST /mmm/budget-scenarios/{id}/optimize"
    algorithm: waterfall_allocation
    formula: |
      n = planning_period_count
      per-channel projection (used both to rank and to publish):
          units(alloc) = n * C * (alloc / n) / ((alloc / n) + H)

      GREEDY(budget):
          alloc[c] = c.min_spend_cents for every channel        # floors seeded first
          remaining = budget - SUM(alloc)
          if remaining < 0: ERR_FLOORS_EXCEED_BUDGET
          while remaining >= MARGINAL_STEP_CENTS:
              candidates = channels where alloc[c] + MARGINAL_STEP_CENTS <= c.max_spend_cents
              if candidates is empty: break
              pick the candidate maximising
                  units(alloc[c] + MARGINAL_STEP_CENTS) - units(alloc[c]),
                  tie-break by ASCENDING channel_code (never id, never created_at)
              alloc[winner] += MARGINAL_STEP_CENTS ; remaining -= MARGINAL_STEP_CENTS
          return alloc

      # PASS 1 - price the churn
      pass1 = GREEDY(total_budget_cents)
      shifted_pass1 = SUM over channels of abs(pass1[c] - baseline_spend_cents[c])
      reallocation_fee_cents = round( shifted_pass1 * reallocation_fee_pct / 100, 0 )
      # PASS 2 - spend what is left after the fee. The FEE IS PINNED AT ITS PASS-1 VALUE and
      # is NOT recomputed from pass 2's smaller churn: the fee prices the plan the optimizer
      # first proposed, and recomputing it would make the two passes chase each other.
      final = GREEDY(total_budget_cents - reallocation_fee_cents)

      per allocation row:
          allocated_cents = final[c]
          shifted_cents   = abs(final[c] - baseline_spend_cents[c])
          constraint_binding = 'FLOOR'   if allocated_cents == c.min_spend_cents
                               'CEILING' if allocated_cents == c.max_spend_cents
                               else 'NONE'
          projected_contribution_units = round( units(allocated_cents), 4 )
      on the scenario:
          allocated_total_cents = SUM(allocated_cents)
          shifted_total_cents   = SUM(shifted_cents)                 # pass-2 churn
          unallocated_cents     = total_budget_cents
                                  - reallocation_fee_cents - allocated_total_cents
          projected_contribution_units = SUM(row projected_contribution_units)
          projected_incremental_revenue_cents = round( projected_contribution_units
                                                       * run.unit_price_cents, 0 )
      INVARIANT: allocated_total_cents + reallocation_fee_cents + unallocated_cents
                 == total_budget_cents
    input_set: >-
      Every BudgetAllocation row of the scenario, joined to its MediaChannel for the floor,
      ceiling, ceiling-units and half-point. Channels whose status == RETIRED cannot have an
      allocation row. The referenced ModelRun supplies unit_price_cents only.
    constants:
      MARGINAL_STEP_CENTS: 100000
    precision: >-
      integer cents everywhere except projected_contribution_units (4 dp); round_half_up.
      Pinned fixture (total 4000000, fee_pct 0.50, baselines A 1500000 / B 2500000, 4 periods):
      pass 1 -> A 2400000 / B 1600000, churn 1800000, fee 9000; pass 2 over 3991000 ->
      A 2300000 / B 1600000, allocated_total 3900000, unallocated 91000, churn 1700000,
      projected units 5888.5630, projected revenue 29595918.
    variants:
      - name: FLOOR_BOUND
        when: "some channel's greedy result equals its min_spend_cents"
        difference: >-
          That row reports constraint_binding FLOOR and stops absorbing steps only because the
          waterfall never chose it, not because a ceiling stopped it. Fixture (B min raised to
          1800000): pass 1 A 2200000 / B 1800000, fee 7000; pass 2 A 2100000 / B 1800000
          (FLOOR), unallocated 93000.
      - name: CEILING_BOUND
        when: "some channel's greedy result equals its max_spend_cents"
        difference: >-
          That channel is removed from the candidate set and the surplus flows to the next-best
          marginal ROI, or - when every channel is capped - lands in unallocated_cents.
          Fixture (A max lowered to 2000000): pass 1 A 2000000 / B 2000000, fee 5000; pass 2
          A 2000000 (CEILING) / B 1900000, unallocated 95000.

  - name: reconciliation_variance
    trigger: "POST /mmm/reconciliation-reports"
    algorithm: weighted_scoring
    formula: |
      # platform_lines is an input array of { channel_id, platform_revenue_cents }.
      # Lines are processed in ascending MediaChannel.channel_code order.
      for each line:
          model_cents    = the run's is_current ChannelContribution for that channel,
                           contribution_revenue_cents (or calibrated_contribution_revenue_cents
                           when basis == 'CALIBRATED')
          variance_cents = platform_revenue_cents - model_cents
          variance_pct   = round( 100 * variance_cents / model_cents, 2 )   # ROUND HERE
      platform_reported_revenue_cents = SUM(platform_revenue_cents)
      model_attributed_revenue_cents  = SUM(model_cents)
      total_variance_cents            = SUM(variance_cents)

      # MANDATED ORDER: weight the ALREADY-ROUNDED per-line percentages by model share.
      weighted_variance_pct = round( SUM over lines of (variance_pct * model_cents)
                                     / model_attributed_revenue_cents, 2 )
      attribution_gap_flag = 'MATERIAL' if abs(weighted_variance_pct) >= MATERIALITY_PCT
                             else 'IMMATERIAL'
    input_set: >-
      Exactly one platform line per is_current ChannelContribution of the run; a line naming a
      channel with no current contribution row is rejected, and a missing line is rejected.
    constants:
      MATERIALITY_PCT: 15.00
    precision: >-
      per-line variance_pct 2 dp THEN weight; NEVER weight the unrounded percentages and round
      once. The two orders are observably different on the pinned fixture (model A 18361653 /
      B 10123800; platform A 19000000 / B 13756000): the mandated order gives per-line 3.48 and
      35.88 and weighted 15.00 -> MATERIAL, while the forbidden sum-then-round order gives
      14.99 -> IMMATERIAL. 15.00 is also exactly the materiality boundary, so the rounding
      order flips the published flag.

  - name: refresh_stability
    trigger: "POST /mmm/model-runs/{id}/publish, before the publication_status write."
    algorithm: chronological
    formula: |
      prev = the market's ModelRun with publication_status == 'PUBLISHED' (at most one)
      if prev is NULL:
          stability_score = NULL ; refresh_generation = 1
          # the STABILITY_FLOOR gate is SKIPPED for a market's first publication
      else:
          # union of channels, in ascending channel_code order; a channel absent from a run
          # contributes average_roi 0 for that run
          drift = SUM over channels in union of abs(new_roi - prev_roi)
          base  = SUM over prev's channels of prev_roi
          stability_score = round( max(0, 1 - drift / base), 4 )
          refresh_generation = prev.refresh_generation + 1
          if stability_score < STABILITY_FLOOR and body.override_stability is not true:
              ERR_MODEL_UNSTABLE
    input_set: >-
      average_roi of the is_current ChannelContribution rows of the candidate run and of the
      currently published run. Contribution rows with is_current == false are EXCLUDED.
    constants:
      STABILITY_FLOOR: 0.6000
    precision: >-
      4 dp, round_half_up, floored at 0. Pinned fixtures against a published EFFECT_PERIOD run
      (A 10.2009, B 11.2487): a SPEND_PERIOD refit of BOTH channels (A 10.5743, B 11.0517)
      scores 0.9734 and publishes; a refit that DROPS B_SOCIAL scores 0.4756 - because B's ROI
      falls to 0 in the union - and is blocked by ERR_MODEL_UNSTABLE unless
      override_stability is true. Dropping a channel is therefore penalised far harder than
      changing the attribution mode, which is the whole point of the union rule.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:

  # ---- 1-2: authentication and authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND is permitted for this endpoint per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # ---- 10-20: existence ----------------------------------------------------
  - priority: 10
    category: existence
    check: "Every {id} path parameter resolves to a live row, validated left to right."
    error_id: "ERR_MARKET_NOT_FOUND | ERR_MEDIA_CHANNEL_NOT_FOUND | ERR_GEO_CELL_NOT_FOUND | ERR_DATA_WINDOW_NOT_FOUND | ERR_SPEND_OBSERVATION_NOT_FOUND | ERR_SALES_OBSERVATION_NOT_FOUND | ERR_MODEL_RUN_NOT_FOUND | ERR_CHANNEL_CONTRIBUTION_NOT_FOUND | ERR_EXPERIMENT_NOT_FOUND | ERR_CALIBRATION_RECORD_NOT_FOUND | ERR_BUDGET_SCENARIO_NOT_FOUND | ERR_BUDGET_ALLOCATION_NOT_FOUND | ERR_RECONCILIATION_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "every path containing {id}"
  - priority: 15
    category: existence
    check: >-
      Request body parses, every required field is present, every enum value is in its
      declared set, every numeric field satisfies its declared range, dates are ISO-8601
      UTC midnight, and unknown fields are ignored rather than rejected.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every POST, PUT and PATCH"
  - priority: 20
    category: existence
    check: >-
      Every foreign key supplied IN THE BODY resolves to a live row (market_id, channel_id,
      data_window_id, model_run_id, experiment_id, cell ids, budget_scenario_id).
    error_id: "the matching ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "every POST and PUT carrying a foreign key in its body"

  # ---- 22: segregation of duties -------------------------------------------
  - priority: 22
    category: business_safety
    check: >-
      The acting X-User-ID differs from the recorded originator: experiment accept/reject
      require X-User-ID != Experiment.designed_by_user_id, and budget-scenario approve
      requires X-User-ID != BudgetScenario.created_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mmm/experiments/{id}/accept, POST /mmm/experiments/{id}/reject, POST /mmm/budget-scenarios/{id}/approve"

  # ---- 30: optimistic concurrency -----------------------------------------
  - priority: 30
    category: state
    check: "expected_data_window_version equals the parent DataWindow's current version."
    error_id: ERR_STALE_DATA_WINDOW_VERSION
    http_status: 412
    applies_to: "POST /mmm/spend-observations"
  - priority: 30
    category: state
    check: "expected_model_run_version equals the parent ModelRun's current version."
    error_id: ERR_STALE_MODEL_RUN_VERSION
    http_status: 412
    applies_to: "POST /mmm/calibration-records"

  # ---- 40: target-resource state preconditions ----------------------------
  - priority: 40
    category: state
    check: "The target row is in a state from which the requested transition exists (see §1.2)."
    error_id: "ERR_DATA_WINDOW_INVALID_STATE | ERR_MODEL_RUN_INVALID_STATE | ERR_EXPERIMENT_INVALID_STATE | ERR_BUDGET_SCENARIO_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint (POST /mmm/<collection>/{id}/<action>)"

  # ---- 45: cross-entity state dependencies --------------------------------
  - priority: 45
    category: state
    check: "The run's DataWindow.status == SEALED."
    error_id: ERR_DATA_WINDOW_NOT_SEALED
    http_status: 409
    applies_to: "POST /mmm/model-runs/{id}/fit"
  - priority: 45
    category: state
    check: "Every channel in included_channel_ids has status IN {ACTIVE, PAUSED}."
    error_id: ERR_CHANNEL_RETIRED
    http_status: 409
    applies_to: "POST /mmm/model-runs/{id}/fit"
  - priority: 45
    category: state
    check: "The run's validation_status == HOLDOUT_PASSED."
    error_id: ERR_HOLDOUT_NOT_PASSED
    http_status: 409
    applies_to: "POST /mmm/model-runs/{id}/publish"
  - priority: 45
    category: state
    check: "The run's calibration_status == PENDING_CALIBRATION."
    error_id: ERR_CALIBRATION_NOT_PENDING
    http_status: 409
    applies_to: "POST /mmm/model-runs/{id}/recalibrate"
  - priority: 45
    category: state
    check: "The market has a ModelRun with publication_status == PUBLISHED."
    error_id: ERR_NO_PUBLISHED_MODEL_RUN
    http_status: 409
    applies_to: "POST /mmm/experiments/{id}/accept"
  - priority: 45
    category: state
    check: >-
      The referenced ModelRun has publication_status == PUBLISHED and fit_status == FITTED
      at both create and optimize and approve time.
    error_id: ERR_MODEL_RUN_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /mmm/budget-scenarios, POST /mmm/budget-scenarios/{id}/optimize, POST /mmm/budget-scenarios/{id}/approve"
  - priority: 45
    category: state
    check: "The referenced ModelRun's calibration_status IN {NOT_REQUIRED, CALIBRATED}."
    error_id: ERR_CALIBRATION_STALE
    http_status: 409
    applies_to: "POST /mmm/budget-scenarios/{id}/approve, POST /mmm/reconciliation-reports"
  - priority: 45
    category: state
    check: "Every listed GeoCell has assignment_state == UNASSIGNED."
    error_id: ERR_GEO_CELL_UNAVAILABLE
    http_status: 409
    applies_to: "POST /mmm/experiments/{id}/assign-cells"
  - priority: 45
    category: state
    check: >-
      The parent DataWindow.status == OPEN or REOPENED. A SEALED window accepts no new
      observation and no restatement.
    error_id: ERR_DATA_WINDOW_SEALED
    http_status: 409
    applies_to: "POST /mmm/spend-observations, POST /mmm/sales-observations"

  # ---- 50-52: safety gates ------------------------------------------------
  - priority: 50
    category: business_safety
    check: >-
      Market.data_posture permits the operation. Every write listed here requires
      data_posture != FROZEN; budget-scenario optimize additionally requires
      data_posture == OPEN.
    error_id: ERR_MARKET_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /mmm/experiments/{id}/lock-design, POST /mmm/model-runs/{id}/publish, POST /mmm/budget-scenarios/{id}/optimize, POST /mmm/reconciliation-reports"
  - priority: 52
    category: business_safety
    check: "computed_power >= MIN_EXPERIMENT_POWER (0.80) from calculations.experiment_power."
    error_id: ERR_EXPERIMENT_UNDERPOWERED
    http_status: 422
    applies_to: "POST /mmm/experiments/{id}/lock-design"

  # ---- 55-56: referential coherence ---------------------------------------
  - priority: 55
    category: business_referential
    check: >-
      The referenced MediaChannel's market_id equals the referencing row's market_id
      (experiment create, model-run fit inclusion list, budget-allocation create,
      reconciliation platform lines).
    error_id: ERR_CHANNEL_NOT_IN_MARKET
    http_status: 422
    applies_to: "POST /mmm/experiments, POST /mmm/model-runs, POST /mmm/model-runs/{id}/fit, POST /mmm/budget-allocations"
  - priority: 55
    category: business_referential
    check: "Every listed GeoCell's market_id equals the experiment's market_id."
    error_id: ERR_GEO_CELL_NOT_IN_MARKET
    http_status: 422
    applies_to: "POST /mmm/experiments/{id}/assign-cells"
  - priority: 55
    category: business_referential
    check: "assign-cells requires design_type == GEO_HOLDOUT."
    error_id: ERR_DESIGN_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /mmm/experiments/{id}/assign-cells"
  - priority: 55
    category: business_referential
    check: >-
      A GEO_HOLDOUT experiment cannot start from DESIGN_LOCKED - it must pass through
      assign-cells first.
    error_id: ERR_CELLS_NOT_ASSIGNED
    http_status: 422
    applies_to: "POST /mmm/experiments/{id}/start"
  - priority: 56
    category: business_referential
    check: >-
      Every channel in included_channel_ids has at least one non-superseded SpendObservation
      inside the run's DataWindow.
    error_id: ERR_NO_SPEND_OBSERVATIONS
    http_status: 422
    applies_to: "POST /mmm/model-runs/{id}/fit"
  - priority: 56
    category: business_referential
    check: "The scenario has at least one BudgetAllocation row."
    error_id: ERR_NO_ALLOCATIONS
    http_status: 422
    applies_to: "POST /mmm/budget-scenarios/{id}/optimize"
  - priority: 56
    category: business_referential
    check: >-
      platform_lines contains exactly one line per is_current ChannelContribution of the run
      and no line for any other channel.
    error_id: ERR_PLATFORM_LINE_MISMATCH
    http_status: 422
    applies_to: "POST /mmm/reconciliation-reports"

  # ---- 60-64: aggregate and boundary constraints --------------------------
  - priority: 60
    category: business_constraint
    check: >-
      Aggregate holdout share: (Market.held_out_population + the population this call would
      add) * 100 <= MAX_HOLDOUT_POPULATION_PCT * Market.total_population. Compared as EXACT
      INTEGERS - never via the 2-decimal held_out_population_pct.
    error_id: ERR_HOLDOUT_SHARE_EXCEEDED
    http_status: 422
    applies_to: "POST /mmm/experiments/{id}/lock-design, POST /mmm/experiments/{id}/assign-cells"
  - priority: 61
    category: business_constraint
    check: "treatment_conversions <= treatment_population and control_conversions <= control_population (and the same for the two pre-period counts)."
    error_id: ERR_CONVERSIONS_EXCEED_POPULATION
    http_status: 422
    applies_to: "POST /mmm/experiments/{id}/read-out"
  - priority: 61
    category: business_constraint
    check: "lift_ci_low_pct > 0.00 - a readout whose interval straddles zero cannot be accepted."
    error_id: ERR_LIFT_NOT_SIGNIFICANT
    http_status: 422
    applies_to: "POST /mmm/experiments/{id}/accept"
  - priority: 62
    category: business_constraint
    check: "redesign_count < MAX_REDESIGNS (2) before a REJECTED -> DRAFT loop."
    error_id: ERR_REDESIGN_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /mmm/experiments/{id}/release-cells"
  - priority: 63
    category: business_constraint
    check: >-
      Scoped uniqueness: Market.market_code globally; MediaChannel.channel_code per market;
      GeoCell.cell_code per market; SalesObservation per (data_window_id, period_start_date);
      BudgetAllocation per (budget_scenario_id, channel_id); ReconciliationReport per
      (model_run_id, reporting_period_start).
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /mmm/markets, POST /mmm/media-channels, POST /mmm/geo-cells, POST /mmm/sales-observations, POST /mmm/budget-allocations, POST /mmm/reconciliation-reports"
  - priority: 64
    category: business_constraint
    check: "The resulting baseline_sales_units is >= 0 (fit and recalibrate)."
    error_id: ERR_MODEL_BASELINE_NEGATIVE
    http_status: 422
    applies_to: "POST /mmm/model-runs/{id}/fit, POST /mmm/model-runs/{id}/recalibrate"
  - priority: 64
    category: business_constraint
    check: >-
      The raw calibration quotient lies inside
      [CALIBRATION_MULTIPLIER_FLOOR, CALIBRATION_MULTIPLIER_CEILING] = [0.25, 4.00].
    error_id: ERR_CALIBRATION_MULTIPLIER_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /mmm/calibration-records"
  - priority: 64
    category: business_constraint
    check: >-
      stability_score >= STABILITY_FLOOR (0.6000), unless body.override_stability == true.
      Skipped entirely for a market's first publication.
    error_id: ERR_MODEL_UNSTABLE
    http_status: 422
    applies_to: "POST /mmm/model-runs/{id}/publish"

  # ---- 65-68: temporal constraints ----------------------------------------
  - priority: 65
    category: business_temporal
    check: >-
      No other Experiment on the same (market_id, channel_id) with status IN
      {DESIGN_LOCKED, CELLS_ASSIGNED, RUNNING, READ_OUT, ACCEPTED} occupies an overlapping
      interval. A DRAFT design reserves nothing (it may never lock) and a REJECTED or CLOSED
      one has released the channel, so only locked-or-later experiments occupy it. The
      candidate occupies the
      HALF-OPEN interval [start_date, end_date); each incumbent occupies
      [start_date, end_date + washout_days) - the buffer is appended to the INCUMBENT's tail
      only, never to the candidate's, so the test is asymmetric. Touching is allowed:
      candidate.start_date == incumbent.end_date + incumbent.washout_days is NOT a conflict,
      one day earlier IS.
    error_id: ERR_EXPERIMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /mmm/experiments/{id}/lock-design"
  - priority: 66
    category: business_temporal
    check: >-
      No other DataWindow of the same market with the SAME granularity overlaps. For CONFLICT
      DETECTION ONLY, a window occupies the CLOSED interval
      [window_start_date, window_end_date] - i.e. the exclusive period boundary is still
      treated as occupied - with NO buffer, so back-to-back windows whose endpoints merely
      touch (W1 ending 2026-08-31 and W2 starting 2026-08-31) ARE a conflict and W2 must start
      2026-09-01 or later. Two windows of the same market with DIFFERENT granularity may
      overlap freely - the granularity is part of the conflict key, not a tie-break.
    error_id: ERR_DATA_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /mmm/data-windows"
  - priority: 67
    category: business_temporal
    check: "current_utc >= window_end_date before a window may be sealed."
    error_id: ERR_DATA_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /mmm/data-windows/{id}/seal"
  - priority: 67
    category: business_temporal
    check: "current_utc >= start_date before an experiment may start."
    error_id: ERR_EXPERIMENT_NOT_STARTED
    http_status: 409
    applies_to: "POST /mmm/experiments/{id}/start"
  - priority: 67
    category: business_temporal
    check: "current_utc >= end_date before an experiment may read out."
    error_id: ERR_EXPERIMENT_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /mmm/experiments/{id}/read-out"
  - priority: 68
    category: business_temporal
    check: >-
      period_start_date lies inside the HALF-OPEN range [window_start_date, window_end_date)
      and is aligned to the window's granularity grid (WEEKLY: an exact multiple of 7 days
      after window_start_date; DAILY: any day in the half-open range). Note the deliberate
      contrast with priority 66: period placement uses the HALF-OPEN range while
      window-vs-window conflict detection uses the CLOSED range.
    error_id: ERR_PERIOD_NOT_ALIGNED
    http_status: 422
    applies_to: "POST /mmm/spend-observations, POST /mmm/sales-observations"
  - priority: 68
    category: business_temporal
    check: "The requested clock value is not earlier than the current logical clock."
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  # ---- 70-71: completeness constraints ------------------------------------
  - priority: 70
    category: business_constraint
    check: >-
      sales_period_count >= MIN_SEALED_PERIOD_COUNT (4) and lag_completeness_pct == 100.00
      before a window may be sealed.
    error_id: ERR_DATA_WINDOW_INCOMPLETE
    http_status: 422
    applies_to: "POST /mmm/data-windows/{id}/seal"
  - priority: 70
    category: business_constraint
    check: >-
      DataWindow.expected_period_count is strictly greater than the largest
      adstock_max_lag_periods among the run's included channels - otherwise the lag structure
      cannot be identified from the window.
    error_id: ERR_LAG_WINDOW_INCOMPLETE
    http_status: 422
    applies_to: "POST /mmm/model-runs/{id}/fit"
  - priority: 71
    category: business_constraint
    check: "SUM of the allocated channels' min_spend_cents <= total_budget_cents."
    error_id: ERR_FLOORS_EXCEED_BUDGET
    http_status: 422
    applies_to: "POST /mmm/budget-scenarios/{id}/optimize"

  # ---- 72-73: fiscal checks (last) ----------------------------------------
  - priority: 72
    category: business_fiscal
    check: "total_budget_cents <= Market.annual_budget_ceiling_cents."
    error_id: ERR_BUDGET_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /mmm/budget-scenarios"
  - priority: 73
    category: business_fiscal
    check: "SUM of BudgetAllocation.baseline_spend_cents == BudgetScenario.total_budget_cents."
    error_id: ERR_BASELINE_BUDGET_MISMATCH
    http_status: 422
    applies_to: "POST /mmm/budget-scenarios/{id}/optimize"

# Declared priority-conflict pairs (each pair is reachable by a SINGLE request that violates
# both rules; the lower priority number's error_id is the one returned):
#   1. POST /mmm/budget-scenarios         - state(45) ERR_MODEL_RUN_NOT_PUBLISHED
#                                           beats business_fiscal(72) ERR_BUDGET_CEILING_EXCEEDED
#   2. POST /mmm/experiments/{id}/lock-design
#                                         - business_safety(52) ERR_EXPERIMENT_UNDERPOWERED
#                                           beats business_constraint(60) ERR_HOLDOUT_SHARE_EXCEEDED
#   3. POST /mmm/model-runs/{id}/fit      - business_referential(56) ERR_NO_SPEND_OBSERVATIONS
#                                           beats business_constraint(70) ERR_LAG_WINDOW_INCOMPLETE

# Declared invariants with compensating actions (§0.5 rule compensating_invariant):
#   budget_cent_conservation:
#     invariant: BudgetScenario.allocated_total_cents + reallocation_fee_cents
#                + unallocated_cents == total_budget_cents, at EVERY observable moment.
#     breaker:      POST /mmm/budget-scenarios/{id}/optimize
#     compensator:  POST /mmm/budget-scenarios/{id}/revert-optimization
#   holdout_population_conservation:
#     invariant: Market.held_out_population == SUM of GeoCell.population over the market's
#                cells whose assignment_state IN {TREATMENT, CONTROL, WASHOUT}, and returns
#                to 0 once every experiment of the market is CLOSED and swept.
#     breaker:      POST /mmm/experiments/{id}/assign-cells
#     compensator:  POST /mmm/experiments/{id}/release-cells THEN
#                   POST /mmm/markets/{id}/washout-sweep (release alone does NOT restore it)

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Topology is FLAT: every business path is `/mmm/<collection>` or
# `/mmm/<collection>/{id}` or `/mmm/<collection>/{id}/<action>` - at most ONE path
# parameter, always spelled `{id}`. Parent-child navigation is by filtered list, never by
# nested path. Every list endpoint accepts `limit?` and `offset?` and returns rows ordered
# by created_at ASC, tie-broken by the entity's natural code (never by id).
endpoints:

  # ---------------- Market --------------------------------------------------
  - method: POST
    path: "/mmm/markets"
    description: "Register a brand market. Posture starts at RESTRICTED because no window is sealed and no run is published yet."
    roles: [DataEngineer]
    code: 201
    input: [market_code, name, total_population, annual_budget_ceiling_cents, "currency_code?"]
    output: Market
    side_effects: ["celled_population := 0", "held_out_population := 0", "held_out_population_pct := 0.00", "data_posture := RESTRICTED (calculations.market_data_posture)"]
  - method: GET
    path: "/mmm/markets"
    description: "List markets."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["market_code?", "data_posture?", "limit?", "offset?"]
    output: Market[]
    side_effects: []
  - method: GET
    path: "/mmm/markets/{id}"
    description: "Read one market with its live posture and holdout aggregates."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: Market
    side_effects: []
  - method: POST
    path: "/mmm/markets/{id}/washout-sweep"
    description: >-
      Ops-run checkpoint. Releases every GeoCell of the market whose WASHOUT quarantine has
      elapsed (current_utc >= washout_until_date) back to UNASSIGNED; cells still inside
      quarantine are SKIPPED without error. This is the compensating half of invariant
      holdout_population_conservation.
    roles: [ExperimentDesigner]
    code: 200
    input: []
    output: Market
    side_effects: ["elapsed WASHOUT cells -> UNASSIGNED with assigned_experiment_id := null and washout_until_date := null", "Market.held_out_population and held_out_population_pct recomputed", "Market.version += 1"]

  # ---------------- MediaChannel -------------------------------------------
  - method: POST
    path: "/mmm/media-channels"
    description: "Declare a media channel with its adstock and saturation parameters."
    roles: [DataEngineer]
    code: 201
    input: [market_id, channel_code, channel_type, adstock_decay_rate, adstock_max_lag_periods, saturation_half_point_cents, response_ceiling_units, min_spend_cents, max_spend_cents, "status?"]
    output: MediaChannel
    side_effects: []
  - method: GET
    path: "/mmm/media-channels"
    description: "List media channels; filter by market to reverse-navigate Market -> MediaChannel."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["market_id?", "channel_code?", "status?", "limit?", "offset?"]
    output: MediaChannel[]
    side_effects: []
  - method: GET
    path: "/mmm/media-channels/{id}"
    description: "Read one media channel."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: MediaChannel
    side_effects: []
  - method: PATCH
    path: "/mmm/media-channels/{id}"
    description: >-
      Revise a channel's curve parameters, spend bounds or lifecycle status. Does NOT
      retroactively change any ModelRun already fitted - only future fits and optimizations
      read the new values.
    roles: [DataEngineer]
    code: 200
    input: ["status?", "adstock_decay_rate?", "adstock_max_lag_periods?", "saturation_half_point_cents?", "response_ceiling_units?", "min_spend_cents?", "max_spend_cents?"]
    output: MediaChannel
    side_effects: ["version += 1"]

  # ---------------- GeoCell ------------------------------------------------
  - method: POST
    path: "/mmm/geo-cells"
    description: "Add a geographic cell to a market's holdout pool."
    roles: [DataEngineer]
    code: 201
    input: [market_id, cell_code, population]
    output: GeoCell
    side_effects: ["Market.celled_population += population", "Market.version += 1"]
  - method: GET
    path: "/mmm/geo-cells"
    description: >-
      List geo cells. Filter by market_id to reverse-navigate Market -> GeoCell, or by
      assigned_experiment_id to reverse-navigate Experiment -> GeoCell (the only channel
      through which cascade-assigned cells are discoverable).
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["market_id?", "assigned_experiment_id?", "assignment_state?", "cell_code?", "limit?", "offset?"]
    output: GeoCell[]
    side_effects: []
  - method: GET
    path: "/mmm/geo-cells/{id}"
    description: "Read one geo cell with its assignment state and washout deadline."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: GeoCell
    side_effects: []

  # ---------------- DataWindow ---------------------------------------------
  - method: POST
    path: "/mmm/data-windows"
    description: >-
      Open a training window at a chosen granularity. expected_period_count is derived from
      the HALF-OPEN date range and the granularity, and must divide evenly.
    roles: [DataEngineer]
    code: 201
    input: [market_id, window_start_date, window_end_date, granularity]
    output: DataWindow
    side_effects: ["expected_period_count computed from the range and granularity", "status := OPEN", "counters and lag_completeness_pct := 0"]
  - method: GET
    path: "/mmm/data-windows"
    description: "List training windows; filter by market_id to reverse-navigate Market -> DataWindow."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["market_id?", "status?", "granularity?", "limit?", "offset?"]
    output: DataWindow[]
    side_effects: []
  - method: GET
    path: "/mmm/data-windows/{id}"
    description: "Read one training window, including the version the OCC rule serializes on."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: DataWindow
    side_effects: []
  - method: POST
    path: "/mmm/data-windows/{id}/seal"
    description: "Seal an OPEN or REOPENED window so runs may be fitted on it."
    roles: [DataEngineer]
    code: 200
    input: []
    output: DataWindow
    side_effects: ["status := SEALED", "version += 1", "Market.data_posture recomputed (calculations.market_data_posture)", "FROZEN BudgetScenarios of the market thaw to DRAFT when the posture returns to OPEN"]
  - method: POST
    path: "/mmm/data-windows/{id}/reopen"
    description: >-
      Reopen a SEALED window to admit a data correction. Head of the four-hop staleness
      cascade (window -> runs -> contributions -> scenarios) and the sole producer of the
      FROZEN market posture.
    roles: [DataEngineer]
    code: 200
    input: [reason]
    output: DataWindow
    side_effects: ["status := REOPENED", "reopen_count += 1", "version += 1", "FITTED runs on this window -> STALE_FIT with validation_status := UNVALIDATED", "their ChannelContributions -> is_current := false", "their OPTIMIZED/APPROVED BudgetScenarios -> INVALIDATED", "Market.data_posture -> FROZEN", "remaining OPTIMIZED BudgetScenarios of the market -> FROZEN with allocations reset to baseline (DRAFT scenarios untouched)"]

  # ---------------- SpendObservation ---------------------------------------
  - method: POST
    path: "/mmm/spend-observations"
    description: >-
      File a media-spend observation for one channel-period. When a live observation already
      exists for that (channel_id, period_start_date), this call SUPERSEDES it: the incumbent
      gets superseded_by_id set to the new row and the new row gets is_restatement := true.
      Serialized by OCC on the parent DataWindow's version.
    roles: [DataEngineer]
    code: 201
    input: [data_window_id, channel_id, period_start_date, spend_cents, "impressions?", "price_index?", "distribution_index?", expected_data_window_version]
    output: SpendObservation
    side_effects: ["incumbent (if any) gets superseded_by_id := new row id", "is_restatement := true when an incumbent was superseded, else false", "DataWindow.spend_observation_count recomputed over non-superseded rows", "DataWindow.version += 1", "data_window_version_after := the post-write DataWindow.version"]
  - method: GET
    path: "/mmm/spend-observations"
    description: >-
      List spend observations. Filters reverse-navigate DataWindow -> SpendObservation,
      MediaChannel -> SpendObservation and SpendObservation -> SpendObservation (the
      supersede chain). Superseded rows are EXCLUDED unless include_superseded is true.
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["data_window_id?", "channel_id?", "superseded_by_id?", "include_superseded?", "limit?", "offset?"]
    output: SpendObservation[]
    side_effects: []
  - method: GET
    path: "/mmm/spend-observations/{id}"
    description: "Read one spend observation, superseded or not."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: SpendObservation
    side_effects: []

  # ---------------- SalesObservation ---------------------------------------
  - method: POST
    path: "/mmm/sales-observations"
    description: "File the market-level sales outcome for one period of a window."
    roles: [DataEngineer]
    code: 201
    input: [data_window_id, period_start_date, units_sold, revenue_cents, "distribution_pct?", "macro_index?"]
    output: SalesObservation
    side_effects: ["avg_price_cents := round(revenue_cents / units_sold, 0)", "DataWindow.sales_period_count += 1", "DataWindow.lag_completeness_pct := round(100 * sales_period_count / expected_period_count, 2)", "DataWindow.version += 1"]
  - method: GET
    path: "/mmm/sales-observations"
    description: "List sales observations; filter by data_window_id to reverse-navigate DataWindow -> SalesObservation."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["data_window_id?", "limit?", "offset?"]
    output: SalesObservation[]
    side_effects: []
  - method: GET
    path: "/mmm/sales-observations/{id}"
    description: "Read one sales observation."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: SalesObservation
    side_effects: []

  # ---------------- ModelRun -----------------------------------------------
  - method: POST
    path: "/mmm/model-runs"
    description: >-
      Specify a model run: window, channel inclusion list, control variables, seasonality
      mode, carryover attribution mode (the dual-variant selector) and holdout depth.
      Creation performs NO fitting.
    roles: [Modeler]
    code: 201
    input: [market_id, data_window_id, included_channel_ids, "control_variables?", "seasonality_mode?", carryover_attribution_mode, "holdout_periods?"]
    output: ModelRun
    side_effects: ["fit_status := PENDING", "validation_status := UNVALIDATED", "calibration_status := NOT_REQUIRED", "publication_status := UNPUBLISHED"]
  - method: GET
    path: "/mmm/model-runs"
    description: >-
      List model runs. Filters reverse-navigate Market -> ModelRun, DataWindow -> ModelRun and
      ModelRun -> ModelRun (the publication succession chain), and resolve a market's current
      PUBLISHED run.
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["market_id?", "data_window_id?", "previous_published_run_id?", "fit_status?", "validation_status?", "calibration_status?", "publication_status?", "limit?", "offset?"]
    output: ModelRun[]
    side_effects: []
  - method: GET
    path: "/mmm/model-runs/{id}"
    description: "Read one model run with all four parallel state dimensions and the version the OCC rule serializes on."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: ModelRun
    side_effects: []
  - method: POST
    path: "/mmm/model-runs/{id}/fit"
    description: >-
      Fit the run against its SEALED window. Emits one ChannelContribution per included
      channel using the run's carryover_attribution_mode variant, then closes the baseline
      identity. Re-fitting a STALE_FIT run replaces the previous contribution set.
    roles: [Modeler]
    code: 200
    input: []
    output: ModelRun
    side_effects: ["calculations.model_run_aggregates", "calculations.adstock_transform", "calculations.channel_contribution_decomposition", "calculations.roi_estimation", "calculations.contribution_confidence_interval", "ChannelContribution rows created with is_current := true", "fit_status := FITTED", "validation_status := UNVALIDATED", "holdout_mape_pct := null", "fitted_by_user_id := X-User-ID", "version += 1"]
  - method: POST
    path: "/mmm/model-runs/{id}/validate"
    description: "Backtest the fitted run against its holdout periods; branches to HOLDOUT_PASSED or HOLDOUT_FAILED."
    roles: [Modeler]
    code: 200
    input: []
    output: ModelRun
    side_effects: ["calculations.holdout_backtest", "holdout_mape_pct set", "validation_status := HOLDOUT_PASSED or HOLDOUT_FAILED", "version += 1"]
  - method: POST
    path: "/mmm/model-runs/{id}/publish"
    description: >-
      Publish a validated run as the market's single source of truth. Computes the stability
      score against the incumbent published run and supersedes it. override_stability lets an
      AnalyticsLead publish through a stability breach, and is the ONLY way past
      ERR_MODEL_UNSTABLE.
    roles: [AnalyticsLead]
    code: 200
    input: ["override_stability?"]
    output: ModelRun
    side_effects: ["calculations.refresh_stability", "stability_score and refresh_generation set", "previous_published_run_id set", "publication_status := PUBLISHED", "published_by_user_id := X-User-ID", "the incumbent PUBLISHED run -> SUPERSEDED", "the incumbent's ChannelContributions -> is_current := false", "the incumbent's CURRENT ReconciliationReports -> STALE", "the incumbent's OPTIMIZED/APPROVED BudgetScenarios -> INVALIDATED", "Market.data_posture recomputed", "version += 1"]
  - method: POST
    path: "/mmm/model-runs/{id}/recalibrate"
    description: >-
      Apply the run's live CalibrationRecords to its contributions, correcting attribution
      bias and pushing the reclaimed units back into baseline.
    roles: [Modeler]
    code: 200
    input: []
    output: ModelRun
    side_effects: ["calculations.calibration_application", "calibrated_contribution_units and calibrated_contribution_revenue_cents set per channel", "baseline_sales_units recomputed", "calibration_status := CALIBRATED", "Market.data_posture recomputed", "version += 1"]

  # ---------------- ChannelContribution ------------------------------------
  - method: GET
    path: "/mmm/channel-contributions"
    description: >-
      List channel contributions. These rows are ONLY created as a side effect of model-run
      fit, so this filtered list is their sole discovery channel; it reverse-navigates both
      ModelRun -> ChannelContribution and MediaChannel -> ChannelContribution.
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["model_run_id?", "channel_id?", "is_current?", "attribution_mode_used?", "limit?", "offset?"]
    output: ChannelContribution[]
    side_effects: []
  - method: GET
    path: "/mmm/channel-contributions/{id}"
    description: "Read one channel contribution with its ROI pair and confidence interval."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: ChannelContribution
    side_effects: []

  # ---------------- Experiment ---------------------------------------------
  - method: POST
    path: "/mmm/experiments"
    description: "Draft an incrementality experiment on exactly one channel of one market."
    roles: [ExperimentDesigner]
    code: 201
    input: [market_id, channel_id, design_type, readout_method, start_date, end_date, washout_days, minimum_detectable_effect_pct, baseline_conversion_rate, planned_treatment_population, planned_control_population]
    output: Experiment
    side_effects: ["status := DRAFT", "redesign_count := 0", "designed_by_user_id := X-User-ID (the segregation-of-duties comparand)"]
  - method: GET
    path: "/mmm/experiments"
    description: "List experiments; filters reverse-navigate Market -> Experiment and MediaChannel -> Experiment."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["market_id?", "channel_id?", "status?", "design_type?", "readout_method?", "limit?", "offset?"]
    output: Experiment[]
    side_effects: []
  - method: GET
    path: "/mmm/experiments/{id}"
    description: "Read one experiment with its power, realised arms and lift interval."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: Experiment
    side_effects: []
  - method: POST
    path: "/mmm/experiments/{id}/lock-design"
    description: >-
      Freeze the design. Runs the power step table FIRST (priority 52), then the aggregate
      holdout-share ceiling (priority 60), then the asymmetric channel-window overlap test
      (priority 65).
    roles: [ExperimentDesigner]
    code: 200
    input: []
    output: Experiment
    side_effects: ["calculations.experiment_power", "power_index and computed_power frozen", "status := DESIGN_LOCKED", "version += 1", "for AUDIENCE_SPLIT: treatment_population := planned_treatment_population and control_population := planned_control_population"]
  - method: POST
    path: "/mmm/experiments/{id}/assign-cells"
    description: >-
      Enlist geo cells into the treatment and control arms of a GEO_HOLDOUT design. Breaks
      invariant holdout_population_conservation until the market is swept.
    roles: [ExperimentDesigner]
    code: 200
    input: [treatment_cell_ids, control_cell_ids]
    output: Experiment
    side_effects: ["listed cells -> TREATMENT / CONTROL with assigned_experiment_id set", "treatment_population and control_population set from the cell populations", "Market.held_out_population and held_out_population_pct recomputed", "status := CELLS_ASSIGNED", "version += 1"]
  - method: POST
    path: "/mmm/experiments/{id}/start"
    description: >-
      Put the experiment in market. Reachable from CELLS_ASSIGNED for GEO_HOLDOUT and
      directly from DESIGN_LOCKED for AUDIENCE_SPLIT - the branching join of the two design
      paths.
    roles: [ExperimentDesigner]
    code: 200
    input: []
    output: Experiment
    side_effects: ["status := RUNNING", "version += 1"]
  - method: POST
    path: "/mmm/experiments/{id}/read-out"
    description: >-
      Post the observed conversion counts and compute the lift with the estimator named in
      readout_method. synthetic_control_weight is NOT a body field - it is derived from the
      two pre-period counts for SYNTHETIC_CONTROL and left null for DIFF_IN_DIFF.
    roles: [ExperimentDesigner]
    code: 200
    input: [treatment_conversions, control_conversions, pre_treatment_conversions, pre_control_conversions]
    output: Experiment
    side_effects: ["calculations.experiment_lift_readout", "measured_lift_pct, lift_ci_half_width_pct, lift_ci_low_pct, lift_ci_high_pct set", "status := READ_OUT", "version += 1"]
  - method: POST
    path: "/mmm/experiments/{id}/accept"
    description: >-
      Accept the readout as the calibration truth for the market. Head of the four-hop
      calibration cascade (run -> reports + posture -> scenarios). Requires a different
      X-User-ID than the designer.
    roles: [AnalyticsLead]
    code: 200
    input: []
    output: Experiment
    side_effects: ["status := ACCEPTED", "decided_by_user_id := X-User-ID", "the market's PUBLISHED run with calibration_status CALIBRATED -> STALE", "that run's CURRENT ReconciliationReports -> STALE", "Market.data_posture OPEN -> RESTRICTED", "OPTIMIZED BudgetScenarios of the market -> FROZEN with allocations reset to baseline (DRAFT scenarios untouched)", "version += 1"]
  - method: POST
    path: "/mmm/experiments/{id}/reject"
    description: >-
      Reject the readout. Deliberately fires NO cascade - the published run, the posture and
      every budget scenario are untouched, which is the falsifiable contrast with accept.
    roles: [AnalyticsLead]
    code: 200
    input: [rejection_reason]
    output: Experiment
    side_effects: ["status := REJECTED", "rejection_reason stored", "decided_by_user_id := X-User-ID", "version += 1"]
  - method: POST
    path: "/mmm/experiments/{id}/release-cells"
    description: >-
      Release the arms into WASHOUT quarantine. From ACCEPTED the experiment lands on CLOSED
      (terminal); from REJECTED it loops back to DRAFT and increments redesign_count, capped
      at MAX_REDESIGNS. The source state, not the request body, selects the target.
    roles: [ExperimentDesigner]
    code: 200
    input: []
    output: Experiment
    side_effects: ["TREATMENT/CONTROL cells -> WASHOUT with washout_until_date := end_date + washout_days days", "Market.held_out_population UNCHANGED", "status := CLOSED (from ACCEPTED) or DRAFT with redesign_count += 1 and every computed design/readout field reset (from REJECTED)", "version += 1"]

  # ---------------- CalibrationRecord --------------------------------------
  - method: POST
    path: "/mmm/calibration-records"
    description: >-
      Bind an experiment readout to one channel of one model run, deriving the calibration
      multiplier and the attribution bias direction. Supersedes any prior live record for the
      same (model_run_id, channel_id). Serialized by OCC on the parent ModelRun's version.
    roles: [Modeler]
    code: 201
    input: [model_run_id, channel_id, experiment_id, expected_model_run_version]
    output: CalibrationRecord
    side_effects: ["calculations.calibration_multiplier", "experiment_lift_pct copied, model_implied_lift_pct, calibration_multiplier and bias_direction computed", "any prior live record for the same (model_run_id, channel_id) gets superseded := true", "ModelRun.calibration_status := PENDING_CALIBRATION", "ModelRun.version += 1", "model_run_version_after := the post-write ModelRun.version", "Market.data_posture recomputed", "created_by_user_id := X-User-ID"]
  - method: GET
    path: "/mmm/calibration-records"
    description: >-
      List calibration records; filters reverse-navigate ModelRun -> CalibrationRecord,
      MediaChannel -> CalibrationRecord and Experiment -> CalibrationRecord.
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["model_run_id?", "channel_id?", "experiment_id?", "superseded?", "bias_direction?", "limit?", "offset?"]
    output: CalibrationRecord[]
    side_effects: []
  - method: GET
    path: "/mmm/calibration-records/{id}"
    description: "Read one calibration record."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: CalibrationRecord
    side_effects: []

  # ---------------- BudgetScenario / BudgetAllocation ----------------------
  - method: POST
    path: "/mmm/budget-scenarios"
    description: >-
      Open a budget planning scenario against a PUBLISHED run. Validation order here is the
      declared priority-conflict pair: the run-state check (45) outranks the market fiscal
      ceiling (72).
    roles: [BrandPlanner]
    code: 201
    input: [market_id, model_run_id, total_budget_cents, planning_start_date, planning_end_date, "reallocation_fee_pct?"]
    output: BudgetScenario
    side_effects: ["planning_period_count derived from the range and the run's DataWindow granularity", "status := DRAFT", "reallocation_fee_cents, allocated_total_cents, unallocated_cents, shifted_total_cents := 0", "created_by_user_id := X-User-ID (the segregation-of-duties comparand)"]
  - method: GET
    path: "/mmm/budget-scenarios"
    description: "List budget scenarios; filters reverse-navigate Market -> BudgetScenario and ModelRun -> BudgetScenario."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["market_id?", "model_run_id?", "status?", "limit?", "offset?"]
    output: BudgetScenario[]
    side_effects: []
  - method: GET
    path: "/mmm/budget-scenarios/{id}"
    description: "Read one budget scenario; the conservation identity is checkable directly off this response."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: BudgetScenario
    side_effects: []
  - method: POST
    path: "/mmm/budget-allocations"
    description: "Enrol one channel in a scenario with its baseline (pre-optimization) spend."
    roles: [BrandPlanner]
    code: 201
    input: [budget_scenario_id, channel_id, baseline_spend_cents]
    output: BudgetAllocation
    side_effects: ["allocated_cents := baseline_spend_cents", "shifted_cents := 0", "constraint_binding := NONE", "projected_contribution_units := 0.0000"]
  - method: GET
    path: "/mmm/budget-allocations"
    description: >-
      List allocation rows; filters reverse-navigate BudgetScenario -> BudgetAllocation and
      MediaChannel -> BudgetAllocation.
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["budget_scenario_id?", "channel_id?", "constraint_binding?", "limit?", "offset?"]
    output: BudgetAllocation[]
    side_effects: []
  - method: GET
    path: "/mmm/budget-allocations/{id}"
    description: "Read one allocation row with its binding marker."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: BudgetAllocation
    side_effects: []
  - method: POST
    path: "/mmm/budget-scenarios/{id}/optimize"
    description: >-
      Run the two-pass greedy marginal-ROI waterfall. Pass 1 prices the churn into a
      reallocation fee; pass 2 reallocates the post-fee budget with the fee PINNED at its
      pass-1 value. Breaks nothing: the conservation identity holds in the response.
    roles: [BrandPlanner]
    code: 200
    input: []
    output: BudgetScenario
    side_effects: ["calculations.budget_optimization", "per-row allocated_cents, shifted_cents, constraint_binding, projected_contribution_units", "scenario reallocation_fee_cents, allocated_total_cents, shifted_total_cents, unallocated_cents, projected_contribution_units, projected_incremental_revenue_cents", "status := OPTIMIZED", "version += 1"]
  - method: POST
    path: "/mmm/budget-scenarios/{id}/revert-optimization"
    description: >-
      Compensating action: undo the optimization exactly, restoring every allocation to its
      baseline and zeroing the fee, churn and unallocated remainder with no residual drift.
    roles: [BrandPlanner]
    code: 200
    input: []
    output: BudgetScenario
    side_effects: ["every allocation row restored to baseline_spend_cents with shifted_cents := 0, constraint_binding := NONE, projected_contribution_units := 0.0000", "reallocation_fee_cents, shifted_total_cents, unallocated_cents, projected_contribution_units, projected_incremental_revenue_cents := 0", "allocated_total_cents := total_budget_cents", "status := DRAFT", "version += 1"]
  - method: POST
    path: "/mmm/budget-scenarios/{id}/approve"
    description: >-
      Approve an optimized plan. Requires a different X-User-ID than the creator and a run
      whose calibration is not stale.
    roles: [AnalyticsLead]
    code: 200
    input: []
    output: BudgetScenario
    side_effects: ["status := APPROVED", "approved_by_user_id := X-User-ID", "version += 1"]

  # ---------------- ReconciliationReport -----------------------------------
  - method: POST
    path: "/mmm/reconciliation-reports"
    description: >-
      Reconcile platform-reported attribution against the model's channel revenue. The
      per-line percentages are rounded FIRST and then weighted by model share - the rounding
      order is observable at the materiality boundary.
    roles: [AnalyticsLead]
    code: 201
    input: [model_run_id, reporting_period_start, reporting_period_end, platform_lines]
    output: ReconciliationReport
    side_effects: ["calculations.reconciliation_variance", "variance_lines, platform_reported_revenue_cents, model_attributed_revenue_cents, total_variance_cents, weighted_variance_pct, attribution_gap_flag set", "status := CURRENT"]
  - method: GET
    path: "/mmm/reconciliation-reports"
    description: "List reconciliation reports; filter by model_run_id to reverse-navigate ModelRun -> ReconciliationReport."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: ["model_run_id?", "status?", "attribution_gap_flag?", "basis?", "limit?", "offset?"]
    output: ReconciliationReport[]
    side_effects: []
  - method: GET
    path: "/mmm/reconciliation-reports/{id}"
    description: "Read one reconciliation report with its per-line variance breakdown."
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner, Auditor]
    code: 200
    input: []
    output: ReconciliationReport
    side_effects: []

  # ---------------- test-driving surface -----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock, which every temporal rule reads. The startup DEFAULT is
      exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads
      that instant and MUST NOT fall back to real wall-clock time. The clock only moves
      forward - a request for an earlier instant returns ERR_CLOCK_REWIND.
    roles: [DataEngineer, Modeler, ExperimentDesigner, AnalyticsLead, BrandPlanner]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["the logical clock advances; no stored row changes and no cascade fires"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is unknown, or is not permitted for this endpoint per §1.7."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals Experiment.designed_by_user_id on accept/reject, or BudgetScenario.created_by_user_id on approve."

  # ---- not found -----------------------------------------------------------
  - id: ERR_MARKET_NOT_FOUND
    http: 404
    condition: "No Market with the given id (path or body market_id)."
  - id: ERR_MEDIA_CHANNEL_NOT_FOUND
    http: 404
    condition: "No MediaChannel with the given id (path, body channel_id, or an id inside included_channel_ids / a platform line)."
  - id: ERR_GEO_CELL_NOT_FOUND
    http: 404
    condition: "No GeoCell with the given id (path, or an id inside treatment_cell_ids / control_cell_ids)."
  - id: ERR_DATA_WINDOW_NOT_FOUND
    http: 404
    condition: "No DataWindow with the given id (path or body data_window_id)."
  - id: ERR_SPEND_OBSERVATION_NOT_FOUND
    http: 404
    condition: "No SpendObservation with the given path id."
  - id: ERR_SALES_OBSERVATION_NOT_FOUND
    http: 404
    condition: "No SalesObservation with the given path id."
  - id: ERR_MODEL_RUN_NOT_FOUND
    http: 404
    condition: "No ModelRun with the given id (path or body model_run_id)."
  - id: ERR_CHANNEL_CONTRIBUTION_NOT_FOUND
    http: 404
    condition: "No ChannelContribution with the given path id."
  - id: ERR_EXPERIMENT_NOT_FOUND
    http: 404
    condition: "No Experiment with the given id (path or body experiment_id)."
  - id: ERR_CALIBRATION_RECORD_NOT_FOUND
    http: 404
    condition: "No CalibrationRecord with the given path id."
  - id: ERR_BUDGET_SCENARIO_NOT_FOUND
    http: 404
    condition: "No BudgetScenario with the given id (path or body budget_scenario_id)."
  - id: ERR_BUDGET_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No BudgetAllocation with the given path id."
  - id: ERR_RECONCILIATION_REPORT_NOT_FOUND
    http: 404
    condition: "No ReconciliationReport with the given path id."

  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: >-
      Malformed body, missing required field, enum value outside its declared set, numeric
      value outside its declared range, non-ISO-8601 date, empty rejection_reason, a
      DataWindow whose day span does not divide evenly by its granularity, or a
      platform_lines entry missing channel_id or platform_revenue_cents.

  # ---- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_DATA_WINDOW_VERSION
    http: 412
    condition: "expected_data_window_version does not equal the parent DataWindow's current version on POST /mmm/spend-observations."
  - id: ERR_STALE_MODEL_RUN_VERSION
    http: 412
    condition: "expected_model_run_version does not equal the parent ModelRun's current version on POST /mmm/calibration-records."

  # ---- target-resource state ----------------------------------------------
  - id: ERR_DATA_WINDOW_INVALID_STATE
    http: 409
    condition: "seal from SEALED, or reopen from OPEN or REOPENED."
  - id: ERR_MODEL_RUN_INVALID_STATE
    http: 409
    condition: "fit on a FITTED run, validate on a PENDING or STALE_FIT run, publish on a run that is not FITTED or is already PUBLISHED or SUPERSEDED, or recalibrate on a run that is not FITTED."
  - id: ERR_EXPERIMENT_INVALID_STATE
    http: 409
    condition: "Any experiment action invoked from a state that has no such transition, including every action from the terminal CLOSED state."
  - id: ERR_BUDGET_SCENARIO_INVALID_STATE
    http: 409
    condition: "optimize from a state other than DRAFT, revert-optimization from a state other than OPTIMIZED, approve from a state other than OPTIMIZED, or any action from the terminal INVALIDATED state."

  # ---- cross-entity state -------------------------------------------------
  - id: ERR_DATA_WINDOW_NOT_SEALED
    http: 409
    condition: "Fitting a run whose DataWindow.status is OPEN or REOPENED."
  - id: ERR_DATA_WINDOW_SEALED
    http: 409
    condition: "Filing a spend or sales observation into a SEALED window."
  - id: ERR_CHANNEL_RETIRED
    http: 409
    condition: "A channel in included_channel_ids has status == RETIRED."
  - id: ERR_HOLDOUT_NOT_PASSED
    http: 409
    condition: "Publishing a run whose validation_status is UNVALIDATED or HOLDOUT_FAILED."
  - id: ERR_CALIBRATION_NOT_PENDING
    http: 409
    condition: "recalibrate on a run whose calibration_status is NOT_REQUIRED, CALIBRATED or STALE."
  - id: ERR_CALIBRATION_STALE
    http: 409
    condition: "Approving a budget scenario, or filing a reconciliation report, against a run whose calibration_status is PENDING_CALIBRATION or STALE."
  - id: ERR_NO_PUBLISHED_MODEL_RUN
    http: 409
    condition: "Accepting an experiment readout in a market that has no PUBLISHED ModelRun to calibrate."
  - id: ERR_MODEL_RUN_NOT_PUBLISHED
    http: 409
    condition: "Creating, optimizing or approving a budget scenario against a run that is not PUBLISHED + FITTED."
  - id: ERR_GEO_CELL_UNAVAILABLE
    http: 409
    condition: "A listed GeoCell is already TREATMENT, CONTROL or WASHOUT."
  - id: ERR_MARKET_POSTURE_BLOCKED
    http: 409
    condition: "Market.data_posture is FROZEN for a gated write, or is not OPEN for budget-scenario optimize."

  # ---- referential coherence ---------------------------------------------
  - id: ERR_CHANNEL_NOT_IN_MARKET
    http: 422
    condition: "The referenced MediaChannel's market_id differs from the referencing row's market_id."
  - id: ERR_GEO_CELL_NOT_IN_MARKET
    http: 422
    condition: "A listed GeoCell's market_id differs from the experiment's market_id."
  - id: ERR_DESIGN_TYPE_MISMATCH
    http: 422
    condition: "assign-cells called on an AUDIENCE_SPLIT experiment."
  - id: ERR_CELLS_NOT_ASSIGNED
    http: 422
    condition: "start called on a GEO_HOLDOUT experiment still in DESIGN_LOCKED."
  - id: ERR_NO_SPEND_OBSERVATIONS
    http: 422
    condition: "An included channel has no non-superseded SpendObservation inside the run's window."
  - id: ERR_NO_ALLOCATIONS
    http: 422
    condition: "optimize on a scenario with zero BudgetAllocation rows."
  - id: ERR_PLATFORM_LINE_MISMATCH
    http: 422
    condition: "platform_lines omits a channel that has an is_current contribution, duplicates a channel, or names a channel with no is_current contribution on the run."

  # ---- aggregate and boundary constraints ---------------------------------
  - id: ERR_HOLDOUT_SHARE_EXCEEDED
    http: 422
    condition: "The market's held-out population would exceed MAX_HOLDOUT_POPULATION_PCT (20) of total_population, compared as exact integers."
  - id: ERR_CONVERSIONS_EXCEED_POPULATION
    http: 422
    condition: "A supplied conversion count exceeds its arm's realised population."
  - id: ERR_LIFT_NOT_SIGNIFICANT
    http: 422
    condition: "Accepting a readout whose lift_ci_low_pct is <= 0.00."
  - id: ERR_REDESIGN_LIMIT_REACHED
    http: 422
    condition: "release-cells would push redesign_count past MAX_REDESIGNS (2)."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A scoped-uniqueness key already exists (market_code; channel_code per market; cell_code per market; sales period per window; channel per scenario; reporting_period_start per run)."
  - id: ERR_MODEL_BASELINE_NEGATIVE
    http: 422
    condition: "Fit or recalibrate would leave baseline_sales_units < 0, i.e. the channel contributions exceed modeled_sales_units."
  - id: ERR_CALIBRATION_MULTIPLIER_OUT_OF_RANGE
    http: 422
    condition: "The raw experiment/model lift quotient falls outside [0.25, 4.00]."
  - id: ERR_MODEL_UNSTABLE
    http: 422
    condition: "stability_score < STABILITY_FLOOR (0.6000) on publish and override_stability is not true."
  - id: ERR_EXPERIMENT_UNDERPOWERED
    http: 422
    condition: "computed_power from the POWER_INDEX_TABLE is below MIN_EXPERIMENT_POWER (0.80)."

  # ---- temporal ------------------------------------------------------------
  - id: ERR_EXPERIMENT_WINDOW_CONFLICT
    http: 409
    condition: "The locked interval overlaps a live experiment's [start_date, end_date + washout_days) on the same (market_id, channel_id)."
  - id: ERR_DATA_WINDOW_OVERLAP
    http: 409
    condition: "The new window's closed date range touches or overlaps another window of the same market with the SAME granularity."
  - id: ERR_DATA_WINDOW_NOT_ELAPSED
    http: 409
    condition: "seal called while current_utc < window_end_date."
  - id: ERR_EXPERIMENT_NOT_STARTED
    http: 409
    condition: "start called while current_utc < start_date."
  - id: ERR_EXPERIMENT_NOT_ELAPSED
    http: 409
    condition: "read-out called while current_utc < end_date."
  - id: ERR_PERIOD_NOT_ALIGNED
    http: 422
    condition: "period_start_date falls outside the window's closed range, or off the granularity grid anchored at window_start_date."
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "POST /_clock/set_current_utc requested an instant earlier than the current logical clock."

  # ---- completeness and fiscal -------------------------------------------
  - id: ERR_DATA_WINDOW_INCOMPLETE
    http: 422
    condition: "seal called with sales_period_count < MIN_SEALED_PERIOD_COUNT (4) or lag_completeness_pct != 100.00."
  - id: ERR_LAG_WINDOW_INCOMPLETE
    http: 422
    condition: "DataWindow.expected_period_count is not strictly greater than the largest adstock_max_lag_periods among the run's included channels."
  - id: ERR_FLOORS_EXCEED_BUDGET
    http: 422
    condition: "The sum of the allocated channels' min_spend_cents exceeds total_budget_cents."
  - id: ERR_BUDGET_CEILING_EXCEEDED
    http: 422
    condition: "total_budget_cents exceeds Market.annual_budget_ceiling_cents."
  - id: ERR_BASELINE_BUDGET_MISMATCH
    http: 422
    condition: "The sum of BudgetAllocation.baseline_spend_cents does not equal total_budget_cents at optimize time."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
# role_model: segregation_of_duties. Every role's identity is `opaque` - X-User-ID is an
# operator identifier, never the id of a persisted row. The scaffold stores opaque ids on
# rows (fitted_by_user_id, published_by_user_id, designed_by_user_id, decided_by_user_id,
# created_by_user_id, approved_by_user_id) but never requires one to equal any entity's id.
# Two duty separations are enforced at priority 22: an experiment's designer may not decide
# its readout, and a scenario's creator may not approve it. Both comparisons are on the
# stored opaque id, so the SAME human acting under a different role is still blocked, and a
# DIFFERENT human under the same role is allowed - the check is identity-based, not role-based.
roles:
  - name: DataEngineer
    description: "Owns the data-collection surface: markets, channels, geo cells, windows and observations. Cannot fit, publish, design experiments, optimize budgets or approve anything."
    identity: opaque
    exclusive_operations:
      - "POST /mmm/markets"
      - "POST /mmm/media-channels"
      - "PATCH /mmm/media-channels/{id}"
      - "POST /mmm/geo-cells"
      - "POST /mmm/data-windows"
      - "POST /mmm/data-windows/{id}/seal"
      - "POST /mmm/data-windows/{id}/reopen"
      - "POST /mmm/spend-observations"
      - "POST /mmm/sales-observations"
    shared_operations:
      - "every GET under /mmm"
      - "POST /_clock/set_current_utc"

  - name: Modeler
    description: "Specifies, fits, validates, calibrates and files calibration records for model runs. Cannot publish (that is the AnalyticsLead's duty) and cannot touch source data."
    identity: opaque
    exclusive_operations:
      - "POST /mmm/model-runs"
      - "POST /mmm/model-runs/{id}/fit"
      - "POST /mmm/model-runs/{id}/validate"
      - "POST /mmm/model-runs/{id}/recalibrate"
      - "POST /mmm/calibration-records"
    shared_operations:
      - "every GET under /mmm"
      - "POST /_clock/set_current_utc"

  - name: ExperimentDesigner
    description: "Designs, powers, cells, starts, reads out and releases incrementality experiments, and runs the market washout sweep. Cannot accept or reject its own readout."
    identity: opaque
    exclusive_operations:
      - "POST /mmm/experiments"
      - "POST /mmm/experiments/{id}/lock-design"
      - "POST /mmm/experiments/{id}/assign-cells"
      - "POST /mmm/experiments/{id}/start"
      - "POST /mmm/experiments/{id}/read-out"
      - "POST /mmm/experiments/{id}/release-cells"
      - "POST /mmm/markets/{id}/washout-sweep"
    shared_operations:
      - "every GET under /mmm"
      - "POST /_clock/set_current_utc"

  - name: AnalyticsLead
    description: "Sole decision authority: publishes model runs, decides experiment readouts, approves budget scenarios and files reconciliation reports. Holds the override_stability privilege."
    identity: opaque
    exclusive_operations:
      - "POST /mmm/model-runs/{id}/publish"
      - "POST /mmm/experiments/{id}/accept"
      - "POST /mmm/experiments/{id}/reject"
      - "POST /mmm/budget-scenarios/{id}/approve"
      - "POST /mmm/reconciliation-reports"
    shared_operations:
      - "every GET under /mmm"
      - "POST /_clock/set_current_utc"

  - name: BrandPlanner
    description: "Builds and optimizes budget scenarios. Can revert its own optimization but can never approve a scenario, not even one it did not create."
    identity: opaque
    exclusive_operations:
      - "POST /mmm/budget-scenarios"
      - "POST /mmm/budget-allocations"
      - "POST /mmm/budget-scenarios/{id}/optimize"
      - "POST /mmm/budget-scenarios/{id}/revert-optimization"
    shared_operations:
      - "every GET under /mmm"
      - "POST /_clock/set_current_utc"

  - name: Auditor
    description: "Strictly read-only. Sees every row including superseded observations and STALE reports, and can perform no mutation whatsoever - not even the logical clock."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every GET under /mmm"
