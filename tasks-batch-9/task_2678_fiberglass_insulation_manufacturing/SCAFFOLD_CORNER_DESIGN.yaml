            - "with the line live: InventoryLot.${lot_a}.status == ALLOCATED, allocated_sqft == 8800.00 and available_sqft == 1760.00"
            - "${err_alloc} == \"ERR_LOT_HAS_ALLOCATIONS\" with HTTP 409, and the lot is unchanged: status STILL ALLOCATED, no child lot exists (GET /inventory-lots returns total_count == 1)"
            - "the revoke returns HTTP 200: AllocationLine.${line}.status == REVOKED, InventoryLot.${lot_a}.allocated_sqft back to 0.00 and status back to AVAILABLE, ChannelOrder.${order}.allocated_sqft == 0.00 with fill_rate_pct == 0.00 and status == BACKORDERED"
            - "the identical repack payload now returns HTTP 200: InventoryLot.${lot_a}.status == REPACKED and two child lots exist, each with 60 bags, produced_sqft 5280.00 and parent_lot_id == ${lot_a}"
            - "the children's coverage sums back to the parent exactly: 5280.00 + 5280.00 == 10560.00"

      - name: revising_past_the_max_binder_revisions_ceiling_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BINDER_REVISION_LIMIT_REACHED]
          - errors[ERR_INVALID_STATE]
          - validations[priority=84]
          - state_machines[BinderFormulation.status].transitions[REVISION_REQUIRED->DRAFT]
          - state_machines[BinderFormulation.status].transitions[REVISION_REQUIRED->WITHDRAWN]
          - calculations.binder_cure_index.constants.MAX_BINDER_REVISIONS
        distinguishing_aspect: "The certification loop is bounded, and the bound is invisible in the status word: the row sits in REVISION_REQUIRED for both the second and the third visit, and only revision_count (2 == MAX_BINDER_REVISIONS) decides that REVISE is dead while WITHDRAW is still available on the very same endpoint and payload shape. Once withdrawn the row is terminal, so a further revise degrades from the limit error to ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Binder BF-LOOP-1 (phenolic) drafted and walked twice around DRAFT -> SUBMITTED -> EMISSIONS_TESTING -> REVISION_REQUIRED -> DRAFT, so revision_count == 2 == MAX_BINDER_REVISIONS."
            - "A third emissions test and a third REQUEST_REVISION leave the row in REVISION_REQUIRED with revision_count STILL 2."
            - "No ProductLine references this formulation, so the withdrawal cascade has nothing to suspend."
          setup_api_calls:
            - call: "POST /binder-formulations"
              payload: { code: "BF-LOOP-1", formaldehyde_free: false, formaldehyde_ppm: 200, voc_g_per_kg: 4.0, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_rev: "$.data.id" }
            - call: "POST /binder-formulations/${binder_rev}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_rev}/emissions-test"
              payload: { formaldehyde_ppm: 200, voc_g_per_kg: 4.0, lab_reference: "LAB-9201" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_rev}/certification-decision"
              payload: { decision: "REQUEST_REVISION", revision_notes: "VOC too high for the program" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_rev}/revise"
              payload: { decision: "REVISE", formaldehyde_free: false, formaldehyde_ppm: 180, voc_g_per_kg: 3.8, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_rev}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_rev}/emissions-test"
              payload: { formaldehyde_ppm: 180, voc_g_per_kg: 3.8, lab_reference: "LAB-9202" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_rev}/certification-decision"
              payload: { decision: "REQUEST_REVISION", revision_notes: "still short of the target" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_rev}/revise"
              payload: { decision: "REVISE", formaldehyde_free: false, formaldehyde_ppm: 150, voc_g_per_kg: 3.5, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_rev}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_rev}/emissions-test"
              payload: { formaldehyde_ppm: 150, voc_g_per_kg: 3.5, lab_reference: "LAB-9203" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_rev}/certification-decision"
              payload: { decision: "REQUEST_REVISION", revision_notes: "third look, formaldehyde still measurable" }
              as: CertificationOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /binder-formulations/${binder_rev}/revise"
              payload: { decision: "REVISE", formaldehyde_free: false, formaldehyde_ppm: 120, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err_limit: "$.data.error_id" }
            - call: "POST /binder-formulations/${binder_rev}/revise"
              payload: { decision: "WITHDRAW" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_rev}/revise"
              payload: { decision: "REVISE", formaldehyde_free: false, formaldehyde_ppm: 100, voc_g_per_kg: 3.0, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err_terminal: "$.data.error_id" }
          assert:
            - "the setup really reached the ceiling: BinderFormulation.${binder_rev}.status == REVISION_REQUIRED with revision_count == 2 and lab_reference == \"LAB-9203\""
            - "${err_limit} == \"ERR_BINDER_REVISION_LIMIT_REACHED\" with HTTP 409: revision_count 2 already equals MAX_BINDER_REVISIONS == 2, so the REVISION_REQUIRED -> DRAFT edge is exhausted"
            - "the refused revise wrote nothing: status is STILL REVISION_REQUIRED, revision_count is STILL 2, formaldehyde_ppm is STILL 150 and voc_g_per_kg is STILL 3.5"
            - "the WITHDRAW decision on the SAME endpoint returns HTTP 200 with status == WITHDRAWN — the ceiling closes the revise edge only, not the whole row"
            - "${err_terminal} == \"ERR_INVALID_STATE\" with HTTP 409, not ERR_BINDER_REVISION_LIMIT_REACHED: WITHDRAWN is terminal, and terminal-state lockdown is checked at priority 40, ahead of the revision ceiling at priority 84"

      - name: uncertified_binder_blocks_sku_certification_submission
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BINDER_NOT_CERTIFIED]
          - validations[priority=52]
        excluded_because:
          difficulty_instance: sku_certification_submission_gated_on_binder_reaching_certified
          rationale: "The §1.8 instance walks one SKU's binder through DRAFT, SUBMITTED and EMISSIONS_TESTING, showing submit-certification refused with ERR_BINDER_NOT_CERTIFIED at every stop and accepted only once the binder is CERTIFIED. A breadth-level single violation would be a strict subset of that."

      - name: overlapping_changeover_windows_on_one_line_conflict
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHANGEOVER_WINDOW_CONFLICT]
          - validations[priority=60]
        excluded_because:
          difficulty_instance: changeover_window_conflict_outranks_width_change_out_of_range
          rationale: "The §1.8 instance triggers this code on a buffer-inflated overlap while a width violation is ALSO present, which both proves the code is reachable and pins its priority against ERR_WIDTH_CHANGE_OUT_OF_RANGE. Re-triggering it alone would add no observation the ordering test does not already make."

      - name: a_width_step_beyond_the_plant_limit_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WIDTH_CHANGE_OUT_OF_RANGE]
          - validations[priority=70]
        excluded_because:
          difficulty_instance: changeover_window_conflict_outranks_width_change_out_of_range
          rationale: "The same §1.8 instance closes this code from the other side: after the conflicting changeover is removed, the identical payload is refused with ERR_WIDTH_CHANGE_OUT_OF_RANGE, so both the code and its position in the ladder are already covered."

      - name: overlapping_runs_on_one_forming_line_conflict
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LINE_OCCUPANCY_CONFLICT]
          - validations[priority=62]
        excluded_because:
          difficulty_instance: forming_line_occupancy_is_half_open_and_scoped_per_line
          rationale: "The §1.8 instance triggers the conflict on a genuine overlap, then shows the touching-endpoint case and the other-line case both accepted — the half-open boundary and the per-line scoping are the whole content of this code."

      - name: a_third_concurrent_lab_test_exceeds_program_capacity
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LAB_CAPACITY_EXCEEDED]
          - validations[priority=64]
        excluded_because:
          difficulty_instance: lab_capacity_is_aggregate_over_closed_windows_within_one_program
          rationale: "The §1.8 instance drives the aggregate to max_concurrent_lab_tests with intersecting closed windows, triggers ERR_LAB_CAPACITY_EXCEEDED, and then shows the same third test accepted once a window is disjoint or the program differs. A single-violation repeat would be strictly weaker."

  # ===========================================================================
  # 7. RBAC
  #
  # role_model is segregation_of_duties, so Table 7 contributes three claim
  # types: every role can run its own exclusive_operations, no role can run
  # another's, and the same HUMAN (X-User-ID) may not both generate and rule on
  # the same evidence.
  #
  # Convention used below: `as: NONE` means the request is sent with BOTH the
  # X-User-ID and the X-User-Role headers omitted entirely — it is not a role
  # name. Every such call sits in an instance whose name marks it as a negative
  # trigger.
  # ===========================================================================
  - section: rbac
    instances:
      - name: every_role_can_run_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.CorporateOps.exclusive_operations
          - roles.PlantOperator.exclusive_operations
          - roles.QualityEngineer.exclusive_operations
          - roles.CertificationOfficer.exclusive_operations
          - roles.EnvironmentalCompliance.exclusive_operations
          - roles.ChannelManager.exclusive_operations
          - roles.ChannelBuyer.exclusive_operations
        distinguishing_aspect: "One end-to-end pass in which all seven roles act, each on at least one operation that only it may perform: reference data and the clock (CorporateOps), the melt/cure/package chain (PlantOperator), binder drafting and the thermal lab (QualityEngineer), the emissions test and both certification decisions (CertificationOfficer), the permit report (EnvironmentalCompliance), cycle creation (ChannelManager) and order cancellation (ChannelBuyer). The point is that the union of the seven role grants covers the whole business flow with no gap that requires a super-user."
        test_recipe:
          setup:
            - "Empty database; everything below is created in-flight by its rightful role."
          setup_api_calls:
            - call: "GET /_health"
              payload: {}
              as: ChannelBuyer
              as_user_id: "cb-1"
          trigger:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: CorporateOps
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", line_index: 1, scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T14:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_a: "$.data.id" }
            - call: "POST /production-runs/${run_a}/start-melt"
              payload: { cullet_batch_ids: [] }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /production-runs/${run_a}/start-cure"
              payload: { avg_zone_temp_f: 470.0, line_speed_fpm: 40.0, binder_applied_kg: 900.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /thermal-tests"
              payload: { production_run_id: "${run_a}", product_line_id: "${pl_a}", certification_program_id: "${prog_ps}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T12:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { test_a: "$.data.id" }
            - call: "POST /thermal-tests/${test_a}/start-lab"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /thermal-tests/${test_a}/record-result"
              payload: { specimen_r_values: [13.10, 13.20, 12.90] }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /product-lines/${pl_a}/submit-certification"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /product-lines/${pl_a}/certification-decision"
              payload: { decision: "CERTIFY" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /production-runs/${run_a}/package"
              payload: { bags_produced: 120 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "GET /inventory-lots"
              payload: { production_run_id: "${run_a}" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { lot_a: "$.data[0].id" }
            - call: "POST /plants/${plant_id}/emissions-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-03T06:00:00Z" }
              as: EnvironmentalCompliance
              as_user_id: "ec-1"
            - call: "POST /channel-orders"
              payload: { product_line_id: "${pl_a}", channel_type: "RETAIL", priority_tier: "SPOT", requested_sqft: 880.00, required_by: "2026-08-20T00:00:00Z" }
              as: ChannelBuyer
              as_user_id: "cb-1"
              captures: { order: "$.data.id" }
            - call: "POST /allocation-cycles"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", allocation_basis: "PRO_RATA" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { cycle: "$.data.id" }
            - call: "POST /channel-orders/${order}/cancel"
              payload: { cancel_reason: "buyer deferred to next season" }
              as: ChannelBuyer
              as_user_id: "cb-1"
            - call: "PATCH /product-lines/${pl_a}/packaging"
              payload: { compression_ratio: 6.5 }
              as: CorporateOps
          assert:
            - "every call in the trigger returns 2xx: no role needed a permission it does not hold, and no operation needed two roles at once"
            - "CorporateOps minted the CertificationProgram, the Plant, the ProductLine and drove POST /_clock/set_current_utc"
            - "PlantOperator drove POST /production-runs, start-melt, start-cure and package, and the packaging call minted InventoryLot ${lot_a} with 120 bags and produced_sqft == 10560.00"
            - "QualityEngineer drafted and submitted BF-FREE-1, requested the ThermalTest, started the lab and recorded the specimens; CertificationOfficer ran the binder emissions test and both certification decisions, leaving ProductLine.${pl_a}.certification_status == CERTIFIED"
            - "EnvironmentalCompliance filed the permit report: Plant.${plant_id}.emissions_status == REPORTED with reported_formaldehyde_kg == 0.0000 and reported_voc_kg == 2.8800, and melt_posture stays OPEN"
            - "ChannelBuyer placed order ${order} (a shared operation) and cancelled it (its exclusive one): ChannelOrder.${order}.status == CANCELLED"
            - "ChannelManager opened cycle ${cycle} with allocation_basis == PRO_RATA and status == OPEN"
            - "the CorporateOps packaging patch returns 200 with ProductLine.${pl_a}.compression_ratio == 6.5 and every other field untouched"

      - name: no_role_can_reach_another_roles_exclusive_operation_and_unauthenticated_calls_are_refused_first
        claim_type: unauthorized_operations
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_PLANT_NOT_OWNED]
          - errors[ERR_ORDER_NOT_OWNED]
          - validations[priority=1]
          - validations[priority=5]
          - validations[priority=15]
          - validations[priority=16]
        distinguishing_aspect: "Four different refusals that all look like \"permission denied\" but are separated by priority. Missing headers (401) outrank an unusable role (403), which outranks every ownership check; and the two ownership checks are row-scoped rather than endpoint-scoped — PlantOperator is a legal role for POST /production-runs and ChannelBuyer is the ONLY role for order cancellation, yet both are refused when the X-User-ID names the wrong row. The ownership check also outranks request-shape validation, so a request that is both foreign and malformed reports 403, not 422."
        test_recipe:
          setup:
            - "Certified SKU PL-A at plant NWK, plus a SECOND plant CMD so a PlantOperator can hold a legitimate role while naming the wrong plant."
            - "One RETAIL order for 880.00 sqft placed by buyer cb-1, so placed_by_user_id == \"cb-1\"."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
