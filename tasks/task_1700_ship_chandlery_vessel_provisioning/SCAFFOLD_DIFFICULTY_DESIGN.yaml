  # Rule 4 — transitive_cascade (2 instances, depth 3 and depth 2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complaint_accept_depth3_credit_cascade
        grounds:
          - state_machines.QualityComplaint.SUBMITTED_to_ACCEPTED
          - state_machines.CreditNote
          - state_machines.Invoice.ISSUED_to_CREDITED
          - calculations.credit_note_amount
          - calculations.agent_credit_exposure
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /complaints/{id}/accept: (1) the
          complaint's ACCEPTED transition auto-creates a CreditNote; (2) that
          credit application mutates the Invoice (credited_amount += 47,500,
          outstanding drops, status ISSUED -> CREDITED when fully credited);
          (3) the invoice mutation re-derives ShipAgent settled/committed
          exposure. Each link is caused by the previous link, not by the
          original request — verified by observing all three levels.
        test_recipe:
          setup:
            - "Agent USD; WHISKY order 100 x 5000 accepted AFTER customs CLEARED (duty-free): invoice total 480,000 (500,000 subtotal - 20,000 rebate), fx 1.0"
