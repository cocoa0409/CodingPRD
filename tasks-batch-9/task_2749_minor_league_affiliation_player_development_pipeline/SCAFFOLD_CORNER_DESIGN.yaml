              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { st_aff: $.data.id }
            - call: "POST /affiliates/${st_aff}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0, housing_expense_cents: 400000, meal_expense_cents: 200000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { st_agr: $.data.id }
            - call: "POST /agreements/${st_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${st_aff}"
            - call: "POST /agreements/${st_agr}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /agreements/${st_agr}/disposition"
              payload: { action: "SETTLE", audited_housing_expense_cents: 300000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { st_final: $.data.final_club_obligation_cents, st_flag: $.data.settlement_status }
            - call: "POST /agreements/${st_agr}/disposition"
              payload: { action: "SETTLE", audited_housing_expense_cents: 999999 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { st_err: $.data.error_id }
            - call: "GET /affiliates/${st_agr}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { st_probe_err: $.data.error_id }
            - call: "GET /affiliates/${st_aff}/agreements"
              payload: { status: "ACTIVE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { st_audited: "$.data[0].audited_housing_expense_cents" }
          assert:
            - "The first SETTLE returns 200 with final_club_obligation_cents == 345000, affiliate_overflow_cents == 0 and settlement_status == SETTLED"
            - "The second SETTLE returns 409 with error_id == ERR_ALREADY_SETTLED (not ERR_INVALID_AGREEMENT_STATE, because ACTIVE + SETTLE is a declared transition)"
            - "audited_housing_expense_cents is still 300000 — the rejected replay did not store 999999"
            - "Passing an agreement id to GET /affiliates/{id} returns 404 ERR_AFFILIATE_NOT_FOUND, confirming the two id spaces are distinct"
            - "AffiliationAgreement.${st_agr}.status is still ACTIVE after both attempts"

