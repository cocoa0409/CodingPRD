# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Label & Flexible-Packaging Converter
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Customer.fields.credit_hold, entities.Customer.fields.preferred_currency]
        distinguishing_aspect: "Creating a customer with only account_name applies defaults credit_hold=false and preferred_currency=USD."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Default Co" }
              as: Estimator
              captures: { c_id: $.data.id }
          assert:
            - "Customer.${c_id}.credit_hold == false"
            - "Customer.${c_id}.preferred_currency == 'USD'"
            - "Customer.${c_id}.version == 1"

      - name: customer_not_found_returns_404
        claim_type: not_found
        grounds:
          - 'errors[ERR_NOT_FOUND]'
          - 'validations[priority=3]'
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /label-jobs/customers/00000000-0000-0000-0000-000000000000"
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with error_id == ERR_NOT_FOUND"

      - name: customer_list_pagination_envelope
        claim_type: listing
        grounds:
          - 'response_envelope'
          - 'endpoints["GET /label-jobs/customers"]'
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more."
        test_recipe:
          setup: ["three customers exist"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Page A" }
              as: Estimator
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Page B" }
              as: Estimator
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Page C" }
              as: Estimator
          trigger:
            - call: "GET /label-jobs/customers?limit=2&offset=0"
              as: Estimator
          assert:
            - "response envelope contains 2 data items"
            - "total_count == 3 and has_more == true"

      - name: artwork_revision_must_increase_monotonically
        claim_type: type_constraints
        grounds:
          - 'entities.ArtworkVersion.fields.revision_no'
          - 'errors[ERR_ARTWORK_REVISION_NOT_MONOTONIC]'
          - 'validations[priority=9]'
        distinguishing_aspect: "A second revision with revision_no equal to the existing max for the same (customer, artwork_code) is rejected; a higher revision succeeds."
        test_recipe:
          setup: ["Customer C; artwork code AW-R rev1 registered"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Rev Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-R", revision_no: 1, color_count: 2, plate_set_cost_cents: 100000 }
              as: PrepressOperator
              captures: { av1: $.data.id }
          trigger:
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-R", revision_no: 1, color_count: 2, plate_set_cost_cents: 100000 }
              as: PrepressOperator
              captures: { err: $.data.error_id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-R", revision_no: 2, color_count: 2, plate_set_cost_cents: 100000 }
              as: PrepressOperator
              captures: { av2: $.data.id }
          assert:
            - "duplicate revision returns http 422 error_id == ERR_ARTWORK_REVISION_NOT_MONOTONIC"
            - "revision_no 2 succeeds with status DRAFT"

      - name: substrate_create_get_roundtrip
        claim_type: creation
        grounds:
          - 'entities.Substrate'
          - 'endpoints["POST /label-jobs/substrates"]'
          - 'endpoints["GET /label-jobs/substrates/{substrateId}"]'
        distinguishing_aspect: "POST with all required fields returns 201 and GET returns the stored field values unchanged."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "RT-1", width_mm: 850, cost_per_msq_cents: 55, food_contact_certified: true }
              as: Estimator
              captures: { s_id: $.data.id }
            - call: "GET /label-jobs/substrates/${s_id}"
              as: PressOperator
          assert:
            - "Substrate.${s_id}.width_mm == 850 and cost_per_msq_cents == 55 and food_contact_certified == true"

      - name: job_create_unknown_payload_field_rejected
        claim_type: required_fields
        grounds:
          - 'errors[ERR_INVALID_REQUEST]'
          - 'endpoints["POST /label-jobs/customers/{id}/jobs"]'
        distinguishing_aspect: "Sending the computed field quoted_price_cents in the create payload is rejected — computed fields are server-side only."
        test_recipe:
          setup: ["Customer C; approved artwork; substrate/ink/die/press ready"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Strict Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-S", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "ST-1", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-S", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-S1", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-S1", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
          trigger:
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 2000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1, quoted_price_cents: 1 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "http 400 with error_id == ERR_INVALID_REQUEST (unknown/computed field in payload)"

      - name: system_fields_generated_on_create
        claim_type: system_fields
        grounds: [entities.Substrate, response_envelope]
        distinguishing_aspect: "id, created_at, updated_at, version are server-generated on create; version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "SYS-1", width_mm: 700, cost_per_msq_cents: 60 }
              as: Estimator
              captures: { s_id: $.data.id, s_v: $.data.version }
          assert:
            - "Substrate.${s_id}.version == 1"
            - "Substrate.${s_id}.id is a server-minted UUID and created_at/updated_at are populated"

      - name: compliance_letter_has_no_version_field
        claim_type: immutability
        grounds: [entities.ComplianceLetter]
        distinguishing_aspect: "ComplianceLetter is common_fields:false — response rows carry id and created_at but no version or updated_at."
        test_recipe:
          setup: ["Full chain to PRINTED: food-contact job (certified substrate, compliant ink) printed with good qty 1000"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Letter Immut" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-L1", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av_id}"
              as: Estimator
              captures: { av_v: $.data.version }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "FC-1", width_mm: 1000, cost_per_msq_cents: 40, food_contact_certified: true }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-F1", cost_per_lb_cents: 300, food_contact_compliant: true }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-L1", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-L1", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 1000, repeat_length_mm: 76, requires_food_contact_letter: true, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_id}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_id}/start-press"
              as: PressOperator
            - call: "POST /label-jobs/jobs/${j_id}/color-measurements"
              payload: { station_no: 1, delta_e: 1.0 }
              as: PressOperator
              captures: { m_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/color-measurements/${m_id}/judge"
              payload: { verdict: "PASS" }
              as: QualityManager
            - call: "POST /label-jobs/jobs/${j_id}/complete-press"
              payload: { good_quantity_produced: 1000 }
              as: PressOperator
          trigger:
            - call: "POST /label-jobs/jobs/${j_id}/compliance-letters"
              payload: { letter_type: "FOOD_CONTACT", body: "We certify substrate FC-1 and recipe INK-F1 conform to food-contact requirements." }
              as: QualityManager
              captures: { letter_id: $.data.id }
            - call: "GET /label-jobs/jobs/${j_id}/compliance-letters"
              as: QualityManager
          assert:
            - "ComplianceLetter.${letter_id} exposes id and created_at and issued_at"
            - "ComplianceLetter.${letter_id} has no version field and no updated_at field (append-only record)"

      - name: artwork_list_reverse_reachability
        claim_type: parent_relationships
        grounds:
          - 'entities.ArtworkVersion.fields.customer_id'
          - 'endpoints["GET /label-jobs/customers/{id}/artwork-versions"]'
        distinguishing_aspect: "Children are reachable from the parent id: listing artwork under customer C returns exactly C's revisions."
        test_recipe:
          setup: ["Customer C with two artwork revisions"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "List Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-LA", revision_no: 1, color_count: 1, plate_set_cost_cents: 50000 }
              as: PrepressOperator
              captures: { a1: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-LB", revision_no: 1, color_count: 2, plate_set_cost_cents: 70000 }
              as: PrepressOperator
              captures: { a2: $.data.id }
          trigger:
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions"
              as: PrepressOperator
          assert:
            - "list contains exactly ${a1} and ${a2} (total_count == 2)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: job_initial_state_is_quoted
        claim_type: initial_state
        grounds: [state_machines.LabelJob]
        distinguishing_aspect: "A newly created job starts in QUOTED with version 1 and a computed quoted_price_cents."
        test_recipe:
          setup: ["Customer C; approved 2-color artwork; substrate/ink/die/press ready"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Init Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-I", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "I-1", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-I", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-I", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-I", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
          trigger:
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 1000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_id: $.data.id, j_status: $.data.status }
          assert:
            - "LabelJob.${j_id}.status == QUOTED"
            - "LabelJob.${j_id}.version == 1"
            - "LabelJob.${j_id}.quoted_price_cents == 135208"

      - name: job_approve_twice_rejected
        claim_type: invalid_transition
        grounds:
          - 'state_machines.LabelJob.QUOTED_to_APPROVED'
          - 'errors[ERR_JOB_NOT_QUOTED]'
        distinguishing_aspect: "Approving an already-APPROVED job fails with ERR_JOB_NOT_QUOTED; no transition fires."
        test_recipe:
          setup: ["Full chain to APPROVED job (qty 1000)"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Twice Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-T", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "T-1", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-T", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-T", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-T", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 1000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/approve"
              as: Estimator
          trigger:
            - call: "POST /label-jobs/jobs/${j_id}/approve"
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "second approve returns http 409 error_id == ERR_JOB_NOT_QUOTED"
            - "LabelJob.${j_id}.status == APPROVED unchanged"

      - name: artwork_approve_after_approved_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - 'state_machines.ArtworkVersion.SUBMITTED_to_APPROVED'
          - 'errors[ERR_ARTWORK_NOT_SUBMITTED]'
        distinguishing_aspect: "APPROVED is terminal for direct triggers: approving an APPROVED revision fails with ERR_ARTWORK_NOT_SUBMITTED."
        test_recipe:
          setup: ["Customer C; artwork AV fully approved"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Term Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-TE", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
          trigger:
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
              captures: { err: $.data.error_id }
          assert:
            - "http 409 error_id == ERR_ARTWORK_NOT_SUBMITTED"
            - "ArtworkVersion.${av_id}.status == APPROVED unchanged"

      - name: artwork_submit_twice_rejected
        claim_type: invalid_transition
        grounds:
          - 'state_machines.ArtworkVersion.DRAFT_to_SUBMITTED'
          - 'errors[ERR_ARTWORK_NOT_DRAFT]'
        distinguishing_aspect: "Submitting an already-SUBMITTED revision fails with ERR_ARTWORK_NOT_DRAFT."
        test_recipe:
          setup: ["Customer C; artwork AV submitted"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Sub Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-SU", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
          trigger:
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
              captures: { err: $.data.error_id }
          assert:
            - "http 409 error_id == ERR_ARTWORK_NOT_DRAFT"

      - name: measurement_double_judge_rejected
        claim_type: invalid_transition
        grounds:
          - 'state_machines.ColorMeasurement.PENDING_to_PASS'
          - 'errors[ERR_MEASUREMENT_ALREADY_JUDGED]'
        distinguishing_aspect: "Judging an already-PASS measurement fails with ERR_MEASUREMENT_ALREADY_JUDGED; verdict is immutable once judged."
        test_recipe:
          setup: ["Chain to ON_PRESS; one measurement recorded and judged PASS"]
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Judge Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-J", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av_id}"
              as: Estimator
              captures: { av_v: $.data.version }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "J-1", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-J", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-J", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-J", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 2000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_id}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_id}/start-press"
              as: PressOperator
            - call: "POST /label-jobs/jobs/${j_id}/color-measurements"
              payload: { station_no: 1, delta_e: 1.1 }
              as: PressOperator
              captures: { m_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/color-measurements/${m_id}/judge"
              payload: { verdict: "PASS" }
              as: QualityManager
          trigger:
            - call: "POST /label-jobs/jobs/${j_id}/color-measurements/${m_id}/judge"
              payload: { verdict: "FAIL" }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
