  - name: mark_obsolete_at_exactly_the_support_horizon_is_allowed
    claim_type: temporal_validation
    grounds:
    - validations[priority=20]
    - errors[ERR_SUPPORT_WINDOW_ACTIVE]
    - entities.ModelRevision.fields.firmware_support_until
    - endpoints[POST /model-revisions/{id}/mark-obsolete]
    distinguishing_aspect: 'The comparison is firmware_support_until <= now (inclusive): one day early (clock 2031-07-30) mark-obsolete returns 409 ERR_SUPPORT_WINDOW_ACTIVE, and at exactly 2031-07-31T00:00:00Z
      the same call returns 200 and moves the revision to OBSOLETE.'
    test_recipe:
      setup:
