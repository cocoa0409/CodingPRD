scaffold_corner_design:
  # ==========================================================================
  # §1.9 Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: program_creation_required_fields
        claim_type: creation
        grounds: [entities.Program]
        distinguishing_aspect: "POST /programs with valid focus_area returns 201 with posture=OPEN and zero counters"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id, posture: $.data.posture }
          assert:
            - "posture == OPEN"
            - "Program.${pid}.active_critical_incident_count == 0"
            - "Program.${pid}.active_standard_incident_count == 0"
            - "Program.${pid}.scheduled_session_count == 0"

      - name: program_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Program, "errors[ERR_NOT_FOUND"]
        distinguishing_aspect: "GET on a non-existent program UUID returns ERR_NOT_FOUND"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: peer_group_invalid_modality_enum_rejected
        claim_type: type_constraints
        grounds: [entities.PeerGroup.fields.modality, "errors[ERR_INVALID_REQUEST"]
        distinguishing_aspect: "modality must be one of IN_PERSON|VIRTUAL|HYBRID; invalid enum rejected"
        test_recipe:
          setup:
            - "Program P created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /programs/${pid}/groups"
              payload: { name: "G", modality: "HYBRID_BAD", base_capacity: 5, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: room_capacity_zero_rejected
        claim_type: type_constraints
        grounds: [entities.Room.fields.physical_capacity, "errors[ERR_INVALID_CAPACITY"]
        distinguishing_aspect: "physical_capacity must be >= 1"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /rooms"
              payload: { name: "Bad", physical_capacity: 0 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_CAPACITY"

      - name: confidentiality_agreement_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.ConfidentialityAgreement]
        distinguishing_aspect: "ConfidentialityAgreement has common_fields=false; no PUT/PATCH endpoint exists"
        test_recipe:
          setup:
            - "Participant with one agreement"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pa: $.data.id }
            - call: "POST /participants/${pa}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
              captures: { aid: $.data.id }
          trigger:
            - call: "GET /participants/${pa}/agreements/${aid}"
              payload: {}
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
          assert:
            - "Agreement has no updated_at field (common_fields=false)"
            - "Agreement has no version field (common_fields=false)"
            - "agr_id == ${aid}"

      - name: evaluation_survey_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.EvaluationSurvey]
        distinguishing_aspect: "EvaluationSurvey has common_fields=false; only creation and read"
        test_recipe:
          setup:
            - "Completed session with attended participant, ready for survey"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "R", physical_capacity: 10 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "G", modality: "IN_PERSON", base_capacity: 5, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators"
              payload: { full_name: "F", email: "f@x.com" }
              as: ProgramAdmin
              captures: { fid: $.data.id }
            - call: "POST /training-courses"
              payload: { code: "T", title: "T", credit_hours: 4, level_weight: 2 }
              as: ProgramAdmin
              captures: { tc: $.data.id }
            - call: "POST /facilitators/${fid}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/training-completions"
              payload: { course_id: "${tc}", completed_at: "2026-07-01T00:00:00Z", score: 90 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators"
              payload: { full_name: "R", email: "r@x.com" }
              as: ProgramAdmin
              captures: { rev: $.data.id }
            - call: "POST /facilitators/${rev}/advance-to-screening"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/advance-to-training"
              payload: {}
              as: ProgramAdmin
            - call: "POST /training-courses"
              payload: { code: "TX", title: "TX", credit_hours: 6, level_weight: 3 }
              as: ProgramAdmin
              captures: { tcx: $.data.id }
            - call: "POST /facilitators/${rev}/training-completions"
              payload: { course_id: "${tc}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/training-completions"
              payload: { course_id: "${tcx}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/certify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/supervision-reviews"
              payload: { reviewer_id: "${rev}", occurred_at: "2026-07-15T00:00:00Z", rating: 4 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/certify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pa: $.data.id }
            - call: "POST /participants/${pa}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pa}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pa}" }
              as: ProgramAdmin
              captures: { eid: $.data.id }
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eid}/confirm"
              payload: { expected_group_version: "${gv}" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions"
              payload: { start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:00:00Z", primary_facilitator_id: "${fid}", room_id: "${rid}" }
              as: ProgramAdmin
              captures: { sid: $.data.id }
            - call: "GET /facilitators/${fid}"
              payload: {}
              as: ProgramAdmin
              captures: { fv: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/schedule"
              payload: { expected_facilitator_version: "${fv}" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
