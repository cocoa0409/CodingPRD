  - rule_id: resource_temporal_overlap
    instances:
      - name: equipment_window_touching_endpoint_collides
        grounds:
          - validations.priority_42_ERR_EQUIPMENT_WINDOW_CONFLICT
          - entities.HarvestEvent.fields.window_start
          - entities.HarvestEvent.fields.window_end
        distinguishing_aspect: |
          RESOURCE: HarvestEquipment. INTERVAL SEMANTICS: fully CLOSED [window_start, window_end] - both
          endpoints inclusive - so a second harvest window that begins at the exact instant the first one ends
          DOES collide. One second later it is accepted, which pins the semantics to the instant rather than to
          a fuzzy buffer.
        test_recipe:
          setup:
            - "Two signed and INSPECTION_PASSED contracts for the same grower and variety on fields F-A and F-B"
            - "Equipment CMB-7 cleanout-certified for the shared variety"
