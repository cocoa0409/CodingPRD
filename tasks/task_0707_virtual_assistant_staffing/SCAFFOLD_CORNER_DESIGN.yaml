# =============================================================================
# task_0707_virtual_assistant_staffing — SCAFFOLD_CORNER_DESIGN.yaml (§1.9)
# Breadth probe. Enumerates testable claims of §1.1–§1.7 not covered by §1.8.
# section: / claim_type: values come from references/claim-extraction-guide.md.
# excluded_because: stubs cite §1.8 instance names verbatim. Clock startup
# default = 2026-03-01T00:00:00Z (per §1.5 _clock endpoint).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_skill_tag_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.SkillTag.fields.code
          - entities.SkillTag.fields.is_specialized
        distinguishing_aspect: "POST /skill-tags with code+name+is_specialized -> 201; response data echoes code, name, is_specialized=true and a server-minted id."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "TAX_PREP", name: "Tax Prep", is_specialized: true }
              as: StaffingManager
              captures: { sid: $.data.id, spec: $.data.is_specialized }
          assert:
            - "response.status == 201"
            - "SkillTag.${sid}.code == TAX_PREP"
            - "SkillTag.${sid}.is_specialized == true"

      - name: skill_tag_is_specialized_default_false_when_omitted
        claim_type: Defaults
        grounds:
          - entities.SkillTag.fields.is_specialized
        distinguishing_aspect: "Omitting is_specialized on POST /skill-tags applies the declared default false."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "INVOICING", name: "Invoicing" }
              as: StaffingManager
              captures: { sid: $.data.id, spec: $.data.is_specialized }
          assert:
            - "SkillTag.${sid}.is_specialized == false"

      - name: get_client_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /clients/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB; reference a UUID that was never created."
          setup_api_calls: []
          trigger:
            - call: "GET /va-staffing/clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StaffingManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: client_missing_required_company_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Client.fields.company_name
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /clients without company_name -> ERR_INVALID_REQUEST (422); company_name is source:input with no default."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /va-staffing/clients"
              payload: { contact_email: "noname@x.com" }
              as: Client
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: client_open_task_count_computed_reflects_open_tasks
        claim_type: Computed Fields
        grounds:
          - entities.Client.fields.open_task_count
          - state_machines.Task.QUEUED_to_ASSIGNED
        distinguishing_aspect: "Client.open_task_count is computed: creating two non-terminal tasks yields open_task_count=2; a client-supplied value would be ignored."
        test_recipe:
          setup:
            - "Client ACTIVE with two QUEUED tasks created."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "TYPING", name: "Typing", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/sla-policies"
              payload: { tier: "STANDARD", response_minutes: 60, resolution_hours: 24, breach_penalty_pct: 0.0 }
              as: StaffingManager
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Otc", email: "vaotc@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Otc", contact_email: "otc@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "A", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 1 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "B", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 1 }
              as: Client
              as_user_id: "${cli}"
          trigger:
            - call: "GET /va-staffing/clients/${cli}"
              payload: {}
              as: StaffingManager
              captures: { otc: $.data.open_task_count }
          assert:
            - "Client.${cli}.open_task_count == 2"

      - name: client_status_initialized_pending_system_field
        claim_type: System Fields
        grounds:
          - entities.Client.fields.status
        distinguishing_aspect: "On POST /clients the system sets status=PENDING regardless of any client-supplied status (status is source:system)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Init", contact_email: "init@x.com" }
              as: Client
              captures: { cli: $.data.id, st: $.data.status }
          assert:
            - "Client.${cli}.status == PENDING"

      - name: sla_policy_invalid_tier_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.SlaPolicy.fields.tier
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /sla-policies with tier not in {STANDARD,PRIORITY,URGENT} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /va-staffing/sla-policies"
              payload: { tier: "CRITICAL", response_minutes: 60, resolution_hours: 24, breach_penalty_pct: 0.0 }
              as: StaffingManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: va_rating_out_of_range_returns_validation_range
        claim_type: Type Constraints
        grounds:
          - entities.VirtualAssistant.fields.rating
          - validations[priority=6]
          - errors[ERR_VALIDATION_RANGE]
        distinguishing_aspect: "POST /virtual-assistants with rating=6.0 (outside [0,5]) -> ERR_VALIDATION_RANGE (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Bad Rating", email: "badr@x.com", weekly_capacity_hours: 40, rating: 6.0 }
              as: StaffingManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION_RANGE"

      - name: skill_tag_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.SkillTag.fields.id
          - entities.SkillTag.fields.created_at
        distinguishing_aspect: "SkillTag is common_fields:false — it carries only id and created_at, no version field, and there is no PUT/PATCH/DELETE endpoint for it in §1.5."
        test_recipe:
          setup:
            - "One SkillTag created."
          setup_api_calls:
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "PROOFREADING", name: "Proofreading", is_specialized: false }
              as: StaffingManager
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /va-staffing/skill-tags/${sid}"
              payload: {}
              as: StaffingManager
              captures: { code: $.data.code }
          assert:
            - "SkillTag.${sid}.code == PROOFREADING"
            - "response.data has no `version` field"

      - name: engagement_create_unknown_va_id_fk_rejected
        claim_type: Not Found
        grounds:
          - entities.Engagement.fields.va_id
          - validations[priority=4]
          - errors[ERR_REFERENCED_ENTITY_NOT_FOUND]
        distinguishing_aspect: "POST /engagements with a body va_id that references no VirtualAssistant -> ERR_REFERENCED_ENTITY_NOT_FOUND (422), exercising flat-topology FK integrity."
        test_recipe:
          setup:
            - "A client exists; the va_id in the body is a never-created UUID."
          setup_api_calls:
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Fkc", contact_email: "fkc@x.com" }
              as: Client
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "00000000-0000-4000-8000-000000000001" }
              as: StaffingManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_REFERENCED_ENTITY_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: reject_proposed_engagement_moves_to_rejected
        claim_type: Valid Transition
        grounds:
          - state_machines.Engagement.PROPOSED_to_REJECTED
          - entities.Engagement.fields.status
        distinguishing_aspect: "POST /engagements/{id}/reject on a PROPOSED engagement moves it to REJECTED (terminal), with no VA status change."
        test_recipe:
          setup:
            - "A PROPOSED engagement with an explicit VA."
          setup_api_calls:
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "DISPATCH", name: "Dispatch", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Rj", email: "varj@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Rjc", contact_email: "rjc@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /va-staffing/engagements/${eng}/reject"
              payload: {}
              as: Client
              as_user_id: "${cli}"
              captures: { st: $.data.status }
          assert:
            - "Engagement.${eng}.status == REJECTED"

      - name: accept_already_accepted_engagement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Engagement.PROPOSED_to_ONBOARDING
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /engagements/{id}/accept on an ONBOARDING engagement (already accepted) -> ERR_INVALID_STATE (409); accept is only defined from PROPOSED."
        test_recipe:
          setup:
            - "An engagement already accepted (ONBOARDING)."
          setup_api_calls:
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "ONBOARD_SK", name: "Onboard Skill", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Ob", email: "vaob@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Obc", contact_email: "obc@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
          trigger:
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_task_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Task.to_CANCELLED
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /tasks/{id}/cancel on an already-CANCELLED task -> ERR_INVALID_STATE (409); CANCELLED is terminal, no transition fires."
        test_recipe:
          setup:
            - "A QUEUED task that has been cancelled once already (terminal CANCELLED)."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "CANC_SK", name: "Cancel Skill", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Cnc", contact_email: "cnc@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "Cnc task", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 1 }
              as: Client
              as_user_id: "${cli}"
              captures: { task: $.data.id }
            - call: "POST /va-staffing/tasks/${task}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cli}"
          trigger:
            - call: "POST /va-staffing/tasks/${task}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cli}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_task_starts_in_queued_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Task.QUEUED_to_ASSIGNED
          - entities.Task.fields.status
        distinguishing_aspect: "POST /tasks yields a Task whose status is the declared initial_state QUEUED."
        test_recipe:
          setup:
            - "A client exists."
          setup_api_calls:
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "QUEUE_SK", name: "Queue Skill", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Qsc", contact_email: "qsc@x.com" }
              as: Client
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "Q task", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 1 }
              as: Client
              as_user_id: "${cli}"
              captures: { task: $.data.id, st: $.data.status }
          assert:
            - "Task.${task}.status == QUEUED"

      - name: suspend_active_client_blocks_assigned_tasks_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - entities.Task.fields.status
          - entities.Task.fields.blocked_reason
        distinguishing_aspect: "POST /clients/{id}/suspend transitions an ASSIGNED task to BLOCKED with blocked_reason='CLIENT_SUSPENDED' (cross-entity side effect)."
        test_recipe:
          setup:
            - "Client ACTIVE with one ASSIGNED task."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "SUSP_SK", name: "Suspend Skill", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/sla-policies"
              payload: { tier: "STANDARD", response_minutes: 60, resolution_hours: 24, breach_penalty_pct: 0.0 }
              as: StaffingManager
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Sus2", email: "vasus2@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Sus2", contact_email: "sus2@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "Sus2 task", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 1 }
              as: Client
              as_user_id: "${cli}"
              captures: { task: $.data.id }
            - call: "POST /va-staffing/tasks/${task}/assign"
              payload: {}
              as: StaffingManager
          trigger:
            - call: "POST /va-staffing/clients/${cli}/suspend"
              payload: {}
              as: StaffingManager
            - call: "GET /va-staffing/tasks/${task}"
              payload: {}
              as: StaffingManager
              captures: { st: $.data.status, br: $.data.blocked_reason }
          assert:
            - "Client.${cli}.status == SUSPENDED"
            - "Task.${task}.status == BLOCKED"
            - "Task.${task}.blocked_reason == CLIENT_SUSPENDED"

      - name: resume_suspended_client_reverts_blocked_tasks
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Client.SUSPENDED_to_ACTIVE
          - entities.Task.fields.status
        distinguishing_aspect: "POST /clients/{id}/resume reverts a CLIENT_SUSPENDED-blocked previously-assigned task back to ASSIGNED and clears blocked_reason."
        test_recipe:
          setup:
            - "Client SUSPENDED with one task BLOCKED(CLIENT_SUSPENDED) that had been ASSIGNED."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "RESM_SK", name: "Resume Skill", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/sla-policies"
              payload: { tier: "STANDARD", response_minutes: 60, resolution_hours: 24, breach_penalty_pct: 0.0 }
              as: StaffingManager
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Rsm", email: "varsm@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Rsm", contact_email: "rsm@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "Rsm task", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 1 }
              as: Client
              as_user_id: "${cli}"
              captures: { task: $.data.id }
            - call: "POST /va-staffing/tasks/${task}/assign"
              payload: {}
              as: StaffingManager
            - call: "POST /va-staffing/clients/${cli}/suspend"
              payload: {}
              as: StaffingManager
          trigger:
            - call: "POST /va-staffing/clients/${cli}/resume"
              payload: {}
              as: StaffingManager
            - call: "GET /va-staffing/tasks/${task}"
              payload: {}
              as: StaffingManager
              captures: { st: $.data.status, br: $.data.blocked_reason }
          assert:
            - "Client.${cli}.status == ACTIVE"
            - "Task.${task}.status == ASSIGNED"
            - "Task.${task}.blocked_reason == null"

      - name: return_to_proposed_reverts_onboarding_engagement
        claim_type: Valid Transition
        grounds:
          - state_machines.Engagement.ONBOARDING_to_PROPOSED
          - entities.Engagement.fields.status
          - entities.VirtualAssistant.fields.status
