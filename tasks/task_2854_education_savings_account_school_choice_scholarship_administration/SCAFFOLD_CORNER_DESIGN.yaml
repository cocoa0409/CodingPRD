            - "${disbursed} - ${fees} == 458173 (the derived totals reconcile with the balance)"
            - "the disbursements list returns total_count 2 and ${first_disbursement_quarter} == 1"
            - "Account.${acct1_id}.encumbered_cents == 0 and lifetime_spent_cents == 0"

      - name: expense_category_create_and_read_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints["POST /esa/expense-categories"]
          - endpoints["GET /esa/expense-categories/{id}"]
          - entities.ExpenseCategory
        distinguishing_aspect: "The catalog entry read back carries the exact caps and flags it was created with, and the catalog exposes no update or delete route, so a category's rules cannot be edited under live purchase requests."
        test_recipe:
          setup:
            - "No expense category exists yet."
          setup_api_calls: []
          trigger:
            - call: "POST /esa/expense-categories"
              payload: { code: "MATERIALS", name: "Curriculum and materials", per_year_cap_cents: 300000, allowable: true, requires_preapproval: false, requires_service_period: false }
              as: ProgramAdmin
              captures: { cat_id: $.data.id, cat_code: $.data.code }
            - call: "GET /esa/expense-categories/${cat_id}"
              as: ProgramAdmin
              captures: { read_cap: $.data.per_year_cap_cents }
          assert:
            - "the create returns HTTP 201 and ${cat_code} == MATERIALS"
            - "${read_cap} == 300000 and the read echoes allowable true, requires_preapproval false, requires_service_period false"
            - "§1.5 declares no PATCH, PUT or DELETE route for /esa/expense-categories/{id}"

      - name: year_end_close_run_covered_by_difficulty
        claim_type: Bulk action
        grounds:
          - endpoints["POST /esa/program-years/{id}/year-end-close"]
        excluded_because:
          difficulty_instance: boundary_precision_check / rollover_balance_exactly_equal_to_cap_forfeits_zero
          rationale: "The close run's per-account rollover, the ACCEPTED -> COMPLETED sweep and the CLOSED year status are all asserted in the named §1.8 instance."

      - name: clawback_action_endpoint_covered_by_difficulty
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /esa/misuse-cases/{id}/clawbacks"]
        excluded_because:
          difficulty_instance: combinatorial_formula / clawback_penalty_tier_keyed_on_principal_not_running_total
          rationale: "The clawback endpoint's penalty tiering, ledger entries and account debit are asserted in the named §1.8 instance."

  - section: errors
