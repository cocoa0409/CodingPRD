            - { call: "POST /telerad/credential-grants", payload: { radiologist_id: "${rad2}", hospital_id: "${hosp}", grant_type: "BY_PROXY", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: PlatformAdmin, captures: { g2: $.data.id } }
            - { call: "POST /telerad/credential-grants/${g2}/grant", payload: {}, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad1}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
            - { call: "POST /telerad/shifts", payload: { radiologist_id: "${rad2}", starts_at: "2026-05-09T00:00:00Z", ends_at: "2026-05-12T00:00:00Z", modalities: ["CT"] }, as: PlatformAdmin }
