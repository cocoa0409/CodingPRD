  # ---- Community signals ----
  - method: POST
    path: "/car-share/community-signals"
    description: "Raise a campus, cleanliness or availability signal; cleanliness signals advance the parallel cleanliness posture."
    roles: [Member, PodOperator]
    code: 201
    input:
      - pod_id
      - signal_type
      - message
      - reservation_id?
      - vehicle_id?
    output: CommunitySignal
    side_effects: ["CommunitySignal.created_at_signal = current logical clock value", "CommunitySignal.member_id = the acting member", "sets Vehicle.cleanliness_state = REPORTED_DIRTY or ESCALATED for CLEANLINESS signals", "supplies the C4 campus-signal threshold count"]
  - method: GET
