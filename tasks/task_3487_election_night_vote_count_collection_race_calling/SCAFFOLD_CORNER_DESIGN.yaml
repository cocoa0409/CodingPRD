        claim_type: Correct Result
        grounds:
          - calculations.tabulation_rollup
        distinguishing_aspect: "Two ACCEPTED reports for the same county: the rollup takes the one with the greatest accepted_at (14:00 beats 13:00) — totals reflect only the later report, never a sum of both."
        test_recipe:
          setup: ["Standard universe at LIVE, contest linked to Alameda only; Alameda report1 p5 W4000/T3000 accepted at 13:00, then report2 p8 W6500/T2500 submitted and accepted at 14:00."]
