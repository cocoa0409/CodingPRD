      - name: allocation_selector_prefers_recycled_then_cheapest
        claim_type: correct_result
        grounds: [calculations.allocation_selector]
        distinguishing_aspect: "Selector ranking is lexicographic: RECYCLED_REPAIR lots beat NEW_BUILD lots regardless of cost; ties break on lowest unit_cost_cents then earliest created_at."
        test_recipe:
