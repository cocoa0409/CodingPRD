  - rule_id: cross_entity_state_dependency
    instances:
      - name: subscription_acceptance_requires_published_nav_for_its_own_class
        grounds:
          - state_machines.Subscription.PENDING_to_ACCEPTED
          - errors[ERR_NO_PUBLISHED_NAV]
          - calculations.transaction_price_selection
          - entities.NavRecord.fields.status
          - validations[priority=8].error_id
        distinguishing_aspect: |
          Acceptance legality lives in a different entity and is class-scoped: a
          PUBLISHED NavRecord for class I does not unlock a class T subscription,
          so the identical ACCEPTED request fails with ERR_NO_PUBLISHED_NAV and
          then succeeds once class T has its own PUBLISHED record — while the
          subscription's own transaction_price_cents was already pinned at
          creation from the initial offering price.
        test_recipe:
          setup:
            - "Offering 'Ironwood Balanced REIT' EFFECTIVE with two zero-load classes I and T."
