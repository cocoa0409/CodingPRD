              captures: { grant_v2: $.data.version }
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "CONSUMABLE", description: "Simulation consumables lot B", unit_cost_cents: 125005, quantity: 2, service_period_start: "2026-10-01", service_period_end: "2026-10-31", expected_grant_award_version: "${grant_v2}" }
