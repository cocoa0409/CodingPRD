# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Errand & Task Marketplace. Nine §0.5 rules, >=2 instances each (>=18 total).
# Logical clock default: 2026-01-01T00:00:00Z; all recipes set the clock first.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_final_labor_diverges_on_booking_pricing
        grounds:
          - calculations.quote_estimate
          - calculations.final_settlement
          - entities.Booking.fields.estimated_labor_cents
          - entities.Settlement.fields.final_labor_cents
        distinguishing_aspect: |
          quote_estimate (Booking domain) bills category.default_hourly_rate_cents=4000
          giving estimated_labor_cents=8000, while final_settlement bills the claimed
          tasker's hourly_rate_cents=5000 giving final_labor_cents=10000 — same hours,
          two different cents.
        test_recipe:
          setup:
            - "Clock at 2026-06-25T08:00:00Z."
            - "HOURLY category default_hourly_rate_cents=4000, default_duration_minutes=60, requires_vetting=false."
            - "Tasker hourly_rate_cents=5000, ACTIVE, with an OPEN window 09:00-13:00 on 2026-06-25."
            - "Booking estimated_hours=2.0, scheduled_start 2026-06-25T10:00:00Z, OFFERED (estimate pinned), then CLAIMED onto the tasker, departed, started."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Hourly Help", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Tess Tasker", hourly_rate_cents: 5000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Cara Client" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tk_id}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T13:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 2.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { est_labor: $.data.estimated_labor_cents }
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
            - call: "POST /bookings/${bk_id}/depart"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "POST /bookings/${bk_id}/start"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_hours: 2.0, tip_cents: 500 }
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "GET /bookings/${bk_id}/settlement"
              payload: {}
              as: Dispatcher
              captures: { fin_labor: $.data.0.final_labor_cents }
          assert:
            - "Booking.${bk_id}.estimated_labor_cents == 8000"
            - "Settlement(booking=${bk_id}).final_labor_cents == 10000"
            - "Settlement(booking=${bk_id}).final_service_fee_cents == 1500"
            - "Settlement(booking=${bk_id}).total_charged_cents == 12000"
            - "Settlement(booking=${bk_id}).tasker_payout_cents == 10500"

      - name: trust_score_penalty_included_vs_dismissed_excluded_on_tasker
        grounds:
          - calculations.trust_score
          - state_machines.TrustIncident.transitions.OPEN_to_DISMISSED
          - entities.Tasker.fields.trust_score
          - entities.TrustIncident.fields.penalty_points
        distinguishing_aspect: |
          On the Tasker domain, trust_score over the SAME incident set yields two
          different values: counting a HIGH incident's penalty (status OPEN) gives
          trust_score=65, while excluding it after DISMISSED gives trust_score=100.
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z; Tasker ACTIVE trust_score=100."
            - "One HIGH TrustIncident filed (OPEN) -> trust_score 65 (RESTRICTED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: TrustSafetyOfficer
            - call: "POST /taskers"
              payload: { full_name: "Ray Risk", hourly_rate_cents: 5000 }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /trust-incidents"
              payload: { tasker_id: "${tk_id}", severity: "HIGH" }
              as: TrustSafetyOfficer
              captures: { inc_id: $.data.id }
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { score_open: $.data.trust_score }
          trigger:
            - call: "POST /trust-incidents/${inc_id}/dismiss"
              payload: {}
              as: TrustSafetyOfficer
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { score_dismissed: $.data.trust_score }
          assert:
            - "Tasker.${tk_id}.trust_score == 65 while incident OPEN"
            - "Tasker.${tk_id}.trust_score == 100 after incident DISMISSED"
            - "Tasker.${tk_id}.status == RESTRICTED while OPEN, ACTIVE after DISMISSED"
            - "TrustIncident.${inc_id}.penalty_points == 0 after DISMISSED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_settlement_quarter_hour_rounding_order_mode_b
        grounds:
          - calculations.final_settlement
          - entities.Settlement.fields.final_labor_cents
          - entities.Settlement.fields.final_service_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order is pinned: round actual_hours=2.1 UP
          to 2.25 quarter-hours FIRST, THEN floor(5000*2.25)=11250 labor, THEN
          floor(11250*0.15)=1687 fee. Rounding before vs after the rate multiply
          yields different cents; the scaffold pins round-up-then-multiply-then-floor.
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z; HOURLY category default rate 4000, duration 60."
            - "Tasker hourly_rate_cents=5000, OPEN window 09:00-13:00."
            - "Booking estimated_hours=2.0 claimed/departed/started; completed with actual_hours=2.1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Quarter Hourly", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Quinn", hourly_rate_cents: 5000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Cory" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tk_id}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T13:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 2.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
            - call: "POST /bookings/${bk_id}/depart"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "POST /bookings/${bk_id}/start"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_hours: 2.1 }
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "GET /bookings/${bk_id}/settlement"
              payload: {}
              as: Dispatcher
              captures: { fin_labor: $.data.0.final_labor_cents }
          assert:
            - "Settlement(booking=${bk_id}).final_labor_cents == 11250"
            - "Settlement(booking=${bk_id}).final_service_fee_cents == 1687"
            - "Settlement(booking=${bk_id}).tip_cents == 0"
            - "Settlement(booking=${bk_id}).total_charged_cents == 12937"

      - name: cancellation_fee_tier_branch_selection_mode_a
        grounds:
          - calculations.cancellation_fee
          - entities.Cancellation.fields.fee_tier
          - entities.Cancellation.fields.cancellation_fee_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (hours_before_start, estimated_labor_cents, tier pct)
          with a conditional branch on the time tier. At 3h-before, the LATE branch
          selects pct=0.25 -> floor(8000*0.25)=2000, distinct from the FREE (0) and
          LAST_MINUTE (4000) branches the same formula would pick at other times.
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z; HOURLY category default rate 4000."
            - "Booking estimated_hours=2.0 (estimated_labor_cents=8000), scheduled_start 2026-06-25T11:00:00Z (3h ahead), OFFERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Cancel Test", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cleo" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T11:00:00Z", estimated_hours: 2.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancelled_by: "CLIENT" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "GET /bookings/${bk_id}/cancellation"
              payload: {}
              as: Dispatcher
              captures: { tier: $.data.0.fee_tier }
          assert:
            - "Cancellation(booking=${bk_id}).fee_tier == LATE"
            - "Cancellation(booking=${bk_id}).cancellation_fee_cents == 2000"
            - "Booking.${bk_id}.status == CANCELLED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_reschedule_cycle_returns_to_same_state
        grounds:
          - state_machines.Booking.transitions.CLAIMED_to_CLAIMED
          - entities.Booking.fields.reschedule_pending
          - entities.Booking.fields.reschedule_count
          - entities.Booking.fields.proposed_start
        distinguishing_aspect: |
          Booking is the cyclic entity: propose -> accept leaves status==CLAIMED
          (A->A loop) while reschedule_count increments 0->1 and scheduled_start moves
          to the proposed time — a revision loop, not a forward pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z; HOURLY category; tasker with OPEN window 09:00-16:00."
            - "Booking estimated_hours=1.0 scheduled 2026-06-25T10:00:00Z, CLAIMED onto tasker (status CLAIMED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Resched Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Rhea", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Cody" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tk_id}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T16:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
            - call: "POST /bookings/${bk_id}/reschedule/propose"
              payload: { proposed_start: "2026-06-25T13:00:00Z" }
              as: Client
              as_user_id: "${cl_id}"
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { tk_v_before_accept: $.data.version }
          trigger:
            - call: "POST /bookings/${bk_id}/reschedule/accept"
              payload: { expected_tasker_version: "${tk_v_before_accept}" }
              as: Tasker
              as_user_id: "${tk_id}"
              captures: { st: $.data.status, rc: $.data.reschedule_count }
          assert:
            - "Booking.${bk_id}.status == CLAIMED (unchanged across the cycle)"
            - "Booking.${bk_id}.reschedule_count == 1"
            - "Booking.${bk_id}.scheduled_start == 2026-06-25T13:00:00Z"
            - "Booking.${bk_id}.reschedule_pending == false"

      - name: tasker_trust_gate_cycles_active_restricted_suspended
        grounds:
          - state_machines.Tasker.transitions.ACTIVE_to_RESTRICTED
          - state_machines.Tasker.transitions.SUSPENDED_to_ACTIVE
          - calculations.trust_gate
          - entities.Tasker.fields.status
        distinguishing_aspect: |
          Tasker (a different entity from Booking) cycles non-linearly: ACTIVE ->
          (HIGH+HIGH incidents, score 30) SUSPENDED -> (dismiss both, score 100)
          ACTIVE — a bidirectional gate driven by derived trust_score, not a one-way
          pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z; Tasker ACTIVE trust_score=100."
            - "Two HIGH incidents filed -> trust_score 30 -> SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: TrustSafetyOfficer
            - call: "POST /taskers"
              payload: { full_name: "Sam Suspend", hourly_rate_cents: 5000 }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /trust-incidents"
              payload: { tasker_id: "${tk_id}", severity: "HIGH" }
              as: TrustSafetyOfficer
              captures: { inc1: $.data.id }
            - call: "POST /trust-incidents"
              payload: { tasker_id: "${tk_id}", severity: "HIGH" }
              as: TrustSafetyOfficer
              captures: { inc2: $.data.id }
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { susp_status: $.data.status }
          trigger:
            - call: "POST /trust-incidents/${inc1}/dismiss"
              payload: {}
              as: TrustSafetyOfficer
            - call: "POST /trust-incidents/${inc2}/dismiss"
              payload: {}
              as: TrustSafetyOfficer
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { final_status: $.data.status }
          assert:
            - "Tasker.${tk_id}.status == SUSPENDED while both incidents OPEN (trust_score 30)"
            - "Tasker.${tk_id}.status == ACTIVE after both dismissed (trust_score 100)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tasker_late_cancel_cascades_to_incident_score_status_depth3
        grounds:
          - state_machines.Booking.transitions.CLAIMED_to_CANCELLED
          - calculations.cancellation_fee
          - calculations.trust_score
          - calculations.trust_gate
          - entities.Tasker.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: tasker cancel (LAST_MINUTE) -> creates
          MEDIUM TrustIncident -> that incident's penalty recomputes trust_score 100->85
          (each link caused by the prior). The booking start was 1h ahead so the tier
          is LAST_MINUTE; only that tier spawns the incident.
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z."
            - "Tasker ACTIVE trust_score=100, OPEN window 08:30-12:00."
            - "Booking estimated_hours=1.0 scheduled 2026-06-25T09:00:00Z (1h ahead), CLAIMED onto tasker."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Late Cancel Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Nate NoShow", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Cleo C" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tk_id}", window_start: "2026-06-25T08:30:00Z", window_end: "2026-06-25T12:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SAME_DAY", scheduled_start: "2026-06-25T09:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancelled_by: "TASKER" }
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "GET /trust-incidents?tasker_id=${tk_id}"
              payload: {}
              as: TrustSafetyOfficer
              captures: { inc_id: $.data.0.id }
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { score_after: $.data.trust_score }
          assert:
            - "Cancellation(booking=${bk_id}).fee_tier == LAST_MINUTE"
            - "Cancellation(booking=${bk_id}).cancellation_fee_cents == 2000 (floor(4000*1.0*0.50))"
            - "A TrustIncident exists for ${tk_id} with severity MEDIUM and status OPEN"
            - "Tasker.${tk_id}.trust_score == 85"
            - "Tasker.${tk_id}.status == ACTIVE (85 >= 70)"

      - name: incident_dismiss_cascades_to_score_then_status_depth2
        grounds:
          - state_machines.TrustIncident.transitions.OPEN_to_DISMISSED
          - calculations.trust_score
          - calculations.trust_gate
          - entities.Tasker.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (incident dismiss, not cancel):
          dismiss -> trust_score recompute 65->100 -> trust_gate flips status
          RESTRICTED->ACTIVE. Each hop caused by the previous, originating from the
          dismiss transition.
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z; Tasker with one OPEN HIGH incident -> trust_score 65 -> RESTRICTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: TrustSafetyOfficer
            - call: "POST /taskers"
              payload: { full_name: "Rita Restricted", hourly_rate_cents: 5000 }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /trust-incidents"
              payload: { tasker_id: "${tk_id}", severity: "HIGH" }
              as: TrustSafetyOfficer
              captures: { inc_id: $.data.id }
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { restricted_status: $.data.status }
          trigger:
            - call: "POST /trust-incidents/${inc_id}/dismiss"
              payload: {}
              as: TrustSafetyOfficer
            - call: "GET /taskers/${tk_id}"
              payload: {}
              as: Dispatcher
              captures: { status_after: $.data.status }
          assert:
            - "Tasker.${tk_id}.status == RESTRICTED before dismiss (trust_score 65)"
            - "Tasker.${tk_id}.trust_score == 100 after dismiss"
            - "Tasker.${tk_id}.status == ACTIVE after dismiss"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_state_beats_safety_invalid_state_over_suspended
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.Booking.transitions.OFFERED_to_CLAIMED
        distinguishing_aspect: |
          Dual-failure on /claim: target booking is already CANCELLED (state, pri 5)
          AND the target tasker is SUSPENDED (business_safety, pri 6). The lower
          priority number wins -> ERR_BOOKING_INVALID_STATE, not ERR_TASKER_SUSPENDED.
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z."
            - "Tasker SUSPENDED (two HIGH incidents, trust_score 30)."
            - "Booking OFFERED then CANCELLED by client (now terminal)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "PriPair Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Suspended Steve", hourly_rate_cents: 5000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /trust-incidents"
