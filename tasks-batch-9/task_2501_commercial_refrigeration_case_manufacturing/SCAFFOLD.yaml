scenario: "Generate task harder than expert level!  2501. Commercial Refrigeration Case Manufacturing (refrigerated display case manufacturer): case design by application with temperature class, airflow modeling and energy consumption testing, refrigeration circuit design for remote versus self-contained systems with refrigerant compatibility, sheet metal fabrication, foam insulation injection and glass door assembly, store-specific configuration with lengths, end caps and merchandising options ordered by store plan, energy efficiency standard compliance with testing and labeling by case type, refrigerant transition engineering for lower global warming potential systems, shipment coordination to store remodel schedules with installation contractor handoff, warranty and field service network with parts availability"
domain_name: "commercial-refrigeration-case-manufacturing"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - version_pinning_on_approval
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: graph
  # Peer entities linked by foreign keys with many-to-many-ish fan-in (WorkOrder points at
  # StorePlan, StorePlanLine, CaseModel and Shipment) plus a self-referential
  # CaseModel.predecessor_model_id chain used by refrigerant-transition engineering.
  # All URL paths are flat top-level collections; no nesting.

  state_machine_shape: parallel
  # StorePlan carries two independent dimensions (commercial_status x production_status);
  # CaseModel is cyclic (CERTIFIED -> DRAFT via engineering change); WorkOrder branches on
  # door_type and cycles through REWORK.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The engineer who submits a CaseModel for test may not issue its ComplianceLabel; the
  # sales engineer who prices a StorePlan may not approve it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Refrigerant
    parent: null
    common_fields: false
    fields:
      - name: refrigerant_code
        type: string
        source: input
        description: ASHRAE designation of the refrigerant blend
        constraints: unique, 1-32 chars
      - name: trade_name
        type: string
        source: input
        description: commercial name printed on the nameplate
      - name: gwp_100yr
        type: integer
        source: input
        description: 100-year global warming potential used for CO2e mass calculations
        constraints: ">= 1"
      - name: safety_class
        type: enum
        source: input
        description: ASHRAE flammability class governing charge limits
        constraints: A1 | A2L | A3
      - name: max_charge_grams
        type: integer
        source: input
        description: per-case installed charge ceiling permitted for this refrigerant
        constraints: ">= 1"
      - name: allowed_system_types
        type: array
        source: input
        description: circuit architectures this refrigerant may be applied to
        constraints: non-empty subset of [REMOTE, SELF_CONTAINED]

  - name: EnergyStandard
    parent: null
    common_fields: false
    fields:
      - name: standard_code
        type: string
        source: input
        description: regulatory standard identifier (e.g. DOE-2027-RSC-MT)
        constraints: unique, 1-48 chars
      - name: effective_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant from which this standard may be tested against
      - name: max_gwp
        type: integer
        source: input
        description: highest refrigerant gwp_100yr this standard permits on a certified case
        constraints: ">= 1"
      - name: limit_coefficient_a
        type: number
        source: input
        description: per-square-foot coefficient a in the daily-energy limit a*TDA + b
        constraints: "> 0"
      - name: limit_constant_b
        type: number
        source: input
        description: fixed constant b in the daily-energy limit a*TDA + b
        constraints: ">= 0"
      - name: temperature_class
        type: enum
        source: input
        description: case temperature class this standard governs
        constraints: HT | MT | LT
      - name: system_type_scope
        type: enum
        source: input
        description: circuit architecture this standard governs
        constraints: REMOTE | SELF_CONTAINED | ANY

  - name: TestChamber
    parent: null
    common_fields: true
    fields:
      - name: chamber_code
        type: string
        source: input
        description: psychrometric test chamber identifier
        constraints: unique, 1-32 chars
      - name: name
        type: string
        source: input
        description: chamber display name
      - name: supported_temperature_classes
        type: array
        source: input
        description: temperature classes this chamber can hold
        constraints: non-empty subset of [HT, MT, LT]
      - name: turnaround_hours
        type: integer
        source: input
        description: soak/reset hours the chamber needs on each side of an occupied test window
        constraints: ">= 0"
      - name: max_tda_sqft
        type: number
        source: input
        description: largest total display area the chamber can accept
        constraints: "> 0"
      - name: closed_window_start
        type: datetime
        source: input
        description: start of a maintenance closure during which no test may be scheduled
        default: null
      - name: closed_window_end
        type: datetime
        source: input
        description: end of the maintenance closure; treated as a closed interval with closed_window_start
        default: null

  - name: CaseModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: engineering model code
        constraints: unique, 1-32 chars
      - name: application
        type: string
        source: input
        description: merchandising application (e.g. DAIRY_MULTIDECK, FROZEN_COFFIN)
      - name: temperature_class
        type: enum
        source: input
        description: design temperature class
        constraints: HT | MT | LT
      - name: system_type
        type: enum
        source: input
        description: refrigeration circuit architecture
        constraints: REMOTE | SELF_CONTAINED
      - name: refrigerant_id
        type: string
        source: input
        description: FK -> Refrigerant.id; refrigerant this circuit is charged with
      - name: predecessor_model_id
        type: string
        source: input
        description: FK -> CaseModel.id; model this design supersedes in a refrigerant transition
        default: null
      - name: nominal_length_ft
        type: integer
        source: input
        description: nominal case length in feet
        constraints: one of 4 | 6 | 8 | 12
      - name: tda_sqft
        type: number
        source: input
        description: total display area in square feet used by every energy calculation
        constraints: "> 0"
      - name: charge_grams
        type: integer
        source: input
        description: nameplate refrigerant charge inside the case itself
        constraints: ">= 1"
      - name: line_set_length_ft
        type: integer
        source: input
        description: field line-set length between case and remote rack; 0 for self-contained
        constraints: ">= 0"
      - name: door_type
        type: enum
        source: input
        description: front closure type; drives the DOOR_ASSEMBLY routing step
        constraints: OPEN | GLASS_DOOR
      - name: glass_door_count
        type: integer
        source: input
        description: number of glass doors carrying anti-sweat heat
        default: 0
        constraints: ">= 0"
      - name: curtain_layers
        type: integer
        source: input
        description: number of air-curtain layers across the display opening
        constraints: ">= 1"
      - name: discharge_velocity_mps
        type: number
        source: input
        description: air-curtain discharge velocity in metres per second
        constraints: "> 0"
      - name: case_air_temp_c
        type: number
        source: input
        description: discharge air temperature in the display volume
      - name: ambient_dew_point_c
        type: number
        source: input
        description: design store dew point used for the infiltration temperature spread
      - name: lighting_w_per_ft
        type: number
        source: input
        description: lighting load per linear foot
        constraints: ">= 0"
      - name: fan_w_per_ft
        type: number
        source: input
        description: evaporator fan load per linear foot
        constraints: ">= 0"
      - name: defrost_cycles_per_day
        type: integer
        source: input
        description: design defrost cycles per 24 hours
        constraints: ">= 0"
      - name: curtain_factor
        type: number
        source: computed
        description: air-curtain effectiveness multiplier from airflow_load_model
        default: null
      - name: velocity_factor
        type: number
        source: computed
        description: discharge-velocity multiplier from airflow_load_model
        default: null
      - name: infiltration_load_w
        type: number
        source: computed
        description: infiltration component of the design load, from airflow_load_model
        default: null
      - name: lighting_load_w
        type: number
        source: computed
        description: lighting component of the design load
        default: null
      - name: fan_load_w
        type: number
        source: computed
        description: fan component of the design load
        default: null
      - name: defrost_load_w
        type: number
        source: computed
        description: 24-hour-averaged defrost component of the design load
        default: null
      - name: anti_sweat_load_w
        type: number
        source: computed
        description: glass-door anti-sweat component of the design load
        default: null
      - name: total_design_load_w
        type: number
        source: computed
        description: total design cooling load, from airflow_load_model
        default: null
      - name: installed_charge_grams
        type: integer
        source: computed
        description: field-installed charge including line-set volume, from refrigerant_charge_basis
        default: null
      - name: nameplate_co2e_kg
        type: number
        source: computed
        description: CO2e mass of the nameplate charge, from refrigerant_charge_basis
        default: null
      - name: installed_co2e_kg
        type: number
        source: computed
        description: CO2e mass of the installed charge, from refrigerant_charge_basis
        default: null
      - name: design_revision
        type: integer
        source: system
        description: engineering revision counter; incremented by every engineering change
        default: 1
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the DesignEngineer who last submitted this model for test
        default: null
      - name: status
        type: enum
        source: system
        description: design lifecycle state
        default: DRAFT
        constraints: DRAFT | MODELED | SUBMITTED_FOR_TEST | TESTED_PASS | TESTED_FAIL | CERTIFIED | DECERTIFIED

  - name: EnergyTest
    parent: null
    common_fields: true
    fields:
      - name: case_model_id
        type: string
        source: input
        description: FK -> CaseModel.id; model under test
      - name: test_chamber_id
        type: string
        source: input
        description: FK -> TestChamber.id; chamber occupied by this test
      - name: energy_standard_id
        type: string
        source: input
        description: FK -> EnergyStandard.id; standard the measured energy is judged against
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the chamber occupation interval
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the chamber occupation interval; interval is half-open [window_start, window_end)
      - name: test_ambient_c
        type: number
        source: input
        description: chamber ambient dry-bulb temperature held during the test
      - name: store_ambient_c
        type: number
        source: input
        description: ambient temperature of the destination store used by the field variant
      - name: pinned_design_revision
        type: integer
        source: computed
        description: CaseModel.design_revision copied at test creation; the test is invalid once the model revises
      - name: pinned_tda_sqft
        type: number
        source: computed
        description: CaseModel.tda_sqft copied at test creation and used by every index divisor
      - name: pinned_defrost_cycles_per_day
        type: integer
        source: computed
        description: CaseModel.defrost_cycles_per_day copied at test creation, used by the field variant
      - name: limit_daily_kwh
        type: number
        source: computed
        description: daily energy limit from energy_limit_daily_kwh, pinned at test creation
      - name: measured_kwh_24h
        type: number
        source: input
        description: metered 24-hour energy consumption supplied at completion
        default: null
        constraints: ">= 0"
      - name: measured_defrost_cycles
        type: integer
        source: input
        description: defrost cycles actually observed during the test, supplied at completion
        default: null
        constraints: ">= 0"
      - name: lab_rated_index
        type: number
        source: computed
        description: laboratory variant of energy_use_index (measured_kwh_24h / pinned_tda_sqft)
        default: null
      - name: field_projected_daily_kwh
        type: number
        source: computed
        description: ambient- and defrost-corrected daily energy from the field variant
        default: null
      - name: field_projected_index
        type: number
        source: computed
        description: field variant of energy_use_index
        default: null
      - name: field_exceedance
        type: boolean
        source: computed
        description: true when field_projected_daily_kwh > limit_daily_kwh while the lab variant passes
        default: null
      - name: status
        type: enum
        source: system
        description: test lifecycle state
        default: SCHEDULED
        constraints: SCHEDULED | RUNNING | COMPLETED_PASS | COMPLETED_FAIL | INVALIDATED

  - name: ComplianceLabel
    parent: null
    common_fields: true
    fields:
      - name: case_model_id
        type: string
        source: input
        description: FK -> CaseModel.id; model this label certifies
      - name: energy_test_id
        type: string
        source: input
        description: FK -> EnergyTest.id; passing test this label is issued from
      - name: label_code
        type: string
        source: input
        description: printed label identifier applied to the case nameplate
        constraints: unique, 1-32 chars
      - name: pinned_design_revision
        type: integer
        source: computed
        description: CaseModel.design_revision copied at issuance; label is superseded when the model revises past it
      - name: pinned_lab_rated_index
        type: number
        source: computed
        description: EnergyTest.lab_rated_index copied at issuance and printed on the label
      - name: pinned_standard_code
        type: string
        source: computed
        description: EnergyStandard.standard_code of the test's standard, copied at issuance
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who issued the label
      - name: label_status
        type: enum
        source: system
        description: label validity state
        default: ISSUED
        constraints: ISSUED | SUPERSEDED | REVOKED
      - name: revocation_reason
        type: string
        source: input
        description: reason recorded when a ComplianceOfficer revokes the label
        default: null

  - name: StorePlan
    parent: null
    common_fields: true
    fields:
      - name: banner_name
        type: string
        source: input
        description: retail banner ordering the remodel
      - name: store_number
        type: string
        source: input
        description: banner-scoped store identifier
        constraints: unique per banner_name
      - name: region_code
        type: string
        source: input
        description: two-letter region code used to match install crews and parts depots
      - name: remodel_window_start
        type: datetime
        source: input
        description: ISO 8601 UTC first day of the store remodel window
      - name: remodel_window_end
        type: datetime
        source: input
        description: ISO 8601 UTC last day of the store remodel window; closed interval with remodel_window_start
      - name: credit_limit_cents
        type: integer
        source: input
        description: banner credit ceiling the plan total_cents may not exceed
        constraints: ">= 0"
      - name: commercial_status
        type: enum
        source: system
        description: commercial dimension of the plan lifecycle; evolves independently of production_status
        default: DRAFT
        constraints: DRAFT | PRICED | APPROVED | HOLD_PENDING_RECERT
      - name: production_status
        type: enum
        source: system
        description: production dimension of the plan lifecycle; evolves independently of commercial_status
        default: NOT_RELEASED
        constraints: NOT_RELEASED | IN_PRODUCTION | COMPLETE
      - name: priced_by_user_id
        type: string
        source: system
        description: X-User-ID of the SalesEngineer who priced the plan
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the SalesEngineer who approved the plan; must differ from priced_by_user_id
        default: null
      - name: line_count
        type: integer
        source: computed
        description: number of StorePlanLine rows attached to this plan
        default: 0
      - name: unit_count
        type: integer
        source: computed
        description: sum of StorePlanLine.quantity over this plan's lines
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: sum of StorePlanLine.extended_price_cents, from store_plan_commercial_total
        default: null
      - name: volume_discount_bps
        type: integer
        source: computed
        description: volume tier basis points selected from subtotal_cents
        default: null
      - name: volume_discount_cents
        type: integer
        source: computed
        description: discount amount applied to subtotal_cents
        default: null
      - name: net_cents
        type: integer
        source: computed
        description: subtotal_cents minus volume_discount_cents
        default: null
      - name: freight_cents
        type: integer
        source: computed
        description: freight charge, capped as a fraction of net_cents
        default: null
      - name: install_allowance_cents
        type: integer
        source: computed
        description: installation allowance accrued as a fraction of net_cents
        default: null
      - name: total_cents
        type: integer
        source: computed
        description: net_cents + freight_cents + install_allowance_cents
        default: null
      - name: held_line_count
        type: integer
        source: computed
        description: number of this plan's lines whose compliance_hold is true
        default: 0
      - name: units_completed_count
        type: integer
        source: computed
        description: number of this plan's WorkOrder rows whose status is COMPLETE or SHIPPED
        default: 0
      - name: units_shipped_count
        type: integer
        source: computed
        description: number of this plan's WorkOrder rows whose status is SHIPPED
        default: 0
      - name: warranty_reserve_accrual_cents
        type: integer
        source: computed
        description: accrued warranty reserve from warranty_reserve_balance
        default: 0
      - name: warranty_reserve_incurred_cents
        type: integer
        source: computed
        description: incurred warranty cost from warranty_reserve_balance
        default: 0

  - name: StorePlanLine
    parent: StorePlan
    common_fields: true
    fields:
      - name: store_plan_id
        type: string
        source: input
        description: FK -> StorePlan.id; plan this line belongs to
      - name: case_model_id
        type: string
        source: input
        description: FK -> CaseModel.id; certified model ordered on this line
      - name: length_ft
        type: integer
        source: input
        description: ordered case length in feet; drives the length tier multiplier
        constraints: one of 4 | 6 | 8 | 12
      - name: quantity
        type: integer
        source: input
        description: number of identical cases on this line
        constraints: ">= 1"
      - name: end_cap
        type: enum
        source: input
        description: merchandising end-cap sides ordered on this line
        default: NONE
        constraints: NONE | LEFT | RIGHT | BOTH
      - name: merchandising_options
        type: array
        source: input
        description: option codes added to each case on this line
        default: []
        constraints: subset of [LED_CANOPY, NIGHT_CURTAIN, GLASS_DOOR_UPGRADE, SHELF_LIGHTING, DIGITAL_PRICE_RAIL]
      - name: unit_price_cents
        type: integer
        source: computed
        description: per-case price from case_unit_price_cents
        default: null
      - name: extended_price_cents
        type: integer
        source: computed
        description: unit_price_cents * quantity
        default: null
      - name: compliance_hold
        type: boolean
        source: system
        description: set true when the line's CaseModel loses certification, blocking release and shipment
        default: false

  - name: WorkOrder
    parent: StorePlanLine
    common_fields: true
    fields:
      - name: store_plan_id
        type: string
        source: system
        description: FK -> StorePlan.id; plan whose release created this work order
      - name: store_plan_line_id
        type: string
        source: system
        description: FK -> StorePlanLine.id; line whose quantity this work order is one unit of
      - name: case_model_id
        type: string
        source: system
        description: FK -> CaseModel.id; model being fabricated
      - name: shipment_id
        type: string
        source: system
        description: FK -> Shipment.id; shipment this completed unit was loaded onto
        default: null
      - name: unit_sequence
        type: integer
        source: system
        description: 1-based index of this unit within its StorePlanLine, assigned at release
      - name: serial_number
        type: string
        source: system
        description: serial stamped at release, formatted <StorePlan.store_number>-<StorePlanLine.created_at rank>-<unit_sequence>
      - name: unit_price_cents
        type: integer
        source: computed
        description: StorePlanLine.unit_price_cents copied at release; basis of the warranty accrual
      - name: rework_count
        type: integer
        source: system
        description: number of times this unit has been sent back through fabrication after a failed QA
        default: 0
      - name: warranty_start_date
        type: datetime
        source: system
        description: logical-clock instant at which the unit's shipment was handed off to the install crew
        default: null
      - name: status
        type: enum
        source: system
        description: fabrication and delivery state of one physical case
        default: QUEUED
        constraints: QUEUED | SHEET_METAL | FOAM_INJECTION | DOOR_ASSEMBLY | FINAL_QA | COMPLETE | REWORK | HELD | SHIPPED | SCRAPPED

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: store_plan_id
        type: string
        source: input
        description: FK -> StorePlan.id; plan whose completed units travel on this shipment
      - name: ship_date
        type: datetime
        source: input
        description: ISO 8601 UTC date the trailer leaves the plant
      - name: delivery_date
        type: datetime
        source: input
        description: ISO 8601 UTC date the trailer arrives at the store; must fall inside the plan remodel window
      - name: carrier_code
        type: string
        source: input
        description: freight carrier identifier
      - name: unit_count
        type: integer
        source: computed
        description: number of WorkOrder rows loaded onto this shipment
      - name: linear_feet
        type: integer
        source: computed
        description: sum of StorePlanLine.length_ft over the loaded work orders
      - name: handoff_at
        type: datetime
        source: system
        description: logical-clock instant of the install-contractor handoff
        default: null
      - name: received_by_name
        type: string
        source: client
        description: name of the person on the install crew who signed for the delivery; supplied at handoff
        default: null
      - name: status
        type: enum
        source: system
        description: shipment lifecycle state
        default: STAGED
        constraints: STAGED | LOADED | IN_TRANSIT | DELIVERED | HANDED_OFF | CANCELLED

  - name: InstallCrew
    parent: null
    common_fields: true
    fields:
      - name: crew_code
        type: string
        source: input
        description: install contractor crew identifier
        constraints: unique, 1-32 chars
      - name: contractor_name
        type: string
        source: input
        description: contracting company name
      - name: service_region_codes
        type: array
        source: input
        description: region codes this crew will travel to
        constraints: non-empty array of two-letter region codes
      - name: daily_case_capacity
        type: integer
        source: input
        description: maximum cases this crew can set on any single calendar day
        constraints: ">= 1"
      - name: committed_case_days
        type: integer
        source: computed
        description: sum over InstallBooking rows with status BOOKED of cases_committed * day_count
        default: 0

  - name: InstallBooking
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: FK -> Shipment.id; shipment this crew will set
      - name: install_crew_id
        type: string
        source: input
        description: FK -> InstallCrew.id; crew reserved for the interval
      - name: start_date
        type: datetime
        source: input
        description: ISO 8601 UTC first day of the install; interval is half-open [start_date, end_date)
      - name: end_date
        type: datetime
        source: input
        description: ISO 8601 UTC exclusive end day of the install; a booking ending on day D does not occupy day D
      - name: cases_committed
        type: integer
        source: input
        description: cases this booking consumes from the crew on every day of the interval
        constraints: ">= 1"
      - name: day_count
        type: integer
        source: computed
        description: whole days in the half-open interval, from install_booking_day_count
      - name: status
        type: enum
        source: system
        description: booking lifecycle state
        default: BOOKED
        constraints: BOOKED | RELEASED | COMPLETED

  - name: PartInventory
    parent: null
    common_fields: true
    fields:
      - name: part_number
        type: string
        source: input
        description: service part number
        constraints: unique per region_code
      - name: description
        type: string
        source: input
        description: part description
      - name: case_model_id
        type: string
        source: input
        description: FK -> CaseModel.id; model this part is stocked for
      - name: region_code
        type: string
        source: input
        description: depot region this stock sits in
      - name: on_hand_qty
        type: integer
        source: input
        description: physical units in the depot
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: computed
        description: sum of WarrantyClaim.requested_qty over claims with status PARTS_RESERVED against this row
        default: 0
      - name: available_qty
        type: integer
        source: computed
        description: on_hand_qty - reserved_qty
        default: null
      - name: unit_cost_cents
        type: integer
        source: input
        description: depot cost of one unit, used as the claim parts cost basis
        constraints: ">= 0"
      - name: min_stock_qty
        type: integer
        source: input
        description: minimum stocking level for this part in this region
        constraints: ">= 0"
      - name: below_min
        type: boolean
        source: computed
        description: true when available_qty < min_stock_qty
        default: false

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: FK -> WorkOrder.id; the delivered unit the failure was reported against
      - name: part_inventory_id
        type: string
        source: input
        description: FK -> PartInventory.id; depot stock row the replacement part comes from
      - name: install_crew_id
        type: string
        source: input
        description: FK -> InstallCrew.id; field service crew assigned to the claim
      - name: claim_type
        type: enum
        source: input
        description: failure category; selects the warranty term
        constraints: COMPRESSOR_FAILURE | DOOR_GASKET | CONTROLLER | GLASS_FOG
      - name: reported_date
        type: datetime
        source: input
        description: ISO 8601 UTC date the store reported the failure
      - name: requested_qty
        type: integer
        source: input
        description: replacement part quantity requested
        constraints: ">= 1"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: field estimate of the total repair cost, used by the open-claim reserve variant
        constraints: ">= 0"
      - name: warranty_term_months
        type: integer
        source: computed
        description: warranty term selected from claim_type by warranty_coverage_window
        default: null
      - name: in_warranty
        type: boolean
        source: computed
        description: true when reported_date falls inside the coverage window from WorkOrder.warranty_start_date
        default: null
      - name: parts_cost_cents
        type: integer
        source: computed
        description: PartInventory.unit_cost_cents * requested_qty, fixed when parts are reserved
        default: null
      - name: labor_cost_cents
        type: integer
        source: input
        description: labor billed by the field service crew, supplied at resolution
        default: null
        constraints: ">= 0"
      - name: total_cost_cents
        type: integer
        source: computed
        description: parts_cost_cents + labor_cost_cents, fixed at resolution
        default: null
      - name: denial_reason
        type: string
        source: input
        description: reason recorded when the ServiceManager denies the claim
        default: null
      - name: status
        type: enum
        source: system
        description: claim lifecycle state
        default: OPEN
        constraints: OPEN | PARTS_RESERVED | RESOLVED | DENIED

state_machines:
  - entity: CaseModel
    initial_state: DRAFT
    terminal_states: []
    note: |
      Cyclic by design. Every non-DRAFT state can return to DRAFT through
      POST /case-models/{id}/engineering-change, which is how a refrigerant transition to a
      lower-GWP blend re-enters the design loop. There is no terminal state.
    transitions:
      - from: DRAFT
        to: MODELED
        trigger: "POST /case-models/{id}/airflow-model"
        actor: DesignEngineer
        preconditions:
          - "CaseModel.status == DRAFT"
          - "CaseModel.system_type IN Refrigerant.allowed_system_types of CaseModel.refrigerant_id"
          - "CaseModel.door_type == GLASS_DOOR OR CaseModel.glass_door_count == 0"
        side_effects:
          - "recompute airflow_load_model: sets curtain_factor, velocity_factor, infiltration_load_w, lighting_load_w, fan_load_w, defrost_load_w, anti_sweat_load_w, total_design_load_w"
          - "recompute refrigerant_charge_basis: sets installed_charge_grams, nameplate_co2e_kg, installed_co2e_kg"
          - "increments CaseModel.version by 1"
      - from: MODELED
        to: SUBMITTED_FOR_TEST
        trigger: "POST /case-models/{id}/submit-for-test"
        actor: DesignEngineer
        preconditions:
          - "CaseModel.status == MODELED"
          - "CaseModel.total_design_load_w IS NOT NULL"
          - "CaseModel.installed_charge_grams <= Refrigerant.max_charge_grams of CaseModel.refrigerant_id"
        side_effects:
          - "sets CaseModel.submitted_by_user_id to the X-User-ID header of this request"
          - "increments CaseModel.version by 1"
      - from: SUBMITTED_FOR_TEST
        to: TESTED_PASS
        trigger: "system, on POST /energy-tests/{id}/complete when EnergyTest.measured_kwh_24h <= EnergyTest.limit_daily_kwh"
        actor: system
        preconditions:
          - "CaseModel.status == SUBMITTED_FOR_TEST"
          - "EnergyTest.case_model_id == CaseModel.id AND EnergyTest.status == RUNNING"
        side_effects:
          - "increments CaseModel.version by 1"
      - from: SUBMITTED_FOR_TEST
        to: TESTED_FAIL
        trigger: "system, on POST /energy-tests/{id}/complete when EnergyTest.measured_kwh_24h > EnergyTest.limit_daily_kwh"
        actor: system
        preconditions:
          - "CaseModel.status == SUBMITTED_FOR_TEST"
          - "EnergyTest.case_model_id == CaseModel.id AND EnergyTest.status == RUNNING"
        side_effects:
          - "increments CaseModel.version by 1"
      - from: TESTED_PASS
        to: CERTIFIED
        trigger: "POST /compliance-labels"
        actor: ComplianceOfficer
        preconditions:
          - "CaseModel.status == TESTED_PASS"
          - "EnergyTest of ComplianceLabel.energy_test_id has status == COMPLETED_PASS"
          - "EnergyTest.pinned_design_revision == CaseModel.design_revision"
          - "X-User-ID of this request != CaseModel.submitted_by_user_id"
          - "Refrigerant.gwp_100yr of CaseModel.refrigerant_id <= EnergyStandard.max_gwp of the test's standard"
        side_effects:
          - "creates ComplianceLabel with label_status ISSUED, pinned_design_revision = CaseModel.design_revision, pinned_lab_rated_index = EnergyTest.lab_rated_index, pinned_standard_code = EnergyStandard.standard_code"
          - "increments CaseModel.version by 1"
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /compliance-labels/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceLabel.label_status == ISSUED"
          - "CaseModel.status == CERTIFIED"
        side_effects:
          - "sets ComplianceLabel.label_status to REVOKED and records revocation_reason"
          - "cascade hop 2: sets compliance_hold = true on every StorePlanLine whose case_model_id == CaseModel.id and whose StorePlan.production_status != COMPLETE; recomputes StorePlan.held_line_count"
          - "cascade hop 3: for each StorePlan touched in hop 2 whose commercial_status == APPROVED, sets commercial_status to HOLD_PENDING_RECERT"
          - "increments CaseModel.version by 1"
      - from: CERTIFIED
        to: DRAFT
        trigger: "POST /case-models/{id}/engineering-change"
        actor: DesignEngineer
        preconditions:
          - "CaseModel.status IN {MODELED, SUBMITTED_FOR_TEST, TESTED_PASS, TESTED_FAIL, CERTIFIED, DECERTIFIED}"
          - "CaseModel.refrigerant_id of the request resolves to an existing Refrigerant whose allowed_system_types contains CaseModel.system_type"
        side_effects:
          - "cascade hop 1: increments CaseModel.design_revision by 1, clears every computed airflow and charge field to null, sets submitted_by_user_id to null, sets status to DRAFT"
          - "cascade hop 2: because design_revision now exceeds ComplianceLabel.pinned_design_revision, every ComplianceLabel of this model with label_status == ISSUED moves ISSUED -> SUPERSEDED; every EnergyTest of this model with status == RUNNING moves RUNNING -> INVALIDATED (a test physically running on a design that just changed is voided). EnergyTest rows with status == SCHEDULED are deliberately left SCHEDULED — they keep their chamber slot and are rejected at start time with ERR_CASE_MODEL_REVISION_STALE."
          - "cascade hop 3: because the model no longer holds an ISSUED label, every StorePlanLine whose case_model_id == CaseModel.id and whose StorePlan.production_status != COMPLETE gets compliance_hold = true and its StorePlan.held_line_count is recomputed"
          - "cascade hop 4: because held_line_count became > 0, each affected StorePlan whose commercial_status == APPROVED moves APPROVED -> HOLD_PENDING_RECERT"
          - "cascade hop 5: because the plan entered HOLD_PENDING_RECERT, every WorkOrder of that plan with status == QUEUED moves QUEUED -> HELD"
          - "increments CaseModel.version by 1"
      - from: TESTED_PASS
        to: DRAFT
        trigger: "POST /case-models/{id}/engineering-change"
        actor: DesignEngineer
        preconditions:
          - "CaseModel.status == TESTED_PASS"
        side_effects:
          - "same cascade as CERTIFIED -> DRAFT; the passing test stays COMPLETED_PASS but its pinned_design_revision no longer matches, so no label can be issued from it"
          - "increments CaseModel.version by 1"
      - from: TESTED_FAIL
        to: DRAFT
        trigger: "POST /case-models/{id}/engineering-change"
        actor: DesignEngineer
        preconditions:
          - "CaseModel.status == TESTED_FAIL"
        side_effects:
          - "same cascade as CERTIFIED -> DRAFT; hops 2-5 are no-ops when the model never held an ISSUED label"
          - "increments CaseModel.version by 1"
      - from: DECERTIFIED
        to: DRAFT
        trigger: "POST /case-models/{id}/engineering-change"
        actor: DesignEngineer
        preconditions:
          - "CaseModel.status == DECERTIFIED"
        side_effects:
          - "same cascade as CERTIFIED -> DRAFT"
          - "increments CaseModel.version by 1"
      - from: MODELED
        to: DRAFT
        trigger: "POST /case-models/{id}/engineering-change"
        actor: DesignEngineer
        preconditions:
          - "CaseModel.status == MODELED"
        side_effects:
          - "same cascade as CERTIFIED -> DRAFT"
          - "increments CaseModel.version by 1"
      - from: SUBMITTED_FOR_TEST
        to: DRAFT
        trigger: "POST /case-models/{id}/engineering-change"
        actor: DesignEngineer
        preconditions:
          - "CaseModel.status == SUBMITTED_FOR_TEST"
        side_effects:
          - "same cascade as CERTIFIED -> DRAFT; any RUNNING EnergyTest of this model is INVALIDATED while SCHEDULED tests keep their chamber slot and later fail to start with ERR_CASE_MODEL_REVISION_STALE"
          - "increments CaseModel.version by 1"

  - entity: EnergyTest
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, COMPLETED_FAIL, INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /energy-tests/{id}/start"
        actor: TestLabTechnician
        preconditions:
          - "EnergyTest.status == SCHEDULED"
          - "CaseModel.status == SUBMITTED_FOR_TEST"
          - "EnergyTest.pinned_design_revision == CaseModel.design_revision"
        side_effects:
          - "increments EnergyTest.version by 1"
      - from: RUNNING
        to: COMPLETED_PASS
        trigger: "POST /energy-tests/{id}/complete with measured_kwh_24h <= limit_daily_kwh"
        actor: TestLabTechnician
        preconditions:
          - "EnergyTest.status == RUNNING"
          - "measured_kwh_24h >= 0"
        side_effects:
          - "recompute energy_use_index (lab variant): sets lab_rated_index"
          - "recompute energy_use_index (field variant): sets field_projected_daily_kwh, field_projected_index, field_exceedance"
          - "cross-entity: CaseModel SUBMITTED_FOR_TEST -> TESTED_PASS"
          - "increments EnergyTest.version by 1"
      - from: RUNNING
        to: COMPLETED_FAIL
        trigger: "POST /energy-tests/{id}/complete with measured_kwh_24h > limit_daily_kwh"
        actor: TestLabTechnician
        preconditions:
          - "EnergyTest.status == RUNNING"
          - "measured_kwh_24h >= 0"
        side_effects:
          - "recompute energy_use_index (both variants) exactly as on the pass path"
          - "cross-entity: CaseModel SUBMITTED_FOR_TEST -> TESTED_FAIL"
          - "increments EnergyTest.version by 1"
      - from: RUNNING
        to: INVALIDATED
        trigger: "system, on POST /case-models/{id}/engineering-change for EnergyTest.case_model_id"
        actor: system
        preconditions:
          - "EnergyTest.status == RUNNING"
        side_effects:
          - "releases the chamber interval so a later test may occupy it"
          - "increments EnergyTest.version by 1"

  - entity: ComplianceLabel
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system, on POST /case-models/{id}/engineering-change for ComplianceLabel.case_model_id"
        actor: system
        preconditions:
          - "ComplianceLabel.label_status == ISSUED"
          - "CaseModel.design_revision > ComplianceLabel.pinned_design_revision after the increment"
        side_effects:
          - "drives cascade hops 3-5 of the engineering-change chain (line holds, plan hold, work-order holds)"
          - "increments ComplianceLabel.version by 1"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /compliance-labels/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceLabel.label_status == ISSUED"
          - "revocation_reason is a non-empty string"
        side_effects:
          - "cross-entity: CaseModel CERTIFIED -> DECERTIFIED"
          - "sets compliance_hold = true on every StorePlanLine of this model whose StorePlan.production_status != COMPLETE"
          - "increments ComplianceLabel.version by 1"

  - entity: StorePlan
    initial_state: "commercial_status=DRAFT, production_status=NOT_RELEASED"
    terminal_states: []
    note: |
      Two independent state dimensions on one row. commercial_status walks
      DRAFT -> PRICED -> APPROVED with a HOLD_PENDING_RECERT excursion and a PRICED -> DRAFT
      loop whenever a line is added; production_status walks NOT_RELEASED -> IN_PRODUCTION ->
      COMPLETE and can fall back to IN_PRODUCTION. A plan can sit at
      (HOLD_PENDING_RECERT, IN_PRODUCTION) — the commercial hold does not rewind production, and
      production progress does not clear the commercial hold. Transition names below are unique
      across both dimensions.
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /store-plans/{id}/price"
        actor: SalesEngineer
        preconditions:
          - "StorePlan.commercial_status == DRAFT"
          - "StorePlan.line_count >= 1"
          - "every StorePlanLine of this plan has compliance_hold == false"
          - "CaseModel.status == CERTIFIED for every StorePlanLine.case_model_id of this plan"
        side_effects:
          - "recompute case_unit_price_cents for every StorePlanLine: sets unit_price_cents and extended_price_cents"
          - "recompute store_plan_commercial_total: sets subtotal_cents, volume_discount_bps, volume_discount_cents, net_cents, freight_cents, install_allowance_cents, total_cents"
          - "sets StorePlan.priced_by_user_id to the X-User-ID header of this request"
          - "increments StorePlan.version by 1"
      - from: PRICED
        to: DRAFT
        trigger: "POST /store-plans/{id}/lines"
        actor: SalesEngineer
        preconditions:
          - "StorePlan.commercial_status == PRICED"
        side_effects:
          - "clears subtotal_cents, volume_discount_bps, volume_discount_cents, net_cents, freight_cents, install_allowance_cents, total_cents and priced_by_user_id to null"
          - "recomputes line_count and unit_count"
          - "increments StorePlan.version by 1"
        note: "Adding a line after pricing invalidates the quote and forces a re-price; the commercial dimension is cyclic."
      - from: PRICED
        to: APPROVED
        trigger: "POST /store-plans/{id}/approve"
        actor: SalesEngineer
        preconditions:
          - "StorePlan.commercial_status == PRICED"
          - "X-User-ID of this request != StorePlan.priced_by_user_id"
          - "StorePlan.total_cents <= StorePlan.credit_limit_cents"
          - "StorePlan.held_line_count == 0"
        side_effects:
          - "sets StorePlan.approved_by_user_id to the X-User-ID header of this request"
          - "increments StorePlan.version by 1"
      - from: APPROVED
        to: HOLD_PENDING_RECERT
        trigger: "system, cascade hop 4 of POST /case-models/{id}/engineering-change, or the label-revoke cascade"
        actor: system
        preconditions:
          - "StorePlan.commercial_status == APPROVED"
          - "StorePlan.held_line_count > 0 after the line holds are applied"
        side_effects:
          - "cascade hop 5: every WorkOrder of this plan with status == QUEUED moves QUEUED -> HELD"
          - "increments StorePlan.version by 1"
      - from: HOLD_PENDING_RECERT
        to: APPROVED
        trigger: "system, on POST /compliance-labels issuing a new ISSUED label for a CaseModel referenced by this plan's held lines"
        actor: system
        preconditions:
          - "StorePlan.commercial_status == HOLD_PENDING_RECERT"
          - "held_line_count becomes 0 once compliance_hold is cleared on the lines of the newly certified model"
        side_effects:
          - "sets compliance_hold = false on every StorePlanLine of this plan whose case_model_id is the newly certified model, then recomputes held_line_count"
          - "every WorkOrder of this plan with status == HELD moves HELD -> QUEUED"
          - "increments StorePlan.version by 1"
      - from: NOT_RELEASED
        to: IN_PRODUCTION
        trigger: "POST /store-plans/{id}/release"
        actor: PlantSupervisor
        preconditions:
          - "StorePlan.commercial_status == APPROVED"
          - "StorePlan.production_status == NOT_RELEASED"
          - "StorePlan.held_line_count == 0"
        side_effects:
          - "creates one WorkOrder with status QUEUED per unit for every StorePlanLine (StorePlanLine.quantity rows each), ordered by StorePlanLine.created_at ASC then unit_sequence ASC, copying store_plan_id, store_plan_line_id, case_model_id and unit_price_cents and stamping serial_number"
          - "recompute warranty_reserve_balance: sets warranty_reserve_accrual_cents"
          - "increments StorePlan.version by 1"
      - from: IN_PRODUCTION
        to: COMPLETE
        trigger: "system, on POST /shipments once units_shipped_count == unit_count"
        actor: system
        preconditions:
          - "StorePlan.production_status == IN_PRODUCTION"
          - "StorePlan.units_shipped_count == StorePlan.unit_count after the shipment loads its units"
        side_effects:
          - "increments StorePlan.version by 1"
      - from: COMPLETE
        to: IN_PRODUCTION
        trigger: "system, cascade hop 3 of POST /shipments/{id}/cancel"
        actor: system
        preconditions:
          - "StorePlan.production_status == COMPLETE"
          - "StorePlan.units_shipped_count < StorePlan.unit_count after the cancelled shipment's units revert"
        side_effects:
          - "cascade hop 4: every InstallBooking of the cancelled shipment with status == BOOKED moves BOOKED -> RELEASED"
          - "increments StorePlan.version by 1"

  - entity: WorkOrder
    initial_state: QUEUED
    terminal_states: [SCRAPPED]
    note: "Branching on CaseModel.door_type (DOOR_ASSEMBLY is skipped for OPEN cases) plus a REWORK -> SHEET_METAL loop bounded by REWORK_LIMIT."
    transitions:
      - from: QUEUED
        to: SHEET_METAL
        trigger: "POST /work-orders/{id}/advance"
        actor: PlantSupervisor
        preconditions:
          - "WorkOrder.status == QUEUED"
          - "StorePlan.production_status == IN_PRODUCTION"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: SHEET_METAL
        to: FOAM_INJECTION
        trigger: "POST /work-orders/{id}/advance"
        actor: PlantSupervisor
        preconditions:
          - "WorkOrder.status == SHEET_METAL"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: FOAM_INJECTION
        to: DOOR_ASSEMBLY
        trigger: "POST /work-orders/{id}/advance when CaseModel.door_type == GLASS_DOOR"
        actor: PlantSupervisor
        preconditions:
          - "WorkOrder.status == FOAM_INJECTION"
          - "CaseModel.door_type == GLASS_DOOR"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: FOAM_INJECTION
        to: FINAL_QA
        trigger: "POST /work-orders/{id}/advance when CaseModel.door_type == OPEN"
        actor: PlantSupervisor
        preconditions:
          - "WorkOrder.status == FOAM_INJECTION"
          - "CaseModel.door_type == OPEN"
        side_effects:
          - "increments WorkOrder.version by 1"
        note: "OPEN cases skip DOOR_ASSEMBLY entirely; the two branches rejoin at FINAL_QA."
      - from: DOOR_ASSEMBLY
        to: FINAL_QA
        trigger: "POST /work-orders/{id}/advance"
        actor: PlantSupervisor
        preconditions:
          - "WorkOrder.status == DOOR_ASSEMBLY"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: REWORK
        to: SHEET_METAL
        trigger: "POST /work-orders/{id}/advance"
        actor: PlantSupervisor
        preconditions:
          - "WorkOrder.status == REWORK"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: FINAL_QA
        to: COMPLETE
        trigger: "POST /work-orders/{id}/qa-result with result == PASS"
        actor: PlantSupervisor
        preconditions:
          - "WorkOrder.status == FINAL_QA"
        side_effects:
          - "recomputes StorePlan.units_completed_count"
          - "increments WorkOrder.version by 1"
      - from: FINAL_QA
        to: REWORK
        trigger: "POST /work-orders/{id}/qa-result with result == FAIL"
        actor: PlantSupervisor
        preconditions:
          - "WorkOrder.status == FINAL_QA"
          - "WorkOrder.rework_count < REWORK_LIMIT (2)"
        side_effects:
          - "increments WorkOrder.rework_count by 1"
          - "increments WorkOrder.version by 1"
      - from: FINAL_QA
        to: SCRAPPED
        trigger: "POST /work-orders/{id}/qa-result with result == SCRAP"
        actor: PlantSupervisor
        preconditions:
          - "WorkOrder.status == FINAL_QA"
          - "WorkOrder.rework_count == REWORK_LIMIT (2)"
        side_effects:
          - "recomputes StorePlan.units_completed_count (the scrapped unit is excluded)"
          - "increments WorkOrder.version by 1"
      - from: QUEUED
        to: HELD
        trigger: "system, cascade hop 5 of POST /case-models/{id}/engineering-change"
        actor: system
        preconditions:
          - "WorkOrder.status == QUEUED"
          - "StorePlan.commercial_status moved APPROVED -> HOLD_PENDING_RECERT in the same request"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: HELD
        to: QUEUED
        trigger: "system, on the StorePlan HOLD_PENDING_RECERT -> APPROVED recertification cascade"
        actor: system
        preconditions:
          - "WorkOrder.status == HELD"
          - "StorePlan.held_line_count == 0 after the holds are cleared"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: COMPLETE
        to: SHIPPED
        trigger: "system, on POST /shipments"
        actor: system
        preconditions:
          - "WorkOrder.status == COMPLETE"
          - "WorkOrder.store_plan_id == Shipment.store_plan_id"
        side_effects:
          - "sets WorkOrder.shipment_id to the new Shipment.id"
          - "recomputes StorePlan.units_shipped_count"
          - "increments WorkOrder.version by 1"
      - from: SHIPPED
        to: COMPLETE
        trigger: "system, cascade hop 2 of POST /shipments/{id}/cancel"
        actor: system
        preconditions:
          - "WorkOrder.status == SHIPPED"
          - "WorkOrder.shipment_id == the cancelled Shipment.id"
        side_effects:
          - "clears WorkOrder.shipment_id to null"
          - "cascade hop 3: recomputes StorePlan.units_shipped_count, which drives StorePlan production COMPLETE -> IN_PRODUCTION"
          - "increments WorkOrder.version by 1"

  - entity: Shipment
    initial_state: STAGED
    terminal_states: [HANDED_OFF, CANCELLED]
    transitions:
      - from: STAGED
        to: LOADED
        trigger: "POST /shipments/{id}/advance"
        actor: LogisticsCoordinator
        preconditions:
          - "Shipment.status == STAGED"
        side_effects:
          - "increments Shipment.version by 1"
      - from: LOADED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/advance"
        actor: LogisticsCoordinator
        preconditions:
          - "Shipment.status == LOADED"
        side_effects:
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/advance"
        actor: LogisticsCoordinator
        preconditions:
          - "Shipment.status == IN_TRANSIT"
        side_effects:
          - "increments Shipment.version by 1"
      - from: DELIVERED
        to: HANDED_OFF
        trigger: "POST /shipments/{id}/handoff"
        actor: InstallContractor
        preconditions:
          - "Shipment.status == DELIVERED"
          - "an InstallBooking exists with shipment_id == Shipment.id, install_crew_id == X-User-ID, and status == BOOKED"
          - "the logical clock instant falls inside [InstallBooking.start_date, InstallBooking.end_date)"
        side_effects:
          - "sets Shipment.handoff_at to the current logical clock instant and Shipment.received_by_name to the request value"
          - "moves that InstallBooking BOOKED -> COMPLETED and decreases InstallCrew.committed_case_days by cases_committed * day_count"
          - "sets WorkOrder.warranty_start_date to the same instant on every WorkOrder whose shipment_id == Shipment.id"
          - "increments Shipment.version by 1"
      - from: STAGED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "Shipment.status IN {STAGED, LOADED, IN_TRANSIT}"
        side_effects:
          - "cascade hop 1: sets Shipment.status to CANCELLED"
          - "cascade hop 2: every WorkOrder with shipment_id == Shipment.id moves SHIPPED -> COMPLETE and clears shipment_id"
          - "cascade hop 3: because units_shipped_count fell below unit_count, StorePlan production COMPLETE -> IN_PRODUCTION"
          - "cascade hop 4: because the plan left production COMPLETE, every InstallBooking of this shipment with status == BOOKED moves BOOKED -> RELEASED"
          - "cascade hop 5: because the booking was released, InstallCrew.committed_case_days decreases by cases_committed * day_count"
          - "increments Shipment.version by 1"
      - from: LOADED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "Shipment.status == LOADED"
        side_effects:
          - "identical five-hop cascade as STAGED -> CANCELLED"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "Shipment.status == IN_TRANSIT"
        side_effects:
          - "identical five-hop cascade as STAGED -> CANCELLED"
          - "increments Shipment.version by 1"

  - entity: InstallBooking
    initial_state: BOOKED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: BOOKED
        to: RELEASED
        trigger: "POST /install-bookings/{id}/release"
        actor: LogisticsCoordinator
        preconditions:
          - "InstallBooking.status == BOOKED"
        side_effects:
          - "decreases InstallCrew.committed_case_days by cases_committed * day_count"
          - "increments InstallBooking.version by 1"
      - from: BOOKED
        to: COMPLETED
        trigger: "system, on POST /shipments/{id}/handoff"
        actor: system
        preconditions:
          - "InstallBooking.status == BOOKED"
          - "InstallBooking.shipment_id == the handed-off Shipment.id"
        side_effects:
          - "decreases InstallCrew.committed_case_days by cases_committed * day_count"
          - "increments InstallBooking.version by 1"

  - entity: WarrantyClaim
    initial_state: OPEN
    terminal_states: [RESOLVED, DENIED]
    transitions:
      - from: OPEN
        to: PARTS_RESERVED
        trigger: "POST /warranty-claims/{id}/reserve-parts"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == OPEN"
          - "WarrantyClaim.in_warranty == true"
          - "PartInventory.available_qty >= WarrantyClaim.requested_qty"
        side_effects:
          - "sets WarrantyClaim.parts_cost_cents to PartInventory.unit_cost_cents * requested_qty"
          - "increases PartInventory.reserved_qty by requested_qty and recomputes available_qty and below_min"
          - "increments WarrantyClaim.version by 1"
      - from: PARTS_RESERVED
        to: RESOLVED
        trigger: "POST /warranty-claims/{id}/resolve"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == PARTS_RESERVED"
          - "labor_cost_cents >= 0"
        side_effects:
          - "sets WarrantyClaim.total_cost_cents to parts_cost_cents + labor_cost_cents"
          - "decreases PartInventory.on_hand_qty and PartInventory.reserved_qty by requested_qty (parts consumed), recomputes available_qty and below_min"
          - "recompute warranty_reserve_balance: updates StorePlan.warranty_reserve_incurred_cents"
          - "increments WarrantyClaim.version by 1"
      - from: OPEN
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == OPEN"
          - "denial_reason is a non-empty string"
        side_effects:
          - "recompute warranty_reserve_balance: the denied claim leaves the open-claim reserve"
          - "increments WarrantyClaim.version by 1"
      - from: PARTS_RESERVED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == PARTS_RESERVED"
          - "denial_reason is a non-empty string"
        side_effects:
          - "compensation: decreases PartInventory.reserved_qty by requested_qty, leaving on_hand_qty untouched, and recomputes available_qty and below_min"
          - "clears WarrantyClaim.parts_cost_cents to null"
          - "recompute warranty_reserve_balance"
          - "increments WarrantyClaim.version by 1"

concurrency_rules:
  - rule_id: energy-test-create-stale-case-model
    parent_entity: CaseModel
    write_endpoint: "POST /energy-tests"
    occ_field: "expected_case_model_version"
    description: |
      Scheduling an EnergyTest against a CaseModel whose version has advanced since the client
      last read it is rejected as a stale write. A new test legitimately supersedes an earlier
      SCHEDULED test on the same model, so the second create would otherwise succeed on its own
      merits; the version check is what tells the lab that the design it read has since been
      revised or re-submitted.
    error_id: ERR_STALE_CASE_MODEL_VERSION
    http_status: 412

  - rule_id: shipment-create-stale-store-plan
    parent_entity: StorePlan
    write_endpoint: "POST /shipments"
    occ_field: "expected_store_plan_version"
    description: |
      Creating a Shipment against a StorePlan whose version has advanced since the client last
      read it is rejected as a stale write. A plan may legitimately carry several shipments, so a
      second create is valid product behavior; the version check is what stops a coordinator from
      loading a unit set that has changed since the plan was read.
    error_id: ERR_STALE_STORE_PLAN_VERSION
    http_status: 412

calculations:
  - name: airflow_load_model
    trigger: "POST /case-models/{id}/airflow-model (CaseModel DRAFT -> MODELED)"
    algorithm: constraint_propagation
    formula: |
      temperature_spread   = max(0, ambient_dew_point_c - case_air_temp_c)
      curtain_factor       = max(MIN_CURTAIN_FACTOR, 1 - CURTAIN_REDUCTION_PER_LAYER * (curtain_layers - 1))
      velocity_factor      = 1 + VELOCITY_SENSITIVITY * max(0, discharge_velocity_mps - VELOCITY_REF_MPS) / VELOCITY_REF_MPS
      infiltration_load_w  = round_half_up(K_INF[temperature_class] * tda_sqft * temperature_spread
                                           * curtain_factor * velocity_factor, 2)
      lighting_load_w      = round_half_up(lighting_w_per_ft * nominal_length_ft, 2)
      fan_load_w           = round_half_up(fan_w_per_ft * nominal_length_ft, 2)
      defrost_load_w       = round_half_up(DEFROST_W_PER_CYCLE_PER_SQFT * defrost_cycles_per_day
                                           * tda_sqft / 24, 2)
      anti_sweat_load_w    = round_half_up(ANTI_SWEAT_W_PER_DOOR[temperature_class] * glass_door_count, 2)
      subtotal_w           = infiltration_load_w + lighting_load_w + fan_load_w
                             + defrost_load_w + anti_sweat_load_w
      # Self-contained cases reject condenser heat back into the display volume.
      reject_w             = (system_type == SELF_CONTAINED)
                             ? round_half_up(SELF_CONTAINED_REJECT_FRACTION * subtotal_w, 2)
                             : 0.00
      total_design_load_w  = round_half_up(subtotal_w + reject_w, 2)
    input_set: "The single CaseModel named in the path, plus the Refrigerant referenced by CaseModel.refrigerant_id. No other entity participates."
    constants:
      K_INF: { HT: 0.62, MT: 0.78, LT: 1.05 }
      CURTAIN_REDUCTION_PER_LAYER: 0.12
      MIN_CURTAIN_FACTOR: 0.55
      VELOCITY_REF_MPS: 0.45
      VELOCITY_SENSITIVITY: 0.20
      ANTI_SWEAT_W_PER_DOOR: { HT: 0, MT: 18, LT: 42 }
      SELF_CONTAINED_REJECT_FRACTION: 0.08
      DEFROST_W_PER_CYCLE_PER_SQFT: 3.5
    precision: |
      Rounding order is pinned: each of the five load components is rounded to 2 decimals
      round_half_up FIRST, then summed; the self-contained reject term is computed from the
      already-rounded subtotal and itself rounded to 2 decimals before the final sum.
      curtain_factor and velocity_factor are NOT rounded — they enter the infiltration product
      at full precision.

  - name: refrigerant_charge_basis
    trigger: "POST /case-models/{id}/airflow-model (CaseModel DRAFT -> MODELED)"
    algorithm: aggregation
    formula: |
      installed_charge_grams = charge_grams + LINE_SET_CHARGE_GRAMS_PER_FT * line_set_length_ft
      nameplate_co2e_kg      = round_half_up(charge_grams / 1000 * Refrigerant.gwp_100yr, 1)
      installed_co2e_kg      = round_half_up(installed_charge_grams / 1000 * Refrigerant.gwp_100yr, 1)
    input_set: "The CaseModel named in the path and its Refrigerant. line_set_length_ft is required to be 0 when system_type == SELF_CONTAINED, so the two bases coincide for self-contained circuits."
    constants:
      LINE_SET_CHARGE_GRAMS_PER_FT: 26
    precision: "CO2e masses: 1 decimal place, round_half_up. installed_charge_grams is an exact integer."
    variants:
      - name: nameplate_basis
        when: "Printed on the case nameplate and used for factory-level GWP reporting."
        difference: "Counts only the charge sealed inside the case (charge_grams); ignores the field line set entirely."
      - name: installed_basis
        when: "Enforced by validation priority 11 against Refrigerant.max_charge_grams at submit-for-test time."
        difference: "Adds LINE_SET_CHARGE_GRAMS_PER_FT * line_set_length_ft, so a REMOTE case with a long line set can pass on the nameplate basis and fail on the installed basis."

  - name: energy_limit_daily_kwh
    trigger: "POST /energy-tests (test creation pins the limit)"
    algorithm: threshold
    formula: |
      limit_daily_kwh = round_half_up(EnergyStandard.limit_coefficient_a * CaseModel.tda_sqft
                                      + EnergyStandard.limit_constant_b, 3)
      # tda_sqft is copied into EnergyTest.pinned_tda_sqft in the same request and every later
      # index uses the pinned copy, never the live CaseModel field.
    input_set: "The EnergyStandard named in the request body and the CaseModel named in the request body, read once at creation."
    constants: {}
    precision: "3 decimal places, round_half_up. Comparison at completion is measured_kwh_24h <= limit_daily_kwh, so a measurement exactly equal to the limit PASSES."

  - name: energy_use_index
    trigger: "POST /energy-tests/{id}/complete (EnergyTest RUNNING -> COMPLETED_PASS or COMPLETED_FAIL)"
    algorithm: forward_looking
    formula: |
      # laboratory variant
      lab_rated_index           = round_half_up(measured_kwh_24h / pinned_tda_sqft, 3)
      # field variant
      ambient_uplift            = 1 + AMBIENT_SENSITIVITY_PER_C * max(0, store_ambient_c - test_ambient_c)
      missed_defrost_cycles     = max(0, pinned_defrost_cycles_per_day - measured_defrost_cycles)
      field_projected_daily_kwh = round_half_up(measured_kwh_24h * ambient_uplift
                                                + DEFROST_KWH_PER_CYCLE * missed_defrost_cycles, 3)
      field_projected_index     = round_half_up(field_projected_daily_kwh / pinned_tda_sqft, 3)
      field_exceedance          = (measured_kwh_24h <= limit_daily_kwh)
                                  AND (field_projected_daily_kwh > limit_daily_kwh)
      # PASS/FAIL is decided by the LABORATORY variant only: measured_kwh_24h vs limit_daily_kwh.
      # field_exceedance records that the same case would miss the limit in the destination store.
    input_set: "The single EnergyTest named in the path, using its pinned_tda_sqft, pinned_defrost_cycles_per_day and limit_daily_kwh — never the live CaseModel values."
    constants:
      AMBIENT_SENSITIVITY_PER_C: 0.035
      DEFROST_KWH_PER_CYCLE: 0.28
    precision: "3 decimal places, round_half_up. ambient_uplift is not rounded; the product is rounded once."
    variants:
      - name: lab_rated
        when: "Certification decision and the number printed on the ComplianceLabel."
        difference: "Uses the metered 24-hour figure as measured in the chamber, with no ambient or defrost correction."
      - name: field_projected
        when: "Store-level energy projection attached to the same completed test."
        difference: "Applies AMBIENT_SENSITIVITY_PER_C per degree of store-over-chamber ambient and adds DEFROST_KWH_PER_CYCLE for every design defrost cycle the chamber did not actually run, so the same measurement yields a higher index."

  - name: case_unit_price_cents
    trigger: "POST /store-plans/{id}/price (StorePlan DRAFT -> PRICED)"
    algorithm: tiered_pricing
    formula: |
      base_cents   = round_half_up(BASE_PRICE_PER_FT_CENTS[CaseModel.temperature_class]
                                   * length_ft * LENGTH_TIER[length_ft], 0)
      option_cents = sum(OPTION_ADDER_CENTS[o] for o in merchandising_options)
      endcap_cents = END_CAP_ADDER_CENTS_PER_SIDE * END_CAP_SIDES[end_cap]
      system_cents = SYSTEM_ADDER_CENTS[CaseModel.system_type]
      unit_price_cents     = base_cents + option_cents + endcap_cents + system_cents
      extended_price_cents = unit_price_cents * quantity
    input_set: "Every StorePlanLine whose store_plan_id == the plan in the path, processed in created_at ASC order. Lines are never filtered by status; a plan cannot be priced while any line has compliance_hold == true."
    constants:
      BASE_PRICE_PER_FT_CENTS: { HT: 78000, MT: 96000, LT: 124000 }
      LENGTH_TIER: { 4: 1.15, 6: 1.06, 8: 1.00, 12: 0.94 }
      OPTION_ADDER_CENTS: { LED_CANOPY: 42000, NIGHT_CURTAIN: 28500, GLASS_DOOR_UPGRADE: 165000, SHELF_LIGHTING: 51500, DIGITAL_PRICE_RAIL: 73500 }
      END_CAP_ADDER_CENTS_PER_SIDE: 87000
      END_CAP_SIDES: { NONE: 0, LEFT: 1, RIGHT: 1, BOTH: 2 }
      SYSTEM_ADDER_CENTS: { REMOTE: 118000, SELF_CONTAINED: 320000 }
    precision: |
      Integer cents. Only base_cents is rounded (0 decimals, round_half_up) because the length
      tier is fractional; the option, end-cap and system adders are exact integers added AFTER
      that rounding. Rounding the sum instead of the base term is a different number.

  - name: store_plan_commercial_total
    trigger: "POST /store-plans/{id}/price (StorePlan DRAFT -> PRICED)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned; the discount tier is keyed on subtotal_cents while freight and
      # allowance are keyed on net_cents, which already reflects the discount. Reading it as a
      # single all-at-once system of equations is circular, so the six steps below execute in this order.
      # step 1
      subtotal_cents        = sum(StorePlanLine.extended_price_cents over the plan's lines,
                                  each line already rounded by case_unit_price_cents)
      total_linear_feet     = sum(StorePlanLine.length_ft * StorePlanLine.quantity over the plan's lines)
      # step 2 - tier selected from the SUBTOTAL, not from the total
      volume_discount_bps   = 0   if subtotal_cents <  5000000
                              300 if subtotal_cents <  10000000
                              550 if subtotal_cents <  20000000
                              800 otherwise
      # step 3
      volume_discount_cents = round_half_up(subtotal_cents * volume_discount_bps / 10000, 0)
      # step 4
      net_cents             = subtotal_cents - volume_discount_cents
      # step 5 - freight is the lesser of the per-foot tariff and a cap on NET
      freight_cents         = min(round_half_up(FREIGHT_PER_LINEAR_FT_CENTS * total_linear_feet, 0),
                                  round_half_up(net_cents * FREIGHT_CAP_FRACTION, 0))
      # step 6
      install_allowance_cents = round_half_up(net_cents * INSTALL_ALLOWANCE_FRACTION, 0)
      total_cents             = net_cents + freight_cents + install_allowance_cents
    input_set: "Every StorePlanLine whose store_plan_id == the plan in the path, in created_at ASC order. The per-line extended prices are summed AFTER each line has been rounded (round-per-line-then-sum), never re-derived from unrounded base terms."
    constants:
      VOLUME_TIER_BPS: { under_5000000: 0, under_10000000: 300, under_20000000: 550, at_or_above_20000000: 800 }
      FREIGHT_PER_LINEAR_FT_CENTS: 9500
      FREIGHT_CAP_FRACTION: 0.04
      INSTALL_ALLOWANCE_FRACTION: 0.025
    precision: "Integer cents, round_half_up at each of steps 3, 5 and 6. The tier boundaries are strict `<`, so a subtotal of exactly 5000000 lands in the 300 bps tier."

  - name: warranty_reserve_balance
    trigger: "POST /store-plans/{id}/release (StorePlan NOT_RELEASED -> IN_PRODUCTION), POST /warranty-claims/{id}/resolve (PARTS_RESERVED -> RESOLVED), and POST /warranty-claims/{id}/deny (OPEN|PARTS_RESERVED -> DENIED)"
    algorithm: aggregation
    formula: |
      warranty_reserve_accrual_cents =
        sum over WorkOrder rows of this plan whose status != SCRAPPED of
          round_half_up(WorkOrder.unit_price_cents * WARRANTY_ACCRUAL_BPS / 10000, 0)
      warranty_reserve_incurred_cents =
        sum over WarrantyClaim rows whose WorkOrder.store_plan_id == this plan of
            WarrantyClaim.total_cost_cents                              if claim.status == RESOLVED
          + round_half_up(WarrantyClaim.estimated_cost_cents * OPEN_CLAIM_FACTOR, 0)
                                                                        if claim.status IN {OPEN, PARTS_RESERVED}
          + 0                                                           if claim.status == DENIED
    input_set: "Accrual: WorkOrder rows with store_plan_id == this plan and status != SCRAPPED, summed in created_at ASC order. Incurred: WarrantyClaim rows reachable through WarrantyClaim.work_order_id -> WorkOrder.store_plan_id == this plan, summed in created_at ASC order; DENIED claims contribute 0."
    constants:
      WARRANTY_ACCRUAL_BPS: 275
      OPEN_CLAIM_FACTOR: 0.60
    precision: "Integer cents, round_half_up per work order and per claim before summing (round-per-row-then-sum)."
    variants:
      - name: open_claim_estimate
        when: "Claim status is OPEN or PARTS_RESERVED."
        difference: "Recognises OPEN_CLAIM_FACTOR (60%) of the field estimate, because the repair scope is not yet fixed."
      - name: resolved_actual
        when: "Claim status is RESOLVED."
        difference: "Recognises the full parts_cost_cents + labor_cost_cents actual, so the incurred balance moves when a claim resolves even if the estimate was identical."

  - name: install_booking_day_count
    trigger: "POST /install-bookings (booking creation)"
    algorithm: interval_merge
    formula: |
      # Half-open interval: a booking [start_date, end_date) occupies start_date and every day
      # up to but NOT including end_date.
      day_count = number of whole UTC days d with start_date <= d < end_date
      occupied_days(booking) = { start_date, start_date + 1 day, ..., end_date - 1 day }
    input_set: "The booking being created only."
    constants: {}
    precision: "Whole days. end_date must be strictly after start_date, so day_count >= 1."

  - name: install_crew_daily_load
    trigger: "POST /install-bookings (capacity validation, priority 32)"
    algorithm: aggregation
    formula: |
      for each day d in occupied_days(candidate_booking):
        load(d) = candidate_booking.cases_committed
                  + sum(b.cases_committed for every InstallBooking b
                        where b.install_crew_id == candidate.install_crew_id
                          and b.status == BOOKED
                          and d in occupied_days(b))
      reject when any load(d) > InstallCrew.daily_case_capacity
      committed_case_days = sum(b.cases_committed * b.day_count for every InstallBooking b
                                where b.install_crew_id == crew.id and b.status == BOOKED)
    input_set: "InstallBooking rows with install_crew_id == the requested crew and status == BOOKED. Rows with status RELEASED or COMPLETED are excluded and free their days."
    constants: {}
    precision: "Integer cases per day. Aggregate capacity, not single-occupancy: two bookings may share a day as long as the per-day sum stays at or below daily_case_capacity."

  - name: chamber_occupation_interval
    trigger: "POST /energy-tests (chamber conflict validation, priority 24)"
    algorithm: interval_merge
    formula: |
      # Single occupancy with a SYMMETRIC turnaround buffer on both sides of every existing test.
      blocked(existing) = [existing.window_start - turnaround_hours,
                           existing.window_end   + turnaround_hours)
      reject when [candidate.window_start, candidate.window_end) overlaps blocked(existing)
                  for any EnergyTest existing on the same chamber with status IN {SCHEDULED, RUNNING}
      # Touching intervals do not overlap: candidate.window_start == blocked.end is accepted.
      reject when [candidate.window_start, candidate.window_end)
                  intersects [TestChamber.closed_window_start, TestChamber.closed_window_end]
      # The closure is a CLOSED interval - a candidate starting exactly at closed_window_end is rejected.
    input_set: "EnergyTest rows with test_chamber_id == the requested chamber and status IN {SCHEDULED, RUNNING}. COMPLETED_PASS, COMPLETED_FAIL and INVALIDATED tests release the chamber and are excluded."
    constants: {}
    precision: "Instant arithmetic in whole hours. Test windows are half-open; the chamber closure window is closed on both ends."

  - name: warranty_coverage_window
    trigger: "POST /warranty-claims (claim creation)"
    algorithm: threshold
    formula: |
      warranty_term_months = WARRANTY_TERM_MONTHS[claim_type]
      coverage_end         = WorkOrder.warranty_start_date + warranty_term_months months
      in_warranty          = (WorkOrder.warranty_start_date IS NOT NULL)
                             AND (reported_date >= WorkOrder.warranty_start_date)
                             AND (reported_date <= coverage_end)
    input_set: "The WorkOrder named in the request body; its warranty_start_date is stamped only by the shipment handoff transition."
    constants:
      WARRANTY_TERM_MONTHS: { COMPRESSOR_FAILURE: 60, DOOR_GASKET: 12, CONTROLLER: 12, GLASS_FOG: 12 }
    precision: "Whole months added to the start instant. The end boundary is inclusive: a report exactly at coverage_end is in warranty."

  - name: shipment_manifest_totals
    trigger: "POST /shipments (shipment creation)"
    algorithm: aggregation
    formula: |
      loaded = WorkOrder rows where store_plan_id == Shipment.store_plan_id and status == COMPLETE,
               ordered by created_at ASC
      unit_count   = count(loaded)
      linear_feet  = sum(StorePlanLine.length_ft of each loaded work order's store_plan_line_id)
      reject with ERR_NO_SHIPPABLE_UNITS when unit_count == 0
    input_set: "WorkOrder rows of the plan whose status is exactly COMPLETE. QUEUED, in-process, HELD, SHIPPED and SCRAPPED units are excluded, so a plan with zero COMPLETE units yields the empty set."
    constants: {}
    precision: "Integer counts and whole feet."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "When X-User-Role is InstallContractor, X-User-ID equals the install_crew_id of at least one InstallBooking of the shipment being handed off, in any status (BOOKED, RELEASED or COMPLETED)"
    error_id: ERR_CREW_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /shipments/{id}/handoff"
  - priority: 4
    category: existence
    check: "Request body and query parameters satisfy the endpoint's input schema: required fields present, enum members recognised, numeric fields within their declared constraints, limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Every id in the path resolves to an existing row, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND (ERR_CASE_MODEL_NOT_FOUND, ERR_ENERGY_TEST_NOT_FOUND, ERR_COMPLIANCE_LABEL_NOT_FOUND, ERR_STORE_PLAN_NOT_FOUND, ERR_STORE_PLAN_LINE_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_INSTALL_BOOKING_NOT_FOUND, ERR_WARRANTY_CLAIM_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_<ENTITY>_NOT_FOUND (ERR_REFRIGERANT_NOT_FOUND, ERR_ENERGY_STANDARD_NOT_FOUND, ERR_TEST_CHAMBER_NOT_FOUND, ERR_CASE_MODEL_NOT_FOUND, ERR_ENERGY_TEST_NOT_FOUND, ERR_STORE_PLAN_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_INSTALL_CREW_NOT_FOUND, ERR_PART_INVENTORY_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints whose input contains a foreign key"
  - priority: 7
    category: state
    check: "The target row's current state admits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /case-models/{id}/airflow-model, POST /case-models/{id}/submit-for-test, POST /case-models/{id}/engineering-change, POST /energy-tests/{id}/start, POST /energy-tests/{id}/complete, POST /compliance-labels, POST /compliance-labels/{id}/revoke, POST /store-plans/{id}/lines, POST /store-plans/{id}/price, POST /store-plans/{id}/approve, POST /store-plans/{id}/release, POST /work-orders/{id}/advance, POST /work-orders/{id}/qa-result, POST /shipments/{id}/advance, POST /shipments/{id}/cancel, POST /shipments/{id}/handoff, POST /install-bookings/{id}/release, POST /warranty-claims/{id}/reserve-parts, POST /warranty-claims/{id}/resolve, POST /warranty-claims/{id}/deny"
  - priority: 8
    category: state
    check: "expected_case_model_version equals CaseModel.version / expected_store_plan_version equals StorePlan.version (§1.2.1)"
    error_id: "ERR_STALE_CASE_MODEL_VERSION on POST /energy-tests, ERR_STALE_STORE_PLAN_VERSION on POST /shipments"
    http_status: 412
    applies_to: "POST /energy-tests, POST /shipments"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: the ComplianceOfficer issuing a label is not the DesignEngineer recorded in CaseModel.submitted_by_user_id; the SalesEngineer approving a plan is not the one recorded in StorePlan.priced_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /compliance-labels, POST /store-plans/{id}/approve"
  - priority: 10
    category: business_safety
    check: "CaseModel.system_type is a member of Refrigerant.allowed_system_types"
    error_id: ERR_REFRIGERANT_SYSTEM_TYPE_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /case-models/{id}/airflow-model, POST /case-models/{id}/engineering-change"
  - priority: 11
    category: business_safety
    check: "CaseModel.installed_charge_grams (nameplate charge plus line-set charge) is at or below Refrigerant.max_charge_grams"
    error_id: ERR_REFRIGERANT_CHARGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /case-models/{id}/submit-for-test, POST /store-plans/{id}/lines"
  - priority: 12
    category: business_safety
    check: "Refrigerant.gwp_100yr of the model is at or below EnergyStandard.max_gwp of the standard the test was run against"
    error_id: ERR_GWP_EXCEEDS_STANDARD
    http_status: 422
    applies_to: "POST /compliance-labels"
  - priority: 13
    category: business_referential
    check: "EnergyStandard.temperature_class equals CaseModel.temperature_class, EnergyStandard.system_type_scope is ANY or equals CaseModel.system_type, and EnergyTest.window_start is at or after EnergyStandard.effective_date"
    error_id: ERR_STANDARD_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /energy-tests"
  - priority: 14
    category: business_referential
    check: "EnergyTest.pinned_design_revision equals the live CaseModel.design_revision"
    error_id: ERR_CASE_MODEL_REVISION_STALE
    http_status: 409
    applies_to: "POST /energy-tests/{id}/start, POST /energy-tests/{id}/complete, POST /compliance-labels"
  - priority: 15
    category: business_referential
    check: "The CaseModel referenced by a new line, and by every line of a plan being released, has status == CERTIFIED"
    error_id: ERR_MODEL_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /store-plans/{id}/lines, POST /store-plans/{id}/price, POST /store-plans/{id}/release"
  - priority: 16
    category: business_constraint
    check: "StorePlan.held_line_count == 0 and no line of the plan has compliance_hold == true"
    error_id: ERR_PLAN_ON_COMPLIANCE_HOLD
    http_status: 409
    applies_to: "POST /store-plans/{id}/price, POST /store-plans/{id}/approve, POST /store-plans/{id}/release, POST /shipments"
  - priority: 17
    category: business_constraint
    check: "glass_door_count == 0 when door_type == OPEN, and glass_door_count >= 1 when door_type == GLASS_DOOR"
    error_id: ERR_DOOR_CONFIG_INVALID
    http_status: 422
    applies_to: "POST /case-models, POST /case-models/{id}/airflow-model"
  - priority: 18
    category: business_constraint
    check: "line_set_length_ft == 0 when system_type == SELF_CONTAINED, and line_set_length_ft >= 1 when system_type == REMOTE"
    error_id: ERR_LINE_SET_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /case-models, POST /case-models/{id}/engineering-change"
  - priority: 19
    category: business_constraint
    check: "StorePlanLine.length_ft equals CaseModel.nominal_length_ft of the ordered model"
    error_id: ERR_LENGTH_NOT_OFFERED
    http_status: 422
    applies_to: "POST /store-plans/{id}/lines"
  - priority: 20
    category: business_constraint
    check: "GLASS_DOOR_UPGRADE may only be ordered on a CaseModel whose door_type == GLASS_DOOR; NIGHT_CURTAIN may only be ordered on a CaseModel whose door_type == OPEN"
    error_id: ERR_OPTION_NOT_COMPATIBLE
    http_status: 422
    applies_to: "POST /store-plans/{id}/lines"
  - priority: 21
    category: business_constraint
    check: "Uniqueness of Refrigerant.refrigerant_code, EnergyStandard.standard_code, TestChamber.chamber_code, CaseModel.model_code, ComplianceLabel.label_code, InstallCrew.crew_code, StorePlan.store_number per banner_name, PartInventory.part_number per region_code"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /refrigerants, POST /energy-standards, POST /test-chambers, POST /case-models, POST /compliance-labels, POST /install-crews, POST /store-plans, POST /part-inventories"
  - priority: 22
    category: business_constraint
    check: "CaseModel.temperature_class is a member of TestChamber.supported_temperature_classes"
    error_id: ERR_CHAMBER_CLASS_UNSUPPORTED
    http_status: 422
    applies_to: "POST /energy-tests"
  - priority: 23
    category: business_constraint
    check: "CaseModel.tda_sqft is at or below TestChamber.max_tda_sqft"
    error_id: ERR_CHAMBER_TDA_EXCEEDED
    http_status: 422
    applies_to: "POST /energy-tests"
  - priority: 24
    category: business_temporal
    check: "The requested half-open window does not overlap any SCHEDULED or RUNNING test's window widened by turnaround_hours on both sides, and does not intersect the chamber's closed maintenance interval (chamber_occupation_interval)"
    error_id: ERR_CHAMBER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /energy-tests"
  - priority: 25
    category: business_constraint
    check: "WorkOrder.rework_count < 2 when result == FAIL"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /work-orders/{id}/qa-result"
  - priority: 26
    category: business_constraint
    check: "WorkOrder.rework_count == 2 when result == SCRAP"
    error_id: ERR_SCRAP_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /work-orders/{id}/qa-result"
  - priority: 27
    category: business_constraint
    check: "The plan has at least one WorkOrder with status == COMPLETE to load (shipment_manifest_totals yields unit_count >= 1)"
    error_id: ERR_NO_SHIPPABLE_UNITS
    http_status: 422
    applies_to: "POST /shipments"
  - priority: 28
    category: business_temporal
    check: "Shipment.delivery_date falls inside [StorePlan.remodel_window_start, StorePlan.remodel_window_end] and is at or after ship_date"
    error_id: ERR_DELIVERY_OUTSIDE_REMODEL_WINDOW
    http_status: 422
    applies_to: "POST /shipments"
  - priority: 29
    category: business_temporal
    check: "end_date is strictly after start_date on an install booking; window_end is strictly after window_start on an energy test"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /install-bookings, POST /energy-tests"
  - priority: 30
    category: business_temporal
    check: "InstallBooking.start_date is at or after Shipment.delivery_date and InstallBooking.end_date is at or before StorePlan.remodel_window_end plus one day (the exclusive end may equal the day after the window's last day)"
    error_id: ERR_BOOKING_OUTSIDE_REMODEL_WINDOW
    http_status: 422
    applies_to: "POST /install-bookings"
  - priority: 31
    category: business_referential
    check: "StorePlan.region_code of the shipment's plan is a member of InstallCrew.service_region_codes"
    error_id: ERR_CREW_REGION_NOT_SERVED
    http_status: 422
    applies_to: "POST /install-bookings"
  - priority: 32
    category: business_constraint
    check: "For every day in the booking's half-open interval, the summed cases_committed of the crew's BOOKED bookings plus the candidate does not exceed InstallCrew.daily_case_capacity (install_crew_daily_load)"
    error_id: ERR_CREW_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /install-bookings"
  - priority: 33
    category: business_constraint
    check: "An InstallBooking with status == BOOKED exists for the shipment being handed off"
    error_id: ERR_INSTALL_BOOKING_NOT_READY
    http_status: 409
    applies_to: "POST /shipments/{id}/handoff"
  - priority: 34
    category: business_temporal
    check: "The current logical clock instant falls inside [InstallBooking.start_date, InstallBooking.end_date)"
    error_id: ERR_HANDOFF_OUTSIDE_BOOKING_WINDOW
    http_status: 422
    applies_to: "POST /shipments/{id}/handoff"
  - priority: 35
    category: business_referential
    check: "PartInventory.case_model_id equals the WorkOrder's case_model_id"
    error_id: ERR_PART_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /warranty-claims"
  - priority: 36
    category: business_referential
    check: "PartInventory.region_code equals the StorePlan.region_code of the claim's work order"
    error_id: ERR_PART_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /warranty-claims"
  - priority: 37
    category: business_temporal
    check: "WarrantyClaim.in_warranty == true (warranty_coverage_window)"
    error_id: ERR_CLAIM_OUT_OF_WARRANTY
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/reserve-parts"
  - priority: 38
    category: business_constraint
    check: "PartInventory.available_qty >= WarrantyClaim.requested_qty"
    error_id: ERR_PARTS_UNAVAILABLE
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/reserve-parts"
  - priority: 39
    category: business_fiscal
    check: "StorePlan.total_cents is at or below StorePlan.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /store-plans/{id}/approve"

endpoints:
  # ---------- configuration ----------
  - method: POST
    path: "/refrigerants"
    description: "Register a refrigerant blend with its GWP, safety class and per-case charge ceiling."
    roles: [PlatformAdmin]
    code: 201
    input: [refrigerant_code, trade_name, gwp_100yr, safety_class, max_charge_grams, allowed_system_types]
    output: Refrigerant
    side_effects: []

  - method: POST
    path: "/energy-standards"
    description: "Register an energy efficiency standard with its daily-energy limit coefficients and GWP ceiling."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [standard_code, effective_date, max_gwp, limit_coefficient_a, limit_constant_b, temperature_class, system_type_scope]
    output: EnergyStandard
    side_effects: []

  - method: POST
    path: "/test-chambers"
    description: "Register a psychrometric test chamber, its supported temperature classes, turnaround hours and optional maintenance closure."
    roles: [PlatformAdmin]
    code: 201
    input: [chamber_code, name, supported_temperature_classes, turnaround_hours, max_tda_sqft, "closed_window_start?", "closed_window_end?"]
    output: TestChamber
    side_effects: []

  - method: POST
    path: "/install-crews"
    description: "Register an installation contractor crew with its service regions and daily case capacity."
    roles: [PlatformAdmin, LogisticsCoordinator]
    code: 201
    input: [crew_code, contractor_name, service_region_codes, daily_case_capacity]
    output: InstallCrew
    side_effects: ["sets committed_case_days to 0"]

  - method: POST
    path: "/part-inventories"
    description: "Stock a service part at a regional depot for one case model."
    roles: [PlatformAdmin, ServiceManager]
    code: 201
    input: [part_number, description, case_model_id, region_code, on_hand_qty, unit_cost_cents, min_stock_qty]
    output: PartInventory
    side_effects: ["sets reserved_qty to 0", "computes available_qty and below_min"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every warranty window, remodel window and handoff window check reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["moves the logical clock used by warranty_coverage_window and the handoff window check"]

  # ---------- case design ----------
  - method: POST
    path: "/case-models"
    description: "Create a case model design in DRAFT for one application and temperature class."
    roles: [DesignEngineer]
    code: 201
    input: [model_code, application, temperature_class, system_type, refrigerant_id, "predecessor_model_id?", nominal_length_ft, tda_sqft, charge_grams, line_set_length_ft, door_type, "glass_door_count?", curtain_layers, discharge_velocity_mps, case_air_temp_c, ambient_dew_point_c, lighting_w_per_ft, fan_w_per_ft, defrost_cycles_per_day]
    output: CaseModel
    side_effects: ["sets status to DRAFT and design_revision to 1"]

  - method: POST
    path: "/case-models/{id}/airflow-model"
    description: "Run the airflow and charge models on a DRAFT case model, moving it to MODELED."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: CaseModel
    side_effects:
      - "CaseModel DRAFT -> MODELED"
      - "recompute airflow_load_model"
      - "recompute refrigerant_charge_basis"
      - "increments CaseModel.version by 1"

  - method: POST
    path: "/case-models/{id}/submit-for-test"
    description: "Submit a MODELED case model to the energy lab; records the submitting engineer for segregation of duties."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: CaseModel
    side_effects:
      - "CaseModel MODELED -> SUBMITTED_FOR_TEST"
      - "sets submitted_by_user_id to the X-User-ID header"
      - "increments CaseModel.version by 1"

  - method: POST
    path: "/case-models/{id}/engineering-change"
    description: "Open an engineering change on a case model — typically a transition to a lower-GWP refrigerant — returning it to DRAFT at the next design revision."
    roles: [DesignEngineer]
    code: 200
    input: [refrigerant_id, charge_grams, line_set_length_ft, change_note]
    output: CaseModel
    side_effects:
      - "CaseModel {MODELED, SUBMITTED_FOR_TEST, TESTED_PASS, TESTED_FAIL, CERTIFIED, DECERTIFIED} -> DRAFT with design_revision + 1 and every computed airflow/charge field cleared"
      - "cascade hop 2: ComplianceLabel ISSUED -> SUPERSEDED; EnergyTest RUNNING -> INVALIDATED (SCHEDULED tests are left SCHEDULED and later fail to start with ERR_CASE_MODEL_REVISION_STALE)"
      - "cascade hop 3: StorePlanLine.compliance_hold = true; StorePlan.held_line_count recomputed"
      - "cascade hop 4: StorePlan commercial APPROVED -> HOLD_PENDING_RECERT"
      - "cascade hop 5: WorkOrder QUEUED -> HELD"
      - "increments CaseModel.version by 1"

  # ---------- energy testing ----------
  - method: POST
    path: "/energy-tests"
    description: "Schedule an energy consumption test, pinning the model's design revision, TDA, defrost cycles and the standard's daily-energy limit."
    roles: [TestLabTechnician]
    code: 201
    input: [case_model_id, test_chamber_id, energy_standard_id, window_start, window_end, test_ambient_c, store_ambient_c, expected_case_model_version]
    output: EnergyTest
    side_effects:
      - "pins pinned_design_revision, pinned_tda_sqft and pinned_defrost_cycles_per_day from CaseModel"
      - "recompute energy_limit_daily_kwh: sets limit_daily_kwh"
      - "evaluates chamber_occupation_interval against the chamber's SCHEDULED and RUNNING tests"
      - "increments CaseModel.version by 1"

  - method: POST
    path: "/energy-tests/{id}/start"
    description: "Start a scheduled test; rejected when the case model has revised since the test was pinned."
    roles: [TestLabTechnician]
    code: 200
    input: []
    output: EnergyTest
    side_effects: ["EnergyTest SCHEDULED -> RUNNING", "increments EnergyTest.version by 1"]

  - method: POST
    path: "/energy-tests/{id}/complete"
    description: "Record the metered 24-hour consumption and observed defrost cycles; computes both index variants and passes or fails the model."
    roles: [TestLabTechnician]
    code: 200
    input: [measured_kwh_24h, measured_defrost_cycles]
    output: EnergyTest
    side_effects:
      - "EnergyTest RUNNING -> COMPLETED_PASS when measured_kwh_24h <= limit_daily_kwh, otherwise -> COMPLETED_FAIL"
      - "recompute energy_use_index (lab variant): sets lab_rated_index"
      - "recompute energy_use_index (field variant): sets field_projected_daily_kwh, field_projected_index, field_exceedance"
      - "cross-entity: CaseModel SUBMITTED_FOR_TEST -> TESTED_PASS or -> TESTED_FAIL"
      - "increments EnergyTest.version by 1"

  # ---------- compliance labelling ----------
  - method: POST
    path: "/compliance-labels"
    description: "Issue an energy label from a passing test, certifying the case model. The issuing ComplianceOfficer may not be the engineer who submitted the model."
    roles: [ComplianceOfficer]
    code: 201
    input: [case_model_id, energy_test_id, label_code]
    output: ComplianceLabel
    side_effects:
      - "pins pinned_design_revision, pinned_lab_rated_index and pinned_standard_code"
      - "sets issued_by_user_id to the X-User-ID header"
      - "cross-entity: CaseModel TESTED_PASS -> CERTIFIED"
      - "clears compliance_hold on every StorePlanLine of this model and recomputes StorePlan.held_line_count"
      - "StorePlan commercial HOLD_PENDING_RECERT -> APPROVED and WorkOrder HELD -> QUEUED when held_line_count reaches 0"
      - "increments CaseModel.version by 1"

  - method: POST
    path: "/compliance-labels/{id}/revoke"
    description: "Revoke an issued label, decertifying the case model and holding every affected store plan line."
    roles: [ComplianceOfficer]
    code: 200
    input: [revocation_reason]
    output: ComplianceLabel
    side_effects:
      - "ComplianceLabel ISSUED -> REVOKED"
      - "cross-entity: CaseModel CERTIFIED -> DECERTIFIED"
      - "sets compliance_hold = true on affected StorePlanLine rows and recomputes StorePlan.held_line_count"
      - "StorePlan commercial APPROVED -> HOLD_PENDING_RECERT"
      - "increments ComplianceLabel.version by 1"

  # ---------- store plans ----------
  - method: POST
    path: "/store-plans"
    description: "Open a store plan for one banner store and its remodel window."
    roles: [SalesEngineer]
    code: 201
    input: [banner_name, store_number, region_code, remodel_window_start, remodel_window_end, credit_limit_cents]
    output: StorePlan
    side_effects: ["sets commercial_status DRAFT and production_status NOT_RELEASED"]

  - method: POST
    path: "/store-plans/{id}/lines"
    description: "Add a configured case line — length, end caps and merchandising options — to a store plan."
    roles: [SalesEngineer]
    code: 201
    input: [case_model_id, length_ft, quantity, "end_cap?", "merchandising_options?"]
    output: StorePlanLine
    side_effects:
      - "recomputes StorePlan.line_count and StorePlan.unit_count"
      - "StorePlan commercial PRICED -> DRAFT, clearing every pricing field and priced_by_user_id"
      - "increments StorePlan.version by 1"

  - method: POST
    path: "/store-plans/{id}/price"
    description: "Price every line and roll up the plan commercial total in the pinned six-step order."
    roles: [SalesEngineer]
    code: 200
    input: []
    output: StorePlan
    side_effects:
      - "StorePlan commercial DRAFT -> PRICED"
      - "recompute case_unit_price_cents per line"
      - "recompute store_plan_commercial_total"
      - "sets priced_by_user_id to the X-User-ID header"
      - "increments StorePlan.version by 1"

  - method: POST
    path: "/store-plans/{id}/approve"
    description: "Approve a priced plan against the banner credit limit. The approver may not be the engineer who priced it."
    roles: [SalesEngineer]
    code: 200
    input: []
    output: StorePlan
    side_effects:
      - "StorePlan commercial PRICED -> APPROVED"
      - "sets approved_by_user_id to the X-User-ID header"
      - "increments StorePlan.version by 1"

  - method: POST
    path: "/store-plans/{id}/release"
    description: "Release an approved plan to the plant, creating one work order per ordered case."
    roles: [PlantSupervisor]
    code: 200
    input: []
    output: StorePlan
    side_effects:
      - "StorePlan production NOT_RELEASED -> IN_PRODUCTION"
      - "creates one QUEUED WorkOrder per unit, ordered by StorePlanLine.created_at ASC then unit_sequence ASC, copying unit_price_cents and stamping serial_number"
      - "recompute warranty_reserve_balance: sets warranty_reserve_accrual_cents"
      - "increments StorePlan.version by 1"

  # ---------- fabrication ----------
  - method: POST
    path: "/work-orders/{id}/advance"
    description: "Advance one case through sheet metal, foam injection, glass door assembly and final QA. OPEN cases skip DOOR_ASSEMBLY."
    roles: [PlantSupervisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder QUEUED -> SHEET_METAL -> FOAM_INJECTION -> (DOOR_ASSEMBLY when door_type == GLASS_DOOR) -> FINAL_QA, and REWORK -> SHEET_METAL"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: "/work-orders/{id}/qa-result"
    description: "Record the final QA outcome: PASS completes the unit, FAIL returns it to rework, SCRAP retires a unit that has exhausted its rework allowance."
    roles: [PlantSupervisor]
    code: 200
    input: [result, "defect_note?"]
    output: WorkOrder
    side_effects:
      - "WorkOrder FINAL_QA -> COMPLETE | REWORK (rework_count + 1) | SCRAPPED"
      - "recomputes StorePlan.units_completed_count"
      - "increments WorkOrder.version by 1"

  # ---------- shipment and installation ----------
  - method: POST
    path: "/shipments"
    description: "Create a shipment that loads every COMPLETE unit of the plan and books freight into the store remodel window."
    roles: [LogisticsCoordinator]
    code: 201
    input: [store_plan_id, ship_date, delivery_date, carrier_code, expected_store_plan_version]
    output: Shipment
    side_effects:
      - "recompute shipment_manifest_totals: sets unit_count and linear_feet"
      - "WorkOrder COMPLETE -> SHIPPED with shipment_id set"
      - "recomputes StorePlan.units_shipped_count and drives StorePlan production IN_PRODUCTION -> COMPLETE when units_shipped_count == unit_count"
      - "increments StorePlan.version by 1"

  - method: POST
    path: "/shipments/{id}/advance"
    description: "Advance a shipment through LOADED, IN_TRANSIT and DELIVERED."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["Shipment STAGED -> LOADED -> IN_TRANSIT -> DELIVERED", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/cancel"
    description: "Cancel a shipment that has not been handed off, reverting its units and releasing the install booking."
    roles: [LogisticsCoordinator]
    code: 200
    input: [cancel_reason]
    output: Shipment
    side_effects:
      - "cascade hop 1: Shipment {STAGED, LOADED, IN_TRANSIT} -> CANCELLED"
      - "cascade hop 2: WorkOrder SHIPPED -> COMPLETE with shipment_id cleared"
      - "cascade hop 3: StorePlan production COMPLETE -> IN_PRODUCTION"
      - "cascade hop 4: InstallBooking BOOKED -> RELEASED"
      - "cascade hop 5: InstallCrew.committed_case_days decreased by cases_committed * day_count"
      - "increments Shipment.version by 1"

  - method: POST
    path: "/shipments/{id}/handoff"
    description: "Install contractor accepts a delivered shipment on site, starting every unit's warranty clock."
    roles: [InstallContractor]
    code: 200
    input: [received_by_name]
    output: Shipment
    side_effects:
      - "Shipment DELIVERED -> HANDED_OFF, sets handoff_at to the logical clock instant and stores received_by_name"
      - "InstallBooking BOOKED -> COMPLETED and decreases InstallCrew.committed_case_days by cases_committed * day_count"
      - "sets WorkOrder.warranty_start_date on every unit of the shipment"
      - "increments Shipment.version by 1"

  - method: POST
    path: "/install-bookings"
    description: "Reserve an installation crew for a half-open day interval against a shipment."
    roles: [LogisticsCoordinator]
    code: 201
    input: [shipment_id, install_crew_id, start_date, end_date, cases_committed]
    output: InstallBooking
    side_effects:
      - "recompute install_booking_day_count: sets day_count"
      - "evaluates install_crew_daily_load for every day in the interval"
      - "increases InstallCrew.committed_case_days by cases_committed * day_count"

  - method: POST
    path: "/install-bookings/{id}/release"
    description: "Release a crew reservation, returning its committed case-days to the crew."
    roles: [LogisticsCoordinator]
    code: 200
    input: [release_reason]
    output: InstallBooking
    side_effects:
      - "InstallBooking BOOKED -> RELEASED"
      - "decreases InstallCrew.committed_case_days by cases_committed * day_count"
      - "increments InstallBooking.version by 1"

  # ---------- warranty and field service ----------
  - method: POST
    path: "/warranty-claims"
    description: "Open a warranty claim against a delivered unit, selecting the term from the failure category."
    roles: [ServiceManager]
    code: 201
    input: [work_order_id, part_inventory_id, install_crew_id, claim_type, reported_date, requested_qty, estimated_cost_cents]
    output: WarrantyClaim
    side_effects:
      - "recompute warranty_coverage_window: sets warranty_term_months and in_warranty"
      - "recompute warranty_reserve_balance: updates StorePlan.warranty_reserve_incurred_cents with the open-claim estimate"

  - method: POST
    path: "/warranty-claims/{id}/reserve-parts"
    description: "Reserve depot stock for an in-warranty claim."
    roles: [ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "WarrantyClaim OPEN -> PARTS_RESERVED"
      - "sets parts_cost_cents from PartInventory.unit_cost_cents * requested_qty"
      - "increases PartInventory.reserved_qty and recomputes available_qty and below_min"
      - "increments WarrantyClaim.version by 1"

  - method: POST
    path: "/warranty-claims/{id}/resolve"
    description: "Close a claim after the field repair, consuming the reserved parts and booking the actual cost."
    roles: [ServiceManager]
    code: 200
    input: [labor_cost_cents]
    output: WarrantyClaim
    side_effects:
      - "WarrantyClaim PARTS_RESERVED -> RESOLVED"
      - "sets total_cost_cents to parts_cost_cents + labor_cost_cents"
      - "decreases PartInventory.on_hand_qty and reserved_qty by requested_qty and recomputes available_qty and below_min"
      - "recompute warranty_reserve_balance: switches this claim from the open-claim estimate to the resolved actual"
      - "increments WarrantyClaim.version by 1"

  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Deny a claim, releasing any reservation without consuming stock."
    roles: [ServiceManager]
    code: 200
    input: [denial_reason]
    output: WarrantyClaim
    side_effects:
      - "WarrantyClaim {OPEN, PARTS_RESERVED} -> DENIED"
      - "compensation: decreases PartInventory.reserved_qty by requested_qty leaving on_hand_qty unchanged, and clears parts_cost_cents"
      - "recompute warranty_reserve_balance: the denied claim contributes 0"
      - "increments WarrantyClaim.version by 1"

