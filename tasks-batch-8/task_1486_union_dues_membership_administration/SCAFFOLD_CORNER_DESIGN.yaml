  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: create_member_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role are rejected at priority 1 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - call: "POST /api/members"
              payload: { local_id: "00000000-0000-0000-0000-000000000000", classification_id: "00000000-0000-0000-0000-000000000000", full_name: "No Header", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — simulated by omitting the headers in this call"

      - name: classification_from_wrong_local_rejected
        claim_type: cross_entity_validation
        grounds: [entities.Member.fields.classification_id, "errors[ERR_CLASSIFICATION_NOT_FOUND]", "validations[priority=7]"]
        distinguishing_aspect: "A classification that exists but belongs to a DIFFERENT local is rejected as not-found-in-scope (422)."
        test_recipe:
          setup: ["Two PCT locals L1, L2; classification C2 defined on L2 only"]
          setup_api_calls:
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l1: "$.data.id" }
            - call: "POST /api/locals"
              payload: { name: "Local 101", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l2: "$.data.id" }
            - call: "POST /api/locals/${l2}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000 }
              as: LocalAdmin
              captures: { c2: "$.data.id" }
          trigger:
            - call: "POST /api/members"
              payload: { local_id: "${l1}", classification_id: "${c2}", full_name: "Wrong Walt", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_CLASSIFICATION_NOT_FOUND with http 422 (classification scoped to another local)"

      - name: post_reconciled_remittance_with_prior_period_unposted
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_PRIOR_PERIOD_UNPOSTED]", state_machines.CheckoffRemittance.RECONCILED_to_POSTED]
        distinguishing_aspect: "Single-failure isolation of the temporal rule: R2 is RECONCILED (state guard passes) yet posting is rejected because the same employer's 2026-08 remittance is not POSTED."
        test_recipe:
          setup: ["PCT local; employer E; R1 (2026-08, remitted 0, RECEIVED); R2 (2026-09, remitted 0, reconciled clean -> RECONCILED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 0 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { r1: "$.data.id" }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-09", remitted_cents: 0 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { r2: "$.data.id" }
            - { call: "POST /api/remittances/${r2}/reconcile", payload: {}, as: SecretaryTreasurer, as_user_id: st_1 }
          trigger:
            - call: "POST /api/remittances/${r2}/post"
              payload: {}
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_PRIOR_PERIOD_UNPOSTED (409) — chronological posting order per employer"

      - name: withdraw_with_arrears_rejected
        claim_type: violation_to_error
        grounds: [state_machines.Member.ACTIVE_to_WITHDRAWN, "errors[ERR_ARREARS_OUTSTANDING]", "validations[priority=10]"]
        distinguishing_aspect: "Withdrawal requires arrears_cents == 0; a member owing 5000 draws ERR_ARREARS_OUTSTANDING."
        test_recipe:
          setup: ["FLAT local; member M with one PROVISIONAL assessment (run 2026-08, charge 5000, arrears 5000)"]
          setup_api_calls:
