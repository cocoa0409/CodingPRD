# =============================================================================
# §1.9 Scaffold Corner Design — Fiberglass Insulation Manufacturing (task 2678)
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Sections and claim_type values are
# taken ONLY from references/claim-extraction-guide.md. Corners already carried
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear as excluded_because: stubs
# with no test_recipe.
#
# Shared fixture vocabulary reused across instances (always rebuilt from an
# empty DB inside each instance's own setup_api_calls):
#   PROGRAM RCERT-PS : PER_SPECIMEN, r_value_tolerance 0.30, min_specimen_count 3,
#                      max_concurrent_lab_tests 2, retest_limit 2, derate_allowed true
#   PROGRAM RCERT-LM : LOT_MEAN, tolerance 0.30, min_specimen_count 3,
#                      max_concurrent_lab_tests 1, retest_limit 2, derate_allowed false
#   PLANT NWK        : 4 oven zones, 120 ft oven, 2 forming lines,
#                      max_cullet_fraction 0.30, cullet_restrict_fraction 0.28,
#                      max_width_change_in 8.0, formaldehyde_allowance_kg 0.200,
#                      voc_allowance_kg 12.0
#   BINDER BF-FREE-1 : formaldehyde-free, 0 ppm, 3.2 g VOC/kg, 420 F, 150 s
#   BINDER BF-PHEN-1 : phenolic, 250 ppm, 4.1 g VOC/kg, 420 F, 150 s
#   SKU PL-A "R13-15-UF" : BATT 0.80 pcf UNFACED 15 in, R13.0, bag 88.0 sqft,
#                      bale 21.0 ft3 / 12.5 kg, compression_ratio 6.0, 34.5 kg/min
#   SKU PL-B "R19-23-KR" : BATT 1.20 pcf KRAFT 23 in, R19.0, bag 49.0 sqft,
#                      bale 25.5 ft3 / 15.0 kg, compression_ratio 5.0, 40.0 kg/min
#   SKU PL-C "R13-16-UF-LM" : same geometry as PL-A but width 16 in; registered on
#                      RCERT-LM whenever a lot-mean program is in play, otherwise
#                      on RCERT-PS like its siblings
#
# Every formula-derived literal below was computed by executing the §1.3
# formula with Decimal/ROUND_HALF_UP (or the declared rounding mode).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # 1. ENTITIES
  # ===========================================================================
  - section: entities
    instances:
      - name: create_certification_program_echoes_every_declared_field
        claim_type: creation
        grounds:
          - entities.CertificationProgram
          - endpoints[POST /certification-programs]
        distinguishing_aspect: "POST /certification-programs with all seven required inputs returns 201 and echoes every declared field, including the booleans and the integer counters, at the values supplied."
        test_recipe:
          setup:
            - "Empty database. No other row of any kind is needed — CertificationProgram has no FK."
          setup_api_calls:
            - call: "GET /_health"
              payload: {}
              as: CorporateOps
          trigger:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "CertificationProgram.${prog_ps}.code == \"RCERT-PS\""
            - "CertificationProgram.${prog_ps}.conformance_basis == PER_SPECIMEN"
            - "CertificationProgram.${prog_ps}.r_value_tolerance == 0.30"
            - "CertificationProgram.${prog_ps}.min_specimen_count == 3"
            - "CertificationProgram.${prog_ps}.max_concurrent_lab_tests == 2"
            - "CertificationProgram.${prog_ps}.retest_limit == 2"
            - "CertificationProgram.${prog_ps}.derate_allowed == true"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: get_plant_returns_stored_reference_data_and_a_zeroed_cullet_ledger
        claim_type: retrieval
        grounds:
          - entities.Plant
          - endpoints[GET /plants/{plantId}]
        distinguishing_aspect: "GET /plants/{plantId} returns the created row verbatim: the eleven input fields as supplied and all six cullet-ledger counters still at 0.0 with melt_posture OPEN."
        test_recipe:
          setup:
            - "Plant NWK exists with its full permit and cullet configuration; nothing has been produced."
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
          trigger:
            - call: "GET /plants/${plant_id}"
              payload: {}
              as: PlantOperator
              as_user_id: "${plant_id}"
          assert:
            - "HTTP status is 200"
            - "Plant.${plant_id}.site_code == \"NWK\" and Plant.${plant_id}.permit_number == \"NJ-AIR-114\""
            - "Plant.${plant_id}.oven_zone_count == 4 and Plant.${plant_id}.oven_length_ft == 120 and Plant.${plant_id}.production_line_count == 2"
            - "Plant.${plant_id}.formaldehyde_allowance_kg == 0.200 and Plant.${plant_id}.voc_allowance_kg == 12.0"
            - "Plant.${plant_id}.cullet_received_kg_ytd == 0.0 and Plant.${plant_id}.cullet_on_hand_kg == 0.0 and Plant.${plant_id}.cullet_charged_kg_ytd == 0.0 and Plant.${plant_id}.cullet_rejected_kg_ytd == 0.0"
            - "Plant.${plant_id}.total_charge_kg_ytd == 0.0 and Plant.${plant_id}.cullet_fraction_ytd == 0.0"
            - "Plant.${plant_id}.melt_posture == OPEN and Plant.${plant_id}.posture_reason == null and Plant.${plant_id}.emissions_status == COMPLIANT"
            - "Plant.${plant_id}.version is exposed in the response and is unchanged from the create response (no write has occurred since)"

      - name: list_product_lines_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /product-lines]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three SKUs registered, GET /product-lines?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Plant NWK, program RCERT-PS and a CERTIFIED binder BF-FREE-1 exist."
            - "Three SKUs are registered on that plant: PL-A (UNFACED 15 in), PL-B (KRAFT 23 in) and PL-C (UNFACED 16 in)."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /product-lines"
              payload: { sku: "R19-23-KR", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 1.20, facing_type: "KRAFT", width_in: 23, thickness_in: 6.25, declared_r_value: 19.0, bag_sqft: 49.0, bale_volume_ft3: 25.5, bale_mass_kg: 15.0, mass_rate_kg_per_min: 40.0, compression_ratio: 5.0 }
              as: CorporateOps
              captures: { pl_b: "$.data.id" }
            - call: "POST /product-lines"
              payload: { sku: "R13-16-UF-LM", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 16, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_c: "$.data.id" }
          trigger:
            - call: "GET /product-lines"
              payload: { limit: 2, offset: 0 }
              as: ChannelManager
            - call: "GET /product-lines"
              payload: { limit: 2, offset: 2 }
              as: ChannelManager
            - call: "GET /product-lines"
              payload: { facing_type: "KRAFT" }
              as: ChannelManager
          assert:
            - "first call: response_type == \"array\", exactly 2 rows in data, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: exactly 1 row in data, total_count == 3, has_more == false, offset == 2"
            - "the two pages together contain ${pl_a}, ${pl_b} and ${pl_c} with no id appearing twice"
            - "third call: total_count == 1 and the single row is ${pl_b} — the facing_type filter narrows total_count, it does not merely hide rows from the page"

      - name: get_thermal_test_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /thermal-tests/{testId}]
          - errors[ERR_THERMAL_TEST_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: "A syntactically valid but unknown testId on GET /thermal-tests/{testId} returns 404 ERR_THERMAL_TEST_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from a program row, so no ThermalTest exists at all."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
          trigger:
            - call: "GET /thermal-tests/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 404"
            - "${err_id} == \"ERR_THERMAL_TEST_NOT_FOUND\""
            - "GET /binder-formulations/11111111-1111-4111-8111-111111111111 on the same empty DB returns 404 ERR_BINDER_FORMULATION_NOT_FOUND — each entity has its own 404 code"

      - name: create_plant_missing_voc_allowance_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /plants]
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "voc_allowance_kg has source: input and no default, so omitting it is rejected with 400 ERR_INVALID_REQUEST and no Plant row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /_health"
              payload: {}
              as: CorporateOps
          trigger:
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200 }
              as: CorporateOps
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 400"
            - "${err_id} == \"ERR_INVALID_REQUEST\""
            - "GET /plants returns total_count == 0 — the rejected create left no partial row"

      - name: omitting_the_cullet_and_width_limits_applies_the_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Plant.fields.max_cullet_fraction
          - entities.Plant.fields.cullet_restrict_fraction
          - entities.Plant.fields.max_width_change_in
          - entities.ProductLine.fields.compression_ratio
        distinguishing_aspect: "The three optional Plant limits default to 0.30 / 0.28 / 8.0 and ProductLine.compression_ratio defaults to 6.0 when omitted — the defaults are materialised on the row, not left null."
        test_recipe:
          setup:
            - "Program RCERT-PS and a CERTIFIED binder BF-FREE-1 exist so a SKU can be registered."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
          assert:
            - "Plant.${plant_id}.max_cullet_fraction == 0.30"
            - "Plant.${plant_id}.cullet_restrict_fraction == 0.28"
            - "Plant.${plant_id}.max_width_change_in == 8.0"
            - "ProductLine.${pl_a}.compression_ratio == 6.0"
            - "ProductLine.${pl_a}.compressed_bale_volume_ft3 == 3.500 — the default 6.0 actually feeds packaging_compression_economics (21.0 / 6.0), it is not a null placeholder"
            - "ProductLine.${pl_a}.certification_status == DRAFT and effective_declared_r_value == null and nonconformance_count == 0"

      - name: run_and_lot_coverage_fields_are_computed_with_supplied_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ProductionRun.fields.produced_sqft
          - entities.ProductionRun.fields.total_charge_kg
          - entities.InventoryLot.fields.produced_sqft
          - calculations.cullet_charge_allocation
          - calculations.binder_cure_index
        distinguishing_aspect: "produced_sqft, total_charge_kg, dwell_s and cure_index are all derived server-side (10560.00 / 10000 / 180.00 / 110.00 for this fixture) and the endpoints refuse to accept them as input at all."
        test_recipe:
          setup:
            - "Plant NWK, program RCERT-PS, CERTIFIED binder BF-FREE-1 and SKU PL-A (bag_sqft 88.0) exist."
            - "The logical clock is at 2026-08-03T06:00:00Z so a run scheduled for that instant may start melting."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: CorporateOps
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", line_index: 1, scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T14:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_a: "$.data.id" }
            - call: "POST /production-runs/${run_a}/start-melt"
              payload: { cullet_batch_ids: [] }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /production-runs/${run_a}/start-cure"
              payload: { avg_zone_temp_f: 470.0, line_speed_fpm: 40.0, binder_applied_kg: 900.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
          trigger:
            - call: "POST /production-runs/${run_a}/package"
              payload: { bags_produced: 120, produced_sqft: 99999.00, total_charge_kg: 1, cure_index: 999.00 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "GET /inventory-lots"
              payload: { production_run_id: "${run_a}" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { lot_a: "$.data[0].id" }
          assert:
            - "ProductionRun.${run_a}.total_charge_kg == 10000 (ceil(9200 / 0.92)) and allowed_cullet_kg == 3000.00"
            - "ProductionRun.${run_a}.dwell_s == 180.00 and cure_index == 110.00"
            - "ProductionRun.${run_a}.produced_sqft == 10560.00 (120 * 88.0)"
            - "InventoryLot.${lot_a}.bags == 120 and produced_sqft == 10560.00 and allocated_sqft == 0.0 and available_sqft == 10560.00 and status == AVAILABLE and parent_lot_id == null"
            - "InventoryLot.${lot_a}.form == BATT — copied from ProductLine.form, not supplied by the caller"
            - "the package call still returns 200 even though produced_sqft, total_charge_kg and cure_index were supplied in the body: per §1.4 priority 20 those are `computed` fields, so the input is silently ignored rather than rejected, and every stored value above is the server's own"

      - name: thermal_test_recorded_by_user_id_is_stamped_from_the_recording_header
        claim_type: system_fields
        grounds:
          - entities.ThermalTest.fields.recorded_by_user_id
          - endpoints[POST /thermal-tests/{testId}/record-result]
          - validations[priority=59]
        distinguishing_aspect: "recorded_by_user_id has source: system and is taken from the X-User-ID of the call that records the result — not from the call that created the test, and not from any body field — which is what later makes segregation of duties enforceable."
        test_recipe:
          setup:
            - "Plant NWK, program RCERT-PS, CERTIFIED binder BF-FREE-1 and SKU PL-A exist; run_a is CURING."
            - "The ThermalTest is requested and moved to IN_LAB by qe-1."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
