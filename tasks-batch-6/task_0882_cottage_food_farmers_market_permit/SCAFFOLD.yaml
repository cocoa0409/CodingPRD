# =============================================================================
# PRD-bench seed tables — Cottage-Food & Farmers-Market Vendor Permit (health)
# Difficulty: Expert
# =============================================================================

scenario: |
  Cottage-Food & Farmers-Market Vendor Permit (health): producer registration &
  product category, allowed-food & labeling compliance, sales-cap & venue
  restriction, inspection/complaint, market manifest & permit, renewal,
  recall/illness, reporting

domain_name: cottage-food-farmers-market-permit
api_prefix: /cottage-food

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers      # annual gross-sales cap crossing
    - dual_variant_calculation     # provisional vs audited sales; estimated vs final recall liability
    - cascading_side_effects       # recall -> product -> permit -> manifests; sales-cap -> producer -> manifests
    - optimistic_concurrency       # market-slot approval, permit renewal
  entity_topology: flat            # peer entities linked by FK fields, no nested URL ownership
  state_machine_shape: parallel    # Product carries two independent status axes; Permit is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # complaint filer != reviewer; peer role ownership
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Producer
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: business_name, type: string, source: input, description: "Legal/DBA business name" }
      - { name: operator_name, type: string, source: input, description: "Cottage-food operator full name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: county, type: string, source: input, description: "County of the home kitchen" }
      - { name: water_source, type: enum, source: input, description: "PUBLIC | PRIVATE_WELL — PRIVATE_WELL blocks water-activity-sensitive categories" }
      - { name: status, type: enum, source: system, description: "Posture: PENDING_VERIFICATION -> REGISTERED -> SUSPENDED -> REGISTERED (reinstate)" }
      - { name: verification_token, type: string, source: system, description: "One-time token minted at registration; consumed by verify" }
      - { name: verified_at, type: datetime, source: system, description: "When the producer completed verification (null until verified)" }
      - { name: ytd_gross_sales_cents, type: integer, source: computed, default: 0, description: "Running ledger: sum of RECORDED SalesRecord.gross_amount_cents for this producer" }

  - name: AllowedFoodPolicy
    parent: null
    common_fields: false         # id, created_at only (immutable configuration)
    fields:
      - { name: food_category, type: enum, source: input, description: "BAKED_GOODS | JAMS_JELLIES | DRY_MIXES | CANDY | ACID_PICKLES | FERMENTED_VEG | DAIRY | MEAT_POULTRY | LOW_ACID_CANNED | JUICE" }
      - { name: is_cottage_allowed, type: boolean, source: input, description: "Whether this category is permissible as a cottage food at all" }
      - { name: max_ph, type: number, source: input, required: false, description: "Products with ph_value strictly above this are prohibited (acidification limit); null = no ph limit" }
      - { name: max_water_activity, type: number, source: input, required: false, description: "Products with water_activity strictly above this are prohibited; null = no aw limit" }
      - { name: class_b_required, type: boolean, source: input, description: "Category may only be sold under a CLASS_B (inspected) permit" }
      - { name: requires_allergen_label, type: boolean, source: input, description: "Label must declare allergens for this category" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; owning producer" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: food_category, type: enum, source: input, description: "One of AllowedFoodPolicy.food_category values" }
      - { name: requires_refrigeration, type: boolean, source: input, description: "Operator-declared refrigeration need; true => not cottage-allowed" }
      - { name: ph_value, type: number, source: input, required: false, description: "Measured pH (for acidified categories)" }
      - { name: water_activity, type: number, source: input, required: false, description: "Measured water activity aw" }
      - { name: unit_price_cents, type: integer, source: input, description: "Retail price per unit in cents; drives recall liability" }
      - { name: compliance_status, type: enum, source: system, description: "Axis 1 (allowed-food): DECLARED -> APPROVED | REJECTED; APPROVED -> RECALLED (recall cascade)" }
      - { name: label_status, type: enum, source: system, description: "Axis 2 (labeling): LABEL_DRAFT -> LABEL_APPROVED | LABEL_REJECTED" }
      - { name: reject_reason, type: string, source: system, required: false, description: "Populated when compliance_status or label_status becomes a REJECTED value" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; permit holder" }
      - { name: permit_class, type: enum, source: input, description: "CLASS_A (registration, no inspection, lower cap) | CLASS_B (inspected, higher cap)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> (UNDER_INSPECTION) -> ISSUED; ISSUED -> RENEWAL_PENDING -> ISSUED (cycle); ISSUED/... -> SUSPENDED | REVOKED" }
      - { name: inspection_required, type: boolean, source: computed, description: "= (permit_class == CLASS_B)" }
      - { name: annual_cap_cents, type: integer, source: computed, description: "CLASS_A -> 7500000; CLASS_B -> 15000000" }
      - { name: fee_cents, type: integer, source: computed, description: "Set on first issue by permit_fee calculation" }
      - { name: term_start, type: datetime, source: system, description: "Logical clock at (re)issue" }
      - { name: expires_at, type: datetime, source: system, description: "term_start + PERMIT_TERM_DAYS" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Incremented each time a RENEWAL_PENDING permit is re-issued" }
      - { name: is_expired, type: boolean, source: computed, description: "= (current logical clock > expires_at); does not change status" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; permit under inspection" }
      - { name: inspection_type, type: enum, source: input, description: "ROUTINE | RENEWAL | COMPLAINT" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PASSED | FAILED" }
      - { name: scheduled_for, type: datetime, source: input, description: "Scheduled inspection datetime" }
      - { name: violation_count, type: integer, source: system, default: 0, description: "Recorded at close; 0 for a clean pass" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the HealthInspector who closed it" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; subject producer" }
      - { name: product_id, type: string, source: input, required: false, description: "FK -> Product.id; optional specific product" }
      - { name: category, type: enum, source: input, description: "LABELING | ILLNESS | UNAPPROVED_FOOD | SALES_VENUE" }
      - { name: description, type: string, source: input, description: "Free-text complaint body" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> UNDER_REVIEW -> SUBSTANTIATED | DISMISSED" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filer (SoD anchor)" }
      - { name: reviewed_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the reviewer; MUST differ from filed_by_user_id" }

  - name: FarmersMarket
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Market name" }
      - { name: county, type: string, source: input, description: "County the market operates in" }
      - { name: venue_type, type: enum, source: input, description: "CERTIFIED_FM | TEMP_EVENT | ONLINE" }
      - { name: max_vendors_per_day, type: integer, source: input, description: "Capacity: max APPROVED/CHECKED_IN manifests per event_date" }
      - { name: allowed_classes, type: array, source: input, description: "Subset of [CLASS_A, CLASS_B] permitted to vend here" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED" }

  - name: MarketManifest
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; vending producer" }
      - { name: market_id, type: string, source: input, description: "FK -> FarmersMarket.id; target market" }
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; permit relied on for this event" }
      - { name: event_date, type: string, source: input, description: "Single vending date, YYYY-MM-DD" }
      - { name: product_ids, type: array, source: input, description: "Product ids to be sold; each must be APPROVED and LABEL_APPROVED and not RECALLED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED -> CHECKED_IN; SUBMITTED -> REJECTED; {SUBMITTED,APPROVED} -> WITHDRAWN; {SUBMITTED,APPROVED,CHECKED_IN} -> VOIDED" }
      - { name: booth_fee_cents, type: integer, source: computed, default: 0, description: "event_settlement_fee: per-line round(gross*MARKET_FEE_RATE) summed over this manifest's RECORDED sales" }

  - name: SalesRecord
    parent: null
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: input, description: "FK -> MarketManifest.id; the event this sale occurred at" }
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id; denormalized from manifest for ledger rollup" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Gross sales reported for this line (> 0)" }
      - { name: status, type: enum, source: system, description: "RECORDED -> VOIDED" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock when recorded" }

  - name: RecallEvent
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; producer being recalled" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; recalled product" }
      - { name: reason, type: enum, source: input, description: "ILLNESS_OUTBREAK | MISLABEL | CONTAMINATION" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH — sets projected recalled units" }
      - { name: status, type: enum, source: system, description: "INITIATED -> RESOLVED" }
      - { name: recalled_units, type: integer, source: system, default: 0, description: "Actual returned units, supplied at resolve" }
      - { name: estimated_liability_cents, type: integer, source: computed, description: "At INITIATED: projected_units(severity) * product.unit_price_cents" }
      - { name: final_liability_cents, type: integer, source: computed, description: "At RESOLVED: recalled_units * product.unit_price_cents" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Producer
    initial_state: PENDING_VERIFICATION
    terminal_states: []
    transitions:
      - from: PENDING_VERIFICATION
        to: REGISTERED
        trigger: "POST /cottage-food/producers/{id}/verify"
        actor: Producer
        preconditions:
          - "verification_token in body equals Producer.verification_token (else ERR_INVALID_REQUEST)"
        side_effects:
          - "verified_at = current logical clock"

      - from: REGISTERED
        to: SUSPENDED
        trigger: "system: SalesRecord create pushes ytd_gross_sales_cents strictly above active permit annual_cap_cents (cap_breach_check)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link2->link3: every non-terminal MarketManifest (SUBMITTED|APPROVED|CHECKED_IN) for this producer -> VOIDED; each formerly APPROVED/CHECKED_IN manifest frees its FarmersMarket day-slot and increments FarmersMarket.version by 1"

      - from: REGISTERED
        to: SUSPENDED
        trigger: "system: recall cascade suspends the producer's issued permit and posture"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /cottage-food/producers/{id}/reinstate"
        actor: HealthAdmin
        preconditions:
          - "No RecallEvent for this producer is in INITIATED (ERR_RECALL_INVALID_STATE)"
        side_effects: []

  - entity: Product
    initial_state: "DECLARED / LABEL_DRAFT"
    terminal_states: [REJECTED, RECALLED]
    transitions:
      # --- Axis 1: compliance_status (allowed-food) ---
      - from: DECLARED
        to: APPROVED
        trigger: "POST /cottage-food/products/{id}/review-food (decision=APPROVE)"
        actor: HealthInspector
        preconditions:
          - "AllowedFoodPolicy for food_category has is_cottage_allowed=true (else ERR_FOOD_NOT_COTTAGE_ALLOWED)"
          - "requires_refrigeration=false (else ERR_FOOD_NOT_COTTAGE_ALLOWED)"
          - "ph_value <= policy.max_ph when max_ph set; water_activity <= policy.max_water_activity when set (else ERR_FOOD_NOT_COTTAGE_ALLOWED)"
        side_effects: []
        note: "dimension: compliance_status; independent of label_status"
      - from: DECLARED
        to: REJECTED
        trigger: "POST /cottage-food/products/{id}/review-food (decision=REJECT)"
        actor: HealthInspector
        preconditions: []
        side_effects: ["reject_reason set from body"]
        note: "dimension: compliance_status"
      - from: APPROVED
        to: RECALLED
        trigger: "system: RecallEvent create targets this product (cascade link1)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link1->link2: the producer's ISSUED Permit -> SUSPENDED (see Permit machine)"
        note: "dimension: compliance_status"
      # --- Axis 2: label_status (labeling) ---
      - from: LABEL_DRAFT
        to: LABEL_APPROVED
        trigger: "POST /cottage-food/products/{id}/review-label (decision=APPROVE)"
        actor: HealthInspector
        preconditions:
          - "If policy.requires_allergen_label=true the label review must assert allergen declaration present (else ERR_LABEL_NOT_APPROVED on manifest use)"
        side_effects: []
        note: "dimension: label_status; evolves independently of compliance_status"
      - from: LABEL_DRAFT
        to: LABEL_REJECTED
        trigger: "POST /cottage-food/products/{id}/review-label (decision=REJECT)"
        actor: HealthInspector
        preconditions: []
        side_effects: ["reject_reason set from body"]
        note: "dimension: label_status"

  - entity: Permit
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cottage-food/permits/{id}/submit"
        actor: Producer
        preconditions:
          - "Producer.status == REGISTERED (ERR_PRODUCER_NOT_REGISTERED)"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_INSPECTION
        trigger: "system: Inspection created for this permit"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /cottage-food/permits/{id}/issue (CLASS_A path)"
        actor: HealthInspector
        preconditions:
          - "permit_class == CLASS_A (CLASS_B must go through UNDER_INSPECTION -> ISSUED)"
          - "No other ISSUED Permit for this producer has [term_start, expires_at) overlapping the new term (ERR_PERMIT_TERM_OVERLAP)"
        side_effects:
          - "term_start = clock; expires_at = clock + PERMIT_TERM_DAYS"
          - "fee_cents = permit_fee(...)"
      - from: UNDER_INSPECTION
        to: ISSUED
        trigger: "POST /cottage-food/permits/{id}/issue (CLASS_B path)"
        actor: HealthInspector
        preconditions:
          - "A PASSED Inspection exists for this permit (ERR_INSPECTION_NOT_PASSED)"
          - "No overlapping ISSUED Permit term for this producer (ERR_PERMIT_TERM_OVERLAP)"
        side_effects:
          - "term_start = clock; expires_at = clock + PERMIT_TERM_DAYS"
          - "fee_cents = permit_fee(...)"
      - from: ISSUED
        to: RENEWAL_PENDING
        trigger: "POST /cottage-food/permits/{id}/renew"
        actor: Producer
        preconditions:
          - "expected_permit_version matches Permit.version (else ERR_STALE_PERMIT_VERSION, 412)"
        side_effects:
          - "increments Permit.version by 1"
      - from: RENEWAL_PENDING
        to: ISSUED
        trigger: "POST /cottage-food/permits/{id}/issue (renewal path)"
        actor: HealthInspector
        preconditions:
          - "For CLASS_B: a PASSED Inspection with inspection_type=RENEWAL exists (ERR_INSPECTION_NOT_PASSED)"
        side_effects:
          - "renewal_count += 1"
          - "term_start = clock; expires_at = clock + PERMIT_TERM_DAYS"
      - from: ISSUED
        to: SUSPENDED
        trigger: "system: cap_breach_check on producer OR recall cascade (link2)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link2->link3: every non-terminal MarketManifest bound to this permit -> VOIDED; freed day-slots increment FarmersMarket.version by 1"
      - from: DRAFT
        to: REVOKED
        trigger: "POST /cottage-food/permits/{id}/revoke"
        actor: HealthAdmin
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REVOKED
        trigger: "POST /cottage-food/permits/{id}/revoke"
        actor: HealthAdmin
        preconditions: []
        side_effects: []
      - from: UNDER_INSPECTION
        to: REVOKED
        trigger: "POST /cottage-food/permits/{id}/revoke"
        actor: HealthAdmin
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /cottage-food/permits/{id}/revoke"
        actor: HealthAdmin
        preconditions: []
        side_effects:
          - "every non-terminal MarketManifest bound to this permit -> VOIDED; freed day-slots increment FarmersMarket.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /cottage-food/permits/{id}/revoke"
        actor: HealthAdmin
        preconditions: []
        side_effects: []

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /cottage-food/inspections/{id}/close (result=PASS)"
        actor: HealthInspector
        preconditions: []
        side_effects:
          - "violation_count set from body (0 for clean pass); inspector_user_id = X-User-ID"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /cottage-food/inspections/{id}/close (result=FAIL)"
        actor: HealthInspector
        preconditions: []
        side_effects:
          - "violation_count set from body; inspector_user_id = X-User-ID"

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /cottage-food/complaints/{id}/review"
        actor: HealthInspector
        preconditions:
          - "X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /cottage-food/complaints/{id}/resolve (outcome=SUBSTANTIATE)"
        actor: HealthInspector
        preconditions:
          - "X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /cottage-food/complaints/{id}/resolve (outcome=DISMISS)"
        actor: HealthInspector
        preconditions:
          - "X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

  - entity: FarmersMarket
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system/admin closure (out of primary scope; occupancy released)"
        actor: HealthAdmin
        preconditions: []
        side_effects: []

  - entity: MarketManifest
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cottage-food/market-manifests/{id}/submit"
        actor: Producer
        preconditions:
          - "Producer.status == REGISTERED (ERR_PRODUCER_NOT_REGISTERED)"
          - "linked Permit.status == ISSUED (ERR_PERMIT_NOT_ISSUED)"
          - "Permit not expired at event_date: event_date <= date(expires_at) (ERR_PERMIT_EXPIRED)"
          - "every product in product_ids has compliance_status=APPROVED and label_status=LABEL_APPROVED and != RECALLED (ERR_PRODUCT_NOT_APPROVED / ERR_LABEL_NOT_APPROVED / ERR_PRODUCT_RECALLED)"
          - "Permit.permit_class in FarmersMarket.allowed_classes (ERR_VENUE_CLASS_NOT_ALLOWED)"
          - "No other non-terminal manifest exists for same (producer_id, market_id, event_date) (ERR_DUPLICATE_MANIFEST)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cottage-food/market-manifests/{id}/approve"
        actor: MarketManager
        preconditions:
          - "expected_market_version matches FarmersMarket.version (else ERR_STALE_MARKET_VERSION, 412)"
          - "count of APPROVED/CHECKED_IN manifests for (market_id, event_date) < FarmersMarket.max_vendors_per_day (ERR_MARKET_CAPACITY_FULL)"
        side_effects:
          - "occupies one FarmersMarket day-slot; increments FarmersMarket.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /cottage-food/market-manifests/{id}/reject"
        actor: MarketManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CHECKED_IN
        trigger: "POST /cottage-food/market-manifests/{id}/check-in"
        actor: MarketManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /cottage-food/market-manifests/{id}/withdraw"
        actor: Producer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /cottage-food/market-manifests/{id}/withdraw"
        actor: Producer
        preconditions: []
        side_effects:
          - "releases the FarmersMarket day-slot; increments FarmersMarket.version by 1 (compensating invariant: occupancy count conserved)"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system: producer suspension / permit suspension / permit revoke / recall cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "system: producer suspension / permit suspension / permit revoke / recall cascade"
        actor: system
        preconditions: []
        side_effects:
          - "releases the FarmersMarket day-slot; increments FarmersMarket.version by 1"
      - from: CHECKED_IN
        to: VOIDED
        trigger: "system: producer suspension / permit suspension / permit revoke / recall cascade"
        actor: system
        preconditions: []
        side_effects:
          - "releases the FarmersMarket day-slot; increments FarmersMarket.version by 1"

  - entity: SalesRecord
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: RECORDED
        trigger: "POST /cottage-food/sales-records (create)"
        actor: Producer
        preconditions:
          - "linked MarketManifest.status in {APPROVED, CHECKED_IN} (ERR_MANIFEST_INVALID_STATE)"
          - "Producer.status == REGISTERED (ERR_PRODUCER_NOT_REGISTERED)"
        side_effects:
          - "producer_id denormalized from manifest; recorded_at = clock"
          - "Producer.ytd_gross_sales_cents += gross_amount_cents (compensating invariant: money ledger)"
          - "manifest.booth_fee_cents recomputed (event_settlement_fee)"
          - "cap_breach_check: if ytd_gross_sales_cents strictly > active permit annual_cap_cents -> Producer SUSPENDED cascade (link1->link2->link3)"
        note: "creation transition (initial write); shown for side-effect completeness"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /cottage-food/sales-records/{id}/void"
        actor: HealthAdmin
        preconditions: []
        side_effects:
          - "Producer.ytd_gross_sales_cents -= gross_amount_cents (restores money ledger invariant)"
          - "manifest.booth_fee_cents recomputed"

  - entity: RecallEvent
    initial_state: INITIATED
    terminal_states: [RESOLVED]
    transitions:
      - from: INITIATED
        to: INITIATED
        trigger: "POST /cottage-food/recall-events (create)"
        actor: HealthAdmin
        preconditions:
          - "target Product.compliance_status == APPROVED (ERR_PRODUCT_NOT_APPROVED)"
        side_effects:
          - "estimated_liability_cents = projected_units(severity) * Product.unit_price_cents"
          - "CASCADE link1: target Product.compliance_status -> RECALLED"
          - "CASCADE link2: producer's ISSUED Permit -> SUSPENDED and Producer.status -> SUSPENDED"
          - "CASCADE link3: every non-terminal MarketManifest bound to that permit -> VOIDED; freed day-slots increment FarmersMarket.version by 1"
        note: "creation transition; depth-3 cascade rooted here"
      - from: INITIATED
        to: RESOLVED
        trigger: "POST /cottage-food/recall-events/{id}/resolve"
        actor: HealthAdmin
        preconditions: []
        side_effects:
          - "recalled_units set from body"
          - "final_liability_cents = recalled_units * Product.unit_price_cents"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: manifest-approve-stale-market
    parent_entity: FarmersMarket
    write_endpoint: "POST /cottage-food/market-manifests/{id}/approve"
    occ_field: "expected_market_version"
    description: |
      Approving a MarketManifest against a FarmersMarket whose version has
      advanced since the manager last observed it is rejected. Each prior
      approval legitimately consumes a day-slot and bumps the market version;
      a manager acting on a stale market view (its last slot may already be
      taken) is turned away with a stale-version precondition failure.
    error_id: ERR_STALE_MARKET_VERSION
    http_status: 412

  - rule_id: permit-renew-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /cottage-food/permits/{id}/renew"
    occ_field: "expected_permit_version"
    description: |
      Renewing a Permit whose version has advanced since the producer last
      observed it is rejected. A prior renewal (or a cascade that suspended the
      permit) legitimately advances the version; a renewal carrying the stale
      version is rejected with a precondition failure.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_fee
    trigger: "Permit issue (DRAFT/UNDER_INSPECTION -> ISSUED); computed once on first issue"
    algorithm: tiered_pricing
    formula: |
      base = BASE_FEE_BY_CLASS[permit_class]           # CLASS_A=2500, CLASS_B=7500
      cap  = annual_cap_cents                           # CLASS_A=7500000, CLASS_B=15000000
      if   cap >= 15000000: tier_surcharge = 5000
      elif cap >=  7500000: tier_surcharge = 2500
      else:                 tier_surcharge = 0
      inspection_surcharge = INSPECTION_SURCHARGE if permit_class == CLASS_B else 0
      fee_cents = base + tier_surcharge + inspection_surcharge
      # Worked: CLASS_A -> 2500+2500+0 = 5000 ; CLASS_B -> 7500+5000+3000 = 15500
    input_set: "single Permit; permit_class and derived annual_cap_cents"
    constants:
      BASE_FEE_BY_CLASS: { CLASS_A: 2500, CLASS_B: 7500 }
      INSPECTION_SURCHARGE: 3000
    precision: "integer cents, exact"

  - name: sales_cap_utilization
    trigger: "GET compliance-summary; read model over a Producer's SalesRecords"
    algorithm: aggregation
    formula: |
      provisional_ytd_cents = sum(sr.gross_amount_cents
                                  for sr in SalesRecord
                                  where sr.producer_id == P and sr.status == RECORDED)
      checked_in_gross      = sum(sr.gross_amount_cents
                                  for sr in SalesRecord
                                  where sr.producer_id == P and sr.status == RECORDED
                                    and manifest(sr.manifest_id).status == CHECKED_IN)
      audited_ytd_cents     = max(0, checked_in_gross - SAMPLING_EXEMPTION_CENTS)
    input_set: "RECORDED SalesRecords for the producer; audited variant restricts to CHECKED_IN manifests and applies the sampling/donation exemption"
    constants:
      SAMPLING_EXEMPTION_CENTS: 50000
    precision: "integer cents, exact"
    variants:
      - name: provisional
        when: "real-time posture; every RECORDED sale counts"
        difference: "no manifest filter, no exemption — the figure that governs cap_breach_check"
      - name: audited
        when: "end-of-season reconciliation / reporting"
        difference: "counts only sales whose manifest is CHECKED_IN, then subtracts SAMPLING_EXEMPTION_CENTS (floored at 0)"

  - name: cap_breach_check
    trigger: "SalesRecord create side-effect, after ledger increment"
    algorithm: threshold
    formula: |
      # Evaluated on the PROVISIONAL ytd after adding the new sale.
      if provisional_ytd_cents > active_permit.annual_cap_cents:
          suspend producer (and issued permit) -> cascade void manifests
      # Boundary: ytd == cap does NOT suspend; ytd == cap + 1 suspends.
    input_set: "producer's provisional_ytd_cents vs the producer's ISSUED permit annual_cap_cents"
    constants: {}
    precision: "integer cents, exact; comparison is strict >"

  - name: recall_liability
    trigger: "RecallEvent create (estimate) and resolve (final)"
    algorithm: forward_looking
    formula: |
      projected_units = PROJECTED_UNITS_BY_SEVERITY[severity]   # LOW=10, MEDIUM=50, HIGH=200
      estimated_liability_cents = projected_units * Product.unit_price_cents      # at INITIATED
      final_liability_cents     = recalled_units * Product.unit_price_cents        # at RESOLVED
    input_set: "single RecallEvent + its Product.unit_price_cents"
    constants:
      PROJECTED_UNITS_BY_SEVERITY: { LOW: 10, MEDIUM: 50, HIGH: 200 }
    precision: "integer cents, exact"
    variants:
      - name: estimated
        when: "at INITIATED, actual returns unknown"
        difference: "uses severity-projected unit count"
      - name: final
        when: "at RESOLVED, actual returns counted"
        difference: "uses recalled_units supplied at resolve; diverges from estimate whenever recalled_units != projected_units(severity)"

  - name: event_settlement_fee
    trigger: "SalesRecord create/void side-effect; recompute manifest.booth_fee_cents"
    algorithm: aggregation
    formula: |
      # ROUND PER LINE THEN SUM (pinned order; differs from sum-then-round).
      booth_fee_cents = sum( round_half_up(sr.gross_amount_cents * MARKET_FEE_RATE)
                             for sr in SalesRecord
                             where sr.manifest_id == M and sr.status == RECORDED )
      # Worked: two RECORDED sales of 908 -> round(54.48)=54 each -> 54+54 = 108
      #         (sum-then-round would give round(1816*0.06)=round(108.96)=109).
    input_set: "RECORDED SalesRecords for a single manifest"
    constants:
      MARKET_FEE_RATE: 0.06
    precision: "each line rounded to integer cents half-up BEFORE summing"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist, validated left-to-right; return on first miss"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing an id

  - priority: 4
    category: business_constraint
    check: "Request body shape/type/enum-membership valid (e.g. gross_amount_cents > 0, enum values legal)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 5
    category: state
    check: "Target resource is in a legal state for the requested transition"
    error_id: "varies (ERR_PERMIT_INVALID_STATE, ERR_MANIFEST_INVALID_STATE, ERR_INSPECTION_NOT_SCHEDULED, ERR_COMPLAINT_INVALID_STATE, ERR_SALES_RECORD_NOT_RECORDED, ERR_RECALL_INVALID_STATE)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "Acting producer posture: Producer.status == REGISTERED for permit submit, manifest submit, sales record"
    error_id: ERR_PRODUCER_NOT_REGISTERED
    http_status: 409
    applies_to: "permit submit, manifest submit, sales-records create"

  - priority: 7
    category: business_referential
    check: "Segregation of duties: complaint reviewer/resolver X-User-ID must differ from filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "complaint review, complaint resolve"

  - priority: 8
    category: concurrency
    check: "expected_market_version / expected_permit_version matches parent version"
    error_id: "ERR_STALE_MARKET_VERSION | ERR_STALE_PERMIT_VERSION"
    http_status: 412
    applies_to: "manifest approve, permit renew"

  - priority: 9
    category: business_referential
    check: "Cross-entity precondition on a linked entity's state (manifest submit requires Permit ISSUED; CLASS_B permit issue requires a PASSED Inspection)"
    error_id: "ERR_PERMIT_NOT_ISSUED | ERR_INSPECTION_NOT_PASSED"
    http_status: 409
    applies_to: "manifest submit, permit issue"

  - priority: 10
    category: business_safety
    check: "Every manifest product is APPROVED, LABEL_APPROVED, and not RECALLED"
    error_id: "ERR_PRODUCT_NOT_APPROVED | ERR_LABEL_NOT_APPROVED | ERR_PRODUCT_RECALLED"
    http_status: 422
    applies_to: "manifest submit"

  - priority: 11
    category: business_constraint
    check: "Venue restriction: Permit.permit_class in FarmersMarket.allowed_classes"
    error_id: ERR_VENUE_CLASS_NOT_ALLOWED
    http_status: 422
    applies_to: "manifest submit"

  - priority: 12
    category: business_temporal
    check: "Permit not expired at event_date (manifest submit); no overlapping ISSUED permit term (permit issue)"
    error_id: "ERR_PERMIT_EXPIRED | ERR_PERMIT_TERM_OVERLAP"
    http_status: 409
    applies_to: "manifest submit, permit issue"

  - priority: 13
    category: business_constraint
    check: "No other non-terminal manifest for the same (producer_id, market_id, event_date)"
    error_id: ERR_DUPLICATE_MANIFEST
    http_status: 409
    applies_to: "manifest submit"

  - priority: 14
    category: business_fiscal
    check: "Market day-slot capacity: APPROVED/CHECKED_IN count for (market_id, event_date) < max_vendors_per_day"
    error_id: ERR_MARKET_CAPACITY_FULL
    http_status: 409
    applies_to: "manifest approve"

