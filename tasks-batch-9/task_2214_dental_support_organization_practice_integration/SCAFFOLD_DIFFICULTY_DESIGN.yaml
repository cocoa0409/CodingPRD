  - rule_id: cross_entity_state_dependency
    instances:

      - name: quarantined_batch_posture_blocks_payer_contract_activation
        grounds:
          - calculations.practice_posture
          - validations[priority=18]
          - errors.ERR_PRACTICE_POSTURE_BLOCKED
          - state_machines.MigrationBatch.SCHEDULED_to_QUARANTINED
          - state_machines.MigrationBatch.QUARANTINED_to_SCHEDULED
          - state_machines.PayerContract.PENDING_CREDENTIALING_to_DSO_SCHEDULE_ACTIVE
        distinguishing_aspect: |
          Entity pair Practice x PayerContract: whether the contract may leave
          PENDING_CREDENTIALING depends on the Practice posture derived from a
          third entity (a QUARANTINED MigrationBatch), so the identical
          activation body is refused with ERR_PRACTICE_POSTURE_BLOCKED while the
          practice is RESTRICTED and accepted once remediation clears it.
        test_recipe:
          setup:
            - "One Affiliation CLOSED at 2026-09-01T00:00:00Z with one AFFILIATED IL Practice (charts_total_expected 5000), one ACTIVE DoctorEmployment and one EFFECTIVE ServiceAgreement."
            - "One PayerContract in PENDING_CREDENTIALING with one FeeScheduleItem of non-material impact -39195 and one APPROVED PayerEnrollment whose lead_days is 90."
            - "One MigrationBatch validated with 101 rejects out of 5000, which quarantines the batch and drives Practice.integration_posture to RESTRICTED."
