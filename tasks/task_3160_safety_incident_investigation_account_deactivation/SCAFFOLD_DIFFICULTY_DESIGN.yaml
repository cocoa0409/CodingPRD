              as: SafetyInvestigator
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the response carries error_id == \"ERR_INVALID_STATE\" with HTTP 409"
            - "the response does NOT carry ERR_IN_FLIGHT_APPEAL (409 is the shared status, so only the error_id distinguishes the two) and does NOT carry ERR_THROWN_ON_APPEAL (422)"
            - "the response does NOT carry ERR_IN_FLIGHT_APPEAL even though Account.${acct_id}.standing_enforcement_count == 1 also violates the priority-14 gate"
            - "the second incident is left at incident_status == \"OPEN\" because the state error suppressed every later check and every side effect in the same request"
            - "the supplied expected_incident_version is deliberately the value captured at incident creation, which is stale after the hold and evidence writes, so the same request also proves the priority-6 state check is evaluated before the priority-16 OCC check rather than after it"

      - name: priority_conflict_state_beats_temporal_below_hold_floor
        grounds:
