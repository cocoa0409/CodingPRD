  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_invoice_fund
        grounds:
          - validations[priority=8]
          - validations[priority=34]
          - errors.ERR_INVALID_STATE_TRANSITION
          - errors.ERR_FUNDING_EXCEEDS_BILLED
        distinguishing_aspect: |
          Two rules on the SAME endpoint (POST
          /manufacturer-invoices/{id}/fund) are violated by one request: the
          priority-8 lifecycle check (a FUNDED invoice has no fund transition,
          409) and the priority-34 fiscal ceiling (funded_amount + amount >
          billed_total, 422). The response must be the 409, and the test also
          isolates the loser first — the identical overfunding amount against an
          ISSUED invoice returns the 422 — so an implementation that evaluates
          the money check before the state check is caught by the status code,
          not merely by the message.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default"
            - "one submission verified 2, one lot of 2 accepted items -> gross 100, fee 14, statement net_payable 114 and SCHEDULED"
            - "one invoice over that statement: billed_face 100, billed_fee 14, billed_clearing round_half_up(100 * 0.015) == 2, billed_total 116, status ISSUED"
