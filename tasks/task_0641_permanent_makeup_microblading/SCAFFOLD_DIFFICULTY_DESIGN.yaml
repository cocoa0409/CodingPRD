            - call: "POST /appointments/${appt_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${appt_id}/void"
              payload: {}
              as: ComplianceOfficer
              captures: { ps_after: $.data.payment_status, paid_after: $.data.deposit_paid_cents }
            - call: "GET /deposit-transactions?appointment_id=${appt_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Appointment.${appt_id}.payment_status == REFUNDED"
            - "Appointment.${appt_id}.deposit_paid_cents == 0"
            - "DepositTransaction ledger for ${appt_id} == one CHARGE 13000 and one REFUND 13000 (sum(CHARGE)-sum(REFUND) == 0)"

      - name: ci_kit_conservation_on_void
        grounds:
