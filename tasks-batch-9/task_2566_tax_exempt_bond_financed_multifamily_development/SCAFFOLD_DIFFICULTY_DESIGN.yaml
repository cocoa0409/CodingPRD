              as: Developer
              as_user_id: "${dev_id}"
              captures: { bond_id: $.data.id }
            - call: "POST /bond-issues/${bond_id}/issue"
              payload: { closing_date: "2026-09-15T00:00:00Z" }
              as: BondTrustee
              as_user_id: "trustee-1"
              captures: { bond_v1: $.data.version }
            - call: "POST /draw-requests"
              payload: { bond_issue_id: "${bond_id}", draw_number: 1, period_start: "2026-09-15T00:00:00Z", period_end: "2026-11-15T00:00:00Z", requested_amount_cents: 120000000, expected_bond_issue_version: "${bond_v1}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { draw1_id: $.data.id }
            - call: "POST /draw-requests/${draw1_id}/decision"
              payload: { decision: "APPROVE", approved_amount_cents: 120000000 }
              as: BondTrustee
              as_user_id: "trustee-1"
            - call: "POST /draw-requests/${draw1_id}/fund"
              payload: { funding_date: "2026-09-15T00:00:00Z" }
              as: BondTrustee
              as_user_id: "trustee-1"
            - call: "GET /bond-issues/${bond_id}"
              payload: {}
              as: BondTrustee
              captures: { bond_v2: $.data.version }
            - call: "POST /draw-requests"
              payload: { bond_issue_id: "${bond_id}", draw_number: 2, period_start: "2026-11-15T00:00:00Z", period_end: "2027-01-16T00:00:00Z", requested_amount_cents: 80000000, expected_bond_issue_version: "${bond_v2}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { draw2_id: $.data.id }
            - call: "POST /draw-requests/${draw2_id}/decision"
              payload: { decision: "APPROVE", approved_amount_cents: 80000000 }
              as: BondTrustee
              as_user_id: "trustee-1"
            - call: "POST /draw-requests/${draw2_id}/fund"
              payload: { funding_date: "2026-11-15T00:00:00Z" }
              as: BondTrustee
              as_user_id: "trustee-1"
          trigger:
            - call: "POST /draw-requests/${draw1_id}/void"
              payload: { void_reason: "requisition disallowed on audit; proceeds returned to the trustee" }
              as: BondTrustee
              as_user_id: "trustee-1"
          assert:
            - "the response is HTTP 200 with DrawRequest.${draw1_id}.status == VOIDED, funding_date == null, negative_arbitrage_accrual_cents == 0 and void_reason \"requisition disallowed on audit; proceeds returned to the trustee\""
            - "BondIssue.${bond_id}.cumulative_funded_cents == 80000000 and undrawn_cents == 120000000"
            - "the identity par_amount_cents == cumulative_funded_cents + undrawn_cents holds at 200000000 == 80000000 + 120000000, as it did at 200000000 == 200000000 + 0 before the void"
            - "DrawRequest.${draw2_id}.negative_arbitrage_accrual_cents == 861111, RECOMPUTED upward from 344444 because the void restored the 200000000 undrawn balance its period accrues against"
            - "BondIssue.${bond_id}.negative_arbitrage_cents == 861111, not 344444 and not 1191666"
            - "DrawRequest.${draw2_id}.status stays FUNDED with approved_amount_cents 80000000 and funding_date \"2026-11-15T00:00:00Z\""
            - "BondIssue.${bond_id}.status stays ISSUED and negative_arbitrage_allowance_cents stays 4000000"
            - "Project.${proj_id}.development_status stays UNDER_CONSTRUCTION (one funded draw survives)"
