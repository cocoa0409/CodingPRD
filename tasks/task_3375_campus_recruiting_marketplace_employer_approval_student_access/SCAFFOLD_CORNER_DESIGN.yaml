  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_header_returns_user_context_error
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "Priority 1 fires before everything else: a request sent WITHOUT the X-User-Role header is 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the target endpoint and body would otherwise be fine."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database. The trigger call is dispatched with the X-User-Role / X-User-ID headers withheld (the `as:` below names the intended role for the harness's header machinery to omit)."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "err_id != ERR_EMPLOYER_NOT_FOUND — auth (p1) precedes existence (p4)"

      - name: application_body_fks_checked_in_declared_input_order
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - errors.ERR_STUDENT_NOT_FOUND
          - errors.ERR_JOB_POSTING_NOT_FOUND
        distinguishing_aspect: "Body foreign keys are checked in the endpoint's declared input order (student_id before job_posting_id): with BOTH ids unknown the answer is ERR_STUDENT_NOT_FOUND; with only job_posting_id unknown it is ERR_JOB_POSTING_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE; Sam ENROLLED."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_stu
          trigger:
            - call: "POST /applications"
              payload: { student_id: "00000000-0000-4000-8000-000000000001", job_posting_id: "00000000-0000-4000-8000-000000000002", submitted_documents: [] }
              as: Student
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err_both: $.data.error_id }
            - call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "00000000-0000-4000-8000-000000000002", submitted_documents: [] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err_post: $.data.error_id }
          assert:
            - "first request: 404 with err_both == ERR_STUDENT_NOT_FOUND (student_id precedes job_posting_id in the input list)"
            - "second request: 404 with err_post == ERR_JOB_POSTING_NOT_FOUND"
            - "GET /applications?student_id=${stu_id} returns 0 rows"

      - name: duplicate_active_application_rejected
        claim_type: Violation -> Error
        grounds:
          - calculations.eligibility_evaluation
          - errors.ERR_DUPLICATE_APPLICATION
          - validations[priority=9]
        distinguishing_aspect: "A second application by the same student to the same posting while the first is still active (SUBMITTED) fails 409 ERR_DUPLICATE_APPLICATION — and it is the LAST eligibility check, so it only fires when majors/years/work-auth/documents all pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base fixture; Sam's application SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_stu
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - *k_appr
            - *k_appr_ok
            - *k_post
            - *k_post_submit
            - *k_post_publish
            - *k_apply
          trigger:
            - call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sam-resume-2.pdf" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_DUPLICATE_APPLICATION"
            - "GET /job-postings/${post_id} still shows active_application_count == 1"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: posting_status_projects_expired_after_deadline_without_rewrite
        claim_type: Computed Read
        grounds:
          - calculations.posting_expiry_projection
          - endpoints.GET_/job-postings/{id}
        distinguishing_aspect: "EXPIRED is a read-time projection over the stored PUBLISHED status: after the clock passes the deadline the GET reports EXPIRED, yet a PAUSED transition still succeeds — proof the stored status was never rewritten (a PAUSED posting then reports PAUSED, not EXPIRED)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer Acme APPROVED; posting with deadline 2026-10-01T12:00:00Z, PUBLISHED."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - call: "POST /job-postings"
              payload: { employer_id: "${emp_id}", title: "Deadline Intern", position_type: "INTERNSHIP", min_graduation_year: 2026, max_graduation_year: 2028, application_deadline: "2026-10-01T12:00:00Z" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { post_d_id: $.data.id }
            - call: "POST /job-postings/${post_d_id}/transition"
              payload: { to: "SUBMITTED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
            - call: "POST /job-postings/${post_d_id}/transition"
              payload: { to: "PUBLISHED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /job-postings/${post_d_id}"
              payload: {}
              as: PlatformAdmin
              captures: { proj_status: $.data.status }
            - call: "POST /job-postings/${post_d_id}/transition"
              payload: { to: "PAUSED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
          assert:
            - "after the clock passes the deadline, proj_status == EXPIRED"
            - "the PAUSED transition still returns 200 — legal only from stored PUBLISHED — and the posting now reports PAUSED (a stored status), not EXPIRED"

      - name: posting_clearance_block_cascades_then_clear_restores
        claim_type: Conditional Action
        grounds:
          - endpoints.POST_/job-postings/{id}/clearance
          - entities.JobPosting.fields.blocked_university_ids
          - errors.ERR_POSTING_BLOCKED_FOR_UNIVERSITY
          - state_machines.Application.SUBMITTED_to_AUTO_WITHDRAWN
        distinguishing_aspect: "The career-center per-posting block is actionable and reversible: BLOCK puts the university into blocked_university_ids, auto-withdraws that university's SUBMITTED application, and rejects fresh applications with 403 ERR_POSTING_BLOCKED_FOR_UNIVERSITY; CLEAR removes the block and the same apply then succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base fixture; Sam's application SUBMITTED; Sally ENROLLED and eligible."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_stu
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - *k_appr
            - *k_appr_ok
            - *k_post
            - *k_post_submit
            - *k_post_publish
            - *k_apply
            - &k_stu2
              call: "POST /students"
              payload: { university_id: "${uni_id}", email: "sally@stateu.edu", full_name: "Sally Kim", major: "CS", graduation_year: 2027, work_authorization: "US_CITIZEN", profile_visibility: "PUBLIC_TO_APPROVED_EMPLOYERS" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { stu2_id: $.data.id }
          trigger:
            - call: "POST /job-postings/${post_id}/clearance"
              payload: { university_id: "${uni_id}", decision: "BLOCK" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
            - call: "POST /applications"
              payload: { student_id: "${stu2_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sally-resume.pdf" }] }
              as: Student
              as_user_id: "${stu2_id}"
              captures: { blocked_err: $.data.error_id }
            - call: "POST /job-postings/${post_id}/clearance"
              payload: { university_id: "${uni_id}", decision: "CLEAR" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
            - call: "POST /applications"
              payload: { student_id: "${stu2_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sally-resume.pdf" }] }
              as: Student
              as_user_id: "${stu2_id}"
              captures: { app2_ok: $.data.id }
          assert:
            - "after BLOCK: GET /job-postings/${post_id} shows blocked_university_ids contains ${uni_id}"
            - "cascade: GET /applications/${app_id} shows AUTO_WITHDRAWN and active_application_count == 0"
            - "while blocked: Sally's apply returns 403 with blocked_err == ERR_POSTING_BLOCKED_FOR_UNIVERSITY"
            - "after CLEAR: blocked_university_ids is empty and the identical apply returns 201 with Application.${app2_ok}.status == SUBMITTED"

      - name: session_create_on_locked_event_returns_event_not_open
        claim_type: Conditional Action
        grounds:
          - state_machines.CareerEvent.OPEN_to_LOCKED
          - errors.ERR_EVENT_NOT_OPEN
          - endpoints.POST_/career-events/{id}/sessions
        distinguishing_aspect: "LOCKED freezes the session catalog: a session create against a LOCKED event fails 409 ERR_EVENT_NOT_OPEN even with a fresh OCC version — the state gate fires independently of the version check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE; event OPEN then LOCKED."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_event
            - *k_event_open
            - call: "POST /career-events/${ev_id}/transition"
              payload: { to: "LOCKED" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { ev_v3: $.data.version }
          trigger:
            - call: "POST /career-events/${ev_id}/sessions"
              payload: { title: "Late Booth", mode: "VIRTUAL", starts_at: "2026-10-10T13:00:00Z", ends_at: "2026-10-10T14:00:00Z", signup_deadline: "2026-10-09T23:59:59Z", capacity: 30, expected_career_event_version: "${ev_v3}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_EVENT_NOT_OPEN"
            - "err_id != ERR_STALE_CAREER_EVENT_VERSION — the supplied version was current"
            - "GET /career-events/${ev_id}/sessions returns 0 rows"

