            - call: "POST /ehr-migration-batches"
              payload: { acquisition_id: "${acq_id}", batch_label: "PLACEHOLDER-2026-A", source_system: "LEGACY_EMR", chart_type: "STRUCTURED", record_count: 0, contains_minor_records: false, last_encounter_on: "2026-07-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { batch_id: "$.data.id" }
          trigger:
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "EXTRACT" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_EMPTY_MIGRATION_BATCH with HTTP 422"
            - "EhrMigrationBatch.${batch_id}.status == STAGED and retry_count == 0"
            - "EhrMigrationBatch.${batch_id}.match_rate_bps == 0 and unprocessed_count == 0, both consistent with a record_count of 0"
            - "the batch was created with HTTP 201, so an empty batch is storable but not extractable"
            - "an IT_DATA_MIGRATION ReadinessTask on ${acq_id} cannot be completed while this batch is STAGED: that request returns ERR_MIGRATION_INCOMPLETE (422)"

      - name: second_live_credentialing_package_for_one_pair_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DUPLICATE_CREDENTIALING_PACKAGE]
          - validations[priority=10]
