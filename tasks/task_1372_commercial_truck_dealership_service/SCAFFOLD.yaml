scenario: |
  Commercial Truck Dealership & Service (Freightliner dealer): chassis/body spec
  configuration & vocational upfit, factory order slot & build cycle, floor-plan
  financing & inventory aging, service bay scheduling & downtime commitment,
  warranty claim & OEM reimbursement, parts counter & fleet account pricing,
  used truck trade & remarketing, mobile service & road call

domain_name: commercial-truck-dealership
api_prefix: /dealership

# =============================================================================
# Table 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # factory build slots, service bays, mobile units are finite contested pools
  secondary_archetype: ledger_reconciliation # floor-plan entries vs derived balance; warranty claimed vs approved vs paid
  complexity_layers:
    - optimistic_concurrency                 # OCC on CustomerAccount.version and Unit.version
    - cascading_side_effects                 # adjudicate -> RO -> account -> account status; cancel -> slot counters -> slot posture
    - dual_variant_calculation               # floor-plan actual accrual vs projected payoff; appraisal book vs market ACV
    - ops_run_checkpoint                     # daily sweep: interest accrual, aging buckets, curtailments, expiries, no-shows
  entity_topology: flat                      # peer entities joined by FK references; flat URL space
  state_machine_shape: cyclic                # dominant non-linear shape: order re-hold loop, appraisal counter loop, claim appeal loop, unit recon loop; RO carries two independent state dimensions
  relationship_patterns:
    - one_to_many
    - polymorphic                            # ServiceBooking reserves exactly one of ServiceBay | MobileServiceUnit
    - cross_aggregate                        # WarrantyClaim -> RepairOrder -> CustomerAccount cascades
  role_model: segregation_of_duties          # claim submitter cannot adjudicate own claim; offer/accept split across roles
  consistency_model: immediate               # all mutations atomic within the request

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Fleet or retail customer legal name" }
      - { name: account_type, type: enum, source: input, description: "FLEET | RETAIL; immutable after creation" }
      - { name: fleet_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | GOLD | PLATINUM; drives parts discount and RO labor discount" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Open-account credit ceiling; credit check applies only to FLEET accounts" }
      - { name: open_ar_cents, type: integer, source: computed, default: 0, description: "Sum of customer_due_cents over RepairOrders in INVOICED work_status plus committed-order cancellation fees minus posted payments" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD | CLOSED; CREDIT_HOLD auto-set when open_ar_cents > credit_limit_cents on a FLEET account, auto-clears when open_ar_cents <= credit_limit_cents" }

  - name: FactoryBuildSlot
    parent: null
    common_fields: true
    fields:
      - { name: build_month, type: string, source: input, description: "Build month 'YYYY-MM'; unique together with vocation_group" }
      - { name: vocation_group, type: enum, source: input, description: "STANDARD | SEVERE" }
      - { name: capacity, type: integer, source: input, description: "Total build slots in this pool; must be >= 1" }
      - { name: held_count, type: integer, source: computed, default: 0, description: "Orders currently in SLOT_HELD against this pool" }
      - { name: committed_count, type: integer, source: computed, default: 0, description: "Orders in COMMITTED | IN_PRODUCTION | SHIPPED | DELIVERED against this pool" }
      - { name: slots_available, type: integer, source: computed, description: "capacity - held_count - committed_count; never negative" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | CLOSED; LOCKED when slots_available == 0, reopens to OPEN when a release makes slots_available > 0 before month close; CLOSED by sweep once clock date is past the build month" }

  - name: FactoryOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_account_id, type: string, source: input, description: "FK -> CustomerAccount.id; nullable — null means dealer stock order", constraints: "nullable" }
      - { name: factory_build_slot_id, type: string, source: input, description: "FK -> FactoryBuildSlot.id" }
      - { name: chassis_model, type: enum, source: input, description: "CASCADIA_126 | M2_106 | SD_114" }
      - { name: engine_option, type: enum, source: input, description: "DD13 | DD15 | CUMMINS_X15" }
      - { name: axle_config, type: enum, source: input, description: "A4X2 | A6X4" }
      - { name: vocation_group, type: enum, source: computed, description: "Copied from the slot pool's vocation_group at hold time" }
      - { name: upfit_lines, type: array, source: input, description: "Array of { component_code, price_cents } embedded at create or via add-upfit-lines; component_code in DUMP_BODY | REEFER_BOX | CRANE_PTO | LIFTGATE | VAN_BODY" , default: [] }
      - { name: hold_expires_at, type: datetime, source: computed, description: "Logical clock at hold + 14 days; sweep expires holds past this" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "factory_order_price computed at creation with tier snapshot at that moment" }
      - { name: committed_total_cents, type: integer, source: computed, description: "factory_order_price recomputed and locked at commit" }
      - { name: received_unit_id, type: string, source: system, description: "Unit created at receive; null until DELIVERED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SLOT_HELD | COMMITTED | IN_PRODUCTION | SHIPPED | DELIVERED | CANCELLED | EXPIRED" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: vin, type: string, source: input, description: "17-char VIN; unique across all units" }
      - { name: unit_kind, type: enum, source: system, description: "NEW (from factory order receive) | USED (from accepted trade appraisal)" }
      - { name: factory_order_id, type: string, source: system, description: "FK -> FactoryOrder.id; set for NEW units", constraints: "nullable" }
      - { name: trade_appraisal_id, type: string, source: system, description: "FK -> TradeAppraisal.id; set for USED units", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | RECONDITIONING | READY | SOLD | WHOLESALED" }
      - { name: invoice_cost_cents, type: integer, source: system, description: "NEW: order committed_total_cents; USED: accepted offered_allowance_cents" }
      - { name: stocking_date, type: string, source: system, description: "Logical calendar date (YYYY-MM-DD) the unit entered inventory" }
      - { name: days_in_stock, type: integer, source: computed, description: "clock_date - stocking_date in whole days; recomputed on read and by sweep" }
      - { name: aging_bucket, type: enum, source: computed, description: "B0_90 (days<=90) | B91_180 (91..180) | B181_270 (181..270) | B271_365 (271..365) | OVER_365 (>=366)" }
      - { name: floorplan_active, type: boolean, source: system, description: "true for NEW units, false for USED units" }
      - { name: apr_bp, type: integer, source: input, default: 690, description: "Floor-plan APR in basis points (690 = 6.90%); captured at receive" }
      - { name: floorplan_balance_cents, type: integer, source: computed, default: 0, description: "Invariant: == signed sum of FloorPlanEntry.amount_cents for this unit" }
      - { name: last_accrual_date, type: string, source: system, description: "Last date through which interest has been posted (YYYY-MM-DD); null until first sweep", constraints: "nullable" }
      - { name: curtailment_due_cents, type: integer, source: computed, default: 0, description: "Scheduled curtailment: 10% of invoice_cost when days_in_stock >= 181; 25% when >= 271; 100% when >= 366; else 0" }
      - { name: recondition_count, type: integer, source: system, default: 0, description: "Increments each time the unit enters RECONDITIONING from READY or fails inspection while RECONDITIONING" }
      - { name: sold_price_cents, type: integer, source: system, description: "Set at sell", constraints: "nullable" }
      - { name: sold_at, type: datetime, source: system, description: "Set at sell", constraints: "nullable" }
      - { name: wholesale_price_cents, type: integer, source: system, description: "Set at wholesale", constraints: "nullable" }
      - { name: wholesale_loss_cents, type: integer, source: computed, description: "max(0, invoice_cost_cents - wholesale_price_cents) at wholesale" }

  - name: FloorPlanEntry
    parent: null
    common_fields: false
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id" }
      - { name: entry_type, type: enum, source: system, description: "ADVANCE | INTEREST_ACCRUAL | CURTAILMENT | PAYOFF | ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed: ADVANCE/INTEREST_ACCRUAL positive, CURTAILMENT/PAYOFF negative, ADJUSTMENT either" }
      - { name: entry_date, type: string, source: system, description: "Logical clock date (YYYY-MM-DD) at posting" }
      - { name: note, type: string, source: input, description: "Free-text note for ADJUSTMENT entries", constraints: "nullable" }
      - { name: resulting_balance_cents, type: integer, source: computed, description: "Running balance after this entry in chronological replay order (entry_date ASC, created_at ASC tie-break)" }

  - name: TradeAppraisal
    parent: null
    common_fields: true
    fields:
      - { name: customer_account_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: trade_vin, type: string, source: input, description: "VIN of the customer's trade vehicle (not a Unit)" }
      - { name: model_year, type: integer, source: input, description: "Model year of trade vehicle" }
      - { name: mileage, type: integer, source: input, description: "Odometer miles" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C" }
      - { name: base_book_value_cents, type: integer, source: input, description: "Guide book value at appraisal intake" }
      - { name: book_estimate_cents, type: integer, source: computed, description: "BOOK variant: see trade_allowance_estimate calculation" }
      - { name: market_index_bp, type: integer, source: input, description: "Market adjustment index in basis points at offer time (10000 = 1.00)", constraints: "nullable" }
      - { name: offer_acv_cents, type: integer, source: computed, description: "MARKET variant ACV computed at each offer", constraints: "nullable" }
      - { name: offered_allowance_cents, type: integer, source: system, description: "Allowance offered by SalesManager; must be <= offer_acv_cents", constraints: "nullable" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "Logical clock at offer + 10 days; sweep expires OFFERED appraisals past this", constraints: "nullable" }
      - { name: offer_round, type: integer, source: system, default: 0, description: "Increments on every offer" }
      - { name: created_unit_id, type: string, source: system, description: "USED Unit created at accept", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | NEGOTIATING | ACCEPTED | DECLINED | EXPIRED | CONSUMED" }

  - name: ServiceBay
    parent: null
    common_fields: true
    fields:
      - { name: bay_code, type: string, source: input, description: "Unique bay identifier" }
      - { name: bay_type, type: enum, source: input, description: "STANDARD | HEAVY_ALIGNMENT" }
      - { name: open_hour, type: integer, source: input, default: 7, description: "Daily opening hour (0-23)" }
      - { name: close_hour, type: integer, source: input, default: 19, description: "Daily closing hour (1-24), must be > open_hour" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE" }

  - name: MobileServiceUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Unique mobile unit identifier" }
      - { name: default_travel_minutes, type: integer, source: input, default: 30, description: "Default one-way travel buffer applied to bookings" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_account_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; exactly one of unit_id / external_vin required", constraints: "nullable" }
      - { name: external_vin, type: string, source: input, description: "VIN for customer-owned vehicles not in inventory; exactly one of unit_id / external_vin required", constraints: "nullable" }
      - { name: concern, type: string, source: input, description: "Customer complaint text" }
      - { name: promised_ready_at, type: datetime, source: input, description: "Downtime commitment timestamp" }
      - { name: labor_rate_cents, type: integer, source: input, default: 16500, description: "Shop labor rate per hour in cents" }
      - { name: auth_status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | DECLINED | CANCELLED — independent dimension 1" }
      - { name: work_status, type: enum, source: system, description: "OPEN | SCHEDULED | IN_PROGRESS | COMPLETED | INVOICED | PAID | CANCELLED — independent dimension 2" }
      - { name: labor_sum_cents, type: integer, source: computed, default: 0, description: "Sum of LABOR line totals" }
      - { name: parts_sum_cents, type: integer, source: computed, default: 0, description: "Sum of PART line totals" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Fleet tier discount on labor only (STANDARD 0% | GOLD 10% | PLATINUM 20%), computed at invoice" }
      - { name: shop_supplies_fee_cents, type: integer, source: computed, default: 0, description: "min(round_half_up(0.05 * (labor_sum_cents - discount_cents)), 3500), computed at invoice" }
      - { name: warranty_covered_cents, type: integer, source: computed, default: 0, description: "Sum of approved_labor_cents + approved_parts_cents over claims in APPROVED | SHORT_PAID | PAID" }
      - { name: customer_due_cents, type: integer, source: computed, default: 0, description: "labor_sum - discount + parts_sum + shop_supplies_fee - downtime_penalty - warranty_covered; computed at invoice, recomputed on adjudication and completion" }
      - { name: downtime_penalty_cents, type: integer, source: computed, default: 0, description: "See downtime_penalty calculation; computed at complete-work" }
      - { name: work_started_at, type: datetime, source: system, description: "Set at start-work", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Set at complete-work", constraints: "nullable" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "Set by sweep when IN_PROGRESS past promised_ready_at + 120 min grace" }

  - name: RepairOrderLine
    parent: null
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id" }
      - { name: line_type, type: enum, source: input, description: "LABOR | PART" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; required iff line_type == PART", constraints: "nullable" }
      - { name: description, type: string, source: input, description: "Free-text line description", constraints: "nullable" }
      - { name: hours, type: number, source: input, description: "Labor hours; required iff line_type == LABOR, must be > 0", constraints: "nullable" }
      - { name: quantity, type: integer, source: input, description: "Part quantity; required iff line_type == PART, must be >= 1", constraints: "nullable" }
      - { name: unit_price_cents, type: integer, source: system, description: "LABOR: labor_rate_cents snapshot from the RO; PART: Part.list_price_cents snapshot at add time" }
      - { name: line_total_cents, type: integer, source: computed, description: "LABOR: round_half_up(hours * unit_price_cents); PART: quantity * unit_price_cents" }
      - { name: warranty_eligible, type: boolean, source: input, default: false, description: "Whether this line may be included in a warranty claim" }

  - name: ServiceBooking
    parent: null
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id" }
      - { name: service_bay_id, type: string, source: input, description: "FK -> ServiceBay.id; exactly one of service_bay_id / mobile_service_unit_id required", constraints: "nullable" }
      - { name: mobile_service_unit_id, type: string, source: input, description: "FK -> MobileServiceUnit.id; exactly one of service_bay_id / mobile_service_unit_id required", constraints: "nullable" }
      - { name: start_at, type: datetime, source: input, description: "Booking start (ISO8601)" }
      - { name: end_at, type: datetime, source: input, description: "Booking end (ISO8601), must be > start_at" }
      - { name: travel_minutes, type: integer, source: input, default: 0, description: "One-way travel buffer for mobile bookings; must be 0 for bay bookings" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: checked_in_at, type: datetime, source: system, description: "Set at check-in", constraints: "nullable" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id" }
      - { name: claimed_labor_cents, type: integer, source: input, description: "Labor amount claimed; must be <= sum of line_total_cents over warranty_eligible LABOR lines and >= 0" }
      - { name: claimed_parts_cents, type: integer, source: input, description: "Parts amount claimed; must be <= sum of line_total_cents over warranty_eligible PART lines and >= 0" }
      - { name: approved_labor_cents, type: integer, source: system, description: "OEM-approved labor; set at adjudication", constraints: "nullable" }
      - { name: approved_parts_cents, type: integer, source: system, description: "OEM-approved parts; set at adjudication", constraints: "nullable" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative OEM payments posted" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit; segregation-of-duties anchor" }
      - { name: submitted_at, type: datetime, source: system, description: "Set at submit", constraints: "nullable" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Set at adjudication", constraints: "nullable" }
      - { name: denial_reason, type: string, source: input, description: "Required when adjudication outcome is DENY", constraints: "nullable" }
      - { name: appeal_notes, type: string, source: input, description: "Required at appeal", constraints: "nullable" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Increments on each appeal" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | SHORT_PAID | DENIED | APPEALED | PAID | CLOSED | WRITTEN_OFF" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique part number" }
      - { name: part_name, type: string, source: input, description: "Display name" }
      - { name: list_price_cents, type: integer, source: input, description: "List price; must be > 0" }
      - { name: cost_cents, type: integer, source: input, description: "Dealer cost; must be >= 0" }
      - { name: on_hand, type: integer, source: input, default: 0, description: "Stock quantity; decremented at sale, restored at return" }
      - { name: has_core_charge, type: boolean, source: input, default: false, description: "Whether a core charge applies" }
      - { name: core_charge_cents, type: integer, source: input, default: 0, description: "Core charge per unit, never discounted" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

  - name: PartsSale
    parent: null
    common_fields: true
    fields:
      - { name: customer_account_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: lines, type: array, source: input, description: "Array of { part_id, quantity }; each persisted as a PartsSaleLine" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of discounted line totals (per-line rounding pinned in parts_line_pricing)" }
      - { name: core_total_cents, type: integer, source: computed, description: "Sum of core charges (never discounted)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + core_total_cents" }
      - { name: sold_at, type: datetime, source: system, description: "Logical clock timestamp at creation; restocking-fee clock anchor" }
      - { name: status, type: enum, source: system, description: "INVOICED | PARTIALLY_RETURNED | FULLY_RETURNED" }

  - name: PartsSaleLine
    parent: null
    common_fields: true
    fields:
      - { name: parts_sale_id, type: string, source: system, description: "FK -> PartsSale.id" }
      - { name: part_id, type: string, source: system, description: "FK -> Part.id" }
      - { name: quantity, type: integer, source: system, description: "Quantity sold" }
      - { name: unit_net_price_cents, type: integer, source: computed, description: "round_half_up(list_price_cents * (1 - effective_discount)); see parts_line_pricing" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_net_price_cents * quantity" }
      - { name: returned_quantity, type: integer, source: system, default: 0, description: "Cumulative returned quantity" }
      - { name: return_credit_cents, type: integer, source: computed, default: 0, description: "Cumulative credit issued for returns of this line" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: FactoryBuildSlot
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "system (automatic when a hold/commit/re-hold makes slots_available == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: OPEN
        trigger: "system (automatic when a cancel/expire release makes slots_available > 0 while build month not closed)"
        actor: system
        preconditions:
          - "clock date is within or before the build_month (month not closed)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /dealership/ops/run-daily-sweep (clock date past build_month end)"
        actor: system
        preconditions: []
        side_effects:
          - "All orders still SLOT_HELD on this pool -> EXPIRED (with normal release cascade on held_count)"

  - entity: FactoryOrder
    initial_state: SLOT_HELD
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SLOT_HELD
        to: COMMITTED
        trigger: "POST /dealership/factory-orders/{id}/commit"
        actor: SalesConsultant
        preconditions:
          - "order.status == SLOT_HELD (ERR_ORDER_STATE)"
          - "logical clock < hold_expires_at (ERR_ORDER_STATE — hold already lapsed, wait for sweep or re-hold after EXPIRED)"
        side_effects:
          - "committed_total_cents locked via factory_order_price recomputed at commit time"
          - "slot.held_count -= 1; slot.committed_count += 1"
      - from: SLOT_HELD
        to: CANCELLED
        trigger: "POST /dealership/factory-orders/{id}/cancel"
        actor: SalesConsultant
        preconditions:
          - "order.status IN {SLOT_HELD, COMMITTED} (ERR_ORDER_STATE)"
        side_effects:
          - "slot.held_count -= 1 (release)"
          - "slot release re-evaluates slot posture: if slot.status == LOCKED and slots_available > 0 and month not closed -> slot OPEN"
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /dealership/factory-orders/{id}/cancel"
        actor: SalesConsultant
        preconditions:
          - "order.status IN {SLOT_HELD, COMMITTED} (ERR_ORDER_STATE)"
        side_effects:
          - "slot.committed_count -= 1 (release)"
          - "slot release re-evaluates slot posture (LOCKED -> OPEN when slots_available > 0 and month not closed)"
          - "cancellation fee = round_half_up(committed_total_cents * 0.02) added to customer_account.open_ar_cents when customer_account_id is not null"
          - "customer_account open_ar change re-evaluates credit posture: FLEET account with open_ar_cents > credit_limit_cents -> CREDIT_HOLD"
      - from: SLOT_HELD
        to: EXPIRED
        trigger: "POST /dealership/ops/run-daily-sweep (hold_expires_at <= clock)"
        actor: system
        preconditions: []
        side_effects:
          - "slot.held_count -= 1 (release)"
          - "slot release re-evaluates slot posture (LOCKED -> OPEN when slots_available > 0 and month not closed)"
      - from: EXPIRED
        to: SLOT_HELD
        trigger: "POST /dealership/factory-orders/{id}/re-hold"
        actor: SalesConsultant
        preconditions:
          - "order.status == EXPIRED (ERR_ORDER_STATE)"
          - "target slot pool status == OPEN and slots_available >= 1 (ERR_SLOT_POOL_EXHAUSTED)"
          - "target slot pool build month not closed (ERR_SLOT_MONTH_CLOSED)"
        side_effects:
          - "factory_build_slot_id updated to the new pool"
          - "vocation_group refreshed from the new pool"
          - "hold_expires_at = clock + 14 days"
          - "new slot.held_count += 1; if slots_available becomes 0 -> slot LOCKED"
      - from: COMMITTED
        to: IN_PRODUCTION
        trigger: "POST /dealership/ops/run-daily-sweep (clock date >= first day of build_month)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: SHIPPED
        trigger: "POST /dealership/ops/run-daily-sweep (clock date >= first day of build_month + 14 days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /dealership/factory-orders/{id}/receive"
        actor: SalesManager
        preconditions:
          - "order.status == SHIPPED (ERR_ORDER_STATE)"
          - "vin not already used by another unit (ERR_DUPLICATE_VIN)"
        side_effects:
          - "creates Unit: unit_kind=NEW, status=IN_STOCK, invoice_cost_cents=committed_total_cents, stocking_date=clock date, floorplan_active=true, apr_bp from payload"
          - "unit creation posts FloorPlanEntry ADVANCE = invoice_cost_cents (because floorplan_active), setting floorplan_balance_cents = invoice_cost_cents and last_accrual_date = stocking_date"
          - "received_unit_id set on the order"

  - entity: Unit
    initial_state: IN_STOCK
    terminal_states: [SOLD, WHOLESALED]
    transitions:
      - from: IN_STOCK
        to: READY
        trigger: "POST /dealership/units/{id}/inspect with outcome=PASS"
        actor: ServiceManager
        preconditions:
          - "unit.status IN {IN_STOCK, RECONDITIONING, READY} (ERR_UNIT_STATE)"
        side_effects: []
      - from: IN_STOCK
        to: RECONDITIONING
        trigger: "POST /dealership/units/{id}/inspect with outcome=FAIL"
        actor: ServiceManager
        preconditions:
          - "unit.status IN {IN_STOCK, RECONDITIONING, READY} (ERR_UNIT_STATE)"
        side_effects:
          - "recondition_count += 1"
      - from: RECONDITIONING
        to: READY
        trigger: "POST /dealership/units/{id}/inspect with outcome=PASS"
        actor: ServiceManager
        preconditions:
          - "unit.status IN {IN_STOCK, RECONDITIONING, READY} (ERR_UNIT_STATE)"
        side_effects: []
      - from: RECONDITIONING
        to: RECONDITIONING
        trigger: "POST /dealership/units/{id}/inspect with outcome=FAIL"
        actor: ServiceManager
        preconditions:
          - "unit.status IN {IN_STOCK, RECONDITIONING, READY} (ERR_UNIT_STATE)"
        side_effects:
          - "recondition_count += 1"
      - from: READY
        to: RECONDITIONING
        trigger: "POST /dealership/units/{id}/inspect with outcome=FAIL"
        actor: ServiceManager
        preconditions:
          - "unit.status IN {IN_STOCK, RECONDITIONING, READY} (ERR_UNIT_STATE)"
        side_effects:
          - "recondition_count += 1"
      - from: READY
        to: SOLD
        trigger: "POST /dealership/units/{id}/sell"
        actor: SalesConsultant
        preconditions:
          - "unit.status == READY (ERR_UNIT_NOT_SELLABLE)"
          - "buyer account status == ACTIVE (ERR_ACCOUNT_ON_CREDIT_HOLD)"
          - "if trade_appraisal_id provided: appraisal.status == ACCEPTED and appraisal.customer_account_id == buyer id (ERR_APPRAISAL_STATE)"
        side_effects:
          - "posts INTEREST_ACCRUAL entry bringing last_accrual_date to clock date (floor-plan units only), then posts PAYOFF entry = -floorplan_balance_cents, driving floorplan_balance_cents to 0"
          - "sold_price_cents, sold_at set"
          - "if trade_appraisal_id provided: appraisal -> CONSUMED"
      - from: READY
        to: WHOLESALED
        trigger: "POST /dealership/units/{id}/wholesale"
        actor: SalesManager
        preconditions:
          - "unit.status == READY (ERR_UNIT_NOT_SELLABLE)"
          - "aging_bucket IN {B181_270, B271_365, OVER_365} (ERR_UNIT_NOT_WHOLESALE_ELIGIBLE)"
        side_effects:
          - "posts INTEREST_ACCRUAL to clock date, then PAYOFF = -floorplan_balance_cents (floor-plan units only)"
          - "wholesale_price_cents set; wholesale_loss_cents = max(0, invoice_cost_cents - wholesale_price_cents)"

  - entity: TradeAppraisal
    initial_state: DRAFT
    terminal_states: [DECLINED, EXPIRED, CONSUMED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /dealership/trade-appraisals/{id}/offer"
        actor: SalesManager
        preconditions:
          - "appraisal.status IN {DRAFT, NEGOTIATING} (ERR_APPRAISAL_STATE)"
          - "offered_allowance_cents <= offer_acv_cents computed from payload market_index_bp (ERR_APPRAISAL_OFFER_EXCEEDS_ACV)"
        side_effects:
          - "offer_acv_cents computed (MARKET variant) and stored"
          - "offered_allowance_cents stored; offer_expires_at = clock + 10 days; offer_round += 1"
      - from: NEGOTIATING
        to: OFFERED
        trigger: "POST /dealership/trade-appraisals/{id}/offer"
        actor: SalesManager
        preconditions:
          - "appraisal.status IN {DRAFT, NEGOTIATING} (ERR_APPRAISAL_STATE)"
          - "offered_allowance_cents <= offer_acv_cents (ERR_APPRAISAL_OFFER_EXCEEDS_ACV)"
        side_effects:
          - "same as DRAFT -> OFFERED"
      - from: OFFERED
        to: NEGOTIATING
        trigger: "POST /dealership/trade-appraisals/{id}/counter"
        actor: FleetCustomer
        preconditions:
          - "appraisal.status == OFFERED (ERR_APPRAISAL_STATE)"
          - "X-User-ID == appraisal.customer_account_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /dealership/trade-appraisals/{id}/accept"
        actor: FleetCustomer
        preconditions:
          - "appraisal.status == OFFERED (ERR_APPRAISAL_STATE)"
          - "X-User-ID == appraisal.customer_account_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "logical clock < offer_expires_at (ERR_APPRAISAL_STATE)"
        side_effects:
          - "creates Unit: unit_kind=USED, status=RECONDITIONING, vin=trade_vin, invoice_cost_cents=offered_allowance_cents, stocking_date=clock date, floorplan_active=false"
          - "created_unit_id set on the appraisal"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /dealership/trade-appraisals/{id}/decline"
        actor: FleetCustomer
        preconditions:
          - "appraisal.status == OFFERED (ERR_APPRAISAL_STATE)"
          - "X-User-ID == appraisal.customer_account_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /dealership/ops/run-daily-sweep (offer_expires_at <= clock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: CONSUMED
        trigger: "system (side effect of POST /dealership/units/{id}/sell referencing this appraisal)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServiceBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /dealership/service-bookings/{id}/check-in"
        actor: ServiceAdvisor
        preconditions:
          - "booking.status == BOOKED (ERR_BOOKING_STATE)"
        side_effects:
          - "checked_in_at = logical clock"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /dealership/service-bookings/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "booking.status IN {BOOKED, CHECKED_IN} (ERR_BOOKING_STATE)"
        side_effects:
          - "if no remaining booking of the RO is in BOOKED | CHECKED_IN and ro.work_status == SCHEDULED -> ro.work_status = OPEN"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /dealership/service-bookings/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "booking.status IN {BOOKED, CHECKED_IN} (ERR_BOOKING_STATE)"
        side_effects:
          - "same RO demotion check as BOOKED -> CANCELLED"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /dealership/ops/run-daily-sweep (clock > start_at + 60 min and never checked in)"
        actor: system
        preconditions: []
        side_effects:
          - "if no remaining booking of the RO is in BOOKED | CHECKED_IN and ro.work_status == SCHEDULED -> ro.work_status = OPEN"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (side effect of POST /dealership/repair-orders/{id}/complete-work on its RO)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RepairOrder
    initial_state: "auth_status=DRAFT, work_status=OPEN"
    terminal_states: ["auth_status=CANCELLED / work_status=CANCELLED", "work_status=PAID"]
    transitions:
      - from: "auth DRAFT"
        to: "auth PENDING_APPROVAL"
        trigger: "POST /dealership/repair-orders/{id}/submit-estimate"
        actor: ServiceAdvisor
        preconditions:
          - "auth_status == DRAFT (ERR_RO_NOT_AWAITING_CUSTOMER)"
          - "at least one RepairOrderLine exists (ERR_RO_STATE)"
        side_effects: []
      - from: "auth PENDING_APPROVAL"
        to: "auth APPROVED"
        trigger: "POST /dealership/repair-orders/{id}/approve-estimate"
        actor: FleetCustomer
        preconditions:
          - "auth_status == PENDING_APPROVAL (ERR_RO_NOT_AWAITING_CUSTOMER)"
          - "X-User-ID == ro.customer_account_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []
      - from: "auth PENDING_APPROVAL"
        to: "auth DECLINED"
        trigger: "POST /dealership/repair-orders/{id}/decline-estimate"
        actor: FleetCustomer
        preconditions:
          - "auth_status == PENDING_APPROVAL (ERR_RO_NOT_AWAITING_CUSTOMER)"
          - "X-User-ID == ro.customer_account_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []
      - from: "auth DECLINED"
        to: "auth DRAFT"
        trigger: "POST /dealership/repair-orders/{id}/revise"
        actor: ServiceAdvisor
        preconditions:
          - "auth_status == DECLINED (ERR_RO_STATE)"
          - "work_status IN {OPEN, SCHEDULED} (ERR_RO_STATE)"
        side_effects: []
      - from: "work OPEN"
        to: "work SCHEDULED"
        trigger: "system (side effect of first ServiceBooking creation for this RO)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "work OPEN | SCHEDULED"
        to: "work IN_PROGRESS"
        trigger: "POST /dealership/repair-orders/{id}/start-work"
        actor: ServiceAdvisor
        preconditions:
          - "auth_status == APPROVED (ERR_RO_NOT_APPROVED)"
          - "work_status IN {OPEN, SCHEDULED} (ERR_RO_STATE)"
          - "exists a ServiceBooking with repair_order_id == ro.id and status == CHECKED_IN (ERR_BOOKING_NOT_CHECKED_IN)"
        side_effects:
          - "work_started_at = logical clock"
      - from: "work IN_PROGRESS"
        to: "work COMPLETED"
        trigger: "POST /dealership/repair-orders/{id}/complete-work"
        actor: ServiceAdvisor
        preconditions:
          - "work_status == IN_PROGRESS (ERR_RO_STATE)"
        side_effects:
          - "completed_at = logical clock"
          - "downtime_penalty_cents computed (see downtime_penalty)"
          - "all CHECKED_IN bookings of this RO -> COMPLETED"
      - from: "work COMPLETED"
        to: "work INVOICED"
        trigger: "POST /dealership/repair-orders/{id}/invoice"
        actor: ServiceManager
        preconditions:
          - "work_status == COMPLETED (ERR_RO_STATE)"
          - "FLEET account: customer_due_cents + account.open_ar_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "account status != CLOSED (ERR_ACCOUNT_ON_CREDIT_HOLD)"
        side_effects:
          - "discount_cents, shop_supplies_fee_cents, customer_due_cents computed (see repair_order_totals)"
          - "account.open_ar_cents += customer_due_cents"
          - "open_ar change re-evaluates credit posture: FLEET with open_ar_cents > credit_limit_cents -> CREDIT_HOLD (cannot trigger here because the fiscal check just passed, but later adjudication-driven reductions can clear a CREDIT_HOLD)"
      - from: "work INVOICED"
        to: "work PAID"
        trigger: "POST /dealership/repair-orders/{id}/post-payment"
        actor: Controller
        preconditions:
          - "work_status == INVOICED (ERR_RO_STATE)"
          - "amount_cents == customer_due_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "account.open_ar_cents -= amount_cents"
          - "open_ar change re-evaluates credit posture: FLEET on CREDIT_HOLD with open_ar_cents <= credit_limit_cents -> ACTIVE"
      - from: "any non-terminal (auth, work)"
        to: "auth CANCELLED, work CANCELLED"
        trigger: "POST /dealership/repair-orders/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "work_status NOT IN {INVOICED, PAID, CANCELLED} (ERR_RO_STATE)"
        side_effects:
          - "all BOOKED | CHECKED_IN bookings of this RO -> CANCELLED"

  - entity: WarrantyClaim
    initial_state: DRAFT
    terminal_states: [PAID, CLOSED, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dealership/warranty-claims/{id}/submit"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == DRAFT (ERR_CLAIM_STATE)"
          - "ro.work_status == INVOICED (ERR_RO_STATE)"
        side_effects:
          - "submitted_by_user_id = X-User-ID; submitted_at = clock"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dealership/warranty-claims/{id}/adjudicate with outcome=APPROVE"
        actor: OEMClaimsAdjudicator
        preconditions:
          - "claim.status IN {SUBMITTED, APPEALED} (ERR_CLAIM_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_labor_cents = claimed_labor_cents; approved_parts_cents = claimed_parts_cents"
          - "adjudicated_at = clock"
          - "CASCADE L2: ro.warranty_covered_cents recomputed = sum of approved totals over claims in APPROVED | SHORT_PAID | PAID; ro.customer_due_cents recomputed"
          - "CASCADE L3: if ro.work_status == INVOICED, account.open_ar_cents adjusted by the customer_due delta"
          - "CASCADE L4: account open_ar change re-evaluates credit posture (CREDIT_HOLD -> ACTIVE when open_ar_cents <= credit_limit_cents)"
      - from: SUBMITTED
        to: SHORT_PAID
        trigger: "POST /dealership/warranty-claims/{id}/adjudicate with outcome=SHORT_PAY"
        actor: OEMClaimsAdjudicator
        preconditions:
          - "claim.status IN {SUBMITTED, APPEALED} (ERR_CLAIM_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "approved_labor_cents <= claimed_labor_cents and approved_parts_cents <= claimed_parts_cents (ERR_APPROVAL_EXCEEDS_CLAIM)"
          - "approved_labor_cents + approved_parts_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "approved amounts stored; adjudicated_at = clock"
          - "same L2/L3/L4 cascade as APPROVED"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /dealership/warranty-claims/{id}/adjudicate with outcome=APPROVE"
        actor: OEMClaimsAdjudicator
        preconditions:
          - "claim.status IN {SUBMITTED, APPEALED} (ERR_CLAIM_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "same as SUBMITTED -> APPROVED"
      - from: APPEALED
        to: SHORT_PAID
        trigger: "POST /dealership/warranty-claims/{id}/adjudicate with outcome=SHORT_PAY"
        actor: OEMClaimsAdjudicator
        preconditions:
          - "same as SUBMITTED -> SHORT_PAID"
        side_effects:
          - "same as SUBMITTED -> SHORT_PAID"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /dealership/warranty-claims/{id}/adjudicate with outcome=DENY"
        actor: OEMClaimsAdjudicator
        preconditions:
          - "claim.status IN {SUBMITTED, APPEALED} (ERR_CLAIM_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "denial_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "approved_labor_cents = 0; approved_parts_cents = 0; adjudicated_at = clock"
      - from: APPEALED
        to: DENIED
        trigger: "POST /dealership/warranty-claims/{id}/adjudicate with outcome=DENY"
        actor: OEMClaimsAdjudicator
        preconditions:
          - "same as SUBMITTED -> DENIED"
        side_effects:
          - "same as SUBMITTED -> DENIED"
      - from: DENIED
        to: APPEALED
        trigger: "POST /dealership/warranty-claims/{id}/appeal"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status IN {DENIED, SHORT_PAID} (ERR_CLAIM_STATE)"
          - "appeal_notes present (ERR_INVALID_REQUEST)"
        side_effects:
          - "appeal_count += 1"
      - from: SHORT_PAID
        to: APPEALED
        trigger: "POST /dealership/warranty-claims/{id}/appeal"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status IN {DENIED, SHORT_PAID} (ERR_CLAIM_STATE)"
          - "appeal_notes present (ERR_INVALID_REQUEST)"
        side_effects:
          - "appeal_count += 1"
          - "ro.warranty_covered_cents recomputed (APPEALED claims no longer count) and customer_due / open_ar cascade re-run"
      - from: DENIED
        to: CLOSED
        trigger: "POST /dealership/warranty-claims/{id}/close"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == DENIED (ERR_CLAIM_STATE)"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /dealership/warranty-claims/{id}/post-payment (cumulative paid reaches approved total)"
        actor: Controller
        preconditions:
          - "claim.status IN {APPROVED, SHORT_PAID} (ERR_CLAIM_STATE)"
          - "amount_cents > 0 and paid_cents + amount_cents <= approved_labor_cents + approved_parts_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_cents += amount_cents; -> PAID when paid_cents == approved total"
      - from: SHORT_PAID
        to: PAID
        trigger: "POST /dealership/warranty-claims/{id}/post-payment"
        actor: Controller
        preconditions:
          - "same as APPROVED -> PAID"
        side_effects:
          - "same as APPROVED -> PAID"
      - from: APPROVED
        to: WRITTEN_OFF
        trigger: "POST /dealership/warranty-claims/{id}/write-off"
        actor: Controller
        preconditions:
          - "claim.status IN {APPROVED, SHORT_PAID} (ERR_CLAIM_STATE)"
          - "residual = approved total - paid_cents > 0 (ERR_WRITEOFF_RULE_VIOLATION)"
          - "residual <= 2500 OR clock > adjudicated_at + 45 days (ERR_WRITEOFF_RULE_VIOLATION)"
        side_effects:
          - "claim closed with residual absorbed as variance loss"
      - from: SHORT_PAID
        to: WRITTEN_OFF
        trigger: "POST /dealership/warranty-claims/{id}/write-off"
        actor: Controller
        preconditions:
          - "same as APPROVED -> WRITTEN_OFF"
        side_effects:
          - "same as APPROVED -> WRITTEN_OFF"

  - entity: PartsSale
    initial_state: INVOICED
    terminal_states: [FULLY_RETURNED]
    transitions:
      - from: INVOICED
        to: PARTIALLY_RETURNED
        trigger: "POST /dealership/parts-sale-lines/{id}/return (some but not all quantities returned)"
        actor: PartsCounterRep
        preconditions:
          - "path line id belongs to a sale whose status IN {INVOICED, PARTIALLY_RETURNED} (ERR_INVALID_REQUEST)"
          - "quantity >= 1 and line.returned_quantity + quantity <= line.quantity (ERR_RETURN_EXCEEDS_SOLD)"
        side_effects:
          - "line.returned_quantity += quantity"
          - "Part.on_hand += quantity"
          - "restocking fee: 15% of (unit_net_price_cents * quantity) when clock > sold_at + 30 days, else 0; return_credit = round_half_up(unit_net * qty) - fee, added to line.return_credit_cents"
          - "buyer account.open_ar_cents -= return_credit (floor at 0) for FLEET accounts"
      - from: PARTIALLY_RETURNED
        to: FULLY_RETURNED
        trigger: "POST /dealership/parts-sale-lines/{id}/return (all quantities returned)"
        actor: PartsCounterRep
        preconditions:
          - "same as INVOICED -> PARTIALLY_RETURNED"
        side_effects:
          - "same as INVOICED -> PARTIALLY_RETURNED"
      - from: INVOICED
        to: FULLY_RETURNED
        trigger: "POST /dealership/parts-sale-lines/{id}/return (single call returning all remaining quantities of one line)"
        actor: PartsCounterRep
        preconditions:
          - "same as INVOICED -> PARTIALLY_RETURNED"
        side_effects:
          - "same as INVOICED -> PARTIALLY_RETURNED"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: account-patch-stale-version
    parent_entity: CustomerAccount
    write_endpoint: "PATCH /dealership/customer-accounts/{id}"
    occ_field: expected_customer_account_version
    description: |
      Patching a CustomerAccount (fleet_tier, credit_limit_cents, or status) with
      an expected_customer_account_version the server no longer holds is rejected.
      The client's view of the account is stale because another write (including
      cascaded open_ar/status updates) has advanced the version since.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: unit-adjustment-stale-version
    parent_entity: Unit
    write_endpoint: "POST /dealership/units/{id}/floor-plan-adjustments"
    occ_field: expected_unit_version
    description: |
      Posting a manual floor-plan ADJUSTMENT against a Unit whose version has
      advanced since the client last observed it is rejected; the client computed
      the adjustment from a balance that no longer reflects the ledger.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: factory_order_price
    trigger: "factory order creation (provisional_total_cents) and commit (committed_total_cents)"
    algorithm: tiered_pricing
    formula: |
      chassis_base: CASCADIA_126=14500000, M2_106=9800000, SD_114=12300000
      engine_surcharge: DD13=0, DD15=1200000, CUMMINS_X15=1450000
      axle_surcharge: A4X2=0, A6X4=850000
      sub = chassis_base + engine_surcharge + axle_surcharge
      prior = count of FactoryOrders with the same customer_account_id in
              status IN {COMMITTED, IN_PRODUCTION, SHIPPED, DELIVERED}
              (dealer-stock orders with customer_account_id null count only
              toward themselves, i.e. prior=0)
      tier_pct: prior <= 2 -> 0.00; 3 <= prior <= 5 -> 0.02; prior >= 6 -> 0.04
      rebate_cents = round_half_up(sub * tier_pct)
      upfit_sum = sum of upfit_lines[].price_cents
      upfit_total = round_half_up(upfit_sum * mult) where mult = 1.08 if
                    vocation_group == SEVERE else 1.00
      total = sub - rebate_cents + upfit_total + DESTINATION_FEE
      Evaluation order is pinned exactly as written; the tier snapshot uses the
      order count at the moment the calculation runs (create vs commit may
      legitimately differ).
    constants:
      DESTINATION_FEE: 285000
    precision: "integer cents, round_half_up at each rounding step"
    variants:
      - name: provisional
        when: "computed at POST /dealership/factory-orders"
        difference: "tier snapshot taken at creation; stored in provisional_total_cents"
      - name: committed
        when: "computed at POST /dealership/factory-orders/{id}/commit"
        difference: "tier snapshot re-taken at commit; stored in committed_total_cents and locked"

  - name: parts_line_pricing
    trigger: "POST /dealership/parts-sales"
    algorithm: tiered_pricing
    formula: |
      Per line, in this exact order:
        tier_discount: STANDARD=0.00, GOLD=0.10, PLATINUM=0.20 (from account.fleet_tier)
        qty_break: quantity >= 10 -> +0.05
        effective_discount = min(tier_discount + qty_break, 0.40)
        unit_net_price_cents = round_half_up(list_price_cents * (1 - effective_discount))
        line_total_cents = unit_net_price_cents * quantity
      Sale level:
        subtotal_cents = sum(line_total_cents)          -- per-line rounding THEN sum (pinned)
        core_total_cents = sum(core_charge_cents * quantity over lines whose part.has_core_charge)
        total_cents = subtotal_cents + core_total_cents -- cores never discounted
      The alternative order (sum list prices, then discount once) is FORBIDDEN;
      per-line rounding is the pinned contract and yields different cents.
    constants:
      QTY_BREAK_THRESHOLD: 10
      QTY_BREAK_EXTRA: 0.05
      MAX_DISCOUNT: 0.40
    precision: "integer cents; round_half_up per line before summing"

  - name: repair_order_totals
    trigger: "POST /dealership/repair-orders/{id}/invoice; recomputed on adjudication and complete-work"
    algorithm: aggregation
    formula: |
      Evaluation order pinned (dependency: fee derives from discounted labor,
      discount derives from tier, covered derives from claims):
        1. labor_sum_cents  = sum(line_total_cents over LABOR lines)
        2. parts_sum_cents  = sum(line_total_cents over PART lines)
        3. discount_cents   = round_half_up(labor_sum_cents * tier_pct)
           tier_pct: STANDARD=0.00, GOLD=0.10, PLATINUM=0.20
        4. shop_supplies_fee_cents = min(round_half_up(0.05 * (labor_sum_cents - discount_cents)), 3500)
        5. warranty_covered_cents = sum(approved_labor_cents + approved_parts_cents
           over claims in {APPROVED, SHORT_PAID, PAID})
        6. customer_due_cents = labor_sum_cents - discount_cents + parts_sum_cents
           + shop_supplies_fee_cents - downtime_penalty_cents - warranty_covered_cents
      customer_due_cents is floored at 0.
    constants:
      SHOP_SUPPLIES_RATE: 0.05
      SHOP_SUPPLIES_CAP: 3500
    precision: "integer cents, round_half_up"

  - name: downtime_penalty
    trigger: "POST /dealership/repair-orders/{id}/complete-work"
    algorithm: threshold
    formula: |
      late_minutes = max(0, (completed_at - promised_ready_at) in whole minutes)
      penalty_minutes = max(0, late_minutes - GRACE_MINUTES)
      raw = round_half_up(penalty_minutes / 60 * labor_rate_cents * 0.25)
      downtime_penalty_cents = min(raw, round_half_up(labor_sum_cents * 0.50))
      Boundary: exactly GRACE_MINUTES late -> penalty 0; GRACE_MINUTES+1 -> nonzero.
    constants:
      GRACE_MINUTES: 120
      PENALTY_RATE: 0.25
      PENALTY_CAP_LABOR_FRACTION: 0.50
    precision: "integer cents, round_half_up"

  - name: floor_plan_interest
    trigger: "POST /dealership/ops/run-daily-sweep; also forced at sell/wholesale before PAYOFF"
    algorithm: chronological
    formula: |
      Applies to units with floorplan_active == true and
      status IN {IN_STOCK, RECONDITIONING, READY} and floorplan_balance_cents > 0.
      days_elapsed = clock_date - last_accrual_date (whole days; skip when <= 0)
      interest = round_half_up(floorplan_balance_cents * apr_bp / 10000 / 360 * days_elapsed)
      Posts ONE INTEREST_ACCRUAL entry per unit per sweep run, then sets
      last_accrual_date = clock_date. Units are processed in
      stocking_date ASC, created_at ASC order (never id).
    constants:
      DENOMINATOR_DAYS: 360
    precision: "integer cents, round_half_up"
    variants:
      - name: actual_accrual
        when: "sweep posts ledger entries"
        difference: "chronological; balance only moves when a sweep (or sale) posts entries"
      - name: payoff_projection
        when: "GET /dealership/units/{id}/payoff-quote"
        difference: "forward-looking; includes interest projected through as_of_date without posting"

  - name: payoff_quote
    trigger: "GET /dealership/units/{id}/payoff-quote"
    algorithm: forward_looking
    formula: |
      as_of = input as_of_date or clock date when omitted
      proj_days = as_of - last_accrual_date (whole days, floor 0)
      projected_interest_cents = round_half_up(floorplan_balance_cents * apr_bp / 10000 / 360 * proj_days)
      payoff_cents = floorplan_balance_cents + projected_interest_cents + curtailment_due_cents
      Same unit, same clock: payoff_projection > actual_accrual balance whenever
      days have passed since the last sweep — the dual-variant divergence.
    constants:
      DENOMINATOR_DAYS: 360
    precision: "integer cents, round_half_up"

  - name: aging_and_curtailment
    trigger: "POST /dealership/ops/run-daily-sweep (and recomputed on read)"
    algorithm: threshold
    formula: |
      days_in_stock = clock_date - stocking_date (whole days)
      aging_bucket: days <= 90 -> B0_90; 91..180 -> B91_180; 181..270 -> B181_270;
                    271..365 -> B271_365; >= 366 -> OVER_365
      curtailment_due_cents: days >= 366 -> invoice_cost_cents;
                             days >= 271 -> round_half_up(invoice_cost_cents * 0.25);
                             days >= 181 -> round_half_up(invoice_cost_cents * 0.10);
                             else 0
      Boundaries: day 90 stays B0_90; day 180 -> curtailment 0; day 181 -> 10%.
    constants:
      BUCKET_1_END: 90
      BUCKET_2_END: 180
      BUCKET_3_END: 270
      BUCKET_4_END: 365
      CURTAIL_1: 0.10
      CURTAIL_2: 0.25
    precision: "integer cents, round_half_up"

  - name: trade_allowance_estimate
    trigger: "POST /dealership/trade-appraisals (BOOK) and POST .../offer (MARKET)"
    algorithm: decay_function
    formula: |
      BOOK variant (at creation):
        age_years = clock_year - model_year (floor 0)
        book = base_book_value_cents * max(0, 1 - 0.12 * age_years)
        excess_miles = max(0, mileage - 150000)
        book_estimate_cents = round_half_up(book) - excess_miles * 5 (floor 0)
      MARKET variant (at offer):
        condition_mult: A=1.10, B=1.00, C=0.85
        offer_acv_cents = round_half_up(book_estimate_cents * condition_mult * market_index_bp / 10000)
      The two variants deliberately produce different allowances for identical
      vehicle inputs; the offer is constrained by the MARKET variant only.
    constants:
      ANNUAL_DEPRECIATION: 0.12
      FREE_MILES: 150000
      MILEAGE_PENALTY_CENTS: 5
    precision: "integer cents, round_half_up"
    variants:
      - name: book
        when: "appraisal creation (DRAFT)"
        difference: "straight-line depreciation minus mileage penalty"
      - name: market
        when: "offer (OFFERED)"
        difference: "book estimate scaled by condition multiplier and market index"

  - name: warranty_reimbursement_variance
    trigger: "adjudication, post-payment, write-off"
    algorithm: aggregation
    formula: |
      approved_total = approved_labor_cents + approved_parts_cents
      residual_cents = approved_total - paid_cents
      variance_cents = claimed_labor_cents + claimed_parts_cents - approved_total (shortfall absorbed by dealer)
      write-off permitted only when residual_cents > 0 AND
        (residual_cents <= 2500 OR logical clock > adjudicated_at + 45 days)
    constants:
      WRITEOFF_SMALL_BALANCE: 2500
      WRITEOFF_AGE_DAYS: 45
    precision: "integer cents"

  - name: booking_overlap_check
    trigger: "POST /dealership/service-bookings"
    algorithm: interval_merge
    formula: |
      ServiceBay bookings: half-open [start_at, end_at).
        conflict iff existing.start_at < new.end_at AND new.start_at < existing.end_at
        (back-to-back a.end_at == b.start_at is ALLOWED).
        Additionally the booking must satisfy open_hour <= start hour and
        end_at <= same-day close_hour (ERR_BAY_OUTSIDE_OPERATING_HOURS).
      MobileServiceUnit bookings: effective CLOSED interval
        [start_at - travel_minutes, end_at + travel_minutes].
        conflict iff a_eff_start <= b_eff_end AND b_eff_start <= a_eff_end
        (an exact buffer touch counts as conflict — adjacency is NOT allowed).
      Only bookings in status BOOKED | CHECKED_IN participate; same resource only.
    constants:
      NO_SHOW_GRACE_MINUTES: 60
    precision: "minute resolution"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted on this endpoint per §1.5 roles", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Segregation of duties: adjudicator X-User-ID must differ from claim.submitted_by_user_id; ownership: FleetCustomer may only act on own account's appraisals/ROs", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /dealership/warranty-claims/{id}/adjudicate (SoD); ownership failures use ERR_INSUFFICIENT_PERMISSIONS on appraisal/RO customer actions" }
  - { priority: 4, category: existence, check: "Request body well-formed; required fields present; enum values valid; numeric ranges valid (hours>0, quantity>=1, capacity>=1, end_at>start_at, close_hour>open_hour)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "Path ids exist, validated left-to-right; body FK ids exist", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: "all endpoints with ids" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /dealership/customer-accounts/{id}; POST /dealership/units/{id}/floor-plan-adjustments" }
  - { priority: 7, category: state, check: "Target entity state permits the transition (per §1.2 preconditions; domain-specific error ids)", error_id: "ERR_ORDER_STATE | ERR_UNIT_STATE | ERR_UNIT_NOT_SELLABLE | ERR_UNIT_NOT_WHOLESALE_ELIGIBLE | ERR_APPRAISAL_STATE | ERR_RO_STATE | ERR_RO_NOT_AWAITING_CUSTOMER | ERR_RO_NOT_APPROVED | ERR_BOOKING_STATE | ERR_BOOKING_NOT_CHECKED_IN | ERR_CLAIM_STATE", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: business_safety, check: "Upfit compatibility: CRANE_PTO requires vocation_group SEVERE; REEFER_BOX and DUMP_BODY mutually exclusive on one order; LIFTGATE requires VAN_BODY or REEFER_BOX present on the same order", error_id: "ERR_UPFIT_INCOMPATIBLE | ERR_UPFIT_DEPENDENCY_MISSING", http_status: 422, applies_to: "POST /dealership/factory-orders; POST /dealership/factory-orders/{id}/upfit-lines" }
  - { priority: 9, category: business_constraint, check: "Uniqueness: Unit.vin unique; Part.sku unique; (build_month, vocation_group) unique among slots", error_id: "ERR_DUPLICATE_VIN | ERR_DUPLICATE_SKU | ERR_INVALID_REQUEST", http_status: 409, applies_to: "receive, parts create, slot create" }
  - { priority: 10, category: business_constraint, check: "Spec freeze: upfit lines may be added only while order.status == SLOT_HELD", error_id: ERR_SPEC_FROZEN, http_status: 409, applies_to: "POST /dealership/factory-orders/{id}/upfit-lines" }
  - { priority: 11, category: business_constraint, check: "Booking resource selection: exactly one of service_bay_id / mobile_service_unit_id; travel_minutes == 0 for bay bookings", error_id: ERR_SERVICE_RESOURCE_SELECTION, http_status: 422, applies_to: "POST /dealership/service-bookings" }
  - { priority: 12, category: business_constraint, check: "Bay bookings must lie within the bay's operating hours (ERR_BAY_OUTSIDE_OPERATING_HOURS); referenced bay/mobile resource status must be ACTIVE (ERR_RESOURCE_OUT_OF_SERVICE)", error_id: "ERR_BAY_OUTSIDE_OPERATING_HOURS | ERR_RESOURCE_OUT_OF_SERVICE", http_status: 422, applies_to: "POST /dealership/service-bookings" }
  - { priority: 13, category: business_constraint, check: "RO vehicle reference: exactly one of unit_id / external_vin", error_id: ERR_VEHICLE_REFERENCE_REQUIRED, http_status: 422, applies_to: "POST /dealership/repair-orders" }
  - { priority: 14, category: business_constraint, check: "Claimed amounts <= sums of warranty_eligible line totals by type; Part.on_hand >= quantity; part status == ACTIVE", error_id: "ERR_INVALID_REQUEST | ERR_INSUFFICIENT_STOCK | ERR_PART_DISCONTINUED", http_status: 409, applies_to: "POST /dealership/warranty-claims; POST /dealership/parts-sales; POST /dealership/repair-order-lines" }
  - { priority: 15, category: business_temporal, check: "Logical clock monotonic: set_current_utc requires to_iso8601 > current clock", error_id: ERR_CLOCK_REGRESSION, http_status: 409, applies_to: "POST /dealership/_clock/set_current_utc" }
  - { priority: 16, category: business_temporal, check: "Booking overlap per booking_overlap_check (bay half-open, mobile closed with travel buffer)", error_id: "ERR_BAY_BOOKING_OVERLAP | ERR_MOBILE_BOOKING_OVERLAP", http_status: 409, applies_to: "POST /dealership/service-bookings" }
  - { priority: 17, category: business_temporal, check: "Slot pool not past build month for holds/re-holds", error_id: ERR_SLOT_MONTH_CLOSED, http_status: 409, applies_to: "POST /dealership/factory-orders; POST /dealership/factory-orders/{id}/re-hold" }
  - { priority: 18, category: business_referential, check: "Slot pool has capacity (slots_available >= 1) at hold/commit-relevant operations", error_id: ERR_SLOT_POOL_EXHAUSTED, http_status: 409, applies_to: "POST /dealership/factory-orders; POST /dealership/factory-orders/{id}/re-hold" }
  - { priority: 19, category: business_referential, check: "sell with trade_appraisal_id requires appraisal ACCEPTED and owned by buyer; start-work requires CHECKED_IN booking; claim submit requires RO INVOICED", error_id: "ERR_APPRAISAL_STATE | ERR_BOOKING_NOT_CHECKED_IN | ERR_RO_STATE", http_status: 409, applies_to: "sell, start-work, claim submit" }
  - { priority: 20, category: business_fiscal, check: "FLEET credit: invoice/sell/post ops must keep open_ar within credit_limit_cents; account not on CREDIT_HOLD or CLOSED for sell/invoice", error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_ACCOUNT_ON_CREDIT_HOLD", http_status: 402, applies_to: "POST /dealership/repair-orders/{id}/invoice; POST /dealership/units/{id}/sell" }
  - { priority: 21, category: business_fiscal, check: "Appraisal offer discipline: offered_allowance_cents <= offer_acv_cents; adjudication amounts <= claimed; payment amounts exact per endpoint rules; write-off residual/age rule", error_id: "ERR_APPRAISAL_OFFER_EXCEEDS_ACV | ERR_APPROVAL_EXCEEDS_CLAIM | ERR_PAYMENT_AMOUNT_MISMATCH | ERR_WRITEOFF_RULE_VIOLATION", http_status: 422, applies_to: "offer, adjudicate, post-payment, write-off" }
  - { priority: 22, category: business_fiscal, check: "Parts return quantity may not exceed sold-minus-returned", error_id: ERR_RETURN_EXCEEDS_SOLD, http_status: 422, applies_to: "POST /dealership/parts-sale-lines/{id}/return" }

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- system / ops ---
  - { method: POST, path: "/dealership/_clock/set_current_utc", description: "Advance the logical clock (monotonic). Server startup default is 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time.", roles: [DealershipAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["rejects regression with ERR_CLOCK_REGRESSION"] }
  - { method: POST, path: "/dealership/ops/run-daily-sweep", description: "Ops-run checkpoint: posts floor-plan interest accruals, recomputes aging buckets/curtailments, expires order holds and appraisal offers, promotes the build cycle, marks NO_SHOW bookings, closes past-month slot pools. Each sweep applies AT MOST ONE build-cycle promotion per order per run (COMMITTED->IN_PRODUCTION and IN_PRODUCTION->SHIPPED never both in one run). Processing order per entity set: stocking_date/created_at ASC (never id).", roles: [DealershipAdmin], code: 200, input: [], output: { interest_entries_posted: integer, units_rebucketed: integer, orders_expired: integer, orders_started: integer, orders_shipped: integer, appraisals_expired: integer, bookings_no_show: integer, slot_pools_closed: integer }, side_effects: ["floor_plan_interest", "aging_and_curtailment", "order expiry/build-cycle transitions", "appraisal expiry", "booking NO_SHOW", "slot CLOSED"] }

  # --- CustomerAccount ---
  - { method: POST, path: "/dealership/customer-accounts", description: "Create a customer account", roles: [SalesManager], code: 201, input: [account_name, account_type, "fleet_tier?", "credit_limit_cents?"], output: CustomerAccount, side_effects: ["status = ACTIVE", "open_ar_cents = 0"] }
  - { method: GET, path: "/dealership/customer-accounts", description: "List customer accounts", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["account_type?", "fleet_tier?", "status?", "limit?", "offset?"], output: "CustomerAccount[]", side_effects: [] }
  - { method: GET, path: "/dealership/customer-accounts/{id}", description: "Get one customer account", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: CustomerAccount, side_effects: [] }
  - { method: PATCH, path: "/dealership/customer-accounts/{id}", description: "Update tier/credit limit/status with OCC", roles: [SalesManager], code: 200, input: ["fleet_tier?", "credit_limit_cents?", "status?", expected_customer_account_version], output: CustomerAccount, side_effects: ["increments CustomerAccount.version by 1", "status CLOSED requires open_ar_cents == 0 (ERR_ACCOUNT_ON_CREDIT_HOLD)"] }

  # --- FactoryBuildSlot ---
  - { method: POST, path: "/dealership/factory-build-slots", description: "Create a build slot pool for a build month + vocation group", roles: [SalesManager], code: 201, input: [build_month, vocation_group, capacity], output: FactoryBuildSlot, side_effects: ["status = OPEN", "(build_month, vocation_group) unique (ERR_INVALID_REQUEST)"] }
  - { method: GET, path: "/dealership/factory-build-slots", description: "List slot pools", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["build_month?", "status?", "limit?", "offset?"], output: "FactoryBuildSlot[]", side_effects: [] }
  - { method: GET, path: "/dealership/factory-build-slots/{id}", description: "Get one slot pool", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: FactoryBuildSlot, side_effects: [] }

  # --- FactoryOrder ---
  - { method: POST, path: "/dealership/factory-orders", description: "Create a factory order; immediately holds one slot in the pool", roles: [SalesConsultant], code: 201, input: [factory_build_slot_id, chassis_model, engine_option, axle_config, "customer_account_id?", "upfit_lines?"], output: FactoryOrder, side_effects: ["status = SLOT_HELD", "hold_expires_at = clock + 14 days", "provisional_total_cents computed (provisional variant)", "slot.held_count += 1; slot -> LOCKED when slots_available hits 0", "upfit compatibility validated when upfit_lines supplied"] }
  - { method: GET, path: "/dealership/factory-orders", description: "List factory orders", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["customer_account_id?", "factory_build_slot_id?", "status?", "limit?", "offset?"], output: "FactoryOrder[]", side_effects: [] }
  - { method: GET, path: "/dealership/factory-orders/{id}", description: "Get one factory order", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: FactoryOrder, side_effects: [] }
  - { method: POST, path: "/dealership/factory-orders/{id}/upfit-lines", description: "Append one upfit component line to an order (spec freeze at COMMITTED)", roles: [SalesConsultant], code: 201, input: [component_code, price_cents], output: FactoryOrder, side_effects: ["upfit compatibility + dependency validated against the order's full line set", "provisional_total_cents recomputed"] }
  - { method: POST, path: "/dealership/factory-orders/{id}/commit", description: "Commit a held order; locks price", roles: [SalesConsultant], code: 200, input: [], output: FactoryOrder, side_effects: ["status -> COMMITTED", "committed_total_cents locked (committed variant)", "slot.held_count -= 1, slot.committed_count += 1"] }
  - { method: POST, path: "/dealership/factory-orders/{id}/re-hold", description: "Re-hold an EXPIRED order against a new pool", roles: [SalesConsultant], code: 200, input: [factory_build_slot_id], output: FactoryOrder, side_effects: ["status EXPIRED -> SLOT_HELD", "new pool held_count += 1 (may LOCK)", "hold_expires_at refreshed"] }
  - { method: POST, path: "/dealership/factory-orders/{id}/cancel", description: "Cancel a held/committed order; releases the slot and may charge 2% cancellation fee", roles: [SalesConsultant], code: 200, input: [], output: FactoryOrder, side_effects: ["status -> CANCELLED", "slot counter release + posture re-evaluation", "COMMITTED cancel: fee = round_half_up(committed_total_cents * 0.02) -> account.open_ar_cents (cascade to CREDIT_HOLD)"] }
  - { method: POST, path: "/dealership/factory-orders/{id}/receive", description: "Receive a shipped truck; creates the NEW Unit and floor-plan ADVANCE", roles: [SalesManager], code: 200, input: [vin, "apr_bp?"], output: FactoryOrder, side_effects: ["status SHIPPED -> DELIVERED", "Unit created IN_STOCK with ADVANCE entry", "received_unit_id set"] }

  # --- Unit ---
  - { method: GET, path: "/dealership/units", description: "List units", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["unit_kind?", "status?", "aging_bucket?", "factory_order_id?", "trade_appraisal_id?", "limit?", "offset?"], output: "Unit[]", side_effects: [] }
  - { method: GET, path: "/dealership/units/{id}", description: "Get one unit", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: Unit, side_effects: [] }
  - { method: POST, path: "/dealership/units/{id}/inspect", description: "PDI / reconditioning inspection; PASS -> READY, FAIL -> RECONDITIONING (loop)", roles: [ServiceManager], code: 200, input: [outcome], output: Unit, side_effects: ["status transition per outcome", "recondition_count += 1 on FAIL"] }
  - { method: POST, path: "/dealership/units/{id}/sell", description: "Retail sale of a READY unit; accrues interest then pays off floor plan; optionally consumes an ACCEPTED trade appraisal", roles: [SalesConsultant], code: 200, input: [customer_account_id, sale_price_cents, "trade_appraisal_id?"], output: Unit, side_effects: ["status -> SOLD", "INTEREST_ACCRUAL + PAYOFF entries drive balance to 0", "trade appraisal -> CONSUMED when referenced"] }
  - { method: POST, path: "/dealership/units/{id}/wholesale", description: "Wholesale (remarket) an aged READY unit", roles: [SalesManager], code: 200, input: [wholesale_price_cents], output: Unit, side_effects: ["status -> WHOLESALED", "interest accrual + PAYOFF", "wholesale_loss_cents computed"] }
  - { method: POST, path: "/dealership/units/{id}/floor-plan-adjustments", description: "Manual signed floor-plan ADJUSTMENT with OCC on the unit", roles: [Controller], code: 201, input: [amount_cents, expected_unit_version, "note?"], output: Unit, side_effects: ["posts ADJUSTMENT FloorPlanEntry", "floorplan_balance_cents += amount_cents", "increments Unit.version by 1"] }
  - { method: GET, path: "/dealership/units/{id}/floor-plan-entries", description: "Ledger entries for a unit in chronological order", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["limit?", "offset?"], output: "FloorPlanEntry[]", side_effects: [] }
  - { method: POST, path: "/dealership/units/{id}/floor-plan-curtailments", description: "Post a CURTAILMENT payment entry against a floor-planned unit (amount must be > 0, <= curtailment_due_cents, <= floorplan_balance_cents)", roles: [Controller], code: 201, input: [amount_cents, "note?"], output: Unit, side_effects: ["requires floorplan_active == true and status IN {IN_STOCK, RECONDITIONING, READY} (ERR_UNIT_STATE)", "posts CURTAILMENT FloorPlanEntry of -amount_cents", "floorplan_balance_cents -= amount_cents", "increments Unit.version by 1"] }
  - { method: GET, path: "/dealership/units/{id}/payoff-quote", description: "Projected payoff (forward-looking variant) as of a date", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["as_of_date?"], output: { unit_id: string, as_of_date: string, balance_cents: integer, projected_interest_cents: integer, curtailment_due_cents: integer, payoff_cents: integer }, side_effects: [] }

  # --- TradeAppraisal ---
  - { method: POST, path: "/dealership/trade-appraisals", description: "Create an appraisal (BOOK estimate computed)", roles: [SalesConsultant], code: 201, input: [customer_account_id, trade_vin, model_year, mileage, condition_grade, base_book_value_cents], output: TradeAppraisal, side_effects: ["status = DRAFT", "book_estimate_cents computed (BOOK variant)"] }
  - { method: GET, path: "/dealership/trade-appraisals", description: "List appraisals", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["customer_account_id?", "status?", "limit?", "offset?"], output: "TradeAppraisal[]", side_effects: [] }
  - { method: GET, path: "/dealership/trade-appraisals/{id}", description: "Get one appraisal", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: TradeAppraisal, side_effects: [] }
  - { method: POST, path: "/dealership/trade-appraisals/{id}/offer", description: "SalesManager issues/re-issues an offer (MARKET ACV caps the allowance)", roles: [SalesManager], code: 200, input: [market_index_bp, offered_allowance_cents], output: TradeAppraisal, side_effects: ["status -> OFFERED", "offer_acv_cents computed (MARKET variant)", "offer_expires_at = clock + 10 days", "offer_round += 1"] }
  - { method: POST, path: "/dealership/trade-appraisals/{id}/counter", description: "Customer counters an offer (OFFERED -> NEGOTIATING)", roles: [FleetCustomer], code: 200, input: [], output: TradeAppraisal, side_effects: ["status -> NEGOTIATING"] }
  - { method: POST, path: "/dealership/trade-appraisals/{id}/accept", description: "Customer accepts; creates the USED unit in RECONDITIONING", roles: [FleetCustomer], code: 200, input: [], output: TradeAppraisal, side_effects: ["status -> ACCEPTED", "USED Unit created (cost basis = offered_allowance_cents)", "created_unit_id set"] }
  - { method: POST, path: "/dealership/trade-appraisals/{id}/decline", description: "Customer declines (terminal)", roles: [FleetCustomer], code: 200, input: [], output: TradeAppraisal, side_effects: ["status -> DECLINED"] }

  # --- ServiceBay / MobileServiceUnit ---
  - { method: POST, path: "/dealership/service-bays", description: "Create a service bay", roles: [ServiceManager], code: 201, input: [bay_code, bay_type, "open_hour?", "close_hour?"], output: ServiceBay, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/dealership/service-bays", description: "List service bays", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["status?", "limit?", "offset?"], output: "ServiceBay[]", side_effects: [] }
  - { method: GET, path: "/dealership/service-bays/{id}", description: "Get one service bay", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: ServiceBay, side_effects: [] }
  - { method: POST, path: "/dealership/mobile-service-units", description: "Create a mobile service unit (road-call resource)", roles: [ServiceManager], code: 201, input: [unit_code, "default_travel_minutes?"], output: MobileServiceUnit, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/dealership/mobile-service-units", description: "List mobile service units", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["status?", "limit?", "offset?"], output: "MobileServiceUnit[]", side_effects: [] }
  - { method: POST, path: "/dealership/service-bays/{id}/set-status", description: "Set bay ACTIVE | OUT_OF_SERVICE; existing bookings stand, new bookings blocked while OUT_OF_SERVICE", roles: [ServiceManager], code: 200, input: [status], output: ServiceBay, side_effects: ["status updated"] }
  - { method: GET, path: "/dealership/mobile-service-units/{id}", description: "Get one mobile service unit", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: MobileServiceUnit, side_effects: [] }

  - { method: POST, path: "/dealership/mobile-service-units/{id}/set-status", description: "Set mobile unit ACTIVE | OUT_OF_SERVICE", roles: [ServiceManager], code: 200, input: [status], output: MobileServiceUnit, side_effects: ["status updated"] }

  # --- RepairOrder ---
  - { method: POST, path: "/dealership/repair-orders", description: "Open a repair order (exactly one of unit_id / external_vin)", roles: [ServiceAdvisor], code: 201, input: [customer_account_id, concern, promised_ready_at, "unit_id?", "external_vin?", "labor_rate_cents?"], output: RepairOrder, side_effects: ["auth_status = DRAFT", "work_status = OPEN"] }
  - { method: GET, path: "/dealership/repair-orders", description: "List repair orders", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["customer_account_id?", "unit_id?", "auth_status?", "work_status?", "limit?", "offset?"], output: "RepairOrder[]", side_effects: [] }
  - { method: GET, path: "/dealership/repair-orders/{id}", description: "Get one repair order", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: RepairOrder, side_effects: [] }
  - { method: POST, path: "/dealership/repair-orders/{id}/submit-estimate", description: "Submit estimate to customer (requires >= 1 line)", roles: [ServiceAdvisor], code: 200, input: [], output: RepairOrder, side_effects: ["auth_status DRAFT -> PENDING_APPROVAL"] }
  - { method: POST, path: "/dealership/repair-orders/{id}/approve-estimate", description: "Customer approves estimate (owner only)", roles: [FleetCustomer], code: 200, input: [], output: RepairOrder, side_effects: ["auth_status PENDING_APPROVAL -> APPROVED"] }
  - { method: POST, path: "/dealership/repair-orders/{id}/decline-estimate", description: "Customer declines estimate (owner only)", roles: [FleetCustomer], code: 200, input: [], output: RepairOrder, side_effects: ["auth_status PENDING_APPROVAL -> DECLINED"] }
  - { method: POST, path: "/dealership/repair-orders/{id}/revise", description: "Return a declined estimate to DRAFT for rework", roles: [ServiceAdvisor], code: 200, input: [], output: RepairOrder, side_effects: ["auth_status DECLINED -> DRAFT"] }
  - { method: POST, path: "/dealership/repair-orders/{id}/start-work", description: "Start work; requires APPROVED estimate and a CHECKED_IN booking", roles: [ServiceAdvisor], code: 200, input: [], output: RepairOrder, side_effects: ["work_status -> IN_PROGRESS", "work_started_at = clock"] }
  - { method: POST, path: "/dealership/repair-orders/{id}/complete-work", description: "Complete work; computes downtime penalty; CHECKED_IN bookings -> COMPLETED", roles: [ServiceAdvisor], code: 200, input: [], output: RepairOrder, side_effects: ["work_status -> COMPLETED", "completed_at = clock", "downtime_penalty computed", "bookings COMPLETED"] }
  - { method: POST, path: "/dealership/repair-orders/{id}/invoice", description: "Invoice the RO; computes totals; FLEET credit check; posts AR", roles: [ServiceManager], code: 200, input: [], output: RepairOrder, side_effects: ["work_status -> INVOICED", "repair_order_totals computed", "account.open_ar_cents += customer_due_cents"] }
  - { method: POST, path: "/dealership/repair-orders/{id}/post-payment", description: "Post exact customer payment", roles: [Controller], code: 200, input: [amount_cents], output: RepairOrder, side_effects: ["work_status -> PAID", "account.open_ar_cents -= amount_cents", "credit posture re-evaluated (CREDIT_HOLD -> ACTIVE)"] }
  - { method: POST, path: "/dealership/repair-orders/{id}/cancel", description: "Cancel a non-invoiced RO; cancels its open bookings", roles: [ServiceAdvisor], code: 200, input: [], output: RepairOrder, side_effects: ["auth_status/work_status -> CANCELLED", "BOOKED | CHECKED_IN bookings -> CANCELLED"] }

  # --- RepairOrderLine ---
  - { method: POST, path: "/dealership/repair-order-lines", description: "Add a labor or part line to an RO (auth DRAFT/DECLINED, work OPEN/SCHEDULED only)", roles: [ServiceAdvisor], code: 201, input: [repair_order_id, line_type, "part_id?", "description?", "hours?", "quantity?", "warranty_eligible?"], output: RepairOrderLine, side_effects: ["line_total_cents computed", "ro.labor_sum_cents / parts_sum_cents recomputed", "PART line decrements Part.on_hand (ERR_INSUFFICIENT_STOCK)"] }
  - { method: GET, path: "/dealership/repair-order-lines", description: "List RO lines", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["repair_order_id?", "part_id?", "limit?", "offset?"], output: "RepairOrderLine[]", side_effects: [] }
  - { method: GET, path: "/dealership/repair-order-lines/{id}", description: "Get one RO line", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: RepairOrderLine, side_effects: [] }

  # --- ServiceBooking ---
  - { method: POST, path: "/dealership/service-bookings", description: "Book a bay or mobile unit for an RO; overlap semantics per booking_overlap_check", roles: [ServiceAdvisor], code: 201, input: [repair_order_id, start_at, end_at, "service_bay_id?", "mobile_service_unit_id?", "travel_minutes?"], output: ServiceBooking, side_effects: ["status = BOOKED", "ro.work_status OPEN -> SCHEDULED when first booking created"] }
  - { method: GET, path: "/dealership/service-bookings", description: "List bookings", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["repair_order_id?", "service_bay_id?", "mobile_service_unit_id?", "status?", "limit?", "offset?"], output: "ServiceBooking[]", side_effects: [] }
  - { method: GET, path: "/dealership/service-bookings/{id}", description: "Get one booking", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: ServiceBooking, side_effects: [] }
  - { method: POST, path: "/dealership/service-bookings/{id}/check-in", description: "Check the vehicle into the booking", roles: [ServiceAdvisor], code: 200, input: [], output: ServiceBooking, side_effects: ["status -> CHECKED_IN", "checked_in_at = clock"] }
  - { method: POST, path: "/dealership/service-bookings/{id}/cancel", description: "Cancel a booking; RO demotes SCHEDULED -> OPEN when no open bookings remain", roles: [ServiceAdvisor], code: 200, input: [], output: ServiceBooking, side_effects: ["status -> CANCELLED", "RO demotion check"] }

  # --- WarrantyClaim ---
  - { method: POST, path: "/dealership/warranty-claims", description: "Draft a warranty claim against an RO", roles: [WarrantyAdministrator], code: 201, input: [repair_order_id, claimed_labor_cents, claimed_parts_cents], output: WarrantyClaim, side_effects: ["status = DRAFT", "claimed amounts validated against warranty_eligible line sums"] }
  - { method: GET, path: "/dealership/warranty-claims", description: "List claims", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["repair_order_id?", "status?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: GET, path: "/dealership/warranty-claims/{id}", description: "Get one claim", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: POST, path: "/dealership/warranty-claims/{id}/submit", description: "Submit claim to OEM (RO must be INVOICED)", roles: [WarrantyAdministrator], code: 200, input: [], output: WarrantyClaim, side_effects: ["status -> SUBMITTED", "submitted_by_user_id = X-User-ID", "submitted_at = clock"] }
  - { method: POST, path: "/dealership/warranty-claims/{id}/adjudicate", description: "OEM adjudication: APPROVE | SHORT_PAY | DENY; cascades into RO totals and account AR", roles: [OEMClaimsAdjudicator], code: 200, input: [outcome, "approved_labor_cents?", "approved_parts_cents?", "denial_reason?"], output: WarrantyClaim, side_effects: ["status -> APPROVED | SHORT_PAID | DENIED", "ro.warranty_covered_cents + customer_due_cents recomputed", "account.open_ar_cents adjusted for INVOICED ROs", "account credit posture re-evaluated"] }
  - { method: POST, path: "/dealership/warranty-claims/{id}/appeal", description: "Appeal a DENIED or SHORT_PAID claim (cycle back for re-adjudication)", roles: [WarrantyAdministrator], code: 200, input: [appeal_notes], output: WarrantyClaim, side_effects: ["status -> APPEALED", "appeal_count += 1", "covered/AR cascade re-run when leaving SHORT_PAID"] }
  - { method: POST, path: "/dealership/warranty-claims/{id}/close", description: "Close a DENIED claim (terminal)", roles: [WarrantyAdministrator], code: 200, input: [], output: WarrantyClaim, side_effects: ["status -> CLOSED"] }
  - { method: POST, path: "/dealership/warranty-claims/{id}/post-payment", description: "Post an OEM payment; PAID when cumulative equals approved total", roles: [Controller], code: 200, input: [amount_cents], output: WarrantyClaim, side_effects: ["paid_cents += amount_cents", "-> PAID at full coverage"] }
  - { method: POST, path: "/dealership/warranty-claims/{id}/write-off", description: "Write off residual receivable (<= 2500 cents or claim aged > 45 days)", roles: [Controller], code: 200, input: [], output: WarrantyClaim, side_effects: ["status -> WRITTEN_OFF"] }

  # --- Part / PartsSale ---
  - { method: POST, path: "/dealership/parts", description: "Create a catalog part", roles: [PartsCounterRep], code: 201, input: [sku, part_name, list_price_cents, cost_cents, "on_hand?", "has_core_charge?", "core_charge_cents?"], output: Part, side_effects: ["status = ACTIVE", "sku unique (ERR_DUPLICATE_SKU)"] }
  - { method: GET, path: "/dealership/parts", description: "List parts", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["status?", "limit?", "offset?"], output: "Part[]", side_effects: [] }
  - { method: GET, path: "/dealership/parts/{id}", description: "Get one part", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: Part, side_effects: [] }
  - { method: POST, path: "/dealership/parts/{id}/discontinue", description: "Discontinue a part (blocks future sales)", roles: [PartsCounterRep], code: 200, input: [], output: Part, side_effects: ["status -> DISCONTINUED"] }
  - { method: POST, path: "/dealership/parts-sales", description: "Counter sale; per-line fleet-tier pricing pinned in parts_line_pricing; decrements stock", roles: [PartsCounterRep], code: 201, input: [customer_account_id, lines], output: PartsSale, side_effects: ["status = INVOICED", "PartsSaleLine rows created", "Part.on_hand -= quantity per line", "FLEET account open_ar_cents += total_cents (credit posture re-evaluated)"] }
  - { method: GET, path: "/dealership/parts-sales", description: "List parts sales", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["customer_account_id?", "status?", "limit?", "offset?"], output: "PartsSale[]", side_effects: [] }
  - { method: GET, path: "/dealership/parts-sales/{id}", description: "Get one parts sale", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: PartsSale, side_effects: [] }
  - { method: GET, path: "/dealership/parts-sale-lines", description: "List parts sale lines", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: ["parts_sale_id?", "part_id?", "limit?", "offset?"], output: "PartsSaleLine[]", side_effects: [] }
  - { method: GET, path: "/dealership/parts-sale-lines/{id}", description: "Get one parts sale line", roles: [DealershipAdmin, SalesManager, SalesConsultant, ServiceManager, ServiceAdvisor, PartsCounterRep, WarrantyAdministrator, OEMClaimsAdjudicator, Controller, FleetCustomer], code: 200, input: [], output: PartsSaleLine, side_effects: [] }
  - { method: POST, path: "/dealership/parts-sale-lines/{id}/return", description: "Return units from a line; restocking fee 15% after 30 days; restores stock", roles: [PartsCounterRep], code: 200, input: [quantity], output: PartsSaleLine, side_effects: ["returned_quantity += quantity", "Part.on_hand += quantity", "return_credit_cents accumulated (net of restocking fee)", "sale status -> PARTIALLY_RETURNED | FULLY_RETURNED", "FLEET account open_ar_cents credited (floor 0)"] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- auth / shape ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role undeclared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint, or FleetCustomer acting on another account's appraisal/RO" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Adjudicator X-User-ID equals claim.submitted_by_user_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, bad numeric range, or duplicate (build_month, vocation_group) slot pool" }
  # --- not found ---
  - { id: ERR_CUSTOMER_ACCOUNT_NOT_FOUND, http: 404, condition: "CustomerAccount id does not exist" }
  - { id: ERR_FACTORY_BUILD_SLOT_NOT_FOUND, http: 404, condition: "FactoryBuildSlot id does not exist" }
  - { id: ERR_FACTORY_ORDER_NOT_FOUND, http: 404, condition: "FactoryOrder id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Unit id does not exist" }
  - { id: ERR_TRADE_APPRAISAL_NOT_FOUND, http: 404, condition: "TradeAppraisal id does not exist" }
  - { id: ERR_SERVICE_BAY_NOT_FOUND, http: 404, condition: "ServiceBay id does not exist" }
  - { id: ERR_MOBILE_SERVICE_UNIT_NOT_FOUND, http: 404, condition: "MobileServiceUnit id does not exist" }
  - { id: ERR_REPAIR_ORDER_NOT_FOUND, http: 404, condition: "RepairOrder id does not exist" }
  - { id: ERR_REPAIR_ORDER_LINE_NOT_FOUND, http: 404, condition: "RepairOrderLine id does not exist" }
  - { id: ERR_SERVICE_BOOKING_NOT_FOUND, http: 404, condition: "ServiceBooking id does not exist" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "WarrantyClaim id does not exist" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "Part id does not exist" }
  - { id: ERR_PARTS_SALE_NOT_FOUND, http: 404, condition: "PartsSale id does not exist" }
  - { id: ERR_PARTS_SALE_LINE_NOT_FOUND, http: 404, condition: "PartsSaleLine id does not exist" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  # --- state ---
  - { id: ERR_ORDER_STATE, http: 409, condition: "FactoryOrder not in a state that permits the requested transition (incl. commit after hold lapse, receive before SHIPPED)" }
  - { id: ERR_UNIT_STATE, http: 409, condition: "Unit not in a state that permits inspection" }
  - { id: ERR_UNIT_NOT_SELLABLE, http: 409, condition: "Sell/wholesale requires unit.status == READY" }
  - { id: ERR_UNIT_NOT_WHOLESALE_ELIGIBLE, http: 409, condition: "Wholesale requires aging_bucket IN {B181_270, B271_365, OVER_365}" }
  - { id: ERR_APPRAISAL_STATE, http: 409, condition: "Appraisal not in a state that permits offer/counter/accept/decline, or referenced appraisal not ACCEPTED at sell" }
  - { id: ERR_RO_STATE, http: 409, condition: "RepairOrder work/auth dimension not in a state that permits the operation (incl. claim submit on non-INVOICED RO)" }
  - { id: ERR_RO_NOT_AWAITING_CUSTOMER, http: 409, condition: "Approve/decline requires auth_status == PENDING_APPROVAL" }
  - { id: ERR_RO_NOT_APPROVED, http: 409, condition: "start-work requires auth_status == APPROVED" }
  - { id: ERR_BOOKING_STATE, http: 409, condition: "ServiceBooking not in a state that permits check-in/cancel" }
  - { id: ERR_BOOKING_NOT_CHECKED_IN, http: 409, condition: "start-work requires a CHECKED_IN booking on the RO" }
  - { id: ERR_CLAIM_STATE, http: 409, condition: "WarrantyClaim not in a state that permits the requested transition" }
  # --- business constraint / safety ---
  - { id: ERR_DUPLICATE_VIN, http: 409, condition: "Unit vin already exists" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Part sku already exists" }
  - { id: ERR_SPEC_FROZEN, http: 409, condition: "Upfit line add requires order.status == SLOT_HELD" }
  - { id: ERR_UPFIT_INCOMPATIBLE, http: 422, condition: "CRANE_PTO on a STANDARD pool order, or REEFER_BOX combined with DUMP_BODY" }
  - { id: ERR_UPFIT_DEPENDENCY_MISSING, http: 422, condition: "LIFTGATE without VAN_BODY or REEFER_BOX on the same order" }
  - { id: ERR_SERVICE_RESOURCE_SELECTION, http: 422, condition: "Booking must reference exactly one of service_bay_id / mobile_service_unit_id, and travel_minutes must be 0 for bay bookings" }
  - { id: ERR_BAY_OUTSIDE_OPERATING_HOURS, http: 422, condition: "Bay booking outside [open_hour, close_hour] or resource not ACTIVE" }
  - { id: ERR_BAY_BOOKING_OVERLAP, http: 409, condition: "Bay booking overlaps an existing BOOKED | CHECKED_IN booking (half-open intervals; adjacency allowed)" }
  - { id: ERR_MOBILE_BOOKING_OVERLAP, http: 409, condition: "Mobile booking overlaps after travel-buffer expansion (closed intervals; buffer touch conflicts)" }
  - { id: ERR_RESOURCE_OUT_OF_SERVICE, http: 409, condition: "Booking references a ServiceBay or MobileServiceUnit in OUT_OF_SERVICE status" }
  - { id: ERR_VEHICLE_REFERENCE_REQUIRED, http: 422, condition: "Repair order requires exactly one of unit_id / external_vin" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Part.on_hand < requested quantity" }
  - { id: ERR_PART_DISCONTINUED, http: 409, condition: "Sale/line references a DISCONTINUED part" }
  # --- temporal / quota ---
  - { id: ERR_CLOCK_REGRESSION, http: 409, condition: "set_current_utc to_iso8601 not strictly after current logical clock" }
  - { id: ERR_SLOT_MONTH_CLOSED, http: 409, condition: "Slot pool build month has passed (pool CLOSED)" }
  - { id: ERR_SLOT_POOL_EXHAUSTED, http: 409, condition: "slots_available == 0 at hold / re-hold" }
  # --- fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "FLEET invoice would push open_ar_cents above credit_limit_cents" }
  - { id: ERR_ACCOUNT_ON_CREDIT_HOLD, http: 409, condition: "Sell/invoice against an account in CREDIT_HOLD or CLOSED; or closing an account with open AR" }
  - { id: ERR_APPRAISAL_OFFER_EXCEEDS_ACV, http: 422, condition: "offered_allowance_cents > offer_acv_cents (MARKET variant)" }
  - { id: ERR_APPROVAL_EXCEEDS_CLAIM, http: 422, condition: "SHORT_PAY approved amounts exceed claimed amounts" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "RO payment != customer_due_cents, or claim payment would exceed approved total or be <= 0" }
  - { id: ERR_WRITEOFF_RULE_VIOLATION, http: 409, condition: "Write-off requires residual > 0 and (residual <= 2500 or claim aged > 45 days)" }
  - { id: ERR_RETURN_EXCEEDS_SOLD, http: 422, condition: "Return quantity exceeds sold-minus-returned on the line" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: DealershipAdmin
    description: "Dealership system operator; owns the logical clock and the daily ops sweep"
    identity: opaque
    exclusive_operations: ["POST /dealership/_clock/set_current_utc", "POST /dealership/ops/run-daily-sweep"]
    shared_operations: ["all GET endpoints"]
  - name: SalesManager
    description: "Sales desk manager; owns accounts, slot pools, offers, receiving, wholesale"
    identity: opaque
    exclusive_operations: ["POST /dealership/customer-accounts", "PATCH /dealership/customer-accounts/{id}", "POST /dealership/factory-build-slots", "POST /dealership/factory-orders/{id}/receive", "POST /dealership/trade-appraisals/{id}/offer", "POST /dealership/units/{id}/wholesale"]
    shared_operations: ["all GET endpoints"]
  - name: SalesConsultant
