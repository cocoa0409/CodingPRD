      - name: client_cannot_checkout_other_clients_fix
        claim_type: Ownership Restriction
        grounds: [roles, "validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Client B (correct role) calling checkout on Client A's DELIVERED fix returns 403 ERR_NOT_RESOURCE_OWNER (peer ownership isolation)."
        test_recipe:
          setup: ["Client A has a 3-item fix DELIVERED; Client B exists (ACTIVE)."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "C", name: "C", category: "SHOE", size: 9, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "a@x.com", full_name: "A", region_code: "CA" }, as: Anonymous, captures: { ca: $.data.id } }
            - { call: "POST /clients/${ca}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${ca}" }
            - { call: "GET /clients/${ca}", payload: {}, as: OpsAdmin, captures: { cva: $.data.version } }
            - { call: "POST /clients/${ca}/fixes", payload: { expected_client_version: "${cva}" }, as: Client, as_user_id: "${ca}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}", captures: { i1: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/mark-delivered", payload: {}, as: OpsAdmin }
            - { call: "POST /clients", payload: { email: "b@x.com", full_name: "B", region_code: "CA" }, as: Anonymous, captures: { cb: $.data.id } }
            - { call: "POST /clients/${cb}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${cb}" }
          trigger:
            - { call: "POST /fixes/${fix}/checkout", payload: { kept_item_ids: ["${i1}"] }, as: Client, as_user_id: "${cb}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: stylist_cannot_add_item_to_unassigned_fix
        claim_type: Ownership Restriction
        grounds: [roles, "validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Stylist not assigned to a fix calling POST /fixes/{id}/items returns 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Fix in STYLING assigned to stylist1; stylist2 exists."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s1@x.com", name: "S1" }, as: OpsAdmin, captures: { st1: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s2@x.com", name: "S2" }, as: OpsAdmin, captures: { st2: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
