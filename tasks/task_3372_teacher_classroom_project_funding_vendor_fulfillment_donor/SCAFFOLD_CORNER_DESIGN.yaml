      - name: choice_after_deadline_returns_choice_window_expired
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_CHOICE_WINDOW_EXPIRED
        distinguishing_aspect: "The choice window check is temporal, not state-based: with the clock at 2026-10-20 (past choice_deadline 2026-10-15) and NO sweep run, the donation still reads CHOICE_PENDING yet the donor's choice is rejected with ERR_CHOICE_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "Project expired via sweep at 2026-10-01T00:00:00Z; donation CHOICE_PENDING with choice_deadline 2026-10-15T00:00:00Z; clock then advanced to 2026-10-20T00:00:00Z with no further sweep."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
            - *k_vet
            - *k_donor
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 5000 }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_sweeps/expiration_run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /giving/donations/${dn1}"
              payload: {}
              as: Donor
              as_user_id: "${d1}"
              captures: { dn_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /giving/donations/${dn1}/reallocation-choice"
              payload: { choice: "REFUND", expected_donation_version: "${dn_v}" }
              as: Donor
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CHOICE_WINDOW_EXPIRED (409)"
            - "Donation.${dn1}.status == CHOICE_PENDING still (no sweep ran to auto-refund it)"
            - "Donor.${d1}.lifetime_refunded_cents == 0"

      - name: fulfilled_project_with_pending_package_blocks_new_project
