# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Difficulty target: HARDER than Expert tier (§0.4). Rules carry 2-3 instances
# each with fully replayable setup_api_calls chains.

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: donation_receipt_gross_vs_net_variant
        grounds:
          - calculations.donation_valuation
          - state_machines.SurplusOffer.GLEANED_to_CLOSED
          - entities.DonationReceipt.fields.receipt_lbs
        distinguishing_aspect: |
          Identical verified poundage (200.0 lbs SWEET_CORN) yields different
          DonationReceipt values depending on whether a RESOLVED incident exists:
          gross variant -> receipt_lbs 200.0 / 6600 cents; net variant after a
          40.0-lb RESOLVED_LANDFILL incident -> receipt_lbs 160.0 / 5280 cents.
          Entity domain: offer/receipt fiscal basis (distinct from the poundage
          domain of the salvage-ratio instance and the report domain of the
          impact-metrics instance).
        test_recipe:
          setup:
            - "Farm active; offer SWEET_CORN estimated 250.0 window [2026-08-05T00:00:00Z, 2026-08-20T00:00:00Z) LOW no-refrigeration"
            - "Vehicle payload 5000 non-refrigerated; certified crew leader; event 2026-08-10T08:00:00Z..2026-08-10T12:00:00Z capacity 2"
            - "Event published; clock 2026-08-10T09:00:00Z; started; lot gross 220.0 tare 10.0 cull 10.0 (net 200.0) verified by coordinator; event finished and reconciled; offer auto-GLEANED"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "F1", contact_email: "f1@x.com", county_code: "AAA", donor_tin: "12-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "P1", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Lead One", email: "lead1@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Coord One", email: "coord1@x.com", crew_leader_certified: false }
              as: ProgramCoordinator
              captures: { coord_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "SWEET_CORN", estimated_lbs: 250.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 2 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/containers"
              payload: { label: "BIN-1", tare_lbs: 10.0, capacity_lbs: 1000, refrigerated: false }
              as: ProgramCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_id}", gross_lbs: 220.0, cull_lbs: 10.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /glean/lots/${lot_id}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/finish"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/events/${event_id}/reconcile"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "GET /glean/offers/${offer_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { offer_ver: $.data.version }
            - call: "POST /glean/offers/${offer_id}/close"
              payload: { expected_offer_version: "${offer_ver}" }
              as: ProgramCoordinator
            - call: "GET /glean/offers/${offer_id}/receipt"
              payload: {}
              as: ProgramCoordinator
              captures: { receipt_lbs: "$.data[0].receipt_lbs", receipt_cents: "$.data[0].fair_market_value_cents" }
          assert:
            - "Offer.${offer_id}.status == CLOSED"
            - "Offer.${offer_id}.salvage_ratio == 0.8000"
            - "receipt_lbs == 200.0 (gross variant: no incidents)"
            - "receipt_cents == 6600 (200.0 lbs * 33 cents, sum-then-round)"
            - "Farm.${farm_id}.lifetime_donated_lbs == 200.0"

      - name: donation_receipt_net_variant_with_incident
        grounds:
          - calculations.donation_valuation
          - state_machines.FoodSafetyIncident.OPEN_to_RESOLVED_LANDFILL
          - entities.DonationReceipt.fields.fair_market_value_cents
        distinguishing_aspect: |
          Same 200.0-lb verified harvest as donation_receipt_gross_vs_net_variant
          but with a 40.0-lb RESOLVED_LANDFILL incident: net variant applies ->
          receipt_lbs 160.0, fair_market_value_cents 5280. Proves variant
          SELECTION is driven by incident existence, not by offer attributes.
        test_recipe:
          setup:
            - "Same shape as donation_receipt_gross_vs_net_variant plus a FoodSafetyIncident (condemned 40.0) opened then resolved LANDFILL before event reconcile"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "F2", contact_email: "f2@x.com", county_code: "AAA", donor_tin: "22-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "P2", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Lead Two", email: "lead2@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Coord Two", email: "coord2@x.com", crew_leader_certified: false }
              as: ProgramCoordinator
              captures: { coord_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "SWEET_CORN", estimated_lbs: 250.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 2 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/containers"
              payload: { label: "BIN-2", tare_lbs: 10.0, capacity_lbs: 1000, refrigerated: false }
              as: ProgramCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_id}", gross_lbs: 220.0, cull_lbs: 10.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /glean/lots/${lot_id}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/finish"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/incidents"
              payload: { glean_event_id: "${event_id}", severity: "MINOR", condemned_lbs: 40.0, reported_by_volunteer_id: "${lead_id}" }
              as: FoodSafetyOfficer
              captures: { inc_id: $.data.id }
            - call: "POST /glean/incidents/${inc_id}/resolve"
              payload: { disposition: "LANDFILL" }
              as: FoodSafetyOfficer
            - call: "POST /glean/events/${event_id}/reconcile"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "GET /glean/offers/${offer_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { offer_ver: $.data.version }
            - call: "POST /glean/offers/${offer_id}/close"
              payload: { expected_offer_version: "${offer_ver}" }
              as: ProgramCoordinator
            - call: "GET /glean/offers/${offer_id}/receipt"
              payload: {}
              as: ProgramCoordinator
              captures: { receipt_lbs: "$.data[0].receipt_lbs", receipt_cents: "$.data[0].fair_market_value_cents" }
          assert:
            - "receipt_lbs == 160.0 (net variant: 200.0 - 40.0 condemned)"
            - "receipt_cents == 5280 (160.0 * 33)"
            - "Farm.${farm_id}.lifetime_donated_lbs == 160.0"
            - "Offer.${offer_id}.salvage_ratio == 0.8000 (salvage uses actual_lbs, NOT receipt_lbs)"

      - name: salvage_ratio_raw_vs_net_of_condemnation
        grounds:
          - calculations.salvage_ratio
          - calculations.impact_metrics
          - entities.SurplusOffer.fields.salvage_ratio
        distinguishing_aspect: |
          The salvage-ratio family carries two variants over the SAME offer data:
          raw_ratio = actual_lbs/estimated_lbs = 350.0/500.0 = 0.7000 stored on
          the offer at CLOSED, while net_of_condemnation_ratio = (350.0-40.0)/500.0
          = 0.6200 is the variant grant reporting uses via impact_metrics
          (total_gleaned_lbs nets out condemned pounds). Entity domain: offer
          performance metric vs county grant metric — a different domain from the
          fiscal receipt instances above.
        test_recipe:
          setup:
            - "Farm county CCC; offer APPLES estimated 500.0 window [2026-08-05, 2026-08-25) MEDIUM refrigeration"
            - "Refrigerated vehicle payload 5000; refrigerated agency county CCC capacity 10000 active"
            - "Event 2026-08-10T08:00Z..2026-08-10T14:00Z capacity 2; published; clock 09:00Z; started"
            - "Lots: 130.0-10.0-0.0 net 120.0, 90.0-10.0-0.0 net 80.0, 160.0-10.0-0.0 net 150.0 — all verified (total 350.0)"
            - "Incident condemned 40.0 resolved COMPOST; distribution 300.0 planned delivered 300.0 (DELIVERED) 2026-08-11; event reconciled; offer closed"
            - "Grant report county CCC period [2026-08-01, 2026-09-01) created and submitted"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "F3", contact_email: "f3@x.com", county_code: "CCC", donor_tin: "33-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "P3", payload_capacity_lbs: 5000, refrigerated: true }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/agencies"
              payload: { agency_name: "AG3", county_code: "CCC", weekly_capacity_lbs: 10000, refrigeration_capable: true }
              as: ProgramCoordinator
              captures: { ag_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Lead Three", email: "lead3@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Coord Three", email: "coord3@x.com", crew_leader_certified: false }
              as: ProgramCoordinator
              captures: { coord_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "APPLES", estimated_lbs: 500.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-25T00:00:00Z", perishability_class: "MEDIUM", requires_refrigeration: true }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T14:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 2 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/containers"
              payload: { label: "BIN-3A", tare_lbs: 10.0, capacity_lbs: 500, refrigerated: true }
              as: ProgramCoordinator
              captures: { cont_a: $.data.id }
            - call: "POST /glean/containers"
              payload: { label: "BIN-3B", tare_lbs: 10.0, capacity_lbs: 500, refrigerated: true }
              as: ProgramCoordinator
              captures: { cont_b: $.data.id }
            - call: "POST /glean/containers"
              payload: { label: "BIN-3C", tare_lbs: 10.0, capacity_lbs: 500, refrigerated: true }
              as: ProgramCoordinator
              captures: { cont_c: $.data.id }
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_a}", gross_lbs: 130.0, cull_lbs: 0.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_a: $.data.id }
            - call: "POST /glean/lots/${lot_a}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_b}", gross_lbs: 90.0, cull_lbs: 0.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_b: $.data.id }
            - call: "POST /glean/lots/${lot_b}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_c}", gross_lbs: 160.0, cull_lbs: 0.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_c: $.data.id }
            - call: "POST /glean/lots/${lot_c}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/finish"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/incidents"
              payload: { glean_event_id: "${event_id}", severity: "MINOR", condemned_lbs: 40.0, reported_by_volunteer_id: "${lead_id}" }
              as: FoodSafetyOfficer
              captures: { inc_id: $.data.id }
            - call: "POST /glean/incidents/${inc_id}/resolve"
              payload: { disposition: "COMPOST" }
              as: FoodSafetyOfficer
            - call: "GET /glean/events/${event_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { ev_ver: $.data.version }
            - call: "POST /glean/distributions"
              payload: { glean_event_id: "${event_id}", agency_id: "${ag_id}", planned_lbs: 300.0, delivery_date: "2026-08-11T10:00:00Z", expected_event_version: "${ev_ver}" }
              as: ProgramCoordinator
              captures: { dist_id: $.data.id }
            - call: "POST /glean/distributions/${dist_id}/deliver"
              payload: { delivered_lbs: 300.0 }
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/events/${event_id}/reconcile"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /glean/offers/${offer_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { offer_ver: $.data.version }
            - call: "POST /glean/offers/${offer_id}/close"
              payload: { expected_offer_version: "${offer_ver}" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /glean/reports"
              payload: { county_code: "CCC", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ProgramCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /glean/reports/${rep_id}/submit"
              payload: {}
              as: ProgramCoordinator
              captures: { rep_total: $.data.total_gleaned_lbs, rep_meals: $.data.meals_equivalent, rep_agencies: $.data.agency_count }
            - call: "GET /glean/offers/${offer_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { off_ratio: $.data.salvage_ratio }
          assert:
            - "off_ratio == 0.7000 (raw_ratio: 350.0/500.0, condemnation NOT netted)"
            - "rep_total == 310.0 (impact variant nets out the 40.0 condemned)"
            - "rep_meals == 372 (floor(310.0 * 1.2))"
            - "rep_agencies == 1"
            - "raw_ratio 0.7000 != net-of-condemnation implied ratio 0.6200 — the two variants provably diverge on identical inputs"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: a, b, c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: donation_valuation_nested_rounding_order
        grounds:
          - calculations.donation_valuation
          - calculations.actual_poundage
          - entities.HarvestLot.fields.net_lbs
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins sum-then-round —
          receipt_lbs aggregates net_lbs across lots BEFORE the single
          round_half_up(lbs * price). Two lots of 0.5 lb net each (SWEET_CORN,
          33c/lb) MUST yield 33 cents (round(1.0*33)); a per-line-then-sum
          implementation yields round(0.5*33)+round(0.5*33) = 17+17 = 34 cents.
          The one-cent delta is observable in DonationReceipt.fair_market_value_cents.
        test_recipe:
          setup:
            - "Farm; offer SWEET_CORN estimated 5.0 window [2026-08-05, 2026-08-20) LOW no-refrig"
            - "Event 2026-08-10T08:00Z..12:00Z capacity 1; published; clock 09:00Z; started"
            - "Two lots each gross 10.5 tare 10.0 cull 0.0 -> net 0.5; both verified; finish; reconcile; close"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FR", contact_email: "fr@x.com", county_code: "RRR", donor_tin: "44-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "PR", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Lead R", email: "leadr@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Coord R", email: "coordr@x.com", crew_leader_certified: false }
              as: ProgramCoordinator
              captures: { coord_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "SWEET_CORN", estimated_lbs: 5.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/containers"
              payload: { label: "BIN-R1", tare_lbs: 10.0, capacity_lbs: 100, refrigerated: false }
              as: ProgramCoordinator
              captures: { cont_r1: $.data.id }
            - call: "POST /glean/containers"
              payload: { label: "BIN-R2", tare_lbs: 10.0, capacity_lbs: 100, refrigerated: false }
              as: ProgramCoordinator
              captures: { cont_r2: $.data.id }
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_r1}", gross_lbs: 10.5, cull_lbs: 0.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_r1: $.data.id }
            - call: "POST /glean/lots/${lot_r1}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_r2}", gross_lbs: 10.5, cull_lbs: 0.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_r2: $.data.id }
            - call: "POST /glean/lots/${lot_r2}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/finish"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/events/${event_id}/reconcile"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /glean/offers/${offer_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { offer_ver: $.data.version }
            - call: "POST /glean/offers/${offer_id}/close"
              payload: { expected_offer_version: "${offer_ver}" }
