          trigger:
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}", captures: { err: $.data.error_id } }
          assert:
            - "http 409 with data.error_id == ERR_QUOTE_EXPIRED at exactly the 72h mark; job remains QUOTED"

      - name: comms_overdue_then_checkin_recovers
        claim_type: temporal_validation
        grounds: ["validations[priority=14]", "errors[ERR_COMMS_CHECKIN_OVERDUE]"]
        distinguishing_aspect: "A 91-minute check-in gap blocks deliver; a fresh check-in restores deliverability without any state regression."
