  - rule_id: priority_pair_validation_conflict
    instances:
      - name: award_state_error_precedes_funds_exceeded_error
        grounds: ["validations[priority=50]", "validations[priority=76]", "errors[ERR_PROJECT_NOT_BID_READY]", "errors[ERR_SCENARIO_FUNDS_EXCEEDED]", "errors[ERR_AWARD_OUTSIDE_ESTIMATE_TOLERANCE]"]
        distinguishing_aspect: "A single award request violates the priority-50 state rule (project is COORDINATING, not BID_READY) AND both priority-76 fiscal rules (999,999,999 cents exceeds the 20,000,000-cent uncommitted balance and sits far outside the 10% estimate tolerance), and the response is ERR_PROJECT_NOT_BID_READY with HTTP 409 — a state-category error beating a fiscal-category error."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An ADOPTED 20,000,000-cent scenario, a GOOD_STANDING contractor with max_concurrent_projects 2."
            - "One project holding a single Maple St line has been advanced to COORDINATING and NO utility has cleared, so it can never be BID_READY at trigger time; its project_total_estimate_cents is still the pre-BID_READY value."
            - "The award attempt asks for 999,999,999 cents, roughly 50x the entire program funding."
            - "The awarding officer officer-award-1 differs from the adopting officer officer-adopt-1, so the segregation-of-duties rule at priority 24 is NOT violated and cannot mask the pair."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
