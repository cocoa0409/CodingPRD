- section: cross_cutting_complexity_layers
  instances:
  - name: stale_expected_client_version_on_a_second_publication_is_rejected
    claim_type: optimistic_concurrency
    grounds:
    - "concurrency_rules[policy-publication-supersede]"
    - "errors[ERR_STALE_CLIENT_VERSION]"
    - "validations[priority=22]"
    - "endpoints[POST /idv/verification-policies/{id}/publish]"
    distinguishing_aspect: "The first publication moved Client.version from 2 to 3, so a second publication that still presents 2 is refused with 412 ERR_STALE_CLIENT_VERSION and policy v2 stays DRAFT while\
      \ v1 stays PUBLISHED."
    test_recipe:
      setup:
      - "The clock is 2026-08-01T00:00:00Z and client Acme OCC1 was registered (version 1) and switched LIVE (version 2)."
      - "Policy v1 was published with expected_client_version 2, which incremented Client.version to 3."
      - Policy v2 is DRAFT and the officer still holds the pre-publication read of version 2.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/clients
        payload: {name: Acme OCC1, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 50, granted_review_credits: 1}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      - call: "PATCH /idv/clients/${client_id}"
        payload: {integration_state: LIVE}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_v: $.data.version}
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_doc_id: $.data.id}
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 1
          allowed_method_codes: [DOCUMENT_SCAN]
          min_assurance_score: 40
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy_id: $.data.id}
      - call: "POST /idv/verification-policies/${policy_id}/publish"
        payload:
          expected_client_version: "${client_v}"
        as: ComplianceOfficer
        as_user_id: co-1
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 2
          allowed_method_codes: [DOCUMENT_SCAN, DATABASE_CHECK]
          min_assurance_score: 50
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy2_id: $.data.id}
      trigger:
      - call: "POST /idv/verification-policies/${policy2_id}/publish"
        payload:
          expected_client_version: "${client_v}"
        as: ComplianceOfficer
        as_user_id: co-1
        captures: *id001
      assert:
      - response status is 412 and $.data.error_id == ERR_STALE_CLIENT_VERSION
      - "VerificationPolicy.${policy2_id}.state == DRAFT with published_at == null"
      - "VerificationPolicy.${policy_id}.state == PUBLISHED with retired_at == null"
      - "Client.${client_id}.version == 3, unchanged by the rejected publish"
      - a retry presenting expected_client_version 3 would succeed and would push Client.version to 4
  - name: stale_expected_method_profile_version_on_remediation_is_rejected
    claim_type: optimistic_concurrency
    grounds:
    - "concurrency_rules[bias-remediation-record]"
    - "errors[ERR_STALE_METHOD_PROFILE_VERSION]"
    - "validations[priority=23]"
    - "endpoints[POST /idv/bias-audits/{id}/remediation]"
    distinguishing_aspect: "The restriction cascade itself incremented MethodProfile.version from 1 to 2, so an officer remediating from the pre-evaluation read of version 1 is refused with 412 and the\
      \ profile stays RESTRICTED."
    test_recipe:
      setup:
      - "The clock is 2026-08-01T00:00:00Z and docv1 was registered at version 1, which is the value captured before any evaluation."
      - "co-1 evaluated an audit whose gating ratio reached 20000 bps, restricting docv1 and taking its version to 2."
      - "co-2 records the remediation, so the duties check at priority 30 passes."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_doc_id: $.data.id, p_doc_v: $.data.version}
      - call: POST /idv/bias-audits
        payload:
          method_profile_id: "${p_doc_id}"
          window_start: "2026-06-01T00:00:00Z"
          window_end: "2026-07-01T00:00:00Z"
        as: ComplianceOfficer
        as_user_id: co-1
        captures: {audit_id: $.data.id}
      - *id002
      - *id003
      - *id004
