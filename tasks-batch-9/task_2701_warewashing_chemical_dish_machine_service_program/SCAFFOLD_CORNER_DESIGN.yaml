            - "${types_3} == [] - a MANUAL_AUDIT reading evaluates no alerts even with wash 100 F, rinse 100 F and 1 psi"
            - "${racks_a} == 300 - only the two DEVICE readings inside [08-01, 08-10) count and the MANUAL_AUDIT row's 500 cycles are excluded"
            - "${racks_b} == 900 - widening period_end past the 08-10 reading admits its 600 racks, proving the window is half-open"
            - "${water_a} == 138.0, ${wc_a} == 66 (138/1000 x 480 = 66.24 rounded), ${ec_a} == 882 and ${gross_a} == 948"
            - "${fee_a} == 0 with no deliveries, ${credit_a} == 47 (round_half_up(948 x 0.05)), ${net_a} == 24953 (0 + 25000 + 0 - 47) and ${goal_a} == 0.03"

