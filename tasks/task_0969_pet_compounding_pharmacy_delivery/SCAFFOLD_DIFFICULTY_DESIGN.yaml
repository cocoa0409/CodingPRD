            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 5, days_supply: 5, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv: $.data.version } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-X2", received_qty: 50, unit_cost_cents: 100, expiration_date: "2027-01-01" }, as: PharmacyTech }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-X2", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { ord: $.data.id } }
            - { call: "POST /compound-orders/${ord}/allocate", payload: {}, as: PharmacyTech }
            - { call: "POST /compound-orders/${ord}/start-compounding", payload: { bench_id: "${bench}", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z" }, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/complete-compounding", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/qa-pass", payload: {}, as: Pharmacist, as_user_id: "pharm-b" }
            - { call: "POST /insurance-policies", payload: { pet_id: "${pet}", insurer_name: "PetSure", policy_number: "POL-X2", deductible_cents: 0, coverage_pct: 1.0, annual_limit_cents: 100000, renewal_date: "2027-01-01" }, as: Owner, as_user_id: "${own}", captures: { pol: $.data.id, polv: $.data.version } }
            - { call: "POST /insurance-policies/${pol}/claims", payload: { compound_order_id: "${ord}", claimed_amount_cents: 500, expected_policy_version: "${polv}" }, as: Owner, as_user_id: "${own}", captures: { clm: $.data.id } }
            - { call: "POST /claims/${clm}/adjudicate", payload: { outcome: "APPROVE" }, as: InsuranceAdjuster, captures: { appr: $.data.approved_amount_cents } }
          trigger:
            - { call: "POST /insurance-policies/${pol}/lapse", payload: {}, as: InsuranceAdjuster }
            - { call: "POST /claims/${clm}/pay", payload: {}, as: InsuranceAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "claim adjudicated with approved_amount_cents == 515 (final price 515, coverage 1.0, no deductible)"
            - "pay after lapse fails with error_id == ERR_POLICY_NOT_ACTIVE (http 409)"
            - "InsuranceClaim.${clm}.status remains APPROVED; policy.annual_used_cents remains 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: bench_half_open_adjacency
        grounds:
          - validations[priority=21]
          - entities.BenchReservation.fields.start_at
          - state_machines.CompoundOrder.ALLOCATED_to_COMPOUNDING
          - errors[ERR_BENCH_OVERLAP]
        distinguishing_aspect: |
          Resource CompoundingBench with HALF-OPEN interval semantics [start_at, end_at):
          a 10:00-11:00 reservation touching an existing 09:00-10:00 reservation at the
          boundary is ACCEPTED (adjacency allowed), while 09:30-10:30 is rejected —
          different interval semantics than the cooler's mandatory-gap rule.
        test_recipe:
          setup:
            - "Three verified prescriptions (same pet/drug/formula), three allocated orders A/B/C, one shared bench"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen T1", email: "t1@x.com", phone: "555-71", ship_to_address: "15 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
