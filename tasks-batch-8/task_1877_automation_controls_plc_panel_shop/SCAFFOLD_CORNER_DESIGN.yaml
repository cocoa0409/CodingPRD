            - "second approve (different QA user) succeeds: Panel.${p_sd}.status == DESIGN_APPROVED"

      - name: credit_hold_blocks_job_creation_satisfaction_passes
        claim_type: satisfaction_then_violation
        grounds: ["validations[priority=17]", "errors[ERR_CREDIT_HOLD]"]
        distinguishing_aspect: "credit_hold == false permits job creation (satisfaction pass); flipping it true then makes the identical create fail with ERR_CREDIT_HOLD http 402."
        test_recipe:
          setup: ["customer with credit_hold false"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "CH Co", site_state_code: "UT" }
