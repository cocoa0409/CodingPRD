          - errors.ERR_WAIVER_OVERLAP
        distinguishing_aspect: |
          Half-open interval semantics on the player-waiver-timeline resource:
          [2027-01-01, 2027-06-01) and [2027-05-15, 2027-12-01) intersect ->
          ERR_WAIVER_OVERLAP, while [2027-06-01, 2027-12-01) merely touches at
          the boundary point (a.valid_until == b.valid_from) and is allowed.
        test_recipe:
          setup:
            - "League CHARTERED (prefix, league version 2); clock 2027-02-01; player P1 registered."
            - "Waiver W1 APPROVED for P1, RESIDENCY_BOUNDARY, [2027-01-01, 2027-06-01)."
            - "Waiver W2 PENDING for P1, RESIDENCY_BOUNDARY, [2027-06-01, 2027-12-01) — adjacent."
