  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_after_deliver_restores_week_and_admission_minute_ledgers
        grounds:
          - state_machines.TherapySession
          - calculations.credited_therapy_minutes
          - entities.TherapyWeek.fields.delivered_credited_minutes
          - entities.Admission.fields.total_credited_minutes
        distinguishing_aspect: |
          Voiding one delivered session subtracts exactly its 60 credited minutes from both
          TherapyWeek.delivered_credited_minutes (240 -> 180) and
          Admission.total_credited_minutes (240 -> 180) while the voided session itself
          still reports credited_minutes 60, so no minute is double-counted or lost.
        test_recipe:
          setup:
            - "Facility with defaults; one admission admitted 2026-08-04T12:00:00Z with an ACTIVE DAILY_3HR plan for [PT] and TherapyWeek week_index 1 starting 2026-08-04."
            - "Two INDIVIDUAL PT sessions delivered by Tara: 2026-08-04 13:00-16:00 (180 credited minutes) and 2026-08-05 09:00-10:00 (60 credited minutes)."
            - "Before the trigger the week holds delivered_credited_minutes 240 and qualifying_days_count 1 (only 2026-08-04 reaches 180)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
