            - "HOP 2: RiderItem.${r_hosp}.status == VOIDED with approved_cost_cents == 0, and RiderItem.${seed}.status == VOIDED"
            - "HOP 3: ProductionAdvance.${adv}.approved_rider_cost_cents == 0, recoupable_rider_cost_cents == 0 and denied_item_count == 0"
            - "HOP 4: ShowBooking.${bk}.recoupable_production_cost_cents == 0"
            - "SponsorshipActivation.${act}.status == CANCELLED with make_good_credit_cents == 1000000"
            - "ShowBooking.${bk}.sponsorship_revenue_cents == 0"
            - "ContingencyAction.${ca}.pre_doors == true and refund_liability_cents == 0"
            - "ShowBooking.${bk}.ticketing_status == REFUNDED (the zero-liability auto-transition fired)"
            - "Stage.${st}.held_show_count == 0 (the cancelled show released its hold)"

  # ===========================================================================
  # RULE 5 - Priority-pair validation conflicts across three category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: curfew_safety_outranks_stage_slot_conflict
        grounds:
          - validations.priority_30
          - validations.priority_39
          - errors.ERR_CURFEW_VIOLATION
          - errors.ERR_STAGE_SLOT_CONFLICT
          - entities.FairEdition.fields.curfew_utc_time
          - entities.Stage.fields.changeover_buffer_minutes
        distinguishing_aspect: |
          CATEGORY PAIR: business_safety (priority 30) versus business_constraint
          (priority 39). One send violates both: a load-out at 2026-08-23T02:00:00.000Z is
          past the 23:30 curfew AND collides with an existing 14:00 -> 23:00 hold inside the
          120-minute changeover buffer. The scaffold demands the safety error, so a
          conflict-first implementation returns ERR_STAGE_SLOT_CONFLICT (409) where
          ERR_CURFEW_VIOLATION (422) is required - a different error id, a different HTTP
          status and a different category from either of the other two pairs. The control
          send proves the slot conflict really was live.
        test_recipe:
          setup:
            - "Edition run 2026-08-20..2026-08-30, curfew_utc_time 23:30, max_shows_per_day 2, talent_budget_cap_cents 40000000 so no fiscal rule can pre-empt anything."
            - "One stage with changeover_buffer_minutes 120 and slot_soft_cap 4."
            - "Artist 1 (COUNTRY) already holds 2026-08-22 with load window 14:00 -> 23:00 in status SENT."
            - "Artist 2 (ROCK) so genre adjacency cannot fire on the same stage and date."
            - "Candidate offer A for artist 2: 2026-08-22, load_in 22:00, load_out 2026-08-23T02:00:00.000Z - past curfew and inside the buffered overlap."
            - "Control offer B for artist 2: 2026-08-22, load_in 20:00, load_out 23:00 - curfew-compliant but still overlapping."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "Priority Pair Fair A", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar1: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Nine Volt Sermon", genre: "ROCK", audience_segment: "YOUNG_ADULT", base_draw_score: 55.00 }
              as: TalentBuyer
              captures: { ar2: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar1}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 9000000, backend_split_pct: 0.8500, backend_breakeven_cents: 6000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_hold: "$.data.id" }
            - call: "POST /grandstand/offers/${of_hold}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar2}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 4000000, backend_split_pct: 0.8000, backend_breakeven_cents: 3000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T22:00:00.000Z", load_out_end_utc: "2026-08-23T02:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_a: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar2}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 4000000, backend_split_pct: 0.8000, backend_breakeven_cents: 3000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T20:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_b: "$.data.id" }
          trigger:
            - call: "POST /grandstand/offers/${of_a}/send"
              payload: {}
              as: TalentBuyer
              captures: { err_both: "$.data.error_id" }
            - call: "POST /grandstand/offers/${of_b}/send"
              payload: {}
              as: TalentBuyer
              captures: { err_control: "$.data.error_id" }
          assert:
            - "the offer A send returns HTTP 422 with ${err_both} == ERR_CURFEW_VIOLATION"
            - "${err_both} != ERR_STAGE_SLOT_CONFLICT (the lower-priority constraint error must not win)"
            - "the control offer B send returns HTTP 409 with ${err_control} == ERR_STAGE_SLOT_CONFLICT, proving the buffered collision was genuinely live in the first call"
            - "Offer.${of_a}.status == DRAFT and Offer.${of_b}.status == DRAFT (neither refused send moved the offer)"
            - "Stage.${st}.held_show_count == 1 (only the pre-existing hold counts)"
            - "FairEdition.${ed}.committed_guarantee_total_cents == 9000000"

      - name: genre_adjacency_constraint_outranks_talent_budget
        grounds:
          - validations.priority_41
          - validations.priority_46
          - errors.ERR_GENRE_ADJACENCY_CONFLICT
          - errors.ERR_TALENT_BUDGET_EXCEEDED
          - calculations.edition_committed_guarantee_total
          - entities.Artist.fields.genre
        distinguishing_aspect: |
          CATEGORY PAIR: business_constraint (priority 41) versus business_fiscal
          (priority 46) - a different pair from the safety/constraint case, and the one that
          pins fiscal capacity as the very last gate. The candidate send books a second
          COUNTRY act one day after an existing COUNTRY hold on the same stage while also
          pushing committed guarantees from 9000000 to 14000000 against a 10000000 cap. The
          declared answer is ERR_GENRE_ADJACENCY_CONFLICT (422); a budget-first
          implementation returns ERR_TALENT_BUDGET_EXCEEDED (also 422, so only the error id
          distinguishes them). The control send with a JAZZ act isolates the fiscal breach.
