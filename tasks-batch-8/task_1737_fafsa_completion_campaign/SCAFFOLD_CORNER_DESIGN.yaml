  - section: rbac
    instances:
      - name: coordinator_cannot_write_other_school
        claim_type: role_denied
        grounds:
          - roles[SchoolCoordinator]
          - errors[ERR_SCHOOL_SCOPE_VIOLATION]
        distinguishing_aspect: "Scoped tenancy: a SchoolCoordinator whose X-User-ID is school A cannot create a senior record naming school B (403 ERR_SCHOOL_SCOPE_VIOLATION), even though the role itself may create seniors."
        test_recipe:
          setup: ["Campaign OPEN; schools A and B both ENROLLED"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "A HS", district_code: "D01", school_code: "SC0A" }, captures: { schA: $.data.id } }
            - { call: "POST /fafsa/schools/${schA}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "B HS", district_code: "D02", school_code: "SC0B" }, captures: { schB: $.data.id } }
            - { call: "POST /fafsa/schools/${schB}/enroll", as: CampaignAdmin }
          trigger:
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${schA}", payload: { school_id: "${schB}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SCHOOL_SCOPE_VIOLATION (HTTP 403)"

