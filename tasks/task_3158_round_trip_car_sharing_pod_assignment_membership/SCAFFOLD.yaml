    side_effects: ["Reservation.status = CLOSED", "derives Member late penalty via the C2 calculation", "posts late penalty dollars as Member wallet service credit", "sets Reservation.returned_at when it is still null and recomputes Reservation.late_minutes", "sets Vehicle.use_status = AVAILABLE when status_before_overdue == IN_USE", "recompute Reservation.charge_total_cents via the C1 calculation", "increments Reservation.version by 1"]

