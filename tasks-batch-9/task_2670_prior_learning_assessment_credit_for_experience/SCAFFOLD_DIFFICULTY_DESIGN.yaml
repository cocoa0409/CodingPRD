              payload: { learning_outcome_id: "${oc1_id}", points_awarded: 4, narrative: "Exceeds every criterion" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/rubric-scores"
              payload: { learning_outcome_id: "${oc2_id}", points_awarded: 3, narrative: "Meets the criterion" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/complete"
              payload: { recommendation: "PASS" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
              captures: { verified_bp: "$.data.verified_coverage_bp" }
            - call: "POST /articulation-rules/${r1_id}/suspend"
              payload: { suspend_reason: "MANUAL_REVIEW" }
              as: ArticulationOfficer
              as_user_id: "officer-approver"
            - call: "PATCH /programs/${prog_id}"
              payload: { pla_max_credits: 3 }
              as: PlaCoordinator
              captures: { eff_cap: "$.data.effective_pla_cap_credits" }
            - call: "GET /students/${stu_id}"
              as: PlaCoordinator
              captures: { stu_v: "$.data.version" }
          trigger:
            - call: "POST /pla-claims/${claim_id}/award"
              payload: { expected_student_version: "${stu_v}", credits_awarded: 6 }
              as: PlaCoordinator
          assert:
            - "Before the trigger: PlaClaim.${claim_id}.assessment_status == SCORED, verified_coverage_bp == 9500, ArticulationRule.${r1_id}.status == SUSPENDED, Program.${prog_id}.effective_pla_cap_credits == 3"
            - "Both rules are live: priority 21 is violated (pinned rule is SUSPENDED, not APPROVED) AND priority 39 is violated (remaining_for(claim) == 3 - (6 - 6) == 3, and credits_awarded 6 > 3)"
            - "response status == 409 and data.error_id == ERR_ARTICULATION_NOT_APPROVED"
            - "data.error_id != ERR_PLA_CAP_EXCEEDED"
            - "PlaClaim.${claim_id}.assessment_status is still SCORED and credits_awarded is still null"
            - "Student.${stu_id}.version == ${stu_v} (a rejected award performs no ledger write)"
            - "Student.${stu_id}.pla_credits_reserved == 6 and pla_credits_awarded == 0"
            - "Control: reinstating ${r1_id} clears rule 21 and the same award then returns 409 ERR_PLA_CAP_EXCEEDED, proving both rules were genuinely violated in the trigger call"

      - name: stale_recommendation_version_412_beats_articulation_window_overlap_409
        grounds:
          - validations[priority=13 ERR_STALE_RECOMMENDATION_VERSION]
          - validations[priority=29 ERR_ARTICULATION_WINDOW_OVERLAP]
          - concurrency_rules.articulation-approve-stale-recommendation
          - calculations.articulation_window_overlap_check
          - endpoints[POST /articulation-rules/{rule_id}/approve]
          - endpoints[PATCH /credential-recommendations/{recommendation_id}]
        distinguishing_aspect: |
          The concurrency guard at priority 13 must fire before the temporal
          overlap scan at priority 29 even though the overlap is unconditionally
          present and cheaper to detect from the request alone: the second rule's
          window [2026-06-01, open) overlaps the already-APPROVED sibling's
          [2026-01-01, open), yet the answer is 412 ERR_STALE_RECOMMENDATION_VERSION
          because the recommendation was revised after the approver read it. The
          same call with a freshly read version then returns 409, so the two
          orderings are distinguishable by status code as well as error_id.
        test_recipe:
          setup:
            - "Course CS150 (6 credits, LOWER)."
            - "CredentialRecommendation CLEP-CS PUBLISHED."
            - "ArticulationRule R1 -> CS150 APPROVED with window [2026-01-01T00:00:00Z, open)."
            - "ArticulationRule R2 -> the SAME (recommendation, course) pair, window [2026-06-01T00:00:00Z, open), left UNDER_REVIEW."
            - "The approver reads the recommendation version, then a revision (PATCH recommended_credits 5) bumps both version and terms_version behind them."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "POST /credential-recommendations"
              payload: { source_type: "CREDIT_BY_EXAM", credential_code: "CLEP-CS", title: "CLEP Computing", issuing_body: "College Board", recommended_credits: 6, recommended_level: "LOWER", effective_from: "2026-01-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rec_id: "$.data.id" }
            - call: "POST /credential-recommendations/${rec_id}/publish"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${course_id}", awarded_credits: 6, effective_from: "2026-01-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { r1_id: "$.data.id" }
            - call: "POST /articulation-rules/${r1_id}/submit-for-review"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "GET /credential-recommendations/${rec_id}"
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { rec_v1: "$.data.version" }
            - call: "POST /articulation-rules/${r1_id}/approve"
              payload: { expected_recommendation_version: "${rec_v1}" }
              as: ArticulationOfficer
              as_user_id: "officer-approver"
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${course_id}", awarded_credits: 5, effective_from: "2026-06-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { r2_id: "$.data.id" }
            - call: "POST /articulation-rules/${r2_id}/submit-for-review"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "GET /credential-recommendations/${rec_id}"
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { rec_v_stale: "$.data.version", terms_v_before: "$.data.terms_version" }
            - call: "PATCH /credential-recommendations/${rec_id}"
              payload: { recommended_credits: 5 }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rec_v_current: "$.data.version", terms_v_after: "$.data.terms_version" }
          trigger:
            - call: "POST /articulation-rules/${r2_id}/approve"
              payload: { expected_recommendation_version: "${rec_v_stale}" }
              as: ArticulationOfficer
              as_user_id: "officer-approver"
          assert:
            - "response status == 412 and data.error_id == ERR_STALE_RECOMMENDATION_VERSION"
            - "data.error_id != ERR_ARTICULATION_WINDOW_OVERLAP and status != 409"
            - "ArticulationRule.${r2_id}.status is still UNDER_REVIEW and pinned_recommendation_version is still null"
            - "ArticulationRule.${r1_id}.status == APPROVED and CredentialRecommendation.${rec_id}.approved_rule_count == 1"
            - "The revision moved both counters: ${rec_v_current} == ${rec_v_stale} + 1 and ${terms_v_after} == ${terms_v_before} + 1"
            - "Re-reading the recommendation and retrying the same approve with the CURRENT version returns 409 ERR_ARTICULATION_WINDOW_OVERLAP, because [2026-06-01T00:00:00Z, open) overlaps R1's [2026-01-01T00:00:00Z, open) for the same (recommendation_id, course_id) pair"
            - "After that second rejection ArticulationRule.${r2_id}.status is still UNDER_REVIEW and approved_rule_count is still 1"

  - rule_id: boundary_precision_check
    instances:
      - name: verified_coverage_exactly_at_pass_threshold_passes_while_6999_twin_fails
        grounds:
          - calculations.outcome_coverage_score
          - validations[priority=36 ERR_RECOMMENDATION_INCONSISTENT]
          - entities.LearningOutcome.fields.weight_bp
          - entities.RubricScore.fields.score_ratio_bp
          - entities.AssessorAssignment.fields.recommendation
          - endpoints[POST /assessor-assignments/{assignment_id}/complete]
        distinguishing_aspect: |
          Two courses carry the SAME rubric (OC1 3/4, OC2 2/4) and differ only in
          outcome weights — 8000/2000 versus 7996/2004 — which lands
          verified_coverage_bp on exactly 7000 (== PASS_THRESHOLD_BP, PASS) for
          the first and on 6999 (one basis point short, FAIL) for the second. A
          strict `>` comparison, or a rounding step applied to the weighted
          product instead of only to the final division, flips one of the two.
        test_recipe:
          setup:
            - "Program BSCS with pla_pass_threshold_bp null so PASS_THRESHOLD_BP 7000 applies."
            - "Course CS150 (6 credits, LOWER): OC1 weight_bp 8000, OC2 weight_bp 2000, both mastery_threshold_bp 7000."
            - "Course CS151 (6 credits, LOWER) — the twin: OC1 weight_bp 7996, OC2 weight_bp 2004, both mastery_threshold_bp 7000."
            - "Student S-1001; FacultyAssessor E-9001 (CS, rank 2, max_concurrent_assignments 3)."
            - "One PORTFOLIO claim per course, each with a single PRIMARY artifact on OC1, each submitted with its invoice waived and its assignment accepted."
            - "Identical rubric on both assignments: OC1 3 of 4 (score_ratio_bp 7500), OC2 2 of 4 (score_ratio_bp 5000)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["PORTFOLIO"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c150_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${c150_id}"
              as: PlaCoordinator
              captures: { a_oc1: "$.data[0].id", a_oc2: "$.data[1].id" }
            - call: "POST /courses"
              payload: { course_code: "CS151", title: "Intro Programming Twin", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design", weight_bp: 7996, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test", weight_bp: 2004, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c151_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${c151_id}"
              as: PlaCoordinator
              captures: { b_oc1: "$.data[0].id", b_oc2: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr1_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c150_id}", source_type: "PORTFOLIO", credits_requested: 6, rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_a: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_a}", narrative: "Ten years of production work" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_a: "$.data.id" }
            - call: "POST /portfolios/${pf_a}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "A-1", evidence_uri: "s3://ev/a1", outcome_mappings: [{ learning_outcome_id: "${a_oc1}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_a}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_a}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /fee-invoices?claim_id=${claim_a}"
              as: PlaCoordinator
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /fee-invoices/${inv_a}/waive"
              payload: { waive_reason: "Institutional pilot cohort" }
              as: PlaCoordinator
            - call: "POST /pla-claims/${claim_a}/assessor-assignments"
              payload: { assessor_id: "${asr1_id}" }
              as: PlaCoordinator
              captures: { asg_a: "$.data.id" }
            - call: "POST /assessor-assignments/${asg_a}/accept"
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_a}/rubric-scores"
              payload: { learning_outcome_id: "${a_oc1}", points_awarded: 3, narrative: "Meets" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_a}/rubric-scores"
              payload: { learning_outcome_id: "${a_oc2}", points_awarded: 2, narrative: "Partial" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c151_id}", source_type: "PORTFOLIO", credits_requested: 6, rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_b: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_b}", narrative: "The same evidence, twin course" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_b: "$.data.id" }
            - call: "POST /portfolios/${pf_b}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "B-1", evidence_uri: "s3://ev/b1", outcome_mappings: [{ learning_outcome_id: "${b_oc1}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_b}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_b}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /fee-invoices?claim_id=${claim_b}"
              as: PlaCoordinator
              captures: { inv_b: "$.data[0].id" }
            - call: "POST /fee-invoices/${inv_b}/waive"
              payload: { waive_reason: "Institutional pilot cohort" }
              as: PlaCoordinator
            - call: "POST /pla-claims/${claim_b}/assessor-assignments"
              payload: { assessor_id: "${asr1_id}" }
              as: PlaCoordinator
              captures: { asg_b: "$.data.id" }
            - call: "POST /assessor-assignments/${asg_b}/accept"
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_b}/rubric-scores"
              payload: { learning_outcome_id: "${b_oc1}", points_awarded: 3, narrative: "Meets" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_b}/rubric-scores"
              payload: { learning_outcome_id: "${b_oc2}", points_awarded: 2, narrative: "Partial" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
          trigger:
            - call: "POST /assessor-assignments/${asg_a}/complete"
              payload: { recommendation: "PASS" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
              captures: { a_verified: "$.data.verified_coverage_bp", a_rec: "$.data.recommendation" }
            - call: "POST /assessor-assignments/${asg_b}/complete"
              payload: { recommendation: "PASS" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
          assert:
            - "RubricScore rows: score_ratio_bp == 7500 for points_awarded 3 and 5000 for points_awarded 2 (round_half_up(3 * 10000 / 4) and round_half_up(2 * 10000 / 4))"
            - "outcome_met on the OC1 scores == true (7500 >= 7000) and on the OC2 scores == false (5000 < 7000)"
            - "First complete: 200, AssessorAssignment.${asg_a}.verified_coverage_bp == 7000 ((8000*7500 + 2000*5000) / 10000), recommendation == PASS"
            - "PlaClaim.${claim_a}.assessment_status == SCORED, verified_coverage_bp == 7000, assessor_recommendation == PASS"
            - "Second complete: 422 and data.error_id == ERR_RECOMMENDATION_INCONSISTENT, because the twin's verified_coverage_bp is 6999 ((7996*7500 + 2004*5000) / 10000 == 69990000 / 10000) which is below PASS_THRESHOLD_BP 7000"
            - "AssessorAssignment.${asg_b}.status is still ACCEPTED and PlaClaim.${claim_b}.assessment_status is still UNDER_ASSESSMENT"
            - "Retrying the second complete with recommendation FAIL returns 200, AssessorAssignment.${asg_b}.verified_coverage_bp == 6999 and PlaClaim.${claim_b}.assessor_recommendation == FAIL"
            - "The two coverages differ by exactly 1 basis point (7000 - 6999) on identical rubric input"

      - name: discount_tier_boundary_at_exactly_25000_cents_and_half_cent_round_half_up
        grounds:
          - calculations.assessment_fee_invoice_total
          - entities.FeeInvoice.fields.discount_bp
          - entities.FeeInvoice.fields.discount_cents
          - entities.FeeInvoice.fields.total_cents
          - endpoints[POST /pla-claims/{claim_id}/submit]
          - endpoints[GET /fee-invoices]
        distinguishing_aspect: |
          Three PORTFOLIO invoices straddle DISCOUNT_TIER_2_MIN_CENTS: subtotal
          22500 takes 500 bp, subtotal exactly 25000 takes 1000 bp (the tier is
          inclusive at its minimum, so `> 25000` is wrong), and subtotal 28125
          produces discount_cents 2812.5 which round_half_up resolves to 2813
          rather than the truncated 2812 — one cent of difference that only a
          half-up rounder gets right.
        test_recipe:
          setup:
            - "Program BSCS-FEE allowing PORTFOLIO, pla_max_credits 30."
            - "Three LOWER courses, one outcome each (OC1 weight_bp 10000, mastery_threshold_bp 7000): CS203 (3 credits), CS204 (4 credits), CS205 (3 credits)."
            - "Student S-1001 MATRICULATED."
            - "Three PORTFOLIO claims, one per course, each with exactly ONE artifact so tier_of(1) == TIER_0_TO_3 and artifact_line is 0."
            - "Claim B (CS203, 3 credits, no rush) and claim A (CS204, 4 credits, no rush) are submitted during setup; claim C (CS205, 3 credits, rush_requested true) is submitted by the trigger."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS-FEE", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["PORTFOLIO"], status: "ACTIVE" }
