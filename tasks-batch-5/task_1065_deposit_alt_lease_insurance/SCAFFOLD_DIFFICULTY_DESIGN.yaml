  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_lease_interval_overlap_on_same_property
        grounds:
          - validations[priority=9]
          - entities.RenterEnrollment.fields.lease_start_date
        distinguishing_aspect: |
          A second RenterEnrollment's lease interval [2026-12-01, 2027-12-01) overlaps the first
          Policy's [2026-07-01, 2027-07-01) half-open interval on the SAME Property (both include
          2026-12-01..2027-07-01) — strict interval/interval overlap semantics on Policy, distinct
          from the minimum-gap-after-a-point buffer semantics of the Property re-enrollment cooldown
          below (different resource entity, different interval treatment).
        test_recipe:
          setup:
            - "A Landlord, two Renters, an ACTIVE Property (CA), and CA StateComplianceRule exist."
            - "The first Renter's RenterEnrollment auto-approves with lease [2026-07-01T00:00:00Z, 2027-07-01T00:00:00Z), creating an active Policy on the property."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Ollie Overlap Owner", email: "ollie.owner@example.com", phone_number: "555-0114" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Rae Renter One", email: "rae.one@example.com", phone_number: "555-0214" }
              as: Anonymous
              captures: { renter1_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Rick Renter Two", email: "rick.two@example.com", phone_number: "555-0215" }
              as: Anonymous
              captures: { renter2_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "15 Fir St", city: "Pasadena", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter1_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter1_id}"
              captures: { enrollment1_id: "$.data.id" }
            - call: "POST /renter-enrollments/${enrollment1_id}/submit-underwriting"
              payload: {}
              as: Renter
              as_user_id: "${renter1_id}"
          trigger:
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter2_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-12-01T00:00:00Z", lease_end_date: "2027-12-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter2_id}"
          assert:
            - "response.error_id == ERR_LEASE_TERM_OVERLAP"

      - name: property_reenrollment_before_cooldown_buffer_elapses
        grounds:
          - validations[priority=16]
          - state_machines.Property.TERMINATED_to_ACTIVE
        distinguishing_aspect: |
          Re-activating a TERMINATED Property immediately after termination (0 days elapsed, cooling_off_buffer_days=30) is rejected — a minimum-gap-after-a-point buffer rule on Property,
          distinct from Policy's interval/interval overlap rule above (different resource entity,
          different interval treatment: no second interval is involved here, only a single point
          plus a buffer).
        test_recipe:
          setup:
            - "A Landlord and an ACTIVE Property (CA, cooling_off_buffer_days=30) exist; the property is then TERMINATED at clock time 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Cora Cooldown Owner", email: "cora.owner@example.com", phone_number: "555-0115" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "16 Cypress St", city: "Burbank", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "TERMINATE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
          assert:
            - "response.error_id == ERR_REENROLLMENT_COOLDOWN_ACTIVE"
            - "Property.${property_id}.program_status == TERMINATED"

  - rule_id: compensating_invariant
    instances:
      - name: payout_disburse_reverse_conserves_policy_net_available_coverage
        grounds:
          - state_machines.Payout.DISBURSED_to_REVERSED
          - calculations.policy_available_coverage
        distinguishing_aspect: |
          The conserved quantity is Policy.coverage_limit_cents == Policy.net_available_coverage_cents
          + sum(non-reversed DISBURSED Payout.amount_cents). Disbursing (500000 -> 405000) and then
          reversing the same Payout restores net_available_coverage_cents to exactly 500000 — a
          Policy-domain coverage-balance invariant, a different conserved quantity than the
          SubrogationCase recovery-balance invariant below.
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA), CA StateComplianceRule, and an ACTIVE Policy (coverage_limit_cents=500000, net_available_coverage_cents=500000) exist."
            - "A Claim with total_claimed_amount_cents=100000 is APPROVED (approved_amount_cents=95000) and its Payout is DISBURSED, so net_available_coverage_cents=405000."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Ivy Invariant Owner", email: "ivy.owner@example.com", phone_number: "555-0116" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Ike Invariant", email: "ike.invariant@example.com", phone_number: "555-0216" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "17 Redwood St", city: "Glendale", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 500000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { enrollment_id: "$.data.id" }
            - call: "POST /renter-enrollments/${enrollment_id}/submit-underwriting"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "GET /renter-enrollments/${enrollment_id}/policy"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { policy_id: "$.data[0].id" }
            - call: "GET /policies/${policy_id}/invoices"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { invoice1_id: "$.data[0].id" }
            - call: "POST /invoices/${invoice1_id}/pay"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "POST /policies/${policy_id}/claims"
              payload: { policy_id: "${policy_id}", claim_type: "PROPERTY_DAMAGE", line_items: [{ description: "Broken window", amount_cents: 100000 }] }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { claim1_id: "$.data.id" }
            - call: "POST /claims/${claim1_id}/decide"
              payload: { action: "APPROVE" }
