  # Rule 9: compensating-action invariants over DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cancel_promote_conserves_seats_taken
        grounds:
          - state_machines.SessionBooking.BOOKED_to_CANCELLED
          - state_machines.SessionBooking.WAITLISTED_to_PROMOTED
          - entities.PlaytestSession.fields.seats_taken
        distinguishing_aspect: |
          Conserved quantity seats_taken: the forward action (cancel a BOOKED
          booking, seats_taken - 1) paired with its compensating action (promote
          the earliest eligible waitlisted booking, seats_taken + 1) leaves
