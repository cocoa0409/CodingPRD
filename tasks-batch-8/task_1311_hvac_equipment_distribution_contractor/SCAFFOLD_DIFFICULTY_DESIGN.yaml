              as: DistributorAdmin
              captures: { m11b_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c11a_id}" }
              as: ContractorUser
              as_user_id: "${c11a_id}"
              captures: { o11a_id: $.data.id }
            - call: "POST /api/v1/orders/${o11a_id}/lines"
              payload: { equipment_model_id: "${m11a_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c11a_id}"
            - call: "POST /api/v1/orders/${o11a_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c11a_id}"
            - call: "POST /api/v1/orders/${o11a_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o11a_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c11b_id}" }
              as: ContractorUser
              as_user_id: "${c11b_id}"
              captures: { o11b_id: $.data.id }
            - call: "POST /api/v1/orders/${o11b_id}/lines"
              payload: { equipment_model_id: "${m11b_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c11b_id}"
            - call: "POST /api/v1/orders/${o11b_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c11b_id}"
            - call: "POST /api/v1/orders/${o11b_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o11b_id}/deliver"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "GET /api/v1/contractors/${c11a_id}"
              payload: {}
              as: DistributorAdmin
            - call: "GET /api/v1/contractors/${c11b_id}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "Contractor.${c11a_id}.ytd_purchase_cents == 5000000 and tier == SILVER"
            - "Contractor.${c11b_id}.ytd_purchase_cents == 4999999 and tier == STANDARD"

      - name: allocation_availability_zero_boundary
        grounds:
          - calculations.allocation_consumption
          - entities.AllocationPool.fields.reserved_qty
          - state_machines.Order.SUBMITTED_to_BACKORDERED
        distinguishing_aspect: |
          Zero-quantity boundary on pool availability via the order submit
          endpoint (different metric from tier cents): when
          available == quantity the reservation succeeds (inclusive >=) and
          the order reaches ALLOCATED; a second order of quantity 1 against
          available == 0 goes BACKORDERED — the zero boundary flips the
          outcome.
        test_recipe:
          setup:
            - "AllocationPool AP12 for FAM-O: season [2026-08-01, 2026-09-01), total_qty 2"
            - "Contractor C12 with model M12 in FAM-O (list 600000); clock 2026-08-05 inside season"
            - "Order O12a quantity 2 (exactly available) submitted; Order O12b quantity 1 submitted after"
