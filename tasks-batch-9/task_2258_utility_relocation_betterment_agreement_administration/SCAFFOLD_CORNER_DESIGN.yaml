        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "rbac.UtilityOwnerRep", "errors[ERR_OWNER_SCOPE_VIOLATION]"]
        distinguishing_aspect: "Priority 6 is conditional on the acting role being entity_backed. The same POST /uro/relocation-plans body is rejected with ERR_OWNER_SCOPE_VIOLATION 403 when a UtilityOwnerRep whose X-User-ID is owner B submits a plan for owner A's facility, yet succeeds for a UtilityCoordinator, whose role is opaque and therefore has no owner to scope against - so the check cannot be implemented as an unconditional ownership comparison."
