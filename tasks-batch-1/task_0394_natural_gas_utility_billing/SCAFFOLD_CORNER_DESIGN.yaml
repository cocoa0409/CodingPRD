  # ===========================================================================
  # SECTION 6 — Errors (each error in the catalog must be triggerable). The
  #   bulk of the catalog is exercised by §1.8 and the sections above; the
  #   remaining un-covered codes get a dedicated trigger here.
  # ===========================================================================
  - section: errors
    instances:
      - name: error_unauthenticated_missing_role_header
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "A RES account exists."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RES-ER1", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "ER1" }
              as: CustomerService
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.status == 401"

      - name: error_billing_period_overlap_triggerable
        claim_type: Violation to Error
        grounds:
          - errors[ERR_BILLING_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / bill_billing_period_overlap_closed_interval
          rationale: "ERR_BILLING_PERIOD_OVERLAP is triggered by the named §1.8 closed-interval overlap instance."

      - name: error_budget_period_overlap_triggerable
        claim_type: Violation to Error
        grounds:
          - errors[ERR_BUDGET_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / budget_plan_coverage_window_overlap_half_open
          rationale: "ERR_BUDGET_PERIOD_OVERLAP is triggered by the named §1.8 half-open overlap instance."

      - name: error_stale_account_version_triggerable
        claim_type: Violation to Error
        grounds:
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - concurrency_rules[bill-issue-stale-account]
        distinguishing_aspect: "Issuing a bill with expected_account_version older than the current Account.version (after an intervening version bump) returns ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup:
            - "RES account with a DRAFT bill; the account's version observed BEFORE issuing a separate budget plan (which bumps version), so the captured version is stale at issue time."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-ER4", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-02", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 40, supplier_refund_cents_per_therm: 5 }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "ER4" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MR-401", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${so_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd_id: $.data.id }
            - call: "POST /accounts/${acct_id}/bills"
              payload: { service_month: "2026-02", to_read_id: "${rd_id}" }
              as: BillingAdmin
              captures: { bill_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v_stale: $.data.version }
            - call: "POST /accounts/${acct_id}/budget-plans"
              payload: { anchor_month: "2026-02", projected_annual_cents: 96000, expected_account_version: "${acct_v_stale}" }
              as: BillingAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/bills/${bill_id}/issue"
              payload: { expected_account_version: "${acct_v_stale}" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_ACCOUNT_VERSION"
            - "response.status == 412"

