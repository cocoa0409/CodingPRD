            - "Patient.${pt_id}.deductible_applied_cents == 0 and oop_applied_cents == 0 after the reprice (a REPRICED claim has not committed anything)"
      - name: booking_cancel_restores_session_minute_ledger
        grounds:
          - calculations.session_capacity_ledger
          - state_machines.ProcedureBooking.BOOKED_to_CANCELLED
          - entities.ProcedureBooking.fields.released_minutes
          - state_machines.BillingClaim.PROVISIONAL_PRICED_to_VOIDED
        distinguishing_aspect: |
          The compensated quantity is a minutes ledger on EndoscopySession rather than a money ledger
          on Patient, and the compensation frees a scheduling resource as well as a number: cancelling
          returns exactly duration_minutes + turnover_minutes, keeps
          booked_minutes + remaining_minutes == capacity_minutes at every observable instant, voids the
          provisional claim to all zeros, and makes the vacated interval bookable again - which abort,
          the deliberately non-compensating sibling action, does not.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "MODERATE_SEDATION block on 2026-09-15, window 13:00Z-21:00Z (capacity_minutes 480), turnover 15, max_procedures 8"
            - "Booking A at 13:00Z and booking B at 15:00Z, both 45 minutes, so booked_minutes is 120"
            - "A third eligible patient waiting for the 13:00Z slot"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health", preventive_coverage_pct: 1.00, diagnostic_coinsurance_pct: 0.20, deductible_cents: 150000, out_of_pocket_max_cents: 400000 }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST", adr_benchmark_pct: 0.25 }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_a: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", birth_date: "1972-06-22", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_b: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0003", birth_date: "1970-02-14", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_c: $.data.id }
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MODERATE_SEDATION", turnover_minutes: 15, max_procedures: 8 }
              as: PracticeAdmin
              captures: { sess_id: $.data.id, cap: $.data.capacity_minutes }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
              captures: { sess_v1: $.data.version, rem0: $.data.remaining_minutes }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_a}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_a: $.data.id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_b}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_b: $.data.id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_c}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_c: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_a}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T13:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v1}" }
              as: ReferralCoordinator
              captures: { bk_a: $.data.id }
            - call: "GET /endoscopy-sessions/${sess_id}"
              payload: {}
              as: PracticeAdmin
              captures: { sess_v2: $.data.version }
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_b}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T15:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v2}" }
              as: ReferralCoordinator
              captures: { bk_b: $.data.id }
            - call: "GET /billing-claims"
              payload: { booking_id: "${bk_a}" }
              as: BillingSpecialist
              captures: { claim_a: "$.data[0].id", claim_a_allowed: "$.data[0].allowed_amount_cents" }
            - call: "GET /endoscopy-sessions/${sess_id}"
              payload: {}
              as: PracticeAdmin
              captures: { booked1: $.data.booked_minutes, rem1: $.data.remaining_minutes, sess_v3: $.data.version }
          trigger:
