        grounds:
          - state_machines.Supplier.VERIFIED_to_SUSPENDED
          - state_machines.FeedstockLot.ACCEPTED_to_QUARANTINED
          - state_machines.FeedstockAllocation.RESERVED_to_RELEASED
          - state_machines.ProcessingRun.HYDROGEN_SECURED_to_PLANNED
          - state_machines.HydrogenNomination.CONFIRMED_to_CANCELLED
          - calculations.hydrogen_committed_capacity
          - endpoints["POST /suppliers/{id}/suspensions"]
        distinguishing_aspect: |
          A single compliance action five hops from the entity it finally touches: the suspension moves
          Supplier -> FeedstockLot -> FeedstockAllocation -> ProcessingRun -> HydrogenNomination and only then
          -> HydrogenSupplyContract.peak_committed_kg_per_day. Level 4 is conditional (the run only falls back
          to PLANNED because the recomputed reserved_mass_mt of 0.000 is below MIN_CHARGE_MT), so levels 5 and 6
          fire only as a consequence of that condition — booked hydrogen capacity is released by a supplier
          document problem two entities away from any hydrogen record.
