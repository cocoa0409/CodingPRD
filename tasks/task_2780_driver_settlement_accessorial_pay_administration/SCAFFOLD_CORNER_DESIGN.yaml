        excluded_because:
          difficulty_instance: cross_entity_state_dependency / driver_assignment_requires_active_package
          rationale: "That instance already assigns a fully-componented DRAFT package, asserts HTTP 409 with ERR_PAY_PACKAGE_NOT_ACTIVE, and then re-assigns after activation, so the error is triggered and its negative control is covered."
      - name: an_empty_accrual_set_makes_a_settlement_unpreparable
