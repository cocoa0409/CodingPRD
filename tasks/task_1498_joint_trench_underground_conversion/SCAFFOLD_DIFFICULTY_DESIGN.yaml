  # ---------------------------------------------------------------- rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: easement_refusal_renegotiation_cycle
        grounds:
          - state_machines.Easement.REQUESTED_to_REFUSED
          - state_machines.Easement.REFUSED_to_REQUESTED
          - entities.Easement.fields.requested_on
        distinguishing_aspect: |
          Easement machine is cyclic (REQUESTED -> REFUSED -> REQUESTED): a refused
          easement re-enters negotiation, requested_on refreshes to the new clock,
          and the loop can repeat until SIGNED -> RECORDED terminates it.
        test_recipe:
          setup:
            - "project + parcel + one DRAFT TRENCH easement"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Easement Project", rule20_credit_cents: 0, estimated_total_cost_cents: 500000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "3 Elm St", owner_name: "Owner Three", existing_panel_amps: 100, load_calc_amps: 60 }, as: RightOfWayAgent, captures: { parcel: "$.data.id" } }
            - { call: "POST /api/easements", payload: { parcel_id: "${parcel}", easement_type: TRENCH }, as: RightOfWayAgent, captures: { es: "$.data.id" } }
          trigger:
            - { call: "POST /api/easements/${es}/transition", payload: { to: REQUESTED }, as: RightOfWayAgent, captures: { req1: "$.data.requested_on" } }
            - { call: "POST /api/easements/${es}/transition", payload: { to: REFUSED }, as: RightOfWayAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ProgramManager }
            - { call: "POST /api/easements/${es}/transition", payload: { to: REQUESTED }, as: RightOfWayAgent, captures: { req2: "$.data.requested_on", st2: "$.data.status" } }
            - { call: "POST /api/easements/${es}/transition", payload: { to: SIGNED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: RECORDED }, as: RightOfWayAgent, captures: { st3: "$.data.status", rec: "$.data.recorded_on" } }
          assert:
            - "req1 == '2026-08-01T00:00:00Z' (clock default at first request)"
            - "st2 == REQUESTED after the REFUSED -> REQUESTED loop-back"
            - "req2 == '2026-08-05T00:00:00Z' (renegotiation refreshes requested_on; req2 != req1)"
            - "st3 == RECORDED and rec == '2026-08-05T00:00:00Z'"
      - name: conversion_parallel_state_dimensions
        grounds:
          - state_machines.ServiceConversion
          - entities.ServiceConversion.fields.work_status
          - entities.ServiceConversion.fields.temp_service_status
        distinguishing_aspect: |
          ServiceConversion carries two parallel state dimensions that evolve
          independently (temp service advances while work is still PLANNED) yet
          couple at defined gates (COMPLETE needs temp NONE|TEMP_REMOVED; temp
          removal needs work ENERGIZED|INSPECTED); the work axis additionally
          loops ENERGIZED -> ROUGH_IN on a FAIL inspection.
        test_recipe:
          setup:
            - "mobilized 2-party project in TRENCHING with segment BACKFILLED; one conversion created (PLANNED/NONE)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Parallel Project", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 7000, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 3000, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "4 Pine St", owner_name: "Owner Four", existing_panel_amps: 200, load_calc_amps: 100 }, as: RightOfWayAgent, captures: { parcel: "$.data.id" } }
            - { call: "POST /api/easements", payload: { parcel_id: "${parcel}", easement_type: TRENCH }, as: RightOfWayAgent, captures: { es: "$.data.id" } }
            - { call: "POST /api/easements/${es}/transition", payload: { to: REQUESTED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: SIGNED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: RECORDED }, as: RightOfWayAgent }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", permit_type: ENCROACHMENT, valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: RightOfWayAgent, captures: { perm: "$.data.id" } }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: SUBMITTED }, as: RightOfWayAgent }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: ISSUED }, as: RightOfWayAgent }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 200, max_depth_inches: 60, parcel_ids: ["${parcel}"] }, as: ProgramManager, captures: { seg: "$.data.id", seg_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg_v}" }, as: ProgramManager }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: START_TRENCHING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: EXCAVATING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: BACKFILLING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: BACKFILLED }, as: ProgramManager }
            - { call: "POST /api/service-conversions", payload: { parcel_id: "${parcel}", project_id: "${proj}" }, as: ConversionContractor, captures: { conv: "$.data.id" } }
          trigger:
            - { call: "POST /api/service-conversions/${conv}/temp-service-transition", payload: { to: TEMP_INSTALLED }, as: ConversionContractor, captures: { t1: "$.data.temp_service_status", w1: "$.data.work_status" } }
            - { call: "POST /api/service-conversions/${conv}/temp-service-transition", payload: { to: TEMP_ACTIVE }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: ROUGH_IN }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: PANEL_SET, panel_capacity_amps: 200 }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: READY_TO_ENERGIZE }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: ENERGIZED }, as: ConversionContractor, captures: { w2: "$.data.work_status", t2: "$.data.temp_service_status" } }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: COMPLETE }, as: ConversionContractor, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: ROUGH_IN, outcome: FAIL }, as: ConversionContractor, captures: { w3: "$.data.work_status", panel3: "$.data.panel_capacity_amps" } }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: PANEL_SET, panel_capacity_amps: 200 }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: READY_TO_ENERGIZE }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: ENERGIZED }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/temp-service-transition", payload: { to: TEMP_REMOVED }, as: ConversionContractor, captures: { t4: "$.data.temp_service_status" } }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: INSPECTED, outcome: PASS }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: COMPLETE }, as: ConversionContractor, captures: { w5: "$.data.work_status" } }
          assert:
            - "t1 == TEMP_INSTALLED while w1 == PLANNED (dimensions advance independently)"
            - "w2 == ENERGIZED while t2 == TEMP_ACTIVE"
            - "err == ERR_INVALID_STATE — COMPLETE blocked while temp_service_status == TEMP_ACTIVE (cross-dimension gate)"
            - "w3 == ROUGH_IN after FAIL inspection (work-axis rework cycle) and panel3 == null (panel reset)"
            - "t4 == TEMP_REMOVED (allowed once ENERGIZED)"
            - "w5 == COMPLETE with temp TEMP_REMOVED"
  # ---------------------------------------------------------------- rule 4
  - rule_id: transitive_cascade
    instances:
      - name: participation_withdrawal_cascade
        grounds:
          - state_machines.UtilityParticipation.MOBILIZED_to_WITHDRAWN
          - calculations.provisional_cost_share
          - calculations.project_posture
          - entities.TrenchSegment.fields.available_depth_inches
        distinguishing_aspect: |
          Trigger = participation WITHDRAWN. Depth-4+ chain, each hop caused by the
          previous: withdrawal releases its slots -> released slots recompute the
          segment depth budget -> remaining participants' cost_share_bp rescale to
          10000 -> rescaled bp recompute provisional shares (499900/0/500101) ->
          share recomputes set variance_flag (49.99% >= 10%) -> posture drops to
          CONDITIONAL.
        test_recipe:
          setup:
            - "3-party mobilized project (est 1000001, bp 3333/3333/3334) with one scheduled segment; P2 holds one RESERVED slot (band 12-24)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Cascade Project", rule20_credit_cents: 0, estimated_total_cost_cents: 1000001, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 3333, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 3333, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U3", utility_type: CATV, cost_share_bp: 3334, sequence_order: 3 }, as: ProgramManager, captures: { p3: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/participations/${p3}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p3}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: MOBILIZED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 300, max_depth_inches: 60 }, as: ProgramManager, captures: { seg: "$.data.id", seg_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg_v}" }, as: ProgramManager }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg}", participation_id: "${p2}", depth_top_inches: 12, depth_bottom_inches: 24, install_start_at: "2026-09-01T00:00:00Z", install_end_at: "2026-09-03T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p2}", captures: { s2: "$.data.id" } }
          trigger:
            - { call: "POST /api/participations/${p2}/transition", payload: { to: WITHDRAWN }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "GET /api/occupancy-slots/${s2}", payload: {}, as: ProgramManager, captures: { s2_status: "$.data.status" } }
            - { call: "GET /api/trench-segments/${seg}", payload: {}, as: ProgramManager, captures: { seg_avail: "$.data.available_depth_inches", seg_occ: "$.data.occupied_depth_inches" } }
            - { call: "GET /api/participations/${p1}", payload: {}, as: ProgramManager, captures: { p1_bp: "$.data.cost_share_bp", p1_share: "$.data.provisional_share_cents", p1_flag: "$.data.variance_flag" } }
            - { call: "GET /api/participations/${p3}", payload: {}, as: ProgramManager, captures: { p3_bp: "$.data.cost_share_bp", p3_share: "$.data.provisional_share_cents" } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProgramManager, captures: { posture: "$.data.posture" } }
          assert:
            - "s2_status == RELEASED (hop 2: withdrawal releases the slot)"
            - "seg_occ == 0 and seg_avail == 60 (hop 3: release recomputes the depth budget)"
            - "p1_bp == 4999 and p3_bp == 5001 (hop 4: round_half_up(3333*10000/6667)=4999, round_half_up(3334*10000/6667)=5001; sum re-pinned to 10000)"
            - "p1_share == 499900 and p3_share == 500101 (hop 5: shares recompute on rescaled bp; 499900+500101 == 1000001)"
            - "p1_flag == true (hop 6: |499900-333301|/333301 ~= 49.99% >= 10%)"
            - "posture == CONDITIONAL (hop 7: variance flag propagates to the project posture)"
      - name: change_order_incorporation_cascade
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_INCORPORATED
          - calculations.provisional_cost_share
          - calculations.delay_liquidated_damages
          - entities.Project.fields.estimated_total_cost_cents
        distinguishing_aspect: |
          Trigger = change order INCORPORATED (distinct from the withdrawal trigger).
          Depth-2+ chain: incorporation mutates project.estimated_total_cost_cents
          (1000001 -> 1500001) -> that mutation recomputes every provisional share
          (499951/499950/500100) -> the share recompute sets variance flags and
          re-derives posture. APPROVED alone freezes posture first.
        test_recipe:
          setup:
            - "3-party mobilized project (est 1000001, bp 3333/3333/3334) with provisional shares 333301/333300/333400"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CO Cascade Project", rule20_credit_cents: 0, estimated_total_cost_cents: 1000001, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 3333, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 3333, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U3", utility_type: CATV, cost_share_bp: 3334, sequence_order: 3 }, as: ProgramManager, captures: { p3: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/participations/${p3}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p3}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/change-orders", payload: { project_id: "${proj}", description: "rock excavation adder" }, as: ProgramManager, captures: { co: "$.data.id" } }
            - { call: "POST /api/change-orders/${co}/transition", payload: { to: PRICED, delta_cost_cents: 500000, delta_delay_days: 0, delay_cause: EXCUSABLE }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co}/transition", payload: { to: APPROVED }, as: ProgramManager }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProgramManager, captures: { posture_frozen: "$.data.posture" } }
          trigger:
            - { call: "POST /api/change-orders/${co}/transition", payload: { to: INCORPORATED }, as: ProgramManager }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProgramManager, captures: { est2: "$.data.estimated_total_cost_cents", posture2: "$.data.posture" } }
            - { call: "GET /api/participations/${p1}", payload: {}, as: ProgramManager, captures: { s1: "$.data.provisional_share_cents", f1: "$.data.variance_flag" } }
            - { call: "GET /api/participations/${p2}", payload: {}, as: ProgramManager, captures: { s2: "$.data.provisional_share_cents" } }
            - { call: "GET /api/participations/${p3}", payload: {}, as: ProgramManager, captures: { s3: "$.data.provisional_share_cents" } }
          assert:
            - "posture_frozen == FROZEN (APPROVED change order freezes the project before incorporation)"
            - "est2 == 1500001 (hop 1: 1000001 + 500000)"
            - "s1 == 499951, s2 == 499950, s3 == 500100 (hop 2: round on 1500001 then remainder +1 to seq 1)"
            - "s1 + s2 + s3 == 1500001 == est2"
            - "f1 == true (hop 3: 49.99% variance >= 10% threshold)"
            - "posture2 == CONDITIONAL (variance flags keep posture below CLEAR after unfreeze)"
  # ---------------------------------------------------------------- rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_preempts_fiscal_on_mobilize
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SHARE_SUM_INVALID]
        distinguishing_aspect: |
          Category pair = state vs business_fiscal. MOBILIZE on a CANCELLED project
          whose committed bp sum is 9000 violates both; priority 7 (state) beats
          priority 19 (fiscal), so ERR_INVALID_STATE wins over ERR_SHARE_SUM_INVALID.
        test_recipe:
          setup:
            - "project with two COMMITTED participations whose bp sum to 9000, then project CANCELLED from PLANNING"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Prio Project", rule20_credit_cents: 0, estimated_total_cost_cents: 900000, target_cutover_on: "2026-12-31T00:00:00Z" }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 6000, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 3000, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: CANCEL }, as: ProgramManager }
          trigger:
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (not ERR_SHARE_SUM_INVALID, even though 6000+3000 = 9000 != 10000)"
      - name: referential_preempts_temporal_on_excavation
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors[ERR_EASEMENT_REFUSED_BLOCKING]
          - errors[ERR_PERMIT_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Category pair = business_referential vs business_temporal (distinct from
          the sibling's state/fiscal pair). Excavation with a REFUSED TRENCH
          easement AND a permit window ending before excavation_end violates both;
          priority 11 referential beats priority 13 temporal.
        test_recipe:
          setup:
            - "mobilized 2-party project in TRENCHING; parcel easement REFUSED; ISSUED permit valid only 2026-08-01..2026-09-05 (excavation scheduled 2026-09-01..2026-09-10)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Prio2 Project", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 7000, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 3000, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "5 Birch Ln", owner_name: "Owner Five", existing_panel_amps: 200, load_calc_amps: 100 }, as: RightOfWayAgent, captures: { parcel: "$.data.id" } }
            - { call: "POST /api/easements", payload: { parcel_id: "${parcel}", easement_type: TRENCH }, as: RightOfWayAgent, captures: { es: "$.data.id" } }
            - { call: "POST /api/easements/${es}/transition", payload: { to: REQUESTED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: REFUSED }, as: RightOfWayAgent }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", permit_type: ENCROACHMENT, valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-05T00:00:00Z" }, as: RightOfWayAgent, captures: { perm: "$.data.id" } }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: SUBMITTED }, as: RightOfWayAgent }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: ISSUED }, as: RightOfWayAgent }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 300, max_depth_inches: 60, parcel_ids: ["${parcel}"] }, as: ProgramManager, captures: { seg: "$.data.id", seg_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg_v}" }, as: ProgramManager }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: START_TRENCHING }, as: ProgramManager }
          trigger:
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: EXCAVATING }, as: ProgramManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_EASEMENT_REFUSED_BLOCKING (not ERR_PERMIT_WINDOW_VIOLATION, even though permit valid_to 2026-09-05 < excavation_end 2026-09-10)"
  # ---------------------------------------------------------------- rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: panel_capacity_exact_headroom_boundary
        grounds:
          - calculations.panel_upgrade_rule
          - errors[ERR_PANEL_CAPACITY_INADEQUATE]
          - state_machines.ServiceConversion
        distinguishing_aspect: |
          Metric = panel amps. ceil(100 * 1.25) = 125: a 125A panel passes exactly,
          124A fails by one amp. Reached via the work-transition endpoint.
