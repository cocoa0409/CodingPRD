scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: agent_creation_defaults_and_initial_state
        claim_type: creation_defaults
        grounds: [entities.Agent, state_machines.Agent]
        distinguishing_aspect: "Enrolling an unsponsored agent applies every declared default: ENROLLED_PENDING_DOCS membership, UNCAPPED cap, zero accrual, cap year anchored at join_date, vested false."
        test_recipe:
          setup: ["Empty database; one market center"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
          trigger:
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id, mem: $.data.membership_status, cap: $.data.cap_status, acc: $.data.accrued_company_dollar, cys: $.data.cap_year_start, cye: $.data.cap_year_end, v: $.data.version } }
          assert:
            - "Agent.${a1}.membership_status == ENROLLED_PENDING_DOCS (initial state)"
            - "Agent.${a1}.cap_status == UNCAPPED and accrued_company_dollar == 0.00"
            - "Agent.${a1}.cap_year_start == 2026-09-01T00:00:00Z and cap_year_end == 2027-09-01T00:00:00Z"
            - "Agent.${a1}.version == 1 and vested == false"

      - name: agent_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_AGENT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent agent id yields the error envelope with ERR_AGENT_NOT_FOUND and HTTP 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /agents/00000000-0000-0000-0000-000000000000", as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AGENT_NOT_FOUND, HTTP 404"

      - name: ledger_entry_append_only_immutability
        claim_type: immutability
        grounds: [entities.ProfitShareLedgerEntry]
        distinguishing_aspect: "ProfitShareLedgerEntry has common_fields false (no version/updated_at) and no update/delete endpoint; entries persist unchanged through the period's preliminary close."
        test_recipe:
          setup: ["Center with ACTIVE mca; period 2026-09 OPEN"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
          trigger:
            - { call: "POST /profit-share-periods/${per}/ledger-entries", payload: { entry_type: "EXPENSE", amount: 100.00, memo: "rent" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { le1: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount: -25.00 }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { le2: $.data.id } }
            - { call: "GET /profit-share-periods/${per}/ledger-entries", as: PlatformAdmin }
          assert:
            - "Ledger list contains exactly 2 entries: ${le1} EXPENSE 100.00 and ${le2} ADJUSTMENT -25.00"
            - "Ledger entries carry no version field (append-only resource)"
            - "No PUT/PATCH/DELETE endpoint exists for ProfitShareLedgerEntry in §1.5"

      - name: enroll_rejects_computed_field_override
        claim_type: computed_field_input_ignored
        grounds: [entities.Agent.fields.accrued_company_dollar, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Client-supplied computed fields (accrued_company_dollar) in the enrollment payload are rejected with ERR_VALIDATION rather than silently honored."
        test_recipe:
          setup: ["One market center"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
          trigger:
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z", accrued_company_dollar: 9999.00 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION, HTTP 400 — computed fields are never client-settable"

      - name: agents_list_pagination_and_membership_filter
        claim_type: listing
        grounds: [entities.Agent, response_envelope]
        distinguishing_aspect: "GET /agents honors limit/offset with total_count and has_more, and the membership_status filter narrows the result set."
        test_recipe:
          setup: ["Center with three enrolled agents (a1 ACTIVE, a2 ACTIVE, a3 PENDING)"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A Two", email: "a2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${a1}" }, as: PlatformAdmin, captures: { a2: $.data.id } }
            - { call: "POST /agents/${a2}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-a2-att", attested_sponsor_agent_id: "${a1}" }, as: PlatformAdmin }
            - { call: "POST /agents/${a2}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a2-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a2}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a2-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A Three", email: "a3@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${a1}" }, as: PlatformAdmin, captures: { a3: $.data.id } }
          trigger:
            - { call: "GET /agents", as: PlatformAdmin, payload: { market_center_id: "${mc}", limit: 2 } }
            - { call: "GET /agents", as: PlatformAdmin, payload: { market_center_id: "${mc}", limit: 2, offset: 2 } }
            - { call: "GET /agents", as: PlatformAdmin, payload: { market_center_id: "${mc}", membership_status: "ACTIVE" } }
          assert:
            - "Page 1: 2 rows, total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 row, has_more == false"
            - "membership_status=ACTIVE filter: exactly 2 rows (${a1}, ${a2}); ${a3} excluded while ENROLLED_PENDING_DOCS"

      - name: vesting_schedule_created_at_enrollment
        claim_type: computed_fields
        grounds: [entities.VestingSchedule, state_machines.VestingSchedule]
        distinguishing_aspect: "Enrollment synthesizes a 1:1 VestingSchedule: ACCRUING, vesting_start_date equal to join_date, both ratio variants zero."
        test_recipe:
          setup: ["One market center"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
          trigger:
            - { call: "GET /agents/${a1}/vesting-schedule", as: PlatformAdmin, captures: { st: "$.data[0].status", vsd: "$.data[0].vesting_start_date" } }
          assert:
            - "Exactly one schedule row; status == ACCRUING"
            - "vesting_start_date == 2026-09-01T00:00:00Z; vested_ratio_provisional == 0.0000 and vested_ratio_final == 0.0000"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: sponsored_agent_activation_requires_attestation
        claim_type: conditional_activation
        grounds: [state_machines.Agent]
        distinguishing_aspect: "A sponsored agent stays ENROLLED_PENDING_DOCS with only ICA_SIGNED + W9; the SPONSOR_ATTESTATION completes the set and flips membership to ACTIVE — conditional document set keyed on sponsor presence."
        test_recipe:
          setup: ["Center with ACTIVE sponsor mca"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S One", email: "s1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${s1}", as: PlatformAdmin, captures: { mem1: $.data.membership_status } }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "GET /agents/${s1}", as: PlatformAdmin, captures: { mem2: $.data.membership_status } }
          assert:
            - "After ICA+W9 only: membership_status == ENROLLED_PENDING_DOCS (sponsored agent's set incomplete)"
            - "After SPONSOR_ATTESTATION: membership_status == ACTIVE"

      - name: dispute_resolve_from_filed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SponsorshipDispute, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "resolve from FILED (skipping open-review) is an invalid transition — ERR_INVALID_STATE, no resolution recorded."
        test_recipe:
          setup: ["mca sponsors r1 and s2; attestation att on s2 names r1; dispute FILED"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "R One", email: "r1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { r1: $.data.id } }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-r1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-r1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-r1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S Two", email: "s2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s2: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s2-att", attested_sponsor_agent_id: "${r1}" }, as: PlatformAdmin, captures: { att: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s2-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s2-w9" }, as: PlatformAdmin }
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${s2}", evidence_document_id: "${att}", reason: "mine" }, as: Agent, as_user_id: "${r1}", captures: { dsp: $.data.id } }
          trigger:
            - { call: "POST /sponsorship-disputes/${dsp}/resolve", payload: { outcome: "UPHELD" }, as: RegionalDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409 — FILED is not a valid source state for resolve"
            - "SponsorshipDispute.${dsp}.status remains FILED and resolution is null"

      - name: final_closed_period_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProfitSharePeriod, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From FINAL_CLOSED, both ledger-entries and preliminary-close are rejected ERR_INVALID_STATE; the period accepts no further mutations."
        test_recipe:
          setup: ["Center with ACTIVE mca (who ran prelim close) and alc chair; a1 settled 20000.00; period 2026-09 fully FINAL_CLOSED"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "ALC Chair", email: "alc@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { alc: $.data.id } }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-alc-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-alc-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${mca}", as: PlatformAdmin, captures: { v1: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${mca}", gross_commission: 20000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-1", expected_agent_version: "${v1}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev: $.data.id } }
            - { call: "POST /commission-events/${ev}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/governance-resolutions", payload: { resolution_type: "FINAL_CLOSE_RATIFICATION" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { res: $.data.id } }
            - { call: "POST /governance-resolutions/${res}/propose", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /governance-resolutions/${res}/ratify", as: ALCChair, as_user_id: "${alc}" }
          trigger:
            - { call: "POST /profit-share-periods/${per}/ledger-entries", payload: { entry_type: "EXPENSE", amount: 10.00 }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { err1: $.data.error_id } }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}", captures: { err2: $.data.error_id } }
          assert:
            - "Both attempts: error_id == ERR_INVALID_STATE, HTTP 409"
            - "ProfitSharePeriod.${per}.status remains FINAL_CLOSED with final_profit 6000.00 unchanged"

      - name: distribution_markpaid_from_projection_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ProfitShareDistribution, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "mark-paid requires PAYABLE; a PROJECTION distribution (period only preliminarily closed) rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["mca sponsors d1; d1 settled 5000.00 (company dollar 1500.00); period 2026-09 PRELIMINARY_CLOSED with mca's PROJECTION distribution 750.00 (pool 780.00, no scaling)"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "D One", email: "d1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { d1: $.data.id } }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-d1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-d1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-d1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${d1}", as: PlatformAdmin, captures: { d1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${d1}", gross_commission: 5000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-d1", expected_agent_version: "${d1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev: $.data.id } }
            - { call: "POST /commission-events/${ev}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
          trigger:
            - { call: "GET /profit-share-distributions", as: PlatformAdmin, payload: { period_id: "${per}", agent_id: "${mca}" }, captures: { dist: "$.data[0].id", amt: "$.data[0].amount" } }
            - { call: "POST /profit-share-distributions/${dist}/mark-paid", as: MarketCenterAdmin, as_user_id: "${mca}", captures: { err: $.data.error_id } }
          assert:
            - "PROJECTION distribution amount == 750.00 (0.50 * 1500.00; pool 780.00 covers it, no scaling)"
            - "mark-paid on PROJECTION: error_id == ERR_INVALID_STATE, HTTP 409"

      - name: transfer_reject_terminal_then_approve_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TransferRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal for TransferRequest: a later approve attempt fails ERR_INVALID_STATE and the fork not taken stays closed."
        test_recipe:
          setup: ["Centers MC1, MC2; ACTIVE a1 in MC1 with a REQUESTED transfer to MC2 effective 2026-10-01"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Two", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc2: $.data.id } }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
            - { call: "POST /agents/${a1}/transfer-requests", payload: { to_market_center_id: "${mc2}", effective_date: "2026-10-01T00:00:00Z", expected_agent_version: "${av}" }, as: Agent, as_user_id: "${a1}", captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /transfer-requests/${tr}/reject", as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "POST /transfer-requests/${tr}/approve", as: MarketCenterAdmin, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "After reject: status REJECTED; approve attempt: error_id == ERR_INVALID_STATE, HTTP 409"

      - name: governance_reject_amend_repropose_cycle
        claim_type: cyclic_transition
        grounds: [state_machines.GovernanceResolution, state_machines.ProfitSharePeriod]
        distinguishing_aspect: "REJECTED -> DRAFT via amend reopens the resolution loop, and the period returns to PRELIMINARY_CLOSED then FINAL_CLOSE_PENDING again — a governed revision cycle with period state coupled to resolution state."
        test_recipe:
          setup: ["Center with mca and alc; mca settled 20000.00; period 2026-09 PRELIMINARY_CLOSED with resolution DRAFT"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
