      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Incident.CONFIRMED_to_DECLARED_WILDFIRE
          - state_machines.BurnPlan.APPROVED_to_CANCELLED
        excluded_because:
          difficulty_instance: wildfire_declaration_full_chain
          rationale: "N-level cascade verified end-to-end by wildfire_declaration_full_chain (depth 3), plan_cancel_releases_contractor_capacity (depth 2), and successor_approval_supersedes_prior_chain (depth 3) in section 1.8."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "The submit response itself carries status SUBMITTED and version 2, and an immediate GET returns the identical values (no eventual-consistency lag)."
        test_recipe:
          setup: ["Plan DRAFT"]
          setup_api_calls:
            - { call: "POST /associations", payload: {name: "Assoc", airshed_daily_acres_cap: 500, single_claim_cap_cents: 500000, landowner_liability_cap_cents: 1000000, initial_fund_cents: 10000000}, as: AssociationAdmin }
