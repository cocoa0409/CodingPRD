      - name: granting_a_relocation_mints_a_market_priced_row_and_releases_the_prior_seat
        claim_type: cross_entity
        grounds:
          - state_machines.RelocationRequest.status.transitions.AWAITING_SELECTION_to_GRANTED
          - state_machines.SeatAssignment.occupancy_status.transitions.HELD_to_RELEASED
          - calculations.seat_requirement_amount
          - calculations.section_pricing_posture
        distinguishing_aspect: |
          A single decide GRANT is a four-entity swap: it mints a SeatAssignment
          on the target seat priced under the MARKET variant (never the RENEWAL
          escalator, because the donor has no prior occupancy in the target
          section) with selection_slot_id null, releases the prior assignment with
          release_reason DONOR_RELEASE, walks that assignment's CONSUMED slot back
          to FORFEITED, and re-derives BOTH sections' posture — the vacated
          section falls to NORMAL while the now-full target section reaches
          PREMIUM (underwater_ratio 0 with seats_available 0). Note the request is
          filed against an event in SLOTS_PUBLISHED, which
          ERR_EVENT_NOT_OPEN_FOR_REQUESTS permits, so no gate call is needed.
        test_recipe:
          setup:
            - "Sections SEC-K (OPEN, capacity 2, per_seat_requirement_cents 100000, required_points_per_seat 0, seats K/1 and K/2) and SEC-L (OPEN, capacity 1, per_seat_requirement_cents 200000, required_points_per_seat 0, seat L/1 AVAILABLE)."
