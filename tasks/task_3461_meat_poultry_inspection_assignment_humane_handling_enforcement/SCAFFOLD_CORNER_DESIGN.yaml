              payload: { full_name: "Ina Inspector", badge_number: "B-CM1", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "OTHER", description: "visibility probe", observed_at: "2026-08-31T06:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { nr1: $.data.id }
            - call: "GET /inspection/noncompliance-records/${nr1}"
              as: DistrictManager
          assert:
            - "the POST response already shows status == OPEN and issued_at == 2026-09-01T00:00:00Z"
            - "the subsequent GET returns the same values (no asynchronous reconciliation)"

