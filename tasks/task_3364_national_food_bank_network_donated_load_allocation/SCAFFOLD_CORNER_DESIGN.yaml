  # ===========================================================================
  - section: rbac
    instances:

      - name: auditor_cannot_complete_own_audit
        claim_type: segregation_of_duties
        grounds:
          - roles.NetworkAuditor.exclusive_operations
          - validations[priority=3]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The operator who created the audit may not complete it: with X-User-ID ops_admin_1 on both calls the completion is rejected with ERR_SEGREGATION_OF_DUTIES (403), while a different operator id succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member M1 is PENDING_CERTIFICATION with one IN_PROGRESS COMPREHENSIVE audit created by operator ops_admin_1."
          setup_api_calls:
            - *c_clk
            - *c_m1
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
          trigger:
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "ops_admin_1"
              captures: { err: $.data.error_id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
              captures: { st: $.data.audit_status }
          assert:
            - "the same-operator completion returns ${err} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "MemberAudit.${aud1}.audit_status is still IN_PROGRESS after the rejected call"
            - "the different-operator completion succeeds with audit_status == ${st} == PASSED"

      - name: member_cannot_create_donor_agreement
        claim_type: peer_roles
        grounds:
          - roles.NetworkAdmin.exclusive_operations
          - roles.MemberFoodBank.identity
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Donor agreement creation is exclusive to NetworkAdmin, so the entity-backed MemberFoodBank role is rejected with ERR_FORBIDDEN (403) even for its own member id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member M1 exists."
          setup_api_calls:
            - *c_clk
            - *c_m1
          trigger:
            - call: "POST /network/donor-agreements"
              payload: { donor_name: "Rogue Member Deal", donor_type: "RETAILER", product_category: "DRY_GOODS", committed_lbs: 1000, freight_subsidy_pool_cents: 5000 }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id ${err} == ERR_FORBIDDEN with HTTP 403"
            - "no DonorAgreement row was created"

