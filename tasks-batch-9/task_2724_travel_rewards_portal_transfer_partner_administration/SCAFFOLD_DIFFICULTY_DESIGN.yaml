            - call: "POST /rewards/bonus-events"
              payload: { partner_agreement_id: "${pa_id}", event_code: "SEP-LATE-20", bonus_bps: 2000, window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-16T00:00:00Z", cap_points_per_account: 6000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ev_ok_id: $.data.id }
          assert:
            - "the event starting at 2026-09-11T00:00:00Z returns 409 with error_id ERR_BONUS_EVENT_WINDOW_CONFLICT because 2026-09-11T00:00:00Z is not strictly after window_end plus 24 hours"
            - "no TransferBonusEvent with event_code SEP-EXACT-BUFFER exists"
            - "the event starting at 2026-09-12T00:00:00Z returns 201"
            - "TransferBonusEvent.${ev_ok_id}.status == SCHEDULED"
            - "TransferBonusEvent.${ev_first_id}.status == SCHEDULED"
            - "exactly 2 TransferBonusEvent rows exist with partner_agreement_id ${pa_id}"

      - name: overlap_offer_seat_capacity_collides_after_downward_resync
        grounds:
          - validations[priority=67]
          - errors.ERR_SEAT_UNAVAILABLE
          - entities.PortalInventoryOffer.fields.seats_committed
          - entities.PortalInventoryOffer.fields.portal_seats
          - concurrency_rules[offer-book-stale-offer-version]
        distinguishing_aspect: |
          A third interval semantics: AGGREGATE CAPACITY occupation of one PortalInventoryOffer,
          where the contested dimension is a seat count rather than a time span, and the collision
          is created by shrinking the resource instead of by extending an interval. Two committed
          seats are legal at portal_seats 4; after a resync lowers portal_seats to exactly 2 the
          same two occupations now saturate the offer and the third booking is rejected with 409
          ERR_SEAT_UNAVAILABLE even though the offer is still OPEN and IN_PARITY.
