# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Formalwear & Costume Rental — depth probe over the nine §0.5 Difficulty Rules.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls /
# trigger chain is executable from empty-DB using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: booking_quote_provisional_vs_final_on_reservation
        grounds:
          - calculations.booking_quote
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - entities.Reservation.fields.quoted_charge_cents
        distinguishing_aspect: |
          Dual-variant lives on the Reservation domain: the provisional quote at confirm is rental+waiver
          only (quoted_charge_cents), while the final rental baseline carried into settlement never adds
          late/damage — the two variants of booking_quote differ in whether downstream fees stack on top.
        test_recipe:
          setup:
            - "A FORMALWEAR catalog (daily_rate 5000, waiver_daily 1200) with one AVAILABLE size-M unit."
            - "A customer with a confirmed 5-day reservation opting into the damage waiver."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux A", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada R", email: "ada@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: true }
              as: StoreClerk
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
              captures: { quoted: $.data.quoted_charge_cents, rdays: $.data.rental_days, st: $.data.status }
          assert:
            - "Reservation.${resv_id}.status == CONFIRMED"
            - "Reservation.${resv_id}.rental_days == 5"
            - "Reservation.${resv_id}.quoted_charge_cents == 28500"   # eff_daily round(5000*0.90)=4500 *5 =22500 + waiver 1200*5=6000
            - "Reservation.${resv_id}.quoted_charge_cents does NOT include any late or damage fee (those appear only on the Settlement)"

      - name: settlement_charges_clean_vs_damaged_on_settlement
        grounds:
          - calculations.settlement_charges
          - state_machines.Reservation.PICKED_UP_to_RETURNED
          - entities.Settlement.fields.net_charge_cents
        distinguishing_aspect: |
          Dual-variant lives on the Settlement domain (a different entity from booking_quote's Reservation):
          identical reservation inputs yield net_charge_cents == 0 with disposition CLEAN but
          net_charge_cents == 28000 with disposition DAMAGED — the damage branch diverges from the clean branch.
        test_recipe:
          setup:
            - "An identical confirmed-then-picked-up reservation returned DAMAGED on time; compared against the CLEAN counterfactual."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux B", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ben D", email: "ben@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurement-profiles"
              payload: { chest_cm: 100, waist_cm: 84, inseam_cm: 80 }
              as: StoreClerk
              captures: { mp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-04T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-03T17:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /fit-checks"
              payload: { reservation_id: "${resv_id}", measurement_profile_id: "${mp_id}" }
              as: StoreClerk
            - call: "POST /reservations/${resv_id}/pickup"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /reservations/${resv_id}/return"
              payload: { returned_at_iso: "2026-09-03T12:00:00Z", disposition: "DAMAGED" }
              as: StoreClerk
              captures: { net: $.data.net_charge_cents, dmg: $.data.damage_fee_cents, refund: $.data.deposit_refund_cents }
          assert:
            - "Settlement.${resv_id}.damage_fee_cents == 48000"      # min(80000, round(80000*0.60)=48000)
            - "Settlement.${resv_id}.net_charge_cents == 28000"      # gross 48000 - deposit 20000
            - "Settlement.${resv_id}.deposit_refund_cents == 0"
            - "Had disposition been CLEAN with the same inputs, net_charge_cents would be 0 and deposit_refund_cents 20000 — the variant delta"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_charges_nested_min_max_branches
        grounds:
          - calculations.settlement_charges
          - entities.Settlement.fields.waiver_credit_cents
          - entities.Settlement.fields.deposit_refund_cents
        distinguishing_aspect: |
          MODE (a): >=3 inputs (disposition, waiver flag, deposit, replacement_value, late_days) interacting
          non-linearly through nested min/max — damage = min(replacement, round(replacement*0.60)),
          waiver = min(damage, 30000), deposit waterfall = min(deposit, gross) — branches on disposition.
        test_recipe:
          setup:
            - "A confirmed-picked-up reservation on a catalog with replacement_value 80000, deposit 20000, waiver opted; returned DAMAGED on time."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Gown C", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cleo F", email: "cleo@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurement-profiles"
              payload: { chest_cm: 100, waist_cm: 84, inseam_cm: 80 }
              as: StoreClerk
              captures: { mp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-04T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-03T17:00:00Z", damage_waiver_opted: true }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /fit-checks"
              payload: { reservation_id: "${resv_id}", measurement_profile_id: "${mp_id}" }
              as: StoreClerk
            - call: "POST /reservations/${resv_id}/pickup"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /reservations/${resv_id}/return"
              payload: { returned_at_iso: "2026-09-03T12:00:00Z", disposition: "DAMAGED" }
              as: StoreClerk
              captures: { wc: $.data.waiver_credit_cents, net: $.data.net_charge_cents, refund: $.data.deposit_refund_cents }
          assert:
            - "Settlement.${resv_id}.damage_fee_cents == 48000"
            - "Settlement.${resv_id}.waiver_credit_cents == 30000"   # min(48000, WAIVER_CAP 30000)
            - "Settlement.${resv_id}.net_charge_cents == 0"          # gross 48000-30000=18000; deposit 20000 absorbs all
            - "Settlement.${resv_id}.deposit_refund_cents == 2000"   # 20000 - applied 18000

      - name: booking_quote_round_per_day_then_multiply
        grounds:
          - calculations.booking_quote
          - entities.Reservation.fields.quoted_charge_cents
          - entities.Catalog.fields.daily_rate_cents
        distinguishing_aspect: |
          MODE (b): nested-rounding order pinned — round the per-day effective rate FIRST then multiply by
          rental_days. With daily_rate 3333, tier2 0.90, 5 days: round(3333*0.90)=3000 -> 15000, whereas the
          forbidden sum-then-round path round(3333*0.90*5)=14999 differs by 1 cent. Distinct MODE from instance (a).
        test_recipe:
          setup:
            - "A FORMALWEAR catalog with daily_rate 3333 and a confirmed 5-day reservation (no waiver)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Suit D", category: "FORMALWEAR", daily_rate_cents: 3333, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dax G", email: "dax@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
              captures: { quoted: $.data.quoted_charge_cents }
          assert:
            - "Reservation.${resv_id}.rental_days == 5"
            - "Reservation.${resv_id}.quoted_charge_cents == 15000"  # round-per-day: round(3333*0.9)=3000*5=15000 (NOT 14999)

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_branching_fork_join_pickedup_to_returned_or_overdue
        grounds:
          - state_machines.Reservation.PICKED_UP_to_RETURNED
          - state_machines.Reservation.PICKED_UP_to_OVERDUE
          - state_machines.Reservation.OVERDUE_to_SETTLED
        distinguishing_aspect: |
          Reservation has a branching fork-join: PICKED_UP -> {RETURNED (on-time, late_fee=0) | OVERDUE
          (late, late_fee>0)} -> SETTLED, with divergent side-effect sets per branch (the late branch posts
          late_fee_cents; the on-time branch forces it to 0). Non-linear on the Reservation entity.
        test_recipe:
          setup:
            - "A confirmed-picked-up reservation returned AFTER the window end so it takes the OVERDUE branch."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux E", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Eve H", email: "eve@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurement-profiles"
              payload: { chest_cm: 100, waist_cm: 84, inseam_cm: 80 }
              as: StoreClerk
              captures: { mp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-04T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-03T17:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /fit-checks"
              payload: { reservation_id: "${resv_id}", measurement_profile_id: "${mp_id}" }
              as: StoreClerk
            - call: "POST /reservations/${resv_id}/pickup"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /reservations/${resv_id}/return"
              payload: { returned_at_iso: "2026-09-05T17:00:00Z", disposition: "CLEAN" }
              as: StoreClerk
              captures: { late_days: $.data.late_days, late_fee: $.data.late_fee_cents }
          assert:
            - "Settlement.${resv_id}.late_days == 2"                 # 2026-09-05T17:00 vs window end 2026-09-03T17:00 -> exactly 2 days
            - "Settlement.${resv_id}.late_fee_cents == 4000"         # 2 * 2000
            - "Reservation.${resv_id}.status == OVERDUE"             # late branch, not RETURNED

      - name: garment_unit_cyclic_available_reserved_available
        grounds:
          - state_machines.GarmentUnit.AVAILABLE_to_RESERVED
          - state_machines.GarmentUnit.RESERVED_to_AVAILABLE
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          GarmentUnit has a cycle AVAILABLE -> RESERVED -> AVAILABLE: confirming a reservation reserves the
          unit, cancelling that confirmed reservation returns the SAME unit to AVAILABLE. Non-linear on a
          DIFFERENT entity (GarmentUnit) than the Reservation branching instance.
        test_recipe:
          setup:
            - "A confirmed reservation holding one unit; then the reservation is cancelled."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux F", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Fay I", email: "fay@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
              captures: { picked_unit: $.data.garment_unit_id }
          trigger:
            - call: "POST /reservations/${resv_id}/cancel"
              payload: {}
              as: StoreClerk
            - call: "GET /garment-units/${unit_id}"
              payload: {}
              as: StoreClerk
              captures: { unit_status: $.data.status }
          assert:
            - "After confirm, GarmentUnit.${unit_id}.status == RESERVED"
            - "After cancel, GarmentUnit.${unit_id}.status == AVAILABLE"   # cycled back
            - "Reservation.${resv_id}.status == CANCELLED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: party_dissolve_cascades_member_cancel_then_unit_release
        grounds:
          - state_machines.PartyOrder.FORMING_to_DISSOLVED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.GarmentUnit.RESERVED_to_AVAILABLE
        distinguishing_aspect: |
          Depth-3 cascade from the DISSOLVE trigger: PartyOrder dissolve -> member Reservation CONFIRMED->CANCELLED
          -> that cancellation releases its GarmentUnit RESERVED->AVAILABLE. Each link is caused by the previous,
          not directly by dissolve.
        test_recipe:
          setup:
            - "A FORMING party with one CONFIRMED member reservation (required_member_count 2 so it stays FORMING) holding a unit."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux G", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Gus J", email: "gus@x.com" }
              as: StoreClerk
              captures: { coord_id: $.data.id }
            - call: "POST /party-orders"
              payload: { coordinator_customer_id: "${coord_id}", event_date_iso: "2026-09-06T00:00:00Z", required_member_count: 2 }
              as: Customer
              as_user_id: "${coord_id}"
              captures: { party_id: $.data.id, party_v: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${coord_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", party_order_id: "${party_id}", damage_waiver_opted: false }
              as: Customer
              as_user_id: "${coord_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: { expected_party_order_version: "${party_v}" }
              as: StoreClerk
              captures: { picked_unit: $.data.garment_unit_id }
          trigger:
            - call: "POST /party-orders/${party_id}/dissolve"
              payload: {}
              as: Customer
              as_user_id: "${coord_id}"
            - call: "GET /reservations/${resv_id}"
              payload: {}
              as: StoreClerk
              captures: { rstat: $.data.status }
            - call: "GET /garment-units/${unit_id}"
              payload: {}
              as: StoreClerk
              captures: { ustat: $.data.status }
          assert:
            - "PartyOrder.${party_id}.posture == DISSOLVED"
            - "Reservation.${resv_id}.status == CANCELLED"          # hop 2 caused by dissolve
            - "GarmentUnit.${unit_id}.status == AVAILABLE"          # hop 3 caused by the member cancellation

      - name: lost_return_cascades_unit_retire_then_catalog_recount
        grounds:
          - state_machines.Reservation.PICKED_UP_to_RETURNED
          - state_machines.GarmentUnit.IN_CLEANING_to_RETIRED
          - entities.Catalog.fields.active_unit_count
        distinguishing_aspect: |
          Depth-2+ cascade from the RETURN trigger (a DIFFERENT trigger than dissolve): a LOST return drives
          GarmentUnit -> RETIRED, and that retirement decrements Catalog.active_unit_count. The catalog recount
          is caused by the unit retirement, not directly by the return.
        test_recipe:
          setup:
            - "A confirmed-picked-up reservation on a catalog whose only unit will be lost on return."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux H", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Hal K", email: "hal@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurement-profiles"
              payload: { chest_cm: 100, waist_cm: 84, inseam_cm: 80 }
              as: StoreClerk
              captures: { mp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-04T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-03T17:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /fit-checks"
              payload: { reservation_id: "${resv_id}", measurement_profile_id: "${mp_id}" }
              as: StoreClerk
            - call: "POST /reservations/${resv_id}/pickup"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /reservations/${resv_id}/return"
              payload: { returned_at_iso: "2026-09-03T12:00:00Z", disposition: "LOST" }
              as: StoreClerk
            - call: "GET /garment-units/${unit_id}"
              payload: {}
              as: StoreClerk
              captures: { ustat: $.data.status }
            - call: "GET /catalogs/${cat_id}"
              payload: {}
              as: StoreClerk
              captures: { auc: $.data.active_unit_count }
          assert:
            - "GarmentUnit.${unit_id}.status == RETIRED"            # hop 1: LOST -> retire
