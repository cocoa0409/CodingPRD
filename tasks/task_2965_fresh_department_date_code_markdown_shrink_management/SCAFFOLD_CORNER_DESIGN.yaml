              as: StoreOperationsAdmin
              captures: { ladder_meat: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_meat}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "DELI-STD-2026", department_code: "DELI", rungs: [{ days_remaining_max: 3, discount_pct: 20, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 55, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_deli: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_deli}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_meat}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_meat: $.data.id }
