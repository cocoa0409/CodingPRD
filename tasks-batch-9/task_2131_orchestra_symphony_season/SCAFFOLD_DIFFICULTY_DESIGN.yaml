          - validations[priority=8]
          - errors[ERR_CONCERT_NOT_PROGRAMMED]
          - entities.Concert.fields.programming_status
        distinguishing_aspect: |
          Entity pair GuestArtistContract -> Concert: the contract's own status is a perfectly
          legal OFFERED, yet the OFFERED -> SIGNED edge is refused while the parent concert's
          programming_status is DRAFT, and the identical request succeeds the moment the
          concert reaches PROGRAMMED.
        test_recipe:
          setup:
            - "Season 2027 in PLANNING"
