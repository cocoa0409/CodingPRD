              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /data-feed-batches/${b_id}/validate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /projection-methodologies"
              payload: { name: "M-DELTA", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
