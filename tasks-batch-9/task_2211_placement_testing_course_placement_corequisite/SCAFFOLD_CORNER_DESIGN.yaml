  # ===========================================================================
  # 9. From Consistency Model
  # ===========================================================================
  - section: Consistency Model
    instances:

      - name: a_disputed_evidence_axis_denies_promotes_and_rebalances_before_the_response_returns
        claim_type: immediate
        grounds: ["endpoints[POST /placement-determinations/{determination_id}/evidence]", calculations.section_seat_ledger_invariant, consistency_model]
        distinguishing_aspect: |
          consistency_model is immediate, so there is no settling period and no
          background sweep: the denial, the seat release, the waitlist promotion and
          every derived counter are all true the instant the evidence request returns.
          The reads that verify this happen with the logical clock UNCHANGED, which is
          exactly what an eventually-consistent implementation would fail.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z for the WHOLE recipe — no clock call appears anywhere."
            - "Course MATH-050, ACTIVE rule TRANSCRIPT_GPA -> MATH-050, Section secI (room R797, seat_capacity 1) OPEN."
            - "Students SC1 and SC2 (both hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z) each with a determination placing MATH-050."
            - "SC1 is ENROLLED in the single seat; SC2 is WAITLISTED behind them."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R797", meets_start_at: "2026-09-02T10:00:00Z", meets_end_at: "2026-09-02T11:00:00Z", seat_capacity: 1 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { seci: $.data.id }
            - call: "POST /sections/${seci}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /students"
              payload: { student_number: "SC1", full_name: "Student C One", race_ethnicity_code: "WHITE", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sc1: $.data.id, sc1_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sc1}", subject_area: "MATH", expected_student_version: "${sc1_v}" }
              as: AssessmentStaff
