              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NJ" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2022, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "NJ", workday_ratio_bps: 4000 }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
