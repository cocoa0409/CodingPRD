            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i2_id}", sequence_index: 2, distance_from_prev_ft: 2640 }
              as: SignalOpsAdmin
          trigger:
            - call: "GET /signal-ops/corridors/${c1_id}/members"
              payload: {}
              as: SignalOpsAdmin
              captures: { m1_seq: "$.data[0].sequence_index", m1_dist: "$.data[0].distance_from_prev_ft", m1_int: "$.data[0].intersection_id", m2_seq: "$.data[1].sequence_index", m2_dist: "$.data[1].distance_from_prev_ft", m2_int: "$.data[1].intersection_id" }
