  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_subscription_create_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[subscription-create-stale-household]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Creating a subscription for season 2026 advances Household.version 1 -> 2; a second create (season 2027) carrying the stale expected_household_version 1 is rejected 412 ERR_STALE_VERSION; re-reading and resubmitting with version 2 succeeds."
        test_recipe:
          setup: ["clock 2026-04-15; opt-in zone; household created (version 1); 2026 subscription created with expected version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
          trigger:
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2027, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { err: $.data.error_id } }
            - { call: "GET /households/${hh_a}", as: ProgramAdmin, captures: { hh_a_v2: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2027, expected_household_version: "${hh_a_v2}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_b: $.data.id, sub_b_st: $.data.status } }
          assert:
            - "capture ${err} == ERR_STALE_VERSION"
            - "capture ${hh_a_v2} == 2"
            - "capture ${sub_b_st} == PENDING_PAYMENT"
            - "Household.${hh_a}.version == 3"

      - name: occ_surge_booking_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[surge-booking-stale-event]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "A successful booking advances SurgeEvent.version 1 -> 2; a second household's booking carrying expected_surge_event_version 1 is rejected 412 ERR_STALE_VERSION and no booking is created."
        test_recipe:
          setup: ["universal households A and B ACTIVE; OPEN event capacity 5, version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_b: $.data.id, hh_b_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_b}", season_year: 2026, expected_household_version: "${hh_b_v}" }, as: Resident, as_user_id: "${hh_b}", captures: { sub_b: $.data.id } }
            - { call: "POST /surge-events", payload: { zone_id: "${zone_u}", event_type: "LEAF_SURGE", service_date: "2026-11-07", capacity_slots: 5, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-11-01T00:00:00Z" }, as: ProgramAdmin, captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /surge-bookings", payload: { surge_event_id: "${ev}", household_id: "${hh_a}", quantity_bundles: 2, expected_surge_event_version: "${ev_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { bk_a: $.data.id } }
          trigger:
            - { call: "POST /surge-bookings", payload: { surge_event_id: "${ev}", household_id: "${hh_b}", quantity_bundles: 1, expected_surge_event_version: "${ev_v}" }, as: Resident, as_user_id: "${hh_b}", captures: { err: $.data.error_id } }
            - { call: "GET /surge-bookings?surge_event_id=${ev}", as: ProgramAdmin, captures: { first_bk: "$.data[0].id" } }
          assert:
            - "capture ${err} == ERR_STALE_VERSION"
            - "only one booking exists for the event: capture ${first_bk} == ${bk_a}"
            - "SurgeEvent.${ev}.reserved_slots == 1"

      - name: zone_fee_patch_increments_version_and_preserves_snapshots
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.Subscription.fields.service_model"
          - "entities.Subscription.fields.base_fee_cents"
        distinguishing_aspect: "PATCH zone base fee 12000 -> 13000 increments ServiceZone.version to 2 but does NOT retro-change an existing subscription (fee snapshot pinned at creation: base_fee_cents stays 12000)."
        test_recipe:
          setup: ["clock 2026-04-15; opt-in zone base 12000; household; subscription created (base snapshot 12000)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id, zv0: $.data.version } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
          trigger:
            - { call: "PATCH /service-zones/${zone_o}", payload: { base_seasonal_fee_cents: 13000 }, as: ProgramAdmin, captures: { zv1: $.data.version, zfee: $.data.base_seasonal_fee_cents } }
            - { call: "GET /subscriptions/${sub_a}", as: ProgramAdmin, captures: { sbase: $.data.base_fee_cents } }
          assert:
            - "capture ${zv0} == 1"
            - "capture ${zv1} == 2"
            - "capture ${zfee} == 13000"
            - "capture ${sbase} == 12000"

      - name: credit_applied_via_payment_reconciles_ledger
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.service_credit_balance"
          - "state_machines.ServiceCredit.GRANTED_to_APPLIED"
        distinguishing_aspect: "Paying with use_credit_balance=true consumes the GRANTED 444-cent credit (GRANTED -> APPLIED, oldest first), reduces cash needed to 1056, raises paid_cents to 13500, and returns the household balance to 0."
        test_recipe:
          setup: ["opt-in household; subscription paid cash 12000 (ACTIVE); 64-gal cart added (total due 13500, outstanding 1500); validated missed pickup -> credit 444 approved (GRANTED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions/${sub_a}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /carts", payload: { household_id: "${hh_a}", subscription_id: "${sub_a}", size_gallons: "64" }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /pickup-tickets/${t1}/report-missed", payload: {}, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /pickup-tickets/${t1}/validate-missed", payload: { validated: true }, as: RouteSupervisor, as_user_id: "sup_1" }
            - { call: "GET /service-credits?subscription_id=${sub_a}&status=PENDING_APPROVAL", as: BillingClerk, as_user_id: "clerk_1", captures: { cred: "$.data[0].id" } }
            - { call: "POST /service-credits/${cred}/approve", payload: {}, as: BillingClerk, as_user_id: "clerk_1" }
          trigger:
            - { call: "POST /subscriptions/${sub_a}/pay", payload: { use_credit_balance: true }, as: Resident, as_user_id: "${hh_a}", captures: { sp: $.data.paid_cents, sst: $.data.status } }
            - { call: "GET /service-credits/${cred}", as: BillingClerk, as_user_id: "clerk_1", captures: { cst: $.data.status } }
            - { call: "GET /households/${hh_a}", as: ProgramAdmin, captures: { bal: $.data.credit_balance_cents } }
          assert:
            - "capture ${sp} == 13500"
            - "capture ${sst} == ACTIVE"
            - "capture ${cst} == APPLIED"
            - "capture ${bal} == 0"

      - name: waitlist_promotion_order_earliest_first
        claim_type: cascading_side_effects
        grounds:
          - "calculations.surge_slot_allocation"
          - "state_machines.SurgeBooking.WAITLISTED_to_CONFIRMED"
        distinguishing_aspect: "Selector determinism: with two WAITLISTED bookings, cancelling the CONFIRMED booking promotes the earliest created_at (B with qty 5 before C with qty 1), never the smaller/larger bundle."
        test_recipe:
          setup: ["universal households A/B/C ACTIVE; OPEN event capacity 1; A CONFIRMED; B WAITLISTED (created before C); C WAITLISTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
