scenario: "2373. Streaming Royalty Distribution & Rights Matching (music streaming service royalties): usage data collection with play counts, territory and subscription tier attribution, rights holder identification through recording and composition metadata matching with unmatched work resolution, royalty pool calculation with revenue share models and per-subscriber minimums by tier, publishing royalty administration with mechanical and performance splits routed through collectives and direct deals, unmatched and disputed usage handling with holding accounts and claim windows, statement generation to labels, distributors and publishers with line-item detail, audit rights exercise by rights holders with data production requirements, rate changes from regulatory proceedings with retroactive adjustment"
domain_name: streaming-royalty-distribution
api_prefix: "/royalties"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  difficulty_level: expert_plus
  difficulty_note: |
    Deliberately above the Expert band on surface size (11 entities / 46 endpoints / 44 error
    codes) because FK reverse-reachability forces two GETs per FK-bearing entity. The hardness
    is NOT the surface: it is (i) two royalty-pool denominator variants that yield different
    per-line cents from identical usage, (ii) a per-usage-line-then-sum rounding order that
    differs from sum-then-round by exactly 1 cent, (iii) an admin-fee tier keyed on gross while
    the fee determines net (circular-looking, order pinned), (iv) two interval-overlap
    geometries with opposite wildcard semantics, and (v) a depth-4 retroactive cascade that
    must leave three named conserved quantities intact.
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Work is self-referential (RECORDING -> COMPOSITION via linked_work_id), StatementLine is
  # self-referential (ADJUSTMENT -> original line), and RightsRegistration is a junction
  # between Work and RightsHolder carrying its own lifecycle. No strict ownership tree.

  state_machine_shape: cyclic
  # RightsRegistration cycles UNDER_REVIEW -> NEEDS_EVIDENCE -> UNDER_REVIEW and
  # APPROVED -> DISPUTED -> UNDER_REVIEW -> APPROVED; RoyaltyPool cycles
  # CALCULATED -> FINALIZED -> REOPENED_FOR_ADJUSTMENT -> CALCULATED; AuditEngagement carries
  # two independent parallel state dimensions; AccountingPeriod and UsageBatch are compound
  # (derived by bubble-up from children).

  relationship_patterns:
    - one_to_many          # AccountingPeriod -> UsageBatch -> UsageLine; RoyaltyStatement -> StatementLine
    - many_to_many         # RightsRegistration junctions Work <-> RightsHolder
    - self_referential     # Work.linked_work_id -> Work.id; StatementLine.adjustment_of_line_id -> StatementLine.id
    - cross_aggregate      # StatementLine.pool_id crosses the statement aggregate into the pool aggregate

  role_model: segregation_of_duties
  # The RightsOpsAnalyst whose X-User-ID is recorded on Work.provisional_match_by_user_id by
  # POST /usage-batches/{id}/match may not approve or reject a RightsRegistration for that
  # Work. RegulatoryOfficer may promulgate rates but may not finalize pools; RoyaltyAdmin may
  # finalize pools but may not promulgate rates or adjudicate registrations.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: RightsHolder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the label, distributor, publisher or collective.
        constraints: non-empty, max 200 chars
      - name: holder_type
        type: enum
        source: input
        description: Category of rights holder; drives which right_type values it may register.
        constraints: "one of LABEL, DISTRIBUTOR, PUBLISHER, COLLECTIVE"
      - name: home_territory_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 territory of incorporation, or the literal WORLD.
        constraints: "2 uppercase letters or the literal 'WORLD'"
      - name: direct_deal_rate_bps
        type: integer
        source: input
        description: >-
          Administration rate in basis points withheld from every StatementLine produced by a
          RightsRegistration of this holder whose routing is DIRECT. Required whenever this
          holder is the claimant of a DIRECT registration.
        default: null
        constraints: "null or 0..5000"
      - name: receivable_balance_cents
        type: integer
        source: computed
        description: >-
          (sum of StatementLine.net_cents over lines whose parent RoyaltyStatement.status ==
          ISSUED and whose payee_holder_id == this holder) + (sum of
          AuditEngagement.settled_amount_cents + AuditEngagement.interest_cents over
          engagements of this holder whose finding_status == SETTLED). DRAFT and SUPERSEDED
          statements contribute zero.
      - name: issued_statement_count
        type: integer
        source: computed
        description: Count of RoyaltyStatement rows for this holder whose status == ISSUED.

  - name: Work
    parent: null
    common_fields: true
    fields:
      - name: work_type
        type: enum
        source: input
        description: Whether this row is a sound recording (master side) or a musical composition (publishing side).
        constraints: "one of RECORDING, COMPOSITION"
      - name: identifier
        type: string
        source: input
        description: ISRC when work_type == RECORDING, ISWC when work_type == COMPOSITION.
        constraints: "unique per (work_type, identifier); non-empty; max 32 chars"
      - name: title
        type: string
        source: input
        description: Canonical title used by the metadata matcher.
        constraints: non-empty, max 300 chars
      - name: artist_credit
        type: string
        source: input
        description: Canonical artist credit; used by the metadata matcher for RECORDING rows only.
        default: null
        constraints: "required when work_type == RECORDING; must be null when work_type == COMPOSITION"
      - name: linked_work_id
        type: string
        source: input
        description: "FK -> Work.id; the COMPOSITION this RECORDING embodies. Null for COMPOSITION rows and for recordings with no matched composition."
        default: null
      - name: normalized_title
        type: string
        source: computed
        description: "lowercase(title) with every character outside [a-z0-9 ] removed and runs of spaces collapsed to one, then trimmed."
      - name: normalized_artist
        type: string
        source: computed
        description: "Same normalization applied to artist_credit; null when artist_credit is null."
      - name: rights_state
        type: enum
        source: computed
        description: >-
          Derived from this Work's RightsRegistration rows in this pinned precedence order:
          DISPUTED if any registration has status == DISPUTED; else REGISTERED if any
          registration has status == APPROVED and (right_type == MASTER when work_type ==
          RECORDING, or right_type IN {MECHANICAL, PERFORMANCE} when work_type ==
          COMPOSITION); else PROVISIONAL if any registration has status IN {SUBMITTED,
          UNDER_REVIEW, NEEDS_EVIDENCE}; else UNMATCHED.
        default: UNMATCHED
        constraints: "one of UNMATCHED, PROVISIONAL, REGISTERED, DISPUTED"
      - name: approved_master_share_bps
        type: integer
        source: computed
        description: >-
          Sum of share_bps over RightsRegistration rows for this Work with status == APPROVED
          and right_type == MASTER whose territory_set contains the literal WORLD. Reported
          for observability only; the oversubscription check in validations priority 15 is
          evaluated per concrete territory, not against this field.
        default: 0
      - name: provisional_match_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the RightsOpsAnalyst whose POST /usage-batches/{id}/match call last
          attached a UsageLine to this Work at a match_confidence_bps strictly below 10000.
          Null when no fuzzy match has ever been recorded. Consumed by the segregation-of-duties
          check at validations priority 5.
        default: null

  - name: AccountingPeriod
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Human label for the royalty period, e.g. "2026-06".
        constraints: "unique across AccountingPeriod; non-empty"
      - name: usage_start
        type: string
        source: input
        description: First usage date covered, ISO 8601 date (YYYY-MM-DD).
      - name: usage_end
        type: string
        source: input
        description: Last usage date covered, ISO 8601 date; must be >= usage_start.
      - name: claim_window_closes_at
        type: datetime
        source: computed
        description: >-
          (usage_end at 00:00:00.000Z) + CLAIM_WINDOW_DAYS days. A RightsRegistration may be
          created for a Work carrying usage in this period only while
          current_utc <= claim_window_closes_at (inclusive).
      - name: status
        type: enum
        source: computed
        description: >-
          OPEN on creation. Bubbles to USAGE_SEALED when every UsageBatch of this period has
          status IN {MATCHED, PARTIALLY_MATCHED} and the period has at least one batch.
          Bubbles to DISTRIBUTED when every RoyaltyPool of this period has status == FINALIZED
          and the period has at least one pool. CLOSED by POST /periods/{id}/close. Set to
          REOPENED by the rate-promulgation cascade.
        default: OPEN
        constraints: "one of OPEN, USAGE_SEALED, DISTRIBUTED, CLOSED, REOPENED"
      - name: total_holding_cents
        type: integer
        source: computed
        description: Sum of RoyaltyPool.holding_cents over pools of this period.

  - name: UsageBatch
    parent: AccountingPeriod
    common_fields: true
    fields:
      - name: period_id
        type: string
        source: input
        description: "FK -> AccountingPeriod.id; the period this usage belongs to."
      - name: source_label
        type: string
        source: input
        description: Name of the reporting source (client platform, partner feed).
        constraints: non-empty, max 120 chars
      - name: status
        type: enum
        source: computed
        description: >-
          OPEN on creation; SEALED by POST /usage-batches/{id}/seal; MATCHED or
          PARTIALLY_MATCHED by POST /usage-batches/{id}/match; PARTIALLY_MATCHED becomes
          MATCHED when unmatched_play_count reaches 0 through the registration-approval
          cascade; RECONCILED when every RoyaltyPool of the parent period is FINALIZED.
        default: OPEN
        constraints: "one of OPEN, SEALED, MATCHED, PARTIALLY_MATCHED, RECONCILED"
      - name: line_count
        type: integer
        source: computed
        description: Count of UsageLine rows with batch_id == this batch.
        default: 0
      - name: total_play_count
        type: integer
        source: computed
        description: Sum of UsageLine.play_count over all lines of this batch, regardless of match_status.
        default: 0
      - name: matched_play_count
        type: integer
        source: computed
        description: Sum of UsageLine.play_count over lines of this batch with match_status IN {AUTO_MATCHED, CLAIM_MATCHED}.
        default: 0
      - name: unmatched_play_count
        type: integer
        source: computed
        description: Sum of UsageLine.play_count over lines of this batch with match_status == UNMATCHED.
        default: 0
      - name: disputed_play_count
        type: integer
        source: computed
        description: Sum of UsageLine.play_count over lines of this batch with match_status == DISPUTED.
        default: 0

  - name: UsageLine
    parent: UsageBatch
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> UsageBatch.id; the batch that reported this play aggregate."
      - name: work_id
        type: string
        source: computed
        description: "FK -> Work.id; the RECORDING Work this line was matched to. Null while match_status == UNMATCHED."
        default: null
      - name: reported_isrc
        type: string
        source: input
        description: ISRC as reported by the source; may be absent or wrong.
        default: null
      - name: reported_title
        type: string
        source: input
        description: Track title as reported by the source.
        constraints: non-empty, max 300 chars
      - name: reported_artist
        type: string
        source: input
        description: Artist as reported by the source; may be absent.
        default: null
      - name: territory_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 territory in which the plays occurred.
        constraints: "exactly 2 uppercase letters; the literal 'WORLD' is rejected on usage lines"
      - name: subscription_tier
        type: enum
        source: input
        description: Subscription tier of the subscribers who generated these plays.
        constraints: "one of FREE_AD_SUPPORTED, INDIVIDUAL, FAMILY, STUDENT"
      - name: play_count
        type: integer
        source: input
        description: Number of qualifying plays reported for this (work, territory, tier) cell.
        constraints: ">= 1"
      - name: match_status
        type: enum
        source: computed
        description: >-
          UNMATCHED on creation. AUTO_MATCHED when POST /usage-batches/{id}/match resolves a
          candidate at match_confidence_bps >= AUTO_MATCH_MIN_CONFIDENCE_BPS. CLAIM_MATCHED
          when the registration-approval cascade attaches the line at
          match_confidence_bps >= CLAIM_MATCH_MIN_CONFIDENCE_BPS. DISPUTED when the
          registration that produced the CLAIM_MATCHED attachment moves to DISPUTED.
        default: UNMATCHED
        constraints: "one of UNMATCHED, AUTO_MATCHED, CLAIM_MATCHED, DISPUTED"
      - name: match_confidence_bps
        type: integer
        source: computed
        description: >-
          Confidence of the winning candidate, in basis points: 10000 for reported_isrc equal
          to Work.identifier, 7500 for normalized title AND artist equality, 5000 for
          normalized title equality alone, 0 when no candidate exists.
        default: 0
      - name: attributed_revenue_cents
        type: integer
        source: computed
        description: >-
          Value attributed to this line by the last pool_attribution run of its RoyaltyPool
          (see calculations.pool_attribution). 0 until the pool is calculated.
        default: 0

  - name: RightsRegistration
    parent: null
    common_fields: true
    fields:
      - name: work_id
        type: string
        source: input
        description: "FK -> Work.id; the recording or composition whose rights are claimed."
      - name: claimant_id
        type: string
        source: input
        description: "FK -> RightsHolder.id; the holder asserting the share."
      - name: collective_id
        type: string
        source: input
        description: "FK -> RightsHolder.id; the collective that administers this share. Required when routing == COLLECTIVE, must be null when routing == DIRECT."
        default: null
      - name: right_type
        type: enum
        source: input
        description: Which right is claimed; MASTER applies to RECORDING works, MECHANICAL and PERFORMANCE to COMPOSITION works.
        constraints: "one of MASTER, MECHANICAL, PERFORMANCE"
      - name: routing
        type: enum
        source: input
        description: Whether royalties for this share are paid to the collective or straight to the claimant under a direct deal.
        constraints: "one of DIRECT, COLLECTIVE"
      - name: share_bps
        type: integer
        source: input
        description: Claimed share of the right, in basis points.
        constraints: "1..10000"
      - name: territory_set
        type: array
        source: input
        description: >-
          Either exactly ["WORLD"] or a non-empty list of distinct ISO 3166-1 alpha-2 codes.
          For overlap purposes WORLD is a wildcard that intersects every territory.
        constraints: "non-empty; either ['WORLD'] or 1..250 distinct 2-letter codes; WORLD may not be mixed with codes"
      - name: effective_from
        type: string
        source: input
        description: Inclusive start of the ownership interval, ISO 8601 date.
      - name: effective_to
        type: string
        source: input
        description: "EXCLUSIVE end of the ownership interval, ISO 8601 date; must be strictly after effective_from."
      - name: supersede_overlapping
        type: boolean
        source: input
        description: >-
          When true, approving this registration moves every APPROVED registration of the same
          Work, right_type and claimant whose territory set intersects and whose half-open
          interval overlaps to SUPERSEDED before the oversubscription check runs.
        default: false
      - name: payee_holder_id
        type: string
        source: computed
        description: "FK -> RightsHolder.id; equals collective_id when routing == COLLECTIVE, else claimant_id."
      - name: status
        type: enum
        source: computed
        description: Lifecycle of the claim; see state_machines.RightsRegistration.
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_REVIEW, NEEDS_EVIDENCE, APPROVED, REJECTED, DISPUTED, SUPERSEDED"
      - name: evidence_round
        type: integer
        source: computed
        description: Number of times POST /rights-registrations/{id}/evidence has succeeded on this row.
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RightsOpsAnalyst who last approved or rejected this registration.
        default: null
      - name: disputing_holder_id
        type: string
        source: input
        description: "FK -> RightsHolder.id; the holder that raised the dispute. Null until POST /rights-registrations/{id}/dispute succeeds."
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: Free-text reason recorded by POST /rights-registrations/{id}/reject.
        default: null

  - name: RoyaltyPool
    parent: AccountingPeriod
    common_fields: true
    fields:
      - name: period_id
        type: string
        source: input
        description: "FK -> AccountingPeriod.id; the period whose usage this pool monetises."
      - name: territory_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 territory this pool covers.
        constraints: "exactly 2 uppercase letters; unique together with (period_id, subscription_tier)"
      - name: subscription_tier
        type: enum
        source: input
        description: Subscription tier this pool covers.
        constraints: "one of FREE_AD_SUPPORTED, INDIVIDUAL, FAMILY, STUDENT"
      - name: subscriber_count
        type: integer
        source: input
        description: Average paying subscribers in this territory and tier during the period.
        constraints: ">= 0"
      - name: gross_revenue_cents
        type: integer
        source: input
        description: Gross subscription and advertising revenue booked for this territory and tier.
        constraints: ">= 0"
      - name: applied_rate_schedule_id
        type: string
        source: computed
        description: "FK -> RateSchedule.id; the schedule selected by calculations.rate_schedule_selection at the last calculate run. Null while status == DRAFT."
        default: null
      - name: revenue_share_pool_cents
        type: integer
        source: computed
        description: round_half_up(gross_revenue_cents * applied_rate.revenue_share_bps / 10000).
        default: 0
      - name: minimum_pool_cents
        type: integer
        source: computed
        description: subscriber_count * applied_rate.per_subscriber_minimum_cents.
        default: 0
      - name: statutory_floor_cents
        type: integer
        source: computed
        description: ceil(total_play_count * applied_rate.statutory_floor_per_play_millicents / 1000) where total_play_count is the pool's in-scope play total.
        default: 0
      - name: total_play_count
        type: integer
        source: computed
        description: >-
          Sum of UsageLine.play_count over in-scope lines, where in-scope means
          UsageLine.batch.period_id == this pool's period_id AND
          UsageLine.territory_code == this pool's territory_code AND
          UsageLine.subscription_tier == this pool's subscription_tier.
        default: 0
      - name: denominator_basis
        type: enum
        source: computed
        description: >-
          Which in-scope play total was used as the attribution denominator at the last
          calculate run; see calculations.pool_attribution variants. Frozen at finalize.
        default: null
        constraints: "null or one of ALL_USAGE, MATCHED_ONLY"
      - name: denominator_play_count
        type: integer
        source: computed
        description: The play total actually used as the attribution denominator at the last calculate run.
        default: 0
      - name: distributable_cents
        type: integer
        source: computed
        description: See calculations.pool_distributable_amount.
        default: 0
      - name: allocation_basis
        type: enum
        source: computed
        description: Which of the three floors/ceilings decided distributable_cents; see calculations.pool_distributable_amount.
        default: null
        constraints: "null or one of REVENUE_SHARE, PER_SUBSCRIBER_MINIMUM, STATUTORY_FLOOR"
      - name: matched_attributed_cents
        type: integer
        source: computed
        description: Sum of UsageLine.attributed_revenue_cents over in-scope lines with match_status IN {AUTO_MATCHED, CLAIM_MATCHED}.
        default: 0
      - name: holding_cents
        type: integer
        source: computed
        description: Sum of UsageLine.attributed_revenue_cents over in-scope lines with match_status IN {UNMATCHED, DISPUTED}. This is the pool's holding account.
        default: 0
      - name: rounding_residual_cents
        type: integer
        source: computed
        description: distributable_cents - (sum of UsageLine.attributed_revenue_cents over ALL in-scope lines). Recomputed on every calculate run and frozen at finalize.
        default: 0
      - name: residual_payee_holder_id
        type: string
        source: computed
        description: "FK -> RightsHolder.id; the payee that receives the RESIDUAL StatementLine, selected by calculations.residual_payee_selection at finalize. Null when the pool has no payee."
        default: null
      - name: status
        type: enum
        source: computed
        description: Lifecycle of the pool; see state_machines.RoyaltyPool.
        default: DRAFT
        constraints: "one of DRAFT, CALCULATED, FINALIZED, REOPENED_FOR_ADJUSTMENT"

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - name: rights_holder_id
        type: string
        source: input
        description: "FK -> RightsHolder.id; the payee this statement is addressed to."
      - name: period_id
        type: string
        source: input
        description: "FK -> AccountingPeriod.id; the period being reported."
      - name: status
        type: enum
        source: computed
        description: DRAFT on creation; ISSUED by POST /statements/{id}/issue; SUPERSEDED by the rate-promulgation cascade.
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, SUPERSEDED"
      - name: gross_cents
        type: integer
        source: computed
        description: Sum of StatementLine.gross_cents over lines of this statement.
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Sum of StatementLine.admin_fee_cents over lines of this statement.
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: Sum of StatementLine.net_cents over lines of this statement; equals gross_cents - admin_fee_cents.
        default: 0
      - name: line_count
        type: integer
        source: computed
        description: Count of StatementLine rows with statement_id == this statement.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical clock value at the moment POST /statements/{id}/issue succeeded; null while DRAFT.
        default: null

  - name: StatementLine
    parent: RoyaltyStatement
    common_fields: false
    fields:
      - name: statement_id
        type: string
        source: system
        description: "FK -> RoyaltyStatement.id; the statement this immutable line belongs to."
      - name: pool_id
        type: string
        source: system
        description: "FK -> RoyaltyPool.id; the pool whose distributable amount funded this line."
      - name: work_id
        type: string
        source: system
        description: "FK -> Work.id; the RECORDING work for MASTER lines and the COMPOSITION work for MECHANICAL/PERFORMANCE lines. Null on RESIDUAL lines."
        default: null
      - name: adjustment_of_line_id
        type: string
        source: system
        description: "FK -> StatementLine.id; the superseded line this ADJUSTMENT line corrects. Null unless line_type == ADJUSTMENT."
        default: null
      - name: payee_holder_id
        type: string
        source: system
        description: "FK -> RightsHolder.id; equals the parent statement's rights_holder_id; denormalised so receivable_balance_cents can be summed without a join through RoyaltyStatement."
      - name: line_type
        type: enum
        source: system
        description: >-
          USAGE for AUTO_MATCHED usage, HOLDING_RELEASE for CLAIM_MATCHED usage released out of
          the holding account, RESIDUAL for the pool rounding residual, ADJUSTMENT for a
          retroactive or audit-settlement correction.
        constraints: "one of USAGE, HOLDING_RELEASE, RESIDUAL, ADJUSTMENT"
      - name: right_type
        type: enum
        source: system
        description: Which right this line pays. Null on RESIDUAL lines.
        default: null
        constraints: "null or one of MASTER, MECHANICAL, PERFORMANCE"
      - name: routing
        type: enum
        source: system
        description: Routing of the registration that produced this line. Null on RESIDUAL lines.
        default: null
        constraints: "null or one of DIRECT, COLLECTIVE"
      - name: territory_code
        type: string
        source: system
        description: Territory of the pool that funded this line.
      - name: subscription_tier
        type: enum
        source: system
        description: Subscription tier of the pool that funded this line.
        constraints: "one of FREE_AD_SUPPORTED, INDIVIDUAL, FAMILY, STUDENT"
      - name: play_count
        type: integer
        source: system
        description: Sum of UsageLine.play_count over the usage lines that contributed to this line; 0 on RESIDUAL and ADJUSTMENT lines.
        default: 0
      - name: share_bps
        type: integer
        source: system
        description: share_bps of the registration that produced this line; 10000 on RESIDUAL lines.
      - name: gross_cents
        type: integer
        source: system
        description: See calculations.statement_line_build; may be negative on ADJUSTMENT lines.
      - name: admin_fee_cents
        type: integer
        source: system
        description: See calculations.admin_fee_resolution; always 0 on RESIDUAL lines.
      - name: net_cents
        type: integer
        source: system
        description: gross_cents - admin_fee_cents.

  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - name: rights_holder_id
        type: string
        source: input
        description: "FK -> RightsHolder.id; the holder exercising its audit right."
      - name: statement_id
        type: string
        source: input
        description: "FK -> RoyaltyStatement.id; the issued statement under audit."
      - name: requested_scope_start
        type: string
        source: input
        description: Inclusive first usage date the auditor wants data for, ISO 8601 date.
      - name: requested_scope_end
        type: string
        source: input
        description: Inclusive last usage date the auditor wants data for, ISO 8601 date.
      - name: production_deadline_at
        type: datetime
        source: computed
        description: created_at + DATA_PRODUCTION_DAYS days; the service must have produced every required line by then.
      - name: required_line_count
        type: integer
        source: computed
        description: Count of StatementLine rows with statement_id == this engagement's statement_id, evaluated at engagement creation and frozen thereafter.
        default: 0
      - name: produced_line_count
        type: integer
        source: computed
        description: Count of distinct StatementLine ids accepted across all POST /audit-engagements/{id}/data-productions calls on this engagement.
        default: 0
      - name: production_status
        type: enum
        source: computed
        description: >-
          PENDING while produced_line_count == 0; PARTIAL while
          0 < produced_line_count < required_line_count; COMPLETE when
          produced_line_count == required_line_count. Evolves independently of finding_status.
        default: PENDING
        constraints: "one of PENDING, PARTIAL, COMPLETE"
      - name: finding_status
        type: enum
        source: computed
        description: >-
          NONE until POST /audit-engagements/{id}/findings; ASSERTED thereafter; then SETTLED
          via settle with resolution == UPHOLD or WITHDRAWN via settle with resolution ==
          WITHDRAW. Evolves independently of production_status.
        default: NONE
        constraints: "one of NONE, ASSERTED, SETTLED, WITHDRAWN"
      - name: asserted_underpayment_cents
        type: integer
        source: input
        description: Underpayment the auditor asserts, recorded by POST /audit-engagements/{id}/findings.
        default: 0
        constraints: ">= 1 when supplied"
      - name: settled_amount_cents
        type: integer
        source: input
        description: Amount actually settled; must be <= asserted_underpayment_cents. 0 when resolution == WITHDRAW.
        default: 0
      - name: interest_cents
        type: integer
        source: computed
        description: See calculations.audit_settlement_interest; 0 unless finding_status == SETTLED.
        default: 0
      - name: finding_note
        type: string
        source: input
        description: Free-text note recorded with the finding.
        default: null
      - name: findings_recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller of POST /audit-engagements/{id}/findings. Null while finding_status == NONE. Consumed by the segregation-of-duties check at validations priority 7.
        default: null

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - name: proceeding_ref
        type: string
        source: input
        description: Citation of the regulatory proceeding that produced this schedule.
        constraints: non-empty, max 120 chars
      - name: territory_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 territory this schedule governs, or the literal WORLD as a fallback layer.
        constraints: "2 uppercase letters or the literal 'WORLD'"
      - name: subscription_tier
        type: enum
        source: input
        description: Subscription tier this schedule governs.
        constraints: "one of FREE_AD_SUPPORTED, INDIVIDUAL, FAMILY, STUDENT"
      - name: revenue_share_bps
        type: integer
        source: input
        description: Share of gross_revenue_cents that forms the revenue-share pool.
        constraints: "0..10000"
      - name: per_subscriber_minimum_cents
        type: integer
        source: input
        description: Per-subscriber-per-period floor used to build minimum_pool_cents.
        constraints: ">= 0"
      - name: mechanical_share_bps
        type: integer
        source: input
        description: Share of the publishing slice that is mechanical.
        constraints: "0..10000; mechanical_share_bps + performance_share_bps must equal 10000"
      - name: performance_share_bps
        type: integer
        source: input
        description: Share of the publishing slice that is performance.
        constraints: "0..10000; mechanical_share_bps + performance_share_bps must equal 10000"
      - name: statutory_floor_per_play_millicents
        type: integer
        source: input
        description: Absolute per-play floor in thousandths of a cent, used to build statutory_floor_cents.
        constraints: ">= 0"
      - name: effective_from
        type: string
        source: input
        description: INCLUSIVE start of the schedule's applicability window, ISO 8601 date.
      - name: effective_to
        type: string
        source: input
        description: "INCLUSIVE end of the schedule's applicability window, ISO 8601 date; must be >= effective_from."
      - name: retroactive
        type: boolean
        source: input
        description: When true, promulgation reopens already-FINALIZED pools whose period usage_end falls inside the window.
        default: false
      - name: status
        type: enum
        source: computed
        description: PROPOSED on creation; EFFECTIVE after promulgate; SUPERSEDED when a later promulgation with supersede_incumbent == true displaces it.
        default: PROPOSED
        constraints: "one of PROPOSED, EFFECTIVE, SUPERSEDED"
      - name: promulgated_at
        type: datetime
        source: system
        description: Logical clock value at the moment promulgate succeeded; null while PROPOSED.
        default: null

state_machines:
  - entity: AccountingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: USAGE_SEALED
        trigger: "system bubble-up at the end of POST /royalties/usage-batches/{id}/match"
        actor: system
        preconditions:
          - "the period has >= 1 UsageBatch"
          - "every UsageBatch with period_id == this period has status IN {MATCHED, PARTIALLY_MATCHED}"
        side_effects:
          - "AccountingPeriod.status = USAGE_SEALED"
          - "AccountingPeriod.version += 1"
        note: Compound/bubble-up; the last batch to finish matching flips the period.
      - from: USAGE_SEALED
        to: DISTRIBUTED
        trigger: "system bubble-up at the end of POST /royalties/pools/{id}/finalize"
        actor: system
        preconditions:
          - "the period has >= 1 RoyaltyPool"
          - "every RoyaltyPool with period_id == this period has status == FINALIZED"
        side_effects:
          - "AccountingPeriod.status = DISTRIBUTED"
          - "every UsageBatch of this period with status IN {MATCHED, PARTIALLY_MATCHED} moves to RECONCILED"
          - "AccountingPeriod.version += 1"
      - from: DISTRIBUTED
        to: CLOSED
        trigger: "POST /royalties/periods/{id}/close"
        actor: RoyaltyAdmin
        preconditions:
          - "AccountingPeriod.status == DISTRIBUTED"
          - "current_utc > AccountingPeriod.claim_window_closes_at"
          - "no RightsRegistration whose work_id appears on any UsageLine of this period has status IN {SUBMITTED, UNDER_REVIEW, NEEDS_EVIDENCE, DISPUTED}"
          - "AccountingPeriod.total_holding_cents == 0"
        side_effects:
          - "AccountingPeriod.status = CLOSED"
          - "AccountingPeriod.version += 1"
      - from: CLOSED
        to: REOPENED
        trigger: "system, link 4 of the rate-promulgation cascade (POST /royalties/rate-schedules/{id}/promulgate)"
        actor: system
        preconditions:
          - "at least one RoyaltyPool of this period was moved to REOPENED_FOR_ADJUSTMENT by link 2 of the same cascade"
        side_effects:
          - "AccountingPeriod.status = REOPENED"
          - "AccountingPeriod.version += 1"
      - from: REOPENED
        to: DISTRIBUTED
        trigger: "system bubble-up at the end of POST /royalties/pools/{id}/finalize"
        actor: system
        preconditions:
          - "every RoyaltyPool with period_id == this period has status == FINALIZED"
        side_effects:
          - "AccountingPeriod.status = DISTRIBUTED"
          - "AccountingPeriod.version += 1"
        note: Closes the CLOSED -> REOPENED -> DISTRIBUTED -> CLOSED cycle.

  - entity: UsageBatch
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /royalties/usage-batches/{id}/seal"
        actor: RoyaltyAdmin
        preconditions:
          - "UsageBatch.status == OPEN"
          - "UsageBatch.line_count >= 1"
          - "the parent AccountingPeriod.status == OPEN"
        side_effects:
          - "UsageBatch.status = SEALED"
          - "no further UsageLine may be appended to this batch"
      - from: SEALED
        to: MATCHED
        trigger: "POST /royalties/usage-batches/{id}/match"
        actor: RoyaltyAdmin | RightsOpsAnalyst
        preconditions:
          - "UsageBatch.status == SEALED"
          - "after running calculations.usage_line_matching over every line of this batch, UsageBatch.unmatched_play_count == 0"
        side_effects:
          - "each line whose winning candidate scored >= AUTO_MATCH_MIN_CONFIDENCE_BPS gets work_id, match_confidence_bps and match_status = AUTO_MATCHED"
          - "for each such line whose match_confidence_bps < 10000, Work.provisional_match_by_user_id = X-User-ID of this call"
          - "UsageBatch.status = MATCHED"
          - "UsageBatch.matched_play_count / unmatched_play_count / disputed_play_count recomputed"
          - "the parent AccountingPeriod re-evaluates its OPEN -> USAGE_SEALED bubble-up"
        note: Branch A of the fork; no holding account is opened.
      - from: SEALED
        to: PARTIALLY_MATCHED
        trigger: "POST /royalties/usage-batches/{id}/match"
        actor: RoyaltyAdmin | RightsOpsAnalyst
        preconditions:
          - "UsageBatch.status == SEALED"
          - "after running calculations.usage_line_matching over every line of this batch, UsageBatch.unmatched_play_count >= 1"
        side_effects:
          - "each line whose winning candidate scored >= AUTO_MATCH_MIN_CONFIDENCE_BPS gets work_id, match_confidence_bps and match_status = AUTO_MATCHED"
          - "for each such line whose match_confidence_bps < 10000, Work.provisional_match_by_user_id = X-User-ID of this call"
          - "every remaining line keeps match_status = UNMATCHED and records its best match_confidence_bps (which may be 5000 or 0)"
          - "UsageBatch.status = PARTIALLY_MATCHED"
          - "UsageBatch.matched_play_count / unmatched_play_count / disputed_play_count recomputed"
          - "the parent AccountingPeriod re-evaluates its OPEN -> USAGE_SEALED bubble-up"
        note: >-
          Branch B of the fork. Divergent side-effect set versus branch A: the UNMATCHED lines
          are what later fund RoyaltyPool.holding_cents at calculate time.
      - from: PARTIALLY_MATCHED
        to: MATCHED
        trigger: "system, link 3 of the registration-approval cascade (POST /royalties/rights-registrations/{id}/approve)"
        actor: system
        preconditions:
          - "UsageBatch.unmatched_play_count == 0 after the cascade re-attached lines"
        side_effects:
          - "UsageBatch.status = MATCHED"
          - "the parent AccountingPeriod re-evaluates its OPEN -> USAGE_SEALED bubble-up"
      - from: MATCHED
        to: RECONCILED
        trigger: "system, on the parent period's USAGE_SEALED -> DISTRIBUTED bubble-up"
        actor: system
        preconditions:
          - "every RoyaltyPool of the parent AccountingPeriod has status == FINALIZED"
        side_effects:
          - "UsageBatch.status = RECONCILED"
      - from: PARTIALLY_MATCHED
        to: RECONCILED
        trigger: "system, on the parent period's USAGE_SEALED -> DISTRIBUTED bubble-up"
        actor: system
        preconditions:
          - "every RoyaltyPool of the parent AccountingPeriod has status == FINALIZED"
        side_effects:
          - "UsageBatch.status = RECONCILED"
        note: A batch may reconcile while still carrying UNMATCHED plays; their value stays in the pool holding account.

  - entity: RightsRegistration
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /royalties/rights-registrations/{id}/review"
        actor: RightsOpsAnalyst
        preconditions:
          - "RightsRegistration.status == SUBMITTED"
        side_effects:
          - "RightsRegistration.status = UNDER_REVIEW"
          - "the Work's rights_state is re-derived (stays PROVISIONAL)"
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "POST /royalties/rights-registrations/{id}/review"
        actor: RightsOpsAnalyst
        preconditions:
          - "RightsRegistration.status == DISPUTED"
        side_effects:
          - "RightsRegistration.status = UNDER_REVIEW"
          - "the Work's rights_state is re-derived (DISPUTED clears if no other registration of this Work is DISPUTED)"
        note: Second entry point into UNDER_REVIEW; closes the APPROVED -> DISPUTED -> UNDER_REVIEW -> APPROVED cycle.
      - from: UNDER_REVIEW
        to: NEEDS_EVIDENCE
        trigger: "POST /royalties/rights-registrations/{id}/request-evidence"
        actor: RightsOpsAnalyst
        preconditions:
          - "RightsRegistration.status == UNDER_REVIEW"
          - "RightsRegistration.evidence_round < MAX_EVIDENCE_ROUNDS"
        side_effects:
          - "RightsRegistration.status = NEEDS_EVIDENCE"
      - from: NEEDS_EVIDENCE
        to: UNDER_REVIEW
        trigger: "POST /royalties/rights-registrations/{id}/evidence"
        actor: RightsHolderUser
        preconditions:
          - "RightsRegistration.status == NEEDS_EVIDENCE"
          - "X-User-ID == RightsRegistration.claimant_id"
          - "RightsRegistration.evidence_round < MAX_EVIDENCE_ROUNDS"
        side_effects:
          - "RightsRegistration.evidence_round += 1"
          - "RightsRegistration.status = UNDER_REVIEW"
        note: >-
          The UNDER_REVIEW <-> NEEDS_EVIDENCE cycle terminates because evidence_round is
          bounded by MAX_EVIDENCE_ROUNDS; the third request-evidence attempt is rejected with
          ERR_EVIDENCE_ROUNDS_EXHAUSTED.
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /royalties/rights-registrations/{id}/approve"
        actor: RightsOpsAnalyst
        preconditions:
          - "RightsRegistration.status == UNDER_REVIEW"
          - "X-User-ID != Work.provisional_match_by_user_id (segregation of duties)"
          - "right_type matches Work.work_type per validations priority 14"
          - "routing/collective eligibility per validations priority 13"
          - "the per-territory aggregate share check of validations priority 15 passes"
        side_effects:
          - "CASCADE LINK 1: RightsRegistration.status = APPROVED; reviewed_by_user_id = X-User-ID; when supersede_overlapping == true every APPROVED registration of the same (work_id, right_type, claimant_id) whose territory_set intersects and whose half-open interval overlaps moves to SUPERSEDED"
          - "CASCADE LINK 2: because link 1 changed this Work's approved registration set, Work.rights_state is re-derived (UNMATCHED or PROVISIONAL -> REGISTERED) and Work.approved_master_share_bps recomputed; then every UsageLine with work_id == null whose batch's period has current_utc <= claim_window_closes_at and whose best candidate for this Work scores >= CLAIM_MATCH_MIN_CONFIDENCE_BPS gets work_id = this Work, match_confidence_bps = that score, match_status = CLAIM_MATCHED"
          - "CASCADE LINK 3: because link 2 re-attached usage lines, each affected UsageBatch recomputes matched_play_count / unmatched_play_count and, when unmatched_play_count reaches 0, moves PARTIALLY_MATCHED -> MATCHED; and each affected RoyaltyPool whose status == CALCULATED re-runs calculations.pool_attribution so holding_cents falls and matched_attributed_cents rises by the same amount, while pools whose status == FINALIZED keep their frozen amounts and move the affected value from holding_cents to matched_attributed_cents without re-attributing"
          - "Work.version += 1; each touched UsageLine.version += 1; each touched UsageBatch.version += 1; each touched RoyaltyPool.version += 1"
        note: Depth-3 transitive cascade; each link is caused by the previous link, not by the approve call itself.
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /royalties/rights-registrations/{id}/reject"
        actor: RightsOpsAnalyst
        preconditions:
          - "RightsRegistration.status == UNDER_REVIEW"
          - "X-User-ID != Work.provisional_match_by_user_id (segregation of duties)"
        side_effects:
          - "RightsRegistration.status = REJECTED; reviewed_by_user_id = X-User-ID; rejection_reason stored"
          - "the Work's rights_state is re-derived"
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /royalties/rights-registrations/{id}/dispute"
        actor: RightsHolderUser
        preconditions:
          - "RightsRegistration.status == APPROVED"
          - "disputing_holder_id != RightsRegistration.claimant_id"
          - "X-User-ID == disputing_holder_id"
        side_effects:
          - "RightsRegistration.status = DISPUTED; disputing_holder_id and dispute reason stored"
          - "COMPENSATION LINK: because the registration is no longer APPROVED, every UsageLine whose match_status == CLAIM_MATCHED and whose work_id == this registration's work_id moves to match_status = DISPUTED"
          - "COMPENSATION LINK: because those usage lines left the matched set, each affected UsageBatch recomputes matched_play_count / disputed_play_count (total_play_count unchanged) and each affected RoyaltyPool moves the same cents from matched_attributed_cents back to holding_cents (distributable_cents and rounding_residual_cents unchanged)"
          - "COMPENSATION LINK: every RoyaltyStatement with status == ISSUED holding a StatementLine with line_type == HOLDING_RELEASE and work_id == this registration's work_id moves to SUPERSEDED, so the payee's receivable_balance_cents drops back"
          - "the Work's rights_state is re-derived to DISPUTED"
        note: Exact compensating action for the APPROVED cascade; preserves invariants royalty_pool_value_conservation and usage_play_count_conservation.
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system, link 1 of another registration's approve when supersede_overlapping == true"
        actor: system
        preconditions:
          - "RightsRegistration.status == APPROVED"
          - "the approving registration shares (work_id, right_type, claimant_id), its territory_set intersects this one's, and its half-open interval overlaps this one's"
        side_effects:
          - "RightsRegistration.status = SUPERSEDED"

  - entity: RoyaltyPool
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /royalties/pools/{id}/calculate"
        actor: RoyaltyAdmin
        preconditions:
          - "RoyaltyPool.status == DRAFT"
          - "the parent AccountingPeriod.status IN {USAGE_SEALED, REOPENED}"
          - "calculations.rate_schedule_selection yields a non-empty candidate set"
        side_effects:
          - "applied_rate_schedule_id set from calculations.rate_schedule_selection"
          - "total_play_count, revenue_share_pool_cents, minimum_pool_cents, statutory_floor_cents, distributable_cents and allocation_basis recomputed per calculations.pool_distributable_amount"
          - "denominator_basis and denominator_play_count set per calculations.pool_attribution; every in-scope UsageLine.attributed_revenue_cents rewritten"
          - "matched_attributed_cents, holding_cents and rounding_residual_cents recomputed"
          - "RoyaltyPool.status = CALCULATED"
      - from: CALCULATED
        to: CALCULATED
        trigger: "POST /royalties/pools/{id}/calculate"
        actor: RoyaltyAdmin
        preconditions:
          - "RoyaltyPool.status == CALCULATED"
          - "the parent AccountingPeriod.status IN {USAGE_SEALED, REOPENED}"
        side_effects:
          - "same recomputation as DRAFT -> CALCULATED; a re-run after current_utc has passed the period's claim_window_closes_at switches denominator_basis from ALL_USAGE to MATCHED_ONLY and therefore rewrites every attributed_revenue_cents"
        note: Self-loop; the second run on identical stored data can legitimately produce different numbers because the variant selector is clock-dependent.
      - from: CALCULATED
        to: FINALIZED
        trigger: "POST /royalties/pools/{id}/finalize"
        actor: RoyaltyAdmin
        preconditions:
          - "RoyaltyPool.status == CALCULATED"
          - "the parent AccountingPeriod.status IN {USAGE_SEALED, REOPENED}"
          - "every UsageBatch of the parent period has status IN {MATCHED, PARTIALLY_MATCHED, RECONCILED}"
        side_effects:
          - "distributable_cents, denominator_basis, denominator_play_count, rounding_residual_cents and every in-scope UsageLine.attributed_revenue_cents are frozen"
          - "residual_payee_holder_id set per calculations.residual_payee_selection"
          - "RoyaltyPool.status = FINALIZED"
          - "the parent AccountingPeriod re-evaluates its USAGE_SEALED -> DISTRIBUTED (or REOPENED -> DISTRIBUTED) bubble-up"
      - from: FINALIZED
        to: REOPENED_FOR_ADJUSTMENT
        trigger: "system, link 2 of the rate-promulgation cascade (POST /royalties/rate-schedules/{id}/promulgate)"
        actor: system
        preconditions:
          - "RoyaltyPool.status == FINALIZED"
          - "the newly EFFECTIVE RateSchedule has retroactive == true"
          - "the schedule's subscription_tier equals this pool's subscription_tier"
          - "the schedule's territory_code equals this pool's territory_code or is the literal WORLD"
          - "the parent AccountingPeriod.usage_end falls inside the schedule's INCLUSIVE [effective_from, effective_to] window"
        side_effects:
          - "RoyaltyPool.status = REOPENED_FOR_ADJUSTMENT"
          - "RoyaltyPool.version += 1"
      - from: REOPENED_FOR_ADJUSTMENT
        to: CALCULATED
        trigger: "POST /royalties/pools/{id}/calculate"
        actor: RoyaltyAdmin
        preconditions:
          - "RoyaltyPool.status == REOPENED_FOR_ADJUSTMENT"
          - "the parent AccountingPeriod.status == REOPENED"
        side_effects:
          - "same recomputation as DRAFT -> CALCULATED, now selecting the newly EFFECTIVE RateSchedule"
          - "RoyaltyPool.status = CALCULATED"
        note: Closes the CALCULATED -> FINALIZED -> REOPENED_FOR_ADJUSTMENT -> CALCULATED cycle.

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /royalties/statements/{id}/issue"
        actor: RoyaltyAdmin
        preconditions:
          - "RoyaltyStatement.status == DRAFT"
          - "RoyaltyStatement.line_count >= 1"
          - "every RoyaltyPool referenced by a StatementLine of this statement has status == FINALIZED"
        side_effects:
          - "RoyaltyStatement.status = ISSUED; issued_at = current_utc"
          - "the payee RightsHolder.receivable_balance_cents increases by exactly RoyaltyStatement.net_payable_cents"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system, link 3 of the rate-promulgation cascade, or the compensation link of RightsRegistration APPROVED -> DISPUTED"
        actor: system
        preconditions:
          - "RoyaltyStatement.status == ISSUED"
          - "at least one StatementLine of this statement points at a pool moved to REOPENED_FOR_ADJUSTMENT by link 2, or at a HOLDING_RELEASE line for the disputed work"
        side_effects:
          - "RoyaltyStatement.status = SUPERSEDED"
          - "the payee RightsHolder.receivable_balance_cents decreases by exactly RoyaltyStatement.net_payable_cents"
          - "RoyaltyStatement.version += 1"

  - entity: AuditEngagement
    initial_state: "production_status=PENDING x finding_status=NONE"
    terminal_states: ["finding_status=SETTLED", "finding_status=WITHDRAWN"]
    transitions:
      - from: "production_status=PENDING"
        to: "production_status=PARTIAL"
        trigger: "POST /royalties/audit-engagements/{id}/data-productions"
        actor: RoyaltyAdmin
        preconditions:
          - "finding_status IN {NONE, ASSERTED}"
          - "every id in statement_line_ids is a StatementLine whose statement_id == this engagement's statement_id"
          - "produced_line_count after this call is strictly less than required_line_count"
        side_effects:
          - "produced_line_count = count of distinct accepted ids"
          - "production_status = PARTIAL"
        note: Production dimension only; finding_status is untouched.
      - from: "production_status IN {PENDING, PARTIAL}"
        to: "production_status=COMPLETE"
        trigger: "POST /royalties/audit-engagements/{id}/data-productions"
        actor: RoyaltyAdmin
        preconditions:
          - "produced_line_count after this call equals required_line_count"
        side_effects:
          - "production_status = COMPLETE"
      - from: "finding_status=NONE"
        to: "finding_status=ASSERTED"
        trigger: "POST /royalties/audit-engagements/{id}/findings"
        actor: RightsHolderUser
        preconditions:
          - "finding_status == NONE"
          - "production_status == COMPLETE (validations priority 29; a PARTIAL production is not enough)"
          - "X-User-ID == AuditEngagement.rights_holder_id"
          - "asserted_underpayment_cents >= 1"
        side_effects:
          - "asserted_underpayment_cents and finding_note stored"
          - "finding_status = ASSERTED"
        note: Finding dimension only; production_status is untouched, which is what makes the two dimensions independent.
      - from: "finding_status=ASSERTED"
        to: "finding_status=SETTLED"
        trigger: "POST /royalties/audit-engagements/{id}/settle with resolution == UPHOLD"
        actor: RoyaltyAdmin
        preconditions:
          - "finding_status == ASSERTED"
          - "production_status == COMPLETE"
          - "settled_amount_cents >= 1 and settled_amount_cents <= asserted_underpayment_cents"
        side_effects:
          - "settled_amount_cents stored; interest_cents computed per calculations.audit_settlement_interest"
          - "finding_status = SETTLED"
          - "the audited RightsHolder.receivable_balance_cents increases by exactly settled_amount_cents + interest_cents"
        note: Branch A of the settle fork.
      - from: "finding_status=ASSERTED"
        to: "finding_status=WITHDRAWN"
        trigger: "POST /royalties/audit-engagements/{id}/settle with resolution == WITHDRAW"
        actor: RoyaltyAdmin
        preconditions:
          - "finding_status == ASSERTED"
          - "production_status == COMPLETE"
        side_effects:
          - "settled_amount_cents = 0; interest_cents = 0"
          - "finding_status = WITHDRAWN"
          - "the audited RightsHolder.receivable_balance_cents is left unchanged"
        note: >-
          Branch B of the settle fork with a disjoint side-effect set; this is the compensating
          action for the ASSERTED transition in invariant holder_receivable_conservation.

  - entity: RateSchedule
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: EFFECTIVE
        trigger: "POST /royalties/rate-schedules/{id}/promulgate"
        actor: RegulatoryOfficer
        preconditions:
          - "RateSchedule.status == PROPOSED"
          - "revenue_share_bps >= STATUTORY_MIN_REVENUE_SHARE_BPS"
          - "mechanical_share_bps + performance_share_bps == 10000"
          - "no EFFECTIVE RateSchedule with the same (territory_code, subscription_tier) has an INCLUSIVE [effective_from, effective_to] window intersecting this one, unless supersede_incumbent == true"
        side_effects:
          - "CASCADE LINK 1: RateSchedule.status = EFFECTIVE; promulgated_at = current_utc; when supersede_incumbent == true every intersecting EFFECTIVE schedule with the same (territory_code, subscription_tier) moves to SUPERSEDED"
          - "CASCADE LINK 2: because a retroactive schedule became EFFECTIVE, every RoyaltyPool with status == FINALIZED matching the schedule's tier and territory (exact or WORLD) whose period usage_end lies inside the INCLUSIVE window moves FINALIZED -> REOPENED_FOR_ADJUSTMENT"
          - "CASCADE LINK 3: because those pools reopened, every RoyaltyStatement with status == ISSUED that owns at least one StatementLine pointing at a reopened pool moves ISSUED -> SUPERSEDED, and each such statement's payee RightsHolder.receivable_balance_cents drops by that statement's net_payable_cents"
          - "CASCADE LINK 4: because those statements were superseded and their pools reopened, every AccountingPeriod with status == CLOSED that owns a reopened pool moves CLOSED -> REOPENED"
          - "RateSchedule.version += 1; each touched RoyaltyPool / RoyaltyStatement / RightsHolder / AccountingPeriod version += 1"
        note: >-
          Depth-4 transitive cascade whose trigger differs from the registration-approval
          cascade. Link 2 is caused by link 1, link 3 by link 2, link 4 by link 3.
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system, link 1 of another schedule's promulgate with supersede_incumbent == true"
        actor: system
        preconditions:
          - "RateSchedule.status == EFFECTIVE"
          - "the promulgating schedule shares (territory_code, subscription_tier) and its INCLUSIVE window intersects this one's"
        side_effects:
          - "RateSchedule.status = SUPERSEDED"

concurrency_rules:
  - rule_id: registration-create-stale-work
    parent_entity: Work
    write_endpoint: "POST /royalties/rights-registrations"
    occ_field: "expected_work_version"
    description: |
      Creating a RightsRegistration against a Work whose version has advanced since the client
      last read it is rejected. The claimed share is sized against the Work's currently
      approved registration set, and that set legitimately changes when another registration
      is approved with supersede_overlapping == true or when a fuzzy match records
      provisional_match_by_user_id; a registration built on the earlier view would be admitted
      even though the share space it targeted has already been redistributed.
    error_id: ERR_STALE_WORK_VERSION
    http_status: 412
  - rule_id: statement-create-stale-period
    parent_entity: AccountingPeriod
    write_endpoint: "POST /royalties/statements"
    occ_field: "expected_period_version"
    description: |
      Creating a RoyaltyStatement against an AccountingPeriod whose version has advanced since
      the client last read it is rejected. A new statement for the same (rights_holder_id,
      period_id) legitimately supersedes any prior DRAFT statement, so the request would
      otherwise be admitted and would silently snapshot a pool set that has since been
      reopened, refinalized or re-attributed by a cascade.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

calculations:
  - name: usage_line_matching
    trigger: "POST /royalties/usage-batches/{id}/match (all lines of the batch) and cascade link 2 of POST /royalties/rights-registrations/{id}/approve (unmatched lines only)"
    algorithm: weighted_scoring
    formula: |
      normalize(s) = collapse_spaces(strip_chars_outside("a-z0-9 ", lowercase(s))).trim()

      # (a) eligibility filter — the candidate set, as an explicit predicate
      candidates = [ W in Work
                     where W.work_type == 'RECORDING'
                       and ( (line.reported_isrc != null and W.identifier == line.reported_isrc)
                          or (W.normalized_title == normalize(line.reported_title)) ) ]

      # (b) score every candidate
      score(W) =
        ISRC_EXACT_CONFIDENCE_BPS            if line.reported_isrc != null and W.identifier == line.reported_isrc
        else TITLE_ARTIST_CONFIDENCE_BPS     if line.reported_artist != null
                                                and W.normalized_artist != null
                                                and W.normalized_title  == normalize(line.reported_title)
                                                and W.normalized_artist == normalize(line.reported_artist)
        else TITLE_ONLY_CONFIDENCE_BPS       if W.normalized_title == normalize(line.reported_title)
        else 0

      # (c) ranking + tie-break
      winner = argmax over candidates of (score(W) DESC, W.created_at ASC, W.identifier ASC)

      # (d) empty-set fallback
      if candidates is empty:
          line.match_confidence_bps = 0; line.work_id = null; line.match_status = 'UNMATCHED'
      else:
          line.match_confidence_bps = score(winner)
          if line.match_confidence_bps >= AUTO_MATCH_MIN_CONFIDENCE_BPS:
              line.work_id = winner.id; line.match_status = 'AUTO_MATCHED'
              if line.match_confidence_bps < ISRC_EXACT_CONFIDENCE_BPS:
                  winner.provisional_match_by_user_id = X-User-ID of the calling analyst
          else:
              line.work_id = null; line.match_status = 'UNMATCHED'   # value falls into the holding account

      # cascade-link-2 variant: the candidate set is restricted to the single just-approved
      # Work and the acceptance threshold is CLAIM_MATCH_MIN_CONFIDENCE_BPS, not
      # AUTO_MATCH_MIN_CONFIDENCE_BPS; the resulting match_status is 'CLAIM_MATCHED'.
    input_set: >-
      Every UsageLine of the batch when triggered by /match. On the approval cascade, only
      UsageLine rows with work_id == null AND whose parent batch's period satisfies
      current_utc <= period.claim_window_closes_at.
    constants:
      ISRC_EXACT_CONFIDENCE_BPS: 10000
      TITLE_ARTIST_CONFIDENCE_BPS: 7500
      TITLE_ONLY_CONFIDENCE_BPS: 5000
      AUTO_MATCH_MIN_CONFIDENCE_BPS: 7500
      CLAIM_MATCH_MIN_CONFIDENCE_BPS: 5000
    precision: "integer basis points; no rounding"
    variants:
      - name: AUTO_MATCH
        when: "invoked from POST /royalties/usage-batches/{id}/match"
        difference: "accepts only score >= AUTO_MATCH_MIN_CONFIDENCE_BPS (7500) and writes match_status = AUTO_MATCHED; a 5000 title-only hit is refused and the line stays UNMATCHED"
      - name: CLAIM_MATCH
        when: "invoked from cascade link 2 of POST /royalties/rights-registrations/{id}/approve"
        difference: "accepts score >= CLAIM_MATCH_MIN_CONFIDENCE_BPS (5000) against the just-approved Work only and writes match_status = CLAIM_MATCHED; the same 5000 title-only hit is now accepted"

  - name: rate_schedule_selection
    trigger: "POST /royalties/pools/{id}/calculate, before pool_distributable_amount runs"
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter
      candidates = [ S in RateSchedule
                     where S.status == 'EFFECTIVE'
                       and S.subscription_tier == pool.subscription_tier
                       and (S.territory_code == pool.territory_code or S.territory_code == 'WORLD')
                       and S.effective_from <= period.usage_end <= S.effective_to ]   # INCLUSIVE both ends

      # (b) ranking: specific territory outranks the WORLD fallback layer, then latest window start
      specificity(S) = 1 if S.territory_code == 'WORLD' else 0
      winner = argmax over candidates of (specificity ASC, S.effective_from DESC, S.created_at ASC)

      # (c) tie-break: S.created_at ASC (declared above), then S.proceeding_ref ASC
      # (d) empty-set fallback
      if candidates is empty: reject with ERR_NO_EFFECTIVE_RATE_SCHEDULE (422)
      pool.applied_rate_schedule_id = winner.id
    input_set: "RateSchedule rows with status == EFFECTIVE only; PROPOSED and SUPERSEDED rows are excluded."
    constants: {}
    precision: n/a

  - name: pool_distributable_amount
    trigger: "POST /royalties/pools/{id}/calculate (side effect of DRAFT->CALCULATED, CALCULATED->CALCULATED and REOPENED_FOR_ADJUSTMENT->CALCULATED)"
    algorithm: threshold
    formula: |
      R = the RateSchedule chosen by rate_schedule_selection

      total_play_count      = sum(UsageLine.play_count) over in-scope lines
                              (in-scope := line.batch.period_id == pool.period_id
                                        and line.territory_code == pool.territory_code
                                        and line.subscription_tier == pool.subscription_tier),
                              regardless of match_status
      revenue_share_pool_cents = round_half_up(gross_revenue_cents * R.revenue_share_bps / 10000)
      minimum_pool_cents       = subscriber_count * R.per_subscriber_minimum_cents
      statutory_floor_cents    = ceil(total_play_count * R.statutory_floor_per_play_millicents / 1000)

      # three inputs interacting non-linearly through nested min/max
      distributable_cents = max( min(revenue_share_pool_cents,
                                     MAX_POOL_CAP_MULTIPLE * minimum_pool_cents),
                                 minimum_pool_cents,
                                 statutory_floor_cents )

      # basis is decided by >= comparisons, evaluated in this pinned order
      allocation_basis =
        'REVENUE_SHARE'           if revenue_share_pool_cents >= minimum_pool_cents
                                 and revenue_share_pool_cents >= statutory_floor_cents
                                 and revenue_share_pool_cents <= MAX_POOL_CAP_MULTIPLE * minimum_pool_cents
        else 'PER_SUBSCRIBER_MINIMUM' if minimum_pool_cents >= statutory_floor_cents
        else 'STATUTORY_FLOOR'
    input_set: >-
      All in-scope UsageLine rows regardless of match_status feed total_play_count, so the
      statutory floor is computed on gross usage and does not shrink when lines are unmatched.
    constants:
      MAX_POOL_CAP_MULTIPLE: 3
    precision: "whole cents; round_half_up for the revenue share, ceil for the statutory floor"

  - name: pool_attribution
    trigger: "POST /royalties/pools/{id}/calculate, immediately after pool_distributable_amount"
    algorithm: waterfall_allocation
    formula: |
      matched_plays = sum(play_count) over in-scope lines with match_status IN {AUTO_MATCHED, CLAIM_MATCHED}

      # variant selector — clock-dependent, evaluated once per calculate run
      if current_utc <= period.claim_window_closes_at:
          denominator_basis     = 'ALL_USAGE'
          denominator_play_count = pool.total_play_count
      else:
          denominator_basis     = 'MATCHED_ONLY'
          denominator_play_count = matched_plays

      if denominator_play_count == 0: every attributed_revenue_cents = 0
      else for each in-scope UsageLine L:
          if denominator_basis == 'MATCHED_ONLY' and L.match_status IN {UNMATCHED, DISPUTED}:
              L.attributed_revenue_cents = 0
          else:
              # FLOOR, not round_half_up: drift is always non-negative and lands in the residual
              L.attributed_revenue_cents = floor(distributable_cents * L.play_count / denominator_play_count)

      matched_attributed_cents = sum(L.attributed_revenue_cents) over in-scope lines with match_status IN {AUTO_MATCHED, CLAIM_MATCHED}
      holding_cents            = sum(L.attributed_revenue_cents) over in-scope lines with match_status IN {UNMATCHED, DISPUTED}
      rounding_residual_cents  = distributable_cents - sum(L.attributed_revenue_cents) over ALL in-scope lines
    input_set: >-
      All in-scope UsageLine rows. Under ALL_USAGE the UNMATCHED and DISPUTED lines receive a
      positive attribution that funds the holding account; under MATCHED_ONLY they receive
      exactly 0 and their value is redistributed across the matched lines by the smaller
      denominator.
    constants: {}
    precision: "whole cents; floor per line; the leftover lands in rounding_residual_cents"
    variants:
      - name: ALL_USAGE_DENOMINATOR
        when: "current_utc <= period.claim_window_closes_at (provisional run, claim window still open)"
        difference: "denominator = pool.total_play_count, so unmatched plays dilute every per-play rate and their slice sits in holding_cents awaiting a claim"
      - name: MATCHED_ONLY_DENOMINATOR
        when: "current_utc > period.claim_window_closes_at (final run, claim window has closed)"
        difference: >-
          denominator = matched plays only, so identical stored usage yields a strictly larger
          attributed_revenue_cents on every matched line and holding_cents becomes 0; unclaimed
          money is redistributed rather than held

  - name: statement_line_build
    trigger: "POST /royalties/statements"
    algorithm: aggregation
    formula: |
      For each RoyaltyPool P with P.period_id == statement.period_id and P.status == 'FINALIZED':
        R = P.applied_rate_schedule
        For each in-scope UsageLine L of P with L.match_status IN {AUTO_MATCHED, CLAIM_MATCHED}:
            master_slice(L)      = round_half_up(L.attributed_revenue_cents * MASTER_SHARE_OF_ATTRIBUTED_BPS / 10000)
            publishing_slice(L)  = L.attributed_revenue_cents - master_slice(L)
            mechanical_slice(L)  = round_half_up(publishing_slice(L) * R.mechanical_share_bps / 10000)
            performance_slice(L) = publishing_slice(L) - mechanical_slice(L)

            for each RightsRegistration G with status == 'APPROVED'
                  and G.territory_set intersects {L.territory_code}   (WORLD is a wildcard)
                  and G.effective_from <= period.usage_end < G.effective_to   (HALF-OPEN)
                  and G.payee_holder_id == statement.rights_holder_id
                  and ( (G.right_type == 'MASTER'      and G.work_id == L.work_id)
                     or (G.right_type IN {'MECHANICAL','PERFORMANCE'} and G.work_id == L.work.linked_work_id) ):
                base(L,G) = master_slice(L)      if G.right_type == 'MASTER'
                            mechanical_slice(L)  if G.right_type == 'MECHANICAL'
                            performance_slice(L) if G.right_type == 'PERFORMANCE'
                contribution(L,G) = round_half_up(base(L,G) * G.share_bps / 10000)
                group_key = (P.id, G.work_id, G.right_type, L.territory_code, L.subscription_tier,
                             G.routing,
                             'HOLDING_RELEASE' if L.match_status == 'CLAIM_MATCHED' else 'USAGE')
                accumulate contribution(L,G) and L.play_count into group_key

      # ROUNDING ORDER — PINNED, NON-NEGOTIABLE:
      # round per contributing UsageLine FIRST, then SUM the rounded contributions into
      # StatementLine.gross_cents. Summing attributed_revenue_cents across the group and
      # rounding once at the end is INCORRECT and differs by up to one cent per usage line.
      line.gross_cents = sum over the group of contribution(L,G)
      line.play_count  = sum over the group of L.play_count
      line.share_bps   = G.share_bps
      line.admin_fee_cents = admin_fee_resolution(line)
      line.net_cents       = line.gross_cents - line.admin_fee_cents

      # RESIDUAL line: emitted on this statement only when P.residual_payee_holder_id ==
      # statement.rights_holder_id and P.rounding_residual_cents != 0
      residual_line = { line_type: 'RESIDUAL', work_id: null, right_type: null, routing: null,
                        play_count: 0, share_bps: 10000,
                        gross_cents: P.rounding_residual_cents,
                        admin_fee_cents: 0,
                        net_cents: P.rounding_residual_cents }
    input_set: >-
      Only FINALIZED pools of the statement's period contribute. Only AUTO_MATCHED and
      CLAIM_MATCHED usage lines contribute; UNMATCHED and DISPUTED lines contribute nothing
      and their value remains in RoyaltyPool.holding_cents.
    constants:
      MASTER_SHARE_OF_ATTRIBUTED_BPS: 7500
    precision: >-
      whole cents, round_half_up at each of the three slice steps and at the per-usage-line
      contribution step; NEVER round once over an aggregated base

  - name: admin_fee_resolution
    trigger: "statement_line_build, once per StatementLine with line_type IN {USAGE, HOLDING_RELEASE, ADJUSTMENT}"
    algorithm: tiered_pricing
    formula: |
      # This looks circular — the fee tier is a function of the payable amount, and the payable
      # amount is gross minus the fee. EVALUATION ORDER IS PINNED as three ordered steps and the
      # tier is keyed on gross_cents, NOT on net_cents. A fixed-point solve over net_cents is
      # INCORRECT.
      # STEP 1 — pick the tier from gross_cents
      if line.routing == 'COLLECTIVE':
          admin_rate_bps = ADMIN_TIER_1_BPS if line.gross_cents <  ADMIN_TIER_1_CEILING_CENTS
                      else ADMIN_TIER_2_BPS if line.gross_cents <  ADMIN_TIER_2_CEILING_CENTS
                      else ADMIN_TIER_3_BPS
      else:   # DIRECT
          admin_rate_bps = payee_holder.direct_deal_rate_bps
      # STEP 2 — charge the fee
      line.admin_fee_cents = round_half_up(line.gross_cents * admin_rate_bps / 10000)
      # STEP 3 — derive net
      line.net_cents = line.gross_cents - line.admin_fee_cents

      # RESIDUAL lines bypass all three steps: admin_fee_cents = 0, net_cents = gross_cents.
    input_set: >-
      The single StatementLine being built plus its payee RightsHolder. Tier ceilings are
      compared with strict `<`, so gross_cents exactly equal to a ceiling falls into the HIGHER
      tier (the cheaper rate).
    constants:
      ADMIN_TIER_1_CEILING_CENTS: 100000
      ADMIN_TIER_2_CEILING_CENTS: 1000000
      ADMIN_TIER_1_BPS: 1200
      ADMIN_TIER_2_BPS: 900
      ADMIN_TIER_3_BPS: 600
    precision: "whole cents, round_half_up on the fee; net is a subtraction and is never rounded again"
    variants:
      - name: COLLECTIVE_ADMINISTERED
        when: "the producing RightsRegistration.routing == COLLECTIVE"
        difference: >-
          rate comes from the volume-tiered ADMIN_TIER_*_BPS ladder keyed on this line's
          gross_cents, and the payee is the registration's collective_id rather than its
          claimant_id, so both the amount AND the recipient of the money differ
      - name: DIRECT_DEAL
        when: "the producing RightsRegistration.routing == DIRECT"
        difference: >-
          rate is the flat payee_holder.direct_deal_rate_bps regardless of volume, and the
          payee is the claimant itself; on an identical gross_cents the net differs from
          COLLECTIVE_ADMINISTERED whenever direct_deal_rate_bps != the tier rate

  - name: residual_payee_selection
    trigger: "POST /royalties/pools/{id}/finalize"
    algorithm: aggregation
    formula: |
      # (a) eligibility filter: every payee that would receive at least one non-RESIDUAL line
      #     from this pool under statement_line_build
      payee_totals = { H.id -> sum of contribution(L,G) over every group whose payee_holder_id == H.id }
      # (b) ranking
      winner = argmax over payee_totals of (total_gross_cents DESC,
                                            RightsHolder.created_at ASC,
                                            RightsHolder.legal_name ASC)
      # (c) tie-break: created_at ASC then legal_name ASC, as declared above
      # (d) empty-set fallback
      if payee_totals is empty: pool.residual_payee_holder_id = null and the residual is not
          paid out; pool.rounding_residual_cents keeps its value and the pool may still finalize
      else pool.residual_payee_holder_id = winner
    input_set: "Payees derived from APPROVED RightsRegistration rows only; SUBMITTED/UNDER_REVIEW/DISPUTED registrations produce no payee."
    constants: {}
    precision: n/a

  - name: retroactive_adjustment_delta
    trigger: "POST /royalties/statements for a (rights_holder_id, period_id) that already has at least one SUPERSEDED RoyaltyStatement, i.e. after the retroactive promulgation cascade has voided the original statement and the pool has been re-finalized under the new RateSchedule. This SUPERSEDED-predecessor test, not AccountingPeriod.status, is the discriminator, because re-finalizing every pool bubbles the period from REOPENED back to DISTRIBUTED before the corrected statement is built."
    algorithm: chronological
    formula: |
      For each SUPERSEDED RoyaltyStatement S_old of (statement.rights_holder_id, statement.period_id),
      processed in S_old.created_at ASC order:
        For each StatementLine L_old of S_old with line_type IN {USAGE, HOLDING_RELEASE, RESIDUAL},
        processed in L_old.created_at ASC order:
          L_new = the line statement_line_build would now produce for the same group_key
                  (or a zero line when the group no longer exists)
          delta_gross = L_new.gross_cents - L_old.gross_cents
          delta_fee   = L_new.admin_fee_cents - L_old.admin_fee_cents
          if delta_gross != 0 or delta_fee != 0:
              emit StatementLine { line_type: 'ADJUSTMENT',
                                   adjustment_of_line_id: L_old.id,
                                   pool_id: L_old.pool_id, work_id: L_old.work_id,
                                   right_type: L_old.right_type, routing: L_old.routing,
                                   territory_code: L_old.territory_code,
                                   subscription_tier: L_old.subscription_tier,
                                   share_bps: L_old.share_bps, play_count: 0,
                                   gross_cents: delta_gross,
                                   admin_fee_cents: delta_fee,
                                   net_cents: delta_gross - delta_fee }
      # The new statement carries ONLY ADJUSTMENT lines; it does not restate the original lines.
    input_set: "SUPERSEDED statements of the same (rights_holder_id, period_id) only; DRAFT and ISSUED statements are excluded."
    constants: {}
    precision: "whole cents; deltas may be negative"

  - name: audit_settlement_interest
    trigger: "POST /royalties/audit-engagements/{id}/settle with resolution == UPHOLD"
    algorithm: decay_function
    formula: |
      days_elapsed = floor((current_utc - statement.issued_at) / 86400 seconds)
      # SINGLE rounding at the very end. Rounding the annual interest first and then prorating
      # by days is INCORRECT and can differ by one cent.
      interest_cents = round_half_up( settled_amount_cents * AUDIT_INTEREST_ANNUAL_BPS * days_elapsed
                                      / (10000 * DAYS_PER_YEAR) )
    input_set: "The single engagement plus its audited statement's issued_at; WITHDRAWN engagements never reach this calculation and keep interest_cents == 0."
    constants:
      AUDIT_INTEREST_ANNUAL_BPS: 900
      DAYS_PER_YEAR: 365
    precision: "whole cents, round_half_up, applied exactly once to the fully assembled quotient"

  - name: holder_receivable_balance
    trigger: "recomputed whenever a RoyaltyStatement enters or leaves status ISSUED, or an AuditEngagement enters finding_status SETTLED"
    algorithm: aggregation
    formula: |
      receivable_balance_cents =
          sum( SL.net_cents  for SL in StatementLine
               where SL.payee_holder_id == holder.id
                 and SL.statement.status == 'ISSUED' )
        + sum( E.settled_amount_cents + E.interest_cents  for E in AuditEngagement
               where E.rights_holder_id == holder.id
                 and E.finding_status == 'SETTLED' )
      issued_statement_count = count( S in RoyaltyStatement where S.rights_holder_id == holder.id and S.status == 'ISSUED' )
    input_set: >-
      StatementLine rows whose parent statement.status == ISSUED exactly (DRAFT and SUPERSEDED
      contribute 0, with no time window), plus AuditEngagement rows with finding_status ==
      SETTLED exactly (ASSERTED and WITHDRAWN contribute 0). No tie-break is needed because the
      result is an order-independent sum.
    constants: {}
    precision: "whole cents; the sum of already-rounded integers, never re-rounded"

invariants:
  - name: royalty_pool_value_conservation
    conserved_quantity: "RoyaltyPool distributable cents"
    formula: "RoyaltyPool.matched_attributed_cents + RoyaltyPool.holding_cents + RoyaltyPool.rounding_residual_cents == RoyaltyPool.distributable_cents"
    forward_action: "POST /royalties/rights-registrations/{id}/approve — cascade link 3 moves cents out of holding_cents into matched_attributed_cents"
    compensating_action: "POST /royalties/rights-registrations/{id}/dispute — moves the same cents back from matched_attributed_cents into holding_cents"
    note: distributable_cents and rounding_residual_cents are frozen at finalize and MUST NOT drift across either action.
  - name: usage_play_count_conservation
    conserved_quantity: "UsageBatch reported play counts"
    formula: "UsageBatch.matched_play_count + UsageBatch.unmatched_play_count + UsageBatch.disputed_play_count == UsageBatch.total_play_count"
    forward_action: "POST /royalties/rights-registrations/{id}/approve — plays move from unmatched_play_count to matched_play_count"
    compensating_action: "POST /royalties/rights-registrations/{id}/dispute — the same plays move from matched_play_count to disputed_play_count"
    note: total_play_count is a pure function of the immutable reported lines and MUST NOT change.
  - name: holder_receivable_conservation
    conserved_quantity: "RightsHolder receivable cents"
    formula: "RightsHolder.receivable_balance_cents == sum(StatementLine.net_cents where statement.status == ISSUED and payee_holder_id == holder.id) + sum(AuditEngagement.settled_amount_cents + interest_cents where finding_status == SETTLED)"
    forward_action: "POST /royalties/statements/{id}/issue — balance rises by exactly net_payable_cents"
    compensating_action: "POST /royalties/rate-schedules/{id}/promulgate cascade link 3 — the statement is SUPERSEDED and the balance falls by exactly the same net_payable_cents, returning to its pre-issue value"
    note: A second, independent compensating pair on this same quantity is findings (no change) followed by settle with resolution == WITHDRAW (still no change).

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The supplied X-User-Role appears in the target endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: >-
      Every id referenced by the request exists, validated left-to-right: first the path
      parameters in path order, then the body FK fields in the order the fields are declared in
      §1.1 for the target entity. The first missing id decides the error_id.
    error_id: ERR_RIGHTS_HOLDER_NOT_FOUND | ERR_WORK_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_USAGE_BATCH_NOT_FOUND | ERR_USAGE_LINE_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_POOL_NOT_FOUND | ERR_STATEMENT_NOT_FOUND | ERR_STATEMENT_LINE_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_RATE_SCHEDULE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path id or a body FK"

  - priority: 4
    category: existence
    check: >-
      Request body is structurally valid: required fields present, enum values within their
      declared domains, integers within their declared ranges, ISO dates parseable,
      territory_set well-formed (either exactly ["WORLD"] or 1..250 distinct 2-letter codes,
      never mixed), Work.artist_credit present for RECORDING and null for COMPOSITION,
      RightsRegistration.collective_id present when routing == COLLECTIVE and null when routing
      == DIRECT, RightsHolder.direct_deal_rate_bps within 0..5000.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_referential
    check: >-
      Uniqueness of natural keys: (Work.work_type, Work.identifier) is unique
      (ERR_DUPLICATE_WORK_IDENTIFIER); AccountingPeriod.label is unique
      (ERR_DUPLICATE_PERIOD_LABEL); (RoyaltyPool.period_id, territory_code, subscription_tier)
      is unique (ERR_DUPLICATE_POOL); (RoyaltyStatement.rights_holder_id, period_id) has at most
      one row whose status IN {DRAFT, ISSUED} (ERR_DUPLICATE_STATEMENT).
    error_id: ERR_DUPLICATE_WORK_IDENTIFIER | ERR_DUPLICATE_PERIOD_LABEL | ERR_DUPLICATE_POOL | ERR_DUPLICATE_STATEMENT
    http_status: 409
    applies_to: "POST /royalties/works, POST /royalties/periods, POST /royalties/pools, POST /royalties/statements"

  - priority: 6
    category: existence
    check: >-
      Resource ownership for entity_backed roles: a RightsHolderUser may only act on resources
      whose owning holder id equals X-User-ID — AuditEngagement.rights_holder_id on engagement
      endpoints, RoyaltyStatement.rights_holder_id on statement reads, and
      RightsRegistration.claimant_id on POST /royalties/rights-registrations.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles list includes RightsHolderUser"

  - priority: 7
    category: business_safety
    check: >-
      Segregation of duties. (a) The X-User-ID approving a RightsRegistration must differ from
      Work.provisional_match_by_user_id of the registration's Work — the analyst who recorded a
      sub-10000-confidence fuzzy match may not also approve the ownership claim that monetises
      it. (b) The X-User-ID that recorded the finding on an AuditEngagement
      (findings_recorded_by_user_id) must differ from the X-User-ID settling it.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /royalties/rights-registrations/{id}/approve, POST /royalties/audit-engagements/{id}/settle"

  - priority: 8
    category: state
    check: "UsageBatch.status permits the requested operation: OPEN for POST /usage-batches/{id}/lines and /seal; SEALED for /match."
    error_id: ERR_INVALID_USAGE_BATCH_STATE
    http_status: 409
    applies_to: "POST /royalties/usage-batches/{id}/lines, /seal, /match"

  - priority: 9
    category: state
    check: >-
      RightsRegistration.status permits the requested transition: SUBMITTED for /review;
      UNDER_REVIEW for /request-evidence, /approve and /reject; NEEDS_EVIDENCE for /evidence;
      APPROVED for /dispute. REJECTED and SUPERSEDED accept nothing.
    error_id: ERR_INVALID_REGISTRATION_STATE
    http_status: 409
    applies_to: "POST /royalties/rights-registrations/{id}/review, /request-evidence, /evidence, /approve, /reject, /dispute"

  - priority: 10
    category: state
    check: "RoyaltyPool.status permits the requested transition: DRAFT, CALCULATED or REOPENED_FOR_ADJUSTMENT for /calculate; CALCULATED for /finalize."
    error_id: ERR_INVALID_POOL_STATE
    http_status: 409
    applies_to: "POST /royalties/pools/{id}/calculate, POST /royalties/pools/{id}/finalize"

  - priority: 11
    category: state
    check: "RoyaltyStatement.status == DRAFT for POST /statements/{id}/issue; AuditEngagement may only be created against a statement whose status == ISSUED."
    error_id: ERR_INVALID_STATEMENT_STATE
    http_status: 409
    applies_to: "POST /royalties/statements/{id}/issue, POST /royalties/audit-engagements"

  - priority: 12
    category: state
    check: >-
      AuditEngagement.finding_status permits the requested operation: NONE for /findings,
      ASSERTED for /settle; /data-productions requires finding_status != SETTLED and !=
      WITHDRAWN.
    error_id: ERR_INVALID_ENGAGEMENT_STATE
    http_status: 409
    applies_to: "POST /royalties/audit-engagements/{id}/data-productions, /findings, /settle"

  - priority: 13
    category: state
    check: "RateSchedule.status == PROPOSED for POST /rate-schedules/{id}/promulgate."
    error_id: ERR_INVALID_RATE_SCHEDULE_STATE
    http_status: 409
    applies_to: "POST /royalties/rate-schedules/{id}/promulgate"

  - priority: 14
    category: state
    check: >-
      AccountingPeriod.status permits the requested operation: OPEN for POST
      /royalties/usage-batches; USAGE_SEALED or REOPENED for POST /royalties/pools/{id}/calculate;
      DISTRIBUTED or REOPENED for POST /royalties/statements; DISTRIBUTED for POST
      /royalties/periods/{id}/close. CLOSED accepts nothing but the promulgation cascade.
    error_id: ERR_INVALID_PERIOD_STATE
    http_status: 409
    applies_to: "POST /royalties/usage-batches, POST /royalties/pools/{id}/calculate, POST /royalties/statements, POST /royalties/periods/{id}/close"

  - priority: 15
    category: state
    check: >-
      Optimistic concurrency: the supplied expected_<parent>_version equals the parent's current
      version. Evaluated after every state precondition above, so a stale version on an
      already-illegal target still yields the state error, not the 412.
    error_id: ERR_STALE_WORK_VERSION | ERR_STALE_PERIOD_VERSION
    http_status: 412
    applies_to: "POST /royalties/rights-registrations, POST /royalties/statements"

  - priority: 16
    category: business_safety
    check: >-
      Statutory rate floor: a RateSchedule may not be promulgated with
      statutory_floor_per_play_millicents strictly below the incumbent EFFECTIVE schedule's value
      for the same (territory_code, subscription_tier). Regulatory floors ratchet upward only.
    error_id: ERR_STATUTORY_RATE_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /royalties/rate-schedules/{id}/promulgate"

  - priority: 17
    category: business_temporal
    check: >-
      Claim window: a RightsRegistration may be created only while current_utc <=
      claim_window_closes_at for every AccountingPeriod that already carries at least one
      UsageLine whose work_id equals the registration's work_id (for a MASTER claim) or whose
      matched Work's linked_work_id equals the registration's work_id (for a MECHANICAL or
      PERFORMANCE claim). Inclusive bound — current_utc exactly equal to claim_window_closes_at is
      still open. A claim on a Work that carries no matched usage anywhere is never blocked by
      this rule; the closing of the window instead redirects money via the MATCHED_ONLY
      attribution variant.
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /royalties/rights-registrations"

  - priority: 18
    category: business_temporal
    check: >-
      Audit window: an AuditEngagement may be created only while current_utc <=
      statement.issued_at + AUDIT_WINDOW_DAYS; a data production may be accepted only while
      current_utc <= production_deadline_at.
    error_id: ERR_AUDIT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /royalties/audit-engagements, POST /royalties/audit-engagements/{id}/data-productions"

  - priority: 19
    category: business_temporal
    check: >-
      Interval well-formedness: RightsRegistration requires effective_to strictly after
      effective_from (half-open interval, so equal endpoints would be empty); RateSchedule
      requires effective_to >= effective_from (closed interval, so equal endpoints are a legal
      one-day window); AccountingPeriod requires usage_end >= usage_start; AuditEngagement
      requires requested_scope_end >= requested_scope_start and the requested scope to lie
      inside the audited statement's period.
    error_id: ERR_INVALID_EFFECTIVE_PERIOD
    http_status: 422
    applies_to: "POST /royalties/rights-registrations, POST /royalties/rate-schedules, POST /royalties/periods, POST /royalties/audit-engagements"

  - priority: 20
    category: business_referential
    check: >-
      Collective eligibility: when routing == COLLECTIVE the collective_id must reference a
      RightsHolder whose holder_type == COLLECTIVE and whose home_territory_code is WORLD or
      intersects the registration's territory_set. When routing == DIRECT the claimant's
      direct_deal_rate_bps must be non-null.
    error_id: ERR_COLLECTIVE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /royalties/rights-registrations"

  - priority: 21
    category: business_referential
    check: >-
      right_type must agree with the Work: MASTER requires work_type == RECORDING; MECHANICAL and
      PERFORMANCE require work_type == COMPOSITION. Additionally a MASTER claim may only be filed
      by a holder whose holder_type IN {LABEL, DISTRIBUTOR} and a MECHANICAL or PERFORMANCE claim
      only by holder_type IN {PUBLISHER, COLLECTIVE}.
    error_id: ERR_RIGHT_TYPE_WORK_MISMATCH
    http_status: 422
    applies_to: "POST /royalties/rights-registrations"

  - priority: 22
    category: business_constraint
    check: >-
      Share oversubscription (aggregate check, evaluated per concrete territory). For the
      registration being approved, for each concrete territory T in its territory_set (or every
      territory already claimed on this Work when the set is ["WORLD"]), the sum of share_bps over
      all APPROVED registrations of the same (work_id, right_type) whose territory_set contains T
      or WORLD and whose half-open interval [effective_from, effective_to) overlaps this
      registration's interval, PLUS this registration's own share_bps, must not exceed 10000.
      Exactly 10000 is allowed; 10001 is rejected. Rows moved to SUPERSEDED by
      supersede_overlapping are excluded from the sum because the supersede step runs first.
    error_id: ERR_SHARE_OVERSUBSCRIBED
    http_status: 409
    applies_to: "POST /royalties/rights-registrations/{id}/approve"

  - priority: 23
    category: business_constraint
    check: >-
      RateSchedule exclusive occupancy (aggregate temporal check). Promulgating a schedule is
      rejected when another EFFECTIVE schedule exists for the SAME (territory_code,
      subscription_tier) whose CLOSED interval [effective_from, effective_to] overlaps — touching
      endpoints count as an overlap — unless the request sets supersede_incumbent == true, in
      which case the incumbent is moved to SUPERSEDED first and no conflict remains. Unlike
      RightsRegistration territory matching, a WORLD schedule does NOT collide with a
      specific-territory schedule: they are separate specificity layers resolved at selection
      time.
    error_id: ERR_RATE_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /royalties/rate-schedules/{id}/promulgate"

  - priority: 24
    category: business_constraint
    check: >-
      Structural coherence of a proposed RateSchedule: mechanical_share_bps +
      performance_share_bps must equal exactly 10000.
    error_id: ERR_RATE_SHARE_SPLIT_INVALID
    http_status: 422
    applies_to: "POST /royalties/rate-schedules"

  - priority: 25
    category: business_constraint
    check: >-
      A UsageBatch may not be sealed with line_count == 0 (an empty batch would seal a period
      with no usage), and a UsageLine may not be created with play_count < 1.
    error_id: ERR_EMPTY_USAGE_BATCH | ERR_ZERO_PLAY_COUNT
    http_status: 422
    applies_to: "POST /royalties/usage-batches/{id}/seal, POST /royalties/usage-batches/{id}/lines"

  - priority: 26
    category: business_constraint
    check: >-
      Evidence rounds are capped: POST /royalties/rights-registrations/{id}/request-evidence is
      rejected once evidence_round == MAX_EVIDENCE_ROUNDS (2). This is the cyclic state machine's
      termination condition.
    error_id: ERR_EVIDENCE_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /royalties/rights-registrations/{id}/request-evidence"

  - priority: 27
    category: business_constraint
    check: >-
      A dispute may not be raised by the registration's own claimant or by its collective:
      disputing_holder_id must differ from both claimant_id and collective_id.
    error_id: ERR_DISPUTE_BY_CLAIMANT
    http_status: 422
    applies_to: "POST /royalties/rights-registrations/{id}/dispute"

  - priority: 28
    category: business_fiscal
    check: >-
      No effective rate: POST /royalties/pools/{id}/calculate is rejected when
      calculations.rate_schedule_selection yields an empty candidate set.
    error_id: ERR_NO_EFFECTIVE_RATE_SCHEDULE
    http_status: 422
    applies_to: "POST /royalties/pools/{id}/calculate"

  - priority: 29
    category: business_fiscal
    check: >-
      Data production completeness: POST /royalties/audit-engagements/{id}/findings is rejected
      unless production_status == COMPLETE — a rights holder cannot assert an underpayment before
      the service has produced every line of the audited statement.
    error_id: ERR_DATA_PRODUCTION_INCOMPLETE
    http_status: 422
    applies_to: "POST /royalties/audit-engagements/{id}/findings"

  - priority: 30
    category: business_fiscal
    check: "settled_amount_cents must be <= asserted_underpayment_cents when resolution == UPHOLD, and exactly 0 when resolution == WITHDRAW."
    error_id: ERR_SETTLEMENT_EXCEEDS_ASSERTION
    http_status: 422
    applies_to: "POST /royalties/audit-engagements/{id}/settle"

  - priority: 31
    category: business_fiscal
    check: >-
      A RoyaltyStatement may not be issued when statement_line_build produced zero lines for the
      addressed holder (nothing to state).
    error_id: ERR_NO_STATEMENT_LINES
    http_status: 422
    applies_to: "POST /royalties/statements/{id}/issue"

  - priority: 32
    category: business_fiscal
    check: >-
      Holding account must be empty before a period closes: POST /royalties/periods/{id}/close is
      rejected when total_holding_cents != 0. Money sitting in a holding account may not be
      locked away by a period close.
    error_id: ERR_HOLDING_UNRESOLVED
    http_status: 422
    applies_to: "POST /royalties/periods/{id}/close"

  - priority: 33
    category: business_fiscal
    check: >-
      No open ownership claims may remain when a period closes: POST /royalties/periods/{id}/close
      is rejected when any RightsRegistration touching a Work carrying usage in this period has
      status IN {SUBMITTED, UNDER_REVIEW, NEEDS_EVIDENCE, DISPUTED}.
    error_id: ERR_UNRESOLVED_REGISTRATIONS
    http_status: 422
    applies_to: "POST /royalties/periods/{id}/close"

endpoints:
  # ---------- RightsHolder ----------
  - method: POST
    path: "/royalties/rights-holders"
    description: "Register a label, distributor, publisher or collective as a rights holder."
    roles: [RoyaltyAdmin]
    code: 201
    input: [legal_name, holder_type, home_territory_code, "direct_deal_rate_bps?"]
    output: RightsHolder
    side_effects: ["receivable_balance_cents and issued_statement_count initialised to 0", "version initialised to 1"]
  - method: GET
    path: "/royalties/rights-holders/{id}"
    description: "Read a rights holder including its computed receivable balance."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: []
    output: RightsHolder
    side_effects: []

  # ---------- Work ----------
  - method: POST
    path: "/royalties/works"
    description: "Create a sound recording or musical composition in the metadata catalogue."
    roles: [RightsOpsAnalyst, RoyaltyAdmin]
    code: 201
    input: [work_type, identifier, title, "artist_credit?", "linked_work_id?"]
    output: Work
    side_effects: ["computes normalized_title and normalized_artist", "rights_state initialised to UNMATCHED", "version initialised to 1"]
  - method: GET
    path: "/royalties/works/{id}"
    description: "Read a work including its computed rights_state and approved_master_share_bps."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: []
    output: Work
    side_effects: []
  - method: GET
    path: "/royalties/works"
    description: "List works, optionally filtered by type, by the composition they are linked to, or by rights_state."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: ["work_type?", "linked_work_id?", "rights_state?"]
    output: Work[]
    side_effects: []

  # ---------- AccountingPeriod ----------
  - method: POST
    path: "/royalties/periods"
    description: "Open a royalty accounting period."
    roles: [RoyaltyAdmin]
    code: 201
    input: [label, usage_start, usage_end]
    output: AccountingPeriod
    side_effects: ["computes claim_window_closes_at as usage_end 00:00:00.000Z plus CLAIM_WINDOW_DAYS", "status initialised to OPEN", "version initialised to 1"]
  - method: GET
    path: "/royalties/periods/{id}"
    description: "Read an accounting period including status and total_holding_cents."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: []
  - method: POST
    path: "/royalties/periods/{id}/close"
    description: "Close a distributed period, locking it against further calculation."
    roles: [RoyaltyAdmin]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: ["DISTRIBUTED -> CLOSED", "increments AccountingPeriod.version by 1"]

  # ---------- UsageBatch ----------
  - method: POST
    path: "/royalties/usage-batches"
    description: "Open a usage-reporting batch inside an OPEN accounting period."
    roles: [RightsOpsAnalyst, RoyaltyAdmin]
    code: 201
    input: [period_id, source_label]
    output: UsageBatch
    side_effects: ["status initialised to OPEN", "all play-count aggregates initialised to 0", "version initialised to 1"]
  - method: GET
    path: "/royalties/usage-batches/{id}"
    description: "Read a usage batch including its four play-count aggregates."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RegulatoryOfficer]
    code: 200
    input: []
    output: UsageBatch
    side_effects: []
  - method: GET
    path: "/royalties/usage-batches"
    description: "List usage batches, optionally filtered by the accounting period that owns them or by status."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RegulatoryOfficer]
    code: 200
    input: ["period_id?", "status?"]
    output: UsageBatch[]
    side_effects: []
  - method: POST
    path: "/royalties/usage-batches/{id}/lines"
    description: "Append one reported play aggregate to an OPEN usage batch."
    roles: [RightsOpsAnalyst]
    code: 201
    input: [reported_title, territory_code, subscription_tier, play_count, "reported_isrc?", "reported_artist?"]
    output: UsageLine
    side_effects: ["match_status initialised to UNMATCHED and match_confidence_bps to 0", "recomputes UsageBatch.line_count, total_play_count and unmatched_play_count", "increments UsageBatch.version by 1"]
  - method: POST
    path: "/royalties/usage-batches/{id}/seal"
    description: "Seal an OPEN usage batch so no further lines may be appended."
    roles: [RightsOpsAnalyst]
    code: 200
    input: []
    output: UsageBatch
    side_effects: ["OPEN -> SEALED", "rejects the batch when line_count == 0", "increments UsageBatch.version by 1"]
  - method: POST
    path: "/royalties/usage-batches/{id}/match"
    description: "Run calculations.usage_line_matching over every line of a SEALED batch and fork to MATCHED or PARTIALLY_MATCHED."
    roles: [RightsOpsAnalyst]
    code: 200
    input: []
    output: UsageBatch
    side_effects: ["SEALED -> MATCHED when every line resolves, else SEALED -> PARTIALLY_MATCHED", "writes UsageLine.work_id, match_status and match_confidence_bps on every line", "stamps Work.provisional_match_by_user_id on works matched below 10000 confidence", "recomputes Work.rights_state for every touched work", "recomputes the batch play-count aggregates", "bubbles AccountingPeriod.status to USAGE_SEALED once every batch of the period is MATCHED or PARTIALLY_MATCHED", "increments UsageBatch.version by 1"]

  # ---------- UsageLine ----------
  - method: GET
    path: "/royalties/usage-lines/{id}"
    description: "Read a single reported play aggregate including its match and attribution results."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RegulatoryOfficer]
    code: 200
    input: []
    output: UsageLine
    side_effects: []
  - method: GET
    path: "/royalties/usage-lines"
    description: "List usage lines, optionally filtered by the batch that reported them, by the work they matched to, or by match_status."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RegulatoryOfficer]
    code: 200
    input: ["batch_id?", "work_id?", "match_status?", "territory_code?", "subscription_tier?"]
    output: UsageLine[]
    side_effects: []

  # ---------- RightsRegistration ----------
  - method: POST
    path: "/royalties/rights-registrations"
    description: "File an ownership claim over a recording or composition. Requires expected_work_version because approving a claim can supersede an incumbent registration of the same work."
    roles: [RightsHolderUser, RightsOpsAnalyst]
    code: 201
    input: [work_id, claimant_id, right_type, routing, share_bps, territory_set, effective_from, effective_to, expected_work_version, "collective_id?", "supersede_overlapping?"]
    output: RightsRegistration
    side_effects: ["status initialised to SUBMITTED and evidence_round to 0", "computes payee_holder_id from routing", "recomputes Work.rights_state to PROVISIONAL", "increments Work.version by 1"]
  - method: GET
    path: "/royalties/rights-registrations/{id}"
    description: "Read an ownership claim including its computed payee_holder_id and status."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: []
    output: RightsRegistration
    side_effects: []
  - method: GET
    path: "/royalties/rights-registrations"
    description: "List ownership claims, optionally filtered by work, claimant, administering collective, payee, disputing holder or status."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: ["work_id?", "claimant_id?", "collective_id?", "payee_holder_id?", "disputing_holder_id?", "status?", "right_type?"]
    output: RightsRegistration[]
    side_effects: []
  - method: POST
    path: "/royalties/rights-registrations/{id}/review"
    description: "Take a SUBMITTED claim into review."
    roles: [RightsOpsAnalyst]
    code: 200
    input: []
    output: RightsRegistration
    side_effects: ["SUBMITTED -> UNDER_REVIEW", "increments RightsRegistration.version by 1"]
  - method: POST
    path: "/royalties/rights-registrations/{id}/request-evidence"
    description: "Bounce a claim under review back to the claimant for documentary evidence. Capped at MAX_EVIDENCE_ROUNDS rounds."
    roles: [RightsOpsAnalyst]
    code: 200
    input: []
    output: RightsRegistration
    side_effects: ["UNDER_REVIEW -> NEEDS_EVIDENCE", "rejects the call once evidence_round == MAX_EVIDENCE_ROUNDS", "increments RightsRegistration.version by 1"]
  - method: POST
    path: "/royalties/rights-registrations/{id}/evidence"
    description: "Supply the requested evidence, returning the claim to review. Closes one cycle of the review loop."
    roles: [RightsHolderUser, RightsOpsAnalyst]
    code: 200
    input: []
    output: RightsRegistration
    side_effects: ["NEEDS_EVIDENCE -> UNDER_REVIEW", "increments evidence_round by 1", "increments RightsRegistration.version by 1"]
  - method: POST
    path: "/royalties/rights-registrations/{id}/approve"
    description: "Approve an ownership claim. Drives cascade link 1 of the three-level approval cascade."
    roles: [RightsOpsAnalyst]
    code: 200
    input: []
    output: RightsRegistration
    side_effects: ["UNDER_REVIEW -> APPROVED, or DISPUTED -> UNDER_REVIEW -> APPROVED on re-approval after a dispute", "moves overlapping incumbents to SUPERSEDED first when supersede_overlapping == true", "enforces the per-territory 10000 bps aggregate share ceiling", "CASCADE LINK 2: re-runs calculations.usage_line_matching in CLAIM_MATCH mode over UNMATCHED lines of the claimed work", "CASCADE LINK 3: recomputes RoyaltyPool.matched_attributed_cents and holding_cents for every affected pool", "recomputes UsageBatch play-count aggregates and promotes PARTIALLY_MATCHED batches to MATCHED once unmatched_play_count reaches 0", "recomputes Work.rights_state", "stamps reviewed_by_user_id", "increments RightsRegistration.version by 1"]
  - method: POST
    path: "/royalties/rights-registrations/{id}/reject"
    description: "Reject an ownership claim under review; terminal."
    roles: [RightsOpsAnalyst]
    code: 200
    input: [rejection_reason]
    output: RightsRegistration
    side_effects: ["UNDER_REVIEW -> REJECTED (terminal)", "recomputes Work.rights_state", "stamps reviewed_by_user_id", "increments RightsRegistration.version by 1"]
  - method: POST
    path: "/royalties/rights-registrations/{id}/dispute"
    description: "Raise a competing claim against an APPROVED registration. This is the compensating action for the approval cascade."
    roles: [RightsHolderUser, RightsOpsAnalyst]
    code: 200
    input: [disputing_holder_id]
    output: RightsRegistration
    side_effects: ["APPROVED -> DISPUTED", "moves every UsageLine this registration CLAIM_MATCHED back to match_status DISPUTED", "reverses cascade link 3: moves the same cents from RoyaltyPool.matched_attributed_cents back into holding_cents with no drift", "recomputes UsageBatch play-count aggregates into disputed_play_count", "recomputes Work.rights_state to DISPUTED", "increments RightsRegistration.version by 1"]

  # ---------- RoyaltyPool ----------
  - method: POST
    path: "/royalties/pools"
    description: "Create the royalty pool for one (period, territory, subscription tier) cell and book its gross revenue and subscriber count."
    roles: [RoyaltyAdmin]
    code: 201
    input: [period_id, territory_code, subscription_tier, subscriber_count, gross_revenue_cents]
    output: RoyaltyPool
    side_effects: ["status initialised to DRAFT", "all computed money fields initialised to 0", "version initialised to 1"]
  - method: GET
    path: "/royalties/pools/{id}"
    description: "Read a royalty pool including distributable_cents, allocation_basis, denominator_basis, holding_cents and rounding_residual_cents."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: []
    output: RoyaltyPool
    side_effects: []
  - method: GET
    path: "/royalties/pools"
    description: "List royalty pools, optionally filtered by period, by the rate schedule applied to them, by residual payee or by status."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: ["period_id?", "applied_rate_schedule_id?", "residual_payee_holder_id?", "status?", "territory_code?", "subscription_tier?"]
    output: RoyaltyPool[]
    side_effects: []
  - method: POST
    path: "/royalties/pools/{id}/calculate"
    description: "Select the governing rate schedule, size the pool and attribute it across in-scope usage lines. Re-runnable while CALCULATED."
    roles: [RoyaltyAdmin]
    code: 200
    input: []
    output: RoyaltyPool
    side_effects: ["DRAFT -> CALCULATED, CALCULATED -> CALCULATED (recompute self-loop), or REOPENED_FOR_ADJUSTMENT -> CALCULATED", "runs calculations.rate_schedule_selection and writes applied_rate_schedule_id", "runs calculations.pool_distributable_amount and writes revenue_share_pool_cents, minimum_pool_cents, statutory_floor_cents, distributable_cents and allocation_basis", "runs calculations.pool_attribution and writes denominator_basis, denominator_play_count, every UsageLine.attributed_revenue_cents, matched_attributed_cents, holding_cents and rounding_residual_cents", "recomputes AccountingPeriod.total_holding_cents", "increments RoyaltyPool.version by 1"]
  - method: POST
    path: "/royalties/pools/{id}/finalize"
    description: "Freeze a calculated pool, fixing distributable_cents, rounding_residual_cents and the residual payee."
    roles: [RoyaltyAdmin]
    code: 200
    input: []
    output: RoyaltyPool
    side_effects: ["CALCULATED -> FINALIZED", "runs calculations.residual_payee_selection and writes residual_payee_holder_id", "freezes distributable_cents, denominator_basis and rounding_residual_cents", "bubbles AccountingPeriod.status to DISTRIBUTED once every pool of the period is FINALIZED", "moves every UsageBatch of the period to RECONCILED", "increments RoyaltyPool.version by 1"]

  # ---------- RoyaltyStatement / StatementLine ----------
  - method: POST
    path: "/royalties/statements"
    description: "Build a draft statement for one rights holder over one period. Requires expected_period_version because the promulgation cascade can reopen the period and supersede statements built against the previous rates."
    roles: [RoyaltyAdmin]
    code: 201
    input: [rights_holder_id, period_id, expected_period_version]
    output: RoyaltyStatement
    side_effects: ["status initialised to DRAFT", "runs calculations.statement_line_build and materialises the immutable StatementLine rows (line_type USAGE, HOLDING_RELEASE and RESIDUAL)", "runs calculations.retroactive_adjustment_delta instead when a SUPERSEDED RoyaltyStatement already exists for this (rights_holder_id, period_id), materialising only ADJUSTMENT lines", "runs calculations.admin_fee_resolution per line", "aggregates gross_cents, admin_fee_cents, net_payable_cents and line_count", "increments AccountingPeriod.version by 1"]
  - method: GET
    path: "/royalties/statements/{id}"
    description: "Read a statement header including gross, admin fee, net payable and issued_at."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []
  - method: GET
    path: "/royalties/statements"
    description: "List statements, optionally filtered by addressed rights holder, by period or by status."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: ["rights_holder_id?", "period_id?", "status?"]
    output: RoyaltyStatement[]
    side_effects: []
  - method: POST
    path: "/royalties/statements/{id}/issue"
    description: "Issue a draft statement to the rights holder, stamping issued_at from the logical clock and moving the net payable onto the holder's receivable balance."
    roles: [RoyaltyAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["DRAFT -> ISSUED", "stamps issued_at from the logical clock", "increases RightsHolder.receivable_balance_cents by exactly net_payable_cents", "increments RightsHolder.issued_statement_count by 1", "increments RoyaltyStatement.version by 1"]
  - method: GET
    path: "/royalties/statement-lines/{id}"
    description: "Read one immutable statement line."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: []
    output: StatementLine
    side_effects: []
  - method: GET
    path: "/royalties/statement-lines"
    description: "List statement lines with full line-item detail, optionally filtered by statement, funding pool, work, payee, corrected line or line_type. The only discovery channel for cascade-created lines."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: ["statement_id?", "pool_id?", "work_id?", "payee_holder_id?", "adjustment_of_line_id?", "line_type?", "right_type?", "territory_code?", "subscription_tier?"]
    output: StatementLine[]
    side_effects: []

  # ---------- AuditEngagement ----------
  - method: POST
    path: "/royalties/audit-engagements"
    description: "Exercise an audit right against an issued statement, freezing the required line count and the data-production deadline."
    roles: [RightsHolderUser]
    code: 201
    input: [rights_holder_id, statement_id, requested_scope_start, requested_scope_end]
    output: AuditEngagement
    side_effects: ["production_status initialised to PENDING and finding_status to NONE", "freezes required_line_count from the audited statement's line_count", "computes production_deadline_at as created_at plus DATA_PRODUCTION_DAYS", "version initialised to 1"]
  - method: GET
    path: "/royalties/audit-engagements/{id}"
    description: "Read an audit engagement including both independent status dimensions."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: []
  - method: GET
    path: "/royalties/audit-engagements"
    description: "List audit engagements, optionally filtered by auditing rights holder, audited statement, production_status or finding_status."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: ["rights_holder_id?", "statement_id?", "production_status?", "finding_status?"]
    output: AuditEngagement[]
    side_effects: []
  - method: POST
    path: "/royalties/audit-engagements/{id}/data-productions"
    description: "Produce a set of statement lines to the auditor, advancing the production dimension independently of the finding dimension."
    roles: [RoyaltyAdmin]
    code: 200
    input: [statement_line_ids]
    output: AuditEngagement
    side_effects: ["recomputes produced_line_count as the count of distinct lines produced so far", "moves production_status PENDING -> PARTIAL -> COMPLETE without touching finding_status", "increments AuditEngagement.version by 1"]
  - method: POST
    path: "/royalties/audit-engagements/{id}/findings"
    description: "Assert an underpayment. Permitted only once production_status == COMPLETE."
    roles: [RightsHolderUser]
    code: 200
    input: [asserted_underpayment_cents, "finding_note?"]
    output: AuditEngagement
    side_effects: ["finding_status NONE -> ASSERTED without touching production_status", "stamps findings_recorded_by_user_id", "increments AuditEngagement.version by 1"]
  - method: POST
    path: "/royalties/audit-engagements/{id}/settle"
    description: "Resolve an asserted finding, either upholding it with interest or withdrawing it. The settling user must differ from the user who recorded the finding."
    roles: [RoyaltyAdmin]
    code: 200
    input: [resolution, "settled_amount_cents?"]
    output: AuditEngagement
    side_effects: ["finding_status ASSERTED -> SETTLED when resolution == UPHOLD, ASSERTED -> WITHDRAWN when resolution == WITHDRAW", "runs calculations.audit_settlement_interest on UPHOLD and writes interest_cents", "increases RightsHolder.receivable_balance_cents by settled_amount_cents + interest_cents on UPHOLD and leaves it unchanged on WITHDRAW", "increments AuditEngagement.version by 1"]

  # ---------- RateSchedule ----------
  - method: POST
    path: "/royalties/rate-schedules"
    description: "Record a proposed rate schedule emerging from a regulatory proceeding."
    roles: [RegulatoryOfficer]
    code: 201
    input: [proceeding_ref, territory_code, subscription_tier, revenue_share_bps, per_subscriber_minimum_cents, mechanical_share_bps, performance_share_bps, statutory_floor_per_play_millicents, effective_from, effective_to, "retroactive?"]
    output: RateSchedule
    side_effects: ["status initialised to PROPOSED", "rejects the proposal unless mechanical_share_bps + performance_share_bps == 10000", "version initialised to 1"]
  - method: GET
    path: "/royalties/rate-schedules/{id}"
    description: "Read a rate schedule including its status and promulgated_at."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: []
    output: RateSchedule
    side_effects: []
  - method: POST
    path: "/royalties/rate-schedules/{id}/promulgate"
    description: "Bring a proposed rate schedule into force. Drives the four-level retroactive-adjustment cascade when retroactive == true."
    roles: [RegulatoryOfficer]
    code: 200
    input: ["supersede_incumbent?"]
    output: RateSchedule
    side_effects: ["PROPOSED -> EFFECTIVE", "stamps promulgated_at from the logical clock", "enforces the statutory floor ratchet against the incumbent EFFECTIVE schedule", "enforces exclusive occupancy over the closed interval unless supersede_incumbent == true, in which case the incumbent moves to SUPERSEDED first", "CASCADE LINK 2: moves every FINALIZED RoyaltyPool whose period usage_end falls inside the window to REOPENED_FOR_ADJUSTMENT and sets the owning AccountingPeriod.status to REOPENED (retroactive == true only)", "CASCADE LINK 3: moves every ISSUED RoyaltyStatement of those periods to SUPERSEDED and decreases each addressed RightsHolder.receivable_balance_cents by exactly that statement's net_payable_cents", "CASCADE LINK 4: decrements RightsHolder.issued_statement_count for every superseded statement", "increments RateSchedule.version by 1 and AccountingPeriod.version by 1 for each reopened period"]

  # ---------- test-driving surface ----------
  - method: POST
    path: "/royalties/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary instant so claim windows, audit windows and settlement interest are deterministic. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [RoyaltyAdmin, RightsOpsAnalyst, RightsHolderUser, RegulatoryOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets current_utc, which is read by claim-window, audit-window, issued_at, promulgated_at and audit_settlement_interest logic"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the four declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A RightsHolderUser acted on a resource whose owning rights-holder id differs from X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The approving analyst equals Work.provisional_match_by_user_id, or the settling admin equals AuditEngagement.findings_recorded_by_user_id."
  - id: ERR_RIGHTS_HOLDER_NOT_FOUND
    http: 404
    condition: "A referenced RightsHolder id does not exist (path id, claimant_id, collective_id, disputing_holder_id or rights_holder_id)."
  - id: ERR_WORK_NOT_FOUND
    http: 404
    condition: "A referenced Work id does not exist (path id or work_id or linked_work_id)."
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "A referenced AccountingPeriod id does not exist."
  - id: ERR_USAGE_BATCH_NOT_FOUND
    http: 404
    condition: "A referenced UsageBatch id does not exist."
  - id: ERR_USAGE_LINE_NOT_FOUND
    http: 404
    condition: "A referenced UsageLine id does not exist."
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "A referenced RightsRegistration id does not exist."
  - id: ERR_POOL_NOT_FOUND
    http: 404
    condition: "A referenced RoyaltyPool id does not exist."
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "A referenced RoyaltyStatement id does not exist."
  - id: ERR_STATEMENT_LINE_NOT_FOUND
    http: 404
    condition: "A referenced StatementLine id does not exist, including an id inside statement_line_ids on a data production."
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "A referenced AuditEngagement id does not exist."
  - id: ERR_RATE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "A referenced RateSchedule id does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, enum value outside its domain, integer outside its declared range, unparseable ISO date, malformed territory_set, artist_credit present on a COMPOSITION or absent on a RECORDING, collective_id present on a DIRECT registration or absent on a COLLECTIVE one."
  - id: ERR_DUPLICATE_WORK_IDENTIFIER
    http: 409
    condition: "A Work already exists with the same (work_type, identifier)."
  - id: ERR_DUPLICATE_PERIOD_LABEL
    http: 409
    condition: "An AccountingPeriod already exists with the same label."
  - id: ERR_DUPLICATE_POOL
    http: 409
    condition: "A RoyaltyPool already exists for the same (period_id, territory_code, subscription_tier)."
  - id: ERR_DUPLICATE_STATEMENT
    http: 409
    condition: "A RoyaltyStatement whose status is DRAFT or ISSUED already exists for the same (rights_holder_id, period_id)."
  - id: ERR_INVALID_USAGE_BATCH_STATE
    http: 409
    condition: "UsageBatch is not OPEN for a line append or seal, or not SEALED for a match."
  - id: ERR_INVALID_REGISTRATION_STATE
    http: 409
    condition: "RightsRegistration is not in the state the requested transition requires; REJECTED and SUPERSEDED accept no transition at all."
  - id: ERR_INVALID_POOL_STATE
    http: 409
    condition: "RoyaltyPool is FINALIZED when calculate was requested, or not CALCULATED when finalize was requested."
  - id: ERR_INVALID_STATEMENT_STATE
    http: 409
    condition: "RoyaltyStatement is not DRAFT when issue was requested, or an audit engagement was opened against a statement that is not ISSUED."
  - id: ERR_INVALID_ENGAGEMENT_STATE
    http: 409
    condition: "AuditEngagement.finding_status is not NONE for a finding, not ASSERTED for a settle, or already SETTLED/WITHDRAWN for a data production."
  - id: ERR_INVALID_RATE_SCHEDULE_STATE
    http: 409
    condition: "RateSchedule is not PROPOSED when promulgate was requested."
  - id: ERR_INVALID_PERIOD_STATE
    http: 409
    condition: "AccountingPeriod is not in the state the requested operation requires; CLOSED accepts nothing but the promulgation cascade."
  - id: ERR_STALE_WORK_VERSION
    http: 412
    condition: "expected_work_version on a registration create does not equal the Work's current version."
  - id: ERR_STALE_PERIOD_VERSION
    http: 412
    condition: "expected_period_version on a statement create does not equal the AccountingPeriod's current version."
  - id: ERR_STATUTORY_RATE_FLOOR_BREACH
    http: 422
    condition: "Promulgating a schedule whose statutory_floor_per_play_millicents is strictly below the incumbent EFFECTIVE schedule's value for the same (territory_code, subscription_tier)."
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "A rights registration was filed after claim_window_closes_at for a period that already carries a UsageLine matched to the claimed work (or to a recording whose linked composition is the claimed work). Exactly equal to the deadline is still open."
  - id: ERR_AUDIT_WINDOW_EXPIRED
    http: 422
    condition: "An audit engagement was opened more than AUDIT_WINDOW_DAYS after the statement was issued, or a data production arrived after production_deadline_at."
  - id: ERR_INVALID_EFFECTIVE_PERIOD
    http: 422
    condition: "Interval is ill-formed for its declared boundary semantics: registration effective_to not strictly after effective_from (half-open), schedule effective_to before effective_from (closed), period usage_end before usage_start, or an audit scope outside the audited statement's period."
  - id: ERR_COLLECTIVE_NOT_ELIGIBLE
    http: 422
    condition: "collective_id does not reference a holder_type == COLLECTIVE holder, or its home_territory_code neither is WORLD nor intersects the registration's territory_set, or a DIRECT registration's claimant has a null direct_deal_rate_bps."
  - id: ERR_RIGHT_TYPE_WORK_MISMATCH
    http: 422
    condition: "MASTER claimed on a COMPOSITION, MECHANICAL or PERFORMANCE claimed on a RECORDING, or the claimant's holder_type is not permitted to claim that right_type."
  - id: ERR_SHARE_OVERSUBSCRIBED
    http: 409
    condition: "Approving the registration would push the summed APPROVED share_bps for some concrete territory of the same (work_id, right_type) with an overlapping half-open interval above 10000. Exactly 10000 is accepted."
  - id: ERR_RATE_SCHEDULE_OVERLAP
    http: 409
    condition: "Promulgating would leave two EFFECTIVE schedules for the same (territory_code, subscription_tier) whose closed intervals overlap or touch, and supersede_incumbent was not set."
  - id: ERR_RATE_SHARE_SPLIT_INVALID
    http: 422
    condition: "mechanical_share_bps + performance_share_bps != 10000 on a proposed rate schedule."
  - id: ERR_EMPTY_USAGE_BATCH
    http: 422
    condition: "Sealing a usage batch whose line_count == 0."
  - id: ERR_ZERO_PLAY_COUNT
    http: 422
    condition: "Appending a usage line with play_count < 1."
  - id: ERR_EVIDENCE_ROUNDS_EXHAUSTED
    http: 422
    condition: "request-evidence was called on a registration whose evidence_round already equals MAX_EVIDENCE_ROUNDS."
  - id: ERR_DISPUTE_BY_CLAIMANT
    http: 422
    condition: "disputing_holder_id equals the registration's own claimant_id or collective_id."
  - id: ERR_NO_EFFECTIVE_RATE_SCHEDULE
    http: 422
    condition: "calculations.rate_schedule_selection found no EFFECTIVE schedule covering the pool's territory, tier and the period's usage_end."
  - id: ERR_DATA_PRODUCTION_INCOMPLETE
    http: 422
    condition: "A finding was asserted while production_status is PENDING or PARTIAL."
  - id: ERR_SETTLEMENT_EXCEEDS_ASSERTION
    http: 422
    condition: "settled_amount_cents exceeds asserted_underpayment_cents on UPHOLD, or is non-zero on WITHDRAW."
  - id: ERR_NO_STATEMENT_LINES
    http: 422
    condition: "Issuing a statement whose line_count == 0."
  - id: ERR_HOLDING_UNRESOLVED
    http: 422
    condition: "Closing a period whose total_holding_cents != 0."
  - id: ERR_UNRESOLVED_REGISTRATIONS
    http: 422
    condition: "Closing a period while some registration touching its usage is still SUBMITTED, UNDER_REVIEW, NEEDS_EVIDENCE or DISPUTED."

roles:
  - name: RoyaltyAdmin
    description: "Royalty operations controller: opens periods and pools, calculates and finalizes distributions, builds and issues statements, produces audit data and settles audit findings."
    identity: opaque
    exclusive_operations:
      - "POST /royalties/rights-holders"
      - "POST /royalties/periods"
      - "POST /royalties/periods/{id}/close"
      - "POST /royalties/pools"
      - "POST /royalties/pools/{id}/calculate"
      - "POST /royalties/pools/{id}/finalize"
      - "POST /royalties/statements"
      - "POST /royalties/statements/{id}/issue"
      - "POST /royalties/audit-engagements/{id}/data-productions"
      - "POST /royalties/audit-engagements/{id}/settle"
    shared_operations:
      - "POST /royalties/works"
      - "POST /royalties/usage-batches"
      - "POST /royalties/_clock/set_current_utc"
      - "all GET endpoints"
  - name: RightsOpsAnalyst
    description: "Rights operations analyst: maintains the metadata catalogue, ingests and matches usage, and adjudicates ownership claims. Cannot calculate or issue money."
    identity: opaque
    exclusive_operations:
      - "POST /royalties/usage-batches/{id}/lines"
      - "POST /royalties/usage-batches/{id}/seal"
      - "POST /royalties/usage-batches/{id}/match"
      - "POST /royalties/rights-registrations/{id}/review"
      - "POST /royalties/rights-registrations/{id}/request-evidence"
      - "POST /royalties/rights-registrations/{id}/approve"
      - "POST /royalties/rights-registrations/{id}/reject"
    shared_operations:
      - "POST /royalties/works"
      - "POST /royalties/usage-batches"
      - "POST /royalties/rights-registrations"
      - "POST /royalties/rights-registrations/{id}/evidence"
      - "POST /royalties/rights-registrations/{id}/dispute"
      - "POST /royalties/_clock/set_current_utc"
      - "all GET endpoints"
  - name: RightsHolderUser
    description: "A label, distributor, publisher or collective acting on its own behalf: files claims, supplies evidence, disputes rival claims, exercises audit rights and asserts findings. X-User-ID is the RightsHolder id."
    identity: "entity_backed:RightsHolder"
    exclusive_operations:
      - "POST /royalties/audit-engagements"
      - "POST /royalties/audit-engagements/{id}/findings"
    shared_operations:
      - "POST /royalties/rights-registrations"
      - "POST /royalties/rights-registrations/{id}/evidence"
      - "POST /royalties/rights-registrations/{id}/dispute"
      - "POST /royalties/_clock/set_current_utc"
      - "all GET endpoints"
  - name: RegulatoryOfficer
    description: "Rate-proceeding officer: records proposed rate schedules and brings them into force, including retroactively. Cannot touch usage, claims, pools or statements directly."
    identity: opaque
    exclusive_operations:
      - "POST /royalties/rate-schedules"
      - "POST /royalties/rate-schedules/{id}/promulgate"
    shared_operations:
      - "POST /royalties/_clock/set_current_utc"
      - "all GET endpoints"

global_constants:
  CLAIM_WINDOW_DAYS: 60
  MAX_EVIDENCE_ROUNDS: 2
  AUDIT_WINDOW_DAYS: 180
  DATA_PRODUCTION_DAYS: 30
  MAX_POOL_CAP_MULTIPLE: 3
  MASTER_SHARE_OF_ATTRIBUTED_BPS: 7500
  ISRC_EXACT_CONFIDENCE_BPS: 10000
  TITLE_ARTIST_CONFIDENCE_BPS: 7500
  TITLE_ONLY_CONFIDENCE_BPS: 5000
  AUTO_MATCH_MIN_CONFIDENCE_BPS: 7500
  CLAIM_MATCH_MIN_CONFIDENCE_BPS: 5000
  ADMIN_TIER_1_CEILING_CENTS: 100000
  ADMIN_TIER_2_CEILING_CENTS: 1000000
  ADMIN_TIER_1_BPS: 1200
  ADMIN_TIER_2_BPS: 900
  ADMIN_TIER_3_BPS: 600
  AUDIT_INTEREST_ANNUAL_BPS: 900
  DAYS_PER_YEAR: 365
  MAX_SHARE_BPS_PER_TERRITORY: 10000
  STATUTORY_MIN_REVENUE_SHARE_BPS: 5000
