            - "After the ISSUE: Player.${p5_id}.medical_status == CLEARED while Player.${p5_id}.roster_status is still RESERVE_LIST (only the medical dimension moved)"
            - "After the assignment ACTIVATE: Player.${p5_id}.roster_status == ACTIVE while Player.${p5_id}.medical_status is still CLEARED (only the roster dimension moved)"
            - "After the DENY: Player.${p5_id}.medical_status == RESTRICTED while Player.${p5_id}.roster_status is still ACTIVE (only the medical dimension moved)"
            - "PlayerAssignment.${asg5}.status == ACTIVE after the DENY (a denial is not a revocation and does not suspend anything)"
