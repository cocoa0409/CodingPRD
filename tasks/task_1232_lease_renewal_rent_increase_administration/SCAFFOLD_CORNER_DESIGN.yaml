        test_recipe:
          setup: ["full renewal loop executed at 2026-05-01 (document COUNTERSIGNED, rescind_deadline_date 2026-05-04); clock advanced to 2026-05-05"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
