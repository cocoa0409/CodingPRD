  - method: POST
    path: /platform-requests/{request_id}/transitions
    description: >-
      Drives the request's cyclic lifecycle. Fiduciary owns SUBMIT, RESUBMIT and WITHDRAW;
      PlatformCompliance owns START_REVIEW, REQUEST_INFO and DECIDE. DECIDE with APPROVED is the
      head of the depth-4 disclosure cascade.
    roles: [Fiduciary, PlatformCompliance]
    input: [action, "decision?", "decision_note?", "missing_items?", "remediation_note?", "withdrawal_reason?"]
    output: PlatformRequest
    success_code: 200
    side_effects:
      - "SUBMIT / RESUBMIT: opens the half-open review window [clock, clock + Platform.review_window_days)"
      - "REQUEST_INFO: clears the review window and records missing_items"
      - "RESUBMIT: increments info_cycle_count by 1 (capped at MAX_INFO_CYCLES = 3)"
      - "DECIDE APPROVED: freezes resolved_scope / resolved_basis / clamp_reason, creates an ACTIVE AuthorityGrant, disclosures every covered asset in created_at ASC order, auto-creates a PENDING CancellationOrder per newly disclosed SUBSCRIPTION asset, then recomputes Estate counters and phase"
      - "WITHDRAW: clears the review window so the slot is free again"
      - "increments the version of every mutated row by 1"
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ACTION_ROLE_MISMATCH
      - ERR_REQUEST_NOT_FOUND
      - ERR_FIDUCIARY_ESTATE_MISMATCH
      - ERR_PLATFORM_SCOPE_MISMATCH
