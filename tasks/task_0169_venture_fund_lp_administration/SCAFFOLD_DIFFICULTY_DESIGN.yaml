scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: mgmt_fee_base_vs_offset_variant
        grounds:
          - calculations.accrue_management_fee
          - entities.ManagementFeeAccrual.fields.net_fee_cents
          - entities.ManagementFeeAccrual.fields.offset_applied_cents
        distinguishing_aspect: |
          Same fund/period inputs yield net_fee_cents == gross_fee_cents under the base
          (fee_offset_pct_bps == 0) but net_fee_cents == 19315 under the fee_offset variant
          (gross 49315 minus a 30000 offset), on the ManagementFeeAccrual domain.
        test_recipe:
          setup:
            - "Two funds each with mgmt_fee_rate_bps 200; fund_off has fee_offset_pct_bps 10000, fund_base has fee_offset_pct_bps 0."
            - "Each fund has two ACTIVE commitments of 6000000 and 4000000; a 90-day period 2024-01-01..2024-03-31."
            - "fund_off additionally has a settled MANAGEMENT_FEE capital call of 30000 cents in the period."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP One", lp_type: "INSTITUTION", tax_id_last4: "1111" }
              as: FundAdministrator
              captures: { lp1_id: "$.data.id" }
            - call: "POST /limited-partners"
              payload: { legal_name: "LP Two", lp_type: "INSTITUTION", tax_id_last4: "2222" }
              as: FundAdministrator
              captures: { lp2_id: "$.data.id" }
            # ---- base fund ----
            - call: "POST /funds"
              payload: { name: "Base Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800, fee_offset_pct_bps: 0 }
              as: FundManager
              captures: { fund_base_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${fund_base_id}", lp_id: "${lp1_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { cb1_id: "$.data.id" }
            - call: "POST /commitments/${cb1_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${fund_base_id}", lp_id: "${lp2_id}", committed_cents: 4000000 }
              as: FundManager
              captures: { cb2_id: "$.data.id" }
            - call: "POST /commitments/${cb2_id}/accept"
              payload: {}
              as: FundManager
            # ---- offset fund ----
            - call: "POST /funds"
              payload: { name: "Offset Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800, fee_offset_pct_bps: 10000 }
              as: FundManager
              captures: { fund_off_id: "$.data.id", fund_off_v0: "$.data.version" }
            - call: "POST /commitments"
              payload: { fund_id: "${fund_off_id}", lp_id: "${lp1_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { co1_id: "$.data.id" }
            - call: "POST /commitments/${co1_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${fund_off_id}", lp_id: "${lp2_id}", committed_cents: 4000000 }
              as: FundManager
              captures: { co2_id: "$.data.id" }
            - call: "POST /commitments/${co2_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${fund_off_id}"
              payload: {}
              as: FundManager
              captures: { fund_off_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${fund_off_id}", purpose: "MANAGEMENT_FEE", called_amount_cents: 30000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${fund_off_v1}" }
              as: FundManager
              captures: { mf_call_id: "$.data.id" }
            - call: "GET /capital-calls/${mf_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { mf_alloc1_id: "$.data[0].id", mf_alloc1_amt: "$.data[0].allocated_amount_cents", mf_alloc2_id: "$.data[1].id", mf_alloc2_amt: "$.data[1].allocated_amount_cents" }
            - call: "POST /capital-call-allocations/${mf_alloc1_id}/fund"
              payload: { paid_amount_cents: "${mf_alloc1_amt}" }
              as: FundAdministrator
            - call: "POST /capital-call-allocations/${mf_alloc2_id}/fund"
              payload: { paid_amount_cents: "${mf_alloc2_amt}" }
              as: FundAdministrator
          trigger:
            - call: "POST /funds/${fund_base_id}/fee-accruals"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2024-03-31T00:00:00Z" }
              as: FundAdministrator
              captures: { accr_base_id: "$.data.id" }
            - call: "POST /funds/${fund_off_id}/fee-accruals"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2024-03-31T00:00:00Z" }
              as: FundAdministrator
              captures: { accr_off_id: "$.data.id" }
          assert:
            - "ManagementFeeAccrual.${accr_base_id}.gross_fee_cents == 49315"
            - "ManagementFeeAccrual.${accr_base_id}.offset_applied_cents == 0"
            - "ManagementFeeAccrual.${accr_base_id}.net_fee_cents == 49315"
            - "ManagementFeeAccrual.${accr_off_id}.gross_fee_cents == 49315"
            - "ManagementFeeAccrual.${accr_off_id}.offset_applied_cents == 30000"
            - "ManagementFeeAccrual.${accr_off_id}.net_fee_cents == 19315"

      - name: waterfall_base_vs_clawback_variant
        grounds:
          - calculations.distribution_waterfall
          - entities.DistributionEvent.fields.gp_carry_cents
          - entities.DistributionAllocation.fields.clawback_flag
        distinguishing_aspect: |
          On the DistributionEvent domain, a CAPITAL_GAIN event with cumulative LP receipts above
          the pref floor leaves gp_carry_cents == 200000 (base), whereas the clawback variant — where
          cumulative LP receipts fall below the pref floor — zeroes gp_carry_cents and sets every
          allocation's clawback_flag == true.
        test_recipe:
          setup:
            - "Fund with carry 2000 bps, pref 800 bps, vintage 2024; total_called 10000000 across two ACTIVE commitments."
            - "Capital fully returned by a prior RETURN_OF_CAPITAL distribution of 12000000 (prior_dist 12000000 > paid_in 10000000)."
            - "Investment realized with 14000000 proceeds to fund the gain distributions."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP A", lp_type: "INSTITUTION", tax_id_last4: "3333" }
              as: FundAdministrator
              captures: { lpa_id: "$.data.id" }
            - call: "POST /limited-partners"
              payload: { legal_name: "LP B", lp_type: "INSTITUTION", tax_id_last4: "4444" }
              as: FundAdministrator
              captures: { lpb_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Carry Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800, gp_catchup_rate_bps: 10000 }
              as: FundManager
              captures: { cf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${cf_id}", lp_id: "${lpa_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { cfa_id: "$.data.id" }
            - call: "POST /commitments/${cfa_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${cf_id}", lp_id: "${lpb_id}", committed_cents: 4000000 }
              as: FundManager
              captures: { cfb_id: "$.data.id" }
            - call: "POST /commitments/${cfb_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${cf_id}"
              payload: {}
              as: FundManager
              captures: { cf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${cf_id}", purpose: "INVESTMENT", called_amount_cents: 10000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${cf_v1}" }
              as: FundManager
              captures: { cf_call_id: "$.data.id" }
            - call: "GET /capital-calls/${cf_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { cfca1_id: "$.data[0].id", cfca1_amt: "$.data[0].allocated_amount_cents", cfca2_id: "$.data[1].id", cfca2_amt: "$.data[1].allocated_amount_cents" }
            - call: "POST /capital-call-allocations/${cfca1_id}/fund"
              payload: { paid_amount_cents: "${cfca1_amt}" }
              as: FundAdministrator
            - call: "POST /capital-call-allocations/${cfca2_id}/fund"
              payload: { paid_amount_cents: "${cfca2_amt}" }
              as: FundAdministrator
            - call: "POST /portfolio-companies"
              payload: { name: "Acme", sector: "SaaS" }
              as: FundManager
              captures: { pc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${cf_id}", portfolio_company_id: "${pc_id}", cost_basis_cents: 10000000, ownership_pct_bps: 1500 }
              as: FundManager
              captures: { inv_id: "$.data.id" }
            - call: "POST /investments/${inv_id}/realize"
              payload: { realized_proceeds_cents: 14000000 }
              as: FundManager
            - call: "GET /funds/${cf_id}"
              payload: {}
              as: FundManager
              captures: { cf_v2: "$.data.version" }
            - call: "POST /distribution-events"
              payload: { fund_id: "${cf_id}", source_investment_id: "${inv_id}", gross_amount_cents: 12000000, distribution_type: "RETURN_OF_CAPITAL", expected_fund_version: "${cf_v2}" }
              as: FundManager
              captures: { roc_evt_id: "$.data.id" }
            - call: "POST /distribution-events/${roc_evt_id}/pay"
              payload: {}
              as: FundAdministrator
          trigger:
            - call: "GET /funds/${cf_id}"
              payload: {}
              as: FundManager
              captures: { cf_v3: "$.data.version" }
            - call: "POST /distribution-events"
              payload: { fund_id: "${cf_id}", source_investment_id: "${inv_id}", gross_amount_cents: 1000000, distribution_type: "CAPITAL_GAIN", expected_fund_version: "${cf_v3}" }
              as: FundManager
              captures: { gain_evt_id: "$.data.id" }
          assert:
            - "DistributionEvent.${gain_evt_id}.gp_carry_cents == 200000"
            - "DistributionEvent.${gain_evt_id}.lp_share_cents == 800000"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_tiered_nonlinear_min_max
        grounds:
          - calculations.distribution_waterfall
          - entities.DistributionEvent.fields.lp_share_cents
          - entities.DistributionEvent.fields.gp_carry_cents
        distinguishing_aspect: |
          Mode (a): a 4-tier waterfall with >3 inputs (paid_in, prior_dist, pref_accrued, carry,
          gp_catchup) and nested min/max per tier; a 15000000 gross splits to lp_share 14000000 and
          gp_carry 1000000 only when every tier's min/max interaction is correct.
        test_recipe:
          setup:
            - "Fund carry 2000 bps, pref 800 bps, catchup 10000 bps, vintage 2023 (event dated 2025, pref_years 2)."
            - "total_called 10000000 across two ACTIVE commitments; investment realized with 15000000 proceeds; no prior distribution."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP C", lp_type: "INSTITUTION", tax_id_last4: "5555" }
              as: FundAdministrator
              captures: { lpc_id: "$.data.id" }
            - call: "POST /limited-partners"
              payload: { legal_name: "LP D", lp_type: "INSTITUTION", tax_id_last4: "6666" }
              as: FundAdministrator
              captures: { lpd_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Waterfall Fund", vintage_year: 2023, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800, gp_catchup_rate_bps: 10000 }
              as: FundManager
              captures: { wf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${wf_id}", lp_id: "${lpc_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { wfa_id: "$.data.id" }
            - call: "POST /commitments/${wfa_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${wf_id}", lp_id: "${lpd_id}", committed_cents: 4000000 }
              as: FundManager
              captures: { wfb_id: "$.data.id" }
            - call: "POST /commitments/${wfb_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${wf_id}"
              payload: {}
              as: FundManager
              captures: { wf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${wf_id}", purpose: "INVESTMENT", called_amount_cents: 10000000, due_date: "2025-02-01T00:00:00Z", expected_fund_version: "${wf_v1}" }
              as: FundManager
              captures: { wf_call_id: "$.data.id" }
            - call: "GET /capital-calls/${wf_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { wfa1_id: "$.data[0].id", wfa1_amt: "$.data[0].allocated_amount_cents", wfa2_id: "$.data[1].id", wfa2_amt: "$.data[1].allocated_amount_cents" }
            - call: "POST /capital-call-allocations/${wfa1_id}/fund"
              payload: { paid_amount_cents: "${wfa1_amt}" }
              as: FundAdministrator
            - call: "POST /capital-call-allocations/${wfa2_id}/fund"
              payload: { paid_amount_cents: "${wfa2_amt}" }
              as: FundAdministrator
            - call: "POST /portfolio-companies"
              payload: { name: "Beta", sector: "Fintech" }
              as: FundManager
              captures: { wfpc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${wf_id}", portfolio_company_id: "${wfpc_id}", cost_basis_cents: 10000000, ownership_pct_bps: 2000 }
              as: FundManager
              captures: { wfinv_id: "$.data.id" }
            - call: "POST /investments/${wfinv_id}/realize"
              payload: { realized_proceeds_cents: 15000000 }
              as: FundManager
          trigger:
            - call: "GET /funds/${wf_id}"
              payload: {}
              as: FundManager
              captures: { wf_v2: "$.data.version" }
            - call: "POST /distribution-events"
              payload: { fund_id: "${wf_id}", source_investment_id: "${wfinv_id}", gross_amount_cents: 15000000, distribution_type: "CAPITAL_GAIN", expected_fund_version: "${wf_v2}" }
              as: FundManager
              captures: { wf_evt_id: "$.data.id" }
          assert:
            - "DistributionEvent.${wf_evt_id}.lp_share_cents == 14000000"
            - "DistributionEvent.${wf_evt_id}.gp_carry_cents == 1000000"

      - name: mgmt_fee_round_per_commitment_then_sum
        grounds:
          - calculations.accrue_management_fee
          - entities.ManagementFeeAccrual.fields.gross_fee_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to round-per-commitment-then-sum; with committed
          1000000 and 2000099 at 200 bps over 90 days, per-commitment rounding yields gross_fee_cents
          == 14796, whereas sum-then-round would yield 14795 — the scaffold's pinned order makes 14796 correct.
        test_recipe:
          setup:
            - "Fund mgmt_fee_rate_bps 200, fee_offset_pct_bps 0; two ACTIVE commitments of 1000000 and 2000099."
            - "Fee period 2024-01-01..2024-03-31 (90 days)."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP E", lp_type: "INSTITUTION", tax_id_last4: "7777" }
              as: FundAdministrator
              captures: { lpe_id: "$.data.id" }
            - call: "POST /limited-partners"
              payload: { legal_name: "LP F", lp_type: "INSTITUTION", tax_id_last4: "8888" }
              as: FundAdministrator
              captures: { lpf_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Round Fund", vintage_year: 2024, target_size_cents: 4000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800, fee_offset_pct_bps: 0 }
              as: FundManager
              captures: { rf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${rf_id}", lp_id: "${lpe_id}", committed_cents: 1000000 }
              as: FundManager
              captures: { rfa_id: "$.data.id" }
            - call: "POST /commitments/${rfa_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${rf_id}", lp_id: "${lpf_id}", committed_cents: 2000099 }
              as: FundManager
              captures: { rfb_id: "$.data.id" }
            - call: "POST /commitments/${rfb_id}/accept"
              payload: {}
              as: FundManager
          trigger:
            - call: "POST /funds/${rf_id}/fee-accruals"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2024-03-31T00:00:00Z" }
              as: FundAdministrator
              captures: { rf_accr_id: "$.data.id" }
          assert:
            - "ManagementFeeAccrual.${rf_accr_id}.gross_fee_cents == 14796"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: capital_call_branches_to_partially_defaulted
        grounds:
          - state_machines.CapitalCall.ISSUED_to_PARTIALLY_DEFAULTED
          - state_machines.CapitalCall.ISSUED_to_SETTLED
          - state_machines.CapitalCall.ISSUED_to_CANCELLED
        distinguishing_aspect: |
          CapitalCall is a branching machine: from ISSUED the same entity can diverge to
          PARTIALLY_DEFAULTED (one allocation defaulted, another still fundable) with a distinct
          side-effect set (LP strike count bumped) versus SETTLED — this is fork divergence, not a linear pipeline.
        test_recipe:
          setup:
            - "Fund INVESTING with two ACTIVE commitments; an ISSUED capital call split across both, both allocations PENDING."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP G", lp_type: "INSTITUTION", tax_id_last4: "9001" }
              as: FundAdministrator
              captures: { lpg_id: "$.data.id" }
            - call: "POST /limited-partners"
              payload: { legal_name: "LP H", lp_type: "INSTITUTION", tax_id_last4: "9002" }
              as: FundAdministrator
              captures: { lph_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Branch Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { bf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${bf_id}", lp_id: "${lpg_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { bfa_id: "$.data.id" }
            - call: "POST /commitments/${bfa_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${bf_id}", lp_id: "${lph_id}", committed_cents: 4000000 }
              as: FundManager
              captures: { bfb_id: "$.data.id" }
            - call: "POST /commitments/${bfb_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /funds/${bf_id}/activate"
              payload: {}
              as: FundManager
            - call: "GET /funds/${bf_id}"
              payload: {}
              as: FundManager
              captures: { bf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${bf_id}", purpose: "INVESTMENT", called_amount_cents: 1000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${bf_v1}" }
              as: FundManager
              captures: { bf_call_id: "$.data.id" }
            - call: "GET /capital-calls/${bf_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { bfal1_id: "$.data[0].id", bfal2_id: "$.data[1].id" }
          trigger:
            - call: "POST /capital-call-allocations/${bfal1_id}/default"
              payload: {}
              as: FundAdministrator
              captures: { bf_call_status_via: "$.data.id" }
            - call: "GET /capital-calls/${bf_call_id}"
              payload: {}
              as: FundManager
              captures: { bf_final_status: "$.data.status" }
          assert:
            - "CapitalCall.${bf_call_id}.status == PARTIALLY_DEFAULTED"
            - "CapitalCallAllocation.${bfal1_id}.status == DEFAULTED"
            - "CapitalCallAllocation.${bfal2_id}.status == PENDING"

      - name: distribution_cyclic_recall_recycling
        grounds:
          - state_machines.DistributionEvent.PAID_to_RECALLED
          - entities.DistributionEvent.fields.recycled_amount_cents
          - entities.Commitment.fields.drawn_cents
        distinguishing_aspect: |
          DistributionEvent is cyclic: a PAID recyclable event loops back to RECALLED, restoring
          drawn_cents on commitments (re-arming unfunded capacity) — a back-edge to the callable pool,
          on a different entity than the CapitalCall branch instance.
        test_recipe:
          setup:
            - "Fund with recycling_cap_pct_bps 12000; two commitments drawn 6000000 and 4000000."
            - "A PAID recyclable distribution of lp_share 3000000 with allocations 1800000 (C1) and 1200000 (C2)."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP I", lp_type: "INSTITUTION", tax_id_last4: "9003" }
              as: FundAdministrator
              captures: { lpi_id: "$.data.id" }
            - call: "POST /limited-partners"
              payload: { legal_name: "LP J", lp_type: "INSTITUTION", tax_id_last4: "9004" }
              as: FundAdministrator
              captures: { lpj_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Recycle Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800, recycling_cap_pct_bps: 12000 }
              as: FundManager
              captures: { rcf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${rcf_id}", lp_id: "${lpi_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { rca_id: "$.data.id" }
            - call: "POST /commitments/${rca_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${rcf_id}", lp_id: "${lpj_id}", committed_cents: 4000000 }
              as: FundManager
              captures: { rcb_id: "$.data.id" }
            - call: "POST /commitments/${rcb_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${rcf_id}"
              payload: {}
              as: FundManager
              captures: { rcf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${rcf_id}", purpose: "INVESTMENT", called_amount_cents: 10000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${rcf_v1}" }
              as: FundManager
              captures: { rc_call_id: "$.data.id" }
            - call: "GET /capital-calls/${rc_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { rcal1_id: "$.data[0].id", rcal1_amt: "$.data[0].allocated_amount_cents", rcal2_id: "$.data[1].id", rcal2_amt: "$.data[1].allocated_amount_cents" }
