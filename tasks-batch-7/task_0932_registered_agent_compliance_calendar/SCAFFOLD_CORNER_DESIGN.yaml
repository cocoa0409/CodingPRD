  - section: validations
    instances:
      - name: corner_duplicate_obligation_for_same_period_returns_conflict
        claim_type: Violation to Error
        grounds:
          - validations[priority=21]
          - errors[ERR_DUPLICATE_OBLIGATION]
        distinguishing_aspect: "A second ANNUAL_REPORT 2027 obligation on the same registration returns 409 ERR_DUPLICATE_OBLIGATION and leaves exactly one row."
        test_recipe:
          setup:
            - "A DE StateRule; one client, one DE entity, one PENDING DE registration with one ANNUAL_REPORT 2027 obligation."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "ANNUAL_REPORT", period_year: 2027 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /registrations/${reg_id}/compliance-obligations"
              payload: { obligation_type: "ANNUAL_REPORT", period_year: 2027 }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 409 with error_id 'ERR_DUPLICATE_OBLIGATION'"
            - "GET /compliance-obligations with registration_id=${reg_id} returns exactly 1 row"

      - name: corner_no_effective_state_rule_blocks_home_registration
        claim_type: Violation to Error
        grounds:
          - validations[priority=18]
          - errors[ERR_NO_EFFECTIVE_STATE_RULE]
          - calculations.governing_state_rule_selection
        distinguishing_aspect: "Creating a HOME registration in WY, for which no StateRule row exists, returns 422 ERR_NO_EFFECTIVE_STATE_RULE."
        test_recipe:
          setup:
            - "Only a DE StateRule exists; the entity's home state is WY."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "High Plains Widgets LLC", entity_type: "LLC", home_state_code: "WY", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
          trigger:
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 422 with error_id 'ERR_NO_EFFECTIVE_STATE_RULE'"
            - "GET /registrations with legal_entity_id=${ent_id} returns 0 rows"

      - name: corner_clock_regression_is_refused
        claim_type: Violation to Error
        grounds:
          - validations[priority=17]
          - errors[ERR_CLOCK_REGRESSION]
        distinguishing_aspect: "Setting the logical clock to 2026-05-01T00:00:00Z after it has already reached 2026-06-01T00:00:00Z returns 409 ERR_CLOCK_REGRESSION and leaves the clock where it was."
        test_recipe:
          setup:
            - "The logical clock has been moved forward to 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 409 with error_id 'ERR_CLOCK_REGRESSION'"
            - "A subsequent POST /_clock/set_current_utc to 2026-06-01T00:00:00Z succeeds, proving equality is accepted while regression is not"

      - name: corner_name_conflict_blocks_qualification_until_a_fallback_exists
        claim_type: Conditional validation
        grounds:
          - validations[priority=25]
          - errors[ERR_NAME_CONFLICT_UNRESOLVED]
          - calculations.governing_state_rule_selection
          - entities.NameClearance.fields.resolved_name
          - entities.Registration.fields.assumed_name
        distinguishing_aspect: "A CONFLICT clearance with no fallback_assumed_name blocks foreign qualification with 409 ERR_NAME_CONFLICT_UNRESOLVED, while a CONFLICT clearance carrying fallback_assumed_name 'Northwind Widgets of Texas' qualifies and copies that name into Registration.assumed_name."
        test_recipe:
          setup:
            - "DE and TX StateRules effective 2026-01-01."
            - "One client, one DE entity with an ACTIVE DE home registration and a certificate issued 2026-04-20."
            - "Two TX NameClearances: one without a fallback and one with fallback_assumed_name, both recorded CONFLICT."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /state-rules"
              payload: { state_code: "TX", effective_from: "2026-01-01", annual_report_basis: "FISCAL_YEAR_END_OFFSET", fiscal_offset_days: 135, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, good_standing_freshness_days: 30, foreign_qualification_fee_cents: 75000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { appt_id: $.data.id }
            - call: "POST /agent-appointments/${appt_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/good-standing-certificates"
              payload: { issued_on: "2026-04-20", certificate_number: "DE-GS-77120" }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/name-clearances"
              payload: { state_code: "TX", requested_name: "Northwind Widgets LLC" }
              as: ComplianceOfficer
              captures: { nc_bare_id: $.data.id }
            - call: "POST /name-clearances/${nc_bare_id}/record-result"
              payload: { result: "CONFLICT", conflicting_name: "Northwind Widgets Inc" }
              as: FilingAgent
            - call: "POST /legal-entities/${ent_id}/name-clearances"
              payload: { state_code: "TX", requested_name: "Northwind Widgets LLC", fallback_assumed_name: "Northwind Widgets of Texas" }
              as: ComplianceOfficer
              captures: { nc_fb_id: $.data.id }
            - call: "POST /name-clearances/${nc_fb_id}/record-result"
              payload: { result: "CONFLICT", conflicting_name: "Northwind Widgets Inc" }
              as: FilingAgent
          trigger:
            - call: "POST /legal-entities/${ent_id}/foreign-qualifications"
              payload: { state_code: "TX", name_clearance_id: "${nc_bare_id}", good_standing_certificate_id: "${cert_id}" }
              as: ComplianceOfficer
              captures: { conflict_err: $.data.error_id }
            - call: "POST /legal-entities/${ent_id}/foreign-qualifications"
              payload: { state_code: "TX", name_clearance_id: "${nc_fb_id}", good_standing_certificate_id: "${cert_id}" }
              as: ComplianceOfficer
              captures: { reg_tx_id: $.data.id }
          assert:
            - "NameClearance.${nc_bare_id}.resolved_name == null"
            - "The first qualification returns 409 with error_id 'ERR_NAME_CONFLICT_UNRESOLVED'"
            - "NameClearance.${nc_fb_id}.resolved_name == 'Northwind Widgets of Texas'"
            - "The second qualification returns 201"
            - "Registration.${reg_tx_id}.assumed_name == 'Northwind Widgets of Texas'"
            - "Registration.${reg_tx_id}.name_clearance_id == ${nc_fb_id}"
            - "GET /registrations with name_clearance_id=${nc_fb_id} returns exactly 1 row"

