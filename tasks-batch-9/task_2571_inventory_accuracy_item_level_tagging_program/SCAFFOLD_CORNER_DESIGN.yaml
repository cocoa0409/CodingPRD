# ============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 (breadth probe)
# Task 2571 — Inventory Accuracy & Item-Level Tagging Program
#
# Every `section:` value below is one of the nine sections of
# references/claim-extraction-guide.md; every `claim_type:` is one of that
# section's own table rows. Corners already asserted by an instance in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as `excluded_because:` stubs that
# name the covering §1.8 instance.
#
# Standing fixture conventions (identical to §1.8 so the two files compose):
#   logical clock default            2026-08-01T00:00:00Z
#   Category APPAREL  cadence 30, tol 2 units / 20000 cents, min_acc 97.00, uplift 750, EITHER, auto_correct true
#   Category HOME     cadence 30, tol 5 units /  6000 cents, min_acc 95.00, uplift    0, EITHER, auto_correct true
#   Category ELEC     cadence 14, tol 0 units /  4000 cents, min_acc 99.00, uplift  250, HANDHELD, auto_correct false
#   Store S100 BOTH / overhead_reader_capacity 2 ; Store S200 HANDHELD_ONLY / 0
#   Vendor VEND1 ; CounterFirm CF1 TIER_1 max_lines_per_pass 500, CF2 TIER_2 max 200
#   Item TEE-001 APPAREL 1234/2999 ; TEE-002 APPAREL 2500/4999 ; PAN-01 HOME 1500/2999
#   Item SOFA-01 HOME 5000/9999 ; TV-040 ELEC 40000/79999 ; all SGTIN_96, epc_prefix_length 7
#   Opaque user ids u_admin_1, u_analyst_1, u_analyst_2, u_super_1, u_super_2, u_ctrl_1
#   entity_backed roles pass the scoping entity id as as_user_id
# ============================================================================

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: category_create_returns_201_with_declared_fields
        claim_type: creation
        grounds:
          - entities.Category
          - endpoints.POST_/inventory-integrity/categories
        distinguishing_aspect: "A POST carrying every declared input field returns 201 and echoes all nine inputs plus the four common fields, with created_at stamped from the default logical clock 2026-08-01T00:00:00Z."
        test_recipe:
          setup:
            - "Empty database; the logical clock has never been set, so it reads 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
          assert:
            - "response status 201 and response_type == \"object\""
            - "response data.code == \"APPAREL\", data.name == \"Apparel\", data.count_cadence_days == 30"
            - "response data.variance_tolerance_units == 2, data.variance_tolerance_value_cents == 20000, data.min_accuracy_pct == 97.00"
            - "response data.landed_cost_uplift_bps == 750, data.reader_mode_required == \"EITHER\", data.auto_correct_negative == true"
            - "response data.id is a non-empty string, data.version == 1, data.created_at == \"2026-08-01T00:00:00Z\" and data.updated_at == \"2026-08-01T00:00:00Z\""
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: category_get_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/inventory-integrity/categories/{category_id}
        distinguishing_aspect: "GET /categories/{id} returns the row exactly as stored by the create call — same id, same nine field values, version still 1."
        test_recipe:
          setup:
            - "One Category APPAREL created with the standing fixture values."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
          trigger:
            - call: "GET /inventory-integrity/categories/${cat_apparel}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 200"
            - "response data.id == ${cat_apparel} and data.code == \"APPAREL\""
            - "response data.min_accuracy_pct == 97.00 and data.landed_cost_uplift_bps == 750"
            - "response data.version == 1 — a read never bumps the version"

      - name: categories_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/inventory-integrity/categories
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three categories stored, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 / offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Three categories exist: APPAREL, HOME and ELEC, created in that order."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
            - call: "POST /inventory-integrity/categories"
              payload: { code: "HOME", name: "Home", count_cadence_days: 30, variance_tolerance_units: 5, variance_tolerance_value_cents: 6000, min_accuracy_pct: 95.00, landed_cost_uplift_bps: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
            - call: "POST /inventory-integrity/categories"
              payload: { code: "ELEC", name: "Electronics", count_cadence_days: 14, variance_tolerance_units: 0, variance_tolerance_value_cents: 4000, min_accuracy_pct: 99.00, landed_cost_uplift_bps: 250, reader_mode_required: "HANDHELD", auto_correct_negative: false }
              as: SystemAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "GET /inventory-integrity/categories"
              payload: { limit: 2, offset: 0 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 200 and response_type == \"array\""
            - "the returned collection holds exactly 2 rows"
            - "the envelope reports limit 2, offset 0, total_count 3 and has_more true"
            - "a follow-up GET /inventory-integrity/categories with limit 2 and offset 2 returns exactly 1 row, total_count 3 and has_more false"
            - "a follow-up GET /inventory-integrity/categories with no limit or offset returns all 3 rows with limit 10 and offset 0 applied as declared defaults"

      - name: store_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STORE_NOT_FOUND]
          - validations.priority_10_path_id_existence
        distinguishing_aspect: "A GET against a well-formed but unknown store id returns ERR_STORE_NOT_FOUND with HTTP 404 and the error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database; no Store rows at all."
          setup_api_calls: []
          trigger:
            - call: "GET /inventory-integrity/stores/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 404"
            - "response_type == \"error\" and data.error_id == \"ERR_STORE_NOT_FOUND\""
            - "data.message is a non-empty string"

      - name: item_create_missing_unit_cost_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_20_ERR_INVALID_REQUEST
          - entities.Item.fields.unit_cost_cents
        distinguishing_aspect: "unit_cost_cents is source input with no default, so omitting it returns ERR_INVALID_REQUEST (422) and no Item row is created."
        test_recipe:
          setup:
            - "Category APPAREL and Vendor VEND1 exist so the two body FKs resolve and priority 12 cannot pre-empt priority 20."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 422 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /inventory-integrity/items returns total_count 0 — the rejected request created nothing"

      - name: category_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Category.fields.landed_cost_uplift_bps
          - entities.Category.fields.reader_mode_required
          - entities.Category.fields.auto_correct_negative
        distinguishing_aspect: "Omitting the three optional Category inputs yields exactly landed_cost_uplift_bps 0, reader_mode_required EITHER and auto_correct_negative true."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "GROCERY", name: "Grocery", count_cadence_days: 21, variance_tolerance_units: 4, variance_tolerance_value_cents: 8000, min_accuracy_pct: 96.50 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
          assert:
            - "response status 201"
            - "response data.landed_cost_uplift_bps == 0"
            - "response data.reader_mode_required == \"EITHER\""
            - "response data.auto_correct_negative == true"
            - "response data.min_accuracy_pct == 96.50 — the two-decimal input is preserved exactly"

      - name: physical_inventory_recount_threshold_defaults_to_one_fifty
        claim_type: defaults
        grounds:
          - entities.PhysicalInventory.fields.recount_threshold_bps
          - endpoints.POST_/inventory-integrity/physical-inventories
        distinguishing_aspect: "Omitting recount_threshold_bps on a physical-inventory create yields exactly 150 bps, the §1.1 default, and never 100."
        test_recipe:
          setup:
            - "Store S100 and CounterFirm CF1 exist; no other PhysicalInventory rows, so the blackout check cannot fire."
          setup_api_calls:
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF1", name: "Counter Firm One", certification_level: "TIER_1", max_lines_per_pass: 500 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cf1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/physical-inventories"
              payload: { store_id: "${store_s100}", counter_firm_id: "${cf1}", scheduled_start_date: "2026-09-10", scheduled_end_date: "2026-09-12" }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
          assert:
            - "response status 201 and data.recount_threshold_bps == 150"
            - "response data.status == \"PLANNED\", data.recount_round == 0, data.line_count == 0"
            - "response data.book_value_cents == 0, data.counted_value_cents == 0, data.net_variance_cents == 0, data.net_variance_bps == 0"
            - "response data.certified_at is null"

      - name: vendor_computed_ledger_starts_at_declared_defaults
        claim_type: computed_fields
        grounds:
          - entities.Vendor.fields.tag_compliance_score_bps
          - entities.Vendor.fields.required_verification_sample_pct
          - entities.Vendor.fields.chargeback_balance_cents
        distinguishing_aspect: "A freshly created Vendor reads tag_compliance_score_bps 10000, required_verification_sample_pct 5 and all four money/count legs 0, none of which are settable inputs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
          assert:
            - "response status 201 and data.tag_compliance_score_bps == 10000"
            - "response data.required_verification_sample_pct == 5"
            - "response data.shortage_event_count == 0, data.lifetime_chargeback_gross_cents == 0, data.credited_cents == 0, data.chargeback_balance_cents == 0"
            - "GET /inventory-integrity/vendors/${vendor1} agrees on all six computed fields"

      - name: stock_position_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.StockPosition.fields.on_hand_units
          - entities.StockPosition.fields.promising_state
          - entities.StockPosition.fields.unit_accuracy_pct
        distinguishing_aspect: "on_hand_units, promising_state and both accuracy fields are source computed: values supplied for them in the create body are ignored and the server derives on_hand_units 7 from baseline_on_hand_units alone."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1 and Item TEE-001 exist."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 7, reserved_units: 0, on_hand_units: 999, promising_state: "BLOCKED", phantom_units: 4 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { pos_tee1: "$.data.id" }
          assert:
            - "response status 201 — the three computed keys in the body are ignored, not rejected"
            - "response data.on_hand_units == 7 (baseline 7 + no posted adjustments), NOT 999"
            - "response data.phantom_units == 0, NOT 4"
            - "response data.promising_state == \"PROMISABLE\", NOT \"BLOCKED\""
            - "response data.unit_accuracy_pct == 100.00 and data.value_accuracy_pct == 100.00 — never counted, so treated as perfectly accurate"
            - "response data.book_value_cents == 8638 (7 * 1234), data.tag_integrity_hold == false, data.negative_correction_count == 0"

      - name: item_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Item
          - response_envelope.success
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: values supplied for them are ignored and created_at comes from the logical clock, which the test moves to 2026-08-05T00:00:00Z first."
        test_recipe:
          setup:
            - "Category APPAREL and Vendor VEND1 exist; the logical clock is moved to 2026-08-05T00:00:00Z before the item is created."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", id: "client-supplied-id", created_at: "2020-01-01T00:00:00Z", version: 99 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
          assert:
            - "response status 201"
            - "response data.id != \"client-supplied-id\""
            - "response data.created_at == \"2026-08-05T00:00:00Z\" and data.updated_at == \"2026-08-05T00:00:00Z\", NOT \"2020-01-01T00:00:00Z\""
            - "response data.version == 1, NOT 99"
            - "response data.epc_prefix_length == 7 and data.tag_required == true — the two omitted optional inputs take their declared defaults"

      - name: counter_firm_is_immutable_with_no_version_or_update_path
        claim_type: immutability
        grounds:
          - entities.CounterFirm
          - endpoints.GET_/inventory-integrity/counter-firms/{counter_firm_id}
        distinguishing_aspect: "CounterFirm declares common_fields false, so its read exposes id and created_at but no version or updated_at, and §1.5 offers no PUT, PATCH or DELETE for the collection."
        test_recipe:
          setup:
            - "One CounterFirm CF1 with certification_level TIER_1 and max_lines_per_pass 500."
          setup_api_calls:
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF1", name: "Counter Firm One", certification_level: "TIER_1", max_lines_per_pass: 500 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cf1: "$.data.id" }
          trigger:
            - call: "GET /inventory-integrity/counter-firms/${cf1}"
              payload: {}
              as: ShrinkController
              as_user_id: "u_ctrl_1"
          assert:
            - "response status 200 and data.id == ${cf1}"
            - "response data.code == \"CF1\", data.certification_level == \"TIER_1\", data.max_lines_per_pass == 500"
            - "response data contains no `version` key and no `updated_at` key"
            - "§1.5 declares no PUT, PATCH or DELETE on /inventory-integrity/counter-firms or /inventory-integrity/counter-firms/{counter_firm_id}, so the row can never be mutated after creation"

      - name: item_create_with_unknown_category_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_12_body_fk_existence
          - errors[ERR_CATEGORY_NOT_FOUND]
        distinguishing_aspect: "A body FK that does not resolve returns ERR_CATEGORY_NOT_FOUND (404) at priority 12, validated in the endpoint's declared input order so category_id is reported before primary_vendor_id."
        test_recipe:
          setup:
            - "Vendor VEND1 exists; NO Category rows exist at all."
          setup_api_calls:
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "00000000-0000-0000-0000-0000000000aa", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 404 and data.error_id == \"ERR_CATEGORY_NOT_FOUND\""
            - "a second attempt with a resolving category_id but an unknown primary_vendor_id returns ERR_VENDOR_NOT_FOUND (404)"
            - "GET /inventory-integrity/items returns total_count 0"

      - name: store_create_with_bad_reader_capability_returns_invalid_enum_value
        claim_type: type_constraints
        grounds:
          - validations.priority_22_ERR_INVALID_ENUM_VALUE
          - entities.Store.fields.reader_capability
        distinguishing_aspect: "reader_capability accepts only HANDHELD_ONLY, OVERHEAD_ONLY and BOTH, so \"RFID_ONLY\" returns ERR_INVALID_ENUM_VALUE (422) at priority 22, after the required-field check at 20 has passed."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "RFID_ONLY", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 422 and data.error_id == \"ERR_INVALID_ENUM_VALUE\""
            - "GET /inventory-integrity/stores returns total_count 0"

      - name: stock_position_negative_reserved_units_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_20_ERR_INVALID_REQUEST
          - entities.StockPosition.fields.reserved_units
        distinguishing_aspect: "reserved_units carries the §1.1 range constraint >= 0, so -1 fails the priority 20 numeric-range branch with ERR_INVALID_REQUEST (422) rather than any state or duplicate rule."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1 and Item TEE-001 exist; no StockPosition rows, so the duplicate rule at priority 76 cannot fire."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/stock-positions"
