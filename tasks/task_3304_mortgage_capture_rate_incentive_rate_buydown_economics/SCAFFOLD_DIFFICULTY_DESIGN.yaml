              as: SalesCounselor
              captures: { e_susp: $.data.error_id }
          assert:
            - "the allocation is rejected with http 403 and error_id ERR_COMMUNITY_SUSPENDED"
            - "Community.${cm1}.program_status == SUSPENDED"
            - "ABADisclosure.${d1}.disclosure_status == CURING"
            - "HomeSaleContract.${ct1}.contract_status == LOCKED, so the contract's own state was never the blocker"
            - "ecactly zero IncentiveAllocation rows exist for HomeSaleContract.${ct1}"

  - rule_id: resource_temporal_overlap
    instances:
      - name: forward_commitment_closed_open_window_adjacency_allowed
        grounds:
          - validations[priority=16]
          - errors[ERR_COMMITMENT_WINDOW_OVERLAP]
          - entities.ForwardCommitment.fields.commitment_start_iso
          - entities.ForwardCommitment.fields.commitment_end_iso
          - endpoints.POST /housing/communities/{communityId}/forward-commitments
        distinguishing_aspect: |
          Interval semantics are closed-open: a second commitment starting at exactly the first
          commitment's end instant is admitted with gap 0, while a third commitment starting
          anywhere strictly inside that second window is rejected, so adjacency is legal and
          true overlap is not.
        test_recipe:
          setup:
            - "community cm1 with no commitments yet"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
          trigger:
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC1", investor_name: "Fannie", committed_rate_bps: 499, committed_units: 10, commitment_start_iso: "2026-09-01T00:00:00Z", commitment_end_iso: "2027-01-01T00:00:00Z" }
              as: MortgageBanker
              captures: { fc1: $.data.id }
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC2", investor_name: "Freddie", committed_rate_bps: 512, committed_units: 8, commitment_start_iso: "2027-01-01T00:00:00Z", commitment_end_iso: "2028-01-01T00:00:00Z" }
              as: MortgageBanker
              captures: { fc2: $.data.id, fc2_status: $.data.commitment_status }
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC3", investor_name: "Ginnie", committed_rate_bps: 505, committed_units: 4, commitment_start_iso: "2027-06-01T00:00:00Z", commitment_end_iso: "2028-06-01T00:00:00Z" }
              as: MortgageBanker
              captures: { e_overlap: $.data.error_id }
          assert:
            - "FC2 is created with commitment_status OPEN although its start equals FC1's end exactly (closed-open adjacency, gap 0)"
            - "FC3 is rejected with http 409 and error_id ERR_COMMITMENT_WINDOW_OVERLAP because 2027-06-01 lies strictly inside FC2's half-open window"
            - "exactly two ForwardCommitment rows exist for Community.${cm1}, FC1 and FC2"
            - "Community.${cm1}.forward_units_committed == 18"

      - name: rate_lock_closed_interval_pool_capacity_on_commitment
        grounds:
          - validations[priority=17]
          - errors[ERR_LOCK_WINDOW_OVERLAP]
          - entities.ForwardCommitment.fields.units_available
          - entities.RateLock.fields.lock_start_iso
          - entities.RateLock.fields.lock_expires_iso
          - state_machines.RateLock.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Interval semantics are closed-interval pool capacity rather than bare adjacency: two
          locks over the same instant are admitted up to the commitment's units_available, so a
          second lock on a one-unit commitment is rejected even though the two locks sit on
          different applications and different contracts.
        test_recipe:
          setup:
            - "commitment fc1 with exactly one unit, two contracts and two qualified applications on the same community"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
