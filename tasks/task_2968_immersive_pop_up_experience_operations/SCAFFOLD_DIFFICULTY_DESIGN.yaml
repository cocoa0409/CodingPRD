      - name: run_creation_blocked_by_the_kit_already_deployed_elsewhere
        grounds:
          - state_machines.BuildKit.READY_to_DEPLOYED
          - validations[priority 80].ERR_KIT_NOT_READY
          - endpoints[POST /experience-runs]
          - endpoints[POST /build-kits]
        distinguishing_aspect: |
          Entity pair ExperienceRun -> BuildKit, which is the reverse direction of the usual gate: the
          blocking state was created as a SIDE EFFECT of an earlier run creation (READY -> DEPLOYED), so
          the second run's create fails on a state no caller ever set explicitly. The build kit is the
          shared physical asset of the tour-city model, and the refusal is what stops one kit from being
          booked into two cities at once. Introducing a second READY kit — changing nothing about the
          venue, the licence or the dates — makes the identical run payload succeed.
        test_recipe:
          setup:
            - "One LEASE_ACTIVE NYC venue and one ACTIVE licence for territory [NYC]."
            - "One BuildKit KIT-P7B-001 created READY / LOCALIZED with condition_score 100.00."
            - "One PLANNED run using that kit, which moved the kit READY -> DEPLOYED as a side effect."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P7B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_first: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_first}", run_name: "Neon Atrium NYC autumn", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_first: $.data.id }
          trigger:
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_first}", run_name: "Neon Atrium NYC winter", scheduled_open_date: "2026-11-01", scheduled_close_date: "2026-12-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P7B-002", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_second: $.data.id }
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_second}", run_name: "Neon Atrium NYC winter", scheduled_open_date: "2026-11-01", scheduled_close_date: "2026-12-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_second: $.data.id }
          assert:
            - "BuildKit.${kit_first}.status == DEPLOYED after the setup, set purely as a side effect of creating ${run_first}"
            - "the winter run create against ${kit_first} responds 409 with data.error_id == ERR_KIT_NOT_READY"
            - "the refusal is inert: GET /experience-runs?build_kit_id=${kit_first} returns exactly one row (${run_first}) and BuildKit.${kit_first}.version is unchanged"
            - "the new kit is created READY: BuildKit.${kit_second}.status == READY, localization_status == LOCALIZED, condition_score == 100.00, reuse_cycle_count == 0"
            - "the identical run payload against ${kit_second} responds 201: ExperienceRun.${run_second}.run_status == PLANNED, clearance_status == UNCLEARED and build_kit_id == ${kit_second}"
            - "BuildKit.${kit_second}.status == DEPLOYED after the accepted create, and BuildKit.${kit_first}.status is still DEPLOYED"

      - name: shift_scheduling_blocked_by_the_members_clearance_state
        grounds:
          - state_machines.StaffMember.TRAINING_to_CLEARED
          - state_machines.StaffMember.CLEARED_to_SUSPENDED
          - validations[priority 80].ERR_STAFF_NOT_CLEARED
          - endpoints[POST /staff-shifts]
          - endpoints[POST /staff-members/{staffId}/status-decisions]
        distinguishing_aspect: |
          Entity pair StaffShift -> StaffMember, and the only one of the three where the dependency is
          re-tested in both directions along a five-step state walk: CANDIDATE refuses, TRAINING still
          refuses, CLEARED admits, SUSPENDED refuses again AND retroactively cancels the shift that was
          already scheduled, and REINSTATE admits the very same window again — which is only possible
          because a CANCELLED shift no longer occupies the rest buffer. The child entity therefore both
          reads and is rewritten by the parent's state.
