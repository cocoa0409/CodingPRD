              as: ElectionClerk
              captures: { vid: $.data.id }
            - call: "POST /plans/${pid}/hearings"
              payload: { venue_id: "${vid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: CommissionChair
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: CommissionChair
            - call: "POST /hearings/${h1}/hold"
              payload: {}
              as: CommissionChair
          trigger:
            - call: "POST /plans/${pid}/adopt"
              payload: {}
              as: CommissionChair
              as_user_id: "u_cart"
          assert: ["response error_id == ERR_SEGREGATION_OF_DUTIES"]

      - name: demographer_cannot_submit_comment
        claim_type: role denial
        grounds:
          - 'roles.PublicParticipant'
