            - { call: "POST /spd/tray-templates", payload: { code: "CARD-02", name: "Cardiac Valve", specialty: "CARD", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 20 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
