            - { call: "POST /servicing/error-cases/${case_id}/acknowledge", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/error-cases/${case_id}/assign", payload: { assigned_to_user_id: "ea_9" }, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: Borrower, as_user_id: "${loan_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /servicing/error-cases/${case_id}/resolve", payload: { outcome: "NO_ERROR" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { err2: $.data.error_id } }
            - { call: "POST /servicing/payees", payload: { payee_type: "INSURANCE_CARRIER", legal_name: "Verifier Created", remit_to_address: "3 Try Ln", ach_routing_mask: "****6666" }, as: PayeeVerifier, as_user_id: "pv_1", captures: { err3: $.data.error_id } }
          assert:
