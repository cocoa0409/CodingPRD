              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { cnt_0: $.data.open_gap_count }
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id }
            - call: "POST /population-health/care-gaps/${gap_id}/gap-closure-evidence"
              payload: { evidence_type: "CLAIMS_FEED", service_date: "2026-04-15T00:00:00Z", document_uri: "s3://e.pdf" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { ev: $.data.id }
            - call: "POST /population-health/gap-closure-evidence/${ev}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_1"
            - call: "GET /population-health/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { cnt_1: $.data.open_gap_count }
          trigger:
            - call: "POST /population-health/care-gaps/${gap_id}/reopen"
              payload: { reason: "claims mismatch" }
              as: DataReconciliationBot
            - call: "GET /population-health/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { cnt_2: $.data.open_gap_count }
          assert:
            - "${cnt_0} == 1"
            - "${cnt_1} == 0"
            - "${cnt_2} == 1"

