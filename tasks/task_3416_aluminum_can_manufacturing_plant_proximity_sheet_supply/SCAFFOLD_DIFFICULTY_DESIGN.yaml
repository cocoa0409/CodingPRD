            - "GET /production-runs?line_id=${line_id}&status=SCHEDULED returns exactly 2 rows"

      - name: scrap_pickup_windows_closed_interval_touching_conflicts_and_daily_cap
        grounds:
          - validations.priority_8_business_temporal
          - errors.ERR_PICKUP_WINDOW_CONFLICT
          - errors.ERR_PICKUP_DAILY_LIMIT
        distinguishing_aspect: |
          Different interval semantics on a different resource (Customer, not
          ProductionLine): scrap pickup windows are CLOSED intervals — [10:00, 11:00]
          touching [09:00, 10:00] CONFLICTS (ERR_PICKUP_WINDOW_CONFLICT) where the line
          rule would allow it — and a third non-overlapping pickup on the same UTC day
          trips the aggregate cap of 2 (ERR_PICKUP_DAILY_LIMIT).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Plant; customer. One SCHEDULED pickup P1 [2026-09-05T09:00:00Z, 2026-09-05T10:00:00Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
