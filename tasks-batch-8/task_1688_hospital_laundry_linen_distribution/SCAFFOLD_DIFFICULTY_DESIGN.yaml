            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id, circ0: $.data.in_circulation } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [ { stock_id: "${s1}", pieces: 8 } ], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "GET /par-levels/${p1}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { hand: $.data.on_hand } }
            - { call: "GET /linen-stocks/${s1}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { circ: $.data.in_circulation, wash: $.data.in_wash } }
          assert:
            - "after r1 fill: ParLevel.on_hand was 20 and LinenStock.in_circulation was 80 (link 1)"
            - "after r2 complete: ParLevel.${p1}.on_hand == 20 (20 - 8 soiled + 8 restocked)"
            - "LinenStock.${s1}.in_circulation == 72 and in_wash == 8 (link 2, caused by the on_hand mutations)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: finalize_conflict_state_manifest_beats_fiscal_cap
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_MANIFEST_NOT_RECONCILED]
          - errors[ERR_CONTRACT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: invoice finalize over a
          RETURNED-but-unreconciled manifest whose final total (560) would also
          breach the facility cap (500) must surface ERR_MANIFEST_NOT_RECONCILED,
          never ERR_CONTRACT_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Facility WITH monthly_cap_cents = 500; unit ICU; stock S1 par 20"
            - "Manifest m1 (16.00 lbs) RETURNED with 7 pieces (final would be 560 > cap 500) but NOT reconciled"
            - "Invoice over m1 created (PROVISIONAL)"
