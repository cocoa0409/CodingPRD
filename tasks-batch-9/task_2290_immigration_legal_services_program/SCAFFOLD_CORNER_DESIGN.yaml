      - name: representative_buffer_is_taken_from_the_existing_event_and_zeroed_by_a_shared_location
        claim_type: interval_merge
        grounds:
          - calculations.calendar_conflict_scan
          - endpoints[POST /calendar-events]
          - validations[priority 30 ERR_REPRESENTATIVE_CALENDAR_CONFLICT]
        distinguishing_aspect: "The buffer applied to a candidate is BUFFER_BY_EVENT_TYPE of the EXISTING event, not of the candidate: an INDIVIDUAL_HEARING (60) blocks a BIOMETRICS (30) until existing_end + 60. The stored travel_buffer_minutes field is set from the candidate's own type and is a decoy that must not drive the scan. Geometry A is half-open, so a start exactly at existing_end + buffer is accepted, and when the two events share a location_code the buffer collapses to 0 so a start exactly at existing_end is accepted."
        test_recipe:
          setup:
            - "TEMPLATE A gives one STAFFED U_VISA matter with Ada Ortiz as ACTIVE LEAD. All candidates below pass client_conflict_waived true so that only geometry A can fire, and all are booked by ProgramDirector, whose identity is opaque and unscoped."
            - "Existing event X: INDIVIDUAL_HEARING assigned to Ada Ortiz, 2026-09-10T14:00:00.000Z to 15:00:00.000Z at location 'EOIR-ELP-CRT-1'. BUFFER_BY_EVENT_TYPE['INDIVIDUAL_HEARING'] is 60, so the blocked span for a different location ends at 16:00:00.000Z."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "INDIVIDUAL_HEARING", starts_at_utc: "2026-09-10T14:00:00.000Z", ends_at_utc: "2026-09-10T15:00:00.000Z", location_code: "EOIR-ELP-CRT-1", assigned_representative_id: "${atty_a_id}", client_conflict_waived: true }
              as: ProgramDirector
              captures: { x1: "$.data.id" }
          trigger:
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-10T15:59:59.999Z", ends_at_utc: "2026-09-10T16:30:00.000Z", location_code: "USCIS-ELP-ASC", assigned_representative_id: "${atty_a_id}", client_conflict_waived: true }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-10T16:00:00.000Z", ends_at_utc: "2026-09-10T16:30:00.000Z", location_code: "USCIS-ELP-ASC", assigned_representative_id: "${atty_a_id}", client_conflict_waived: true }
              as: ProgramDirector
              captures: { x2: "$.data.id" }
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-10T15:00:00.000Z", ends_at_utc: "2026-09-10T15:30:00.000Z", location_code: "EOIR-ELP-CRT-1", assigned_representative_id: "${atty_a_id}", client_conflict_waived: true }
              as: ProgramDirector
              captures: { x3: "$.data.id" }
          assert:
            - "trigger 1: HTTP status == 409, error_id == 'ERR_REPRESENTATIVE_CALENDAR_CONFLICT' — the 60-minute buffer of the existing INDIVIDUAL_HEARING governs, not the candidate's own 30"
            - "trigger 2: HTTP status == 201 — 16:00:00.000Z is exactly existing_end + 60 min and geometry A is half-open (candidate.starts < x_end_effective is false)"
            - "CalendarEvent.${x2}.travel_buffer_minutes == 30 — the stored field mirrors the candidate's own type and did not participate in the scan"
            - "trigger 3: HTTP status == 201 — location_code equals X's location_code, so the buffer collapses to 0 and a start exactly at existing_end is clear; against ${x2} the intervals do not overlap at all"
            - "CalendarEvent.${x3}.status == 'SCHEDULED' and reschedule_count == 0 and continued_from_event_id == null"
            - "GET /calendar-events?matter_id=${matter_id}&assigned_representative_id=${atty_a_id} returns exactly 3 rows"

      - name: client_geometry_is_fully_closed_crosses_matters_and_yields_to_the_representative_geometry
        claim_type: cross_entity_validation
        grounds:
          - calculations.calendar_conflict_scan
          - endpoints[POST /calendar-events]
          - errors[ERR_CLIENT_CALENDAR_CONFLICT]
        distinguishing_aspect: "The colliding events belong to two different matters of the same client and are assigned to two different representatives, so only geometry B can see them. Geometry B is fully CLOSED and unbuffered, so a candidate starting at the exact millisecond the other ends collides while one millisecond later is clear — the opposite boundary convention from geometry A. A FILING_DEADLINE candidate is exempt from B entirely and books inside the same window. Finally a candidate that violates both A and B must report the representative error, pinning the normative scan order."
