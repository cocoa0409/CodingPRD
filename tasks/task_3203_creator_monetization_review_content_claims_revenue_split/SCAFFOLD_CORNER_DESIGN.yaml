      - name: strike_expiry_sweeper_returns_a_revoked_channel_to_pending
        claim_type: scheduled_actions
        grounds:
          - calculations.strike_expiry_sweep
          - state_machines.Channel.MONETIZATION_REVOKED_to_MONETIZATION_PENDING
          - endpoints.POST_/api/_clock/set_current_utc
        distinguishing_aspect: "Advancing the logical clock to exactly released_at + 90 days expires all three community strikes in one sweep, drops policy_strike_count to 0 and returns the revoked channel to MONETIZATION_PENDING with an OPEN posture."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US revoked by three ACTIVE community strikes."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Expiry Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_ex: $.data.id }
            - call: "POST /api/channels/${ch_ex}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "VIOLENT_CONTENT" }
              as: Moderator
            - call: "POST /api/channels/${ch_ex}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "HATE_SPEECH" }
              as: Moderator
            - call: "POST /api/channels/${ch_ex}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "SEXUAL_CONTENT" }
              as: Moderator
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "all three ChannelStrike rows are EXPIRED"
            - "Channel.${ch_ex}.policy_strike_count == 0"
            - "Channel.${ch_ex}.monetization_status == MONETIZATION_PENDING"
            - "Channel.${ch_ex}.monetization_posture == OPEN"
            - "sweeping one second earlier at 2026-11-29T23:59:59Z would have left the strikes ACTIVE"

      - name: strike_escalation_crosses_restrict_then_terminate
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.strike_escalation_thresholds
          - calculations.monetization_posture
        distinguishing_aspect: "The cumulative counter crosses two breakpoints in sequence — two ACTIVE strikes give RESTRICTED while a third gives REVOKED plus FROZEN — so the same metric drives two different outcomes at adjacent integer values."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US with one ACTIVE community strike."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Escalation Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_es: $.data.id }
            - call: "POST /api/channels/${ch_es}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "VIOLENT_CONTENT" }
              as: Moderator
          trigger:
            - call: "POST /api/channels/${ch_es}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "HATE_SPEECH" }
              as: Moderator
            - call: "GET /api/channels/${ch_es}"
              payload: {}
              as: Any
              captures: { mid2_count: $.data.policy_strike_count, mid2_posture: $.data.monetization_posture, mid2_status: $.data.monetization_status }
            - call: "POST /api/channels/${ch_es}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "SEXUAL_CONTENT" }
              as: Moderator
          assert:
            - "at two strikes: ${mid2_count} == 2, ${mid2_posture} == RESTRICTED and ${mid2_status} == MONETIZATION_NOT_APPLIED"
            - "at three strikes: Channel.${ch_es}.policy_strike_count == 3, monetization_posture == FROZEN and monetization_status == MONETIZATION_REVOKED"

      - name: review_queue_with_no_pending_channel_returns_an_empty_array
        claim_type: selector_policy
        grounds:
          - calculations.channel_health_ranking
          - endpoints.GET_/api/review-queue
        distinguishing_aspect: "With an empty candidate set the selector returns an empty array and 200 rather than an error, which is the declared empty-pool fallback distinct from the ERR_NO_ELIGIBLE_MEMBERS policy used by the member payout selector."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel that never applied for monetization."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Idle Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
          trigger:
            - call: "GET /api/review-queue"
              payload: {}
              as: MonetizationReviewer
          assert:
            - "the response status is 200 and response_type is array"
            - "the data array is empty and total_count == 0"
            - "no error envelope is returned"

      - name: monetization_review_response_reflects_the_cascade_immediately
        claim_type: immediate_consistency
        grounds:
          - state_machines.Channel.MONETIZATION_PENDING_to_MONETIZATION_APPROVED
          - endpoints.POST_/api/channels/{id}/monetization-review
        distinguishing_aspect: "The review response itself already reports the settled item upload_status and the item's holds_revenue, so a client needs no follow-up read — immediate consistency, not eventual."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel with a pending application and one classified item."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Immediate Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_im: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Immediate Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-immediate-1", policy_mode: "MONETIZE", claimed_segment_seconds: 30 }
              as: RightsHolder
              as_user_id: "rh-immediate-1"
              captures: { rf_im: $.data.id }
            - call: "POST /api/channels/${ch_im}/content-items"
              payload: { title: "Immediate Item", duration_seconds: 300, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_im}"
              captures: { i_im: $.data.id }
            - call: "POST /api/channels/${ch_im}/content-items/${i_im}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_im}"
            - call: "POST /api/channels/${ch_im}/monetization-applications"
              payload: {}
              as: Creator
              as_user_id: "${ch_im}"
          trigger:
            - call: "POST /api/channels/${ch_im}/monetization-review"
              payload: { decision: "APPROVE" }
              as: MonetizationReviewer
          assert:
            - "the review response returns 200 with Channel.monetization_status == MONETIZATION_APPROVED"
            - "a follow-up GET /api/content-items/${i_im} already reports upload_status == CLAIM_SCAN_COMPLETE"
            - "ContentItem.${i_im}.holds_revenue == true in the same request cycle"
