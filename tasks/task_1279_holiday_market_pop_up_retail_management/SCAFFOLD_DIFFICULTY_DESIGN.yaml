        distinguishing_aspect: |
          Metric: count of ACCEPTED applications in category. Boundary: >= cap
          (not >). With cap=2 and 2 already ACCEPTED, a third decide-to-ACCEPTED
          must fail with ERR_CATEGORY_CAP_REACHED even though jury_average >= 60.
