              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-OR", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "GET /applications/${app_id}"
              as: Any
              captures: { app_v1: $.data.version }

          trigger:
            - call: "POST /applications/${app_id}/abandonment-reviews"
              payload: { rationale: "first", expected_application_version: "${app_v1}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { rv_id: $.data.id }

            - call: "GET /applications/${app_id}"
              as: Any
              captures: { app_v2: $.data.version }

            - call: "POST /applications/${app_id}/abandonment-reviews"
