# =============================================================================
# SCAFFOLD: Destination Outdoor Retail with Boat Sales & Conservation Club
#   §1.0 Response Envelope | §1.1 Entities | §1.2 State Machines
#   §1.2.1 Concurrency Rules | §1.3 Calculations | §1.4 Validations
#   §1.5 Endpoints | §1.6 Errors | §1.7 RBAC
# =============================================================================

scenario: |
  Destination Outdoor Retail with Boat Sales & Conservation Club (Bass Pro Shops): destination-store attraction operations including aquariums, museums and free events driving dwell time, boat and motor dealership integration inside retail with trade-in, rigging and title work, seasonal license and permit sales acting as a service counter with state reporting, club credit card and points program tied to a conservation donation match, catch-and-release fishing pond, archery lane and simulator staffing and liability waivers, taxidermy and outfitting service intake with long lead times, event calendar of seminars and kids workshops with registration caps, oversize merchandise loading and boat delivery orientation

domain_name: destination-outdoor-retail
api_prefix: /stores

# -----------------------------------------------------------------------------
# Step 0: Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: posture-driven gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: parallel
  role_model: segregation_of_duties
  consistency_model: saga
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  notes: |
    Two independent archetypes coexist. The compliance/audit spine is the state
    permit counter (PermitSale -> PermitRemitBatch -> state agency acknowledgement)
    and the boat title work (TitleFiling), both of which demand segregation of
    duties and tamper-evident remittance totals. The posture-driven gating spine is
    Store.attraction_posture, an aggregate derived from every Attraction's
    occupancy and the store's dwell-minute budget, which gates every
    AttractionSession transition. BoatDeal carries three independent state
    dimensions (funding_status x title_status x rigging_status) plus a cyclic
    deal_stage, so it is both parallel and cyclic.

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Destination store name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state whose agency receives permit remittances and title filings" }
      - { name: dealer_license_no, type: string, source: input, description: "State boat/motor dealer license number" }
      - { name: dwell_capacity_minutes, type: integer, source: input, description: "Daily cross-attraction dwell-minute budget shared by every attraction" }
      - { name: dwell_committed_minutes, type: integer, source: computed, default: 0, description: "Sum of AttractionSession.dwell_charge_minutes for sessions whose status IN {CONFIRMED, IN_PROGRESS}" }
      - { name: dwell_free_minutes, type: integer, source: computed, default: 0, description: "= dwell_capacity_minutes - dwell_committed_minutes" }
      - { name: attraction_posture, type: enum, source: computed, default: "OPEN", description: "OPEN | RESTRICTED | FROZEN — derived by the attraction_posture calculation; gates every AttractionSession transition" }
      - { name: remit_ledger_cents, type: integer, source: computed, default: 0, description: "Sum of PermitRemitBatch.gross_fee_cents for batches whose status IN {SEALED, TRANSMITTED, ACCEPTED, CORRECTED}" }
      - { name: permit_remit_epoch, type: integer, source: system, default: 0, description: "Monotone counter incremented by the ops-run checkpoint" }
      - { name: load_bays_total, type: integer, source: input, description: "Number of oversize loading/delivery bays" }
      - { name: last_ops_run_at, type: datetime, source: system, description: "Timestamp of the most recent ops-run checkpoint" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; home store for club membership and permit sales" }
      - { name: email, type: string, source: input, description: "Club member email; unique per store" }
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: club_card_status, type: enum, source: system, default: "NONE", description: "NONE | PENDING | ACTIVE | SUSPENDED — club credit card lifecycle" }
      - { name: points_balance, type: integer, source: computed, default: 0, description: "Loyalty points outstanding: sum of awards minus sum of redemptions and reversals, replayed in created_at ASC order" }
      - { name: points_lifetime_earned, type: integer, source: computed, default: 0, description: "Points awarded net of reversal events; drives club_tier" }
      - { name: club_tier, type: enum, source: computed, default: "BASE", description: "BASE | SILVER | GOLD | PATRON — highest tier whose threshold <= points_lifetime_earned" }
      - { name: redeemable_points, type: integer, source: computed, default: 0, description: "= max(0, points_balance - TIER_RETAIN_POINTS[club_tier]); the tier sets a minimum retained balance" }
      - { name: conservation_match_cents, type: integer, source: computed, default: 0, description: "Company conservation donation match accrued this calendar year, capped at MATCH_ANNUAL_CAP_CENTS" }
      - { name: donation_opt_in, type: boolean, source: input, default: false, description: "Whether redeemed points trigger the conservation donation match" }
      - { name: strike_epoch_started_at, type: datetime, source: system, description: "Epoch from which no-show strikes are counted; reset to the completion instant of any COMPLETED AttractionSession or the instant of a club card activation" }

  - name: Attraction
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning destination store" }
      - { name: attraction_type, type: enum, source: input, description: "AQUARIUM | MUSEUM | FISHING_POND | ARCHERY_RANGE | SIMULATOR | TAXIDERMY_GALLERY" }
      - { name: capacity_units, type: integer, source: input, description: "Simultaneous party capacity of the venue" }
      - { name: dwell_cost_minutes, type: integer, source: input, description: "Dwell-minute budget consumed per party member per session" }
      - { name: requires_waiver, type: boolean, source: computed, default: false, description: "true for FISHING_POND, ARCHERY_RANGE, SIMULATOR; false for AQUARIUM, MUSEUM, TAXIDERMY_GALLERY" }
      - { name: in_use_units, type: integer, source: computed, default: 0, description: "Sum of AttractionSession.party_size for sessions whose status IN {CONFIRMED, IN_PROGRESS}" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | OPEN | RESTRICTED | CLOSED" }

  - name: AttractionSession
    parent: null
    common_fields: true
    fields:
      - { name: attraction_id, type: string, source: input, description: "FK -> Attraction.id; venue being occupied" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; club member occupying the venue" }
      - { name: waiver_id, type: string, source: input, description: "FK -> LiabilityWaiver.id; null unless the venue requires a waiver" }
      - { name: session_kind, type: enum, source: input, description: "GENERAL_ADMISSION | ARCHERY_LANE | SIMULATOR | POND_CLINIC" }
      - { name: party_size, type: integer, source: input, description: "Number of guests in the party; consumes party_size units of venue capacity" }
      - { name: lane_no, type: integer, source: input, description: "Archery lane or simulator bay number; required when session_kind IN {ARCHERY_LANE, SIMULATOR}" }
      - { name: slot_start_utc, type: datetime, source: input, description: "Occupancy slot start (inclusive)" }
      - { name: slot_end_utc, type: datetime, source: input, description: "Occupancy slot end (exclusive)" }
      - { name: dwell_charge_minutes, type: integer, source: computed, default: 0, description: "Dwell minutes charged by the attraction_dwell_charge calculation" }
      - { name: overrun_minutes, type: integer, source: computed, default: 0, description: "Minutes past slot_end_utc recorded at completion" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Cumulative NO_SHOW count for this member at this attraction" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | CONFIRMED | IN_PROGRESS | COMPLETED | NO_SHOW | CANCELLED" }
  - name: BoatUnit
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning destination store" }
      - { name: stock_no, type: string, source: input, description: "Dealer stock number; unique within the store" }
      - { name: model_name, type: string, source: input, description: "Boat model display name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Boat hull price in cents" }
      - { name: motor_price_cents, type: integer, source: input, default: 0, description: "Motor price in cents; 0 when sold as a bare hull" }
      - { name: trailer_price_cents, type: integer, source: input, default: 0, description: "Trailer price in cents; 0 when no trailer is rigged" }
      - { name: unit_condition, type: enum, source: input, description: "NEW | USED | DEMO" }
      - { name: prior_title_no, type: string, source: input, description: "Prior certificate-of-title number for USED units; null for NEW" }
      - { name: hull_id_no, type: string, source: input, description: "Hull identification number (HIN); unique within the store" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | DEAL_PENDING | SOLD" }

  - name: TradeInAppraisal
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store performing the appraisal" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; club member tendering the trade unit" }
      - { name: boat_unit_id, type: string, source: input, description: "FK -> BoatUnit.id; the trade unit received into inventory" }
      - { name: offer_amount_cents, type: integer, source: input, description: "Cash offer extended for the trade unit" }
      - { name: accepted_credit_cents, type: integer, source: computed, default: 0, description: "Credit granted, computed by the trade_in_credit calculation; 0 until ACCEPTED" }
      - { name: appraised_at_utc, type: datetime, source: system, description: "Appraisal timestamp; immutable once written" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACCEPTED | DECLINED | SUPERSEDED" }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; servicing department" }
      - { name: boat_unit_id, type: string, source: input, description: "FK -> BoatUnit.id; unit being rigged, loaded or serviced" }
      - { name: deal_id, type: string, source: input, description: "FK -> BoatDeal.id; deal this work belongs to; null for counter service" }
      - { name: boat_deal_id, type: string, source: input, description: "FK -> BoatDeal.id; alias column used by the deal work-order query" }
      - { name: order_kind, type: enum, source: input, description: "RIGGING | OVERSIZE_LOADING | TAXIDERMY | OUTFITTING | POND_MAINTENANCE" }
      - { name: promised_lead_days, type: integer, source: input, description: "Customer-promised lead time in whole days from acceptance" }
      - { name: started_at_utc, type: datetime, source: system, description: "Timestamp the order entered IN_PROGRESS" }
      - { name: completed_at_utc, type: datetime, source: system, description: "Timestamp the order entered COMPLETED" }
      - { name: actual_lead_days, type: integer, source: computed, default: 0, description: "Whole days between started_at_utc and completed_at_utc" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "true when actual_lead_days > promised_lead_days" }
      - { name: status, type: enum, source: system, default: "INTAKE", description: "INTAKE | SCHEDULED | IN_PROGRESS | COMPLETED | DELIVERED | CANCELLED" }

  - name: TitleFiling
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; originating dealer store" }
      - { name: boat_unit_id, type: string, source: input, description: "FK -> BoatUnit.id; hull and motor being titled" }
      - { name: filing_kind, type: enum, source: input, description: "BOAT_TITLE | MOTOR_TITLE | TRAILER_REGISTRATION | LIEN_RELEASE" }
      - { name: state_code, type: string, source: input, description: "Agency state; must equal the store's state_code" }
      - { name: agency_reference, type: string, source: system, description: "Agency-issued reference stamped on acknowledgement" }
      - { name: filed_at_utc, type: datetime, source: system, description: "Timestamp the filing was transmitted to the agency" }
      - { name: acknowledged_at_utc, type: datetime, source: system, description: "Timestamp the agency acknowledged issuance" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | ISSUED | REJECTED" }

  - name: BoatDeal
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; selling store" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; purchasing club member" }
      - { name: boat_unit_id, type: string, source: input, description: "FK -> BoatUnit.id; hull under contract" }
      - { name: trade_in_appraisal_id, type: string, source: input, description: "FK -> TradeInAppraisal.id; accepted appraisal applied to this deal; null when no trade" }
      - { name: deal_stage, type: enum, source: system, default: "QUOTED", description: "QUOTED | CONTRACTED | DELIVERED | SETTLED — cyclic: DELIVERED may revert to CONTRACTED" }
      - { name: funding_status, type: enum, source: system, default: "UNFUNDED", description: "UNFUNDED | PENDING | FUNDED | REFUNDED — independent axis" }
      - { name: title_status, type: enum, source: system, default: "NOT_STARTED", description: "NOT_STARTED | FILED | ISSUED | REJECTED — independent axis" }
      - { name: title_filing_id, type: string, source: computed, default: null, description: "The BOAT_TITLE TitleFiling created by the contracting cascade; null while deal_stage == QUOTED" }
      - { name: rigging_status, type: enum, source: system, default: "NOT_STARTED", description: "NOT_STARTED | SCHEDULED | COMPLETE — independent axis" }
      - { name: contract_price_cents, type: computed, default: 0, description: "Computed by boat_deal_contract_price; recomputed on every deal mutation" }
      - { name: total_fee_cents, type: computed, default: 0, description: "Dealer fees plus tax, computed from contract_price_cents" }
      - { name: balance_due_cents, type: computed, default: 0, description: "= contract_price_cents + total_fee_cents - funded_amount_cents - deposit_cents; settlement_variance_cents is reported separately and is deliberately excluded from this balance" }
      - { name: deposit_cents, type: integer, source: input, default: 0, description: "Customer deposit applied at contracting" }
      - { name: funded_amount_cents, type: integer, source: computed, default: 0, description: "Amount recorded by the bank funding record" }
      - { name: points_awarded, type: integer, source: computed, default: 0, description: "Club points awarded at SETTLED by deal_points_award" }
      - { name: settlement_variance_cents, type: integer, source: computed, default: 0, description: "Signed delta between the provisional and final delivered settlement" }

  - name: PermitSale
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; service counter issuing the permit" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; purchasing club member" }
      - { name: permit_type, type: enum, source: input, description: "FISHING | HUNTING | ARCHERY_RANGE | BOAT_REGISTRATION" }
      - { name: residency_class, type: enum, source: input, description: "RESIDENT | NON_RESIDENT | SENIOR | YOUTH" }
      - { name: term_days, type: integer, source: input, description: "Permit term length in days; boundary-sensitive at the fee tiers" }
      - { name: land_access_units, type: integer, source: input, default: 0, description: "Public-land access add-on units; each unit adds a fee increment" }
      - { name: agent_user_id, type: string, source: input, description: "Opaque operator identifier of the issuing clerk; must not equal the remitter" }
      - { name: issuer_admin_user_id, type: string, source: system, description: "Opaque operator identifier of the admin recorded at sale time, taken from the acting X-User-ID; this operator may not seal the containing batch" }
      - { name: remitter_admin_user_id, type: string, source: system, description: "Opaque operator identifier of the admin who sealed the remittance batch, stamped at seal time" }
      - { name: fee_cents, type: integer, source: computed, default: 0, description: "Issued lifetime value from permit_fee, recomputed when the remit batch is corrected" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | VOIDED | REMITTED | CORRECTED" }

  - name: PermitRemitBatch
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store whose counter sales are being remitted" }
      - { name: window_start_utc, type: datetime, source: input, description: "Inclusive start of the remittance window" }
      - { name: window_end_utc, type: datetime, source: input, description: "Exclusive end of the remittance window" }
      - { name: gross_fee_cents, type: integer, source: computed, default: 0, description: "Snapshot total of PermitSale.fee_cents for sales in this batch at seal time" }
      - { name: interpretative_gross_cents, type: computed, default: 0, description: "Live reinterpretation of the same sales using corrected fee_cents; diverges from gross_fee_cents after a correction" }
      - { name: remit_variance_cents, type: computed, default: 0, description: "= interpretative_gross_cents - gross_fee_cents; signed institution-perspective delta" }
      - { name: agency_ack_no, type: string, source: system, description: "State agency receipt number stamped on acknowledgement" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | SEALED | TRANSMITTED | ACCEPTED | REJECTED | CORRECTED" }

  - name: ClubCardApplication
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store taking the club card application" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; applicant" }
      - { name: card_product, type: enum, source: input, description: "CLASSIC | REWARDS | PATRON" }
      - { name: donation_match_bps, type: integer, source: input, description: "Basis points of redeemed-point value matched as a conservation donation" }
      - { name: underwriter_user_id, type: string, source: input, description: "Opaque operator identifier of the underwriter; must differ from the decider" }
      - { name: decision_user_id, type: string, source: input, description: "Opaque operator identifier of the credit decision maker; must differ from the underwriter" }
      - { name: decision_reason, type: string, source: input, description: "Free-text decision rationale recorded on APPROVED or DECLINED" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Approved credit limit; 0 while PENDING or DECLINED" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | UNDERWRITING | APPROVED | DECLINED | ACTIVATED" }

  - name: PointEvent
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; points subject" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store that generated the event" }
      - { name: boat_deal_id, type: string, source: input, description: "FK -> BoatDeal.id; deal that produced the award; null for redemption and adjustment events" }
      - { name: event_kind, type: enum, source: input, description: "AWARD | REDEEM | REVERSAL | ADJUST" }
      - { name: points_delta, type: integer, source: input, description: "Signed point movement; negative for REDEEM and REVERSAL" }
      - { name: donation_match_cents, type: integer, source: computed, default: 0, description: "Conservation donation match generated by this event" }
      - { name: created_seq, type: integer, source: system, description: "Monotone server sequence; orders the replay when created_at ties" }

  - name: EventOffering
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store hosting the event" }
      - { name: attraction_id, type: string, source: input, description: "FK -> Attraction.id; venue hosting the event; null for free store-floor events" }
      - { name: offering_kind, type: enum, source: input, description: "SEMINAR | KIDS_WORKSHOP | FREE_DEMO" }
      - { name: title, type: string, source: input, description: "Event title shown in the store calendar" }
      - { name: starts_at_utc, type: datetime, source: input, description: "Event start (inclusive)" }
      - { name: ends_at_utc, type: datetime, source: input, description: "Event end (exclusive)" }
      - { name: registration_cap, type: integer, source: input, description: "Maximum confirmed seats; 0 for FREE_DEMO (uncapped)" }
      - { name: confirmed_count, type: integer, source: computed, default: 0, description: "Sum of EventRegistration.seats for registrations whose status == CONFIRMED" }
      - { name: dwell_charge_minutes, type: integer, source: computed, default: 0, description: "Dwell minutes charged by the event_dwell_charge calculation" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PUBLISHED | CANCELLED | COMPLETED" }

  - name: EventRegistration
    parent: null
    common_fields: true
    fields:
      - { name: event_offering_id, type: string, source: input, description: "FK -> EventOffering.id; event being registered for" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; registering club member" }
      - { name: seats, type: integer, source: input, description: "Number of seats requested; consumes captained seats" }
      - { name: attendance_marked, type: boolean, source: input, default: false, description: "Set true when the member is checked in at the event" }
      - { name: status, type: enum, source: system, default: "REGISTERED", description: "REGISTERED | CONFIRMED | WAITLISTED | CANCELLED | ATTENDED" }

  - name: LoadingBayBooking
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store whose load bay is reserved" }
      - { name: bay_no, type: integer, source: input, description: "Oversize loading bay number within the store" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member receiving or delivering the oversize load" }
      - { name: service_order_id, type: string, source: input, description: "FK -> ServiceOrder.id; oversize handling order being loaded" }
      - { name: booked_start_utc, type: datetime, source: input, description: "Bay reservation start (inclusive)" }
      - { name: booked_end_utc, type: datetime, source: input, description: "Bay reservation end (exclusive)" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | CHECKED_IN | COMPLETED | CANCELLED" }

  - name: OrderFulfillment
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; fulfilling destination store" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; club member receiving the order" }
      - { name: order_kind, type: enum, source: input, description: "OVERSIZE_CARRYOUT | BOAT_DELIVERY_ORIENTATION" }
      - { name: pre_service_order_id, type: string, source: input, description: "FK -> ServiceOrder.id; rigging or oversize handling order that must complete before release" }
      - { name: booking_id, type: string, source: input, description: "FK -> LoadingBayBooking.id; bay reservation consumed by this fulfillment" }
      - { name: waiver_id, type: string, source: input, description: "FK -> LiabilityWaiver.id; orientation liability waiver; null for carry-out" }
      - { name: rm_cross_check_code, type: string, source: input, description: "Opaque operator id of the receiving-manager cross-check; null until the ready-gate passes" }
      - { name: fulfilled_at_utc, type: datetime, source: system, description: "Timestamp the order was handed over" }
      - { name: status, type: enum, source: system, default: "READY_FOR_RELEASE", description: "READY_FOR_RELEASE | RELEASED | CANCELLED" }

  - name: ServiceIntake
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; intake department" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member dropping off the item or project" }
      - { name: service_order_id, type: string, source: input, description: "FK -> ServiceOrder.id; service order fulfilling this intake" }
      - { name: intake_kind, type: enum, source: input, description: "TAXIDERMY | OUTFITTING | BOAT_SERVICE" }
      - { name: species_code, type: string, source: input, description: "Species code for TAXIDERMY intake; null otherwise" }
      - { name: permit_sale_id, type: string, source: input, description: "FK -> PermitSale.id; hunting permit proving lawful take; required for TAXIDERMY" }
      - { name: specimen_quantity, type: integer, source: input, description: "Count of specimens or garments received" }
      - { name: deposit_cents, type: integer, source: input, default: 0, description: "Deposit collected at intake" }
      - { name: quoted_lead_days, type: integer, source: input, description: "Quoted turnaround in whole days" }
      - { name: project_charge_cents, type: computed, default: 0, description: "Computed by the intake_project_charge calculation as intake passes its stage gates" }
      - { name: status, type: enum, source: system, default: "INTAKE_QUOTED", description: "INTAKE_QUOTED | PERMIT_VERIFIED | MATERIALS_ORDERED | CURING | READY_FOR_PICKUP | RELEASED | ABANDONED" }

  - name: LiabilityWaiver
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; signatory" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store holding the waiver" }
      - { name: activity_scope, type: enum, source: input, description: "CATCH_AND_RELEASE_POND | ARCHERY_RANGE | SIMULATOR | BOAT_DELIVERY_ORIENTATION" }
      - { name: signed_at_utc, type: datetime, source: input, description: "Signature timestamp supplied by the signing party" }
      - { name: waiver_term_days, type: integer, source: input, default: 365, description: "Validity term in whole days from signed_at_utc" }
      - { name: expires_on, type: datetime, source: computed, default: null, description: "= signed_at_utc + waiver_term_days days, computed by waiver_expiry" }
      - { name: status, type: enum, source: system, default: "SIGNED", description: "SIGNED | SUPERSEDED | EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Non-linear #1: cyclic deal lifecycle with revert ----------------------
  - entity: BoatDeal
    shape: cyclic
    initial_state: QUOTED
    terminal_states: [SETTLED]
    transitions:
      - from: QUOTED
        to: CONTRACTED
        trigger: "POST /stores/{store_id}/boat-deals/{deal_id}/contract"
        actor: DealDeskClerk
        preconditions:
          - "BoatUnit.status == AVAILABLE for boat_unit_id"
          - "when trade_in_appraisal_id is present, TradeInAppraisal.status == ACCEPTED and TradeInAppraisal.member_id == BoatDeal.member_id"
          - "Member.club_card_status IN {ACTIVE, SUSPENDED, NONE} (a declined club card does not block contracting)"
          - "Store.attraction_posture != FROZEN"
        side_effects:
          - "BoatUnit.status AVAILABLE -> DEAL_PENDING"
          - "BoatDeal.deal_stage QUOTED -> CONTRACTED"
          - "BoatDeal.title_status NOT_STARTED -> FILED, which creates a TitleFiling row with filing_kind BOAT_TITLE and state_code equal to Store.state_code"
          - "TitleFiling creation sets BoatDeal.title_status = FILED"
          - "recompute BoatDeal.contract_price_cents via boat_deal_contract_price"
          - "recompute BoatDeal.total_fee_cents via deal_fee_and_tax_relay after contract_price_cents settles"
          - "recompute BoatDeal.balance_due_cents"
          - "increments Store.version by 1"

      - from: CONTRACTED
        to: DELIVERED
        trigger: "system (automatic when funding_status == FUNDED and title_status == ISSUED and rigging_status == COMPLETE)"
        actor: system
        preconditions:
          - "funding_status == FUNDED"
          - "title_status == ISSUED"
          - "rigging_status == COMPLETE"
        side_effects:
          - "BoatUnit.status DEAL_PENDING -> SOLD; this cascade sets BoatUnit.status, which in turn drives every ServiceOrder linked to that boat_unit_id to require delivery"
          - "BoatDeal.deal_stage CONTRACTED -> DELIVERED"
          - "BoatDeal.settlement_variance_cents recomputed by delivery_settlement_variance"
          - "increments Store.version by 1"

      - from: DELIVERED
        to: SETTLED
        trigger: "POST /stores/{store_id}/boat-deals/{deal_id}/settle"
        actor: FinanceAdmin
        preconditions:
          - "BoatDeal.status is DELIVERED"
          - "balance_due_cents <= 0"
        side_effects:
          - "BoatDeal.deal_stage DELIVERED -> SETTLED"
          - "create PointEvent event_kind AWARD with points_delta = deal_points_award(BoatDeal)"
          - "post club_points_apply for the creating Member; the points_awarded increment crosses a tier boundary and attaches a pending ClubCardApplication when Member.club_card_status == NONE"
          - "conservation_match_accrue evaluates the donation match for the member"
          - "increments Store.version by 1"

      # CYCLE EDGE — DELIVERED reverts to CONTRACTED on a title rejection.
      - from: DELIVERED
        to: CONTRACTED
        trigger: "system (automatic when an ISSUED TitleFiling is rejected by the agency)"
        actor: system
        preconditions:
          - "TitleFiling.status == REJECTED for the unit's BOAT_TITLE filing"
        side_effects:
          - "BoatDeal.deal_stage DELIVERED -> CONTRACTED (cycle edge)"
          - "BoatDeal.title_status ISSUED -> REJECTED and then back to NOT_STARTED so a refiling is permitted"
          - "BoatUnit.status SOLD -> DEAL_PENDING"
          - "BoatUnit.status SOLD -> DEAL_PENDING re-opens the unit's rigging work: the ServiceOrder whose boat_unit_id equals this unit and order_kind == RIGGING and status == DELIVERED is returned to COMPLETED"
          - "the ServiceOrder leaving DELIVERED drops its deal's rig dimension back: BoatDeal.rigging_status COMPLETE -> SCHEDULED"
          - "BoatDeal.settlement_variance_cents reset to 0"
          - "increments Store.version by 1"
        note: "This is the cyclic edge that makes BoatDeal non-linear; a rejected title forces the deal back one stage instead of forward."

  # --- Parallel dimensions on one row ---------------------------------------
  - entity: BoatDeal
    shape: parallel
    state_dimensions:
      - name: deal_stage
        states: [QUOTED, CONTRACTED, DELIVERED, SETTLED]
      - name: funding_status
        states: [UNFUNDED, PENDING, FUNDED, REFUNDED]
      - name: title_status
        states: [NOT_STARTED, FILED, ISSUED, REJECTED]
      - name: rigging_status
        states: [NOT_STARTED, SCHEDULED, COMPLETE]
    initial_state: "deal_stage=QUOTED, funding_status=UNFUNDED, title_status=NOT_STARTED, rigging_status=NOT_STARTED"
    transitions:
      - from: "deal_stage any"
        to: "funding_status UNFUNDED -> PENDING"
        trigger: "POST /stores/{store_id}/boat-deals/{deal_id}/funding"
        actor: FinanceAdmin
        preconditions:
          - "funding_status == UNFUNDED"
          - "deal_stage IN {CONTRACTED, DELIVERED}"
          - "amount_cents < balance_due_cents"
        side_effects: ["funding_status UNFUNDED -> PENDING"]

      - from: "funding_status UNFUNDED"
        to: "funding_status FUNDED"
        trigger: "POST /stores/{store_id}/boat-deals/{deal_id}/funding"
        actor: FinanceAdmin
        preconditions:
          - "deal_stage IN {CONTRACTED, DELIVERED}"
          - "amount_cents >= balance_due_cents"
        side_effects:
          - "funding_status UNFUNDED -> FUNDED"
          - "BoatDeal.funded_amount_cents := amount_cents"
          - "recompute BoatDeal.balance_due_cents to 0"
          - "when deal_stage == CONTRACTED and title_status == ISSUED and rigging_status == COMPLETE, the deal is auto-delivered on the next call against it, because BoatDeal is not in a terminal state"

      - from: "deal_stage any"
        to: "funding_status PENDING -> FUNDED"
        trigger: "POST /stores/{store_id}/boat-deals/{deal_id}/funding"
        actor: FinanceAdmin
        preconditions:
          - "funding_status == PENDING"
          - "amount_cents >= balance_due_cents at the moment of recording"
        side_effects:
          - "funding_status PENDING -> FUNDED"
          - "BoatDeal.funded_amount_cents := amount_cents"
          - "recompute BoatDeal.balance_due_cents"
          - "when deal_stage == CONTRACTED and title_status == ISSUED and rigging_status == COMPLETE, the deal is auto-delivered on the next call against it, because BoatDeal is not in a terminal state"

      - from: "deal_stage any"
        to: "funding_status FUNDED -> REFUNDED"
        trigger: "POST /stores/{store_id}/boat-deals/{deal_id}/refund"
        actor: FinanceAdmin
        preconditions: ["funding_status == FUNDED", "deal_stage != SETTLED"]
        side_effects:
          - "funding_status FUNDED -> REFUNDED"
          - "BoatDeal.funded_amount_cents := 0"
          - "recompute BoatDeal.balance_due_cents"
          - "when deal_stage == DELIVERED, the deal has no funded basis left, so it is auto-reverted one stage on the next call against it: BoatDeal.deal_stage DELIVERED -> CONTRACTED"

      - from: "deal_stage any"
        to: "title_status FILED -> ISSUED"
        trigger: "POST /stores/{store_id}/title-filings/{filing_id}/issue"
        actor: TitleClerk
        preconditions:
          - "TitleFiling.status == SUBMITTED"
          - "TitleFiling.state_code == Store.state_code"
        side_effects:
          - "TitleFiling.status SUBMITTED -> ISSUED"
          - "BoatDeal.title_status FILED -> ISSUED"
          - "when deal_stage == CONTRACTED and funding_status == FUNDED and rigging_status == COMPLETE, the deal is auto-delivered on the next call against it, because BoatDeal is not in a terminal state"

      - from: "deal_stage any"
        to: "rigging_status NOT_STARTED -> SCHEDULED"
        trigger: "POST /stores/{store_id}/service-orders/{order_id}/schedule"
        actor: ServiceTechnician
        preconditions:
          - "ServiceOrder.order_kind == RIGGING"
          - "ServiceOrder.deal_id is not null and references this deal"
          - "ServiceOrder.status == INTAKE"
        side_effects:
          - "ServiceOrder.status INTAKE -> SCHEDULED"
          - "BoatDeal.rigging_status NOT_STARTED -> SCHEDULED"

      - from: "deal_stage any"
        to: "rigging_status SCHEDULED -> COMPLETE"
        trigger: "system (automatic when the rigging ServiceOrder is completed and delivered)"
        actor: system
        preconditions:
          - "ServiceOrder.status == DELIVERED for the deal's RIGGING order"
        side_effects:
          - "BoatDeal.rigging_status SCHEDULED -> COMPLETE"
          - "when deal_stage == CONTRACTED and funding_status == FUNDED and title_status == ISSUED, the deal is auto-delivered on the next call against it, because BoatDeal is not in a terminal state"

  # --- Non-linear #2: branch fork-join over a posture gate -------------------
  - entity: AttractionSession
    shape: branching
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "system (automatic when every allocation precondition holds at request time)"
        actor: system
        preconditions:
          - "Attraction.status == OPEN"
          - "Store.attraction_posture == OPEN"
          - "Attraction.in_use_units + party_size <= Attraction.capacity_units"
          - "no overlapping CONFIRMED or IN_PROGRESS session on the same attraction_id whose interval overlaps [slot_start_utc, slot_end_utc) with party_size + that session's party_size > capacity_units"
          - "when Attraction.requires_waiver == true, LiabilityWaiver row exists for member_id and activity_scope matching the venue and LiabilityWaiver.status == SIGNED and LiabilityWaiver.expires_on >= Store clock now"
          - "for session_kind ARCHERY_LANE, lane_no <= 12; for SIMULATOR, lane_no <= 6"
          - "registration capacity for the parent EventOffering, when the session is an event breakout, has confirmed_count + seats <= registration_cap or registration_cap == 0"
        side_effects:
          - "Attraction.in_use_units += party_size; the aggregate recompute then re-derives Store.dwell_committed_minutes and Store.dwell_free_minutes"
          - "recompute AttractionSession.dwell_charge_minutes via attraction_dwell_charge"
          - "the Store aggregate recompute re-evaluates attraction_posture and may move Store.attraction_posture OPEN -> RESTRICTED"
          - "when the Store posture becomes RESTRICTED, sibling AttractionSession rows on the same store in status REQUESTED are rejected with ERR_POSTURE_RESTRICTED"

      - from: REQUESTED
        to: WAITLIST_FALLBACK
        trigger: "system (automatic when the venue is at capacity but the store posture is not FROZEN)"
        actor: system
        preconditions:
          - "Attraction.in_use_units + party_size > Attraction.capacity_units"
          - "Store.attraction_posture == OPEN"
        side_effects:
          - "AttractionSession.status = WAITLIST_FALLBACK and no capacity is consumed"
        note: "Fork branch B: the request neither confirms nor dies; it parks until the ops-run checkpoint re-evaluates it."

      - from: WAITLIST_FALLBACK
        to: CONFIRMED
        trigger: "system (automatic during the ops-run checkpoint when capacity has freed)"
        actor: system
        preconditions:
          - "Attraction.in_use_units + party_size <= Attraction.capacity_units"
          - "Store.attraction_posture == OPEN"
          - "no earlier-created_at AttractionSession in WAITLIST_FALLBACK for the same attraction_id and overlapping interval remains unconfirmed"
        side_effects:
          - "Attraction.in_use_units += party_size"
          - "AttractionSession.dwell_charge_minutes is pinned to the value it would have had at the original request time"

      - from: WAITLIST_FALLBACK
        to: CANCELLED
        trigger: "system (automatic during the ops-run checkpoint when the store posture is FROZEN or the slot has passed)"
        actor: system
        preconditions:
          - "Store.attraction_posture == FROZEN or slot_start_utc < Store clock now"
        side_effects: []

      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /stores/{store_id}/attraction-sessions/{session_id}/check-in"
        actor: AttractionHost
        preconditions: ["AttractionSession.status == CONFIRMED", "slot_start_utc <= Store clock now"]
        side_effects: []

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /stores/{store_id}/attraction-sessions/{session_id}/cancel"
        actor: AttractionHost, PlatformAdmin
        preconditions: ["AttractionSession.status == CONFIRMED"]
        side_effects:
          - "Attraction.in_use_units -= party_size"
          - "recompute Store.dwell_committed_minutes and Store.dwell_free_minutes"
          - "re-evaluate attraction_posture; a RESTRICTED store may return to OPEN"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /stores/{store_id}/attraction-sessions/{session_id}/complete"
        actor: AttractionHost
        preconditions: ["AttractionSession.status == IN_PROGRESS", "overrun_minutes >= 0"]
        side_effects:
          - "Attraction.in_use_units -= party_size"
          - "AttractionSession.overrun_minutes := max(0, Store clock now - slot_end_utc) in whole minutes"
          - "when overrun_minutes > 30, AttractionSession.no_show_strikes += 1 on every other session of the same member at the same attraction, and the member's next request at that attraction is evaluated against the strike threshold"
          - "recompute Store.dwell_committed_minutes and Store.dwell_free_minutes"

      - from: IN_PROGRESS
        to: NO_SHOW
        trigger: "system (automatic during the ops-run checkpoint when the slot ended with no check-in)"
        actor: system
        preconditions: ["slot_end_utc < Store clock now"]
        side_effects:
          - "Attraction.in_use_units -= party_size"
          - "AttractionSession.no_show_strikes += 1 for the member at this attraction"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (automatic during the ops-run checkpoint when the slot ended with no check-in)"
        actor: system
        preconditions: ["slot_end_utc < Store clock now"]
        side_effects:
          - "Attraction.in_use_units -= party_size"
          - "AttractionSession.no_show_strikes += 1 for the member at this attraction"
          - "when the member's cumulative no_show_strikes at this attraction reaches 3, the store's future AttractionSession requests for that member at that attraction are rejected with ERR_NO_SHOW_STRIKE_LIMIT"

  - entity: EventOffering
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /stores/{store_id}/event-offerings/{offering_id}/publish"
        actor: EventsCoordinator
        preconditions:
          - "registration_cap > 0 when offering_kind != FREE_DEMO"
          - "registration_cap == 0 when offering_kind == FREE_DEMO"
          - "ends_at_utc > starts_at_utc"
          - "when attraction_id is not null, the Attraction exists and Attraction.status IN {PLANNED, OPEN}"
        side_effects:
          - "EventOffering.dwell_charge_minutes recomputed via event_dwell_charge"
          - "Store.dwell_committed_minutes += dwell_charge_minutes and Store.dwell_free_minutes recomputed"
          - "when Store.dwell_free_minutes < 0 the publish is rejected with ERR_DWELL_BUDGET_EXCEEDED and no fields change"
          - "re-evaluate attraction_posture; Store.attraction_posture OPEN -> RESTRICTED may fire"

      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /stores/{store_id}/event-offerings/{offering_id}/cancel"
        actor: EventsCoordinator, PlatformAdmin
        preconditions: ["EventOffering.status == PUBLISHED"]
        side_effects:
          - "every EventRegistration whose status IN {REGISTERED, CONFIRMED, WAITLISTED} for this offering moves to CANCELLED"
          - "for each such registration, Member.points_balance += 250 if seats >= 2 (the cancellation credit), recorded as PointEvent event_kind ADJUST"
          - "recompute EventOffering.confirmed_count to 0"
          - "Store.dwell_committed_minutes -= EventOffering.dwell_charge_minutes and Store.dwell_free_minutes recomputed"

      - from: PUBLISHED
        to: COMPLETED
        trigger: "system (automatic during the ops-run checkpoint when ends_at_utc < Store clock now)"
        actor: system
        side_effects:
          - "every EventRegistration in status CONFIRMED with attendance_marked == true moves to ATTENDED"
          - "every EventRegistration in status CONFIRMED with attendance_marked == false moves to CANCELLED"
          - "Store.dwell_committed_minutes -= EventOffering.dwell_charge_minutes"
          - "for each ATTENDED registration with seats >= 1, Member.points_balance += 100 via PointEvent event_kind AWARD"

  - entity: EventRegistration
    initial_state: REGISTERED
    terminal_states: [CANCELLED, ATTENDED]
    transitions:
      - from: REGISTERED
        to: CONFIRMED
        trigger: "POST /stores/{store_id}/event-offerings/{offering_id}/registrations/{registration_id}/confirm"
        actor: EventsCoordinator
        preconditions:
          - "EventOffering.status == PUBLISHED"
          - "EventOffering.confirmed_count + seats <= EventOffering.registration_cap when registration_cap > 0"
        side_effects:
          - "EventOffering.confirmed_count += seats"
          - "when required materials for a KIDS_WORKSHOP offering exceed the store's workshop_material_stock, a ServiceOrder with order_kind OUTFITTING is created automatically and EventRegistration.status becomes WAITLISTED instead"

      - from: REGISTERED
        to: WAITLISTED
        trigger: "system (automatic when confirm is attempted with no remaining seat inventory)"
        actor: system
        preconditions: ["EventOffering.confirmed_count + seats > EventOffering.registration_cap", "EventOffering.registration_cap > 0"]
        side_effects: ["EventRegistration.status = WAITLISTED; no seats consumed"]

      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (automatic during the ops-run checkpoint when seats have freed by cancellations)"
        actor: system
        preconditions:
          - "EventOffering.confirmed_count + seats <= EventOffering.registration_cap"
          - "no earlier-created_at WAITLISTED registration for the same offering remains unconfirmed"
        side_effects: ["EventOffering.confirmed_count += seats"]

      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /stores/{store_id}/event-offerings/{offering_id}/registrations/{registration_id}/cancel"
        actor: EventsCoordinator, PlatformAdmin
        preconditions: ["EventRegistration.status IN {REGISTERED, CONFIRMED, WAITLISTED}"]
        side_effects:
          - "when the prior status was CONFIRMED, EventOffering.confirmed_count -= seats"
          - "Member.points_balance += 250 when seats >= 2 and the prior status was CONFIRMED"

  - entity: PermitSale
    initial_state: ISSUED
    terminal_states: [REMITTED, VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /stores/{store_id}/permit-sales/{sale_id}/void"
        actor: PermitClerk, PlatformAdmin
        preconditions:
          - "PermitSale.status == ISSUED"
          - "PermitSale does not belong to a PermitRemitBatch whose status IN {SEALED, TRANSMITTED, ACCEPTED}"
        side_effects:
          - "PermitSale.status ISSUED -> VOIDED"
          - "when the void happens after the sale's batch was CORRECTED, PermitSale.fee_cents is recomputed by permit_fee and the parent batch's interpretative_gross_cents and remit_variance_cents are recomputed"

      - from: ISSUED
        to: REMITTED
        trigger: "system (automatic when the containing PermitRemitBatch is acknowledged)"
        actor: system
        preconditions: ["PermitRemitBatch.status == ACCEPTED for the containing batch"]
        side_effects: ["PermitSale.status ISSUED -> REMITTED"]

      - from: CORRECTED
        to: REMITTED
        trigger: "system (automatic when the containing PermitRemitBatch is acknowledged after a correction)"
        actor: system
        preconditions: ["PermitRemitBatch.status == ACCEPTED"]
        side_effects:
          - "PermitSale.status CORRECTED -> REMITTED"
          - "PermitSale.fee_cents is frozen at its corrected lifetime value"

      - from: REMITTED
        to: CORRECTED
        trigger: "system (automatic when the agency rejects the remittance batch)"
        actor: system
        preconditions: ["PermitRemitBatch.status == CORRECTED for the containing batch"]
        side_effects:
          - "PermitSale.status REMITTED -> CORRECTED"
          - "PermitSale.fee_cents recomputed by permit_fee; the recomputed value feeds PermitRemitBatch.interpretative_gross_cents which is compared against the frozen gross_fee_cents snapshot"

  - entity: PermitRemitBatch
    initial_state: OPEN
    terminal_states: [ACCEPTED, CORRECTED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /stores/{store_id}/permit-remit-batches/{batch_id}/seal"
        actor: RemitAdmin
        preconditions:
          - "at least one PermitSale whose store_id equals the batch store, status == ISSUED, and created_at in [window_start_utc, window_end_utc) exists"
          - "no PermitSale in the window has issuer_admin_user_id equal to the sealing admin user id"
        side_effects:
          - "PermitRemitBatch.gross_fee_cents := sum of PermitSale.fee_cents for every such sale (the frozen snapshot)"
          - "PermitRemitBatch.interpretative_gross_cents := the same sum recomputed live"
          - "PermitRemitBatch.remit_variance_cents := interpretative_gross_cents - gross_fee_cents"
          - "PermitRemitBatch.status OPEN -> SEALED"
          - "Store.remit_ledger_cents += gross_fee_cents"

      - from: SEALED
        to: TRANSMITTED
        trigger: "POST /stores/{store_id}/permit-remit-batches/{batch_id}/transmit"
        actor: RemitAdmin
        preconditions: ["PermitRemitBatch.status == SEALED"]
        side_effects: ["PermitRemitBatch.status SEALED -> TRANSMITTED"]

      - from: CORRECTED
        to: CORRECTED
        trigger: "POST /stores/{store_id}/permit-remit-batches/{batch_id}/reject-correction"
        actor: AgencyOperator
        preconditions:
          - "PermitRemitBatch.status == CORRECTED"
          - "the referenced sale_id belongs to this batch"
        side_effects:
          - "the named PermitSale.fee_cents := revised_fee_cents (already CORRECTED, so its status is unchanged)"
          - "PermitRemitBatch.interpretative_gross_cents recomputed over all corrected fees"
          - "PermitRemitBatch.remit_variance_cents := interpretative_gross_cents - gross_fee_cents"
        note: "Self-loop: a batch may take several correction rounds, one sale per call."


      - from: TRANSMITTED
        to: ACCEPTED
        trigger: "POST /stores/{store_id}/permit-remit-batches/{batch_id}/acknowledge"
        actor: AgencyOperator
        preconditions:
          - "PermitRemitBatch.status == TRANSMITTED"
          - "agency_ack_no is a non-empty string"
        side_effects:
          - "PermitRemitBatch.status TRANSMITTED -> ACCEPTED"
          - "every PermitSale in the batch with status ISSUED or CORRECTED moves to REMITTED"
          - "Store.permit_remit_epoch += 1"

      - from: TRANSMITTED
        to: CORRECTED
        trigger: "POST /stores/{store_id}/permit-remit-batches/{batch_id}/reject-correction"
        actor: AgencyOperator
        preconditions:
          - "PermitRemitBatch.status == TRANSMITTED"
          - "revised_fee_cents >= 0 for at least one sale in the batch"
        side_effects:
          - "PermitRemitBatch.status TRANSMITTED -> CORRECTED"
          - "for each sale in the batch whose revised_fee_cents is supplied, PermitSale.fee_cents := revised_fee_cents and PermitSale.status REMITTED -> CORRECTED"
          - "PermitRemitBatch.interpretative_gross_cents recomputed over the corrected fees; gross_fee_cents remains the frozen seal-time snapshot"
          - "PermitRemitBatch.remit_variance_cents := interpretative_gross_cents - gross_fee_cents"

  - entity: ServiceOrder
    initial_state: INTAKE
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: INTAKE
        to: SCHEDULED
        trigger: "POST /stores/{store_id}/service-orders/{order_id}/schedule"
        actor: ServiceTechnician, ServiceWriter
        preconditions:
          - "OrderFulfillment, when one references this service order, has status IN {READY_FOR_RELEASE}"
          - "no other ServiceOrder with order_kind RIGGING for the same boat_unit_id is in status IN_PROGRESS"
        side_effects:
          - "ServiceOrder.status INTAKE -> SCHEDULED"
          - "when order_kind == RIGGING and deal_id is not null, BoatDeal.rigging_status NOT_STARTED -> SCHEDULED"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /stores/{store_id}/service-orders/{order_id}/start"
        actor: ServiceTechnician
        preconditions: ["ServiceOrder.status == SCHEDULED", "Store.attraction_posture != FROZEN"]
        side_effects: ["ServiceOrder.status SCHEDULED -> IN_PROGRESS", "ServiceOrder.started_at_utc stamped"]

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /stores/{store_id}/service-orders/{order_id}/complete"
        actor: ServiceTechnician
        preconditions: ["ServiceOrder.status == IN_PROGRESS"]
        side_effects:
          - "ServiceOrder.status IN_PROGRESS -> COMPLETED"
          - "ServiceOrder.completed_at_utc stamped; actual_lead_days recomputed via lead_time_actual"
          - "ServiceOrder.is_late recomputed via lead_time_actual"
          - "when is_late == true, every in-progress order in creation order has its completed_at_utc preserved but the overdue projection for the store advances by actual_lead_days - promised_lead_days"

      - from: COMPLETED
        to: DELIVERED
        trigger: "POST /stores/{store_id}/service-orders/{order_id}/deliver"
        actor: ServiceTechnician, PlatformAdmin
        preconditions:
          - "ServiceOrder.status == COMPLETED"
          - "when order_kind == OVERSIZE_LOADING, the linked LoadingBayBooking.status == CHECKED_IN"
        side_effects:
          - "ServiceOrder.status COMPLETED -> DELIVERED"
          - "when order_kind == RIGGING and deal_id is not null, the BoatDeal rigging_status SCHEDULED -> COMPLETE dimension transition fires"
          - "the OrderFulfillment row whose pre_service_order_id equals this order is unblocked: its release precondition is now satisfied, so a later release call on it is accepted"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /stores/{store_id}/service-orders/{order_id}/cancel"
        actor: ServiceWriter, PlatformAdmin
        preconditions: ["ServiceOrder.status IN {INTAKE, SCHEDULED}"]
        side_effects:
          - "ServiceOrder.status -> CANCELLED"
          - "when a deposit was collected through a ServiceIntake row, the deposit is refunded via a PointEvent event_kind ADJUST with points_delta = floor(deposit_cents / 10)"

  - entity: ServiceIntake
    initial_state: INTAKE_QUOTED
    terminal_states: [RELEASED, ABANDONED]
    transitions:
      - from: INTAKE_QUOTED
        to: PERMIT_VERIFIED
        trigger: "POST /stores/{store_id}/service-intakes/{intake_id}/verify-permit"
        actor: ServiceWriter
        preconditions:
          - "when intake_kind == TAXIDERMY, permit_sale_id is not null, the referenced PermitSale.permit_type IN {HUNTING, ARCHERY_RANGE}, and PermitSale.status IN {ISSUED, REMITTED}"
          - "when intake_kind != TAXIDERMY, permit_sale_id must be null"
        side_effects:
          - "ServiceIntake.status INTAKE_QUOTED -> PERMIT_VERIFIED"
          - "ServiceIntake.project_charge_cents := intake_project_charge(stage = PERMIT_VERIFIED)"
          - "when project_charge_cents exceeds 0, the linked ServiceOrder.promised_lead_days is extended and ServiceOrder.is_late is recomputed against the new promise"

      - from: PERMIT_VERIFIED
        to: MATERIALS_ORDERED
        trigger: "POST /stores/{store_id}/service-intakes/{intake_id}/order-materials"
        actor: ServiceWriter
        preconditions: ["ServiceIntake.status == PERMIT_VERIFIED", "deposit_cents >= 5000"]
        side_effects:
          - "ServiceIntake.status PERMIT_VERIFIED -> MATERIALS_ORDERED"
          - "ServiceIntake.project_charge_cents := intake_project_charge(stage = MATERIALS_ORDERED)"

      - from: MATERIALS_ORDERED
        to: CURING
        trigger: "POST /stores/{store_id}/service-intakes/{intake_id}/begin-curing"
        actor: ServiceTechnician
        preconditions:
          - "ServiceIntake.status == MATERIALS_ORDERED"
          - "when intake_kind == TAXIDERMY, specimen_quantity <= 20"
        side_effects:
          - "ServiceIntake.status MATERIALS_ORDERED -> CURING"
          - "ServiceIntake.project_charge_cents := intake_project_charge(stage = CURING)"
          - "the linked ServiceOrder.promised_lead_days := quoted_lead_days + CURING_EXTRA_LEAD_DAYS"

      - from: CURING
        to: READY_FOR_PICKUP
        trigger: "POST /stores/{store_id}/service-intakes/{intake_id}/mark-ready"
        actor: ServiceTechnician
        preconditions: ["ServiceIntake.status == CURING"]
        side_effects:
          - "ServiceIntake.status CURING -> READY_FOR_PICKUP"
          - "the linked ServiceOrder moves to COMPLETED and stamps completed_at_utc"

      - from: READY_FOR_PICKUP
        to: RELEASED
        trigger: "POST /stores/{store_id}/service-intakes/{intake_id}/release"
        actor: ServiceWriter
        preconditions:
          - "ServiceIntake.status == READY_FOR_PICKUP"
          - "the linked ServiceOrder.status == COMPLETED"
        side_effects: ["ServiceIntake.status READY_FOR_PICKUP -> RELEASED"]

      - from: READY_FOR_PICKUP
        to: ABANDONED
        trigger: "system (automatic during the ops-run checkpoint when the pickup window of 90 days has elapsed)"
        actor: system
        preconditions: ["Store clock now - ServiceOrder.completed_at_utc > 90 days"]
        side_effects:
          - "ServiceIntake.status READY_FOR_PICKUP -> ABANDONED"
          - "the deposit is forfeited: project_charge_cents remains payable and deposit_cents is not refunded"

  - entity: ClubCardApplication
    initial_state: PENDING
    terminal_states: [DECLINED, ACTIVATED]
    transitions:
      - from: PENDING
        to: UNDERWRITING
        trigger: "POST /stores/{store_id}/club-card-applications/{application_id}/underwrite"
        actor: CreditUnderwriter
        preconditions:
          - "ClubCardApplication.status == PENDING"
          - "underwriter_user_id is non-empty and differs from decision_user_id"
        side_effects:
          - "ClubCardApplication.status PENDING -> UNDERWRITING"
          - "ClubCardApplication.underwriter_user_id is frozen; later decision calls must carry a different decision_user_id"

      - from: UNDERWRITING
        to: APPROVED
        trigger: "POST /stores/{store_id}/club-card-applications/{application_id}/decide"
        actor: CreditOfficer
        preconditions:
          - "ClubCardApplication.status == UNDERWRITING"
          - "decision_user_id != underwriter_user_id"
          - "credit_limit_cents >= 50000"
          - "Member.club_tier IN {SILVER, GOLD, PATRON} or card_product == CLASSIC"
        side_effects:
          - "ClubCardApplication.status UNDERWRITING -> APPROVED"
          - "Member.club_card_status NONE -> PENDING"

      - from: UNDERWRITING
        to: DECLINED
        trigger: "POST /stores/{store_id}/club-card-applications/{application_id}/decide"
        actor: CreditOfficer
        preconditions:
          - "ClubCardApplication.status == UNDERWRITING"
          - "decision_user_id != underwriter_user_id"
          - "decision_reason is non-empty"
        side_effects:
          - "ClubCardApplication.status UNDERWRITING -> DECLINED"
          - "Member.club_card_status unchanged"
          - "recompute Member.club_tier; a tier downgrade is applied only when points_lifetime_earned fell below the current tier threshold"

      - from: APPROVED
        to: ACTIVATED
        trigger: "POST /stores/{store_id}/club-card-applications/{application_id}/activate"
        actor: StoreManager
        preconditions: ["ClubCardApplication.status == APPROVED", "Member.club_card_status IN {NONE, PENDING}"]
        side_effects:
          - "ClubCardApplication.status APPROVED -> ACTIVATED"
          - "Member.club_card_status PENDING -> ACTIVE"
          - "recompute Member.redeemable_points under the activated card's tier multiplier"

  - entity: OrderFulfillment
    initial_state: READY_FOR_RELEASE
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: READY_FOR_RELEASE
        to: RELEASED
        trigger: "POST /stores/{store_id}/order-fulfillments/{fulfillment_id}/release"
        actor: ReceivingManager
        preconditions:
          - "the ServiceOrder referenced by pre_service_order_id has status DELIVERED"
          - "when order_kind == BOAT_DELIVERY_ORIENTATION, a LiabilityWaiver with activity_scope BOAT_DELIVERY_ORIENTATION exists for member_id with status SIGNED and expires_on >= Store clock now"
          - "when order_kind == OVERSIZE_CARRYOUT, the referenced LoadingBayBooking.status IN {CHECKED_IN, COMPLETED}"
          - "rm_cross_check_code is non-empty and differs from the member's identity"
        side_effects:
          - "OrderFulfillment.status READY_FOR_RELEASE -> RELEASED"
          - "OrderFulfillment.fulfilled_at_utc stamped"
          - "the referenced LoadingBayBooking, when its service order is now delivered, moves CHECKED_IN -> COMPLETED"

      - from: READY_FOR_RELEASE
        to: CANCELLED
        trigger: "POST /stores/{store_id}/order-fulfillments/{fulfillment_id}/cancel"
        actor: ReceivingManager, PlatformAdmin
        preconditions: ["OrderFulfillment.status == READY_FOR_RELEASE"]
        side_effects:
          - "OrderFulfillment.status -> CANCELLED"
          - "the referenced LoadingBayBooking moves RESERVED or CHECKED_IN -> CANCELLED"

  - entity: LiabilityWaiver
    initial_state: SIGNED
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: SIGNED
        to: SUPERSEDED
        trigger: "system (automatic when a newer SIGNED waiver is created for the same member_id and activity_scope)"
        actor: system
        side_effects: ["LiabilityWaiver.status SIGNED -> SUPERSEDED"]

      - from: SIGNED
        to: EXPIRED
        trigger: "system (automatic during the ops-run checkpoint when expires_on < Store clock now)"
        actor: system
        side_effects: ["LiabilityWaiver.status SIGNED -> EXPIRED"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: oversize-carryout-stale-bay-version
    parent_entity: LoadingBayBooking
    write_endpoint: "POST /stores/{store_id}/order-fulfillments"
    occ_field: "expected_booking_version"
    description: |
      Creating an OrderFulfillment against a LoadingBayBooking whose version has
      advanced since the client last observed it is rejected, because a booking
      that changed in the interim may already have been completed or cancelled and
      the new fulfillment record would otherwise claim a bay slot the client never
      saw. The stale expected version is the only signal the server needs.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: permit-sale-stale-batch-version
    parent_entity: PermitRemitBatch
    write_endpoint: "POST /stores/{store_id}/permit-sales"
    occ_field: "expected_remit_batch_version"
    description: |
      Creating a PermitSale into a PermitRemitBatch whose version has advanced
      since the client last observed it is rejected, because the batch may have
      been sealed in the interim and the seal already froze the gross fee snapshot
      over a set of sales that did not include this one.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: boat_deal_contract_price
    trigger: "BoatDeal creation, the QUOTED -> CONTRACTED transition, and every subsequent BoatDeal mutation"
    algorithm: combinatorial_conditional
    formula: |
      hull   = BoatUnit.unit_price_cents
      motor  = BoatUnit.motor_price_cents
      trailer= BoatUnit.trailer_price_cents
      rigging_fee = 95000            # RIGGING_FEE_CENTS
      credit_pct  = TIER_CREDIT_BPS_BY_CARD_STATUS[Member.club_card_status] / 10000
      # Conditional branch on unit_condition: NEW gets the full accessory
      # discount, USED/DEMO get half, and the branch is inside the min().
      acc_disc_pct = 0.05 if BoatUnit.unit_condition == "NEW" else 0.025
      acc_amt  = min(motor + trailer, 500000)
      acc_disc = round_half_up(acc_amt * acc_disc_pct)
      base = hull + motor + trailer + rigging_fee
      # Trade credit is applied in TWO steps with a rounding gate between them:
      # the tier credit is rounded first, then floor-capped by the accepted
      # appraisal credit. Rounding before capping is pinned; capping first
      # would change cents when the two disagree.
      tier_credit = round_half_up(base * credit_pct)
      trade_credit = min(TradeInAppraisal.accepted_credit_cents, tier_credit)
      contract_price_cents = max(FLOOR_PRICE_CENTS, base - acc_disc - trade_credit)
    input_set: "All BoatUnit fields plus TradeInAppraisal.accepted_credit_cents where TradeInAppraisal.status == ACCEPTED and TradeInAppraisal.member_id == BoatDeal.member_id; BoatUnit rows in status AVAILABLE or DEAL_PENDING are eligible, SOLD rows are excluded."
    constants:
      RIGGING_FEE_CENTS: 95000
      ACCESSORY_DISCOUNT_CAP_CENTS: 500000
      ACCESSORY_DISCOUNT_BPS_NEW: 500
      ACCESSORY_DISCOUNT_BPS_USED: 250
      TIER_CREDIT_BPS_BY_CARD_STATUS: { NONE: 0, PENDING: 100, ACTIVE: 500, SUSPENDED: 0 }
      FLOOR_PRICE_CENTS: 1
    precision: "2 decimal places, round_half_up, applied per step in the order written; the trade credit is rounded before it is capped"
    variants:
      - name: provisional_quote_price
        when: "deal_stage == QUOTED, or deal_stage == CONTRACTED before any funding record exists"
        difference: "tier_credit is computed at 50% of TIER_CREDIT_BPS_BY_CARD_STATUS and the rigging fee is excluded, so the quoted price is lower than the contracted price for identical inputs"
      - name: contracted_settlement_price
        when: "deal_stage IN {CONTRACTED, DELIVERED, SETTLED} with at least one funding record"
        difference: "the full TIER_CREDIT_BPS_BY_CARD_STATUS rate and the rigging fee both apply, so the same hull, motor and trade produce a higher contract_price_cents"

  - name: deal_points_award
    trigger: "the BoatDeal DELIVERED -> SETTLED transition"
    algorithm: tiered_pricing
    formula: |
      # list_value = hull + motor + trailer + rigging fee, BEFORE the accessory
      # discount and the trade credit. contract_variant uses BoatDeal.contract_price_cents.
      p = list_value if variant == points_on_msrp_value else BoatDeal.contract_price_cents
      # Per-band, not marginal: the rate band the price lands IN applies to the
      # WHOLE price. Band membership is >= lower bound and < upper bound, except
      # the last band which is unbounded above.
      band_bps = 8 if p < 5_000_000 else 12 if p < 15_000_000 else 18
      # Order-insensitive integer form: compute ONE round on the total, never
      # sum rounded per-band pieces.
      points = round_half_up(p * band_bps / 100_000)
      if Member.club_card_status == "ACTIVE":
          points = round_half_up(points * 2)
      points_awarded = min(points, POINTS_AWARD_CAP)
    input_set: "Exactly one BoatDeal in status SETTLED; its contract_price_cents field and the owning Member.club_card_status at the instant of settlement."
    constants:
      POINTS_BAND_BPS_LOW: 8
      POINTS_BAND_BPS_MID: 12
      POINTS_BAND_BPS_HIGH: 18
      POINTS_BAND_LOW_MAX_CENTS: 5000000
      POINTS_BAND_MID_MAX_CENTS: 15000000
      POINTS_BPS_DENOMINATOR: 100000
      ACTIVE_CARD_MULTIPLIER: 2
      POINTS_AWARD_CAP: 20000
    precision: "integer points, round_half_up applied once to the pre-multiplier total; per-band incremental summation is forbidden"
    variants:
      - name: points_on_contract_value
        when: "default settlement path keyed on BoatDeal.contract_price_cents"
        difference: "awards on the negotiated contract value net of trade credit"
      - name: points_on_msrp_value
        when: "the deal was contracted with the member's club card ACTIVE at contracting time"
        difference: "awards on the undiscounted hull+motor+trailer list value, which is strictly greater than contract_price_cents whenever any trade credit or accessory discount applied"

  - name: deal_fee_and_tax_relay
    trigger: "BoatDeal contract, funding and settlement transitions, always evaluated after boat_deal_contract_price has settled"
    algorithm: circular_ordered
    formula: |
      # The evaluation order is pinned and single-pass; fees are NEVER recomputed
      # after total_fee_cents is known (no circular iteration, no fixed point).
      contract_price_cents = boat_deal_contract_price(...)   # step 1, evaluated first
      fee_base = contract_price_cents
      doc_fee = 59900                     # DOC_FEE_CENTS
      title_fee = 4500 if TitleFiling.filing_kind == "BOAT_TITLE" else 2500
      taxable = fee_base + doc_fee        # tax base EXCLUDES title_fee
      tax = round_half_up(taxable * 0.0725)
      total_fee_cents = doc_fee + title_fee + tax
    input_set: "BoatDeal.contract_price_cents after step 1; the BoatDeal's BOAT_TITLE TitleFiling row when one exists."
    constants:
      DOC_FEE_CENTS: 59900
      TITLE_FEE_BOAT_CENTS: 4500
      TITLE_FEE_OTHER_CENTS: 2500
      SALES_TAX_BPS: 725
      DELIVERY_PREP_CENTS: 25000
    precision: "2 decimal places, round_half_up; tax is rounded once on the whole taxable base, never per component"
    variants:
      - name: basis_contract_price
        when: "deal_stage IN {QUOTED, CONTRACTED}"
        difference: "fee_base == contract_price_cents"
      - name: basis_delivered_settlement
        when: "deal_stage IN {DELIVERED, SETTLED}"
        difference: "fee_base == contract_price_cents + DELIVERY_PREP_CENTS, so the delivered basis adds a delivery-prep charge into the tax base and the total fee"

  - name: delivery_settlement_variance
    trigger: "the BoatDeal CONTRACTED -> DELIVERED transition and the DELIVERED -> CONTRACTED revert"
    algorithm: aggregation
    formula: |
      provisional = boat_deal_contract_price(deal, variant = provisional_quote_price)
      final       = boat_deal_contract_price(deal, variant = contracted_settlement_price)
                 + deal_fee_and_tax_relay(basis = basis_delivered_settlement)
      settlement_variance_cents = final - provisional
      # On the DELIVERED -> CONTRACTED revert the field is reset to 0 and the
      # two sides above recompute from the pre-delivery values.
    input_set: "The single BoatDeal at DELIVERED; its BoatUnit, accepted TradeInAppraisal, and BOAT_TITLE TitleFiling row."
    constants:
      RIGGING_FEE_CENTS: 95000
      DOC_FEE_CENTS: 59900
      SALES_TAX_BPS: 725
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_basis
        when: "computed from the quote-variant price"
        difference: "excludes the rigging fee and halves the tier credit"
      - name: final_basis
        when: "computed from the contracted-variant price plus relayed fees and tax"
        difference: "includes the rigging fee and the full tier credit, so the variance is always positive when the deal straddles at least one band boundary"

  - name: permit_fee
    trigger: "PermitSale creation and every remit-batch correction that supplies a revised_fee_cents"
    algorithm: hybrid_piecewise
    formula: |
      # Algorithm hybrid_piecewise = integer-tiered base + fractional land-access
      # add-on + ONE rounding gate at the end. The gate is what makes the ordering
      # observable: rounding the fractional add-on first yields a different cent.
      bucket = "LE_7"   if term_days <= 7
               else "LE_30" if term_days <= 30
               else "LE_365" if term_days <= 365
               else "GT_365"
      base_micro = TIER_FEE_CENTS[(permit_type, residency_class)] * TERM_BUCKET_STEP_BPS[bucket]
      addon_micro = land_access_units * LAND_ACCESS_UNIT_MICRO_CENTS   # 12.5 cents per unit
      fee_cents = round_half_up((base_micro + addon_micro) / 10000)
    input_set: "The single PermitSale being priced; permit_type, residency_class and term_days are taken from the request, never from the permit's issue date."
    constants:
      TIER_FEE_CENTS:
        FISHING:       { RESIDENT: 3200, NON_RESIDENT: 8400, SENIOR: 1500, YOUTH: 800 }
        HUNTING:       { RESIDENT: 4500, NON_RESIDENT: 12000, SENIOR: 2200, YOUTH: 900 }
        ARCHERY_RANGE: { RESIDENT: 2100, NON_RESIDENT: 3900, SENIOR: 1100, YOUTH: 600 }
        BOAT_REGISTRATION: { RESIDENT: 6500, NON_RESIDENT: 6500, SENIOR: 6500, YOUTH: 6500 }
      TERM_BUCKET_STEP_BPS: { LE_7: 10000, LE_30: 12500, LE_365: 10000, GT_365: 15000 }
      LAND_ACCESS_UNIT_MICRO_CENTS: 125000
      MICRO_CENTS_PER_CENT: 10000
    precision: "2 decimal places; the base is an integer cent value, the add-on stays fractional, and round_half_up is applied exactly ONCE at the end"
    variants:
      - name: exact_rational
        when: "the remit batch is OPEN or CORRECTED (pre-remittance)"
        difference: "the fractional add-on is carried at full precision and rounded once at the end"
      - name: per_unit_rounded
        when: "the remit batch has been SEALED and then CORRECTED and the agency supplies revised_fee_cents"
        difference: "the add-on is rounded per unit before summation, so a FISHING/RESIDENT/LE_7 sale with land_access_units == 3 prices at 3203 under this variant versus 3204 under exact_rational"

  - name: attraction_posture
    trigger: "every AttractionSession transition, every EventOffering publish, and the ops-run checkpoint"
    algorithm: posture_derivation
    formula: |
      store_dwell_free = Store.dwell_capacity_minutes - Σ dwell_charge_minutes
                         over AttractionSession rows of this store with
                         status IN {CONFIRMED, IN_PROGRESS}
                         PLUS EventOffering.dwell_charge_minutes for offerings
                         with status == PUBLISHED
      over_capacity_venues = count of Attraction rows of this store where
                             in_use_units > capacity_units
      expired_waiver_venues = count of Attraction rows of this store where
                             requires_waiver == true and at least one
                             AttractionSession with status == CONFIRMED has a
                             waiver_id whose LiabilityWaiver.expires_on
                             < Store clock now
      if store_dwell_free < 0 or over_capacity_venues > 0:
          posture = FROZEN
      elif store_dwell_free < DWELL_CRITICAL_MINUTES or expired_waiver_venues > 0:
          posture = RESTRICTED
      else:
          posture = OPEN
      # Tie-break: none required — the predicate is a pure function of the
      # enumerated inputs, so identical inputs always yield identical posture.
    input_set: "All AttractionSession rows of the store with status IN {CONFIRMED, IN_PROGRESS}; all EventOffering rows of the store with status == PUBLISHED; all Attraction rows of the store; all LiabilityWaiver rows referenced by confirmed sessions. Rows in REQUESTED, WAITLIST_FALLBACK, COMPLETED, NO_SHOW and CANCELLED are excluded."
    constants:
      DWELL_CRITICAL_MINUTES: 30
    precision: "integer minutes; no rounding"
    variants:
      - name: live_posture
        when: "derived on every read and on every mutation, over the current row set"
        difference: "reacts immediately to each session and offering change"
      - name: checkpoint_posture
        when: "derived during the ops-run checkpoint, ignoring sessions whose slot_start_utc is in the future"
        difference: "a store whose only over-capacity venue is booked for a future slot reads OPEN under this variant and FROZEN under live_posture; the two variants also disagree whenever the budget is thin enough that the 30-minute critical band matters"

  - name: attraction_dwell_charge
    trigger: "AttractionSession REQUESTED -> CONFIRMED and REQUESTED -> WAITLIST_FALLBACK"
    algorithm: tiered_pricing
    formula: |
      per_guest = Attraction.dwell_cost_minutes
      size = party_size
      # Per-band rate applies to the WHOLE size, not marginally.
      size_multiplier = 3 if size >= 10 else 2 if size >= 5 else 1
      if session_kind == "POND_CLINIC" and size < 3:
          size_multiplier = 1        # clinics never qualify for the group rate
      base = per_guest * size_multiplier
      surcharge = 20 if (slot_end_utc - slot_start_utc) > 90 minutes else 0
      dwell_charge_minutes = base + surcharge
    input_set: "The single AttractionSession being confirmed plus its parent Attraction; sessions in WAITLIST_FALLBACK pin the value computed at the original request time and do not recompute."
    constants:
      GROUP_BAND_LOW_MIN_SIZE: 5
      GROUP_BAND_HIGH_MIN_SIZE: 10
      GROUP_MULTIPLIER_LOW: 2
      GROUP_MULTIPLIER_HIGH: 3
      LONG_SLOT_MINUTES: 90
      LONG_SLOT_SURCHARGE_MINUTES: 20
    precision: "integer minutes; round_half_up is applied when a party size straddles a band and per_guest is fractional"
    variants:
      - name: marginal_increment
        when: "applied to general admission at AQUARIUM and MUSEUM venues"
        difference: "the multiplier is applied only to the guests beyond the band floor (3 * per_guest for size 10 becomes 1*per_guest + 2*per_guest for 5 guests + 3*per_guest for 5 guests), producing a smaller charge than the per-band variant"
      - name: whole_party_per_band
        when: "applied to FISHING_POND, ARCHERY_RANGE and SIMULATOR venues"
        difference: "the band multiplier applies to the entire party, so size 10 charges 3 * per_guest"

  - name: no_show_strike
    trigger: "the ops-run checkpoint when a confirmed session's slot ended with no check-in"
    algorithm: decay_function
    formula: |
      # Strikes decay on a step curve keyed to calendar quarters, then the three
      # session-level reset events restart the curve.
      quarters_elapsed = floor((Store clock now - Member.strike_epoch_started_at) / 90 days)
      raw = Σ 1 over AttractionSession rows of this member at this attraction
            with status == NO_SHOW
            and slot_start_utc >= Member.strike_epoch_started_at
      decay_amount = 0.5 * quarters_elapsed          # continuous within a quarter
      effective = max(0, floor(raw - decay_amount))
      # Reset events, evaluated BEFORE the decay because they set the epoch:
      #  - any AttractionSession COMPLETED for the member at this attraction
      #    resets strike_epoch_started_at to that session's slot_start_utc
      #  - a ClubCardApplication ACTIVATED for the member resets
      #    strike_epoch_started_at to the activation instant
      no_show_strikes = effective
      if no_show_strikes >= 3:
          the member's next AttractionSession request at this attraction is
          rejected with ERR_NO_SHOW_STRIKE_LIMIT
    input_set: "AttractionSession rows of the member at one attraction with status == NO_SHOW whose slot_start_utc is at or after Member.strike_epoch_started_at; COMPLETED rows are excluded from the count but do move the epoch."
    constants:
      STRIKE_DECAY_PER_QUARTER: 0.5
      STRIKE_QUARTER_DAYS: 90
      STRIKE_LIMIT: 3
    precision: "integer strikes; floor after subtracting the decay, floored again at zero"
    variants:
      - name: decayed_strikes
        when: "the default path, always subtracting the quarter decay"
        difference: "a member with 3 historical no-shows and two elapsed quarters is admitted (floor(3 - 1.0) == 2)"
      - name: undecayed_strikes
        when: "applied when the member's club card is ACTIVATED during the same quarter as the no-shows"
        difference: "the activation reset sets the epoch to the activation instant, so the pre-activation no-shows fall outside the window and are counted as zero regardless of their count"

  - name: event_dwell_charge
    trigger: "EventOffering DRAFT -> PUBLISHED"
    algorithm: aggregation
    formula: |
      # Marginal admission: the base covers the first half of the cap, the
      # overflow half is charged at double rate, and the SUM is rounded once.
      cap = registration_cap
      if cap == 0:
          dwell_charge_minutes = FREE_DEMO_FLAT_MINUTES
      else:
          base_half = ceil(cap / 2)
          overflow = cap - base_half
          raw = base_half * EVENT_BASE_MINUTES_PER_SEAT
                + overflow * EVENT_BASE_MINUTES_PER_SEAT * 2
          dwell_charge_minutes = round_half_up(raw)
    input_set: "The single EventOffering at publish time; FREE_DEMO offerings with registration_cap == 0 take the flat branch and the seat arithmetic is skipped entirely."
    constants:
      EVENT_BASE_MINUTES_PER_SEAT: 0.5
      FREE_DEMO_FLAT_MINUTES: 15
    precision: "integer minutes, round_half_up applied once to the summed raw value; rounding each half separately is forbidden"
    variants:
      - name: capped_two_phase
        when: "offering_kind IN {SEMINAR, KIDS_WORKSHOP}"
        difference: "the overflow half is double-charged, so a cap of 30 costs 23 minutes instead of the 15 a similar free demo would cost"
      - name: flat_free
        when: "offering_kind == FREE_DEMO"
        difference: "a constant 15 minutes regardless of any registration volume"

  - name: trade_in_credit
    trigger: "TradeInAppraisal PENDING -> ACCEPTED"
    algorithm: waterfall_allocation
    formula: |
      # A single offer is waterfalled through two ordered arcs, then rounded once.
      # Arc 1 always applies (customer), arc 2 is the dealer/Member rebate that
      # applies only when the member's club card is ACTIVE.
      offer = TradeInAppraisal.offer_amount_cents
      if Member.club_card_status == "ACTIVE":
          rebate_bps = ACTIVE_CARD_REBATE_BPS
      else:
          rebate_bps = 0
      if BoatUnit.prior_title_no is null:
          title_penalty_bps = 0
      else:
          title_penalty_bps = PRIOR_TITLE_PENALTY_BPS
      rebate = round_half_up(offer * rebate_bps / 10000)
      penalty = round_half_up(offer * title_penalty_bps / 10000)
      accepted_credit_cents = offer + rebate - penalty
      # Ordering is pinned: the rebate is rounded before it is added and the
      # penalty is rounded before it is subtracted.
    input_set: "The single TradeInAppraisal being accepted plus its BoatUnit and the tendering Member's club_card_status at acceptance time."
    constants:
      ACTIVE_CARD_REBATE_BPS: 300
      PRIOR_TITLE_PENALTY_BPS: 200
    precision: "2 decimal places, round_half_up per arc before combination"
    variants:
      - name: credit_with_rebate
        when: "Member.club_card_status == ACTIVE at acceptance"
        difference: "adds the 3% rebate on the offer"
      - name: credit_without_rebate
        when: "Member.club_card_status IN {NONE, PENDING, SUSPENDED} at acceptance"
        difference: "rebate_bps is 0, so the same offer with a prior title yields a strictly smaller credit"

  - name: club_points_apply
    trigger: "every PointEvent creation, replayed in created_at ASC order with created_seq as the tie-break"
    algorithm: chronological
    formula: |
      order = PointEvent rows for the member sorted by (created_at ASC, created_seq ASC)
      balance = 0
      lifetime = 0
      for ev in order:
          if ev.event_kind in {AWARD, ADJUST}:
              balance += ev.points_delta
              lifetime += ev.points_delta
          elif ev.event_kind == REDEEM:
              # floor, never truncate toward zero
              balance -= abs(ev.points_delta)
          elif ev.event_kind == REVERSAL:
              # a reversal of an AWARD is a negative delta, so
              # lifetime[id] -= abs(delta) for every prior AWARD/ADJUST id
              balance += ev.points_delta
              lifetime -= abs(ev.points_delta) for the single replayed award
          balance = max(balance, 0)
          lifetime = max(lifetime, 0)
      points_balance = balance
      points_lifetime_earned = lifetime
    input_set: "Every PointEvent row for the member; REDEEM rows whose original AWARD was itself reversed are excluded from the balance replay but still count in the ordering."
    constants:
      POINTS_FLOOR: 0
    precision: "integer points; the replay is exact and order-dependent, so the created_at ASC / created_seq ASC ordering is mandatory"
    variants:
      - name: replayed_balance
        when: "always — this is the only path that writes points_balance"
        difference: "a REVERSAL recorded before a later AWARD nets against the earlier award only; swapping two equal-created_at events with different created_seq yields a different intermediate balance and therefore a different floor clamp"

  - name: tier_threshold_eval
    trigger: "after every club_points_apply replay"
    algorithm: threshold
    formula: |
      # Boundary is >=, not >: exactly 25000 lifetime points IS Gold.
      # Downgrades are applied only on the current lifetime value, never on the
      # historical maximum.
      lifetime = Member.points_lifetime_earned
      if lifetime >= PATRON_MIN:   tier = "PATRON"
      elif lifetime >= GOLD_MIN:   tier = "GOLD"
      elif lifetime >= SILVER_MIN: tier = "SILVER"
      else:                        tier = "BASE"
      club_tier = tier
      redeemable_points = max(0, Member.points_balance - TIER_RETAIN_POINTS[tier])
    input_set: "The single Member after the point replay; lifetime 24999 reads SILVER and 25000 reads GOLD."
    constants:
      SILVER_MIN: 8000
      GOLD_MIN: 25000
      PATRON_MIN: 60000
      TIER_RETAIN_POINTS: { BASE: 0, SILVER: 500, GOLD: 1500, PATRON: 4000 }
    precision: "integer points and integer thresholds; the comparison is inclusive on the lower bound"
    variants:
      - name: threshold_inclusive
        when: "the default evaluation"
        difference: "lifetime exactly at a threshold takes the higher tier"
      - name: threshold_exclusive
        when: "used to project the tier the member would hold after a planned redemption is reversed"
        difference: "the same lifetime at a threshold takes the lower tier, so a projected-tier badge computed under this variant disagrees with club_tier at each boundary value"

  - name: conservation_match_accrue
    trigger: "every PointEvent with event_kind == REDEEM, and the ops-run checkpoint"
    algorithm: threshold
    formula: |
      # Only redeemed value is matched, only for opted-in members, and the
      # lifetime accrual is capped with a boundary that triggers AT the cap.
      matchable_cents = round_half_up(abs(ev.points_delta) * 100 / 20)
      # 20 points == 1 dollar of redeemed value, so 1 point == 5 cents.
      proposed = round_half_up(matchable_cents * ClubCardApplication.donation_match_bps / 10000)
      # Cap gate uses >, not >=: reaching exactly the cap is still permitted.
      remaining = MATCH_ANNUAL_CAP_CENTS - Member.conservation_match_cents
      if proposed > remaining:
          granted = max(remaining, 0)
          cap_hit = true
      else:
          granted = proposed
          cap_hit = false
      ev.donation_match_cents = granted
      Member.conservation_match_cents += granted
    input_set: "PointEvent rows with event_kind == REDEEM for members whose donation_opt_in == true and whose club card is ACTIVATED; AWARD, ADJUST and REVERSAL rows are excluded from the match base."
    constants:
      POINTS_PER_DOLLAR: 20
      MATCH_ANNUAL_CAP_CENTS: 500
      CENTS_PER_POINT: 5
    precision: "2 decimal places, round_half_up; the cap gate is strictly greater-than so the cap value itself is reachable"
    variants:
      - name: capped_match
        when: "the member already has accrued match in the calendar year"
        difference: "the grant is clipped to the remaining headroom and cap_hit flips true, so a second redemption in the same year produces a smaller match"
      - name: uncapped_match
        when: "the redemption is the member's first in the calendar year and the proposed grant is below the cap"
        difference: "the whole proposed amount is granted"

  - name: lead_time_actual
    trigger: "the ServiceOrder IN_PROGRESS -> COMPLETED transition and the ops-run checkpoint"
    algorithm: chronological
    formula: |
      # Whole calendar days, counted from started_at_utc to completed_at_utc.
      # The comparison is strict: finishing at exactly the promised day count is
      # on time, finishing at promised + 1 is late.
      actual_lead_days = floor((completed_at_utc - started_at_utc) / 86400 seconds)
      is_late = actual_lead_days > promised_lead_days
      # For a ServiceOrder still IN_PROGRESS, the projection uses the store clock.
      projected_lead_days = floor((Store clock now - started_at_utc) / 86400 seconds)
    input_set: "The single ServiceOrder; at most one order_kind per value may be IN_PROGRESS for a given boat_unit_id, so the running projection never sums across duplicate kinds."
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer whole days, floor; no rounding"
    variants:
      - name: actual_elapsed
        when: "the order has completed"
        difference: "uses completed_at_utc as the right endpoint"
      - name: projected_elapsed
        when: "the order is still IN_PROGRESS at the ops-run checkpoint"
        difference: "uses the store clock as the right endpoint, so the same order reads is_late true under this variant and false under actual_elapsed before it completes"

  - name: intake_project_charge
    trigger: "every ServiceIntake stage-gate transition"
    algorithm: constraint_propagation
    formula: |
      # The charge is a strict function of the stage AND kind, evaluated in a
      # fixed order so no fixed-point iteration is needed.
      base = INTAKE_BASE_CENTS[intake_kind]          # TAXIDERMY 45000, OUTFITTING 12000
      stage_uplift = STAGE_UPLIFT_CENTS[stage]       # PERMIT_VERIFIED 0, MATERIALS_ORDERED 15000, CURING 25000
      specimen_uplift = specimen_quantity * SPECIMEN_UNIT_CENTS[stage >= CURING]
      # SPECIMEN_UNIT_CENTS is 0 before CURING and 3500 at or after CURING.
      charge = base + stage_uplift + specimen_uplift
      project_charge_cents = max(charge, deposit_cents)
      # project_charge_cents can never fall below the deposit already taken.
    input_set: "The single ServiceIntake being advanced plus the stage it is entering."
    constants:
      INTAKE_BASE_CENTS: { TAXIDERMY: 45000, OUTFITTING: 12000, BOAT_SERVICE: 8000 }
      STAGE_UPLIFT_CENTS: { INTAKE_QUOTED: 0, PERMIT_VERIFIED: 0, MATERIALS_ORDERED: 15000, CURING: 25000, READY_FOR_PICKUP: 25000 }
      SPECIMEN_UNIT_CENTS: 3500
    precision: "integer cents; the max() clamp against deposit_cents is applied last"
    variants:
      - name: stage_locked_quote
        when: "quoted before the permit is verified"
        difference: "the specimen uplift is excluded, so a 6-specimen taxidermy intake quotes 45000 and later charges 66000"
      - name: stage_open_quote
        when: "quoted after CURING is entered"
        difference: "includes specimen uplift and the stage uplift, and the deposit clamp can raise the charge above both"

  - name: permit_remit_snapshot
    trigger: "the PermitRemitBatch OPEN -> SEALED transition and every subsequent correction"
    algorithm: dual_variant
    formula: |
      # Two independent reads of the same underlying sales.
      sales = PermitSale rows where store_id == batch.store_id
              and status IN {ISSUED, VOIDED, REMITTED, CORRECTED}
              and created_at >= window_start_utc
              and created_at < window_end_utc          # half-open window
      gross_fee_cents = Σ permit_fee(sale) at seal time   # frozen snapshot
      interpretative_gross_cents = Σ permit_fee(sale) live # recomputed now
      remit_variance_cents = interpretative_gross_cents - gross_fee_cents
    input_set: "PermitSale rows in the half-open window whose status is not VOIDED-before-inclusion; rows created exactly at window_end_utc are excluded and rows created exactly at window_start_utc are included."
    constants:
      WINDOW_END_INCLUSIVE: false
    precision: "integer cents; the two sums are computed independently and never derived from one another"
    variants:
      - name: frozen_snapshot
        when: "read at and after the seal"
        difference: "gross_fee_cents never moves again, even after a correction rewrites sale fees"
      - name: live_reinterpretation
        when: "read at any time"
        difference: "interpretative_gross_cents tracks the corrected sale fees, so remit_variance_cents becomes non-zero exactly when a correction lands"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number = checked first)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present on every request except the three endpoints whose roles include Anonymous"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting X-User-Role is listed in the endpoint's roles per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "the path store_id resolves to a Store row"
    error_id: ERR_STORE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose path begins /stores/{store_id}"

  - priority: 4
    category: existence
    check: "every non-null id referenced in the request body or path resolves to a row of the declared entity type"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "each child id in a nested path belongs to the store_id in the path (for example the AttractionSession being cancelled must have attraction_id whose belonging store equals the path store_id)"
    error_id: ERR_PARENT_MISMATCH
    http_status: 404
    applies_to: "all nested-path endpoints"

  - priority: 5
    category: existence
    check: "a LoadingBayBooking's bay_no is between 1 and the owning Store.load_bays_total inclusive"
    error_id: ERR_BAY_NOT_FOUND
    http_status: 404
    applies_to: "POST /stores/{store_id}/bay-bookings"

  - priority: 6
    category: state
    check: "the target entity is in one of the source states the endpoint's transition declares"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint in §1.5"

  - priority: 7
    category: state
    check: "the target entity is not already in one of its terminal_states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint in §1.5"

  - priority: 8
    category: state
    check: "Store.attraction_posture is not FROZEN for any operation that moves an AttractionSession towards CONFIRMED or IN_PROGRESS"
    error_id: ERR_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /stores/{store_id}/attraction-sessions, POST /stores/{store_id}/attraction-sessions/{session_id}/check-in, POST /stores/{store_id}/service-orders/{order_id}/start"

  - priority: 8
    category: state
    check: "Store.attraction_posture is OPEN rather than RESTRICTED whenever a session is confirmed, checked in, or promoted out of WAITLIST_FALLBACK"
    error_id: ERR_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /stores/{store_id}/attraction-sessions, POST /stores/attraction-sessions/{session_id}/check-in, the ops-run checkpoint promotion path"

  - priority: 9
    category: business_safety
    check: "when Attraction.requires_waiver is true the request must carry a waiver_id referencing a LiabilityWaiver of the matching activity_scope for the same member_id"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /stores/{store_id}/attraction-sessions"

  - priority: 9
    category: business_safety
    check: "an OrderFulfillment with order_kind BOAT_DELIVERY_ORIENTATION must carry a waiver_id for activity_scope BOAT_DELIVERY_ORIENTATION"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /stores/{store_id}/order-fulfillments/{fulfillment_id}/release"

  - priority: 10
    category: business_safety
    check: "the referenced LiabilityWaiver.status == SIGNED and LiabilityWaiver.expires_on >= the store clock's current instant"
    error_id: ERR_WAIVER_EXPIRED
    http_status: 422
    applies_to: "POST /stores/{store_id}/attraction-sessions, POST /stores/{store_id}/order-fulfillments/{fulfillment_id}/release"

  - priority: 10
    category: business_safety
    check: "an ARCHERY_LANE session must have lane_no <= 12 and a SIMULATOR session must have lane_no <= 6"
    error_id: ERR_LANE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /stores/{store_id}/attraction-sessions"

  - priority: 11
    category: business_safety
    check: "a ServiceIntake with intake_kind TAXIDERMY must reference a permit_sale_id whose PermitSale.permit_type IN {HUNTING, ARCHERY_RANGE} and whose PermitSale.status IN {ISSUED, REMITTED}"
    error_id: ERR_PERMIT_VERIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /stores/{store_id}/service-intakes, POST /stores/{store_id}/service-intakes/{intake_id}/verify-permit"

  - priority: 11
    category: business_safety
    check: "an OrderFulfillment release must carry a non-empty rm_cross_check_code that differs from the acting operator's X-User-ID"
    error_id: ERR_RECEIVING_CROSS_CHECK_REQUIRED
    http_status: 422
    applies_to: "POST /stores/{store_id}/order-fulfillments/{fulfillment_id}/release"

  - priority: 12
    category: business_safety
    check: "the member's effective no_show_strikes for this attraction, as derived by the no_show_strike calculation, is strictly below 3 at request time"
    error_id: ERR_NO_SHOW_STRIKE_LIMIT
    http_status: 422
    applies_to: "POST /stores/{store_id}/attraction-sessions"

  - priority: 12
    category: business_safety
    check: "the TitleFiling.state_code equals the originating Store.state_code, and a LIEN_RELEASE filing may not be created for a BoatUnit whose prior_title_no is null"
    error_id: ERR_TITLE_STATE_MISMATCH
    http_status: 422
    applies_to: "POST /stores/{store_id}/title-filings, POST /stores/{store_id}/title-filings/{filing_id}/issue"

  - priority: 13
    category: business_temporal
    check: "a CONFIRMED or IN_PROGRESS AttractionSession on the same attraction_id whose interval overlaps [slot_start_utc, slot_end_utc) must not push the shared capacity over Attraction.capacity_units when the new party_size is added; adjacency is permitted because the interval is half-open"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /stores/{store_id}/attraction-sessions"

  - priority: 13
    category: business_temporal
    check: "a LoadingBayBooking on the same store_id and bay_no whose interval overlaps [booked_start_utc, booked_end_utc) extended by a 15-minute turnover buffer at each end is rejected; adjacency without the buffer is permitted"
    error_id: ERR_BAY_BOOKING_CONFLICT
    http_status: 409
    applies_to: "POST /stores/{store_id}/bay-bookings"

  - priority: 13
    category: business_temporal
    check: "a PUBLISHED EventOffering on the same attraction_id whose interval overlaps [starts_at_utc, ends_at_utc) with zero tolerance for adjacency is rejected"
    error_id: ERR_EVENT_VENUE_CONFLICT
    http_status: 409
    applies_to: "POST /stores/{store_id}/event-offerings, POST /stores/{store_id}/event-offerings/{offering_id}/publish"

  - priority: 14
    category: business_temporal
    check: "slot_end_utc must be strictly after slot_start_utc, and booked_end_utc must be strictly after booked_start_utc"
    error_id: ERR_INVALID_SLOT_WINDOW
    http_status: 422
    applies_to: "POST /stores/{store_id}/attraction-sessions, POST /stores/{store_id}/bay-bookings, POST /stores/{store_id}/event-offerings"

  - priority: 15
    category: business_referential
    check: "BoatUnit.stock_no is unique within store_id"
    error_id: ERR_DUPLICATE_STOCK_NO
    http_status: 409
    applies_to: "POST /stores/{store_id}/boat-units"

  - priority: 15
    category: business_referential
    check: "BoatUnit.hull_id_no is unique within store_id"
    error_id: ERR_DUPLICATE_HIN
    http_status: 409
    applies_to: "POST /stores/{store_id}/boat-units"

  - priority: 15
    category: business_referential
    check: "Member.email is unique within store_id"
    error_id: ERR_DUPLICATE_MEMBER_EMAIL
    http_status: 409
    applies_to: "POST /stores/{store_id}/members"

  - priority: 16
    category: business_constraint
    check: "releasing an OrderFulfillment requires its pre_service_order_id to be a ServiceOrder already in status DELIVERED"
    error_id: ERR_FULFILLMENT_BLOCKED
    http_status: 409
    applies_to: "POST /stores/order-fulfillments/{fulfillment_id}/release"

  - priority: 16
    category: business_constraint
    check: "scheduling a ServiceOrder requires every OrderFulfillment whose pre_service_order_id equals this order to already be in READY_FOR_RELEASE, so a fulfillment cannot be bypassed"
    error_id: ERR_FULFILLMENT_BLOCKED
    http_status: 409
    applies_to: "POST /stores/{store_id}/service-orders/{order_id}/schedule"

  - priority: 16
    category: business_constraint
    check: "at most one ServiceOrder with order_kind RIGGING per deal_id may be in a non-terminal state"
    error_id: ERR_RIGGING_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /stores/{store_id}/service-orders"

  - priority: 17
    category: business_constraint
    check: "Attraction.in_use_units plus the new party_size must not exceed Attraction.capacity_units"
    error_id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /stores/{store_id}/attraction-sessions"

  - priority: 17
    category: business_constraint
    check: "EventOffering.confirmed_count plus seats must not exceed registration_cap when registration_cap > 0"
    error_id: ERR_REGISTRATION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /stores/{store_id}/event-offerings/{offering_id}/registrations, POST /stores/{store_id}/event-offerings/{offering_id}/registrations/{registration_id}/confirm"

  - priority: 18
    category: business_fiscal
    check: "publishing an EventOffering must leave Store.dwell_free_minutes at or above zero after the offering's dwell_charge_minutes is committed"
    error_id: ERR_DWELL_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /stores/{store_id}/event-offerings/{offering_id}/publish"

  - priority: 19
    category: business_fiscal
    check: "sealing a PermitRemitBatch requires at least one eligible PermitSale inside the half-open window [window_start_utc, window_end_utc)"
    error_id: ERR_EMPTY_REMIT_WINDOW
    http_status: 422
    applies_to: "POST /stores/{store_id}/permit-remit-batches/{batch_id}/seal"

  - priority: 19
    category: business_referential
    check: "the sealing operator's X-User-ID must differ from PermitSale.issuer_admin_user_id for every sale in the batch, and a ClubCardApplication's decision_user_id must differ from its underwriter_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /stores/{store_id}/permit-remit-batches/{batch_id}/seal, POST /stores/{store_id}/club-card-applications/{application_id}/decide"

  - priority: 20
    category: business_fiscal
    check: "recording a funding amount below the deal's current balance_due_cents is rejected; an amount at or above balance_due_cents is accepted"
    error_id: ERR_FUNDING_SHORTFALL
    http_status: 422
    applies_to: "POST /stores/{store_id}/boat-deals/{deal_id}/funding"

  - priority: 20
    category: business_fiscal
    check: "settling a deal requires balance_due_cents <= 0, so a zero balance settles and a one-cent balance does not"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 422
    applies_to: "POST /stores/{store_id}/boat-deals/{deal_id}/settle"

  - priority: 21
    category: business_fiscal
    check: "an approved ClubCardApplication must carry credit_limit_cents >= 50000"
    error_id: ERR_CREDIT_LIMIT_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /stores/{store_id}/club-card-applications/{application_id}/decide"

  - priority: 22
    category: business_constraint
    check: "a PermitSale.term_days must be >= 1 and land_access_units must be >= 0, so a zero-day term is rejected at the boundary"
    error_id: ERR_INVALID_TERM_DAYS
    http_status: 422
    applies_to: "POST /stores/{store_id}/permit-sales"

  - priority: 22
    category: business_constraint
    check: "a ServiceIntake advancing to MATERIALS_ORDERED must have deposit_cents >= 5000"
    error_id: ERR_OUTSTANDING_DEPOSIT_REQUIRED
    http_status: 422
    applies_to: "POST /stores/{store_id}/service-intakes/{intake_id}/order-materials"

  - priority: 23
    category: business_constraint
    check: "ServiceIntake.specimen_quantity is immutable once the intake has reached MATERIALS_ORDERED, and TradeInAppraisal.appraised_at_utc is immutable once written"
    error_id: ERR_TYPE_IMMUTABLE
    http_status: 422
    applies_to: "PUT /stores/{store_id}/service-intakes/{intake_id}, PUT /stores/{store_id}/trade-in-appraisals/{appraisal_id}"

  - priority: 24
    category: business_constraint
    check: "required input fields are present, enum members are valid, and numeric fields are non-negative, except PointEvent.points_delta which is signed by design"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 25
    category: state
    check: "the OCC expected version field equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /stores/{store_id}/order-fulfillments, POST /stores/{store_id}/permit-sales"

# -----------------------------------------------------------------------------
# Priority-conflict pinning (declared so downstream test generators can assert
# the winning error deterministically when two rules fail in one request):
#   (a) business_safety p9 ERR_WAIVER_REQUIRED  beats business_fiscal p18 ERR_DWELL_BUDGET_EXCEEDED
#   (b) state p7 ERR_ALREADY_TERMINAL           beats business_safety p9 ERR_WAIVER_REQUIRED
#   (c) business_safety p11 ERR_PERMIT_VERIFICATION_REQUIRED beats business_constraint p17 ERR_VENUE_CAPACITY_EXCEEDED
#   (d) business_temporal p13 ERR_SESSION_OVERLAP beats business_constraint p17 ERR_REGISTRATION_CAP_EXCEEDED
# -----------------------------------------------------------------------------

# =============================================================================
# §1.5 API Endpoint Table
#   Reads are flat canonical resource routes (GET /stores/<segment>/{id}) so that
#   every FK declared in §1.1 is reverse-reachable; writes are store-scoped.
# =============================================================================
endpoints:

  # ---- platform / test-driving -----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical store clock. The server's startup default is exactly 2026-09-01T00:00:00Z; until this endpoint is called the clock reads that fixed instant and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["expired waiver, no-show, dwell and lead-time rules are all evaluated against this clock"]

  - method: POST
    path: "/stores/{store_id}/ops-run"
    description: "Ops-run checkpoint: advances the store epoch, expires overdue waivers, promotes waitlisted sessions and registrations, marks no-shows, completes finished events, abandons stale intakes and re-derives attraction_posture."
    roles: [PlatformAdmin, StoreManager]
    code: 200
    input: []
    output: { permit_remit_epoch: integer, promoted_sessions: integer, promoted_registrations: integer, expired_waivers: integer, posture: string }
    side_effects: ["Store.permit_remit_epoch += 1", "Store.last_ops_run_at stamped", "runs attraction_posture, no_show_strike, lead_time_actual, permit_remit_snapshot"]

  # ---- Store -----------------------------------------------------------------
  - method: POST
    path: "/stores"
    description: "Create a destination store"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "state_code", "dealer_license_no", "dwell_capacity_minutes", "load_bays_total"]
    output: Store
    side_effects: ["attraction_posture initialised to OPEN"]

  - method: GET
    path: "/stores/{store_id}"
    description: "Read a store including its derived posture, dwell and remit ledger fields"
    roles: [PlatformAdmin, StoreManager, Anonymous]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: GET
    path: "/stores"
    description: "List stores"
    roles: [PlatformAdmin, StoreManager]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  # ---- Member ----------------------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/members"
    description: "Enrol a club member"
    roles: [Anonymous, StoreManager, PermitClerk, DealDeskClerk]
    code: 201
    input: ["email", "full_name", "donation_opt_in?"]
    output: Member
    side_effects: ["club_card_status initialised to NONE", "club_tier initialised to BASE"]

  - method: GET
    path: "/stores/members/{member_id}"
    description: "Read a member including points, tier and conservation match"
    roles: [StoreManager, PlatformAdmin, Member, PermitClerk]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/stores/members"
    description: "List members, optionally filtered by home store"
    roles: [StoreManager, PlatformAdmin]
    code: 200
    input: ["store_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: PATCH
    path: "/stores/members/{member_id}"
    description: "Update a member's mutable profile flags"
    roles: [StoreManager, Member]
    code: 200
    input: ["full_name?", "donation_opt_in?"]
    output: Member
    side_effects: ["recompute redeemable_points against the new donation_opt_in flag"]

  # ---- Attraction ------------------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/attractions"
    description: "Stand up an attraction venue inside a store"
    roles: [StoreManager]
    code: 201
    input: ["attraction_type", "capacity_units", "dwell_cost_minutes"]
    output: Attraction
    side_effects: ["requires_waiver derived from attraction_type"]

  - method: GET
    path: "/stores/attractions/{attraction_id}"
    description: "Read a venue including in-use units and waiver requirement"
    roles: [StoreManager, AttractionHost, PlatformAdmin, Anonymous]
    code: 200
    input: []
    output: Attraction
    side_effects: []

  - method: GET
    path: "/stores/attractions"
    description: "List venues, optionally filtered by store"
    roles: [StoreManager, AttractionHost, PlatformAdmin]
    code: 200
    input: ["store_id?", "attraction_type?", "status?", "limit?", "offset?"]
    output: Attraction[]
    side_effects: []

  - method: GET
    path: "/stores/attractions/{attraction_id}/sessions"
    description: "List the sessions booked on a venue"
    roles: [StoreManager, AttractionHost, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AttractionSession[]
    side_effects: []

  - method: POST
    path: "/stores/attractions/{attraction_id}/open"
    description: "Open a venue for sessions"
    roles: [StoreManager]
    code: 200
    input: []
    output: Attraction
    side_effects: ["Attraction.status PLANNED -> OPEN", "re-evaluate attraction_posture"]

  # ---- LiabilityWaiver -------------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/waivers"
    description: "Record a signed liability waiver for an activity scope"
    roles: [Member, AttractionHost, StoreManager]
    code: 201
    input: ["member_id", "activity_scope", "signed_at_utc", "waiver_term_days?"]
    output: LiabilityWaiver
    side_effects: ["waiver_expiry computes expires_on", "any earlier SIGNED waiver for the same member and scope moves to SUPERSEDED"]

  - method: GET
    path: "/stores/waivers/{waiver_id}"
    description: "Read a waiver"
    roles: [AttractionHost, StoreManager, PlatformAdmin, Member]
    code: 200
    input: []
    output: LiabilityWaiver
    side_effects: []

  - method: GET
    path: "/stores/waivers"
    description: "List waivers, optionally filtered by member, scope or store"
    roles: [AttractionHost, StoreManager, PlatformAdmin]
    code: 200
    input: ["member_id?", "activity_scope?", "store_id?", "limit?", "offset?"]
    output: LiabilityWaiver[]
    side_effects: []

  - method: GET
    path: "/stores/waivers/{waiver_id}/sessions"
    description: "List the attraction sessions presented under a waiver"
    roles: [AttractionHost, StoreManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AttractionSession[]
    side_effects: []

  - method: GET
    path: "/stores/waivers/{waiver_id}/fulfillments"
    description: "List the order fulfillments presented under a waiver"
    roles: [ReceivingManager, StoreManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OrderFulfillment[]
    side_effects: []

  # ---- AttractionSession -----------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/attraction-sessions"
    description: "Request a venue session; the system auto-confirms, waitlists or rejects on the declared preconditions"
    roles: [AttractionHost, StoreManager, Anonymous]
    code: 201
    input: ["attraction_id", "member_id", "session_kind", "party_size", "slot_start_utc", "slot_end_utc", "waiver_id?", "lane_no?"]
    output: AttractionSession
    side_effects: ["attraction_dwell_charge computes dwell_charge_minutes", "attraction_posture re-derived", "Store.dwell_committed_minutes and Store.dwell_free_minutes recomputed"]

  - method: GET
    path: "/stores/sessions/{session_id}"
    description: "Read a session"
    roles: [AttractionHost, StoreManager, PlatformAdmin, Member]
    code: 200
    input: []
    output: AttractionSession
    side_effects: []

  - method: GET
    path: "/stores/sessions"
    description: "List sessions, optionally filtered by venue, member, waiver or store"
    roles: [AttractionHost, StoreManager, PlatformAdmin]
    code: 200
    input: ["attraction_id?", "member_id?", "waiver_id?", "store_id?", "status?", "limit?", "offset?"]
    output: AttractionSession[]
    side_effects: []

  - method: POST
    path: "/stores/attraction-sessions/{session_id}/check-in"
    description: "Check a confirmed party into its venue slot"
    roles: [AttractionHost]
    code: 200
    input: []
    output: AttractionSession
    side_effects: ["AttractionSession.status CONFIRMED -> IN_PROGRESS"]

  - method: POST
    path: "/stores/attraction-sessions/{session_id}/complete"
    description: "Complete an in-progress session and record any overrun"
    roles: [AttractionHost]
    code: 200
    input: []
    output: AttractionSession
    side_effects: ["overrun_minutes recorded", "strike escalation when overrun exceeds 30 minutes", "capacity released and posture re-derived"]

  - method: POST
    path: "/stores/attraction-sessions/{session_id}/cancel"
    description: "Cancel a session and release its capacity"
    roles: [AttractionHost, PlatformAdmin]
    code: 200
    input: []
    output: AttractionSession
    side_effects: ["Attraction.in_use_units released", "attraction_posture re-derived"]

  # ---- BoatUnit --------------------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/boat-units"
    description: "Receive a boat hull into dealer inventory"
    roles: [DealDeskClerk, StoreManager]
    code: 201
    input: ["stock_no", "model_name", "unit_price_cents", "unit_condition", "hull_id_no", "motor_price_cents?", "trailer_price_cents?", "prior_title_no?"]
    output: BoatUnit
    side_effects: ["BoatUnit.status initialised to AVAILABLE"]

  - method: GET
    path: "/stores/boat-units/{boat_unit_id}"
    description: "Read a boat unit"
    roles: [DealDeskClerk, StoreManager, PlatformAdmin, Member]
    code: 200
    input: []
    output: BoatUnit
    side_effects: []

  - method: GET
    path: "/stores/boat-units"
    description: "List boat units, optionally filtered by store, status or condition"
    roles: [DealDeskClerk, StoreManager, PlatformAdmin]
    code: 200
    input: ["store_id?", "status?", "unit_condition?", "limit?", "offset?"]
    output: BoatUnit[]
    side_effects: []

  - method: PATCH
    path: "/stores/boat-units/{boat_unit_id}"
    description: "Reprice or re-describe a boat unit before it is committed to a deal"
    roles: [DealDeskClerk, StoreManager]
    code: 200
    input: ["model_name?", "unit_price_cents?", "motor_price_cents?", "trailer_price_cents?"]
    output: BoatUnit
    side_effects: ["every BoatDeal referencing this unit is repriced via boat_deal_contract_price"]

  # ---- TradeInAppraisal ------------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/appraisals"
    description: "Open an appraisal for a used unit tendered as a trade"
    roles: [DealDeskClerk]
    code: 201
    input: ["member_id", "boat_unit_id", "offer_amount_cents"]
    output: TradeInAppraisal
    side_effects: ["TradeInAppraisal.status initialised to PENDING"]

  - method: GET
    path: "/stores/appraisals/{appraisal_id}"
    description: "Read an appraisal"
    roles: [DealDeskClerk, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: TradeInAppraisal
    side_effects: []

  - method: GET
    path: "/stores/appraisals"
    description: "List appraisals, optionally filtered by trade unit, member or store"
    roles: [DealDeskClerk, StoreManager, PlatformAdmin]
    code: 200
    input: ["boat_unit_id?", "member_id?", "store_id?", "status?", "limit?", "offset?"]
    output: TradeInAppraisal[]
    side_effects: []

  - method: GET
    path: "/stores/appraisals/{appraisal_id}/boat-deals"
    description: "List the deals that applied an appraisal"
    roles: [DealDeskClerk, StoreManager, PlatformAdmin]
    code: 200
    input: ["deal_stage?", "limit?", "offset?"]
    output: BoatDeal[]
    side_effects: []

  - method: PUT
    path: "/stores/trade-in-appraisals/{appraisal_id}"
    description: "Revise a pending appraisal's offer or description; the server-stamped appraised_at_utc is refused"
    roles: [DealDeskClerk, StoreManager]
    code: 200
    input: ["offer_amount_cents?", "appraised_at_utc?"]
    output: TradeInAppraisal
    side_effects: ["TradeInAppraisal.offer_amount_cents updated when supplied", "an attempt to rewrite appraised_at_utc is rejected with ERR_TYPE_IMMUTABLE and nothing else on the row changes"]

  - method: POST
    path: "/stores/appraisals/{appraisal_id}/accept"
    description: "Accept the trade offer and grant credited value"
    roles: [DealDeskClerk]
    code: 200
    input: []
    output: TradeInAppraisal
    side_effects: ["TradeInAppraisal.status PENDING -> ACCEPTED", "trade_in_credit computes accepted_credit_cents", "any earlier ACCEPTED appraisal for the same boat_unit_id moves to SUPERSEDED"]

  - method: POST
    path: "/stores/appraisals/{appraisal_id}/decline"
    description: "Decline the trade offer"
    roles: [DealDeskClerk]
    code: 200
    input: ["decline_reason"]
    output: TradeInAppraisal
    side_effects: ["TradeInAppraisal.status PENDING -> DECLINED"]

  # ---- TitleFiling -----------------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/title-filings"
    description: "Open a title, motor-title, trailer-registration or lien-release filing"
    roles: [TitleClerk, DealDeskClerk]
    code: 201
    input: ["boat_unit_id", "filing_kind", "state_code"]
    output: TitleFiling
    side_effects: ["TitleFiling.status initialised to DRAFT"]

  - method: GET
    path: "/stores/title-filings/{filing_id}"
    description: "Read a title filing"
    roles: [TitleClerk, DealDeskClerk, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: TitleFiling
    side_effects: []

  - method: GET
    path: "/stores/title-filings"
    description: "List title filings, optionally filtered by unit, store or state"
    roles: [TitleClerk, DealDeskClerk, StoreManager, PlatformAdmin]
    code: 200
    input: ["boat_unit_id?", "store_id?", "state_code?", "status?", "limit?", "offset?"]
    output: TitleFiling[]
    side_effects: []

  - method: POST
    path: "/stores/title-filings/{filing_id}/submit"
    description: "Transmit a draft filing to the state agency"
    roles: [TitleClerk]
    code: 200
    input: []
    output: TitleFiling
    side_effects: ["TitleFiling.status DRAFT -> SUBMITTED", "filed_at_utc stamped"]

  - method: POST
    path: "/stores/title-filings/{filing_id}/issue"
    description: "Record the agency's issuance; drives the BoatDeal title dimension"
    roles: [TitleClerk, AgencyOperator]
    code: 200
    input: ["agency_reference"]
    output: TitleFiling
    side_effects: ["TitleFiling.status SUBMITTED -> ISSUED", "BoatDeal.title_status FILED -> ISSUED", "may fire BoatDeal CONTRACTED -> DELIVERED"]

  - method: POST
    path: "/stores/title-filings/{filing_id}/reject"
    description: "Record an agency rejection; forces the deal back one stage"
    roles: [AgencyOperator]
    code: 200
    input: ["rejection_reason"]
    output: TitleFiling
    side_effects: ["TitleFiling.status SUBMITTED or ISSUED -> REJECTED", "BoatDeal.deal_stage DELIVERED -> CONTRACTED, the cyclic revert"]

  # ---- BoatDeal --------------------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/boat-deals"
    description: "Quote a boat deal against an available unit"
    roles: [DealDeskClerk]
    code: 201
    input: ["member_id", "boat_unit_id", "trade_in_appraisal_id?", "deposit_cents?"]
    output: BoatDeal
    side_effects: ["boat_deal_contract_price computes the provisional quote price", "all four state dimensions initialised"]

  - method: GET
    path: "/stores/boat-deals/{deal_id}"
    description: "Read a deal including its four state dimensions and computed money fields"
    roles: [DealDeskClerk, FinanceAdmin, StoreManager, PlatformAdmin, Member]
    code: 200
    input: []
    output: BoatDeal
    side_effects: []

  - method: GET
    path: "/stores/boat-deals"
    description: "List deals, optionally filtered by store, member, unit, appraisal or stage"
    roles: [DealDeskClerk, FinanceAdmin, StoreManager, PlatformAdmin]
    code: 200
    input: ["store_id?", "member_id?", "boat_unit_id?", "trade_in_appraisal_id?", "deal_stage?", "limit?", "offset?"]
    output: BoatDeal[]
    side_effects: []

  - method: POST
    path: "/stores/boat-deals/{deal_id}/contract"
    description: "Contract a quoted deal; recomputes price, relays fees and opens the title filing"
    roles: [DealDeskClerk]
    code: 200
    input: ["expected_deal_version"]
    output: BoatDeal
    side_effects: ["boat_deal_contract_price recomputed", "deal_fee_and_tax_relay recomputed", "TitleFiling created and BoatDeal CONTRACTED"]

  - method: POST
    path: "/stores/boat-deals/{deal_id}/funding"
    description: "Record a funding amount against the deal, advancing the funding dimension"
    roles: [FinanceAdmin]
    code: 200
    input: ["amount_cents", "expected_deal_version"]
    output: BoatDeal
    side_effects: ["funding_status UNFUNDED -> PENDING or PENDING -> FUNDED", "balance_due_cents recomputed", "may fire CONTRACTED -> DELIVERED"]


  - method: POST
    path: "/stores/boat-deals/{deal_id}/refund"
    description: "Refund a funded deal, returning the funding dimension to REFUNDED"
    roles: [FinanceAdmin]
    code: 200
    input: ["expected_deal_version"]
    output: BoatDeal
    side_effects: ["funding_status FUNDED -> REFUNDED", "funded_amount_cents zeroed", "balance_due_cents recomputed"]

  - method: POST
    path: "/stores/boat-deals/{deal_id}/settle"
    description: "Settle a delivered deal and award club points"
    roles: [FinanceAdmin]
    code: 200
    input: ["expected_deal_version"]
    output: BoatDeal
    side_effects: ["deal_points_award computes points_awarded", "PointEvent AWARD created", "club_points_apply and tier_threshold_eval run", "conservation_match_accrue runs"]

  - method: GET
    path: "/stores/{store_id}/dwell-summary"
    description: "Computed read of the store's dwell budget and derived attraction posture"
    roles: [StoreManager, PlatformAdmin, EventsCoordinator]
    code: 200
    input: []
    output: { dwell_capacity_minutes: integer, dwell_committed_minutes: integer, dwell_free_minutes: integer, attraction_posture: string, over_capacity_venues: integer, expired_waiver_venues: integer }
    side_effects: ["re-derives attraction_posture without mutating rows"]

  # ---- PermitSale ------------------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/permit-sales"
    description: "Sell a seasonal license or permit at the service counter"
    roles: [PermitClerk]
    code: 201
    input: ["member_id", "permit_type", "residency_class", "term_days", "land_access_units?", "agent_user_id", "permit_remit_batch_id", "expected_remit_batch_version"]
    output: PermitSale
    side_effects: ["permit_fee computes fee_cents", "PermitSale.status initialised to ISSUED", "increments PermitRemitBatch.version by 1", "recompute permit_remit_snapshot"]

  - method: GET
    path: "/stores/permit-sales/{sale_id}"
    description: "Read a permit sale"
    roles: [PermitClerk, RemitAdmin, StoreManager, PlatformAdmin, Member]
    code: 200
    input: []
    output: PermitSale
    side_effects: []

  - method: GET
    path: "/stores/permit-sales"
    description: "List permit sales, optionally filtered by batch, store, member or status"
    roles: [PermitClerk, RemitAdmin, StoreManager, PlatformAdmin]
    code: 200
    input: ["permit_remit_batch_id?", "store_id?", "member_id?", "status?", "limit?", "offset?"]
    output: PermitSale[]
    side_effects: []

  - method: GET
    path: "/stores/permit-sales/{sale_id}/service-intakes"
    description: "List the taxidermy intakes verified against a permit sale"
    roles: [ServiceWriter, PermitClerk, StoreManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceIntake[]
    side_effects: []

  - method: POST
    path: "/stores/permit-sales/{sale_id}/void"
    description: "Void an unremitted permit sale"
    roles: [PermitClerk, PlatformAdmin]
    code: 200
    input: []
    output: PermitSale
    side_effects: ["PermitSale.status ISSUED -> VOIDED", "when the sale was previously CORRECTED, permit_fee recomputed and the batch variance recomputed"]

  # ---- PermitRemitBatch ------------------------------------------------------
  - method: POST
    path: "/stores/{store_id}/permit-remit-batches"
    description: "Open a remittance window for state permit fees"
    roles: [RemitAdmin]
    code: 201
    input: ["window_start_utc", "window_end_utc"]
    output: PermitRemitBatch
    side_effects: ["PermitRemitBatch.status initialised to OPEN"]

  - method: GET
    path: "/stores/permit-remit-batches/{batch_id}"
    description: "Read a remit batch including the frozen and live gross totals"
    roles: [RemitAdmin, PlatformAdmin, StoreManager]
    code: 200
    input: []
    output: PermitRemitBatch
    side_effects: []

  - method: GET
    path: "/stores/permit-remit-batches"
    description: "List remit batches, optionally filtered by store"
    roles: [RemitAdmin, PlatformAdmin, StoreManager]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: PermitRemitBatch[]
    side_effects: []

  - method: POST
    path: "/stores/permit-remit-batches/{batch_id}/seal"
    description: "Seal the batch, freezing the gross fee snapshot and validating segregation of duties"
    roles: [RemitAdmin]
    code: 200
    input: ["remitter_admin_user_id"]
    output: PermitRemitBatch
    side_effects: ["permit_remit_snapshot computes gross_fee_cents, interpretative_gross_cents and remit_variance_cents", "Store.remit_ledger_cents += gross_fee_cents", "status OPEN -> SEALED"]

  - method: POST
    path: "/stores/permit-remit-batches/{batch_id}/transmit"
    description: "Transmit a sealed batch to the state agency"
    roles: [RemitAdmin]
    code: 200
    input: []
    output: PermitRemitBatch
    side_effects: ["status SEALED -> TRANSMITTED"]

  - method: POST
    path: "/stores/permit-remit-batches/{batch_id}/acknowledge"
    description: "Record the state agency receipt and move the batch's sales to REMITTED"
    roles: [AgencyOperator]
    code: 200
    input: ["agency_ack_no"]
    output: PermitRemitBatch
    side_effects: ["status TRANSMITTED -> ACCEPTED", "every sale in the batch moves to REMITTED", "Store.permit_remit_epoch += 1"]

  - method: POST
    path: "/stores/permit-remit-batches/{batch_id}/reject-correction"
    description: "Record an agency correction with revised fees, producing a non-zero remit variance"
    roles: [AgencyOperator]
    code: 200
    input: ["sale_id", "revised_fee_cents"]
