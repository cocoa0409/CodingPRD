# =============================================================================
# Task 1848 — §1.9 Scaffold Corner Design (Coverage Index for non-Difficulty tests)
# Breadth walk over §1.1–§1.7 per claim-extraction-guide. Names are unique across
# both design files. Canonical cycle scaffold: clock 2026-08-20T00:00:00Z, cycle
# window [2026-08-15, 2026-12-15), referral_close_on 2026-09-30, profile P_BAND
# (0.40/0.30/0.20/0.10; cut 95, floor 88, cut_2e 90, floor_2e 82), publish with
# ${cyc_v} captured from cycle create, advance OPEN.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: student_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Student]
        distinguishing_aspect: "POST /gifted/students with is_ell omitted returns 201 with is_ell == false, gifted_status == NOT_IDENTIFIED, has_active_sped_plan == false, server-minted id/created_at/updated_at and version == 1."
        test_recipe:
          setup: ["site exists"]
          setup_api_calls:
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
          trigger:
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "ASIAN", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id, ver: $.data.version } }
          assert:
            - "response 201; is_ell == false (default applied); gifted_status == NOT_IDENTIFIED; has_active_sped_plan == false"
            - "id is a server-minted UUID, created_at/updated_at present, version == 1"

      - name: student_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Student
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /gifted/students without demographic_group is rejected with ERR_INVALID_REQUEST (400); no row is created."
        test_recipe:
          setup: ["site exists"]
          setup_api_calls:
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
          trigger:
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: student_get_not_found_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Student
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /gifted/students/{unknown uuid} returns 404 ERR_NOT_FOUND with the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /gifted/students/00000000-0000-0000-0000-000000000000", as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (http 404); response_type == error"

      - name: sped_plan_creation_marks_twice_exceptional
        claim_type: computed_fields
        grounds: [entities.SpedPlan, entities.Student.fields.has_active_sped_plan]
        distinguishing_aspect: "After SpecialEdCoordinator registers an IEP, the student's computed has_active_sped_plan flips to true."
        test_recipe:
          setup: ["site; grade-5 student"]
          setup_api_calls:
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 5, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
          trigger:
            - { call: "POST /gifted/students/${stu}/sped-plans", payload: { plan_type: "IEP", started_on: "2026-01-15" }, as: SpecialEdCoordinator }
            - { call: "GET /gifted/students/${stu}", as: GiftedCoordinator, captures: { flag: $.data.has_active_sped_plan } }
          assert:
            - "SpedPlan created 201 with plan_type IEP, student_id == ${stu}"
            - "flag == true after creation"

      - name: duplicate_sped_plan_rejected
        claim_type: violation_to_error
        grounds:
          - entities.SpedPlan
          - errors[ERR_DUPLICATE_SPED_PLAN]
        distinguishing_aspect: "A second SpedPlan for the same student fails with ERR_DUPLICATE_SPED_PLAN (409) — one plan per student."
        test_recipe:
          setup: ["site; student with an existing IEP"]
          setup_api_calls:
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 5, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/students/${stu}/sped-plans", payload: { plan_type: "IEP", started_on: "2026-01-15" }, as: SpecialEdCoordinator }
          trigger:
            - { call: "POST /gifted/students/${stu}/sped-plans", payload: { plan_type: "PLAN_504", started_on: "2026-06-01" }, as: SpecialEdCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_SPED_PLAN (http 409)"

      - name: case_transfer_honor_auto_identifies
        claim_type: valid_transition
        grounds: [state_machines.GiftedCase, entities.GiftedCase.fields.pathway]
        distinguishing_aspect: "A TRANSFER_HONOR case created inside the honoring windows lands directly in IDENTIFIED (no screening), stamps decided_on == today, and flips the student's gifted_status in the same request."
        test_recipe:
          setup: ["clock 2026-08-20; site; student created today; cycle P_BAND published and OPEN"]
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
          trigger:
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
          assert:
            - "GiftedCase.${case_id}.status == IDENTIFIED and decided_on == 2026-08-20 (immediate honoring, composite_score stays null)"
            - "Student.${stu}.gifted_status == IDENTIFIED"

      - name: placement_offer_stamps_accept_window
        claim_type: computed_fields
        grounds: [entities.ServicePlacement.fields.accept_by, entities.ServicePlacement.fields.offered_on]
        distinguishing_aspect: "A created placement offer is stamped offered_on == today and accept_by == today + 30 days (2026-08-20 -> 2026-09-19), status OFFERED, student_id denormalized from the case."
        test_recipe:
          setup: ["clock 2026-08-20; site; student honored via TRANSFER_HONOR"]
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
          trigger:
            - { call: "POST /gifted/cases/${case_id}/placements", payload: { site_id: "${site_id}", service_model: "CLUSTER", start_on: "2026-09-01" }, as: GiftedCoordinator, captures: { plc: $.data.id } }
          assert:
            - "ServicePlacement.${plc}.status == OFFERED, offered_on == 2026-08-20, accept_by == 2026-09-19, student_id == ${stu}, end_on == null"

      - name: reevaluation_created_scheduled
        claim_type: initial_state
        grounds: [state_machines.ReEvaluation]
        distinguishing_aspect: "A new re-evaluation starts in SCHEDULED (not IN_REVIEW) when its due_on is in the future."
        test_recipe:
          setup: ["clock 2026-08-20; site; student honored; placement ACTIVE"]
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/placements", payload: { site_id: "${site_id}", service_model: "PULL_OUT", start_on: "2026-09-01" }, as: GiftedCoordinator, captures: { plc: $.data.id } }
            - { call: "POST /gifted/placements/${plc}/accept", payload: {}, as: ParentGuardian, as_user_id: "guard-1" }
          trigger:
            - { call: "POST /gifted/placements/${plc}/re-evaluations", payload: { due_on: "2027-05-01" }, as: GiftedCoordinator, captures: { re: $.data.id } }
          assert:
            - "ReEvaluation.${re}.status == SCHEDULED; outcome and exit_score are null"

      - name: review_vote_tallies_computed
        claim_type: computed_fields
        grounds: [entities.CommitteeReview.fields.qualify_votes, entities.CommitteeReview.fields.abstain_votes]
        distinguishing_aspect: "After one QUALIFY and one ABSTAIN vote, the review's computed tallies read qualify_votes == 1, abstain_votes == 1, deny_votes == 0, and the review is still VOTING (no threshold locked)."
        test_recipe:
          setup: ["clock 2026-08-20; site; student scored into band (composite 94, AWAITING_COMMITTEE); cycle REVIEW; BAND_REVIEW open"]
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ABILITY", percentile: 99, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 90, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 88, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "SCORING" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/finalize-scoring", payload: {}, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "REVIEW" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/committee-reviews", payload: { review_kind: "BAND_REVIEW", grounds: "band" }, as: GiftedCoordinator, captures: { rev: $.data.id } }
          trigger:
            - { call: "POST /gifted/committee-reviews/${rev}/votes", payload: { verdict: "QUALIFY" }, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /gifted/committee-reviews/${rev}/votes", payload: { verdict: "ABSTAIN" }, as: CommitteeMember, as_user_id: "cm-2" }
            - { call: "GET /gifted/committee-reviews/${rev}", as: GiftedCoordinator, captures: { q: $.data.qualify_votes, a: $.data.abstain_votes, st: $.data.status } }
          assert:
            - "q == 1, a == 1, deny_votes == 0, st == VOTING (1 QUALIFY does not lock the threshold)"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: cycle_advance_rejects_skip_returns_invalid_cycle_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ScreeningCycle
          - errors[ERR_INVALID_CYCLE_STATE]
        distinguishing_aspect: "Advancing a DRAFT cycle directly to REVIEW (skipping OPEN/SCORING) is rejected; only the immediate successor state is legal."
        test_recipe:
          setup: ["one DRAFT cycle"]
          setup_api_calls:
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id } }
          trigger:
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "REVIEW" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_CYCLE_STATE (http 409); cycle remains DRAFT"

      - name: cycle_open_requires_published_profile
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ScreeningCycle.DRAFT_to_OPEN
          - errors[ERR_NO_PUBLISHED_PROFILE]
        distinguishing_aspect: "DRAFT -> OPEN is rejected with ERR_NO_PUBLISHED_PROFILE while the cycle has no PUBLISHED cut-score profile (a DRAFT profile does not count)."
        test_recipe:
          setup: ["cycle with one DRAFT (never published) profile"]
          setup_api_calls:
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator }
          trigger:
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_PUBLISHED_PROFILE (http 409); cycle remains DRAFT"

      - name: cycle_finalize_blocked_by_open_cases
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ScreeningCycle
          - errors[ERR_CYCLE_HAS_OPEN_CASES]
        distinguishing_aspect: "REVIEW -> FINALIZED is rejected with ERR_CYCLE_HAS_OPEN_CASES while a case is still AWAITING_COMMITTEE; deciding the case first unblocks the same advance."
        test_recipe:
          setup: ["clock 2026-08-20; site; student scored into band (AWAITING_COMMITTEE); cycle in REVIEW with BAND_REVIEW open"]
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ABILITY", percentile: 99, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 90, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 88, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "SCORING" }, as: GiftedCoordinator }
