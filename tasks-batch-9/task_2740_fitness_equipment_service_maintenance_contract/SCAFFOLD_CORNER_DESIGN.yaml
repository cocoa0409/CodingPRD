          - response_envelope.pagination_defaults
        distinguishing_aspect: "Five calls are narrowed to three by a two-field filter and then paged with limit 2 / offset 1, so total_count must report the filtered three rather than the stored five or the returned two — and the out-of-range limit is rejected instead of being silently clamped."
