      - name: equipment_liability_rounds_per_line_before_summation
        grounds:
          - calculations.equipment_loss_settlement
          - entities.Trainee.fields.equipment_liability_cents
          - entities.EquipmentIssuance.fields.settlement_cents
        distinguishing_aspect: |
          Mode (b) instance - nested rounding where ORDER decides the cents: both lines land on an
          exact half cent (17700*0.9850 = 17434.5 and 8300*0.9850 = 8175.5). Rounding each line first
          and then summing gives 25611; summing first and rounding once gives 25610. The scaffold pins
          round-per-line-then-sum, so 25611 is the only correct total.
