            - "Case ${c2}: vested 100001 -> force_out_path == SAFE_HARBOR_IRA (one cent over flips the band)"
            - "Case ${c3}: vested 700000 -> force_out_path == SAFE_HARBOR_IRA (inclusive)"
            - "Case ${c4}: vested 700001 -> force_out_path == INELIGIBLE_REMAINS and case_status == SETTLED with executed_path == REMAIN_IN_PLAN (no notice, no money movement)"

      - name: election_window_inclusive_deadline
        grounds:
          - calculations.notice_window_deadline
          - errors[ERR_ELECTION_WINDOW_CLOSED]
        distinguishing_aspect: |
          Metric: time, endpoint: POST /distribution-cases/{id}/elections. The 30-day deadline is
          INCLUSIVE: an election at exactly delivered_at + 30 days succeeds; the identical election at
          deadline + 1 second fails with ERR_ELECTION_WINDOW_CLOSED (no sweep run, so the case is still
          NOTIFIED and the temporal rule — not a state rule — fires).
        test_recipe:
          setup:
            - "One batch LOCKED with two cases; FORCE_OUT_ELECTION notices for both DELIVERED at the default clock 2026-08-01T00:00:00Z (deadline 2026-08-31T00:00:00.000Z)"
