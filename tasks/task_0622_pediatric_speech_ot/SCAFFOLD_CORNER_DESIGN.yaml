        test_recipe:
          setup: ["An EXHAUSTED authorization (authorized 1, reserved 1) put into REAUTH_REQUESTED. The client captured the version at request time but an intervening cancel+rebook would have bumped it; we force staleness with ${var}-1."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
