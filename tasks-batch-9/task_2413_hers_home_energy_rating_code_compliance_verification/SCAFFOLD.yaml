scenario: |
  Generate task harder than expert level!

  2413. HERS Home Energy Rating & Code Compliance Verification (RESNET rating provider): rater and rating-field-inspector certification and quality-assurance sampling, plan-based projected rating vs confirmed as-built rating, rough-in and final inspection checkpoints with blower door and duct leakage testing, sampling protocol for production builder subdivisions, HERS index calculation and code-compliance path selection, registry submission and rating file locking, builder corrective action on failed thresholds, tax-credit and utility-program documentation packages
domain_name: "hers-rating-code-compliance"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: "Expert (upper end — 12 entities, 44 endpoints, 44 error codes, 35 ordered validations, 10 calculations, 7 state machines)"
  notes: |
    Rating carries four independent state dimensions (stage x compliance_status x qa_status x
    registry_status). SampleSet, CorrectiveAction and Rater add cycles. Money and home-coverage
    ledgers on Builder/Subdivision are conserved quantities that compensating actions must restore.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Builder
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Builder company name"
      - name: builder_type
        type: enum
        source: input
        description: "PRODUCTION builders may use the sampling protocol; CUSTOM builders may not"
        constraints: "PRODUCTION | CUSTOM"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE by default; set to SAMPLING_SUSPENDED by a QA major failure, a rating void, or a failed sample set"
        default: "ACTIVE"
        constraints: "ACTIVE | SAMPLING_SUSPENDED"
      - name: utility_program_budget_cents
        type: integer
        source: input
        description: "Total utility-program incentive dollars (in cents) the builder may have certified across all DocumentPackage rows"
        constraints: ">= 0"
      - name: sampling_eligible
        type: boolean
        source: computed
        description: "true iff builder_type == PRODUCTION AND status == ACTIVE AND open_corrective_action_count == 0"
      - name: open_corrective_action_count
        type: integer
        source: computed
        description: "Count of CorrectiveAction rows with status IN {OPEN, SUBMITTED, ESCALATED} whose Rating belongs (via Home) to a Subdivision of this Builder"
        default: 0
      - name: revoked_package_count
        type: integer
        source: computed
        description: "Count of DocumentPackage rows with status == REVOKED reachable from this Builder"
        default: 0
      - name: certified_incentive_cents
        type: integer
        source: computed
        description: "Conserved money ledger: sum of certified_amount_cents over DocumentPackage rows with status == ISSUED reachable from this Builder"
        default: 0

  - name: Subdivision
    parent: Builder
    common_fields: true
    fields:
      - name: builder_id
        type: string
        source: input
        description: "FK -> Builder.id; the builder that owns this subdivision"
      - name: name
        type: string
        source: input
        description: "Subdivision name"
      - name: code_edition
        type: enum
        source: input
        description: "Energy code edition adopted by the jurisdiction; selects ERI targets, ACH50 limits and the PV index cap"
        constraints: "IECC_2015 | IECC_2021"
      - name: climate_zone
        type: enum
        source: input
        description: "IECC climate zone; selects the envelope load factor and the ERI target"
        constraints: "CZ2 | CZ3 | CZ4 | CZ5 | CZ6"
      - name: sampling_enabled
        type: boolean
        source: input
        description: "Whether the sampling protocol may be used in this subdivision"
        default: false
      - name: compliance_path_preference
        type: enum
        source: input
        description: "Binding code-compliance path election for every Rating in this subdivision; PRESCRIPTIVE_PATH forgoes any index-based path"
        default: "ERI_PATH"
        constraints: "ERI_PATH | PRESCRIPTIVE_PATH"
      - name: homes_count
        type: integer
        source: computed
        description: "Count of Home rows whose subdivision_id == this id"
        default: 0
      - name: sampled_home_count
        type: integer
        source: computed
        description: "Count of Home rows in this subdivision whose sample_set_id is non-null"
        default: 0
      - name: unsampled_home_count
        type: integer
        source: computed
        description: "Conserved coverage ledger: homes_count - sampled_home_count; invariant sampled_home_count + unsampled_home_count == homes_count"
        default: 0

  - name: PlanModel
    parent: Subdivision
    common_fields: true
    fields:
      - name: subdivision_id
        type: string
        source: input
        description: "FK -> Subdivision.id; the subdivision this plan is offered in"
      - name: plan_code
        type: string
        source: input
        description: "Builder plan code; unique per subdivision"
      - name: conditioned_floor_area_sqft
        type: number
        source: input
        description: "Conditioned floor area (CFA) used by the reference-load and duct-leakage normalizations"
        constraints: "> 0"
      - name: conditioned_volume_cuft
        type: number
        source: input
        description: "Conditioned volume used by the ACH50 normalization"
        constraints: "> 0"
      - name: bedrooms
        type: integer
        source: input
        description: "Bedroom count feeding the reference load"
        constraints: ">= 1"
      - name: envelope_ua_btu_per_hr_f
        type: number
        source: input
        description: "Design envelope UA; also gated against CFA by the PERFORMANCE and PRESCRIPTIVE paths"
        constraints: "> 0"
      - name: design_ach50
        type: number
        source: input
        description: "Design (plan-based) air changes per hour at 50 Pa, used by the PROJECTED variant"
        constraints: "> 0"
      - name: design_duct_leakage_cfm25_per_100sqft
        type: number
        source: input
        description: "Design total duct leakage in CFM25 per 100 sqft of CFA, used by the PROJECTED variant"
        constraints: ">= 0"
      - name: hvac_efficiency_index
        type: number
        source: input
        description: "HVAC efficiency index (higher is better) feeding the clamped equipment multiplier"
        constraints: "1 .. 20"
      - name: pv_capacity_kw_dc
        type: number
        source: input
        description: "On-site photovoltaic DC capacity; index credit is capped by code edition"
        default: 0
        constraints: ">= 0"
      - name: projected_index
        type: integer
        source: computed
        description: "hers_index PROJECTED variant evaluated from this plan's design values"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on creation; ARCHIVED is set when the owning subdivision's sampling is voided by cascade A"
        default: "ACTIVE"
        constraints: "ACTIVE | ARCHIVED"

  - name: Home
    parent: Subdivision
    common_fields: true
    fields:
      - name: subdivision_id
        type: string
        source: input
        description: "FK -> Subdivision.id; the subdivision this lot sits in"
      - name: plan_model_id
        type: string
        source: input
        description: "FK -> PlanModel.id; the plan built on this lot"
      - name: sample_set_id
        type: string
        source: computed
        description: "FK -> SampleSet.id; non-null while this home is a member of a sample set, null after withdrawal or release"
        default: null
      - name: lot_number
        type: string
        source: input
        description: "Lot identifier; unique per subdivision"
      - name: permit_date
        type: string
        source: input
        description: "Building-permit date (YYYY-MM-DD); must fall inside a SampleSet window for membership"
      - name: sampling_role
        type: enum
        source: computed
        description: "UNASSIGNED until added to a sample set; MEMBER once added; TESTED once selected as the tested home; REPRESENTED once the set is closed and this home inherits the tested home's index"
        default: "UNASSIGNED"
        constraints: "UNASSIGNED | MEMBER | TESTED | REPRESENTED"
      - name: individual_testing_required
        type: boolean
        source: computed
        description: "Set true when a sample set covering this home fails or is voided; such a home may never be represented again and must be tested individually"
        default: false

  - name: Rater
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Certified person's name"
      - name: cert_level
        type: enum
        source: input
        description: "RATER may create and confirm ratings; RATING_FIELD_INSPECTOR may only perform inspections and tests; QA_DESIGNEE may only complete QA reviews"
        constraints: "RATER | RATING_FIELD_INSPECTOR | QA_DESIGNEE"
      - name: certification_status
        type: enum
        source: computed
        description: "ACTIVE on creation; PROBATION after one QA failure; SUSPENDED after the second; back to ACTIVE via reinstate"
        default: "ACTIVE"
        constraints: "ACTIVE | PROBATION | SUSPENDED"
      - name: effective_certification_status
        type: enum
        source: computed
        description: "certification_status, except EXPIRED when the logical clock is at or after cert_expires_at; all certification gates read this field"
        constraints: "ACTIVE | PROBATION | SUSPENDED | EXPIRED"
      - name: cert_expires_at
        type: datetime
        source: input
        description: "Certification expiry instant; at or after it the effective status is EXPIRED"
      - name: qa_failure_count
        type: integer
        source: computed
        description: "Count of QAReview rows for this reviewee with result IN {FAIL_MINOR, FAIL_MAJOR}"
        default: 0
      - name: confirmed_rating_count
        type: integer
        source: computed
        description: "Count of Rating rows with rater_id == this id whose stage IN {CONFIRMED, REGISTERED}"
        default: 0
      - name: qa_completed_count
        type: integer
        source: computed
        description: "Count of QAReview rows with reviewee rater_id == this id and status == COMPLETED"
        default: 0
      - name: qa_files_owed
        type: integer
        source: computed
        description: "qa_sampling_quota output: max(0, required_files - qa_completed_count)"
        default: 0
      - name: registry_hold
        type: boolean
        source: computed
        description: "true iff qa_files_owed > 0; blocks registry submission by this rater"
        default: false

  - name: Rating
    parent: Home
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: "FK -> Home.id; the rated home"
      - name: rater_id
        type: string
        source: input
        description: "FK -> Rater.id; the certified rater of record"
      - name: plan_model_id
        type: string
        source: computed
        description: "FK -> PlanModel.id; pinned snapshot of the home's plan at rating creation, so later plan edits cannot move this rating's numbers"
      - name: supersedes_rating_id
        type: string
        source: input
        description: "FK -> Rating.id; self-referential link to the rating this one replaces (VOID or QA_FAILED predecessor)"
        default: null
      - name: stage
        type: enum
        source: computed
        description: "Workflow dimension: PROJECTED on creation, ROUGH_IN_VERIFIED after a passing rough-in, CONFIRMED after as-built confirmation, REGISTERED after registry acceptance, VOID when voided"
        default: "PROJECTED"
        constraints: "PROJECTED | ROUGH_IN_VERIFIED | CONFIRMED | REGISTERED | VOID"
      - name: compliance_status
        type: enum
        source: computed
        description: "Code dimension: UNDETERMINED until confirmation, then PASSING or FAILING per compliance_path_selection; REMEDIATION_PENDING while a corrective action is accepted but not re-confirmed"
        default: "UNDETERMINED"
        constraints: "UNDETERMINED | PASSING | FAILING | REMEDIATION_PENDING"
      - name: qa_status
        type: enum
        source: computed
        description: "QA dimension: NOT_SELECTED until a QAReview is assigned, QA_SELECTED while assigned (and still QA_SELECTED after a FAIL_MINOR result, which opens a QA_FINDING corrective action instead of failing the file), QA_PASSED on a PASS result, QA_FAILED only on FAIL_MAJOR"
        default: "NOT_SELECTED"
        constraints: "NOT_SELECTED | QA_SELECTED | QA_PASSED | QA_FAILED"
      - name: registry_status
        type: enum
        source: computed
        description: "Registry dimension: NOT_SUBMITTED, PENDING after submission, then ACCEPTED or REJECTED"
        default: "NOT_SUBMITTED"
        constraints: "NOT_SUBMITTED | PENDING | ACCEPTED | REJECTED"
      - name: projected_index
        type: integer
        source: computed
        description: "hers_index PROJECTED variant copied from the pinned PlanModel at creation"
      - name: confirmed_index
        type: integer
        source: computed
        description: "hers_index CONFIRMED variant from measured as-built values; null until confirmation, and cleared when a sample set covering this home fails"
        default: null
      - name: confirmed_ach50
        type: number
        source: computed
        description: "normalized_value of the governing BLOWER_DOOR DiagnosticTest at the FINAL checkpoint"
        default: null
      - name: confirmed_duct_leakage_cfm25_per_100sqft
        type: number
        source: computed
        description: "normalized_value of the governing DUCT_LEAKAGE_TOTAL DiagnosticTest at the FINAL checkpoint"
        default: null
      - name: eri_target
        type: integer
        source: computed
        description: "ERI target for the subdivision's code_edition and climate_zone, snapshotted at confirmation"
        default: null
      - name: compliance_path
        type: enum
        source: computed
        description: "Path selected by compliance_path_selection at confirmation"
        default: "NONE"
        constraints: "ERI | PERFORMANCE | PRESCRIPTIVE | NONE"
      - name: submitted_index
        type: integer
        source: computed
        description: "confirmed_index frozen at registry submission time"
        default: null
      - name: registry_confirmation_number
        type: string
        source: computed
        description: "Registry-issued confirmation number recorded on acceptance"
        default: null
      - name: rejection_reason
        type: string
        source: computed
        description: "Registry-supplied rejection reason recorded on rejection"
        default: null
      - name: file_locked
        type: boolean
        source: computed
        description: "true from registry submission onward; blocks inspections, tests, confirmation and re-submission but not document packages"
        default: false
      - name: confirmed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the confirm transition"
        default: null

  - name: Inspection
    parent: Rating
    common_fields: true
    fields:
      - name: rating_id
        type: string
        source: input
        description: "FK -> Rating.id; the rating this checkpoint belongs to"
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Rater.id; the person performing the checkpoint"
      - name: checkpoint
        type: enum
        source: input
        description: "ROUGH_IN (pre-drywall) or FINAL (as-built)"
        constraints: "ROUGH_IN | FINAL"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the inspector's site window"
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Exclusive end of the inspector's site window; must be strictly after scheduled_start_utc"
      - name: air_handler_installed
        type: boolean
        source: input
        description: "Whether the air handler was installed at test time; relaxes the ROUGH_IN duct-leakage threshold"
        default: false
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED on creation; PASSED or FAILED on completion depending on failed_test_count"
        default: "SCHEDULED"
        constraints: "SCHEDULED | PASSED | FAILED"
      - name: failed_test_count
        type: integer
        source: computed
        description: "Count of DiagnosticTest rows under this inspection with result == FAIL"
        default: 0

  - name: DiagnosticTest
    parent: Inspection
    common_fields: false
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the checkpoint this measurement was taken at"
      - name: test_type
        type: enum
        source: input
        description: "BLOWER_DOOR measures CFM50; DUCT_LEAKAGE_TOTAL measures total duct leakage CFM25"
        constraints: "BLOWER_DOOR | DUCT_LEAKAGE_TOTAL"
      - name: measured_value
        type: number
        source: input
        description: "Raw instrument reading: CFM50 for BLOWER_DOOR, CFM25 for DUCT_LEAKAGE_TOTAL"
        constraints: ">= 0"
      - name: normalized_value
        type: number
        source: computed
        description: "blower_door_normalization or duct_leakage_normalization output, 2 decimal places"
      - name: threshold_value
        type: number
        source: computed
        description: "Applicable limit for this test_type, code edition, climate zone and checkpoint"
      - name: result
        type: enum
        source: computed
        description: "PASS iff normalized_value <= threshold_value, else FAIL"
        constraints: "PASS | FAIL"
      - name: performed_at_utc
        type: datetime
        source: computed
        description: "Logical-clock instant at which the measurement was recorded; append-only, never updated"

  - name: SampleSet
    parent: Subdivision
    common_fields: true
    fields:
      - name: subdivision_id
        type: string
        source: input
        description: "FK -> Subdivision.id; the subdivision whose homes this set samples"
      - name: window_start_date
        type: string
        source: input
        description: "Inclusive first permit date covered by this set (YYYY-MM-DD)"
      - name: window_end_date
        type: string
        source: input
        description: "Inclusive last permit date covered by this set (YYYY-MM-DD); must be >= window_start_date"
      - name: status
        type: enum
        source: computed
        description: "FORMING while members are added, SELECTED once the tested home is picked, TESTED once that home's rating is confirmed, then CLOSED_PASS or FAILED_EXPANDED; VOIDED_SAMPLING when cascade A tears sampling down"
        default: "FORMING"
        constraints: "FORMING | SELECTED | TESTED | CLOSED_PASS | FAILED_EXPANDED | VOIDED_SAMPLING"
      - name: tested_home_id
        type: string
        source: computed
        description: "FK -> Home.id; the member home the selector picked for full testing"
        default: null
      - name: member_count
        type: integer
        source: computed
        description: "Count of Home rows whose sample_set_id == this id"
        default: 0
      - name: tested_member_count
        type: integer
        source: computed
        description: "Count of member homes with sampling_role == TESTED (0 or 1)"
        default: 0
      - name: represented_member_count
        type: integer
        source: computed
        description: "Count of member homes with sampling_role == REPRESENTED"
        default: 0
      - name: representative_index
        type: integer
        source: computed
        description: "sample_set_representative_index output assigned to every represented home at CLOSED_PASS"
        default: null

  - name: QAReview
    parent: Rating
    common_fields: true
    fields:
      - name: rating_id
        type: string
        source: input
        description: "FK -> Rating.id; the rating file under quality-assurance review"
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> Rater.id; the QA designee performing the review; must not be the rating's own rater"
      - name: review_type
        type: enum
        source: input
        description: "FILE_REVIEW inspects the rating file; FIELD_REVIEW re-inspects the home"
        constraints: "FILE_REVIEW | FIELD_REVIEW"
      - name: status
        type: enum
        source: computed
        description: "ASSIGNED on creation, COMPLETED once a result is recorded"
        default: "ASSIGNED"
        constraints: "ASSIGNED | COMPLETED"
      - name: result
        type: enum
        source: computed
        description: "PASS clears the rating; FAIL_MINOR puts the rater on probation; FAIL_MAJOR triggers cascade A"
        default: null
        constraints: "PASS | FAIL_MINOR | FAIL_MAJOR"
      - name: findings_note
        type: string
        source: computed
        description: "Reviewer narrative recorded at completion"
        default: null

  - name: CorrectiveAction
    parent: Rating
    common_fields: true
    fields:
      - name: rating_id
        type: string
        source: input
        description: "FK -> Rating.id; the failing rating this action remediates"
      - name: reason
        type: enum
        source: computed
        description: "THRESHOLD_FAILURE from a failing confirmation, SAMPLE_SET_FAILURE from cascade B, QA_FINDING from a QAReview completed with result FAIL_MINOR"
        constraints: "THRESHOLD_FAILURE | SAMPLE_SET_FAILURE | QA_FINDING"
      - name: status
        type: enum
        source: computed
        description: "OPEN on cascade creation, SUBMITTED once the builder responds, ACCEPTED or REJECTED by the provider, ESCALATED on the third rejection"
        default: "OPEN"
        constraints: "OPEN | SUBMITTED | ACCEPTED | REJECTED | ESCALATED"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of builder submissions recorded on this action"
        default: 0
      - name: remediation_note
        type: string
        source: computed
        description: "Latest builder-supplied remediation narrative"
        default: null

  - name: DocumentPackage
    parent: Rating
    common_fields: true
    fields:
      - name: rating_id
        type: string
        source: input
        description: "FK -> Rating.id; the rating the package documents"
      - name: package_type
        type: enum
        source: input
        description: "TAX_CREDIT_45L is a tiered flat amount; UTILITY_PROGRAM is a per-line-item measure calculation"
        constraints: "TAX_CREDIT_45L | UTILITY_PROGRAM"
      - name: status
        type: enum
        source: computed
        description: "DRAFT on creation, ISSUED once certified, REVOKED by cascade A or a rating void, SUPERSEDED when a newer DRAFT of the same type replaces it"
        default: "DRAFT"
        constraints: "DRAFT | ISSUED | REVOKED | SUPERSEDED"
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: "incentive_amount PROVISIONAL variant, computed at DRAFT creation from projected_index and design values"
      - name: certified_amount_cents
        type: integer
        source: computed
        description: "incentive_amount CERTIFIED variant, computed at issue from confirmed_index and measured values"
        default: null
      - name: line_items
        type: array
        source: computed
        description: "Ordered per-measure line items [{code, amount_cents}] for UTILITY_PROGRAM; empty array for TAX_CREDIT_45L"
        default: []
      - name: revocation_reason
        type: string
        source: computed
        description: "Why the package was revoked (QA_MAJOR_FAILURE or RATING_VOID)"
        default: null
      - name: issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant of issuance"
        default: null

state_machines:
  - entity: Rating
    initial_state: PROJECTED
    terminal_states: [VOID]
    shape: "parallel — four independent dimensions on one row"
    parallel_dimensions:
      - dimension: stage
        initial: PROJECTED
        terminal: [VOID]
        note: "REGISTERED is not terminal: a REGISTERED rating can still be voided."
      - dimension: compliance_status
        initial: UNDETERMINED
        terminal: []
      - dimension: qa_status
        initial: NOT_SELECTED
        terminal: [QA_FAILED]
      - dimension: registry_status
        initial: NOT_SUBMITTED
        terminal: []
    transitions:
      - id: PROJECTED_to_ROUGH_IN_VERIFIED
        dimension: stage
        from: PROJECTED
        to: ROUGH_IN_VERIFIED
        trigger: "POST /inspections/{id}/complete on an Inspection with checkpoint == ROUGH_IN"
        actor: FieldInspector
        preconditions:
          - "Rating.stage == PROJECTED"
          - "Rating.file_locked == false"
          - "Inspection.status == SCHEDULED and Inspection.failed_test_count == 0"
          - "Inspection has at least one DiagnosticTest with test_type == DUCT_LEAKAGE_TOTAL"
        side_effects:
          - "Inspection.status := PASSED"
          - "Rating.stage := ROUGH_IN_VERIFIED"
        note: "If Inspection.failed_test_count > 0 the inspection completes as FAILED and Rating.stage stays PROJECTED (see Inspection machine)."
      - id: PROJECTED_to_CONFIRMED
        dimension: stage
        from: PROJECTED
        to: CONFIRMED
        trigger: "POST /ratings/{id}/confirm"
        actor: CertifiedRater
        preconditions:
          - "Rating.stage == PROJECTED"
          - "Rating.file_locked == false"
          - "Rater.effective_certification_status IN {ACTIVE, PROBATION}"
          - "A FINAL Inspection for this rating has status IN {PASSED, FAILED} and carries one BLOWER_DOOR and one DUCT_LEAKAGE_TOTAL DiagnosticTest (else ERR_MISSING_GOVERNING_TEST)"
        side_effects:
          - "Rating.confirmed_ach50 := normalized_value of the governing FINAL BLOWER_DOOR test"
          - "Rating.confirmed_duct_leakage_cfm25_per_100sqft := normalized_value of the governing FINAL DUCT_LEAKAGE_TOTAL test"
          - "recompute hers_index CONFIRMED variant into Rating.confirmed_index"
          - "Rating.eri_target := ERI_TARGET[code_edition][climate_zone]"
          - "run compliance_path_selection: sets Rating.compliance_path and Rating.compliance_status := PASSING | FAILING"
          - "Rating.confirmed_at := logical clock"
          - "Rater.confirmed_rating_count += 1, then recompute qa_sampling_quota into Rater.qa_files_owed and Rater.registry_hold"
          - "if Rating.compliance_status == FAILING: create CorrectiveAction{reason: THRESHOLD_FAILURE, status: OPEN} for this rating; that creation increments Builder.open_corrective_action_count, which recomputes Builder.sampling_eligible to false"
          - "if the home's sampling_role == TESTED: owning SampleSet.status := TESTED"
        note: "Skipping the rough-in checkpoint is legal; only the FINAL checkpoint governs confirmation."
      - id: ROUGH_IN_VERIFIED_to_CONFIRMED
        dimension: stage
        from: ROUGH_IN_VERIFIED
        to: CONFIRMED
        trigger: "POST /ratings/{id}/confirm"
        actor: CertifiedRater
        preconditions:
          - "Rating.stage == ROUGH_IN_VERIFIED"
          - "same preconditions as PROJECTED_to_CONFIRMED"
        side_effects:
          - "identical side-effect set to PROJECTED_to_CONFIRMED"
      - id: CONFIRMED_to_CONFIRMED
        dimension: stage
        from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /ratings/{id}/confirm (re-confirmation after remediation)"
        actor: CertifiedRater
        preconditions:
          - "Rating.stage == CONFIRMED"
          - "Rating.compliance_status == REMEDIATION_PENDING"
          - "Rating.file_locked == false"
          - "A FINAL Inspection newer than Rating.confirmed_at carries both governing tests"
        side_effects:
          - "re-evaluate hers_index CONFIRMED and compliance_path_selection from the newest governing FINAL tests"
          - "Rating.compliance_status := PASSING | FAILING"
          - "Rating.confirmed_at := logical clock"
          - "Rater.confirmed_rating_count is NOT incremented again for the same rating"
        note: "Self-loop: the cycle CONFIRMED -> (remediation) -> CONFIRMED is how a failed home re-enters compliance."
      - id: CONFIRMED_to_REGISTERED
        dimension: stage
        from: CONFIRMED
        to: REGISTERED
        trigger: "POST /ratings/{id}/registry-decision with outcome == ACCEPT"
        actor: RatingProviderAdmin
        preconditions:
          - "Rating.stage == CONFIRMED"
          - "Rating.registry_status == PENDING"
        side_effects:
          - "Rating.registry_status := ACCEPTED"
          - "Rating.registry_confirmation_number := payload confirmation_number"
          - "Rating.stage := REGISTERED"
          - "Rating.file_locked stays true"
      - id: NONTERMINAL_to_VOID
        dimension: stage
        from: "PROJECTED | ROUGH_IN_VERIFIED | CONFIRMED | REGISTERED"
        to: VOID
        trigger: "POST /ratings/{id}/void"
        actor: RatingProviderAdmin
        preconditions:
          - "Rating.stage != VOID"
        side_effects:
          - "Rating.stage := VOID; Rating.file_locked := true; Rating.compliance_status := FAILING"
          - "cascade C hop 1: every DocumentPackage of this rating with status == ISSUED becomes REVOKED with revocation_reason RATING_VOID"
          - "cascade C hop 2: each such revocation decrements Builder.certified_incentive_cents by that package's certified_amount_cents and increments Builder.revoked_package_count"
          - "cascade C hop 3: when Builder.revoked_package_count becomes >= 1 the Builder.status := SAMPLING_SUSPENDED, which recomputes Builder.sampling_eligible to false"
          - "every DocumentPackage of this rating with status == DRAFT becomes SUPERSEDED"
      - id: UNDETERMINED_to_PASSING
        dimension: compliance_status
        from: UNDETERMINED
        to: PASSING
        trigger: "compliance_path_selection during a confirm transition"
        actor: system
        preconditions:
          - "confirmed_index, confirmed_ach50 and confirmed_duct_leakage_cfm25_per_100sqft are all populated"
          - "the selected path is ERI, PERFORMANCE or PRESCRIPTIVE"
        side_effects:
          - "Rating.compliance_path := ERI | PERFORMANCE | PRESCRIPTIVE"
      - id: UNDETERMINED_to_FAILING
        dimension: compliance_status
        from: UNDETERMINED
        to: FAILING
        trigger: "compliance_path_selection during a confirm transition"
        actor: system
        preconditions:
          - "no compliance path qualifies"
        side_effects:
          - "Rating.compliance_path := NONE"
          - "create CorrectiveAction{reason: THRESHOLD_FAILURE, status: OPEN}"
      - id: FAILING_to_REMEDIATION_PENDING
        dimension: compliance_status
        from: FAILING
        to: REMEDIATION_PENDING
        trigger: "POST /corrective-actions/{id}/review with decision == ACCEPT"
        actor: RatingProviderAdmin
        preconditions:
          - "CorrectiveAction.status == SUBMITTED"
          - "Rating.stage != VOID"
        side_effects:
          - "CorrectiveAction.status := ACCEPTED"
          - "Builder.open_corrective_action_count -= 1, which recomputes Builder.sampling_eligible"
          - "Rating.compliance_status := REMEDIATION_PENDING (re-confirmation now permitted)"
      - id: REMEDIATION_PENDING_to_PASSING
        dimension: compliance_status
        from: REMEDIATION_PENDING
        to: PASSING
        trigger: "POST /ratings/{id}/confirm (re-confirmation)"
        actor: CertifiedRater
        preconditions:
          - "the newest governing FINAL tests now satisfy a compliance path"
        side_effects:
          - "Rating.compliance_path := ERI | PERFORMANCE | PRESCRIPTIVE"
      - id: REMEDIATION_PENDING_to_FAILING
        dimension: compliance_status
        from: REMEDIATION_PENDING
        to: FAILING
        trigger: "POST /ratings/{id}/confirm (re-confirmation that still misses every path)"
        actor: CertifiedRater
        preconditions:
          - "the newest governing FINAL tests still satisfy no compliance path"
        side_effects:
          - "Rating.compliance_path := NONE"
          - "create a further CorrectiveAction{reason: THRESHOLD_FAILURE, status: OPEN}"
      - id: PASSING_to_FAILING
        dimension: compliance_status
        from: PASSING
        to: FAILING
        trigger: "cascade B — the SampleSet covering this home closes as FAILED_EXPANDED"
        actor: system
        preconditions:
          - "Home.sampling_role == REPRESENTED and the covering SampleSet closes FAILED_EXPANDED"
        side_effects:
          - "Rating.confirmed_index := null; Rating.compliance_path := NONE"
          - "create CorrectiveAction{reason: SAMPLE_SET_FAILURE, status: OPEN}"
      - id: NOT_SELECTED_to_QA_SELECTED
        dimension: qa_status
        from: NOT_SELECTED
        to: QA_SELECTED
        trigger: "POST /qa-reviews"
        actor: RatingProviderAdmin
        preconditions:
          - "Rating.stage IN {CONFIRMED, REGISTERED}"
          - "Rating.qa_status == NOT_SELECTED"
          - "QAReview.reviewer_id != Rating.rater_id"
        side_effects:
          - "QAReview created with status ASSIGNED"
          - "Rating.qa_status := QA_SELECTED"
      - id: QA_SELECTED_to_QA_PASSED
        dimension: qa_status
        from: QA_SELECTED
        to: QA_PASSED
        trigger: "POST /qa-reviews/{id}/complete with result == PASS"
        actor: QADesignee
        preconditions:
          - "QAReview.status == ASSIGNED"
        side_effects:
          - "QAReview.status := COMPLETED; QAReview.result := PASS"
          - "Rating.qa_status := QA_PASSED"
          - "Rater.qa_completed_count += 1, then recompute qa_sampling_quota (qa_files_owed, registry_hold)"
      - id: QA_SELECTED_to_QA_FAILED
        dimension: qa_status
        from: QA_SELECTED
        to: QA_FAILED
        trigger: "POST /qa-reviews/{id}/complete with result == FAIL_MAJOR"
        actor: QADesignee
        preconditions:
          - "QAReview.status == ASSIGNED"
        side_effects:
          - "QAReview.status := COMPLETED; QAReview.result := FAIL_MAJOR"
          - "Rating.qa_status := QA_FAILED"
          - "Rater.qa_failure_count += 1 and Rater.certification_status steps ACTIVE -> PROBATION -> SUSPENDED"
          - "Rater.qa_completed_count += 1, then recompute qa_sampling_quota; a PROBATION rater owes 100% of confirmed files"
          - "cascade A (see QAReview machine) revokes ISSUED packages, decrements the builder ledger, suspends the builder, voids open sample sets and releases their member homes"
        note: "A FAIL_MINOR result does NOT move this dimension: the rating stays QA_SELECTED and a QA_FINDING CorrectiveAction is opened instead, so the file remains submittable once that action is accepted."
      - id: NOT_SUBMITTED_to_PENDING
        dimension: registry_status
        from: NOT_SUBMITTED
        to: PENDING
        trigger: "POST /ratings/{id}/submit-to-registry"
        actor: CertifiedRater
        preconditions:
          - "Rating.stage == CONFIRMED"
          - "Rating.compliance_status == PASSING"
          - "Rating.registry_status IN {NOT_SUBMITTED, REJECTED}"
          - "Rating.file_locked == false"
          - "Rater.effective_certification_status IN {ACTIVE, PROBATION}"
          - "Rater.registry_hold == false"
        side_effects:
          - "Rating.registry_status := PENDING"
          - "Rating.submitted_index := Rating.confirmed_index"
          - "Rating.file_locked := true"
      - id: REJECTED_to_PENDING
        dimension: registry_status
        from: REJECTED
        to: PENDING
        trigger: "POST /ratings/{id}/submit-to-registry (re-submission after a registry rejection)"
        actor: CertifiedRater
        preconditions:
          - "Rating.registry_status == REJECTED and Rating.file_locked == false"
        side_effects:
          - "Rating.registry_status := PENDING; Rating.rejection_reason := null; Rating.file_locked := true"
        note: "Cycle: PENDING -> REJECTED -> PENDING."
      - id: PENDING_to_ACCEPTED
        dimension: registry_status
        from: PENDING
        to: ACCEPTED
        trigger: "POST /ratings/{id}/registry-decision with outcome == ACCEPT"
        actor: RatingProviderAdmin
        preconditions:
          - "Rating.registry_status == PENDING"
          - "confirmation_number present in payload"
        side_effects:
          - "Rating.registry_confirmation_number := confirmation_number; Rating.stage := REGISTERED"
      - id: PENDING_to_REJECTED
        dimension: registry_status
        from: PENDING
        to: REJECTED
        trigger: "POST /ratings/{id}/registry-decision with outcome == REJECT"
        actor: RatingProviderAdmin
        preconditions:
          - "Rating.registry_status == PENDING"
          - "rejection_reason present in payload"
        side_effects:
          - "Rating.registry_status := REJECTED; Rating.rejection_reason := payload rejection_reason"
          - "Rating.file_locked := false (the file re-opens for correction)"
          - "Rating.submitted_index := null"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    shape: branching
    transitions:
      - id: SCHEDULED_to_PASSED
        from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/complete"
        actor: FieldInspector
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "Rating.file_locked == false and Rating.stage != VOID"
          - "Inspection.failed_test_count == 0"
          - "for checkpoint ROUGH_IN: at least one DUCT_LEAKAGE_TOTAL test exists; for FINAL: one BLOWER_DOOR and one DUCT_LEAKAGE_TOTAL exist"
        side_effects:
          - "Inspection.status := PASSED"
          - "for checkpoint ROUGH_IN: Rating.stage := ROUGH_IN_VERIFIED when it was PROJECTED"
      - id: SCHEDULED_to_FAILED
        from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/complete with at least one failing test"
        actor: FieldInspector
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "Inspection.failed_test_count >= 1"
          - "the checkpoint's required tests are present"
        side_effects:
          - "Inspection.status := FAILED"
          - "Rating.stage is unchanged (a failed rough-in never verifies)"
        note: "A FAILED FINAL inspection still supplies governing tests, so confirmation proceeds and yields compliance_status FAILING."

  - entity: SampleSet
    initial_state: FORMING
    terminal_states: [CLOSED_PASS, FAILED_EXPANDED, VOIDED_SAMPLING]
    shape: branching
    transitions:
      - id: FORMING_to_SELECTED
        from: FORMING
        to: SELECTED
        trigger: "POST /sample-sets/{id}/select"
        actor: RatingProviderAdmin
        preconditions:
          - "SampleSet.status == FORMING"
          - "Subdivision.sampling_enabled == true"
          - "Builder.sampling_eligible == true"
          - "SampleSet.member_count BETWEEN 2 AND 7"
          - "at least one member home is eligible per sample_tested_home_selection"
        side_effects:
          - "run sample_tested_home_selection; SampleSet.tested_home_id := the picked Home.id"
          - "that Home.sampling_role := TESTED; SampleSet.tested_member_count := 1"
          - "SampleSet.status := SELECTED"
      - id: SELECTED_to_TESTED
        from: SELECTED
        to: TESTED
        trigger: "system — the tested home's Rating reaches stage CONFIRMED"
        actor: system
        preconditions:
          - "SampleSet.status == SELECTED"
          - "the Rating of SampleSet.tested_home_id has stage == CONFIRMED"
        side_effects:
          - "SampleSet.status := TESTED"
      - id: TESTED_to_CLOSED_PASS
        from: TESTED
        to: CLOSED_PASS
        trigger: "POST /sample-sets/{id}/close"
        actor: RatingProviderAdmin
        preconditions:
          - "SampleSet.status == TESTED"
          - "the tested home's Rating.compliance_status == PASSING"
        side_effects:
          - "run sample_set_representative_index; SampleSet.representative_index := result"
          - "every member home other than the tested home gets sampling_role := REPRESENTED"
          - "SampleSet.represented_member_count := member_count - 1"
          - "each represented home's Rating (when one exists) gets confirmed_index := SampleSet.representative_index and compliance_status := PASSING"
          - "SampleSet.status := CLOSED_PASS"
      - id: TESTED_to_FAILED_EXPANDED
        from: TESTED
        to: FAILED_EXPANDED
        trigger: "POST /sample-sets/{id}/close when the tested home failed"
        actor: RatingProviderAdmin
        preconditions:
          - "SampleSet.status == TESTED"
          - "the tested home's Rating.compliance_status == FAILING"
        side_effects:
          - "SampleSet.status := FAILED_EXPANDED; SampleSet.representative_index := null"
          - "cascade B hop 1: every member home other than the tested home gets individual_testing_required := true and sampling_role := REPRESENTED"
          - "cascade B hop 2: each such home's existing Rating gets confirmed_index := null and compliance_status := FAILING"
          - "cascade B hop 3: each of those FAILING ratings gets a CorrectiveAction{reason: SAMPLE_SET_FAILURE, status: OPEN}"
          - "cascade B hop 4: those creations raise Builder.open_corrective_action_count"
          - "cascade B hop 5: Builder.status := SAMPLING_SUSPENDED, which recomputes Builder.sampling_eligible to false"
      - id: SELECTED_to_FAILED_EXPANDED
        from: SELECTED
        to: FAILED_EXPANDED
        trigger: "POST /sample-sets/{id}/close before the tested home is confirmed"
        actor: RatingProviderAdmin
        preconditions:
          - "SampleSet.status == SELECTED"
          - "the tested home's Rating has stage != CONFIRMED (no confirmed index exists), so sample_set_representative_index has an empty input set and the close is rejected with ERR_SAMPLE_SET_NO_TESTED_RATING"
        side_effects: []
        note: "This transition is never taken: closing from SELECTED always errors. It is listed so the empty-input-set boundary has an explicit home."
      - id: OPEN_to_VOIDED_SAMPLING
        from: "FORMING | SELECTED | TESTED"
        to: VOIDED_SAMPLING
        trigger: "cascade A — a QAReview on any rating of this builder completes with result FAIL_MAJOR"
        actor: system
        preconditions:
          - "SampleSet.status IN {FORMING, SELECTED, TESTED}"
        side_effects:
          - "SampleSet.status := VOIDED_SAMPLING; SampleSet.tested_home_id := null; representative_index := null"
          - "every member home: sample_set_id := null, sampling_role := UNASSIGNED, individual_testing_required := true"
          - "SampleSet.member_count, tested_member_count, represented_member_count := 0"
          - "Subdivision.sampled_home_count decreases and unsampled_home_count increases by the same amount (coverage ledger preserved)"
          - "every PlanModel of the subdivision: status := ARCHIVED"

  - entity: QAReview
    initial_state: ASSIGNED
    terminal_states: [COMPLETED]
    shape: branching
    transitions:
      - id: ASSIGNED_to_COMPLETED_PASS
        from: ASSIGNED
        to: COMPLETED
        trigger: "POST /qa-reviews/{id}/complete with result == PASS"
        actor: QADesignee
        preconditions:
          - "QAReview.status == ASSIGNED"
          - "the acting QADesignee's X-User-ID equals QAReview.reviewer_id"
        side_effects:
          - "QAReview.result := PASS; Rating.qa_status := QA_PASSED"
          - "Rater.qa_completed_count += 1; recompute qa_files_owed and registry_hold"
      - id: ASSIGNED_to_COMPLETED_FAIL_MINOR
        from: ASSIGNED
        to: COMPLETED
        trigger: "POST /qa-reviews/{id}/complete with result == FAIL_MINOR"
        actor: QADesignee
        preconditions:
          - "QAReview.status == ASSIGNED"
        side_effects:
          - "QAReview.result := FAIL_MINOR; Rating.qa_status stays QA_SELECTED (only FAIL_MAJOR fails the file)"
          - "create CorrectiveAction{reason: QA_FINDING, status: OPEN} on the reviewed Rating"
          - "Builder.open_corrective_action_count += 1; Builder.sampling_eligible recomputed to false"
          - "reviewee Rater.qa_failure_count += 1; certification_status ACTIVE -> PROBATION (PROBATION -> SUSPENDED on a second failure)"
          - "Rater.qa_completed_count += 1; qa_sampling_quota recomputed at the PROBATION rate 1.00, so qa_files_owed becomes max(0, confirmed_rating_count - qa_completed_count) and registry_hold follows it"
          - "no packages are revoked and no sample set is voided"
      - id: ASSIGNED_to_COMPLETED_FAIL_MAJOR
        from: ASSIGNED
        to: COMPLETED
        trigger: "POST /qa-reviews/{id}/complete with result == FAIL_MAJOR"
        actor: QADesignee
        preconditions:
          - "QAReview.status == ASSIGNED"
        side_effects:
          - "QAReview.result := FAIL_MAJOR; Rating.qa_status := QA_FAILED (terminal qa dimension)"
          - "cascade A hop 1: every DocumentPackage of this rating with status == ISSUED becomes REVOKED with revocation_reason QA_MAJOR_FAILURE"
          - "cascade A hop 2: each revocation decrements Builder.certified_incentive_cents by that package's certified_amount_cents and increments Builder.revoked_package_count"
          - "cascade A hop 3: revoked_package_count >= 1 forces Builder.status := SAMPLING_SUSPENDED and Builder.sampling_eligible := false"
          - "cascade A hop 4: because the builder is no longer sampling-eligible, every SampleSet of its subdivisions with status IN {FORMING, SELECTED, TESTED} transitions to VOIDED_SAMPLING"
          - "cascade A hop 5: each voided set releases its member homes (sample_set_id := null, sampling_role := UNASSIGNED, individual_testing_required := true) and archives the subdivision's PlanModel rows"
          - "reviewee Rater.qa_failure_count += 1 and certification_status steps toward SUSPENDED"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [ACCEPTED, ESCALATED]
    shape: cyclic
    transitions:
      - id: OPEN_to_SUBMITTED
        from: OPEN
        to: SUBMITTED
        trigger: "POST /corrective-actions/{id}/submit"
        actor: BuilderRep
        preconditions:
          - "CorrectiveAction.status == OPEN"
          - "Rating.stage != VOID"
          - "the acting BuilderRep's X-User-ID equals the Builder that owns the rating's subdivision"
        side_effects:
          - "CorrectiveAction.status := SUBMITTED; attempt_count += 1; remediation_note := payload"
      - id: SUBMITTED_to_ACCEPTED
        from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /corrective-actions/{id}/review with decision == ACCEPT"
        actor: RatingProviderAdmin
        preconditions:
          - "CorrectiveAction.status == SUBMITTED"
        side_effects:
          - "CorrectiveAction.status := ACCEPTED"
          - "Builder.open_corrective_action_count -= 1; Builder.sampling_eligible recomputed"
          - "Rating.compliance_status := REMEDIATION_PENDING when it was FAILING"
      - id: SUBMITTED_to_REJECTED
        from: SUBMITTED
        to: REJECTED
        trigger: "POST /corrective-actions/{id}/review with decision == REJECT and attempt_count < 3"
        actor: RatingProviderAdmin
        preconditions:
          - "CorrectiveAction.status == SUBMITTED"
          - "CorrectiveAction.attempt_count < 3"
        side_effects:
          - "CorrectiveAction.status := REJECTED (still counted in Builder.open_corrective_action_count)"
      - id: REJECTED_to_SUBMITTED
        from: REJECTED
        to: SUBMITTED
        trigger: "POST /corrective-actions/{id}/submit (builder re-submits)"
        actor: BuilderRep
        preconditions:
          - "CorrectiveAction.status == REJECTED"
          - "Rating.stage != VOID"
        side_effects:
          - "CorrectiveAction.status := SUBMITTED; attempt_count += 1"
        note: "Cycle SUBMITTED -> REJECTED -> SUBMITTED; the third rejection escalates instead of looping."
      - id: SUBMITTED_to_ESCALATED
        from: SUBMITTED
        to: ESCALATED
        trigger: "POST /corrective-actions/{id}/review with decision == REJECT on the third attempt"
        actor: RatingProviderAdmin
        preconditions:
          - "CorrectiveAction.status == SUBMITTED"
          - "CorrectiveAction.attempt_count == 3"
        side_effects:
          - "CorrectiveAction.status := ESCALATED (terminal; still counted as open, so the builder stays sampling-ineligible)"
          - "Builder.status := SAMPLING_SUSPENDED"

  - entity: Rater
    initial_state: ACTIVE
    terminal_states: []
    shape: cyclic
    transitions:
      - id: ACTIVE_to_PROBATION
        from: ACTIVE
        to: PROBATION
        trigger: "QAReview completion with result IN {FAIL_MINOR, FAIL_MAJOR}"
        actor: system
        preconditions:
          - "Rater.certification_status == ACTIVE"
        side_effects:
          - "Rater.certification_status := PROBATION; qa_failure_count += 1"
          - "qa_sampling_quota rate switches from 0.10 to 1.00 and is recomputed, so qa_files_owed becomes max(0, confirmed_rating_count - qa_completed_count) and registry_hold follows that value (0 and false right after the review that caused the probation, then 1 and true on the rater's next confirmation)"
      - id: PROBATION_to_SUSPENDED
        from: PROBATION
        to: SUSPENDED
        trigger: "a second QAReview completion with result IN {FAIL_MINOR, FAIL_MAJOR}"
        actor: system
        preconditions:
          - "Rater.certification_status == PROBATION"
        side_effects:
          - "Rater.certification_status := SUSPENDED (no new ratings, confirmations, inspections or submissions)"
      - id: PROBATION_to_ACTIVE
        from: PROBATION
        to: ACTIVE
        trigger: "POST /raters/{id}/reinstate"
        actor: RatingProviderAdmin
        preconditions:
          - "Rater.certification_status == PROBATION"
        side_effects:
          - "Rater.certification_status := ACTIVE; qa_failure_count := 0"
          - "qa_sampling_quota recomputed at the 0.10 rate; qa_files_owed and registry_hold usually clear"
      - id: SUSPENDED_to_ACTIVE
        from: SUSPENDED
        to: ACTIVE
        trigger: "POST /raters/{id}/reinstate"
        actor: RatingProviderAdmin
        preconditions:
          - "Rater.certification_status == SUSPENDED"
        side_effects:
          - "Rater.certification_status := ACTIVE; qa_failure_count := 0"
        note: "Cycle ACTIVE -> PROBATION -> SUSPENDED -> ACTIVE. Reinstatement never changes cert_expires_at, so an EXPIRED rater stays EXPIRED."

  - entity: DocumentPackage
    initial_state: DRAFT
    terminal_states: [REVOKED, SUPERSEDED]
    shape: branching
    transitions:
      - id: DRAFT_to_ISSUED
        from: DRAFT
        to: ISSUED
        trigger: "POST /document-packages/{id}/issue"
        actor: RatingProviderAdmin
        preconditions:
          - "DocumentPackage.status == DRAFT"
          - "Rating.stage IN {CONFIRMED, REGISTERED} and Rating.compliance_status == PASSING"
          - "Rating.qa_status != QA_FAILED"
          - "no CorrectiveAction of this rating has status IN {OPEN, SUBMITTED, REJECTED, ESCALATED}"
          - "package eligibility per incentive_amount (TAX_CREDIT_45L requires confirmed_index <= 55; UTILITY_PROGRAM requires confirmed_index <= 50)"
          - "Builder.certified_incentive_cents + this package's certified amount <= Builder.utility_program_budget_cents (UTILITY_PROGRAM only)"
        side_effects:
          - "recompute incentive_amount CERTIFIED variant into certified_amount_cents and line_items"
          - "DocumentPackage.status := ISSUED; issued_at := logical clock"
          - "Builder.certified_incentive_cents += certified_amount_cents"
      - id: ISSUED_to_REVOKED
        from: ISSUED
        to: REVOKED
        trigger: "cascade A (QA FAIL_MAJOR) or cascade C (rating void)"
        actor: system
        preconditions:
          - "DocumentPackage.status == ISSUED"
        side_effects:
          - "DocumentPackage.status := REVOKED; revocation_reason := QA_MAJOR_FAILURE | RATING_VOID"
          - "Builder.certified_incentive_cents -= certified_amount_cents (money ledger returns to its pre-issue value)"
          - "Builder.revoked_package_count += 1"
      - id: DRAFT_to_SUPERSEDED
        from: DRAFT
        to: SUPERSEDED
        trigger: "POST /document-packages creating a newer DRAFT of the same package_type on the same rating, or a rating void"
        actor: system
        preconditions:
          - "DocumentPackage.status == DRAFT"
        side_effects:
          - "DocumentPackage.status := SUPERSEDED (no ledger movement, because a DRAFT never contributed)"

concurrency_rules:
  - rule_id: document-package-draft-stale-rating
    parent_entity: Rating
    write_endpoint: "POST /document-packages"
    occ_field: "expected_rating_version"
    description: |
      Creating a DocumentPackage against a Rating whose version has advanced since the
      client last observed it is rejected. A new DRAFT legitimately supersedes any prior
      DRAFT of the same package_type, so the operation is valid on its own terms; the
      stale-version check is what prevents a writer holding an outdated view of the
      rating's confirmed index from drafting a package against numbers that have moved.
    error_id: ERR_STALE_RATING_VERSION
    http_status: 412

  - rule_id: sample-membership-add-stale-set
    parent_entity: SampleSet
    write_endpoint: "POST /sample-sets/{id}/homes"
    occ_field: "expected_sample_set_version"
    description: |
      Adding a Home to a SampleSet whose version has advanced since the client last
      observed it is rejected. Membership additions are legitimate from FORMING and do
      not read any status field the previous addition changed, so nothing else would stop
      a writer whose view of member_count is stale from pushing the set past its size cap.
    error_id: ERR_STALE_SAMPLE_SET_VERSION
    http_status: 412

  - rule_id: sample-membership-withdraw-stale-set
    parent_entity: SampleSet
    write_endpoint: "POST /sample-sets/{id}/homes/{home_id}/withdraw"
    occ_field: "expected_sample_set_version"
    description: |
      Withdrawing a Home from a SampleSet whose version has advanced since the client
      last observed it is rejected. Withdrawal is legitimate from FORMING for any member,
      so a writer acting on a stale membership roster would otherwise silently shrink a
      set another writer has just re-shaped.
    error_id: ERR_STALE_SAMPLE_SET_VERSION
    http_status: 412

calculations:
  - name: hers_index
    trigger: "PROJECTED variant on POST /plan-models and POST /ratings; CONFIRMED variant on the Rating confirm transitions (PROJECTED_to_CONFIRMED, ROUGH_IN_VERIFIED_to_CONFIRMED, CONFIRMED_to_CONFIRMED)"
    algorithm: threshold
    formula: |
      # All arithmetic is exact decimal arithmetic (no binary floating point).
      # Inputs come from the PlanModel pinned on the Rating (Rating.plan_model_id) and, for the
      # CONFIRMED variant, from the governing FINAL DiagnosticTest normalized values.
      cz_factor   = CZ_FACTOR[Subdivision.climate_zone]
      ach50       = design_ach50            (PROJECTED)  | Rating.confirmed_ach50                          (CONFIRMED)
      duct        = design_duct_leakage_cfm25_per_100sqft (PROJECTED)
                    | Rating.confirmed_duct_leakage_cfm25_per_100sqft                                       (CONFIRMED)
      base_load   = PlanModel.envelope_ua_btu_per_hr_f * cz_factor
                    + 0.60 * ach50 * PlanModel.conditioned_volume_cuft / 1000
                    + 0.90 * duct  * PlanModel.conditioned_floor_area_sqft / 100
      equip_mult  = max(0.62, min(1.05, 1.35 - 0.05 * PlanModel.hvac_efficiency_index))
      ref_load    = 0.30 * PlanModel.conditioned_floor_area_sqft + 40.0 * PlanModel.bedrooms
      raw_index   = base_load * equip_mult / ref_load * 100
      pv_points   = min(PV_INDEX_CAP[Subdivision.code_edition], 4.0 * PlanModel.pv_capacity_kw_dc)
      index       = max(0, round_half_up(raw_index - pv_points, 0))     # SINGLE rounding, at the very end
    input_set: "Exactly one PlanModel (the pinned Rating.plan_model_id, or the row being created) plus its Subdivision's climate_zone and code_edition. No aggregation over other homes."
    constants:
      CZ_FACTOR: { CZ2: 0.90, CZ3: 0.95, CZ4: 1.00, CZ5: 1.10, CZ6: 1.20 }
      PV_INDEX_CAP: { IECC_2021: 5.0, IECC_2015: 100.0 }
      EQUIP_MULT_FLOOR: 0.62
      EQUIP_MULT_CEILING: 1.05
    precision: "raw_index and every intermediate value keep full exact-decimal precision; the result is rounded exactly once at the end to 0 decimal places, round_half_up, then floored at 0"
    variants:
      - name: PROJECTED
        when: "plan-based rating, at PlanModel creation and at Rating creation"
        difference: "uses PlanModel.design_ach50 and PlanModel.design_duct_leakage_cfm25_per_100sqft (paper design values)"
      - name: CONFIRMED
        when: "as-built rating, during a confirm transition"
        difference: "uses Rating.confirmed_ach50 and Rating.confirmed_duct_leakage_cfm25_per_100sqft (measured, normalized values from the governing FINAL DiagnosticTest rows), so the same home routinely lands on a different index than its projected one"

  - name: compliance_path_selection
    trigger: "every Rating confirm transition, immediately after hers_index CONFIRMED is written"
    algorithm: waterfall_allocation
    formula: |
      ach50_pass = Rating.confirmed_ach50 <= ACH50_MAX[code_edition][climate_zone]
      duct_pass  = Rating.confirmed_duct_leakage_cfm25_per_100sqft <= DUCT_MAX_FINAL
      ua         = PlanModel.envelope_ua_btu_per_hr_f
      cfa        = PlanModel.conditioned_floor_area_sqft
      target     = ERI_TARGET[code_edition][climate_zone]

      # Step 0 — binding election. Evaluated FIRST and it never falls through to steps 1-3.
      if Subdivision.compliance_path_preference == PRESCRIPTIVE_PATH:
          if ach50_pass and duct_pass and ua <= 0.12 * cfa:
              return (compliance_path = PRESCRIPTIVE, compliance_status = PASSING)
          return (compliance_path = NONE, compliance_status = FAILING)

      # Steps 1-3 apply only when compliance_path_preference == ERI_PATH.
      # Step 1 — ERI path.
      if Rating.confirmed_index <= target and ach50_pass and duct_pass:
          return (ERI, PASSING)
      # Step 2 — total-UA performance path (index tolerance +5, tighter UA gate).
      if Rating.confirmed_index <= target + 5 and ach50_pass and duct_pass and ua <= 0.14 * cfa:
          return (PERFORMANCE, PASSING)
      # Step 3 — no path qualifies.
      return (NONE, FAILING)
    input_set: "The Rating being confirmed, its pinned PlanModel, and its Subdivision's code_edition / climate_zone / compliance_path_preference. Nothing else."
    constants:
      ERI_TARGET:
        IECC_2021: { CZ2: 52, CZ3: 53, CZ4: 55, CZ5: 55, CZ6: 54 }
        IECC_2015: { CZ2: 65, CZ3: 65, CZ4: 65, CZ5: 69, CZ6: 69 }
      ACH50_MAX:
        IECC_2021: { CZ2: 5.0, CZ3: 5.0, CZ4: 3.0, CZ5: 3.0, CZ6: 3.0 }
        IECC_2015: { CZ2: 5.0, CZ3: 3.0, CZ4: 3.0, CZ5: 3.0, CZ6: 3.0 }
      DUCT_MAX_FINAL: 4.0
      PERFORMANCE_INDEX_TOLERANCE: 5
      PRESCRIPTIVE_UA_RATIO: 0.12
      PERFORMANCE_UA_RATIO: 0.14
    precision: "index comparisons are integer; ACH50 and duct comparisons use the 2-decimal normalized values; all comparisons are inclusive (<=)"

  - name: blower_door_normalization
    trigger: "POST /inspections/{id}/tests with test_type == BLOWER_DOOR"
    algorithm: threshold
    formula: |
      normalized_value = round_half_up(measured_value * 60 / PlanModel.conditioned_volume_cuft, 2)   # CFM50 -> ACH50
      threshold_value  = ACH50_MAX[Subdivision.code_edition][Subdivision.climate_zone]
      result           = PASS if normalized_value <= threshold_value else FAIL
    input_set: "The single DiagnosticTest being recorded, the Inspection's Rating, that Rating's pinned PlanModel, and the Subdivision's code_edition / climate_zone"
    constants:
      ACH50_MAX:
        IECC_2021: { CZ2: 5.0, CZ3: 5.0, CZ4: 3.0, CZ5: 3.0, CZ6: 3.0 }
        IECC_2015: { CZ2: 5.0, CZ3: 3.0, CZ4: 3.0, CZ5: 3.0, CZ6: 3.0 }
      CFM_TO_ACH_MINUTES: 60
    precision: "2 decimal places, round_half_up, rounded BEFORE the threshold comparison, so a normalized 3.00 passes a 3.0 limit and 3.01 fails it"

  - name: duct_leakage_normalization
    trigger: "POST /inspections/{id}/tests with test_type == DUCT_LEAKAGE_TOTAL"
    algorithm: threshold
    formula: |
      normalized_value = round_half_up(measured_value * 100 / PlanModel.conditioned_floor_area_sqft, 2)  # CFM25 per 100 sqft
      if Inspection.checkpoint == FINAL:                     threshold_value = DUCT_MAX_FINAL
      elif Inspection.checkpoint == ROUGH_IN and Inspection.air_handler_installed:
                                                             threshold_value = DUCT_MAX_ROUGH_IN_WITH_AHU
      else:                                                  threshold_value = DUCT_MAX_ROUGH_IN_NO_AHU
      result = PASS if normalized_value <= threshold_value else FAIL
    input_set: "The single DiagnosticTest being recorded, its Inspection's checkpoint and air_handler_installed flag, and the Rating's pinned PlanModel"
    constants:
      DUCT_MAX_FINAL: 4.0
      DUCT_MAX_ROUGH_IN_WITH_AHU: 4.0
      DUCT_MAX_ROUGH_IN_NO_AHU: 3.0
    precision: "2 decimal places, round_half_up, rounded before the comparison; comparison is inclusive"

  - name: sample_tested_home_selection
    trigger: "POST /sample-sets/{id}/select"
    algorithm: chronological
    formula: |
      # (a) eligibility filter
      candidates = Home rows where
            Home.sample_set_id == SampleSet.id
        AND Home.individual_testing_required == false
        AND EXISTS Rating r with r.home_id == Home.id
                AND r.stage == PROJECTED
                AND r.registry_status == NOT_SUBMITTED
      # (b) ranking expression: worst projected performance is tested
      rank by r.projected_index DESC
      # (c) tie-breaks, applied in this order
      tie_break_1: PlanModel.conditioned_floor_area_sqft DESC   (of the home's plan_model_id)
      tie_break_2: Home.created_at ASC                          (never Home.id)
      # (d) empty candidate set
      if candidates is empty: reject the select call with ERR_NO_ELIGIBLE_SAMPLE_HOME
      tested_home = first candidate after ranking
    input_set: "Member Home rows of this SampleSet only (Home.sample_set_id == SampleSet.id), each joined to its single PROJECTED Rating and pinned PlanModel"
    constants:
      SAMPLE_SET_MIN_MEMBERS: 2
      SAMPLE_SET_MAX_MEMBERS: 7
    precision: "integer index comparison; conditioned_floor_area_sqft compared at full precision; created_at compared at millisecond precision"

  - name: sample_set_representative_index
    trigger: "POST /sample-sets/{id}/close (transition TESTED_to_CLOSED_PASS)"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED in three steps; steps must not be interleaved.
      # Step 1 — collect: confirmed indices of member homes with sampling_role == TESTED whose
      #          Rating.stage == CONFIRMED and Rating.compliance_status == PASSING.
      tested_indices = [ r.confirmed_index for member homes with sampling_role == TESTED ]
      # Step 2 — reduce: representative_index = max(tested_indices)   (worst-performing tested home)
      if tested_indices is empty: reject the close with ERR_SAMPLE_SET_NO_TESTED_RATING
      representative_index = max(tested_indices)
      # Step 3 — assign: every member home other than the tested home becomes REPRESENTED and its
      #          Rating.confirmed_index := representative_index.
      # The values written in step 3 are NEVER fed back into step 1 or step 2: represented homes'
      # projected indices and newly assigned confirmed indices are outside the input set of the max.
    input_set: "Member Home rows of this SampleSet with sampling_role == TESTED and Rating.stage == CONFIRMED and Rating.compliance_status == PASSING; represented and unassigned homes are excluded from the max"
    constants:
      TESTED_HOMES_PER_SET: 1
    precision: "integer; no rounding — the maximum of already-rounded confirmed indices"

  - name: qa_sampling_quota
    trigger: "Rater.confirmed_rating_count or Rater.qa_completed_count or Rater.certification_status changes (rating confirm, QA review completion, reinstate)"
    algorithm: threshold
    formula: |
      rate           = QA_RATE_PROBATION if Rater.certification_status == PROBATION else QA_RATE_STANDARD
      required_files = floor(rate * Rater.confirmed_rating_count)
      qa_files_owed  = max(0, required_files - Rater.qa_completed_count)
      registry_hold  = (qa_files_owed > 0)
    input_set: "One Rater row; confirmed_rating_count counts that rater's Rating rows with stage IN {CONFIRMED, REGISTERED}; qa_completed_count counts QAReview rows for that reviewee with status == COMPLETED"
    constants:
      QA_RATE_STANDARD: 0.10
      QA_RATE_PROBATION: 1.00
    precision: "rate * count evaluated in exact decimal arithmetic, then floor to an integer; a standard-rate rater with 9 confirmed files owes 0, with 10 owes 1"

  - name: incentive_amount
    trigger: "PROVISIONAL variant on POST /document-packages (DRAFT creation); CERTIFIED variant on POST /document-packages/{id}/issue (DRAFT_to_ISSUED)"
    algorithm: tiered_pricing
    formula: |
      index = Rating.projected_index                                    (PROVISIONAL)
            | Rating.confirmed_index                                    (CERTIFIED)
      ach50 = PlanModel.design_ach50                                    (PROVISIONAL)
            | Rating.confirmed_ach50                                    (CERTIFIED)
      duct  = PlanModel.design_duct_leakage_cfm25_per_100sqft           (PROVISIONAL)
            | Rating.confirmed_duct_leakage_cfm25_per_100sqft           (CERTIFIED)
      cfa   = PlanModel.conditioned_floor_area_sqft

      if package_type == TAX_CREDIT_45L:
          # flat tiers on the index; line_items = []
          if index <= TAX_TIER_1_MAX_INDEX:  amount_cents = TAX_TIER_1_CENTS
          elif index <= TAX_TIER_2_MAX_INDEX: amount_cents = TAX_TIER_2_CENTS
          else:                               amount_cents = 0
          return amount_cents

      if package_type == UTILITY_PROGRAM:
          # ROUNDING ORDER IS PINNED: round EACH line item to whole cents FIRST,
          # THEN sum the rounded line items, THEN apply the cap. Never sum-then-round.
          line_ENVELOPE = round_half_up(ENVELOPE_RATE_CENTS_PER_SQFT * cfa, 0)
          line_DUCTS    = round_half_up(DUCT_RATE_CENTS * max(0, DUCT_MAX_FINAL - duct), 0)
          line_AIR      = round_half_up(AIR_RATE_CENTS  * max(0, AIR_BASELINE_ACH50 - ach50), 0)
          line_INDEX    = round_half_up(INDEX_RATE_CENTS * max(0, INDEX_BASELINE - index), 0)
          line_items    = [ {code: ENVELOPE, amount_cents: line_ENVELOPE},
                            {code: DUCTS,    amount_cents: line_DUCTS},
                            {code: AIR,      amount_cents: line_AIR},
                            {code: INDEX,    amount_cents: line_INDEX} ]     # this fixed order
          subtotal      = line_ENVELOPE + line_DUCTS + line_AIR + line_INDEX
          return min(subtotal, UTILITY_PACKAGE_CAP_CENTS)
    input_set: "One Rating, its pinned PlanModel, and the package_type of the DocumentPackage row; no aggregation across packages"
    constants:
      TAX_TIER_1_MAX_INDEX: 45
      TAX_TIER_1_CENTS: 250000
      TAX_TIER_2_MAX_INDEX: 55
      TAX_TIER_2_CENTS: 100000
      ENVELOPE_RATE_CENTS_PER_SQFT: 37.5
      DUCT_RATE_CENTS: 1250
      DUCT_MAX_FINAL: 4.0
      AIR_RATE_CENTS: 1500
      AIR_BASELINE_ACH50: 5.0
      INDEX_RATE_CENTS: 2250
      INDEX_BASELINE: 60
      UTILITY_PACKAGE_CAP_CENTS: 150000
      TAX_CREDIT_MAX_INDEX: 55
      UTILITY_PROGRAM_MAX_INDEX: 50
    precision: "exact decimal arithmetic; each UTILITY_PROGRAM line item is rounded to whole cents with round_half_up BEFORE summation, and the cap is applied AFTER summation"
    variants:
      - name: PROVISIONAL
        when: "DocumentPackage DRAFT creation, before as-built numbers exist"
        difference: "reads projected_index and the plan's design airtightness/duct values, so it can differ from the certified amount in both tier selection and per-line measure credits"
      - name: CERTIFIED
        when: "DocumentPackage issuance"
        difference: "reads confirmed_index and measured normalized values; the delta between provisional_amount_cents and certified_amount_cents is what the builder actually loses or gains, and only the certified amount ever moves Builder.certified_incentive_cents"

  - name: builder_incentive_ledger
    trigger: "DocumentPackage DRAFT_to_ISSUED and ISSUED_to_REVOKED transitions (including cascades A and C)"
    algorithm: aggregation
    formula: |
      # Conserved money quantity. Recomputed as a full aggregation, never patched incrementally.
      Builder.certified_incentive_cents =
          sum(DocumentPackage.certified_amount_cents
              for every DocumentPackage p with p.status == ISSUED
              and p.rating_id -> Rating -> Home -> Subdivision.builder_id == Builder.id)
      Builder.revoked_package_count =
          count(p where p.status == REVOKED and p reachable from this Builder)
      # INVARIANT (compensating action): issue(p) followed by revoke(p) leaves
      # Builder.certified_incentive_cents exactly equal to its value before issue(p).
    input_set: "DocumentPackage rows with status == ISSUED reachable via Rating -> Home -> Subdivision -> Builder; DRAFT, SUPERSEDED and REVOKED packages contribute 0"
    constants:
      DRAFT_CONTRIBUTION_CENTS: 0
      SUPERSEDED_CONTRIBUTION_CENTS: 0
      REVOKED_CONTRIBUTION_CENTS: 0
    precision: "integer cents; no rounding at aggregation time because each line item was already rounded at issue"

  - name: home_coverage_ledger
    trigger: "POST /homes, POST /sample-sets/{id}/homes, POST /sample-sets/{id}/homes/{home_id}/withdraw, and the SampleSet OPEN_to_VOIDED_SAMPLING cascade"
    algorithm: aggregation
    formula: |
      # Conserved home-coverage quantity on the Subdivision.
      Subdivision.homes_count          = count(Home where Home.subdivision_id == Subdivision.id)
      Subdivision.sampled_home_count   = count(those Home rows where Home.sample_set_id IS NOT NULL)
      Subdivision.unsampled_home_count = Subdivision.homes_count - Subdivision.sampled_home_count
      # INVARIANT: sampled_home_count + unsampled_home_count == homes_count after EVERY operation,
      # and add-then-withdraw of the same home restores all three counters to their pre-add values.
    input_set: "Home rows of this Subdivision only; membership is read from Home.sample_set_id, never from SampleSet.member_count"
    constants:
      NULL_SAMPLE_SET_IS_UNSAMPLED: true
    precision: "integer counts; no rounding"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role is one of the five §1.7 roles (X-User-ID may be omitted only for the opaque RatingProviderAdmin role)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request-shape check evaluated before any database read: all required input fields present, types correct, enum members valid, numeric constraints honored (conditioned_floor_area_sqft > 0, bedrooms >= 1, measured_value >= 0, utility_program_budget_cents >= 0, scheduled_end_utc strictly after scheduled_start_utc, window_end_date >= window_start_date, limit within 1..100, offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 4
    category: existence
    check: "every id in the URL path exists, validated left to right; yields the resource-specific not-found id — ERR_BUILDER_NOT_FOUND, ERR_SUBDIVISION_NOT_FOUND, ERR_PLAN_MODEL_NOT_FOUND, ERR_HOME_NOT_FOUND, ERR_RATER_NOT_FOUND, ERR_RATING_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_SAMPLE_SET_NOT_FOUND, ERR_QA_REVIEW_NOT_FOUND, ERR_CORRECTIVE_ACTION_NOT_FOUND, ERR_DOCUMENT_PACKAGE_NOT_FOUND"
    error_id: ERR_RATING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: existence
    check: "every foreign-key id in the request body exists, validated in the order the endpoint's input list declares; yields the same resource-specific not-found ids as priority 4"
    error_id: ERR_HOME_NOT_FOUND
    http_status: 404
    applies_to: "POST /subdivisions, POST /plan-models, POST /homes, POST /ratings, POST /inspections, POST /sample-sets, POST /sample-sets/{id}/homes, POST /qa-reviews, POST /document-packages"
  - priority: 6
    category: business_referential
    check: "for entity_backed roles, X-User-ID owns the target: BuilderRep's id equals the Builder reached via Home -> Subdivision -> builder_id; CertifiedRater's id equals Rating.rater_id; FieldInspector's id equals Inspection.inspector_id; QADesignee's id equals QAReview.reviewer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /ratings/{id}/confirm, POST /ratings/{id}/submit-to-registry, POST /inspections/{id}/tests, POST /inspections/{id}/complete, POST /qa-reviews/{id}/complete, POST /corrective-actions/{id}/submit, POST /document-packages, POST /homes"
  - priority: 7
    category: state
    check: "the target resource is in a state the requested transition permits (§1.2 from-state and preconditions), other than the void and file-lock cases handled at priorities 8-9"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "the Rating reached from the target resource has stage != VOID"
    error_id: ERR_RATING_VOID
    http_status: 409
    applies_to: "POST /inspections, POST /inspections/{id}/tests, POST /inspections/{id}/complete, POST /ratings/{id}/confirm, POST /ratings/{id}/submit-to-registry, POST /qa-reviews, POST /corrective-actions/{id}/submit, POST /document-packages, POST /document-packages/{id}/issue"
  - priority: 9
    category: state
    check: "the Rating reached from the target resource has file_locked == false"
    error_id: ERR_RATING_FILE_LOCKED
    http_status: 409
    applies_to: "POST /inspections, POST /inspections/{id}/tests, POST /inspections/{id}/complete, POST /ratings/{id}/confirm, POST /ratings/{id}/submit-to-registry"
    note: "Deliberately NOT applied to POST /document-packages or /issue: documentation packages are produced from a locked, registered file."
  - priority: 10
    category: state
    check: "expected_rating_version equals the current Rating.version (concurrency_rules document-package-draft-stale-rating)"
    error_id: ERR_STALE_RATING_VERSION
    http_status: 412
    applies_to: "POST /document-packages"
  - priority: 11
    category: state
    check: "expected_sample_set_version equals the current SampleSet.version (concurrency_rules sample-membership-add-stale-set and sample-membership-withdraw-stale-set)"
    error_id: ERR_STALE_SAMPLE_SET_VERSION
    http_status: 412
    applies_to: "POST /sample-sets/{id}/homes, POST /sample-sets/{id}/homes/{home_id}/withdraw"
  - priority: 12
    category: business_safety
    check: "every Rater the operation depends on has effective_certification_status IN {ACTIVE, PROBATION} — i.e. not SUSPENDED and not EXPIRED (logical clock at or after cert_expires_at)"
    error_id: ERR_CERTIFICATION_INVALID
    http_status: 422
    applies_to: "POST /ratings, POST /ratings/{id}/confirm, POST /ratings/{id}/submit-to-registry, POST /inspections, POST /inspections/{id}/tests, POST /inspections/{id}/complete, POST /qa-reviews, POST /qa-reviews/{id}/complete, POST /sample-sets, POST /sample-sets/{id}/homes"
  - priority: 13
    category: business_safety
    check: "the Rater's cert_level suits the operation: RATER for ratings, confirmations, registry submission, sample sets and membership; RATING_FIELD_INSPECTOR or RATER for inspections and tests; QA_DESIGNEE for QA review completion"
    error_id: ERR_CERT_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /ratings, POST /ratings/{id}/confirm, POST /ratings/{id}/submit-to-registry, POST /inspections, POST /inspections/{id}/tests, POST /qa-reviews/{id}/complete, POST /sample-sets, POST /sample-sets/{id}/homes"
  - priority: 14
    category: business_safety
    check: "segregation of duties: QAReview.reviewer_id != Rating.rater_id, and the Inspection.inspector_id of the governing FINAL checkpoint of a QA FIELD_REVIEW is not the reviewer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /qa-reviews, POST /qa-reviews/{id}/complete"
  - priority: 15
    category: business_referential
    check: "the PlanModel referenced (directly on POST /homes, or pinned via the Home on POST /ratings) belongs to the same Subdivision as the Home, and has status == ACTIVE"
    error_id: ERR_PLAN_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /homes, POST /ratings"
  - priority: 16
    category: business_referential
    check: "the Home added to a SampleSet has subdivision_id == SampleSet.subdivision_id"
    error_id: ERR_HOME_SUBDIVISION_MISMATCH
    http_status: 422
    applies_to: "POST /sample-sets/{id}/homes"
  - priority: 17
    category: business_safety
    check: "confirmation requires a FINAL Inspection with status IN {PASSED, FAILED} carrying exactly one BLOWER_DOOR and one DUCT_LEAKAGE_TOTAL DiagnosticTest; completing a checkpoint requires its own mandatory tests (ROUGH_IN: DUCT_LEAKAGE_TOTAL; FINAL: both)"
    error_id: ERR_MISSING_GOVERNING_TEST
    http_status: 409
    applies_to: "POST /ratings/{id}/confirm, POST /inspections/{id}/complete"
  - priority: 18
    category: business_safety
    check: "a Home with individual_testing_required == true may not be added to a SampleSet, and may not be the selector's tested home"
    error_id: ERR_REPRESENTED_HOME_NOT_TESTABLE
    http_status: 422
    applies_to: "POST /sample-sets/{id}/homes, POST /sample-sets/{id}/select"
  - priority: 19
    category: business_constraint
    check: "lot_number is unique within the Subdivision"
    error_id: ERR_DUPLICATE_LOT_NUMBER
    http_status: 409
    applies_to: "POST /homes"
  - priority: 20
    category: business_constraint
    check: "plan_code is unique within the Subdivision"
    error_id: ERR_DUPLICATE_PLAN_CODE
    http_status: 409
    applies_to: "POST /plan-models"
  - priority: 21
    category: business_constraint
    check: "the Home has no Rating with stage IN {PROJECTED, ROUGH_IN_VERIFIED, CONFIRMED, REGISTERED} unless the new rating's supersedes_rating_id names that rating and that rating has stage == VOID or qa_status == QA_FAILED"
    error_id: ERR_DUPLICATE_ACTIVE_RATING
    http_status: 409
    applies_to: "POST /ratings"
  - priority: 22
    category: business_constraint
    check: "Subdivision.sampling_enabled == true"
    error_id: ERR_SAMPLING_NOT_ENABLED
    http_status: 422
    applies_to: "POST /sample-sets, POST /sample-sets/{id}/homes, POST /sample-sets/{id}/select"
  - priority: 23
    category: business_constraint
    check: "the Home has sample_set_id IS NULL (a home may belong to at most one sample set at a time)"
    error_id: ERR_HOME_ALREADY_SAMPLED
    http_status: 409
    applies_to: "POST /sample-sets/{id}/homes"
  - priority: 24
    category: business_temporal
    check: "Home.permit_date falls inside the closed interval [SampleSet.window_start_date, SampleSet.window_end_date]"
    error_id: ERR_HOME_PERMIT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /sample-sets/{id}/homes"
  - priority: 25
    category: business_constraint
    check: "membership size bounds: adding a home may not push member_count above SAMPLE_SET_MAX_MEMBERS (7); selecting requires member_count >= SAMPLE_SET_MIN_MEMBERS (2)"
    error_id: ERR_SAMPLE_SET_SIZE_INVALID
    http_status: 422
    applies_to: "POST /sample-sets/{id}/homes, POST /sample-sets/{id}/select"
  - priority: 26
    category: business_constraint
    check: "the Subdivision's Builder has sampling_eligible == true (builder_type == PRODUCTION AND status == ACTIVE AND open_corrective_action_count == 0)"
    error_id: ERR_BUILDER_SAMPLING_INELIGIBLE
    http_status: 422
    applies_to: "POST /sample-sets, POST /sample-sets/{id}/select"
  - priority: 27
    category: business_constraint
    check: "sample_tested_home_selection's candidate set is non-empty"
    error_id: ERR_NO_ELIGIBLE_SAMPLE_HOME
    http_status: 422
    applies_to: "POST /sample-sets/{id}/select"
  - priority: 28
    category: business_constraint
    check: "the close can be routed: SampleSet.tested_home_id is set and that home's Rating has stage IN {CONFIRMED, REGISTERED}, so sample_set_representative_index's step-1 input set is non-empty; closing from SELECTED (tested rating not yet confirmed) always fails here, while a confirmed-but-FAILING tested rating passes this check and routes to FAILED_EXPANDED"
    error_id: ERR_SAMPLE_SET_NO_TESTED_RATING
    http_status: 409
    applies_to: "POST /sample-sets/{id}/close"
  - priority: 29
    category: business_constraint
    check: "registry submission and package issuance require Rating.compliance_status == PASSING and Rating.qa_status != QA_FAILED"
    error_id: ERR_RATING_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /ratings/{id}/submit-to-registry, POST /document-packages/{id}/issue"
  - priority: 30
    category: business_constraint
    check: "no CorrectiveAction of the Rating has status IN {OPEN, SUBMITTED, REJECTED, ESCALATED}"
    error_id: ERR_OPEN_CORRECTIVE_ACTION
    http_status: 409
    applies_to: "POST /ratings/{id}/submit-to-registry, POST /document-packages/{id}/issue"
  - priority: 31
    category: business_constraint
    check: "the submitting Rater has registry_hold == false (qa_sampling_quota leaves qa_files_owed == 0)"
    error_id: ERR_RATER_QA_DEFICIT
    http_status: 422
    applies_to: "POST /ratings/{id}/submit-to-registry"
  - priority: 32
    category: business_constraint
    check: "package eligibility by index: TAX_CREDIT_45L requires confirmed_index <= TAX_CREDIT_MAX_INDEX (55); UTILITY_PROGRAM requires confirmed_index <= UTILITY_PROGRAM_MAX_INDEX (50)"
    error_id: ERR_PACKAGE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /document-packages/{id}/issue"
  - priority: 33
    category: business_temporal
    check: "the inspector has no other Inspection with status == SCHEDULED whose travel-buffered window overlaps: intervals are half-open [scheduled_start_utc, scheduled_end_utc) expanded by INSPECTOR_TRAVEL_BUFFER_MINUTES = 45 on both sides; two buffered intervals that merely touch do not overlap"
    error_id: ERR_INSPECTOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /inspections"
  - priority: 34
    category: business_temporal
    check: "the Subdivision has no other SampleSet with status IN {FORMING, SELECTED, TESTED} whose closed date interval [window_start_date, window_end_date] intersects the requested one; capacity is 1, and sharing a single endpoint date counts as an intersection"
    error_id: ERR_SAMPLE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /sample-sets"
  - priority: 35
    category: business_fiscal
    check: "for UTILITY_PROGRAM issuance, Builder.certified_incentive_cents + certified_amount_cents <= Builder.utility_program_budget_cents"
    error_id: ERR_PROGRAM_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /document-packages/{id}/issue"

endpoints:
  - method: POST
    path: "/builders"
    description: "Register a builder client of the rating provider"
    roles: [RatingProviderAdmin]
    code: 201
    input: [name, builder_type, utility_program_budget_cents]
    output: Builder
    side_effects: ["status := ACTIVE", "counters initialised to 0", "sampling_eligible computed (true only for PRODUCTION)"]
  - method: GET
    path: "/builders/{id}"
    description: "Read a builder with its live sampling eligibility and money ledger"
    roles: [RatingProviderAdmin, CertifiedRater, QADesignee, BuilderRep]
    code: 200
    input: []
    output: Builder
    side_effects: []
  - method: POST
    path: "/subdivisions"
    description: "Open a subdivision under a builder, fixing its code edition, climate zone and compliance-path election"
    roles: [RatingProviderAdmin]
    code: 201
    input: [builder_id, name, code_edition, climate_zone, "sampling_enabled?", "compliance_path_preference?"]
    output: Subdivision
    side_effects: ["sampling_enabled defaults to false", "compliance_path_preference defaults to ERI_PATH", "home_coverage_ledger initialised to zeros"]
  - method: GET
    path: "/subdivisions/{id}"
    description: "Read a subdivision with its home-coverage ledger"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: []
    output: Subdivision
    side_effects: []
  - method: GET
    path: "/subdivisions"
    description: "List subdivisions, optionally filtered by builder"
    roles: [RatingProviderAdmin, CertifiedRater, QADesignee, BuilderRep]
    code: 200
    input: ["builder_id?", "limit?", "offset?"]
    output: Subdivision[]
    side_effects: []
  - method: POST
    path: "/plan-models"
    description: "Register a plan model and compute its plan-based projected HERS index"
    roles: [CertifiedRater]
    code: 201
    input: [subdivision_id, plan_code, conditioned_floor_area_sqft, conditioned_volume_cuft, bedrooms, envelope_ua_btu_per_hr_f, design_ach50, design_duct_leakage_cfm25_per_100sqft, hvac_efficiency_index, "pv_capacity_kw_dc?"]
    output: PlanModel
    side_effects: ["runs hers_index PROJECTED variant into projected_index", "status := ACTIVE", "pv_capacity_kw_dc defaults to 0"]
  - method: GET
    path: "/subdivisions/{id}/plan-models"
    description: "List the plan models offered in a subdivision"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanModel[]
    side_effects: []
  - method: POST
    path: "/homes"
    description: "Register a lot in a subdivision against one of its plan models"
    roles: [BuilderRep]
    code: 201
    input: [subdivision_id, plan_model_id, lot_number, permit_date]
    output: Home
    side_effects: ["sampling_role := UNASSIGNED", "individual_testing_required := false", "recomputes home_coverage_ledger (homes_count and unsampled_home_count each +1)"]
  - method: GET
    path: "/homes/{id}"
    description: "Read a home with its sampling role"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: []
    output: Home
    side_effects: []
  - method: GET
    path: "/homes"
    description: "List homes filtered by subdivision, plan model, sample-set membership or sampling role"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: ["subdivision_id?", "plan_model_id?", "sample_set_id?", "sampling_role?", "limit?", "offset?"]
    output: Home[]
    side_effects: []
  - method: POST
    path: "/raters"
    description: "Certify a rater, rating field inspector or QA designee"
    roles: [RatingProviderAdmin]
    code: 201
    input: [full_name, cert_level, cert_expires_at]
    output: Rater
    side_effects: ["certification_status := ACTIVE", "effective_certification_status computed against the logical clock", "qa_sampling_quota computed (qa_files_owed 0, registry_hold false)"]
  - method: GET
    path: "/raters/{id}"
    description: "Read a rater with effective certification status and QA quota"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee]
    code: 200
    input: []
    output: Rater
    side_effects: []
  - method: POST
    path: "/raters/{id}/reinstate"
    description: "Reinstate a rater from PROBATION or SUSPENDED after remedial training; never extends cert_expires_at"
    roles: [RatingProviderAdmin]
    code: 200
    input: [training_completed_at, "note?"]
    output: Rater
    side_effects: ["certification_status := ACTIVE", "qa_failure_count := 0", "qa_sampling_quota recomputed at the 0.10 rate"]
  - method: POST
    path: "/ratings"
    description: "Open a rating on a home; pins the home's plan model and copies its projected index"
    roles: [CertifiedRater]
    code: 201
    input: [home_id, rater_id, "supersedes_rating_id?"]
    output: Rating
    side_effects: ["plan_model_id pinned from Home.plan_model_id", "projected_index copied from the pinned PlanModel", "stage := PROJECTED, compliance_status := UNDETERMINED, qa_status := NOT_SELECTED, registry_status := NOT_SUBMITTED, file_locked := false"]
  - method: GET
    path: "/ratings/{id}"
    description: "Read a rating with all four state dimensions and its indices"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: []
    output: Rating
    side_effects: []
  - method: GET
    path: "/ratings"
    description: "List ratings filtered by home, rater, pinned plan model, superseded predecessor or stage"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: ["home_id?", "rater_id?", "plan_model_id?", "supersedes_rating_id?", "stage?", "limit?", "offset?"]
    output: Rating[]
    side_effects: []
  - method: POST
    path: "/ratings/{id}/confirm"
    description: "Confirm the as-built rating from the governing FINAL checkpoint measurements"
    roles: [CertifiedRater]
    code: 200
    input: []
    output: Rating
    side_effects: ["copies the governing FINAL normalized values into confirmed_ach50 and confirmed_duct_leakage_cfm25_per_100sqft", "runs hers_index CONFIRMED into confirmed_index", "runs compliance_path_selection into compliance_path and compliance_status", "sets eri_target and confirmed_at", "stage := CONFIRMED", "increments Rater.confirmed_rating_count and recomputes qa_sampling_quota", "creates a THRESHOLD_FAILURE CorrectiveAction when compliance_status == FAILING, which raises Builder.open_corrective_action_count and clears Builder.sampling_eligible", "advances the owning SampleSet to TESTED when this home is the tested home"]
  - method: POST
    path: "/ratings/{id}/void"
    description: "Void a rating; runs cascade C over its documentation packages and the builder ledger"
    roles: [RatingProviderAdmin]
    code: 200
    input: [reason]
    output: Rating
    side_effects: ["stage := VOID, compliance_status := FAILING, file_locked := true", "ISSUED packages become REVOKED with revocation_reason RATING_VOID", "Builder.certified_incentive_cents decreases by each revoked certified amount and revoked_package_count increases", "Builder.status := SAMPLING_SUSPENDED", "DRAFT packages become SUPERSEDED"]
  - method: POST
    path: "/ratings/{id}/submit-to-registry"
    description: "Submit the rating file to the registry and lock it"
    roles: [CertifiedRater]
    code: 200
    input: []
    output: Rating
    side_effects: ["registry_status := PENDING", "submitted_index := confirmed_index", "file_locked := true"]
  - method: POST
    path: "/ratings/{id}/registry-decision"
    description: "Record the registry's accept or reject decision"
    roles: [RatingProviderAdmin]
    code: 200
    input: [outcome, "confirmation_number?", "rejection_reason?"]
    output: Rating
    side_effects: ["ACCEPT: registry_status := ACCEPTED, registry_confirmation_number set, stage := REGISTERED, file stays locked", "REJECT: registry_status := REJECTED, rejection_reason set, file_locked := false, submitted_index := null"]
  - method: POST
    path: "/inspections"
    description: "Schedule a rough-in or final checkpoint for an inspector, honoring the travel-buffered window rule"
    roles: [FieldInspector, CertifiedRater]
    code: 201
    input: [rating_id, inspector_id, checkpoint, scheduled_start_utc, scheduled_end_utc, "air_handler_installed?"]
    output: Inspection
    side_effects: ["status := SCHEDULED", "failed_test_count := 0", "air_handler_installed defaults to false"]
  - method: GET
    path: "/inspections/{id}"
    description: "Read an inspection with its failed-test counter"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List inspections filtered by rating, inspector or checkpoint"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: ["rating_id?", "inspector_id?", "checkpoint?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/tests"
    description: "Record a blower-door or duct-leakage measurement; normalizes it and grades it against the applicable threshold"
    roles: [FieldInspector]
    code: 201
    input: [test_type, measured_value]
    output: DiagnosticTest
    side_effects: ["runs blower_door_normalization or duct_leakage_normalization into normalized_value and threshold_value", "result := PASS | FAIL", "performed_at_utc := logical clock", "increments Inspection.failed_test_count when result == FAIL"]
  - method: GET
    path: "/inspections/{id}/tests"
    description: "List the append-only diagnostic measurements of a checkpoint"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: ["limit?", "offset?"]
    output: DiagnosticTest[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/complete"
    description: "Close a checkpoint as PASSED or FAILED based on its recorded tests"
    roles: [FieldInspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status := PASSED when failed_test_count == 0, else FAILED", "a PASSED ROUGH_IN checkpoint moves Rating.stage from PROJECTED to ROUGH_IN_VERIFIED"]
  - method: POST
    path: "/sample-sets"
    description: "Open a sampling window for a production subdivision"
    roles: [CertifiedRater]
    code: 201
    input: [subdivision_id, window_start_date, window_end_date]
    output: SampleSet
    side_effects: ["status := FORMING", "member counters initialised to 0"]
  - method: GET
    path: "/sample-sets/{id}"
    description: "Read a sample set with its membership counters, tested home and representative index"
    roles: [RatingProviderAdmin, CertifiedRater, FieldInspector, QADesignee, BuilderRep]
    code: 200
    input: []
    output: SampleSet
    side_effects: []
  - method: GET
    path: "/sample-sets"
    description: "List sample sets filtered by subdivision, tested home or status"
    roles: [RatingProviderAdmin, CertifiedRater, QADesignee, BuilderRep]
    code: 200
    input: ["subdivision_id?", "tested_home_id?", "status?", "limit?", "offset?"]
    output: SampleSet[]
    side_effects: []
  - method: POST
    path: "/sample-sets/{id}/homes"
    description: "Add a home to a forming sample set; guarded by optimistic concurrency on the set's version"
    roles: [CertifiedRater]
    code: 201
    input: [home_id, expected_sample_set_version]
    output: Home
    side_effects: ["Home.sample_set_id := this set, Home.sampling_role := MEMBER", "increments SampleSet.member_count", "increments SampleSet.version by 1", "recomputes home_coverage_ledger (sampled_home_count +1, unsampled_home_count -1)"]
  - method: POST
    path: "/sample-sets/{id}/homes/{home_id}/withdraw"
    description: "Withdraw a home from a forming sample set; guarded by optimistic concurrency on the set's version"
    roles: [CertifiedRater]
    code: 200
    input: [expected_sample_set_version]
    output: Home
    side_effects: ["Home.sample_set_id := null, Home.sampling_role := UNASSIGNED", "decrements SampleSet.member_count", "increments SampleSet.version by 1", "recomputes home_coverage_ledger (sampled_home_count -1, unsampled_home_count +1)"]
  - method: POST
    path: "/sample-sets/{id}/select"
    description: "Run the tested-home selector over the set's members"
    roles: [RatingProviderAdmin]
    code: 200
    input: []
    output: SampleSet
    side_effects: ["runs sample_tested_home_selection", "tested_home_id set; that Home.sampling_role := TESTED", "tested_member_count := 1", "status := SELECTED"]
  - method: POST
    path: "/sample-sets/{id}/close"
    description: "Close the set: pass it and propagate the representative index, or fail it and expand to individual testing"
    roles: [RatingProviderAdmin]
    code: 200
    input: []
    output: SampleSet
    side_effects: ["tested rating PASSING: runs sample_set_representative_index, marks other members REPRESENTED, writes representative_index onto their ratings, status := CLOSED_PASS", "tested rating FAILING: status := FAILED_EXPANDED and cascade B flags members for individual testing, clears their confirmed indices, opens SAMPLE_SET_FAILURE corrective actions and suspends the builder"]
  - method: POST
    path: "/qa-reviews"
    description: "Assign a QA file or field review to a QA designee other than the rating's rater"
    roles: [RatingProviderAdmin]
    code: 201
    input: [rating_id, reviewer_id, review_type]
    output: QAReview
    side_effects: ["status := ASSIGNED", "Rating.qa_status := QA_SELECTED"]
  - method: GET
    path: "/qa-reviews/{id}"
    description: "Read a QA review with its result and findings"
    roles: [RatingProviderAdmin, CertifiedRater, QADesignee]
    code: 200
    input: []
    output: QAReview
    side_effects: []
  - method: GET
    path: "/qa-reviews"
    description: "List QA reviews filtered by rating, reviewer or status"
    roles: [RatingProviderAdmin, CertifiedRater, QADesignee]
    code: 200
    input: ["rating_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: QAReview[]
    side_effects: []
  - method: POST
    path: "/qa-reviews/{id}/complete"
    description: "Record the QA outcome; FAIL_MAJOR triggers cascade A across packages, builder ledger and sampling"
    roles: [QADesignee]
    code: 200
    input: [result, findings_note]
    output: QAReview
    side_effects: ["status := COMPLETED, result and findings_note recorded", "Rating.qa_status := QA_PASSED on PASS, QA_FAILED on FAIL_MAJOR, unchanged (QA_SELECTED) on FAIL_MINOR", "reviewee Rater.qa_completed_count += 1 and qa_sampling_quota recomputed", "FAIL_MINOR / FAIL_MAJOR: Rater.qa_failure_count += 1 and certification_status steps ACTIVE -> PROBATION -> SUSPENDED", "FAIL_MINOR only: a QA_FINDING CorrectiveAction is opened and Builder.open_corrective_action_count += 1", "FAIL_MAJOR only: cascade A revokes ISSUED packages, decrements Builder.certified_incentive_cents, increments revoked_package_count, sets Builder.status := SAMPLING_SUSPENDED, voids open sample sets, releases their member homes with individual_testing_required := true and archives the subdivision's plan models"]
  - method: GET
    path: "/ratings/{id}/corrective-actions"
    description: "List the corrective actions opened against a rating (they are only ever created by cascade)"
    roles: [RatingProviderAdmin, CertifiedRater, QADesignee, BuilderRep]
    code: 200
    input: ["limit?", "offset?"]
    output: CorrectiveAction[]
    side_effects: []
  - method: POST
    path: "/corrective-actions/{id}/submit"
    description: "Builder submits or re-submits a remediation response"
    roles: [BuilderRep]
    code: 200
    input: [remediation_note]
    output: CorrectiveAction
    side_effects: ["status := SUBMITTED", "attempt_count += 1", "remediation_note recorded"]
  - method: POST
    path: "/corrective-actions/{id}/review"
    description: "Provider accepts or rejects the remediation; the third rejection escalates"
    roles: [RatingProviderAdmin]
    code: 200
    input: [decision, "note?"]
    output: CorrectiveAction
    side_effects: ["ACCEPT: status := ACCEPTED, Builder.open_corrective_action_count -= 1, Rating.compliance_status := REMEDIATION_PENDING", "REJECT with attempt_count < 3: status := REJECTED", "REJECT with attempt_count == 3: status := ESCALATED and Builder.status := SAMPLING_SUSPENDED"]
  - method: POST
    path: "/document-packages"
    description: "Draft a tax-credit or utility-program package against a rating; guarded by optimistic concurrency on the rating's version"
    roles: [BuilderRep]
    code: 201
    input: [rating_id, package_type, expected_rating_version]
    output: DocumentPackage
    side_effects: ["status := DRAFT", "runs incentive_amount PROVISIONAL into provisional_amount_cents and line_items", "any earlier DRAFT of the same package_type on this rating becomes SUPERSEDED", "increments Rating.version by 1"]
  - method: POST
    path: "/document-packages/{id}/issue"
    description: "Certify and issue a drafted package, moving the builder's money ledger"
    roles: [RatingProviderAdmin]
    code: 200
    input: []
    output: DocumentPackage
    side_effects: ["runs incentive_amount CERTIFIED into certified_amount_cents and line_items", "status := ISSUED, issued_at := logical clock", "Builder.certified_incentive_cents += certified_amount_cents (builder_incentive_ledger)"]
  - method: GET
    path: "/ratings/{id}/document-packages"
    description: "List the documentation packages of a rating"
    roles: [RatingProviderAdmin, CertifiedRater, QADesignee, BuilderRep]
    code: 200
    input: ["limit?", "offset?"]
    output: DocumentPackage[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the startup default) and never falls back to real wall-clock time. Every expiry, performed_at_utc stamp, confirmed_at and issued_at reads this clock."
    roles: [RatingProviderAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock := to_iso8601", "every Rater.effective_certification_status is re-derived against the new instant"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not one of the five declared roles, or X-User-ID missing for an entity_backed role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the called endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed actor operates on a resource that does not resolve to its own X-User-ID (e.g. a CertifiedRater confirming another rater's rating, a BuilderRep drafting a package on another builder's rating)"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, unknown enum member, out-of-range number, scheduled_end_utc <= scheduled_start_utc, window_end_date < window_start_date, or pagination outside limit 1..100 / offset >= 0"
  - id: ERR_BUILDER_NOT_FOUND
    http: 404
    condition: "no Builder with the given id"
  - id: ERR_SUBDIVISION_NOT_FOUND
    http: 404
    condition: "no Subdivision with the given id"
  - id: ERR_PLAN_MODEL_NOT_FOUND
    http: 404
    condition: "no PlanModel with the given id"
  - id: ERR_HOME_NOT_FOUND
    http: 404
    condition: "no Home with the given id, or the home named in a withdraw path is not a member of that sample set"
  - id: ERR_RATER_NOT_FOUND
    http: 404
    condition: "no Rater with the given id"
  - id: ERR_RATING_NOT_FOUND
    http: 404
    condition: "no Rating with the given id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no Inspection with the given id"
  - id: ERR_SAMPLE_SET_NOT_FOUND
    http: 404
    condition: "no SampleSet with the given id"
  - id: ERR_QA_REVIEW_NOT_FOUND
    http: 404
    condition: "no QAReview with the given id"
  - id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http: 404
    condition: "no CorrectiveAction with the given id"
  - id: ERR_DOCUMENT_PACKAGE_NOT_FOUND
    http: 404
    condition: "no DocumentPackage with the given id"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's current state does not permit the requested transition (e.g. completing an already PASSED inspection, selecting a set that is not FORMING, issuing a package that is not DRAFT, reviewing a corrective action that is not SUBMITTED, confirming a CONFIRMED rating whose compliance_status is not REMEDIATION_PENDING)"
  - id: ERR_RATING_VOID
    http: 409
    condition: "the rating reached from the target resource has stage == VOID"
  - id: ERR_RATING_FILE_LOCKED
    http: 409
    condition: "the rating reached from the target resource has file_locked == true (registry submission has locked the file)"
  - id: ERR_STALE_RATING_VERSION
    http: 412
    condition: "expected_rating_version does not equal the current Rating.version"
  - id: ERR_STALE_SAMPLE_SET_VERSION
    http: 412
    condition: "expected_sample_set_version does not equal the current SampleSet.version"
  - id: ERR_CERTIFICATION_INVALID
    http: 422
    condition: "a Rater the operation depends on has effective_certification_status SUSPENDED or EXPIRED"
  - id: ERR_CERT_LEVEL_INSUFFICIENT
    http: 422
    condition: "the Rater's cert_level does not authorise the operation (e.g. a RATING_FIELD_INSPECTOR confirming a rating, a RATER completing a QA review)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "the QA reviewer is the rating's own rater, or is the inspector of the governing FINAL checkpoint of a FIELD_REVIEW"
  - id: ERR_MISSING_GOVERNING_TEST
    http: 409
    condition: "the checkpoint's mandatory diagnostic tests are absent (ROUGH_IN needs DUCT_LEAKAGE_TOTAL; FINAL and confirmation need both BLOWER_DOOR and DUCT_LEAKAGE_TOTAL)"
  - id: ERR_REPRESENTED_HOME_NOT_TESTABLE
    http: 422
    condition: "a Home with individual_testing_required == true is added to a sample set or would be picked as the tested home"
  - id: ERR_PLAN_MODEL_MISMATCH
    http: 422
    condition: "the plan model belongs to a different subdivision than the home, or its status is ARCHIVED"
  - id: ERR_HOME_SUBDIVISION_MISMATCH
    http: 422
    condition: "the home added to a sample set belongs to a different subdivision than the set"
  - id: ERR_DUPLICATE_LOT_NUMBER
    http: 409
    condition: "another Home in the same Subdivision already uses this lot_number"
  - id: ERR_DUPLICATE_PLAN_CODE
    http: 409
    condition: "another PlanModel in the same Subdivision already uses this plan_code"
  - id: ERR_DUPLICATE_ACTIVE_RATING
    http: 409
    condition: "the home already has a non-void rating and the request does not supersede a VOID or QA_FAILED predecessor"
  - id: ERR_SAMPLING_NOT_ENABLED
    http: 422
    condition: "the subdivision has sampling_enabled == false"
  - id: ERR_HOME_ALREADY_SAMPLED
    http: 409
    condition: "the home already has a non-null sample_set_id"
  - id: ERR_HOME_PERMIT_OUTSIDE_WINDOW
    http: 422
    condition: "Home.permit_date lies outside the sample set's closed window [window_start_date, window_end_date]"
  - id: ERR_SAMPLE_SET_SIZE_INVALID
    http: 422
    condition: "an addition would push member_count above 7, or selection is attempted with member_count below 2"
  - id: ERR_BUILDER_SAMPLING_INELIGIBLE
    http: 422
    condition: "the builder is CUSTOM, is SAMPLING_SUSPENDED, or has open corrective actions, so sampling_eligible is false"
  - id: ERR_NO_ELIGIBLE_SAMPLE_HOME
    http: 422
    condition: "the tested-home selector's candidate set is empty (no member home has a PROJECTED, not-yet-submitted rating and individual_testing_required == false)"
  - id: ERR_SAMPLE_SET_NO_TESTED_RATING
    http: 409
    condition: "closing a sample set whose tested-home input set is empty because no tested home has a rating at stage CONFIRMED or REGISTERED"
  - id: ERR_RATING_NOT_COMPLIANT
    http: 422
    condition: "the rating's compliance_status is not PASSING, or its qa_status is QA_FAILED"
  - id: ERR_OPEN_CORRECTIVE_ACTION
    http: 409
    condition: "the rating has a CorrectiveAction with status IN {OPEN, SUBMITTED, REJECTED, ESCALATED}"
  - id: ERR_RATER_QA_DEFICIT
    http: 422
    condition: "the submitting rater has registry_hold == true because qa_sampling_quota leaves qa_files_owed > 0"
  - id: ERR_PACKAGE_NOT_ELIGIBLE
    http: 422
    condition: "confirmed_index exceeds the package's eligibility ceiling (55 for TAX_CREDIT_45L, 50 for UTILITY_PROGRAM)"
  - id: ERR_INSPECTOR_WINDOW_CONFLICT
    http: 409
    condition: "the inspector already holds a SCHEDULED inspection whose 45-minute travel-buffered half-open window overlaps the requested one"
  - id: ERR_SAMPLE_WINDOW_CONFLICT
    http: 409
    condition: "the subdivision already has a sample set in status FORMING, SELECTED or TESTED whose closed date window intersects the requested one, including sharing a single endpoint date"
  - id: ERR_PROGRAM_BUDGET_EXCEEDED
    http: 422
    condition: "issuing this UTILITY_PROGRAM package would push Builder.certified_incentive_cents above Builder.utility_program_budget_cents"

