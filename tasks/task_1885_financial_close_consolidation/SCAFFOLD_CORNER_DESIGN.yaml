  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: derived_field_unreconciled_count_reconciles_on_clear
        claim_type: derived_field_reconciliation
        grounds: ["entities.EntityPeriod.fields.unreconciled_count", "state_machines.Reconciliation.IN_REVIEW_to_CLEARED"]
        distinguishing_aspect: "EntityPeriod.unreconciled_count is a derived field that must stay consistent with its source Reconciliation rows: creating a recon increments it; clearing the recon decrements it back."
        test_recipe:
          setup: ["Period opened; entity-period SUBLEDGER_CUT; one out-of-tolerance reconciliation created"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - call: "POST /close/entity-periods/${ep_id}/reconciliations"
              payload: { account_code: "1010", recon_type: BANK, gl_balance_minor: 105000, subledger_balance_minor: 100000 }
              as: Preparer
              captures: { rec_id: $.data.id }
            - call: "GET /close/entity-periods/${ep_id}"
              payload: {}
              as: Preparer
              captures: { uc_after_create: $.data.unreconciled_count }
            - { call: "POST /close/reconciliations/${rec_id}/review", payload: {}, as: Preparer, as_user_id: "prep-1" }
          trigger:
            - { call: "POST /close/reconciliations/${rec_id}/clear", payload: {}, as: Preparer, as_user_id: "prep-2" }
            - call: "GET /close/entity-periods/${ep_id}"
              payload: {}
              as: Preparer
              captures: { uc_after_clear: $.data.unreconciled_count }
          assert:
            - "after recon create: unreconciled_count == 1"
            - "after recon clear: unreconciled_count == 0 (derived field reconciled with source)"

      - name: occ_version_increments_on_every_period_mutation
        claim_type: optimistic_concurrency
        grounds: ["complexity_profile", "entities.ClosePeriod"]
        distinguishing_aspect: "ClosePeriod.version starts at 1 on create and increments by exactly 1 on each mutation (open, soft-lock) — the OCC monotonicity the concurrency rules rely on."
        test_recipe:
          setup: ["Period created, then opened"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id, v_create: $.data.version }
          trigger:
            - call: "POST /close/periods/${per_id}/open"
              payload: {}
              as: Controller
              captures: { v_after_open: $.data.version }
          assert:
            - "version at create == 1"
            - "version after open == 2 (incremented by exactly 1 on the mutation)"

