      - "plan_status PLANNING_REVISION -> AUTHORIZATION_PENDING; plan_blocked_reason cleared"
      - "each Preauthorization of this plan with review_status DENIED and denial_reason_code CLINIC_NOT_CONTRACTED -> CLINICAL_REVIEW"
      - "version incremented"

  - method: POST
    path: "/treatment-plans/{id}/abandon"
