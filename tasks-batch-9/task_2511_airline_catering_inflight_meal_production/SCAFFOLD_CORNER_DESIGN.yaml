            - "HTTP 409 with data.error_id == \"ERR_MANIFEST_NOT_ISSUED\""
            - "LoadingManifest.${mf_id}.status == \"DRAFT\" with cart_seal_snapshot empty and total_units == 0"
            - "Flight.${f_id}.status == \"PLANNED\" and GET /delivery-runs with loading_manifest_id ${mf_id} returns total_count == 0"

      - name: an_order_captured_exactly_at_the_cutoff_instant_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=110]
          - errors[ERR_SPECIAL_MEAL_CUTOFF_PASSED]
          - entities.Flight.fields.special_meal_cutoff_utc
        distinguishing_aspect: |
          The comparison is "at or after", so the cutoff instant itself is already closed: one minute
          before 2026-09-14T22:00:00Z is accepted and the exact instant is refused.
        test_recipe:
          setup:
            - "Flight AN411 std 2026-09-15T10:00:00Z gives special_meal_cutoff_utc 2026-09-14T22:00:00Z."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_spec_v
            - *k_flt
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-14T21:59:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /special-meal-orders", payload: { flight_id: "${f_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PNR-D1", seat_number: "18A" }, as: AirlineRep, as_user_id: "${an_id}", captures: { ord_ok_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-14T22:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /special-meal-orders", payload: { flight_id: "${f_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PNR-D2", seat_number: "18B" }, as: AirlineRep, as_user_id: "${an_id}" }
          assert:
            - "call 1 -> HTTP 201 with SpecialMealOrder.${ord_ok_id}.status \"REQUESTED\" and requested_at == \"2026-09-14T21:59:00Z\""
            - "call 3 -> HTTP 422 ERR_SPECIAL_MEAL_CUTOFF_PASSED at exactly the cutoff instant"
            - "GET /special-meal-orders with flight_id ${f_id} returns total_count == 1"

      - name: a_missing_haccp_step_is_reported_before_a_failing_one
          # ladder rung (i) short-circuits rung (ii)
        claim_type: cascading_validation
        grounds:
          - validations[priority=80]
          - errors[ERR_HACCP_STEP_MISSING]
          - errors[ERR_HACCP_HOLD_ACTIVE]
        distinguishing_aspect: |
          The four food-safety gates are a short-circuiting ladder: a batch that never had a CHILL_DOWN
          check AND whose latest HOLD_TEMP check FAILED violates rungs (i) and (ii) at once, and only
          (i) is reported. The completing call itself is unaffected — the ladder guards /start, /release
          and cart loading, not /complete.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch requires CHILL_DOWN and HOLD_TEMP; only HOLD_TEMP was ever checked, first PASSing at 4.0 and then FAILing at 5.1."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 5.1 }, as: QaOfficer }
          trigger:
            - { call: "POST /production-batches/${b_y_id}/release", payload: {}, as: ProductionSupervisor }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_HACCP_STEP_MISSING\", NOT ERR_HACCP_HOLD_ACTIVE — rung (i) short-circuits the ladder"
            - "GET /haccp-checks with production_batch_id ${b_y_id} and step_code \"CHILL_DOWN\" returns total_count == 0"
            - "the batch reached \"COMPLETED\" with produced_qty 180 even though a required step was never checked"
            - "ProductionBatch.${b_y_id}.production_status == \"COMPLETED\" and released_at is null"

      - name: a_fully_conforming_release_passes_every_band_in_order
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=80]
          - state_machines.ProductionBatch.COMPLETED_to_RELEASED
          - entities.ProductionBatch.fields.released_by_user_id
        distinguishing_aspect: |
          The positive path proves the gates are not blanket refusals: with every required step checked
          and PASSing, no rework rounds consumed and the logical clock 05:30 comfortably before the
          08:30 deadline, all four rungs are satisfied and the release records who certified it.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch is COMPLETED at 05:30 with CHILL_DOWN 6.0 PASS and HOLD_TEMP 4.0 PASS, and its release deadline is 08:30."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
          trigger:
            - { call: "POST /production-batches/${b_y_id}/release", payload: {}, as: ProductionSupervisor, as_user_id: "ps_carol" }
          assert:
            - "HTTP 200 with data.production_status == \"RELEASED\""
            - "data.released_at == \"2026-09-15T05:30:00Z\" and data.released_by_user_id == \"ps_carol\""
            - "data.haccp_rework_rounds == 0 and haccp_risk_score == 0.00"
            - "data.release_deadline_utc == \"2026-09-15T08:30:00Z\" — the clock is before it, so rung (iv) passes"

      - name: the_count_lock_state_check_outranks_the_special_meal_cutoff
        claim_type: priority_conflict
        grounds:
          - priority_conflict_pairs[0]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / counts_locked_at_priority_70_outranks_the_special_meal_cutoff_at_110
          rationale: "That §1.8 instance builds the doubly-invalid order request and shows ERR_FLIGHT_COUNTS_LOCKED winning over ERR_SPECIAL_MEAL_CUTOFF_PASSED."

      - name: the_release_deadline_gate_outranks_cart_capacity
        claim_type: priority_conflict
        grounds:
          - priority_conflict_pairs[1]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / release_deadline_at_priority_80_outranks_cart_capacity_at_100
          rationale: "That §1.8 instance loads an over-capacity quantity from a batch past its deadline and shows ERR_RELEASE_DEADLINE_PASSED winning."

      - name: the_storage_class_check_outranks_the_cost_cap
        claim_type: priority_conflict
        grounds:
          - priority_conflict_pairs[2]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / storage_class_mismatch_at_priority_90_outranks_the_cost_cap_at_120
          rationale: "That §1.8 instance submits a cart item that is both zone-mismatched and cap-breaching and shows ERR_STORAGE_CLASS_MISMATCH winning."

      - name: the_stand_occupancy_limit_counts_runs_across_flights
        claim_type: aggregate_validation
        grounds:
          - validations[priority=110]
          - errors[ERR_STAND_CAPACITY_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / stand_closed_interval_aggregate_limit_rejects_the_third_run_sharing_one_instant
          rationale: "That §1.8 instance builds two accepted runs that touch at a single instant and shows the third one refused by the closed-interval aggregate limit."
  # =========================================================================
  # Guide section 5 — From Table 5 (Endpoints)
  # =========================================================================
  - section: endpoints
    instances:

      - name: the_truck_reference_endpoints_form_a_complete_crud_surface
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/trucks
          - endpoints.PATCH_/trucks/{id}
          - endpoints.GET_/trucks
          - endpoints.GET_/trucks/{id}
        distinguishing_aspect: |
          Truck is the scaffold's one fully CRUD-shaped reference entity (create, read, list with
          filters, partial update) with no DELETE — retirement is a status change — and the PATCH is
          genuinely partial: sending only buffer_minutes leaves status untouched.
        test_recipe:
          setup:
            - "Empty database with the clock parked."
          setup_api_calls:
            - *k_clk0
          trigger:
            - { call: "POST /trucks", payload: { station_code: "OSL", registration: "HL-201", buffer_minutes: 15 }, as: PlatformAdmin, captures: { tk_id: $.data.id } }
            - { call: "GET /trucks/${tk_id}", payload: {}, as: LoadMaster }
            - { call: "PATCH /trucks/${tk_id}", payload: { buffer_minutes: 25 }, as: PlatformAdmin }
            - { call: "PATCH /trucks/${tk_id}", payload: { status: "MAINTENANCE" }, as: PlatformAdmin }
            - { call: "GET /trucks", payload: { station_code: "OSL", status: "MAINTENANCE" }, as: LoadMaster }
          assert:
            - "the create returns 201 with status \"ACTIVE\", buffer_minutes 15, version 1"
            - "the GET returns the identical row with version 1"
            - "PATCH 1 -> buffer_minutes 25, status still \"ACTIVE\", version 2 — the omitted field was not reset to its default"
            - "PATCH 2 -> status \"MAINTENANCE\", buffer_minutes still 25, version 3"
            - "the list returns total_count == 1 with data[0].id == ${tk_id}; filtering status \"ACTIVE\" returns total_count == 0"
            - "§1.5 declares no DELETE for /trucks/{id} — trucks are retired by status, never removed"

      - name: writing_pax_counts_after_the_count_lock_returns_flight_counts_locked
        claim_type: conditional_action
        grounds:
          - endpoints.PATCH_/flights/{id}/pax-counts
          - validations[priority=70]
          - errors[ERR_FLIGHT_COUNTS_LOCKED]
        distinguishing_aspect: |
          pax-counts is conditional on SCHEDULED and gets its OWN specialised code rather than the
          generic ERR_INVALID_FLIGHT_STATE, because a rejected count update is an operationally
          different event from an illegal transition. The counts and the provisional units are frozen.
        test_recipe:
          setup:
            - "Flight AN411 with 180 ECONOMY passengers was locked at 2026-09-15T03:00:00Z."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
          trigger:
            - { call: "PATCH /flights/${f_id}/pax-counts", payload: { pax_economy: 200 }, as: ScheduleFeedOperator }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_FLIGHT_COUNTS_LOCKED\", not ERR_INVALID_FLIGHT_STATE"
            - "Flight.${f_id}.pax_economy == 180, total_pax == 180, units_planned_provisional == 185"
            - "Flight.${f_id}.status == \"COUNTS_LOCKED\" and version == 2"

      - name: retiming_a_flight_earlier_then_delaying_it_walks_an_order_out_of_and_back_into_confirmation
        claim_type: conditional_action
        grounds:
          - endpoints.PATCH_/flights/{id}/schedule
          - state_machines.SpecialMealOrder.REQUESTED_to_LATE_REJECTED
          - state_machines.SpecialMealOrder.LATE_REJECTED_to_REQUESTED
        distinguishing_aspect: |
          PATCH schedule is the only operation that can move the cutoff BACKWARDS, and it deliberately
          does not re-evaluate orders: the order stays REQUESTED until the count lock judges it late.
          A later 300-minute delay pushes the cutoff back past requested_at, reopening the order and —
          because counts_locked_at is already set — confirming it in the same cascade.
        test_recipe:
          setup:
            - "Flight AN416 std 2026-09-16T10:00:00Z gives a cutoff of 2026-09-15T22:00:00Z."
            - "One VGML order was captured at 2026-09-15T12:00:00Z, comfortably inside that cutoff."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_spec_v
            - { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN416", service_date: "2026-09-16", std_utc: "2026-09-16T10:00:00Z", tail_number: "LN-HHH", station_code: "OSL", pax_economy: 60 }, as: ScheduleFeedOperator, captures: { f16_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /special-meal-orders", payload: { flight_id: "${f16_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PNR-E1", seat_number: "30A" }, as: AirlineRep, as_user_id: "${an_id}", captures: { ord16_id: $.data.id } }
          trigger:
            - { call: "PATCH /flights/${f16_id}/schedule", payload: { std_utc: "2026-09-15T20:00:00Z" }, as: ScheduleFeedOperator }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T13:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /flights/${f16_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - { call: "POST /flights/${f16_id}/delays", payload: { delay_minutes: 300, reason: "AIRCRAFT_ROTATION" }, as: ScheduleFeedOperator }
          assert:
            - "the order was created with status \"REQUESTED\" and requested_at \"2026-09-15T12:00:00Z\""
            - "after the retime: Flight.${f16_id}.std_utc == \"2026-09-15T20:00:00Z\", special_meal_cutoff_utc == \"2026-09-15T08:00:00Z\", and SpecialMealOrder.${ord16_id}.status is STILL \"REQUESTED\""
            - "after the lock: SpecialMealOrder.${ord16_id}.status == \"LATE_REJECTED\" — requested_at 12:00 is after the retimed 08:00 cutoff"
            - "after the delay: Flight.${f16_id}.revised_std_utc == \"2026-09-16T01:00:00Z\" and special_meal_cutoff_utc == \"2026-09-15T13:00:00Z\""
            - "after the delay: SpecialMealOrder.${ord16_id}.status == \"CONFIRMED\" — it reopened to REQUESTED and, counts_locked_at being set, was confirmed in the same cascade"
            - "Flight.${f16_id}.status == \"COUNTS_LOCKED\" throughout the delay"

      - name: retiring_the_only_standard_specification_empties_the_next_plan_without_touching_the_last
        claim_type: action_endpoint
        grounds:
          - endpoints.PATCH_/meal-specifications/{id}
          - state_machines.Flight.COUNTS_LOCKED_to_PLANNED
          - calculations.flight_meal_requirement
        distinguishing_aspect: |
          Retirement is forward-only: an already-created batch keeps its planned_qty, while a flight
          planned afterwards has no ACTIVE STANDARD ECONOMY specification to select and legitimately
          reaches PLANNED with units_planned 0 and zero batches — the documented empty-plan corner.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with one 180-unit AN-Y-STD batch; AN-Y-STD is then retired."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
          trigger:
            - { call: "PATCH /meal-specifications/${spec_y_id}", payload: { status: "RETIRED", unit_cost_cents: 1500 }, as: PlatformAdmin }
            - { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN425", service_date: "2026-09-15", std_utc: "2026-09-15T14:00:00Z", tail_number: "LN-JJJ", station_code: "OSL", pax_economy: 50 }, as: ScheduleFeedOperator, captures: { f25_id: $.data.id } }
            - { call: "POST /flights/${f25_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - { call: "POST /flights/${f25_id}/production-plan", payload: {}, as: ProductionSupervisor }
          assert:
            - "the PATCH returns status \"RETIRED\" and unit_cost_cents 1500 with version 2"
            - "ProductionBatch of AN411 still has planned_qty 180 and Flight.${f_id}.units_planned == 180"
            - "Flight.${f25_id}.units_planned_provisional == 0 — no ACTIVE STANDARD ECONOMY specification remains to select"
            - "the plan call returns response_type \"array\" with len(data) == 0"
            - "Flight.${f25_id}.status == \"PLANNED\" with units_planned == 0 — total_pax >= 1 but an empty plan is still a valid plan"

      - name: haccp_checks_are_reachable_from_the_batch_by_filter_including_by_verdict
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/haccp-checks
          - entities.HaccpCheck.fields.production_batch_id
          - calculations.haccp_check_verdict
        distinguishing_aspect: |
          HaccpCheck has no per-batch sub-collection endpoint, so the batch -> checks link is expressed
          purely through query filters, and the filters compose: production_batch_id alone returns the
          audit trail in full, adding verdict FAIL isolates the breach, adding step_code narrows further.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch is IN_PRODUCTION with CHILL_DOWN 6.0 PASS, HOLD_TEMP 4.0 PASS and a HOLD_TEMP re-check at 5.1."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 5.1 }, as: QaOfficer, captures: { hc_fail_id: $.data.id } }
          trigger:
            - { call: "GET /haccp-checks", payload: { production_batch_id: "${b_y_id}" }, as: QaOfficer }
            - { call: "GET /haccp-checks", payload: { production_batch_id: "${b_y_id}", verdict: "FAIL" }, as: QaOfficer }
            - { call: "GET /haccp-checks", payload: { production_batch_id: "${b_y_id}", step_code: "CHILL_DOWN", verdict: "PASS" }, as: QaOfficer }
          assert:
            - "call 1 -> total_count == 3 covering both step codes"
            - "call 2 -> total_count == 1 with data[0].id == ${hc_fail_id} and sequence_no == 2"
            - "call 3 -> total_count == 1 with step_code \"CHILL_DOWN\" and sequence_no == 1"
            - "the batch is in \"HACCP_HOLD\" after the failing re-check, with haccp_risk_score 40.00"

      - name: deleting_an_already_voided_cart_item_returns_invalid_resource_state
        claim_type: action_endpoint
        grounds:
          - endpoints.DELETE_/carts/{id}/items/{cart_item_id}
          - validations[priority=70]
          - errors[ERR_INVALID_RESOURCE_STATE]
        distinguishing_aspect: |
          The delete is a soft VOID, so the row still exists on the second attempt: the reply is a
          priority-70 state refusal, not a 404, and none of the first delete's aggregate reversals are
          applied twice.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with one 180-unit item in cart CHL-01."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
          trigger:
            - { call: "DELETE /carts/${cart_id}/items/${item_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "DELETE /carts/${cart_id}/items/${item_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
          assert:
            - "call 1 -> HTTP 200 with status \"VOID\"; Cart.${cart_id}.loaded_units == 0 and build_status \"BUILDING\""
            - "call 2 -> HTTP 409 with data.error_id == \"ERR_INVALID_RESOURCE_STATE\" (not a 404 — the row is still there)"
            - "CartItem.${item_id} still exists with status \"VOID\" and its original voided_at"
            - "Cart.${cart_id}.loaded_units is still 0 and Flight.${f_id}.units_loaded == 0 — nothing was reversed twice"

      - name: the_cost_report_recomputes_the_cabin_blend_on_every_read
        claim_type: computed_read
        grounds:
          - endpoints.GET_/flights/{id}/cost-report
        excluded_because:
          difficulty_instance: combinatorial_formula / cost_per_passenger_rounds_per_cabin_before_blending_not_after
          rationale: "That §1.8 instance reads the report on the three-cabin fixture and asserts the whole payload including cabin_breakdown, cap_breached and the pinned 2029 blend."

  # =========================================================================
  # Guide section 6 — From Table 6 (Errors)
  # =========================================================================
  - section: errors
    instances:

      - name: the_error_envelope_carries_only_an_error_id_and_a_message
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors[ERR_FLIGHT_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Failures keep the same three-key outer envelope as successes but with response_type "error"
          and a data object of exactly two keys — never a bare string, never an extra details blob — and
          meta still carries the request id, so a client can correlate a failure with its request.
        test_recipe:
          setup:
            - "Empty database with the clock parked."
          setup_api_calls:
            - *k_clk0
          trigger:
            - { call: "GET /flights/00000000-0000-4000-8000-000000000000", payload: {}, as: ScheduleFeedOperator, captures: { err_id: $.data.error_id, err_msg: $.data.message } }
          assert:
            - "HTTP 404 and the body has exactly the keys meta, response_type and data"
            - "response_type == \"error\" and data has exactly the keys error_id and message"
            - "${err_id} == \"ERR_FLIGHT_NOT_FOUND\" and ${err_msg} is a non-empty human-readable string"
            - "meta.api_request_id is present on the failure exactly as on a success"

      - name: loading_one_unit_beyond_a_carts_capacity_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=100]
          - errors[ERR_CART_CAPACITY_EXCEEDED]
          - entities.Cart.fields.capacity_units
        distinguishing_aspect: |
          The bound is on the cart's RESULTING loaded_units, and it is inclusive: 100 units fill a
          100-unit cart exactly, while 101 is refused with nothing written — the surplus is not
          silently clipped and no partial item row appears.
        test_recipe:
          setup:
            - "Flight AN411 has a RELEASED 180-unit CHILL batch and cart CHL-02 with capacity_units 100."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_cart2
          trigger:
            - { call: "POST /carts/${cart2_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 101 }, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "POST /carts/${cart2_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 100 }, as: LoadMaster, as_user_id: "lm_alice", captures: { it_id: $.data.id } }
          assert:
            - "call 1 -> HTTP 422 ERR_CART_CAPACITY_EXCEEDED; GET /cart-items with cart_id ${cart2_id} returns total_count == 0"
            - "call 2 -> HTTP 201; Cart.${cart2_id}.loaded_units == 100 == capacity_units, build_status \"BUILDING\""
            - "Flight.${f_id}.units_loaded == 100 and unit_balance == 80"

      - name: a_single_first_class_meal_above_the_contractual_cap_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=120]
          - errors[ERR_COST_CAP_EXCEEDED]
          - calculations.cost_per_passenger_report
        distinguishing_aspect: |
          The money ceiling is checked last of all bands and against the RESULTING per-passenger blend,
          not the line total: one 4200-cent FIRST meal for a single passenger blends to 4704 cents per
          passenger, far past this airline's 1500-cent cap, so the load is refused after every safety,
          reference, state, capacity and temporal check has already passed.
        test_recipe:
          setup:
            - "Airline CC (DOMESTIC) has cost_cap_per_pax_cents 1500 and one FIRST/HOT specification at 4200 cents."
            - "Flight CC902 carries a single FIRST passenger and its 1-unit HOT batch is RELEASED."
          setup_api_calls:
            - *k_clk0
            - { call: "POST /airlines", payload: { name: "CostCap Air", iata_code: "CC", waste_regime: "DOMESTIC", cost_cap_per_pax_cents: 1500 }, as: PlatformAdmin, captures: { cc_id: $.data.id } }
            - { call: "POST /meal-specifications", payload: { airline_id: "${cc_id}", spec_code: "CC-F-STD", cabin: "FIRST", meal_code: "STANDARD", storage_class: "HOT", portion_grams: 420, gross_weight_grams: 900, unit_cost_cents: 4200, shelf_life_hours: 4, required_haccp_steps: ["COOK_TEMP", "HOLD_TEMP"] }, as: PlatformAdmin, captures: { cc_spec_id: $.data.id } }
            - { call: "POST /flights", payload: { airline_id: "${cc_id}", flight_number: "CC902", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "SE-CCC", station_code: "OSL", pax_first: 1 }, as: ScheduleFeedOperator, captures: { cc_f_id: $.data.id } }
            - *k_clk_lock
            - { call: "POST /flights/${cc_f_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - *k_clk_plan
            - { call: "POST /flights/${cc_f_id}/production-plan", payload: {}, as: ProductionSupervisor, captures: { cc_b_id: "$.data[0].id" } }
            - *k_clk_prod
            - { call: "POST /production-batches/${cc_b_id}/start", payload: {}, as: ProductionSupervisor }
            - *k_clk_qa
            - { call: "POST /production-batches/${cc_b_id}/haccp-checks", payload: { step_code: "COOK_TEMP", measured_temp_c: 80.0 }, as: QaOfficer }
            - { call: "POST /production-batches/${cc_b_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 4.0 }, as: QaOfficer }
            - *k_clk_cmpl
            - { call: "POST /production-batches/${cc_b_id}/complete", payload: { produced_qty: 1 }, as: ProductionSupervisor }
            - { call: "POST /production-batches/${cc_b_id}/release", payload: {}, as: ProductionSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T06:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /carts", payload: { flight_id: "${cc_f_id}", cart_code: "HOT-01", cart_type: "OVEN_RACK", storage_class: "HOT", capacity_units: 10, galley_position: "F1" }, as: LoadMaster, as_user_id: "lm_alice", captures: { cc_cart_id: $.data.id } }
          trigger:
            - { call: "POST /carts/${cc_cart_id}/items", payload: { production_batch_id: "${cc_b_id}", qty_units: 1 }, as: LoadMaster, as_user_id: "lm_alice" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_COST_CAP_EXCEEDED\""
            - "the resulting blend would have been 4704 == round_half_up(1 * 4200 * 1.12) per passenger against a 1500-cent cap"
            - "Cart.${cc_cart_id}.loaded_units == 0 and build_status \"EMPTY\"; GET /cart-items with cart_id ${cc_cart_id} returns total_count == 0"
            - "Flight.${cc_f_id}.cost_per_pax_cents == 0 and units_loaded == 0"
            - "the batch's HOT release deadline of 2026-09-15T08:00:00Z had not passed, so this is not a rung-(iv) refusal"

      - name: err_haccp_rework_limit_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HACCP_REWORK_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / batch_cycles_twice_through_haccp_hold_and_is_then_barred_from_release
          rationale: "That §1.8 instance consumes both rework rounds and then shows the release refused with ERR_HACCP_REWORK_LIMIT while every required step's latest check PASSes."

      - name: err_airline_suspended_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_AIRLINE_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / third_open_finding_suspends_the_airline_and_blocks_then_unblocks_planning
          rationale: "That §1.8 instance drives open_finding_count to 3, shows planning refused with ERR_AIRLINE_SUSPENDED, then reverses one finding and plans successfully."

      - name: err_flight_counts_locked_is_triggerable_from_the_order_path
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FLIGHT_COUNTS_LOCKED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / counts_locked_at_priority_70_outranks_the_special_meal_cutoff_at_110
          rationale: "That §1.8 instance triggers the same code from POST /special-meal-orders; the pax-counts arm is covered by this file's writing_pax_counts_after_the_count_lock_returns_flight_counts_locked."

      - name: err_release_deadline_passed_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RELEASE_DEADLINE_PASSED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / release_deadline_at_priority_80_outranks_cart_capacity_at_100
          rationale: "That §1.8 instance advances the clock past release_deadline_utc and asserts the code on POST /carts/{id}/items."

      - name: err_storage_class_mismatch_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STORAGE_CLASS_MISMATCH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / storage_class_mismatch_at_priority_90_outranks_the_cost_cap_at_120
          rationale: "That §1.8 instance loads a HOT batch into a CHILL cart and asserts the code."

      - name: err_batch_not_released_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BATCH_NOT_RELEASED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cart_item_load_requires_the_source_batch_to_be_released
          rationale: "That §1.8 instance walks the batch through every pre-RELEASED status and asserts the code at each one."

      - name: err_truck_slot_conflict_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TRUCK_SLOT_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / truck_half_open_window_plus_buffer_rejects_and_accepts_at_the_boundary
          rationale: "That §1.8 instance probes both sides of the buffered boundary on one truck and asserts the code on the conflicting side."

      - name: err_stand_capacity_conflict_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STAND_CAPACITY_CONFLICT]
