              as: HostOperator
              captures: { site_j1: $.data.id }
            - call: "GET /api/hosts/${h_jn}"
              payload: {}
              as: HostOperator
              captures: { h_jn_v1: $.data.version }
            - call: "POST /api/hosts/${h_jn}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_jn_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "join@x.com", full_name: "Join Member", plan_tier: "PLUS", home_state_code: "TX" }
