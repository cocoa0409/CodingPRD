# =============================================================================
# Task 1916 — Scenic Shop & Set Fabrication — SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.8 Test Targeting Index — 9 rules x 3 instances (maximum coverage).
# All fixture arithmetic was executed by hand against the pinned formulas:
#   standard shop: rate 8000c/h, overhead 1000bp, margin 2000bp, overtime
#   15000bp, capacity 100h/wk x 4wk = 400 crew-hours.
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bid_price_rom_vs_detailed_same_package
        grounds:
          - calculations.bid_price_rom
          - calculations.bid_price_detailed
          - entities.Bid.fields.price_cents
        distinguishing_aspect: |
          Same design package priced by two valid algorithms in the Bid/cost
          domain: ROM (area x complexity rate x urgency) yields 3500000 cents
          while DETAILED (takeoff lines + labor + overhead + margin) yields
          1240800 cents — the variant selected by pricing_variant changes the
          observable price for identical scope.
        test_recipe:
          setup:
            - "Shop with standard rates; one client; one design package with load_in 2026-08-29 (exactly 28 days out -> ROM urgency multiplier applies)"
            - "A DETAILED bid (takeoff: 100 labor hours; one line LUMBER_4X8 qty 28 x 5000c, waste 0) and a ROM bid (200 sqft, B_STANDARD) coexist as DRAFTs on the same package"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-08-29T00:00:00Z", strike_at: "2026-09-12T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/takeoffs"
              payload: { design_package_id: "${pkg_id}", labor_hours_est: 100 }
              as: Estimator
              captures: { to_id: $.data.id, to_v: $.data.version }
            - call: "POST /scenic/takeoff-lines"
              payload: { takeoff_id: "${to_id}", expected_takeoff_version: "${to_v}", material_code: "LUMBER_4X8", quantity: 28, source: "PURCHASE", unit_cost_cents: 5000 }
              as: Estimator
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "DETAILED", takeoff_id: "${to_id}", has_automation_scope: false, bays_required: 1, build_start_at: "2026-08-05T00:00:00Z", validity_days: 30 }
              as: Estimator
              captures: { bid_det: $.data.id, price_det: $.data.price_cents }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-08-05T00:00:00Z", validity_days: 30, floor_area_sqft: 200, complexity_class: "B_STANDARD", estimated_crew_hours: 100 }
              as: Estimator
              captures: { bid_rom: $.data.id, price_rom: $.data.price_cents }
          trigger:
            - call: "GET /scenic/bids/${bid_det}"
              payload: {}
              as: Estimator
            - call: "GET /scenic/bids/${bid_rom}"
              payload: {}
              as: Estimator
          assert:
            - "Bid.${bid_det}.price_cents == 1240800  # materials 140000 + labor 800000 = 940000; overhead 94000; margin 206800"
            - "Bid.${bid_rom}.price_cents == 3500000   # 200 sqft x 14000 x 12500bp urgency (28 days <= 28)"
            - "Bid.${bid_det}.price_cents != Bid.${bid_rom}.price_cents"

      - name: safety_factor_structural_vs_automation_same_members
        grounds:
          - calculations.engineering_safety_factor
          - state_machines.EngineeringReview.PENDING_to_APPROVED
          - errors[ERR_SAFETY_FACTOR_INSUFFICIENT]
        distinguishing_aspect: |
          Same physical numbers (design_load_lb 4000, member_capacity_lb 6000)
          in the EngineeringReview/safety domain: the STRUCTURAL variant
          verdict passes (sf_static 1.50 >= 1.50) while the AUTOMATION variant
          (impact 15000bp) computes sf_dynamic 1.00 < 2.00 and its approve is
          rejected — identical inputs, divergent verdicts per scope variant.
        test_recipe:
          setup:
            - "Production exists (ROM bid accepted) in SCHEDULED"
            - "Two PENDING reviews on the production with identical load 4000 / capacity 6000: one STRUCTURAL, one AUTOMATION with impact_factor_bp 15000"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: true, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { prod_id: $.data.production_id }
            - call: "POST /scenic/engineering-reviews"
              payload: { production_id: "${prod_id}", scope: "STRUCTURAL", design_load_lb: 4000, member_capacity_lb: 6000 }
              as: ShopForeman
              as_user_id: "foreman_1"
              captures: { rev_s: $.data.id }
            - call: "POST /scenic/engineering-reviews"
              payload: { production_id: "${prod_id}", scope: "AUTOMATION", design_load_lb: 4000, member_capacity_lb: 6000, impact_factor_bp: 15000 }
              as: ShopForeman
              as_user_id: "foreman_1"
              captures: { rev_a: $.data.id, rev_a_sfd: $.data.sf_dynamic }
          trigger:
            - call: "POST /scenic/engineering-reviews/${rev_s}/approve"
              payload: {}
              as: StaffEngineer
              as_user_id: "eng_2"
            - call: "POST /scenic/engineering-reviews/${rev_a}/approve"
              payload: {}
              as: StaffEngineer
              as_user_id: "eng_2"
              captures: { auto_err: $.data.error_id }
          assert:
            - "EngineeringReview.${rev_s}.status == APPROVED and sf_static == 1.5"
            - "EngineeringReview.${rev_a}.sf_dynamic == 1.0  # 6000 / (4000 x 1.5)"
            - "second approve response error_id == ERR_SAFETY_FACTOR_INSUFFICIENT (HTTP 422)"
            - "EngineeringReview.${rev_a}.status == PENDING (still)"

      - name: stock_valuation_replacement_vs_recovery
        grounds:
          - calculations.stock_valuation
          - entities.StockItem.fields.reuse_value_cents
          - entities.StockItem.fields.replacement_value_cents
        distinguishing_aspect: |
          Same StockItem valued by two valid bases in the inventory domain:
          replacement basis (qty x replacement_cost) vs recovery basis
          (qty x condition-adjusted reuse cost) — for grade B the recovery
          value is exactly 40% of replacement, so the two computed fields on
          the same row diverge (50000 vs 20000 cents).
        test_recipe:
          setup:
            - "Shop exists; one StockItem: material LUMBER_4X8, grade B, qty 10, replacement_cost_cents 5000"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/stock-items"
              payload: { shop_id: "${shop_id}", material_code: "LUMBER_4X8", condition_grade: "B", quantity_on_hand: 10, replacement_cost_cents: 5000 }
              as: ShopAdmin
              captures: { si_id: $.data.id }
          trigger:
            - call: "GET /scenic/stock-items/${si_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "StockItem.${si_id}.reuse_unit_cost_cents == 2000       # 5000 x 4000bp"
            - "StockItem.${si_id}.reuse_value_cents == 20000          # 10 x 2000"
            - "StockItem.${si_id}.replacement_value_cents == 50000    # 10 x 5000"
            - "StockItem.${si_id}.reuse_value_cents != StockItem.${si_id}.replacement_value_cents"
            - "Shop.${shop_id}.inventory_value_cents == 20000         # recovery basis only"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes (b), (a), (c))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: detailed_bid_per_line_rounding_order
        grounds:
          - calculations.bid_price_detailed
          - entities.TakeoffLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two identical lines (qty 3 x 1999c x
          11500bp waste = 6896.55c) — the pinned rule rounds PER LINE then sums
          (6897 + 6897 = 13794) whereas sum-then-round yields 13793; the
          pinned order propagates to price_cents 28768 (vs 28766 for the
          alternative), so the assertion separates the two readings.
        test_recipe:
          setup:
            - "Shop standard rates (overhead 1000bp, margin 2000bp, rate 8000c/h); client; package"
            - "Takeoff with labor_hours_est 1 and two identical lines: qty 3, unit 1999, waste 1500bp"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/takeoffs"
              payload: { design_package_id: "${pkg_id}", labor_hours_est: 1 }
              as: Estimator
              captures: { to_id: $.data.id, to_v: $.data.version }
            - call: "POST /scenic/takeoff-lines"
              payload: { takeoff_id: "${to_id}", expected_takeoff_version: "${to_v}", material_code: "STEEL_TUBE", quantity: 3, source: "PURCHASE", unit_cost_cents: 1999, waste_pct_bp: 1500 }
              as: Estimator
              captures: { line1_total: $.data.line_total_cents }
            - call: "GET /scenic/takeoffs/${to_id}"
              payload: {}
              as: Estimator
              captures: { to_v2: $.data.version }
            - call: "POST /scenic/takeoff-lines"
              payload: { takeoff_id: "${to_id}", expected_takeoff_version: "${to_v2}", material_code: "STEEL_TUBE", quantity: 3, source: "PURCHASE", unit_cost_cents: 1999, waste_pct_bp: 1500 }
              as: Estimator
          trigger:
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "DETAILED", takeoff_id: "${to_id}", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30 }
              as: Estimator
              captures: { bid_id: $.data.id }
          assert:
            - "first line response line_total_cents == 6897   # round_half_up(3 x 1999 x 1.15) = round_half_up(6896.55)"
            - "Takeoff.${to_id}.materials_subtotal_cents == 13794   # per-line rounding then sum (sum-then-round would be 13793)"
            - "Bid.${bid_id}.price_cents == 28768   # base 21794 (13794 + 8000); overhead 2179; margin round_half_up(23973 x 0.2)=4795; 21794+2179+4795"

      - name: change_order_price_posture_branch_with_rush_cap
        grounds:
          - calculations.change_order_price
          - calculations.capacity_posture
          - entities.ChangeOrder.fields.delta_price_cents
        distinguishing_aspect: |
          Mode (a) non-linear interaction of >= 3 inputs: the labor multiplier
          branches on shop posture state (TIGHT -> 15000bp), the rush component
          is a nested min (min(3000, 500 x |delta_days|)) that only activates
          when the deadline moves earlier, and the materials component carries
          overhead — pinned inputs (dm 100000, dh +40, dd -3, posture TIGHT,
          status SCHEDULED) yield exactly 662000 cents; any other branch
          combination yields a different number.
        test_recipe:
          setup:
            - "Shop 100h/wk x 4wk = 400 crew-hour horizon; production accepted with committed 320 -> capacity_ratio_bp exactly 8000 -> posture TIGHT"
            - "Package re-uploaded so drawing_revision 2 is CURRENT; production.applied_drawing_revision == 1"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 320 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { prod_id: $.data.production_id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
            - call: "GET /scenic/productions/${prod_id}"
              payload: {}
              as: Estimator
              captures: { prod_v: $.data.version }
          trigger:
            - call: "POST /scenic/change-orders"
              payload: { production_id: "${prod_id}", expected_production_version: "${prod_v}", new_drawing_revision: 2, delta_materials_cents: 100000, delta_labor_hours: 40, delta_load_in_days: -3 }
              as: Estimator
              captures: { co_id: $.data.id }
          assert:
            - "Shop posture at creation was TIGHT (capacity_ratio_bp == 8000), so ChangeOrder.${co_id}.priced_posture == TIGHT"
            - "ChangeOrder.${co_id}.delta_price_cents == 662000   # materials round(100000x1.10x1.00)=110000; labor 40x8000x1.5=480000; rush min(3000, 500x3)=1500bp -> round(480000x0.15)=72000"
            - "ChangeOrder.${co_id}.status == PROPOSED"

      - name: reuse_credit_tier_keyed_on_pre_discount_gross
        grounds:
          - calculations.reuse_credit
          - calculations.bid_price_detailed
          - entities.TakeoffLine.fields.applied_unit_cost_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          STOCK-sourced lines (reuse unit 2000c from grade B x 5000c) push
          gross materials to exactly 510000c; the volume tier is keyed on the
          PRE-DISCOUNT gross (>= 500000 -> 500bp), giving price 650100c —
          keying the tier on the post-discount subtotal (484500 < 500000 ->
          no discount) would give 683760c, so the assertion pins the order.
        test_recipe:
          setup:
            - "Shop standard rates; client; package; StockItem LUMBER_4X8 grade B qty 300 replacement 5000 (reuse unit 2000)"
            - "Takeoff labor_hours_est 1 with one STOCK line qty 255 (gross 255 x 2000 = 510000)"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/stock-items"
              payload: { shop_id: "${shop_id}", material_code: "LUMBER_4X8", condition_grade: "B", quantity_on_hand: 300, replacement_cost_cents: 5000 }
              as: ShopAdmin
              captures: { si_id: $.data.id }
            - call: "POST /scenic/takeoffs"
              payload: { design_package_id: "${pkg_id}", labor_hours_est: 1 }
              as: Estimator
              captures: { to_id: $.data.id, to_v: $.data.version }
            - call: "POST /scenic/takeoff-lines"
              payload: { takeoff_id: "${to_id}", expected_takeoff_version: "${to_v}", material_code: "LUMBER_4X8", quantity: 255, source: "STOCK", stock_item_id: "${si_id}" }
              as: Estimator
              captures: { line_unit: $.data.applied_unit_cost_cents }
          trigger:
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "DETAILED", takeoff_id: "${to_id}", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30 }
              as: Estimator
              captures: { bid_id: $.data.id }
          assert:
            - "line applied_unit_cost_cents == 2000   # 5000 x 4000bp (grade B)"
            - "Takeoff.${to_id}.materials_subtotal_cents == 510000"
            - "Bid.${bid_id}.price_cents == 650100   # tier on PRE-discount gross 510000 -> 5%: materials 484500; + labor 8000 = 492500; overhead 49250; margin round_half_up(541750 x 0.2)=108350; total 492500+49250+108350"
            - "StockItem.${si_id}.quantity_on_hand == 45   # 300 - 255"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (3 instances, 3 different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: bid_counter_revise_cycle_increments_round
        grounds:
          - state_machines.Bid.SUBMITTED_to_COUNTERED
          - state_machines.Bid.COUNTERED_to_SUBMITTED
          - state_machines.Bid.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Bid is cyclic (SUBMITTED -> COUNTERED -> SUBMITTED negotiation
          rounds): two full counter/revise loops drive round_no 1 -> 3 and
          price_cents 900000 -> 850000 -> 825000 before a successful accept —
          a linear pipeline could not revisit SUBMITTED.
        test_recipe:
          setup:
            - "Shop; client; package (load_in 2026-09-26); ROM bid price 900000 (area 100, A_SIMPLE, no urgency) submitted"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /scenic/bids/${bid_id}/counter"
              payload: { counter_price_cents: 700000 }
              as: ClientPM
              as_user_id: "${cl_id}"
            - call: "POST /scenic/bids/${bid_id}/revise"
              payload: { revised_price_cents: 850000 }
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/counter"
              payload: { counter_price_cents: 800000 }
              as: ClientPM
              as_user_id: "${cl_id}"
            - call: "POST /scenic/bids/${bid_id}/revise"
              payload: { revised_price_cents: 825000 }
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { prod_id: $.data.production_id }
          assert:
