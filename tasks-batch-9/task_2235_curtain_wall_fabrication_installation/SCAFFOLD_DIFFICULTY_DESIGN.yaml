      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T09:00:00Z'
        as: CWProjectManager
      - call: POST /installation-zones/${z1}/hang-panels
        payload:
          hoist_reservation_id: ${res1}
        as: FieldSuperintendent
      - call: POST /installation-zones/${z1}/crew-days
        payload:
          work_date: '2026-08-10'
          crew_size: 4
          shift_hours: 9.0
          panels_installed: 10
        as: FieldSuperintendent
        as_user_id: u-super-1
        captures:
          cd1: $.data.id
      - call: POST /installation-zones/${z1}/crew-days
        payload:
          work_date: '2026-08-11'
          crew_size: 4
          shift_hours: 8.0
          panels_installed: 13
        as: FieldSuperintendent
        as_user_id: u-super-1
        captures:
          cd2: $.data.id
      - call: POST /installation-zones/${z1}/crew-days
        payload:
          work_date: '2026-08-12'
          crew_size: 4
          shift_hours: 8.0
          panels_installed: 13
        as: FieldSuperintendent
        as_user_id: u-super-1
        captures:
          cd3: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-13T09:00:00Z'
        as: CWProjectManager
      - call: POST /installation-zones/${z1}/field-tests
        payload:
          test_kind: WATER_AAMA_501_2
          scheduled_for: '2026-08-13T08:00:00Z'
        as: QCInspector
        captures:
          ft_w1: $.data.id
      - call: POST /field-tests/${ft_w1}/record-result
        payload:
          water_penetration_observed: false
        as: QCInspector
        as_user_id: u-qc-2
      - call: POST /installation-zones/${z1}/field-tests
        payload:
          test_kind: AIR_INFILTRATION
          scheduled_for: '2026-08-13T10:00:00Z'
        as: QCInspector
        captures:
          ft_a1: $.data.id
      - call: POST /field-tests/${ft_a1}/record-result
        payload:
          measured_air_leakage_cfm: 0.04
        as: QCInspector
        as_user_id: u-qc-2
      - call: POST /installation-zones/${z1}/certify-weather-tight
        payload: {}
        as: CWProjectManager
      trigger:
      - call: POST /installation-zones/${z1}/crew-days/${cd1}/void
        payload:
          void_reason: day charged to the wrong zone by the field office
        as: FieldSuperintendent
      assert:
      - before the void InstallationZone.${z1}.consumed_crew_hours == 100.0, remaining_crew_hours == 220.0, final_labor_cost_cents
        == 1149540
      - CrewDayLog.${cd1}.status == VOIDED with day_index null after the trigger
      - InstallationZone.${z1}.consumed_crew_hours == 64.0 and remaining_crew_hours == 256.0, so budget_crew_hours == consumed
        + remaining still holds at 320.0
      - CrewDayLog.${cd2}.day_index == 1 and CrewDayLog.${cd3}.day_index == 2 - the survivors are re-packed from 1, not
        left at 2 and 3
      - InstallationZone.${z1}.final_labor_cost_cents == 721280 == 360640 + 360640, recomputed because the zone is WEATHER_TIGHT
      - 'the per-day values are untouched: CrewDayLog.${cd2}.day_cost_cents == 360640 with straight_person_hours 32.0 and
        overtime_person_hours 0.0'
      - InstallationZone.${z1}.provisional_labor_cost_cents is still 940800 - the void never re-runs the forward-looking
        variant
      - InstallationZone.${z1}.certified_line_cents == 58266376 and FacadePackage.${pkg}.earned_value_certified_cents ==
        55353057 are unchanged - labour is not billing
      - a second void of ${cd1} returns ERR_TERMINAL_STATE with HTTP 409 and leaves every ledger value as it was
      - InstallationZone.${z1}.weather_status == WEATHER_TIGHT and weather_tight_cycle_count == 1 across the void
