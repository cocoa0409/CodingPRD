  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: AnalysisRun.lock gated on
  # Application states; DisparityFinding.substantiate gated on
  # MatchedPairReview state. Different entity pairs.
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_lock_requires_all_applications_validated
        grounds:
          - state_machines.AnalysisRun.DRAFT_to_DATA_LOCKED
          - entities.AnalysisRun.fields.snapshot_application_count
          - errors[ERR_APPLICATIONS_NOT_VALIDATED]
        distinguishing_aspect: |
          Entity pair AnalysisRun x Application: the DRAFT -> DATA_LOCKED
          transition is gated on EVERY in-scope Application being VALIDATED;
          one RECEIVED row in scope rejects the lock with
          ERR_APPLICATIONS_NOT_VALIDATED, and validating it makes the same
          lock call succeed with snapshot_application_count == 2.
        test_recipe:
          setup:
            - "Run R (M1, CONVENTIONAL, RACE, Q1) DRAFT; in-scope applications: a1 VALIDATED, a2 still RECEIVED"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { a1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: DENIED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 640, dti_pct: 44.0, application_date: "2026-02-01", decision_date: "2026-02-10" }, as: LendingDataOps, captures: { a2: $.data.id } }
            - { call: "POST /fair-lending/applications/${a1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /fair-lending/applications/${a2}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst, captures: { r_status: $.data.status, r_count: $.data.snapshot_application_count } }
          assert:
            - "first lock -> 409 ERR_APPLICATIONS_NOT_VALIDATED (a2 still RECEIVED); run stays DRAFT"
            - "after validating a2: lock -> DATA_LOCKED and snapshot_application_count == 2"

      - name: substantiation_requires_confirmed_matched_pair
        grounds:
          - state_machines.DisparityFinding.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.MatchedPairReview.INITIAL_REVIEWED_to_CONFIRMED
          - errors[ERR_NO_CONFIRMED_MATCHED_PAIR]
        distinguishing_aspect: |
          Entity pair DisparityFinding x MatchedPairReview: substantiating a
          DENIAL_DISPARITY finding is rejected with ERR_NO_CONFIRMED_MATCHED_PAIR
          while its only matched-pair review sits in INITIAL_REVIEWED; once
          that review reaches CONFIRMED the identical substantiate call
          succeeds. (PRICING_DISPARITY findings carry no such gate.)
        test_recipe:
          setup:
            - "Run R COMPUTED over 2 VALIDATED apps (CONTROL ORIGINATED credit 700; PROTECTED_1 DENIED credit 720, officer O1)"
            - "Manual finding F kind=DENIAL_DISPARITY UNDER_REVIEW; matched-pair MP (target denied protected, control originated) in INITIAL_REVIEWED"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
