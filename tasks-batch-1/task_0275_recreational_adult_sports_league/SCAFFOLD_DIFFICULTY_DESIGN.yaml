  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_minus_refund_zero_after_full_withdrawal
        grounds:
          - calculations.team_withdraw_refund
          - entities.Team.fields.fee_charged_cents
          - entities.Team.fields.refund_issued_cents
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: >
          Conserved quantity = net cash held for a team = fee_charged_cents - refund_issued_cents.
          pay-fee (forward) then full-refund withdrawal (compensating) leaves the invariant at 0:
          fee_charged_cents (8000) - refund_issued_cents (8000) == 0. Cash conservation, distinct
          from the team-slot count invariant.
        test_recipe:
          setup:
            - "A CONFIRMED team that paid 8000 cents, withdrawn while clock <= refund_full_cutoff_at."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "INV Season", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-30T00:00:00Z" }
              as: LeagueAdmin
              captures: { s_id: $.data.id, s_v0: $.data.version }
            - call: "POST /seasons/${s_id}/divisions"
              payload: { name: "INV Div", skill_tier: "REC", min_roster_size: 1, max_roster_size: 8, team_capacity: 4, registration_fee_cents: 8000 }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Cap INV", email: "capinv@x.com" }
              as: LeagueAdmin
              captures: { cap_id: $.data.id }
