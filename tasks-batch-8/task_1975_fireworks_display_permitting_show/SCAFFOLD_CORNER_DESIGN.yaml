  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role / X-User-ID -> 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pyro/displays/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED; http 401 (auth beats even existence)"

      - name: role_checked_before_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]"]
        distinguishing_aspect: "A FireMarshal calling an Operator-only action on a nonexistent id gets ERR_FORBIDDEN_ROLE (403), proving role (p2) precedes existence (p4)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pyro/displays/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/ready", payload: {}, as: FireMarshal, as_user_id: "fm_9", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_ROLE; http 403 (not 404)"

      - name: cross_operator_ownership_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Operator B attempting to cancel Operator A's event -> ERR_FORBIDDEN_OWNERSHIP 403."
        test_recipe:
          setup: ["operators A and B; A owns a DRAFT event"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro A", atf_license_number: "ATF-A", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { opa: $.data.id } }
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro B", atf_license_number: "ATF-B", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { opb: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-1", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${opa}", captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /pyro/displays/${ev}/cancel", payload: { reason: "not mine" }, as: Operator, as_user_id: "${opb}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_OWNERSHIP; http 403; event stays DRAFT"

      - name: movement_zero_quantity_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "quantity == 0 (and negatives) are schema-level rejections (priority 3), evaluated before existence of the referenced event."
        test_recipe:
          setup: ["operator; magazine; batch of 50"]
          setup_api_calls:
