        grounds:
          - state_machines.PunchListItem.OPEN_to_REMEDIATED
          - state_machines.PunchListItem.REMEDIATED_to_VERIFIED_CLOSED
          - state_machines.PipItem.WORK_COMPLETE_to_PUNCH_FAIL
          - state_machines.PipItem.PUNCH_FAIL_to_WORK_COMPLETE
          - endpoints["POST /pip/punch-list-items/{id}/verify"]
        distinguishing_aspect: "The defect's own three-hop walk drags two other rows with it: raising a MAJOR defect knocks the item WORK_COMPLETE -> PUNCH_FAIL and the plan READY_FOR_COMPLETION_INSPECTION -> IN_EXECUTION, and closing it restores both."
