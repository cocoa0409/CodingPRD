        distinguishing_aspect: "Periodic revision is clock-driven: approved 2026-01-10T00:00:00Z pins next_revision_due_at 2026-07-09T00:00:00Z; at 2026-07-08T23:59:59Z the plan is still APPROVED and one second later the same clock-set flips it to REVISION_DUE."
