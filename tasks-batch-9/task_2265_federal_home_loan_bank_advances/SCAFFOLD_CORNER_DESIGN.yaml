  # =========================================================================
  # SECTION 4 — VALIDATIONS
  # =========================================================================
  - section: validations
    instances:
      - name: securities_under_blanket_lien_rejected
        claim_type: violation_to_error
        grounds: ["validations.securities-require-delivery", "errors[ERR_SECURITIES_REQUIRE_DELIVERY]"]
        distinguishing_aspect: "The BASE_FACTOR_BPS table has no BLANKET column for AGENCY_MBS or TREASURY, so an eligibility review of a security under a blanket lien must be refused rather than defaulting to some other column."
        test_recipe:
          setup: ["Harbor Savings tier 1 with a BLANKET_LIEN pledge and one submitted AGENCY_MBS position of market value 10,000,000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "AGENCY_MBS", market_value_cents: 10000000, appraisal_date: "2026-08-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_mbs: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_mbs}/review-eligibility"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_SECURITIES_REQUIRE_DELIVERY\""
            - "the asset stays UNDER_REVIEW with discount_factor_bps 0, lendable_value_cents 0 and ineligibility_reason \"NONE\""
            - "after the member re-executes the pledge as SPECIFIC_LISTING the identical call succeeds with factor 9000 and lendable 9,000,000"

      - name: force_ineligible_records_reason_instead_of_returning_an_error
        claim_type: satisfaction_to_pass
        grounds: ["state_machines.CollateralAsset UNDER_REVIEW -> INELIGIBLE (force_ineligible = true)", "validations.ltv-within-max (condition includes 'and force_ineligible is not true')"]
        distinguishing_aspect: "The force_ineligible flag converts a 409 into a recorded outcome: the same 9800-bps-LTV asset that is rejected without the flag becomes an INELIGIBLE row with ineligibility_reason LTV_EXCEEDS_MAX when the flag is set."
        test_recipe:
          setup: ["Harbor Savings tier 1 with a BLANKET_LIEN pledge and one submitted SF_MORTGAGE at ltv 9800 (upb 20,000,000, market value 21,000,000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 9800, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_hot: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_hot}/review-eligibility"
            payload: { force_ineligible: true }
            as: CreditOfficer
          assert:
            - "HTTP 200 (not 409) with data.status == \"INELIGIBLE\" and data.ineligibility_reason == \"LTV_EXCEEDS_MAX\""
            - "data.discount_factor_bps == 0 and data.lendable_value_cents == 0"
            - "MemberBank.lendable_collateral_value_cents == 0 and borrowing_capacity_cents == 0"
            - "the same call WITHOUT force_ineligible returns HTTP 409 ERR_LTV_EXCEEDS_MAX and leaves the asset UNDER_REVIEW with ineligibility_reason \"NONE\""

