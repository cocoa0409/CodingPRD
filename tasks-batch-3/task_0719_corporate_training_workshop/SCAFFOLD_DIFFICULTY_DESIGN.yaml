          assert:
            - "Before withdraw: seats_reserved + seats_confirmed == 1 (0 + 1)"
            - "After withdraw+promotion: seats_reserved + seats_confirmed == 1 (1 + 0) — occupancy conserved"
            - "Cohort.seats_waitlisted == 0 after promotion; Registration ${regO2}.status == ENROLLED"
