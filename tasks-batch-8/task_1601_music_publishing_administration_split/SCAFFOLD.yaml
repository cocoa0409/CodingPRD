    input: [work_id]
    output: StatementLine
    side_effects: ["work_id set; match_status = MANUAL_MATCHED; ERR_WORK_NOT_REGISTERED unless work.registration_status == REGISTERED; ERR_INVALID_STATE_TRANSITION unless line UNMATCHED and statement in {RECEIVED, MATCHING_REVIEW}"]

  # --- AllocationLine ---
  - method: GET
    path: "/allocation-lines"
    description: "List allocation lines; ordered by created_at ASC. Rows created in one allocate/finalize pass receive strictly increasing created_at in this pinned creation order: per matched StatementLine in StatementLine.created_at ASC order; within a line, WRITER-pool rows first (SplitLine.created_at ASC), then PUBLISHER-pool rows."
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: ["statement_line_id?", "split_line_id?", "statement_id?", "writer_id?"]
    output: "AllocationLine[]"
    side_effects: []
  - method: GET
    path: "/allocation-lines/{id}"
    description: "Get an AllocationLine"
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: []
    output: AllocationLine
    side_effects: []

  # --- Advance ---
  - method: POST
    path: "/advances"
    description: "Create an Advance (DRAFT). OCC: expected_writer_version must equal Writer.version."
    roles: [PublisherAdmin]
    code: 201
    input: [writer_id, expected_writer_version, agreement_ref, amount_cents, "recoup_rate_bp?"]
    output: Advance
    side_effects: ["increments Writer.version by 1"]
  - method: GET
    path: "/advances"
    description: "List advances; ordered by created_at ASC"
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: ["writer_id?", "status?"]
    output: "Advance[]"
    side_effects: []
  - method: GET
    path: "/advances/{id}"
    description: "Get an Advance"
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: []
    output: Advance
    side_effects: []
  - method: POST
    path: "/advances/{id}/approve"
    description: "Approve (DRAFT -> APPROVED); requires writer ACTIVE"
    roles: [FinanceManager]
    code: 200
    input: []
    output: Advance
    side_effects: []
  - method: POST
    path: "/advances/{id}/pay"
    description: "Disburse (APPROVED -> PAID); sets paid_at and outstanding_cents = amount_cents"
    roles: [FinanceManager]
    code: 200
    input: []
    output: Advance
    side_effects: ["paid_at = logical clock now; outstanding_cents = amount_cents; writer.advance_outstanding_cents recomputed"]
  - method: POST
    path: "/advances/{id}/cancel"
    description: "Cancel (DRAFT|APPROVED -> CANCELLED)"
    roles: [FinanceManager]
    code: 200
    input: []
    output: Advance
    side_effects: []

  # --- DistributionRun ---
  - method: POST
    path: "/distribution-runs"
    description: "Create a DistributionRun (OPEN)"
    roles: [RoyaltyAnalyst]
    code: 201
    input: [period_label]
    output: DistributionRun
    side_effects: []
  - method: GET
    path: "/distribution-runs"
    description: "List distribution runs; ordered by created_at ASC"
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: ["status?"]
    output: "DistributionRun[]"
    side_effects: []
  - method: GET
    path: "/distribution-runs/{id}"
    description: "Get a DistributionRun"
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: []
    output: DistributionRun
    side_effects: []
  - method: POST
    path: "/distribution-runs/{id}/calculate"
    description: "Snapshot payouts (OPEN -> CALCULATED); writers with payable >= 2500 cents (inclusive) are included"
    roles: [RoyaltyAnalyst]
    code: 200
    input: []
    output: DistributionRun
    side_effects: ["distribution_run_snapshot captured; calculated_by_user_id set"]
  - method: POST
    path: "/distribution-runs/{id}/approve"
    description: "Approve (CALCULATED -> APPROVED); segregation of duties vs calculated_by_user_id; staleness check over FINALIZED statements"
    roles: [FinanceManager]
    code: 200
    input: []
    output: DistributionRun
    side_effects: ["approved_by_user_id set"]
  - method: POST
    path: "/distribution-runs/{id}/pay"
    description: "Execute payouts (APPROVED -> PAID); zeroes paid writers' payable balances; included statements -> DISTRIBUTED"
    roles: [FinanceManager]
    code: 200
    input: []
    output: DistributionRun
    side_effects: ["writer payables debited; included statements FINALIZED -> DISTRIBUTED; work total_distributed_cents recomputed"]
  - method: POST
    path: "/distribution-runs/{id}/reopen"
    description: "Revert a calculated run (CALCULATED -> OPEN); clears the snapshot"
    roles: [RoyaltyAnalyst]
    code: 200
    input: []
    output: DistributionRun
    side_effects: ["writer_payouts/included_statement_ids cleared; total_payable_cents=0; calculated_by_user_id=null"]

  # --- LicenseeAudit ---
  - method: POST
    path: "/licensee-audits"
    description: "Create a LicenseeAudit (OPEN). Period overlap per licensee uses a CLOSED INCLUSIVE interval (a shared boundary date conflicts) against audits in any status."
    roles: [Auditor]
    code: 201
    input: [licensee_id, period_start, period_end, valuation_method]
    output: LicenseeAudit
    side_effects: []
  - method: GET
    path: "/licensee-audits"
    description: "List licensee audits; ordered by created_at ASC"
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: ["licensee_id?", "status?"]
    output: "LicenseeAudit[]"
    side_effects: []
  - method: GET
    path: "/licensee-audits/{id}"
    description: "Get a LicenseeAudit"
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: []
    output: LicenseeAudit
    side_effects: []
  - method: POST
    path: "/licensee-audits/{id}/begin-fieldwork"
    description: "Begin fieldwork (OPEN -> FIELDWORK)"
    roles: [Auditor]
    code: 200
    input: []
    output: LicenseeAudit
    side_effects: []
  - method: POST
    path: "/licensee-audits/{id}/issue-findings"
    description: "Issue findings (FIELDWORK|UNDER_APPEAL -> FINDINGS_ISSUED); computes claim_amount_cents per valuation_method"
    roles: [Auditor]
    code: 200
    input: [actual_shortfall_cents, "sampled_base_cents?", "reported_base_cents?"]
    output: LicenseeAudit
    side_effects: ["claim_amount_cents computed via audit_claim_valuation"]
  - method: POST
    path: "/licensee-audits/{id}/appeal"
    description: "Record a licensee appeal (FINDINGS_ISSUED -> UNDER_APPEAL)"
    roles: [Auditor]
    code: 200
    input: [reason]
    output: LicenseeAudit
    side_effects: []
  - method: POST
    path: "/licensee-audits/{id}/settle"
    description: "Settle (FINDINGS_ISSUED -> SETTLED)"
    roles: [FinanceManager]
    code: 200
    input: [settlement_cents]
    output: LicenseeAudit
    side_effects: ["settlement_cents recorded"]
  - method: POST
    path: "/licensee-audits/{id}/close"
    description: "Close without findings (OPEN|FIELDWORK -> CLOSED)"
    roles: [Auditor]
    code: 200
    input: []
    output: LicenseeAudit
    side_effects: []

  # --- TerminationClaim ---
  - method: POST
    path: "/termination-claims"
    description: "Create a TerminationClaim (TRACKING); window dates projected from the work's grant_date"
    roles: [CopyrightSpecialist]
    code: 201
    input: [work_id, statute_basis, intended_effective_date]
    output: TerminationClaim
    side_effects: ["window_open_date/window_close_date/notice_earliest_date/notice_latest_date computed"]
  - method: GET
    path: "/termination-claims"
    description: "List termination claims; ordered by created_at ASC; status reflects lazy clock derivation"
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: ["work_id?", "status?"]
    output: "TerminationClaim[]"
    side_effects: []
  - method: GET
    path: "/termination-claims/{id}"
    description: "Get a TerminationClaim (status reflects lazy clock derivation)"
    roles: [PublisherAdmin, CopyrightSpecialist, RoyaltyAnalyst, FinanceManager, Auditor, Writer]
    code: 200
    input: []
    output: TerminationClaim
    side_effects: []
  - method: POST
    path: "/termination-claims/{id}/file-notice"
    description: "File the termination notice (NOTICE_WINDOW_OPEN -> NOTICE_FILED); notice window deadline enforced"
    roles: [CopyrightSpecialist]
    code: 200
    input: [notice_ref]
    output: TerminationClaim
    side_effects: ["notice_filed_at/notice_ref set"]
  - method: POST
    path: "/termination-claims/{id}/make-effective"
    description: "Effectuate termination (NOTICE_FILED -> EFFECTIVE) once now >= intended_effective_date; cascades rights termination"
    roles: [CopyrightSpecialist]
    code: 200
    input: []
    output: TerminationClaim
    side_effects: ["work.copyright_status -> TERMINATED; non-terminal SplitSets CANCELLED; their PENDING SplitLines REJECTED"]
  - method: POST
    path: "/termination-claims/{id}/reject"
    description: "Reject a filed claim (NOTICE_FILED -> REJECTED)"
    roles: [CopyrightSpecialist]
    code: 200
    input: [reason]
    output: TerminationClaim
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted on this endpoint; or Writer reading another writer's earnings-summary" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body reference does not exist (incl. polymorphic source_id resolution)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, bad enum value, bad type/range, duplicate line_number, participant fields inconsistent with participant_type" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "effective_from >= effective_to, or period_start > period_end" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger not valid from the entity's current state" }
  - { id: ERR_NO_CONFIRMED_SPLIT_SET, http: 409, condition: "Operation requires a CONFIRMED SplitSet on the work (registration submit; statement allocate with a matched work lacking one)" }
  - { id: ERR_AMENDED_STATEMENT_NOT_FINAL, http: 409, condition: "amends_statement_id references a statement not in FINALIZED" }
  - { id: ERR_STATEMENT_ALREADY_SUPERSEDED, http: 409, condition: "amends_statement_id references a SUPERSEDED statement (checked before the generic not-FINAL error)" }
  - { id: ERR_WORK_RIGHTS_TERMINATED, http: 409, condition: "Operation targets a work with copyright_status == TERMINATED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Distribution-run approver is the same X-User-ID that calculated the run" }
  - { id: ERR_TERMINATION_WINDOW_NOT_OPEN, http: 409, condition: "file-notice while derived status is still TRACKING (now < window_open_date)" }
  - { id: ERR_NOTICE_DEADLINE_PASSED, http: 409, condition: "file-notice with now > notice_latest_date" }
  - { id: ERR_EFFECTIVE_DATE_OUTSIDE_WINDOW, http: 409, condition: "intended_effective_date not within (window_open_date, window_close_date] at claim create" }
  - { id: ERR_SUB_PUBLISHER_NOT_ACTIVE, http: 409, condition: "Agreement activate while referenced SubPublisher is SUSPENDED" }
  - { id: ERR_WRITER_NOT_ACTIVE, http: 409, condition: "Advance approve while Writer is SUSPENDED" }
  - { id: ERR_WORK_NOT_REGISTERED, http: 409, condition: "Manual statement-line match to a work whose registration_status != REGISTERED" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "Agreement activation would overlap (half-open) an ACTIVE agreement on territory AND income type" }
  - { id: ERR_AUDIT_PERIOD_OVERLAP, http: 409, condition: "Audit period (closed inclusive) overlaps another audit of the same licensee in any status" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "Statement period (closed inclusive) overlaps another statement with same source/income/territory not in {REJECTED, SUPERSEDED} (amends target excluded)" }
  - { id: ERR_SPLIT_SUM_INVALID, http: 422, condition: "Writer pool or publisher pool does not sum to exactly 10000 bp" }
  - { id: ERR_ZERO_SHARE_LINE, http: 422, condition: "A split line has share_bp < 1" }
  - { id: ERR_DUPLICATE_SPLIT_PARTICIPANT, http: 422, condition: "Same writer_id or same publisher_name appears twice in one SplitSet" }
  - { id: ERR_DUPLICATE_SOCIETY_REGISTRATION, http: 409, condition: "A registration for (work_id, society_id) already exists with status IN {DRAFT, SUBMITTED, ACKNOWLEDGED, REGISTERED}" }
  - { id: ERR_AUDIT_SAMPLE_BASE_INVALID, http: 422, condition: "EXTRAPOLATED findings without sampled_base_cents >= 1 or with reported_base_cents < sampled_base_cents" }
  - { id: ERR_GROSS_MISMATCH, http: 409, condition: "Statement allocate when sum(line gross_cents) != gross_amount_cents" }
  - { id: ERR_EMPTY_STATEMENT, http: 409, condition: "match/allocate on a statement with zero lines" }
  - { id: ERR_NO_MATCHED_LINES, http: 409, condition: "allocate when every line is UNMATCHED" }
  - { id: ERR_STALE_DISTRIBUTION_RUN, http: 409, condition: "approve when a FINALIZED statement exists outside included_statement_ids" }
  - { id: ERR_SPLIT_LINE_OWNERSHIP_MISMATCH, http: 403, condition: "Writer confirming/rejecting a line that is not their own WRITER line, or PublisherAdmin touching a WRITER line, or Writer touching a PUBLISHER line" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_work_version != Work.version (POST /split-sets) or expected_writer_version != Writer.version (POST /advances)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PublisherAdmin
    description: "Publishing-house administrator; owns catalog, splits, sub-publishing, licensees, societies, and the logical clock"
    identity: opaque
    exclusive_operations: ["create writers/works/societies/sub-publishers/licensees", "suspend/reactivate writers and sub-publishers", "create/submit/revise split sets", "confirm/reject PUBLISHER split lines", "create/activate/terminate sub-publishing agreements", "create advances", "set logical clock"]
    shared_operations: ["read any resource"]
  - name: CopyrightSpecialist
    description: "Copyright and society operations specialist"
    identity: opaque
    exclusive_operations: ["file/register copyright on works", "create and advance society registrations", "create/file/effectuate/reject termination claims"]
    shared_operations: ["read any resource"]
  - name: RoyaltyAnalyst
    description: "Royalty processing operator; ingests and finalizes statements, calculates distribution runs"
    identity: opaque
    exclusive_operations: ["create/match/allocate/finalize/reject royalty statements", "manual statement-line match", "create distribution runs", "calculate/reopen distribution runs"]
    shared_operations: ["read any resource"]
  - name: FinanceManager
    description: "Finance approver; segregated from statement processing and run calculation"
    identity: opaque
    exclusive_operations: ["approve/pay/cancel advances", "approve/pay distribution runs", "settle licensee audits"]
    shared_operations: ["read any resource"]
  - name: Auditor
    description: "Royalty auditor for licensee reporting examinations"
    identity: opaque
    exclusive_operations: ["create/begin/appeal/close licensee audits", "issue findings"]
    shared_operations: ["read any resource"]
  - name: Writer
    description: "Songwriter; confirms or rejects own split lines and reads own earnings"
    identity: "entity_backed:Writer"
    exclusive_operations: ["confirm/reject own WRITER split lines (X-User-ID == line.writer_id)"]
    shared_operations: ["read works/split sets/split lines/own earnings-summary (own id only)"]
