  # --- CertAudit (sub-resource of Sugarbush) ---
  - method: POST
    path: "/sugarhouse/sugarbushes/{id}/cert-audits"
    description: "Schedule an audit; 14-day minimum spacing per bush"
    roles: [SugarhouseManager, CertInspector]
    code: 201
    input: [audit_type, scheduled_for]
    output: CertAudit
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/sugarhouse/sugarbushes/{id}/cert-audits"
    description: "List audits of a sugarbush"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["audit_type?", "limit?", "offset?"]
    output: CertAudit[]
    side_effects: []
  - method: POST
    path: "/sugarhouse/cert-audits/{id}/record-result"
    description: "SCHEDULED -> RECORDED; ORGANIC result recomputes bush organic_certified"
    roles: [CertInspector]
    code: 200
    input: [result]
    output: CertAudit
    side_effects: ["status -> RECORDED", "organic_certified recomputed when audit_type ORGANIC", "increments CertAudit.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on endpoint, or entity-backed X-User-ID mismatch with collected_by/boiled_by/evaluator_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/unknown/malformed field, enum or range violation, conditional requiredness violated (per_tap_cents iff PER_TAP; share_pct iff SHARE_OF_SYRUP), term_end <= term_start, closes_at <= opens_at" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lease_version / expected_season_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_SEASON_NOT_OPEN, http: 409, condition: "Operation requires Season OPEN but season is PLANNED, CLOSED or RECONCILED" }
  - { id: ERR_SEASON_SUSPENDED, http: 409, condition: "Collection/window/crew operations blocked while Season is SUSPENDED" }
  - { id: ERR_SEASON_ALREADY_ACTIVE, http: 409, condition: "Opening a season while another season is OPEN or SUSPENDED" }
  - { id: ERR_OUTSIDE_PRODUCTION_WINDOW, http: 422, condition: "Logical clock outside the allowed season/window dates (season open/resume, crew activate, window open, lease activate term check)" }
  - { id: ERR_SUGARBUSH_NOT_LIVE, http: 409, condition: "Sap collection requires Sugarbush.status == LIVE" }
  - { id: ERR_TAP_LINES_NOT_READY, http: 409, condition: "go-live requires >=1 non-PULLED line and every non-PULLED line ACTIVE" }
  - { id: ERR_TAP_CAPACITY_EXCEEDED, http: 422, condition: "Sum of tap_count over non-PULLED lines plus new line exceeds Sugarbush.tap_capacity" }
  - { id: ERR_VACUUM_STILL_LOW, http: 409, condition: "Repair rejected: latest reading below vacuum_target_inhg - 0.5" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New window's half-open [opens_at, closes_at) intersects an existing FORECAST/OPEN window of the same season" }
  - { id: ERR_NO_FREEZE_THAW, http: 422, condition: "forecast_min_f > 32.0 or forecast_max_f < 38.0 — no freeze-thaw cycle" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "SapRun requires its WeatherWindow in status OPEN" }
  - { id: ERR_COLLECTED_OUTSIDE_WINDOW, http: 422, condition: "Logical clock at collection is at/after the window's closes_at" }
  - { id: ERR_CREW_NOT_ACTIVE, http: 409, condition: "collected_by/boiled_by/evaluator_id is not an ACTIVE CrewMember, or evaluator lacks crew_role GRADER" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Flavor evaluator equals the lot's batch.boiled_by" }
  - { id: ERR_GRADER_NOT_CERTIFIED, http: 409, condition: "Lot from an organic_certified bush requires evaluator with cert_organic_handler true" }
  - { id: ERR_BRIX_BELOW_LEGAL, http: 422, condition: "finished_brix < 66.0 — below the legal maple syrup density minimum" }
  - { id: ERR_EVAPORATOR_BUSY, http: 409, condition: "Another batch of the same season is already BOILING (single evaporator)" }
  - { id: ERR_BATCH_EMPTY, http: 409, condition: "start-boil with sap_gallons_in == 0" }
  - { id: ERR_DRAW_EXCEEDS_REMAINING, http: 422, condition: "gallons_drawn > SapRun.gallons_remaining (or <= 0)" }
  - { id: ERR_NO_SAP_AVAILABLE, http: 409, condition: "auto-fill candidate set empty (no CONFIRMED runs with gallons_remaining > 0)" }
  - { id: ERR_RUN_HAS_DRAWS, http: 409, condition: "Voiding a CONFIRMED run with gallons_remaining != gallons_collected" }
  - { id: ERR_LOT_NOT_GRADABLE, http: 409, condition: "grade requested with no FlavorEvaluation on the lot, or lot in a terminal state" }
  - { id: ERR_LOT_NOT_GRADED, http: 409, condition: "Packaging requires SyrupLot.status == GRADED" }
  - { id: ERR_GRADE_NOT_RETAIL_ELIGIBLE, http: 422, condition: "RETAIL_QUART/RETAIL_PINT packaging requires grade GOLDEN or AMBER" }
  - { id: ERR_INSUFFICIENT_UNPACKAGED, http: 422, condition: "units_planned * CONTAINER_GALLONS exceeds SyrupLot.unpackaged_gallons at create or fill" }
  - { id: ERR_AUDIT_TOO_CLOSE, http: 422, condition: "Another audit on the same bush is scheduled less than 14 days away" }
  - { id: ERR_AUDIT_NOT_DUE, http: 422, condition: "record-result before scheduled_for date" }
  - { id: ERR_ORGANIC_AUDIT_REQUIRED, http: 409, condition: "certified_organic_required lease lacks a latest RECORDED ORGANIC audit with result PASS" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "Sugarbush has active_lease_id set but that lease is not ACTIVE" }
  - { id: ERR_LEASE_CONFLICT, http: 409, condition: "Sugarbush already has a lease in DRAFT, PENDING_AUDIT or ACTIVE" }
  - { id: ERR_SEASON_HAS_OPEN_BATCHES, http: 409, condition: "Season close blocked by FILLING or BOILING batches" }
  - { id: ERR_RECONCILE_BLOCKED, http: 409, condition: "Reconcile blocked by UNGRADED/HELD syrup lots or PLANNED packaging runs" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SugarhouseManager
    description: "Sugarhouse operator/admin; runs the whole operation"
    identity: opaque
    exclusive_operations:
      - "Season lifecycle (create/open/suspend/resume/close/reconcile/run-sweep) and logical clock"
      - "Sugarbush lifecycle, tap-line lifecycle, lease lifecycle"
      - "Weather window declaration and opening; crew hire/activate/release"
      - "Packaging plan/fill/cancel; syrup lot hold/condemn; sap-run void"
    shared_operations:
      - "Sap-run create/confirm (as manager override)"
      - "Batch operations and flavor evaluations (acts as any operator; segregation still enforced by evaluator_id != boiled_by)"
      - "Cert-audit scheduling"
      - "All GET endpoints"
  - name: FieldCrew
    description: "Seasonal woods crew; collects sap and monitors vacuum"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /sugarhouse/sap-runs with collected_by == X-User-ID (non-manager path)"
    shared_operations:
      - "POST /sugarhouse/tap-lines/{id}/vacuum-readings"
      - "POST /sugarhouse/sap-runs/{id}/confirm"
      - "All GET endpoints"
  - name: SugarMaker
    description: "Boiler/grader; runs the evaporator and grades syrup"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "Batch create/intakes/auto-fill/start-boil/finish/cancel with boiled_by == X-User-ID (non-manager path)"
      - "POST /sugarhouse/syrup-lots/{id}/evaluations with evaluator_id == X-User-ID (non-manager path)"
    shared_operations:
      - "POST /sugarhouse/syrup-lots/{id}/grade"
      - "All GET endpoints"
  - name: CertInspector
    description: "External organic/woods auditor"
    identity: opaque
    exclusive_operations:
      - "POST /sugarhouse/cert-audits/{id}/record-result"
    shared_operations:
      - "POST /sugarhouse/sugarbushes/{id}/cert-audits"
      - "All GET endpoints"
