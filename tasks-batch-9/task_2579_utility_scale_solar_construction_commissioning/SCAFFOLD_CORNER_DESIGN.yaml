              as: UtilityCoordinator
              captures: { r5: $.data.id }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: CommissioningEngineer
              captures: { r6: $.data.id }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: OwnerEngineer
              captures: { r7: $.data.id }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: LaborComplianceOfficer
              captures: { r8: $.data.id, v8: $.data.version }
          assert:
            - "all eight reads return 200 with ${r1} == ${r2} == ${r3} == ${r4} == ${r5} == ${r6} == ${r7} == ${r8} == ${proj}"
            - "${v1} == ${pv} and ${v8} == ${pv} — reads never advance the version"

      - name: same_user_cannot_both_submit_and_decide_the_same_step
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=9]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
          - entities.PunchListItem.fields.submitted_by_user_id
          - entities.LaborEntry.fields.posted_by_user_id
        distinguishing_aspect: "The check is on X-User-ID, not on X-User-Role: a correctly-roled OwnerEngineer is still refused when their user id equals the punch item's submitted_by_user_id, and a correctly-roled LaborComplianceOfficer is refused when they posted any POSTED entry of the week — a different user id of the SAME role succeeds in both cases."
        test_recipe:
          setup:
            - "One project with one OPEN punch item whose closure was submitted by user u-dual-1, and one OPEN payroll week holding one entry posted by user u-dual-2"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Duties Bench", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              as_user_id: "u-pm-9"
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/punch-list-items"
              payload: { title: "Tracker bearing loose at row 2", category: "MECHANICAL", severity: "MAJOR", estimated_cost_cents: 80000 }
              as: OwnerEngineer
              as_user_id: "u-oe-9"
              captures: { pi: $.data.id }
            - call: "POST /solar/punch-list-items/${pi}/closure-submissions"
              payload: { closure_evidence_ref: "TORQ-5501" }
              as: InstallationForeman
              as_user_id: "u-dual-1"
              captures: { pi_st: $.data.status, sub_by: $.data.submitted_by_user_id }
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: LaborComplianceOfficer
              as_user_id: "u-dual-2"
              captures: { wk: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-1101", classification: "LABORER", is_apprentice: false, hours: 12.00, paid_rate_cents: 4500, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
              as_user_id: "u-dual-2"
              captures: { le_st: $.data.status, post_by: $.data.posted_by_user_id }
          trigger:
            - call: "POST /solar/punch-list-items/${pi}/closure-decisions"
              payload: { decision: "APPROVE", note: "self-approving my own closure" }
              as: OwnerEngineer
              as_user_id: "u-dual-1"
              captures: { e1: $.data.error_id }
            - call: "POST /solar/punch-list-items/${pi}/closure-decisions"
              payload: { decision: "APPROVE", note: "independently verified" }
              as: OwnerEngineer
              as_user_id: "u-oe-9"
              captures: { pi_st2: $.data.status, dec_by: $.data.decided_by_user_id }
            - call: "POST /solar/payroll-weeks/${wk}/certification"
              payload: { note: "self-certifying my own postings" }
              as: LaborComplianceOfficer
              as_user_id: "u-dual-2"
              captures: { e2: $.data.error_id }
            - call: "POST /solar/payroll-weeks/${wk}/certification"
              payload: { note: "reviewed by a second officer" }
              as: LaborComplianceOfficer
              as_user_id: "u-lc-9"
              captures: { wk_st: $.data.status }
          assert:
            - "${pi_st} == CLOSURE_SUBMITTED with ${sub_by} == u-dual-1, and ${le_st} == POSTED with ${post_by} == u-dual-2"
            - "${e1} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — the role is correct (OwnerEngineer) but the user id matches submitted_by_user_id, and PunchListItem.${pi}.status stays CLOSURE_SUBMITTED"
            - "the same call from u-oe-9 returns 200 with ${pi_st2} == CLOSED and ${dec_by} == u-oe-9"
            - "${e2} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — u-dual-2 posted a POSTED entry of that week, and PayrollWeek.${wk}.status stays OPEN"
            - "the same certification from u-lc-9 returns 200 with ${wk_st} == CERTIFIED"

      - name: requests_without_a_recognised_identity_are_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "Priority 1 covers three distinct failures with one code: no X-User-Role header at all, no X-User-ID header, and a syntactically fine role string that is not one of the eight declared roles — the last is 401, NOT 403, because an unrecognised role never becomes a subject to authorise."
        test_recipe:
          setup:
            - "One project, so the target route resolves to a real row"
            - "`as: NONE` below means the X-User-Role header is omitted entirely; `as: SiteSafetyOfficer` means a header carrying a role that §1.7 does not declare"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Auth Bench", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              as_user_id: "u-pm-8"
              captures: { proj: $.data.id }
          trigger:
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: NONE
              captures: { e1: $.data.error_id }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: SiteSafetyOfficer
              captures: { e2: $.data.error_id }
            - call: "POST /solar/projects/${proj}/change-orders"
              payload: { amount_cents: 100, reason: "unauthenticated attempt" }
              as: NONE
              captures: { e3: $.data.error_id }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: EpcProjectManager
              as_user_id: "u-pm-8"
              captures: { ok_id: $.data.id }
          assert:
            - "${e1} == ERR_UNAUTHENTICATED with HTTP 401 — a shared read is still gated on identity"
            - "${e2} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_FORBIDDEN_ROLE 403 — SiteSafetyOfficer is not a declared role, so priority 1 fires before priority 2"
            - "${e3} == ERR_UNAUTHENTICATED with HTTP 401 and Project.${proj}.approved_change_order_cents is still 0"
            - "a request omitting only X-User-ID (role header present and valid) also returns ERR_UNAUTHENTICATED 401"
            - "the control read with both headers returns 200 with ${ok_id} == ${proj}"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_parent_versions_are_rejected_on_both_occ_write_endpoints
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[delivery-create-stale-yard-zone]
          - concurrency_rules[commissioning-test-create-stale-project]
          - validations[priority=7]
          - errors[ERR_STALE_YARD_ZONE_VERSION]
          - errors[ERR_STALE_PROJECT_VERSION]
        distinguishing_aspect: "Both declared OCC rules are exercised on their own write_endpoint with their own occ_field: a version that was current one call ago is already stale, each stale write returns its rule's own 412 code (never a shared one), the refused write leaves the parent's version untouched, and re-reading the parent lets the identical payload through."
        test_recipe:
          setup:
            - "One project with one yard zone of capacity 200"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Concurrency Mesa", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 200 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, zv0: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 60, pallets: 60, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${zv0}" }
              as: ProcurementCoordinator
              captures: { d1: $.data.id }
            - call: "POST /solar/projects/${proj}/change-orders"
              payload: { amount_cents: 100000, reason: "extra combiner pad" }
              as: EpcProjectManager
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "TRACKER", unit_qty: 40, pallets: 40, planned_arrival_at: "2026-08-04T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${zv0}" }
              as: ProcurementCoordinator
              captures: { e_zone: $.data.error_id }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { zv1: $.data.version, res1: $.data.reserved_pallets }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "TRACKER", unit_qty: 40, pallets: 40, planned_arrival_at: "2026-08-04T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${zv1}" }
              as: ProcurementCoordinator
              captures: { d2: $.data.id, d2_st: $.data.status }
            - call: "POST /solar/commissioning-tests"
              payload: { project_id: "${proj}", test_type: "CAPACITY", scheduled_at: "2026-08-11T09:00:00Z", expected_project_version: "${pv0}" }
              as: CommissioningEngineer
              captures: { e_proj: $.data.error_id }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: CommissioningEngineer
              captures: { pv2: $.data.version }
            - call: "POST /solar/commissioning-tests"
              payload: { project_id: "${proj}", test_type: "CAPACITY", scheduled_at: "2026-08-11T09:00:00Z", expected_project_version: "${pv2}" }
              as: CommissioningEngineer
              captures: { test: $.data.id, test_st: $.data.status }
          assert:
            - "${e_zone} == ERR_STALE_YARD_ZONE_VERSION with HTTP 412 — ${zv0} was current until the first delivery reserved 60 pallets"
            - "${zv1} > ${zv0} with ${res1} == 60 — the refused write did NOT bump the zone version, so exactly one increment happened"
            - "the identical payload with ${zv1} returns 201 with ${d2_st} == RESERVED, and YardZone.${yz}.reserved_pallets becomes 100 with available_pallets 100"
            - "${e_proj} == ERR_STALE_PROJECT_VERSION with HTTP 412 — a different code from the yard-zone rule, per its own concurrency_rules entry"
            - "${pv2} > ${pv1} > ${pv0} — the change order and the second delivery each advanced Project.version, while the two refused writes advanced nothing"
            - "the identical payload with ${pv2} returns 201 with ${test_st} == SCHEDULED"

      - name: readiness_cascade_layer_stub
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - calculations.block_and_project_readiness_rollup
        excluded_because:
          difficulty_instance: transitive_cascade / string_test_failure_cascades_to_auto_rejected_mc_claim_and_suspended_test
          rationale: "A five-level chain is verified hop by hop there, with ordering sensitivity and the untouched-entity check, and its sibling instance covers the four-level pile-refusal chain."

      - name: capacity_variant_layer_stub
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.capacity_test_result.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / capacity_test_as_measured_fails_where_weather_corrected_passes
          rationale: "Both variants are run over byte-identical interval sets there and the resulting PASSED/FAILED divergence is asserted with literal values."

      - name: block_and_project_derived_counters_track_every_source_write
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.block_and_project_readiness_rollup
          - entities.Block.fields.piles_accepted_count
          - entities.Block.fields.circuits_tested_count
          - entities.Block.fields.mc_ready
          - entities.Project.fields.blocks_mc_ready_count
          - entities.Project.fields.mc_readiness
        distinguishing_aspect: "The rollup is recomputed from the source rows on every write and in both directions: the counters climb as piles and circuits are accepted, mc_readiness only flips to READY when the SECOND of two blocks becomes ready, and a later circuit failure walks blocks_mc_ready_count back down from 2 to 1 and mc_readiness back to BLOCKED — a decrement, not a monotonic latch."
