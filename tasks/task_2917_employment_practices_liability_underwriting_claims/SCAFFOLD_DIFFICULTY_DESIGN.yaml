            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${plan_id}", requested_aggregate_limit_cents: 200000000, requested_retention_cents: 5000000, third_party_coverage_requested: true, expected_applicant_version: "${app_v}" }
