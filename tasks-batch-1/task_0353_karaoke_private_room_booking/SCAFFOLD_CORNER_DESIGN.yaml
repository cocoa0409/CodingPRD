              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-25T20:00:00.000Z", slot_end_utc: "2026-08-25T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/queue"
              payload: { song_id: "${s_id}", priority: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-25T20:01:00.000Z" }
              as: FrontDesk
          trigger:
            - call: "POST /venues/${v_id}/_ops/run"
              payload: {}
              as: FrontDesk
          assert:
            - "Reservation.${res_id}.status == EXPIRED"
            - "QueueEntry.${q_id}.status == CANCELLED"

      - name: cancel_inside_cutoff_forfeits_deposit
        claim_type: Compensation
        grounds: [state_machines.Reservation.CONFIRMED_to_CANCELLED, entities.Payment.fields.kind]
        distinguishing_aspect: "Cancelling a CONFIRMED reservation INSIDE the cutoff (clock 2 hours before a slot, cutoff 24h) appends Payment{FORFEIT, 3600} and no REFUND — the inside-cutoff branch."
        test_recipe:
          setup: ["CONFIRMED reservation 2026-08-26 20:00->22:00 (deposit 3600); cutoff 24h; clock 2026-08-26 18:00 (inside cutoff)"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, deposit_pct: 0.2, cancellation_cutoff_hours: 24 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-26T10:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-26T20:00:00.000Z", slot_end_utc: "2026-08-26T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { deposit: $.data.deposit_cents }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-26T18:00:00.000Z" }
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Reservation.${res_id}.status == CANCELLED"
            - "GET /venues/${v_id}/reservations/${res_id}/payments includes one Payment with kind == FORFEIT and amount_cents == 3600"
            - "GET /venues/${v_id}/reservations/${res_id}/payments includes no Payment with kind == REFUND"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: close_settlement_totals_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Reservation.CHECKED_IN_to_CLOSED, entities.Reservation.fields.final_total_cents]
        distinguishing_aspect: "The close response immediately carries settled_room_subtotal_cents, fb_consumed_cents, fb_shortfall_cents, and final_total_cents (immediate consistency, no re-read needed)."
        test_recipe:
          setup: ["LARGE base 6000 fb_minimum 5000; reservation 2026-08-27 20:00->22:00 checked in at 20:00; one FbOrder 3000 placed; close at 22:30 (overage)"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 5000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "R1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "1" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-27T19:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-08-27T20:00:00.000Z", slot_end_utc: "2026-08-27T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { deposit: $.data.deposit_cents }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-08-27T20:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /reservations/${res_id}/fb-orders"
              payload: { description: "Drinks", unit_price_cents: 1500, quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fb_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/close"
