              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Booking.${booking_id}.amount_paid_cents == 14400"
            - "Booking.${booking_id}.settlement_status == DEPOSIT_PAID"

  # =================================================================
  # Section: consistency_model
  # =================================================================
  - section: consistency_model
    instances:
      - name: confirm_response_reflects_state_immediately
        claim_type: immediate
        grounds: [state_machines.Booking.HELD_to_CONFIRMED, entities.Booking.fields.schedule_status]
        distinguishing_aspect: "The confirm response body itself shows schedule_status == CONFIRMED and hold_expires_at == null in the same request (immediate consistency)."
        test_recipe:
          setup: ["studio, room, client; HELD booking deposit paid"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
              captures: { sched: $.data.schedule_status, hexp: $.data.hold_expires_at }
          assert:
            - "the confirm response data.schedule_status == CONFIRMED"
            - "the confirm response data.hold_expires_at == null"

  # =================================================================
  # Excluded stubs — corners already covered by §1.8
  # =================================================================
  - section: state_machines
    instances:
      - name: stub_booking_parallel_dimensions
        claim_type: parallel
        grounds: [state_machines.Booking.HELD_to_CONFIRMED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_parallel_schedule_and_settlement_dimensions
          rationale: "The independence of schedule_status and settlement_status is asserted directly by the named §1.8 instance."
      - name: stub_session_delivery_cycle
        claim_type: cyclic
        grounds: [state_machines.SessionDelivery.REVISION_REQUESTED_to_DELIVERED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / session_delivery_revision_cycle
          rationale: "The DELIVERED<->REVISION_REQUESTED loop and revision_round increment are asserted by the named §1.8 instance."
  - section: calculations
    instances:
      - name: stub_overtime_surcharge_correct_result
        claim_type: Correct Result
        grounds: [calculations.overtime_surcharge]
        excluded_because:
          difficulty_instance: combinatorial_formula / overtime_surcharge_multi_input_nonlinear_mode_a
          rationale: "overtime_cents == 4250 and its room/engineer components are asserted by the named §1.8 instance."
      - name: stub_engineering_estimate_vs_final
        claim_type: Variant Selection
        grounds: [calculations.engineering_charge]
        excluded_because:
          difficulty_instance: dual_variant_calc / engineering_estimate_vs_final_diverge_on_overtime
          rationale: "Estimate (28000) vs final (30000) divergence is asserted by the named §1.8 instance."
  - section: cross_cutting_complexity_layers
    instances:
