      - name: every_uniqueness_tuple_reports_its_own_duplicate_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_SECTION_QUOTA]
          - errors[ERR_DUPLICATE_AUDITION]
          - errors[ERR_DUPLICATE_PLACEMENT]
          - errors[ERR_DUPLICATE_TUITION_ACCOUNT]
          - errors[ERR_DUPLICATE_PARTICIPATION]
          - validations[priority 62]
        distinguishing_aspect: |
          Priority 62 declares six uniqueness tuples and each one owns a distinct error
          id, so the same 409 band must be told apart by key: (ensemble_id, instrument) for
          the quota; the NON-TERMINAL (member_id, season_id) audition - Ada's is SCORED, so
          a re-registration is refused; the non-terminal (audition_id, ensemble_id)
          placement, which is why the SAME audition may still be offered a seat in a second,
          lower-tier ensemble; (member_id, season_id) for the tuition account, which is what
          makes that second acceptance fail after the first one already opened Ada's
          account; and (event_id, member_id) for the roster row. The Placement key is
          per-ensemble while the TuitionAccount key is per-season - a naive design that
          keyed both the same way would either reject trigger[9] or accept trigger[11].
        test_recipe:
          setup:
            - "Season 2026-27 in AUDITIONS_OPEN with two ensembles: Philharmonic (tier"
            - "PHILHARMONIC) and Concert Orchestra (tier CONCERT_ORCHESTRA), each owning a"
            - "VIOLIN section min 1 / target 1 / max 2. Ada Strings' audition is SCORED with"
            - "three sheets of (22, 20, 21, 18) = 81.80, so adjudication will recommend"
            - "PHILHARMONIC and both ensembles are legal targets."
