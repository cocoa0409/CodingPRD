  - rule_id: resource_temporal_overlap
    instances:
      - name: property_measuring_period_half_open_adjacent_ok_overlap_rejected
        grounds:
          - validations[priority=80, ERR_PROPERTY_MEASURING_PERIOD_OVERLAP]
          - errors[ERR_PROPERTY_MEASURING_PERIOD_OVERLAP]
          - entities.Project.fields.measuring_period_end_date
          - entities.Property.fields.open_project_count
        distinguishing_aspect: |
          Contended resource is the Property, and the interval semantics are
          HALF-OPEN [start, end): a project whose measuring period begins exactly on
          the day the incumbent period ends is accepted, and only a period that
          strictly straddles the incumbent is rejected.
        test_recipe:
          setup:
            - "One developer and one property."
            - "Project A on that property with a 24-month measuring period starting 2026-09-01, so its half-open period is [2026-09-01, 2028-09-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Phase A", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { projA_id: $.data.id, projA_end: $.data.measuring_period_end_date }
          trigger:
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Phase B", structure_type: "SINGLE_TIER", adjusted_basis_cents: 30000000, measuring_period_months: 24, measuring_period_start_date: "2028-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { projB_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Phase C", structure_type: "SINGLE_TIER", adjusted_basis_cents: 30000000, measuring_period_months: 24, measuring_period_start_date: "2028-08-01" }
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "Project.${projA_id}.measuring_period_end_date == 2028-09-01"
            - "first trigger call HTTP status == 201 (adjacent period accepted: 2028-09-01 is the exclusive end of project A)"
            - "Project.${projB_id}.measuring_period_end_date == 2030-09-01"
            - "second trigger call HTTP status == 409"
            - "second trigger call data.error_id == ERR_PROPERTY_MEASURING_PERIOD_OVERLAP"
            - "Property.${prop_id}.open_project_count == 2"
            - "GET /projects?property_id=${prop_id} returns exactly 2 rows"

      - name: reviewer_closed_review_window_capacity_rejects_third_touching_window
        grounds:
          - validations[priority=80, ERR_REVIEWER_WINDOW_CAPACITY]
          - errors[ERR_REVIEWER_WINDOW_CAPACITY]
          - state_machines.PartApplication.DRAFT_to_SHPO_REVIEW.preconditions
          - entities.PartApplication.fields.review_window_end
        distinguishing_aspect: |
          Different contended resource (the SHPO Reviewer, not the Property) and the
          opposite interval semantics: review windows are CLOSED
          [submitted_at, review_window_end], so two windows that share only an
          endpoint DO overlap. Capacity is 2, so the third submission that touches
          both incumbents is refused — the same calendar adjacency that was legal in
          the measuring-period instance is a collision here.
        test_recipe:
          setup:
            - "Three properties, three projects (one per property, so no measuring-period contention), three Part 1 applications in DRAFT."
            - "One SHPO reviewer; SHPO_REVIEW_WINDOW_DAYS = 30 and REVIEWER_WINDOW_CAPACITY = 2."
            - "Application 1 submitted at clock 2026-09-01, giving the closed window [2026-09-01, 2026-10-01]; it stays in SHPO_REVIEW."
            - "Clock advanced to 2026-10-01; application 2 submitted, giving [2026-10-01, 2026-10-31] — exactly one overlapping window (the shared endpoint 2026-10-01), so 1 < 2 and it is accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /reviewers"
              payload: { full_name: "S. Hale", agency: "SHPO", state_code: "OH" }
              as: PlatformAdmin
              captures: { shpo_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop1_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Oak Foundry", street_address: "44 Oak Street", city: "Dayton", state_code: "OH", year_built: 1905, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop2_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Canal Warehouse", street_address: "9 Canal Road", city: "Dayton", state_code: "OH", year_built: 1898, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop3_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop1_id}", project_name: "Elm Mill Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj1_id: $.data.id, proj1_v1: $.data.version }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop2_id}", project_name: "Oak Foundry Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj2_id: $.data.id, proj2_v1: $.data.version }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop3_id}", project_name: "Canal Warehouse Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj3_id: $.data.id, proj3_v1: $.data.version }
            - call: "POST /part-applications"
              payload: { project_id: "${proj1_id}", part_number: 1, narrative: "Evaluation of significance for Elm Mill.", expected_project_version: "${proj1_v1}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { pa1_id: $.data.id }
            - call: "POST /part-applications"
              payload: { project_id: "${proj2_id}", part_number: 1, narrative: "Evaluation of significance for Oak Foundry.", expected_project_version: "${proj2_v1}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { pa2_id: $.data.id }
            - call: "POST /part-applications"
              payload: { project_id: "${proj3_id}", part_number: 1, narrative: "Evaluation of significance for Canal Warehouse.", expected_project_version: "${proj3_v1}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { pa3_id: $.data.id }
            - call: "POST /part-applications/${pa1_id}/submit"
              payload: { shpo_reviewer_id: "${shpo_id}" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /part-applications/${pa2_id}/submit"
              payload: { shpo_reviewer_id: "${shpo_id}" }
