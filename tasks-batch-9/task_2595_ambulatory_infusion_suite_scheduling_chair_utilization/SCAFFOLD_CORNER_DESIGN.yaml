              captures: { ap_urgent: $.data.id, urgent_start: $.data.start_minute }
          assert:
            - "${err_routine_today} == 'ERR_SAME_DAY_REQUIRES_ADDON' with HTTP 422 — a ROUTINE class may not name the clock's own date"
            - "${err_addon_future} == 'ERR_ADDON_DATE_MISMATCH' with HTTP 422 — the mirror rule refuses an add-on on any other date"
            - "Third trigger HTTP status == 201: at minute 600, before the cutoff of 900, the same-day add-on is accepted with Appointment.${ap_addon}.start_minute == 660"
            - "${err_cutoff} == 'ERR_ADDON_CUTOFF_PASSED' with HTTP 422 — the only change is the clock moving from 600 to 930"
            - "Last trigger HTTP status == 201 and ${urgent_start} == 870 — URGENT is exempt from rule 93 at the very same clock that refused the add-on"
            - "Appointment.${ap_urgent}.booking_class == 'URGENT' and chair_id is not null and end_minute == 1110"
            - "The two refusals for ${pt_r} wrote nothing: GET /appointments filtered by patient_id == ${pt_r} returns 0 rows"
            - "Nurse.${nr1}.assigned_acuity_points == 6 — only the two accepted bookings (3 + 3) loaded the roster"

      - name: the_outreach_cap_follows_the_patients_tier_and_recounts_the_existing_contacts
        claim_type: aggregate
        grounds:
          - validations[priority 115]
          - errors[ERR_REMINDER_CADENCE_EXCEEDED]
          - entities.ReminderContact.fields.sequence_number
          - entities.Appointment.fields.reminder_cadence_code
        distinguishing_aspect: |
          The cap is an aggregate over rows already sent for the appointment AND it is
          re-read from the patient's tier on every call, not frozen at booking. A
          history-free patient is STANDARD, so contact 1 passes and contact 2 is refused;
          injecting a late cancellation lifts the rolling score to 27.03 and the tier to
          ELEVATED, after which contacts 2 and 3 pass against the SAME appointment and only
          contact 4 is refused. The counter is never reset by the tier change.
        test_recipe:
          setup:
            - "Standing center, chair, nurse, drug, MID template; one 70 kg patient with an ACTIVE 12-cycle plan and one TENTATIVE visit on 2026-08-10 at 540."
            - "History is injected only between the two reminder rounds: a late CANCELLED visit on 2026-07-20 (weight 100, value 0.50) and a COMPLETED visit on 2026-07-13 (weight 85, value 0), giving 50/185*100 == 27.03 -> ELEVATED."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 12, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
          trigger:
            - call: "POST /appointments/${ap1}/reminders"
              payload: { channel: "SMS" }
              as: Scheduler
              captures: { rc1: $.data.id, rc1_seq: $.data.sequence_number }
            - call: "POST /appointments/${ap1}/reminders"
              payload: { channel: "VOICE" }
              as: Scheduler
              captures: { err_standard_cap: $.data.error_id }
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-07-13", schedule_status: "COMPLETED", chair_minutes: 240, start_minute: 540, actual_start_minute: 540, actual_end_minute: 780, cycle_number: 11 }
              as: Scheduler
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-07-20", schedule_status: "CANCELLED", chair_minutes: 240, start_minute: 540, late_cancellation: true, cycle_number: 12 }
              as: Scheduler
            - call: "GET /patients/${pt1}/no-show-risk"
              payload: { variant: "ROLLING_6" }
              as: Scheduler
              captures: { tier_score: $.data.score, tier_now: $.data.reminder_tier }
            - call: "POST /appointments/${ap1}/reminders"
              payload: { channel: "VOICE" }
              as: Scheduler
              captures: { rc2: $.data.id, rc2_seq: $.data.sequence_number }
            - call: "POST /appointments/${ap1}/reminders"
              payload: { channel: "PORTAL" }
              as: Scheduler
              captures: { rc3: $.data.id, rc3_seq: $.data.sequence_number }
            - call: "POST /appointments/${ap1}/reminders"
              payload: { channel: "SMS" }
              as: Scheduler
              captures: { err_elevated_cap: $.data.error_id }
          assert:
            - "${rc1_seq} == 1 and ReminderContact.${rc1}.outcome == 'NO_RESPONSE' and patient_id == ${pt1}"
            - "${err_standard_cap} == 'ERR_REMINDER_CADENCE_EXCEEDED' with HTTP 409 — the STANDARD tier caps outreach at 1"
            - "${tier_score} == 27.03 and ${tier_now} == 'ELEVATED' — 50/(100+85)*100, not 50/375*100 == 13.33"
            - "Appointment.${ap1}.reminder_cadence_code == 'C_ELEVATED' — it mirrors the tier at read time"
            - "${rc2_seq} == 2 and ${rc3_seq} == 3 — the counter continued from the pre-existing row rather than restarting"
            - "${err_elevated_cap} == 'ERR_REMINDER_CADENCE_EXCEEDED' with HTTP 409 at the fourth attempt"
            - "GET /reminder-contacts filtered by appointment_id == ${ap1} returns exactly 3 rows — neither refusal wrote a contact"
            - "Patient.${pt1}.no_show_strikes == 0 — a late cancellation feeds the score but is not a strike"

      - name: compounding_is_bracketed_by_the_too_early_floor_and_the_stability_ceiling
        claim_type: temporal
        grounds:
          - validations[priority 74]
          - validations[priority 96]
          - errors[ERR_PREP_STABILITY_SHORT]
          - errors[ERR_PREP_TOO_EARLY]
          - entities.DrugPreparation.fields.usable_until
        distinguishing_aspect: |
          With prep_stability_minutes 30 the two temporal rules bracket a single legal
          instant. Administration begins at start_minute 540 plus 30 premed minutes, i.e.
          09:30. Compounding at 07:00 violates BOTH rules and the lower priority number
          wins, so the error is ERR_PREP_STABILITY_SHORT and never ERR_PREP_TOO_EARLY;
          08:30 violates only the stability rule; 09:00 satisfies both on their inclusive
          edges (exactly at the start instant, and prepared_at + 30 == the administration
          instant) and compounds. Each refusal leaves the row in REQUESTED so the retry is
          legal.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Standing center, chair, nurse, MID template, 70 kg patient, ACTIVE 6-cycle plan."
            - "The drug is created with prep_stability_minutes 30 and requires_lab_gate false so only the temporal rules are in play; one lot of 10 units expiring 2026-12-01."
            - "The visit is booked for 2026-08-10 at 540, authorized, confirmed, and one 1-unit preparation is requested."
