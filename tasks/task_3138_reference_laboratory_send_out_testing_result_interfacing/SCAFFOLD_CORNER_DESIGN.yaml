          - entities.Specimen.fields.remaining_stability_hours
          - entities.TestCatalogEntry.fields.stability_hours_ambient
        distinguishing_aspect: "The binding window is the MINIMUM ambient stability across the ordered tests, so adding a second test with a shorter window to the same specimen shortens remaining_stability_hours without any write to the specimen."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with a certified build, a published ferritin entry (72-hour AMBIENT window) and a published lactate entry (2-hour AMBIENT window), plus a 2.5 mL serum specimen."
