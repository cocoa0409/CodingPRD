  # ===========================================================================
  # §1.7 declares role_model: segregation_of_duties, so the guide's approval_chain,
  # hierarchical_override and delegated_authority rows do not apply. The guide's
  # denial claim names ERR_UNAUTHORIZED; this scaffold's §1.6 has no such code, so
  # the denial instances are written against the declared priority-3 code
  # ERR_ROLE_NOT_PERMITTED (403) and the priority-4 ERR_MARKET_SCOPE_VIOLATION.
  - section: rbac
    instances:

      - name: each_role_can_perform_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - rbac[PlatformAdmin].exclusive_operations
          - rbac[FleetPlanner].exclusive_operations
          - rbac[FleetController].exclusive_operations
          - rbac[RemarketingManager].exclusive_operations
          - rbac[MarketOperator].exclusive_operations
        distinguishing_aspect: "All five roles are exercised on their OWN exclusive surface inside one chain, including the two that are easy to strand: RemarketingManager reaches open-recovery through a damage event on an ON_ORDER vehicle, and MarketOperator acts with X-User-ID set to its market's id rather than an opaque user string."
        test_recipe:
          setup:
            - "One ATL market, MIDSIZE segment, RISK program, ACTIVE MID-2026 policy, LOCKED ATL plan with a 1-unit allocation and one minted ON_ORDER vehicle."
            - "The vehicle has never been in-fleeted, so in_service_at is null, holding_days is 0 and net_book_value_cents equals the capitalized 2800000 cents."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Cascade", program_year: 2026, program_type: "RISK", repurchase_guarantee_pct: 0.00, min_holding_days: 90, max_holding_days: 900, max_eligible_mileage_km: 100000, excess_mileage_charge_cents_per_km: 0, damage_deduction_cap_cents: 0 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_rsk: $.data.id }
            - call: "POST /fleet/depreciation-policies"
              payload: { segment_id: "${seg_mid}", name: "MID-2026", monthly_depreciation_pct: 0.0150, mileage_depreciation_cents_per_km: 12, floor_residual_pct: 0.35, effective_from: "2026-01-01T00:00:00Z" }
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { pol_mid: $.data.id }
            - call: "POST /fleet/depreciation-policies/${pol_mid}/activate"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-b"
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_rsk}", segment_id: "${seg_mid}", unit_count: 1, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_1: $.data.id }
            - call: "POST /fleet/purchase-allocations/${alloc_1}/vehicles"
              payload: { vin: "CA26RSKATL001001", current_market_id: "${mkt_atl}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { veh_x: $.data.id }
            - call: "GET /fleet/fleet-plans/${plan_atl}"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "COMPACT", name: "Compact hatch", baseline_daily_rate_cents: 4200, target_utilization_pct: 0.82, target_revenue_per_unit_month_cents: 103000, mileage_band_soft_limit_km: 38000, mileage_band_hard_limit_km: 58000, recondition_cap_cents: 70000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_cmp: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_rsk}", segment_id: "${seg_cmp}", unit_count: 1, capitalized_cost_per_unit_cents: 2100000, expected_plan_version: "${plan_v2}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_2: $.data.id }
            - call: "POST /fleet/purchase-allocations/${alloc_2}/cancel"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
            - call: "POST /fleet/vehicles/${veh_x}/damage-events"
              payload: { damage_type: "VANDALISM", estimate_cents: 400000 }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { de_x: $.data.id }
            - call: "POST /fleet/damage-events/${de_x}/open-recovery"
              payload: { recovery_source: "THIRD_PARTY_INSURER" }
              as: RemarketingManager
              as_user_id: "u-rm-1"
            - call: "POST /fleet/damage-events/${de_x}/write-off"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
          assert:
            - "PlatformAdmin's segment create returns HTTP 201; FleetPlanner's allocation create returns 201 and its cancel returns 200 with status \"CANCELLED\""
            - "MarketOperator's damage report returns HTTP 201 with net_book_value_at_report_cents 2800000 and total_loss_required false"
            - "RemarketingManager's open-recovery returns HTTP 200 with status \"RECOVERY_PENDING\" and recovery_source \"THIRD_PARTY_INSURER\""
            - "FleetController's write-off returns HTTP 200 with status \"WRITTEN_OFF\""
            - "every call in setup and trigger used the single role §1.7 declares for it; no call needed a second role, which proves the surfaces are genuinely partitioned"

      - name: every_role_shares_read_access_to_the_market_registry
        claim_type: shared_operations
        grounds:
          - rbac[PlatformAdmin].shared_operations
          - rbac[FleetPlanner].shared_operations
          - rbac[FleetController].shared_operations
          - rbac[RemarketingManager].shared_operations
          - rbac[MarketOperator].shared_operations
        distinguishing_aspect: "§1.7 gives all five roles every GET, and the response body must be byte-identical across them - there is no role-filtered projection, and MarketOperator's read is NOT narrowed to its own market even though its writes are."
        test_recipe:
          setup:
            - "Two markets ATL and DFW so that a would-be operator-scoped read filter would be observable."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
