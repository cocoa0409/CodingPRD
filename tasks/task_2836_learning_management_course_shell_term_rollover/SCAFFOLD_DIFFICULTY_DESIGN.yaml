              captures: { pb_id: $.data.id, staged: $.data.staged_enrollment_count, variant_staged: $.data.variant_applied, accepted_staged: $.data.accepted_points_total, submitted_staged: $.data.submitted_points_total, disputed_staged: $.data.disputed_points_held }
