# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 breadth probe for
# task_2573_fixed_wireless_rural_isp_tower_subscriber_installation
#
# Walk of references/claim-extraction-guide.md's nine sections against this
# scaffold's §1.1-§1.7. Sections and claim_type values are taken verbatim from
# that guide; no categories are invented. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub naming the
# covering §1.8 instance and no test_recipe.
#
# Fixed facts used throughout:
#   * the logical clock starts at exactly 2026-08-01T00:00:00Z (§1.5
#     POST /_clock/set_current_utc description);
#   * every literal below was computed by executing the relevant §1.4 formula.

scaffold_corner_design:

  - section: entities
    instances:
      - name: tower_created_with_all_required_fields_returns_planned_and_zero_derived_fields
        claim_type: creation
        grounds:
          - entities.Tower
          - entities.Tower.fields.status
          - entities.Tower.fields.current_monthly_rent_cents
          - entities.Tower.fields.active_sector_count
          - entities.Tower.fields.backhaul_accepted_mbps
          - endpoints.POST /towers
          - response_envelope.success
        distinguishing_aspect: |
          A single POST /towers with all ten declared input fields returns 201 and a body in which
          every §1.1 Tower field is present: status defaults to PLANNED, version is 1, and the three
          computed fields read current_monthly_rent_cents 45000 (lease_start_date 2026-07-01 is not
          yet one anniversary behind the 2026-08-01 clock, so years_elapsed is 0),
          active_sector_count 0 and backhaul_accepted_mbps 0.
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-101", latitude: 41.3000, longitude: -104.9000, ground_elevation_m: 1180.0, antenna_agl_m: 36.0, lease_landowner_name: "Kestrel Land Co", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2026-07-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id, tower_v1: $.data.version }
          assert:
            - "HTTP status is 201"
            - "response_type == \"object\" and meta.api_request_id and meta.api_request_timestamp are both present"
            - "Tower.id is a non-empty string and Tower.version == 1"
            - "Tower.site_code == \"RB-TWR-101\""
            - "Tower.status == \"PLANNED\" (the §1.1 system default, not supplied by the caller)"
            - "Tower.ground_elevation_m == 1180.0 and Tower.antenna_agl_m == 36.0"
            - "Tower.current_monthly_rent_cents == 45000"
            - "Tower.active_sector_count == 0"
            - "Tower.backhaul_accepted_mbps == 0"
            - "Tower.created_at == Tower.updated_at"

      - name: service_plan_read_back_returns_every_stored_field_unchanged
        claim_type: retrieval
        grounds:
          - entities.ServicePlan
          - endpoints.POST /service-plans
          - endpoints.GET /service-plans/{id}
        distinguishing_aspect: |
          GET /service-plans/{id} returns exactly the nine values POSTed, with no rounding,
          re-derivation or default substitution: soft_cap_gb stays 600.0, deprioritization_factor
          stays 0.25, sla_uptime_pct stays 99.5 and both enums keep their submitted members.
        test_recipe:
          setup:
            - "One ServicePlan STD50 created by a CapacityPlanner."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: SalesAgent
          assert:
            - "HTTP status is 200"
            - "ServicePlan.id == ${plan_id}"
            - "ServicePlan.tier_code == \"STD50\""
            - "ServicePlan.downstream_mbps == 50 and ServicePlan.upstream_mbps == 10"
            - "ServicePlan.monthly_price_cents == 6999"
            - "ServicePlan.soft_cap_gb == 600.0"
            - "ServicePlan.deprioritization_factor == 0.25"
            - "ServicePlan.sla_uptime_pct == 99.5"
            - "ServicePlan.sla_credit_method == \"SLA_SHORTFALL\""
            - "ServicePlan.equipment_policy == \"RENTAL_OR_PURCHASE\""

      - name: sector_list_filtered_by_tower_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /sectors
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three Sectors on one Tower, GET /sectors?tower_id=&limit=2&offset=0 returns exactly 2
          rows with total_count 3 and has_more true, and the follow-up offset=2 page returns the
          remaining 1 row with has_more false - the filter is applied before the window, so
          total_count counts the filtered set, not every Sector row.
        setup_note: "Sectors stay in status PLANNED; listing does not require activation."
        test_recipe:
          setup:
            - "One Tower RB-TWR-101 in status PLANNED."
            - "One SpectrumLicense CBRS-PAL-4412 spanning 3550.0-3650.0 MHz."
            - "Three Sectors on that tower at azimuths 90.0, 210.0 and 330.0, all in status PLANNED."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-101", latitude: 41.3000, longitude: -104.9000, ground_elevation_m: 1180.0, antenna_agl_m: 36.0, lease_landowner_name: "Kestrel Land Co", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2026-07-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_a: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 210.0, beamwidth_deg: 65.0, channel_center_mhz: 3575.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_b: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 330.0, beamwidth_deg: 65.0, channel_center_mhz: 3595.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_c: $.data.id }
          trigger:
            - call: "GET /sectors"
              payload: { tower_id: "${tower_id}", limit: 2, offset: 0 }
              as: CapacityPlanner
            - call: "GET /sectors"
              payload: { tower_id: "${tower_id}", limit: 2, offset: 2 }
              as: CapacityPlanner
          assert:
            - "First page: HTTP 200, response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "The union of the two pages is exactly {${sector_a}, ${sector_b}, ${sector_c}} with no row repeated"

      - name: get_unknown_subscriber_id_returns_subscriber_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_SUBSCRIBER_NOT_FOUND]
          - validations[priority=5]
          - endpoints.GET /subscribers/{id}
          - response_envelope.error
        distinguishing_aspect: |
          A GET against a well-formed but unused Subscriber id returns 404 with error_id exactly
          ERR_SUBSCRIBER_NOT_FOUND - the entity-specific member of the priority-5 path-id family,
          never a generic 404 or ERR_VALIDATION.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /subscribers/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: BillingAdmin
              captures: { err_sub_404: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response_type == \"error\" and ${err_sub_404} == \"ERR_SUBSCRIBER_NOT_FOUND\""
            - "data.message is a non-empty string"

      - name: tower_create_missing_antenna_agl_m_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Tower.fields.antenna_agl_m
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          antenna_agl_m carries source input with no default, so omitting it from POST /towers
          returns 400 ERR_VALIDATION and persists nothing - a follow-up create with the same
          site_code succeeds, proving no partial row was written.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-101", latitude: 41.3000, longitude: -104.9000, ground_elevation_m: 1180.0, lease_landowner_name: "Kestrel Land Co", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2026-07-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { err_missing_agl: $.data.error_id }
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-101", latitude: 41.3000, longitude: -104.9000, ground_elevation_m: 1180.0, antenna_agl_m: 36.0, lease_landowner_name: "Kestrel Land Co", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2026-07-01", lease_term_months: 60 }
              as: NetworkEngineer
          assert:
            - "First call: HTTP 400 and ${err_missing_agl} == \"ERR_VALIDATION\""
            - "Second call: HTTP 201 - site_code \"RB-TWR-101\" was still free, so the rejected request stored nothing"

      - name: sector_created_without_max_oversubscription_ratio_defaults_to_eight
        claim_type: defaults
        grounds:
          - entities.Sector.fields.max_oversubscription_ratio
          - entities.Sector.fields.status
          - endpoints.POST /sectors
          - calculations.sector_capacity_posture
        distinguishing_aspect: |
          Omitting the optional max_oversubscription_ratio from POST /sectors stores the §1.1 default
          8.0 (not null and not 1.0), while status takes its system default PLANNED and
          capacity_posture reads FROZEN because the parent Tower's backhaul_accepted_mbps is still 0.
        test_recipe:
          setup:
            - "One Tower RB-TWR-101 in status PLANNED with no ACCEPTED BackhaulCircuit."
            - "One SpectrumLicense CBRS-PAL-4412 spanning 3550.0-3650.0 MHz."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-101", latitude: 41.3000, longitude: -104.9000, ground_elevation_m: 1180.0, antenna_agl_m: 36.0, lease_landowner_name: "Kestrel Land Co", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2026-07-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
          trigger:
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Sector.max_oversubscription_ratio == 8.0"
            - "Sector.status == \"PLANNED\" and Sector.version == 1"
            - "Sector.sold_mbps == 0, Sector.held_mbps == 0, Sector.committed_mbps == 0, Sector.oversubscription_ratio == 0.000"
            - "Sector.capacity_posture == \"FROZEN\" because Tower.backhaul_accepted_mbps == 0"
            - "Sector.capacity_policy_note is null"

      - name: capacity_hold_created_without_hold_days_defaults_to_a_fourteen_day_window
        claim_type: defaults
        grounds:
          - entities.CapacityHold.fields.hold_days
          - entities.CapacityHold.fields.expires_at
          - entities.CapacityHold.fields.origin
          - endpoints.POST /capacity-holds
        distinguishing_aspect: |
          POST /capacity-holds with hold_days omitted stores 14 and fixes expires_at at
          2026-08-15T00:00:00Z (the 2026-08-01 clock plus 14 days), while origin takes its system
          default DIRECT rather than AUTO_PROMOTION and held_mbps is copied as 50 from the plan.
        test_recipe:
          setup:
            - "ACTIVE Tower RB-TWR-001 (ACCEPTED BackhaulCircuit committed_mbps 500), ACTIVE Sector capacity_mbps 25 / max_oversubscription_ratio 8.0, ServicePlan STD50 at 50 Mbps."
            - "One QUALIFIED ServiceabilityRequest SR1 on the STD50 plan."
            - "Clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_v1: $.data.version }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Dana Reyes", premise_latitude: 41.2600, premise_longitude: -104.7600, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr1_id: $.data.id }
          trigger:
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr1_id}", expected_sector_version: "${sector_v1}" }
              as: SalesAgent
              captures: { hold_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "CapacityHold.hold_days == 14"
            - "CapacityHold.expires_at == \"2026-08-15T00:00:00Z\""
            - "CapacityHold.status == \"HELD\" and CapacityHold.release_reason is null"
            - "CapacityHold.origin == \"DIRECT\""
            - "CapacityHold.held_mbps == 50 and CapacityHold.sector_id == ${sector_id}"

      - name: sector_edges_and_eirp_are_computed_from_channel_and_power_inputs
        claim_type: computed_fields
        grounds:
          - entities.Sector.fields.eirp_dbm
          - entities.Sector.fields.lower_edge_mhz
          - entities.Sector.fields.upper_edge_mhz
          - entities.SpectrumLicense.fields.lower_edge_mhz
          - entities.SpectrumLicense.fields.upper_edge_mhz
        distinguishing_aspect: |
          The four computed spectrum fields are derived, never stored from input: a 3555.0 MHz centre
          with 10.0 MHz width yields lower_edge_mhz 3550.0 and upper_edge_mhz 3560.0, and
          tx_power_dbm 25.0 with antenna_gain_dbi 17.0 yields eirp_dbm 42.0, while the licence's own
          3600.0/100.0 pair yields 3550.0 and 3650.0.
        test_recipe:
          setup:
            - "One Tower RB-TWR-101 in status PLANNED."
            - "One SpectrumLicense CBRS-PAL-4412 centred 3600.0 MHz, width 100.0 MHz, max_eirp_dbm 47.0."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-101", latitude: 41.3000, longitude: -104.9000, ground_elevation_m: 1180.0, antenna_agl_m: 36.0, lease_landowner_name: "Kestrel Land Co", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2026-07-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id, lic_lower: $.data.lower_edge_mhz, lic_upper: $.data.upper_edge_mhz }
          trigger:
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Sector.lower_edge_mhz == 3550.0 and Sector.upper_edge_mhz == 3560.0"
            - "Sector.eirp_dbm == 42.0"
            - "${lic_lower} == 3550.0 and ${lic_upper} == 3650.0"
            - "SpectrumLicense.status == \"ACTIVE\" at the 2026-08-01 clock (effective_from 2025-01-01 <= clock_now < effective_to 2030-01-01)"

      - name: subscriber_system_fields_mint_account_number_and_initial_status
        claim_type: system_fields
        grounds:
          - entities.Subscriber.fields.account_number
          - entities.Subscriber.fields.service_status
          - entities.Subscriber.fields.usage_priority
          - entities.Subscriber.fields.sector_id
          - entities.EquipmentAssignment.fields.acquisition_mode
          - endpoints.POST /subscribers
        distinguishing_aspect: |
          The first Subscriber ever created is minted with account_number "RB-000001", service_status
          PENDING_INSTALL, usage_priority STANDARD, cycle_start_date null and service_start_date
          null - all server-assigned, none accepted from the caller - and its EquipmentAssignment is
          created as a side effect with acquisition_mode RENTAL and monthly_rental_cents 1000.
        test_recipe:
          setup:
            - "ACTIVE Tower / ACTIVE Sector / STD50 plan baseline, one QUALIFIED ServiceabilityRequest SR1 and its HELD CapacityHold of 50 Mbps."
            - "Clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_v1: $.data.version }
            - call: "POST /service-plans"
