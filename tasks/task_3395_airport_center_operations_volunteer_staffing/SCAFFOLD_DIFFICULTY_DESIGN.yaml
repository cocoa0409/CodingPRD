      - name: agreement_security_gates_tour_approval
        grounds:
          - state_machines.Event.SECURITY_REVIEW_to_SECURITY_APPROVED
          - entities.SiteAgreement.fields.security_level
          - errors[ERR_SECURITY_LEVEL_INSUFFICIENT]
        distinguishing_aspect: |
          Entity pair SiteAgreement -> Event (different pair than the sibling):
          a tour requiring security level 3 cannot be security-approved while the
          center's ACTIVE agreement grants level 2; superseding with a level-3
          agreement unblocks the same approval.
        test_recipe:
          setup:
            - "Clock 2026-09-01; center with ACTIVE agreement A (security_level 2)"
            - "ENTERTAINMENT_TOUR event requiring level 3, talent signed, min_volunteers 0"
