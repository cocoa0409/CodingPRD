# =============================================================================
# Karaoke & Private Room Booking — Scaffold seed tables (Expert tier)
# =============================================================================

scenario: |
  Karaoke & Private Room Booking: room/size inventory & hourly rate, time-block
  reservation & extension, song catalog/queue, food & beverage minimum,
  peak/off-peak pricing, deposit & cancellation, group package, overage billing

domain_name: karaoke-private-room-booking
api_prefix: ""

# =============================================================================
# Complexity Profile (§0.1–§0.3) — Expert tier (§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on Reservation.version for true create-supersede races
    - dual_variant_calculation      # quoted (forward, off-peak optimistic) vs settled (chronological per-segment)
    - cascading_side_effects        # check-in/cancel/no-show chains across Reservation -> QueueEntry/FbOrder/Room/Payment
    - rate_threshold_triggers       # F&B minimum shortfall, deposit threshold, grace minutes, package overage

  entity_topology: flat
  # Flat peer collections linked by foreign keys (no nested URL paths in v1). Venue,
  # RoomType, Room, GroupPackage, Customer, Song, Reservation, Extension, QueueEntry,
  # FbOrder, Payment each have a top-level collection; venue_id / reservation_id etc.
  # are body/query FK fields rather than path segments. Children are created via a
  # sub-resource POST (e.g. POST /reservations/{id}/queue) but read/listed flat.

  state_machine_shape: branching
  # Reservation forks: HELD -> {CONFIRMED -> CHECKED_IN -> CLOSED} or {CANCELLED, EXPIRED, NO_SHOW};
  # divergent side-effect sets per branch (deposit refund vs forfeit vs settlement).

  relationship_patterns:
    - one_to_many        # Venue -> RoomType/Room/Song/GroupPackage; Reservation -> Extension/QueueEntry/FbOrder/Payment
    - cross_aggregate    # Reservation -> Room, Reservation -> GroupPackage, Reservation -> Customer

  role_model: peer_roles
  # Customer owns own reservations; FrontDesk operates the venue floor; VenueManager
  # configures inventory/pricing/packages. Distinct resource ownership per role.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix; identity only" }
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: timezone, type: string, source: input, description: "IANA tz id used to bucket reservation hours into peak/off-peak; e.g. America/Los_Angeles" }
      - { name: peak_start_minute, type: integer, source: input, description: "Minute-of-day (0..1439) when the peak window opens, local time", constraints: "0 <= peak_start_minute <= 1439" }
      - { name: peak_end_minute, type: integer, source: input, description: "Minute-of-day (0..1439) when the peak window closes, local time; window is half-open [start,end); start < end (no wrap-around in v1)", constraints: "peak_start_minute < peak_end_minute <= 1439" }
      - { name: peak_multiplier, type: number, source: input, description: "Multiplier applied to RoomType.base_hourly_rate_cents for minutes inside the peak window", default: 1.5, constraints: ">= 1.0" }
      - { name: deposit_pct, type: number, source: input, description: "Fraction of the quoted room subtotal collected as a deposit at confirmation", default: 0.2, constraints: "0 < deposit_pct <= 1" }
      - { name: cancellation_cutoff_hours, type: integer, source: input, description: "Hours before slot_start_utc within which a cancellation forfeits the deposit", default: 24, constraints: ">= 0" }
      - { name: grace_minutes, type: integer, source: input, description: "Minutes after slot_start_utc a CONFIRMED reservation may still check in before auto NO_SHOW on ops run", default: 15, constraints: ">= 0" }
      - { name: overage_grace_minutes, type: integer, source: input, description: "Minutes a checked-in session may run past slot_end_utc before overage billing begins", default: 10, constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: RoomType
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; owning venue" }
      - { name: name, type: enum, source: input, description: "SMALL | MEDIUM | LARGE | VIP" }
      - { name: capacity, type: integer, source: input, description: "Maximum party size the room size accommodates", constraints: ">= 1" }
      - { name: base_hourly_rate_cents, type: integer, source: input, description: "Off-peak hourly rate in cents for rooms of this size", constraints: ">= 0" }
      - { name: fb_minimum_cents, type: integer, source: input, description: "Required food & beverage spend floor for any reservation on this room size", default: 0, constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Whether new reservations may target this room size", default: true }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Room
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; owning venue" }
      - { name: room_type_id, type: string, source: system, description: "FK -> RoomType.id; the size tier this physical room belongs to" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Room 3'" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OCCUPIED | OUT_OF_SERVICE", default: AVAILABLE }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: GroupPackage
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; owning venue" }
      - { name: name, type: string, source: input, description: "Package display name, e.g. 'Birthday Bash'" }
      - { name: flat_price_cents, type: integer, source: input, description: "Flat room charge that replaces hourly pricing for the included block", constraints: ">= 0" }
      - { name: included_hours, type: number, source: input, description: "Hours of room time covered by the flat price; time beyond is billed as overage", constraints: "> 0" }
      - { name: included_room_type_id, type: string, source: system, description: "FK -> RoomType.id; the room size the package is sold for" }
      - { name: included_fb_credit_cents, type: integer, source: input, description: "F&B credit that counts toward the room size's fb_minimum_cents", default: 0, constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Whether the package may be booked", default: true }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as Customer" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Contact email; unique" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of this customer's reservations that ended in NO_SHOW; incremented by the NO_SHOW transition", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Reservation
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; owning venue" }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; the physical room the time block occupies" }
      - { name: room_type_id, type: string, source: system, description: "FK -> RoomType.id; denormalized size tier copied from the room at create time (pins base_hourly_rate_cents/fb_minimum_cents/capacity used for this booking)" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; the booking party" }
      - { name: group_package_id, type: string, source: system, description: "FK -> GroupPackage.id; null for a la carte hourly bookings, set when booked as a package" }
      - { name: party_size, type: integer, source: input, description: "Number of guests; must not exceed room size capacity", constraints: ">= 1" }
      - { name: slot_start_utc, type: datetime, source: input, description: "Half-open interval start [start,end); ISO 8601 UTC" }
      - { name: slot_end_utc, type: datetime, source: input, description: "Half-open interval end; must be strictly after slot_start_utc" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CHECKED_IN | CLOSED | CANCELLED | EXPIRED | NO_SHOW", default: HELD }
      - { name: checked_in_at, type: datetime, source: system, description: "Wall-clock UTC of check-in; null until CHECKED_IN" }
      - { name: actual_end_utc, type: datetime, source: system, description: "UTC the session was closed; basis for overage minutes; null until CLOSED" }
      - { name: quoted_room_subtotal_cents, type: integer, source: computed, description: "Forward-looking room charge at HELD/CONFIRMED time (see calc quoted_room_subtotal)" }
      - { name: deposit_cents, type: integer, source: computed, description: "Deposit due at confirmation = round_half_up(quoted_room_subtotal_cents * Venue.deposit_pct)" }
      - { name: settled_room_subtotal_cents, type: integer, source: computed, description: "Chronological per-segment room charge incl. overage, fixed at CLOSE (see calc settled_room_subtotal); null until CLOSED" }
      - { name: fb_consumed_cents, type: integer, source: computed, description: "Sum of FbOrder.line_total_cents for non-VOID orders on this reservation" }
      - { name: fb_shortfall_cents, type: integer, source: computed, description: "Amount by which fb credit+consumed falls below the room size fb_minimum (see calc fb_shortfall)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Amount owed at CLOSE = settled_room_subtotal + fb_consumed + fb_shortfall - deposit_cents (deposit credited); never below 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; also the tie-break key for chronological/cascade ordering" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Extension
    parent: Reservation
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; the reservation whose interval is extended" }
      - { name: new_slot_end_utc, type: datetime, source: input, description: "Proposed new slot_end_utc; must be strictly after the current slot_end_utc" }
      - { name: added_minutes, type: integer, source: computed, description: "Whole minutes added = (new_slot_end_utc - prior slot_end_utc) in minutes" }
      - { name: status, type: enum, source: system, description: "APPLIED (an Extension row is persisted only on success; conflicts/stale-version are rejected with an HTTP error and no row is written)", default: APPLIED }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Song
    parent: Venue
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; owning venue catalog" }
      - { name: title, type: string, source: input, description: "Song title" }
      - { name: artist, type: string, source: input, description: "Performing artist" }
      - { name: duration_seconds, type: integer, source: input, description: "Track length in seconds", constraints: ">= 1" }
      - { name: language, type: enum, source: input, description: "EN | JP | KR | ZH | ES | OTHER" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; tie-break key for queue ordering at equal priority" }

  - name: QueueEntry
    parent: Reservation
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; session this song is queued in" }
      - { name: song_id, type: string, source: system, description: "FK -> Song.id; the queued song" }
      - { name: priority, type: integer, source: input, description: "Lower number = sung sooner; ties broken by created_at ASC", default: 100 }
      - { name: play_order, type: integer, source: computed, description: "1-based position among PENDING entries on the reservation, sorted by (priority ASC, created_at ASC)" }
      - { name: status, type: enum, source: system, description: "PENDING | PLAYED | SKIPPED | CANCELLED", default: PENDING }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; tie-break key at equal priority" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: FbOrder
    parent: Reservation
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; reservation this order counts toward" }
      - { name: description, type: string, source: input, description: "Item description, e.g. '2x Lager'" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit price in cents", constraints: ">= 0" }
      - { name: quantity, type: integer, source: input, description: "Number of units", constraints: ">= 1" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: status, type: enum, source: system, description: "PLACED | VOID", default: PLACED }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Payment
    parent: Reservation
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; reservation this payment event belongs to" }
      - { name: kind, type: enum, source: system, description: "DEPOSIT | SETTLEMENT | REFUND | FORFEIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed-positive amount of the event in cents" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; append-only ledger order key" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Reservation
    field: status
    initial_state: HELD
    terminal_states: [CLOSED, CANCELLED, EXPIRED, NO_SHOW]
    note: "Branching: HELD forks into the confirm-and-run path or the abandon/cancel paths; CHECKED_IN forks into CLOSED (settle) only."
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /reservations/{reservation_id}/confirm"
        actor: Customer
        preconditions:
          - "Reservation.status == HELD"
          - "current_utc < slot_start_utc (cannot confirm a slot whose start has already passed)"
          - "party_size <= RoomType.capacity for the reservation's room_type_id"
        side_effects:
          - "Recompute quoted_room_subtotal_cents via calc quoted_room_subtotal (uses GroupPackage flat price when group_package_id set, else hourly forward-looking)"
          - "Recompute deposit_cents = round_half_up(quoted_room_subtotal_cents * Venue.deposit_pct)"
          - "Append Payment{kind: DEPOSIT, amount_cents: deposit_cents}"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /reservations/{reservation_id}/check-in"
        actor: FrontDesk
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "current_utc <= slot_start_utc + Venue.grace_minutes (within grace window)"
          - "Room.status == AVAILABLE (the assigned room is not OCCUPIED or OUT_OF_SERVICE)"
        side_effects:
          - "Set checked_in_at = current_utc"
          - "Cross-entity: Room.status AVAILABLE -> OCCUPIED"
          - "increments Reservation.version by 1"

      - from: CHECKED_IN
        to: CLOSED
        trigger: "POST /reservations/{reservation_id}/close"
        actor: FrontDesk
        preconditions:
          - "Reservation.status == CHECKED_IN"
          - "Request actual_end_utc >= checked_in_at"
        side_effects:
          - "Set actual_end_utc = request actual_end_utc"
          - "Recompute settled_room_subtotal_cents via calc settled_room_subtotal (chronological per-segment incl. overage past slot_end_utc + overage_grace_minutes)"
          - "Recompute fb_consumed_cents and fb_shortfall_cents via calc fb_shortfall"
          - "Recompute final_total_cents = max(0, settled_room_subtotal_cents + fb_consumed_cents + fb_shortfall_cents - deposit_cents)"
          - "Append Payment{kind: SETTLEMENT, amount_cents: final_total_cents}"
          - "Cascade: all PENDING QueueEntry on this reservation -> SKIPPED"
          - "Cross-entity: Room.status OCCUPIED -> AVAILABLE"
          - "increments Reservation.version by 1"

      - from: HELD
        to: EXPIRED
        trigger: "POST /venues/{venue_id}/_ops/run (ops sweep: HELD past slot_start_utc and never confirmed)"
        actor: system
        preconditions:
          - "Reservation.status == HELD"
          - "current_utc > slot_start_utc"
        side_effects:
          - "Cascade: all PENDING QueueEntry on this reservation -> CANCELLED"
          - "increments Reservation.version by 1"

      - from: HELD
        to: CANCELLED
        trigger: "POST /reservations/{reservation_id}/cancel"
        actor: Customer
        preconditions:
          - "Reservation.status == HELD"
        side_effects:
          - "No deposit exists yet (none collected at HELD) -> no Payment appended"
          - "Cascade: all PENDING QueueEntry on this reservation -> CANCELLED"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{reservation_id}/cancel"
        actor: Customer
        preconditions:
          - "Reservation.status == CONFIRMED"
        side_effects:
          - "If current_utc <= slot_start_utc - Venue.cancellation_cutoff_hours (outside cutoff): append Payment{kind: REFUND, amount_cents: deposit_cents}"
          - "Else (inside cutoff): append Payment{kind: FORFEIT, amount_cents: deposit_cents}"
          - "Cascade: all PENDING QueueEntry on this reservation -> CANCELLED"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /venues/{venue_id}/_ops/run (ops sweep: CONFIRMED and current_utc > slot_start_utc + Venue.grace_minutes, never checked in)"
        actor: system
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "current_utc > slot_start_utc + Venue.grace_minutes"
        side_effects:
          - "Append Payment{kind: FORFEIT, amount_cents: deposit_cents}"
          - "Cross-entity: Customer.no_show_strikes += 1"
          - "Cascade: all PENDING QueueEntry on this reservation -> CANCELLED"
          - "increments Reservation.version by 1"

  - entity: Room
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    note: "Room occupancy is driven by reservation check-in/close; OUT_OF_SERVICE is a manual maintenance toggle (cycle AVAILABLE<->OUT_OF_SERVICE)."
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system (Reservation CONFIRMED -> CHECKED_IN)"
        actor: system
        preconditions:
          - "Room.status == AVAILABLE"
        side_effects:
          - "increments Room.version by 1"

      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system (Reservation CHECKED_IN -> CLOSED)"
        actor: system
        preconditions:
          - "Room.status == OCCUPIED"
        side_effects:
          - "increments Room.version by 1"

      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /rooms/{room_id}/maintenance with target=OUT_OF_SERVICE"
        actor: VenueManager
        preconditions:
          - "Room.status == AVAILABLE (cannot take an OCCUPIED room out of service)"
        side_effects:
          - "increments Room.version by 1"

      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /rooms/{room_id}/maintenance with target=AVAILABLE"
        actor: VenueManager
        preconditions:
          - "Room.status == OUT_OF_SERVICE"
        side_effects:
          - "increments Room.version by 1"

  - entity: QueueEntry
    field: status
    initial_state: PENDING
    terminal_states: [PLAYED, SKIPPED, CANCELLED]
    note: "Queue lifecycle inside an active session; PENDING entries are also force-terminated by Reservation cascades."
    transitions:
      - from: PENDING
        to: PLAYED
        trigger: "POST /queue-entries/{queue_entry_id}/play"
        actor: FrontDesk
        preconditions:
          - "QueueEntry.status == PENDING"
          - "Cross-entity: parent Reservation.status == CHECKED_IN"
          - "This entry is play_order == 1 among PENDING entries (only the head of the queue may be played)"
        side_effects:
          - "Recompute play_order for remaining PENDING entries on the reservation"
          - "increments QueueEntry.version by 1"

      - from: PENDING
        to: SKIPPED
        trigger: "POST /queue-entries/{queue_entry_id}/skip, or system (parent Reservation CLOSED)"
        actor: "FrontDesk or system"
        preconditions:
          - "QueueEntry.status == PENDING"
        side_effects:
          - "Recompute play_order for remaining PENDING entries on the reservation"
          - "increments QueueEntry.version by 1"

      - from: PENDING
        to: CANCELLED
        trigger: "DELETE /queue-entries/{queue_entry_id}, or system (parent Reservation HELD->EXPIRED / *->CANCELLED / CONFIRMED->NO_SHOW)"
        actor: "Customer or system"
        preconditions:
          - "QueueEntry.status == PENDING"
        side_effects:
          - "Recompute play_order for remaining PENDING entries on the reservation"
          - "increments QueueEntry.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-overlap-stale-room
    parent_entity: Room
    write_endpoint: "POST /reservations"
    occ_field: "expected_room_version"
    description: |
      Creating a Reservation that occupies a half-open [slot_start_utc, slot_end_utc)
      interval on a Room whose version has advanced since the client last observed it
      is rejected with a stale-version error. A reservation booking is the canonical
      create-with-supersede case: a previously created booking on the same room
      legitimately occupies an overlapping interval, so a second create against a
      stale view of the room must be refused rather than silently double-booking.
      The client passes the room version it read; if the room has mutated (e.g. a
      booking was created or the room went OUT_OF_SERVICE), the create is rejected.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

  - rule_id: extension-stale-reservation
    parent_entity: Reservation
    write_endpoint: "POST /reservations/{reservation_id}/extensions"
    occ_field: "expected_reservation_version"
    description: |
      Applying an Extension against a Reservation whose version has advanced since
      the client last observed it is rejected with a stale-version error. An
      extension lengthens the booking's interval and must re-run overlap detection
      against the latest room timeline; a stale reservation view (e.g. another
      extension already moved slot_end_utc, or the reservation was checked in) would
      compute against an outdated interval. The client passes the reservation
      version it read; if it has advanced, the extension is rejected.
    error_id: ERR_STALE_RESERVATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quoted_room_subtotal
    trigger: "Reservation HELD->CONFIRMED (confirm), and on HELD create for preview"
    algorithm: forward_looking
    formula: |
      # Forward-looking: priced from the BOOKED interval [slot_start_utc, slot_end_utc),
      # assuming the whole booking runs as planned. Peak/off-peak split is computed in
      # the Venue.timezone local calendar.
      if group_package_id is not null:
        quoted_room_subtotal_cents = GroupPackage.flat_price_cents
        # included_hours / overage are NOT charged at quote time (forward-looking assumes within plan)
      else:
        booked_minutes = (slot_end_utc - slot_start_utc) in whole minutes
        peak_minutes = count of booked minutes whose local minute-of-day is in
                       half-open window [Venue.peak_start_minute, Venue.peak_end_minute)
        offpeak_minutes = booked_minutes - peak_minutes
        per_min_base = RoomType.base_hourly_rate_cents / 60        # exact rational, no early rounding
        offpeak_cost = offpeak_minutes * per_min_base
        peak_cost    = peak_minutes * per_min_base * Venue.peak_multiplier
        # ROUNDING ORDER PINNED: sum the two exact segment costs FIRST, then round once.
        quoted_room_subtotal_cents = round_half_up(offpeak_cost + peak_cost)
    input_set: "The single booked interval of THIS reservation only; no extensions, no actual run time."
    constants:
      MINUTES_PER_HOUR: 60
    precision: "integer cents, round_half_up; round once at the end (sum-then-round)"
    variants:
      - name: a_la_carte
        when: "group_package_id is null"
        difference: "hourly peak/off-peak split priced over the booked interval"
      - name: package
        when: "group_package_id is set"
        difference: "flat package price; hourly split ignored at quote time"

  - name: settled_room_subtotal
    trigger: "Reservation CHECKED_IN->CLOSED (close)"
    algorithm: chronological
    formula: |
      # Chronological: priced from the ACTUAL occupied interval
      # [checked_in_at -> actual_end_utc], walked minute-by-minute in time order, so a
      # session that ran into / out of the peak window is charged per the real minutes,
      # NOT the planned ones. This is why settled can diverge from quoted.
      billable_end = actual_end_utc
      # Overage: minutes past slot_end_utc + Venue.overage_grace_minutes are billable;
      # the grace minutes themselves (slot_end_utc .. slot_end_utc+grace) are free.
      overage_threshold = slot_end_utc + Venue.overage_grace_minutes
      # Per-minute walk over [checked_in_at, billable_end):
      #   each minute is PEAK if its local minute-of-day in [peak_start,peak_end), else OFF-PEAK
      #   each minute past overage_threshold additionally multiplies by OVERAGE_MULTIPLIER
      for each whole minute m in [checked_in_at, billable_end):
        rate = RoomType.base_hourly_rate_cents / 60
        if m local-minute-of-day in [peak_start, peak_end): rate *= Venue.peak_multiplier
        if m >= overage_threshold: rate *= OVERAGE_MULTIPLIER
        accumulate exact rate
      if group_package_id is not null:
        # Package covers included_hours of room time from checked_in_at; only minutes
        # beyond included_hours are billed (still peak/overage adjusted as above).
        covered_minutes = round(GroupPackage.included_hours * 60)
        # Skip the first covered_minutes of the walk (charge 0 for them), bill the rest.
        settled_room_subtotal_cents = round_half_up(flat_price_cents + sum(exact rate for minutes beyond covered_minutes))
      else:
        settled_room_subtotal_cents = round_half_up(sum of exact per-minute rates)
    input_set: "Actual occupied minutes [checked_in_at, actual_end_utc) of THIS reservation, peak/overage adjusted."
    constants:
      MINUTES_PER_HOUR: 60
      OVERAGE_MULTIPLIER: 2.0
    precision: "integer cents, round_half_up; sum exact per-minute rates then round once"
    variants:
      - name: within_plan
        when: "actual_end_utc <= slot_end_utc + overage_grace_minutes"
        difference: "no overage multiplier applied; pure peak/off-peak on actual minutes"
      - name: overage
        when: "actual_end_utc > slot_end_utc + overage_grace_minutes"
        difference: "minutes past overage_threshold billed at OVERAGE_MULTIPLIER on top of peak/off-peak"

  - name: fb_shortfall
    trigger: "Reservation CHECKED_IN->CLOSED (close); also recomputed on FbOrder create/void for preview"
    algorithm: threshold
    formula: |
      fb_consumed_cents = sum(line_total_cents for FbOrder on this reservation where status == PLACED)
      package_credit = GroupPackage.included_fb_credit_cents if group_package_id is not null else 0
      effective_fb = fb_consumed_cents + package_credit
      required = RoomType.fb_minimum_cents for this reservation's room_type_id
      # BOUNDARY: shortfall is charged only when effective_fb is STRICTLY BELOW required.
      # effective_fb == required => shortfall 0 (the minimum is exactly met).
      if effective_fb < required:
        fb_shortfall_cents = required - effective_fb
      else:
        fb_shortfall_cents = 0
    input_set: "PLACED FbOrders on this reservation plus any package F&B credit; VOID orders excluded."
    precision: "integer cents"
    variants:
      - name: met
        when: "fb_consumed + package_credit >= room_type fb_minimum_cents"
        difference: "fb_shortfall_cents == 0"
      - name: shortfall
        when: "fb_consumed + package_credit < room_type fb_minimum_cents"
        difference: "fb_shortfall_cents = required - effective_fb (billed on final_total)"

  - name: queue_play_order
    trigger: "QueueEntry create, play, skip, cancel; Reservation cascade terminating PENDING entries"
    algorithm: aggregation
    formula: |
      candidates = QueueEntry on reservation where status == PENDING
      sort candidates by (priority ASC, created_at ASC)   # created_at is the deterministic tie-break, never id
      assign play_order = 1, 2, 3, ... in that sorted order
    input_set: "PENDING QueueEntry rows on the reservation only."
    precision: "1-based integer position"

  - name: customer_no_show_strikes
    trigger: "Reservation CONFIRMED->NO_SHOW (ops sweep)"
    algorithm: aggregation
    formula: |
      Customer.no_show_strikes = count(Reservation where customer_id == this customer AND status == NO_SHOW)
      # Equivalent incremental form: on each NO_SHOW transition, no_show_strikes += 1.
    input_set: "All NO_SHOW reservations for the customer."
    precision: "non-negative integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 (e.g. only VenueManager configures inventory; only the owning Customer cancels own reservation; only FrontDesk checks in)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist within scope, validated left-to-right (venue, then room/room_type/package/customer/reservation/child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, slot_end_utc strictly after slot_start_utc, numeric fields in declared ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

  - priority: 5
    category: state
    check: "Target resource in a valid state for the requested transition (e.g. confirm requires HELD, check-in requires CONFIRMED, play requires parent CHECKED_IN)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "OCC: expected_room_version / expected_reservation_version matches the current parent version"
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412
    applies_to: "POST /reservations (room), POST /reservations/{id}/extensions (reservation)"

  - priority: 7
    category: business_temporal
    check: "Confirm requires current_utc < slot_start_utc; check-in requires current_utc <= slot_start_utc + grace_minutes; close requires actual_end_utc >= checked_in_at"
    error_id: ERR_TIMING_WINDOW
    http_status: 409
    applies_to: "confirm, check-in, close"

  - priority: 8
    category: business_safety
    check: "party_size must not exceed the reservation's room_type capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/confirm"

  - priority: 9
    category: business_referential
    check: "Room must belong to the requested room_type and the room_type must be active; a package's included_room_type_id must match the chosen room's room_type_id"
    error_id: ERR_ROOM_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 10
    category: business_temporal
    check: "Requested [slot_start_utc, slot_end_utc) must not overlap any active reservation (status in {HELD, CONFIRMED, CHECKED_IN}) on the same room; half-open intervals, adjacency (end == next start) is allowed"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 11
    category: business_temporal
    check: "An extension's new_slot_end_utc must not overlap a later active reservation on the same room; the extension window [old_end, new_end) must be free (half-open, adjacency allowed)"
    error_id: ERR_EXTENSION_CONFLICT
    http_status: 409
    applies_to: "POST /reservations/{id}/extensions"

  - priority: 12
    category: business_constraint
    check: "Room must be AVAILABLE to be taken OUT_OF_SERVICE (maintenance)"
    error_id: ERR_ROOM_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /rooms/{id}/maintenance"

  - priority: 13
    category: business_constraint
    check: "Only the head-of-queue PENDING entry (play_order == 1) may be played"
    error_id: ERR_NOT_QUEUE_HEAD
    http_status: 409
    applies_to: "POST /queue-entries/{id}/play"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Venue (config) ---
  - method: POST
    path: "/venues"
    description: "Create a venue with pricing/policy config"
    roles: [VenueManager]
    code: 201
    input: [name, timezone, peak_start_minute, peak_end_minute, "peak_multiplier?", "deposit_pct?", "cancellation_cutoff_hours?", "grace_minutes?", "overage_grace_minutes?"]
    output: Venue
    side_effects: ["version=1"]

  - method: GET
    path: "/venues/{venue_id}"
    description: "Get venue config"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: POST
    path: "/venues/{venue_id}/_clock/set"
    description: "Set the venue's current UTC clock (test-driving) for timing windows"
    roles: [VenueManager, FrontDesk]
    code: 200
    input: [now_utc]
    output: Venue
    side_effects: ["Sets the server's notion of current_utc for this venue's timing checks"]

  - method: POST
    path: "/venues/{venue_id}/_ops/run"
    description: "Run the ops sweep: expire stale HELDs, NO_SHOW overdue CONFIRMEDs"
    roles: [VenueManager, FrontDesk]
    code: 200
    input: []
    output: Venue
    side_effects:
      - "HELD past slot_start_utc -> EXPIRED (PENDING queue -> CANCELLED)"
      - "CONFIRMED past slot_start_utc+grace_minutes -> NO_SHOW (Payment{FORFEIT}, Customer.no_show_strikes++, PENDING queue -> CANCELLED)"

  # --- RoomType ---
  - method: POST
    path: "/room-types"
    description: "Create a room size tier with hourly rate and F&B minimum"
    roles: [VenueManager]
    code: 201
    input: [venue_id, name, capacity, base_hourly_rate_cents, "fb_minimum_cents?", "active?"]
    output: RoomType
    side_effects: ["version=1"]

  - method: GET
    path: "/room-types"
    description: "List room types, optionally filtered by venue_id"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: RoomType[]
    side_effects: []

  - method: GET
    path: "/room-types/{room_type_id}"
    description: "Get a room type"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: []
    output: RoomType
    side_effects: []

  # --- Room ---
  - method: POST
    path: "/rooms"
    description: "Create a physical room of a given size"
    roles: [VenueManager]
    code: 201
    input: [venue_id, room_type_id, label]
    output: Room
    side_effects: ["status=AVAILABLE, version=1"]

  - method: GET
    path: "/rooms"
    description: "List rooms, optionally filtered by venue_id and/or room_type_id"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: ["venue_id?", "room_type_id?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: GET
    path: "/rooms/{room_id}"
    description: "Get a room (read its version for OCC on booking)"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: POST
    path: "/rooms/{room_id}/maintenance"
    description: "Toggle a room AVAILABLE <-> OUT_OF_SERVICE"
    roles: [VenueManager]
    code: 200
    input: [target]
    output: Room
    side_effects: ["status -> target", "increments Room.version by 1"]

  # --- GroupPackage ---
  - method: POST
    path: "/group-packages"
    description: "Create a group package (flat price, included hours, F&B credit)"
    roles: [VenueManager]
    code: 201
    input: [venue_id, name, flat_price_cents, included_hours, included_room_type_id, "included_fb_credit_cents?", "active?"]
    output: GroupPackage
    side_effects: ["version=1"]

  - method: GET
    path: "/group-packages"
    description: "List group packages, optionally filtered by venue_id and/or included_room_type_id"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: ["venue_id?", "included_room_type_id?", "limit?", "offset?"]
    output: GroupPackage[]
    side_effects: []

  - method: GET
    path: "/group-packages/{group_package_id}"
    description: "Get a group package"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: []
    output: GroupPackage
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [Customer, FrontDesk]
    code: 201
    input: [full_name, email, phone]
    output: Customer
    side_effects: ["no_show_strikes=0, version=1"]

  - method: GET
    path: "/customers/{customer_id}"
    description: "Get a customer (incl. no_show_strikes)"
    roles: [Customer, FrontDesk, VenueManager]
    code: 200
