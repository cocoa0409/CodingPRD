          test_lab_id: ${lab}
          window_start: '2026-08-05T12:00:00Z'
          window_end: '2026-08-05T18:00:00Z'
          chambers_required: 1
        as: CWProjectManager
        captures:
          mock2: $.data.id
      - call: POST /mockup-tests
        payload:
          package_id: ${pkg}
          test_lab_id: ${lab}
          window_start: '2026-08-05T14:00:00Z'
          window_end: '2026-08-05T16:00:00Z'
          chambers_required: 1
        as: CWProjectManager
        captures:
          e_capacity: $.data.error_id
      - call: POST /mockup-tests
        payload:
          package_id: ${pkg}
          test_lab_id: ${lab}
          window_start: '2026-08-05T20:00:00Z'
          window_end: '2026-08-06T06:00:00Z'
          chambers_required: 2
        as: CWProjectManager
        captures:
          mock4: $.data.id
      - call: POST /mockup-tests/${mock1}/record-result
        payload:
          water_penetration_observed: false
          air_infiltration_cfm: 0.04
          structural_deflection_mm: 15.0
        as: QCInspector
