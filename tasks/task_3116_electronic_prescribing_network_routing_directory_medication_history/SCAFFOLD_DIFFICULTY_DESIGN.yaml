  - rule_id: non_linear_state_machine
    instances:

      - name: routing_status_cycle_reenters_fallback_sent
        grounds:
          - state_machines.Prescription.routing_status
          - state_machines.Prescription.routing_status.transitions.FALLBACK_SENT_to_ROUTED
          - state_machines.Prescription.routing_status.transitions.ROUTED_to_BACKUP_SELECTION
          - state_machines.Prescription.routing_status.transitions.BACKUP_SELECTION_to_FALLBACK_PENDING
