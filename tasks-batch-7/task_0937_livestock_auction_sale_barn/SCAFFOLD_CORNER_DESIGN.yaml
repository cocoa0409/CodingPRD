              payload: { to_status: "RINGING" }
              as: BarnAdmin
            - call: "POST /sale-barn/lots/${lot_id}/enter-ring"
              payload: {}
              as: Auctioneer
            - call: "POST /sale-barn/bids"
              payload: { lot_id: "${lot_id}", buyer_registration_id: "${br_id}", unit_price: 182.50 }
              as: RingClerk
              captures: { bid_id: "$.data.id" }
            - call: "GET /sale-barn/lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lot_v: "$.data.version" }
          trigger:
            - call: "POST /sale-barn/lots/${lot_id}/hammer-down"
              payload: { winning_bid_id: "${bid_id}", expected_lot_version: "${lot_v}" }
              as: Auctioneer
              captures: { purchase_id: "$.data.id", invoice_id: "$.data.buyer_invoice_id", ext: "$.data.extended_amount" }
            - call: "GET /sale-barn/buyer-registrations/${br_id}"
              payload: {}
              as: BarnAdmin
              captures: { exposure_now: "$.data.exposure" }
          assert:
            - "The hammer-down response body carries Purchase.extended_amount == 12391.75, head_count == 10, total_weight_lb == 6790 and status == CONFIRMED"
            - "Lot.${lot_id}.sale_status == SOLD and custody_status == BUYER_PEN and hammer_price == 182.50"
            - "Bid.${bid_id}.status == HAMMERED"
            - "BuyerInvoice.${invoice_id}.status == DRAFT and subtotal == 12391.75"
            - "BuyerRegistration.${br_id}.open_purchase_amount == 12391.75 and winning_bid_amount == 0.00"
            - "BuyerRegistration.${br_id}.exposure == 12391.75 and available_credit == 62608.25"
            - "SaleDay.${sd_id}.total_gross_sale_value == 12391.75"
