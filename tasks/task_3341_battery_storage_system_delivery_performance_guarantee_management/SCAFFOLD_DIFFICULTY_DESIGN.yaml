# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3341_battery_storage_system_delivery_performance_guarantee_management
# Depth probe: 9 Difficulty Rules x 2 instances each. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 and its setup_api_calls chain replays cleanly from
# empty-DB (logical clock starts at the 2026-09-01T00:00:00Z default).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: warranty_credit_straight_vs_output_divergence
        grounds:
          - calculations.warranty_credit
          - calculations.warranty_credit.variants
          - entities.WarrantyClaim.fields.credit_amount_cents
        distinguishing_aspect: |
          Two valid credit formulas on the SAME claim inputs diverge by an order
          of magnitude: STRAIGHT_LINE credits ceil(loss * price_per_mwh) while
          OUTPUT_BASED multiplies by throughput * guaranteed_rte * (1 -
          guaranteed_rte). This instance lives in the warranty/claim domain —
          it does NOT repeat the capacity-basis split of capacity tests.
        test_recipe:
          setup:
            - "Project P1 (ENERGY_ARBITRAGE, ONE_CYCLE_DAILY, 10 MW x 40 MWh, budget 20,000,000) exists."
            - "All three permits APPROVED; ESA E1 (40 MWh, rte 0.88, price 300,000/MWh, LD 40,000/day cap 1,200,000) EXECUTED."
            - "Two claims on E1, each claiming 0.05 MWh loss: C1 decided STRAIGHT_LINE, C2 decided OUTPUT_BASED with throughput 450 MWh."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Alpha BESS", market_application: "ENERGY_ARBITRAGE", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 20000000 }
              as: ProjectDeveloper
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "AHJ-TRP-1" }
              as: ProjectDeveloper
              captures: { perm1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "AHJ-FC-1" }
              as: ProjectDeveloper
              captures: { perm2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "AHJ-LA-1" }
              as: ProjectDeveloper
              captures: { perm3: $.data.id }
            - call: "POST /safety-permits/${perm1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${perm2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${perm3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /warranty-claims"
              payload: { esa_id: "${esa_id}", defect_type: "CELL_DEFECT", claimed_capacity_loss_mwh: 0.05 }
              as: WarrantyAdmin
              captures: { claim1: $.data.id }
            - call: "POST /warranty-claims"
              payload: { esa_id: "${esa_id}", defect_type: "CELL_DEFECT", claimed_capacity_loss_mwh: 0.05 }
              as: WarrantyAdmin
              captures: { claim2: $.data.id }
            - call: "POST /warranty-claims/${claim1}/start-review"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /warranty-claims/${claim2}/start-review"
              payload: {}
              as: WarrantyAdmin
          trigger:
            - call: "POST /warranty-claims/${claim1}/decide"
              payload: { decision: "APPROVED", credit_variant: "STRAIGHT_LINE" }
              as: WarrantyAdmin
              captures: { credit1: $.data.credit_amount_cents }
            - call: "POST /warranty-claims/${claim2}/decide"
              payload: { decision: "APPROVED", credit_variant: "OUTPUT_BASED", throughput_mwh: 450 }
              as: WarrantyAdmin
              captures: { credit2: $.data.credit_amount_cents }
          assert:
            - "WarrantyClaim.${claim1}.credit_amount_cents == 15000 (ceil(0.05 * 300000))"
            - "WarrantyClaim.${claim2}.credit_amount_cents == 712800 (0.05 * 450 * 0.88 * 300000 * 0.12)"
            - "credit1 != credit2 — identical claim inputs, divergent variants"

      - name: capacity_test_basis_split_poi_vs_nameplate
        grounds:
          - calculations.capacity_guarantee_evaluation
          - calculations.capacity_guarantee_evaluation.variants
          - entities.PerformanceTest.fields.evaluated_capacity_mwh
        distinguishing_aspect: |
          The SAME raw measurement (measured 39.0 MWh, aux 1.0 MWh) yields
          evaluated 38.0 (POI basis, ENERGY_ARBITRAGE) versus 39.0 (NAMEPLATE
          basis, FREQUENCY_REGULATION) — a dual-variant split in the capacity
          guarantee domain, not the warranty-credit domain of the sibling
          instance.
        test_recipe:
          setup:
            - "Project PA (ENERGY_ARBITRAGE, ONE_CYCLE_DAILY, 10 MW x 40 MWh) with executed ESA EA (guaranteed capacity 38.5)."
            - "Project PB (FREQUENCY_REGULATION, CONTINUOUS, 10 MW x 40 MWh) with executed ESA EB (guaranteed capacity 38.5)."
            - "Each project has a CAPACITY_TEST scheduled; clock inside both windows."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "POI Site", market_application: "ENERGY_ARBITRAGE", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 20000000 }
              as: ProjectDeveloper
              captures: { pa_id: $.data.id, pa_v: $.data.version }
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${pa_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38.5, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_a: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${pa_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T1" }
              as: ProjectDeveloper
              captures: { pa_p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${pa_id}", permit_type: "FIRE_CODE", authority_reference: "F1" }
              as: ProjectDeveloper
              captures: { pa_p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${pa_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L1" }
              as: ProjectDeveloper
              captures: { pa_p3: $.data.id }
            - call: "POST /safety-permits/${pa_p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${pa_p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${pa_p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /equipment-supply-agreements/${esa_a}/execute"
              payload: { expected_project_version: "${pa_v}" }
              as: ProjectDeveloper
            - call: "POST /projects"
              payload: { name: "Nameplate Site", market_application: "FREQUENCY_REGULATION", duty_cycle_profile: "CONTINUOUS", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 20000000 }
              as: ProjectDeveloper
              captures: { pb_id: $.data.id, pb_v: $.data.version }
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${pb_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38.5, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_b: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${pb_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T2" }
              as: ProjectDeveloper
              captures: { pb_p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${pb_id}", permit_type: "FIRE_CODE", authority_reference: "F2" }
              as: ProjectDeveloper
              captures: { pb_p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${pb_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L2" }
              as: ProjectDeveloper
              captures: { pb_p3: $.data.id }
            - call: "POST /safety-permits/${pb_p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${pb_p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${pb_p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /equipment-supply-agreements/${esa_b}/execute"
              payload: { expected_project_version: "${pb_v}" }
              as: ProjectDeveloper
            - call: "POST /performance-tests"
              payload: { project_id: "${pa_id}", test_type: "CAPACITY_TEST", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: PerformanceEngineer
              captures: { test_a: $.data.id }
            - call: "POST /performance-tests"
              payload: { project_id: "${pb_id}", test_type: "CAPACITY_TEST", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: PerformanceEngineer
              captures: { test_b: $.data.id }
          trigger:
            - call: "POST /performance-tests/${test_a}/record-results"
              payload: { measured_capacity_mwh: 39.0, aux_load_mwh: 1.0 }
              as: PerformanceEngineer
            - call: "POST /performance-tests/${test_b}/record-results"
              payload: { measured_capacity_mwh: 39.0, aux_load_mwh: 1.0 }
              as: PerformanceEngineer
          assert:
            - "PerformanceTest.${test_a}.measurement_basis == POI and evaluated_capacity_mwh == 38.0"
            - "PerformanceTest.${test_b}.measurement_basis == NAMEPLATE and evaluated_capacity_mwh == 39.0"
            - "PerformanceTest.${test_a}.result == FAIL (38.0 < 38.5) while PerformanceTest.${test_b}.result == PASS (39.0 >= 38.5) — same raw data, divergent verdicts"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: augmentation_requirement_multi_input_forward_projection
        grounds:
          - calculations.augmentation_requirement
          - calculations.augmentation_requirement.constants
          - entities.Project.fields.projected_capacity_mwh
        distinguishing_aspect: |
          Mode (a): the projection combines >= 3 inputs with non-linear
          interaction — market-application x duty-cycle degradation-rate table
          lookup, a sum over EXECUTED augmentations, and a nested max(0, proj-80)
          penalty keyed on the EXECUTED count. Distinct from the sibling
          instance's mode (c) pinned evaluation order.
        test_recipe:
          setup:
            - "Project P (ENERGY_ARBITRAGE, ONE_CYCLE_DAILY, 10 MW x 40 MWh), ESA executed, COMMISSIONING milestone achieved -> commissioned_capacity_mwh = 40."
            - "One MANUAL augmentation of 2 MWh EXECUTED."
            - "equivalent_cycles set to 600 via recompute-projection."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Aug Site", market_application: "ENERGY_ARBITRAGE", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 20000000 }
              as: ProjectDeveloper
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "COMMISSIONING", planned_date: "2026-11-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { com_id: $.data.id }
            - call: "POST /delivery-milestones/${com_id}/record-outcome"
              payload: { outcome: "ACHIEVED", actual_date: "2026-10-20T00:00:00Z" }
              as: ProjectDeveloper
            - call: "POST /augmentation-events"
              payload: { project_id: "${proj_id}", planned_window_start: "2026-09-01T00:00:00Z", planned_window_end: "2026-10-01T00:00:00Z", added_capacity_mwh: 2 }
              as: ServiceEngineer
              captures: { aug_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { proj_v2: $.data.version }
            - call: "POST /augmentation-events/${aug_id}/execute"
              payload: { expected_project_version: "${proj_v2}" }
              as: ServiceEngineer
          trigger:
            - call: "POST /projects/${proj_id}/recompute-projection"
              payload: { equivalent_cycles: 600 }
              as: PerformanceEngineer
          assert:
            - "Project.${proj_id}.projected_capacity_mwh == 41.64 (40 + 2 - 600*0.0006 - 0 penalty since 41.64 < 80 floor)"
            - "Project.${proj_id}.equivalent_cycles == 600"
            - "Project.${proj_id}.augmentation_count == 1 (EXECUTED only)"

      - name: warranty_output_based_pinned_evaluation_order
        grounds:
          - calculations.warranty_credit
          - entities.EquipmentSupplyAgreement.fields.guaranteed_rte_pct
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency — the OUTPUT_BASED credit uses
          degradation_rate = 1 - guaranteed_rte_pct, and guaranteed_rte_pct is
          itself the pass threshold of rte_evaluation; the scaffold pins exact
          arithmetic with a single final round so reordering the factors cannot
          drift the cents. Distinct mode from the sibling's mode (a).
        test_recipe:
          setup:
            - "Project P (ENERGY_ARBITRAGE, ONE_CYCLE_DAILY, 10 MW x 40 MWh), ESA executed with rte 0.88 and price 300,000/MWh."
            - "Claim UNDER_REVIEW claiming 0.05 MWh loss."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Order Site", market_application: "ENERGY_ARBITRAGE", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 20000000 }
              as: ProjectDeveloper
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /warranty-claims"
              payload: { esa_id: "${esa_id}", defect_type: "CAPACITY_SHORTFALL", claimed_capacity_loss_mwh: 0.05 }
              as: WarrantyAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /warranty-claims/${claim_id}/start-review"
              payload: {}
              as: WarrantyAdmin
          trigger:
            - call: "POST /warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVED", credit_variant: "OUTPUT_BASED", throughput_mwh: 450 }
              as: WarrantyAdmin
          assert:
            - "WarrantyClaim.${claim_id}.credit_amount_cents == 712800 exactly — the five-factor product evaluated in exact arithmetic and rounded once"
            - "WarrantyClaim.${claim_id}.status == APPROVED and decided_at equals the logical clock"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: safety_permit_reject_resubmit_cycle
        grounds:
          - state_machines.SafetyPermit.SUBMITTED_to_REJECTED
          - state_machines.SafetyPermit.REJECTED_to_SUBMITTED
          - state_machines.SafetyPermit.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          SafetyPermit is cyclic (SUBMITTED -> REJECTED -> SUBMITTED -> APPROVED);
          the loop is unbounded and decided_at re-stamps per decision. This is a
          cycle on the permit entity — distinct from the LTSA suspend/reactivate
          cycle of the sibling instance.
        test_recipe:
          setup:
            - "Project exists; one THERMAL_RUNAWAY_PLAN permit created (SUBMITTED)."
          setup_api_calls:
            - &mk_proj
              call: "POST /projects"
              payload: { name: "Cycle Site", market_application: "ENERGY_ARBITRAGE", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 20000000 }
              as: ProjectDeveloper
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - &mk_p1
              call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "REJECTED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p1}/resubmit"
              payload: {}
              as: ProjectDeveloper
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "REJECTED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p1}/resubmit"
              payload: {}
              as: ProjectDeveloper
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
          assert:
            - "SafetyPermit.${p1}.status == APPROVED after two full reject-resubmit loops"
            - "decide on the APPROVED permit would be rejected with ERR_PERMIT_NOT_PENDING (terminal lockdown)"

      - name: ltsa_suspend_reactivate_cycle
        grounds:
          - state_machines.ServiceAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ServiceAgreement.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          ServiceAgreement cycles ACTIVE -> SUSPENDED -> ACTIVE repeatedly within
          its term; credit_pool_cents is computed ONCE at first activation and is
          not recomputed on reactivation. Cycle on the LTSA entity, distinct from
          the permit cycle.
        test_recipe:
          setup:
            - "Project exists; LTSA (fee 2,000,000; term 2026-08-01..2027-08-01) created in DRAFT; clock at the 2026-09-01 default (inside term)."
          setup_api_calls:
            - *mk_proj
            - call: "POST /service-agreements"
              payload: { project_id: "${proj_id}", annual_fee_cents: 2000000, covers_monitoring: true, covers_maintenance: true, covers_spare_parts: true, covers_software_updates: true, start_date: "2026-08-01T00:00:00Z", end_date: "2027-08-01T00:00:00Z" }
              as: ServiceManager
              captures: { ltsa_id: $.data.id }
          trigger:
            - call: "POST /service-agreements/${ltsa_id}/activate"
              payload: {}
              as: ServiceManager
              captures: { pool_first: $.data.credit_pool_cents }
            - call: "POST /service-agreements/${ltsa_id}/suspend"
              payload: {}
              as: ServiceManager
            - call: "POST /service-agreements/${ltsa_id}/reactivate"
              payload: {}
              as: ServiceManager
              captures: { pool_second: $.data.credit_pool_cents }
            - call: "POST /service-agreements/${ltsa_id}/suspend"
              payload: {}
              as: ServiceManager
            - call: "POST /service-agreements/${ltsa_id}/reactivate"
              payload: {}
              as: ServiceManager
          assert:
            - "ServiceAgreement.${ltsa_id}.status == ACTIVE after two suspend/reactivate loops"
            - "credit_pool_cents == 600000 on first activation (floor(2000000 * 0.30)) and is unchanged after reactivation (pool_first == pool_second)"
            - "activated_at remains the first activation timestamp"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: missed_milestone_ld_cap_terminates_esa_and_cascades
        grounds:
          - state_machines.DeliveryMilestone.SCHEDULED_to_MISSED
          - state_machines.EquipmentSupplyAgreement.EXECUTED_to_TERMINATED
          - state_machines.WarrantyClaim.SUBMITTED_to_REJECTED
          - calculations.liquidated_damages
        distinguishing_aspect: |
          Depth-4 chain from a milestone outcome: record-outcome MISSED accrues
          LD on the ESA; the accrual reaching ld_cap_cents itself flips the ESA
          to TERMINATED; termination cascades to remaining SCHEDULED milestones
          (CANCELLED) and to open WarrantyClaims (REJECTED) and their ORDERED
          SparePartOrders (CANCELLED with credit restore). Trigger: milestone
          outcome — distinct from the sibling's clock-driven LTSA expiry.
        test_recipe:
          setup:
            - "Project P (EA, ONE_CYCLE_DAILY, 10 MW x 40 MWh, budget 20,000,000); permits approved; ESA executed (40 MWh @ 300,000; LD 40,000/day; cap 1,200,000)."
            - "Milestones: M1 DELIVERY planned 2026-10-01; M2 DELIVERY planned 2026-10-05; M3 COMMISSIONING planned 2026-11-01 (stays SCHEDULED)."
            - "Warranty claim C on the ESA, SUBMITTED."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Cascade Site", market_application: "ENERGY_ARBITRAGE", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 20000000 }
              as: ProjectDeveloper
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - &mk_esa
              call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - *mk_p1
            - &mk_p2
              call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - &mk_p3
              call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - &ap_p1
              call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - &ap_p2
              call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - &ap_p3
              call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - &exec_esa
              call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "DELIVERY", planned_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m1: $.data.id }
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "DELIVERY", planned_date: "2026-10-05T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m2: $.data.id }
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "COMMISSIONING", planned_date: "2026-11-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m3: $.data.id }
            - call: "POST /warranty-claims"
              payload: { esa_id: "${esa_id}", defect_type: "BMS_FAULT", claimed_capacity_loss_mwh: 0.5 }
              as: WarrantyAdmin
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /delivery-milestones/${m1}/record-outcome"
              payload: { outcome: "MISSED", actual_date: "2026-10-21T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m1_ld: $.data.ld_applied_cents }
            - call: "POST /delivery-milestones/${m2}/record-outcome"
              payload: { outcome: "MISSED", actual_date: "2026-10-20T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m2_ld: $.data.ld_applied_cents }
          assert:
            - "DeliveryMilestone.${m1}.days_late == 20 and ld_applied_cents == 800000 (20 * 40000)"
            - "DeliveryMilestone.${m2}.days_late == 15 but ld_applied_cents == 400000 — headroom min(15, floor((1200000-800000)/40000)) = 10 effective days"
            - "EquipmentSupplyAgreement.${esa_id}.accrued_ld_cents == 1200000 == ld_cap_cents, so status == TERMINATED (auto-transition)"
            - "EquipmentSupplyAgreement.${esa_id}.net_ld_due_cents == 1200000"
            - "DeliveryMilestone.${m3}.status == CANCELLED (cascade from termination)"
            - "WarrantyClaim.${claim_id}.status == REJECTED (cascade depth 2: outcome -> ESA -> claim)"

      - name: ltsa_lazy_expiry_cancels_orders_and_restores_credit
        grounds:
          - state_machines.ServiceAgreement.ACTIVE_to_EXPIRED
          - state_machines.SparePartOrder.SHIPPED_to_CANCELLED
          - calculations.spare_parts_credit
        distinguishing_aspect: |
          Depth-3 chain from the logical clock: a read of an ACTIVE LTSA whose
          end_date has passed flips it EXPIRED; expiry cascades to a SHIPPED
          SparePartOrder (CANCELLED); the cancellation itself restores
          credit_drawn_cents. Trigger: clock advance + read — distinct from the
          milestone-outcome trigger of the sibling instance.
        test_recipe:
          setup:
            - "Project exists; LTSA ACTIVE (fee 2,000,000 -> pool 600,000; term 2026-08-01..2026-09-20)."
            - "SparePartOrder O1 cost 400,000, covered_by_credit, moved ORDERED -> SHIPPED; credit_drawn_cents == 400,000."
          setup_api_calls:
            - *mk_proj
            - call: "POST /service-agreements"
              payload: { project_id: "${proj_id}", annual_fee_cents: 2000000, covers_monitoring: true, covers_maintenance: true, covers_spare_parts: true, covers_software_updates: false, start_date: "2026-08-01T00:00:00Z", end_date: "2026-09-20T00:00:00Z" }
              as: ServiceManager
              captures: { ltsa_id: $.data.id, ltsa_v: $.data.version }
            - call: "POST /service-agreements/${ltsa_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
              captures: { ltsa_v2: $.data.version }
            - call: "POST /spare-part-orders"
              payload: { service_agreement_id: "${ltsa_id}", part_description: "HVAC module", part_cost_cents: 400000, expected_service_agreement_version: "${ltsa_v2}" }
              as: ServiceManager
              captures: { order_id: $.data.id }
            - call: "POST /spare-part-orders/${order_id}/ship"
              payload: {}
              as: ServiceEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
          assert:
            - "ServiceAgreement.${ltsa_id}.status == EXPIRED (lazy expiry on read past end_date 2026-09-20)"
            - "SparePartOrder.${order_id}.status == CANCELLED (cascade on expiry)"
            - "ServiceAgreement.${ltsa_id}.credit_drawn_cents == 0 — the 400000 draw was restored by the cascade (compensation link)"
            - "ServiceAgreement.${ltsa_id}.credit_pool_cents == 600000 (pool is historical, not zeroed)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sizing_constraint_beats_budget_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors.ERR_SIZING_INVALID
          - errors.ERR_BUDGET_EXCEEDED
        distinguishing_aspect: |
          business_constraint (priority 7, ERR_SIZING_INVALID) vs business_fiscal
          (priority 9, ERR_BUDGET_EXCEEDED): a single ESA-execute request violates
          both — the sizing error MUST win because constraint precedes fiscal.
        test_recipe:
          setup:
            - "Project P: CAPACITY_FIRMING, ONE_CYCLE_DAILY, 11 MW x 33 MWh (duration 3.00 < 4.00 -> sizing INVALID); budget 5,000,000."
            - "ESA E: contracted 40 MWh, guaranteed 30 (<= rated 33), price 300,000 -> total 12,000,000 > budget."
            - "All three permits APPROVED (so priority 5 passes and the 7-vs-9 duel is exposed)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Firming Site", market_application: "CAPACITY_FIRMING", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 11, rated_energy_mwh: 33, budget_cents: 5000000 }
              as: ProjectDeveloper
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 30, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - *mk_p1
            - *mk_p2
            - *mk_p3
            - *ap_p1
            - *ap_p2
            - *ap_p3
          trigger:
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
              captures: { error_id: $.data.error_id }
          assert:
            - "Project.${proj_id}.sizing_status == INVALID (duration 3.00 < 4.00 for CAPACITY_FIRMING)"
            - "the response status is 409 and error_id == ERR_SIZING_INVALID — priority 7 constraint beats priority 9 ERR_BUDGET_EXCEEDED (402) even though total_price_cents 12000000 > budget_cents 5000000"
            - "EquipmentSupplyAgreement.${esa_id}.status == DRAFT (no partial execution)"

      - name: role_authz_beats_permit_state
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors.ERR_INSUFFICIENT_PERMISSIONS
          - errors.ERR_PERMIT_NOT_PENDING
        distinguishing_aspect: |
          auth (priority 2, ERR_INSUFFICIENT_PERMISSIONS) vs state (priority 4,
          ERR_PERMIT_NOT_PENDING): a ProjectDeveloper deciding an
          already-APPROVED permit violates both — the 403 MUST win because
          authorization is checked before any state machine is consulted.
          Different category pair from the sibling's constraint-vs-fiscal duel.
        test_recipe:
          setup:
            - "Project exists; permit p1 already APPROVED by SafetyAuthority."
          setup_api_calls:
            - *mk_proj
            - *mk_p1
            - *ap_p1
          trigger:
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "REJECTED" }
              as: ProjectDeveloper
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS — priority 2 authz beats priority 4 ERR_PERMIT_NOT_PENDING (409) even though the permit is in APPROVED, a state where decide is invalid"
            - "SafetyPermit.${p1}.status == APPROVED (unchanged)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_test_passes_at_exact_guarantee_boundary
        grounds:
          - calculations.capacity_guarantee_evaluation
          - entities.PerformanceTest.fields.result
        distinguishing_aspect: |
          Inclusive numeric threshold: evaluated capacity exactly equal to
          guaranteed_capacity_mwh (38.00 == 38.00) PASSES, while 37.99 FAILS.
          Metric: capacity MWh on the record-results endpoint — distinct from
          the sibling's zero-remaining-credit boundary on spare-part orders.
        test_recipe:
          setup:
            - "Project P (EA, ONE_CYCLE_DAILY, 10 MW x 40 MWh); permits approved; ESA executed with guaranteed_capacity_mwh 38.00."
            - "Two adjacent, non-overlapping capacity tests T1 [09-01, 09-15) and T2 [09-15, 10-01); clock advanced into each window when its results are recorded."
          setup_api_calls:
            - *mk_proj
            - *mk_esa
            - *mk_p1
            - *mk_p2
            - *mk_p3
            - *ap_p1
            - *ap_p2
            - *ap_p3
            - *exec_esa
            - call: "POST /performance-tests"
              payload: { project_id: "${proj_id}", test_type: "CAPACITY_TEST", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: PerformanceEngineer
              captures: { t1: $.data.id }
            - call: "POST /performance-tests"
              payload: { project_id: "${proj_id}", test_type: "CAPACITY_TEST", window_start: "2026-09-15T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: PerformanceEngineer
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /performance-tests/${t1}/record-results"
              payload: { measured_capacity_mwh: 39.0, aux_load_mwh: 1.0 }
              as: PerformanceEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /performance-tests/${t2}/record-results"
              payload: { measured_capacity_mwh: 38.99, aux_load_mwh: 1.0 }
              as: PerformanceEngineer
          assert:
            - "PerformanceTest.${t1}.evaluated_capacity_mwh == 38.0 and result == PASS and status == PASSED — equality with the 38.00 guarantee passes (inclusive >=)"
            - "PerformanceTest.${t2}.evaluated_capacity_mwh == 37.99 and result == FAIL and status == FAILED — one centi-MWh below fails"
            - "an AUTO AugmentationEvent exists for the project covering the 38.00 - projected shortfall after T2"

      - name: credit_pool_exhausted_at_zero_remaining
        grounds:
          - calculations.spare_parts_credit
          - errors.ERR_CREDIT_POOL_EXHAUSTED
        distinguishing_aspect: |
          Zero-quantity boundary on a different metric (integer cents) via a
          different endpoint (POST /spare-part-orders): drawing exactly the
          remaining pool (600,000 == 600,000) SUCCEEDS, and the next order of
          even 1 cent FAILS with ERR_CREDIT_POOL_EXHAUSTED — no partial coverage.
        test_recipe:
          setup:
            - "Project exists; LTSA ACTIVE (fee 2,000,000 -> pool 600,000, covers_spare_parts true, term spanning the clock)."
          setup_api_calls:
            - *mk_proj
            - call: "POST /service-agreements"
              payload: { project_id: "${proj_id}", annual_fee_cents: 2000000, covers_monitoring: true, covers_maintenance: true, covers_spare_parts: true, covers_software_updates: true, start_date: "2026-08-01T00:00:00Z", end_date: "2027-08-01T00:00:00Z" }
              as: ServiceManager
              captures: { ltsa_id: $.data.id }
            - call: "POST /service-agreements/${ltsa_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
              captures: { ltsa_v: $.data.version }
          trigger:
            - call: "POST /spare-part-orders"
              payload: { service_agreement_id: "${ltsa_id}", part_description: "Full bank of cells", part_cost_cents: 600000, expected_service_agreement_version: "${ltsa_v}" }
              as: ServiceManager
              captures: { order_id: $.data.id }
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
              captures: { ltsa_v2: $.data.version }
            - call: "POST /spare-part-orders"
              payload: { service_agreement_id: "${ltsa_id}", part_description: "One fuse", part_cost_cents: 1, expected_service_agreement_version: "${ltsa_v2}" }
              as: ServiceManager
              captures: { error_id: $.data.error_id }
          assert:
            - "SparePartOrder.${order_id}.covered_by_credit == true and ServiceAgreement.${ltsa_id}.credit_drawn_cents == 600000 — drawing the exact remaining pool succeeds"
            - "the 1-cent order fails with 402 error_id == ERR_CREDIT_POOL_EXHAUSTED — remaining pool 0, no partial coverage"
            - "ServiceAgreement.${ltsa_id}.credit_pool_cents == 600000 (pool unchanged by the rejection)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: esa_execute_gated_by_three_permit_approvals
        grounds:
          - state_machines.EquipmentSupplyAgreement.DRAFT_to_EXECUTED
          - entities.SafetyPermit.fields.status
          - errors.ERR_PERMIT_MISSING_OR_UNAPPROVED
        distinguishing_aspect: |
          EquipmentSupplyAgreement -> SafetyPermit pair: ESA execute is blocked
          until ALL THREE permit types on the Project are APPROVED; two of three
          approved still fails. Different entity pair from the sibling's
          SparePartOrder -> WarrantyClaim gate.
        test_recipe:
          setup:
            - "Project P (EA, sizing VALID, budget 20,000,000); ESA E (total 12,000,000 <= budget, guaranteed 38 <= rated 40)."
            - "THERMAL_RUNAWAY_PLAN and FIRE_CODE APPROVED; LOCAL_APPROVAL still SUBMITTED."
          setup_api_calls:
            - *mk_proj
            - *mk_esa
            - *mk_p1
            - *mk_p2
            - *mk_p3
            - *ap_p1
            - *ap_p2
          trigger:
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PERMIT_MISSING_OR_UNAPPROVED — LOCAL_APPROVAL is SUBMITTED, not APPROVED"
            - "EquipmentSupplyAgreement.${esa_id}.status == DRAFT"
            - "after POST /safety-permits/${p3}/decide APPROVED, a retry of execute succeeds (gate lifts when all three types are APPROVED)"

      - name: install_gated_by_warranty_claim_approved
        grounds:
          - state_machines.SparePartOrder.DELIVERED_to_INSTALLED
          - state_machines.WarrantyClaim.APPROVED_to_FULFILLED
          - errors.ERR_CLAIM_NOT_FULFILLABLE
        distinguishing_aspect: |
          SparePartOrder -> WarrantyClaim pair: installing a claim-linked order
          requires the claim in APPROVED, and a successful install itself drives
          the claim to FULFILLED — a bidirectional dependency distinct from the
          sibling's permit gate.
        test_recipe:
          setup:
            - "Project P; permits approved; ESA executed."
            - "LTSA ACTIVE covering spare parts (pool 600,000); claim C UNDER_REVIEW (not yet APPROVED)."
            - "Order O linked to C, moved ORDERED -> SHIPPED -> DELIVERED."
          setup_api_calls:
            - *mk_proj
            - *mk_esa
            - *mk_p1
            - *mk_p2
            - *mk_p3
            - *ap_p1
            - *ap_p2
            - *ap_p3
            - *exec_esa
            - call: "POST /service-agreements"
              payload: { project_id: "${proj_id}", annual_fee_cents: 2000000, covers_monitoring: true, covers_maintenance: true, covers_spare_parts: true, covers_software_updates: true, start_date: "2026-08-01T00:00:00Z", end_date: "2027-08-01T00:00:00Z" }
              as: ServiceManager
              captures: { ltsa_id: $.data.id }
            - call: "POST /service-agreements/${ltsa_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /warranty-claims"
              payload: { esa_id: "${esa_id}", defect_type: "CELL_DEFECT", claimed_capacity_loss_mwh: 0.05 }
              as: WarrantyAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /warranty-claims/${claim_id}/start-review"
              payload: {}
              as: WarrantyAdmin
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
              captures: { ltsa_v: $.data.version }
            - call: "POST /spare-part-orders"
              payload: { service_agreement_id: "${ltsa_id}", warranty_claim_id: "${claim_id}", part_description: "Replacement cells", part_cost_cents: 100000, expected_service_agreement_version: "${ltsa_v}" }
              as: ServiceEngineer
              captures: { order_id: $.data.id }
            - call: "POST /spare-part-orders/${order_id}/ship"
              payload: {}
              as: ServiceEngineer
            - call: "POST /spare-part-orders/${order_id}/deliver"
              payload: {}
              as: ServiceEngineer
          trigger:
            - call: "POST /spare-part-orders/${order_id}/install"
              payload: {}
              as: ServiceEngineer
              captures: { error_id: $.data.error_id }
            - call: "POST /warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVED", credit_variant: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /spare-part-orders/${order_id}/install"
              payload: {}
              as: ServiceEngineer
          assert:
            - "first install attempt: 409 error_id == ERR_CLAIM_NOT_FULFILLABLE — claim is UNDER_REVIEW, not APPROVED"
            - "after the claim is APPROVED, install succeeds: SparePartOrder.${order_id}.status == INSTALLED"
            - "WarrantyClaim.${claim_id}.status == FULFILLED (system transition driven by the install)"
            - "WarrantyClaim.${claim_id}.credit_amount_cents == 15000 (STRAIGHT_LINE ceil(0.05 * 300000))"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: performance_test_windows_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors.ERR_TEST_WINDOW_OVERLAP
          - entities.PerformanceTest.fields.window_start
        distinguishing_aspect: |
          Half-open interval semantics on PerformanceTest: an existing window
          [09-01, 09-10) rejects a new [09-05, 09-12) and even [09-01, 09-02),
          but ACCEPTS the exactly-adjacent [09-10, 09-20) — gap 0 at the
          boundary is not an overlap. Resource: the project's test calendar.
        test_recipe:
          setup:
            - "Project P with executed ESA; one CAPACITY_TEST occupying [2026-09-01, 2026-09-10)."
          setup_api_calls:
            - *mk_proj
            - *mk_esa
            - *mk_p1
            - *mk_p2
            - *mk_p3
            - *ap_p1
            - *ap_p2
            - *ap_p3
            - *exec_esa
            - call: "POST /performance-tests"
              payload: { project_id: "${proj_id}", test_type: "CAPACITY_TEST", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: PerformanceEngineer
              captures: { t0: $.data.id }
          trigger:
            - call: "POST /performance-tests"
              payload: { project_id: "${proj_id}", test_type: "RTE_TEST", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-12T00:00:00Z" }
              as: PerformanceEngineer
              captures: { err_overlap: $.data.error_id }
            - call: "POST /performance-tests"
              payload: { project_id: "${proj_id}", test_type: "CAPACITY_TEST", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z" }
              as: PerformanceEngineer
              captures: { t1: $.data.id }
          assert:
            - "the [09-05, 09-12) RTE_TEST is rejected: 409 error_id == ERR_TEST_WINDOW_OVERLAP (cross-type overlap counts — same project calendar)"
            - "the [09-10, 09-20) CAPACITY_TEST is accepted: 201, PerformanceTest.${t1}.status == SCHEDULED — adjacency at the boundary is allowed"
            - "GET /performance-tests?project_id=${proj_id} returns exactly 2 tests"

      - name: bid_session_windows_survive_only_when_open_or_cleared
        grounds:
          - validations[priority=7]
          - errors.ERR_BID_WINDOW_OVERLAP
          - entities.BidSession.fields.status
        distinguishing_aspect: |
          Different interval semantics on a different resource: BidSession
          overlap counts only sessions in OPEN or CLEARED status, so a session
          whose window overlaps a CANCELLED predecessor is accepted — status
          filtering is part of the interval rule, unlike the performance-test
          calendar which only excludes CANCELLED tests but also counts
          already-decided PASSED/FAILED windows.
        test_recipe:
          setup:
            - "Project P with executed ESA (capacity basis for dispatch: commissioned 40 via an achieved commissioning milestone is not required; projected defaults to commissioned + 0 = 0 until a milestone is achieved — the overlap rule is status-driven and independent of capacity)."
          setup_api_calls:
            - *mk_proj
            - *mk_esa
            - *mk_p1
            - *mk_p2
            - *mk_p3
            - *ap_p1
            - *ap_p2
            - *ap_p3
            - *exec_esa
            - call: "POST /bid-sessions"
              payload: { project_id: "${proj_id}", market: "DAY_AHEAD", window_start: "2026-09-02T00:00:00Z", window_end: "2026-09-02T04:00:00Z", offer_mwh: 20, offer_price_cents_per_mwh: 9000 }
              as: MarketOperator
              captures: { bs1: $.data.id }
          trigger:
            - call: "POST /bid-sessions"
              payload: { project_id: "${proj_id}", market: "REAL_TIME", window_start: "2026-09-02T02:00:00Z", window_end: "2026-09-02T06:00:00Z", offer_mwh: 10, offer_price_cents_per_mwh: 9500 }
              as: MarketOperator
              captures: { err_overlap: $.data.error_id }
            - call: "POST /bid-sessions/${bs1}/cancel"
              payload: {}
              as: MarketOperator
            - call: "POST /bid-sessions"
              payload: { project_id: "${proj_id}", market: "REAL_TIME", window_start: "2026-09-02T02:00:00Z", window_end: "2026-09-02T06:00:00Z", offer_mwh: 10, offer_price_cents_per_mwh: 9500 }
              as: MarketOperator
              captures: { bs2: $.data.id }
          assert:
            - "while ${bs1} is OPEN, the overlapping [02:00, 06:00) session is rejected: 409 error_id == ERR_BID_WINDOW_OVERLAP"
            - "after ${bs1} is CANCELLED, the same overlapping session is accepted: 201, BidSession.${bs2}.status == OPEN"
            - "BidSession.${bs1}.status == CANCELLED (cancel of OPEN succeeds)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_pool_conserved_through_draw_and_cancel
        grounds:
          - calculations.spare_parts_credit
          - state_machines.SparePartOrder.ORDERED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: LTSA credit dollars. For any draw/cancel sequence,
          credit_drawn_cents == sum(part_cost_cents over non-CANCELLED covered
          orders) — order then cancel returns the ledger to exact parity.
          Different quantity from the sibling's LD ledger.
        test_recipe:
          setup:
            - "Project exists; LTSA ACTIVE (fee 2,000,000 -> pool 600,000, covers_spare_parts, term spans the clock)."
          setup_api_calls:
            - *mk_proj
            - call: "POST /service-agreements"
              payload: { project_id: "${proj_id}", annual_fee_cents: 2000000, covers_monitoring: true, covers_maintenance: true, covers_spare_parts: true, covers_software_updates: true, start_date: "2026-08-01T00:00:00Z", end_date: "2027-08-01T00:00:00Z" }
              as: ServiceManager
              captures: { ltsa_id: $.data.id }
            - call: "POST /service-agreements/${ltsa_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
              captures: { ltsa_v: $.data.version }
          trigger:
            - call: "POST /spare-part-orders"
              payload: { service_agreement_id: "${ltsa_id}", part_description: "Inverter fan", part_cost_cents: 200000, expected_service_agreement_version: "${ltsa_v}" }
              as: ServiceManager
              captures: { order_id: $.data.id }
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
              captures: { drawn_after_order: $.data.credit_drawn_cents }
            - call: "POST /spare-part-orders/${order_id}/cancel"
              payload: {}
              as: ServiceManager
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
              captures: { drawn_after_cancel: $.data.credit_drawn_cents }
          assert:
            - "drawn_after_order == 200000 (the draw moved credit_drawn_cents 0 -> 200000)"
            - "drawn_after_cancel == 0 — order+cancel is compensating; invariant credit_pool == drawn + available holds at 600000 == 0 + 600000"
            - "SparePartOrder.${order_id}.covered_by_credit == true and status == CANCELLED"

      - name: ld_ledger_conserved_through_accrue_and_waive
        grounds:
          - calculations.liquidated_damages
          - entities.EquipmentSupplyAgreement.fields.net_ld_due_cents
        distinguishing_aspect: |
          Conserved quantity: LD dollars. net_ld_due_cents == accrued_ld_cents
          - waived_ld_cents at all times; waiving never exceeds the outstanding
          balance and a waive after full accrual reduces net to exactly 0.
          Different conserved quantity (money owed, not credit available) from
          the sibling.
        test_recipe:
          setup:
            - "Project P; permits approved; ESA executed (LD 40,000/day, cap 1,200,000)."
            - "Milestone M1 DELIVERY planned 2026-10-01 recorded MISSED 2026-10-21 (20 days -> 800,000 accrued)."
          setup_api_calls:
            - *mk_proj
            - *mk_esa
            - *mk_p1
            - *mk_p2
            - *mk_p3
            - *ap_p1
            - *ap_p2
            - *ap_p3
            - *exec_esa
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "DELIVERY", planned_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m1: $.data.id }
            - call: "POST /delivery-milestones/${m1}/record-outcome"
              payload: { outcome: "MISSED", actual_date: "2026-10-21T00:00:00Z" }
              as: ProjectDeveloper
          trigger:
            - call: "POST /equipment-supply-agreements/${esa_id}/waive-ld"
              payload: { amount_cents: 800001 }
              as: ProjectDeveloper
              captures: { err_over: $.data.error_id }
            - call: "POST /equipment-supply-agreements/${esa_id}/waive-ld"
              payload: { amount_cents: 800000 }
              as: ProjectDeveloper
          assert:
            - "the 800,001 waive is rejected: 402 error_id == ERR_WAIVER_EXCEEDS_ACCRUED — waiver can never exceed accrued - waived"
            - "after waiving 800,000: accrued_ld_cents == 800000, waived_ld_cents == 800000, net_ld_due_cents == 0 — the invariant net == accrued - waived holds exactly"
            - "EquipmentSupplyAgreement.${esa_id}.status == EXECUTED (waiver does not change lifecycle state; 800000 < cap 1200000 so no termination)"
