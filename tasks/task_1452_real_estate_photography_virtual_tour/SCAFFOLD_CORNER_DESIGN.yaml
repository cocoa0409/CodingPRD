              captures: { b1: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-S2", market_id: "${mkt}", property_address: "2 Ok St", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-02T12:00:00Z" }
              as: ClientAgent
