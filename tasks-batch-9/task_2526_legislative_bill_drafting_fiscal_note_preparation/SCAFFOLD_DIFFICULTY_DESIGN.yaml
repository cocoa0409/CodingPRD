  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: bill_introduction_zero_versus_one_cent_appropriation_decides_fiscal_note_obligation
        grounds:
          - state_machines.Bill.null_to_INTRODUCED
          - entities.Bill.fields.fiscal_status
          - entities.DraftingRequest.fields.appropriation_requested_cents
          - endpoints.POST_bills
        distinguishing_aspect: |
          Metric: the requested appropriation in cents, tested at the zero-quantity
          edge on POST /bills. appropriation_requested_cents == 0 introduces a bill
          with fiscal_status NOT_REQUIRED; a single cent (== 1) introduces one with
          NOTE_PENDING. The whole fiscal-note workflow hinges on a one-cent
          difference. Endpoint: POST /bills.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; CONVENED session; one member, one drafter (max_concurrent_engagements 2), one senior review counsel."
