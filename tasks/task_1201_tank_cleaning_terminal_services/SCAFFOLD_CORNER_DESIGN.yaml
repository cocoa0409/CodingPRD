# =============================================================================
# Task 1201: Tank Cleaning & Terminal Services — §1.9 Scaffold Corner Design
# Breadth coverage of non-Difficulty testable claims per claim-extraction-guide.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: terminal_creation_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.Terminal.fields.safety_score_threshold"
          - "entities.Terminal.fields.score_variant"
          - "entities.Terminal.fields.mass_balance_tolerance_pct"
        distinguishing_aspect: "Omitting optional config yields defaults 85.0 / ROLLING_12MO / 2.0."
        test_recipe:
          setup: ["empty DB, clock default"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
          trigger:
            - call: "POST /ops/terminals"
              payload: { name: "Defaults Terminal", wastewater_daily_capacity_liters: 50000 }
              as: TerminalAdmin
              captures: { cd_term: $.data.id, cd_thr: $.data.safety_score_threshold, cd_var: $.data.score_variant, cd_tol: $.data.mass_balance_tolerance_pct }
          assert:
            - "cd_thr == 85.0 and cd_var == ROLLING_12MO and cd_tol == 2.0"
            - "Terminal.${cd_term}.version == 1 and created_at == 2026-05-01T00:00:00Z (logical clock default date)"
      - name: terminal_missing_required_capacity_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - "entities.Terminal.fields.wastewater_daily_capacity_liters"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Required input omitted -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ops/terminals"
              payload: { name: "NoCap" }
              as: TerminalAdmin
              captures: { cd_err1: $.data.error_id }
          assert:
            - "cd_err1 == ERR_INVALID_REQUEST"
      - name: product_invalid_enum_family_rejected
        claim_type: type_constraint
        grounds:
          - "entities.Product.fields.family"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "family outside the declared enum is rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ops/products"
              payload: { code: "KER01", family: "KEROSENE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: 38 }
              as: TerminalAdmin
              captures: { cd_err2: $.data.error_id }
          assert:
            - "cd_err2 == ERR_INVALID_REQUEST"
      - name: tank_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "endpoints"
        distinguishing_aspect: "GET on a random UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ops/tanks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TerminalOperator
              captures: { cd_err3: $.data.error_id }
          assert:
            - "cd_err3 == ERR_NOT_FOUND"
      - name: cleaning_job_terminal_tank_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "entities.CleaningJob.fields.terminal_id"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "terminal_id that does not match the tank's terminal is a 400, not a 404."
        test_recipe:
          setup: ["two terminals; tank under terminal A; contractor; products"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "A", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { cd_term_a: $.data.id }
            - call: "POST /ops/terminals"
              payload: { name: "B", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { cd_term_b: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { cd_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { cd_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${cd_term_a}", tank_number: "T-1", capacity_m3: 5000, current_product_id: "${cd_gas}" }
              as: TerminalAdmin
              captures: { cd_tank: $.data.id }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { cd_ctr: $.data.id }
          trigger:
            - name: job_create_mismatch_rejected
              call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${cd_term_b}", tank_id: "${cd_tank}", contractor_id: "${cd_ctr}", from_product_id: "${cd_gas}", to_product_id: "${cd_dist}", heel_volume_liters_sounding: 100, base_service_fee_cents: 1000 }
              as: TerminalOperator
              captures: { cd_err4: $.data.error_id }
          assert:
            - "cd_err4 == ERR_INVALID_REQUEST"
      - name: safety_event_immutable_common_fields_false
        claim_type: immutability
        grounds:
          - "entities.SafetyEvent"
        distinguishing_aspect: "common_fields:false — response carries id and created_at but no version/updated_at; no PATCH endpoint exists for the entity."
        test_recipe:
          setup: ["contractor exists"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/contractors"
              payload: { company_name: "EventCo" }
              as: TerminalAdmin
              captures: { cd_ctr2: $.data.id }
          trigger:
            - call: "POST /ops/safety-events"
              payload: { contractor_id: "${cd_ctr2}", kind: "VIOLATION", severity_weight: 2, occurred_at: "2026-04-01T00:00:00Z" }
              as: EHSOfficer
              as_user_id: "ehs-1"
              captures: { cd_ev: $.data.id }
          assert:
            - "SafetyEvent.${cd_ev} response contains id and created_at and does NOT contain version or updated_at"
      - name: job_computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.CleaningJob.fields.flush_volume_liters"
        distinguishing_aspect: "Client-supplied value for a computed field is ignored; server computes 105000."
        test_recipe:
          setup: ["terminal/products/tank/contractor"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { cd_term3: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { cd_gas3: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { cd_dist3: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${cd_term3}", tank_number: "T-1", capacity_m3: 5000, current_product_id: "${cd_gas3}" }
              as: TerminalAdmin
              captures: { cd_tank3: $.data.id }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { cd_ctr3: $.data.id }
          trigger:
            - name: job_create_computed_input_ignored
              call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${cd_term3}", tank_id: "${cd_tank3}", contractor_id: "${cd_ctr3}", from_product_id: "${cd_gas3}", to_product_id: "${cd_dist3}", heel_volume_liters_sounding: 2000, base_service_fee_cents: 500000, lines_included: true, flush_volume_liters: 999999 }
              as: TerminalOperator
              captures: { cd_flush: $.data.flush_volume_liters }
          assert:
            - "cd_flush == 105000 (server-computed; client-supplied 999999 ignored)"
# ===========================================================================
  - section: state_machines
    instances:
      - name: job_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - "state_machines.CleaningJob"
        distinguishing_aspect: "A freshly created job is DRAFT with null window_id."
        test_recipe:
          setup: ["terminal/products/tank/contractor"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { sm1_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { sm1_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { sm1_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${sm1_term}", tank_number: "T-1", capacity_m3: 5000, current_product_id: "${sm1_gas}" }
              as: TerminalAdmin
              captures: { sm1_tank: $.data.id }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { sm1_ctr: $.data.id }
          trigger:
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${sm1_term}", tank_id: "${sm1_tank}", contractor_id: "${sm1_ctr}", from_product_id: "${sm1_gas}", to_product_id: "${sm1_dist}", heel_volume_liters_sounding: 100, base_service_fee_cents: 1000 }
              as: TerminalOperator
              captures: { sm1_status: $.data.status, sm1_win: $.data.window_id }
          assert:
            - "sm1_status == DRAFT and sm1_win == null"
      - name: schedule_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.CleaningJob"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "Second schedule call on an already-SCHEDULED job is rejected."
        test_recipe:
          setup: ["job SCHEDULED against window"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { sm2_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { sm2_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { sm2_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${sm2_term}", tank_number: "T-1", capacity_m3: 5000, current_product_id: "${sm2_gas}" }
              as: TerminalAdmin
              captures: { sm2_tank: $.data.id, sm2_tank_v: $.data.version }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { sm2_ctr: $.data.id }
            - { call: "POST /ops/contractors/${sm2_ctr}/qualify", payload: { terminal_id: "${sm2_term}" }, as: TerminalAdmin }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${sm2_term}", tank_id: "${sm2_tank}", contractor_id: "${sm2_ctr}", from_product_id: "${sm2_gas}", to_product_id: "${sm2_dist}", heel_volume_liters_sounding: 100, base_service_fee_cents: 1000 }
              as: TerminalOperator
              captures: { sm2_job: $.data.id }
            - call: "POST /ops/service-windows"
              payload: { tank_id: "${sm2_tank}", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", expected_tank_version: "${sm2_tank_v}" }
              as: TerminalOperator
              captures: { sm2_win: $.data.id }
            - { call: "POST /ops/cleaning-jobs/${sm2_job}/schedule", payload: { window_id: "${sm2_win}" }, as: TerminalOperator }
          trigger:
            - name: second_schedule_rejected
              call: "POST /ops/cleaning-jobs/${sm2_job}/schedule"
              payload: { window_id: "${sm2_win}" }
              as: TerminalOperator
              captures: { sm2_err: $.data.error_id }
          assert:
            - "sm2_err == ERR_INVALID_STATE_TRANSITION and job stays SCHEDULED"
      - name: cancelled_job_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.CleaningJob"
        distinguishing_aspect: "From CANCELLED every further transition is rejected; no side effects fire."
        test_recipe:
          setup: ["job CANCELLED from DRAFT"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { sm3_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { sm3_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { sm3_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${sm3_term}", tank_number: "T-1", capacity_m3: 5000, current_product_id: "${sm3_gas}" }
              as: TerminalAdmin
              captures: { sm3_tank: $.data.id }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { sm3_ctr: $.data.id }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${sm3_term}", tank_id: "${sm3_tank}", contractor_id: "${sm3_ctr}", from_product_id: "${sm3_gas}", to_product_id: "${sm3_dist}", heel_volume_liters_sounding: 100, base_service_fee_cents: 1000 }
              as: TerminalOperator
              captures: { sm3_job: $.data.id }
            - { call: "POST /ops/cleaning-jobs/${sm3_job}/cancel", payload: {}, as: TerminalOperator }
          trigger:
            - name: cancel_after_cancel_rejected
              call: "POST /ops/cleaning-jobs/${sm3_job}/cancel"
              payload: {}
              as: TerminalOperator
              captures: { sm3_err: $.data.error_id }
            - name: take_oos_after_cancel_rejected
              call: "POST /ops/cleaning-jobs/${sm3_job}/take-out-of-service"
              payload: {}
              as: TerminalOperator
              captures: { sm3_err2: $.data.error_id }
          assert:
            - "sm3_err == ERR_INVALID_STATE_TRANSITION and sm3_err2 == ERR_INVALID_STATE_TRANSITION"
            - "Tank.${sm3_tank}.status == IN_SERVICE (untouched)"
      - name: cert_revalidate_once_only
        claim_type: invalid_transition
        grounds:
          - "state_machines.GasFreeCertificate.VALID_to_VALID"
          - "errors[ERR_CERT_ALREADY_REVALIDATED]"
        distinguishing_aspect: "First revalidation extends expires_at by 6h; second attempt is rejected."
        test_recipe:
          setup: ["job GAS_FREE_PENDING then cert issued at 2026-05-02T06:00:00Z (expires 18:00)"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { sm4_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { sm4_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { sm4_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${sm4_term}", tank_number: "T-1", capacity_m3: 5000, current_product_id: "${sm4_gas}" }
              as: TerminalAdmin
              captures: { sm4_tank: $.data.id, sm4_tank_v: $.data.version }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { sm4_ctr: $.data.id }
            - { call: "POST /ops/contractors/${sm4_ctr}/qualify", payload: { terminal_id: "${sm4_term}" }, as: TerminalAdmin }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${sm4_term}", tank_id: "${sm4_tank}", contractor_id: "${sm4_ctr}", from_product_id: "${sm4_gas}", to_product_id: "${sm4_dist}", heel_volume_liters_sounding: 2000, base_service_fee_cents: 500000 }
              as: TerminalOperator
              captures: { sm4_job: $.data.id }
            - call: "POST /ops/service-windows"
              payload: { tank_id: "${sm4_tank}", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", expected_tank_version: "${sm4_tank_v}" }
              as: TerminalOperator
              captures: { sm4_win: $.data.id }
            - { call: "POST /ops/cleaning-jobs/${sm4_job}/schedule", payload: { window_id: "${sm4_win}" }, as: TerminalOperator }
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T06:00:00Z" }, as: TerminalAdmin }
            - { call: "POST /ops/service-windows/${sm4_win}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /ops/cleaning-jobs/${sm4_job}/take-out-of-service", payload: {}, as: TerminalOperator }
            - { call: "POST /ops/cleaning-jobs/${sm4_job}/record-heel-removal", payload: { metered_liters: 2100 }, as: ContractorSupervisor, as_user_id: "${sm4_ctr}" }
            - call: "POST /ops/waste-profiles"
              payload: { job_id: "${sm4_job}", waste_code: "K051", hazard_class: "NON_HAZARDOUS", lab_flash_point_c: 70, lab_tph_mg_l: 120 }
              as: ContractorSupervisor
              as_user_id: "${sm4_ctr}"
              captures: { sm4_prof: $.data.id }
            - { call: "POST /ops/waste-profiles/${sm4_prof}/submit", payload: {}, as: ContractorSupervisor, as_user_id: "${sm4_ctr}" }
            - { call: "POST /ops/waste-profiles/${sm4_prof}/approve", payload: {}, as: EHSOfficer, as_user_id: "ehs-1" }
            - call: "POST /ops/waste-shipments"
              payload: { job_id: "${sm4_job}", profile_id: "${sm4_prof}", lines: [{ material: "SLUDGE", kg: 100, rate_cents_per_kg: 2.0 }] }
              as: ContractorSupervisor
              as_user_id: "${sm4_ctr}"
              captures: { sm4_ship: $.data.id }
            - { call: "POST /ops/waste-shipments/${sm4_ship}/dispatch", payload: {}, as: ContractorSupervisor, as_user_id: "${sm4_ctr}" }
            - { call: "POST /ops/waste-shipments/${sm4_ship}/deliver", payload: {}, as: ContractorSupervisor, as_user_id: "${sm4_ctr}" }
            - { call: "POST /ops/cleaning-jobs/${sm4_job}/record-sludge-removal", payload: { residual_sludge_kg: 0 }, as: ContractorSupervisor, as_user_id: "${sm4_ctr}" }
            - { call: "POST /ops/cleaning-jobs/${sm4_job}/request-gas-free", payload: {}, as: ContractorSupervisor, as_user_id: "${sm4_ctr}" }
            - call: "POST /ops/gas-free-certificates"
              payload: { job_id: "${sm4_job}", lel_pct: 5.0, o2_pct: 20.9, h2s_ppm: 2.0, benzene_ppm: 0.2 }
              as: MarineChemist
              as_user_id: "chemist-1"
              captures: { sm4_cert: $.data.id }
          trigger:
            - call: "POST /ops/gas-free-certificates/${sm4_cert}/revalidate"
              payload: {}
              as: MarineChemist
              as_user_id: "chemist-1"
              captures: { sm4_exp: $.data.expires_at, sm4_rev_flag: $.data.revalidated }
            - name: second_revalidate_rejected
              call: "POST /ops/gas-free-certificates/${sm4_cert}/revalidate"
              payload: {}
              as: MarineChemist
              as_user_id: "chemist-1"
              captures: { sm4_err: $.data.error_id }
          assert:
            - "sm4_exp == 2026-05-03T00:00:00Z (12h validity + 6h extension from 2026-05-02T06:00:00Z) and sm4_rev_flag == true"
            - "sm4_err == ERR_CERT_ALREADY_REVALIDATED"
      - name: window_overrun_on_clock_advance
        claim_type: valid_transition
        grounds:
          - "state_machines.ServiceWindow.PLANNED_to_OVERRUN"
        distinguishing_aspect: "System sweep: PLANNED window whose planned_end passes becomes OVERRUN."
        test_recipe:
          setup: ["window PLANNED [2026-05-02, 2026-05-03)"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { sm5_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { sm5_gas: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${sm5_term}", tank_number: "T-1", capacity_m3: 5000, current_product_id: "${sm5_gas}" }
              as: TerminalAdmin
              captures: { sm5_tank: $.data.id, sm5_tank_v: $.data.version }
            - call: "POST /ops/service-windows"
              payload: { tank_id: "${sm5_tank}", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-03T00:00:00Z", expected_tank_version: "${sm5_tank_v}" }
              as: TerminalOperator
              captures: { sm5_win: $.data.id }
          trigger:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: TerminalAdmin }
            - call: "GET /ops/service-windows/${sm5_win}"
              payload: {}
              as: TerminalOperator
