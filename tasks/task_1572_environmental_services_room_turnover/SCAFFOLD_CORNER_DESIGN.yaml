              payload: {}
              as: EVSTechnician
              as_user_id: "${t2}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
          trigger:
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t2}"
              captures: { e_start: $.data.error_id }
            - call: "POST /evs/clean-requests/${r1}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t2}"
              captures: { e_complete: $.data.error_id }
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
          assert:
            - "e_start == ERR_NOT_ASSIGNED_TECHNICIAN (403)"
            - "e_complete == ERR_NOT_ASSIGNED_TECHNICIAN (403)"
            - "Assignee start succeeds: CleanRequest.${r1}.status == IN_PROGRESS AND Bed.${b1}.bed_status == CLEAN_IN_PROGRESS"

  # ===========================================================================
  # Section: cross_cutting_layers (complexity-layer claims: OCC happy+stale
  # per declared rule, version increments, threshold trigger, selector policy)
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_reassign_accepts_current_rejects_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[clean-request-reassign-stale-version]
          - errors[ERR_STALE_REQUEST_VERSION]
        distinguishing_aspect: |
          The reassign OCC rule end-to-end: the version captured from the
          assign response (2) authorizes one reassignment (version advances to
          3), and replaying the same stale version is rejected 412 with the
          assignee unmoved.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ROUTINE standard; techs T1, T2 (CLEAN); bed B1; R1 QUEUED (v1)"
            - "R1 assigned to T1 (version advances to 2, captured)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "T2", display_name: "Tech Two", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t2: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
              captures: { r_v: $.data.version }
          trigger:
            - call: "POST /evs/clean-requests/${r1}/reassign"
              payload: { staff_id: "${t2}", expected_clean_request_version: "${r_v}" }
              as: EVSDispatcher
              captures: { r_v2: $.data.version, r_staff: $.data.assigned_staff_id }
            - call: "POST /evs/clean-requests/${r1}/reassign"
              payload: { staff_id: "${t1}", expected_clean_request_version: "${r_v}" }
              as: EVSDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "r_staff == ${t2} AND r_v2 == 2 + 1 (fresh version accepted; mutation bumps version)"
            - "err == ERR_STALE_REQUEST_VERSION (412): the replayed version ${r_v} is now stale"
            - "After the 412: CleanRequest.${r1}.assigned_staff_id == ${t2} AND version == 3 (rejected write changed nothing)"
            - "StaffMember.${t1}.active_clean_count == 0 AND StaffMember.${t2}.active_clean_count == 1"

      - name: occ_recount_accepts_current_rejects_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[supply-recount-stale-version]
          - entities.SupplyItem.fields.on_hand_quantity
          - errors[ERR_STALE_SUPPLY_VERSION]
        distinguishing_aspect: |
          The recount OCC rule: after a restock silently advances the item to
          version 2, a recount pinned to version 1 is rejected 412, and the
          same recount with the fresh version writes a RECOUNT_ADJUSTMENT of
          exactly (counted - current) = -5 onto the ledger.
        test_recipe:
          setup:
            - "Clock 08:00; DISINFECTANT created with on_hand 100 (v1 captured); restock +10 -> on_hand 110, v2 captured"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
              captures: { si: $.data.id, sv1: $.data.version }
            - call: "POST /evs/supply-items/${si}/restock"
              payload: { quantity: 10 }
              as: EVSAdministrator
              captures: { sv2: $.data.version }
          trigger:
            - call: "POST /evs/supply-items/${si}/recount"
              payload: { counted_on_hand: 105, expected_supply_item_version: "${sv1}" }
              as: EVSAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /evs/supply-items/${si}/recount"
              payload: { counted_on_hand: 105, expected_supply_item_version: "${sv2}" }
              as: EVSAdministrator
              captures: { sv3: $.data.version, on_hand: $.data.on_hand_quantity }
          assert:
            - "err == ERR_STALE_SUPPLY_VERSION (412): the restock advanced the version past the client's observation"
            - "on_hand == 105 AND sv3 == 3 (recount applies via RECOUNT_ADJUSTMENT -5 and bumps version)"
            - "SupplyItem.${si}.reserved_quantity == 0 (recount never touches reservations)"
            - "The item's ledger holds exactly 3 entries summing to +105 (RESTOCK 100, RESTOCK 10, RECOUNT_ADJUSTMENT -5)"

      - name: occ_standard_update_version_gate_and_pin_divergence
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[clean-standard-update-stale-version]
          - calculations.effective_time_standard
          - entities.CleanRequest.fields.current_estimate_minutes
          - errors[ERR_STALE_STANDARD_VERSION]
        distinguishing_aspect: |
          The standard-update OCC rule plus its pinned/current divergence: a
          request created before the PUT keeps sla_target_minutes 45 while its
          current_estimate_minutes flips to 50 under the new row, and replaying
          the pre-PUT version on a second PUT is rejected 412.
        test_recipe:
          setup:
            - "Clock 08:00; ROUTINE standard (base 45, v1 captured); unit U1; bed B1; R1 ROUTINE (pinned 45 under the v1 row)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
              captures: { std_v: $.data.version }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
          trigger:
            - call: "PUT /evs/clean-standards/ROUTINE"
              payload: { base_minutes: 50, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250, expected_standard_version: "${std_v}" }
              as: EVSAdministrator
              captures: { std_v2: $.data.version }
            - call: "GET /evs/clean-requests/${r1}"
              payload: {}
              as: Any
              captures: { r_pinned: $.data.sla_target_minutes, r_current: $.data.current_estimate_minutes }
            - call: "PUT /evs/clean-standards/ROUTINE"
              payload: { base_minutes: 55, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250, expected_standard_version: "${std_v}" }
              as: EVSAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "std_v2 == 2 (accepted PUT bumps the standard's version)"
            - "r_pinned == 45 (in-flight pin unchanged) AND r_current == 50 (CURRENT variant tracks the edited row)"
            - "err == ERR_STALE_STANDARD_VERSION (412): the second PUT replayed the pre-edit version"
            - "GET /evs/clean-standards/ROUTINE shows base_minutes 50 (the rejected 55 never landed)"

      - name: low_stock_threshold_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - entities.SupplyItem.fields.stock_status
          - entities.SupplyItem.fields.reorder_threshold
        distinguishing_aspect: |
          The LOW trigger uses <=: on_hand 11 with threshold 10 is STOCKED, a
          recount down to exactly 10 flips LOW (boundary inclusive), and a
          restock back to 11 clears it — the flag is recomputed from the
          ledger on every mutation.
        test_recipe:
          setup:
            - "Clock 08:00; DISINFECTANT created on_hand 11, threshold 10 (v1 captured)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 11, reorder_threshold: 10 }
              as: EVSAdministrator
              captures: { si: $.data.id, sv1: $.data.version, st0: $.data.stock_status }
          trigger:
            - call: "POST /evs/supply-items/${si}/recount"
              payload: { counted_on_hand: 10, expected_supply_item_version: "${sv1}" }
              as: EVSAdministrator
              captures: { st1: $.data.stock_status, sv2: $.data.version }
            - call: "POST /evs/supply-items/${si}/restock"
              payload: { quantity: 1 }
              as: EVSAdministrator
              captures: { st2: $.data.stock_status }
          assert:
            - "st0 == STOCKED (11 > 10)"
            - "st1 == LOW (10 <= 10: the threshold is inclusive)"
            - "st2 == STOCKED (11 > 10 again; LOW clears on the same mutation that restores stock)"

      - name: pull_selector_orders_by_sla_due_then_created
        claim_type: selector_policy
        grounds:
          - calculations.next_clean_request_selector
          - entities.CleanRequest.fields.sla_due_at
        distinguishing_aspect: |
          With tier and score tied (both STANDARD, 0.00), the pull ranking
          falls to sla_due_at ASC: the request created at 08:00 (due 08:45) is
          pulled before the one created at 08:10 (due 08:55) — no randomness,
          no id anywhere in the ordering.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ROUTINE standard; beds B1, B2; techs T1, T2 (CLEAN) both ON_SHIFT since 08:00"
            - "R1 on B1 created 08:00 (due 08:45); clock 08:10; R2 on B2 created 08:10 (due 08:55); no demands (both STANDARD tier, score 0.00)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "T2", display_name: "Tech Two", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t2: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/staff/${t2}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t2}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:10:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B2", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b2: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b2}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /evs/clean-requests/pull"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
              captures: { p1: $.data.id, p1_start: $.data.planned_start_at }
            - call: "POST /evs/clean-requests/pull"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t2}"
              captures: { p2: $.data.id }
          assert:
            - "p1 == ${r1} (earlier sla_due_at 08:45 outranks 08:55 at equal tier and score) AND p1_start == 2026-08-01T08:10:00Z"
            - "p2 == ${r2} (the remaining candidate)"
            - "CleanRequest.${r1}.assigned_staff_id == ${t1} AND status == ASSIGNED; CleanRequest.${r2}.assigned_staff_id == ${t2}"

      - name: pull_selector_filters_certification_and_shift_state
        claim_type: selector_policy
        grounds:
          - calculations.next_clean_request_selector
          - errors[ERR_QUEUE_EMPTY]
          - errors[ERR_STAFF_NOT_ON_SHIFT]
        distinguishing_aspect: |
          Two distinct empty-pool paths: an ON_SHIFT technician lacking
          ISO_CERT finds the ISOLATION-only queue empty (409 ERR_QUEUE_EMPTY),
          while an ISO-certified technician who is OFF_SHIFT never reaches
          selection at all (409 ERR_STAFF_NOT_ON_SHIFT, checked first).
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ISOLATION standard; ISOLATION bed BI1; R1 ISOLATION QUEUED"
            - "T1 (CLEAN, no certs) ON_SHIFT; T2 (CLEAN, ISO_CERT) OFF_SHIFT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ISOLATION", base_minutes: 60, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 150 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "T2", display_name: "Tech Two", capabilities: ["CLEAN"], certifications: ["ISO_CERT"] }
              as: EVSAdministrator
              captures: { t2: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "BI1", bed_kind: "ISOLATION" }
              as: EVSAdministrator
              captures: { bi1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${bi1}", clean_type: "ISOLATION" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /evs/clean-requests/pull"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
              captures: { e_pool: $.data.error_id }
            - call: "POST /evs/clean-requests/pull"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t2}"
              captures: { e_shift: $.data.error_id }
          assert:
            - "e_pool == ERR_QUEUE_EMPTY (409): the only QUEUED request is ISOLATION and T1 lacks ISO_CERT"
            - "e_shift == ERR_STAFF_NOT_ON_SHIFT (409): shift gate precedes selection even for a certified tech"
            - "CleanRequest.${r1}.status == QUEUED AND assigned_staff_id == null (neither pull consumed it)"

      - name: unit_version_and_ops_run_index_increment_per_run
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Unit.fields.ops_run_index
          - entities.TurnaroundSnapshot.fields.ops_run_index
        distinguishing_aspect: |
          The ops-run epoch is a derived, monotonic counter: each run stamps
          the snapshot with the PRE-increment index and bumps both
          Unit.ops_run_index and Unit.version by exactly 1 — 0/1 on snapshots,
          2/3 on the unit.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1 created (version 1, ops_run_index 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
          trigger:
            - call: "POST /evs/units/${u1}/ops-runs"
              payload: {}
              as: EVSAdministrator
              captures: { s1_idx: $.data.ops_run_index }
            - call: "GET /evs/units/${u1}"
              payload: {}
              as: Any
              captures: { idx1: $.data.ops_run_index, ver1: $.data.version }
            - call: "POST /evs/units/${u1}/ops-runs"
              payload: {}
              as: EVSAdministrator
              captures: { s2_idx: $.data.ops_run_index }
            - call: "GET /evs/units/${u1}"
              payload: {}
              as: Any
              captures: { idx2: $.data.ops_run_index, ver2: $.data.version }
          assert:
            - "s1_idx == 0 AND idx1 == 1 AND ver1 == 2"
            - "s2_idx == 1 AND idx2 == 2 AND ver2 == 3"
            - "GET /evs/units/${u1}/turnaround-snapshots returns exactly 2 rows (reverse reachability for the snapshot FK)"

  # ===========================================================================
  # Section: consistency_model (immediate-consistency claims)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_visibility
        grounds:
          - entities.CleanRequest.fields.unit_id
          - entities.CleanRequest.fields.assigned_staff_id
          - entities.StaffMember.fields.active_clean_count
        distinguishing_aspect: |
          Immediate consistency: every mutation is fully visible in its own
          response AND in the very next read at the SAME logical instant —
          including the denormalized unit_id copy on the request and the
          derived active_clean_count on the staff member.
        test_recipe:
          setup:
            - "Clock 08:00 (never advanced in this instance)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
          trigger:
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id, r_unit: $.data.unit_id, r_due: $.data.sla_due_at }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
              captures: { r_staff: $.data.assigned_staff_id }
            - call: "GET /evs/staff/${t1}"
              payload: {}
              as: Any
              captures: { t1_active: $.data.active_clean_count }
            - call: "GET /evs/clean-requests/${r1}"
              payload: {}
              as: Any
              captures: { r_status: $.data.status, r_staff_read: $.data.assigned_staff_id }
          assert:
            - "r_unit == ${u1} (denormalized copy written at creation, readable immediately)"
            - "r_due == 2026-08-01T08:45:00Z (created_at 08:00 + 45 pinned minutes, same instant)"
            - "r_staff == ${t1} in the assign RESPONSE, and r_staff_read == ${t1} with r_status == ASSIGNED on the immediate re-read"
            - "t1_active == 1 (derived counter settled before the assign response completed)"
            - "All timestamps across these rows read 2026-08-01T08:00:00Z (logical clock never moved)"
