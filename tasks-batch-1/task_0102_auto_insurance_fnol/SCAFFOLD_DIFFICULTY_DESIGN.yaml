          - entities.Disbursement.fields.amount_cents
          - entities.Claim.fields.total_disbursed_cents
          - calculations.claim_ledger_balance
        distinguishing_aspect: |
          Depth-3 transitive cascade: resolve(recovered=300000) -> SubrogationCase RESOLVED (hop1)
          -> that RESOLVED transition creates a SUBROGATION_RECOVERY Disbursement of -300000 (hop2,
          caused by hop1) -> that disbursement creation recomputes Claim.total_disbursed_cents
          (hop3, caused by hop2). Net = settlement 550000 - 300000 = 250000.
        test_recipe:
          setup:
            - "A REPAIR-settled claim (settlement_cents=550000, one APPROVED SETTLEMENT disbursement) with a THIRD_PARTY; PURE rule, insured_fault_pct=0; subrogation case in NEGOTIATING with demand_cents=300000."
