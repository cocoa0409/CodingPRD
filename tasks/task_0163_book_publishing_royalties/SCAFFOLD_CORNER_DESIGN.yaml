        distinguishing_aspect: "GET /contracts/{id}/subsidiary-rights?status=VOID returns only the VOID right, not the REGISTERED one."
        test_recipe:
          setup: ["A DRAFT contract with one VOID right and one REGISTERED right."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "Filt Sub", email: "filtsub@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/subsidiary-rights"
              payload: { right_type: "FOREIGN", proceeds_cents: 100, author_share_pct: 0.5 }
              as: Publisher
              captures: { r_void: $.data.id }
            - call: "POST /contracts/${contract_id}/subsidiary-rights"
              payload: { right_type: "AUDIO", proceeds_cents: 200, author_share_pct: 0.5 }
              as: Publisher
            - call: "POST /subsidiary-rights/${r_void}/void"
              payload: {}
              as: Publisher
          trigger:
            - call: "GET /contracts/${contract_id}/subsidiary-rights"
              payload: { status: "VOID" }
              as: Publisher
          assert:
            - "response_type == array"
            - "exactly one element, with status == VOID and id == ${r_void}"

      - name: list_sales_records_filtered_by_format
        claim_type: Computed read
        grounds: ["endpoints.GET_/sales-records", "entities.SalesRecord.fields.format_id"]
        distinguishing_aspect: "GET /sales-records?format_id=F returns only records for format F (reverse-reachability filtered list)."
        test_recipe:
          setup: ["A period with one sales record for format F."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "Filt SR", email: "filtsr@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "SR Book" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
