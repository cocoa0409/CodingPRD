            - "Before the trigger: consultation 1 is status OBJECTED with responded_at and responded_by_user_id stamped, consultation 2 is PENDING, plan.revision_round == 1 and plan.status == CONSULTATION"
            - "After the trigger: plan.status == ABANDONED (terminal) and the plan did NOT become CONSENT_SATISFIED even though a PENDING consultation on it was waived in the same write"
            - "Consultation 1 is untouched: status still OBJECTED, responded_at and responded_by_user_id unchanged, rights_type still CONSENT_RIGHT, version unchanged"
            - "Consultation 2 status == WAIVED with responded_at still null and rights_type still CONSENT_RIGHT — rights_type is downgraded only when the waive comes from control termination"
