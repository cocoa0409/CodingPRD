  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: project_cancel_withdraws_lot_voids_bids
        grounds:
          - state_machines.Project.transitions.to_CANCELLED
          - state_machines.Lot.transitions.to_WITHDRAWN
          - state_machines.Bid.PLACED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chain: cancel Project (A) -> its bid lot -> WITHDRAWN (B, caused by A) -> that lot's two
          PLACED bids -> VOIDED (C, caused by B). Originates from the project-cancel trigger.
        test_recipe:
          setup:
            - "Project SALE_SETUP with one LISTED bid lot carrying two PLACED bids (12000, 15000)"
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Gi Owner", phone: "555-0166" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "7 Cedar St", estimated_total_value_cents: 200000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Watch", is_bid_lot: true, bid_mode: "FIRST_PRICE", list_price_cents: 20000, reserve_price_cents: 10000, min_increment_cents: 1000 }, as: Appraiser, captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "POST /estate/bids", payload: { lot_id: "${lot_id}", amount_cents: 12000, bidder_name: "b1" }, as: Cashier, captures: { b1_id: "$.data.id" } }
