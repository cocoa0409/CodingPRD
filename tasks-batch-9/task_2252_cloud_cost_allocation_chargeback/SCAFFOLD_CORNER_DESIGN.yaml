                payload: { name: "Engineering / Data", cost_center_code: "CC-501", headcount: 10, parent_business_unit_id: "${eng_id}" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { data_id: "$.data.id" }
              - call: "POST /finops/business-units"
