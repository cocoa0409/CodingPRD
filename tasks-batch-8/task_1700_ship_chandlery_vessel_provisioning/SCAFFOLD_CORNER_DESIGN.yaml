        claim_type: fk_integrity
        grounds: [endpoints]
        distinguishing_aspect: "Every FK reverse GET returns an array: quotations-of-requisition has 1 entry after creation; orders-of-quotation is [] before accept and length 1 after; credit-notes filtered by invoice_id returns the applied note."
