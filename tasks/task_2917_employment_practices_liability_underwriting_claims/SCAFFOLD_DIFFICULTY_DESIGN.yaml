  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: exposure_score_referral_threshold_exact_72_00
        grounds:
          - calculations.exposure_score
          - calculations.exposure_score.constants.REFERRAL_SCORE_THRESHOLD
          - state_machines.ExposureAssessment.DRAFT_to_PRICED
          - state_machines.ExposureAssessment.DRAFT_to_REFERRED
          - endpoints["POST /epli/exposure-assessments/{assessment_id}/price"]
        distinguishing_aspect: |
          Metric: the dimensionless exposure_score against REFERRAL_SCORE_THRESHOLD
          72.00, exercised on `POST /epli/exposure-assessments/{assessment_id}/price`.
          The at-threshold applicant lands on exactly 72.00 (34 headcount-band points +
          20 T3 hazard points + 22.50 x 0.80 = 18.00 turnover points) and must be
          REFERRED because the rule is `>=`; one fewer separation yields 71.99 and must
          be PRICED. A naive implementation that uses `>` or that truncates 17.992 to
          17.99 before summing flips one of the two outcomes.
        test_recipe:
          setup:
            - "Jurisdiction NY is registered at hazard_tier T3 (20 hazard points) and the RatePlan 'EPLI Standard 2026' is ACTIVE."
            - "Applicant 'Meridian Grid Services' has total_headcount 10000 (band points 34) entirely in NY (no multi-jurisdiction points) and prior_year_separations 2250, giving turnover_pct exactly 22.50."
            - "Applicant 'Meridian Grid Holdings' is identical except prior_year_separations 2249, giving turnover_pct exactly 22.49."
            - "One DRAFT ExposureAssessment exists for each applicant, both requesting aggregate_limit_cents 100000000 (limit_load 0) and retention 0 (retention_credit 0) so nothing but the score differs."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "NY", name: "New York", hazard_tier: "T3", admin_agency_name: "New York State Division of Human Rights", pre_suit_window_days: 150, wage_hour_multiplier: 1.35, class_action_propensity_pct: 31.00, pre_suit_mediation_required: true }
