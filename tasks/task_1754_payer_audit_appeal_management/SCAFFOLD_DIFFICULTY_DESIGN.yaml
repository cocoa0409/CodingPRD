            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 100000 }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p2}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /audit-cases/${c2}/claim-lines", payload: { claim_number: "L-2", patient_account_number: "PA-2", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l2: $.data.id } }
            - { call: "GET /audit-cases/${c2}", payload: {}, as: Any, captures: { c2v: $.data.version } }
            - { call: "POST /audit-cases/${c2}/records-submissions", payload: { manifest_ref: "M2", expected_audit_case_version: "${c2v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c2}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p2}" }
            - { call: "POST /audit-cases/${c2}/determination", payload: { outcomes: [ { claim_line_id: "${l2}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p2}" }
            - { call: "POST /audit-cases/${c2}/recoupment-demands", payload: { principal_cents: 100000 }, as: PayerAgent, as_user_id: "${p2}", captures: { d2: $.data.id } }
            - { call: "POST /claim-lines/${l2}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap2: $.data.id } }
            - { call: "POST /remittances", payload: { payer_id: "${p2}", gross_amount_cents: 50000 }, as: PayerAgent, as_user_id: "${p2}", captures: { rem2: $.data.id } }
