              as: QualityAnalyst
              as_user_id: "QA-1"
              captures: { verdict: "$.data.verdict", margin: "$.data.purity_margin_pct" }
          assert:
            - "early sample: HTTP 422 and ${err} == ERR_SAMPLE_BEFORE_PRODUCTION_END; no PurityTest row is created and ProductionLot.qa_status stays PENDING"
            - "boundary sample: HTTP 201, ${verdict} == PASS, ${margin} == 50.000"
            - "ProductionLot.${lot_id}.qa_status == PASSED after the accepted sample"
            - "GET /production-lots/${lot_id}/purity-tests returns total_count 1"

      - name: state_error_outranks_fiscal_error_on_the_same_request
        claim_type: priority_ordering
        grounds:
          - validations.priority_90
          - validations.priority_265
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_posture_state_error_outranks_insufficient_inventory_fiscal_error
          rationale: |
            That instance builds a single request that violates both the FROZEN-station rule and the
            available-inventory rule and asserts the priority-90 answer, then removes the state
            violation so the priority-265 error surfaces - exactly this claim, plus the isolation leg.

      - name: lot_release_state_is_a_cross_entity_precondition_of_offload
        claim_type: cross-entity
        grounds:
          - validations.priority_130
          - errors.ERR_LOT_NOT_RELEASED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / delivery_offload_blocked_until_production_lot_reaches_released
          rationale: |
            The offload is attempted at PRODUCED, then at RELEASED with no change to the delivery
            itself, which is the cross-entity validation claim in full.

      - name: offload_bay_overlap_is_an_aggregate_capacity_check
        claim_type: aggregate
        grounds:
          - validations.priority_160
          - errors.ERR_OFFLOAD_BAY_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / offload_bay_aggregate_capacity_two_bays_with_half_open_windows
          rationale: |
            Two bays, two concurrent deliveries, a third rejected, and a touching window accepted are
            all asserted there.

  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_advance_reports_recompute_counts_and_flips_inspection_bands
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - calculations.operational_thresholds
          - calculations.station_safety_posture
        distinguishing_aspect: |
          The clock endpoint is the only writer of time and it must report how much it touched:
          vessels_recomputed counts every non-CONDEMNED vessel across ALL stations (not just the
          ones whose band changed) and stations_recomputed counts every station. Two advances probe
          the grace boundary: due + 30 days is still DUE (station stays OPEN) and due + 31 days is
          OVERDUE, which drops the vessel out of total_deliverable_kg and restricts the station.
        test_recipe:
          setup:
            - "Station STN-E1 with vessel A1 (HIGH 600 L at 950.00 bar, next_inspection_due_date 2026-08-15) and vessel A2 (LOW 5000 L at 300.00 bar, next_inspection_due_date 2026-10-01); two certifications valid to 2027-01-01."
            - "Station STN-E2 with vessel B1 (HIGH 600 L at 950.00 bar, next_inspection_due_date 2027-06-30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E1", name: "Clock Station A", nozzle_count: 2, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H35", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_a: "$.data.id" }
            - call: "POST /stations/${st_a}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2026-08-15" }
              as: SafetyOfficer
              captures: { v_a1: "$.data.id", st_a1: "$.data.inspection_status" }
            - call: "POST /stations/${st_a}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2026-10-01" }
              as: SafetyOfficer
              captures: { v_a2: "$.data.id" }
            - call: "POST /stations/${st_a}/responder-certifications"
              payload: { responder_ref: "RSP-E1-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_a}/responder-certifications"
              payload: { responder_ref: "RSP-E1-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E2", name: "Clock Station B", nozzle_count: 2, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H35", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_b: "$.data.id" }
            - call: "POST /stations/${st_b}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_b1: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: PlatformAdmin
              captures: { utc1: "$.data.current_utc", vr1: "$.data.vessels_recomputed", sr1: "$.data.stations_recomputed" }
            - call: "GET /stations/${st_a}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_a}"
              captures: { posture_mid: "$.data.safety_posture", td_mid: "$.data.total_deliverable_kg" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { vr2: "$.data.vessels_recomputed", sr2: "$.data.stations_recomputed" }
            - call: "GET /stations/${st_a}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_a}"
              captures: { posture_late: "$.data.safety_posture", td_late: "$.data.total_deliverable_kg", hbd_late: "$.data.high_bank_deliverable_kg", onsite_late: "$.data.onsite_inventory_kg" }
          assert:
            - "${st_a1} == CURRENT at creation (2026-08-01 < 2026-08-15)"
            - "first advance: ${utc1} == 2026-09-14T00:00:00Z, ${vr1} == 3, ${sr1} == 2"
            - "vessel ${v_a1} is DUE (2026-09-14 == 2026-08-15 + 30 days, the inclusive grace edge), ${v_a2} and ${v_b1} are CURRENT"
            - "${posture_mid} == OPEN and ${td_mid} == 116.000 (36.000 from A1 + 80.000 from A2; DUE vessels still count)"
            - "second advance: ${vr2} == 3 and ${sr2} == 2 (the counts are totals, not counts of changes)"
            - "vessel ${v_a1} is OVERDUE and ${posture_late} == RESTRICTED"
            - "${td_late} == 80.000 and ${hbd_late} == 0.000 (the OVERDUE HIGH vessel is excluded from both aggregates)"
            - "${onsite_late} == 165.600 - the ledger-derived inventory is untouched by an inspection band change"
            - "Station.${st_b}.safety_posture == OPEN - the recompute did not leak across stations"

      - name: inventory_ledger_read_replays_the_running_onsite_balance
        claim_type: computed_read
        grounds:
          - endpoints.GET_/stations/{id}/inventory-ledger
          - entities.InventoryLedgerEntry.fields.resulting_onsite_kg
          - calculations.metering_accuracy_rollup
        distinguishing_aspect: |
          The ledger read must expose the running balance in replay order and the last row must equal
          Station.onsite_inventory_kg to the milligram, including the fractional METER_CORRECTION row
          of -0.365 kg. The reason filter must narrow the rows WITHOUT renumbering sequence_no or
          recomputing the balances.
        test_recipe:
          setup:
            - "Station STN-E3: HIGH 600 L at 950.00 bar (OPENING_BALANCE 45.600), nozzle_count 2, max_pressure_class H35, two current certifications."
            - "One session planned 24.000 kg at ambient -18.0 C, metered 24.000 kg, corrected 24.365 kg, then settled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E3", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E3", name: "Ledger Station", nozzle_count: 2, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H35", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-E3-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-E3-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 24.000, ambient_temp_c: -18.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s1: "$.data.id" }
            - call: "POST /dispense-sessions/${s1}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s1}/complete"
              payload: { metered_kg: 24.000, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { corr: "$.data.corrected_kg" }
            - call: "POST /dispense-sessions/${s1}/meter-settlement"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { bs: "$.data.billing_status" }
          trigger:
            - call: "GET /stations/${st_id}/inventory-ledger"
              payload: {}
              as: ProgramAuditor
              as_user_id: "PA-1"
              captures: { rows: "$.data", total: "$.total_count" }
            - call: "GET /stations/${st_id}/inventory-ledger"
              payload: { reason: "METER_CORRECTION" }
              as: ProgramAuditor
              as_user_id: "PA-1"
              captures: { corr_rows: "$.data", corr_total: "$.total_count" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { onsite: "$.data.onsite_inventory_kg", err_mtd: "$.data.metering_error_pct_mtd" }
          assert:
            - "${corr} == 24.365 and ${bs} == METERED"
            - "${total} == 3 and ${rows} in replay order is [(1, OPENING_BALANCE, +45.600, 45.600), (2, DISPENSE_DRAW, -24.000, 21.600), (3, METER_CORRECTION, -0.365, 21.235)]"
            - "the METER_CORRECTION delta is metered_kg - corrected_kg = 24.000 - 24.365 = -0.365"
            - "${corr_total} == 1 and the single filtered row keeps sequence_no 3 and resulting_onsite_kg 21.235"
            - "${onsite} == 21.235 equals the last ledger row's resulting_onsite_kg"
            - "${err_mtd} == -1.498 ((24.000 - 24.365) / 24.365 * 100) with metered_kg_mtd 24.000 and corrected_kg_mtd 24.365"

      - name: void_meter_is_conditional_on_the_metered_billing_state
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/dispense-sessions/{id}/void-meter
          - state_machines.DispenseSession.METERED_to_VOIDED
          - validations.priority_80
        distinguishing_aspect: |
          void-meter is legal from METERED and from nowhere else: attempted while billing_status is
          still PENDING it must return ERR_INVALID_STATE_TRANSITION with no ledger row, and attempted
          a second time after it has already voided it must fail again - so the reversal row can never
          be written twice and the balance cannot drift.
        test_recipe:
          setup:
            - "Station STN-E4 as in the ledger case; one session completed at corrected 24.365 kg against metered 24.000 kg (billing_status PENDING)."
          setup_api_calls:
