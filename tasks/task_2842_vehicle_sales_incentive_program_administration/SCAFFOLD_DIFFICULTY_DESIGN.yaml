              captures: { edge_id: $.data.id, edge_mode: $.data.mode }
            - call: "POST /incentives/programs/${prog_1}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_1}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs/${prog_2}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_2}/approve"
