  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_run_windows_half_open_adjacency
        grounds:
          - calculations.line_window_conflict
          - errors[ERR_LINE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource ProductionLine, semantics half-open [start_at, end_at): a
          same-product run starting exactly at the previous run's end_at is
          adjacent, NOT overlapping (accepted), while [11:59,13:00) intersects
          and is rejected with ERR_LINE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "SHARED line, one CORN_ONLY product; run1 10:00-12:00 created (line version now 2)"
          setup_api_calls:
            - { call: "POST /plant/products", payload: { sku_code: "CORN-6-O1", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-O1", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", lv1: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 100, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", expected_line_version: "${lv1}" }, as: LineScheduler, captures: { run1: "$.data.id" } }
            - { call: "GET /plant/lines/${line_id}", payload: {}, as: LineScheduler, captures: { lv2: "$.data.version" } }
          trigger:
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 100, start_at: "2026-08-02T12:00:00Z", end_at: "2026-08-02T14:00:00Z", expected_line_version: "${lv2}" }, as: LineScheduler, captures: { run2: "$.data.id", r2_status: "$.data.production_status" } }
            - { call: "GET /plant/lines/${line_id}", payload: {}, as: LineScheduler, captures: { lv3: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 50, start_at: "2026-08-02T11:59:00Z", end_at: "2026-08-02T13:00:00Z", expected_line_version: "${lv3}" }, as: LineScheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "run2 (starts exactly at run1.end_at) accepted: production_status == PLANNED (half-open adjacency is not a conflict)"
            - "run3 [11:59,13:00) rejected: error_id == ERR_LINE_WINDOW_OVERLAP (11:59 < 12:00 intersects run1)"

      - name: seasonal_windows_inclusive_date_overlap
        grounds:
          - calculations.seasonal_window_overlap
          - errors[ERR_WINDOW_DATE_OVERLAP]
        distinguishing_aspect: |
          Resource SeasonalWindow, semantics CLOSED inclusive date intervals —
          deliberately different from the line's half-open rule: a window
          starting the day AFTER the previous window's inclusive ends_on is
          accepted, but sharing a single calendar day (08-20) is rejected with
          ERR_WINDOW_DATE_OVERLAP.
        test_recipe:
          setup:
            - "window W1 2026-08-10..2026-08-20 exists (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /plant/seasonal-windows", payload: { window_name: "W1", starts_on: "2026-08-10", ends_on: "2026-08-20", demand_multiplier: 1.2, forecast_total_cases: 100 }, as: PlantManager, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /plant/seasonal-windows", payload: { window_name: "W2", starts_on: "2026-08-21", ends_on: "2026-08-25", demand_multiplier: 1.2, forecast_total_cases: 100 }, as: PlantManager, captures: { w2: "$.data.id", w2_status: "$.data.window_status" } }
            - { call: "POST /plant/seasonal-windows", payload: { window_name: "W3", starts_on: "2026-08-20", ends_on: "2026-08-22", demand_multiplier: 1.3, forecast_total_cases: 100 }, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "W2 starting 2026-08-21 (one day after inclusive end 08-20) accepted: window_status == SCHEDULED"
            - "W3 sharing calendar day 2026-08-20 rejected: error_id == ERR_WINDOW_DATE_OVERLAP (inclusive-end semantics)"
            - "W2.is_strict == false (1.2 < 1.5 threshold)"

