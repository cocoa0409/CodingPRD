      - name: republishing_a_stale_event_returns_blocked_relocation_requests_to_awaiting
        claim_type: cyclic
        grounds:
          - state_machines.SelectionEvent.status.transitions.SLOTS_STALE_to_SLOTS_PUBLISHED
          - state_machines.RelocationRequest.status.transitions.BLOCKED_to_AWAITING_SELECTION
          - state_machines.SelectionSlot.slot_status.transitions.SCHEDULED_to_STALE
          - endpoints.POST_/athletics/selection-events/{id}/publish-slots
        distinguishing_aspect: |
          publish-slots is both the initial publication and the recovery call, so
          SLOTS_PUBLISHED -> SLOTS_STALE -> SLOTS_PUBLISHED is a genuine loop.
          Because CERTIFIED is terminal, the invalidating ranking rewrite can only
          come from certifying a SECOND recalculation (a different cycle_year),
          and republication must (a) discard the STALE slot rows while preserving
          the CONSUMED one, (b) lay a fresh generation in the NEW rank order, and
          (c) lift the donor's relocation request out of BLOCKED and restore
          pending_request_count to 1. An implementation that republishes slots but
          leaves the relocation request BLOCKED, or that discards the CONSUMED
          slot too, fails.
