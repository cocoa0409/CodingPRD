scaffold_corner_design:
- section: entities
  instances:
  - name: drug_create_success_defaults
    claim_type: creation
    grounds:
    - entities.DrugCatalogEntry
    - endpoints[POST /api/drugs]
    distinguishing_aspect: Valid create returns 201 with server-minted id, version 1, and the default weight_based_dosing = false applied when
      omitted.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J9000
          drug_name: BaseDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 1000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      trigger:
      - call: GET /api/drugs/${drug_id}
        as: PlanAdmin
      assert:
      - Create returned 201; DrugCatalogEntry.${drug_id}.version == 1
      - weight_based_dosing == false (default applied); mg_per_kg is null
      - id is a bare UUID; created_at/updated_at present with 3 fractional digits
  - name: claim_create_omitted_optionals_default
    claim_type: defaults
    grounds:
    - entities.InfusionClaim.fields.waste_units
    - entities.InfusionClaim.fields.jw_modifier
    distinguishing_aspect: Omitting waste_units and jw_modifier defaults them to 0/false; payable_waste_units computes to 0.
    test_recipe:
      setup:
      - Drug (rate 500 from 2026-01-01, unit 10, vial 100 single-dose, VIAL, EITHER, max 2000), ACTIVE policy C50, provider, auth approved 100
        mg (max 4)
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J4100
          drug_name: DefaultDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      - call: POST /api/asp-schedules
        payload:
          drug_id: ${drug_id}
          effective_start: '2026-01-01'
          asp_rate_cents: 500
        as: PlanAdmin
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
      - call: POST /api/provider-accounts
        payload:
          name: Default Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${drug_id}
          member_id: MEM-D1
          diagnosis_code: C50
          requested_start_date: '2026-08-01'
          requested_dose_mg: 100
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_id: $.data.id
      - call: POST /api/prior-authorizations/${auth_id}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
      trigger:
      - call: POST /api/claims
        payload:
          auth_id: ${auth_id}
          drug_id: ${drug_id}
          service_date: '2026-08-01'
          site_of_care: HOPD
          sourcing_path: BUY_AND_BILL
          j_code_billed: J4100
          billed_units: 5
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          claim_id: $.data.id
      assert:
      - InfusionClaim.${claim_id}.waste_units == 0 and jw_modifier == false (defaults)
      - payable_waste_units == 0; allowed_amount_cents == 2650 (round(5x500x1.06)); member_cost_share_cents == 530
  - name: get_nonexistent_claim_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - response_envelope
    distinguishing_aspect: GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND in the standard error envelope (response_type 'error',
      data.error_id + data.message).
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /api/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: PlanAdmin
        captures:
          err_id: $.data.error_id
      assert:
      - HTTP 404; error_id == ERR_NOT_FOUND
      - 'Envelope: response_type == ''error''; data contains error_id and message; meta contains api_request_id'
  - name: auth_computed_fields_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.PriorAuthorization.fields.administrations_used
    - entities.PriorAuthorization.fields.approved_dose_mg
    distinguishing_aspect: 'Client-supplied values for computed/system fields are ignored at creation: administrations_used stays 0 and approved_dose_mg
      stays null until approval.'
    test_recipe:
      setup:
      - Drug with ACTIVE policy C50; provider account
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J4200
          drug_name: CompDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
      - call: POST /api/provider-accounts
        payload:
          name: Comp Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      trigger:
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${drug_id}
          member_id: MEM-D2
          diagnosis_code: C50
          requested_start_date: '2026-08-01'
          requested_dose_mg: 100
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_id: $.data.id
      assert:
      - PriorAuthorization.${auth_id}.administrations_used == 0 regardless of any client attempt to seed it
      - approved_dose_mg is null; status == SUBMITTED; validity_start/validity_end are null until approval
  - name: claim_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.InfusionClaim.fields.site_of_care
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: An out-of-enum site_of_care value is a 400 ERR_INVALID_REQUEST before any state or business check runs.
    test_recipe:
      setup:
      - Empty DB (enum validation precedes existence of auth semantics for shape-level rejection is NOT assumed — a syntactically valid but unknown
        auth id with bad enum fails on request shape first)
      setup_api_calls: []
      trigger:
      - call: POST /api/claims
        payload:
          auth_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
          drug_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
          service_date: '2026-08-01'
          site_of_care: spaceship
          sourcing_path: BUY_AND_BILL
          j_code_billed: J0000
          billed_units: 1
        as: ProviderRep
        as_user_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        captures:
          err_id: $.data.error_id
      assert:
      - HTTP 400; error_id == ERR_INVALID_REQUEST (request-shape failure, not ERR_NOT_FOUND)
  - name: drug_missing_required_field_rejected
    claim_type: required_fields
    grounds:
    - entities.DrugCatalogEntry.fields.j_code
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /api/drugs without the required j_code field returns 400 ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/drugs
        payload:
          drug_name: NoCode
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 1000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          err_id: $.data.error_id
      assert:
      - HTTP 400; error_id == ERR_INVALID_REQUEST
  - name: forecast_run_immutable_no_version
    claim_type: immutability
    grounds:
    - entities.SpendForecastRun
    distinguishing_aspect: 'SpendForecastRun (common_fields: false) carries id + created_at only: no version and no updated_at keys appear, and
      no update endpoint exists.'
    test_recipe:
      setup:
      - Clock default; no pipeline drugs, no claims
      setup_api_calls: []
      trigger:
      - call: POST /api/spend-forecasts
        payload:
          variant: BASELINE
          horizon_years: 1
          enrollment_projection: 500000
        as: PharmacyAnalyst
        captures:
          run_id: $.data.id
      assert:
      - Response data has no 'version' and no 'updated_at' key
      - pipeline_total_cents == 0 and inline_annualized_cents == 0 and total_projected_cents == 0 (empty inputs)
      - GET /api/spend-forecasts/${run_id} returns the identical snapshot
- section: state_machines
  instances:
  - name: auth_terminal_lockdown_cancel_denied
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.PriorAuthorization.SUBMITTED_to_DENIED
    - errors[ERR_AUTH_NOT_CANCELLABLE]
    distinguishing_aspect: A DENIED (terminal) auth rejects cancel with ERR_AUTH_NOT_CANCELLABLE; no transition out of DENIED exists.
    test_recipe:
      setup:
      - Drug + provider + SUBMITTED auth (no policy needed for deny path — deny requires only SUBMITTED state)
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J4300
          drug_name: TermDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
      - call: POST /api/provider-accounts
        payload:
          name: Term Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${drug_id}
          member_id: MEM-T1
          diagnosis_code: C50
          requested_start_date: '2026-08-01'
          requested_dose_mg: 100
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_id: $.data.id
      - call: POST /api/prior-authorizations/${auth_id}/deny
        payload:
          reason: not medically necessary
        as: MedicalPolicyOfficer
      trigger:
      - call: POST /api/prior-authorizations/${auth_id}/cancel
        payload: {}
        as: MedicalPolicyOfficer
        captures:
          err_id: $.data.error_id
      assert:
      - error_id == ERR_AUTH_NOT_CANCELLABLE (409); auth remains DENIED with denial_reason intact
  - name: auth_approve_twice_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.PriorAuthorization.SUBMITTED_to_APPROVED
    - errors[ERR_AUTH_NOT_PENDING]
    distinguishing_aspect: 'Approving an already-APPROVED auth is not idempotent: second approve fails ERR_AUTH_NOT_PENDING.'
    test_recipe:
      setup:
      - 'Full approvable setup: drug, ACTIVE policy C50, provider, auth'
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J4400
          drug_name: TwiceDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
      - call: POST /api/provider-accounts
        payload:
          name: Twice Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${drug_id}
          member_id: MEM-T2
          diagnosis_code: C50
          requested_start_date: '2026-08-01'
          requested_dose_mg: 100
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_id: $.data.id
      - call: POST /api/prior-authorizations/${auth_id}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
      trigger:
      - call: POST /api/prior-authorizations/${auth_id}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
        captures:
          err_id: $.data.error_id
      assert:
      - error_id == ERR_AUTH_NOT_PENDING (409); administrations_used still 0; approved_dose_mg unchanged at 100
  - name: policy_activate_active_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.ClinicalPolicy.DRAFT_to_ACTIVE
    - errors[ERR_POLICY_NOT_DRAFT]
    distinguishing_aspect: Activating an already-ACTIVE policy fails ERR_POLICY_NOT_DRAFT (the OCC version may be fresh — the state gate is what
      fires).
    test_recipe:
      setup:
      - Drug with one ACTIVE policy (created ACTIVE); drug.version is 2 after that create
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J4500
          drug_name: PolDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
        captures:
          pol_id: $.data.id
      - call: GET /api/drugs/${drug_id}
        as: MedicalPolicyOfficer
        captures:
          drug_ver2: $.data.version
      trigger:
      - call: POST /api/clinical-policies/${pol_id}/activate
        payload:
          expected_drug_version: ${drug_ver2}
        as: MedicalPolicyOfficer
        captures:
          err_id: $.data.error_id
      assert:
      - error_id == ERR_POLICY_NOT_DRAFT (409); policy remains ACTIVE; drug.version unchanged (failed request must not bump)
  - name: claim_override_approve_not_pended_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.InfusionClaim.PENDED_to_APPROVED_FOR_PAYMENT
    - errors[ERR_CLAIM_NOT_PENDED]
    distinguishing_aspect: override-approve on an APPROVED_FOR_PAYMENT claim fails ERR_CLAIM_NOT_PENDED — the guard is the claim's own state,
      not the auth's.
    test_recipe:
      setup:
      - Full claim setup (drug rate 500, policy C50, provider, auth approved 100 mg max 4); one directly-approved claim
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J4600
          drug_name: OvrDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      - call: POST /api/asp-schedules
        payload:
          drug_id: ${drug_id}
          effective_start: '2026-01-01'
          asp_rate_cents: 500
        as: PlanAdmin
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
      - call: POST /api/provider-accounts
        payload:
          name: Ovr Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${drug_id}
          member_id: MEM-T3
          diagnosis_code: C50
          requested_start_date: '2026-08-01'
          requested_dose_mg: 100
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_id: $.data.id
      - call: POST /api/prior-authorizations/${auth_id}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
      - call: POST /api/claims
        payload:
          auth_id: ${auth_id}
          drug_id: ${drug_id}
          service_date: '2026-08-01'
          site_of_care: OFFICE
          sourcing_path: BUY_AND_BILL
          j_code_billed: J4600
          billed_units: 10
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          claim_id: $.data.id
      trigger:
      - call: POST /api/claims/${claim_id}/override-approve
        payload: {}
        as: MedicalPolicyOfficer
        captures:
          err_id: $.data.error_id
      assert:
      - error_id == ERR_CLAIM_NOT_PENDED (409); claim remains APPROVED_FOR_PAYMENT; administrations_used unchanged at 1
  - name: claim_pay_pended_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.InfusionClaim.APPROVED_FOR_PAYMENT_to_PAID
    - errors[ERR_CLAIM_NOT_PAYABLE]
    distinguishing_aspect: pay on a PENDED (dose-review) claim fails ERR_CLAIM_NOT_PAYABLE; the provider ledger is not credited.
    test_recipe:
      setup:
      - Full claim setup; claim billed 11 units (110 mg within tolerance of approved 100) lands PENDED
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J4700
          drug_name: PayDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      - call: POST /api/asp-schedules
        payload:
          drug_id: ${drug_id}
          effective_start: '2026-01-01'
          asp_rate_cents: 500
        as: PlanAdmin
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
      - call: POST /api/provider-accounts
        payload:
          name: Pay Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${drug_id}
          member_id: MEM-T4
          diagnosis_code: C50
          requested_start_date: '2026-08-01'
          requested_dose_mg: 100
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_id: $.data.id
      - call: POST /api/prior-authorizations/${auth_id}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
      - call: POST /api/claims
        payload:
          auth_id: ${auth_id}
          drug_id: ${drug_id}
          service_date: '2026-08-01'
          site_of_care: OFFICE
          sourcing_path: BUY_AND_BILL
          j_code_billed: J4700
          billed_units: 11
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          claim_id: $.data.id
      trigger:
      - call: POST /api/claims/${claim_id}/pay
        payload: {}
        as: PlanAdmin
        captures:
          err_id: $.data.error_id
      assert:
      - error_id == ERR_CLAIM_NOT_PAYABLE (409); claim remains PENDED with pend_reason DOSE_REVIEW
      - ProviderAccount.${prov_id}.cumulative_paid_cents == 0 (no ledger credit)
  - name: redirection_accept_twice_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.SiteOfCareRedirection.OFFERED_to_ACCEPTED
    - errors[ERR_REDIRECTION_NOT_OFFERED]
    distinguishing_aspect: Accepting an already-ACCEPTED redirection fails ERR_REDIRECTION_NOT_OFFERED; accepted_site and incentive stay as first
      recorded.
    test_recipe:
      setup:
      - Drug (rate 500 from 2026-01-01, unit 10, vial 100, VIAL, EITHER, max 2000, site_of_care_eligible true), ACTIVE policy C50 WITH requires_site_of_care_redirection
        true, provider, auth approved 100 mg (max 4) -> OFFERED redirection auto-created
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J4800
          drug_name: RedirDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: true
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      - call: POST /api/asp-schedules
        payload:
          drug_id: ${drug_id}
          effective_start: '2026-01-01'
          asp_rate_cents: 500
        as: PlanAdmin
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: true
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
      - call: POST /api/provider-accounts
        payload:
          name: Redir Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${drug_id}
          member_id: MEM-T5
          diagnosis_code: C50
          requested_start_date: '2026-08-01'
          requested_dose_mg: 100
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_id: $.data.id
      - call: POST /api/prior-authorizations/${auth_id}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
      - call: GET /api/redirections?auth_id=${auth_id}
        as: CaseManager
        captures:
          redir_id: $.data[0].id
      - call: POST /api/redirections/${redir_id}/accept
        payload:
          accepted_site: HOME
        as: CaseManager
      trigger:
      - call: POST /api/redirections/${redir_id}/accept
        payload:
          accepted_site: OFFICE
        as: CaseManager
        captures:
          err_id: $.data.error_id
      assert:
      - 'Second accept: error_id == ERR_REDIRECTION_NOT_OFFERED (409)'
