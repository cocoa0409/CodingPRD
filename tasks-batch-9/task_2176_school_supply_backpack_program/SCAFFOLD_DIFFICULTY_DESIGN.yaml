              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { po_id: $.data.id, subtotal: $.data.line_subtotal_cents, fee: $.data.admin_fee_cents }
          assert:
            - "PurchaseOrder.${po_id}.line_subtotal_cents == 50000"
            - "PurchaseOrder.${po_id}.admin_fee_cents == 4500"
            - "PurchaseOrder.${po_id}.total_cost_cents == 54500"

