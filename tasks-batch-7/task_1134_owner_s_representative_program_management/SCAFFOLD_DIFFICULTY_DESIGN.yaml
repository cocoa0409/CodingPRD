      - name: sod_beats_fiscal_on_contract_execute
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_AWARD_EXCEEDS_BUDGET]
        distinguishing_aspect: |
          Error-category pair {business_safety, business_fiscal}: executing as the
          same user id that began negotiation violates segregation of duties
          (priority 6) and the award also exceeds the uncommitted budget (priority
          10); ERR_SEGREGATION_OF_DUTIES must win, and re-executing as a different
          user surfaces ERR_AWARD_EXCEEDS_BUDGET — proving both checks exist.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 1000000, contingency 100000; CT1 UNDER_NEGOTIATION with negotiator pm-1"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-P3", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
