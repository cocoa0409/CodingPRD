  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_fiscal
        grounds:
          - "validations[priority=6]"
          - "validations[priority=10]"
          - "errors[ERR_RUN_NOT_PLANNED]"
          - "errors[ERR_CREDIT_LIMIT_EXCEEDED]"
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal on POST confirm: a CANCELLED
          run on an over-credit customer violates both priority 6 (run not PLANNED)
          and priority 10 (estimate 220000 > credit 1000); priority 6 must win, so
          the second confirm returns ERR_RUN_NOT_PLANNED, not ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Customer c2 credit_limit_cents 1000; formula f2 (ACID, NONE, min 500, rate 200, salt COPACKER 0.1 @50) auto-APPROVED via passed trial; kettle k1; run r1 planned 1000 (estimate would be 220000)"
