          crew_role: BOILER
        as: SugarhouseManager
        captures:
          boiler_id: $.data.id
      - call: POST /sugarhouse/crew-members/${boiler_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-02T08:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/weather-windows/${win_id}/open
        as: SugarhouseManager
      - call: POST /sugarhouse/sap-runs
        payload:
          sugarbush_id: ${bush_id}
          weather_window_id: ${win_id}
          collected_by: ${tapper_id}
          gallons_collected: 10.0
          measured_brix: 2.0
        as: FieldCrew
        as_user_id: ${tapper_id}
        captures:
          run_id: $.data.id
      - call: POST /sugarhouse/sap-runs/${run_id}/confirm
        as: FieldCrew
        as_user_id: ${tapper_id}
      - call: POST /sugarhouse/batches
        payload:
          season_id: ${season_id}
          boiled_by: ${boiler_id}
          evaporator_capacity_gal: 50
        as: SugarMaker
        as_user_id: ${boiler_id}
        captures:
          batch_id: $.data.id
      - call: POST /sugarhouse/batches/${batch_id}/intakes
        payload:
          sap_run_id: ${run_id}
          gallons_drawn: 10.0
        as: SugarMaker
        as_user_id: ${boiler_id}
      - call: POST /sugarhouse/batches/${batch_id}/start-boil
        as: SugarMaker
        as_user_id: ${boiler_id}
      trigger:
      - call: POST /sugarhouse/batches/${batch_id}/finish
        payload:
          finished_brix: 66.5
          measured_syrup_gallons: 0.22
        as: SugarMaker
        as_user_id: ${boiler_id}
        captures:
          st: $.data.status
      - call: GET /sugarhouse/syrup-lots?batch_id=${batch_id}
        as: SugarhouseManager
      assert:
      - 'finish response: status == FINISHED, yield_variance_pct == -4.35 (expected 0.23 vs measured 0.22)'
      - GET syrup-lots?batch_id returns the lot immediately with measured_gallons == 0.22
  - name: syrup_lot_exhausted_auto_transition
    claim_type: side_effect_execution
    grounds:
    - state_machines.SyrupLot.GRADED_to_EXHAUSTED
    excluded_because:
      difficulty_instance: packaging_exact_fit_exhaustion
      rationale: "Asserted as the end-state of the named \xA71.8 instance (unpackaged 0.00 -> EXHAUSTED)."
  - name: taps_rollup_leak_state_filter
    claim_type: input_set_filtering
    grounds:
    - calculations.taps_rollup
    excluded_because:
      difficulty_instance: vacuum_leak_cascade_depth4
      rationale: "The cascade instance asserts taps_set == 100 while taps_live == 0 with the line in LEAK \u2014 the status-set filter is exactly what is verified."
  - name: occ_window_declare_happy_path
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[weather-window-declare-stale-season]
    excluded_because:
      difficulty_instance: weather_window_half_open_overlap
      rationale: "Every window creation in \xA71.8 exercises the happy-path OCC check with a captured live version; the stale path is covered by occ_weather_window_stale_season in this file."
