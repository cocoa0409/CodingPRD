  # ==========================================================================
  # RULE 8 — resource_temporal_overlap
  # Instance (i)  interval semantics: HALF-OPEN custody spells, end-exclusive —
  #               the boundary instant is ACCEPTED. Resource: a Keg's custody timeline.
  # Instance (ii) interval semantics: CLOSED-at-both-ends intake windows —
  #               the boundary instant is REJECTED. Resource: a ServiceCenter's
  #               wash line, plus an aggregate occupancy count.
  # Deliberately opposite boundary conventions on different resource entities.
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: keg_custody_interval_half_open_boundary_accepted_interior_rejected
        grounds:
          - calculations.custody_interval_integrity
          - validations.priority_35_ERR_CUSTODY_INTERVAL_CONFLICT
          - entities.ScanEvent.fields.dwell_days_closed
          - entities.ScanEvent.fields.is_late_arrival
          - entities.Keg.fields.dwell_started_at
          - errors.ERR_CUSTODY_INTERVAL_CONFLICT
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN, [dwell_started_at, +inf), so the boundary instant
          itself is ACCEPTED. The resource is one Keg's custody timeline. A RETAIL scan at
          exactly the DISTRIBUTION instant is admitted (zero-length spell, dwell_days_closed 0,
          is_late_arrival false), a RETURN three hours EARLIER falls strictly inside the closed
          spell and is refused, and the same RETURN re-issued at the boundary instant is
          admitted. Instance (ii) uses the opposite convention on purpose.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z."
            - "Distributor with a BRONZE cooperation agreement so the accepted RETURN mints a checkable accrual."
            - "Pool with four kegs; one allocated and dispatched at 2026-08-01T01:00:00Z, filled at 02:00, distributed at 12:00."
            - "The DISTRIBUTION scan sets both dwell_started_at and distributor_custody_started_at to 2026-08-01T12:00:00Z, which is the boundary instant under test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /distributors"
              payload: { name: "Front Range Distributing", region_code: "CO", return_incentive_rate_cents_per_keg: 250 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { d1_id: "$.data.id" }
            - call: "POST /distributors/${d1_id}/cooperation-agreement"
              payload: { cooperation_tier: "BRONZE", effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO", restrict_threshold_pct: 25, freeze_threshold_pct: 10, restricted_max_kegs_per_order: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 10, per_fill_rate_cents: 2200, replenishment_threshold_pct: 20 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v1: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { io1_id: "$.data.id" }
            - call: "POST /issuance-orders/${io1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v1}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${io1_id}/dispatch"
              payload: { dispatched_at: "2026-08-01T01:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-01T02:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "DISTRIBUTION", party_type: "DISTRIBUTOR", scanned_at: "2026-08-01T12:00:00Z", brand_code_scanned: "RDG", distributor_id: "${d1_id}" }
              as: Distributor
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "RETAIL", party_type: "RETAIL_ACCOUNT", scanned_at: "2026-08-01T12:00:00Z", brand_code_scanned: "RDG", retail_account_code: "RA-88" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { retail_scan_id: "$.data.id" }
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "RETURN", party_type: "DISTRIBUTOR", scanned_at: "2026-08-01T09:00:00Z", brand_code_scanned: "RDG", distributor_id: "${d1_id}" }
              as: Distributor
              as_user_id: "${d1_id}"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "RETURN", party_type: "DISTRIBUTOR", scanned_at: "2026-08-01T12:00:00Z", brand_code_scanned: "RDG", distributor_id: "${d1_id}" }
              as: Distributor
              as_user_id: "${d1_id}"
              captures: { return_scan_id: "$.data.id" }
          assert:
            - "the RETAIL scan at exactly keg.dwell_started_at (2026-08-01T12:00:00Z) is ACCEPTED with 201: the interval is half-open and the boundary belongs to the open spell"
            - "ScanEvent.${retail_scan_id}.dwell_days_closed == 0 and is_late_arrival == false (equal, not strictly earlier, than last_scanned_at)"
            - "after the RETAIL scan Keg.${k1_id}.custody_state == AT_RETAIL, scan_count == 3 and distributor_custody_started_at == 2026-08-01T12:00:00Z (a RETAIL scan does not reset the distributor clock)"
            - "the RETURN at 2026-08-01T09:00:00Z returns 409 with error_id ERR_CUSTODY_INTERVAL_CONFLICT (09:00 falls strictly inside the already-closed 02:00-12:00 spell)"
            - "after the refusal Keg.${k1_id}.custody_state is STILL AT_RETAIL with scan_count == 3 and dwell_started_at == 2026-08-01T12:00:00Z"
            - "the RETURN re-issued at exactly 2026-08-01T12:00:00Z returns 201: Keg.${k1_id}.custody_state == IN_SERVICE and scan_count == 4"
            - "ScanEvent.${return_scan_id}.dwell_days_closed == 0 and Keg.${k1_id}.distributor_custody_started_at == null"
            - "the RETURN mints one RETURN_DWELL accrual with dwell_days == 0, tier_pct_bp == 10000, cooperation_multiplier_bp == 10000 and incentive_cents == 250"
            - "Keg.${k1_id}.cumulative_dwell_days == 0: all four spells are sub-day (1h, 10h, 0s, 0s) and dwell_days_closed always FLOORS to whole days, so nothing accumulates"
            - "Distributor.${d1_id}.total_returns_count == 1, on_time_returns_count == 1, on_time_return_pct == 100.00 and avg_dwell_days == 0.00"

      - name: service_center_closed_intake_window_and_aggregate_capacity
        grounds:
          - calculations.service_center_intake
          - validations.priority_36_ERR_INTAKE_WINDOW_CONFLICT
          - validations.priority_44_ERR_SERVICE_CAPACITY_EXCEEDED
          - entities.ServiceCenter.fields.intake_buffer_hours
          - entities.ServiceCenter.fields.open_cycle_count
          - state_machines.ServiceCycle.PRESSURE_TESTED_to_RELEASED
        distinguishing_aspect: |
          The OPPOSITE interval convention to instance (i) on a different resource entity: the
          wash-line intake window [received_at, received_at + buffer] is CLOSED at both ends,
          so a received_at exactly intake_buffer_hours after an existing intake is REJECTED and
          one millisecond later is accepted. The instance then layers a second, aggregate
          resource check on the same centre — an occupancy COUNT rather than a pairwise
          overlap — and shows that releasing one cycle frees exactly one slot, so a request
          refused for capacity succeeds unchanged afterwards.
        test_recipe:
          setup:
            - "Clock set to 2026-08-01T00:00:00Z for the first intake, then advanced to 2026-08-02T00:00:00Z so every later timestamp in the instance is in the past."
            - "Four kegs imported with initial_custody_state IN_SERVICE, so cycles can be opened without any scan traffic."
            - "ServiceCenter with concurrent_cycle_capacity 2 and intake_buffer_hours 4."
            - "cycle1 received at 2026-08-01T00:00:00Z reserves the closed window [00:00:00.000, 04:00:00.000]."
            - "Two technician user ids so the release of cycle1 satisfies validation 25."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO", restrict_threshold_pct: 25, freeze_threshold_pct: 10, restricted_max_kegs_per_order: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001", initial_custody_state: "IN_SERVICE" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002", initial_custody_state: "IN_SERVICE" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003", initial_custody_state: "IN_SERVICE" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k3_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004", initial_custody_state: "IN_SERVICE" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k4_id: "$.data.id" }
            - call: "POST /service-centers"
              payload: { name: "Denver Wash Line", region_code: "CO", concurrent_cycle_capacity: 2, intake_buffer_hours: 4 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { sc1_id: "$.data.id" }
            - call: "POST /service-cycles"
              payload: { keg_id: "${k1_id}", service_center_id: "${sc1_id}", received_at: "2026-08-01T00:00:00Z" }
              as: ServiceTechnician
              as_user_id: "tech-1"
              captures: { cyc1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /service-cycles"
              payload: { keg_id: "${k2_id}", service_center_id: "${sc1_id}", received_at: "2026-08-01T04:00:00.000Z" }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /service-cycles"
              payload: { keg_id: "${k2_id}", service_center_id: "${sc1_id}", received_at: "2026-08-01T04:00:00.001Z" }
              as: ServiceTechnician
              as_user_id: "tech-1"
              captures: { cyc2_id: "$.data.id" }
            - call: "POST /service-cycles"
              payload: { keg_id: "${k3_id}", service_center_id: "${sc1_id}", received_at: "2026-08-01T09:00:00Z" }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /service-cycles/${cyc1_id}/record-step"
              payload: { step: "CLEAN", occurred_at: "2026-08-01T10:00:00Z", caustic_cycle_minutes: 15 }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /service-cycles/${cyc1_id}/record-step"
              payload: { step: "INSPECT", occurred_at: "2026-08-01T11:00:00Z", inspection_result: "PASS" }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /service-cycles/${cyc1_id}/record-step"
              payload: { step: "PRESSURE_TEST", occurred_at: "2026-08-01T12:00:00Z", pressure_test_psi: 34, pressure_test_result: "PASS" }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /service-cycles/${cyc1_id}/release"
              payload: { released_at: "2026-08-01T13:00:00Z" }
