  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_laborder_cancel_terminal
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - state_machines.LabOrder.PLACED_to_CANCELLED
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): a cancel on an already-CANCELLED order
          that also references an EXHAUSTED eligibility fails the state check (priority 6,
          ERR_INVALID_STATE) before the fiscal check (priority 14) — state wins.
        test_recipe:
          setup:
            - "A benefit LabOrder cancelled once (now CANCELLED); its Eligibility MATERIALS pool was freed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
