      - name: disclosure_version_gate_on_publish_and_board
        claim_type: violation_to_error
        grounds:
          - validations[priority 11, ERR_DISCLOSURE_VERSION_UNSUPPORTED]
          - endpoints."POST /rate-cards/{id}/publish"
          - endpoints."GET /branches/{id}/rate-board"
        distinguishing_aspect: "The MIN_DISCLOSURE_TEXT_VERSION gate is enforced at publish time rather than at card creation: a card with disclosure_text_version 2 is created happily in DRAFT and only its publish attempt returns ERR_DISCLOSURE_VERSION_UNSUPPORTED, while a version-3 card publishes and the board reports min_disclosure_text_version 3."
        test_recipe:
          setup:
            - "Branch BR-EDI (NORTH) with the EUR profile and a 920000-micro mid."
            - "Card A carries disclosure_text_version 2, card B carries 3; card A is created first, so card B must cite the branch version card A's creation produced."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-EDI", name: "Edinburgh", region_code: "NORTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 2, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card_old: "$.data.id" }
            - call: "GET /branches/${br_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { br_v1: "$.data.version" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v1}" }
              as: TreasuryOfficer
              captures: { card_new: "$.data.id" }
          trigger:
            - call: "POST /rate-cards/${card_old}/publish"
              payload: {}
              as: TreasuryOfficer
              captures: { e_disc: "$.data.error_id" }
            - call: "POST /rate-cards/${card_new}/publish"
              payload: {}
