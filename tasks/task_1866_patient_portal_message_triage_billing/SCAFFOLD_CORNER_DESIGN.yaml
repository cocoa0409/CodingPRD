            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v4: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v4}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m}", status: "REQUESTED" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent2: "$.data[0].id", fee2: "$.data[0].disclosed_fee_cents" } }
            - { call: "GET /inbox/consent-records/${consent1}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { c1_st: "$.data.status" } }
            - { call: "POST /inbox/consent-records/${consent2}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "re-reviewed" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { cl_code: "$.data.code", cl_fee: "$.data.fee_cents" } }
          assert:
            - "consent1 disclosed_fee_cents == 5000 (pinned at determination with 8 minutes)"
            - "claim creation with 18 minutes (fee 8000 > disclosed 5000): error_id == ERR_DISCLOSED_FEE_EXCEEDED (422)"
            - "recovery: patient reply reopens, re-triage/assign/start-review, re-determination SUPERSEDES consent1 (${c1_st} == SUPERSEDED) and issues consent2 REQUESTED with disclosed_fee_cents == 8000 (18 minutes -> CPT_99422)"
            - "after consent2 GRANTED + complete: claim creation succeeds with code == CPT_99422, fee_cents == 8000"

      - name: evisit_dedupe_168h_window_boundary
        claim_type: temporal_validation
        grounds:
          - "validations[priority=23]"
          - "errors[ERR_EVISIT_DUPLICATE_WITHIN_7_DAYS]"
        distinguishing_aspect: "The 7-day dedupe window has an EXCLUSIVE lower bound: a prior CHARGEABLE message received exactly 168h earlier does NOT block, while one 1 second inside the window does."
        test_recipe:
          setup:
            - "M1 received 2026-08-03T10:00:00Z, determined CHARGEABLE (consent GRANTED)"
            - "M3 received 2026-08-10T09:59:59Z (triaged/assigned/in-review with 5 provider minutes, determine pending)"
            - "M2 received 2026-08-10T10:00:00Z (exactly 168h after M1; triaged/assigned/in-review with 5 provider minutes)"
          setup_api_calls:
