scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: signup_period_create_defaults_applied
        claim_type: defaults
        grounds: [entities.SignUpPeriod.fields.daily_ot_threshold_minutes, entities.SignUpPeriod.fields.weekly_ot_threshold_minutes]
        distinguishing_aspect: "Omitting optional thresholds on create applies documented defaults 480 and 2400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "Def", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
          trigger:
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "SignUpPeriod.${sup_id}.daily_ot_threshold_minutes == 480"
            - "SignUpPeriod.${sup_id}.weekly_ot_threshold_minutes == 2400"
            - "SignUpPeriod.${sup_id}.status == DRAFT"
            - "SignUpPeriod.${sup_id}.schedule_revision == 1"
            - "SignUpPeriod.${sup_id}.picked_through_rank == 0"

      - name: signup_period_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.SignUpPeriod.fields.spread_limit_minutes, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required spread_limit_minutes on create -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/sign-up-periods"
              payload: { name: "Bad", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: operator_get_not_found
        claim_type: not_found
        grounds: [entities.Operator, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent operator UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/operators/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: run_computed_fields_correct
        claim_type: computed_fields
        grounds: [entities.Run.fields.spread_minutes, entities.Run.fields.paid_minutes, calculations.run_paid_minutes]
        distinguishing_aspect: "spread/platform/paid minutes computed server-side; spread 300..800 = 500 >= 600? no, so paid == platform == 470."
        test_recipe:
          setup: ["SignUpPeriod S in DRAFT"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "CF", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "RC", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 800, platform_minutes: 470 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id, spread: $.data.spread_minutes, paid: $.data.paid_minutes }
          assert:
            - "Run.${run_id}.spread_minutes == 500"
            - "Run.${run_id}.platform_minutes == 470"
            - "Run.${run_id}.paid_minutes == 470 (no break credit; spread 500 < 600)"
            - "Run.${run_id}.status == CUT"

      - name: run_break_credit_at_spread_600
        claim_type: computed_fields
        grounds: [calculations.run_paid_minutes, entities.Run.fields.paid_minutes]
        distinguishing_aspect: "Boundary: spread exactly 600 triggers the paid_break_minutes credit (>= semantics)."
        test_recipe:
          setup: ["SignUpPeriod S in DRAFT with paid_break_minutes 30"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "BC", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "RB", service_date: "2026-09-07", pieces: [ { report_minutes: 100, release_minutes: 700, platform_minutes: 500 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id, paid: $.data.paid_minutes }
          assert:
            - "Run.${run_id}.spread_minutes == 600"
            - "Run.${run_id}.paid_minutes == 530 (500 platform + 30 break credit at spread >= 600)"

      - name: list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint returns limit/offset/total_count/has_more with defaults limit=10 offset=0."
        test_recipe:
          setup: ["two operators exist"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "A", hire_date: "2000-01-01" }
              as: SchedulingOfficer
            - call: "POST /api/operators"
              payload: { employee_number: "E2", full_name: "B", hire_date: "2001-01-01" }
              as: SchedulingOfficer
          trigger:
            - call: "GET /api/operators"
              payload: { limit: 1, offset: 0 }
              as: SchedulingOfficer
          assert:
            - "response data array length == 1"
            - "response includes total_count == 2 and has_more == true"

      - name: fk_reverse_reachability_runs_of_period
        claim_type: parent_relationships
        grounds: [entities.Run.fields.sign_up_period_id]
        distinguishing_aspect: "GET /api/sign-up-periods/{id}/runs returns exactly the runs of that period."
        test_recipe:
          setup: ["two periods, one run in first only"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "P1", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup1_id: $.data.id }
            - call: "POST /api/sign-up-periods"
              payload: { name: "P2", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup2_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup1_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
          trigger:
            - call: "GET /api/sign-up-periods/${sup2_id}/runs"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "response data array length == 0 for period ${sup2_id}"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: signup_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.SignUpPeriod]
        distinguishing_aspect: "New SignUpPeriod starts in DRAFT."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "IS", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id, st: $.data.status }
          trigger:
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "SignUpPeriod.${sup_id}.status == DRAFT"

      - name: invalid_transition_cut_runs_from_open
        claim_type: invalid_transition
        grounds: [state_machines.SignUpPeriod, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "cut-runs is only valid from DRAFT; invoking from OPEN -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["SignUpPeriod S in OPEN"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "IT", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: terminal_state_lockdown_implemented
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SignUpPeriod, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "IMPLEMENTED is terminal; open-picking from IMPLEMENTED -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["SignUpPeriod S IMPLEMENTED"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "TL", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/lock"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/implement"
              payload: {}
              as: SchedulingOfficer
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: over_spread_run_auto_withdrawn_at_cut
        claim_type: side_effect_execution
        grounds: [state_machines.Run.CUT_to_WITHDRAWN, calculations.run_paid_minutes]
        distinguishing_aspect: "Run with spread > spread_limit_minutes auto-transitions to WITHDRAWN at cut-runs, not VALIDATED."
        test_recipe:
          setup: ["SignUpPeriod DRAFT spread_limit 780; one run spread 800"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "OS", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "RX", service_date: "2026-09-07", pieces: [ { report_minutes: 0, release_minutes: 800, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/runs/${run_id}"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "Run.${run_id}.status == WITHDRAWN (spread 800 > 780)"

      - name: operator_suspend_withdraws_submitted_bids
        claim_type: side_effect_execution
        grounds: [state_machines.Operator.ACTIVE_to_SUSPENDED, state_machines.BidEntry.SUBMITTED_to_WITHDRAWN]
        distinguishing_aspect: "Suspending an operator cascades: their SUBMITTED bids in OPEN/PICKING sign-ups become WITHDRAWN."
        test_recipe:
          setup: ["SignUpPeriod OPEN; operator O with one SUBMITTED bid"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "SW", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01" }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /api/operators/${op_id}/suspend"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}" }
              as: SchedulingOfficer
          assert:
            - "Operator.${op_id}.status == SUSPENDED"
            - "BidEntry.${bid_id}.status == WITHDRAWN"

      - name: adjudicate_next_demotes_bidless_operator_to_board
        claim_type: side_effect_execution
        grounds: [state_machines.SignUpPeriod.PICKING_to_PICKING, state_machines.Operator.ACTIVE_to_EXTRA_BOARD]
        distinguishing_aspect: "Operator whose bids all reference unavailable runs is demoted to EXTRA_BOARD and fills the lowest OPEN slot."
        test_recipe:
          setup: ["SignUpPeriod PICKING with 1 run; operator O1 (rank1) wins it; operator O2 (rank2) bid only on that same run"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "DM", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, extra_board_ratio_pct: 100 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Senior", hire_date: "2000-01-01" }
              as: SchedulingOfficer
              captures: { op1_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E2", full_name: "Junior", hire_date: "2005-01-01" }
              as: SchedulingOfficer
              captures: { op2_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v1: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op1_id}", run_id: "${run_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v1}" }
              as: Operator
              as_user_id: "${op1_id}"
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v2: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op2_id}", run_id: "${run_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v2}" }
              as: Operator
              as_user_id: "${op2_id}"
            - call: "POST /api/sign-up-periods/${sup_id}/adjudicate-next"
              payload: {}
              as: SchedulingOfficer
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/adjudicate-next"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/operators/${op2_id}"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}/extra-board-slots"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "Operator.${op2_id}.status == EXTRA_BOARD"
            - "Operator.${op2_id}.board_position == 1"
            - "one ExtraBoardSlot has status FILLED with operator_id == ${op2_id}"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: seniority_tie_break_by_employee_number
        claim_type: correct_result
        grounds: [calculations.seniority_rank]
        distinguishing_aspect: "Equal hire_date ties break by employee_number ASC."
        test_recipe:
          setup: ["two operators same hire_date"]
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { employee_number: "E9", full_name: "High Num", hire_date: "2000-01-01" }
              as: SchedulingOfficer
              captures: { op_high: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Low Num", hire_date: "2000-01-01" }
              as: SchedulingOfficer
              captures: { op_low: $.data.id, rank_low: $.data.seniority_rank }
          trigger:
            - call: "GET /api/operators/${op_high}"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "Operator.${op_low}.seniority_rank == 1 (E1 < E9)"
            - "Operator.${op_high}.seniority_rank == 2"

      - name: pay_price_constants_applied
        claim_type: constants_applied
        grounds: [calculations.pay_price]
        distinguishing_aspect: "OT multiplier 1.5 applied: 100 OT minutes at 50c/min cost 7500 cents."
        test_recipe:
          setup: ["DailyAssignment A SCHEDULED; run platform 580; weekly prior 0"]
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "CT", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01" }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 880, platform_minutes: 580 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /api/sign-up-periods/${sup_id}/adjudicate-next"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/lock"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/implement"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/daily-assignments"
              payload: { operator_id: "${op_id}", sign_up_period_id: "${sup_id}" }
              as: SchedulingOfficer
              captures: { asg_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/daily-assignments/${asg_id}/close-out"
              payload: { actual_platform_minutes: 580 }
              as: PayrollClerk
            - call: "GET /api/daily-assignments/${asg_id}/pay-records"
              payload: {}
              as: PayrollClerk
          assert:
            - "FINAL PayRecord.straight_minutes == 480"
            - "FINAL PayRecord.overtime_minutes == 100"
            - "FINAL PayRecord.gross_cents == 31500 (480*50 + 100*75)"

      - name: ot_equalization_pick_lowest_accumulator
        claim_type: correct_result
        grounds: [calculations.ot_equalization_pick]
        distinguishing_aspect: "Among ACTIVE candidates the one with smallest weekly_ot_minutes_accum is selected for OT cover."
        excluded_because:
          difficulty_instance: absence_cover_three_hop_cascade
          rationale: "Selector exercised via the cascade instance's covering assignment; the pick order itself is asserted there by source==EXTRA_BOARD_FILL."

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role header -> 401 ERR_UNAUTHENTICATED on any endpoint."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/sign-up-periods"
              payload: {}
              as: "__NO_ROLE__"
