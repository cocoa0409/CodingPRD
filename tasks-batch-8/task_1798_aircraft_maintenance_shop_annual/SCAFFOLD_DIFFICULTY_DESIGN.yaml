              captures: { cii: $.data.id }
            - call: "POST /api/work-orders/${woi}/checklist-items/${cii}/record"
              payload: { result: "FAIL", inspected_by_mechanic_id: "${mi}" }
              as: Mechanic
              as_user_id: "${mi}"
            - call: "POST /api/work-orders/${woi}/complete-inspection"
              payload: {}
              as: Mechanic
              as_user_id: "${mi}"
            - call: "POST /api/work-orders/${woi}/submit-for-approval"
              payload: {}
