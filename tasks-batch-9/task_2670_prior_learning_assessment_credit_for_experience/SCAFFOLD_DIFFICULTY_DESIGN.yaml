            - call: "POST /portfolios/${pf_a}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "A-1", evidence_uri: "s3://ev/a1", outcome_mappings: [{ learning_outcome_id: "${oc204}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_a}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_a}/submit"
              as: Student
              as_user_id: "${stu_id}"
