scenario: |
  Generate task harder than expert level!

  2563. Assortment Planning & Open-to-Buy (retail merchandise planning): category role definition with financial targets for sales, margin and turn by department, assortment breadth and depth decisions across good-better-best tiers and store clusters, option count planning with size and color curve development, open-to-buy calculation by month with receipt planning against inventory and sales projections, in-season reforecasting with chase and cancel decisions against vendor lead times, carryover versus new item mix with lifecycle stage classification, localized assortment overlays by climate, demographics and store volume tier, plan versus actual variance review and reforecast governance
domain_name: assortment-planning-open-to-buy
api_prefix: "/otb"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  # graph: Vendor <-> Category is a true many-to-many via VendorAuthorization; OptionPlan is
  # a junction of CategoryPlan x StoreCluster x tier; LocalizationOverlay is a junction of
  # CategoryPlan x StoreCluster; ReceiptCommitment joins PlanMonth x AssortmentItem x Vendor.
  # No entity is addressed through a nested URL path — every collection is top-level under
  # /otb and every link is an explicit FK in the request body.
  state_machine_shape: compound
  # CategoryPlan is cyclic (DRAFT -> SUBMITTED -> APPROVED -> REFORECAST_OPEN -> SUBMITTED),
  # ReceiptCommitment carries two independent state dimensions on one row
  # (commit_status x fulfillment_status), AssortmentItem is a branching fork-join
  # (IN_SEASON -> {CHASED, CANCELLED_IN_SEASON} -> CLOSED), and CategoryPlan.otb_posture is a
  # derived aggregate that gates every child receipt operation.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  # The opaque X-User-ID that submits a CategoryPlan may not approve it, and the opaque
  # X-User-ID that proposes a ChaseCancelDecision may not approve it. VendorRep is
  # entity_backed and may only act on ReceiptCommitment rows whose vendor_id is its own id.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: merchandise department name
        constraints: "1..120 chars, required"
      - name: code
        type: string
        source: input
        description: short department code
        constraints: "2..8 chars, uppercase, unique across Department"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the financial targets belong to
        constraints: "2000..2100"
      - name: sales_target_cents
        type: integer
        source: input
        description: annual net sales target at retail, in cents
        constraints: ">= 1"
      - name: margin_target_bps
        type: integer
        source: input
        description: gross margin target in basis points of retail sales
        constraints: "0..9999"
      - name: turn_target_x100
        type: integer
        source: input
        description: inventory turn target multiplied by 100 (350 means 3.50 turns)
        constraints: ">= 1"

  - name: Category
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id; the department this category rolls up to"
      - name: name
        type: string
        source: input
        description: category name
        constraints: "1..120 chars, required"
      - name: code
        type: string
        source: input
        description: short category code
        constraints: "2..8 chars, uppercase, unique within department_id"
      - name: role
        type: enum
        source: input
        description: category role driving the receipt multiplier in receipt-budget planning
        constraints: "TRAFFIC_DRIVER | DESTINATION | CONVENIENCE | SEASONAL | OCCASIONAL"
      - name: sales_share_bps
        type: integer
        source: input
        description: share of department sales target this category is expected to carry, in bps
        constraints: "1..10000"

  - name: StoreCluster
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: store cluster name
        constraints: "1..120 chars, required"
      - name: climate_zone
        type: enum
        source: input
        description: climate band used by CLIMATE localization overlays
        constraints: "COLD | TEMPERATE | HOT"
      - name: demographic_index_bps
        type: integer
        source: input
        description: demographic productivity index in bps (10000 = chain average); drives CARRYOVER_BASIS sell-through
        constraints: "5000..20000"
      - name: volume_tier
        type: enum
        source: input
        description: store volume tier
        constraints: "A | B | C"
      - name: store_count
        type: integer
        source: input
        description: number of stores in the cluster
        constraints: ">= 1"
      - name: sales_index_bps
        type: integer
        source: input
        description: sales productivity index in bps (10000 = chain average); drives slot budget and unit allocation
        constraints: "3000..25000"

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: vendor legal name
        constraints: "1..160 chars, required"
      - name: code
        type: string
        source: input
        description: short vendor code
        constraints: "2..8 chars, uppercase, unique across Vendor"
      - name: status
        type: enum
        source: system
        description: authorization posture of the vendor
        default: PENDING
        constraints: "PENDING | AUTHORIZED | SUSPENDED"
      - name: lead_time_days
        type: integer
        source: input
        description: production plus transit lead time in days, used by every temporal feasibility check
        constraints: "1..365"
      - name: weekly_unit_capacity
        type: integer
        source: input
        description: maximum units the vendor can ship across all commitments whose ship windows overlap
        constraints: ">= 1"
      - name: min_order_units
        type: integer
        source: input
        description: minimum units accepted on a single ReceiptCommitment
        constraints: ">= 1"
      - name: cancel_cutoff_days
        type: integer
        source: input
        description: a COMMITTED commitment may only be cancelled this many days or more before ship_window_start
        constraints: "0..180"

  - name: VendorAuthorization
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the authorized vendor"
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; the category the vendor is authorized to supply"
      - name: max_open_units
        type: integer
        source: input
        description: ceiling on open (non-received, non-cancelled) units this vendor may hold for the category
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: authorization state; mirrors the vendor's authorization posture
        default: ACTIVE
        constraints: "ACTIVE | REVOKED"

  - name: CategoryPlan
    parent: null
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; the category being planned"
      - name: season_code
        type: enum
        source: input
        description: selling season the plan covers
        constraints: "SPRING | SUMMER | FALL | HOLIDAY"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year of the plan
        constraints: "2000..2100"
      - name: planned_sales_cents
        type: integer
        source: input
        description: planned net sales at retail for the season, in cents
        constraints: ">= 1"
      - name: planned_margin_bps
        type: integer
        source: input
        description: planned gross margin in bps; every retail-to-cost conversion in this scaffold uses (10000 - planned_margin_bps)
        constraints: "0..9999"
      - name: planned_turn_x100
        type: integer
        source: input
        description: planned inventory turn multiplied by 100
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: governance lifecycle state of the plan
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | REFORECAST_OPEN | CLOSED"
      - name: reforecast_round
        type: integer
        source: system
        description: number of reforecast cycles opened against this plan so far
        default: 0
        constraints: "0..3"
      - name: receipt_budget_cents
        type: integer
        source: computed
        description: seasonal receipt budget at cost, computed by calculations.plan_receipt_budget on approval; null before first approval
        default: null
      - name: otb_posture
        type: enum
        source: computed
        description: derived aggregate gate over all child receipt operations, computed by calculations.otb_posture
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: variance_status
        type: enum
        source: computed
        description: plan-versus-actual verdict computed by calculations.variance_verdict
        default: ON_PLAN
        constraints: "ON_PLAN | WATCH | BREACH"
      - name: sales_variance_bps
        type: integer
        source: computed
        description: signed sales variance to date in bps, computed by calculations.variance_verdict
        default: 0
      - name: open_ratio_bps
        type: integer
        source: computed
        description: ratio of aggregate open OTB to aggregate planned OTB in bps, computed by calculations.otb_posture
        default: 10000
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID captured on the most recent submit; null before first submit
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID captured on the most recent approve; null before first approval
        default: null

  - name: PlanMonth
    parent: null
    common_fields: true
    fields:
      - name: category_plan_id
        type: string
        source: input
        description: "FK -> CategoryPlan.id; the plan this month belongs to"
      - name: month_index
        type: integer
        source: input
        description: ordinal month within the season; unique within category_plan_id and the sole ordering key for waterfall allocation
        constraints: "1..12"
      - name: fiscal_month_label
        type: string
        source: input
        description: human label of the fiscal month, e.g. "2027-02"
        constraints: "exactly 7 chars, YYYY-MM"
      - name: first_receipt_date
        type: datetime
        source: input
        description: earliest date on which receipts may land in this month; used by every vendor lead-time feasibility test
      - name: bom_inventory_cents
        type: integer
        source: input
        description: beginning-of-month inventory at cost, in cents
        constraints: ">= 0"
      - name: planned_sales_cents
        type: integer
        source: input
        description: planned net sales at retail for the month, in cents
        constraints: ">= 0"
      - name: planned_markdown_cents
        type: integer
        source: input
        description: planned markdown dollars at cost for the month, in cents
        constraints: ">= 0"
      - name: planned_eom_cents
        type: integer
        source: input
        description: planned end-of-month inventory at cost, in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: month lifecycle state
        default: DRAFT
        constraints: "DRAFT | LOCKED_PLAN | IN_SEASON | CLOSED"
      - name: active_basis
        type: enum
        source: computed
        description: which variant of calculations.plan_month_open_to_buy currently persists into this row
        default: PLANNED_BASIS
        constraints: "PLANNED_BASIS | PROJECTED_BASIS"
      - name: provisional_sell_through_bps
        type: integer
        source: computed
        description: step S1 output of calculations.markdown_reserve
        default: 0
      - name: reserve_rate_bps
        type: integer
        source: computed
        description: step S2 output of calculations.markdown_reserve
        default: 0
      - name: markdown_reserve_cents
        type: integer
        source: computed
        description: step S3 output of calculations.markdown_reserve
        default: 0
      - name: otb_planned_cents
        type: integer
        source: computed
        description: planned open-to-buy at cost for the month under active_basis, from calculations.plan_month_open_to_buy
        default: 0
      - name: otb_committed_cents
        type: integer
        source: computed
        description: cost of open (not yet received, not cancelled) units on COMMITTED ReceiptCommitment rows for this month
        default: 0
      - name: otb_received_cents
        type: integer
        source: computed
        description: cost of received units on ReceiptCommitment rows for this month
        default: 0
      - name: otb_open_cents
        type: integer
        source: computed
        description: "otb_planned_cents - otb_committed_cents - otb_received_cents; may be negative and is never clamped"
        default: 0

  - name: OptionPlan
    parent: null
    common_fields: true
    fields:
      - name: category_plan_id
        type: string
        source: input
        description: "FK -> CategoryPlan.id; the plan this breadth/depth cell belongs to"
      - name: store_cluster_id
        type: string
        source: input
        description: "FK -> StoreCluster.id; the cluster this breadth/depth cell is planned for"
      - name: tier
        type: enum
        source: input
        description: good-better-best price tier; unique together with (category_plan_id, store_cluster_id)
        constraints: "GOOD | BETTER | BEST"
      - name: breadth_target
        type: integer
        source: input
        description: merchant-requested option count ceiling for the tier/cluster cell
        constraints: "1..200"
      - name: depth_units_per_option
        type: integer
        source: input
        description: units carried per option per store
        constraints: "1..500"
      - name: assumed_unit_cost_cents
        type: integer
        source: input
        description: planning cost per unit used to convert budget dollars into option slots
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: slotting state of the cell
        default: OPEN
        constraints: "OPEN | SLOTTED | CLOSED"
      - name: option_slots_total
        type: integer
        source: computed
        description: option count granted by calculations.option_slot_capacity when the cell is slotted; null while OPEN
        default: null
      - name: option_slots_assigned
        type: integer
        source: computed
        description: count of AssortmentItem rows on this cell whose status is in {ADOPTED, IN_SEASON, CHASED, CANCELLED_IN_SEASON}
        default: 0
      - name: option_slots_open
        type: integer
        source: computed
        description: "option_slots_total - option_slots_assigned; the conserved-quantity partner of option_slots_assigned"
        default: null
      - name: target_units_per_option
        type: integer
        source: computed
        description: total units per option across the cluster from calculations.cluster_size_allocation; null while OPEN
        default: null

  - name: SizeCurveCell
    parent: null
    common_fields: false
    fields:
      - name: option_plan_id
        type: string
        source: input
        description: "FK -> OptionPlan.id; the cell this size row belongs to"
      - name: size_label
        type: string
        source: input
        description: size label, unique within option_plan_id
        constraints: "1..12 chars"
      - name: size_sort_order
        type: integer
        source: input
        description: ascending display order; the sole tie-break for remainder assignment in calculations.cluster_size_allocation
        constraints: "1..99, unique within option_plan_id"
      - name: pct_bps
        type: integer
        source: input
        description: share of an option's units carried by this size, in bps; the set must sum to exactly 10000
        constraints: "1..10000"
      - name: raw_units_x10000
        type: integer
        source: computed
        description: unrounded per-cell unit demand multiplied by 10000, retained so the remainder tie-break is auditable
        default: 0
      - name: allocated_units
        type: integer
        source: computed
        description: whole units allocated to this size after per-cell rounding and remainder reconciliation
        default: 0

  - name: AssortmentItem
    parent: null
    common_fields: true
    fields:
      - name: option_plan_id
        type: string
        source: input
        description: "FK -> OptionPlan.id; the breadth/depth cell that holds this option's slot"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor that supplies this option"
      - name: sku_code
        type: string
        source: input
        description: style-color identifier, unique across AssortmentItem
        constraints: "3..24 chars"
      - name: color_code
        type: string
        source: input
        description: colorway code
        constraints: "2..8 chars"
      - name: lifecycle_stage
        type: enum
        source: input
        description: lifecycle classification; selects the sell-through variant and decides whether a freeze release restores the item
        constraints: "NEW | CARRYOVER | CORE | EXIT"
      - name: unit_cost_cents
        type: integer
        source: input
        description: landed unit cost used by chase allocation and by receipt commitments generated from decisions
        constraints: ">= 1"
      - name: retail_price_cents
        type: integer
        source: input
        description: planned first-ticket retail price
        constraints: ">= 1"
      - name: prior_season_sell_through_bps
        type: integer
        source: input
        description: prior-season sell-through in bps; required for CARRYOVER_BASIS, ignored by NEW_ITEM_BASIS
        default: 0
        constraints: "0..10000"
      - name: status
        type: enum
        source: system
        description: adoption and in-season lifecycle state
        default: PROPOSED
        constraints: "PROPOSED | DEFERRED | ADOPTED | IN_SEASON | CHASED | CANCELLED_IN_SEASON | CLOSED"
      - name: sell_through_basis
        type: enum
        source: computed
        description: which variant of calculations.item_sell_through_forecast produced sell_through_bps
        default: null
        constraints: "NEW_ITEM_BASIS | CARRYOVER_BASIS"
      - name: sell_through_bps
        type: integer
        source: computed
        description: forecast season sell-through in bps from calculations.item_sell_through_forecast
        default: null
      - name: effective_overlay_multiplier_bps
        type: integer
        source: computed
        description: resolved localization multiplier in bps from calculations.overlay_effective_multiplier
        default: 10000
      - name: planned_units
        type: integer
        source: computed
        description: units planned for this option across its cluster; equals OptionPlan.target_units_per_option at adoption time
        default: null

  - name: ReceiptCommitment
    parent: null
    common_fields: true
    fields:
      - name: plan_month_id
        type: string
        source: input
        description: "FK -> PlanMonth.id; the OTB month this commitment draws from"
      - name: assortment_item_id
        type: string
        source: input
        description: "FK -> AssortmentItem.id; the option being bought"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; denormalized from the item so VendorRep ownership is a single-field comparison"
      - name: units
        type: integer
        source: input
        description: units committed
        constraints: ">= 1"
      - name: unit_cost_cents
        type: integer
        source: input
        description: negotiated unit cost for this commitment; may differ from AssortmentItem.unit_cost_cents
        constraints: ">= 1"
      - name: ship_window_start
        type: datetime
        source: input
        description: inclusive start of the vendor ship window
      - name: ship_window_end
        type: datetime
        source: input
        description: exclusive end of the vendor ship window; half-open interval semantics
      - name: origin
        type: enum
        source: system
        description: whether the commitment was placed by a buyer or generated by an approved chase decision
        default: BUYER
        constraints: "BUYER | CHASE_DECISION"
      - name: commit_status
        type: enum
        source: system
        description: financial dimension of the commitment; evolves independently of fulfillment_status
        default: PROPOSED
        constraints: "PROPOSED | COMMITTED | WITHDRAWN | CANCELLED | CLOSED"
      - name: fulfillment_status
        type: enum
        source: system
        description: physical dimension of the commitment; evolves independently of commit_status
        default: AWAITING_SHIP
        constraints: "AWAITING_SHIP | SHIPPED | PARTIALLY_RECEIVED | RECEIVED | VOID"
      - name: received_units
        type: integer
        source: system
        description: cumulative units received against this commitment
        default: 0
      - name: cancelled_units
        type: integer
        source: system
        description: units removed by cancellation
        default: 0
      - name: cost_cents
        type: integer
        source: computed
        description: "units * unit_cost_cents; the gross cost the commitment claims from its month"
        default: 0
      - name: open_cost_cents
        type: integer
        source: computed
        description: "(units - received_units - cancelled_units) * unit_cost_cents; feeds PlanMonth.otb_committed_cents"
        default: 0
      - name: received_cost_cents
        type: integer
        source: computed
        description: "received_units * unit_cost_cents; feeds PlanMonth.otb_received_cents"
        default: 0

  - name: ActualsPost
    parent: null
    common_fields: false
    fields:
      - name: plan_month_id
        type: string
        source: input
        description: "FK -> PlanMonth.id; the month the week rolls into"
      - name: week_index
        type: integer
        source: input
        description: week within the fiscal month; unique within plan_month_id and the sole chronological replay key
        constraints: "1..4"
      - name: actual_sales_cents
        type: integer
        source: input
        description: actual net sales at retail for the week, in cents
        constraints: ">= 0"
      - name: actual_receipts_cents
        type: integer
        source: input
        description: actual receipts at cost for the week, in cents
        constraints: ">= 0"
      - name: actual_units_received
        type: integer
        source: input
        description: actual units received for the week
        constraints: ">= 0"

  - name: ReforecastCycle
    parent: null
    common_fields: true
    fields:
      - name: category_plan_id
        type: string
        source: input
        description: "FK -> CategoryPlan.id; the plan under reforecast"
      - name: round_index
        type: integer
        source: system
        description: CategoryPlan.reforecast_round at the moment this cycle was opened
        constraints: "1..3"
      - name: trigger_reason
        type: enum
        source: system
        description: what caused the cycle to open
        constraints: "VARIANCE_BREACH | DIRECTOR_REQUEST"
      - name: opened_at_utc
        type: datetime
        source: system
        description: logical clock reading when the cycle opened
      - name: snapshot_sales_variance_bps
        type: integer
        source: system
        description: CategoryPlan.sales_variance_bps frozen at open time
        default: 0
      - name: status
        type: enum
        source: system
        description: cycle governance state
        default: OPEN
        constraints: "OPEN | DECIDED | CLOSED | ABANDONED"

  - name: ChaseCancelDecision
    parent: null
    common_fields: true
    fields:
      - name: reforecast_cycle_id
        type: string
        source: input
        description: "FK -> ReforecastCycle.id; the cycle this decision belongs to"
      - name: assortment_item_id
        type: string
        source: input
        description: "FK -> AssortmentItem.id; the option being chased or cancelled"
      - name: action
        type: enum
        source: input
        description: direction of the in-season correction
        constraints: "CHASE | CANCEL | HOLD"
      - name: requested_units
        type: integer
        source: input
        description: units the merchant asks to add (CHASE) or remove (CANCEL); must be 0 for HOLD
        constraints: ">= 0"
      - name: rationale
        type: string
        source: input
        description: free-text justification retained for governance audit
        constraints: "1..400 chars"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID captured at proposal; the approver's X-User-ID must differ from it
      - name: approved_units
        type: integer
        source: computed
        description: units actually allocated by calculations.chase_cancel_allocation at approval; null while PROPOSED
        default: null
      - name: status
        type: enum
        source: system
        description: decision governance state
        default: PROPOSED
        constraints: "PROPOSED | APPROVED | REJECTED"

  - name: LocalizationOverlay
    parent: null
    common_fields: true
    fields:
      - name: category_plan_id
        type: string
        source: input
        description: "FK -> CategoryPlan.id; the plan the overlay localizes"
      - name: store_cluster_id
        type: string
        source: input
        description: "FK -> StoreCluster.id; the cluster the overlay applies to; the overlap resource"
      - name: overlay_type
        type: enum
        source: input
        description: which localization dimension the overlay expresses; also fixes its position in the application order
        constraints: "CLIMATE | DEMOGRAPHIC | VOLUME"
      - name: effective_start
        type: datetime
        source: input
        description: inclusive start of the overlay window
      - name: effective_end
        type: datetime
        source: input
        description: inclusive end of the overlay window; closed-interval semantics plus a 7-day separation buffer
      - name: unit_multiplier_bps
        type: integer
        source: input
        description: multiplier applied to unit and sell-through planning for the cluster, in bps
        constraints: "5000..15000"
      - name: status
        type: enum
        source: system
        description: overlay lifecycle state
        default: DRAFT
        constraints: "DRAFT | ACTIVE | EXPIRED | SUPERSEDED"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Vendor
    state_field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /otb/vendors/{id}/status with status=AUTHORIZED"
        actor: MerchOpsAdmin
        preconditions:
          - "vendor.status == PENDING"
        side_effects:
          - "vendor.status := AUTHORIZED"
          - "increments Vendor.version by 1"
        note: "A vendor must be AUTHORIZED before any ReceiptCommitment against it may be committed."
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /otb/vendors/{id}/status with status=SUSPENDED"
        actor: MerchOpsAdmin
        preconditions:
          - "vendor.status == AUTHORIZED"
        side_effects:
          - "vendor.status := SUSPENDED"
          - "every VendorAuthorization with vendor_id == vendor.id and status == ACTIVE is set to REVOKED"
          - "increments Vendor.version by 1"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /otb/vendors/{id}/status with status=AUTHORIZED"
        actor: MerchOpsAdmin
        preconditions:
          - "vendor.status == SUSPENDED"
        side_effects:
          - "vendor.status := AUTHORIZED"
          - "every VendorAuthorization with vendor_id == vendor.id and status == REVOKED is restored to ACTIVE"
          - "increments Vendor.version by 1"
        note: "Cyclic AUTHORIZED <-> SUSPENDED; reinstatement restores exactly the authorizations the suspension revoked."

  - entity: CategoryPlan
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /otb/category-plans/{id}/submit"
        actor: MerchandisePlanner
        preconditions:
          - "plan.status == DRAFT"
          - "at least one PlanMonth exists with category_plan_id == plan.id"
          - "at least one OptionPlan exists with category_plan_id == plan.id"
        side_effects:
          - "plan.status := SUBMITTED"
          - "plan.submitted_by_user_id := X-User-ID of the submitting planner"
          - "increments CategoryPlan.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /otb/category-plans/{id}/reject"
        actor: PlanningDirector
        preconditions:
          - "plan.status == SUBMITTED"
          - "X-User-ID != plan.submitted_by_user_id"
        side_effects:
          - "plan.status := DRAFT"
          - "every PlanMonth with category_plan_id == plan.id and status == LOCKED_PLAN reverts to DRAFT, and its otb_planned_cents, otb_open_cents, markdown_reserve_cents, provisional_sell_through_bps and reserve_rate_bps reset to 0"
          - "every OptionPlan with category_plan_id == plan.id and status == SLOTTED reverts to OPEN with option_slots_total, option_slots_open and target_units_per_option reset to null"
          - "increments CategoryPlan.version by 1"
        note: "Revision loop: SUBMITTED -> DRAFT -> SUBMITTED is unbounded and does not consume a reforecast round."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /otb/category-plans/{id}/approve"
        actor: PlanningDirector
        preconditions:
          - "plan.status == SUBMITTED"
          - "X-User-ID != plan.submitted_by_user_id"
          - "calculations.plan_receipt_budget yields a value > 0"
        side_effects:
          - "CASCADE-B link 1: plan.status := APPROVED, plan.approved_by_user_id := X-User-ID, plan.receipt_budget_cents := calculations.plan_receipt_budget, increments CategoryPlan.version by 1"
          - "CASCADE-B link 2 (caused by link 1 pinning receipt_budget_cents): every PlanMonth with category_plan_id == plan.id and status == DRAFT transitions DRAFT -> LOCKED_PLAN, and calculations.markdown_reserve then calculations.plan_month_open_to_buy (PLANNED_BASIS) write provisional_sell_through_bps, reserve_rate_bps, markdown_reserve_cents, otb_planned_cents, otb_committed_cents, otb_received_cents and otb_open_cents on each"
          - "CASCADE-B link 3 (caused by link 2 creating the first LOCKED_PLAN months): calculations.otb_posture re-runs over the newly LOCKED_PLAN months and writes plan.open_ratio_bps and plan.otb_posture, incrementing CategoryPlan.version by 1 again"
          - "CASCADE-B link 4 (caused by link 3 leaving otb_posture != FROZEN): every OptionPlan with category_plan_id == plan.id and status == OPEN transitions OPEN -> SLOTTED and calculations.option_slot_capacity writes option_slots_total and option_slots_open on each; if link 3 produced FROZEN no OptionPlan is slotted"
          - "CASCADE-B link 5 (caused by link 4 slotting the cells): for every OptionPlan slotted in link 4, calculations.cluster_size_allocation writes target_units_per_option on the OptionPlan and raw_units_x10000 plus allocated_units on each of its SizeCurveCell rows"
      - from: APPROVED
        to: REFORECAST_OPEN
        trigger: "POST /otb/category-plans/{id}/reforecasts, or system event when calculations.variance_verdict yields BREACH on a POST /otb/actuals-posts"
        actor: MerchandisePlanner | system
        preconditions:
          - "plan.status == APPROVED"
          - "plan.reforecast_round < 3"
          - "no ReforecastCycle with category_plan_id == plan.id has status == OPEN or status == DECIDED"
        side_effects:
          - "plan.status := REFORECAST_OPEN"
          - "plan.reforecast_round := plan.reforecast_round + 1"
          - "a ReforecastCycle is created with round_index := plan.reforecast_round, status OPEN, opened_at_utc := logical clock, snapshot_sales_variance_bps := plan.sales_variance_bps, and trigger_reason VARIANCE_BREACH for the system event or DIRECTOR_REQUEST for the explicit endpoint"
          - "every LocalizationOverlay with category_plan_id == plan.id and status == ACTIVE is set to SUPERSEDED"
          - "increments CategoryPlan.version by 1"
      - from: REFORECAST_OPEN
        to: SUBMITTED
        trigger: "POST /otb/category-plans/{id}/submit"
        actor: MerchandisePlanner
        preconditions:
          - "plan.status == REFORECAST_OPEN"
          - "every ReforecastCycle with category_plan_id == plan.id has status in {CLOSED, ABANDONED}"
        side_effects:
          - "plan.status := SUBMITTED"
          - "plan.submitted_by_user_id := X-User-ID of the submitting planner"
          - "increments CategoryPlan.version by 1"
        note: "Closes the cycle DRAFT -> SUBMITTED -> APPROVED -> REFORECAST_OPEN -> SUBMITTED -> APPROVED; the plan re-enters APPROVED through the same approve transition."
      - from: APPROVED
        to: CLOSED
        trigger: "POST /otb/category-plans/{id}/close"
        actor: PlanningDirector
        preconditions:
          - "plan.status in {APPROVED, REFORECAST_OPEN}"
          - "no ReceiptCommitment for any PlanMonth of this plan has commit_status == PROPOSED"
        side_effects:
          - "plan.status := CLOSED"
          - "every PlanMonth with category_plan_id == plan.id and status in {DRAFT, LOCKED_PLAN, IN_SEASON} transitions to CLOSED"
          - "every OptionPlan with category_plan_id == plan.id and status in {OPEN, SLOTTED} transitions to CLOSED"
          - "every ReforecastCycle with category_plan_id == plan.id and status == OPEN transitions to ABANDONED"
          - "increments CategoryPlan.version by 1"
        note: "This row collapses two source states: season end closes an APPROVED plan, and a director may also abandon a reforecast round outright by closing a REFORECAST_OPEN plan, with identical preconditions and side effects. `from: APPROVED` names the representative source; the precondition set is normative. The REFORECAST_OPEN source is what makes ReforecastCycle.ABANDONED reachable - a cycle is OPEN or DECIDED only while its plan sits in REFORECAST_OPEN, so no APPROVED plan ever carries an OPEN cycle."

  - entity: PlanMonth
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: LOCKED_PLAN
        trigger: "system event on CategoryPlan SUBMITTED -> APPROVED (cascade-B link 2)"
        actor: system
        preconditions:
          - "parent CategoryPlan.status transitions to APPROVED in the same request"
          - "month.status == DRAFT"
        side_effects:
          - "month.status := LOCKED_PLAN"
          - "recompute calculations.markdown_reserve then calculations.plan_month_open_to_buy under PLANNED_BASIS"
          - "increments PlanMonth.version by 1"
      - from: LOCKED_PLAN
        to: DRAFT
        trigger: "system event on CategoryPlan SUBMITTED -> DRAFT (reject)"
        actor: system
        preconditions:
          - "month.status == LOCKED_PLAN"
        side_effects:
          - "month.status := DRAFT"
          - "otb_planned_cents, otb_open_cents, markdown_reserve_cents, provisional_sell_through_bps and reserve_rate_bps reset to 0"
          - "increments PlanMonth.version by 1"
      - from: LOCKED_PLAN
        to: IN_SEASON
        trigger: "POST /otb/plan-months/{id}/open-season"
        actor: MerchandisePlanner
        preconditions:
          - "month.status == LOCKED_PLAN"
          - "parent CategoryPlan.status == APPROVED"
        side_effects:
          - "month.status := IN_SEASON"
          - "month.active_basis stays PLANNED_BASIS until the first ActualsPost for this month exists"
          - "increments PlanMonth.version by 1"
        note: "Cross-entity guard: a month may not open for selling while its plan is DRAFT, SUBMITTED, REFORECAST_OPEN or CLOSED."
      - from: IN_SEASON
        to: CLOSED
        trigger: "system event on CategoryPlan APPROVED -> CLOSED"
        actor: system
        preconditions:
          - "month.status in {DRAFT, LOCKED_PLAN, IN_SEASON}"
        side_effects:
          - "month.status := CLOSED"
          - "increments PlanMonth.version by 1"
        note: "This row collapses three source states: the plan-close cascade drives DRAFT -> CLOSED, LOCKED_PLAN -> CLOSED and IN_SEASON -> CLOSED with identical preconditions and side effects. `from: IN_SEASON` names the representative source; the precondition set is normative."

  - entity: OptionPlan
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SLOTTED
        trigger: "system event on CategoryPlan SUBMITTED -> APPROVED (cascade-B link 4)"
        actor: system
        preconditions:
          - "cell.status == OPEN"
          - "parent CategoryPlan.otb_posture != FROZEN after cascade-B link 3"
          - "at least one SizeCurveCell exists with option_plan_id == cell.id"
        side_effects:
          - "cell.status := SLOTTED"
          - "option_slots_total := calculations.option_slot_capacity; option_slots_open := option_slots_total - option_slots_assigned"
          - "target_units_per_option := calculations.cluster_size_allocation.target_units and every child SizeCurveCell gets raw_units_x10000 and allocated_units"
          - "increments OptionPlan.version by 1"
      - from: SLOTTED
        to: OPEN
        trigger: "system event on CategoryPlan SUBMITTED -> DRAFT (reject)"
        actor: system
        preconditions:
          - "cell.status == SLOTTED"
        side_effects:
          - "cell.status := OPEN"
          - "option_slots_total, option_slots_open and target_units_per_option reset to null"
          - "increments OptionPlan.version by 1"
      - from: SLOTTED
        to: CLOSED
        trigger: "system event on CategoryPlan APPROVED -> CLOSED"
        actor: system
        preconditions:
          - "cell.status in {OPEN, SLOTTED}"
        side_effects:
          - "cell.status := CLOSED"
          - "increments OptionPlan.version by 1"
        note: "This row collapses two source states: the plan-close cascade drives OPEN -> CLOSED and SLOTTED -> CLOSED with identical preconditions and side effects. `from: SLOTTED` names the representative source; the precondition set is normative."

  - entity: AssortmentItem
    state_field: status
    initial_state: PROPOSED
    terminal_states: [CLOSED]
    transitions:
      - from: PROPOSED
        to: DEFERRED
        trigger: "system event when calculations.otb_posture flips CategoryPlan.otb_posture to FROZEN (cascade-A link 4 in the reverse direction)"
        actor: system
        preconditions:
          - "item.status == PROPOSED"
          - "the OptionPlan referenced by item.option_plan_id belongs to the plan whose posture just became FROZEN"
        side_effects:
          - "item.status := DEFERRED"
          - "increments AssortmentItem.version by 1"
        note: "Freeze demotes only PROPOSED items; ADOPTED and IN_SEASON items are untouched because they already hold slots."
      - from: DEFERRED
        to: PROPOSED
        trigger: "system event when calculations.otb_posture moves CategoryPlan.otb_posture out of FROZEN (cascade-A link 4)"
        actor: system
        preconditions:
          - "item.status == DEFERRED"
          - "item.lifecycle_stage in {CARRYOVER, CORE}"
        side_effects:
          - "item.status := PROPOSED"
          - "increments AssortmentItem.version by 1"
        note: "Conditional cascade: items with lifecycle_stage NEW or EXIT stay DEFERRED when the freeze lifts and must be re-proposed by an explicit create."
      - from: PROPOSED
        to: ADOPTED
        trigger: "POST /otb/assortment-items/{id}/adopt"
        actor: CategoryBuyer
        preconditions:
          - "item.status == PROPOSED"
          - "the OptionPlan referenced by item.option_plan_id has status == SLOTTED"
          - "that OptionPlan.option_slots_open >= 1"
          - "the CategoryPlan referenced by that OptionPlan.category_plan_id has status in {APPROVED, REFORECAST_OPEN}"
        side_effects:
          - "item.status := ADOPTED"
          - "item.planned_units := OptionPlan.target_units_per_option"
          - "item.effective_overlay_multiplier_bps := calculations.overlay_effective_multiplier"
          - "item.sell_through_basis and item.sell_through_bps := calculations.item_sell_through_forecast"
          - "OptionPlan.option_slots_assigned += 1 and OptionPlan.option_slots_open -= 1 (conserved: option_slots_total unchanged)"
          - "increments AssortmentItem.version by 1 and OptionPlan.version by 1"
      - from: ADOPTED
        to: IN_SEASON
        trigger: "POST /otb/assortment-items/{id}/activate"
        actor: CategoryBuyer
        preconditions:
          - "item.status == ADOPTED"
          - "at least one PlanMonth of the item's CategoryPlan has status == IN_SEASON"
        side_effects:
          - "item.status := IN_SEASON"
          - "increments AssortmentItem.version by 1"
      - from: IN_SEASON
        to: CHASED
        trigger: "system event on POST /otb/chase-cancel-decisions/{id}/approve where action == CHASE and approved_units > 0"
        actor: system
        preconditions:
          - "item.status == IN_SEASON"
        side_effects:
          - "item.status := CHASED"
          - "item.planned_units += decision.approved_units"
          - "one ReceiptCommitment with origin CHASE_DECISION, commit_status COMMITTED and fulfillment_status AWAITING_SHIP is created per month bucket that received units in calculations.chase_cancel_allocation"
          - "increments AssortmentItem.version by 1"
        note: "CHASE branch of the fork; adds units and debits OTB."
      - from: IN_SEASON
        to: CANCELLED_IN_SEASON
        trigger: "system event on POST /otb/chase-cancel-decisions/{id}/approve where action == CANCEL and approved_units > 0"
        actor: system
        preconditions:
          - "item.status == IN_SEASON"
        side_effects:
          - "item.status := CANCELLED_IN_SEASON"
          - "item.planned_units -= decision.approved_units"
          - "the item's COMMITTED ReceiptCommitment rows have cancelled_units raised in month_index DESC order until approved_units is exhausted; any row whose open units reach 0 moves commit_status COMMITTED -> CANCELLED"
          - "increments AssortmentItem.version by 1"
        note: "CANCEL branch of the fork; removes units and credits OTB. The two branches write disjoint side-effect sets and both converge on CLOSED."
      - from: CHASED
        to: CLOSED
        trigger: "POST /otb/assortment-items/{id}/close"
        actor: CategoryBuyer
        preconditions:
          - "item.status in {ADOPTED, IN_SEASON, CHASED, CANCELLED_IN_SEASON}"
          - "no ReceiptCommitment with assortment_item_id == item.id has commit_status in {PROPOSED, COMMITTED}"
        side_effects:
          - "item.status := CLOSED"
          - "OptionPlan.option_slots_assigned -= 1 and OptionPlan.option_slots_open += 1 (conserved: option_slots_total unchanged)"
          - "increments AssortmentItem.version by 1 and OptionPlan.version by 1"
        note: "Join point of the fork: CHASED, CANCELLED_IN_SEASON, IN_SEASON and ADOPTED all reach CLOSED through this single edge, and the slot release is identical on every path. This row therefore collapses four source states: close is accepted from any of those four with identical preconditions and side effects, and is rejected with ERR_INVALID_STATE from PROPOSED, DEFERRED and CLOSED. `from: CHASED` names the representative source; the precondition set above is normative."

  - entity: ReceiptCommitment
    state_field: commit_status
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, CANCELLED, CLOSED]
    transitions:
      - from: PROPOSED
        to: COMMITTED
        trigger: "POST /otb/receipt-commitments/{id}/commit"
        actor: CategoryBuyer
        preconditions:
          - "commitment.commit_status == PROPOSED"
          - "the Vendor referenced by commitment.vendor_id has status == AUTHORIZED"
          - "a VendorAuthorization with status == ACTIVE links commitment.vendor_id to the plan's category_id"
          - "the PlanMonth referenced by commitment.plan_month_id has status in {LOCKED_PLAN, IN_SEASON}"
          - "the CategoryPlan of that month has otb_posture != FROZEN"
          - "commitment.cost_cents <= PlanMonth.otb_open_cents"
        side_effects:
          - "commitment.commit_status := COMMITTED; open_cost_cents := (units - received_units - cancelled_units) * unit_cost_cents"
          - "PlanMonth.otb_committed_cents and PlanMonth.otb_open_cents recomputed by calculations.plan_month_open_to_buy; increments PlanMonth.version by 1"
          - "CategoryPlan.open_ratio_bps and otb_posture recomputed by calculations.otb_posture; increments CategoryPlan.version by 1"
          - "if the recomputed posture is FROZEN, every AssortmentItem with status == PROPOSED under that plan transitions PROPOSED -> DEFERRED"
          - "increments ReceiptCommitment.version by 1"
        note: "commit_status dimension only; fulfillment_status is untouched and stays AWAITING_SHIP."
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /otb/receipt-commitments/{id}/cancel"
        actor: CategoryBuyer
        preconditions:
          - "commitment.commit_status == PROPOSED"
        side_effects:
          - "commitment.commit_status := WITHDRAWN; fulfillment_status := VOID; cancelled_units := units; open_cost_cents := 0"
          - "increments ReceiptCommitment.version by 1"
        note: "A PROPOSED commitment never entered otb_committed_cents, so withdrawal touches no month or plan field."
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /otb/receipt-commitments/{id}/cancel"
        actor: CategoryBuyer
        preconditions:
          - "commitment.commit_status == COMMITTED"
          - "logical clock <= commitment.ship_window_start minus Vendor.cancel_cutoff_days"
        side_effects:
          - "CASCADE-A link 1: commitment.commit_status := CANCELLED; cancelled_units := units - received_units; open_cost_cents := 0; fulfillment_status := VOID when received_units == 0; increments ReceiptCommitment.version by 1"
          - "CASCADE-A link 2 (caused by link 1 zeroing open_cost_cents): PlanMonth.otb_committed_cents drops by the released amount and PlanMonth.otb_open_cents rises by the same amount via calculations.plan_month_open_to_buy; increments PlanMonth.version by 1"
          - "CASCADE-A link 3 (caused by link 2 changing otb_open_cents): calculations.otb_posture re-runs and writes CategoryPlan.open_ratio_bps and CategoryPlan.otb_posture; increments CategoryPlan.version by 1"
          - "CASCADE-A link 4 (caused by link 3 moving otb_posture out of FROZEN): every AssortmentItem under that plan with status == DEFERRED and lifecycle_stage in {CARRYOVER, CORE} transitions DEFERRED -> PROPOSED; NEW and EXIT items stay DEFERRED"
          - "invariant: after link 2 the identity otb_open_cents + otb_committed_cents + otb_received_cents == otb_planned_cents holds exactly on the affected PlanMonth"
      - from: COMMITTED
        to: CLOSED
        trigger: "system event on POST /otb/receipt-commitments/{id}/receipts when received_units reaches units"
        actor: system
        preconditions:
          - "commitment.commit_status == COMMITTED"
          - "commitment.received_units == commitment.units"
        side_effects:
          - "commitment.commit_status := CLOSED; open_cost_cents := 0; received_cost_cents := received_units * unit_cost_cents"
          - "PlanMonth.otb_committed_cents and otb_received_cents recomputed; otb_open_cents unchanged because the cost moved between two subtracted buckets"
          - "increments ReceiptCommitment.version by 1 and PlanMonth.version by 1"

  - entity: ReceiptCommitment
    state_field: fulfillment_status
    initial_state: AWAITING_SHIP
    terminal_states: [RECEIVED, VOID]
    transitions:
      - from: AWAITING_SHIP
        to: SHIPPED
        trigger: "POST /otb/receipt-commitments/{id}/ship"
        actor: VendorRep
        preconditions:
          - "commitment.fulfillment_status == AWAITING_SHIP"
          - "commitment.commit_status == COMMITTED"
          - "X-User-ID == commitment.vendor_id"
        side_effects:
          - "commitment.fulfillment_status := SHIPPED"
          - "increments ReceiptCommitment.version by 1"
        note: "Second, independent state dimension on the same ReceiptCommitment row; commit_status is not read or written here beyond the COMMITTED guard."
      - from: SHIPPED
        to: PARTIALLY_RECEIVED
        trigger: "POST /otb/receipt-commitments/{id}/receipts with received_units_delta < remaining units"
        actor: VendorRep
        preconditions:
          - "commitment.fulfillment_status in {SHIPPED, PARTIALLY_RECEIVED}"
          - "X-User-ID == commitment.vendor_id"
          - "commitment.received_units + received_units_delta < commitment.units"
        side_effects:
          - "commitment.received_units += received_units_delta; fulfillment_status := PARTIALLY_RECEIVED"
          - "open_cost_cents and received_cost_cents recomputed; PlanMonth.otb_committed_cents and otb_received_cents recomputed; increments PlanMonth.version by 1"
          - "increments ReceiptCommitment.version by 1"
        note: "This row collapses two source states: a partial receipt is accepted from SHIPPED (first partial) and from PARTIALLY_RECEIVED (each subsequent partial), landing in PARTIALLY_RECEIVED either way. `from: SHIPPED` names the representative source; the precondition set is normative."
      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "POST /otb/receipt-commitments/{id}/receipts with received_units_delta closing the balance"
        actor: VendorRep
        preconditions:
          - "commitment.fulfillment_status in {SHIPPED, PARTIALLY_RECEIVED}"
          - "X-User-ID == commitment.vendor_id"
          - "commitment.received_units + received_units_delta == commitment.units"
        side_effects:
          - "commitment.received_units := commitment.units; fulfillment_status := RECEIVED"
          - "commit_status transitions COMMITTED -> CLOSED on the other dimension"
          - "PlanMonth.otb_committed_cents and otb_received_cents recomputed; increments PlanMonth.version by 1"
          - "increments ReceiptCommitment.version by 1"
        note: "This row collapses two source states: the receipt that completes the order is accepted from SHIPPED (single full receipt) and from PARTIALLY_RECEIVED (final top-up). `from: PARTIALLY_RECEIVED` names the representative source; the precondition set is normative."
      - from: AWAITING_SHIP
        to: VOID
        trigger: "system event on commit_status PROPOSED -> WITHDRAWN or COMMITTED -> CANCELLED with received_units == 0"
        actor: system
        preconditions:
          - "commitment.fulfillment_status == AWAITING_SHIP"
          - "commitment.received_units == 0"
        side_effects:
          - "commitment.fulfillment_status := VOID"
          - "increments ReceiptCommitment.version by 1"
        note: "The two dimensions only couple at these two points: full receipt closes commit_status, and cancellation with zero receipts voids fulfillment_status."

  - entity: ReforecastCycle
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: "system event on POST /otb/chase-cancel-decisions/{id}/approve or /reject when no PROPOSED decision remains in the cycle"
        actor: system
        preconditions:
          - "cycle.status == OPEN"
          - "at least one ChaseCancelDecision exists with reforecast_cycle_id == cycle.id"
          - "no ChaseCancelDecision with reforecast_cycle_id == cycle.id has status == PROPOSED"
        side_effects:
          - "cycle.status := DECIDED"
          - "increments ReforecastCycle.version by 1"
        note: "Bubble-up: the parent cycle's state is derived from the aggregate state of its decisions."
      - from: DECIDED
        to: OPEN
        trigger: "POST /otb/chase-cancel-decisions creating another decision in a DECIDED cycle"
        actor: MerchandisePlanner
        preconditions:
          - "cycle.status == DECIDED"
          - "the parent CategoryPlan.status == REFORECAST_OPEN"
        side_effects:
          - "cycle.status := OPEN"
          - "increments ReforecastCycle.version by 1"
        note: "Cycle: OPEN -> DECIDED -> OPEN repeats for as many decision rounds as the merchant needs inside one reforecast round."
      - from: DECIDED
        to: CLOSED
        trigger: "POST /otb/reforecast-cycles/{id}/close"
        actor: PlanningDirector
        preconditions:
          - "cycle.status == DECIDED"
          - "no ChaseCancelDecision with reforecast_cycle_id == cycle.id has status == PROPOSED"
        side_effects:
          - "cycle.status := CLOSED"
          - "increments ReforecastCycle.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /otb/reforecast-cycles/{id}/close"
        actor: PlanningDirector
        preconditions:
          - "cycle.status == OPEN"
          - "no ChaseCancelDecision with reforecast_cycle_id == cycle.id has status == PROPOSED"
        side_effects:
          - "cycle.status := CLOSED"
          - "increments ReforecastCycle.version by 1"
        note: "Liveness escape for a cycle that was opened and then judged to need no chase or cancel action at all: OPEN -> DECIDED requires at least one decision, so without this row an empty cycle could never close and its CategoryPlan could never leave REFORECAST_OPEN."
      - from: OPEN
        to: ABANDONED
        trigger: "system event on the CategoryPlan close cascade (the collapsed APPROVED | REFORECAST_OPEN -> CLOSED row); in practice always the REFORECAST_OPEN source, because a cycle is OPEN only while its plan sits in REFORECAST_OPEN"
        actor: system
        preconditions:
          - "cycle.status == OPEN"
        side_effects:
          - "cycle.status := ABANDONED"
          - "every ChaseCancelDecision with reforecast_cycle_id == cycle.id and status == PROPOSED is set to REJECTED with approved_units := 0"
          - "increments ReforecastCycle.version by 1"
        note: "A DECIDED cycle is NOT abandoned by the close cascade: only status == OPEN is swept, so a cycle whose decisions were all adjudicated keeps its DECIDED status when the plan closes."

  - entity: ChaseCancelDecision
    state_field: status
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /otb/chase-cancel-decisions/{id}/approve"
        actor: PlanningDirector
        preconditions:
          - "decision.status == PROPOSED"
          - "X-User-ID != decision.proposed_by_user_id"
          - "the parent ReforecastCycle.status == OPEN"
          - "the referenced AssortmentItem.status == IN_SEASON"
          - "for action == CHASE, calculations.chase_cancel_allocation yields approved_units > 0"
        side_effects:
          - "decision.status := APPROVED; decision.approved_units := calculations.chase_cancel_allocation"
          - "for action == CHASE the item transitions IN_SEASON -> CHASED and one COMMITTED ReceiptCommitment per funded month bucket is created; for action == CANCEL the item transitions IN_SEASON -> CANCELLED_IN_SEASON and existing commitments are reduced; for action == HOLD approved_units := 0 and the item's status is unchanged"
          - "every touched PlanMonth has otb_committed_cents, otb_received_cents and otb_open_cents recomputed, then CategoryPlan.open_ratio_bps and otb_posture recomputed"
          - "increments ChaseCancelDecision.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /otb/chase-cancel-decisions/{id}/reject"
        actor: PlanningDirector
        preconditions:
          - "decision.status == PROPOSED"
          - "X-User-ID != decision.proposed_by_user_id"
          - "the parent ReforecastCycle.status == OPEN"
        side_effects:
          - "decision.status := REJECTED; decision.approved_units := 0"
          - "no PlanMonth or AssortmentItem field changes"
          - "increments ChaseCancelDecision.version by 1"

  - entity: LocalizationOverlay
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /otb/localization-overlays/{id}/activate"
        actor: PlanningDirector
        preconditions:
          - "overlay.status == DRAFT"
          - "the parent CategoryPlan.status in {APPROVED, REFORECAST_OPEN}"
          - "logical clock <= overlay.effective_end"
        side_effects:
          - "overlay.status := ACTIVE"
          - "every AssortmentItem with status in {ADOPTED, IN_SEASON} whose OptionPlan.store_cluster_id == overlay.store_cluster_id and OptionPlan.category_plan_id == overlay.category_plan_id has effective_overlay_multiplier_bps recomputed by calculations.overlay_effective_multiplier and sell_through_bps recomputed by calculations.item_sell_through_forecast"
          - "increments LocalizationOverlay.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event on POST /otb/_clock/set_current_utc when the new clock reading is strictly after overlay.effective_end"
        actor: system
        preconditions:
          - "overlay.status == ACTIVE"
          - "new logical clock > overlay.effective_end"
        side_effects:
          - "overlay.status := EXPIRED"
          - "every AssortmentItem previously carrying this overlay has effective_overlay_multiplier_bps and sell_through_bps recomputed without it"
          - "increments LocalizationOverlay.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event on CategoryPlan APPROVED -> REFORECAST_OPEN"
        actor: system
        preconditions:
          - "overlay.status == ACTIVE"
        side_effects:
          - "overlay.status := SUPERSEDED"
          - "increments LocalizationOverlay.version by 1"
        note: "Opening a reforecast round invalidates every ACTIVE localization overlay; new overlays must be authored and re-activated for the new round."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: commitment-create-stale-plan-month
    parent_entity: PlanMonth
    write_endpoint: "POST /otb/receipt-commitments"
    occ_field: "expected_plan_month_version"
    description: |
      Creating a ReceiptCommitment against a PlanMonth whose version has advanced since the
      client last read it is rejected with a stale-version error. A buyer sizes a buy from a
      month's otb_open_cents; any earlier write that consumed part of that month's open
      budget (another commitment reaching COMMITTED, a receipt posting, an approved chase
      allocation) advances PlanMonth.version, so the buy the client computed no longer
      matches the budget the server holds. The check compares the submitted
      expected_plan_month_version to the stored PlanMonth.version and never inspects
      request timing.
    error_id: ERR_STALE_PLAN_MONTH_VERSION
    http_status: 412
  - rule_id: reforecast-open-stale-category-plan
    parent_entity: CategoryPlan
    write_endpoint: "POST /otb/category-plans/{id}/reforecasts"
    occ_field: "expected_category_plan_version"
    description: |
      Opening a ReforecastCycle against a CategoryPlan whose version has advanced since the
      client last read it is rejected with a stale-version error. A new cycle legitimately
      supersedes the governance state the client observed, and CategoryPlan.version advances
      whenever a posture recomputation, a variance verdict, or an automatic
      VARIANCE_BREACH-triggered cycle has already moved the plan on. The check compares the
      submitted expected_category_plan_version to the stored CategoryPlan.version.
    error_id: ERR_STALE_CATEGORY_PLAN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
# Global convention: round_half_up(x) rounds a rational to the nearest integer and, on an
# exact .5, away from zero (so 5469.5 -> 5470 and -1166.5 -> -1167). All monetary values are
# integer cents; all rates are integer basis points; no floating-point money is stored.
calculations:
  - name: plan_receipt_budget
    trigger: "CategoryPlan SUBMITTED -> APPROVED (cascade-B link 1); also evaluated as a precondition so a zero budget blocks approval"
    algorithm: threshold
    formula: |
      cost_of_goods_cents = round_half_up(plan.planned_sales_cents * (10000 - plan.planned_margin_bps) / 10000)
      role_capacity_cents = round_half_up(cost_of_goods_cents * ROLE_RECEIPT_MULTIPLIER_BPS[category.role] / 10000)
      turn_basis_x100     = max(plan.planned_turn_x100, TURN_FLOOR_X100)
      turn_capacity_cents = round_half_up(cost_of_goods_cents * TURN_TARGET_REFERENCE_X100 / turn_basis_x100)
      dept_cap_cents      = round_half_up(department.sales_target_cents * DEPARTMENT_SHARE_CAP_BPS / 10000)
      receipt_budget_cents = min(dept_cap_cents, max(role_capacity_cents, turn_capacity_cents))
      # department is reached as Category(plan.category_id).department_id -> Department.id
      # Evaluation order is fixed: cost_of_goods first, then the two capacities, then the cap.
      # The inner max() picks whichever of role appetite and turn discipline is larger; the
      # outer min() then applies the department's hard share ceiling.
    input_set: "exactly one CategoryPlan row, its Category row, and that Category's Department row; no PlanMonth, OptionPlan or commitment data participates"
    constants:
      ROLE_RECEIPT_MULTIPLIER_BPS: { TRAFFIC_DRIVER: 11000, DESTINATION: 10000, CONVENIENCE: 9000, SEASONAL: 12500, OCCASIONAL: 8500 }
      DEPARTMENT_SHARE_CAP_BPS: 1200
      TURN_TARGET_REFERENCE_X100: 300
      TURN_FLOOR_X100: 200
    precision: "integer cents, round_half_up applied at each named intermediate as written; min/max operate on already-rounded integers"
    variants: []

  - name: markdown_reserve
    trigger: "exactly two events: PlanMonth DRAFT -> LOCKED_PLAN (cascade-B link 2) and POST /otb/actuals-posts for the month. It is NOT re-run by commitment commit, cancel or receipt events, even though those events change the committed receipt figure that feeds S1 - see the pinned single-pass note in the formula."
    algorithm: constraint_propagation
    formula: |
      # This rule looks circular: the reserve feeds otb_planned_cents, otb_planned_cents feeds
      # the receipts a buyer may place, and receipts feed the sell-through that selects the
      # reserve rate. The evaluation order below is PINNED to a single pass and MUST NOT be
      # iterated to a fixed point.
      # S1 - provisional sell-through, using ONLY already-COMMITTED receipts (PROPOSED excluded)
      if month.active_basis == PLANNED_BASIS:
          sales_cost_cents   = round_half_up(month.planned_sales_cents * (10000 - plan.planned_margin_bps) / 10000)
          inventory_base_cents = month.bom_inventory_cents
      else:
          sales_cost_cents   = projected_sales_cost_cents   # from plan_month_open_to_buy step P3
          inventory_base_cents = projected_bom_cents        # from plan_month_open_to_buy step P4
      committed_receipt_cost_cents = sum(rc.open_cost_cents + rc.received_cost_cents
                                         for rc in ReceiptCommitment
                                         where rc.plan_month_id == month.id
                                           and rc.commit_status in {COMMITTED, CLOSED})
      denominator_cents = max(1, inventory_base_cents + committed_receipt_cost_cents)
      provisional_sell_through_bps = round_half_up(10000 * sales_cost_cents / denominator_cents)
      # S2 - tier selection on the S1 output; boundaries are inclusive on the lower edge
      if provisional_sell_through_bps <  4000: reserve_rate_bps = 900
      elif provisional_sell_through_bps < 6500: reserve_rate_bps = 600
      elif provisional_sell_through_bps < 8500: reserve_rate_bps = 350
      else:                                     reserve_rate_bps = 150
      # S3 - the reserve itself
      markdown_reserve_cents = round_half_up(denominator_cents * reserve_rate_bps / 10000)
      # S4 - hand off to plan_month_open_to_buy; never re-enter S1 with post-S4 receipt figures.
      # Concretely: committing a ReceiptCommitment changes only otb_committed_cents and
      # otb_open_cents. provisional_sell_through_bps, reserve_rate_bps, markdown_reserve_cents
      # and otb_planned_cents all keep the values written by the previous reserve trigger until
      # the next reserve trigger fires. The newly committed dollars first enter S1's denominator
      # at that next trigger, and they enter it exactly once.
    input_set: "one PlanMonth, its CategoryPlan (for planned_margin_bps), and its ReceiptCommitment rows filtered to commit_status in {COMMITTED, CLOSED}; PROPOSED, WITHDRAWN and CANCELLED rows are excluded"
    constants:
      RESERVE_TIER_LOW_BPS: 4000
      RESERVE_TIER_MID_BPS: 6500
      RESERVE_TIER_HIGH_BPS: 8500
      RESERVE_RATE_DEEP_BPS: 900
      RESERVE_RATE_MID_BPS: 600
      RESERVE_RATE_LIGHT_BPS: 350
      RESERVE_RATE_MIN_BPS: 150
    precision: "integer cents and integer bps; round_half_up at S1 and S3 only"
    variants: []

  - name: plan_month_open_to_buy
    trigger: "PlanMonth DRAFT -> LOCKED_PLAN, every ReceiptCommitment commit/cancel/receipt event on the month, every POST /otb/actuals-posts for the month, and GET /otb/plan-months/{id}/otb-ledger"
    algorithm: forward_looking
    formula: |
      # Shared tail, identical under both variants:
      otb_committed_cents = sum(rc.open_cost_cents for rc in ReceiptCommitment
                                where rc.plan_month_id == month.id and rc.commit_status == COMMITTED)
      otb_received_cents  = sum(rc.received_cost_cents for rc in ReceiptCommitment
                                where rc.plan_month_id == month.id and rc.commit_status in {COMMITTED, CLOSED})
      otb_open_cents = otb_planned_cents - otb_committed_cents - otb_received_cents
      # otb_open_cents is NEVER clamped at zero; a negative value is a real overbought month and
      # is what makes the conservation identity below exact.
      # INVARIANT (conserved quantity, dollars):
      #   otb_open_cents + otb_committed_cents + otb_received_cents == otb_planned_cents
    input_set: "one PlanMonth plus its ReceiptCommitment rows; WITHDRAWN and CANCELLED rows contribute 0 because their open_cost_cents is 0 and their received_cost_cents only counts units actually received"
    constants:
      WEEKS_PER_FISCAL_MONTH: 4
    precision: "integer cents; round_half_up applied only where written inside each variant"
    variants:
      - name: PLANNED_BASIS
        when: "month.status in {DRAFT, LOCKED_PLAN}, or month.status == IN_SEASON with zero ActualsPost rows; also returned on demand by GET /otb/plan-months/{id}/otb-ledger?basis=PLANNED_BASIS"
        difference: |
          planned_sales_cost_cents = round_half_up(month.planned_sales_cents * (10000 - plan.planned_margin_bps) / 10000)
          otb_planned_cents = month.planned_eom_cents + planned_sales_cost_cents
                            + month.planned_markdown_cents + month.markdown_reserve_cents
                            - month.bom_inventory_cents
          The authored plan is taken at face value: BOM is the authored bom_inventory_cents and
          sales are the authored planned_sales_cents. No ActualsPost row is read.
      - name: PROJECTED_BASIS
        when: "month.status == IN_SEASON and at least one ActualsPost exists for the month; also returned on demand by GET /otb/plan-months/{id}/otb-ledger?basis=PROJECTED_BASIS"
        difference: |
          # P1..P4 walk the ActualsPost rows in week_index ASC order (week_index is unique per
          # month, so the replay order is total and needs no tie-break).
          P1: weeks_posted = count(ActualsPost where plan_month_id == month.id)
          P2: actual_sales_cents   = sum(ap.actual_sales_cents for those rows)
              actual_receipts_cents = sum(ap.actual_receipts_cents for those rows)
          P3: run_rate_cents = actual_sales_cents / weeks_posted            # exact rational, not rounded
              projected_sales_cents = round_half_up(actual_sales_cents
                                      + run_rate_cents * (WEEKS_PER_FISCAL_MONTH - weeks_posted))
              projected_sales_cost_cents = round_half_up(projected_sales_cents * (10000 - plan.planned_margin_bps) / 10000)
          P4: actual_sales_cost_cents = round_half_up(actual_sales_cents * (10000 - plan.planned_margin_bps) / 10000)
              projected_bom_cents = month.bom_inventory_cents + actual_receipts_cents - actual_sales_cost_cents
          P5: otb_planned_cents = month.planned_eom_cents + projected_sales_cost_cents
                                + month.planned_markdown_cents + month.markdown_reserve_cents
                                - projected_bom_cents
          The same authored month therefore yields a different otb_planned_cents from
          PLANNED_BASIS: sales are re-projected from the posted run rate and BOM is rebuilt
          chronologically from actual receipts net of actual cost of sales. markdown_reserve
          is itself recomputed on the projected figures before P5 runs.

  - name: option_slot_capacity
    trigger: "OptionPlan OPEN -> SLOTTED (cascade-B link 4)"
    algorithm: tiered_pricing
    formula: |
      # Two-step rounding, order PINNED: apply the tier share and round, THEN apply the cluster
      # index and round again. Collapsing the two multiplications into one rounding step is a
      # different (wrong) answer.
      tier_share_cents   = round_half_up(plan.receipt_budget_cents * TIER_BREADTH_SHARE_BPS[cell.tier] / 10000)
      budget_share_cents = round_half_up(tier_share_cents * cluster.sales_index_bps / 10000)
      cost_per_option_cents = cell.depth_units_per_option * cluster.store_count * cell.assumed_unit_cost_cents
      affordable_options = floor(budget_share_cents / cost_per_option_cents)
      option_slots_total = max(MIN_SLOTS_PER_TIER, min(cell.breadth_target, affordable_options))
      option_slots_open  = option_slots_total - option_slots_assigned
    input_set: "one OptionPlan, its CategoryPlan (receipt_budget_cents, which is non-null only after approval) and its StoreCluster"
    constants:
      TIER_BREADTH_SHARE_BPS: { GOOD: 4500, BETTER: 3500, BEST: 2000 }
      MIN_SLOTS_PER_TIER: 2
    precision: "integer cents; round_half_up twice as written; affordable_options uses floor (truncation toward zero) because a partially funded option cannot be carried"
    variants: []

  - name: cluster_size_allocation
    trigger: "PUT /otb/option-plans/{id}/size-curve (validation plus persistence) and OptionPlan OPEN -> SLOTTED (cascade-B link 5)"
    algorithm: waterfall_allocation
    formula: |
      # Mode: per-cell rounding BEFORE summation. The order is PINNED - "round each size cell
      # then sum" is the rule; "sum the raw demand then round once" is explicitly NOT the rule
      # and produces different per-size unit counts for the same curve.
      target_units = round_half_up(cell.depth_units_per_option * cluster.store_count * cluster.sales_index_bps / 10000)
      for each SizeCurveCell s of the OptionPlan:
          raw_units_x10000 = round_half_up(cell.depth_units_per_option * cluster.store_count
                                           * cluster.sales_index_bps * s.pct_bps / 100000000 * 10000)
          s.allocated_units = round_half_up(raw_units_x10000 / 10000)
      allocated_sum = sum(s.allocated_units)
      delta = target_units - allocated_sum
      # Remainder reconciliation, fully deterministic:
      #   fractional_part(s) = raw_units_x10000 mod 10000
      #   delta < 0 -> visit cells in ASCENDING fractional_part, tie-break size_sort_order ASC,
      #                subtract 1 unit from each visited cell
      #   delta > 0 -> visit cells in DESCENDING fractional_part, tie-break size_sort_order ASC,
      #                add 1 unit to each visited cell
      #   cycle through the visit order again if |delta| exceeds the cell count
      # No SizeCurveCell.id or AssortmentItem.id participates in the order.
      # Where the two outputs land, per invoking trigger:
      #   PUT /otb/option-plans/{id}/size-curve persists raw_units_x10000 and allocated_units on
      #     every submitted SizeCurveCell and uses target_units for the zero-cell check and the
      #     remainder reconciliation only; it does NOT write OptionPlan.target_units_per_option,
      #     which stays null for as long as the OptionPlan.status is OPEN.
      #   Cascade-B link 5 (OptionPlan OPEN -> SLOTTED) re-runs the whole formula and additionally
      #     writes OptionPlan.target_units_per_option = target_units. The per-cell numbers it
      #     re-derives are identical to the PUT's, because target_units depends only on the
      #     OptionPlan's depth_units_per_option and the StoreCluster, never on receipt_budget_cents.
    input_set: "all SizeCurveCell rows of one OptionPlan (the complete set - the PUT replaces the set wholesale), plus that OptionPlan and its StoreCluster"
    constants:
      SIZE_CURVE_TOTAL_BPS: 10000
    precision: "raw_units_x10000 is an integer of unit-ten-thousandths; allocated_units is whole units; round_half_up per cell, then integer remainder reconciliation"
    variants: []

  - name: item_sell_through_forecast
    trigger: "AssortmentItem PROPOSED -> ADOPTED, and LocalizationOverlay DRAFT -> ACTIVE / ACTIVE -> EXPIRED for every ADOPTED or IN_SEASON item in the affected cluster"
    algorithm: weighted_scoring
    formula: |
      cluster = StoreCluster(OptionPlan(item.option_plan_id).store_cluster_id)
      multiplier_bps = item.effective_overlay_multiplier_bps   # from overlay_effective_multiplier
      variant selection is by item.lifecycle_stage, see variants below; a single round_half_up
      is applied at the very end of whichever branch runs, then the SELL_THROUGH_CAP_BPS
      ceiling is applied to the rounded value.
    input_set: "one AssortmentItem, its OptionPlan, that OptionPlan's StoreCluster, and the ACTIVE LocalizationOverlay set resolved by overlay_effective_multiplier"
    constants:
      TIER_BENCHMARK_BPS: { GOOD: 6200, BETTER: 5500, BEST: 4300 }
      SELL_THROUGH_CAP_BPS: 9800
    precision: "integer bps; exactly one round_half_up per branch, applied before the cap"
    variants:
      - name: NEW_ITEM_BASIS
        when: "item.lifecycle_stage == NEW"
        difference: |
          sell_through_bps = min(SELL_THROUGH_CAP_BPS,
                                 round_half_up(TIER_BENCHMARK_BPS[OptionPlan.tier]
                                               * cluster.sales_index_bps
                                               * multiplier_bps / 100000000))
          item.prior_season_sell_through_bps is IGNORED even when populated.
          sell_through_basis := NEW_ITEM_BASIS
      - name: CARRYOVER_BASIS
        when: "item.lifecycle_stage in {CARRYOVER, CORE, EXIT}"
        difference: |
          sell_through_bps = min(SELL_THROUGH_CAP_BPS,
                                 round_half_up(item.prior_season_sell_through_bps
                                               * cluster.demographic_index_bps / 10000))
          The tier benchmark, the cluster sales index and the overlay multiplier are all
          IGNORED: a carryover option is forecast from its own history scaled by the cluster's
          demographic index. The same row therefore yields two different sell_through_bps
          depending only on lifecycle_stage.
          sell_through_basis := CARRYOVER_BASIS

  - name: overlay_effective_multiplier
    trigger: "AssortmentItem PROPOSED -> ADOPTED, LocalizationOverlay DRAFT -> ACTIVE, LocalizationOverlay ACTIVE -> EXPIRED"
    algorithm: constraint_propagation
    formula: |
      applicable = [ o for o in LocalizationOverlay
                     where o.category_plan_id == OptionPlan(item.option_plan_id).category_plan_id
                       and o.store_cluster_id  == OptionPlan(item.option_plan_id).store_cluster_id
                       and o.status == ACTIVE
                       and o.effective_start <= logical_clock <= o.effective_end ]
      # Application order is PINNED by overlay_type, not by created_at, not by id:
      #   CLIMATE, then DEMOGRAPHIC, then VOLUME.
      # At most one ACTIVE overlay per (plan, cluster, overlay_type) can exist because the
      # window-conflict rule rejects any second one, so no tie-break is ever needed.
      effective_bps = 10000
      for t in [CLIMATE, DEMOGRAPHIC, VOLUME]:
          if an applicable overlay o has overlay_type == t:
              effective_bps = round_half_up(effective_bps * o.unit_multiplier_bps / 10000)
      # Rounding AFTER EACH STEP is the rule; multiplying all factors first and rounding once
      # is explicitly NOT the rule.
      effective_overlay_multiplier_bps = min(OVERLAY_MULTIPLIER_CEILING_BPS,
                                             max(OVERLAY_MULTIPLIER_FLOOR_BPS, effective_bps))
    input_set: "LocalizationOverlay rows for one (category_plan_id, store_cluster_id) pair filtered to status == ACTIVE and to windows containing the logical clock; DRAFT, EXPIRED and SUPERSEDED rows are excluded"
    constants:
      OVERLAY_MULTIPLIER_FLOOR_BPS: 5000
      OVERLAY_MULTIPLIER_CEILING_BPS: 15000
    precision: "integer bps; round_half_up after each of the three ordered steps, then clamp"
    variants: []

  - name: otb_posture
    trigger: "any write that changes a PlanMonth's otb_open_cents or otb_planned_cents (commit, cancel, receipt, chase/cancel approval, cascade-B link 3), and every POST /otb/actuals-posts"
    algorithm: threshold
    formula: |
      months = [ m for m in PlanMonth where m.category_plan_id == plan.id
                                        and m.status in {LOCKED_PLAN, IN_SEASON} ]
      if months is empty:
          open_ratio_bps = 10000
          otb_posture    = OPEN
      else:
          open_sum_cents    = sum(m.otb_open_cents for m in months)
          planned_sum_cents = sum(m.otb_planned_cents for m in months)
          open_ratio_bps = round_half_up(10000 * open_sum_cents / max(1, planned_sum_cents))
          if   open_ratio_bps >= POSTURE_OPEN_FLOOR_BPS:        otb_posture = OPEN
          elif open_ratio_bps >= POSTURE_RESTRICTED_FLOOR_BPS:  otb_posture = RESTRICTED
          else:                                                 otb_posture = FROZEN
      # Override, applied last and unconditionally:
      if plan.variance_status == BREACH: otb_posture = FROZEN
    input_set: "PlanMonth rows of one CategoryPlan filtered to status in {LOCKED_PLAN, IN_SEASON}; DRAFT and CLOSED months are excluded from both sums"
    constants:
      POSTURE_OPEN_FLOOR_BPS: 1500
      POSTURE_RESTRICTED_FLOOR_BPS: 500
    precision: "integer bps; a single round_half_up on the ratio"
    variants: []

  - name: variance_verdict
    trigger: "POST /otb/actuals-posts"
    algorithm: aggregation
    formula: |
      months = [ m for m in PlanMonth where m.category_plan_id == plan.id
                                        and m.status in {IN_SEASON, CLOSED} ]
      actual_sales_cents = sum(ap.actual_sales_cents for ap in ActualsPost
                               where ap.plan_month_id in months, replayed in
                               (month_index ASC, week_index ASC) order)
      # The plan side is PRORATED to the weeks actually posted, month by month. A month
      # with three of four weeks posted contributes three quarters of its planned sales.
      # Comparing to-date actuals against a whole month's plan is explicitly NOT the rule.
      weeks_posted(m) = min(WEEKS_PER_FISCAL_MONTH,
                            count(ActualsPost where plan_month_id == m.id))
      plan_to_date_cents = sum(round_half_up(m.planned_sales_cents * weeks_posted(m)
                                            / WEEKS_PER_FISCAL_MONTH) for m in months)
      # Per-month rounding BEFORE the sum; summing the raw prorations and rounding once is
      # a different (wrong) answer when two months are both mid-flight.
      sales_variance_bps = round_half_up(10000 * (actual_sales_cents - plan_to_date_cents)
                                         / max(1, plan_to_date_cents))
      if   sales_variance_bps <= VARIANCE_BREACH_UNDER_BPS: variance_status = BREACH
      elif sales_variance_bps <= VARIANCE_WATCH_UNDER_BPS:  variance_status = WATCH
      elif sales_variance_bps >= VARIANCE_BREACH_OVER_BPS:  variance_status = BREACH
      else:                                                  variance_status = ON_PLAN
      # Boundaries are inclusive on both breach edges: exactly -1000 is BREACH (not WATCH) and
      # exactly +1500 is BREACH (not ON_PLAN). round_half_up on a negative rational rounds away
      # from zero, so -1166.67 becomes -1167.
      # Side effect: variance_status == BREACH while plan.status == APPROVED and
      # plan.reforecast_round < 3 drives CategoryPlan APPROVED -> REFORECAST_OPEN with
      # trigger_reason VARIANCE_BREACH.
    input_set: "ActualsPost rows of every PlanMonth of the plan whose status is IN_SEASON or CLOSED; months still DRAFT or LOCKED_PLAN contribute neither actuals nor plan, and an IN_SEASON month with zero posts contributes zero on both sides"
    constants:
      VARIANCE_BREACH_UNDER_BPS: -1000
      VARIANCE_WATCH_UNDER_BPS: -400
      VARIANCE_BREACH_OVER_BPS: 1500
      WEEKS_PER_FISCAL_MONTH: 4
    precision: "integer bps; a single round_half_up, half away from zero"
    variants: []

  - name: chase_cancel_allocation
    trigger: "POST /otb/chase-cancel-decisions/{id}/approve"
    algorithm: waterfall_allocation
    formula: |
      item   = AssortmentItem(decision.assortment_item_id)
      vendor = Vendor(item.vendor_id)
      plan   = CategoryPlan(OptionPlan(item.option_plan_id).category_plan_id)
      if decision.action == HOLD:
          approved_units = 0; no commitment is created or reduced
      if decision.action == CHASE:
          buckets = [ m for m in PlanMonth where m.category_plan_id == plan.id
                        and m.status in {LOCKED_PLAN, IN_SEASON}
                        and m.otb_open_cents > 0
                        and m.first_receipt_date >= logical_clock + vendor.lead_time_days days ]
          buckets are visited in month_index ASC order (month_index is unique per plan, so the
          order is total and no tie-break is required)
          remaining = decision.requested_units
          vendor_remaining = vendor.weekly_unit_capacity - vendor_window_load(vendor,
                             [m.first_receipt_date, m.first_receipt_date + CHASE_WINDOW_DAYS))
          for m in buckets:
              bucket_units = floor(m.otb_open_cents / item.unit_cost_cents)
              take = min(remaining, bucket_units, vendor_remaining)
              if take > 0:
                  create ReceiptCommitment(plan_month_id=m.id, assortment_item_id=item.id,
                      vendor_id=item.vendor_id, units=take, unit_cost_cents=item.unit_cost_cents,
                      ship_window_start=m.first_receipt_date,
                      ship_window_end=m.first_receipt_date + CHASE_WINDOW_DAYS days,
                      origin=CHASE_DECISION, commit_status=COMMITTED,
                      fulfillment_status=AWAITING_SHIP)
                  remaining -= take
              if remaining == 0: break
          approved_units = decision.requested_units - remaining
          if approved_units == 0: reject the approval with ERR_NO_FEASIBLE_RECEIPT_MONTH
          # A short-fall is a legitimate partial approval: approved_units < requested_units and
          # decision.status still becomes APPROVED.
      if decision.action == CANCEL:
          rows = [ rc for rc in ReceiptCommitment where rc.assortment_item_id == item.id
                     and rc.commit_status == COMMITTED
                     and (rc.units - rc.received_units - rc.cancelled_units) > 0 ]
          rows are visited in (PlanMonth.month_index DESC, ReceiptCommitment.created_at ASC) order
          remaining = decision.requested_units
          for rc in rows:
              open_units = rc.units - rc.received_units - rc.cancelled_units
              take = min(remaining, open_units)
              rc.cancelled_units += take; remaining -= take
              if rc.units - rc.received_units - rc.cancelled_units == 0:
                  rc.commit_status := CANCELLED
              if remaining == 0: break
          approved_units = decision.requested_units - remaining
    input_set: "one ChaseCancelDecision, its AssortmentItem and Vendor, and the PlanMonth rows of the item's CategoryPlan filtered as written; PROPOSED, WITHDRAWN and CANCELLED commitments never participate"
    constants:
      CHASE_WINDOW_DAYS: 14
    precision: "whole units; floor on bucket_units because a partially funded unit cannot be bought; no monetary rounding occurs because unit_cost_cents is already integral"
    variants: []

  - name: vendor_window_load
    trigger: "POST /otb/receipt-commitments and POST /otb/receipt-commitments/{id}/commit, plus every commitment generated by chase_cancel_allocation"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: [ship_window_start, ship_window_end).
      # Two windows overlap iff existing.ship_window_start < candidate.ship_window_end
      #                      AND candidate.ship_window_start < existing.ship_window_end.
      # Touching windows (existing.ship_window_end == candidate.ship_window_start) do NOT
      # overlap and are always allowed.
      overlapping = [ rc for rc in ReceiptCommitment
                        where rc.vendor_id == candidate.vendor_id
                          and rc.id != candidate.id
                          and rc.commit_status in {PROPOSED, COMMITTED}
                          and rc.ship_window_start < candidate.ship_window_end
                          and candidate.ship_window_start < rc.ship_window_end ]
      loaded_units = sum(rc.units - rc.cancelled_units for rc in overlapping)
      if loaded_units + candidate.units > vendor.weekly_unit_capacity:
          reject with ERR_VENDOR_CAPACITY_EXCEEDED
      # Aggregate-capacity semantics: overlap alone is legal, it is the SUM of overlapping
      # units against weekly_unit_capacity that is enforced.
      open_units_for_category = sum(rc.units - rc.received_units - rc.cancelled_units
                                    for rc in ReceiptCommitment
                                    where rc.vendor_id == candidate.vendor_id
                                      and rc.commit_status in {PROPOSED, COMMITTED}
                                      and the month's plan category_id == authorization.category_id)
      if open_units_for_category + candidate.units > authorization.max_open_units:
          reject with ERR_VENDOR_CAPACITY_EXCEEDED
    input_set: "ReceiptCommitment rows of one Vendor filtered to commit_status in {PROPOSED, COMMITTED}; WITHDRAWN, CANCELLED and CLOSED rows release their capacity"
    constants: {}
    precision: "whole units"
    variants: []

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST failing row decides the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list in 1.5"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body contains every required field for the endpoint, every value matches its declared type, every enum value is a declared member, and every integer respects its declared range; unknown body fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PUT endpoints"
  - priority: 4
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"
  - priority: 5
    category: existence
    check: "every id in the URL path resolves to an existing row, checked left to right"
    error_id: "ERR_DEPARTMENT_NOT_FOUND | ERR_CATEGORY_NOT_FOUND | ERR_STORE_CLUSTER_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_VENDOR_AUTHORIZATION_NOT_FOUND | ERR_CATEGORY_PLAN_NOT_FOUND | ERR_PLAN_MONTH_NOT_FOUND | ERR_OPTION_PLAN_NOT_FOUND | ERR_ASSORTMENT_ITEM_NOT_FOUND | ERR_RECEIPT_COMMITMENT_NOT_FOUND | ERR_REFORECAST_CYCLE_NOT_FOUND | ERR_CHASE_CANCEL_DECISION_NOT_FOUND | ERR_LOCALIZATION_OVERLAY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 6
    category: existence
    check: "every FK id in the request body resolves to an existing row, checked in the field order declared in the endpoint's input list"
    error_id: "ERR_DEPARTMENT_NOT_FOUND | ERR_CATEGORY_NOT_FOUND | ERR_STORE_CLUSTER_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_CATEGORY_PLAN_NOT_FOUND | ERR_PLAN_MONTH_NOT_FOUND | ERR_OPTION_PLAN_NOT_FOUND | ERR_ASSORTMENT_ITEM_NOT_FOUND | ERR_REFORECAST_CYCLE_NOT_FOUND"
    http_status: 404
    applies_to: "all POST and PUT endpoints carrying FK body fields"
  - priority: 7
    category: auth
    check: "when X-User-Role is VendorRep, X-User-ID equals the target ReceiptCommitment.vendor_id"
    error_id: ERR_NOT_COMMITMENT_VENDOR
    http_status: 403
    applies_to: "POST /otb/receipt-commitments/{id}/ship, POST /otb/receipt-commitments/{id}/receipts"
  - priority: 8
    category: business_safety
    check: "the approving X-User-ID differs from the id recorded at proposal time: CategoryPlan.submitted_by_user_id on approve/reject, ChaseCancelDecision.proposed_by_user_id on decision approve/reject"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /otb/category-plans/{id}/approve, POST /otb/category-plans/{id}/reject, POST /otb/chase-cancel-decisions/{id}/approve, POST /otb/chase-cancel-decisions/{id}/reject"
  - priority: 9
    category: state
    check: "the target row is in a state from which the requested transition is declared in 1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (submit, approve, reject, close, open-season, adopt, activate, commit, cancel, ship, receipts, decision approve/reject, overlay activate, cycle close)"
  - priority: 10
    category: state
    check: "the PlanMonth referenced by plan_month_id is in the status that operation requires: status in {LOCKED_PLAN, IN_SEASON} for receipt commitments, status == IN_SEASON for actuals posts"
    error_id: ERR_PLAN_MONTH_NOT_OPEN
    http_status: 409
    applies_to: "POST /otb/receipt-commitments, POST /otb/receipt-commitments/{id}/commit, POST /otb/actuals-posts"
  - priority: 11
    category: state
    check: "the OptionPlan referenced by the AssortmentItem has status == SLOTTED"
    error_id: ERR_OPTION_PLAN_NOT_SLOTTED
    http_status: 409
    applies_to: "POST /otb/assortment-items/{id}/adopt"
  - priority: 12
    category: state
    check: "the parent CategoryPlan has status == APPROVED"
    error_id: ERR_CATEGORY_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /otb/plan-months/{id}/open-season, POST /otb/category-plans/{id}/reforecasts"
  - priority: 13
    category: state
    check: "the Vendor referenced by the commitment has status == AUTHORIZED"
    error_id: ERR_VENDOR_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /otb/receipt-commitments/{id}/commit"
  - priority: 14
    category: state
    check: "no ChaseCancelDecision of the cycle has status == PROPOSED"
    error_id: ERR_OPEN_DECISIONS_REMAIN
    http_status: 409
    applies_to: "POST /otb/reforecast-cycles/{id}/close"
  - priority: 15
    category: state
    check: "the submitted expected_plan_month_version equals the stored PlanMonth.version, or the submitted expected_category_plan_version equals the stored CategoryPlan.version"
    error_id: "ERR_STALE_PLAN_MONTH_VERSION | ERR_STALE_CATEGORY_PLAN_VERSION"
    http_status: 412
    applies_to: "POST /otb/receipt-commitments, POST /otb/category-plans/{id}/reforecasts"
  - priority: 16
    category: business_safety
    check: "the CategoryPlan of the target month has otb_posture != FROZEN"
    error_id: ERR_OTB_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /otb/receipt-commitments, POST /otb/receipt-commitments/{id}/commit; NOT applied to commitments generated by chase_cancel_allocation, which is the sanctioned in-season correction route"
  - priority: 17
    category: business_safety
    check: "when the CategoryPlan has otb_posture == RESTRICTED, the AssortmentItem's lifecycle_stage is not NEW"
    error_id: ERR_POSTURE_RESTRICTED_NEW_ITEM
    http_status: 409
    applies_to: "POST /otb/receipt-commitments, POST /otb/receipt-commitments/{id}/commit"
  - priority: 18
    category: business_safety
    check: "CategoryPlan.reforecast_round < 3 before a new cycle is opened"
    error_id: ERR_REFORECAST_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /otb/category-plans/{id}/reforecasts, and the system-triggered VARIANCE_BREACH cycle open on POST /otb/actuals-posts (which is skipped rather than failed when the cap is reached)"
  - priority: 19
    category: business_referential
    check: "a VendorAuthorization with status == ACTIVE links the commitment's vendor_id to the category_id of the plan that owns the target PlanMonth"
    error_id: ERR_VENDOR_NOT_AUTHORIZED_FOR_CATEGORY
    http_status: 422
    applies_to: "POST /otb/receipt-commitments, POST /otb/receipt-commitments/{id}/commit"
  - priority: 20
    category: business_referential
    check: "OptionPlan(assortment_item.option_plan_id).category_plan_id equals PlanMonth(plan_month_id).category_plan_id, and the body vendor_id equals AssortmentItem.vendor_id"
    error_id: ERR_PLAN_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /otb/receipt-commitments"
  - priority: 21
    category: business_referential
    check: "at least one OptionPlan exists with (category_plan_id == overlay.category_plan_id and store_cluster_id == overlay.store_cluster_id)"
    error_id: ERR_CLUSTER_NOT_IN_PLAN
    http_status: 422
    applies_to: "POST /otb/localization-overlays"
  - priority: 22
    category: business_constraint
    check: "(category_id, season_code, fiscal_year) is unique across CategoryPlan"
    error_id: ERR_DUPLICATE_CATEGORY_PLAN
    http_status: 409
    applies_to: "POST /otb/category-plans"
  - priority: 23
    category: business_constraint
    check: "(category_plan_id, month_index) is unique across PlanMonth"
    error_id: ERR_DUPLICATE_PLAN_MONTH
    http_status: 409
    applies_to: "POST /otb/plan-months"
  - priority: 24
    category: business_constraint
    check: "(category_plan_id, store_cluster_id, tier) is unique across OptionPlan"
    error_id: ERR_DUPLICATE_OPTION_PLAN
    http_status: 409
    applies_to: "POST /otb/option-plans"
  - priority: 25
    category: business_constraint
    check: "(plan_month_id, week_index) is unique across ActualsPost"
    error_id: ERR_DUPLICATE_ACTUALS_WEEK
    http_status: 409
    applies_to: "POST /otb/actuals-posts"
  - priority: 26
    category: business_constraint
    check: "the submitted cells array is non-empty"
    error_id: ERR_SIZE_CURVE_EMPTY
    http_status: 422
    applies_to: "PUT /otb/option-plans/{id}/size-curve"
  - priority: 27
    category: business_constraint
    check: "the submitted cells' pct_bps values sum to exactly 10000, and size_label and size_sort_order are each unique within the submitted set"
    error_id: ERR_SIZE_CURVE_NOT_BALANCED
    http_status: 422
    applies_to: "PUT /otb/option-plans/{id}/size-curve"
  - priority: 28
    category: business_constraint
    check: "no cell's allocated_units evaluates to 0 after calculations.cluster_size_allocation per-cell rounding and remainder reconciliation"
    error_id: ERR_SIZE_CURVE_ZERO_CELL
    http_status: 422
    applies_to: "PUT /otb/option-plans/{id}/size-curve"
  - priority: 29
    category: business_constraint
    check: "OptionPlan.option_slots_open >= 1"
    error_id: ERR_NO_OPTION_SLOT
    http_status: 409
    applies_to: "POST /otb/assortment-items/{id}/adopt"
  - priority: 30
    category: business_constraint
    check: "units >= Vendor.min_order_units"
    error_id: ERR_BELOW_VENDOR_MINIMUM
    http_status: 422
    applies_to: "POST /otb/receipt-commitments"
  - priority: 31
    category: business_constraint
    check: "calculations.vendor_window_load accepts the candidate against Vendor.weekly_unit_capacity over half-open overlapping ship windows and against VendorAuthorization.max_open_units for the category"
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /otb/receipt-commitments, POST /otb/receipt-commitments/{id}/commit"
  - priority: 32
    category: business_constraint
    check: "no other LocalizationOverlay with the same store_cluster_id and the same overlay_type and status in {DRAFT, ACTIVE} sits within 7 days of the candidate window. CLOSED-interval semantics with a mandatory separation buffer: the candidate is rejected when candidate.effective_start <= existing.effective_end + 7 days AND existing.effective_start <= candidate.effective_end + 7 days. Windows that merely touch, and windows separated by 1..7 days, are both rejected; a gap of 8 days or more on either side is accepted."
    error_id: ERR_OVERLAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /otb/localization-overlays"
  - priority: 33
    category: business_temporal
    check: "ship_window_end is strictly after ship_window_start"
    error_id: ERR_SHIP_WINDOW_INVERTED
    http_status: 422
    applies_to: "POST /otb/receipt-commitments"
  - priority: 34
    category: business_temporal
    check: "ship_window_start >= logical clock plus Vendor.lead_time_days days"
    error_id: ERR_LEAD_TIME_INFEASIBLE
    http_status: 422
    applies_to: "POST /otb/receipt-commitments"
  - priority: 35
    category: business_temporal
    check: "logical clock <= ship_window_start minus Vendor.cancel_cutoff_days days"
    error_id: ERR_CANCEL_CUTOFF_PASSED
    http_status: 409
    applies_to: "POST /otb/receipt-commitments/{id}/cancel when commit_status == COMMITTED"
  - priority: 36
    category: business_temporal
    check: "effective_end is greater than or equal to effective_start"
    error_id: ERR_OVERLAY_WINDOW_INVERTED
    http_status: 422
    applies_to: "POST /otb/localization-overlays"
  - priority: 37
    category: business_fiscal
    check: "cost_cents (units * unit_cost_cents) is less than or equal to PlanMonth.otb_open_cents; a cost exactly equal to the open balance is accepted, one cent more is rejected"
    error_id: ERR_OTB_EXCEEDED
    http_status: 422
    applies_to: "POST /otb/receipt-commitments, POST /otb/receipt-commitments/{id}/commit"
  - priority: 38
    category: business_fiscal
    check: "calculations.plan_receipt_budget yields a value strictly greater than 0"
    error_id: ERR_RECEIPT_BUDGET_ZERO
    http_status: 422
    applies_to: "POST /otb/category-plans/{id}/approve"
  - priority: 39
    category: business_fiscal
    check: "for action == CHASE, calculations.chase_cancel_allocation allocates at least one unit"
    error_id: ERR_NO_FEASIBLE_RECEIPT_MONTH
    http_status: 422
    applies_to: "POST /otb/chase-cancel-decisions/{id}/approve"
  - priority: 40
    category: business_fiscal
    check: "received_units_delta is >= 1 and received_units + received_units_delta <= units"
    error_id: ERR_RECEIPT_OVER_COMMITMENT
    http_status: 422
    applies_to: "POST /otb/receipt-commitments/{id}/receipts"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table  (every path placeholder is literally {id}; entity
# collections are all top-level under /otb, links are FKs in the body)
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/otb/departments"
    description: "create a merchandise department with its annual sales, margin and turn targets"
    roles: [MerchOpsAdmin]
    code: 201
    input: [name, code, fiscal_year, sales_target_cents, margin_target_bps, turn_target_x100]
    output: Department
    side_effects: []
  - method: GET
    path: "/otb/departments/{id}"
    description: "read one department"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: []
    output: Department
    side_effects: []
  - method: POST
    path: "/otb/categories"
    description: "create a category under a department and pin its role"
    roles: [MerchOpsAdmin]
    code: 201
    input: [department_id, name, code, role, sales_share_bps]
    output: Category
    side_effects: []
  - method: GET
    path: "/otb/categories/{id}"
    description: "read one category"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: []
    output: Category
    side_effects: []
  - method: GET
    path: "/otb/categories"
    description: "list categories, optionally filtered to one department or one role"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: ["department_id?", "role?", "limit?", "offset?"]
    output: Category[]
    side_effects: []
  - method: POST
    path: "/otb/store-clusters"
    description: "create a store cluster with its climate, demographic, volume-tier and productivity attributes"
    roles: [MerchOpsAdmin]
    code: 201
    input: [name, climate_zone, demographic_index_bps, volume_tier, store_count, sales_index_bps]
    output: StoreCluster
    side_effects: []
  - method: GET
    path: "/otb/store-clusters/{id}"
    description: "read one store cluster"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: []
    output: StoreCluster
    side_effects: []
  - method: GET
    path: "/otb/store-clusters"
    description: "list store clusters, optionally filtered by climate zone or volume tier"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: ["climate_zone?", "volume_tier?", "limit?", "offset?"]
    output: StoreCluster[]
    side_effects: []
  - method: POST
    path: "/otb/vendors"
    description: "create a vendor in PENDING status with its lead time, capacity, minimum and cancel cutoff"
    roles: [MerchOpsAdmin]
    code: 201
    input: [name, code, lead_time_days, weekly_unit_capacity, min_order_units, cancel_cutoff_days]
    output: Vendor
    side_effects: ["vendor.status initialised to PENDING"]
  - method: GET
    path: "/otb/vendors/{id}"
    description: "read one vendor"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer, VendorRep]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/otb/vendors/{id}/status"
    description: "move a vendor between PENDING, AUTHORIZED and SUSPENDED; suspension revokes the vendor's authorizations and reinstatement restores them"
    roles: [MerchOpsAdmin]
    code: 200
    input: [status]
    output: Vendor
    side_effects:
      - "increments Vendor.version by 1"
      - "cascades VendorAuthorization.status between ACTIVE and REVOKED for every authorization of this vendor"
  - method: POST
    path: "/otb/vendor-authorizations"
    description: "authorize a vendor to supply a category with an open-unit ceiling"
    roles: [MerchOpsAdmin]
    code: 201
    input: [vendor_id, category_id, max_open_units]
    output: VendorAuthorization
    side_effects: ["authorization.status initialised to ACTIVE"]
  - method: GET
    path: "/otb/vendor-authorizations/{id}"
    description: "read one vendor authorization"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: []
    output: VendorAuthorization
    side_effects: []
  - method: GET
    path: "/otb/vendor-authorizations"
    description: "list vendor authorizations filtered by vendor, category or status"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: ["vendor_id?", "category_id?", "status?", "limit?", "offset?"]
    output: VendorAuthorization[]
    side_effects: []
  - method: POST
