            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
          trigger:
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Janitor Closet", job_function: "JANITORIAL", occupancy_cap: 2 }
