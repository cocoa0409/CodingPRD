      - name: moving_the_logical_clock_backwards_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_31_ERR_CLOCK_NOT_MONOTONIC
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST_/erm/_clock/set_current_utc
        distinguishing_aspect: |
          The clock accepts to_iso8601 >= its current value, so rewinding from 2026-09-01 to 2026-08-15
          must fail with ERR_CLOCK_NOT_MONOTONIC (422) and the clock must still read 2026-09-01 - no
          retroactive re-evaluation of activation or expiry may happen.
        test_recipe:
          setup:
            - "An empty database whose logical clock has been advanced once, from its default 2026-08-01T00:00:00Z to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /erm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /erm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "response status == 422"
            - "${err} == ERR_CLOCK_NOT_MONOTONIC"
            - "the logical clock still reads 2026-09-01T00:00:00Z"
