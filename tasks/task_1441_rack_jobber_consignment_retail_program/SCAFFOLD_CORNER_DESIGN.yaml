            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "SS-001", name: "Susp Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/suspend", payload: { reason: "audit review" }, as: JobberAdmin }
          trigger:
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 2, scanned_at: "2026-08-01T10:00:00Z", client_event_id: "ss-1" }, as: RetailerManager, as_user_id: "${store}", captures: { scan: "$.data.id", st0: "$.data.status" } }
            - { call: "POST /agreements/${agr}/resume", payload: {}, as: JobberAdmin }
            - { call: "POST /scan-events/${scan}/resolve", payload: {}, as: JobberAdmin, captures: { st1: "$.data.status", price1: "$.data.unit_price_cents" } }
          assert:
            - "st0 == UNMATCHED (created 201, not an error, despite SUSPENDED agreement)"
            - "st1 == MATCHED and price1 == 200 after resume + resolve"

