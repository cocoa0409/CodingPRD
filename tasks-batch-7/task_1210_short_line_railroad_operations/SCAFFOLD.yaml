scenario: "Short Line Railroad Operations (Genesee & Wyoming short line): customer car order & switching schedule, interchange with Class I & car hire accounting, track inspection & FRA class-speed compliance, crew calling & hours-of-service limits, tariff/division of revenue on through movement, industry siding maintenance agreements, derailment/incident reporting, grant-funded infrastructure project"
domain_name: "short-line-railroad-operations"
api_prefix: "/rail"
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, ops_run_checkpoint]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the shipper" }
      - { name: billing_email, type: string, source: input, description: "Invoice delivery email" }
      - { name: demurrage_free_days, type: integer, source: input, description: "Free loading days before demurrage accrues", default: 2 }
      - { name: credit_status, type: enum, source: system, description: "GOOD or SUSPENDED; starts GOOD; changed via PATCH /rail/customers/{id}", default: GOOD, constraints: "enum {GOOD, SUSPENDED}" }

  - name: IndustrySiding
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning shipper" }
      - { name: name, type: string, source: input, description: "Siding name" }
      - { name: capacity_cars, type: integer, source: input, description: "Max cars the siding can hold" }
      - { name: serving_track_segment_id, type: string, source: input, description: "FK -> TrackSegment.id; segment the siding connects to" }
      - { name: agreement_expires_on, type: datetime, source: input, description: "Siding maintenance agreement expiry instant" }
      - { name: maintenance_agreement_status, type: enum, source: system, description: "ACTIVE at creation; EXPIRED via clock sweep when now >= agreement_expires_on; SUSPENDED via suspend endpoint; ACTIVE again via renew", default: ACTIVE, constraints: "enum {ACTIVE, EXPIRED, SUSPENDED}" }

  - name: CarOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering shipper" }
      - { name: siding_id, type: string, source: input, description: "FK -> IndustrySiding.id; delivery siding; must belong to customer_id" }
      - { name: car_type, type: enum, source: input, description: "Requested car type", constraints: "enum {BOX, HOPPER, TANK, FLAT, GONDOLA}" }
      - { name: quantity, type: integer, source: input, description: "Cars requested; >= 1" }
      - { name: needed_by_date, type: datetime, source: input, description: "Customer need-by instant" }
      - { name: status, type: enum, source: system, description: "Order lifecycle", default: PLACED, constraints: "enum {PLACED, ACCEPTED, PARTIALLY_FURNISHED, FURNISHED, RELEASED, COMPLETED, CANCELLED}" }
      - { name: cars_furnished_count, type: integer, source: computed, description: "Count of Railcar rows with assigned_order_id == this order id", default: 0 }
      - { name: furnished_at, type: datetime, source: system, description: "Clock value of the first successful furnish; demurrage baseline" }
      - { name: released_at, type: datetime, source: system, description: "Clock value of release transition" }

  - name: Railcar
    parent: null
    common_fields: true
    fields:
      - { name: reporting_mark, type: string, source: input, description: "Unique AAR reporting mark, e.g. GNWR 5001" }
      - { name: car_type, type: enum, source: input, description: "Car type", constraints: "enum {BOX, HOPPER, TANK, FLAT, GONDOLA}" }
      - { name: ownership, type: enum, source: input, description: "HOME = owned by this railroad; FOREIGN = owned by connecting road (car hire payable)", constraints: "enum {HOME, FOREIGN}" }
      - { name: home_road_mark, type: string, source: input, description: "Owner road mark for FOREIGN cars" }
      - { name: status, type: enum, source: system, description: "Fleet status", default: AVAILABLE, constraints: "enum {AVAILABLE, ASSIGNED, LOADED, IN_TRANSIT, INTERCHANGED_OUT, BAD_ORDER, HELD}" }
      - { name: current_location_segment_id, type: string, source: input, description: "FK -> TrackSegment.id; nullable; where the car sits" }
      - { name: assigned_order_id, type: string, source: system, description: "FK -> CarOrder.id; nullable; set by furnish, cleared by cancel/release" }
      - { name: hire_rate_per_hour_cents, type: integer, source: input, description: "Car hire hourly rate payable to owner (FOREIGN cars)" }
      - { name: hire_rate_per_mile_cents, type: integer, source: input, description: "Car hire mileage rate payable to owner (FOREIGN cars)" }

  - name: SwitchJob
    parent: null
    common_fields: true
    fields:
      - { name: car_order_id, type: string, source: input, description: "FK -> CarOrder.id; nullable; order this job serves" }
      - { name: scheduled_date, type: string, source: input, description: "Planned service date (YYYY-MM-DD)" }
      - { name: notes, type: string, source: input, description: "Free-text work notes" }
      - { name: crew_call_id, type: string, source: system, description: "FK -> CrewCall.id; nullable; set by assign" }
      - { name: status, type: enum, source: system, description: "Job lifecycle", default: PLANNED, constraints: "enum {PLANNED, ASSIGNED, COMPLETED, ANNULLED}" }

  - name: TrainMovement
    parent: null
    common_fields: true
    fields:
      - { name: symbol, type: string, source: input, description: "Train symbol, e.g. GW-101" }
      - { name: route_segment_ids, type: array, source: input, description: "Ordered array of TrackSegment.id values forming the route (not a single FK field)" }
      - { name: origin_interchange_id, type: string, source: input, description: "FK -> InterchangeEvent.id; nullable; interchange that originated this movement" }
      - { name: status, type: enum, source: system, description: "Movement lifecycle", default: PLANNED, constraints: "enum {PLANNED, READY, DEPARTED, HELD, ARRIVED, SETTLED, ANNULLED}" }
      - { name: max_speed_mph, type: integer, source: computed, description: "min of effective_speed_mph over route_segment_ids" }
      - { name: departed_at, type: datetime, source: system, description: "Clock value at depart" }
      - { name: arrived_at, type: datetime, source: system, description: "Clock value at arrive" }

  - name: InterchangeEvent
    parent: null
    common_fields: true
    fields:
      - { name: class_i_partner, type: string, source: input, description: "Connecting Class I road mark, e.g. CSX" }
      - { name: direction, type: enum, source: input, description: "RECEIVED = car enters our line; DELIVERED = car leaves our line", constraints: "enum {RECEIVED, DELIVERED}" }
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id; the interchanged car" }
      - { name: waybill_id, type: string, source: input, description: "FK -> Waybill.id; nullable; through waybill for DELIVERED loads" }
      - { name: occurred_at, type: datetime, source: input, description: "Interchange instant; defaults to logical clock when omitted" }
      - { name: miles_traveled_on_line, type: integer, source: input, description: "Miles hauled on our line; required for DELIVERED of FOREIGN cars" }
      - { name: status, type: enum, source: system, description: "Event lifecycle", default: REPORTED, constraints: "enum {REPORTED, CONFIRMED, DISPUTED}" }

  - name: CarHireStatement
    parent: null
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: system, description: "FK -> Railcar.id; FOREIGN car this statement accrues for" }
      - { name: period_month, type: string, source: system, description: "Accrual period, YYYY-MM of hire_accrual_start" }
      - { name: hire_accrual_start, type: datetime, source: system, description: "Clock value when RECEIVED confirm started accrual" }
      - { name: hire_accrual_end, type: datetime, source: system, description: "Clock value when DELIVERED confirm stopped accrual; null while on line" }
      - { name: accrued_hours, type: integer, source: computed, description: "floor((min(now, hire_accrual_end or now) - hire_accrual_start)/3600)" }
      - { name: accrued_miles, type: integer, source: system, description: "Miles recorded at DELIVERED confirm; 0 until then", default: 0 }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "accrued_hours * hire_rate_per_hour_cents; mileage excluded; recomputed on read" }
      - { name: final_amount_cents, type: integer, source: computed, description: "null until CLOSED; then max(MIN_HIRE_CENTS, time_component + mileage_component)" }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", default: OPEN, constraints: "enum {OPEN, CLOSED, SETTLED, DISPUTED}" }

  - name: Waybill
    parent: null
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id; car carrying the shipment" }
      - { name: origin_customer_id, type: string, source: input, description: "FK -> Customer.id; shipper" }
      - { name: car_order_id, type: string, source: input, description: "FK -> CarOrder.id; nullable; order that supplied the car" }
      - { name: movement_id, type: string, source: input, description: "FK -> TrainMovement.id; nullable; train carrying the car" }
      - { name: destination, type: string, source: input, description: "Destination station or off-line junction" }
      - { name: commodity, type: enum, source: input, description: "Rated commodity", constraints: "enum {GRAIN, LUMBER, CHEMICALS}" }
      - { name: weight_tons, type: integer, source: input, description: "Billed weight in tons" }
      - { name: through_route, type: boolean, source: input, description: "true when revenue divides with a connecting road" }
      - { name: our_miles, type: integer, source: input, description: "Miles hauled by us; required when through_route true" }
      - { name: total_miles, type: integer, source: input, description: "Total route miles; required when through_route true; must be >= our_miles >= 0" }
      - { name: total_freight_charge_cents, type: integer, source: computed, description: "weight_tons * COMMODITY_RATE_CENTS_PER_TON[commodity]; set at rate" }
      - { name: status, type: enum, source: system, description: "Waybill lifecycle", default: CREATED, constraints: "enum {CREATED, RATED, BILLED, SETTLED}" }

  - name: RevenueDivision
    parent: null
    common_fields: true
    fields:
      - { name: waybill_id, type: string, source: input, description: "FK -> Waybill.id; exactly one division per waybill" }
      - { name: basis, type: enum, source: input, description: "Division basis", constraints: "enum {MILEAGE_PRORATE, AGREED_PERCENTAGE}" }
      - { name: agreed_pct, type: number, source: input, description: "Our share fraction in (0,1); required when basis == AGREED_PERCENTAGE" }
      - { name: our_miles, type: integer, source: system, description: "Snapshot of Waybill.our_miles at creation" }
      - { name: total_miles, type: integer, source: system, description: "Snapshot of Waybill.total_miles at creation" }
      - { name: total_charge_cents, type: integer, source: system, description: "Snapshot of Waybill.total_freight_charge_cents at creation" }
      - { name: our_share_cents, type: integer, source: computed, description: "Per calculations.revenue_division_share; rounding order pinned there" }
      - { name: connecting_share_cents, type: integer, source: computed, description: "total_charge_cents - our_share_cents" }
      - { name: status, type: enum, source: system, description: "Division lifecycle", default: DRAFT, constraints: "enum {DRAFT, AGREED, DISPUTED, SETTLED}" }

  - name: TrackSegment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Segment name, e.g. 'Main MP 10-14'" }
      - { name: milepost_start, type: number, source: input, description: "Start milepost" }
      - { name: milepost_end, type: number, source: input, description: "End milepost; must be > milepost_start" }
      - { name: fra_class, type: enum, source: input, description: "FRA track class", constraints: "enum {EXCEPTED, CLASS_1, CLASS_2, CLASS_3, CLASS_4, CLASS_5}" }
      - { name: effective_speed_mph, type: integer, source: computed, description: "min(CLASS_SPEED_MPH[fra_class], DEFECT_CAP_MPH[open_defect_severity] when defect_open)" }
      - { name: defect_open, type: boolean, source: system, description: "true while any DEFECT_FILED inspection on this segment is unresolved", default: false }
      - { name: open_defect_severity, type: enum, source: system, description: "Severity of the open defect; null when defect_open false", constraints: "enum {MONITOR, CRITICAL}" }
      - { name: is_overdue, type: boolean, source: system, description: "true when now > last_inspection_at + INSPECTION_FREQ_DAYS[fra_class]", default: false }
      - { name: status, type: enum, source: system, description: "IN_SERVICE or RESTRICTED (defect CRITICAL or overdue sweep)", default: IN_SERVICE, constraints: "enum {IN_SERVICE, RESTRICTED}" }
      - { name: last_inspection_at, type: datetime, source: system, description: "Creation clock value initially; refreshed by inspection file" }

  - name: TrackInspection
    parent: null
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> TrackSegment.id; inspected segment" }
      - { name: scheduled_date, type: string, source: input, description: "Planned inspection day (YYYY-MM-DD); closed day interval" }
      - { name: status, type: enum, source: system, description: "Inspection lifecycle", default: SCHEDULED, constraints: "enum {SCHEDULED, FILED, DEFECT_FILED, REMEDIATED, WAIVED}" }
      - { name: defect_found, type: boolean, source: system, description: "Set by file endpoint" }
      - { name: defect_severity, type: enum, source: system, description: "Set by file endpoint when defect_found true", constraints: "enum {MONITOR, CRITICAL}" }
      - { name: findings, type: string, source: system, description: "Inspector narrative from file endpoint" }
      - { name: filed_at, type: datetime, source: system, description: "Clock value at filing" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Employee name" }
      - { name: craft, type: enum, source: input, description: "Crew craft", constraints: "enum {ENGINEER, CONDUCTOR}" }
      - { name: status, type: enum, source: system, description: "Duty posture", default: AVAILABLE, constraints: "enum {AVAILABLE, ON_DUTY, RESTING}" }
      - { name: on_duty_minutes_rolling_24h, type: integer, source: system, description: "On-duty minutes in the trailing 24h; corrected via adjust-hos", default: 0 }
      - { name: on_duty_minutes_month, type: integer, source: system, description: "On-duty minutes in the calendar month; corrected via adjust-hos", default: 0 }
      - { name: rest_minutes_completed, type: integer, source: system, description: "null = fully rested; 0..599 after duty until rest sweep completes" }
      - { name: rest_start_at, type: datetime, source: system, description: "Clock value at relieve; null when rested" }
      - { name: hos_available_minutes, type: integer, source: computed, description: "max(0, min(HOS_DAILY_LIMIT_MINUTES - on_duty_minutes_rolling_24h, HOS_MONTHLY_LIMIT_MINUTES - on_duty_minutes_month))" }

  - name: CrewCall
    parent: null
    common_fields: true
    fields:
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; called employee" }
      - { name: movement_id, type: string, source: input, description: "FK -> TrainMovement.id; exactly one of movement_id / switch_job_id required" }
      - { name: switch_job_id, type: string, source: input, description: "FK -> SwitchJob.id; exactly one of movement_id / switch_job_id required" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Planned duty window start (half-open)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Planned duty window end (half-open); must be > scheduled_start_at" }
      - { name: status, type: enum, source: system, description: "Call lifecycle", default: CALLED, constraints: "enum {CALLED, ACCEPTED, DECLINED, ON_DUTY, RELIEVED, EXPIRED}" }
      - { name: on_duty_at, type: datetime, source: system, description: "Clock value at report-on-duty" }
      - { name: off_duty_at, type: datetime, source: system, description: "Clock value at relieve" }
      - { name: actual_on_duty_minutes, type: integer, source: computed, description: "floor((off_duty_at - on_duty_at)/60) at relieve; null before" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: incident_type, type: enum, source: input, description: "Incident category", constraints: "enum {DERAILMENT, COLLISION, CROSSING, HAZMAT, INJURY}" }
      - { name: segment_id, type: string, source: input, description: "FK -> TrackSegment.id; location" }
      - { name: movement_id, type: string, source: input, description: "FK -> TrainMovement.id; nullable; involved train" }
      - { name: occurred_at, type: datetime, source: input, description: "Incident instant" }
      - { name: estimated_damage_cents, type: integer, source: input, description: "Estimated property damage" }
      - { name: injuries_count, type: integer, source: input, description: "Reported injuries", default: 0 }
      - { name: status, type: enum, source: system, description: "Incident lifecycle", default: REPORTED, constraints: "enum {REPORTED, INVESTIGATING, FRA_FILED, CLOSED, REOPENED}" }
      - { name: fra_reportable, type: boolean, source: computed, description: "true when incident_type in {DERAILMENT, COLLISION, HAZMAT} or estimated_damage_cents >= FRA_DAMAGE_THRESHOLD_CENTS" }
      - { name: fra_report_number, type: string, source: system, description: "Assigned at file-fra-report; null before" }

  - name: GrantProject
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: grantor, type: string, source: input, description: "Funding agency, e.g. FRA CRISI" }
      - { name: award_amount_cents, type: integer, source: input, description: "Total grant award" }
      - { name: required_match_pct, type: number, source: input, description: "Railroad match fraction in [0, 100]" }
      - { name: status, type: enum, source: system, description: "Project lifecycle", default: AWARDED, constraints: "enum {AWARDED, ACTIVE, SUSPENDED, COMPLETED}" }
      - { name: committed_cents, type: integer, source: computed, description: "sum of drawdown_cents over milestones with status APPROVED" }
      - { name: drawn_cents, type: integer, source: computed, description: "sum of drawdown_cents over milestones with status PAID" }
      - { name: remaining_cents, type: integer, source: computed, description: "award_amount_cents - committed_cents - drawn_cents" }
      - { name: percent_complete, type: number, source: computed, description: "round(sum(milestone_value_cents over status in {APPROVED, PAID}) / award_amount_cents * 100, 2)" }

  - name: GrantMilestone
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> GrantProject.id; owning project" }
      - { name: name, type: string, source: input, description: "Milestone name" }
      - { name: milestone_value_cents, type: integer, source: input, description: "Award value attributed to this milestone" }
      - { name: actual_cost_cents, type: integer, source: system, description: "Submitted at submit; basis for drawdown" }
      - { name: status, type: enum, source: system, description: "Milestone lifecycle", default: PENDING, constraints: "enum {PENDING, SUBMITTED, APPROVED, REJECTED, PAID}" }
      - { name: drawdown_cents, type: integer, source: computed, description: "null until APPROVED; per calculations.grant_drawdown" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock value at submit" }

state_machines:
  - entity: CarOrder
    initial_state: PLACED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLACED
        to: ACCEPTED
        trigger: "POST /rail/car-orders/{id}/accept"
        actor: Dispatcher
        preconditions:
          - "IndustrySiding (siding_id) maintenance_agreement_status == ACTIVE"
          - "quantity <= IndustrySiding.capacity_cars"
          - "Customer (customer_id) credit_status == GOOD"
        side_effects: ["increments CarOrder.version by 1"]
      - from: ACCEPTED
        to: PARTIALLY_FURNISHED
        trigger: "POST /rail/car-orders/{id}/furnish with count < (quantity - cars_furnished_count)"
        actor: Dispatcher
        preconditions: ["count >= 1", "eligible railcars (status AVAILABLE, car_type == order car_type) >= count"]
        side_effects:
          - "first furnish sets furnished_at = clock"
          - "selected railcars (ranking: created_at ASC, tie-break reporting_mark ASC) -> status ASSIGNED, assigned_order_id = order id"
          - "increments CarOrder.version by 1"
      - from: ACCEPTED
        to: FURNISHED
        trigger: "POST /rail/car-orders/{id}/furnish with count == (quantity - cars_furnished_count)"
        actor: Dispatcher
        preconditions: ["count >= 1", "eligible railcars >= count"]
        side_effects:
          - "first furnish sets furnished_at = clock"
          - "selected railcars -> ASSIGNED, assigned_order_id = order id"
          - "increments CarOrder.version by 1"
      - from: PARTIALLY_FURNISHED
        to: PARTIALLY_FURNISHED
        trigger: "POST /rail/car-orders/{id}/furnish with count < remaining"
        actor: Dispatcher
        preconditions: ["count >= 1", "eligible railcars >= count"]
        side_effects: ["selected railcars -> ASSIGNED", "increments CarOrder.version by 1"]
      - from: PARTIALLY_FURNISHED
        to: FURNISHED
        trigger: "POST /rail/car-orders/{id}/furnish with count == remaining"
        actor: Dispatcher
        preconditions: ["count >= 1", "eligible railcars >= count"]
        side_effects: ["selected railcars -> ASSIGNED", "increments CarOrder.version by 1"]
      - from: FURNISHED
        to: RELEASED
        trigger: "POST /rail/car-orders/{id}/release"
        actor: CustomerRep
        preconditions: []
        side_effects:
          - "released_at = clock"
          - "railcars with assigned_order_id == order id -> status LOADED, assigned_order_id = null"
          - "increments CarOrder.version by 1"
      - from: PARTIALLY_FURNISHED
        to: RELEASED
        trigger: "POST /rail/car-orders/{id}/release"
        actor: CustomerRep
        preconditions: []
        side_effects:
          - "released_at = clock"
          - "assigned railcars -> LOADED, assigned_order_id = null"
          - "increments CarOrder.version by 1"
      - from: RELEASED
        to: COMPLETED
        trigger: "system: cascade when the first Waybill with car_order_id == this order reaches BILLED"
        actor: system
        preconditions: []
        side_effects: ["increments CarOrder.version by 1"]
      - from: PLACED
        to: CANCELLED
        trigger: "POST /rail/car-orders/{id}/cancel"
        actor: CustomerRep
        preconditions: []
        side_effects: ["increments CarOrder.version by 1"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /rail/car-orders/{id}/cancel"
        actor: CustomerRep
        preconditions: []
        side_effects: ["increments CarOrder.version by 1"]
      - from: PARTIALLY_FURNISHED
        to: CANCELLED
        trigger: "POST /rail/car-orders/{id}/cancel"
        actor: CustomerRep
        preconditions: []
        side_effects:
          - "railcars with assigned_order_id == order id -> status AVAILABLE, assigned_order_id = null"
          - "increments CarOrder.version by 1"
      - from: FURNISHED
        to: CANCELLED
        trigger: "POST /rail/car-orders/{id}/cancel"
        actor: CustomerRep
        preconditions: []
        side_effects:
          - "railcars with assigned_order_id == order id -> status AVAILABLE, assigned_order_id = null"
          - "increments CarOrder.version by 1"
      - from: PLACED
        to: PLACED
        trigger: "PATCH /rail/car-orders/{id}"
        actor: CustomerRep
        preconditions: ["expected_car_order_version == CarOrder.version", "quantity (if given) >= cars_furnished_count"]
        side_effects: ["increments CarOrder.version by 1"]
        note: "OCC amendment; same-state self transition"
      - from: ACCEPTED
        to: ACCEPTED
        trigger: "PATCH /rail/car-orders/{id}"
        actor: CustomerRep
        preconditions: ["expected_car_order_version == CarOrder.version", "quantity (if given) >= cars_furnished_count"]
        side_effects: ["increments CarOrder.version by 1"]
      - from: PARTIALLY_FURNISHED
        to: PARTIALLY_FURNISHED
        trigger: "PATCH /rail/car-orders/{id}"
        actor: CustomerRep
        preconditions: ["expected_car_order_version == CarOrder.version", "quantity (if given) >= cars_furnished_count"]
        side_effects: ["increments CarOrder.version by 1"]

  - entity: Railcar
    initial_state: AVAILABLE
    terminal_states: [INTERCHANGED_OUT]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system: selected by POST /rail/car-orders/{id}/furnish"
        actor: system
        preconditions: ["car_type matches order", "selected by ranking created_at ASC, tie-break reporting_mark ASC"]
        side_effects: ["assigned_order_id = order id", "increments Railcar.version by 1"]
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system: owning CarOrder cancelled"
        actor: system
        preconditions: []
        side_effects: ["assigned_order_id = null", "increments Railcar.version by 1"]
      - from: ASSIGNED
        to: LOADED
        trigger: "system: owning CarOrder released"
        actor: system
        preconditions: []
        side_effects: ["assigned_order_id = null", "increments Railcar.version by 1"]
      - from: LOADED
        to: IN_TRANSIT
        trigger: "system: a TrainMovement carrying a Waybill with railcar_id == this car departs"
        actor: system
        preconditions: []
        side_effects: ["increments Railcar.version by 1"]
      - from: IN_TRANSIT
        to: AVAILABLE
        trigger: "system: carrying movement arrives and the waybill is not through_route"
        actor: system
        preconditions: []
        side_effects: ["increments Railcar.version by 1"]
      - from: IN_TRANSIT
        to: INTERCHANGED_OUT
        trigger: "POST /rail/interchange-events/{id}/confirm with direction DELIVERED"
        actor: SettlementClerk
        preconditions: ["railcar.ownership == FOREIGN or HOME; status in {LOADED, IN_TRANSIT, AVAILABLE}"]
        side_effects:
          - "if ownership == FOREIGN: open CarHireStatement accrual stops (hire_accrual_end = clock), final_amount_cents computed, statement -> CLOSED"
          - "increments Railcar.version by 1"
      - from: LOADED
        to: INTERCHANGED_OUT
        trigger: "POST /rail/interchange-events/{id}/confirm with direction DELIVERED"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["same as IN_TRANSIT -> INTERCHANGED_OUT", "increments Railcar.version by 1"]
      - from: AVAILABLE
        to: INTERCHANGED_OUT
        trigger: "POST /rail/interchange-events/{id}/confirm with direction DELIVERED"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["same as IN_TRANSIT -> INTERCHANGED_OUT", "increments Railcar.version by 1"]
      - from: AVAILABLE
        to: BAD_ORDER
        trigger: "POST /rail/railcars/{id}/bad-order"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments Railcar.version by 1"]
      - from: ASSIGNED
        to: BAD_ORDER
        trigger: "POST /rail/railcars/{id}/bad-order"
        actor: Dispatcher
        preconditions: []
        side_effects: ["assigned_order_id = null (car withdrawn from order; order cars_furnished_count recomputes)", "increments Railcar.version by 1"]
      - from: BAD_ORDER
        to: AVAILABLE
        trigger: "POST /rail/railcars/{id}/return-to-service"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments Railcar.version by 1"]
      - from: LOADED
        to: HELD
        trigger: "system: cascade from POST /rail/incidents when the car is on the incident movement"
        actor: system
        preconditions: []
        side_effects: ["increments Railcar.version by 1"]
      - from: IN_TRANSIT
        to: HELD
        trigger: "system: cascade from POST /rail/incidents"
        actor: system
        preconditions: []
        side_effects: ["increments Railcar.version by 1"]
      - from: HELD
        to: AVAILABLE
        trigger: "POST /rail/railcars/{id}/return-to-service"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments Railcar.version by 1"]

  - entity: CrewMember
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_DUTY
        trigger: "system: linked CrewCall report-on-duty"
        actor: system
        preconditions: []
        side_effects: ["rest_minutes_completed = null", "rest_start_at = null", "increments CrewMember.version by 1"]
      - from: ON_DUTY
        to: RESTING
        trigger: "system: linked CrewCall relieve"
        actor: system
        preconditions: []
        side_effects:
          - "on_duty_minutes_rolling_24h += call.actual_on_duty_minutes"
          - "on_duty_minutes_month += call.actual_on_duty_minutes"
          - "rest_minutes_completed = 0; rest_start_at = clock"
          - "increments CrewMember.version by 1"
      - from: RESTING
        to: AVAILABLE
        trigger: "system: POST /rail/_clock/set_current_utc sweep when now - rest_start_at >= HOS_REQUIRED_REST_MINUTES"
        actor: system
        preconditions: []
        side_effects: ["rest_minutes_completed = null", "rest_start_at = null", "increments CrewMember.version by 1"]

  - entity: CrewCall
    initial_state: CALLED
    terminal_states: [DECLINED, EXPIRED, RELIEVED]
    transitions:
      - from: CALLED
        to: ACCEPTED
        trigger: "POST /rail/crew-calls/{id}/respond with response ACCEPTED"
        actor: Conductor
        preconditions: ["X-User-ID == crew_member_id"]
        side_effects: ["increments CrewCall.version by 1"]
      - from: CALLED
        to: DECLINED
        trigger: "POST /rail/crew-calls/{id}/respond with response DECLINED"
        actor: Conductor
        preconditions: ["X-User-ID == crew_member_id"]
        side_effects: ["increments CrewCall.version by 1"]
      - from: CALLED
        to: EXPIRED
        trigger: "system: cascade when linked TrainMovement is ANNULLED"
        actor: system
        preconditions: []
        side_effects: ["increments CrewCall.version by 1"]
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system: cascade when linked TrainMovement is ANNULLED"
        actor: system
        preconditions: []
        side_effects: ["increments CrewCall.version by 1"]
      - from: ACCEPTED
        to: ON_DUTY
        trigger: "POST /rail/crew-calls/{id}/report-on-duty"
        actor: Conductor
        preconditions: ["X-User-ID == crew_member_id"]
        side_effects: ["on_duty_at = clock", "CrewMember AVAILABLE -> ON_DUTY", "increments CrewCall.version by 1"]
      - from: ON_DUTY
        to: RELIEVED
        trigger: "POST /rail/crew-calls/{id}/relieve"
        actor: CrewCaller
        preconditions: []
        side_effects:
          - "off_duty_at = clock; actual_on_duty_minutes computed"
          - "CrewMember ON_DUTY -> RESTING with accumulator update"
          - "increments CrewCall.version by 1"

  - entity: SwitchJob
    initial_state: PLANNED
    terminal_states: [COMPLETED, ANNULLED]
    transitions:
      - from: PLANNED
        to: ASSIGNED
        trigger: "POST /rail/switch-jobs/{id}/assign"
        actor: Dispatcher
        preconditions: ["crew_call_id references a CrewCall with status in {ACCEPTED, ON_DUTY} and switch_job_id == this job"]
        side_effects: ["crew_call_id set", "increments SwitchJob.version by 1"]
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /rail/switch-jobs/{id}/complete"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments SwitchJob.version by 1"]
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /rail/switch-jobs/{id}/complete"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments SwitchJob.version by 1"]
      - from: PLANNED
        to: ANNULLED
        trigger: "POST /rail/switch-jobs/{id}/annul"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments SwitchJob.version by 1"]
      - from: ASSIGNED
        to: ANNULLED
        trigger: "POST /rail/switch-jobs/{id}/annul"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments SwitchJob.version by 1"]

  - entity: TrainMovement
    initial_state: PLANNED
    terminal_states: [SETTLED, ANNULLED]
    transitions:
      - from: PLANNED
        to: READY
        trigger: "POST /rail/train-movements/{id}/ready"
        actor: Dispatcher
        preconditions:
          - "every TrackSegment in route_segment_ids has status == IN_SERVICE"
          - "at least one CrewCall with movement_id == this movement has status in {ACCEPTED, ON_DUTY}"
        side_effects: ["max_speed_mph recomputed", "increments TrainMovement.version by 1"]
      - from: READY
        to: DEPARTED
        trigger: "POST /rail/train-movements/{id}/depart"
        actor: Dispatcher
        preconditions: ["every TrackSegment in route_segment_ids has status == IN_SERVICE and defect_open == false"]
        side_effects:
          - "departed_at = clock"
          - "railcars on waybills with movement_id == this movement -> IN_TRANSIT"
          - "increments TrainMovement.version by 1"
      - from: DEPARTED
        to: HELD
        trigger: "POST /rail/train-movements/{id}/hold OR system cascade when a route segment gains a CRITICAL open defect"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments TrainMovement.version by 1"]
      - from: HELD
        to: DEPARTED
        trigger: "POST /rail/train-movements/{id}/resume"
        actor: Dispatcher
        preconditions: ["every TrackSegment in route_segment_ids has status == IN_SERVICE"]
        side_effects: ["increments TrainMovement.version by 1"]
      - from: DEPARTED
        to: ARRIVED
        trigger: "POST /rail/train-movements/{id}/arrive"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "arrived_at = clock"
          - "railcars on non-through waybills of this movement -> AVAILABLE"
          - "increments TrainMovement.version by 1"
      - from: ARRIVED
        to: SETTLED
        trigger: "POST /rail/train-movements/{id}/settle"
        actor: SettlementClerk
        preconditions: ["every Waybill with movement_id == this movement has status in {RATED, BILLED}"]
        side_effects:
          - "waybills with status RATED -> BILLED"
          - "for each through_route waybill: RevenueDivision auto-created DRAFT with basis MILEAGE_PRORATE (snapshot fields copied)"
          - "for each non-through waybill: BILLED -> SETTLED immediately"
          - "CarOrder linked via car_order_id on any billed waybill: RELEASED -> COMPLETED"
          - "increments TrainMovement.version by 1"
      - from: PLANNED
        to: ANNULLED
        trigger: "system: cascade when a route segment becomes RESTRICTED by CRITICAL defect"
        actor: system
        preconditions: []
        side_effects:
          - "CrewCalls with movement_id == this movement and status in {CALLED, ACCEPTED} -> EXPIRED"
          - "increments TrainMovement.version by 1"
      - from: READY
        to: ANNULLED
        trigger: "system: cascade when a route segment becomes RESTRICTED by CRITICAL defect"
        actor: system
        preconditions: []
        side_effects:
          - "CrewCalls with movement_id == this movement and status in {CALLED, ACCEPTED} -> EXPIRED"
          - "increments TrainMovement.version by 1"

  - entity: InterchangeEvent
    initial_state: REPORTED
    terminal_states: [CONFIRMED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /rail/interchange-events/{id}/confirm"
        actor: SettlementClerk
        preconditions: []
        side_effects:
          - "direction RECEIVED, ownership FOREIGN: CarHireStatement created (or OPEN one for (railcar_id, current period) reused) with hire_accrual_start = clock"
          - "direction DELIVERED: railcar -> INTERCHANGED_OUT; FOREIGN car's OPEN statement closes with final_amount_cents"
          - "increments InterchangeEvent.version by 1"
      - from: CONFIRMED
        to: DISPUTED
        trigger: "POST /rail/interchange-events/{id}/dispute"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["increments InterchangeEvent.version by 1"]
      - from: DISPUTED
        to: CONFIRMED
        trigger: "POST /rail/interchange-events/{id}/resolve"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["increments InterchangeEvent.version by 1"]

  - entity: CarHireStatement
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /rail/car-hire-statements/{id}/close OR system cascade at DELIVERED confirm"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["final_amount_cents computed and frozen", "increments CarHireStatement.version by 1"]
      - from: CLOSED
        to: SETTLED
        trigger: "POST /rail/car-hire-statements/{id}/settle"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["increments CarHireStatement.version by 1"]
      - from: CLOSED
        to: DISPUTED
        trigger: "POST /rail/car-hire-statements/{id}/dispute"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["increments CarHireStatement.version by 1"]
      - from: DISPUTED
        to: OPEN
        trigger: "POST /rail/car-hire-statements/{id}/reopen"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["final_amount_cents recomputed on next close", "increments CarHireStatement.version by 1"]

  - entity: Waybill
    initial_state: CREATED
    terminal_states: [SETTLED]
    transitions:
      - from: CREATED
        to: RATED
        trigger: "POST /rail/waybills/{id}/rate"
        actor: SettlementClerk
        preconditions: ["railcar status not in {INTERCHANGED_OUT, BAD_ORDER, HELD}"]
        side_effects: ["total_freight_charge_cents computed", "increments Waybill.version by 1"]
      - from: RATED
        to: BILLED
        trigger: "system: carrying TrainMovement settle"
        actor: system
        preconditions: []
        side_effects: ["increments Waybill.version by 1"]
      - from: BILLED
        to: SETTLED
        trigger: "system: RevenueDivision for this waybill reaches SETTLED, or immediately at movement settle when not through_route"
        actor: system
        preconditions: []
        side_effects: ["increments Waybill.version by 1"]

  - entity: RevenueDivision
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: AGREED
        trigger: "POST /rail/revenue-divisions/{id}/agree"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["increments RevenueDivision.version by 1"]
      - from: AGREED
        to: DISPUTED
        trigger: "POST /rail/revenue-divisions/{id}/dispute"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["increments RevenueDivision.version by 1"]
      - from: DISPUTED
        to: AGREED
        trigger: "POST /rail/revenue-divisions/{id}/agree"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["increments RevenueDivision.version by 1"]
      - from: AGREED
        to: SETTLED
        trigger: "POST /rail/revenue-divisions/{id}/settle"
        actor: SettlementClerk
        preconditions: []
        side_effects: ["Waybill (waybill_id) BILLED -> SETTLED", "increments RevenueDivision.version by 1"]

  - entity: TrackSegment
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: RESTRICTED
        trigger: "system: inspection filed with CRITICAL defect, OR clock sweep when now > last_inspection_at + INSPECTION_FREQ_DAYS[fra_class] days"
        actor: system
        preconditions: []
        side_effects:
          - "is_overdue set by sweep; defect_open/open_defect_severity set by defect filing"
          - "effective_speed_mph recomputed"
          - "TrainMovements in {PLANNED, READY} with this segment in route -> ANNULLED (cascade continues to their CrewCalls)"
          - "TrainMovements DEPARTED with this segment in route -> HELD"
          - "increments TrackSegment.version by 1"
      - from: RESTRICTED
        to: IN_SERVICE
        trigger: "system: open defect remediated or waived AND not overdue (a fresh filing refreshes last_inspection_at)"
        actor: system
        preconditions: []
        side_effects: ["defect_open = false; open_defect_severity = null; is_overdue = false", "effective_speed_mph recomputed", "increments TrackSegment.version by 1"]

  - entity: TrackInspection
    initial_state: SCHEDULED
    terminal_states: [FILED, REMEDIATED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: FILED
        trigger: "POST /rail/track-inspections/{id}/file with defect_found false"
        actor: TrackInspector
        preconditions: []
        side_effects: ["filed_at = clock", "segment.last_inspection_at = clock; segment is_overdue cleared", "increments TrackInspection.version by 1"]
      - from: SCHEDULED
        to: DEFECT_FILED
        trigger: "POST /rail/track-inspections/{id}/file with defect_found true"
        actor: TrackInspector
        preconditions: ["defect_severity in {MONITOR, CRITICAL}"]
        side_effects:
          - "filed_at = clock; segment.last_inspection_at = clock"
          - "segment.defect_open = true; segment.open_defect_severity = defect_severity; effective_speed_mph recomputed"
          - "severity CRITICAL: segment -> RESTRICTED with movement cascade"
          - "increments TrackInspection.version by 1"
      - from: DEFECT_FILED
        to: REMEDIATED
        trigger: "POST /rail/track-inspections/{id}/remediate"
        actor: TrackInspector
        preconditions: []
        side_effects: ["segment defect cleared; segment RESTRICTED -> IN_SERVICE when not overdue", "increments TrackInspection.version by 1"]
      - from: DEFECT_FILED
        to: WAIVED
        trigger: "POST /rail/track-inspections/{id}/waive"
        actor: RegulatorOfficer
        preconditions: []
        side_effects: ["segment defect cleared; segment RESTRICTED -> IN_SERVICE when not overdue", "increments TrackInspection.version by 1"]

  - entity: IndustrySiding
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /rail/_clock/set_current_utc sweep when now >= agreement_expires_on"
        actor: system
        preconditions: []
        side_effects: ["increments IndustrySiding.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rail/industry-sidings/{id}/suspend"
        actor: SystemAdmin
        preconditions: []
        side_effects: ["increments IndustrySiding.version by 1"]
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /rail/industry-sidings/{id}/renew-agreement"
        actor: SystemAdmin
        preconditions: ["new_expires_on > clock now"]
        side_effects: ["agreement_expires_on = new_expires_on", "increments IndustrySiding.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rail/industry-sidings/{id}/renew-agreement"
        actor: SystemAdmin
        preconditions: ["new_expires_on > clock now"]
        side_effects: ["agreement_expires_on = new_expires_on", "increments IndustrySiding.version by 1"]

  - entity: Incident
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /rail/incidents/{id}/investigate"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments Incident.version by 1"]
      - from: REOPENED
        to: INVESTIGATING
        trigger: "POST /rail/incidents/{id}/investigate"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments Incident.version by 1"]
      - from: INVESTIGATING
        to: FRA_FILED
        trigger: "POST /rail/incidents/{id}/file-fra-report"
        actor: RegulatorOfficer
        preconditions: ["fra_reportable == true"]
        side_effects: ["fra_report_number assigned", "increments Incident.version by 1"]
      - from: INVESTIGATING
        to: CLOSED
        trigger: "POST /rail/incidents/{id}/close"
        actor: RegulatorOfficer
        preconditions: ["fra_reportable == false"]
        side_effects: ["increments Incident.version by 1"]
      - from: FRA_FILED
        to: CLOSED
        trigger: "POST /rail/incidents/{id}/close"
        actor: RegulatorOfficer
        preconditions: []
        side_effects: ["increments Incident.version by 1"]
      - from: CLOSED
        to: REOPENED
        trigger: "POST /rail/incidents/{id}/reopen"
        actor: RegulatorOfficer
        preconditions: []
        side_effects: ["increments Incident.version by 1"]
    note: "creation cascade: railcars on movement_id waybills with status in {LOADED, IN_TRANSIT} -> HELD"

  - entity: GrantProject
    initial_state: AWARDED
    terminal_states: [COMPLETED]
    transitions:
      - from: AWARDED
        to: ACTIVE
        trigger: "POST /rail/grant-projects/{id}/activate"
        actor: GrantManager
        preconditions: []
        side_effects: ["increments GrantProject.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rail/grant-projects/{id}/suspend"
        actor: GrantManager
        preconditions: []
        side_effects: ["increments GrantProject.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rail/grant-projects/{id}/resume"
        actor: GrantManager
        preconditions: []
        side_effects: ["increments GrantProject.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: bubble-up when at least one milestone exists and every GrantMilestone of the project has status PAID"
        actor: system
        preconditions: []
        side_effects: ["increments GrantProject.version by 1"]

  - entity: GrantMilestone
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /rail/grant-milestones/{id}/submit"
        actor: GrantManager
        preconditions: ["project status == ACTIVE", "actual_cost_cents >= 0"]
        side_effects: ["submitted_at = clock; actual_cost_cents recorded", "increments GrantMilestone.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /rail/grant-milestones/{id}/submit"
        actor: GrantManager
        preconditions: ["project status == ACTIVE"]
        side_effects: ["submitted_at = clock; actual_cost_cents replaced", "increments GrantMilestone.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rail/grant-milestones/{id}/approve"
        actor: RegulatorOfficer
        preconditions: []
        side_effects: ["drawdown_cents computed per calculations.grant_drawdown (frozen)", "increments GrantMilestone.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rail/grant-milestones/{id}/reject"
        actor: RegulatorOfficer
        preconditions: []
        side_effects: ["increments GrantMilestone.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /rail/grant-milestones/{id}/pay"
        actor: SettlementClerk
        preconditions: ["project status == ACTIVE"]
        side_effects: ["project drawn_cents/remaining_cents recompute", "bubble-up completion check on project", "increments GrantMilestone.version by 1"]

concurrency_rules:
  - rule_id: car-order-amend-stale-version
    parent_entity: CarOrder
    write_endpoint: "PATCH /rail/car-orders/{id}"
    occ_field: "expected_car_order_version"
    description: |
      Amending a CarOrder whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      accepted or furnished the order (which legitimately supersedes the prior
      observed version under the furnish side effects) and the current writer's
      view of the order is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: crew-member-hos-adjust-stale-version
    parent_entity: CrewMember
    write_endpoint: "POST /rail/crew-members/{id}/adjust-hos"
    occ_field: "expected_crew_member_version"
    description: |
      Correcting hours-of-service accumulators on a CrewMember whose version
      has advanced since the client last observed it is rejected, because duty
      transitions in the interim legitimately changed the accumulators and the
      correction baseline is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: effective_speed_limit
    trigger: "on TrackSegment creation, change-class, defect file, defect remediate, defect waive"
    algorithm: threshold
    formula: |
      base = CLASS_SPEED_MPH[segment.fra_class]
      if segment.defect_open:
          return min(base, DEFECT_CAP_MPH[segment.open_defect_severity])
      return base
    input_set: "the single TrackSegment; uses current defect_open and open_defect_severity"
    constants:
      CLASS_SPEED_MPH: { EXCEPTED: 10, CLASS_1: 10, CLASS_2: 25, CLASS_3: 40, CLASS_4: 60, CLASS_5: 80 }
      DEFECT_CAP_MPH: { MONITOR: 25, CRITICAL: 10 }
    precision: "integer mph, no rounding"

  - name: hos_availability
    trigger: "on POST /rail/crew-calls (eligibility gate) and on GET /rail/crew-members/{id} (computed field hos_available_minutes)"
    algorithm: threshold
    formula: |
      daily_remaining = max(0, HOS_DAILY_LIMIT_MINUTES - member.on_duty_minutes_rolling_24h)
      monthly_remaining = max(0, HOS_MONTHLY_LIMIT_MINUTES - member.on_duty_minutes_month)
      hos_available_minutes = min(daily_remaining, monthly_remaining)
      callable = (member.status == AVAILABLE)
                 AND daily_remaining > 0
                 AND monthly_remaining > 0
                 AND (member.rest_minutes_completed IS NULL OR member.rest_minutes_completed >= HOS_REQUIRED_REST_MINUTES)
    input_set: "the single CrewMember; accumulator fields and rest_minutes_completed as stored"
    constants:
      HOS_DAILY_LIMIT_MINUTES: 720
      HOS_MONTHLY_LIMIT_MINUTES: 16560
      HOS_REQUIRED_REST_MINUTES: 600
    precision: "integer minutes; boundary is strict: rolling == 720 means daily_remaining == 0, NOT callable"

  - name: car_hire_accrual
    trigger: "provisional: on every read of a CarHireStatement; final: on statement close (manual or DELIVERED confirm cascade)"
    algorithm: forward_looking
    formula: |
      end = statement.hire_accrual_end if set else clock_now
      accrued_hours = floor((end - statement.hire_accrual_start) / 3600 seconds)
      provisional_amount_cents = accrued_hours * railcar.hire_rate_per_hour_cents
      time_component = accrued_hours * railcar.hire_rate_per_hour_cents
      mileage_component = statement.accrued_miles * railcar.hire_rate_per_mile_cents
      final_amount_cents = max(MIN_HIRE_CENTS, time_component + mileage_component)
    input_set: "the CarHireStatement and its Railcar; only FOREIGN-owned cars have statements"
    constants:
      MIN_HIRE_CENTS: 3600
    precision: "integer cents; component rounding pinned: round each component to whole cents FIRST (rates are integer cents so components are exact), then sum, then apply the minimum"
    variants:
      - name: provisional
        when: "statement status OPEN or DISPUTED; estimate while car is on line"
        difference: "time-based only; accrued_miles excluded; MIN_HIRE_CENTS not applied; recomputed on each read as the clock advances"
      - name: final
        when: "statement reaches CLOSED (manual close or DELIVERED confirm)"
        difference: "adds mileage_component, applies MIN_HIRE_CENTS floor, frozen at close"

  - name: revenue_division_share
    trigger: "on RevenueDivision creation (manual or settle cascade) and frozen thereafter"
    algorithm: tiered_pricing
    formula: |
      if basis == MILEAGE_PRORATE:
          our_share_cents = round_half_up(total_charge_cents * our_miles / total_miles)
      else:  # AGREED_PERCENTAGE
          our_share_cents = round_half_up(total_charge_cents * agreed_pct)
      connecting_share_cents = total_charge_cents - our_share_cents
    input_set: "the RevenueDivision snapshot fields (total_charge_cents, our_miles, total_miles, agreed_pct)"
    constants: {}
    precision: "rounding order pinned: our_share_cents is rounded FIRST (round_half_up to whole cents); the connecting road receives the unrounded remainder total_charge_cents - our_share_cents; never round both shares independently"
    variants:
      - name: mileage_prorate
        when: "basis == MILEAGE_PRORATE; default for settle-cascade divisions"
        difference: "share proportional to our_miles / total_miles"
      - name: agreed_percentage
        when: "basis == AGREED_PERCENTAGE; bilateral agreement overrides prorate"
        difference: "share = fixed agreed_pct of total; identical waybill data yields a different split than mileage_prorate"

  - name: demurrage_charge
    trigger: "on GET /rail/car-orders/{id}/demurrage"
    algorithm: threshold
    formula: |
      if order.status not in {FURNISHED, PARTIALLY_FURNISHED} or order.furnished_at is null:
          days_loading = 0
      else:
          days_loading = floor((clock_now - order.furnished_at) / 86400 seconds)
      free_days = customer.demurrage_free_days
      billable_days = max(0, days_loading - free_days)
      cars_held = order.cars_furnished_count
      charge_cents = billable_days * cars_held * DEMURRAGE_PER_CAR_PER_DAY_CENTS
    input_set: "the CarOrder, its Customer (free days), and current logical clock"
    constants:
      DEMURRAGE_PER_CAR_PER_DAY_CENTS: 7500
    precision: "integer cents; boundary: days_loading == free_days yields billable_days == 0 (strictly greater than free_days required to bill)"

  - name: inspection_overdue
    trigger: "system sweep inside POST /rail/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      for each TrackSegment:
          deadline = segment.last_inspection_at + INSPECTION_FREQ_DAYS[segment.fra_class] days
          segment.is_overdue = (clock_now > deadline)   # strictly greater; exactly at deadline is NOT overdue
          if segment.is_overdue and segment.status == IN_SERVICE:
              segment.status = RESTRICTED
    input_set: "all TrackSegment rows regardless of status; sweep runs on every clock set"
    constants:
      INSPECTION_FREQ_DAYS: { EXCEPTED: 30, CLASS_1: 7, CLASS_2: 7, CLASS_3: 3, CLASS_4: 2, CLASS_5: 1 }
    precision: "second precision on the deadline comparison"

  - name: grant_drawdown
    trigger: "on GrantMilestone approve"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned to break the apparent circularity between
      # milestone drawdown and project aggregates: read project.committed_cents
      # and project.drawn_cents BEFORE this milestone's drawdown is added.
      cost_basis = round_half_up(milestone.actual_cost_cents * (100 - project.required_match_pct) / 100)
      capped_by_value = min(milestone.milestone_value_cents, cost_basis)
      award_remaining_before = project.award_amount_cents - project.committed_cents - project.drawn_cents
      drawdown_cents = min(capped_by_value, award_remaining_before)
    input_set: "the single GrantMilestone (must be SUBMITTED) and its GrantProject aggregate fields"
    constants: {}
    precision: "integer cents, round_half_up on the cost basis; caps applied in the pinned order: cost basis, then milestone value, then award remaining"

  - name: project_percent_complete
    trigger: "on every read of GrantProject and after any milestone status change"
    algorithm: aggregation
    formula: |
      included = milestones of project with status in {APPROVED, PAID}
      percent_complete = round_half_up(sum(milestone_value_cents over included) / award_amount_cents * 100, 2)
      committed_cents = sum(drawdown_cents over status == APPROVED)
      drawn_cents = sum(drawdown_cents over status == PAID)
      remaining_cents = award_amount_cents - committed_cents - drawn_cents
    input_set: "GrantMilestone rows of the project filtered by status in {APPROVED, PAID} (percent) or exactly APPROVED / exactly PAID (committed/drawn)"
    constants: {}
    precision: "percent_complete 2 decimal places round_half_up; money integer cents"

  - name: waybill_rating
    trigger: "on POST /rail/waybills/{id}/rate"
    algorithm: aggregation
    formula: |
      total_freight_charge_cents = weight_tons * COMMODITY_RATE_CENTS_PER_TON[commodity]
    input_set: "the single Waybill"
    constants:
      COMMODITY_RATE_CENTS_PER_TON: { GRAIN: 38500, LUMBER: 42000, CHEMICALS: 51500 }
    precision: "integer cents; no rounding needed"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a known role name", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is in the endpoint's roles list; for entity-backed roles the X-User-ID matches the owning entity (Conductor == CrewCall.crew_member_id; CustomerRep == CarOrder.customer_id)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path ids and body FK ids resolve to existing resources, validated left-to-right", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "target resource is in a state from which the requested transition is defined (per state machine tables); CrewCall creation also requires CrewMember.status == AVAILABLE here", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "CarOrder PATCH requires order status in {PLACED, ACCEPTED, PARTIALLY_FURNISHED}", error_id: ERR_ORDER_NOT_AMENDABLE, http_status: 409, applies_to: "PATCH /rail/car-orders/{id}" }
  - { priority: 4, category: state, check: "CrewCall create: CrewMember.status == AVAILABLE", error_id: ERR_MEMBER_NOT_AVAILABLE, http_status: 409, applies_to: "POST /rail/crew-calls" }
  - { priority: 5, category: business_safety, check: "CrewCall create: daily remaining > 0 minutes", error_id: ERR_HOS_DAILY_LIMIT, http_status: 422, applies_to: "POST /rail/crew-calls" }
  - { priority: 5, category: business_safety, check: "CrewCall create: monthly remaining > 0 minutes", error_id: ERR_HOS_MONTHLY_LIMIT, http_status: 422, applies_to: "POST /rail/crew-calls" }
  - { priority: 5, category: business_safety, check: "CrewCall create: member fully rested (rest_minutes_completed null or >= 600)", error_id: ERR_HOS_REST_REQUIRED, http_status: 422, applies_to: "POST /rail/crew-calls" }
  - { priority: 5, category: business_safety, check: "CarOrder accept: siding maintenance_agreement_status == ACTIVE", error_id: ERR_SIDING_AGREEMENT_INACTIVE, http_status: 422, applies_to: "POST /rail/car-orders/{id}/accept" }
  - { priority: 5, category: business_safety, check: "Movement ready/depart/resume: every route segment status == IN_SERVICE (depart also defect_open == false)", error_id: ERR_SEGMENT_NOT_IN_SERVICE, http_status: 409, applies_to: "POST /rail/train-movements/{id}/ready, /depart, /resume" }
  - { priority: 5, category: business_safety, check: "Incident close from INVESTIGATING requires fra_reportable == false; reportable incidents must file FRA report first", error_id: ERR_FRA_REPORT_REQUIRED, http_status: 422, applies_to: "POST /rail/incidents/{id}/close" }
  - { priority: 6, category: business_temporal, check: "CrewCall create: [scheduled_start_at, scheduled_end_at) half-open window does not overlap any existing call of the member with status in {CALLED, ACCEPTED, ON_DUTY}; adjacency (new.start == existing.end) is allowed", error_id: ERR_CALL_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /rail/crew-calls" }
  - { priority: 6, category: business_temporal, check: "TrackInspection create: closed day interval on the same segment requires a gap of at least one full day; |new_date - existing_date| < 2 days is rejected", error_id: ERR_INSPECTION_OVERLAP, http_status: 409, applies_to: "POST /rail/track-inspections" }
  - { priority: 7, category: business_constraint, check: "CarOrder accept: quantity <= siding capacity_cars", error_id: ERR_SIDING_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /rail/car-orders/{id}/accept" }
  - { priority: 7, category: business_constraint, check: "CarOrder PATCH: quantity >= cars_furnished_count", error_id: ERR_QUANTITY_BELOW_FURNISHED, http_status: 422, applies_to: "PATCH /rail/car-orders/{id}" }
  - { priority: 7, category: business_constraint, check: "CarOrder furnish: eligible railcars (status AVAILABLE and car_type match) >= count", error_id: ERR_INSUFFICIENT_AVAILABLE_CARS, http_status: 409, applies_to: "POST /rail/car-orders/{id}/furnish" }
  - { priority: 7, category: business_constraint, check: "Railcar create: reporting_mark unique", error_id: ERR_DUPLICATE_REPORTING_MARK, http_status: 409, applies_to: "POST /rail/railcars" }
  - { priority: 7, category: business_constraint, check: "GrantMilestone create: sum of milestone_value_cents over the project's milestones with status != REJECTED, including the new one, <= award_amount_cents", error_id: ERR_MILESTONE_VALUE_EXCEEDS_AWARD, http_status: 422, applies_to: "POST /rail/grant-projects/{id}/milestones" }
  - { priority: 7, category: business_constraint, check: "RevenueDivision create: no existing division for the waybill", error_id: ERR_DIVISION_EXISTS, http_status: 409, applies_to: "POST /rail/revenue-divisions" }
  - { priority: 7, category: business_constraint, check: "InterchangeEvent create direction RECEIVED: no other event for the same railcar with status in {REPORTED, CONFIRMED} and direction RECEIVED that has no matching DELIVERED confirm", error_id: ERR_INTERCHANGE_DUPLICATE, http_status: 409, applies_to: "POST /rail/interchange-events" }
  - { priority: 8, category: business_referential, check: "CrewCall create: exactly one of movement_id / switch_job_id present", error_id: ERR_CALL_TARGET_REQUIRED, http_status: 400, applies_to: "POST /rail/crew-calls" }
  - { priority: 8, category: business_referential, check: "Waybill create/rate: railcar status not in {INTERCHANGED_OUT, BAD_ORDER, HELD}", error_id: ERR_CAR_NOT_ON_LINE, http_status: 409, applies_to: "POST /rail/waybills, POST /rail/waybills/{id}/rate" }
  - { priority: 8, category: business_referential, check: "Movement ready: at least one CrewCall with movement_id == movement and status in {ACCEPTED, ON_DUTY}", error_id: ERR_MOVEMENT_NO_CREW, http_status: 422, applies_to: "POST /rail/train-movements/{id}/ready" }
  - { priority: 8, category: business_referential, check: "Movement settle: every Waybill with movement_id == movement has status in {RATED, BILLED}", error_id: ERR_WAYBILL_NOT_RATED, http_status: 409, applies_to: "POST /rail/train-movements/{id}/settle" }
  - { priority: 8, category: business_referential, check: "InterchangeEvent create direction DELIVERED: railcar status in {AVAILABLE, LOADED, IN_TRANSIT}; miles_traveled_on_line required for FOREIGN cars", error_id: ERR_INTERCHANGE_DIRECTION_INVALID, http_status: 409, applies_to: "POST /rail/interchange-events" }
  - { priority: 8, category: business_referential, check: "Waybill create: through_route true requires our_miles and total_miles present with total_miles >= our_miles >= 0", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "POST /rail/waybills" }
  - { priority: 8, category: business_referential, check: "RevenueDivision create: waybill status in {RATED, BILLED}; basis AGREED_PERCENTAGE requires agreed_pct in (0,1); basis MILEAGE_PRORATE forbids agreed_pct", error_id: ERR_DIVISION_BASIS_INVALID, http_status: 400, applies_to: "POST /rail/revenue-divisions" }
  - { priority: 8, category: business_referential, check: "Incident file-fra-report: fra_reportable == true", error_id: ERR_INCIDENT_NOT_REPORTABLE, http_status: 422, applies_to: "POST /rail/incidents/{id}/file-fra-report" }
  - { priority: 8, category: business_referential, check: "GrantMilestone submit/approve/pay: project status == ACTIVE", error_id: ERR_GRANT_NOT_ACTIVE, http_status: 409, applies_to: "POST /rail/grant-milestones/{id}/submit, /approve, /pay" }
  - { priority: 8, category: business_referential, check: "SwitchJob assign: crew_call exists, status in {ACCEPTED, ON_DUTY}, and its switch_job_id == this job", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /rail/switch-jobs/{id}/assign" }
  - { priority: 9, category: business_fiscal, check: "CarOrder accept: customer credit_status == GOOD", error_id: ERR_CUSTOMER_CREDIT_SUSPENDED, http_status: 422, applies_to: "POST /rail/car-orders/{id}/accept" }
  - { priority: 1, category: auth, check: "malformed or missing required body fields, invalid enum values, invalid types", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all", note: "syntactic body validation runs after auth headers but before business rules; missing required fields surface here" }

endpoints:
  - { method: POST, path: "/rail/_clock/set_current_utc", description: "Advance the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock. Setting the clock runs sweeps: overdue track segments -> RESTRICTED, rested crew members RESTING -> AVAILABLE, expired siding agreements ACTIVE -> EXPIRED.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: { current_utc: string, swept_segments: integer, swept_crew: integer, swept_sidings: integer }, side_effects: [inspection_overdue sweep, crew rest sweep, siding expiry sweep] }

  - { method: POST, path: "/rail/customers", description: "Create a shipper customer", roles: [SystemAdmin], code: 201, input: [name, billing_email, "demurrage_free_days?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/rail/customers", description: "List customers with pagination", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: ["credit_status?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/rail/customers/{id}", description: "Get one customer", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: PATCH, path: "/rail/customers/{id}", description: "Update credit_status or demurrage_free_days", roles: [SystemAdmin], code: 200, input: ["credit_status?", "demurrage_free_days?"], output: Customer, side_effects: ["increments Customer.version by 1"] }

  - { method: POST, path: "/rail/industry-sidings", description: "Create an industry siding with a maintenance agreement", roles: [SystemAdmin], code: 201, input: [customer_id, name, capacity_cars, serving_track_segment_id, agreement_expires_on], output: IndustrySiding, side_effects: [] }
  - { method: GET, path: "/rail/industry-sidings", description: "List sidings, filterable", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: ["customer_id?", "serving_track_segment_id?", "maintenance_agreement_status?", "limit?", "offset?"], output: "IndustrySiding[]", side_effects: [] }
  - { method: GET, path: "/rail/industry-sidings/{id}", description: "Get one siding", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: [], output: IndustrySiding, side_effects: [] }
  - { method: POST, path: "/rail/industry-sidings/{id}/renew-agreement", description: "Renew maintenance agreement (EXPIRED or SUSPENDED -> ACTIVE)", roles: [SystemAdmin], code: 200, input: [new_expires_on], output: IndustrySiding, side_effects: ["agreement_expires_on = new_expires_on", "increments IndustrySiding.version by 1"] }
  - { method: POST, path: "/rail/industry-sidings/{id}/suspend", description: "Suspend a siding maintenance agreement", roles: [SystemAdmin], code: 200, input: [], output: IndustrySiding, side_effects: ["increments IndustrySiding.version by 1"] }

  - { method: POST, path: "/rail/car-orders", description: "Customer places a car order", roles: [CustomerRep], code: 201, input: [customer_id, siding_id, car_type, quantity, needed_by_date], output: CarOrder, side_effects: [] }
  - { method: GET, path: "/rail/car-orders", description: "List car orders, filterable", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: ["customer_id?", "siding_id?", "status?", "limit?", "offset?"], output: "CarOrder[]", side_effects: [] }
  - { method: GET, path: "/rail/car-orders/{id}", description: "Get one car order", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: [], output: CarOrder, side_effects: [] }
  - { method: PATCH, path: "/rail/car-orders/{id}", description: "Amend an order (OCC guarded). Increments CarOrder.version by 1 on success.", roles: [CustomerRep], code: 200, input: ["quantity?", "needed_by_date?", expected_car_order_version], output: CarOrder, side_effects: ["increments CarOrder.version by 1"] }
  - { method: POST, path: "/rail/car-orders/{id}/accept", description: "Dispatcher accepts a placed order", roles: [Dispatcher], code: 200, input: [], output: CarOrder, side_effects: ["increments CarOrder.version by 1"] }
  - { method: POST, path: "/rail/car-orders/{id}/furnish", description: "Assign up to `count` eligible railcars (status AVAILABLE, matching car_type; selected created_at ASC, tie-break reporting_mark ASC)", roles: [Dispatcher], code: 200, input: [count], output: CarOrder, side_effects: ["railcars -> ASSIGNED", "first furnish sets furnished_at", "increments CarOrder.version by 1"] }
  - { method: POST, path: "/rail/car-orders/{id}/release", description: "Customer releases loaded cars to the railroad", roles: [CustomerRep], code: 200, input: [], output: CarOrder, side_effects: ["assigned railcars -> LOADED", "released_at = clock", "increments CarOrder.version by 1"] }
  - { method: POST, path: "/rail/car-orders/{id}/cancel", description: "Cancel an order; furnished cars return to AVAILABLE", roles: [CustomerRep], code: 200, input: [], output: CarOrder, side_effects: ["assigned railcars -> AVAILABLE", "increments CarOrder.version by 1"] }
  - { method: GET, path: "/rail/car-orders/{id}/demurrage", description: "Computed demurrage read per calculations.demurrage_charge", roles: [CustomerRep, Dispatcher, SettlementClerk], code: 200, input: [], output: { billable_days: integer, cars_held: integer, free_days: integer, charge_cents: integer }, side_effects: [] }

  - { method: POST, path: "/rail/railcars", description: "Register a railcar (HOME or FOREIGN)", roles: [SystemAdmin], code: 201, input: [reporting_mark, car_type, ownership, hire_rate_per_hour_cents, hire_rate_per_mile_cents, "home_road_mark?", "current_location_segment_id?"], output: Railcar, side_effects: [] }
  - { method: GET, path: "/rail/railcars", description: "List railcars, filterable", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: ["ownership?", "status?", "car_type?", "current_location_segment_id?", "assigned_order_id?", "limit?", "offset?"], output: "Railcar[]", side_effects: [] }
  - { method: GET, path: "/rail/railcars/{id}", description: "Get one railcar", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: [], output: Railcar, side_effects: [] }
  - { method: POST, path: "/rail/railcars/{id}/bad-order", description: "Mark a car bad-order (out of service for repair)", roles: [Dispatcher], code: 200, input: [], output: Railcar, side_effects: ["clears assigned_order_id when ASSIGNED", "increments Railcar.version by 1"] }
  - { method: POST, path: "/rail/railcars/{id}/return-to-service", description: "Return BAD_ORDER or HELD car to AVAILABLE", roles: [Dispatcher], code: 200, input: [], output: Railcar, side_effects: ["increments Railcar.version by 1"] }

  - { method: POST, path: "/rail/crew-members", description: "Create a crew member", roles: [SystemAdmin], code: 201, input: [name, craft], output: CrewMember, side_effects: [] }
  - { method: GET, path: "/rail/crew-members", description: "List crew members", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: ["status?", "craft?", "limit?", "offset?"], output: "CrewMember[]", side_effects: [] }
  - { method: GET, path: "/rail/crew-members/{id}", description: "Get one crew member including hos_available_minutes", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: [], output: CrewMember, side_effects: [] }
  - { method: POST, path: "/rail/crew-members/{id}/adjust-hos", description: "Timekeeping correction of HOS accumulators (OCC guarded). Increments CrewMember.version by 1 on success.", roles: [SystemAdmin, CrewCaller], code: 200, input: ["rolling_24h_minutes?", "month_minutes?", "minutes_of_rest_completed?", expected_crew_member_version], output: CrewMember, side_effects: ["increments CrewMember.version by 1"] }

  - { method: POST, path: "/rail/crew-calls", description: "Call a crew member for a movement or switch job", roles: [CrewCaller], code: 201, input: [crew_member_id, "movement_id?", "switch_job_id?", scheduled_start_at, scheduled_end_at], output: CrewCall, side_effects: [] }
  - { method: GET, path: "/rail/crew-calls", description: "List crew calls, filterable", roles: [CrewCaller, Conductor, Dispatcher, SystemAdmin], code: 200, input: ["crew_member_id?", "movement_id?", "switch_job_id?", "status?", "limit?", "offset?"], output: "CrewCall[]", side_effects: [] }
  - { method: GET, path: "/rail/crew-calls/{id}", description: "Get one crew call", roles: [CrewCaller, Conductor, Dispatcher, SystemAdmin], code: 200, input: [], output: CrewCall, side_effects: [] }
  - { method: POST, path: "/rail/crew-calls/{id}/respond", description: "Called crew member accepts or declines", roles: [Conductor], code: 200, input: [response], output: CrewCall, side_effects: ["increments CrewCall.version by 1"] }
  - { method: POST, path: "/rail/crew-calls/{id}/report-on-duty", description: "Called crew member reports for duty", roles: [Conductor], code: 200, input: [], output: CrewCall, side_effects: ["on_duty_at = clock", "CrewMember -> ON_DUTY", "increments CrewCall.version by 1"] }
  - { method: POST, path: "/rail/crew-calls/{id}/relieve", description: "Relieve an on-duty call; computes actual minutes and posts them to the member", roles: [CrewCaller], code: 200, input: [], output: CrewCall, side_effects: ["actual_on_duty_minutes computed", "CrewMember -> RESTING with accumulator update", "increments CrewCall.version by 1"] }

  - { method: POST, path: "/rail/switch-jobs", description: "Plan a switching job", roles: [Dispatcher], code: 201, input: ["car_order_id?", scheduled_date, "notes?"], output: SwitchJob, side_effects: [] }
  - { method: GET, path: "/rail/switch-jobs", description: "List switch jobs, filterable", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: ["car_order_id?", "crew_call_id?", "status?", "limit?", "offset?"], output: "SwitchJob[]", side_effects: [] }
  - { method: GET, path: "/rail/switch-jobs/{id}", description: "Get one switch job", roles: [SystemAdmin, Dispatcher, SettlementClerk, CrewCaller, TrackInspector, RegulatorOfficer, GrantManager, CustomerRep, Conductor], code: 200, input: [], output: SwitchJob, side_effects: [] }
  - { method: POST, path: "/rail/switch-jobs/{id}/assign", description: "Assign a crew call to the job", roles: [Dispatcher], code: 200, input: [crew_call_id], output: SwitchJob, side_effects: ["increments SwitchJob.version by 1"] }
