              as: ProgramManager
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-BKG", site_type: "BACKGROUND", latitude: 40.10, longitude: -105.30, population_served: 0, probe_height_m: 4.0, distance_to_roadway_m: 150.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_bkg_id: "$.data.id" }
