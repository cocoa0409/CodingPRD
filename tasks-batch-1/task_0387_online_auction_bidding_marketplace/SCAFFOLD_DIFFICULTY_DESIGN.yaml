              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Auc L", format: "AUCTION", start_price_cents: 10000, scheduled_end_at: "2026-06-10T00:05:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${a_id}", max_proxy_cents: 10000 }
