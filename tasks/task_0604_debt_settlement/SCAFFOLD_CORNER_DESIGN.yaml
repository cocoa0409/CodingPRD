# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Debt Settlement Program (EXPERT). Breadth probe across the claim-extraction-guide
# sections. Flat topology; every grounds[] resolves to SCAFFOLD.yaml §1.1–§1.7.
# `excluded_because:` stubs cite a §1.8 instance by name (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_defaults_and_zeroed_aggregates
        claim_type: Creation
        grounds:
          - entities.Program.fields.program_phase
          - entities.Program.fields.target_settlement_pct
          - entities.Program.fields.deposit_day_of_month
        distinguishing_aspect: "POST /programs with only required fields -> 201; program_phase=ENROLLING, account_standing=CURRENT, target_settlement_pct defaults 0.50, deposit_day_of_month defaults 1, all computed aggregates 0."
        test_recipe:
          setup: ["No clock change needed (default 2026-01-01T00:00:00Z). One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "New Client", email: "nc@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, phase: $.data.program_phase, target: $.data.target_settlement_pct, day: $.data.deposit_day_of_month }
          assert:
            - "Program.program_phase == ENROLLING"
            - "Program.account_standing == CURRENT"
            - "Program.target_settlement_pct == 0.50 (default)"
            - "Program.deposit_day_of_month == 1 (default)"
            - "Program.total_enrolled_balance == 0 and estimated_total_savings == 0 and realized_total_savings == 0"

      - name: create_program_missing_monthly_deposit_amount_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Program.fields.monthly_deposit_amount, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /programs omitting required monthly_deposit_amount -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { client_id: "${client_id}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST and HTTP 400"

      - name: create_offer_invalid_offer_pct_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.SettlementOffer.fields.offer_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "offer_pct must be in (0,1]; offer_pct=1.5 -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Client+Program ACTIVE with one ENROLLED debt 5000."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c2@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "X-1", original_balance: 5000 }
              as: ProgramAdmin
              captures: { debt_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 1.5, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST and HTTP 400"

      - name: get_program_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /programs/{id} with an unknown UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /programs/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND and HTTP 404"

      - name: debt_system_fields_ignore_client_input_for_fee_rate_and_status
        claim_type: System Fields
        grounds: [entities.Debt.fields.fee_rate_pct, entities.Debt.fields.status]
        distinguishing_aspect: "fee_rate_pct and status are server-set; client cannot override them via POST /debts body (unknown keys are not accepted)."
        test_recipe:
          setup: ["Client+Program; debt 5000 enrolled."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c3@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "SYS-1", original_balance: 5000 }
              as: ProgramAdmin
              captures: { rate: $.data.fee_rate_pct, status: $.data.status }
          assert:
            - "Debt.fee_rate_pct == 0.25 (server-computed from tier; total 5000 < 10000)"
            - "Debt.status == ENROLLED (server-set initial state)"

      - name: duplicate_account_number_within_program_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Debt.fields.account_number, "validations[priority=8]", "errors[ERR_DUPLICATE_ACCOUNT_NUMBER]"]
        distinguishing_aspect: "Two debts with the same account_number in one program -> ERR_DUPLICATE_ACCOUNT_NUMBER (409)."
        test_recipe:
          setup: ["Client+Program with one debt account_number DUP-1."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c4@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "DUP-1", original_balance: 5000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred2", account_number: "DUP-1", original_balance: 3000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DUPLICATE_ACCOUNT_NUMBER and HTTP 409"

  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_program_with_no_enrolled_debt_returns_no_enrolled_debts
        claim_type: Precondition Enforcement
        grounds: [state_machines.Program.ENROLLING_to_ACTIVE, "validations[priority=7]", "errors[ERR_NO_ENROLLED_DEBTS]"]
        distinguishing_aspect: "Activating an ENROLLING program with zero debts -> ERR_NO_ENROLLED_DEBTS (409)."
        test_recipe:
          setup: ["Client+Program ENROLLING, no debts."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c5@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NO_ENROLLED_DEBTS and HTTP 409"

      - name: activate_already_active_program_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Program.ENROLLING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a program already in ACTIVE -> ERR_INVALID_STATE (409); no transition from ACTIVE via activate."
        test_recipe:
          setup: ["Client+Program ACTIVE (one debt enrolled, activated)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c6@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "AA-1", original_balance: 5000 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE and HTTP 409"

      - name: reject_already_rejected_offer_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.SettlementOffer.PENDING_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Rejecting an offer already in REJECTED -> ERR_INVALID_STATE (409); terminal state lockdown for offers."
        test_recipe:
          setup: ["Client+Program ACTIVE; one PENDING offer rejected once already."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c7@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "RR-1", original_balance: 5000 }
              as: ProgramAdmin
              captures: { debt_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 0.40, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/reject"
              payload: {}
              as: NegotiationAgent
          trigger:
            - call: "POST /offers/${offer_id}/reject"
              payload: {}
              as: NegotiationAgent
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE and HTTP 409"

      - name: complete_program_with_outstanding_debt_returns_completion_not_eligible
        claim_type: Precondition Enforcement
        grounds: [state_machines.Program.ACTIVE_to_COMPLETED, "validations[priority=17]", "errors[ERR_COMPLETION_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Completing a program while a Debt is still ENROLLED/IN_NEGOTIATION -> ERR_COMPLETION_NOT_ELIGIBLE (409)."
        test_recipe:
          setup: ["Client+Program ACTIVE with one ENROLLED (non-terminal) debt."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c8@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "CE-1", original_balance: 5000 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/complete"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_COMPLETION_NOT_ELIGIBLE and HTTP 409"

      - name: drop_from_enrolling_terminates_and_refunds
        claim_type: Side Effect Execution
        grounds: [state_machines.Program.ENROLLING_to_TERMINATED, entities.Client.fields.refunded_to_client_cents]
        distinguishing_aspect: "Dropping an ENROLLING program with a CLEARED deposit refunds the residual balance to Client.refunded_to_client_cents and zeroes the account."
        test_recipe:
          setup: ["Client+Program ENROLLING with one debt and one CLEARED deposit of 600 (balance 600)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "C", email: "c9@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "DR-1", original_balance: 5000 }
              as: ProgramAdmin
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-05-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /programs/${prog_id}/drop"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /clients/${client_id}"
              as: ProgramAdmin
              captures: { refunded: $.data.refunded_to_client_cents }
            - call: "GET /accounts"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
              captures: { bal: "$.data[0].balance" }
          assert:
            - "Program.program_phase == TERMINATED"
            - "Client.refunded_to_client_cents == 60000 (600.00 dollars * 100)"
            - "DedicatedAccount.balance == 0.00"

      - name: dismiss_lawsuit_reverts_debt_out_of_lawsuit
        claim_type: Side Effect Execution
        grounds: [state_machines.Lawsuit.REFERRED_to_RESOLVED_DISMISSED, state_machines.Debt.field.status]
        distinguishing_aspect: "Dismissing a REFERRED lawsuit moves it to RESOLVED_DISMISSED and reverts the linked debt LAWSUIT -> ENROLLED (no prior offer)."
        test_recipe:
          setup: ["Client+Program ACTIVE; debt 5000 referred to LAWSUIT (no offers yet)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c10@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "LD-1", original_balance: 5000 }
              as: ProgramAdmin
              captures: { debt_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /lawsuits"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", court_reference: "CR-1", filed_at: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { lawsuit_id: $.data.id }
          trigger:
            - call: "POST /lawsuits/${lawsuit_id}/dismiss"
              payload: {}
              as: ProgramAdmin
              captures: { lstatus: $.data.status }
            - call: "GET /debts/${debt_id}"
              as: ProgramAdmin
              captures: { dstatus: $.data.status }
          assert:
            - "Lawsuit.status == RESOLVED_DISMISSED"
            - "Debt.status == ENROLLED (reverted out of LAWSUIT)"

      - name: error_settlement_complete_cascade_already_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.Settlement.FUNDED_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / settlement_complete_cascade_debt_taxevent_lawsuit
          rationale: "The COMPLETED-cascade side effects (Debt SETTLED, TaxEvent, Lawsuit resolution, fee PAID) are asserted by the named §1.8 instance."

      - name: error_offer_accept_rejects_siblings_already_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.SettlementOffer.PENDING_to_ACCEPTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / offer_branching_fork_accept_rejects_siblings
          rationale: "Sibling-offer auto-rejection on accept is asserted by the named §1.8 instance."

  # =========================================================================
  - section: calculations
    instances:
      - name: standard_offer_quote_no_surcharge_correct
        claim_type: Correct Result
        grounds: [calculations.settlement_offer_quote, entities.SettlementOffer.fields.settlement_amount]
        distinguishing_aspect: "Standard (non-litigated) offer on a 0.25-tier debt 5000 at 0.40 -> settlement_amount 2000.00, projected_fee 500.00 (no surcharge)."
        test_recipe:
          setup: ["Client+Program ACTIVE; ENROLLED debt 5000 (tier 0.25)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "C", email: "c11@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "SQ-1", original_balance: 5000 }
              as: ProgramAdmin
              captures: { debt_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 0.40, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { sa: $.data.settlement_amount, pf: $.data.projected_fee }
          assert:
            - "SettlementOffer.settlement_amount == 2000.00"
            - "SettlementOffer.projected_fee == 500.00 (2000 * 0.25, no litigation surcharge)"

      - name: fee_tier_top_band_at_30000
        claim_type: Constants Applied
        grounds: [calculations.fee_tier_snapshot, entities.Debt.fields.fee_rate_pct]
        distinguishing_aspect: "A debt enrollment driving total_enrolled_balance to 30000 selects the 0.18 top band (>= TIER_2_CEIL)."
        test_recipe:
          setup: ["Client+Program; one debt 30000 enrolled."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C", email: "c12@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "TB-1", original_balance: 30000 }
              as: ProgramAdmin
              captures: { rate: $.data.fee_rate_pct }
          assert:
            - "Debt.fee_rate_pct == 0.18 (total 30000 >= 30000)"

      - name: tax_1099c_non_reportable_below_floor
        claim_type: Correct Result
        grounds: [calculations.cancellation_of_debt_1099c, entities.TaxEvent.fields.reportable]
        distinguishing_aspect: "Forgiven 590 (< 600) issues a TaxEvent with reportable=false; the 1099-C row still exists but is non-reportable."
        test_recipe:
          setup: ["Client+Program ACTIVE; debt 1000 (tier 0.25); balance funded; offer 0.41 -> settlement 410, forgiven 590; accepted, funded, completed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "C", email: "c13@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600, reserve_floor: 0 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred", account_number: "NR-1", original_balance: 1000 }
              as: ProgramAdmin
              captures: { debt_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v1: $.data.version }
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-04-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-05-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_id}", offer_pct: 0.41, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_program_version: "${v1}" }
              as: NegotiationAgent
            - call: "POST /settlements"
              payload: { program_id: "${prog_id}", offer_id: "${offer_id}" }
              as: NegotiationAgent
              captures: { settle_id: $.data.id }
          trigger:
            - call: "POST /settlements/${settle_id}/complete"
              payload: {}
              as: NegotiationAgent
            - call: "GET /tax-events"
              payload: { source_settlement_id: "${settle_id}" }
              as: ProgramAdmin
              captures: { forgiven: "$.data[0].forgiven_amount", reportable: "$.data[0].reportable" }
          assert:
            - "TaxEvent forgiven_amount == 590.00 (1000 - 410)"
            - "TaxEvent reportable == false (590 < 600 floor)"

      - name: portfolio_estimated_vs_realized_already_covered
        claim_type: Variant Divergence
        grounds: [calculations.portfolio_savings]
        excluded_because:
          difficulty_instance: dual_variant_calc / portfolio_estimated_vs_realized_savings_diverge
          rationale: "Estimated-vs-realized divergence is the subject of the named §1.8 instance."

  # =========================================================================
  - section: validations
    instances:
      - name: create_offer_past_due_date_returns_offer_expired
        claim_type: Violation -> Error
        grounds: ["validations[priority=9]", "errors[ERR_OFFER_EXPIRED]"]
        distinguishing_aspect: "Creating an offer whose due_date is at or before current_utc -> ERR_OFFER_EXPIRED (409)."
        test_recipe:
          setup: ["Clock 2026-06-01T00:00:00Z. Client+Program ACTIVE; ENROLLED debt 5000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
