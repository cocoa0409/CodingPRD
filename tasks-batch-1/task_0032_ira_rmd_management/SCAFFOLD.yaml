scenario: |
  IRA Management & RMD Calculation: Traditional/Roth, annual contribution cap
  (including catch-up), Backdoor Roth conversion, tax form 1099-R, age-based
  RMD, SECURE Act 10-year rule.

domain_name: ira-rmd-management
api_prefix: /ira

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AccountOwner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the IRA owner
      - name: date_of_birth
        type: datetime
        source: input
        description: ISO 8601 date; drives age-based threshold gates (50 catch-up, 73 RMD)
      - name: tax_id_last4
        type: string
        source: input
        description: last 4 digits of SSN/ITIN; used on 1099-R rendering
        constraints: "exactly 4 numeric characters"
      - name: filing_status
        type: enum
        source: input
        description: federal filing status; enters contribution-limit phase-out math
        constraints: "one of {SINGLE, MARRIED_JOINT, MARRIED_SEPARATE, HEAD_OF_HOUSEHOLD}"
      - name: modified_agi_cents
        type: integer
        source: input
        description: modified adjusted gross income in cents for the current tax year; used in Roth eligibility phase-out
        default: 0
      - name: deceased_at
        type: datetime
        source: input
        description: timestamp of owner death; null while alive; flips into inherited timeline
        default: null
      - name: rmd_posture
        type: enum
        source: computed
        description: aggregate RMD compliance state across owned Traditional accounts; one of {NOT_REQUIRED, REQUIRED_PENDING, REQUIRED_MET, REQUIRED_DELINQUENT}; recomputed on age threshold crossings, distribution events, and ops-run checkpoints
        constraints: "one of {NOT_REQUIRED, REQUIRED_PENDING, REQUIRED_MET, REQUIRED_DELINQUENT}"
        default: NOT_REQUIRED

  - name: IRAAccount
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> AccountOwner.id; the natural owner of this account while alive"
      - name: account_type
        type: enum
        source: input
        description: tax classification of the account
        constraints: "one of {TRADITIONAL, ROTH}"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see §1.2 IRAAccount machine
        constraints: "one of {ACTIVE, FROZEN, CONVERSION_IN_PROGRESS, INHERITED, CLOSED}"
        default: ACTIVE
      - name: cash_balance_cents
        type: integer
        source: computed
        description: sum of all settled contributions and conversions in, minus all settled distributions and conversions out
        default: 0
      - name: pretax_basis_cents
        type: integer
        source: computed
        description: portion of Traditional balance attributable to deductible (pretax) contributions; drives Backdoor Roth pro-rata math
        default: 0
      - name: aftertax_basis_cents
        type: integer
        source: computed
        description: portion of Traditional balance attributable to non-deductible (after-tax) contributions; recovered tax-free on distribution / conversion
        default: 0
      - name: ytd_contribution_cents
        type: integer
        source: computed
        description: running sum of CONFIRMED contributions for the current tax_year_marker; reset by ops-run year-rollover
        default: 0
      - name: tax_year_marker
        type: integer
        source: system
        description: four-digit tax year currently accruing toward ytd_contribution_cents
        default: 2026
      - name: opened_at
        type: datetime
        source: system
        description: server-stamped time the account moved into ACTIVE
      - name: closed_at
        type: datetime
        source: system
        description: server-stamped time the account moved into CLOSED; null until then
        default: null

  - name: BeneficiaryDesignation
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> IRAAccount.id; the inherited account once owner deceased_at is set"
      - name: beneficiary_full_name
        type: string
        source: input
        description: legal name of the designated beneficiary
      - name: relationship
        type: enum
        source: input
        description: relationship to the owner; only SPOUSE escapes the 10-year rule
        constraints: "one of {SPOUSE, MINOR_CHILD, DISABLED, CHRONIC_ILL, ELIGIBLE_TRUST, NON_ELIGIBLE_INDIVIDUAL}"
      - name: percentage_bps
        type: integer
        source: input
        description: share of the account, in basis points (sum across active beneficiaries must equal 10000)
        constraints: "0 < percentage_bps <= 10000"
      - name: status
        type: enum
        source: system
        description: lifecycle of this designation
        constraints: "one of {PENDING, ACTIVE, REVOKED, INHERITED}"
        default: PENDING
      - name: secure_deadline_at
        type: datetime
        source: computed
        description: ISO 8601 timestamp by which the inherited balance MUST be fully distributed under the SECURE Act 10-year rule (deceased_at + 10 years for NON_ELIGIBLE_INDIVIDUAL); null for relationships exempt from the rule
        default: null

  - name: Contribution
    parent: IRAAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> IRAAccount.id; the receiving account"
      - name: tax_year
        type: integer
        source: input
        description: four-digit tax year this contribution counts against; must equal account.tax_year_marker at confirmation time
      - name: amount_cents
        type: integer
        source: input
        description: dollars in cents; positive integer
        constraints: "amount_cents > 0"
      - name: contribution_kind
        type: enum
        source: input
        description: tax character; PRETAX is deductible (Traditional only); AFTERTAX is non-deductible (Traditional only, fuels Backdoor Roth basis); ROTH is direct Roth contribution
        constraints: "one of {PRETAX, AFTERTAX, ROTH}"
      - name: status
        type: enum
        source: system
        description: lifecycle of the contribution
        constraints: "one of {PENDING, CONFIRMED, REJECTED, REVERSED}"
        default: PENDING
      - name: confirmed_at
        type: datetime
        source: system
        description: server-stamped time of CONFIRMED transition; null otherwise
        default: null

  - name: Conversion
    parent: null
    common_fields: true
    fields:
      - name: source_account_id
        type: string
        source: input
        description: "FK -> IRAAccount.id; must be TRADITIONAL and ACTIVE at initiation"
      - name: target_account_id
        type: string
        source: input
        description: "FK -> IRAAccount.id; must be ROTH and owned by the same AccountOwner"
      - name: gross_amount_cents
        type: integer
        source: input
        description: total dollars (in cents) moving from source to target before pro-rata split
        constraints: "gross_amount_cents > 0"
      - name: taxable_amount_cents
        type: integer
        source: computed
        description: portion of gross_amount_cents counted as taxable income on the 1099-R; computed by §1.3 backdoor_roth_pro_rata at COMPLETED transition
        default: 0
      - name: nontaxable_amount_cents
        type: integer
        source: computed
        description: portion recovered tax-free from after-tax basis; gross_amount_cents - taxable_amount_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle of the conversion
        constraints: "one of {INITIATED, COMPLETED, REVERSED}"
        default: INITIATED
      - name: completed_at
        type: datetime
        source: system
        description: server-stamped time of COMPLETED transition
        default: null

  - name: Distribution
    parent: IRAAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> IRAAccount.id; the source account"
      - name: amount_cents
        type: integer
        source: input
        description: dollars in cents leaving the account; positive integer
        constraints: "amount_cents > 0"
      - name: distribution_reason
        type: enum
        source: input
        description: tax classification used on §1.3 form_1099_r assembly
        constraints: "one of {NORMAL, EARLY, RMD, INHERITED, ROLLOVER, RETURN_OF_CONTRIBUTION}"
      - name: tax_year
        type: integer
        source: input
        description: four-digit tax year this distribution counts against; pinned at confirmation time
      - name: federal_withholding_cents
        type: integer
        source: input
        description: federal income tax withheld at distribution; reported as 1099-R box 4
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle of the distribution
        constraints: "one of {PENDING, CONFIRMED, REVERSED}"
        default: PENDING
      - name: confirmed_at
        type: datetime
        source: system
        description: server-stamped time of CONFIRMED transition
        default: null

  - name: RMDSchedule
    parent: AccountOwner
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> AccountOwner.id; the owner whose Traditional accounts are aggregated for this schedule"
      - name: tax_year
        type: integer
        source: input
        description: four-digit tax year the RMD applies to
      - name: required_amount_cents
        type: integer
        source: computed
        description: total RMD across all Traditional accounts owned by owner_id for tax_year, per §1.3 rmd_amount
        default: 0
      - name: satisfied_amount_cents
        type: integer
        source: computed
        description: cumulative confirmed RMD-coded distributions counted toward this schedule
        default: 0
      - name: deadline_at
        type: datetime
        source: computed
        description: ISO 8601 timestamp of the RMD deadline (Dec 31 of tax_year, or April 1 of tax_year+1 if first RMD year)
      - name: status
        type: enum
        source: system
        description: lifecycle of the schedule
        constraints: "one of {OPEN, SATISFIED, DELINQUENT}"
        default: OPEN
      - name: is_first_rmd_year
        type: boolean
        source: computed
        description: true if tax_year equals the year owner turns 73; controls April-1 deadline extension
        default: false

  - name: Form1099R
    parent: null
    common_fields: false
    fields:
      - name: distribution_id
        type: string
        source: input
        description: "FK -> Distribution.id; the underlying distribution this form documents; null when the form documents a Conversion instead"
        default: null
      - name: conversion_id
        type: string
        source: input
        description: "FK -> Conversion.id; the underlying conversion this form documents; null when the form documents a Distribution instead"
        default: null
      - name: tax_year
        type: integer
        source: computed
        description: four-digit tax year copied from the underlying transaction
      - name: gross_distribution_cents
        type: integer
        source: computed
        description: 1099-R box 1; gross dollars
      - name: taxable_amount_cents
        type: integer
        source: computed
        description: 1099-R box 2a; taxable portion per §1.3 form_1099_r
      - name: federal_withholding_cents
        type: integer
        source: computed
        description: 1099-R box 4
      - name: distribution_code
        type: enum
        source: computed
        description: 1099-R box 7; one of {1, 2, 4, 7, G, B, J, T} mapped from distribution_reason and owner age
        constraints: "one of {1, 2, 4, 7, G, B, J, T}"
      - name: ira_sep_simple_flag
        type: boolean
        source: computed
        description: 1099-R box 7 checkbox; true for any IRA-sourced transaction

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> AccountOwner.id; the owner whose timeline this event belongs to"
      - name: account_id
        type: string
        source: input
        description: "FK -> IRAAccount.id; the touched account; null for owner-scoped events"
        default: null
      - name: event_kind
        type: enum
        source: input
        description: discriminator
        constraints: "one of {CONTRIBUTION_CONFIRMED, DISTRIBUTION_CONFIRMED, CONVERSION_COMPLETED, RMD_DEADLINE_BREACHED, BENEFICIARY_INHERITED, OWNER_DECEASED, YEAR_ROLLED_OVER}"
      - name: tax_year
        type: integer
        source: input
        description: four-digit tax year context for the event
      - name: amount_cents
        type: integer
        source: input
        description: positive cents amount; meaning depends on event_kind
        default: 0
      - name: occurred_at
        type: datetime
        source: system
        description: server-stamped wall clock of the event

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: input
        description: explicit server clock used for age-threshold and SECURE-deadline math; advanced via /_clock/set_current_utc
      - name: current_tax_year
        type: integer
        source: system
        description: four-digit tax year derived from current_utc; recomputed on every clock set
        default: 2026

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IRAAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /accounts/{id}/freeze"
        actor: PlanAdministrator
        preconditions:
          - "no Contribution or Distribution against this account is in PENDING"
        side_effects:
          - "account.updated_at refreshed"
          - "account.version incremented by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /accounts/{id}/unfreeze"
        actor: PlanAdministrator
        preconditions:
          - "owner.deceased_at is null"
        side_effects:
          - "account.updated_at refreshed; account.version incremented by 1"
      - from: ACTIVE
        to: CONVERSION_IN_PROGRESS
        trigger: "POST /conversions"
        actor: AccountOwner
        preconditions:
          - "account.account_type == TRADITIONAL"
          - "account.cash_balance_cents >= conversion.gross_amount_cents"
        side_effects:
          - "Conversion row created in INITIATED"
          - "account.updated_at refreshed; account.version incremented by 1"
      - from: CONVERSION_IN_PROGRESS
        to: ACTIVE
        trigger: "POST /conversions/{id}/complete"
        actor: AccountOwner
        preconditions:
          - "conversion.status == INITIATED"
          - "target ROTH account is ACTIVE"
        side_effects:
          - "§1.3 backdoor_roth_pro_rata splits gross into taxable / nontaxable on the Conversion"
          - "source account.cash_balance_cents decremented by gross_amount_cents"
          - "source account.pretax_basis_cents decremented proportional to taxable split"
          - "source account.aftertax_basis_cents decremented proportional to nontaxable split"
          - "target ROTH account.cash_balance_cents incremented by gross_amount_cents"
          - "Form1099R row generated with distribution_code='G' (for completed conversion) referencing the Conversion"
          - "Conversion.status -> COMPLETED; completed_at stamped"
          - "AuditEvent CONVERSION_COMPLETED appended for owner"
          - "both accounts' updated_at refreshed and version incremented by 1"
      - from: CONVERSION_IN_PROGRESS
        to: ACTIVE
        trigger: "POST /conversions/{id}/reverse"
        actor: AccountOwner
        preconditions:
          - "conversion.status == INITIATED"
        side_effects:
          - "Conversion.status -> REVERSED"
          - "source account state remains ACTIVE with balances unchanged"
          - "no Form1099R generated"
          - "account.updated_at refreshed; account.version incremented by 1"
      - from: ACTIVE
        to: INHERITED
        trigger: "system event when AccountOwner.deceased_at is set via POST /owners/{id}/declare-deceased"
        actor: system
        preconditions:
          - "owner.deceased_at is non-null"
          - "at least one BeneficiaryDesignation on this account in ACTIVE"
        side_effects:
          - "all ACTIVE BeneficiaryDesignations on this account transition to INHERITED"
          - "for each INHERITED designation whose relationship is NON_ELIGIBLE_INDIVIDUAL, BeneficiaryDesignation.secure_deadline_at is set to deceased_at + 10 years"
          - "open RMDSchedule rows for this owner are recomputed under SECURE timeline; see §1.3 rmd_amount"
          - "account.updated_at refreshed; account.version incremented by 1"
      - from: FROZEN
        to: INHERITED
        trigger: "system event when AccountOwner.deceased_at is set"
        actor: system
        preconditions:
          - "owner.deceased_at is non-null"
        side_effects:
          - "same side effects as ACTIVE -> INHERITED"
      - from: INHERITED
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: PlanAdministrator
        preconditions:
          - "account.cash_balance_cents == 0"
          - "all child Distribution and Conversion rows are CONFIRMED, REVERSED, or COMPLETED (none PENDING/INITIATED)"
        side_effects:
          - "account.status -> CLOSED; closed_at stamped"
          - "account.updated_at refreshed; account.version incremented by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: AccountOwner
        preconditions:
          - "account.cash_balance_cents == 0"
          - "owner.deceased_at is null"
          - "no open RMDSchedule whose status == OPEN for the owner against this Traditional account"
        side_effects:
          - "account.status -> CLOSED; closed_at stamped"
          - "account.updated_at refreshed; account.version incremented by 1"

  - entity: Contribution
    initial_state: PENDING
    terminal_states: [CONFIRMED, REJECTED, REVERSED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /contributions/{id}/confirm"
        actor: AccountOwner
        preconditions:
          - "account.status == ACTIVE"
          - "contribution.tax_year == account.tax_year_marker"
          - "§1.4 contribution_cap rule passes: account.ytd_contribution_cents + contribution.amount_cents <= §1.3 contribution_limit(owner, account_type, tax_year)"
          - "if contribution_kind == ROTH: §1.3 roth_eligibility(owner.modified_agi_cents, filing_status) > 0"
        side_effects:
          - "contribution.status -> CONFIRMED; confirmed_at stamped"
          - "account.cash_balance_cents += amount_cents"
          - "if contribution_kind == PRETAX: account.pretax_basis_cents += amount_cents"
          - "if contribution_kind == AFTERTAX: account.aftertax_basis_cents += amount_cents"
          - "account.ytd_contribution_cents += amount_cents"
          - "AuditEvent CONTRIBUTION_CONFIRMED appended"
          - "account.updated_at refreshed; account.version incremented by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /contributions/{id}/reject"
        actor: PlanAdministrator
        preconditions:
          - "contribution.status == PENDING"
        side_effects:
          - "contribution.status -> REJECTED"
          - "no balance changes"
      - from: CONFIRMED
        to: REVERSED
        trigger: "POST /contributions/{id}/reverse"
        actor: PlanAdministrator
        preconditions:
          - "contribution.confirmed_at is in the current tax year (same tax_year_marker)"
          - "account.cash_balance_cents >= contribution.amount_cents"
        side_effects:
          - "contribution.status -> REVERSED"
          - "account.cash_balance_cents -= amount_cents"
          - "if contribution_kind == PRETAX: account.pretax_basis_cents -= amount_cents"
          - "if contribution_kind == AFTERTAX: account.aftertax_basis_cents -= amount_cents"
          - "account.ytd_contribution_cents -= amount_cents"
          - "account.updated_at refreshed; account.version incremented by 1"

  - entity: Distribution
    initial_state: PENDING
    terminal_states: [CONFIRMED, REVERSED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /distributions/{id}/confirm"
        actor: AccountOwner
        preconditions:
          - "account.status IN {ACTIVE, INHERITED}"
          - "account.cash_balance_cents >= distribution.amount_cents"
          - "distribution.federal_withholding_cents <= distribution.amount_cents"
          - "if distribution_reason == RMD: an OPEN RMDSchedule exists for (owner_id, tax_year)"
        side_effects:
          - "distribution.status -> CONFIRMED; confirmed_at stamped"
          - "account.cash_balance_cents -= amount_cents"
          - "if account.account_type == TRADITIONAL: pretax_basis_cents and aftertax_basis_cents recomputed via §1.3 distribution_basis_split"
          - "if distribution_reason == RMD: RMDSchedule.satisfied_amount_cents += amount_cents; if it now meets required_amount_cents, RMDSchedule.status -> SATISFIED"
          - "Form1099R generated with distribution_code per §1.3 form_1099_r"
          - "AuditEvent DISTRIBUTION_CONFIRMED appended"
          - "AccountOwner.rmd_posture recomputed across all owned Traditional accounts"
          - "account.updated_at refreshed; account.version incremented by 1"
      - from: CONFIRMED
        to: REVERSED
        trigger: "POST /distributions/{id}/reverse"
        actor: PlanAdministrator
        preconditions:
          - "distribution.confirmed_at is in the current tax year"
          - "Form1099R row referencing this distribution exists and tax_year == current_tax_year"
        side_effects:
          - "distribution.status -> REVERSED"
          - "account.cash_balance_cents += amount_cents"
          - "Form1099R for this distribution is voided (gross_distribution_cents reset to 0)"
          - "if distribution_reason == RMD: RMDSchedule.satisfied_amount_cents -= amount_cents; if shortfall reappears, RMDSchedule.status reverts to OPEN"
          - "AccountOwner.rmd_posture recomputed"
          - "account.updated_at refreshed; account.version incremented by 1"

  - entity: RMDSchedule
    initial_state: OPEN
    terminal_states: [SATISFIED, DELINQUENT]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "system event: Distribution CONFIRMED for distribution_reason==RMD and (RMDSchedule.satisfied_amount_cents after side effect) >= RMDSchedule.required_amount_cents"
        actor: system
        preconditions:
          - "schedule.status == OPEN"
          - "post-side-effect schedule.satisfied_amount_cents >= schedule.required_amount_cents"
        side_effects:
          - "schedule.status -> SATISFIED"
          - "AccountOwner.rmd_posture recomputed"
      - from: OPEN
        to: DELINQUENT
        trigger: "POST /_ops/advance-year-rollover"
        actor: system
        preconditions:
          - "SystemClock.current_utc > schedule.deadline_at"
          - "schedule.satisfied_amount_cents < schedule.required_amount_cents"
        side_effects:
          - "schedule.status -> DELINQUENT"
          - "AccountOwner.rmd_posture -> REQUIRED_DELINQUENT"
          - "AuditEvent RMD_DEADLINE_BREACHED appended with amount_cents = required_amount_cents - satisfied_amount_cents"
      - from: DELINQUENT
        to: SATISFIED
        trigger: "POST /distributions/{id}/confirm with distribution_reason == RMD (late cure)"
        actor: AccountOwner
        preconditions:
          - "post-side-effect schedule.satisfied_amount_cents >= schedule.required_amount_cents"
        side_effects:
          - "schedule.status -> SATISFIED"
          - "AccountOwner.rmd_posture recomputed"

  - entity: Conversion
    initial_state: INITIATED
    terminal_states: [COMPLETED, REVERSED]
    transitions:
      - from: INITIATED
        to: COMPLETED
        trigger: "POST /conversions/{id}/complete"
        actor: AccountOwner
        preconditions:
          - "conversion.source_account.status == CONVERSION_IN_PROGRESS"
          - "conversion.target_account.status == ACTIVE"
          - "conversion.target_account.account_type == ROTH"
        side_effects:
          - "see IRAAccount CONVERSION_IN_PROGRESS -> ACTIVE side effects (mirror copy here is the Conversion-perspective summary)"
          - "conversion.taxable_amount_cents and nontaxable_amount_cents set via §1.3 backdoor_roth_pro_rata"
          - "conversion.status -> COMPLETED; completed_at stamped"
      - from: INITIATED
        to: REVERSED
        trigger: "POST /conversions/{id}/reverse"
        actor: AccountOwner
        preconditions:
          - "conversion.status == INITIATED"
          - "no Form1099R yet generated for this conversion"
        side_effects:
          - "conversion.status -> REVERSED"
          - "source account state reverts to ACTIVE; balances untouched"

# §1.2.1 Concurrency Rules — true OCC races only, parent.version semantics
concurrency_rules:
  - rule_id: contribution-confirm-stale-account
    parent_entity: IRAAccount
    write_endpoint: "POST /contributions/{id}/confirm"
    occ_field: expected_account_version
    description: |
      Confirming a PENDING Contribution against an IRAAccount whose version has
      advanced since the client last observed it is rejected. This covers the
      case where another writer just confirmed a different contribution (which
      bumped ytd_contribution_cents and account.version) and the current
      writer's view of the cap headroom is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: distribution-confirm-stale-account
    parent_entity: IRAAccount
    write_endpoint: "POST /distributions/{id}/confirm"
    occ_field: expected_account_version
    description: |
      Confirming a PENDING Distribution against an IRAAccount whose version
      has advanced since the client last observed it is rejected. Covers the
      case where another writer just confirmed an offsetting distribution
      (which bumped cash_balance_cents downward and bumped account.version)
      and the current writer's view of the balance is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contribution_limit
    trigger: "validation of POST /contributions/{id}/confirm (Contribution PENDING -> CONFIRMED preconditions)"
    algorithm: threshold
    formula: |
      def contribution_limit(owner, account_type, tax_year, clock):
          age_at_year_end = year_diff(date(tax_year, 12, 31), owner.date_of_birth)
          base = BASE_LIMIT_CENTS[tax_year]
          catch_up = CATCH_UP_CENTS[tax_year] if age_at_year_end >= 50 else 0
          if account_type == "TRADITIONAL":
              return base + catch_up
          # ROTH path applies modified_agi phase-out from roth_eligibility()
          return roth_eligibility(owner.modified_agi_cents, owner.filing_status, tax_year, base + catch_up)
    input_set: "all CONFIRMED Contribution rows whose tax_year == target_tax_year and account.owner_id == owner.id, summed across all IRAAccounts of the same account_type for that owner"
    constants:
      BASE_LIMIT_CENTS: { 2024: 700000, 2025: 700000, 2026: 750000 }
      CATCH_UP_CENTS: { 2024: 100000, 2025: 100000, 2026: 110000 }
    precision: "integer cents, no rounding (all inputs are already cents)"

  - name: roth_eligibility
    trigger: "validation of POST /contributions/{id}/confirm when contribution_kind == ROTH"
    algorithm: tiered_pricing
    formula: |
      def roth_eligibility(modified_agi_cents, filing_status, tax_year, headroom_cents):
          floor, ceiling = ROTH_PHASEOUT[tax_year][filing_status]
          if modified_agi_cents <= floor:
              return headroom_cents
          if modified_agi_cents >= ceiling:
              return 0
          # Linear phase-out, ROUND PER-FORMULA EVALUATION (sum then round, not
          # round then multiply). Floor cents result to nearest 1000 cents ($10).
          phaseout_width = ceiling - floor
          reduction = headroom_cents * (modified_agi_cents - floor) // phaseout_width
          allowed = headroom_cents - reduction
          return (allowed // 1000) * 1000
    input_set: "single AccountOwner row by id"
    constants:
      ROTH_PHASEOUT:
        2024:
          SINGLE: [14600000, 16100000]
          MARRIED_JOINT: [23000000, 24000000]
          MARRIED_SEPARATE: [0, 1000000]
          HEAD_OF_HOUSEHOLD: [14600000, 16100000]
        2025:
          SINGLE: [15000000, 16500000]
          MARRIED_JOINT: [23600000, 24600000]
          MARRIED_SEPARATE: [0, 1000000]
          HEAD_OF_HOUSEHOLD: [15000000, 16500000]
        2026:
          SINGLE: [15400000, 16900000]
          MARRIED_JOINT: [24200000, 25200000]
          MARRIED_SEPARATE: [0, 1000000]
          HEAD_OF_HOUSEHOLD: [15400000, 16900000]
    precision: "integer cents; floor to nearest 1000 cents at the very end (sum-then-floor)"

  - name: backdoor_roth_pro_rata
    trigger: "Conversion INITIATED -> COMPLETED side effect"
    algorithm: weighted_scoring
    formula: |
      def backdoor_roth_pro_rata(conversion, source_account):
          gross = conversion.gross_amount_cents
          pre = source_account.pretax_basis_cents
          aft = source_account.aftertax_basis_cents
          total_basis = pre + aft
          if total_basis == 0:
              # entirely growth -> entirely taxable
              return (gross, 0)
          # Pro-rata: nontaxable portion = gross * aftertax_basis / total_basis
          # ROUND POLICY: integer floor division at the final ratio step
          # (no per-line rounding earlier in the chain).
          nontaxable = gross * aft // total_basis
          taxable = gross - nontaxable
          return (taxable, nontaxable)
    input_set: "the Conversion row plus its source IRAAccount; aggregates ALL Traditional accounts of the same owner is NOT used here — this calc operates on the single source account by design"
    constants: {}
    precision: "integer cents; final floor division on nontaxable; remainder lands on taxable side"
    variants:
      - name: single_account_pro_rata
        when: "owner has exactly one TRADITIONAL account"
        difference: "uses that account's basis directly"
      - name: aggregated_basis_pro_rata
        when: "owner has 2+ TRADITIONAL accounts AND request body sets aggregate_basis: true"
        difference: |
          Replaces (pre, aft) on the source account with the SUM of pre / aft across
          all Traditional accounts of the same owner, then runs the same formula.
          Produces a different taxable/nontaxable split when basis distribution
          across accounts is uneven (e.g., all aftertax concentrated in the source
          account → without aggregation, conversion looks mostly nontaxable; with
          aggregation, the larger pretax pool elsewhere dilutes the ratio).

  - name: rmd_amount
    trigger: "POST /rmd-schedules (creation) AND ops-run year-rollover recompute"
    algorithm: aggregation
    formula: |
      def rmd_amount(owner, tax_year, clock):
          age = year_diff(date(tax_year, 12, 31), owner.date_of_birth)
          if owner.deceased_at is not None:
              return inherited_rmd(owner, tax_year)
          if age < 73:
              return 0
          # Sum balances across all TRADITIONAL accounts of owner as of Dec 31
          # of (tax_year - 1). ORDER OF AGGREGATION:
          #   1. enumerate accounts sorted by IRAAccount.opened_at ASC,
          #      tie-break by created_at ASC. NEVER by id.
          #   2. sum cash_balance_cents at clock=(Dec 31 of tax_year - 1).
          # Then apply Uniform Lifetime divisor for `age`:
          total_balance = sum(acct.cash_balance_cents for acct in traditional_accts)
          divisor_x100 = UNIFORM_LIFETIME_DIVISOR[age]  # divisor stored *100 (e.g., 2660 = 26.60)
          # ROUND POLICY: sum-then-divide. Floor-divide total_balance_cents by
          # the true (decimal) divisor; integer-arithmetic form is:
          #   required_cents = (total_balance_cents * 100) // divisor_x100
          required_cents = (total_balance * 100) // divisor_x100
          return required_cents
    input_set: "TRADITIONAL accounts of owner with status IN {ACTIVE, FROZEN}; CLOSED accounts excluded; INHERITED accounts feed inherited_rmd path instead"
    constants:
      UNIFORM_LIFETIME_DIVISOR:
        73: 2660
        74: 2580
        75: 2490
        76: 2410
        77: 2320
        78: 2240
        79: 2150
        80: 2070
        81: 1980
        82: 1900
        83: 1820
        84: 1730
        85: 1650
      # NOTE: divisors are stored as basis-point form of two-decimal values.
      # e.g., 2660 = 26.60. Documented to make the unit-test-generator pin
      # this convention rather than guess between 26.6 and 26600.
    precision: "integer cents result; floor at the final divide step (sum-then-floor)"
    variants:
      - name: living_owner_uniform_lifetime
        when: "owner.deceased_at is null AND owner age >= 73"
        difference: "uses UNIFORM_LIFETIME_DIVISOR table indexed by age at Dec 31 of tax_year"
      - name: secure_10year_pace
        when: "owner.deceased_at is non-null AND beneficiary relationship is NON_ELIGIBLE_INDIVIDUAL"
        difference: |
          Replaces Uniform Lifetime math entirely. Computes total inherited balance
          across all INHERITED Traditional accounts, divides by years remaining
          until BeneficiaryDesignation.secure_deadline_at. Even allocation: each
          year's required_amount_cents = total_inherited_balance // years_remaining
          where years_remaining = ceil((secure_deadline_at - clock) / 365 days).
          On the FINAL year, required_amount_cents = entire remaining balance.

  - name: form_1099_r
    trigger: "Distribution PENDING -> CONFIRMED side effect AND Conversion INITIATED -> COMPLETED side effect"
    algorithm: projection
    formula: |
      def form_1099_r(transaction, account, owner, clock):
          if transaction.kind == "Distribution":
              gross = transaction.amount_cents
              withholding = transaction.federal_withholding_cents
              age = year_diff(clock, owner.date_of_birth)
              if transaction.distribution_reason == "ROLLOVER":
                  code = "G"
              elif transaction.distribution_reason == "INHERITED":
                  code = "4"
              elif transaction.distribution_reason == "RETURN_OF_CONTRIBUTION":
                  code = "8" if same_tax_year else "P"  # simplified -> use "8"
              elif age < 59.5 and transaction.distribution_reason == "EARLY":
                  code = "1"
              elif transaction.distribution_reason == "RMD":
                  code = "7"
              elif age >= 59.5:
                  code = "7"
              else:
                  code = "2"  # early with exception
              taxable = compute_taxable(account, gross)
              return Form1099R(gross, taxable, withholding, code, ira_sep_simple_flag=True)
          if transaction.kind == "Conversion":
              gross = transaction.gross_amount_cents
              taxable = transaction.taxable_amount_cents  # pre-computed by backdoor_roth_pro_rata
              return Form1099R(gross, taxable, 0, "G", ira_sep_simple_flag=True)

      def compute_taxable(account, gross):
          # Traditional distribution: gross * (pretax_basis / (pretax_basis + aftertax_basis))
          # ORDER: sum bases first, then multiply, then floor divide (sum-then-divide).
          if account.account_type == "ROTH":
              return 0
          total_basis = account.pretax_basis_cents + account.aftertax_basis_cents
          if total_basis == 0:
              return gross
          nontaxable = gross * account.aftertax_basis_cents // total_basis
          return gross - nontaxable
    input_set: "the single Distribution or Conversion row plus its source IRAAccount and AccountOwner"
    constants: {}
    precision: "integer cents; floor-divide on the final basis ratio step"

  - name: distribution_basis_split
    trigger: "Distribution CONFIRMED side effect on a TRADITIONAL account"
    algorithm: weighted_scoring
    formula: |
      def distribution_basis_split(account, amount_cents):
          # Decrements pretax_basis_cents and aftertax_basis_cents
          # proportionally to their share of cash_balance_cents BEFORE the
          # distribution. Same sum-then-divide order as form_1099_r.
          pre = account.pretax_basis_cents
          aft = account.aftertax_basis_cents
          total = pre + aft
          if total == 0:
              return (0, 0)
          aft_drop = amount_cents * aft // total
          pre_drop = amount_cents - aft_drop
          return (pre_drop, aft_drop)
    input_set: "single TRADITIONAL IRAAccount row plus the Distribution.amount_cents"
    constants: {}
    precision: "integer cents; floor-divide; pre_drop absorbs the remainder"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and non-empty"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role value is one of the declared §1.7 roles"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "X-User-ID required for entity_backed roles (AccountOwner) and must equal AccountOwner.id for owner-scoped operations"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /contributions, POST /contributions/{id}/confirm, POST /distributions, POST /distributions/{id}/confirm, POST /conversions, POST /conversions/{id}/complete, POST /accounts/{id}/close"

  - priority: 4
    category: existence
    check: "path-templated ids resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "target entity is in the from-state declared by the §1.2 transition for this trigger"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "OCC: payload's expected_<parent>_version equals the current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /contributions/{id}/confirm, POST /distributions/{id}/confirm"

  - priority: 7
    category: business_referential
    check: "Conversion: source_account.account_type == TRADITIONAL AND target_account.account_type == ROTH AND source_account.owner_id == target_account.owner_id"
    error_id: ERR_INVALID_CONVERSION_PAIR
    http_status: 422
    applies_to: "POST /conversions"

  - priority: 8
    category: business_safety
    check: "Contribution kind matches account type: ROTH kind only on ROTH account; PRETAX and AFTERTAX only on TRADITIONAL account"
    error_id: ERR_KIND_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /contributions"

  - priority: 9
    category: business_temporal
    check: "Contribution.tax_year matches account.tax_year_marker at confirmation; mismatched year (e.g., year already rolled) rejected"
    error_id: ERR_TAX_YEAR_CLOSED
    http_status: 422
    applies_to: "POST /contributions/{id}/confirm"

  - priority: 10
    category: business_constraint
    check: "BeneficiaryDesignation: sum of percentage_bps across ACTIVE designations for the same account == 10000 when transitioning a PENDING designation to ACTIVE"
    error_id: ERR_BENEFICIARY_SHARES_INVALID
    http_status: 422
    applies_to: "POST /beneficiary-designations/{id}/activate"

  - priority: 11
    category: business_fiscal
    check: "Contribution cap: account.ytd_contribution_cents + contribution.amount_cents <= contribution_limit(owner, account_type, tax_year)"
    error_id: ERR_CONTRIBUTION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /contributions/{id}/confirm"

  - priority: 12
    category: business_fiscal
    check: "Distribution amount_cents <= account.cash_balance_cents AND federal_withholding_cents <= amount_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /distributions/{id}/confirm"

  - priority: 13
    category: business_temporal
    check: "SECURE Act 10-year rule: for an INHERITED account with a NON_ELIGIBLE_INDIVIDUAL beneficiary, the account.cash_balance_cents MUST reach 0 on or before BeneficiaryDesignation.secure_deadline_at; a CONFIRM that leaves a balance after that deadline is rejected"
    error_id: ERR_SECURE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /distributions/{id}/confirm"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Account Owners -----
  - method: POST
    path: "/ira/owners"
    description: register a new account owner
    roles: [PlanAdministrator]
    code: 201
    input: [full_name, date_of_birth, tax_id_last4, filing_status, "modified_agi_cents?"]
    output: AccountOwner
    side_effects: ["owner.rmd_posture initialized to NOT_REQUIRED"]

  - method: GET
    path: "/ira/owners/{id}"
    description: fetch an account owner
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: []
    output: AccountOwner
    side_effects: []

  - method: GET
    path: "/ira/owners"
    description: list owners with filtering
    roles: [PlanAdministrator, IRSAuditor]
    code: 200
    input: ["filing_status?", "limit?", "offset?"]
    output: AccountOwner[]
    side_effects: []

  - method: PATCH
    path: "/ira/owners/{id}/agi"
    description: update modified AGI mid-year (e.g., from updated W-2/1099 reporting); used by Roth eligibility phase-out
    roles: [PlanAdministrator]
    code: 200
    input: [modified_agi_cents, expected_owner_version]
    output: AccountOwner
    side_effects: ["owner.version incremented by 1; AccountOwner.updated_at refreshed"]

  - method: POST
    path: "/ira/owners/{id}/declare-deceased"
    description: mark owner as deceased; triggers cascade into INHERITED on all owned accounts
    roles: [PlanAdministrator]
    code: 200
    input: [deceased_at, expected_owner_version]
    output: AccountOwner
    side_effects:
      - "owner.deceased_at set"
      - "all owner's IRAAccounts in {ACTIVE, FROZEN} transition to INHERITED (cascade)"
      - "all ACTIVE BeneficiaryDesignations on those accounts -> INHERITED; secure_deadline_at set for NON_ELIGIBLE_INDIVIDUAL"
      - "open RMDSchedule rows for owner recomputed under SECURE timeline"
      - "AuditEvent OWNER_DECEASED appended"
      - "owner.version incremented by 1"

  # ----- IRA Accounts -----
  - method: POST
    path: "/ira/accounts"
    description: open a new IRA account for an owner
    roles: [PlanAdministrator]
    code: 201
    input: [owner_id, account_type]
    output: IRAAccount
    side_effects: ["account.status set to ACTIVE; opened_at stamped; cash_balance_cents=0; tax_year_marker=SystemClock.current_tax_year"]

  - method: GET
    path: "/ira/accounts/{id}"
    description: fetch an account
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: []
    output: IRAAccount
    side_effects: []

  - method: GET
    path: "/ira/accounts"
    description: list accounts, filterable by owner
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: ["owner_id?", "account_type?", "status?", "limit?", "offset?"]
    output: IRAAccount[]
    side_effects: []

  - method: POST
    path: "/ira/accounts/{id}/freeze"
    description: administratively freeze an account
    roles: [PlanAdministrator]
    code: 200
    input: [expected_account_version]
    output: IRAAccount
    side_effects: ["account.status -> FROZEN; account.version incremented by 1"]

  - method: POST
    path: "/ira/accounts/{id}/unfreeze"
    description: lift the freeze
    roles: [PlanAdministrator]
    code: 200
    input: [expected_account_version]
    output: IRAAccount
    side_effects: ["account.status -> ACTIVE; account.version incremented by 1"]

  - method: POST
    path: "/ira/accounts/{id}/close"
    description: close a zero-balance account
    roles: [PlanAdministrator, AccountOwner]
    code: 200
    input: [expected_account_version]
    output: IRAAccount
    side_effects: ["account.status -> CLOSED; closed_at stamped; version incremented"]

  # ----- Contributions -----
  - method: POST
    path: "/ira/contributions"
    description: create a PENDING contribution
    roles: [AccountOwner]
    code: 201
    input: [account_id, tax_year, amount_cents, contribution_kind]
    output: Contribution
    side_effects: ["contribution.status = PENDING"]

  - method: GET
    path: "/ira/contributions/{id}"
    description: fetch a contribution
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: GET
    path: "/ira/contributions"
    description: list contributions, filterable by account
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: ["account_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: Contribution[]
    side_effects: []

  - method: POST
    path: "/ira/contributions/{id}/confirm"
    description: confirm a PENDING contribution; runs §1.3 contribution_limit cap check; runs §1.4 priority 9/11
    roles: [AccountOwner]
    code: 200
    input: [expected_account_version]
    output: Contribution
    side_effects:
      - "contribution.status -> CONFIRMED"
      - "account.cash_balance_cents, ytd_contribution_cents, pretax_basis_cents OR aftertax_basis_cents updated"
      - "AuditEvent CONTRIBUTION_CONFIRMED appended"
      - "account.version incremented by 1"

  - method: POST
    path: "/ira/contributions/{id}/reject"
    description: admin rejects a PENDING contribution
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Contribution
    side_effects: ["contribution.status -> REJECTED"]

  - method: POST
    path: "/ira/contributions/{id}/reverse"
    description: reverse a CONFIRMED contribution within the same tax year
    roles: [PlanAdministrator]
    code: 200
    input: [expected_account_version]
    output: Contribution
    side_effects:
      - "contribution.status -> REVERSED"
      - "account balances and ytd_contribution_cents decremented"
      - "account.version incremented by 1"

  # ----- Distributions -----
  - method: POST
    path: "/ira/distributions"
    description: create a PENDING distribution
    roles: [AccountOwner]
    code: 201
    input: [account_id, amount_cents, distribution_reason, tax_year, "federal_withholding_cents?"]
    output: Distribution
    side_effects: ["distribution.status = PENDING"]

  - method: GET
    path: "/ira/distributions/{id}"
    description: fetch a distribution
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  - method: GET
    path: "/ira/distributions"
    description: list distributions, filterable by account
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: ["account_id?", "tax_year?", "distribution_reason?", "status?", "limit?", "offset?"]
    output: Distribution[]
    side_effects: []

  - method: POST
    path: "/ira/distributions/{id}/confirm"
    description: confirm a PENDING distribution; runs §1.4 priority 12/13; generates Form1099R
    roles: [AccountOwner]
    code: 200
    input: [expected_account_version]
    output: Distribution
    side_effects:
      - "distribution.status -> CONFIRMED"
      - "Form1099R generated"
      - "account balances decremented; basis split per §1.3 distribution_basis_split"
      - "if RMD: RMDSchedule.satisfied_amount_cents += amount; possibly -> SATISFIED"
      - "AuditEvent DISTRIBUTION_CONFIRMED appended"
      - "AccountOwner.rmd_posture recomputed"
      - "account.version incremented by 1"

  - method: POST
    path: "/ira/distributions/{id}/reverse"
    description: reverse a CONFIRMED distribution within the same tax year
    roles: [PlanAdministrator]
    code: 200
    input: [expected_account_version]
    output: Distribution
    side_effects:
      - "distribution.status -> REVERSED"
      - "account.cash_balance_cents restored"
      - "Form1099R voided"
      - "RMDSchedule recomputed if affected"
      - "account.version incremented by 1"

  # ----- Conversions (Backdoor Roth) -----
  - method: POST
    path: "/ira/conversions"
    description: initiate a Roth conversion (Backdoor Roth pattern)
    roles: [AccountOwner]
    code: 201
    input: [source_account_id, target_account_id, gross_amount_cents, "aggregate_basis?"]
    output: Conversion
    side_effects:
      - "source IRAAccount.status -> CONVERSION_IN_PROGRESS"
      - "Conversion.status = INITIATED"
      - "source account.version incremented by 1"

  - method: GET
    path: "/ira/conversions/{id}"
    description: fetch a conversion
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: []
    output: Conversion
    side_effects: []

  - method: GET
    path: "/ira/conversions"
    description: list conversions, filterable by source/target account
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: ["source_account_id?", "target_account_id?", "status?", "limit?", "offset?"]
    output: Conversion[]
    side_effects: []

  - method: POST
    path: "/ira/conversions/{id}/complete"
    description: complete an INITIATED conversion; runs §1.3 backdoor_roth_pro_rata; generates Form1099R with code G
    roles: [AccountOwner]
    code: 200
    input: [expected_source_account_version]
    output: Conversion
    side_effects:
      - "Conversion.status -> COMPLETED; taxable/nontaxable split set"
      - "source account: cash_balance_cents and bases decremented"
      - "target ROTH account: cash_balance_cents incremented"
      - "source account.status -> ACTIVE"
      - "Form1099R generated with distribution_code='G'"
      - "AuditEvent CONVERSION_COMPLETED appended"
      - "both accounts' versions incremented by 1"

  - method: POST
    path: "/ira/conversions/{id}/reverse"
    description: reverse an INITIATED conversion (before completion)
    roles: [AccountOwner]
    code: 200
    input: [expected_source_account_version]
    output: Conversion
    side_effects:
      - "Conversion.status -> REVERSED"
      - "source IRAAccount.status -> ACTIVE (no balance change)"
      - "source account.version incremented by 1"

  # ----- Beneficiary Designations -----
  - method: POST
    path: "/ira/beneficiary-designations"
    description: create a PENDING beneficiary designation
    roles: [AccountOwner]
    code: 201
    input: [account_id, beneficiary_full_name, relationship, percentage_bps]
    output: BeneficiaryDesignation
    side_effects: ["designation.status = PENDING"]

  - method: GET
    path: "/ira/beneficiary-designations/{id}"
    description: fetch a beneficiary designation
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: []
    output: BeneficiaryDesignation
    side_effects: []

  - method: GET
    path: "/ira/beneficiary-designations"
    description: list beneficiary designations, filterable by account
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: ["account_id?", "status?", "relationship?", "limit?", "offset?"]
    output: BeneficiaryDesignation[]
    side_effects: []

  - method: POST
    path: "/ira/beneficiary-designations/{id}/activate"
    description: activate a PENDING designation; sum of ACTIVE percentage_bps for the account must equal 10000
    roles: [AccountOwner]
    code: 200
    input: []
    output: BeneficiaryDesignation
    side_effects: ["designation.status -> ACTIVE"]

  - method: POST
    path: "/ira/beneficiary-designations/{id}/revoke"
    description: revoke an ACTIVE or PENDING designation
    roles: [AccountOwner]
    code: 200
    input: []
    output: BeneficiaryDesignation
    side_effects: ["designation.status -> REVOKED"]

  # ----- RMD Schedules -----
  - method: POST
    path: "/ira/rmd-schedules"
    description: create an RMDSchedule for (owner_id, tax_year); computes required_amount_cents per §1.3 rmd_amount
    roles: [PlanAdministrator]
    code: 201
    input: [owner_id, tax_year]
    output: RMDSchedule
    side_effects:
      - "schedule.required_amount_cents computed"
      - "schedule.deadline_at computed (Dec 31 of tax_year, or April 1 of tax_year+1 if is_first_rmd_year)"
      - "AccountOwner.rmd_posture set to REQUIRED_PENDING if required_amount_cents > 0"

  - method: GET
    path: "/ira/rmd-schedules/{id}"
    description: fetch an RMD schedule
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: []
    output: RMDSchedule
    side_effects: []

  - method: GET
    path: "/ira/rmd-schedules"
    description: list RMD schedules, filterable by owner
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: ["owner_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: RMDSchedule[]
    side_effects: []

  # ----- 1099-R Forms -----
  - method: GET
    path: "/ira/forms-1099r/{id}"
    description: fetch a generated 1099-R form
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: []
    output: Form1099R
    side_effects: []

  - method: GET
    path: "/ira/forms-1099r"
    description: list 1099-R forms, filterable by distribution_id, conversion_id, or tax_year
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: ["distribution_id?", "conversion_id?", "tax_year?", "limit?", "offset?"]
    output: Form1099R[]
    side_effects: []

  # ----- Audit Events -----
  - method: GET
    path: "/ira/audit-events/{id}"
    description: fetch a single audit event
    roles: [PlanAdministrator, IRSAuditor]
    code: 200
    input: []
    output: AuditEvent
    side_effects: []

  - method: GET
    path: "/ira/audit-events"
    description: list audit events for an owner
    roles: [PlanAdministrator, IRSAuditor]
    code: 200
    input: ["owner_id?", "account_id?", "event_kind?", "tax_year?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  # ----- Test-Driving Endpoints (System Clock + Ops Run) -----
  - method: POST
    path: "/ira/_clock/set_current_utc"
    description: set the explicit server clock; recomputes current_tax_year
    roles: [PlanAdministrator]
    code: 200
    input: [to_iso8601]
    output: SystemClock
    side_effects: ["SystemClock.current_utc set; current_tax_year recomputed"]

  - method: GET
    path: "/ira/_clock"
    description: read the current explicit server clock
    roles: [PlanAdministrator, AccountOwner, IRSAuditor]
    code: 200
    input: []
    output: SystemClock
    side_effects: []

  - method: POST
    path: "/ira/_ops/advance-year-rollover"
    description: ops-run checkpoint; resets ytd_contribution_cents on all accounts to 0, advances tax_year_marker, and transitions OPEN RMDSchedule rows past their deadline to DELINQUENT
    roles: [PlanAdministrator]
    code: 200
    input: [new_tax_year]
    output: "{ rolled_account_count: integer, delinquent_schedule_count: integer }"
    side_effects:
      - "IRAAccount.tax_year_marker advanced; ytd_contribution_cents -> 0"
      - "OPEN RMDSchedule rows past deadline -> DELINQUENT; AuditEvent RMD_DEADLINE_BREACHED appended"
      - "AccountOwner.rmd_posture recomputed across affected owners"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "X-User-Role header missing"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the declared §1.7 roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role is recognized but not permitted for this endpoint, OR AccountOwner X-User-ID does not equal the owner of the resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-templated id does not resolve to an existing entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target entity is not in the from-state required for this transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: payload's expected_<parent>_version does not equal the current parent.version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required field missing, enum out of range, or type mismatch"
  - id: ERR_INVALID_CONVERSION_PAIR
    http: 422
    condition: "Conversion source/target type or ownership mismatch"
  - id: ERR_KIND_ACCOUNT_MISMATCH
    http: 422
    condition: "Contribution.contribution_kind incompatible with IRAAccount.account_type"
  - id: ERR_TAX_YEAR_CLOSED
    http: 422
    condition: "Contribution.tax_year != account.tax_year_marker at confirmation time"
  - id: ERR_BENEFICIARY_SHARES_INVALID
    http: 422
    condition: "Sum of percentage_bps across ACTIVE BeneficiaryDesignations for the account != 10000 when activating a new designation"
  - id: ERR_CONTRIBUTION_CAP_EXCEEDED
    http: 422
    condition: "Confirming this contribution would push ytd_contribution_cents above contribution_limit(owner, account_type, tax_year)"
  - id: ERR_INSUFFICIENT_BALANCE
    http: 422
    condition: "Distribution.amount_cents > account.cash_balance_cents OR federal_withholding_cents > amount_cents"
  - id: ERR_SECURE_DEADLINE_PASSED
    http: 422
    condition: "Confirming this distribution on an INHERITED NON_ELIGIBLE_INDIVIDUAL account would leave a nonzero balance past BeneficiaryDesignation.secure_deadline_at"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdministrator
    description: custodian/recordkeeper; opens accounts, ops-runs, freezes/unfreezes, voids transactions
    identity: opaque
    exclusive_operations:
      - "POST /ira/owners (register owner)"
      - "POST /ira/accounts (open account)"
      - "POST /ira/accounts/{id}/freeze and /unfreeze"
      - "POST /ira/contributions/{id}/reject and /reverse"
      - "POST /ira/distributions/{id}/reverse"
      - "POST /ira/rmd-schedules"
      - "POST /ira/owners/{id}/declare-deceased"
      - "PATCH /ira/owners/{id}/agi"
      - "POST /ira/_clock/set_current_utc"
      - "POST /ira/_ops/advance-year-rollover"
    shared_operations:
      - "GET reads on owners, accounts, contributions, distributions, conversions, beneficiary-designations, rmd-schedules, forms-1099r"
      - "POST /ira/accounts/{id}/close"

  - name: AccountOwner
    description: the IRA owner acting on their own accounts
    identity: "entity_backed:AccountOwner"
    exclusive_operations:
      - "POST /ira/contributions and /contributions/{id}/confirm"
      - "POST /ira/distributions and /distributions/{id}/confirm"
      - "POST /ira/conversions, /conversions/{id}/complete, /conversions/{id}/reverse"
      - "POST /ira/beneficiary-designations, /activate, /revoke"
    shared_operations:
      - "GET reads on own owner record, own accounts, own contributions, own distributions, own conversions, own beneficiary-designations, own rmd-schedules, own forms-1099r"
      - "POST /ira/accounts/{id}/close"

  - name: IRSAuditor
    description: read-only auditor for compliance review
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET reads on owners, accounts, contributions, distributions, conversions, beneficiary-designations, rmd-schedules, forms-1099r, audit-events"
