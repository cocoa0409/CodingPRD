      - name: test_purchase_serial_captured_to_confirmed_unauthorized_traces_the_unit
        claim_type: valid_transition
        grounds: ["state_machines.TestPurchase.transitions.SERIAL_CAPTURED_to_CONFIRMED_UNAUTHORIZED"]
        distinguishing_aspect: "The UNAUTHORIZED outcome fans out three ways at once: outcome_reason on the purchase, unauthorized_seller_confirmed on the observation, and TRACED_UNAUTHORIZED on the serial unit."
        test_recipe:
