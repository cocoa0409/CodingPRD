  - rule_id: non_linear_state_machine
    instances:
      - name: change_request_approve_return_cycle
        grounds:
          - state_machines.TerritoryChangeRequest.PENDING_to_APPROVED
          - state_machines.TerritoryChangeRequest.APPROVED_to_PENDING
          - state_machines.TerritoryChangeRequest.APPROVED_to_APPLIED
        distinguishing_aspect: |
          TerritoryChangeRequest is cyclic: PENDING -> APPROVED -> PENDING (return)
          -> APPROVED -> APPLIED traverses the loop and still completes, with
          decided_by_user_id cleared to null by the return hop — not a linear
          pipeline.
        test_recipe:
          setup:
            - "Plan COMMUNICATED with ACTIVE territories TF (account ACC assigned) and TT staffed by an ACTIVE rep; change request on ACC effective 2027-07-10"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-CYC", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TF", potential_cents: 100, headcount_capacity: 3 }, as: SalesOpsAdmin, captures: { tf: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TT", potential_cents: 100, headcount_capacity: 3 }, as: SalesOpsAdmin, captures: { tt: $.data.id } }
            - { call: "POST /sales-planning/territories/${tf}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tt}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "Staffer", email: "st@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${tt}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${tf}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "ACC", country_code: "US", segment: "SMB", annual_potential_cents: 120000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/change-requests", payload: { plan_year_id: "${plan}", account_id: "${acc}", from_territory_id: "${tf}", to_territory_id: "${tt}", effective_date: "2027-07-10" }, as: SalesOpsAnalyst, as_user_id: "analyst-1", captures: { cr: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /sales-planning/change-requests/${cr}/approve", payload: { expected_plan_year_version: "${pv2}" }, as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /sales-planning/change-requests/${cr}/return", payload: { return_reason: "rework dates" }, as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv3: $.data.version } }
            - { call: "POST /sales-planning/change-requests/${cr}/approve", payload: { expected_plan_year_version: "${pv3}" }, as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-10T00:00:00Z" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/change-requests/${cr}/apply", as: RevOpsManager, as_user_id: "mgr-1" }
          assert:
            - "After return: TerritoryChangeRequest.${cr}.status == PENDING and decided_by_user_id == null (cycle hop APPROVED -> PENDING executed)"
            - "After second approve: status == APPROVED and decided_by_user_id == 'mgr-1'"
            - "After apply: status == APPLIED and Account.${acc}.assigned_territory_id == ${tt} with assignment_source == MANUAL_CHANGE"

      - name: dispute_fork_divergent_side_effects
        grounds:
          - state_machines.OwnershipDispute.UNDER_REVIEW_to_RESOLVED_UPHELD
          - state_machines.OwnershipDispute.UNDER_REVIEW_to_RESOLVED_OVERRULED
          - entities.Account.fields.assignment_source
        distinguishing_aspect: |
          OwnershipDispute is a fork with divergent side effects: from UNDER_REVIEW
          the UPHELD branch reassigns the account to the claimant territory
          (source DISPUTE_RESOLUTION) while the OVERRULED branch leaves the account
          untouched — two resolutions of identical shape produce different
          Account state.
        test_recipe:
          setup:
            - "Plan COMMUNICATED; ACTIVE territory TX owns accounts A1 and A2 via a GEO rule; ACTIVE territory TY staffed by rep R who files both disputes claiming TY"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-DSP", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TX", potential_cents: 100, headcount_capacity: 3 }, as: SalesOpsAdmin, captures: { tx: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TY", potential_cents: 100, headcount_capacity: 3 }, as: SalesOpsAdmin, captures: { ty: $.data.id } }
            - { call: "POST /sales-planning/territories/${tx}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${ty}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "Claimant", email: "cl@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${ty}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${tx}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A1", country_code: "US", segment: "SMB", annual_potential_cents: 60000 }, as: SalesOpsAdmin, captures: { a1: $.data.id } }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A2", country_code: "US", segment: "SMB", annual_potential_cents: 60000 }, as: SalesOpsAdmin, captures: { a2: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/disputes", payload: { plan_year_id: "${plan}", account_id: "${a1}", claimant_territory_id: "${ty}", reason: "named in CRM" }, as: SalesRep, as_user_id: "${rep}", captures: { d1: $.data.id } }
            - { call: "POST /sales-planning/disputes", payload: { plan_year_id: "${plan}", account_id: "${a2}", claimant_territory_id: "${ty}", reason: "named in CRM" }, as: SalesRep, as_user_id: "${rep}", captures: { d2: $.data.id } }
            - { call: "POST /sales-planning/disputes/${d1}/start-review", as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /sales-planning/disputes/${d2}/start-review", as: RevOpsManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /sales-planning/disputes/${d1}/resolve", payload: { resolution: "UPHELD" }, as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /sales-planning/disputes/${d2}/resolve", payload: { resolution: "OVERRULED" }, as: RevOpsManager, as_user_id: "mgr-1" }
          assert:
            - "Account.${a1}.assigned_territory_id == ${ty} and assignment_source == DISPUTE_RESOLUTION and assignment_rule_id == null (UPHELD branch side effect)"
            - "Account.${a2}.assigned_territory_id == ${tx} and assignment_source == GEO_RULE (OVERRULED branch: untouched)"
            - "Territory.${tx}.final_quota_cents and Territory.${ty}.final_quota_cents are unchanged by either resolution (disputes never move quota)"
            - "OwnershipDispute.${d1}.status == RESOLVED_UPHELD and OwnershipDispute.${d2}.status == RESOLVED_OVERRULED"

  - rule_id: transitive_cascade
    instances:
      - name: change_apply_four_hop_cascade
        grounds:
          - state_machines.TerritoryChangeRequest.APPROVED_to_APPLIED
          - calculations.credit_transition_transfer
          - calculations.rep_final_share
        distinguishing_aspect: |
          Depth-4 chain from one trigger: apply -> Account assignment flip ->
          from/to Territory final_quota_cents +/- 120000 -> TRANSFER_OUT (-8516)
          and TRANSFER_IN (+8516) CreditEvents from the July booking ->
          rep_final_share recompute leaving both reps' final_quota_cents 240000.
        test_recipe:
          setup:
            - "Plan COMMUNICATED (PRORATE_BY_DAY); root R target 480000; children TF (pot 600, final 360000) and TT (pot 200, final 120000); repOld sole ACTIVE on TF, repNew sole ACTIVE on TT, both hired 2025 (fully ramped); account ACC (potential 288000) assigned TF; one booking 12000 on 2027-07-15 credited to repOld; approved change request effective 2027-07-10; clock at 2027-07-25"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-CAS", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 480000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "R", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { r: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TF", potential_cents: 600, headcount_capacity: 3, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tf: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TT", potential_cents: 200, headcount_capacity: 3, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tt: $.data.id } }
            - { call: "POST /sales-planning/territories/${r}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tf}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tt}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 480000 }, as: SalesOpsAdmin, captures: { alloc: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc}/apply", payload: { expected_plan_year_version: "${pv1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "Old", email: "old@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep_old: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "New", email: "new@x.com", hire_date: "2025-02-05" }, as: SalesOpsAdmin, captures: { rep_new: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep_old}", territory_id: "${tf}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { asg_old: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep_new}", territory_id: "${tt}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { asg_new: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${tf}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "ACC", country_code: "US", segment: "ENTERPRISE", annual_potential_cents: 288000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv2}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-15T00:00:00Z" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan}", account_id: "${acc}", amount_cents: 12000, booking_date: "2027-07-15" }, as: SalesOpsAdmin, captures: { evt_jul: "$.data[0].id" } }
            - { call: "POST /sales-planning/change-requests", payload: { plan_year_id: "${plan}", account_id: "${acc}", from_territory_id: "${tf}", to_territory_id: "${tt}", effective_date: "2027-07-10" }, as: SalesOpsAnalyst, as_user_id: "analyst-1", captures: { cr: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv3: $.data.version } }
            - { call: "POST /sales-planning/change-requests/${cr}/approve", payload: { expected_plan_year_version: "${pv3}" }, as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-25T00:00:00Z" }, as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/change-requests/${cr}/apply", as: RevOpsManager, as_user_id: "mgr-1" }
          assert:
            - "Hop 1: Account.${acc}.assigned_territory_id == ${tt} with assignment_source == MANUAL_CHANGE"
            - "Hop 2: Territory.${tf}.final_quota_cents == 240000 and Territory.${tt}.final_quota_cents == 240000; TerritoryChangeRequest.${cr}.quota_transfer_cents == 120000 (round_half_up(288000 * 5/12))"
            - "Hop 3: a TRANSFER_OUT of -8516 on rep ${rep_old} with parent_credit_event_id == ${evt_jul} and a TRANSFER_IN of +8516 on rep ${rep_new}, both with source_change_request_id == ${cr} (round_half_up(12000 * 22/31) == 8516)"
            - "Hop 3 attainment: RepAssignment.${asg_old}.attainment_cents == 3484 and RepAssignment.${asg_new}.attainment_cents == 8516"
            - "Hop 4: RepAssignment.${asg_old}.final_quota_cents == 240000 and RepAssignment.${asg_new}.final_quota_cents == 240000 (fully ramped: 12 x 20000)"

      - name: assignment_end_share_recompute_cascade
        grounds:
          - state_machines.RepAssignment.ACTIVE_to_ENDED
          - calculations.rep_base_share
          - calculations.ramp_quota
        distinguishing_aspect: |
          Depth-2 chain from a different trigger than change-apply: ending R1's
          assignment -> territory ACTIVE-sharer count drops 2 -> 1 -> sibling R2's
          base_quota_cents recomputes 50000 -> 100000 and its ramped_quota_cents
          recomputes to 99996, while ENDED R1 stays frozen at 50000 / 50004.
        test_recipe:
          setup:
            - "Plan OPEN; single ACTIVE leaf territory T allocated 100000; R1 (created first) and R2 both ACTIVELY assigned to T, each base 50000; both reps hired 2025-06-01 (fully ramped)"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-END", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${t}", pool_cents: 100000 }, as: SalesOpsAdmin, captures: { alloc: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R1", email: "r1@x.com", hire_date: "2025-06-01" }, as: SalesOpsAdmin, captures: { r1: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R2", email: "r2@x.com", hire_date: "2025-06-01" }, as: SalesOpsAdmin, captures: { r2: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r1}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { a1: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r2}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/rep-assignments/${a1}/end", payload: { effective_to: "2027-06-30" }, as: SalesOpsAdmin }
          assert:
            - "RepAssignment.${a1}.status == ENDED with base_quota_cents frozen at 50000 and ramped_quota_cents frozen at 50004 (12 x round_half_up(50000/12) == 12 x 4167)"
            - "RepAssignment.${a2}.base_quota_cents == 100000 (sole remaining ACTIVE sharer)"
            - "RepAssignment.${a2}.ramped_quota_cents == 99996 (12 x round_half_up(100000/12) == 12 x 8333; pinned rounding, not 100000)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submission_window_closed_beats_amount_not_positive
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_SUBMISSION_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the request violates both
          P4 (plan DRAFT, submission window not open) and P8 (proposed_quota_cents
          -5 not positive); the P4 state error ERR_SUBMISSION_WINDOW_CLOSED wins.
        test_recipe:
          setup:
            - "Plan in DRAFT with one ACTIVE territory T and an existing rep R"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-P1", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${t}", proposed_quota_cents: -5 }, as: SalesRep, as_user_id: "${rep}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SUBMISSION_WINDOW_CLOSED (priority 4 state beats priority 8 business_fiscal ERR_AMOUNT_NOT_POSITIVE)"
            - "HTTP status is 409, not 422"

      - name: change_create_referential_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CROSS_PLAN_REFERENCE]
        distinguishing_aspect: |
          Category pair business_referential vs business_temporal: the request
          references an account owned by a different plan year (P5) AND supplies
          an effective_date outside the request plan's year (P6); the P5
          ERR_CROSS_PLAN_REFERENCE wins over ERR_DATE_OUT_OF_PLAN_YEAR.
        test_recipe:
          setup:
            - "Plan A (2027) COMMUNICATED with ACTIVE territories T1 and T2; plan B (2028) DRAFT containing account ACC-B"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-A", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan_a: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_a}", name: "T1", potential_cents: 100, headcount_capacity: 3 }, as: SalesOpsAdmin, captures: { t1: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_a}", name: "T2", potential_cents: 100, headcount_capacity: 3 }, as: SalesOpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /sales-planning/territories/${t1}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${t2}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan_a}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan_a}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan_a}" }, as: SalesOpsAdmin, captures: { run_a: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_a}", as: SalesOpsAdmin, captures: { pv_a: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run_a}/apply", payload: { expected_plan_year_version: "${pv_a}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan_a}/communicate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY28-B", start_date: "2028-01-01", end_date: "2028-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2028-01-15" }, as: SalesOpsAdmin, captures: { plan_b: $.data.id } }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan_b}", name: "ACC-B", country_code: "US", segment: "SMB", annual_potential_cents: 60000 }, as: SalesOpsAdmin, captures: { acc_b: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/change-requests", payload: { plan_year_id: "${plan_a}", account_id: "${acc_b}", from_territory_id: "${t1}", to_territory_id: "${t2}", effective_date: "2028-06-01" }, as: SalesOpsAnalyst, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CROSS_PLAN_REFERENCE (priority 5 business_referential beats priority 6 business_temporal ERR_DATE_OUT_OF_PLAN_YEAR)"
            - "No TerritoryChangeRequest is created"

  - rule_id: boundary_precision_check
    instances:
      - name: coverage_headcount_exact_multiple_boundary
        grounds:
          - calculations.coverage_model
          - entities.PlanYear.fields.productivity_per_rep_cents
        distinguishing_aspect: |
          Ceil boundary on the headcount metric via GET coverage-report: retained
          quota 3000000 with productivity 1500000 divides exactly -> required 2,
          while 3000001 (one cent over) -> required 3; a root row with retained 0
          reports NO_QUOTA with required 0.
        test_recipe:
          setup:
            - "Plan OPEN with root R (pot 0) and ACTIVE children A then B, both potential 1; company target 6000001 allocated from R, so A (earlier created_at) receives 3000001 and B 3000000; no accounts, no reps"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-COV", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 6000001, productivity_per_rep_cents: 1500000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "R", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { r: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "A", potential_cents: 1, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { ta: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "B", potential_cents: 1, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tb: $.data.id } }
            - { call: "POST /sales-planning/territories/${r}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${ta}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tb}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 6000001 }, as: SalesOpsAdmin, captures: { alloc: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
          trigger:
            - { call: "GET /sales-planning/plan-years/${plan}/coverage-report", as: SalesOpsAdmin }
          assert:
            - "Row for ${ta}: retained 3000001 -> required_headcount == 3, active_rep_count == 0, coverage_status == GAP"
            - "Row for ${tb}: retained 3000000 -> required_headcount == 2 (exact multiple divides evenly, ceil does not round up), coverage_status == GAP"
            - "Row for ${r}: retained 0 -> required_headcount == 0, coverage_status == NO_QUOTA"
            - "total_required_headcount == 5, total_active_assignments == 0, uncovered_account_count == 0"

      - name: reconciliation_tolerance_exact_ten_percent
        grounds:
          - calculations.reconciliation_final
          - entities.ReconciliationRun.fields.results
        distinguishing_aspect: |
          Integer-exact tolerance boundary on the deviation metric via
          POST /reconciliation-runs: bottom_up 1100000 is exactly 10.00% over
          top_down 1000000 -> blends to 1050000 (|diff|*100 <= top*10), while
          1100001 escalates to final 1000000 even though its displayed
          deviation_pct also rounds to 10.00 — display rounding must not feed
          the comparison.
        test_recipe:
          setup:
            - "BLENDED plan with root R target 2000000 and ACTIVE children T1, T2 (equal potential, top_down 1000000 each); T1 has a LOCKED_IN submission of 1100000, T2 of 1100001"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-TOL", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 2000000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15", reconciliation_policy: "BLENDED" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "R", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { r: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T1", potential_cents: 1, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { t1: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T2", potential_cents: 1, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /sales-planning/territories/${r}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${t1}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${t2}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 2000000 }, as: SalesOpsAdmin, captures: { alloc: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc}/apply", payload: { expected_plan_year_version: "${pv1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R1", email: "r1@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { r1: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R2", email: "r2@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { r2: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r1}", territory_id: "${t1}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r2}", territory_id: "${t2}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${t1}", proposed_quota_cents: 1100000 }, as: SalesRep, as_user_id: "${r1}" }
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${t2}", proposed_quota_cents: 1100001 }, as: SalesRep, as_user_id: "${r2}" }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv2}" }, as: SalesOpsAdmin }
          assert:
            - "ReconciliationRun.${run}.results row for ${t1}: final_cents == 1050000, escalated == false, deviation_pct == 10.00"
            - "ReconciliationRun.${run}.results row for ${t2}: final_cents == 1000000, escalated == true, deviation_pct == 10.00 (display rounds; the integer comparison |1100001-1000000|*100 > 1000000*10 is authoritative)"
            - "Territory.${t1}.final_quota_cents == 1050000 and Territory.${t2}.final_quota_cents == 1000000 after apply"
            - "Results rows are ordered R, T1, T2 (territory created_at ASC); row for ${r}: bottom_up_cents == null, final_cents == 2000000"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: submission_requires_active_territory
        grounds:
          - state_machines.BottomUpSubmission
          - validations[priority=4]
          - errors[ERR_TERRITORY_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair BottomUpSubmission -> Territory: creating a submission on a DRAFT
          territory fails with ERR_TERRITORY_NOT_ACTIVE; the identical request
          succeeds after the territory's own state machine moves it to ACTIVE.
        test_recipe:
          setup:
            - "Plan OPEN; territory TD left in DRAFT; rep R exists"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-X1", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TD", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { td: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TA", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { ta: $.data.id } }
            - { call: "POST /sales-planning/territories/${ta}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${td}", proposed_quota_cents: 50000 }, as: SalesRep, as_user_id: "${rep}", captures: { err: $.data.error_id } }
            - { call: "POST /sales-planning/territories/${td}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${td}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${td}", proposed_quota_cents: 50000 }, as: SalesRep, as_user_id: "${rep}", captures: { sub: $.data.id } }
          assert:
            - "First attempt: ${err} == ERR_TERRITORY_NOT_ACTIVE (HTTP 409)"
            - "After activation + membership: BottomUpSubmission.${sub}.status == SUBMITTED (HTTP 201)"

      - name: credit_event_requires_communicated_plan
        grounds:
          - state_machines.PlanYear.RECONCILED_to_COMMUNICATED
          - validations[priority=4]
          - errors[ERR_PLAN_NOT_COMMUNICATED]
        distinguishing_aspect: |
          Pair CreditEvent -> PlanYear: a booking against a RECONCILED-but-not-
          COMMUNICATED plan fails with ERR_PLAN_NOT_COMMUNICATED; after the plan's
          communicate transition the identical booking posts and splits to the
          territory's rep.
        test_recipe:
          setup:
            - "Plan RECONCILED with single leaf T (final 100000), rep R ACTIVELY assigned to T, account ACC assigned to T via GEO rule; clock at 2027-06-05"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-X2", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { asg: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${t}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "ACC", country_code: "US", segment: "SMB", annual_potential_cents: 60000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${t}", pool_cents: 100000 }, as: SalesOpsAdmin, captures: { alloc: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc}/apply", payload: { expected_plan_year_version: "${pv1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv2}" }, as: SalesOpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan}", account_id: "${acc}", amount_cents: 5000, booking_date: "2027-06-05" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan}", account_id: "${acc}", amount_cents: 5000, booking_date: "2027-06-05" }, as: SalesOpsAdmin, captures: { evt: "$.data[0].id" } }
          assert:
            - "First attempt: ${err} == ERR_PLAN_NOT_COMMUNICATED (HTTP 409)"
            - "After communicate: one BOOKING CreditEvent ${evt} of 5000 credited to rep ${rep} (sole eligible)"
            - "RepAssignment.${asg}.attainment_cents == 5000"

  - rule_id: resource_temporal_overlap
    instances:
      - name: rep_assignment_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_ASSIGNMENT_OVERLAP]
          - entities.RepAssignment.fields.effective_to
        distinguishing_aspect: |
          Half-open interval semantics on the SalesRep resource: window
          [2027-01-01, 2027-07-01) and a new window starting exactly 2027-07-01
          are adjacent and ACCEPTED, while 2027-06-30 overlaps by one day and is
          REJECTED — effective_to is exclusive.
        test_recipe:
          setup:
            - "Plan OPEN with ACTIVE territories T1, T2 (capacity 5) and rep R"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-O1", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T1", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { t1: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T2", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /sales-planning/territories/${t1}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${t2}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t1}", effective_from: "2027-01-01", effective_to: "2027-07-01" }, as: SalesOpsAdmin, captures: { a1: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t2}", effective_from: "2027-07-01" }, as: SalesOpsAdmin, captures: { a2: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t2}", effective_from: "2027-06-30" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "RepAssignment.${a1} created: [2027-01-01, 2027-07-01)"
            - "RepAssignment.${a2} created: start exactly at the first window's exclusive end is adjacent, not overlapping"
            - "Third attempt: ${err} == ERR_ASSIGNMENT_OVERLAP (HTTP 409): 2027-06-30 precedes 2027-07-01 by one day and collides"

      - name: plan_year_closed_interval_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_PLAN_DATE_OVERLAP]
          - entities.PlanYear.fields.start_date
        distinguishing_aspect: |
          Closed-interval semantics on the PlanYear resource — different from the
          half-open RepAssignment rule: a plan starting 2027-12-01 collides with
          [2027-01-01, 2027-12-31] because December 2027 days are shared, while a
          plan starting 2028-01-01 is accepted; endpoints are INCLUSIVE here.
        test_recipe:
          setup:
            - "Existing plan P1 covering [2027-01-01, 2027-12-31]"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-LATE", start_date: "2027-12-01", end_date: "2028-11-30", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-12-15" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY28", start_date: "2028-01-01", end_date: "2028-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2028-01-15" }, as: SalesOpsAdmin, captures: { p3: $.data.id } }
          assert:
            - "Second create: ${err} == ERR_PLAN_DATE_OVERLAP (HTTP 409): December 2027 belongs to both closed intervals"
            - "Third create: PlanYear.${p3} created with status DRAFT (2028-01-01 is one day past the inclusive end 2027-12-31)"

  - rule_id: compensating_invariant
    instances:
      - name: allocation_pool_conservation_on_reapply
        grounds:
          - calculations.allocation_largest_remainder
          - state_machines.TopDownAllocation.APPLIED_to_SUPERSEDED
        distinguishing_aspect: |
          Conserved quantity: the quota pool. Applying a second allocation over
          the same scope supersedes the first and the children's assigned quotas
          still sum to exactly 1000001 — the apply + supersede pair leaves zero
          drift in sum(children.assigned_quota_cents).
        test_recipe:
          setup:
            - "Plan OPEN; root R with ACTIVE children A, B, C (potentials 100, 200, 700); allocation A1 applied with pool 1000001"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-INV", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 1000001, productivity_per_rep_cents: 500000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "R", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { r: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "A", potential_cents: 100, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { ta: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "B", potential_cents: 200, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tb: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "C", potential_cents: 700, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tc: $.data.id } }
            - { call: "POST /sales-planning/territories/${r}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${ta}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tb}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tc}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 1000001 }, as: SalesOpsAdmin, captures: { al1: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${al1}/apply", payload: { expected_plan_year_version: "${pv1}" }, as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 1000001 }, as: SalesOpsAdmin, captures: { al2: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /sales-planning/allocations/${al2}/apply", payload: { expected_plan_year_version: "${pv2}" }, as: SalesOpsAdmin }
          assert:
            - "TopDownAllocation.${al1}.status == SUPERSEDED and TopDownAllocation.${al2}.status == APPLIED"
            - "Territory.${ta}.assigned_quota_cents + Territory.${tb}.assigned_quota_cents + Territory.${tc}.assigned_quota_cents == 1000001 after both applies (100000 + 200000 + 700001; no double-count, no drift)"
            - "Territory.${r}.assigned_quota_cents == 1000001 (pool conserved at the scope as well)"

      - name: attainment_conservation_on_midyear_change
        grounds:
          - calculations.credit_transition_transfer
          - calculations.attainment_rollup
          - state_machines.TerritoryChangeRequest.APPROVED_to_APPLIED
        distinguishing_aspect: |
          Conserved quantity: plan-wide rep attainment. A mid-year move splits the
          July booking 7097/2903 between new and old rep, so
          sum(rep attainment) == 15000 before and after apply and the generated
          TRANSFER_OUT (-7097) + TRANSFER_IN (+7097) net to exactly zero — a
          different conserved quantity than the quota pool.
        test_recipe:
          setup:
            - "Plan COMMUNICATED (PRORATE_BY_DAY) with TF (final 300000) staffed by repOld and TT (final 200000) staffed by repNew; account ACC (potential 240000) on TF; bookings 5000 (2027-06-05) and 10000 (2027-07-05) credited to repOld; change request approved, effective 2027-07-10; clock at 2027-07-25"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-CONS", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 500000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "R", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { r: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TF", potential_cents: 600, headcount_capacity: 3, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tf: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TT", potential_cents: 400, headcount_capacity: 3, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tt: $.data.id } }
            - { call: "POST /sales-planning/territories/${r}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tf}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tt}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 500000 }, as: SalesOpsAdmin, captures: { alloc: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc}/apply", payload: { expected_plan_year_version: "${pv1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "Old", email: "old@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep_old: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "New", email: "new@x.com", hire_date: "2025-02-05" }, as: SalesOpsAdmin, captures: { rep_new: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep_old}", territory_id: "${tf}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { asg_old: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep_new}", territory_id: "${tt}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { asg_new: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${tf}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "ACC", country_code: "US", segment: "ENTERPRISE", annual_potential_cents: 240000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv2}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-05T00:00:00Z" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan}", account_id: "${acc}", amount_cents: 5000, booking_date: "2027-06-05" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan}", account_id: "${acc}", amount_cents: 10000, booking_date: "2027-07-05" }, as: SalesOpsAdmin, captures: { evt_jul: "$.data[0].id" } }
            - { call: "POST /sales-planning/change-requests", payload: { plan_year_id: "${plan}", account_id: "${acc}", from_territory_id: "${tf}", to_territory_id: "${tt}", effective_date: "2027-07-10" }, as: SalesOpsAnalyst, as_user_id: "analyst-1", captures: { cr: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv3: $.data.version } }
            - { call: "POST /sales-planning/change-requests/${cr}/approve", payload: { expected_plan_year_version: "${pv3}" }, as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-25T00:00:00Z" }, as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/change-requests/${cr}/apply", as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "GET /sales-planning/credit-events", payload: { source_change_request_id: "${cr}" }, as: SalesOpsAdmin }
          assert:
            - "RepAssignment.${asg_old}.attainment_cents == 7903 and RepAssignment.${asg_new}.attainment_cents == 7097; plan-wide total 15000 unchanged by the apply"
            - "The two transfer events for ${cr} sum to 0: TRANSFER_OUT -7097 (parent ${evt_jul}, rep ${rep_old}) + TRANSFER_IN +7097 (rep ${rep_new})"
            - "GET credit-events?source_change_request_id returns exactly 2 POSTED events"
