              as: FrontDesk
          trigger:
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "RESERVATION", party_size: 9, window_start: "2026-06-15T11:00:00Z", window_end: "2026-06-15T13:00:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FIELD_SLOT_CONFLICT"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ammo_tier_boundary_500_vs_501
        grounds:
          - calculations.add_on_total_cents
          - entities.AddOnOrder.fields.quote_total_cents
        distinguishing_aspect: |
          Numeric tier boundary on the ammo metric: exactly 500 balls bills 500*10=5000 cents
          (tier1 only), 501 balls bills 5000 + 1*8 = 5008 (one ball crosses into tier2). The
          marginal rate switches at >500, not >=500. Reached via POST /add-on-orders.
        test_recipe:
          setup:
            - "Arena OPEN; field; HELD booking; two add-on orders ammo 500 and ammo 501"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A11", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F11", game_mode: "LASER_TAG", capacity_max: 8, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /add-on-orders"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", ammo_balls: 500, co2_tanks: 0, misc_cents: 0 }
              as: FrontDesk
              captures: { addon_500: $.data.id, q500: $.data.quote_total_cents }
          trigger:
            - call: "POST /add-on-orders"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", ammo_balls: 501, co2_tanks: 0, misc_cents: 0 }
              as: FrontDesk
              captures: { addon_501: $.data.id, q501: $.data.quote_total_cents }
          assert:
            - "AddOnOrder.${addon_500}.quote_total_cents == 5000"
            - "AddOnOrder.${addon_501}.quote_total_cents == 5008"

      - name: referee_threshold_party_11_vs_12_empty_vs_required
        grounds:
          - calculations.referee_required
          - entities.Booking.fields.referee_required
          - entities.Booking.fields.party_size
        distinguishing_aspect: |
          Different metric and endpoint (party_size headcount on POST /bookings, not ammo cents):
          party_size 11 yields referee_required false (below threshold, LASER_TAG, no minors),
          party_size 12 yields true (>=12 boundary, inclusive). Distinct boundary from the ammo
          tier and reached through a different endpoint.
        test_recipe:
          setup:
            - "Arena OPEN; LASER_TAG field capacity_max 20; two WALK_IN bookings party 11 and party 12, no minors"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A12", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F12", game_mode: "LASER_TAG", capacity_max: 20, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 11, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { b11: $.data.id, rr11: $.data.referee_required }
          trigger:
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "RESERVATION", party_size: 12, window_start: "2026-06-15T10:30:00Z", window_end: "2026-06-15T11:30:00Z" }
              as: FrontDesk
              captures: { b12: $.data.id, rr12: $.data.referee_required }
          assert:
            - "Booking.${b11}.referee_required == false"
            - "Booking.${b12}.referee_required == true"

