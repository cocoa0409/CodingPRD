          - calculations.billable_chair_units
          - entities.Appointment.fields.billable_chair_units
        distinguishing_aspect: |
          The endpoint declares side_effects: [] and must honour it: two identical calls
          return identical bodies, the appointment's version is unchanged across them, and
          the figures come from the row written at discharge rather than being recomputed
          into it. A day with no COMPLETED visit returns completed_appointment_count 0 with
          day_billable_units 0 and day_billable_cents 0 rather than a 404, because the
