  # =========================================================================
  # RBAC (§1.7) — five roles under a segregation_of_duties role model
  # =========================================================================
  - section: rbac
    instances:
      - name: corner_missing_role_header_returns_unauthenticated
        claim_type: per_role_permission
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: "Priority 1 outranks every other rule, so a request with no X-User-Role/X-User-ID headers returns 401 ERR_UNAUTHENTICATED even on an otherwise wide-open list read."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /plan-years"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: corner_exclusive_operations_denied_to_peer_roles
        claim_type: per_role_permission
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
          - endpoints[POST /loan-certifications/{certification_id}/decision]
          - endpoints[POST /nondiscrimination-tests]
          - endpoints[POST /funding-batches/{funding_batch_id}/settlement]
          - endpoints[POST /loan-certifications/{certification_id}/submit]
        distinguishing_aspect: "Priority 2 (role membership) outranks priorities 4-13 (existence), so each of four peer-role intrusions returns 403 ERR_FORBIDDEN_ROLE rather than a 404, even though every path id is unresolvable."
        test_recipe:
          setup:
            - "Empty database; all four target ids are deliberately unresolvable."
          setup_api_calls: []
          trigger:
            - call: "POST /loan-certifications/00000000-0000-0000-0000-0000000000b1/decision"
              payload: { decision: "ACCEPT" }
              as: PayrollOperator
              captures: { e1: $.data.error_id }
            - call: "POST /nondiscrimination-tests"
              payload: { plan_year_id: "00000000-0000-0000-0000-0000000000b2", test_method: "CURRENT_YEAR" }
              as: BenefitsAdministrator
              captures: { e2: $.data.error_id }
            - call: "POST /funding-batches/00000000-0000-0000-0000-0000000000b3/settlement"
              payload: { outcome: "SETTLED" }
              as: BenefitsAdministrator
              captures: { e3: $.data.error_id }
            - call: "POST /loan-certifications/00000000-0000-0000-0000-0000000000b4/submit"
              payload: {}
              as: ComplianceAuditor
              captures: { e4: $.data.error_id }
          assert:
            - "e1 == ERR_FORBIDDEN_ROLE  # decision is BenefitsAdministrator-exclusive"
            - "e2 == ERR_FORBIDDEN_ROLE  # test creation is ComplianceAuditor-exclusive"
            - "e3 == ERR_FORBIDDEN_ROLE  # settlement is Recordkeeper-exclusive"
            - "e4 == ERR_FORBIDDEN_ROLE  # claim submit is Employee-exclusive"
            - "all four responses carry HTTP status 403"

      - name: corner_employee_cannot_read_another_employees_claim
        claim_type: peer_roles
        grounds:
          - validations[priority=14]
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Employee
          - endpoints[GET /loan-certifications/{certification_id}]
        distinguishing_aspect: "The Employee role is entity_backed, so ownership is decided by X-User-ID: employee B reading employee A's claim gets 403 ERR_NOT_RESOURCE_OWNER while employee A reading the same claim gets 200, and the BenefitsAdministrator (opaque identity) also gets 200."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN."
            - "Two Employees A and B, each ACTIVE; one DRAFT LoanCertification owned by A."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-OWNER-A", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_a: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "E-OTHER-B", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_b: $.data.id }
            - call: "GET /employees/${emp_a}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_a_v: $.data.version }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_a}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_a_v}" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "GET /loan-certifications/${cert_id}"
              payload: {}
              as: Employee
              as_user_id: "${emp_b}"
              captures: { err: $.data.error_id }
            - call: "GET /loan-certifications/${cert_id}"
              payload: {}
              as: Employee
              as_user_id: "${emp_a}"
              captures: { own_id: $.data.id, own_st: $.data.status }
            - call: "GET /loan-certifications/${cert_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { adm_id: $.data.id }
          assert:
            - "err == ERR_NOT_RESOURCE_OWNER"
            - "HTTP status == 403 on the employee-B read"
            - "own_id == ${cert_id}"
            - "own_st == DRAFT"
            - "adm_id == ${cert_id}"
            - "the employee-A read and the administrator read both return HTTP status 200"

      - name: corner_void_by_the_accepting_user_id_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=31]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.LoanCertification.fields.accepted_by_user_id
          - endpoints[POST /loan-certifications/{certification_id}/audit-release]
        distinguishing_aspect: "The void is blocked by X-User-ID identity, not by role: the same ComplianceAuditor role succeeds with X-User-ID auditor-9 but is rejected with 403 ERR_SEGREGATION_OF_DUTIES when it presents the accepting user's id admin-1."
        test_recipe:
