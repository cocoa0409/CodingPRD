              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-10", capacity_total: 40, forecast_attendance: 36 }
              as: ProgramAdmin
              captures: { day_910: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_910}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { res_a: "$.data.id" }
          trigger:
            - call: "POST /reservations/${res_a}/cancel"
              as: PassOfficeClerk
          assert:
            - "BEFORE — GET /park-days/${day_910} → data.reservation_slot_capacity == 4, data.reserved_count == 1, data.remaining_slot_count == 3, data.released_count == 0, data.grant_count == 1; identity 1 + 3 == 4"
            - "trigger response data.status == 'CANCELLED_BY_HOLDER'"
            - "AFTER — GET /park-days/${day_910} → data.reserved_count == 0, data.remaining_slot_count == 4, data.released_count == 1; identity 0 + 4 == 4 is preserved"
            - "AFTER — GET /park-days/${day_910} → data.grant_count == 1, unchanged: the monotonic grant counter is an audit trail, not a conserved unit"
            - "AFTER — data.redeemed_count == 0 and data.no_show_count == 0 (the released unit did not leak into another bucket)"
            - "reserved_count + released_count + redeemed_count + no_show_count == 1 == grant_count — every granted unit is accounted for in exactly one terminal bucket"
            - "a second POST /reservations/${res_a}/cancel returns HTTP 409 with error_id == 'ERR_RESERVATION_NOT_CANCELLABLE', so the slot cannot be returned twice"
