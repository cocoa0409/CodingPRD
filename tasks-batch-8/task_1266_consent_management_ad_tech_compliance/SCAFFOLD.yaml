  - { id: ERR_STALE_PROPERTY_VERSION, http: 412, condition: "expected_property_version != current Property.version on publish" }
  - { id: ERR_PROPERTY_FROZEN, http: 409, condition: "Property posture FROZEN blocks the mutation" }
  - { id: ERR_POLICY_INVALID_TRANSITION, http: 409, condition: "Policy status transition not allowed from current state" }
  - { id: ERR_BANNER_CONFIG_NOT_PUBLISHABLE, http: 409, condition: "Publish/archive attempted from a non-permitted config state" }
  - { id: ERR_VENDOR_INVALID_TRANSITION, http: 409, condition: "Approve requires PENDING_REVIEW; suspend requires APPROVED" }
  - { id: ERR_TAG_RULE_INVALID_TRANSITION, http: 409, condition: "Tag rule status transition not allowed (RETIRED is terminal)" }
  - { id: ERR_CONSENT_INVALID_TRANSITION, http: 409, condition: "Withdraw requires GRANTED; regrant requires WITHDRAWN" }
  - { id: ERR_DNS_INVALID_STATE, http: 409, condition: "Verify/reject requires UNVERIFIED; propagate requires VERIFIED with propagation NOT_STARTED or PARTIAL_FAILURE" }
