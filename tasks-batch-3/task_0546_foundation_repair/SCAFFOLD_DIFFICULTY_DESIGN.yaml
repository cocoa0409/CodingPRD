            - { call: "GET /foundation/crews/${crew_id}", payload: {}, as: OpsCoordinator, captures: { bm: "$.data.booked_minutes" } }
          assert:
            - "Crew.${crew_id}.booked_minutes == 0"

      - name: accept_then_cancel_conserves_financing_balance
        grounds:
          - calculations.lead_financing_balance
          - state_machines.Quote.SENT_to_ACCEPTED
