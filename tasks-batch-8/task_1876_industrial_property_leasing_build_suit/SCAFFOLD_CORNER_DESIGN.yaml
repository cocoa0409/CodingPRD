            - { call: "POST /api/compliance-reviews/${rev_z}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/lois/${loi_id}/execute", as: AssetManager }
            - { call: "GET /api/bts-plans?loi_id=${loi_id}", as: ProjectManager, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /api/bts-plans/${plan_id}/price", payload: { hard_cost_total: 10000000, soft_cost_total: 2000000, contingency_pct: 0.05, pricing_method: YIELD_ON_COST }, as: ProjectManager }
          trigger:
            - { call: "POST /api/bts-plans/${plan_id}/approve", as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN and HTTP status 403"
            - "BuildToSuitPlan.${plan_id}.status remains PRICED"

      - name: compliance_officer_shared_reads_only
        claim_type: role_denial
        grounds: ["roles[ComplianceOfficer]", "validations[priority=2]"]
        excluded_because:
          difficulty_instance: projectmanager_cannot_approve_plan_returns_forbidden
          rationale: "Role-denial mechanics are identical (priority-2 role list check); the named corner instance covers the denial path on the approval-chain step."

  - section: cross_cutting_layers
    instances:
      - name: occ_stale_counter_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[loi-counter-stale-version]", "errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: counter_stale_version_returns_412
          rationale: "The OCC layer claim (stale expected_loi_version -> 412; fresh version -> success; version increments per write) is realized by the named corner instance in the validations section."

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: delivery_completion_three_hop
          rationale: "N-level cascade verified end-to-end (milestone -> plan -> LOI/site -> invoice) in the named §1.8 instance."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: bts_pricing_method_divergence
          rationale: "Both variants of two different calculations are asserted with literal deltas in §1.8 (bts_pricing_method_divergence, commission_basis_divergence)."

      - name: rate_threshold_layer_abatement
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers, calculations.delivery_delay_abatement]
        excluded_because:
          difficulty_instance: abatement_grace_boundary_30_days
          rationale: "Threshold boundary (30-day grace, strict >) is asserted by the named corner instance in the calculations section; the 45-day side is asserted by §1.8 delivery_completion_three_hop."

  - section: consistency_model
    instances:
      - name: execute_side_effects_immediately_visible
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/api/lois/{id}/execute"]
        distinguishing_aspect: "Immediate consistency: the execute response itself reports EXECUTED, and immediately following reads (no waits) show the spawned plan SCHEMATIC, both invoices ACCRUED, the site COMMITTED, and the requirement SATISFIED."
        test_recipe:
          setup: ["LOI_A ACCEPTED on SITE_A with both compliance reviews CLEARED"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03, commission_basis: GROSS_AGGREGATE }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois/${loi_id}/accept", as: LeasingManager }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ENVIRONMENTAL }, as: ComplianceOfficer, captures: { rev_e: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_e}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_e}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { rev_z: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_z}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_z}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /api/lois/${loi_id}/execute", as: AssetManager, captures: { loi_status: $.data.status } }
            - { call: "GET /api/bts-plans?loi_id=${loi_id}", as: ProjectManager, captures: { plan_status: "$.data[0].status" } }
            - { call: "GET /api/commission-invoices?loi_id=${loi_id}", as: LeasingManager, captures: { inv0_side: "$.data[0].broker_side", inv0_status: "$.data[0].status", inv1_side: "$.data[1].broker_side", inv1_status: "$.data[1].status" } }
            - { call: "GET /api/sites/${site_id}", as: LeasingManager, captures: { site_status: $.data.status } }
            - { call: "GET /api/tenant-requirements/${req_id}", as: TenantRep, as_user_id: rep-001, captures: { req_status: $.data.status } }
          assert:
            - "loi_status == EXECUTED in the execute response itself"
            - "plan_status == SCHEMATIC; invoices are [0] TENANT_REP / [1] LANDLORD_REP, both ACCRUED"
            - "site_status == COMMITTED and req_status == SATISFIED on immediate reads"
