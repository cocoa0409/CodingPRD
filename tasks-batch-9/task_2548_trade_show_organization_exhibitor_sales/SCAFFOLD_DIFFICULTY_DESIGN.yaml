            - "After resolving ob1: SponsorshipDeal.${deal_id}.fulfillment_status == PARTIAL and resolved_obligation_count == 1"
            - "After resolving ob1: SponsorshipDeal.${deal_id}.fulfillment_credited == false"
            - "After resolving ob1: Exhibitor.${ex1}.sponsorship_fulfillment_points == 0 and provisional_priority_points == 591 and priority_tier == SILVER"
            - "After resolving ob2: FulfillmentObligation.${ob2}.status == DELIVERED"
            - "After resolving ob2: SponsorshipDeal.${deal_id}.fulfillment_status == COMPLETE and resolved_obligation_count == 2"
