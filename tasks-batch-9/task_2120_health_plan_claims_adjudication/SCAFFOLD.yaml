# =============================================================================
# Task 2120 — Health Plan Claims Adjudication Engine
# Seed tables §1.0–§1.7 (SCAFFOLD.yaml)
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2120. Health Plan Claims Adjudication Engine
  (health insurer claims operations): claim intake (837) & duplicate detection, member
  eligibility & benefit accumulator application, provider contract pricing & fee schedule
  lookup, edit/audit rules & code bundling logic, authorization matching & medical policy
  application, COB order & other-payer payment integration, pend/deny reason coding &
  remittance generation, adjustment/reprocessing cycles

domain_name: health-plan-claims-adjudication
api_prefix: /adjudication

# =============================================================================
# Step 0 — Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /adjudication/<collection>.
  # Relationships are expressed with foreign keys in request/response bodies,
  # never by nesting resource ids in URL paths beyond one sub-resource hop.

  state_machine_shape: cyclic
  # Claim.status carries a PENDED self-loop and an ADJUDICATED -> RECEIVED
  # reprocessing edge; Claim also carries a second, independent payment_status
  # dimension (parallel); ClaimLine.line_status is a branching fork with a
  # divergent side-effect set per branch; Authorization.status cycles
  # EXHAUSTED -> PARTIALLY_CONSUMED when consuming lines are reversed.

  relationship_patterns:
    - one_to_many          # Claim -> ClaimLine, Member -> MemberCoverage
    - self_referential     # Claim.original_claim_id -> Claim.id, Claim.duplicate_of_claim_id -> Claim.id
    - cross_aggregate      # ClaimLine -> Authorization, Claim -> MemberCoverage
    - polymorphic: false

  role_model: segregation_of_duties
  # The MedicalDirector who releases or converts a pend MUST NOT be the same
  # X-User-ID that produced the pend by running adjudication.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BenefitPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Externally visible plan identifier; unique across all BenefitPlan rows" }
      - { name: name, type: string, source: input, description: "Human readable plan name" }
      - { name: plan_year_start_date, type: string, source: input, default: "2026-01-01", description: "ISO date (YYYY-MM-DD) on which the plan year opens; the calendar year of a ClaimLine.service_date selects the BenefitAccumulator.plan_year" }
      - { name: deductible_individual_cents, type: integer, source: input, description: "Individual annual deductible in cents", constraints: ">= 0" }
      - { name: oop_max_individual_cents, type: integer, source: input, description: "Individual annual out-of-pocket maximum in cents", constraints: ">= 0" }
      - { name: coinsurance_member_pct, type: number, source: input, description: "Member coinsurance share applied after deductible, e.g. 0.20", constraints: "0 <= v <= 1" }
      - { name: copay_office_visit_cents, type: integer, source: input, default: 2500, description: "Flat copay applied instead of deductible for procedure codes in COPAY_PROCEDURE_CODES", constraints: ">= 0" }
      - { name: out_of_network_penalty_pct, type: number, source: input, default: 0.30, description: "Allowed-amount reduction applied when the billing Provider.network_status is OUT_OF_NETWORK and no ACTIVE ProviderContract prices the line", constraints: "0 <= v <= 1" }
      - { name: timely_filing_days, type: integer, source: input, default: 90, description: "Maximum whole days between Claim.statement_to_date and Claim.received_at", constraints: ">= 1" }
      - { name: cob_method, type: enum, source: input, default: "COME_OUT_WHOLE", description: "COME_OUT_WHOLE | NON_DUPLICATION — selects the variant of calculations.cob_secondary_plan_payment", constraints: "COME_OUT_WHOLE | NON_DUPLICATION" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: member_number, type: string, source: input, description: "Subscriber-facing member number; unique across all Member rows" }
      - { name: plan_id, type: string, source: input, description: "FK -> BenefitPlan.id; the benefit plan whose constants price and cost-share this member's claims" }
      - { name: first_name, type: string, source: input, default: "Given", description: "Member first name" }
      - { name: last_name, type: string, source: input, default: "Family", description: "Member last name" }
      - { name: date_of_birth, type: string, source: input, default: "1980-01-01", description: "ISO date of birth" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | TERMINATED — TERMINATED when no MemberCoverage segment contains the current logical clock date; returns to ACTIVE when such a segment is created", constraints: "ACTIVE | TERMINATED" }

  - name: MemberCoverage
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; taken from the path, never from the body" }
      - { name: effective_date, type: string, source: input, description: "ISO date; INCLUSIVE start of the half-open coverage interval [effective_date, term_date)" }
      - { name: term_date, type: string, source: input, default: null, description: "ISO date or null; EXCLUSIVE end of the half-open coverage interval. null means open-ended" }
      - { name: cob_order, type: enum, source: input, description: "PRIMARY | SECONDARY | TERTIARY — this plan's position in the coordination-of-benefits order for the member", constraints: "PRIMARY | SECONDARY | TERTIARY" }
      - { name: other_payer_name, type: string, source: input, default: null, description: "Name of the payer that sits ahead of this plan in the COB order" }
      - { name: coverage_tier, type: enum, source: input, default: "INDIVIDUAL", description: "INDIVIDUAL | FAMILY", constraints: "INDIVIDUAL | FAMILY" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | TERMINATED", constraints: "ACTIVE | TERMINATED" }

  - name: BenefitAccumulator
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the member whose year-to-date benefit usage this row tracks" }
      - { name: plan_year, type: integer, source: system, description: "Calendar year this accumulator covers; created with the year of BenefitPlan.plan_year_start_date at Member creation and lazily for other years at finalize" }
      - { name: deductible_applied_cents, type: integer, source: computed, default: 0, description: "Year-to-date deductible dollars consumed; equals the sum of Claim.total_deductible_applied_cents over Claims with payment_status == REMITTED plus all manual accumulator adjustment deltas", constraints: ">= 0" }
      - { name: oop_applied_cents, type: integer, source: computed, default: 0, description: "Year-to-date out-of-pocket dollars consumed; equals the sum of Claim.total_member_liability_cents over Claims with payment_status == REMITTED plus all manual accumulator adjustment deltas", constraints: ">= 0" }
      - { name: remitted_claim_count, type: integer, source: computed, default: 0, description: "Number of Claims with payment_status == REMITTED that posted into this accumulator", constraints: ">= 0" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National provider identifier" }
      - { name: name, type: string, source: input, description: "Provider display name" }
      - { name: network_status, type: enum, source: input, description: "IN_NETWORK | OUT_OF_NETWORK — drives the out-of-network penalty in the FEE_SCHEDULE_PRICED variant", constraints: "IN_NETWORK | OUT_OF_NETWORK" }
      - { name: specialty_code, type: string, source: input, default: "GEN", description: "Provider specialty code" }

  - name: ProviderContract
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the contracted provider" }
      - { name: plan_id, type: string, source: input, description: "FK -> BenefitPlan.id; the plan the contract prices for" }
      - { name: effective_date, type: string, source: input, description: "ISO date; INCLUSIVE start of the closed contract interval [effective_date, term_date]" }
      - { name: term_date, type: string, source: input, description: "ISO date; INCLUSIVE end of the closed contract interval [effective_date, term_date]" }
      - { name: pricing_method, type: enum, source: input, description: "PCT_OF_FEE_SCHEDULE | CASE_RATE", constraints: "PCT_OF_FEE_SCHEDULE | CASE_RATE" }
      - { name: contract_pct, type: number, source: input, default: null, description: "Multiplier applied to the fee schedule allowed amount; REQUIRED when pricing_method == PCT_OF_FEE_SCHEDULE", constraints: "0 < v <= 5" }
      - { name: case_rate_cents, type: integer, source: input, default: null, description: "Flat claim-level allowed amount; REQUIRED when pricing_method == CASE_RATE", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | TERMINATED", constraints: "DRAFT | ACTIVE | TERMINATED" }

  - name: FeeScheduleRate
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> BenefitPlan.id; taken from the path, never from the body" }
      - { name: procedure_code, type: string, source: input, description: "Procedure code this rate prices" }
      - { name: allowed_amount_cents, type: integer, source: input, description: "Per-unit allowed amount in cents", constraints: ">= 0" }
      - { name: effective_date, type: string, source: input, description: "ISO date; the rate applies to service dates on or after this date" }

  - name: EditRule
    parent: null
    common_fields: true
    fields:
      - { name: rule_code, type: string, source: input, description: "Operator-facing edit rule code" }
      - { name: edit_type, type: enum, source: input, description: "BUNDLING | MUTUALLY_EXCLUSIVE | UNITS_LIMIT | AUTH_REQUIRED", constraints: "BUNDLING | MUTUALLY_EXCLUSIVE | UNITS_LIMIT | AUTH_REQUIRED" }
      - { name: primary_code, type: string, source: input, description: "Procedure code that keys the rule; for BUNDLING and MUTUALLY_EXCLUSIVE this is the surviving code" }
      - { name: secondary_code, type: string, source: input, default: null, description: "Procedure code that is bundled away or knocked out; REQUIRED for BUNDLING and MUTUALLY_EXCLUSIVE" }
      - { name: max_units, type: integer, source: input, default: null, description: "Maximum units allowed on one line; REQUIRED for UNITS_LIMIT", constraints: ">= 1" }
      - { name: severity, type: enum, source: input, description: "DENY | PEND | INFORM", constraints: "DENY | PEND | INFORM" }
      - { name: precedence_rank, type: integer, source: input, description: "Lower value wins. DENY-severity rules with precedence_rank <= HARD_DENY_RANK_MAX are hard denials that outrank every pend", constraints: ">= 1" }
      - { name: reason_code, type: string, source: input, description: "Reason code stamped onto ClaimLine.edit_reason_code and, when the rule wins claim-level resolution, onto Claim.deny_reason_code or Claim.pend_reason_code" }

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member the authorization is issued for" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the provider the authorization is issued to" }
      - { name: procedure_code, type: string, source: input, description: "Procedure code the authorization covers" }
      - { name: authorized_units, type: integer, source: input, description: "Total units granted", constraints: ">= 1" }
      - { name: units_consumed, type: integer, source: computed, default: 0, description: "Units currently held by ClaimLines with line_status IN {PRICED, PAID}", constraints: "0 <= v <= authorized_units" }
      - { name: valid_from, type: string, source: input, description: "ISO date; INCLUSIVE start of the closed authorization interval [valid_from, valid_to]" }
      - { name: valid_to, type: string, source: input, description: "ISO date; INCLUSIVE end of the closed authorization interval [valid_from, valid_to]" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PARTIALLY_CONSUMED | EXHAUSTED | REVOKED", constraints: "ACTIVE | PARTIALLY_CONSUMED | EXHAUSTED | REVOKED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: claim_number, type: string, source: input, description: "Submitter-assigned 837 claim control number; unique across all Claim rows" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the patient the claim is billed for" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the billing provider" }
      - { name: coverage_id, type: string, source: computed, default: null, description: "FK -> MemberCoverage.id; the coverage segment matched at intake by calculations.coverage_segment_match" }
      - { name: original_claim_id, type: string, source: system, default: null, description: "FK -> Claim.id; the FINALIZED claim this ADJUSTMENT replaces; null for ORIGINAL claims" }
      - { name: duplicate_of_claim_id, type: string, source: computed, default: null, description: "FK -> Claim.id; the earlier claim this submission duplicates per calculations.duplicate_detection" }
      - { name: claim_type, type: enum, source: system, default: "ORIGINAL", description: "ORIGINAL | ADJUSTMENT", constraints: "ORIGINAL | ADJUSTMENT" }
      - { name: statement_from_date, type: string, source: input, default: null, description: "ISO date; defaults to the minimum ClaimLine.service_date on the claim when omitted" }
      - { name: statement_to_date, type: string, source: input, default: null, description: "ISO date; defaults to the maximum ClaimLine.service_date on the claim when omitted" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock value at intake, ISO 8601 UTC with three fractional digits" }
      - { name: other_payer_paid_cents, type: integer, source: input, default: null, description: "Amount already paid by the payer ahead of this plan in the COB order; null means not yet reported", constraints: ">= 0" }
      - { name: cob_role, type: enum, source: computed, default: "PRIMARY", description: "PRIMARY | SECONDARY — PRIMARY when the matched MemberCoverage.cob_order is PRIMARY, SECONDARY when it is SECONDARY or TERTIARY", constraints: "PRIMARY | SECONDARY" }
      - { name: pricing_variant, type: enum, source: computed, default: "UNPRICED", description: "UNPRICED | CONTRACT_PRICED | FEE_SCHEDULE_PRICED | CASE_RATE_PRICED — which variant of calculations.line_allowed_amount priced the claim", constraints: "UNPRICED | CONTRACT_PRICED | FEE_SCHEDULE_PRICED | CASE_RATE_PRICED" }
      - { name: total_billed_cents, type: integer, source: computed, default: 0, description: "Sum of ClaimLine.billed_amount_cents over all lines" }
      - { name: total_allowed_cents, type: integer, source: computed, default: 0, description: "Sum of the per-line rounded ClaimLine.allowed_amount_cents over lines with line_status IN {PRICED, PAID}" }
      - { name: total_deductible_applied_cents, type: integer, source: computed, default: 0, description: "Sum of ClaimLine.deductible_applied_cents over lines with line_status IN {PRICED, PAID}" }
      - { name: total_member_liability_cents, type: integer, source: computed, default: 0, description: "Sum of ClaimLine.member_liability_cents over lines with line_status IN {PRICED, PAID}, after the OOP cap reconciliation and the COB offset" }
      - { name: total_plan_paid_cents, type: integer, source: computed, default: 0, description: "Sum of ClaimLine.plan_paid_cents over lines with line_status IN {PRICED, PAID}, after the OOP cap reconciliation and the COB offset" }
      - { name: pend_reason_code, type: string, source: computed, default: null, description: "Reason code carried when status == PENDED; cleared on every re-adjudication pass" }
      - { name: deny_reason_code, type: string, source: computed, default: null, description: "Reason code carried when status == DENIED or DUPLICATE_REJECTED; cleared on every re-adjudication pass" }
      - { name: adjudication_pass, type: integer, source: system, default: 0, description: "Number of completed adjudication passes; incremented by every POST /adjudication/claims/{id}/adjudicate that runs the pipeline" }
      - { name: last_adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the actor whose adjudication pass produced the current status; the segregation-of-duties check compares the overriding MedicalDirector against this value" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | PENDED | ADJUDICATED | DENIED | FINALIZED | ADJUSTED | VOIDED | DUPLICATE_REJECTED", constraints: "RECEIVED | PENDED | ADJUDICATED | DENIED | FINALIZED | ADJUSTED | VOIDED | DUPLICATE_REJECTED" }
      - { name: payment_status, type: enum, source: system, default: "NOT_REMITTED", description: "NOT_REMITTED | REMITTED | REVERSED — an independent state dimension that evolves separately from status", constraints: "NOT_REMITTED | REMITTED | REVERSED" }

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim this service line belongs to" }
      - { name: line_number, type: integer, source: input, description: "1-based ordinal within the claim; the canonical tie-break key for every order-sensitive rule", constraints: ">= 1" }
      - { name: procedure_code, type: string, source: input, description: "Billed procedure code" }
      - { name: modifier_code, type: string, source: input, default: null, description: "Optional procedure modifier; normalised to the empty string for duplicate matching" }
      - { name: units, type: integer, source: input, description: "Billed units", constraints: ">= 1" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Provider charge in cents", constraints: ">= 0" }
      - { name: service_date, type: string, source: input, description: "ISO date the service was rendered" }
      - { name: allowed_amount_cents, type: integer, source: computed, default: 0, description: "Per-line allowed amount from calculations.line_allowed_amount, already rounded" }
      - { name: deductible_applied_cents, type: integer, source: computed, default: 0, description: "Deductible dollars consumed by this line" }
      - { name: copay_cents, type: integer, source: computed, default: 0, description: "Flat copay charged on this line" }
      - { name: coinsurance_cents, type: integer, source: computed, default: 0, description: "Coinsurance charged on this line" }
      - { name: member_liability_cents, type: integer, source: computed, default: 0, description: "copay_cents + deductible_applied_cents + coinsurance_cents, after OOP cap relief and COB offset" }
      - { name: plan_paid_cents, type: integer, source: computed, default: 0, description: "allowed_amount_cents - member_liability_cents - the line's share of other-payer payment" }
      - { name: authorization_id, type: string, source: computed, default: null, description: "FK -> Authorization.id; the authorization matched by calculations.claim_outcome_resolution for this line" }
      - { name: bundled_into_line_number, type: integer, source: computed, default: null, description: "line_number of the surviving line this line was bundled into" }
      - { name: edit_reason_code, type: string, source: computed, default: null, description: "EditRule.reason_code of the edit that set this line's non-PRICED outcome" }
      - { name: line_status, type: enum, source: system, default: "PENDING", description: "PENDING | PRICED | PENDED | DENIED | BUNDLED | PAID | REVERSED", constraints: "PENDING | PRICED | PENDED | DENIED | BUNDLED | PAID | REVERSED" }

  - name: RemittanceAdvice
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim this remittance reports" }
      - { name: remit_number, type: string, source: system, description: "Deterministic remittance number, formatted RA-<claim_number>-<n> where n is the 1-based count of remittances previously issued for the claim" }
      - { name: total_allowed_cents, type: integer, source: computed, description: "Snapshot of Claim.total_allowed_cents at issue" }
      - { name: total_plan_paid_cents, type: integer, source: computed, description: "Snapshot of Claim.total_plan_paid_cents at issue" }
      - { name: total_member_liability_cents, type: integer, source: computed, description: "Snapshot of Claim.total_member_liability_cents at issue" }
      - { name: total_other_payer_paid_cents, type: integer, source: computed, description: "Snapshot of Claim.other_payer_paid_cents at issue, 0 when null" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock value at issue" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | VOIDED", constraints: "ISSUED | VOIDED" }

  - name: AdjudicationEvent
    parent: null
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim whose lifecycle this append-only event records" }
      - { name: pass_number, type: integer, source: system, description: "Claim.adjudication_pass at the moment the event was appended" }
      - { name: event_type, type: enum, source: system, description: "INTAKE | DUPLICATE_REJECT | ADJUDICATE | OVERRIDE | FINALIZE | VOID | ADJUST | COB_POST | ELIG_REPEND", constraints: "INTAKE | DUPLICATE_REJECT | ADJUDICATE | OVERRIDE | FINALIZE | VOID | ADJUST | COB_POST | ELIG_REPEND" }
      - { name: from_status, type: string, source: system, description: "Claim.status before the event" }
      - { name: to_status, type: string, source: system, description: "Claim.status after the event" }
      - { name: reason_code, type: string, source: system, default: null, description: "pend_reason_code or deny_reason_code stamped by the event, null when none" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the caller, or the literal system for automatic transitions" }
      - { name: actor_user_id, type: string, source: system, default: null, description: "X-User-ID of the caller, null for automatic transitions" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock value when the event was appended" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Claim.status — cyclic (PENDED self-loop, ADJUDICATED -> RECEIVED reprocess)
  # ---------------------------------------------------------------------------
  - entity: Claim
    state_field: status
    initial_state: RECEIVED
    terminal_states: [VOIDED, ADJUSTED, DUPLICATE_REJECTED]
    transitions:
      - from: RECEIVED
        to: DUPLICATE_REJECTED
        trigger: "POST /adjudication/claims (automatic at intake when calculations.duplicate_detection finds a match)"
        actor: system
        preconditions:
          - "claim_type == ORIGINAL"
          - "calculations.duplicate_detection returns a non-null duplicate_of_claim_id"
        side_effects:
          - "sets Claim.duplicate_of_claim_id to the matched claim id"
          - "sets Claim.deny_reason_code = DENY_DUPLICATE"
          - "appends an AdjudicationEvent with event_type = DUPLICATE_REJECT, pass_number = 0"
        note: "The rejected claim is persisted so that duplicate_of_claim_id is auditable; it never prices and never posts to any accumulator."

      - from: RECEIVED
        to: ADJUDICATED
        trigger: "POST /adjudication/claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "every ClaimLine resolves to line_status PRICED, BUNDLED or DENIED and at least one line is PRICED"
          - "calculations.claim_outcome_resolution selects outcome ADJUDICATED"
        side_effects:
          - "runs calculations.line_allowed_amount, then calculations.line_member_cost_share, then calculations.oop_cap_reconciliation, then calculations.cob_secondary_plan_payment"
          - "writes Claim.total_allowed_cents, Claim.total_deductible_applied_cents, Claim.total_member_liability_cents, Claim.total_plan_paid_cents, Claim.pricing_variant"
          - "increments Claim.adjudication_pass by 1 and sets Claim.last_adjudicated_by_user_id to the caller's X-User-ID"
          - "for each line that reached PRICED with a non-null authorization_id, increases Authorization.units_consumed by ClaimLine.units"
          - "appends an AdjudicationEvent with event_type = ADJUDICATE"

      - from: RECEIVED
        to: PENDED
        trigger: "POST /adjudication/claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "calculations.claim_outcome_resolution selects outcome PENDED"
        side_effects:
          - "sets Claim.pend_reason_code to the winning pend reason and clears Claim.deny_reason_code"
          - "increments Claim.adjudication_pass by 1 and sets Claim.last_adjudicated_by_user_id"
          - "leaves Claim.total_plan_paid_cents at 0 and does not touch any BenefitAccumulator"
          - "appends an AdjudicationEvent with event_type = ADJUDICATE"

      - from: RECEIVED
        to: DENIED
        trigger: "POST /adjudication/claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "calculations.claim_outcome_resolution selects outcome DENIED"
        side_effects:
          - "sets Claim.deny_reason_code to the winning deny reason and clears Claim.pend_reason_code"
          - "increments Claim.adjudication_pass by 1 and sets Claim.last_adjudicated_by_user_id"
          - "appends an AdjudicationEvent with event_type = ADJUDICATE"

      - from: PENDED
        to: PENDED
        trigger: "POST /adjudication/claims/{id}/adjudicate (re-adjudication pass that still resolves to PENDED)"
        actor: ClaimsExaminer
        preconditions:
          - "calculations.claim_outcome_resolution still selects outcome PENDED"
        side_effects:
          - "resets every ClaimLine.line_status to PENDING and releases the units each PRICED line held on its Authorization before re-running the pipeline"
          - "recomputes Claim.pend_reason_code, which MAY differ from the previous pass"
          - "increments Claim.adjudication_pass by 1"
          - "appends an AdjudicationEvent with event_type = ADJUDICATE"
        note: "Self-loop; this is the reprocessing cycle for pended claims."

      - from: PENDED
        to: ADJUDICATED
        trigger: "POST /adjudication/claims/{id}/adjudicate (re-adjudication pass after the pend cause was resolved)"
        actor: ClaimsExaminer
        preconditions:
          - "calculations.claim_outcome_resolution now selects outcome ADJUDICATED"
        side_effects:
          - "resets every ClaimLine.line_status to PENDING and releases previously held Authorization units, then re-runs the pipeline"
          - "clears Claim.pend_reason_code"
          - "increments Claim.adjudication_pass by 1 and sets Claim.last_adjudicated_by_user_id"
          - "appends an AdjudicationEvent with event_type = ADJUDICATE"

      - from: PENDED
        to: DENIED
        trigger: "POST /adjudication/claims/{id}/adjudicate (re-adjudication pass that now resolves to DENIED)"
        actor: ClaimsExaminer
        preconditions:
          - "calculations.claim_outcome_resolution now selects outcome DENIED"
        side_effects:
          - "resets every ClaimLine.line_status to PENDING and releases previously held Authorization units, then re-runs the pipeline"
          - "sets Claim.deny_reason_code and clears Claim.pend_reason_code"
          - "appends an AdjudicationEvent with event_type = ADJUDICATE"

      - from: PENDED
        to: ADJUDICATED
        trigger: "POST /adjudication/claims/{id}/override with decision = APPROVE"
        actor: MedicalDirector
        preconditions:
          - "Claim.status == PENDED"
          - "X-User-ID != Claim.last_adjudicated_by_user_id (segregation of duties)"
        side_effects:
          - "forces every ClaimLine with line_status PENDED to PRICED using calculations.line_allowed_amount and calculations.line_member_cost_share, bypassing the AUTH_REQUIRED edit"
          - "re-runs the authorization selector for each forced line while IGNORING both the REVOKED status filter and the remaining-units test, sets ClaimLine.authorization_id to the selected Authorization when one exists, and increases that Authorization.units_consumed by ClaimLine.units even when that drives units_consumed above authorized_units (the authorization then re-derives to EXHAUSTED)"
          - "clears Claim.pend_reason_code and recomputes the claim totals"
          - "appends an AdjudicationEvent with event_type = OVERRIDE"

      - from: PENDED
        to: DENIED
        trigger: "POST /adjudication/claims/{id}/override with decision = DENY"
        actor: MedicalDirector
        preconditions:
          - "Claim.status == PENDED"
          - "X-User-ID != Claim.last_adjudicated_by_user_id (segregation of duties)"
        side_effects:
          - "sets every ClaimLine with line_status PENDED to DENIED with edit_reason_code = the request's override_reason_code (default DENY_MEDICAL_POLICY)"
          - "sets Claim.deny_reason_code to the same code and clears Claim.pend_reason_code"
          - "zeroes Claim.total_allowed_cents, Claim.total_member_liability_cents and Claim.total_plan_paid_cents"
          - "appends an AdjudicationEvent with event_type = OVERRIDE"

      - from: ADJUDICATED
        to: RECEIVED
        trigger: "POST /adjudication/claims/{id}/other-payer-payment"
        actor: ClaimsIntake
        preconditions:
          - "Claim.status == ADJUDICATED"
          - "payload expected_claim_version equals Claim.version"
        side_effects:
          - "records the reported other_payer_paid_cents"
          - "resets every ClaimLine.line_status to PENDING, zeroes every per-line computed money field and releases the units each PRICED line held on its Authorization"
          - "zeroes Claim.total_allowed_cents, total_deductible_applied_cents, total_member_liability_cents, total_plan_paid_cents and clears pricing_variant back to UNPRICED"
          - "increments Claim.version by 1"
          - "appends an AdjudicationEvent with event_type = COB_POST"
        note: "Reprocessing cycle: a late other-payer payment invalidates the prior COB math, so the claim returns to RECEIVED and must be adjudicated again."

      - from: RECEIVED
        to: RECEIVED
        trigger: "POST /adjudication/claims/{id}/other-payer-payment"
        actor: ClaimsIntake
        preconditions:
          - "Claim.status == RECEIVED"
          - "payload expected_claim_version equals Claim.version"
        side_effects:
          - "overwrites Claim.other_payer_paid_cents; nothing else changes because the claim has not priced yet"
          - "increments Claim.version by 1"
          - "appends an AdjudicationEvent with event_type = COB_POST"
        note: "Self-loop; COB posting is a legitimately repeatable supersede operation, which is why it is guarded by OCC rather than by a state precondition."

      - from: PENDED
        to: PENDED
        trigger: "POST /adjudication/claims/{id}/other-payer-payment"
        actor: ClaimsIntake
        preconditions:
          - "Claim.status == PENDED"
          - "payload expected_claim_version equals Claim.version"
        side_effects:
          - "overwrites Claim.other_payer_paid_cents; the claim stays PENDED until the next adjudication pass runs"
          - "increments Claim.version by 1"
          - "appends an AdjudicationEvent with event_type = COB_POST"
        note: "The accepted statuses for COB posting are exactly {RECEIVED, PENDED, ADJUDICATED}; any other status is rejected with ERR_INVALID_CLAIM_STATE."

      - from: ADJUDICATED
        to: FINALIZED
        trigger: "POST /adjudication/claims/{id}/finalize"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.status == ADJUDICATED"
        side_effects:
          - "creates one RemittanceAdvice with status ISSUED snapshotting the claim totals"
          - "sets Claim.payment_status from NOT_REMITTED to REMITTED"
          - "adds Claim.total_deductible_applied_cents to BenefitAccumulator.deductible_applied_cents and Claim.total_member_liability_cents to BenefitAccumulator.oop_applied_cents for (member_id, plan_year of the earliest ClaimLine.service_date), creating the accumulator row when it does not exist"
          - "increments BenefitAccumulator.remitted_claim_count by 1"
          - "flips every ClaimLine with line_status PRICED to PAID"
          - "appends an AdjudicationEvent with event_type = FINALIZE"

      - from: DENIED
        to: FINALIZED
        trigger: "POST /adjudication/claims/{id}/finalize"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.status == DENIED"
        side_effects:
          - "creates one zero-pay RemittanceAdvice with status ISSUED and total_plan_paid_cents = 0"
          - "sets Claim.payment_status from NOT_REMITTED to REMITTED"
          - "does NOT change any BenefitAccumulator field and does NOT increment remitted_claim_count"
          - "appends an AdjudicationEvent with event_type = FINALIZE"

      - from: FINALIZED
        to: VOIDED
        trigger: "POST /adjudication/claims/{id}/void"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.status == FINALIZED"
        side_effects:
          - "HOP 1: Claim.status becomes VOIDED"
          - "HOP 2: because Claim.status became VOIDED, Claim.payment_status flips REMITTED -> REVERSED"
          - "HOP 3: because Claim.payment_status became REVERSED, the claim's RemittanceAdvice rows with status ISSUED flip to VOIDED and the accumulator deltas those remittances posted are subtracted (deductible_applied_cents -= Claim.total_deductible_applied_cents, oop_applied_cents -= Claim.total_member_liability_cents, remitted_claim_count -= 1)"
          - "HOP 4: because the RemittanceAdvice became VOIDED, every ClaimLine with line_status PAID flips to REVERSED"
          - "HOP 5: because a ClaimLine flipped to REVERSED, its linked Authorization.units_consumed decreases by ClaimLine.units"
          - "HOP 6: because Authorization.units_consumed decreased, Authorization.status is re-derived — EXHAUSTED -> PARTIALLY_CONSUMED when 0 < units_consumed < authorized_units, and PARTIALLY_CONSUMED -> ACTIVE when units_consumed reaches 0"
          - "appends an AdjudicationEvent with event_type = VOID"

      - from: FINALIZED
        to: ADJUSTED
        trigger: "POST /adjudication/claims/{id}/adjustments"
        actor: ClaimsExaminer
        preconditions:
          - "Claim.status == FINALIZED"
          - "Claim.claim_type == ORIGINAL"
        side_effects:
          - "HOP 1: the original Claim.status becomes ADJUSTED"
          - "HOP 2: because the original became ADJUSTED, its payment_status flips REMITTED -> REVERSED"
          - "HOP 3: because payment_status became REVERSED, its RemittanceAdvice rows with status ISSUED flip to VOIDED and the accumulator deltas are subtracted exactly as in the void cascade"
          - "HOP 4: because the RemittanceAdvice became VOIDED, every ClaimLine with line_status PAID flips to REVERSED and releases its Authorization units, re-deriving Authorization.status"
          - "creates a new Claim with claim_type = ADJUSTMENT, original_claim_id = the original claim id, status RECEIVED, payment_status NOT_REMITTED and the submitted replacement lines"
          - "appends an AdjudicationEvent with event_type = ADJUST on the original claim"

  # ---------------------------------------------------------------------------
  # Claim.payment_status — parallel state dimension on the same row
  # ---------------------------------------------------------------------------
  - entity: Claim
    state_field: payment_status
    initial_state: NOT_REMITTED
    terminal_states: [REVERSED]
    transitions:
      - from: NOT_REMITTED
        to: REMITTED
        trigger: "POST /adjudication/claims/{id}/finalize"
        actor: ClaimsExaminer
        preconditions: ["Claim.status IN {ADJUDICATED, DENIED}"]
        side_effects: ["a RemittanceAdvice row is created with status ISSUED"]
        note: "Evolves independently of Claim.status: a claim can be RECEIVED->PENDED->ADJUDICATED many times while payment_status stays NOT_REMITTED."
      - from: REMITTED
        to: REVERSED
        trigger: "POST /adjudication/claims/{id}/void or POST /adjudication/claims/{id}/adjustments"
        actor: ClaimsExaminer
        preconditions: ["Claim.status transitions FINALIZED -> VOIDED or FINALIZED -> ADJUSTED"]
        side_effects: ["every RemittanceAdvice with status ISSUED for this claim flips to VOIDED"]

  # ---------------------------------------------------------------------------
  # ClaimLine.line_status — branching fork with a divergent side-effect set per branch
  # ---------------------------------------------------------------------------
  - entity: ClaimLine
    state_field: line_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: PRICED
        trigger: "POST /adjudication/claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "a FeeScheduleRate exists for (member's plan_id, procedure_code) with effective_date <= service_date"
          - "no BUNDLING, MUTUALLY_EXCLUSIVE or UNITS_LIMIT EditRule knocks the line out"
          - "if an AUTH_REQUIRED EditRule matches procedure_code, calculations.claim_outcome_resolution matched an Authorization with status IN {ACTIVE, PARTIALLY_CONSUMED} whose closed interval contains service_date and whose remaining units >= ClaimLine.units"
        side_effects:
          - "writes allowed_amount_cents, deductible_applied_cents, copay_cents, coinsurance_cents, member_liability_cents and plan_paid_cents"
          - "sets authorization_id when an AUTH_REQUIRED edit matched and increases that Authorization.units_consumed by ClaimLine.units"
      - from: PENDING
        to: BUNDLED
        trigger: "POST /adjudication/claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "a BUNDLING EditRule exists whose secondary_code == this line's procedure_code and whose primary_code appears on another line of the same claim with the same service_date"
        side_effects:
          - "sets allowed_amount_cents = 0, member_liability_cents = 0 and plan_paid_cents = 0"
          - "sets bundled_into_line_number to the surviving line's line_number and edit_reason_code to the rule's reason_code"
          - "consumes NO Authorization units"
      - from: PENDING
        to: DENIED
        trigger: "POST /adjudication/claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "a MUTUALLY_EXCLUSIVE or UNITS_LIMIT EditRule with severity DENY knocks the line out, or no FeeScheduleRate prices the line"
        side_effects:
          - "sets allowed_amount_cents = 0 and edit_reason_code to the rule's reason_code (or DENY_NON_COVERED_SERVICE when no rate exists)"
          - "leaves bundled_into_line_number null and consumes NO Authorization units"
      - from: PENDING
        to: PENDED
        trigger: "POST /adjudication/claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "an AUTH_REQUIRED EditRule matches and no Authorization satisfies the match, or the matched Authorization.status == REVOKED, or its remaining units < ClaimLine.units"
        side_effects:
          - "sets allowed_amount_cents = 0 and edit_reason_code to the DERIVED authorization outcome code — PEND_AUTH_MISSING, PEND_AUTH_REVOKED or PEND_AUTH_UNITS_EXCEEDED — and NOT to the EditRule's own reason_code"
          - "consumes NO Authorization units and leaves authorization_id null"
      - from: PRICED
        to: PAID
        trigger: "POST /adjudication/claims/{id}/finalize"
        actor: ClaimsExaminer
        preconditions: ["parent Claim.status transitions ADJUDICATED -> FINALIZED"]
        side_effects: ["the line's money fields are frozen and snapshotted into the RemittanceAdvice totals"]
      - from: PRICED
        to: PENDING
        trigger: "POST /adjudication/claims/{id}/adjudicate (re-adjudication) or POST /adjudication/claims/{id}/other-payer-payment"
        actor: ClaimsExaminer
        preconditions: ["parent Claim.status IN {PENDED, ADJUDICATED} and a new pass is starting"]
        side_effects: ["zeroes every per-line computed money field and releases ClaimLine.units back to the linked Authorization, then clears authorization_id"]
      - from: PENDED
        to: PENDING
        trigger: "POST /adjudication/claims/{id}/adjudicate (re-adjudication)"
        actor: ClaimsExaminer
        preconditions: ["parent Claim.status == PENDED and a new pass is starting"]
        side_effects: ["clears edit_reason_code"]
      - from: PENDED
        to: PRICED
        trigger: "POST /adjudication/claims/{id}/override with decision = APPROVE"
        actor: MedicalDirector
        preconditions: ["parent Claim.status == PENDED and the override decision is APPROVE"]
        side_effects: ["prices the line; when the override authorization selector finds an Authorization, sets authorization_id and increases its units_consumed by ClaimLine.units, otherwise leaves authorization_id null and consumes nothing"]
      - from: PENDED
        to: DENIED
        trigger: "POST /adjudication/claims/{id}/override with decision = DENY"
        actor: MedicalDirector
        preconditions: ["parent Claim.status == PENDED and the override decision is DENY"]
        side_effects: ["sets edit_reason_code to the override_reason_code"]
      - from: PAID
        to: REVERSED
        trigger: "POST /adjudication/claims/{id}/void or POST /adjudication/claims/{id}/adjustments"
        actor: ClaimsExaminer
        preconditions: ["the claim's RemittanceAdvice flipped ISSUED -> VOIDED"]
        side_effects: ["releases ClaimLine.units back to the linked Authorization, which re-derives Authorization.status"]
      - from: PRICED
        to: PENDED
        trigger: "POST /adjudication/coverages/{id}/terminate (automatic eligibility re-pend cascade)"
        actor: system
        preconditions: ["the parent Claim was re-pended by the coverage-termination cascade"]
        side_effects: ["sets edit_reason_code = PEND_ELIG_REVIEW, zeroes the money fields and releases the line's Authorization units"]

  # ---------------------------------------------------------------------------
  # Authorization.status — cyclic (EXHAUSTED can return to PARTIALLY_CONSUMED)
  # ---------------------------------------------------------------------------
  - entity: Authorization
    state_field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: PARTIALLY_CONSUMED
        trigger: "system (re-derived whenever units_consumed changes)"
        actor: system
        preconditions: ["0 < units_consumed < authorized_units"]
        side_effects: []
      - from: PARTIALLY_CONSUMED
        to: EXHAUSTED
        trigger: "system (re-derived whenever units_consumed changes)"
        actor: system
        preconditions: ["units_consumed >= authorized_units"]
        side_effects: ["subsequent claim lines matching this authorization pend with PEND_AUTH_UNITS_EXCEEDED"]
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (re-derived when a single pass consumes the whole grant)"
        actor: system
        preconditions: ["units_consumed >= authorized_units"]
        side_effects: []
      - from: EXHAUSTED
        to: PARTIALLY_CONSUMED
        trigger: "system (re-derived when a consuming ClaimLine is reversed by void, adjustment, re-adjudication or the eligibility re-pend cascade)"
        actor: system
        preconditions: ["0 < units_consumed < authorized_units"]
        side_effects: []
        note: "Cycle: an exhausted authorization becomes usable again once the consuming lines are reversed."
      - from: PARTIALLY_CONSUMED
        to: ACTIVE
        trigger: "system (re-derived when all consuming ClaimLines are reversed)"
        actor: system
        preconditions: ["units_consumed == 0"]
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (re-derived when every consuming ClaimLine is reversed in one operation)"
        actor: system
        preconditions: ["units_consumed == 0"]
        side_effects: []
        note: "Cycle: a fully exhausted authorization returns all the way to ACTIVE when the single claim that consumed it is voided, adjusted or re-adjudicated."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /adjudication/authorizations/{id}/revoke"
        actor: UtilizationReviewer
        preconditions: ["Authorization.status IN {ACTIVE, PARTIALLY_CONSUMED}"]
        side_effects: ["ClaimLines that later match this authorization pend with PEND_AUTH_REVOKED instead of pricing"]
      - from: PARTIALLY_CONSUMED
        to: REVOKED
        trigger: "POST /adjudication/authorizations/{id}/revoke"
        actor: UtilizationReviewer
        preconditions: ["Authorization.status IN {ACTIVE, PARTIALLY_CONSUMED}"]
        side_effects: ["already-consumed units are NOT released; units_consumed is frozen at its current value"]

  # ---------------------------------------------------------------------------
  # ProviderContract.status — linear
  # ---------------------------------------------------------------------------
  - entity: ProviderContract
    state_field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /adjudication/contracts/{id}/activate"
        actor: NetworkManager
        preconditions:
          - "ProviderContract.status == DRAFT"
          - "pricing_method == PCT_OF_FEE_SCHEDULE implies contract_pct is not null; pricing_method == CASE_RATE implies case_rate_cents is not null"
        side_effects: ["claims adjudicated afterwards for this (provider_id, plan_id) with a service_date inside the closed contract interval price with the CONTRACT_PRICED or CASE_RATE_PRICED variant"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /adjudication/contracts/{id}/terminate"
        actor: NetworkManager
        preconditions: ["ProviderContract.status == ACTIVE"]
        side_effects:
          - "sets term_date to the supplied date"
          - "claims adjudicated afterwards fall back to the FEE_SCHEDULE_PRICED variant, which applies the out-of-network penalty when the provider is OUT_OF_NETWORK"

  # ---------------------------------------------------------------------------
  # MemberCoverage.status — linear, with the eligibility re-pend cascade
  # ---------------------------------------------------------------------------
  - entity: MemberCoverage
    state_field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /adjudication/coverages/{id}/terminate"
        actor: PlanAdmin
        preconditions:
          - "MemberCoverage.status == ACTIVE"
          - "the supplied term_date is >= effective_date"
        side_effects:
          - "HOP 1: MemberCoverage.status becomes TERMINATED and term_date is set to the supplied date"
          - "HOP 2: because the coverage terminated, every Claim whose coverage_id is this coverage, whose status IS IN {RECEIVED, PENDED, ADJUDICATED} and whose statement_from_date >= the new term_date moves to PENDED with pend_reason_code = PEND_ELIG_REVIEW"
          - "HOP 3: because those claims moved to PENDED, each of their ClaimLines with line_status PRICED flips to PENDED, zeroes its money fields and releases its held units back to the linked Authorization"
          - "HOP 4: because Authorization.units_consumed decreased, Authorization.status is re-derived (EXHAUSTED -> PARTIALLY_CONSUMED, PARTIALLY_CONSUMED -> ACTIVE at zero)"
          - "as a separate direct effect of HOP 1, Member.status becomes TERMINATED when no remaining MemberCoverage half-open interval contains the current logical clock date"
          - "appends an AdjudicationEvent with event_type = ELIG_REPEND on every re-pended claim"

  # ---------------------------------------------------------------------------
  # RemittanceAdvice.status — linear
  # ---------------------------------------------------------------------------
  - entity: RemittanceAdvice
    state_field: status
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /adjudication/claims/{id}/void or POST /adjudication/claims/{id}/adjustments"
        actor: ClaimsExaminer
        preconditions: ["the parent Claim.payment_status flipped REMITTED -> REVERSED"]
        side_effects: ["the accumulator deltas this remittance posted are subtracted from the member's BenefitAccumulator for the remittance's plan year"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's version only
# =============================================================================
concurrency_rules:
  - rule_id: cob-posting-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /adjudication/claims/{id}/other-payer-payment"
    occ_field: "expected_claim_version"
    description: |
      Posting an other-payer payment against a Claim whose version has advanced
      since the client last read it is rejected. Posting a COB amount is a
      legitimately repeatable supersede operation — a later posting overwrites
      the earlier reported amount and drives the claim back to RECEIVED — so the
      operation cannot be guarded by a state precondition alone. The stale
      expected_claim_version is what tells the server the client's view of the
      claim (its totals, its status, its prior COB figure) predates another
      writer's change.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: accumulator-adjustment-stale-accumulator
    parent_entity: BenefitAccumulator
    write_endpoint: "POST /adjudication/accumulators/{id}/adjustments"
    occ_field: "expected_accumulator_version"
    description: |
      Posting a manual accumulator delta against a BenefitAccumulator whose
      version has advanced since the client last read it is rejected. A delta
      posting is legitimately repeatable — the same request sent twice in strict
      sequence would post the delta twice, which is valid product behaviour — so
      no state precondition can distinguish an intended second posting from a
      posting computed against a stale balance. OCC on the accumulator version
      makes the stale case deterministically observable.
    error_id: ERR_STALE_ACCUMULATOR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: coverage_segment_match
    trigger: "POST /adjudication/claims (intake), and re-evaluated on every POST /adjudication/claims/{id}/adjudicate pass"
    algorithm: interval_merge
    formula: |
      earliest_service_date = min(ClaimLine.service_date over all lines of the claim)

      candidates = MemberCoverage rows where
          member_id == Claim.member_id
          AND effective_date <= earliest_service_date
          AND (term_date IS NULL OR term_date > earliest_service_date)   # half-open [effective_date, term_date)

      # ranking is over entity fields only; id never participates
      sort candidates by effective_date DESC, then created_at ASC
      matched = first(candidates)   # empty candidate set -> matched = null

      Claim.coverage_id = matched.id if matched else null
      Claim.cob_role    = "PRIMARY"   if matched is null or matched.cob_order == "PRIMARY"
                          else "SECONDARY"          # SECONDARY and TERTIARY both map to SECONDARY

      # Adjudication-time coverage gate (per line, same half-open arithmetic):
      line_is_covered(line) = EXISTS a MemberCoverage row for Claim.member_id with
          effective_date <= line.service_date AND (term_date IS NULL OR term_date > line.service_date)
      claim_has_coverage = AND over every line of line_is_covered(line)
    input_set: "All MemberCoverage rows of the claim's member regardless of status; the half-open date arithmetic alone decides containment, so a TERMINATED segment still covers service dates strictly before its term_date."
    constants: {}
    precision: "Whole calendar days; dates compared lexicographically as ISO YYYY-MM-DD"

  - name: duplicate_detection
    trigger: "POST /adjudication/claims (intake), before any pricing runs"
    algorithm: threshold
    formula: |
      # Only ORIGINAL claims are screened. ADJUSTMENT claims are exempt.
      if new_claim.claim_type != "ORIGINAL": return null

      prior = Claim rows where
          member_id   == new_claim.member_id
          AND provider_id == new_claim.provider_id
          AND claim_type  == "ORIGINAL"
          AND status  NOT IN {VOIDED, ADJUSTED, DUPLICATE_REJECTED}
          AND id      != new_claim.id

      matches(prior_claim) = EXISTS prior_line IN lines(prior_claim), EXISTS new_line IN lines(new_claim) such that
             prior_line.procedure_code               == new_line.procedure_code
         AND coalesce(prior_line.modifier_code, "")  == coalesce(new_line.modifier_code, "")
         AND prior_line.service_date                 == new_line.service_date
         AND prior_line.units                        == new_line.units
         AND abs(prior_line.billed_amount_cents - new_line.billed_amount_cents) <= DUP_BILLED_TOLERANCE_CENTS

      matched_set = [c for c in prior if matches(c)]
      sort matched_set by received_at ASC, then created_at ASC     # never by id
      return first(matched_set).id if matched_set else null
    input_set: "Prior Claim rows for the same (member_id, provider_id) with claim_type == ORIGINAL and status NOT IN {VOIDED, ADJUSTED, DUPLICATE_REJECTED}. Claims already in DUPLICATE_REJECTED never seed further duplicates."
    constants:
      DUP_BILLED_TOLERANCE_CENTS: 500
    precision: "Integer cents; the tolerance comparison is inclusive (<=), so a difference of exactly 500 cents IS a duplicate and 501 cents is NOT."

  - name: line_allowed_amount
    trigger: "POST /adjudication/claims/{id}/adjudicate and POST /adjudication/claims/{id}/override with decision = APPROVE; writes ClaimLine.allowed_amount_cents and Claim.total_allowed_cents / Claim.pricing_variant"
    algorithm: tiered_pricing
    formula: |
      plan     = BenefitPlan of the claim's Member
      provider = Provider of Claim.provider_id

      # --- fee schedule lookup (deterministic selector) -----------------------
      rate_candidates = FeeScheduleRate rows where
          plan_id == plan.id AND procedure_code == line.procedure_code
          AND effective_date <= line.service_date
      sort rate_candidates by effective_date DESC, then created_at ASC   # never by id
      rate = first(rate_candidates)
      if rate is null:
          line.line_status = "DENIED"; line.edit_reason_code = "DENY_NON_COVERED_SERVICE"
          line.allowed_amount_cents = 0; skip the rest for this line

      # --- contract lookup (deterministic selector) ---------------------------
      contract_candidates = ProviderContract rows where
          provider_id == Claim.provider_id AND plan_id == plan.id
          AND status == "ACTIVE"
          AND effective_date <= line.service_date <= term_date      # closed interval
      sort contract_candidates by effective_date DESC, then created_at ASC
      contract = first(contract_candidates)

      base = rate.allowed_amount_cents * line.units

      if contract is not null and contract.pricing_method == "PCT_OF_FEE_SCHEDULE":
          Claim.pricing_variant = "CONTRACT_PRICED"
          allowed = round_half_up(base * contract.contract_pct)
      elif contract is not null and contract.pricing_method == "CASE_RATE":
          Claim.pricing_variant = "CASE_RATE_PRICED"
          allowed = <supplied by calculations.case_rate_prorata_allocation>
      else:
          Claim.pricing_variant = "FEE_SCHEDULE_PRICED"
          if provider.network_status == "OUT_OF_NETWORK":
              allowed = round_half_up(base * (1 - plan.out_of_network_penalty_pct))
          else:
              allowed = base

      line.allowed_amount_cents = min(allowed, line.billed_amount_cents)

      # --- ROUNDING ORDER IS PINNED ------------------------------------------
      # Round EVERY line individually to whole cents FIRST, then sum:
      Claim.total_allowed_cents = SUM over lines with line_status IN {PRICED, PAID} of line.allowed_amount_cents
      # The alternative order (sum the un-rounded products, then round once) is
      # FORBIDDEN. Worked divergence: three lines each priced
      # 3333 cents x 1 unit x contract_pct 0.755 -> per-line 2516.415 -> 2516;
      # sum-then-round gives round_half_up(9999 * 0.755) = round_half_up(7549.245) = 7549,
      # whereas the pinned order gives 3 * 2516 = 7548.
    input_set: "ClaimLine rows of the claim whose line_status reached PRICED in this pass. BUNDLED, DENIED and PENDED lines contribute 0 and are excluded from Claim.total_allowed_cents."
    constants:
      ROUNDING_MODE: round_half_up
    precision: "Whole cents, round_half_up, applied per line before any summation"
    variants:
      - name: CONTRACT_PRICED
        when: "An ACTIVE ProviderContract with pricing_method PCT_OF_FEE_SCHEDULE covers (provider_id, plan_id) on the line's service_date"
        difference: "allowed = round_half_up(rate.allowed_amount_cents * units * contract.contract_pct); the out-of-network penalty is NEVER applied even when Provider.network_status is OUT_OF_NETWORK, because the contract supersedes network status"
      - name: FEE_SCHEDULE_PRICED
        when: "No ACTIVE ProviderContract covers the line's service_date"
        difference: "allowed = rate.allowed_amount_cents * units for IN_NETWORK providers, or round_half_up(that * (1 - plan.out_of_network_penalty_pct)) for OUT_OF_NETWORK providers"
      - name: CASE_RATE_PRICED
        when: "An ACTIVE ProviderContract with pricing_method CASE_RATE covers the line's service_date"
        difference: "the claim, not the line, is priced: Claim.total_allowed_cents = min(contract.case_rate_cents, Claim.total_billed_cents) and per-line amounts come from calculations.case_rate_prorata_allocation"

  - name: case_rate_prorata_allocation
    trigger: "Inside POST /adjudication/claims/{id}/adjudicate whenever the matched ProviderContract.pricing_method == CASE_RATE"
    algorithm: waterfall_allocation
    formula: |
      pool         = min(contract.case_rate_cents, SUM over pricing_lines of line.billed_amount_cents)
      total_billed = SUM over pricing_lines of line.billed_amount_cents
      # pricing_lines = lines that survived the edit pass (not BUNDLED, not DENIED, not PENDED)

      raw(line)   = pool * line.billed_amount_cents / total_billed        # exact rational, no rounding
      floor(line) = integer part of raw(line)
      remainder   = pool - SUM over pricing_lines of floor(line)

      # Largest-remainder distribution: order by fractional part DESC,
      # tie-break by line_number ASC (never by id). Hand out exactly one extra
      # cent to each of the first `remainder` lines in that order.
      line.allowed_amount_cents = floor(line) + (1 if the line is among the first `remainder` in that order else 0)

      # Worked example: case_rate_cents = 50000, three lines billed 30000 / 20000 / 10000
      # raw = 25000 / 16666.666... / 8333.333...; floors = 25000 / 16666 / 8333 (sum 49999);
      # remainder 1 goes to line 2 (largest fractional part 0.666) -> 25000 / 16667 / 8333.
    input_set: "Only lines that survived the edit pass. A BUNDLED or DENIED line contributes 0 to total_billed for the pro-rata split and receives 0."
    constants: {}
    precision: "Whole cents; floors plus a largest-remainder sweep guarantee the per-line amounts sum exactly to pool"

  - name: line_member_cost_share
    trigger: "POST /adjudication/claims/{id}/adjudicate and POST /adjudication/claims/{id}/override with decision = APPROVE, immediately after calculations.line_allowed_amount"
    algorithm: waterfall_allocation
    formula: |
      plan = BenefitPlan of the claim's Member
      acc  = BenefitAccumulator for (Claim.member_id, calendar year of the earliest ClaimLine.service_date)

      # SNAPSHOT ONCE, at the start of the pass. Never re-read mid-claim.
      ded_remaining = max(0, plan.deductible_individual_cents - acc.deductible_applied_cents)

      # Process lines in service_date ASC, then line_number ASC (never by id)
      for line in sorted(pricing_lines, key=(service_date ASC, line_number ASC)):
          if line.procedure_code IN COPAY_PROCEDURE_CODES:
              line.copay_cents             = min(plan.copay_office_visit_cents, line.allowed_amount_cents)
              line.deductible_applied_cents = 0
              base_after = line.allowed_amount_cents - line.copay_cents
          else:
              line.copay_cents              = 0
              line.deductible_applied_cents = min(ded_remaining, line.allowed_amount_cents)
              ded_remaining                -= line.deductible_applied_cents
              base_after = line.allowed_amount_cents - line.deductible_applied_cents

          line.coinsurance_cents     = round_half_up(base_after * plan.coinsurance_member_pct)
          line.member_liability_cents = line.copay_cents + line.deductible_applied_cents + line.coinsurance_cents
          line.plan_paid_cents        = line.allowed_amount_cents - line.member_liability_cents
    input_set: "ClaimLine rows with line_status PRICED in the current pass, ordered service_date ASC then line_number ASC. BUNDLED, DENIED and PENDED lines are excluded and keep every money field at 0."
    constants:
      COPAY_PROCEDURE_CODES: ["99213", "99214"]
      ROUNDING_MODE: round_half_up
    precision: "Whole cents, round_half_up, applied to each line's coinsurance before the line's member_liability_cents is summed"
    variants:
      - name: COPAY_LINE
        when: "line.procedure_code is in COPAY_PROCEDURE_CODES"
        difference: "the flat copay replaces the deductible entirely for that line and does NOT decrement ded_remaining, so a copay line never moves the member closer to meeting the deductible"
      - name: DEDUCTIBLE_LINE
        when: "line.procedure_code is not in COPAY_PROCEDURE_CODES"
        difference: "the line draws down ded_remaining first and only the residue is coinsured"

  - name: oop_cap_reconciliation
    trigger: "POST /adjudication/claims/{id}/adjudicate and POST /adjudication/claims/{id}/override with decision = APPROVE, immediately after calculations.line_member_cost_share and before calculations.cob_secondary_plan_payment"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. The dependency looks circular — the member's
      # liability is capped by the remaining out-of-pocket room, but the
      # remaining room is itself moved by the liability this claim posts. The
      # order below makes the value well-defined:
      #
      #   STEP 1  compute every line's provisional member_liability_cents from
      #           calculations.line_member_cost_share using the accumulator
      #           SNAPSHOT taken at the start of the pass;
      #   STEP 2  cap the CLAIM-LEVEL total against that same snapshot;
      #   STEP 3  push the excess back onto the plan;
      #   STEP 4  only after the whole claim is reconciled, write the
      #           accumulator (and only at finalize time).
      #
      # Re-reading the accumulator between two lines of the same claim is FORBIDDEN.

      oop_room  = max(0, plan.oop_max_individual_cents - acc.oop_applied_cents)   # snapshot value
      provisional_total = SUM over pricing_lines of line.member_liability_cents
      excess = max(0, provisional_total - oop_room)

      # Relieve lines in line_number DESC order (never by id); each line can give
      # back at most its own member_liability_cents.
      for line in sorted(pricing_lines, key=line_number DESC):
          if excess <= 0: break
          give_back = min(line.member_liability_cents, excess)
          line.member_liability_cents -= give_back
          line.plan_paid_cents        += give_back
          excess                      -= give_back

      Claim.total_member_liability_cents = SUM over pricing_lines of line.member_liability_cents
      Claim.total_plan_paid_cents        = SUM over pricing_lines of line.plan_paid_cents
      Claim.total_deductible_applied_cents = SUM over pricing_lines of line.deductible_applied_cents

      # Worked example (plan deductible 0, coinsurance 0.50, oop_max 10000,
      # accumulator oop_applied 6000; two lines each allowed 20000):
      #   provisional per line = 10000 / 10000, provisional_total = 20000
      #   oop_room = 4000, excess = 16000
      #   line 2 relieved first: 10000 -> 0 (excess 6000), then line 1: 10000 -> 4000
      #   final member liability 4000 / 0, plan paid 16000 / 20000.
      # Re-reading the accumulator after line 1 would have produced 10000 / 0
      # instead — a different, WRONG answer.
    input_set: "ClaimLine rows with line_status PRICED in the current pass. The BenefitAccumulator value used is the one read at the START of the pass; the accumulator itself is not written until finalize."
    constants: {}
    precision: "Whole cents; the give-back loop moves whole cents only, so the claim totals always satisfy total_allowed_cents == total_member_liability_cents + total_plan_paid_cents before the COB offset"

  - name: cob_secondary_plan_payment
    trigger: "POST /adjudication/claims/{id}/adjudicate, immediately after calculations.oop_cap_reconciliation, and only when Claim.cob_role == SECONDARY"
    algorithm: cob_offset
    formula: |
      if Claim.cob_role == "PRIMARY": return unchanged      # no COB offset

      other = coalesce(Claim.other_payer_paid_cents, null)
      if other is null:
          # the claim pends instead of paying; see calculations.claim_outcome_resolution
          return PEND_COB_OTHER_PAYER_MISSING

      plan_would_pay_as_primary = Claim.total_plan_paid_cents        # value produced by oop_cap_reconciliation

      if plan.cob_method == "COME_OUT_WHOLE":
          plan_pays = min(plan_would_pay_as_primary,
                          max(0, Claim.total_allowed_cents - other))
      else:   # NON_DUPLICATION
          plan_pays = max(0, plan_would_pay_as_primary - other)

      Claim.total_plan_paid_cents        = plan_pays
      Claim.total_member_liability_cents = max(0, Claim.total_allowed_cents - other - plan_pays)

      # Worked divergence for identical inputs (total_allowed 40000,
      # coinsurance 0.30, deductible 0 so plan_would_pay_as_primary = 28000,
      # other_payer_paid 24000):
      #   COME_OUT_WHOLE : plan_pays = min(28000, 16000) = 16000, member = 0
      #   NON_DUPLICATION: plan_pays = max(0, 28000-24000) =  4000, member = 12000
    input_set: "Claim-level totals produced by oop_cap_reconciliation for the current pass, plus Claim.other_payer_paid_cents as last reported by intake or by POST /adjudication/claims/{id}/other-payer-payment."
    constants: {}
    precision: "Whole cents; no rounding occurs in this step"
    variants:
      - name: COME_OUT_WHOLE
        when: "BenefitPlan.cob_method == COME_OUT_WHOLE"
        difference: "the plan pays up to the full residue of the allowed amount after the other payer, so the member's residual liability collapses toward 0"
      - name: NON_DUPLICATION
        when: "BenefitPlan.cob_method == NON_DUPLICATION"
        difference: "the plan pays only what it would have paid as primary less the other payer's payment, so the member keeps the cost share the primary payer did not cover"

  - name: claim_outcome_resolution
    trigger: "POST /adjudication/claims/{id}/adjudicate, after every line has an outcome; writes Claim.status, Claim.pend_reason_code and Claim.deny_reason_code"
    algorithm: constraint_propagation
    formula: |
      # ---- per-line edit pass (runs before this resolution) -------------------
      # For each line, the applicable EditRule rows are those whose keying code
      # matches; they are applied in precedence_rank ASC, then created_at ASC.
      #   BUNDLING          : rule.secondary_code == line.procedure_code AND another
      #                       line of the same claim with the same service_date has
      #                       procedure_code == rule.primary_code
      #                       -> line BUNDLED, bundled_into_line_number = that line's line_number
      #   MUTUALLY_EXCLUSIVE: rule.secondary_code == line.procedure_code AND another
      #                       line of the same claim has procedure_code == rule.primary_code
      #                       -> line DENIED
      #   UNITS_LIMIT       : rule.primary_code == line.procedure_code AND line.units > rule.max_units
      #                       -> line DENIED
      #   AUTH_REQUIRED     : rule.primary_code == line.procedure_code
      #                       -> the line needs an Authorization (see below)
      #
      # Severity INFORM is advisory: whatever the edit_type matched, the line
      # keeps the outcome it would otherwise have had (normally PRICED) and only
      # its edit_reason_code is stamped with the rule's reason_code. INFORM rules
      # never contribute to STEP 1, STEP 4 or STEP 5 below.
      #
      # Authorization matching (deterministic selector):
      #   auth_candidates = Authorization rows where
      #       member_id == Claim.member_id AND provider_id == Claim.provider_id
      #       AND procedure_code == line.procedure_code
      #       AND valid_from <= line.service_date <= valid_to        # CLOSED interval
      #   sort auth_candidates by status rank (ACTIVE=0, PARTIALLY_CONSUMED=1,
      #        EXHAUSTED=2, REVOKED=3) ASC, then valid_to ASC, then created_at ASC
      #   auth = first(auth_candidates)
      #   auth is null                                   -> line PENDED, PEND_AUTH_MISSING
      #   auth.status == REVOKED                         -> line PENDED, PEND_AUTH_REVOKED
      #   auth.authorized_units - auth.units_consumed < line.units
      #                                                  -> line PENDED, PEND_AUTH_UNITS_EXCEEDED
      #   otherwise                                      -> line PRICED, authorization_id = auth.id
      #   (remaining units EXACTLY equal to line.units is ALLOWED: the test is `<`, not `<=`)

      # ---- claim-level outcome, evaluated strictly top to bottom --------------
      hard_denies = lines whose edit_reason_code came from an EditRule with
                    severity == "DENY" AND precedence_rank <= HARD_DENY_RANK_MAX
      STEP 1: if hard_denies is non-empty:
                  Claim.status = "DENIED"
                  Claim.deny_reason_code = reason_code of the hard-deny rule with the
                      lowest precedence_rank; tie-break by the affected line's
                      line_number ASC
                  -> RETURN (this outranks EVERY pend, even on other lines)

      STEP 2: if calculations.coverage_segment_match reports claim_has_coverage == false:
                  Claim.status = "DENIED"; Claim.deny_reason_code = "DENY_NO_COVERAGE"; RETURN

      STEP 3: if Claim.cob_role == "SECONDARY" AND Claim.other_payer_paid_cents IS NULL:
                  Claim.status = "PENDED"; Claim.pend_reason_code = "PEND_COB_OTHER_PAYER_MISSING"; RETURN

      STEP 4: pended_lines = lines with line_status PENDED
              if pended_lines is non-empty:
                  Claim.status = "PENDED"
                  Claim.pend_reason_code = the edit_reason_code of the pended line whose
                      triggering EditRule has the lowest precedence_rank;
                      tie-break by line_number ASC
                  -> RETURN
              # NOTE: a SOFT deny (severity DENY with precedence_rank > HARD_DENY_RANK_MAX)
              # does NOT outrank a pend. STEP 4 runs before STEP 5 on purpose.

      STEP 5: if every line is DENIED or BUNDLED:
                  Claim.status = "DENIED"
                  Claim.deny_reason_code = edit_reason_code of the DENIED line with the
                      lowest line_number, or "DENY_BUNDLED_ALL" when there is no DENIED line
                  -> RETURN

      STEP 6: Claim.status = "ADJUDICATED"
    input_set: "All ClaimLine rows of the claim after the edit pass, plus every EditRule row (EditRule rows are global configuration and are not filtered by plan)."
    constants:
      HARD_DENY_RANK_MAX: 10
    precision: "Integer precedence_rank comparisons; ties broken by created_at ASC on the rule and line_number ASC on the line, never by id"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST rule that fails determines the returned error_id)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The caller's role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 10
    category: existence
    check: "Every resource id embedded in the path exists, validated left to right"
    error_id: ERR_PLAN_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_COVERAGE_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_CLAIM_LINE_NOT_FOUND | ERR_ACCUMULATOR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 11
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row (plan_id, member_id, provider_id)"
    error_id: ERR_PLAN_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /adjudication/members, POST /adjudication/contracts, POST /adjudication/authorizations, POST /adjudication/claims"

  - priority: 15
    category: auth
    check: "When X-User-Role is ProviderRep, X-User-ID equals the provider_id of the claim being created or read"
    error_id: ERR_PROVIDER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /adjudication/claims, GET /adjudication/claims/{id}, GET /adjudication/claims, GET /adjudication/claim-lines, GET /adjudication/claims/{id}/remittances, GET /adjudication/claims/{id}/events"

  - priority: 20
    category: business_constraint
    check: "Every field the endpoint declares as required in §1.5 is present in the request body"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 21
    category: business_constraint
    check: "Every supplied value is well formed: enum members belong to the declared set, units >= 1, cents fields >= 0, percentages within their declared bounds, dates are ISO YYYY-MM-DD, an interval's end is not earlier than its start, contract_pct is present when pricing_method == PCT_OF_FEE_SCHEDULE and case_rate_cents is present when pricing_method == CASE_RATE, secondary_code is present for BUNDLING and MUTUALLY_EXCLUSIVE edit types and max_units is present for UNITS_LIMIT"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 22
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"

  - priority: 30
    category: state
    check: "The target resource is in a state the operation accepts, per §1.2"
    error_id: ERR_INVALID_CLAIM_STATE | ERR_CLAIM_NOT_PENDED | ERR_CLAIM_NOT_FINALIZED | ERR_CONTRACT_NOT_DRAFT | ERR_CONTRACT_NOT_ACTIVE | ERR_COVERAGE_ALREADY_TERMINATED | ERR_AUTHORIZATION_NOT_REVOCABLE
    http_status: 409
    applies_to: "POST /adjudication/claims/{id}/adjudicate, POST /adjudication/claims/{id}/override, POST /adjudication/claims/{id}/finalize, POST /adjudication/claims/{id}/void, POST /adjudication/claims/{id}/adjustments, POST /adjudication/claims/{id}/other-payer-payment, POST /adjudication/contracts/{id}/activate, POST /adjudication/contracts/{id}/terminate, POST /adjudication/coverages/{id}/terminate, POST /adjudication/authorizations/{id}/revoke"

  - priority: 35
    category: state
    check: "The supplied expected_<parent>_version equals the parent row's current version, per §1.2.1"
    error_id: ERR_STALE_CLAIM_VERSION | ERR_STALE_ACCUMULATOR_VERSION
    http_status: 412
    applies_to: "POST /adjudication/claims/{id}/other-payer-payment, POST /adjudication/accumulators/{id}/adjustments"

  - priority: 40
    category: business_safety
    check: "The overriding MedicalDirector's X-User-ID differs from Claim.last_adjudicated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /adjudication/claims/{id}/override"

  - priority: 45
    category: business_safety
    check: "The submitted claim carries at least one service line"
    error_id: ERR_CLAIM_NO_LINES
    http_status: 422
    applies_to: "POST /adjudication/claims, POST /adjudication/claims/{id}/adjustments"

  - priority: 50
    category: business_temporal
    check: "The new MemberCoverage half-open interval [effective_date, term_date) does not intersect any existing MemberCoverage interval of the same member. Adjacency IS allowed: new.effective_date == existing.term_date is accepted because the existing interval excludes its own end. An open-ended existing segment (term_date null) blocks every later effective_date."
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /adjudication/members/{id}/coverages"

  - priority: 52
    category: business_temporal
    check: "The new ProviderContract closed interval [effective_date, term_date] for the same (provider_id, plan_id) is separated from every existing non-TERMINATED contract interval by at least CONTRACT_GAP_DAYS = 1 full clear calendar day: new.effective_date >= existing.term_date + 2 days, or new.term_date + 2 days <= existing.effective_date. Adjacency IS rejected here — a new contract starting the day after an existing one ends still conflicts."
    error_id: ERR_CONTRACT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /adjudication/contracts"

  - priority: 54
    category: business_temporal
    check: "The whole-day distance between Claim.statement_to_date and the logical clock date at intake does not exceed BenefitPlan.timely_filing_days. Exactly timely_filing_days is ACCEPTED; the test is strictly greater-than."
    error_id: ERR_TIMELY_FILING_EXCEEDED
    http_status: 422
    applies_to: "POST /adjudication/claims, POST /adjudication/claims/{id}/adjustments"

  - priority: 60
    category: business_referential
    check: "The claim's member has at least one MemberCoverage row of any status"
    error_id: ERR_MEMBER_NO_COVERAGE
    http_status: 422
    applies_to: "POST /adjudication/claims"

  - priority: 62
    category: business_referential
    check: "Uniqueness: Member.member_number is unique; Claim.claim_number is unique; (FeeScheduleRate.plan_id, procedure_code, effective_date) is unique"
    error_id: ERR_DUPLICATE_MEMBER_NUMBER | ERR_DUPLICATE_CLAIM_NUMBER | ERR_DUPLICATE_FEE_RATE
    http_status: 409
    applies_to: "POST /adjudication/members, POST /adjudication/claims, POST /adjudication/claims/{id}/adjustments, POST /adjudication/benefit-plans/{id}/fee-schedule-rates"

  - priority: 70
    category: business_fiscal
    check: "Claim.other_payer_paid_cents does not exceed Claim.total_billed_cents"
    error_id: ERR_OTHER_PAYER_EXCEEDS_BILLED
    http_status: 422
    applies_to: "POST /adjudication/claims, POST /adjudication/claims/{id}/other-payer-payment"

  - priority: 72
    category: business_fiscal
    check: "A manual accumulator adjustment must not drive deductible_applied_cents or oop_applied_cents below 0"
    error_id: ERR_ACCUMULATOR_NEGATIVE
    http_status: 422
    applies_to: "POST /adjudication/accumulators/{id}/adjustments"

# =============================================================================
# §1.5 API Endpoint Table   (all paths are rooted at api_prefix /adjudication)
# =============================================================================
endpoints:
  # ------------------------- BenefitPlan --------------------------------------
  - method: POST
    path: "/adjudication/benefit-plans"
    description: "Create a benefit plan (the configuration object every pricing and cost-share constant is read from)"
    roles: [PlanAdmin]
    code: 201
    input: ["plan_code", "name", "deductible_individual_cents", "oop_max_individual_cents", "coinsurance_member_pct", "plan_year_start_date?", "copay_office_visit_cents?", "out_of_network_penalty_pct?", "timely_filing_days?", "cob_method?"]
    output: BenefitPlan
    side_effects: ["none"]

  - method: GET
    path: "/adjudication/benefit-plans/{id}"
    description: "Read one benefit plan"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: []
    output: BenefitPlan
    side_effects: []

  # ------------------------- FeeScheduleRate -----------------------------------
  - method: POST
    path: "/adjudication/benefit-plans/{id}/fee-schedule-rates"
    description: "Publish a per-unit fee schedule rate for a procedure code under this plan"
    roles: [NetworkManager, PlanAdmin]
    code: 201
    input: [procedure_code, allowed_amount_cents, effective_date]
    output: FeeScheduleRate
    side_effects: ["future adjudication passes select this rate when it is the latest one whose effective_date is on or before the line's service_date"]

  - method: GET
    path: "/adjudication/benefit-plans/{id}/fee-schedule-rates"
    description: "List the fee schedule rates published under a plan (reverse-reachability for FeeScheduleRate.plan_id)"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: ["procedure_code?", "limit?", "offset?"]
    output: FeeScheduleRate[]
    side_effects: []

  # ------------------------- Member --------------------------------------------
  - method: POST
    path: "/adjudication/members"
    description: "Enrol a member under a benefit plan"
    roles: [PlanAdmin]
    code: 201
    input: ["member_number", "plan_id", "first_name?", "last_name?", "date_of_birth?"]
    output: Member
    side_effects: ["creates one BenefitAccumulator for (member_id, calendar year of BenefitPlan.plan_year_start_date) with all counters at 0"]

  - method: GET
    path: "/adjudication/members/{id}"
    description: "Read one member"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/adjudication/members"
    description: "List members, optionally filtered by plan (reverse-reachability for Member.plan_id)"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: ["plan_id?", "member_number?", "status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  # ------------------------- MemberCoverage ------------------------------------
  - method: POST
    path: "/adjudication/members/{id}/coverages"
    description: "Add a coverage segment to a member. The interval is half-open [effective_date, term_date); adjacency to an existing segment is allowed, intersection is not."
    roles: [PlanAdmin]
    code: 201
    input: ["effective_date", "cob_order", "term_date?", "other_payer_name?", "coverage_tier?"]
    output: MemberCoverage
    side_effects: ["sets Member.status back to ACTIVE when the new interval contains the current logical clock date"]

  - method: GET
    path: "/adjudication/members/{id}/coverages"
    description: "List a member's coverage segments (reverse-reachability for MemberCoverage.member_id)"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MemberCoverage[]
    side_effects: []

  - method: POST
    path: "/adjudication/coverages/{id}/terminate"
    description: "Terminate a coverage segment, closing its half-open interval at term_date and firing the eligibility re-pend cascade"
    roles: [PlanAdmin]
    code: 200
    input: [term_date]
    output: MemberCoverage
    side_effects:
      - "sets MemberCoverage.status = TERMINATED and term_date"
      - "re-pends every Claim on this coverage in status RECEIVED, PENDED or ADJUDICATED whose statement_from_date >= term_date, stamping pend_reason_code = PEND_ELIG_REVIEW"
      - "flips those claims' PRICED lines to PENDED and releases their Authorization units, re-deriving Authorization.status"
      - "sets Member.status = TERMINATED when no remaining coverage interval contains the current logical clock date"

  # ------------------------- BenefitAccumulator --------------------------------
  - method: GET
    path: "/adjudication/members/{id}/accumulators"
    description: "List a member's benefit accumulators, newest plan_year first (reverse-reachability for BenefitAccumulator.member_id)"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: ["plan_year?", "limit?", "offset?"]
    output: BenefitAccumulator[]
    side_effects: []

  - method: POST
    path: "/adjudication/accumulators/{id}/adjustments"
    description: "Post a manual correction delta onto a benefit accumulator (used by plan operations to seed or repair year-to-date balances). Guarded by optimistic concurrency on the accumulator version."
    roles: [PlanAdmin]
    code: 200
    input: ["expected_accumulator_version", "deductible_delta_cents", "oop_delta_cents", "note?"]
    output: BenefitAccumulator
    side_effects:
      - "adds deductible_delta_cents to BenefitAccumulator.deductible_applied_cents and oop_delta_cents to BenefitAccumulator.oop_applied_cents"
      - "increments BenefitAccumulator.version by 1"

  # ------------------------- Provider ------------------------------------------
  - method: POST
    path: "/adjudication/providers"
    description: "Register a billing provider"
    roles: [PlanAdmin, NetworkManager]
    code: 201
    input: ["npi", "name", "network_status", "specialty_code?"]
    output: Provider
    side_effects: ["none"]

  - method: GET
    path: "/adjudication/providers/{id}"
    description: "Read one provider"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ------------------------- ProviderContract ----------------------------------
  - method: POST
    path: "/adjudication/contracts"
    description: "Draft a provider contract for a (provider, plan) pair. The interval is closed [effective_date, term_date] and must clear every existing non-TERMINATED contract for that pair by at least one full calendar day."
    roles: [NetworkManager]
    code: 201
    input: ["provider_id", "plan_id", "effective_date", "term_date", "pricing_method", "contract_pct?", "case_rate_cents?"]
    output: ProviderContract
    side_effects: ["created in status DRAFT; DRAFT contracts never price a claim"]

  - method: GET
    path: "/adjudication/contracts/{id}"
    description: "Read one provider contract"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: []
    output: ProviderContract
    side_effects: []

  - method: GET
    path: "/adjudication/contracts"
    description: "List provider contracts (reverse-reachability for ProviderContract.provider_id and ProviderContract.plan_id)"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: ["provider_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: ProviderContract[]
    side_effects: []

  - method: POST
    path: "/adjudication/contracts/{id}/activate"
    description: "Activate a DRAFT contract so it starts pricing claims"
    roles: [NetworkManager]
    code: 200
    input: []
    output: ProviderContract
    side_effects: ["status DRAFT -> ACTIVE; subsequent adjudication passes for this (provider, plan) price with the CONTRACT_PRICED or CASE_RATE_PRICED variant"]

  - method: POST
    path: "/adjudication/contracts/{id}/terminate"
    description: "Terminate an ACTIVE contract; later adjudication passes fall back to the FEE_SCHEDULE_PRICED variant"
    roles: [NetworkManager]
    code: 200
    input: [term_date]
    output: ProviderContract
    side_effects: ["status ACTIVE -> TERMINATED and term_date is overwritten with the supplied date"]

  # ------------------------- EditRule ------------------------------------------
  - method: POST
    path: "/adjudication/edit-rules"
    description: "Publish a global edit / audit rule (bundling, mutually exclusive, units limit, or medical-policy authorization requirement)"
    roles: [PlanAdmin, MedicalDirector]
    code: 201
    input: ["rule_code", "edit_type", "primary_code", "severity", "precedence_rank", "reason_code", "secondary_code?", "max_units?"]
    output: EditRule
    side_effects: ["applies to every adjudication pass that runs after creation; DENY-severity rules with precedence_rank <= 10 become hard denials"]

  # ------------------------- Authorization -------------------------------------
  - method: POST
    path: "/adjudication/authorizations"
    description: "Issue a prior authorization for a member / provider / procedure code over the closed interval [valid_from, valid_to]"
    roles: [UtilizationReviewer]
    code: 201
    input: [member_id, provider_id, procedure_code, authorized_units, valid_from, valid_to]
    output: Authorization
    side_effects: ["created with status ACTIVE and units_consumed 0"]

  - method: GET
    path: "/adjudication/authorizations/{id}"
    description: "Read one authorization"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  - method: GET
    path: "/adjudication/authorizations"
    description: "List authorizations (reverse-reachability for Authorization.member_id and Authorization.provider_id)"
    roles: [PlanAdmin, NetworkManager, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector]
    code: 200
    input: ["member_id?", "provider_id?", "procedure_code?", "status?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  - method: POST
    path: "/adjudication/authorizations/{id}/revoke"
    description: "Revoke an authorization; already-consumed units stay consumed, future lines pend with PEND_AUTH_REVOKED"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: Authorization
    side_effects: ["status ACTIVE or PARTIALLY_CONSUMED -> REVOKED; units_consumed is frozen"]

  # ------------------------- Claim ---------------------------------------------
  - method: POST
    path: "/adjudication/claims"
    description: "837 claim intake. Creates the claim and its service lines, stamps received_at from the logical clock, matches the coverage segment, and runs duplicate detection before any pricing."
    roles: [ClaimsIntake, ProviderRep]
    code: 201
    input: ["claim_number", "member_id", "provider_id", "lines", "statement_from_date?", "statement_to_date?", "other_payer_paid_cents?"]
    output: Claim
    side_effects:
      - "creates one ClaimLine per element of lines, each with line_status PENDING"
      - "computes Claim.total_billed_cents as the sum of the submitted billed_amount_cents"
      - "runs calculations.coverage_segment_match to set coverage_id and cob_role"
      - "runs calculations.duplicate_detection; a match sets duplicate_of_claim_id, deny_reason_code = DENY_DUPLICATE and status = DUPLICATE_REJECTED"
      - "appends an AdjudicationEvent with event_type INTAKE, or DUPLICATE_REJECT when a duplicate was found"

  - method: GET
    path: "/adjudication/claims/{id}"
    description: "Read one claim with all its computed totals and reason codes"
    roles: [PlanAdmin, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector, ProviderRep]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/adjudication/claims"
    description: "List claims (reverse-reachability for Claim.member_id, Claim.provider_id, Claim.coverage_id, Claim.original_claim_id and Claim.duplicate_of_claim_id)"
    roles: [PlanAdmin, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector, ProviderRep]
    code: 200
    input: ["member_id?", "provider_id?", "coverage_id?", "original_claim_id?", "duplicate_of_claim_id?", "status?", "claim_type?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/adjudication/claims/{id}/adjudicate"
    description: "Run one adjudication pass: fee schedule lookup, contract pricing, edit / bundling pass, authorization matching, cost-share waterfall, out-of-pocket cap reconciliation, COB offset, then claim-level outcome resolution"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "resets every ClaimLine to line_status PENDING and releases previously held Authorization units before the pass begins"
      - "runs calculations.line_allowed_amount, calculations.case_rate_prorata_allocation, calculations.line_member_cost_share, calculations.oop_cap_reconciliation, calculations.cob_secondary_plan_payment and calculations.claim_outcome_resolution"
      - "writes Claim.total_allowed_cents, total_deductible_applied_cents, total_member_liability_cents, total_plan_paid_cents, pricing_variant, pend_reason_code and deny_reason_code"
      - "increments Claim.adjudication_pass by 1 and sets Claim.last_adjudicated_by_user_id to the caller's X-User-ID"
      - "increases Authorization.units_consumed for every line that reached PRICED with a matched authorization, re-deriving Authorization.status"
      - "appends an AdjudicationEvent with event_type ADJUDICATE"

  - method: POST
    path: "/adjudication/claims/{id}/override"
    description: "Medical-director release or denial of a PENDED claim. The acting X-User-ID must differ from the examiner who produced the pend."
    roles: [MedicalDirector]
    code: 200
    input: ["decision", "override_reason_code?"]
    output: Claim
    side_effects:
      - "decision APPROVE forces every PENDED line to PRICED, bypassing the AUTH_REQUIRED edit, and consumes Authorization units even beyond authorized_units"
      - "decision DENY sets every PENDED line to DENIED with the supplied override_reason_code (default DENY_MEDICAL_POLICY) and zeroes the claim totals"
      - "appends an AdjudicationEvent with event_type OVERRIDE"

  - method: POST
    path: "/adjudication/claims/{id}/finalize"
    description: "Issue the remittance advice for an ADJUDICATED or DENIED claim and post the accumulator deltas"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "creates one RemittanceAdvice with status ISSUED and remit_number RA-<claim_number>-<n>"
      - "sets Claim.payment_status NOT_REMITTED -> REMITTED"
      - "adds total_deductible_applied_cents and total_member_liability_cents to the member's BenefitAccumulator and increments remitted_claim_count (skipped entirely for DENIED claims)"
      - "flips every PRICED ClaimLine to PAID"
      - "appends an AdjudicationEvent with event_type FINALIZE"

  - method: POST
    path: "/adjudication/claims/{id}/void"
    description: "Void a FINALIZED claim and unwind every posted effect (remittance, accumulator, paid lines, authorization units)"
    roles: [ClaimsExaminer]
    code: 200
    input: ["void_reason_code?"]
    output: Claim
    side_effects:
      - "Claim.status FINALIZED -> VOIDED and payment_status REMITTED -> REVERSED"
      - "the claim's ISSUED RemittanceAdvice rows flip to VOIDED and their accumulator deltas are subtracted"
      - "every PAID ClaimLine flips to REVERSED and releases its Authorization units, re-deriving Authorization.status"
      - "appends an AdjudicationEvent with event_type VOID"

  - method: POST
    path: "/adjudication/claims/{id}/adjustments"
    description: "Replace a FINALIZED claim with a corrected ADJUSTMENT claim. The original is reversed exactly as a void reverses it; the replacement is created in RECEIVED and must be adjudicated again."
    roles: [ClaimsExaminer]
    code: 201
    input: ["claim_number", "lines", "adjustment_reason_code?"]
    output: Claim
    side_effects:
      - "original Claim.status FINALIZED -> ADJUSTED and payment_status REMITTED -> REVERSED"
      - "the original's ISSUED RemittanceAdvice rows flip to VOIDED and their accumulator deltas are subtracted"
      - "the original's PAID lines flip to REVERSED and release their Authorization units"
      - "creates and returns a new Claim with claim_type ADJUSTMENT, original_claim_id set to the original, status RECEIVED and the supplied replacement lines"
      - "appends an AdjudicationEvent with event_type ADJUST on the original claim"

  - method: POST
    path: "/adjudication/claims/{id}/other-payer-payment"
    description: "Post the amount the payer ahead of this plan in the COB order has paid. Guarded by optimistic concurrency on the claim version; from ADJUDICATED the claim returns to RECEIVED for reprocessing."
    roles: [ClaimsIntake]
    code: 200
    input: [other_payer_paid_cents, expected_claim_version]
    output: Claim
    side_effects:
      - "overwrites Claim.other_payer_paid_cents"
      - "from status ADJUDICATED the claim returns to RECEIVED, every ClaimLine resets to PENDING, per-line money fields are zeroed, Authorization units are released and pricing_variant returns to UNPRICED"
      - "increments Claim.version by 1"
      - "appends an AdjudicationEvent with event_type COB_POST"

  # ------------------------- ClaimLine -----------------------------------------
  - method: GET
    path: "/adjudication/claim-lines/{id}"
    description: "Read one adjudicated service line with its per-line money fields"
    roles: [PlanAdmin, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector, ProviderRep]
    code: 200
    input: []
    output: ClaimLine
    side_effects: []

  - method: GET
    path: "/adjudication/claim-lines"
    description: "List service lines ordered by line_number ASC (reverse-reachability for ClaimLine.claim_id and ClaimLine.authorization_id)"
    roles: [PlanAdmin, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector, ProviderRep]
    code: 200
    input: ["claim_id?", "authorization_id?", "line_status?", "limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []

  # ------------------------- RemittanceAdvice ----------------------------------
  - method: GET
    path: "/adjudication/claims/{id}/remittances"
    description: "List the remittance advices issued for a claim, newest first (reverse-reachability for RemittanceAdvice.claim_id)"
    roles: [PlanAdmin, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector, ProviderRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RemittanceAdvice[]
    side_effects: []

  # ------------------------- AdjudicationEvent ---------------------------------
  - method: GET
    path: "/adjudication/claims/{id}/events"
    description: "List the append-only adjudication event log for a claim, oldest first (reverse-reachability for AdjudicationEvent.claim_id)"
    roles: [PlanAdmin, ClaimsIntake, ClaimsExaminer, UtilizationReviewer, MedicalDirector, ProviderRep]
    code: 200
    input: ["pass_number?", "event_type?", "limit?", "offset?"]
    output: AdjudicationEvent[]
    side_effects: []

  # ------------------------- Test-driving endpoint ------------------------------
  - method: POST
    path: "/adjudication/_clock/set_current_utc"
    description: "Set the server's logical clock. Every received_at, issued_at and occurred_at stamp, and every timely-filing / coverage / authorization date comparison, reads this clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlanAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["subsequent intake, finalize and event stamps use the new value; no stored row is retroactively restamped"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The caller's role is not listed in the endpoint's roles" }
  - { id: ERR_PROVIDER_SCOPE_VIOLATION, http: 403, condition: "A ProviderRep acts on or reads a claim whose provider_id differs from the caller's X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The overriding MedicalDirector's X-User-ID equals Claim.last_adjudicated_by_user_id" }

  # --- existence ---
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "No BenefitPlan with the referenced id" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "No Member with the referenced id" }
  - { id: ERR_COVERAGE_NOT_FOUND, http: 404, condition: "No MemberCoverage with the referenced id" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "No Provider with the referenced id" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "No ProviderContract with the referenced id" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "No Authorization with the referenced id" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No Claim with the referenced id" }
  - { id: ERR_CLAIM_LINE_NOT_FOUND, http: 404, condition: "No ClaimLine with the referenced id" }
  - { id: ERR_ACCUMULATOR_NOT_FOUND, http: 404, condition: "No BenefitAccumulator with the referenced id" }

  # --- state ---
  - { id: ERR_INVALID_CLAIM_STATE, http: 409, condition: "The claim's status does not permit the requested operation (adjudicate on a FINALIZED, VOIDED, ADJUSTED or DUPLICATE_REJECTED claim; other-payer-payment on a FINALIZED claim; and similar)" }
  - { id: ERR_CLAIM_NOT_PENDED, http: 409, condition: "POST /adjudication/claims/{id}/override on a claim whose status is not PENDED" }
  - { id: ERR_CLAIM_NOT_FINALIZED, http: 409, condition: "POST /adjudication/claims/{id}/void or /adjustments on a claim whose status is not FINALIZED" }
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "POST /adjudication/contracts/{id}/activate on a contract whose status is not DRAFT" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "POST /adjudication/contracts/{id}/terminate on a contract whose status is not ACTIVE" }
  - { id: ERR_COVERAGE_ALREADY_TERMINATED, http: 409, condition: "POST /adjudication/coverages/{id}/terminate on a coverage whose status is already TERMINATED" }
  - { id: ERR_AUTHORIZATION_NOT_REVOCABLE, http: 409, condition: "POST /adjudication/authorizations/{id}/revoke on an authorization whose status is EXHAUSTED or REVOKED" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version does not equal the claim's current version" }
  - { id: ERR_STALE_ACCUMULATOR_VERSION, http: 412, condition: "expected_accumulator_version does not equal the accumulator's current version" }

  # --- business ---
  - { id: ERR_MEMBER_NO_COVERAGE, http: 422, condition: "Claim intake for a member who has no MemberCoverage row of any status" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "A new coverage segment's half-open interval intersects an existing segment of the same member" }
  - { id: ERR_CONTRACT_WINDOW_CONFLICT, http: 409, condition: "A new contract's closed interval is not separated from every existing non-TERMINATED contract for the same (provider_id, plan_id) by at least one full clear calendar day" }
  - { id: ERR_TIMELY_FILING_EXCEEDED, http: 422, condition: "Whole days between statement_to_date and the logical clock at intake exceed BenefitPlan.timely_filing_days" }
  - { id: ERR_OTHER_PAYER_EXCEEDS_BILLED, http: 422, condition: "other_payer_paid_cents exceeds the claim's total_billed_cents" }
  - { id: ERR_ACCUMULATOR_NEGATIVE, http: 422, condition: "A manual accumulator adjustment would drive deductible_applied_cents or oop_applied_cents below 0" }
  - { id: ERR_CLAIM_NO_LINES, http: 422, condition: "A claim or adjustment is submitted with an empty lines array" }
  - { id: ERR_DUPLICATE_MEMBER_NUMBER, http: 409, condition: "member_number already used by another Member" }
  - { id: ERR_DUPLICATE_CLAIM_NUMBER, http: 409, condition: "claim_number already used by another Claim" }
  - { id: ERR_DUPLICATE_FEE_RATE, http: 409, condition: "A FeeScheduleRate already exists for the same (plan_id, procedure_code, effective_date)" }

  # --- request shape ---
  - { id: ERR_MISSING_REQUIRED_FIELD, http: 400, condition: "A field the endpoint declares as required is absent from the request body" }
  - { id: ERR_INVALID_FIELD_VALUE, http: 400, condition: "A supplied value violates its declared type, enum set, numeric bound, date format, interval ordering, or a conditionally required companion field" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside [1, 100] or offset below 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Plan operations: benefit plan configuration, member enrolment, coverage segments, edit rules, accumulator corrections and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjudication/benefit-plans"
      - "POST /adjudication/members"
      - "POST /adjudication/members/{id}/coverages"
      - "POST /adjudication/coverages/{id}/terminate"
      - "POST /adjudication/accumulators/{id}/adjustments"
      - "POST /adjudication/_clock/set_current_utc"
    shared_operations:
      - "POST /adjudication/providers (with NetworkManager)"
      - "POST /adjudication/benefit-plans/{id}/fee-schedule-rates (with NetworkManager)"
      - "POST /adjudication/edit-rules (with MedicalDirector)"
      - "every configuration and claim GET endpoint"

  - name: NetworkManager
    description: "Network contracting: provider registration, provider contracts and published fee schedule rates"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjudication/contracts"
      - "POST /adjudication/contracts/{id}/activate"
      - "POST /adjudication/contracts/{id}/terminate"
    shared_operations:
      - "POST /adjudication/providers (with PlanAdmin)"
      - "POST /adjudication/benefit-plans/{id}/fee-schedule-rates (with PlanAdmin)"
      - "every configuration GET endpoint"
    note: "Deliberately has NO access to any claim, claim-line, remittance or event read endpoint."

  - name: ClaimsIntake
    description: "837 intake desk: submits claims on behalf of providers and posts other-payer COB payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjudication/claims/{id}/other-payer-payment"
    shared_operations:
      - "POST /adjudication/claims (with ProviderRep)"
      - "every configuration and claim GET endpoint"

  - name: ClaimsExaminer
    description: "Runs adjudication passes, finalizes claims into remittances, voids and adjusts finalized claims"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjudication/claims/{id}/adjudicate"
      - "POST /adjudication/claims/{id}/finalize"
      - "POST /adjudication/claims/{id}/void"
      - "POST /adjudication/claims/{id}/adjustments"
    shared_operations:
      - "every configuration and claim GET endpoint"

  - name: UtilizationReviewer
    description: "Issues and revokes prior authorizations"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjudication/authorizations"
      - "POST /adjudication/authorizations/{id}/revoke"
    shared_operations:
      - "every configuration and claim GET endpoint"

  - name: MedicalDirector
    description: "Releases or converts pended claims under medical policy. Segregation of duties: the acting X-User-ID must differ from the X-User-ID whose adjudication pass produced the pend."
    identity: "opaque"
    exclusive_operations:
      - "POST /adjudication/claims/{id}/override"
    shared_operations:
      - "POST /adjudication/edit-rules (with PlanAdmin)"
      - "every configuration and claim GET endpoint"

  - name: ProviderRep
    description: "A billing provider acting for itself: may submit its own claims and read only its own claims, lines, remittances and events"
    identity: "entity_backed:Provider"
    exclusive_operations: []
    shared_operations:
      - "POST /adjudication/claims (with ClaimsIntake) — the body's provider_id MUST equal the caller's X-User-ID"
      - "GET /adjudication/claims, GET /adjudication/claims/{id}, GET /adjudication/claim-lines, GET /adjudication/claims/{id}/remittances, GET /adjudication/claims/{id}/events — restricted to claims whose provider_id equals the caller's X-User-ID"
