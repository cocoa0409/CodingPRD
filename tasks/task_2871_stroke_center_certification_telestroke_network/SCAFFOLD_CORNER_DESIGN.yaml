  - name: a_deviation_may_be_returned_for_information_only_while_the_round_count_is_under_three
    claim_type: violation_to_error
    grounds:
    - validations priority 76 -> ERR_REVIEW_ROUND_LIMIT (409) MAX_REVIEW_ROUNDS 3
    - state_machines.ProtocolDeviation UNDER_REVIEW <-> RETURNED_FOR_INFO
    - endpoints.POST /stroke-network/deviations/{id}/start-review, /resubmit
    distinguishing_aspect: The counter is moved by start-review (:= 1) and resubmit (+= 1) but NOT by return-for-info, so the loop survives exactly two resubmissions and dies on the third return. Counting return-for-info calls instead would refuse a round early; counting only resubmits would allow an extra lap.
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke and one ACTIVATED CodeStrokeCase.
      - One MANUAL MAJOR DTN_EXCEEDED ProtocolDeviation on that case, opened by qa_bob and OPEN with review_round 0.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
