  - rule_id: resource_temporal_overlap
    instances:

      - name: staff_closed_interval_touching_allowed_but_cross_site_gap_under_buffer_rejected
        grounds:
          - validations[priority=13]
          - errors.ERR_STAFF_SCHEDULE_CONFLICT
          - errors.ERR_TRAVEL_BUFFER_VIOLATION
          - entities.GroupSession.fields.assigned_staff
        distinguishing_aspect: |
          Resource entity StaffMember under CLOSED-interval semantics: [start_at, end_at]
          endpoints that merely touch at the same site do not conflict, so an 11:00 handoff
          is legal, but a location change adds a 30-minute travel buffer measured between the
          earlier end_at and the later start_at, so a 20-minute cross-site gap is refused
          while a 30-minute gap is accepted.
        test_recipe:
          setup:
            - "One StaffMember with insurance to 2027-12-31 and a VALID CPR_AED certification (COMPLIANT)."
            - "GroupSession A: ONSITE 2026-08-10T10:00Z-11:00Z, station_count 3, max_athletes 10, GENERAL_PREP, with that coach assigned."
            - "GroupSession B: ONSITE 2026-08-10T11:00Z-12:00Z, same shape; the coach is also assigned here, which is legal because the intervals only touch at 11:00 at the same site."
            - "GroupSession C: OFFSITE 'Eastside Club' 2026-08-10T12:20Z-13:20Z — no overlap with B, but only a 20-minute gap across a location change."
            - "GroupSession D: OFFSITE 'Eastside Club' 2026-08-10T12:30Z-13:30Z — exactly a 30-minute gap after B."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Sol Rivera", role_title: "HEAD_COACH", liability_insurance_expires_on: "2027-12-31" }
