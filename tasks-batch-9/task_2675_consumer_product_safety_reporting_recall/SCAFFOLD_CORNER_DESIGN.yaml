      - name: every_error_response_carries_the_declared_envelope_and_writes_nothing
        claim_type: Error Triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_INCIDENT_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          The error envelope is fixed: data carries exactly error_id and message,
          response_type is "error", and meta still carries api_request_id and
          api_request_timestamp. Two structurally different failures — a 404 on a
          missing row and a 400 on an unparseable body — must both produce that
          shape, and neither may leave a row behind. Implementations that return a
          bare string body, or that omit meta on failures, break every downstream
          assertion in this design.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z and one registered product model"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id }
          trigger:
            - call: "GET /product-safety/incidents/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IntakeSpecialist
              captures: { nf_id: $.data.error_id, nf_msg: $.data.message }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "FAX_MACHINE", incident_date: "2026-13-45T00:00:00Z", narrative: "Unparseable submission." }
              as: IntakeSpecialist
              captures: { bad_id: $.data.error_id, bad_msg: $.data.message }
          assert:
            - "${nf_id} == ERR_INCIDENT_NOT_FOUND with HTTP 404"
            - "${bad_id} == ERR_INVALID_REQUEST with HTTP 400 (unknown enum member and malformed instant both land here)"
            - "${nf_msg} and ${bad_msg} are non-empty strings"
            - "both bodies have response_type == \"error\" and a data object whose only keys are error_id and message"
            - "both bodies still carry meta.api_request_id and meta.api_request_timestamp"
            - "GET /product-safety/incidents?product_model_id=${pm_id} returns 0 rows — the rejected create wrote nothing"

