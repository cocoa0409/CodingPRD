              as: FundManager
              captures: { rk_call_id: "$.data.id" }
            - call: "GET /capital-calls/${rk_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { rkal_id: "$.data[0].id", rkal_amt: "$.data[0].allocated_amount_cents" }
            - call: "POST /capital-call-allocations/${rkal_id}/fund"
              payload: { paid_amount_cents: "${rkal_amt}" }
              as: FundAdministrator
            - call: "POST /portfolio-companies"
              payload: { name: "Iota", sector: "Gaming" }
              as: FundManager
              captures: { rkpc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${rkf_id}", portfolio_company_id: "${rkpc_id}", cost_basis_cents: 5000000, ownership_pct_bps: 1000 }
              as: FundManager
              captures: { rkinv_id: "$.data.id" }
            - call: "POST /investments/${rkinv_id}/realize"
              payload: { realized_proceeds_cents: 6000000 }
              as: FundManager
            - call: "GET /funds/${rkf_id}"
              payload: {}
              as: FundManager
              captures: { rkf_v2: "$.data.version" }
            - call: "POST /distribution-events"
              payload: { fund_id: "${rkf_id}", source_investment_id: "${rkinv_id}", gross_amount_cents: 2000000, distribution_type: "RETURN_OF_CAPITAL", recyclable: true, expected_fund_version: "${rkf_v2}" }
              as: FundManager
              captures: { rk_evt_id: "$.data.id" }
