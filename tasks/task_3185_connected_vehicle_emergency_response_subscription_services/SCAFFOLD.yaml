    path: "/accounts/{accountId}/consents/{consentId}/grant"
    description: "Re-grant a revoked consent (cyclic)"
    roles: [Account]
    code: 200
    input: []
    output: DataConsent
    side_effects: ["REVOKED -> GRANTED; insurance sharing requires data collection consent GRANTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or entity_backed role acting on another principal's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or parent chain mismatch" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, or type mismatch in body" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_subscription_version does not match current Subscription.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_SLOWDOWN_NOT_VERIFIED, http: 409, condition: "arm-slowdown or execute-slowdown attempted before law-enforcement verification" }
  - { id: ERR_SLOWDOWN_UNSUPPORTED_HARDWARE, http: 409, condition: "Vehicle hardware_generation != 5 for slowdown operations" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Verifier X-User-ID equals the reporter X-User-ID on a stolen-vehicle case" }
  - { id: ERR_RETENTION_WINDOW_EXPIRED, http: 409, condition: "retain-emergency attempted after lapse_date + 30 days" }
  - { id: ERR_APPOINTMENT_IN_PAST, http: 409, condition: "scheduled_date not strictly in the future relative to the logical clock" }
  - { id: ERR_ODOMETER_REGRESSION, http: 409, condition: "Diagnostic report odometer_km lower than the vehicle's latest report" }
  - { id: ERR_REMOTE_COMMAND_CAP_REACHED, http: 409, condition: "period_remote_commands_used equals the tier cap (strict < fails)" }
  - { id: ERR_PSAP_UNAVAILABLE, http: 409, condition: "PSAP suspended, region mismatch, or accepts_location_transfer false at dispatch time" }
  - { id: ERR_DEALER_CAPACITY_REACHED, http: 409, condition: "Dealer already at service_capacity_per_day CONFIRMED appointments for the scheduled date" }
  - { id: ERR_CONSENT_DEPENDENCY_MISSING, http: 409, condition: "Insurance sharing grant without a GRANTED driving-data-collection consent" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation on email, VIN, or police_report_number" }
  - { id: ERR_NO_CELLULAR_COVERAGE, http: 422, condition: "Region's CoverageZone has_cellular false; dominates all entitlement checks" }
  - { id: ERR_EMERGENCY_ENTITLEMENT_MISSING, http: 422, condition: "Subscription status/tier lacks allows_emergency for a crash event or SOS flow" }
  - { id: ERR_TIER_CAPABILITY_MISSING, http: 422, condition: "Tier lacks the required capability flag (remote commands / navigation / data)" }
  - { id: ERR_EMERGENCY_ONLY_COMMAND, http: 422, condition: "Non-LOCATE command attempted under EMERGENCY_RETAINED emergency-only entitlement" }
  - { id: ERR_CRASH_THRESHOLD_NOT_MET, http: 422, condition: "Computed severity_score below CRASH_SCORE_THRESHOLD; no CrashEvent persisted" }
  - { id: ERR_BILLING_TRANSITION_INVALID, http: 409, condition: "Billing outcome not valid for the subscription's current status" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages tiers, coverage zones, accounts, PSAPs, dealers, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /plan-tiers", "POST /coverage-zones", "POST /accounts", "POST /psaps", "POST /dealers", "POST /_clock/set_current_utc"]
    shared_operations: ["All GET endpoints"]
  - name: Account
    description: "Vehicle owner; manages own vehicles, subscriptions, consents, remote commands, and appointments"
    identity: "entity_backed:Account"
    exclusive_operations: ["POST /accounts/{accountId}/vehicles", "POST /accounts/{accountId}/subscriptions", "subscription convert/retain-emergency/reactivate/cancel", "POST /vehicles/{vehicleId}/remote-commands", "consent create/revoke/grant"]
    shared_operations: ["GET endpoints on own resources", "appointment create/cancel"]
  - name: Advisor
    description: "Emergency advisor; connects to crash events, coordinates dispatch, closes no-injury events"
    identity: opaque
    exclusive_operations: ["POST /vehicles/{vehicleId}/crash-events/{eventId}/connect-advisor", "POST /vehicles/{vehicleId}/crash-events/{eventId}/dispatch-requests", "POST /vehicles/{vehicleId}/crash-events/{eventId}/close", "POST /dispatch-requests/{dispatchId}/cancel"]
    shared_operations: ["GET crash events, vehicles, subscriptions, coverage zones, PSAPs"]
  - name: PSAPOperator
    description: "Public safety answering point operator; acknowledges dispatch requests"
    identity: opaque
    exclusive_operations: ["POST /dispatch-requests/{dispatchId}/acknowledge"]
    shared_operations: ["GET dispatch requests, PSAPs"]
  - name: LawEnforcement
    description: "Law enforcement officer; reports stolen vehicles, verifies cases, closes cases"
    identity: opaque
    exclusive_operations: ["POST /vehicles/{vehicleId}/stolen-cases", "stolen-case verify/close-recovered/close-unverified"]
    shared_operations: ["GET vehicles, stolen cases"]
  - name: EmergencyOperator
    description: "Emergency operations specialist; arms and executes remote slowdown — never verifies the same case (segregation of duties with LawEnforcement)"
    identity: opaque
    exclusive_operations: ["stolen-case arm-slowdown/execute-slowdown"]
    shared_operations: ["GET vehicles, stolen cases, crash events, coverage zones"]
  - name: DealerService
    description: "Dealership service writer; confirms, completes, and cancels appointments"
    identity: opaque
    exclusive_operations: ["appointment confirm/complete"]
    shared_operations: ["appointment create/cancel", "GET vehicles, diagnostic reports, dealers, appointments"]
  - name: BillingAdmin
    description: "Billing system operator; records payment outcomes"
    identity: opaque
    exclusive_operations: ["POST /accounts/{accountId}/subscriptions/{subscriptionId}/billing-events"]
    shared_operations: []
  - name: SystemIngestion
    description: "Vehicle telemetry ingestion identity; reports crash events, diagnostics, and remote-command outcomes"
    identity: opaque
    exclusive_operations: ["POST /vehicles/{vehicleId}/crash-events", "POST /vehicles/{vehicleId}/diagnostic-reports", "remote-command acknowledge/fail"]
    shared_operations: ["GET /remote-commands/{commandId}"]
