  # ===========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: opt_out_purge_invalidate_demote_depth3
        grounds:
          - state_machines.AmbientConsent.GRANTED_to_OPTED_OUT
          - state_machines.AudioCapture.RECORDING_to_PURGED
          - state_machines.NoteDraft.IN_REVIEW_to_DRAFT
          - entities.AudioCapture.fields.retention_days_effective
        distinguishing_aspect: |
          Depth-3 cascade from the opt-out trigger: consent OPTED_OUT mutates
          captures (in-flight PURGED, transcribed retention clamped 90->30);
          that mutation invalidates AUDIO-sourced NoteFields; that invalidation
          demotes the IN_REVIEW draft to DRAFT and recomputes completeness to 65.
        test_recipe:
          setup:
            - "Encounter with cap1 TRANSCRIBED (planned retention 90 days) and cap2 RECORDING; draft IN_REVIEW whose chief_complaint is MANUAL and remaining fields AUDIO (via regenerate)"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-TC1-1", full_name: "Pat Tc1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-TC1-1", full_name: "Doc Tc1", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "tc1", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }, { key: "hpi", importance: "MAJOR", required: true }, { key: "exam", importance: "MAJOR", required: true }, { key: "plan", importance: "MAJOR", required: true }, { key: "ros", importance: "MINOR", required: true }] }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
              as_user_id: "${pat}"
              captures: { cons: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 90 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap1: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:02:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap1}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap1}" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:03:30Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap2: "$.data.id" }
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
