      - name: pagination_limit_outside_its_declared_bounds_is_rejected_as_invalid_request
        claim_type: violation_error
        grounds:
          - envelope.pagination_defaults
          - validations[priority=42]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          limit is bounded at min 1 and max 100 on every collection endpoint, so 0 and 101 are refused
          while 1 and 100 are accepted; a negative offset is refused while offset past the end returns an
          empty page rather than an error. Clamping silently instead of rejecting is a distinguishable
          wrong behaviour.
        test_recipe:
          setup:
            - "One film registered so the collection is non-empty."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
          trigger:
            - call: "GET /film-sales/films"
              payload: { limit: 0 }
              as: SalesAgent
              captures: { err_zero: $.data.error_id }
            - call: "GET /film-sales/films"
              payload: { limit: 101 }
              as: SalesAgent
              captures: { err_big: $.data.error_id }
            - call: "GET /film-sales/films"
              payload: { offset: -1 }
              as: SalesAgent
              captures: { err_neg: $.data.error_id }
            - call: "GET /film-sales/films"
              payload: { limit: 100, offset: 5 }
              as: SalesAgent
          assert:
            - "${err_zero} == ERR_INVALID_REQUEST at HTTP 422, not a clamp to 1"
            - "${err_big} == ERR_INVALID_REQUEST at HTTP 422, not a clamp to 100"
            - "${err_neg} == ERR_INVALID_REQUEST at HTTP 422"
            - "limit 100 with offset 5 returns HTTP 200 with an empty data array, total_count 1 and has_more false"

      - name: patch_endpoint_accepts_a_partial_body_and_leaves_unlisted_fields_alone
        claim_type: standard_crud
        grounds:
          - "endpoints[PATCH /film-sales/films/{id}]"
          - entities.Film.fields.completion_status
        distinguishing_aspect: |
          Every PATCH input is optional, so a one-key body must update only that key: patching
          completion_status leaves principal_cast_score at 88 and does NOT stale the published valuation,
          whereas the cast-score patch does. The version increments on both, which separates
          "row was written" from "dependents were invalidated".
