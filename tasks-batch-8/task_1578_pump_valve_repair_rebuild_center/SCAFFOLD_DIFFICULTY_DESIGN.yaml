            - { call: "POST /inspection-reports/${rep1}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro1}", payload: {}, as: ServiceManager, captures: { ro1_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro1}", capacity_window_id: "${win}", labor_hours: 4, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro1_v}" }, as: ServiceManager, captures: { q1: $.data.id } }
            - { call: "POST /quotes/${q1}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q1}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a2}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro2: $.data.id } }
            - { call: "POST /repair-orders/${ro2}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro2}/inspection-reports", payload: { findings_summary: "seat scored", recommended_action: "REPAIR", estimated_labor_hours: 2, part_lines: [] }, as: Inspector, captures: { rep2: $.data.id } }
            - { call: "POST /inspection-reports/${rep2}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro2}", payload: {}, as: ServiceManager, captures: { ro2_v: $.data.version } }
          trigger:
            - { call: "POST /quotes", payload: { repair_order_id: "${ro2}", capacity_window_id: "${win}", labor_hours: 2, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro2_v}" }, as: ServiceManager, captures: { err: $.data.error_id } }
          assert:
            - "CapacityWindow.${win}.window_posture == FULL (reserved 10 >= capacity 10, inclusive boundary)"
