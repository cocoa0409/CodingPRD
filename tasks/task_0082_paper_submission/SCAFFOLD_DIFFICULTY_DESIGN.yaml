scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: editor_decision_aggregation_vs_eic_discretion
        grounds:
          - calculations.aggregated_category_from_recommendation_vote
          - state_machines.EditorDecision.RECOMMENDED_to_FINALIZED
          - entities.EditorDecision.fields.aggregated_category
          - entities.EditorDecision.fields.final_decision
        distinguishing_aspect: |
          Operates on EditorDecision domain. Two valid approaches over the SAME set of
          submitted Review.recommendation values produce different outputs:
          (a) plurality vote of reviewers → aggregated_category, and (b) editor-in-chief
          discretionary override → final_decision. The two can diverge for identical reviewer
          inputs (e.g., reviewers vote 2x MAJOR_REVISION + 1x ACCEPT → aggregated_category=MAJOR_REVISION,
          but editor-in-chief finalizes ACCEPT). This instance lives on the EditorDecision entity.
        test_recipe:
          setup:
            - "Create Author A (orcid_verified=true), Manuscript M with co_author_ids=[], topic_tag=ml"
            - "Submit M (DRAFT->SUBMITTED via /submit); ingest PlagiarismCheck similarity=5.0 -> PASS"
            - "Assign SectionEditor SE; assign AssociateEditor AE (topic_tags includes ml)"
            - "Create 3 ReviewerInvitations for distinct reviewers; accept all three; submit reviews with recommendations [MAJOR_REVISION, MAJOR_REVISION, ACCEPT]"
            - "POST /manuscripts/{M}/decisions with recommendation_from_associate=ACCEPT"
            - "POST /manuscripts/{M}/decisions/{D}/recommend"
          trigger:
            - "GET /manuscripts/{M}/decisions/{D} -> read EditorDecision.aggregated_category"
            - "POST /manuscripts/{M}/decisions/{D}/finalize with final_decision=ACCEPT, decision_letter_body='ok'"
          assert:
            - "EditorDecision.aggregated_category == 'MAJOR_REVISION'"
            - "EditorDecision.final_decision == 'ACCEPT'"
            - "EditorDecision.aggregated_category != EditorDecision.final_decision"
            - "Manuscript.status == 'ACCEPTED'"

      - name: reviewer_match_subtractive_vs_multiplicative
        grounds:
          - calculations.reviewer_match_score
          - entities.ReviewerInvitation.fields.match_score
        distinguishing_aspect: |
          Operates on ReviewerInvitation domain (different entity from instance 1). Two valid
          algorithms (load_subtractive vs load_multiplicative) produce different match_score
          for the same Reviewer load and tag-match inputs. Reference implementation pins
          load_subtractive: with tag_match=1 (W_TAG=60), suggested=0, load_penalty=3 (W_LOAD=10):
          subtractive = max(0, min(100, 60 - 30)) = 30; multiplicative = max(0, min(100, 60 * (1 - 0.3))) = 42.
        test_recipe:
          setup:
            - "Create reviewer R with expertise_tags=['ml']; set active_assignments=3 via accepting 3 prior invitations"
            - "Create Manuscript M with topic_tag='ml', suggested_reviewer_ids=[], excluded_reviewer_ids=[]"
            - "Drive M to SUBMITTED + UNDER_REVIEW with associate editor"
          trigger:
            - "POST /manuscripts/{M}/invitations with reviewer_id=R"
          assert:
            - "ReviewerInvitation.match_score == 30 (load_subtractive variant pinned by scaffold)"
            - "ReviewerInvitation.match_score != 42 (would be load_multiplicative result)"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: coi_three_input_nonlinear_cap
        grounds:
          - calculations.conflict_of_interest_score
          - entities.ReviewerInvitation.fields.coi_score
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs and non-linear interaction. Three boolean signals
          (signal_co_authorship, signal_same_institution, signal_excluded) feed weighted sum
          gated by a non-linear cap (min(raw, COI_CAP)). With W_COAUTHOR=60, W_INSTITUTION=30,
          W_EXCLUDED=100, COI_CAP=100, the formula caps at 100 — e.g., (coauthor + institution + excluded)
          raw=190 → capped to 100. Three boolean inputs combine non-linearly via the cap.
        test_recipe:
          setup:
            - "Create Author A (orcid_verified=true) institution='MIT'"
            - "Create Reviewer R institution='MIT', recent_collaborator_ids=[A.id]"
            - "Create Manuscript M corresponding_author_id=A, co_author_ids=[], excluded_reviewer_ids=[R.id], topic_tag='ml'"
            - "Drive M to UNDER_REVIEW (submit, plagiarism PASS, assign section + associate editors)"
          trigger:
            - "POST /manuscripts/{M}/invitations with reviewer_id=R"
          assert:
            - "Response error_id == 'ERR_REVIEWER_CONFLICT' (coi_score=100 >= COI_REJECT_THRESHOLD=50)"
            - "HTTP status == 422"

      - name: aggregate_score_rounding_order_pinned
        grounds:
          - calculations.aggregate_score_from_ratings
          - entities.EditorDecision.fields.aggregate_score
          - state_machines.EditorDecision.DRAFT_to_RECOMMENDED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Two reviewers, ratings=[3,4], both
          MAJOR_REVISION (weight 0.835). round_then_average yields aggregate_score=2.93,
          average_then_round yields 2.92. The scaffold pins round_then_average (Order A) so
          the test asserts the literal 2.93. Identical inputs, two valid rounding orders, one
          pinned answer — different mode from instance 1 (which was the ≥3-input non-linear mode).
        test_recipe:
          setup:
            - "Set up Manuscript M in UNDER_REVIEW with AssociateEditor AE"
            - "Create 2 ReviewerInvitations, both ACCEPTED"
            - "Submit Review 1: rating=3, recommendation=MAJOR_REVISION"
            - "Submit Review 2: rating=4, recommendation=MAJOR_REVISION"
            - "POST /manuscripts/{M}/decisions (creates EditorDecision D with recommendation_from_associate=MAJOR_REVISION)"
          trigger:
            - "POST /manuscripts/{M}/decisions/{D}/recommend"
          assert:
            - "EditorDecision.aggregate_score == 2.93"
            - "EditorDecision.aggregate_score != 2.92"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: manuscript_revision_cycle
        grounds:
          - state_machines.Manuscript.UNDER_REVIEW_to_REVISION_REQUIRED
          - state_machines.Manuscript.REVISION_REQUIRED_to_REVISION_SUBMITTED
          - state_machines.Manuscript.REVISION_SUBMITTED_to_UNDER_REVIEW
          - entities.Manuscript.fields.revision_round
        distinguishing_aspect: |
          Cyclic shape on Manuscript: UNDER_REVIEW → REVISION_REQUIRED → REVISION_SUBMITTED → UNDER_REVIEW.
          A revision round can loop multiple times before terminal ACCEPTED or REJECTED. Each loop
          increments Manuscript.revision_round and supersedes prior Review rows. This is structurally
          distinct from a linear pipeline (the cycle returns to a previously occupied state).
        test_recipe:
          setup:
            - "Drive Manuscript M through SUBMITTED -> UNDER_REVIEW with 2 submitted reviews"
            - "Create EditorDecision D1, recommend, finalize with final_decision=MINOR_REVISION → M.status=REVISION_REQUIRED, revision_round=0 still"
            - "POST /manuscripts/{M}/revisions with response_letter and revised_file_uri → M.status=REVISION_SUBMITTED, revision_round=1"
          trigger:
            - "POST /manuscripts/{M}/reinvite-reviewers with reviewer_ids=[R3] → M.status=UNDER_REVIEW (cycle)"
          assert:
            - "Manuscript.status == 'UNDER_REVIEW'"
            - "Manuscript.revision_round == 1"
            - "Round-0 Review rows all have status='SUPERSEDED'"

      - name: reviewer_invitation_branching
        grounds:
          - state_machines.ReviewerInvitation.PENDING_to_ACCEPTED
          - state_machines.ReviewerInvitation.PENDING_to_DECLINED
          - state_machines.ReviewerInvitation.PENDING_to_EXPIRED
          - state_machines.ReviewerInvitation.PENDING_to_WITHDRAWN
        distinguishing_aspect: |
          Branching fork shape on ReviewerInvitation entity (different from Manuscript): one
          PENDING state forks into four distinct terminal-ish states (ACCEPTED, DECLINED, EXPIRED,
          WITHDRAWN). Each branch has divergent side effects: ACCEPTED creates a Review and bumps
          Reviewer.active_assignments; DECLINED only logs; EXPIRED is system-driven; WITHDRAWN is
          editor-driven. Structurally non-linear because PENDING branches to ≥3 outcomes with
          different actors and side-effect sets.
        test_recipe:
          setup:
            - "Create 3 ReviewerInvitations I1, I2, I3 on the same Manuscript at revision_round=0"
          trigger:
            - "POST /manuscripts/{M}/invitations/{I1}/accept by reviewer R1"
            - "POST /manuscripts/{M}/invitations/{I2}/decline by reviewer R2"
            - "POST /manuscripts/{M}/invitations/{I3}/withdraw by associate editor"
          assert:
            - "I1.status == 'ACCEPTED' and a Review row was created with status='DRAFT'"
            - "I2.status == 'DECLINED' and no Review row exists for I2"
            - "I3.status == 'WITHDRAWN'"
            - "All three branched from PENDING with distinct side effects"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: publish_issue_three_hop_cascade
        grounds:
          - state_machines.Publication.ONLINE_FIRST_to_PUBLISHED
          - state_machines.Manuscript.IN_PRODUCTION_to_PUBLISHED
          - entities.Manuscript.fields.doi
          - entities.Manuscript.fields.issue_label
        distinguishing_aspect: |
          Depth-3 chain from one triggering transition (POST /publications/{id}/publish-issue):
          hop 1 Publication.status ONLINE_FIRST→PUBLISHED; hop 2 Manuscript.status IN_PRODUCTION→PUBLISHED
          (caused by hop 1, NOT directly by the request); hop 3 Manuscript.doi and Manuscript.issue_label
          are populated from Publication (caused by hop 2's side effects, not by hop 1). Each link
          caused by the previous link, not by the original action — this is a transitive chain not a fan-out.
        test_recipe:
          setup:
            - "Drive Manuscript M to ACCEPTED state; POST /manuscripts/{M}/publications → Publication P (status=COPY_EDITING)"
            - "POST /publications/{P}/send-proof; POST /publications/{P}/approve-proof; POST /_events/doi-mint with doi='10.1234/xyz'"
          trigger:
            - "POST /publications/{P}/publish-issue"
          assert:
            - "Publication.status == 'PUBLISHED' (hop 1)"
            - "Manuscript.status == 'PUBLISHED' (hop 2, caused by hop 1)"
            - "Manuscript.doi == '10.1234/xyz' (hop 3, caused by hop 2 copying Publication.doi)"
            - "Manuscript.issue_label != null"

      - name: coauthor_decline_three_hop_cascade
        grounds:
          - state_machines.CoAuthorConfirmation.PENDING_to_DECLINED
          - state_machines.Manuscript.AWAITING_COAUTHOR_to_WITHDRAWN
          - entities.CoAuthorConfirmation.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a different triggering transition (POST /coauthor-confirmations/{cid}/decline):
          hop 1 the targeted CoAuthorConfirmation flips PENDING→DECLINED; hop 2 Manuscript transitions
          AWAITING_COAUTHOR→WITHDRAWN (caused by hop 1, bubble-up); hop 3 remaining PENDING sibling
          CoAuthorConfirmation rows on the same Manuscript flip to DECLINED with responded_at=now
          (caused by hop 2's side effects, not by the original action targeting only one row). Different
          original trigger from instance 1 (decline vs publish-issue) and originating on a different entity.
        test_recipe:
          setup:
            - "Create Manuscript M with co_author_ids=[A2, A3] (two co-authors)"
            - "POST /manuscripts/{M}/submit → M.status=AWAITING_COAUTHOR with 2 PENDING CoAuthorConfirmations C1(A2), C2(A3)"
          trigger:
            - "POST /manuscripts/{M}/coauthor-confirmations/{C1}/decline by A2"
          assert:
            - "CoAuthorConfirmation C1.status == 'DECLINED' (hop 1)"
            - "Manuscript.status == 'WITHDRAWN' (hop 2, caused by hop 1)"
            - "CoAuthorConfirmation C2.status == 'DECLINED' and C2.responded_at is non-null (hop 3, cascaded from hop 2)"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_submit
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.Manuscript.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Category pair: state (priority 5, ERR_INVALID_STATE) vs business_safety (priority 8,
          ERR_DECLARATION_INCOMPLETE). When BOTH would fail simultaneously (manuscript already in
          WITHDRAWN state AND missing declarations on the submit call), the higher-priority state
          check wins. Tests must observe ERR_INVALID_STATE, not ERR_DECLARATION_INCOMPLETE.
        test_recipe:
          setup:
            - "Create Author A (orcid_verified=true)"
            - "Create Manuscript M with title='x', corresponding_author_id=A, topic_tag='ml', review_mode='SINGLE_BLIND', manuscript_file_uri='uri', declaration_coi='', declaration_funding='', declaration_ethics='' (all blank — would fail p8), co_author_ids=[]"
            - "POST /manuscripts/{M}/withdraw → M.status=WITHDRAWN"
          trigger:
            - "POST /manuscripts/{M}/submit"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (state check at priority 5 wins)"
            - "Response error_id != 'ERR_DECLARATION_INCOMPLETE' (business_safety at priority 8 not reached)"
            - "HTTP status == 409"

      - name: state_beats_business_temporal_on_invitation_accept
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - state_machines.ReviewerInvitation.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Category pair: state (priority 5) vs business_temporal (priority 12, ERR_INVITATION_DEADLINE_PASSED).
          Different pair from instance 1 (state vs business_safety). When invitation has expired
          (deadline passed) AND manuscript has been withdrawn (state precondition fails), state check wins.
        test_recipe:
          setup:
            - "Drive Manuscript M to UNDER_REVIEW; create invitation I for reviewer R (response_deadline_at = now + 7d)"
            - "POST /_clock/advance with to = response_deadline_at + 1h (invitation now expired by time)"
            - "POST /_sweep/run is NOT called yet (invitation still PENDING)"
            - "POST /manuscripts/{M}/withdraw by author → M.status=WITHDRAWN; I.status=WITHDRAWN cascaded"
          trigger:
            - "POST /manuscripts/{M}/invitations/{I}/accept by R"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (state at priority 5 wins, ERR_INVITATION_DEADLINE_PASSED at priority 12 not raised)"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: plagiarism_threshold_inclusive_ge
        grounds:
          - calculations.plagiarism_pass_fail
          - entities.PlagiarismCheck.fields.result
          - validations[priority=15]
        distinguishing_aspect: |
          Metric: similarity_percent (numeric). Endpoint: POST /_events/plagiarism-result.
          Boundary is INCLUSIVE on FAIL side: similarity=25.0 → FAIL; similarity=24.9 → PASS.
          The >= vs > distinction matters at the exact boundary value 25.0.
        test_recipe:
          setup:
            - "Create Author A (orcid_verified=true), Manuscript M, submit to SUBMITTED"
          trigger:
            - "POST /_events/plagiarism-result with manuscript_id=M, similarity_percent=25.0, report_uri='u1' → check_1"
            - "Create second manuscript M2, submit, POST /_events/plagiarism-result with similarity_percent=24.9 → check_2"
          assert:
            - "check_1.result == 'FAIL' (25.0 >= 25.0)"
            - "check_2.result == 'PASS' (24.9 < 25.0)"

      - name: insufficient_reviews_empty_count_edge
        grounds:
          - validations[priority=14]
          - state_machines.EditorDecision.DRAFT_to_RECOMMENDED
        distinguishing_aspect: |
          Metric: count of SUBMITTED Review rows (zero/empty-set edge — different from a numeric
          threshold). Endpoint: POST /manuscripts/{mid}/decisions/{id}/recommend (different
          endpoint from instance 1). Recommend requires >= 2 SUBMITTED reviews; with exactly 1
          submitted (count=1, not 0), the check still rejects, demonstrating the >= boundary.
        test_recipe:
          setup:
            - "Drive Manuscript M to UNDER_REVIEW; create EditorDecision D with recommendation_from_associate=ACCEPT"
            - "Create 2 invitations I1, I2; accept both; submit only I1's Review"
          trigger:
            - "POST /manuscripts/{M}/decisions/{D}/recommend"
          assert:
            - "Response error_id == 'ERR_INSUFFICIENT_REVIEWS' (count=1 fails the >= 2 boundary)"
            - "Submit I2's review; retry recommend → 200 OK (count=2 passes)"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: manuscript_submit_requires_author_orcid_verified
        grounds:
          - state_machines.Manuscript.DRAFT_to_SUBMITTED
          - state_machines.Manuscript.DRAFT_to_AWAITING_COAUTHOR
          - validations[priority=7]
          - entities.Author.fields.orcid_verified
        distinguishing_aspect: |
          Entity pair: (Manuscript, Author). Manuscript.status DRAFT→SUBMITTED transition is
          gated by Author.orcid_verified == true on the corresponding_author_id. Without ORCID
          verification, submit returns ERR_ORCID_NOT_VERIFIED. The valid next-state of one
          entity (Manuscript) depends on the state of a different entity (Author).
        test_recipe:
          setup:
            - "Create Author A WITHOUT orcid_verified (default false)"
            - "Create Manuscript M with corresponding_author_id=A, valid declarations, co_author_ids=[]"
          trigger:
            - "POST /manuscripts/{M}/submit by A"
          assert:
            - "Response error_id == 'ERR_ORCID_NOT_VERIFIED', HTTP 422"
            - "POST /_events/orcid-verified for A → A.orcid_verified=true"
            - "POST /manuscripts/{M}/submit retry → Manuscript.status == 'SUBMITTED'"

      - name: invitation_accept_requires_manuscript_under_review
        grounds:
          - state_machines.ReviewerInvitation.PENDING_to_ACCEPTED
          - state_machines.Manuscript.UNDER_REVIEW_to_REVISION_REQUIRED
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair: (ReviewerInvitation, Manuscript) — different pair from instance 1.
          ReviewerInvitation.status PENDING→ACCEPTED requires parent Manuscript.status==UNDER_REVIEW.
          If the manuscript transitioned to REVISION_REQUIRED after the invitation was issued,
          the accept call must fail. The valid next-state of one entity (ReviewerInvitation)
          depends on the state of a different entity (Manuscript).
        test_recipe:
          setup:
            - "Drive Manuscript M to UNDER_REVIEW; create ReviewerInvitation I for reviewer R"
            - "Submit 2 reviews on M from other reviewers; finalize EditorDecision with MAJOR_REVISION → M.status=REVISION_REQUIRED"
          trigger:
            - "POST /manuscripts/{M}/invitations/{I}/accept by R"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE', HTTP 409"
            - "ReviewerInvitation.status remains 'PENDING' (or system may already mark WITHDRAWN — assert it is NOT 'ACCEPTED')"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: reviewer_aggregate_capacity_overlap
        grounds:
          - validations[priority=21]
          - entities.Reviewer.fields.active_assignments
          - state_machines.ReviewerInvitation.PENDING_to_ACCEPTED
          - calculations.reviewer_match_score
        distinguishing_aspect: |
          Resource: Reviewer. Interval: half-open [accept_time, submit_time) per accepted invitation.
          Interval semantics: AGGREGATE CAPACITY — count of concurrent open intervals on the same
          Reviewer is capped at REVIEWER_MAX_CONCURRENT=3. A new accept attempt is rejected when
          the count would exceed the cap. This is overlap-by-aggregate-count, distinct from
          strict-non-overlap.
        test_recipe:
          setup:
            - "Create Reviewer R; create and accept invitations I1, I2, I3 on three distinct manuscripts (each in UNDER_REVIEW), all without submitting reviews → R.active_assignments=3"
            - "Create a fourth Manuscript M4 in UNDER_REVIEW; create ReviewerInvitation I4 for R on M4"
          trigger:
            - "POST /manuscripts/{M4}/invitations/{I4}/accept by R"
          assert:
            - "Response error_id == 'ERR_REVIEWER_OVERLOADED', HTTP 422 (would push count to 4 > cap 3)"
            - "Submit one of R's prior reviews → R.active_assignments=2"
            - "Retry accept I4 → 200 OK; R.active_assignments back to 3"

      - name: editor_strict_non_overlap_acceptance_window
        grounds:
          - validations[priority=22]
          - entities.Manuscript.fields.associate_assigned_at
          - entities.Manuscript.fields.associate_window_end_at
          - state_machines.Manuscript.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Resource: Editor (different from Reviewer). Interval: closed [associate_assigned_at,
          associate_window_end_at] which equals [now, now+5d] per assignment. Interval semantics:
          STRICT NON-OVERLAP — at most ONE active assignment window may exist on a single Editor
          at a time (different from aggregate-capacity in instance 1, which allows N concurrent
          intervals up to a count cap). Any attempt to assign a second manuscript whose interval
          overlaps an open window is rejected.
        test_recipe:
          setup:
            - "Create AssociateEditor AE with topic_tags=['ml']"
            - "Create Manuscript M1: submit, plagiarism PASS, assign section editor, POST /manuscripts/{M1}/assign-associate with associate_editor_id=AE → M1.associate_window_end_at=now+5d"
            - "Create Manuscript M2 with topic_tag='ml': submit, plagiarism PASS, assign section editor"
          trigger:
            - "POST /manuscripts/{M2}/assign-associate with associate_editor_id=AE (within 5d of M1 assignment)"
          assert:
            - "Response error_id == 'ERR_EDITOR_WINDOW_OVERLAP', HTTP 422 (M1's window still open)"
            - "POST /_clock/advance to M1.associate_window_end_at + 1h; retry assign-associate on M2 → 200 OK"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reviewer_active_assignment_count_invariant
        grounds:
          - entities.Reviewer.fields.active_assignments
          - state_machines.ReviewerInvitation.PENDING_to_ACCEPTED
          - state_machines.Review.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Conserved quantity: integer count `Reviewer.active_assignments` MUST equal
          count(ReviewerInvitation rows where reviewer_id=R.id AND status=ACCEPTED AND linked Review.status=DRAFT).
          Forward action POST /invitations/{id}/accept increments active_assignments by 1 and
          creates Review(status=DRAFT). Compensating action POST /reviews/{id}/submit decrements
          active_assignments by 1 and sets Review.status=SUBMITTED. After forward+compensating,
          the invariant equation must still hold over Reviewer fields and the counted set.
        test_recipe:
          setup:
            - "Create Reviewer R; verify R.active_assignments == 0"
            - "Create Manuscript M in UNDER_REVIEW with ReviewerInvitation I for R"
          trigger:
            - "Forward: POST /manuscripts/{M}/invitations/{I}/accept → assert R.active_assignments == 1 AND Review.status='DRAFT'"
            - "PATCH /reviews/{Review.id} with rating=4, recommendation=ACCEPT, comments_to_author='x', comments_to_editor='y'"
            - "Compensating: POST /reviews/{Review.id}/submit → assert R.active_assignments == 0 AND Review.status='SUBMITTED'"
          assert:
            - "Before forward: Reviewer.active_assignments == count(invitations(reviewer_id=R, status=ACCEPTED, review.status=DRAFT)) == 0"
            - "After forward only: Reviewer.active_assignments == 1 == count(...)=1"
            - "After compensating: Reviewer.active_assignments == 0 == count(invitations(reviewer_id=R, status=ACCEPTED, review.status=DRAFT)) == 0 (invariant equation re-balanced)"

      - name: publication_doi_denormalization_invariant
        grounds:
          - entities.Manuscript.fields.doi
          - entities.Manuscript.fields.issue_label
          - entities.Publication.fields.doi
          - entities.Publication.fields.issue_label
          - state_machines.Publication.ONLINE_FIRST_to_PUBLISHED
          - state_machines.Manuscript.PUBLISHED_to_RETRACTED
          - state_machines.Publication.PUBLISHED_to_RETRACTED
        distinguishing_aspect: |
          Conserved quantity (different type from instance 1's count): denormalized DOI EQUALITY
          across two entities — Manuscript.doi == Publication.doi AND Manuscript.issue_label ==
          Publication.issue_label. Forward action POST /publications/{id}/publish-issue sets
          Publication.doi (already minted) and Publication.issue_label, then cascades to populate
          Manuscript.doi and Manuscript.issue_label. Compensating action POST /manuscripts/{id}/retract
          cascades Publication.status→RETRACTED but does NOT clear the doi fields on either entity.
          The named global quantity (the equation Manuscript.doi == Publication.doi) is preserved
          after the full forward+compensating pair.
        test_recipe:
          setup:
            - "Drive Manuscript M to ACCEPTED; create Publication P; send-proof; approve-proof; doi-mint with doi='10.1/x'"
          trigger:
            - "Forward: POST /publications/{P}/publish-issue → P.status=PUBLISHED, M.status=PUBLISHED"
            - "Compensating: POST /manuscripts/{M}/retract → M.status=RETRACTED, P.status=RETRACTED"
          assert:
            - "Before forward: Manuscript.doi == null AND Publication.doi == '10.1/x' (asymmetric, invariant not yet established)"
            - "After forward: Manuscript.doi == Publication.doi == '10.1/x' AND Manuscript.issue_label == Publication.issue_label (invariant established)"
            - "After compensating: Manuscript.doi == Publication.doi == '10.1/x' AND Manuscript.issue_label == Publication.issue_label (invariant preserved — neither side cleared)"
