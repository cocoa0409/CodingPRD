  - section: endpoints
    instances:
      - name: list_loads_pagination_envelope
        claim_type: listing_pagination
        grounds:
          - "response_envelope"
          - "endpoints"
        distinguishing_aspect: "GET /haul/loads?limit=2 over 3 loads returns exactly 2 rows with total_count == 3 and has_more == true; offset=2 returns 1 row with has_more == false; meta carries api_request_id."
        test_recipe:
          setup: ["shipper with 3 DRAFT loads"]
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 10, declared_weight_lb: 10000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 5, rate_per_loaded_mile_cents: 300, loaded_miles: 100 }, as: Dispatcher }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "SWINE", declared_head_count: 10, declared_weight_lb: 5000, origin: "A", destination: "C", planned_departure_at: "2026-08-03T08:00:00Z", planned_duration_hours: 5, rate_per_loaded_mile_cents: 300, loaded_miles: 100 }, as: Dispatcher }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "SHEEP", declared_head_count: 10, declared_weight_lb: 3000, origin: "A", destination: "D", planned_departure_at: "2026-08-04T08:00:00Z", planned_duration_hours: 5, rate_per_loaded_mile_cents: 300, loaded_miles: 100 }, as: Dispatcher }
          trigger:
            - { call: "GET /haul/loads?limit=2&offset=0", as: Any }
            - { call: "GET /haul/loads?limit=2&offset=2", as: Any }
          assert:
            - "First page: 2 rows, total_count == 3, has_more == true"
            - "Second page: 1 row, total_count == 3, has_more == false"
            - "Both responses carry meta.api_request_id and meta.api_request_timestamp"

      - name: get_load_settlement_returns_empty_array_before_depart
        claim_type: computed_read
        grounds:
          - "endpoints"
        distinguishing_aspect: "The 1:1 settlement sub-resource returns a 0-length array before depart creates the Settlement (clients handle one shape regardless of cardinality)."
        test_recipe:
          setup: ["shipper + DRAFT load (no settlement yet)"]
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 10, declared_weight_lb: 10000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 5, rate_per_loaded_mile_cents: 300, loaded_miles: 100 }, as: Dispatcher, captures: { ld: $.data.id } }
          trigger:
            - { call: "GET /haul/loads/${ld}/settlement", as: Any }
          assert:
            - "Response is an array of length 0 (http 200, response_type array)"

      - name: clock_default_proven_by_future_event_rejection
        claim_type: conditional_action
        grounds:
          - "endpoints"
          - "validations[priority=31]"
        distinguishing_aspect: "With no set_current_utc call, the logical clock reads exactly 2026-08-01T00:00:00Z: a duty event at that instant is accepted while one at 00:00:01 is rejected ERR_EVENT_IN_FUTURE."
        test_recipe:
          setup: ["driver exists; clock never set"]
          setup_api_calls:
            - { call: "POST /haul/drivers", payload: { name: "Ann", license_no: "CDL-E3" }, as: CarrierAdmin, captures: { dr: $.data.id } }
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DUTY_ON", occurred_at: "2026-08-01T00:00:00Z" }, as: CarrierAdmin }
          trigger:
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DUTY_ON", occurred_at: "2026-08-01T00:00:01Z" }, as: CarrierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Event at exactly 2026-08-01T00:00:00Z accepted (<= default clock)"
            - "Event at 2026-08-01T00:00:01Z: err == ERR_EVENT_IN_FUTURE (proves default clock is 2026-08-01T00:00:00Z, not wall-clock)"

