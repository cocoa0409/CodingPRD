scenario: |
  174. Performance Review & Compensation Planning: annual/semi-annual goals,
  360 feedback, performance calibration, Merit Increase/Promo matrix, Equity
  Refresh, PIP process, Bell Curve distribution

domain_name: performance-review-comp
api_prefix: /cycles

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
    - ops_run_checkpoint
    - rate_threshold_triggers
    - segregation_of_duties

  entity_topology: hybrid
  # Cycle is the root container; ReviewCase, CalibrationSession, CompPlan are
  # peers that all reference Employee. Goal/FeedbackRequest/PIP are children of
  # ReviewCase. Self-referential manager_employee_id on Employee.

  state_machine_shape: cyclic
  # ReviewCase supports DRAFT->SUBMITTED->RETURNED->DRAFT revision loops.
  # Employee has parallel dimensions: review_track × comp_track within a cycle.

  relationship_patterns:
    - one_to_many        # Cycle -> ReviewCase, ReviewCase -> Goal, ReviewCase -> FeedbackRequest
    - many_to_many       # FeedbackRequest connects requester Employee to reviewer Employee
    - self_referential   # Employee.manager_employee_id -> Employee.id
    - cross_aggregate    # CompPlan references ReviewCase.final_rating across aggregates

  role_model: segregation_of_duties
  # HRBP runs calibration. Manager submits reviews. Approver finalizes comp.
  # Same person cannot be reviewer AND calibrator on the same case.

  consistency_model: immediate
  # All cascades happen synchronously in the triggering request. Calibration
  # commit is an ops-run that atomically rewrites all child ratings.

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Employee display name (1-200 chars).
        constraints: "1 <= len(full_name) <= 200"
      - name: email
        type: string
        source: input
        description: Login email, unique across active employees.
        constraints: "Unique among employees with status IN {ACTIVE, ON_PIP}."
      - name: department
        type: string
        source: input
        description: Free-text department label used as bell-curve grouping key.
      - name: job_level
        type: integer
        source: input
        description: Career level used by merit/promo matrix.
        constraints: "1 <= job_level <= 10"
      - name: manager_employee_id
        type: string
        source: input
        description: Self-referential FK to the manager's Employee.id. NULL for top of tree.
        constraints: "Must reference an Employee whose status IN {ACTIVE, ON_PIP}; cannot equal own id."
      - name: base_salary_cents
        type: integer
        source: input
        description: Current annual base salary in cents.
        constraints: "base_salary_cents > 0"
      - name: equity_units_outstanding
        type: integer
        source: input
        description: Currently vested+unvested RSU units owned.
        default: 0
        constraints: "equity_units_outstanding >= 0"
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        default: ACTIVE
        constraints: "Values: {ACTIVE, ON_PIP, TERMINATED}. Producer: ACTIVE via POST /employees; ON_PIP via POST /cycles/{id}/pip-cases; TERMINATED via POST /employees/{id}/terminate or PIP_FAIL transition."
      - name: hire_date
        type: datetime
        source: input
        description: ISO 8601 UTC date the employee joined.

  - name: Cycle
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display label e.g. "FY26 H1".
      - name: cadence
        type: enum
        source: input
        description: Drives goal count and matrix lookup row.
        constraints: "Values: {ANNUAL, SEMI_ANNUAL}."
      - name: status
        type: enum
        source: computed
        description: Cycle posture; gates all child operations.
        default: OPEN
        constraints: "Values: {OPEN, IN_CALIBRATION, COMP_PLANNING, CLOSED}. Producer: OPEN via POST /cycles; IN_CALIBRATION via POST /cycles/{id}/lock-reviews; COMP_PLANNING via POST /cycles/{id}/calibration-sessions/{cid}/commit; CLOSED via POST /cycles/{id}/close."
      - name: review_window_start
        type: datetime
        source: input
        description: Inclusive start of the period under review (ISO 8601 UTC).
      - name: review_window_end
        type: datetime
        source: input
        description: Inclusive end of the period under review.
        constraints: "review_window_end > review_window_start"
      - name: bell_curve_target
        type: object
        source: input
        description: |
          Required percentage of population per rating bucket; keys must equal the
          five rating buckets exactly. Stored as integer percents that sum to 100.
        constraints: |
          Exactly five keys: {OUTSTANDING, EXCEEDS, MEETS, NEEDS_IMPROVEMENT, UNSATISFACTORY}.
          Each percent in [0, 100]. Sum across keys == 100.
      - name: merit_budget_cents
        type: integer
        source: input
        description: Total merit-increase pool authorized for the cycle, in cents.
        constraints: "merit_budget_cents >= 0"
      - name: equity_refresh_pool_units
        type: integer
        source: input
        description: Total refresh-RSU pool authorized for the cycle.
        constraints: "equity_refresh_pool_units >= 0"
      - name: merit_budget_consumed_cents
        type: integer
        source: computed
        description: Running sum of approved merit increases. Recomputed on every CompPlan APPROVED transition.
        default: 0
      - name: equity_pool_consumed_units
        type: integer
        source: computed
        description: Running sum of approved equity refresh units.
        default: 0

  - name: ReviewCase
    parent: Cycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK to Cycle.id (also encoded in URL path).
      - name: subject_employee_id
        type: string
        source: input
        description: FK to Employee.id, the employee being reviewed.
        constraints: "Must reference an Employee with status IN {ACTIVE, ON_PIP}. Unique per (cycle_id, subject_employee_id)."
      - name: manager_employee_id
        type: string
        source: computed
        description: Snapshot of Employee.manager_employee_id at case creation; pinned for the cycle.
      - name: status
        type: enum
        source: computed
        description: Review lifecycle.
        default: DRAFT
        constraints: "Values: {DRAFT, SUBMITTED, RETURNED, LOCKED, FINALIZED}. Producer: DRAFT via POST /cycles/{cid}/review-cases; SUBMITTED via POST .../submit; RETURNED via POST .../return; LOCKED via POST /cycles/{id}/lock-reviews (system); FINALIZED via calibration commit (system)."
      - name: manager_rating
        type: enum
        source: input
        description: Manager's proposed rating prior to calibration.
        constraints: "Values: {OUTSTANDING, EXCEEDS, MEETS, NEEDS_IMPROVEMENT, UNSATISFACTORY}. Required to submit."
      - name: final_rating
        type: enum
        source: computed
        description: Post-calibration rating written by the committed CalibrationSession; immutable thereafter.
        constraints: "Values: same five buckets. Set only by calibration commit."
      - name: weighted_goal_score
        type: number
        source: computed
        description: Sum over goals of weight*self_score normalized to 0..5.00. Recomputed each PATCH to a Goal.
        default: 0
      - name: peer_feedback_count
        type: integer
        source: computed
        description: Number of FeedbackRequests on this case with status SUBMITTED. Recomputed on each FeedbackRequest submission.
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: Number of RETURNED->DRAFT transitions taken so far.
        default: 0

  - name: Goal
    parent: ReviewCase
    common_fields: true
    fields:
      - name: review_case_id
        type: string
        source: input
        description: FK to ReviewCase.id (also in URL path).
      - name: title
        type: string
        source: input
        description: Goal description (1-500 chars).
      - name: weight
        type: integer
        source: input
        description: Integer percent weight (1..100). Sum across the case's goals must equal 100 on submit.
        constraints: "1 <= weight <= 100"
      - name: self_score
        type: integer
        source: input
        description: 1..5 Likert self-assessment.
        constraints: "1 <= self_score <= 5; required to submit the parent ReviewCase."
      - name: manager_score
        type: integer
        source: input
        description: 1..5 Likert manager assessment.
        constraints: "1 <= manager_score <= 5; required to submit the parent ReviewCase."

  - name: FeedbackRequest
    parent: ReviewCase
    common_fields: false  # append-only after submission (no in-place edits)
    fields:
      - name: review_case_id
        type: string
        source: input
        description: FK to ReviewCase.id.
      - name: reviewer_employee_id
        type: string
        source: input
        description: FK to Employee.id of the 360 reviewer.
        constraints: |
          reviewer_employee_id != ReviewCase.subject_employee_id
          (no self-reviews; manager case is the dedicated channel).
      - name: relation
        type: enum
        source: input
        description: 360 relation classification.
        constraints: "Values: {PEER, UPWARD, DOWNWARD, CROSS_FUNCTIONAL}."
      - name: status
        type: enum
        source: computed
        description: Request lifecycle.
        default: PENDING
        constraints: "Values: {PENDING, SUBMITTED, DECLINED}. Producer: PENDING via POST .../feedback-requests; SUBMITTED via POST .../submit; DECLINED via POST .../decline."
      - name: narrative
        type: string
        source: input
        description: Free-text feedback. Required on submit. 50..5000 chars.
        constraints: "If status == SUBMITTED then 50 <= len(narrative) <= 5000."
      - name: submitted_at
        type: datetime
        source: computed
        description: Server clock time of submit; null while PENDING/DECLINED.

  - name: CalibrationSession
    parent: Cycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK to Cycle.id.
      - name: department
        type: string
        source: input
        description: Bell-curve grouping label. Unique per (cycle_id, department).
      - name: facilitator_employee_id
        type: string
        source: input
        description: HRBP running the session. Must NOT be the manager_employee_id of any included ReviewCase (segregation of duties).
      - name: status
        type: enum
        source: computed
        description: Session lifecycle.
        default: SCHEDULED
        constraints: "Values: {SCHEDULED, IN_SESSION, COMMITTED, ABANDONED}. Producer: SCHEDULED via POST .../calibration-sessions; IN_SESSION via POST .../start; COMMITTED via POST .../commit; ABANDONED via POST .../abandon."
      - name: proposed_ratings
        type: array
        source: input
        description: |
          Ordered list of {review_case_id, proposed_rating} pairs the committee
          has agreed on. Set via PATCH .../proposals; must cover every locked
          ReviewCase whose subject is in this department exactly once at commit.
      - name: bell_curve_distribution
        type: object
        source: computed
        description: Five-bucket histogram of proposed_ratings. Recomputed on each PATCH .../proposals.
        default: { OUTSTANDING: 0, EXCEEDS: 0, MEETS: 0, NEEDS_IMPROVEMENT: 0, UNSATISFACTORY: 0 }
      - name: committed_at
        type: datetime
        source: computed
        description: Server clock time of commit; null until COMMITTED.

  - name: PIPCase
    parent: Cycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK to Cycle.id (originating cycle).
      - name: subject_employee_id
        type: string
        source: input
        description: FK to Employee.id.
        constraints: "Unique per (cycle_id, subject_employee_id). Employee must be ACTIVE."
      - name: triggering_review_case_id
        type: string
        source: input
        description: FK to the ReviewCase whose final_rating == NEEDS_IMPROVEMENT or UNSATISFACTORY caused the PIP.
        constraints: "ReviewCase must be FINALIZED and ReviewCase.final_rating IN {NEEDS_IMPROVEMENT, UNSATISFACTORY}."
      - name: duration_days
        type: integer
        source: computed
        description: Server-pinned PIP length, derived from triggering rating.
        constraints: "60 if triggering_rating == NEEDS_IMPROVEMENT; 30 if UNSATISFACTORY."
      - name: starts_at
        type: datetime
        source: computed
        description: Server clock time at PIPCase creation (cycle commit + admin action).
      - name: ends_at
        type: datetime
        source: computed
        description: starts_at + duration_days * 86400 seconds.
      - name: status
        type: enum
        source: computed
        description: PIP lifecycle.
        default: ACTIVE
        constraints: "Values: {ACTIVE, PASSED, FAILED, WITHDRAWN}. Producer: ACTIVE via POST /cycles/{id}/pip-cases; PASSED via POST .../pass (manual, only after clock advance >= ends_at); FAILED via POST .../fail (manual, only after clock advance >= ends_at); WITHDRAWN via POST .../withdraw."

  - name: CompPlan
    parent: Cycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK to Cycle.id.
      - name: subject_employee_id
        type: string
        source: input
        description: FK to Employee.id. Unique per (cycle_id, subject_employee_id).
      - name: pinned_review_case_id
        type: string
        source: computed
        description: Snapshot FK to the ReviewCase used to compute this plan. Version-pinned on plan creation; if the case version changes the plan is invalidated.
      - name: pinned_review_case_version
        type: integer
        source: computed
        description: ReviewCase.version at plan creation time.
      - name: pinned_base_salary_cents
        type: integer
        source: computed
        description: Snapshot of Employee.base_salary_cents at plan creation.
      - name: merit_increase_cents
        type: integer
        source: computed
        description: Output of merit_increase_amount calculation; sign-flipped to 0 for ON_PIP employees.
        default: 0
      - name: promotion_to_level
        type: integer
        source: input
        description: Optional target job_level (must be exactly current+1, blocked while ON_PIP).
      - name: equity_refresh_units
        type: integer
        source: computed
        description: Output of equity_refresh_amount calculation.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Plan lifecycle.
        default: DRAFT
        constraints: "Values: {DRAFT, PROPOSED, APPROVED, REJECTED}. Producer: DRAFT via POST /cycles/{id}/comp-plans; PROPOSED via POST .../propose; APPROVED via POST .../approve; REJECTED via POST .../reject."
      - name: approved_at
        type: datetime
        source: computed
        description: Server clock time at APPROVED transition; null otherwise.

  - name: AuditEvent
    parent: null
    common_fields: false  # append-only ledger
    fields:
      - name: actor_role
        type: enum
        source: system
        description: Role header at the time of the event.
        constraints: "Values: {Manager, Reviewer, HRBP, Approver, Admin, system}."
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID header at the time of the event (Employee.id or 'system').
      - name: entity_type
        type: string
        source: system
        description: Name of the affected entity.
      - name: entity_id
        type: string
        source: system
        description: id of the affected entity.
      - name: action
        type: string
        source: system
        description: Verb describing the action (e.g. 'review_case.submit', 'calibration_session.commit', 'comp_plan.approve').
      - name: payload_hash
        type: string
        source: system
        description: SHA-256 of the request body, hex.
      - name: occurred_at
        type: datetime
        source: system
        description: Server clock time of the event.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Cycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_CALIBRATION
        trigger: "POST /cycles/{id}/lock-reviews"
        actor: HRBP
        preconditions:
          - "Every ReviewCase belonging to this cycle has status IN {SUBMITTED, RETURNED} or has been waived."
          - "Cycle.status == OPEN."
        side_effects:
          - "Every ReviewCase.status SUBMITTED -> LOCKED (cascade)."
          - "Cycle.updated_at refreshed; version incremented."
        note: "First leg of the cascade chain that drives ratings into calibration."

      - from: IN_CALIBRATION
        to: COMP_PLANNING
        trigger: "POST /cycles/{id}/calibration-sessions/{cid}/commit (last department commit)"
        actor: HRBP
        preconditions:
          - "Every CalibrationSession on this cycle has status == COMMITTED (no SCHEDULED / IN_SESSION sessions left)."
          - "Every locked ReviewCase has received a final_rating."
        side_effects:
          - "Every ReviewCase.final_rating == NEEDS_IMPROVEMENT or UNSATISFACTORY triggers automatic creation of a PIPCase (status ACTIVE) for the subject; Employee.status -> ON_PIP."
          - "Cycle.updated_at refreshed; version incremented."

      - from: COMP_PLANNING
        to: CLOSED
        trigger: "POST /cycles/{id}/close"
        actor: HRBP
        preconditions:
          - "Every CompPlan on this cycle has status IN {APPROVED, REJECTED}."
          - "Cycle.merit_budget_consumed_cents <= Cycle.merit_budget_cents."
          - "Cycle.equity_pool_consumed_units <= Cycle.equity_refresh_pool_units."
        side_effects:
          - "Every APPROVED CompPlan with merit_increase_cents > 0 mutates Employee.base_salary_cents += merit_increase_cents."
          - "Every APPROVED CompPlan with equity_refresh_units > 0 mutates Employee.equity_units_outstanding += equity_refresh_units."
          - "Every APPROVED CompPlan with promotion_to_level set mutates Employee.job_level = promotion_to_level."
          - "Cycle.updated_at refreshed; version incremented."
        note: |
          Depth-3 transitive cascade originating here:
          (1) Cycle.close mutates each CompPlan into 'applied' (writes Employee.base_salary_cents).
          (2) That mutation on Employee triggers Employee.version bump; any open PIPCase whose ends_at has elapsed remains untouched (PIP closes only via /pass /fail).
          See concurrency_rules below for the exact race.

  - entity: ReviewCase
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cycles/{cid}/review-cases/{id}/submit"
        actor: Manager
        preconditions:
          - "Cycle.status == OPEN."
          - "ReviewCase.manager_rating IS NOT NULL."
          - "Sum of Goal.weight across the case's goals == 100."
          - "Every Goal has self_score AND manager_score in [1,5]."
          - "ReviewCase.peer_feedback_count >= 2 (at least two SUBMITTED FeedbackRequests)."
        side_effects:
          - "ReviewCase.weighted_goal_score recomputed (formula `weighted_goal_score`)."
          - "ReviewCase.updated_at refreshed; version incremented."

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /cycles/{cid}/review-cases/{id}/return"
        actor: HRBP
        preconditions:
          - "Cycle.status == OPEN."
          - "ReviewCase.revision_count < 3."
        side_effects:
          - "ReviewCase.revision_count += 1."
          - "ReviewCase.updated_at refreshed; version incremented."
        note: "Cycle: RETURNED can re-enter DRAFT, supporting up to three revision loops."

      - from: RETURNED
        to: DRAFT
        trigger: "POST /cycles/{cid}/review-cases/{id}/reopen"
        actor: Manager
        preconditions:
          - "Cycle.status == OPEN."
        side_effects:
          - "ReviewCase.updated_at refreshed; version incremented."

      - from: SUBMITTED
        to: LOCKED
        trigger: "POST /cycles/{id}/lock-reviews"
        actor: system
        preconditions:
          - "Cycle.status transitions OPEN -> IN_CALIBRATION."
        side_effects:
          - "ReviewCase.updated_at refreshed; version incremented."

      - from: LOCKED
        to: FINALIZED
        trigger: "POST /cycles/{cid}/calibration-sessions/{sid}/commit"
        actor: system
        preconditions:
          - "Containing CalibrationSession is being COMMITTED."
          - "The case appears exactly once in CalibrationSession.proposed_ratings."
        side_effects:
          - "ReviewCase.final_rating := the proposed_rating for this case."
          - "ReviewCase.updated_at refreshed; version incremented."
          - "If final_rating IN {NEEDS_IMPROVEMENT, UNSATISFACTORY} a PIPCase is auto-created for the subject (status ACTIVE) and Employee.status -> ON_PIP."

  - entity: FeedbackRequest
    initial_state: PENDING
    terminal_states: [SUBMITTED, DECLINED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /cycles/{cid}/review-cases/{rid}/feedback-requests/{id}/submit"
        actor: Reviewer
        preconditions:
          - "Parent ReviewCase.status IN {DRAFT, RETURNED}."
          - "narrative provided and 50 <= len <= 5000."
          - "Acting reviewer == FeedbackRequest.reviewer_employee_id."
        side_effects:
          - "FeedbackRequest.submitted_at = clock_now()."
          - "ReviewCase.peer_feedback_count += 1."
          - "ReviewCase.updated_at refreshed; version incremented."

      - from: PENDING
        to: DECLINED
        trigger: "POST /cycles/{cid}/review-cases/{rid}/feedback-requests/{id}/decline"
        actor: Reviewer
        preconditions:
          - "Acting reviewer == FeedbackRequest.reviewer_employee_id."
        side_effects:
          - "FeedbackRequest.updated_at NOT incremented because common_fields:false. Append-only ledger semantics: a new audit event is logged."

  - entity: CalibrationSession
    initial_state: SCHEDULED
    terminal_states: [COMMITTED, ABANDONED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /cycles/{cid}/calibration-sessions/{id}/start"
        actor: HRBP
        preconditions:
          - "Cycle.status == IN_CALIBRATION."
          - "facilitator_employee_id is NOT the manager_employee_id of any ReviewCase whose subject is in this department (segregation of duties)."
        side_effects:
          - "CalibrationSession.updated_at refreshed; version incremented."

      - from: IN_SESSION
        to: COMMITTED
        trigger: "POST /cycles/{cid}/calibration-sessions/{id}/commit"
        actor: HRBP
        preconditions:
          - "Cycle.status == IN_CALIBRATION."
          - "Every locked ReviewCase whose subject.department == session.department appears exactly once in proposed_ratings."
          - "bell_curve_distribution complies with Cycle.bell_curve_target within +/- 5 percentage points per bucket (rounded down on count_for_bucket / total_cases * 100)."
        side_effects:
          - "Each ReviewCase in proposed_ratings transitions LOCKED -> FINALIZED (cascade hop 1)."
          - "Any FINALIZED ReviewCase whose final_rating IN {NEEDS_IMPROVEMENT, UNSATISFACTORY} auto-creates a PIPCase ACTIVE for the subject (cascade hop 2)."
          - "The subject Employee.status flips ACTIVE -> ON_PIP for each such PIPCase (cascade hop 3)."
          - "CalibrationSession.committed_at = clock_now()."

      - from: SCHEDULED
        to: ABANDONED
        trigger: "POST /cycles/{cid}/calibration-sessions/{id}/abandon"
        actor: HRBP
        preconditions:
          - "Cycle.status IN {OPEN, IN_CALIBRATION}."
        side_effects:
          - "Session is removed from the calibration set; subjects fall to default rating == manager_rating when /lock-reviews next runs."

      - from: IN_SESSION
        to: ABANDONED
        trigger: "POST /cycles/{cid}/calibration-sessions/{id}/abandon"
        actor: HRBP
        preconditions: []
        side_effects: []

  - entity: PIPCase
    initial_state: ACTIVE
    terminal_states: [PASSED, FAILED, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: PASSED
        trigger: "POST /cycles/{cid}/pip-cases/{id}/pass"
        actor: HRBP
        preconditions:
          - "clock_now() >= PIPCase.ends_at."
        side_effects:
          - "Employee.status flips ON_PIP -> ACTIVE."
          - "Audit event logged."

      - from: ACTIVE
        to: FAILED
        trigger: "POST /cycles/{cid}/pip-cases/{id}/fail"
        actor: HRBP
        preconditions:
          - "clock_now() >= PIPCase.ends_at."
        side_effects:
          - "Employee.status flips ON_PIP -> TERMINATED."
          - "Any DRAFT or PROPOSED CompPlan for this subject in the cycle transitions to REJECTED automatically (cascade)."

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /cycles/{cid}/pip-cases/{id}/withdraw"
        actor: HRBP
        preconditions:
          - "clock_now() < PIPCase.ends_at."
        side_effects:
          - "Employee.status flips ON_PIP -> ACTIVE."

  - entity: CompPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /cycles/{cid}/comp-plans/{id}/propose"
        actor: Manager
        preconditions:
          - "Cycle.status == COMP_PLANNING."
          - "Pinned ReviewCase.version still equals the current ReviewCase.version (version-pinning check)."
          - "Subject Employee.status IN {ACTIVE, ON_PIP}."
        side_effects:
          - "merit_increase_cents and equity_refresh_units recomputed (calculations merit_increase_amount, equity_refresh_amount)."
          - "CompPlan.updated_at refreshed; version incremented."

      - from: PROPOSED
        to: APPROVED
        trigger: "POST /cycles/{cid}/comp-plans/{id}/approve"
        actor: Approver
        preconditions:
          - "Cycle.status == COMP_PLANNING."
          - "Pinned ReviewCase.version still equals current ReviewCase.version."
          - "Approver != the ReviewCase.manager_employee_id (segregation of duties)."
          - "Cycle.merit_budget_consumed_cents + merit_increase_cents <= Cycle.merit_budget_cents."
          - "Cycle.equity_pool_consumed_units + equity_refresh_units <= Cycle.equity_refresh_pool_units."
          - "If promotion_to_level set: subject Employee.status == ACTIVE (not ON_PIP)."
        side_effects:
          - "Cycle.merit_budget_consumed_cents += merit_increase_cents."
          - "Cycle.equity_pool_consumed_units += equity_refresh_units."
          - "CompPlan.approved_at = clock_now()."
          - "CompPlan.updated_at refreshed; version incremented."

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /cycles/{cid}/comp-plans/{id}/reject"
        actor: Approver
        preconditions:
          - "Cycle.status == COMP_PLANNING."
        side_effects:
          - "CompPlan.updated_at refreshed; version incremented."

      - from: APPROVED
        to: REJECTED
        trigger: "POST /cycles/{cid}/comp-plans/{id}/recall"
        actor: Approver
        preconditions:
          - "Cycle.status == COMP_PLANNING (cannot recall after Cycle is CLOSED)."
        side_effects:
          - "Cycle.merit_budget_consumed_cents -= merit_increase_cents (compensating release)."
          - "Cycle.equity_pool_consumed_units -= equity_refresh_units (compensating release)."
          - "CompPlan.updated_at refreshed; version incremented."
        note: |
          Compensating-action invariant: for any approve/recall pair on the same plan,
          Cycle.merit_budget_consumed_cents and Cycle.equity_pool_consumed_units MUST
          equal their values from the moment before the approve. See §1.8 invariants.

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two managers submit the same ReviewCase via separate requests at the same time"
    guarantee: "Exactly one submit reaches SUBMITTED; the other sees the case already advanced."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ReviewCase.status."

  - scenario: "Manager submits while HRBP locks reviews"
    guarantee: "Either submit completes against OPEN cycle, or lock completes against unchanged set; never both partially."
    error_id: ERR_CYCLE_NOT_OPEN
    http_status: 409
    serialization: "First-writer-wins on Cycle.status."

  - scenario: "Two CompPlan approves race for the same merit budget"
    guarantee: "At most one approve succeeds whose merit_increase_cents would exhaust the budget; the loser is rejected for budget."
    error_id: ERR_MERIT_BUDGET_EXCEEDED
    http_status: 422
    serialization: "First-writer-wins on Cycle.merit_budget_consumed_cents (monotonic guard)."

  - scenario: "Two CompPlan approves race for the equity pool"
    guarantee: "At most one approve succeeds whose equity_refresh_units would exhaust the pool; the loser is rejected for equity pool."
    error_id: ERR_EQUITY_POOL_EXHAUSTED
    http_status: 422
    serialization: "First-writer-wins on Cycle.equity_pool_consumed_units."

  - scenario: "Approve CompPlan races with ReviewCase RETURNED (case version bumps)"
    guarantee: "If the case version changed since the plan was created, the approve is rejected; the loser sees a pin mismatch."
    error_id: ERR_PINNED_REVIEW_STALE
    http_status: 409
    serialization: "Version equality check on ReviewCase.version at the moment of approve."

  - scenario: "Two PIPCase creations race for the same (cycle, employee)"
    guarantee: "At most one PIPCase per (cycle_id, subject_employee_id); the second is rejected."
    error_id: ERR_PIP_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique constraint on (cycle_id, subject_employee_id)."

  - scenario: "Two FeedbackRequest submissions from the same reviewer race"
    guarantee: "Exactly one submit reaches SUBMITTED; the second sees status mismatch."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on FeedbackRequest.status."

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: weighted_goal_score
    trigger: "On ReviewCase submit (DRAFT->SUBMITTED) and on every PATCH /goals/{id} that touches manager_score or weight."
    algorithm: weighted_scoring
    formula: |
      sum_over_goals( weight_i * manager_score_i ) / 100.0
      rounded to 2 decimal places, round_half_up.
      (Self_score is collected but is NOT a term in the formula; see variant.)
    input_set: "All Goals where Goal.review_case_id == ReviewCase.id, sorted by Goal.created_at ASC for deterministic order."
    constants:
      MIN_SCORE: 1
      MAX_SCORE: 5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: self_assessment_provisional
        when: "Returned to drafter view (ReviewCase.status == DRAFT or RETURNED) where the manager has not yet supplied manager_score for every Goal."
        difference: |
          Uses self_score in place of manager_score for any Goal whose manager_score is null:
          sum(weight_i * (manager_score_i if not null else self_score_i)) / 100.0.
          Same precision. Produces a different number than the official formula
          for any case with at least one unsubmitted manager_score.

  - name: merit_increase_amount
    trigger: "On CompPlan DRAFT->PROPOSED and again on PROPOSED->APPROVED."
    algorithm: tiered_pricing
    formula: |
      Lookup row by Cycle.cadence:
        ANNUAL:      base merit table BMA
        SEMI_ANNUAL: every cell of BMA divided by 2 (integer division of cents, floor)
      Lookup column by ReviewCase.final_rating:
        OUTSTANDING        -> base merit pct OB = 9
        EXCEEDS            -> EB = 6
        MEETS              -> MB = 3
        NEEDS_IMPROVEMENT  -> NB = 0
        UNSATISFACTORY     -> UB = 0
      raw_cents = floor( pinned_base_salary_cents * BMA_pct / 100 )
      if CompPlan.promotion_to_level is set and rating IN {OUTSTANDING, EXCEEDS}:
        raw_cents += floor( pinned_base_salary_cents * PROMO_BUMP_PCT / 100 )    # PROMO_BUMP_PCT = 5
      if Employee.status == ON_PIP: result = 0 (PIP gates all merit).
      Final value is the integer cents result.
    input_set: "CompPlan.pinned_base_salary_cents (snapshot at plan creation), ReviewCase.final_rating, Cycle.cadence, CompPlan.promotion_to_level."
    constants:
      OB_PCT: 9
      EB_PCT: 6
      MB_PCT: 3
      NB_PCT: 0
      UB_PCT: 0
      PROMO_BUMP_PCT: 5
    precision: "integer cents, floor at each multiplication step (per-line floor)."
    variants:
      - name: promo_eligible_path
        when: "CompPlan.promotion_to_level is set AND final_rating IN {OUTSTANDING, EXCEEDS} AND Employee.status == ACTIVE."
        difference: |
          Adds PROMO_BUMP_PCT (5%) of pinned_base_salary_cents to the raw merit.
          On the same inputs the non-promo path produces strictly less.
          For pinned_base_salary_cents=10_000_000 (=$100,000), ANNUAL, EXCEEDS:
            non-promo:  floor(10_000_000 * 6 / 100) = 600_000 cents ($6,000)
            promo:      floor(10_000_000 * 6 / 100) + floor(10_000_000 * 5 / 100)
                        = 600_000 + 500_000 = 1_100_000 cents ($11,000)
      - name: pip_zero_path
        when: "Employee.status == ON_PIP at the moment of propose/approve."
        difference: |
          Result is 0 cents regardless of rating or base salary. On the same
          base salary as above this differs by the full 600_000 cents.

  - name: equity_refresh_amount
    trigger: "On CompPlan DRAFT->PROPOSED and again on PROPOSED->APPROVED."
    algorithm: tiered_pricing
    formula: |
      Lookup grant_units_table[job_level][final_rating]:
        Levels 1-3:   OUTSTANDING=200, EXCEEDS=100, MEETS=50,  NI=0, UNSAT=0
        Levels 4-6:   OUTSTANDING=600, EXCEEDS=300, MEETS=150, NI=0, UNSAT=0
        Levels 7-10:  OUTSTANDING=1500, EXCEEDS=800, MEETS=400, NI=0, UNSAT=0
      multiplier:
        ANNUAL      -> 1.0
        SEMI_ANNUAL -> 0.5  (round half up to nearest integer unit AFTER multiplier)
      promotion bump: if promotion_to_level set AND final_rating IN {OUTSTANDING, EXCEEDS},
        bump = floor(base_units * 0.25) using level grant for the NEW level (promotion_to_level).
      Total = round_half_up( base_units * multiplier ) + bump.
      Then guard: if Employee.status == ON_PIP, result = 0.
    input_set: "ReviewCase.final_rating, Employee.job_level (pinned at plan creation), Cycle.cadence, CompPlan.promotion_to_level."
    constants:
      MULT_ANNUAL: 1.0
      MULT_SEMI: 0.5
      PROMO_BUMP_FACTOR: 0.25
    precision: |
      MULTIPLIER FIRST, then round_half_up to integer units, then add the
      already-rounded bump. (Pinned order: do not 'sum then round' — that
      would produce different units when both terms share a fractional half.)
    variants:
      - name: round_then_sum
        when: "Reference order: apply multiplier with round_half_up to base BEFORE adding the bump."
        difference: |
          Pinned-order example: level 4, EXCEEDS, SEMI_ANNUAL, promotion to level 5:
            base = 300; base*0.5 = 150.0; round_half_up(150.0) = 150
            bump = floor( grant_units_table[5][EXCEEDS] * 0.25 )
                 = floor( 300 * 0.25 ) = 75
            pinned total = 150 + 75 = 225.
        # The 'wrong order' (sum-then-round) would compute:
        #   raw = 300*0.5 + 300*0.25 = 150.0 + 75.0 = 225.0  (same here)
        # but for level 4, MEETS, SEMI_ANNUAL, no promo:
        #   base = 150; base*0.5 = 75.0; round_half_up = 75
        #   pinned total = 75
        # The order-collision case bites in equity_refresh_amount when half-units
        # appear: level 1, MEETS, SEMI_ANNUAL: base=50; base*0.5=25.0; bump=0.
        # Pinned total = 25. We pin 'multiplier first then round' as the
        # canonical rule; any 'sum-then-round' implementation diverges on
        # any plan combining a half-step base AND a fractional bump.

  - name: bell_curve_compliance
    trigger: "On every PATCH /cycles/{cid}/calibration-sessions/{sid}/proposals; gates the COMMIT transition."
    algorithm: threshold
    formula: |
      For each rating bucket R in {OUTSTANDING, EXCEEDS, MEETS, NEEDS_IMPROVEMENT, UNSATISFACTORY}:
        observed_pct[R] = floor( 100 * count_of_proposed_ratings_equal_to_R / total_proposed )
      total_proposed = len(proposed_ratings).
      Compliance: for each R, abs( observed_pct[R] - target_pct[R] ) <= 5.
      Returns boolean + offending_buckets list (empty if compliant).
    input_set: "CalibrationSession.proposed_ratings (an array). Cycle.bell_curve_target."
    constants:
      TOLERANCE_PCT_POINTS: 5
    precision: "Integer percent comparison; observed uses floor."
    variants:
      - name: strict_floor
        when: "Default."
        difference: |
          Uses floor on the percentage; e.g. 5 out of 24 = floor(20.83) = 20.
      - name: rounding_alt
        when: "Reference: any implementation that 'rounds half up' before comparing diverges from the pinned floor."
        difference: |
          For 7 out of 24 = floor(29.16) = 29 vs round_half_up = 29.
          For 4 out of 24 = floor(16.66) = 16 vs round_half_up = 17.
          A 16% vs 17% observed against a 20% target produces different
          tolerance evaluations at the 5pp boundary.

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers present."
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "X-User-Role value is one of {Manager, Reviewer, HRBP, Approver, Admin}."
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 30
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC matrix."
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 40
    category: existence
    check: "Path-parameter cycle_id resolves to an existing Cycle."
    error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "all /cycles/{cycle_id}/* endpoints"

  - priority: 41
    category: existence
    check: "Path-parameter review_case_id resolves to an existing ReviewCase under that cycle."
    error_id: ERR_REVIEW_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all /cycles/{cid}/review-cases/{rid}/* endpoints"

  - priority: 42
    category: existence
    check: "Path-parameter calibration_session_id resolves to an existing CalibrationSession under that cycle."
    error_id: ERR_CALIBRATION_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "all /cycles/{cid}/calibration-sessions/{sid}/* endpoints"

  - priority: 43
    category: existence
    check: "Path-parameter comp_plan_id, pip_case_id, goal_id, feedback_request_id, employee_id resolves to an existing record under its parent."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all other /.../{id}/* endpoints"

  - priority: 44
    category: existence
    check: "Any FK in body (manager_employee_id, subject_employee_id, reviewer_employee_id, triggering_review_case_id, facilitator_employee_id) resolves to an existing record."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PATCH that accept those FKs"

  - priority: 50
    category: state
    check: "Cycle.status == OPEN when adding/editing ReviewCase, Goal, or FeedbackRequest."
    error_id: ERR_CYCLE_NOT_OPEN
    http_status: 409
    applies_to: "POST /cycles/{cid}/review-cases, PATCH .../review-cases/{rid}, POST/PATCH/DELETE /cycles/{cid}/review-cases/{rid}/goals*, POST .../feedback-requests*"

  - priority: 51
    category: state
    check: "Target ReviewCase.status matches the transition's `from:` value."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST .../review-cases/{rid}/submit, .../return, .../reopen"

  - priority: 52
    category: state
    check: "CalibrationSession.status matches the transition's `from:` value."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST .../calibration-sessions/{sid}/start, .../commit, .../abandon"

  - priority: 53
    category: state
    check: "CompPlan.status matches the transition's `from:` value."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST .../comp-plans/{id}/propose, .../approve, .../reject, .../recall"

  - priority: 54
    category: state
    check: "PIPCase.status matches the transition's `from:` value."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST .../pip-cases/{id}/pass, .../fail, .../withdraw"

  - priority: 60
    category: business_safety
    check: "PIP guard on promotion: CompPlan.promotion_to_level may not be set if Employee.status == ON_PIP."
    error_id: ERR_PROMO_BLOCKED_BY_PIP
    http_status: 422
    applies_to: "POST/PATCH .../comp-plans*, .../propose, .../approve"
    # Priority sits ABOVE the budget check (priority 90) so an ON_PIP promo
    # surfaces ERR_PROMO_BLOCKED_BY_PIP even when the same plan would exceed budget.

  - priority: 61
    category: business_safety
    check: "Segregation of duties (calibration): CalibrationSession.facilitator_employee_id != manager_employee_id of any ReviewCase in this session's department."
    error_id: ERR_FACILITATOR_CONFLICT
    http_status: 422
    applies_to: "POST /cycles/{cid}/calibration-sessions, .../start, .../commit"

  - priority: 62
    category: business_safety
    check: "Segregation of duties (compensation): The Approver acting on a CompPlan must NOT be the manager_employee_id of its pinned ReviewCase."
    error_id: ERR_APPROVER_IS_MANAGER
    http_status: 422
    applies_to: "POST .../comp-plans/{id}/approve, .../reject, .../recall"

  - priority: 63
    category: business_safety
    check: "Promotion step constraint: CompPlan.promotion_to_level must equal Employee.job_level + 1."
    error_id: ERR_PROMO_STEP_INVALID
    http_status: 422
    applies_to: "POST/PATCH .../comp-plans*"

  - priority: 70
    category: business_referential
    check: "Pinned ReviewCase version equality: CompPlan.pinned_review_case_version == current ReviewCase.version."
    error_id: ERR_PINNED_REVIEW_STALE
    http_status: 409
    applies_to: "POST .../comp-plans/{id}/propose, .../approve"
    # Priority sits ABOVE budget (90) so a stale pin surfaces ERR_PINNED_REVIEW_STALE
    # even when the proposed plan would also exceed merit budget.

  - priority: 71
    category: business_referential
    check: "Self-feedback forbidden: FeedbackRequest.reviewer_employee_id != ReviewCase.subject_employee_id."
    error_id: ERR_SELF_FEEDBACK_FORBIDDEN
    http_status: 422
    applies_to: "POST /cycles/{cid}/review-cases/{rid}/feedback-requests"

  - priority: 80
    category: business_constraint
    check: "Goal-weight closure: sum of Goal.weight across a ReviewCase's goals == 100 at submit time."
    error_id: ERR_GOAL_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST .../review-cases/{rid}/submit"

  - priority: 81
    category: business_constraint
    check: "Peer feedback floor: ReviewCase.peer_feedback_count >= 2 at submit."
    error_id: ERR_PEER_FEEDBACK_INSUFFICIENT
    http_status: 422
    applies_to: "POST .../review-cases/{rid}/submit"

  - priority: 82
    category: business_constraint
    check: "Revision cap: ReviewCase.revision_count < 3 at the RETURNED transition."
    error_id: ERR_REVISION_LIMIT
    http_status: 422
    applies_to: "POST .../review-cases/{rid}/return"

  - priority: 83
    category: business_constraint
    check: "Bell-curve compliance: bell_curve_compliance on proposed_ratings returns true at COMMIT."
    error_id: ERR_BELL_CURVE_VIOLATED
    http_status: 422
    applies_to: "POST .../calibration-sessions/{sid}/commit"

  - priority: 84
    category: business_constraint
    check: "Calibration coverage: every locked ReviewCase whose subject.department == session.department appears exactly once in proposed_ratings at COMMIT."
    error_id: ERR_CALIBRATION_COVERAGE
    http_status: 422
    applies_to: "POST .../calibration-sessions/{sid}/commit"

  - priority: 85
    category: business_constraint
    check: "PIP ends_at gating: pass/fail forbidden until clock_now() >= PIPCase.ends_at."
    error_id: ERR_PIP_NOT_ELAPSED
    http_status: 422
    applies_to: "POST .../pip-cases/{id}/pass, .../fail"

  - priority: 86
    category: business_constraint
    check: "Email uniqueness: Employee.email unique across status IN {ACTIVE, ON_PIP}."
    error_id: ERR_EMAIL_TAKEN
    http_status: 422
    applies_to: "POST /employees, PATCH /employees/{id}"

  - priority: 90
    category: business_fiscal
    check: "Merit budget guard: Cycle.merit_budget_consumed_cents + merit_increase_cents <= Cycle.merit_budget_cents."
    error_id: ERR_MERIT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST .../comp-plans/{id}/approve"

  - priority: 91
    category: business_fiscal
    check: "Equity pool guard: Cycle.equity_pool_consumed_units + equity_refresh_units <= Cycle.equity_refresh_pool_units."
    error_id: ERR_EQUITY_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST .../comp-plans/{id}/approve"

  - priority: 100
    category: business_temporal
    check: "review_window_end > review_window_start at Cycle creation/edit."
    error_id: ERR_TIME_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /cycles, PATCH /cycles/{id}"

  - priority: 110
    category: business_constraint
    check: "Bell-curve target shape: bell_curve_target keys equal {OUTSTANDING, EXCEEDS, MEETS, NEEDS_IMPROVEMENT, UNSATISFACTORY}, each in [0,100], sum == 100."
    error_id: ERR_BELL_CURVE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /cycles, PATCH /cycles/{id}"

  - priority: 120
    category: business_constraint
    check: "Optimistic concurrency: when client sends If-Match version, it must equal current entity version."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Employees -----
  - method: POST
    path: "/employees"
    description: "Create an Employee."
    roles: [Admin, HRBP]
    code: 201
    input: ["full_name", "email", "department", "job_level", "manager_employee_id?", "base_salary_cents", "equity_units_outstanding?", "hire_date"]
    output: Employee
    side_effects: ["Employee.status := ACTIVE."]

  - method: GET
    path: "/employees"
    description: "List employees. Query: status, department, manager_employee_id, limit, offset."
    roles: [Admin, HRBP, Manager, Approver]
    code: 200
    input: ["status?", "department?", "manager_employee_id?", "limit?", "offset?"]
    output: "Employee[]"
    side_effects: []

  - method: GET
    path: "/employees/{employee_id}"
    description: "Read an Employee."
    roles: [Admin, HRBP, Manager, Approver, Reviewer]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: PATCH
    path: "/employees/{employee_id}"
    description: "Update mutable Employee fields (department, manager_employee_id, base_salary_cents)."
    roles: [Admin, HRBP]
    code: 200
    input: ["department?", "manager_employee_id?", "base_salary_cents?", "version?"]
    output: Employee
    side_effects: ["Employee.updated_at refreshed; version incremented."]

  - method: POST
    path: "/employees/{employee_id}/terminate"
    description: "Terminate employee (status TERMINATED)."
    roles: [Admin, HRBP]
    code: 200
    input: []
    output: Employee
    side_effects: ["Open ACTIVE PIPCase for this subject in any cycle is force-closed via WITHDRAWN; any DRAFT/PROPOSED CompPlan moves to REJECTED."]

  # ----- Cycles -----
  - method: POST
    path: "/cycles"
    description: "Create a Cycle."
    roles: [HRBP, Admin]
    code: 201
    input: ["name", "cadence", "review_window_start", "review_window_end", "bell_curve_target", "merit_budget_cents", "equity_refresh_pool_units"]
    output: Cycle
    side_effects: ["Cycle.status := OPEN."]

  - method: GET
    path: "/cycles"
    description: "List cycles."
    roles: [HRBP, Admin, Manager, Approver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Cycle[]"
    side_effects: []

  - method: GET
    path: "/cycles/{cycle_id}"
    description: "Read a Cycle."
    roles: [HRBP, Admin, Manager, Approver, Reviewer]
    code: 200
    input: []
    output: Cycle
    side_effects: []

  - method: PATCH
    path: "/cycles/{cycle_id}"
    description: "Edit mutable Cycle fields (name, bell_curve_target, merit_budget_cents, equity_refresh_pool_units, review_window_*)."
    roles: [HRBP, Admin]
    code: 200
    input: ["name?", "bell_curve_target?", "merit_budget_cents?", "equity_refresh_pool_units?", "review_window_start?", "review_window_end?", "version?"]
    output: Cycle
    side_effects: ["Cycle.updated_at refreshed; version incremented."]

  - method: POST
    path: "/cycles/{cycle_id}/lock-reviews"
    description: "Atomically transition Cycle OPEN -> IN_CALIBRATION."
    roles: [HRBP]
    code: 200
    input: []
    output: Cycle
    side_effects: ["All SUBMITTED ReviewCases -> LOCKED (cascade)."]

  - method: POST
    path: "/cycles/{cycle_id}/close"
    description: "Close the cycle once all CompPlans are settled."
    roles: [HRBP]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "Applied: Employee.base_salary_cents += APPROVED CompPlan.merit_increase_cents (cascade hop 1)."
      - "Applied: Employee.equity_units_outstanding += APPROVED CompPlan.equity_refresh_units (cascade hop 2)."
      - "Applied: Employee.job_level = APPROVED CompPlan.promotion_to_level when set (cascade hop 3)."

  # ----- ReviewCase -----
  - method: POST
    path: "/cycles/{cycle_id}/review-cases"
    description: "Create a ReviewCase for a subject."
    roles: [HRBP, Manager]
    code: 201
    input: ["subject_employee_id"]
    output: ReviewCase
    side_effects: ["ReviewCase.status := DRAFT. ReviewCase.manager_employee_id snapshotted from Employee.manager_employee_id."]

  - method: GET
    path: "/cycles/{cycle_id}/review-cases"
    description: "List ReviewCases. Query: status, subject_employee_id, limit, offset."
    roles: [HRBP, Manager, Approver]
    code: 200
    input: ["status?", "subject_employee_id?", "limit?", "offset?"]
    output: "ReviewCase[]"
    side_effects: []

  - method: GET
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}"
    description: "Read a ReviewCase."
    roles: [HRBP, Manager, Approver, Reviewer]
    code: 200
    input: []
    output: ReviewCase
    side_effects: []

  - method: PATCH
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}"
    description: "Edit ReviewCase fields (manager_rating)."
    roles: [Manager]
    code: 200
    input: ["manager_rating?", "version?"]
    output: ReviewCase
    side_effects: []

  - method: POST
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}/submit"
    description: "Manager submits (DRAFT -> SUBMITTED)."
    roles: [Manager]
    code: 200
    input: []
    output: ReviewCase
    side_effects: ["Recompute weighted_goal_score."]

  - method: POST
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}/return"
    description: "HRBP returns to drafter (SUBMITTED -> RETURNED)."
    roles: [HRBP]
    code: 200
    input: []
    output: ReviewCase
    side_effects: ["revision_count += 1."]

  - method: POST
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}/reopen"
    description: "Manager reopens (RETURNED -> DRAFT)."
    roles: [Manager]
    code: 200
    input: []
    output: ReviewCase
    side_effects: []

  # ----- Goals -----
  - method: POST
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}/goals"
    description: "Add a Goal to a ReviewCase in DRAFT/RETURNED."
    roles: [Manager]
    code: 201
    input: ["title", "weight", "self_score?", "manager_score?"]
    output: Goal
    side_effects: []

  - method: PATCH
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}/goals/{goal_id}"
    description: "Edit a Goal."
    roles: [Manager, Reviewer]
    code: 200
    input: ["title?", "weight?", "self_score?", "manager_score?", "version?"]
    output: Goal
    side_effects: ["ReviewCase.weighted_goal_score recomputed."]

  - method: DELETE
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}/goals/{goal_id}"
    description: "Remove a Goal from a DRAFT/RETURNED case."
    roles: [Manager]
    code: 204
    input: []
    output: null
    side_effects: []

  # ----- FeedbackRequest -----
  - method: POST
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}/feedback-requests"
    description: "Open a 360 feedback request."
    roles: [Manager, HRBP]
    code: 201
    input: ["reviewer_employee_id", "relation"]
    output: FeedbackRequest
    side_effects: []

  - method: POST
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}/feedback-requests/{feedback_request_id}/submit"
    description: "Reviewer submits feedback."
    roles: [Reviewer]
    code: 200
    input: ["narrative"]
    output: FeedbackRequest
    side_effects: ["ReviewCase.peer_feedback_count += 1."]

  - method: POST
    path: "/cycles/{cycle_id}/review-cases/{review_case_id}/feedback-requests/{feedback_request_id}/decline"
    description: "Reviewer declines."
    roles: [Reviewer]
    code: 200
    input: []
    output: FeedbackRequest
    side_effects: []

  # ----- CalibrationSession -----
  - method: POST
    path: "/cycles/{cycle_id}/calibration-sessions"
    description: "Create a session for a department."
    roles: [HRBP]
    code: 201
    input: ["department", "facilitator_employee_id"]
    output: CalibrationSession
    side_effects: []

  - method: PATCH
    path: "/cycles/{cycle_id}/calibration-sessions/{calibration_session_id}/proposals"
    description: "Set or replace proposed_ratings (full replacement)."
    roles: [HRBP]
    code: 200
    input: ["proposed_ratings"]
    output: CalibrationSession
    side_effects: ["bell_curve_distribution recomputed."]

  - method: POST
    path: "/cycles/{cycle_id}/calibration-sessions/{calibration_session_id}/start"
    description: "Begin a calibration session (SCHEDULED -> IN_SESSION)."
    roles: [HRBP]
    code: 200
    input: []
    output: CalibrationSession
    side_effects: []

  - method: POST
    path: "/cycles/{cycle_id}/calibration-sessions/{calibration_session_id}/commit"
    description: "Commit a session, finalizing every covered ReviewCase."
    roles: [HRBP]
    code: 200
    input: []
    output: CalibrationSession
    side_effects:
      - "Each ReviewCase in proposed_ratings: LOCKED -> FINALIZED with final_rating set."
      - "Any final_rating in {NEEDS_IMPROVEMENT, UNSATISFACTORY}: auto-create PIPCase, Employee.status -> ON_PIP."
      - "If this is the last department's commit on the cycle: Cycle.status OPEN -> COMP_PLANNING via /cycles/{id}/lock-reviews having already moved it to IN_CALIBRATION earlier; this commit closes calibration."

  - method: POST
    path: "/cycles/{cycle_id}/calibration-sessions/{calibration_session_id}/abandon"
    description: "Abandon a session."
    roles: [HRBP]
    code: 200
    input: []
    output: CalibrationSession
    side_effects: []

  # ----- PIPCase -----
  - method: GET
    path: "/cycles/{cycle_id}/pip-cases"
    description: "List PIPCases on the cycle."
    roles: [HRBP, Admin, Manager]
    code: 200
    input: ["status?", "subject_employee_id?", "limit?", "offset?"]
    output: "PIPCase[]"
    side_effects: []

  - method: GET
    path: "/cycles/{cycle_id}/pip-cases/{pip_case_id}"
    description: "Read a PIPCase."
    roles: [HRBP, Admin, Manager]
    code: 200
    input: []
    output: PIPCase
    side_effects: []

  - method: POST
    path: "/cycles/{cycle_id}/pip-cases/{pip_case_id}/pass"
    description: "Mark PIP passed."
    roles: [HRBP]
    code: 200
    input: []
    output: PIPCase
    side_effects: ["Employee.status: ON_PIP -> ACTIVE."]

  - method: POST
    path: "/cycles/{cycle_id}/pip-cases/{pip_case_id}/fail"
    description: "Mark PIP failed."
    roles: [HRBP]
    code: 200
    input: []
    output: PIPCase
    side_effects:
      - "Employee.status: ON_PIP -> TERMINATED."
      - "Any DRAFT/PROPOSED CompPlan for this subject in the cycle -> REJECTED (cascade)."

  - method: POST
    path: "/cycles/{cycle_id}/pip-cases/{pip_case_id}/withdraw"
    description: "Withdraw PIP early (clock_now() < ends_at)."
    roles: [HRBP]
    code: 200
    input: []
    output: PIPCase
    side_effects: ["Employee.status: ON_PIP -> ACTIVE."]

  # ----- CompPlan -----
  - method: POST
    path: "/cycles/{cycle_id}/comp-plans"
    description: "Create a CompPlan tied to a FINALIZED ReviewCase."
    roles: [Manager, HRBP]
    code: 201
    input: ["subject_employee_id", "promotion_to_level?"]
    output: CompPlan
    side_effects:
      - "pinned_review_case_id := the FINALIZED ReviewCase whose subject_employee_id matches."
      - "pinned_review_case_version := its current version."
      - "pinned_base_salary_cents := Employee.base_salary_cents at creation time."
      - "merit_increase_cents, equity_refresh_units computed via calculations."

  - method: GET
    path: "/cycles/{cycle_id}/comp-plans"
    description: "List CompPlans on a cycle."
    roles: [HRBP, Approver, Manager]
    code: 200
    input: ["status?", "subject_employee_id?", "limit?", "offset?"]
    output: "CompPlan[]"
    side_effects: []

  - method: GET
    path: "/cycles/{cycle_id}/comp-plans/{comp_plan_id}"
    description: "Read a CompPlan."
    roles: [HRBP, Approver, Manager]
    code: 200
    input: []
    output: CompPlan
    side_effects: []

  - method: PATCH
    path: "/cycles/{cycle_id}/comp-plans/{comp_plan_id}"
    description: "Edit promotion_to_level in DRAFT."
    roles: [Manager, HRBP]
    code: 200
    input: ["promotion_to_level?", "version?"]
    output: CompPlan
    side_effects: ["merit_increase_cents and equity_refresh_units recomputed."]

  - method: POST
    path: "/cycles/{cycle_id}/comp-plans/{comp_plan_id}/propose"
    description: "Manager proposes (DRAFT -> PROPOSED)."
    roles: [Manager, HRBP]
    code: 200
    input: []
    output: CompPlan
    side_effects: ["Recompute merit_increase_cents and equity_refresh_units."]

  - method: POST
    path: "/cycles/{cycle_id}/comp-plans/{comp_plan_id}/approve"
    description: "Approver approves (PROPOSED -> APPROVED)."
    roles: [Approver]
    code: 200
    input: []
    output: CompPlan
    side_effects:
      - "Cycle.merit_budget_consumed_cents += merit_increase_cents."
      - "Cycle.equity_pool_consumed_units += equity_refresh_units."

  - method: POST
    path: "/cycles/{cycle_id}/comp-plans/{comp_plan_id}/reject"
    description: "Approver rejects (PROPOSED -> REJECTED)."
    roles: [Approver]
    code: 200
    input: []
    output: CompPlan
    side_effects: []

  - method: POST
    path: "/cycles/{cycle_id}/comp-plans/{comp_plan_id}/recall"
    description: "Approver recalls a previously approved plan (APPROVED -> REJECTED) while cycle still COMP_PLANNING."
    roles: [Approver]
    code: 200
    input: []
    output: CompPlan
    side_effects:
      - "Cycle.merit_budget_consumed_cents -= merit_increase_cents."
      - "Cycle.equity_pool_consumed_units -= equity_refresh_units."

  # ----- AuditEvent -----
  - method: GET
    path: "/audit-events"
    description: "Query the append-only audit log (filterable)."
    roles: [Admin, HRBP]
    code: 200
    input: ["entity_type?", "entity_id?", "action?", "actor_user_id?", "limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # ----- Test-driving endpoints (required by §1.5 testability) -----
  - method: POST
    path: "/_clock/advance"
    description: "Advance server clock to a specific ISO 8601 UTC datetime. Required to reach PIP pass/fail states (gated by ends_at)."
    roles: [Admin]
    code: 200
    input: ["to_datetime"]
    output: "{ now: datetime }"
    side_effects: ["Server clock_now() is set to to_datetime. Clock only moves forward."]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-ID or X-User-Role header missing."
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role not in known set."
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "Acting role lacks permission for this endpoint."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "Path cycle_id does not exist."
  - id: ERR_REVIEW_CASE_NOT_FOUND
    http: 404
    condition: "Path review_case_id does not exist under cycle."
  - id: ERR_CALIBRATION_SESSION_NOT_FOUND
    http: 404
    condition: "Path calibration_session_id does not exist under cycle."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Generic missing resource for other path params (employee, comp-plan, pip-case, goal, feedback-request)."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "FK referenced in request body is unknown."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in the required `from:` state for this transition."
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "Cycle.status != OPEN when the operation requires it."
  - id: ERR_PINNED_REVIEW_STALE
    http: 409
    condition: "CompPlan.pinned_review_case_version != current ReviewCase.version."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match version supplied on PATCH does not equal current entity version."
  - id: ERR_PIP_ALREADY_EXISTS
    http: 409
    condition: "Second PIPCase for the same (cycle, subject) attempted."
  - id: ERR_GOAL_WEIGHTS_INVALID
    http: 422
    condition: "Sum of Goal.weight across the case's goals != 100 at submit."
  - id: ERR_PEER_FEEDBACK_INSUFFICIENT
    http: 422
    condition: "ReviewCase.peer_feedback_count < 2 at submit."
  - id: ERR_REVISION_LIMIT
    http: 422
    condition: "ReviewCase.revision_count already 3; cannot return again."
  - id: ERR_SELF_FEEDBACK_FORBIDDEN
    http: 422
    condition: "reviewer_employee_id == subject_employee_id on feedback-request creation."
  - id: ERR_FACILITATOR_CONFLICT
    http: 422
    condition: "CalibrationSession.facilitator_employee_id matches a manager_employee_id of a covered case."
  - id: ERR_APPROVER_IS_MANAGER
    http: 422
    condition: "CompPlan approver/recaller acts as the same Employee.id as the pinned ReviewCase.manager_employee_id."
  - id: ERR_PROMO_BLOCKED_BY_PIP
    http: 422
    condition: "CompPlan.promotion_to_level set while Employee.status == ON_PIP."
  - id: ERR_PROMO_STEP_INVALID
    http: 422
    condition: "promotion_to_level != current job_level + 1."
  - id: ERR_BELL_CURVE_VIOLATED
    http: 422
    condition: "Proposed ratings deviate > 5 percentage points from cycle bell-curve target on at least one bucket."
  - id: ERR_BELL_CURVE_TARGET_INVALID
    http: 422
    condition: "Cycle.bell_curve_target missing keys, has values outside [0,100], or does not sum to 100."
  - id: ERR_CALIBRATION_COVERAGE
    http: 422
    condition: "At least one locked ReviewCase in the session's department is missing from proposed_ratings, or one appears twice."
  - id: ERR_PIP_NOT_ELAPSED
    http: 422
    condition: "pass/fail attempted while clock_now() < ends_at."
  - id: ERR_EMAIL_TAKEN
    http: 422
    condition: "Email already used by another non-TERMINATED Employee."
  - id: ERR_MERIT_BUDGET_EXCEEDED
    http: 422
    condition: "Approval would push Cycle.merit_budget_consumed_cents above Cycle.merit_budget_cents."
  - id: ERR_EQUITY_POOL_EXHAUSTED
    http: 422
    condition: "Approval would push Cycle.equity_pool_consumed_units above Cycle.equity_refresh_pool_units."
  - id: ERR_TIME_WINDOW_INVALID
    http: 422
    condition: "review_window_end <= review_window_start."
  - id: ERR_VALIDATION
    http: 400
    condition: "Body or path parameter fails a schema/type/range check not covered by a more specific error above."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Platform admin: manages employees, runs audit queries, and drives the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /employees/{id}/terminate"
      - "POST /_clock/advance"
      - "GET /audit-events"
    shared_operations:
      - "POST /employees"
      - "PATCH /employees/{id}"
      - "GET /employees, /employees/{id}"

  - name: HRBP
    description: "HR business partner: owns cycle lifecycle, calibration, PIP processing."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /cycles/{cid}/lock-reviews"
      - "POST /cycles/{cid}/close"
      - "POST .../review-cases/{rid}/return"
      - "POST /cycles/{cid}/calibration-sessions"
      - "POST /cycles/{cid}/calibration-sessions/{sid}/start, /commit, /abandon"
      - "PATCH /cycles/{cid}/calibration-sessions/{sid}/proposals"
      - "POST .../pip-cases/{id}/pass, /fail, /withdraw"
    shared_operations:
      - "POST /cycles, PATCH /cycles/{id}, GET /cycles, /cycles/{id}"
      - "POST /cycles/{cid}/review-cases"
      - "POST /cycles/{cid}/review-cases/{rid}/feedback-requests"
      - "GET, PATCH on CompPlans (creation and edits only, no approve)"
      - "POST /employees, PATCH /employees/{id}, GET /employees*"

  - name: Manager
    description: "Direct manager of the subject Employee. Identity equals an Employee.id."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST .../review-cases/{rid}/submit, /reopen"
      - "PATCH .../review-cases/{rid}"
      - "POST/PATCH/DELETE .../goals*"
    shared_operations:
      - "POST .../review-cases (the Manager may open cases only where ReviewCase.manager_employee_id == X-User-ID)"
      - "POST .../comp-plans, PATCH .../comp-plans/{id}, POST .../propose"
      - "POST .../feedback-requests"
      - "GET cycles, review-cases, comp-plans, pip-cases"

  - name: Reviewer
    description: "360 reviewer (peer/upward/downward/cross-functional)."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST .../feedback-requests/{id}/submit, /decline"
    shared_operations:
      - "GET /cycles, /cycles/{id}, review-cases (read-only)"
      - "PATCH .../goals/{id} (only the self_score of own subject case — enforced by validation that Reviewer == subject of the case)"

  - name: Approver
    description: "Compensation approver. Cannot also be the manager of the case being approved (segregation of duties)."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST .../comp-plans/{id}/approve, /reject, /recall"
    shared_operations:
      - "GET cycles, comp-plans, review-cases (read-only)"
