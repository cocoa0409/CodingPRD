# =============================================================================
# §1.9 Scaffold Corner Design — Breadth Claim Index
# task_2983_retina_practice_intravitreal_injection_buy_and_bill
#
# Walk of references/claim-extraction-guide.md (nine sections) against this
# scaffold's §1.1-§1.7 surface. §1.8 is the depth probe; this file is breadth.
#
# This is a separate YAML document, so it re-declares its own anchor set
# (`&k_*`) for the reference-data prologue — §1.8's `&c_*` anchors are not
# visible here. The prologue is deliberately leaner than §1.8's: two payers
# (one PA-required, one not), the reference drug, two policies, three patients,
# two clinicians, one 5-vial lot.
#
# Pinned corner arithmetic:
#   Drug REF vial_fill_ml 0.27, label_dose_ml 0.06, mg_per_ml 40,
#     billing_unit_mg 1  ->  0.06 ml = 2.4 mg = 2 units administered,
#     0.21 ml = 8.4 mg = 8 units wasted, 10 units billed
#   Policy NP x REF: 14000/unit, admin 10000, wastage_reimbursed FALSE
#     drug_allowed 2*14000 = 28000, wastage_allowed 0, admin_allowed 10000
#     total_allowed 38000, coinsurance 0.10 -> 3800
#   Lot RX-9001: unit_acquisition_cost_cents 132000, received 2026-07-01
#     carrying at clock 2026-08-01 (31 days), 4 vials on hand:
#     round_half_up(4 * 132000 * 0.2 * 31 / 365) = round_half_up(8968.767) = 8969
#     the same lot untouched (5 vials on hand):
#     round_half_up(5 * 132000 * 0.2 * 31 / 365) = round_half_up(11210.959) = 11211
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_create_drug_lot_returns_seeded_counters_and_version_one
        claim_type: creation
        grounds:
          - entities.DrugLot
          - entities.Vial
          - endpoints.POST_/drug-lots
        distinguishing_aspect: "POST /drug-lots with all six required fields returns 201 with vials_on_hand == vials_received == 5, every other counter 0, status AVAILABLE, version 1, and materialises 5 IN_STOCK Vial rows."
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z"
            - "Drug REF exists and is ACTIVE"
          setup_api_calls:
            - &k_clk
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
            - &k_pay_comm
              call: "POST /payers"
              payload: { name: "Cascade Commercial", payer_type: "COMMERCIAL", coinsurance_rate: 0.2, pa_required: true, biosimilar_preference: "NONE", appeal_window_days: 60 }
              as: PracticeAdmin
              captures: { k_pay_comm_id: $.data.id }
            - &k_pay_np
              call: "POST /payers"
              payload: { name: "Foothill Open Access", payer_type: "COMMERCIAL", coinsurance_rate: 0.1, pa_required: false, biosimilar_preference: "NONE", appeal_window_days: 45 }
              as: PracticeAdmin
              captures: { k_pay_np_id: $.data.id }
            - &k_pay_mcr
              call: "POST /payers"
              payload: { name: "Federal Part B Carrier", payer_type: "MEDICARE_PART_B", coinsurance_rate: 0.2, pa_required: true, biosimilar_preference: "MANDATORY", appeal_window_days: 30 }
              as: PracticeAdmin
              captures: { k_pay_mcr_id: $.data.id }
            - &k_drug_ref
              call: "POST /drugs"
              payload: { brand_name: "Ranovex", hcpcs_code: "J2778", vial_type: "SINGLE_DOSE", vial_fill_ml: 0.27, label_dose_ml: 0.06, mg_per_ml: 40, billing_unit_mg: 1, asp_cents_per_billing_unit: 15000, min_interval_days: 28, max_interval_days: 112, is_biosimilar: false }
              as: PracticeAdmin
              captures: { k_drug_ref_id: $.data.id }
          trigger:
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9001", expiration_date: "2027-06-30T00:00:00Z", received_date: "2026-07-01T00:00:00Z", unit_acquisition_cost_cents: 132000, vials_received: 5 }
              as: PharmacyTech
              captures: { k_new_lot_id: $.data.id, k_new_lot_on_hand: $.data.vials_on_hand, k_new_lot_version: $.data.version }
          assert:
            - "${k_new_lot_on_hand} == 5 and ${k_new_lot_version} == 1"
            - "DrugLot.${k_new_lot_id}.status == AVAILABLE"
            - "DrugLot.${k_new_lot_id}.vials_reserved == 0, vials_administered == 0, vials_quarantined == 0, vials_returned == 0, vials_expired == 0"
            - "DrugLot.${k_new_lot_id}.carrying_cost_accrued_cents == 0 and last_swept_at == null and related_endophthalmitis_count == 0"
            - "GET /vials?drug_lot_id=${k_new_lot_id} returns total_count == 5, every row status IN_STOCK with reserved_for_encounter_id == null"

      - name: corner_get_drug_lot_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/drug-lots/{id}
          - entities.DrugLot
        distinguishing_aspect: "GET /drug-lots/{id} echoes every stored field of the row created above, wrapped in the §1.0 success envelope with response_type \"object\"."
        test_recipe:
          setup:
            - "the corner prologue with lot RX-9001 created (5 vials, 132000 cents each)"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - &k_lot
              call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9001", expiration_date: "2027-06-30T00:00:00Z", received_date: "2026-07-01T00:00:00Z", unit_acquisition_cost_cents: 132000, vials_received: 5 }
              as: PharmacyTech
              captures: { k_lot_id: $.data.id }
          trigger:
            - call: "GET /drug-lots/${k_lot_id}"
              as: PharmacyTech
              captures: { k_lot_echo_number: $.data.lot_number, k_lot_echo_cost: $.data.unit_acquisition_cost_cents }
          assert:
            - "${k_lot_echo_number} == \"RX-9001\""
            - "${k_lot_echo_cost} == 132000"
            - "DrugLot.${k_lot_id}.expiration_date == \"2027-06-30T00:00:00Z\" and received_date == \"2026-07-01T00:00:00Z\""
            - "the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: corner_list_drug_lots_filtered_by_drug_with_limit_and_offset
        claim_type: listing
        grounds:
          - endpoints.GET_/drug-lots
          - complexity_profile.consistency_model
        distinguishing_aspect: "With three lots of Drug REF, GET /drug-lots?drug_id=...&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "the corner prologue plus three AVAILABLE lots of Drug REF: RX-9001, RX-9002, RX-9003"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_lot
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9002", expiration_date: "2027-07-31T00:00:00Z", received_date: "2026-07-05T00:00:00Z", unit_acquisition_cost_cents: 131000, vials_received: 2 }
              as: PharmacyTech
              captures: { k_lot2_id: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9003", expiration_date: "2027-08-31T00:00:00Z", received_date: "2026-07-09T00:00:00Z", unit_acquisition_cost_cents: 130000, vials_received: 1 }
              as: PharmacyTech
              captures: { k_lot3_id: $.data.id }
          trigger:
            - call: "GET /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", limit: 2, offset: 0 }
              as: PharmacyTech
              captures: { k_page1_first: "$.data[0].lot_number" }
            - call: "GET /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", limit: 2, offset: 2 }
              as: PharmacyTech
              captures: { k_page2_first: "$.data[0].lot_number" }
          assert:
            - "page 1: exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2: exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "${k_page1_first} == \"RX-9001\" and ${k_page2_first} == \"RX-9003\" (created_at ASC ordering)"
            - "response_type == \"array\" on both pages"

      - name: corner_get_drug_lot_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_LOT_NOT_FOUND]
          - validations.priority_6
        distinguishing_aspect: "GET /drug-lots/{unknown uuid} returns ERR_LOT_NOT_FOUND with HTTP 404 and the §1.0 error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "the corner prologue with one lot created, so the collection is non-empty"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_lot
          trigger:
            - call: "GET /drug-lots/11111111-1111-4111-8111-111111111111"
              as: PharmacyTech
              captures: { k_lot_404: $.data.error_id }
          assert:
            - "${k_lot_404} == \"ERR_LOT_NOT_FOUND\" with HTTP 404"
            - "response_type == \"error\" and data.message is a non-empty string"
            - "DrugLot.${k_lot_id} is unaffected: vials_on_hand == 5"

      - name: corner_missing_required_lot_number_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_5
          - endpoints.POST_/drug-lots
        distinguishing_aspect: "POST /drug-lots without lot_number returns ERR_INVALID_REQUEST (400) and creates no DrugLot and no Vial rows."
        test_recipe:
          setup:
            - "the corner prologue with Drug REF ACTIVE and no lots yet"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
          trigger:
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", expiration_date: "2027-06-30T00:00:00Z", received_date: "2026-07-01T00:00:00Z", unit_acquisition_cost_cents: 132000, vials_received: 5 }
              as: PharmacyTech
              captures: { k_missing_field_error: $.data.error_id }
          assert:
            - "${k_missing_field_error} == \"ERR_INVALID_REQUEST\" with HTTP 400"
            - "GET /drug-lots?drug_id=${k_drug_ref_id} returns total_count == 0"
            - "GET /vials returns total_count == 0"

      - name: corner_payer_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Payer.fields.pa_required
          - entities.Payer.fields.biosimilar_preference
          - entities.Payer.fields.appeal_window_days
          - entities.Payer.fields.status
        distinguishing_aspect: "POST /payers with only name, payer_type and coinsurance_rate yields pa_required true, biosimilar_preference NONE, appeal_window_days 60 and status ACTIVE — the declared §1.1 defaults, not nulls."
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; no payer with this name exists"
          setup_api_calls:
            - *k_clk
          trigger:
            - call: "POST /payers"
              payload: { name: "Bare Minimum Health", payer_type: "COMMERCIAL", coinsurance_rate: 0.15 }
              as: PracticeAdmin
              captures: { k_bare_payer_id: $.data.id, k_bare_pa_required: $.data.pa_required, k_bare_pref: $.data.biosimilar_preference, k_bare_window: $.data.appeal_window_days }
          assert:
            - "${k_bare_pa_required} == true"
            - "${k_bare_pref} == NONE"
            - "${k_bare_window} == 60"
            - "Payer.${k_bare_payer_id}.status == ACTIVE"
            - "Payer.${k_bare_payer_id}.federal_program == false (payer_type COMMERCIAL)"
            - "Payer.${k_bare_payer_id}.version == 1"

      - name: corner_payer_federal_program_is_computed_from_payer_type
        claim_type: computed_fields
        grounds:
          - entities.Payer.fields.federal_program
          - entities.Payer.fields.payer_type
        distinguishing_aspect: "federal_program is derived from payer_type alone: MEDICARE_PART_B yields true and COMMERCIAL yields false, with no input field able to set it."
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *k_clk
          trigger:
            - call: "POST /payers"
              payload: { name: "Sentinel Part B", payer_type: "MEDICARE_PART_B", coinsurance_rate: 0.2 }
              as: PracticeAdmin
              captures: { k_fed_payer_id: $.data.id, k_fed_flag: $.data.federal_program }
            - call: "POST /payers"
              payload: { name: "Sentinel Commercial", payer_type: "COMMERCIAL", coinsurance_rate: 0.2 }
              as: PracticeAdmin
              captures: { k_comm_payer_id: $.data.id, k_comm_flag: $.data.federal_program }
          assert:
            - "${k_fed_flag} == true"
            - "${k_comm_flag} == false"
            - "POST /payers declares no federal_program input in §1.5, so the value cannot be supplied by the client"
            - "Payer.${k_fed_payer_id}.payer_type == MEDICARE_PART_B and Payer.${k_comm_payer_id}.payer_type == COMMERCIAL"

      - name: corner_imaging_disease_activity_is_server_computed
        claim_type: computed_fields
        grounds:
          - entities.ImagingStudy.fields.disease_activity
          - calculations.disease_activity_classification
        excluded_because:
          difficulty_instance: boundary_precision_check / disease_activity_cst_threshold_inclusive_at_300_um
          rationale: "That §1.8 instance already asserts disease_activity is derived from the four clinical inputs at 299/300/301 um, with no client-settable path."

      - name: corner_lot_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.DrugLot
          - response_envelope
        distinguishing_aspect: "id, created_at, updated_at and version on a DrugLot are minted by the server: version starts at 1 and created_at equals the logical clock at creation time."
        test_recipe:
          setup:
            - "the corner prologue with the clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
          trigger:
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9010", expiration_date: "2027-06-30T00:00:00Z", received_date: "2026-07-01T00:00:00Z", unit_acquisition_cost_cents: 132000, vials_received: 5 }
              as: PharmacyTech
              captures: { k_sys_lot_id: $.data.id, k_sys_created: $.data.created_at, k_sys_version: $.data.version }
          assert:
            - "${k_sys_version} == 1"
            - "${k_sys_created} == \"2026-08-01T00:00:00Z\""
            - "DrugLot.${k_sys_lot_id}.updated_at == \"2026-08-01T00:00:00Z\""
            - "${k_sys_lot_id} is a server-minted identifier that no request field supplied"

      - name: corner_invalid_enum_eye_on_plan_create_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.TreatmentPlan.fields.eye
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_5
        distinguishing_aspect: "eye accepts only OD and OS; POST /treatment-plans with eye \"OU\" returns ERR_INVALID_REQUEST (400) and creates no plan."
        test_recipe:
          setup:
            - "the corner prologue with patient P-NP on the no-PA payer and Drug REF ACTIVE"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - &k_pol_np_ref
              call: "POST /payer-drug-policies"
              payload: { payer_id: "${k_pay_np_id}", drug_id: "${k_drug_ref_id}", coverage_tier: "PREFERRED", drug_allowed_cents_per_billing_unit: 14000, admin_allowed_cents: 10000, wastage_reimbursed: false, pa_required: false, pa_validity_days: 180, pa_max_injections: 3, required_prior_failures: 0 }
              as: PracticeAdmin
              captures: { k_pol_np_id: $.data.id }
            - &k_pt_np
              call: "POST /patients"
              payload: { mrn: "MRN-2003", full_name: "Nina Prakash", payer_id: "${k_pay_np_id}", member_id: "NP-77341", contact_point: "nina@example.test", notification_channel: "EMAIL" }
              as: PracticeAdmin
              captures: { k_pt_np_id: $.data.id }
            - &k_cl1
              call: "POST /clinicians"
              payload: { full_name: "Dr Alina Reyes", npi: "2000000001", credential: "MD", injection_privilege: true, max_injections_per_day: 12 }
              as: PracticeAdmin
              captures: { k_cl1_id: $.data.id }
          trigger:
            - call: "POST /treatment-plans"
              payload: { patient_id: "${k_pt_np_id}", drug_id: "${k_drug_ref_id}", eye: "OU", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_bad_enum_error: $.data.error_id }
          assert:
            - "${k_bad_enum_error} == \"ERR_INVALID_REQUEST\" with HTTP 400"
            - "GET /treatment-plans?patient_id=${k_pt_np_id} returns total_count == 0"

      - name: corner_imaging_study_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ImagingStudy
          - endpoints.GET_/imaging-studies/{id}
        distinguishing_aspect: "ImagingStudy declares common_fields false: §1.5 exposes only POST and the two GETs for /imaging-studies, so a stored study can never be amended and its representation carries no version field."
        test_recipe:
          setup:
            - "the corner prologue with patient P-NP and clinician CL1"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - &k_img_np
              call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 420, intraretinal_fluid: true, subretinal_fluid: true, new_hemorrhage: false, va_letter_score: 55 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_img_np_id: $.data.id, k_img_np_activity: $.data.disease_activity }
          trigger:
            - call: "GET /imaging-studies/${k_img_np_id}"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_img_echo_cst: $.data.central_subfield_thickness_um }
          assert:
            - "${k_img_np_activity} == ACTIVE and ${k_img_echo_cst} == 420"
            - "no PUT/PATCH/POST update endpoint for /imaging-studies/{id} exists in §1.5"
            - "the ImagingStudy representation exposes no version field (common_fields false)"
            - "ImagingStudy.${k_img_np_id}.interpreted_by_clinician_id == ${k_cl1_id} (stamped from X-User-ID, not from the payload)"

      - name: corner_plan_create_with_unknown_patient_returns_patient_not_found
        claim_type: parent_relationships
        grounds:
          - entities.TreatmentPlan.fields.patient_id
          - errors[ERR_PATIENT_NOT_FOUND]
          - validations.priority_7
        distinguishing_aspect: "A TreatmentPlan's patient_id FK is validated before any other business rule: an unknown patient uuid returns ERR_PATIENT_NOT_FOUND (404), never ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "the corner prologue with Drug REF ACTIVE and clinician CL1 eligible"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
          trigger:
            - call: "POST /treatment-plans"
              payload: { patient_id: "22222222-2222-4222-8222-222222222222", drug_id: "${k_drug_ref_id}", eye: "OD", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_fk_error: $.data.error_id }
          assert:
            - "${k_fk_error} == \"ERR_PATIENT_NOT_FOUND\" with HTTP 404"
            - "GET /treatment-plans returns total_count == 0"

  - section: state_machines
    instances:

      - name: corner_plan_activate_from_draft_enters_loading_with_seeded_schedule
        claim_type: valid_transition
        grounds:
          - state_machines.TreatmentPlan.DRAFT_to_LOADING
          - calculations.treat_and_extend_interval
        distinguishing_aspect: "POST /treatment-plans/{id}/activate on a DRAFT plan with an ACTIVE same-eye baseline study moves it to LOADING, sets current_interval_days 28 and next_due_date 2026-08-29T00:00:00Z (clock + 28 days) and bumps version to 2."
        test_recipe:
          setup:
            - "the corner prologue with patient P-NP, clinician CL1 and an ACTIVE OD study dated 2026-08-01T00:00:00Z"
            - "a DRAFT plan for P-NP / OD on Drug REF with loading_doses_required 3"
            - "logical clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - &k_cl2
              call: "POST /clinicians"
              payload: { full_name: "Dr Owen Bassett", npi: "2000000002", credential: "MD", injection_privilege: true, max_injections_per_day: 12 }
              as: PracticeAdmin
              captures: { k_cl2_id: $.data.id }
            - *k_lot
            - *k_img_np
            - &k_plan_np
              call: "POST /treatment-plans"
              payload: { patient_id: "${k_pt_np_id}", drug_id: "${k_drug_ref_id}", eye: "OD", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_plan_np_id: $.data.id, k_plan_np_v1: $.data.version, k_plan_np_status0: $.data.status }
          trigger:
            - call: "POST /treatment-plans/${k_plan_np_id}/activate"
              payload: { baseline_imaging_study_id: "${k_img_np_id}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_plan_np_status1: $.data.status, k_plan_np_v2: $.data.version, k_plan_np_due: $.data.next_due_date }
          assert:
            - "${k_plan_np_status0} == DRAFT and ${k_plan_np_v1} == 1"
            - "${k_plan_np_status1} == LOADING and ${k_plan_np_v2} == 2"
            - "TreatmentPlan.${k_plan_np_id}.current_interval_days == 28"
            - "${k_plan_np_due} == \"2026-08-29T00:00:00Z\""
            - "TreatmentPlan.${k_plan_np_id}.baseline_imaging_study_id == ${k_img_np_id}"
            - "TreatmentPlan.${k_plan_np_id}.injections_administered == 0 and consecutive_quiescent_visits == 0"

      - name: corner_plan_activate_with_wrong_eye_baseline_study_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TreatmentPlan.DRAFT_to_LOADING
          - validations.priority_15
          - errors[ERR_IMAGING_EYE_MISMATCH]
        distinguishing_aspect: "The activate precondition requires the baseline study's eye to equal the plan's eye: an OS study against an OD plan returns ERR_IMAGING_EYE_MISMATCH (422) and leaves the plan in DRAFT with version 1."
        test_recipe:
          setup:
            - "the corner prologue with a DRAFT OD plan for P-NP"
            - "an ACTIVE study for the SAME patient but eye OS, dated 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OS", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 410, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 57 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_img_os_id: $.data.id }
          trigger:
            - call: "POST /treatment-plans/${k_plan_np_id}/activate"
              payload: { baseline_imaging_study_id: "${k_img_os_id}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_eye_error: $.data.error_id }
          assert:
            - "${k_eye_error} == \"ERR_IMAGING_EYE_MISMATCH\" with HTTP 422"
            - "TreatmentPlan.${k_plan_np_id}.status == DRAFT and version == 1"
            - "TreatmentPlan.${k_plan_np_id}.baseline_imaging_study_id == null and next_due_date == null"

      - name: corner_document_fires_every_declared_side_effect_once
        claim_type: side_effect_execution
        grounds:
          - state_machines.InjectionEncounter.DRAFT_to_DOCUMENTED
          - state_machines.Vial.RESERVED_to_ADMINISTERED
          - calculations.billing_units_split
          - calculations.modifier_assembly
        distinguishing_aspect: "One document call fires all five declared side effects: billing split (2 / 8 / 10 units, wasted_ml 0.21), modifiers [\"RT\",\"JW\"], vial RESERVED -> ADMINISTERED with administered_at 2026-08-01T09:00:00Z, lot counters 4 / 0 / 1, and plan advance to injections_administered 1 with next_due_date 2026-08-29T09:00:00Z."
        test_recipe:
          setup:
            - "the corner prologue with an ACTIVE LOADING plan for P-NP / OD on Drug REF (no PA required on this payer)"
            - "a DRAFT encounter at 2026-08-01T09:00:00Z holding one RESERVED vial of lot RX-9001"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - &k_plan_np_act
              call: "POST /treatment-plans/${k_plan_np_id}/activate"
              payload: { baseline_imaging_study_id: "${k_img_np_id}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_plan_np_v: $.data.version }
            - &k_enc_np
              call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "${k_img_np_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_enc_np_id: $.data.id, k_enc_np_vial: $.data.vial_id, k_enc_np_status0: $.data.status }
          trigger:
            - call: "POST /injection-encounters/${k_enc_np_id}/document"
              payload: { administered_dose_ml: 0.06, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 17 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_enc_np_wasted: $.data.wasted_ml, k_enc_np_mods: $.data.modifiers }
          assert:
            - "${k_enc_np_status0} == DRAFT before the trigger"
            - "${k_enc_np_wasted} == 0.21"
            - "${k_enc_np_mods} == [\"RT\", \"JW\"]"
            - "InjectionEncounter.${k_enc_np_id}.administered_billing_units == 2, wasted_billing_units == 8, total_billed_billing_units == 10"
            - "InjectionEncounter.${k_enc_np_id}.status == DOCUMENTED and interval_days_from_previous == null"
            - "Vial.${k_enc_np_vial}.status == ADMINISTERED with administered_at == \"2026-08-01T09:00:00Z\""
            - "DrugLot.${k_lot_id}.vials_on_hand == 4, vials_reserved == 0, vials_administered == 1"
            - "TreatmentPlan.${k_plan_np_id}.injections_administered == 1, current_interval_days == 28, next_due_date == \"2026-08-29T09:00:00Z\", status == LOADING"
            - "TreatmentPlan.${k_plan_np_id}.last_encounter_id == ${k_enc_np_id} and consecutive_quiescent_visits == 0"

      - name: corner_new_injection_encounter_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.InjectionEncounter.initial_state
          - endpoints.POST_/injection-encounters
        distinguishing_aspect: "A freshly created InjectionEncounter is DRAFT with version 1, no clinical documentation fields set, and a vial already reserved — creation alone never reaches DOCUMENTED."
        test_recipe:
          setup:
