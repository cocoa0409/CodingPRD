            - "third trigger: staffing_completion_pct == 50.00 (20.00 of 40.00 expected hours) and schedule_risk_band == 'LOW' — 73 days to the 2026-10-15 deadline clears both the 30-day and the 60-day branches, and both figures are already correct in this immediately following read"
            - "fourth trigger: committed_hours == 20.00, remaining_week_hours == 30.00, logged_hours == 0.00"
