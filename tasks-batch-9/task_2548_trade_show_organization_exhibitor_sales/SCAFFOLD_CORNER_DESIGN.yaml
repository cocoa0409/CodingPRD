# =============================================================================
# §1.9 SCAFFOLD CORNER DESIGN — task_2548 Trade Show Organization & Exhibitor Sales
#
# Breadth probe. Walks references/claim-extraction-guide.md row by row against
# this scaffold's §1.1-§1.7 surface. Every `section:` value is one of the guide's
# nine sections and every `claim_type:` is one of that section's declared rows.
#
# Where SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) already asserts a corner, the row
# is emitted as an `excluded_because:` stub naming the covering §1.8 instance.
#
# Shared fixture vocabulary used by the chains below (all values are literals):
#   VenueContract  MCC / HALL_A, term 2027-2029, committed 1200 sqft/yr,
#                  attrition 15%, advance discount 20%, labor 9500 c/h,
#                  electrical 4200 c/amp, material handling 8800 c/cwt
#   Show           "National Buyers Expo", edition 2027, move-in 2027-03-01,
#                  event 2027-03-05..2027-03-07, move-out 2027-03-09,
#                  gross 100000 sqft, aisle 40%, base rate 3275 c/sqft,
#                  selection desk capacity 2
#   Booths         A100 = 20x20 CORNER/MAIN_AISLE (400 sqft, fee 1556280,
#                  min deposit 389070), C050 = 10x20 INLINE/NONE (200 sqft)
#   Clock          default 2026-08-01T00:00:00Z, moved explicitly per instance
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  # SECTION 1 — ENTITIES
  # =========================================================================
  - section: entities
    instances:

      - name: venue_contract_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.VenueContract
          - endpoints[POST /venue-contracts]
        distinguishing_aspect: "POST /venue-contracts with all thirteen required inputs returns 201 with status DRAFT, version 1, show_count 0, executed_at null and every input echoed back verbatim."
        test_recipe:
          setup:
            - "Empty database; logical clock moved to 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
          trigger:
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "VenueContract.${vc_id}.status == DRAFT and executed_at == null and terminated_effective_date == null"
            - "VenueContract.${vc_id}.version == 1 and show_count == 0"
            - "VenueContract.${vc_id}.committed_net_sqft_per_year == 1200 and attrition_allowance_pct == 15 and labor_rate_cents_per_hour == 9500"
            - "GET /venue-contracts/${vc_id} returns the identical row"

      - name: get_show_returns_the_stored_row_with_its_area_ledger
        claim_type: retrieval
        grounds:
          - entities.Show
          - endpoints[GET /shows/{id}]
        distinguishing_aspect: "GET /shows/{id} on a freshly created PLANNING show returns every input verbatim plus a zeroed area ledger, and does NOT invent net_sellable_sqft before the floor plan is published."
        test_recipe:
          setup:
            - "VenueContract MCC / HALL_A EXECUTED; one Show created and still in PLANNING with no booths."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
          trigger:
            - call: "GET /shows/${show_id}"
              payload: {}
              as: SalesRep
          assert:
            - "HTTP 200 with Show.${show_id}.status == PLANNING and selection_round == 0"
            - "Show.${show_id}.venue_contract_id == ${vc_id} and base_rate_cents_per_sqft == 3275"
            - "Show.${show_id}.sellable_booth_sqft == 0, held_net_sqft == 0, assigned_net_sqft == 0, available_net_sqft == 0"
            - "Show.${show_id}.committed_ratio_pct == 0 and floor_posture == OPEN and upheld_violation_count == 0"
            - "Show.${show_id}.net_sellable_sqft == null and advance_order_deadline == null (both are written by publish-floor-plan)"
            - "VenueContract.${vc_id}.show_count == 1"

      - name: booth_listing_filters_by_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /booths]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /booths?show_id=&status=AVAILABLE&limit=2&offset=0 returns 2 of the 3 available booths with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false."
        test_recipe:
          setup:
            - "Show in PLANNING with three booths A100 (400 sqft), C050 (200 sqft) and D010 (100 sqft), all AVAILABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "C050", width_ft: 10, depth_ft: 20, location_class: "INLINE", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "D010", width_ft: 10, depth_ft: 10, location_class: "INLINE", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
          trigger:
            - call: "GET /booths?show_id=${show_id}&status=AVAILABLE&limit=2&offset=0"
              payload: {}
              as: SalesRep
            - call: "GET /booths?show_id=${show_id}&status=AVAILABLE&limit=2&offset=2"
              payload: {}
              as: SalesRep
            - call: "GET /booths?show_id=${show_id}&status=HELD"
              payload: {}
              as: SalesRep
          assert:
            - "The first page returns response_type == array with 2 rows, meta/pagination total_count == 3, limit == 2, offset == 0, has_more == true"
            - "The second page returns 1 row with total_count == 3, offset == 2, has_more == false"
            - "The status=HELD query returns 0 rows with total_count == 0 and has_more == false"
            - "No page contains a booth from another show"

      - name: get_booth_with_unknown_id_returns_booth_not_found
        claim_type: not_found
        grounds:
          - validations[priority=12]
          - errors[ERR_BOOTH_NOT_FOUND]
        distinguishing_aspect: "GET /booths/{id} with a syntactically valid but unknown uuid returns ERR_BOOTH_NOT_FOUND (404), not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database; no booth has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
          trigger:
            - call: "GET /booths/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: FloorManager
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_nf} == ERR_BOOTH_NOT_FOUND"
            - "The envelope is the declared error shape: response_type == error and data holds exactly error_id and message"

      - name: show_creation_without_base_rate_returns_validation
        claim_type: required_fields
        grounds:
          - validations[priority=1]
          - errors[ERR_VALIDATION]
          - endpoints[POST /shows]
        distinguishing_aspect: "Omitting the required input base_rate_cents_per_sqft from POST /shows returns ERR_VALIDATION (422) and creates no Show, even though every other field is valid."
        test_recipe:
          setup:
            - "VenueContract MCC / HALL_A EXECUTED and no Show yet exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
          trigger:
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 422 with ${err_req} == ERR_VALIDATION"
            - "GET /venue-contracts/${vc_id}/shows returns 0 rows and VenueContract.${vc_id}.show_count == 0"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Booth.fields.premium_zone
          - entities.Exhibitor.fields.consecutive_years
          - entities.SpaceContract.fields.premium_placement_requested
          - entities.SpaceContract.fields.requested_discount_pct
        distinguishing_aspect: "Omitting premium_zone, consecutive_years and premium_placement_requested yields exactly NONE, 0 and false, and the omitted cancellation_fee_schedule is seeded with the default three-bucket schedule that includes a min_days_out 0 bucket (so execute succeeds)."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
          trigger:
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "Z900", width_ft: 20, depth_ft: 20, location_class: "INLINE", max_height_ft: 12 }
              as: FloorManager
              captures: { b_z: $.data.id }
            - call: "POST /exhibitors"
              payload: { legal_name: "Default Trading Co", contact_email: "sales@default.example" }
              as: SalesRep
              captures: { ex_d: $.data.id }
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { sv1: $.data.version }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_d}", expected_show_version: "${sv1}", requested_sqft: 400 }
              as: SalesRep
              captures: { sc_d: $.data.id }
          assert:
            - "Booth.${b_z}.premium_zone == NONE (declared default) and area_sqft == 400"
            - "Exhibitor.${ex_d}.consecutive_years == 0, ledger_points == 0, penalty_points == 0, status == ACTIVE"
            - "SpaceContract.${sc_d}.premium_placement_requested == false and requested_discount_pct == 0 and approved_discount_pct == 0 and negotiation_round == 0"
            - "VenueContract.${vc_id}.cancellation_fee_schedule == [{min_days_out: 180, pct: 25}, {min_days_out: 90, pct: 50}, {min_days_out: 0, pct: 100}] and status == EXECUTED"
            - "SpaceContract.${sc_d}.offered_booth_ids == [${b_z}] (the selector ran because booth_ids was omitted)"

      - name: publish_computes_net_sellable_sqft_and_advance_order_deadline
        claim_type: computed_fields
        grounds:
          - calculations.show_net_sellable_sqft
          - entities.Show.fields.net_sellable_sqft
          - entities.Show.fields.advance_order_deadline
        distinguishing_aspect: "publish-floor-plan writes net_sellable_sqft == floor(100000 * 60 / 100) == 60000 and advance_order_deadline == 2027-02-08 (move_in_start 2027-03-01 minus ADVANCE_ORDER_LEAD_DAYS 21); neither is client-supplied on any endpoint."
        test_recipe:
          setup:
            - "Show in PLANNING with gross_sqft 100000, aisle_ratio_pct 40 and two booths A100 (400 sqft) and C050 (200 sqft)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "C050", width_ft: 10, depth_ft: 20, location_class: "INLINE", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
          trigger:
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
          assert:
            - "HTTP 200 with Show.${show_id}.status == SPACE_SELECTION"
            - "Show.${show_id}.net_sellable_sqft == 60000"
            - "Show.${show_id}.advance_order_deadline == 2027-02-08"
            - "Show.${show_id}.sellable_booth_sqft == 600 and available_net_sqft == 600 and committed_ratio_pct == 0 and floor_posture == OPEN"
            - "Show.${show_id}.version was incremented by exactly 1 by this call"

      - name: exhibitor_creation_assigns_system_fields_only_on_the_server
        claim_type: system_fields
        grounds:
          - entities.Exhibitor
          - endpoints[POST /exhibitors]
        distinguishing_aspect: "POST /exhibitors mints id, created_at, updated_at and version 1 server-side and forces status ACTIVE with every point counter at 0; only legal_name, contact_email and consecutive_years come from the request."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-15T00:00:00Z so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
          trigger:
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
          assert:
            - "HTTP 201 with Exhibitor.${ex1}.id present, created_at == 2026-08-15T00:00:00Z, updated_at == 2026-08-15T00:00:00Z, version == 1"
            - "Exhibitor.${ex1}.status == ACTIVE, ledger_points == 0, sponsorship_fulfillment_points == 0, penalty_points == 0"
            - "Exhibitor.${ex1}.space_points_provisional == 0, space_points_certified == 0, provisional_priority_points == 0, certified_priority_points == 0, priority_tier == BRONZE"
            - "Exhibitor.${ex1}.consecutive_years == 6 (the only migrated counter the client may set)"

      - name: undeclared_enum_and_out_of_range_percentage_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=1]
          - errors[ERR_VALIDATION]
          - entities.Booth.fields.location_class
          - entities.Show.fields.aisle_ratio_pct
        distinguishing_aspect: "location_class ROUND (not in the declared enum) and aisle_ratio_pct 140 (a pct field outside 0..100) each return ERR_VALIDATION (422) before any domain rule runs, and neither row is persisted."
        test_recipe:
          setup:
            - "VenueContract MCC / HALL_A EXECUTED; one Show in PLANNING with no booths."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
          trigger:
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "R001", width_ft: 20, depth_ft: 20, location_class: "ROUND", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
              captures: { err_enum: $.data.error_id }
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "Bad Ratio Expo", edition_year: 2028, move_in_start: "2028-03-01", event_start: "2028-03-05", event_end: "2028-03-07", move_out_end: "2028-03-09", gross_sqft: 90000, aisle_ratio_pct: 140, base_rate_cents_per_sqft: 3000, selection_desk_capacity: 1 }
              as: ShowDirector
              captures: { err_range: $.data.error_id }
          assert:
            - "The bad enum returns HTTP 422 with ${err_enum} == ERR_VALIDATION and GET /booths?show_id=${show_id} returns 0 rows"
            - "The out-of-range pct returns HTTP 422 with ${err_range} == ERR_VALIDATION (priority 1 pre-empts the aisle-ratio business rule at priority 42)"
            - "VenueContract.${vc_id}.show_count == 1 (only the valid show exists)"

      - name: booth_creation_under_an_unknown_show_returns_show_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=10]
          - errors[ERR_SHOW_NOT_FOUND]
        distinguishing_aspect: "A nested create under /shows/{id}/booths with an unknown show id returns ERR_SHOW_NOT_FOUND (404) — the parent is resolved before the child payload is validated."
        test_recipe:
          setup:
            - "Empty database; no Show has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
          trigger:
            - call: "POST /shows/00000000-0000-4000-8000-0000000000aa/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { err_parent: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_parent} == ERR_SHOW_NOT_FOUND"
            - "GET /booths returns 0 rows"

      - name: space_contract_rejects_an_unknown_exhibitor_reference
        claim_type: flat
        grounds:
          - validations[priority=11]
          - errors[ERR_EXHIBITOR_NOT_FOUND]
