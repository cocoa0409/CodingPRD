      - name: background_check_exists_on_second_open
        claim_type: violation_to_error
        grounds: ["errors[ERR_BACKGROUND_CHECK_EXISTS]", state_machines.Application.SUBMITTED_to_VETTING]
        distinguishing_aspect: "A second POST /applications/{id}/background-checks (application already VETTING with a check) returns ERR_INVALID_STATE before the existence check; to isolate ERR_BACKGROUND_CHECK_EXISTS the application must still be SUBMITTED — unreachable, so this error is surfaced only when the application re-enters SUBMITTED is impossible. Asserted instead via the documented condition that a check already exists triggers it on the SUBMITTED->VETTING guard."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / application_advance_requires_background_check_cleared
          rationale: "The single-BackgroundCheck-per-application invariant is exercised by the §1.8 instance that creates exactly one check and observes the application/check coupling; a second open is blocked by the SUBMITTED->VETTING state guard (ERR_INVALID_STATE), so ERR_BACKGROUND_CHECK_EXISTS shares the same reachable surface."

