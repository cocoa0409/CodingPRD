            - { call: "POST /pig-groups/${group_a}/close-out", payload: {}, as: FieldTech }
            - { call: "POST /pig-groups/${group_b}/confirm-placement", payload: {}, as: FieldTech, captures: { err2: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-13T12:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /barn-washes", payload: { barn_id: "${barn_id}", wash_type: "FULL_DISINFECT", completed_at: "2026-07-13T10:00:00Z" }, as: Grower, as_user_id: "${grower_id}", captures: { bw: $.data.id } }
            - { call: "POST /barn-washes/${bw}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /pig-groups/${group_b}/confirm-placement", payload: {}, as: FieldTech, captures: { err3: $.data.error_id } }
