            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "Plant P", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-TO2", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /robotics/cell-projects/${proj_id}/maintenance-plans"
              payload: { interval_operating_hours: 2000, first_due_at_hours: 2000 }
              as: ServiceManager
              as_user_id: "${svc_id}"
              captures: { mp_id: $.data.id }
            - call: "POST /robotics/cell-projects/${proj_id}/maintenance-plans"
              payload: { interval_operating_hours: 2000, first_due_at_hours: 0 }
              as: ServiceManager
