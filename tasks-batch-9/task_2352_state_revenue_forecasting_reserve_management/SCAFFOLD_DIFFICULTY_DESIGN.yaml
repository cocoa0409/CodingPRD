            - "LEVEL 3 — ReserveFund.${fund}.cap_cents == 160091627 and headroom_cents == 0 and deposit_posture == AT_CAP (the exact-fill boundary: balance_cents >= cap_cents with overflow 0)"
            - "LEVEL 3 — ReserveFund.${fund}.required_reserve_cents == 79445814, coverage_ratio_bps == 20151, adequacy_band == STRONG, cushion_credit_bps == 200, disclosed_target_pct_bps == 300"
