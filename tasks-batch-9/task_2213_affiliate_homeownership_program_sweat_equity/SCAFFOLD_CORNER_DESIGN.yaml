            - { call: "POST /homeownership/sweat-equity-entries", payload: { household_id: "${hh_id}", member_id: "${mem_id}", category: "CONSTRUCTION", work_date: "2026-08-01T00:00:00.000Z", hours_claimed: 6 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { se_id: $.data.id } }
          trigger:
