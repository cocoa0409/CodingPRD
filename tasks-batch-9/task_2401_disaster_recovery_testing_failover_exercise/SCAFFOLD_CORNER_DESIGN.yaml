        distinguishing_aspect: "Site creation is exclusive to PlatformAdmin: the same payload that succeeds for PlatformAdmin returns 403 ERR_UNAUTHORIZED for a ResilienceCoordinator, and the role check at priority 2 answers before any body validation."
        test_recipe:
          setup:
            - "The clock and the five entity-backed stakeholders exist; no site has been created yet."
