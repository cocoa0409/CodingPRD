- rule_id: priority_pair_validation_conflict
  instances:
  - name: state_vs_business_safety_on_bid_submission
    grounds:
    - validations[priority=4]
    - validations[priority=5]
    - errors[ERR_PACKAGE_NOT_ACCEPTING_BIDS]
    - errors[ERR_BIDDER_NOT_GRADE_FOR_BROADER]
    distinguishing_aspect: 'Conflict pair (state, business_safety): a bid submitted
      on a

      WITHDRAWN package AND requesting BROADER exclusivity with a

      SPECULATIVE-rated bidder violates both rule 4 (state — package not

      accepting bids) and rule 5 (business_safety — bidder not grade for

      broader). State (priority 4) must beat business_safety (priority 5).

      '
    test_recipe:
      setup:
      - Asset with one package; bidder SPECULATIVE
      - Package WITHDRAWN before bid submission
      setup_api_calls:
      - call: POST /rights-assets
        payload:
          asset_code: TEST-P1
