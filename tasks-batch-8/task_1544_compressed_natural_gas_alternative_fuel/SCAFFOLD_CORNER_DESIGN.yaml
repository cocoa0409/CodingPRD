  - section: cross_cutting_layers
    instances:
      - name: occ_stale_station_version_on_policy_create_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pricing-policy-create-stale-station]", "errors[ERR_STALE_STATION_VERSION]"]
        distinguishing_aspect: "Policy create requires expected_station_version; after a first successful create bumps Station.version, a second create carrying the previously observed version is rejected 412."
        test_recipe:
          setup: ["ACTIVE station (version 2 after activation)"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "OCC1", station_code: "ST-OCC1", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
          trigger:
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator, captures: { p1: $.data.id } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 319, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator, captures: { err: $.data.error_id } }
          assert:
            - "PricingPolicy.${p1}.status == ACTIVE (first create succeeded)"
            - "err == ERR_STALE_STATION_VERSION with HTTP 412 (the second create's view of the station is stale after the first create bumped version)"

      - name: occ_stale_account_version_on_authorize_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[session-authorize-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "Authorize requires expected_fleet_account_version; after a first authorize bumps the account version (hold posted), a second authorize with the previously observed version is rejected 412."
        test_recipe:
          setup: ["Standard ACTIVE setup; account at version 1"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "OCC2", station_code: "ST-OCC2", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "OCC2 Co", billing_email: "ap@occ2.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { acct_id: $.data.id, av1: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-OC02", vehicle_plate: "2CCC102", daily_gge_limit: 100.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
          trigger:
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-OCC1", estimated_gge: 5.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-OCC2", estimated_gge: 5.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { err: $.data.error_id } }
          assert:
            - "FuelingSession.${s1}.status == AUTHORIZED (first authorize succeeded at version 1)"
            - "err == ERR_STALE_ACCOUNT_VERSION with HTTP 412 (account version advanced to 2 with the first hold)"

      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.FleetAccount.fields.version]
        distinguishing_aspect: "FleetAccount.version steps 1 -> 2 (suspend) -> 3 (resume), exactly one increment per mutation."
        test_recipe:
          setup: ["One ACTIVE account"]
          setup_api_calls:
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Ver Co", billing_email: "ap@ver.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { acct_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /cng/fleet-accounts/${acct_id}/suspend", payload: {}, as: NetworkOperator, captures: { v2: $.data.version } }
            - { call: "POST /cng/fleet-accounts/${acct_id}/resume", payload: {}, as: NetworkOperator, captures: { v3: $.data.version } }
          assert:
            - "v1 == 1 and v2 == 2 and v3 == 3"

      - name: posture_reconciles_on_calibration_fail_and_pass
        claim_type: derived_field_reconciliation
        grounds: [calculations.uptime_posture_derivation, calculations.calibration_outcome]
        distinguishing_aspect: "FAIL calibration drives the only dispenser OUT_OF_SERVICE and posture to OUTAGE; a later PASS restores IN_SERVICE and posture OPERATIONAL — the derived field reconciles in both directions."
        test_recipe:
          setup: ["ACTIVE station, one compressor, one dispenser"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Rec", station_code: "ST-REC", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { p0: $.data.uptime_posture } }
          trigger:
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${dsp_c}", measured_error_pct: 0.75 }, as: StationManager }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: StationManager, captures: { p1: $.data.uptime_posture } }
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${dsp_c}", measured_error_pct: 0.20 }, as: StationManager, captures: { rec2: $.data.result } }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: StationManager, captures: { p2: $.data.uptime_posture } }
            - { call: "GET /cng/dispensers/${dsp_c}", payload: {}, as: StationManager, captures: { d_status: $.data.status, d_factor: $.data.correction_factor } }
          assert:
            - "p0 == OPERATIONAL"
            - "p1 == OUTAGE (zero IN_SERVICE dispensers after the FAIL)"
            - "rec2 == PASS and p2 == OPERATIONAL (derived field reconciled back)"
            - "d_status == IN_SERVICE and d_factor == 0.998"

      - name: ops_run_checkpoint_clock_sweeps
        claim_type: ops_run_checkpoint
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "All seven epoch sweeps (session timeout, calibration hold, policy expiry, window lapse, backup expiry, inspection overdue, contract expiry, daily reset, month-close settlement) are driven solely by the logical clock endpoint."
        excluded_because:
          difficulty_instance: transitive_cascade / maintenance_window_start_outage_cascade
          rationale: "Clock-driven sweeps are exercised by corner instances clock_sweep_session_timeout_voids_with_hold_release, clock_sweep_policy_expiry_blocks_pricing, clock_sweep_window_lapses_and_rejects_start, clock_sweep_contract_expires_after_end_month, clock_sweep_backup_expires_and_rejects_activate, clock_sweep_card_daily_usage_resets, clock_sweep_inspection_overdue_allows_late_completion, clock_sweep_dispenser_calibration_hold_degrades_posture; the cascade half is covered by the cited §1.8 instance."

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [state_machines.MaintenanceWindow.SCHEDULED_to_IN_PROGRESS, state_machines.SafetyInspection.COMPLETED_to_APPROVED]
        distinguishing_aspect: "N-level cascade chains from window start and from FAIL approval."
        excluded_because:
          difficulty_instance: transitive_cascade / maintenance_window_start_outage_cascade
          rationale: "Covered end-to-end by maintenance_window_start_outage_cascade and inspection_fail_approval_cascade in §1.8."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.gge_equivalent_conversion, calculations.tax_credit_claim_computation]
        distinguishing_aspect: "Provisional vs settled GGE and provisional vs final claim amounts."
        excluded_because:
          difficulty_instance: dual_variant_calc / session_gge_provisional_vs_settled_divergence
          rationale: "Both dual-variant pairs are pinned with literal values by the two §1.8 dual_variant_calc instances."

