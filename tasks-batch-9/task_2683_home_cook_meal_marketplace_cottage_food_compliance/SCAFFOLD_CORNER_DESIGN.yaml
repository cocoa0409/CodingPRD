          assert:
            - "create: HTTP 201, ${hub_status} == OPEN, ${hub_assigned} == 0, ${hub_version} == 1, id and created_at present"
            - "read: HTTP 200 with ${read_id} == ${hub_id}, ${read_capacity} == 4 and ${read_zone} == ${hz_id}"
            - "filtered list: total_count == 1, has_more == false, ${list_first} == ${hub_id}"
            - "the DOOR_DELIVERY zone's list is empty (total_count == 0), so delivery_zone_id genuinely narrows the collection"
            - "no field the creator did not send is echoed back from input: assigned_order_count and status are server-owned"

      - name: standing_action_endpoint_enforces_the_reinstate_precondition
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /cooks/{id}/standing-actions
          - state_machines.Cook.compliance_standing.SUSPENDED_to_CLEAR
          - validations[priority=11].ERR_INVALID_COOK_TRANSITION
        distinguishing_aspect: >
          REINSTATE is the only standing action carrying a cross-entity precondition (zero incidents in
          INTAKE or TRIAGED), so the same call must be rejected while one un-adjudicated incident exists
          and accepted the instant that incident is DISMISSED at triage - and rejected again afterwards,
          because CLEAR is not a legal source state for REINSTATE.
        test_recipe:
          setup:
            - "Cook Dara is ACTIVE in CA with one APPROVED MenuItem (the canonical onboarding chain of window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections through POST /menu-items/{id}/review)."
