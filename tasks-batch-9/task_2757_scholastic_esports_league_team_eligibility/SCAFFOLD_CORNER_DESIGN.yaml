      - name: integrity_clean_credit_accrues_one_step_and_repeat_index_reflows_on_overturn
        claim_type: decay_function
        grounds:
          - calculations.team_integrity_score
          - calculations.team_integrity_score.constants
          - calculations.team_integrity_score.input_set
          - state_machines.FairPlayCase.APPEALED_to_OVERTURNED.side_effects
        distinguishing_aspect: |
          Every constant table is exercised in one chain: SEVERITY_WEIGHT plus
          TYPE_SURCHARGE (MINOR ACCOUNT_SHARING = 5 + 5 = 10, MAJOR ACCOUNT_SHARING =
          15 + 5 = 20), REPEAT_MULTIPLIER (1.0 then 1.5, so 10.00 + 30.00 = 40.00 and
          the score drops 100.00 -> 90.00 -> 60.00), then CLEAN_DAYS_PER_STEP with
          floor(31 / 30) = 1 step of CLEAN_CREDIT_STEP 5. Overturning the FIRST case
          re-indexes the second from repeat 2 to repeat 1, so its applied_penalty must
          be restated 30.00 -> 20.00 and the score must land on exactly
          100.00 - 20.00 + 5.00 == 85.00. An implementation that stores the penalty at
          decision time and never restates it reports 100 - 30 + 5 == 75.00.
        test_recipe:
          setup:
            - "District, school, certified coach, title, season, one student, one DRAFT team with one PROSPECTIVE STARTER slot for that student"
            - "Two ACCOUNT_SHARING cases against the student on that team, created in order, both driven to SUSTAINED with severity MINOR then MAJOR"
            - "The logical clock is then advanced 31 days to 2026-09-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Alpha", email: "alpha@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Rocket Arena", publisher: "Nova Interactive" }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Rosa Nova", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_a_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_id}", student_id: "${st_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /fair-play-cases"
              payload: { team_id: "${tm_id}", subject_type: "STUDENT", subject_student_id: "${st_id}", case_type: "ACCOUNT_SHARING", evidence_ref: "EV-101" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
              captures: { fp1_id: $.data.id }
            - call: "POST /fair-play-cases/${fp1_id}/investigate"
              payload: { investigation_note: "login trail" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
            - call: "POST /fair-play-cases/${fp1_id}/decision"
              payload: { decision: "SUSTAIN", severity: "MINOR", decision_note: "one shared session" }
              as: IntegrityOfficer
              as_user_id: "integrity-b"
            - call: "POST /fair-play-cases"
              payload: { team_id: "${tm_id}", subject_type: "STUDENT", subject_student_id: "${st_id}", case_type: "ACCOUNT_SHARING", evidence_ref: "EV-102" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
              captures: { fp2_id: $.data.id }
            - call: "POST /fair-play-cases/${fp2_id}/investigate"
              payload: { investigation_note: "second login trail" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
            - call: "POST /fair-play-cases/${fp2_id}/decision"
              payload: { decision: "SUSTAIN", severity: "MAJOR", decision_note: "repeat offence" }
              as: IntegrityOfficer
              as_user_id: "integrity-b"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: LeagueAdmin
            - call: "POST /fair-play-cases/${fp1_id}/appeal"
              payload: { appeal_grounds: "the session was the school's shared lab machine" }
              as: Coach
              as_user_id: "${c_a_id}"
          trigger:
            - call: "POST /fair-play-cases/${fp1_id}/appeal-decision"
              payload: { decision: "OVERTURN", appeal_note: "lab machine confirmed" }
              as: IntegrityOfficer
              as_user_id: "integrity-c"
          assert:
            - "immediately before the trigger call Team.${tm_id}.integrity_score == 60.00, FairPlayCase.${fp1_id}.repeat_index == 1 with applied_penalty == 10.00, and FairPlayCase.${fp2_id}.repeat_index == 2 with applied_penalty == 30.00"
            - "the trigger call returns 200 with data.status == OVERTURNED, data.appeal_decider_user_id == integrity-c, data.sanction_type == NONE and data.applied_penalty == 0"
            - "FairPlayCase.${fp2_id}.repeat_index == 1 and applied_penalty == 20.00 — the surviving case is re-indexed"
            - "Team.${tm_id}.integrity_score == 85.00 (100.00 - 20.00 penalty + 5.00 clean credit for floor(31/30) steps)"
            - "FairPlayCase.${fp2_id}.severity_weight == 20 and sanction_type == STUDENT_SUSPENSION"
            - "Student.${st_id}.fair_play_status is still SANCTIONED because case ${fp2_id} remains SUSTAINED"
            - "RosterSlot.${rs_id}.participation_status is still PROSPECTIVE and Team.${tm_id}.status is still DRAFT"

