# =============================================================================
# §1.8 Scaffold Difficulty Design — Industrial Safety & LOTO Program
# 9 Difficulty Rules x 2 instances. Every chain replays from empty-DB using
# only §1.5 endpoints. Bootstrap convention: the first POST /employees in each
# chain registers the EHS manager's own Employee record; that call carries the
# conventional literal operator id 00000000-0000-4000-8000-000000000001
# (no ownership/SoD check involves the caller of POST /employees).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: risk_window_variants_diverge
        grounds:
          - calculations.machine_risk_score
          - entities.Machine.fields.risk_window_policy
          - entities.Machine.fields.risk_score
          - entities.Machine.fields.risk_tier
        distinguishing_aspect: |
          Dual-variant calculation on the Machine domain: with an IDENTICAL
          incident set (NEAR_MISS 2025-12-10, NEAR_MISS 2026-01-15,
          PROPERTY_DAMAGE 2026-02-01, all LINKED), a ROLLING_12MO machine
          scores 1+1+3=5 (MEDIUM) while a SINCE_PROCEDURE_ACTIVATION machine
          whose procedure activated 2026-01-01 scores 1+3=4 (LOW) — the two
          variants include different windows and therefore produce different
          risk_score AND risk_tier for the same data.
        test_recipe:
          setup:
            - "Machine A (risk_window_policy ROLLING_12MO) and Machine B (SINCE_PROCEDURE_ACTIVATION) exist"
            - "Machine B has an ACTIVE procedure with activated_at == 2026-01-01T00:00:00Z"
            - "Both machines carry three REPORTED incidents: NEAR_MISS occurred 2025-12-10T00:00:00Z, NEAR_MISS occurred 2026-01-15T00:00:00Z, PROPERTY_DAMAGE occurred 2026-02-01T00:00:00Z"
            - "Logical clock is 2026-08-01T00:00:00Z at link time"
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-RW", full_name: "Mgr RW", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-RW", full_name: "W1 RW", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /machines"
              payload: { asset_tag: "A-RW-100", name: "Press A", area: "Line 1", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { ma: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /machines"
              payload: { asset_tag: "B-RW-100", name: "Press B", area: "Line 1", risk_window_policy: "SINCE_PROCEDURE_ACTIVATION" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { mb: $.data.id }
            - call: "POST /energy-surveys"
              payload: { machine_id: "${mb}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "480V", isolation_point: "DP-1", dissipation_method: "none" }] }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { svb: $.data.id }
            - call: "POST /energy-surveys/${svb}/submit"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /energy-surveys/${svb}/approve"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-procedures"
              payload: { machine_id: "${mb}", survey_id: "${svb}", steps: [{ step_no: 1, action: "Open disconnect", isolation_point: "DP-1" }] }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { pb: $.data.id }
            - call: "POST /lockout-procedures/${pb}/activate"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /incident-reports"
              payload: { machine_id: "${ma}", kind: "NEAR_MISS", occurred_at: "2025-12-10T00:00:00Z", severity: 2 }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { ia1: $.data.id }
            - call: "POST /incident-reports"
              payload: { machine_id: "${ma}", kind: "NEAR_MISS", occurred_at: "2026-01-15T00:00:00Z", severity: 2 }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { ia2: $.data.id }
            - call: "POST /incident-reports"
              payload: { machine_id: "${ma}", kind: "PROPERTY_DAMAGE", occurred_at: "2026-02-01T00:00:00Z", severity: 3 }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { ia3: $.data.id }
            - call: "POST /incident-reports"
              payload: { machine_id: "${mb}", kind: "NEAR_MISS", occurred_at: "2025-12-10T00:00:00Z", severity: 2 }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { ib1: $.data.id }
            - call: "POST /incident-reports"
              payload: { machine_id: "${mb}", kind: "NEAR_MISS", occurred_at: "2026-01-15T00:00:00Z", severity: 2 }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { ib2: $.data.id }
            - call: "POST /incident-reports"
              payload: { machine_id: "${mb}", kind: "PROPERTY_DAMAGE", occurred_at: "2026-02-01T00:00:00Z", severity: 3 }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { ib3: $.data.id }
          trigger:
            - call: "POST /incident-reports/${ia1}/link"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /incident-reports/${ia2}/link"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /incident-reports/${ia3}/link"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /incident-reports/${ib1}/link"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /incident-reports/${ib2}/link"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /incident-reports/${ib3}/link"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
          assert:
            - "Machine.${ma}.risk_score == 5 and Machine.${ma}.risk_tier == MEDIUM"
            - "Machine.${mb}.risk_score == 4 and Machine.${mb}.risk_tier == LOW"
            - "Machine.${ma}.status == IN_SERVICE and Machine.${mb}.status == IN_SERVICE (no HIGH crossing)"

      - name: training_expiry_variants_diverge
        grounds:
          - calculations.training_expiry
          - entities.TrainingRecord.fields.delivery_mode
          - entities.TrainingRecord.fields.expires_at
          - entities.Employee.fields.is_currently_qualified
        distinguishing_aspect: |
          Dual-variant calculation on the TrainingRecord domain: two employees
          completing the same course at the same instant 2026-08-02T10:00:00Z —
          the IN_PERSON (ANNIVERSARY) record expires 2027-08-02T10:00:00Z while
          the ONLINE (CALENDAR) record expires 2027-12-31T23:59:59Z; at clock
          2027-09-01T00:00:00Z the first employee is no longer qualified and the
          second still is.
        test_recipe:
          setup:
            - "Employees W1 and W2 exist, both AUTHORIZED, each with an ASSIGNED LOTO_AUTHORIZED_INITIAL record (W1 IN_PERSON, W2 ONLINE)"
            - "Logical clock is 2026-08-02T10:00:00Z at completion time"
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-TV", full_name: "Mgr TV", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-TV", full_name: "W1 TV", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W2-TV", full_name: "W2 TV", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:00:00Z" }
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /training-records"
              payload: { employee_id: "${w1}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "IN_PERSON" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t1: $.data.id }
            - call: "POST /training-records"
              payload: { employee_id: "${w2}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "ONLINE" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /training-records/${t1}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t1_exp: $.data.expires_at }
            - call: "POST /training-records/${t2}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t2_exp: $.data.expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: EHSManager
              as_user_id: "${mgr}"
          assert:
            - "TrainingRecord.${t1}.expires_at == 2027-08-02T10:00:00Z (ANNIVERSARY: completed_at + 365 days)"
            - "TrainingRecord.${t2}.expires_at == 2027-12-31T23:59:59Z (CALENDAR: end of year following completion year)"
            - "${t1_exp} != ${t2_exp}"
            - "At clock 2027-09-01T00:00:00Z: Employee.${w1}.is_currently_qualified == false and Employee.${w2}.is_currently_qualified == true"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: minor_servicing_tiered_cap_boundary
        grounds:
          - calculations.minor_servicing_eligibility
          - entities.MinorServicingException.fields.determination
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >=3 inputs (three boolean criteria,
          estimated_duration_min, machine.risk_tier) with non-linear tiered-cap
          interaction — on a LOW machine (cap 480) a fully-compliant task at
          exactly 480 minutes is ELIGIBLE (inclusive boundary) while 481 minutes
          is NOT_ELIGIBLE, and a HIGH-tier machine (cap 0) makes every task
          NOT_ELIGIBLE regardless of duration.
        test_recipe:
          setup:
            - "Machine M exists with risk_tier LOW (no incidents), requested by W1"
            - "Exception E1: all criteria true, estimated_duration_min 480, window [2026-09-01T00:00:00Z, 2026-09-05T00:00:00Z]"
            - "Exception E2: all criteria true, estimated_duration_min 481, window [2026-09-10T00:00:00Z, 2026-09-12T00:00:00Z] (disjoint from E1)"
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-MS", full_name: "Mgr MS", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-MS", full_name: "W1 MS", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /machines"
              payload: { asset_tag: "A-MS-100", name: "Lathe M", area: "Line 2", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
            - call: "POST /minor-servicing-exceptions"
              payload: { machine_id: "${m}", task_description: "Clear jam at infeed", routine_repetitive: true, integral_to_production: true, alternative_measures_effective: true, estimated_duration_min: 480, valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-05T00:00:00Z" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
            - call: "POST /minor-servicing-exceptions"
              payload: { machine_id: "${m}", task_description: "Clear jam at outfeed", routine_repetitive: true, integral_to_production: true, alternative_measures_effective: true, estimated_duration_min: 481, valid_from: "2026-09-10T00:00:00Z", valid_until: "2026-09-12T00:00:00Z" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /minor-servicing-exceptions/${e1}/determine"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /minor-servicing-exceptions/${e2}/determine"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
          assert:
            - "MinorServicingException.${e1}.determination == ELIGIBLE and .status == DETERMINED (480 == cap is inclusive)"
            - "MinorServicingException.${e2}.determination == NOT_ELIGIBLE and .status == DETERMINED (481 > 480)"
            - "MinorServicingException.${e1}.determined_by_employee_id == ${mgr}"

      - name: pinned_capacity_survives_procedure_supersede
        grounds:
          - calculations.session_lock_capacity
          - entities.LockoutSession.fields.max_locks
          - entities.LockoutSession.fields.procedure_revision_no
        distinguishing_aspect: |
          Mode (c) combinatorial formula: the capacity check's evaluation order
          is pinned to the session's max_locks captured at creation (revision 1,
          2 isolation points). After the procedure is driven ACTIVE ->
          UNDER_REVISION (audit FAIL) and then SUPERSEDED by a revision with
          only 1 isolation point, the session STILL accepts a second lock — an
          implementation re-reading the current procedure would reject it.
        test_recipe:
          setup:
            - "Machine M with procedure P1 ACTIVE (revision 1, isolation_point_count 2) and session S in SETUP pinned to P1 (max_locks 2)"
            - "P1 has zero period lock-appliers; audit A by qualified auditor W2 completes FAIL so P1 -> UNDER_REVISION (S is NOT cancelled — audit FAIL does not cascade)"
            - "Successor survey (1 isolation point) APPROVED and procedure P2 created + activated, superseding P1"
            - "Qualified employees W1, W3, W4 exist; none holds a lock on S yet"
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-PC", full_name: "Mgr PC", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-PC", full_name: "W1 PC", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W2-PC", full_name: "W2 PC", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w2: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W3-PC", full_name: "W3 PC", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w3: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W4-PC", full_name: "W4 PC", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w4: $.data.id }
            - call: "POST /training-records"
              payload: { employee_id: "${w1}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "IN_PERSON" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t1: $.data.id }
            - call: "POST /training-records/${t1}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /training-records"
              payload: { employee_id: "${w2}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "IN_PERSON" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t2: $.data.id }
            - call: "POST /training-records/${t2}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /training-records"
              payload: { employee_id: "${w3}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "IN_PERSON" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t3: $.data.id }
            - call: "POST /training-records/${t3}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /training-records"
              payload: { employee_id: "${w4}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "IN_PERSON" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t4: $.data.id }
            - call: "POST /training-records/${t4}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /machines"
              payload: { asset_tag: "A-PC-100", name: "Mill M", area: "Line 3", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "480V", isolation_point: "DP-1", dissipation_method: "none" }, { source_type: "PNEUMATIC", magnitude: "120psi", isolation_point: "VA-2", dissipation_method: "bleed" }] }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { sv1: $.data.id }
            - call: "POST /energy-surveys/${sv1}/submit"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /energy-surveys/${sv1}/approve"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-procedures"
              payload: { machine_id: "${m}", survey_id: "${sv1}", steps: [{ step_no: 1, action: "Open disconnect", isolation_point: "DP-1" }, { step_no: 2, action: "Close valve", isolation_point: "VA-2" }] }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { p1: $.data.id }
            - call: "POST /lockout-procedures/${p1}/activate"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-sessions"
              payload: { machine_id: "${m}", procedure_id: "${p1}", session_type: "GROUP" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { s: $.data.id, s_max_locks: $.data.max_locks }
            - call: "POST /procedure-audits"
              payload: { procedure_id: "${p1}", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }
              as: EHSAuditor
              as_user_id: "${w2}"
              captures: { a1: $.data.id }
            - call: "POST /procedure-audits/${a1}/complete"
              payload: { result: "FAIL", employees_sampled: [] }
              as: EHSAuditor
              as_user_id: "${w2}"
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "480V", isolation_point: "DP-1", dissipation_method: "none" }] }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { sv2: $.data.id }
            - call: "POST /energy-surveys/${sv2}/submit"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /energy-surveys/${sv2}/approve"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-procedures"
              payload: { machine_id: "${m}", survey_id: "${sv2}", steps: [{ step_no: 1, action: "Open disconnect", isolation_point: "DP-1" }] }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { p2: $.data.id }
            - call: "POST /lockout-procedures/${p2}/activate"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
          trigger:
            - call: "POST /employee-locks"
              payload: { session_id: "${s}", lock_no: "L-PC-1", tag_no: "T-PC-1" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /employee-locks"
              payload: { session_id: "${s}", lock_no: "L-PC-2", tag_no: "T-PC-2" }
              as: AuthorizedEmployee
              as_user_id: "${w3}"
              captures: { l2: $.data.id }
            - call: "POST /employee-locks"
              payload: { session_id: "${s}", lock_no: "L-PC-3", tag_no: "T-PC-3" }
              as: AuthorizedEmployee
              as_user_id: "${w4}"
              captures: { err: $.data.error_id }
          assert:
            - "Second lock succeeds: EmployeeLock.${l2}.status == ISSUED (pinned max_locks 2 from revision 1, NOT the current revision's 1)"
            - "Third lock is rejected with ${err} == ERR_LOCK_POINT_CAPACITY (non-terminal count 2 >= pinned max_locks 2)"
            - "LockoutSession.${s}.max_locks == 2 and LockoutSession.${s}.procedure_revision_no == 1"
            - "LockoutProcedure.${p1}.status == SUPERSEDED and LockoutProcedure.${p2}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: procedure_revision_cycle_reactivation
        grounds:
          - state_machines.LockoutProcedure.ACTIVE_to_UNDER_REVISION
          - state_machines.LockoutProcedure.UNDER_REVISION_to_ACTIVE
          - entities.LockoutProcedure.fields.activated_at
        distinguishing_aspect: |
          Cyclic machine on LockoutProcedure: ACTIVE -> UNDER_REVISION ->
          ACTIVE closes the revision loop on the SAME row (revision_no stays 1,
          activated_at is preserved, audit_due_at unchanged), unlike the
          linear sink UNDER_REVISION -> SUPERSEDED taken when a successor
          revision activates.
        test_recipe:
          setup:
            - "Machine M with APPROVED survey and procedure P ACTIVE (activated at default clock 2026-08-01T00:00:00Z)"
            - "Qualified employee W1 (surveyor) and manager MGR exist"
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-RC", full_name: "Mgr RC", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-RC", full_name: "W1 RC", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /machines"
              payload: { asset_tag: "A-RC-100", name: "Saw M", area: "Line 4", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "240V", isolation_point: "DP-1", dissipation_method: "none" }] }
              as: AuthorizedEmployee
