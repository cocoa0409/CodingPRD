              captures: { plan_id: $.data.id }
            - call: "POST /rmd/mitigation-plans/${plan_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/mitigation-plans/${plan_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Regulator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Regulator
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v1: $.data.version }
          trigger:
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", variant: "CERTIFIED", expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
