  # =====================================================================
  # RULE 7 — cross_entity_state_dependency
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: settlement_calculate_blocked_by_a_still_verified_vendor_invoice
        grounds:
          - "validations[priority=36]"
          - "state_machines.Settlement.DRAFT_to_CALCULATED"
          - "state_machines.VendorInvoice.VERIFIED_to_APPROVED"
          - "endpoints[POST /settlements/{settlement_id}/calculate]"
          - "calculations.artist_settlement_earnings"
        distinguishing_aspect: |
          ENTITY PAIR: Settlement -> VendorInvoice. The Settlement is in DRAFT, which is a state from
          which DRAFT -> CALCULATED is a declared transition, and the acting role is correct — the
          refusal comes entirely from a DIFFERENT entity's state: one VendorInvoice of the show is
          still VERIFIED rather than APPROVED or REJECTED. VERIFIED is the trap: an implementation
          that only screens for SUBMITTED invoices ("nobody has looked at it yet") lets the books
          close over a verified-but-unapproved cost. Approving that one invoice — with no change
          whatsoever to the Settlement — makes the identical call succeed, and the money it produces
          differs because the newly APPROVED invoice is now inside line.actual_cents.
        test_recipe:
          setup:
            - "One Market (limit 10000000), Artist (withholding 0), Venue (capacity 500, zero facility fee, zero ticket tax) and a RENTAL show with rental_fee_cents 100000."
            - "An ACCEPTED FLAT_GUARANTEE offer: guarantee 1000000, deposit 0, expense_cap_cents 1000000."
            - "One tier GA, 500 allocated at 2000; 200 sold; the show is then PERFORMED so gross_sold_cents is frozen at 400000."
            - "Two non-deductible BudgetLines: PRODUCTION 500000 and MARKETING 300000."
            - "Two VendorInvoices exactly matching those budgets (500000 and 300000). The PRODUCTION one is verified AND approved; the MARKETING one is verified only, so it sits in VERIFIED."
            - "A Settlement exists for the show in status DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Cascade Basin", region_code: "CSB", guarantee_exposure_limit_cents: 10000000 }
              as: RiskOfficer
              captures: { u_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Verdant Coil", agency: "Fernway Talent", tier: "CLUB", historical_sellthrough_pct: 44.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { u_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${u_mk_id}", name: "Cedar Room", gross_capacity: 500, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { u_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${u_ar_id}", venue_id: "${u_vn_id}", event_at: "2026-09-05T02:00:00.000Z", load_in_at: "2026-09-04T14:00:00.000Z", load_out_at: "2026-09-05T08:00:00.000Z", announce_at: "2026-08-05T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { u_sh_id: $.data.id, u_sh_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${u_sh_id}", expected_show_version: "${u_sh_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { u_of_id: $.data.id }
            - call: "POST /offers/${u_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${u_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${u_ar_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${u_sh_id}", tier_name: "GA", price_cents: 2000, allocation_qty: 500 }
              as: TalentBuyer
              captures: { u_tt_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { show_id: "${u_sh_id}", category: "PRODUCTION", description: "backline and audio", budgeted_cents: 500000, is_artist_deductible: false }
              as: TourAccountant
              captures: { u_bl_prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { show_id: "${u_sh_id}", category: "MARKETING", description: "local radio buy", budgeted_cents: 300000, is_artist_deductible: false }
              as: TourAccountant
              captures: { u_bl_mkt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T15:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /shows/${u_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${u_tt_id}/sales"
              payload: { qty: 200 }
              as: VenueOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T06:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /shows/${u_sh_id}/perform"
              payload: {}
              as: TourAccountant
            - call: "POST /vendor-invoices"
              payload: { show_id: "${u_sh_id}", budget_line_id: "${u_bl_prod_id}", vendor_name: "Cedar Audio", amount_cents: 500000, invoice_date: "2026-09-04", documentation_ref: "INV-U-PROD" }
              as: TourAccountant
              as_user_id: "acct-alice"
              captures: { u_inv_prod_id: $.data.id }
            - call: "POST /vendor-invoices/${u_inv_prod_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-alice"
            - call: "POST /vendor-invoices/${u_inv_prod_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-bob"
            - call: "POST /vendor-invoices"
              payload: { show_id: "${u_sh_id}", budget_line_id: "${u_bl_mkt_id}", vendor_name: "KCDR Radio", amount_cents: 300000, invoice_date: "2026-09-04", documentation_ref: "INV-U-MKT" }
              as: TourAccountant
              as_user_id: "acct-alice"
              captures: { u_inv_mkt_id: $.data.id }
            - call: "POST /vendor-invoices/${u_inv_mkt_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-alice"
            - call: "POST /settlements"
              payload: { show_id: "${u_sh_id}" }
              as: TourAccountant
              captures: { u_st_id: $.data.id, u_st_status_initial: $.data.status }
          trigger:
            - call: "POST /settlements/${u_st_id}/calculate"
              payload: {}
              as: TourAccountant
              captures: { u_blocked_error: $.data.error_id }
            - call: "POST /vendor-invoices/${u_inv_mkt_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-bob"
            - call: "POST /settlements/${u_st_id}/calculate"
              payload: {}
              as: TourAccountant
              captures: { u_final_status: $.data.status, u_final_net: $.data.promoter_net_cents }
          assert:
            - "BLOCKED — ${u_blocked_error} == ERR_UNRESOLVED_INVOICES with HTTP 409, even though the offending invoice is VERIFIED rather than SUBMITTED; the screen is {SUBMITTED, VERIFIED, DISPUTED}"
            - "BLOCKED — the dependency is genuinely cross-entity: ${u_st_status_initial} == DRAFT and Settlement.${u_st_id}.status is still DRAFT after the refusal, with gross_receipts_cents, adjusted_gross_cents, artist_earnings_cents and promoter_net_cents all still null"
            - "BLOCKED — the refusal is NOT ERR_UNRESOLVED_VARIANCE (priority 37): BudgetLine.${u_bl_prod_id}.variance_status == WITHIN_TOLERANCE and BudgetLine.${u_bl_mkt_id}.variance_status == WITHIN_TOLERANCE, so priority 36 is the only rule violated"
            - "PIVOT — after approving VendorInvoice.${u_inv_mkt_id}, its status == APPROVED and BudgetLine.${u_bl_mkt_id}.actual_cents == 300000, variance_cents == 0, variance_pct == 0.00, settlement_expense_cents == 300000"
            - "UNBLOCKED — ${u_final_status} == CALCULATED from the byte-identical second calculate call; nothing about the Settlement itself changed between the two attempts"
            - "MONEY — Settlement.${u_st_id}.gross_receipts_cents == 400000, ticket_tax_cents == 0, facility_fee_cents == 0, credit_card_fee_cents == 10000, adjusted_gross_cents == 390000"
            - "MONEY — Settlement.${u_st_id}.total_settlement_expense_cents == 800000 (500000 + 300000); the MARKETING 300000 is only in this total because the blocking invoice was finally approved"
            - "MONEY — Settlement.${u_st_id}.allowed_expense_cents == 0 (neither line is is_artist_deductible) and breakeven_cents == 1000000"
            - "MONEY — Settlement.${u_st_id}.artist_base_earnings_cents == 1000000 (FLAT_GUARANTEE ignores adjusted_gross); artist_coop_contribution_cents == 50000 == MIN(ROUND_HALF_UP(50 * 300000 / 100) = 150000, ROUND_HALF_UP(5 * 1000000 / 100) = 50000) — the cap leg binds"
            - "MONEY — Settlement.${u_st_id}.artist_earnings_cents == 950000, withholding_cents == 0, deposit_credit_cents == 0, payment_due_cents == 950000"
            - "MONEY — RENTAL split: venue_expense_reimbursement_cents == 0, promoter_borne_expense_cents == 800000, venue_share_cents == 100000 (the flat rental fee), ${u_final_net} == -1460000 — promoter_net is SIGNED and this show lost money"
            - "INVARIANT — 950000 + 800000 + 100000 + (-1460000) == 390000 == adjusted_gross_cents, so the closing identity holds exactly"

      - name: budget_line_variance_decision_blocked_by_postponed_show
        grounds:
          - "state_machines.BudgetLine.PENDING_APPROVAL_to_APPROVED"
          - "state_machines.Show.CONFIRMED_to_POSTPONED"
          - "validations[priority=17]"
          - "endpoints[POST /budget-lines/{budget_line_id}/variance-decision]"
        distinguishing_aspect: |
          ENTITY PAIR: BudgetLine -> Show, a DIFFERENT pair from the sibling's Settlement -> VendorInvoice.
          POSTPONED is chosen deliberately because it is the one show state that leaves BudgetLines
          untouched ("BudgetLines are NOT voided (they carry to the replacement show)"). So the line
          being refused is still status ACTIVE and still variance_status PENDING_APPROVAL with
          required_approver_role RISK_OFFICER, and the actor IS a RiskOfficer — every local
          precondition passes. Only show.show_status, on a different row, explains the 409. A control
          line on a twin show that stayed CONFIRMED takes the identical call and succeeds. An
          implementation that reads only the line's own two state fields cannot tell these apart.
        test_recipe:
          setup:
            - "One Market (limit 10000000) and one Venue (capacity 900, zero facility fee, zero ticket tax); two Artists so the 36h rest buffer is irrelevant."
            - "Two structurally identical CONFIRMED RENTAL shows P and Q at that venue with non-overlapping load windows, each with an ACCEPTED FLAT_GUARANTEE offer of 1000000."
            - "One HOSPITALITY BudgetLine per show, budgeted_cents 200000 and is_artist_deductible true, each driven to variance_pct 30.00 / PENDING_APPROVAL / required_approver_role RISK_OFFICER by an APPROVED 260000 invoice."
            - "Show Q is then POSTPONED via a CancellationEvent of kind POSTPONED; show P is left CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Rio Grande", region_code: "RGD", guarantee_exposure_limit_cents: 10000000 }
              as: RiskOfficer
              captures: { w_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Copper Basin", agency: "Mesa Route", tier: "CLUB", historical_sellthrough_pct: 55.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { w_ar_p_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Salt Flats Choir", agency: "Mesa Route", tier: "CLUB", historical_sellthrough_pct: 48.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { w_ar_q_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${w_mk_id}", name: "Mesa Playhouse", gross_capacity: 900, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
