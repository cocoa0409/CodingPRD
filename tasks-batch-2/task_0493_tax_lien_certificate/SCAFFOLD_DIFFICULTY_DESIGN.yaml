              as: CountyTreasurer
              captures: { sale1_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale1_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing1_id: $.data.id }
            - call: "POST /counties/${county_id}/sales"
              payload: { sale_name: "S2", scheduled_at: "2026-03-02T00:00:00Z" }
              as: CountyTreasurer
              captures: { sale2_id: $.data.id }
          trigger:
            - call: "POST /counties/${county_id}/sales/${sale2_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "Parcel.${parcel_id}.status == ON_SALE"

