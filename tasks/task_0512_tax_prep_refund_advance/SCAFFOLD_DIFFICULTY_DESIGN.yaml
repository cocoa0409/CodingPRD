              as: FrontDeskAgent
              captures: { appt_first: $.data.id }
          trigger:
            - call: "POST /offices/${office_id}/appointments"
              payload: { client_id: "${client_id}", preparer_id: "${prep_b}", start_utc: "2026-06-12T10:00:00Z", end_utc: "2026-06-12T11:00:00Z" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent same-client booking (10:00–11:00, different preparer) error_id == ERR_CLIENT_DOUBLE_BOOKED (409) — closed [start,end] buffer treats end==start as a collision"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: office_open_return_count_create_then_cancel
        grounds:
          - state_machines.TaxReturn.INTAKE_to_CANCELLED
          - entities.Office.fields.open_return_count
          - entities.TaxReturn.fields.status
        distinguishing_aspect: "Conserved quantity Office.open_return_count: forward action (open return, +1) paired with its compensation (cancel from INTAKE, -1) leaves open_return_count exactly equal to its pre-create value (0)."
        test_recipe:
          setup:
            - "Fresh office with open_return_count=0; one client."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Inv1 Office", efin: "171717", state_code: "KS" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "In Cli", ssn_last4: "2525" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025 }
              as: FrontDeskAgent
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "CANCELLED" }
              as: TaxPreparer
          assert:
            - "Immediately after POST /returns: Office.${office_id}.open_return_count == 1"
            - "After CANCELLED: Office.${office_id}.open_return_count == 0 (invariant: net change of create+cancel is 0)"

      - name: preparer_assigned_open_returns_assign_then_cancel
        grounds:
          - state_machines.TaxReturn.DOCS_PENDING_to_CANCELLED
          - entities.Preparer.fields.assigned_open_returns
          - validations[priority=13]
        distinguishing_aspect: "A different conserved quantity (Preparer.assigned_open_returns, not Office.open_return_count): assigning a return (+1) then cancelling it from DOCS_PENDING (-1) restores assigned_open_returns to its pre-assign value (0)."
        test_recipe:
          setup:
            - "Office; one preparer (assigned_open_returns=0); a return in DOCS_PENDING with a received required doc, assigned to that preparer."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Inv2 Office", efin: "181818", state_code: "IA" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P40404040", holder_name: "Iv Ivy", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Iv Ivy" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Iv Cli", ssn_last4: "2626" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, complexity_band: "SIMPLE" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /documents/${doc_id}/status"
              payload: { status: "RECEIVED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
          trigger:
            - call: "POST /returns/${ret_id}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "CANCELLED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
          assert:
            - "Immediately after assign: Preparer.${prep_id}.assigned_open_returns == 1"
            - "After CANCELLED: Preparer.${prep_id}.assigned_open_returns == 0 (invariant restored)"
