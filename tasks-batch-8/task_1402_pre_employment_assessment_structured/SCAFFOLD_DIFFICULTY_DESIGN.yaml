            - { call: "POST /talent/scorecards/${scB}/submit", as: Interviewer, as_user_id: "${iv1}" }
            - { call: "POST /talent/scorecards/${scC}/submit", as: Interviewer, as_user_id: "${iv1}" }
          trigger:
            - { call: "GET /talent/assessments/${aA}", as: HiringManager, as_user_id: hm-1, captures: { compA: $.data.composite_score } }
            - { call: "GET /talent/assessments/${aB}", as: HiringManager, as_user_id: hm-1, captures: { compB: $.data.composite_score } }
            - { call: "GET /talent/assessments/${aC}", as: HiringManager, as_user_id: hm-1, captures: { compC: $.data.composite_score } }
          assert:
            - "Assessment ${aA}.composite_score == 0.7413 (full coverage: 0.6*0.88 + 0.4*0.5333)"
            - "Assessment ${aB}.composite_score == 0.6933 (COMM-only renormalization: 0.6*0.80 + 0.4*0.5333 — same raw_score as aA, different result)"
            - "Assessment ${aC}.composite_score == 0.6000 (clamp: raw 30 < pass_floor 40 -> assessment_component 0; 0.6*1.0 + 0.4*0)"
            - "Scorecard ${scA}.weighted_total == 0.8800 AND ${scC}.weighted_total == 1.0000"

      - name: adverse_impact_round_then_divide_order
        grounds:
          - calculations.adverse_impact_ratio
          - entities.AdverseImpactSnapshot.fields.group_breakdowns
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned and observable — per-group rates rounded to
          4dp FIRST, then divided, then rounded again. GROUP_B 1/3 (0.3333) vs highest GROUP_A
          2/3 (0.6667): pinned order yields round(0.3333/0.6667,4)=0.4999; dividing unrounded
