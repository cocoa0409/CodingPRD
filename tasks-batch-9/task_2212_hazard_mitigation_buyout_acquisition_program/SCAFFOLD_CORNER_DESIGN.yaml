            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-1", effective_date: "2026-07-01", indicated_value_cents: 20000000 }
              as: StaffAppraiser
              as_user_id: "sa-1"
              captures: { ap1: "$.data.id" }
          trigger:
            - call: "POST /appraisals/${ap1}/submit"
              payload: { appraisal_id: "${ap1}" }
