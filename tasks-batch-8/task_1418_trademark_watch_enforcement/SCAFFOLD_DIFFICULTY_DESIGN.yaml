  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: maintenance_submit_requires_registered_record
        grounds:
          - state_machines.MaintenanceFiling.PREPARED_to_SUBMITTED
          - validations[priority=20]
          - errors[ERR_RECORD_NOT_REGISTERED]
        distinguishing_aspect: |
          Pair MaintenanceFiling -> TrademarkRecord: submit is gated on the RECORD's
          status being REGISTERED or MAINTENANCE_DUE; on a merely PUBLISHED record the
          filing cannot submit (ERR_RECORD_NOT_REGISTERED), and the same filing submits
          once the record registers — the filing's valid transition depends on a
          different entity's state.
        test_recipe:
          setup:
            - "Client; record PUBLISHED (not registered) with class [9]; one VERIFIED evidence item; filing PREPARED"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec_id}/evidence-items"
              payload: { nice_class: 9, specimen_type: LABEL, specimen_date: "2031-06-01T00:00:00Z" }
              as: Paralegal
              as_user_id: para_1
              captures: { ev_id: $.data.id }
            - call: "POST /brand/evidence-items/${ev_id}/verify"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/trademark-records/${rec_id}/maintenance-filings"
              payload: { filing_type: SECTION_8, evidence_item_ids: ["${ev_id}"] }
              as: Paralegal
              captures: { fil_id: $.data.id }
            - call: "POST /brand/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brand/maintenance-filings/${fil_id}/submit"
              as: Paralegal
              captures: { err: $.data.error_id }
            - call: "POST /brand/trademark-records/${rec_id}/register"
              payload: { registration_date: "2026-08-10T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brand/maintenance-filings/${fil_id}/submit"
              as: Paralegal
          assert:
            - "First submit: error_id == ERR_RECORD_NOT_REGISTERED (record PUBLISHED, clock inside what would be the window)"
            - "After register: record maintenance windows computed (window_open 2031-08-10, close 2032-08-10) and second submit succeeds"
            - "MaintenanceFiling.${fil_id}.status == SUBMITTED after the second submit"

      - name: letter_issue_barred_by_active_coexistence
        grounds:
          - state_machines.CeaseDesistLetter.APPROVED_to_ISSUED
          - validations[priority=8]
          - errors[ERR_ENFORCEMENT_BARRED]
        distinguishing_aspect: |
          Pair CeaseDesistLetter -> CoexistenceAgreement (different pair than
          MaintenanceFiling -> TrademarkRecord): the letter's APPROVED -> ISSUED
          transition depends on there being NO non-terminal agreement on the matter's
          record; with an EXECUTED agreement present, issue is rejected and the letter
          stays APPROVED even though every letter-local precondition holds.
        test_recipe:
          setup:
            - "Client (budget 1000000); PUBLISHED record; INFRINGEMENT matter; letter APPROVED; agreement EXECUTED on the same record"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: INFRINGEMENT }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { matter_id: $.data.id }
            - call: "POST /brand/enforcement-matters/${matter_id}/cease-desist-letters"
              payload: { demand_type: CEASE_USE, recipient_name: "Rival Co", recipient_address: "1 Rival Way", response_due_days: 14 }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { letter_id: $.data.id }
            - call: "POST /brand/cease-desist-letters/${letter_id}/submit-review"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/cease-desist-letters/${letter_id}/approve"
              payload: { decision: APPROVED }
              as: PartnerAttorney
              as_user_id: partner_1
            - call: "POST /brand/trademark-records/${rec_id}/coexistence-agreements"
              payload: { counterparty_name: "Rival Co", territory_codes: ["US"], effective_start: "2026-09-01T00:00:00Z", effective_end: "2027-09-01T00:00:00Z" }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { agr_id: $.data.id, agr_v: $.data.version }
            - call: "POST /brand/coexistence-agreements/${agr_id}/propose"
              payload: { terms_text: "coexistence terms", expected_agreement_version: "${agr_v}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/coexistence-agreements/${agr_id}/execute"
              as: PartnerAttorney
              as_user_id: partner_1
          trigger:
            - call: "POST /brand/cease-desist-letters/${letter_id}/issue"
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ENFORCEMENT_BARRED"
            - "CeaseDesistLetter.${letter_id}.status still == APPROVED"
            - "Client.${client_id}.budget_spent_cents == 0 (no fee accrued)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics, resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_halfopen_overlap_and_adjacency
        grounds:
          - validations[priority=14]
          - errors[ERR_AGREEMENT_OVERLAP]
          - state_machines.CoexistenceAgreement.PROPOSED_to_EXECUTED
        distinguishing_aspect: |
          Semantics 1 (half-open [start, end), adjacency allowed, territory-intersected)
          on CoexistenceAgreement: a new US agreement starting exactly at the existing
          one's effective_end executes cleanly, a US agreement overlapping by one day
          is rejected with ERR_AGREEMENT_OVERLAP, and a time-overlapping EU-only
          agreement executes because the territory intersection is empty.
        test_recipe:
          setup:
            - "Client; PUBLISHED record; agreement1 US [2026-09-01, 2027-09-01) EXECUTED"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec_id}/coexistence-agreements"
              payload: { counterparty_name: "Rival One", territory_codes: ["US"], effective_start: "2026-09-01T00:00:00Z", effective_end: "2027-09-01T00:00:00Z" }
              as: AssociateAttorney
              captures: { agr1: $.data.id, agr1_v: $.data.version }
            - call: "POST /brand/coexistence-agreements/${agr1}/propose"
              payload: { terms_text: "t1", expected_agreement_version: "${agr1_v}" }
              as: AssociateAttorney
            - call: "POST /brand/coexistence-agreements/${agr1}/execute"
              as: PartnerAttorney
              as_user_id: partner_1
            - call: "POST /brand/trademark-records/${rec_id}/coexistence-agreements"
              payload: { counterparty_name: "Rival Two", territory_codes: ["US"], effective_start: "2027-09-01T00:00:00Z", effective_end: "2028-09-01T00:00:00Z" }
              as: AssociateAttorney
              captures: { agr2: $.data.id, agr2_v: $.data.version }
            - call: "POST /brand/coexistence-agreements/${agr2}/propose"
              payload: { terms_text: "t2", expected_agreement_version: "${agr2_v}" }
              as: AssociateAttorney
            - call: "POST /brand/trademark-records/${rec_id}/coexistence-agreements"
              payload: { counterparty_name: "Rival Three", territory_codes: ["US"], effective_start: "2027-08-31T00:00:00Z", effective_end: "2028-08-31T00:00:00Z" }
              as: AssociateAttorney
              captures: { agr3: $.data.id, agr3_v: $.data.version }
            - call: "POST /brand/coexistence-agreements/${agr3}/propose"
              payload: { terms_text: "t3", expected_agreement_version: "${agr3_v}" }
              as: AssociateAttorney
            - call: "POST /brand/trademark-records/${rec_id}/coexistence-agreements"
              payload: { counterparty_name: "Rival Four", territory_codes: ["EU"], effective_start: "2027-08-31T00:00:00Z", effective_end: "2028-08-31T00:00:00Z" }
              as: AssociateAttorney
              captures: { agr4: $.data.id, agr4_v: $.data.version }
            - call: "POST /brand/coexistence-agreements/${agr4}/propose"
              payload: { terms_text: "t4", expected_agreement_version: "${agr4_v}" }
              as: AssociateAttorney
          trigger:
            - call: "POST /brand/coexistence-agreements/${agr2}/execute"
              as: PartnerAttorney
              as_user_id: partner_1
            - call: "POST /brand/coexistence-agreements/${agr3}/execute"
              as: PartnerAttorney
              as_user_id: partner_1
              captures: { err: $.data.error_id }
            - call: "POST /brand/coexistence-agreements/${agr4}/execute"
              as: PartnerAttorney
              as_user_id: partner_1
          assert:
            - "CoexistenceAgreement.${agr2}.status == EXECUTED (adjacent start == existing end is allowed under half-open intervals)"
            - "Executing the US [2027-08-31, 2028-08-31) agreement returned ERR_AGREEMENT_OVERLAP (one-day overlap with agreement1)"
            - "CoexistenceAgreement.${agr3}.status still == PROPOSED"
            - "CoexistenceAgreement.${agr4}.status == EXECUTED (time-overlapping but territory-disjoint EU agreement)"

      - name: customs_recordation_mandatory_buffer_gap
        grounds:
          - validations[priority=15]
          - errors[ERR_RECORDATION_GAP_VIOLATION]
        distinguishing_aspect: |
          Semantics 2 (mandatory buffer — adjacency FORBIDDEN) on CustomsRecordation,
          a different resource than agreements: for the same record and authority the
          new term_start must be strictly greater than the existing term_end + 30 days,
          so term_start == term_end + 30 days exactly is rejected and +1 second is
          accepted — a fundamentally different interval rule than half-open adjacency.
        test_recipe:
          setup:
            - "Client; REGISTERED record; ACTIVE US_CBP recordation with term [2026-08-15T00:00:00Z, 2027-08-15T00:00:00Z]"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec_id}/register"
              payload: { registration_date: "2026-08-10T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records/${rec_id}/customs-recordations"
              payload: { customs_authority: US_CBP, recordation_number: "CBP-1", term_start: "2026-08-15T00:00:00Z", term_end: "2027-08-15T00:00:00Z" }
              as: Paralegal
              captures: { cr1: $.data.id }
          trigger:
            - call: "POST /brand/trademark-records/${rec_id}/customs-recordations"
              payload: { customs_authority: US_CBP, recordation_number: "CBP-2", term_start: "2027-09-14T00:00:00Z", term_end: "2028-09-14T00:00:00Z" }
              as: Paralegal
              captures: { err: $.data.error_id }
            - call: "POST /brand/trademark-records/${rec_id}/customs-recordations"
              payload: { customs_authority: US_CBP, recordation_number: "CBP-3", term_start: "2027-09-15T00:00:00Z", term_end: "2028-09-15T00:00:00Z" }
              as: Paralegal
              captures: { cr3: $.data.id }
          assert:
            - "term_start == term_end + 30 days exactly (2027-09-14) returned ERR_RECORDATION_GAP_VIOLATION (strict '>' buffer)"
            - "term_start 2027-09-15 (> term_end + 30 days) succeeded; CustomsRecordation.${cr3}.status == ACTIVE"
            - "Both recordations coexist ACTIVE because the buffer (not mere non-overlap) is satisfied"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: budget_conservation_across_issue_reissue_void
        grounds:
          - calculations.fee_accrual_ledger
          - state_machines.CeaseDesistLetter.ISSUED_to_VOID
        distinguishing_aspect: |
          Conserved quantity = money: Client.budget_spent_cents + budget_remaining_cents
          == enforcement_budget_cents after the forward actions (issue +75000, reissue
          +25000) AND after the compensating void-from-ISSUED, which reverses exactly
          100000 and returns spent to 0 with no drift.
        test_recipe:
          setup:
            - "Client budget 500000; PUBLISHED record; INFRINGEMENT matter; letter APPROVED"
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9, 25], application_number: "US-901" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: INFRINGEMENT }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { matter_id: $.data.id }
            - call: "POST /brand/enforcement-matters/${matter_id}/cease-desist-letters"
              payload: { demand_type: CEASE_USE, recipient_name: "Rival Co", recipient_address: "1 Rival Way", response_due_days: 14 }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { letter_id: $.data.id }
            - call: "POST /brand/cease-desist-letters/${letter_id}/submit-review"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/cease-desist-letters/${letter_id}/approve"
              payload: { decision: APPROVED }
              as: PartnerAttorney
              as_user_id: partner_1
            - call: "POST /brand/cease-desist-letters/${letter_id}/issue"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/cease-desist-letters/${letter_id}/record-response"
              payload: { response_outcome: NEGOTIATION_STARTED }
              as: Paralegal
            - call: "POST /brand/cease-desist-letters/${letter_id}/reissue"
              payload: { response_due_days: 10 }
              as: AssociateAttorney
              as_user_id: assoc_1
          trigger:
            - call: "POST /brand/cease-desist-letters/${letter_id}/void"
              as: PartnerAttorney
              as_user_id: partner_1
            - call: "GET /brand/clients/${client_id}"
              as: Paralegal
            - call: "GET /brand/enforcement-matters/${matter_id}"
              as: Paralegal
          assert:
            - "Before void: Client.budget_spent_cents == 100000 and budget_remaining_cents == 400000 (75000 + 25000)"
            - "After void-from-ISSUED: CeaseDesistLetter.${letter_id}.status == VOID"
            - "Client.${client_id}.budget_spent_cents == 0 and budget_remaining_cents == 500000 (full reversal of issue + reissue fees)"
            - "EnforcementMatter.${matter_id}.accrued_fees_cents == 0"
            - "Invariant holds: budget_spent_cents + budget_remaining_cents == enforcement_budget_cents == 500000 at every step"

      - name: counterfeit_ledger_conservation_across_reinstate
        grounds:
          - entities.WatchAlert.fields.confirmed_counterfeit_count
          - state_machines.TakedownFiling.REMOVED_to_REINSTATED
        distinguishing_aspect: |
          Conserved quantity = a derived count ledger (not money):
          confirmed_counterfeit_count must equal the number of the alert's COUNTERFEIT
          filings currently in REMOVED after the forward action (platform REMOVED,
          +1) and after the compensating action (REINSTATED, -1) — the equality, not
          just the direction, is the invariant.
        test_recipe:
          setup:
            - "Client, PUBLISHED record, TRIAGED alert; three COUNTERFEIT filings REMOVED (count == 3)"
          setup_api_calls:
            - call: "POST /brand/clients"
