              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { nd_ct_order_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-ND-NV", patient_state_code: "NV", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { nd_nv_exam_id: $.data.id }
            - call: "POST /exams/${nd_nv_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "C" }
