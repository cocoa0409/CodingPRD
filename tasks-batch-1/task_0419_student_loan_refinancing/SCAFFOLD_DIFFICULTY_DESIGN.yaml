          setup:
            - "A funded Loan placed into FORBEARANCE; a SCHEDULED disbursement on it; officer id != approving underwriter id."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /abs-pools"
              payload: { pool_code: "POOL-P7", max_principal_cents: 20000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b13@x.com", full_name: "B Thirteen", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b13_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b13_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b13_id}"
              captures: { app13_id: $.data.id, app13_ver: $.data.version }
            - call: "POST /applications/${app13_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b13_id}"
            - call: "GET /offers"
              payload: { application_id: "${app13_id}" }
              as: Borrower
              as_user_id: "${b13_id}"
              captures: { offer13_id: "$.data[0].id"}
            - call: "POST /offers/${offer13_id}/lock"
              payload: { expected_application_version: "${app13_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b13_id}"
            - call: "POST /applications/${app13_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-8"
            - call: "POST /applications/${app13_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-8"
              captures: { loan13_id: $.data.id }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan13_id}", prior_servicer_name: "Servicer X", payoff_amount_cents: 3000000 }
              as: DisbursementOfficer
              as_user_id: "do-8"
              captures: { disb13_id: $.data.id }
