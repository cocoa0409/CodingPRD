        grounds: ["concurrency_rules[subscription-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Subscription.version: a pause cascade silently bumps the version, so a PATCH carrying the create-time version is rejected with ERR_STALE_VERSION (412); a PATCH with the freshly read version succeeds."
