# =============================================================================
# SCAFFOLD CORNER DESIGN (§1.9) — Payment Card Security Assessment
#
# Breadth probe over every testable claim §1.1–§1.7 declares that §1.8 does not
# already cover. Sections and claim_type values come from
# references/claim-extraction-guide.md; nothing here invents a category.
#
# Logical clock: unless a recipe moves it with POST /_clock/set_current_utc, the
# clock stands at 2026-08-01T00:00:00Z.
#
# Canonical actors reused across recipes (each recipe still builds its own state):
#   Dana Reyes  dana.reyes@qsa.example  cert 2027-06-30  -> engagement lead
#   Kim Vance   kim.vance@qsa.example   cert 2027-06-30  qa_qualified -> QA reviewer
#   Northstar ASV  approval_expires_at 2027-12-31       -> approved scanning vendor
#
# Fee literals used below (from §1.3 assessment_fee_total, merchant_level L1):
#   0 sampled components / 0 facilities / 0 accepted CCWs -> 160 h -> 43200.00
#   3 sampled components / 1 facility  / 0 accepted CCWs -> 226 h -> 59189.40
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Section 1 — Entities (Table 1 claim types + `graph` topology rows)
  # ---------------------------------------------------------------------------
  - section: entities
    instances:

      - name: entity_assessor_creation_returns_201_with_declared_defaults
        claim_type: Creation
        grounds:
          - entities.Assessor.fields.full_name
          - entities.Assessor.fields.qa_qualified
          - entities.Assessor.fields.certification_status
          - endpoints[POST /assessors]
        distinguishing_aspect: "POST /assessors with only the four declared inputs returns 201 and every field of §1.1 Assessor: the two system enums resolve to ACTIVE, qa_qualified takes its declared default false, lead_engagement_count starts at 0 and version starts at 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == 'object' and meta.api_request_id present"
            - "Assessor.${lead_id}.full_name == 'Dana Reyes' and email == 'dana.reyes@qsa.example'"
            - "Assessor.${lead_id}.certification_expires_at == 2027-06-30T00:00:00Z"
            - "Assessor.${lead_id}.qa_qualified == false (declared default, omitted from the payload)"
            - "Assessor.${lead_id}.status == ACTIVE and certification_status == ACTIVE (clock 2026-08-01 is before 2027-06-30)"
            - "Assessor.${lead_id}.lead_engagement_count == 0"
            - "Assessor.${lead_id}.version == 1 and created_at == updated_at"
            - "${lead_id} is a bare UUID with no type prefix (no 'asr_' or similar)"

      - name: entity_engagement_retrieval_returns_stored_and_derived_fields
        claim_type: Retrieval
        grounds:
          - endpoints[GET /engagements/{id}]
          - entities.Engagement.fields.posture
          - entities.Engagement.fields.assessment_fee_total
        distinguishing_aspect: "GET /engagements/{id} returns the stored input fields verbatim AND every derived field at its zero-state literal — a read must not be a partial projection, and the fee of a scoping engagement with no components is 43200.00, not null."
        test_recipe:
          setup:
            - "One engagement exists in SCOPING with no segments, components, requirements or plans."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: ClientRepresentative
          assert:
            - "HTTP 200; client_legal_name == 'Northwind Retail Inc', merchant_level == 'L1', assessment_year == 2026, acquirer_name == 'First Coast Bank'"
            - "fieldwork_start_date == 2026-08-10 and fieldwork_end_date == 2026-08-28"
            - "lead_assessor_id == ${lead_id} and qa_reviewer_id == ${qa_id}"
            - "status == SCOPING, posture == OPEN, scope_locked == false"
            - "cde_component_count == 0, connected_component_count == 0, out_of_scope_component_count == 0, in_scope_component_count == 0"
            - "unvalidated_segment_count == 0, open_gap_count == 0, accepted_ccw_count == 0, applicable_requirement_count == 0"
            - "estimated_hours == 160 and assessment_fee_total == 43200.00"
            - "quarterly_scan_compliant == false and active_sampling_plan_id is null"
            - "version == 1 - a GET performs no write"

      - name: entity_system_component_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /system-components]
          - entities.SystemComponent.fields.hostname
        distinguishing_aspect: "GET /system-components with limit 2 over a three-row population returns 2 rows with total_count 3 and has_more true; the second page returns the remaining row with has_more false — total_count counts the filtered population, not the page."
        test_recipe:
          setup:
            - "One engagement holds a VALIDATED CDE segment with exactly three components: app-01, pay-01 and pay-02, all at DC-EAST."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "app-01", component_type: "SERVER", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-02", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
          trigger:
            - call: "GET /system-components?engagement_id=${eng_id}&limit=2&offset=0"
              payload: { engagement_id: "${eng_id}", limit: 2, offset: 0 }
              as: Assessor
              as_user_id: "${lead_id}"
            - call: "GET /system-components?engagement_id=${eng_id}&limit=2&offset=2"
              payload: { engagement_id: "${eng_id}", limit: 2, offset: 2 }
              as: Assessor
              as_user_id: "${lead_id}"
            - call: "GET /system-components?engagement_id=${eng_id}&component_type=APPLICATION"
              payload: { engagement_id: "${eng_id}", component_type: "APPLICATION" }
              as: Assessor
              as_user_id: "${lead_id}"
          assert:
            - "First page: HTTP 200, response_type == 'array', exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: exactly 1 row, total_count == 3, has_more == false"
            - "The two pages together contain each of app-01, pay-01 and pay-02 exactly once - no row is repeated or dropped across the boundary"
            - "Filtered call: exactly 2 rows (pay-01 and pay-02), total_count == 2 - total_count reflects the filter, not the table"
            - "Every row carries scope_class == CDE, in_sample == false and sampling_stratum == null (no plan exists yet)"

      - name: entity_engagement_get_with_unknown_uuid_returns_engagement_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_ENGAGEMENT_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unknown UUID on GET /engagements/{id} answers 404 ERR_ENGAGEMENT_NOT_FOUND - the entity's own code, not a generic 404 and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /engagements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_nf} == ERR_ENGAGEMENT_NOT_FOUND"
            - "response_type == 'error' and data.message is a non-empty string"
            - "No engagement row is created as a side effect of the lookup"

      - name: entity_engagement_create_missing_acquirer_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - endpoints[POST /engagements]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "acquirer_name is declared as a required input on POST /engagements; omitting it answers 400 ERR_INVALID_REQUEST at priority 3, ahead of the priority-5 lead_assessor_id resolution that would also have to run."
        test_recipe:
          setup:
            - "Assessors Dana Reyes and Kim Vance exist and are ACTIVE."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_shape: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_shape} == ERR_INVALID_REQUEST"
            - "GET /engagements returns 0 rows - nothing was persisted"
            - "Assessor.${lead_id}.lead_engagement_count == 0 and version == 1"

      - name: entity_change_log_entry_component_id_defaults_to_null
        claim_type: Defaults
        grounds:
          - entities.ChangeLogEntry.fields.component_id
          - entities.ChangeLogEntry.fields.triggers_reassessment
          - endpoints[POST /engagements/{id}/change-log-entries]
        distinguishing_aspect: "component_id is optional with declared default null, so an organisational change records with no component link; the computed triggers_reassessment is still false because STAFF_CHANGE is outside the triggering change_type set even when affects_scope is true."
        test_recipe:
          setup:
            - "One engagement exists in SCOPING with no components."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "STAFF_CHANGE", description: "The client replaced its security officer.", affects_scope: true }
              as: ClientRepresentative
              captures: { cl_id: $.data.id }
          assert:
            - "HTTP 201; ChangeLogEntry.${cl_id}.component_id is null (declared default applied)"
            - "ChangeLogEntry.${cl_id}.affects_scope == true but triggers_reassessment == false - STAFF_CHANGE is not in {COMPONENT_ADDED_TO_CDE, SEGMENT_RECLASSIFIED, THIRD_PARTY_ADDED}"
            - "Engagement.${eng_id}.scope_affecting_change_count == 0 and reassessment_required == false - the counter only counts entries whose triggers_reassessment is true"

      - name: entity_change_log_entry_recorded_at_comes_from_the_logical_clock
        claim_type: System Fields
        grounds:
          - entities.ChangeLogEntry.fields.recorded_at
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "recorded_at is source: system and must be read from the logical clock at write time, not from the wall clock and not from the payload: after the clock is moved to 2026-09-05, the new entry stamps 2026-09-05T00:00:00Z while the earlier entry keeps 2026-08-01T00:00:00Z."
        test_recipe:
          setup:
            - "One engagement exists in SCOPING; the clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "APPLICATION_UPDATED", description: "Payment application patched to 4.2.1.", affects_scope: false }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { cl_early_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { now: $.data.current_utc }
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "THIRD_PARTY_ADDED", description: "A new managed hosting provider took over the DC-EAST cage.", affects_scope: true }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { cl_late_id: $.data.id }
          assert:
            - "${now} == 2026-09-05T00:00:00Z"
            - "ChangeLogEntry.${cl_early_id}.recorded_at == 2026-08-01T00:00:00Z and is unchanged by the clock move"
            - "ChangeLogEntry.${cl_late_id}.recorded_at == 2026-09-05T00:00:00Z"
            - "ChangeLogEntry.${cl_late_id}.triggers_reassessment == true (THIRD_PARTY_ADDED with affects_scope true)"
            - "Engagement.${eng_id}.scope_affecting_change_count == 1 and reassessment_required == false - the inclusive threshold is 3"

      - name: entity_evidence_item_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.EvidenceItem.fields.collector_assessor_id
          - endpoints[GET /evidence-items/{id}]
        distinguishing_aspect: "EvidenceItem is declared common_fields: false, so it carries id and created_at only - no version, no updated_at - and §1.5 exposes no PATCH for it; evidence is append-only, which is exactly why evidence_completeness can never regress."
        test_recipe:
          setup:
            - "One engagement is scope-locked with a FINAL ACTIVE plan over three components at DC-EAST, and requirement 1.2.1 is IN_TESTING with one DOCUMENT_REVIEW evidence item collected by the lead."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
            - call: "POST /network-segments/${seg_cde_id}/segmentation-test-plan"
              payload: { test_method: "PEN_TEST", planned_date: "2026-08-05" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /network-segments/${seg_cde_id}/validation-result"
              payload: { outcome: "PASS", note: "Segmentation verified." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "app-01", component_type: "SERVER", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-02", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v1: $.data.version }
            - call: "POST /engagements/${eng_id}/sampling-plans"
              payload: { plan_variant: "FINAL", justification_text: "Complete coverage of the in-scope inventory.", expected_engagement_version: "${eng_v1}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/scope-lock"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/requirement-assessments"
              payload: { requirement_ref: "1.2.1", requirement_family: "R1", testing_procedure_count: 3, applicability: "APPLICABLE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_a_id: $.data.id }
            - call: "POST /requirement-assessments/${req_a_id}/start-testing"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "DOCUMENT_REVIEW", procedure_ref: "1.2.1.a", sufficiency: "SUFFICIENT", note: "Firewall standard reviewed." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { ev_id: $.data.id }
            - call: "GET /evidence-items/${ev_id}"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
          assert:
            - "HTTP 201 then HTTP 200; EvidenceItem.${ev_id} exposes id and created_at and exposes NO version and NO updated_at field"
            - "EvidenceItem.${ev_id}.collector_assessor_id == ${lead_id}, taken from the acting X-User-ID rather than from the payload"
            - "EvidenceItem.${ev_id}.requirement_assessment_id == ${req_a_id} and component_id is null (a DOCUMENT_REVIEW needs no target)"
            - "§1.5 declares no PATCH and no DELETE for /evidence-items/{id}"
            - "RequirementAssessment.${req_a_id}.evidence_item_count == 1, evidence_type_coverage == ['DOCUMENT_REVIEW'] and evidence_completeness == false"

      - name: entity_component_invalid_component_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - entities.SystemComponent.fields.component_type
        distinguishing_aspect: "component_type is a closed enum; a plausible-but-undeclared value ('FIREWALL') is refused at priority 3 with ERR_INVALID_REQUEST before any uniqueness or facility-consistency rule at priority 13 can run."
        test_recipe:
          setup:
            - "One engagement in SCOPING holds a DECLARED CDE segment and no components."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
