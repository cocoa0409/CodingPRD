              as: AllocationManager
              captures: { ny_ca: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${ny_id}", variety_id: "${ny_citra_id}", crop_year_program_id: "${ny_p28}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 4000, price_per_lb_cents: 250.00, delivery_window_start: "2028-09-01T00:00:00Z", delivery_window_end: "2028-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { ny_cb: $.data.id }
            - call: "POST /crop-year-programs/${ny_p26}/report-harvest"
              payload: { harvest_yield_pct: 100.00, reported_note: "full crop" }
              as: AllocationManager
            - call: "POST /crop-year-programs/${ny_p28}/report-harvest"
              payload: { harvest_yield_pct: 100.00, reported_note: "full crop" }
              as: AllocationManager
            - call: "POST /crop-year-programs/${ny_p29}/report-harvest"
