      - name: ato_signal_weights_sum_and_full_signal_set_scores_exactly_one_hundred
        claim_type: precision
        grounds:
          - calculations.ato_risk_score.constants.SIGNAL_WEIGHTS
          - calculations.ato_risk_score.variants.instant_signal_score
          - calculations.account_fraud_posture
        distinguishing_aspect: "The instant leg is exactly the sum of the per-signal weights with no velocity term and no decay credit: [DEVICE_CHANGE, EMAIL_CHANGE] scores 30 + 20 = 50, which watches but does not lock, while the full five-signal set scores exactly the 100-point ceiling (30 + 20 + 15 + 25 + 10) and review_score stays null until a review runs."
        test_recipe:
          setup:
            - "Two CORE accounts with no transfers at all, so the velocity term cannot contribute to either score."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
