  # ===========================================================================
  # Rule 9 — compensating_invariant (two instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: sort_batch_void_restores_piece_conservation
        grounds:
          - state_machines.SortBatch.OPEN_to_VOIDED
          - entities.SortBatch.fields.total_sorted_pieces
          - entities.CustomerParLevel.fields.current_on_site_pieces
        distinguishing_aspect: |
          Conserved quantity: piece counts. Invariant: for any non-VOIDED
          batch, accepted_pieces + rejected_pieces == total_sorted_pieces, and
          CustomerParLevel.current_on_site_pieces changes ONLY via post
          (decrement by accepted) and mark-delivered (increment). Voiding an
          OPEN batch must leave par on-site unchanged and zero the batch
          counters — forward action (item classification) paired with its
          compensating action (void) leaves the global piece ledger unchanged.
        test_recipe:
          setup:
            - "Plant P; category TOWEL; RENTAL customer C with par_pieces=10 (current_on_site_pieces starts 0)"
            - "Stop picked up; cart received"
            - "Batch B OPEN with 7 ACCEPTED + 2 REJECTED = 9 total"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "TOWEL", piece_weight_lb: 0.5, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 500, cog_wash_rate_cents_per_lb: 120 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "RENTAL", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "PUT /customers/${c_id}/par-levels/${cat_id}"
              payload: { par_pieces: 10 }
              as: PlantAdmin
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 4.5 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 4.5 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 7, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 2, disposition: "REJECTED", reject_reason: "TEAR" }
              as: PlantOperator
            - call: "GET /sort-batches/${b_id}"
              as: PlantOperator
              captures: { total_pre: $.data.total_sorted_pieces, acc_pre: $.data.accepted_pieces, rej_pre: $.data.rejected_pieces }
            - call: "GET /customers/${c_id}/par-levels"
              as: PlantOperator
              captures: { on_site_pre: "$.data[0].current_on_site_pieces" }
          trigger:
            - call: "POST /sort-batches/${b_id}/void"
              payload: {}
              as: PlantOperator
            - call: "GET /sort-batches/${b_id}"
              as: PlantOperator
              captures: { status_post: $.data.status }
            - call: "GET /customers/${c_id}/par-levels"
              as: PlantOperator
              captures: { on_site_post: "$.data[0].current_on_site_pieces" }
          assert:
            - "total_pre == 9"
            - "acc_pre + rej_pre == total_pre"
            - "status_post == VOIDED"
            - "on_site_post == on_site_pre"

      - name: invoice_issue_then_pay_conserves_customer_balance
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_PAID
          - entities.Customer.fields.account_balance_cents
        distinguishing_aspect: |
          Conserved quantity: money (Customer.account_balance_cents) —
          different quantity from pieces. Forward action ISSUE adds
          total_due_cents; compensating action MARK-PAID subtracts the same
          amount; after the pair, account_balance_cents equals its pre-issue
          value exactly (no drift).
