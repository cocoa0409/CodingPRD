  - id: ERR_LINE_ALREADY_DISPUTED
    http: 409
    condition: "an OPEN or UNDER_REVIEW dispute already exists for the line"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AuctionStaff
    description: "Operations staff: venues, principals, sales, cataloging, running the sale, fulfillment."
    identity: "opaque"
    exclusive_operations:
      - "POST /salerooms"
      - "POST /consignors"
      - "POST /bidders"
      - "POST /bidders/{id}/suspend"
      - "POST /auctions"
      - "POST /auctions/{id}/open"
      - "POST /auctions/{id}/close"
      - "POST /consignments/{id}/decision"
      - "POST /lots"
      - "POST /lots/{id}/open"
      - "POST /lots/{id}/hammer"
      - "POST /lots/{id}/pass"
      - "POST /invoices/{id}/ready"
      - "POST /invoices/{id}/fulfill"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /consignments (with AuctionStaff acting for the seller)"
      - "POST /consignments/{id}/settlement (with SettlementOfficer)"
      - "POST /invoices/{id}/payments (with Bidder)"
      - "POST /bids/{id}/retract (with Bidder)"
      - "all GET reads"

  - name: Appraiser
    description: "Values consignments and adjudicates authenticity disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /consignments/{id}/appraise"
      - "POST /disputes/{id}/review"
      - "POST /disputes/{id}/request-info"
      - "POST /disputes/{id}/resolve"
    shared_operations:
      - "all GET reads"

  - name: SettlementOfficer
    description: "Approves and disburses seller payouts."
    identity: "opaque"
    exclusive_operations:
      - "POST /settlements/{id}/approve"
      - "POST /settlements/{id}/pay"
    shared_operations:
      - "POST /consignments/{id}/settlement (with AuctionStaff)"
      - "all GET reads"

  - name: Consignor
    description: "Seller principal; may submit own consignment and view own consignments/settlements."
    identity: "entity_backed:Consignor"
    exclusive_operations: []
    shared_operations:
      - "POST /consignments (consignor_id must equal X-User-ID)"
      - "all GET reads"

  - name: Bidder
    description: "Buyer principal; bids, pays own invoices, raises authenticity disputes."
    identity: "entity_backed:Bidder"
    exclusive_operations:
      - "POST /lots/{id}/bids (bidder_id must equal X-User-ID)"
      - "POST /disputes (line's invoice.bidder_id must equal X-User-ID)"
    shared_operations:
      - "POST /invoices/{id}/payments (invoice.bidder_id must equal X-User-ID; with AuctionStaff)"
      - "POST /bids/{id}/retract (with AuctionStaff)"
      - "all GET reads"
