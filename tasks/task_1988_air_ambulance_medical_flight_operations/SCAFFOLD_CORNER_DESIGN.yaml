            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 55, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id" } }
            - { call: "POST /air-ambulance/ground-legs", payload: { mission_id: "${m_id}", leg_type: "DESTINATION", provider_name: "City EMS", scheduled_pickup_iso: "2026-08-01T09:00:00Z" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
