# =============================================================================
# Task 1763: Confined-Space & Rescue-Standby Services
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerative coverage of §1.1–§1.7 claims beyond the nine Difficulty Rules.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: corner_personnel_create_defaults_applied
        claim_type: defaults
        grounds: [entities.Personnel.fields.max_duty_hours, entities.Personnel.fields.certifications, entities.Personnel.fields.status]
        distinguishing_aspect: "Omitting optional fields applies documented defaults: certifications [], max_duty_hours 12, status ACTIVE, committed_standby_minutes 0."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
          trigger:
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Plain Worker", role_qualifications: [] }, as: OperationsManager, captures: { p_id: "$.data.id" } }
          assert:
            - "Personnel.${p_id}.certifications == []"
            - "Personnel.${p_id}.max_duty_hours == 12"
            - "Personnel.${p_id}.status == ACTIVE"
            - "Personnel.${p_id}.committed_standby_minutes == 0"
            - "Personnel.${p_id}.version == 1"

      - name: corner_personnel_missing_required_fields_rejected
        claim_type: required_fields
        grounds: [entities.Personnel.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /personnel without full_name is rejected with ERR_INVALID_REQUEST (400); no record is created."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rescue-ops/personnel", payload: { role_qualifications: [] }, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: corner_account_defaults_applied
        claim_type: defaults
        grounds: [entities.ClientAccount.fields.minimum_billable_hours, entities.ClientAccount.fields.deployment_surcharge_cents, entities.ClientAccount.fields.balance_cents]
        distinguishing_aspect: "Omitting optional rate fields yields defaults: minimum_billable_hours 4, tier1_hours_threshold 8, tier2_multiplier 1.5, after_hours_multiplier 1.5, weekend_multiplier 2.0, deployment_surcharge_cents 50000; computed balance_cents 0 and on_credit_hold false."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Defaults Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { a_id: "$.data.id" } }
          assert:
            - "ClientAccount.${a_id}.minimum_billable_hours == 4"
            - "ClientAccount.${a_id}.tier1_hours_threshold == 8"
            - "ClientAccount.${a_id}.tier2_multiplier == 1.5"
            - "ClientAccount.${a_id}.after_hours_multiplier == 1.5"
            - "ClientAccount.${a_id}.weekend_multiplier == 2.0"
            - "ClientAccount.${a_id}.deployment_surcharge_cents == 50000"
            - "ClientAccount.${a_id}.balance_cents == 0 and on_credit_hold == false"

      - name: corner_space_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_SPACE_NOT_FOUND]", "endpoints[GET /rescue-ops/confined-spaces/{id}]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent space UUID returns 404 ERR_SPACE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rescue-ops/confined-spaces/00000000-0000-4000-8000-000000000000", as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SPACE_NOT_FOUND"
            - "http status == 404"

      - name: corner_reading_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.AtmosphericReading.fields.within_limits, "validations[priority=5]"]
        distinguishing_aspect: "Client-supplied computed field within_limits in a reading payload is an unknown-field rejection (ERR_INVALID_REQUEST), not silently ignored."
        test_recipe:
          setup: ["ISSUED permit (minimal chain: account, space, permit, issue)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Strict Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-S", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Strict job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0, within_limits: true }, as: Attendant, as_user_id: "${att_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (within_limits is computed; client cannot supply it)"

      - name: corner_reading_immutable_common_field_shape
        claim_type: immutability
        grounds: [entities.AtmosphericReading]
        distinguishing_aspect: "AtmosphericReading declares common_fields: false — its response exposes id and created_at but no version or updated_at keys, and the log is append-only."
        test_recipe:
          setup: ["ISSUED permit (minimal chain)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Immutable Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-IM", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Immutable job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}", captures: { rd: "$.data.id" } }
          assert:
            - "Response data contains keys id, created_at, permit_id, recorded_by, reading_kind, o2_pct, lel_pct, h2s_ppm, co_ppm, recorded_at, within_limits"
            - "Response data does NOT contain a version key and does NOT contain an updated_at key (common_fields: false)"
            - "AtmosphericReading.${rd}.within_limits == true and recorded_by == ${att_id} (server-stamped from X-User-ID)"

      - name: corner_permit_account_fk_denormalized
        claim_type: computed_fields
        grounds: [entities.EntryPermit.fields.client_account_id]
        distinguishing_aspect: "Permit creation denormalizes client_account_id from the parent space; the client cannot supply it."
        test_recipe:
          setup: ["Account with one space"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Denorm Co", billing_mode: "EVENT", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-D", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
          trigger:
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Denorm job", planned_start_at: "2026-08-03T06:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id", per_acct: "$.data.client_account_id" } }
          assert:
            - "EntryPermit.${per}.client_account_id == ${acct} (copied from ConfinedSpace.${sp})"
            - "EntryPermit.${per}.status == DRAFT and reentry_count == 0 and suspension_count == 0"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_permit_activate_from_draft_invalid
        claim_type: invalid_transition
        grounds: [state_machines.EntryPermit.DRAFT_to_ISSUED]
        excluded_because:
          difficulty_instance: activate_state_error_precedes_safety_error
          rationale: "DRAFT -> activate rejection is exactly the failure path asserted in the named §1.8 instance."

      - name: corner_permit_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EntryPermit, "errors[ERR_PERMIT_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED permit rejects every further transition: resume, activate, close, and cancel all fail with ERR_PERMIT_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["Permit created then cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Terminal Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-T", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Terminal job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/cancel", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/resume", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/close", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { err2: "$.data.error_id" } }
          assert:
            - "resume on CANCELLED -> error_id == ERR_PERMIT_INVALID_STATE (409)"
            - "close on CANCELLED -> error_id == ERR_PERMIT_INVALID_STATE (409)"
            - "EntryPermit.${per}.status remains CANCELLED"

      - name: corner_verification_expiry_sweep_boundary
        claim_type: valid_transition
        grounds: [state_machines.IsolationVerification.VERIFIED_to_EXPIRED, calculations.verification_validity_window]
        distinguishing_aspect: "Expiry boundary is inclusive of expires_at: at now == expires_at - 1min the verification is VERIFIED; at now == expires_at exactly the clock sweep moves it to EXPIRED."
        test_recipe:
          setup: ["ISSUED permit with a VENTILATION verification VERIFIED at 2026-08-03T05:30:00Z (expires_at 2026-08-03T17:30:00Z)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Safe One", role_qualifications: ["SAFETY_OFFICER"] }, as: OperationsManager, captures: { so_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Expiry Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-E1", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: true, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Expiry job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-04T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/isolation-verifications", payload: { isolation_type: "VENTILATION", evidence_ref: "vent-1" }, as: SafetyOfficer, as_user_id: "${so_id}", captures: { iso: "$.data.id" } }
            - { call: "POST /rescue-ops/isolation-verifications/${iso}/verify", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}", captures: { iso_exp: "$.data.expires_at" } }
          trigger:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T17:29:00Z" }, as: OperationsManager }
            - { call: "GET /rescue-ops/isolation-verifications/${iso}", as: OperationsManager, captures: { iso_mid: "$.data.status" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T17:30:00Z" }, as: OperationsManager }
            - { call: "GET /rescue-ops/isolation-verifications/${iso}", as: OperationsManager, captures: { iso_final: "$.data.status" } }
          assert:
            - "IsolationVerification.${iso}.expires_at == 2026-08-03T17:30:00Z (verified_at 05:30 + 12h)"
            - "At 17:29: status == VERIFIED"
            - "At 17:30 exactly: status == EXPIRED (now >= expires_at)"

      - name: corner_roster_no_show_sweep
        claim_type: valid_transition
        grounds: [state_machines.RosterEntry.SCHEDULED_to_NO_SHOW, calculations.duty_window_rules]
        distinguishing_aspect: "No-show grace is strictly-greater: at scheduled_start + 15:00 exactly the entry stays SCHEDULED; one minute later the sweep marks NO_SHOW."
        test_recipe:
          setup: ["ISSUED permit; roster entry scheduled 2026-08-03T10:00:00Z-12:00:00Z, never checked in"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Ent One", role_qualifications: [] }, as: OperationsManager, captures: { ent_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "NoShow Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-NS", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "NoShow job", planned_start_at: "2026-08-03T06:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${ent_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:15:00Z" }, as: OperationsManager }
            - { call: "GET /rescue-ops/roster-entries/${ro}", as: OperationsManager, captures: { ro_mid: "$.data.status" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:16:00Z" }, as: OperationsManager }
            - { call: "GET /rescue-ops/roster-entries/${ro}", as: OperationsManager, captures: { ro_final: "$.data.status" } }
          assert:
            - "At 10:15:00 (exactly start + 15 min): status == SCHEDULED (sweep uses strictly-greater)"
            - "At 10:16:00: status == NO_SHOW"
            - "Subsequent check-in on ${ro} would fail with ERR_ROSTER_INVALID_STATE (NO_SHOW is terminal)"

      - name: corner_standby_no_show_sweep
        claim_type: valid_transition
        grounds: [state_machines.StandbyAssignment.SCHEDULED_to_NO_SHOW, calculations.standby_window_rules]
        distinguishing_aspect: "Standby no-show mirrors roster no-show but releases committed minutes: at start+16min the assignment flips to NO_SHOW and the rescuer's committed_standby_minutes drops back by the window length."
        test_recipe:
          setup: ["ISSUED permit with APPROVED plan; rescuer r1 assignment window 2026-08-03T10:00:00Z-12:00:00Z (120 committed minutes), never checked in"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "NoShow Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-NSB", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
