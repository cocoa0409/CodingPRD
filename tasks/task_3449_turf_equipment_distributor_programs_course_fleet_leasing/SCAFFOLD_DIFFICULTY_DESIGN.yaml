  - rule_id: compensating_invariant
    instances:
      - name: lease_billing_conserves_net_contract_value
        grounds:
          - calculations.lease_billing_progression
          - endpoints."POST /turf/admin/run_season_rollover"
        distinguishing_aspect: |
          Conserved quantity: net contract value. Forward action (rollover billing
          for 3 elapsed months) moves 3 x 1068000 = 3204000 from
          remaining_balance_cents to billed_to_date_cents; the pair
          billed + remaining == net_contract_value_cents == 38448000 at every step.
