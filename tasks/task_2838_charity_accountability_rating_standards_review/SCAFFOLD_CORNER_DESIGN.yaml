      - name: occ_rule_dimension_override_stale_cycle
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.dimension-override-stale-cycle
          - validations[priority=9]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/rating-cycles/{rating_cycle_id}/dimension-overrides
          - entities.RatingCycle.fields.weighted_sum_final
        distinguishing_aspect: |
          The second §1.2.1 rule guards a cycle rather than an organization, and its
          parent is the very row the write recomputes: a successful override rewrites
          the cycle's weighted sum, composite and grade, so its version moves under
          the client's feet on every attempt. That makes an override chain the one
          place where an analyst can plausibly hold a version that is exactly one
          behind, and the instance shows the two-step consequence - the same body
          replayed is refused, and the recomputed score is not applied twice.
