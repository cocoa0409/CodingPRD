            - "FlightLeg.${leg_id}.status == PLANNED (unchanged)"
            - "CharterContract.${contract_id}.status == VENDOR_COUNTERSIGNED (unchanged)"

      - name: per_diem_approve_requires_member_in
        grounds:
          - state_machines.PerDiemLedger.transitions
          - entities.TravelPartyMember.fields.status
        distinguishing_aspect: |
          Entity pair PerDiemLedger -> TravelPartyMember (different pair than
          instance 1): ledger DRAFT -> APPROVED is gated on member.status == IN.
          A scratched member's ledger cannot be approved even though the ledger
          itself is in DRAFT.
        test_recipe:
          setup:
            - "Ledger created for member M"
            - "Member M is scratched (IN -> SCRATCHED)"
            - "Approve attempt on M's ledger"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "CLE", display_name: "Cleveland", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "IND", game_tipoff_utc: "2027-01-20T00:00:00Z", return_arrival_utc: "2027-01-21T08:00:00Z" }
