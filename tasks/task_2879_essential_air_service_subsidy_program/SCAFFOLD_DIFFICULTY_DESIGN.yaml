      - name: renegotiation_counter_revise_cycle_bounded_at_three_laps
        grounds:
          - state_machines.RateRenegotiation
          - entities.RateRenegotiation.fields.revision_count
          - validations.priority_32
          - calculations.agreement_obligation_ledger
        non_linear_feature: "bounded cycle — REQUESTED <-> COUNTERED may be traversed repeatedly, but a loop counter caps the number of laps at three revisions and the fourth REVISE is refused, leaving the row parked in COUNTERED"
        distinguishing_aspect: |
          This is the only cycle in the scaffold with an explicit termination counter: the loop is
          legal until revision_count reaches 3, and each lap re-runs the ceiling calculation rather
          than freezing it. The reopen cycle by contrast is unbounded but destroys candidacy, and the
          parallel Proposal machine has no loop at all.
