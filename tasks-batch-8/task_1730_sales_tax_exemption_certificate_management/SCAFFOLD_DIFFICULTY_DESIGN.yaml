  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cert_approve_sod_vs_effective_date_priority
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_SOD_REVIEWER_IS_UPLOADER]
          - errors[ERR_EFFECTIVE_DATE_IN_FUTURE]
        distinguishing_aspect: |
          business_safety (SoD, priority 7) beats business_constraint (effective
          date, priority 12). When reviewer==uploader AND effective_date is in
          the future, the response MUST be ERR_SOD_REVIEWER_IS_UPLOADER, not
          ERR_EFFECTIVE_DATE_IN_FUTURE.
        test_recipe:
          setup:
            - "Tenant, CA jurisdiction, RESALE reason"
            - "Customer C1 onboarded"
            - "Certificate CERT created by u_co1, current version has effective_date=2099-01-01 (future)"
            - "CERT submitted; BEGIN_REVIEW attempted by u_co1 (same as uploader)"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1 Inc", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/jurisdiction_rules"
              payload: { state_code: "CA", accepted_form_types: ["RESALE"], validity_window_days: 0, anchor_rule: "EFFECTIVE_DATE", allows_drop_ship_resale: false, requires_state_registration_number: false, blanket_cert_allowed: false }
              as: TenantAdmin
