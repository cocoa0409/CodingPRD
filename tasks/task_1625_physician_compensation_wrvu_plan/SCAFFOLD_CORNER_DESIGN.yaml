            - { call: "POST /comp/comp-plans/${p1}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${p1}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${p1}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${p1}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/comp-plans", payload: { name: "P2O", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", quality_pool_cents: 120000, fmv_cap_cents: 90000000, supersedes_plan_id: "${p1}", tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4700, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { p2: $.data.id } }
            - { call: "POST /comp/comp-plans/${p2}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${p2}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${p2}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "GET /comp/comp-plans/${p1}", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { p1_v: $.data.version } }
          trigger:
            - { call: "POST /comp/plan-change-requests", payload: { plan_id: "${p1}", successor_plan_id: "${p2}", effective_date: "2026-03-01", summary: "first", expected_comp_plan_version: "${p1_v}" }, as: CompAnalyst, as_user_id: an_1, captures: { pcr1: $.data.id } }
            - { call: "POST /comp/plan-change-requests", payload: { plan_id: "${p1}", successor_plan_id: "${p2}", effective_date: "2026-04-01", summary: "second", expected_comp_plan_version: "${p1_v}" }, as: CompAnalyst, as_user_id: an_1, captures: { err: $.data.error_id } }
          assert:
            - "First create succeeds (201); it incremented P1.version by 1"
            - "Second create with the same (now stale) version: 412 ERR_STALE_VERSION"
            - "GET /comp/comp-plans/${p1}/plan-change-requests returns exactly 1 PCR"
