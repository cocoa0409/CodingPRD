# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Outdoor Gear & Sports Rental — Expert
# 9 rule_ids x >=2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rental_cost_provisional_vs_final_diverges_on_actual_window
        grounds:
          - calculations.quote_rental_cost
          - calculations.final_settlement
          - entities.Reservation.fields.quoted_total_cents
          - entities.Reservation.fields.final_total_cents
        distinguishing_aspect: |
          Same reservation: the provisional quote re-selects the cheapest tier on the
          REQUESTED window (HOURLY=2000) while the final re-selects on the ACTUAL window
          (DAILY=3000); the two whole-cent results differ, both on the Reservation domain.
        test_recipe:
          setup:
            - "Clock at 2026-04-01T09:00:00Z (no season window covers it -> multiplier x1.0)."
            - "GearType KAYAK; RateCard hourly=1000 daily=3000 seasonal_flat=20000 deposit=5000 waiver/day=400 late/h=800 loss=20000 grace=15."
            - "One AVAILABLE GearUnit on that rate card; Customer GOOD/INTERMEDIATE."
            - "Reservation [09:00,11:00) (2h) -> quoted_total_cents=2000, basis HOURLY; confirmed (deposit held); checked out at 09:00."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-04-01T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "Tandem Sea", size_label: "L" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "KAY-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Dana Reed", email: "dana@x.com", skill_level: "INTERMEDIATE" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-04-01T09:00:00Z", due_at: "2026-04-01T11:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id, quoted: $.data.quoted_total_cents, basis: $.data.quoted_rate_basis }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/checkout"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
          trigger:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-04-01T13:30:00Z" }
              as: ShopAdmin
            - call: "POST /rental/reservations/${res_id}/checkin"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
              captures: { final: $.data.final_total_cents, late: $.data.late_fee_cents }
          assert:
            - "Reservation.${res_id}.quoted_total_cents == 2000"
            - "Reservation.${res_id}.quoted_rate_basis == HOURLY"
            - "Reservation.${res_id}.late_fee_cents == 2400"
            - "Reservation.${res_id}.final_total_cents == 5400"
            - "Reservation.${res_id}.final_total_cents != Reservation.${res_id}.quoted_total_cents"

      - name: customer_standing_provisional_clear_then_final_suspended_on_loss
        grounds:
          - calculations.customer_standing
          - entities.Customer.fields.standing
          - entities.Customer.fields.open_loss_balance_cents
          - state_machines.Reservation.RETURNED_to_CLOSED
        distinguishing_aspect: |
          Dual-variant on the Customer domain (distinct from the Reservation-domain variant):
          at check-in the provisional standing reads open_loss_balance_cents=0 (loss not yet
          ledgered) so standing can be WATCH/GOOD, but at settle the posted LOSS_FEE flips the
          SAME customer to SUSPENDED.
        test_recipe:
          setup:
            - "Clock 2026-04-02T09:00:00Z; KAYAK rate card loss_fee=20000; Customer GOOD."
            - "Reservation confirmed and checked out GOOD; renter did NOT opt damage waiver."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-04-02T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "Solo", size_label: "M" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "KAY-2" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Lee Park", email: "lee@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-04-02T09:00:00Z", due_at: "2026-04-02T11:00:00Z", damage_waiver_opted: false, expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/checkout"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-04-02T10:30:00Z" }
              as: ShopAdmin
            - call: "POST /rental/reservations/${res_id}/checkin"
              payload: { condition_rating: "LOST" }
              as: RentalAgent
              captures: { standing_at_checkin: $.data.id }
          trigger:
            - call: "POST /rental/reservations/${res_id}/settle"
              payload: {}
              as: RentalAgent
            - call: "GET /rental/customers/${cust_id}"
              payload: {}
              as: RentalAgent
              captures: { standing_final: $.data.standing, olb: $.data.open_loss_balance_cents }
          assert:
            - "After checkin (provisional) GET Customer.${cust_id}.open_loss_balance_cents == 0"
            - "After settle Customer.${cust_id}.open_loss_balance_cents == 20000"
            - "After settle Customer.${cust_id}.standing == SUSPENDED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rate_tier_min_selection_three_inputs_nonlinear
        grounds:
          - calculations.quote_rental_cost
          - entities.RateCard.fields.hourly_cents
          - entities.RateCard.fields.daily_cents
          - entities.RateCard.fields.seasonal_flat_cents
          - entities.Reservation.fields.quoted_rate_basis
        distinguishing_aspect: |
          Mode (a): chosen_base = min(hourly*span_hours, daily*span_days, seasonal_flat) is a
          >=3-input nonlinear min with a seasonal multiplier applied AFTER the min — a 3h window
          picks HOURLY=3000 over DAILY=3000 only by the pinned tie-break order HOURLY<DAILY.
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z (no season). RateCard hourly=1000 daily=3000 seasonal=20000."
            - "AVAILABLE unit; window [08:00,11:00) = 3h -> base_h=3000, base_d=3000, base_s=20000; tie HOURLY wins."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SUP", name: "Cruiser", size_label: "11ft" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "SUP-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Sam Ng", email: "sam@x.com", skill_level: "EXPERT" }
              as: Renter
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-01T08:00:00Z", due_at: "2026-05-01T11:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: Renter
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id, quoted: $.data.quoted_total_cents, basis: $.data.quoted_rate_basis }
          assert:
            - "Reservation.${res_id}.quoted_total_cents == 3000"
            - "Reservation.${res_id}.quoted_rate_basis == HOURLY"

      - name: addons_round_per_line_then_sum_not_sum_then_round
        grounds:
          - calculations.addons_total
          - entities.ReservationAddOn.fields.price_cents
          - entities.AddOn.fields.kind
        distinguishing_aspect: |
          Mode (b): two PACKAGE add-ons at 333c each trigger the 0.95 bundle discount; the pinned
          order rounds EACH line first (round(316.35)=316, twice -> 632) — sum-then-round would
          give round(632.7)=633. The scaffold must produce 632, not 633.
        test_recipe:
          setup:
            - "Clock 2026-05-02T08:00:00Z. SUP gear type, AVAILABLE unit, QUOTED reservation."
            - "Two active PACKAGE add-ons price_cents=333 in SUP category."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-02T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SUP", name: "Race", size_label: "14ft" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "SUP-2" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/addons"
              payload: { kind: "PACKAGE", category: "SUP", name: "Dry Bag", price_cents: 333 }
              as: ShopAdmin
              captures: { ao1_id: $.data.id }
            - call: "POST /rental/addons"
              payload: { kind: "PACKAGE", category: "SUP", name: "Cooler", price_cents: 333 }
              as: ShopAdmin
              captures: { ao2_id: $.data.id }
            - call: "POST /rental/customers"
              payload: { full_name: "Ivy Cho", email: "ivy@x.com", skill_level: "EXPERT" }
              as: Renter
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-02T08:00:00Z", due_at: "2026-05-02T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: Renter
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/addons"
              payload: { addon_id: "${ao1_id}" }
              as: Renter
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /rental/reservations/${res_id}/addons"
              payload: { addon_id: "${ao2_id}" }
              as: Renter
              as_user_id: "${cust_id}"
            - call: "GET /rental/reservations/${res_id}"
              payload: {}
              as: Renter
              as_user_id: "${cust_id}"
              captures: { qt: $.data.quoted_total_cents }
          assert:
            - "addons subtotal contributed to Reservation.${res_id}.quoted_total_cents == 632 (NOT 633)"
            - "Reservation.${res_id}.quoted_total_cents == 2632"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_lifecycle_and_payment_dimensions
        grounds:
          - state_machines.Reservation.QUOTED_to_CONFIRMED
          - entities.Reservation.fields.lifecycle_status
          - entities.Reservation.fields.payment_status
        distinguishing_aspect: |
          Parallel shape on Reservation: lifecycle_status (QUOTED->CONFIRMED) and payment_status
          (UNPAID->DEPOSIT_HELD) are independent axes that advance together on confirm but are
          distinct fields — confirm leaves lifecycle=CONFIRMED AND payment=DEPOSIT_HELD.
        test_recipe:
          setup:
            - "AVAILABLE SUP unit; QUOTED reservation by EXPERT customer at clock 2026-05-03T08:00Z."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-03T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SUP", name: "Yoga", size_label: "10ft" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "SUP-3" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Ana Vela", email: "ana@x.com", skill_level: "EXPERT" }
              as: Renter
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-03T08:00:00Z", due_at: "2026-05-03T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: Renter
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: Renter
              as_user_id: "${cust_id}"
              captures: { lc: $.data.lifecycle_status, ps: $.data.payment_status }
          assert:
            - "Reservation.${res_id}.lifecycle_status == CONFIRMED"
            - "Reservation.${res_id}.payment_status == DEPOSIT_HELD"

      - name: gear_unit_condition_cycle_returns_to_available
        grounds:
          - state_machines.GearUnit.INSPECTING_to_AVAILABLE
          - state_machines.GearUnit.AVAILABLE_to_RESERVED
          - entities.GearUnit.fields.availability
        distinguishing_aspect: |
          Cyclic shape on GearUnit (a different entity than Reservation): a unit traverses
          AVAILABLE->RESERVED->CHECKED_OUT->INSPECTING->AVAILABLE and is reservable again,
          proving the machine loops rather than terminating.
        test_recipe:
          setup:
            - "SUP unit fully cycled once through a clean rental, settled back to AVAILABLE."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SUP", name: "AllRound", size_label: "10ft6" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "SUP-4" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Bo Tran", email: "bo@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-04T08:00:00Z", due_at: "2026-05-04T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/checkout"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-04T09:30:00Z" }
              as: ShopAdmin
            - call: "POST /rental/reservations/${res_id}/checkin"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
          trigger:
            - call: "POST /rental/reservations/${res_id}/settle"
              payload: {}
              as: RentalAgent
            - call: "GET /rental/gear-units/${gu_id}"
              payload: {}
              as: RentalAgent
              captures: { avail: $.data.availability }
          assert:
            - "GearUnit.${gu_id}.availability == AVAILABLE"
            - "GearUnit.${gu_id}.active_reservation_id == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: loss_checkin_cascade_depth3_retire_unit_and_suspend_customer
        grounds:
          - state_machines.Reservation.PICKED_UP_to_RETURNED
          - state_machines.GearUnit.INSPECTING_to_RETIRED
          - calculations.damage_charge
          - calculations.customer_standing
          - entities.GearUnit.fields.availability
          - entities.Customer.fields.standing
        distinguishing_aspect: |
          Depth-3 chain from a single check-in trigger: checkin creates the CHECKIN
          ConditionReport(LOST) (link 1) -> that report's creation creates the DamageAssessment
          with outcome=LOSS (link 2, caused by link 1) -> that LOSS outcome retires the GearUnit
          AND on settle posts LOSS_FEE that flips Customer.standing=SUSPENDED (link 3, caused by
          link 2). Each link is caused by the prior, not by checkin directly.
        test_recipe:
          setup:
            - "EXPERT customer, CHECKED_OUT reservation at clock 2026-05-05T08:00Z, condition GOOD at checkout."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-05T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SKI", name: "Carve", size_label: "170cm" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "SKI-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Cy Webb", email: "cy@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-05T08:00:00Z", due_at: "2026-05-05T10:00:00Z", damage_waiver_opted: false, expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/checkout"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-05T09:30:00Z" }
              as: ShopAdmin
          trigger:
            - call: "POST /rental/reservations/${res_id}/checkin"
              payload: { condition_rating: "LOST" }
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/settle"
              payload: {}
              as: RentalAgent
            - call: "GET /rental/gear-units/${gu_id}"
              payload: {}
              as: RentalAgent
              captures: { avail: $.data.availability }
            - call: "GET /rental/damage-assessments?reservation_id=${res_id}"
              payload: {}
              as: RentalAgent
              captures: { da_outcome: $.data.0.outcome, da_charge: $.data.0.charge_cents }
            - call: "GET /rental/customers/${cust_id}"
              payload: {}
              as: RentalAgent
              captures: { standing: $.data.standing }
          assert:
            - "DamageAssessment for ${res_id} outcome == LOSS, charge_cents == 20000"
            - "GearUnit.${gu_id}.availability == RETIRED"
            - "Customer.${cust_id}.standing == SUSPENDED"

      - name: cancel_cascade_depth2_release_unit_and_refund_deposit
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.GearUnit.RESERVED_to_AVAILABLE
          - entities.GearUnit.fields.availability
          - entities.Reservation.fields.payment_status
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (cancel, vs the check-in trigger above): cancel
          moves the Reservation to CANCELLED (link 1) -> that cancellation releases the GearUnit
          RESERVED->AVAILABLE and posts a DEPOSIT_REFUND LedgerEntry flipping payment_status to
          REFUNDED (link 2, caused by link 1).
        test_recipe:
          setup:
