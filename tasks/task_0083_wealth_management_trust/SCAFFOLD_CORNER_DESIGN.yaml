  # =========================================================================
  # RBAC — role denials (segregation_of_duties + entity ownership)
  # =========================================================================
  - section: rbac
    instances:
      - name: beneficiary_cannot_create_trust_forbidden_role
        claim_type: role_denied
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A Beneficiary calling POST /trusts (a TrustAdmin-exclusive op) is rejected with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A grantor and a beneficiary exist; the beneficiary acts."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G RB", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
          trigger:
            - call: "POST /trusts"
              payload: { name: "Sneaky Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: Beneficiary
              as_user_id: "${ben_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: grantor_not_owner_cannot_revoke_other_trust
        claim_type: ownership_denied
        grounds: [roles, "validations[priority=4]", "errors[ERR_NOT_OWNER]", state_machines.Trust.ACTIVE_to_REVOKED]
        distinguishing_aspect: "A Grantor whose X-User-ID != Trust.grantor_id calling POST /trusts/{id}/revoke is rejected with ERR_NOT_OWNER (403)."
        test_recipe:
          setup: ["ACTIVE REVOCABLE trust owned by grantor G1; a second grantor G2 attempts to revoke it."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G1 Owner", generation_level: 0 }
              as: TrustAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /grantors"
              payload: { full_name: "G2 Stranger", generation_level: 0 }
              as: TrustAdmin
              captures: { g2_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T RB2" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "RB2 Trust", grantor_id: "${g1_id}", trust_type: "REVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 100000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /trusts/${trust_id}/revoke"
              payload: {}
              as: Grantor
              as_user_id: "${g2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 403"
            - "data.error_id == ERR_NOT_OWNER"

      - name: missing_headers_returns_unauthenticated
        claim_type: role_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role to GET /trusts/{id} returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A trust exists."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Auth", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Auth Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
          trigger:
            - call: "GET /trusts/${trust_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-Cutting Complexity Layers — OCC, cascade, dual-variant,
  #                                   derived-field reconciliation
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: gst_alloc_stale_trust_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[gst-allocation-stale-trust]", "errors[ERR_STALE_TRUST_VERSION]", endpoints]
        distinguishing_aspect: "After a first GST allocation advances Trust.version, a second allocation still carrying the pre-allocation expected_trust_version is rejected ERR_STALE_TRUST_VERSION (412); a correct version succeeds."
        test_recipe:
          setup: ["ACTIVE trust owned by grantor G (large default exemption pool), principal 5000000; one allocation already posted, advancing Trust.version."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G OCC", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T OCC" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "OCC Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "GET /trusts/${trust_id}"
              payload: {}
              as: TrustAdmin
              captures: { tv0: $.data.version }
            - call: "POST /trusts/${trust_id}/gst-exemption-allocations"
              payload: { grantor_id: "${g_id}", amount_cents: 1000000, expected_trust_version: "${tv0}" }
              as: TrustAdmin
          trigger:
            - call: "POST /trusts/${trust_id}/gst-exemption-allocations"
              payload: { grantor_id: "${g_id}", amount_cents: 1000000, expected_trust_version: "${tv0}" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412"
            - "data.error_id == ERR_STALE_TRUST_VERSION"

      - name: gst_alloc_version_increments_on_success
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[gst-allocation-stale-trust]", entities.Trust.fields.version, entities.Trust.fields.inclusion_ratio]
        distinguishing_aspect: "A successful GST allocation increments Trust.version by exactly 1 and recomputes inclusion_ratio: principal 5000000 with 1000000 allocated => inclusion_ratio = 0.8."
        test_recipe:
          setup: ["ACTIVE trust, principal 5000000, version captured before allocation."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G OCC2", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T OCC2" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "OCC2 Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "GET /trusts/${trust_id}"
              payload: {}
              as: TrustAdmin
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /trusts/${trust_id}/gst-exemption-allocations"
              payload: { grantor_id: "${g_id}", amount_cents: 1000000, expected_trust_version: "${tv}" }
              as: TrustAdmin
            - call: "GET /trusts/${trust_id}"
              payload: {}
              as: TrustAdmin
              captures: { tv_after: $.data.version, ratio: $.data.inclusion_ratio }
          assert:
            - "Trust.${trust_id}.version increased by exactly 1 relative to ${tv}"
            - "Trust.${trust_id}.inclusion_ratio == 0.8"

      - name: balances_reconciled_after_receipt
        claim_type: derived_field_reconciliation
        grounds: [entities.Trust.fields.principal_balance_cents, entities.Trust.fields.income_balance_cents, calculations.principal_income_allocation]
        distinguishing_aspect: "After posting CONTRIBUTION 5000000 (PRINCIPAL) and INTEREST 30000 (INCOME), Trust.principal_balance_cents == 5000000 and income_balance_cents == 30000 — derived balances reconcile on each receipt."
        test_recipe:
          setup: ["A FUNDED-or-later trust with an OPEN account; one contribution and one interest receipt posted."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Rec", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T Rec" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Rec Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 30000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "GET /trusts/${trust_id}"
              payload: {}
              as: TrustAdmin
              captures: { prin: $.data.principal_balance_cents, inc: $.data.income_balance_cents }
          assert:
            - "Trust.${trust_id}.principal_balance_cents == 5000000"
            - "Trust.${trust_id}.income_balance_cents == 30000"

      - name: dual_variant_capital_gain_income_increases_dni
        claim_type: dual_variant_calculation
        grounds: [calculations.principal_income_allocation, calculations.distributable_net_income, entities.Trust.fields.capital_gains_to_income]
        excluded_because:
          difficulty_instance: dual_variant_calc / capital_gain_to_principal_vs_income_allocation
          rationale: "The capital-gain income/principal divergence is the named §1.8 dual-variant instance."

  # =========================================================================
  # Consistency Model — immediate visibility
  # =========================================================================
  - section: consistency_model
    instances:
      - name: pay_cascade_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Distribution.APPROVED_to_PAID, entities.Distribution.fields.dni_carried_amount_cents]
        distinguishing_aspect: "The pay response itself carries the cascaded dni_carried_amount_cents (50000) computed in the same request — immediate consistency, no re-read needed."
        test_recipe:
          setup: ["ACTIVE non-grantor trust, capital_gains_to_income=false; account OPEN DNI=100000 + 5000000 principal; one MANDATORY 50000 distribution to non-skip Ben A, APPROVED (proposer t1, approver t2)."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Imm", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Prop T" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Appr T" }
              as: TrustAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Imm Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", capital_gains_to_income: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t2_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 100000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 50000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t1_id}" }
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /distributions/${dist_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t2_id}"
          trigger:
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { carried: $.data.dni_carried_amount_cents, st: $.data.status }
          assert:
            - "pay response data.status == PAID"
            - "pay response data.dni_carried_amount_cents == 50000"
