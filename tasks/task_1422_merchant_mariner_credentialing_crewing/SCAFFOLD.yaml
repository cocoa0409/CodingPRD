    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TrainingEnrollment[]"
    side_effects: []
  - method: GET
    path: "/training-enrollments/{id}"
    description: "Get one enrollment"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: []
  - method: POST
    path: "/training-enrollments/{id}/approve"
