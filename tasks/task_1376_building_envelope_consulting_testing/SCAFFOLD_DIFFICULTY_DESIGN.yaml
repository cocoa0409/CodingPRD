        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger: POST
          .../litigation-holds/{id}/release mutates the hold; that mutation
          clears Engagement.litigation_hold_active, which itself re-derives
          posture FROZEN -> OPEN and re-enables posture-gated operations —
          demonstrated by a design-review start-review that failed while FROZEN
          and succeeds after release.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS; design review SUBMITTED; litigation hold applied (posture FROZEN); start-review attempted and rejected while FROZEN"
