# =============================================================================
# §1.8 Scaffold Difficulty Design — Provider Appointment Marketplace
# 9 Difficulty Rules x 2 instances = 18 instances.
# All times are ISO 8601 UTC against the logical clock (default 2026-09-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: payout_provisional_vs_final_settlement
        grounds:
          - calculations.calc_payout_reconciliation
          - calculations.calc_invoice_aggregate
          - calculations.calc_fee_split
          - entities.Invoice.fields.payout_provisional_cents
          - entities.Invoice.fields.payout_final_cents
        distinguishing_aspect: |
          Charge/Invoice-domain dual variant: the provisional variant sums
          per-charge net_to_practice_cents, the final variant credits the tier
          discount back at invoice level — identical charge data yields
          payout_final_cents - payout_provisional_cents == discount_cents == 1650.
        test_recipe:
          setup:
            - "PER_BOOKING practice (ACTIVE) with one ACTIVE provider"
            - "Appointment type copay 10000; 11 non-overlapping OPEN slots"
            - "One patient books all 11 slots; no ContactEvents exist, so every booking is ATTRIBUTED"
            - "Invoice generated for period 2026-09"
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/appointment-types"
              payload: { code: "NEW30", display_name: "New patient 30", duration_minutes: 30, booked_copay_cents: 10000 }
