scenario: "Off-Campus Student-Housing Marketplace: property & by-bed lease, roommate-match & floorplan, guarantor/cosigner & installment, academic-year term & turnover, university-partner & verification, summer sublet, amenity, payout"
domain_name: "off-campus-student-housing"
# Flat topology: every collection is a top-level path. `api_prefix: "/"` means no
# nesting prefix — the §1.5 `path:` values below are the complete, absolute paths.
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit foreign keys; no
  # nesting in URL paths except the single `GET /leases/{id}/installments`
  # reverse-reachability sub-resource.

  state_machine_shape: parallel
  # Lease carries two independent state axes on the same row
  # (lease_status x funding_status). GuarantorApplication is cyclic
  # (UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW). Property is
  # compound (LISTED <-> FULLY_COMMITTED derived from Unit bed rollups).
  # Student verification is branching-with-revert (REJECTED -> PENDING).

  relationship_patterns:
    - one_to_many          # Property -> Unit, Lease -> Installment
    - many_to_many         # Student <-> RoommateGroup via GroupMembership
    - self_referential     # Lease.replaces_lease_id -> Lease.id (turnover / renewal chain)
    - cross_aggregate      # AmenityAssignment couples Amenity (Property aggregate) to Lease (Student aggregate)

  role_model: segregation_of_duties
  # A Payout submitted by PlatformAdmin user U cannot be approved by the same
  # X-User-ID; approval requires a different PlatformAdmin operator.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Global constants. EVERY named constant referenced anywhere in this scaffold
# (calculations, validations, state-machine guards, endpoint side effects) is
# declared here with a concrete numeric value.
# ---------------------------------------------------------------------------
constants:
  # --- logical clock -------------------------------------------------------
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"   # server startup default logical time

  # --- lease term geometry -------------------------------------------------
  MIN_LEASE_TERM_DAYS: 90                # inclusive lower bound on term_days
  MAX_LEASE_TERM_DAYS: 400               # inclusive upper bound on term_days
  TURNOVER_BUFFER_DAYS: 14               # mandatory vacancy gap between two leases on one bed slot
  DAYS_PER_YEAR: 365                     # divisor for the daily-rate conversion
  QUOTE_MONTH_DAYS: 30                   # whole-month basis used by the QUOTED variant and by fee month counts

  # --- installments --------------------------------------------------------
  MIN_INSTALLMENT_COUNT: 1
  MAX_INSTALLMENT_COUNT: 12
  INSTALLMENT_INTERVAL_DAYS: 30          # spacing between consecutive RENT installment due dates
  LATE_GRACE_DAYS: 5                     # an installment is LATE only when clock_date > due_date + 5 days (strict)
  LATE_FEE_BPS: 500                      # 5.00% of the installment amount
  LATE_FEE_CAP_CENTS: 7500               # hard ceiling on a single late fee

  # --- university partner --------------------------------------------------
  PARTNER_DISCOUNT_BPS_PREFERRED: 500    # 5.00% off the contracted gross, ACADEMIC_YEAR terms only
  PARTNER_DISCOUNT_BPS_STANDARD: 0
  VERIFICATION_TOKEN_TTL_DAYS: 14        # enrollment-verification request expiry window

  # --- guarantor / cosigner ------------------------------------------------
  GUARANTOR_RENT_THRESHOLD_CENTS: 120000 # monthly rent strictly above this always demands a guarantor
  GUARANTOR_MIN_INCOME_MULTIPLE_BPS: 30000  # 3.0000x annual rent, compared with >=
  GUARANTOR_MAX_REVIEW_ROUNDS: 3         # resubmission is refused once round_count reaches this

  # --- roommate matching ---------------------------------------------------
  MATCH_SCORE_MAX: 100
  MATCH_SCORE_MIN: 0
  MATCH_CLEANLINESS_WEIGHT: 12           # penalty per point of cleanliness_level difference
  MATCH_NOISE_WEIGHT: 8                  # penalty per point of noise_tolerance difference
  MATCH_SLEEP_PENALTY: 25                # flat penalty when sleep_schedule differs
  MATCH_SMOKER_PENALTY: 30               # flat penalty when smoker differs
  GROUP_MIN_AVG_MATCH_SCORE: 55          # lock requires average_match_score >= this
  GROUP_MIN_SIZE: 2
  GROUP_MAX_SIZE: 8

  # --- sublet --------------------------------------------------------------
  SUBLET_MIN_TERM_DAYS: 21
  SUBLET_MAX_MARKUP_BPS: 11000           # sublet rent may not exceed 110.00% of the lease monthly rent
  SUBLET_FEE_BPS: 800                    # 8.00% of the sublet total
  SUBLET_MIN_FEE_CENTS: 2500             # floor on the platform sublet fee

  # --- amenity -------------------------------------------------------------
  AMENITY_MIN_TERM_DAYS: 30              # closed-interval window length floor

  # --- payout --------------------------------------------------------------
  PAYOUT_TIER1_MAX_CENTS: 500000         # gross < this  -> PAYOUT_TIER1_BPS
  PAYOUT_TIER2_MAX_CENTS: 2000000        # gross < this  -> PAYOUT_TIER2_BPS  (else tier 3)
  PAYOUT_TIER1_BPS: 900
  PAYOUT_TIER2_BPS: 700
  PAYOUT_TIER3_BPS: 500
  MAINTENANCE_HOLDBACK_BPS: 200          # 2.00% of gross retained in the property maintenance reserve
  PAYOUT_REBATE_MIN_SUBTOTAL_CENTS: 150000  # loyalty rebate applies when subtotal >= this
  PAYOUT_REBATE_PCT_BPS: 1000            # rebate = 10.00% of the platform fee
  PAYOUT_MIN_BALANCE_CENTS: 50000        # Property.payout_eligible flips true at escrow >= this

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: University
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Institution display name."
      - name: code
        type: string
        source: input
        description: "Short institution code, unique across all universities."
        constraints: "2-8 uppercase alphanumeric characters; unique"
      - name: partner_tier
        type: enum
        source: input
        description: "Partnership level with the marketplace."
        default: "STANDARD"
        constraints: "one of {STANDARD, PREFERRED}"
      - name: partner_discount_bps
        type: integer
        source: computed
        description: "PARTNER_DISCOUNT_BPS_PREFERRED (500) when partner_tier == PREFERRED, else PARTNER_DISCOUNT_BPS_STANDARD (0). Recomputed whenever partner_tier is set."
      - name: verification_required
        type: boolean
        source: input
        description: "When true, a Student of this university must reach verification_status VERIFIED before any lease of theirs may leave DRAFT."
        default: true
      - name: academic_year_start_date
        type: string
        source: input
        description: "ISO 8601 calendar date (YYYY-MM-DD) on which the covered academic year begins."
      - name: academic_year_end_date
        type: string
        source: input
        description: "ISO 8601 calendar date on which the covered academic year ends; must be strictly after academic_year_start_date."
      - name: partner_admin_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the UniversityPartner operator authorised to decide enrollment verifications for this university."
      - name: verified_student_count
        type: integer
        source: computed
        description: "Count of Students with university_id == this University.id and verification_status == VERIFIED."
        default: 0

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: university_id
        type: string
        source: input
        description: "FK -> University.id; the campus this building serves."
      - name: manager_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PropertyManager who created the property; every PropertyManager mutation on this property and its units, amenities, leases, guarantor applications and sublets requires X-User-ID == this value."
      - name: name
        type: string
        source: input
        description: "Building display name."
      - name: address_line
        type: string
        source: input
        description: "Street address of the building."
      - name: distance_to_campus_m
        type: integer
        source: input
        description: "Walking distance from the campus centre in metres."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Listing posture. DRAFT on create; LISTED once published; FULLY_COMMITTED is a system-derived posture entered when available_bed_count reaches 0; SUSPENDED blocks new leasing and subletting."
        default: "DRAFT"
        constraints: "one of {DRAFT, LISTED, FULLY_COMMITTED, SUSPENDED}"
      - name: unit_count
        type: integer
        source: computed
        description: "Count of Units with property_id == this Property.id."
        default: 0
      - name: total_bed_count
        type: integer
        source: computed
        description: "Sum over this property's Units of the length of Unit.bed_labels."
        default: 0
      - name: available_bed_count
        type: integer
        source: computed
        description: "Sum over this property's Units of Unit.available_bed_count."
        default: 0
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: "Collected-but-undisbursed cash held for this property; see calculations.property_escrow_balance."
        default: 0
      - name: maintenance_reserve_cents
        type: integer
        source: computed
        description: "Cumulative maintenance holdback retained from PAID payouts; see calculations.property_escrow_balance."
        default: 0
      - name: payout_eligible
        type: boolean
        source: computed
        description: "True exactly when escrow_balance_cents >= PAYOUT_MIN_BALANCE_CENTS (50000)."
        default: false

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the building containing this unit."
      - name: unit_number
        type: string
        source: input
        description: "Door number, unique within the owning property."
      - name: floorplan_code
        type: string
        source: input
        description: "Floorplan identifier such as `4x2`; groups units that share a layout."
      - name: bedroom_count
        type: integer
        source: input
        description: "Number of private bedrooms in this unit; must equal the length of bed_labels."
        constraints: "1 <= bedroom_count <= 8"
      - name: bathroom_count
        type: integer
        source: input
        description: "Number of bathrooms in this unit."
        constraints: ">= 1"
      - name: bed_labels
        type: array
        source: input
        description: "Ordered array of distinct bed-slot labels (strings), e.g. [\"A\",\"B\",\"C\",\"D\"]. Bed allocation always walks this list in lexicographic ascending order."
        constraints: "non-empty; entries unique; length == bedroom_count"
      - name: base_rent_cents_per_bed_monthly
        type: integer
        source: input
        description: "List monthly rent per bed, in cents; snapshotted onto every Lease created against this unit."
        constraints: "> 0"
      - name: leased_bed_count
        type: integer
        source: computed
        description: "Count of Leases on this unit whose lease_status is in {PENDING_GUARANTOR, PENDING_SIGNATURE, ACTIVE}."
        default: 0
      - name: available_bed_count
        type: integer
        source: computed
        description: "len(bed_labels) - leased_bed_count. The partition len(bed_labels) == leased_bed_count + available_bed_count is a conserved invariant."
        default: 0
      - name: occupancy_status
        type: enum
        source: computed
        description: "AVAILABLE when leased_bed_count == 0; FULLY_LEASED when available_bed_count == 0; PARTIALLY_LEASED otherwise."
        default: "AVAILABLE"
        constraints: "one of {AVAILABLE, PARTIALLY_LEASED, FULLY_LEASED}"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: university_id
        type: string
        source: input
        description: "FK -> University.id; the institution the student is enrolled at."
      - name: full_name
        type: string
        source: input
        description: "Student display name."
      - name: email
        type: string
        source: input
        description: "Contact email, unique across all students."
        constraints: "unique"
      - name: credit_score_band
        type: enum
        source: input
        description: "Underwriting band used by the guarantor-requirement rule."
        default: "FAIR"
        constraints: "one of {THIN, LOW, FAIR, GOOD, EXCELLENT}"
      - name: cleanliness_level
        type: integer
        source: input
        description: "Self-reported tidiness on a 1-5 scale; input to the roommate pair-compatibility formula."
        constraints: "1 <= cleanliness_level <= 5"
      - name: noise_tolerance
        type: integer
        source: input
        description: "Self-reported noise tolerance on a 1-5 scale; input to the roommate pair-compatibility formula."
        constraints: "1 <= noise_tolerance <= 5"
      - name: sleep_schedule
        type: enum
        source: input
        description: "Chronotype used by the roommate pair-compatibility formula."
        constraints: "one of {EARLY, LATE}"
      - name: smoker
        type: boolean
        source: input
        description: "Smoking habit used by the roommate pair-compatibility formula."
        default: false
      - name: verification_status
        type: enum
        source: system
        description: "Enrollment-verification posture driven by the Student verification state machine."
        default: "UNVERIFIED"
        constraints: "one of {UNVERIFIED, PENDING, VERIFIED, REJECTED}"
      - name: verification_submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent verification request; null before the first request."
      - name: verification_expires_at
        type: datetime
        source: system
        description: "verification_submitted_at + VERIFICATION_TOKEN_TTL_DAYS (14) days; a decision after this instant is refused."
      - name: verification_decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent VERIFIED/REJECTED decision; null until one is made."

  - name: RoommateGroup
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the building the group intends to lease in."
      - name: lead_student_id
        type: string
        source: system
        description: "FK -> Student.id; the creating student, taken from X-User-ID. The lead anchors the LEAD_ANCHORED match variant and is the only actor permitted to invite, lock or disband."
      - name: name
        type: string
        source: input
        description: "Group display name."
      - name: required_size
        type: integer
        source: input
        description: "Exact number of ACCEPTED memberships the group must hold before it may be locked."
        constraints: "GROUP_MIN_SIZE (2) <= required_size <= GROUP_MAX_SIZE (8)"
      - name: status
        type: enum
        source: system
        description: "Group lifecycle posture."
        default: "FORMING"
        constraints: "one of {FORMING, LOCKED, PLACED}"
      - name: accepted_member_count
        type: integer
        source: computed
        description: "Count of GroupMemberships for this group whose status is in {ACCEPTED, PLACED}."
        default: 0
      - name: average_match_score
        type: integer
        source: computed
        description: "PAIRWISE_MEAN variant of calculations.roommate_match_score over the ACCEPTED member set; null until the group is locked."
      - name: lead_anchored_mean_score
        type: integer
        source: computed
        description: "LEAD_ANCHORED variant of calculations.roommate_match_score over the ACCEPTED member set; null until the group is locked. Diverges from average_match_score on the same member set."
      - name: placed_unit_id
        type: string
        source: system
        description: "FK -> Unit.id; the unit the group was placed into; null until status == PLACED."

  - name: GroupMembership
    parent: null
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: system
        description: "FK -> RoommateGroup.id; taken from the invitation path."
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the invited student. A student may hold at most one non-DECLINED membership per group."
      - name: sequence_number
        type: integer
        source: system
        description: "1-based monotonic ordinal assigned within the group (the lead's own membership is 1). Bed labels are allocated in ascending sequence_number order at placement; this is the sole ordering key and it is unique within a group."
      - name: status
        type: enum
        source: system
        description: "Invitation lifecycle."
        default: "INVITED"
        constraints: "one of {INVITED, ACCEPTED, DECLINED, PLACED}"
      - name: match_score
        type: integer
        source: computed
        description: "LEAD_ANCHORED variant of calculations.roommate_match_score: the pair score between this membership's student and the group's lead student, evaluated at membership creation."

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the leaseholder."
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit containing the leased bed slot."
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; denormalised from Unit.property_id at creation."
      - name: roommate_group_id
        type: string
        source: system
        description: "FK -> RoommateGroup.id; set only on leases minted by a group placement, null otherwise."
      - name: replaces_lease_id
        type: string
        source: system
        description: "FK -> Lease.id; set only on leases minted by POST /leases/{id}/renew, pointing at the lease being turned over."
      - name: bed_label
        type: string
        source: input
        description: "Which bed slot inside the unit this lease occupies; must be a member of Unit.bed_labels."
      - name: term_start_date
        type: string
        source: input
        description: "ISO 8601 calendar date; inclusive start of the half-open occupancy interval [term_start_date, term_end_date)."
      - name: term_end_date
        type: string
        source: input
        description: "ISO 8601 calendar date; exclusive end of the occupancy interval."
      - name: term_days
        type: integer
        source: computed
        description: "term_end_date - term_start_date in whole days."
      - name: term_type
        type: enum
        source: computed
        description: "ACADEMIC_YEAR when term_start_date <= the student's University.academic_year_start_date AND term_end_date >= that University.academic_year_end_date; PARTIAL_TERM otherwise."
        constraints: "one of {ACADEMIC_YEAR, PARTIAL_TERM}"
      - name: monthly_rent_cents
        type: integer
        source: computed
        description: "Snapshot of Unit.base_rent_cents_per_bed_monthly taken at lease creation; any client-supplied value is ignored."
      - name: daily_rate_cents
        type: integer
        source: computed
        description: "round_half_up(monthly_rent_cents * 12 / DAYS_PER_YEAR); set at signing."
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "QUOTED variant of calculations.lease_term_total_cents, stamped at lease creation on a whole-month basis."
      - name: total_contract_cents
        type: integer
        source: computed
        description: "CONTRACTED variant of calculations.lease_term_total_cents, stamped at signing on a daily-proration basis; null before signing."
      - name: partner_discount_bps
        type: integer
        source: computed
        description: "University.partner_discount_bps when term_type == ACADEMIC_YEAR, else 0; stamped at signing."
      - name: partner_discount_cents
        type: integer
        source: computed
        description: "round_half_up(gross_cents * partner_discount_bps / 10000); null before signing."
      - name: installment_count
        type: integer
        source: input
        description: "Number of RENT installments the contracted total is split across."
        constraints: "MIN_INSTALLMENT_COUNT (1) <= installment_count <= MAX_INSTALLMENT_COUNT (12)"
      - name: guarantor_required
        type: boolean
        source: computed
        description: "True when Student.credit_score_band is in {THIN, LOW} OR monthly_rent_cents > GUARANTOR_RENT_THRESHOLD_CENTS (120000); evaluated at lease creation."
      - name: lease_status
        type: enum
        source: system
        description: "Contract-lifecycle axis; evolves independently of funding_status."
        default: "DRAFT"
        constraints: "one of {DRAFT, PENDING_GUARANTOR, PENDING_SIGNATURE, ACTIVE, ENDED, CANCELLED, TERMINATED}"
      - name: funding_status
        type: enum
        source: system
        description: "Money axis; evolves independently of lease_status and is recomputed by calculations.lease_funding_status after every installment mutation."
        default: "UNFUNDED"
        constraints: "one of {UNFUNDED, PARTIAL, CURRENT, DELINQUENT, SETTLED}"
      - name: amenity_fee_total_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this lease's non-VOID Installments whose kind is in {AMENITY, SUBLET_FEE}."
        default: 0
      - name: billed_total_cents
        type: integer
        source: computed
        description: "coalesce(total_contract_cents, 0) + amenity_fee_total_cents."
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "Sum of (amount_cents + late_fee_cents) over this lease's Installments with status == PAID."
        default: 0
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which lease_status became ACTIVE; null before signing."
      - name: terminated_at
        type: datetime
        source: system
        description: "Logical-clock instant at which lease_status became TERMINATED or CANCELLED; null otherwise."

  - name: GuarantorApplication
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease whose guarantor requirement this application answers."
      - name: guarantor_full_name
        type: string
        source: input
        description: "Legal name of the guarantor / cosigner."
      - name: guarantor_annual_income_cents
        type: integer
        source: input
        description: "Declared gross annual income of the guarantor in cents."
        constraints: ">= 0"
      - name: relationship
        type: enum
        source: input
        description: "Relationship of the guarantor to the student."
        constraints: "one of {PARENT, GUARDIAN, RELATIVE, EMPLOYER, OTHER}"
      - name: income_multiple_bps
        type: integer
        source: computed
        description: "floor(guarantor_annual_income_cents * 10000 / (Lease.monthly_rent_cents * 12)); recomputed on every submit and resubmit."
      - name: status
        type: enum
        source: system
        description: "Underwriting posture; the UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED loop is the negotiation cycle."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, DECLINED}"
      - name: round_count
        type: integer
        source: system
        description: "Number of times the application has been submitted; starts at 1 and increments on each resubmit."
        default: 1
      - name: reviewer_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PropertyManager who last acted on the application."
      - name: decision_note
        type: string
        source: system
        description: "Free-text note attached by the reviewer on the most recent review action."
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the APPROVED/DECLINED decision; null otherwise."

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: system
        description: "FK -> Lease.id; the lease this charge belongs to."
      - name: kind
        type: enum
        source: system
        description: "RENT rows are minted by the signing schedule; AMENITY rows by an amenity assignment; SUBLET_FEE rows by a sublet approval."
        constraints: "one of {RENT, AMENITY, SUBLET_FEE}"
      - name: sequence_number
        type: integer
        source: system
        description: "1-based ordinal within the lease. RENT rows occupy 1..installment_count in due-date order; AMENITY and SUBLET_FEE rows take max(sequence_number on the lease) + 1."
      - name: due_date
        type: string
        source: system
        description: "ISO 8601 calendar date the charge falls due."
      - name: amount_cents
        type: integer
        source: system
        description: "Principal amount of the charge in cents, excluding any late fee."
      - name: status
        type: enum
        source: system
        description: "Charge posture."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, LATE, PAID, VOID}"
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Assessed at payment time from calculations.installment_late_fee_cents; 0 unless the row was LATE when paid."
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "amount_cents + late_fee_cents once PAID; 0 otherwise."
        default: 0
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant of payment; its calendar date decides Payout window membership. Null unless PAID."

  - name: Sublet
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the host lease being sublet."
      - name: subtenant_student_id
        type: string
        source: input
        description: "FK -> Student.id; the incoming subtenant."
      - name: start_date
        type: string
        source: input
        description: "ISO 8601 calendar date; inclusive start of the half-open sublet interval [start_date, end_date)."
      - name: end_date
        type: string
        source: input
        description: "ISO 8601 calendar date; exclusive end of the sublet interval."
      - name: window_days
        type: integer
        source: computed
        description: "end_date - start_date in whole days."
      - name: sublet_rent_cents
        type: integer
        source: input
        description: "Monthly rent the subtenant pays, in cents."
        constraints: "> 0"
      - name: sublet_total_cents
        type: integer
        source: computed
        description: "sublet_rent_cents * ceil(window_days / QUOTE_MONTH_DAYS)."
      - name: platform_fee_cents
        type: integer
        source: computed
        description: "max(SUBLET_MIN_FEE_CENTS, round_half_up(sublet_total_cents * SUBLET_FEE_BPS / 10000)); stamped at approval, null before."
      - name: installment_id
        type: string
        source: system
        description: "FK -> Installment.id; the SUBLET_FEE charge minted on the host lease at approval; null before approval."
      - name: status
        type: enum
        source: system
        description: "Sublet lifecycle; ACTIVE and COMPLETED are reached only by the logical-clock checkpoint."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, APPROVED, DECLINED, ACTIVE, COMPLETED}"
      - name: decided_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PropertyManager who approved or declined the request."
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the approval/decline decision."

  - name: Amenity
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the building offering this amenity."
      - name: name
        type: string
        source: input
        description: "Amenity display name."
      - name: amenity_type
        type: enum
        source: input
        description: "Category of the amenity."
        constraints: "one of {PARKING, STORAGE, GYM, STUDY_ROOM, LAUNDRY}"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of assignments whose closed windows may contain any single calendar day."
        constraints: ">= 1"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Fee charged per billed month of an assignment."
        constraints: ">= 0"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Count of AmenityAssignments on this amenity with status == ACTIVE."
        default: 0

  - name: AmenityAssignment
    parent: null
    common_fields: true
    fields:
      - name: amenity_id
        type: string
        source: input
        description: "FK -> Amenity.id; the amenity being reserved."
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease that will be billed."
      - name: start_date
        type: string
        source: input
        description: "ISO 8601 calendar date; inclusive start of the CLOSED occupancy interval [start_date, end_date]."
      - name: end_date
        type: string
        source: input
        description: "ISO 8601 calendar date; inclusive end of the CLOSED occupancy interval."
      - name: window_days
        type: integer
        source: computed
        description: "(end_date - start_date) + 1 whole days, because the interval is closed at both ends."
      - name: billed_months
        type: integer
        source: computed
        description: "ceil(window_days / QUOTE_MONTH_DAYS)."
      - name: total_fee_cents
        type: integer
        source: computed
        description: "Amenity.monthly_fee_cents * billed_months."
      - name: installment_id
        type: string
        source: system
        description: "FK -> Installment.id; the AMENITY charge minted on the lease when the assignment is created."
      - name: status
        type: enum
        source: system
        description: "Reservation posture; RELEASED rows no longer consume capacity."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, RELEASED}"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of release; null while ACTIVE."

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property whose collections are being settled."
      - name: period_start_date
        type: string
        source: input
        description: "ISO 8601 calendar date; inclusive start of the CLOSED settlement window [period_start_date, period_end_date]."
      - name: period_end_date
        type: string
        source: input
        description: "ISO 8601 calendar date; inclusive end of the settlement window; must be >= period_start_date."
      - name: gross_collected_cents
        type: integer
        source: computed
        description: "Sum of (amount_cents + late_fee_cents) over PAID Installments on this property's leases whose date(paid_at) falls inside the closed window."
      - name: platform_fee_bps
        type: integer
        source: computed
        description: "Tier selected from gross_collected_cents alone: 900 below 500000, 700 below 2000000, else 500."
      - name: platform_fee_cents
        type: integer
        source: computed
        description: "round_half_up(gross_collected_cents * platform_fee_bps / 10000)."
      - name: holdback_cents
        type: integer
        source: computed
        description: "round_half_up(gross_collected_cents * MAINTENANCE_HOLDBACK_BPS / 10000)."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "gross_collected_cents - platform_fee_cents - holdback_cents."
      - name: rebate_cents
        type: integer
        source: computed
        description: "round_half_up(platform_fee_cents * PAYOUT_REBATE_PCT_BPS / 10000) when subtotal_cents >= PAYOUT_REBATE_MIN_SUBTOTAL_CENTS, else 0."
      - name: net_amount_cents
        type: integer
        source: computed
        description: "subtotal_cents + rebate_cents; the amount wired to the landlord."
      - name: status
        type: enum
        source: system
        description: "Settlement posture."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, PAID, REVERSED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PlatformAdmin who created the payout."
      - name: approved_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the approving PlatformAdmin; must differ from submitted_by_user_id."
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant the payout was disbursed."
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical-clock instant the payout was reversed."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# Eleven machines. Lease carries TWO parallel axes on the same row
# (lease_status x funding_status). GuarantorApplication is cyclic. Property is
# compound (posture derived from Unit bed rollups). Student verification is
# branching with revert.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Property
    state_field: status
    shape: compound
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /properties/{id}/list"
        actor: PropertyManager
        preconditions:
          - "X-User-ID == Property.manager_user_id"
          - "Property.unit_count >= 1"
        side_effects:
          - "Property.status := LISTED"
          - "Property.total_bed_count and Property.available_bed_count recomputed from the property's Units"
          - "increments Property.version by 1"
      - from: LISTED
        to: FULLY_COMMITTED
        trigger: "system: recomputation of Property.available_bed_count triggered by any Unit bed-rollup change (lease reservation or release)"
        actor: system
        preconditions:
          - "Property.available_bed_count == 0"
        side_effects:
          - "Property.status := FULLY_COMMITTED"
          - "Property.updated_at refreshed; increments Property.version by 1"
        note: "Auto-posture. Applied inside the same request that changed the bed rollup."
      - from: FULLY_COMMITTED
        to: LISTED
        trigger: "system: recomputation of Property.available_bed_count triggered by any Unit bed-rollup change"
        actor: system
        preconditions:
          - "Property.available_bed_count > 0"
        side_effects:
          - "Property.status := LISTED"
          - "Property.updated_at refreshed; increments Property.version by 1"
      - from: LISTED
        to: SUSPENDED
        trigger: "POST /properties/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Property.status := SUSPENDED"
          - "increments Property.version by 1"
      - from: FULLY_COMMITTED
        to: SUSPENDED
        trigger: "POST /properties/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Property.status := SUSPENDED"
          - "increments Property.version by 1"
      - from: SUSPENDED
        to: LISTED
        trigger: "POST /properties/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Property.available_bed_count > 0"
        side_effects:
          - "Property.status := LISTED"
          - "increments Property.version by 1"
      - from: SUSPENDED
        to: FULLY_COMMITTED
        trigger: "POST /properties/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Property.available_bed_count == 0"
        side_effects:
          - "Property.status := FULLY_COMMITTED"
          - "increments Property.version by 1"

  - entity: Student
    state_field: verification_status
    shape: branching_with_revert
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING
        trigger: "POST /students/{id}/verification-requests"
        actor: Student
        preconditions:
          - "X-User-ID == Student.id"
        side_effects:
          - "Student.verification_status := PENDING"
          - "Student.verification_submitted_at := current logical clock"
          - "Student.verification_expires_at := verification_submitted_at + VERIFICATION_TOKEN_TTL_DAYS (14) days"
      - from: REJECTED
        to: PENDING
        trigger: "POST /students/{id}/verification-requests"
        actor: Student
        preconditions:
          - "X-User-ID == Student.id"
        side_effects:
          - "Student.verification_status := PENDING"
          - "Student.verification_submitted_at := current logical clock"
          - "Student.verification_expires_at := verification_submitted_at + VERIFICATION_TOKEN_TTL_DAYS (14) days"
        note: "Revert loop: a rejected student may re-request verification any number of times."
      - from: PENDING
        to: VERIFIED
        trigger: "POST /students/{id}/verification-decision with decision == APPROVE"
        actor: UniversityPartner
        preconditions:
          - "X-User-ID == University.partner_admin_user_id of the University referenced by Student.university_id"
          - "current logical clock <= Student.verification_expires_at"
        side_effects:
          - "Student.verification_status := VERIFIED"
          - "Student.verification_decided_at := current logical clock"
          - "University.verified_student_count incremented by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /students/{id}/verification-decision with decision == REJECT"
        actor: UniversityPartner
        preconditions:
          - "X-User-ID == University.partner_admin_user_id of the University referenced by Student.university_id"
          - "current logical clock <= Student.verification_expires_at"
        side_effects:
          - "Student.verification_status := REJECTED"
          - "Student.verification_decided_at := current logical clock"

  - entity: RoommateGroup
    state_field: status
    shape: linear
    initial_state: FORMING
    terminal_states: [PLACED]
    transitions:
      - from: FORMING
        to: LOCKED
        trigger: "POST /roommate-groups/{id}/lock"
        actor: Student
        preconditions:
          - "X-User-ID == RoommateGroup.lead_student_id"
          - "RoommateGroup.accepted_member_count == RoommateGroup.required_size"
          - "PAIRWISE_MEAN average_match_score over the ACCEPTED member set >= GROUP_MIN_AVG_MATCH_SCORE (55)"
        side_effects:
          - "RoommateGroup.average_match_score := PAIRWISE_MEAN variant of calculations.roommate_match_score"
          - "RoommateGroup.lead_anchored_mean_score := LEAD_ANCHORED variant of calculations.roommate_match_score"
          - "RoommateGroup.status := LOCKED"
      - from: LOCKED
        to: PLACED
        trigger: "POST /roommate-groups/{id}/place"
        actor: PropertyManager
        preconditions:
          - "X-User-ID == Property.manager_user_id of the property referenced by RoommateGroup.property_id"
          - "expected_unit_version == Unit.version"
          - "Unit.property_id == RoommateGroup.property_id"
          - "Property.status IN {LISTED, FULLY_COMMITTED}"
          - "Unit.available_bed_count >= RoommateGroup.required_size"
          - "no bed-slot turnover conflict for any of the allocated (unit_id, bed_label) pairs"
        side_effects:
          - "CASCADE HOP 1: RoommateGroup.status := PLACED; RoommateGroup.placed_unit_id := unit_id"
          - "CASCADE HOP 2 (caused by hop 1): each GroupMembership of this group with status ACCEPTED becomes PLACED, and for each such membership — walked in ascending sequence_number order and zipped against the unit's vacant bed labels in lexicographic ascending order — a Lease is minted in DRAFT and immediately driven through its DRAFT->PENDING_GUARANTOR or DRAFT->PENDING_SIGNATURE transition"
          - "CASCADE HOP 3 (caused by hop 2): because each new Lease entered a bed-holding state, Unit.leased_bed_count, Unit.available_bed_count and Unit.occupancy_status are recomputed"
          - "CASCADE HOP 4 (caused by hop 3): because the Unit rollup changed, Property.available_bed_count is recomputed as the sum over the property's Units"
          - "CASCADE HOP 5 (caused by hop 4): because Property.available_bed_count reached 0, the Property LISTED -> FULLY_COMMITTED auto-transition fires"
          - "increments Unit.version by 1"

  - entity: GroupMembership
    state_field: status
    shape: branching
    initial_state: INVITED
    terminal_states: [DECLINED, PLACED]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /group-memberships/{id}/respond with decision == ACCEPT"
        actor: Student
        preconditions:
          - "X-User-ID == GroupMembership.student_id"
          - "RoommateGroup.status == FORMING"
        side_effects:
          - "GroupMembership.status := ACCEPTED"
          - "RoommateGroup.accepted_member_count recomputed"
      - from: INVITED
        to: DECLINED
        trigger: "POST /group-memberships/{id}/respond with decision == DECLINE"
        actor: Student
        preconditions:
          - "X-User-ID == GroupMembership.student_id"
          - "RoommateGroup.status == FORMING"
        side_effects:
          - "GroupMembership.status := DECLINED"
          - "RoommateGroup.accepted_member_count recomputed"
      - from: ACCEPTED
        to: PLACED
        trigger: "system: POST /roommate-groups/{id}/place"
        actor: system
        preconditions:
          - "RoommateGroup.status transitions LOCKED -> PLACED in the same request"
        side_effects:
          - "GroupMembership.status := PLACED"

  - entity: Lease
    state_field: lease_status
    shape: branching_with_terminal_forks
    initial_state: DRAFT
    terminal_states: [ENDED, CANCELLED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_GUARANTOR
        trigger: "POST /leases/{id}/submit (or the system submit applied by POST /roommate-groups/{id}/place)"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id (self-submit path only)"
          - "Lease.guarantor_required == true"
          - "Student.verification_status == VERIFIED whenever the student's University.verification_required == true"
          - "Property.status IN {LISTED, FULLY_COMMITTED}"
          - "no bed-slot turnover conflict on (unit_id, bed_label)"
        side_effects:
          - "Lease.lease_status := PENDING_GUARANTOR"
          - "the bed slot is reserved: Unit.leased_bed_count, Unit.available_bed_count and Unit.occupancy_status are recomputed"
          - "Property.available_bed_count recomputed; the Property LISTED <-> FULLY_COMMITTED auto-transition is re-evaluated"
          - "increments Unit.version by 1"
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /leases/{id}/submit (or the system submit applied by POST /roommate-groups/{id}/place)"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id (self-submit path only)"
          - "Lease.guarantor_required == false"
          - "Student.verification_status == VERIFIED whenever the student's University.verification_required == true"
          - "Property.status IN {LISTED, FULLY_COMMITTED}"
          - "no bed-slot turnover conflict on (unit_id, bed_label)"
        side_effects:
          - "Lease.lease_status := PENDING_SIGNATURE"
          - "the bed slot is reserved: Unit.leased_bed_count, Unit.available_bed_count and Unit.occupancy_status are recomputed"
          - "Property.available_bed_count recomputed; the Property LISTED <-> FULLY_COMMITTED auto-transition is re-evaluated"
          - "increments Unit.version by 1"
      - from: PENDING_GUARANTOR
        to: PENDING_SIGNATURE
        trigger: "system: POST /guarantor-applications/{id}/review with decision == APPROVE"
        actor: system
        preconditions:
          - "GuarantorApplication.status transitions UNDER_REVIEW -> APPROVED in the same request"
        side_effects:
          - "Lease.lease_status := PENDING_SIGNATURE"
      - from: PENDING_GUARANTOR
        to: CANCELLED
        trigger: "system: POST /guarantor-applications/{id}/review with decision == DECLINE"
        actor: system
        preconditions:
          - "GuarantorApplication.status transitions UNDER_REVIEW -> DECLINED in the same request"
        side_effects:
          - "Lease.lease_status := CANCELLED; Lease.terminated_at := current logical clock"
          - "the bed slot is released: Unit.leased_bed_count, Unit.available_bed_count and Unit.occupancy_status are recomputed"
          - "Property.available_bed_count recomputed; the Property FULLY_COMMITTED -> LISTED auto-transition is re-evaluated"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /leases/{id}/cancel"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id"
        side_effects:
          - "Lease.lease_status := CANCELLED; Lease.terminated_at := current logical clock"
      - from: PENDING_GUARANTOR
        to: CANCELLED
        trigger: "POST /leases/{id}/cancel"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id"
        side_effects:
          - "Lease.lease_status := CANCELLED; Lease.terminated_at := current logical clock"
          - "the bed slot is released: Unit.leased_bed_count, Unit.available_bed_count and Unit.occupancy_status are recomputed"
          - "Property.available_bed_count recomputed; the Property FULLY_COMMITTED -> LISTED auto-transition is re-evaluated"
          - "any GuarantorApplication on this lease whose status is in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} becomes DECLINED"
      - from: PENDING_SIGNATURE
        to: CANCELLED
        trigger: "POST /leases/{id}/cancel"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id"
        side_effects:
          - "Lease.lease_status := CANCELLED; Lease.terminated_at := current logical clock"
          - "the bed slot is released: Unit.leased_bed_count, Unit.available_bed_count and Unit.occupancy_status are recomputed"
          - "Property.available_bed_count recomputed; the Property FULLY_COMMITTED -> LISTED auto-transition is re-evaluated"
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /leases/{id}/sign"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id"
          - "Property.status IN {LISTED, FULLY_COMMITTED}"
        side_effects:
          - "Lease.term_type, Lease.daily_rate_cents, Lease.partner_discount_bps, Lease.partner_discount_cents and Lease.total_contract_cents are stamped by the CONTRACTED variant of calculations.lease_term_total_cents"
          - "Lease.lease_status := ACTIVE; Lease.signed_at := current logical clock"
          - "installment_count RENT Installments are minted by calculations.installment_schedule_allocation"
          - "Lease.billed_total_cents and Lease.funding_status recomputed"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: PropertyManager
        preconditions:
          - "X-User-ID == Property.manager_user_id of Lease.property_id"
        side_effects:
          - "CASCADE HOP 1: Lease.lease_status := TERMINATED; Lease.terminated_at := current logical clock"
          - "CASCADE HOP 2 (caused by hop 1): because the lease left ACTIVE, every Installment on the lease whose status is in {SCHEDULED, LATE} and whose due_date > the current logical clock date becomes VOID"
          - "CASCADE HOP 3 (caused by hop 2): because those Installments became VOID, Lease.amenity_fee_total_cents, Lease.billed_total_cents and Lease.funding_status are recomputed"
          - "the bed slot is released: Unit.leased_bed_count, Unit.available_bed_count and Unit.occupancy_status are recomputed"
          - "Property.available_bed_count recomputed; the Property FULLY_COMMITTED -> LISTED auto-transition is re-evaluated"
          - "every AmenityAssignment on this lease with status ACTIVE becomes RELEASED"
          - "every Sublet on this lease whose status is in {REQUESTED, APPROVED, ACTIVE} becomes COMPLETED"
      - from: ACTIVE
        to: ENDED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock to a date >= Lease.term_end_date"
        actor: system
        preconditions:
          - "current logical clock date >= Lease.term_end_date"
        side_effects:
          - "Lease.lease_status := ENDED"
          - "the bed slot is released: Unit.leased_bed_count, Unit.available_bed_count and Unit.occupancy_status are recomputed"
          - "Property.available_bed_count recomputed; the Property FULLY_COMMITTED -> LISTED auto-transition is re-evaluated"

  - entity: Lease
    state_field: funding_status
    shape: parallel
    initial_state: UNFUNDED
    terminal_states: []
    note: "Second, independent state axis on the same Lease row. Recomputed in full by calculations.lease_funding_status after ANY Installment mutation (payment, lateness sweep, voiding); it never gates and is never gated by lease_status."
    transitions:
      - from: UNFUNDED
        to: PARTIAL
        trigger: "POST /installments/{id}/pay"
        actor: Student
        preconditions:
          - "after the payment at least one and not all non-VOID Installments are PAID, none is LATE, and at least one non-VOID Installment with due_date <= the clock date is unpaid"
        side_effects:
          - "Lease.paid_cents recomputed; Lease.funding_status := PARTIAL"
      - from: UNFUNDED
        to: CURRENT
        trigger: "POST /installments/{id}/pay"
        actor: Student
        preconditions:
          - "after the payment at least one non-VOID Installment is PAID, none is LATE, at least one remains unpaid, and every non-VOID Installment with due_date <= the clock date is PAID"
        side_effects:
          - "Lease.paid_cents recomputed; Lease.funding_status := CURRENT"
      - from: PARTIAL
        to: CURRENT
        trigger: "POST /installments/{id}/pay"
        actor: Student
        preconditions:
          - "every non-VOID Installment with due_date <= the clock date is PAID and at least one remains unpaid"
        side_effects:
          - "Lease.paid_cents recomputed; Lease.funding_status := CURRENT"
      - from: CURRENT
        to: SETTLED
        trigger: "POST /installments/{id}/pay"
        actor: Student
        preconditions:
          - "every non-VOID Installment on the lease is PAID"
        side_effects:
          - "Lease.paid_cents recomputed; Lease.funding_status := SETTLED"
      - from: PARTIAL
        to: SETTLED
        trigger: "POST /installments/{id}/pay"
        actor: Student
        preconditions:
          - "every non-VOID Installment on the lease is PAID"
        side_effects:
          - "Lease.paid_cents recomputed; Lease.funding_status := SETTLED"
      - from: UNFUNDED
        to: DELINQUENT
        trigger: "system: POST /_clock/set_current_utc lateness sweep"
        actor: system
        preconditions:
          - "at least one non-VOID Installment on the lease became LATE in the sweep"
        side_effects:
          - "Lease.funding_status := DELINQUENT"
      - from: PARTIAL
        to: DELINQUENT
        trigger: "system: POST /_clock/set_current_utc lateness sweep"
        actor: system
        preconditions:
          - "at least one non-VOID Installment on the lease became LATE in the sweep"
        side_effects:
          - "Lease.funding_status := DELINQUENT"
      - from: CURRENT
        to: DELINQUENT
        trigger: "system: POST /_clock/set_current_utc lateness sweep"
        actor: system
        preconditions:
          - "at least one non-VOID Installment on the lease became LATE in the sweep"
        side_effects:
          - "Lease.funding_status := DELINQUENT"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /installments/{id}/pay"
        actor: Student
        preconditions:
          - "after the payment no non-VOID Installment on the lease is LATE, at least one remains unpaid, and every non-VOID Installment with due_date <= the clock date is PAID"
        side_effects:
          - "Lease.paid_cents recomputed; Lease.funding_status := CURRENT"
      - from: DELINQUENT
        to: SETTLED
        trigger: "POST /installments/{id}/pay"
        actor: Student
        preconditions:
          - "every non-VOID Installment on the lease is PAID"
        side_effects:
          - "Lease.paid_cents recomputed; Lease.funding_status := SETTLED"
      - from: DELINQUENT
        to: SETTLED
        trigger: "system: POST /leases/{id}/terminate voids the remaining unpaid Installments"
        actor: system
        preconditions:
          - "after the void cascade every non-VOID Installment on the lease is PAID"
        side_effects:
          - "Lease.funding_status := SETTLED"
      - from: CURRENT
        to: SETTLED
        trigger: "system: POST /leases/{id}/terminate voids the remaining unpaid Installments"
        actor: system
        preconditions:
          - "after the void cascade every non-VOID Installment on the lease is PAID"
        side_effects:
          - "Lease.funding_status := SETTLED"
      - from: UNFUNDED
        to: UNFUNDED
        trigger: "system: POST /leases/{id}/terminate voids every Installment on a never-paid lease"
        actor: system
        preconditions:
          - "after the void cascade no non-VOID Installment remains on the lease"
        side_effects:
          - "Lease.funding_status := UNFUNDED (no non-VOID charge remains, so the money axis returns to its initial value)"

  - entity: GuarantorApplication
    state_field: status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /guarantor-applications/{id}/review with decision == START_REVIEW"
        actor: PropertyManager
        preconditions:
          - "X-User-ID == Property.manager_user_id of the property owning the application's lease"
          - "Lease.lease_status == PENDING_GUARANTOR"
        side_effects:
          - "GuarantorApplication.status := UNDER_REVIEW; reviewer_user_id := X-User-ID"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /guarantor-applications/{id}/review with decision == REQUEST_INFO"
        actor: PropertyManager
        preconditions:
          - "X-User-ID == Property.manager_user_id of the property owning the application's lease"
        side_effects:
          - "GuarantorApplication.status := INFO_REQUESTED; reviewer_user_id := X-User-ID; decision_note := the supplied note"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /guarantor-applications/{id}/resubmit"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id of the application's lease"
          - "GuarantorApplication.round_count < GUARANTOR_MAX_REVIEW_ROUNDS (3)"
        side_effects:
          - "GuarantorApplication.guarantor_annual_income_cents and guarantor_full_name replaced with the resubmitted values"
          - "GuarantorApplication.income_multiple_bps recomputed by calculations.guarantor_income_multiple_bps"
          - "GuarantorApplication.round_count incremented by 1"
          - "GuarantorApplication.status := SUBMITTED"
        note: "Negotiation cycle: UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW may repeat until round_count reaches GUARANTOR_MAX_REVIEW_ROUNDS."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /guarantor-applications/{id}/review with decision == APPROVE"
        actor: PropertyManager
        preconditions:
          - "X-User-ID == Property.manager_user_id of the property owning the application's lease"
          - "GuarantorApplication.income_multiple_bps >= GUARANTOR_MIN_INCOME_MULTIPLE_BPS (30000)"
          - "Lease.lease_status == PENDING_GUARANTOR"
        side_effects:
          - "GuarantorApplication.status := APPROVED; decided_at := current logical clock; reviewer_user_id := X-User-ID"
          - "CASCADE: the application's Lease transitions PENDING_GUARANTOR -> PENDING_SIGNATURE"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /guarantor-applications/{id}/review with decision == DECLINE"
        actor: PropertyManager
        preconditions:
          - "X-User-ID == Property.manager_user_id of the property owning the application's lease"
          - "Lease.lease_status == PENDING_GUARANTOR"
        side_effects:
          - "GuarantorApplication.status := DECLINED; decided_at := current logical clock; reviewer_user_id := X-User-ID"
          - "CASCADE: the application's Lease transitions PENDING_GUARANTOR -> CANCELLED, which releases the bed slot and re-evaluates the Unit and Property rollups"

  - entity: Installment
    state_field: status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [PAID, VOID]
    transitions:
      - from: SCHEDULED
        to: LATE
        trigger: "system: POST /_clock/set_current_utc lateness sweep (step 1 of the checkpoint)"
        actor: system
        preconditions:
          - "the new logical clock date > Installment.due_date + LATE_GRACE_DAYS (5) days (strict)"
          - "Lease.lease_status IN {PENDING_SIGNATURE, ACTIVE, TERMINATED}"
        side_effects:
          - "Installment.status := LATE"
          - "the owning Lease's funding_status is recomputed to DELINQUENT"
      - from: SCHEDULED
        to: PAID
        trigger: "POST /installments/{id}/pay"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id"
          - "Lease.lease_status IN {ACTIVE, TERMINATED}"
          - "amount_cents in the request == Installment.amount_cents"
        side_effects:
          - "CASCADE HOP 1: Installment.late_fee_cents := 0; Installment.paid_cents := amount_cents; Installment.status := PAID; Installment.paid_at := current logical clock"
          - "CASCADE HOP 2 (caused by hop 1): because the charge became PAID, Lease.paid_cents is recomputed and Lease.funding_status is re-derived"
          - "CASCADE HOP 3 (caused by hop 2): because Lease.paid_cents increased, Property.escrow_balance_cents is recomputed"
          - "CASCADE HOP 4 (caused by hop 3): because Property.escrow_balance_cents changed, Property.payout_eligible is re-derived against PAYOUT_MIN_BALANCE_CENTS (50000)"
      - from: LATE
        to: PAID
        trigger: "POST /installments/{id}/pay"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id"
          - "Lease.lease_status IN {ACTIVE, TERMINATED}"
          - "amount_cents in the request == Installment.amount_cents"
        side_effects:
          - "CASCADE HOP 1: Installment.late_fee_cents := min(round_half_up(amount_cents * LATE_FEE_BPS / 10000), LATE_FEE_CAP_CENTS); Installment.paid_cents := amount_cents + late_fee_cents; Installment.status := PAID; Installment.paid_at := current logical clock"
          - "CASCADE HOP 2 (caused by hop 1): Lease.paid_cents recomputed and Lease.funding_status re-derived"
          - "CASCADE HOP 3 (caused by hop 2): Property.escrow_balance_cents recomputed, crediting amount_cents + late_fee_cents"
          - "CASCADE HOP 4 (caused by hop 3): Property.payout_eligible re-derived"
      - from: SCHEDULED
        to: VOID
        trigger: "system: POST /leases/{id}/terminate, POST /amenity-assignments/{id}/release"
        actor: system
        preconditions:
          - "the charge is unpaid and either its lease left ACTIVE with due_date > the clock date, or its source amenity assignment was released"
        side_effects:
          - "Installment.status := VOID"
          - "Lease.amenity_fee_total_cents, Lease.billed_total_cents and Lease.funding_status recomputed"
      - from: LATE
        to: VOID
        trigger: "system: POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "the charge is unpaid and its due_date > the current logical clock date"
        side_effects:
          - "Installment.status := VOID"
          - "Lease.billed_total_cents and Lease.funding_status recomputed"

  - entity: Sublet
    state_field: status
    shape: branching
    initial_state: REQUESTED
    terminal_states: [DECLINED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /sublets/{id}/decision with decision == APPROVE"
        actor: PropertyManager
        preconditions:
          - "X-User-ID == Property.manager_user_id of the host lease's property"
          - "Lease.lease_status == ACTIVE"
          - "Property.status IN {LISTED, FULLY_COMMITTED}"
        side_effects:
          - "Sublet.platform_fee_cents stamped by calculations.sublet_fee_and_cap"
          - "Sublet.status := APPROVED; decided_by_user_id := X-User-ID; decided_at := current logical clock"
          - "a SUBLET_FEE Installment is minted on the host lease with amount_cents == platform_fee_cents, due_date == Sublet.start_date and sequence_number == max(sequence_number on the lease) + 1"
          - "Sublet.installment_id := the new Installment.id"
          - "Lease.amenity_fee_total_cents and Lease.billed_total_cents recomputed"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /sublets/{id}/decision with decision == DECLINE"
        actor: PropertyManager
        preconditions:
          - "X-User-ID == Property.manager_user_id of the host lease's property"
        side_effects:
          - "Sublet.status := DECLINED; decided_by_user_id := X-User-ID; decided_at := current logical clock"
      - from: APPROVED
        to: ACTIVE
        trigger: "system: POST /_clock/set_current_utc sublet sweep (step 2 of the checkpoint)"
        actor: system
        preconditions:
          - "the new logical clock date >= Sublet.start_date"
        side_effects:
          - "Sublet.status := ACTIVE"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: POST /_clock/set_current_utc sublet sweep (step 2 of the checkpoint)"
        actor: system
        preconditions:
          - "the new logical clock date >= Sublet.end_date"
        side_effects:
          - "Sublet.status := COMPLETED"
      - from: APPROVED
        to: COMPLETED
        trigger: "system: POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "the host Lease transitions ACTIVE -> TERMINATED in the same request"
        side_effects:
          - "Sublet.status := COMPLETED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "the host Lease transitions ACTIVE -> TERMINATED in the same request"
        side_effects:
          - "Sublet.status := COMPLETED"
      - from: REQUESTED
        to: COMPLETED
        trigger: "system: POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "the host Lease transitions ACTIVE -> TERMINATED in the same request"
        side_effects:
          - "Sublet.status := COMPLETED"

  - entity: AmenityAssignment
    state_field: status
    shape: linear
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /amenity-assignments/{id}/release"
        actor: Student
        preconditions:
          - "X-User-ID == Lease.student_id of AmenityAssignment.lease_id"
        side_effects:
          - "AmenityAssignment.status := RELEASED; released_at := current logical clock"
          - "the assignment's AMENITY Installment becomes VOID when it is still SCHEDULED or LATE"
          - "Amenity.active_assignment_count decremented by 1"
          - "Lease.amenity_fee_total_cents, Lease.billed_total_cents and Lease.funding_status recomputed"
      - from: ACTIVE
        to: RELEASED
        trigger: "system: POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "the billed Lease transitions ACTIVE -> TERMINATED in the same request"
        side_effects:
          - "AmenityAssignment.status := RELEASED; released_at := current logical clock"
          - "Amenity.active_assignment_count decremented by 1"

  - entity: Payout
    state_field: status
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /payouts/{id}/decision with decision == APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "X-User-ID != Payout.submitted_by_user_id (segregation of duties)"
          - "Property.status != SUSPENDED"
        side_effects:
          - "Payout.status := APPROVED; Payout.approved_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /payouts/{id}/decision with decision == REJECT"
        actor: PlatformAdmin
        preconditions:
          - "X-User-ID != Payout.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "Payout.status := REJECTED; Payout.approved_by_user_id := X-User-ID"
      - from: APPROVED
        to: PAID
        trigger: "POST /payouts/{id}/pay"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Payout.status := PAID; Payout.paid_at := current logical clock"
          - "Property.escrow_balance_cents decreased by Payout.gross_collected_cents"
          - "Property.maintenance_reserve_cents increased by Payout.holdback_cents"
          - "Property.payout_eligible re-derived; increments Property.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /payouts/{id}/reverse"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Payout.status := REVERSED; Payout.reversed_at := current logical clock"
          - "Property.escrow_balance_cents increased by Payout.gross_collected_cents (the exact amount debited at PAY)"
          - "Property.maintenance_reserve_cents decreased by Payout.holdback_cents"
          - "Property.payout_eligible re-derived; increments Property.version by 1"
        note: "Compensating action for PAY. The conserved quantity escrow_balance_cents + SUM(gross_collected_cents over PAID payouts) is identical before PAY and after REVERSE."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on a parent entity's `version` only.
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: group-place-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /roommate-groups/{id}/place"
    occ_field: "expected_unit_version"
    description: |
      Placing a locked RoommateGroup into a Unit whose version has advanced
      since the manager last observed it is rejected. A four-bed unit can
      legitimately host two two-person groups, so a placement carrying an
      up-to-date version succeeds even after an earlier placement consumed
      part of the unit; only a stale version is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payout-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /payouts"
    occ_field: "expected_property_version"
    description: |
      Creating a Payout against a Property whose version has advanced since
      the finance operator last read it is rejected. Non-overlapping
      settlement windows legitimately produce several payouts on one
      property, so a create carrying an up-to-date version succeeds; only a
      stale view of the property's escrow position is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# All money is integer cents. `round_half_up(x)` rounds a rational to the
# nearest integer with ties away from zero. `floor(x)` truncates toward
# negative infinity. No calculation, selector, tie-break, ordering or
# allocation rule anywhere in this scaffold reads an `id` value; where a
# common-field fallback is required, `created_at` ASC is used.
# ---------------------------------------------------------------------------
calculations:
  - name: lease_term_total_cents
    trigger: "QUOTED runs on POST /leases and POST /leases/{id}/renew, writing Lease.quoted_total_cents. CONTRACTED runs on POST /leases/{id}/sign, writing Lease.term_type, Lease.daily_rate_cents, Lease.partner_discount_bps, Lease.partner_discount_cents and Lease.total_contract_cents."
    algorithm: dual_variant_pricing
    formula: |
      term_days = date_diff_days(Lease.term_end_date, Lease.term_start_date)   # half-open [start, end)
      monthly_rent_cents = Unit.base_rent_cents_per_bed_monthly                # snapshot at creation
      U = the University referenced by Student.university_id of Lease.student_id

      # --- variant QUOTED (stamped at creation) ---
      quoted_months      = ceil(term_days / QUOTE_MONTH_DAYS)                  # QUOTE_MONTH_DAYS = 30
      quoted_total_cents = monthly_rent_cents * quoted_months

      # --- variant CONTRACTED (stamped at signing) ---
      daily_rate_cents = round_half_up(monthly_rent_cents * 12 / DAYS_PER_YEAR)   # DAYS_PER_YEAR = 365
      gross_cents      = daily_rate_cents * term_days
      term_type = ACADEMIC_YEAR
                  if (Lease.term_start_date <= U.academic_year_start_date
                      AND Lease.term_end_date >= U.academic_year_end_date)
                  else PARTIAL_TERM
      partner_discount_bps   = U.partner_discount_bps if term_type == ACADEMIC_YEAR else 0
      partner_discount_cents = round_half_up(gross_cents * partner_discount_bps / 10000)
      total_contract_cents   = gross_cents - partner_discount_cents
    input_set: "Exactly one Lease row plus its Unit (for the rent snapshot) and the University of its Student. Neither variant reads any other lease, installment or amenity charge."
    constants:
      QUOTE_MONTH_DAYS: 30
      DAYS_PER_YEAR: 365
      PARTNER_DISCOUNT_BPS_PREFERRED: 500
      PARTNER_DISCOUNT_BPS_STANDARD: 0
    precision: "Integer cents. round_half_up applied once to the daily rate and once to the discount; no other rounding."
    variants:
      - name: QUOTED
        when: "Lease creation (POST /leases) and renewal minting (POST /leases/{id}/renew). Persisted in Lease.quoted_total_cents."
        difference: "Whole-month basis: the term is billed as ceil(term_days / 30) full months at the list monthly rent, and no university partner discount is applied."
      - name: CONTRACTED
        when: "Lease signing (POST /leases/{id}/sign). Persisted in Lease.total_contract_cents and used as the installment-schedule base."
        difference: "Daily-proration basis: monthly rent is converted to a rounded daily rate over a 365-day year, multiplied by the exact term_days, then reduced by the university partner discount when and only when term_type == ACADEMIC_YEAR."
    note: "Worked divergence for the reference fixture (monthly_rent_cents = 90000, term 2026-08-15 -> 2027-08-01, term_days = 351, PREFERRED university, ACADEMIC_YEAR term): QUOTED = 90000 * ceil(351/30) = 90000 * 12 = 1080000; CONTRACTED = round_half_up(1080000/365) = 2959 daily, 2959 * 351 = 1038609 gross, discount round_half_up(1038609 * 500 / 10000) = 51930, total_contract_cents = 986679. The two valid readings of the same lease differ by 93321 cents."

  - name: roommate_match_score
    trigger: "LEAD_ANCHORED runs on POST /roommate-groups/{id}/invitations (writing GroupMembership.match_score) and again on POST /roommate-groups/{id}/lock (writing RoommateGroup.lead_anchored_mean_score). PAIRWISE_MEAN runs on POST /roommate-groups/{id}/lock, writing RoommateGroup.average_match_score."
    algorithm: weighted_scoring
    formula: |
      # base pair-compatibility kernel, evaluated over four Student attributes
      pair_score(a, b) =
        clamp(
          MATCH_SCORE_MAX
          - MATCH_CLEANLINESS_WEIGHT * abs(a.cleanliness_level - b.cleanliness_level)
          - MATCH_NOISE_WEIGHT       * abs(a.noise_tolerance  - b.noise_tolerance)
          - (MATCH_SLEEP_PENALTY  if a.sleep_schedule != b.sleep_schedule else 0)
          - (MATCH_SMOKER_PENALTY if a.smoker         != b.smoker         else 0),
          MATCH_SCORE_MIN, MATCH_SCORE_MAX)

      member_set M = the Students of every GroupMembership of the group whose
                     status is in {ACCEPTED, PLACED}   (the lead's own membership is always in M)
      L = the Student referenced by RoommateGroup.lead_student_id

      # --- variant LEAD_ANCHORED ---
      GroupMembership.match_score            = pair_score(L, this membership's student)
      RoommateGroup.lead_anchored_mean_score = round_half_up( SUM over m in M of pair_score(L, m) / |M| )

      # --- variant PAIRWISE_MEAN ---
      P = the set of unordered pairs {a, b} with a != b drawn from M       # |P| = |M| * (|M| - 1) / 2
      RoommateGroup.average_match_score = round_half_up( SUM over {a,b} in P of pair_score(a, b) / |P| )
    input_set: "Only GroupMemberships of the target group whose status is in {ACCEPTED, PLACED}. INVITED and DECLINED memberships are excluded from both variants."
    constants:
      MATCH_SCORE_MAX: 100
      MATCH_SCORE_MIN: 0
      MATCH_CLEANLINESS_WEIGHT: 12
      MATCH_NOISE_WEIGHT: 8
      MATCH_SLEEP_PENALTY: 25
      MATCH_SMOKER_PENALTY: 30
    precision: "Integer points 0-100. pair_score is exact integer arithmetic; only the two means are rounded, once, with round_half_up."
    variants:
      - name: LEAD_ANCHORED
        when: "Membership-level scoring at invitation time, and the group-level lead_anchored_mean_score stamped at lock."
        difference: "Every score is measured against the group lead only; roommate-to-roommate friction between non-lead members is invisible."
      - name: PAIRWISE_MEAN
        when: "Group-level average_match_score stamped at lock and gated against GROUP_MIN_AVG_MATCH_SCORE."
        difference: "Every unordered member pair contributes equally, so friction between two non-lead members drags the group score down even when both are individually compatible with the lead."
    note: "Worked divergence for the reference four-student fixture (lead S1 c=4/n=3/EARLY/non-smoker; S2 c=3/n=4/EARLY/non-smoker; S3 c=5/n=2/LATE/non-smoker; S4 c=4/n=3/EARLY/non-smoker): pair scores are S1-S2 80, S1-S3 55, S1-S4 100, S2-S3 35, S2-S4 80, S3-S4 55. PAIRWISE_MEAN = round_half_up(405/6) = round_half_up(67.5) = 68; LEAD_ANCHORED mean = round_half_up((100+80+55+100)/4) = round_half_up(83.75) = 84. Same member set, two valid readings, 16 points apart."

  - name: installment_schedule_allocation
    trigger: "POST /leases/{id}/sign — mints the lease's RENT Installments. Referenced by the Lease PENDING_SIGNATURE -> ACTIVE transition side effects."
    algorithm: waterfall_allocation
    formula: |
      n     = Lease.installment_count
      total = Lease.total_contract_cents        # CONTRACTED variant, already stamped in this request

      # PINNED ROUNDING ORDER: floor the per-installment share FIRST, then push the
      # entire residual onto the LAST installment. The alternative reading
      # (round_half_up(total / n) per line, then sum) is explicitly NOT used because
      # it does not reconcile: for total = 986679 and n = 10 it yields 10 * 98668 =
      # 986680, one cent more than the contract.
      base_cents = floor(total / n)
      for k in 1 .. n-1:
          amount_cents[k] = base_cents
      amount_cents[n] = total - base_cents * (n - 1)

      for k in 1 .. n:
          sequence_number[k] = k
          due_date[k]        = Lease.term_start_date + (k - 1) * INSTALLMENT_INTERVAL_DAYS days
          kind[k]            = RENT
          status[k]          = SCHEDULED

      # Reconciliation invariant, checked after minting:
      SUM over k of amount_cents[k] == Lease.total_contract_cents
    input_set: "The single Lease being signed. AMENITY and SUBLET_FEE installments are never part of this allocation and never renumber the RENT rows."
    constants:
      INSTALLMENT_INTERVAL_DAYS: 30
      MIN_INSTALLMENT_COUNT: 1
      MAX_INSTALLMENT_COUNT: 12
    precision: "Integer cents; floor for the base share, exact subtraction for the residual. Sum of the schedule equals total_contract_cents exactly."
    note: "Worked example (total_contract_cents = 986679, n = 10, term_start_date 2026-08-15): base_cents = 98667; installments 1..9 are 98667 with due dates 2026-08-15, 2026-09-14, 2026-10-14, 2026-11-13, 2026-12-13, 2027-01-12, 2027-02-11, 2027-03-13, 2027-04-12; installment 10 is 986679 - 98667*9 = 98676 due 2027-05-12."

  - name: payout_settlement
    trigger: "POST /payouts — stamps gross_collected_cents, platform_fee_bps, platform_fee_cents, holdback_cents, subtotal_cents, rebate_cents and net_amount_cents on the new Payout."
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — collection window (closed interval on the payment DATE)
      gross_collected_cents =
          SUM over Installment i of (i.amount_cents + i.late_fee_cents)
          WHERE i.status == PAID
            AND date(i.paid_at) >= Payout.period_start_date
            AND date(i.paid_at) <= Payout.period_end_date
            AND the Lease of i has property_id == Payout.property_id

      # STEP 2 — fee tier is keyed on the PRE-FEE gross, never on the post-fee net.
      platform_fee_bps = PAYOUT_TIER1_BPS if gross_collected_cents <  PAYOUT_TIER1_MAX_CENTS
                    else PAYOUT_TIER2_BPS if gross_collected_cents <  PAYOUT_TIER2_MAX_CENTS
                    else PAYOUT_TIER3_BPS

      # STEP 3 — fee and holdback are each rounded once, independently, off the gross.
      platform_fee_cents = round_half_up(gross_collected_cents * platform_fee_bps        / 10000)
      holdback_cents     = round_half_up(gross_collected_cents * MAINTENANCE_HOLDBACK_BPS / 10000)

      # STEP 4 — subtotal is post-fee.
      subtotal_cents = gross_collected_cents - platform_fee_cents - holdback_cents

      # STEP 5 — the loyalty rebate is keyed on the POST-FEE subtotal and is a
      # percentage of the fee itself, so the value looks circular (fee -> subtotal ->
      # rebate -> net). The order above resolves it: the tier NEVER re-reads the net.
      rebate_cents = round_half_up(platform_fee_cents * PAYOUT_REBATE_PCT_BPS / 10000)
                     if subtotal_cents >= PAYOUT_REBATE_MIN_SUBTOTAL_CENTS else 0

      # STEP 6 — final settlement figure.
      net_amount_cents = subtotal_cents + rebate_cents
    input_set: "PAID Installments of every kind (RENT, AMENITY, SUBLET_FEE) on leases whose property_id equals the payout's property, whose paid_at DATE lies inside the closed window. VOID, SCHEDULED and LATE installments are excluded, as are installments already swept into an earlier PAID payout window (windows are required to be disjoint by validation)."
    constants:
      PAYOUT_TIER1_MAX_CENTS: 500000
      PAYOUT_TIER2_MAX_CENTS: 2000000
      PAYOUT_TIER1_BPS: 900
      PAYOUT_TIER2_BPS: 700
      PAYOUT_TIER3_BPS: 500
      MAINTENANCE_HOLDBACK_BPS: 200
      PAYOUT_REBATE_MIN_SUBTOTAL_CENTS: 150000
      PAYOUT_REBATE_PCT_BPS: 1000
    precision: "Integer cents; exactly three round_half_up applications (fee, holdback, rebate), each on the gross or the fee, never chained."
    note: "Worked example A (gross 197334): tier 900 bps, fee 17760, holdback 3947, subtotal 175627, subtotal >= 150000 so rebate = round_half_up(17760/10) = 1776, net 177403. Worked example B (gross 98667): tier 900 bps, fee 8880, holdback 1973, subtotal 87814 < 150000 so rebate 0, net 87814."

  - name: installment_late_fee_cents
    trigger: "POST /installments/{id}/pay — evaluated once, at payment time, from the charge's status immediately before payment."
    algorithm: threshold
    formula: |
      # lateness is decided by the clock sweep, with a STRICT comparison:
      an Installment becomes LATE only when
          clock_date > Installment.due_date + LATE_GRACE_DAYS days
      so a payment made exactly on due_date + LATE_GRACE_DAYS carries no fee.

      late_fee_cents = min(round_half_up(Installment.amount_cents * LATE_FEE_BPS / 10000),
                           LATE_FEE_CAP_CENTS)
                       if Installment.status == LATE else 0
      Installment.paid_cents = Installment.amount_cents + late_fee_cents
    input_set: "The single Installment being paid; its status at the instant the pay request is handled."
    constants:
      LATE_GRACE_DAYS: 5
      LATE_FEE_BPS: 500
      LATE_FEE_CAP_CENTS: 7500
    precision: "Integer cents; one round_half_up before the cap is applied."
    note: "Worked examples: amount 98667 -> round_half_up(4933.35) = 4933, below the cap, fee 4933. amount 986679 -> round_half_up(49333.95) = 49334, capped to 7500."

  - name: lease_funding_status
    trigger: "Recomputed in full after ANY Installment mutation on the lease: POST /installments/{id}/pay, the POST /_clock/set_current_utc lateness sweep, the POST /leases/{id}/terminate void cascade, POST /amenity-assignments (mint), POST /amenity-assignments/{id}/release (void) and POST /sublets/{id}/decision (mint)."
    algorithm: projection
    formula: |
      NV = the lease's Installments whose status != VOID
      evaluate the following clauses IN ORDER and stop at the first that holds:
        1. |NV| == 0                                                     -> UNFUNDED
        2. every i in NV has status PAID                                 -> SETTLED
        3. some i in NV has status LATE                                  -> DELINQUENT
        4. no i in NV has status PAID                                    -> UNFUNDED
        5. every i in NV with due_date <= clock_date has status PAID     -> CURRENT
        6. otherwise                                                     -> PARTIAL

      Lease.paid_cents          = SUM over i in NV with status PAID of (i.amount_cents + i.late_fee_cents)
      Lease.amenity_fee_total_cents = SUM over i in NV with kind in {AMENITY, SUBLET_FEE} of i.amount_cents
      Lease.billed_total_cents  = coalesce(Lease.total_contract_cents, 0) + Lease.amenity_fee_total_cents
    input_set: "All non-VOID Installments of the lease, of every kind. VOID rows are excluded from every clause and from all three money rollups."
    constants: {}
    precision: "Integer cents for the rollups; the status is a pure enum decision with a total, ordered clause list."

  - name: unit_occupancy_rollup
    trigger: "Recomputed whenever a Lease on the unit enters or leaves a bed-holding state: the Lease DRAFT -> PENDING_GUARANTOR / DRAFT -> PENDING_SIGNATURE reservations, and the CANCELLED / TERMINATED / ENDED releases, including the group-placement cascade."
    algorithm: aggregation
    formula: |
      HOLDING = {PENDING_GUARANTOR, PENDING_SIGNATURE, ACTIVE}
      Unit.leased_bed_count    = COUNT of Lease rows with unit_id == Unit.id
                                 AND lease_status IN HOLDING
      Unit.available_bed_count = len(Unit.bed_labels) - Unit.leased_bed_count
      Unit.occupancy_status    = FULLY_LEASED     if Unit.available_bed_count == 0
                            else AVAILABLE        if Unit.leased_bed_count == 0
                            else PARTIALLY_LEASED

      Property.unit_count          = COUNT of Units with property_id == Property.id
      Property.total_bed_count     = SUM over those Units of len(bed_labels)
      Property.available_bed_count = SUM over those Units of available_bed_count

      # CONSERVED PARTITION (checked after every reservation and every release):
      len(Unit.bed_labels) == Unit.leased_bed_count + Unit.available_bed_count
      Property.total_bed_count == SUM over the property's Units of
                                  (leased_bed_count + available_bed_count)
    input_set: "Leases on the unit in the three HOLDING states only. DRAFT, ENDED, CANCELLED and TERMINATED leases never consume a bed."
    constants: {}
    precision: "Exact integer counts."

  - name: property_escrow_balance
    trigger: "Recomputed on POST /installments/{id}/pay (credit), POST /payouts/{id}/pay (debit) and POST /payouts/{id}/reverse (credit-back)."
    algorithm: aggregation
    formula: |
      collected_cents = SUM over Installment i of (i.amount_cents + i.late_fee_cents)
                        WHERE i.status == PAID
                          AND the Lease of i has property_id == Property.id
      disbursed_cents = SUM over Payout p of p.gross_collected_cents
                        WHERE p.property_id == Property.id AND p.status == PAID

      Property.escrow_balance_cents      = collected_cents - disbursed_cents
      Property.maintenance_reserve_cents = SUM over Payout p of p.holdback_cents
                                           WHERE p.property_id == Property.id AND p.status == PAID
      Property.payout_eligible           = (Property.escrow_balance_cents >= PAYOUT_MIN_BALANCE_CENTS)

      # CONSERVED MONEY INVARIANT (holds before PAY, after PAY and after REVERSE):
      Property.escrow_balance_cents
        + SUM over PAID Payouts of gross_collected_cents
        == SUM over PAID Installments on the property of (amount_cents + late_fee_cents)
    input_set: "PAID Installments on leases of the property (all kinds) and Payouts of the property with status PAID. REJECTED, SUBMITTED, APPROVED and REVERSED payouts contribute nothing."
    constants:
      PAYOUT_MIN_BALANCE_CENTS: 50000
    precision: "Exact integer cents; no rounding."

  - name: guarantor_income_multiple_bps
    trigger: "POST /guarantor-applications (submit) and POST /guarantor-applications/{id}/resubmit — writes GuarantorApplication.income_multiple_bps."
    algorithm: threshold
    formula: |
      annual_rent_cents   = Lease.monthly_rent_cents * 12
      income_multiple_bps = floor(GuarantorApplication.guarantor_annual_income_cents * 10000
                                  / annual_rent_cents)
      # approval gate, compared with >= so an exact 3.0000x multiple PASSES:
      approvable = (income_multiple_bps >= GUARANTOR_MIN_INCOME_MULTIPLE_BPS)
    input_set: "The application row and the monthly_rent_cents snapshot on its Lease. No other lease, income source or application round is consulted."
    constants:
      GUARANTOR_MIN_INCOME_MULTIPLE_BPS: 30000
    precision: "Integer basis points via floor; never rounded up."
    note: "Worked boundary (monthly_rent_cents = 130000, annual rent 1560000): guarantor_annual_income_cents = 4680000 -> floor(46800000000/1560000) = 30000, exactly at the gate, APPROVE succeeds. guarantor_annual_income_cents = 4679844 -> floor(46798440000/1560000) = 29999, one basis point short, APPROVE is refused."

  - name: lease_guarantor_requirement
    trigger: "POST /leases and POST /leases/{id}/renew and the group-placement lease minting — writes Lease.guarantor_required."
    algorithm: threshold
    formula: |
      guarantor_required =
          (Student.credit_score_band IN {THIN, LOW})
          OR (Lease.monthly_rent_cents > GUARANTOR_RENT_THRESHOLD_CENTS)
      # strict `>`: a bed renting for exactly GUARANTOR_RENT_THRESHOLD_CENTS does NOT
      # by itself demand a guarantor.
    input_set: "The leaseholder Student's credit_score_band and the rent snapshot on the lease being created."
    constants:
      GUARANTOR_RENT_THRESHOLD_CENTS: 120000
    precision: "Boolean."

  - name: sublet_fee_and_cap
    trigger: "The rent cap is enforced on POST /sublets; the fee is stamped on POST /sublets/{id}/decision with decision == APPROVE."
    algorithm: threshold
    formula: |
      window_days        = date_diff_days(Sublet.end_date, Sublet.start_date)   # half-open [start, end)
      sublet_months      = ceil(window_days / QUOTE_MONTH_DAYS)
      sublet_total_cents = Sublet.sublet_rent_cents * sublet_months

      max_sublet_rent_cents = round_half_up(Lease.monthly_rent_cents * SUBLET_MAX_MARKUP_BPS / 10000)
      # rejected with ERR_SUBLET_RENT_ABOVE_CAP when sublet_rent_cents > max_sublet_rent_cents

      platform_fee_cents = max(SUBLET_MIN_FEE_CENTS,
                               round_half_up(sublet_total_cents * SUBLET_FEE_BPS / 10000))
    input_set: "The single Sublet row and the monthly_rent_cents snapshot on its host Lease."
    constants:
      QUOTE_MONTH_DAYS: 30
      SUBLET_MAX_MARKUP_BPS: 11000
      SUBLET_FEE_BPS: 800
      SUBLET_MIN_FEE_CENTS: 2500
    precision: "Integer cents; one round_half_up for the cap and one for the fee, before the floor is applied."
    note: "Worked example (lease monthly_rent_cents 90000, sublet 2027-05-20 -> 2027-07-31, sublet_rent_cents 85000): cap = round_half_up(90000 * 11000 / 10000) = 99000 so 85000 passes; window_days = 72, sublet_months = ceil(72/30) = 3, sublet_total_cents = 255000, platform_fee_cents = max(2500, round_half_up(20400.0)) = 20400."

  - name: amenity_assignment_fee
    trigger: "POST /amenity-assignments — writes window_days, billed_months, total_fee_cents and mints the AMENITY Installment."
    algorithm: aggregation
    formula: |
      window_days     = date_diff_days(AmenityAssignment.end_date,
                                       AmenityAssignment.start_date) + 1   # CLOSED interval [start, end]
      billed_months   = ceil(window_days / QUOTE_MONTH_DAYS)
      total_fee_cents = Amenity.monthly_fee_cents * billed_months

      the minted Installment has kind == AMENITY, amount_cents == total_fee_cents,
      due_date == AmenityAssignment.start_date, status == SCHEDULED and
      sequence_number == max(sequence_number over the lease's existing Installments) + 1
    input_set: "The single assignment row and its Amenity's monthly_fee_cents."
    constants:
      QUOTE_MONTH_DAYS: 30
      AMENITY_MIN_TERM_DAYS: 30
    precision: "Integer cents; no rounding beyond the ceil on months."
    note: "Worked example (monthly_fee_cents 12000, window 2026-09-01 .. 2026-12-31 inclusive): window_days = 121 + 1 = 122, billed_months = ceil(122/30) = 5, total_fee_cents = 60000."

  - name: bed_slot_conflict_detection
    trigger: "Evaluated on POST /leases, POST /leases/{id}/submit, POST /leases/{id}/renew and POST /roommate-groups/{id}/place, for each (unit_id, bed_label) pair the request would occupy."
    algorithm: interval_merge
    formula: |
      # Lease occupancy is a HALF-OPEN interval [term_start_date, term_end_date),
      # and every bed slot additionally demands a TURNOVER_BUFFER_DAYS vacancy gap
      # after an interval ends before the next one may start. Equivalently, each
      # existing interval is inflated by the buffer on its right edge only.
      BLOCKING = {PENDING_GUARANTOR, PENDING_SIGNATURE, ACTIVE}

      candidate C conflicts with existing lease E (same unit_id, same bed_label,
      E.lease_status IN BLOCKING, E is not the lease being renewed's own row when
      that row is already terminal) iff
            C.term_start_date < E.term_end_date   + TURNOVER_BUFFER_DAYS days
        AND E.term_start_date < C.term_end_date   + TURNOVER_BUFFER_DAYS days

      # Boundary: a candidate starting EXACTLY on E.term_end_date + TURNOVER_BUFFER_DAYS
      # is accepted (strict `<`); one day earlier is rejected with
      # ERR_BED_TURNOVER_CONFLICT.
    input_set: "Leases sharing the exact (unit_id, bed_label) pair whose lease_status is in BLOCKING. DRAFT, ENDED, CANCELLED and TERMINATED leases never block."
    constants:
      TURNOVER_BUFFER_DAYS: 14
    precision: "Whole-day date arithmetic."
    note: "Worked boundary (existing lease ends 2027-08-01): a renewal starting 2027-08-15 is accepted because 2027-08-15 < 2027-08-15 is false; a renewal starting 2027-08-14 is rejected because 2027-08-14 < 2027-08-15 is true."

  - name: amenity_capacity_concurrency
    trigger: "Evaluated on POST /amenity-assignments before the row is written."
    algorithm: interval_merge
    formula: |
      # Amenity occupancy is a CLOSED interval [start_date, end_date]: two windows
      # that merely TOUCH at a single calendar day DO collide, unlike lease bed
      # slots. The constraint is aggregate, not exclusive: up to `capacity`
      # overlapping holders are allowed on any single calendar day.
      A = the AmenityAssignments on this amenity with status == ACTIVE
      candidate C is admitted iff, for EVERY calendar day d in [C.start_date, C.end_date],
          1 + COUNT{ a in A : a.start_date <= d <= a.end_date } <= Amenity.capacity

      # Equivalently: the maximum over d of the concurrent-holder count, after
      # inserting C, never exceeds Amenity.capacity. Rejected with
      # ERR_AMENITY_CAPACITY_EXCEEDED.
    input_set: "AmenityAssignments on the same Amenity with status == ACTIVE. RELEASED assignments free their capacity immediately and are excluded."
    constants:
      AMENITY_MIN_TERM_DAYS: 30
    precision: "Whole-day date arithmetic on closed intervals."
    note: "Worked boundary (capacity 2, existing ACTIVE windows 2026-09-01..2026-12-31 and 2026-10-01..2027-01-31): a candidate 2026-12-31..2027-02-28 is rejected because 2026-12-31 is contained in all three closed windows, giving 3 > 2; a candidate 2027-01-01..2027-02-28 is admitted because it only ever shares days with the second window, giving 2 <= 2."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table — evaluated strictly in ascending `priority`.
# The first rule that fails determines the response; no later rule is consulted.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The supplied X-User-Role appears in the target endpoint's `roles:` list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource named by a path segment exists, validated left to right."
    error_id: "ERR_UNIVERSITY_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_GROUP_NOT_FOUND | ERR_MEMBERSHIP_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_GUARANTOR_APPLICATION_NOT_FOUND | ERR_INSTALLMENT_NOT_FOUND | ERR_SUBLET_NOT_FOUND | ERR_AMENITY_NOT_FOUND | ERR_AMENITY_ASSIGNMENT_NOT_FOUND | ERR_PAYOUT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a templated path segment"

  - priority: 4
    category: existence
    check: "Every resource referenced by a foreign-key field in the request body exists (university_id, property_id, unit_id, student_id, lease_id, amenity_id, subtenant_student_id)."
    error_id: "ERR_UNIVERSITY_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_AMENITY_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint whose input declares a foreign-key field"

  - priority: 5
    category: auth
    check: "Ownership. PropertyManager actions require X-User-ID == Property.manager_user_id of the property in scope; Student actions require X-User-ID == the Student.id / Lease.student_id / GroupMembership.student_id / RoommateGroup.lead_student_id in scope; UniversityPartner actions require X-User-ID == University.partner_admin_user_id of the student's university."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all mutating endpoints except POST /universities, POST /properties, POST /students, POST /_clock/set_current_utc and the PlatformAdmin payout and property-posture endpoints"

  - priority: 6
    category: business_constraint
    check: "Request schema: required fields present; types correct; enum members legal; integers within their declared ranges (bedroom_count 1-8, cleanliness_level and noise_tolerance 1-5, required_size 2-8, installment_count 1-12, capacity >= 1, distance_to_campus_m >= 0, base_rent_cents_per_bed_monthly > 0, sublet_rent_cents > 0, monthly_fee_cents >= 0, period_end_date >= period_start_date, academic_year_end_date > academic_year_start_date, term_end_date > term_start_date, bed_labels non-empty with distinct entries, pagination limit within 1-100 and offset >= 0)."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_unit_version == Unit.version (POST /roommate-groups/{id}/place) and expected_property_version == Property.version (POST /payouts)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /roommate-groups/{id}/place, POST /payouts"

  - priority: 8
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2."
    error_id: "ERR_PROPERTY_INVALID_STATE | ERR_STUDENT_INVALID_STATE | ERR_GROUP_INVALID_STATE | ERR_MEMBERSHIP_INVALID_STATE | ERR_LEASE_INVALID_STATE | ERR_GUARANTOR_INVALID_STATE | ERR_INSTALLMENT_NOT_PAYABLE | ERR_SUBLET_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_PAYOUT_INVALID_STATE"
    http_status: 409
    applies_to: "every transition endpoint"

  - priority: 9
    category: state
    check: "Cross-entity posture: the Property in scope has status IN {LISTED, FULLY_COMMITTED}."
    error_id: ERR_PROPERTY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /leases/{id}/submit, POST /leases/{id}/sign, POST /roommate-groups/{id}/place, POST /sublets, POST /sublets/{id}/decision, POST /payouts/{id}/decision"

  - priority: 10
    category: state
    check: "Cross-entity posture: the host Lease has lease_status == ACTIVE."
    error_id: ERR_LEASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sublets, POST /amenity-assignments, POST /leases/{id}/renew"

  - priority: 11
    category: business_safety
    check: "Cross-entity posture: when the acting Student's University has verification_required == true, that Student's verification_status must be VERIFIED."
    error_id: ERR_STUDENT_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /leases/{id}/submit, POST /roommate-groups/{id}/place (each placed member), POST /sublets (the subtenant)"

  - priority: 12
    category: business_referential
    check: "bed_label is a member of the target Unit's bed_labels array."
    error_id: ERR_BED_LABEL_UNKNOWN
    http_status: 422
    applies_to: "POST /leases"

  - priority: 13
    category: business_referential
    check: "Amenity.property_id equals the property_id of the Lease being billed."
    error_id: ERR_AMENITY_PROPERTY_MISMATCH
    http_status: 409
    applies_to: "POST /amenity-assignments"

  - priority: 14
    category: business_referential
    check: "Unit.property_id equals RoommateGroup.property_id."
    error_id: ERR_UNIT_PROPERTY_MISMATCH
    http_status: 409
    applies_to: "POST /roommate-groups/{id}/place"

  - priority: 15
    category: business_referential
    check: "The invited student does not already hold a GroupMembership on this group whose status is in {INVITED, ACCEPTED, PLACED}."
    error_id: ERR_DUPLICATE_MEMBERSHIP
    http_status: 409
    applies_to: "POST /roommate-groups/{id}/invitations"

  - priority: 16
    category: business_referential
    check: "subtenant_student_id differs from the host Lease.student_id."
    error_id: ERR_SUBTENANT_IS_LEASEHOLDER
    http_status: 422
    applies_to: "POST /sublets"

  - priority: 17
    category: business_safety
    check: "Segregation of duties: X-User-ID differs from Payout.submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /payouts/{id}/decision"

  - priority: 18
    category: business_safety
    check: "The current logical clock is at or before Student.verification_expires_at."
    error_id: ERR_VERIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /students/{id}/verification-decision"

  - priority: 19
    category: business_safety
    check: "GuarantorApplication.round_count < GUARANTOR_MAX_REVIEW_ROUNDS (3)."
    error_id: ERR_GUARANTOR_MAX_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST /guarantor-applications/{id}/resubmit"

  - priority: 20
    category: business_safety
    check: "The target Lease has guarantor_required == true and holds no GuarantorApplication whose status is in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED}."
    error_id: ERR_GUARANTOR_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /guarantor-applications"

  - priority: 21
    category: business_temporal
    check: "The requested logical clock instant is greater than or equal to the current one."
    error_id: ERR_CLOCK_BACKWARDS
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 22
    category: business_temporal
    check: "MIN_LEASE_TERM_DAYS (90) <= term_days <= MAX_LEASE_TERM_DAYS (400)."
    error_id: ERR_TERM_LENGTH_INVALID
    http_status: 422
    applies_to: "POST /leases, POST /leases/{id}/renew, POST /roommate-groups/{id}/place"

  - priority: 23
    category: business_temporal
    check: "term_start_date is greater than or equal to the current logical clock date."
    error_id: ERR_TERM_START_IN_PAST
    http_status: 422
    applies_to: "POST /leases, POST /leases/{id}/renew, POST /roommate-groups/{id}/place"

  - priority: 24
    category: business_temporal
    check: "The requested window lies inside the host Lease term: start_date >= Lease.term_start_date and end_date <= Lease.term_end_date."
    error_id: ERR_WINDOW_OUTSIDE_LEASE_TERM
    http_status: 422
    applies_to: "POST /sublets, POST /amenity-assignments"

  - priority: 25
    category: business_temporal
    check: "Window length floor: a Sublet needs window_days >= SUBLET_MIN_TERM_DAYS (21); an AmenityAssignment needs window_days >= AMENITY_MIN_TERM_DAYS (30)."
    error_id: ERR_WINDOW_TOO_SHORT
    http_status: 422
    applies_to: "POST /sublets, POST /amenity-assignments"

  - priority: 26
    category: business_temporal
    check: "Bed-slot occupancy conflict per calculations.bed_slot_conflict_detection, including the TURNOVER_BUFFER_DAYS (14) vacancy gap."
    error_id: ERR_BED_TURNOVER_CONFLICT
    http_status: 409
    applies_to: "POST /leases, POST /leases/{id}/submit, POST /leases/{id}/renew, POST /roommate-groups/{id}/place"

  - priority: 27
    category: business_temporal
    check: "The requested half-open sublet window does not overlap another Sublet on the same host Lease whose status is in {REQUESTED, APPROVED, ACTIVE}; adjacency (one window's end_date equal to the other's start_date) is permitted."
    error_id: ERR_SUBLET_OVERLAP
    http_status: 409
    applies_to: "POST /sublets"

  - priority: 28
    category: business_temporal
    check: "Aggregate closed-interval capacity per calculations.amenity_capacity_concurrency."
    error_id: ERR_AMENITY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /amenity-assignments"

  - priority: 29
    category: business_temporal
    check: "The requested settlement window does not overlap the closed window of another Payout on the same property whose status is in {SUBMITTED, APPROVED, PAID}."
    error_id: ERR_PAYOUT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /payouts"

  - priority: 30
    category: business_constraint
    check: "University.code is unique across all universities."
    error_id: ERR_UNIVERSITY_CODE_TAKEN
    http_status: 409
    applies_to: "POST /universities"

  - priority: 31
    category: business_constraint
    check: "Student.email is unique across all students."
    error_id: ERR_EMAIL_TAKEN
    http_status: 409
    applies_to: "POST /students"

  - priority: 32
    category: business_constraint
    check: "Unit.unit_number is unique within the owning property."
    error_id: ERR_DUPLICATE_UNIT_NUMBER
    http_status: 409
    applies_to: "POST /units"

  - priority: 33
    category: business_constraint
    check: "len(bed_labels) == bedroom_count."
    error_id: ERR_BED_LABELS_MISMATCH
    http_status: 422
    applies_to: "POST /units"

  - priority: 34
    category: business_constraint
    check: "The property has at least one Unit."
    error_id: ERR_PROPERTY_HAS_NO_UNITS
    http_status: 409
    applies_to: "POST /properties/{id}/list"

  - priority: 35
    category: business_constraint
    check: "RoommateGroup.accepted_member_count == RoommateGroup.required_size."
    error_id: ERR_GROUP_SIZE_MISMATCH
    http_status: 409
    applies_to: "POST /roommate-groups/{id}/lock"

  - priority: 36
    category: business_constraint
    check: "The PAIRWISE_MEAN average_match_score over the ACCEPTED member set is >= GROUP_MIN_AVG_MATCH_SCORE (55)."
    error_id: ERR_GROUP_MATCH_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /roommate-groups/{id}/lock"

  - priority: 37
    category: business_constraint
    check: "Unit.available_bed_count >= RoommateGroup.required_size."
    error_id: ERR_UNIT_CAPACITY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /roommate-groups/{id}/place"

  - priority: 38
    category: business_fiscal
    check: "GuarantorApplication.income_multiple_bps >= GUARANTOR_MIN_INCOME_MULTIPLE_BPS (30000)."
    error_id: ERR_GUARANTOR_INCOME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /guarantor-applications/{id}/review with decision == APPROVE"

  - priority: 39
    category: business_fiscal
    check: "sublet_rent_cents <= round_half_up(Lease.monthly_rent_cents * SUBLET_MAX_MARKUP_BPS / 10000)."
    error_id: ERR_SUBLET_RENT_ABOVE_CAP
    http_status: 422
    applies_to: "POST /sublets"

  - priority: 40
    category: business_fiscal
    check: "The request's amount_cents equals Installment.amount_cents exactly (partial payment is not supported)."
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /installments/{id}/pay"

  - priority: 41
    category: business_fiscal
    check: "gross_collected_cents computed for the requested window is strictly greater than 0."
    error_id: ERR_PAYOUT_EMPTY_PERIOD
    http_status: 422
    applies_to: "POST /payouts"


# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# `path:` values are absolute and complete (api_prefix is "/", i.e. no prefix).
# Every list endpoint accepts the standard pagination params and returns the
# §1.0 envelope with limit / offset / total_count / has_more.
# NOTE ON VERSIONS: `version` on Property and Unit increments by 1 on EVERY
# mutation of that row, including cascaded recomputation of derived fields
# (bed rollups, escrow, posture). A test that needs a fresh OCC value must read
# it from GET /properties/{id} or GET /units/{id} immediately before the
# guarded call.
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical UTC clock. Before the first call the clock reads exactly 2026-05-01T00:00:00Z (the fixed startup default); the server never falls back to real wall-clock time. Setting the clock runs the ops checkpoint in this pinned order: (1) installment lateness sweep, (2) sublet activation/completion sweep, (3) lease auto-end sweep."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, installments_marked_late_count: integer, sublets_activated_count: integer, sublets_completed_count: integer, leases_ended_count: integer }
    side_effects:
      - "STEP 1 — every Installment with status SCHEDULED whose lease is in {PENDING_SIGNATURE, ACTIVE, TERMINATED} and whose due_date + LATE_GRACE_DAYS (5) days is strictly before the new clock date becomes LATE; each affected Lease's funding_status is recomputed to DELINQUENT"
      - "STEP 2 — every Sublet with status APPROVED whose start_date <= the new clock date becomes ACTIVE; every Sublet with status ACTIVE whose end_date <= the new clock date becomes COMPLETED"
      - "STEP 3 — every Lease with lease_status ACTIVE whose term_end_date <= the new clock date becomes ENDED, releasing its bed slot and re-running the Unit and Property rollups plus the Property FULLY_COMMITTED -> LISTED auto-transition"

  - method: POST
    path: "/universities"
    description: "Register a partner or non-partner institution."
    roles: [PlatformAdmin]
    code: 201
    input: [name, code, "partner_tier?", "verification_required?", academic_year_start_date, academic_year_end_date, partner_admin_user_id]
    output: University
    side_effects:
      - "University.partner_discount_bps computed from partner_tier (500 for PREFERRED, 0 for STANDARD)"
      - "University.verified_student_count initialised to 0"

  - method: GET
    path: "/universities/{id}"
    description: "Read one university."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: University
    side_effects: []

  - method: POST
    path: "/properties"
    description: "Create a building in DRAFT. The creating manager's X-User-ID becomes Property.manager_user_id."
    roles: [PropertyManager]
    code: 201
    input: [university_id, name, address_line, distance_to_campus_m]
    output: Property
    side_effects:
      - "Property.status := DRAFT; manager_user_id := X-User-ID; all rollup counters initialised to 0; payout_eligible := false"

  - method: GET
    path: "/properties/{id}"
    description: "Read one property, including its escrow, bed rollups and current `version` (the OCC token for POST /payouts)."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties. Reverse-reachability list for University -> Property. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["university_id?", "status?", "manager_user_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: POST
    path: "/properties/{id}/list"
    description: "Publish a DRAFT property so students may lease in it."
    roles: [PropertyManager]
    code: 200
    input: []
    output: Property
    side_effects:
      - "Property DRAFT -> LISTED; bed rollups recomputed; increments Property.version by 1"

  - method: POST
    path: "/properties/{id}/suspend"
    description: "Suspend a LISTED or FULLY_COMMITTED property, blocking new leasing, signing, placement, subletting and payout approval."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Property
    side_effects:
      - "Property -> SUSPENDED; increments Property.version by 1"

  - method: POST
    path: "/properties/{id}/reinstate"
    description: "Return a SUSPENDED property to LISTED, or to FULLY_COMMITTED when it currently has no available beds."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Property
    side_effects:
      - "Property SUSPENDED -> LISTED or SUSPENDED -> FULLY_COMMITTED depending on available_bed_count; increments Property.version by 1"

  - method: POST
    path: "/units"
    description: "Add a unit (floorplan instance) with its explicit bed-slot labels."
    roles: [PropertyManager]
    code: 201
    input: [property_id, unit_number, floorplan_code, bedroom_count, bathroom_count, bed_labels, base_rent_cents_per_bed_monthly]
    output: Unit
    side_effects:
      - "Unit.leased_bed_count := 0; available_bed_count := len(bed_labels); occupancy_status := AVAILABLE"
      - "Property.unit_count, total_bed_count and available_bed_count recomputed; increments Property.version by 1"

  - method: GET
    path: "/units/{id}"
    description: "Read one unit, including its bed rollups and current `version` (the OCC token for POST /roommate-groups/{id}/place)."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List units. Reverse-reachability list for Property -> Unit. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["property_id?", "occupancy_status?", "floorplan_code?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  - method: POST
    path: "/students"
    description: "Register a student profile, including the four roommate-matching attributes. Created UNVERIFIED."
    roles: [PlatformAdmin]
    code: 201
    input: [university_id, full_name, email, "credit_score_band?", cleanliness_level, noise_tolerance, sleep_schedule, "smoker?"]
    output: Student
    side_effects:
      - "Student.verification_status := UNVERIFIED; verification timestamps null"

  - method: GET
    path: "/students/{id}"
    description: "Read one student."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/students"
    description: "List students. Reverse-reachability list for University -> Student. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["university_id?", "verification_status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: POST
    path: "/students/{id}/verification-requests"
    description: "Student asks their university to confirm enrollment. Valid from UNVERIFIED or REJECTED."
    roles: [Student]
    code: 200
    input: []
    output: Student
    side_effects:
      - "Student -> PENDING; verification_submitted_at := clock; verification_expires_at := clock + VERIFICATION_TOKEN_TTL_DAYS (14) days"

  - method: POST
    path: "/students/{id}/verification-decision"
    description: "University partner staff approve or reject a pending enrollment verification."
    roles: [UniversityPartner]
    code: 200
    input: [decision, "note?"]
    output: Student
    side_effects:
      - "decision APPROVE: Student PENDING -> VERIFIED and University.verified_student_count incremented by 1"
      - "decision REJECT: Student PENDING -> REJECTED"
      - "verification_decided_at := clock"

  - method: POST
    path: "/roommate-groups"
    description: "A student opens a roommate group for a property. The creator becomes the lead and is auto-enrolled as an ACCEPTED membership with sequence_number 1."
    roles: [Student]
    code: 201
    input: [property_id, name, required_size]
    output: RoommateGroup
    side_effects:
      - "RoommateGroup.status := FORMING; lead_student_id := X-User-ID"
      - "a GroupMembership is minted for the lead with status ACCEPTED, sequence_number 1 and match_score 100"
      - "RoommateGroup.accepted_member_count := 1"

  - method: GET
    path: "/roommate-groups/{id}"
    description: "Read one roommate group, including both match-score variants once locked."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: RoommateGroup
    side_effects: []

  - method: GET
    path: "/roommate-groups"
    description: "List roommate groups. Reverse-reachability list for Property -> RoommateGroup, Student -> RoommateGroup (lead) and Unit -> RoommateGroup (placement). Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["property_id?", "lead_student_id?", "placed_unit_id?", "status?", "limit?", "offset?"]
    output: RoommateGroup[]
    side_effects: []

  - method: POST
    path: "/roommate-groups/{id}/invitations"
    description: "The lead invites another student. The LEAD_ANCHORED match score is stamped on the new membership."
    roles: [Student]
    code: 201
    input: [student_id]
    output: GroupMembership
    side_effects:
      - "GroupMembership minted with status INVITED, sequence_number := max(sequence_number in group) + 1"
      - "GroupMembership.match_score := LEAD_ANCHORED pair score between the invitee and the group lead"

  - method: POST
    path: "/roommate-groups/{id}/lock"
    description: "The lead freezes the roster. Both match-score variants are stamped and the PAIRWISE_MEAN score is gated."
    roles: [Student]
    code: 200
    input: []
    output: RoommateGroup
    side_effects:
      - "RoommateGroup.average_match_score := PAIRWISE_MEAN variant; RoommateGroup.lead_anchored_mean_score := LEAD_ANCHORED variant"
      - "RoommateGroup FORMING -> LOCKED"

  - method: POST
    path: "/roommate-groups/{id}/place"
    description: "The property manager places a LOCKED group into a unit, minting one by-bed lease per accepted member. Guarded by OCC on the unit's version."
    roles: [PropertyManager]
    code: 200
    input: [unit_id, expected_unit_version, term_start_date, term_end_date, installment_count]
    output: RoommateGroup
    side_effects:
      - "RoommateGroup LOCKED -> PLACED; placed_unit_id := unit_id"
      - "each ACCEPTED GroupMembership becomes PLACED and, walked in ascending sequence_number order against the unit's vacant bed labels in lexicographic ascending order, mints a Lease driven to PENDING_GUARANTOR or PENDING_SIGNATURE"
      - "Unit.leased_bed_count, Unit.available_bed_count and Unit.occupancy_status recomputed"
      - "Property.available_bed_count recomputed and the Property LISTED <-> FULLY_COMMITTED auto-transition re-evaluated"
      - "increments Unit.version by 1"

  - method: GET
    path: "/group-memberships/{id}"
    description: "Read one membership, including its LEAD_ANCHORED match score."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: GroupMembership
    side_effects: []

  - method: GET
    path: "/group-memberships"
    description: "List memberships. Reverse-reachability list for RoommateGroup -> GroupMembership and Student -> GroupMembership. Results are ordered by sequence_number ASC when filtered to a single group_id, otherwise by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["group_id?", "student_id?", "status?", "limit?", "offset?"]
    output: GroupMembership[]
    side_effects: []

  - method: POST
    path: "/group-memberships/{id}/respond"
    description: "The invited student accepts or declines."
    roles: [Student]
    code: 200
    input: [decision]
    output: GroupMembership
    side_effects:
      - "GroupMembership INVITED -> ACCEPTED or INVITED -> DECLINED"
      - "RoommateGroup.accepted_member_count recomputed"

  - method: POST
    path: "/leases"
    description: "A student applies for one bed slot. Created in DRAFT with the QUOTED total and the guarantor requirement stamped."
    roles: [Student]
    code: 201
    input: [student_id, unit_id, bed_label, term_start_date, term_end_date, installment_count]
    output: Lease
    side_effects:
      - "Lease.property_id := Unit.property_id; monthly_rent_cents := Unit.base_rent_cents_per_bed_monthly (client value ignored)"
      - "Lease.term_days and Lease.quoted_total_cents stamped by the QUOTED variant"
      - "Lease.guarantor_required stamped by calculations.lease_guarantor_requirement"
      - "Lease.lease_status := DRAFT; funding_status := UNFUNDED; no bed is reserved yet"

  - method: GET
    path: "/leases/{id}"
    description: "Read one lease with both state axes and both total variants."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/leases"
    description: "List leases. Reverse-reachability list for Student, Unit, Property, RoommateGroup and the self-referential replaces_lease_id turnover chain. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["student_id?", "unit_id?", "property_id?", "roommate_group_id?", "replaces_lease_id?", "lease_status?", "funding_status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []

  - method: POST
    path: "/leases/{id}/submit"
    description: "The student submits a DRAFT lease, reserving the bed slot. Routes to PENDING_GUARANTOR or PENDING_SIGNATURE according to guarantor_required."
    roles: [Student]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "Lease DRAFT -> PENDING_GUARANTOR or DRAFT -> PENDING_SIGNATURE"
      - "bed slot reserved; Unit rollups recomputed; increments Unit.version by 1"
      - "Property.available_bed_count recomputed and the LISTED <-> FULLY_COMMITTED auto-transition re-evaluated"

  - method: POST
    path: "/leases/{id}/sign"
    description: "The student signs. Stamps the CONTRACTED total and mints the installment schedule."
    roles: [Student]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "Lease.term_type, daily_rate_cents, partner_discount_bps, partner_discount_cents and total_contract_cents stamped by the CONTRACTED variant"
      - "Lease PENDING_SIGNATURE -> ACTIVE; signed_at := clock"
      - "installment_count RENT Installments minted by calculations.installment_schedule_allocation"
      - "Lease.billed_total_cents and funding_status recomputed"

  - method: POST
    path: "/leases/{id}/cancel"
    description: "The student withdraws a lease that has not been signed. Releases any reserved bed slot."
    roles: [Student]
    code: 200
    input: ["reason?"]
    output: Lease
    side_effects:
      - "Lease -> CANCELLED; terminated_at := clock"
      - "if the lease held a bed, the slot is released and the Unit and Property rollups plus the Property auto-transition are re-evaluated"
      - "any non-terminal GuarantorApplication on the lease becomes DECLINED"

  - method: POST
    path: "/leases/{id}/terminate"
    description: "The property manager ends an ACTIVE lease early, voiding future charges and releasing the bed."
    roles: [PropertyManager]
    code: 200
    input: ["reason?"]
    output: Lease
    side_effects:
      - "Lease ACTIVE -> TERMINATED; terminated_at := clock"
      - "unpaid Installments with due_date > the clock date become VOID; Lease money rollups and funding_status recomputed"
      - "bed slot released; Unit and Property rollups and the Property auto-transition re-evaluated"
      - "ACTIVE AmenityAssignments on the lease become RELEASED; non-terminal Sublets become COMPLETED"

  - method: POST
    path: "/leases/{id}/renew"
    description: "Turnover: mint a successor lease on the SAME bed slot for a later term. The new lease carries replaces_lease_id and must clear the TURNOVER_BUFFER_DAYS gap after the predecessor's term_end_date."
    roles: [Student]
    code: 201
    input: [term_start_date, term_end_date, installment_count]
    output: Lease
    side_effects:
      - "a new Lease is minted in DRAFT with the same student_id, unit_id and bed_label, and replaces_lease_id := the predecessor's id"
      - "Lease.quoted_total_cents and guarantor_required stamped; the predecessor is left untouched"

  - method: GET
    path: "/leases/{id}/installments"
    description: "Sub-resource list of a lease's charges of every kind. Reverse-reachability list for Lease -> Installment. Results are ordered by sequence_number ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []

  - method: POST
    path: "/installments/{id}/pay"
    description: "The leaseholder pays one charge in full. Assesses the late fee when the charge is LATE and drives the escrow cascade."
    roles: [Student]
    code: 200
    input: [amount_cents]
    output: Installment
    side_effects:
      - "Installment -> PAID with late_fee_cents from calculations.installment_late_fee_cents and paid_cents := amount_cents + late_fee_cents; paid_at := clock"
      - "Lease.paid_cents recomputed and Lease.funding_status re-derived"
      - "Property.escrow_balance_cents recomputed and Property.payout_eligible re-derived; increments Property.version by 1"

  - method: POST
    path: "/guarantor-applications"
    description: "The student submits a guarantor / cosigner for a lease awaiting one."
    roles: [Student]
    code: 201
    input: [lease_id, guarantor_full_name, guarantor_annual_income_cents, relationship]
    output: GuarantorApplication
    side_effects:
      - "GuarantorApplication.status := SUBMITTED; round_count := 1"
      - "income_multiple_bps stamped by calculations.guarantor_income_multiple_bps"

  - method: GET
    path: "/guarantor-applications/{id}"
    description: "Read one guarantor application."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: GuarantorApplication
    side_effects: []

  - method: GET
    path: "/guarantor-applications"
    description: "List guarantor applications. Reverse-reachability list for Lease -> GuarantorApplication. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: GuarantorApplication[]
    side_effects: []

  - method: POST
    path: "/guarantor-applications/{id}/review"
    description: "The property manager advances underwriting: START_REVIEW, REQUEST_INFO, APPROVE or DECLINE."
    roles: [PropertyManager]
    code: 200
    input: [decision, "note?"]
    output: GuarantorApplication
    side_effects:
      - "START_REVIEW: SUBMITTED -> UNDER_REVIEW"
      - "REQUEST_INFO: UNDER_REVIEW -> INFO_REQUESTED"
      - "APPROVE: UNDER_REVIEW -> APPROVED and the lease transitions PENDING_GUARANTOR -> PENDING_SIGNATURE"
      - "DECLINE: UNDER_REVIEW -> DECLINED and the lease transitions PENDING_GUARANTOR -> CANCELLED, releasing the bed slot and re-running the Unit and Property rollups"

  - method: POST
    path: "/guarantor-applications/{id}/resubmit"
    description: "The student answers an INFO_REQUESTED round with revised guarantor details, restarting the underwriting cycle."
    roles: [Student]
    code: 200
    input: [guarantor_full_name, guarantor_annual_income_cents]
    output: GuarantorApplication
    side_effects:
      - "guarantor details replaced; income_multiple_bps recomputed; round_count incremented by 1"
      - "GuarantorApplication INFO_REQUESTED -> SUBMITTED"

  - method: POST
    path: "/sublets"
    description: "The leaseholder requests a summer (or any in-term) sublet of their bed to another student."
    roles: [Student]
    code: 201
    input: [lease_id, subtenant_student_id, start_date, end_date, sublet_rent_cents]
    output: Sublet
    side_effects:
      - "Sublet.window_days and sublet_total_cents stamped; status := REQUESTED"

  - method: GET
    path: "/sublets/{id}"
    description: "Read one sublet."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: Sublet
    side_effects: []

  - method: GET
    path: "/sublets"
    description: "List sublets. Reverse-reachability list for Lease -> Sublet, Student -> Sublet (subtenant) and Installment -> Sublet. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["lease_id?", "subtenant_student_id?", "installment_id?", "status?", "limit?", "offset?"]
    output: Sublet[]
    side_effects: []

  - method: POST
    path: "/sublets/{id}/decision"
    description: "The property manager approves or declines a sublet request. Approval stamps the platform fee and bills it to the host lease."
    roles: [PropertyManager]
    code: 200
    input: [decision, "note?"]
    output: Sublet
    side_effects:
      - "APPROVE: platform_fee_cents stamped by calculations.sublet_fee_and_cap; Sublet REQUESTED -> APPROVED; a SUBLET_FEE Installment is minted on the host lease and its id stored on Sublet.installment_id; Lease.amenity_fee_total_cents and billed_total_cents recomputed"
      - "DECLINE: Sublet REQUESTED -> DECLINED"

  - method: POST
    path: "/amenities"
    description: "The property manager publishes a shared amenity with a finite concurrent capacity."
    roles: [PropertyManager]
    code: 201
    input: [property_id, name, amenity_type, capacity, monthly_fee_cents]
    output: Amenity
    side_effects:
      - "Amenity.active_assignment_count := 0"

  - method: GET
    path: "/amenities/{id}"
    description: "Read one amenity."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: Amenity
    side_effects: []

  - method: GET
    path: "/amenities"
    description: "List amenities. Reverse-reachability list for Property -> Amenity. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["property_id?", "amenity_type?", "limit?", "offset?"]
    output: Amenity[]
    side_effects: []

  - method: POST
    path: "/amenity-assignments"
    description: "The leaseholder reserves an amenity for a closed date window, billed as an extra installment on the lease."
    roles: [Student]
    code: 201
    input: [amenity_id, lease_id, start_date, end_date]
    output: AmenityAssignment
    side_effects:
      - "window_days, billed_months and total_fee_cents stamped by calculations.amenity_assignment_fee"
      - "an AMENITY Installment is minted on the lease and its id stored on AmenityAssignment.installment_id"
      - "Amenity.active_assignment_count incremented by 1; Lease.amenity_fee_total_cents, billed_total_cents and funding_status recomputed"

  - method: GET
    path: "/amenity-assignments/{id}"
    description: "Read one amenity assignment."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: []
    output: AmenityAssignment
    side_effects: []

  - method: GET
    path: "/amenity-assignments"
    description: "List amenity assignments. Reverse-reachability list for Amenity -> AmenityAssignment, Lease -> AmenityAssignment and Installment -> AmenityAssignment. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager, UniversityPartner, Student]
    code: 200
    input: ["amenity_id?", "lease_id?", "installment_id?", "status?", "limit?", "offset?"]
    output: AmenityAssignment[]
    side_effects: []

  - method: POST
    path: "/amenity-assignments/{id}/release"
    description: "The leaseholder gives up an amenity reservation, freeing its capacity and voiding the unpaid charge."
    roles: [Student]
    code: 200
    input: []
    output: AmenityAssignment
    side_effects:
      - "AmenityAssignment ACTIVE -> RELEASED; released_at := clock"
      - "the linked AMENITY Installment becomes VOID when still SCHEDULED or LATE"
      - "Amenity.active_assignment_count decremented by 1; Lease money rollups and funding_status recomputed"

  - method: POST
    path: "/payouts"
    description: "A finance operator opens a settlement for a closed collection window. Guarded by OCC on the property's version; the creator's X-User-ID is recorded for segregation of duties."
    roles: [PlatformAdmin]
    code: 201
    input: [property_id, period_start_date, period_end_date, expected_property_version]
    output: Payout
    side_effects:
      - "every money field stamped by calculations.payout_settlement"
      - "Payout.status := SUBMITTED; submitted_by_user_id := X-User-ID"
      - "increments Property.version by 1"

  - method: GET
    path: "/payouts/{id}"
    description: "Read one payout."
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/payouts"
    description: "List payouts. Reverse-reachability list for Property -> Payout. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []

  - method: POST
    path: "/payouts/{id}/decision"
    description: "A second finance operator approves or rejects the settlement. The acting X-User-ID must differ from the submitter's."
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "note?"]
    output: Payout
    side_effects:
      - "APPROVE: Payout SUBMITTED -> APPROVED; approved_by_user_id := X-User-ID"
      - "REJECT: Payout SUBMITTED -> REJECTED; approved_by_user_id := X-User-ID"

  - method: POST
    path: "/payouts/{id}/pay"
    description: "Disburse an APPROVED settlement, debiting escrow by the gross and crediting the maintenance reserve by the holdback."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects:
      - "Payout APPROVED -> PAID; paid_at := clock"
      - "Property.escrow_balance_cents decreased by gross_collected_cents; Property.maintenance_reserve_cents increased by holdback_cents"
      - "Property.payout_eligible re-derived; increments Property.version by 1"

  - method: POST
    path: "/payouts/{id}/reverse"
    description: "Compensating action for a disbursement: returns the exact gross to escrow and removes the holdback from the maintenance reserve."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Payout
    side_effects:
      - "Payout PAID -> REVERSED; reversed_at := clock"
      - "Property.escrow_balance_cents increased by gross_collected_cents; Property.maintenance_reserve_cents decreased by holdback_cents"
      - "Property.payout_eligible re-derived; increments Property.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — every entry is reachable from at least one §1.5
# endpoint via at least one §1.4 rule or §1.2 precondition.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the four declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "The caller's role is permitted but X-User-ID does not own the resource in scope (wrong manager, wrong student, wrong university partner admin)."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, illegal enum member, out-of-range integer, malformed ISO date, or a date pair whose end is not after its start."

  - id: ERR_UNIVERSITY_NOT_FOUND
    http: 404
    condition: "No University with the referenced id."
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "No Property with the referenced id."
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "No Unit with the referenced id."
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "No Student with the referenced id."
  - id: ERR_GROUP_NOT_FOUND
    http: 404
    condition: "No RoommateGroup with the referenced id."
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "No GroupMembership with the referenced id."
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "No Lease with the referenced id."
  - id: ERR_GUARANTOR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No GuarantorApplication with the referenced id."
  - id: ERR_INSTALLMENT_NOT_FOUND
    http: 404
    condition: "No Installment with the referenced id."
  - id: ERR_SUBLET_NOT_FOUND
    http: 404
    condition: "No Sublet with the referenced id."
  - id: ERR_AMENITY_NOT_FOUND
    http: 404
    condition: "No Amenity with the referenced id."
  - id: ERR_AMENITY_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No AmenityAssignment with the referenced id."
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "No Payout with the referenced id."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_unit_version != Unit.version on POST /roommate-groups/{id}/place, or expected_property_version != Property.version on POST /payouts."

  - id: ERR_PROPERTY_INVALID_STATE
    http: 409
    condition: "The Property posture does not admit the requested transition (listing a non-DRAFT property, suspending a DRAFT or already SUSPENDED property, reinstating a property that is not SUSPENDED)."
  - id: ERR_STUDENT_INVALID_STATE
    http: 409
    condition: "Verification request from a PENDING or VERIFIED student, or a verification decision on a student who is not PENDING."
  - id: ERR_GROUP_INVALID_STATE
    http: 409
    condition: "Inviting into a non-FORMING group, locking a group that is not FORMING, or placing a group that is not LOCKED."
  - id: ERR_MEMBERSHIP_INVALID_STATE
    http: 409
    condition: "Responding to a membership that is no longer INVITED."
  - id: ERR_LEASE_INVALID_STATE
    http: 409
    condition: "The Lease's lease_status does not admit the requested transition (submitting a non-DRAFT lease, signing a lease that is not PENDING_SIGNATURE, cancelling a signed or terminal lease, terminating a lease that is not ACTIVE)."
  - id: ERR_GUARANTOR_INVALID_STATE
    http: 409
    condition: "The review decision does not match the application's current status (START_REVIEW off SUBMITTED, REQUEST_INFO/APPROVE/DECLINE off UNDER_REVIEW, resubmit off INFO_REQUESTED)."
  - id: ERR_INSTALLMENT_NOT_PAYABLE
    http: 409
    condition: "The Installment is already PAID or VOID, or its Lease is not in {ACTIVE, TERMINATED}."
  - id: ERR_SUBLET_INVALID_STATE
    http: 409
    condition: "A decision is issued on a Sublet that is not REQUESTED."
  - id: ERR_ASSIGNMENT_INVALID_STATE
    http: 409
    condition: "Releasing an AmenityAssignment that is already RELEASED."
  - id: ERR_PAYOUT_INVALID_STATE
    http: 409
    condition: "The Payout status does not admit the requested transition (deciding a non-SUBMITTED payout, paying a payout that is not APPROVED, reversing a payout that is not PAID)."

  - id: ERR_PROPERTY_NOT_ACTIVE
    http: 409
    condition: "The Property in scope is DRAFT or SUSPENDED where the operation requires status IN {LISTED, FULLY_COMMITTED}."
  - id: ERR_LEASE_NOT_ACTIVE
    http: 409
    condition: "The host Lease is not ACTIVE where subletting, amenity assignment or renewal requires it."
  - id: ERR_STUDENT_NOT_VERIFIED
    http: 422
    condition: "The student's University has verification_required == true and the student's verification_status is not VERIFIED."

  - id: ERR_BED_LABEL_UNKNOWN
    http: 422
    condition: "bed_label is not a member of the target Unit's bed_labels array."
  - id: ERR_AMENITY_PROPERTY_MISMATCH
    http: 409
    condition: "The Amenity belongs to a different Property than the Lease being billed."
  - id: ERR_UNIT_PROPERTY_MISMATCH
    http: 409
    condition: "The placement Unit belongs to a different Property than the RoommateGroup."
  - id: ERR_DUPLICATE_MEMBERSHIP
    http: 409
    condition: "The invited student already holds an INVITED, ACCEPTED or PLACED membership on this group."
  - id: ERR_SUBTENANT_IS_LEASEHOLDER
    http: 422
    condition: "subtenant_student_id equals the host Lease.student_id."

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID deciding a payout equals Payout.submitted_by_user_id."
  - id: ERR_VERIFICATION_EXPIRED
    http: 422
    condition: "The logical clock has passed Student.verification_expires_at when the decision is issued."
  - id: ERR_GUARANTOR_MAX_ROUNDS_EXCEEDED
    http: 409
    condition: "A resubmit is attempted when round_count has already reached GUARANTOR_MAX_REVIEW_ROUNDS (3)."
  - id: ERR_GUARANTOR_NOT_REQUIRED
    http: 409
    condition: "A guarantor application is submitted for a lease with guarantor_required == false, or one that already holds a non-terminal or approved application."

  - id: ERR_CLOCK_BACKWARDS
    http: 422
    condition: "to_iso8601 is earlier than the current logical clock."
  - id: ERR_TERM_LENGTH_INVALID
    http: 422
    condition: "term_days is below MIN_LEASE_TERM_DAYS (90) or above MAX_LEASE_TERM_DAYS (400)."
  - id: ERR_TERM_START_IN_PAST
    http: 422
    condition: "term_start_date is earlier than the current logical clock date."
  - id: ERR_WINDOW_OUTSIDE_LEASE_TERM
    http: 422
    condition: "A sublet or amenity window is not fully contained in [Lease.term_start_date, Lease.term_end_date]."
  - id: ERR_WINDOW_TOO_SHORT
    http: 422
    condition: "A sublet window is shorter than SUBLET_MIN_TERM_DAYS (21) days, or an amenity window is shorter than AMENITY_MIN_TERM_DAYS (30) days."
  - id: ERR_BED_TURNOVER_CONFLICT
    http: 409
    condition: "The requested lease term collides with another bed-holding lease on the same (unit_id, bed_label) slot once each existing interval is inflated by TURNOVER_BUFFER_DAYS (14) on its right edge."
  - id: ERR_SUBLET_OVERLAP
    http: 409
    condition: "The requested half-open sublet window overlaps another REQUESTED, APPROVED or ACTIVE sublet on the same host lease."
  - id: ERR_AMENITY_CAPACITY_EXCEEDED
    http: 409
    condition: "Admitting the closed-interval assignment would push the concurrent ACTIVE holder count on some calendar day above Amenity.capacity."
  - id: ERR_PAYOUT_PERIOD_OVERLAP
    http: 409
    condition: "The requested settlement window overlaps the window of another SUBMITTED, APPROVED or PAID payout on the same property."

  - id: ERR_UNIVERSITY_CODE_TAKEN
    http: 409
    condition: "Another University already uses this code."
  - id: ERR_EMAIL_TAKEN
    http: 409
    condition: "Another Student already uses this email."
  - id: ERR_DUPLICATE_UNIT_NUMBER
    http: 409
    condition: "The property already has a Unit with this unit_number."
  - id: ERR_BED_LABELS_MISMATCH
    http: 422
    condition: "len(bed_labels) does not equal bedroom_count."
  - id: ERR_PROPERTY_HAS_NO_UNITS
    http: 409
    condition: "A DRAFT property with unit_count == 0 is being listed."
  - id: ERR_GROUP_SIZE_MISMATCH
    http: 409
    condition: "accepted_member_count does not equal required_size at lock time."
  - id: ERR_GROUP_MATCH_SCORE_TOO_LOW
    http: 422
    condition: "The PAIRWISE_MEAN average_match_score is below GROUP_MIN_AVG_MATCH_SCORE (55) at lock time."
  - id: ERR_UNIT_CAPACITY_INSUFFICIENT
    http: 409
    condition: "Unit.available_bed_count is smaller than RoommateGroup.required_size at placement."

  - id: ERR_GUARANTOR_INCOME_INSUFFICIENT
    http: 422
    condition: "income_multiple_bps is below GUARANTOR_MIN_INCOME_MULTIPLE_BPS (30000) when APPROVE is requested."
  - id: ERR_SUBLET_RENT_ABOVE_CAP
    http: 422
    condition: "sublet_rent_cents exceeds round_half_up(Lease.monthly_rent_cents * SUBLET_MAX_MARKUP_BPS / 10000)."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "The submitted amount_cents does not equal Installment.amount_cents."
  - id: ERR_PAYOUT_EMPTY_PERIOD
    http: 422
    condition: "gross_collected_cents computed for the requested window is 0."

