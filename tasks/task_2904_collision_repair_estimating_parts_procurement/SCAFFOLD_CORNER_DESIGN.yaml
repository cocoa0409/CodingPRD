  - section: cross_cutting_complexity_layers
    instances:
      - name: a_second_supplement_priced_off_a_superseded_read_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.supplement-create-stale-order
          - errors.ERR_STALE_REPAIR_ORDER_VERSION
          - validations.priority_33
          - endpoints.POST_/repair-orders/{id}/supplements
        distinguishing_aspect: >-
          The order legitimately carries several supplements, so the guard cannot be "one supplement per
          order": it is the version the estimator read. The first supplement itself advances
          RepairOrder.version, which turns the estimator's own captured value stale - so the second
          request, byte-identical apart from nothing at all, must be refused 412.
        test_recipe:
          setup:
            - "A RepairOrder locked on a BODY 4.5 h line (labor 27000, supplies 1080, pre_tax 28080)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Lou Kerr", phone: "555-1059", email: "lou@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-60", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90066", vehicle_vin: "1HGCV1F30LA090066", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
              captures: { ver_read: $.data.version }
            - call: "POST /repair-orders/${ro_id}/supplements"
              payload: { reason_code: "HIDDEN-DAMAGE", requested_amount_cents: 50000, expected_repair_order_version: "${ver_read}" }
              as: Estimator
              as_user_id: "est-100"
              captures: { sup_1: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/supplements"
              payload: { reason_code: "BLEND-PANEL", requested_amount_cents: 30000, expected_repair_order_version: "${ver_read}" }
              as: Estimator
              as_user_id: "est-100"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with data.error_id == ERR_STALE_REPAIR_ORDER_VERSION"
            - "GET /repair-orders/${ro_id}/supplements returns total_count 1 - the refused request created nothing"
            - "RepairOrder.${ro_id}.version is unchanged by the refusal, and it is strictly greater than ${ver_read} because raising ${sup_1} advanced it"
            - "re-reading the order and repeating the same request with the freshly captured version is accepted, producing a second SUBMITTED supplement with round_count 1"
            - "every accepted write on the order advances version by one, so a third attempt reusing the second supplement's version is refused 412 as well"

      - name: a_consent_decision_carrying_a_superseded_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.consent-decision-stale-order
          - errors.ERR_STALE_REPAIR_ORDER_VERSION
          - validations.priority_33
          - endpoints.POST_/repair-orders/{id}/consent-decisions
        distinguishing_aspect: >-
          A customer may change their mind, so a later decision must supersede an earlier one - the guard
          is not idempotency but the basis figure. Recording consent advances the order's version, so
          replaying the earlier read is refused 412 while a fresh read is accepted and rewrites
          consent_basis_cents.
        test_recipe:
          setup:
            - "A RepairOrder locked on a BODY 4.5 h line, so customer_pay_cents is the 25000 deductible."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mia Doss", phone: "555-1060", email: "mia@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-61", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
