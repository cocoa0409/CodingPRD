      - name: change_order_withdraw_and_reject_paths
        claim_type: valid_transition
        grounds: ["state_machines.DesignChangeOrder.REQUESTED_to_WITHDRAWN", "state_machines.DesignChangeOrder.REQUESTED_to_REJECTED"]
        distinguishing_aspect: "Both non-approval exits from REQUESTED work: customer withdraw (ownership-checked) and PlantManager reject; both land in distinct terminal states."
        test_recipe:
          setup: ["job CONFIRMED with SEALED design TR-01; two change orders co1/co2 created against it"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "CO Job", jobsite_address: "12 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 32.0, pitch_degrees: 26.57, design_load_psf: 40.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 10, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg1: $.data.id } }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/jobs/${job}/change-orders", payload: { supersedes_design_id: "${dsg1}", reason: "span change", expected_job_version: "${job_v3}" }, as: CustomerContact, as_user_id: "${cust}", captures: { co1: $.data.id } }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v4: $.data.version } }
            - { call: "POST /plant/jobs/${job}/change-orders", payload: { supersedes_design_id: "${dsg1}", reason: "load change", expected_job_version: "${job_v4}" }, as: ProductionPlanner, captures: { co2: $.data.id } }
          trigger:
            - { call: "POST /plant/change-orders/${co1}/withdraw", as: CustomerContact, as_user_id: "${cust}" }
            - { call: "POST /plant/change-orders/${co2}/reject", as: PlantManager }
          assert:
            - "DesignChangeOrder.${co1}.status == WITHDRAWN (customer exit)"
            - "DesignChangeOrder.${co2}.status == REJECTED (manager exit)"
            - "ComponentDesign.${dsg1}.status remains SEALED (neither path touched it)"

      - name: change_order_approve_from_requested_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DesignChangeOrder", "errors[ERR_CHANGE_ORDER_INVALID_TRANSITION]"]
        distinguishing_aspect: "Approve requires IMPACT_ASSESSED; approving straight from REQUESTED is rejected."
        test_recipe:
          setup: ["job CONFIRMED with SEALED design; change order co1 REQUESTED"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "CO2 Job", jobsite_address: "13 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 32.0, pitch_degrees: 26.57, design_load_psf: 40.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 10, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg1: $.data.id } }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/jobs/${job}/change-orders", payload: { supersedes_design_id: "${dsg1}", reason: "span change", expected_job_version: "${job_v3}" }, as: ProductionPlanner, captures: { co1: $.data.id } }
          trigger:
            - { call: "POST /plant/change-orders/${co1}/approve", as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CHANGE_ORDER_INVALID_TRANSITION (REQUESTED -> APPROVED skips IMPACT_ASSESSED)"
            - "DesignChangeOrder.${co1}.status remains REQUESTED"

  - section: calculations
    instances:
      - name: build_sequence_changeover_greedy_order
        claim_type: correct_result
        grounds: ["calculations.build_sequence_ordering", "entities.ProductionBatch.fields.build_sequence_no"]
        distinguishing_aspect: "Three batches with identical requested_completion_at: the greedy changeover rule pulls the same-jig batch (changeover 0) ahead of an earlier-created different-jig batch (45 min), with created_at only as the within-tie tie-break."
        test_recipe:
          setup:
            - "Job IN_PRODUCTION; one RELEASED roof cut list; jigs JIG-F and JIG-F2 both ROOF_TRUSS with changeover matrix JIG-F.changeover_minutes_from == {JIG-R: 30}, JIG-R.changeover_minutes_from == {JIG-F: 45}, JIG-F2 == {} (missing entries -> default 60)"
            - "Batches created in order b1 (JIG-F), b2 (JIG-R), b3 (JIG-F2), all requested_completion_at 2026-08-15T00:00:00Z"
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Seq Job", jobsite_address: "14 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-F", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: { JIG-R: 30 } }, as: PlantManager, captures: { jigf: $.data.id } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-R", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: { JIG-F: 45 } }, as: PlantManager, captures: { jigr: $.data.id } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-F2", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: {} }, as: PlantManager, captures: { jigf2: $.data.id } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 32.0, pitch_degrees: 26.57, design_load_psf: 40.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 10, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg1: $.data.id } }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "POST /plant/designs/${dsg1}/cut-lists", payload: { jig_setup_id: "${jigf}", lines: [ { member_label: "TC-1", dimension: "L2X6", length_ft: 12.0, qty: 10 } ] }, as: ProductionPlanner, captures: { cl1: $.data.id } }
            - { call: "POST /plant/cut-lists/${cl1}/release", as: ProductionPlanner }
            - { call: "POST /plant/jobs/${job}/batches", payload: { cut_list_id: "${cl1}", jig_setup_id: "${jigf}", requested_completion_at: "2026-08-15T00:00:00Z" }, as: ProductionPlanner, captures: { b1: $.data.id, b1_seq: $.data.build_sequence_no } }
            - { call: "POST /plant/jobs/${job}/batches", payload: { cut_list_id: "${cl1}", jig_setup_id: "${jigr}", requested_completion_at: "2026-08-15T00:00:00Z" }, as: ProductionPlanner, captures: { b2: $.data.id } }
            - { call: "POST /plant/jobs/${job}/batches", payload: { cut_list_id: "${cl1}", jig_setup_id: "${jigf2}", requested_completion_at: "2026-08-15T00:00:00Z" }, as: ProductionPlanner, captures: { b3: $.data.id } }
          trigger:
            - { call: "GET /plant/batches", payload: { job_id: "${job}" }, as: ProductionPlanner }
          assert:
            - "anchor: earliest created_at b1 (JIG-F) keeps build_sequence_no == 1"
            - "greedy: from JIG-F, b2 (JIG-R) costs 45 vs b3 (JIG-F2) costs 60 (missing matrix entry -> DEFAULT_CHANGEOVER_MINUTES); b2 < b3 so ProductionBatch.${b2}.build_sequence_no == 2 and ${b3}.build_sequence_no == 3"
            - "recompute on each create kept the candidate set to exactly the 3 non-terminal batches"

      - name: provisional_freight_constants_applied
        claim_type: constants_applied
        grounds: ["calculations.load_freight_provisional"]
        distinguishing_aspect: "planned_weight_est 5000 lbs with crane_required_at_jobsite true yields exactly 50000 + 60000 + 25000 = 135000 provisional cents at create; with the flag false it is 110000."
        test_recipe:
          setup: ["customer; two confirmed jobs, one with crane_required_at_jobsite true, one false"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 100000000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Crane Job", jobsite_address: "15 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000, crane_required_at_jobsite: true }, as: PlantManager, captures: { joba: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "No Crane Job", jobsite_address: "16 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { jobb: $.data.id } }
          trigger:
            - { call: "POST /plant/jobs/${joba}/loads", payload: { scheduled_date: "2026-08-21T00:00:00Z", planned_weight_est_lbs: 5000 }, as: ShippingCoordinator, captures: { la: $.data.id } }
            - { call: "POST /plant/jobs/${jobb}/loads", payload: { scheduled_date: "2026-08-21T00:00:00Z", planned_weight_est_lbs: 5000 }, as: ShippingCoordinator, captures: { lb: $.data.id } }
          assert:
            - "DeliveryLoad.${la}.provisional_freight_cents == 135000 (50000 base + 5000*12 + 25000 jobsite-crane flat)"
            - "DeliveryLoad.${lb}.provisional_freight_cents == 110000 (flag false drops the 25000 flat)"

      - name: posture_priority_blocked_beats_at_risk
        claim_type: input_set_filtering
        grounds: ["calculations.job_posture_derivation", "entities.Job.fields.posture"]
        distinguishing_aspect: "With a SEAL_REQUESTED design outstanding (AT_RISK condition) AND credit_hold true (BLOCKED condition) the derivation returns BLOCKED — tier priority, not boolean mix."
        test_recipe:
          setup: ["job CONFIRMED with one design in SEAL_REQUESTED"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Posture Job", jobsite_address: "17 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
          trigger:
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { p1: $.data.posture } }
            - { call: "PATCH /plant/customer-accounts/${cust}", payload: { credit_hold: true }, as: PlantManager }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { p2: $.data.posture } }
            - { call: "PATCH /plant/customer-accounts/${cust}", payload: { credit_hold: false }, as: PlantManager }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { p3: $.data.posture } }
          assert:
            - "${p1} == AT_RISK (SEAL_REQUESTED outstanding)"
            - "${p2} == BLOCKED (credit_hold dominates AT_RISK)"
            - "${p3} == AT_RISK again after hold cleared (derived, never stored)"

      - name: est_board_feet_per_unit_lookup
        claim_type: correct_result
        grounds: ["entities.ComponentDesign.fields.est_board_feet_per_unit"]
        distinguishing_aspect: "ROOF_TRUSS span 32.0 ft maps through UNIT_BF_PER_SPAN_FT 4.25 to exactly 136.00; WALL_PANEL span 8.0 maps through 1.8 to 14.40."
        test_recipe:
          setup: ["customer and confirmed job"]
          setup_api_calls:
