            - "voiding B2 a second time with the fresh ${b2v2} returns HTTP 409 with error_id == ERR_BATCH_STATE_INVALID, not ERR_BATCH_DEPLETED"
      - name: accommodation_rejections_state_duplicate_approval_and_candidate_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - validations[priority=30]
          - validations[priority=38]
          - errors.ERR_ACCOMMODATION_STATE_INVALID
          - errors.ERR_DUPLICATE_APPROVED_ACCOMMODATION
          - errors.ERR_ACCOMMODATION_CANDIDATE_MISMATCH
          - state_machines.AccommodationRequest
        distinguishing_aspect: |
          Three separate guards on the accommodation surface. review-open demands REQUESTED and review demands
          UNDER_REVIEW, so BOTH orderings fail with the same ERR_ACCOMMODATION_STATE_INVALID from opposite
          directions. The duplicate guard is per-CANDIDATE and not per-accommodation_type — a SEPARATE_ROOM
          request is refused while an EXTRA_TIME request is APPROVED — and it guards the APPROVE branch only:
          the same call with decision DENY succeeds, because §1.2's UNDER_REVIEW -> DENIED transition carries
          no such precondition. Finally an accommodation_request_id belonging to another candidate is an
          ERR_ACCOMMODATION_CANDIDATE_MISMATCH on the sitting, even though the request's status
          (UNDER_REVIEW) is itself acceptable.
        test_recipe:
          setup:
            - "A jurisdiction / a provider prepaid 500000 / one ACTIVE EN form / a 2-seat EN site / a REGISTERED EN proctor / candidates A and B of that provider."
            - "A 2-unit EXAM_ONLY batch, one code assigned to candidate B."
            - "Request R1 for candidate A (EXTRA_TIME, requested_multiplier 1.5) walked all the way to APPROVED, and request R2 for candidate A (SEPARATE_ROOM, requested_multiplier 1.0) left in REQUESTED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN"], exam_fee_surcharge_pct: 0.045 }
