# =============================================================================
# Task 0970: §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: senior_create_missing_required_full_name_returns_400
        claim_type: required_fields
        grounds: ["entities.Senior.fields.full_name", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required full_name on POST /v1/seniors fails schema validation at priority 3 with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB; default clock 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/seniors", payload: { date_of_birth: "1940-01-01", address: "1 X St" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST' (HTTP 400); no Senior row created"
      - name: plan_create_invalid_tier_enum_returns_400
        claim_type: type_constraints
        grounds: ["entities.SubscriptionPlan.fields.tier", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "tier: 'GOLD' is not a declared enum member and must be rejected with ERR_INVALID_ENUM (400) at priority 3.5."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/subscription-plans", payload: { tier: "GOLD", monthly_fee_cents: 1000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_ENUM' (HTTP 400)"
      - name: kit_create_applies_plan_default_motion_sensor_count
        claim_type: defaults
        grounds: ["entities.SensorKit.fields.motion_sensor_count", "endpoints[\"POST /v1/sensor-kits\"]"]
        distinguishing_aspect: "Omitting motion_sensor_count on kit create applies the plan's included_motion_sensors (2), producing 4 devices: 1 GATEWAY + 1 WEARABLE + 2 MOTION."
        test_recipe:
          setup: ["Plan with included_motion_sensors 2; senior S_kd with a subscription"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_kd: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Kit Def", date_of_birth: "1940-01-01", address: "1 Kd St" }, as: PlatformAdmin, captures: { s_kd: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_kd}", plan_id: "${plan_kd}" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_kd}" }, as: PlatformAdmin, captures: { kit_kd: $.data.id, kit_kd_count: $.data.motion_sensor_count } }
          assert:
            - "kit_kd_count == 2 (default from plan)"
            - "GET /v1/devices?kit_id=${kit_kd} returns exactly 4 devices: one GATEWAY, one WEARABLE, two MOTION, all status PROVISIONED, battery_percent 100"
      - name: senior_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Senior.fields.open_alert_count"]
        distinguishing_aspect: "Client-supplied open_alert_count in the create body is ignored; the computed field initializes to 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/seniors", payload: { full_name: "Cmp Senior", date_of_birth: "1940-01-01", address: "1 C St", open_alert_count: 99 }, as: PlatformAdmin, captures: { cmp_cnt: $.data.open_alert_count, cmp_posture: $.data.monitoring_posture } }
          assert:
            - "cmp_cnt == 0 and cmp_posture == 'INACTIVE' (computed fields override client input)"
      - name: sensor_event_immutable_common_fields_false
        claim_type: immutability
        grounds: ["entities.SensorEvent"]
        distinguishing_aspect: "SensorEvent has common_fields: false — its read carries id and created_at but no version/updated_at, and no update/delete endpoint exists in §1.5."
        test_recipe:
          setup: ["Senior with kit INSTALLED (devices INSTALLED) so telemetry is accepted"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_se: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Ev Senior", date_of_birth: "1940-01-01", address: "1 Ev St" }, as: PlatformAdmin, captures: { s_se: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_se}", plan_id: "${plan_se}" }, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_se}" }, as: PlatformAdmin, captures: { kit_se: $.data.id } }
            - { call: "GET /v1/devices", payload: { kit_id: "${kit_se}" }, as: PlatformAdmin, captures: { dev_se: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_se}", event_type: "HEARTBEAT", observed_at: "2026-05-01T00:00:00Z" }, as: DeviceHub, captures: { ev_id: $.data.id } }
            - { call: "GET /v1/sensor-events/${ev_id}", payload: {}, as: PlatformAdmin }
          assert:
            - "GET response contains id, created_at, device_id, event_type, observed_at and NO version or updated_at keys"
      - name: get_nonexistent_senior_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404), not a 500 or empty object."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/seniors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_NOT_FOUND' (HTTP 404)"
      - name: seniors_list_pagination_limit_and_has_more
        claim_type: listing
        grounds: ["response_envelope", "endpoints[\"GET /v1/seniors\"]"]
        distinguishing_aspect: "With 3 seniors and limit=2, the page returns 2 items with total_count 3 and has_more true; the offset=2 page returns the 3rd."
        test_recipe:
          setup: ["Three seniors created"]
          setup_api_calls:
            - { call: "POST /v1/seniors", payload: { full_name: "Pg One", date_of_birth: "1940-01-01", address: "1 Pg St" }, as: PlatformAdmin }
            - { call: "POST /v1/seniors", payload: { full_name: "Pg Two", date_of_birth: "1941-01-01", address: "2 Pg St" }, as: PlatformAdmin }
            - { call: "POST /v1/seniors", payload: { full_name: "Pg Three", date_of_birth: "1942-01-01", address: "3 Pg St" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /v1/seniors", payload: { limit: 2, offset: 0 }, as: PlatformAdmin }
            - { call: "GET /v1/seniors", payload: { limit: 2, offset: 2 }, as: PlatformAdmin }
          assert:
            - "First page: 2 data rows, total_count == 3, has_more == true"
            - "Second page: 1 data row, has_more == false"
            - "Pages are disjoint and ordered by created_at ASC"

  # ------------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: kit_ship_from_shipped_rejected_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.SensorKit", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Shipping an already-SHIPPED kit is not a declared transition from SHIPPED -> ERR_INVALID_STATE (409); no duplicate side effects."
        test_recipe:
          setup: ["Senior + subscription + kit already SHIPPED"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_ks: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Ks Senior", date_of_birth: "1940-01-01", address: "1 Ks St" }, as: PlatformAdmin, captures: { s_ks: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_ks}", plan_id: "${plan_ks}" }, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_ks}" }, as: PlatformAdmin, captures: { kit_ks: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_ks}/ship", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/sensor-kits/${kit_ks}/ship", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_STATE' (HTTP 409); kit remains SHIPPED"
      - name: appointment_cancel_from_completed_returns_terminal_error
        claim_type: terminal_lockdown
        grounds: ["state_machines.InstallAppointment", "errors[ERR_APPOINTMENT_TERMINAL]"]
        distinguishing_aspect: "COMPLETED is terminal: cancel after complete yields ERR_APPOINTMENT_TERMINAL (409), exercising terminal lockdown distinct from generic ERR_INVALID_STATE."
        test_recipe:
          setup: ["Senior with delivered kit and a COMPLETED appointment (clock 2026-05-01T09:30:00Z)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_at: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "At Senior", date_of_birth: "1940-01-01", address: "1 At St" }, as: PlatformAdmin, captures: { s_at: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_at}", plan_id: "${plan_at}" }, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_at}" }, as: PlatformAdmin, captures: { kit_at: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_at}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_at}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst AT", region: "R1" }, as: PlatformAdmin, captures: { inst_at: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_at}", kit_id: "${kit_at}", installer_id: "${inst_at}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_at: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_at}/confirm", payload: {}, as: Installer, as_user_id: "${inst_at}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_at}/complete", payload: {}, as: Installer, as_user_id: "${inst_at}" }
          trigger:
            - { call: "POST /v1/install-appointments/${appt_at}/cancel", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_APPOINTMENT_TERMINAL' (HTTP 409); appointment remains COMPLETED"
      - name: alert_resolve_from_notifying_returns_not_actionable
        claim_type: invalid_transition
        grounds: ["state_machines.Alert", "errors[ERR_ALERT_NOT_ACTIONABLE]"]
        distinguishing_aspect: "Resolve requires ACKNOWLEDGED; calling it on a NOTIFYING alert yields ERR_ALERT_NOT_ACTIONABLE (409) and leaves the alert open."
        test_recipe:
          setup: ["ACTIVE senior with caregiver+contact entry and one MANUAL MEDIUM alert in NOTIFYING"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_na: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Na Senior", date_of_birth: "1940-01-01", address: "1 Na St" }, as: PlatformAdmin, captures: { s_na: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_na}", plan_id: "${plan_na}" }, as: PlatformAdmin, captures: { sub_na: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_na}" }, as: PlatformAdmin, captures: { kit_na: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_na}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_na}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst NA", region: "R1" }, as: PlatformAdmin, captures: { inst_na: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_na}", kit_id: "${kit_na}", installer_id: "${inst_na}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_na: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_na}/confirm", payload: {}, as: Installer, as_user_id: "${inst_na}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_na}/complete", payload: {}, as: Installer, as_user_id: "${inst_na}" }
            - { call: "POST /v1/subscriptions/${sub_na}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_na}", full_name: "Cg Na", phone: "555-7" }, as: PlatformAdmin, captures: { cg_na: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_na}", caregiver_id: "${cg_na}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin }
            - { call: "POST /v1/alerts", payload: { senior_id: "${s_na}", severity: "MEDIUM" }, as: MonitoringAgent, captures: { alert_na: $.data.id } }
          trigger:
            - { call: "POST /v1/alerts/${alert_na}/resolve", payload: {}, as: Caregiver, as_user_id: "${cg_na}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_ALERT_NOT_ACTIONABLE' (HTTP 409); GET /v1/alerts/${alert_na} still shows NOTIFYING and open_alert_count unchanged at 1"
      - name: dose_confirm_after_window_returns_not_pending
        claim_type: invalid_transition
        grounds: ["state_machines.DoseEvent.PENDING_to_TAKEN", "errors[ERR_DOSE_NOT_PENDING]"]
        distinguishing_aspect: "A dose whose window lapsed is MISSED by the clock sweep; confirming it afterwards yields ERR_DOSE_NOT_PENDING (409) — terminal lockdown for DoseEvent."
        test_recipe:
          setup: ["ACTIVE senior with a ROUTINE 20:00 schedule; clock swept to 2026-05-01T21:30:00Z so the only dose is MISSED"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_dm: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Dm Senior", date_of_birth: "1940-01-01", address: "1 Dm St" }, as: PlatformAdmin, captures: { s_dm: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_dm}", plan_id: "${plan_dm}" }, as: PlatformAdmin, captures: { sub_dm: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_dm}" }, as: PlatformAdmin, captures: { kit_dm: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_dm}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_dm}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst DM", region: "R1" }, as: PlatformAdmin, captures: { inst_dm: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_dm}", kit_id: "${kit_dm}", installer_id: "${inst_dm}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_dm: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_dm}/confirm", payload: {}, as: Installer, as_user_id: "${inst_dm}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_dm}/complete", payload: {}, as: Installer, as_user_id: "${inst_dm}" }
            - { call: "POST /v1/subscriptions/${sub_dm}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/seniors/${s_dm}", payload: {}, as: PlatformAdmin, captures: { s_dm_v: $.data.version } }
            - { call: "POST /v1/medication-schedules", payload: { senior_id: "${s_dm}", medication_name: "Aspirin", times_of_day: ["20:00"], window_minutes: 60, criticality: "ROUTINE", start_date: "2026-05-01", expected_senior_version: "${s_dm_v}" }, as: PlatformAdmin, captures: { sched_dm: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T21:30:00Z" }, as: PlatformAdmin }
            - { call: "GET /v1/dose-events", payload: { schedule_id: "${sched_dm}" }, as: PlatformAdmin, captures: { dose_dm: "$.data[0].id", dose_dm_st: "$.data[0].status" } }
          trigger:
            - { call: "POST /v1/dose-events/${dose_dm}/confirm", payload: {}, as: Senior, as_user_id: "${s_dm}", captures: { err: $.data.error_id } }
          assert:
            - "dose_dm_st == 'MISSED' (sweep ran before the confirm)"
            - "err == 'ERR_DOSE_NOT_PENDING' (HTTP 409)"
      - name: device_offline_auto_transition_and_alert
        claim_type: auto_transition
        grounds: ["state_machines.Device.ONLINE_to_OFFLINE", "calculations.clock_sweep_order"]
        distinguishing_aspect: "Clock advance beyond 90 minutes of silence flips an ONLINE gateway to OFFLINE and creates exactly one DEVICE_OFFLINE MEDIUM alert; a second sweep creates no duplicate."
        test_recipe:
          setup: ["ACTIVE senior; gateway ONLINE (heartbeat at 2026-05-01T09:30:00Z); clock then advanced to 2026-05-01T12:00:00Z (150 min later)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_do: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Do Senior", date_of_birth: "1940-01-01", address: "1 Do St" }, as: PlatformAdmin, captures: { s_do: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_do}", plan_id: "${plan_do}" }, as: PlatformAdmin, captures: { sub_do: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_do}" }, as: PlatformAdmin, captures: { kit_do: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_do}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_do}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst DO", region: "R1" }, as: PlatformAdmin, captures: { inst_do: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_do}", kit_id: "${kit_do}", installer_id: "${inst_do}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_do: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_do}/confirm", payload: {}, as: Installer, as_user_id: "${inst_do}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_do}/complete", payload: {}, as: Installer, as_user_id: "${inst_do}" }
            - { call: "POST /v1/subscriptions/${sub_do}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/devices", payload: { kit_id: "${kit_do}" }, as: PlatformAdmin, captures: { dev_do: "$.data[0].id" } }
            - { call: "POST /v1/telemetry", payload: { device_id: "${dev_do}", event_type: "HEARTBEAT", observed_at: "2026-05-01T09:30:00Z" }, as: DeviceHub }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T13:00:00Z" }, as: PlatformAdmin }
          assert:
            - "GET /v1/devices/${dev_do} shows status == 'OFFLINE'"
            - "GET /v1/alerts?device_id=${dev_do}&alert_type=DEVICE_OFFLINE returns exactly 1 row with severity MEDIUM (no duplicate on the second sweep)"
      - name: appointment_completion_side_effects_kit_and_devices
        claim_type: side_effect_execution
        grounds: ["state_machines.InstallAppointment.CONFIRMED_to_COMPLETED"]
        distinguishing_aspect: "Completing the appointment cascades: kit DELIVERED->INSTALLED and every PROVISIONED device -> INSTALLED in the same request."
        test_recipe:
          setup: ["Senior with delivered kit (3 devices: 1 gw + 1 wearable + 1 motion) and CONFIRMED appointment; clock inside window"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_fx: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Fx Senior", date_of_birth: "1940-01-01", address: "1 Fx St" }, as: PlatformAdmin, captures: { s_fx: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_fx}", plan_id: "${plan_fx}" }, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_fx}" }, as: PlatformAdmin, captures: { kit_fx: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_fx}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_fx}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst FX", region: "R1" }, as: PlatformAdmin, captures: { inst_fx: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_fx}", kit_id: "${kit_fx}", installer_id: "${inst_fx}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_fx: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_fx}/confirm", payload: {}, as: Installer, as_user_id: "${inst_fx}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/install-appointments/${appt_fx}/complete", payload: {}, as: Installer, as_user_id: "${inst_fx}" }
          assert:
            - "GET /v1/sensor-kits/${kit_fx} shows status == 'INSTALLED'"
            - "GET /v1/devices?kit_id=${kit_fx} shows all 3 devices with status == 'INSTALLED'"
      - name: subscription_created_with_parallel_initial_states
        claim_type: initial_state
        grounds: ["state_machines.Subscription"]
        distinguishing_aspect: "A new subscription starts in the pair (PROVISIONING, CURRENT) with zeroed counters — both dimensions observable on the create response."
        test_recipe:
          setup: ["Plan and senior exist"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_is: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Is Senior", date_of_birth: "1940-01-01", address: "1 Is St" }, as: PlatformAdmin, captures: { s_is: $.data.id } }
          trigger:
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_is}", plan_id: "${plan_is}" }, as: PlatformAdmin, captures: { is_svc: $.data.service_status, is_bill: $.data.billing_status, is_fails: $.data.consecutive_failed_payments } }
          assert:
            - "is_svc == 'PROVISIONING' and is_bill == 'CURRENT' and is_fails == 0"
      - name: subscription_activate_without_installed_kit_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Subscription", "errors[ERR_KIT_NOT_DELIVERED]"]
        distinguishing_aspect: "Activation while the senior's only kit is merely DELIVERED (not INSTALLED) fails with ERR_KIT_NOT_DELIVERED — the Subscription -> SensorKit guard."
        test_recipe:
          setup: ["Senior with subscription PROVISIONING and kit DELIVERED (no appointment)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_ak: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Ak Senior", date_of_birth: "1940-01-01", address: "1 Ak St" }, as: PlatformAdmin, captures: { s_ak: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_ak}", plan_id: "${plan_ak}" }, as: PlatformAdmin, captures: { sub_ak: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_ak}" }, as: PlatformAdmin, captures: { kit_ak: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_ak}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_ak}/mark-delivered", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/subscriptions/${sub_ak}/activate", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_KIT_NOT_DELIVERED' (HTTP 409); service_status stays PROVISIONING"
      - name: escalation_timeout_walks_contact_tree
        claim_type: auto_transition
        grounds: ["state_machines.Alert.NOTIFYING_to_ESCALATED", "calculations.escalation_target_selection"]
        distinguishing_aspect: "After contact-1's 3600s timeout with no ack, the sweep marks the first notification TIMED_OUT, sends level 2 to the second contact, and sets escalation_level 2; severity gating keeps the min_severity HIGH entry out of a MEDIUM alert's fan-out."
        test_recipe:
          setup: ["ACTIVE senior; three contact entries: rank1 LOW timeout 3600, rank2 MEDIUM timeout 3600, rank3 HIGH timeout 3600; MANUAL MEDIUM alert raised at 2026-05-01T09:30:00Z; clock advanced to 2026-05-01T10:31:00Z then 2026-05-01T11:32:00Z"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 24, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_et: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Et Senior", date_of_birth: "1940-01-01", address: "1 Et St" }, as: PlatformAdmin, captures: { s_et: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_et}", plan_id: "${plan_et}" }, as: PlatformAdmin, captures: { sub_et: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_et}" }, as: PlatformAdmin, captures: { kit_et: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_et}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_et}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst ET", region: "R1" }, as: PlatformAdmin, captures: { inst_et: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_et}", kit_id: "${kit_et}", installer_id: "${inst_et}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_et: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_et}/confirm", payload: {}, as: Installer, as_user_id: "${inst_et}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_et}/complete", payload: {}, as: Installer, as_user_id: "${inst_et}" }
            - { call: "POST /v1/subscriptions/${sub_et}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_et}", full_name: "Cg E1", phone: "555-11" }, as: PlatformAdmin, captures: { cg_e1: $.data.id } }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_et}", full_name: "Cg E2", phone: "555-12" }, as: PlatformAdmin, captures: { cg_e2: $.data.id } }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_et}", full_name: "Cg E3", phone: "555-13" }, as: PlatformAdmin, captures: { cg_e3: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_et}", caregiver_id: "${cg_e1}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_et}", caregiver_id: "${cg_e2}", priority_rank: 2, min_severity: "MEDIUM", response_timeout_seconds: 3600 }, as: PlatformAdmin }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_et}", caregiver_id: "${cg_e3}", priority_rank: 3, min_severity: "HIGH", response_timeout_seconds: 3600 }, as: PlatformAdmin }
            - { call: "POST /v1/alerts", payload: { senior_id: "${s_et}", severity: "MEDIUM" }, as: MonitoringAgent, captures: { alert_et: $.data.id } }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:31:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T11:32:00Z" }, as: PlatformAdmin }
          assert:
            - "GET /v1/alert-notifications?alert_id=${alert_et} returns exactly 2 rows: level 1 TIMED_OUT (cg_e1) and level 2 SENT (cg_e2); cg_e3 (min_severity HIGH) never appears for a MEDIUM alert"
            - "GET /v1/alerts/${alert_et} shows status ESCALATED and escalation_level == 2"
            - "After the second sweep past level-2 timeout with no further eligible contact: escalation_exhausted == true and level-2 notification TIMED_OUT"

  # ------------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: dashboard_adherence_today_weighted_literal
        claim_type: correct_result
        grounds: ["calculations.adherence_pct", "endpoints[GET /v1/seniors/{senior_id}/dashboard]"]
        distinguishing_aspect: "Dashboard 'today' scope aggregates terminal doses only: one punctual (1.0) + one late (0.5) dose gives adherence_today_pct == 75.0, computed from the pinned weights."
        test_recipe:
          setup:
            - "PLUS plan; senior S_da ACTIVE; ROUTINE schedule at 08:00 and 09:00 (times_of_day ['08:00','09:00']), window 60, start 2026-05-01"
            - "Dose 08:00 confirmed punctual at 08:10; dose 09:00 confirmed late at 09:40; clock 2026-05-01T09:45:00Z"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_da: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Da Senior", date_of_birth: "1940-01-01", address: "1 Da St" }, as: PlatformAdmin, captures: { s_da: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_da}", plan_id: "${plan_da}" }, as: PlatformAdmin, captures: { sub_da: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_da}" }, as: PlatformAdmin, captures: { kit_da: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_da}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_da}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst DA", region: "R1" }, as: PlatformAdmin, captures: { inst_da: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_da}", kit_id: "${kit_da}", installer_id: "${inst_da}", window_start: "2026-05-01T07:00:00Z", window_end: "2026-05-01T08:00:00Z" }, as: PlatformAdmin, captures: { appt_da: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_da}/confirm", payload: {}, as: Installer, as_user_id: "${inst_da}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T07:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_da}/complete", payload: {}, as: Installer, as_user_id: "${inst_da}" }
            - { call: "POST /v1/subscriptions/${sub_da}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/seniors/${s_da}", payload: {}, as: PlatformAdmin, captures: { s_da_v: $.data.version } }
            - { call: "POST /v1/medication-schedules", payload: { senior_id: "${s_da}", medication_name: "Metformin", times_of_day: ["08:00", "09:00"], window_minutes: 60, criticality: "ROUTINE", start_date: "2026-05-01", expected_senior_version: "${s_da_v}" }, as: PlatformAdmin, captures: { sched_da: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:10:00Z" }, as: PlatformAdmin }
            - { call: "GET /v1/dose-events", payload: { schedule_id: "${sched_da}" }, as: PlatformAdmin, captures: { dose_da1: "$.data[0].id", dose_da2: "$.data[1].id" } }
            - { call: "POST /v1/dose-events/${dose_da1}/confirm", payload: {}, as: Senior, as_user_id: "${s_da}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:40:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/dose-events/${dose_da2}/confirm", payload: {}, as: Senior, as_user_id: "${s_da}" }
          trigger:
            - { call: "GET /v1/seniors/${s_da}/dashboard", payload: {}, as: PlatformAdmin, captures: { da_adh: $.data.adherence_today_pct, da_posture: $.data.monitoring_posture } }
          assert:
            - "da_adh == 75.0 ((1.0 punctual + 0.5 late) / 2 * 100)"
            - "da_posture == 'ACTIVE'"
      - name: escalation_selector_empty_eligible_set_stays_raised
        claim_type: correct_result
        grounds: ["calculations.escalation_target_selection", "state_machines.Alert"]
        distinguishing_aspect: "Selector empty-pool fallback: a MEDIUM alert whose only contact entries require min_severity HIGH finds no eligible contact and stays RAISED with zero notifications — the pinned fallback, not an error."
        test_recipe:
          setup: ["ACTIVE senior; one contact entry with min_severity HIGH; MANUAL MEDIUM alert raised"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_es: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Es Senior", date_of_birth: "1940-01-01", address: "1 Es St" }, as: PlatformAdmin, captures: { s_es: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_es}", plan_id: "${plan_es}" }, as: PlatformAdmin, captures: { sub_es: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_es}" }, as: PlatformAdmin, captures: { kit_es: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_es}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_es}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst ES", region: "R1" }, as: PlatformAdmin, captures: { inst_es: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_es}", kit_id: "${kit_es}", installer_id: "${inst_es}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_es: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_es}/confirm", payload: {}, as: Installer, as_user_id: "${inst_es}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_es}/complete", payload: {}, as: Installer, as_user_id: "${inst_es}" }
            - { call: "POST /v1/subscriptions/${sub_es}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_es}", full_name: "Cg Es", phone: "555-8" }, as: PlatformAdmin, captures: { cg_es: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_es}", caregiver_id: "${cg_es}", priority_rank: 1, min_severity: "HIGH", response_timeout_seconds: 3600 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/alerts", payload: { senior_id: "${s_es}", severity: "MEDIUM" }, as: MonitoringAgent, captures: { alert_es: $.data.id, alert_es_st: $.data.status } }
          assert:
            - "alert_es_st == 'RAISED' (empty eligible pool -> stays in the monitoring-center queue)"
            - "GET /v1/alert-notifications?alert_id=${alert_es} returns 0 rows"
            - "GET /v1/seniors/${s_es} shows open_alert_count == 1 (RAISED counts as open)"
      - name: battery_threshold_constants_excluded_stub
        claim_type: constants_applied
        grounds: ["calculations.battery_alert_thresholds"]
        excluded_because:
          difficulty_instance: boundary_precision_check / battery_alert_threshold_inclusive_at_20
          rationale: "The inclusive 20/21 boundary and MEDIUM severity constant are asserted by the named §1.8 instance."

  # ------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: forbidden_role_beats_schema_validation
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "A Caregiver POSTing /v1/subscription-plans with a malformed body still gets ERR_FORBIDDEN_ROLE (403): role check (2) precedes schema check (3)."
        test_recipe:
          setup: ["Senior + caregiver exist"]
          setup_api_calls:
            - { call: "POST /v1/seniors", payload: { full_name: "Pv Senior", date_of_birth: "1940-01-01", address: "1 Pv St" }, as: PlatformAdmin, captures: { s_pv: $.data.id } }
