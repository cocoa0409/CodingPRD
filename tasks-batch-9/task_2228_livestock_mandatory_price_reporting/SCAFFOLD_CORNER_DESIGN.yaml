              as: ProgramAdmin
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z", min_reporter_count: 1, max_single_reporter_share_pct: 100.00, min_reported_head: 1 }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
