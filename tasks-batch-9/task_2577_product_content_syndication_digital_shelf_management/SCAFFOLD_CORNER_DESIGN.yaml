      - name: shelf_blocked_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LISTING_SHELF_BLOCKED]
        excluded_because:
          difficulty_instance: shelf_blocked_priority_34_beats_feed_capacity_priority_45
          rationale: "That instance queues a job against a SUSPENDED listing and asserts the 409 ERR_LISTING_SHELF_BLOCKED response, which is exactly this triggerability claim."

      - name: feed_capacity_exceeded_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FEED_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: shelf_blocked_priority_34_beats_feed_capacity_priority_45
          rationale: "After the shelf block is cleared the same over-capacity payload is replayed there and asserted to return ERR_FEED_CAPACITY_EXCEEDED."

      - name: prohibited_claim_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PROHIBITED_CLAIM]
        excluded_because:
          difficulty_instance: prohibited_claim_priority_35_beats_attribute_length_priority_40
          rationale: "The prohibited-token value is written there and asserted to return 422 ERR_PROHIBITED_CLAIM."

      - name: version_not_pinned_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_VERSION_NOT_PINNED]
        excluded_because:
          difficulty_instance: queue_call_depends_on_the_content_versions_own_pin_state
          rationale: "Queueing the DRAFT revision 2 is asserted there to return 422 ERR_VERSION_NOT_PINNED."

      - name: deployment_window_overlap_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DEPLOYMENT_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: deployment_windows_touch_at_a_shared_endpoint_without_overlapping
          rationale: "The strictly intersecting third window is asserted there to return 409 ERR_DEPLOYMENT_WINDOW_OVERLAP."

      - name: feed_window_conflict_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FEED_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: feed_windows_touching_at_an_endpoint_do_count_as_a_conflict
          rationale: "The touching feed window is asserted there to return 409 ERR_FEED_WINDOW_CONFLICT."

