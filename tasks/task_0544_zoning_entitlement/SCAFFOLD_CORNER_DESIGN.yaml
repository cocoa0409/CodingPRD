            - "$.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: non_owner_applicant_cannot_submit
        claim_type: ownership_denied
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "An Applicant whose X-User-ID != application.applicant_id submitting the application -> ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["A DRAFT application owned by applicant A; a second registered applicant B."]
          setup_api_calls:
