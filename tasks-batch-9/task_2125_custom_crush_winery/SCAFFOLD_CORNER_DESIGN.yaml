  - section: errors
    instances:

      - name: corner_missing_x_user_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID pair answers ERR_UNAUTHENTICATED (401) before any other check, including on read endpoints."
        test_recipe:
          setup: ["One registered Client."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
          trigger:
            - call: "GET /clients/${cl1}"
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "with both X-User-Role and X-User-ID omitted the response is ${err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "with X-User-Role set to Sommelier (an undeclared role) the response is also ERR_UNAUTHENTICATED with HTTP 401"

      - name: corner_path_id_sweep_returns_entity_specific_not_found
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_VESSEL_NOT_FOUND]", "errors[ERR_ALLOCATION_NOT_FOUND]", "errors[ERR_INTAKE_NOT_FOUND]", "errors[ERR_TRIAL_NOT_FOUND]", "errors[ERR_WORK_ORDER_NOT_FOUND]", "errors[ERR_LINE_NOT_FOUND]", "errors[ERR_RUN_NOT_FOUND]", "errors[ERR_DRY_GOODS_ITEM_NOT_FOUND]", "errors[ERR_TTB_REPORT_NOT_FOUND]", "errors[ERR_RELEASE_ORDER_NOT_FOUND]", "errors[ERR_CONTRACT_NOT_FOUND]"]
        distinguishing_aspect: "Each single-resource GET answers its OWN domain-specific 404 for an unknown UUID — never a shared generic ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database apart from the logical clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
          trigger:
            - call: "GET /vessels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { e_vessel: $.data.error_id }
            - call: "GET /vessel-allocations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FacilityAdmin
              as_user_id: "fa-carol"
