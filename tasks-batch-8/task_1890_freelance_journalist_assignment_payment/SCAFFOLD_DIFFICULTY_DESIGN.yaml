  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: batch_cancel_membership_invariant
        grounds:
          - state_machines.PaymentBatch.OPEN_to_CANCELLED
          - state_machines.Invoice.APPROVED_to_BATCHED
          - entities.PaymentBatch.fields.total_net_cents
        distinguishing_aspect: |
          Conserved quantity = invoice payment_batch_id membership and batch
          totals: add-invoice then cancel must leave every member invoice back
          at APPROVED with payment_batch_id == null, and no batch may hold a
          nonzero total after cancellation — the forward (add) + compensating
          (cancel) pair leaves the multiset of unbatched APPROVED invoices
          unchanged.
        test_recipe:
          setup:
            - "DeskConfig defaults; contributor with VERIFIED W9, FLAT 50000; assignment accepted; invoice APPROVED; OPEN batch containing it"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Cancel Carl", email: "carl@x.com", tax_residency: "DOMESTIC_US" }
