            - call: "POST /vault/items/${it_id}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 18000, checksum: "sha-o1", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_id}/declare-value"
              payload: { declared_value_cents: 200000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/appraisals"
              payload: { item_id: "${it_id}", appraiser_id: "${apr_id}", inspection_start_at: "2026-06-10T09:00:00Z", inspection_end_at: "2026-06-10T17:00:00Z" }
              as: Homeowner
