              as: FarmManager
          trigger:
            - call: "GET /input-products/${sp}/lots"
              payload: {}
              as: FarmManager
          assert:
            - "response_type == array"
            - "meta.total_count == 2"

  # ===========================================================================
  - section: rbac
    instances:
      - name: agronomist_cannot_approve_plan
        claim_type: exclusive_operation_denied
        grounds:
          - roles.FarmManager
          - errors[ERR_FORBIDDEN]
          - endpoints.POST /crop-plans/{id}/approve
        distinguishing_aspect: "Agronomist calling POST /crop-plans/{id}/approve (FarmManager-exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A DRAFT plan on an AVAILABLE parcel."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "RB", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
          trigger:
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_FORBIDDEN (403)"

      - name: salesagent_cannot_create_parcel
        claim_type: exclusive_operation_denied
        grounds:
          - roles.SalesAgent
          - errors[ERR_FORBIDDEN]
          - endpoints.POST /parcels
        distinguishing_aspect: "SalesAgent calling POST /parcels (FarmManager-exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
