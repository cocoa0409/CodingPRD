          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "ProductSpec LUBE-0W20-SP has one ACTIVE recipe (pinned to revision 1) and one DRAFT recipe also pinned to revision 1."
            - "A SpecChangeRequest to target 7.700 has been cleared on both branches and made effective, taking the spec to revision 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specs"
