  - method: POST
    path: /revenue-pools/{id}/distribution-runs
    description: "Compute a distribution run over the pool, allocating the distributable amount across eligible members and writing one line per member."
    roles: [FinanceOfficer]
    input: ["variant", "expected_pool_version", "memo?"]
    output: DistributionRun
    side_effects:
      - "runs distribution_share_allocation and distribution_line_offsets, creating the run in status COMPUTED with one ACTIVE DistributionLine per eligible member"
      - "records computed_by_user_id from X-User-ID"
      - "supersedes any earlier COMPUTED run on the same pool and variant, setting that run to SUPERSEDED with superseded_by_run_id and voiding its lines"
      - "increments RevenuePool version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_REVENUE_POOL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_POOL_VERSION, ERR_POOL_STATE_INVALID, ERR_RESERVE_POSTURE_FROZEN, ERR_AUDITED_EXPENSE_MISSING, ERR_EMPTY_ALLOCATION_BASIS]

