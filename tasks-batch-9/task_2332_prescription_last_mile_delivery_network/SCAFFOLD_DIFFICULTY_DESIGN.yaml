# =============================================================================
# task_2332 — Prescription Last-Mile Delivery Network (ScriptDrop)
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids from §0.5 × 2+ instances each.
# Every numeric assert below was produced by executing the §1.3 formulas.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: delivery_fee_provisional_vs_final_diverges_after_reattempt
        grounds:
          - calculations.delivery_fee_subtotal
          - calculations.plan_grant_commitment_and_absorption
          - state_machines.Delivery.PROVISIONAL_to_FINALIZED
          - entities.FeeAllocation.fields.variant
          - entities.FeeAllocation.fields.cold_pack_line_cents
        distinguishing_aspect: |
          This dual variant lives in the money domain on Delivery/FeeAllocation: the PROVISIONAL
          variant prices exactly one door-step run (one cold-pack line, zero re-attempt line) while
          the FINAL variant prices two runs, so the same delivery yields fee_subtotal_cents 2626
          and then 3481 — a pinned 855-cent delta on the same row.
        test_recipe:
          setup:
            - "Commercial plan at 10% member cost share, grant pool 100000 cents with a 150-cent per-delivery cap."
            - "Cold-chain CII order out of a CII_V cold-certified pharmacy, delivered on the second door-step run inside a 14:00-16:00Z scheduled window."
            - "Clock advanced through pickup 13:50Z, first attempt (NO_ANSWER) 14:00Z, cooldown boundary 15:00Z, second attempt (DELIVERED) 15:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /plan-grants"
              payload: { health_plan_id: "${hp1_id}", benefit_year: 2026, grant_budget_cents: 100000, per_delivery_cap_cents: 150 }
              as: NetworkOps
              captures: { g1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { zone_code: "Z1", distance_band_miles: 6.4, base_fee_cents: 705, per_mile_cents: 123, cold_pack_fee_cents: 455, controlled_handling_fee_cents: 605, after_hours_fee_cents: 305, cold_chain_supported: true, controlled_delivery_allowed: true }
              as: NetworkOps
              captures: { z1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 2, cold_chain_required: true, controlled_schedule: "CII", total_rx_value_cents: 31000 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /pharmacy-orders/${o1_id}/mark-ready"
              payload: {}
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z", capacity_slots: 2 }
              as: NetworkOps
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /deliveries"
              payload: { order_id: "${o1_id}", window_id: "${w1_id}", expected_window_version: "${w1_v}" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /couriers"
              payload: { display_name: "Ray Ortiz", mode: "SCHEDULED", served_zone_codes: ["Z1"], cold_chain_equipped: true, controlled_certified: true }
              as: NetworkOps
              captures: { c1_id: $.data.id }
            - call: "POST /couriers/${c1_id}/status"
              payload: { target_status: "AVAILABLE" }
              as: Courier
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:45:00Z" }
              as: NetworkOps
            - call: "POST /deliveries/${d1_id}/dispatch"
              payload: {}
              as: NetworkOps
              captures: { asg1_id: $.data.id }
            - call: "POST /courier-assignments/${asg1_id}/accept"
              payload: {}
              as: Courier
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:50:00Z" }
              as: NetworkOps
            - call: "POST /deliveries/${d1_id}/pickup"
              payload: { cold_chain_seal_id: "SEAL-4471" }
              as: Courier
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T14:00:00Z" }
              as: NetworkOps
            - call: "POST /deliveries/${d1_id}/depart"
              payload: {}
              as: Courier
              as_user_id: "${c1_id}"
            - call: "POST /deliveries/${d1_id}/attempts"
              payload: { requested_outcome: "NO_ANSWER" }
              as: Courier
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T15:00:00Z" }
              as: NetworkOps
            - call: "POST /deliveries/${d1_id}/depart"
              payload: {}
              as: Courier
              as_user_id: "${c1_id}"
            - call: "POST /deliveries/${d1_id}/attempts"
              payload: { requested_outcome: "DELIVERED", id_verification_method: "GOVT_ID_SCAN", signature_captured: true, recipient_relationship: "SELF", pod_photo_ref: "POD-4471" }
              as: Courier
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /deliveries/${d1_id}/settle"
              payload: {}
              as: NetworkOps
          assert:
            - "GET /fee-allocations?delivery_id=${d1_id}&variant=PROVISIONAL returns total_count 1 with status SUPERSEDED"
            - "That PROVISIONAL FeeAllocation has base_line_cents 705, mileage_line_cents 861, cold_pack_line_cents 455, controlled_line_cents 605, after_hours_line_cents 0, reattempt_line_cents 0, fee_subtotal_cents 2626"
            - "That PROVISIONAL FeeAllocation has patient_gross_share_cents 264, plan_grant_cents 150, pharmacy_absorption_cents 50, patient_payable_cents 64, pharmacy_payable_cents 2412"
            - "GET /fee-allocations?delivery_id=${d1_id}&variant=FINAL returns total_count 1 with status ACTIVE"
            - "That FINAL FeeAllocation has base_line_cents 705, mileage_line_cents 861, cold_pack_line_cents 910, controlled_line_cents 605, after_hours_line_cents 0, reattempt_line_cents 400, fee_subtotal_cents 3481"
            - "That FINAL FeeAllocation has patient_gross_share_cents 349, plan_grant_cents 150, pharmacy_absorption_cents 50, patient_payable_cents 149, pharmacy_payable_cents 3182"
            - "Delivery.${d1_id}.fee_subtotal_cents == 3481 and Delivery.${d1_id}.settlement_status == FINALIZED and Delivery.${d1_id}.custody_status == DELIVERED"
            - "PlanGrant.${g1_id}.committed_cents == 0 and PlanGrant.${g1_id}.consumed_cents == 150 and PlanGrant.${g1_id}.remaining_cents == 99850"
            - "PharmacyOrder.${o1_id}.status == CLOSED"

      - name: courier_rolling_vs_lifetime_reliability_diverges
        grounds:
