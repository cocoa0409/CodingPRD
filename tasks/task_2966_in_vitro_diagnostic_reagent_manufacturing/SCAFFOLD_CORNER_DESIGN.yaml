  - section: cross_cutting_complexity_layers
    instances:

      - name: both_declared_occ_rules_reject_a_stale_parent_version_and_accept_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.component-add-stale-reagent-lot
          - concurrency_rules.design-record-add-stale-product-spec
          - errors.ERR_STALE_REAGENT_LOT_VERSION
          - errors.ERR_STALE_PRODUCT_SPEC_VERSION
        distinguishing_aspect: "Both §1.2.1 rules guard a parent that legitimately accumulates children, so NO state precondition blocks the second write and the version token is the only defence. The instance replays the exact same body twice — once with the version observed before the first child was filed (must be 412) and once with the version read back afterwards (must succeed) — and pins that the rejected write left no trace at all: the parent's version does not move and, for the component rule, the source MaterialLot's available_quantity_units is untouched."
        test_recipe:
          setup:
            - "Clock at 2026-08-18T00:00:00Z. Two critical MaterialSpecifications AB-OC-1 (ANTIBODY) and EZ-OC-1 (ENZYME), one QUALIFIED MaterialLot each with 1000.0 units booked in."
            - "ProductSpecification IVD-OC-1 requiring both material codes; no design records filed yet, so the specification sits at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-OC-1", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: true }
