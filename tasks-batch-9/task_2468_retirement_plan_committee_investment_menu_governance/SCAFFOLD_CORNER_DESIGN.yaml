      - name: unwind_inside_the_window_reverses_every_execute_side_effect_to_the_cent
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FundReplacementProposal
          - endpoints.POST_/governance/fund-replacements/{proposalId}/unwind
          - calculations.mapped_assets_transfer
        distinguishing_aspect: "The compensating unwind is asymmetric on purpose: assets, menu_status, credit_accrual_status, the slot pointer and fee_disclosure_status all roll back exactly, but the levelization run driven to RECALC_REQUIRED by hop 2 deliberately STAYS RECALC_REQUIRED. Verifying both halves in one call is what separates a real compensation from a naive undo."
        test_recipe:
          setup:
            - "chain_l5 is replayed in full, so the mapping is EXECUTED at clock 2026-09-02T00:00:00Z, still inside the window [2026-09-01, 2026-09-15)."
          setup_api_calls: *chain_l5
          trigger:
            - &b_prop_unwind
              call: "POST /governance/fund-replacements/${prop_lc_id}/unwind"
              payload: { reason: "Recordkeeper mapped the wrong share class; reversing inside the blackout window." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "the response status is 200"
            - "FundReplacementProposal.${prop_lc_id}.status == UNWOUND and mapped_assets_cents is still 800000000 (the snapshot is never cleared)"
            - "Fund.${fund_lc_a_id}.plan_assets_cents == 800000000, menu_status == ACTIVE and credit_accrual_status == ACCRUING"
            - "Fund.${fund_lc_b_id}.plan_assets_cents == 0 and menu_status == CANDIDATE"
            - "Plan.${plan_id}.total_plan_assets_cents == 1200000000, bit-identical to its pre-execute value"
            - "AssetClassSlot.${slot_lc_id}.current_fund_id == ${fund_lc_a_id} and status == ACTIVE"
            - "Plan.${plan_id}.fee_disclosure_status == COMPLIANT (no other EXECUTED proposal is inside a live window)"
            - "Plan.${plan_id}.occupied_menu_slots == 5, reserved_menu_slots == 0 and available_menu_slots == 1"

      - name: unwind_at_the_exclusive_window_end_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FundReplacementProposal
          - errors.ERR_UNWIND_WINDOW_CLOSED
        distinguishing_aspect: "The unwind right expires exactly at blackout_end_at, and the bound is strict: clock 2026-09-14T23:59:59Z still unwinds, clock 2026-09-15T00:00:00Z returns 409 ERR_UNWIND_WINDOW_CLOSED and the executed mapping becomes permanent with fee_disclosure_status stuck at RESTATEMENT_REQUIRED."
        test_recipe:
          setup:
            - "chain_l5 is replayed in full; the trigger then pushes the logical clock to the exclusive end of the blackout window before attempting the unwind."
          setup_api_calls: *chain_l5
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/unwind"
              payload: { reason: "Attempted reversal one instant after the blackout window closed." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "the response status is 409 with data.error_id == ERR_UNWIND_WINDOW_CLOSED"
            - "FundReplacementProposal.${prop_lc_id}.status is still EXECUTED"
            - "Fund.${fund_lc_a_id}.plan_assets_cents is still 0 with menu_status REMOVED, and Fund.${fund_lc_b_id}.plan_assets_cents is still 800000000"
            - "Plan.${plan_id}.fee_disclosure_status is still RESTATEMENT_REQUIRED"

      - name: an_unwound_proposal_accepts_no_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.FundReplacementProposal
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "UNWOUND is the only genuinely closed terminal on this machine — EXECUTED still accepts /unwind — so the lockdown test must be run from UNWOUND: re-executing, re-approving, re-noticing or re-submitting an UNWOUND proposal each return 409 ERR_INVALID_STATE_TRANSITION with no field mutation and no plan version bump."
        test_recipe:
          setup:
            - "chain_l5 is replayed in full and the trigger head replays the successful unwind, leaving the proposal in the UNWOUND terminal state at clock 2026-09-02T00:00:00Z."
          setup_api_calls: *chain_l5
          trigger:
            - *b_prop_unwind
            - call: "POST /governance/fund-replacements/${prop_lc_id}/execute"
              payload: {}
