  # ===========================================================================
  # §1.3 Calculations — input-set filtering, constants, deadline reminder
  # ===========================================================================
  - section: calculations
    instances:
      - name: deadline_reminder_due_at_lead_window_boundary
        claim_type: boundary_edge
        grounds:
          - calculations.deadline_reminder
          - entities.RenewalCycle.fields.reminder_status
        distinguishing_aspect: "With cycle_end 2028-01-01 and reminder_lead_days 60, the clock at 2027-11-02 (within 60 days of end) yields reminder_status DUE; before that it is NOT_DUE."
        test_recipe:
          setup: ["Board CA (reminder_lead_days 60, cycle_length 24mo). Licensee L cycle [2026-01-01, 2028-01-01). Clock advanced to 2027-11-02."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, reminder_lead_days: 60 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Remind", home_board_id: "${board_id}", license_number: "L-108" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-02T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "GET /renewal-cycles/${cycle_id}/reminder"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rs: $.data.reminder_status }
          assert:
            - "data.reminder_status == 'DUE' (2027-11-02 is within 60 days of 2028-01-01 cycle_end)"

      - name: deadline_reminder_overdue_after_cycle_end
        claim_type: boundary_edge
        grounds:
          - calculations.deadline_reminder
          - entities.RenewalCycle.fields.reminder_status
        distinguishing_aspect: "At/after cycle_end (clock 2028-01-01) reminder_status is OVERDUE (cycle_end boundary uses >=)."
        test_recipe:
          setup: ["Board CA, Licensee L cycle [2026-01-01, 2028-01-01). Clock advanced to 2028-01-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, reminder_lead_days: 60 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Over", home_board_id: "${board_id}", license_number: "L-109" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "GET /renewal-cycles/${cycle_id}/reminder"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { rs: $.data.reminder_status }
          assert:
            - "data.reminder_status == 'OVERDUE' (clock == cycle_end uses >=)"

      - name: cycle_end_computed_from_board_cycle_length
        claim_type: constants_applied
        grounds:
          - entities.RenewalCycle.fields.cycle_end
          - entities.LicenseBoard.fields.cycle_length_months
        distinguishing_aspect: "cycle_end == cycle_start + cycle_length_months; with start 2026-01-01 and 24 months, cycle_end == 2028-01-01."
        test_recipe:
          setup: ["Board CA (cycle_length 24mo)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L End", home_board_id: "${board_id}", license_number: "L-110" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { ce: $.data.cycle_end }
          assert:
            - "data.cycle_end == '2028-01-01T00:00:00.000Z'"

