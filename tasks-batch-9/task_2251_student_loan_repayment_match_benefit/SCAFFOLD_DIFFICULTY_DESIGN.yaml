              payload: {}
              as: ComplianceAuditor
              captures: { test_status_after: $.data.status }
          assert:
            - "test_status_before == PASSED"
            - "test_nhce_before == 0.0200"
            - "test_limit_before == 0.0400"
            - "fb_total_before == 0"
            - "py_funded_before == 0"
            - "alloc_amount == 20000  # cascade link 1: allocation created"
            - "alloc_fs == SCHEDULED"
            - "alloc_batch == ${fb1_id}"
            - "fb_total_after == 20000  # cascade link 2: batch total mutated by the allocation"
            - "fb_count_after == 1"
            - "fb_net_after == 20000"
            - "py_funded_after == 20000  # cascade link 3: plan-year funded total mutated by the batch total"
            - "py_accepted_after == 1"
            - "test_status_after == STALE  # cascade link 4: test invalidated by the changed plan-year funded total"

