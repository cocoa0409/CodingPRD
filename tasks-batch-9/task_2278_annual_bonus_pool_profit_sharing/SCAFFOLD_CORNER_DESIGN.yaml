  - section: consistency_model
    instances:
      - name: funding_derivations_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints."POST /bonus-plans/{planId}/fund-pool"
          - calculations.pool_funding_split
          - entities.BonusPlan.fields.funded_pool_cents
          - entities.BusinessUnitPool.fields.min_utilization_cents
        distinguishing_aspect: |
          The consistency model is immediate, so the funding vote's own 200 body
          must already carry every derived figure the vote produces — blended
          achievement, multiplier, funded pool, discretionary reserve and the new
          plan phase — with no re-read required. The follow-up GETs are the control:
          they return byte-identical values, and the cascaded pool row is equally
          current in the same request, so no denormalized field is allowed to lag.
        test_recipe:
          setup:
            - "Plan CERTIFIED with one L5 participant (total target 4,000,000), company achievement 100.00, BU scorecard 100.00; the pool is SCORECARD_CERTIFIED and unfunded."
