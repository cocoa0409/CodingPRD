              as: Carrier
              as_user_id: "carrier-op-11"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-11"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-11"
            - call: "POST /shipments/${ship_id}/stops/${stop_id}/arrive"
              payload: { arrived_min: 600 }
              as: Driver
              as_user_id: "driver-op-11"
          trigger:
            - call: "POST /shipments/${ship_id}/stops/${stop_id}/close"
              payload: { departed_min: 720, pallets_handled: 0, compartments_touched: 1 }
              as: Driver
              as_user_id: "driver-op-11"
              captures: { fee: $.data.detention_fee_cents }
          assert:
            - "StopEvent.${stop_id}.detention_fee_cents == 0 (dwell 120 == FREE_TIME_MIN, no detention)"
            - "A sibling stop with departed_min 721 (dwell 121) would instead bill 5000 — the boundary is exact."

      - name: impairment_tolerance_boundary_30_degree_minutes_empty_excursion
        grounds:
          - calculations.compartment_impairment
          - calculations.degree_minutes_out_of_range
          - entities.Compartment.fields.impairment
        distinguishing_aspect: "Different metric (degree-minutes classification) on a different endpoint (POST /shipments/{id}/deliver -> Compartment): FINAL degree_minutes exactly 30 (== tolerance) classifies NONE, and a compartment with zero TEMP readings (empty excursion set) also classifies NONE with degree_minutes 0 — an empty-set + threshold edge distinct from the detention numeric boundary."
