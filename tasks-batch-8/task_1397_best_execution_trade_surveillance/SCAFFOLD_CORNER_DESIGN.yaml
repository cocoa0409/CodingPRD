          setup_api_calls: []
          trigger:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: OpsAdmin, captures: { now1: "$.data.current_utc" } }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${now1} == 2026-08-02T00:00:00Z (default was 2026-08-01T00:00:00Z before any set)"
            - "${err} == ERR_CLOCK_REGRESSION (monotonic guard)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: request_missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role header at all -> 401 ERR_UNAUTHENTICATED before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /surveillance/venues/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED (no as: header sent)"
      - name: order_execute_with_future_timestamp_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_EXECUTION_WINDOW_VIOLATION]"]
        distinguishing_aspect: "Order executions may not be dated after the logical clock (no future fills)."
        test_recipe:
          setup: ["Venue + ACTIVE arrangement + ROUTED order at clock 2026-08-10T14:00:00Z"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "FU1", symbol: "ACME", side: "BUY", quantity: 10, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
          trigger:
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-10T15:00:00Z" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_EXECUTION_WINDOW_VIOLATION (executed_at 15:00 > now 14:00)"
      - name: venue_suspended_blocks_arrangement_activation
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_VENUE_SUSPENDED]"]
        distinguishing_aspect: "The venue safety gate also blocks arrangement activation (not just routing)."
        test_recipe:
          setup: ["Venue SUSPENDED; arrangement NEGOTIATION"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/venues/${v_id}/transition", payload: { to_status: "SUSPENDED" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_VENUE_SUSPENDED"
      - name: open_case_blocks_new_preclearance
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_OPEN_SURVEILLANCE_CASE]"]
        distinguishing_aspect: "An employee with a case in OPEN/UNDER_INVESTIGATION/REOPENED cannot receive new preclearance until the case is dispositioned."
        test_recipe:
          setup: ["Employee with an OPEN case (auto-created by a >= 100 lexicon comm item); a fresh trade PRECLEARANCE_REQUESTED"]
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Case Blocked", employee_ref: "EMP-180", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/lexicon-policies", payload: { name: "LX", terms: [ { term: "guarantee", weight: 100 } ] }, as: ComplianceAdmin, captures: { l_id: "$.data.id", l_v1: "$.data.version" } }
            - { call: "PATCH /surveillance/lexicon-policies/${l_id}", payload: { expected_lexicon_policy_version: "${l_v1}", to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/comm-review-items", payload: { channel: "CHAT", author_employee_id: "${e_id}", body_text: "guarantee" }, as: OpsAdmin }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 10 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /surveillance/employees/${e_id}", payload: {}, as: ComplianceAdmin, captures: { occ: "$.data.open_case_count" } }
          assert:
            - "${err} == ERR_OPEN_SURVEILLANCE_CASE and ${occ} == 1 (comm auto-escalation opened the case)"
      - name: training_overdue_blocks_preclearance_until_completed
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_TRAINING_OVERDUE]"]
        distinguishing_aspect: "The training gate is derived-state driven: overdue count rises via ops run and blocks approval; completing the OVERDUE assignment clears the gate."
        test_recipe:
          setup: ["Employee ACTIVE/CURRENT with an ASSIGNED training due 2026-08-31; clock advanced to 2026-09-01 and ops run has flipped it OVERDUE; fresh trade requested"]
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Train Late", employee_ref: "EMP-190", department: "TRADING", attestation_due_at: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/compliance-policies", payload: { policy_code: "PAT", title: "Personal Account Trading", version_label: "v2026.1" }, as: ComplianceAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /surveillance/compliance-policies/${p_id}/publish", payload: {}, as: ComplianceAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/ops/runs", payload: {}, as: OpsAdmin, captures: { n_od: "$.data.training_marked_overdue" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 10 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_id: "$.data.id" } }
            - { call: "GET /surveillance/training-assignments", payload: { employee_id: "${e_id}" }, as: ComplianceAdmin, captures: { a_id: "$.data[0].id", a_status: "$.data[0].status" } }
          trigger:
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /surveillance/training-assignments/${a_id}/complete", payload: {}, as: CoveredEmployee, as_user_id: "${e_id}" }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { t_status: "$.data.status" } }
          assert:
            - "Ops run flipped the assignment: ${n_od} == 1 and ${a_status} == OVERDUE (due 2026-08-31T00:00:00Z < clock 2026-09-01)"
            - "Blocked while overdue: ${err} == ERR_TRAINING_OVERDUE"
            - "OVERDUE -> COMPLETED clears the gate: ${t_status} == APPROVED"

