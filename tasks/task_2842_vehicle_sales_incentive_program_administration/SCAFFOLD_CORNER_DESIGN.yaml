      - name: an_unvalidated_claim_cannot_be_scheduled_into_a_batch
        claim_type: guarded_transitions
        grounds:
          - state_machines.Claim.payment_UNPAID_to_SCHEDULED.preconditions
          - errors.ERR_CLAIM_NOT_VALIDATED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The only coupling between the Claim's two parallel dimensions is a guard, and this is it: a SUBMITTED claim is refused with ERR_CLAIM_NOT_VALIDATED, the same claim succeeds after adjudication with nothing else changed, and a REJECTED claim is refused forever."
        test_recipe:
          setup:
            - "One ACTIVE program, one dealer, two validated deliveries and two SUBMITTED claims; claim A will be approved, claim B will be rejected."
            - "One OPEN batch in the dealer's region covering both sale_dates."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "CRN-D-GRD", name: "Guarded Motors", region_code: "EAST", historical_volume_units: 4, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-SM-GRD", name: "Guarded Cash", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 12000000, stack_group: "CRNGRD", priority_rank: 316, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
