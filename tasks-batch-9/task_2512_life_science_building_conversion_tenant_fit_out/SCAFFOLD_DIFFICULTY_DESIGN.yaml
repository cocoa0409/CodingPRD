scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 - dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assessment_screening_vs_investigation_divergence
        grounds:
          - calculations.suitability_score
          - entities.SuitabilityAssessment.fields.assessment_basis
          - entities.SuitabilityAssessment.fields.hard_fail_capped
          - state_machines.SuitabilityAssessment.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Two SuitabilityAssessment rows carrying byte-identical measurement inputs on the same
          Building diverge solely because assessment_basis differs: SCREENING substitutes the
          building's published nameplate values for the two null measurements and scores 78.0 /
          SUITABLE, while INVESTIGATION scores those same nulls as credit 0 and lands on 33.0 /
          UNSUITABLE - a 45.0-point delta and two different verdict enums from one input set.
        test_recipe:
          setup:
            - "Building 'Kendall Labs 400' exists with published 14.0 ft / 95 psf / VC_C, 60000 CFM riser and 800 kW emergency power, suitability_state = ASSESSING"
            - "Assessment A1 (SCREENING) has been submitted and ACCEPTED, leaving the building in ASSESSED_SUITABLE"
            - "Assessment A2 (INVESTIGATION) exists in DRAFT with exactly the same measurement inputs as A1"
            - "Logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /buildings"
              payload: { name: "Kendall Labs 400", address_city: "Cambridge", occupancy_status: "PARTIALLY_OCCUPIED", published_floor_to_floor_ft: 14.0, published_live_load_psf: 95, published_vibration_class: "VC_C", exhaust_riser_capacity_cfm: 60000, emergency_power_capacity_kw: 800, chilled_water_capacity_tons: 1200 }
              as: LandlordAssetManager
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/suitability-assessments"
              payload: { assessment_basis: "SCREENING", required_vibration_class: "VC_C", required_exhaust_cfm: 50000, required_power_kw: 700, measured_live_load_psf: 88 }
              as: BaseBuildingEngineer
              captures: { a1_id: $.data.id }
            - call: "POST /suitability-assessments/${a1_id}/submit"
              payload: {}
              as: BaseBuildingEngineer
            - call: "POST /suitability-assessments/${a1_id}/decision"
              payload: { decision: "ACCEPT" }
              as: LandlordAssetManager
            - call: "POST /buildings/${b_id}/suitability-assessments"
              payload: { assessment_basis: "INVESTIGATION", required_vibration_class: "VC_C", required_exhaust_cfm: 50000, required_power_kw: 700, measured_live_load_psf: 88 }
              as: BaseBuildingEngineer
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /suitability-assessments/${a2_id}/submit"
              payload: {}
              as: BaseBuildingEngineer
              captures: { a2_score: $.data.suitability_score, a2_verdict: $.data.verdict }
          assert:
            - "SuitabilityAssessment.${a1_id}.suitability_score == 78.0"
            - "SuitabilityAssessment.${a1_id}.verdict == SUITABLE"
            - "SuitabilityAssessment.${a1_id}.height_credit == 100"
            - "SuitabilityAssessment.${a1_id}.vibration_credit == 100"
            - "SuitabilityAssessment.${a1_id}.hard_fail_capped == false"
            - "SuitabilityAssessment.${a2_id}.suitability_score == 33.0"
            - "SuitabilityAssessment.${a2_id}.verdict == UNSUITABLE"
            - "SuitabilityAssessment.${a2_id}.height_credit == 0"
            - "SuitabilityAssessment.${a2_id}.vibration_credit == 0"
            - "SuitabilityAssessment.${a2_id}.hard_fail_capped == false"
            - "SuitabilityAssessment.${a1_id}.structural_credit == SuitabilityAssessment.${a2_id}.structural_credit == 60"
            - "SuitabilityAssessment.${a1_id}.utility_headroom_ratio == SuitabilityAssessment.${a2_id}.utility_headroom_ratio == 1.1429"
            - "Building.${b_id}.suitability_state == ASSESSING"
            - "Building.${b_id}.latest_assessment_verdict == SUITABLE"

      - name: hazmat_per_control_area_vs_aggregate_floor_basis
        grounds:
          - calculations.floor_hazmat_utilization
          - calculations.floor_control_area_allowance
          - entities.HazmatUsePermit.fields.control_area_index
          - endpoints["GET /floors/{floorId}/hazmat-utilization"]
        distinguishing_aspect: |
          One floor and one hazard class produce two different utilization numbers in the same
          response: the PER_CONTROL_AREA basis counts the REQUESTED 20.00 gal application and
          divides by the 180.00 gal single-control-area allowance (94.44 %), while the
          AGGREGATE_FLOOR basis ignores REQUESTED rows and divides by the 540.00 gal three-control-area
          allowance (27.78 %) - different status filter AND different denominator.
        test_recipe:
          setup:
            - "Building conversion-approved with LAB_EXHAUST scope COMPLETE; sprinklered floor 2 (3 control areas, 180.00 gal FLAMMABLE_IB closed-system allowance per control area)"
            - "Lease L executed for an ANALYTICAL_QC tenant on floor 2; fit-out project PR has permit_status = P_ISSUED"
            - "Permit H1 for 150.00 gal FLAMMABLE_IB CLOSED_SYSTEM_USE in control area 1 is APPROVED"
            - "Permit H2 for 20.00 gal FLAMMABLE_IB CLOSED_SYSTEM_USE in control area 1 is still REQUESTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /buildings"
              payload: { name: "Kendall Labs 400", address_city: "Cambridge", occupancy_status: "PARTIALLY_OCCUPIED", published_floor_to_floor_ft: 14.0, published_live_load_psf: 95, published_vibration_class: "VC_C", exhaust_riser_capacity_cfm: 60000, emergency_power_capacity_kw: 800, chilled_water_capacity_tons: 1200 }
              as: LandlordAssetManager
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/floors"
              payload: { floor_number: 2, floor_to_floor_ft: 14.0, live_load_psf: 95, vibration_class: "VC_C", sprinklered: true }
              as: BaseBuildingEngineer
              captures: { f2_id: $.data.id }
            - call: "POST /buildings/${b_id}/suitability-assessments"
              payload: { assessment_basis: "SCREENING", required_vibration_class: "VC_C", required_exhaust_cfm: 50000, required_power_kw: 700, measured_live_load_psf: 88 }
              as: BaseBuildingEngineer
              captures: { a1_id: $.data.id }
            - call: "POST /suitability-assessments/${a1_id}/submit"
              payload: {}
              as: BaseBuildingEngineer
            - call: "POST /suitability-assessments/${a1_id}/decision"
              payload: { decision: "ACCEPT" }
              as: LandlordAssetManager
            - call: "POST /buildings/${b_id}/conversion-scope-items"
              payload: { discipline: "LAB_EXHAUST", description: "New 20000 CFM lab exhaust riser and manifold", budget_usd: 4200000.00, capacity_delta_cfm: 20000, capacity_delta_kw: 0 }
              as: LandlordAssetManager
              captures: { sc_ex_id: $.data.id }
            - call: "POST /buildings/${b_id}/conversion-approval"
              payload: {}
              as: LandlordAssetManager
            - call: "POST /conversion-scope-items/${sc_ex_id}/complete"
              payload: {}
              as: BaseBuildingEngineer
            - call: "POST /tenants"
              payload: { legal_name: "Assay Metrics QC Inc", research_type: "ANALYTICAL_QC", credit_tier: "VENTURE_BACKED" }
              as: LandlordAssetManager
              captures: { t_id: $.data.id }
            - call: "POST /leases"
              payload: { tenant_id: "${t_id}", building_id: "${b_id}", premises_floor_id: "${f2_id}", rentable_sf: 2000, term_months: 120, base_rent_psf: 95.00, delivery_deadline: "2026-12-31T00:00:00Z" }
              as: LandlordAssetManager
              captures: { l_id: $.data.id, l_v1: $.data.version }
            - call: "POST /leases/${l_id}/ti-proposals"
              payload: { expected_lease_version: "${l_v1}", proposed_allowance_psf: 70.00 }
              as: LandlordAssetManager
              as_user_id: "u_landlord_negotiator"
              captures: { p1_id: $.data.id }
            - call: "POST /ti-proposals/${p1_id}/accept"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
              captures: { escrow_req: $.data.restoration_escrow_required_usd }
            - call: "POST /leases/${l_id}/escrow-deposits"
              payload: { amount_usd: 20000.00 }
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /leases/${l_id}/execute"
              payload: {}
              as: LandlordAssetManager
              as_user_id: "u_landlord_signer"
            - call: "POST /fit-out-projects"
              payload: { lease_id: "${l_id}", floor_id: "${f2_id}", design_exhaust_cfm: 12000, design_power_kw: 180, scope_summary: "QC lab fit-out, floor 2" }
              as: LandlordAssetManager
              captures: { pr_id: $.data.id }
            - call: "POST /fit-out-projects/${pr_id}/permit-application"
              payload: {}
              as: LandlordAssetManager
            - call: "POST /fit-out-projects/${pr_id}/permit-decision"
              payload: { decision: "ISSUE" }
              as: AHJPermitOfficer
            - call: "POST /hazmat-permits"
              payload: { project_id: "${pr_id}", floor_id: "${f2_id}", hazard_class: "FLAMMABLE_IB", use_condition: "CLOSED_SYSTEM_USE", quantity_gal: 150.00, control_area_index: 1 }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hazmat-permits/${h1_id}/decision"
              payload: { decision: "APPROVE" }
              as: AHJPermitOfficer
            - call: "POST /hazmat-permits"
              payload: { project_id: "${pr_id}", floor_id: "${f2_id}", hazard_class: "FLAMMABLE_IB", use_condition: "CLOSED_SYSTEM_USE", quantity_gal: 20.00, control_area_index: 1 }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { h2_id: $.data.id }
          trigger:
            - call: "GET /floors/${f2_id}/hazmat-utilization"
              payload: { hazard_class: "FLAMMABLE_IB", control_area_index: 1 }
              as: AHJPermitOfficer
              captures: { pca_basis: $.data.per_control_area_basis_gal, agg_basis: $.data.aggregate_basis_gal }
          assert:
            - "response.data.control_areas_allowed == 3"
            - "response.data.allowance_per_control_area_gal == 180.00"
            - "response.data.aggregate_allowance_gal == 540.00"
            - "response.data.per_control_area_basis_gal == 170.00"
            - "response.data.aggregate_basis_gal == 150.00"
            - "response.data.per_control_area_utilization_pct == 94.44"
            - "response.data.aggregate_utilization_pct == 27.78"
            - "HazmatUsePermit.${h2_id}.status == REQUESTED"
            - "HazmatUsePermit.${h1_id}.status == APPROVED"

  # ===========================================================================
  # RULE 2 - combinatorial_formula  (instance 1 = mode b, instance 2 = mode c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ti_draw_per_line_rounding_then_residual_to_largest_committed
        mode: b
        grounds:
          - calculations.ti_draw_allocation
          - calculations.phase_ti_commitment
          - entities.PhasePackage.fields.ti_disbursed_usd
          - entities.Lease.fields.last_disbursement_usd
        distinguishing_aspect: |
          Mode (b) order-of-operations: the 150,000.00 draw is split pro-rata, each line is
          round_half_up-ed FIRST (100,769.86 + 17,616.06 + 31,614.07 = 149,999.99) and the signed
          0.01 residual is then handed to the phase with the largest ti_committed_usd, so PH_A ends
          at 100,769.87; rounding only the final total, or giving the residual to the last line
          (PH_C 31,614.08), both produce a different observable per-phase ledger.
        test_recipe:
          setup:
            - "Lease L4 (BSL2_BIOLOGY tenant, floor 2, 4000 rsf, accepted allowance 80.00 psf) is EXECUTED with ti_authorized_usd = 500000.00"
            - "Project PR is P_ISSUED; phases PH_A (VIVARIUM, hard 100000.00), PH_B (LAB_MEP, hard 20000.00), PH_C (SHELL, hard 60000.00) are COMPLETE in that chronological order"
            - "Lease ledger before the draw: uncommitted 329190.00, committed 170810.00, disbursed 0.00, forfeited 0.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /buildings"
              payload: { name: "Kendall Labs 400", address_city: "Cambridge", occupancy_status: "PARTIALLY_OCCUPIED", published_floor_to_floor_ft: 14.0, published_live_load_psf: 95, published_vibration_class: "VC_C", exhaust_riser_capacity_cfm: 60000, emergency_power_capacity_kw: 800, chilled_water_capacity_tons: 1200 }
              as: LandlordAssetManager
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/floors"
              payload: { floor_number: 2, floor_to_floor_ft: 14.0, live_load_psf: 95, vibration_class: "VC_C", sprinklered: true }
              as: BaseBuildingEngineer
              captures: { f2_id: $.data.id }
            - call: "POST /buildings/${b_id}/suitability-assessments"
              payload: { assessment_basis: "SCREENING", required_vibration_class: "VC_C", required_exhaust_cfm: 50000, required_power_kw: 700, measured_live_load_psf: 88 }
              as: BaseBuildingEngineer
              captures: { a1_id: $.data.id }
            - call: "POST /suitability-assessments/${a1_id}/submit"
              payload: {}
              as: BaseBuildingEngineer
            - call: "POST /suitability-assessments/${a1_id}/decision"
              payload: { decision: "ACCEPT" }
              as: LandlordAssetManager
            - call: "POST /buildings/${b_id}/conversion-scope-items"
              payload: { discipline: "LAB_EXHAUST", description: "New 20000 CFM lab exhaust riser and manifold", budget_usd: 4200000.00, capacity_delta_cfm: 20000, capacity_delta_kw: 0 }
              as: LandlordAssetManager
              captures: { sc_ex_id: $.data.id }
            - call: "POST /buildings/${b_id}/conversion-approval"
              payload: {}
              as: LandlordAssetManager
            - call: "POST /conversion-scope-items/${sc_ex_id}/complete"
              payload: {}
              as: BaseBuildingEngineer
            - call: "POST /tenants"
              payload: { legal_name: "Helix Bio Labs", research_type: "BSL2_BIOLOGY", credit_tier: "VENTURE_BACKED" }
              as: LandlordAssetManager
              captures: { t_id: $.data.id }
            - call: "POST /leases"
              payload: { tenant_id: "${t_id}", building_id: "${b_id}", premises_floor_id: "${f2_id}", rentable_sf: 4000, term_months: 120, base_rent_psf: 105.00, delivery_deadline: "2026-12-31T00:00:00Z" }
              as: LandlordAssetManager
              captures: { l_id: $.data.id, l_v1: $.data.version }
            - call: "POST /leases/${l_id}/ti-proposals"
              payload: { expected_lease_version: "${l_v1}", proposed_allowance_psf: 80.00 }
              as: LandlordAssetManager
              as_user_id: "u_landlord_negotiator"
              captures: { p1_id: $.data.id }
            - call: "POST /ti-proposals/${p1_id}/accept"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
              captures: { ti_auth: $.data.ti_authorized_usd }
            - call: "POST /leases/${l_id}/escrow-deposits"
              payload: { amount_usd: 50000.00 }
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /leases/${l_id}/execute"
              payload: {}
              as: LandlordAssetManager
              as_user_id: "u_landlord_signer"
            - call: "POST /fit-out-projects"
              payload: { lease_id: "${l_id}", floor_id: "${f2_id}", design_exhaust_cfm: 15000, design_power_kw: 220, scope_summary: "BSL2 biology fit-out, floor 2" }
              as: LandlordAssetManager
              captures: { pr_id: $.data.id }
            - call: "POST /fit-out-projects/${pr_id}/permit-application"
              payload: {}
              as: LandlordAssetManager
            - call: "POST /fit-out-projects/${pr_id}/permit-decision"
              payload: { decision: "ISSUE" }
              as: AHJPermitOfficer
            - call: "POST /fit-out-projects/${pr_id}/phase-packages"
              payload: { sequence_no: 1, premium_class: "VIVARIUM", work_class: "QUIET", hard_cost_usd: 100000.00, restoration_cost_usd: 420000.00 }
              as: LandlordAssetManager
              captures: { ph_a_id: $.data.id }
            - call: "POST /fit-out-projects/${pr_id}/phase-packages"
              payload: { sequence_no: 2, premium_class: "LAB_MEP", work_class: "QUIET", hard_cost_usd: 20000.00, restoration_cost_usd: 180000.00, predecessor_phase_id: "${ph_a_id}" }
              as: LandlordAssetManager
              captures: { ph_b_id: $.data.id }
            - call: "POST /fit-out-projects/${pr_id}/phase-packages"
              payload: { sequence_no: 3, premium_class: "SHELL", work_class: "QUIET", hard_cost_usd: 60000.00, restoration_cost_usd: 90000.00, predecessor_phase_id: "${ph_b_id}" }
              as: LandlordAssetManager
              captures: { ph_c_id: $.data.id }
            - call: "POST /phase-packages/${ph_a_id}/schedule"
              payload: { window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /phase-packages/${ph_a_id}/progress"
              payload: { target_status: "IN_PROGRESS" }
              as: LandlordAssetManager
            - call: "POST /phase-packages/${ph_a_id}/progress"
              payload: { target_status: "COMPLETE" }
              as: LandlordAssetManager
            - call: "POST /phase-packages/${ph_b_id}/schedule"
              payload: { window_start: "2026-08-12T00:00:00Z", window_end: "2026-08-15T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /phase-packages/${ph_b_id}/progress"
              payload: { target_status: "IN_PROGRESS" }
              as: LandlordAssetManager
            - call: "POST /phase-packages/${ph_b_id}/progress"
              payload: { target_status: "COMPLETE" }
              as: LandlordAssetManager
            - call: "POST /phase-packages/${ph_c_id}/schedule"
              payload: { window_start: "2026-08-17T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /phase-packages/${ph_c_id}/progress"
              payload: { target_status: "IN_PROGRESS" }
              as: LandlordAssetManager
            - call: "POST /phase-packages/${ph_c_id}/progress"
              payload: { target_status: "COMPLETE" }
              as: LandlordAssetManager
          trigger:
            - call: "POST /leases/${l_id}/ti-disbursements"
              payload: { requested_usd: 400000.00 }
              as: LandlordAssetManager
              captures: { disbursed: $.data.ti_disbursed_usd }
          assert:
            - "Lease.${l_id}.ti_authorized_usd == 500000.00"
            - "Lease.${l_id}.ti_disbursed_usd == 150000.00"
            - "Lease.${l_id}.ti_committed_usd == 20810.00"
            - "Lease.${l_id}.ti_uncommitted_usd == 329190.00"
            - "Lease.${l_id}.ti_forfeited_usd == 0.00"
            - "Lease.${l_id}.last_disbursement_usd == 150000.00"
            - "PhasePackage.${ph_a_id}.ti_eligible_usd == 114750.00"
            - "PhasePackage.${ph_b_id}.ti_eligible_usd == 20060.00"
            - "PhasePackage.${ph_c_id}.ti_eligible_usd == 36000.00"
            - "PhasePackage.${ph_a_id}.ti_disbursed_usd == 100769.87"
            - "PhasePackage.${ph_b_id}.ti_disbursed_usd == 17616.06"
            - "PhasePackage.${ph_c_id}.ti_disbursed_usd == 31614.07"
            - "PhasePackage.${ph_a_id}.ti_disbursed_usd + PhasePackage.${ph_b_id}.ti_disbursed_usd + PhasePackage.${ph_c_id}.ti_disbursed_usd == 150000.00"
            - "Lease.${l_id}.ti_uncommitted_usd + Lease.${l_id}.ti_committed_usd + Lease.${l_id}.ti_disbursed_usd + Lease.${l_id}.ti_forfeited_usd == 500000.00"

      - name: ti_allowance_tier_selected_on_provisional_not_final_authorization
        mode: c
        grounds:
          - calculations.ti_final_allowance
          - entities.Lease.fields.provisional_authorized_ti_usd
          - entities.Lease.fields.volume_credit_psf
          - state_machines.Lease.NEGOTIATING_to_TERMS_ACCEPTED
        distinguishing_aspect: |
          Mode (c) circular-looking definition with a pinned resolution order: the volume credit is
          selected from the PRE-credit provisional authorization 5,021,500.00 (>= 5,000,000 tier ->
          3.00 psf), never re-selected from the post-credit 4,948,900.00; re-selecting after
          subtracting the credit would drop to the 1.50 tier and yield 206.00 psf / 4,985,200.00, so
          final_allowance_psf == 204.50 falsifies the circular reading in a single field.
        test_recipe:
          setup:
            - "Building conversion-approved with a floor 5 plate; CHEMISTRY_SYNTHESIS tenant"
            - "Lease L1 for 24200 rsf on floor 5, status NEGOTIATING with an OPEN landlord proposal at 140.00 psf"
            - "Logical clock at 2026-08-01T00:00:00Z (well inside the 10-day proposal TTL)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /buildings"
              payload: { name: "Kendall Labs 400", address_city: "Cambridge", occupancy_status: "PARTIALLY_OCCUPIED", published_floor_to_floor_ft: 14.0, published_live_load_psf: 95, published_vibration_class: "VC_C", exhaust_riser_capacity_cfm: 60000, emergency_power_capacity_kw: 800, chilled_water_capacity_tons: 1200 }
              as: LandlordAssetManager
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/floors"
              payload: { floor_number: 5, floor_to_floor_ft: 14.0, live_load_psf: 95, vibration_class: "VC_C", sprinklered: true }
              as: BaseBuildingEngineer
              captures: { f5_id: $.data.id }
            - call: "POST /buildings/${b_id}/suitability-assessments"
              payload: { assessment_basis: "SCREENING", required_vibration_class: "VC_C", required_exhaust_cfm: 50000, required_power_kw: 700, measured_live_load_psf: 88 }
              as: BaseBuildingEngineer
              captures: { a1_id: $.data.id }
            - call: "POST /suitability-assessments/${a1_id}/submit"
              payload: {}
              as: BaseBuildingEngineer
            - call: "POST /suitability-assessments/${a1_id}/decision"
              payload: { decision: "ACCEPT" }
              as: LandlordAssetManager
            - call: "POST /buildings/${b_id}/conversion-scope-items"
              payload: { discipline: "LAB_EXHAUST", description: "New 20000 CFM lab exhaust riser and manifold", budget_usd: 4200000.00, capacity_delta_cfm: 20000, capacity_delta_kw: 0 }
              as: LandlordAssetManager
              captures: { sc_ex_id: $.data.id }
            - call: "POST /buildings/${b_id}/conversion-approval"
              payload: {}
              as: LandlordAssetManager
            - call: "POST /tenants"
              payload: { legal_name: "Meridian Synthesis Corp", research_type: "CHEMISTRY_SYNTHESIS", credit_tier: "INVESTMENT_GRADE" }
              as: LandlordAssetManager
              captures: { t_id: $.data.id }
            - call: "POST /leases"
