  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: enrollment_coverage_and_billing_dimensions_move_independently
        grounds:
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - state_machines.Enrollment.ACTIVE_to_SUSPENDED
          - state_machines.Enrollment.SUSPENDED_to_ACTIVE
          - entities.Enrollment.fields.coverage_status
          - entities.Enrollment.fields.billing_status
          - entities.Enrollment.fields.consecutive_unpaid_periods
          - calculations.delinquency_progression
        distinguishing_aspect: |
          Enrollment carries two orthogonal state dimensions, and the same
          entity visits three distinct combined states without any linear
          ordering between them: (PENDING, CURRENT) at creation, (ACTIVE,
          CURRENT) after activation - coverage advanced while billing did not
          move at all - then (SUSPENDED, DELINQUENT) after the past-due sweep
          and back to (ACTIVE, CURRENT) after payment, so coverage_status
          returns to a state it already left while billing_status does too.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-20T00:00:00Z."
            - "PlanYear 2027 in status OPEN with premium_grace_period_days 31."
            - "PlanOption PRE65-CORE ACTIVE with monthly_premium_cents 74500."
            - "Retiree R1 holds a CERTIFIED, ELIGIBLE determination and a PENDING Enrollment on PRE65-CORE with coverage_effective_date 2027-01-01T00:00:00Z and billing_status CURRENT."
            - "One PremiumInvoice for billing period 2027-01-01 to 2027-01-31 with net_due_cents 15422 and past_due_at 2027-03-03T00:00:00.000Z."
            - "A first daily run at 2027-01-01T00:00:00Z has already moved the enrollment to coverage_status ACTIVE while leaving billing_status CURRENT."
            - "Logical clock then advanced to 2027-03-05T00:00:00Z, which is after past_due_at."
