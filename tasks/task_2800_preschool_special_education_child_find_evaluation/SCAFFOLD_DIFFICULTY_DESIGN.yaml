  - rule_id: cross_entity_state_dependency
    instances:

      - name: case_creation_reads_the_referral_consent_dimension_not_its_intake_dimension
        grounds:
          - validations[priority=13]
          - validations[priority=11]
          - errors.ERR_CONSENT_NOT_GRANTED
          - errors.ERR_INVALID_REFERRAL_STATE
          - state_machines.Referral.consent_status
        distinguishing_aspect: |
          Creating an EvaluationCase is legal only when the PARENT Referral's
          consent dimension reads GRANTED, and the two Referral dimensions are
          reported by different errors: consent_status REQUESTED yields
          ERR_CONSENT_NOT_GRANTED even though the intake dimension is at its
          normal CONSENT_PENDING value, while consent_status GRANTED with
          intake_status SUPERSEDED yields ERR_INVALID_REFERRAL_STATE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Child C1 (born 2023-08-01) has referral R1 with a PENDING evaluation consent request, so intake_status CONSENT_PENDING and consent_status REQUESTED."
            - "Child C2 (born 2023-08-01) has referral R2 whose consent was GRANTED, so intake_status EVALUATION_AUTHORIZED and consent_status GRANTED."
            - "One SCHOOL_PSYCHOLOGIST provider is available to chair."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/providers"
              payload: { full_name: "Dana Chair", discipline: "SCHOOL_PSYCHOLOGIST", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { chair_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Cara", last_name: "One", date_of_birth: "2023-08-01", guardian_full_name: "Pat One", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child1_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Cody", last_name: "Two", date_of_birth: "2023-08-01", guardian_full_name: "Pat Two", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child2_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child1_id}", source: "PEDIATRICIAN", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referral1_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referral1_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
              captures: { consent1_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child2_id}", source: "PEDIATRICIAN", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referral2_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referral2_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
              captures: { consent2_id: "$.data.id" }
            - call: "POST /child-find/consent-records/${consent2_id}/decision"
              payload: { decision: "GRANTED" }
              as: Parent
              as_user_id: "${child2_id}"
          trigger:
            - call: "POST /child-find/referrals/${referral1_id}/evaluation-cases"
              payload: { chair_provider_id: "${chair_id}", assessment_protocol: "STANDARDIZED" }
              as: ChildFindCoordinator
            - call: "POST /child-find/referrals/${referral2_id}/evaluation-cases"
              payload: { chair_provider_id: "${chair_id}", assessment_protocol: "STANDARDIZED" }
              as: ChildFindCoordinator
              captures: { case2_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child2_id}", source: "PARENT", referring_provider_npi: null }
              as: ChildFindCoordinator
              captures: { referral3_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referral2_id}/evaluation-cases"
              payload: { chair_provider_id: "${chair_id}", assessment_protocol: "STANDARDIZED" }
              as: ChildFindCoordinator
          assert:
            - "first response.status_code == 409"
            - "first response.data.error_id == \"ERR_CONSENT_NOT_GRANTED\""
            - "Referral.${referral1_id}.intake_status == \"CONSENT_PENDING\""
            - "Referral.${referral1_id}.consent_status == \"REQUESTED\""
            - "GET /child-find/evaluation-cases?referral_id=${referral1_id} returns total_count == 0"
            - "second response.status_code == 201"
            - "EvaluationCase.${case2_id}.status == \"PLANNED\""
            - "fourth response.status_code == 409"
            - "fourth response.data.error_id == \"ERR_INVALID_REFERRAL_STATE\""
            - "Referral.${referral2_id}.intake_status == \"SUPERSEDED\""
            - "Referral.${referral2_id}.consent_status == \"GRANTED\""
            - "Referral.${referral2_id}.superseded_by_referral_id == \"${referral3_id}\""
            - "EvaluationCase.${case2_id}.status == \"CANCELLED\""
            - "GET /child-find/evaluation-cases?referral_id=${referral2_id} returns total_count == 1"

