              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/audits"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", exam_period_start: "2026-01-01", exam_period_end: "2027-01-01" }
              as: TaxManager
              captures: { aud1: $.data.id }
          trigger:
            - { call: "POST /tax/audits/${aud1}/close", payload: { outcome: NO_CHANGE }, as: TaxManager, captures: { st: $.data.status, ag: $.data.agreed_adjustment_cents } }
          assert:
            - "status == CLOSED_NO_CHANGE; agreed_adjustment_cents == null"

      - name: negative_difference_produces_liability_item
        claim_type: correct_result
        grounds:
          - calculations.deferred_tax_movement
          - entities.DeferredTaxItem.fields.item_kind
        distinguishing_aspect: "Sign convention: book 2,000,000 vs tax 4,000,000 gives difference_cents -2,000,000 -> LIABILITY item with movement round(2,000,000 * 0.21) = 420,000; net_deferred_asset_cents goes negative (-420,000)."
        test_recipe:
          setup: ["FY2026 OPEN; US-FED; TEMPORARY difference (2,000,000 book vs 4,000,000 tax) REVIEWED"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "prepaid expense amortization", book_amount_cents: 2000000, tax_amount_cents: 4000000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { d1: $.data.id }
            - { call: "POST /tax/book-tax-differences/${d1}/review", payload: {}, as: TaxManager }
          trigger:
            - { call: "POST /tax/book-tax-differences/${d1}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/deferred-tax-items"
              payload: { tax_year_id: "${ty_id}" }
              as: Auditor
              captures: { kind: "$.data[0].item_kind", mov: "$.data[0].movement_cents", cls: "$.data[0].closing_balance_cents" }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { nda: $.data.net_deferred_asset_cents, de: $.data.deferred_expense_cents }
          assert:
            - "item_kind == LIABILITY; movement_cents == 420000; closing_balance_cents == 420000 (opening 0)"
            - "TaxYear.net_deferred_asset_cents == -420000 and deferred_expense_cents == 420000 (a DTL build is expense-positive)"

  - section: entities
    instances:
      - name: read_surface_sweep_and_fk_reverse_reachability
        claim_type: retrieval
        grounds:
          - "endpoints.GET /tax/book-tax-differences"
          - "endpoints.GET /tax/deferred-tax-items/{deferredItemId}"
          - "endpoints.GET /tax/valuation-allowances"
          - "endpoints.GET /tax/uncertain-tax-positions"
          - "endpoints.GET /tax/notices"
          - "endpoints.GET /tax/audits"
        distinguishing_aspect: "Every child entity is retrievable both by id and by filtered list from its parent's id (tax_year_id / jurisdiction_id / audit_case_id) — the FK reverse-reachability contract — with each filtered list returning exactly the fixtures of that parent."
        test_recipe:
          setup: ["FY2026 OPEN; US-FED; one LOCKED TEMPORARY difference (with its DeferredTaxItem), one DRAFT valuation allowance, one IDENTIFIED UTP, one RECEIVED notice, one open audit"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "accrued warranty", book_amount_cents: 5000000, tax_amount_cents: 2000000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { d1: $.data.id }
            - { call: "POST /tax/book-tax-differences/${d1}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${d1}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_va_v: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: true, projected_taxable_income_cents: 1000000, reversing_dtl_cents: 100000, expected_tax_year_version: "${ty_va_v}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "R&D credit", position_amount_cents: 2000000 }
              as: TaxAccountant
              captures: { utp1: $.data.id }
            - call: "POST /tax/notices"
              payload: { jurisdiction_id: "${jur_fed}", notice_type: INFORMATION_REQUEST, received_on: "2026-08-01", response_due_on: "2026-12-31" }
              as: TaxAccountant
              captures: { n1: $.data.id }
            - call: "POST /tax/audits"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", exam_period_start: "2026-01-01", exam_period_end: "2027-01-01" }
              as: TaxManager
              captures: { aud1: $.data.id }
          trigger:
            - call: "GET /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}" }
              as: Auditor
              captures: { d_list_id: "$.data[0].id" }
            - call: "GET /tax/book-tax-differences/${d1}"
              payload: {}
              as: Auditor
              captures: { d_get: $.data.id }
            - call: "GET /tax/deferred-tax-items"
              payload: { source_difference_id: "${d1}" }
              as: Auditor
              captures: { item_id: "$.data[0].id" }
            - call: "GET /tax/deferred-tax-items/${item_id}"
              payload: {}
              as: Auditor
              captures: { item_get: $.data.id }
            - call: "GET /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}" }
              as: Auditor
              captures: { va_list_id: "$.data[0].id" }
            - call: "GET /tax/uncertain-tax-positions"
              payload: { jurisdiction_id: "${jur_fed}" }
              as: Auditor
              captures: { utp_list_id: "$.data[0].id" }
            - call: "GET /tax/notices"
              payload: { jurisdiction_id: "${jur_fed}" }
              as: Auditor
              captures: { n_list_id: "$.data[0].id" }
            - call: "GET /tax/notices/${n1}"
              payload: {}
              as: Auditor
              captures: { n_get: $.data.id }
            - call: "GET /tax/audits"
              payload: { tax_year_id: "${ty_id}" }
              as: Auditor
              captures: { a_list_id: "$.data[0].id" }
            - call: "GET /tax/audits/${aud1}"
              payload: {}
              as: Auditor
              captures: { a_get: $.data.id }
          assert:
            - "Filtered lists each return exactly one element whose id matches the created resource (difference, item via source_difference_id, allowance, UTP via jurisdiction, notice via jurisdiction, audit)"
            - "Single GETs round-trip: d_get == ${d1}, item_get == item_id, n_get == ${n1}, a_get == ${aud1}"
