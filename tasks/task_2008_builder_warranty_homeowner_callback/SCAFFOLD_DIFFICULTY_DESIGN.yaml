          setup:
            - "Home closing 2026-08-01 => workmanship window [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z), end EXCLUSIVE"
            - "clock at 2027-07-31T12:00:00Z: sr_in (DRYWALL_PAINT) reported inside the window"
