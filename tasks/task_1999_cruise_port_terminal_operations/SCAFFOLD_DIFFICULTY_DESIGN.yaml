            - "Invoice.${invb}.head_tax_cents == 4048650 (2999 pax: no discount; 2999 x 1350)"
      - name: berth_buffer_120_vs_119_minutes
        grounds:
          - calculations.berth_window_conflict
          - validations[priority=14]
        distinguishing_aspect: |
          Metric: inter-window gap in minutes; endpoint: berth-assignment
          confirm. A gap of exactly BERTH_BUFFER_MINUTES (120) is ALLOWED
          (>= inclusive); 119 minutes is rejected. Different metric and endpoint
          than head_tax_tier_at_exactly_3000_vs_2999.
        test_recipe:
          setup:
            - "Call A CONFIRMED [2026-08-10T06:00, 2026-08-10T22:00] on berth B1"
            - "Call C TENTATIVE [2026-08-10T23:59, 2026-08-11T11:59] (119-minute gap)"
            - "Call B TENTATIVE [2026-08-11T00:00, 2026-08-11T12:00] (120-minute gap exactly)"
