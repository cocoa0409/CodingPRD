            - "reusing LP-L2 (now AVAILABLE but repositioned to LP-B by LP-D2's finalize): error_id == ERR_UNIT_WRONG_YARD — the resource moved, so origin-positioning fails even though the state lock is free"
            - "Locomotive.${l2}.current_yard_id == ${yB} (repositioning side effect of finalize)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: locomotive_book_release_rebook_lock_conservation
        grounds:
          - state_machines.Locomotive
          - state_machines.TrainDeparture.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: the count of AVAILABLE locomotives at a yard.
          Booking flips AVAILABLE -> ASSIGNED (-1), cancel flips it back
          (+1), and a re-book of the SAME unit succeeds — the net lock count
          returns to exactly its pre-book value with zero drift across the
          book/cancel/re-book cycle.
        test_recipe:
          setup:
            - "Yards CI-A, CI-B; ACTIVE plan CI-P; pool 3 crews; locomotive CI-L1 AVAILABLE at CI-A (yard starts with exactly 1 AVAILABLE unit)."
            - "Departure CI-D1 booked against CI-L1."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "CI-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "CI-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
