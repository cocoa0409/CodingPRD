      - name: payment_on_void_invoice_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INVOICE_NOT_PAYABLE]", state_machines.Invoice.ISSUED_to_VOID]
        distinguishing_aspect: "Paying an invoice VOIDed by a subscription cancel returns ERR_INVOICE_NOT_PAYABLE (409)."
        test_recipe:
          setup: ["An ACTIVE subscription with one ISSUED invoice, then cancelled (invoice VOID)."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
