        claim_type: Segregation of duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=4]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.CampaignCommunication.fields.authored_by_user_id
          - entities.CampaignCommunication.fields.reviewed_by_user_id
