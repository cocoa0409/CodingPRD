  - rule_id: boundary_precision_check
    instances:
      - name: infestation_tier_exactly_at_severe_threshold
        grounds:
          - calculations.assessment_infestation_index
          - entities.Assessment.fields.infestation_tier
          - endpoints[POST /vector-control/inspections/{id}/assessments]
        distinguishing_aspect: |
          Metric one - the assessment infestation index on the assessments endpoint: scores
          5/5/5 with 5 burrows produce base 50.00 plus a surcharge capped at exactly 15.00,
          landing on 65.00, which is SEVERE because the tier test is >= 65.00 and not > 65.00.
        test_recipe:
          setup:
            - "A triaged HIGH complaint on APN-1001 has an IN_PROGRESS inspection assigned to Iris Vega"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_SINGLE" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Sam Cole", badge_number: "B-200", rank: "SUPERVISOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT", description: "Burrows under the shed", reported_severity: "HIGH" }
              as: IntakeClerk
              captures: { comp_id: $.data.id }
            - call: "POST /vector-control/complaints/${comp_id}/triage"
              payload: { severity: "HIGH" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /vector-control/inspections"
              payload: { kind: "INITIAL", complaint_id: "${comp_id}", officer_id: "${insp1_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp1_id}"
          trigger:
            - call: "POST /vector-control/inspections/${visit_id}/assessments"
              payload: { harborage_score: 5, attractant_score: 5, sanitation_score: 5, burrow_count: 5, evidence_photo_count: 1 }
              as: Inspector
              as_user_id: "${insp1_id}"
              captures: { idx: $.data.infestation_index, tier: $.data.infestation_tier }
          assert:
            - "Assessment.infestation_index == 65.00 (base 50.00 plus the surcharge capped at 15.00, not 3.0 * 5 = 15.00 uncapped growth beyond the cap)"
            - "Assessment.infestation_tier == SEVERE at exactly the 65.00 threshold"
            - "Property.${prop_id}.provisional_chronic_score == 65.00"
            - "Property.${prop_id}.chronic_flag == false (the PROVISIONAL variant never sets the flag even above 60.00)"

      - name: surveillance_window_lower_bound_is_inclusive
        grounds:
          - calculations.zone_rodent_index
          - endpoints[GET /vector-control/zones/{id}/surveillance-summary]
          - endpoints[POST /vector-control/bait-stations/{id}/readings]
        distinguishing_aspect: |
          A different metric on a different endpoint - the closed lower edge of the 30-day
          surveillance window on the summary read: a reading stamped exactly 30 days before
          the clock is inside the window and yields in_window_reading_count 1 with bait
          component 40.00, while advancing the clock by one further second empties the input
          set and collapses every component to 0.00.
        test_recipe:
          setup:
            - "Zone Riverside contains parcel APN-1001 with one ACTIVE bait station and no complaints at all"
            - "A single reading of 40 percent take and 0 signs was recorded at 2026-04-05T09:00:00Z"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "VACANT_LOT" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
            - call: "POST /vector-control/bait-stations"
              payload: { property_id: "${prop_id}", station_code: "BS-01", bait_type: "ANTICOAGULANT" }
              as: Inspector
              as_user_id: "${insp1_id}"
              captures: { station_id: $.data.id }
            - call: "POST /vector-control/bait-stations/${station_id}/readings"
              payload: { take_pct: 40, activity_sign_count: 0, station_condition: "INTACT", rebaited: true }
              as: Inspector
              as_user_id: "${insp1_id}"
          trigger:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "GET /vector-control/zones/${zone_id}/surveillance-summary"
              as: ProgramAdmin
              captures: { cnt_in: $.data.in_window_reading_count, idx_in: $.data.rodent_index }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:01Z" }
              as: ProgramAdmin
            - call: "GET /vector-control/zones/${zone_id}/surveillance-summary"
              as: ProgramAdmin
              captures: { cnt_out: $.data.in_window_reading_count, idx_out: $.data.rodent_index }
          assert:
            - "At 2026-05-05T09:00:00Z: in_window_reading_count == 1, bait_component == 40.00, sign_component == 0.00, complaint_component == 0.00, rodent_index == 20.00, posture == NORMAL"
            - "At 2026-05-05T09:00:01Z: in_window_reading_count == 0, bait_component == 0.00, rodent_index == 0.00, posture == NORMAL"
            - "window_start at the second read == 2026-04-05T09:00:01.000Z, one second after the reading's reading_at"
            - "Zone.${zone_id}.rodent_index == 0.00 after the second read"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: initial_inspection_requires_triaged_complaint
        grounds:
          - state_machines.Complaint.TRIAGED_to_INSPECTION_SCHEDULED
          - validations[priority=8]
          - errors[ERR_COMPLAINT_NOT_TRIAGED]
          - endpoints[POST /vector-control/inspections]
        distinguishing_aspect: |
          Entity pair Inspection -> Complaint: an Inspection may only be created when the
          Complaint it answers is in TRIAGED, so a complaint still sitting in RECEIVED blocks
          scheduling with ERR_COMPLAINT_NOT_TRIAGED even though the officer, the window and
          the payload are all valid.
