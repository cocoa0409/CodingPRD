          assert:
            - "error_id == ERR_INVALID_STATE (state priority 5 beats business_safety priority 7; vial is QUARANTINED AND license is SUSPENDED)"

      - name: room_safety_beats_overlap_temporal
        grounds:
          - validations[priority=13]
          - validations[priority=20]
          - errors[ERR_ROOM_CONTAMINATED]
