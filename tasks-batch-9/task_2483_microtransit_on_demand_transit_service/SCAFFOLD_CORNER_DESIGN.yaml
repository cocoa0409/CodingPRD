# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2483_microtransit_on_demand_transit_service
#
# Taxonomy: references/claim-extraction-guide.md. `section:` values are the
# guide's nine sections; `claim_type:` values are its per-section rows. Nothing
# here adds behavior — every instance grounds in §1.1-§1.7 of SCAFFOLD.yaml.
#
# Fixture conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * logical clock starts at 2026-08-01T00:00:00Z; recipes move it explicitly.
#   * 2026-08-03 is a Monday, so daily and weekly fare counters share a start.
#   * corridor geometry: TRAVEL_MINUTES_PER_INDEX = 3, so S0->S4 is 12 minutes.
#   * opaque-role audit ids: "fa-1"/"fa-2" (FinanceAnalyst), "aud-1"/"aud-2"
#     (FundingAgencyAuditor); ZoneAdmin and Dispatcher omit as_user_id unless
#     the claim is about identity itself.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: service_zone_creation_echoes_every_supplied_field
        claim_type: creation
        grounds:
          - entities.ServiceZone
          - endpoints.POST_service-zones
        distinguishing_aspect: "POST /service-zones with all eleven input fields returns 201 and every supplied value is readable back verbatim on the created row."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneAdmin
          trigger:
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
          assert:
            - "the response is HTTP 201 with response_type == object"
            - "ServiceZone.${z_id}.name == Riverbend Microtransit"
            - "ServiceZone.${z_id}.zone_code == RBM"
            - "ServiceZone.${z_id}.max_walk_meters == 600"
            - "ServiceZone.${z_id}.detour_tolerance_pct == 0.25"
            - "ServiceZone.${z_id}.detour_tolerance_floor_minutes == 6"
            - "ServiceZone.${z_id}.base_fare_cents == 250"
            - "ServiceZone.${z_id}.fare_cap_cents_daily == 600"
            - "ServiceZone.${z_id}.fare_cap_cents_weekly == 2500"
            - "ServiceZone.${z_id}.on_time_window_minutes == 10"
            - "ServiceZone.${z_id}.curb_capacity_per_bucket == 2"
            - "ServiceZone.${z_id}.status == DRAFT"

      - name: defaults_applied_for_omitted_optional_inputs_and_system_seeded_fields
        claim_type: defaults
        grounds:
          - entities.TripRequest.fields.party_size
          - entities.TripRequest.fields.wav_required
          - entities.VirtualStop.fields.paired_stop_id
          - entities.VehicleBlock.fields.actual_revenue_hours
          - entities.Rider.fields.daily_fare_paid_cents
        distinguishing_aspect: "The only omissible create inputs are party_size, wav_required, connection_id and paired_stop_id; omitting them yields the §1.1 defaults 1, false, null and null, and every system-seeded counter starts at its declared default (0, 0.00, null, COMPLIANT) rather than null-everywhere."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-03T06:00:00Z."
            - "Every create call supplies exactly the required inputs and omits every optional one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
          trigger:
            - call: "POST /service-zones"
              payload: { name: "Defaults Zone", zone_code: "DEF", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 0 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: false }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z" }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
          assert:
            - "TripRequest.${t1_id}.party_size == 1 (omitted optional input)"
            - "TripRequest.${t1_id}.wav_required == false (omitted optional input, rider is NONE)"
            - "TripRequest.${t1_id}.connection_id == null and TripRequest.${t1_id}.match_attempt_count == 0"
            - "TripRequest.${t1_id}.status == RECEIVED and TripRequest.${t1_id}.fare_status == UNPRICED"
            - "VirtualStop.${s4_id}.paired_stop_id == null (omitted optional input)"
            - "VirtualStop.${s4_id}.status was PROPOSED at create before the approve call"
            - "Vehicle.${v1_id}.is_wav == false when wav_positions == 0"
            - "Driver.${d1_id}.consecutive_decline_count == 0 and Driver.${d1_id}.status == ACTIVE"
            - "Rider.${r1_id}.daily_fare_paid_cents == 0 and Rider.${r1_id}.weekly_fare_paid_cents == 0"
            - "Rider.${r1_id}.fare_counter_date == null and Rider.${r1_id}.fare_counter_week_start == null"
            - "VehicleBlock.${b1_id}.state == SCHEDULED with opened_at == null and closed_at == null"
            - "VehicleBlock.${b1_id}.seats_committed == 0, wav_positions_committed == 0, boardings_count == 0"
            - "VehicleBlock.${b1_id}.committed_index_min == null and committed_index_max == null"
            - "VehicleBlock.${b1_id}.actual_revenue_hours == 0.00 while the block is not CLOSED"
            - "ServiceZone.${z_id} was created with status DRAFT and completed_trip_count == 0, avg_wait_minutes == 0.00, boardings_per_revenue_hour == 0.00, wav_equivalence_ratio == 0.000, equivalence_verdict == COMPLIANT"

      - name: virtual_stop_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_virtual-stops_id
          - entities.VirtualStop
        distinguishing_aspect: "GET /virtual-stops/{id} returns exactly the row POST created, including the zone FK and the PROPOSED status, with no field drift."
        test_recipe:
          setup:
            - "Zone RBM is ACTIVE and stop S7 (corridor_index 7, walk_shed_meters 350, accessibility STAIRS_ONLY) was created but not approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S7", corridor_index: 7, walk_shed_meters: 350, accessibility: "STAIRS_ONLY" }
              as: ZoneAdmin
              captures: { s7_id: $.data.id }
          trigger:
            - call: "GET /virtual-stops/${s7_id}"
              payload: {}
              as: Dispatcher
          assert:
            - "the response is HTTP 200 with response_type == object"
            - "VirtualStop.${s7_id}.zone_id == ${z_id}"
            - "VirtualStop.${s7_id}.stop_code == S7"
            - "VirtualStop.${s7_id}.corridor_index == 7"
            - "VirtualStop.${s7_id}.walk_shed_meters == 350"
            - "VirtualStop.${s7_id}.accessibility == STAIRS_ONLY"
            - "VirtualStop.${s7_id}.status == PROPOSED"

      - name: vehicle_block_listing_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_vehicle-blocks
          - entities.VehicleBlock
        distinguishing_aspect: "With three blocks stored, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE with one vehicle V1 and three drivers D1, D2, D3."
            - "Three non-overlapping SCHEDULED blocks on V1: [06:00,08:00) with D1, [08:00,10:00) with D2 and [10:30,12:00) with D3 — the 30-minute driver gaps and the half-open vehicle adjacency keep every create legal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D2", wav_certified: true }
              as: ZoneAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D3", wav_certified: true }
              as: ZoneAdmin
              captures: { d3_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T08:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d2_id}", block_type: "BASE", start_utc: "2026-08-03T08:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b2_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d3_id}", block_type: "SURGE", start_utc: "2026-08-03T10:30:00Z", end_utc: "2026-08-03T12:00:00Z" }
              as: Dispatcher
              captures: { b3_id: $.data.id }
          trigger:
            - call: "GET /vehicle-blocks?zone_id=${z_id}&limit=2&offset=0"
              payload: {}
              as: Dispatcher
            - call: "GET /vehicle-blocks?zone_id=${z_id}&limit=2&offset=2"
              payload: {}
              as: Dispatcher
            - call: "GET /vehicle-blocks?zone_id=${z_id}&block_type=SURGE"
              payload: {}
              as: Dispatcher
          assert:
            - "the first list call returns HTTP 200 with response_type == array and exactly 2 rows"
            - "the first list call reports limit == 2, offset == 0, total_count == 3, has_more == true"
            - "the second list call returns exactly 1 row and reports offset == 2, total_count == 3, has_more == false"
            - "the block_type filter returns exactly 1 row whose id == ${b3_id}"
            - "every row returned by the unfiltered-by-type calls belongs to {${b1_id}, ${b2_id}, ${b3_id}}"

      - name: trip_request_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_TRIP_REQUEST_NOT_FOUND
          - validations.priority_4
        distinguishing_aspect: "GET /trip-requests/{id} for a well-formed but non-existent id returns HTTP 404 with error_id ERR_TRIP_REQUEST_NOT_FOUND and an error envelope, not an empty 200."
        test_recipe:
          setup:
            - "Empty database except the logical clock; no TripRequest row has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneAdmin
          trigger:
            - call: "GET /trip-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
          assert:
            - "the response is HTTP 404 with response_type == error"
            - "data.error_id == ERR_TRIP_REQUEST_NOT_FOUND"
            - "GET /trip-requests returns total_count == 0"

      - name: vehicle_create_missing_seat_capacity_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_7
          - errors.ERR_INVALID_REQUEST
          - entities.Vehicle.fields.seat_capacity
        distinguishing_aspect: "seat_capacity has source input and no default, so omitting it must return HTTP 422 ERR_INVALID_REQUEST and persist no Vehicle row."
        test_recipe:
          setup:
            - "Zone RBM is ACTIVE and holds no vehicles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
          trigger:
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", wav_positions: 2 }
              as: ZoneAdmin
          assert:
            - "the response is HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /vehicles?zone_id=${z_id} returns total_count == 0"

      - name: trip_request_wav_required_is_computed_and_cannot_be_downgraded_by_body
        claim_type: computed_fields
        grounds:
          - entities.TripRequest.fields.wav_required
          - entities.Rider.fields.mobility_device
        distinguishing_aspect: "A WHEELCHAIR rider posting wav_required false still gets wav_required true, while a NONE rider posting wav_required true does get true — the OR is honoured in both directions and the body never downgrades the rider attribute."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE with approved ACCESSIBLE_PATH stops S0 (index 0) and S4 (index 4)."
            - "Rider RW has mobility_device WHEELCHAIR; rider RN has mobility_device NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "RW", fare_category: "FULL", mobility_device: "WHEELCHAIR" }
              as: ZoneAdmin
              captures: { rw_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "RN", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { rn_id: $.data.id }
          trigger:
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${rw_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1, wav_required: false }
              as: Rider
              as_user_id: "${rw_id}"
              captures: { t_w_id: $.data.id }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${rn_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:30:00Z", party_size: 1, wav_required: true }
              as: Rider
              as_user_id: "${rn_id}"
              captures: { t_n_id: $.data.id }
          assert:
            - "TripRequest.${t_w_id}.wav_required == true (body false is ignored for a WHEELCHAIR rider)"
            - "TripRequest.${t_n_id}.wav_required == true (body true is honoured for a NONE rider)"
            - "TripRequest.${t_w_id}.baseline_direct_minutes == null (no offer yet)"
            - "TripRequest.${t_w_id}.projected_detour_minutes == null and TripRequest.${t_w_id}.promised_pickup_utc == null"
            - "TripRequest.${t_w_id}.match_attempt_count == 0 and TripRequest.${t_w_id}.status == RECEIVED"
            - "TripRequest.${t_w_id}.quoted_fare_cents == null and TripRequest.${t_w_id}.charged_fare_cents == null and TripRequest.${t_w_id}.applied_cap == null"
            - "GET /trip-requests?zone_id=${z_id}&wav_required=true returns total_count == 2"

      - name: common_system_fields_are_server_minted_on_every_create
        claim_type: system_fields
        grounds:
          - entities.ServiceZone
          - entities.VirtualStop
        distinguishing_aspect: "id, created_at, updated_at and version are generated by the server: two zones created at the same logical instant get distinct ids, both carry version 1, and created_at equals the logical clock 2026-08-01T00:00:00Z rather than wall-clock time."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z and never advanced."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneAdmin
          trigger:
            - call: "POST /service-zones"
              payload: { name: "Zone One", zone_code: "Z1", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 5, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z1_id: $.data.id, z1_v: $.data.version }
            - call: "POST /service-zones"
              payload: { name: "Zone Two", zone_code: "Z2", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 5, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z2_id: $.data.id, z2_v: $.data.version }
          assert:
            - "${z1_id} != ${z2_id}"
            - "${z1_v} == 1 and ${z2_v} == 1"
            - "ServiceZone.${z1_id}.created_at == 2026-08-01T00:00:00Z and ServiceZone.${z1_id}.updated_at == 2026-08-01T00:00:00Z"
            - "ServiceZone.${z2_id}.created_at == 2026-08-01T00:00:00Z"
            - "every response carries meta.api_request_id and meta.api_request_timestamp"

      - name: enum_and_numeric_range_constraints_are_rejected_at_intake
        claim_type: type_constraints
        grounds:
          - validations.priority_7
          - entities.ServiceZone.fields.max_walk_meters
          - entities.VirtualStop.fields.accessibility
          - entities.TripRequest.fields.destination_stop_id
        distinguishing_aspect: "Three distinct §1.1 constraint kinds each return HTTP 422 ERR_INVALID_REQUEST: max_walk_meters 50 below the 100 floor, accessibility RAMP outside the declared enum, and destination_stop_id equal to origin_stop_id."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE with one approved stop S0 (index 0) and rider R1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
