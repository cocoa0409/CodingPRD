# =============================================================================
# §1.8 Scaffold Difficulty Design — Ski & Snowboard Tune & Rental Shop
# 9 Difficulty Rules x 2 instances. All recipes replayable from empty-DB
# using only endpoints declared in SCAFFOLD.yaml §1.5.
# Standard customer profile (din 5.75): 175cm/70kg/boot 300mm/TYPE_2/1996-01-15.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: rental_quote_vs_final_charge
        grounds:
          - calculations.rental_charge
          - entities.Reservation.fields.quoted_total_cents
          - entities.Reservation.fields.final_total_cents
        distinguishing_aspect: |
          Same Reservation data, two valid algorithms: the forward-looking
          provisional quote (planned dates, no late fee) yields 12000 while the
          chronological final charge (actual return date + 1.5x late fee) yields
          24000 — dual-variant logic on the Reservation pricing domain.
        test_recipe:
          setup:
            - "Customer (175cm/70kg/boot 300/TYPE_2/1996-01-15) and one SKI STANDARD unit, rate 4000, din 2-10, price 60000"
            - "Reservation 2026-12-10..2026-12-12 (planned 3 days) with one ASSIGNED item, confirmed with deposit 2400 (= exact 20% minimum)"
            - "Gear picked up 2026-12-10; clock advanced to 2026-12-14 (5th inclusive day, 2 late days)"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Rin Okabe", email: "rin@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 2400 }, as: Customer, as_user_id: "${cust}", captures: { q_total: "$.data.quoted_total_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-14T10:00:00Z" }, as: Manager }
          trigger:
            - { call: "POST /shop/reservations/${res}/return", payload: {}, as: FrontDesk, captures: { f_total: "$.data.final_total_cents" } }
          assert:
            - "Reservation.${res}.quoted_total_cents == 12000 (3 days x 4000, no discount, provisional variant)"
            - "Reservation.${res}.final_total_cents == 24000 (regular 3x4000=12000 + late round(2x4000x1.5)=12000)"
            - "ReservationItem.${item}.late_days == 2 and line_final_cents == 24000"
            - "${q_total} != ${f_total} — identical inputs, divergent variants"

      - name: lease_buyout_straight_line_vs_usage
        grounds:
          - calculations.season_lease_buyout
          - entities.SeasonLease.fields.buyout_price_straight_line_cents
          - entities.SeasonLease.fields.buyout_price_usage_cents
        distinguishing_aspect: |
          Same closed lease, two valid depreciation algorithms on the
          SeasonLease/equipment-valuation domain: straight-line over the season
          fraction yields 24000 while usage-weighted per-day yields 12000 —
          a different entity domain from the Reservation rental charge.
        test_recipe:
          setup:
            - "Junior (dob 2014-06-01, age 12 at season start) with adult guardian; JUNIOR SKI unit price 30000"
            - "Season lease 2026-11-01..2027-03-31 (season_days 150), activated 2026-11-01, closed 2026-12-31 (elapsed 60 days)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T08:00:00Z" }, as: Manager }
            - { call: "POST /shop/customers", payload: { full_name: "Juni Per", email: "juni@x.com", date_of_birth: "2014-06-01", height_cm: 140, weight_kg: 40, boot_sole_mm: 260, skier_type: "TYPE_1" }, as: FrontDesk, captures: { jun: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Gus Per", email: "gus@x.com", date_of_birth: "1980-03-10", height_cm: 182, weight_kg: 84, boot_sole_mm: 305, skier_type: "TYPE_2" }, as: FrontDesk, captures: { gua: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "130cm", tier: "JUNIOR", din_min: 1, din_max: 6, purchase_price_cents: 30000, base_daily_rate_cents: 2500 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/season-leases", payload: { junior_customer_id: "${jun}", guardian_customer_id: "${gua}", season_start_date: "2026-11-01", season_end_date: "2027-03-31", package_tier: "JUNIOR_SKI", deposit_cents: 10000 }, as: FrontDesk, captures: { lease: "$.data.id" } }
            - { call: "POST /shop/season-leases/${lease}/activate", payload: { equipment_item_id: "${unit}" }, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-31T09:00:00Z" }, as: Manager }
          trigger:
            - { call: "POST /shop/season-leases/${lease}/close", payload: {}, as: FrontDesk, captures: { sl: "$.data.buyout_price_straight_line_cents", us: "$.data.buyout_price_usage_cents" } }
          assert:
            - "SeasonLease.${lease}.buyout_price_straight_line_cents == 24000 (30000 x max(0.4, 1 - 0.5 x 60/150) = 30000 x 0.8)"
            - "SeasonLease.${lease}.buyout_price_usage_cents == 12000 (30000 x max(0.4, 1 - 0.01 x 60) = 30000 x 0.4)"
            - "${sl} != ${us} — same lease, two sanctioned valuations"
            - "SeasonLease.${lease}.status == SETTLED and EquipmentItem.${unit}.status == AWAITING_INSPECTION"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: fitment_din_multi_input_branching
        grounds:
          - calculations.fitment_din
          - entities.ReservationItem.fields.din_setting
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (weight, height, boot sole) with non-linear
          conditional branches on entity state (skier_type and age-band
          adjustments) — TYPE_2 yields 5.75 while TYPE_3 with identical body
          inputs yields 6.5.
        test_recipe:
          setup:
            - "Two customers identical except skier_type (TYPE_2 vs TYPE_3); one SKI STANDARD unit per customer, din 2-10, rate 4000"
            - "Each has a DRAFT reservation with one item, then auto-assign computes din_setting"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Taro Type2", email: "t2@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { c2: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Sana Type3", email: "t3@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_3" }, as: FrontDesk, captures: { c3: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { u1: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { u2: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${c2}", start_date: "2026-12-10", end_date: "2026-12-11", pickup_method: "SHOP" }, as: Customer, as_user_id: "${c2}", captures: { r2: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${c3}", start_date: "2026-12-10", end_date: "2026-12-11", pickup_method: "SHOP" }, as: Customer, as_user_id: "${c3}", captures: { r3: "$.data.id" } }
            - { call: "POST /shop/reservations/${r2}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${c2}", captures: { i2: "$.data.id" } }
            - { call: "POST /shop/reservations/${r3}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${c3}", captures: { i3: "$.data.id" } }
          trigger:
            - { call: "POST /shop/reservation-items/${i2}/assign", payload: {}, as: FrontDesk, captures: { din2: "$.data.din_setting" } }
            - { call: "POST /shop/reservation-items/${i3}/assign", payload: {}, as: FrontDesk, captures: { din3: "$.data.din_setting" } }
          assert:
            - "ReservationItem.${i2}.din_setting == 5.75 (0.5 + 70x0.06 + 175x0.005 + 0 + 0 + 0.15 = 5.725 -> 5.75 at 0.25 step)"
            - "ReservationItem.${i3}.din_setting == 6.5 (5.725 + 0.75 = 6.475 -> 6.5)"
            - "${din2} != ${din3} — only the skier_type branch differs"

      - name: rental_per_line_rounding_order
        grounds:
          - calculations.rental_charge
          - entities.Reservation.fields.deposit_minimum_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-line round_half_up
          then sum (pinned) yields 63033 for three 7-day lines at rate 3335,
          whereas sum-then-round would yield 63032; a different combinatorial
          mode than fitment_din's multi-input branching.
        test_recipe:
          setup:
            - "Customer and three SKI STANDARD units, each rate 3335 (7 x 3335 x 0.9 = 21010.5 per line)"
            - "Reservation 2027-01-04..2027-01-10 (planned 7 days -> 10% tier), three items all ASSIGNED"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Penny Round", email: "penny@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "168cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 50000, base_daily_rate_cents: 3335 }, as: Manager, captures: { ua: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "169cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 50000, base_daily_rate_cents: 3335 }, as: Manager, captures: { ub: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 50000, base_daily_rate_cents: 3335 }, as: Manager, captures: { uc: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2027-01-04", end_date: "2027-01-10", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ia: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ib: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ic: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${ia}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservation-items/${ib}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservation-items/${ic}/assign", payload: {}, as: FrontDesk }
          trigger:
            - { call: "GET /shop/reservations/${res}", payload: {}, as: FrontDesk, captures: { qt: "$.data.quoted_total_cents", dm: "$.data.deposit_minimum_cents" } }
          assert:
            - "Reservation.${res}.quoted_total_cents == 63033 (3 x round_half_up(21010.5) = 3 x 21011; sum-then-round would give 63032)"
            - "Reservation.${res}.deposit_minimum_cents == 12607 (round_half_up(0.2 x 63033))"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: tune_ticket_rework_cycle
        grounds:
          - state_machines.TuneTicket.QUALITY_CHECK_to_IN_PROGRESS
          - state_machines.TuneTicket.QUALITY_CHECK_to_READY
          - entities.TuneTicket.fields.rework_count
        distinguishing_aspect: |
          TuneTicket is cyclic: QUALITY_CHECK -> IN_PROGRESS -> QUALITY_CHECK ->
          READY (rework loop bounded at 2), a non-linear machine on TuneTicket —
          distinct from Reservation's parallel-dimension shape.
        test_recipe:
          setup:
            - "Clock 2026-12-01T09:00:00Z; capacity row for 2026-12-01 (base 480, rush 120)"
            - "Own-gear ticket, services [WAX] (labor 45), quoted 2500, approved via OCC, started, completed once"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/shop-day-capacity", payload: { service_date: "2026-12-01", base_labor_minutes: 480, rush_reserved_minutes: 120 }, as: Manager, captures: { cap: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Amy Wax", email: "amy@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/tune-tickets", payload: { customer_id: "${cust}", own_gear_description: "own GS skis", services: ["WAX"], rush: false }, as: Customer, as_user_id: "${cust}", captures: { tk: "$.data.id" } }
            - { call: "POST /shop/tune-tickets/${tk}/quote", payload: { parts_surcharge_cents: 0 }, as: Technician, captures: { v_q: "$.data.version" } }
            - { call: "POST /shop/tune-tickets/${tk}/approve", payload: { expected_tune_ticket_version: "${v_q}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /shop/tune-tickets/${tk}/start", payload: {}, as: Technician }
            - { call: "POST /shop/tune-tickets/${tk}/complete", payload: {}, as: Technician }
            - { call: "POST /shop/tune-tickets/${tk}/qc-fail", payload: {}, as: Technician, captures: { rw: "$.data.rework_count" } }
            - { call: "POST /shop/tune-tickets/${tk}/complete", payload: {}, as: Technician }
          trigger:
            - { call: "POST /shop/tune-tickets/${tk}/qc-pass", payload: {}, as: Technician, captures: { st: "$.data.status", fin: "$.data.final_price_cents" } }
          assert:
            - "TuneTicket.${tk}.status == READY after the rework loop"
            - "TuneTicket.${tk}.rework_count == 1"
            - "TuneTicket.${tk}.final_price_cents == 2500 (equals quoted; rework is free)"
            - "ShopDayCapacity.${cap}.booked_minutes == 90 (start 45 + rework re-book 45)"

      - name: reservation_parallel_payment_fulfillment
        grounds:
          - state_machines.Reservation
          - entities.Reservation.fields.payment_status
          - entities.Reservation.fields.fulfillment_status
        distinguishing_aspect: |
          Reservation carries two independent state dimensions on one row:
          payment (UNPAID->AUTHORIZED->CAPTURED->SETTLED, or VOIDED on cancel)
          evolves orthogonally to fulfillment (DRAFT->CONFIRMED->ACTIVE->
          RETURNED->CLOSED) — parallel shape, distinct from TuneTicket's cycle.
        test_recipe:
          setup:
            - "R1: full lifecycle to CLOSED/SETTLED (3-day rental, rate 4000, on-time return, inspect PASS)"
            - "R2: confirmed then cancelled -> VOIDED/CANCELLED without touching CAPTURED/SETTLED"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Par Axes", email: "par@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { u1: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "171cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { u2: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { r1: "$.data.id" } }
            - { call: "POST /shop/reservations/${r1}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { i1: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${i1}/assign", payload: { preferred_equipment_item_id: "${u1}" }, as: FrontDesk }
            - { call: "POST /shop/reservations/${r1}/confirm", payload: { deposit_authorized_cents: 2400 }, as: Customer, as_user_id: "${cust}", captures: { pay1: "$.data.payment_status", ful1: "$.data.fulfillment_status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${r1}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T17:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${r1}/return", payload: {}, as: FrontDesk, captures: { pay2: "$.data.payment_status", ful2: "$.data.fulfillment_status" } }
            - { call: "POST /shop/equipment-items/${u1}/inspect", payload: { outcome: "PASS" }, as: Technician }
            - { call: "POST /shop/reservations/${r1}/close", payload: {}, as: FrontDesk, captures: { pay3: "$.data.payment_status", ful3: "$.data.fulfillment_status" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2027-01-05", end_date: "2027-01-06", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { r2: "$.data.id" } }
            - { call: "POST /shop/reservations/${r2}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { i2: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${i2}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${r2}/confirm", payload: { deposit_authorized_cents: 1600 }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /shop/reservations/${r2}/cancel", payload: {}, as: Customer, as_user_id: "${cust}", captures: { pay4: "$.data.payment_status", ful4: "$.data.fulfillment_status" } }
          assert:
            - "After confirm: ${pay1} == AUTHORIZED and ${ful1} == CONFIRMED"
            - "After return: ${pay2} == CAPTURED and ${ful2} == RETURNED"
            - "After close: ${pay3} == SETTLED and ${ful3} == CLOSED"
            - "After cancel: ${pay4} == VOIDED and ${ful4} == CANCELLED — payment axis moved without fulfillment ever entering ACTIVE"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: damage_invoice_cascade_to_lease_suspension
        grounds:
          - state_machines.DamageAssessment.DRAFT_to_INVOICED
          - calculations.customer_standing
          - state_machines.SeasonLease.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain triggered by the invoice transition: invoice mutates
          Reservation.deposit_captured_cents; that mutation triggers
          Customer.standing recompute to BARRED; entering BARRED itself
          suspends the customer's ACTIVE SeasonLease.
        test_recipe:
          setup:
            - "Junior (dob 2014-06-01) with guardian; ACTIVE JUNIOR_SKI lease on unit J (price 30000)"
            - "Junior's rental reservation 2026-12-10..2026-12-12 on unit R (price 60000, rate 4000), deposit 2400, picked up and returned on time (accrued 3 days)"
            - "Technician filed a TOTAL_LOSS assessment on unit R for that reservation"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T08:00:00Z" }, as: Manager }
            - { call: "POST /shop/customers", payload: { full_name: "Juni Per", email: "juni@x.com", date_of_birth: "2014-06-01", height_cm: 140, weight_kg: 40, boot_sole_mm: 260, skier_type: "TYPE_1" }, as: FrontDesk, captures: { jun: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Gus Per", email: "gus@x.com", date_of_birth: "1980-03-10", height_cm: 182, weight_kg: 84, boot_sole_mm: 305, skier_type: "TYPE_2" }, as: FrontDesk, captures: { gua: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "130cm", tier: "JUNIOR", din_min: 1, din_max: 6, purchase_price_cents: 30000, base_daily_rate_cents: 2500 }, as: Manager, captures: { unitj: "$.data.id" } }
            - { call: "POST /shop/season-leases", payload: { junior_customer_id: "${jun}", guardian_customer_id: "${gua}", season_start_date: "2026-11-01", season_end_date: "2027-03-31", package_tier: "JUNIOR_SKI", deposit_cents: 10000 }, as: FrontDesk, captures: { lease: "$.data.id" } }
            - { call: "POST /shop/season-leases/${lease}/activate", payload: { equipment_item_id: "${unitj}" }, as: FrontDesk }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unitr: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${jun}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: FrontDesk, captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: FrontDesk, captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 2400 }, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T17:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/return", payload: {}, as: FrontDesk }
            - { call: "POST /shop/damage-assessments", payload: { reservation_id: "${res}", equipment_item_id: "${unitr}", severity: "TOTAL_LOSS" }, as: Technician, captures: { dmg: "$.data.id", chg: "$.data.charge_cents" } }
          trigger:
            - { call: "POST /shop/damage-assessments/${dmg}/invoice", payload: {}, as: FrontDesk, captures: { capd: "$.data.deposit_captured_cents", rem: "$.data.remainder_due_cents" } }
          assert:
            - "DamageAssessment.${dmg}.charge_cents == 60000 (TOTAL_LOSS: min(1.0 x 60000, depreciated 60000))"
            - "Link 1: ${capd} == 2400 (capped at remaining deposit) and ${rem} == 57600; Reservation.${res}.deposit_captured_cents == 2400"
            - "Link 2: Customer.${jun}.standing == BARRED (unpaid INVOICED TOTAL_LOSS)"
            - "Link 3: SeasonLease.${lease}.status == SUSPENDED"
            - "Fan-out: EquipmentItem.${unitr}.status == LOST"

      - name: release_promotes_oldest_queued_item
        grounds:
          - state_machines.ReservationItem.ASSIGNED_to_RELEASED
          - state_machines.EquipmentItem.RESERVED_to_AVAILABLE
          - state_machines.ReservationItem.QUEUED_to_ASSIGNED
        distinguishing_aspect: |
          Depth-2 chain triggered by the release transition (different trigger
          from the damage invoice): release mutates the unit RESERVED ->
          AVAILABLE; that mutation itself promotes the oldest-created compatible
          QUEUED ReservationItem, flipping the unit back to RESERVED.
        test_recipe:
          setup:
            - "Two customers; single SKI STANDARD unit U (din 2-10)"
            - "R1 (2026-12-10..12-12) item ASSIGNED to U; R2 (2026-12-14..12-16) item attempted auto-assign with empty AVAILABLE pool -> stays QUEUED"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "First Q", email: "fq@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { ca: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Second Q", email: "sq@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cb: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${ca}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${ca}", captures: { r1: "$.data.id" } }
            - { call: "POST /shop/reservations/${r1}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${ca}", captures: { i1: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${i1}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cb}", start_date: "2026-12-14", end_date: "2026-12-16", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cb}", captures: { r2: "$.data.id" } }
            - { call: "POST /shop/reservations/${r2}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cb}", captures: { i2: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${i2}/assign", payload: {}, as: FrontDesk, captures: { q_status: "$.data.status" } }
          trigger:
            - { call: "POST /shop/reservation-items/${i1}/release", payload: {}, as: FrontDesk }
          assert:
            - "Before release: ReservationItem.${i2}.status == QUEUED (empty-pool fallback, no error)"
            - "After release: ReservationItem.${i1}.status == RELEASED"
            - "Cascade link 2: ReservationItem.${i2}.status == ASSIGNED and equipment_item_id == ${unit}"
            - "EquipmentItem.${unit}.status == RESERVED (freed then immediately re-earmarked by promotion)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_cancelled_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=31]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: confirming a CANCELLED
          reservation with a deposit below the minimum violates both rules;
          the state error (priority 6) must win over ERR_DEPOSIT_BELOW_MINIMUM
          (priority 31).
        test_recipe:
          setup:
            - "Reservation with one ASSIGNED item (quoted 12000, deposit minimum 2400), cancelled from DRAFT"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Con Flict", email: "conf@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/cancel", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 1 }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE (state priority beats business_fiscal even though deposit 1 < 2400)"
            - "HTTP status 409"

      - name: window_expired_beats_unconfirmed_reservation
        grounds:
          - validations[priority=8]
          - validations[priority=26]
        distinguishing_aspect: |
          Category pair business_temporal vs business_referential: booking into
          an expired window against a DRAFT reservation violates both; the
          temporal error (priority 8) must win over
          ERR_RESERVATION_NOT_CONFIRMED (priority 26).
        test_recipe:
          setup:
            - "Pickup window 2026-12-01 10:00-12:00 exists; clock advanced to 2026-12-02 (window expired)"
            - "Reservation left in DRAFT (never confirmed)"
          setup_api_calls:
            - { call: "POST /shop/pickup-windows", payload: { service_date: "2026-12-01", start_time: "10:00", end_time: "12:00", location_label: "CANYON", van_capacity: 4 }, as: Manager, captures: { win: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Tem Poral", email: "temp@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-05", end_date: "2026-12-06", pickup_method: "SLOPE_SIDE" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-02T00:00:01Z" }, as: Manager }
          trigger:
            - { call: "POST /shop/pickup-bookings", payload: { pickup_window_id: "${win}", reservation_id: "${res}" }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_WINDOW_EXPIRED (temporal priority beats referential)"
            - "HTTP status 422"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: junior_age_boundary_at_season_start
        grounds:
          - validations[priority=22]
          - entities.SeasonLease.fields.junior_customer_id
        distinguishing_aspect: |
          Metric: age in full years at season start. Age exactly 12 (birthday
          the day after season start) is accepted; age exactly 13 (birthday ON
          season start) is rejected — a one-day flip on POST /shop/season-leases.
        test_recipe:
          setup:
            - "Adult guardian; junior_ok born 2013-11-02 (12 on 2026-11-01); junior_no born 2013-11-01 (exactly 13 on 2026-11-01)"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Gua Rdian", email: "g@x.com", date_of_birth: "1980-03-10", height_cm: 182, weight_kg: 84, boot_sole_mm: 305, skier_type: "TYPE_2" }, as: FrontDesk, captures: { gua: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Kid Ok", email: "kok@x.com", date_of_birth: "2013-11-02", height_cm: 145, weight_kg: 42, boot_sole_mm: 262, skier_type: "TYPE_1" }, as: FrontDesk, captures: { jok: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Kid No", email: "kno@x.com", date_of_birth: "2013-11-01", height_cm: 148, weight_kg: 44, boot_sole_mm: 264, skier_type: "TYPE_1" }, as: FrontDesk, captures: { jno: "$.data.id" } }
          trigger:
            - { call: "POST /shop/season-leases", payload: { junior_customer_id: "${jok}", guardian_customer_id: "${gua}", season_start_date: "2026-11-01", season_end_date: "2027-03-31", package_tier: "JUNIOR_SKI", deposit_cents: 10000 }, as: FrontDesk, captures: { lease_ok: "$.data.id" } }
            - { call: "POST /shop/season-leases", payload: { junior_customer_id: "${jno}", guardian_customer_id: "${gua}", season_start_date: "2026-11-01", season_end_date: "2027-03-31", package_tier: "JUNIOR_SKI", deposit_cents: 10000 }, as: FrontDesk, captures: { err: "$.data.error_id" } }
          assert:
            - "SeasonLease.${lease_ok} created with status DRAFT (age 12 accepted)"
            - "${err} == ERR_JUNIOR_AGE_EXCEEDED (age exactly 13 rejected; boundary is <= 12)"

      - name: rush_capacity_exact_fit_boundary
        grounds:
          - calculations.turnaround_scheduling
          - validations[priority=17]
        distinguishing_aspect: |
          Metric: rush labor minutes on a ShopDayCapacity row. A ticket whose
          labor exactly equals the remaining rush pool (120 == 120, >= boundary
          inclusive) is accepted; one more 45-minute ticket overflows and is
          rejected — a different metric and endpoint than the junior-age rule.
        test_recipe:
          setup:
            - "Clock 2026-12-01T09:00:00Z; capacity 2026-12-01 base 480 / rush 120"
            - "Rush ticket 1 with services [BASE_GRIND, BINDING_ADJUST] (labor 90+30=120) exactly fills the rush pool"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/shop-day-capacity", payload: { service_date: "2026-12-01", base_labor_minutes: 480, rush_reserved_minutes: 120 }, as: Manager, captures: { cap: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Rush Hour", email: "rush@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/tune-tickets", payload: { customer_id: "${cust}", own_gear_description: "race skis", services: ["BASE_GRIND", "BINDING_ADJUST"], rush: true }, as: Customer, as_user_id: "${cust}", captures: { t1: "$.data.id", p1: "$.data.promised_at" } }
          trigger:
            - { call: "POST /shop/tune-tickets", payload: { customer_id: "${cust}", own_gear_description: "pow board", services: ["WAX"], rush: true }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "TuneTicket.${t1} created (120 <= 120 exact fit allowed) with promised_at == 2026-12-02T09:00:00Z (rush 24h)"
            - "${err} == ERR_RUSH_CAPACITY_EXCEEDED (120 + 45 > 120)"
            - "ShopDayCapacity.${cap}.rush_booked_minutes == 120"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pickup_booking_requires_confirmed_reservation
        grounds:
          - validations[priority=26]
          - state_machines.PickupBooking
        distinguishing_aspect: |
          Entity pair PickupBooking -> Reservation: booking creation is gated on
          the reservation's fulfillment_status being CONFIRMED; DRAFT is
          rejected, CONFIRMED succeeds.
        test_recipe:
          setup:
            - "Future window 2026-12-20 10:00-12:00 (default clock 2026-05-01 keeps it unexpired)"
            - "Reservation 2026-12-20..2026-12-21 in DRAFT, then driven to CONFIRMED (item assigned, deposit 1600 = exact 20% of 8000)"
          setup_api_calls:
            - { call: "POST /shop/pickup-windows", payload: { service_date: "2026-12-20", start_time: "10:00", end_time: "12:00", location_label: "CANYON", van_capacity: 4 }, as: Manager, captures: { win: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Slope Side", email: "slope@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-20", end_date: "2026-12-21", pickup_method: "SLOPE_SIDE" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
          trigger:
            - { call: "POST /shop/pickup-bookings", payload: { pickup_window_id: "${win}", reservation_id: "${res}" }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 1600 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /shop/pickup-bookings", payload: { pickup_window_id: "${win}", reservation_id: "${res}" }, as: Customer, as_user_id: "${cust}", captures: { bk: "$.data.id", bst: "$.data.status" } }
          assert:
            - "First booking attempt: ${err} == ERR_RESERVATION_NOT_CONFIRMED"
            - "After confirm: ${bst} == BOOKED and PickupWindow.${win}.booked_count == 1"

      - name: purchase_requires_redeemable_demo_credit
        grounds:
          - validations[priority=29]
          - state_machines.DemoCredit.ACTIVE_to_REDEEMED
        distinguishing_aspect: |
          Entity pair PurchaseOrder -> DemoCredit (different pair than
          PickupBooking -> Reservation): a credit already REDEEMED by a paid
          purchase cannot be applied to a second purchase.
        test_recipe:
          setup:
            - "Customer with one ACTIVE demo credit (fee 5000 -> credit 5000, expires 2027-03-01)"
            - "PO1 on demo unit D2 (price 50000 -> list 37500, cap 11250, applied 5000, due 32500) is PAID, redeeming the credit"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Demo Dan", email: "demo@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SNOWBOARD", size_label: "156cm", tier: "DEMO", din_min: 2, din_max: 10, purchase_price_cents: 50000, base_daily_rate_cents: 5000 }, as: Manager, captures: { d1: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SNOWBOARD", size_label: "158cm", tier: "DEMO", din_min: 2, din_max: 10, purchase_price_cents: 50000, base_daily_rate_cents: 5000 }, as: Manager, captures: { d2: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SNOWBOARD", size_label: "160cm", tier: "DEMO", din_min: 2, din_max: 10, purchase_price_cents: 50000, base_daily_rate_cents: 5000 }, as: Manager, captures: { d3: "$.data.id" } }
            - { call: "POST /shop/demo-credits", payload: { customer_id: "${cust}", equipment_item_id: "${d1}", demo_date: "2026-12-01", fee_paid_cents: 5000 }, as: FrontDesk, captures: { credit: "$.data.id" } }
            - { call: "POST /shop/purchase-orders", payload: { customer_id: "${cust}", equipment_item_id: "${d2}", demo_credit_id: "${credit}" }, as: Customer, as_user_id: "${cust}", captures: { po1: "$.data.id", due1: "$.data.amount_due_cents" } }
            - { call: "POST /shop/purchase-orders/${po1}/pay", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /shop/purchase-orders", payload: { customer_id: "${cust}", equipment_item_id: "${d3}", demo_credit_id: "${credit}" }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "PurchaseOrder.${po1}.amount_due_cents == 32500 (list 37500 - credit 5000)"
            - "${err} == ERR_DEMO_CREDIT_NOT_REDEEMABLE (credit REDEEMED by the paid PO1)"
            - "DemoCredit.${credit}.status == REDEEMED"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: equipment_window_gap_overlap_rule
        grounds:
          - validations[priority=13]
          - entities.ReservationItem.fields.equipment_item_id
        distinguishing_aspect: |
          Interval semantics: closed day-granularity date windows with a
          mandatory 1 free day between bookings on the same EquipmentItem —
          start 2026-12-13 after a 12-10..12-12 window collides (gap day), while
          2026-12-14 is accepted.
        test_recipe:
          setup:
            - "One SKI STANDARD unit U assigned to R1 (2026-12-10..2026-12-12)"
            - "R2 requests 2026-12-13..2026-12-15 (starts on the mandatory gap day); R3 requests 2026-12-14..2026-12-16"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Gap Year", email: "gap@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { r1: "$.data.id" } }
            - { call: "POST /shop/reservations/${r1}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { i1: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${i1}/assign", payload: { preferred_equipment_item_id: "${unit}" }, as: FrontDesk }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-13", end_date: "2026-12-15", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { r2: "$.data.id" } }
            - { call: "POST /shop/reservations/${r2}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { i2: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-14", end_date: "2026-12-16", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { r3: "$.data.id" } }
            - { call: "POST /shop/reservations/${r3}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { i3: "$.data.id" } }
          trigger:
            - { call: "POST /shop/reservation-items/${i2}/assign", payload: { preferred_equipment_item_id: "${unit}" }, as: FrontDesk, captures: { err: "$.data.error_id" } }
            - { call: "POST /shop/reservation-items/${i3}/assign", payload: { preferred_equipment_item_id: "${unit}" }, as: FrontDesk, captures: { a3: "$.data.status" } }
          assert:
            - "${err} == ERR_EQUIPMENT_OCCUPANCY_CONFLICT (2026-12-13 start violates the 1-free-day gap after 2026-12-12)"
            - "${a3} == ASSIGNED on unit ${unit} (2026-12-14 start satisfies new_start > prior_end + 1 day)"
            - "EquipmentItem.${unit}.status == RESERVED"

      - name: pickup_window_half_open_overlap_rule
        grounds:
          - validations[priority=14]
          - entities.PickupWindow.fields.posture
        distinguishing_aspect: |
          Different interval semantics on a different resource: PickupWindows at
          one location are half-open minute-granularity intervals — adjacency
          (12:00 == 12:00) is allowed with zero buffer, while a strict 30-minute
          overlap is rejected; a different location is unaffected.
        test_recipe:
          setup:
            - "Window W1 CANYON 2026-12-20 10:00-12:00 capacity 4 exists"
          setup_api_calls:
            - { call: "POST /shop/pickup-windows", payload: { service_date: "2026-12-20", start_time: "10:00", end_time: "12:00", location_label: "CANYON", van_capacity: 4 }, as: Manager, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /shop/pickup-windows", payload: { service_date: "2026-12-20", start_time: "12:00", end_time: "14:00", location_label: "CANYON", van_capacity: 4 }, as: Manager, captures: { w2: "$.data.id" } }
            - { call: "POST /shop/pickup-windows", payload: { service_date: "2026-12-20", start_time: "11:30", end_time: "13:00", location_label: "CANYON", van_capacity: 4 }, as: Manager, captures: { err: "$.data.error_id" } }
            - { call: "POST /shop/pickup-windows", payload: { service_date: "2026-12-20", start_time: "11:30", end_time: "13:00", location_label: "SUMMIT", van_capacity: 4 }, as: Manager, captures: { w4: "$.data.id" } }
          assert:
            - "W2 created (half-open adjacency at 12:00 allowed, no buffer required)"
            - "${err} == ERR_WINDOW_OVERLAP (11:30-13:00 strictly overlaps both W1 and W2 at CANYON)"
            - "W4 created (overlap scope is per location_label)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: deposit_capture_release_conservation
        grounds:
          - calculations.deposit_settlement
          - entities.Reservation.fields.deposit_captured_cents
          - entities.Reservation.fields.deposit_released_cents
        distinguishing_aspect: |
          Conserved quantity: money. The forward capture (damage invoice) paired
          with the compensating release (close) must leave
          deposit_authorized == deposit_captured + deposit_released exactly:
          5000 == 2000 + 3000.
        test_recipe:
          setup:
            - "Reservation 2026-12-10..12-12 on a 20000-price unit (rate 3000 -> quoted 9000), deposit authorized 5000 (above the 1800 minimum)"
            - "On-time return; COSMETIC damage charge 2000 invoiced (captures 2000 of the deposit); unit inspected PASS"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Dep O Sit", email: "dep@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "160cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 20000, base_daily_rate_cents: 3000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 5000 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T17:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/return", payload: {}, as: FrontDesk }
            - { call: "POST /shop/damage-assessments", payload: { reservation_id: "${res}", equipment_item_id: "${unit}", severity: "COSMETIC" }, as: Technician, captures: { dmg: "$.data.id" } }
            - { call: "POST /shop/damage-assessments/${dmg}/invoice", payload: {}, as: FrontDesk, captures: { capd: "$.data.deposit_captured_cents" } }
            - { call: "POST /shop/equipment-items/${unit}/inspect", payload: { outcome: "PASS" }, as: Technician }
          trigger:
            - { call: "POST /shop/reservations/${res}/close", payload: {}, as: FrontDesk, captures: { rel: "$.data.deposit_released_cents", cap2: "$.data.deposit_captured_cents", auth: "$.data.deposit_authorized_cents" } }
          assert:
            - "${auth} == 5000 and ${cap2} == 2000 and ${rel} == 3000"
            - "Invariant: ${auth} == ${cap2} + ${rel} (5000 == 2000 + 3000)"
            - "DamageAssessment.${dmg}.deposit_captured_cents == 2000 and remainder_due_cents == 0"
            - "Reservation.${res}.payment_status == SETTLED"

      - name: fleet_status_bucket_conservation
        grounds:
          - state_machines.EquipmentItem.AVAILABLE_to_RESERVED
          - state_machines.EquipmentItem.RESERVED_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity: fleet unit count (a different quantity than deposit
          money). Assign paired with its compensating release moves exactly one
          unit between status buckets; the total across all statuses stays 3.
        test_recipe:
          setup:
            - "Three SKI STANDARD units; one reservation item assigned to the oldest unit"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Fleet Count", email: "fleet@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "168cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { u1: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "169cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { u2: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { u3: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "GET /shop/equipment-items?status=RESERVED", payload: {}, as: FrontDesk }
          trigger:
            - { call: "POST /shop/reservation-items/${item}/release", payload: {}, as: FrontDesk }
            - { call: "GET /shop/equipment-items?status=AVAILABLE", payload: {}, as: FrontDesk }
            - { call: "GET /shop/equipment-items?status=RESERVED", payload: {}, as: FrontDesk }
          assert:
            - "After assign: GET ?status=RESERVED total_count == 1 and ?status=AVAILABLE total_count == 2"
            - "After release (compensating action): ?status=AVAILABLE total_count == 3 and ?status=RESERVED total_count == 0"
            - "Invariant: sum of units across all status buckets == 3 before, between, and after the assign/release pair"
