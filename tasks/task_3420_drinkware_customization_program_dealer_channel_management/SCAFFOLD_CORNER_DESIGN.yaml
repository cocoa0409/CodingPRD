              as: CustomerCare
              as_user_id: "cc-1"
          assert:
            - "err_mm == ERR_RETURN_RESOLUTION_MISMATCH (422): ARTWORK_MISMATCH admits only FULL_REFUND or REMAKE"
            - "err_qq == ERR_RETURN_RESOLUTION_MISMATCH (422): affected_unit_count == quantity (10) cannot be PARTIAL_CREDIT"
            - "FULL_REFUND then succeeds: CustomizationOrder.${order_q}.refund_cents == 38000, payment_status == REFUNDED, return_status == RETURN_SETTLED"
            - "CustomizationOrder.${order_m}.return_status stays RETURN_REQUESTED after its rejected decide"

      - name: peak_slot_reserve_requires_approved_art
        claim_type: Conditional validation
        grounds:
          - validations[priority=7]
          - errors.ERR_ARTWORK_NOT_APPROVED
          - entities.PrintSlot.fields.peak_overlap
        distinguishing_aspect: "The seasonal-peak gate is conditional on the slot: the same unsubmitted-art order reserving an OFF-peak slot succeeds (canonical instances) while a peak-overlapping slot (2026-11-02, inside the corporate-gifting window) is 409 ERR_ARTWORK_NOT_APPROVED until the proof is approved."
        test_recipe:
          setup:
            - "Clock set; canonical line/drop; peak LASER slot L-PEAK (2026-11-02 09:00-12:00, capacity 180); order submitted, art NOT yet approved."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-PEAK", technology: "LASER", window_start: "2026-11-02T09:00:00Z", window_end: "2026-11-02T12:00:00Z", capacity_minutes: 180 }
              as: ProductionLead
              captures: { slot_peak: $.data.id }
            - *c_order
            - *c_submit
          trigger:
            - call: "POST /drinkware/customization-orders/${c_order}/reserve-slot"
              payload: { slot_id: "${slot_peak}" }
              as: Buyer
              as_user_id: "buyer-std"
              captures: { err_peak: $.data.error_id }
            - *c_proof
            - *c_approve
            - call: "POST /drinkware/customization-orders/${c_order}/reserve-slot"
              payload: { slot_id: "${slot_peak}" }
              as: Buyer
              as_user_id: "buyer-std"
          assert:
            - "PrintSlot.${slot_peak}.peak_overlap == true (window intersects [2026-10-15, 2026-12-21))"
            - "err_peak == ERR_ARTWORK_NOT_APPROVED (409) while artwork_status was NO_ART"
            - "after approval the identical reserve succeeds: reservation_status == CONFIRMED and schedule_status == CONFIRMED (art already approved -> atomic confirm at reserve time)"

      - name: remake_rebooks_capacity_or_fails
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_CAPACITY_EXCEEDED
          - state_machines.CustomizationOrder.return_status
        distinguishing_aspect: "A REMAKE settlement re-books the full reserved_minutes on the same slot: with 0 available it is 422 ERR_CAPACITY_EXCEEDED and the return stays RETURN_REQUESTED; after a sibling order releases 140 minutes the identical decide succeeds, re-books exactly 40 minutes, and loops the order back to CONFIRMED."
        test_recipe:
          setup:
            - "Canonical order COMPLETE (40 minutes CONSUMED, slot booked 40). Second order qty 35 LASER (140 minutes) HELD on the same slot (booked 180 = capacity). DEFECT return (1 unit) requested on the first order."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - *c_slot
            - *c_order
            - *c_submit
            - *c_reserve
            - *c_proof
            - *c_approve
            - *c_lock
            - *c_start
            - *c_complete
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-fill", product_line_id: "${c_line}", colorway_drop_id: "${c_drop}", quantity: 35, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-18T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-fill"
              captures: { order_fill: $.data.id }
            - call: "POST /drinkware/customization-orders/${order_fill}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-fill"
            - call: "POST /drinkware/customization-orders/${order_fill}/reserve-slot"
              payload: { slot_id: "${c_slot}" }
              as: Buyer
              as_user_id: "buyer-fill"
            - call: "POST /drinkware/customization-orders/${c_order}/request-return"
              payload: { reason: "DEFECT", affected_unit_count: 1 }
              as: Buyer
              as_user_id: "buyer-std"
          trigger:
            - call: "POST /drinkware/customization-orders/${c_order}/decide-return"
              payload: { decision: "APPROVE", resolution: "REMAKE", decision_notes: "reprint the scuffed unit" }
              as: CustomerCare
              as_user_id: "cc-1"
              captures: { err_remake: $.data.error_id }
            - call: "POST /drinkware/customization-orders/${order_fill}/release-slot"
              payload: {}
              as: Buyer
              as_user_id: "buyer-fill"
            - call: "POST /drinkware/customization-orders/${c_order}/decide-return"
              payload: { decision: "APPROVE", resolution: "REMAKE", decision_notes: "reprint the scuffed unit" }
              as: CustomerCare
              as_user_id: "cc-1"
          assert:
            - "err_remake == ERR_CAPACITY_EXCEEDED (422): available 0 < reserved_minutes 40; return_status stays RETURN_REQUESTED"
            - "after the release frees 140 minutes, the retry succeeds: return_status == RETURN_SETTLED"
            - "CustomizationOrder.${c_order}: schedule_status == CONFIRMED and reservation_status == HELD (rework loop re-armed)"
            - "PrintSlot.${c_slot}.booked_minutes == 80 (40 consumed + 40 re-booked) and available_minutes == 100"

      - name: slot_capacity_exceeds_window_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_CAPACITY_EXCEEDS_WINDOW
        distinguishing_aspect: "capacity_minutes is bounded by the window's actual duration: a 60-minute window declaring capacity 200 is 422 ERR_CAPACITY_EXCEEDS_WINDOW — on a fresh station with no overlap in play, so the constraint (not the temporal rule) fires."
        test_recipe:
          setup:
            - "Clock set; no slots on station L-SOLO."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-SOLO", technology: "LASER", window_start: "2026-09-12T09:00:00Z", window_end: "2026-09-12T10:00:00Z", capacity_minutes: 200 }
              as: ProductionLead
              captures: { err_capwin: $.data.error_id }
          assert:
            - "err_capwin == ERR_CAPACITY_EXCEEDS_WINDOW (422)"
            - "GET /drinkware/print-slots?station_code=L-SOLO returns 0 rows"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: cancel_after_art_approval_charges_ten_percent_fee
        claim_type: Side Effect Execution
        grounds:
          - endpoints.POST_/drinkware/customization-orders/{id}/cancel
          - calculations.return_refund_cents
          - calculations.slot_capacity_ledger
        distinguishing_aspect: "Cancelling after art approval bills exactly 10% of the FINAL quote (3800c on 38000c), refunds 0 because payment was only AUTHORIZED, voids the payment to REFUNDED, and frees the 40 booked minutes back to the slot (booked 40 -> 0)."
        test_recipe:
          setup:
            - "Canonical order submitted, reserved on the canonical slot, proof approved (final_quote_cents == 38000, reservation CONFIRMED)."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - *c_slot
            - *c_order
            - *c_submit
            - *c_reserve
            - *c_proof
            - *c_approve
          trigger:
            - call: "POST /drinkware/customization-orders/${c_order}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "buyer-std"
          assert:
            - "CustomizationOrder.${c_order}.cancellation_fee_cents == 3800 (round_half_up(38000 x 0.10))"
            - "refund_cents == 0 (authorization voided; nothing captured to refund)"
            - "order_state == CANCELLED and payment_status == REFUNDED"
            - "PrintSlot.${c_slot}.booked_minutes == 0 and available_minutes == 180 (release cascade with empty waitlist is a no-op)"
            - "a second cancel is 409 ERR_INVALID_STATE_TRANSITION (terminal order_state)"

      - name: proof_approve_cascade_confirms_reservation
        claim_type: Side Effect Execution
        grounds:
          - endpoints.POST_/drinkware/artwork-proofs/{id}/approve
        excluded_because:
          difficulty_instance: provisional_vs_final_quote_diverges_on_approved_artwork
          rationale: "That instance asserts the approval cascade end-to-end: FINAL quote computed, peak_applied recomputed from the slot, and HELD -> CONFIRMED reservation confirmation."

      - name: drop_ledger_read_recomputes_from_allocations
        claim_type: Computed read
        grounds:
          - endpoints.GET_/drinkware/colorway-drops/{id}
        excluded_because:
          difficulty_instance: lock_then_forfeit_restores_drop_units_exactly
          rationale: "That instance reads dealer_committed_units / unallocated_units after both lock and forfeit, which is the computed-read claim with exact literals."

