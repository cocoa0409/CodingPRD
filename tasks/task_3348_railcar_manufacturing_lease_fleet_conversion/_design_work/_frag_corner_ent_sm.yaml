        grounds:
          - state_machines.CarAssignment.ACTIVE_to_SUSPENDED
          - entities.LeaseContract.fields.status
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / suspend_assignment_gated_on_contract_status
          rationale: "The 'governing LeaseContract.status == ACTIVE' precondition on suspend is asserted by that §1.8 instance, which drives the contract to AMENDMENT_DRAFTED and pins the 409 ERR_INVALID_STATE rejection before the identical call succeeds."

      - name: lease_fleet_car_sold_held_void_cycle_covered_by_1_8
        claim_type: Valid Transition
        grounds:
          - state_machines.LeaseFleetCar.SOLD_to_HELD
          - state_machines.LeaseFleetSale.PENDING_SETTLEMENT_to_VOIDED
        excluded_because:
          difficulty_instance: non_linear_state_machine / lease_fleet_car_sold_held_void_cycle
          rationale: "The compensating re-entry SOLD -> HELD through POST /lease-fleet-sales/{id}/void — the one legal out-transition from a declared terminal state — is asserted by that §1.8 instance, which also pins priority 6's deliberate omission of the void endpoint."

      - name: lease_fleet_car_settle_returns_valid_transition_covered_by_1_8
        claim_type: Valid Transition
        grounds:
          - state_machines.LeaseFleetCar.UNDER_REPAIR_to_HELD
          - validations[priority=23]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settle_returns_gated_on_car_return_settlement
          rationale: "The UNDER_REPAIR -> HELD success path through POST /lease-fleet-cars/{id}/settle-returns, including the requirement that every CarReturn already be SETTLED, is asserted as that §1.8 instance's gated failure and subsequent 200."

      - name: car_assignment_placement_buffer_covered_by_1_8
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LeaseFleetCar.HELD_to_ASSIGNED
          - validations[priority=11]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / placement_interval_one_day_buffer_boundary
          rationale: "The rejection of a placement that violates the mandatory one-day gap buffer on the same car is asserted by that §1.8 instance, which pins [2026-10-17, 2026-11-16) to 409 ERR_ASSIGNMENT_OVERLAP while [2026-10-18, 2026-11-17) is accepted."

      - name: retrofit_work_order_shop_window_overlap_covered_by_1_8
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RetrofitWorkOrder.SCHEDULED_to_IN_PROGRESS
          - validations[priority=10]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / shop_line_half_open_touching_windows_allowed
          rationale: "The half-open shop-line collision rule — touching windows accepted, overlapping windows rejected with 409 ERR_SHOP_SLOT_OVERLAP — is asserted by that §1.8 instance on SHOP-R8A, so the work-order scheduling rejection is already realised."

      - name: portfolio_ledger_settle_side_effect_covered_by_1_8
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PortfolioLedger.OPEN_to_OPEN
          - entities.LeaseFleetSale.fields.gain_loss_cents
        excluded_because:
          difficulty_instance: transitive_cascade / sale_settlement_realized_gain_cascade
          rationale: "The ledger hop that fires when a PENDING_SETTLEMENT sale settles — realized_gain_cents moving by exactly the sale's gain_loss_cents — is asserted as that §1.8 instance's depth-2 cascade."

      - name: production_order_reserve_cancel_stock_conservation_covered_by_1_8
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ProductionOrder.COMPONENT_RESERVED_to_CANCELLED
          - calculations.component_allocation
        excluded_because:
          difficulty_instance: compensating_invariant / reserve_cancel_conserves_component_on_hand
          rationale: "The reserve-then-cancel side effects (on_hand_qty restored to its exact pre-reservation count, reserved_qty legitimately left unchanged) are asserted end-to-end by that §1.8 instance."

      - name: substitution_endorsement_patch_after_superseded_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SubstitutionEndorsement.REJECTED_to_PENDING
          - entities.SubstitutionEndorsement.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SUPERSEDED is terminal (the REJECTED -> PENDING retry cycle does not reach it), so PATCHing a superseded endorsement returns 409 ERR_INVALID_STATE with the row still SUPERSEDED and the newer endorsement still PENDING."
        test_recipe:
          setup:
            - "Empty DB; two endorsements raised against the same order for the same original component, so the first was auto-superseded by the second."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "LINE-A" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-500", component_class: "WHEELSET", unit_cost_cents: 200000, lead_time_days: 10 }
              as: SupplyChainCoordinator
              captures: { ws500_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "CS-600", component_class: "CASTING", unit_cost_cents: 150000, lead_time_days: 20 }
              as: SupplyChainCoordinator
              captures: { cs600_id: $.data.id }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 1, planned_shop_days: 10, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-11-30" }
              as: ProductionPlanner
              captures: { po_id: $.data.id, po_v: $.data.version }
            - call: "POST /api/v1/substitution-endorsements"
              payload: { production_order_id: "${po_id}", original_component_id: "${ws500_id}", substitute_component_id: "${cs600_id}", substitute_qty_per_car: 2, decides_material: false, expected_production_order_version: "${po_v}" }
              as: ProductionPlanner
              as_user_id: "user-planner-7"
              captures: { se_first_id: $.data.id }
            - call: "GET /api/v1/production-orders/${po_id}"
              payload: {}
              as: PlatformAdmin
              captures: { po_v2: $.data.version }
            - call: "POST /api/v1/substitution-endorsements"
              payload: { production_order_id: "${po_id}", original_component_id: "${ws500_id}", substitute_component_id: "${cs600_id}", substitute_qty_per_car: 3, decides_material: false, expected_production_order_version: "${po_v2}" }
              as: ProductionPlanner
              as_user_id: "user-planner-7"
              captures: { se_second_id: $.data.id }
          trigger:
            - call: "PATCH /api/v1/substitution-endorsements/${se_first_id}"
              payload: { status: "REJECTED" }
              as: LeaseAdministrator
              as_user_id: "user-lease-3"
              captures: { err_id: $.data.error_id }
            - call: "GET /api/v1/substitution-endorsements/${se_first_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/v1/substitution-endorsements/${se_second_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "SubstitutionEndorsement.${se_first_id}.status == \"SUPERSEDED\" after the second endorsement is raised"
            - "PATCH /substitution-endorsements/${se_first_id} on the SUPERSEDED row returns HTTP 409"
            - "error_id == \"ERR_INVALID_STATE\""
            - "SubstitutionEndorsement.${se_first_id}.status == \"SUPERSEDED\" (unchanged)"
            - "SubstitutionEndorsement.${se_second_id}.status == \"PENDING\" (the live endorsement is untouched)"
