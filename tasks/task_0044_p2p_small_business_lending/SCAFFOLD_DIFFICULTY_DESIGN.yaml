  # =================================================================
  # Rule 5 — Validation priority conflicts across different category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_segregation_vs_grade_state_pair
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.LoanApplication.SCORED_to_APPROVED
        distinguishing_aspect: >
          A single approve request on an F-grade application by the SAME underwriter
          who scored it violates both business_safety/segregation (priority 5) and
          business_safety/grade (priority 6); priority 5 wins → ERR_SEGREGATION_OF_DUTIES,
          not ERR_GRADE_NOT_FUNDABLE.
        test_recipe:
          setup:
            - "An F-grade application scored by underwriter uw_scorer."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "Conflict F", ein: "55-0000001", state_code: "WA" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 300000, plaid_monthly_debt_payment_cents: 2000000, plaid_nsf_count_90d: 6, plaid_account_age_months: 6 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
          trigger:
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: investment_funding_constraint_vs_diversification_fiscal_pair
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - state_machines.Loan.FUNDING_to_ACTIVE
        distinguishing_aspect: >
          A single investment that both over-subscribes the loan
          (business_constraint, priority 10 ERR_FUNDING_EXCEEDED) and breaches the
          investor diversification cap (business_fiscal, priority 12
          ERR_DIVERSIFICATION_BREACH) returns the higher-priority constraint error
          ERR_FUNDING_EXCEEDED — a different category pair than instance 1.
        test_recipe:
          setup:
            - "Loan L principal 1,200,000 already funded to 1,000,000 by investor Z; investor W has capital_base 1,000,000 and default cap 0.25; W attempts to commit 300000 which both over-funds the loan (1,000,000+300000 > 1,200,000) and breaches the cap (300000 > 0.25*1,000,000=250000)."
          setup_api_calls:
