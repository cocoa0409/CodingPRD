scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: stylist_payout_commission_vs_booth_rent
        grounds:
          - calculations.stylist_service_earning
          - entities.Stylist.fields.compensation_model
          - entities.Checkout.fields.stylist_service_earning_cents
          - entities.Checkout.fields.salon_service_earning_cents
        distinguishing_aspect: |
          On the Stylist entity domain, identical service_revenue_cents=10000 yields stylist 4000 / salon 6000
          under COMMISSION (0.40) but stylist 8500 / salon 1500 under BOOTH_RENT (rent 1500) — two valid payout
          algorithms, divergent results.
        test_recipe:
          setup:
            - "Salon (DIRECT tip policy) with one COMMISSION stylist (commission_pct 0.40) and one BOOTH_RENT stylist (rent 1500)."
            - "Two ACTIVE chairs, one Service base 10000 (no deposit), one non-member client."
            - "Clock advanced to 2026-07-01T12:00:00Z so two appointments at 13:00 (different stylists/chairs) are completable."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Glow Bar", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "Comm Stylist", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st_comm: $.data.id, st_comm_v: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "Booth Stylist", compensation_model: "BOOTH_RENT", booth_rent_per_appt_cents: 1500, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st_booth: $.data.id, st_booth_v: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair 1", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { ch1: $.data.id }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair 2", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { ch2: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 10000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Pat", email: "pat@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st_comm}", resource_id: "${ch1}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st_comm_v}" }
              as: FrontDesk
              captures: { appt_comm: $.data.id }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st_booth}", resource_id: "${ch2}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st_booth_v}" }
              as: FrontDesk
              captures: { appt_booth: $.data.id }
          trigger:
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt_comm}", tip_cents: 0 }
              as: FrontDesk
              captures: { co_comm: $.data.id }
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt_booth}", tip_cents: 0 }
              as: FrontDesk
              captures: { co_booth: $.data.id }
          assert:
            - "Checkout.${co_comm}.service_revenue_cents == 10000"
            - "Checkout.${co_comm}.stylist_service_earning_cents == 4000"
            - "Checkout.${co_comm}.salon_service_earning_cents == 6000"
            - "Checkout.${co_booth}.stylist_service_earning_cents == 8500"
            - "Checkout.${co_booth}.salon_service_earning_cents == 1500"

      - name: appointment_quote_member_vs_non_member
        grounds:
          - calculations.appointment_service_quote
          - entities.Appointment.fields.quoted_service_price_cents
          - entities.Membership.fields.status
          - validations[priority=7]
        distinguishing_aspect: |
          On the Appointment pricing domain (different entity from stylist payout), the SAME Service base 10000
          quotes 8000 when the client has an ACTIVE Gold membership (20% off) but 10000 when the client has no
          ACTIVE membership — two valid quoting paths, divergent snapshot frozen at booking.
        test_recipe:
          setup:
            - "Salon, one ACTIVE stylist (buffer 0), one chair, Service base 10000 deposit 0."
            - "MembershipPlan Gold (service_discount_pct 0.20); member client enrolled ACTIVE; a second non-member client."
            - "Clock at 2026-07-01T12:00:00Z; both appointments at 14:00 on the same stylist/chair are sequential in setup (member booked, then completed/cancelled is not needed — separate stylists used)."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Quote Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S2", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st2: $.data.id, st2_v: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair B", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chB: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Color", duration_minutes: 60, base_price_cents: 10000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /membership-plans"
              payload: { salon_id: "${sid}", name: "Gold", monthly_fee_cents: 5000, service_discount_pct: 0.20, retail_discount_pct: 0.0 }
              as: SalonOwner
              captures: { plan: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Mem Client", email: "mem@x.com" }
              as: FrontDesk
              captures: { cli_mem: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Non Client", email: "non@x.com" }
              as: FrontDesk
              captures: { cli_non: $.data.id }
            - call: "POST /memberships"
              payload: { client_id: "${cli_mem}", plan_id: "${plan}" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli_mem}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T14:00:00Z", expected_stylist_version: "${st1_v}" }
              as: FrontDesk
              captures: { appt_mem: $.data.id }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli_non}", stylist_id: "${st2}", resource_id: "${chB}", service_id: "${svc}", start_utc: "2026-07-01T14:00:00Z", expected_stylist_version: "${st2_v}" }
              as: FrontDesk
              captures: { appt_non: $.data.id }
          assert:
            - "Appointment.${appt_mem}.quoted_service_price_cents == 8000"
            - "Appointment.${appt_non}.quoted_service_price_cents == 10000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: retail_line_round_per_line_then_sum
        grounds:
          - calculations.retail_line_total
          - entities.ProductSale.fields.line_total_cents
          - entities.Checkout.fields.retail_revenue_cents
          - entities.MembershipPlan.fields.retail_discount_pct
        distinguishing_aspect: |
          Mode (b) nested rounding: two retail lines with 15% member discount round PER LINE then sum
          (rhu(2000*0.85)*3=5100, rhu(999*0.85)*1=849, total 5949). Summing-then-rounding the discount would
          differ; the scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "Salon, ACTIVE stylist buffer 0, chair, Service base 0 deposit 0."
            - "MembershipPlan with retail_discount_pct 0.15; client enrolled ACTIVE."
            - "Two SKUs: unit 2000 qty 10, unit 999 qty 10. Clock at 12:00; appointment at 13:00 completed with two retail lines."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Retail Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Trim", duration_minutes: 30, base_price_cents: 0, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /membership-plans"
              payload: { salon_id: "${sid}", name: "Silver", monthly_fee_cents: 3000, service_discount_pct: 0.0, retail_discount_pct: 0.15 }
              as: SalonOwner
              captures: { plan: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Buyer", email: "buyer@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /memberships"
              payload: { client_id: "${cli}", plan_id: "${plan}" }
              as: FrontDesk
            - call: "POST /product-skus"
              payload: { salon_id: "${sid}", sku: "SH-1", name: "Shampoo", unit_price_cents: 2000, qty_on_hand: 10 }
              as: SalonOwner
              captures: { sku1: $.data.id }
            - call: "POST /product-skus"
              payload: { salon_id: "${sid}", sku: "OL-1", name: "Oil", unit_price_cents: 999, qty_on_hand: 10 }
              as: SalonOwner
              captures: { sku2: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v}" }
              as: FrontDesk
              captures: { appt: $.data.id }
          trigger:
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt}", tip_cents: 0, retail_lines: [ { product_sku_id: "${sku1}", quantity: 3 }, { product_sku_id: "${sku2}", quantity: 1 } ] }
              as: FrontDesk
              captures: { co: $.data.id }
          assert:
            - "Checkout.${co}.retail_revenue_cents == 5949"

      - name: stylist_earning_multiinput_nonlinear_min_branch
        grounds:
          - calculations.stylist_service_earning
          - calculations.service_revenue_recognized
          - entities.Stylist.fields.booth_rent_per_appt_cents
          - entities.Package.fields.price_cents
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear formula: a BOOTH_RENT stylist completing a PACKAGE-redeemed appointment
          derives revenue from package_session_value (24000/4=6000), then salon=min(rent 8000, rev 6000)=6000 and
          stylist=0 — the min() clamp and the revenue-source branch interact; with rent 1500 the same revenue gives
          stylist 4500/salon 1500.
        test_recipe:
          setup:
            - "Salon, BOOTH_RENT stylist with booth_rent_per_appt_cents 8000 (intentionally above per-session value), buffer 0."
            - "Service base 9000 deposit 0; Package of 4 sessions priced 24000 (per-session 6000)."
            - "Client buys the package; clock at 12:00; appointment at 13:00 redeems a package session."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Booth Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "Booth S", compensation_model: "BOOTH_RENT", booth_rent_per_appt_cents: 8000, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Facial Lite", duration_minutes: 45, base_price_cents: 9000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /packages"
              payload: { salon_id: "${sid}", service_id: "${svc}", session_count: 4, price_cents: 24000 }
              as: SalonOwner
              captures: { pkg: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Pkg Client", email: "pkgc@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /package-purchases"
              payload: { client_id: "${cli}", package_id: "${pkg}" }
              as: FrontDesk
              captures: { pp: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v}", package_purchase_id: "${pp}" }
              as: FrontDesk
              captures: { appt: $.data.id }
          trigger:
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt}", tip_cents: 0 }
              as: FrontDesk
              captures: { co: $.data.id }
          assert:
            - "Checkout.${co}.service_revenue_cents == 6000"
            - "Checkout.${co}.salon_service_earning_cents == 6000"
            - "Checkout.${co}.stylist_service_earning_cents == 0"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_branch_divergent_side_effects
        grounds:
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - state_machines.Appointment.BOOKED_to_COMPLETED
        distinguishing_aspect: |
          Appointment branches from BOOKED into three terminal states with divergent side-effect sets: CANCELLED
          refunds the whole deposit (wallet +4000) and adds zero strikes; NO_SHOW forfeits the fee (wallet +0,
          strikes +1); COMPLETED creates a Checkout. Tested via two sibling appointments taking different branches.
        test_recipe:
          setup:
            - "Salon (no_show_fee_pct 0.50, suspend threshold 3), one stylist buffer 0, two chairs."
            - "Service base 8000 deposit_pct 0.50 (deposit 4000). Non-member client. Two appointments at 13:00."
            - "Clock advanced past 13:00 only for the NO_SHOW branch; cancel branch uses clock before start."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Branch Salon", no_show_fee_pct: 0.50, no_show_suspend_threshold: 3, tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair B", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chB: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 8000, deposit_pct: 0.50, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Cancel Client", email: "cc@x.com" }
              as: FrontDesk
              captures: { cli_c: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Noshow Client", email: "nc@x.com" }
              as: FrontDesk
              captures: { cli_n: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli_c}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt_c: $.data.id, st1_v1: "$.data.version" }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli_n}", stylist_id: "${st1}", resource_id: "${chB}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt_n: $.data.id }
            - call: "POST /appointments/${appt_c}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T13:30:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
            - call: "POST /appointments/${appt_n}/no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "Appointment.${appt_c}.status == CANCELLED"
            - "Client.${cli_c}.wallet_credit_cents == 4000"
            - "Client.${cli_c}.no_show_strikes == 0"
            - "Appointment.${appt_n}.status == NO_SHOW"
            - "Client.${cli_n}.wallet_credit_cents == 0"
            - "Client.${cli_n}.no_show_strikes == 1"

      - name: membership_active_pastdue_cycle
        grounds:
          - state_machines.Membership.ACTIVE_to_PAST_DUE
          - state_machines.Membership.PAST_DUE_to_ACTIVE
          - entities.Membership.fields.status
        distinguishing_aspect: |
          On the Membership entity (different from Appointment), status cycles ACTIVE -> PAST_DUE -> ACTIVE via
          lapse then reinstate, with the membership.version incrementing on each hop and the discount toggling off
          then back on — a true revert loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Salon, a MembershipPlan, a client enrolled ACTIVE."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Cycle Salon" }
              as: SalonOwner
              captures: { sid: $.data.id }
            - call: "POST /membership-plans"
              payload: { salon_id: "${sid}", name: "Gold", monthly_fee_cents: 5000, service_discount_pct: 0.20 }
              as: SalonOwner
              captures: { plan: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Cyc", email: "cyc@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /memberships"
              payload: { client_id: "${cli}", plan_id: "${plan}" }
              as: FrontDesk
              captures: { mem: $.data.id }
          trigger:
            - call: "POST /memberships/${mem}/lapse"
              payload: {}
              as: SalonOwner
              captures: { mem_v_pastdue: $.data.version }
            - call: "POST /memberships/${mem}/reinstate"
              payload: {}
              as: SalonOwner
              captures: { mem_v_active: $.data.version }
          assert:
            - "Membership.${mem}.status == ACTIVE"
            - "${mem_v_active} > ${mem_v_pastdue}"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: noshow_strike_triggers_auto_suspend_depth3
        grounds:
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - entities.Client.fields.no_show_strikes
          - entities.Client.fields.status
          - validations[priority=6]
        distinguishing_aspect: |
          Depth-3 cascade from a no-show trigger: no-show -> Client.no_show_strikes increments from 2 to 3 ->
          because 3 >= suspend threshold the SAME request flips Client.status ACTIVE -> SUSPENDED. The suspend is
          caused by the strike increment (the prior link), not directly by the no-show action.
        test_recipe:
          setup:
            - "Salon suspend threshold 3, no_show_fee_pct 0.0. One stylist buffer 0, one chair, Service base 5000 deposit 0."
            - "Client already carrying 2 strikes (two prior appointments no-showed). A third future appointment booked at 15:00."
            - "Clock advanced past 15:00 to enable the third no-show."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Strike Salon", no_show_suspend_threshold: 3, no_show_fee_pct: 0.0, tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Quick", duration_minutes: 15, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Repeat", email: "rep@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt1: $.data.id, st1_v1: "$.data.version" }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T14:00:00Z", expected_stylist_version: "${st1_v1}" }
              as: FrontDesk
              captures: { appt2: $.data.id, st1_v2: "$.data.version" }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T15:00:00Z", expected_stylist_version: "${st1_v2}" }
