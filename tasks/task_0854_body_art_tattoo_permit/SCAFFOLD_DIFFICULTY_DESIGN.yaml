              captures: { err: $.data.error_id }
          assert:
            - "the first session returns HTTP 201"
            - "the adjacent session starting exactly at 10:00:00Z returns HTTP 201 because the prior interval is half-open and excludes its end instant"
            - "${err} == ERR_ARTIST_SESSION_OVERLAP"
            - "the overlapping session returns HTTP 409"
            - "ProcedureLog.${pl1_id}.audit_status == RECORDED"
            - "ProcedureLog.${pl2_id}.audit_status == RECORDED"
