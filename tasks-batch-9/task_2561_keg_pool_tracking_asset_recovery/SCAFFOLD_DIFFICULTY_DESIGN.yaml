              as_user_id: "tech-2"
            - call: "POST /service-cycles"
              payload: { keg_id: "${k3_id}", service_center_id: "${sc1_id}", received_at: "2026-08-01T09:00:00Z" }
              as: ServiceTechnician
              as_user_id: "tech-1"
              captures: { cyc3_id: "$.data.id" }
          assert:
            - "after setup ServiceCenter.${sc1_id}.open_cycle_count == 1 and ServiceCycle.${cyc1_id}.stage == RECEIVED"
            - "the intake at exactly 2026-08-01T04:00:00.000Z, precisely intake_buffer_hours after cycle1, returns 409 with error_id ERR_INTAKE_WINDOW_CONFLICT: the window is CLOSED at its upper end"
            - "the intake at 2026-08-01T04:00:00.001Z, one millisecond later, returns 201 and ServiceCenter.${sc1_id}.open_cycle_count == 2"
            - "the 09:00:00Z intake is outside every window ([00:00, 04:00] and [04:00:00.001, 08:00:00.001]) yet returns 409 with error_id ERR_SERVICE_CAPACITY_EXCEEDED, because open_cycle_count 2 is not strictly below concurrent_cycle_capacity 2"
            - "the capacity refusal is the AGGREGATE check, not a pairwise one: each of the three intakes is individually admissible"
            - "after the refusal ServiceCenter.${sc1_id}.open_cycle_count is still 2 and no ServiceCycle row exists for ${k3_id}"
            - "the release chain drives ServiceCycle.${cyc1_id}.stage == RELEASED with pressure_test_performed_by_user_id == tech-1 and released_by_user_id == tech-2"
            - "after the release ServiceCenter.${sc1_id}.open_cycle_count == 1 (RELEASED cycles leave the occupancy count) and Keg.${k1_id}.custody_state == IN_FLOAT with service_state == SERVICE_OK"
            - "the byte-identical 09:00:00Z intake now returns 201 with ServiceCenter.${sc1_id}.open_cycle_count == 2, proving one release frees exactly one slot"
            - "ServiceCycle.${cyc3_id}.received_at == 2026-08-01T09:00:00Z is accepted even though cycle1's RELEASED window [00:00, 04:00] is still on file: released windows keep blocking their own interval but nothing beyond it"

  # ==========================================================================
  # RULE 9 — compensating_invariant
  # Instance (i)  conserved quantity type: KEG COUNT (a five-bucket census vector).
  # Instance (ii) conserved quantity type: MONEY (integer cents on a ledger).
  # Different quantity types, different compensating pairs, and instance (ii)
  # deliberately shows what is NOT conserved.
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pool_census_conserved_across_allocate_then_cancel
        grounds:
          - calculations.pool_census_conserved
          - calculations.pool_posture
          - calculations.float_posture
          - state_machines.IssuanceOrder.ALLOCATED_to_CANCELLED
          - state_machines.Keg.ISSUED_TO_BREWER_to_IN_FLOAT
          - entities.KegPool.fields.kegs_total
        distinguishing_aspect: |
          Conserved quantity: KEG COUNT, as a five-bucket vector whose components must always
          sum to kegs_total. The compensating pair is allocate followed by cancel, which moves
          five kegs IN_FLOAT -> ISSUED_TO_BREWER -> IN_FLOAT. Every derived reading returns to
          its exact prior value, including available_pct, posture, kegs_at_brewer_count and
          float_posture (TIGHT -> HEALTHY -> TIGHT), while only the row versions advance. This
          is a structural/count invariant, unlike instance (ii)'s money invariant.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z."
            - "Pool with exactly eight kegs, all IN_FLOAT: the pre-state census vector is (8, 8, 0, 0, 0, 0) with available_pct 100.00 and posture OPEN."
            - "Agreement float_size_kegs 10 with replenishment_threshold_pct 20 gives tight_ceiling 2, so 0 kegs at the brewer reads TIGHT and 5 reads HEALTHY — the compensating pair must restore TIGHT."
            - "One order for five kegs, created but not yet allocated."
            - "No fill ever happens, so the conditional cascade in ALLOCATED -> CANCELLED (kegs already FILLED stay with the brewer) has nothing to hold back."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO", restrict_threshold_pct: 25, freeze_threshold_pct: 10, restricted_max_kegs_per_order: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0005" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0006" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0007" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0008" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 10, per_fill_rate_cents: 2200, replenishment_threshold_pct: 20 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v1: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 5 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { io1_id: "$.data.id" }
            - call: "GET /pools/${p1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /issuance-orders/${io1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v1}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /pools/${p1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${io1_id}/cancel"
              payload: { cancel_reason: "Brewer deferred the delivery window" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /pools/${p1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "PRE: KegPool.${p1_id} reads kegs_total 8, kegs_available 8, kegs_circulating 0, kegs_servicing 0, kegs_held 0, kegs_written_off 0, available_pct 100.00, posture OPEN"
            - "PRE: FloatAgreement.${fa1_id}.kegs_at_brewer_count == 0, pending_replenishment_kegs == 10 and float_posture == TIGHT"
            - "MID: after the allocate KegPool.${p1_id} reads kegs_total 8, kegs_available 3, kegs_circulating 5, kegs_servicing 0, kegs_held 0, kegs_written_off 0, available_pct 37.50, posture OPEN"
            - "MID: FloatAgreement.${fa1_id}.kegs_at_brewer_count == 5, pending_replenishment_kegs == 5 and float_posture == HEALTHY (5 > tight_ceiling 2)"
            - "MID: IssuanceOrder.${io1_id}.status == ALLOCATED with allocated_keg_count == 5 and five distinct allocated_keg_ids"
            - "POST: after the cancel KegPool.${p1_id} reads kegs_total 8, kegs_available 8, kegs_circulating 0, kegs_servicing 0, kegs_held 0, kegs_written_off 0, available_pct 100.00, posture OPEN — byte-identical to the PRE vector"
            - "POST: FloatAgreement.${fa1_id}.kegs_at_brewer_count == 0, pending_replenishment_kegs == 10 and float_posture == TIGHT again"
            - "INVARIANT at all three observations: kegs_available + kegs_circulating + kegs_servicing + kegs_held + kegs_written_off == kegs_total == 8"
            - "POST: every one of the five kegs has custody_state == IN_FLOAT with current_brewer_id == null, issuance_order_id == null and dwell_started_at == null"
            - "POST: IssuanceOrder.${io1_id}.status == CANCELLED with cancel_reason set; FloatAgreement.${fa1_id}.kegs_issued_count == 0 and billed_amount_cents == 0"
            - "only versions moved: KegPool.${p1_id}.version and each moved Keg.version are strictly greater after the round trip, while every count above is restored"

      - name: chargeback_ledger_conserved_across_uphold_then_reverse
        grounds:
          - calculations.chargeback_ledger_conserved
          - state_machines.LossAssessment.chargeback_status.ISSUED_to_REVERSED
          - endpoints.POST_loss_assessments_assessment_id_chargeback_resolution
          - calculations.float_posture
          - entities.Brewer.fields.chargeback_balance_cents
          - rbac.AssetRecoveryAnalyst
        distinguishing_aspect: |
          Conserved quantity: MONEY, exact integer cents, restored by a REVERSE that must undo
          the whole cascade the UPHELD started — balance 0 -> 28200 -> 0, status
          ACTIVE -> PROBATION -> ACTIVE, float_posture HEALTHY -> SUSPENDED -> HEALTHY. The
          instance also pins what is deliberately NOT conserved: upheld_loss_count stays 1, the
          keg stays LOST, kegs_written_off stays 1 and billed_amount_cents stays 15136. A
          reversal restores the ledger, not the history and not the asset.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z."
            - "Pool with replacement_cost_cents 28200 and ten kegs; seven allocated on one order, dispatched at 01:00 and filled at 02:00 (billed ladder 2200, 2200, 2167, 2167, 2134, 2134, 2134 = 15136)."
            - "Three kegs stay IN_FLOAT so available_pct is 30.00 and the pool never leaves OPEN: every posture change observed is brewer-derived."
            - "Agreement float_size_kegs 10 with replenishment_threshold_pct 20 gives tight_ceiling 2, so with six or seven kegs at the brewer the posture reads HEALTHY at both ends of the round trip."
            - "credit_limit_cents 400000 keeps priority 50 out of the way even at the 28200 peak."
            - "Assessment created by analyst-1 and resolved by analyst-2 (validation 26); REVERSE is an AssetRecoveryAnalyst-exclusive action, so analyst-2 issues it."
