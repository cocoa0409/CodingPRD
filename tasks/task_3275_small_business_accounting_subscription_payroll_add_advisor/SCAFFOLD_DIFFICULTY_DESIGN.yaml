              captures: { price_d: $.data.monthly_price_cents }
            - call: "GET /api/companies/${company_e_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { price_e: $.data.monthly_price_cents }
            - call: "GET /api/companies/${company_f_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { price_f: $.data.monthly_price_cents }
