      - name: permit_window_reversed_returns_permit_window_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PERMIT_WINDOW_INVALID]"]
        distinguishing_aspect: "valid_to earlier than valid_from is rejected with ERR_PERMIT_WINDOW_INVALID (422)."
