# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# Bootstrap conventions (shared literals):
#   clock start        : 2026-06-01T00:00:00Z
#   insurance          : effective 2026-01-01, expiry 2027-01-01 (valid at clock)
#   deadline_date      : 2026-12-31T00:00:00Z
#   round_quarter grid : 0.25h; BASE_CONVERSION_RATE_CENTS=1500;
#                        multipliers NONE=1.0/PARTIAL=0.5/FULL=0.25; MIN=2500,MAX=200000
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_session_claimed_vs_supervisor_verified
        grounds:
          - calculations.session_claimed_hours
          - calculations.session_credited_hours
          - state_machines.WorkSession.COMPLETED_to_COMPLETED
          - entities.WorkSession.fields.claimed_hours
          - entities.WorkSession.fields.verified_hours
        distinguishing_aspect: "On WorkSession, timestamp-derived claimed_hours (3.25) and supervisor-attested verified_hours (3.00) diverge for the same session."
        test_recipe:
          setup:
            - "An ACTIVE placement; one session checked in 09:00 and out 12:15 (3.25h), then supervisor verifies with attested_hours 3.00."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites/${site_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-1", offense_class: "MISDEMEANOR", hours_ordered: 40, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
            - { call: "POST /placements/${plc_id}/sign-waiver", payload: { signature_name: "Pat Doe" }, as: Participant, as_user_id: "${part_id}" }
            - { call: "POST /placements/${plc_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", session_category: "STANDARD", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:15:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws_id: "$.data.id" } }
            - { call: "POST /work-sessions/${ws_id}/check-in", payload: { check_in_at: "2026-06-01T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws_id}/check-out", payload: { check_out_at: "2026-06-01T12:15:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /work-sessions/${ws_id}/verify", payload: { outcome: "VERIFIED", attested_hours: 3.00 }, as: SiteSupervisor, as_user_id: "${sup_id}" }
          assert:
            - "WorkSession.${ws_id}.claimed_hours == 3.25"
            - "WorkSession.${ws_id}.verified_hours == 3.00"
            - "WorkSession.${ws_id}.verified_hours < WorkSession.${ws_id}.claimed_hours"

      - name: dv_fee_provisional_quote_vs_final_settlement
        grounds:
          - calculations.conversion_fee
          - state_machines.FeeConversion.APPROVED_to_PAID
          - entities.FeeConversion.fields.quoted_fee_cents
          - entities.FeeConversion.fields.settlement_fee_cents
          - entities.FeeConversion.fields.settled_hours
        distinguishing_aspect: "On FeeConversion, provisional quoted_fee_cents (12000 over 8 requested hours) and final settlement_fee_cents (3000 over 2 remaining hours) diverge because outstanding hours dropped between request and pay."
        test_recipe:
          setup:
            - "Referral hours_ordered 12, NONE indigency; 4h verified (outstanding 8); request convert 8h (quote 12000); then 6h more verified (outstanding 2); approve; pay settles 2h (3000)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites/${site_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-2", offense_class: "MISDEMEANOR", hours_ordered: 12, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
            - { call: "POST /placements/${plc_id}/sign-waiver", payload: { signature_name: "Pat Doe" }, as: Participant, as_user_id: "${part_id}" }
            - { call: "POST /placements/${plc_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T13:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws1_id: "$.data.id" } }
            - { call: "POST /work-sessions/${ws1_id}/check-in", payload: { check_in_at: "2026-06-01T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws1_id}/check-out", payload: { check_out_at: "2026-06-01T13:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws1_id}/verify", payload: { outcome: "VERIFIED" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "GET /referrals/${ref_id}", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ref_v: "$.data.version" } }
            - { call: "POST /fee-conversions", payload: { referral_id: "${ref_id}", hours_to_convert: 8, expected_referral_version: "${ref_v}" }, as: Participant, as_user_id: "${part_id}", captures: { fee_id: "$.data.id" } }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T15:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws2_id: "$.data.id" } }
            - { call: "POST /work-sessions/${ws2_id}/check-in", payload: { check_in_at: "2026-06-02T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws2_id}/check-out", payload: { check_out_at: "2026-06-02T15:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws2_id}/verify", payload: { outcome: "VERIFIED" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /fee-conversions/${fee_id}/approve", payload: {}, as: ProgramCoordinator, as_user_id: "coord-2" }
          trigger:
            - { call: "POST /fee-conversions/${fee_id}/pay", payload: { amount_cents: 3000 }, as: Participant, as_user_id: "${part_id}" }
          assert:
            - "FeeConversion.${fee_id}.quoted_fee_cents == 12000"
            - "FeeConversion.${fee_id}.settlement_fee_cents == 3000"
            - "FeeConversion.${fee_id}.settled_hours == 2"
            - "Referral.${ref_id}.status == CONVERTED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_conversion_fee_tiered_rate_with_min_clamp
        grounds:
          - calculations.conversion_fee
          - entities.Referral.fields.indigency_status
          - entities.FeeConversion.fields.quoted_fee_cents
        distinguishing_aspect: "Mode (a): fee = min(MAX, max(MIN, round(hours*rate*multiplier))) with FULL tier (0.25) on 2h giving raw 750, clamped up to MIN 2500 — three inputs plus nested min/max clamp."
        test_recipe:
          setup:
            - "Referral hours_ordered 40, indigency FULL, outstanding 40; request convert 2h; raw 2*375=750 clamps to MIN 2500."
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Ivy Ind", date_of_birth: "1985-05-05T00:00:00Z", contact_email: "ivy@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-3", offense_class: "INFRACTION", hours_ordered: 40, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "FULL" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id", ref_v: "$.data.version" } }
          trigger:
            - { call: "POST /fee-conversions", payload: { referral_id: "${ref_id}", hours_to_convert: 2, expected_referral_version: "${ref_v}" }, as: Participant, as_user_id: "${part_id}", captures: { fee_id: "$.data.id" } }
          assert:
            - "FeeConversion.${fee_id}.quoted_fee_cents == 2500"
            - "FeeConversion.${fee_id}.indigency_status_snapshot == FULL"

      - name: cf_hours_completed_round_per_session_then_sum
        grounds:
          - calculations.referral_hours_completed
          - calculations.session_claimed_hours
          - entities.Referral.fields.hours_completed
        distinguishing_aspect: "Mode (b): two 1h52m sessions each round to 1.75 then sum to 3.50; sum-then-round of raw 3.7333h would give 3.75 — the pinned order yields 3.50."
        test_recipe:
          setup:
            - "Referral hours_ordered 10; two sessions each 09:00-10:52 (1h52m -> 1.75h) on separate days, both VERIFIED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites/${site_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-4", offense_class: "MISDEMEANOR", hours_ordered: 10, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
            - { call: "POST /placements/${plc_id}/sign-waiver", payload: { signature_name: "Pat Doe" }, as: Participant, as_user_id: "${part_id}" }
            - { call: "POST /placements/${plc_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:52:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws1_id: "$.data.id" } }
            - { call: "POST /work-sessions/${ws1_id}/check-in", payload: { check_in_at: "2026-06-01T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws1_id}/check-out", payload: { check_out_at: "2026-06-01T10:52:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws1_id}/verify", payload: { outcome: "VERIFIED" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:52:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws2_id: "$.data.id" } }
            - { call: "POST /work-sessions/${ws2_id}/check-in", payload: { check_in_at: "2026-06-02T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws2_id}/check-out", payload: { check_out_at: "2026-06-02T10:52:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /work-sessions/${ws2_id}/verify", payload: { outcome: "VERIFIED" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
          assert:
            - "WorkSession.${ws1_id}.verified_hours == 1.75"
            - "WorkSession.${ws2_id}.verified_hours == 1.75"
            - "Referral.${ref_id}.hours_completed == 3.50"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_referral_active_noncompliant_active_cycle
        grounds:
          - state_machines.Referral.ACTIVE_to_NON_COMPLIANT
          - state_machines.Referral.NON_COMPLIANT_to_ACTIVE
          - entities.Referral.fields.status
        distinguishing_aspect: "Referral cycles ACTIVE -> NON_COMPLIANT (report-back) -> ACTIVE (reinstate); the same status returns to ACTIVE after a loop."
        test_recipe:
          setup:
            - "An ACTIVE referral; a REPORT_BACK compliance action moves it NON_COMPLIANT, then reinstate returns it to ACTIVE."
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-5", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /compliance-actions", payload: { referral_id: "${ref_id}", action_type: "REPORT_BACK", reason: "Missed sessions" }, as: CourtClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /referrals/${ref_id}/reinstate", payload: {}, as: CourtClerk, as_user_id: "clerk-1", captures: { st: "$.data.status" } }
          assert:
            - "Referral.${ref_id}.status was NON_COMPLIANT immediately after REPORT_BACK"
            - "Referral.${ref_id}.status == ACTIVE after reinstate"

      - name: nlsm_worksession_parallel_attendance_and_verification_axes
        grounds:
          - state_machines.WorkSession.COMPLETED_to_COMPLETED
          - entities.WorkSession.fields.attendance_status
          - entities.WorkSession.fields.verification_status
        distinguishing_aspect: "On WorkSession the verification axis moves PENDING -> DISPUTED while the attendance axis stays COMPLETED — two independent state dimensions on one row."
        test_recipe:
          setup:
            - "A checked-out (attendance COMPLETED, verification PENDING) session; supervisor verifies with outcome DISPUTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
            - { call: "POST /insurance-policies/${pol_id}/verify", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites/${site_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /supervisors", payload: { site_id: "${site_id}", full_name: "Sam Sup", max_concurrent_participants: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "Pat Doe", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "pat@example.org" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${part_id}", court_case_number: "CR-6", offense_class: "MISDEMEANOR", hours_ordered: 20, deadline_date: "2026-12-31T00:00:00Z", indigency_status: "NONE" }, as: CourtClerk, as_user_id: "clerk-1", captures: { ref_id: "$.data.id" } }
            - { call: "POST /placements", payload: { referral_id: "${ref_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc_id: "$.data.id" } }
            - { call: "POST /placements/${plc_id}/sign-waiver", payload: { signature_name: "Pat Doe" }, as: Participant, as_user_id: "${part_id}" }
            - { call: "POST /placements/${plc_id}/activate", payload: {}, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws_id: "$.data.id" } }
            - { call: "POST /work-sessions/${ws_id}/check-in", payload: { check_in_at: "2026-06-01T09:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /work-sessions/${ws_id}/check-out", payload: { check_out_at: "2026-06-01T11:00:00Z" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /work-sessions/${ws_id}/verify", payload: { outcome: "DISPUTED" }, as: SiteSupervisor, as_user_id: "${sup_id}" }
          assert:
            - "WorkSession.${ws_id}.attendance_status == COMPLETED"
            - "WorkSession.${ws_id}.verification_status == DISPUTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_verify_completes_referral_issues_cert_completes_placement
        grounds:
          - state_machines.WorkSession.COMPLETED_to_COMPLETED
          - state_machines.Referral.ACTIVE_to_COMPLETED
          - state_machines.Placement.ACTIVE_to_COMPLETED
          - entities.Referral.fields.certificate_id
          - entities.Certificate.fields.total_hours_credited
        distinguishing_aspect: "Depth-4 chain: verify -> referral.hours_completed>=ordered -> referral COMPLETED -> Certificate auto-issued AND placement COMPLETED, each hop caused by the prior."
        test_recipe:
          setup:
            - "Referral hours_ordered 3.50, ACTIVE placement; session1 verified 1.75; session2 checked out (COMPLETED, PENDING) claimed 1.75."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
