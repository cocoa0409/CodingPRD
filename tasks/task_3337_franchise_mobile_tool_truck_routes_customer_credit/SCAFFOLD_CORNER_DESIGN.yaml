          trigger:
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Out Of Territory Shop", street_line: "5 Pine", zip_code: "75002" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { zip_error: "$.data.error_id" } }
            - { call: "POST /retail/routes/${r2_id}/shop-locations", payload: { shop_name: "In Territory Shop", street_line: "6 Pine", zip_code: "75002" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s_id: "$.data.id", s_zip: "$.data.zip_code" } }
          assert:
            - "the out-of-territory filing captures ${zip_error} == ERR_SHOP_ZIP_NOT_IN_TERRITORY with http 400"
            - "route R1 still has no shops"
            - "the in-territory filing succeeds and ShopLocation.${s_id}.zip_code == 75002"
            - "ShopLocation.${s_id}.shop_status == ACTIVE"

      - name: validation_sales_line_cannot_exceed_remaining_stock
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_INSUFFICIENT_INVENTORY]", entities.InventoryPosition.fields.remaining_qty, state_machines.SalesOrder.DRAFT_to_CONFIRMED]
        distinguishing_aspect: "A line quantity above the matching InventoryPosition.remaining_qty is refused with ERR_INSUFFICIENT_INVENTORY 409 at confirm time, while the same line at exactly remaining_qty is accepted."
        test_recipe:
