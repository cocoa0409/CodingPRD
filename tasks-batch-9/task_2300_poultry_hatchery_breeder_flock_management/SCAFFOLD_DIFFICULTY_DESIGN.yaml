      - name: chick_yield_tier_from_preliminary
        grounds:
          - calculations.chick_yield_resolution
          - entities.ChickBatch.fields.preliminary_yield_pct
          - entities.ChickBatch.fields.vaccine_reject_rate
          - entities.ChickBatch.fields.saleable_count
          - state_machines.ChickBatch.SEXED_to_VACCINATED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency resolved by a pinned seven-step order: the vaccine
          reject tier is keyed on preliminary_yield_pct 98.94 (which excludes vaccine culls), so the
          0.004 tier gives ceil(9300 * 0.004) = 38 extra culls and a final_yield_pct of 98.53 that
          is itself never fed back into the tier lookup.
