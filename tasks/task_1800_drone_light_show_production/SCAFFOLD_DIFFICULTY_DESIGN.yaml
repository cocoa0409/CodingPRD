# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Drone Light Show Production (task_1800)
# §1.8 Test Targeting Index: 9 Difficulty Rules, 27 instances.
# Every test_recipe replays from empty-DB using only §1.5 endpoints.
# Logical clock default 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: crowd_radius_planned_vs_as_flown_divergence
        grounds:
          - calculations.crowd_distance
          - entities.ShowEvent.fields.readiness_posture
          - entities.FlightLog.fields.max_altitude_reached_ft
        distinguishing_aspect: |
          Same show, same calculation, two variants on the ShowEvent/perimeter
          domain: PLANNED (pinned design 300ft / 10 drones) yields 172.0m while
          AS_FLOWN (telemetry: max altitude 295ft over 10 flight logs) yields
          170.0m — the variants MUST disagree (172.0 != 170.0).
        test_recipe:
          setup:
            - "Site A (1000x800m, wind 20kt, gust 25kt, alt 500ft)"
            - "Show S at Site A, window 2026-08-10T19:00-19:30Z, 10 drones, fully flown to EXECUTED"
            - "Design 300ft/10 drones LOCKED with PASS sim; safety config APPROVED; authorization APPROVED; 10 drones assigned; GO certified; paid in full"
            - "10 FlightLogs, each battery_consumed 42, max_altitude 295ft, deviation 1.2m"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${show_v}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${show_v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: ["NIGHT_OPS"] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner }
            - { call: "POST /api/show-events/${show_id}/record-payment", payload: { kind: "DEPOSIT", amount_cents: 165375 }, as: ProductionPlanner }
            - { call: "POST /api/show-events/${show_id}/record-payment", payload: { kind: "BALANCE", amount_cents: 385875 }, as: ProductionPlanner }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A01", model: "LUM-2" }, as: FleetManager, captures: { d1: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A02", model: "LUM-2" }, as: FleetManager, captures: { d2: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A03", model: "LUM-2" }, as: FleetManager, captures: { d3: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A04", model: "LUM-2" }, as: FleetManager, captures: { d4: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A05", model: "LUM-2" }, as: FleetManager, captures: { d5: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A06", model: "LUM-2" }, as: FleetManager, captures: { d6: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A07", model: "LUM-2" }, as: FleetManager, captures: { d7: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A08", model: "LUM-2" }, as: FleetManager, captures: { d8: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A09", model: "LUM-2" }, as: FleetManager, captures: { d9: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-A10", model: "LUM-2" }, as: FleetManager, captures: { d10: $.data.id } }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d1}", grid_row: 0, grid_col: 0 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d2}", grid_row: 0, grid_col: 1 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d3}", grid_row: 0, grid_col: 2 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d4}", grid_row: 0, grid_col: 3 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d5}", grid_row: 0, grid_col: 4 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d6}", grid_row: 1, grid_col: 0 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d7}", grid_row: 1, grid_col: 1 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d8}", grid_row: 1, grid_col: 2 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d9}", grid_row: 1, grid_col: 3 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d10}", grid_row: 1, grid_col: 4 }, as: FleetManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T18:45:00Z" }, as: OpsAdmin }
            - { call: "POST /api/weather-readings", payload: { site_id: "${site_id}", recorded_at: "2026-08-10T18:30:00Z", wind_speed_kt: 8, gust_kt: 11, precip_mm_hr: 0.0, temperature_c: 18 }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/go-no-go-evaluations", payload: { show_event_id: "${show_id}" }, as: SafetyOfficer, as_user_id: "so-1", captures: { eval_id: $.data.id } }
            - { call: "POST /api/go-no-go-evaluations/${eval_id}/certify", payload: {}, as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /api/show-events/${show_id}/certify-go", payload: { evaluation_id: "${eval_id}" }, as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T19:05:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events/${show_id}/execute", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d1}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d2}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d3}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d4}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d5}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d6}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d7}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d8}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d9}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
            - { call: "POST /api/flight-logs", payload: { show_event_id: "${show_id}", drone_id: "${d10}", battery_consumed_pct: 42, max_altitude_reached_ft: 295, max_deviation_m: 1.2 }, as: FleetManager }
          trigger:
            - { call: "GET /api/show-events/${show_id}/perimeter-assessment", payload: { variant: "PLANNED" }, as: SafetyOfficer, captures: { r_planned: $.data.required_radius_m, c_planned: $.data.containment } }
            - { call: "GET /api/show-events/${show_id}/perimeter-assessment", payload: { variant: "AS_FLOWN" }, as: SafetyOfficer, captures: { r_flown: $.data.required_radius_m, c_flown: $.data.containment } }
          assert:
            - "perimeter PLANNED required_radius_m == 172.0 (40 + 0.4*300 + 1.2*10)"
            - "perimeter AS_FLOWN required_radius_m == 170.0 (40 + 0.4*295 + 1.2*10)"
            - "${r_planned} != ${r_flown} — same show, two variants, different radii"
            - "${c_planned} == VALID and ${c_flown} == VALID (site min half-dim 400 >= radius + 15)"

      - name: battery_launch_eligibility_nominal_vs_cold_derated
        grounds:
          - calculations.battery_derated_charge
          - entities.Drone.fields.charge_pct
          - entities.WeatherReading.fields.temperature_c
        distinguishing_aspect: |
          Same drone charge (99%), same endpoint, two variants on the Drone/battery
          domain: NOMINAL (no recent reading) admits 99%, while COLD_DERATED
          (0.85 at 0C) rejects it at 84.15 — and 100% charge passes COLD_DERATED
          at exactly 85.00.
        test_recipe:
          setup:
            - "Site A; Show S (10 drones) in AUTHORIZED with pinned design 300ft/10"
            - "Drones d1 charge 100, d2 charge 99, d3 charge 100"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${show_v}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${show_v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: ["NIGHT_OPS"] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner }
            - { call: "POST /api/drones", payload: { serial_number: "SN-B01", model: "LUM-2", charge_pct: 100 }, as: FleetManager, captures: { d1: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-B02", model: "LUM-2", charge_pct: 99 }, as: FleetManager, captures: { d2: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-B03", model: "LUM-2", charge_pct: 100 }, as: FleetManager, captures: { d3: $.data.id } }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d2}", grid_row: 0, grid_col: 1 }, as: FleetManager, captures: { a2: $.data.id } }
            - { call: "POST /api/launch-grid-assignments/${a2}/void", payload: {}, as: FleetManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/weather-readings", payload: { site_id: "${site_id}", recorded_at: "2026-08-01T11:30:00Z", wind_speed_kt: 5, gust_kt: 8, precip_mm_hr: 0.0, temperature_c: 0 }, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d2}", grid_row: 0, grid_col: 1 }, as: FleetManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d3}", grid_row: 0, grid_col: 2 }, as: FleetManager, captures: { a3: $.data.id } }
          assert:
            - "NOMINAL variant (no recent reading): 99% drone was accepted (assignment ${a2} created, then voided)"
            - "COLD_DERATED variant (0C, derate 0.85): same 99% drone rejected with ${err} == ERR_CHARGE_BELOW_MINIMUM (99 * 0.85 = 84.15 < 85)"
            - "COLD_DERATED boundary: 100% drone accepted (100 * 0.85 = 85.00 >= 85), assignment ${a3} status == ASSIGNED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: wind_limit_nested_min_and_tier_interaction
        grounds:
          - calculations.effective_wind_limit
          - calculations.go_no_go_verdict
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — nested
          min(site.site_max_wind_kt, BASE * alt_derate * fleet_derate) with two
          independent tier lookups; for design 500ft/100 drones at site wind 20
          the fleet/altitude tiers pull the limit to 14.4 (below the site cap),
          and the gust ceiling derives as 18.7.
        test_recipe:
          setup:
            - "Site A (wind cap 20kt); Show S (100 drones) AUTHORIZED with pinned design 500ft/100 drones"
            - "clock at 2026-08-10T18:45:00Z"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 100 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 100, max_altitude_ft: 500, duration_sec: 900, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 4.0, battery_draw_pct: 60, max_speed_mps: 10.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${show_v}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 400, altitude_hard_ceiling_ft: 500, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${show_v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 500, waiver_types: ["NIGHT_OPS"] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T18:45:00Z" }, as: OpsAdmin }
            - { call: "POST /api/weather-readings", payload: { site_id: "${site_id}", recorded_at: "2026-08-10T18:30:00Z", wind_speed_kt: 14.5, gust_kt: 15.0, precip_mm_hr: 0.0, temperature_c: 18 }, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /api/go-no-go-evaluations", payload: { show_event_id: "${show_id}" }, as: SafetyOfficer, as_user_id: "so-1", captures: { eval1: $.data.id, v1: $.data.verdict, w1: $.data.effective_wind_limit_kt, g1: $.data.effective_gust_limit_kt } }
            - { call: "POST /api/weather-readings", payload: { site_id: "${site_id}", recorded_at: "2026-08-10T18:40:00Z", wind_speed_kt: 14.4, gust_kt: 15.0, precip_mm_hr: 0.0, temperature_c: 18 }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/go-no-go-evaluations", payload: { show_event_id: "${show_id}" }, as: SafetyOfficer, as_user_id: "so-1", captures: { v2: $.data.verdict } }
          assert:
            - "${w1} == 14.4 (min(20, 18 * 0.8 * 1.0)) and ${g1} == 18.7 (round_half_up(14.4 * 1.3, 1dp))"
            - "${v1} == NO_GO: 14.5 > 14.4 sustained"
            - "${v2} == GO: latest reading 14.4 <= 14.4 (boundary is inclusive-pass)"

      - name: refund_per_component_rounding_then_sum
        grounds:
          - calculations.cancellation_refund
          - entities.ShowEvent.fields.refund_due_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — pinned order rounds each
          paid component THEN sums; contract 530250 (deposit 159075, balance
          371175) at tier T4 (50%/50%) yields 79538 + 185588 = 265126, while the
          forbidden sum-then-round order yields 265125 — one cent apart.
        test_recipe:
          setup:
            - "Site A; Show S (2 drones, contract 530250, deposit 159075, balance 371175) paid in full"
            - "clock at 2026-08-09T19:00:00Z (24h before window start -> tier T4)"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 2 }, as: ProductionPlanner, captures: { show_id: $.data.id, contract: $.data.contract_value_cents, dep: $.data.deposit_cents, bal: $.data.balance_cents } }
            - { call: "POST /api/show-events/${show_id}/record-payment", payload: { kind: "DEPOSIT", amount_cents: 159075 }, as: ProductionPlanner }
            - { call: "POST /api/show-events/${show_id}/record-payment", payload: { kind: "BALANCE", amount_cents: 371175 }, as: ProductionPlanner }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T19:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/show-events/${show_id}/cancel", payload: {}, as: ProductionPlanner, captures: { tier: $.data.cancellation_tier, refund: $.data.refund_due_cents } }
          assert:
            - "${contract} == 530250 and ${dep} == 159075 and ${bal} == 371175"
            - "${tier} == T4_HALF_ALL"
            - "${refund} == 265126 (round_half_up(159075*0.5)=79538 + round_half_up(371175*0.5)=185588), NOT 265125 (sum-then-round)"

      - name: pricing_surcharge_tier_pinned_evaluation_order
        grounds:
          - calculations.show_contract_pricing
          - entities.ShowEvent.fields.contract_value_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — the
          8% surcharge tier is keyed on the PRE-surcharge subtotal (base + drone
          fee), never on the final total; 213 drones gives subtotal 998600 (< 1e6,
          5% -> total 1048530) even though the final total itself exceeds 1e6,
          while 214 drones crosses to 1000800 (8% -> 1080864).
        test_recipe:
          setup:
            - "Site A; clock default"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show 213", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 213 }, as: ProductionPlanner, captures: { c213: $.data.contract_value_cents, d213: $.data.deposit_cents, b213: $.data.balance_cents } }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show 214", window_start: "2026-08-12T19:00:00Z", window_end: "2026-08-12T19:30:00Z", drone_count_planned: 214 }, as: ProductionPlanner, captures: { c214: $.data.contract_value_cents, d214: $.data.deposit_cents, b214: $.data.balance_cents } }
          assert:
            - "${c213} == 1048530 (subtotal 998600 < 1000000 -> 5% surcharge 49930); ${d213} == 314559; ${b213} == 733971"
            - "${c214} == 1080864 (subtotal 1000800 >= 1000000 -> 8% surcharge 80064); ${d214} == 324259; ${b214} == 756605"
            - "the naive order (tier on final total) would give 1078488 for 213 drones — pinned order yields 1048530"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: show_event_parallel_lifecycle_and_payment_dimensions
        grounds:
          - state_machines.ShowEvent
          - entities.ShowEvent.fields.lifecycle_status
          - entities.ShowEvent.fields.payment_status
        distinguishing_aspect: |
          Parallel dimensions on ONE entity: payment_status advances
          DEPOSIT_DUE -> DEPOSIT_PAID -> PAID_IN_FULL while lifecycle_status
          independently advances PLANNING -> DESIGN_LOCKED, and cancellation
          drives payment to REFUNDED while lifecycle stays CANCELLED.
        test_recipe:
          setup:
            - "Site A; Show S (10 drones, contract 551250, deposit 165375, balance 385875); clock default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id, l0: $.data.lifecycle_status, p0: $.data.payment_status } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/show-events/${show_id}/record-payment", payload: { kind: "DEPOSIT", amount_cents: 165375 }, as: ProductionPlanner, captures: { l1: $.data.lifecycle_status, p1: $.data.payment_status } }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${show_v}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { l2: $.data.lifecycle_status, p2: $.data.payment_status } }
            - { call: "POST /api/show-events/${show_id}/record-payment", payload: { kind: "BALANCE", amount_cents: 385875 }, as: ProductionPlanner, captures: { l3: $.data.lifecycle_status, p3: $.data.payment_status } }
            - { call: "POST /api/show-events/${show_id}/cancel", payload: {}, as: ProductionPlanner, captures: { l4: $.data.lifecycle_status, p4: $.data.payment_status, tier4: $.data.cancellation_tier, r4: $.data.refund_due_cents } }
            - { call: "POST /api/show-events/${show_id}/settle-cancellation", payload: {}, as: ProductionPlanner, captures: { l5: $.data.lifecycle_status, p5: $.data.payment_status, c5: $.data.cancellation_status, rt5: $.data.refunded_total_cents } }
          assert:
            - "${l0} == PLANNING and ${p0} == DEPOSIT_DUE"
            - "${l1} == PLANNING and ${p1} == DEPOSIT_PAID (payment moved, lifecycle did not)"
            - "${l2} == DESIGN_LOCKED and ${p2} == DEPOSIT_PAID (lifecycle moved, payment did not)"
            - "${l3} == DESIGN_LOCKED and ${p3} == PAID_IN_FULL"
            - "cancel at lead 235h -> ${tier4} == T2_DEPOSIT_HALF and ${r4} == 468563 (82688 + 385875)"
            - "${l5} == CANCELLED and ${p5} == REFUNDED and ${c5} == SETTLED and ${rt5} == 468563"

      - name: authorization_review_info_cycle_and_reopen
        grounds:
          - state_machines.AirspaceAuthorization
        distinguishing_aspect: |
          Cyclic machine on AirspaceAuthorization: UNDER_REVIEW -> INFO_REQUESTED
          -> UNDER_REVIEW loop, then DENIED -> DRAFT reopen — the same entity
          traverses UNDER_REVIEW three times in one life.
        test_recipe:
          setup:
            - "Site A; Show S (10 drones, window 2026-08-10T19:00-19:30Z); clock default"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: ["NIGHT_OPS"] }, as: ProductionPlanner, captures: { auth_id: $.data.id, s0: $.data.status } }
          trigger:
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner, captures: { s1: $.data.status } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/request-info", payload: { info_note: "Need noise study" }, as: AuthorityOfficer, as_user_id: "ao-1", captures: { s2: $.data.status } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/resubmit", payload: { amendment_note: "Noise study attached" }, as: ProductionPlanner, captures: { s3: $.data.status } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "DENIED" }, as: AuthorityOfficer, as_user_id: "ao-1", captures: { s4: $.data.status } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/revise", payload: { altitude_ceiling_ft: 400 }, as: ProductionPlanner, captures: { s5: $.data.status } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner, captures: { s6: $.data.status } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-2", captures: { s7: $.data.status } }
          assert:
            - "${s0} == DRAFT"
            - "${s1} == UNDER_REVIEW -> ${s2} == INFO_REQUESTED -> ${s3} == UNDER_REVIEW (cycle 1)"
            - "${s4} == DENIED -> ${s5} == DRAFT (reopen cycle 2)"
            - "${s6} == UNDER_REVIEW -> ${s7} == APPROVED; altitude ceiling now 400 after revise"

      - name: design_revision_loop_and_supersede_cycle
        grounds:
          - state_machines.ShowDesign
          - calculations.simulation_verdict
        distinguishing_aspect: |
          Branching-with-revert cycle on ShowDesign: DRAFT -> SIMULATED -> DRAFT
          (revise) -> SIMULATED -> LOCKED, and a later lock supersedes the first
          LOCKED design (LOCKED -> SUPERSEDED) — lock with a FAIL latest run is
          rejected in between.
        test_recipe:
          setup:
            - "Site A; Show S (10 drones); clock default"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { d1: $.data.id, v_no1: $.data.design_version_no } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${d1}", min_separation_observed_m: 2.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner, captures: { fail_verdict: $.data.verdict } }
          trigger:
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v: $.data.version } }
            - { call: "POST /api/show-designs/${d1}/lock", payload: { expected_show_event_version: "${show_v}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /api/show-designs/${d1}/revise", payload: {}, as: ProductionPlanner, captures: { st_rev: $.data.status } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${d1}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner, captures: { pass_verdict: $.data.verdict } }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v2: $.data.version } }
            - { call: "POST /api/show-designs/${d1}/lock", payload: { expected_show_event_version: "${show_v2}" }, as: ProductionPlanner, captures: { st_lock: $.data.status } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 320, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { d2: $.data.id, v_no2: $.data.design_version_no } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${d2}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_v3: $.data.version } }
            - { call: "POST /api/show-designs/${d2}/lock", payload: { expected_show_event_version: "${show_v3}" }, as: ProductionPlanner }
            - { call: "GET /api/show-designs/${d1}", as: ProductionPlanner, captures: { d1_final: $.data.status } }
          assert:
            - "${fail_verdict} == FAIL (2.5 < 3.0 separation)"
            - "lock with FAIL latest run rejected: ${err} == ERR_SIMULATION_NOT_PASSING"
            - "${st_rev} == DRAFT (SIMULATED -> DRAFT revert)"
            - "${pass_verdict} == PASS and ${st_lock} == LOCKED"
            - "${v_no1} == 1 and ${v_no2} == 2"
            - "after d2 locks: ${d1_final} == SUPERSEDED (LOCKED -> SUPERSEDED auto-transition)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: critical_incident_grounding_cascade
        grounds:
          - state_machines.IncidentReport.UNDER_INVESTIGATION_to_CLOSED_CONFIRMED
          - state_machines.Drone.RESERVED_to_GROUNDED
          - state_machines.LaunchGridAssignment.ASSIGNED_to_VOIDED
          - state_machines.ShowEvent
        distinguishing_aspect: |
          Depth-3 chain from incident close: CLOSED_CONFIRMED(CRITICAL) grounds
          every drone that flew the show (link 1); each grounded drone voids its
          ASSIGNED grid slots on the FUTURE show (link 2); each void decrements
          that show's assigned_count and downgrades it READY -> AUTHORIZED
          (link 3) — plus a sibling hop revoking the executed show's
          APPROVED authorization.
        test_recipe:
          setup:
            - "Site A; Show A (3 drones, window 2026-08-10T19:00-19:30Z) fully EXECUTED with 3 flight logs (drones d1,d2,d3 back AVAILABLE)"
