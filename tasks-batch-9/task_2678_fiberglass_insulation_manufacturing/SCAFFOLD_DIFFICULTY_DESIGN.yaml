  - rule_id: transitive_cascade
    instances:
      - name: nonconforming_thermal_result_cascades_to_order_backorder_five_hops
        grounds:
          - state_machines.ThermalTest.IN_LAB_to_COMPLETED
          - state_machines.ProductionRun.SAMPLED_to_NONCONFORMING
          - state_machines.InventoryLot.ALLOCATED_to_QUARANTINED
          - state_machines.AllocationLine.ALLOCATED_to_REVOKED
          - state_machines.ChannelOrder.ALLOCATED_to_BACKORDERED
          - calculations.lot_allocation_ledger
        distinguishing_aspect: |
          Trigger is a single QualityEngineer record-result call, and the chain runs
          ThermalTest -> ProductionRun.qc_status -> InventoryLot -> AllocationLine ->
          ChannelOrder -> AllocationCycle: five downstream entities, none of which the
          caller names, and the final observable (ChannelOrder status flipping
          ALLOCATED -> BACKORDERED with fill_rate_pct 100.00 -> 0.00) is four hops
          from the trigger.
        test_recipe:
          setup:
            - "Program RCERT-PS, plant NWK and CERTIFIED binder BF-FREE-1 exist."
            - "SKU PL-A was certified off a conforming ThermalTest taken on RUN-CERT, a line-2 run deliberately left at CURING so that it never packaged an InventoryLot; PL-A is therefore CERTIFIED with effective_declared_r_value 13.0 while contributing no supply to the allocation cycle."
            - "Run RUN-A on line 1 has reached PACKAGED; its InventoryLot holds 120 bags / 10560.00 sqft, AVAILABLE."
            - "Distributor order ORD-1 (CONTRACT tier, 8800.00 sqft, required_by 2026-08-31T00:00:00Z) has been fully allocated through a CONTRACT_FIRST cycle covering 2026-08-01 to 2026-08-31, so the lot shows allocated_sqft 8800.00 / available_sqft 1760.00 and the order is ALLOCATED at fill_rate_pct 100.00."
            - "The logical clock reads 2026-08-04T08:00:00Z; a second ThermalTest, TEST-1 on RUN-A, is IN_LAB."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
