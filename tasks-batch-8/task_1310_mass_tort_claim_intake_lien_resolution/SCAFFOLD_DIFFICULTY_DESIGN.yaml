            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { active_after_withdraw: $.data.active_appeal_id }
          assert:
            - "captured active_before == null"
            - "captured active_after_file == '${aid}'"
            - "captured active_after_withdraw == null (compensating action restored the invariant)"
