errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing or invalid
- id: ERR_INSUFFICIENT_PERMISSIONS
  http: 403
  condition: Role not permitted for this operation
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field, type mismatch, invalid enum value, or malformed body
- id: ERR_CONTRACT_NOT_FOUND
  http: 404
  condition: Contract id does not exist
- id: ERR_SEASON_NOT_FOUND
  http: 404
  condition: Season id does not exist within the contract
- id: ERR_SERVICE_LINE_NOT_FOUND
  http: 404
  condition: Service line id does not exist within the contract
- id: ERR_ROOM_CLASS_NOT_FOUND
  http: 404
  condition: Room class id does not exist within the contract
- id: ERR_STUDY_NOT_FOUND
  http: 404
  condition: Comparability study id does not exist within the contract
- id: ERR_FILING_NOT_FOUND
  http: 404
  condition: Rate filing id does not exist within the contract
- id: ERR_RESERVATION_NOT_FOUND
  http: 404
  condition: Reservation id does not exist within the contract
- id: ERR_REPORT_NOT_FOUND
  http: 404
  condition: Receipts report id does not exist within the contract
- id: ERR_STATEMENT_NOT_FOUND
  http: 404
  condition: Fee statement id does not exist within the contract
- id: ERR_PROJECT_NOT_FOUND
  http: 404
  condition: Capital project id does not exist within the contract
- id: ERR_HOUSING_UNIT_NOT_FOUND
  http: 404
  condition: Housing unit id does not exist within the contract
- id: ERR_HIRE_NOT_FOUND
  http: 404
  condition: Seasonal hire id does not exist within the contract
- id: ERR_VOUCHER_NOT_FOUND
  http: 404
  condition: Transport voucher id does not exist within the contract
- id: ERR_INCIDENT_NOT_FOUND
  http: 404
  condition: Environmental incident id does not exist within the contract
- id: ERR_CONTRACT_NOT_OPERATIONAL
  http: 409
  condition: Contract not in a state permitting the operation (e.g. writes against DRAFT/CLOSED contracts)
- id: ERR_INVALID_STATE
  http: 409
  condition: Target entity not in the required state for the transition
- id: ERR_CONTRACT_NOT_ACTIVATABLE
  http: 409
  condition: Activation requires >= 1 season and all four service lines
- id: ERR_INVALID_DATE_RANGE
  http: 422
  condition: end/close/checkout/valid_through not after start/open/checkin/prepared_at, or negative span
- id: ERR_LOTTERY_WINDOW
  http: 422
  condition: lottery_open_date not strictly before season open_date, or lottery_window_hours < 1
- id: ERR_LOTTERY_NOT_OPEN
  http: 409
  condition: Reservation submitted before the lottery window opens
- id: ERR_SEASON_NOT_OPEN
  http: 409
  condition: Reservation or filing targets a season that is CLOSED or RECONCILED
- id: ERR_STAY_OUTSIDE_SEASON
  http: 422
  condition: Reservation stay not fully inside [open_date, close_date]
- id: ERR_DUPLICATE_RESERVATION
  http: 409
  condition: Same guest_ref already holds a non-terminal reservation overlapping the stay
- id: ERR_RATE_EXCEEDS_COMPARABILITY
  http: 422
  condition: A band's nightly rate exceeds round_half_up(weighted_mean_cents * 1.05)
- id: ERR_STUDY_NOT_CURRENT
  http: 409
  condition: Cited study is STALE/ARCHIVED or past valid_through at review/approval time
- id: ERR_STUDY_EXPIRED
  http: 422
  condition: Study valid_through is before the filing's season open_date
- id: ERR_SEASON_NOT_OPEN_FOR_FILING
  http: 409
  condition: Filings only accepted while the season is PLANNED or OPEN
- id: ERR_ROOM_CLASS_INACTIVE
  http: 409
  condition: Room class DECOMMISSIONED
- id: ERR_SERVICE_LINE_SUSPENDED
  http: 409
  condition: Service line SUSPENDED or TERMINATED; receipts reports rejected
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Approver/acceptor X-User-ID equals the submitter's X-User-ID
- id: ERR_DUPLICATE_PERIOD_REPORT
  http: 409
  condition: An ACCEPTED report already exists for (service_line_id, period_month)
- id: ERR_NO_ACCEPTED_REPORTS
  http: 409
  condition: Statement issuance requires >= 1 ACCEPTED report for the period
- id: ERR_STATEMENT_NOT_PAID
  http: 409
  condition: Transition finalization requires every statement PAID
- id: ERR_COST_OVERRUN
  http: 409
  condition: actual_cost_cents exceeds authorized_cost_cents * 1.10
- id: ERR_OPEN_CAPITAL_PROJECT
  http: 409
  condition: Transition initiation requires no project in PROPOSED/AUTHORIZED/COMPLETED
- id: ERR_OPEN_ENVIRONMENTAL_INCIDENT
  http: 409
  condition: Transition initiation or season reconcile blocked by a non-closed incident
- id: ERR_CORRECTIVE_PLAN_LATE
  http: 409
  condition: Corrective plan submitted after corrective_plan_deadline
- id: ERR_HOUSING_FULL
  http: 409
  condition: No AVAILABLE housing unit has a free bed for the season
- id: ERR_UNIT_OFFLINE
  http: 409
  condition: Assigned housing unit is OFFLINE
- id: ERR_NO_SUCCESSOR_DESIGNATED
  http: 409
  condition: Transition finalization requires a designated DRAFT successor contract
- id: ERR_STALE_CONTRACT_VERSION
  http: 412
  condition: expected_contract_version does not match the contract's current version (OCC)
- id: ERR_UNRECONCILED_SEASON
  http: 409
  condition: Season reconcile requires all hires terminal and overlapping reports ACCEPTED
roles:
- name: AgencyContractingOfficer
  description: Federal agency contracting officer — owns contract setup, service-line authorization, capital project authorization/approval, and recompetition transitions
  identity: opaque
  exclusive_operations:
  - POST /contracts
  - POST /contracts/{id}/service-lines and suspend/reinstate
  - POST /contracts/{id}/initiate-transition, designate-successor, finalize-transition
  - POST /contracts/{id}/capital-projects/{pid}/authorize and approve
  shared_operations:
  - GET endpoints
- name: AgencyRateAnalyst
  description: Agency rate analyst — registers comparability studies and adjudicates rate filings
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/comparability-studies
  - POST /contracts/{id}/rate-filings/{fid}/start-review, approve, reject
  shared_operations:
  - GET endpoints
- name: ConcessionerRateManager
  description: Concessioner rate manager — submits and revises rate filings
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/rate-filings
  shared_operations:
  - GET endpoints
- name: ConcessionerOpsManager
  description: Concessioner operations manager — activates contracts, manages seasons, rooms, and corrective plans
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/activate
  - POST /contracts/{id}/seasons and reconcile
  - POST /contracts/{id}/room-classes
  - POST /contracts/{id}/environmental-incidents (also inspector) and submit-corrective-plan
  shared_operations:
  - GET endpoints
- name: ConcessionerFrontDesk
  description: Front desk — reservations, cancellations, check-ins
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/reservations
  - POST /contracts/{id}/reservations/{rid}/cancel and check-in
  shared_operations:
  - GET endpoints
- name: ConcessionerAccountant
  description: Concessioner accountant — gross receipts reporting and franchise fee statements
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/receipts-reports and submit
  - POST /contracts/{id}/fee-statements and pay
  shared_operations:
  - GET endpoints
- name: AgencyFinancialAuditor
  description: Agency financial auditor — accepts or returns receipts reports (segregated from the concessioner submitter)
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/receipts-reports/{rid}/accept and return
  shared_operations:
  - GET endpoints
- name: ConcessionerMaintenanceChief
  description: Maintenance chief — proposes and completes capital projects on government-owned assets
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/capital-projects
  - POST /contracts/{id}/capital-projects/{pid}/complete
  shared_operations:
  - GET endpoints
- name: ConcessionerHRManager
  description: HR manager — housing units, seasonal hires, transport vouchers
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/housing-units and take-offline
  - POST /contracts/{id}/seasonal-hires and mark-arrived/mark-departed/terminate
  - POST /contracts/{id}/transport-vouchers and void
  shared_operations:
  - GET endpoints
- name: AgencyEnvironmentalInspector
  description: Agency environmental inspector — reviews incidents, requires corrective plans, closes incidents
  identity: opaque
  exclusive_operations:
  - POST /contracts/{id}/environmental-incidents/{iid}/start-review, require-corrective-plan, close
  shared_operations:
  - GET endpoints
  - POST /contracts/{id}/environmental-incidents
- name: SystemTestHarness
  description: Test harness role for the logical clock endpoint only
  identity: opaque
  exclusive_operations:
  - POST /_clock/set_current_utc
  shared_operations: []
