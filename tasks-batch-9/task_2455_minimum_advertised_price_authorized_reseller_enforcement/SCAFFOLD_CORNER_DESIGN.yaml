      - name: recapturing_an_already_traced_serial_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "A serial is traceable only from {SHIPPED_TO_DISTRIBUTOR, SHIPPED_TO_RESELLER}: once SN-0001 is TRACED_UNAUTHORIZED a second capture is ERR_SERIAL_NOT_TRACEABLE, distinct from the 404 raised for an unregistered serial."
        test_recipe:
