      - name: corner_open_complaint_count_tracks_intake_resolution_escalation_and_reopen
        claim_type: Ledger sync
        grounds:
          - state_machines.QualityComplaint.ABSENT_to_OPEN
          - state_machines.QualityComplaint.OPEN_to_RESOLVED
          - state_machines.QualityComplaint.OPEN_to_ESCALATED
          - state_machines.QualityComplaint.RESOLVED_to_OPEN
          - calculations.line_compliance_projection
          - entities.ServiceAccount.fields.open_complaint_count
        distinguishing_aspect: |
          The ancestor's derived counter reconciles after every child transition
          and treats the two closure dispositions differently: 1 -> 2 on intake,
          2 -> 1 when one complaint is RESOLVED, still 1 when the other is
          ESCALATED (ESCALATED remains an open complaint), and back to 2 on
          reopen — while the reopened complaint's provisional_yield_loss_liters
          stays frozen at 37.80 and its settled values reset to null.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract (21 days, 4 lines, 4175, 7500)."
            - "BeerLine #1 32ft/4ft/0.375in ALE at 12.0 L/day and BeerLine #2 15ft/3ft/0.375in ALE at 8.0 L/day, both created 2026-08-01T00:00:00Z and never cleaned (last_cleaned_at null, so days_at_risk baselines on created_at)."
            - "Clock advanced to 2026-08-10T09:00:00Z for both intakes: days_at_risk 9 for each."
