              as_user_id: "${proc_id}"
              captures: { err_both: $.data.error_id }
            - call: "POST /exam-sessions/${sess_id}/check-in"
              payload: { id_document_type: "GOVT_PHOTO_ID", id_document_expires_on: "2030-01-31", biometric_match_score: 40, proctor_attestation: true }
              as: Proctor
