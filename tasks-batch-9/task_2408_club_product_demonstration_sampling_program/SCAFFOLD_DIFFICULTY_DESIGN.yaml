# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2408
# In-Club Product Demonstration & Sampling Program (Club Demonstration Services)
#
# Nine difficulty rules from SKILL.md §0.5, two concrete instances each (18).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.6 and carries a fully
# structured, placeholder-closed setup_api_calls / trigger / assert recipe.
# Every numeric assertion is a literal produced by executing the relevant
# calculations[].formula against its constants.
#
# Logical clock: startup default is 2026-08-01T00:00:00Z
# (POST /_clock/set_current_utc, §1.5).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: lift_provisional_vs_final_diverge_on_same_event
        grounds:
          - calculations.sales_lift_measurement
          - entities.SalesLiftMeasurement.fields.measurement_variant
          - entities.ClubProductBaseline.fields.baseline_weekly_units
          - entities.DemoEvent.fields.attribution_window_days
          - concurrency_rules[lift-measurement-create-stale-event]
          - validations[priority=46]
        distinguishing_aspect: |
          One COMPLETED FOOD_SAMPLING event with one baseline yields two
          SalesLiftMeasurement rows from identical POS input
          (units_sold_in_window 400): PROVISIONAL prorates the 140-unit weekly
          baseline over a 3-day CLOSED window (baseline_units_expected 60.00,
          no cannibalization) while FINAL prorates it over the event's
          attribution_window_days 14 as a HALF_OPEN window
          (baseline_units_expected 280.00) and subtracts 15% of units_sampled
          320 as cannibalization_units 48.00 — so lift_units is 340.00 vs
          72.00, lift_pct 566.67 vs 25.71 and incremental_revenue_cents 441660
          vs 93528 on the same event, and window_end_date is 2026-09-16
          (inclusive) vs 2026-09-28 (exclusive).
        test_recipe:
          setup:
            - "Manufacturer M (program_tier STANDARD, credit_limit 5000000 cents) with club C (club_tier STANDARD, daily_event_capacity 6, food_station_count 3, health permit valid to 2027-01-31)."
            - "Product P: DAIRY, requires_food_handling true (so event_type computes to FOOD_SAMPLING), requires_heat_equipment false, allergen_flag false, samples_per_case 60, weekly_sample_case_pool 40, unit_cost_cents 210, unit retail 1299."
            - "ClubProductBaseline for (C, P): baseline_weekly_units 140, baseline_unit_price_cents 1299, week starting 2026-09-14."
            - "DemoEvent E on 2026-09-14 MIDDAY, requested_sample_cases 6, attribution_window_days 14 (default), no add-ons; driven DRAFT -> SUBMITTED -> CONFIRMED so allocated_sample_cases is 6 and required_support_count is 1."
            - "Shipment of 6 cases received in full; equipment reservation 11:00Z-16:30Z ACTIVE; LEAD and SUPPORT demonstrators both CHECKED_IN then CHECKED_OUT; event CLOSED_OUT so booking_status is COMPLETED."
            - "SampleReconciliation exists: units_delivered 360 = 320 sampled + 20 wasted + 20 returned, variance_units 0, recon_status BALANCED."
            - "Logical clock advanced to 2026-09-14T16:00:00Z before the check-in/check-out chain."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Northvale Foods LLC", billing_email: "ap@northvale.example", program_tier: "STANDARD", credit_limit_cents: 5000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-4101", name: "Riverbend Club 4101", region_code: "MW", club_tier: "STANDARD", daily_event_capacity: 6, food_station_count: 3, health_permit_expires_on: "2027-01-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "NV-CHZ-100", name: "Aged Cheddar Bites", category: "DAIRY", requires_food_handling: true, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 210, samples_per_case: 60, weekly_sample_case_pool: 40 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /club-product-baselines"
              payload: { club_id: "${club_id}", product_id: "${product_id}", baseline_weekly_units: 140, baseline_unit_price_cents: 1299, baseline_week_start_date: "2026-09-14" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { baseline_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Dana Roth", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { lead_dem_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Ivo Marek", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { support_dem_id: "$.data.id" }
            - call: "POST /demonstrators/${lead_dem_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", certificate_number: "FH-2026-0411", issued_on: "2026-02-01", expires_on: "2027-02-01" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
            - call: "POST /demonstrators/${support_dem_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", certificate_number: "FH-2026-0412", issued_on: "2026-02-01", expires_on: "2027-02-01" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MIDDAY", requested_sample_cases: 6, attribution_window_days: 14, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${event_id}/sample-shipments"
              payload: { cases_shipped: 6, carrier_reference: "TRK-88120" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { shipment_id: "$.data.id" }
            - call: "POST /sample-shipments/${shipment_id}/receive"
              payload: { cases_received: 6 }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /equipment-units"
              payload: { club_id: "${club_id}", asset_tag: "EQ-4101-07", equipment_type: "REFRIGERATED_CART" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { equip_id: "$.data.id" }
            - call: "POST /equipment-reservations"
              payload: { equipment_unit_id: "${equip_id}", demo_event_id: "${event_id}", window_start_utc: "2026-09-14T11:00:00Z", window_end_utc: "2026-09-14T16:30:00Z" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { reservation_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/assignments"
              payload: { demonstrator_id: "${lead_dem_id}", role: "LEAD" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { lead_asg_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/assignments"
              payload: { demonstrator_id: "${support_dem_id}", role: "SUPPORT" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { support_asg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T16:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
            - call: "POST /event-assignments/${lead_asg_id}/transitions"
              payload: { action: "CONFIRM" }
              as: Demonstrator
              as_user_id: "${lead_dem_id}"
            - call: "POST /event-assignments/${support_asg_id}/transitions"
              payload: { action: "CONFIRM" }
              as: Demonstrator
              as_user_id: "${support_dem_id}"
            - call: "POST /equipment-reservations/${reservation_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /event-assignments/${lead_asg_id}/transitions"
              payload: { action: "CHECK_IN", occurred_at_utc: "2026-09-14T11:15:00Z" }
              as: Demonstrator
              as_user_id: "${lead_dem_id}"
            - call: "POST /event-assignments/${support_asg_id}/transitions"
              payload: { action: "CHECK_IN", occurred_at_utc: "2026-09-14T11:20:00Z" }
              as: Demonstrator
              as_user_id: "${support_dem_id}"
            - call: "POST /event-assignments/${support_asg_id}/transitions"
              payload: { action: "CHECK_OUT", occurred_at_utc: "2026-09-14T15:35:00Z" }
              as: Demonstrator
              as_user_id: "${support_dem_id}"
            - call: "POST /event-assignments/${lead_asg_id}/transitions"
              payload: { action: "CHECK_OUT", occurred_at_utc: "2026-09-14T15:45:00Z" }
              as: Demonstrator
              as_user_id: "${lead_dem_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "CLOSE_OUT" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${event_id}/sample-reconciliation"
              payload: { units_sampled: 320, units_wasted: 20, units_returned: 20 }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { recon_id: "$.data.id" }
          trigger:
            - call: "GET /demo-events/${event_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { ev_v1: "$.data.version" }
            - call: "POST /demo-events/${event_id}/lift-measurements"
              payload: { measurement_variant: "PROVISIONAL", units_sold_in_window: 400, expected_demo_event_version: "${ev_v1}" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { prov_id: "$.data.id" }
            - call: "GET /demo-events/${event_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { ev_v2: "$.data.version" }
            - call: "POST /demo-events/${event_id}/lift-measurements"
              payload: { measurement_variant: "FINAL", units_sold_in_window: 400, expected_demo_event_version: "${ev_v2}" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { final_id: "$.data.id" }
          assert:
            - "SampleReconciliation.${recon_id}.units_delivered == 360"
            - "SampleReconciliation.${recon_id}.variance_units == 0"
            - "SampleReconciliation.${recon_id}.recon_status == BALANCED"
            - "SalesLiftMeasurement.${prov_id}.attribution_days == 3"
            - "SalesLiftMeasurement.${prov_id}.window_boundary == CLOSED"
            - "SalesLiftMeasurement.${prov_id}.window_start_date == 2026-09-14"
            - "SalesLiftMeasurement.${prov_id}.window_end_date == 2026-09-16"
            - "SalesLiftMeasurement.${prov_id}.baseline_units_expected == 60.00"
            - "SalesLiftMeasurement.${prov_id}.cannibalization_units == 0.00"
            - "SalesLiftMeasurement.${prov_id}.lift_units == 340.00"
            - "SalesLiftMeasurement.${prov_id}.lift_pct == 566.67"
            - "SalesLiftMeasurement.${prov_id}.incremental_revenue_cents == 441660"
            - "SalesLiftMeasurement.${final_id}.attribution_days == 14"
            - "SalesLiftMeasurement.${final_id}.window_boundary == HALF_OPEN"
            - "SalesLiftMeasurement.${final_id}.window_end_date == 2026-09-28"
            - "SalesLiftMeasurement.${final_id}.baseline_units_expected == 280.00"
            - "SalesLiftMeasurement.${final_id}.cannibalization_units == 48.00"
            - "SalesLiftMeasurement.${final_id}.lift_units == 72.00"
            - "SalesLiftMeasurement.${final_id}.lift_pct == 25.71"
            - "SalesLiftMeasurement.${final_id}.incremental_revenue_cents == 93528"
            - "SalesLiftMeasurement.${prov_id}.measurement_status == POSTED"
            - "SalesLiftMeasurement.${final_id}.measurement_status == POSTED"

      - name: reliability_rolling90_vs_program_to_date_diverge
        grounds:
          - calculations.demonstrator_reliability_score
          - entities.Demonstrator.fields.reliability_score_rolling_90
          - entities.Demonstrator.fields.reliability_score_program_to_date
          - entities.Demonstrator.fields.no_show_strike_count
          - entities.EventAssignment.fields.late_check_in
        distinguishing_aspect: |
          One demonstrator's six injected historical assignments produce two
          different scores from the SAME rows: ROLLING_90 counts only the two
          rows whose scheduled_start_utc is in [2026-06-03T00:00:00Z,
          2026-09-01T00:00:00Z) — one late COMPLETED and one NO_SHOW — for
          100 - 12 - 4 + 0.5 = 84.50, while PROGRAM_TO_DATE counts all six for
          100 - 24 - 4 + 2.0 = 74.00. The rolling variant sees the WORSE
          no-show ratio (1 of 2 rows) yet the HIGHER score, so the divergence
          cannot be reproduced by scaling one variant from the other; the
          separate 180-day strike counter lands on 2 either way.
        test_recipe:
          setup:
            - "Logical clock moved to 2026-09-01T00:00:00Z first, so the ROLLING_90 lower bound is exactly 2026-06-03T00:00:00Z and the 180-day strike lookback bound is 2026-03-05T00:00:00Z."
            - "Manufacturer M (STANDARD), club C (STANDARD, capacity 5), non-food product P (requires_food_handling false), demonstrator D homed at C with max_weekly_events default 5."
            - "A DRAFT DemoEvent E0 on 2026-10-05 exists only to satisfy the injection endpoint's demo_event_id argument; it is never submitted, so E0.staffing_status stays UNSTAFFED."
            - "Six historical SUPPORT assignments injected for D: MORNING-shaped shifts on 2026-03-10, 2026-03-17 and 2026-03-24 COMPLETED on time; 2026-04-07 NO_SHOW; 2026-08-10 COMPLETED with check_in_at 25 minutes past scheduled_start_utc so late_check_in is true; 2026-08-17 NO_SHOW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
            - call: "POST /manufacturers"
              payload: { legal_name: "Cedar Ridge Snacks Inc", billing_email: "ap@cedarridge.example", program_tier: "STANDARD", credit_limit_cents: 4000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-4202", name: "Elmgrove Club 4202", region_code: "NE", club_tier: "STANDARD", daily_event_capacity: 5, food_station_count: 2, health_permit_expires_on: "2027-03-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "CR-TVC-220", name: "Countertop Blender Demo Kit", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 1500, samples_per_case: 10, weekly_sample_case_pool: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Priya Nandan", hourly_rate_cents: 2300 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { dem_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-10-05", day_part: "MORNING", requested_sample_cases: 3, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { e0_id: "$.data.id" }
          trigger:
            - call: "POST /_inject/assignment-history"
              payload:
                demonstrator_id: "${dem_id}"
                demo_event_id: "${e0_id}"
                entries:
                  - { scheduled_start_utc: "2026-03-10T08:15:00Z", scheduled_end_utc: "2026-03-10T14:15:00Z", assignment_status: "COMPLETED", role: "SUPPORT", check_in_at: "2026-03-10T08:12:00Z", check_out_at: "2026-03-10T14:15:00Z" }
                  - { scheduled_start_utc: "2026-03-17T08:15:00Z", scheduled_end_utc: "2026-03-17T14:15:00Z", assignment_status: "COMPLETED", role: "SUPPORT", check_in_at: "2026-03-17T08:12:00Z", check_out_at: "2026-03-17T14:15:00Z" }
                  - { scheduled_start_utc: "2026-03-24T08:15:00Z", scheduled_end_utc: "2026-03-24T14:15:00Z", assignment_status: "COMPLETED", role: "SUPPORT", check_in_at: "2026-03-24T08:12:00Z", check_out_at: "2026-03-24T14:15:00Z" }
                  - { scheduled_start_utc: "2026-04-07T08:15:00Z", scheduled_end_utc: "2026-04-07T14:15:00Z", assignment_status: "NO_SHOW", role: "SUPPORT" }
                  - { scheduled_start_utc: "2026-08-10T08:15:00Z", scheduled_end_utc: "2026-08-10T14:15:00Z", assignment_status: "COMPLETED", role: "SUPPORT", check_in_at: "2026-08-10T08:40:00Z", check_out_at: "2026-08-10T14:15:00Z" }
                  - { scheduled_start_utc: "2026-08-17T08:15:00Z", scheduled_end_utc: "2026-08-17T14:15:00Z", assignment_status: "NO_SHOW", role: "SUPPORT" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
            - call: "GET /demonstrators/${dem_id}"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { rolling: "$.data.reliability_score_rolling_90", ptd: "$.data.reliability_score_program_to_date", strikes: "$.data.no_show_strike_count", completed: "$.data.completed_event_count" }
          assert:
            - "Demonstrator.${dem_id}.reliability_score_rolling_90 == 84.50"
            - "Demonstrator.${dem_id}.reliability_score_program_to_date == 74.00"
            - "${rolling} != ${ptd}"
            - "Demonstrator.${dem_id}.no_show_strike_count == 2"
            - "Demonstrator.${dem_id}.completed_event_count == 4"
            - "Demonstrator.${dem_id}.employment_status == ACTIVE"
            - "GET /event-assignments?demonstrator_id=${dem_id} -> data has 6 rows"
            - "the injected 2026-08-10 row has late_check_in == true"
            - "the injected 2026-03-10 row has late_check_in == false"
            - "DemoEvent.${e0_id}.staffing_status == UNSTAFFED"
            - "DemoEvent.${e0_id}.booking_status == DRAFT"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: invoice_rounds_each_line_before_summing_not_after
        grounds:
          - calculations.event_invoice_total
          - entities.EventInvoice.fields.line_items
          - entities.EventInvoice.fields.subtotal_cents
          - entities.EventAssignment.fields.billable_hours
          - concurrency_rules[invoice-create-stale-event]
          - validations[priority=12]
        distinguishing_aspect: |
          Seven line items are built whose raw values each carry a fraction of
          a cent: BASE 42000 x 0.85 x 1.15 = 41055.0000, PREMIUM_PLACEMENT
          41055 x 0.18 = 7389.90, EXTRA_TABLE 5000, LEAD 4.50h x 2331 x 1.20 =
          12587.4000, SUPPORT 4.25h x 2001 x 1.00 = 8504.2500, handling
          6 x 900 = 5400 and cold chain 6 x 350 = 2100. Rounding each line
          first gives subtotal_cents 82036; summing the raw values first
          (82036.55) and rounding once gives 82037. The correct answer is
          82036, so an implementation that defers rounding to the subtotal is
          off by exactly one cent and this instance detects it.
        test_recipe:
          setup:
            - "Manufacturer M program_tier STANDARD (TIER_BASE_DISCOUNT 0.0) with exactly one COMPLETED event in September 2026, so monthly_completed_event_count is 1, volume_step 0.00 and discount_cents 0 — the discount cannot mask the one-cent difference."
            - "Club C club_tier SATELLITE (multiplier 0.85), event day_part MIDDAY (multiplier 1.15), event_type FOOD_SAMPLING (base 42000)."
            - "addon_services declared in array order [PREMIUM_PLACEMENT, EXTRA_TABLE] — one percent-of-base add-on and one flat add-on."
            - "LEAD demonstrator hourly_rate_cents 2331 works 11:15Z-15:45Z (4.50 billable hours); SUPPORT demonstrator hourly_rate_cents 2001 works 11:20Z-15:35Z (4.25 billable hours); both above MIN_BILLABLE_HOURS 4.00 so no floor applies."
            - "6 cases shipped and received in full; reconciliation 300 sampled + 40 wasted + 20 returned = units_delivered 360, variance 0, BALANCED; cases_delivered 6 drives both handling lines."
            - "Event CLOSED_OUT so booking_status is COMPLETED and the invoice may be created."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Harborlight Provisions Co", billing_email: "ap@harborlight.example", program_tier: "STANDARD", credit_limit_cents: 9000000, credit_terms_days: 45 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-4303", name: "Satellite Club 4303", region_code: "SW", club_tier: "SATELLITE", daily_event_capacity: 4, food_station_count: 2, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "HL-DIP-310", name: "Roasted Pepper Dip Cups", category: "DAIRY", requires_food_handling: true, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 210, samples_per_case: 60, weekly_sample_case_pool: 30 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Marta Oyelaran", hourly_rate_cents: 2331 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { lead_dem_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Kenji Abara", hourly_rate_cents: 2001 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { support_dem_id: "$.data.id" }
            - call: "POST /demonstrators/${lead_dem_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", certificate_number: "FH-2026-0501", issued_on: "2026-01-15", expires_on: "2027-01-15" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
            - call: "POST /demonstrators/${support_dem_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", certificate_number: "FH-2026-0502", issued_on: "2026-01-15", expires_on: "2027-01-15" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
            - call: "POST /demo-events"
