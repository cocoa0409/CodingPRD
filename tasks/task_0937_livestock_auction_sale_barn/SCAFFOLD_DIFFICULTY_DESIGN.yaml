scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations on DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settle_weight_pencil_shrink_versus_stand_actual_on_lot_weight
        grounds:
          - calculations.settle_weight
          - entities.Consignment.fields.weigh_basis
          - entities.Consignment.fields.pencil_shrink_pct
          - entities.Lot.fields.settle_weight_lb
          - state_machines.WeighTicket.OPEN_to_CAPTURED
        distinguishing_aspect: |
          This dual-variant lives in the LIVESTOCK-WEIGHT domain on WeighTicket/Lot: two
          consignments whose scale readings are byte-identical settle on 6790 lb under
          PENCIL_SHRINK and 6900 lb under STAND_ACTUAL, because one deducts a contractual
          percentage from the first draft and the other takes the raw re-weigh after a stand.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T08:00:00Z; a sale day in CHECK_IN_OPEN; one certified scale; one pen with 60 head capacity."
            - "Consignment A with weigh_basis PENCIL_SHRINK and pencil_shrink_pct 0.03, 10 head, fully sorted into lot A."
            - "Consignment B with weigh_basis STAND_ACTUAL, 10 head, fully sorted into lot B."
            - "Lot A has one CAPTURED ticket 7200/200. Lot B has a first CAPTURED ticket 7200/200 and, 240 minutes later, a second CAPTURED ticket 7100/200 which supersedes it."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sale_day_id: "$.data.id" }
            - call: "POST /sale-barn/scales"
              payload: { scale_code: "SC-1", certified_from: "2026-01-01", certification_expires_on: "2026-12-31", max_draft_lb: 60000 }
              as: BarnAdmin
              captures: { scale_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_a_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_a_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_a_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_a_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets"
              payload: { lot_id: "${lot_a_id}", scale_id: "${scale_id}", head_on_draft: 10, gross_weight_lb: 7200, tare_weight_lb: 200 }
              as: YardOperator
              captures: { wt_a_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets/${wt_a_id}/capture"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "STAND_ACTUAL" }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_b_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_b_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_b_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_b_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets"
              payload: { lot_id: "${lot_b_id}", scale_id: "${scale_id}", head_on_draft: 10, gross_weight_lb: 7200, tare_weight_lb: 200 }
              as: YardOperator
              captures: { wt_b1_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets/${wt_b1_id}/capture"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/weigh-tickets"
              payload: { lot_id: "${lot_b_id}", scale_id: "${scale_id}", head_on_draft: 10, gross_weight_lb: 7100, tare_weight_lb: 200 }
              as: YardOperator
              captures: { wt_b2_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets/${wt_b2_id}/capture"
              payload: {}
              as: YardOperator
          trigger:
            - call: "GET /sale-barn/lots/${lot_a_id}"
              payload: {}
              as: YardOperator
              captures: { sw_a: "$.data.settle_weight_lb" }
            - call: "GET /sale-barn/lots/${lot_b_id}"
              payload: {}
              as: YardOperator
              captures: { sw_b: "$.data.settle_weight_lb" }
          assert:
            - "Lot.${lot_a_id}.settle_weight_lb == 6790"
            - "Lot.${lot_a_id}.avg_weight_lb == 679.0"
            - "Lot.${lot_a_id}.weight_class == MEDIUM"
            - "Lot.${lot_b_id}.settle_weight_lb == 6900"
            - "Lot.${lot_b_id}.avg_weight_lb == 690.0"
            - "WeighTicket.${wt_b1_id}.status == SUPERSEDED"
            - "WeighTicket.${wt_b2_id}.status == CAPTURED"
            - "Lot.${lot_a_id}.settle_weight_lb != Lot.${lot_b_id}.settle_weight_lb"

      - name: seller_commission_tiered_value_versus_flat_per_head_on_settlement
        grounds:
          - calculations.seller_commission
          - entities.Consignment.fields.commission_basis
          - entities.Settlement.fields.commission_amount
          - state_machines.SaleDay.BIDDING_CLOSED_to_SETTLED
        distinguishing_aspect: |
          This dual-variant lives in the MONEY domain on Settlement, a different entity domain
          from the weight dual-variant: two consignments that each sell 10 head for exactly
          12391.75 gross produce commission 371.75 under TIERED_VALUE and 180.00 under
          FLAT_PER_HEAD, because one prices the gross and the other prices the head.
          Same inputs, different subject, different formula family.
        test_recipe:
            setup:
              - "Clock 2026-06-01T08:00:00Z; sale day BARN-1 in NE; pen capacity 60; certified scale."
              - "Consignment A (TIERED_VALUE) and consignment B (FLAT_PER_HEAD), each 10 head, PENCIL_SHRINK 0.03, PER_HEAD_DAY yardage, NONE ration."
              - "Each has one lot of 10 head weighed 7200/200 (settle 6790) and hammered at 182.50 $/cwt to one BONDED buyer with a 50000 credit limit."
              - "The sale day is closed at 2026-06-02T10:00:00Z, producing one settlement per consignment."
            setup_api_calls:
              - call: "POST /sale-barn/_clock/set_current_utc"
                payload: { to_iso8601: "2026-06-01T08:00:00Z" }
                as: BarnAdmin
              - call: "POST /sale-barn/parties"
                payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
                as: BarnAdmin
                captures: { consignor_id: "$.data.id" }
              - call: "POST /sale-barn/parties"
                payload: { legal_name: "Midwest Packing", party_type: "PACKER", origin_state_code: "NE", origin_county: "Douglas", tax_id: "47-2222222" }
                as: BarnAdmin
                captures: { buyer_party_id: "$.data.id" }
              - call: "POST /sale-barn/sale-days"
                payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
                as: BarnAdmin
                captures: { sale_day_id: "$.data.id" }
              - call: "POST /sale-barn/pens"
                payload: { pen_code: "P-01", species_class: "CATTLE", head_capacity: 60, pen_type: "HOLDING" }
                as: BarnAdmin
                captures: { pen_id: "$.data.id" }
              - call: "POST /sale-barn/scales"
                payload: { scale_code: "SC-1", certified_from: "2026-01-01", certification_expires_on: "2026-12-31", max_draft_lb: 60000 }
                as: BarnAdmin
                captures: { scale_id: "$.data.id" }
              - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
                payload: { to_status: "CHECK_IN_OPEN" }
                as: BarnAdmin
              - call: "POST /sale-barn/consignments"
                payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03, yardage_basis: "PER_HEAD_DAY", commission_basis: "TIERED_VALUE", ration_type: "NONE", days_on_feed: 0, advances_amount: 0, hold_until_funds: false }
                as: Consignor
                as_user_id: "${consignor_id}"
                captures: { cons_t_id: "$.data.id" }
              - call: "POST /sale-barn/consignments/${cons_t_id}/check-in"
                payload: {}
                as: YardOperator
              - call: "POST /sale-barn/lots"
                payload: { consignment_id: "${cons_t_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
                as: YardOperator
                captures: { lot_t_id: "$.data.id" }
              - call: "POST /sale-barn/lots/${lot_t_id}/assign-pen"
                payload: { pen_id: "${pen_id}" }
                as: YardOperator
              - call: "POST /sale-barn/weigh-tickets"
                payload: { lot_id: "${lot_t_id}", scale_id: "${scale_id}", head_on_draft: 10, gross_weight_lb: 7200, tare_weight_lb: 200 }
                as: YardOperator
                captures: { wt_t_id: "$.data.id" }
              - call: "POST /sale-barn/weigh-tickets/${wt_t_id}/capture"
                payload: {}
                as: YardOperator
              - call: "POST /sale-barn/lots/${lot_t_id}/mark-ready"
                payload: {}
                as: YardOperator
              - call: "POST /sale-barn/consignments"
                payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03, yardage_basis: "PER_HEAD_DAY", commission_basis: "FLAT_PER_HEAD", ration_type: "NONE", days_on_feed: 0, advances_amount: 0, hold_until_funds: false }
                as: Consignor
                as_user_id: "${consignor_id}"
                captures: { cons_f_id: "$.data.id" }
              - call: "POST /sale-barn/consignments/${cons_f_id}/check-in"
                payload: {}
                as: YardOperator
              - call: "POST /sale-barn/lots"
                payload: { consignment_id: "${cons_f_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
                as: YardOperator
                captures: { lot_f_id: "$.data.id" }
              - call: "POST /sale-barn/lots/${lot_f_id}/assign-pen"
                payload: { pen_id: "${pen_id}" }
                as: YardOperator
              - call: "POST /sale-barn/weigh-tickets"
                payload: { lot_id: "${lot_f_id}", scale_id: "${scale_id}", head_on_draft: 10, gross_weight_lb: 7200, tare_weight_lb: 200 }
                as: YardOperator
                captures: { wt_f_id: "$.data.id" }
              - call: "POST /sale-barn/weigh-tickets/${wt_f_id}/capture"
                payload: {}
                as: YardOperator
              - call: "POST /sale-barn/lots/${lot_f_id}/mark-ready"
                payload: {}
                as: YardOperator
              - call: "POST /sale-barn/buyer-registrations"
                payload: { party_id: "${buyer_party_id}", sale_day_id: "${sale_day_id}", buyer_number: 101, bond_type: "BONDED", credit_limit: 50000, cash_deposit_amount: 0 }
                as: BarnAdmin
                captures: { br_id: "$.data.id" }
              - call: "POST /sale-barn/buyer-registrations/${br_id}/approve"
                payload: {}
                as: BarnAdmin
              - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
                payload: { to_status: "RINGING" }
                as: BarnAdmin
              - call: "POST /sale-barn/lots/${lot_t_id}/enter-ring"
                payload: {}
                as: Auctioneer
              - call: "POST /sale-barn/bids"
                payload: { lot_id: "${lot_t_id}", buyer_registration_id: "${br_id}", unit_price: 182.50 }
                as: RingClerk
                captures: { bid_t_id: "$.data.id" }
              - call: "GET /sale-barn/lots/${lot_t_id}"
                payload: {}
                as: Auctioneer
                captures: { lot_t_v: "$.data.version" }
              - call: "POST /sale-barn/lots/${lot_t_id}/hammer-down"
                payload: { winning_bid_id: "${bid_t_id}", expected_lot_version: "${lot_t_v}" }
                as: Auctioneer
              - call: "POST /sale-barn/lots/${lot_f_id}/enter-ring"
                payload: {}
                as: Auctioneer
              - call: "POST /sale-barn/bids"
                payload: { lot_id: "${lot_f_id}", buyer_registration_id: "${br_id}", unit_price: 182.50 }
                as: RingClerk
                captures: { bid_f_id: "$.data.id" }
              - call: "GET /sale-barn/lots/${lot_f_id}"
                payload: {}
                as: Auctioneer
                captures: { lot_f_v: "$.data.version" }
              - call: "POST /sale-barn/lots/${lot_f_id}/hammer-down"
                payload: { winning_bid_id: "${bid_f_id}", expected_lot_version: "${lot_f_v}" }
                as: Auctioneer
              - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
                payload: { to_status: "BIDDING_CLOSED" }
                as: BarnAdmin
              - call: "POST /sale-barn/_clock/set_current_utc"
                payload: { to_iso8601: "2026-06-02T10:00:00Z" }
                as: BarnAdmin
              - call: "POST /sale-barn/sale-days/${sale_day_id}/close"
                payload: {}
                as: SettlementClerk
            trigger:
              - call: "GET /sale-barn/settlements"
                payload: { consignment_id: "${cons_t_id}" }
                as: SettlementClerk
                captures: { stl_t_id: "$.data[0].id", comm_t: "$.data[0].commission_amount" }
              - call: "GET /sale-barn/settlements"
                payload: { consignment_id: "${cons_f_id}" }
                as: SettlementClerk
                captures: { stl_f_id: "$.data[0].id", comm_f: "$.data[0].commission_amount" }
            assert:
              - "Settlement.${stl_t_id}.gross_amount == 12391.75"
              - "Settlement.${stl_f_id}.gross_amount == 12391.75"
              - "Settlement.${stl_t_id}.commission_amount == 371.75"
              - "Settlement.${stl_f_id}.commission_amount == 180.00"
              - "Settlement.${stl_t_id}.commission_amount != Settlement.${stl_f_id}.commission_amount"
              - "Settlement.${stl_t_id}.yardage_amount == 35.00"
              - "Settlement.${stl_t_id}.statutory_amount == 10.00"
              - "Settlement.${stl_t_id}.brand_fee_amount == 12.00"
              - "Settlement.${stl_t_id}.indemnity_fee_amount == 18.59"
              - "Settlement.${stl_t_id}.net_amount == 11944.41"
              - "Settlement.${stl_f_id}.net_amount == 12136.16"
              - "Settlement.${stl_t_id}.balance_ok == true"

  # =========================================================================
  # Rule 2 — combinatorial formulas in DIFFERENT modes: (a) nested min/max with
  # >=3 inputs, and (b) pinned rounding order.
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: commission_floor_and_cap_nesting_mode_a
        grounds:
          - calculations.seller_commission
          - entities.Settlement.fields.commission_amount
          - entities.Lot.fields.extended_amount
        distinguishing_aspect: |
          MODE (a): a formula with three inputs (gross, sold_head, tier rate) and a
          non-linear interaction, min(max(tiered, per_head_floor), cap). Both non-tiered
          branches are arithmetically reachable and are pinned here: a 500.00 gross over
          10 head yields tiered 25.00 but settles at the 40.00 per-head floor, and a
          24000.00 gross over 40 head yields tiered 720.00 but settles at the 450.00 cap.
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; sale day BARN-1/NE; pen capacity 60; certified scale."
            - "Consignment C1: 10 head, TIERED_VALUE, PENCIL_SHRINK 0.03, one PER_HEAD lot of 10 head hammered at 50.00 $/head (gross 500.00)."
            - "Consignment C2: 40 head, TIERED_VALUE, PENCIL_SHRINK 0.03, one PER_HEAD lot of 40 head hammered at 600.00 $/head (gross 24000.00)."
            - "One BONDED buyer with a 50000 credit limit takes both lots. Sale day closed at 2026-06-01T20:00:00Z (one yardage day)."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Midwest Packing", party_type: "PACKER", origin_state_code: "NE", origin_county: "Douglas", tax_id: "47-2222222" }
              as: BarnAdmin
              captures: { buyer_party_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sale_day_id: "$.data.id" }
            - call: "POST /sale-barn/pens"
              payload: { pen_code: "P-01", species_class: "CATTLE", head_capacity: 60, pen_type: "HOLDING" }
              as: BarnAdmin
              captures: { pen_id: "$.data.id" }
            - call: "POST /sale-barn/scales"
              payload: { scale_code: "SC-1", certified_from: "2026-01-01", certification_expires_on: "2026-12-31", max_draft_lb: 60000 }
              as: BarnAdmin
              captures: { scale_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03, commission_basis: "TIERED_VALUE", yardage_basis: "PER_HEAD_DAY", ration_type: "NONE", days_on_feed: 0 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_small_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_small_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_small_id}", head_count: 10, livestock_class: "CALF", bid_basis: "PER_HEAD", opening_bid: 40.00, reserve_price: 45.00 }
              as: YardOperator
              captures: { lot_small_id: "$.data.id" }
            - call: "POST /sale-barn/lots/${lot_small_id}/assign-pen"
              payload: { pen_id: "${pen_id}" }
              as: YardOperator
            - call: "POST /sale-barn/weigh-tickets"
              payload: { lot_id: "${lot_small_id}", scale_id: "${scale_id}", head_on_draft: 10, gross_weight_lb: 5200, tare_weight_lb: 200 }
              as: YardOperator
              captures: { wt_small_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets/${wt_small_id}/capture"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots/${lot_small_id}/mark-ready"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 40, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03, commission_basis: "TIERED_VALUE", yardage_basis: "PER_HEAD_DAY", ration_type: "NONE", days_on_feed: 0 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_big_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_big_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_big_id}", head_count: 40, livestock_class: "FEEDER_STEER", bid_basis: "PER_HEAD", opening_bid: 500.00, reserve_price: 550.00 }
              as: YardOperator
              captures: { lot_big_id: "$.data.id" }
            - call: "POST /sale-barn/lots/${lot_big_id}/assign-pen"
              payload: { pen_id: "${pen_id}" }
              as: YardOperator
            - call: "POST /sale-barn/weigh-tickets"
              payload: { lot_id: "${lot_big_id}", scale_id: "${scale_id}", head_on_draft: 40, gross_weight_lb: 26200, tare_weight_lb: 200 }
              as: YardOperator
              captures: { wt_big_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets/${wt_big_id}/capture"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots/${lot_big_id}/mark-ready"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/buyer-registrations"
              payload: { party_id: "${buyer_party_id}", sale_day_id: "${sale_day_id}", buyer_number: 101, bond_type: "BONDED", credit_limit: 50000, cash_deposit_amount: 0 }
              as: BarnAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /sale-barn/buyer-registrations/${br_id}/approve"
              payload: {}
              as: BarnAdmin
            - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
              payload: { to_status: "RINGING" }
              as: BarnAdmin
            - call: "POST /sale-barn/lots/${lot_small_id}/enter-ring"
              payload: {}
              as: Auctioneer
            - call: "POST /sale-barn/bids"
              payload: { lot_id: "${lot_small_id}", buyer_registration_id: "${br_id}", unit_price: 50.00 }
