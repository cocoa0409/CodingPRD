            - "Trigger -> HTTP 200: ProviderAudit.${aud_id}.status == 'SANCTIONED', sanction_type == 'PROBATION', closed_at == '2026-08-01T00:00:00Z', version == 4"
            - "Provider.${prov_id}.accreditation_status == 'PROBATIONARY', self_certification_enabled == false, probation_reason references ${aud_id}, version == 3"
            - "Provider.${prov_id}.risk_score == 0.25 with risk_score_variant == 'REVIEWED_WEIGHTING' and last_audit_closed_at == '2026-08-01T00:00:00Z'"
            - "FeeAssessment.${fee_id}.fee_type == 'AUDIT_SANCTION', amount_cents == 250000, status == 'ASSESSED', provider_id == ${prov_id}, attorney_id is null"
            - "Course.${crs_id}.status is STILL 'APPROVED' (probation never suspends courses)"

