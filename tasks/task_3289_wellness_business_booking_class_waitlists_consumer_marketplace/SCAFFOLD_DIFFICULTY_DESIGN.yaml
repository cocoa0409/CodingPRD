# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3289
# Nine §0.5 Difficulty Rules, two instances each (18 instances).
# Every instance grounds in §1.1–§1.6 of SCAFFOLD.yaml and is reachable from
# empty-DB using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: pack_seat_gross_differs_between_booked_and_attended_variant
        grounds:
          - calculations.channel_total_cents
          - calculations.channel_total_cents.variants.booked_variant
          - calculations.channel_total_cents.variants.attended_variant
          - state_machines.Booking.RESERVED_to_ATTENDED
          - entities.ClassSession.fields.list_price_cents
        distinguishing_aspect: "The two variants of channel_total_cents live on different subjects — booked_variant prices the Booking at creation from the pack entitlement (0 for a credit-covered seat) while attended_variant prices the same CLASS SESSION seat at completion from the drop-in list price — so one Booking row reports 0 and the same seat's session reports 4000 for identical inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio, one Reformer Flow 50 template (base_price_cents 4000, off-peak true), one instructor, one payroll period covering June, one client holding a 5-credit class pack, one SCHEDULED session on 2026-06-10T17:00:00Z with capacity 2."
          setup_api_calls:
            - &b4_a0_tier_star
              call: "POST /wellness/subscription-tiers"
              payload: { tier: "STARTER", monthly_fee_cents: 4900, tier_rank: 1, included_staff_seats: 2, seat_overage_fee_cents: 1900, marketplace_listing_enabled: false, staff_payroll_enabled: false, instructor_substitution_enabled: false, waitlist_auto_promotion_enabled: false, crm_client_export_enabled: false, marketplace_commission_bps: 2000 }
              as: PlatformAdmin
            - &b4_a0_tier_growth
              call: "POST /wellness/subscription-tiers"
              payload: { tier: "GROWTH", monthly_fee_cents: 9900, tier_rank: 2, included_staff_seats: 4, seat_overage_fee_cents: 1900, marketplace_listing_enabled: true, staff_payroll_enabled: true, instructor_substitution_enabled: true, waitlist_auto_promotion_enabled: true, crm_client_export_enabled: true, marketplace_commission_bps: 1500 }
              as: PlatformAdmin
            - &b4_a0_clock_jun
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: OperatorOnly
            - &b4_a0_studio_growth
              call: "POST /wellness/studios"
              payload: { legal_name: "Prana Loft", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id, studio_v: $.data.version, sub_id: $.data.subscription_id }
            - &b4_a0_sub_v_read
              call: "GET /wellness/subscriptions/${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sub_v: $.data.version }
            - &b4_a0_pp_june
              call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_id}", period_index: 1, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp1_id: $.data.id, pp1_v: $.data.version }
            - &b4_a0_tpl_flow
              call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_id: $.data.id }
            - &b4_a0_staff_ivy
              call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Ivy Chen", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 5000 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { ivy_id: $.data.id, ivy_created_at: $.data.created_at }
            - &b4_a0_sess_jun10
              call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-10T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id, sess_v: $.data.version, sess_list_price: $.data.list_price_cents }
            - &b4_a0_client_maya
              call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CA" }
              as: Client
              captures: { maya_id: $.data.id, maya_v: $.data.version }
            - &b4_a0_pack_maya
              call: "POST /wellness/class-packs"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", pack_size: 5, purchased_at: "2026-06-01T00:00:00Z", expiry_scheme: "NONE", expected_client_version: "${maya_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pack_maya_id: $.data.id }
          trigger:
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_id}", channel: "STUDIO", payment_source: "CLASS_PACK", class_pack_id: "${pack_maya_id}" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_booked: $.data.id, bk_gross_at_booked: $.data.commission_base_cents }
            - call: "POST /wellness/class-sessions/${sess_id}/complete"
              payload: {}
              as: PlatformAdmin
          assert:
            - "ClassSession.${sess_id}.list_price_cents == 4000"
            - "Booking.${bk_booked}.commission_base_cents == 0 while the booking is RESERVED — this is the booked_variant value of channel_total_cents"
            - "after POST /wellness/class-sessions/${sess_id}/complete, GET /wellness/bookings?class_session_id=${sess_id} returns exactly 1 row"
            - "that row has status ATTENDED and commission_base_cents == 4000 — the attended_variant value of the same seat"
            - "the two variants disagree on one identical seat: 0 at creation, 4000 at completion"
            - "ClassPack.${pack_maya_id}.credits_remaining == 4"

      - name: membership_cycle_late_fee_differs_between_billing_day_and_forward_looking_variant
        grounds:
          - calculations.membership_billing_cycle
          - calculations.membership_billing_cycle.variants.billing_day_chronological
          - calculations.membership_billing_cycle.variants.forward_looking
          - entities.Membership.fields.open_balance_cents
          - endpoints.POST_/wellness/memberships/{id}/advance-cycle
        distinguishing_aspect: "The two variants of membership_billing_cycle differ on the entity the fee is keyed to — billing_day_chronological compares the clock against the NEW next_billing_at while forward_looking compares it against the OLD one — so the same membership advanced from the same clock position posts 9000 with one outcome and 9900 with the other."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio. Two monthly memberships at 9000 cents on the same client, anchor day 1 (next_billing_at 2026-07-01T00:00:00Z) and anchor day 2 (next_billing_at 2026-07-02T00:00:00Z)."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - &b5_a1_client_maya
              call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CA" }
              as: Client
              captures: { maya_id: $.data.id, maya_v: $.data.version }
            - &b5_a1_memb_anchor1
              call: "POST /wellness/memberships"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", plan_name: "Unlimited Monthly", monthly_fee_cents: 9000, included_credits_per_cycle: 8, minimum_term_months: 3, freeze_allowed: true, freeze_max_days_per_cycle: 10, billing_anchor_day: 1, auto_renew: true }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { memb_a_id: $.data.id, memb_a_v: $.data.version }
            - call: "POST /wellness/memberships"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", plan_name: "Unlimited Monthly", monthly_fee_cents: 9000, included_credits_per_cycle: 8, minimum_term_months: 3, freeze_allowed: true, freeze_max_days_per_cycle: 10, billing_anchor_day: 2, auto_renew: true }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { memb_b_id: $.data.id, memb_b_v: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-02T00:00:00Z" }
              as: OperatorOnly
            - call: "POST /wellness/memberships/${memb_a_id}/advance-cycle"
              payload: { advance_days: 0, outcome: "EARLY_CHARGED", expected_membership_version: "${memb_a_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { a_forward_balance: $.data.open_balance_cents }
            - call: "POST /wellness/memberships/${memb_b_id}/advance-cycle"
              payload: { advance_days: 0, outcome: "EARLY_CHARGED", expected_membership_version: "${memb_b_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { b_forward_balance: $.data.open_balance_cents }
          assert:
            - "the forward_looking variant posts the cycle fee plus the dunning late fee for membership A: open_balance_cents == 9900"
            - "the forward_looking variant posts the plain cycle fee for membership B, whose due date the clock has not reached: open_balance_cents == 9000"
            - "re-running both rows through the same billing_day_chronological variant on a fresh pair of memberships leaves open_balance_cents == 9000 for both, because the comparison is made against the NEW next_billing_at"
            - "Membership.${memb_a_id}.current_period_index == 1 and Membership.${memb_b_id}.current_period_index == 1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: waitlist_offer_ordering_is_non_linear_over_effective_sequence_and_created_at
        grounds:
          - calculations.waitlist_offer_order
          - calculations.waitlist_offer_order.constants.STRIKE_OFFER_BLOCK_THRESHOLD
          - entities.WaitlistEntry.fields.effective_sequence
          - entities.WaitlistEntry.fields.created_at
          - state_machines.WaitlistEntry.ACTIVE_to_OFFERED
        distinguishing_aspect: "The candidate set is a three-input non-linear predicate — status, client admissibility, and a strike threshold that is compared with >= so equality blocks — and the ranking is descending in priority of (effective_sequence, created_at), so swapping one entry's position_mode inverts the whole drain order without changing any other row."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio, one template, one instructor, one payroll period, a capacity-1 session, a pack-holding client A, a pack-holding client B below the strike threshold, and a third client C whose seeded strike count is exactly 3."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - &b7_a2_sess_cap1
              call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 1, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess1_id: $.data.id }
            - *b4_a0_client_maya
            - &b7_a2_client_bea
              call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id, bea_v: $.data.version }
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Cleo Ruiz", email: "cleo@example.com", home_state_code: "CA" }
              as: Client
              captures: { cleo_id: $.data.id }
            - call: "POST /_inject/client-history"
              payload: { client_id: "${cleo_id}", no_show_strike_count: 3, late_cancel_count: 0 }
              as: OperatorOnly
            - call: "POST /wellness/bookings"
              payload: { client_id: "${bea_id}", class_session_id: "${sess1_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { bea_booking_id: $.data.id }
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess1_id}", client_id: "${maya_id}", position_mode: "QUEUED" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { wl_maya_id: $.data.id, wl_maya_raw: $.data.raw_sequence_no, wl_maya_eff: $.data.effective_sequence }
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess1_id}", client_id: "${bea_id}", position_mode: "STANDBY_ANY" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { wl_bea_id: $.data.id, wl_bea_eff: $.data.effective_sequence }
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess1_id}", client_id: "${cleo_id}", position_mode: "STANDBY_ANY" }
              as: Client
              as_user_id: "${cleo_id}"
              captures: { wl_cleo_id: $.data.id }
          trigger:
            - call: "POST /wellness/bookings/${bea_booking_id}/cancel"
              payload: { reason: "schedule conflict" }
              as: Client
              as_user_id: "${bea_id}"
          assert:
            - "WaitlistEntry.${wl_maya_id}.raw_sequence_no == 1 and WaitlistEntry.${wl_maya_id}.effective_sequence == 1"
            - "WaitlistEntry.${wl_bea_id}.effective_sequence == 0, so the standby hold outranks the earlier-joined numbered hold"
            - "the cancelled seat is offered to ${wl_bea_id}, not to ${wl_maya_id}: that entry has status OFFERED and ${wl_maya_id} is still ACTIVE"
            - "WaitlistEntry.${wl_cleo_id} is STILL ACTIVE and was skipped without error, because the >= comparison against STRIKE_OFFER_BLOCK_THRESHOLD removes it from the candidate set at a strike count of exactly 3"
            - "ClassSession.${sess1_id}.seats_held == 1 and fullness_posture == FULL"

      - name: commission_accrual_evaluation_order_pins_bonus_against_the_accrual_ceiling
        grounds:
          - calculations.commission_accrual
          - calculations.commission_accrual.variants.bonus_outside_cap
          - calculations.commission_accrual.variants.bonus_inside_cap
          - calculations.channel_total_cents
          - state_machines.Booking.CHECKED_IN_to_ATTENDED
        distinguishing_aspect: "The formula is a circular-looking dependency — commission feeds the ceiling, the channel bonus feeds commission, and the ceiling sits on either side of the bonus depending on the studio's pinned mode — so one marketplace booking that clears the bonus threshold accrues 1550 under BONUS_OUTSIDE_CAP and 1500 under BONUS_INSIDE_CAP from byte-identical inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Two GROWTH studios differing only in payroll_cap_mode, each with a 4000-cent template, an instructor, a payroll period, a client and one marketplace booking on a session that has already gone IN_PROGRESS."
