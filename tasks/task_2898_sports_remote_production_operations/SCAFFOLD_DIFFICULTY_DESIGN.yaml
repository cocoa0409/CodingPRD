            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_c_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-16T16:00:00Z", scheduled_release_utc: "2026-08-16T20:00:00Z", expected_production_version: "${pvc}" }
