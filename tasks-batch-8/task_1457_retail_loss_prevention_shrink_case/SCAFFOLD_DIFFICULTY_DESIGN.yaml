              as: LPAnalyst
              as_user_id: ana-1
              captures: { dd: $.data.id }
            - call: "POST /civil-demands/${dd}/issue"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /restitution-payments"
              payload: { demand_id: "${dd}", amount_cents: 80000, method: "CARD" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { pay1: $.data.id }
            - call: "POST /restitution-payments/${pay1}/post"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /restitution-payments"
              payload: { demand_id: "${dd}", amount_cents: 50000, method: "CASH" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { pay2: $.data.id }
            - call: "POST /restitution-payments/${pay2}/post"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "GET /civil-demands/${dd}"
              as: LPManager
              as_user_id: mgr-1
              captures: { status_before: $.data.status }
          trigger:
            - call: "POST /restitution-payments/${pay1}/return"
              payload: {}
              as: LPAnalyst
