        distinguishing_aspect: "committed_head_days is 150 x 92 = 13800 on the contract, and once submitted the pasture's own committed_head_days reads 13800 with capacity_utilization_pct 66.45 against 20769 rated head-days."
        test_recipe:
          setup: ["Pasture North Bench is AVAILABLE at 20769 rated head-days with contract K1 in DRAFT for 150 head over 92 days."]
