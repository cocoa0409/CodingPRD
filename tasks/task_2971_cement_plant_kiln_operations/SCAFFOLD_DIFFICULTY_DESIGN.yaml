            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SM1", material_kind: "CEMENT", capacity_tonnes: 8000.00, draw_rate_tonnes_per_hour: 250.00, loadout_spouts: 2 }, captures: { sm1: "$.data.id" } }
