              payload: {}
              as: DispensingPharmacist
              captures: { prep_id: "$.data[0].id" }
          trigger:
            - call: "POST /pharmacy-compounding/dispenses"
              payload: { facility_id: "${f_id}", finished_preparation_id: "${prep_id}", prescription_id: "${cancel_rx_id}" }
              as: DispensingPharmacist
