scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: standby_fee_credit_conversion_vs_fee_level_netting
    grounds:
    - calculations.commission_credit_nets_fee
    - calculations.commission_credit_nets_fee.variants.fee_floor_lift
    - entities.AccountFeeAccrual.fields.applied_credit_cents
    - entities.PortfolioAccount.fields.annual_net_fee_cents
    - state_machines.AccountFeeAccrual.transitions.OPEN_to_CREDITED
    distinguishing_aspect: The same commission population is reduced to an applied accrual credit of 7850000.00 by the OPEN->CREDITED path while the annual fee-netting path reports 39350000.00 on the PortfolioAccount, so two sanctioned readings of one commission population disagree by design.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE, portfolio_sqft 400000, ENTERPRISE tier, gross fee 47200000.00
      - Lease L1 prior rent 74000000, proposed 68000000, 60 months, third_party_commission_cents 1850000, market SFO
      - TransactionRequest T1 APPROVED then EXECUTED via broker engagement E1 with deal_commission_cents 1850000
      - AccountFeeAccrual for 2026-Q2 with base_fee_cents 2000000 (OPEN)
      - CommissionRecord R1 THIRD_PARTY base_rent_cents 40000000 commission_pct 0.15 accrual_date 2026-06-01 -> credit_amount_cents 6000000.00
      - CommissionRecord R2 generated by lease execution THIRD_PARTY -> credit_amount_cents 1850000.00
      - account clock at 2026-10-01T00:00:00Z
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: GlobalTech
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: AccountExecutive
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      - call: POST /api/transaction-requests
        payload:
          account_id: ${acc}
          lease_id: ${L1}
          request_type: RENEWAL
          prior_rent_cents_per_year: 74000000
          proposed_rent_cents_per_year: 68000000
          requested_term_months: 60
          third_party_commission_cents: 1850000
        as: TransactionManager
        captures:
          T1: $.data.id
      - call: POST /api/transaction-requests/${T1}/submit
        payload: {}
        as: TransactionManager
      - call: POST /api/accounts/${acc}/assignments
        payload:
          assignee_name: Dana Director
          assignment_role: APPROVAL_AUTHORITY
          approval_level: ACCOUNT_EXECUTIVE
        as: AccountExecutive
        as_user_id: ${acc}
        captures:
          auth: $.data.id
      - call: POST /api/transaction-requests/${T1}/decide
        payload:
          decision: APPROVE
          level: ACCOUNT_EXECUTIVE
        as: ApprovalAuthority
        as_user_id: ${auth}
      - call: POST /api/broker-engagements
        payload:
          account_id: ${acc}
          transaction_request_id: ${T1}
          market_code: SFO
          broker_name: Pat Senior
          licensed_in_market: true
          broker_class: SENIOR
        as: TransactionManager
        captures:
          eng: $.data.id
      - call: POST /api/broker-engagements/${eng}/assign
        payload: {}
        as: TransactionManager
      - call: POST /api/broker-engagements/${eng}/execute
        payload: {}
        as: TransactionManager
      - call: POST /api/leases/${L1}/execute
        payload: {}
        as: TransactionManager
      - call: POST /api/fee-accruals
        payload:
          account_id: ${acc}
          period: 2026-Q2
          base_fee_cents: 2000000
        as: AccountExecutive
        captures:
          acr: $.data.id
      - call: POST /api/commission-records
        payload:
          account_id: ${acc}
          commission_source: THIRD_PARTY
          base_rent_cents: 40000000
          commission_pct: 0.15
          accrual_date: '2026-06-01T00:00:00Z'
        as: AccountExecutive
      trigger:
      - call: POST /api/lease-executions/${acr}/apply
        payload: {}
        as: TransactionManager
      assert:
      - AccountFeeAccrual.${acr}.applied_credit_cents == 7850000.00
      - AccountFeeAccrual.${acr}.base_fee_cents == 2000000
      - AccountFeeAccrual.${acr}.applied_credit_cents != AccountFeeAccrual.${acr}.base_fee_cents
      - PortfolioAccount.${acc}.annual_net_fee_cents == 39350000.00
      - AccountFeeAccrual.${acr}.credit_application_state == CREDITED
  - name: savings_recorded_provisional_vs_final
    grounds:
    - calculations.savings_realization_score
    - calculations.savings_realization_score.variants.provisional
    - calculations.savings_realization_score.variants.final
    - entities.TransactionRequest.fields.savings_provisional_cents
    - entities.TransactionRequest.fields.savings_final_cents
    distinguishing_aspect: The identical TransactionRequest carries savings_provisional_cents 20000000 at submit and savings_final_cents 30000000 after execution, because the provisional leg uses the market benchmark 1750 cents/sqft while the final leg uses the executed rent.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE, portfolio_sqft 400000, ENTERPRISE tier
      - Lease L1 leased_sqft 40000 market_code SFO, prior_rent 74000000, proposed_rent 68000000, 60 months
      - TransactionRequest T1 built on L1, target price band ACCOUNT_EXECUTIVE
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Northwind
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      - call: POST /api/transaction-requests
        payload:
          account_id: ${acc}
          lease_id: ${L1}
          request_type: RENEWAL
          prior_rent_cents_per_year: 74000000
          proposed_rent_cents_per_year: 68000000
          requested_term_months: 60
          third_party_commission_cents: 1850000
        as: TransactionManager
        captures:
          T1: $.data.id
      - call: POST /api/transaction-requests/${T1}/submit
        payload: {}
        as: TransactionManager
      trigger:
      - call: GET /api/transaction-requests/${T1}
        as: TransactionManager
        captures:
          prov: $.data.savings_provisional_cents
      assert:
      - TransactionRequest.${T1}.savings_provisional_cents == 20000000
      - TransactionRequest.${T1}.savings_final_cents == 0
      - TransactionRequest.${T1}.request_state == PENDING_APPROVAL
- rule_id: combinatorial_formula
  instances:
  - name: tiered_fee_with_nested_credit_clamp
    grounds:
    - calculations.commission_credit_nets_fee
    - calculations.account_lifecycle_gate
    - entities.PortfolioAccount.fields.annual_net_fee_cents
    - entities.CommissionRecord.fields.credit_amount_cents
    distinguishing_aspect: One nested min/max over three inputs (portfolio_sqft tier, per-record commission total, SELF_PERFORM floor lift) plus a lifecycle-state branch yields 45350000.00 on an ENTERPRISE 400000 sqft account, not the 47200000.00 a flat-rate reading would produce.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE, portfolio_sqft 400000, ENTERPRISE tier
      - 'Two CommissionRecord rows on the account: R1 THIRD_PARTY base_rent 40000000 pct 0.15 accrual 2026-06-01; R2 SELF_PERFORM base_rent 30000000 pct 0.10 accrual 2026-07-01'
      - No fee accrual has been created yet
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Contoso
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-07-01T00:00:00Z'
        as: AccountExecutive
      - call: POST /api/commission-records
        payload:
          account_id: ${acc}
          commission_source: THIRD_PARTY
          base_rent_cents: 40000000
          commission_pct: 0.15
          accrual_date: '2026-06-01T00:00:00Z'
        as: AccountExecutive
        captures:
          cm1: $.data.id
      trigger:
      - call: POST /api/commission-records
        payload:
          account_id: ${acc}
          commission_source: SELF_PERFORM
          base_rent_cents: 30000000
          commission_pct: 0.1
          accrual_date: '2026-07-01T00:00:00Z'
        as: AccountExecutive
        captures:
          cm2: $.data.id
      assert:
      - CommissionRecord.${cm1}.credit_amount_cents == 6000000.00
      - CommissionRecord.${cm2}.credit_amount_cents == 3000000.00
      - PortfolioAccount.${acc}.annual_net_fee_cents == 41200000.00
      - PortfolioAccount.${acc}.annual_net_fee_cents != 47200000.00 - 3000000.00
  - name: commission_rounding_order_per_record_then_sum
    grounds:
    - calculations.commission_credit_nets_fee
    - calculations.commission_credit_nets_fee.variants.per_record_then_sum
    - entities.PortfolioAccount.fields.fee_ledger_credit_cents
    distinguishing_aspect: Two CommissionRecord rows whose raw products fall on half-cents give a ledger total of 258002.00 under per-record rounding versus 258001.00 under sum-then-round, so the pinned order is observable to the cent.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE, portfolio_sqft 400000, ENTERPRISE tier
      - CommissionRecord R2 base_rent_cents 333333 commission_pct 0.185 accrual 2026-06-01
      - CommissionRecord R3 base_rent_cents 190001 commission_pct 0.185 accrual 2026-07-01
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Fabrikam
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-07-01T00:00:00Z'
        as: AccountExecutive
      - call: POST /api/commission-records
        payload:
          account_id: ${acc}
          commission_source: THIRD_PARTY
          base_rent_cents: 333333
          commission_pct: 0.185
          accrual_date: '2026-06-01T00:00:00Z'
        as: AccountExecutive
        captures:
          r2: $.data.id
      trigger:
      - call: POST /api/commission-records
        payload:
          account_id: ${acc}
          commission_source: THIRD_PARTY
          base_rent_cents: 190001
          commission_pct: 0.185
          accrual_date: '2026-07-01T00:00:00Z'
        as: AccountExecutive
        captures:
          r3: $.data.id
      assert:
      - CommissionRecord.${r2}.credit_amount_cents == 61666.61
      - CommissionRecord.${r3}.credit_amount_cents == 35150.19
      - PortfolioAccount.${acc}.fee_ledger_credit_cents == 96816.80
      - PortfolioAccount.${acc}.fee_ledger_credit_cents != 96816.79
- rule_id: non_linear_state_machine
  instances:
  - name: lease_reject_revise_loop_increments_revision_count
    grounds:
    - state_machines.Lease.transitions.APPROVAL_PENDING_to_REJECTED
    - state_machines.Lease.transitions.REJECTED_to_APPROVAL_PENDING
    - entities.Lease.fields.revision_count
    - state_machines.Lease.initial_state
    distinguishing_aspect: 'The Lease machine re-enters a state it already occupied: APPROVAL_PENDING -> REJECTED -> APPROVAL_PENDING is taken twice, so the machine is cyclic rather than a forward-only pipeline.'
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      - Lease L1 REJECTED with revision_count 1 after one completed revise round
      - TransactionRequest T1 PENDING_APPROVAL on L1
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Vertex
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: COMPLETE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      - call: POST /api/transaction-requests
        payload:
          account_id: ${acc}
          lease_id: ${L1}
          request_type: RENEWAL
          prior_rent_cents_per_year: 74000000
          proposed_rent_cents_per_year: 68000000
          requested_term_months: 60
          third_party_commission_cents: 1850000
        as: TransactionManager
        captures:
          T1: $.data.id
      - call: POST /api/transaction-requests/${T1}/submit
        payload: {}
        as: TransactionManager
      - call: POST /api/leases/${L1}/submit-for-approval
        payload: {}
        as: TransactionManager
      - call: POST /api/leases/${L1}/reject
        payload: {}
        as: TransactionManager
      - call: POST /api/accounts/${acc}/assignments
        payload:
          assignee_name: Dana Director
          assignment_role: APPROVAL_AUTHORITY
          approval_level: ACCOUNT_EXECUTIVE
        as: AccountExecutive
        as_user_id: ${acc}
        captures:
          auth: $.data.id
      trigger:
      - call: GET /api/accounts/${acc}
        as: AccountExecutive
        captures:
          av: $.data.version
      - call: POST /api/leases/${L1}/revise
        payload:
          expected_account_version: ${av}
        as: TransactionManager
        captures:
          rv: $.data.revision_count
      assert:
      - Lease.${L1}.pipeline_state == APPROVAL_PENDING
      - Lease.${L1}.revision_count == 1
      - Lease.${L1}.revision_count != 0
  - name: consolidation_review_replan_fork_returns_to_planned
    grounds:
    - state_machines.ConsolidationProject.transitions.IN_REVIEW_to_PLANNED
    - state_machines.ConsolidationProject.transitions.PLANNED_to_IN_REVIEW
    - entities.ConsolidationProject.fields.savings_estimate_cents
    - calculations.consolidation_savings_estimate.variants.provisional
    distinguishing_aspect: The ConsolidationProject machine forks at IN_REVIEW into {APPROVED, PLANNED}; taking the PLANNED branch clears savings_estimate_cents to 0 and a second submit round recomputes it to 378135.12, which no forward-only pipeline can express.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE, portfolio_sqft 400000, COMPLETE tier
      - ConsolidationProject P1 IN_REVIEW with cost_inflation_factor 1.05
      - No FacilitySite rows assigned yet, so the invariant sum is 0
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: AccountExecutive
      - call: POST /api/accounts
        payload:
          account_name: Lakeside
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: COMPLETE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/consolidation-projects
        payload:
          account_id: ${acc}
          project_name: Consolidation One
          planned_sqft_reduction: 360128
          cost_inflation_factor: 1.05
          per_site_rates:
          - 3.335
          - 6.665
          - 4.005
          per_site_sqft_reductions:
          - 40001
          - 25002
          - 15003
        as: OccupancyPlanner
        captures:
          P1: $.data.id
      - call: POST /api/consolidation-projects/${P1}/submit
        payload: {}
        as: OccupancyPlanner
      trigger:
      - call: POST /api/consolidation-projects/${P1}/return-to-planning
        payload: {}
        as: OccupancyPlanner
        captures:
          s1: $.data.savings_estimate_cents
      - call: POST /api/consolidation-projects/${P1}/submit
        payload: {}
        as: OccupancyPlanner
      assert:
      - ConsolidationProject.${P1}.project_state == IN_REVIEW
      - ConsolidationProject.${P1}.savings_estimate_cents == 378135.12
      - ConsolidationProject.${P1}.savings_estimate_cents != 378135.11
- rule_id: transitive_cascade
  instances:
  - name: account_close_cascades_vendor_then_site_then_data_license
    grounds:
    - state_machines.PortfolioAccount.transitions.OFFBOARDING_to_CLOSED_TERMINATED
    - state_machines.FacilitiesVendor.transitions.ACTIVE_to_TERMINATED
    - state_machines.FacilitySite.transitions.CONSOLIDATING_to_DISPOSED
    - state_machines.DataLicense.transitions.GRANTED_to_REVOKED
    distinguishing_aspect: 'One close call walks four hops where each link triggers the next: close -> vendor TERMINATED -> its site DISPOSED -> the GRANTED DataLicense REVOKED; no hop is a direct fan-out from close.'
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE plaza-account with portfolio_sqft 400000, ENTERPRISE tier, posture NORMAL
      - One TransitionTask (DATA_HANDOVER, blocking, due 2026-12-31) completed so completion_pct_bps is 10000
      - FacilitiesVendor V1 ACTIVE serving the account
      - FacilitySite S1 CONSOLIDATING on vendor V1 via APPROVED project P1
      - DataLicense D1 GRANTED with data_scope AGGREGATE
      - account clock 2026-09-15T00:00:00Z
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Plaza Realty
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/assignments
        payload:
          assignee_name: Dana Director
          assignment_role: APPROVAL_AUTHORITY
          approval_level: ACCOUNT_EXECUTIVE
        as: AccountExecutive
        as_user_id: ${acc}
        captures:
          auth: $.data.id
      - call: POST /api/accounts/${acc}/transitions
        payload: {}
        as: AccountExecutive
      - call: POST /api/transition-tasks
        payload:
          account_id: ${acc}
          task_name: Records handover
          task_type: DATA_HANDOVER
          sequence_no: 1
          blocking: true
          due_at: '2026-12-31T00:00:00Z'
        as: TransitionManager
        captures:
          tk: $.data.id
      - call: POST /api/transition-tasks/${tk}/start
        payload: {}
        as: TransitionManager
      - call: POST /api/transition-tasks/${tk}/complete
        payload: {}
        as: TransitionManager
      - call: POST /api/facilities-vendors
        payload:
          account_id: ${acc}
          vendor_name: Ace Janitorial
          service_line: JANITORIAL
          delivery_model: SELF_PERFORM
          sourcing_program: DIVERSITY
          service_rate_cents_per_sqft: 1.25
        as: FacilitiesManager
        captures:
          V1: $.data.id
      - call: POST /api/facilities-vendors/${V1}/activate
        payload: {}
        as: FacilitiesManager
      - call: POST /api/consolidation-projects
        payload:
          account_id: ${acc}
          project_name: Consolidation One
          planned_sqft_reduction: 360128
          cost_inflation_factor: 1.05
          per_site_rates:
          - 3.335
          - 6.665
          - 4.005
          per_site_sqft_reductions:
          - 40001
          - 25002
          - 15003
        as: OccupancyPlanner
        captures:
          P1: $.data.id
      - call: POST /api/consolidation-projects/${P1}/submit
        payload: {}
        as: OccupancyPlanner
      - call: POST /api/consolidation-projects/${P1}/approve
        payload: {}
        as: ApprovalAuthority
        as_user_id: ${auth}
      - call: POST /api/facility-sites
        payload:
          account_id: ${acc}
          vendor_id: ${V1}
          site_name: Tower 30000
          sqft: 360128
          sqft_reduction: P1
        as: FacilitiesManager
        captures:
          S1: $.data.id
      - call: POST /api/facility-sites/${S1}/vacate
        payload: {}
        as: FacilitiesManager
      - call: POST /api/facility-sites/${S1}/consolidate
        payload:
          window_start: '2026-10-01T00:00:00Z'
          window_end: '2026-12-31T00:00:00Z'
        as: FacilitiesManager
      - call: POST /api/data-licenses
        payload:
          account_id: ${acc}
          licensee_name: Meridian Analytics
          platform_tier_at_issue: ENTERPRISE
          data_scope: AGGREGATE
        as: DataSteward
        captures:
          dl: $.data.id
      - call: POST /api/data-licenses/${dl}/grant
        payload: {}
        as: DataSteward
      trigger:
      - call: POST /api/accounts/${acc}/close
        payload: {}
        as: AccountExecutive
      assert:
      - PortfolioAccount.${acc}.lifecycle_state == CLOSED_TERMINATED
      - FacilitiesVendor.${V1}.vendor_state == TERMINATED
      - FacilitySite.${S1}.vacancy_state == DISPOSED
      - DataLicense.${dl}.license_state == REVOKED
  - name: consolidation_execution_disposes_sites_and_finalizes_savings
    grounds:
    - state_machines.ConsolidationProject.transitions.APPROVED_to_IN_EXECUTION
    - state_machines.FacilitySite.transitions.CONSOLIDATING_to_DISPOSED
    - calculations.consolidation_savings_estimate.variants.final
    - entities.ConsolidationProject.fields.savings_finalized_cents
    distinguishing_aspect: Starting execution cascades to every assigned CONSOLIDATING site becoming DISPOSED and freezes savings_finalized_cents 378135.11, one cent below the provisional 378135.12 because the final leg sums raw products before rounding.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE, portfolio_sqft 400000, COMPLETE tier
      - ConsolidationProject P1 APPROVED with approved_sqft_reduction 360128
      - 'Three assigned sites ordered by created_at: S1 reduction 40001, S2 25002, S3 15003, each CONSOLIDATING with adjacent non-overlapping windows'
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Summit Group
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: COMPLETE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/assignments
        payload:
          assignee_name: Dana Director
          assignment_role: APPROVAL_AUTHORITY
          approval_level: ACCOUNT_EXECUTIVE
        as: AccountExecutive
        as_user_id: ${acc}
        captures:
          auth: $.data.id
      - call: POST /api/facilities-vendors
        payload:
