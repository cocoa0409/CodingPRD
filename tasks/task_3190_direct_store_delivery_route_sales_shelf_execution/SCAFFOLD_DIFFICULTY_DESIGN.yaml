  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: store_state_failure_beats_credit_cap_fiscal_failure
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors.ERR_STORE_NOT_ACTIVE
          - errors.ERR_STORE_CREDIT_CAP_EXCEEDED
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: the credit request fails BOTH the
          store-ACTIVE state check (priority 5) and the credit-cap fiscal check
          (priority 11); the higher-priority state error ERR_STORE_NOT_ACTIVE
          must win over ERR_STORE_CREDIT_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store FULL_RETAIL with store_credit_cap_cents 100 (any multi-case credit breaches it). Product P at 250 cents; 40 cases exp 2026-09-06 (stale-eligible) loaded; day started."
            - "Store then suspended."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 250, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
