  - rule_id: cross_entity_state_dependency
    instances:
      - name: aoi_creation_gated_by_allotment_posture
        grounds:
          - state_machines.Allotment.OPEN_to_RESTRICTED
          - state_machines.Allotment.RESTRICTED_to_CLOSED
          - validations.priority_9
          - errors.ERR_ALLOTMENT_CLOSED
        distinguishing_aspect: |
          Entity pair (PastureUseRecord / AnnualOperatingInstruction depends on Allotment):
          whether a rotation window may be scheduled at all is decided by the STATE of a
          grandparent entity, not by any field of the record or of its AOI. The fixture
          isolates posture from every capacity rule deliberately: the failing call is
          POST /annual-operating-instructions/{aoiId}/use-records, an endpoint to which the
          allotment-capacity rule (validations.priority_30) does not even apply, and the
          record it schedules asks for 62 AUMs against a 300-AUM pasture, so the pasture
          aggregate rule (validations.priority_29) is also satisfied. The AOI itself is
          untouched and still DRAFT, so the AOI state gate passes too. The only fact that
          changed between the identical call that succeeded and the one that fails is a third
          entity's status flipping RESTRICTED -> CLOSED, and lifting that order flips it back
          to RESTRICTED (not OPEN, because the weaker DROUGHT_REDUCTION source survives) and
          the very same call succeeds again.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs and two 300-AUM pastures"
            - "A permittee with a 400-AUM LAND base property and an ISSUED 300-AUM permit"
            - "An ACTIVE DROUGHT_REDUCTION order for 2026-08-10..2026-09-30 with reduction_pct 0.30, so the allotment is RESTRICTED with effective_capacity_aums 840"
            - "A 2026 AOI created (DRAFT) for 200 AUMs WHILE the allotment was RESTRICTED — this must succeed"
            - "One rotation window already scheduled on that DRAFT AOI while the allotment was RESTRICTED (60 CATTLE, 2026-08-15..2026-09-15) — 62.00 planned AUMs against a 300-AUM pasture, so no capacity rule is anywhere near its limit"
