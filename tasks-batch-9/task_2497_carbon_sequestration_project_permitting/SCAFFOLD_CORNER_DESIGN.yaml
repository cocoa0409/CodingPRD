        distinguishing_aspect: |
          Both waiver conjuncts fail on the same wellbore: it penetrates the seal and its re-screened
          risk_score is 92.00, well above the 60.00 ceiling, so the reviewer's waiver is refused with 422
          ERR_CA_WAIVER_NOT_ELIGIBLE and the wellbore stays CA_REQUIRED with its 622000.00 estimate still
          inside the assurance requirement.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' with an ACCEPTED model and aor_radius_km 3.0"
