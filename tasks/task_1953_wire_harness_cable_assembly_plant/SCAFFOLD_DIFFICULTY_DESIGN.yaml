  - rule_id: boundary_precision_check
    instances:
      - name: pull_force_equal_to_minimum_passes
        grounds:
          - calculations.crimp_pull_force_minimum
          - entities.CrimpPullTest.fields.result
          - state_machines.Applicator.AVAILABLE_to_QUALIFIED
        distinguishing_aspect: |
          Force metric, inclusive boundary: measured_force_n exactly equal to the
          computed minimum 29.7N yields PASS (>=, not >) and qualifies the
          applicator, reached through POST /plant/crimp-pull-tests.
        test_recipe:
          setup:
            - "Class-3 drawing released; applicator with closed setup for a AWG-22 CLOSED_BARREL program (min 29.7N); certified class-3 inspector"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-BP1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_3" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-22", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 30 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-BP1", compatible_terminal_mpn: "TERM-22" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-BP1", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 22, wire_type: "TXL", cut_length_mm: 300.0, strip_length_mm: 4.0, terminal_mpn: "TERM-22", terminal_type: "CLOSED_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI BP1", badge_no: "B-QI-BP1" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_3", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
          trigger:
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 29.7 }, as: QualityInspector, as_user_id: "${qi}", captures: { res: $.data.result } }
            - { call: "GET /plant/applicators/${ap}", payload: {}, as: ProcessEngineer }
          assert:
            - "captured res == PASS   # 29.7 >= 29.7, inclusive boundary"
            - "Applicator.${ap}.status == QUALIFIED"

      - name: certification_expires_at_exact_instant
        grounds:
          - calculations.operator_certification_status
          - entities.OperatorCertification.fields.expires_at
          - errors[ERR_OPERATOR_NOT_CERTIFIED]
        distinguishing_aspect: |
          Time metric, exclusive boundary: a certification is ACTIVE only while
          now < expires_at; at now == expires_at exactly it is EXPIRED and the
          electrical test is rejected, reached through
          POST /plant/electrical-test-records — a different metric and endpoint
          from the pull-force boundary.
