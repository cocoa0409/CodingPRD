          assert:
            - "Plan creation moved the loan to IN_WORKOUT and set active_workout_plan_id to ${plan_id}"
            - "After the three recorded payments consecutive_timely_payments == 3 and payment_status is CURRENT"
            - "CORRECTED: servicing_status == CORRECTED, correction_source_plan_id == ${plan_id}, active_workout_plan_id == null, and Trust.loans_in_special_servicing_count back to 0"
            - "MASTER_SERVICING: servicing_status == MASTER_SERVICING with correction_source_plan_id still ${plan_id} and is_modified still true — the cycle does not erase its own history"
            - "Second transfer: servicing_status == SPECIAL_SERVICING, transfer_event_code == RECEIVERSHIP, transferred_to_special_on == 2026-09-01T00:00:00Z and asset_business_plan_due_date == 2026-10-31T00:00:00Z"
            - "Trust.loans_in_special_servicing_count == 1 again and the first BANKRUPTCY event is still consumed_by_transfer true"
            - "The workout plan is still EXECUTED — re-entry into special servicing does not reopen a closed plan"

