            - "Pre-trigger baseline: STERILE pool for template == 2 (list response total_count == 2)"
            - "Post round-trip invariant: STERILE pool again == 2 — forward + compensating pair conserves the pool (bookings never mutate tray status)"
            - "TrayReservation.${rk}.status == RELEASED (rk_st == RELEASED)"
            - "ORCase.${ck}.status == SCHEDULED (0 RESERVED remain -> reverted from TRAYS_RESERVED) and k1 is bookable again"

      - name: repair_cycle_conserves_instrument_assignment
        grounds:
          - state_machines.Instrument.FLAGGED_FOR_REPAIR_to_OUT_FOR_REPAIR
          - state_machines.Instrument.OUT_FOR_REPAIR_to_IN_SERVICE
          - entities.Instrument.fields.assigned_tray_id
        distinguishing_aspect: |
          Conserved quantity: instrument inventory cardinality and the tray's
          assigned-instrument multiset — a different conserved quantity than the
          sterile-tray pool. The forward chain (flag -> send unassigns the
          instrument, tray demotes) plus its compensating chain (receive FIXED ->
          reassign -> re-verify PASS) must restore count(Instrument) == 2 and
          count(instruments assigned to tray TM) == 2 with the tray back at
          ASSEMBLED; only repair_count (+1) legitimately changes.
        test_recipe:
          setup:
            - "Template (SCALPEL x2); technician A; tray TM ASSEMBLED with instruments i1 (SN-M1) and i2 (SN-M2) assigned and a PASS verification"
            - "Exactly 2 instruments exist in the inventory"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "OMFS-01", name: "OMFS Set", specialty: "OMFS", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 12 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TM" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tm: "$.data.id" } }
            - { call: "POST /spd/trays/${tm}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tm}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tm}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-M1", max_cycles: 50, usage_cycles: 0, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin, captures: { i1: "$.data.id" } }
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-M2", max_cycles: 50, usage_cycles: 0, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin, captures: { i2: "$.data.id" } }
            - { call: "POST /spd/instruments/${i1}/assign", payload: { tray_id: "${tm}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/instruments/${i2}/assign", payload: { tray_id: "${tm}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tm}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "GET /spd/instruments?assigned_tray_id=${tm}", as: Any }
          trigger:
            - { call: "POST /spd/instruments/${i1}/flag-for-repair", as: SpdTechnician, as_user_id: "${tech_a}", captures: { ro1: "$.data.id" } }
            - { call: "POST /spd/repair-orders/${ro1}/send", payload: { vendor: "VendorCo", quoted_cost_cents: 10000 }, as: FacilityAdmin }
            - { call: "POST /spd/repair-orders/${ro1}/receive", payload: { actual_cost_cents: 10000, outcome: "FIXED" }, as: FacilityAdmin }
            - { call: "POST /spd/instruments/${i1}/assign", payload: { tray_id: "${tm}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tm}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { v2: "$.data.result" } }
            - { call: "GET /spd/instruments", as: Any }
            - { call: "GET /spd/instruments?assigned_tray_id=${tm}", as: Any }
            - { call: "GET /spd/instruments/${i1}", as: Any }
            - { call: "GET /spd/trays/${tm}", as: Any }
