scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "POST /clinic/patients with full_name + date_of_birth returns 201 with server-minted id, created_at, version=1, status=ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/patients"
              payload: { full_name: "New Patient", date_of_birth: "1980-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id, ver: $.data.version, st: $.data.status }
          assert:
            - "response.status == 201"
            - "Patient.${pid}.status == ACTIVE"
            - "Patient.${pid}.version == 1"

      - name: create_patient_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Patient.fields.full_name"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /clinic/patients without full_name returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/patients"
              payload: { date_of_birth: "1980-01-01" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_patient_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.Patient"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /clinic/patients/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clinic/patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: ear_count_out_of_domain_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.FittingOrder.fields.ear_count"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /clinic/orders with ear_count=3 (not in {1,2}) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A patient, a FINALIZED evaluation, and an ACTIVE device model exist."]
          setup_api_calls:
            - call: "POST /clinic/patients"
              payload: { full_name: "Ear Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-EAR-1", name: "EarModel", list_price_cents: 200000, restock_fee_cents: 10000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
          trigger:
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 3 }
              as: Audiologist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: coinsurance_pct_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.AllowanceBenefit.fields.coinsurance_pct"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /clinic/allowance-benefits with coinsurance_pct=1.5 (>= 1) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /clinic/patients"
              payload: { full_name: "Coins Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /clinic/allowance-benefits"
              payload: { patient_id: "${pat_id}", plan_name: "Bad", total_allowance_cents: 100000, per_device_cap_cents: 50000, coinsurance_pct: 1.5, period_end: "2026-12-31" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: ledger_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry has common_fields:false — only id + created_at; no update endpoint and no version field exist for it."
        test_recipe:
          setup: ["A self-pay order PURCHASED so an ORDER_PURCHASE ledger entry exists."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Ledger Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-LDG-1", name: "LedgerModel", list_price_cents: 100000, restock_fee_cents: 5000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "GET /clinic/patients/${pat_id}/ledger"
              payload: {}
              as: BillingClerk
              captures: { kind0: "$.data[0].source_kind" }
          assert:
            - "response.status == 200"
            - "LedgerEntry list contains one entry with source_kind == ORDER_PURCHASE and amount_cents == 100000"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: finalize_already_finalized_evaluation_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.HearingEvaluation.DRAFT_to_FINALIZED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Finalizing an evaluation already in FINALIZED returns 409 ERR_INVALID_STATE; no re-classification side effects fire."
        test_recipe:
          setup: ["A FINALIZED evaluation exists."]
          setup_api_calls:
            - call: "POST /clinic/patients"
              payload: { full_name: "Refinalize Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
          trigger:
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: finalize_second_evaluation_supersedes_first
        claim_type: side_effect
        grounds: [state_machines.HearingEvaluation.FINALIZED_to_SUPERSEDED, entities.HearingEvaluation.fields.status]
        distinguishing_aspect: "Finalizing a second evaluation for the same patient flips the prior FINALIZED evaluation to SUPERSEDED (cascade hop)."
        test_recipe:
          setup: ["A patient with one FINALIZED evaluation."]
          setup_api_calls:
            - call: "POST /clinic/patients"
              payload: { full_name: "Supersede Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 40 }
              as: Audiologist
              captures: { eval1_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval1_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 60 }
              as: Audiologist
              captures: { eval2_id: $.data.id }
          trigger:
            - call: "POST /clinic/evaluations/${eval2_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "GET /clinic/evaluations/${eval1_id}"
              payload: {}
              as: Audiologist
              captures: { st1: $.data.status }
          assert:
            - "HearingEvaluation.${eval1_id}.status == SUPERSEDED"
            - "HearingEvaluation.${eval2_id}.status == FINALIZED"
            - "HearingEvaluation.${eval2_id}.severity == SEVERE"

      - name: cancel_purchased_order_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.FittingOrder.DRAFT_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancel is only defined from DRAFT; cancelling a PURCHASED order returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A self-pay order PURCHASED."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "CancelP Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-CXL-1", name: "CancelModel", list_price_cents: 100000, restock_fee_cents: 5000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /clinic/orders/${order_id}/cancel"
              payload: {}
              as: Audiologist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: order_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.FittingOrder, entities.FittingOrder.fields.status]
        distinguishing_aspect: "A newly created FittingOrder starts in status DRAFT with allowance_applied_cents=0 and refund_cents=0."
        test_recipe:
          setup: ["A patient, FINALIZED evaluation, ACTIVE model."]
          setup_api_calls:
            - call: "POST /clinic/patients"
              payload: { full_name: "Init Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-INI-1", name: "InitModel", list_price_cents: 100000, restock_fee_cents: 5000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
          trigger:
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { st: $.data.status, ord_id: $.data.id }
          assert:
            - "FittingOrder.${ord_id}.status == DRAFT"
            - "FittingOrder.${ord_id}.allowance_applied_cents == 0"

      - name: subscription_pause_resume_cycle_back_to_active
        claim_type: valid_transition
        grounds: [state_machines.SupplySubscription.ACTIVE_to_PAUSED, state_machines.SupplySubscription.PAUSED_to_ACTIVE]
        distinguishing_aspect: "An ACTIVE subscription pauses to PAUSED and resumes back to ACTIVE (cyclic edge), version incrementing each hop."
        test_recipe:
          setup: ["A PURCHASED order with an ACTIVE subscription owned by the patient."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "PauseR Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-PR-1", name: "PauseModel", list_price_cents: 100000, restock_fee_cents: 5000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/subscriptions"
              payload: { patient_id: "${pat_id}", fitting_order_id: "${order_id}", cadence_days: 30, unit_price_cents: 5000 }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /clinic/subscriptions/${sub_id}/pause"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { st_p: $.data.status }
            - call: "POST /clinic/subscriptions/${sub_id}/resume"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { st_r: $.data.status }
          assert:
            - "SupplySubscription.${sub_id}.status == ACTIVE"

      - name: cancel_subscription_skips_scheduled_cycles
        claim_type: conditional_cascade
        grounds: [state_machines.SupplySubscription.ACTIVE_to_CANCELLED, state_machines.SupplyCycle.SCHEDULED_to_SKIPPED]
        distinguishing_aspect: "Cancelling a subscription flips its SCHEDULED cycle to SKIPPED (conditional cascade hits only non-terminal cycles)."
        test_recipe:
          setup: ["A PURCHASED order with an ACTIVE subscription and a SCHEDULED cycle 1."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "CancelSub Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-CS-1", name: "CancelSubModel", list_price_cents: 100000, restock_fee_cents: 5000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/subscriptions"
              payload: { patient_id: "${pat_id}", fitting_order_id: "${order_id}", cadence_days: 30, unit_price_cents: 5000 }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /clinic/subscriptions/${sub_id}/cycles"
              payload: {}
              as: BillingClerk
              captures: { cyc1_id: "$.data[0].id" }
          trigger:
            - call: "POST /clinic/subscriptions/${sub_id}/cancel"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "GET /clinic/supply-cycles/${cyc1_id}"
              payload: {}
              as: BillingClerk
              captures: { cyc_st: $.data.status }
          assert:
            - "SupplySubscription.${sub_id}.status == CANCELLED"
            - "SupplyCycle.${cyc1_id}.status == SKIPPED"

      - name: terminal_returned_order_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.FittingOrder"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A RETURNED order is terminal; activate-warranty against it returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A self-pay order PURCHASED then RETURNED in-window."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Terminal Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-TRM-1", name: "TermModel", list_price_cents: 100000, restock_fee_cents: 5000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/orders/${order_id}/return"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /clinic/orders/${order_id}/activate-warranty"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: recall_issue_close_full_remediation_flow
        claim_type: side_effect
        grounds: [state_machines.RecallNotice.DRAFT_to_ISSUED, state_machines.RecallNotice.ISSUED_to_CLOSED, entities.RecallNotice.fields.affected_order_count]
        distinguishing_aspect: "Issuing a MANDATORY recall sets affected_order_count=1 over a matching WARRANTY_ACTIVE order; after a RECALL_REPROGRAM adjustment to target firmware, close succeeds."
        test_recipe:
          setup: ["A WARRANTY_ACTIVE order on model firmware 1.0.0; a DRAFT MANDATORY recall for that model+firmware -> target 1.0.1."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Recall Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-RCL-1", name: "RecallModel", list_price_cents: 200000, restock_fee_cents: 10000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/orders/${order_id}/activate-warranty"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/recalls"
              payload: { device_model_id: "${model_id}", affected_firmware_version: "1.0.0", target_firmware_version: "1.0.1", severity_level: "MANDATORY" }
              as: ClinicAdmin
              captures: { recall_id: $.data.id, recall_v: $.data.version }
            - call: "POST /clinic/recalls/${recall_id}/issue"
              payload: { expected_recall_notice_version: "${recall_v}" }
              as: ClinicAdmin
              captures: { aoc: $.data.affected_order_count }
