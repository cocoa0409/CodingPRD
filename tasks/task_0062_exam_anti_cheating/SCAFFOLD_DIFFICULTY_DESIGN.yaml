# =============================================================================
# Task 0062: Online Exam Anti-Cheating System — Scaffold Difficulty Design
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 rules.
# Every `name` is unique and stable; every `grounds` resolves to a declared
# element; every `assert` cites exact field names with literal expected values.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_score_on_exam_attempt
        grounds:
          - calculations.provisional_score_calculation
          - calculations.final_score_calculation
          - state_machines.ExamAttempt.SUBMITTED_to_GRADED
          - state_machines.Appeal.DECISION_PENDING_to_APPROVED
          - entities.ExamAttempt.fields.provisional_score
          - entities.ExamAttempt.fields.final_score
        distinguishing_aspect: |
          Two algorithms operate on the same ExamAttempt and yield different
          numbers for the same inputs: provisional_score sums only RESOLVED
          GradingAssignment rows (unresolved questions count as 0), while
          final_score re-applies the same formula after all rows are RESOLVED
          AND further applies Appeal.score_delta on APPROVED appeals. The
          divergence is forced by the unresolved-or-appeal-pending state of
          the underlying grading set, not by different formulas — this is a
          cost-accounting dual on the ExamAttempt domain.
        test_recipe:
          setup:
            - "Create Exam with start=1000, end=2000, sampling_rule_type=RANDOM, spec={target_count:2}; add one objective Question max=20 (correct answer single option) and one subjective Question max=10 (rubric sums to 10)."
            - "Register Candidate, advance clock to 1000 (Exam IN_SESSION), Candidate begins-identity-check, posts PRE_EXAM identity-verifications {id_card:true, face:true, live_detection:true} → ACTIVE."
            - "Candidate submits answers (objective correct, subjective text). Submit triggers two PENDING GradingAssignment rows (BLIND_A, BLIND_B) for the subjective question."
          trigger:
            - "Marker M1 claims BLIND_A and scores awarded_points=8 (status SUBMITTED, sibling still PENDING)."
            - "GET /exams/{examId}/attempts/{attemptId} → read provisional_score."
            - "Marker M2 claims BLIND_B and scores awarded_points=7 (|delta|=1 <= 2.0 → both RESOLVED)."
            - "GET attempt again → read final-state provisional_score and final_score."
          assert:
            - "After only BLIND_A submitted: ExamAttempt.provisional_score == 20.00 (objective only, subjective unresolved → 0)."
            - "After both RESOLVED: ExamAttempt.provisional_score == 27.50 (20 + round((8+7)/2, 2))."
            - "After Exam → SCORES_PUBLISHED: ExamAttempt.final_score == 27.50, ExamAttempt.status == FINALIZED."
            - "ExamAttempt.provisional_score != ExamAttempt.final_score at the snapshot after only BLIND_A was scored (20.00 vs would-be 27.50)."

      - name: severity_score_realtime_vs_after_the_fact_on_abnormal_event
        grounds:
          - calculations.severity_classification
          - calculations.severity_classification.variants.realtime_variant
          - calculations.severity_classification.variants.after_the_fact_variant
          - entities.AbnormalEvent.fields.severity_score
          - entities.AbnormalEvent.fields.severity
          - entities.AbnormalEvent.fields.marking_mode
          - state_machines.ExamAttempt.ACTIVE_to_DISQUALIFIED
        distinguishing_aspect: |
          Two algorithm variants on the AbnormalEvent domain (distinct from
          the ExamAttempt-score domain in the first instance) produce different
          severity_score numbers for the same behavior_rule_code +
          monitoring_channel: REALTIME_ALERT multiplier is 1.0,
          AFTER_THE_FACT is 0.5. The same MULTI_PERSON + SCREEN inputs yield
          70.0 (CRITICAL → cascade) under REALTIME_ALERT vs 35.0 (WARNING →
          no cascade) under AFTER_THE_FACT.
        test_recipe:
          setup:
            - "Reach two ExamAttempt rows A1 and A2 in ACTIVE status (same exam, two registrations, two PRE_EXAM PASS verifications)."
          trigger:
            - "Proctor POSTs abnormal-events on A1: {channel:SCREEN, rule:MULTI_PERSON, mode:REALTIME_ALERT, evidence_clip_uri:'s3://e1'}."
            - "Proctor POSTs abnormal-events on A2: {channel:SCREEN, rule:MULTI_PERSON, mode:AFTER_THE_FACT, evidence_clip_uri:'s3://e2'}."
          assert:
            - "AbnormalEvent for A1: severity_score == 70.00 and severity == 'CRITICAL'."
            - "AbnormalEvent for A2: severity_score == 35.00 and severity == 'WARNING'."
            - "A1.status == 'DISQUALIFIED' (cascade fired) AND A1.final_score == 0; A2.status == 'ACTIVE' (no cascade)."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: stratified_sampling_with_three_difficulty_buckets
        grounds:
          - calculations.paper_composition_sampling
          - entities.Exam.fields.sampling_rule_type
          - entities.Exam.fields.sampling_rule_spec
          - entities.Question.fields.difficulty
          - entities.ExamAttempt.fields.paper_question_ids
          - state_machines.ExamAttempt.IDENTITY_PENDING_to_ACTIVE
        distinguishing_aspect: |
          Mode (a): the paper_composition_sampling formula has ≥3 inputs
          (sampling_rule_type, sampling_rule_spec, the deterministic seed) and
          non-linear interaction — STRATIFIED branches per-bucket eligibility
          and seeded shuffling independently, then concatenates in fixed bucket
          order [EASY, MEDIUM, HARD]. A bucket whose eligible pool is smaller
          than its declared count raises ERR_SAMPLING_INFEASIBLE before any
          other bucket is consumed, exercising the non-linear branch.
        test_recipe:
          setup:
            - "Create Exam with sampling_rule_type=STRATIFIED, sampling_rule_spec={difficulty_buckets:{EASY:2, MEDIUM:1, HARD:1}}."
            - "Insert 4 EASY questions Q_e1..Q_e4 (max=5 each, objective), 3 MEDIUM Q_m1..Q_m3 (max=5 each), 2 HARD Q_h1, Q_h2 (max=5 each)."
            - "open-registration; register candidate; advance clock past start_time; begin-identity-check; submit PRE_EXAM PASS."
          trigger:
            - "POST PRE_EXAM identity-verifications triggers paper composition."
          assert:
            - "len(ExamAttempt.paper_question_ids) == 4."
            - "Of those 4 question_ids: exactly 2 have difficulty=='EASY', exactly 1 has difficulty=='MEDIUM', exactly 1 has difficulty=='HARD'."
            - "Ordering invariant: the two EASY ids appear before the MEDIUM id, which appears before the HARD id (declared bucket order [EASY, MEDIUM, HARD])."
            - "Re-creating an attempt with the same registration_id and seed yields identical paper_question_ids (deterministic)."

      - name: round_per_question_then_sum_for_subjective_total
        grounds:
          - calculations.provisional_score_calculation
          - entities.GradingAssignment.fields.awarded_points
          - entities.ExamAttempt.fields.paper_question_ids
        distinguishing_aspect: |
          Mode (b): nested rounding order matters. The formula pins
          round-per-question FIRST (round mean awarded_points to 2 dp for
          each subjective question) and sums exactly afterward — NOT
          sum-then-round. With three subjective questions whose BLIND means
          are 7.333..., 6.666..., and 5.5, round-then-sum gives
          7.33+6.67+5.50=19.50 whereas sum-then-round gives
          round(19.4999...,2)=19.50 — pin a case where the two orderings
          diverge: means 7.335, 6.665, 5.5 → round_half_up to 7.34, 6.67, 5.50
          → sum 19.51, vs sum-then-round 19.50.
        test_recipe:
          setup:
            - "Create Exam with sampling_rule_type=RANDOM, spec={target_count:3}; add 3 subjective questions (SHORT_ANSWER), each max=10, rubric sums to 10."
            - "Register candidate; advance clock to IN_SESSION; PRE_EXAM PASS → ACTIVE."
            - "Submit attempt: 3 BLIND_A/BLIND_B PENDING pairs created."
          trigger:
            - "Marker M1 BLIND_A on Q1=7.34, Q2=6.67, Q3=5.50; Marker M2 BLIND_B on Q1=7.33, Q2=6.66, Q3=5.50."
            - "All three pairs resolve (|deltas|=0.01, 0.01, 0 — well under ARBITRATION_THRESHOLD=2.0)."
          assert:
            - "per-question rounded subjective: Q1==7.34 ((7.34+7.33)/2=7.335 → round_half_up → 7.34), Q2==6.67, Q3==5.50."
            - "ExamAttempt.provisional_score == 19.51 (exact sum of pre-rounded per-question values: 7.34+6.67+5.50)."
            - "ExamAttempt.provisional_score != 19.50 (a sum-then-round implementation would produce 19.50; the scaffold pins 19.51)."

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: exam_attempt_active_suspended_cycle
        grounds:
          - state_machines.ExamAttempt.ACTIVE_to_SUSPENDED
          - state_machines.ExamAttempt.SUSPENDED_to_ACTIVE
          - entities.ExamAttempt.fields.suspended_total_seconds
          - entities.ExamAttempt.fields.current_suspend_started_at
        distinguishing_aspect: |
          ExamAttempt has a true cycle ACTIVE ⇄ SUSPENDED driven by
          network-disconnect / network-resume. Each cycle accumulates
          suspended_total_seconds; the same attempt can traverse the cycle
          multiple times before terminal SUBMITTED/DISQUALIFIED. This is on
          the ExamAttempt entity.
        test_recipe:
          setup:
            - "Reach an ExamAttempt in ACTIVE state at clock=1100."
          trigger:
            - "POST network-disconnect at clock=1100 → SUSPENDED (current_suspend_started_at=1100)."
            - "Advance clock to 1200; POST network-resume → ACTIVE (suspended_total_seconds += 100 == 100)."
            - "Advance clock to 1300; POST network-disconnect → SUSPENDED."
            - "Advance clock to 1450; POST network-resume → ACTIVE (suspended_total_seconds += 150 == 250)."
          assert:
            - "Final ExamAttempt.status == 'ACTIVE' AND suspended_total_seconds == 250."
            - "ExamAttempt.version increased by exactly 4 from the start of this trigger sequence (one per mutation)."
            - "The same row visited ACTIVE more than once during the test, proving cyclic shape."

      - name: grading_assignment_arbitration_cycle
        grounds:
          - state_machines.GradingAssignment.SUBMITTED_to_IN_PROGRESS
          - entities.GradingAssignment.fields.blind_slot
          - calculations.provisional_score_calculation.constants.ARBITRATION_THRESHOLD
        distinguishing_aspect: |
          GradingAssignment exhibits a cycle on a DIFFERENT entity from the
          previous instance: SUBMITTED→IN_PROGRESS via arbitration when
          |BLIND_A.awarded - BLIND_B.awarded| > ARBITRATION_THRESHOLD (2.0).
          A third row with blind_slot=ARBITRATION is spawned in PENDING and
          claimed by a new marker; only after the ARBITRATION row is scored
          do all three transition RESOLVED. The two siblings re-enter
          IN_PROGRESS conceptually (the cycle) when their RESOLVED is
          delayed waiting for arbitration completion.
        test_recipe:
          setup:
            - "Reach an ExamAttempt SUBMITTED for an Exam with one subjective Question max=10. Two PENDING GradingAssignment rows BLIND_A and BLIND_B exist."
          trigger:
            - "Marker M1 claims BLIND_A, scores awarded_points=10 (status SUBMITTED)."
            - "Marker M2 claims BLIND_B, scores awarded_points=4 (|delta|=6 > 2.0 → ARBITRATION spawned)."
            - "Marker M3 claims the ARBITRATION row, scores awarded_points=6."
          assert:
            - "Exactly 3 GradingAssignment rows exist for this (attempt_id, question_id); blind_slot set == {'BLIND_A','BLIND_B','ARBITRATION'}."
            - "After M2 submits BLIND_B: BLIND_A.status == 'SUBMITTED', BLIND_B.status == 'SUBMITTED', ARBITRATION.status == 'PENDING' — proves the cycle (BLIND_A is in SUBMITTED but not RESOLVED, waiting for arbitration)."
            - "After M3 scores ARBITRATION: all three rows have status == 'RESOLVED' simultaneously."
            - "ExamAttempt.provisional_score == 6.00 (arbitration value supersedes blind values per pinned formula)."

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: critical_event_disqualify_score_progress_cascade_depth3
        grounds:
          - state_machines.ExamAttempt.ACTIVE_to_DISQUALIFIED
          - state_machines.CandidateRegistration.REGISTERED_to_DISQUALIFIED
          - calculations.grading_progress_pct
          - calculations.final_score_calculation
          - entities.Exam.fields.grading_progress_pct
          - entities.ExamAttempt.fields.final_score
          - entities.AuditLogEntry.fields.action_code
        distinguishing_aspect: |
          Depth-3 chain triggered by a single POST .../abnormal-events with
          severity=CRITICAL on MULTI_PERSON/EXTERNAL_DEVICE during ACTIVE:
          (hop 1) AbnormalEvent.severity is computed CRITICAL → ExamAttempt
          transitions ACTIVE→DISQUALIFIED; (hop 2) ExamAttempt.final_score is
          forced to 0 because of the new DISQUALIFIED status set in hop 1;
          (hop 3) Exam.grading_progress_pct is recomputed because the
          DISQUALIFIED attempt is excluded from total_slots in the formula —
          each hop is caused by the previous hop's mutation, not by the
          original POST. Origin is the POST abnormal-events trigger.
        test_recipe:
          setup:
            - "Set up two ExamAttempts A1 and A2 in ACTIVE for the same Exam. Submit A2 normally so its GradingAssignment rows exist. Leave A1 ACTIVE."
            - "Capture Exam.grading_progress_pct before the cascade (call it P0)."
          trigger:
            - "Proctor POSTs abnormal-events on A1: {channel:SCREEN, rule:MULTI_PERSON, mode:REALTIME_ALERT, evidence_clip_uri:'s3://x'} — severity_score=70.0=CRITICAL."
          assert:
            - "hop1: A1.status == 'DISQUALIFIED' and the matching CandidateRegistration.status == 'DISQUALIFIED'."
            - "hop2: A1.final_score == 0 and A1.provisional_score == 0 (forced by hop1's status flip)."
            - "hop3: Exam.grading_progress_pct after cascade != P0 (the recomputation triggered by hop1's status flip, because A1 is now excluded from total_slots)."
            - "AuditLogEntry with action_code='SCORE_ADJUSTED' and subject_id==A1.id is present (records hop2)."

      - name: appeal_approved_score_adjust_audit_cascade_depth2
        grounds:
          - state_machines.Appeal.DECISION_PENDING_to_APPROVED
          - calculations.final_score_calculation
          - entities.Appeal.fields.score_delta
          - entities.ExamAttempt.fields.final_score
          - entities.AuditLogEntry.fields.action_code
        distinguishing_aspect: |
          Depth-2 chain originating from a DIFFERENT trigger than the depth-3
          chain: POST .../appeals/{id}/decide with decision=APPROVED.
          (hop 1) Appeal status flips DECISION_PENDING→APPROVED, score_delta
          is finalized; (hop 2) the APPROVED status flip from hop 1 itself
          triggers ExamAttempt.final_score += score_delta and AuditLogEntry
          append. The two hops are causally chained (hop 2 fires because of
          hop 1's status mutation, not the original POST).
        test_recipe:
          setup:
            - "Reach an Exam in APPEAL_WINDOW with a FINALIZED ExamAttempt whose final_score==27.50 (subjective Q1 per_question_subjective==7.50). Submit an Appeal for Q1, claim it, secondary-mark with secondary_awarded_points=9.0 (so score_delta=+1.5)."
          trigger:
            - "AppealOfficer POSTs decide with decision='APPROVED'."
          assert:
            - "hop1: Appeal.status == 'APPROVED', Appeal.score_delta == 1.50."
            - "hop2: ExamAttempt.final_score == 29.00 (27.50 + 1.50) and AuditLogEntry with action_code='SCORE_ADJUSTED', subject_id == ExamAttempt.id, delta.before==27.50, delta.after==29.00 exists."
            - "Trigger origin is the decide endpoint, not the secondary-mark endpoint (hop2 only fires on APPROVED status transition)."

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_forced_submit_vs_identity_recheck
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.ExamAttempt.ACTIVE_to_DISQUALIFIED
        distinguishing_aspect: |
          Error-category pair: state (priority 5: ERR_INVALID_STATE) vs
          business_safety (priority 6: ERR_IDENTITY_MISMATCH and priority 7:
          ERR_EXAM_WINDOW_CLOSED). At clock>=end_time, an attempt with a
          forced_recheck_emitted=true event tries to POST an IN_EXAM_RECHECK
          identity verification: both checks fail (attempt no longer ACTIVE
          AND exam window closed). The validation priority pins
          business_safety (ERR_EXAM_WINDOW_CLOSED at priority 7) BEFORE the
          state check at priority 5? No — priority 5 is numerically lower,
          so it wins. Pin: priority 5 ERR_INVALID_STATE is returned because
          the attempt's status is no longer ACTIVE (forced_submit moved it
          to SUBMITTED). The conflict is between these two categories on
          the SAME endpoint, with priority-ordering picking ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Reach ExamAttempt ACTIVE with a CRITICAL FACE_LEAVE event recorded earlier (forced_recheck_emitted=true)."
            - "Advance clock to Exam.end_time → automatic forced_submit moves attempt to SUBMITTED."
          trigger:
            - "Candidate POSTs identity-verifications {verification_phase:IN_EXAM_RECHECK, factor_results:{id_card:true,face:true,live_detection:true}, triggered_by_event_id:<event_id>}."
          assert:
            - "Response status 409 with error_id == 'ERR_INVALID_STATE' (priority 5 state check wins because attempt is now SUBMITTED, not ACTIVE)."
            - "The error_id is NOT 'ERR_EXAM_WINDOW_CLOSED' (priority 7) nor 'ERR_IDENTITY_MISMATCH' (priority 6) nor 'ERR_NO_PENDING_RECHECK', confirming the priority-pair conflict resolved at the lowest priority number."

      - name: existence_vs_business_constraint_open_registration_with_empty_bank
        grounds:
          - validations[priority=3]
          - validations[priority=10]
          - state_machines.Exam.DRAFT_to_OPEN_REGISTRATION
        distinguishing_aspect: |
          Different error-category pair from the first instance: existence
          (priority 3: ERR_EXAM_NOT_FOUND) vs business_constraint (priority
          10: ERR_QUESTION_BANK_EMPTY / ERR_SAMPLING_INFEASIBLE). On POST
          /exams/bogus-id/open-registration where the exam id does not
          exist AND the body would have failed the bank-emptiness check too,
          priority 3 wins and ERR_EXAM_NOT_FOUND is returned — not the
          business_constraint code. This is a different pair than instance 1.
        test_recipe:
          setup:
            - "Create no exams (empty universe)."
          trigger:
            - "POST /exams/00000000-0000-0000-0000-000000000000/open-registration as ExamAdmin."
          assert:
            - "Response status 404 with error_id == 'ERR_EXAM_NOT_FOUND' (priority 3 existence wins over priority 10 business_constraint)."
            - "Response error_id is NOT 'ERR_QUESTION_BANK_EMPTY' (would only be raised if existence passed)."

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: severity_score_70_boundary_critical_vs_warning
        grounds:
          - calculations.severity_classification
          - entities.AbnormalEvent.fields.severity
          - entities.AbnormalEvent.fields.severity_score
          - state_machines.ExamAttempt.ACTIVE_to_DISQUALIFIED
        distinguishing_aspect: |
          Metric: severity_score numeric threshold for CRITICAL. The formula
          says severity_score >= 70 → CRITICAL. With MULTI_PERSON(70) *
          SCREEN(1.0) * REALTIME_ALERT(1.0) the result is exactly 70.00 and
          MUST classify CRITICAL; with MULTI_PERSON(70) * SCREEN(1.0) *
          AFTER_THE_FACT(0.5) the result is exactly 35.00 (sits at the
          INFO/WARNING boundary — pinned WARNING per the >= 35 cutoff).
          Endpoint: POST /exams/{examId}/attempts/{attemptId}/abnormal-events.
        test_recipe:
          setup:
            - "Two ExamAttempts A1, A2 in ACTIVE."
          trigger:
            - "Proctor POSTs abnormal-events on A1: {channel:SCREEN, rule:MULTI_PERSON, mode:REALTIME_ALERT, evidence_clip_uri:'s3://e1'}."
            - "Proctor POSTs abnormal-events on A2: {channel:SCREEN, rule:MULTI_PERSON, mode:AFTER_THE_FACT, evidence_clip_uri:'s3://e2'}."
          assert:
            - "A1 event: severity_score == 70.00 AND severity == 'CRITICAL' AND A1.status flips to 'DISQUALIFIED'."
            - "A2 event: severity_score == 35.00 AND severity == 'WARNING' AND A2.status remains 'ACTIVE' (35 is exactly on the WARNING lower edge, not >= 70)."

      - name: exam_end_time_boundary_submit_vs_forced_submit
        grounds:
          - validations[priority=7]
          - state_machines.ExamAttempt.ACTIVE_to_SUBMITTED
          - state_machines.Exam.IN_SESSION_to_GRADING
          - concurrency_rules[scenario contains "Candidate submits"]
        distinguishing_aspect: |
          Different metric (clock-time interval boundary) and different
          endpoint (POST .../submit) from the first instance. The window is
          [start_time, end_time) — strict less-than at the upper bound.
          At clock == end_time - 1, Candidate submit succeeds (status ACTIVE
          → SUBMITTED). At clock == end_time, forced_submit owns the
          transition and any candidate submit returns ERR_EXAM_WINDOW_CLOSED
          (or ERR_INVALID_STATE if already moved). Boundary precision: < vs >=.
        test_recipe:
          setup:
            - "Two parallel ExamAttempts A3, A4 in ACTIVE for an Exam with end_time=2000."
          trigger:
            - "Advance clock to 1999 (one second before end). Candidate of A3 POSTs submit → succeeds."
            - "Advance clock to 2000 (exact end). Candidate of A4 POSTs submit."
          assert:
            - "A3 response status 200; A3.status == 'SUBMITTED' AND A3.submitted_at == 1999."
            - "A4 response status 409 with error_id == 'ERR_INVALID_STATE' OR error_id == 'ERR_EXAM_WINDOW_CLOSED' (server-side forced_submit cascaded first at exactly 2000); A4.submitted_at == 2000 with submitter == system."

      - name: question_bank_empty_at_open_registration
        grounds:
          - validations[priority=10]
          - state_machines.Exam.DRAFT_to_OPEN_REGISTRATION
          - entities.Question
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and endpoint:
          count(Question rows under exam) == 0 vs >= 1. Endpoint: POST
          /exams/{examId}/open-registration. Adding even one question
          (boundary +1) flips the call from ERR_QUESTION_BANK_EMPTY to a
          downstream feasibility check.
        test_recipe:
          setup:
            - "Create Exam E1 in DRAFT with sampling_rule_type=RANDOM, spec={target_count:1}; do NOT add any Question."
            - "Create Exam E2 in DRAFT with identical spec; add exactly 1 objective Question (max=10, correct_answer set)."
          trigger:
            - "POST /exams/E1/open-registration."
            - "POST /exams/E2/open-registration."
          assert:
            - "E1 response 422 with error_id == 'ERR_QUESTION_BANK_EMPTY' (count==0 boundary)."
            - "E2 response 200, E2.status == 'OPEN_REGISTRATION' (count==1 boundary just sufficient)."

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: exam_attempt_start_requires_exam_in_session
        grounds:
          - validations[priority=4]
          - state_machines.ExamAttempt.ENROLLED_to_IDENTITY_PENDING
          - state_machines.Exam.READY_to_IN_SESSION
        distinguishing_aspect: |
          Entity pair (ExamAttempt, Exam). ExamAttempt cannot transition
          ENROLLED → IDENTITY_PENDING unless Exam.status == IN_SESSION.
          This is a precondition where attempt-A's valid transition set
          depends on parent-Exam's current state.
        test_recipe:
          setup:
            - "Create Exam at start=1000, end=2000; add a Question; open-registration; close-registration → Exam.status='READY'. Register Candidate, create ExamAttempt (status ENROLLED). Do NOT advance clock past 1000."
          trigger:
            - "Candidate POSTs begin-identity-check at clock=999."
          assert:
            - "Response 409 with error_id == 'ERR_EXAM_NOT_IN_SESSION'."
            - "After advancing clock to 1000 (Exam→IN_SESSION) and re-POSTing begin-identity-check: response 200, ExamAttempt.status == 'IDENTITY_PENDING'."

      - name: appeal_claim_requires_exam_in_appeal_window
        grounds:
          - validations[priority=4]
          - state_machines.Appeal.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Exam.SCORES_PUBLISHED_to_APPEAL_WINDOW
          - state_machines.Exam.APPEAL_WINDOW_to_ARCHIVED
        distinguishing_aspect: |
          Different entity pair (Appeal, Exam) from the first instance.
          AppealOfficer claiming a SUBMITTED Appeal requires Exam.status
          == APPEAL_WINDOW. Outside that window (whether SCORES_PUBLISHED
          before APPEAL_WINDOW entry, or ARCHIVED after), claim is rejected.
        test_recipe:
          setup:
            - "Reach Exam.status == APPEAL_WINDOW with one Appeal in SUBMITTED."
          trigger:
            - "AppealOfficer claims the Appeal — succeeds (Appeal.status → UNDER_REVIEW)."
            - "Reset by creating a second Appeal A2 (SUBMITTED); advance clock past appeal_window close so Exam.status → ARCHIVED."
            - "AppealOfficer claims A2."
          assert:
            - "First claim: response 200, Appeal.status == 'UNDER_REVIEW'."
            - "Second claim: response 409 with error_id == 'ERR_EXAM_NOT_IN_APPEAL_WINDOW' AND A2.status == 'REJECTED' (auto-rejected by appeal_window_close cascade)."

      - name: grading_assignment_claim_requires_attempt_submitted_or_later
        grounds:
          - validations[priority=5]
          - state_machines.GradingAssignment.PENDING_to_IN_PROGRESS
          - state_machines.ExamAttempt.ACTIVE_to_SUBMITTED
        distinguishing_aspect: |
          Third entity pair (GradingAssignment, ExamAttempt) — same scaffold
          mechanism, different relationship. A GradingAssignment exists only
          after ExamAttempt → SUBMITTED, but if the ExamAttempt subsequently
          becomes DISQUALIFIED (e.g., AFTER_THE_FACT critical event upgraded
          to CRITICAL in some flow), claiming PENDING rows must fail because
          the parent attempt's state is no longer eligible. This pair differs
          from the (ExamAttempt, Exam) and (Appeal, Exam) pairs above.
        test_recipe:
          setup:
            - "Reach ExamAttempt SUBMITTED with one PENDING GradingAssignment row R for a subjective question. Then transition the parent ExamAttempt to DISQUALIFIED via a CRITICAL EXTERNAL_DEVICE event (the cascade also discards R)."
          trigger:
            - "Marker M attempts POST claim on R."
          assert:
            - "Response 404 with error_id == 'ERR_GRADING_ASSIGNMENT_NOT_FOUND' OR 409 with error_id == 'ERR_INVALID_STATE' (R was set to DISCARDED in the cascade)."
            - "Either error confirms the cross-entity dependency: claim outcome flips when the parent ExamAttempt's state changes."

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: candidate_one_active_attempt_per_exam_overlap
        grounds:
          - entities.ExamAttempt.fields.registration_id
          - state_machines.ExamAttempt.ENROLLED_to_IDENTITY_PENDING
          - concurrency_rules[scenario contains "Candidate submits"]
          - validations[priority=5]
        distinguishing_aspect: |
          Interval semantics: open–open. A candidate may have at most one
          ExamAttempt simultaneously in any non-terminal status
          {ENROLLED, IDENTITY_PENDING, ACTIVE, SUSPENDED, SUBMITTED, GRADED}
          for a given Exam, because exactly one CandidateRegistration exists
          per (exam, candidate) and exactly one ExamAttempt exists per
          registration. Overlap is rejected with no adjacency allowance —
          even a second attempt creation while the first is non-terminal
          fails.
        test_recipe:
          setup:
            - "Register Candidate C1 on Exam E1 → Registration R1. Candidate creates ExamAttempt A1 from R1 (status ENROLLED)."
          trigger:
            - "Candidate posts another /exams/E1/attempts with registration_id=R1."
          assert:
            - "Response 409 with error_id == 'ERR_INVALID_STATE' (R1 already has a non-terminal attempt)."
            - "Only ONE ExamAttempt row exists with registration_id == R1 (open-open overlap rejected)."

      - name: marker_at_most_one_active_grading_per_attempt_question_pair
        grounds:
          - validations[priority=8]
          - state_machines.GradingAssignment.PENDING_to_IN_PROGRESS
          - concurrency_rules[scenario contains "blind_slots"]
        distinguishing_aspect: |
          Different interval semantics (per-marker exclusivity across the
          two blind slots of the same (attempt_id, question_id), with
          adjacency ALLOWED — i.e., marker M may claim BLIND_A on attempt-A
          question-Q AND BLIND_A on attempt-B question-Q simultaneously
          because they're on different (attempt_id, question_id) tuples).
          The forbidden interval is "same marker on both blind_slots of the
          same (attempt, question)" — a stricter aggregate-capacity rule
          than the candidate-attempt overlap above. Different resource entity
          (GradingAssignment vs ExamAttempt).
        test_recipe:
          setup:
            - "Reach one ExamAttempt SUBMITTED with two PENDING GradingAssignment rows R_A (BLIND_A) and R_B (BLIND_B) for the same subjective question Q."
            - "Set up a second ExamAttempt SUBMITTED with rows R_A2 (BLIND_A) and R_B2 (BLIND_B) for the same Q."
          trigger:
            - "Marker M1 POSTs claim on R_A → succeeds."
            - "Marker M1 POSTs claim on R_A2 → must succeed (different (attempt_id, question_id) — adjacency allowed)."
            - "Marker M1 POSTs claim on R_B (same attempt_id, same question_id, sibling blind_slot) → must fail."
          assert:
            - "Second claim (R_A2): response 200, GradingAssignment.status == 'IN_PROGRESS'."
            - "Third claim (R_B): response 409 with error_id == 'ERR_DOUBLE_BLIND_VIOLATION'."
            - "Confirms aggregate-capacity rule scoped to (attempt_id, question_id), not to marker globally."

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: appeal_score_adjustment_audit_total_invariant
        grounds:
          - state_machines.Appeal.DECISION_PENDING_to_APPROVED
          - calculations.final_score_calculation
          - entities.Appeal.fields.score_delta
          - entities.AuditLogEntry.fields.action_code
          - entities.AuditLogEntry.fields.delta
        distinguishing_aspect: |
          Conserved quantity #1: cumulative SCORE_ADJUSTED audit delta vs
          attempt final_score divergence. For any Exam, the invariant pins:
            sum_over_audit_rows(SCORE_ADJUSTED rows for attempt A: delta.after - delta.before)
            == ExamAttempt(A).final_score - <original_final_score_at_FINALIZED>
          The forward action (Appeal APPROVED with score_delta = +Δ) is
          paired with an AuditLogEntry whose delta.after - delta.before == +Δ.
          If a subsequent reversing appeal applies score_delta = -Δ (e.g.,
          a corrective second-round arbitration), the named global quantity
          (sum of all SCORE_ADJUSTED deltas) returns to its original value.
        test_recipe:
          setup:
            - "Reach Exam in APPEAL_WINDOW with FINALIZED attempt A whose final_score == 27.50."
            - "Submit Appeal Q1 with secondary_awarded_points=9.0 (score_delta=+1.5), claim, secondary-mark, decide APPROVED. After this, A.final_score == 29.00."
            - "Submit a second Appeal Q1 with secondary_awarded_points=7.5 (score_delta=-1.5 relative to the now-current per_question_subjective). Note: prior_awarded_points on a second appeal reflects the most recent finalized value (9.0 after the first appeal). So second score_delta = 7.5 - 9.0 = -1.5. Claim, secondary-mark, decide APPROVED."
          trigger:
            - "Both decide APPROVED calls execute in sequence."
          assert:
            - "After both appeals: A.final_score == 27.50 (returned to the original FINALIZED value)."
            - "AuditLogEntry rows for action_code='SCORE_ADJUSTED' on subject_id==A.id sum_of(delta.after - delta.before) == 0.00 (named global quantity 'cumulative score adjustment' unchanged after compensating pair)."

      - name: identity_verification_count_append_only_invariant
        grounds:
          - calculations.identity_verification_count_invariant
          - entities.ExamAttempt.fields.identity_verification_count
          - entities.IdentityVerificationRecord
          - state_machines.ExamAttempt.ACTIVE_to_DISQUALIFIED
        distinguishing_aspect: |
          DIFFERENT conserved quantity from the score-delta invariant:
          identity_verification_count vs count of IdentityVerificationRecord
          rows. Forward action (POST identity-verifications) appends a
          record AND increments the counter; compensating action
          (DISQUALIFIED cascade) does NOT delete prior records nor decrement
          the counter — the archive is append-only. The invariant pinned:
            ExamAttempt.identity_verification_count == count(IdentityVerificationRecord
                                                            where attempt_id == ExamAttempt.id)
          MUST hold across every transition, including DISQUALIFIED. The
          named quantity (count of identity records) is conserved across the
          forward/compensating pair, never drifting.
        test_recipe:
          setup:
            - "Reach ExamAttempt A in ACTIVE with identity_verification_count==1 (PRE_EXAM PASS), 1 IdentityVerificationRecord row."
            - "Record a CRITICAL FACE_LEAVE event (forced_recheck_emitted=true). Candidate POSTs IN_EXAM_RECHECK PASS → identity_verification_count==2, 2 records."
          trigger:
            - "Proctor POSTs a CRITICAL MULTI_PERSON event on A → ACTIVE→DISQUALIFIED cascade."
          assert:
            - "ExamAttempt.identity_verification_count == 2 (unchanged by the cascade — no decrement)."
            - "count(IdentityVerificationRecord rows with attempt_id==A.id) == 2 (no rows deleted by the cascade)."
            - "ExamAttempt.identity_verification_count == count(IdentityVerificationRecord rows) (invariant holds; named global quantity 'identity record archive count' conserved)."
