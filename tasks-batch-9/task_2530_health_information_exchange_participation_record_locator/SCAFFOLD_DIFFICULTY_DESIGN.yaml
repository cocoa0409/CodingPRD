              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-reviewer-1"
          trigger:
            - call: "POST /hie/break-glass-accesses/${bgF2_id}/review-decision"
              payload: { outcome: "UNJUSTIFIED", review_note: "No haemorrhage protocol activation exists for this encounter; the override was not clinically justified." }
              as: PrivacyOfficer
