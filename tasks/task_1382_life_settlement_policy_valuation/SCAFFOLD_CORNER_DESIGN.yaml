            - { call: "POST /api/brokers", payload: { name: "Broker B", license_number: "BR-B", state_code: "TX" }, as: PlatformAdmin, captures: { bb: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${ba}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${ba}", captures: { p1: "$.data.id" } }
