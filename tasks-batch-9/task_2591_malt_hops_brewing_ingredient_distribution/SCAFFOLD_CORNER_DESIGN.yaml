              as: Brewer
              as_user_id: "${cd_id}"
              captures: { cd_recipe_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${cd_prod_id}", lot_code: "LOT-CD-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { cd_lot_id: $.data.id }
            - call: "POST /malt-lots/${cd_lot_id}/analysis"
              payload: { color_lovibond: 6.00, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
          trigger:
            - call: "GET /malt-lots/${cd_lot_id}/spec-match"
              payload: { recipe_id: "${cd_recipe_id}" }
              as: WarehouseOperator
              captures: { cd_score: $.data.match_score, cd_grade: $.data.match_grade, cd_dc: $.data.deviation_color }
          assert:
            - "${cd_dc} == 1.0000 — capped, not the raw 2.3333"
            - "${cd_score} == 53.38 — 100 * (1 - (1.0000*0.40 + 0.1000*0.35 + 0.1250*0.25)) = 53.375 rounded half-up"
            - "${cd_grade} == REJECTED — below GRADE_SUBSTITUTE_MIN 60.00"
            - "the lot is still MaltLot.${cd_lot_id}.status == PASSED — colour is a scoring attribute, not a quality gate"
            - "capping the weighted sum instead of the individual deviation would give 0.00 or a negative score; capping per attribute is what yields 53.38"

      - name: adjunct_recipe_raises_the_diastatic_floor_and_hard_fails_the_lot
