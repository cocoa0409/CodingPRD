# =============================================================================
# PRD Benchmark Seed Tables — Building Commissioning & Systems Verification
# Task 2106 · commissioning authority (CxA) firm
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!  2106. Building Commissioning &
  Systems Verification (commissioning authority firm): commissioning plan &
  owner project requirements, design review & submittal verification,
  pre-functional checklist by equipment, functional performance testing &
  issue log, seasonal/deferred testing scheduling, training verification &
  systems manual, retro-commissioning of existing buildings, certification
  credit documentation

domain_name: building-commissioning
api_prefix: "/"

# -----------------------------------------------------------------------------
# Step 0 — Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer top-level collections joined by explicit foreign keys. No entity is
  # nested inside another entity's URL path; every resource is addressed at
  # `/<collection>/{id}` and discovered through filtered list endpoints.

  state_machine_shape: cyclic
  # Submittal (RECEIVED -> REVISE_AND_RESUBMIT -> RECEIVED), PrefunctionalChecklist
  # (EXECUTED/VERIFIED -> REWORK -> EXECUTED) and Issue (VERIFIED_CLOSED -> OPEN)
  # all loop. EquipmentUnit carries two independent state dimensions
  # (install_status x verification_status). FunctionalTest forks
  # IN_PROGRESS -> {PASSED, PASSED_WITH_EXCEPTIONS, FAILED} with divergent
  # side-effect sets. CxProject.readiness_posture is a derived posture gate.

  relationship_patterns:
    - one_to_many
    - many_to_many          # CertificationCredit <-> artifacts via CreditEvidence
    - self_referential      # OwnerRequirement.supersedes_requirement_id,
                            # FunctionalTest.retest_of_test_id
    - polymorphic           # Issue.source_ref_id, CreditEvidence.evidence_ref_id
    - cross_aggregate       # Issue/CreditEvidence reach across project sub-trees

  role_model: segregation_of_duties
  # The user id that executes a pre-functional checklist may never verify it;
  # the user id that delivers a closeout deliverable may never accept it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # The scenario explicitly demands a design harder than Expert. Depth is spent
  # on: dense cross-entity invariants (two conserved quantities), two dual-variant
  # calculations on unrelated entity domains, a four-hop transitive cascade, a
  # pinned single-pass evaluation order for a circular-looking score, two
  # different interval geometries, a 32-row strict validation precedence chain,
  # and optimistic concurrency on a parent whose version is bumped by cascades.

# -----------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: CxProject
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Commissioning engagement name" }
      - { name: building_name, type: string, source: input, description: "Building or facility the engagement covers" }
      - { name: project_type, type: enum, source: input, description: "NEW_CONSTRUCTION | RETRO_COMMISSIONING", constraints: "NEW_CONSTRUCTION | RETRO_COMMISSIONING" }
      - { name: certification_target, type: enum, source: input, default: NONE, description: "Green-certification package the owner is pursuing", constraints: "NONE | STANDARD | ENHANCED" }
      - { name: contract_value_cents, type: integer, source: input, description: "Total construction contract value in cents; base of the retainage cap", constraints: ">= 1" }
      - { name: witness_capacity, type: integer, source: input, default: 1, description: "How many functional tests the CxA firm can witness on this project over one instant", constraints: ">= 1" }
      - { name: delivery_phase, type: enum, source: system, default: PLANNING, description: "Engagement phase; advanced one step at a time", constraints: "PLANNING | DESIGN | CONSTRUCTION | FUNCTIONAL_TESTING | ACCEPTANCE | WARRANTY | CLOSED" }
      - { name: readiness_posture, type: enum, source: computed, default: OPEN, description: "Derived gate gating credit submission, acceptance, seasonal scheduling and phase advance", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: issue_severity_index, type: number, source: computed, default: 0, description: "Aged, severity-weighted score over Issue rows with status IN {OPEN, IN_REVIEW}; drives readiness_posture" }
      - { name: retainage_withheld_cents, type: integer, source: computed, default: 0, description: "Sum of Issue.retainage_hold_cents over Issue rows with status IN {OPEN, IN_REVIEW, DEFERRED}" }
      - { name: verified_prefunctional_units, type: integer, source: computed, default: 0, description: "Sum of EquipmentUnit.weight_units over equipment whose PrefunctionalChecklist.status == VERIFIED" }
      - { name: open_blocking_issue_count, type: integer, source: computed, default: 0, description: "Count of Issue rows with status IN {OPEN, IN_REVIEW} and blocks_acceptance == true" }
      - { name: acceptance_completion_score, type: number, source: computed, default: 0, description: "PROVISIONAL variant of acceptance_completion_score (calculations.acceptance_completion_score), refreshed on every contributing mutation" }
      - { name: final_acceptance_score, type: number, source: computed, default: null, description: "FINAL variant of acceptance_completion_score, persisted only by POST /cx-projects/{id}/issue-acceptance" }
      - { name: acceptance_kind, type: enum, source: system, default: null, description: "Acceptance certificate issued, if any", constraints: "null | SUBSTANTIAL | FINAL" }
      - { name: withdrawn_credit_count, type: integer, source: computed, default: 0, description: "Count of CertificationCredit rows this project has driven SUBMITTED -> WITHDRAWN" }
      - { name: total_awarded_points, type: number, source: computed, default: 0, description: "Sum of CertificationCredit.awarded_points over credits with status == AWARDED" }

  - name: OwnerRequirement
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CxProject.id; the engagement this Owner Project Requirement line belongs to" }
      - { name: supersedes_requirement_id, type: string, source: system, default: null, description: "FK -> OwnerRequirement.id; set on the revision row created by POST /owner-requirements/{id}/revise, null on originals" }
      - { name: metric_key, type: string, source: input, description: "Measurable OPR key, e.g. SUPPLY_AIRFLOW_CFM" }
      - { name: target_value, type: number, source: input, description: "Owner target for metric_key", constraints: ">= 0" }
      - { name: tolerance_pct, type: number, source: input, description: "Acceptable deviation band in percent", constraints: ">= 0 and <= 100" }
      - { name: criticality, type: enum, source: input, description: "Drives auto-issue severity and retainage factor", constraints: "LIFE_SAFETY | CRITICAL | STANDARD" }
      - { name: revision, type: integer, source: system, default: 1, description: "Revision number; a revise call mints revision = predecessor.revision + 1" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle of this OPR line", constraints: "DRAFT | APPROVED | SUPERSEDED" }

  - name: CxPlan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CxProject.id; the engagement this commissioning plan governs" }
      - { name: title, type: string, source: input, description: "Commissioning plan title" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Plan lifecycle", constraints: "DRAFT | APPROVED | SUPERSEDED" }
      - { name: pinned_requirement_ids, type: array, source: computed, default: [], description: "Ids of every OwnerRequirement of this project whose status == APPROVED at the instant of plan approval, ordered by OwnerRequirement.created_at ASC" }
      - { name: pinned_requirement_count, type: integer, source: computed, default: 0, description: "Length of pinned_requirement_ids" }
      - { name: pin_stale, type: boolean, source: computed, default: false, description: "true once any pinned OwnerRequirement has been superseded by a revision" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which status became APPROVED" }

  - name: Submittal
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CxProject.id; engagement under which the submittal is reviewed" }
      - { name: equipment_id, type: string, source: input, default: null, description: "FK -> EquipmentUnit.id; equipment the submittal covers, null for project-wide design documents" }
      - { name: title, type: string, source: input, description: "Submittal title" }
      - { name: submittal_kind, type: enum, source: input, description: "Kind of document under design review", constraints: "DESIGN_DOCUMENT | PRODUCT_DATA | SHOP_DRAWING | OM_DATA" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "Review lifecycle; loops RECEIVED -> REVISE_AND_RESUBMIT -> RECEIVED", constraints: "RECEIVED | APPROVED | APPROVED_AS_NOTED | REVISE_AND_RESUBMIT" }
      - { name: review_round, type: integer, source: system, default: 1, description: "Number of times this submittal has entered review; incremented by resubmit" }
      - { name: last_decision, type: enum, source: system, default: null, description: "Most recent reviewer decision", constraints: "null | APPROVED | APPROVED_AS_NOTED | REVISE_AND_RESUBMIT" }
      - { name: review_comment, type: string, source: system, default: null, description: "Comment recorded with last_decision" }
      - { name: escalation_issue_id, type: string, source: system, default: null, description: "Id of the Issue auto-opened when review_round reaches MAX_REVIEW_ROUNDS with a REVISE_AND_RESUBMIT decision; discover it via GET /issues?project_id=<project_id> and match Issue.source_ref_id == this submittal id" }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CxProject.id; engagement that owns this equipment tag" }
      - { name: tag, type: string, source: input, description: "Equipment tag, e.g. AHU-1" }
      - { name: system_type, type: enum, source: input, description: "Building system family", constraints: "AHU | CHILLER | BOILER | LIGHTING | FIRE_ALARM | ELEVATOR | BAS" }
      - { name: criticality, type: enum, source: input, description: "Drives retainage criticality factor and auto-issue severity", constraints: "LIFE_SAFETY | CRITICAL | STANDARD" }
      - { name: contract_value_cents, type: integer, source: input, description: "Contract value attributable to this equipment, in cents; retainage base", constraints: ">= 1" }
      - { name: weight_units, type: integer, source: input, description: "Relative weight of this equipment in acceptance_completion_score", constraints: ">= 1" }
      - { name: install_status, type: enum, source: system, default: NOT_INSTALLED, description: "Physical installation dimension (independent of verification_status)", constraints: "NOT_INSTALLED | INSTALLED | STARTED_UP | REMOVED" }
      - { name: verification_status, type: enum, source: system, default: UNVERIFIED, description: "Commissioning verification dimension (independent of install_status)", constraints: "UNVERIFIED | PREFUNCTIONAL_VERIFIED | FUNCTIONAL_ACCEPTED | CONDITIONALLY_ACCEPTED" }
      - { name: blocking_issue_count, type: integer, source: computed, default: 0, description: "Count of Issue rows with equipment_id == this id, blocks_acceptance == true and status IN {OPEN, IN_REVIEW}" }

  - name: PrefunctionalChecklist
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> EquipmentUnit.id; the equipment this pre-functional checklist covers" }
      - { name: template_code, type: string, source: input, description: "Checklist template identifier, e.g. PFC-AHU-STD" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Checklist lifecycle; loops through REWORK", constraints: "DRAFT | EXECUTED | VERIFIED | REWORK" }
      - { name: items, type: array, source: system, default: [], description: "Embedded line items, each an object { item_code, description, is_safety_critical, result, recorded_by_user_id, recorded_at }; result IN {PENDING, PASS, FAIL, NA}; ordered by insertion" }
      - { name: item_count, type: integer, source: computed, default: 0, description: "Length of items" }
      - { name: passed_item_count, type: integer, source: computed, default: 0, description: "Count of items whose result IN {PASS, NA}" }
      - { name: failed_item_count, type: integer, source: computed, default: 0, description: "Count of items whose result == FAIL" }
      - { name: executed_by_user_id, type: string, source: system, default: null, description: "X-User-ID that last drove EXECUTED; compared against the verifier for segregation of duties" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID that last drove VERIFIED" }
      - { name: rework_cycle_count, type: integer, source: system, default: 0, description: "Number of times this checklist has entered REWORK" }

  - name: FunctionalTest
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> EquipmentUnit.id; equipment under functional performance test" }
      - { name: requirement_id, type: string, source: input, description: "FK -> OwnerRequirement.id; the OPR line this test verifies; must be pinned by the project's APPROVED CxPlan" }
      - { name: retest_of_test_id, type: string, source: system, default: null, description: "FK -> FunctionalTest.id; set on rows minted by POST /functional-tests/{id}/schedule-retest" }
      - { name: script_code, type: string, source: input, description: "Functional test script identifier, e.g. FPT-AHU-ECON" }
      - { name: scheduled_start, type: datetime, source: input, description: "Start of the witnessed window (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "End of the witnessed window (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Test lifecycle; forks at result recording", constraints: "SCHEDULED | IN_PROGRESS | PASSED | PASSED_WITH_EXCEPTIONS | FAILED | CANCELLED" }
      - { name: measured_value, type: number, source: system, default: null, description: "Value recorded by POST /functional-tests/{id}/record-result" }
      - { name: outcome_deviation_pct, type: number, source: computed, default: null, description: "calculations.functional_outcome_deviation output; percent deviation of measured_value from the requirement target" }
      - { name: witness_user_id, type: string, source: system, default: null, description: "X-User-ID recorded as the witness at result recording" }
      - { name: started_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the SCHEDULED -> IN_PROGRESS transition" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which a terminal outcome was recorded" }
      - { name: generated_issue_id, type: string, source: system, default: null, description: "Id of the Issue auto-opened by a FAILED or PASSED_WITH_EXCEPTIONS outcome; discover it via GET /issues?equipment_id=<equipment_id> and match Issue.source_ref_id == this test id" }

  - name: Issue
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CxProject.id; engagement whose issue log holds this row" }
      - { name: equipment_id, type: string, source: input, default: null, description: "FK -> EquipmentUnit.id; equipment the deficiency is charged to, null for project-wide findings" }
      - { name: closure_retest_id, type: string, source: system, default: null, description: "FK -> FunctionalTest.id; retest evidence supplied at verify-closure" }
      - { name: origin, type: enum, source: input, description: "Where the deficiency was found", constraints: "DESIGN_REVIEW | SUBMITTAL | PREFUNCTIONAL | FUNCTIONAL | SEASONAL | RETRO_CX" }
      - { name: source_ref_id, type: string, source: input, default: null, description: "Polymorphic reference resolved by origin: SUBMITTAL -> Submittal.id, FUNCTIONAL -> FunctionalTest.id, PREFUNCTIONAL -> PrefunctionalChecklist.id, SEASONAL -> DeferredTest.id, DESIGN_REVIEW and RETRO_CX -> null" }
      - { name: severity, type: enum, source: input, description: "Deficiency severity", constraints: "S1 | S2 | S3 | S4" }
      - { name: description, type: string, source: input, description: "Narrative of the deficiency" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Issue-log lifecycle; VERIFIED_CLOSED is re-openable", constraints: "OPEN | IN_REVIEW | VERIFIED_CLOSED | DEFERRED | VOID" }
      - { name: blocks_acceptance, type: boolean, source: computed, description: "true iff severity IN {S1, S2}; doubles the severity-index contribution" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock instant of creation; the aging clock for issue_severity_index" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID that opened the issue, or the literal SYSTEM for auto-opened rows" }
      - { name: proposed_by_user_id, type: string, source: system, default: null, description: "X-User-ID that last drove OPEN -> IN_REVIEW" }
      - { name: proposed_resolution, type: string, source: system, default: null, description: "Corrective action proposed at OPEN -> IN_REVIEW" }
      - { name: retainage_hold_cents, type: integer, source: computed, description: "calculations.issue_retainage_hold output, frozen at creation" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times this issue has been re-opened" }

  - name: DeferredTest
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> EquipmentUnit.id; equipment whose seasonal/deferred test is scheduled" }
      - { name: requirement_id, type: string, source: input, description: "FK -> OwnerRequirement.id; OPR line the deferred test verifies" }
      - { name: issue_id, type: string, source: input, default: null, description: "FK -> Issue.id; the deferred issue this seasonal test discharges, null for planned seasonal work" }
      - { name: season, type: enum, source: input, description: "Season the test must be executed in", constraints: "HEATING | COOLING | SHOULDER" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the seasonal window (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the seasonal window (ISO 8601 UTC); must be strictly after window_start" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "Seasonal test lifecycle", constraints: "PLANNED | BLOCKED | EXECUTED_PASS | EXECUTED_FAIL | MISSED" }
      - { name: executed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of execution" }
      - { name: measured_value, type: number, source: system, default: null, description: "Value recorded at execution" }

  - name: CloseoutDeliverable
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CxProject.id; engagement the deliverable closes out" }
      - { name: equipment_id, type: string, source: input, default: null, description: "FK -> EquipmentUnit.id; equipment the deliverable covers, null for project-wide deliverables" }
      - { name: deliverable_kind, type: enum, source: input, description: "Closeout artifact family", constraints: "TRAINING_SESSION | SYSTEMS_MANUAL_SECTION | OM_DATA_PACKAGE" }
      - { name: title, type: string, source: input, description: "Deliverable or training topic title" }
      - { name: required_attendee_count, type: integer, source: input, default: 0, description: "Owner staff required to attend; 0 for non-training deliverables", constraints: ">= 0" }
      - { name: attendee_count, type: integer, source: system, default: 0, description: "Attendees recorded at delivery" }
      - { name: duration_minutes, type: integer, source: system, default: 0, description: "Session length recorded at delivery" }
      - { name: session_start, type: datetime, source: system, default: null, description: "Logical-clock instant recorded at delivery" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "Deliverable lifecycle; RETURNED loops back to DELIVERED", constraints: "PLANNED | DELIVERED | ACCEPTED | RETURNED" }
      - { name: delivered_by_user_id, type: string, source: system, default: null, description: "X-User-ID that drove PLANNED/RETURNED -> DELIVERED" }
      - { name: accepted_by_user_id, type: string, source: system, default: null, description: "X-User-ID that drove DELIVERED -> ACCEPTED" }
      - { name: coverage_ratio, type: number, source: computed, default: 0, description: "min(attendee_count / required_attendee_count, 1.0) rounded to 4 decimals; exactly 1.0 when required_attendee_count == 0" }

  - name: CertificationCredit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CxProject.id; engagement pursuing the credit" }
      - { name: credit_code, type: string, source: input, description: "Certification credit identifier, e.g. EA-CX-ENHANCED" }
      - { name: required_evidence_count, type: integer, source: input, description: "Evidence rows the credit needs for full completeness", constraints: ">= 0" }
      - { name: max_points, type: number, source: input, description: "Points the credit is worth at GOLD tier", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: NOT_STARTED, description: "Credit documentation lifecycle", constraints: "NOT_STARTED | IN_PREPARATION | SUBMITTED | AWARDED | DENIED | WITHDRAWN" }
      - { name: evidence_count, type: integer, source: computed, default: 0, description: "Count of CreditEvidence rows with credit_id == this id" }
      - { name: fresh_evidence_count, type: integer, source: computed, default: 0, description: "Count of CreditEvidence rows with credit_id == this id and is_stale == false" }
      - { name: stale_evidence_count, type: integer, source: computed, default: 0, description: "Count of CreditEvidence rows with credit_id == this id and is_stale == true" }
      - { name: completeness_ratio, type: number, source: computed, default: 0, description: "Step 1 of calculations.credit_documentation_score" }
      - { name: provisional_tier, type: enum, source: computed, default: NONE, description: "Step 2 of calculations.credit_documentation_score; feeds the score and is never re-derived from it", constraints: "NONE | BRONZE | SILVER | GOLD" }
      - { name: documentation_score, type: number, source: computed, default: 0, description: "Step 3 of calculations.credit_documentation_score" }
      - { name: final_tier, type: enum, source: computed, default: NONE, description: "Step 4 of calculations.credit_documentation_score; derived from documentation_score and never fed back into it", constraints: "NONE | BRONZE | SILVER | GOLD" }
      - { name: awarded_points, type: number, source: computed, default: 0, description: "round(max_points * TIER_AWARD_FRACTION[final_tier], 2), written only on the AWARDED transition" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the SUBMITTED transition" }

  - name: CreditEvidence
    parent: null
    common_fields: true
    fields:
      - { name: credit_id, type: string, source: input, description: "FK -> CertificationCredit.id; the credit this evidence row documents" }
      - { name: evidence_type, type: enum, source: input, description: "Artifact family the evidence points at", constraints: "EQUIPMENT_VERIFICATION | FUNCTIONAL_TEST | CHECKLIST | TRAINING | MANUAL_SECTION | ENERGY_BASELINE" }
      - { name: evidence_ref_id, type: string, source: input, description: "Polymorphic reference resolved by evidence_type: EQUIPMENT_VERIFICATION -> EquipmentUnit.id, FUNCTIONAL_TEST -> FunctionalTest.id, CHECKLIST -> PrefunctionalChecklist.id, TRAINING and MANUAL_SECTION -> CloseoutDeliverable.id, ENERGY_BASELINE -> EnergyBaseline.id" }
      - { name: is_stale, type: boolean, source: computed, default: false, description: "true when the referenced artifact has fallen out of its evidentiary state (see calculations.credit_evidence_freshness)" }
      - { name: staled_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which is_stale last flipped to true" }

  - name: EnergyBaseline
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CxProject.id; retro-commissioning engagement the measure belongs to" }
      - { name: measure_code, type: string, source: input, description: "Retro-commissioning measure identifier, e.g. RCX-SAT-RESET" }
      - { name: baseline_kwh, type: number, source: input, description: "Pre-retrofit annual consumption in kWh", constraints: "> 0" }
      - { name: baseline_hdd, type: number, source: input, description: "Heating degree days of the baseline period", constraints: "> 0" }
      - { name: stipulated_kwh_per_hour, type: number, source: input, description: "Deemed savings rate for the measure", constraints: ">= 0" }
      - { name: operating_hours, type: number, source: input, description: "Annual operating hours claimed for the measure", constraints: ">= 0" }
      - { name: post_kwh, type: number, source: system, default: null, description: "Post-retrofit consumption recorded by POST /energy-baselines/{id}/post-period" }
      - { name: post_hdd, type: number, source: system, default: null, description: "Heating degree days of the post period" }
      - { name: deemed_savings_kwh, type: number, source: computed, default: null, description: "DEEMED variant of calculations.retro_savings_estimate" }
      - { name: measured_savings_kwh, type: number, source: computed, default: null, description: "MEASURED variant of calculations.retro_savings_estimate" }
      - { name: certified_savings_kwh, type: number, source: computed, default: null, description: "The variant frozen by POST /energy-baselines/{id}/certify-savings" }
      - { name: certified_variant, type: enum, source: system, default: null, description: "Which variant was certified", constraints: "null | DEEMED | MEASURED" }
      - { name: status, type: enum, source: system, default: BASELINE_SET, description: "Measurement-and-verification lifecycle", constraints: "BASELINE_SET | POST_PERIOD_RECORDED | CERTIFIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- CxProject
  - entity: CxProject
    dimension: delivery_phase
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: DESIGN
        trigger: "POST /cx-projects/{id}/advance-phase with target_phase=DESIGN"
        actor: CxAuthority
        preconditions:
          - "CxProject.readiness_posture != FROZEN"
          - "at least one OwnerRequirement of this project has status == APPROVED"
        side_effects:
          - "sets delivery_phase = DESIGN"
          - "increments CxProject.version by 1"
      - from: DESIGN
        to: CONSTRUCTION
        trigger: "POST /cx-projects/{id}/advance-phase with target_phase=CONSTRUCTION"
        actor: CxAuthority
        preconditions:
          - "CxProject.readiness_posture != FROZEN"
          - "exactly one CxPlan of this project has status == APPROVED"
        side_effects:
          - "sets delivery_phase = CONSTRUCTION"
          - "increments CxProject.version by 1"
      - from: CONSTRUCTION
        to: FUNCTIONAL_TESTING
        trigger: "POST /cx-projects/{id}/advance-phase with target_phase=FUNCTIONAL_TESTING"
        actor: CxAuthority
        preconditions:
          - "CxProject.readiness_posture != FROZEN"
          - "CxProject.verified_prefunctional_units >= 1"
        side_effects:
          - "sets delivery_phase = FUNCTIONAL_TESTING"
          - "increments CxProject.version by 1"
      - from: FUNCTIONAL_TESTING
        to: ACCEPTANCE
        trigger: "POST /cx-projects/{id}/advance-phase with target_phase=ACCEPTANCE"
        actor: CxAuthority
        preconditions:
          - "CxProject.readiness_posture != FROZEN"
          - "every EquipmentUnit of this project has verification_status IN {PREFUNCTIONAL_VERIFIED, FUNCTIONAL_ACCEPTED, CONDITIONALLY_ACCEPTED}"
        side_effects:
          - "sets delivery_phase = ACCEPTANCE"
          - "increments CxProject.version by 1"
      - from: ACCEPTANCE
        to: WARRANTY
        trigger: "POST /cx-projects/{id}/advance-phase with target_phase=WARRANTY"
        actor: CxAuthority
        preconditions:
          - "CxProject.readiness_posture != FROZEN"
          - "CxProject.acceptance_kind IS NOT null"
        side_effects:
          - "sets delivery_phase = WARRANTY"
          - "increments CxProject.version by 1"
      - from: WARRANTY
        to: CLOSED
        trigger: "POST /cx-projects/{id}/advance-phase with target_phase=CLOSED"
        actor: CxAuthority
        preconditions:
          - "CxProject.readiness_posture != FROZEN"
          - "zero DeferredTest rows of this project have status IN {PLANNED, BLOCKED}"
          - "zero Issue rows of this project have status IN {OPEN, IN_REVIEW, DEFERRED}"
        side_effects:
          - "sets delivery_phase = CLOSED"
          - "increments CxProject.version by 1"
    note: "Strictly one step forward. Any other target_phase (skip, repeat, or reverse) is rejected with ERR_PHASE_NOT_ALLOWED."

  - entity: CxProject
    dimension: readiness_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: recomputation of calculations.issue_severity_index after any Issue create/close/void/reopen/defer, after any severity-index-affecting clock advance, or after POST /cx-projects/{id}/run-seasonal-sweep"
        actor: system
        preconditions:
          - "recomputed issue_severity_index >= 16.00 and < 40.00"
        side_effects:
          - "sets readiness_posture = RESTRICTED"
          - "increments CxProject.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "system: recomputation of calculations.issue_severity_index"
        actor: system
        preconditions:
          - "recomputed issue_severity_index >= 40.00"
        side_effects:
          - "sets readiness_posture = FROZEN"
          - "every DeferredTest of this project with status == PLANNED moves to BLOCKED"
          - "increments CxProject.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: recomputation of calculations.issue_severity_index"
        actor: system
        preconditions:
          - "recomputed issue_severity_index >= 40.00"
        side_effects:
          - "sets readiness_posture = FROZEN"
          - "every DeferredTest of this project with status == PLANNED moves to BLOCKED"
          - "increments CxProject.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system: recomputation of calculations.issue_severity_index"
        actor: system
        preconditions:
          - "recomputed issue_severity_index >= 16.00 and < 40.00"
        side_effects:
          - "sets readiness_posture = RESTRICTED"
          - "every DeferredTest of this project with status == BLOCKED returns to PLANNED"
          - "increments CxProject.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "system: recomputation of calculations.issue_severity_index"
        actor: system
        preconditions:
          - "recomputed issue_severity_index < 16.00"
        side_effects:
          - "sets readiness_posture = OPEN"
          - "every DeferredTest of this project with status == BLOCKED returns to PLANNED"
          - "increments CxProject.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: recomputation of calculations.issue_severity_index"
        actor: system
        preconditions:
          - "recomputed issue_severity_index < 16.00"
        side_effects:
          - "sets readiness_posture = OPEN"
          - "increments CxProject.version by 1"
    note: "Posture is a pure function of issue_severity_index; it is never set by a client. FROZEN blocks credit submission, acceptance issuance, deliverable acceptance, seasonal scheduling and phase advance."

  # -------------------------------------------------------- OwnerRequirement
  - entity: OwnerRequirement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /owner-requirements/{id}/approve"
        actor: OwnerRepresentative
        preconditions:
          - "OwnerRequirement.status == DRAFT"
        side_effects:
          - "sets status = APPROVED"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /owner-requirements/{id}/revise"
        actor: OwnerRepresentative
        preconditions:
          - "OwnerRequirement.status == APPROVED"
        side_effects:
          - "sets status = SUPERSEDED on the predecessor"
          - "creates a new OwnerRequirement with status = DRAFT, revision = predecessor.revision + 1 and supersedes_requirement_id = predecessor.id"
          - "for every CxPlan of the project whose pinned_requirement_ids contains the predecessor id, sets CxPlan.pin_stale = true"

  # ------------------------------------------------------------------ CxPlan
  - entity: CxPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /cx-plans/{id}/approve"
        actor: OwnerRepresentative
        preconditions:
          - "CxPlan.status == DRAFT"
          - "CxProject.delivery_phase IN {PLANNING, DESIGN}"
          - "at least one OwnerRequirement of the project has status == APPROVED"
        side_effects:
          - "sets status = APPROVED and approved_at = current logical clock"
          - "sets pinned_requirement_ids = ids of every OwnerRequirement of the project with status == APPROVED, ordered by OwnerRequirement.created_at ASC"
          - "sets pinned_requirement_count = length(pinned_requirement_ids) and pin_stale = false"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /cx-plans (a newer plan is created for the same project)"
        actor: CxAuthority
        preconditions:
          - "a new CxPlan row is created for the same project_id"
        side_effects:
          - "sets status = SUPERSEDED on every prior CxPlan of the project"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /cx-plans (a newer plan is created for the same project)"
        actor: CxAuthority
        preconditions:
          - "a new CxPlan row is created for the same project_id"
        side_effects:
          - "sets status = SUPERSEDED on every prior CxPlan of the project"

  # --------------------------------------------------------------- Submittal
  - entity: Submittal
    initial_state: RECEIVED
    terminal_states: [APPROVED, APPROVED_AS_NOTED]
    transitions:
      - from: RECEIVED
        to: APPROVED
        trigger: "POST /submittals/{id}/review with decision=APPROVED"
        actor: CxAuthority
        preconditions:
          - "Submittal.status == RECEIVED"
        side_effects:
          - "sets status = APPROVED, last_decision = APPROVED, review_comment = comment"
      - from: RECEIVED
        to: APPROVED_AS_NOTED
        trigger: "POST /submittals/{id}/review with decision=APPROVED_AS_NOTED"
        actor: CxAuthority
        preconditions:
          - "Submittal.status == RECEIVED"
        side_effects:
          - "sets status = APPROVED_AS_NOTED, last_decision = APPROVED_AS_NOTED, review_comment = comment"
          - "creates an Issue with origin = DESIGN_REVIEW, severity = S4, equipment_id = Submittal.equipment_id, source_ref_id = Submittal.id, opened_by_user_id = SYSTEM"
      - from: RECEIVED
        to: REVISE_AND_RESUBMIT
        trigger: "POST /submittals/{id}/review with decision=REVISE_AND_RESUBMIT"
        actor: CxAuthority
        preconditions:
          - "Submittal.status == RECEIVED"
        side_effects:
          - "sets status = REVISE_AND_RESUBMIT, last_decision = REVISE_AND_RESUBMIT, review_comment = comment"
          - "when review_round == MAX_REVIEW_ROUNDS (3): creates an Issue with origin = SUBMITTAL, severity = S2, equipment_id = Submittal.equipment_id, source_ref_id = Submittal.id, opened_by_user_id = SYSTEM, and writes its id to Submittal.escalation_issue_id"
      - from: REVISE_AND_RESUBMIT
        to: RECEIVED
        trigger: "POST /submittals/{id}/resubmit"
        actor: DesignTeam
        preconditions:
          - "Submittal.status == REVISE_AND_RESUBMIT"
          - "Submittal.review_round < MAX_REVIEW_ROUNDS (3)"
        side_effects:
          - "sets status = RECEIVED"
          - "increments review_round by 1"
    note: "Cyclic: RECEIVED -> REVISE_AND_RESUBMIT -> RECEIVED. A fourth review round is impossible: resubmit is refused once review_round == 3."

  # ---------------------------------------------- EquipmentUnit (dimension 1)
  - entity: EquipmentUnit
    dimension: install_status
    initial_state: NOT_INSTALLED
    terminal_states: [REMOVED]
    transitions:
      - from: NOT_INSTALLED
        to: INSTALLED
        trigger: "POST /equipment-units/{id}/install-status with install_status=INSTALLED"
        actor: Contractor
        preconditions:
          - "EquipmentUnit.install_status == NOT_INSTALLED"
        side_effects:
          - "sets install_status = INSTALLED"
      - from: INSTALLED
        to: STARTED_UP
        trigger: "POST /equipment-units/{id}/install-status with install_status=STARTED_UP"
        actor: Contractor
        preconditions:
          - "EquipmentUnit.install_status == INSTALLED"
        side_effects:
          - "sets install_status = STARTED_UP"
      - from: NOT_INSTALLED
        to: REMOVED
        trigger: "POST /equipment-units/{id}/install-status with install_status=REMOVED"
        actor: Contractor
        preconditions:
          - "EquipmentUnit.install_status == NOT_INSTALLED"
        side_effects:
          - "sets install_status = REMOVED"
          - "every FunctionalTest of this equipment with status IN {SCHEDULED, IN_PROGRESS} moves to CANCELLED"
      - from: INSTALLED
        to: REMOVED
        trigger: "POST /equipment-units/{id}/install-status with install_status=REMOVED"
        actor: Contractor
        preconditions:
          - "EquipmentUnit.install_status == INSTALLED"
        side_effects:
          - "sets install_status = REMOVED"
          - "every FunctionalTest of this equipment with status IN {SCHEDULED, IN_PROGRESS} moves to CANCELLED"
      - from: STARTED_UP
        to: REMOVED
        trigger: "POST /equipment-units/{id}/install-status with install_status=REMOVED"
        actor: Contractor
        preconditions:
          - "EquipmentUnit.install_status == STARTED_UP"
        side_effects:
          - "sets install_status = REMOVED"
          - "every FunctionalTest of this equipment with status IN {SCHEDULED, IN_PROGRESS} moves to CANCELLED"
          - "the unit leaves the acceptance_completion_score denominator, so CxProject.acceptance_completion_score is recomputed over the remaining units"
    note: "install_status and verification_status advance independently on the same row; neither dimension's transition table constrains the other's current value except where a precondition says so explicitly."

  # ---------------------------------------------- EquipmentUnit (dimension 2)
  - entity: EquipmentUnit
    dimension: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PREFUNCTIONAL_VERIFIED
        trigger: "POST /prefunctional-checklists/{id}/verify"
        actor: CxAuthority
        preconditions:
          - "the checklist's EquipmentUnit.blocking_issue_count == 0"
        side_effects:
          - "sets verification_status = PREFUNCTIONAL_VERIFIED"
          - "adds EquipmentUnit.weight_units to CxProject.verified_prefunctional_units"
          - "recomputes calculations.acceptance_completion_score (PROVISIONAL) on the project"
      - from: PREFUNCTIONAL_VERIFIED
        to: FUNCTIONAL_ACCEPTED
        trigger: "POST /functional-tests/{id}/record-result resolving to outcome PASSED"
        actor: CxAuthority
        preconditions:
          - "FunctionalTest.status == IN_PROGRESS"
          - "derived outcome == PASSED"
        side_effects:
          - "sets verification_status = FUNCTIONAL_ACCEPTED"
          - "recomputes calculations.acceptance_completion_score (PROVISIONAL) on the project"
      - from: PREFUNCTIONAL_VERIFIED
        to: CONDITIONALLY_ACCEPTED
        trigger: "POST /functional-tests/{id}/record-result resolving to outcome PASSED_WITH_EXCEPTIONS"
        actor: CxAuthority
        preconditions:
          - "FunctionalTest.status == IN_PROGRESS"
          - "derived outcome == PASSED_WITH_EXCEPTIONS"
        side_effects:
          - "sets verification_status = CONDITIONALLY_ACCEPTED"
          - "the auto-opened S3 Issue is non-blocking, so blocking_issue_count is unchanged"
          - "recomputes calculations.acceptance_completion_score (PROVISIONAL) on the project"
      - from: PREFUNCTIONAL_VERIFIED
        to: UNVERIFIED
        trigger: "system: a blocking Issue (blocks_acceptance == true) is opened against this equipment"
        actor: system
        preconditions:
          - "the newly created Issue has equipment_id == this equipment and blocks_acceptance == true"
        side_effects:
          - "increments blocking_issue_count by 1"
          - "sets verification_status = UNVERIFIED"
          - "every CreditEvidence with evidence_type == EQUIPMENT_VERIFICATION and evidence_ref_id == this equipment id flips is_stale = true and records staled_at"
      - from: FUNCTIONAL_ACCEPTED
        to: UNVERIFIED
        trigger: "system: a blocking Issue (blocks_acceptance == true) is opened against this equipment"
        actor: system
        preconditions:
          - "the newly created Issue has equipment_id == this equipment and blocks_acceptance == true"
        side_effects:
          - "increments blocking_issue_count by 1"
          - "sets verification_status = UNVERIFIED"
          - "every CreditEvidence with evidence_type == EQUIPMENT_VERIFICATION and evidence_ref_id == this equipment id flips is_stale = true and records staled_at"
      - from: CONDITIONALLY_ACCEPTED
        to: UNVERIFIED
        trigger: "system: a blocking Issue (blocks_acceptance == true) is opened against this equipment"
        actor: system
        preconditions:
          - "the newly created Issue has equipment_id == this equipment and blocks_acceptance == true"
        side_effects:
          - "increments blocking_issue_count by 1"
          - "sets verification_status = UNVERIFIED"
          - "every CreditEvidence with evidence_type == EQUIPMENT_VERIFICATION and evidence_ref_id == this equipment id flips is_stale = true and records staled_at"
      - from: UNVERIFIED
        to: PREFUNCTIONAL_VERIFIED
        trigger: "system: the last blocking Issue against this equipment leaves status IN {OPEN, IN_REVIEW}"
        actor: system
        preconditions:
          - "blocking_issue_count reaches 0 after the decrement"
          - "the equipment's PrefunctionalChecklist.status == VERIFIED"
        side_effects:
          - "sets verification_status = PREFUNCTIONAL_VERIFIED"
          - "every CreditEvidence with evidence_type == EQUIPMENT_VERIFICATION and evidence_ref_id == this equipment id flips is_stale = false"
          - "recomputes calculations.acceptance_completion_score (PROVISIONAL) on the project"
      - from: PREFUNCTIONAL_VERIFIED
        to: UNVERIFIED
        trigger: "POST /prefunctional-checklists/{id}/reject"
        actor: CxAuthority
        preconditions:
          - "PrefunctionalChecklist.status == VERIFIED"
        side_effects:
          - "sets verification_status = UNVERIFIED"
          - "every FunctionalTest of this equipment with status == SCHEDULED moves to CANCELLED"
          - "every CreditEvidence with evidence_type == EQUIPMENT_VERIFICATION and evidence_ref_id == this equipment id flips is_stale = true"
      - from: FUNCTIONAL_ACCEPTED
        to: UNVERIFIED
        trigger: "POST /prefunctional-checklists/{id}/reject"
        actor: CxAuthority
        preconditions:
          - "PrefunctionalChecklist.status == VERIFIED"
        side_effects:
          - "sets verification_status = UNVERIFIED"
          - "every FunctionalTest of this equipment with status == SCHEDULED moves to CANCELLED"
          - "every CreditEvidence with evidence_type == EQUIPMENT_VERIFICATION and evidence_ref_id == this equipment id flips is_stale = true"
      - from: CONDITIONALLY_ACCEPTED
        to: UNVERIFIED
        trigger: "POST /prefunctional-checklists/{id}/reject"
        actor: CxAuthority
        preconditions:
          - "PrefunctionalChecklist.status == VERIFIED"
        side_effects:
          - "sets verification_status = UNVERIFIED"
          - "every FunctionalTest of this equipment with status == SCHEDULED moves to CANCELLED"
          - "every CreditEvidence with evidence_type == EQUIPMENT_VERIFICATION and evidence_ref_id == this equipment id flips is_stale = true"

  # -------------------------------------------------- PrefunctionalChecklist
  - entity: PrefunctionalChecklist
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /prefunctional-checklists/{id}/execute"
        actor: Contractor
        preconditions:
          - "PrefunctionalChecklist.status == DRAFT"
          - "item_count >= 1"
          - "no item has result == PENDING"
          - "the equipment's install_status IN {INSTALLED, STARTED_UP}"
        side_effects:
          - "sets status = EXECUTED and executed_by_user_id = X-User-ID"
      - from: REWORK
        to: EXECUTED
        trigger: "POST /prefunctional-checklists/{id}/execute"
        actor: Contractor
        preconditions:
          - "PrefunctionalChecklist.status == REWORK"
          - "item_count >= 1"
          - "no item has result == PENDING"
          - "the equipment's install_status IN {INSTALLED, STARTED_UP}"
        side_effects:
          - "sets status = EXECUTED and executed_by_user_id = X-User-ID"
      - from: EXECUTED
        to: VERIFIED
        trigger: "POST /prefunctional-checklists/{id}/verify"
        actor: CxAuthority
        preconditions:
          - "PrefunctionalChecklist.status == EXECUTED"
          - "X-User-ID != executed_by_user_id (segregation of duties)"
          - "no item with is_safety_critical == true has result == FAIL"
          - "the equipment's blocking_issue_count == 0"
        side_effects:
          - "sets status = VERIFIED and verified_by_user_id = X-User-ID"
          - "adds the equipment's weight_units to CxProject.verified_prefunctional_units"
          - "drives EquipmentUnit.verification_status UNVERIFIED -> PREFUNCTIONAL_VERIFIED"
          - "recomputes calculations.acceptance_completion_score (PROVISIONAL) on the project"
      - from: EXECUTED
        to: REWORK
        trigger: "POST /prefunctional-checklists/{id}/reject"
        actor: CxAuthority
        preconditions:
          - "PrefunctionalChecklist.status == EXECUTED"
        side_effects:
          - "sets status = REWORK, increments rework_cycle_count by 1, clears executed_by_user_id"
          - "resets every item's result to PENDING and clears recorded_by_user_id / recorded_at"
      - from: VERIFIED
        to: REWORK
        trigger: "POST /prefunctional-checklists/{id}/reject"
        actor: CxAuthority
        preconditions:
          - "PrefunctionalChecklist.status == VERIFIED"
        side_effects:
          - "sets status = REWORK, increments rework_cycle_count by 1, clears executed_by_user_id and verified_by_user_id"
          - "resets every item's result to PENDING and clears recorded_by_user_id / recorded_at"
          - "subtracts the equipment's weight_units from CxProject.verified_prefunctional_units (compensating step of the verify transition)"
          - "drives EquipmentUnit.verification_status back to UNVERIFIED, which in turn CANCELs every SCHEDULED FunctionalTest of that equipment and stales every EQUIPMENT_VERIFICATION CreditEvidence pointing at it"
          - "recomputes calculations.acceptance_completion_score (PROVISIONAL) on the project"
    note: "Cyclic: EXECUTED/VERIFIED -> REWORK -> EXECUTED. reject is the compensating action for verify and must restore compensating_invariant.verified_prefunctional_units exactly."

  # ----------------------------------------------------------- FunctionalTest
  - entity: FunctionalTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, PASSED_WITH_EXCEPTIONS, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /functional-tests/{id}/start"
        actor: CxAuthority
        preconditions:
          - "FunctionalTest.status == SCHEDULED"
          - "the equipment's install_status == STARTED_UP"
        side_effects:
          - "sets status = IN_PROGRESS and started_at = current logical clock"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /functional-tests/{id}/record-result where calculations.functional_outcome_deviation resolves to PASSED"
        actor: CxAuthority
        preconditions:
          - "FunctionalTest.status == IN_PROGRESS"
          - "outcome_deviation_pct <= OwnerRequirement.tolerance_pct"
        side_effects:
          - "sets status = PASSED, measured_value, outcome_deviation_pct, witness_user_id, completed_at"
          - "drives EquipmentUnit.verification_status PREFUNCTIONAL_VERIFIED -> FUNCTIONAL_ACCEPTED"
          - "recomputes calculations.acceptance_completion_score (PROVISIONAL) on the project"
      - from: IN_PROGRESS
        to: PASSED_WITH_EXCEPTIONS
        trigger: "POST /functional-tests/{id}/record-result where calculations.functional_outcome_deviation resolves to PASSED_WITH_EXCEPTIONS"
        actor: CxAuthority
        preconditions:
          - "FunctionalTest.status == IN_PROGRESS"
          - "outcome_deviation_pct > OwnerRequirement.tolerance_pct and <= 2 * OwnerRequirement.tolerance_pct"
        side_effects:
          - "sets status = PASSED_WITH_EXCEPTIONS, measured_value, outcome_deviation_pct, witness_user_id, completed_at"
          - "creates an Issue with origin = FUNCTIONAL, severity = S3, equipment_id = the test's equipment, source_ref_id = this test id, opened_by_user_id = SYSTEM; blocks_acceptance is false so the equipment is NOT demoted"
          - "writes the new Issue id to FunctionalTest.generated_issue_id"
          - "drives EquipmentUnit.verification_status PREFUNCTIONAL_VERIFIED -> CONDITIONALLY_ACCEPTED"
          - "recomputes calculations.issue_retainage_hold, CxProject.retainage_withheld_cents, calculations.issue_severity_index and CxProject.acceptance_completion_score"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /functional-tests/{id}/record-result where calculations.functional_outcome_deviation resolves to FAILED"
        actor: CxAuthority
        preconditions:
          - "FunctionalTest.status == IN_PROGRESS"
          - "outcome_deviation_pct > 2 * OwnerRequirement.tolerance_pct"
        side_effects:
          - "HOP 1 — sets status = FAILED, measured_value, outcome_deviation_pct, witness_user_id, completed_at, and creates an Issue with origin = FUNCTIONAL, equipment_id = the test's equipment, source_ref_id = this test id, opened_by_user_id = SYSTEM and severity = AUTO_ISSUE_SEVERITY_BY_CRITICALITY[equipment.criticality] (LIFE_SAFETY -> S1, CRITICAL -> S2, STANDARD -> S3); writes its id to generated_issue_id"
          - "HOP 2 — because that Issue has blocks_acceptance == true (severity IN {S1, S2}), EquipmentUnit.blocking_issue_count increments and verification_status is demoted to UNVERIFIED; CxProject.retainage_withheld_cents grows by the new Issue.retainage_hold_cents and issue_severity_index / readiness_posture are recomputed"
          - "HOP 3 — because the equipment left its verified states, every CreditEvidence with evidence_type == EQUIPMENT_VERIFICATION and evidence_ref_id == that equipment flips is_stale = true, and each affected CertificationCredit recomputes completeness_ratio, provisional_tier, documentation_score and final_tier"
          - "HOP 4 — because a recomputed credit's final_tier fell to NONE while its status was SUBMITTED, that CertificationCredit moves SUBMITTED -> WITHDRAWN and CxProject.withdrawn_credit_count increments by 1"
        note: "Branch divergence: PASSED promotes the equipment, PASSED_WITH_EXCEPTIONS opens a non-blocking S3 and conditionally accepts, FAILED opens a blocking issue and runs the four-hop cascade above."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: POST /prefunctional-checklists/{id}/reject on the equipment's checklist, or POST /equipment-units/{id}/install-status with install_status=REMOVED"
        actor: system
        preconditions:
          - "FunctionalTest.status == SCHEDULED"
        side_effects:
          - "sets status = CANCELLED; the witness window is released for overlap purposes"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system: POST /equipment-units/{id}/install-status with install_status=REMOVED"
        actor: system
        preconditions:
          - "FunctionalTest.status == IN_PROGRESS"
        side_effects:
          - "sets status = CANCELLED; the witness window is released for overlap purposes"
      - from: FAILED
        to: FAILED
        trigger: "POST /functional-tests/{id}/schedule-retest"
        actor: CxAuthority
        preconditions:
          - "FunctionalTest.status IN {FAILED, PASSED_WITH_EXCEPTIONS}"
        side_effects:
          - "creates a NEW FunctionalTest row with status = SCHEDULED, retest_of_test_id = this test id, and equipment_id / requirement_id / script_code copied from this row"
          - "the new row is subject to the same witness-window overlap rule as POST /functional-tests"
      - from: PASSED_WITH_EXCEPTIONS
        to: PASSED_WITH_EXCEPTIONS
        trigger: "POST /functional-tests/{id}/schedule-retest"
        actor: CxAuthority
        preconditions:
          - "FunctionalTest.status IN {FAILED, PASSED_WITH_EXCEPTIONS}"
        side_effects:
          - "creates a NEW FunctionalTest row with status = SCHEDULED, retest_of_test_id = this test id, and equipment_id / requirement_id / script_code copied from this row"

  # ------------------------------------------------------------------- Issue
  - entity: Issue
    initial_state: OPEN
    terminal_states: [VOID]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /issues/{id}/propose-resolution"
        actor: Contractor
        preconditions:
          - "Issue.status == OPEN"
        side_effects:
          - "sets status = IN_REVIEW, proposed_by_user_id = X-User-ID, proposed_resolution = the submitted text"
          - "the row stays inside the issue_severity_index input set and keeps its retainage hold"
      - from: IN_REVIEW
        to: VERIFIED_CLOSED
        trigger: "POST /issues/{id}/verify-closure"
        actor: CxAuthority
        preconditions:
          - "Issue.status == IN_REVIEW"
          - "when origin == FUNCTIONAL and severity IN {S1, S2}: closure_retest_id is supplied, that FunctionalTest.status == PASSED and its equipment_id equals this Issue.equipment_id"
        side_effects:
          - "HOP 1 — sets status = VERIFIED_CLOSED and closure_retest_id; the row leaves both the issue_severity_index input set and the retainage input set, so CxProject.retainage_withheld_cents drops by exactly Issue.retainage_hold_cents and issue_severity_index is recomputed"
          - "HOP 2 — because the issue left {OPEN, IN_REVIEW}, EquipmentUnit.blocking_issue_count decrements when blocks_acceptance == true; when it reaches 0 and the equipment's checklist is VERIFIED, verification_status is promoted UNVERIFIED -> PREFUNCTIONAL_VERIFIED and every EQUIPMENT_VERIFICATION CreditEvidence for it flips is_stale = false"
          - "HOP 3 — because the equipment was promoted and the index fell, CxProject.acceptance_completion_score is recomputed and readiness_posture is re-derived; leaving FROZEN returns every BLOCKED DeferredTest of the project to PLANNED"
      - from: IN_REVIEW
        to: OPEN
        trigger: "POST /issues/{id}/reopen"
        actor: CxAuthority
        preconditions:
          - "Issue.status IN {IN_REVIEW, VERIFIED_CLOSED, DEFERRED}"
        side_effects:
          - "sets status = OPEN, increments reopen_count by 1, clears proposed_by_user_id / proposed_resolution / closure_retest_id"
      - from: VERIFIED_CLOSED
        to: OPEN
        trigger: "POST /issues/{id}/reopen"
        actor: CxAuthority
        preconditions:
          - "Issue.status IN {IN_REVIEW, VERIFIED_CLOSED, DEFERRED}"
        side_effects:
          - "sets status = OPEN, increments reopen_count by 1, clears proposed_by_user_id / proposed_resolution / closure_retest_id"
          - "the row re-enters the issue_severity_index and retainage input sets, so CxProject.retainage_withheld_cents grows again by Issue.retainage_hold_cents"
          - "when blocks_acceptance == true, EquipmentUnit.blocking_issue_count increments and the equipment is demoted to UNVERIFIED"
      - from: DEFERRED
        to: OPEN
        trigger: "POST /issues/{id}/reopen, or system: the linked DeferredTest records EXECUTED_FAIL or is swept to MISSED"
        actor: CxAuthority
        preconditions:
          - "Issue.status IN {IN_REVIEW, VERIFIED_CLOSED, DEFERRED}"
        side_effects:
          - "sets status = OPEN, increments reopen_count by 1"
          - "the row re-enters the issue_severity_index input set"
      - from: DEFERRED
        to: VERIFIED_CLOSED
        trigger: "system: the linked DeferredTest records EXECUTED_PASS"
        actor: system
        preconditions:
          - "Issue.status == DEFERRED"
          - "a DeferredTest with issue_id == this Issue transitions PLANNED -> EXECUTED_PASS"
        side_effects:
          - "sets status = VERIFIED_CLOSED"
          - "the row leaves the retainage input set, so CxProject.retainage_withheld_cents drops by exactly Issue.retainage_hold_cents"
          - "when blocks_acceptance == true, EquipmentUnit.blocking_issue_count is already 0 (DEFERRED rows never counted) and no demotion or promotion is triggered by this hop"
      - from: OPEN
        to: DEFERRED
        trigger: "POST /issues/{id}/defer"
        actor: OwnerRepresentative
        preconditions:
          - "Issue.status == OPEN"
          - "at least one DeferredTest row exists with issue_id == this Issue and status IN {PLANNED, BLOCKED}"
        side_effects:
          - "sets status = DEFERRED"
          - "the row leaves the issue_severity_index input set but STAYS in the retainage input set, so readiness_posture may improve while retainage_withheld_cents is unchanged"
      - from: OPEN
        to: VOID
        trigger: "POST /issues/{id}/void"
        actor: CxAuthority
        preconditions:
          - "Issue.status IN {OPEN, IN_REVIEW, DEFERRED}"
        side_effects:
          - "sets status = VOID"
          - "the row leaves every input set: CxProject.retainage_withheld_cents drops by exactly Issue.retainage_hold_cents and issue_severity_index is recomputed"
          - "when blocks_acceptance == true, EquipmentUnit.blocking_issue_count decrements and the promotion rule may re-verify the equipment"
      - from: IN_REVIEW
        to: VOID
        trigger: "POST /issues/{id}/void"
        actor: CxAuthority
        preconditions:
          - "Issue.status IN {OPEN, IN_REVIEW, DEFERRED}"
        side_effects:
          - "sets status = VOID"
          - "the row leaves every input set: CxProject.retainage_withheld_cents drops by exactly Issue.retainage_hold_cents and issue_severity_index is recomputed"
      - from: DEFERRED
        to: VOID
        trigger: "POST /issues/{id}/void"
        actor: CxAuthority
        preconditions:
          - "Issue.status IN {OPEN, IN_REVIEW, DEFERRED}"
        side_effects:
          - "sets status = VOID"
          - "the row leaves every input set: CxProject.retainage_withheld_cents drops by exactly Issue.retainage_hold_cents"
    note: "Cyclic: VERIFIED_CLOSED and DEFERRED both return to OPEN. VOID is the only terminal state and is the compensating action for issue creation."

  # ------------------------------------------------------------ DeferredTest
  - entity: DeferredTest
    initial_state: PLANNED
    terminal_states: [EXECUTED_PASS, EXECUTED_FAIL, MISSED]
    transitions:
      - from: PLANNED
        to: BLOCKED
        trigger: "system: CxProject.readiness_posture becomes FROZEN"
        actor: system
        preconditions:
          - "DeferredTest.status == PLANNED"
        side_effects:
          - "sets status = BLOCKED"
      - from: BLOCKED
        to: PLANNED
        trigger: "system: CxProject.readiness_posture leaves FROZEN"
        actor: system
        preconditions:
          - "DeferredTest.status == BLOCKED"
        side_effects:
          - "sets status = PLANNED"
      - from: PLANNED
        to: EXECUTED_PASS
        trigger: "POST /deferred-tests/{id}/execute with a measured_value inside the requirement tolerance"
        actor: CxAuthority
        preconditions:
          - "DeferredTest.status == PLANNED"
          - "window_start <= current logical clock < window_end"
        side_effects:
          - "sets status = EXECUTED_PASS, executed_at, measured_value"
          - "when issue_id is set and that Issue.status == DEFERRED, the Issue moves DEFERRED -> VERIFIED_CLOSED and its retainage hold is released"
      - from: PLANNED
        to: EXECUTED_FAIL
        trigger: "POST /deferred-tests/{id}/execute with a measured_value outside the requirement tolerance"
        actor: CxAuthority
        preconditions:
          - "DeferredTest.status == PLANNED"
          - "window_start <= current logical clock < window_end"
        side_effects:
          - "sets status = EXECUTED_FAIL, executed_at, measured_value"
          - "when issue_id is set and that Issue.status == DEFERRED, the Issue returns DEFERRED -> OPEN and re-enters the issue_severity_index input set"
      - from: PLANNED
        to: MISSED
        trigger: "POST /cx-projects/{id}/run-seasonal-sweep"
        actor: CxAuthority
        preconditions:
          - "DeferredTest.status IN {PLANNED, BLOCKED}"
          - "current logical clock >= window_end"
        side_effects:
          - "sets status = MISSED"
          - "creates an Issue with origin = SEASONAL, severity = S2, equipment_id = the deferred test's equipment, source_ref_id = this DeferredTest id, opened_by_user_id = SYSTEM"
      - from: BLOCKED
        to: MISSED
        trigger: "POST /cx-projects/{id}/run-seasonal-sweep"
        actor: CxAuthority
        preconditions:
          - "DeferredTest.status IN {PLANNED, BLOCKED}"
          - "current logical clock >= window_end"
        side_effects:
          - "sets status = MISSED"
          - "creates an Issue with origin = SEASONAL, severity = S2, equipment_id = the deferred test's equipment, source_ref_id = this DeferredTest id, opened_by_user_id = SYSTEM"

  # ----------------------------------------------------- CloseoutDeliverable
  - entity: CloseoutDeliverable
    initial_state: PLANNED
    terminal_states: [ACCEPTED]
    transitions:
      - from: PLANNED
        to: DELIVERED
        trigger: "POST /closeout-deliverables/{id}/deliver"
        actor: Contractor
        preconditions:
          - "CloseoutDeliverable.status == PLANNED"
        side_effects:
          - "sets status = DELIVERED, delivered_by_user_id = X-User-ID, attendee_count, duration_minutes, session_start = current logical clock"
          - "recomputes coverage_ratio"
      - from: RETURNED
        to: DELIVERED
        trigger: "POST /closeout-deliverables/{id}/deliver"
        actor: Contractor
        preconditions:
          - "CloseoutDeliverable.status == RETURNED"
        side_effects:
          - "sets status = DELIVERED, delivered_by_user_id = X-User-ID, attendee_count, duration_minutes, session_start = current logical clock"
          - "recomputes coverage_ratio"
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /closeout-deliverables/{id}/accept"
        actor: CxAuthority
        preconditions:
          - "CloseoutDeliverable.status == DELIVERED"
          - "CxProject.readiness_posture != FROZEN"
          - "X-User-ID != delivered_by_user_id (segregation of duties)"
          - "when deliverable_kind == TRAINING_SESSION: coverage_ratio >= 0.80"
        side_effects:
          - "sets status = ACCEPTED and accepted_by_user_id = X-User-ID"
          - "recomputes calculations.acceptance_completion_score (PROVISIONAL) on the project"
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /closeout-deliverables/{id}/return"
        actor: CxAuthority
        preconditions:
          - "CloseoutDeliverable.status == DELIVERED"
        side_effects:
          - "sets status = RETURNED and clears delivered_by_user_id"
          - "every CreditEvidence with evidence_type IN {TRAINING, MANUAL_SECTION} and evidence_ref_id == this deliverable flips is_stale = true"

  # ---------------------------------------------------- CertificationCredit
  - entity: CertificationCredit
    initial_state: NOT_STARTED
    terminal_states: [AWARDED, DENIED]
    transitions:
      - from: NOT_STARTED
        to: IN_PREPARATION
        trigger: "POST /certification-credits/{id}/evidence (first evidence row)"
        actor: CxAuthority
        preconditions:
          - "CertificationCredit.status == NOT_STARTED"
        side_effects:
          - "sets status = IN_PREPARATION"
          - "recomputes calculations.credit_documentation_score end to end"
      - from: IN_PREPARATION
        to: SUBMITTED
        trigger: "POST /certification-credits/{id}/submit"
        actor: CxAuthority
        preconditions:
          - "CertificationCredit.status == IN_PREPARATION"
          - "CxProject.readiness_posture != FROZEN"
          - "the project's newest CxPlan has status == APPROVED and pin_stale == false"
          - "fresh_evidence_count >= required_evidence_count"
          - "expected_project_version matches CxProject.version"
        side_effects:
          - "sets status = SUBMITTED and submitted_at = current logical clock"
          - "increments CxProject.version by 1"
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /certification-credits/{id}/adjudicate with decision=AWARDED"
        actor: OwnerRepresentative
        preconditions:
          - "CertificationCredit.status == SUBMITTED"
          - "final_tier != NONE"
        side_effects:
          - "sets status = AWARDED and awarded_points = round(max_points * TIER_AWARD_FRACTION[final_tier], 2)"
          - "adds awarded_points to CxProject.total_awarded_points"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /certification-credits/{id}/adjudicate with decision=DENIED"
        actor: OwnerRepresentative
        preconditions:
          - "CertificationCredit.status == SUBMITTED"
        side_effects:
          - "sets status = DENIED and awarded_points = 0"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system: a recomputation of calculations.credit_documentation_score drives final_tier to NONE"
        actor: system
        preconditions:
          - "CertificationCredit.status == SUBMITTED"
          - "recomputed final_tier == NONE"
        side_effects:
          - "sets status = WITHDRAWN"
          - "increments CxProject.withdrawn_credit_count by 1"
      - from: WITHDRAWN
        to: IN_PREPARATION
        trigger: "POST /certification-credits/{id}/evidence (a fresh evidence row is added to a withdrawn credit)"
        actor: CxAuthority
        preconditions:
          - "CertificationCredit.status == WITHDRAWN"
        side_effects:
          - "sets status = IN_PREPARATION"
          - "recomputes calculations.credit_documentation_score end to end"

  # ---------------------------------------------------------- EnergyBaseline
  - entity: EnergyBaseline
    initial_state: BASELINE_SET
    terminal_states: [CERTIFIED]
    transitions:
      - from: BASELINE_SET
        to: POST_PERIOD_RECORDED
        trigger: "POST /energy-baselines/{id}/post-period"
        actor: CxAuthority
        preconditions:
          - "EnergyBaseline.status == BASELINE_SET"
        side_effects:
          - "sets post_kwh, post_hdd and status = POST_PERIOD_RECORDED"
          - "computes both variants of calculations.retro_savings_estimate into deemed_savings_kwh and measured_savings_kwh"
      - from: POST_PERIOD_RECORDED
        to: CERTIFIED
        trigger: "POST /energy-baselines/{id}/certify-savings"
        actor: CxAuthority
        preconditions:
          - "EnergyBaseline.status == POST_PERIOD_RECORDED"
          - "when CxProject.certification_target == ENHANCED, the requested variant must be MEASURED"
        side_effects:
          - "sets certified_variant, certified_savings_kwh = the chosen variant's value, status = CERTIFIED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on CxProject.version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-project
    parent_entity: CxProject
    write_endpoint: "POST /cx-plans"
    occ_field: "expected_project_version"
    description: |
      Creating a CxPlan for a project whose version has advanced since the
      client last observed it is rejected. A newly created plan legitimately
      supersedes every prior plan of the same project, so the writer must prove
      its view of the project (its approved requirement set, posture and
      acceptance figures) is current before that supersede is allowed to land.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: credit-submit-stale-project
    parent_entity: CxProject
    write_endpoint: "POST /certification-credits/{id}/submit"
    occ_field: "expected_project_version"
    description: |
      Submitting a certification credit package snapshots the project's
      evidence posture. When CxProject.version has advanced since the client
      read it — because a cascade staled evidence, opened an issue or moved the
      posture — the submission is rejected as built on a stale view.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: issue_severity_index
    trigger: "Recomputed on every Issue create / propose-resolution / verify-closure / reopen / defer / void, on POST /_clock/set_current_utc, and on POST /cx-projects/{id}/run-seasonal-sweep. Writes CxProject.issue_severity_index."
    algorithm: weighted_scoring
    formula: |
      # Input set: every Issue with project_id == P and status IN {OPEN, IN_REVIEW}.
      # DEFERRED, VERIFIED_CLOSED and VOID rows are EXCLUDED.
      # Iteration order is Issue.created_at ASC (ties broken by Issue.created_at,
      # which is unique per row at millisecond resolution); the result is a sum,
      # so order affects nothing observable but is pinned for auditability.
      total = 0.00
      for i in issues(project_id = P, status IN {OPEN, IN_REVIEW}) ordered by created_at ASC:
          age_seconds = current_logical_clock - i.opened_at        # never negative
          age_days    = floor(age_seconds / 86400)
          steps       = floor(age_days / AGING_STEP_DAYS)
          aging       = min(1.00 + AGING_STEP_MULTIPLIER * steps, AGING_MULTIPLIER_CAP)
          blocking    = BLOCKING_MULTIPLIER if i.blocks_acceptance else 1.0
          contrib     = round_half_up(SEVERITY_WEIGHT[i.severity] * aging * blocking, 2)
          total       = total + contrib                            # ROUND PER ISSUE, THEN SUM
      issue_severity_index = min(round_half_up(total, 2), INDEX_CAP)
    input_set: "Issue rows of the project whose status IN {OPEN, IN_REVIEW}; all other statuses contribute 0."
    constants:
      SEVERITY_WEIGHT: { S1: 25.0, S2: 12.0, S3: 8.0, S4: 2.0 }
      BLOCKING_MULTIPLIER: 2.0
      AGING_STEP_DAYS: 14
      AGING_STEP_MULTIPLIER: 0.25
      AGING_MULTIPLIER_CAP: 2.00
      INDEX_CAP: 100.00
    precision: "2 decimal places, round_half_up, applied per issue and again to the sum"

  - name: readiness_posture_derivation
    trigger: "Runs immediately after every issue_severity_index recomputation. Writes CxProject.readiness_posture."
    algorithm: threshold
    formula: |
      if issue_severity_index >= FROZEN_THRESHOLD:            posture = FROZEN
      elif issue_severity_index >= RESTRICTED_THRESHOLD:      posture = RESTRICTED
      else:                                                   posture = OPEN
    input_set: "CxProject.issue_severity_index only."
    constants:
      RESTRICTED_THRESHOLD: 16.00
      FROZEN_THRESHOLD: 40.00
    precision: "Comparisons are inclusive at the lower bound: an index of exactly 40.00 is FROZEN, exactly 16.00 is RESTRICTED, and 15.99 is OPEN."

  - name: issue_retainage_hold
    trigger: "Computed once when an Issue row is created (manually via POST /issues or automatically by a transition) and frozen on the row as Issue.retainage_hold_cents. Never recomputed."
    algorithm: aggregation
    formula: |
      # Per-issue hold, in whole cents.
      base_cents = EquipmentUnit.contract_value_cents when Issue.equipment_id IS NOT null
                   else CxProject.contract_value_cents
      factor     = CRITICALITY_FACTOR[EquipmentUnit.criticality] when Issue.equipment_id IS NOT null
                   else CRITICALITY_FACTOR[STANDARD]
      hold_cents = round_half_up(base_cents * BASE_HOLD_RATE[Issue.severity] * factor, 0)

      # Project roll-up. PINNED ORDER: each issue is rounded to whole cents FIRST
      # and the rounded per-issue holds are THEN summed. Summing the unrounded
      # products and rounding once at the end is explicitly NOT the rule and can
      # differ by one or more cents.
      CxProject.retainage_withheld_cents =
          sum over Issue rows of the project with status IN {OPEN, IN_REVIEW, DEFERRED}
              of Issue.retainage_hold_cents
    input_set: "For the per-issue value: the single Issue and its equipment (or the project when equipment_id is null). For the roll-up: Issue rows with status IN {OPEN, IN_REVIEW, DEFERRED}; VERIFIED_CLOSED and VOID rows are excluded."
    constants:
      BASE_HOLD_RATE: { S1: 0.05, S2: 0.02, S3: 0.005, S4: 0.0 }
      CRITICALITY_FACTOR: { LIFE_SAFETY: 1.5, CRITICAL: 1.2, STANDARD: 1.0 }
      MAX_PROJECT_HOLD_PCT: 0.10
    precision: "Whole cents, round_half_up, applied per issue before summation. The cap is floor(CxProject.contract_value_cents * MAX_PROJECT_HOLD_PCT); a create whose resulting roll-up would exceed the cap is rejected with ERR_RETAINAGE_CAP_EXCEEDED and no row is written."

  - name: functional_outcome_deviation
    trigger: "POST /functional-tests/{id}/record-result. Writes FunctionalTest.outcome_deviation_pct and selects the IN_PROGRESS -> {PASSED, PASSED_WITH_EXCEPTIONS, FAILED} branch."
    algorithm: threshold
    formula: |
      target = OwnerRequirement(requirement_id).target_value
      tol    = OwnerRequirement(requirement_id).tolerance_pct
      if target == 0:
          deviation_pct = 0.00 if measured_value == 0 else 100.00      # pinned zero-target rule
      else:
          deviation_pct = round_half_up(abs(measured_value - target) / target * 100, 2)

      if   deviation_pct <= tol:          outcome = PASSED
      elif deviation_pct <= 2 * tol:      outcome = PASSED_WITH_EXCEPTIONS
      else:                               outcome = FAILED
    input_set: "The single FunctionalTest, its OwnerRequirement (the pinned revision referenced by requirement_id, even if that row has since been SUPERSEDED), and the submitted measured_value."
    constants:
      EXCEPTION_TOLERANCE_MULTIPLIER: 2
    precision: "2 decimal places, round_half_up; both branch comparisons are inclusive (<=), so a deviation of exactly tolerance_pct is PASSED and exactly 2 * tolerance_pct is PASSED_WITH_EXCEPTIONS."

  - name: acceptance_completion_score
    trigger: "PROVISIONAL is recomputed and written to CxProject.acceptance_completion_score after every checklist verify/reject, functional-test result, deliverable accept/return, deferred-test create/execute and equipment removal. FINAL is computed on demand by GET /cx-projects/{id}/readiness and is persisted to CxProject.final_acceptance_score only by POST /cx-projects/{id}/issue-acceptance."
    algorithm: weighted_scoring
    formula: |
      # Iterate EquipmentUnit rows of the project with install_status != REMOVED,
      # ordered by EquipmentUnit.created_at ASC.
      total_weight = sum of e.weight_units over those rows
      if total_weight == 0: score = 0.00 and STOP          # empty-set rule

      for each equipment e (weight w = e.weight_units):

        pf(e) = 1.0 if the checklist of e has status == VERIFIED else 0.0
                # identical in both variants

        # latest(e) = the FunctionalTest of e with status IN
        # {PASSED, PASSED_WITH_EXCEPTIONS, FAILED} having the greatest
        # completed_at; ties (identical completed_at) broken by created_at ASC,
        # last one wins. If no such row exists, latest(e) is undefined.
        fn_PROVISIONAL(e) = 1.0  if latest(e).status IN {PASSED, PASSED_WITH_EXCEPTIONS}
                            0.5  elif e has >= 1 DeferredTest with status IN {PLANNED, BLOCKED}
                            0.0  otherwise
        fn_FINAL(e)       = 1.0  if latest(e).status == PASSED
                                 AND every DeferredTest of e has status == EXECUTED_PASS
                            0.5  elif latest(e).status == PASSED_WITH_EXCEPTIONS
                                 AND e.blocking_issue_count == 0
                            0.0  otherwise

        co(e) = 1.0 if e has >= 1 CloseoutDeliverable AND every CloseoutDeliverable
                    of e has status == ACCEPTED
                else 0.0                                    # zero deliverables scores 0.0

        contribution(e) = w * (PREFUNCTIONAL_WEIGHT * pf(e)
                             + FUNCTIONAL_WEIGHT    * fn(e)
                             + CLOSEOUT_WEIGHT      * co(e))

      # SINGLE rounding step, applied once to the final percentage. Per-equipment
      # contributions are NOT rounded.
      score = round_half_up(100 * (sum of contribution(e)) / total_weight, 2)
    input_set: "EquipmentUnit rows of the project with install_status != REMOVED, plus each unit's checklist, functional tests, deferred tests and closeout deliverables."
    constants:
      PREFUNCTIONAL_WEIGHT: 0.30
      FUNCTIONAL_WEIGHT: 0.50
      CLOSEOUT_WEIGHT: 0.20
      SUBSTANTIAL_MIN_SCORE: 70.00
      FINAL_MIN_SCORE: 95.00
    precision: "2 decimal places, round_half_up, applied once to the final percentage"
    variants:
      - name: PROVISIONAL
        when: "Continuously, on CxProject.acceptance_completion_score and in GET /cx-projects/{id}/readiness as acceptance_completion_score_provisional"
        difference: "Credits a PASSED_WITH_EXCEPTIONS test as a full pass (1.0) and credits any still-scheduled seasonal work at half (0.5), so it reads optimistically during construction."
      - name: FINAL
        when: "In GET /cx-projects/{id}/readiness as acceptance_completion_score_final, and persisted to CxProject.final_acceptance_score by POST /cx-projects/{id}/issue-acceptance"
        difference: "Only a PASSED test with all of its seasonal work EXECUTED_PASS scores 1.0; PASSED_WITH_EXCEPTIONS scores 0.5 and only when the unit carries no blocking issue; unexecuted seasonal work scores 0.0 instead of 0.5."

  - name: retro_savings_estimate
    trigger: "Both variants are computed and written to EnergyBaseline.deemed_savings_kwh and EnergyBaseline.measured_savings_kwh by POST /energy-baselines/{id}/post-period. POST /energy-baselines/{id}/certify-savings copies one of them into certified_savings_kwh."
    algorithm: dual_variant_projection
    formula: |
      # DEEMED — stipulated engineering estimate, needs no post period.
      deemed_savings_kwh = round_half_up(stipulated_kwh_per_hour * operating_hours
                                         * DEEMED_REALIZATION_FACTOR, 2)

      # MEASURED — weather-normalised measurement and verification.
      adjusted_baseline  = round_half_up(baseline_kwh * (post_hdd / baseline_hdd), 2)
      gross_savings      = adjusted_baseline - post_kwh
      measured_savings_kwh = round_half_up(max(gross_savings, 0) *
                                           (1 - MEASURED_UNCERTAINTY_DEDUCTION_PCT), 2)
    input_set: "The single EnergyBaseline row. DEEMED reads only stipulated_kwh_per_hour and operating_hours; MEASURED reads only baseline_kwh, baseline_hdd, post_kwh and post_hdd."
    constants:
      DEEMED_REALIZATION_FACTOR: 0.85
      MEASURED_UNCERTAINTY_DEDUCTION_PCT: 0.10
    precision: "2 decimal places, round_half_up; the weather adjustment is rounded before the subtraction"
    variants:
      - name: DEEMED
        when: "Permitted only when CxProject.certification_target IN {NONE, STANDARD}"
        difference: "Ignores metered post-period consumption entirely and derates the stipulated rate by DEEMED_REALIZATION_FACTOR."
      - name: MEASURED
        when: "Permitted for every certification_target, and the ONLY variant permitted when CxProject.certification_target == ENHANCED"
        difference: "Weather-normalises the baseline against the post period's degree days, subtracts metered post consumption, floors the result at zero and then removes a fixed uncertainty deduction."

  - name: credit_documentation_score
    trigger: "Recomputed end to end whenever a CreditEvidence row is added to the credit, whenever any of its evidence rows flips is_stale, and whenever required_evidence_count-relevant state changes. Writes completeness_ratio, provisional_tier, documentation_score and final_tier on CertificationCredit."
    algorithm: constraint_propagation
    formula: |
      # The tier and the score look mutually dependent. The evaluation order is
      # PINNED to exactly these four steps, executed ONCE, top to bottom. There
      # is no iteration and no fixed-point search: final_tier is never fed back
      # into documentation_score.

      # STEP 1 — completeness from FRESH evidence only.
      if required_evidence_count == 0:
          completeness_ratio = 0.0
      else:
          completeness_ratio = round_half_up(
              min(fresh_evidence_count / required_evidence_count, 1.0), 4)

      # STEP 2 — provisional tier from completeness_ratio (inclusive lower bounds).
      if   completeness_ratio >= TIER_COMPLETENESS_THRESHOLDS.GOLD:   provisional_tier = GOLD
      elif completeness_ratio >= TIER_COMPLETENESS_THRESHOLDS.SILVER: provisional_tier = SILVER
      elif completeness_ratio >= TIER_COMPLETENESS_THRESHOLDS.BRONZE: provisional_tier = BRONZE
      else:                                                           provisional_tier = NONE

      # STEP 3 — score uses the PROVISIONAL tier's quality weight, then subtracts
      # a flat penalty for every stale evidence row, floored at zero.
      documentation_score = round_half_up(
          max(100.0 * completeness_ratio * TIER_QUALITY_WEIGHT[provisional_tier]
              - STALE_EVIDENCE_PENALTY_POINTS * stale_evidence_count, 0.0), 2)

      # STEP 4 — final tier from the score (inclusive lower bounds).
      if   documentation_score >= FINAL_TIER_SCORE_THRESHOLDS.GOLD:   final_tier = GOLD
      elif documentation_score >= FINAL_TIER_SCORE_THRESHOLDS.SILVER: final_tier = SILVER
      elif documentation_score >= FINAL_TIER_SCORE_THRESHOLDS.BRONZE: final_tier = BRONZE
      else:                                                           final_tier = NONE
    input_set: "CreditEvidence rows with credit_id == this credit, split by is_stale; plus the credit's required_evidence_count. Rows belonging to other credits never contribute."
    constants:
      TIER_COMPLETENESS_THRESHOLDS: { GOLD: 1.00, SILVER: 0.75, BRONZE: 0.50 }
      TIER_QUALITY_WEIGHT: { GOLD: 1.00, SILVER: 0.85, BRONZE: 0.60, NONE: 0.40 }
      STALE_EVIDENCE_PENALTY_POINTS: 15.00
      FINAL_TIER_SCORE_THRESHOLDS: { GOLD: 90.00, SILVER: 70.00, BRONZE: 50.00 }
      TIER_AWARD_FRACTION: { GOLD: 1.00, SILVER: 0.75, BRONZE: 0.50, NONE: 0.00 }
    precision: "completeness_ratio to 4 decimals, documentation_score to 2 decimals, both round_half_up"

  - name: credit_evidence_freshness
    trigger: "Evaluated for every CreditEvidence row whose referenced artifact changes state, and on evidence creation."
    algorithm: projection
    formula: |
      is_stale = true when the referenced artifact is NOT in its evidentiary state:
        EQUIPMENT_VERIFICATION -> EquipmentUnit(evidence_ref_id).verification_status
                                  NOT IN {PREFUNCTIONAL_VERIFIED, FUNCTIONAL_ACCEPTED,
                                          CONDITIONALLY_ACCEPTED}
        FUNCTIONAL_TEST        -> FunctionalTest(evidence_ref_id).status
                                  NOT IN {PASSED, PASSED_WITH_EXCEPTIONS}
        CHECKLIST              -> PrefunctionalChecklist(evidence_ref_id).status != VERIFIED
        TRAINING               -> CloseoutDeliverable(evidence_ref_id).status != ACCEPTED
        MANUAL_SECTION         -> CloseoutDeliverable(evidence_ref_id).status != ACCEPTED
        ENERGY_BASELINE        -> EnergyBaseline(evidence_ref_id).status != CERTIFIED
      staled_at is stamped with the current logical clock on each false -> true flip
      and is left untouched on a true -> false flip.
    input_set: "The single CreditEvidence row and the artifact its evidence_type/evidence_ref_id pair resolves to."
    constants: {}
    precision: "Boolean; no rounding"

  - name: training_coverage_ratio
    trigger: "POST /closeout-deliverables/{id}/deliver. Writes CloseoutDeliverable.coverage_ratio and gates the DELIVERED -> ACCEPTED transition."
    algorithm: threshold
    formula: |
      if required_attendee_count == 0:
          coverage_ratio = 1.0
      else:
          coverage_ratio = round_half_up(min(attendee_count / required_attendee_count, 1.0), 4)
      # Acceptance gate applies only when deliverable_kind == TRAINING_SESSION:
      accept_allowed = coverage_ratio >= TRAINING_COVERAGE_MIN
    input_set: "The single CloseoutDeliverable row."
    constants:
      TRAINING_COVERAGE_MIN: 0.80
    precision: "4 decimal places, round_half_up; the gate is inclusive, so exactly 0.80 is accepted"

  - name: witness_window_occupancy
    trigger: "POST /functional-tests and POST /functional-tests/{id}/schedule-retest, before the row is written."
    algorithm: interval_merge
    formula: |
      # CLOSED intervals, expanded by a mobilisation buffer on BOTH ends, counted
      # against a project-wide aggregate capacity. Touching endpoints DO collide.
      effective(t) = [ t.scheduled_start - MOBILIZATION_BUFFER_MINUTES minutes,
                       t.scheduled_end   + MOBILIZATION_BUFFER_MINUTES minutes ]   # inclusive both ends
      occupants    = FunctionalTest rows whose equipment belongs to the same CxProject
                     and whose status IN {SCHEDULED, IN_PROGRESS}
      colliding    = count of occupants o where effective(o) intersects effective(new)
                     using closed-interval semantics:
                        effective(o).start <= effective(new).end
                        AND effective(new).start <= effective(o).end
      reject with ERR_WITNESS_WINDOW_CONFLICT when colliding >= CxProject.witness_capacity
    input_set: "FunctionalTest rows of the same project with status IN {SCHEDULED, IN_PROGRESS}. PASSED, PASSED_WITH_EXCEPTIONS, FAILED and CANCELLED rows release their window."
    constants:
      MOBILIZATION_BUFFER_MINUTES: 60
    precision: "Second resolution; comparisons are inclusive on both ends, so a new window whose buffered start equals an occupant's buffered end collides."

  - name: seasonal_window_occupancy
    trigger: "POST /deferred-tests, before the row is written."
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [window_start, window_end), scoped to ONE EquipmentUnit,
      # with no buffer and a hard capacity of 1. Touching endpoints do NOT collide.
      occupants = DeferredTest rows with the same equipment_id and status IN {PLANNED, BLOCKED}
      collides  = exists an occupant o where
                     o.window_start < new.window_end AND new.window_start < o.window_end
      reject with ERR_SEASONAL_WINDOW_CONFLICT when collides
    input_set: "DeferredTest rows of the same EquipmentUnit with status IN {PLANNED, BLOCKED}. EXECUTED_PASS, EXECUTED_FAIL and MISSED rows release their window."
    constants:
      SEASONAL_CAPACITY_PER_EQUIPMENT: 1
    precision: "Second resolution; strictly half-open, so new.window_start == occupant.window_end is accepted."

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing row decides the response and no side effect runs)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list in the 1.5 table"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every id embedded in the request path resolves to a stored row, checked left to right"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_REQUIREMENT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_SUBMITTAL_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND | ERR_CHECKLIST_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_ISSUE_NOT_FOUND | ERR_DEFERRED_TEST_NOT_FOUND | ERR_DELIVERABLE_NOT_FOUND | ERR_CREDIT_NOT_FOUND | ERR_BASELINE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"

  - priority: 5
    category: business_constraint
    check: "Request body carries every required field with a well-formed type, every enum value is a declared member, every numeric field satisfies its declared constraint, every datetime parses as ISO 8601 UTC, and limit/offset are within the pagination bounds (limit 1..100, offset >= 0)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request body resolves to a stored row, checked in the field order declared by the endpoint's input list"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_REQUIREMENT_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND | ERR_ISSUE_NOT_FOUND | ERR_TEST_NOT_FOUND"
    http_status: 404
    applies_to: "POST /owner-requirements, POST /cx-plans, POST /submittals, POST /equipment-units, POST /prefunctional-checklists, POST /functional-tests, POST /issues, POST /deferred-tests, POST /closeout-deliverables, POST /certification-credits, POST /certification-credits/{id}/evidence, POST /energy-baselines, POST /issues/{id}/verify-closure"

  - priority: 7
    category: business_referential
    check: "Every entity referenced by the request resolves to the SAME CxProject as the primary resource (equipment, requirement, issue, retest, credit and deliverable must all share one project_id)"
    error_id: ERR_PROJECT_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /submittals, POST /prefunctional-checklists, POST /functional-tests, POST /issues, POST /deferred-tests, POST /closeout-deliverables, POST /certification-credits/{id}/evidence"

  - priority: 8
    category: state
    check: "expected_project_version equals the current CxProject.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /cx-plans, POST /certification-credits/{id}/submit"

  - priority: 9
    category: state
    check: "CxProject.readiness_posture != FROZEN"
    error_id: ERR_PROJECT_FROZEN
    http_status: 409
    applies_to: "POST /cx-projects/{id}/advance-phase, POST /cx-projects/{id}/issue-acceptance, POST /deferred-tests, POST /closeout-deliverables/{id}/accept, POST /certification-credits/{id}/submit"

  - priority: 10
    category: state
    check: "CxProject.delivery_phase permits the operation: advance-phase accepts only the single next phase in PLANNING -> DESIGN -> CONSTRUCTION -> FUNCTIONAL_TESTING -> ACCEPTANCE -> WARRANTY -> CLOSED; issue-acceptance requires delivery_phase == ACCEPTANCE; cx-plan approval requires delivery_phase IN {PLANNING, DESIGN}"
    error_id: ERR_PHASE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /cx-projects/{id}/advance-phase, POST /cx-projects/{id}/issue-acceptance, POST /cx-plans/{id}/approve"

  - priority: 11
    category: state
    check: "The target resource is in a status from which the requested transition is declared in the 1.2 table"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-changing action endpoint"

  - priority: 12
    category: state
    check: "The referenced EquipmentUnit is commissioning-ready: creating a NEW functional test requires verification_status == PREFUNCTIONAL_VERIFIED AND install_status == STARTED_UP; scheduling a retest and starting a test require install_status == STARTED_UP only, so a unit demoted to UNVERIFIED by the very failure being retested can still be retested; executing a checklist requires install_status IN {INSTALLED, STARTED_UP}"
    error_id: ERR_EQUIPMENT_NOT_READY
    http_status: 409
    applies_to: "POST /functional-tests, POST /functional-tests/{id}/schedule-retest, POST /functional-tests/{id}/start, POST /prefunctional-checklists/{id}/execute"

  - priority: 13
    category: state
    check: "The project's newest CxPlan (greatest created_at) has status == APPROVED"
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /functional-tests, POST /functional-tests/{id}/schedule-retest, POST /certification-credits/{id}/submit"

  - priority: 14
    category: state
    check: "The project's newest CxPlan has pin_stale == false"
    error_id: ERR_PLAN_PIN_STALE
    http_status: 409
    applies_to: "POST /certification-credits/{id}/submit"

  - priority: 15
    category: business_safety
    check: "The acting X-User-ID differs from the user id recorded on the preceding step: a checklist verifier may not be its executor, and a deliverable acceptor may not be its deliverer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /prefunctional-checklists/{id}/verify, POST /closeout-deliverables/{id}/accept"

  - priority: 16
    category: business_safety
    check: "Closing an Issue with origin == FUNCTIONAL and severity IN {S1, S2} requires closure_retest_id, and that FunctionalTest must have status == PASSED"
    error_id: ERR_RETEST_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /issues/{id}/verify-closure"

  - priority: 17
    category: business_safety
    check: "No checklist item with is_safety_critical == true has result == FAIL"
    error_id: ERR_SAFETY_ITEM_FAILED
    http_status: 422
    applies_to: "POST /prefunctional-checklists/{id}/verify"

  - priority: 18
    category: business_temporal
    check: "scheduled_end is strictly after scheduled_start, and window_end is strictly after window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /functional-tests, POST /functional-tests/{id}/schedule-retest, POST /deferred-tests"

  - priority: 19
    category: business_temporal
    check: "calculations.witness_window_occupancy finds fewer than CxProject.witness_capacity colliding occupants"
    error_id: ERR_WITNESS_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /functional-tests, POST /functional-tests/{id}/schedule-retest"

  - priority: 20
    category: business_temporal
    check: "calculations.seasonal_window_occupancy finds no colliding occupant on the same EquipmentUnit"
    error_id: ERR_SEASONAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /deferred-tests"

  - priority: 21
    category: business_temporal
    check: "The current logical clock satisfies window_start <= now < window_end"
    error_id: ERR_OUTSIDE_SEASONAL_WINDOW
    http_status: 409
    applies_to: "POST /deferred-tests/{id}/execute"

  - priority: 22
    category: business_referential
    check: "The supplied closure_retest_id names a FunctionalTest whose equipment_id equals the Issue's equipment_id"
    error_id: ERR_RETEST_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /issues/{id}/verify-closure"

  - priority: 23
    category: business_referential
    check: "requirement_id appears in the pinned_requirement_ids array of the project's newest APPROVED CxPlan"
    error_id: ERR_REQUIREMENT_NOT_PINNED
    http_status: 422
    applies_to: "POST /functional-tests, POST /deferred-tests"

  - priority: 24
    category: business_referential
    check: "evidence_ref_id resolves to a row of the entity family that evidence_type declares, and that row belongs to the credit's CxProject"
    error_id: ERR_EVIDENCE_REF_INVALID
    http_status: 422
    applies_to: "POST /certification-credits/{id}/evidence"

  - priority: 25
    category: business_constraint
    check: "The checklist carries at least one item (item_count >= 1)"
    error_id: ERR_CHECKLIST_EMPTY
    http_status: 422
    applies_to: "POST /prefunctional-checklists/{id}/execute"

  - priority: 26
    category: business_constraint
    check: "No checklist item is left with result == PENDING"
    error_id: ERR_CHECKLIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /prefunctional-checklists/{id}/execute"

  - priority: 27
    category: business_constraint
    check: "item_code is unique inside the checklist when adding an item, and names an existing item when recording a result"
    error_id: "ERR_DUPLICATE_ITEM_CODE | ERR_ITEM_NOT_FOUND"
    http_status: 422
    applies_to: "POST /prefunctional-checklists/{id}/items, POST /prefunctional-checklists/{id}/record-item"

  - priority: 28
    category: business_constraint
    check: "fresh_evidence_count >= required_evidence_count"
    error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /certification-credits/{id}/submit"

  - priority: 29
    category: business_constraint
    check: "For deliverable_kind == TRAINING_SESSION, coverage_ratio >= 0.80"
    error_id: ERR_TRAINING_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /closeout-deliverables/{id}/accept"

  - priority: 30
    category: business_constraint
    check: "Submittal.review_round is below MAX_REVIEW_ROUNDS (3)"
    error_id: ERR_REVIEW_ROUNDS_EXCEEDED
    http_status: 422
    applies_to: "POST /submittals/{id}/resubmit"

  - priority: 31
    category: business_constraint
    check: "CxProject.project_type == RETRO_COMMISSIONING"
    error_id: ERR_RETRO_ONLY
    http_status: 422
    applies_to: "POST /energy-baselines"

  - priority: 32
    category: business_constraint
    check: "The requested savings variant is permitted for the project's certification_target: ENHANCED accepts only MEASURED"
    error_id: ERR_VARIANT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /energy-baselines/{id}/certify-savings"

  - priority: 33
    category: business_fiscal
    check: "The resulting CxProject.retainage_withheld_cents does not exceed floor(CxProject.contract_value_cents * 0.10)"
    error_id: ERR_RETAINAGE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /issues"

  - priority: 34
    category: business_fiscal
    check: "The FINAL variant of acceptance_completion_score meets the floor for the requested certificate: SUBSTANTIAL needs >= 70.00, FINAL needs >= 95.00"
    error_id: ERR_ACCEPTANCE_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /cx-projects/{id}/issue-acceptance"

  - priority: 35
    category: business_fiscal
    check: "SUBSTANTIAL acceptance requires zero Issue rows with severity == S1 and status IN {OPEN, IN_REVIEW}; FINAL acceptance requires zero Issue rows with status IN {OPEN, IN_REVIEW, DEFERRED}"
    error_id: ERR_OPEN_BLOCKING_ISSUES
    http_status: 422
    applies_to: "POST /cx-projects/{id}/issue-acceptance"

# =============================================================================
# 1.5 API Endpoint Table
#   Flat topology: every collection is a top-level path. All GET query
#   parameters are optional. Path ids are never repeated in `input:`.
#   ALL_ROLES = [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
# =============================================================================
endpoints:

  # ------------------------------------------------------------- CxProject
  - method: POST
    path: "/cx-projects"
    description: "Open a commissioning engagement"
    roles: [PlatformAdmin]
    code: 201
    input: [name, building_name, project_type, contract_value_cents, "certification_target?", "witness_capacity?"]
    output: CxProject
    side_effects: ["delivery_phase = PLANNING, readiness_posture = OPEN, every computed roll-up initialised to 0"]

  - method: GET
    path: "/cx-projects/{id}"
    description: "Read one engagement, including its version for optimistic concurrency"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: []
    output: CxProject
    side_effects: []

  - method: GET
    path: "/cx-projects"
    description: "List engagements"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: ["project_type?", "delivery_phase?", "readiness_posture?", "limit?", "offset?"]
    output: "CxProject[]"
    side_effects: []

  - method: POST
    path: "/cx-projects/{id}/advance-phase"
    description: "Advance the engagement exactly one phase forward"
    roles: [CxAuthority]
    code: 200
    input: [target_phase]
    output: CxProject
    side_effects: ["sets delivery_phase", "increments CxProject.version by 1"]

  - method: POST
    path: "/cx-projects/{id}/issue-acceptance"
    description: "Issue a substantial or final acceptance certificate; computes and persists the FINAL variant of acceptance_completion_score"
    roles: [OwnerRepresentative]
    code: 200
    input: [acceptance_kind]
    output: CxProject
    side_effects: ["writes final_acceptance_score from the FINAL variant", "sets acceptance_kind", "increments CxProject.version by 1"]

  - method: GET
    path: "/cx-projects/{id}/readiness"
    description: "Computed read exposing both variants of acceptance_completion_score side by side, plus the posture inputs"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: []
    output: "{ readiness_posture: string, issue_severity_index: number, acceptance_completion_score_provisional: number, acceptance_completion_score_final: number, open_blocking_issue_count: integer, retainage_withheld_cents: integer, retainage_cap_cents: integer, verified_prefunctional_units: integer, total_weight_units: integer, withdrawn_credit_count: integer, total_awarded_points: number }"
    side_effects: []

  - method: POST
    path: "/cx-projects/{id}/run-seasonal-sweep"
    description: "Ops checkpoint: sweeps every DeferredTest of the project whose window_end is at or before the current logical clock into MISSED and opens a SEASONAL issue for each"
    roles: [CxAuthority]
    code: 200
    input: []
    output: CxProject
    side_effects: ["DeferredTest {PLANNED, BLOCKED} -> MISSED for expired windows", "creates one S2 SEASONAL Issue per swept row", "recomputes issue_severity_index and readiness_posture", "increments CxProject.version by 1"]

  # ------------------------------------------------------ OwnerRequirement
  - method: POST
    path: "/owner-requirements"
    description: "Add an Owner Project Requirement line"
    roles: [OwnerRepresentative]
    code: 201
    input: [project_id, metric_key, target_value, tolerance_pct, criticality]
    output: OwnerRequirement
    side_effects: ["status = DRAFT, revision = 1, supersedes_requirement_id = null"]

  - method: GET
    path: "/owner-requirements"
    description: "List OPR lines; filter by project, by predecessor (revision chain) or by status"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: ["project_id?", "supersedes_requirement_id?", "status?", "limit?", "offset?"]
    output: "OwnerRequirement[]"
    side_effects: []

  - method: GET
    path: "/owner-requirements/{id}"
    description: "Read one OPR line"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: []
    output: OwnerRequirement
    side_effects: []

  - method: POST
    path: "/owner-requirements/{id}/approve"
    description: "Owner approves an OPR line, making it eligible for plan pinning"
    roles: [OwnerRepresentative]
    code: 200
    input: []
    output: OwnerRequirement
    side_effects: ["status = APPROVED"]

  - method: POST
    path: "/owner-requirements/{id}/revise"
    description: "Supersede an approved OPR line with a new DRAFT revision"
    roles: [OwnerRepresentative]
    code: 201
    input: [target_value, tolerance_pct, criticality]
    output: OwnerRequirement
    side_effects: ["predecessor status = SUPERSEDED", "new row with revision + 1 and supersedes_requirement_id set", "every CxPlan pinning the predecessor gets pin_stale = true"]

  # ---------------------------------------------------------------- CxPlan
  - method: POST
    path: "/cx-plans"
