scaffold_corner_design:
  - section: entities
    instances:
      - name: create_contractor_account_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.ContractorAccount]
        distinguishing_aspect: "A minimal create returns 201 with status ACTIVE, tier STANDARD, all computed balances 0, and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Default Co", credit_limit_cents: 1000 }, as: CorporateAdmin, captures: { acct: "$.data.id" } }
          trigger:
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin }
          assert:
            - "status == ACTIVE, tier == STANDARD"
            - "outstanding_balance_cents == 0, loyalty_points_balance == 0, ytd_net_volume_cents == 0, lifetime_rebate_paid_cents == 0"
            - "version == 1 and id/created_at/updated_at present"

      - name: system_fields_not_writable_through_declared_surface
        claim_type: computed_field
        grounds: [entities.ContractorAccount.fields.tier, entities.ContractorAccount.fields.status]
        distinguishing_aspect: "tier and status are system-owned: no declared input field on create or PATCH can set them, so after a profile PATCH they remain STANDARD/ACTIVE while version advances."
        test_recipe:
          setup: ["one account at version 1"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Sneaky Co", credit_limit_cents: 1000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av: "$.data.version" } }
          trigger:
            - { call: "PATCH /contractor-accounts/${acct}", payload: { expected_contractor_account_version: "${av}", company_name: "Renamed Co" }, as: CorporateAdmin }
          assert:
            - "ContractorAccount.${acct}.company_name == \"Renamed Co\" while tier == STANDARD and status == ACTIVE (no writable path mutates system fields)"
            - "ContractorAccount.${acct}.version == 2"

      - name: get_missing_product_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: CorporateAdmin }
          assert: ["HTTP 404 with error_id ERR_NOT_FOUND"]

      - name: missing_required_field_returns_400
        claim_type: required_field
        grounds: ["errors[ERR_VALIDATION]", entities.Product.fields.sku]
        distinguishing_aspect: "POST /products without sku fails with 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /products", payload: { name: "No Sku", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
          assert: ["HTTP 400 with error_id ERR_VALIDATION"]

      - name: append_only_ledger_has_no_version
        claim_type: immutability
        grounds: [entities.LoyaltyTransaction, entities.ReturnRecord]
        distinguishing_aspect: "common_fields: false entities (LoyaltyTransaction, ReturnRecord) expose id and created_at but no version/updated_at, and no update endpoint exists for them."
        test_recipe:
          setup: ["account with a paid order of 4 units at 20000 so an EARN entry exists"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Led Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "WY-OPEN", name: "Wyoming" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-LED", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 20000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 4 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
          trigger:
            - { call: "GET /loyalty-transactions?contractor_account_id=${acct}", payload: {}, as: CorporateAdmin }
          assert:
            - "the EARN entry has id and created_at but no version and no updated_at"
            - "points_delta == 800 (floor(80000/100) * 1) and order_id == ${o1}"

      - name: product_list_pagination_defaults
        claim_type: listing_pagination
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor the fixed envelope: default limit 10 with has_more/total_count; explicit limit+offset pages through."
        test_recipe:
          setup: ["twelve products P-00 .. P-11"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-00", name: "N0", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-01", name: "N1", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-02", name: "N2", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-03", name: "N3", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-04", name: "N4", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-05", name: "N5", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-06", name: "N6", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-07", name: "N7", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-08", name: "N8", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-09", name: "N9", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-10", name: "N10", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
            - { call: "POST /products", payload: { sku: "P-11", name: "N11", category: "FLAT", voc_gpl: 100, list_price_cents: 100, tintable: false }, as: CorporateAdmin }
          trigger:
            - { call: "GET /products", payload: {}, as: CorporateAdmin }
            - { call: "GET /products?limit=5&offset=10", payload: {}, as: CorporateAdmin }
          assert:
            - "default page: response_type array, 10 items, total_count == 12, has_more == true"
            - "limit=5&offset=10 page: 2 items, total_count == 12, has_more == false"

  - section: state_machines
    instances:
      - name: order_initial_state_is_unpaid_pending
        claim_type: initial_state
        grounds: [state_machines.Order]
        distinguishing_aspect: "A new order starts UNPAID x PENDING with zero refunded_cents and null paid_at."
        test_recipe:
          setup: ["account, job, product"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Init Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "AK-OPEN", name: "Alaska" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-INIT", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
          assert:
            - "Order.${o1}.payment_status == UNPAID and fulfillment_status == PENDING"
            - "refunded_cents == 0 and paid_at == null; tier_snapshot == STANDARD"

      - name: abandoned_match_rejects_all_actions
        claim_type: terminal_lockdown
        grounds: [state_machines.ColorMatchRequest]
        distinguishing_aspect: "From terminal ABANDONED, proposals/approve/request-revision all fail with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["account, tintable product, one color match request abandoned from SUBMITTED"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Term Co", credit_limit_cents: 1000 }, as: CorporateAdmin, captures: { acct: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-TERM", name: "Base", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: true }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /color-match-requests", payload: { contractor_account_id: "${acct}", product_id: "${prod}", sample_reference: "S-9" }, as: StoreAssociate, captures: { cmr: "$.data.id" } }
            - { call: "POST /color-match-requests/${cmr}/abandon", payload: {}, as: StoreAssociate }
          trigger:
            - { call: "POST /color-match-requests/${cmr}/proposals", payload: { color_code: "SW 7009", name: "X", shots: [{ colorant_code: "B1", ounces_128ths: 8 }] }, as: StoreAssociate }
            - { call: "POST /color-match-requests/${cmr}/approve", payload: {}, as: Contractor, as_user_id: "${acct}" }
          assert:
            - "proposals on ABANDONED fails: HTTP 409 ERR_INVALID_STATE"
            - "approve on ABANDONED fails: HTTP 409 ERR_MATCH_NOT_REVIEWABLE (priority 17); ColorMatchRequest.${cmr}.status remains ABANDONED"

      - name: mark_delivered_before_dispatch_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Delivery.EN_ROUTE_to_DELIVERED, "validations[priority=14]"]
        distinguishing_aspect: "mark-delivered on a SCHEDULED (never dispatched) delivery fails with ERR_DELIVERY_NOT_EN_ROUTE."
        test_recipe:
          setup: ["paid order with a SCHEDULED delivery"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Inv Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "HI-OPEN", name: "Hawaii" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-INV", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /deliveries", payload: { order_id: "${o1}", job_account_id: "${job}", window_start: "2026-06-20T09:00:00Z", window_end: "2026-06-20T10:00:00Z" }, as: StoreManager, captures: { d1: "$.data.id" } }
          trigger:
            - { call: "POST /deliveries/${d1}/mark-delivered", payload: {}, as: StoreManager }
          assert: ["HTTP 409 ERR_DELIVERY_NOT_EN_ROUTE; Delivery.${d1}.status remains SCHEDULED"]

      - name: job_complete_blocked_then_allowed
        claim_type: precondition_enforcement
        grounds: [state_machines.JobAccount.OPEN_to_COMPLETE]
        distinguishing_aspect: "complete fails while the job has a PENDING order; cancelling the order clears the gate and completion succeeds."
        test_recipe:
          setup: ["job with one UNPAID PENDING order"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Gate Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "ME-OPEN", name: "Maine" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-GATE", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /job-accounts/${job}/complete", payload: {}, as: StoreManager }
            - { call: "POST /orders/${o1}/cancel", payload: {}, as: StoreAssociate }
            - { call: "POST /job-accounts/${job}/complete", payload: {}, as: StoreManager }
          assert:
            - "first complete: HTTP 409 ERR_INVALID_STATE (PENDING order blocks)"
            - "after cancel: complete succeeds and JobAccount.${job}.status == COMPLETE"

      - name: formula_revision_supersedes_prior
        claim_type: side_effect_execution
        grounds: [state_machines.TintFormula.ACTIVE_to_RETIRED, entities.TintFormula.fields.revision, entities.TintFormula.fields.supersedes_formula_id]
        distinguishing_aspect: "Creating a second formula for the same (product_id, color_code) retires the first and records the supersedes link with revision 2."
        test_recipe:
          setup: ["tintable product"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-SUP", name: "Base", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: true }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /tint-formulas", payload: { product_id: "${prod}", color_code: "SW 3000", name: "V1", shots: [{ colorant_code: "R1", ounces_128ths: 8 }] }, as: CorporateAdmin, captures: { f1: "$.data.id" } }
          trigger:
            - { call: "POST /tint-formulas", payload: { product_id: "${prod}", color_code: "SW 3000", name: "V2", shots: [{ colorant_code: "R1", ounces_128ths: 12 }] }, as: CorporateAdmin, captures: { f2: "$.data.id" } }
          assert:
            - "TintFormula.${f1}.status == RETIRED; TintFormula.${f2}.status == ACTIVE, revision == 2, supersedes_formula_id == ${f1}, source == LIBRARY"

      - name: second_approval_supersedes_first_sheet
        claim_type: side_effect_execution
        grounds: [state_machines.SpecSheet.APPROVED_to_SUPERSEDED, entities.SpecSheet.fields.supersedes_spec_sheet_id]
        distinguishing_aspect: "Approving a second sheet for the same project_code supersedes the previously APPROVED one; the new sheet records the link."
        test_recipe:
          setup: ["product; two sheets for project PRJ-SS, both submitted"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-SS", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /spec-sheets", payload: { project_code: "PRJ-SS", architect_name: "A", title: "V1", lines: [{ product_id: "${prod}", specified_qty: 5 }] }, as: SpecWriter, captures: { s1: "$.data.id" } }
            - { call: "POST /spec-sheets/${s1}/submit", payload: {}, as: SpecWriter }
            - { call: "POST /spec-sheets", payload: { project_code: "PRJ-SS", architect_name: "A", title: "V2", lines: [{ product_id: "${prod}", specified_qty: 7 }] }, as: SpecWriter, captures: { s2: "$.data.id" } }
            - { call: "POST /spec-sheets/${s2}/submit", payload: {}, as: SpecWriter }
            - { call: "POST /spec-sheets/${s1}/approve", payload: {}, as: CorporateAdmin }
          trigger:
            - { call: "POST /spec-sheets/${s2}/approve", payload: {}, as: CorporateAdmin }
          assert:
            - "SpecSheet.${s1}.status == SUPERSEDED; SpecSheet.${s2}.status == APPROVED and supersedes_spec_sheet_id == ${s1}"

      - name: written_off_mistint_cannot_be_sold
        claim_type: terminal_lockdown
        grounds: [state_machines.MistintListing]
        distinguishing_aspect: "WRITTEN_OFF is terminal: mark-sold afterwards fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["one LISTED mistint listing"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-MT", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: true }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /mistint-listings", payload: { product_id: "${prod}", quantity: 2, cost_basis_cents: 4000 }, as: StoreAssociate, captures: { m1: "$.data.id" } }
            - { call: "POST /mistint-listings/${m1}/write-off", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /mistint-listings/${m1}/mark-sold", payload: {}, as: StoreAssociate }
          assert: ["HTTP 409 ERR_INVALID_STATE; MistintListing.${m1}.status remains WRITTEN_OFF"]

  - section: calculations
    instances:
      - name: quantity_break_starts_at_ten
        claim_type: boundary_edge
        grounds:
          - calculations.line_pricing
          - entities.OrderLine.fields.unit_price_cents
        distinguishing_aspect: "QTY_BREAK_MIN is inclusive: quantity 9 pays full STANDARD price (unit 1000); quantity 10 gets the 3% break (unit 970, line 9700)."
        test_recipe:
          setup: ["STANDARD account; product list 1000"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Qty Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "KS-OPEN", name: "Kansas" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-QTY", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 1000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 9 }] }, as: StoreAssociate, captures: { o9: "$.data.id" } }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin, captures: { av1: "$.data.version" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av1}", lines: [{ product_id: "${prod}", quantity: 10 }] }, as: StoreAssociate, captures: { o10: "$.data.id" } }
          assert:
            - "Order.${o9}.subtotal_cents == 9000 (no break below 10)"
            - "Order.${o10}.subtotal_cents == 9700 (unit round_half_up(1000 * 0.97) == 970; quantity exactly 10 triggers the break)"

      - name: tax_rounds_half_up_at_half_cent
        claim_type: precision
        grounds:
          - calculations.order_totals
        distinguishing_aspect: "TAX_RATE_BPS 825 on a 200-cent subtotal yields exactly 16.5 cents; round_half_up gives 17 (round-half-even would give 16), making the rounding mode observable."
        test_recipe:
          setup: ["STANDARD account; product list 200"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Tax Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "MO-OPEN", name: "Missouri" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-TAX", name: "Sample", category: "FLAT", voc_gpl: 100, list_price_cents: 200, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
          assert:
            - "Order.${o1}.tax_cents == 17 (round_half_up(200 * 825 / 10000) == round_half_up(16.5))"
            - "Order.${o1}.total_cents == 217"

      - name: mistint_decay_floor_binds_after_twenty_weeks
        claim_type: boundary_edge
        grounds:
          - calculations.mistint_price
          - entities.MistintListing.fields.current_price_cents
          - entities.MistintListing.fields.sold_price_cents
        distinguishing_aspect: "Decay floor: cost_basis 10000 lists at 5000; after 20 started weeks the 0.9^weeks decay (608) falls below the 25% floor (2500), so the sale price is the floor 2500."
        test_recipe:
          setup: ["mistint listing created at default clock 2026-05-01 with cost_basis_cents 10000"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-DEC", name: "Base", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: true }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /mistint-listings", payload: { product_id: "${prod}", quantity: 1, cost_basis_cents: 10000 }, as: StoreAssociate, captures: { m1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-18T00:00:00Z" }, as: CorporateAdmin }
          trigger:
            - { call: "POST /mistint-listings/${m1}/mark-sold", payload: {}, as: StoreAssociate }
          assert:
            - "MistintListing.${m1}.sold_price_cents == 2500 (floor round_half_up(10000 * 0.25) binds over decayed 608 == round_half_up(5000 * 0.9^20))"
            - "MistintListing.${m1}.status == SOLD"

      - name: loyalty_redeem_posts_negative_delta
        claim_type: correct_result
        grounds:
          - calculations.loyalty_accrual
          - entities.LoyaltyTransaction.fields.points_delta
          - validations[priority=41]
        distinguishing_aspect: "Redeeming 300 of an 800-point balance posts REDEEM -300 and leaves balance 500; redeeming more than the balance fails."
        test_recipe:
          setup: ["STANDARD account with 800 points from a paid 4x20000 order"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Red Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "VT-OPEN", name: "Vermont" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-RED", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 20000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 4 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
          trigger:
            - { call: "POST /loyalty-redemptions", payload: { contractor_account_id: "${acct}", points_to_redeem: 300 }, as: Contractor, as_user_id: "${acct}" }
            - { call: "POST /loyalty-redemptions", payload: { contractor_account_id: "${acct}", points_to_redeem: 501 }, as: Contractor, as_user_id: "${acct}" }
          assert:
            - "first redemption succeeds; ContractorAccount.${acct}.loyalty_points_balance == 500"
            - "second redemption fails: HTTP 422 ERR_INSUFFICIENT_POINTS (501 > 500)"

      - name: platinum_tier_earns_five_x_points
        claim_type: constants_applied
        grounds:
          - calculations.tier_evaluation
          - calculations.loyalty_accrual
        distinguishing_aspect: "PLATINUM_MIN_CENTS 40000000 crossing flips tier, and the next paid order earns at multiplier 5: subtotal 10000 yields 500 points."
        test_recipe:
          setup: ["account with one paid 40000000-subtotal order, tier evaluated to PLATINUM"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Plat Co", credit_limit_cents: 1000000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "FL-OPEN", name: "Florida" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-PLAT", name: "Drum", category: "FLAT", voc_gpl: 100, list_price_cents: 40000000, tintable: false }, as: CorporateAdmin, captures: { p_big: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-SM", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 10000, tintable: false }, as: CorporateAdmin, captures: { p_sm: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${p_big}", quantity: 1 }] }, as: StoreAssociate, captures: { o0: "$.data.id" } }
            - { call: "POST /orders/${o0}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /contractor-accounts/${acct}/evaluate-tier", payload: {}, as: CorporateAdmin }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin, captures: { av1: "$.data.version" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av1}", lines: [{ product_id: "${p_sm}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
          assert:
            - "ContractorAccount.${acct}.tier == PLATINUM (V == 40000000 meets >= PLATINUM_MIN_CENTS)"
            - "Order.${o1}.tier_snapshot == PLATINUM and the EARN entry posts points_delta == 500 (floor(10000/100) * 5)"
            - "ContractorAccount.${acct}.loyalty_points_balance == 400500 (400000 from the first order at STANDARD mult 1, plus 500)"

      - name: rebate_provisional_projection_math
        claim_type: variant_divergence
        grounds:
          - calculations.rebate_provisional
        excluded_because:
          difficulty_instance: rebate_provisional_vs_final_divergence
          rationale: "Provisional projection/proration asserted with literal 174065 in the named section 1.8 instance."

      - name: bulletin_cascade_chain_coverage
        claim_type: cascade_chain
        grounds:
          - state_machines.ProductBulletin.PUBLISHED_to_EFFECTIVE
        excluded_because:
          difficulty_instance: bulletin_effect_discontinuation_chain
          rationale: "Full hop-by-hop cascade asserted in the named section 1.8 instance."

      - name: return_clawback_chain_coverage
        claim_type: cascade_chain
        grounds:
          - state_machines.Order.PAID_to_PARTIALLY_REFUNDED
        excluded_because:
          difficulty_instance: return_refund_loyalty_clawback_chain
          rationale: "Refund recompute plus loyalty clawback plus job-spent reconciliation asserted in the named section 1.8 instance."

  - section: validations
    instances:
      - name: credit_limit_exact_fit_passes
        claim_type: boundary_edge
        grounds:
          - validations[priority=39]
        distinguishing_aspect: "The credit check is inclusive: outstanding + new total exactly equal to credit_limit_cents passes; one cent more fails."
        test_recipe:
          setup: ["account with credit_limit_cents 43300; product list 40000 (order total exactly 43300)"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Fit Co", credit_limit_cents: 43300 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "OK-OPEN", name: "Oklahoma" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-FIT", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 40000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin, captures: { av1: "$.data.version" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av1}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate }
          assert:
            - "first order succeeds (43300 <= 43300 exactly fits)"
            - "second order fails: HTTP 422 ERR_CREDIT_LIMIT_EXCEEDED (43300 + 43300 = 86600 > 43300)"

      - name: budget_cap_null_vs_set
        claim_type: conditional_validation
        grounds:
          - validations[priority=40]
          - entities.JobAccount.fields.budget_cap_cents
        distinguishing_aspect: "A job with budget_cap_cents null accepts any order; a job capped at 10000 rejects an order totaling 10825."
        test_recipe:
          setup: ["account with two jobs: J1 uncapped, J2 capped at 10000; product list 5000"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Bud Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "AR-OPEN", name: "Arkansas" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Free", site_address: "1 Ln" }, as: StoreAssociate, captures: { j1: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Capped", site_address: "2 Ln", budget_cap_cents: 10000 }, as: StoreAssociate, captures: { j2: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-BUD", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${j1}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 2 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin, captures: { av1: "$.data.version" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${j2}", expected_contractor_account_version: "${av1}", lines: [{ product_id: "${prod}", quantity: 2 }] }, as: StoreAssociate }
          assert:
            - "order on uncapped job succeeds (total 10825)"
            - "identical order on capped job fails: HTTP 422 ERR_BUDGET_CAP_EXCEEDED (0 + 10825 > 10000)"

      - name: custom_tint_line_never_returnable
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - entities.OrderLine.fields.is_custom_tint
        distinguishing_aspect: "A line with formula_id (custom tint) is rejected for return even when the order is PAID and quantity remains."
        test_recipe:
          setup: ["paid order with one custom-tint line (tintable product plus ACTIVE formula)"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Tint Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "RI-OPEN", name: "Rhode Island" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-TINT", name: "Base", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: true }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /tint-formulas", payload: { product_id: "${prod}", color_code: "SW 4000", name: "Custom", shots: [{ colorant_code: "B1", ounces_128ths: 8 }] }, as: CorporateAdmin, captures: { frm: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1, formula_id: "${frm}" }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "GET /order-lines?order_id=${o1}", payload: {}, as: StoreAssociate, captures: { ln: "$.data[0].id" } }
          trigger:
            - { call: "POST /order-lines/${ln}/return", payload: { quantity: 1 }, as: StoreAssociate }
          assert:
            - "HTTP 422 ERR_CUSTOM_TINT_NO_RETURN; OrderLine.${ln}.is_custom_tint == true and returned_quantity stays 0"

      - name: return_cannot_exceed_remaining_quantity
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
        distinguishing_aspect: "Line with quantity 3: returning 2 succeeds, returning 2 more exceeds the remaining 1 and fails."
        test_recipe:
          setup: ["paid order, stock line qty 3"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "QtyR Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "DE-OPEN", name: "Delaware" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-QR", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 3 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "GET /order-lines?order_id=${o1}", payload: {}, as: StoreAssociate, captures: { ln: "$.data[0].id" } }
            - { call: "POST /order-lines/${ln}/return", payload: { quantity: 2 }, as: StoreAssociate }
          trigger:
            - { call: "POST /order-lines/${ln}/return", payload: { quantity: 2 }, as: StoreAssociate }
          assert:
            - "first return of 2 succeeds (returned_quantity == 2)"
            - "second return of 2 fails: HTTP 422 ERR_RETURN_QUANTITY_EXCEEDED (remaining == 1)"

      - name: spec_attribution_requires_approved_sheet
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=36]
        distinguishing_aspect: "An order line may reference a spec line only while its sheet is APPROVED; referencing a DRAFT sheet's line fails even when the product matches."
        test_recipe:
          setup: ["product; DRAFT spec sheet with one line for that product"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Attr Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "NH-OPEN", name: "New Hampshire" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-ATTR", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /spec-sheets", payload: { project_code: "PRJ-DR", architect_name: "A", title: "Draft", lines: [{ product_id: "${prod}", specified_qty: 5 }] }, as: SpecWriter, captures: { sheet: "$.data.id" } }
            - { call: "GET /spec-lines?spec_sheet_id=${sheet}", payload: {}, as: SpecWriter, captures: { sline: "$.data[0].id" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1, spec_line_id: "${sline}" }] }, as: StoreAssociate }
          assert: ["HTTP 422 ERR_SPEC_LINE_PRODUCT_MISMATCH (sheet is DRAFT, not APPROVED)"]

      - name: past_delivery_window_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=20]
        distinguishing_aspect: "With the default logical clock at 2026-05-01, a window starting 2026-04-01 is in the past and rejected."
        test_recipe:
          setup: ["account, job, one order (unpaid is sufficient for scheduling)"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Past Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "IA-OPEN", name: "Iowa" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "J", site_address: "1 Ln" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-PAST", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /deliveries", payload: { order_id: "${o1}", job_account_id: "${job}", window_start: "2026-04-01T09:00:00Z", window_end: "2026-04-01T10:00:00Z" }, as: StoreManager }
          assert: ["HTTP 422 ERR_DELIVERY_WINDOW_PAST"]

      - name: rebate_period_overlap_and_adjacency
        claim_type: temporal_validation
        grounds:
          - validations[priority=25]
        distinguishing_aspect: "Statement periods for one account are half-open: Q2 followed by Q3 (starts exactly at Q2's end) is allowed; an overlapping June window is rejected."
        test_recipe:
          setup: ["account; one statement for [2026-04-01, 2026-07-01) generated at clock 2026-07-05"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-05T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /contractor-accounts", payload: { company_name: "Per Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id" } }
            - { call: "POST /rebate-statements", payload: { contractor_account_id: "${acct}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: CorporateAdmin, captures: { s_q2: "$.data.id" } }
          trigger:
            - { call: "POST /rebate-statements", payload: { contractor_account_id: "${acct}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /rebate-statements", payload: { contractor_account_id: "${acct}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }, as: CorporateAdmin, captures: { s_q3: "$.data.id" } }
          assert:
            - "overlapping June window: HTTP 409 ERR_REBATE_PERIOD_OVERLAP"
            - "adjacent Q3 window (starts at Q2's period_end): HTTP 201 — half-open adjacency allowed"

      - name: bulletin_take_effect_before_effective_date
        claim_type: temporal_validation
        grounds:
          - validations[priority=23]
        distinguishing_aspect: "take-effect before effective_date fails; after the clock reaches the date it succeeds — scheduled/deferred activation."
        test_recipe:
          setup: ["published bulletin effective 2026-06-01; clock still at default 2026-05-01"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-BEF", name: "Old", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { p_old: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-AFT", name: "New", category: "FLAT", voc_gpl: 110, list_price_cents: 5500, tintable: false }, as: CorporateAdmin, captures: { p_new: "$.data.id" } }
            - { call: "POST /product-bulletins", payload: { product_id: "${p_old}", replacement_product_id: "${p_new}", title: "B", effective_date: "2026-06-01T00:00:00Z" }, as: CorporateAdmin, captures: { bul: "$.data.id" } }
            - { call: "POST /product-bulletins/${bul}/publish", payload: {}, as: CorporateAdmin }
          trigger:
            - { call: "POST /product-bulletins/${bul}/take-effect", payload: {}, as: CorporateAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /product-bulletins/${bul}/take-effect", payload: {}, as: CorporateAdmin }
          assert:
            - "first take-effect: HTTP 422 ERR_BULLETIN_NOT_YET_EFFECTIVE (clock 2026-05-01 < effective_date)"
            - "after clock reaches 2026-06-01: take-effect succeeds and bulletin status == EFFECTIVE"

      - name: contractor_cannot_act_on_other_account
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: "Contractor A's X-User-ID used against contractor B's order is refused with 403 before any state check runs."
        test_recipe:
          setup: ["two accounts; one unpaid order belonging to account B"]
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "A Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acctA: "$.data.id" } }
            - { call: "POST /contractor-accounts", payload: { company_name: "B Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acctB: "$.data.id", avB: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "MS-OPEN", name: "Mississippi" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acctB}", jurisdiction_id: "${jur}", job_name: "JB", site_address: "1 Ln" }, as: StoreAssociate, captures: { jobB: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-OWN", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acctB}", job_account_id: "${jobB}", expected_contractor_account_version: "${avB}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { oB: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${oB}/pay", payload: {}, as: Contractor, as_user_id: "${acctA}" }
          assert: ["HTTP 403 ERR_NOT_RESOURCE_OWNER; Order.${oB}.payment_status remains UNPAID"]

      - name: rebate_generate_before_period_start_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=24]
        distinguishing_aspect: "A statement for a future period cannot be opened: clock 2026-03-15 with period_start 2026-04-01 fails."
        test_recipe:
          setup: ["account; clock set to 2026-03-15"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-15T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /contractor-accounts", payload: { company_name: "Fut Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: "$.data.id" } }
          trigger:
            - { call: "POST /rebate-statements", payload: { contractor_account_id: "${acct}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: CorporateAdmin }
          assert: ["HTTP 422 ERR_REBATE_PERIOD_INVALID"]

  - section: endpoints
    instances:
