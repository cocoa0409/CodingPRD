      - name: two_identical_reads_of_a_derived_payload_return_the_same_values_and_advance_nothing
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[GET /athletics/point-recalculations/{id}/retention-analysis]
          - calculations.donor_retention_analysis.formula
        distinguishing_aspect: |
          Under an immediate model a derived read is a pure function of stored
          state, so calling it twice with no intervening write must return
          identical values AND leave every version untouched. This is the
          falsifying test for an implementation that materialises the analysis on
          first access — such an implementation typically bumps a version, or
          returns different numbers on the first and second call. The chosen data
          set makes the two divisors distinct: the risk denominator is
          max(1, retained + lapsed_risk) == max(1, 0) == 1 while the average
          divisor is max(1, donors_processed_count) == 2, so a single shared
          divisor cannot produce both 0.0000 and 20.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Two donors, each with exactly ONE RECEIVED ATHLETICS_ANNUAL gift dated 2026-03-01 — 2000000 cents and 1000000 cents — so both have consecutive_giving_years 1 and neither is retained (streak below RETENTION_STREAK_FLOOR 2) nor at lapsed risk (streak is not 0)."
            - "One cycle-2026 recalculation driven all the way to CERTIFIED, because retention analysis is refused on anything less."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Pur Pure", email: "pur.pure@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { pur_id: "$.data.id" }
            - call: "POST /athletics/donors/${pur_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 2000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Fun Function", email: "fun.function@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { fun_id: "$.data.id" }
            - call: "POST /athletics/donors/${fun_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { purr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${purr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${purr_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-recalculations/${purr_id}"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
              captures: { purr_v: "$.data.version" }
            - call: "POST /athletics/point-recalculations/${purr_id}/certify"
              payload: { expected_recalculation_version: "${purr_v}" }
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "GET /athletics/point-recalculations/${purr_id}"
              payload: {}
