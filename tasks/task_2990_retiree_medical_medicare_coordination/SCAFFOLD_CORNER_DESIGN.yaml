        excluded_because:
          difficulty_instance: compensating_invariant / claim_pay_then_reverse_restores_hra_ledger
          rationale: "That instance follows the provisional-to-final delta through pay and reversal and asserts every bucket returns to its starting value."

      - name: coverage_interval_merge_treats_adjacent_intervals_as_disjoint
        claim_type: interval_merge
        grounds:
