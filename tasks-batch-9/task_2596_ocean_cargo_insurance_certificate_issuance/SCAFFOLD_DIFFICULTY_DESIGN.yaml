            - "GET /survey-orders?surveyor_id=${surveyor_id} returns total_count == 2"

      - name: discharge_port_half_open_storage_window_adjacency
        resource_entity: Port
        interval_semantics: "HALF-OPEN interval [window_start_at, window_end_at) with an aggregate money capacity; a window starting exactly when another ends does not accumulate"
        grounds:
          - calculations.accumulation_exposure_check
          - calculations.accumulation_exposure_check.constants.PORT_WINDOW_SEMANTICS
          - calculations.transit_termination_instant
          - entities.AccumulationEntry.fields.window_end_at
        distinguishing_aspect: |
          A different resource entity (a Port's aggregate exposure capacity, not
          a person's calendar) and the opposite adjacency rule: the storage
          window is HALF-OPEN, so CERT-K discharging on 2026-10-05 — exactly
          when CERT-A's window [2026-09-05, 2026-10-05) closes — does not
          accumulate with it and is issued even though the port limit is only
          1155000.00. Moving the same shipment one day earlier
          (discharge 2026-10-04) makes the windows overlap, the exposure becomes
          2310000.00 and the issue is rejected with
          ERR_PORT_ACCUMULATION_EXCEEDED. There is also no buffer: adjacency is
          decided on the raw instants, unlike the surveyor rule.
        test_recipe:
          setup:
            - "discharge port NLRTM with port_accumulation_limit_amount 1155000 and storage_free_days 30, so any accumulation at all breaches"
